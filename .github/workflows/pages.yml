# Builds the reader and publishes dist/ (bundle + data/ + samples) to GitHub Pages
# at https://allan-valin.github.io/casus/ on every push to main. Casus Asia and Casus World build from this same code
# in their own repos (deploy/site-pages.yml, tools/setup_site_repo.sh).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch this site's dictionary indexes from the data release
        run: bash tools/fetch_data_assets.sh $(node tools/site_languages.mjs casus)
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npm run build
        env:
          CASUS_BASE: /casus/
          VITE_CASUS_SITE: casus
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
