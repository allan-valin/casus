steps:
- type: narrator
  text:
    en: Saturday morning, a café in Yeonnam-dong with Minjun. Iced americano, even in winter. Listen to the conversation; you don't need to understand it yet.
    pt: Sábado de manhã, um café em Yeonnam-dong com o Minjun. Americano gelado, até no inverno. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: minjun
    text: 형, 뭐 마실래요?
    meaning:
      en: Hyung, what will you drink?
      pt: Hyung, o que você vai beber?
  - speaker: protagonist
    text: 따뜻한 커피 마시고 싶어요. 추워요.
    meaning:
      en: I want a hot coffee. It's cold.
      pt: Quero um café quente. Está frio.
  - speaker: minjun
    text: 저는 아이스 아메리카노요.
    meaning:
      en: I'll have an iced americano.
      pt: Eu, um americano gelado.
  - speaker: protagonist
    text: 겨울인데 차가운 커피요?
    meaning:
      en: Cold coffee, in winter?
      pt: Café gelado no inverno?
  - speaker: minjun
    text: 네! 한국에서는 '얼죽아'예요. 얼어 죽어도 아이스 아메리카노!
    meaning:
      en: 'Yes! In Korea it''s ''eoljuga'': iced americano even if you freeze to death!'
      pt: 'Sim! Na Coreia é ''얼죽아'': americano gelado nem que morra congelado!'
  - speaker: protagonist
    text: 하하. 그럼 아메리카노 두 잔 주세요. 빵도 먹고 싶어요.
    meaning:
      en: Haha. Then two americanos, please. I want a pastry too.
      pt: Haha. Então dois americanos, por favor. Quero um doce também.
  - speaker: minjun
    text: 오늘은 집에서 쉬고 싶어요. 포장해요?
    meaning:
      en: Today I want to rest at home. Shall we get it to go?
      pt: Hoje quero descansar em casa. Vamos levar?
  - speaker: protagonist
    text: 네, 포장해 주세요. 다 해서 얼마예요?
    meaning:
      en: Yes, to go, please. How much is it all together?
      pt: Sim, para viagem, por favor. Quanto dá tudo?
