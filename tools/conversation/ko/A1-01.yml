- type: narrator
  text:
    en: You have just arrived at the building in Mapo, Seoul. The landlady, Mrs Park, about seventy, opens the door. Listen to the conversation; you don't need to understand it yet.
    pt: Você acabou de chegar ao prédio em Mapo, Seul. A dona, a senhora Park, de uns setenta anos, abre a porta. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 안녕하세요!
    meaning:
      en: Hello!
      pt: Olá!
  - speaker: park
    text: 네, 안녕하세요. 브라질 사람이에요?
    meaning:
      en: Yes, hello. Are you the Brazilian?
      pt: Sim, olá. Você é a brasileira?
  - speaker: protagonist
    text: 네, 브라질 사람이에요. 처음 뵙겠습니다.
    meaning:
      en: Yes, I'm Brazilian. Nice to meet you.
      pt: Sim, sou brasileira. Muito prazer.
  - speaker: park
    text: 반가워요. 저는 박순자예요.
    meaning:
      en: Glad to meet you. I'm Park Sunja.
      pt: Prazer. Eu sou Park Sunja.
  - speaker: protagonist
    text: 반가워요, 할머니.
    meaning:
      en: Glad to meet you, grandma.
      pt: Prazer, vovó.
  - speaker: park
    text: 들어오세요.
    meaning:
      en: Come in.
      pt: Entre.
  - speaker: protagonist
    text: 감사합니다!
    meaning:
      en: Thank you!
      pt: Obrigada!
