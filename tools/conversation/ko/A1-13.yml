steps:
- type: narrator
  text:
    en: Your first ride on line 2. At the station you top up a T-money card and ask a passer-by where to change. Listen to the conversation; you don't need to understand it yet.
    pt: Sua primeira viagem na linha 2. Na estação você recarrega o cartão T-money e pergunta a alguém onde fazer baldeação. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 실례합니다. 교통카드 충전해 주세요.
    meaning:
      en: Excuse me. Please top up my transport card.
      pt: Com licença. Recarregue meu cartão, por favor.
  - speaker: passerby
    text: 충전은 저기 기계에서 해요.
    meaning:
      en: You top it up at the machine over there.
      pt: A recarga é na máquina ali.
  - speaker: protagonist
    text: 아, 감사합니다. 홍대입구에 어떻게 가요?
    meaning:
      en: Oh, thank you. How do I get to Hongik University?
      pt: Ah, obrigada. Como eu chego a Hongik?
  - speaker: passerby
    text: 여기서 이 호선을 타세요.
    meaning:
      en: Take line 2 from here.
      pt: Pegue a linha 2 daqui.
  - speaker: protagonist
    text: 갈아타요?
    meaning:
      en: Do I change?
      pt: Preciso fazer baldeação?
  - speaker: passerby
    text: 아니요, 안 갈아타요. 홍대입구에서 내려요.
    meaning:
      en: No, you don't change. You get off at Hongik University.
      pt: Não, não precisa. Você desce em Hongik.
  - speaker: protagonist
    text: 다음 역이에요?
    meaning:
      en: Is it the next station?
      pt: É a próxima estação?
  - speaker: passerby
    text: 아니요, 세 정거장 가요.
    meaning:
      en: No, three stops.
      pt: Não, são três paradas.
