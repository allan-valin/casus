steps:
- type: narrator
  text:
    en: 'A long weekend: the KTX to Busan with Minjun. Haeundae beach, the fish market, raw fish for the first time. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Feriado prolongado: o KTX para Busan com o Minjun. A praia de Haeundae, o mercado de peixe, peixe cru pela primeira vez. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: minjun
    text: 형, KTX 표 예매했어. 내일 아침 일곱 시야.
    meaning:
      en: Hyung, I booked the KTX tickets. Tomorrow, seven in the morning.
      pt: Hyung, comprei as passagens do KTX. Amanhã, sete da manhã.
  - speaker: protagonist
    text: 고마워! 부산까지 얼마나 걸려?
    meaning:
      en: Thanks! How long to Busan?
      pt: Valeu! Quanto tempo até Busan?
  - speaker: minjun
    text: 세 시간도 안 걸려. 기차가 정말 빨라.
    meaning:
      en: Not even three hours. The train is really fast.
      pt: Não leva nem três horas. O trem é muito rápido.
  - speaker: protagonist
    text: 부산에서 뭐 할 거야?
    meaning:
      en: What will we do in Busan?
      pt: O que a gente vai fazer em Busan?
  - speaker: minjun
    text: 해운대 해변에 가거나 자갈치 시장에 갈 거야.
    meaning:
      en: We'll go to Haeundae beach or the Jagalchi market.
      pt: Vamos à praia de Haeundae ou ao mercado de Jagalchi.
  - speaker: protagonist
    text: 시장에서 회 먹을 거야? 나는 회 처음이야.
    meaning:
      en: Will we eat raw fish at the market? It's my first time.
      pt: Vamos comer peixe cru no mercado? É minha primeira vez.
  - speaker: minjun
    text: 응! 그리고 부산 사람들은 사투리를 써. 재미있을 거야.
    meaning:
      en: Yeah! And people in Busan speak dialect. It'll be fun.
      pt: É! E o pessoal de Busan fala com sotaque. Vai ser divertido.
  - speaker: protagonist
    text: 좌석은 창가로 해 줘. 바다 볼 거야!
    meaning:
      en: Get me a window seat. I'm going to watch the sea!
      pt: Pega janela para mim. Vou ver o mar!
