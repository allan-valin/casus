steps:
- type: narrator
  text:
    en: 'A tent bar (포장마차) at night with Seoyeon: tteokbokki, fish cakes, and very spicy sauce. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Uma barraca (포장마차) à noite com a Seoyeon: 떡볶이, bolinho de peixe e um molho bem apimentado. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: seoyeon
    text: 언니, 여기가 포장마차예요. 떡볶이 먹어 봐요!
    meaning:
      en: Unni, this is a pojangmacha. Try the tteokbokki!
      pt: Unni, isto é um 포장마차. Prova o 떡볶이!
  - speaker: protagonist
    text: 와, 빨개요! 매워요?
    meaning:
      en: Wow, it's red! Is it spicy?
      pt: Nossa, que vermelho! É apimentado?
  - speaker: seoyeon
    text: 달고 매워요. 어묵 국물이랑 같이 먹으면 괜찮아요.
    meaning:
      en: Sweet and spicy. With fish-cake broth it's fine.
      pt: Doce e apimentado. Com o caldo do 어묵 fica tranquilo.
  - speaker: protagonist
    text: 음… 아, 너무 매워! 물 주세요!
    meaning:
      en: Mm… ah, too spicy! Water, please!
      pt: Hum… ai, apimentado demais! Água, por favor!
  - speaker: seoyeon
    text: 하하, 국물 마셔요. 따뜻하게 먹으면 덜 매워요.
    meaning:
      en: Haha, drink the broth. Eaten warm it's less spicy.
      pt: Haha, toma o caldo. Quentinho arde menos.
  - speaker: protagonist
    text: 이모, 어묵 하나 더 주세요!
    meaning:
      en: Auntie, one more fish cake, please!
      pt: Tia, mais um 어묵, por favor!
  - speaker: seoyeon
    text: 언니 이제 한국 사람 같아요!
    meaning:
      en: Unni, you're like a Korean now!
      pt: Unni, agora você parece coreana!
  - speaker: protagonist
    text: 이런 데 또 오고 싶어요. 밤에 먹으니까 더 맛있어요.
    meaning:
      en: I want to come to a place like this again. It tastes better at night.
      pt: Quero voltar num lugar assim. De noite é mais gostoso.
