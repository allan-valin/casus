steps:
- type: narrator
  text:
    en: Minjun has called you 누나 for weeks, still in polite speech. On the stairs he says you can speak casually to him — and you, the elder, propose that you both do. Listen to the conversation; you don't
      need to understand it yet.
    pt: Há semanas o Minjun chama você de 누나, ainda falando educado. Na escada ele diz que você pode falar informal com ele — e você, a mais velha, propõe que os dois falem assim. Escute a conversa; ainda
      não precisa entender.
- type: dialogue
  lines:
  - speaker: minjun
    text: 누나, 저한테 말 편하게 하세요.
    meaning:
      en: Nuna, speak casually to me.
      pt: Nuna, pode falar informal comigo.
  - speaker: protagonist
    text: 그럼 우리 말 놓을까요? 민준 씨도요.
    meaning:
      en: Then shall we both drop the formalities? You too.
      pt: Então vamos os dois parar com a formalidade? Você também.
  - speaker: minjun
    text: 정말요? 그래도 돼요?
    meaning:
      en: Really? Is that OK?
      pt: Sério? Pode mesmo?
  - speaker: protagonist
    text: 응, 그래. 우리 친구잖아.
    meaning:
      en: Yeah, sure. We're friends.
      pt: Claro. A gente é amigo.
  - speaker: minjun
    text: 와, 고마워, 누나! 조금 어색해.
    meaning:
      en: Wow, thanks, nuna! It feels a bit awkward.
      pt: Nossa, valeu, nuna! Fica meio estranho.
  - speaker: protagonist
    text: 괜찮아. 밥 먹었어?
    meaning:
      en: It's fine. Have you eaten?
      pt: Tudo bem. Já comeu?
  - speaker: minjun
    text: 아니, 아직. 같이 먹을까?
    meaning:
      en: No, not yet. Shall we eat together?
      pt: Não, ainda não. Vamos comer juntos?
  - speaker: protagonist
    text: 그래! 치킨 시킬까?
    meaning:
      en: Sure! Shall we order chicken?
      pt: Bora! Vamos pedir frango?
- type: narrator
  text:
    en: '반말, casual speech, drops 요: 고마워요 → 고마워, 먹어요 → 먹어. Only after it is agreed. The younger one may offer 말 편하게 하세요; the elder proposes doing it both ways.'
    pt: '반말, a fala informal, tira o 요: 고마워요 → 고마워, 먹어요 → 먹어. Só depois de combinado. O mais novo pode oferecer 말 편하게 하세요; o mais velho propõe que os dois falem assim.'
