steps:
- type: narrator
  text:
    en: Chuseok, the harvest holiday. Minjun takes you to his parents' house; his mother makes songpyeon, his father prepares the ancestral rite. Listen to the conversation; you don't need to understand
      it yet.
    pt: Chuseok, o feriado da colheita. O Minjun leva você à casa dos pais; a mãe faz 송편, o pai prepara o rito aos antepassados. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: minjun
    text: 형, 여기가 우리 고향 집이야. 추석이라서 다 모였어.
    meaning:
      en: Hyung, this is our family home. Everyone's here for Chuseok.
      pt: Hyung, esta é a casa da família. Todo mundo veio para o Chuseok.
  - speaker: protagonist
    text: 와, 사람이 많아. 어머님은 뭐 하셔?
    meaning:
      en: Wow, lots of people. What's your mother doing?
      pt: Nossa, quanta gente. O que sua mãe está fazendo?
  - speaker: minjun
    text: 송편 만드셔. 형도 만들어 봐!
    meaning:
      en: She's making songpyeon. You try too!
      pt: Está fazendo 송편. Faz também!
  - speaker: protagonist
    text: 어떻게 만들어? 처음이야.
    meaning:
      en: How do you make it? It's my first time.
      pt: Como faz? É a primeira vez.
  - speaker: minjun
    text: 나도 엄마한테서 배웠어. 반달처럼 만들어.
    meaning:
      en: I learned it from mum too. You make it like a half moon.
      pt: Eu também aprendi com a minha mãe. Faz como uma meia-lua.
  - speaker: protagonist
    text: 반달처럼? 이렇게?
    meaning:
      en: Like a half moon? Like this?
      pt: Como meia-lua? Assim?
  - speaker: minjun
    text: 잘했어! 내일 아침에는 아버지가 차례를 지내셔.
    meaning:
      en: Nice! Tomorrow morning my father performs the ancestral rite.
      pt: Boa! Amanhã de manhã meu pai faz o 차례.
  - speaker: protagonist
    text: 고마워. 가족처럼 대해 줘서.
    meaning:
      en: Thanks. For treating me like family.
      pt: Valeu. Por me tratar como da família.
