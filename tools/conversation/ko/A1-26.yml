steps:
- type: narrator
  text:
    en: After the team dinner everyone goes to a karaoke room. The team lead hands you the microphone. Listen to the conversation; you don't need to understand it yet.
    pt: Depois do jantar da equipe todos vão a uma sala de karaokê. A líder entrega o microfone a você. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: jieun
    text: 자, 이제 노래방이에요! 노래해요.
    meaning:
      en: Right, it's noraebang time! Sing.
      pt: Pronto, agora é karaokê! Cante.
  - speaker: protagonist
    text: 저는 노래를 잘하지 않아요. 부끄러워요.
    meaning:
      en: I'm not good at singing. I'm shy.
      pt: Eu não canto bem. Tenho vergonha.
  - speaker: jieun
    text: 괜찮아요. 한국 노래 부를 수 있어요?
    meaning:
      en: It's fine. Can you sing a Korean song?
      pt: Tudo bem. Você consegue cantar uma música coreana?
  - speaker: protagonist
    text: 한국 노래는 부를 수 없어요. 아직 너무 어려워요.
    meaning:
      en: I can't sing Korean songs. They're still too hard.
      pt: Música coreana não consigo. Ainda é difícil demais.
  - speaker: jieun
    text: 그럼 브라질 노래 불러요! 여기 마이크요.
    meaning:
      en: Then sing a Brazilian song! Here's the microphone.
      pt: Então cante uma brasileira! Aqui o microfone.
  - speaker: protagonist
    text: 알겠어요… 그럼 보사노바 할게요.
    meaning:
      en: OK… then I'll do some bossa nova.
      pt: Tá bom… então vou de bossa nova.
  - speaker: jieun
    text: 와! 박수! 정말 잘해요!
    meaning:
      en: Wow! Applause! You're really good!
      pt: Nossa! Aplausos! Você canta muito bem!
  - speaker: protagonist
    text: 아니에요. 그래도 고마워요.
    meaning:
      en: Not at all. But thanks.
      pt: Que nada. Mas obrigado.
  - speaker: jieun
    text: 한 번 더! 한 번 더!
    meaning:
      en: One more! One more!
      pt: Mais uma! Mais uma!
