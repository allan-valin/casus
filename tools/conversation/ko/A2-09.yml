steps:
- type: narrator
  text:
    en: 'A cosmetics shop in Myeongdong with Seoyeon: 1+1 offers, 30% off, and a tax refund for foreigners. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Uma loja de cosméticos em Myeongdong com a Seoyeon: promoções leve 2 pague 1, 30% de desconto e devolução de imposto para estrangeiros. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: seoyeon
    text: 언니, 이거 원 플러스 원이에요!
    meaning:
      en: Unni, this is buy one get one free!
      pt: Unni, isto é leve dois pague um!
  - speaker: protagonist
    text: 와, 그럼 반값이에요? 이 크림은 얼마예요?
    meaning:
      en: Wow, so it's half price? How much is this cream?
      pt: Nossa, então é metade do preço? Quanto é este creme?
  - speaker: seoyeon
    text: 만 오천 원인데 삼십 퍼센트 할인해요.
    meaning:
      en: 15,000 won, but it's 30% off.
      pt: 15 mil wons, mas tem 30% de desconto.
  - speaker: protagonist
    text: 저 벌써 다섯 개나 샀어요!
    meaning:
      en: I've already bought as many as five!
      pt: Já comprei nada menos que cinco!
  - speaker: seoyeon
    text: 하하. 외국인은 택스 리펀드도 받을 수 있어요. 여권 있어요?
    meaning:
      en: Haha. Foreigners can also get a tax refund. Do you have your passport?
      pt: Haha. Estrangeiro também recebe devolução de imposto. Tem passaporte?
  - speaker: protagonist
    text: 외국인등록증이나 여권이 필요해요?
    meaning:
      en: Do I need the residence card or the passport?
      pt: Preciso do cartão de residente ou do passaporte?
  - speaker: seoyeon
    text: 여권이요. 세금을 돌려받거나 더 싸게 사요.
    meaning:
      en: The passport. You get the tax back, or you pay less straight away.
      pt: O passaporte. Você recebe o imposto de volta ou já paga menos.
  - speaker: protagonist
    text: 좋아요! 계산해 주세요. 영수증도 주세요.
    meaning:
      en: Great! I'll pay, please. And the receipt.
      pt: Ótimo! Pode passar. E o recibo, por favor.
