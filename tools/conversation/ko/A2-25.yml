steps:
- type: narrator
  text:
    en: Your first haircut in Seoul. The hairdresser asks lots of questions; you explain with words and gestures. Listen to the conversation; you don't need to understand it yet.
    pt: Seu primeiro corte de cabelo em Seul. O cabeleireiro pergunta muita coisa; você explica com palavras e gestos. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: hairdresser
    text: 어서 오세요. 어떻게 해 드릴까요?
    meaning:
      en: Welcome. How would you like it?
      pt: Bem-vinda. Como a senhora quer?
  - speaker: protagonist
    text: 짧게 잘라 주세요. 이렇게요.
    meaning:
      en: Cut it short, please. Like this.
      pt: Corte curto, por favor. Assim.
  - speaker: hairdresser
    text: 앞머리도 자를까요?
    meaning:
      en: Shall I cut the fringe too?
      pt: Corto a franja também?
  - speaker: protagonist
    text: 앞머리는 조금만 다듬어 주세요.
    meaning:
      en: Just trim the fringe a little, please.
      pt: A franja, só apare um pouquinho.
  - speaker: hairdresser
    text: 파마나 염색도 하실래요?
    meaning:
      en: Would you like a perm or colour too?
      pt: Quer fazer permanente ou tintura também?
  - speaker: protagonist
    text: 아니요, 오늘은 커트만 할게요.
    meaning:
      en: No, just a cut today.
      pt: Não, hoje só o corte.
  - speaker: hairdresser
    text: 다 됐어요. 거울 보세요. 어때요?
    meaning:
      en: All done. Look in the mirror. How is it?
      pt: Pronto. Olha no espelho. Que tal?
  - speaker: protagonist
    text: 와, 예쁘게 잘라 주셨네요. 마음에 들어요!
    meaning:
      en: Wow, you cut it beautifully. I like it!
      pt: Nossa, ficou lindo. Gostei!
- type: prompt
  ask:
    en: How does the hairdresser ask how you'd like it?
    pt: Como o cabeleireiro pergunta como você quer?
  answer:
    speaker: protagonist
    text: 어떻게 해 드릴까요?
  items:
  - saramin
- type: narrator
  text:
    en: '-게 says how: 짧다 → 짧게, short; 예쁘다 → 예쁘게, nicely. With -아/어 주세요: 짧게 잘라 주세요, cut it short (for me).'
    pt: '-게 diz o modo: 짧다 → 짧게, curto; 예쁘다 → 예쁘게, bonito. Com -아/어 주세요: 짧게 잘라 주세요, corte curto (para mim).'
