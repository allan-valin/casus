steps:
- type: narrator
  text:
    en: Dinner with Minjun and Seoyeon. Who pays? In Korea often one pays, or you split; there is no tip. Listen to the conversation; you don't need to understand it yet.
    pt: Jantar com o Minjun e a Seoyeon. Quem paga? Na Coreia muitas vezes um paga, ou se divide; não há gorjeta. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: minjun
    text: 맛있게 먹었어! 얼마 나왔어?
    meaning:
      en: That was great! How much is it?
      pt: Comi muito bem! Quanto deu?
  - speaker: protagonist
    text: 육만 원이야. 팁은 얼마 줘야 해?
    meaning:
      en: 60,000 won. How much do we have to tip?
      pt: Sessenta mil wons. Quanto tem que dar de gorjeta?
  - speaker: minjun
    text: 한국에는 팁이 없어. 안 줘도 돼.
    meaning:
      en: There's no tipping in Korea. You don't have to.
      pt: Na Coreia não tem gorjeta. Não precisa dar.
  - speaker: protagonist
    text: 진짜? 브라질은 보통 십 퍼센트 내.
    meaning:
      en: Really? In Brazil you usually pay ten per cent.
      pt: Sério? No Brasil normalmente se paga dez por cento.
  - speaker: minjun
    text: 오늘은 내가 낼게. 형이 지난번에 샀잖아.
    meaning:
      en: I'll pay today. You paid last time.
      pt: Hoje eu pago. Você pagou da última vez.
  - speaker: protagonist
    text: 아니야, 나눠서 내자. 더치페이 하자.
    meaning:
      en: No, let's split it.
      pt: Não, vamos dividir.
  - speaker: minjun
    text: 그럼 이번만. 다음에는 내가 싸게 맛있는 데 데려갈게.
    meaning:
      en: OK, just this once. Next time I'll take you somewhere cheap and good.
      pt: Tá, só desta vez. Da próxima te levo num lugar barato e bom.
  - speaker: protagonist
    text: 좋아. 다음에 네가 사!
    meaning:
      en: Deal. You pay next time!
      pt: Fechado. Da próxima você paga!
