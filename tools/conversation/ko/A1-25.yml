- type: narrator
  text:
    en: '-(으)ㅂ시다 is ''let''s'', in the formal style — older people use it to lead: 갑시다, let''s go. To an elder, say 같이 가요 instead.'
    pt: '-(으)ㅂ시다 é ''vamos'', no estilo formal — os mais velhos usam para conduzir: 갑시다, vamos. Para alguém mais velho, diga 같이 가요.'
