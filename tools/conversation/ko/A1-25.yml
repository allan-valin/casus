steps:
- type: narrator
  text:
    en: Saturday at Mangwon market with Mrs Park. She bargains like a pro; you buy fruit. Listen to the conversation; you don't need to understand it yet.
    pt: Sábado no mercado de Mangwon com a senhora Park. Ela pechincha como ninguém; você compra frutas. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: park
    text: 여기가 망원시장이에요. 과일이 싸고 신선해요.
    meaning:
      en: This is Mangwon market. The fruit is cheap and fresh.
      pt: Este é o mercado de Mangwon. A fruta é barata e fresca.
  - speaker: protagonist
    text: 사과 한 개에 얼마예요?
    meaning:
      en: How much is one apple?
      pt: Quanto é uma maçã?
  - speaker: seller
    text: 한 개에 천오백 원이에요.
    meaning:
      en: 1,500 won each.
      pt: Mil e quinhentos wons cada.
  - speaker: protagonist
    text: 비싸요… 다섯 개 사면 깎아 주세요?
    meaning:
      en: Expensive… if I buy five, will you give me a discount?
      pt: Caro… se eu levar cinco, faz desconto?
  - speaker: seller
    text: 다섯 개 사면 칠천 원에 줄게요.
    meaning:
      en: If you buy five, I'll let you have them for 7,000.
      pt: Se levar cinco, faço por sete mil.
  - speaker: park
    text: 사장님, 단골이에요. 하나 더 주세요!
    meaning:
      en: Boss, she's a regular. Give her one more!
      pt: Seu dono, ela é freguesa. Põe mais uma!
  - speaker: seller
    text: 하하, 덤이에요! 맛있게 드세요.
    meaning:
      en: Haha, it's on the house! Enjoy.
      pt: Haha, essa é de brinde! Bom proveito.
  - speaker: park
    text: 자, 이제 떡집에 갑시다!
    meaning:
      en: Right, now let's go to the rice-cake shop!
      pt: Pronto, agora vamos à loja de 떡!
