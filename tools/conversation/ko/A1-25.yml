- type: narrator
  text:
    en: '-(으)면 is ''if'': 사다 → 사면, if I buy. 다섯 개 사면 깎아 주세요? — if I buy five, will you knock the price down?'
    pt: '-(으)면 é ''se'': 사다 → 사면, se eu comprar. 다섯 개 사면 깎아 주세요? — se eu levar cinco, faz desconto?'
