  items:
  - oneul
  - biga-wayo
- type: narrator
  text:
    en: 'Describing words work like verbs: 덥다 → 더워요, 춥다 → 추워요, 따뜻하다 → 따뜻해요. Words in -ㅂ다 change ㅂ to 우: 더워요.'
    pt: 'As palavras que descrevem funcionam como verbos: 덥다 → 더워요, 춥다 → 추워요, 따뜻하다 → 따뜻해요. As terminadas em -ㅂ다 trocam ㅂ por 우: 더워요.'
