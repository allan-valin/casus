steps:
- type: narrator
  text:
    en: It is raining when you go out. Minjun, at the door, asks if you have an umbrella, and tells you about Seoul's summer and winter. Listen to the conversation; you don't need to understand it yet.
    pt: Está chovendo quando você sai. O Minjun, na porta, pergunta se você tem guarda-chuva e conta como são o verão e o inverno de Seul. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: minjun
    text: 오늘 비가 와요. 우산 있어요?
    meaning:
      en: It's raining today. Do you have an umbrella?
      pt: Hoje está chovendo. Você tem guarda-chuva?
  - speaker: protagonist
    text: 아니요, 없어요.
    meaning:
      en: No, I don't.
      pt: Não, não tenho.
  - speaker: minjun
    text: 편의점에서 우산을 사요. 사장님 가게요.
    meaning:
      en: Buy an umbrella at the convenience store. The owner's shop.
      pt: Compre um guarda-chuva na loja de conveniência. A loja do dono.
  - speaker: protagonist
    text: 네, 우산을 사요. 서울은 여름에 더워요?
    meaning:
      en: OK, I'll buy an umbrella. Is Seoul hot in summer?
      pt: Tá, compro um guarda-chuva. Seul é quente no verão?
  - speaker: minjun
    text: 네, 정말 더워요. 비도 많이 와요.
    meaning:
      en: Yes, really hot. It rains a lot, too.
      pt: Sim, muito quente. E chove muito.
  - speaker: protagonist
    text: 겨울은요?
    meaning:
      en: And the winter?
      pt: E o inverno?
  - speaker: minjun
    text: 겨울은 정말 추워요. 눈이 와요.
    meaning:
      en: Winter is really cold. It snows.
      pt: O inverno é muito frio. Neva.
  - speaker: protagonist
    text: 브라질은 겨울에도 따뜻해요.
    meaning:
      en: In Brazil it's warm even in winter.
      pt: No Brasil é quente até no inverno.
  - speaker: minjun
    text: 와, 좋아요! 서울 날씨는 힘들어요.
    meaning:
      en: Wow, lucky! Seoul's weather is hard.
      pt: Nossa, que bom! O tempo de Seul é difícil.
- type: prompt
  ask:
    en: Say that it is raining today.
    pt: Diga que hoje está chovendo.
