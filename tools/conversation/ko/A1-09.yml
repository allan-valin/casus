steps:
- type: narrator
  text:
    en: After work, the team lead takes you to a friend's clothes shop near the office. Seoul dresses up, even for a walk. Listen to the conversation; you don't need to understand it yet.
    pt: Depois do trabalho, a líder leva você à loja de roupas de uma amiga perto do escritório. Seul se veste com cuidado, até para um passeio. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: jieun
    text: 여기는 제 친구의 가게예요.
    meaning:
      en: This is my friend's shop.
      pt: Esta é a loja da minha amiga.
  - speaker: protagonist
    text: 와, 옷이 정말 예뻐요!
    meaning:
      en: Wow, the clothes are really pretty!
      pt: Nossa, as roupas são lindas!
  - speaker: jieun
    text: 이 치마 어때요?
    meaning:
      en: What do you think of this skirt?
      pt: Que tal esta saia?
  - speaker: protagonist
    text: 예뻐요! 빨간색하고 검은색이 있어요?
    meaning:
      en: Pretty! Is there red and black?
      pt: Linda! Tem vermelha e preta?
  - speaker: jieun
    text: 네, 있어요. 저는 검은색이 좋아요.
    meaning:
      en: Yes. I like the black one.
      pt: Tem. Eu gosto da preta.
  - speaker: protagonist
    text: 저는 빨간색이 좋아요.
    meaning:
      en: I like the red one.
      pt: Eu gosto da vermelha.
  - speaker: jieun
    text: 하얀색 바지도 예뻐요.
    meaning:
      en: The white trousers are pretty too.
      pt: A calça branca também é bonita.
  - speaker: protagonist
    text: 팀장님 친구 가게, 정말 좋아요!
    meaning:
      en: Your friend's shop is really nice!
      pt: A loja da sua amiga é ótima!
- type: narrator
  text:
    en: '의 is ''of'', like an apostrophe-s: 친구의 가게, the friend''s shop. In talk it is often dropped: 친구 가게. 저의 shortens to 제: 제 친구.'
    pt: '의 é ''de'', a posse: 친구의 가게, a loja da amiga. Na fala muitas vezes some: 친구 가게. 저의 vira 제: 제 친구.'
- type: prompt
