steps:
- type: narrator
  text:
    en: A cold with fever. A short wait at the neighbourhood internal-medicine clinic, then the pharmacy downstairs. Listen to the conversation; you don't need to understand it yet.
    pt: Um resfriado com febre. Uma espera curta na clínica do bairro, depois a farmácia no térreo. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: isa
    text: 어떻게 오셨어요?
    meaning:
      en: What brings you here?
      pt: O que a traz aqui?
  - speaker: protagonist
    text: 감기에 걸렸어요. 열이 나고 목이 아파요.
    meaning:
      en: I've caught a cold. I have a fever and a sore throat.
      pt: Peguei um resfriado. Estou com febre e dor de garganta.
  - speaker: isa
    text: 기침도 해요?
    meaning:
      en: Are you coughing too?
      pt: Tem tosse também?
  - speaker: protagonist
    text: 네, 밤에 잘 때 기침을 많이 해요.
    meaning:
      en: Yes, I cough a lot when I sleep at night.
      pt: Sim, tusso muito quando durmo à noite.
  - speaker: isa
    text: 처방전 드릴게요. 약은 여덟 시간마다 드세요.
    meaning:
      en: I'll give you a prescription. Take the medicine every eight hours.
      pt: Vou dar a receita. Tome o remédio a cada oito horas.
  - speaker: protagonist
    text: 식사 후에 먹어요?
    meaning:
      en: Do I take it after meals?
      pt: Tomo depois das refeições?
  - speaker: isa
    text: 네, 식사 후에 드세요. 그리고 술은 마시지 마세요.
    meaning:
      en: Yes, after meals. And don't drink alcohol.
      pt: Sim, depois das refeições. E não beba álcool.
  - speaker: protagonist
    text: 알겠습니다. 약국은 어디에 있어요?
    meaning:
      en: Understood. Where's the pharmacy?
      pt: Entendido. Onde fica a farmácia?
  - speaker: isa
    text: 일 층에 있어요. 빨리 나으세요.
    meaning:
      en: On the ground floor. Get well soon.
      pt: No térreo. Melhoras.
