steps:
- type: narrator
  text:
    en: You join Minjun's futsal team. You lose the first match — and the team decides to train every week. Listen to the conversation; you don't need to understand it yet.
    pt: Você entra no time de futsal do Minjun. Vocês perdem o primeiro jogo — e o time decide treinar toda semana. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: minjun
    text: 형, 오늘 풋살 어땠어?
    meaning:
      en: Hyung, how was futsal today?
      pt: Hyung, como foi o futsal hoje?
  - speaker: protagonist
    text: 졌어. 나는 골을 하나도 못 넣었어.
    meaning:
      en: We lost. I didn't score a single goal.
      pt: Perdemos. Eu não marquei nenhum gol.
  - speaker: minjun
    text: 괜찮아. 져도 재미있었잖아.
    meaning:
      en: It's fine. Even if we lost, it was fun.
      pt: Tudo bem. Mesmo perdendo, foi divertido.
  - speaker: protagonist
    text: 응. 그런데 브라질 사람인데 축구를 못해서 미안해.
    meaning:
      en: Yeah. But sorry for being a Brazilian who can't play football.
      pt: É. Mas desculpa por ser brasileiro e não saber jogar.
  - speaker: minjun
    text: 하하, 상관없어! 우리 팀은 매주 연습하기로 했어.
    meaning:
      en: Haha, doesn't matter! Our team decided to train every week.
      pt: Haha, não tem problema! Nosso time decidiu treinar toda semana.
  - speaker: protagonist
    text: 좋아. 힘들어도 매주 갈게.
    meaning:
      en: Great. Even if it's hard, I'll come every week.
      pt: Beleza. Mesmo que seja puxado, vou toda semana.
  - speaker: minjun
    text: 다음에 이기면 돼. 파이팅!
    meaning:
      en: We just have to win next time. Let's go!
      pt: É só ganhar da próxima. Vamos!
  - speaker: protagonist
    text: 파이팅! 다음엔 꼭 이겨!
    meaning:
      en: Let's go! Next time we win for sure!
      pt: Vamos! Da próxima a gente ganha!
