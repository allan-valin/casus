steps:
- type: narrator
  text:
    en: On the stairs Minjun asks your age. You are thirty, he is twenty-seven — so you become his 형, 'big brother'. He brings kimchi from Mrs Park. Listen to the conversation; you don't need to understand
      it yet.
    pt: Na escada, o Minjun pergunta a sua idade. Você tem trinta, ele vinte e sete — então você vira o 형 dele, 'irmão mais velho'. Ele traz kimchi da senhora Park. Escute a conversa; ainda não precisa
      entender.
- type: dialogue
  lines:
  - speaker: minjun
    text: 저… 실례지만 몇 살이에요?
    meaning:
      en: Um… excuse me, but how old are you?
      pt: Hum… com licença, quantos anos você tem?
  - speaker: protagonist
    text: 저는 서른 살이에요. 민준 씨는요?
    meaning:
      en: I'm thirty. And you, Minjun?
      pt: Tenho trinta. E você, Minjun?
  - speaker: minjun
    text: 저는 스물일곱 살이에요. 그럼 형이에요!
    meaning:
      en: I'm twenty-seven. Then you're my big brother!
      pt: Tenho vinte e sete. Então você é meu irmão mais velho!
  - speaker: protagonist
    text: 형? 진짜?
    meaning:
      en: Big brother? Really?
      pt: Irmão mais velho? Sério?
  - speaker: minjun
    text: 네, 형이에요. 저는 동생이에요.
    meaning:
      en: Yes, you're 형. I'm the younger one.
      pt: Sim, você é o 형. Eu sou o mais novo.
  - speaker: minjun
    text: 형, 이거 형에게 줘요. 할머니 김치예요.
    meaning:
      en: Hyung, this is for you. Grandma's kimchi.
      pt: Hyung, isto é para você. O kimchi da vovó.
  - speaker: protagonist
    text: 와, 김치! 고마워요.
    meaning:
      en: Wow, kimchi! Thanks.
      pt: Nossa, kimchi! Obrigado.
  - speaker: minjun
    text: 할머니 김치는 정말 맛있어요.
    meaning:
      en: Grandma's kimchi is really good.
      pt: O kimchi da vovó é muito bom.
- type: narrator
  text:
    en: 'Koreans ask your age early, to know who is older: it decides how they speak to you. It is not rude. 실례지만 softens the question.'
    pt: 'Os coreanos perguntam a idade logo cedo, para saber quem é mais velho: isso decide como vão falar com você. Não é falta de educação. 실례지만 suaviza a pergunta.'
