  - speaker: park
    text: 아이고, 허리가 아파요.
    meaning:
      en: Oh dear, my back hurts.
      pt: Ai, minhas costas doem.
  - speaker: protagonist
    text: 이거 무거워요. 제가 들게요.
    meaning:
      en: This is heavy. I'll carry it.
      pt: Isto é pesado. Eu carrego.
