steps:
- type: narrator
  text:
    en: Mrs Park finds you cooking ramyeon the wrong way and shows you how Koreans make it. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Park pega você cozinhando 라면 do jeito errado e mostra como os coreanos fazem. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: park
    text: 아이고, 그렇게 안 돼요!
    meaning:
      en: Oh dear, not like that!
      pt: Ai, assim não!
  - speaker: protagonist
    text: 왜요? 라면이 맛없어요?
    meaning:
      en: Why? Is the ramyeon bad?
      pt: Por quê? O lámen fica ruim?
  - speaker: park
    text: 먼저 물을 끓여요. 그다음에 면을 넣어요.
    meaning:
      en: First boil the water. After that put in the noodles.
      pt: Primeiro ferva a água. Depois ponha o macarrão.
  - speaker: protagonist
    text: 물이 차갑지만 괜찮아요?
    meaning:
      en: The water is cold, but is that OK?
      pt: A água está fria, mas tudo bem?
  - speaker: park
    text: 안 돼요. 물을 끓이고 수프를 넣어요.
    meaning:
      en: No. Boil the water and add the soup powder.
      pt: Não. Ferva a água e ponha o tempero.
  - speaker: protagonist
    text: 소금도 넣어요?
    meaning:
      en: Do I add salt too?
      pt: Ponho sal também?
  - speaker: park
    text: 아니요, 소금은 안 넣어요. 계란하고 파를 넣어요.
    meaning:
      en: No, no salt. Add an egg and spring onion.
      pt: Não, sal não. Ponha um ovo e cebolinha.
  - speaker: protagonist
    text: 와, 맛있어요! 간단하지만 정말 맛있어요.
    meaning:
      en: Wow, delicious! Simple but really tasty.
      pt: Nossa, que gostoso! Simples, mas muito bom.
