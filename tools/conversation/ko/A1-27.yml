steps:
- type: narrator
  text:
    en: 'The first cold night. Mrs Park shows you the floor heating, ondol: Koreans sit and even sleep on the warm floor. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'A primeira noite fria. A senhora Park mostra o aquecimento no piso, o 온돌: os coreanos sentam e até dormem no chão quente. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: 할머니, 방이 추워서 잠을 자지 못해요.
    meaning:
      en: Grandma, the room is cold, so I can't sleep.
      pt: Vovó, o quarto está frio e eu não consigo dormir.
  - speaker: park
    text: 난방 안 켰어요? 잠깐만요.
    meaning:
      en: You didn't turn on the heating? Just a moment.
      pt: Não ligou o aquecimento? Só um momento.
  - speaker: protagonist
    text: 난방이 어디 있어요? 히터가 없어요.
    meaning:
      en: Where's the heating? There's no heater.
      pt: Onde fica o aquecimento? Não tem aquecedor.
  - speaker: park
    text: 한국은 바닥이 따뜻해요. 이거 켜요.
    meaning:
      en: In Korea the floor gets warm. Turn this on.
      pt: Na Coreia o chão esquenta. Ligue isto.
  - speaker: protagonist
    text: 와, 바닥이 따뜻하고 좋아요!
    meaning:
      en: Wow, the floor is warm and nice!
      pt: Nossa, o chão está quente e gostoso!
  - speaker: park
    text: 온도는 이십오 도예요. 밤에는 이불 덮고 바닥에서 자요.
    meaning:
      en: The temperature is 25 degrees. At night cover yourself and sleep on the floor.
      pt: A temperatura é 25 graus. À noite, se cubra e durma no chão.
  - speaker: protagonist
    text: 바닥에서요? 침대가 있는데요.
    meaning:
      en: On the floor? I have a bed, though.
      pt: No chão? Mas eu tenho cama.
  - speaker: park
    text: 하하, 침대도 좋아요. 아침에 끄세요!
    meaning:
      en: Haha, the bed is fine too. Turn it off in the morning!
      pt: Haha, a cama também serve. Desligue de manhã!
- type: narrator
  text:
    en: '-지 못해요 is the long form of 못: 자다 → 자지 못해요, I can''t sleep. -아서/어서 gives the cause: 추워서, because it''s cold.'
    pt: '-지 못해요 é a forma longa do 못: 자다 → 자지 못해요, não consigo dormir. -아서/어서 dá a causa: 추워서, porque está frio.'
