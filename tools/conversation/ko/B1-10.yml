steps:
- type: narrator
  text:
    en: 'Minjun''s friend Dohyun leaves for his military service. Minjun explains why it exists: the war, the armistice, no peace treaty. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'O amigo do Minjun, Dohyun, vai para o serviço militar. O Minjun explica por que ele existe: a guerra, o armistício, nenhum tratado de paz. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: minjun
    text: 형, 도현이가 다음 주에 입대해.
    meaning:
      en: Hyung, Dohyun enlists next week.
      pt: Hyung, o Dohyun se alista semana que vem.
  - speaker: protagonist
    text: 군대? 얼마나 있어?
    meaning:
      en: The army? How long is it?
      pt: Exército? Quanto tempo?
  - speaker: minjun
    text: 육군은 십팔 개월이야. 나도 이 년 전에 제대했었어.
    meaning:
      en: Eighteen months in the army. I was discharged two years ago myself.
      pt: No exército são dezoito meses. Eu também dei baixa dois anos atrás.
  - speaker: protagonist
    text: 왜 다 가야 돼?
    meaning:
      en: Why does everyone have to go?
      pt: Por que todos têm que ir?
  - speaker: minjun
    text: 한국 전쟁이 1953년에 휴전으로 끝났어. 평화 협정은 아직 없어.
    meaning:
      en: The Korean War ended in 1953 with an armistice. There's still no peace treaty.
      pt: A Guerra da Coreia acabou em 1953 com um armistício. Ainda não há tratado de paz.
  - speaker: protagonist
    text: 그럼 지금도 북한하고 전쟁 중이야?
    meaning:
      en: So you're still at war with North Korea?
      pt: Então ainda estão em guerra com a Coreia do Norte?
  - speaker: minjun
    text: 공식적으로는 그래. 그래서 칠십 년 동안 군대를 유지해 왔어. 부모님은 걱정하게 돼.
    meaning:
      en: Officially, yes. So for seventy years they've kept up the army. Parents end up worrying.
      pt: Oficialmente, sim. Por isso há setenta anos mantêm o exército. Os pais acabam se preocupando.
  - speaker: protagonist
    text: 도현아, 휴가 나오면 연락해. 건강하게 다녀와!
    meaning:
      en: Dohyun, message me when you're on leave. Come back safe!
      pt: Dohyun, me chama quando tiver licença. Volta bem!
