steps:
- type: narrator
  text:
    en: 'A note on your door from Mrs Park: your rubbish was in the wrong bag. She shows you the sorting area and its sign. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Um bilhete na sua porta da senhora Park: seu lixo estava no saco errado. Ela mostra a área de separação e a placa. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: park
    text: 학생, 이 쓰레기 학생 거예요?
    meaning:
      en: Is this rubbish yours?
      pt: Este lixo é seu?
  - speaker: protagonist
    text: 네… 죄송해요. 뭐가 잘못됐어요?
    meaning:
      en: Yes… sorry. What was wrong?
      pt: É… desculpe. O que estava errado?
  - speaker: park
    text: 음식물 쓰레기는 여기 버려야 해요.
    meaning:
      en: Food waste has to go here.
      pt: Lixo orgânico tem que ir aqui.
  - speaker: protagonist
    text: 플라스틱하고 종이는요?
    meaning:
      en: And plastic and paper?
      pt: E plástico e papel?
  - speaker: park
    text: 분리수거해야 해요. 플라스틱, 종이, 병, 다 따로요.
    meaning:
      en: You have to sort them. Plastic, paper, bottles, all separately.
      pt: Tem que separar. Plástico, papel, garrafa, tudo separado.
  - speaker: protagonist
    text: 다른 쓰레기는요?
    meaning:
      en: And the other rubbish?
      pt: E o resto do lixo?
  - speaker: park
    text: 종량제 봉투에 넣어야 해요. 편의점에서 사요.
    meaning:
      en: It goes in a paid bag. You buy them at the convenience store.
      pt: Vai no saco pago. Compra na loja de conveniência.
  - speaker: protagonist
    text: 표지판에 '분리수거는 화요일에 합니다'라고 써 있어요. 화요일만 버립니까?
    meaning:
      en: The sign says 'Sorting is done on Tuesdays'. Do we only throw it out on Tuesdays?
      pt: A placa diz 'A separação é feita às terças'. Só se joga na terça?
  - speaker: park
    text: 네, 화요일하고 금요일이에요.
    meaning:
      en: Yes, Tuesdays and Fridays.
      pt: Sim, terça e sexta.
