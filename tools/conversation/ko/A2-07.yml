steps:
- type: narrator
  text:
    en: 'Your first team dinner: Korean barbecue and soju. You pour for the director — and almost pour for yourself. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Seu primeiro jantar da equipe: churrasco coreano e soju. Você serve o diretor — e quase se serve sozinha. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: jieun
    text: 오늘은 회식이에요. 부장님 오셨어요!
    meaning:
      en: Tonight is the team dinner. The director is here!
      pt: Hoje é o jantar da equipe. O diretor chegou!
  - speaker: protagonist
    text: 부장님, 제가 따라 드릴게요.
    meaning:
      en: Director, let me pour for you.
      pt: Diretor, deixa que eu sirvo.
  - speaker: jieun
    text: 잘했어요. 두 손으로요!
    meaning:
      en: Well done. With both hands!
      pt: Muito bem. Com as duas mãos!
  - speaker: protagonist
    text: 그럼 제 잔은 제가…
    meaning:
      en: Then my glass, I'll…
      pt: Então o meu copo eu…
  - speaker: jieun
    text: 아니요! 혼자 따르지 마세요. 제가 따를게요.
    meaning:
      en: No! Don't pour your own. I'll pour it.
      pt: Não! Não se sirva sozinha. Eu sirvo.
  - speaker: protagonist
    text: 아, 그렇군요. 감사합니다. 건배!
    meaning:
      en: Oh, I see. Thank you. Cheers!
      pt: Ah, entendi. Obrigada. Saúde!
  - speaker: jieun
    text: 고기 구울게요. 뭐 더 먹을래요?
    meaning:
      en: I'll grill the meat. What else would you like to eat?
      pt: Eu asso a carne. Quer comer mais alguma coisa?
  - speaker: protagonist
    text: 냉면 먹을래요. 부장님께 먼저 드릴까요?
    meaning:
      en: I'd like cold noodles. Shall I give some to the director first?
      pt: Quero 냉면. Sirvo o diretor primeiro?
  - speaker: jieun
    text: 네, 좋아요. 그리고 2차는 노래방이에요!
    meaning:
      en: Yes, good. And the second round is noraebang!
      pt: Isso. E a segunda rodada é no karaokê!
