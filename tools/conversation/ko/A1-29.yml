steps:
- type: narrator
  text:
    en: You sent the wrong file to a client. The team lead calls you in. Apologise properly, fix it, report back. Listen to the conversation; you don't need to understand it yet.
    pt: Você mandou o arquivo errado a um cliente. A líder chama você. Peça desculpas direito, corrija e informe. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: jieun
    text: 고객한테 파일을 잘못 보냈어요?
    meaning:
      en: Did you send the client the wrong file?
      pt: Você mandou o arquivo errado para o cliente?
  - speaker: protagonist
    text: 네… 정말 죄송합니다. 제가 실수했어요.
    meaning:
      en: Yes… I'm very sorry. I made a mistake.
      pt: Sim… peço muitas desculpas. Eu errei.
  - speaker: jieun
    text: 괜찮아요. 지금 다시 보내야 돼요.
    meaning:
      en: It's OK. You have to send it again now.
      pt: Tudo bem. Precisa reenviar agora.
  - speaker: protagonist
    text: 네, 바로 다시 보내겠습니다.
    meaning:
      en: Yes, I'll send it again right away.
      pt: Sim, vou reenviar agora mesmo.
  - speaker: jieun
    text: 보낸 후에 고객한테 전화도 해야 돼요.
    meaning:
      en: After sending it, you also have to call the client.
      pt: Depois de enviar, tem que ligar para o cliente também.
  - speaker: protagonist
    text: 알겠습니다. 전화한 후에 보고드리겠습니다.
    meaning:
      en: Understood. After calling, I'll report back to you.
      pt: Entendido. Depois de ligar, eu informo a senhora.
  - speaker: jieun
    text: 좋아요. 다음에는 조심해요.
    meaning:
      en: Good. Be careful next time.
      pt: Ótimo. Cuidado da próxima vez.
  - speaker: protagonist
    text: 네, 앞으로 주의하겠습니다.
    meaning:
      en: Yes, I'll be careful from now on.
      pt: Sim, vou tomar cuidado daqui para frente.
- type: narrator
  text:
    en: 'At work a serious apology is formal: 죄송합니다, and say it was your mistake: 제가 실수했어요.'
    pt: 'No trabalho um pedido de desculpas sério é formal: 죄송합니다, e assuma o erro: 제가 실수했어요.'
- type: prompt
