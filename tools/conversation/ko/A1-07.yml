steps:
- type: narrator
  text:
    en: First day at the game company. The team lead, Lee Jieun, welcomes you and explains the day. Listen to the conversation; you don't need to understand it yet.
    pt: Primeiro dia na empresa de jogos. A líder da equipe, Lee Jieun, recebe você e explica o dia. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: jieun
    text: 안녕하세요. 저는 이지은 팀장이에요.
    meaning:
      en: Hello. I'm Lee Jieun, the team lead.
      pt: Olá. Eu sou Lee Jieun, a líder da equipe.
  - speaker: protagonist
    text: 안녕하세요, 팀장님. 처음 뵙겠습니다. 잘 부탁드립니다.
    meaning:
      en: Hello, team lead. Nice to meet you. I look forward to working with you.
      pt: Olá, líder. Muito prazer. Conto com a senhora.
  - speaker: jieun
    text: 오늘부터 우리 팀이에요. 자리는 여기예요.
    meaning:
      en: From today you're in our team. Your desk is here.
      pt: A partir de hoje você é da nossa equipe. Sua mesa é aqui.
  - speaker: protagonist
    text: 감사합니다. 회의는 몇 시에 해요?
    meaning:
      en: Thank you. What time is the meeting?
      pt: Obrigada. A reunião é a que horas?
  - speaker: jieun
    text: 열 시에 해요. 회의실은 삼 층이에요.
    meaning:
      en: At ten. The meeting room is on the third floor.
      pt: Às dez. A sala de reunião fica no terceiro andar.
  - speaker: jieun
    text: 열 시에 삼 층으로 오세요.
    meaning:
      en: Come to the third floor at ten.
      pt: Venha para o terceiro andar às dez.
  - speaker: protagonist
    text: 네, 알겠습니다.
    meaning:
      en: Yes, understood.
      pt: Sim, entendido.
  - speaker: jieun
    text: 커피 마셔요?
    meaning:
      en: Do you drink coffee?
      pt: Você toma café?
  - speaker: protagonist
    text: 네, 커피를 마셔요. 감사합니다, 팀장님!
    meaning:
      en: Yes, I drink coffee. Thank you, team lead!
      pt: Sim, tomo café. Obrigada, líder!
- type: narrator
  text:
    en: 'At work you call her by her title: 팀장님. Her name alone, 지은, would be rude; even 지은 씨 is too familiar for the boss.'
    pt: 'No trabalho você a chama pelo cargo: 팀장님. Só o nome, 지은, seria grosseiro; mesmo 지은 씨 é íntimo demais para a chefe.'
- type: prompt
