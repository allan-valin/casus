steps:
- type: narrator
  text:
    en: 'In front of the shop, the owner helps you read the signs of the street: exit, entrance, the subway. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Na frente da loja, o dono ajuda você a ler as placas da rua: saída, entrada, o metrô. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: 사장님, 이거 어떻게 읽어요?
    meaning:
      en: Boss, how do you read this?
      pt: Chefe, como se lê isto?
  - speaker: sajang
    text: '''출구''예요. 저기는 ''입구''예요.'
    meaning:
      en: It's 'exit'. Over there is 'entrance'.
      pt: É 'saída'. Lá é 'entrada'.
  - speaker: protagonist
    text: 아, 출구! 저는 한글 공부해요.
    meaning:
      en: Ah, exit! I'm studying hangul.
      pt: Ah, saída! Eu estudo hangul.
  - speaker: sajang
    text: 와, 한글 잘 읽어요!
    meaning:
      en: Wow, you read hangul well!
      pt: Nossa, você lê hangul bem!
  - speaker: protagonist
    text: 아니에요. 조금 읽어요.
    meaning:
      en: Not at all. I read a little.
      pt: Que nada. Leio um pouco.
  - speaker: sajang
    text: 지하철역은 저기예요. 지하철역이랑 버스도 가까워요.
    meaning:
      en: The subway station is over there. The station and the bus are close.
      pt: A estação de metrô é ali. A estação e o ônibus ficam perto.
  - speaker: protagonist
    text: 지하철역이 가까워요? 좋아요!
    meaning:
      en: The station is near? Great!
      pt: A estação é perto? Ótimo!
  - speaker: protagonist
    text: 감사합니다. 지하철역에 가요!
    meaning:
      en: Thank you. I'm off to the station!
      pt: Obrigada. Vou para a estação!
- type: narrator
  text:
    en: 'Shop owners are called 사장님, ''boss''. Ask him how to read a sign: 이거 어떻게 읽어요?'
    pt: 'O dono da loja é chamado de 사장님, ''chefe''. Pergunte como se lê uma placa: 이거 어떻게 읽어요?'
- type: prompt
