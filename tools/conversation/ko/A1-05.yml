- type: narrator
  text:
    en: 'The polite present ends in -아요/-어요: 가다 → 가요, 읽다 → 읽어요, and every 하다 verb → 해요: 공부하다 → 공부해요. One form for I, you, he, she.'
    pt: 'O presente educado termina em -아요/-어요: 가다 → 가요, 읽다 → 읽어요, e todo verbo em 하다 → 해요: 공부하다 → 공부해요. Uma forma só para eu, você, ele, ela.'
