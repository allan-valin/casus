steps:
- type: narrator
  text:
    en: 'Your phone screams at 7 a.m.: an emergency text about a cold wave. Mrs Park explains these messages. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Seu celular dispara às 7 da manhã: um alerta de emergência sobre uma onda de frio. A senhora Park explica essas mensagens. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: 할머니, 아침에 핸드폰이 크게 울렸어요. 놀랐어요!
    meaning:
      en: Grandma, my phone rang really loudly this morning. I got a fright!
      pt: Vovó, o celular tocou alto de manhã. Levei um susto!
  - speaker: park
    text: 재난 문자야. 오늘 한파래.
    meaning:
      en: It's an emergency text. There's a cold wave today.
      pt: É alerta de emergência. Hoje tem onda de frio.
  - speaker: protagonist
    text: '''외출을 자제할 것''은 무슨 뜻이에요?'
    meaning:
      en: What does 'avoid going out' mean?
      pt: O que quer dizer 'evitar sair'?
  - speaker: park
    text: 밖에 나가지 말라는 뜻이야. 영하 십오 도야.
    meaning:
      en: It means don't go out. It's minus fifteen.
      pt: Quer dizer para não sair. Está quinze abaixo de zero.
  - speaker: protagonist
    text: 영하 십오 도요? 브라질에서는 상상도 못 해요.
    meaning:
      en: Minus fifteen? In Brazil you can't even imagine it.
      pt: Quinze abaixo de zero? No Brasil nem dá para imaginar.
  - speaker: park
    text: 수도관이 얼 수 있으니까 물을 조금 틀어 놔.
    meaning:
      en: The pipes can freeze, so leave the tap running a little.
      pt: O cano pode congelar, então deixa a torneira pingando.
  - speaker: protagonist
    text: 알겠어요. 나갈 때는 따뜻하게 입을게요.
    meaning:
      en: OK. When I go out I'll dress warmly.
      pt: Tá bom. Quando sair, vou me agasalhar.
  - speaker: park
    text: 그래. 안전이 제일이야.
    meaning:
      en: Good. Safety comes first.
      pt: Isso. A segurança vem primeiro.
