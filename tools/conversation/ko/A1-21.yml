steps:
- type: narrator
  text:
    en: A sunny Sunday at Hangang Park with Seoyeon. People are cycling, flowers are coming out by the river. Listen to the conversation; you don't need to understand it yet.
    pt: Um domingo de sol no parque Hangang com a Seoyeon. Gente andando de bicicleta, flores abrindo à beira do rio. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: seoyeon
    text: 언니, 여기가 한강 공원이에요. 여기 앉으세요.
    meaning:
      en: Unni, this is Hangang Park. Sit here.
      pt: Unni, aqui é o parque Hangang. Sente aqui.
  - speaker: protagonist
    text: 와, 강이 정말 넓어요! 사람들이 자전거를 타고 있어요.
    meaning:
      en: Wow, the river is so wide! People are riding bikes.
      pt: Nossa, o rio é largo! As pessoas estão andando de bicicleta.
  - speaker: seoyeon
    text: 네, 주말에는 사람이 많아요. 저기 꽃 보세요!
    meaning:
      en: Yes, it's busy at weekends. Look at the flowers there!
      pt: Sim, no fim de semana tem muita gente. Olha as flores ali!
  - speaker: protagonist
    text: 꽃이 피고 있어요. 무슨 꽃이에요?
    meaning:
      en: The flowers are coming out. What flowers are they?
      pt: As flores estão abrindo. Que flor é?
  - speaker: seoyeon
    text: 벚꽃이에요. 봄에 피어요.
    meaning:
      en: Cherry blossoms. They bloom in spring.
      pt: Flor de cerejeira. Abre na primavera.
  - speaker: protagonist
    text: 나무도 많아요. 화장실은 어디에 있어요?
    meaning:
      en: There are lots of trees too. Where are the toilets?
      pt: Tem muita árvore também. Onde fica o banheiro?
  - speaker: seoyeon
    text: 편의점 옆에 있어요. 언니, 사진 찍어요!
    meaning:
      en: Next to the convenience store. Unni, let's take a photo!
      pt: Do lado da loja de conveniência. Unni, vamos tirar uma foto!
  - speaker: protagonist
    text: 좋아요. 하나, 둘, 셋!
    meaning:
      en: OK. One, two, three!
      pt: Tá bom. Um, dois, três!
- type: narrator
  text:
    en: '-(으)세요 asks politely: 앉다 → 앉으세요, please sit; 보다 → 보세요, look.'
    pt: '-(으)세요 pede com educação: 앉다 → 앉으세요, sente-se; 보다 → 보세요, olhe.'
