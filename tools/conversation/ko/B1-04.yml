steps:
- type: narrator
  text:
    en: You and Seoyeon have grown close. After a film, outside the cinema, the moment comes. Listen to the conversation; you don't need to understand it yet.
    pt: Você e a Seoyeon ficaram próximos. Depois de um filme, na saída do cinema, chega o momento. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: seoyeon
    text: 오빠, 영화 재미있었어요?
    meaning:
      en: Oppa, was the film good?
      pt: Oppa, gostou do filme?
  - speaker: protagonist
    text: 응. 그런데 사실 영화보다 서연이가 더 생각났어.
    meaning:
      en: Yeah. But honestly I thought more about you than the film.
      pt: Gostei. Mas na verdade pensei mais em você do que no filme.
  - speaker: seoyeon
    text: 네? 무슨 뜻이에요?
    meaning:
      en: Sorry? What do you mean?
      pt: Como? O que quer dizer?
  - speaker: protagonist
    text: 지난주에 만나자마자 계속 생각났어. 나 서연이 좋아해. 사귈래?
    meaning:
      en: Since we met last week I kept thinking of you. I like you. Will you go out with me?
      pt: Desde que nos vimos semana passada não parei de pensar em você. Gosto de você. Quer namorar comigo?
  - speaker: seoyeon
    text: 어제 언니한테 물어봤더니 오빠가 고백할 거라고 했어요!
    meaning:
      en: When I asked my cousin yesterday, she said you'd confess!
      pt: Ontem perguntei para a minha prima e ela disse que você ia se declarar!
  - speaker: protagonist
    text: 하하, 다 알았구나. 그래서 어떻게 생각해?
    meaning:
      en: Haha, you knew it all. So what do you think?
      pt: Haha, você já sabia. Então, o que você acha?
  - speaker: seoyeon
    text: 저도 좋아요. 오늘부터 1일이에요!
    meaning:
      en: I like you too. From today, day one!
      pt: Eu também gosto. A partir de hoje, dia 1!
  - speaker: protagonist
    text: 행복해. 이제 내 여자 친구야.
    meaning:
      en: I'm happy. Now you're my girlfriend.
      pt: Estou feliz. Agora você é minha namorada.
- type: narrator
  text:
    en: 'You''re older and close now: you speak 반말 to Seoyeon; she still uses 해요체 until you both agree otherwise.'
    pt: 'Agora vocês são próximos e você é mais velho: você fala 반말 com a Seoyeon; ela ainda usa 해요체 até combinarem outra coisa.'
