steps:
- type: narrator
  text:
    en: 'Your colleague Taeho''s wedding in a wedding hall: the money envelope at the desk, a 30-minute ceremony, then the buffet. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'O casamento do colega Taeho num salão de festas: o envelope com dinheiro na mesa, cerimônia de 30 minutos, depois o bufê. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: jieun
    text: 결혼식 축의금 준비했어요?
    meaning:
      en: Did you prepare the wedding money?
      pt: Preparou o dinheiro do casamento?
  - speaker: protagonist
    text: 네, 봉투에 넣어 뒀어요. 얼마 넣어야 해요?
    meaning:
      en: Yes, I've put it in an envelope. How much should I put in?
      pt: Sim, já deixei no envelope. Quanto tenho que pôr?
  - speaker: jieun
    text: 동료는 보통 오만 원 정도예요. 적어도 괜찮아요.
    meaning:
      en: For a colleague usually about 50,000 won. Even if it's less, that's fine.
      pt: Para colega, normalmente uns 50 mil wons. Mesmo que seja menos, tudo bem.
  - speaker: protagonist
    text: 결혼식이 정말 짧네요. 삼십 분이에요?
    meaning:
      en: The ceremony is really short. Thirty minutes?
      pt: A cerimônia é bem curta. Trinta minutos?
  - speaker: jieun
    text: 네. 웨딩홀은 다음 결혼식이 있어서 빨라요.
    meaning:
      en: Yes. The hall has the next wedding, so it's quick.
      pt: Sim. O salão tem o próximo casamento, por isso é rápido.
  - speaker: protagonist
    text: 신랑 신부가 정말 예뻐요. 사진도 찍어 놓을게요.
    meaning:
      en: The bride and groom look lovely. I'll take some photos to keep.
      pt: Os noivos estão lindos. Vou tirar umas fotos.
  - speaker: jieun
    text: 좋아요. 이제 뷔페 먹으러 가요!
    meaning:
      en: Good. Now let's go to the buffet!
      pt: Ótimo. Agora vamos ao bufê!
  - speaker: protagonist
    text: 태호 씨, 결혼 축하드려요! 행복하세요.
    meaning:
      en: Taeho, congratulations on your wedding! Be happy.
      pt: Taeho, parabéns pelo casamento! Sejam felizes.
