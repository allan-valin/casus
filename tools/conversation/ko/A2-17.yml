steps:
- type: narrator
  text:
    en: 'You dropped your phone on the subway stairs. A repair shop in Yongsan: the screen, the price, how many days. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Você deixou o celular cair na escada do metrô. Uma assistência técnica em Yongsan: a tela, o preço, quantos dias. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: 안녕하세요. 핸드폰이 고장 났어요.
    meaning:
      en: Hello. My phone is broken.
      pt: Olá. Meu celular quebrou.
  - speaker: clerk
    text: 어떻게 고장 났어요?
    meaning:
      en: How did it break?
      pt: Como quebrou?
  - speaker: protagonist
    text: 지하철 계단에서 떨어뜨렸어요. 액정이 깨졌어요.
    meaning:
      en: I dropped it on the subway stairs. The screen cracked.
      pt: Deixei cair na escada do metrô. A tela trincou.
  - speaker: clerk
    text: 액정은 바꿔 드릴 수 있어요. 수리 비용은 십오만 원쯤이에요.
    meaning:
      en: We can replace the screen for you. The repair is about 150,000 won.
      pt: A tela a gente troca. O conserto fica uns 150 mil wons.
  - speaker: protagonist
    text: 며칠 걸려요?
    meaning:
      en: How many days does it take?
      pt: Quantos dias demora?
  - speaker: clerk
    text: 오늘 오후에 돼요. 백업은 했어요?
    meaning:
      en: This afternoon. Did you back it up?
      pt: Fica pronto hoje à tarde. Fez backup?
  - speaker: protagonist
    text: 네. 빨리 고쳐 주세요. 그동안 전화 좀 빌려 주세요.
    meaning:
      en: Yes. Please fix it quickly. Meanwhile, please lend me a phone.
      pt: Sim. Conserte rápido, por favor. Enquanto isso, me empresta um telefone.
  - speaker: clerk
    text: 여기 있어요. 두 시쯤 오세요.
    meaning:
      en: Here you are. Come back around two.
      pt: Aqui está. Volte por volta das duas.
