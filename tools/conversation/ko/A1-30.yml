steps:
- type: narrator
  text:
    en: Sunday hike up Bukhansan with Minjun and his father, who hikes every week. A review of all of A1. Listen to the conversation; you don't need to understand it yet.
    pt: Domingo de trilha no Bukhansan com o Minjun e o pai dele, que sobe toda semana. Revisão de todo o A1. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: abeoji
    text: 어서 와요. 등산 처음이에요?
    meaning:
      en: Welcome. Is this your first hike?
      pt: Seja bem-vindo. É sua primeira trilha?
  - speaker: protagonist
    text: 네, 처음이에요. 산이 정말 높아요.
    meaning:
      en: Yes, it's my first. The mountain is really high.
      pt: Sim, é a primeira. A montanha é bem alta.
  - speaker: minjun
    text: 형, 천천히 가. 힘들면 쉬어.
    meaning:
      en: Hyung, go slowly. Rest if it's hard.
      pt: Hyung, vai devagar. Descansa se cansar.
  - speaker: protagonist
    text: 괜찮아. 그런데 다리가 아파.
    meaning:
      en: I'm fine. But my legs hurt.
      pt: Tô bem. Mas a perna dói.
  - speaker: abeoji
    text: 저기서 쉬고 김밥 먹어요. 정상까지 삼십 분이에요.
    meaning:
      en: Let's rest there and eat gimbap. Thirty minutes to the summit.
      pt: Vamos descansar ali e comer 김밥. Faltam trinta minutos até o cume.
  - speaker: protagonist
    text: 감사합니다. 김밥 맛있어요!
    meaning:
      en: Thank you. The gimbap is delicious!
      pt: Obrigado. O 김밥 está gostoso!
  - speaker: minjun
    text: 자, 정상까지 가자! 파이팅!
    meaning:
      en: Right, to the summit! Let's go!
      pt: Bora, até o cume! Força!
  - speaker: protagonist
    text: 와, 정상이에요! 서울이 다 보여요!
    meaning:
      en: Wow, the summit! You can see all of Seoul!
      pt: Nossa, o cume! Dá para ver Seul inteira!
