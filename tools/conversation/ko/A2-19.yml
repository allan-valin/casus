steps:
- type: narrator
  text:
    en: You move to a bigger flat in the same building. A moving company packs, carries and unpacks everything. Listen to the conversation; you don't need to understand it yet.
    pt: Você se muda para um apartamento maior no mesmo prédio. A empresa de mudança embala, carrega e desembala tudo. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: mover
    text: 안녕하세요, 이삿짐센터에서 왔습니다.
    meaning:
      en: Hello, we're from the moving company.
      pt: Olá, somos da empresa de mudança.
  - speaker: protagonist
    text: 어서 오세요. 포장이사죠? 짐이 좀 많아요.
    meaning:
      en: Come in. It's the full-service move, right? I have quite a lot of things.
      pt: Entrem. É mudança completa, né? Tenho bastante coisa.
  - speaker: mover
    text: 걱정 마세요. 이 상자는 뭐예요?
    meaning:
      en: Don't worry. What's in this box?
      pt: Não se preocupe. O que tem nesta caixa?
  - speaker: protagonist
    text: 그릇이에요. 깨지기 쉬워요. 조심해 주세요.
    meaning:
      en: Dishes. They break easily. Please be careful.
      pt: Louça. É frágil. Tenham cuidado, por favor.
  - speaker: mover
    text: 네. 이 상자는 책상 위에다가 올려 둘게요.
    meaning:
      en: OK. I'll put this box on top of the desk.
      pt: Certo. Vou pôr esta caixa em cima da mesa.
  - speaker: protagonist
    text: 감사합니다. 저는 청소하면서 기다릴게요.
    meaning:
      en: Thank you. I'll clean while I wait.
      pt: Obrigada. Vou limpando enquanto espero.
  - speaker: mover
    text: 다 끝났어요. 옛날 열쇠는 집주인에게로 보냈어요.
    meaning:
      en: All done. We sent the old key to the owner.
      pt: Pronto. Mandamos a chave velha para o proprietário.
  - speaker: protagonist
    text: 정말 빠르네요! 이사가 벌써 끝났어요.
    meaning:
      en: That was so fast! The move is already done.
      pt: Que rápido! A mudança já terminou.
