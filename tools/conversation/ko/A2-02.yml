steps:
- type: narrator
  text:
    en: At the immigration office for your residence card. Take a number, fill in the form, wait. Listen to the conversation; you don't need to understand it yet.
    pt: No escritório de imigração para tirar o cartão de residente. Pegue uma senha, preencha o formulário, espere. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: clerk
    text: 어서 오세요. 무슨 일로 오셨어요?
    meaning:
      en: Welcome. What brings you here?
      pt: Bem-vindo. Em que posso ajudar?
  - speaker: protagonist
    text: 외국인등록증을 만들러 왔어요. 인터넷으로 예약했어요.
    meaning:
      en: I came to get a residence card. I booked online.
      pt: Vim tirar o cartão de residente. Agendei pela internet.
  - speaker: clerk
    text: 번호표 뽑고 기다려 주세요. 이 신청서도 작성해 주세요.
    meaning:
      en: Take a number and wait, please. And fill in this form.
      pt: Pegue uma senha e aguarde. Preencha também este formulário.
  - speaker: protagonist
    text: 여권하고 사진도 내야 해요?
    meaning:
      en: Do I have to hand in my passport and a photo too?
      pt: Preciso entregar passaporte e foto também?
  - speaker: clerk
    text: 네. 증명사진 있어요?
    meaning:
      en: Yes. Do you have an ID photo?
      pt: Sim. Tem foto 3x4?
  - speaker: protagonist
    text: 사진이 한 장밖에 없어요. 괜찮아요?
    meaning:
      en: I only have one photo. Is that OK?
      pt: Só tenho uma foto. Tudo bem?
  - speaker: clerk
    text: 한 장이면 돼요. 카드는 3주쯤 걸려요.
    meaning:
      en: One is enough. The card takes about three weeks.
      pt: Uma basta. O cartão demora umas três semanas.
  - speaker: protagonist
    text: 알겠어요. 그럼 다음 달에 은행 계좌를 만들려고 해요.
    meaning:
      en: I see. Then next month I intend to open a bank account.
      pt: Entendi. Então no mês que vem pretendo abrir conta no banco.
