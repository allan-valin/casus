steps:
- type: narrator
  text:
    en: Seoyeon and her boyfriend celebrate 100 days together — matching outfits, a gift. She tells you how they met. Listen to the conversation; you don't need to understand it yet.
    pt: A Seoyeon e o namorado comemoram 100 dias juntos — roupas iguais, um presente. Ela conta como se conheceram. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: seoyeon
    text: 언니, 오늘 남자 친구랑 100일이에요!
    meaning:
      en: Unni, today is 100 days with my boyfriend!
      pt: Unni, hoje faz 100 dias com meu namorado!
  - speaker: protagonist
    text: 와, 축하해요! 사귄 지 벌써 100일이에요?
    meaning:
      en: Wow, congratulations! It's already 100 days since you started dating?
      pt: Nossa, parabéns! Já faz 100 dias que vocês namoram?
  - speaker: seoyeon
    text: 네! 그래서 똑같은 옷을 입었어요.
    meaning:
      en: Yes! So we're wearing matching clothes.
      pt: Sim! Por isso estamos com roupas iguais.
  - speaker: protagonist
    text: 어떻게 만났어요?
    meaning:
      en: How did you meet?
      pt: Como vocês se conheceram?
  - speaker: seoyeon
    text: 학교에서 같은 수업을 들었어요. 그래서 친해지게 됐어요.
    meaning:
      en: We took the same class at university. That's how we got close.
      pt: Fazíamos a mesma aula na faculdade. Assim ficamos próximos.
  - speaker: protagonist
    text: 선물도 받았어요?
    meaning:
      en: Did you get a present too?
      pt: Ganhou presente também?
  - speaker: seoyeon
    text: 목걸이 받았어요. 저는 시계를 줬어요.
    meaning:
      en: I got a necklace. I gave him a watch.
      pt: Ganhei um colar. Eu dei um relógio.
  - speaker: protagonist
    text: 정말 부러워요!
    meaning:
      en: I'm so jealous!
      pt: Que inveja!
