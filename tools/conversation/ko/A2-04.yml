steps:
- type: narrator
  text:
    en: With your residence card you open an account. Everything needs phone verification. Listen to the conversation; you don't need to understand it yet.
    pt: Com o cartão de residente você abre uma conta. Tudo exige verificação pelo celular. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 안녕하세요. 계좌를 만들 수 있어요?
    meaning:
      en: Hello. Can I open an account?
      pt: Olá. Posso abrir uma conta?
  - speaker: clerk
    text: 네. 신분증 있으세요?
    meaning:
      en: Yes. Do you have ID?
      pt: Sim. Tem documento?
  - speaker: protagonist
    text: 외국인등록증 여기 있어요.
    meaning:
      en: Here's my residence card.
      pt: Aqui está o cartão de residente.
  - speaker: clerk
    text: 핸드폰도 있으세요? 본인인증을 해야 돼요.
    meaning:
      en: Do you have a phone too? We need to verify your identity.
      pt: Tem celular? Precisamos verificar a identidade.
  - speaker: protagonist
    text: 아직 한국 번호가 없어요. 그럼 만들 수 없어요?
    meaning:
      en: I don't have a Korean number yet. Then I can't open one?
      pt: Ainda não tenho número coreano. Então não posso abrir?
  - speaker: clerk
    text: 죄송하지만 오늘은 통장만 만들 수밖에 없어요. 체크카드는 다음에 돼요.
    meaning:
      en: Sorry, but today we can only do the bankbook. The debit card next time.
      pt: Desculpe, mas hoje só dá para fazer a caderneta. O cartão de débito, na próxima.
  - speaker: protagonist
    text: 알겠어요. 체크카드는 언제부터 쓸 수 있어요?
    meaning:
      en: OK. From when can I use the debit card?
      pt: Tá bom. A partir de quando posso usar o cartão?
  - speaker: clerk
    text: 번호 만드신 날부터 바로 돼요. 여기 서명해 주세요.
    meaning:
      en: Right from the day you get a number. Please sign here.
      pt: A partir do dia em que tiver o número, na hora. Assine aqui, por favor.
- type: narrator
