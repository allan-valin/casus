steps:
- type: narrator
  text:
    en: Mrs Park listens to trot on the radio while making side dishes. She explains the songs; you show her a Brazilian ballad. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Park escuta trot no rádio enquanto faz 반찬. Ela explica as músicas; você mostra uma balada brasileira. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: park
    text: 이 노래 들어 봐. 트로트야.
    meaning:
      en: Listen to this song. It's trot.
      pt: Escuta esta música. É trot.
  - speaker: protagonist
    text: 와, 신나네요! 가수가 누구예요?
    meaning:
      en: Wow, it's upbeat! Who's the singer?
      pt: Nossa, que animada! Quem é o cantor?
  - speaker: park
    text: 임영웅이야. 요즘 정말 유명해.
    meaning:
      en: Lim Young-woong. He's really famous these days.
      pt: Lim Young-woong. Está muito famoso agora.
  - speaker: protagonist
    text: 가사는 무슨 내용이에요?
    meaning:
      en: What are the lyrics about?
      pt: A letra fala de quê?
  - speaker: park
    text: 엄마 이야기야. 조금 슬퍼.
    meaning:
      en: It's about a mother. A bit sad.
      pt: Fala de mãe. É um pouco triste.
  - speaker: protagonist
    text: 아, 그래서 할머니가 우시는군요.
    meaning:
      en: Oh, so that's why you're crying.
      pt: Ah, por isso a senhora está chorando.
  - speaker: park
    text: 하하, 아니야. 양파 때문이야! 학생 노래도 들려줘.
    meaning:
      en: Haha, no. It's the onions! Play me one of your songs.
      pt: Haha, não. É a cebola! Me mostra uma música sua.
  - speaker: protagonist
    text: 이건 브라질 발라드예요. 같이 따라 불러요!
    meaning:
      en: This is a Brazilian ballad. Let's sing along!
      pt: Esta é uma balada brasileira. Vamos cantar junto!
