steps:
- type: narrator
  text:
    en: Mrs Park answers everything with a proverb. You start collecting them — and try one on Minjun. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Park responde tudo com um provérbio. Você começa a colecionar — e testa um com o Minjun. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 할머니, 한국어 배우기가 너무 어려워요.
    meaning:
      en: Grandma, learning Korean is so hard.
      pt: Vovó, aprender coreano é difícil demais.
  - speaker: park
    text: 시작이 반이야. 벌써 반 했어!
    meaning:
      en: Starting is half the job. You've already done half!
      pt: Começar é metade. Você já fez metade!
  - speaker: protagonist
    text: 그 말 뜻이 뭐예요?
    meaning:
      en: What does that mean?
      pt: O que quer dizer isso?
  - speaker: park
    text: 속담이야. 시작하기가 제일 어렵다는 뜻이야.
    meaning:
      en: It's a proverb. It means starting is the hardest part.
      pt: É um provérbio. Quer dizer que começar é o mais difícil.
  - speaker: protagonist
    text: 좋은 말이네요. 말하기는 아직 어려워요.
    meaning:
      en: Nice saying. Speaking is still hard.
      pt: Que bonito. A fala ainda é difícil.
  - speaker: park
    text: 괜찮아. 저기 '출입 금지' 보여? 그런 건 읽음으로 배워.
    meaning:
      en: It's fine. See 'no entry' there? You learn things like that by reading.
      pt: Tudo bem. Está vendo 'proibida a entrada' ali? Isso se aprende lendo.
  - speaker: protagonist
    text: 네! 내일 민준이한테도 '시작이 반'이라고 할게요.
    meaning:
      en: Yes! Tomorrow I'll tell Minjun 'starting is half' too.
      pt: Sim! Amanhã vou dizer 'começar é metade' para o Minjun também.
  - speaker: park
    text: 하하, 눈치가 빠르네!
    meaning:
      en: Haha, you catch on fast!
      pt: Haha, você pega rápido!
- type: narrator
  text:
    en: '-기 turns a verb into a noun: 배우다 → 배우기, learning; 말하다 → 말하기, speaking. 배우기가 어려워요: learning is hard.'
    pt: '-기 transforma o verbo em substantivo: 배우다 → 배우기, aprender; 말하다 → 말하기, a fala. 배우기가 어려워요: aprender é difícil.'
