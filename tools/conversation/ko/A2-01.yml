steps:
- type: narrator
  text:
    en: 'Monday morning on the stairs. Minjun, in casual speech now, asks about your weekend: you tried cycling along the Han for the first time. Listen to the conversation; you don''t need to understand
      it yet.'
    pt: 'Segunda de manhã na escada. O Minjun, agora em 반말, pergunta do seu fim de semana: você andou de bicicleta pelo rio Han pela primeira vez. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: minjun
    text: 누나, 주말에 뭐 했어?
    meaning:
      en: Nuna, what did you do at the weekend?
      pt: Nuna, o que você fez no fim de semana?
  - speaker: protagonist
    text: 한강에서 자전거 타 봤어. 처음이었어!
    meaning:
      en: I tried cycling by the Han. It was my first time!
      pt: Andei de bicicleta no rio Han. Foi a primeira vez!
  - speaker: minjun
    text: 와, 자전거 어디서 빌렸어?
    meaning:
      en: Wow, where did you rent a bike?
      pt: Nossa, onde você alugou a bicicleta?
  - speaker: protagonist
    text: 따릉이 빌렸어. 앱으로 했어.
    meaning:
      en: I rented a Ttareungi. With the app.
      pt: Aluguei uma 따릉이. Pelo aplicativo.
  - speaker: minjun
    text: 재미있었어? 나는 따릉이 타 본 적이 없어.
    meaning:
      en: Was it fun? I've never ridden a Ttareungi.
      pt: Foi divertido? Eu nunca andei de 따릉이.
  - speaker: protagonist
    text: 진짜? 재미있었어. 그런데 지금 좀 피곤해.
    meaning:
      en: Really? It was fun. But I'm a bit tired now.
      pt: Sério? Foi divertido. Mas agora estou meio cansada.
  - speaker: minjun
    text: 다음에 같이 가자!
    meaning:
      en: Let's go together next time!
      pt: Da próxima vez vamos juntos!
  - speaker: protagonist
    text: 좋아! 다음 주말에 타 보자.
    meaning:
      en: OK! Let's try next weekend.
      pt: Bora! No próximo fim de semana.
- type: narrator
  text:
