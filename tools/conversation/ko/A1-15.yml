steps:
- type: narrator
  text:
    en: 'You bought a sofa online yesterday. Minjun helps you measure the room: will it fit? Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Ontem você comprou um sofá pela internet. O Minjun ajuda a medir o quarto: vai caber? Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: 민준 씨, 저 어제 소파를 샀어요.
    meaning:
      en: Minjun, I bought a sofa yesterday.
      pt: Minjun, ontem eu comprei um sofá.
  - speaker: minjun
    text: 와, 진짜요? 방이 좁아요. 들어가요?
    meaning:
      en: Wow, really? The room is small. Will it fit?
      pt: Sério? O quarto é apertado. Vai caber?
  - speaker: protagonist
    text: 몰라요. 같이 재요!
    meaning:
      en: I don't know. Let's measure!
      pt: Não sei. Vamos medir!
  - speaker: minjun
    text: 이쪽은 삼 미터예요. 저쪽은 이 미터예요.
    meaning:
      en: This side is three metres. That side is two.
      pt: Este lado tem três metros. Aquele, dois.
  - speaker: protagonist
    text: 소파는 이 미터예요. 들어가요!
    meaning:
      en: The sofa is two metres. It fits!
      pt: O sofá tem dois metros. Cabe!
  - speaker: minjun
    text: 의자는 몇 개 샀어요?
    meaning:
      en: How many chairs did you buy?
      pt: Quantas cadeiras você comprou?
  - speaker: protagonist
    text: 의자는 두 개 샀어요. 손님 두 명 와요.
    meaning:
      en: Two chairs. Two guests are coming.
      pt: Duas. Vêm duas visitas.
  - speaker: minjun
    text: 아, 소파가 왔어요! 넓어요… 방보다 넓어요!
    meaning:
      en: Oh, the sofa has arrived! It's wide… wider than the room!
      pt: Ah, o sofá chegou! É largo… mais largo que o quarto!
- type: narrator
  text:
    en: 'The past adds -았- or -었- before -어요: 사다 → 샀어요, 오다 → 왔어요, 하다 → 했어요.'
    pt: 'O passado acrescenta -았- ou -었- antes de -어요: 사다 → 샀어요, 오다 → 왔어요, 하다 → 했어요.'
