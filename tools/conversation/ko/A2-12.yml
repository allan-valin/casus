steps:
- type: narrator
  text:
    en: 'Minjun shows you a map of Korea for your holiday plans: mountains almost everywhere, the sea on three sides, Jeju island. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'O Minjun mostra um mapa da Coreia para seus planos de férias: montanha quase em todo lugar, mar em três lados, a ilha de Jeju. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: minjun
    text: 형, 이게 한국 지도야. 한국은 반도야.
    meaning:
      en: Hyung, this is a map of Korea. Korea is a peninsula.
      pt: Hyung, este é o mapa da Coreia. A Coreia é uma península.
  - speaker: protagonist
    text: 삼면이 바다네. 그리고 산이 정말 많아.
    meaning:
      en: Sea on three sides. And so many mountains.
      pt: Mar em três lados. E muita montanha.
  - speaker: minjun
    text: 응, 높은 산이 많아. 제일 높은 산은 한라산이야.
    meaning:
      en: Yeah, lots of high mountains. The highest is Hallasan.
      pt: É, tem muita montanha alta. A mais alta é o Hallasan.
  - speaker: protagonist
    text: 한라산은 어디 있어?
    meaning:
      en: Where is Hallasan?
      pt: Onde fica o Hallasan?
  - speaker: minjun
    text: 제주도에 있어. 제주도는 제일 큰 섬이야.
    meaning:
      en: On Jeju. Jeju is the biggest island.
      pt: Em Jeju. Jeju é a maior ilha.
  - speaker: protagonist
    text: 휴가 때 갈 곳을 찾고 있어. 제주도 어때?
    meaning:
      en: I'm looking for a place to go on holiday. How about Jeju?
      pt: Estou procurando um lugar para ir nas férias. Que tal Jeju?
  - speaker: minjun
    text: 좋아! 우리 이모가 사는 곳이야. 바다가 예뻐.
    meaning:
      en: Great! It's where my aunt lives. The sea is beautiful.
      pt: Ótimo! É onde minha tia mora. O mar é lindo.
  - speaker: protagonist
    text: 그럼 결정했어. 제주도에 갈 거야!
    meaning:
      en: Then it's decided. I'm going to Jeju!
      pt: Então está decidido. Vou para Jeju!
