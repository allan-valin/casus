steps:
- type: narrator
  text:
    en: Minjun likes a girl from his futsal team. He explains 썸 (the 'something' before dating) and 고백, the confession before a couple begins. Listen to the conversation; you don't need to understand it
      yet.
    pt: O Minjun gosta de uma menina do time de futsal. Ele explica o 썸 (o 'algo' antes de namorar) e o 고백, a declaração antes de virar casal. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: minjun
    text: 형, 나 좋아하는 사람 생겼어.
    meaning:
      en: Hyung, I've got someone I like.
      pt: Hyung, estou gostando de alguém.
  - speaker: protagonist
    text: 진짜? 누구야? 사귀어?
    meaning:
      en: Really? Who? Are you going out?
      pt: Sério? Quem? Vocês namoram?
  - speaker: minjun
    text: 아직 아니야. 썸이야. 풋살 팀 친구야.
    meaning:
      en: Not yet. It's 'something'. A friend from the futsal team.
      pt: Ainda não. É um 썸. Uma amiga do time de futsal.
  - speaker: protagonist
    text: 썸이 뭐야?
    meaning:
      en: What's 'sseom'?
      pt: O que é 썸?
  - speaker: minjun
    text: 사귀기 전에 서로 마음이 있는 거야. 그래서 고백해야 돼.
    meaning:
      en: When you like each other before dating. So you have to confess.
      pt: Quando um gosta do outro antes de namorar. Por isso tem que se declarar.
  - speaker: protagonist
    text: 브라질에는 고백이 없어. 그냥 사귀게 돼.
    meaning:
      en: In Brazil there's no confession. You just end up dating.
      pt: No Brasil não tem declaração. A gente simplesmente acaba namorando.
  - speaker: minjun
    text: 신기하다! 그럼 나 고백할까? 너무 떨려.
    meaning:
      en: Interesting! So should I confess? I'm so nervous.
      pt: Que curioso! Então, será que me declaro? Estou muito nervoso.
  - speaker: protagonist
    text: 용기 내! 직접 말해. 잘될 거야.
    meaning:
      en: Be brave! Tell her yourself. It'll go well.
      pt: Coragem! Fala direto com ela. Vai dar certo.
