steps:
- type: narrator
  text:
    en: A colleague set you up on a sogaeting, a blind date. A café in Hapjeong; her name is Hana. Listen to the conversation; you don't need to understand it yet.
    pt: Uma colega arranjou um 소개팅, um encontro às cegas. Um café em Hapjeong; o nome dela é Hana. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: hana
    text: 안녕하세요, 저는 김하나예요. 처음 뵙겠습니다.
    meaning:
      en: Hello, I'm Kim Hana. Nice to meet you.
      pt: Olá, eu sou Kim Hana. Muito prazer.
  - speaker: protagonist
    text: 반가워요. 지은 씨한테서 이야기 많이 들었어요.
    meaning:
      en: Glad to meet you. I've heard a lot about you from Jieun.
      pt: Prazer. Ouvi falar muito de você pela Jieun.
  - speaker: hana
    text: 브라질에서 오셨는데 한국어를 정말 잘하시네요!
    meaning:
      en: You came from Brazil, but your Korean is really good!
      pt: Você veio do Brasil, mas fala coreano muito bem!
  - speaker: protagonist
    text: 아니에요. 아직 많이 배워야 돼요. 취미가 뭐예요?
    meaning:
      en: Not at all. I still have a lot to learn. What are your hobbies?
      pt: Que nada. Ainda tenho muito que aprender. Quais são seus hobbies?
  - speaker: hana
    text: 영화 보는 거 좋아해요. 주말에 자주 봐요.
    meaning:
      en: I like watching films. I often watch them at weekends.
      pt: Gosto de ver filmes. Vejo muito nos fins de semana.
  - speaker: protagonist
    text: 저도요! 이번 주에 좋은 영화가 나온 것 같아요.
    meaning:
      en: Me too! I think a good film just came out this week.
      pt: Eu também! Acho que saiu um filme bom esta semana.
  - speaker: hana
    text: 그럼 다음에 같이 볼까요? 연락처 알려 주세요.
    meaning:
      en: Then shall we see it together next time? Give me your number.
      pt: Então vamos ver juntos da próxima vez? Me passa seu contato.
  - speaker: protagonist
    text: 네, 좋아요! 오늘 정말 재미있었어요.
    meaning:
      en: Yes, great! Today was really fun.
      pt: Claro! Hoje foi muito divertido.
