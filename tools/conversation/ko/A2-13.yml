steps:
- type: narrator
  text:
    en: 'Friday night in Hongdae with Seoyeon: a club with an ID check, dancing, and the question of the last subway. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Sexta à noite em Hongdae com a Seoyeon: uma balada com checagem de documento, dança e a questão do último metrô. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: seoyeon
    text: 언니, 클럽 들어가기 전에 신분증 보여 줘야 돼요.
    meaning:
      en: Unni, before going into the club you have to show ID.
      pt: Unni, antes de entrar na balada tem que mostrar documento.
  - speaker: protagonist
    text: 외국인등록증 보여 주면 돼요?
    meaning:
      en: Is it OK if I show my residence card?
      pt: Posso mostrar o cartão de residente?
  - speaker: seoyeon
    text: 네, 돼요. 들어가요!
    meaning:
      en: Yes, that's fine. Let's go in!
      pt: Pode. Vamos entrar!
  - speaker: protagonist
    text: 와, 시끄러워요! 사람이 정말 많아요.
    meaning:
      en: Wow, it's loud! So many people.
      pt: Nossa, que barulho! Quanta gente.
  - speaker: seoyeon
    text: 춤추다가 더우면 밖에서 쉬어요.
    meaning:
      en: If you get hot while dancing, take a break outside.
      pt: Se ficar com calor dançando, descansa lá fora.
  - speaker: protagonist
    text: 벌써 열두 시예요! 막차가 몇 시예요?
    meaning:
      en: It's already midnight! When's the last subway?
      pt: Já é meia-noite! Que horas é o último metrô?
  - speaker: seoyeon
    text: 막차는 끝났어요. 늦으면 첫차 타거나 택시 타요.
    meaning:
      en: The last one's gone. If it's late, you take the first train or a taxi.
      pt: O último já foi. Se ficar tarde, pega o primeiro trem ou táxi.
  - speaker: protagonist
    text: 그럼 첫차까지 춤춰요!
    meaning:
      en: Then we dance until the first train!
      pt: Então a gente dança até o primeiro trem!
