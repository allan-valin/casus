steps:
- type: narrator
  text:
    en: Mrs Park sees you carrying six bottles of water upstairs. Tap water, filters, boiled barley tea — she explains. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Park vê você subindo com seis garrafas de água. Água da torneira, filtros, chá de cevada fervido — ela explica. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: park
    text: 아이고, 물을 왜 이렇게 많이 샀어?
    meaning:
      en: Goodness, why did you buy so much water?
      pt: Nossa, por que comprou tanta água?
  - speaker: protagonist
    text: 수돗물이 깨끗하지 않기 때문에요.
    meaning:
      en: Because the tap water isn't clean.
      pt: Porque a água da torneira não é limpa.
  - speaker: park
    text: 아니야, 서울 수돗물은 깨끗해. 마셔도 돼.
    meaning:
      en: No, Seoul's tap water is clean. You can drink it.
      pt: Não, a água da torneira de Seul é limpa. Pode beber.
  - speaker: protagonist
    text: 정말요? 그런데 할머니는 정수기를 쓰시잖아요.
    meaning:
      en: Really? But you use a purifier.
      pt: Sério? Mas a senhora usa purificador.
  - speaker: park
    text: 냄새 때문에 써. 나는 보리차를 끓여서 마셔.
    meaning:
      en: I use it because of the smell. I boil barley tea and drink that.
      pt: Uso por causa do cheiro. Eu fervo chá de cevada e bebo.
  - speaker: protagonist
    text: 보리차요? 맛있어요?
    meaning:
      en: Barley tea? Is it good?
      pt: Chá de cevada? É gostoso?
  - speaker: park
    text: 구수해. 이리 와, 한 잔 마셔 봐. 물은 사지 마. 무겁잖아!
    meaning:
      en: It's nutty. Come here, try a cup. Don't buy water. It's heavy!
      pt: É torradinho. Vem cá, prova uma xícara. Não compra água. É pesado!
  - speaker: protagonist
    text: 네, 감사합니다. 물값도 아껴야 해요.
    meaning:
      en: Yes, thank you. I have to save on water, too.
      pt: Sim, obrigada. Tenho que economizar com água também.
- type: narrator
  text:
    en: From A2 Mrs Park speaks 반말 to you — natural for a 70-year-old with a younger tenant. You answer in 해요체, always.
    pt: A partir do A2 a senhora Park fala 반말 com você — natural para uma senhora de 70 anos com uma inquilina mais jovem. Você responde em 해요체, sempre.
