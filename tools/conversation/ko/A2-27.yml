steps:
- type: narrator
  text:
    en: A skincare shop with Seoyeon. Ten steps of creams, advertising everywhere, and talk about the pressure to look good. Listen to the conversation; you don't need to understand it yet.
    pt: Uma loja de cuidados com a pele com a Seoyeon. Dez passos de cremes, propaganda por toda parte e uma conversa sobre a pressão pela aparência. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: seoyeon
    text: 언니, 이 크림 좋아요. 제가 어제 산 크림이에요.
    meaning:
      en: Unni, this cream is good. It's the one I bought yesterday.
      pt: Unni, este creme é bom. É o que eu comprei ontem.
  - speaker: protagonist
    text: 와, 서연 씨 피부가 정말 좋아 보여요.
    meaning:
      en: Wow, your skin looks really good.
      pt: Nossa, sua pele parece ótima.
  - speaker: seoyeon
    text: 고마워요. 한국에서는 스킨케어가 열 단계예요.
    meaning:
      en: Thanks. In Korea skincare is ten steps.
      pt: Obrigada. Na Coreia o skincare tem dez passos.
  - speaker: protagonist
    text: 열 단계요? 부담스러워요!
    meaning:
      en: Ten steps? That's a lot!
      pt: Dez passos? É demais!
  - speaker: seoyeon
    text: 맞아요. 광고도 많고, 외모 압박이 있는 것 같아요.
    meaning:
      en: True. There's a lot of advertising, and I think there's pressure about looks.
      pt: É verdade. Tem muita propaganda, e acho que há pressão pela aparência.
  - speaker: protagonist
    text: 성형도 많이 해요?
    meaning:
      en: Do people have a lot of cosmetic surgery?
      pt: O pessoal faz muita plástica?
  - speaker: seoyeon
    text: 하는 사람도 있어요. 그런데 요즘은 자연스러운 게 좋아요.
    meaning:
      en: Some do. But these days natural looks are in.
      pt: Alguns fazem. Mas hoje em dia o natural está em alta.
  - speaker: protagonist
    text: 저는 선크림 하나면 돼요. 그래도 젊어 보여요?
    meaning:
      en: One sunscreen is enough for me. Do I still look young?
      pt: Para mim basta um protetor solar. Mesmo assim pareço jovem?
