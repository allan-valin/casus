steps:
- type: narrator
  text:
    en: Lunch with the team at a stew restaurant near the office. The team lead orders; the eldest starts eating. Listen to the conversation; you don't need to understand it yet.
    pt: Almoço com a equipe num restaurante de ensopados perto do escritório. A líder pede; o mais velho começa a comer. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: jieun
    text: 점심 같이 먹어요. 김치찌개 어때요?
    meaning:
      en: Let's have lunch together. How about kimchi stew?
      pt: Vamos almoçar juntos. Que tal 김치찌개?
  - speaker: protagonist
    text: 좋아요. 배고파요! 그런데 매워요?
    meaning:
      en: Great. I'm hungry! But is it spicy?
      pt: Ótimo. Estou com fome! Mas é apimentado?
  - speaker: jieun
    text: 조금 매워요. 된장찌개는 안 매워요.
    meaning:
      en: A little. Soybean stew isn't spicy.
      pt: Um pouco. O de soja não é.
  - speaker: protagonist
    text: 그럼 저는 김치찌개 먹어요. 매운 거 좋아해요.
    meaning:
      en: Then I'll have kimchi stew. I like spicy food.
      pt: Então eu como o de kimchi. Gosto de comida apimentada.
  - speaker: jieun
    text: 음식 나왔어요. 부장님, 먼저 드세요.
    meaning:
      en: The food is here. Director, please start.
      pt: A comida chegou. Diretor, pode começar.
  - speaker: protagonist
    text: 와, 맛있어요! 맵고 맛있어요.
    meaning:
      en: Wow, it's good! Spicy and tasty.
      pt: Nossa, que gostoso! Apimentado e gostoso.
  - speaker: jieun
    text: 물 좀 드세요. 얼굴이 빨개요!
    meaning:
      en: Have some water. Your face is red!
      pt: Beba uma água. Seu rosto está vermelho!
  - speaker: protagonist
    text: 괜찮아요. 맵고… 정말 맛있어요!
    meaning:
      en: I'm fine. It's spicy and… really good!
      pt: Estou bem. É apimentado e… muito gostoso!
