steps:
- type: narrator
  text:
    en: July heat. The air conditioner has been on all day; Mrs Park warns you about the summer electricity bill. Listen to the conversation; you don't need to understand it yet.
    pt: Calor de julho. O ar-condicionado ficou ligado o dia todo; a senhora Park avisa sobre a conta de luz do verão. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: park
    text: 학생, 에어컨이 하루 종일 켜져 있어!
    meaning:
      en: Your air conditioner has been on all day!
      pt: Seu ar-condicionado ficou ligado o dia todo!
  - speaker: protagonist
    text: 죄송해요. 너무 더워서요. 지금도 일하고 있어요.
    meaning:
      en: Sorry. It's so hot. I'm working now, too.
      pt: Desculpe. Está muito calor. Estou trabalhando agora também.
  - speaker: park
    text: 일하는 동안에는 괜찮아. 그런데 나갈 때는 꺼.
    meaning:
      en: While you're working, fine. But turn it off when you go out.
      pt: Enquanto trabalha, tudo bem. Mas quando sair, desliga.
  - speaker: protagonist
    text: 네. 전기 요금이 많이 나와요?
    meaning:
      en: Yes. Is the electricity bill high?
      pt: Sim. A conta de luz vem alta?
  - speaker: park
    text: 여름에는 많이 쓰면 더 비싸. 전기를 아껴야 돼.
    meaning:
      en: In summer it gets dearer the more you use. You have to save electricity.
      pt: No verão, quanto mais usa, mais caro. Tem que economizar.
  - speaker: protagonist
    text: 그럼 선풍기를 쓸게요.
    meaning:
      en: Then I'll use a fan.
      pt: Então vou usar ventilador.
  - speaker: park
    text: 그리고 창문이 열려 있어. 에어컨 켤 때는 창문 닫아.
    meaning:
      en: And your window is open. Close it when the air conditioner is on.
      pt: E a sua janela está aberta. Quando ligar o ar, fecha.
  - speaker: protagonist
    text: 아, 몰랐어요. 감사합니다, 할머니.
    meaning:
      en: Oh, I didn't know. Thank you, grandma.
      pt: Ah, eu não sabia. Obrigado, vovó.
