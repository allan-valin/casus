  text:
    en: 'Between two nouns, ''and'' is 과 after a consonant and 와 after a vowel: 침대와 책상, 책상과 침대. In talk people often say 하고.'
    pt: 'Entre dois substantivos, ''e'' é 과 depois de consoante e 와 depois de vogal: 침대와 책상, 책상과 침대. Na fala se usa muito 하고.'
