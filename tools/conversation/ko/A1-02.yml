steps:
- type: narrator
  text:
    en: Mrs Park shows you your one-room flat. Shoes come off at the door. A young neighbour passes by. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Park mostra o seu 원룸, o quarto-apartamento. Os sapatos ficam na porta. Um vizinho jovem passa. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: park
    text: 여기가 방이에요.
    meaning:
      en: This is the room.
      pt: Aqui é o quarto.
  - speaker: protagonist
    text: 와, 좋아요! 화장실이 어디예요?
    meaning:
      en: Wow, nice! Where is the bathroom?
      pt: Nossa, que bom! Onde é o banheiro?
  - speaker: park
    text: 화장실이 저기 있어요. 침대와 책상이 여기 있어요.
    meaning:
      en: The bathroom is over there. The bed and the desk are here.
      pt: O banheiro fica ali. A cama e a escrivaninha ficam aqui.
  - speaker: protagonist
    text: 비밀번호가 뭐예요?
    meaning:
      en: What is the door code?
      pt: Qual é a senha da porta?
  - speaker: park
    text: 비밀번호가 여기 있어요. 아, 신발!
    meaning:
      en: The code is here. Oh, your shoes!
      pt: A senha está aqui. Ah, os sapatos!
  - speaker: protagonist
    text: 아, 죄송합니다.
    meaning:
      en: Oh, I'm sorry.
      pt: Ah, desculpe.
  - speaker: minjun
    text: 안녕하세요. 옆집 사람이에요.
    meaning:
      en: Hello. I live next door.
      pt: Olá. Sou o vizinho do lado.
  - speaker: protagonist
    text: 아, 안녕하세요. 반가워요.
    meaning:
      en: Oh, hello. Glad to meet you.
      pt: Ah, olá. Prazer.
- type: narrator
  text:
    en: '''여기가 방이에요'': here is the room. 이/가 marks who or what the sentence is about doing or being: 방이, 화장실이 after a consonant; 여기가 after a vowel.'
    pt: '''여기가 방이에요'': aqui é o quarto. 이/가 marca o sujeito: 방이, 화장실이 depois de consoante; 여기가 depois de vogal.'
