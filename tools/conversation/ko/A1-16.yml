steps:
- type: narrator
  text:
    en: Ten at night, you are still working. Minjun shows you how to order fried chicken on a delivery app. Listen to the conversation; you don't need to understand it yet.
    pt: Dez da noite, você ainda está trabalhando. O Minjun mostra como pedir frango frito pelo aplicativo de entrega. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: minjun
    text: 형, 아직 일해요? 밥 먹었어요?
    meaning:
      en: Hyung, still working? Did you eat?
      pt: Hyung, ainda trabalhando? Já comeu?
  - speaker: protagonist
    text: 아니요, 안 먹었어요. 요리는 못 해요.
    meaning:
      en: No, I didn't. I can't cook.
      pt: Não, não comi. Não sei cozinhar.
  - speaker: minjun
    text: 늦었으니까 치킨 시켜요. 배달 앱으로 주문해요.
    meaning:
      en: It's late, so let's get chicken. We'll order on the delivery app.
      pt: Está tarde, então vamos pedir frango. Pelo aplicativo.
  - speaker: protagonist
    text: 지금 밤 열 시예요. 배달 돼요?
    meaning:
      en: It's ten at night now. Do they deliver?
      pt: Agora são dez da noite. Eles entregam?
  - speaker: minjun
    text: 그럼요! 한국은 밤에도 배달해요.
    meaning:
      en: Of course! In Korea they deliver at night too.
      pt: Claro! Na Coreia entregam de noite também.
  - speaker: protagonist
    text: 몇 분 걸려요?
    meaning:
      en: How many minutes does it take?
      pt: Quanto tempo demora?
  - speaker: minjun
    text: 삼십 분이요. 빨리 와요.
    meaning:
      en: Thirty minutes. It comes fast.
      pt: Trinta minutos. Chega rápido.
  - speaker: protagonist
    text: 와, 벌써 배달 왔어요!
    meaning:
      en: Wow, the delivery is already here!
      pt: Nossa, a entrega já chegou!
- type: narrator
  text:
    en: '안 before a verb is ''not'': 안 먹었어요, I didn''t eat. 못 is ''cannot'': 요리는 못 해요, I can''t cook.'
    pt: '안 antes do verbo é ''não'': 안 먹었어요, não comi. 못 é ''não consegue'': 요리는 못 해요, não sei cozinhar.'
