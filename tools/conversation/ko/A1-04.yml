    en: 'To buy, point and say 이거 주세요, ''give me this''. 주세요 goes after anything: 물 주세요, 라면 주세요.'
    pt: 'Para comprar, aponte e diga 이거 주세요, ''me dá isto''. 주세요 vai depois de qualquer coisa: 물 주세요, 라면 주세요.'
