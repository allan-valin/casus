steps:
- type: narrator
  text:
    en: Downstairs is a convenience store open day and night. You buy water and instant noodles from the owner. Listen to the conversation; you don't need to understand it yet.
    pt: No térreo há uma loja de conveniência aberta dia e noite. Você compra água e 라면 com o dono. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sajang
    text: 어서 오세요.
    meaning:
      en: Welcome.
      pt: Seja bem-vindo.
  - speaker: protagonist
    text: 안녕하세요. 물이 어디 있어요?
    meaning:
      en: Hello. Where is the water?
      pt: Olá. Onde fica a água?
  - speaker: sajang
    text: 물은 저기 있어요.
    meaning:
      en: The water is over there.
      pt: A água fica ali.
  - speaker: protagonist
    text: 이거 주세요. 라면도 주세요.
    meaning:
      en: This one, please. And noodles too.
      pt: Me dá esta. E um lámen também.
  - speaker: sajang
    text: 봉투 필요하세요?
    meaning:
      en: Do you need a bag?
      pt: Precisa de sacola?
  - speaker: protagonist
    text: 네, 봉투도 주세요. 얼마예요?
    meaning:
      en: Yes, a bag too. How much is it?
      pt: Sim, uma sacola também. Quanto é?
  - speaker: sajang
    text: 삼천 원이에요.
    meaning:
      en: Three thousand won.
      pt: Três mil won.
  - speaker: protagonist
    text: 몇 시까지 해요?
    meaning:
      en: Until what time are you open?
      pt: Até que horas funciona?
  - speaker: sajang
    text: 우리 가게는 밤에도 해요. 스물네 시간 해요!
    meaning:
      en: Our shop is open at night too. Twenty-four hours!
      pt: Nossa loja abre de noite também. Vinte e quatro horas!
