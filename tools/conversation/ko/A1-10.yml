- type: narrator
  text:
    en: 'Phone numbers are read digit by digit, zero is 공: 010 is 공일공.'
    pt: 'Telefones se leem dígito a dígito, o zero é 공: 010 é 공일공.'
- type: prompt
  ask:
    en: Give the number 010-2345-6789.
    pt: Diga o número 010-2345-6789.
  answer:
    speaker: protagonist
    text: 공일공, 이삼사오, 육칠팔구예요.
  items:
  - gong
- type: narrator
  text:
    en: 'Money: 백 100, 천 1,000, 만 10,000. Korean counts in ten-thousands: 만 원, 10,000 won.'
    pt: 'Dinheiro: 백 100, 천 1.000, 만 10.000. O coreano conta de dez mil em dez mil: 만 원, 10.000 won.'
- type: prompt
  ask:
    en: 'Say: one hundred won.'
    pt: 'Diga: cem won.'
  answer:
    speaker: protagonist
    text: 백 원.
  items:
  - baek
- type: prompt
  ask:
    en: 'Say: three thousand won.'
