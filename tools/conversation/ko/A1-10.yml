steps:
- type: narrator
  text:
    en: 'The shop owner signs you up for the store''s points card: he needs your phone number. You only have your card, no cash. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'O dono inscreve você no cartão de pontos da loja: precisa do seu telefone. Você só tem cartão, nada de dinheiro. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: sajang
    text: 전화번호가 뭐예요?
    meaning:
      en: What's your phone number?
      pt: Qual é o seu telefone?
  - speaker: protagonist
    text: 공일공, 이삼사오, 육칠팔구예요.
    meaning:
      en: 010-2345-6789.
      pt: 010-2345-6789.
  - speaker: sajang
    text: 네, 좋아요. 라면 두 개, 삼천 원이에요.
    meaning:
      en: OK, good. Two noodles, three thousand won.
      pt: Certo. Dois lámens, três mil wons.
  - speaker: protagonist
    text: 죄송합니다. 카드만 있어요. 현금은 없어요.
    meaning:
      en: Sorry. I only have a card. No cash.
      pt: Desculpe. Só tenho cartão. Dinheiro não tenho.
  - speaker: sajang
    text: 괜찮아요. 카드 돼요.
    meaning:
      en: No problem. Cards are fine.
      pt: Tudo bem. Aceita cartão.
  - speaker: protagonist
    text: 이 우산은 얼마예요?
    meaning:
      en: How much is this umbrella?
      pt: Quanto é este guarda-chuva?
  - speaker: sajang
    text: 만 원이에요.
    meaning:
      en: Ten thousand won.
      pt: Dez mil wons.
  - speaker: protagonist
    text: 만 원? 아, 비싸요… 라면만 주세요.
    meaning:
      en: Ten thousand? Oh, expensive… just the noodles, please.
      pt: Dez mil? Ah, caro… só os lámens, por favor.
- type: narrator
  text:
    en: 'Korean has two sets of numbers. For money, phone numbers, minutes and floors: 일, 이, 삼, 사, 오, 육, 칠, 팔, 구, 십. For age and counting things: 하나, 둘, 셋.'
    pt: 'O coreano tem dois conjuntos de números. Para dinheiro, telefone, minutos e andares: 일, 이, 삼, 사, 오, 육, 칠, 팔, 구, 십. Para idade e para contar coisas: 하나, 둘, 셋.'
- type: prompt
  ask:
    en: Count one, two, three — the Sino-Korean way.
    pt: Conte um, dois, três — com os sino-coreanos.
  answer:
    speaker: protagonist
    text: 일, 이, 삼.
  items:
  - il-i-sam
- type: prompt
  ask:
    en: 'Go on: four, five, six.'
    pt: 'Continue: quatro, cinco, seis.'
