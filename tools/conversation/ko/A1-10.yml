  items:
  - man-won
- type: narrator
  text:
    en: 'A different 만 after a noun means ''only'': 카드만 있어요, I only have a card. 라면만 주세요, only the noodles.'
    pt: 'Outro 만, depois de um substantivo, quer dizer ''só'': 카드만 있어요, só tenho cartão. 라면만 주세요, só os lámens.'
- type: prompt
  ask:
