steps:
- type: narrator
  text:
    en: After a video call to São Paulo — twelve hours apart — you sit on the stairs, sad. Mrs Park sits next to you. Listen to the conversation; you don't need to understand it yet.
    pt: Depois de uma chamada de vídeo para São Paulo — doze horas de diferença — você senta na escada, triste. A senhora Park senta ao seu lado. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: park
    text: 왜 여기 앉아 있어? 무슨 일 있어?
    meaning:
      en: Why are you sitting here? Is something wrong?
      pt: Por que está sentada aqui? Aconteceu alguma coisa?
  - speaker: protagonist
    text: 방금 엄마하고 영상통화 했어요. 가족이 너무 보고 싶어요.
    meaning:
      en: I just video-called my mum. I miss my family so much.
      pt: Acabei de fazer chamada de vídeo com minha mãe. Sinto muita saudade da família.
  - speaker: park
    text: 시차가 크지?
    meaning:
      en: The time difference is big, isn't it?
      pt: O fuso é grande, né?
  - speaker: protagonist
    text: 네, 열두 시간이에요. 엄마에게서 매일 문자가 와요.
    meaning:
      en: Yes, twelve hours. My mum texts me every day.
      pt: Sim, doze horas. Todo dia chega mensagem da minha mãe.
  - speaker: park
    text: 좋은 엄마네. 울지 마. 괜찮아질 거야.
    meaning:
      en: A good mother. Don't cry. It'll get better.
      pt: Boa mãe. Não chora. Vai melhorar.
  - speaker: protagonist
    text: 가끔 외로워요. 고향 음식도 그리워요.
    meaning:
      en: Sometimes I'm lonely. I miss the food from home, too.
      pt: Às vezes me sinto sozinha. Sinto falta da comida de casa também.
  - speaker: park
    text: 그럼 오늘 저녁은 나랑 같이 먹자. 내가 만들어 줄게.
    meaning:
      en: Then have dinner with me tonight. I'll make something for you.
      pt: Então hoje você janta comigo. Eu faço para você.
  - speaker: protagonist
    text: 감사합니다, 할머니. 할머니가 있어서 든든해요.
    meaning:
      en: Thank you, grandma. I feel safe because you're here.
      pt: Obrigada, vovó. Com a senhora aqui me sinto amparada.
