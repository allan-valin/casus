id: B1-10
protagonist: m
title: ["Military service", "O serviço militar"]
situation: ["Minjun's friend Dohyun leaves for his military service. Minjun explains why it exists: the war, the armistice, no peace treaty.", "O amigo do Minjun, Dohyun, vai para o serviço militar. O Minjun explica por que ele existe: a guerra, o armistício, nenhum tratado de paz."]
learn: [ko-nikl-149, ko-nikl-101, ko-nikl-125]
culture: Military service and the divided peninsula
items:
  - [gundae, "군대", "the army, military service", "exército, serviço militar"]
  - [ipdae, "입대", "enlisting", "alistamento"]
  - [hyuga2, "휴가", "leave (from the army)", "licença (do exército)"]
  - [jedae, "제대", "discharge (end of service)", "baixa (fim do serviço)"]
  - [eo-oda, "-아/어 오다", "have been doing (up to now)", "vir fazendo (até agora)"]
  - [eosseot, "-았/었었-", "had (done, once, no longer)", "tinha (feito, antes, não mais)"]
  - [ge-hada, "-게 하다", "make (someone) do, let", "fazer (alguém) fazer, deixar"]
  - [hyujeon, "휴전", "armistice", "armistício"]
  - [pyeonghwa, "평화 협정", "peace treaty", "tratado de paz"]
  - [bukhan, "북한", "North Korea", "Coreia do Norte"]
  - [yeoldeol-gaewol, "십팔 개월", "eighteen months", "dezoito meses"]
  - [geonganghae, "건강하게 다녀와", "come back safe (casual)", "volta bem (informal)"]
dialogue:
  - [minjun, "형, 도현이가 다음 주에 입대해.", "Hyung, Dohyun enlists next week.", "Hyung, o Dohyun se alista semana que vem."]
  - [protagonist, "군대? 얼마나 있어?", "The army? How long is it?", "Exército? Quanto tempo?"]
  - [minjun, "육군은 십팔 개월이야. 나도 이 년 전에 제대했었어.", "Eighteen months in the army. I was discharged two years ago myself.", "No exército são dezoito meses. Eu também dei baixa dois anos atrás."]
  - [protagonist, "왜 다 가야 돼?", "Why does everyone have to go?", "Por que todos têm que ir?"]
  - [minjun, "한국 전쟁이 1953년에 휴전으로 끝났어. 평화 협정은 아직 없어.", "The Korean War ended in 1953 with an armistice. There's still no peace treaty.", "A Guerra da Coreia acabou em 1953 com um armistício. Ainda não há tratado de paz."]
  - [protagonist, "그럼 지금도 북한하고 전쟁 중이야?", "So you're still at war with North Korea?", "Então ainda estão em guerra com a Coreia do Norte?"]
  - [minjun, "공식적으로는 그래. 그래서 칠십 년 동안 군대를 유지해 왔어. 부모님은 걱정하게 돼.", "Officially, yes. So for seventy years they've kept up the army. Parents end up worrying.", "Oficialmente, sim. Por isso há setenta anos mantêm o exército. Os pais acabam se preocupando."]
  - [protagonist, "도현아, 휴가 나오면 연락해. 건강하게 다녀와!", "Dohyun, message me when you're on leave. Come back safe!", "Dohyun, me chama quando tiver licença. Volta bem!"]
teach:
  - ask: ["Casually: Dohyun enlists next week.", "Informal: o Dohyun se alista semana que vem.", "도현이가 다음 주에 입대해.", ipdae]
  - ask: ["Say: the army.", "Diga: o exército.", "군대", gundae]
  - ask: ["Casually: it's eighteen months in the army.", "Informal: no exército são dezoito meses.", "육군은 십팔 개월이야.", yeoldeol-gaewol]
  - note: ["-았/었었- is a past that no longer holds, a 'had once': 제대했었어, I had been discharged (back then).", "-았/었었- é um passado que já não vale, um 'tinha': 제대했었어, eu tinha dado baixa (naquela época)."]
  - ask: ["Casually: I was discharged two years ago (back then).", "Informal: eu dei baixa dois anos atrás.", "이 년 전에 제대했었어.", eosseot, jedae]
  - ask: ["Say: the war ended with an armistice.", "Diga: a guerra acabou com um armistício.", "전쟁이 휴전으로 끝났어요.", hyujeon]
  - ask: ["Say: there's still no peace treaty.", "Diga: ainda não há tratado de paz.", "평화 협정은 아직 없어요.", pyeonghwa]
  - ask: ["Ask: still at war with North Korea?", "Pergunte: ainda em guerra com a Coreia do Norte?", "지금도 북한하고 전쟁 중이에요?", bukhan]
  - note: ["-아/어 오다 is 'have been doing (up to now)': 유지하다 → 유지해 왔어, have kept it up.", "-아/어 오다 é 'vir fazendo (até agora)': 유지하다 → 유지해 왔어, vêm mantendo."]
  - ask: ["Say: for seventy years they've kept up the army.", "Diga: há setenta anos mantêm o exército.", "칠십 년 동안 군대를 유지해 왔어요.", eo-oda]
  - note: ["-게 하다 / -게 되다: make happen / end up: 걱정하게 돼, (parents) end up worrying; 웃게 해요, it makes (me) laugh.", "-게 하다 / -게 되다: fazer acontecer / acabar: 걱정하게 돼, (os pais) acabam se preocupando; 웃게 해요, faz (eu) rir."]
  - ask: ["Say: it makes the parents worry.", "Diga: faz os pais se preocuparem.", "부모님을 걱정하게 해요.", ge-hada]
  - ask: ["Casually: message me when you're on leave.", "Informal: me chama quando tiver licença.", "휴가 나오면 연락해.", hyuga2]
  - ask: ["Casually: come back safe!", "Informal: volta bem!", "건강하게 다녀와!", geonganghae]
  - pt_only: "A Guerra da Coreia (1950–1953) terminou num armistício, não num tratado de paz: oficialmente o conflito nunca acabou. Por isso quase todo homem coreano serve — hoje 18 meses no exército — e o Brasil, sem serviço obrigatório na prática, estranha."
