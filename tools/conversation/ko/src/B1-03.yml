id: B1-03
protagonist: f
title: ["The cell", "A célula"]
situation: ["Minjun's younger sister Minji studies biology and explains her homework: cells, the nucleus, division — and passive verbs.", "A irmã mais nova do Minjun, Minji, estuda biologia e explica o dever de casa: células, núcleo, divisão — e verbos na voz passiva."]
learn: [ko-passive-causative, ko-plain, ko-nikl-120]
culture: Science at school level — and how textbooks write
items:
  - [sepo, "세포", "cell", "célula"]
  - [haek, "핵", "nucleus", "núcleo"]
  - [nanwieoyo, "나뉘어요", "is divided, divides", "é dividido, se divide"]
  - [saengmul, "생물", "biology; living thing", "biologia; ser vivo"]
  - [passive, "-이/히/리/기- (passive)", "is (done): 보이다, 나뉘다", "é (feito): 보이다, 나뉘다"]
  - [plain-da, "-ㄴ다/는다 (plain written style)", "textbook style: 나뉜다, 있다", "estilo de livro: 나뉜다, 있다"]
  - [hyeonmigyeong, "현미경", "microscope", "microscópio"]
  - [boyeoyo-b, "보여요", "can be seen, is visible", "é visível, dá para ver"]
  - [mandeul-eojyeoyo, "만들어져요", "is made", "é feito"]
  - [sukje, "숙제", "homework", "dever de casa"]
  - [eoryeowo2, "어려워", "it's hard (casual)", "é difícil (informal)"]
  - [seolmyeong, "설명해 줄래?", "will you explain? (casual)", "você explica? (informal)"]
dialogue:
  - [minji, "언니, 이거 생물 숙제예요. 세포에 대한 거예요.", "Unni, this is my biology homework. It's about cells.", "Unni, este é meu dever de biologia. É sobre células."]
  - [protagonist, "와, 현미경 사진이네요. 이건 뭐예요?", "Wow, a microscope photo. What's this?", "Nossa, uma foto de microscópio. O que é isto?"]
  - [minji, "핵이에요. 현미경으로 보면 잘 보여요.", "The nucleus. You can see it well under the microscope.", "É o núcleo. No microscópio dá para ver bem."]
  - [protagonist, "세포가 어떻게 커져요?", "How does a cell grow?", "Como a célula cresce?"]
  - [minji, "세포는 둘로 나뉘어요. 교과서에는 '세포는 둘로 나뉜다'라고 써 있어요.", "A cell divides in two. The textbook says 'the cell divides in two'.", "A célula se divide em duas. O livro diz 'a célula divide-se em duas'."]
  - [protagonist, "'나뉜다'? 왜 '나뉘어요'라고 안 써요?", "'Nanwinda'? Why don't they write 'nanwieoyo'?", "'나뉜다'? Por que não escrevem '나뉘어요'?"]
  - [minji, "책은 이렇게 써요. 말할 때는 '나뉘어요'라고 해요.", "Books write like that. When you speak you say 'nanwieoyo'.", "Os livros escrevem assim. Falando, a gente diz '나뉘어요'."]
  - [protagonist, "아하! 숙제 잘해요. 저도 생물을 다시 배우고 싶어요.", "Aha! Good luck with the homework. I'd like to learn biology again too.", "Aha! Bom dever. Também queria aprender biologia de novo."]
teach:
  - ask: ["Say: it's biology homework.", "Diga: é dever de biologia.", "생물 숙제예요.", saengmul, sukje]
  - ask: ["Say: a cell.", "Diga: uma célula.", "세포", sepo]
  - ask: ["Say: the nucleus.", "Diga: o núcleo.", "핵", haek]
  - note: ["Some verbs make a passive with -이/히/리/기-: 보다 → 보이다, to be seen; 나누다 → 나뉘다, to be divided; 만들다 → 만들어지다, to be made.", "Alguns verbos fazem a passiva com -이/히/리/기-: 보다 → 보이다, ser visto; 나누다 → 나뉘다, ser dividido; 만들다 → 만들어지다, ser feito."]
  - ask: ["Say: under the microscope you can see it well.", "Diga: no microscópio dá para ver bem.", "현미경으로 보면 잘 보여요.", hyeonmigyeong, boyeoyo-b, passive]
  - ask: ["Say: the cell divides in two.", "Diga: a célula se divide em duas.", "세포는 둘로 나뉘어요.", nanwieoyo]
  - ask: ["Say: it is made in the cell.", "Diga: é feito na célula.", "세포에서 만들어져요.", mandeul-eojyeoyo]
  - note: ["Books, news and essays use the plain style: -ㄴ다/는다 for verbs (나뉜다, 먹는다), -다 for adjectives (크다). Speaking, you keep 해요체.", "Livros, notícias e redações usam o estilo simples: -ㄴ다/는다 nos verbos (나뉜다, 먹는다), -다 nos adjetivos (크다). Falando, você continua no 해요체."]
  - ask: ["Read the textbook line: the cell divides in two.", "Leia a frase do livro: a célula divide-se em duas.", "세포는 둘로 나뉜다.", plain-da]
  - ask: ["Casually: it's hard.", "Informal: é difícil.", "어려워.", eoryeowo2]
  - ask: ["Ask casually: will you explain?", "Pergunte, informal: você explica?", "설명해 줄래?", seolmyeong]
  - pt_only: "No coreano escrito (livros, jornais) o verbo muda de estilo: 나뉜다 em vez de 나뉘어요 — como a diferença entre 'divide-se' num livro e 'se divide' na conversa."
