id: A1-27
protagonist: f
title: ["The house", "A casa"]
situation: ["The first cold night. Mrs Park shows you the floor heating, ondol: Koreans sit and even sleep on the warm floor.", "A primeira noite fria. A senhora Park mostra o aquecimento no piso, o 온돌: os coreanos sentam e até dormem no chão quente."]
learn: [ko-nikl-43, ko-nikl-34]
culture: Ondol — life on a warm floor
items:
  - [badak, "바닥", "floor", "chão, piso"]
  - [nanbang, "난방", "heating", "aquecimento"]
  - [ttatteuthaeyo2, "따뜻해요", "is warm", "está quente"]
  - [kyeoyo, "켜요", "turn on", "liga"]
  - [kkeoyo, "꺼요", "turn off", "desliga"]
  - [ji-mothaeyo, "-지 못해요", "can't (long form)", "não consegue (forma longa)"]
  - [go3, "-고", "and (two facts)", "e (dois fatos)"]
  - [ibul, "이불", "quilt, bedding", "edredom"]
  - [jayo, "자요", "sleep", "dorme"]
  - [chuweoseo, "추워서", "because it's cold", "porque está frio"]
  - [ondo, "온도", "temperature", "temperatura"]
  - [jamkkanman, "잠깐만요", "Just a moment", "Só um momento"]
dialogue:
  - [protagonist, "할머니, 방이 추워서 잠을 자지 못해요.", "Grandma, the room is cold, so I can't sleep.", "Vovó, o quarto está frio e eu não consigo dormir."]
  - [park, "난방 안 켰어요? 잠깐만요.", "You didn't turn on the heating? Just a moment.", "Não ligou o aquecimento? Só um momento."]
  - [protagonist, "난방이 어디 있어요? 히터가 없어요.", "Where's the heating? There's no heater.", "Onde fica o aquecimento? Não tem aquecedor."]
  - [park, "한국은 바닥이 따뜻해요. 이거 켜요.", "In Korea the floor gets warm. Turn this on.", "Na Coreia o chão esquenta. Ligue isto."]
  - [protagonist, "와, 바닥이 따뜻하고 좋아요!", "Wow, the floor is warm and nice!", "Nossa, o chão está quente e gostoso!"]
  - [park, "온도는 이십오 도예요. 밤에는 이불 덮고 바닥에서 자요.", "The temperature is 25 degrees. At night cover yourself and sleep on the floor.", "A temperatura é 25 graus. À noite, se cubra e durma no chão."]
  - [protagonist, "바닥에서요? 침대가 있는데요.", "On the floor? I have a bed, though.", "No chão? Mas eu tenho cama."]
  - [park, "하하, 침대도 좋아요. 아침에 끄세요!", "Haha, the bed is fine too. Turn it off in the morning!", "Haha, a cama também serve. Desligue de manhã!"]
teach:
  - note: ["-지 못해요 is the long form of 못: 자다 → 자지 못해요, I can't sleep. -아서/어서 gives the cause: 추워서, because it's cold.", "-지 못해요 é a forma longa do 못: 자다 → 자지 못해요, não consigo dormir. -아서/어서 dá a causa: 추워서, porque está frio."]
  - ask: ["Say: it's cold, so I can't sleep.", "Diga: está frio, então não consigo dormir.", "추워서 잠을 자지 못해요.", chuweoseo, ji-mothaeyo]
  - ask: ["Ask where the heating is.", "Pergunte onde fica o aquecimento.", "난방이 어디 있어요?", nanbang]
  - ask: ["She says 'just a moment'. How?", "Ela diz 'só um momento'. Como?", "잠깐만요.", jamkkanman]
  - ask: ["Say: in Korea the floor gets warm.", "Diga: na Coreia o chão esquenta.", "한국은 바닥이 따뜻해요.", badak, ttatteuthaeyo2]
  - ask: ["Say: turn this on.", "Diga: ligue isto.", "이거 켜요.", kyeoyo]
  - ask: ["Say: turn it off in the morning.", "Diga: desligue de manhã.", "아침에 꺼요.", kkeoyo]
  - note: ["-고 joins two facts: 따뜻하고 좋아요, warm and nice.", "-고 liga dois fatos: 따뜻하고 좋아요, quente e gostoso."]
  - ask: ["Say: the floor is warm and nice.", "Diga: o chão está quente e gostoso.", "바닥이 따뜻하고 좋아요.", go3]
  - ask: ["Say: the temperature is 25 degrees.", "Diga: a temperatura é 25 graus.", "온도는 이십오 도예요.", ondo]
  - ask: ["Say: cover yourself with the quilt and sleep.", "Diga: cubra-se com o edredom e durma.", "이불 덮고 자요.", ibul, jayo]
  - pt_only: "O 온돌 aquece a casa pelo chão — por isso tira-se o sapato, senta-se no chão e muitos ainda dormem num colchão fino sobre o piso."
