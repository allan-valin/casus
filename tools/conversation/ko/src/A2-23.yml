id: A2-23
protagonist: f
title: ["Street food", "Comida de rua"]
situation: ["A tent bar (포장마차) at night with Seoyeon: tteokbokki, fish cakes, and very spicy sauce.", "Uma barraca (포장마차) à noite com a Seoyeon: 떡볶이, bolinho de peixe e um molho bem apimentado."]
learn: [ko-nikl-60, ko-want]
culture: Pojangmacha, the tent bars
items:
  - [tteokbokki, "떡볶이", "tteokbokki (spicy rice cakes)", "떡볶이 (bolinho de arroz apimentado)"]
  - [eomuk, "어묵", "fish cake", "bolinho de peixe"]
  - [pojangmacha, "포장마차", "street tent bar", "barraca de rua"]
  - [maepda, "맵다 → 매워요", "spicy (ㅂ changes to 우)", "apimentado (ㅂ vira 우)"]
  - [deopda, "덥다 → 더워요", "hot (ㅂ changes to 우)", "quente (ㅂ vira 우)"]
  - [gukmul, "국물", "broth", "caldo"]
  - [dalgo, "달고 매워요", "sweet and spicy", "doce e apimentado"]
  - [ileoreon, "이런 데", "a place like this", "um lugar assim"]
  - [ttatteuthage-meogeoyo, "따뜻하게 먹어요", "eat it warm", "come quentinho"]
  - [ajumma, "이모", "auntie (to a woman running a stall)", "tia (para a dona da barraca)"]
  - [hana-deo, "하나 더 주세요", "one more, please", "mais um, por favor"]
  - [buldak, "너무 매워!", "too spicy! (casual)", "apimentado demais! (informal)"]
dialogue:
  - [seoyeon, "언니, 여기가 포장마차예요. 떡볶이 먹어 봐요!", "Unni, this is a pojangmacha. Try the tteokbokki!", "Unni, isto é um 포장마차. Prova o 떡볶이!"]
  - [protagonist, "와, 빨개요! 매워요?", "Wow, it's red! Is it spicy?", "Nossa, que vermelho! É apimentado?"]
  - [seoyeon, "달고 매워요. 어묵 국물이랑 같이 먹으면 괜찮아요.", "Sweet and spicy. With fish-cake broth it's fine.", "Doce e apimentado. Com o caldo do 어묵 fica tranquilo."]
  - [protagonist, "음… 아, 너무 매워! 물 주세요!", "Mm… ah, too spicy! Water, please!", "Hum… ai, apimentado demais! Água, por favor!"]
  - [seoyeon, "하하, 국물 마셔요. 따뜻하게 먹으면 덜 매워요.", "Haha, drink the broth. Eaten warm it's less spicy.", "Haha, toma o caldo. Quentinho arde menos."]
  - [protagonist, "이모, 어묵 하나 더 주세요!", "Auntie, one more fish cake, please!", "Tia, mais um 어묵, por favor!"]
  - [seoyeon, "언니 이제 한국 사람 같아요!", "Unni, you're like a Korean now!", "Unni, agora você parece coreana!"]
  - [protagonist, "이런 데 또 오고 싶어요. 밤에 먹으니까 더 맛있어요.", "I want to come to a place like this again. It tastes better at night.", "Quero voltar num lugar assim. De noite é mais gostoso."]
teach:
  - ask: ["Say: this is a street tent bar.", "Diga: isto é uma barraca de rua.", "포장마차예요.", pojangmacha]
  - ask: ["Say: tteokbokki and fish cakes.", "Diga: 떡볶이 e bolinho de peixe.", "떡볶이하고 어묵", tteokbokki, eomuk]
  - note: ["Some words in -ㅂ다 change ㅂ to 우 before a vowel: 맵다 → 매워요, 덥다 → 더워요, 춥다 → 추워요.", "Algumas palavras em -ㅂ다 trocam ㅂ por 우 antes de vogal: 맵다 → 매워요, 덥다 → 더워요, 춥다 → 추워요."]
  - ask: ["Say: it's spicy.", "Diga: é apimentado.", "매워요.", maepda]
  - ask: ["Say: it's hot (weather).", "Diga: está quente (tempo).", "더워요.", deopda]
  - ask: ["Say: sweet and spicy.", "Diga: doce e apimentado.", "달고 매워요.", dalgo]
  - ask: ["Casually: too spicy!", "Informal: apimentado demais!", "너무 매워!", buldak]
  - ask: ["Say: drink the broth.", "Diga: toma o caldo.", "국물 마셔요.", gukmul]
  - note: ["-게 again: 따뜻하다 → 따뜻하게 먹어요, eat it warm.", "-게 de novo: 따뜻하다 → 따뜻하게 먹어요, come quentinho."]
  - ask: ["Say: eat it warm.", "Diga: come quentinho.", "따뜻하게 먹어요.", ttatteuthage-meogeoyo]
  - ask: ["Call the stall owner and ask for one more.", "Chame a dona da barraca e peça mais um.", "이모, 하나 더 주세요!", ajumma, hana-deo]
  - ask: ["Say you want to come to a place like this again.", "Diga que quer voltar num lugar assim.", "이런 데 또 오고 싶어요.", ileoreon]
  - pt_only: "No 포장마차 se chama a dona de 이모, 'tia' — como no Brasil se diz 'tia' à moça da cantina. Comida simples, mesa de plástico, e a noite inteira."
