id: A2-07
protagonist: f
title: [The work dinner, O 회식]
situation: ["Your first team dinner: Korean barbecue and soju. You pour for the director — and almost pour for yourself.", "Seu primeiro jantar da equipe: churrasco coreano e soju. Você serve o diretor — e quase se serve sozinha."]
learn: [ko-nikl-69, ko-nikl-73, ko-nikl-46]
culture: Pour for others, never for yourself; turn away to drink before an elder
items:
  - [hoesik, "회식", "work dinner", "jantar da empresa"]
  - [soju, "소주", "soju", "soju"]
  - [geonbae, "건배!", "Cheers!", "Saúde!"]
  - [ttara-deurilgeyo, "따라 드릴게요", "I'll pour for you (respectful)", "vou servir o senhor (respeitoso)"]
  - [eulgeyo, "-(으)ㄹ게요", "I'll… (promise, offer)", "vou… (promessa, oferta)"]
  - [eullaeyo, "-(으)ㄹ래요?", "would you like to…? / I want to…", "quer…? / quero…"]
  - [kke, "께", "to (an honoured person)", "para (pessoa respeitada)"]
  - [bujangnim, "부장님", "department director", "diretor (do departamento)"]
  - [jan2, "잔", "glass", "copo"]
  - [gogi, "고기", "meat", "carne"]
  - [gupyeo, "고기 구울게요", "I'll grill the meat", "eu asso a carne"]
  - [ichacha, "2차", "second round (another place)", "segunda rodada (outro lugar)"]
dialogue:
  - [jieun, "오늘은 회식이에요. 부장님 오셨어요!", "Tonight is the team dinner. The director is here!", "Hoje é o jantar da equipe. O diretor chegou!"]
  - [protagonist, "부장님, 제가 따라 드릴게요.", "Director, let me pour for you.", "Diretor, deixa que eu sirvo."]
  - [jieun, "잘했어요. 두 손으로요!", "Well done. With both hands!", "Muito bem. Com as duas mãos!"]
  - [protagonist, "그럼 제 잔은 제가…", "Then my glass, I'll…", "Então o meu copo eu…"]
  - [jieun, "아니요! 혼자 따르지 마세요. 제가 따를게요.", "No! Don't pour your own. I'll pour it.", "Não! Não se sirva sozinha. Eu sirvo."]
  - [protagonist, "아, 그렇군요. 감사합니다. 건배!", "Oh, I see. Thank you. Cheers!", "Ah, entendi. Obrigada. Saúde!"]
  - [jieun, "고기 구울게요. 뭐 더 먹을래요?", "I'll grill the meat. What else would you like to eat?", "Eu asso a carne. Quer comer mais alguma coisa?"]
  - [protagonist, "냉면 먹을래요. 부장님께 먼저 드릴까요?", "I'd like cold noodles. Shall I give some to the director first?", "Quero 냉면. Sirvo o diretor primeiro?"]
  - [jieun, "네, 좋아요. 그리고 2차는 노래방이에요!", "Yes, good. And the second round is noraebang!", "Isso. E a segunda rodada é no karaokê!"]
teach:
  - ask: ["Say: tonight is the team dinner.", "Diga: hoje é o jantar da equipe.", "오늘은 회식이에요.", hoesik]
  - note: ["-(으)ㄹ게요 offers or promises something you will do: 따르다 → 따를게요, I'll pour. To honour the listener: 따라 드릴게요.", "-(으)ㄹ게요 oferece ou promete algo que você vai fazer: 따르다 → 따를게요, eu sirvo. Para honrar quem ouve: 따라 드릴게요."]
  - build: [ttara-deurilgeyo, ["드릴게요", "따라 드릴게요"]]
  - ask: ["Offer to pour for the director.", "Ofereça-se para servir o diretor.", "부장님, 따라 드릴게요.", ttara-deurilgeyo, bujangnim, eulgeyo]
  - ask: ["Say: I'll grill the meat.", "Diga: eu asso a carne.", "고기 구울게요.", gupyeo, gogi]
  - note: ["Never pour your own glass; someone pours for you. Before an elder, turn your head a little aside to drink.", "Nunca encha o próprio copo; alguém serve você. Diante de alguém mais velho, vire um pouco o rosto para beber."]
  - ask: ["Toast: cheers!", "Brinde: saúde!", "건배!", geonbae]
  - note: ["-(으)ㄹ래요? asks what someone would like; -(으)ㄹ래요. says what you'd like: 먹을래요?, 먹을래요.", "-(으)ㄹ래요? pergunta o que a pessoa quer; -(으)ㄹ래요. diz o que você quer: 먹을래요?, 먹을래요."]
  - ask: ["Ask what else she'd like to eat.", "Pergunte o que mais ela quer comer.", "뭐 더 먹을래요?", eullaeyo]
  - note: ["께 is 에게 for someone honoured: 부장님께 드려요, I give it to the director.", "께 é o 에게 para alguém respeitado: 부장님께 드려요, dou ao diretor."]
  - ask: ["Ask: shall I give some to the director first?", "Pergunte: sirvo o diretor primeiro?", "부장님께 먼저 드릴까요?", kke]
  - ask: ["Say: a glass of soju.", "Diga: um copo de soju.", "소주 한 잔", soju, jan2]
  - ask: ["Say the second round is noraebang.", "Diga que a segunda rodada é no karaokê.", "2차는 노래방이에요.", ichacha]
  - pt_only: "No Brasil cada um se serve. No 회식 se serve os outros com as duas mãos, ninguém enche o próprio copo, e diante do chefe se bebe virando o rosto — e depois vem o 2차, a segunda rodada."
