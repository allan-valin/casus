id: A2-14
protagonist: m
title: ["Brazil = football and danger?", "Brasil = futebol e perigo?"]
situation: ["Lunch break. Colleagues ask about Brazil: is it dangerous, does everyone play football? You correct the picture — and ask about theirs.", "Hora do almoço. Os colegas perguntam do Brasil: é perigoso, todo mundo joga futebol? Você corrige a imagem — e pergunta da deles."]
learn: [ko-nikl-70, ko-nikl-57]
culture: Correcting a stereotype politely
items:
  - [chukgu, "축구", "football", "futebol"]
  - [wiheomhaeyo, "위험해요?", "Is it dangerous?", "É perigoso?"]
  - [ohae, "오해", "misunderstanding", "mal-entendido"]
  - [ji-confirm, "-지(요)?", "…, right? (checking)", "…, né? (confirmando)"]
  - [neunde2, "-는데", "but, and (setting a contrast)", "mas (contraste)"]
  - [deureosseoyo, "들었어요", "I heard", "ouvi dizer"]
  - [jiyeok, "지역마다 달라요", "it differs from region to region", "depende da região"]
  - [jojeong, "조심해야 돼요", "you have to be careful", "tem que tomar cuidado"]
  - [jeonbu, "전부", "all, everyone", "todos, tudo"]
  - [nongdam, "농담", "joke", "piada"]
  - [geureochi, "그렇지요?", "That's right, isn't it?", "Não é?"]
  - [daeduri, "대도시", "big city", "cidade grande"]
dialogue:
  - [jieun, "브라질 사람들은 다 축구 잘하지요?", "Brazilians are all good at football, right?", "Os brasileiros jogam todos bem futebol, né?"]
  - [protagonist, "하하, 아니에요. 저는 축구 못해요.", "Haha, no. I can't play football.", "Haha, não. Eu não sei jogar futebol."]
  - [jieun, "그런데 브라질은 위험하다고 들었는데요.", "But I heard Brazil is dangerous.", "Mas ouvi dizer que o Brasil é perigoso."]
  - [protagonist, "대도시는 조심해야 돼요. 그런데 지역마다 달라요.", "In big cities you have to be careful. But it differs by region.", "Nas cidades grandes tem que tomar cuidado. Mas depende da região."]
  - [jieun, "아, 그렇군요. 오해였어요.", "Oh, I see. It was a misunderstanding.", "Ah, entendi. Foi um mal-entendido."]
  - [protagonist, "괜찮아요. 저도 한국 사람은 다 김치만 먹는 줄 알았어요.", "That's OK. I thought all Koreans only ate kimchi too.", "Tudo bem. Eu também achava que coreano só comia kimchi."]
  - [jieun, "하하, 김치는 매일 먹지요!", "Haha, kimchi we do eat every day!", "Haha, kimchi a gente come todo dia mesmo!"]
  - [protagonist, "그렇지요? 그건 농담이 아니에요.", "Right? That one's no joke.", "Não é? Isso não é piada."]
teach:
  - note: ["-지요? (often 죠?) checks something you expect to be true: 잘하지요?, you're good at it, right?", "-지요? (muitas vezes 죠?) confirma algo que se espera: 잘하지요?, joga bem, né?"]
  - ask: ["Ask: Brazilians are good at football, right?", "Pergunte: os brasileiros jogam bem futebol, né?", "브라질 사람들은 축구 잘하지요?", ji-confirm, chukgu]
  - ask: ["Say you can't play football.", "Diga que não sabe jogar futebol.", "저는 축구 못해요.", chukgu]
  - note: ["-는데 sets a contrast or background: 위험하다고 들었는데요, I heard it's dangerous, (but…).", "-는데 cria contraste ou contexto: 위험하다고 들었는데요, ouvi dizer que é perigoso (mas…)."]
  - ask: ["Say: but I heard it's dangerous.", "Diga: mas ouvi dizer que é perigoso.", "위험하다고 들었는데요.", neunde2, deureosseoyo]
  - ask: ["Ask: is it dangerous?", "Pergunte: é perigoso?", "위험해요?", wiheomhaeyo]
  - ask: ["Say: in big cities you have to be careful.", "Diga: nas cidades grandes tem que tomar cuidado.", "대도시는 조심해야 돼요.", daeduri, jojeong]
  - ask: ["Say: it differs from region to region.", "Diga: depende da região.", "지역마다 달라요.", jiyeok]
  - ask: ["Say: it was a misunderstanding.", "Diga: foi um mal-entendido.", "오해였어요.", ohae]
  - ask: ["Say: not everyone, not all.", "Diga: nem todos.", "전부 아니에요.", jeonbu]
  - ask: ["Agree: right?", "Concorde: não é?", "그렇지요?", geureochi]
  - ask: ["Say: it's not a joke.", "Diga: não é piada.", "농담이 아니에요.", nongdam]
  - pt_only: "O Brasil visto da Coreia: futebol, samba, violência. Corrija com calma e com humor — e lembre que você também chegou com seus clichês sobre a Coreia."
