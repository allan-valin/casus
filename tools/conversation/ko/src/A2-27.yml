id: A2-27
protagonist: f
title: ["Appearance", "Aparência"]
situation: ["A skincare shop with Seoyeon. Ten steps of creams, advertising everywhere, and talk about the pressure to look good.", "Uma loja de cuidados com a pele com a Seoyeon. Dez passos de cremes, propaganda por toda parte e uma conversa sobre a pressão pela aparência."]
learn: [ko-nikl-66, ko-nikl-77]
culture: Skincare and appearance pressure (외모)
items:
  - [pibu, "피부", "skin", "pele"]
  - [hwajangpum, "화장품", "cosmetics", "cosméticos"]
  - [oemo, "외모", "appearance, looks", "aparência"]
  - [seonghyeong, "성형", "cosmetic surgery", "cirurgia plástica"]
  - [eo-boyeoyo, "-아/어 보여요", "looks (+ adjective)", "parece (+ adjetivo)"]
  - [eun-past, "-(으)ㄴ (past, before a noun)", "that (I) did: 어제 산 크림", "que (fiz): o creme que comprei ontem"]
  - [eojesan, "어제 산 크림", "the cream I bought yesterday", "o creme que comprei ontem"]
  - [jeolmeo-boyeoyo, "젊어 보여요", "you look young", "você parece jovem"]
  - [budamseureowoyo, "부담스러워요", "it's too much, it's a burden", "é demais, pesa"]
  - [ollaseuseuhae, "자연스러워요", "is natural", "é natural"]
  - [gwanggo, "광고", "advertisement", "propaganda"]
  - [dangye, "단계", "step, stage", "passo, etapa"]
dialogue:
  - [seoyeon, "언니, 이 크림 좋아요. 제가 어제 산 크림이에요.", "Unni, this cream is good. It's the one I bought yesterday.", "Unni, este creme é bom. É o que eu comprei ontem."]
  - [protagonist, "와, 서연 씨 피부가 정말 좋아 보여요.", "Wow, your skin looks really good.", "Nossa, sua pele parece ótima."]
  - [seoyeon, "고마워요. 한국에서는 스킨케어가 열 단계예요.", "Thanks. In Korea skincare is ten steps.", "Obrigada. Na Coreia o skincare tem dez passos."]
  - [protagonist, "열 단계요? 부담스러워요!", "Ten steps? That's a lot!", "Dez passos? É demais!"]
  - [seoyeon, "맞아요. 광고도 많고, 외모 압박이 있는 것 같아요.", "True. There's a lot of advertising, and I think there's pressure about looks.", "É verdade. Tem muita propaganda, e acho que há pressão pela aparência."]
  - [protagonist, "성형도 많이 해요?", "Do people have a lot of cosmetic surgery?", "O pessoal faz muita plástica?"]
  - [seoyeon, "하는 사람도 있어요. 그런데 요즘은 자연스러운 게 좋아요.", "Some do. But these days natural looks are in.", "Alguns fazem. Mas hoje em dia o natural está em alta."]
  - [protagonist, "저는 선크림 하나면 돼요. 그래도 젊어 보여요?", "One sunscreen is enough for me. Do I still look young?", "Para mim basta um protetor solar. Mesmo assim pareço jovem?"]
teach:
  - ask: ["Say: cosmetics.", "Diga: cosméticos.", "화장품", hwajangpum]
  - note: ["Before a noun, the past of a verb is -(으)ㄴ: 사다 → 산 크림, the cream (I) bought.", "Antes do substantivo, o passado do verbo é -(으)ㄴ: 사다 → 산 크림, o creme que comprei."]
  - ask: ["Say: the cream I bought yesterday.", "Diga: o creme que comprei ontem.", "어제 산 크림", eojesan, eun-past]
  - note: ["-아/어 보여요 is 'looks …': 좋다 → 좋아 보여요, looks good; 젊다 → 젊어 보여요, looks young.", "-아/어 보여요 é 'parece …': 좋다 → 좋아 보여요, parece bom; 젊다 → 젊어 보여요, parece jovem."]
  - build: [jeolmeo-boyeoyo, ["보여요", "젊어 보여요"]]
  - ask: ["Say her skin looks really good.", "Diga que a pele dela parece ótima.", "피부가 정말 좋아 보여요.", pibu, eo-boyeoyo]
  - ask: ["Ask: do I look young?", "Pergunte: pareço jovem?", "젊어 보여요?", jeolmeo-boyeoyo]
  - ask: ["Say: ten steps? That's a lot!", "Diga: dez passos? É demais!", "열 단계요? 부담스러워요!", dangye, budamseureowoyo]
  - ask: ["Say: I think there's pressure about looks.", "Diga: acho que há pressão pela aparência.", "외모 압박이 있는 것 같아요.", oemo]
  - ask: ["Ask if people have a lot of cosmetic surgery.", "Pergunte se o pessoal faz muita plástica.", "성형도 많이 해요?", seonghyeong]
  - ask: ["Say there's a lot of advertising.", "Diga que tem muita propaganda.", "광고가 많아요.", gwanggo]
  - ask: ["Say: natural is good.", "Diga: o natural é bom.", "자연스러운 게 좋아요.", ollaseuseuhae]
  - en_only: "Appearance pressure (외모 압박) is openly debated in Korea; the word 외모지상주의, 'lookism', is common in the press."
  - pt_only: "O Brasil também é campeão de plásticas, então o tema não é estranho. Na Coreia a pressão pela aparência (외모 압박) é debatida abertamente — existe até a palavra 외모지상주의, 'aparência acima de tudo'."
