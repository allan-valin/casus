id: A2-03
protagonist: f
title: [Water, A água]
situation: ["Mrs Park sees you carrying six bottles of water upstairs. Tap water, filters, boiled barley tea — she explains.", "A senhora Park vê você subindo com seis garrafas de água. Água da torneira, filtros, chá de cevada fervido — ela explica."]
learn: [ko-nikl-75, ko-nikl-88]
culture: Most homes filter or boil their water
items:
  - [sudotmul, "수돗물", "tap water", "água da torneira"]
  - [jeongsugi, "정수기", "water purifier", "purificador de água"]
  - [kkaekkeuthaeyo, "깨끗해요", "is clean", "é limpo"]
  - [gi-ttaemune, "-기 때문에", "because (formal, written)", "porque (formal, escrito)"]
  - [eodo-dwaeyo, "-아도/어도 돼요", "may, it's OK to", "pode"]
  - [masyeodo, "마셔도 돼요?", "Can I drink it?", "Posso beber?"]
  - [boricha, "보리차", "barley tea", "chá de cevada"]
  - [mugeowoyo2, "무거워요", "is heavy", "é pesado"]
  - [naemsae, "냄새", "smell", "cheiro"]
  - [gwaenchana, "괜찮아", "it's fine (casual)", "tudo bem (informal)"]
  - [saji-ma, "사지 마", "don't buy (casual)", "não compra (informal)"]
  - [mul-gap, "물값", "the cost of water", "o gasto com água"]
dialogue:
  - [park, "아이고, 물을 왜 이렇게 많이 샀어?", "Goodness, why did you buy so much water?", "Nossa, por que comprou tanta água?"]
  - [protagonist, "수돗물이 깨끗하지 않기 때문에요.", "Because the tap water isn't clean.", "Porque a água da torneira não é limpa."]
  - [park, "아니야, 서울 수돗물은 깨끗해. 마셔도 돼.", "No, Seoul's tap water is clean. You can drink it.", "Não, a água da torneira de Seul é limpa. Pode beber."]
  - [protagonist, "정말요? 그런데 할머니는 정수기를 쓰시잖아요.", "Really? But you use a purifier.", "Sério? Mas a senhora usa purificador."]
  - [park, "냄새 때문에 써. 나는 보리차를 끓여서 마셔.", "I use it because of the smell. I boil barley tea and drink that.", "Uso por causa do cheiro. Eu fervo chá de cevada e bebo."]
  - [protagonist, "보리차요? 맛있어요?", "Barley tea? Is it good?", "Chá de cevada? É gostoso?"]
  - [park, "구수해. 이리 와, 한 잔 마셔 봐. 물은 사지 마. 무겁잖아!", "It's nutty. Come here, try a cup. Don't buy water. It's heavy!", "É torradinho. Vem cá, prova uma xícara. Não compra água. É pesado!"]
  - [protagonist, "네, 감사합니다. 물값도 아껴야 해요.", "Yes, thank you. I have to save on water, too.", "Sim, obrigada. Tenho que economizar com água também."]
teach:
  - note: ["From A2 Mrs Park speaks 반말 to you — natural for a 70-year-old with a younger tenant. You answer in 해요체, always.", "A partir do A2 a senhora Park fala 반말 com você — natural para uma senhora de 70 anos com uma inquilina mais jovem. Você responde em 해요체, sempre."]
  - ask: ["Say: tap water.", "Diga: água da torneira.", "수돗물", sudotmul]
  - note: ["-기 때문에 is 'because', a little formal: 깨끗하지 않기 때문에, because it isn't clean. With a noun: 냄새 때문에, because of the smell.", "-기 때문에 é 'porque', um pouco formal: 깨끗하지 않기 때문에, porque não é limpa. Com substantivo: 냄새 때문에, por causa do cheiro."]
  - ask: ["Say: because the tap water isn't clean.", "Diga: porque a água da torneira não é limpa.", "수돗물이 깨끗하지 않기 때문에요.", gi-ttaemune, kkaekkeuthaeyo]
  - note: ["-아도/어도 돼요 asks or gives permission: 마셔도 돼요? — may I drink it?", "-아도/어도 돼요 pede ou dá permissão: 마셔도 돼요? — posso beber?"]
  - build: [masyeodo, ["돼요?", "마셔도 돼요?"]]
  - ask: ["Ask if you can drink tap water.", "Pergunte se pode beber água da torneira.", "수돗물 마셔도 돼요?", masyeodo, eodo-dwaeyo]
  - ask: ["Say she uses a water purifier.", "Diga que ela usa purificador.", "정수기를 쓰세요.", jeongsugi]
  - ask: ["Say: because of the smell.", "Diga: por causa do cheiro.", "냄새 때문에요.", naemsae]
  - ask: ["Ask if barley tea is good.", "Pergunte se o chá de cevada é gostoso.", "보리차 맛있어요?", boricha]
  - ask: ["How did she say 'don't buy (it)', casually?", "Como ela disse 'não compra', informal?", "사지 마.", saji-ma]
  - ask: ["Say the bottles are heavy.", "Diga que as garrafas são pesadas.", "무거워요.", mugeowoyo2]
  - ask: ["Say you have to save on water.", "Diga que tem que economizar com água.", "물값을 아껴야 해요.", mul-gap]
  - ask: ["To a friend, casually: it's fine.", "Para um amigo, informal: tudo bem.", "괜찮아.", gwaenchana]
  - pt_only: "A água da torneira de Seul é potável, mas quase toda casa tem purificador ou ferve chá de cevada — o 보리차 gelado na geladeira é tão comum quanto nossa jarra de água filtrada."
