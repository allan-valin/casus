id: A2-18
protagonist: m
title: ["Proverbs", "Provérbios"]
situation: ["Mrs Park answers everything with a proverb. You start collecting them — and try one on Minjun.", "A senhora Park responde tudo com um provérbio. Você começa a colecionar — e testa um com o Minjun."]
learn: [ko-nominal, ko-nikl-62, ko-nikl-67]
culture: Proverbs in daily talk
items:
  - [sokdam, "속담", "proverb", "provérbio"]
  - [sijagi-banida, "시작이 반이다", "Starting is half the job", "Começar é metade do trabalho"]
  - [ppallippalli2, "빨리빨리", "quick, quick", "rápido, rápido"]
  - [gi-noun, "-기", "…-ing (makes a verb a noun)", "…-ar (faz do verbo um substantivo)"]
  - [eum-noun, "-(으)ㅁ", "…-ing (written, notices)", "…-ar (escrito, avisos)"]
  - [baeugi, "배우기 어려워요", "it's hard to learn", "é difícil de aprender"]
  - [malhagi, "말하기", "speaking", "falar (a fala)"]
  - [ttatda, "뜻이 뭐예요?", "what does it mean?", "o que quer dizer?"]
  - [jinanbeon, "지난번", "last time", "da última vez"]
  - [nunchi, "눈치", "reading the room", "saber ler o ambiente"]
  - [gongjja, "공짜", "free (of charge)", "de graça"]
  - [gonggo, "출입 금지", "no entry (sign)", "proibida a entrada (placa)"]
dialogue:
  - [protagonist, "할머니, 한국어 배우기가 너무 어려워요.", "Grandma, learning Korean is so hard.", "Vovó, aprender coreano é difícil demais."]
  - [park, "시작이 반이야. 벌써 반 했어!", "Starting is half the job. You've already done half!", "Começar é metade. Você já fez metade!"]
  - [protagonist, "그 말 뜻이 뭐예요?", "What does that mean?", "O que quer dizer isso?"]
  - [park, "속담이야. 시작하기가 제일 어렵다는 뜻이야.", "It's a proverb. It means starting is the hardest part.", "É um provérbio. Quer dizer que começar é o mais difícil."]
  - [protagonist, "좋은 말이네요. 말하기는 아직 어려워요.", "Nice saying. Speaking is still hard.", "Que bonito. A fala ainda é difícil."]
  - [park, "괜찮아. 저기 '출입 금지' 보여? 그런 건 읽음으로 배워.", "It's fine. See 'no entry' there? You learn things like that by reading.", "Tudo bem. Está vendo 'proibida a entrada' ali? Isso se aprende lendo."]
  - [protagonist, "네! 내일 민준이한테도 '시작이 반'이라고 할게요.", "Yes! Tomorrow I'll tell Minjun 'starting is half' too.", "Sim! Amanhã vou dizer 'começar é metade' para o Minjun também."]
  - [park, "하하, 눈치가 빠르네!", "Haha, you catch on fast!", "Haha, você pega rápido!"]
teach:
  - note: ["-기 turns a verb into a noun: 배우다 → 배우기, learning; 말하다 → 말하기, speaking. 배우기가 어려워요: learning is hard.", "-기 transforma o verbo em substantivo: 배우다 → 배우기, aprender; 말하다 → 말하기, a fala. 배우기가 어려워요: aprender é difícil."]
  - build: [baeugi, ["어려워요", "배우기 어려워요"]]
  - ask: ["Say: learning Korean is hard.", "Diga: aprender coreano é difícil.", "한국어 배우기가 어려워요.", baeugi, gi-noun]
  - ask: ["Say: speaking is still hard.", "Diga: a fala ainda é difícil.", "말하기는 아직 어려워요.", malhagi]
  - ask: ["Say the proverb: starting is half the job.", "Diga o provérbio: começar é metade.", "시작이 반이다.", sijagi-banida]
  - ask: ["Ask what it means.", "Pergunte o que quer dizer.", "뜻이 뭐예요?", ttatda]
  - ask: ["Say: it's a proverb.", "Diga: é um provérbio.", "속담이에요.", sokdam]
  - note: ["Signs and notices often end in -(으)ㅁ or a noun: 출입 금지, no entry; 공사 중임, under construction.", "Placas e avisos muitas vezes terminam em -(으)ㅁ ou num substantivo: 출입 금지, proibida a entrada; 공사 중임, em obras."]
  - ask: ["Read the sign: no entry.", "Leia a placa: proibida a entrada.", "출입 금지", gonggo, eum-noun]
  - ask: ["Say: quick, quick!", "Diga: rápido, rápido!", "빨리빨리!", ppallippalli2]
  - ask: ["She says you catch on fast. Which word means 'reading the room'?", "Ela diz que você pega rápido. Que palavra quer dizer 'ler o ambiente'?", "눈치", nunchi]
  - ask: ["Say: it's free.", "Diga: é de graça.", "공짜예요.", gongjja]
  - ask: ["Say: last time.", "Diga: da última vez.", "지난번", jinanbeon]
  - pt_only: "'Começar é metade' (시작이 반이다) é como o nosso 'o primeiro passo é o mais difícil'. Os mais velhos usam provérbios o tempo todo — e ficam felizes quando um estrangeiro devolve um."
