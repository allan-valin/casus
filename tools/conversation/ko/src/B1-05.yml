id: B1-05
protagonist: f
title: ["The parents", "Os pais"]
situation: ["Junho, your boyfriend, takes you to meet his parents in Suwon. Honorific verbs, a deep bow, fruit as a present.", "O Junho, seu namorado, leva você para conhecer os pais dele em Suwon. Verbos honoríficos, reverência profunda, frutas de presente."]
learn: [ko-nikl-144, ko-nikl-128]
culture: Meeting the partner's parents
items:
  - [bumonim, "부모님", "parents (respectful)", "pais (respeitoso)"]
  - [insadeuryeoyo, "인사드려요", "I greet you (humble)", "eu cumprimento (humilde)"]
  - [deuseyo2, "드세요", "please eat (honorific)", "coma, por favor (honorífico)"]
  - [gyeseyo, "계세요", "are / stay (honorific of 있다)", "estão / fiquem (honorífico de 있다)"]
  - [eo-deurida, "-아/어 드리다", "do (something) for an honoured person", "fazer (algo) para alguém respeitado"]
  - [go-sipeo-hada, "-고 싶어 하다", "(someone else) wants to", "(outra pessoa) quer"]
  - [jumusyeoyo, "주무셔요", "sleeps (honorific)", "dorme (honorífico)"]
  - [japsuseyo, "잡수세요", "please eat (very respectful)", "sirva-se (muito respeitoso)"]
  - [malsseum, "말씀 많이 들었습니다", "I've heard a lot about you (formal)", "ouvi falar muito do senhor (formal)", {register: formal}]
  - [gwail2, "과일 사 왔어요", "I brought fruit", "trouxe frutas"]
  - [pyeonhage, "편하게 앉으세요", "sit comfortably", "sente-se à vontade"]
  - [yeppeuge-bwa, "예쁘게 봐 주세요", "please think well of me", "conto com a simpatia de vocês"]
dialogue:
  - [junho, "엄마, 아빠, 제 여자 친구예요.", "Mum, Dad, this is my girlfriend.", "Mãe, pai, esta é a minha namorada."]
  - [protagonist, "안녕하세요. 처음 인사드립니다. 말씀 많이 들었습니다.", "Hello. It's an honour to greet you. I've heard a lot about you.", "Olá. É uma honra cumprimentá-los. Ouvi falar muito de vocês."]
  - [junhomom, "어서 와요. 편하게 앉으세요.", "Welcome. Please sit comfortably.", "Seja bem-vinda. Sente-se à vontade."]
  - [protagonist, "감사합니다. 과일 사 왔어요. 어머님 드리고 싶었어요.", "Thank you. I brought fruit. I wanted to give it to you.", "Obrigada. Trouxe frutas. Queria dar para a senhora."]
  - [junhomom, "아이고, 고마워요. 준호가 브라질 음식을 먹고 싶어 해요.", "Oh, thank you. Junho wants to try Brazilian food.", "Ah, obrigada. O Junho quer comer comida brasileira."]
  - [protagonist, "그럼 다음에 제가 만들어 드릴게요.", "Then next time I'll cook for you.", "Então da próxima vez eu cozinho para vocês."]
  - [junhomom, "좋아요. 자, 저녁 드세요. 아버님은 지금 안 계세요. 곧 오실 거예요.", "Lovely. Now, have dinner. His father isn't in right now. He'll be here soon.", "Ótimo. Agora jante. O pai dele não está agora. Já vai chegar."]
  - [protagonist, "네, 잘 먹겠습니다. 앞으로 예쁘게 봐 주세요.", "Yes, thank you for the meal. I hope you'll think well of me.", "Sim, obrigada pela comida. Conto com a simpatia de vocês."]
teach:
  - note: ["With a partner's parents, honorific verbs: 있다 → 계시다 (계세요), 먹다 → 드시다 (드세요), 자다 → 주무시다. Bow deeply at the first greeting.", "Com os pais do namorado, verbos honoríficos: 있다 → 계시다 (계세요), 먹다 → 드시다 (드세요), 자다 → 주무시다. Na primeira saudação, reverência profunda."]
  - ask: ["Greet them humbly the first time.", "Cumprimente-os com humildade na primeira vez.", "처음 인사드립니다.", insadeuryeoyo]
  - ask: ["Say formally: I've heard a lot about you.", "Diga formalmente: ouvi falar muito de vocês.", "말씀 많이 들었습니다.", malsseum]
  - ask: ["Say you brought fruit.", "Diga que trouxe frutas.", "과일 사 왔어요.", gwail2]
  - note: ["-아/어 드리다 is doing something for someone you honour: 만들다 → 만들어 드릴게요, I'll make it for you.", "-아/어 드리다 é fazer algo para alguém respeitado: 만들다 → 만들어 드릴게요, vou fazer para a senhora."]
  - ask: ["Offer to cook for them next time.", "Ofereça-se para cozinhar para eles da próxima vez.", "다음에 만들어 드릴게요.", eo-deurida]
  - note: ["For what someone else wants, -고 싶어 하다: 준호가 먹고 싶어 해요, Junho wants to eat (it). -고 싶다 is only for 'I'.", "Para o que outra pessoa quer, -고 싶어 하다: 준호가 먹고 싶어 해요, o Junho quer comer. -고 싶다 é só para 'eu'."]
  - ask: ["Say: Junho wants to try Brazilian food.", "Diga: o Junho quer comer comida brasileira.", "준호가 브라질 음식을 먹고 싶어 해요.", go-sipeo-hada]
  - ask: ["Say his father isn't in right now (honorific).", "Diga que o pai dele não está agora (honorífico).", "아버님은 지금 안 계세요.", gyeseyo]
  - ask: ["Invite an elder to eat (honorific).", "Convide uma pessoa mais velha a comer (honorífico).", "드세요.", deuseyo2]
  - ask: ["Very respectfully: please eat.", "Muito respeitosamente: sirva-se.", "잡수세요.", japsuseyo]
  - ask: ["Say: grandfather is sleeping (honorific).", "Diga: o avô está dormindo (honorífico).", "할아버지께서 주무세요.", jumusyeoyo]
  - ask: ["Say: please sit comfortably.", "Diga: sente-se à vontade.", "편하게 앉으세요.", pyeonhage]
  - ask: ["Ask them to think well of you.", "Peça a simpatia deles.", "예쁘게 봐 주세요.", yeppeuge-bwa]
  - ask: ["Say: my parents.", "Diga: meus pais.", "제 부모님", bumonim]
  - pt_only: "Conhecer os pais do namorado na Coreia é formal: roupa arrumada, frutas de presente, reverência profunda e verbos honoríficos. É menos descontraído que o almoço de domingo brasileiro — mas termina igual, com muita comida."
