id: A1-24
protagonist: m
title: [The sky, O céu]
situation: ["Evening on Namsan with Seoyeon, looking for stars over Seoul. Something bright moves — a star?", "Noite no Namsan com a Seoyeon, procurando estrelas sobre Seul. Algo brilhante se move — uma estrela?"]
learn: [ko-nikl-37, ko-nikl-25]
culture: Namsan Tower and city lights
items:
  - [byeol, "별", "star", "estrela"]
  - [dal, "달", "moon", "lua"]
  - [haneul, "하늘", "sky", "céu"]
  - [i-anieyo, "이/가 아니에요", "is not (X)", "não é (X)"]
  - [bihaenggi, "비행기", "aeroplane", "avião"]
  - [eureo, "-(으)러 가요", "go (in order) to", "vai (para) fazer"]
  - [bareo, "보러 가요", "go to see", "vai ver"]
  - [balgayo, "밝아요", "is bright", "é claro, brilhante"]
  - [eoduwoyo, "어두워요", "is dark", "está escuro"]
  - [bam, "밤", "night", "noite"]
  - [tawo, "남산타워", "Namsan Tower", "Torre Namsan"]
  - [boyeoyo, "보여요", "can be seen", "dá para ver"]
dialogue:
  - [seoyeon, "오빠, 별 보러 남산에 왔어요!", "Oppa, we came to Namsan to see the stars!", "Oppa, viemos ao Namsan ver as estrelas!"]
  - [protagonist, "와, 하늘이 어두워요. 그런데 별이 안 보여요.", "Wow, the sky is dark. But I can't see the stars.", "Nossa, o céu está escuro. Mas não dá para ver as estrelas."]
  - [seoyeon, "서울은 너무 밝아요. 달은 보여요!", "Seoul is too bright. You can see the moon!", "Seul é clara demais. A lua dá para ver!"]
  - [protagonist, "저기 봐요! 저거 별이에요?", "Look there! Is that a star?", "Olha ali! Aquilo é estrela?"]
  - [seoyeon, "아니요, 별이 아니에요. 비행기예요.", "No, it's not a star. It's a plane.", "Não, não é estrela. É avião."]
  - [protagonist, "하하. 남산타워는 정말 밝아요.", "Haha. Namsan Tower really is bright.", "Haha. A Torre Namsan é bem iluminada."]
  - [seoyeon, "다음에는 시골에 별 보러 가요.", "Next time let's go to the countryside to see stars.", "Da próxima vez vamos ao interior ver estrelas."]
  - [protagonist, "좋아요. 밤하늘이 정말 예쁠 거예요.", "Great. The night sky will be beautiful.", "Ótimo. O céu da noite vai ser lindo."]
teach:
  - note: ["-(으)러 가요: go (in order) to do something: 보다 → 보러 가요, go to see.", "-(으)러 가요: ir fazer algo: 보다 → 보러 가요, ir ver."]
  - build: [bareo, ["가요", "보러 가요"]]
  - ask: ["Say you came to see the stars.", "Diga que vieram ver as estrelas.", "별 보러 왔어요.", byeol, eureo]
  - ask: ["Say: the sky is dark.", "Diga: o céu está escuro.", "하늘이 어두워요.", haneul, eoduwoyo]
  - ask: ["Say: I can't see the stars.", "Diga: não dá para ver as estrelas.", "별이 안 보여요.", boyeoyo]
  - ask: ["Say: Seoul is too bright.", "Diga: Seul é clara demais.", "서울은 너무 밝아요.", balgayo]
  - ask: ["Say you can see the moon.", "Diga que dá para ver a lua.", "달은 보여요.", dal]
  - note: ["'Is not X' is X + 이/가 아니에요: 별이 아니에요, it isn't a star; 비행기가 아니에요, it isn't a plane.", "'Não é X' se diz X + 이/가 아니에요: 별이 아니에요, não é estrela; 비행기가 아니에요, não é avião."]
  - ask: ["Say: it's not a star, it's a plane.", "Diga: não é estrela, é avião.", "별이 아니에요. 비행기예요.", i-anieyo, bihaenggi]
  - ask: ["Say: Namsan Tower is bright.", "Diga: a Torre Namsan é iluminada.", "남산타워는 밝아요.", tawo]
  - ask: ["Say: the night is long.", "Diga: a noite é longa.", "밤이 길어요.", bam]
  - pt_only: "Como em São Paulo, a luz da cidade apaga as estrelas. Do Namsan se vê Seul inteira; para ver estrelas, só longe da cidade."
