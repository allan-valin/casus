id: B1-04
protagonist: m
title: ["Dating", "Namorando"]
situation: ["You and Seoyeon have grown close. After a film, outside the cinema, the moment comes.", "Você e a Seoyeon ficaram próximos. Depois de um filme, na saída do cinema, chega o momento."]
learn: [ko-nikl-113, ko-nikl-112]
culture: The confession, and the first day of a couple
items:
  - [yeojachingu, "여자 친구", "girlfriend", "namorada"]
  - [deiteu, "데이트", "date", "encontro"]
  - [jamaja, "-자마자", "as soon as", "assim que"]
  - [eotdeoni, "-았/었더니", "when I did…, (I found that)…", "quando fiz…, (descobri que)…"]
  - [yeonghwagwan, "영화관", "cinema", "cinema"]
  - [gyesok, "계속 생각났어", "I kept thinking of you (casual)", "não parei de pensar em você (informal)"]
  - [nado, "나도", "me too (casual)", "eu também (informal)"]
  - [oneulbuteo, "오늘부터 1일", "from today, day one (of the couple)", "a partir de hoje, dia 1 (do casal)"]
  - [sondjapgo, "손 잡아도 돼?", "can I hold your hand? (casual)", "posso pegar sua mão? (informal)"]
  - [ttolli, "떨리네", "I'm nervous (casual)", "estou nervoso (informal)"]
  - [eotteoke-saenggakhae, "어떻게 생각해?", "what do you think? (casual)", "o que você acha? (informal)"]
  - [haengbokhae, "행복해", "I'm happy (casual)", "estou feliz (informal)"]
dialogue:
  - [seoyeon, "오빠, 영화 재미있었어요?", "Oppa, was the film good?", "Oppa, gostou do filme?"]
  - [protagonist, "응. 그런데 사실 영화보다 서연이가 더 생각났어.", "Yeah. But honestly I thought more about you than the film.", "Gostei. Mas na verdade pensei mais em você do que no filme."]
  - [seoyeon, "네? 무슨 뜻이에요?", "Sorry? What do you mean?", "Como? O que quer dizer?"]
  - [protagonist, "지난주에 만나자마자 계속 생각났어. 나 서연이 좋아해. 사귈래?", "Since we met last week I kept thinking of you. I like you. Will you go out with me?", "Desde que nos vimos semana passada não parei de pensar em você. Gosto de você. Quer namorar comigo?"]
  - [seoyeon, "어제 언니한테 물어봤더니 오빠가 고백할 거라고 했어요!", "When I asked my cousin yesterday, she said you'd confess!", "Ontem perguntei para a minha prima e ela disse que você ia se declarar!"]
  - [protagonist, "하하, 다 알았구나. 그래서 어떻게 생각해?", "Haha, you knew it all. So what do you think?", "Haha, você já sabia. Então, o que você acha?"]
  - [seoyeon, "저도 좋아요. 오늘부터 1일이에요!", "I like you too. From today, day one!", "Eu também gosto. A partir de hoje, dia 1!"]
  - [protagonist, "행복해. 이제 내 여자 친구야.", "I'm happy. Now you're my girlfriend.", "Estou feliz. Agora você é minha namorada."]
teach:
  - note: ["You're older and close now: you speak 반말 to Seoyeon; she still uses 해요체 until you both agree otherwise.", "Agora vocês são próximos e você é mais velho: você fala 반말 com a Seoyeon; ela ainda usa 해요체 até combinarem outra coisa."]
  - ask: ["Say: the cinema.", "Diga: o cinema.", "영화관", yeonghwagwan]
  - note: ["-자마자 is 'as soon as': 만나다 → 만나자마자, as soon as we met.", "-자마자 é 'assim que': 만나다 → 만나자마자, assim que nos vimos."]
  - ask: ["Casually: as soon as we met, I kept thinking of you.", "Informal: assim que nos vimos, não parei de pensar em você.", "만나자마자 계속 생각났어.", jamaja, gyesok]
  - ask: ["Casually: I like you. Will you go out with me?", "Informal: gosto de você. Quer namorar comigo?", "좋아해. 사귈래?", joahae]
  - note: ["-았/었더니 tells what you did and what you found: 물어봤더니…, when I asked, (she said)…", "-았/었더니 conta o que você fez e o que descobriu: 물어봤더니…, quando perguntei, (ela disse)…"]
  - ask: ["Say: when I asked my cousin, she said you'd confess.", "Diga: quando perguntei à prima, ela disse que você ia se declarar.", "언니한테 물어봤더니 고백할 거라고 했어요.", eotdeoni]
  - ask: ["Ask casually: what do you think?", "Pergunte, informal: o que você acha?", "어떻게 생각해?", eotteoke-saenggakhae]
  - ask: ["Say: from today, day one.", "Diga: a partir de hoje, dia 1.", "오늘부터 1일이에요!", oneulbuteo]
  - ask: ["Casually: I'm happy.", "Informal: estou feliz.", "행복해.", haengbokhae]
  - ask: ["Casually: now you're my girlfriend.", "Informal: agora você é minha namorada.", "이제 내 여자 친구야.", yeojachingu]
  - ask: ["Ask casually: can I hold your hand?", "Pergunte, informal: posso pegar sua mão?", "손 잡아도 돼?", sondjapgo]
  - ask: ["Casually: me too.", "Informal: eu também.", "나도.", nado]
  - ask: ["Casually: I'm nervous.", "Informal: estou nervoso.", "떨리네.", ttolli]
  - ask: ["Say: a date.", "Diga: um encontro.", "데이트", deiteu]
  - pt_only: "Com o 고백 o namoro começa num dia exato — '오늘부터 1일' — e a partir dali se contam 100일, 200일… No Brasil o 'pedido de namoro' é parecido, mas a contagem de dias é bem coreana."
