id: A2-16
protagonist: m
title: ["No tip?", "Gorjeta? Não"]
situation: ["Dinner with Minjun and Seoyeon. Who pays? In Korea often one pays, or you split; there is no tip.", "Jantar com o Minjun e a Seoyeon. Quem paga? Na Coreia muitas vezes um paga, ou se divide; não há gorjeta."]
learn: [ko-must, ko-nikl-60]
culture: Paying, splitting, and no tipping
items:
  - [gyesan2, "계산", "paying the bill", "pagar a conta"]
  - [deochipei, "더치페이", "splitting the bill", "dividir a conta"]
  - [tip, "팁", "tip", "gorjeta"]
  - [jega-naelgeyo, "제가 낼게요", "I'll pay", "eu pago"]
  - [aya-hada, "-아야/어야 하다", "must, have to", "dever, ter que"]
  - [ge-adv, "-게", "-ly (how something is done)", "-mente (de que modo)"]
  - [ssage, "싸게", "cheaply", "barato (de modo barato)"]
  - [masitge, "맛있게 먹었어", "I enjoyed the meal (casual)", "comi muito bem (informal)"]
  - [nanwoseo, "나눠서 내자", "let's split it (casual)", "vamos dividir (informal)"]
  - [daeume-sa, "다음에 네가 사", "you pay next time (casual)", "da próxima você paga (informal)"]
  - [eolma-na-wasseo, "얼마 나왔어?", "how much is it? (the bill, casual)", "quanto deu? (a conta, informal)"]
  - [kadeu-dwaeyo, "카드 돼요?", "do you take cards?", "aceita cartão?"]
dialogue:
  - [minjun, "맛있게 먹었어! 얼마 나왔어?", "That was great! How much is it?", "Comi muito bem! Quanto deu?"]
  - [protagonist, "육만 원이야. 팁은 얼마 줘야 해?", "60,000 won. How much do we have to tip?", "Sessenta mil wons. Quanto tem que dar de gorjeta?"]
  - [minjun, "한국에는 팁이 없어. 안 줘도 돼.", "There's no tipping in Korea. You don't have to.", "Na Coreia não tem gorjeta. Não precisa dar."]
  - [protagonist, "진짜? 브라질은 보통 십 퍼센트 내.", "Really? In Brazil you usually pay ten per cent.", "Sério? No Brasil normalmente se paga dez por cento."]
  - [minjun, "오늘은 내가 낼게. 형이 지난번에 샀잖아.", "I'll pay today. You paid last time.", "Hoje eu pago. Você pagou da última vez."]
  - [protagonist, "아니야, 나눠서 내자. 더치페이 하자.", "No, let's split it.", "Não, vamos dividir."]
  - [minjun, "그럼 이번만. 다음에는 내가 싸게 맛있는 데 데려갈게.", "OK, just this once. Next time I'll take you somewhere cheap and good.", "Tá, só desta vez. Da próxima te levo num lugar barato e bom."]
  - [protagonist, "좋아. 다음에 네가 사!", "Deal. You pay next time!", "Fechado. Da próxima você paga!"]
teach:
  - ask: ["Casually: that was a great meal!", "Informal: comi muito bem!", "맛있게 먹었어!", masitge]
  - note: ["-게 makes a word say how: 맛있다 → 맛있게, deliciously; 싸다 → 싸게, cheaply.", "-게 transforma a palavra em modo: 맛있다 → 맛있게, gostosamente; 싸다 → 싸게, barato."]
  - ask: ["Say: somewhere cheap and good.", "Diga: um lugar barato e bom.", "싸게 맛있는 데", ssage, ge-adv]
  - ask: ["Casually: how much is it?", "Informal: quanto deu?", "얼마 나왔어?", eolma-na-wasseo]
  - note: ["-아야/어야 하다 is 'have to': 주다 → 줘야 해?, do we have to give…? 안 줘도 돼, you don't have to.", "-아야/어야 하다 é 'ter que': 주다 → 줘야 해?, tem que dar…? 안 줘도 돼, não precisa."]
  - ask: ["Ask casually how much you have to tip.", "Pergunte, informal, quanto tem que dar de gorjeta.", "팁은 얼마 줘야 해?", aya-hada, tip]
  - ask: ["Say: the bill, I'll pay (politely).", "Diga: a conta, eu pago (educado).", "제가 낼게요.", jega-naelgeyo]
  - ask: ["Say: let's split it, casually.", "Diga: vamos dividir, informal.", "나눠서 내자.", nanwoseo]
  - ask: ["Say: splitting the bill.", "Diga: dividir a conta.", "더치페이", deochipei]
  - ask: ["Tease: you pay next time.", "Brinque: da próxima você paga.", "다음에 네가 사!", daeume-sa]
  - ask: ["Ask the waiter if they take cards.", "Pergunte ao garçom se aceita cartão.", "카드 돼요?", kadeu-dwaeyo]
  - ask: ["Say: paying the bill.", "Diga: pagar a conta.", "계산", gyesan2]
  - pt_only: "No Brasil a taxa de serviço (10%) é opcional e vem na conta. Na Coreia não há gorjeta nenhuma; entre amigos é comum um pagar e o outro pagar na próxima vez — ou dividir."
