id: A2-28
protagonist: m
title: ["A trip to Busan", "Viagem a Busan"]
situation: ["A long weekend: the KTX to Busan with Minjun. Haeundae beach, the fish market, raw fish for the first time.", "Feriado prolongado: o KTX para Busan com o Minjun. A praia de Haeundae, o mercado de peixe, peixe cru pela primeira vez."]
learn: [ko-future, ko-nikl-56]
culture: Busan — the sea, the market, the dialect
items:
  - [gicha, "기차", "train", "trem"]
  - [pyo, "표", "ticket", "passagem"]
  - [hoe, "회", "raw fish (sashimi)", "peixe cru"]
  - [ktx, "KTX", "KTX (high-speed train)", "KTX (trem de alta velocidade)"]
  - [eul-geoya, "-(으)ㄹ 거야", "will (casual)", "vou (informal)"]
  - [geona2, "-거나", "or (between actions)", "ou (entre ações)"]
  - [haebyeon, "해변", "beach", "praia"]
  - [sijang2, "시장", "market", "mercado"]
  - [jwaseok, "좌석", "seat", "assento"]
  - [saturi, "사투리", "dialect", "sotaque, dialeto"]
  - [yemae, "예매했어", "I booked (a ticket) (casual)", "comprei antecipado (informal)"]
  - [seuleotda, "세 시간도 안 걸려", "it doesn't even take three hours (casual)", "não leva nem três horas (informal)"]
dialogue:
  - [minjun, "형, KTX 표 예매했어. 내일 아침 일곱 시야.", "Hyung, I booked the KTX tickets. Tomorrow, seven in the morning.", "Hyung, comprei as passagens do KTX. Amanhã, sete da manhã."]
  - [protagonist, "고마워! 부산까지 얼마나 걸려?", "Thanks! How long to Busan?", "Valeu! Quanto tempo até Busan?"]
  - [minjun, "세 시간도 안 걸려. 기차가 정말 빨라.", "Not even three hours. The train is really fast.", "Não leva nem três horas. O trem é muito rápido."]
  - [protagonist, "부산에서 뭐 할 거야?", "What will we do in Busan?", "O que a gente vai fazer em Busan?"]
  - [minjun, "해운대 해변에 가거나 자갈치 시장에 갈 거야.", "We'll go to Haeundae beach or the Jagalchi market.", "Vamos à praia de Haeundae ou ao mercado de Jagalchi."]
  - [protagonist, "시장에서 회 먹을 거야? 나는 회 처음이야.", "Will we eat raw fish at the market? It's my first time.", "Vamos comer peixe cru no mercado? É minha primeira vez."]
  - [minjun, "응! 그리고 부산 사람들은 사투리를 써. 재미있을 거야.", "Yeah! And people in Busan speak dialect. It'll be fun.", "É! E o pessoal de Busan fala com sotaque. Vai ser divertido."]
  - [protagonist, "좌석은 창가로 해 줘. 바다 볼 거야!", "Get me a window seat. I'm going to watch the sea!", "Pega janela para mim. Vou ver o mar!"]
teach:
  - ask: ["Casually: I booked the tickets.", "Informal: comprei as passagens.", "표 예매했어.", pyo, yemae]
  - ask: ["Say: the KTX, the high-speed train.", "Diga: o KTX, o trem de alta velocidade.", "KTX", ktx]
  - ask: ["Casually: it doesn't even take three hours.", "Informal: não leva nem três horas.", "세 시간도 안 걸려.", seuleotda]
  - ask: ["Say: the train is fast.", "Diga: o trem é rápido.", "기차가 빨라요.", gicha]
  - note: ["-(으)ㄹ 거야 is the future in 반말: 하다 → 할 거야, I'll do; 가다 → 갈 거야.", "-(으)ㄹ 거야 é o futuro em 반말: 하다 → 할 거야, vou fazer; 가다 → 갈 거야."]
  - ask: ["Ask casually: what will we do in Busan?", "Pergunte, informal: o que vamos fazer em Busan?", "부산에서 뭐 할 거야?", eul-geoya]
  - ask: ["Casually: we'll go to the beach or the market.", "Informal: vamos à praia ou ao mercado.", "해변에 가거나 시장에 갈 거야.", geona2, haebyeon, sijang2]
  - ask: ["Casually: will we eat raw fish?", "Informal: vamos comer peixe cru?", "회 먹을 거야?", hoe]
  - ask: ["Say people in Busan speak dialect.", "Diga que o pessoal de Busan fala com sotaque.", "부산 사람들은 사투리를 써요.", saturi]
  - ask: ["Ask for a window seat.", "Peça um assento na janela.", "창가 좌석으로 주세요.", jwaseok]
  - pt_only: "O KTX liga Seul a Busan em menos de três horas — mais rápido que ir de ônibus de São Paulo ao Rio. Busan tem praia, mercado de peixe e um sotaque famoso, como o nordestino no Brasil."
