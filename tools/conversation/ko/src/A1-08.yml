id: A1-08
protagonist: m
title: ["How old are you?", "Quantos anos?"]
situation: ["On the stairs Minjun asks your age. You are thirty, he is twenty-seven — so you become his 형, 'big brother'. He brings kimchi from Mrs Park.", "Na escada, o Minjun pergunta a sua idade. Você tem trinta, ele vinte e sete — então você vira o 형 dele, 'irmão mais velho'. Ele traz kimchi da senhora Park."]
learn: [ko-nikl-12, ko-numbers]
culture: The age question decides titles and speech level
items:
  - [sillyejiman, "실례지만", "Excuse me, but… (polite opener)", "Com licença, mas… (abertura educada)"]
  - [myeot-sal, "몇 살이에요?", "How old are you?", "Quantos anos você tem?"]
  - [seoreun-sal, "서른 살", "thirty years old", "trinta anos"]
  - [seumul-ilgop, "스물일곱 살", "twenty-seven years old", "vinte e sete anos"]
  - [hana-dul, "하나, 둘, 셋", "one, two, three (native Korean numbers)", "um, dois, três (números nativos)"]
  - [hyeong, "형", "big brother (said by a man)", "irmão mais velho (dito por homem)"]
  - [nuna, "누나", "big sister (said by a man)", "irmã mais velha (dito por homem)"]
  - [dongsaeng, "동생", "younger sibling; someone younger", "irmão mais novo; alguém mais novo"]
  - [geureom, "그럼", "then, in that case", "então"]
  - [ege, "에게", "to (a person)", "para (uma pessoa)"]
  - [jwoyo, "줘요", "gives / I give", "dá / eu dou"]
  - [gimchi, "김치", "kimchi", "kimchi"]
  - [jinjja, "진짜?", "Really?", "Sério?"]
dialogue:
  - [minjun, "저… 실례지만 몇 살이에요?", "Um… excuse me, but how old are you?", "Hum… com licença, quantos anos você tem?"]
  - [protagonist, "저는 서른 살이에요. 민준 씨는요?", "I'm thirty. And you, Minjun?", "Tenho trinta. E você, Minjun?"]
  - [minjun, "저는 스물일곱 살이에요. 그럼 형이에요!", "I'm twenty-seven. Then you're my big brother!", "Tenho vinte e sete. Então você é meu irmão mais velho!"]
  - [protagonist, "형? 진짜요?", "Big brother? Really?", "Irmão mais velho? Sério?"]
  - [minjun, "네, 형이에요. 저는 동생이에요.", "Yes, you're 형. I'm the younger one.", "Sim, você é o 형. Eu sou o mais novo."]
  - [minjun, "형, 이거 형에게 줘요. 할머니 김치예요.", "Hyung, this is for you. Grandma's kimchi.", "Hyung, isto é para você. O kimchi da vovó."]
  - [protagonist, "와, 김치! 고마워요.", "Wow, kimchi! Thanks.", "Nossa, kimchi! Obrigado."]
  - [minjun, "할머니 김치는 정말 맛있어요.", "Grandma's kimchi is really good.", "O kimchi da vovó é muito bom."]
teach:
  - note: ["Koreans ask your age early, to know who is older: it decides how they speak to you. It is not rude. 실례지만 softens the question.", "Os coreanos perguntam a idade logo cedo, para saber quem é mais velho: isso decide como vão falar com você. Não é falta de educação. 실례지만 suaviza a pergunta."]
  - build: [myeot-sal, ["-살이에요?", "몇 살이에요?"]]
  - ask: ["Ask his age, politely.", "Pergunte a idade dele, com educação.", "실례지만 몇 살이에요?", sillyejiman, myeot-sal]
  - note: ["Age is counted with native Korean numbers: 하나, 둘, 셋… 스물 (20), 서른 (30). Before 살: 한 살, 두 살, 스무 살.", "A idade se conta com os números nativos: 하나, 둘, 셋… 스물 (20), 서른 (30). Antes de 살: 한 살, 두 살, 스무 살."]
  - ask: ["Count to three in native Korean.", "Conte até três com os números nativos.", "하나, 둘, 셋.", hana-dul]
  - ask: ["Say that you are thirty.", "Diga que tem trinta anos.", "저는 서른 살이에요.", seoreun-sal]
  - ask: ["Minjun's age: twenty-seven.", "A idade do Minjun: vinte e sete.", "스물일곱 살이에요.", seumul-ilgop]
  - note: ["A man calls an older man 형 and an older woman 누나. Friends use these words too. Minjun is younger: he is your 동생.", "Um homem chama um homem mais velho de 형 e uma mulher mais velha de 누나. Amigos também usam essas palavras. O Minjun é mais novo: é o seu 동생."]
  - ask: ["He is younger. Say: then you are my younger one — I'm the big brother.", "Ele é mais novo. Diga: então eu sou o irmão mais velho.", "그럼 제가 형이에요.", geureom, hyeong]
  - ask: ["A woman of thirty-two is his… ?", "Uma mulher de trinta e dois anos é, para ele…?", "누나예요.", nuna]
  - ask: ["Say: I'm the younger one.", "Diga: eu sou o mais novo.", "저는 동생이에요.", dongsaeng]
  - note: ["에게 is 'to' a person: 형에게 줘요, I give it to you (hyung). In talk 한테 is just as common.", "에게 é 'para' uma pessoa: 형에게 줘요, dou para você (hyung). Na fala, 한테 é igualmente comum."]
  - ask: ["Say: I give this to Minjun.", "Diga: dou isto para o Minjun.", "이거 민준 씨에게 줘요.", ege, jwoyo]
  - ask: ["React: kimchi, really?", "Reaja: kimchi, sério?", "김치? 진짜?", gimchi, jinjja]
  - pt_only: "No Brasil perguntar a idade, sobretudo a uma mulher, pode soar indelicado. Na Coreia é a primeira coisa: sem saber quem é mais velho, ninguém sabe como falar."
