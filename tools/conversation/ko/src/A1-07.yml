id: A1-07
protagonist: f
title: [The office, O escritório]
situation: ["First day at the game company. The team lead, Lee Jieun, welcomes you and explains the day.", "Primeiro dia na empresa de jogos. A líder da equipe, Lee Jieun, recebe você e explica o dia."]
learn: [ko-object, ko-nikl-10, ko-nikl-11, ko-nikl-9]
culture: Titles, not first names — 팀장님
items:
  - [timjangnim, "팀장님", "team lead (as a title)", "líder da equipe (como tratamento)"]
  - [jal-butak, "잘 부탁드립니다", "I look forward to working with you (formal)", "Conto com você / prazer em trabalhar junto (formal)", {register: formal}]
  - [oneul-buteo, "오늘부터", "from today", "a partir de hoje"]
  - [buteo, "부터", "from (a time or place)", "a partir de, desde"]
  - [uri-tim, "우리 팀", "our team", "a nossa equipe"]
  - [jari, "자리", "seat, desk", "lugar, mesa"]
  - [hoeui, "회의", "meeting", "reunião"]
  - [e-time, "에", "at (a time), to (a place)", "a / às (horário), para (lugar)"]
  - [yeol-si, "열 시", "ten o'clock", "dez horas"]
  - [samcheung, "삼 층", "third floor", "terceiro andar"]
  - [euro, "(으)로", "to, towards (a direction)", "para (direção)"]
  - [oseyo, "오세요", "Come (polite)", "Venha (educado)"]
  - [algesseumnida, "알겠습니다", "Understood (formal)", "Entendido (formal)", {register: formal}]
  - [keopireul, "커피를 마셔요", "I drink coffee", "Eu tomo café"]
dialogue:
  - [jieun, "안녕하세요. 저는 이지은 팀장이에요.", "Hello. I'm Lee Jieun, the team lead.", "Olá. Eu sou Lee Jieun, a líder da equipe."]
  - [protagonist, "안녕하세요, 팀장님. 처음 뵙겠습니다. 잘 부탁드립니다.", "Hello, team lead. Nice to meet you. I look forward to working with you.", "Olá, líder. Muito prazer. Conto com a senhora."]
  - [jieun, "오늘부터 우리 팀이에요. 자리는 여기예요.", "From today you're in our team. Your desk is here.", "A partir de hoje você é da nossa equipe. Sua mesa é aqui."]
  - [protagonist, "감사합니다. 회의는 몇 시에 해요?", "Thank you. What time is the meeting?", "Obrigada. A reunião é a que horas?"]
  - [jieun, "열 시에 해요. 회의실은 삼 층이에요.", "At ten. The meeting room is on the third floor.", "Às dez. A sala de reunião fica no terceiro andar."]
  - [jieun, "열 시에 삼 층으로 오세요.", "Come to the third floor at ten.", "Venha para o terceiro andar às dez."]
  - [protagonist, "네, 알겠습니다.", "Yes, understood.", "Sim, entendido."]
  - [jieun, "커피 마셔요?", "Do you drink coffee?", "Você toma café?"]
  - [protagonist, "네, 커피를 마셔요. 감사합니다, 팀장님!", "Yes, I drink coffee. Thank you, team lead!", "Sim, tomo café. Obrigada, líder!"]
teach:
  - note: ["At work you call her by her title: 팀장님. Her name alone, 지은, would be rude; even 지은 씨 is too familiar for the boss.", "No trabalho você a chama pelo cargo: 팀장님. Só o nome, 지은, seria grosseiro; mesmo 지은 씨 é íntimo demais para a chefe."]
  - ask: ["Greet the team lead.", "Cumprimente a líder.", "안녕하세요, 팀장님.", timjangnim]
  - note: ["'잘 부탁드립니다' is said on the first day, to the team, with a bow: 'please treat me well'.", "'잘 부탁드립니다' se diz no primeiro dia, para a equipe, com uma reverência: 'conto com vocês'."]
  - build: [jal-butak, ["-드립니다", "부탁드립니다", "잘 부탁드립니다"]]
  - ask: ["Introduce yourself to the team on your first day, formally.", "Apresente-se à equipe no primeiro dia, de modo formal.", "처음 뵙겠습니다. 잘 부탁드립니다.", cheoeum, jal-butak]
  - note: ["부터 is 'from': 오늘부터, from today. With 까지: 아홉 시부터 여섯 시까지, from nine to six.", "부터 é 'a partir de': 오늘부터, a partir de hoje. Com 까지: 아홉 시부터 여섯 시까지, das nove às seis."]
  - ask: ["Say: from today it's our team.", "Diga: a partir de hoje é a nossa equipe.", "오늘부터 우리 팀이에요.", oneul-buteo, buteo, uri-tim]
  - ask: ["She shows your desk. Say: my desk is here.", "Ela mostra a mesa. Diga: meu lugar é aqui.", "자리는 여기예요.", jari]
  - note: ["에 after a time is 'at': 열 시에, at ten. 몇 시에 해요? — at what time is it?", "에 depois de horário é 'às': 열 시에, às dez. 몇 시에 해요? — é a que horas?"]
  - ask: ["Ask what time the meeting is.", "Pergunte a que horas é a reunião.", "회의는 몇 시에 해요?", hoeui, e-time]
  - ask: ["Say: at ten.", "Diga: às dez.", "열 시에 해요.", yeol-si, e-time]
  - note: ["(으)로 points a direction: 삼 층으로 오세요, come to the third floor. 로 after a vowel or ㄹ: 회사로.", "(으)로 indica direção: 삼 층으로 오세요, venha para o terceiro andar. 로 depois de vogal ou ㄹ: 회사로."]
  - ask: ["Tell someone to come to the third floor.", "Diga a alguém para vir ao terceiro andar.", "삼 층으로 오세요.", samcheung, euro, oseyo]
  - ask: ["Your boss gives an instruction. Answer 'understood', formally.", "A chefe dá uma instrução. Responda 'entendido', formal.", "알겠습니다.", algesseumnida]
  - ask: ["Say that you drink coffee.", "Diga que você toma café.", "커피를 마셔요.", keopireul, eul-reul]
  - pt_only: "No Brasil a gente chama a chefe pelo nome, às vezes até pelo apelido. Na Coreia, o cargo é o nome: 팀장님, 부장님, 사장님."
