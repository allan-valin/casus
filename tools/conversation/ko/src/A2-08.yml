id: A2-08
protagonist: m
title: [Chuseok, Chuseok]
situation: ["Chuseok, the harvest holiday. Minjun takes you to his parents' house; his mother makes songpyeon, his father prepares the ancestral rite.", "Chuseok, o feriado da colheita. O Minjun leva você à casa dos pais; a mãe faz 송편, o pai prepara o rito aos antepassados."]
learn: [ko-honorific, ko-nikl-54, ko-nikl-49]
culture: Chuseok — going home, songpyeon, the ancestral rite (차례)
items:
  - [chuseok, "추석", "Chuseok (harvest festival)", "Chuseok (festa da colheita)"]
  - [songpyeon, "송편", "songpyeon (half-moon rice cakes)", "송편 (bolinhos de arroz)"]
  - [charye, "차례", "ancestral rite on holidays", "rito aos antepassados"]
  - [gohyang, "고향", "home town", "cidade natal"]
  - [eusi2, "-(으)시-", "honour (for the person acting)", "honra (para quem age)"]
  - [hanteseo, "한테서", "from (a person)", "de (uma pessoa)"]
  - [cheoreom, "처럼", "like, as", "como"]
  - [eomeonim, "어머님", "mother (respectful)", "mãe (respeitoso)"]
  - [abeonim, "아버님", "father (respectful)", "pai (respeitoso)"]
  - [baewosseoyo, "배웠어요", "learned", "aprendi"]
  - [mandeuseyo, "만드세요", "(she) is making (respectful)", "(ela) está fazendo (respeitoso)"]
  - [gajokcheoreom, "가족처럼", "like family", "como da família"]
dialogue:
  - [minjun, "형, 여기가 우리 고향 집이야. 추석이라서 다 모였어.", "Hyung, this is our family home. Everyone's here for Chuseok.", "Hyung, esta é a casa da família. Todo mundo veio para o Chuseok."]
  - [protagonist, "와, 사람이 많아. 어머님은 뭐 하셔?", "Wow, lots of people. What's your mother doing?", "Nossa, quanta gente. O que sua mãe está fazendo?"]
  - [minjun, "송편 만드셔. 형도 만들어 봐!", "She's making songpyeon. You try too!", "Está fazendo 송편. Faz também!"]
  - [protagonist, "어떻게 만들어? 처음이야.", "How do you make it? It's my first time.", "Como faz? É a primeira vez."]
  - [minjun, "나도 엄마한테서 배웠어. 반달처럼 만들어.", "I learned it from mum too. You make it like a half moon.", "Eu também aprendi com a minha mãe. Faz como uma meia-lua."]
  - [protagonist, "반달처럼? 이렇게?", "Like a half moon? Like this?", "Como meia-lua? Assim?"]
  - [minjun, "잘했어! 내일 아침에는 아버지가 차례를 지내셔.", "Nice! Tomorrow morning my father performs the ancestral rite.", "Boa! Amanhã de manhã meu pai faz o 차례."]
  - [protagonist, "고마워. 가족처럼 대해 줘서.", "Thanks. For treating me like family.", "Valeu. Por me tratar como da família."]
teach:
  - ask: ["Say: Chuseok, the harvest holiday.", "Diga: Chuseok, o feriado da colheita.", "추석", chuseok]
  - ask: ["Say this is the family home.", "Diga que esta é a casa da família.", "고향 집이에요.", gohyang]
  - note: ["Speaking about his parents, honour them with -(으)시-, even in 반말 to Minjun: 하다 → 하셔?, 만들다 → 만드셔. For them: 어머님, 아버님.", "Falando dos pais dele, honre-os com -(으)시-, mesmo em 반말 com o Minjun: 하다 → 하셔?, 만들다 → 만드셔. Para eles: 어머님, 아버님."]
  - ask: ["Ask Minjun casually what his mother is doing — with honour for her.", "Pergunte ao Minjun, informal, o que a mãe dele está fazendo — com respeito a ela.", "어머님은 뭐 하셔?", eomeonim, eusi2]
  - ask: ["Politely: his mother is making songpyeon.", "Educado: a mãe dele está fazendo 송편.", "어머님께서 송편을 만드세요.", mandeuseyo, songpyeon]
  - note: ["한테서 is 'from' a person: 엄마한테서 배웠어, I learned from mum.", "한테서 é 'de' uma pessoa: 엄마한테서 배웠어, aprendi com a mãe."]
  - ask: ["Say you learned it from your mother.", "Diga que aprendeu com a sua mãe.", "엄마한테서 배웠어요.", hanteseo, baewosseoyo]
  - note: ["처럼 is 'like': 반달처럼, like a half moon; 가족처럼, like family.", "처럼 é 'como': 반달처럼, como meia-lua; 가족처럼, como da família."]
  - ask: ["Say: make it like a half moon.", "Diga: faça como uma meia-lua.", "반달처럼 만들어요.", cheoreom]
  - ask: ["Say his father performs the ancestral rite.", "Diga que o pai dele faz o rito aos antepassados.", "아버님께서 차례를 지내세요.", abeonim, charye]
  - ask: ["Thank them: you treated me like family.", "Agradeça: me trataram como da família.", "가족처럼 대해 주셔서 감사합니다.", gajokcheoreom]
  - pt_only: "O Chuseok é como um Natal coreano no outono: todo mundo viaja para a casa da família, faz 송편 juntos e presta homenagem aos antepassados com o 차례."
