id: A1-03
protagonist: f
title: [The body, O corpo]
situation: ["On the stairs Mrs Park carries heavy boxes of side dishes. Her back hurts. Later Minjun asks about her.", "Na escada, a senhora Park carrega caixas pesadas de 반찬. As costas dela doem. Depois o Minjun pergunta por ela."]
learn: [ko-topic-subject, ko-nikl-5, ko-nikl-4]
culture: Helping an older neighbour, and speaking of her with respect
items:
  - [gwaenchaneuseyo, "괜찮으세요?", "Are you all right? (respectful)", "A senhora está bem? (respeitoso)"]
  - [heori, "허리", "lower back, waist", "costas (lombar), cintura"]
  - [meori, "머리", "head", "cabeça"]
  - [son, "손", "hand", "mão"]
  - [dari, "다리", "leg", "perna"]
  - [apayo, "아파요", "hurts / is ill", "dói / está doente"]
  - [eun-neun, "은/는", "topic particle; also contrast (은 after a consonant, 는 after a vowel)", "partícula de tópico; também contraste (은 depois de consoante, 는 depois de vogal)"]
  - [mugeowoyo, "무거워요", "is heavy", "é pesado"]
  - [jega-deulgeyo, "제가 들게요", "I'll carry it", "Eu carrego"]
  - [gomawoyo, "고마워요", "Thanks (polite, warm)", "Obrigada (educado, caloroso)"]
  - [gwaenchanayo, "괜찮아요", "It's fine / I'm fine", "Tudo bem / estou bem"]
  - [kkeseo, "께서", "subject particle for an honoured person", "partícula de sujeito para pessoa respeitada"]
  - [apeuseyo, "아프세요", "is ill / hurts (said of an honoured person)", "está doente / dói (dito de pessoa respeitada)"]
dialogue:
  - [protagonist, "할머니, 괜찮으세요?", "Grandma, are you all right?", "Vovó, a senhora está bem?"]
  - [park, "아이고, 허리가 아파요.", "Oh dear, my back hurts.", "Ai, minhas costas doem."]
  - [protagonist, "이거 무거워요. 제가 들게요.", "This is heavy. I'll carry it.", "Isto é pesado. Eu carrego."]
  - [park, "고마워요. 손은 괜찮아요. 허리는 아파요.", "Thanks. My hands are fine. My back hurts.", "Obrigada. As mãos estão bem. As costas é que doem."]
  - [protagonist, "괜찮아요. 천천히 가세요.", "No problem. Take it slowly.", "Imagina. Vá devagar."]
  - [park, "고마워요. 머리는 괜찮아요!", "Thanks. At least my head is fine!", "Obrigada. Pelo menos a cabeça está boa!"]
  - [minjun, "할머니 괜찮으세요?", "Is grandma all right?", "A vovó está bem?"]
  - [protagonist, "할머니께서 허리가 아프세요.", "Grandma's back hurts.", "As costas da vovó estão doendo."]
teach:
  - build: [gwaenchaneuseyo, ["-으세요?", "-찮으세요?", "괜찮으세요?"]]
  - ask: ["Ask Mrs Park if she is all right.", "Pergunte à senhora Park se ela está bem.", "할머니, 괜찮으세요?", halmeoni, gwaenchaneuseyo]
  - note: ["'허리가 아파요': the back hurts. What hurts takes 이/가.", "'허리가 아파요': as costas doem. O que dói leva 이/가."]
  - line: [park, apayo]
  - ask: ["Say that your head hurts.", "Diga que a cabeça dói.", "머리가 아파요.", meori, apayo]
  - ask: ["Now your leg.", "Agora a perna.", "다리가 아파요.", dari, apayo]
  - ask: ["Now your back.", "Agora as costas.", "허리가 아파요.", heori, apayo]
  - note: ["은/는 marks the topic, and sets two things against each other: 손은 괜찮아요, 허리는 아파요 — the hands are fine, the back (on the other hand) hurts.", "은/는 marca o tópico e contrapõe duas coisas: 손은 괜찮아요, 허리는 아파요 — as mãos estão bem, já as costas doem."]
  - ask: ["Say: my hands are fine, my back hurts.", "Diga: as mãos estão bem, as costas doem.", "손은 괜찮아요. 허리는 아파요.", son, eun-neun, gwaenchanayo]
  - ask: ["Say: this is heavy, I'll carry it.", "Diga: isto é pesado, eu carrego.", "이거 무거워요. 제가 들게요.", mugeowoyo, jega-deulgeyo]
  - ask: ["Thank her warmly.", "Agradeça com carinho.", "고마워요.", gomawoyo]
  - note: ["Speaking ABOUT an elder, honour her twice: 께서 instead of 이/가, and -세요 on the verb: 할머니께서 아프세요.", "Falando SOBRE uma pessoa mais velha, honre duas vezes: 께서 no lugar de 이/가, e -세요 no verbo: 할머니께서 아프세요."]
  - build: [apeuseyo, ["-프세요", "아프세요"]]
  - ask: ["Tell Minjun that grandma is unwell.", "Diga ao Minjun que a vovó não está bem.", "할머니께서 아프세요.", kkeseo, apeuseyo]
  - ask: ["Tell him that grandma's back hurts.", "Diga a ele que as costas da vovó doem.", "할머니께서 허리가 아프세요.", kkeseo, heori, apeuseyo]
  - pt_only: "Em português dizemos 'a senhora' para mostrar respeito. Em coreano o respeito entra até na gramática: muda a partícula (께서) e muda o verbo (-세요)."
