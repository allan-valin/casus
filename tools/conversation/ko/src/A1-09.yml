id: A1-09
protagonist: f
title: [Colours, Cores]
situation: ["After work, the team lead takes you to a friend's clothes shop near the office. Seoul dresses up, even for a walk.", "Depois do trabalho, a líder leva você à loja de roupas de uma amiga perto do escritório. Seul se veste com cuidado, até para um passeio."]
learn: [ko-nikl-14, ko-nikl-15]
culture: People dress with care in Seoul
items:
  - [ot, "옷", "clothes", "roupa"]
  - [chima, "치마", "skirt", "saia"]
  - [baji, "바지", "trousers", "calça"]
  - [ppalgansaek, "빨간색", "red", "vermelho"]
  - [geomeunsaek, "검은색", "black", "preto"]
  - [hayansaek, "하얀색", "white", "branco"]
  - [eottaeyo, "어때요?", "How is it? / What do you think?", "Que tal?"]
  - [yeppeoyo, "예뻐요", "is pretty", "é bonito"]
  - [hago, "하고", "and, with (between nouns, in talk)", "e, com (entre substantivos, na fala)"]
  - [joayo, "좋아요", "I like it / is good", "gosto / é bom"]
  - [ui, "의", "of, 's (possession; often dropped in talk)", "de (posse; muitas vezes some na fala)"]
  - [je, "제", "my (polite; = 저의)", "meu, minha (educado; = 저의)"]
  - [chingu, "친구", "friend", "amigo, amiga"]
  - [gage, "가게", "shop", "loja"]
dialogue:
  - [jieun, "여기는 제 친구의 가게예요.", "This is my friend's shop.", "Esta é a loja da minha amiga."]
  - [protagonist, "와, 옷이 정말 예뻐요!", "Wow, the clothes are really pretty!", "Nossa, as roupas são lindas!"]
  - [jieun, "이 치마 어때요?", "What do you think of this skirt?", "Que tal esta saia?"]
  - [protagonist, "예뻐요! 빨간색하고 검은색이 있어요?", "Pretty! Is there red and black?", "Linda! Tem vermelha e preta?"]
  - [jieun, "네, 있어요. 저는 검은색이 좋아요.", "Yes. I like the black one.", "Tem. Eu gosto da preta."]
  - [protagonist, "저는 빨간색이 좋아요.", "I like the red one.", "Eu gosto da vermelha."]
  - [jieun, "하얀색 바지도 예뻐요.", "The white trousers are pretty too.", "A calça branca também é bonita."]
  - [protagonist, "팀장님 친구 가게, 정말 좋아요!", "Your friend's shop is really nice!", "A loja da sua amiga é ótima!"]
teach:
  - note: ["의 is 'of', like an apostrophe-s: 친구의 가게, the friend's shop. In talk it is often dropped: 친구 가게. 저의 shortens to 제: 제 친구.", "의 é 'de', a posse: 친구의 가게, a loja da amiga. Na fala muitas vezes some: 친구 가게. 저의 vira 제: 제 친구."]
  - ask: ["Say: this is my friend's shop.", "Diga: esta é a loja da minha amiga.", "여기는 제 친구의 가게예요.", je, chingu, ui, gage]
  - ask: ["Say that the clothes are pretty.", "Diga que as roupas são bonitas.", "옷이 예뻐요.", ot, yeppeoyo]
  - ask: ["Ask her what she thinks of this skirt.", "Pergunte o que ela acha desta saia.", "이 치마 어때요?", chima, eottaeyo]
  - note: ["Colours end in -색, 'colour': 빨간색, 검은색, 하얀색. 하고 joins two nouns in talk: 빨간색하고 검은색.", "As cores terminam em -색, 'cor': 빨간색, 검은색, 하얀색. 하고 liga dois substantivos na fala: 빨간색하고 검은색."]
  - build: [ppalgansaek, ["-색", "-간색", "빨간색"]]
  - ask: ["Ask if there is red and black.", "Pergunte se tem vermelho e preto.", "빨간색하고 검은색이 있어요?", ppalgansaek, hago, geomeunsaek]
  - ask: ["Say that you like the red one.", "Diga que você gosta da vermelha.", "저는 빨간색이 좋아요.", joayo]
  - ask: ["Say: the white trousers are pretty too.", "Diga: a calça branca também é bonita.", "하얀색 바지도 예뻐요.", hayansaek, baji]
  - ask: ["Say: your friend's shop is really nice — to your boss, with her title.", "Diga: a loja da sua amiga é ótima — para a chefe, com o cargo.", "팀장님 친구 가게, 정말 좋아요!", timjangnim]
  - pt_only: "Em Seul as pessoas se arrumam até para ir ao mercado; roupa de academia na rua chama atenção. Não é regra, é costume."
