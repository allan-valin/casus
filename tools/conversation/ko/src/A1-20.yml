id: A1-20
protagonist: m
title: ["I want…", "Eu quero…"]
situation: ["Saturday morning, a café in Yeonnam-dong with Minjun. Iced americano, even in winter.", "Sábado de manhã, um café em Yeonnam-dong com o Minjun. Americano gelado, até no inverno."]
learn: [ko-want, ko-nikl-38]
culture: Iced americano all year (얼죽아)
items:
  - [amerikano, "아메리카노", "americano", "americano"]
  - [go-sipeoyo, "-고 싶어요", "I want to…", "quero…"]
  - [ttatteuthan, "따뜻한", "hot, warm (before a noun)", "quente (antes do substantivo)"]
  - [chagaun, "차가운", "cold, iced (before a noun)", "gelado (antes do substantivo)"]
  - [aiseu, "아이스", "iced", "gelado"]
  - [jan, "잔", "cup (counter)", "xícara (classificador)"]
  - [mwo-masil-lae, "뭐 마실래요?", "What will you drink?", "O que você vai beber?"]
  - [ppang, "빵", "bread, pastry", "pão, doce"]
  - [gyeoul2, "겨울인데", "even though it's winter", "mesmo sendo inverno"]
  - [swieoyo, "쉬고 싶어요", "I want to rest", "quero descansar"]
  - [eolmayeyo2, "다 해서 얼마예요?", "How much is it all together?", "Quanto dá tudo?"]
  - [pojang, "포장해 주세요", "To go, please", "Para viagem, por favor"]
dialogue:
  - [minjun, "형, 뭐 마실래요?", "Hyung, what will you drink?", "Hyung, o que você vai beber?"]
  - [protagonist, "따뜻한 커피 마시고 싶어요. 추워요.", "I want a hot coffee. It's cold.", "Quero um café quente. Está frio."]
  - [minjun, "저는 아이스 아메리카노요.", "I'll have an iced americano.", "Eu, um americano gelado."]
  - [protagonist, "겨울인데 차가운 커피요?", "Cold coffee, in winter?", "Café gelado no inverno?"]
  - [minjun, "네! 한국에서는 '얼죽아'예요. 얼어 죽어도 아이스 아메리카노!", "Yes! In Korea it's 'eoljuga': iced americano even if you freeze to death!", "Sim! Na Coreia é '얼죽아': americano gelado nem que morra congelado!"]
  - [protagonist, "하하. 그럼 아메리카노 두 잔 주세요. 빵도 먹고 싶어요.", "Haha. Then two americanos, please. I want a pastry too.", "Haha. Então dois americanos, por favor. Quero um doce também."]
  - [minjun, "오늘은 집에서 쉬고 싶어요. 포장해요?", "Today I want to rest at home. Shall we get it to go?", "Hoje quero descansar em casa. Vamos levar?"]
  - [protagonist, "네, 포장해 주세요. 다 해서 얼마예요?", "Yes, to go, please. How much is it all together?", "Sim, para viagem, por favor. Quanto dá tudo?"]
teach:
  - ask: ["Ask Minjun what he will drink.", "Pergunte ao Minjun o que ele vai beber.", "뭐 마실래요?", mwo-masil-lae]
  - note: ["-고 싶어요 is 'I want to': 마시다 → 마시고 싶어요, I want to drink.", "-고 싶어요 é 'quero': 마시다 → 마시고 싶어요, quero beber."]
  - ask: ["Say you want a hot coffee.", "Diga que quer um café quente.", "따뜻한 커피 마시고 싶어요.", ttatteuthan, go-sipeoyo]
  - ask: ["Order an iced americano.", "Peça um americano gelado.", "아이스 아메리카노 주세요.", aiseu, amerikano]
  - ask: ["Ask: cold coffee, in winter?", "Pergunte: café gelado no inverno?", "겨울인데 차가운 커피요?", gyeoul2, chagaun]
  - ask: ["Order two americanos.", "Peça dois americanos.", "아메리카노 두 잔 주세요.", jan]
  - ask: ["Say you want a pastry too.", "Diga que quer um doce também.", "빵도 먹고 싶어요.", ppang]
  - ask: ["Say you want to rest today.", "Diga que quer descansar hoje.", "오늘은 쉬고 싶어요.", swieoyo]
  - ask: ["Ask for it to go.", "Peça para viagem.", "포장해 주세요.", pojang]
  - ask: ["Ask how much it is all together.", "Pergunte quanto dá tudo.", "다 해서 얼마예요?", eolmayeyo2]
  - pt_only: "'얼죽아' (얼어 죽어도 아이스 아메리카노) é piada séria: muita gente toma americano gelado em pleno inverno. No Brasil, cafezinho é quente e pequeno."
