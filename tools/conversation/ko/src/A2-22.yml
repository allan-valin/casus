id: A2-22
protagonist: m
title: ["Polluted air", "Ar poluído"]
situation: ["A grey spring morning. Minjun checks the fine-dust app before your run along the river.", "Uma manhã cinzenta de primavera. O Minjun confere o aplicativo de poeira fina antes da corrida no rio."]
learn: [ko-nikl-84, ko-nikl-41]
culture: Fine-dust days and masks
items:
  - [misemeonji, "미세먼지", "fine dust", "poeira fina"]
  - [maseukeu, "마스크", "mask", "máscara"]
  - [gonggi, "공기", "air", "ar"]
  - [aep, "앱", "app", "aplicativo"]
  - [eulkka-boda, "-(으)ㄹ까 봐요", "I think I might… / I'm thinking of…", "acho que vou…"]
  - [ji-ana2, "-지 않아", "not (casual, long form)", "não (informal, forma longa)"]
  - [nappa, "나빠", "it's bad (casual)", "está ruim (informal)"]
  - [darigi, "달리기", "running", "corrida"]
  - [jibeseo, "집에서 운동할까 봐", "I think I'll work out at home (casual)", "acho que vou treinar em casa (informal)"]
  - [hwanggi, "환기", "airing (the room)", "ventilar (o cômodo)"]
  - [ssayo2, "써", "wear (casual; a mask)", "usa (informal; máscara)"]
  - [haneul-hoesaek, "하늘이 회색이야", "the sky is grey", "o céu está cinza"]
dialogue:
  - [minjun, "형, 오늘 미세먼지가 너무 나빠. 앱 봐.", "Hyung, the fine dust is terrible today. Look at the app.", "Hyung, a poeira fina está horrível hoje. Olha o aplicativo."]
  - [protagonist, "그래서 하늘이 회색이구나. 공기가 좋지 않아.", "So that's why the sky is grey. The air isn't good.", "Por isso o céu está cinza. O ar não está bom."]
  - [minjun, "달리기는 안 하는 게 좋아.", "Better not to go running.", "Melhor não correr."]
  - [protagonist, "그럼 오늘은 집에서 운동할까 봐.", "Then I think I'll work out at home today.", "Então acho que hoje vou treinar em casa."]
  - [minjun, "나가면 마스크 꼭 써. KF94로.", "If you go out, wear a mask for sure. A KF94.", "Se sair, usa máscara sem falta. Uma KF94."]
  - [protagonist, "창문도 열지 않을까 봐. 환기는 언제 해?", "I think I won't open the windows either. When do you air the room?", "Acho que nem vou abrir a janela. Quando se ventila a casa?"]
  - [minjun, "미세먼지가 좋은 날에 해. 앱으로 확인해.", "On days when the dust is good. Check with the app.", "Nos dias de ar bom. Confere no aplicativo."]
  - [protagonist, "알았어. 한국 생활은 앱이 정말 중요하네.", "Got it. In Korean life apps really matter.", "Entendi. Na vida coreana o aplicativo é essencial."]
teach:
  - ask: ["Casually: the fine dust is terrible today.", "Informal: a poeira fina está horrível hoje.", "오늘 미세먼지가 너무 나빠.", misemeonji, nappa]
  - ask: ["Say: look at the app.", "Diga: olha o aplicativo.", "앱 봐요.", aep]
  - ask: ["Casually: the sky is grey.", "Informal: o céu está cinza.", "하늘이 회색이야.", haneul-hoesaek]
  - ask: ["Casually: the air isn't good (long negation).", "Informal: o ar não está bom (negação longa).", "공기가 좋지 않아.", gonggi, ji-ana2]
  - note: ["-(으)ㄹ까 봐(요) says what you're thinking of doing: 운동하다 → 운동할까 봐, I think I'll work out.", "-(으)ㄹ까 봐(요) diz o que você está pensando em fazer: 운동하다 → 운동할까 봐, acho que vou treinar."]
  - ask: ["Casually: I think I'll work out at home.", "Informal: acho que vou treinar em casa.", "집에서 운동할까 봐.", jibeseo, eulkka-boda]
  - ask: ["Say: better not to go running.", "Diga: melhor não correr.", "달리기는 안 하는 게 좋아요.", darigi]
  - ask: ["Tell a friend to wear a mask, casually.", "Diga a um amigo, informal, para usar máscara.", "마스크 꼭 써.", maseukeu, ssayo2]
  - ask: ["Ask when to air the room.", "Pergunte quando ventilar a casa.", "환기는 언제 해요?", hwanggi]
  - pt_only: "Na primavera o vento traz poeira fina (미세먼지) e o céu fica cinza; os coreanos checam o índice no aplicativo como checamos a previsão de chuva — e usam máscara KF94."
