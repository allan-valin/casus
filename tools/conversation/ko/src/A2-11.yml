id: A2-11
protagonist: f
title: ["Couples", "Casais"]
situation: ["Seoyeon and her boyfriend celebrate 100 days together — matching outfits, a gift. She tells you how they met.", "A Seoyeon e o namorado comemoram 100 dias juntos — roupas iguais, um presente. Ela conta como se conheceram."]
learn: [ko-nikl-78, ko-nikl-74]
culture: Couple anniversaries every 100 days
items:
  - [keopeul, "커플", "couple", "casal"]
  - [baegil, "100일", "100 days (anniversary)", "100 dias (aniversário)"]
  - [seonmul, "선물", "present, gift", "presente"]
  - [sagwieoyo, "사귀어요", "go out with, date", "namora"]
  - [eun-ji, "-(으)ㄴ 지", "since (time passed)", "faz (tempo desde)"]
  - [ge-doeda, "-게 되다", "come to (do), end up", "acabar (fazendo), passar a"]
  - [namjachingu, "남자 친구", "boyfriend", "namorado"]
  - [ttokgateun, "똑같은 옷", "identical clothes", "roupas iguais"]
  - [chukha, "축하해요", "congratulations", "parabéns"]
  - [eotteoke-mannasseoyo, "어떻게 만났어요?", "How did you meet?", "Como vocês se conheceram?"]
  - [hakgyo, "학교", "school, university", "escola, faculdade"]
  - [bureowoyo, "부러워요", "I'm jealous (in a nice way)", "que inveja (no bom sentido)"]
dialogue:
  - [seoyeon, "언니, 오늘 남자 친구랑 100일이에요!", "Unni, today is 100 days with my boyfriend!", "Unni, hoje faz 100 dias com meu namorado!"]
  - [protagonist, "와, 축하해요! 사귄 지 벌써 100일이에요?", "Wow, congratulations! It's already 100 days since you started dating?", "Nossa, parabéns! Já faz 100 dias que vocês namoram?"]
  - [seoyeon, "네! 그래서 똑같은 옷을 입었어요.", "Yes! So we're wearing matching clothes.", "Sim! Por isso estamos com roupas iguais."]
  - [protagonist, "어떻게 만났어요?", "How did you meet?", "Como vocês se conheceram?"]
  - [seoyeon, "학교에서 같은 수업을 들었어요. 그래서 친해지게 됐어요.", "We took the same class at university. That's how we got close.", "Fazíamos a mesma aula na faculdade. Assim ficamos próximos."]
  - [protagonist, "선물도 받았어요?", "Did you get a present too?", "Ganhou presente também?"]
  - [seoyeon, "목걸이 받았어요. 저는 시계를 줬어요.", "I got a necklace. I gave him a watch.", "Ganhei um colar. Eu dei um relógio."]
  - [protagonist, "정말 부러워요!", "I'm so jealous!", "Que inveja!"]
teach:
  - ask: ["Congratulate her.", "Dê os parabéns.", "축하해요!", chukha]
  - note: ["-(으)ㄴ 지 + time: how long since: 사귀다 → 사귄 지 100일이에요, it's 100 days since they started dating.", "-(으)ㄴ 지 + tempo: quanto tempo faz: 사귀다 → 사귄 지 100일이에요, faz 100 dias que namoram."]
  - ask: ["Ask: it's already 100 days since you started dating?", "Pergunte: já faz 100 dias que vocês namoram?", "사귄 지 벌써 100일이에요?", eun-ji, baegil, sagwieoyo]
  - ask: ["Say: they're a couple.", "Diga: eles são um casal.", "커플이에요.", keopeul]
  - ask: ["Say they're wearing identical clothes.", "Diga que estão com roupas iguais.", "똑같은 옷을 입었어요.", ttokgateun]
  - ask: ["Ask how they met.", "Pergunte como se conheceram.", "어떻게 만났어요?", eotteoke-mannasseoyo]
  - note: ["-게 되다 says how something came about, not by plan: 친해지다 → 친해지게 됐어요, we got close (it happened).", "-게 되다 diz como algo acabou acontecendo: 친해지다 → 친해지게 됐어요, ficamos próximos (aconteceu)."]
  - ask: ["Say: that's how we got close.", "Diga: assim ficamos próximos.", "그래서 친해지게 됐어요.", ge-doeda]
  - ask: ["Say: my boyfriend.", "Diga: meu namorado.", "제 남자 친구", namjachingu]
  - ask: ["Say: we took a class at university.", "Diga: fizemos uma aula na faculdade.", "학교에서 수업을 들었어요.", hakgyo]
  - ask: ["Ask if she got a present.", "Pergunte se ela ganhou presente.", "선물도 받았어요?", seonmul]
  - ask: ["Say you're jealous, in a nice way.", "Diga que está com inveja, no bom sentido.", "부러워요!", bureowoyo]
  - pt_only: "Casais coreanos comemoram a cada 100 dias (100일, 200일…), muitas vezes com roupas combinando. No Brasil comemora-se o 'mesversário' — parecido, mas menos à vista."
