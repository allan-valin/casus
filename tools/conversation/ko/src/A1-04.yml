id: A1-04
protagonist: m
title: [The convenience store, A loja de conveniência]
situation: ["Downstairs is a convenience store open day and night. You buy water and instant noodles from the owner.", "No térreo há uma loja de conveniência aberta dia e noite. Você compra água e 라면 com o dono."]
learn: [ko-nikl-6, ko-nikl-3]
culture: Paying and receiving with both hands
items:
  - [eoseo-oseyo, "어서 오세요", "Welcome (to a shop)", "Seja bem-vindo (na loja)"]
  - [mul, "물", "water", "água"]
  - [ramyeon, "라면", "instant noodles", "miojo / lámen"]
  - [igeo, "이거", "this (thing)", "isto"]
  - [juseyo, "주세요", "Please give me…", "Me dá…, por favor"]
  - [do, "도", "too, also (replaces 이/가 or 을/를)", "também (no lugar de 이/가 ou 을/를)"]
  - [bongtu, "봉투", "plastic bag", "sacola"]
  - [piryohaseyo, "필요하세요?", "Do you need…? (polite)", "O senhor precisa de…? (educado)"]
  - [eolmayeyo, "얼마예요?", "How much is it?", "Quanto é?"]
  - [won, "원", "won (the money)", "won (a moeda)"]
  - [kkaji, "까지", "until, up to", "até"]
  - [myeot-si, "몇 시", "what time", "que horas"]
  - [haeyo, "해요", "does; is open (a shop)", "faz; funciona (uma loja)"]
dialogue:
  - [sajang, "어서 오세요.", "Welcome.", "Seja bem-vindo."]
  - [protagonist, "안녕하세요. 물이 어디 있어요?", "Hello. Where is the water?", "Olá. Onde fica a água?"]
  - [sajang, "물은 저기 있어요.", "The water is over there.", "A água fica ali."]
  - [protagonist, "이거 주세요. 라면도 주세요.", "This one, please. And noodles too.", "Me dá esta. E um lámen também."]
  - [sajang, "봉투 필요하세요?", "Do you need a bag?", "Precisa de sacola?"]
  - [protagonist, "네, 봉투도 주세요. 얼마예요?", "Yes, a bag too. How much is it?", "Sim, uma sacola também. Quanto é?"]
  - [sajang, "삼천 원이에요.", "Three thousand won.", "Três mil wons."]
  - [protagonist, "몇 시까지 해요?", "Until what time are you open?", "Até que horas funciona?"]
  - [sajang, "우리 가게는 밤에도 해요. 스물네 시간 해요!", "Our shop is open at night too. Twenty-four hours!", "Nossa loja abre de noite também. Vinte e quatro horas!"]
teach:
  - line: [sajang, eoseo-oseyo]
  - build: [eoseo-oseyo, ["오세요", "어서 오세요"]]
  - ask: ["You enter a shop. What does the owner say?", "Você entra numa loja. O que o dono diz?", "어서 오세요.", eoseo-oseyo]
  - ask: ["Ask where the water is.", "Pergunte onde fica a água.", "물이 어디 있어요?", mul]
  - note: ["To buy, point and say 이거 주세요, 'give me this'. 주세요 goes after anything: 물 주세요, 라면 주세요.", "Para comprar, aponte e diga 이거 주세요, 'me dá isto'. 주세요 vai depois de qualquer coisa: 물 주세요, 라면 주세요."]
  - ask: ["Ask for this one.", "Peça este.", "이거 주세요.", igeo, juseyo]
  - ask: ["Ask for noodles.", "Peça um lámen.", "라면 주세요.", ramyeon, juseyo]
  - note: ["도 means 'too' and takes the place of the particle: 라면도 주세요, noodles too.", "도 quer dizer 'também' e ocupa o lugar da partícula: 라면도 주세요, lámen também."]
  - ask: ["Say: this one, please, and noodles too.", "Diga: me dá este, e um lámen também.", "이거 주세요. 라면도 주세요.", igeo, ramyeon, do]
  - ask: ["How did he ask if you need a bag?", "Como ele perguntou se você precisa de sacola?", "봉투 필요하세요?", bongtu, piryohaseyo]
  - ask: ["Ask for a bag too, then the price.", "Peça uma sacola também, e depois o preço.", "봉투도 주세요. 얼마예요?", bongtu, do, eolmayeyo]
  - ask: ["He says the price. Repeat it: three thousand won.", "Ele diz o preço. Repita: três mil wons.", "삼천 원이에요.", won]
  - note: ["까지 is 'until': 몇 시까지 해요? — until what time are you open? 해요 here is 'is open'.", "까지 é 'até': 몇 시까지 해요? — até que horas funciona? 해요 aqui é 'funciona'."]
  - ask: ["Ask until what time the shop is open.", "Pergunte até que horas a loja funciona.", "몇 시까지 해요?", myeot-si, kkaji, haeyo]
  - note: ["Hand the card and take the change with both hands, or with the right hand while the left touches your right arm — above all with older people.", "Entregue o cartão e receba o troco com as duas mãos, ou com a direita enquanto a esquerda toca o braço direito — sobretudo com pessoas mais velhas."]
  - pt_only: "No Brasil ninguém repara se você paga com uma mão só. Na Coreia, com alguém mais velho, as duas mãos mostram respeito."
