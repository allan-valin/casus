id: A1-17
protagonist: f
title: ["I'm not an idol", "Não sou idol"]
situation: ["Mrs Park's niece Seoyeon visits. She thinks all Brazilians dance samba; you thought all Koreans are idols — and that young men live in the PC bang.", "A sobrinha da senhora Park, Seoyeon, está de visita. Ela acha que todo brasileiro dança samba; você achava que todo coreano é idol — e que os rapazes vivem no PC bang."]
learn: [ko-future, ko-nikl-26]
culture: Stereotypes both ways
items:
  - [aidol, "아이돌", "idol (K-pop)", "idol (K-pop)"]
  - [anieyo2, "아니에요", "it is not, that's not so", "não é, não é assim"]
  - [samba, "삼바", "samba", "samba"]
  - [chwoyo, "춰요", "dances", "dança"]
  - [da, "다", "all", "todos, tudo"]
  - [eul-geoyeyo, "-(으)ㄹ 거예요", "will (future, plan or guess)", "vai (futuro, plano ou suposição)"]
  - [aseo, "-아서/어서", "because, so (cause)", "porque, por isso (causa)"]
  - [pisibang, "PC방", "PC bang (internet café for games)", "PC bang (lan house de jogos)"]
  - [geim, "게임", "game", "jogo"]
  - [chingudeul, "친구들하고", "with friends", "com os amigos"]
  - [sasil, "사실은", "actually", "na verdade"]
  - [mollayo, "몰라요", "I don't know (how)", "não sei"]
dialogue:
  - [seoyeon, "언니, 브라질 사람이에요? 그럼 삼바 잘 춰요?", "Unni, you're Brazilian? Then you dance samba well?", "Unni, você é brasileira? Então dança samba bem?"]
  - [protagonist, "아니에요! 사실은 삼바 못 춰요. 브라질 사람이 다 삼바를 추지 않아요.", "No! Actually I can't dance samba. Not all Brazilians dance samba.", "Não! Na verdade não sei sambar. Nem todo brasileiro samba."]
  - [seoyeon, "진짜요? 몰랐어요!", "Really? I didn't know!", "Sério? Eu não sabia!"]
  - [protagonist, "저도 몰랐어요. 한국 사람은 다 아이돌이에요?", "I didn't know either. Are all Koreans idols?", "Eu também não sabia. Todo coreano é idol?"]
  - [seoyeon, "하하, 아니에요! 그리고 남자들이 다 PC방에 살지 않아요.", "Haha, no! And the guys don't all live in the PC bang.", "Haha, não! E os rapazes não vivem todos no PC bang."]
  - [protagonist, "PC방은 뭐예요?", "What's a PC bang?", "O que é PC bang?"]
  - [seoyeon, "게임 카페예요. 싸서 친구들하고 가요.", "A game café. It's cheap, so you go with friends.", "É um café de jogos. É barato, então se vai com os amigos."]
  - [protagonist, "재미있을 거예요. 저도 갈 거예요!", "That'll be fun. I'll go too!", "Deve ser divertido. Eu também vou!"]
teach:
  - note: ["To say 'that's not so', politely: 아니에요.", "Para dizer 'não é assim', com educação: 아니에요."]
  - ask: ["Say: no — you can't dance samba.", "Diga: não — você não sabe sambar.", "아니에요! 삼바 못 춰요.", anieyo2, samba, chwoyo]
  - ask: ["Say: not all Brazilians dance samba.", "Diga: nem todo brasileiro samba.", "브라질 사람이 다 삼바를 추지 않아요.", da]
  - ask: ["Ask: are all Koreans idols?", "Pergunte: todo coreano é idol?", "한국 사람은 다 아이돌이에요?", aidol]
  - ask: ["Say: actually, I didn't know.", "Diga: na verdade, eu não sabia.", "사실은 몰랐어요.", sasil, mollayo]
  - note: ["-아서/어서 gives the cause: 싸다 → 싸서, 'it's cheap, so…'. The cause comes first, as in 'cheap, so we go'.", "-아서/어서 dá a causa: 싸다 → 싸서, 'é barato, por isso…'. A causa vem primeiro."]
  - ask: ["Say: it's cheap, so you go with friends.", "Diga: é barato, então se vai com os amigos.", "싸서 친구들하고 가요.", aseo, chingudeul]
  - ask: ["Ask what a PC bang is.", "Pergunte o que é um PC bang.", "PC방은 뭐예요?", pisibang]
  - ask: ["Say: it's a game café.", "Diga: é um café de jogos.", "게임 카페예요.", geim]
  - note: ["-(으)ㄹ 거예요 is the future, for plans and guesses: 갈 거예요, I'll go; 재미있을 거예요, it'll be fun.", "-(으)ㄹ 거예요 é o futuro, para planos e suposições: 갈 거예요, vou; 재미있을 거예요, deve ser divertido."]
  - ask: ["Say that you'll go too.", "Diga que você também vai.", "저도 갈 거예요.", eul-geoyeyo]
  - en_only: "Both pictures are half-true at most: samba is one music among many in Brazil, and PC bangs are a cheap social space — gaming addiction is debated in Korea, but most young men don't live there."
  - pt_only: "Os dois retratos são, no máximo, meias-verdades: o samba é uma música entre muitas no Brasil, e o PC bang é um lugar barato para encontrar amigos — o vício em jogos é debatido na Coreia, mas a maioria dos rapazes não vive lá."
