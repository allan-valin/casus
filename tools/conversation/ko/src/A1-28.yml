id: A1-28
protagonist: m
title: ["The family", "A família"]
situation: ["Mrs Park shows you old photos: her late husband, her children in Busan, her grandchildren. Then she asks about yours.", "A senhora Park mostra fotos antigas: o falecido marido, os filhos em Busan, os netos. Depois pergunta pela sua família."]
learn: [ko-because, ko-nikl-28]
culture: Family words depend on who speaks
items:
  - [gajok, "가족", "family", "família"]
  - [eomma, "엄마", "mum", "mãe"]
  - [appa, "아빠", "dad", "pai"]
  - [hyeongje, "형제", "siblings", "irmãos"]
  - [adeul, "아들", "son", "filho"]
  - [ttal, "딸", "daughter", "filha"]
  - [sonja, "손자", "grandson", "neto"]
  - [nikka, "-(으)니까", "because, since", "porque, já que"]
  - [aseo2, "-아서/어서", "because, so", "porque, por isso"]
  - [euryeogo, "-(으)려고", "in order to, intending to", "para, com a intenção de"]
  - [bogo-sipeoyo, "보고 싶어요", "I miss (them)", "sinto saudade"]
dialogue:
  - [park, "이건 우리 가족 사진이에요. 이 사람은 남편이에요.", "This is our family photo. This is my husband.", "Esta é a foto da nossa família. Este é o meu marido."]
  - [protagonist, "아드님하고 따님도 있어요?", "Do you have a son and a daughter too?", "A senhora tem filho e filha também?"]
  - [park, "네, 아들 하나, 딸 하나예요. 부산에 살아서 자주 못 봐요.", "Yes, one son, one daughter. They live in Busan, so I can't see them often.", "Sim, um filho e uma filha. Moram em Busan, então não vejo sempre."]
  - [protagonist, "보고 싶으시겠어요.", "You must miss them.", "A senhora deve sentir saudade."]
  - [park, "그럼요. 학생 가족은요? 형제 있어요?", "Of course. And your family? Do you have siblings?", "Claro. E a sua família? Tem irmãos?"]
  - [protagonist, "누나 한 명 있어요. 제 엄마하고 아빠는 상파울루에 살아요.", "I have one older sister. My mum and dad live in São Paulo.", "Tenho uma irmã mais velha. Minha mãe e meu pai moram em São Paulo."]
  - [park, "멀어서 보고 싶겠어요.", "It's far, so you must miss them.", "É longe, deve dar saudade."]
  - [protagonist, "네. 다음 달에 영상 통화하려고 해요. 엄마 생일이니까요.", "Yes. I'm going to video-call next month, because it's mum's birthday.", "Sim. Vou fazer uma chamada de vídeo no mês que vem, porque é aniversário da minha mãe."]
teach:
  - ask: ["Say: this is a family photo.", "Diga: esta é uma foto de família.", "가족 사진이에요.", gajok]
  - note: ["For someone else's children, politely: 아드님, 따님. For your own: 아들, 딸.", "Para os filhos de outra pessoa, com educação: 아드님, 따님. Para os seus: 아들, 딸."]
  - ask: ["She has one son and one daughter. Say it.", "Ela tem um filho e uma filha. Diga.", "아들 하나, 딸 하나예요.", adeul, ttal]
  - ask: ["Ask if you have siblings.", "Pergunte se você tem irmãos.", "형제 있어요?", hyeongje]
  - note: ["A man calls his older sister 누나 — the word depends on who speaks. 제 = my (polite): 제 엄마, 제 아빠.", "Um homem chama a irmã mais velha de 누나 — a palavra depende de quem fala. 제 = meu (educado): 제 엄마, 제 아빠."]
  - ask: ["Say: my mum and dad live in São Paulo.", "Diga: minha mãe e meu pai moram em São Paulo.", "제 엄마하고 아빠는 상파울루에 살아요.", je, eomma, appa]
  - note: ["Two ways to give a reason: -아서/어서 for a cause (멀어서, it's far, so…), -(으)니까 when you explain or justify (생일이니까요, because it's her birthday).", "Duas maneiras de dar o motivo: -아서/어서 para a causa (멀어서, é longe, então…), -(으)니까 para explicar ou justificar (생일이니까요, porque é aniversário)."]
  - ask: ["Say: they live in Busan, so I can't see them often.", "Diga: moram em Busan, então não vejo sempre.", "부산에 살아서 자주 못 봐요.", aseo2]
  - ask: ["Say: because it's mum's birthday.", "Diga: porque é aniversário da mãe.", "엄마 생일이니까요.", nikka]
  - note: ["-(으)려고 해요 is 'I intend to': 통화하다 → 통화하려고 해요, I'm going to call.", "-(으)려고 해요 é 'pretendo': 통화하다 → 통화하려고 해요, vou ligar."]
  - ask: ["Say you're going to video-call next month.", "Diga que vai fazer uma chamada de vídeo no mês que vem.", "다음 달에 영상 통화하려고 해요.", euryeogo]
  - ask: ["Say: I miss them.", "Diga: sinto saudade deles.", "보고 싶어요.", bogo-sipeoyo]
  - ask: ["Say: her grandson is cute.", "Diga: o neto dela é fofo.", "손자가 귀여워요.", sonja]
  - pt_only: "Em português 'irmã' serve para todo mundo. Em coreano a irmã mais velha de um homem é 누나, a de uma mulher é 언니 — e os filhos dos outros ganham o respeitoso 아드님, 따님."
