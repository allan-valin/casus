id: A1-29
protagonist: f
title: ["I'm sorry", "Sinto muito"]
situation: ["You sent the wrong file to a client. The team lead calls you in. Apologise properly, fix it, report back.", "Você mandou o arquivo errado a um cliente. A líder chama você. Peça desculpas direito, corrija e informe."]
learn: [ko-nikl-40, ko-nikl-45]
culture: Apologising at work
items:
  - [joesonghamnida2, "죄송합니다", "I'm very sorry (formal)", "Peço desculpas (formal)", {register: formal}]
  - [sillsu, "실수했어요", "I made a mistake", "cometi um erro"]
  - [pail, "파일", "file", "arquivo"]
  - [jalmot, "잘못 보냈어요", "sent it wrongly", "enviei errado"]
  - [eoya-dwaeyo, "-아야/어야 돼요", "have to (in talk)", "tem que (na fala)"]
  - [dasi, "다시", "again", "de novo"]
  - [eun-hue, "-(으)ㄴ 후에", "after …-ing", "depois de"]
  - [gogaek, "고객", "client, customer", "cliente"]
  - [boggo, "보고드리겠습니다", "I will report (to you)", "vou informar (a senhora)", {register: formal}]
  - [jusuihagesseumnida, "주의하겠습니다", "I'll be careful", "vou tomar cuidado", {register: formal}]
  - [gwaenchanayo2, "괜찮아요, 다음에는 조심해요", "It's OK, be careful next time", "Tudo bem, cuidado da próxima vez"]
  - [bonaeyo, "보내요", "send", "envia"]
dialogue:
  - [jieun, "고객한테 파일을 잘못 보냈어요?", "Did you send the client the wrong file?", "Você mandou o arquivo errado para o cliente?"]
  - [protagonist, "네… 정말 죄송합니다. 제가 실수했어요.", "Yes… I'm very sorry. I made a mistake.", "Sim… peço muitas desculpas. Eu errei."]
  - [jieun, "괜찮아요. 지금 다시 보내야 돼요.", "It's OK. You have to send it again now.", "Tudo bem. Precisa reenviar agora."]
  - [protagonist, "네, 바로 다시 보내겠습니다.", "Yes, I'll send it again right away.", "Sim, vou reenviar agora mesmo."]
  - [jieun, "보낸 후에 고객한테 전화도 해야 돼요.", "After sending it, you also have to call the client.", "Depois de enviar, tem que ligar para o cliente também."]
  - [protagonist, "알겠습니다. 전화한 후에 보고드리겠습니다.", "Understood. After calling, I'll report back to you.", "Entendido. Depois de ligar, eu informo a senhora."]
  - [jieun, "좋아요. 다음에는 조심해요.", "Good. Be careful next time.", "Ótimo. Cuidado da próxima vez."]
  - [protagonist, "네, 앞으로 주의하겠습니다.", "Yes, I'll be careful from now on.", "Sim, vou tomar cuidado daqui para frente."]
teach:
  - note: ["At work a serious apology is formal: 죄송합니다, and say it was your mistake: 제가 실수했어요.", "No trabalho um pedido de desculpas sério é formal: 죄송합니다, e assuma o erro: 제가 실수했어요."]
  - ask: ["Apologise formally and admit the mistake.", "Peça desculpas formalmente e assuma o erro.", "죄송합니다. 제가 실수했어요.", joesonghamnida2, sillsu]
  - ask: ["Say you sent the file to the wrong place.", "Diga que mandou o arquivo errado.", "파일을 잘못 보냈어요.", pail, jalmot]
  - note: ["-아야/어야 돼요 is 'have to' in talk (해야 해요 says the same): 보내다 → 보내야 돼요.", "-아야/어야 돼요 é 'ter que' na fala (해야 해요 diz o mesmo): 보내다 → 보내야 돼요."]
  - ask: ["Say: I have to send it again.", "Diga: tenho que reenviar.", "다시 보내야 돼요.", eoya-dwaeyo, dasi, bonaeyo]
  - note: ["-(으)ㄴ 후에 is 'after': 보내다 → 보낸 후에, after sending; 전화하다 → 전화한 후에.", "-(으)ㄴ 후에 é 'depois de': 보내다 → 보낸 후에, depois de enviar; 전화하다 → 전화한 후에."]
  - ask: ["Say: after calling, I'll report to you.", "Diga: depois de ligar, eu informo a senhora.", "전화한 후에 보고드리겠습니다.", eun-hue, boggo]
  - ask: ["Say you'll call the client.", "Diga que vai ligar para o cliente.", "고객한테 전화해요.", gogaek]
  - ask: ["Promise to be careful from now on.", "Prometa tomar cuidado daqui para frente.", "앞으로 주의하겠습니다.", jusuihagesseumnida]
  - ask: ["Your boss forgives: it's OK, be careful next time.", "A chefe perdoa: tudo bem, cuidado da próxima vez.", "괜찮아요, 다음에는 조심해요.", gwaenchanayo2]
  - pt_only: "No Brasil às vezes se explica o motivo antes de pedir desculpas. Na Coreia, primeiro se assume o erro (제가 실수했어요) e se pede desculpas formalmente; a explicação vem depois, se pedirem."
