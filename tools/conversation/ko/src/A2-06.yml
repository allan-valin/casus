id: A2-06
protagonist: m
title: ["Electricity", "Eletricidade"]
situation: ["July heat. The air conditioner has been on all day; Mrs Park warns you about the summer electricity bill.", "Calor de julho. O ar-condicionado ficou ligado o dia todo; a senhora Park avisa sobre a conta de luz do verão."]
learn: [ko-progressive, ko-nikl-80, ko-nikl-86]
culture: Electricity costs more the more you use (progressive pricing)
items:
  - [jeongi, "전기", "electricity", "eletricidade, luz"]
  - [eeokon, "에어컨", "air conditioner", "ar-condicionado"]
  - [go-itda, "-고 있다", "be …-ing", "estar …-ndo"]
  - [neun-dongane, "-는 동안에", "while", "enquanto"]
  - [eo-itda, "-아/어 있다", "is (in a state): open, on, sitting", "está (num estado): aberto, ligado, sentado"]
  - [kyeojyeo, "켜져 있어", "it's (been left) on (casual)", "está ligado (informal)"]
  - [jeongiyogeum, "전기 요금", "electricity bill", "conta de luz"]
  - [aggyeoyo, "아껴요", "save, use sparingly", "economiza"]
  - [deowoseo, "더워서", "because it's hot", "porque está quente"]
  - [seonpunggi, "선풍기", "electric fan", "ventilador"]
  - [changmun, "창문이 열려 있어요", "the window is open", "a janela está aberta"]
  - [nagal-ttae, "나갈 때", "when you go out", "quando sair"]
dialogue:
  - [park, "학생, 에어컨이 하루 종일 켜져 있어!", "Your air conditioner has been on all day!", "Seu ar-condicionado ficou ligado o dia todo!"]
  - [protagonist, "죄송해요. 너무 더워서요. 지금도 일하고 있어요.", "Sorry. It's so hot. I'm working now, too.", "Desculpe. Está muito calor. Estou trabalhando agora também."]
  - [park, "일하는 동안에는 괜찮아. 그런데 나갈 때는 꺼.", "While you're working, fine. But turn it off when you go out.", "Enquanto trabalha, tudo bem. Mas quando sair, desliga."]
  - [protagonist, "네. 전기 요금이 많이 나와요?", "Yes. Is the electricity bill high?", "Sim. A conta de luz vem alta?"]
  - [park, "여름에는 많이 쓰면 더 비싸. 전기를 아껴야 돼.", "In summer it gets dearer the more you use. You have to save electricity.", "No verão, quanto mais usa, mais caro. Tem que economizar."]
  - [protagonist, "그럼 선풍기를 쓸게요.", "Then I'll use a fan.", "Então vou usar ventilador."]
  - [park, "그리고 창문이 열려 있어. 에어컨 켤 때는 창문 닫아.", "And your window is open. Close it when the air conditioner is on.", "E a sua janela está aberta. Quando ligar o ar, fecha."]
  - [protagonist, "아, 몰랐어요. 감사합니다, 할머니.", "Oh, I didn't know. Thank you, grandma.", "Ah, eu não sabia. Obrigado, vovó."]
teach:
  - ask: ["Say: the air conditioner.", "Diga: o ar-condicionado.", "에어컨", eeokon]
  - note: ["-아/어 있다 is a state that stays: 켜지다 → 켜져 있어요, it's on; 열리다 → 열려 있어요, it's open.", "-아/어 있다 é um estado que fica: 켜지다 → 켜져 있어요, está ligado; 열리다 → 열려 있어요, está aberto."]
  - ask: ["How did she say casually 'it's (been left) on'?", "Como ela disse, informal, 'está ligado'?", "켜져 있어!", kyeojyeo, eo-itda]
  - ask: ["Say: the window is open.", "Diga: a janela está aberta.", "창문이 열려 있어요.", changmun]
  - ask: ["Say: it's so hot, that's why.", "Diga: é que está muito calor.", "너무 더워서요.", deowoseo]
  - note: ["-고 있다 is the action going on now: 일하다 → 일하고 있어요, I'm working.", "-고 있다 é a ação acontecendo agora: 일하다 → 일하고 있어요, estou trabalhando."]
  - ask: ["Say you're working now.", "Diga que está trabalhando agora.", "지금 일하고 있어요.", go-itda]
  - note: ["-는 동안에 is 'while': 일하는 동안에, while you work.", "-는 동안에 é 'enquanto': 일하는 동안에, enquanto trabalha."]
  - ask: ["Say: while you're working, it's fine.", "Diga: enquanto trabalha, tudo bem.", "일하는 동안에는 괜찮아요.", neun-dongane]
  - ask: ["Say: turn it off when you go out.", "Diga: desligue quando sair.", "나갈 때 꺼요.", nagal-ttae]
  - ask: ["Ask if the electricity bill is high.", "Pergunte se a conta de luz vem alta.", "전기 요금이 많이 나와요?", jeongiyogeum, jeongi]
  - ask: ["Say you have to save electricity.", "Diga que tem que economizar luz.", "전기를 아껴야 돼요.", aggyeoyo]
  - ask: ["Say you'll use a fan.", "Diga que vai usar ventilador.", "선풍기를 쓸게요.", seonpunggi]
  - pt_only: "Na Coreia a tarifa de luz residencial é progressiva: no verão, quem passa do limite paga bem mais por quilowatt. Daí os avisos de quem é mais velho."
