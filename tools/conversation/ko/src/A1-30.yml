id: A1-30
protagonist: m
title: ["Sport", "Esporte"]
situation: ["Sunday hike up Bukhansan with Minjun and his father, who hikes every week. A review of all of A1.", "Domingo de trilha no Bukhansan com o Minjun e o pai dele, que sobe toda semana. Revisão de todo o A1."]
learn: []
culture: Hiking culture — the gear, the summit, the snack
items:
  - [deungsan, "등산", "hiking", "trilha, montanhismo"]
  - [san, "산", "mountain", "montanha"]
  - [himdeureoyo, "힘들어요", "is hard, tiring", "é cansativo, difícil"]
  - [jeongsang, "정상", "summit", "cume"]
  - [swieoyo2, "쉬어요", "rest, take a break", "descansa"]
  - [gimbap, "김밥", "gimbap", "gimbap"]
  - [cheoncheonhi, "천천히", "slowly", "devagar"]
  - [hwaiting, "파이팅!", "Go for it! (cheer; often said 화이팅)", "Força! Vamos lá! (muitos dizem 화이팅)"]
dialogue:
  - [abeoji, "어서 와요. 등산 처음이에요?", "Welcome. Is this your first hike?", "Seja bem-vindo. É sua primeira trilha?"]
  - [protagonist, "네, 처음이에요. 산이 정말 높아요.", "Yes, it's my first. The mountain is really high.", "Sim, é a primeira. A montanha é bem alta."]
  - [minjun, "형, 천천히 가. 힘들면 쉬어.", "Hyung, go slowly. Rest if it's hard.", "Hyung, vai devagar. Descansa se cansar."]
  - [protagonist, "괜찮아. 그런데 다리가 아파.", "I'm fine. But my legs hurt.", "Tô bem. Mas a perna dói."]
  - [abeoji, "저기서 쉬고 김밥 먹어요. 정상까지 삼십 분이에요.", "Let's rest there and eat gimbap. Thirty minutes to the summit.", "Vamos descansar ali e comer 김밥. Faltam trinta minutos até o cume."]
  - [protagonist, "감사합니다. 김밥 맛있어요!", "Thank you. The gimbap is delicious!", "Obrigado. O 김밥 está gostoso!"]
  - [minjun, "자, 정상까지 가자! 파이팅!", "Right, to the summit! Let's go!", "Bora, até o cume! Força!"]
  - [protagonist, "와, 정상이에요! 서울이 다 보여요!", "Wow, the summit! You can see all of Seoul!", "Nossa, o cume! Dá para ver Seul inteira!"]
teach:
  - ask: ["Say it's your first hike.", "Diga que é sua primeira trilha.", "등산 처음이에요.", deungsan]
  - ask: ["Say: the mountain is high.", "Diga: a montanha é alta.", "산이 높아요.", san]
  - ask: ["Say it's tiring.", "Diga que é cansativo.", "힘들어요.", himdeureoyo]
  - ask: ["To Minjun, casually: I'm fine, but my legs hurt.", "Para o Minjun, informal: tô bem, mas a perna dói.", "괜찮아. 그런데 다리가 아파.", dari]
  - ask: ["Tell someone to go slowly.", "Diga a alguém para ir devagar.", "천천히 가요.", cheoncheonhi]
  - ask: ["Suggest resting and eating gimbap.", "Sugira descansar e comer 김밥.", "쉬고 김밥 먹어요.", swieoyo2, gimbap, go2]
  - ask: ["Ask how long to the summit.", "Pergunte quanto falta até o cume.", "정상까지 몇 분이에요?", jeongsang, kkaji]
  - note: ["The cheer is spelled 파이팅 (from English 'fighting'); many people say and write 화이팅.", "A torcida se escreve 파이팅 (do inglês 'fighting'); muita gente fala e escreve 화이팅."]
  - ask: ["Cheer: go for it!", "Torça: força!", "파이팅!", hwaiting]
  - ask: ["Say: you can see all of Seoul.", "Diga: dá para ver Seul inteira.", "서울이 다 보여요.", boyeoyo, da]
  - ask: ["Thank Minjun's father formally.", "Agradeça ao pai do Minjun formalmente.", "감사합니다.", gamsahamnida]
  - ask: ["Say you want to come again.", "Diga que quer vir de novo.", "다시 오고 싶어요.", dasi, go-sipeoyo]
  - pt_only: "Nos fins de semana as trilhas perto de Seul se enchem de gente com equipamento completo — e no cume sempre aparece um 김밥, uma fruta ou um 막걸리 para dividir."
