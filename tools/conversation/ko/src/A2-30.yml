id: A2-30
protagonist: m
title: ["Jokes", "Piadas"]
situation: ["The year-end team dinner. The director tells dad jokes; the team laughs politely. Then you try one. A review of all of A2.", "O jantar de fim de ano da equipe. O diretor conta piadas de tiozão; a equipe ri por educação. Depois você tenta uma. Revisão de todo o A2."]
learn: []
culture: Dad jokes (아재개그) and laughing with the boss
items:
  - [ajaegaegeu, "아재개그", "dad joke", "piada de tiozão"]
  - [utgyeoyo, "웃겨요", "is funny", "é engraçado"]
  - [sseolleonghaeyo, "썰렁해요", "falls flat (a joke)", "é sem graça (piada)"]
  - [songnyeonhoe, "송년회", "year-end party", "festa de fim de ano"]
  - [utda, "웃어요", "laugh", "ri"]
  - [hanbeondeo2, "또 해 주세요!", "Tell another one!", "Conta outra!"]
  - [saehae, "새해 복 많이 받으세요", "Happy New Year (lit. receive much luck)", "Feliz Ano Novo (lit. receba muita sorte)"]
  - [sugo, "올해 수고 많으셨습니다", "thank you for your hard work this year (formal)", "obrigado pelo esforço este ano (formal)", {register: formal}]
dialogue:
  - [jieun, "오늘은 송년회예요. 부장님이 아재개그를 하실 거예요.", "Today is the year-end party. The director is going to tell dad jokes.", "Hoje é a festa de fim de ano. O diretor vai contar piadas de tiozão."]
  - [protagonist, "아재개그요? 그게 뭐예요?", "Dad jokes? What are those?", "Piadas de tiozão? O que é isso?"]
  - [jieun, "썰렁한 농담이에요. 그래도 다 같이 웃어 줘야 돼요.", "Jokes that fall flat. But everyone has to laugh anyway.", "Piadas sem graça. Mas todo mundo tem que rir mesmo assim."]
  - [protagonist, "하하… 방금 그거 웃겨요? 썰렁해요.", "Haha… was that one funny? It fell flat.", "Haha… essa foi engraçada? Foi sem graça."]
  - [jieun, "쉿! 웃으세요! 이제 신입 사원이 한 개 해야 돼요.", "Shh! Laugh! Now the new employee has to tell one.", "Psiu! Ria! Agora o novato tem que contar uma."]
  - [protagonist, "음… 왕이 넘어지면? 킹콩!", "Um… what is it when a king falls over? King Kong!", "Hum… o que é um rei que cai? King Kong!"]
  - [jieun, "하하하! 진짜 웃겨요! 또 해 주세요!", "Hahaha! That's really funny! Tell another one!", "Hahaha! Muito engraçado! Conta outra!"]
  - [protagonist, "올해 수고 많으셨습니다. 새해 복 많이 받으세요!", "Thank you for all your hard work this year. Happy New Year!", "Obrigado pelo esforço deste ano. Feliz Ano Novo!"]
teach:
  - ask: ["Say: today is the year-end party.", "Diga: hoje é a festa de fim de ano.", "오늘은 송년회예요.", songnyeonhoe]
  - ask: ["Ask: what's a dad joke?", "Pergunte: o que é piada de tiozão?", "아재개그가 뭐예요?", ajaegaegeu]
  - ask: ["Say: it fell flat.", "Diga: foi sem graça.", "썰렁해요.", sseolleonghaeyo]
  - ask: ["Say: it's really funny!", "Diga: é muito engraçado!", "진짜 웃겨요!", utgyeoyo]
  - ask: ["Say everyone has to laugh anyway (review -어야 돼요).", "Diga que todos têm que rir mesmo assim (revisão -어야 돼요).", "다 같이 웃어야 돼요.", utda]
  - ask: ["Ask for another one.", "Peça outra.", "또 해 주세요!", hanbeondeo2]
  - ask: ["Review: say you'll tell one too (-(으)ㄹ게요).", "Revisão: diga que vai contar uma também (-(으)ㄹ게요).", "저도 한 개 할게요.", eulgeyo]
  - ask: ["Review: say it seems funny (-는 것 같아요).", "Revisão: diga que parece engraçado (-는 것 같아요).", "웃긴 것 같아요.", neun-geot-gatayo]
  - ask: ["Thank your team formally for their hard work this year.", "Agradeça formalmente à equipe pelo esforço do ano.", "올해 수고 많으셨습니다.", sugo]
  - ask: ["Wish them a happy New Year.", "Deseje feliz Ano Novo.", "새해 복 많이 받으세요!", saehae]
  - pt_only: "O 아재개그 é o nosso 'trocadilho de tiozão': quanto mais sem graça, melhor — e no 회식 todo mundo ri da piada do chefe. 왕 (rei) + 넘어지다 (cair) → 'King Kong' é um clássico."
