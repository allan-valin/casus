id: A1-15
protagonist: f
title: [Numbers and shapes, Números e formas]
situation: ["You bought a sofa online yesterday. Minjun helps you measure the room: will it fit?", "Ontem você comprou um sofá pela internet. O Minjun ajuda a medir o quarto: vai caber?"]
learn: [ko-past, ko-nikl-21]
culture: Counting things with counters
items:
  - [eoje, "어제", "yesterday", "ontem"]
  - [sasseoyo, "샀어요", "bought", "comprou"]
  - [eot-eot, "-았/었-", "past tense", "passado"]
  - [sopa, "소파", "sofa", "sofá"]
  - [miteo, "미터", "metre", "metro"]
  - [neolbeoyo, "넓어요", "is wide, spacious", "é largo, espaçoso"]
  - [jobayo, "좁아요", "is narrow, cramped", "é estreito, apertado"]
  - [gae, "개", "counter for things", "classificador para coisas"]
  - [myeong, "명", "counter for people", "classificador para pessoas"]
  - [deureogayo, "들어가요", "fits, goes in", "cabe, entra"]
  - [jaeyo, "재요", "measure", "mede"]
  - [wasseoyo, "왔어요", "came, arrived", "veio, chegou"]
dialogue:
  - [protagonist, "민준 씨, 저 어제 소파를 샀어요.", "Minjun, I bought a sofa yesterday.", "Minjun, ontem eu comprei um sofá."]
  - [minjun, "와, 진짜요? 방이 좁아요. 들어가요?", "Wow, really? The room is small. Will it fit?", "Sério? O quarto é apertado. Vai caber?"]
  - [protagonist, "몰라요. 같이 재요!", "I don't know. Let's measure!", "Não sei. Vamos medir!"]
  - [minjun, "이쪽은 삼 미터예요. 저쪽은 이 미터예요.", "This side is three metres. That side is two.", "Este lado tem três metros. Aquele, dois."]
  - [protagonist, "소파는 이 미터예요. 들어가요!", "The sofa is two metres. It fits!", "O sofá tem dois metros. Cabe!"]
  - [minjun, "의자는 몇 개 샀어요?", "How many chairs did you buy?", "Quantas cadeiras você comprou?"]
  - [protagonist, "의자는 두 개 샀어요. 손님 두 명 와요.", "Two chairs. Two guests are coming.", "Duas. Vêm duas visitas."]
  - [minjun, "아, 소파가 왔어요! 넓어요… 방보다 넓어요!", "Oh, the sofa has arrived! It's wide… wider than the room!", "Ah, o sofá chegou! É largo… mais largo que o quarto!"]
teach:
  - note: ["The past adds -았- or -었- before -어요: 사다 → 샀어요, 오다 → 왔어요, 하다 → 했어요.", "O passado acrescenta -았- ou -었- antes de -어요: 사다 → 샀어요, 오다 → 왔어요, 하다 → 했어요."]
  - build: [sasseoyo, ["-어요", "샀어요"]]
  - ask: ["Say that you bought a sofa yesterday.", "Diga que comprou um sofá ontem.", "어제 소파를 샀어요.", eoje, sasseoyo, sopa, eot-eot]
  - ask: ["Say: the sofa has arrived.", "Diga: o sofá chegou.", "소파가 왔어요.", wasseoyo]
  - ask: ["Say that the room is cramped.", "Diga que o quarto é apertado.", "방이 좁아요.", jobayo]
  - ask: ["Ask: does it fit?", "Pergunte: cabe?", "들어가요?", deureogayo]
  - ask: ["Suggest measuring together.", "Sugira medir juntos.", "같이 재요!", jaeyo]
  - ask: ["Say: this side is three metres.", "Diga: este lado tem três metros.", "이쪽은 삼 미터예요.", miteo]
  - note: ["Things are counted with native numbers and a counter: 의자 두 개, two chairs; 손님 두 명, two guests. 하나 → 한, 둘 → 두, 셋 → 세 before a counter.", "Coisas se contam com os números nativos e um classificador: 의자 두 개, duas cadeiras; 손님 두 명, duas visitas. 하나 → 한, 둘 → 두, 셋 → 세 antes do classificador."]
  - ask: ["Say you bought two chairs.", "Diga que comprou duas cadeiras.", "의자를 두 개 샀어요.", gae]
  - ask: ["Say two guests are coming.", "Diga que vêm duas visitas.", "손님 두 명 와요.", myeong]
  - ask: ["Say: it's wider than the room!", "Diga: é mais largo que o quarto!", "방보다 넓어요!", neolbeoyo]
  - pt_only: "Em português basta 'duas cadeiras'. Em coreano a coisa contada leva um classificador: 개 para objetos, 명 para pessoas, 마리 para animais."
