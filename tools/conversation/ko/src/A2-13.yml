id: A2-13
protagonist: f
title: ["Hongdae at night", "Hongdae à noite"]
situation: ["Friday night in Hongdae with Seoyeon: a club with an ID check, dancing, and the question of the last subway.", "Sexta à noite em Hongdae com a Seoyeon: uma balada com checagem de documento, dança e a questão do último metrô."]
learn: [ko-nikl-58, ko-nikl-61]
culture: The last subway and the first one
items:
  - [keullub, "클럽", "club", "balada, boate"]
  - [sinbunjeung2, "신분증 보여 주세요", "show your ID, please", "mostre o documento, por favor"]
  - [chumchwoyo, "춤춰요", "dance", "dança"]
  - [cheotcha, "첫차", "the first train/bus of the day", "o primeiro trem/ônibus do dia"]
  - [makcha, "막차", "the last train/bus", "o último trem/ônibus"]
  - [eumyeon2, "-(으)면", "if, when", "se, quando"]
  - [daga, "-다가", "while doing…, then (switching)", "fazendo… e então (mudando)"]
  - [neujeumyeon2, "늦으면", "if it gets late", "se ficar tarde"]
  - [taeksi, "택시", "taxi", "táxi"]
  - [sikkeureowoyo, "시끄러워요", "is noisy", "é barulhento"]
  - [deopeoyo, "더워요", "it's hot (inside)", "está quente (lá dentro)"]
  - [beolsseo, "벌써", "already", "já"]
dialogue:
  - [seoyeon, "언니, 클럽 들어가기 전에 신분증 보여 줘야 돼요.", "Unni, before going into the club you have to show ID.", "Unni, antes de entrar na balada tem que mostrar documento."]
  - [protagonist, "외국인등록증 보여 주면 돼요?", "Is it OK if I show my residence card?", "Posso mostrar o cartão de residente?"]
  - [seoyeon, "네, 돼요. 들어가요!", "Yes, that's fine. Let's go in!", "Pode. Vamos entrar!"]
  - [protagonist, "와, 시끄러워요! 사람이 정말 많아요.", "Wow, it's loud! So many people.", "Nossa, que barulho! Quanta gente."]
  - [seoyeon, "춤추다가 더우면 밖에서 쉬어요.", "If you get hot while dancing, take a break outside.", "Se ficar com calor dançando, descansa lá fora."]
  - [protagonist, "벌써 열두 시예요! 막차가 몇 시예요?", "It's already midnight! When's the last subway?", "Já é meia-noite! Que horas é o último metrô?"]
  - [seoyeon, "막차는 끝났어요. 늦으면 첫차 타거나 택시 타요.", "The last one's gone. If it's late, you take the first train or a taxi.", "O último já foi. Se ficar tarde, pega o primeiro trem ou táxi."]
  - [protagonist, "그럼 첫차까지 춤춰요!", "Then we dance until the first train!", "Então a gente dança até o primeiro trem!"]
teach:
  - ask: ["How does the bouncer say 'show your ID'?", "Como o segurança diz 'mostre o documento'?", "신분증 보여 주세요.", sinbunjeung2]
  - note: ["-(으)면 is 'if / when': 보여 주다 → 보여 주면 돼요?, is it OK if I show it? 늦다 → 늦으면, if it's late.", "-(으)면 é 'se / quando': 보여 주다 → 보여 주면 돼요?, posso mostrar? 늦다 → 늦으면, se ficar tarde."]
  - ask: ["Ask if it's OK to show your residence card.", "Pergunte se pode mostrar o cartão de residente.", "외국인등록증 보여 주면 돼요?", eumyeon2]
  - ask: ["Say: if it's late, take a taxi.", "Diga: se ficar tarde, pegue um táxi.", "늦으면 택시 타요.", neujeumyeon2, taeksi]
  - ask: ["Say: it's noisy.", "Diga: é barulhento.", "시끄러워요.", sikkeureowoyo]
  - note: ["-다가 is 'while doing…, then': 춤추다가 더우면, if you get hot while dancing.", "-다가 é 'fazendo…, e então': 춤추다가 더우면, se ficar com calor dançando."]
  - ask: ["Say: if you get hot while dancing, rest outside.", "Diga: se ficar com calor dançando, descanse lá fora.", "춤추다가 더우면 밖에서 쉬어요.", daga, deopeoyo]
  - ask: ["Say: it's already midnight.", "Diga: já é meia-noite.", "벌써 열두 시예요.", beolsseo]
  - ask: ["Ask when the last subway is.", "Pergunte que horas é o último metrô.", "막차가 몇 시예요?", makcha]
  - ask: ["Say: we'll take the first train.", "Diga: vamos pegar o primeiro trem.", "첫차 타요.", cheotcha]
  - ask: ["Say: let's dance at the club.", "Diga: vamos dançar na balada.", "클럽에서 춤춰요.", keullub, chumchwoyo]
  - pt_only: "O metrô de Seul para por volta da meia-noite; quem fica na balada espera o 첫차, o primeiro trem às 5h30, ou disputa um táxi — a noite de Hongdae vai até de manhã."
