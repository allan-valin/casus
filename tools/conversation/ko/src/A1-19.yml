id: A1-19
protagonist: f
title: [The rubbish, O lixo]
situation: ["A note on your door from Mrs Park: your rubbish was in the wrong bag. She shows you the sorting area and its sign.", "Um bilhete na sua porta da senhora Park: seu lixo estava no saco errado. Ela mostra a área de separação e a placa."]
learn: [ko-nikl-30, ko-nikl-29]
culture: Strict sorting and paid bags
items:
  - [sseuregi, "쓰레기", "rubbish", "lixo"]
  - [eumsingmul, "음식물 쓰레기", "food waste", "lixo orgânico"]
  - [jongnyangje, "종량제 봉투", "paid rubbish bag", "saco de lixo pago"]
  - [bullisugeo, "분리수거", "sorting for recycling", "separação para reciclagem"]
  - [haeya-haeyo, "해야 해요", "must do", "tem que fazer"]
  - [seumnida, "-습니다 / -ㅂ니다", "formal statement (signs, announcements)", "afirmação formal (placas, avisos)"]
  - [seumnikka, "-습니까 / -ㅂ니까", "formal question", "pergunta formal"]
  - [peullaseutik, "플라스틱", "plastic", "plástico"]
  - [jongi, "종이", "paper", "papel"]
  - [byeong, "병", "bottle", "garrafa"]
  - [eonje, "언제", "when", "quando"]
  - [joesonghaeyo, "죄송해요", "I'm sorry", "desculpe"]
dialogue:
  - [park, "학생, 이 쓰레기 학생 거예요?", "Is this rubbish yours?", "Este lixo é seu?"]
  - [protagonist, "네… 죄송해요. 뭐가 잘못됐어요?", "Yes… sorry. What was wrong?", "É… desculpe. O que estava errado?"]
  - [park, "음식물 쓰레기는 여기 버려야 해요.", "Food waste has to go here.", "Lixo orgânico tem que ir aqui."]
  - [protagonist, "플라스틱하고 종이는요?", "And plastic and paper?", "E plástico e papel?"]
  - [park, "분리수거해야 해요. 플라스틱, 종이, 병, 다 따로요.", "You have to sort them. Plastic, paper, bottles, all separately.", "Tem que separar. Plástico, papel, garrafa, tudo separado."]
  - [protagonist, "다른 쓰레기는요?", "And the other rubbish?", "E o resto do lixo?"]
  - [park, "종량제 봉투에 넣어야 해요. 편의점에서 사요.", "It goes in a paid bag. You buy them at the convenience store.", "Vai no saco pago. Compra na loja de conveniência."]
  - [protagonist, "표지판에 '분리수거는 화요일에 합니다'라고 써 있어요. 화요일만 버립니까?", "The sign says 'Sorting is done on Tuesdays'. Do we only throw it out on Tuesdays?", "A placa diz 'A separação é feita às terças'. Só se joga na terça?"]
  - [park, "네, 화요일하고 금요일이에요.", "Yes, Tuesdays and Fridays.", "Sim, terça e sexta."]
teach:
  - ask: ["Apologise.", "Peça desculpas.", "죄송해요.", joesonghaeyo]
  - note: ["해야 해요 is 'have to': 버려야 해요, it has to be thrown out (there). It comes back in A2 with every verb.", "해야 해요 é 'ter que': 버려야 해요, tem que jogar (ali). Volta no A2 com todos os verbos."]
  - ask: ["Say: food waste has to go here.", "Diga: o lixo orgânico tem que ir aqui.", "음식물 쓰레기는 여기 버려야 해요.", eumsingmul, haeya-haeyo]
  - ask: ["Say you have to sort the rubbish.", "Diga que tem que separar o lixo.", "분리수거해야 해요.", bullisugeo, haeya-haeyo]
  - ask: ["Name them: plastic, paper, bottles.", "Diga: plástico, papel, garrafa.", "플라스틱, 종이, 병", peullaseutik, jongi, byeong]
  - ask: ["Say: the rest goes in a paid bag.", "Diga: o resto vai no saco pago.", "종량제 봉투에 넣어야 해요.", jongnyangje, sseuregi]
  - note: ["Signs and announcements speak the formal style: 합니다 instead of 해요, and 합니까? for questions. You read it everywhere; you say it in set phrases (감사합니다).", "Placas e avisos usam o estilo formal: 합니다 no lugar de 해요, e 합니까? nas perguntas. Você lê em toda parte; fala em frases feitas (감사합니다)."]
  - ask: ["Read the sign: sorting is done on Tuesdays.", "Leia a placa: a separação é às terças.", "분리수거는 화요일에 합니다.", seumnida]
  - ask: ["Ask formally: do we only throw it out on Tuesdays?", "Pergunte formalmente: só se joga na terça?", "화요일만 버립니까?", seumnikka]
  - ask: ["Ask when the rubbish goes out.", "Pergunte quando se põe o lixo para fora.", "쓰레기는 언제 버려요?", eonje]
  - pt_only: "Na Coreia o lixo comum só vai no saco pago (종량제 봉투), e o orgânico e os recicláveis são separados à risca — o vizinho repara, e às vezes devolve o saco."
