id: A2-20
protagonist: m
title: ["Futsal on Sunday", "Futsal no domingo"]
situation: ["You join Minjun's futsal team. You lose the first match — and the team decides to train every week.", "Você entra no time de futsal do Minjun. Vocês perdem o primeiro jogo — e o time decide treinar toda semana."]
learn: [ko-even, ko-nikl-76]
culture: Weekend amateur leagues
items:
  - [putsal, "풋살", "futsal", "futsal"]
  - [tim, "팀", "team", "time"]
  - [gol, "골", "goal", "gol"]
  - [igyeosseo, "이겼어", "we won (casual)", "ganhamos (informal)"]
  - [jyeosseo, "졌어", "we lost (casual)", "perdemos (informal)"]
  - [eodo, "-아도/어도", "even if, even though", "mesmo que"]
  - [giro-hada, "-기로 하다", "decide to", "decidir"]
  - [yeonseup, "연습", "practice, training", "treino"]
  - [maeju, "매주", "every week", "toda semana"]
  - [mot-neoeosseo, "못 넣었어", "I couldn't score (casual)", "não consegui marcar (informal)"]
  - [gwaenchana2, "괜찮아, 다음에 이기면 돼", "it's fine, we just win next time", "tudo bem, é só ganhar da próxima"]
dialogue:
  - [minjun, "형, 오늘 풋살 어땠어?", "Hyung, how was futsal today?", "Hyung, como foi o futsal hoje?"]
  - [protagonist, "졌어. 나는 골을 하나도 못 넣었어.", "We lost. I didn't score a single goal.", "Perdemos. Eu não marquei nenhum gol."]
  - [minjun, "괜찮아. 져도 재미있었잖아.", "It's fine. Even if we lost, it was fun.", "Tudo bem. Mesmo perdendo, foi divertido."]
  - [protagonist, "응. 그런데 브라질 사람인데 축구를 못해서 미안해.", "Yeah. But sorry for being a Brazilian who can't play football.", "É. Mas desculpa por ser brasileiro e não saber jogar."]
  - [minjun, "하하, 상관없어! 우리 팀은 매주 연습하기로 했어.", "Haha, doesn't matter! Our team decided to train every week.", "Haha, não tem problema! Nosso time decidiu treinar toda semana."]
  - [protagonist, "좋아. 힘들어도 매주 갈게.", "Great. Even if it's hard, I'll come every week.", "Beleza. Mesmo que seja puxado, vou toda semana."]
  - [minjun, "다음에 이기면 돼. 파이팅!", "We just have to win next time. Let's go!", "É só ganhar da próxima. Vamos!"]
  - [protagonist, "파이팅! 다음엔 꼭 이겨!", "Let's go! Next time we win for sure!", "Vamos! Da próxima a gente ganha!"]
teach:
  - ask: ["Say: we lost (casual).", "Diga: perdemos (informal).", "졌어.", jyeosseo]
  - ask: ["Say: we won (casual).", "Diga: ganhamos (informal).", "이겼어.", igyeosseo]
  - ask: ["Say you couldn't score a single goal.", "Diga que não marcou nenhum gol.", "골을 하나도 못 넣었어.", gol, mot-neoeosseo]
  - note: ["-아도/어도 is 'even if': 지다 → 져도, even if we lose; 힘들다 → 힘들어도, even if it's hard.", "-아도/어도 é 'mesmo que': 지다 → 져도, mesmo perdendo; 힘들다 → 힘들어도, mesmo sendo puxado."]
  - ask: ["Say: even if we lost, it was fun.", "Diga: mesmo perdendo, foi divertido.", "져도 재미있었어.", eodo]
  - ask: ["Say: even if it's hard, I'll go every week.", "Diga: mesmo sendo puxado, vou toda semana.", "힘들어도 매주 갈게.", maeju]
  - note: ["-기로 하다 is 'decide to': 연습하다 → 연습하기로 했어, we decided to train.", "-기로 하다 é 'decidir': 연습하다 → 연습하기로 했어, decidimos treinar."]
  - ask: ["Say the team decided to train every week.", "Diga que o time decidiu treinar toda semana.", "우리 팀은 매주 연습하기로 했어.", giro-hada, tim, yeonseup]
  - ask: ["Say: futsal on Sunday.", "Diga: futsal no domingo.", "일요일에 풋살", putsal]
  - ask: ["Comfort him: it's fine, we just win next time.", "Console: tudo bem, é só ganhar da próxima.", "괜찮아, 다음에 이기면 돼.", gwaenchana2]
  - ask: ["Cheer: let's go!", "Torça: vamos!", "파이팅!", hwaiting]
  - pt_only: "O futsal (풋살) é popular entre jovens coreanos nos fins de semana; o futebol brasileiro é admirado — e ser brasileiro e jogar mal vira piada carinhosa."
