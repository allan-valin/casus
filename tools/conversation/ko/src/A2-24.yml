id: A2-24
protagonist: m
title: ["Little sleep", "Dormir pouco"]
situation: ["Minjun has an exam and studies all night in a 24-hour study café. You join him for an hour and talk about sleep.", "O Minjun tem prova e estuda a noite toda num café de estudos 24 horas. Você vai lá por uma hora e vocês falam de sono."]
learn: [ko-nikl-79, ko-because]
culture: Study cafés and little sleep
items:
  - [jam, "잠", "sleep", "sono"]
  - [pigonhaeyo, "피곤해요", "is tired", "está cansado"]
  - [seuteodikape, "스터디카페", "study café", "café de estudos"]
  - [bamsae, "밤새", "all night", "a noite toda"]
  - [neun-geot, "-는 것", "…-ing (as a thing)", "o (fazer)…"]
  - [janeun-geot, "자는 것도 중요해", "sleeping is important too (casual)", "dormir também é importante (informal)"]
  - [aseo3, "-아서/어서", "because, so (cause)", "porque (causa)"]
  - [siheom, "시험", "exam", "prova"]
  - [jolyeo, "졸려", "I'm sleepy (casual)", "estou com sono (informal)"]
  - [keopi-mani, "커피를 너무 많이 마셨어", "I drank too much coffee (casual)", "tomei café demais (informal)"]
  - [jojyong, "조용히 해", "be quiet (casual)", "fala baixo (informal)"]
  - [ilchik, "일찍 자", "go to bed early (casual)", "dorme cedo (informal)"]
dialogue:
  - [protagonist, "민준아, 여기가 스터디카페야? 정말 조용하다.", "Minjun, this is the study café? It's really quiet.", "Minjun, isto é o café de estudos? Que silêncio."]
  - [minjun, "응, 조용히 해. 내일 시험이라서 밤새 공부해.", "Yeah, keep your voice down. I have an exam tomorrow, so I'm studying all night.", "É, fala baixo. Amanhã tenho prova, então vou estudar a noite toda."]
  - [protagonist, "밤새? 안 피곤해?", "All night? Aren't you tired?", "A noite toda? Não está cansado?"]
  - [minjun, "피곤해. 커피를 너무 많이 마셔서 잠이 안 와.", "I'm tired. I drank too much coffee, so I can't sleep.", "Estou cansado. Tomei café demais, então o sono não vem."]
  - [protagonist, "공부하는 것도 중요하지만 자는 것도 중요해.", "Studying is important, but sleeping is important too.", "Estudar é importante, mas dormir também."]
  - [minjun, "알아. 그런데 한국에서는 다 이렇게 해.", "I know. But in Korea everyone does this.", "Eu sei. Mas na Coreia todo mundo faz assim."]
  - [protagonist, "나는 졸려서 먼저 갈게. 시험 끝나면 일찍 자!", "I'm sleepy, so I'll go first. Go to bed early after the exam!", "Estou com sono, vou indo. Depois da prova, dorme cedo!"]
  - [minjun, "고마워, 형. 내일 연락할게.", "Thanks, hyung. I'll message you tomorrow.", "Valeu, hyung. Amanhã te mando mensagem."]
teach:
  - ask: ["Casually: this is the study café?", "Informal: isto é o café de estudos?", "여기가 스터디카페야?", seuteodikape]
  - ask: ["Tell a friend to be quiet, casually.", "Diga a um amigo, informal, para falar baixo.", "조용히 해.", jojyong]
  - ask: ["Say: I have an exam tomorrow.", "Diga: amanhã tenho prova.", "내일 시험이에요.", siheom]
  - ask: ["Say: I'm studying all night.", "Diga: vou estudar a noite toda.", "밤새 공부해요.", bamsae]
  - note: ["-아서/어서 gives the cause: 마시다 → 마셔서, because I drank; 졸리다 → 졸려서, because I'm sleepy.", "-아서/어서 dá a causa: 마시다 → 마셔서, porque bebi; 졸리다 → 졸려서, porque estou com sono."]
  - ask: ["Casually: I drank too much coffee.", "Informal: tomei café demais.", "커피를 너무 많이 마셨어.", keopi-mani]
  - ask: ["Casually: I'm sleepy, so I'll go first.", "Informal: estou com sono, vou indo.", "졸려서 먼저 갈게.", aseo3, jolyeo]
  - ask: ["Ask if he's tired.", "Pergunte se ele está cansado.", "피곤해요?", pigonhaeyo]
  - note: ["-는 것 makes a verb a thing to talk about: 자다 → 자는 것, sleeping; 공부하다 → 공부하는 것, studying.", "-는 것 faz do verbo uma coisa de que se fala: 자다 → 자는 것, dormir; 공부하다 → 공부하는 것, estudar."]
  - ask: ["Casually: sleeping is important too.", "Informal: dormir também é importante.", "자는 것도 중요해.", janeun-geot, neun-geot]
  - ask: ["Say: I can't fall asleep (sleep doesn't come).", "Diga: o sono não vem.", "잠이 안 와요.", jam]
  - ask: ["Tell a friend: go to bed early.", "Diga a um amigo: dorme cedo.", "일찍 자!", ilchik]
  - pt_only: "Os 스터디카페, abertos 24 horas, são a biblioteca de quem estuda para prova ou concurso. Dormir pouco é quase um orgulho na Coreia — e uma preocupação de saúde pública."
