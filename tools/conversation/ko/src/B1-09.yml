id: B1-09
protagonist: f
title: ["Statistics", "Estatística"]
situation: ["Jieun reads a survey about young Koreans: work, housing, marriage. You talk about what the numbers say.", "A Jieun lê uma pesquisa sobre jovens coreanos: trabalho, moradia, casamento. Vocês conversam sobre o que os números dizem."]
learn: [ko-reported, ko-nikl-104, ko-nikl-129]
culture: Young people, housing costs and later marriage
items:
  - [josa, "조사", "survey, study", "pesquisa, levantamento"]
  - [pyeonggyun, "평균", "average", "média"]
  - [tonggye, "통계", "statistics", "estatística"]
  - [eungdap, "응답", "response, answer", "resposta"]
  - [dago-haeyo, "-다고 해요", "they say that, it's said that", "dizem que"]
  - [neundago, "-는다고 (reporting)", "that (verb): 결혼한다고", "que (verbo): 결혼한다고"]
  - [eun-gyeolgwa, "-(으)ㄴ 결과", "as a result of …", "como resultado de …"]
  - [peosenteu2, "삼십 퍼센트", "thirty per cent", "trinta por cento"]
  - [jeolmeun-saram, "젊은 사람들", "young people", "os jovens"]
  - [jipgap, "집값", "housing prices", "preço da moradia"]
  - [neujeojyeoyo, "늦어지고 있어요", "is getting later", "está ficando mais tarde"]
  - [nolla, "놀라워요", "it's surprising", "é surpreendente"]
dialogue:
  - [jieun, "이 조사 봤어요? 젊은 사람들에 대한 통계예요.", "Have you seen this survey? Statistics about young people.", "Viu esta pesquisa? Estatística sobre os jovens."]
  - [protagonist, "뭐라고 해요?", "What does it say?", "O que diz?"]
  - [jieun, "평균 결혼 나이가 서른넷이라고 해요. 점점 늦어지고 있어요.", "It says the average marriage age is thirty-four. It's getting later and later.", "Diz que a idade média para casar é trinta e quatro. Está ficando cada vez mais tarde."]
  - [protagonist, "왜 그래요?", "Why is that?", "Por quê?"]
  - [jieun, "조사한 결과, 집값이 제일 큰 이유라고 해요.", "According to the results, housing prices are the biggest reason.", "Pelo resultado, o preço da moradia é o maior motivo."]
  - [protagonist, "응답자의 삼십 퍼센트가 결혼을 안 한다고 했어요?", "Thirty per cent of respondents said they won't marry?", "Trinta por cento disseram que não vão casar?"]
  - [jieun, "네. 놀랍죠? 저도 결혼은 나중에 한다고 엄마한테 말했어요.", "Yes. Surprising, isn't it? I told my mum I'll marry later, too.", "Sim. Surpreendente, né? Eu também falei para minha mãe que vou casar mais tarde."]
  - [protagonist, "브라질도 비슷한 것 같아요. 통계가 놀라워요.", "I think Brazil is similar. The statistics are surprising.", "Acho que no Brasil é parecido. A estatística surpreende."]
teach:
  - ask: ["Say: a survey about young people.", "Diga: uma pesquisa sobre os jovens.", "젊은 사람들에 대한 조사", josa, jeolmeun-saram]
  - ask: ["Ask what it says.", "Pergunte o que diz.", "뭐라고 해요?", tonggye]
  - note: ["Reporting what is said: -다고 해요 (adjectives, 이다 → 이라고), -는다고 해요 (verbs): 서른넷이라고 해요, they say it's 34; 결혼 안 한다고 해요, they say they won't marry.", "Relatando o que se diz: -다고 해요 (adjetivos, 이다 → 이라고), -는다고 해요 (verbos): 서른넷이라고 해요, dizem que é 34; 결혼 안 한다고 해요, dizem que não vão casar."]
  - ask: ["Say: they say the average age is thirty-four.", "Diga: dizem que a idade média é trinta e quatro.", "평균 나이가 서른넷이라고 해요.", dago-haeyo, pyeonggyun]
  - ask: ["Say: thirty per cent said they won't marry.", "Diga: trinta por cento disseram que não vão casar.", "삼십 퍼센트가 결혼을 안 한다고 했어요.", neundago, peosenteu2, eungdap]
  - ask: ["Say: it's getting later.", "Diga: está ficando mais tarde.", "점점 늦어지고 있어요.", neujeojyeoyo]
  - note: ["-(으)ㄴ 결과 is 'as a result of': 조사한 결과, as a result of the survey.", "-(으)ㄴ 결과 é 'como resultado de': 조사한 결과, pelo resultado da pesquisa."]
  - ask: ["Say: according to the survey, housing prices are the biggest reason.", "Diga: pelo resultado da pesquisa, o preço da moradia é o maior motivo.", "조사한 결과, 집값이 제일 큰 이유예요.", eun-gyeolgwa, jipgap]
  - ask: ["Say: it's surprising.", "Diga: é surpreendente.", "놀라워요.", nolla]
  - pt_only: "Na Coreia a idade média do primeiro casamento passa dos 33 anos e a natalidade é a mais baixa do mundo; moradia cara e jornadas longas aparecem sempre nas pesquisas como motivos."
