id: B1-08
protagonist: m
title: ["The wedding", "O casamento"]
situation: ["Your colleague Taeho's wedding in a wedding hall: the money envelope at the desk, a 30-minute ceremony, then the buffet.", "O casamento do colega Taeho num salão de festas: o envelope com dinheiro na mesa, cerimônia de 30 minutos, depois o bufê."]
learn: [ko-nikl-109, ko-nikl-143, ko-nikl-142]
culture: Wedding halls and the money envelope (축의금)
items:
  - [gyeolhonsik, "결혼식", "wedding", "casamento"]
  - [chugeuigeum, "축의금", "wedding money (gift)", "dinheiro de presente de casamento"]
  - [bongtu2, "봉투", "envelope", "envelope"]
  - [weding-hol, "웨딩홀", "wedding hall", "salão de casamento"]
  - [eodo2, "-아/어도", "even if, even though", "mesmo que"]
  - [eo-duda, "-아/어 두다", "do in advance, keep (for later)", "deixar feito, guardar"]
  - [eo-nota, "-아/어 놓다", "do and leave (ready)", "deixar (pronto)"]
  - [chukha-deuryeoyo, "결혼 축하드려요", "congratulations on your wedding", "parabéns pelo casamento"]
  - [sinrang, "신랑", "groom", "noivo"]
  - [sinbu, "신부", "bride", "noiva"]
  - [ppeop-e, "뷔페", "buffet", "bufê"]
  - [jeongjang, "정장", "suit (formal clothes)", "terno, traje formal"]
dialogue:
  - [jieun, "결혼식 축의금 준비했어요?", "Did you prepare the wedding money?", "Preparou o dinheiro do casamento?"]
  - [protagonist, "네, 봉투에 넣어 뒀어요. 얼마 넣어야 해요?", "Yes, I've put it in an envelope. How much should I put in?", "Sim, já deixei no envelope. Quanto tenho que pôr?"]
  - [jieun, "동료는 보통 오만 원 정도예요. 적어도 괜찮아요.", "For a colleague usually about 50,000 won. Even if it's less, that's fine.", "Para colega, normalmente uns 50 mil wons. Mesmo que seja menos, tudo bem."]
  - [protagonist, "결혼식이 정말 짧네요. 삼십 분이에요?", "The ceremony is really short. Thirty minutes?", "A cerimônia é bem curta. Trinta minutos?"]
  - [jieun, "네. 웨딩홀은 다음 결혼식이 있어서 빨라요.", "Yes. The hall has the next wedding, so it's quick.", "Sim. O salão tem o próximo casamento, por isso é rápido."]
  - [protagonist, "신랑 신부가 정말 예뻐요. 사진도 찍어 놓을게요.", "The bride and groom look lovely. I'll take some photos to keep.", "Os noivos estão lindos. Vou tirar umas fotos."]
  - [jieun, "좋아요. 이제 뷔페 먹으러 가요!", "Good. Now let's go to the buffet!", "Ótimo. Agora vamos ao bufê!"]
  - [protagonist, "태호 씨, 결혼 축하드려요! 행복하세요.", "Taeho, congratulations on your wedding! Be happy.", "Taeho, parabéns pelo casamento! Sejam felizes."]
teach:
  - ask: ["Say: the wedding money.", "Diga: o dinheiro do casamento.", "축의금", chugeuigeum]
  - note: ["-아/어 두다 is doing something now for later: 넣다 → 넣어 뒀어요, I've put it in (ready).", "-아/어 두다 é fazer algo agora para depois: 넣다 → 넣어 뒀어요, já deixei (pronto)."]
  - ask: ["Say you've put it in the envelope already.", "Diga que já pôs no envelope.", "봉투에 넣어 뒀어요.", bongtu2, eo-duda]
  - note: ["-아/어도 is 'even if': 적다 → 적어도 괜찮아요, even if it's less, it's fine.", "-아/어도 é 'mesmo que': 적다 → 적어도 괜찮아요, mesmo que seja menos, tudo bem."]
  - ask: ["Say: even if it's less, that's fine.", "Diga: mesmo que seja menos, tudo bem.", "적어도 괜찮아요.", eodo2]
  - ask: ["Say: the wedding hall.", "Diga: o salão de casamento.", "웨딩홀", weding-hol]
  - ask: ["Say: the bride and groom.", "Diga: os noivos.", "신랑 신부", sinrang, sinbu]
  - note: ["-아/어 놓다 is 'do and leave (it so)': 찍다 → 찍어 놓을게요, I'll take (photos) to keep.", "-아/어 놓다 é 'deixar feito': 찍다 → 찍어 놓을게요, vou tirar (fotos) para guardar."]
  - ask: ["Say you'll take photos to keep.", "Diga que vai tirar fotos para guardar.", "사진을 찍어 놓을게요.", eo-nota]
  - ask: ["Say: let's go to the buffet.", "Diga: vamos ao bufê.", "뷔페 먹으러 가요.", ppeop-e]
  - ask: ["Congratulate the groom.", "Dê os parabéns ao noivo.", "결혼 축하드려요!", chukha-deuryeoyo, gyeolhonsik]
  - ask: ["Say you wore a suit.", "Diga que foi de terno.", "정장을 입었어요.", jeongjang]
  - pt_only: "No Brasil se dá presente da lista; na Coreia se dá 축의금, dinheiro num envelope entregue numa mesa na entrada. A cerimônia num 웨딩홀 dura meia hora — a festa é o bufê."
