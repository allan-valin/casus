id: B1-07
protagonist: f
title: ["반말 to the wrong person", "반말 errado"]
situation: ["At Minjun's party you speak casually to his cousin — who turns out to be older than you. An awkward moment, and how to fix it.", "Na festa do Minjun você fala informal com o primo dele — que é mais velho que você. Um momento constrangedor, e como consertar."]
learn: [ko-nikl-138, ko-nikl-98, ko-nikl-99]
culture: Age, speech levels and repairing a slip
items:
  - [banmal2, "반말", "casual speech", "fala informal"]
  - [sillye2, "실례", "rudeness, discourtesy", "falta de educação"]
  - [gibun-nappayo, "기분 나빠요", "it's upsetting, offensive", "é chato, ofende"]
  - [nai, "나이", "age", "idade"]
  - [eumyeon-an-dwaeyo, "-(으)면 안 돼요", "must not", "não pode"]
  - [a-ya, "아/야 (calling a friend)", "vocative after a friend's name: 민준아, 서연아", "vocativo após nome de amigo: 민준아, 서연아"]
  - [yo-polite, "요 (after any word)", "makes a word polite: 네요, 저요, 왜요", "torna uma palavra educada: 네요, 저요, 왜요"]
  - [sachon, "사촌", "cousin", "primo, prima"]
  - [mollasseoyo2, "정말 몰랐어요", "I really didn't know", "eu realmente não sabia"]
  - [joesonghaeyo2, "말 놓아서 죄송해요", "sorry for speaking casually", "desculpe por falar informal"]
  - [gwaenchanayo3, "괜찮아요, 편하게 해요", "it's fine, be at ease", "tudo bem, fique à vontade"]
  - [oppa2, "오빠", "older brother (said by a woman); older male friend", "irmão mais velho (dito por mulher); amigo mais velho"]
dialogue:
  - [protagonist, "너도 민준이 친구야? 몇 살이야?", "Are you a friend of Minjun's too? How old are you?", "Você também é amigo do Minjun? Quantos anos você tem?"]
  - [cousin, "저는 민준이 사촌이에요. 서른다섯 살이에요.", "I'm Minjun's cousin. I'm thirty-five.", "Sou primo do Minjun. Tenho trinta e cinco."]
  - [protagonist, "어? 저보다 나이가 많으시네요! 말 놓아서 죄송해요.", "Oh? You're older than me! Sorry for speaking casually.", "Ué? O senhor é mais velho que eu! Desculpe por falar informal."]
  - [cousin, "하하, 괜찮아요. 외국 사람이니까요.", "Haha, it's fine. You're a foreigner, after all.", "Haha, tudo bem. Você é estrangeira."]
  - [protagonist, "정말 몰랐어요. 처음 만나면 반말 하면 안 되죠?", "I really didn't know. You mustn't use 반말 when you first meet, right?", "Eu realmente não sabia. Não se fala informal no primeiro encontro, né?"]
  - [cousin, "네, 처음에는 존댓말이 좋아요. 나이를 모르면요.", "Right, at first polite speech is better. If you don't know the age.", "Isso, no começo é melhor falar educado. Se não sabe a idade."]
  - [minjun, "누나, 우리 사촌 형한테 반말했어? 하하!", "Nuna, you used 반말 with my cousin? Haha!", "Nuna, você falou informal com meu primo? Haha!"]
  - [protagonist, "민준아, 웃지 마! 오빠, 다시 인사드릴게요. 반가워요!", "Minjun, don't laugh! Oppa, let me greet you again. Nice to meet you!", "Minjun, não ri! Oppa, deixa eu cumprimentar de novo. Prazer!"]
teach:
  - note: ["반말 to a stranger, or to someone older, feels rude: 기분 나빠요. Repair it at once: 말 놓아서 죄송해요.", "반말 com um desconhecido, ou com alguém mais velho, soa rude: 기분 나빠요. Conserte na hora: 말 놓아서 죄송해요."]
  - ask: ["Apologise for speaking casually.", "Peça desculpas por falar informal.", "말 놓아서 죄송해요.", joesonghaeyo2]
  - ask: ["Say: I really didn't know.", "Diga: eu realmente não sabia.", "정말 몰랐어요.", mollasseoyo2]
  - ask: ["Say: casual speech.", "Diga: fala informal.", "반말", banmal2]
  - note: ["-(으)면 안 돼요 is 'must not': 반말 하면 안 돼요, you mustn't speak casually.", "-(으)면 안 돼요 é 'não pode': 반말 하면 안 돼요, não pode falar informal."]
  - ask: ["Ask: you mustn't use 반말 at a first meeting, right?", "Pergunte: não se fala informal no primeiro encontro, né?", "처음 만나면 반말 하면 안 되죠?", eumyeon-an-dwaeyo]
  - ask: ["Say: if you don't know the age, polite is better.", "Diga: se não sabe a idade, é melhor falar educado.", "나이를 모르면 존댓말이 좋아요.", nai]
  - note: ["Calling a friend: name + 아 after a consonant (민준아), 야 after a vowel (서연아 → 서연아, 지수야). Only with friends and younger people.", "Para chamar um amigo: nome + 아 depois de consoante (민준아), 야 depois de vogal (지수야). Só com amigos e mais novos."]
  - ask: ["Call Minjun as a friend: Minjun, don't laugh!", "Chame o Minjun como amigo: Minjun, não ri!", "민준아, 웃지 마!", a-ya]
  - note: ["요 can follow almost any word to make it polite: 저요 (me), 왜요? (why?), 지금요 (now).", "요 pode vir depois de quase qualquer palavra para torná-la educada: 저요 (eu), 왜요? (por quê?), 지금요 (agora)."]
  - ask: ["Answer politely: 'me!'", "Responda com educação: 'eu!'", "저요!", yo-polite]
  - ask: ["Say: he's Minjun's cousin.", "Diga: ele é primo do Minjun.", "민준이 사촌이에요.", sachon]
  - ask: ["Say: it's rude.", "Diga: é falta de educação.", "실례예요.", sillye2]
  - ask: ["He reassures you. How?", "Ele tranquiliza você. Como?", "괜찮아요, 편하게 해요.", gwaenchanayo3]
  - ask: ["Call an older male friend (as a woman).", "Chame um amigo mais velho (sendo mulher).", "오빠!", oppa2]
  - ask: ["Say: it's upsetting.", "Diga: ofende.", "기분 나빠요.", gibun-nappayo]
  - pt_only: "No Brasil 'você' serve para quase todos. Na Coreia o 반말 com quem é mais velho e desconhecido ofende de verdade — mas um pedido de desculpas rápido e um 'oppa' resolvem."
