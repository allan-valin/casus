id: A2-21
protagonist: f
title: ["Alerts on the phone", "Alertas no celular"]
situation: ["Your phone screams at 7 a.m.: an emergency text about a cold wave. Mrs Park explains these messages.", "Seu celular dispara às 7 da manhã: um alerta de emergência sobre uma onda de frio. A senhora Park explica essas mensagens."]
learn: [ko-nikl-82, ko-nikl-32]
culture: Government emergency texts (재난 문자)
items:
  - [jaenan-munja, "재난 문자", "emergency text (from the government)", "alerta de emergência (do governo)"]
  - [hanpa, "한파", "cold wave", "onda de frio"]
  - [anjeon, "안전", "safety", "segurança"]
  - [daepi, "대피", "evacuation, taking shelter", "evacuação, abrigo"]
  - [eul-geot, "-(으)ㄹ 것", "(do) … (in notices: an instruction)", "(fazer) … (em avisos: uma instrução)"]
  - [oechul, "외출", "going out", "saída (de casa)"]
  - [jajehal-geot, "외출을 자제할 것", "avoid going out (notice style)", "evitar sair (estilo de aviso)"]
  - [suducgwan, "수도관", "water pipe", "cano de água"]
  - [eoreoyo, "얼어요", "freezes", "congela"]
  - [ttatteutage, "따뜻하게 입으세요", "dress warmly", "agasalhe-se"]
  - [nollasseoyo, "놀랐어요", "I got a fright", "levei um susto"]
  - [yeongha, "영하", "below zero", "abaixo de zero"]
dialogue:
  - [protagonist, "할머니, 아침에 핸드폰이 크게 울렸어요. 놀랐어요!", "Grandma, my phone rang really loudly this morning. I got a fright!", "Vovó, o celular tocou alto de manhã. Levei um susto!"]
  - [park, "재난 문자야. 오늘 한파래.", "It's an emergency text. There's a cold wave today.", "É alerta de emergência. Hoje tem onda de frio."]
  - [protagonist, "'외출을 자제할 것'은 무슨 뜻이에요?", "What does 'avoid going out' mean?", "O que quer dizer 'evitar sair'?"]
  - [park, "밖에 나가지 말라는 뜻이야. 영하 십오 도야.", "It means don't go out. It's minus fifteen.", "Quer dizer para não sair. Está quinze abaixo de zero."]
  - [protagonist, "영하 십오 도요? 브라질에서는 상상도 못 해요.", "Minus fifteen? In Brazil you can't even imagine it.", "Quinze abaixo de zero? No Brasil nem dá para imaginar."]
  - [park, "수도관이 얼 수 있으니까 물을 조금 틀어 놔.", "The pipes can freeze, so leave the tap running a little.", "O cano pode congelar, então deixa a torneira pingando."]
  - [protagonist, "알겠어요. 나갈 때는 따뜻하게 입을게요.", "OK. When I go out I'll dress warmly.", "Tá bom. Quando sair, vou me agasalhar."]
  - [park, "그래. 안전이 제일이야.", "Good. Safety comes first.", "Isso. A segurança vem primeiro."]
teach:
  - ask: ["Say you got a fright.", "Diga que levou um susto.", "놀랐어요!", nollasseoyo]
  - ask: ["Say: it's an emergency text.", "Diga: é um alerta de emergência.", "재난 문자예요.", jaenan-munja]
  - ask: ["Say there's a cold wave today.", "Diga que hoje tem onda de frio.", "오늘 한파예요.", hanpa]
  - note: ["Notices and alerts give instructions with -(으)ㄹ 것: 자제하다 → 자제할 것, (you are to) refrain. You read it; you don't say it.", "Avisos e alertas dão instruções com -(으)ㄹ 것: 자제하다 → 자제할 것, (deve-se) evitar. Você lê; não fala assim."]
  - ask: ["Read the alert: avoid going out.", "Leia o alerta: evitar sair.", "외출을 자제할 것", jajehal-geot, eul-geot, oechul]
  - ask: ["Say: it's minus fifteen.", "Diga: está quinze abaixo de zero.", "영하 십오 도예요.", yeongha]
  - ask: ["Say the water pipes can freeze.", "Diga que o cano pode congelar.", "수도관이 얼 수 있어요.", suducgwan, eoreoyo]
  - note: ["-(으)세요 again, to tell someone kindly: 입다 → 따뜻하게 입으세요, dress warmly.", "-(으)세요 de novo, para recomendar com gentileza: 입다 → 따뜻하게 입으세요, agasalhe-se."]
  - ask: ["Tell a friend's mother: please dress warmly.", "Diga à mãe de um amigo: agasalhe-se.", "따뜻하게 입으세요.", ttatteutage]
  - ask: ["Say: safety first.", "Diga: segurança em primeiro lugar.", "안전이 제일이에요.", anjeon]
  - ask: ["Say: go to the shelter (evacuate).", "Diga: vá para o abrigo.", "대피하세요.", daepi]
  - pt_only: "Os 재난 문자 chegam a todos os celulares da região com um alarme alto: onda de frio, poeira fina, terremoto, até treinos de defesa civil. No Brasil a Defesa Civil começou a fazer algo parecido."
