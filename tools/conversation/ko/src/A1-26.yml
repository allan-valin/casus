id: A1-26
protagonist: m
title: ["Noraebang", "Noraebang"]
situation: ["After the team dinner everyone goes to a karaoke room. The team lead hands you the microphone.", "Depois do jantar da equipe todos vão a uma sala de karaokê. A líder entrega o microfone a você."]
learn: [ko-nikl-41, ko-nikl-42]
culture: Everyone sings at the noraebang
items:
  - [noraebang, "노래방", "karaoke room", "karaokê (sala)"]
  - [noraehaeyo, "노래해요", "sing", "canta"]
  - [baksu, "박수", "applause", "aplausos"]
  - [ji-anayo, "-지 않아요", "doesn't, isn't (long negation)", "não (negação longa)"]
  - [eul-su-isseoyo, "-(으)ㄹ 수 있어요", "can", "consegue, pode"]
  - [eul-su-eopseoyo, "-(으)ㄹ 수 없어요", "can't", "não consegue"]
  - [mike, "마이크", "microphone", "microfone"]
  - [hanguk-norae, "한국 노래", "Korean song", "música coreana"]
  - [bulleoyo, "불러요", "sings (a song)", "canta (uma música)"]
  - [jalhaeyo, "잘해요", "is good at it", "faz bem"]
  - [bukkeureowoyo, "부끄러워요", "I'm shy, embarrassed", "estou com vergonha"]
  - [hanbeon-deo, "한 번 더!", "One more time!", "Mais uma vez!"]
dialogue:
  - [jieun, "자, 이제 노래방이에요! 노래해요.", "Right, it's noraebang time! Sing.", "Pronto, agora é karaokê! Cante."]
  - [protagonist, "저는 노래를 잘하지 않아요. 부끄러워요.", "I'm not good at singing. I'm shy.", "Eu não canto bem. Tenho vergonha."]
  - [jieun, "괜찮아요. 한국 노래 부를 수 있어요?", "It's fine. Can you sing a Korean song?", "Tudo bem. Você consegue cantar uma música coreana?"]
  - [protagonist, "한국 노래는 부를 수 없어요. 아직 너무 어려워요.", "I can't sing Korean songs. They're still too hard.", "Música coreana não consigo. Ainda é difícil demais."]
  - [jieun, "그럼 브라질 노래 불러요! 여기 마이크요.", "Then sing a Brazilian song! Here's the microphone.", "Então cante uma brasileira! Aqui o microfone."]
  - [protagonist, "알겠어요… 그럼 보사노바 할게요.", "OK… then I'll do some bossa nova.", "Tá bom… então vou de bossa nova."]
  - [jieun, "와! 박수! 정말 잘해요!", "Wow! Applause! You're really good!", "Nossa! Aplausos! Você canta muito bem!"]
  - [protagonist, "아니에요. 그래도 고마워요.", "Not at all. But thanks.", "Que nada. Mas obrigado."]
  - [jieun, "한 번 더! 한 번 더!", "One more! One more!", "Mais uma! Mais uma!"]
teach:
  - ask: ["Say: it's noraebang time.", "Diga: agora é karaokê.", "노래방이에요!", noraebang]
  - note: ["Besides 안, a verb can be negated with -지 않아요: 잘하다 → 잘하지 않아요, I'm not good at it. It sounds a little more careful.", "Além do 안, nega-se com -지 않아요: 잘하다 → 잘하지 않아요, não sou bom nisso. Soa um pouco mais cuidadoso."]
  - ask: ["Say you're not good at singing.", "Diga que não canta bem.", "노래를 잘하지 않아요.", ji-anayo, noraehaeyo]
  - ask: ["Say you're shy.", "Diga que tem vergonha.", "부끄러워요.", bukkeureowoyo]
  - note: ["-(으)ㄹ 수 있어요 is 'can'; -(으)ㄹ 수 없어요 'can't': 부르다 → 부를 수 있어요.", "-(으)ㄹ 수 있어요 é 'consegue'; -(으)ㄹ 수 없어요 'não consegue': 부르다 → 부를 수 있어요."]
  - ask: ["Ask if he can sing a Korean song.", "Pergunte se ele consegue cantar uma música coreana.", "한국 노래 부를 수 있어요?", eul-su-isseoyo, hanguk-norae, bulleoyo]
  - ask: ["Say you can't sing Korean songs.", "Diga que não consegue cantar música coreana.", "한국 노래는 부를 수 없어요.", eul-su-eopseoyo]
  - ask: ["Hand over the microphone: here's the microphone.", "Entregue o microfone: aqui o microfone.", "여기 마이크요.", mike]
  - ask: ["Cheer: applause! You're really good!", "Aplauda: aplausos! Muito bem!", "박수! 정말 잘해요!", baksu, jalhaeyo]
  - ask: ["Shout: one more time!", "Grite: mais uma vez!", "한 번 더!", hanbeon-deo]
  - pt_only: "No 노래방 todo mundo canta, até quem canta mal — recusar o microfone é mais estranho do que desafinar. Uma música brasileira faz sucesso."
