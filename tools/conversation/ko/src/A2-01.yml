id: A2-01
protagonist: f
title: ["What did you do on Saturday?", "O que você fez no sábado?"]
situation: ["Monday morning on the stairs. Minjun, in casual speech now, asks about your weekend: you tried cycling along the Han for the first time.", "Segunda de manhã na escada. O Minjun, agora em 반말, pergunta do seu fim de semana: você andou de bicicleta pelo rio Han pela primeira vez."]
learn: [ko-try, ko-nikl-85, ko-nikl-81]
culture: Weekend leisure along the Han
items:
  - [jumal, "주말", "weekend", "fim de semana"]
  - [mwo-haesseo, "주말에 뭐 했어?", "What did you do at the weekend? (casual)", "O que você fez no fim de semana? (informal)"]
  - [eo-boda, "-아/어 보다", "try (doing)", "experimentar (fazer)"]
  - [ta-bwasseo, "타 봤어", "I tried riding (it)", "andei (experimentei)"]
  - [eun-jeok, "-(으)ㄴ 적이 있다", "have ever done", "já ter feito"]
  - [cheoeum2, "처음", "the first time", "a primeira vez"]
  - [jaemiisseosseo, "재미있었어", "it was fun (casual)", "foi divertido (informal)"]
  - [pigonhae, "피곤해", "I'm tired (casual)", "estou cansada (informal)"]
  - [daeume, "다음에", "next time", "da próxima vez"]
  - [ppallie, "빌렸어", "I rented / borrowed (casual)", "aluguei / peguei emprestado (informal)"]
  - [ttarungi, "따릉이", "Seoul's public bikes", "bicicletas públicas de Seul"]
  - [gachi-gaja, "같이 가자", "let's go together (casual)", "vamos juntos (informal)"]
dialogue:
  - [minjun, "누나, 주말에 뭐 했어?", "Nuna, what did you do at the weekend?", "Nuna, o que você fez no fim de semana?"]
  - [protagonist, "한강에서 자전거 타 봤어. 처음이었어!", "I tried cycling by the Han. It was my first time!", "Andei de bicicleta no rio Han. Foi a primeira vez!"]
  - [minjun, "와, 자전거 어디서 빌렸어?", "Wow, where did you rent a bike?", "Nossa, onde você alugou a bicicleta?"]
  - [protagonist, "따릉이 빌렸어. 앱으로 했어.", "I rented a Ttareungi. With the app.", "Aluguei uma 따릉이. Pelo aplicativo."]
  - [minjun, "재미있었어? 나는 따릉이 타 본 적이 없어.", "Was it fun? I've never ridden a Ttareungi.", "Foi divertido? Eu nunca andei de 따릉이."]
  - [protagonist, "진짜? 재미있었어. 그런데 지금 좀 피곤해.", "Really? It was fun. But I'm a bit tired now.", "Sério? Foi divertido. Mas agora estou meio cansada."]
  - [minjun, "다음에 같이 가자!", "Let's go together next time!", "Da próxima vez vamos juntos!"]
  - [protagonist, "좋아! 다음 주말에 타 보자.", "OK! Let's try next weekend.", "Bora! No próximo fim de semana."]
teach:
  - note: ["Since A1-23 you and Minjun speak 반말: no 요. 뭐 했어? — what did you do?", "Desde o A1-23 você e o Minjun falam 반말: sem 요. 뭐 했어? — o que você fez?"]
  - ask: ["Ask Minjun casually what he did at the weekend.", "Pergunte ao Minjun, informal, o que ele fez no fim de semana.", "주말에 뭐 했어?", jumal, mwo-haesseo]
  - note: ["-아/어 보다 is 'try doing': 타다 → 타 봤어, I tried riding.", "-아/어 보다 é 'experimentar fazer': 타다 → 타 봤어, andei (experimentei)."]
  - build: [ta-bwasseo, ["봤어", "타 봤어"]]
  - ask: ["Say casually: I tried cycling by the Han.", "Diga, informal: andei de bicicleta no rio Han.", "한강에서 자전거 타 봤어.", ta-bwasseo, eo-boda]
  - ask: ["Say it was the first time.", "Diga que foi a primeira vez.", "처음이었어!", cheoeum2]
  - ask: ["Say you rented a city bike.", "Diga que alugou uma bicicleta pública.", "따릉이 빌렸어.", ttarungi, ppallie]
  - note: ["-(으)ㄴ 적이 있다 / 없다: have ever / never done: 타 본 적이 없어, I've never ridden it.", "-(으)ㄴ 적이 있다 / 없다: já / nunca ter feito: 타 본 적이 없어, nunca andei."]
  - ask: ["Say casually: I've never ridden one.", "Diga, informal: eu nunca andei.", "타 본 적이 없어.", eun-jeok]
  - ask: ["Say it was fun.", "Diga que foi divertido.", "재미있었어.", jaemiisseosseo]
  - ask: ["Say you're tired.", "Diga que está cansada.", "피곤해.", pigonhae]
  - ask: ["Suggest: let's go together next time.", "Sugira: da próxima vez vamos juntos.", "다음에 같이 가자!", daeume, gachi-gaja]
  - pt_only: "As 따릉이 são as bicicletas públicas de Seul: aluga-se pelo aplicativo e anda-se pelas ciclovias do rio Han, como no Ibirapuera — só que com 40 km de margem."
