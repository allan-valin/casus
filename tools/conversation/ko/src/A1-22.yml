id: A1-22
protagonist: m
title: ["Days and hours", "Dias e horas"]
situation: ["The team lead plans the week's meetings with you. The company e-mail uses the formal style.", "A líder planeja as reuniões da semana com você. O e-mail da empresa usa o estilo formal."]
learn: [ko-nikl-20, ko-nikl-33, ko-nikl-44]
culture: Punctuality at work
items:
  - [woryoil, "월요일", "Monday", "segunda-feira"]
  - [suyoil, "수요일", "Wednesday", "quarta-feira"]
  - [geumyoil, "금요일", "Friday", "sexta-feira"]
  - [myeot-si-yeyo, "몇 시예요?", "What time is it?", "Que horas são?"]
  - [ohu, "오후", "afternoon, p.m.", "tarde"]
  - [ojeon, "오전", "morning, a.m.", "manhã"]
  - [se-si, "세 시", "three o'clock", "três horas"]
  - [ban, "반", "half (past)", "meia (e meia)"]
  - [gesseumnida, "-겠-", "will (intention, formal); I'll…", "vou… (intenção, formal)"]
  - [osipsio, "오십시오", "Please come (formal)", "Venha (formal)", {register: formal}]
  - [gi-jeone, "-기 전에", "before …-ing", "antes de"]
  - [neujeumyeon, "늦지 마세요", "Don't be late", "Não se atrase"]
dialogue:
  - [jieun, "이번 주 회의는 월요일하고 수요일이에요.", "This week's meetings are on Monday and Wednesday.", "As reuniões desta semana são segunda e quarta."]
  - [protagonist, "월요일 몇 시예요?", "What time on Monday?", "Que horas na segunda?"]
  - [jieun, "오전 열 시 반이에요. 수요일은 오후 세 시예요.", "Half past ten in the morning. Wednesday is three in the afternoon.", "Dez e meia da manhã. Quarta, três da tarde."]
  - [protagonist, "알겠습니다. 월요일 열 시 반에 가겠습니다.", "Understood. I'll be there Monday at half past ten.", "Entendido. Estarei lá segunda às dez e meia."]
  - [jieun, "회의하기 전에 자료를 읽어 주세요.", "Please read the documents before the meeting.", "Leia o material antes da reunião, por favor."]
  - [protagonist, "네. 이메일에 '회의실로 오십시오'라고 써 있어요.", "Yes. The e-mail says 'Please come to the meeting room'.", "Sim. O e-mail diz 'Venham à sala de reunião'."]
  - [jieun, "회사 이메일은 그렇게 써요. 늦지 마세요!", "Company e-mails are written like that. Don't be late!", "E-mail da empresa é assim. Não se atrase!"]
  - [protagonist, "걱정 마세요. 금요일 회의도 있어요?", "Don't worry. Is there a meeting on Friday too?", "Pode deixar. Tem reunião na sexta também?"]
teach:
  - ask: ["Say: Monday and Wednesday.", "Diga: segunda e quarta.", "월요일하고 수요일", woryoil, suyoil]
  - ask: ["Ask what time it is.", "Pergunte que horas são.", "몇 시예요?", myeot-si-yeyo]
  - note: ["Hours use native numbers (한 시, 두 시, 세 시), minutes Sino-Korean numbers; 반 is half past. 오전 morning, 오후 afternoon.", "As horas usam números nativos (한 시, 두 시, 세 시), os minutos os sino-coreanos; 반 é 'e meia'. 오전 manhã, 오후 tarde."]
  - ask: ["Say: half past ten in the morning.", "Diga: dez e meia da manhã.", "오전 열 시 반", ojeon, ban]
  - ask: ["Say: three in the afternoon.", "Diga: três da tarde.", "오후 세 시", ohu, se-si]
  - note: ["-겠- states an intention, politely and formally: 가겠습니다, I will go — common at work.", "-겠- declara uma intenção, com educação e formalidade: 가겠습니다, irei — comum no trabalho."]
  - ask: ["Tell your boss: I'll be there Monday at half past ten.", "Diga à chefe: estarei lá segunda às dez e meia.", "월요일 열 시 반에 가겠습니다.", gesseumnida]
  - note: ["-기 전에 is 'before': 회의하다 → 회의하기 전에, before the meeting.", "-기 전에 é 'antes de': 회의하다 → 회의하기 전에, antes da reunião."]
  - ask: ["Say: read it before the meeting.", "Diga: leia antes da reunião.", "회의하기 전에 읽어 주세요.", gi-jeone]
  - ask: ["Read the e-mail: please come to the meeting room (formal).", "Leia o e-mail: venham à sala de reunião (formal).", "회의실로 오십시오.", osipsio]
  - ask: ["Say: don't be late.", "Diga: não se atrase.", "늦지 마세요.", neujeumyeon]
  - ask: ["Ask if there's a meeting on Friday too.", "Pergunte se tem reunião na sexta também.", "금요일 회의도 있어요?", geumyoil]
  - pt_only: "No Brasil 'dez e meia' às vezes vira dez e quarenta. Na Coreia a reunião começa na hora — e chegar cinco minutos antes é o normal."
