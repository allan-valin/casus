id: B1-06
protagonist: m
title: ["Energy", "Energia"]
situation: ["A heat wave and a news report on power demand. The team lead explains where Korea's electricity comes from.", "Uma onda de calor e uma reportagem sobre o consumo de energia. A líder explica de onde vem a eletricidade da Coreia."]
learn: [ko-because-2, ko-nikl-147, ko-nikl-136]
culture: Nuclear power, coal and the summer peak
items:
  - [wonjaryeok, "원자력", "nuclear power", "energia nuclear"]
  - [eneoji, "에너지", "energy", "energia"]
  - [jeoryak, "절약", "saving (energy, money)", "economia (de energia, dinheiro)"]
  - [baljeonso, "발전소", "power station", "usina"]
  - [gi-ttaemune2, "-기 때문에", "because", "porque"]
  - [e-daehae, "에 대해(서)", "about, concerning", "sobre, a respeito de"]
  - [gi-wihae, "-기 위해(서)", "in order to", "para (com o fim de)"]
  - [seokan, "석탄", "coal", "carvão"]
  - [taeyanggwang, "태양광", "solar power", "energia solar"]
  - [sayongnyang, "사용량", "amount used, consumption", "consumo"]
  - [jeongjeon, "정전", "power cut", "apagão"]
  - [nyuseu, "뉴스에서", "on the news", "no noticiário"]
dialogue:
  - [protagonist, "팀장님, 뉴스에서 전기 사용량에 대해 이야기했어요.", "Team lead, the news talked about electricity consumption.", "Líder, o noticiário falou sobre o consumo de energia."]
  - [jieun, "네, 너무 덥기 때문에 에어컨을 많이 써요.", "Yes, because it's so hot, people use the air conditioning a lot.", "Sim, como está muito quente, o pessoal usa muito ar-condicionado."]
  - [protagonist, "한국은 전기를 어디서 만들어요?", "Where does Korea make its electricity?", "De onde vem a eletricidade da Coreia?"]
  - [jieun, "원자력 발전소하고 석탄이 많아요. 태양광도 늘고 있어요.", "Mostly nuclear plants and coal. Solar is growing too.", "Muita usina nuclear e carvão. A solar também está crescendo."]
  - [protagonist, "브라질은 물로 전기를 많이 만들어요. 강이 크기 때문에요.", "Brazil makes a lot of electricity from water. Because the rivers are big.", "O Brasil gera muita eletricidade com água. Porque os rios são grandes."]
  - [jieun, "아, 수력이요? 신기하네요.", "Oh, hydropower? Interesting.", "Ah, hidrelétrica? Que interessante."]
  - [protagonist, "정전이 되지 않게 하기 위해서 우리도 에너지를 절약해야겠어요.", "To avoid a power cut, we should save energy too.", "Para não ter apagão, a gente também precisa economizar energia."]
  - [jieun, "맞아요. 사무실 온도를 이십육 도로 해요.", "Right. Let's set the office to 26 degrees.", "Isso. Vamos deixar o escritório em 26 graus."]
teach:
  - note: ["에 대해(서) is 'about': 전기 사용량에 대해 이야기했어요, they talked about power use.", "에 대해(서) é 'sobre': 전기 사용량에 대해 이야기했어요, falaram sobre o consumo de energia."]
  - ask: ["Say the news talked about electricity consumption.", "Diga que o noticiário falou sobre o consumo de energia.", "뉴스에서 전기 사용량에 대해 이야기했어요.", nyuseu, e-daehae, sayongnyang]
  - note: ["-기 때문에 gives a firm cause: 덥다 → 덥기 때문에, because it is hot.", "-기 때문에 dá uma causa firme: 덥다 → 덥기 때문에, porque está quente."]
  - ask: ["Say: because it's so hot, people use the AC a lot.", "Diga: como está muito quente, usam muito o ar.", "너무 덥기 때문에 에어컨을 많이 써요.", gi-ttaemune2]
  - ask: ["Say: nuclear power plants and coal.", "Diga: usinas nucleares e carvão.", "원자력 발전소하고 석탄", wonjaryeok, baljeonso, seokan]
  - ask: ["Say: solar power is growing.", "Diga: a energia solar está crescendo.", "태양광이 늘고 있어요.", taeyanggwang]
  - note: ["-기 위해(서) is 'in order to': 정전이 되지 않게 하기 위해서, in order to avoid a power cut.", "-기 위해(서) é 'para': 정전이 되지 않게 하기 위해서, para não ter apagão."]
  - ask: ["Say: to avoid a power cut, we should save energy.", "Diga: para não ter apagão, precisamos economizar energia.", "정전이 되지 않게 하기 위해서 에너지를 절약해야 돼요.", gi-wihae, jeongjeon, jeoryak, eneoji]
  - pt_only: "O Brasil tira mais da metade da eletricidade da água; a Coreia, quase sem grandes rios, depende de usinas nucleares e de carvão — e no verão o governo pede para economizar."
