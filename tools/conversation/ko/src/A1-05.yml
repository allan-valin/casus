id: A1-05
protagonist: f
title: ["Hangul", "Hangul"]
situation: ["In front of the shop, the owner helps you read the signs of the street: exit, entrance, the subway.", "Na frente da loja, o dono ajuda você a ler as placas da rua: saída, entrada, o metrô."]
learn: [ko-haeyo, ko-nikl-8]
culture: Hangul can be learned in days — Koreans are proud of it
items:
  - [eotteoke, "어떻게 읽어요?", "How do you read it?", "Como se lê?"]
  - [ilgeoyo, "읽어요", "reads / I read", "lê / eu leio"]
  - [chulgu, "출구", "exit", "saída"]
  - [ipgu, "입구", "entrance", "entrada"]
  - [jihacheol, "지하철", "subway", "metrô"]
  - [yeok, "역", "station", "estação"]
  - [gongbuhaeyo, "공부해요", "studies / I study", "estuda / eu estudo"]
  - [jal, "잘", "well", "bem"]
  - [jogeum, "조금", "a little", "um pouco"]
  - [gayo, "가요", "goes / I go", "vai / eu vou"]
  - [irang, "이랑", "and, with (talk: 이랑 after a consonant, 랑 after a vowel)", "e, com (fala: 이랑 depois de consoante, 랑 depois de vogal)"]
  - [gakkawoyo, "가까워요", "is near", "é perto"]
  - [anieyo, "아니에요", "No, not at all (modest)", "Que nada (modesto)"]
dialogue:
  - [protagonist, "사장님, 이거 어떻게 읽어요?", "Boss, how do you read this?", "Chefe, como se lê isto?"]
  - [sajang, "'출구'예요. 저기는 '입구'예요.", "It's 'exit'. Over there is 'entrance'.", "É 'saída'. Lá é 'entrada'."]
  - [protagonist, "아, 출구! 저는 한글 공부해요.", "Ah, exit! I'm studying hangul.", "Ah, saída! Eu estudo hangul."]
  - [sajang, "와, 한글 잘 읽어요!", "Wow, you read hangul well!", "Nossa, você lê hangul bem!"]
  - [protagonist, "아니에요. 조금 읽어요.", "Not at all. I read a little.", "Que nada. Leio um pouco."]
  - [sajang, "지하철역은 저기예요. 지하철역이랑 버스도 가까워요.", "The subway station is over there. The station and the bus are close.", "A estação de metrô é ali. A estação e o ônibus ficam perto."]
  - [protagonist, "지하철역이 가까워요? 좋아요!", "The station is near? Great!", "A estação é perto? Ótimo!"]
  - [protagonist, "감사합니다. 지하철역에 가요!", "Thank you. I'm off to the station!", "Obrigada. Vou para a estação!"]
teach:
  - note: ["Shop owners are called 사장님, 'boss'. Ask him how to read a sign: 이거 어떻게 읽어요?", "O dono da loja é chamado de 사장님, 'chefe'. Pergunte como se lê uma placa: 이거 어떻게 읽어요?"]
  - ask: ["Ask how to read this.", "Pergunte como se lê isto.", "이거 어떻게 읽어요?", eotteoke]
  - ask: ["Read the sign: exit.", "Leia a placa: saída.", "출구", chulgu]
  - ask: ["And: entrance.", "E: entrada.", "입구", ipgu]
  - note: ["The polite present ends in -아요/-어요: 가다 → 가요, 읽다 → 읽어요, and every 하다 verb → 해요: 공부하다 → 공부해요. One form for I, you, he, she.", "O presente educado termina em -아요/-어요: 가다 → 가요, 읽다 → 읽어요, e todo verbo em 하다 → 해요: 공부하다 → 공부해요. A mesma forma serve para 'eu', 'você', 'ele' e 'ela'."]
  - build: [gongbuhaeyo, ["-해요", "-부해요", "공부해요"]]
  - ask: ["Say that you study hangul.", "Diga que você estuda hangul.", "저는 한글 공부해요.", gongbuhaeyo]
  - ask: ["He praises you. How did he say 'you read well'?", "Ele elogia você. Como ele disse 'lê bem'?", "잘 읽어요!", jal, ilgeoyo]
  - note: ["Praise is answered modestly: 아니에요, 'not at all'.", "Responde-se a um elogio com modéstia: 아니에요, 'que nada'."]
  - ask: ["Answer modestly: not at all, I read a little.", "Responda com modéstia: que nada, leio um pouco.", "아니에요. 조금 읽어요.", anieyo, jogeum, ilgeoyo]
  - note: ["In talk, 'and / with' between nouns is often 이랑 / 랑: 지하철역이랑 버스.", "Na fala, 'e / com' entre substantivos muitas vezes é 이랑 / 랑: 지하철역이랑 버스."]
  - ask: ["Say: the station and the bus are near.", "Diga: a estação e o ônibus ficam perto.", "지하철역이랑 버스도 가까워요.", jihacheol, yeok, irang, gakkawoyo]
  - ask: ["Say that you are going to the station.", "Diga que você está indo para a estação.", "지하철역에 가요.", gayo]
  - pt_only: "O hangul foi criado no século XV para que qualquer pessoa pudesse ler. Os coreanos têm orgulho disso — e gostam muito quando um estrangeiro lê as placas."
