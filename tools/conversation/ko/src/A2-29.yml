id: A2-29
protagonist: f
title: ["Missing home", "Saudade de casa"]
situation: ["After a video call to São Paulo — twelve hours apart — you sit on the stairs, sad. Mrs Park sits next to you.", "Depois de uma chamada de vídeo para São Paulo — doze horas de diferença — você senta na escada, triste. A senhora Park senta ao seu lado."]
learn: [ko-nikl-53, ko-want]
culture: Saudade and 그리움; 정 between neighbours
items:
  - [bogo-sipda, "보고 싶어요", "I miss (them)", "sinto saudade (deles)"]
  - [geuriwoyo, "그리워요", "I long for, I miss (a place, a time)", "sinto falta (de um lugar, um tempo)"]
  - [sicha, "시차", "time difference", "fuso horário"]
  - [yeongsangtonghwa, "영상통화", "video call", "chamada de vídeo"]
  - [egeseo, "에게서", "from (a person; written, careful)", "de (uma pessoa; escrito, cuidadoso)"]
  - [munja, "문자", "text message", "mensagem de texto"]
  - [gohyang-eumsik, "고향 음식", "food from home", "comida de casa"]
  - [oeroweoyo, "외로워요", "I'm lonely", "estou sozinha"]
  - [uljima, "울지 마", "don't cry (casual)", "não chora (informal)"]
  - [gwaenchanajil, "괜찮아질 거야", "it'll get better (casual)", "vai melhorar (informal)"]
  - [jeong, "정", "warm attachment (between people)", "afeto, laço (entre pessoas)"]
  - [deundunhae, "든든해요", "I feel safe, reassured", "me sinto amparada"]
dialogue:
  - [park, "왜 여기 앉아 있어? 무슨 일 있어?", "Why are you sitting here? Is something wrong?", "Por que está sentada aqui? Aconteceu alguma coisa?"]
  - [protagonist, "방금 엄마하고 영상통화 했어요. 가족이 너무 보고 싶어요.", "I just video-called my mum. I miss my family so much.", "Acabei de fazer chamada de vídeo com minha mãe. Sinto muita saudade da família."]
  - [park, "시차가 크지?", "The time difference is big, isn't it?", "O fuso é grande, né?"]
  - [protagonist, "네, 열두 시간이에요. 엄마에게서 매일 문자가 와요.", "Yes, twelve hours. My mum texts me every day.", "Sim, doze horas. Todo dia chega mensagem da minha mãe."]
  - [park, "좋은 엄마네. 울지 마. 괜찮아질 거야.", "A good mother. Don't cry. It'll get better.", "Boa mãe. Não chora. Vai melhorar."]
  - [protagonist, "가끔 외로워요. 고향 음식도 그리워요.", "Sometimes I'm lonely. I miss the food from home, too.", "Às vezes me sinto sozinha. Sinto falta da comida de casa também."]
  - [park, "그럼 오늘 저녁은 나랑 같이 먹자. 내가 만들어 줄게.", "Then have dinner with me tonight. I'll make something for you.", "Então hoje você janta comigo. Eu faço para você."]
  - [protagonist, "감사합니다, 할머니. 할머니가 있어서 든든해요.", "Thank you, grandma. I feel safe because you're here.", "Obrigada, vovó. Com a senhora aqui me sinto amparada."]
teach:
  - ask: ["Say: I just made a video call.", "Diga: acabei de fazer uma chamada de vídeo.", "방금 영상통화 했어요.", yeongsangtonghwa]
  - note: ["보고 싶어요 is missing people ('I want to see'); 그리워요 is longing for something gone or far: home, the food, a time.", "보고 싶어요 é saudade de pessoas ('quero ver'); 그리워요 é sentir falta de algo distante: a casa, a comida, uma época."]
  - ask: ["Say you miss your family.", "Diga que sente saudade da família.", "가족이 보고 싶어요.", bogo-sipda]
  - ask: ["Say you long for the food from home.", "Diga que sente falta da comida de casa.", "고향 음식이 그리워요.", geuriwoyo, gohyang-eumsik]
  - ask: ["Say: the time difference is twelve hours.", "Diga: o fuso é de doze horas.", "시차가 열두 시간이에요.", sicha]
  - note: ["에게서 is 'from' a person, a little careful (한테서 in talk): 엄마에게서 문자가 와요, texts come from mum.", "에게서 é 'de' uma pessoa, um pouco cuidadoso (한테서 na fala): 엄마에게서 문자가 와요, chegam mensagens da mãe."]
  - ask: ["Say your mum texts you every day.", "Diga que todo dia chega mensagem da sua mãe.", "엄마에게서 매일 문자가 와요.", egeseo, munja]
  - ask: ["Say: sometimes I'm lonely.", "Diga: às vezes me sinto sozinha.", "가끔 외로워요.", oeroweoyo]
  - ask: ["How does she say 'don't cry', casually?", "Como ela diz 'não chora', informal?", "울지 마.", uljima]
  - ask: ["How does she say 'it'll get better'?", "Como ela diz 'vai melhorar'?", "괜찮아질 거야.", gwaenchanajil]
  - ask: ["Say: I feel safe because you're here (to an elder).", "Diga: com a senhora aqui me sinto amparada.", "할머니가 있어서 든든해요.", deundunhae]
  - note: ["정 is the warm bond that grows between people who share daily life — neighbours, landladies, the shop owner.", "정 é o laço afetuoso que cresce entre quem divide o dia a dia — vizinhos, a senhoria, o dono da loja."]
  - ask: ["Say: the warm bond between people.", "Diga: o laço entre as pessoas.", "정", jeong]
  - pt_only: "'Saudade' não tem tradução, mas o coreano chega perto com 그리움 — e o 정, o afeto que nasce da convivência, é o que faz a senhora Park te chamar para jantar."
