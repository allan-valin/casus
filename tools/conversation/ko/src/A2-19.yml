id: A2-19
protagonist: f
title: ["Moving house", "Mudança"]
situation: ["You move to a bigger flat in the same building. A moving company packs, carries and unpacks everything.", "Você se muda para um apartamento maior no mesmo prédio. A empresa de mudança embala, carrega e desembala tudo."]
learn: [ko-nikl-59, ko-nikl-51, ko-nikl-52]
culture: Full-service moving (포장이사)
items:
  - [isa, "이사", "moving house", "mudança"]
  - [jim, "짐", "luggage, belongings", "bagagem, coisas"]
  - [sangja, "상자", "box", "caixa"]
  - [isatjimsenteo, "이삿짐센터", "moving company", "empresa de mudança"]
  - [eumyeonseo, "-(으)면서", "while (doing two things at once)", "enquanto (fazendo duas coisas)"]
  - [edaga, "에다가", "(put) on, in, into", "(pôr) em, dentro de"]
  - [egero, "에게로", "toward (a person)", "em direção a (uma pessoa)"]
  - [ollyeo-juseyo, "올려 주세요", "please put it up (on)", "ponha em cima, por favor"]
  - [josimhae, "조심해 주세요", "please be careful", "tenha cuidado, por favor"]
  - [kkaejigi-swiun, "깨지기 쉬워요", "it breaks easily, fragile", "é frágil"]
  - [pojangisa, "포장이사", "full-service move (they pack too)", "mudança completa (embalam também)"]
  - [kkeutnasseoyo, "끝났어요", "it's finished", "terminou"]
dialogue:
  - [mover, "안녕하세요, 이삿짐센터에서 왔습니다.", "Hello, we're from the moving company.", "Olá, somos da empresa de mudança."]
  - [protagonist, "어서 오세요. 포장이사죠? 짐이 좀 많아요.", "Come in. It's the full-service move, right? I have quite a lot of things.", "Entrem. É mudança completa, né? Tenho bastante coisa."]
  - [mover, "걱정 마세요. 이 상자는 뭐예요?", "Don't worry. What's in this box?", "Não se preocupe. O que tem nesta caixa?"]
  - [protagonist, "그릇이에요. 깨지기 쉬워요. 조심해 주세요.", "Dishes. They break easily. Please be careful.", "Louça. É frágil. Tenham cuidado, por favor."]
  - [mover, "네. 이 상자는 책상 위에다가 올려 둘게요.", "OK. I'll put this box on top of the desk.", "Certo. Vou pôr esta caixa em cima da mesa."]
  - [protagonist, "감사합니다. 저는 청소하면서 기다릴게요.", "Thank you. I'll clean while I wait.", "Obrigada. Vou limpando enquanto espero."]
  - [mover, "다 끝났어요. 옛날 열쇠는 집주인에게로 보냈어요.", "All done. We sent the old key to the owner.", "Pronto. Mandamos a chave velha para o proprietário."]
  - [protagonist, "정말 빠르네요! 이사가 벌써 끝났어요.", "That was so fast! The move is already done.", "Que rápido! A mudança já terminou."]
teach:
  - ask: ["Say: moving house.", "Diga: mudança.", "이사", isa]
  - ask: ["Say: you have a lot of things.", "Diga: tem muita coisa.", "짐이 많아요.", jim]
  - ask: ["Say: a full-service move.", "Diga: mudança completa.", "포장이사", pojangisa]
  - ask: ["Say: they're from the moving company.", "Diga: são da empresa de mudança.", "이삿짐센터에서 왔어요.", isatjimsenteo]
  - ask: ["Say: it's fragile.", "Diga: é frágil.", "깨지기 쉬워요.", kkaejigi-swiun]
  - ask: ["Ask them to be careful.", "Peça para terem cuidado.", "조심해 주세요.", josimhae]
  - note: ["에다가 is 'onto, into' for where you put something: 책상 위에다가, on top of the desk.", "에다가 é 'em, sobre' para onde se põe algo: 책상 위에다가, em cima da mesa."]
  - ask: ["Ask them to put the box on the desk.", "Peça para pôr a caixa em cima da mesa.", "상자를 책상 위에다가 올려 주세요.", sangja, edaga, ollyeo-juseyo]
  - note: ["-(으)면서 is 'while' doing two things at once: 청소하다 → 청소하면서 기다려요, I wait while cleaning.", "-(으)면서 é 'enquanto', duas coisas ao mesmo tempo: 청소하다 → 청소하면서 기다려요, espero limpando."]
  - ask: ["Say you'll clean while you wait.", "Diga que vai limpando enquanto espera.", "청소하면서 기다릴게요.", eumyeonseo]
  - note: ["에게로 is 'toward someone', a little bookish: 집주인에게로, (sent) to the owner. For an honoured person use 께.", "에게로 é 'em direção a alguém', um pouco formal: 집주인에게로, (mandou) para o proprietário. Para alguém respeitado, use 께."]
  - ask: ["Say: they sent the old key to the owner.", "Diga: mandaram a chave velha para o proprietário.", "옛날 열쇠는 집주인에게로 보냈어요.", egero]
  - ask: ["Say: the move is finished.", "Diga: a mudança terminou.", "이사가 끝났어요.", kkeutnasseoyo]
  - pt_only: "No 포장이사 a empresa embala, transporta e desembala tudo — você só indica onde vai cada coisa. Muito mais comum que no Brasil, e rápido."
