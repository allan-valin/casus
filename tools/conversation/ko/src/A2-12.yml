id: A2-12
protagonist: m
title: ["Geography", "Geografia"]
situation: ["Minjun shows you a map of Korea for your holiday plans: mountains almost everywhere, the sea on three sides, Jeju island.", "O Minjun mostra um mapa da Coreia para seus planos de férias: montanha quase em todo lugar, mar em três lados, a ilha de Jeju."]
learn: [ko-adnominal, ko-nikl-64, ko-nikl-63, ko-nikl-65]
culture: A peninsula of mountains
items:
  - [bada, "바다", "sea", "mar"]
  - [seom, "섬", "island", "ilha"]
  - [bando, "반도", "peninsula", "península"]
  - [jeil, "제일", "the most", "o mais"]
  - [eun-adj, "-(으)ㄴ (adjective before a noun)", "describing: 높은 산", "descrição: 높은 산"]
  - [neun-verb, "-는 (verb before a noun, now)", "who / that does: 사는 곳", "que faz: 사는 곳"]
  - [eul-future, "-(으)ㄹ (before a noun, to come)", "to be done: 갈 곳", "a fazer: 갈 곳"]
  - [nopeun, "높은 산", "a high mountain", "uma montanha alta"]
  - [jido, "지도", "map", "mapa"]
  - [hyuga, "휴가", "holiday, time off", "férias, folga"]
  - [gal-got, "갈 곳", "a place to go", "um lugar para ir"]
  - [sameun-got, "사는 곳", "where (someone) lives", "onde (alguém) mora"]
dialogue:
  - [minjun, "형, 이게 한국 지도야. 한국은 반도야.", "Hyung, this is a map of Korea. Korea is a peninsula.", "Hyung, este é o mapa da Coreia. A Coreia é uma península."]
  - [protagonist, "삼면이 바다네. 그리고 산이 정말 많아.", "Sea on three sides. And so many mountains.", "Mar em três lados. E muita montanha."]
  - [minjun, "응, 높은 산이 많아. 제일 높은 산은 한라산이야.", "Yeah, lots of high mountains. The highest is Hallasan.", "É, tem muita montanha alta. A mais alta é o Hallasan."]
  - [protagonist, "한라산은 어디 있어?", "Where is Hallasan?", "Onde fica o Hallasan?"]
  - [minjun, "제주도에 있어. 제주도는 제일 큰 섬이야.", "On Jeju. Jeju is the biggest island.", "Em Jeju. Jeju é a maior ilha."]
  - [protagonist, "휴가 때 갈 곳을 찾고 있어. 제주도 어때?", "I'm looking for a place to go on holiday. How about Jeju?", "Estou procurando um lugar para ir nas férias. Que tal Jeju?"]
  - [minjun, "좋아! 우리 이모가 사는 곳이야. 바다가 예뻐.", "Great! It's where my aunt lives. The sea is beautiful.", "Ótimo! É onde minha tia mora. O mar é lindo."]
  - [protagonist, "그럼 결정했어. 제주도에 갈 거야!", "Then it's decided. I'm going to Jeju!", "Então está decidido. Vou para Jeju!"]
teach:
  - ask: ["Casually: Korea is a peninsula.", "Informal: a Coreia é uma península.", "한국은 반도야.", bando]
  - ask: ["Say: this is a map.", "Diga: isto é um mapa.", "이게 지도예요.", jido]
  - note: ["Before a noun, a describing word takes -(으)ㄴ: 높다 → 높은 산, a high mountain; 크다 → 큰 섬, a big island.", "Antes do substantivo, a palavra que descreve leva -(으)ㄴ: 높다 → 높은 산, montanha alta; 크다 → 큰 섬, ilha grande."]
  - ask: ["Say: there are many high mountains.", "Diga: tem muita montanha alta.", "높은 산이 많아요.", nopeun, eun-adj]
  - ask: ["Say: Jeju is the biggest island.", "Diga: Jeju é a maior ilha.", "제주도는 제일 큰 섬이에요.", jeil, seom]
  - note: ["A verb before a noun: -는 for what happens now (사는 곳, the place where she lives), -(으)ㄹ for what is to come (갈 곳, a place to go).", "Verbo antes do substantivo: -는 para o que acontece agora (사는 곳, o lugar onde ela mora), -(으)ㄹ para o que vem (갈 곳, um lugar para ir)."]
  - ask: ["Say: it's where my aunt lives.", "Diga: é onde minha tia mora.", "이모가 사는 곳이에요.", sameun-got, neun-verb]
  - ask: ["Say you're looking for a place to go on holiday.", "Diga que procura um lugar para ir nas férias.", "휴가 때 갈 곳을 찾고 있어요.", gal-got, hyuga, eul-future]
  - ask: ["Say: the sea is beautiful.", "Diga: o mar é lindo.", "바다가 예뻐요.", bada]
  - pt_only: "Cerca de 70% da Coreia é montanha, por isso as cidades se espremem nos vales e o 등산 é passatempo nacional. Jeju, a ilha vulcânica do sul, é o destino de férias dos coreanos."
