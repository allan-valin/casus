id: A1-02
protagonist: m
title: ["The room", "O quarto"]
situation: ["Mrs Park shows you your one-room flat. Shoes come off at the door. A young neighbour passes by.", "A senhora Park mostra o seu 원룸, o quarto-apartamento. Os sapatos ficam na porta. Um vizinho jovem passa."]
learn: [ko-nikl-1, ko-nikl-2]
culture: Shoes off at the entrance
items:
  - [bang, "방", "room", "quarto"]
  - [hwajangsil, "화장실", "bathroom / toilet", "banheiro"]
  - [yeogi, "여기", "here", "aqui"]
  - [jeogi, "저기", "over there", "ali / lá"]
  - [i-ga, "이/가", "subject particle (이 after a consonant, 가 after a vowel)", "partícula de sujeito (이 depois de consoante, 가 depois de vogal)"]
  - [isseoyo, "있어요", "there is / is (located)", "tem / fica"]
  - [eodiyeyo, "어디예요?", "Where is it?", "Onde é?"]
  - [chimdae, "침대", "bed", "cama"]
  - [chaeksang, "책상", "desk", "escrivaninha"]
  - [gwa-wa, "과/와", "and (between nouns: 과 after a consonant, 와 after a vowel)", "e (entre substantivos: 과 depois de consoante, 와 depois de vogal)"]
  - [bimilbeonho, "비밀번호", "password; the door code", "senha; o código da porta"]
  - [sinbal, "신발", "shoes", "sapatos"]
  - [joesonghamnida, "죄송합니다", "I'm sorry (formal)", "Desculpe (formal)", {register: formal}]
  - [yeopjip, "옆집", "the house / flat next door", "a casa / o apartamento ao lado"]
dialogue:
  - [park, "여기가 방이에요.", "This is the room.", "Aqui é o quarto."]
  - [protagonist, "와, 좋아요! 화장실이 어디예요?", "Wow, nice! Where is the bathroom?", "Nossa, que bom! Onde é o banheiro?"]
  - [park, "화장실이 저기 있어요. 침대와 책상이 여기 있어요.", "The bathroom is over there. The bed and the desk are here.", "O banheiro fica ali. A cama e a escrivaninha ficam aqui."]
  - [protagonist, "비밀번호가 뭐예요?", "What is the door code?", "Qual é a senha da porta?"]
  - [park, "비밀번호가 여기 있어요. 아, 신발!", "The code is here. Oh, your shoes!", "A senha está aqui. Ah, os sapatos!"]
  - [protagonist, "아, 죄송합니다.", "Oh, I'm sorry.", "Ah, desculpe."]
  - [minjun, "안녕하세요. 옆집 사람이에요.", "Hello. I live next door.", "Olá. Sou o vizinho do lado."]
  - [protagonist, "아, 안녕하세요. 반가워요.", "Oh, hello. Glad to meet you.", "Ah, olá. Prazer."]
teach:
  - note: ["'여기가 방이에요': here is the room. 이/가 marks who or what the sentence is about doing or being: 방이, 화장실이 after a consonant; 여기가 after a vowel.", "'여기가 방이에요': aqui é o quarto. 이/가 marca o sujeito: 방이, 화장실이 depois de consoante; 여기가 depois de vogal."]
  - ask: ["Say: this is the room.", "Diga: aqui é o quarto.", "여기가 방이에요.", yeogi, i-ga, bang]
  - build: [eodiyeyo, ["-디예요?", "어디예요?"]]
  - ask: ["Ask where the bathroom is.", "Pergunte onde é o banheiro.", "화장실이 어디예요?", hwajangsil, eodiyeyo]
  - note: ["'있어요' says where something is: 화장실이 저기 있어요, the bathroom is over there.", "'있어요' diz onde algo fica: 화장실이 저기 있어요, o banheiro fica ali."]
  - ask: ["Say that the bathroom is over there.", "Diga que o banheiro fica ali.", "화장실이 저기 있어요.", hwajangsil, jeogi, isseoyo]
  - note: ["Between two nouns, 'and' is 과 after a consonant and 와 after a vowel: 침대와 책상, 책상과 침대. In talk people often say 하고.", "Entre dois substantivos, 'e' é 과 depois de consoante e 와 depois de vogal: 침대와 책상, 책상과 침대. Na fala se usa muito 하고."]
  - ask: ["Say: the bed and the desk are here.", "Diga: a cama e a escrivaninha ficam aqui.", "침대와 책상이 여기 있어요.", chimdae, gwa-wa, chaeksang]
  - ask: ["Ask what the door code is.", "Pergunte qual é a senha da porta.", "비밀번호가 뭐예요?", bimilbeonho]
  - note: ["Korean flats open with a code, not a key. And shoes stay at the entrance, on the lower step.", "Os apartamentos coreanos abrem com senha, não com chave. E os sapatos ficam na entrada, no degrau mais baixo."]
  - ask: ["You stepped in with your shoes on. Apologise formally.", "Você entrou de sapato. Peça desculpas de modo formal.", "죄송합니다.", joesonghamnida]
  - ask: ["Say: the shoes are here.", "Diga: os sapatos estão aqui.", "신발이 여기 있어요.", sinbal]
  - ask: ["Introduce yourself to a new neighbour: you live next door.", "Apresente-se a um vizinho novo: você mora ao lado.", "옆집 사람이에요.", yeopjip]
  - pt_only: "Em muitas casas brasileiras também se tira o sapato, mas na Coreia é regra em toda casa — entrar calçado é uma falta séria."
