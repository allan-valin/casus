id: A1-18
protagonist: m
title: [Food and cooking, Comida e cozinha]
situation: ["Mrs Park finds you cooking ramyeon the wrong way and shows you how Koreans make it.", "A senhora Park pega você cozinhando 라면 do jeito errado e mostra como os coreanos fazem."]
learn: [ko-and-but, ko-nikl-27]
culture: Ramyeon, a national comfort food
items:
  - [kkeuryeoyo, "끓여요", "boil (something)", "ferve (algo)"]
  - [mul2, "물을 넣어요", "put in the water", "põe a água"]
  - [sogeum, "소금", "salt", "sal"]
  - [gyeran, "계란", "egg", "ovo"]
  - [pa, "파", "spring onion", "cebolinha"]
  - [jiman, "-지만", "but", "mas"]
  - [go2, "-고", "and, then", "e, e depois"]
  - [meonjeo, "먼저", "first", "primeiro"]
  - [geu-daeum, "그다음에", "after that", "depois disso"]
  - [bul, "불", "heat, fire", "fogo"]
  - [sseoyo, "써요", "is bitter / uses", "é amargo / usa"]
  - [an-dwaeyo, "안 돼요", "you mustn't, no way", "não pode"]
dialogue:
  - [park, "아이고, 그렇게 안 돼요!", "Oh dear, not like that!", "Ai, assim não!"]
  - [protagonist, "왜요? 라면이 맛없어요?", "Why? Is the ramyeon bad?", "Por quê? O lámen fica ruim?"]
  - [park, "먼저 물을 끓여요. 그다음에 면을 넣어요.", "First boil the water. After that put in the noodles.", "Primeiro ferva a água. Depois ponha o macarrão."]
  - [protagonist, "물이 차갑지만 괜찮아요?", "The water is cold, but is that OK?", "A água está fria, mas tudo bem?"]
  - [park, "안 돼요. 물을 끓이고 수프를 넣어요.", "No. Boil the water and add the soup powder.", "Não. Ferva a água e ponha o tempero."]
  - [protagonist, "소금도 넣어요?", "Do I add salt too?", "Ponho sal também?"]
  - [park, "아니요, 소금은 안 넣어요. 계란하고 파를 넣어요.", "No, no salt. Add an egg and spring onion.", "Não, sal não. Ponha um ovo e cebolinha."]
  - [protagonist, "와, 맛있어요! 간단하지만 정말 맛있어요.", "Wow, delicious! Simple but really tasty.", "Nossa, que gostoso! Simples, mas muito bom."]
teach:
  - ask: ["Say: first, boil the water.", "Diga: primeiro, ferva a água.", "먼저 물을 끓여요.", meonjeo, kkeuryeoyo]
  - ask: ["Say: after that, put in the noodles.", "Diga: depois, ponha o macarrão.", "그다음에 면을 넣어요.", geu-daeum, mul2]
  - note: ["-고 joins steps in order: 물을 끓이고 수프를 넣어요, boil the water and (then) add the soup.", "-고 liga passos em ordem: 물을 끓이고 수프를 넣어요, ferva a água e (depois) ponha o tempero."]
  - ask: ["Say: boil the water and add the soup powder.", "Diga: ferva a água e ponha o tempero.", "물을 끓이고 수프를 넣어요.", go2]
  - note: ["-지만 is 'but': 간단하다 → 간단하지만, 'simple, but…'.", "-지만 é 'mas': 간단하다 → 간단하지만, 'simples, mas…'."]
  - ask: ["Say: simple but really tasty.", "Diga: simples, mas muito gostoso.", "간단하지만 정말 맛있어요.", jiman]
  - ask: ["Ask if you add salt too.", "Pergunte se põe sal também.", "소금도 넣어요?", sogeum]
  - ask: ["Say: add an egg and spring onion.", "Diga: ponha um ovo e cebolinha.", "계란하고 파를 넣어요.", gyeran, pa]
  - ask: ["She stops you: not like that! How?", "Ela impede você: assim não! Como?", "그렇게 안 돼요!", an-dwaeyo]
  - ask: ["Say: turn up the heat.", "Diga: aumente o fogo.", "불을 세게 해요.", bul]
  - ask: ["Say the coffee is bitter.", "Diga que o café é amargo.", "커피가 써요.", sseoyo]
  - pt_only: "O lámen instantâneo é comida de conforto na Coreia — cada família tem seu jeito: ovo, cebolinha, queijo. Ninguém põe sal: o tempero já é salgado."
