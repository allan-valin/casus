id: A2-26
protagonist: m
title: ["The confession", "A confissão"]
situation: ["Minjun likes a girl from his futsal team. He explains 썸 (the 'something' before dating) and 고백, the confession before a couple begins.", "O Minjun gosta de uma menina do time de futsal. Ele explica o 썸 (o 'algo' antes de namorar) e o 고백, a declaração antes de virar casal."]
learn: [ko-nikl-35, ko-nikl-74]
culture: Confessing before dating
items:
  - [gobaek, "고백", "confession (of love)", "declaração (de amor)"]
  - [joahae, "좋아해", "I like you (casual)", "gosto de você (informal)"]
  - [sagwija, "사귀자", "let's go out (casual)", "vamos namorar (informal)"]
  - [sseom, "썸", "something going on (before dating)", "um 'lance' (antes de namorar)"]
  - [eulkka2, "-(으)ㄹ까?", "shall I…? (casual, wondering)", "será que…? (informal)"]
  - [haelkka, "고백할까?", "should I confess? (casual)", "será que me declaro? (informal)"]
  - [tteollyeo, "떨려", "I'm nervous (casual)", "estou nervoso (informal)"]
  - [yonggi, "용기", "courage", "coragem"]
  - [maeum, "마음", "heart, feelings", "coração, sentimentos"]
  - [yeonae, "연애", "dating, romance", "namoro, romance"]
  - [jonghyeong, "직접 말해", "tell her yourself (casual)", "fala direto com ela (informal)"]
  - [ganghae, "잘될 거야", "it'll go well (casual)", "vai dar certo (informal)"]
dialogue:
  - [minjun, "형, 나 좋아하는 사람 생겼어.", "Hyung, I've got someone I like.", "Hyung, estou gostando de alguém."]
  - [protagonist, "진짜? 누구야? 사귀어?", "Really? Who? Are you going out?", "Sério? Quem? Vocês namoram?"]
  - [minjun, "아직 아니야. 썸이야. 풋살 팀 친구야.", "Not yet. It's 'something'. A friend from the futsal team.", "Ainda não. É um 썸. Uma amiga do time de futsal."]
  - [protagonist, "썸이 뭐야?", "What's 'sseom'?", "O que é 썸?"]
  - [minjun, "사귀기 전에 서로 마음이 있는 거야. 그래서 고백해야 돼.", "When you like each other before dating. So you have to confess.", "Quando um gosta do outro antes de namorar. Por isso tem que se declarar."]
  - [protagonist, "브라질에는 고백이 없어. 그냥 사귀게 돼.", "In Brazil there's no confession. You just end up dating.", "No Brasil não tem declaração. A gente simplesmente acaba namorando."]
  - [minjun, "신기하다! 그럼 나 고백할까? 너무 떨려.", "Interesting! So should I confess? I'm so nervous.", "Que curioso! Então, será que me declaro? Estou muito nervoso."]
  - [protagonist, "용기 내! 직접 말해. 잘될 거야.", "Be brave! Tell her yourself. It'll go well.", "Coragem! Fala direto com ela. Vai dar certo."]
teach:
  - ask: ["Casually: who? are you going out?", "Informal: quem? vocês namoram?", "누구야? 사귀어?", sagwija]
  - ask: ["Say: it's 'something' (not dating yet).", "Diga: é um 썸 (ainda não namoram).", "썸이에요.", sseom]
  - note: ["In Korea dating often starts with a 고백, a confession: 좋아해, 사귀자 — I like you, let's go out.", "Na Coreia o namoro costuma começar com um 고백, uma declaração: 좋아해, 사귀자 — gosto de você, vamos namorar."]
  - ask: ["Casually: I like you. Let's go out.", "Informal: gosto de você. Vamos namorar.", "좋아해. 사귀자.", joahae, sagwija]
  - ask: ["Say: a confession.", "Diga: uma declaração.", "고백", gobaek]
  - note: ["-게 되다 again: 사귀다 → 사귀게 돼, you end up dating (it just happens).", "-게 되다 de novo: 사귀다 → 사귀게 돼, você acaba namorando (acontece)."]
  - ask: ["Casually: in Brazil you just end up dating.", "Informal: no Brasil a gente acaba namorando.", "브라질에서는 그냥 사귀게 돼.", yeonae]
  - note: ["-(으)ㄹ까? alone, casually: wondering aloud: 고백할까?, should I confess?", "-(으)ㄹ까? sozinho, informal: pensando alto: 고백할까?, será que me declaro?"]
  - ask: ["Wonder aloud, casually: should I confess?", "Pense alto, informal: será que me declaro?", "고백할까?", haelkka, eulkka2]
  - ask: ["Casually: I'm so nervous.", "Informal: estou muito nervoso.", "너무 떨려.", tteollyeo]
  - ask: ["Encourage him: be brave!", "Encoraje: coragem!", "용기 내!", yonggi]
  - ask: ["Casually: tell her yourself.", "Informal: fala direto com ela.", "직접 말해.", jonghyeong]
  - ask: ["Casually: it'll go well.", "Informal: vai dar certo.", "잘될 거야.", ganghae]
  - ask: ["Say: they have feelings for each other.", "Diga: um gosta do outro.", "서로 마음이 있어요.", maeum]
  - pt_only: "No Brasil o namoro muitas vezes 'acontece' sem anúncio. Na Coreia há o 썸 — a fase do 'algo' — e depois o 고백, uma declaração clara; a partir daí se conta o 1일, o primeiro dia do casal."
