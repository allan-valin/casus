id: A2-09
protagonist: f
title: ["Money and percentages", "Dinheiro e porcentagem"]
situation: ["A cosmetics shop in Myeongdong with Seoyeon: 1+1 offers, 30% off, and a tax refund for foreigners.", "Uma loja de cosméticos em Myeongdong com a Seoyeon: promoções leve 2 pague 1, 30% de desconto e devolução de imposto para estrangeiros."]
learn: [ko-nikl-55, ko-nikl-56]
culture: 1+1 offers and tax refunds
items:
  - [halin, "할인", "discount", "desconto"]
  - [peosenteu, "퍼센트", "per cent", "por cento"]
  - [ballgap, "반값", "half price", "metade do preço"]
  - [manwon2, "만 오천 원", "15,000 won", "15 mil wons"]
  - [ina, "(이)나", "as many as (surprise) / or", "nada menos que / ou"]
  - [geona, "-거나", "or (between actions)", "ou (entre ações)"]
  - [wonplusone, "원 플러스 원", "buy one get one free (1+1)", "leve dois, pague um (1+1)"]
  - [hwangeup, "택스 리펀드", "tax refund", "devolução de imposto"]
  - [yeonggeug, "영수증 주세요", "the receipt, please", "o recibo, por favor"]
  - [deo-ssayo, "더 싸요", "is cheaper", "é mais barato"]
  - [gyesan, "계산해 주세요", "the bill, please / I'll pay", "pode passar, por favor"]
  - [segeum, "세금", "tax", "imposto"]
dialogue:
  - [seoyeon, "언니, 이거 원 플러스 원이에요!", "Unni, this is buy one get one free!", "Unni, isto é leve dois pague um!"]
  - [protagonist, "와, 그럼 반값이에요? 이 크림은 얼마예요?", "Wow, so it's half price? How much is this cream?", "Nossa, então é metade do preço? Quanto é este creme?"]
  - [seoyeon, "만 오천 원인데 삼십 퍼센트 할인해요.", "15,000 won, but it's 30% off.", "15 mil wons, mas tem 30% de desconto."]
  - [protagonist, "저 벌써 다섯 개나 샀어요!", "I've already bought as many as five!", "Já comprei nada menos que cinco!"]
  - [seoyeon, "하하. 외국인은 택스 리펀드도 받을 수 있어요. 여권 있어요?", "Haha. Foreigners can also get a tax refund. Do you have your passport?", "Haha. Estrangeiro também recebe devolução de imposto. Tem passaporte?"]
  - [protagonist, "외국인등록증이나 여권이 필요해요?", "Do I need the residence card or the passport?", "Preciso do cartão de residente ou do passaporte?"]
  - [seoyeon, "여권이요. 세금을 돌려받거나 더 싸게 사요.", "The passport. You get the tax back, or you pay less straight away.", "O passaporte. Você recebe o imposto de volta ou já paga menos."]
  - [protagonist, "좋아요! 계산해 주세요. 영수증도 주세요.", "Great! I'll pay, please. And the receipt.", "Ótimo! Pode passar. E o recibo, por favor."]
teach:
  - ask: ["Say: buy one get one free.", "Diga: leve dois, pague um.", "원 플러스 원", wonplusone]
  - ask: ["Ask: so it's half price?", "Pergunte: então é metade do preço?", "그럼 반값이에요?", ballgap]
  - ask: ["Say: 15,000 won, but 30% off.", "Diga: 15 mil wons, mas com 30% de desconto.", "만 오천 원인데 삼십 퍼센트 할인해요.", manwon2, peosenteu, halin]
  - note: ["(이)나 after a number shows surprise at how many: 다섯 개나, as many as five! Between nouns it is 'or': 외국인등록증이나 여권.", "(이)나 depois de um número mostra surpresa com a quantidade: 다섯 개나, nada menos que cinco! Entre substantivos é 'ou': 외국인등록증이나 여권."]
  - ask: ["Say you've already bought as many as five.", "Diga que já comprou nada menos que cinco.", "벌써 다섯 개나 샀어요!", ina]
  - ask: ["Ask: the residence card or the passport?", "Pergunte: o cartão de residente ou o passaporte?", "외국인등록증이나 여권이 필요해요?", ina]
  - note: ["-거나 is 'or' between actions: 돌려받거나 더 싸게 사요, you get it back or you pay less.", "-거나 é 'ou' entre ações: 돌려받거나 더 싸게 사요, recebe de volta ou paga menos."]
  - ask: ["Say: you get the tax back or pay less.", "Diga: recebe o imposto de volta ou paga menos.", "세금을 돌려받거나 더 싸게 사요.", geona, segeum]
  - ask: ["Say it's cheaper.", "Diga que é mais barato.", "더 싸요.", deo-ssayo]
  - ask: ["Say you'll pay.", "Diga que vai pagar.", "계산해 주세요.", gyesan]
  - ask: ["Ask for the receipt.", "Peça o recibo.", "영수증 주세요.", yeonggeug]
  - ask: ["Say foreigners get a tax refund.", "Diga que estrangeiros recebem devolução de imposto.", "외국인은 택스 리펀드를 받아요.", hwangeup]
  - pt_only: "1+1 (원 플러스 원) aparece em toda loja de conveniência e de cosméticos. Turistas recebem o imposto de volta com o passaporte — quem mora na Coreia, em geral, não."
