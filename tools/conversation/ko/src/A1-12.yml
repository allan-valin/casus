id: A1-12
protagonist: m
title: [Animals, Animais]
situation: ["Minjun takes you to a dog café in Mapo. There are dogs everywhere, but no cats.", "O Minjun leva você a um café de cachorros em Mapo. Há cachorros por toda parte, mas nenhum gato."]
learn: [ko-nikl-19]
culture: Animal cafés and small dogs in flats
items:
  - [gangaji, "강아지", "puppy, dog", "cachorrinho, cachorro"]
  - [goyangi, "고양이", "cat", "gato"]
  - [gwiyeowoyo, "귀여워요", "is cute", "é fofo"]
  - [isseoyo2, "있어요", "there is / I have", "tem / eu tenho"]
  - [eopseoyo, "없어요", "there isn't / I don't have", "não tem / eu não tenho"]
  - [boda, "보다", "than (comparing)", "do que (comparação)"]
  - [deo, "더", "more", "mais"]
  - [joahaeyo, "좋아해요", "likes / I like", "gosta / eu gosto"]
  - [jinjja-yo, "진짜요?", "Really? (polite)", "Sério? (educado)"]
  - [keoyo, "커요", "is big", "é grande"]
  - [jagayo, "작아요", "is small", "é pequeno"]
  - [mandjyeo-dwaeyo, "만져도 돼요?", "May I touch (it)?", "Posso tocar?"]
dialogue:
  - [minjun, "형, 여기가 강아지 카페예요.", "Hyung, this is the dog café.", "Hyung, aqui é o café de cachorros."]
  - [protagonist, "와, 강아지가 정말 많아요! 귀여워요.", "Wow, so many dogs! They're cute.", "Nossa, quantos cachorros! Que fofos."]
  - [minjun, "형은 강아지 좋아해요?", "Do you like dogs?", "Você gosta de cachorro?"]
  - [protagonist, "네, 그런데 고양이를 더 좋아해요. 고양이는 없어요?", "Yes, but I like cats more. Are there no cats?", "Gosto, mas gosto mais de gato. Não tem gato?"]
  - [minjun, "여기는 고양이가 없어요. 저는 고양이보다 강아지가 좋아요.", "There are no cats here. I like dogs more than cats.", "Aqui não tem gato. Eu gosto mais de cachorro do que de gato."]
  - [protagonist, "이 강아지는 작아요. 만져도 돼요?", "This dog is small. May I touch it?", "Este cachorro é pequeno. Posso tocar?"]
  - [minjun, "네, 돼요. 저 강아지는 커요!", "Yes, you can. That dog is big!", "Pode. Aquele cachorro é grande!"]
  - [protagonist, "진짜요? 브라질 강아지보다 작아요.", "Really? It's smaller than Brazilian dogs.", "Sério? É menor que os cachorros do Brasil."]
teach:
  - ask: ["Say that the dogs are cute.", "Diga que os cachorros são fofos.", "강아지가 귀여워요.", gangaji, gwiyeowoyo]
  - note: ["있어요 is 'there is' and 'I have'; 없어요 is the opposite. 고양이가 없어요: there are no cats.", "있어요 é 'tem' (existe, e 'eu tenho'); 없어요 é o contrário. 고양이가 없어요: não tem gato."]
  - build: [eopseoyo, ["-어요", "없어요"]]
  - ask: ["Ask if there are no cats.", "Pergunte se não tem gato.", "고양이는 없어요?", goyangi, eopseoyo]
  - ask: ["Say that there are dogs here.", "Diga que aqui tem cachorro.", "여기 강아지가 있어요.", isseoyo2]
  - note: ["보다 is 'than': 고양이보다 강아지가 좋아요 — dogs are better (to me) than cats. 더 adds 'more'.", "보다 é 'do que': 고양이보다 강아지가 좋아요 — gosto mais de cachorro do que de gato. 더 acrescenta 'mais'."]
  - ask: ["Say you like cats more.", "Diga que você gosta mais de gato.", "고양이를 더 좋아해요.", deo, joahaeyo]
  - ask: ["Say: I like dogs more than cats.", "Diga: gosto mais de cachorro do que de gato.", "고양이보다 강아지가 좋아요.", boda]
  - ask: ["Say: this dog is small.", "Diga: este cachorro é pequeno.", "이 강아지는 작아요.", jagayo]
  - ask: ["And that one is big.", "E aquele é grande.", "저 강아지는 커요.", keoyo]
  - ask: ["Ask if you may touch it.", "Pergunte se pode tocar.", "만져도 돼요?", mandjyeo-dwaeyo]
  - ask: ["React politely: really?", "Reaja com educação: sério?", "진짜요?", jinjja-yo]
  - pt_only: "Em Seul quase todo mundo mora em apartamento, por isso os cachorros costumam ser pequenos — e os cafés de animais são um passeio comum."
