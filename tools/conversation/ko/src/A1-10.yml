id: A1-10
protagonist: m
title: [Numbers, Números]
situation: ["The shop owner signs you up for the store's points card: he needs your phone number. You only have your card, no cash.", "O dono inscreve você no cartão de pontos da loja: precisa do seu telefone. Você só tem cartão, nada de dinheiro."]
learn: [ko-nikl-16, ko-numbers]
culture: Two number systems; 4 is avoided
items:
  - [il-i-sam, "일, 이, 삼", "one, two, three (Sino-Korean numbers)", "um, dois, três (números sino-coreanos)"]
  - [sa-o-yuk, "사, 오, 육", "four, five, six", "quatro, cinco, seis"]
  - [chil-pal-gu, "칠, 팔, 구, 십", "seven, eight, nine, ten", "sete, oito, nove, dez"]
  - [gong, "공", "zero (in phone numbers)", "zero (em telefones)"]
  - [jeonhwabeonho, "전화번호", "phone number", "número de telefone"]
  - [mwoyeyo, "뭐예요?", "What is it?", "O que é? / Qual é?"]
  - [baek, "백", "hundred", "cem"]
  - [cheon, "천", "thousand", "mil"]
  - [man-won, "만 원", "ten thousand won", "dez mil wons"]
  - [man, "만", "only (after a noun)", "só (depois de substantivo)"]
  - [kadeu, "카드", "card", "cartão"]
  - [hyeongeum, "현금", "cash", "dinheiro vivo"]
  - [dwaeyo, "돼요", "is OK / works", "pode / dá"]
dialogue:
  - [sajang, "전화번호가 뭐예요?", "What's your phone number?", "Qual é o seu telefone?"]
  - [protagonist, "공일공, 이삼사오, 육칠팔구예요.", "010-2345-6789.", "010-2345-6789."]
  - [sajang, "네, 좋아요. 라면 두 개, 삼천 원이에요.", "OK, good. Two noodles, three thousand won.", "Certo. Dois lámens, três mil wons."]
  - [protagonist, "죄송합니다. 카드만 있어요. 현금은 없어요.", "Sorry. I only have a card. No cash.", "Desculpe. Só tenho cartão. Dinheiro não tenho."]
  - [sajang, "괜찮아요. 카드 돼요.", "No problem. Cards are fine.", "Tudo bem. Aceita cartão."]
  - [protagonist, "이 우산은 얼마예요?", "How much is this umbrella?", "Quanto é este guarda-chuva?"]
  - [sajang, "만 원이에요.", "Ten thousand won.", "Dez mil wons."]
  - [protagonist, "만 원? 아, 비싸요… 라면만 주세요.", "Ten thousand? Oh, expensive… just the noodles, please.", "Dez mil? Ah, caro… só os lámens, por favor."]
teach:
  - note: ["Korean has two sets of numbers. For money, phone numbers, minutes and floors: 일, 이, 삼, 사, 오, 육, 칠, 팔, 구, 십. For age and counting things: 하나, 둘, 셋.", "O coreano tem dois conjuntos de números. Para dinheiro, telefone, minutos e andares: 일, 이, 삼, 사, 오, 육, 칠, 팔, 구, 십. Para idade e para contar coisas: 하나, 둘, 셋."]
  - ask: ["Count one, two, three — the Sino-Korean way.", "Conte um, dois, três — com os sino-coreanos.", "일, 이, 삼.", il-i-sam]
  - ask: ["Go on: four, five, six.", "Continue: quatro, cinco, seis.", "사, 오, 육.", sa-o-yuk]
  - ask: ["And: seven, eight, nine, ten.", "E: sete, oito, nove, dez.", "칠, 팔, 구, 십.", chil-pal-gu]
  - ask: ["He asks your phone number. How?", "Ele pergunta o seu telefone. Como?", "전화번호가 뭐예요?", jeonhwabeonho, mwoyeyo]
  - note: ["Phone numbers are read digit by digit, zero is 공: 010 is 공일공.", "Telefones se leem dígito a dígito, o zero é 공: 010 é 공일공."]
  - ask: ["Give the number 010-2345-6789.", "Diga o número 010-2345-6789.", "공일공, 이삼사오, 육칠팔구예요.", gong]
  - note: ["Money: 백 100, 천 1,000, 만 10,000. Korean counts in ten-thousands: 만 원, 10,000 won.", "Dinheiro: 백 100, 천 1.000, 만 10.000. O coreano conta de dez mil em dez mil: 만 원, 10.000 won."]
  - ask: ["Say: one hundred won.", "Diga: cem won.", "백 원.", baek]
  - ask: ["Say: three thousand won.", "Diga: três mil wons.", "삼천 원이에요.", cheon]
  - ask: ["Say: ten thousand won.", "Diga: dez mil wons.", "만 원이에요.", man-won]
  - note: ["A different 만 after a noun means 'only': 카드만 있어요, I only have a card. 라면만 주세요, only the noodles.", "Outro 만, depois de um substantivo, quer dizer 'só': 카드만 있어요, só tenho cartão. 라면만 주세요, só os lámens."]
  - ask: ["Say that you only have a card.", "Diga que só tem cartão.", "카드만 있어요.", man, kadeu]
  - ask: ["Say you have no cash.", "Diga que não tem dinheiro vivo.", "현금은 없어요.", hyeongeum]
  - ask: ["Ask if a card is OK.", "Pergunte se pode ser cartão.", "카드 돼요?", kadeu, dwaeyo]
  - ask: ["Ask for only the noodles.", "Peça só os lámens.", "라면만 주세요.", man]
  - note: ["4 (사) sounds like the word for 'death', so some buildings skip floor 4 or label it F.", "O 4 (사) soa como a palavra 'morte', então alguns prédios pulam o quarto andar ou o chamam de F."]
  - pt_only: "Como o nosso 13 no elevador, o 4 some em alguns prédios coreanos — e você vai ver o botão 'F'."
