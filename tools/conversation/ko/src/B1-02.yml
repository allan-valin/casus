id: B1-02
protagonist: m
title: ["What do you think?", "O que você acha?"]
situation: ["A year in Seoul. At lunch the team lead asks your honest opinion of the city: what's convenient, what's hard.", "Um ano em Seul. No almoço a líder pede sua opinião sincera sobre a cidade: o que é prático, o que é difícil."]
learn: [ko-nikl-133, ko-nikl-152, ko-nikl-97]
culture: Giving an opinion softly
items:
  - [je-saenggage, "제 생각에는", "in my opinion", "na minha opinião"]
  - [pyeonhaeyo, "편해요", "is convenient, comfortable", "é prático, confortável"]
  - [bokjaphaeyo, "복잡해요", "is crowded, complicated", "é cheio, complicado"]
  - [neun-banmyeon, "-는 반면(에)", "whereas, on the other hand", "enquanto que, por outro lado"]
  - [neun-pyeon, "-는 편이다", "tend to, rather", "costuma, é meio"]
  - [ppun, "뿐", "only, just", "só, apenas"]
  - [anjeonhaeyo, "안전해요", "is safe", "é seguro"]
  - [bissan-pyeon, "비싼 편이에요", "it's on the expensive side", "é meio caro"]
  - [gyotong2, "교통", "transport, traffic", "transporte, trânsito"]
  - [solijikhi, "솔직히", "honestly", "sinceramente"]
  - [manjokhaeyo, "만족해요", "I'm satisfied", "estou satisfeito"]
  - [eotteoke-saenggak, "어떻게 생각해요?", "What do you think?", "O que você acha?"]
dialogue:
  - [jieun, "서울에 온 지 일 년이네요. 서울을 어떻게 생각해요?", "It's been a year since you came to Seoul. What do you think of it?", "Faz um ano que você chegou a Seul. O que acha da cidade?"]
  - [protagonist, "제 생각에는 교통이 정말 편해요. 밤에도 안전하고요.", "In my opinion transport is really convenient. And it's safe at night.", "Na minha opinião o transporte é muito prático. E é seguro à noite."]
  - [jieun, "안 좋은 점은요? 솔직히 말해 주세요.", "And the bad points? Tell me honestly.", "E os pontos ruins? Diga com sinceridade."]
  - [protagonist, "솔직히 집값은 비싼 편이에요. 그리고 지하철이 복잡해요.", "Honestly, housing is on the expensive side. And the subway is crowded.", "Sinceramente, a moradia é meio cara. E o metrô é lotado."]
  - [jieun, "맞아요. 서울은 편한 반면에 좀 바빠요.", "True. Seoul is convenient, but on the other hand a bit hectic.", "É verdade. Seul é prática, mas por outro lado um pouco corrida."]
  - [protagonist, "그래도 저는 만족해요. 불만은 하나뿐이에요.", "Still, I'm satisfied. I have only one complaint.", "Mesmo assim estou satisfeito. Só tenho uma reclamação."]
  - [jieun, "뭐예요?", "What is it?", "Qual?"]
  - [protagonist, "겨울이 너무 추워요! 브라질 사람한테는요.", "The winter is too cold! For a Brazilian, anyway.", "O inverno é frio demais! Para um brasileiro, pelo menos."]
teach:
  - ask: ["Ask what he thinks.", "Pergunte o que ele acha.", "어떻게 생각해요?", eotteoke-saenggak]
  - ask: ["Say: in my opinion, transport is convenient.", "Diga: na minha opinião, o transporte é prático.", "제 생각에는 교통이 편해요.", je-saenggage, pyeonhaeyo, gyotong2]
  - ask: ["Say: it's safe at night.", "Diga: é seguro à noite.", "밤에도 안전해요.", anjeonhaeyo]
  - note: ["-는 편이다 softens: 'rather, on the … side': 비싸다 → 비싼 편이에요, it's on the expensive side.", "-는 편이다 suaviza: 'meio, um tanto': 비싸다 → 비싼 편이에요, é meio caro."]
  - ask: ["Say honestly: housing is on the expensive side.", "Diga com sinceridade: a moradia é meio cara.", "솔직히 집값은 비싼 편이에요.", solijikhi, bissan-pyeon, neun-pyeon]
  - ask: ["Say: the subway is crowded.", "Diga: o metrô é lotado.", "지하철이 복잡해요.", bokjaphaeyo]
  - note: ["-(으)ㄴ/는 반면(에) sets two sides against each other: 편한 반면에 바빠요, convenient, but on the other hand hectic.", "-(으)ㄴ/는 반면(에) contrapõe dois lados: 편한 반면에 바빠요, prática, mas por outro lado corrida."]
  - ask: ["Say: Seoul is convenient, but on the other hand hectic.", "Diga: Seul é prática, mas por outro lado corrida.", "서울은 편한 반면에 바빠요.", neun-banmyeon]
  - note: ["뿐 is 'only': 하나뿐이에요, it's only one.", "뿐 é 'só': 하나뿐이에요, é só uma."]
  - ask: ["Say: I have only one complaint.", "Diga: só tenho uma reclamação.", "불만은 하나뿐이에요.", ppun]
  - ask: ["Say you're satisfied.", "Diga que está satisfeito.", "만족해요.", manjokhaeyo]
  - pt_only: "Coreanos costumam dar opinião com suavidade: '제 생각에는…', '…는 편이에요'. Uma crítica direta demais soa rude — como no Brasil, só que com mais cuidado ainda com o chefe."
