id: A2-10
protagonist: m
title: ["A blind date", "Um encontro arranjado"]
situation: ["A colleague set you up on a sogaeting, a blind date. A café in Hapjeong; her name is Hana.", "Uma colega arranjou um 소개팅, um encontro às cegas. Um café em Hapjeong; o nome dela é Hana."]
learn: [ko-background, ko-nikl-71, ko-nikl-77]
culture: Sogaeting — dates arranged by friends
items:
  - [sogaeting, "소개팅", "blind date (arranged by friends)", "encontro arranjado (por amigos)"]
  - [yeollakcheo, "연락처", "contact (number)", "contato (telefone)"]
  - [maeume, "마음에 들어요", "I like (it / him / her)", "gostei"]
  - [neunde, "-는데 / -(으)ㄴ데", "and so, but (background)", "e, mas (contexto)"]
  - [neun-geot-gatayo, "-는 것 같아요", "it seems, I think", "parece, acho que"]
  - [cheoeum-boepgesseoyo, "처음 뵙겠습니다", "nice to meet you (formal)", "muito prazer (formal)", {register: formal}]
  - [chwimi, "취미가 뭐예요?", "What are your hobbies?", "Quais são seus hobbies?"]
  - [yeonghwa, "영화 보는 거 좋아해요", "I like watching films", "gosto de ver filmes"]
  - [dasi-mannal, "또 만날 수 있어요?", "Can we meet again?", "Podemos nos ver de novo?"]
  - [baraeda-julgeyo, "바래다줄게요", "I'll walk you (home)", "vou te acompanhar"]
  - [jaemiisseonneyo, "재미있었어요", "it was fun", "foi divertido"]
  - [dayaehan, "착한 것 같아요", "(she) seems kind", "(ela) parece gentil"]
dialogue:
  - [hana, "안녕하세요, 저는 김하나예요. 처음 뵙겠습니다.", "Hello, I'm Kim Hana. Nice to meet you.", "Olá, eu sou Kim Hana. Muito prazer."]
  - [protagonist, "반가워요. 지은 씨한테서 이야기 많이 들었어요.", "Glad to meet you. I've heard a lot about you from Jieun.", "Prazer. Ouvi falar muito de você pela Jieun."]
  - [hana, "브라질에서 오셨는데 한국어를 정말 잘하시네요!", "You came from Brazil, but your Korean is really good!", "Você veio do Brasil, mas fala coreano muito bem!"]
  - [protagonist, "아니에요. 아직 많이 배워야 돼요. 취미가 뭐예요?", "Not at all. I still have a lot to learn. What are your hobbies?", "Que nada. Ainda tenho muito que aprender. Quais são seus hobbies?"]
  - [hana, "영화 보는 거 좋아해요. 주말에 자주 봐요.", "I like watching films. I often watch them at weekends.", "Gosto de ver filmes. Vejo muito nos fins de semana."]
  - [protagonist, "저도요! 이번 주에 좋은 영화가 나온 것 같아요.", "Me too! I think a good film just came out this week.", "Eu também! Acho que saiu um filme bom esta semana."]
  - [hana, "그럼 다음에 같이 볼까요? 연락처 알려 주세요.", "Then shall we see it together next time? Give me your number.", "Então vamos ver juntos da próxima vez? Me passa seu contato."]
  - [protagonist, "네, 좋아요! 오늘 정말 재미있었어요.", "Yes, great! Today was really fun.", "Claro! Hoje foi muito divertido."]
teach:
  - ask: ["Say: a blind date set up by friends.", "Diga: um encontro arranjado por amigos.", "소개팅", sogaeting]
  - ask: ["Greet her formally the first time.", "Cumprimente-a formalmente na primeira vez.", "처음 뵙겠습니다.", cheoeum-boepgesseoyo]
  - note: ["-는데 / -(으)ㄴ데 gives background before the main point: 브라질에서 오셨는데…, you came from Brazil, and (yet)…", "-는데 / -(으)ㄴ데 dá o contexto antes do principal: 브라질에서 오셨는데…, você veio do Brasil, e (mesmo assim)…"]
  - ask: ["Say: you came from Brazil, but your Korean is good.", "Diga: você veio do Brasil, mas fala bem coreano.", "브라질에서 왔는데 한국어를 잘해요.", neunde]
  - ask: ["Ask her hobbies.", "Pergunte os hobbies dela.", "취미가 뭐예요?", chwimi]
  - ask: ["Say you like watching films.", "Diga que gosta de ver filmes.", "영화 보는 거 좋아해요.", yeonghwa]
  - note: ["-는 것 같아요 softens: 'it seems, I think': 나온 것 같아요, I think it came out; 착한 것 같아요, she seems kind.", "-는 것 같아요 suaviza: 'parece, acho que': 나온 것 같아요, acho que saiu; 착한 것 같아요, ela parece gentil."]
  - ask: ["Say: I think a good film came out.", "Diga: acho que saiu um filme bom.", "좋은 영화가 나온 것 같아요.", neun-geot-gatayo]
  - ask: ["Tell a friend: she seems kind.", "Diga a um amigo: ela parece gentil.", "착한 것 같아요.", dayaehan]
  - ask: ["Say you like her (she's to your liking).", "Diga que gostou dela.", "마음에 들어요.", maeume]
  - ask: ["Ask for her contact.", "Peça o contato dela.", "연락처 알려 주세요.", yeollakcheo]
  - ask: ["Ask if you can meet again.", "Pergunte se podem se ver de novo.", "또 만날 수 있어요?", dasi-mannal]
  - ask: ["Say it was fun today.", "Diga que hoje foi divertido.", "오늘 재미있었어요.", jaemiisseonneyo]
  - ask: ["Offer to walk her home.", "Ofereça-se para acompanhá-la.", "바래다줄게요.", baraeda-julgeyo]
  - pt_only: "O 소개팅 é muito comum: amigos ou colegas apresentam duas pessoas solteiras num café. No primeiro encontro se fala em 해요체 — o 반말 vem depois, se der certo."
