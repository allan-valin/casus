id: A1-11
protagonist: f
title: [Both hands, Duas mãos]
situation: ["You pay the rent to Mrs Park. She gives you the receipt and a bag of side dishes for Minjun.", "Você paga o aluguel à senhora Park. Ela entrega o recibo e uma sacola de 반찬 para o Minjun."]
learn: [ko-nikl-18, ko-nikl-17]
culture: Giving and receiving with both hands to an elder
items:
  - [yeogi-isseoyo, "여기 있어요", "Here you are", "Aqui está"]
  - [batuseyo, "받으세요", "Please take it (polite)", "Tome, por favor (educado)"]
  - [wolse, "월세", "monthly rent", "aluguel mensal"]
  - [yeongsujeung, "영수증", "receipt", "recibo"]
  - [hante, "한테", "to (a person; in talk)", "para (uma pessoa; na fala)"]
  - [jeonhae-juseyo, "전해 주세요", "Please pass it on", "Entregue, por favor"]
  - [banchan, "반찬", "side dishes", "acompanhamentos (반찬)"]
  - [ida, "이다 / 이에요", "to be (X is Y)", "ser (X é Y)"]
  - [geureomyo, "그럼요", "Of course", "Claro"]
  - [yangson, "양손으로", "with both hands", "com as duas mãos"]
  - [jal-meokgesseumnida, "잘 먹겠습니다", "Thank you for the food (before eating)", "Obrigado pela comida (antes de comer)", {register: formal}]
  - [mueoseyo, "뭐예요?", "What is it?", "O que é?"]
dialogue:
  - [protagonist, "할머니, 월세예요. 여기 있어요.", "Grandma, it's the rent. Here you are.", "Vovó, é o aluguel. Aqui está."]
  - [park, "아이고, 고마워요. 영수증 받으세요.", "Oh, thank you. Take the receipt.", "Ah, obrigada. Tome o recibo."]
  - [protagonist, "감사합니다.", "Thank you.", "Obrigada."]
  - [park, "그리고 이거, 민준이한테 전해 주세요.", "And this — please give it to Minjun.", "E isto, entregue ao Minjun, por favor."]
  - [protagonist, "이게 뭐예요?", "What is it?", "O que é isso?"]
  - [park, "반찬이에요. 김치랑 나물이에요.", "Side dishes. Kimchi and seasoned greens.", "São 반찬. Kimchi e verduras temperadas."]
  - [protagonist, "그럼요, 전해 줄게요.", "Of course, I'll give it to him.", "Claro, eu entrego."]
  - [park, "이건 학생 거예요. 맛있게 먹어요!", "And this one is yours. Enjoy it!", "E este é seu. Bom apetite!"]
  - [protagonist, "와, 잘 먹겠습니다!", "Wow, thank you for the food!", "Nossa, obrigada pela comida!"]
teach:
  - note: ["To an elder you hand things with both hands, or the right hand with the left touching your arm. With it: 여기 있어요, 'here you are'.", "Para uma pessoa mais velha, entregue com as duas mãos, ou com a direita e a esquerda tocando o braço. Junto: 여기 있어요, 'aqui está'."]
  - ask: ["Hand over the rent: here you are.", "Entregue o aluguel: aqui está.", "월세예요. 여기 있어요.", wolse, yeogi-isseoyo]
  - ask: ["Say: with both hands.", "Diga: com as duas mãos.", "양손으로", yangson]
  - build: [batuseyo, ["-으세요", "받으세요"]]
  - ask: ["She gives you the receipt. How did she say 'take it'?", "Ela dá o recibo. Como ela disse 'tome'?", "영수증 받으세요.", yeongsujeung, batuseyo]
  - note: ["이에요 is the polite form of 이다, 'to be': 반찬이다 in a dictionary, 반찬이에요 when you speak.", "이에요 é a forma educada de 이다, 'ser': 반찬이다 no dicionário, 반찬이에요 quando você fala."]
  - ask: ["Ask what this is.", "Pergunte o que é isso.", "이게 뭐예요?", mueoseyo]
  - ask: ["Say: they are side dishes.", "Diga: são acompanhamentos.", "반찬이에요.", banchan, ida]
  - note: ["한테 is 'to' a person, in talk; 에게 says the same in writing. With friends' names: 민준이한테.", "한테 é 'para' uma pessoa, na fala; 에게 diz o mesmo por escrito. Com nome de amigo: 민준이한테."]
  - ask: ["Ask her to give it to Minjun.", "Peça para entregar ao Minjun.", "민준 씨한테 전해 주세요.", hante, jeonhae-juseyo]
  - ask: ["She asks you to take it to him. Say: of course.", "Ela pede que você leve. Diga: claro.", "그럼요.", geureomyo]
  - note: ["Before eating food someone gave or cooked: 잘 먹겠습니다, 'I will eat well'.", "Antes de comer o que alguém deu ou cozinhou: 잘 먹겠습니다, 'vou comer bem'."]
  - ask: ["Thank her for the food, before eating.", "Agradeça a comida, antes de comer.", "잘 먹겠습니다!", jal-meokgesseumnida]
  - pt_only: "No Brasil ninguém repara se você entrega o dinheiro com uma mão. Na Coreia, para quem é mais velho, as duas mãos são respeito — e a comida dada de presente é agradecida com 잘 먹겠습니다."
