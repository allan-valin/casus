id: A1-21
protagonist: f
title: ["Plants", "Plantas"]
situation: ["A sunny Sunday at Hangang Park with Seoyeon. People are cycling, flowers are coming out by the river.", "Um domingo de sol no parque Hangang com a Seoyeon. Gente andando de bicicleta, flores abrindo à beira do rio."]
learn: [ko-nikl-32, ko-nikl-39]
culture: Hangang parks — picnics, bikes, fried chicken delivered to the riverbank
items:
  - [namu, "나무", "tree", "árvore"]
  - [kkot, "꽃", "flower", "flor"]
  - [gongwon, "공원", "park", "parque"]
  - [gang, "강", "river", "rio"]
  - [e-isseoyo, "-에 있어요", "is (located) at", "fica em"]
  - [go-isseoyo, "-고 있어요", "is …-ing", "está …-ndo"]
  - [jajeongeo, "자전거", "bicycle", "bicicleta"]
  - [tayo, "타요", "ride, get on", "anda (de), sobe"]
  - [pieoyo, "피어요", "bloom", "floresce"]
  - [anjeuseyo, "앉으세요", "Please sit down", "Sente-se, por favor"]
  - [yeppeuda, "예쁘다", "pretty (dictionary form)", "bonito (forma de dicionário)"]
  - [sajin, "사진 찍어요", "take a photo", "tira uma foto"]
dialogue:
  - [seoyeon, "언니, 여기가 한강 공원이에요. 여기 앉으세요.", "Unni, this is Hangang Park. Sit here.", "Unni, aqui é o parque Hangang. Sente aqui."]
  - [protagonist, "와, 강이 정말 넓어요! 사람들이 자전거를 타고 있어요.", "Wow, the river is so wide! People are riding bikes.", "Nossa, o rio é largo! As pessoas estão andando de bicicleta."]
  - [seoyeon, "네, 주말에는 사람이 많아요. 저기 꽃 보세요!", "Yes, it's busy at weekends. Look at the flowers there!", "Sim, no fim de semana tem muita gente. Olha as flores ali!"]
  - [protagonist, "꽃이 피고 있어요. 무슨 꽃이에요?", "The flowers are coming out. What flowers are they?", "As flores estão abrindo. Que flor é?"]
  - [seoyeon, "벚꽃이에요. 봄에 피어요.", "Cherry blossoms. They bloom in spring.", "Flor de cerejeira. Abre na primavera."]
  - [protagonist, "나무도 많아요. 화장실은 어디에 있어요?", "There are lots of trees too. Where are the toilets?", "Tem muita árvore também. Onde fica o banheiro?"]
  - [seoyeon, "편의점 옆에 있어요. 언니, 사진 찍어요!", "Next to the convenience store. Unni, let's take a photo!", "Do lado da loja de conveniência. Unni, vamos tirar uma foto!"]
  - [protagonist, "좋아요. 하나, 둘, 셋!", "OK. One, two, three!", "Tá bom. Um, dois, três!"]
teach:
  - note: ["-(으)세요 asks politely: 앉다 → 앉으세요, please sit; 보다 → 보세요, look.", "-(으)세요 pede com educação: 앉다 → 앉으세요, sente-se; 보다 → 보세요, olhe."]
  - build: [anjeuseyo, ["-으세요", "앉으세요"]]
  - ask: ["Ask a guest to sit down.", "Peça para uma visita se sentar.", "여기 앉으세요.", anjeuseyo]
  - ask: ["Say: this is a park.", "Diga: aqui é um parque.", "여기는 공원이에요.", gongwon]
  - ask: ["Say: the river is wide.", "Diga: o rio é largo.", "강이 넓어요.", gang]
  - note: ["-고 있어요 is '…-ing' now: 타다 → 타고 있어요, is riding.", "-고 있어요 é '…-ndo' agora: 타다 → 타고 있어요, está andando."]
  - ask: ["Say: people are riding bikes.", "Diga: as pessoas estão andando de bicicleta.", "사람들이 자전거를 타고 있어요.", jajeongeo, tayo, go-isseoyo]
  - ask: ["Say: the flowers are coming out.", "Diga: as flores estão abrindo.", "꽃이 피고 있어요.", kkot, pieoyo]
  - ask: ["Say there are many trees.", "Diga que tem muita árvore.", "나무가 많아요.", namu]
  - note: ["Where something is: place + 에 있어요. 편의점 옆에 있어요: it's next to the store.", "Onde algo fica: lugar + 에 있어요. 편의점 옆에 있어요: fica do lado da loja."]
  - ask: ["Ask where the toilets are.", "Pergunte onde fica o banheiro.", "화장실은 어디에 있어요?", e-isseoyo]
  - ask: ["Suggest taking a photo.", "Sugira tirar uma foto.", "사진 찍어요!", sajin]
  - ask: ["Give the dictionary form of 'pretty'.", "Diga a forma de dicionário de 'bonito'.", "예쁘다", yeppeuda]
  - pt_only: "Nos parques do rio Han as pessoas fazem piquenique, andam de bicicleta e pedem frango frito entregue na grama — o 배달 chega até a beira do rio."
