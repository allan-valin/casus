id: B1-01
protagonist: f
title: ["The jjimjilbang", "O 찜질방"]
situation: ["Sunday at a jjimjilbang, the Korean bathhouse, with Minjun's family: hot rooms, sweet rice drink, towels folded into 'sheep heads'.", "Domingo num 찜질방, a casa de banho coreana, com a família do Minjun: salas quentes, bebida doce de arroz, toalhas dobradas em 'cabeça de carneiro'."]
learn: [ko-nikl-91, ko-nikl-146, ko-nikl-154]
culture: The jjimjilbang — sweating together, eating eggs, sleeping on the floor
items:
  - [jjimjilbang, "찜질방", "Korean bathhouse with hot rooms", "casa de banho coreana com salas quentes"]
  - [sikhye, "식혜", "sweet rice drink", "bebida doce de arroz"]
  - [ttam, "땀", "sweat", "suor"]
  - [yangmeori, "양머리", "towel 'sheep head'", "toalha 'cabeça de carneiro'"]
  - [gachi-like, "같이 (after a noun)", "like (as)", "como (igual a)"]
  - [eojida, "-아/어지다", "become, get (more …)", "ficar (mais …)"]
  - [neun-jung, "-는 중이다", "be in the middle of …-ing", "estar no meio de …"]
  - [ttatteutaejyeoyo, "몸이 따뜻해져요", "your body warms up", "o corpo esquenta"]
  - [gu-gyeran, "구운 계란", "baked egg", "ovo assado"]
  - [hanjeungmak, "한증막", "the very hot dome room", "a sala quentíssima (cúpula)"]
  - [peojyeo, "뻗어", "stretch out (casual)", "estica (informal)"]
  - [sanghwa, "상쾌해", "refreshed (casual)", "revigorado (informal)"]
dialogue:
  - [minjun, "누나, 여기가 찜질방이야. 양머리 해 봐!", "Nuna, this is a jjimjilbang. Try the sheep-head towel!", "Nuna, isto é um 찜질방. Experimenta a toalha de carneiro!"]
  - [protagonist, "이렇게? 하하, 진짜 양같이 보여!", "Like this? Haha, I really look like a sheep!", "Assim? Haha, pareço mesmo um carneiro!"]
  - [minjun, "잘 어울려. 이제 한증막에 들어가자.", "It suits you. Now let's go into the hot dome.", "Combina com você. Agora vamos entrar na sala quente."]
  - [protagonist, "와, 사우나같이 뜨거워! 땀이 나.", "Wow, hot like a sauna! I'm sweating.", "Nossa, quente como sauna! Estou suando."]
  - [minjun, "조금 있으면 몸이 따뜻해지고 좋아져.", "After a while your body warms up and it feels good.", "Daqui a pouco o corpo esquenta e fica bom."]
  - [protagonist, "어머님은 어디 계셔?", "Where's your mother?", "Onde está sua mãe?"]
  - [minjun, "엄마는 지금 계란 먹는 중이야. 식혜도 마시자!", "Mum is eating eggs right now. Let's have sikhye too!", "A mãe está comendo ovo agora. Vamos tomar 식혜 também!"]
  - [protagonist, "좋아! 끝나고 나니까 정말 상쾌해.", "Great! Now that it's over I feel really refreshed.", "Ótimo! Agora que acabou me sinto revigorada."]
teach:
  - ask: ["Say: this is a jjimjilbang.", "Diga: isto é um 찜질방.", "여기가 찜질방이에요.", jjimjilbang]
  - ask: ["Say: try the sheep-head towel.", "Diga: experimente a toalha de carneiro.", "양머리 해 봐요.", yangmeori]
  - note: ["같이 after a noun is 'like': 양같이, like a sheep; 사우나같이 뜨거워, hot like a sauna.", "같이 depois de substantivo é 'como': 양같이, como carneiro; 사우나같이 뜨거워, quente como sauna."]
  - ask: ["Casually: hot like a sauna!", "Informal: quente como sauna!", "사우나같이 뜨거워!", gachi-like]
  - ask: ["Casually: I'm sweating.", "Informal: estou suando.", "땀이 나.", ttam]
  - note: ["-아/어지다 is 'become': 따뜻하다 → 따뜻해져요, gets warm; 좋다 → 좋아져요, gets better.", "-아/어지다 é 'ficar': 따뜻하다 → 따뜻해져요, esquenta; 좋다 → 좋아져요, melhora."]
  - ask: ["Say: your body warms up.", "Diga: o corpo esquenta.", "몸이 따뜻해져요.", ttatteutaejyeoyo, eojida]
  - note: ["-는 중이다 is 'in the middle of': 먹는 중이야, (she's) eating right now.", "-는 중이다 é 'no meio de': 먹는 중이야, (ela) está comendo agora."]
  - ask: ["Casually: mum is eating eggs right now.", "Informal: a mãe está comendo ovo agora.", "엄마는 계란 먹는 중이야.", neun-jung, gu-gyeran]
  - ask: ["Suggest drinking sikhye.", "Sugira tomar 식혜.", "식혜 마시자!", sikhye]
  - ask: ["Say: let's go into the hot dome.", "Diga: vamos entrar na sala quente.", "한증막에 들어가요.", hanjeungmak]
  - ask: ["Casually: I feel refreshed.", "Informal: me sinto revigorada.", "상쾌해.", sanghwa]
  - ask: ["Casually: stretch out on the floor.", "Informal: estica no chão.", "바닥에 뻗어.", peojyeo]
  - pt_only: "O 찜질방 é programa de família: salas quentes, ovo assado, 식혜 gelado, TV e gente dormindo no chão. Não tem nada parecido no Brasil — talvez um clube com sauna, mas aberto 24 horas."
