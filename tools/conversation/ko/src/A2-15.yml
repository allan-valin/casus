id: A2-15
protagonist: f
title: ["Music", "Música"]
situation: ["Mrs Park listens to trot on the radio while making side dishes. She explains the songs; you show her a Brazilian ballad.", "A senhora Park escuta trot no rádio enquanto faz 반찬. Ela explica as músicas; você mostra uma balada brasileira."]
learn: [ko-nikl-72, ko-nikl-68]
culture: Trot, the music of the older generation — now popular again
items:
  - [teuroteu, "트로트", "trot (Korean popular song)", "trot (canção popular coreana)"]
  - [balladeu, "발라드", "ballad", "balada (música lenta)"]
  - [gasa, "가사", "lyrics", "letra"]
  - [neyo, "-네요", "oh, … (noticing)", "nossa, … (percebendo)"]
  - [gunyo, "-군요", "I see, … (realising)", "ah, então… (percebendo)"]
  - [seulpeoyo, "슬퍼요", "is sad", "é triste"]
  - [sinnayo, "신나요", "is upbeat, exciting", "é animado"]
  - [radio, "라디오", "radio", "rádio"]
  - [gasu, "가수", "singer", "cantor, cantora"]
  - [yumyeonghaeyo, "유명해요", "is famous", "é famoso"]
  - [deureo-bwayo, "들어 봐요", "listen (try it)", "escuta (experimenta)"]
  - [ttara-bulleoyo, "따라 불러요", "sing along", "canta junto"]
dialogue:
  - [park, "이 노래 들어 봐. 트로트야.", "Listen to this song. It's trot.", "Escuta esta música. É trot."]
  - [protagonist, "와, 신나네요! 가수가 누구예요?", "Wow, it's upbeat! Who's the singer?", "Nossa, que animada! Quem é o cantor?"]
  - [park, "임영웅이야. 요즘 정말 유명해.", "Lim Young-woong. He's really famous these days.", "Lim Young-woong. Está muito famoso agora."]
  - [protagonist, "가사는 무슨 내용이에요?", "What are the lyrics about?", "A letra fala de quê?"]
  - [park, "엄마 이야기야. 조금 슬퍼.", "It's about a mother. A bit sad.", "Fala de mãe. É um pouco triste."]
  - [protagonist, "아, 그래서 할머니가 우시는군요.", "Oh, so that's why you're crying.", "Ah, por isso a senhora está chorando."]
  - [park, "하하, 아니야. 양파 때문이야! 학생 노래도 들려줘.", "Haha, no. It's the onions! Play me one of your songs.", "Haha, não. É a cebola! Me mostra uma música sua."]
  - [protagonist, "이건 브라질 발라드예요. 같이 따라 불러요!", "This is a Brazilian ballad. Let's sing along!", "Esta é uma balada brasileira. Vamos cantar junto!"]
teach:
  - ask: ["She asks you to listen. How, casually?", "Ela pede para você escutar. Como, informal?", "들어 봐.", deureo-bwayo]
  - ask: ["Say: it's trot.", "Diga: é trot.", "트로트예요.", teuroteu]
  - note: ["-네요 reacts to something you notice right now: 신나다 → 신나네요, oh, it's upbeat!", "-네요 reage a algo que você nota agora: 신나다 → 신나네요, nossa, que animada!"]
  - ask: ["React: oh, it's upbeat!", "Reaja: nossa, que animada!", "신나네요!", neyo, sinnayo]
  - ask: ["Ask who the singer is.", "Pergunte quem é o cantor.", "가수가 누구예요?", gasu]
  - ask: ["Say he's famous these days.", "Diga que ele está famoso agora.", "요즘 유명해요.", yumyeonghaeyo]
  - ask: ["Ask what the lyrics are about.", "Pergunte do que fala a letra.", "가사는 무슨 내용이에요?", gasa]
  - ask: ["Say the song is a bit sad.", "Diga que a música é um pouco triste.", "조금 슬퍼요.", seulpeoyo]
  - note: ["-군요 marks a realisation: 'I see, so…': 우시는군요, so that's why you're crying.", "-군요 marca uma constatação: 'ah, então…': 우시는군요, então a senhora está chorando."]
  - ask: ["Say: oh, so that's why you're crying (to an elder).", "Diga: ah, por isso a senhora está chorando.", "그래서 우시는군요.", gunyo]
  - ask: ["Say: this is a Brazilian ballad.", "Diga: esta é uma balada brasileira.", "브라질 발라드예요.", balladeu]
  - ask: ["Suggest singing along.", "Sugira cantar junto.", "같이 따라 불러요!", ttara-bulleoyo]
  - ask: ["Say she listens to the radio.", "Diga que ela escuta rádio.", "라디오를 들으세요.", radio]
  - pt_only: "O trot (트로트) é a música dos avós, com algo de sertanejo antigo; nos últimos anos voltou à moda com programas de TV, e cantores como Lim Young-woong lotam estádios."
