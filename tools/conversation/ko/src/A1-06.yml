id: A1-06
protagonist: m
title: ["The weather", "O tempo"]
situation: ["It is raining when you go out. Minjun, at the door, asks if you have an umbrella, and tells you about Seoul's summer and winter.", "Está chovendo quando você sai. O Minjun, na porta, pergunta se você tem guarda-chuva e conta como são o verão e o inverno de Seul."]
learn: [ko-nikl-7]
culture: Humid summers, hard winters, an umbrella from the convenience store
items:
  - [oneul, "오늘", "today", "hoje"]
  - [biga-wayo, "비가 와요", "It's raining", "Está chovendo"]
  - [nuni-wayo, "눈이 와요", "It's snowing", "Está nevando"]
  - [usan, "우산", "umbrella", "guarda-chuva"]
  - [eul-reul, "을/를", "object particle (을 after a consonant, 를 after a vowel)", "partícula de objeto (을 depois de consoante, 를 depois de vogal)"]
  - [sayo, "사요", "buys / I buy", "compra / eu compro"]
  - [deowoyo, "더워요", "is hot (weather)", "está quente (tempo)"]
  - [chuwoyo, "추워요", "is cold (weather)", "está frio (tempo)"]
  - [yeoreum, "여름", "summer", "verão"]
  - [gyeoul, "겨울", "winter", "inverno"]
  - [ttatteuthaeyo, "따뜻해요", "is warm", "está quente / é ameno"]
  - [jeongmal, "정말", "really", "muito / de verdade"]
  - [nalssi, "날씨", "weather", "o tempo (clima)"]
dialogue:
  - [minjun, "오늘 비가 와요. 우산 있어요?", "It's raining today. Do you have an umbrella?", "Hoje está chovendo. Você tem guarda-chuva?"]
  - [protagonist, "아니요, 없어요.", "No, I don't.", "Não, não tenho."]
  - [minjun, "편의점에서 우산을 사요. 사장님 가게요.", "Buy an umbrella at the convenience store. The owner's shop.", "Compre um guarda-chuva na loja de conveniência. A loja do dono."]
  - [protagonist, "네, 우산을 사요. 서울은 여름에 더워요?", "OK, I'll buy an umbrella. Is Seoul hot in summer?", "Tá, compro um guarda-chuva. Seul é quente no verão?"]
  - [minjun, "네, 정말 더워요. 비도 많이 와요.", "Yes, really hot. It rains a lot, too.", "Sim, muito quente. E chove muito."]
  - [protagonist, "겨울은요?", "And the winter?", "E o inverno?"]
  - [minjun, "겨울은 정말 추워요. 눈이 와요.", "Winter is really cold. It snows.", "O inverno é muito frio. Neva."]
  - [protagonist, "브라질은 겨울에도 따뜻해요.", "In Brazil it's warm even in winter.", "No Brasil é quente até no inverno."]
  - [minjun, "와, 좋아요! 서울 날씨는 힘들어요.", "Wow, lucky! Seoul's weather is hard.", "Nossa, que bom! O tempo de Seul é difícil."]
teach:
  - ask: ["Say that it is raining today.", "Diga que hoje está chovendo.", "오늘 비가 와요.", oneul, biga-wayo]
  - note: ["Describing words work like verbs: 덥다 → 더워요, 춥다 → 추워요, 따뜻하다 → 따뜻해요. Words in -ㅂ다 change ㅂ to 우: 더워요.", "As palavras que descrevem funcionam como verbos: 덥다 → 더워요, 춥다 → 추워요, 따뜻하다 → 따뜻해요. As terminadas em -ㅂ다 trocam ㅂ por 우: 더워요."]
  - build: [deowoyo, ["-워요", "더워요"]]
  - ask: ["Say that it is hot.", "Diga que está quente.", "더워요.", deowoyo]
  - ask: ["Say that it is really cold.", "Diga que está muito frio.", "정말 추워요.", jeongmal, chuwoyo]
  - note: ["What you buy, eat or read takes 을/를: 우산을 사요, I buy an umbrella. 을 after a consonant, 를 after a vowel: 라면을, 커피를.", "O que você compra, come ou lê leva 을/를: 우산을 사요, compro um guarda-chuva. 을 depois de consoante, 를 depois de vogal: 라면을, 커피를."]
  - ask: ["Say that you are buying an umbrella.", "Diga que vai comprar um guarda-chuva.", "우산을 사요.", usan, eul-reul, sayo]
  - ask: ["Say that you are buying water.", "Diga que vai comprar água.", "물을 사요.", eul-reul, sayo]
  - ask: ["Ask if Seoul is hot in summer.", "Pergunte se Seul é quente no verão.", "서울은 여름에 더워요?", yeoreum, deowoyo]
  - ask: ["Say: winter is really cold, it snows.", "Diga: o inverno é muito frio, neva.", "겨울은 정말 추워요. 눈이 와요.", gyeoul, nuni-wayo]
  - ask: ["Say that Brazil is warm even in winter.", "Diga que no Brasil é quente até no inverno.", "브라질은 겨울에도 따뜻해요.", ttatteuthaeyo]
  - ask: ["Ask: how is the weather today?", "Pergunte: como está o tempo hoje?", "오늘 날씨 어때요?", oneul, nalssi]
  - pt_only: "Para quem vem de São Paulo: o verão de Seul é abafado como o nosso, com a monção em julho, mas o inverno chega a -10 °C. E guarda-chuva se compra em qualquer loja de conveniência."
