id: A1-01
protagonist: f
title: ["The landlady", "A dona do apartamento"]
situation: ["You have just arrived at the building in Mapo, Seoul. The landlady, Mrs Park, about seventy, opens the door.", "Você acabou de chegar ao prédio em Mapo, Seul. A dona, a senhora Park, de uns setenta anos, abre a porta."]
learn: [ko-copula, ko-hangul]
culture: A bow, not a hug, for an older person you meet
items:
  - [annyeong, "안녕하세요", "Hello", "Olá / bom dia"]
  - [cheoeum, "처음 뵙겠습니다", "Nice to meet you (formal, first meeting)", "Muito prazer (formal, primeiro encontro)", {register: formal}]
  - [ne, "네", "Yes", "Sim"]
  - [aniyo, "아니요", "No", "Não"]
  - [beurajil-saram, "브라질 사람이에요", "I'm Brazilian / (she) is Brazilian", "Sou brasileira / é brasileiro"]
  - [jeoneun, "저는", "I (polite, as the topic)", "Eu (educado, como tópico)"]
  - [ieyo, "이에요", "is / am / are (after a consonant)", "é / sou (depois de consoante)"]
  - [yeyo, "예요", "is / am / are (after a vowel)", "é / sou (depois de vogal)"]
  - [bangawoyo, "반가워요", "Glad to meet you", "Prazer em conhecer"]
  - [deureooseyo, "들어오세요", "Come in (polite)", "Entre (educado)"]
  - [gamsahamnida, "감사합니다", "Thank you (formal)", "Obrigada / obrigado (formal)", {register: formal}]
  - [halmeoni, "할머니", "grandmother; how one addresses an older woman", "avó; como se chama uma senhora idosa"]
dialogue:
  - [protagonist, "안녕하세요!", "Hello!", "Olá!"]
  - [park, "네, 안녕하세요. 브라질 사람이에요?", "Yes, hello. Are you the Brazilian?", "Sim, olá. Você é a brasileira?"]
  - [protagonist, "네, 브라질 사람이에요. 처음 뵙겠습니다.", "Yes, I'm Brazilian. Nice to meet you.", "Sim, sou brasileira. Muito prazer."]
  - [park, "반가워요. 저는 박순자예요.", "Glad to meet you. I'm Park Sunja.", "Prazer. Eu sou Park Sunja."]
  - [protagonist, "반가워요, 할머니.", "Glad to meet you, grandma.", "Prazer, vovó."]
  - [park, "들어오세요.", "Come in.", "Entre."]
  - [protagonist, "감사합니다!", "Thank you!", "Obrigada!"]
teach:
  - note: ["Korean is written in hangul: letters grouped into syllable blocks. 한 + 글 = 한글. The Learn lesson on hangul teaches the letters; here, listen first.", "O coreano se escreve em hangul: letras agrupadas em blocos de sílaba. 한 + 글 = 한글. A lição de Learn sobre o hangul ensina as letras; aqui, primeiro escute."]
  - line: [protagonist, annyeong]
  - ask: ["Greet the landlady.", "Cumprimente a dona do apartamento.", "안녕하세요!", annyeong]
  - note: ["'처음 뵙겠습니다' is the formal 'nice to meet you' for a first meeting with someone older. Say it with a small bow.", "'처음 뵙겠습니다' é o 'muito prazer' formal do primeiro encontro com alguém mais velho. Diga com uma leve reverência."]
  - build: [cheoeum, ["뵙겠습니다", "처음 뵙겠습니다"]]
  - ask: ["Say 'nice to meet you' formally.", "Diga 'muito prazer' de modo formal.", "처음 뵙겠습니다.", cheoeum]
  - note: ["'It is X' is X + 이에요 after a consonant, X + 예요 after a vowel: 사람이에요, 박순자예요.", "'É X' se diz X + 이에요 depois de consoante, X + 예요 depois de vogal: 사람이에요, 박순자예요."]
  - ask: ["She asks if you are Brazilian. Say yes.", "Ela pergunta se você é brasileira. Diga que sim.", "네, 브라질 사람이에요.", ne, beurajil-saram, ieyo]
  - ask: ["She says her name. How did she say 'I'm Park Sunja'?", "Ela diz o nome. Como ela disse 'eu sou Park Sunja'?", "저는 박순자예요.", jeoneun, yeyo]
  - ask: ["Someone asks: are you Japanese? Say no.", "Alguém pergunta: você é japonesa? Diga que não.", "아니요, 브라질 사람이에요.", aniyo, beurajil-saram]
  - ask: ["Say 'I'm Brazilian', starting with 'I'.", "Diga 'eu sou brasileira', começando por 'eu'.", "저는 브라질 사람이에요.", jeoneun, beurajil-saram]
  - note: ["An older woman is called 할머니, 'grandma' — it is respectful, not intimate.", "Uma senhora idosa é chamada de 할머니, 'vovó' — é respeitoso, não íntimo."]
  - ask: ["Say 'glad to meet you, grandma'.", "Diga 'prazer, vovó'.", "반가워요, 할머니.", bangawoyo, halmeoni]
  - line: [park, deureooseyo]
  - ask: ["Invite a guest in, politely.", "Convide uma visita a entrar, com educação.", "들어오세요.", deureooseyo]
  - ask: ["Thank her formally.", "Agradeça de modo formal.", "감사합니다!", gamsahamnida]
  - pt_only: "No Brasil a gente abraça e beija quem acabou de conhecer. Na Coreia, com uma pessoa mais velha, nada de contato: uma reverência leve com 안녕하세요 basta."
