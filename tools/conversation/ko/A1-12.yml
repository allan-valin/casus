steps:
- type: narrator
  text:
    en: Minjun takes you to a dog café in Mapo. There are dogs everywhere, but no cats. Listen to the conversation; you don't need to understand it yet.
    pt: O Minjun leva você a um café de cachorros em Mapo. Há cachorros por toda parte, mas nenhum gato. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: minjun
    text: 형, 여기가 강아지 카페예요.
    meaning:
      en: Hyung, this is the dog café.
      pt: Hyung, aqui é o café de cachorros.
  - speaker: protagonist
    text: 와, 강아지가 정말 많아요! 귀여워요.
    meaning:
      en: Wow, so many dogs! They're cute.
      pt: Nossa, quantos cachorros! Que fofos.
  - speaker: minjun
    text: 형은 강아지 좋아해요?
    meaning:
      en: Do you like dogs?
      pt: Você gosta de cachorro?
  - speaker: protagonist
    text: 네, 그런데 고양이를 더 좋아해요. 고양이는 없어요?
    meaning:
      en: Yes, but I like cats more. Are there no cats?
      pt: Gosto, mas gosto mais de gato. Não tem gato?
  - speaker: minjun
    text: 여기는 고양이가 없어요. 저는 고양이보다 강아지가 좋아요.
    meaning:
      en: There are no cats here. I like dogs more than cats.
      pt: Aqui não tem gato. Eu gosto mais de cachorro do que de gato.
  - speaker: protagonist
    text: 이 강아지는 작아요. 만져도 돼요?
    meaning:
      en: This dog is small. May I touch it?
      pt: Este cachorro é pequeno. Posso tocar?
  - speaker: minjun
    text: 네, 돼요. 저 강아지는 커요!
    meaning:
      en: Yes, you can. That dog is big!
      pt: Pode. Aquele cachorro é grande!
  - speaker: protagonist
    text: 진짜요? 브라질 강아지보다 작아요.
    meaning:
      en: Really? It's smaller than Brazilian dogs.
      pt: Sério? É menor que os cachorros do Brasil.
- type: prompt
  ask:
    en: Say that the dogs are cute.
    pt: Diga que os cachorros são fofos.
  answer:
