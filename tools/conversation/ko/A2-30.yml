steps:
- type: narrator
  text:
    en: The year-end team dinner. The director tells dad jokes; the team laughs politely. Then you try one. A review of all of A2. Listen to the conversation; you don't need to understand it yet.
    pt: O jantar de fim de ano da equipe. O diretor conta piadas de tiozão; a equipe ri por educação. Depois você tenta uma. Revisão de todo o A2. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: jieun
    text: 오늘은 송년회예요. 부장님이 아재개그를 하실 거예요.
    meaning:
      en: Today is the year-end party. The director is going to tell dad jokes.
      pt: Hoje é a festa de fim de ano. O diretor vai contar piadas de tiozão.
  - speaker: protagonist
    text: 아재개그요? 그게 뭐예요?
    meaning:
      en: Dad jokes? What are those?
      pt: Piadas de tiozão? O que é isso?
  - speaker: jieun
    text: 썰렁한 농담이에요. 그래도 다 같이 웃어 줘야 돼요.
    meaning:
      en: Jokes that fall flat. But everyone has to laugh anyway.
      pt: Piadas sem graça. Mas todo mundo tem que rir mesmo assim.
  - speaker: protagonist
    text: 하하… 방금 그거 웃겨요? 썰렁해요.
    meaning:
      en: Haha… was that one funny? It fell flat.
      pt: Haha… essa foi engraçada? Foi sem graça.
  - speaker: jieun
    text: 쉿! 웃으세요! 이제 신입 사원이 한 개 해야 돼요.
    meaning:
      en: Shh! Laugh! Now the new employee has to tell one.
      pt: Psiu! Ria! Agora o novato tem que contar uma.
  - speaker: protagonist
    text: 음… 왕이 넘어지면? 킹콩!
    meaning:
      en: Um… what is it when a king falls over? King Kong!
      pt: Hum… o que é um rei que cai? King Kong!
  - speaker: jieun
    text: 하하하! 진짜 웃겨요! 또 해 주세요!
    meaning:
      en: Hahaha! That's really funny! Tell another one!
      pt: Hahaha! Muito engraçado! Conta outra!
  - speaker: protagonist
    text: 올해 수고 많으셨습니다. 새해 복 많이 받으세요!
    meaning:
      en: Thank you for all your hard work this year. Happy New Year!
      pt: Obrigado pelo esforço deste ano. Feliz Ano Novo!
