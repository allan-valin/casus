steps:
- type: narrator
  text:
    en: A heat wave and a news report on power demand. The team lead explains where Korea's electricity comes from. Listen to the conversation; you don't need to understand it yet.
    pt: Uma onda de calor e uma reportagem sobre o consumo de energia. A líder explica de onde vem a eletricidade da Coreia. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 팀장님, 뉴스에서 전기 사용량에 대해 이야기했어요.
    meaning:
      en: Team lead, the news talked about electricity consumption.
      pt: Líder, o noticiário falou sobre o consumo de energia.
  - speaker: jieun
    text: 네, 너무 덥기 때문에 에어컨을 많이 써요.
    meaning:
      en: Yes, because it's so hot, people use the air conditioning a lot.
      pt: Sim, como está muito quente, o pessoal usa muito ar-condicionado.
  - speaker: protagonist
    text: 한국은 전기를 어디서 만들어요?
    meaning:
      en: Where does Korea make its electricity?
      pt: De onde vem a eletricidade da Coreia?
  - speaker: jieun
    text: 원자력 발전소하고 석탄이 많아요. 태양광도 늘고 있어요.
    meaning:
      en: Mostly nuclear plants and coal. Solar is growing too.
      pt: Muita usina nuclear e carvão. A solar também está crescendo.
  - speaker: protagonist
    text: 브라질은 물로 전기를 많이 만들어요. 강이 크기 때문에요.
    meaning:
      en: Brazil makes a lot of electricity from water. Because the rivers are big.
      pt: O Brasil gera muita eletricidade com água. Porque os rios são grandes.
  - speaker: jieun
    text: 아, 수력이요? 신기하네요.
    meaning:
      en: Oh, hydropower? Interesting.
      pt: Ah, hidrelétrica? Que interessante.
  - speaker: protagonist
    text: 정전이 되지 않게 하기 위해서 우리도 에너지를 절약해야겠어요.
    meaning:
      en: To avoid a power cut, we should save energy too.
      pt: Para não ter apagão, a gente também precisa economizar energia.
  - speaker: jieun
    text: 맞아요. 사무실 온도를 이십육 도로 해요.
    meaning:
      en: Right. Let's set the office to 26 degrees.
      pt: Isso. Vamos deixar o escritório em 26 graus.
- type: narrator
  text:
    en: '에 대해(서) is ''about'': 전기 사용량에 대해 이야기했어요, they talked about power use.'
    pt: '에 대해(서) é ''sobre'': 전기 사용량에 대해 이야기했어요, falaram sobre o consumo de energia.'
