# STORY BIBLE — Korean, narrator Brazilian Portuguese (Allan's pair ko·pt-BR, 3rd in his order). DRAFT 2026-10-21
# for Allan's review, written by AI (Claude) after the guide (docs/conversation/GUIDE.en.md); units come after.

language: ko
in_development: true   # shown as a banner; false once every Learn grammar lesson is practised (build then fails on gaps)
narrator_languages: [en, pt]
country: South Korea
standard: >-
  Standard Korean (표준어) as spoken in Seoul; polite 해요체 is the default of the units, formal 합쇼체 for set phrases
  and announcements, 반말 only between friends once it is agreed. No dialect (an optional B-level unit can meet
  Busan speech).

voices:
  # Piper ko_KR-kss-medium (CC BY-NC-SA — allowed, Casus is not sold; Allan 2026-10-21): ONE female speaker
  # (checked 2026-10-21). Male characters use the same voice pitched down (×0.82), as Macedonian women use a
  # pitched-up voice — to judge by ear. Its phonemes are espeak's Korean; the browser library does not list the
  # voice, so it runs on our own engine (src/app/lib/phonemePiper.js) with a hangul → sound step. Technical step
  # before the first unit.
  - {id: nar-en, role: narrator, lang: en, tts: "piper:en_US-lessac-medium"}
  - {id: nar-pt, role: narrator, lang: pt, tts: "piper:pt_BR-cadu-medium"}            # CC0
  - {id: ko-f, role: character, lang: ko, gender: f, tts: "piper:ko_KR-kss-medium"}
  - {id: ko-f2, role: character, lang: ko, gender: f, tts: "piper:ko_KR-kss-medium", pitch: 0.94}
  - {id: ko-m, role: character, lang: ko, gender: m, tts: "piper:ko_KR-kss-medium", pitch: 0.82}
  - {id: ko-m2, role: character, lang: ko, gender: m, tts: "piper:ko_KR-kss-medium", pitch: 0.72}
  # told apart from the protagonist's voices in every dialogue (talk.test: pitch 0.06 or speed 0.08 apart), 2026-10-28
  - {id: ko-f3, role: character, lang: ko, gender: f, tts: "piper:ko_KR-kss-medium", pitch: 1.08}
  - {id: ko-m3, role: character, lang: ko, gender: m, tts: "piper:ko_KR-kss-medium", pitch: 0.88, speed: 1.1}
  - {id: ko-m4, role: character, lang: ko, gender: m, tts: "piper:ko_KR-kss-medium", pitch: 0.7, speed: 0.92}

protagonist:
  forms: {f: ko-f, m: ko-m}
  name: null
  background: >-
    Brazilian from São Paulo, about 30, comes to Seoul for a one-year contract at a Korean game company whose team
    speaks English. Knows no Korean and no hangul; has watched some K-dramas. Rents a room in a 원룸 in 마포구.
  alternation: >-
    odd units f, even units m. Kinship words used for friends depend on the speaker's sex — a woman says 언니 / 오빠,
    a man 누나 / 형 — so both sets appear.

cast:
  - id: park
    name: 박순자 (집주인 할머니)
    role: landlady, about 70, lives on the ground floor, runs a small 반찬 business
    voice: ko-f2
    register: formal
    arc: 해요체 and 합쇼체 from the protagonist throughout; she speaks 반말 to the protagonist from A2 (age), which is normal; feeds them kimchi
  - id: minjun
    name: 김민준
    role: neighbour, 27, delivery-app developer, plays League and goes hiking with his father
    voice: ko-m3
    register: formal
    arc: 해요체 at first; asks the protagonist's age in A1-08 (the age clash); he is younger → calls them 누나/형; in A1-23 he says 말 편하게 하세요 (the younger may only offer this), and the protagonist, the elder, proposes 우리 말 놓을까요? — the elder proposes mutual 반말
  - id: jieun
    name: 이지은
    role: colleague, 31, team lead (팀장)
    voice: ko-f3
    register: formal
    arc: addressed as 팀장님, never by name alone; 회식 in A2; friendship but 해요체 to the end of B
  - id: sajang
    name: 편의점 사장님
    role: owner of the convenience store downstairs, about 55
    voice: ko-m2
    register: formal
    arc: says 어서 오세요 and 봉투 필요하세요?; the protagonist's everyday teacher

  - id: passerby
    name: 행인 (a passer-by)
    role: someone in the street or the station, asked the way; one scene at a time
    voice: ko-f3
    register: formal
    arc: 해요체 with strangers
  - id: seoyeon
    name: 박서연
    role: Mrs Park's niece, 24, student; visits on weekends
    voice: ko-f3
    register: formal
    arc: 해요체 with the protagonist (calls an older woman 언니, an older man 오빠); later friends
  - id: seller
    name: 시장 상인 (a market seller)
    role: stall keepers at Mangwon market, one scene at a time
    voice: ko-f3
    register: formal
    arc: 해요체 with customers; regulars get a 덤
  - id: abeoji
    name: 김민준의 아버지 (Minjun's father)
    role: about 60, retired, hikes Bukhansan every Sunday
    voice: ko-m4
    register: formal
    arc: 해요체 with the protagonist; proud of his son's foreign friend
formality:
  summary: >-
    Korean grammar marks the listener: 합쇼체 (-습니다, formal), 해요체 (-아요/어요, polite, the everyday default with
    anyone not a close friend), 반말 (no ending, friends of the same age, younger people, family). The subject is
    honoured with -시- (가세요). Age and position decide: one asks age early (몇 살이에요? / 나이가 어떻게 되세요?),
    and the older person proposes 반말. Second-person pronouns are avoided: use the title (팀장님, 사장님, 선생님)
    or name + 씨 (지은 씨), never the bare name for an older person.
  rules:
    - 해요체 with everyone in A1; 합쇼체 in fixed phrases (감사합니다, 처음 뵙겠습니다).
    - 반말 only with Minjun from A1-23 (말 놓을까요?), both ways; before that 해요체 both ways.
    - Titles, not names, for the boss (팀장님) and the shop owner (사장님); the landlady is 할머니 or 사장님.
  # who speaks to whom in which style, and from which unit (T4, Allan 2026-10-27); the checker flags a line that
  # breaks it. 합쇼체 set phrases (감사합니다, 처음 뵙겠습니다, 죄송합니다) are allowed in any 해요체 relationship.
  relationships:
    - {from: protagonist, to: park, style: 해요체, from_unit: A1-01}
    - {from: park, to: protagonist, style: 해요체, from_unit: A1-01}
    - {from: park, to: protagonist, style: 반말, from_unit: A2-01, note: "an elder (70) may; the protagonist never answers in 반말"}
    - {from: protagonist, to: jieun, style: 해요체, from_unit: A1-07, note: "합쇼체 in meetings (B2)"}
    - {from: jieun, to: protagonist, style: 해요체, from_unit: A1-07}
    - {from: protagonist, to: sajang, style: 해요체, from_unit: A1-04}
    - {from: sajang, to: protagonist, style: 해요체, from_unit: A1-04, note: "shop phrases in 합쇼체/-(으)세요"}
    - {from: protagonist, to: minjun, style: 해요체, from_unit: A1-02}
    - {from: minjun, to: protagonist, style: 해요체, from_unit: A1-02}
    - {from: protagonist, to: minjun, style: 반말, from_unit: A1-23}
    - {from: minjun, to: protagonist, style: 반말, from_unit: A1-23, note: "still calls the protagonist 누나/형"}
  sources:
    - {title: "국립국어원, 『표준 언어 예절』 (2011) — 경어법, 호칭어", url: "https://www.korean.go.kr", licence: cited}
    - {title: "언어 예절에 따른 높임법 교육 (성신여대)", url: "https://repository.sungshin.ac.kr/handle/2025.oak/4806", licence: cited}
    - {title: "Wikipedia: Korean speech levels", url: "https://en.wikipedia.org/wiki/Korean_speech_levels", licence: CC BY-SA}
    - {title: "Wikipedia: Korean honorifics", url: "https://en.wikipedia.org/wiki/Korean_honorifics", licence: CC BY-SA}

culture:
  taught:
    - {topic: bowing, note: "A slight bow with 안녕하세요; deeper to elders; a handshake between men may come with the left hand supporting the right forearm."}
    - {topic: two hands, note: "Give and receive things (money, cards, a glass) with both hands, or the right hand supported by the left, to elders."}
    - {topic: age, note: "People ask your age early, to know which speech level and which title to use; it is not rude."}
    - {topic: shoes, note: "Shoes off at the entrance of homes and of some restaurants with floor seating."}
    - {topic: eating, note: "The eldest starts eating first; don't stick chopsticks upright in rice; dishes are shared; pour drinks for others, never for yourself; turn your head aside when drinking in front of an elder."}
    - {topic: work dinners, note: "회식 after work: barbecue, soju, often a second round (2차); declining is possible but noticed."}
    - {topic: speed, note: "빨리빨리: fast service, fast delivery (배달) at any hour; queues move quickly."}
    - {topic: rubbish, note: "Strict separation (분리수거) and paid bags for general rubbish (종량제 봉투); food waste separate."}
    - {topic: tipping, note: "No tipping anywhere."}
    - {topic: numbers, note: "Two number systems (하나, 둘 / 일, 이); 4 (사) is avoided like 13; floor 4 may be marked F."}
    - {topic: holidays, note: "설날 (lunar New Year) and 추석 (harvest) mean travel home, bows to parents (세배), envelopes of money."}
  narrator:
    - {lang: en, topic: contact, note: "A bow, not a handshake or a hug, with older people and strangers."}
    - {lang: en, topic: names, note: "Titles and 씨 come before first names; the boss is 팀장님, never her name alone."}
    - {lang: en, topic: age, note: "Age is asked early: it decides speech level and titles."}
    - {lang: pt, topic: contact, note: "Brazilians kiss and hug acquaintances; in Korea a bow, no body contact with strangers or older people."}
    - {lang: pt, topic: names, note: "Brazilians use first names with almost everyone, even the boss; in Korea titles and 씨 come first."}
    - {lang: pt, topic: age, note: "Asking someone's age is impolite in Brazil; in Korea it is the first question."}
    - {lang: pt, topic: time, note: "Brazilian appointments are flexible; Korean ones are punctual, and work runs long."}
    - {lang: pt, topic: drinks, note: "In Brazil each one serves themselves; in Korea you pour for the others."}
    - {lang: pt, topic: tipping, note: "Brazil adds 10 % service; Korea adds nothing."}
  clashes:
    - {situation: "Hugging the landlady at the first meeting", unit: A1-01}
    - {situation: "Calling the team lead '지은' by her first name", unit: A1-07}
    - {situation: "Minjun asks the protagonist's age on the stairs", unit: A1-08}
    - {situation: "Taking the card with one hand at the shop", unit: A1-11}
    - {situation: "Pouring soju for oneself at the first 회식", unit: A2}
    - {situation: "Leaving a tip at the barbecue place", unit: A2}

arc:
  - {level: A1, units: 30, summary: "Arrival in Seoul: the landlady, the room, the convenience store, hangul, the office, titles, Minjun and the age question, the subway, food delivery, 말 놓을까요?"}
  - {level: A2, units: 30, summary: "Settling in: alien registration card, bank, hospital, 회식, rubbish rules, a hiking trip, 추석 at Minjun's parents'."}
  - {level: B1, units: 30, summary: "Friends: Minjun's group, karaoke (노래방), 찜질방, opinions, a misunderstanding over 반말."}
  - {level: B2, units: 30, summary: "Work: honorific Korean at meetings, e-mails, a new job interview, 존댓말 to clients."}
  - {level: C1, units: 30, summary: "Evening courses: science talked about at school level."}
  - {level: C2, units: 30, summary: "Ideas: philosophy, history handled with care, humour, register."}
