steps:
- type: narrator
  text:
    en: Minjun has an exam and studies all night in a 24-hour study café. You join him for an hour and talk about sleep. Listen to the conversation; you don't need to understand it yet.
    pt: O Minjun tem prova e estuda a noite toda num café de estudos 24 horas. Você vai lá por uma hora e vocês falam de sono. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 민준아, 여기가 스터디카페야? 정말 조용하다.
    meaning:
      en: Minjun, this is the study café? It's really quiet.
      pt: Minjun, isto é o café de estudos? Que silêncio.
  - speaker: minjun
    text: 응, 조용히 해. 내일 시험이라서 밤새 공부해.
    meaning:
      en: Yeah, keep your voice down. I have an exam tomorrow, so I'm studying all night.
      pt: É, fala baixo. Amanhã tenho prova, então vou estudar a noite toda.
  - speaker: protagonist
    text: 밤새? 안 피곤해?
    meaning:
      en: All night? Aren't you tired?
      pt: A noite toda? Não está cansado?
  - speaker: minjun
    text: 피곤해. 커피를 너무 많이 마셔서 잠이 안 와.
    meaning:
      en: I'm tired. I drank too much coffee, so I can't sleep.
      pt: Estou cansado. Tomei café demais, então o sono não vem.
  - speaker: protagonist
    text: 공부하는 것도 중요하지만 자는 것도 중요해.
    meaning:
      en: Studying is important, but sleeping is important too.
      pt: Estudar é importante, mas dormir também.
  - speaker: minjun
    text: 알아. 그런데 한국에서는 다 이렇게 해.
    meaning:
      en: I know. But in Korea everyone does this.
      pt: Eu sei. Mas na Coreia todo mundo faz assim.
  - speaker: protagonist
    text: 나는 졸려서 먼저 갈게. 시험 끝나면 일찍 자!
    meaning:
      en: I'm sleepy, so I'll go first. Go to bed early after the exam!
      pt: Estou com sono, vou indo. Depois da prova, dorme cedo!
  - speaker: minjun
    text: 고마워, 형. 내일 연락할게.
    meaning:
      en: Thanks, hyung. I'll message you tomorrow.
      pt: Valeu, hyung. Amanhã te mando mensagem.
