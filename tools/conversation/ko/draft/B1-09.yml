steps:
- type: narrator
  text:
    en: 'Jieun reads a survey about young Koreans: work, housing, marriage. You talk about what the numbers say. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'A Jieun lê uma pesquisa sobre jovens coreanos: trabalho, moradia, casamento. Vocês conversam sobre o que os números dizem. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: jieun
    text: 이 조사 봤어요? 젊은 사람들에 대한 통계예요.
    meaning:
      en: Have you seen this survey? Statistics about young people.
      pt: Viu esta pesquisa? Estatística sobre os jovens.
  - speaker: protagonist
    text: 뭐라고 해요?
    meaning:
      en: What does it say?
      pt: O que diz?
  - speaker: jieun
    text: 평균 결혼 나이가 서른넷이라고 해요. 점점 늦어지고 있어요.
    meaning:
      en: It says the average marriage age is thirty-four. It's getting later and later.
      pt: Diz que a idade média para casar é trinta e quatro. Está ficando cada vez mais tarde.
  - speaker: protagonist
    text: 왜 그래요?
    meaning:
      en: Why is that?
      pt: Por quê?
  - speaker: jieun
    text: 조사한 결과, 집값이 제일 큰 이유라고 해요.
    meaning:
      en: According to the results, housing prices are the biggest reason.
      pt: Pelo resultado, o preço da moradia é o maior motivo.
  - speaker: protagonist
    text: 응답자의 삼십 퍼센트가 결혼을 안 한다고 했어요?
    meaning:
      en: Thirty per cent of respondents said they won't marry?
      pt: Trinta por cento disseram que não vão casar?
  - speaker: jieun
    text: 네. 놀랍죠? 저도 결혼은 나중에 한다고 엄마한테 말했어요.
    meaning:
      en: Yes. Surprising, isn't it? I told my mum I'll marry later, too.
      pt: Sim. Surpreendente, né? Eu também falei para minha mãe que vou casar mais tarde.
  - speaker: protagonist
    text: 브라질도 비슷한 것 같아요. 통계가 놀라워요.
    meaning:
      en: I think Brazil is similar. The statistics are surprising.
      pt: Acho que no Brasil é parecido. A estatística surpreende.
