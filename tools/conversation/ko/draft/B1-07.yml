steps:
- type: narrator
  text:
    en: At Minjun's party you speak casually to his cousin — who turns out to be older than you. An awkward moment, and how to fix it. Listen to the conversation; you don't need to understand it yet.
    pt: Na festa do Minjun você fala informal com o primo dele — que é mais velho que você. Um momento constrangedor, e como consertar. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 너도 민준이 친구야? 몇 살이야?
    meaning:
      en: Are you a friend of Minjun's too? How old are you?
      pt: Você também é amigo do Minjun? Quantos anos você tem?
  - speaker: cousin
    text: 저는 민준이 사촌이에요. 서른다섯 살이에요.
    meaning:
      en: I'm Minjun's cousin. I'm thirty-five.
      pt: Sou primo do Minjun. Tenho trinta e cinco.
  - speaker: protagonist
    text: 어? 저보다 나이가 많으시네요! 말 놓아서 죄송해요.
    meaning:
      en: Oh? You're older than me! Sorry for speaking casually.
      pt: Ué? O senhor é mais velho que eu! Desculpe por falar informal.
  - speaker: cousin
    text: 하하, 괜찮아요. 외국 사람이니까요.
    meaning:
      en: Haha, it's fine. You're a foreigner, after all.
      pt: Haha, tudo bem. Você é estrangeira.
  - speaker: protagonist
    text: 정말 몰랐어요. 처음 만나면 반말 하면 안 되죠?
    meaning:
      en: I really didn't know. You mustn't use 반말 when you first meet, right?
      pt: Eu realmente não sabia. Não se fala informal no primeiro encontro, né?
  - speaker: cousin
    text: 네, 처음에는 존댓말이 좋아요. 나이를 모르면요.
    meaning:
      en: Right, at first polite speech is better. If you don't know the age.
      pt: Isso, no começo é melhor falar educado. Se não sabe a idade.
  - speaker: minjun
    text: 누나, 우리 사촌 형한테 반말했어? 하하!
    meaning:
      en: Nuna, you used 반말 with my cousin? Haha!
      pt: Nuna, você falou informal com meu primo? Haha!
  - speaker: protagonist
    text: 민준아, 웃지 마! 오빠, 다시 인사드릴게요. 반가워요!
    meaning:
      en: Minjun, don't laugh! Oppa, let me greet you again. Nice to meet you!
      pt: Minjun, não ri! Oppa, deixa eu cumprimentar de novo. Prazer!
- type: narrator
  text:
    en: '반말 to a stranger, or to someone older, feels rude: 기분 나빠요. Repair it at once: 말 놓아서 죄송해요.'
    pt: '반말 com um desconhecido, ou com alguém mais velho, soa rude: 기분 나빠요. Conserte na hora: 말 놓아서 죄송해요.'
