steps:
- type: narrator
  text:
    en: 'Minjun''s younger sister Minji studies biology and explains her homework: cells, the nucleus, division — and passive verbs. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'A irmã mais nova do Minjun, Minji, estuda biologia e explica o dever de casa: células, núcleo, divisão — e verbos na voz passiva. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: minji
    text: 언니, 이거 생물 숙제예요. 세포에 대한 거예요.
    meaning:
      en: Unni, this is my biology homework. It's about cells.
      pt: Unni, este é meu dever de biologia. É sobre células.
  - speaker: protagonist
    text: 와, 현미경 사진이네요. 이건 뭐예요?
    meaning:
      en: Wow, a microscope photo. What's this?
      pt: Nossa, uma foto de microscópio. O que é isto?
  - speaker: minji
    text: 핵이에요. 현미경으로 보면 잘 보여요.
    meaning:
      en: The nucleus. You can see it well under the microscope.
      pt: É o núcleo. No microscópio dá para ver bem.
  - speaker: protagonist
    text: 세포가 어떻게 커져요?
    meaning:
      en: How does a cell grow?
      pt: Como a célula cresce?
  - speaker: minji
    text: 세포는 둘로 나뉘어요. 교과서에는 '세포는 둘로 나뉜다'라고 써 있어요.
    meaning:
      en: A cell divides in two. The textbook says 'the cell divides in two'.
      pt: A célula se divide em duas. O livro diz 'a célula divide-se em duas'.
  - speaker: protagonist
    text: '''나뉜다''? 왜 ''나뉘어요''라고 안 써요?'
    meaning:
      en: '''Nanwinda''? Why don''t they write ''nanwieoyo''?'
      pt: '''나뉜다''? Por que não escrevem ''나뉘어요''?'
  - speaker: minji
    text: 책은 이렇게 써요. 말할 때는 '나뉘어요'라고 해요.
    meaning:
      en: Books write like that. When you speak you say 'nanwieoyo'.
      pt: Os livros escrevem assim. Falando, a gente diz '나뉘어요'.
  - speaker: protagonist
    text: 아하! 숙제 잘해요. 저도 생물을 다시 배우고 싶어요.
    meaning:
      en: Aha! Good luck with the homework. I'd like to learn biology again too.
      pt: Aha! Bom dever. Também queria aprender biologia de novo.
