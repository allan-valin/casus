steps:
- type: narrator
  text:
    en: 'A year in Seoul. At lunch the team lead asks your honest opinion of the city: what''s convenient, what''s hard. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Um ano em Seul. No almoço a líder pede sua opinião sincera sobre a cidade: o que é prático, o que é difícil. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: jieun
    text: 서울에 온 지 일 년이네요. 서울을 어떻게 생각해요?
    meaning:
      en: It's been a year since you came to Seoul. What do you think of it?
      pt: Faz um ano que você chegou a Seul. O que acha da cidade?
  - speaker: protagonist
    text: 제 생각에는 교통이 정말 편해요. 밤에도 안전하고요.
    meaning:
      en: In my opinion transport is really convenient. And it's safe at night.
      pt: Na minha opinião o transporte é muito prático. E é seguro à noite.
  - speaker: jieun
    text: 안 좋은 점은요? 솔직히 말해 주세요.
    meaning:
      en: And the bad points? Tell me honestly.
      pt: E os pontos ruins? Diga com sinceridade.
  - speaker: protagonist
    text: 솔직히 집값은 비싼 편이에요. 그리고 지하철이 복잡해요.
    meaning:
      en: Honestly, housing is on the expensive side. And the subway is crowded.
      pt: Sinceramente, a moradia é meio cara. E o metrô é lotado.
  - speaker: jieun
    text: 맞아요. 서울은 편한 반면에 좀 바빠요.
    meaning:
      en: True. Seoul is convenient, but on the other hand a bit hectic.
      pt: É verdade. Seul é prática, mas por outro lado um pouco corrida.
  - speaker: protagonist
    text: 그래도 저는 만족해요. 불만은 하나뿐이에요.
    meaning:
      en: Still, I'm satisfied. I have only one complaint.
      pt: Mesmo assim estou satisfeito. Só tenho uma reclamação.
  - speaker: jieun
    text: 뭐예요?
    meaning:
      en: What is it?
      pt: Qual?
  - speaker: protagonist
    text: 겨울이 너무 추워요! 브라질 사람한테는요.
    meaning:
      en: The winter is too cold! For a Brazilian, anyway.
      pt: O inverno é frio demais! Para um brasileiro, pelo menos.
