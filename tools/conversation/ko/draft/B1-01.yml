steps:
- type: narrator
  text:
    en: 'Sunday at a jjimjilbang, the Korean bathhouse, with Minjun''s family: hot rooms, sweet rice drink, towels folded into ''sheep heads''. Listen to the conversation; you don''t need to understand
      it yet.'
    pt: 'Domingo num 찜질방, a casa de banho coreana, com a família do Minjun: salas quentes, bebida doce de arroz, toalhas dobradas em ''cabeça de carneiro''. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: minjun
    text: 누나, 여기가 찜질방이야. 양머리 해 봐!
    meaning:
      en: Nuna, this is a jjimjilbang. Try the sheep-head towel!
      pt: Nuna, isto é um 찜질방. Experimenta a toalha de carneiro!
  - speaker: protagonist
    text: 이렇게? 하하, 진짜 양같이 보여!
    meaning:
      en: Like this? Haha, I really look like a sheep!
      pt: Assim? Haha, pareço mesmo um carneiro!
  - speaker: minjun
    text: 잘 어울려. 이제 한증막에 들어가자.
    meaning:
      en: It suits you. Now let's go into the hot dome.
      pt: Combina com você. Agora vamos entrar na sala quente.
  - speaker: protagonist
    text: 와, 사우나같이 뜨거워! 땀이 나.
    meaning:
      en: Wow, hot like a sauna! I'm sweating.
      pt: Nossa, quente como sauna! Estou suando.
  - speaker: minjun
    text: 조금 있으면 몸이 따뜻해지고 좋아져.
    meaning:
      en: After a while your body warms up and it feels good.
      pt: Daqui a pouco o corpo esquenta e fica bom.
  - speaker: protagonist
    text: 어머님은 어디 계셔?
    meaning:
      en: Where's your mother?
      pt: Onde está sua mãe?
  - speaker: minjun
    text: 엄마는 지금 계란 먹는 중이야. 식혜도 마시자!
    meaning:
      en: Mum is eating eggs right now. Let's have sikhye too!
      pt: A mãe está comendo ovo agora. Vamos tomar 식혜 também!
  - speaker: protagonist
    text: 좋아! 끝나고 나니까 정말 상쾌해.
    meaning:
      en: Great! Now that it's over I feel really refreshed.
      pt: Ótimo! Agora que acabou me sinto revigorada.
