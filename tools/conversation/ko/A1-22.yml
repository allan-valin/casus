steps:
- type: narrator
  text:
    en: The team lead plans the week's meetings with you. The company e-mail uses the formal style. Listen to the conversation; you don't need to understand it yet.
    pt: A líder planeja as reuniões da semana com você. O e-mail da empresa usa o estilo formal. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: jieun
    text: 이번 주 회의는 월요일하고 수요일이에요.
    meaning:
      en: This week's meetings are on Monday and Wednesday.
      pt: As reuniões desta semana são segunda e quarta.
  - speaker: protagonist
    text: 월요일 몇 시예요?
    meaning:
      en: What time on Monday?
      pt: Que horas na segunda?
  - speaker: jieun
    text: 오전 열 시 반이에요. 수요일은 오후 세 시예요.
    meaning:
      en: Half past ten in the morning. Wednesday is three in the afternoon.
      pt: Dez e meia da manhã. Quarta, três da tarde.
  - speaker: protagonist
    text: 알겠습니다. 월요일 열 시 반에 가겠습니다.
    meaning:
      en: Understood. I'll be there Monday at half past ten.
      pt: Entendido. Estarei lá segunda às dez e meia.
  - speaker: jieun
    text: 회의하기 전에 자료를 읽어 주세요.
    meaning:
      en: Please read the documents before the meeting.
      pt: Leia o material antes da reunião, por favor.
  - speaker: protagonist
    text: 네. 이메일에 '회의실로 오십시오'라고 써 있어요.
    meaning:
      en: Yes. The e-mail says 'Please come to the meeting room'.
      pt: Sim. O e-mail diz 'Venham à sala de reunião'.
  - speaker: jieun
    text: 회사 이메일은 그렇게 써요. 늦지 마세요!
    meaning:
      en: Company e-mails are written like that. Don't be late!
      pt: E-mail da empresa é assim. Não se atrase!
  - speaker: protagonist
    text: 걱정 마세요. 금요일 회의도 있어요?
    meaning:
      en: Don't worry. Is there a meeting on Friday too?
      pt: Pode deixar. Tem reunião na sexta também?
- type: prompt
  ask:
    en: 'Say: Monday and Wednesday.'
    pt: 'Diga: segunda e quarta.'
  answer:
