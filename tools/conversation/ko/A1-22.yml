- type: narrator
  text:
    en: Hours use native numbers (한 시, 두 시, 세 시), minutes Sino-Korean numbers; 반 is half past. 오전 morning, 오후 afternoon.
    pt: As horas usam números nativos (한 시, 두 시, 세 시), os minutos os sino-coreanos; 반 é 'e meia'. 오전 manhã, 오후 tarde.
- type: prompt
  ask:
    en: 'Say: half past ten in the morning.'
    pt: 'Diga: dez e meia da manhã.'
