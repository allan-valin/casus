steps:
- type: narrator
  text:
    en: 'Lunch break. Colleagues ask about Brazil: is it dangerous, does everyone play football? You correct the picture — and ask about theirs. Listen to the conversation; you don''t need to understand
      it yet.'
    pt: 'Hora do almoço. Os colegas perguntam do Brasil: é perigoso, todo mundo joga futebol? Você corrige a imagem — e pergunta da deles. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: jieun
    text: 브라질 사람들은 다 축구 잘하지요?
    meaning:
      en: Brazilians are all good at football, right?
      pt: Os brasileiros jogam todos bem futebol, né?
  - speaker: protagonist
    text: 하하, 아니에요. 저는 축구 못해요.
    meaning:
      en: Haha, no. I can't play football.
      pt: Haha, não. Eu não sei jogar futebol.
  - speaker: jieun
    text: 그런데 브라질은 위험하다고 들었는데요.
    meaning:
      en: But I heard Brazil is dangerous.
      pt: Mas ouvi dizer que o Brasil é perigoso.
  - speaker: protagonist
    text: 대도시는 조심해야 돼요. 그런데 지역마다 달라요.
    meaning:
      en: In big cities you have to be careful. But it differs by region.
      pt: Nas cidades grandes tem que tomar cuidado. Mas depende da região.
  - speaker: jieun
    text: 아, 그렇군요. 오해였어요.
    meaning:
      en: Oh, I see. It was a misunderstanding.
      pt: Ah, entendi. Foi um mal-entendido.
  - speaker: protagonist
    text: 괜찮아요. 저도 한국 사람은 다 김치만 먹는 줄 알았어요.
    meaning:
      en: That's OK. I thought all Koreans only ate kimchi too.
      pt: Tudo bem. Eu também achava que coreano só comia kimchi.
  - speaker: jieun
    text: 하하, 김치는 매일 먹지요!
    meaning:
      en: Haha, kimchi we do eat every day!
      pt: Haha, kimchi a gente come todo dia mesmo!
  - speaker: protagonist
    text: 그렇지요? 그건 농담이 아니에요.
    meaning:
      en: Right? That one's no joke.
      pt: Não é? Isso não é piada.
- type: narrator
  text:
    en: '-지요? (often 죠?) checks something you expect to be true: 잘하지요?, you''re good at it, right?'
    pt: '-지요? (muitas vezes 죠?) confirma algo que se espera: 잘하지요?, joga bem, né?'
