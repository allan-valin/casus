steps:
- type: narrator
  text:
    en: Evening on Namsan with Seoyeon, looking for stars over Seoul. Something bright moves — a star? Listen to the conversation; you don't need to understand it yet.
    pt: Noite no Namsan com a Seoyeon, procurando estrelas sobre Seul. Algo brilhante se move — uma estrela? Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: seoyeon
    text: 오빠, 별 보러 남산에 왔어요!
    meaning:
      en: Oppa, we came to Namsan to see the stars!
      pt: Oppa, viemos ao Namsan ver as estrelas!
  - speaker: protagonist
    text: 와, 하늘이 어두워요. 그런데 별이 안 보여요.
    meaning:
      en: Wow, the sky is dark. But I can't see the stars.
      pt: Nossa, o céu está escuro. Mas não dá para ver as estrelas.
  - speaker: seoyeon
    text: 서울은 너무 밝아요. 달은 보여요!
    meaning:
      en: Seoul is too bright. You can see the moon!
      pt: Seul é clara demais. A lua dá para ver!
  - speaker: protagonist
    text: 저기 봐요! 저거 별이에요?
    meaning:
      en: Look there! Is that a star?
      pt: Olha ali! Aquilo é estrela?
  - speaker: seoyeon
    text: 아니요, 별이 아니에요. 비행기예요.
    meaning:
      en: No, it's not a star. It's a plane.
      pt: Não, não é estrela. É avião.
  - speaker: protagonist
    text: 하하. 남산타워는 정말 밝아요.
    meaning:
      en: Haha. Namsan Tower really is bright.
      pt: Haha. A Torre Namsan é bem iluminada.
  - speaker: seoyeon
    text: 다음에는 시골에 별 보러 가요.
    meaning:
      en: Next time let's go to the countryside to see stars.
      pt: Da próxima vez vamos ao interior ver estrelas.
  - speaker: protagonist
    text: 좋아요. 밤하늘이 정말 예쁠 거예요.
    meaning:
      en: Great. The night sky will be beautiful.
      pt: Ótimo. O céu da noite vai ser lindo.
- type: narrator
  text:
    en: '-(으)러 가요: go (in order) to do something: 보다 → 보러 가요, go to see.'
    pt: '-(으)러 가요: ir fazer algo: 보다 → 보러 가요, ir ver.'
