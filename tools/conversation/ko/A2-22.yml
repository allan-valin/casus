steps:
- type: narrator
  text:
    en: A grey spring morning. Minjun checks the fine-dust app before your run along the river. Listen to the conversation; you don't need to understand it yet.
    pt: Uma manhã cinzenta de primavera. O Minjun confere o aplicativo de poeira fina antes da corrida no rio. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: minjun
    text: 형, 오늘 미세먼지가 너무 나빠. 앱 봐.
    meaning:
      en: Hyung, the fine dust is terrible today. Look at the app.
      pt: Hyung, a poeira fina está horrível hoje. Olha o aplicativo.
  - speaker: protagonist
    text: 그래서 하늘이 회색이구나. 공기가 좋지 않아.
    meaning:
      en: So that's why the sky is grey. The air isn't good.
      pt: Por isso o céu está cinza. O ar não está bom.
  - speaker: minjun
    text: 달리기는 안 하는 게 좋아.
    meaning:
      en: Better not to go running.
      pt: Melhor não correr.
  - speaker: protagonist
    text: 그럼 오늘은 집에서 운동할까 봐.
    meaning:
      en: Then I think I'll work out at home today.
      pt: Então acho que hoje vou treinar em casa.
  - speaker: minjun
    text: 나가면 마스크 꼭 써. KF94로.
    meaning:
      en: If you go out, wear a mask for sure. A KF94.
      pt: Se sair, usa máscara sem falta. Uma KF94.
  - speaker: protagonist
    text: 창문도 열지 않을까 봐. 환기는 언제 해?
    meaning:
      en: I think I won't open the windows either. When do you air the room?
      pt: Acho que nem vou abrir a janela. Quando se ventila a casa?
  - speaker: minjun
    text: 미세먼지가 좋은 날에 해. 앱으로 확인해.
    meaning:
      en: On days when the dust is good. Check with the app.
      pt: Nos dias de ar bom. Confere no aplicativo.
  - speaker: protagonist
    text: 알았어. 한국 생활은 앱이 정말 중요하네.
    meaning:
      en: Got it. In Korean life apps really matter.
      pt: Entendi. Na vida coreana o aplicativo é essencial.
