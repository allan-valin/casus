steps:
- type: narrator
  text:
    en: 'Mrs Park shows you old photos: her late husband, her children in Busan, her grandchildren. Then she asks about yours. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'A senhora Park mostra fotos antigas: o falecido marido, os filhos em Busan, os netos. Depois pergunta pela sua família. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: park
    text: 이건 우리 가족 사진이에요. 이 사람은 남편이에요.
    meaning:
      en: This is our family photo. This is my husband.
      pt: Esta é a foto da nossa família. Este é o meu marido.
  - speaker: protagonist
    text: 아드님하고 따님도 있어요?
    meaning:
      en: Do you have a son and a daughter too?
      pt: A senhora tem filho e filha também?
  - speaker: park
    text: 네, 아들 하나, 딸 하나예요. 부산에 살아서 자주 못 봐요.
    meaning:
      en: Yes, one son, one daughter. They live in Busan, so I can't see them often.
      pt: Sim, um filho e uma filha. Moram em Busan, então não vejo sempre.
  - speaker: protagonist
    text: 보고 싶으시겠어요.
    meaning:
      en: You must miss them.
      pt: A senhora deve sentir saudade.
  - speaker: park
    text: 그럼요. 학생 가족은요? 형제 있어요?
    meaning:
      en: Of course. And your family? Do you have siblings?
      pt: Claro. E a sua família? Tem irmãos?
  - speaker: protagonist
    text: 누나 한 명 있어요. 제 엄마하고 아빠는 상파울루에 살아요.
    meaning:
      en: I have one older sister. My mum and dad live in São Paulo.
      pt: Tenho uma irmã mais velha. Minha mãe e meu pai moram em São Paulo.
  - speaker: park
    text: 멀어서 보고 싶겠어요.
    meaning:
      en: It's far, so you must miss them.
      pt: É longe, deve dar saudade.
  - speaker: protagonist
    text: 네. 다음 달에 영상 통화하려고 해요. 엄마 생일이니까요.
    meaning:
      en: Yes. I'm going to video-call next month, because it's mum's birthday.
      pt: Sim. Vou fazer uma chamada de vídeo no mês que vem, porque é aniversário da minha mãe.
