steps:
- type: narrator
  text:
    en: Junho, your boyfriend, takes you to meet his parents in Suwon. Honorific verbs, a deep bow, fruit as a present. Listen to the conversation; you don't need to understand it yet.
    pt: O Junho, seu namorado, leva você para conhecer os pais dele em Suwon. Verbos honoríficos, reverência profunda, frutas de presente. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: junho
    text: 엄마, 아빠, 제 여자 친구예요.
    meaning:
      en: Mum, Dad, this is my girlfriend.
      pt: Mãe, pai, esta é a minha namorada.
  - speaker: protagonist
    text: 안녕하세요. 처음 인사드립니다. 말씀 많이 들었습니다.
    meaning:
      en: Hello. It's an honour to greet you. I've heard a lot about you.
      pt: Olá. É uma honra cumprimentá-los. Ouvi falar muito de vocês.
  - speaker: junhomom
    text: 어서 와요. 편하게 앉으세요.
    meaning:
      en: Welcome. Please sit comfortably.
      pt: Seja bem-vinda. Sente-se à vontade.
  - speaker: protagonist
    text: 감사합니다. 과일 사 왔어요. 어머님 드리고 싶었어요.
    meaning:
      en: Thank you. I brought fruit. I wanted to give it to you.
      pt: Obrigada. Trouxe frutas. Queria dar para a senhora.
  - speaker: junhomom
    text: 아이고, 고마워요. 준호가 브라질 음식을 먹고 싶어 해요.
    meaning:
      en: Oh, thank you. Junho wants to try Brazilian food.
      pt: Ah, obrigada. O Junho quer comer comida brasileira.
  - speaker: protagonist
    text: 그럼 다음에 제가 만들어 드릴게요.
    meaning:
      en: Then next time I'll cook for you.
      pt: Então da próxima vez eu cozinho para vocês.
  - speaker: junhomom
    text: 좋아요. 자, 저녁 드세요. 아버님은 지금 안 계세요. 곧 오실 거예요.
    meaning:
      en: Lovely. Now, have dinner. His father isn't in right now. He'll be here soon.
      pt: Ótimo. Agora jante. O pai dele não está agora. Já vai chegar.
  - speaker: protagonist
    text: 네, 잘 먹겠습니다. 앞으로 예쁘게 봐 주세요.
    meaning:
      en: Yes, thank you for the meal. I hope you'll think well of me.
      pt: Sim, obrigada pela comida. Conto com a simpatia de vocês.
- type: narrator
  text:
    en: 'With a partner''s parents, honorific verbs: 있다 → 계시다 (계세요), 먹다 → 드시다 (드세요), 자다 → 주무시다. Bow deeply at the first greeting.'
    pt: 'Com os pais do namorado, verbos honoríficos: 있다 → 계시다 (계세요), 먹다 → 드시다 (드세요), 자다 → 주무시다. Na primeira saudação, reverência profunda.'
