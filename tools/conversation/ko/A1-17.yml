steps:
- type: narrator
  text:
    en: Mrs Park's niece Seoyeon visits. She thinks all Brazilians dance samba; you thought all Koreans are idols — and that young men live in the PC bang. Listen to the conversation; you don't need to
      understand it yet.
    pt: A sobrinha da senhora Park, Seoyeon, está de visita. Ela acha que todo brasileiro dança samba; você achava que todo coreano é idol — e que os rapazes vivem no PC bang. Escute a conversa; ainda não
      precisa entender.
- type: dialogue
  lines:
  - speaker: seoyeon
    text: 언니, 브라질 사람이에요? 그럼 삼바 잘 춰요?
    meaning:
      en: Unni, you're Brazilian? Then you dance samba well?
      pt: Unni, você é brasileira? Então dança samba bem?
  - speaker: protagonist
    text: 아니에요! 사실은 삼바 못 춰요. 브라질 사람이 다 삼바를 추지 않아요.
    meaning:
      en: No! Actually I can't dance samba. Not all Brazilians dance samba.
      pt: Não! Na verdade não sei sambar. Nem todo brasileiro samba.
  - speaker: seoyeon
    text: 진짜요? 몰랐어요!
    meaning:
      en: Really? I didn't know!
      pt: Sério? Eu não sabia!
  - speaker: protagonist
    text: 저도 몰랐어요. 한국 사람은 다 아이돌이에요?
    meaning:
      en: I didn't know either. Are all Koreans idols?
      pt: Eu também não sabia. Todo coreano é idol?
  - speaker: seoyeon
    text: 하하, 아니에요! 그리고 남자들이 다 PC방에 살지 않아요.
    meaning:
      en: Haha, no! And the guys don't all live in the PC bang.
      pt: Haha, não! E os rapazes não vivem todos no PC bang.
  - speaker: protagonist
    text: PC방은 뭐예요?
    meaning:
      en: What's a PC bang?
      pt: O que é PC bang?
  - speaker: seoyeon
    text: 게임 카페예요. 싸서 친구들하고 가요.
    meaning:
      en: A game café. It's cheap, so you go with friends.
      pt: É um café de jogos. É barato, então se vai com os amigos.
  - speaker: protagonist
    text: 재미있을 거예요. 저도 갈 거예요!
    meaning:
      en: That'll be fun. I'll go too!
      pt: Deve ser divertido. Eu também vou!
