steps:
- type: narrator
  text:
    en: You pay the rent to Mrs Park. She gives you the receipt and a bag of side dishes for Minjun. Listen to the conversation; you don't need to understand it yet.
    pt: Você paga o aluguel à senhora Park. Ela entrega o recibo e uma sacola de 반찬 para o Minjun. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 할머니, 월세예요. 여기 있어요.
    meaning:
      en: Grandma, it's the rent. Here you are.
      pt: Vovó, é o aluguel. Aqui está.
  - speaker: park
    text: 아이고, 고마워요. 영수증 받으세요.
    meaning:
      en: Oh, thank you. Take the receipt.
      pt: Ah, obrigada. Tome o recibo.
  - speaker: protagonist
    text: 감사합니다.
    meaning:
      en: Thank you.
      pt: Obrigada.
  - speaker: park
    text: 그리고 이거, 민준이한테 전해 주세요.
    meaning:
      en: And this — please give it to Minjun.
      pt: E isto, entregue ao Minjun, por favor.
  - speaker: protagonist
    text: 이게 뭐예요?
    meaning:
      en: What is it?
      pt: O que é isso?
  - speaker: park
    text: 반찬이에요. 김치랑 나물이에요.
    meaning:
      en: Side dishes. Kimchi and seasoned greens.
      pt: São 반찬. Kimchi e verduras temperadas.
  - speaker: protagonist
    text: 그럼요, 전해 줄게요.
    meaning:
      en: Of course, I'll give it to him.
      pt: Claro, eu entrego.
  - speaker: park
    text: 이건 학생 거예요. 맛있게 먹어요!
    meaning:
      en: And this one is yours. Enjoy it!
      pt: E este é seu. Bom apetite!
  - speaker: protagonist
    text: 와, 잘 먹겠습니다!
    meaning:
      en: Wow, thank you for the food!
      pt: Nossa, obrigada pela comida!
- type: narrator
  text:
    en: 'To an elder you hand things with both hands, or the right hand with the left touching your arm. With it: 여기 있어요, ''here you are''.'
    pt: 'Para uma pessoa mais velha, entregue com as duas mãos, ou com a direita e a esquerda tocando o braço. Junto: 여기 있어요, ''aqui está''.'
