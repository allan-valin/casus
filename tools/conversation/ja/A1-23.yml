steps:
- type: narrator
  text:
    en: Saturday afternoon on the stairs of your building. Kenta has known you for months now and offers to drop the polite form. Listen to the conversation; you don't need to understand it yet.
    pt: Sábado à tarde, na escada do prédio. O Kenta já conhece você há meses e propõe deixar a forma educada de lado. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: あの… もう タメ口[ぐち] で いい よ。
    meaning:
      en: Um… plain talk is fine now.
      pt: Olha… pode falar normal comigo agora.
  - speaker: protagonist
    text: タメ口[ぐち]？ 本当[ほんとう] に いい です か。
    meaning:
      en: Plain talk? Is that really okay?
      pt: Falar normal? Pode mesmo?
  - speaker: kenta
    text: うん、 いい よ。 同[おな]じ 年[とし] ぐらい だし。
    meaning:
      en: Yeah, sure. We're about the same age.
      pt: Aham, pode. A gente tem quase a mesma idade.
  - speaker: protagonist
    text: じゃあ… 健太[けんた] くん、 今日[きょう] 何[なに] する？
    meaning:
      en: Then… Kenta, what are you doing today?
      pt: Então… Kenta, o que você vai fazer hoje?
  - speaker: kenta
    text: 暇[ひま] だ よ。 映画[えいが] 見[み]る？
    meaning:
      en: I'm free. Want to see a film?
      pt: Estou à toa. Vamos ver um filme?
  - speaker: protagonist
    text: うん、 見[み]る！ その 後[あと]、 一緒[いっしょ] に 食[た]べる？
    meaning:
      en: Yeah, let's! After that, eat together?
      pt: Vamos! Depois, a gente come junto?
  - speaker: kenta
    text: いい ね。 駅[えき] の 前[まえ] に 行[い]く？
    meaning:
      en: Nice. Shall we go to the front of the station?
      pt: Boa. Vamos para a frente da estação?
  - speaker: protagonist
    text: うん。 あ、 でも 課長[かちょう] に は タメ口[ぐち] は だめ だ よ ね。
    meaning:
      en: Yeah. Oh, but with the section chief, no plain talk, right?
      pt: Vamos. Ah, mas com a chefe não pode falar assim, né?
  - speaker: kenta
    text: うん、 絶対[ぜったい] だめ。
    meaning:
      en: Right, absolutely not.
      pt: É, de jeito nenhum.
- type: narrator
  text:
    en: 'Until now you used «です» and «ます» with everyone: the polite form. Among friends of the same age, Japanese drops it. That is «タメ口[ぐち]» — talk between equals. The other person offers it; you don''t
      start it.'
    pt: 'Até agora você usou «です» e «ます» com todo mundo: a forma educada. Entre amigos da mesma idade, o japonês deixa isso de lado. Isso é «タメ口[ぐち]» — fala de igual para igual. É o outro que oferece; não
      é você que começa.'
