- type: narrator
  text:
    en: 'The plain form of a verb is the one in the dictionary: «行[い]きます» → «行[い]く», «食[た]べます» → «食[た]べる», «見[み]ます» → «見[み]る». With a rising voice it becomes a question: «見[み]る？» — want to watch?'
    pt: 'A forma simples do verbo é a do dicionário: «行[い]きます» → «行[い]く», «食[た]べます» → «食[た]べる», «見[み]ます» → «見[み]る». Com a voz subindo vira pergunta: «見[み]る？» — quer ver?'
