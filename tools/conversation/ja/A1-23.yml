- type: narrator
  text:
    en: Plain form is for friends, younger people and family — never for the chief, customers or the landlady. «くん» after a young man's name is friendly; «さん» is always safe.
    pt: A forma simples é para amigos, gente mais nova e família — nunca para a chefe, clientes ou a dona do apartamento. «くん» depois do nome de um rapaz é amigável; «さん» é sempre seguro.
