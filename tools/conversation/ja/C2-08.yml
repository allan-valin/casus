steps:
- type: narrator
  text:
    en: Ishida-sensei's reading circle has finished Natsume Sōseki's “Kokoro” (1914, public domain). Everyone talks about the ending — and the silences. Listen to the conversation; you don't need to understand
      it yet.
    pt: O clube de leitura do professor Ishida terminou «Kokoro», de Natsume Sōseki (1914, domínio público). Todos falam do final — e dos silêncios. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kouza-sensei
    text: 夏目[なつめ] 漱石[そうせき] の『こころ』、 結末[けつまつ] は どう でした か。
    meaning:
      en: How did you find the ending of Natsume Sōseki's “Kokoro”?
      pt: O que acharam do desfecho de «Kokoro», de Natsume Sōseki?
  - speaker: protagonist
    text: 最後[さいご] は 先生[せんせい] の 手紙[てがみ] で 終[お]わります が、 その 後[あと] が 書[か]かれて いない の が 印象[いんしょう] に 残[のこ]りました。
    meaning:
      en: It ends with Sensei's letter, but what stayed with me is that what happens next isn't written.
      pt: Termina com a carta do Sensei, mas o que ficou na memória foi que o que vem depois não está escrito.
  - speaker: kouza-sensei
    text: それ が 余韻[よいん] です。 日本[にほん] の 小説[しょうせつ] は、 書[か]かれて いない こと で 語[かた]る こと が 多[おお]い。
    meaning:
      en: That's yoin, the lingering feeling. Japanese novels often speak through what isn't written.
      pt: Isso é yoin, o que fica ressoando. O romance japonês muitas vezes fala pelo que não está escrito.
  - speaker: protagonist
    text: 登場[とうじょう] 人物[じんぶつ] は みんな、 孤独[こどく] な 心[こころ] を 持[も]って いる よう に 感[かん]じました。
    meaning:
      en: I felt all the characters had lonely hearts.
      pt: Senti que todos os personagens tinham um coração solitário.
  - speaker: kouza-sensei
    text: いい 解釈[かいしゃく] です ね。 主人公[しゅじんこう] の「私[わたし]」 に ついて は？
    meaning:
      en: A good interpretation. And the narrator, “I”?
      pt: Boa interpretação. E o narrador, o «eu»?
  - speaker: protagonist
    text: 外国[がいこく] から 来[き]た 私[わたし] も、 先生[せんせい] の 沈黙[ちんもく] を 理解[りかい] しよう と する「私[わたし]」 に 似[に]て いる と 思[おも]いました。
    meaning:
      en: I thought I, coming from abroad, am like that “I” trying to understand Sensei's silence.
      pt: Achei que eu, vindo de fora, pareço com aquele «eu» tentando entender o silêncio do Sensei.
  - speaker: kouza-sensei
    text: 文学[ぶんがく] は、 読[よ]む 人[ひと] の 人生[じんせい] に よって 変[か]わる もの です。
    meaning:
      en: Literature changes according to the life of the person reading it.
      pt: A literatura muda conforme a vida de quem lê.
  - speaker: protagonist
    text: 次[つぎ] は 原文[げんぶん] で もう 一度[いちど] 読[よ]んで みます。
    meaning:
      en: Next I'll try reading it again in the original.
      pt: Da próxima vez vou ler de novo no original.
