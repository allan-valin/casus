    en: 'Literary talk has its own words: «登場[とうじょう] 人物[じんぶつ]», «主人公[しゅじんこう]», «結末[けつまつ]», «解釈[かいしゃく]». «余韻[よいん]» — the resonance after a bell stops — is a central value: what a story leaves unsaid can
      matter more than what it says.'
    pt: 'A conversa literária tem palavras próprias: «登場[とうじょう] 人物[じんぶつ]», «主人公[しゅじんこう]», «結末[けつまつ]», «解釈[かいしゃく]». O «余韻[よいん]» — a ressonância depois que o sino para — é um valor central: o que a história
      deixa sem dizer pode importar mais do que o que diz.'
