steps:
- type: narrator
  text:
    en: You and Shota are looking for a flat together. At the estate agent's, the first-month costs add up fast. Listen to the conversation; you don't need to understand it yet.
    pt: Você e o Shota estão procurando um apartamento juntos. Na imobiliária, os custos de entrada somam rápido. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: fudousan
    text: こちら の 物件[ぶっけん]、 間取[まど]り は 二[に] LDK です。 初期[しょき] 費用[ひよう] は 敷金[しききん] を はじめ、 礼金[れいきん]、 仲介[ちゅうかい] 手数料[てすうりょう] など です。
    meaning:
      en: This place is a 2LDK. Move-in costs include, starting with the deposit, key money, agency fee and so on.
      pt: Este imóvel tem planta 2LDK. Os custos de entrada incluem, a começar pela caução, as luvas, a taxa da imobiliária etc.
  - speaker: protagonist
    text: 礼金[れいきん] は 戻[もど]って こない ん です よね。
    meaning:
      en: Key money doesn't come back, right?
      pt: As luvas não voltam, né?
  - speaker: fudousan
    text: はい、 大家[おおや] さん へ の お礼[れい] です から。 敷金[しききん] は 退去[たいきょ] の 時[とき] に 原状[げんじょう] 回復[かいふく] の 費用[ひよう] を 引[ひ]いて 返[かえ]します。
    meaning:
      en: Right, it's a thank-you to the landlord. The deposit is returned when you move out, minus repair costs.
      pt: Isso, é um agradecimento ao proprietário. A caução volta na saída, descontado o custo de devolver como estava.
  - speaker: shota
    text: 保証人[ほしょうにん] は 必要[ひつよう] です か。
    meaning:
      en: Do we need a guarantor?
      pt: Precisa de fiador?
  - speaker: fudousan
    text: 保証[ほしょう] 会社[がいしゃ] を 使[つか]えば、 保証人[ほしょうにん] は 要[い]りません。
    meaning:
      en: If you use a guarantor company, you don't need a guarantor.
      pt: Usando uma empresa fiadora, não precisa.
  - speaker: protagonist
    text: 契約[けいやく] 期間[きかん] は？
    meaning:
      en: And the contract period?
      pt: E o prazo do contrato?
  - speaker: fudousan
    text: 二年[にねん] です。 更新[こうしん] の 時[とき] に 更新料[こうしんりょう] が かかります。
    meaning:
      en: Two years. There's a renewal fee when you renew.
      pt: Dois anos. Na renovação, cobra-se uma taxa.
  - speaker: protagonist
    text: 契約書[けいやくしょ] を 家[いえ] で ゆっくり 読[よ]んで から、 決[き]めます。
    meaning:
      en: We'll read the contract at home carefully, then decide.
      pt: Vamos ler o contrato com calma em casa e depois decidimos.
