- type: narrator
  text:
    en: 'Renting in Japan has costs Brazilians don''t expect: «礼金[れいきん]», key money, a gift to the landlord that never comes back; «敷金[しききん]», a deposit returned minus repairs; agency fees; and every two
      years a «更新料[こうしんりょう]». Some flats have no key money — always check the contract and ask what the deposit covers.'
    pt: 'Alugar no Japão tem custos que o brasileiro não espera: «礼金[れいきん]», as luvas, um presente ao proprietário que nunca volta; «敷金[しききん]», uma caução devolvida menos os reparos; a taxa da imobiliária;
      e a cada dois anos uma «更新料[こうしんりょう]». Alguns imóveis não cobram luvas — sempre leia o contrato e pergunte o que a caução cobre.'
- type: narrator
