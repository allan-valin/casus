- type: narrator
  text:
    en: On trains and buses phones are on silent ('manner mode'), no calls, quiet voices. Priority seats near the doors are for elderly, pregnant and disabled people; near them, phones should even be switched
      off on some lines.
    pt: Em trens e ônibus o celular fica no silencioso ('manner mode'), sem ligações, vozes baixas. Os assentos preferenciais perto das portas são para idosos, grávidas e pessoas com deficiência; perto
      deles, em algumas linhas, o celular deve até ficar desligado.
