- type: narrator
  text:
    en: 'Negative polite verbs end in «ません»: «できます» — can, «できません» — can''t; «話[はな]します» — talk, «話[はな]しません» — don''t talk.'
    pt: 'Os verbos educados no negativo terminam em «ません»: «できます» — pode, «できません» — não pode; «話[はな]します» — falo, «話[はな]しません» — não falo.'
