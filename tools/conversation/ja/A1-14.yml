steps:
- type: narrator
  text:
    en: A full train in the morning. Your phone rings loudly. An elderly woman looks at you. Listen to the conversation; you don't need to understand it yet.
    pt: Trem cheio de manhã. Seu celular toca alto. Uma senhora idosa olha para você. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: obaasan
    text: …
    meaning:
      en: (silence — a look)
      pt: (silêncio — um olhar)
  - speaker: protagonist
    text: すみません！ 失礼[しつれい] しました。
    meaning:
      en: Sorry! Excuse me.
      pt: Desculpe! Perdão.
  - speaker: obaasan
    text: 電車[でんしゃ] で は 電話[でんわ] は できません よ。
    meaning:
      en: You can't make calls on the train.
      pt: No trem não se fala ao telefone.
  - speaker: protagonist
    text: はい。 マナー モード に します。
    meaning:
      en: Yes. I'll put it on silent.
      pt: Sim. Vou pôr no silencioso.
  - speaker: obaasan
    text: 日本[にほん] の 電車[でんしゃ] は 静[しず]か です から ね。
    meaning:
      en: Japanese trains are quiet, you see.
      pt: Os trens japoneses são silenciosos, sabe.
  - speaker: protagonist
    text: ブラジル で は みんな 話[はな]します。
    meaning:
      en: In Brazil everyone talks.
      pt: No Brasil todo mundo conversa.
  - speaker: obaasan
    text: そう です か。 気[き] に しないで。 昔[むかし] は 私[わたし] も うるさかった です。
    meaning:
      en: Is that so. Don't worry. I was loud too, long ago.
      pt: É mesmo? Não se preocupe. Antigamente eu também era barulhenta.
  - speaker: protagonist
    text: ありがとう ございます。 静[しず]か に します。
    meaning:
      en: Thank you. I'll be quiet.
      pt: Obrigado. Vou ficar quieto.
