steps:
- type: narrator
  text:
    en: 'The factory''s year-end party has an amateur manzai contest. You and Kenta enter as a double act: the Brazilian as the fool, Kenta as the straight man. Listen to the conversation; you don''t need
      to understand it yet.'
    pt: 'A festa de fim de ano da fábrica tem um concurso amador de manzai. Você e o Kenta entram como dupla: o brasileiro faz o bobo, o Kenta faz o escada. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: kenta
    text: どうも ー！ ブラジル と 浜松[はままつ] の コンビ です！
    meaning:
      en: Hellooo! We're the Brazil–Hamamatsu duo!
      pt: Olááá! Somos a dupla Brasil–Hamamatsu!
  - speaker: protagonist
    text: 僕[ぼく] は 日本[にほん] に 来[き]て、 お箸[はし] の 使[つか]い方[かた] が 一番[いちばん] 上手[じょうず] に なりました。 納豆[なっとう] も 箸[はし] で 一粒[ひとつぶ] ずつ 食[た]べます。
    meaning:
      en: Since coming to Japan, the thing I got best at is chopsticks. I eat natto one bean at a time.
      pt: Desde que vim ao Japão, o que eu mais aprendi foi usar hashi. Como natto um grão de cada vez.
  - speaker: kenta
    text: なんで やねん！ 一晩[ひとばん] かかる わ！
    meaning:
      en: What the heck! That'd take all night!
      pt: Como assim?! Vai levar a noite toda!
  - speaker: protagonist
    text: 健太[けんた] さん は 日本人[にほんじん] の くせ に、 納豆[なっとう] が 食[た]べられない ん です よ。
    meaning:
      en: And Kenta here can't even eat natto, even though he's Japanese.
      pt: E o Kenta, sendo japonês, nem consegue comer natto.
  - speaker: kenta
    text: それ は 秘密[ひみつ] やろ！ 西[にし] の 方[ほう] の 人[ひと] は 苦手[にがて] な 人[ひと] が 多[おお]い ねん！
    meaning:
      en: That was a secret! Lots of people in western Japan can't stand it!
      pt: Isso era segredo! Muita gente do oeste do Japão não suporta!
  - speaker: protagonist
    text: …ウケた！ みんな 笑[わら]って る。
    meaning:
      en: …It went down well! Everyone's laughing.
      pt: …Fez sucesso! Todo mundo está rindo.
  - speaker: kenta
    text: 間[ま] が よかった。 最初[さいしょ] の ネタ は 滑[すべ]る と 思[おも]った けど。
    meaning:
      en: The timing was good. I thought the first bit would fall flat.
      pt: O timing foi bom. Achei que a primeira piada ia cair no vazio.
  - speaker: protagonist
    text: 最高[さいこう] の 相方[あいかた] だ ね。
    meaning:
      en: You're the best comedy partner.
      pt: Você é o melhor parceiro de dupla.
