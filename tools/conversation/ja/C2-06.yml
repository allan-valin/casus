- type: narrator
  text:
    en: 'Manzai is built on «ボケ» and «ツッコミ»: the fool says something absurd, the straight man corrects him sharply, often in Kansai dialect — «なんで やねん», «〜やろ», «〜ねん». Timing, «間[ま]», is everything. Natto,
      the sticky fermented beans, really is disliked by many people from western Japan.'
    pt: 'O manzai se baseia em «ボケ» e «ツッコミ»: o bobo diz um absurdo, o escada corrige seco, muitas vezes no dialeto do Kansai — «なんで やねん», «〜やろ», «〜ねん». O timing, «間[ま]», é tudo. O natto, o feijão fermentado
      e grudento, é mesmo detestado por muita gente do oeste do Japão.'
- type: narrator
  for:
  - pt
  text:
    pt: 'A dupla bobo e escada é velha conhecida: Os Trapalhões, os palhaços de circo. O manzai é a mesma ideia, com ritmo de metralhadora e tapa na cabeça.'
