- type: narrator
  text:
    en: 'Portuguese traders and missionaries reached Japan in 1543 and left words still used today: «パン» from pão, «タバコ» from tabaco, «カルタ» from carta, «ボタン» from botão. «ありがとう», though, is older Japanese,
      from «有[あ]り難[がた]い» — rare, precious — not from obrigado.'
    pt: 'Comerciantes e missionários portugueses chegaram ao Japão em 1543 e deixaram palavras usadas até hoje: «パン» de pão, «タバコ» de tabaco, «カルタ» de carta, «ボタン» de botão. Já «ありがとう» é japonês mais antigo,
      de «有[あ]り難[がた]い» — raro, precioso — e não vem de obrigado.'
- type: narrator
  for:
  - pt
  text:
    pt: O português foi a primeira língua europeia a chegar ao Japão. Quando você pede «パン» na padaria da Maria, está falando a palavra que os navegantes levaram há quase 500 anos.
