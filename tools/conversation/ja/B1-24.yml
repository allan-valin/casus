steps:
- type: narrator
  text:
    en: 'Aya is surprised that you learned three scripts in a year. Then you surprise her: some Japanese words came from Portuguese. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'A Aya fica surpresa porque você aprendeu três escritas em um ano. Aí você surpreende ela: algumas palavras japonesas vieram do português. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: aya
    text: 一年[いちねん] で ひらがな も カタカナ も 漢字[かんじ] も？ すごい！
    meaning:
      en: Hiragana, katakana and kanji in a year? Amazing!
      pt: Hiragana, katakana e kanji em um ano? Demais!
  - speaker: protagonist
    text: 漢字[かんじ] は まだ まだ。 だから 毎日[まいにち] 十[じゅう] 個[こ] 覚[おぼ]える こと に した。
    meaning:
      en: Kanji, not yet. So I decided to learn ten a day.
      pt: Kanji, ainda falta. Por isso decidi aprender dez por dia.
  - speaker: aya
    text: えらい！ 日本語[にほんご] の 文字[もじ] は 三[みっ]つ も ある から ね。
    meaning:
      en: Good for you! Japanese has three scripts, after all.
      pt: Muito bem! O japonês tem três escritas, né?
  - speaker: protagonist
    text: でも 知[し]って た？ パン は ポルトガル語[ご] から 来[き]た 外来語[がいらいご] だ よ。
    meaning:
      en: But did you know? Pan is a loanword from Portuguese.
      pt: Mas você sabia? Pan é uma palavra que veio do português.
  - speaker: aya
    text: え、 パン が？ 知[し]らなかった！
    meaning:
      en: What, pan? I didn't know!
      pt: Quê, pan? Eu não sabia!
  - speaker: protagonist
    text: タバコ も カルタ も ボタン も そう。 ポルトガル の 船[ふね] が 来[き]た 時代[じだい] の 言葉[ことば]。
    meaning:
      en: Tabako, karuta and botan too. Words from when the Portuguese ships came.
      pt: Tabako, karuta e botan também. Palavras da época em que os navios portugueses chegaram.
  - speaker: aya
    text: 語源[ごげん] って 面白[おもしろ]い ね。 歴史[れきし] が 見[み]える。
    meaning:
      en: Word origins are fun. You can see history in them.
      pt: Origem das palavras é interessante. Dá para ver a história.
  - speaker: protagonist
    text: ありがとう は オブリガード から？ って よく 聞[き]かれる けど、 それ は 違[ちが]う らしい。
    meaning:
      en: People often ask if arigatō comes from obrigado, but apparently it doesn't.
      pt: Sempre me perguntam se arigatō vem de obrigado, mas parece que não.
