- type: narrator
  text:
    en: 'Couples quarrel quietly in Japanese: short messages, «別[べつ] に», «大丈夫[だいじょうぶ]» that doesn''t mean okay. Apologise plainly — «本当[ほんとう] に ごめん» — don''t over-explain, and offer a way to make up.'
    pt: 'Os casais japoneses brigam baixinho: mensagens curtas, «別[べつ] に», um «大丈夫[だいじょうぶ]» que não quer dizer tudo bem. Peça desculpas sem rodeio — «本当[ほんとう] に ごめん» —, não explique demais, e proponha fazer
      as pazes.'
- type: narrator
