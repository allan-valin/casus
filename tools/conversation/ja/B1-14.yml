steps:
- type: narrator
  text:
    en: You forgot your date with Yui and went to futsal. Her messages are short. You call her. Listen to the conversation; you don't need to understand it yet.
    pt: Você esqueceu o encontro com a Yui e foi jogar futsal. As mensagens dela estão curtas. Você liga. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 由衣[ゆい]、 怒[おこ]って る？
    meaning:
      en: Yui, are you angry?
      pt: Yui, você está brava?
  - speaker: yui
    text: …約束[やくそく]、 忘[わす]れた でしょ。 一時間[いちじかん] 待[ま]って いた のに。
    meaning:
      en: …You forgot our date, didn't you. And I waited an hour.
      pt: …Você esqueceu o nosso compromisso, né? E eu esperando uma hora.
  - speaker: protagonist
    text: 本当[ほんとう] に ごめん。 フットサル に 行[い]って しまった。
    meaning:
      en: I'm really sorry. I went to futsal.
      pt: Desculpa mesmo. Acabei indo para o futsal.
  - speaker: yui
    text: ひどい。 連絡[れんらく] も なかった。
    meaning:
      en: That's awful. You didn't even message.
      pt: Que horrível. Nem avisou.
  - speaker: protagonist
    text: 携帯[けいたい] を 見[み]なかった。 言[い]い訳[わけ] だ けど…
    meaning:
      en: I didn't look at my phone. It's an excuse, but…
      pt: Não olhei o celular. É desculpa, mas…
  - speaker: yui
    text: 私[わたし] の こと、 もっと 大事[だいじ] に して。 寂[さび]しかった。
    meaning:
      en: Treat me as more important. I felt lonely.
      pt: Me dá mais valor. Eu me senti sozinha.
  - speaker: protagonist
    text: わかった。 明日[あした]、 会[あ]えない？ 仲直[なかなお]り したい。
    meaning:
      en: Okay. Can we meet tomorrow? I want to make up.
      pt: Entendi. A gente se vê amanhã? Quero fazer as pazes.
  - speaker: yui
    text: …いい よ。 でも 今度[こんど] は 遅[おく]れない で ね。
    meaning:
      en: …Okay. But this time don't be late.
      pt: …Tá bom. Mas dessa vez não se atrasa, hein.
