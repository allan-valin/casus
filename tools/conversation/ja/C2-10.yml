steps:
- type: narrator
  text:
    en: You propose changing a long-standing procedure in a meeting. Afterwards Takahashi-buchō answers with proverbs — and some advice. Listen to the conversation; you don't need to understand it yet.
    pt: Você propõe mudar um procedimento antigo numa reunião. Depois o chefe Takahashi responde com provérbios — e um conselho. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: buchou
    text: 今日[きょう] の 提案[ていあん]、 いい 改善[かいぜん] 案[あん] だった。 でも 反対[はんたい] も 多[おお]かった ね。
    meaning:
      en: Today's proposal was a good improvement. But there was a lot of opposition.
      pt: A proposta de hoje foi uma boa melhoria. Mas teve muita oposição.
  - speaker: protagonist
    text: 「前例[ぜんれい] が ない」 と 言[い]われました。 出[で]る 杭[くい] は 打[う]たれる、 です ね。
    meaning:
      en: They said “there's no precedent”. The nail that sticks out gets hammered.
      pt: Disseram que «não tem precedente». O prego que se destaca leva martelada.
  - speaker: buchou
    text: そう 感[かん]じた か。 でも「急[いそ]がば 回[まわ]れ」 だ よ。 根回[ねまわ]し から やり直[なお]そう。
    meaning:
      en: You felt that, did you. But “more haste, less speed”. Let's start again from the groundwork.
      pt: Você sentiu isso, né? Mas «devagar se vai ao longe». Vamos recomeçar pelo nemawashi.
  - speaker: protagonist
    text: 石橋[いしばし] を 叩[たた]いて 渡[わた]る、 です ね。
    meaning:
      en: Tap the stone bridge before crossing, then.
      pt: Testar a ponte antes de atravessar, então.
  - speaker: buchou
    text: ははは、 ことわざ で 返[かえ]して くる と は。 さすが だ。
    meaning:
      en: Ha ha, answering me with a proverb. Impressive.
      pt: Rá, me respondendo com provérbio. Muito bem.
  - speaker: protagonist
    text: 鈴木[すずき] さん に 習[なら]いました。 七転[ななころ]び 八起[やお]き の 気持[きも]ち で、 もう 一度[いちど] 挑戦[ちょうせん] します。
    meaning:
      en: I learned from Mrs Suzuki. In the spirit of “fall seven times, rise eight”, I'll try again.
      pt: Aprendi com a senhora Suzuki. No espírito de «cair sete vezes, levantar oito», vou tentar de novo.
  - speaker: buchou
    text: ことわざ は 適切[てきせつ] な 時[とき] に 使[つか]う と、 心[こころ] に 響[ひび]く。 君[きみ] は もう 使[つか]い 方[かた] を 知[し]って いる。
    meaning:
      en: Used at the right moment, a proverb strikes a chord. You already know how.
      pt: Usado no momento certo, o provérbio toca fundo. Você já sabe usar.
  - speaker: protagonist
    text: では、 次[つぎ] の 会議[かいぎ] まで に 話[はなし] を まとめて おきます。
    meaning:
      en: Then I'll have everything summed up before the next meeting.
      pt: Então até a próxima reunião deixo tudo resumido.
