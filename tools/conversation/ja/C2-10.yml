    en: 'Proverbs at work are a quick, shared shorthand: «出[で]る 杭[くい] は 打[う]たれる» names the pressure to conform; «急[いそ]がば 回[まわ]れ» and «石橋[いしばし] を 叩[たた]いて 渡[わた]る» recommend caution; «七転[ななころ]び 八起[やお]き» encourages
      persistence. Answering a proverb with another is a sign of real fluency.'
