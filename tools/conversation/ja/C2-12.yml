  text:
    en: 'Hamamatsu has Brazilian supermarkets, bakeries, restaurants, churches and schools, many opened by former factory workers. Foreigners can open a business in Japan, but the visa matters: permanent
      residents and spouses of Japanese nationals can do so freely; others may need a business-manager status.'
