steps:
- type: narrator
  text:
    en: Lucas, now fluent and N1, wants to open a Brazilian snack shop near the station. He asks you to look at his business plan with him. Listen to the conversation; you don't need to understand it yet.
    pt: O Lucas, agora fluente e com N1, quer abrir uma lanchonete brasileira perto da estação. Ele pede para você olhar o plano de negócios com ele. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: lucas
    text: 駅前[えきまえ] で コシーニャ と パステル の 店[みせ] を 開業[かいぎょう] したい ん だ。
    meaning:
      en: I want to open a coxinha and pastel shop by the station.
      pt: Quero abrir uma loja de coxinha e pastel perto da estação.
  - speaker: protagonist
    text: いい ね。 資金[しきん] は どう する の？
    meaning:
      en: Nice. What about funding?
      pt: Que legal. E o capital?
  - speaker: lucas
    text: 銀行[ぎんこう] の 融資[ゆうし] を 申[もう]し込[こ]む。 事業[じぎょう] 計画[けいかく] 書[しょ] を 見[み]て くれる？
    meaning:
      en: I'll apply for a bank loan. Will you look at my business plan?
      pt: Vou pedir financiamento no banco. Você olha o meu plano de negócios?
  - speaker: protagonist
    text: 顧客[こきゃく] は ブラジル 人[じん] だけ？ 日本人[にほんじん] も 狙[ねら]う なら、 メニュー は 日本語[にほんご] も 必要[ひつよう] だ よ。
    meaning:
      en: Is your clientele only Brazilians? If you're aiming at Japanese customers too, you need a Japanese menu.
      pt: A clientela é só brasileira? Se quiser pegar japonês também, precisa de cardápio em japonês.
  - speaker: lucas
    text: 両方[りょうほう]。 でも 競合[きょうごう] の 店[みせ] も ある し、 リスク が 心配[しんぱい]。
    meaning:
      en: Both. But there are competing shops, and I'm worried about the risk.
      pt: Os dois. Mas tem loja concorrente, e me preocupo com o risco.
  - speaker: protagonist
    text: やって みない こと に は、 わからない。 最初[さいしょ] の 常連[じょうれん] は 僕[ぼく] と 健太[けんた] だ。
    meaning:
      en: Unless you try, you won't know. Your first regulars are me and Kenta.
      pt: Sem tentar, não dá para saber. Os primeiros clientes fiéis somos eu e o Kenta.
  - speaker: lucas
    text: ははは。 仕入[しい]れ は マリア さん の パン屋[や] と 協力[きょうりょく] する つもり。
    meaning:
      en: Ha ha. For supplies I plan to team up with Maria's bakery.
      pt: Rá. Para a mercadoria, pretendo fazer parceria com a padaria da Maria.
  - speaker: protagonist
    text: やらまいか、 だ ね。
    meaning:
      en: Yaramaika, then.
      pt: Yaramaika, então.
