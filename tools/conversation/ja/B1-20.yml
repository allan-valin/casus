- type: narrator
  text:
    en: Lost wallets in Japan are very often handed in, money and all, at a «交番[こうばん]» or the station office. The finder may claim a reward of 5 to 20 % by law, and many don't. Go to the nearest kōban or
      file a report online.
    pt: Carteiras perdidas no Japão muitas vezes são entregues, com dinheiro e tudo, num «交番[こうばん]» ou no escritório da estação. Por lei quem achou pode pedir uma recompensa de 5 a 20 %, e muitos nem pedem.
      Vá ao posto policial mais próximo ou registre pela internet.
