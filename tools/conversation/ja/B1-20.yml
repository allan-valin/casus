steps:
- type: narrator
  text:
    en: Your wallet is gone — cash, residence card, everything. Panicked, you go to the police box by the station. Listen to the conversation; you don't need to understand it yet.
    pt: Sua carteira sumiu — dinheiro, cartão de residência, tudo. Em pânico, você vai ao posto policial da estação. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: すみません、 財布[さいふ] を なくしました。
    meaning:
      en: Excuse me, I've lost my wallet.
      pt: Com licença, perdi minha carteira.
  - speaker: omawari
    text: どこ で なくしました か。
    meaning:
      en: Where did you lose it?
      pt: Onde perdeu?
  - speaker: protagonist
    text: わかりません。 駅[えき] の どこ か です。 誰[だれ] も 見[み]て いない と 思[おも]います。
    meaning:
      en: I don't know. Somewhere in the station. I don't think anyone saw.
      pt: Não sei. Em algum lugar da estação. Acho que ninguém viu.
  - speaker: omawari
    text: ちょっと 待[ま]って ください。 …赤[あか]い 財布[さいふ] です か。
    meaning:
      en: Please wait a moment. …Is it a red wallet?
      pt: Espere um pouco. …É uma carteira vermelha?
  - speaker: protagonist
    text: はい！ それ です！
    meaning:
      en: Yes! That's it!
      pt: Sim! É essa!
  - speaker: omawari
    text: 三十分[さんじゅっぷん] 前[まえ] に、 誰[だれ] か が 届[とど]けて くれました。 中身[なかみ] を 確認[かくにん] して ください。
    meaning:
      en: Someone handed it in thirty minutes ago. Please check the contents.
      pt: Alguém entregou há trinta minutos. Confira o que tem dentro, por favor.
  - speaker: protagonist
    text: お金[かね] も カード も 全部[ぜんぶ] あります。 何[なに] も なくなって いません。 信[しん]じられない！
    meaning:
      en: The money and the cards are all here. Nothing's missing. I can't believe it!
      pt: O dinheiro e os cartões estão todos aqui. Não sumiu nada. Não acredito!
  - speaker: omawari
    text: 日本[にほん] で は よく ある こと です よ。 気[き] を つけて ください ね。
    meaning:
      en: It happens a lot in Japan. Do be careful.
      pt: No Japão isso é comum. Tome cuidado, viu.
