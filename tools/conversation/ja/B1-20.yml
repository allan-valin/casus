- type: narrator
  text:
    en: 'Question words plus «か» are some-: «誰[だれ] か», someone; «どこ か», somewhere; «何[なに] か», something. Plus «も» with a negative verb, they''re no-: «誰[だれ] も 見[み]て いない», nobody saw; «何[なに] も ない», nothing.'
    pt: 'Palavras interrogativas mais «か» são algum: «誰[だれ] か», alguém; «どこ か», em algum lugar; «何[なに] か», alguma coisa. Mais «も» com verbo negativo, são nenhum: «誰[だれ] も 見[み]て いない», ninguém viu; «何[なに]
      も ない», nada.'
