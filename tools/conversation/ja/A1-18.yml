steps:
- type: narrator
  text:
    en: Mrs Suzuki teaches you to cook rice and miso soup in her kitchen. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Suzuki ensina você a fazer arroz e missoshiru na cozinha dela. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: まず、 お米[こめ] を 洗[あら]って ください。
    meaning:
      en: First, please wash the rice.
      pt: Primeiro, lave o arroz.
  - speaker: protagonist
    text: 何回[なんかい] です か。
    meaning:
      en: How many times?
      pt: Quantas vezes?
  - speaker: suzuki
    text: 三回[さんかい] ぐらい。 水[みず] が きれい に なります。
    meaning:
      en: About three times. The water turns clear.
      pt: Umas três vezes. A água fica limpa.
  - speaker: protagonist
    text: ブラジル で は 油[あぶら] と にんにく で 炊[た]きます。
    meaning:
      en: In Brazil we cook it with oil and garlic.
      pt: No Brasil a gente faz com óleo e alho.
  - speaker: suzuki
    text: へえ、 おいしそう。 日本[にほん] は 水[みず] だけ です。 炊飯器[すいはんき] に 入[い]れて ください。
    meaning:
      en: Oh, sounds tasty. In Japan it's just water. Put it in the rice cooker.
      pt: Ah, parece gostoso. No Japão é só água. Coloque na panela de arroz.
  - speaker: protagonist
    text: 味噌汁[みそしる] は？
    meaning:
      en: And the miso soup?
      pt: E o missoshiru?
  - speaker: suzuki
    text: お湯[ゆ] に 味噌[みそ] と 豆腐[とうふ]。 見[み]て ください、 簡単[かんたん] でしょう？
    meaning:
      en: Miso and tofu in hot water. Look, it's easy, isn't it?
      pt: Missô e tofu na água quente. Olhe, é fácil, não é?
  - speaker: protagonist
    text: 本当[ほんとう] に 簡単[かんたん] です ね！
    meaning:
      en: It really is easy!
      pt: É fácil mesmo!
