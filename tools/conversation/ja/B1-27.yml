- type: narrator
  text:
    en: 'Japanese stand-up, «漫才[まんざい]», is a pair: the «ボケ» says something silly, the «ツッコミ» hits back — often «なんで やねん！» in Osaka dialect, with a slap on the shoulder. Friends play the roles in everyday
      talk, too.'
    pt: 'O stand-up japonês, «漫才[まんざい]», é em dupla: o «ボケ» fala uma bobagem, o «ツッコミ» rebate — muitas vezes com «なんで やねん！» no dialeto de Osaka, e um tapinha no ombro. Amigos fazem esses papéis no dia a
      dia também.'
