steps:
- type: narrator
  text:
    en: You arrive at futsal twenty minutes late, out of breath. Kenta greets you with a perfectly straight face. Listen to the conversation; you don't need to understand it yet.
    pt: Você chega ao futsal vinte minutos atrasada, sem fôlego. O Kenta te recebe com a cara mais séria do mundo. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: おお、 早[はや]い ね。 さすが。
    meaning:
      en: Oh, you're early. As expected.
      pt: Opa, chegou cedo, hein. Como sempre.
  - speaker: protagonist
    text: 早[はや]い？ 二十分[にじゅっぷん] 遅[おく]れた よ！
    meaning:
      en: Early? I'm twenty minutes late!
      pt: Cedo? Me atrasei vinte minutos!
  - speaker: kenta
    text: 冗談[じょうだん] だ よ。 皮肉[ひにく]。
    meaning:
      en: Just kidding. Irony.
      pt: É brincadeira. Ironia.
  - speaker: protagonist
    text: 真面目[まじめ] な 顔[かお] で 言[い]う から、 わからない よ。
    meaning:
      en: You say it with a straight face, so I can't tell.
      pt: Você fala com essa cara séria, aí não dá para saber.
  - speaker: kenta
    text: ブラジル で は 皮肉[ひにく] は ない の？
    meaning:
      en: Isn't there irony in Brazil?
      pt: No Brasil não tem ironia?
  - speaker: protagonist
    text: ある けど、 顔[かお] で わかる。 日本[にほん] の お笑[わら]い も 難[むずか]しい。
    meaning:
      en: There is, but you can tell from the face. Japanese comedy is hard too.
      pt: Tem, mas dá para ver pela cara. O humor japonês também é difícil.
  - speaker: kenta
    text: お笑[わら]い は ボケ と ツッコミ。 僕[ぼく] が ボケ たら、 「なんで やねん！」 って 言[い]って。
    meaning:
      en: Comedy is the fool and the comeback. When I play the fool, you say “nande yanen!”.
      pt: O humor é o bobo e a resposta. Quando eu faço o bobo, você diz «nande yanen!».
  - speaker: protagonist
    text: よかった ね… 遅[おく]れて も 練習[れんしゅう] に なった。
    meaning:
      en: Good for me… even late, I got some practice.
      pt: Que bom para mim… mesmo atrasada, deu para treinar.
- type: narrator
  text:
    en: 'Irony in Japanese lives in the tone: «さすが» is praise — as expected of you — but said flat, it means the opposite. «早[はや]い ね» to someone late, «よかった ね…» with a dead voice. Listen to the voice, not
      only the words.'
    pt: 'A ironia em japonês mora no tom: «さすが» é elogio — como era de se esperar de você — mas dito sem emoção, quer dizer o contrário. «早[はや]い ね» para quem chegou atrasado, «よかった ね…» com voz morta. Escute
      a voz, não só as palavras.'
