- type: narrator
  text:
    en: 'A request to a superior climbs the politeness ladder: «〜て ください» → «〜て いただけますか» → «〜て いただけません でしょう か», the most cautious — a negative question that leaves room to refuse. Proposals get softened
      too: «〜と いう 形[かたち] は いかが でしょう か», how about something like…?'
    pt: 'Um pedido a um superior sobe a escada da cortesia: «〜て ください» → «〜て いただけますか» → «〜て いただけません でしょう か», o mais cauteloso — uma pergunta negativa que deixa espaço para recusar. As propostas também se
      suavizam: «〜と いう 形[かたち] は いかが でしょう か», que tal algo como…?'
- type: prompt
  ask:
    en: 'Ask: would you kindly consider…'
    pt: 'Peça: o senhor poderia considerar…'
  answer:
