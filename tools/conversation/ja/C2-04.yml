steps:
- type: narrator
  text:
    en: Another company has offered you a job. You talk to Takahashi-buchō about your salary — carefully, so it doesn't sound like a threat. Listen to the conversation; you don't need to understand it yet.
    pt: Outra empresa ofereceu um emprego a você. Você conversa com o chefe Takahashi sobre o salário — com cuidado, para não soar como ameaça. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 部長[ぶちょう]、 少[すこ]し ご相談[そうだん] が ございます。 実[じつ] は、 他社[たしゃ] から お誘[さそ]い を いただきました。
    meaning:
      en: Sir, I have something to discuss. Actually, I've received an offer from another company.
      pt: Chefe, preciso conversar com o senhor. Na verdade, recebi uma proposta de outra empresa.
  - speaker: buchou
    text: そう か。 転職[てんしょく] を 考[かんが]えて いる の か。
    meaning:
      en: I see. Are you thinking of changing jobs?
      pt: Entendi. Você está pensando em mudar de emprego?
  - speaker: protagonist
    text: いいえ、 私[わたし] は この 会社[かいしゃ] で 働[はたら]き 続[つづ]けたい と 思[おも]って おります。 ただ、 今[いま] の 仕事[しごと] の 範囲[はんい] に 見合[みあ]う 給与[きゅうよ] を ご検討[けんとう] いただけません でしょう か。
    meaning:
      en: No, I'd like to keep working at this company. I only ask whether you might consider a salary that matches my current responsibilities.
      pt: Não, quero continuar trabalhando nesta empresa. Só gostaria de pedir que o senhor considerasse uma remuneração à altura das minhas responsabilidades atuais.
  - speaker: buchou
    text: 君[きみ] の 評価[ひょうか] は 高[たか]い。 ただ、 すぐ に 全額[ぜんがく] は 難[むずか]しい。
    meaning:
      en: Your evaluations are high. But the full amount straight away is difficult.
      pt: A sua avaliação é ótima. Mas o valor todo de uma vez é difícil.
  - speaker: protagonist
    text: では、 半分[はんぶん] を 今年[ことし]、 残[のこ]り を 来年[らいねん] の 評価[ひょうか] で、 と いう 形[かたち] は いかが でしょう か。
    meaning:
      en: Then how about half this year, and the rest based on next year's evaluation?
      pt: Então, que tal metade este ano e o resto conforme a avaliação do ano que vem?
  - speaker: buchou
    text: 間[あいだ] を 取[と]る わけ だ な。 その 妥協[だきょう] 案[あん] なら、 人事[じんじ] と 交渉[こうしょう] して みよう。
    meaning:
      en: So we meet in the middle. With that compromise, I'll try negotiating with HR.
      pt: Chegamos a um meio-termo, então. Com essa proposta de acordo, vou negociar com o RH.
  - speaker: protagonist
    text: ご配慮[はいりょ] いただき、 ありがとう ございます。 譲歩[じょうほ] して いただいた 分[ぶん]、 成果[せいか] で お返[かえ]し します。
    meaning:
      en: Thank you for your consideration. I'll repay your concession with results.
      pt: Agradeço a consideração. Vou retribuir a concessão com resultados.
  - speaker: buchou
    text: 期待[きたい] して いる よ。
    meaning:
      en: I'm counting on it.
      pt: Conto com isso.
