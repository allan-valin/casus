- type: narrator
  text:
    en: Salary talks are rare and delicate in Japanese companies. A job offer from elsewhere is mentioned as «ご相談[そうだん]», not as leverage; you state loyalty first, ask with «いただけません でしょう か», propose a middle
      way, and promise results. Pushing hard can backfire.
    pt: Conversas sobre salário são raras e delicadas nas empresas japonesas. Uma proposta de fora é mencionada como «ご相談[そうだん]», não como pressão; você declara lealdade primeiro, pede com «いただけません でしょう
      か», propõe um meio-termo e promete resultados. Pressionar demais pode sair pela culatra.
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil, mostrar a proposta de outra empresa é jogo aberto. No Japão, é preciso embrulhar em lealdade — a negociação existe, só que de luvas.
