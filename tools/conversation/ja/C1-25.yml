steps:
- type: narrator
  text:
    en: Maria asks you to interpret at her son's PTA meeting. Every parent must take a role; the roles are drawn by lot. Listen to the conversation; you don't need to understand it yet.
    pt: A Maria pede que você interprete na reunião da PTA da escola do filho. Todo pai e mãe tem que assumir um cargo; os cargos são sorteados. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: maria
    text: 今日[きょう] は PTA の 役員[やくいん] を 決[き]める 日[ひ] な の。 通訳[つうやく] して くれる？
    meaning:
      en: Today they choose the PTA officers. Will you interpret?
      pt: Hoje é o dia de escolher a diretoria da PTA. Você interpreta para mim?
  - speaker: protagonist
    text: もちろん、 通訳[つうやく] します。
    meaning:
      en: Of course, I'll interpret.
      pt: Claro, eu interpreto.
  - speaker: madoguchi
    text: では、 役員[やくいん] は くじ で 決[き]めます。 運動会[うんどうかい] の 担当[たんとう] は… ダビ くん の お母[かあ]さん です。
    meaning:
      en: Then we'll choose officers by drawing lots. In charge of sports day… Davi's mother.
      pt: Então os cargos serão sorteados. Responsável pela gincana esportiva… a mãe do Davi.
  - speaker: maria
    text: え、 私[わたし]？ 日本語[にほんご] の 書類[しょるい] も 多[おお]い のに…
    meaning:
      en: What, me? With all the paperwork in Japanese…
      pt: Quê, eu? Com tanta papelada em japonês…
  - speaker: protagonist
    text: みんな 一回[いっかい] は やる 決[き]まり みたい。 断[ことわ]れない わけ だ。
    meaning:
      en: It seems everyone has to do it once. So that's why you can't refuse.
      pt: Parece que todo mundo tem que fazer uma vez. Por isso não dá para recusar.
  - speaker: maria
    text: だから お母[かあ]さん たち、 いつも 忙[いそが]しい わけ ね。
    meaning:
      en: So that's why the mothers are always so busy.
      pt: Então é por isso que as mães vivem ocupadas.
  - speaker: protagonist
    text: 行事[ぎょうじ] の 準備[じゅんび] は 手伝[てつだ]う よ。 翻訳[ほんやく] も する から。
    meaning:
      en: I'll help prepare the events. And I'll translate too.
      pt: Eu ajudo a preparar os eventos. E traduzo também.
  - speaker: maria
    text: ありがとう！ これ で 学校[がっこう] の 日本人[にほんじん] の ママ 友[とも] も できる かも。
    meaning:
      en: Thank you! Maybe I'll make some Japanese mum friends at school this way.
      pt: Obrigada! Quem sabe assim eu faço amizade com as mães japonesas da escola.
