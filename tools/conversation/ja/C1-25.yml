- type: narrator
  text:
    en: Japanese PTAs run school events and patrols with parent volunteers, and many schools expect every family to serve once — often chosen by lot. It is a heavy load for working and foreign parents;
      some schools now make roles voluntary or lighter. Offering an interpreter or a translation is a real help.
    pt: As PTAs japonesas organizam eventos e rondas da escola com pais voluntários, e muitas escolas esperam que cada família sirva uma vez — muitas vezes por sorteio. É uma carga pesada para pais que
      trabalham e para estrangeiros; algumas escolas hoje tornaram os cargos voluntários ou mais leves. Oferecer intérprete ou tradução ajuda de verdade.
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil a reunião de pais é uma vez por bimestre e pronto. No Japão a PTA é quase um segundo emprego — e também a porta de entrada para fazer amigos japoneses.
