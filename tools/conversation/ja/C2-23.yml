- type: narrator
  text:
    en: 'Explaining an untranslatable word means triangulating with near neighbours: «懐[なつ]かしい» (fond nostalgia), «恋[こい]しい» (longing for someone absent), «切[せつ]ない» (an aching sweetness), and the classical
      aesthetic «物[もの] の 哀[あわ]れ» — the gentle sadness of things passing.'
    pt: 'Explicar uma palavra intraduzível é triangular com as vizinhas: «懐[なつ]かしい» (nostalgia carinhosa), «恋[こい]しい» (falta de alguém ausente), «切[せつ]ない» (um aperto doce) e a estética clássica «物[もの] の
      哀[あわ]れ» — a tristeza mansa das coisas que passam.'
