steps:
- type: narrator
  text:
    en: In Ishida-sensei's class you're asked to explain «saudade» to Japanese people. You reach for 懐かしい, 恋しい, 切ない — and 物の哀れ. Listen to the conversation; you don't need to understand it yet.
    pt: Na aula do professor Ishida pedem que você explique «saudade» para japoneses. Você recorre a 懐かしい, 恋しい, 切ない — e a 物の哀れ. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kouza-sensei
    text: ポルトガル語[ご] の「サウダージ」 を 日本語[にほんご] で 説明[せつめい] して ください。
    meaning:
      en: Please explain the Portuguese “saudade” in Japanese.
      pt: Explique a «saudade» do português em japonês, por favor.
  - speaker: protagonist
    text: 翻訳[ほんやく] できない 言葉[ことば] です が… 懐[なつ]かしい に 近[ちか]い です。 でも、 もっと 痛[いた]い 感情[かんじょう] です。
    meaning:
      en: It's an untranslatable word, but… it's close to natsukashii. Yet it's a more painful emotion.
      pt: É uma palavra intraduzível, mas… é próxima de natsukashii. Só que é uma emoção mais dolorida.
  - speaker: kouza-sensei
    text: では、「恋[こい]しい」 は？
    meaning:
      en: Then what about “koishii”?
      pt: E «koishii»?
  - speaker: protagonist
    text: 恋[こい]しい も 入[はい]って います。 会[あ]えない 人[ひと] を 思[おも]う 気持[きも]ち。 そして「切[せつ]ない」 も。
    meaning:
      en: Koishii is in it too — thinking of someone you can't see. And “setsunai” too.
      pt: Koishii também está dentro — pensar em alguém que não se pode ver. E «setsunai» também.
  - speaker: kouza-sensei
    text: 物[もの] の 哀[あわ]れ と 比[くら]べる と、 どう です か。
    meaning:
      en: How does it compare with mono no aware?
      pt: E comparando com mono no aware?
  - speaker: protagonist
    text: 物[もの] の 哀[あわ]れ は、 桜[さくら] の よう に 儚[はかな]い もの へ の 感動[かんどう] です ね。 サウダージ は、 失[うしな]った もの へ の 愛[あい] です。
    meaning:
      en: Mono no aware is being moved by fleeting things, like cherry blossoms. Saudade is love for what is lost.
      pt: Mono no aware é a emoção diante do que é efêmero, como as cerejeiras. Saudade é amor pelo que se perdeu.
  - speaker: kouza-sensei
    text: 見事[みごと] です。 ニュアンス が よく 伝[つた]わりました。
    meaning:
      en: Splendid. The nuance came across well.
      pt: Excelente. A nuance ficou bem clara.
  - speaker: protagonist
    text: 全部[ぜんぶ] 合[あ]わせた 気持[きも]ち が、 サウダージ かも しれません。
    meaning:
      en: Maybe saudade is all of these feelings put together.
      pt: Talvez a saudade seja todos esses sentimentos juntos.
