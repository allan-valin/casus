steps:
- type: narrator
  text:
    en: Dinner at Mrs Suzuki's with the evening news on. An election is coming. You ask about it — carefully. Listen to the conversation; you don't need to understand it yet.
    pt: Jantar na casa da senhora Suzuki com o noticiário ligado. Vem aí uma eleição. Você pergunta sobre isso — com cuidado. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: 来月[らいげつ]、 選挙[せんきょ] が あります よ。
    meaning:
      en: There's an election next month.
      pt: Mês que vem tem eleição.
  - speaker: protagonist
    text: ニュース に よる と、 新[あたら]しい 首相[しゅしょう] が 決[き]まる かも しれない ん です ね。
    meaning:
      en: According to the news, a new prime minister might be decided.
      pt: Segundo o noticiário, pode ser que se defina um novo primeiro-ministro.
  - speaker: suzuki
    text: ええ。 でも 若[わか]い 人[ひと] は あまり 投票[とうひょう] に 行[い]きません。
    meaning:
      en: Yes. But young people don't vote much.
      pt: Sim. Mas os jovens votam pouco.
  - speaker: protagonist
    text: ブラジル で は 投票[とうひょう] は 義務[ぎむ] です。
    meaning:
      en: In Brazil voting is compulsory.
      pt: No Brasil votar é obrigatório.
  - speaker: suzuki
    text: まあ、 そう です か。 日本[にほん] は 自由[じゆう] です。 投票率[とうひょうりつ] は 低[ひく]い です けど。
    meaning:
      en: Oh, is it? In Japan it's voluntary. Turnout is low, though.
      pt: É mesmo? No Japão é livre. Só que o comparecimento é baixo.
  - speaker: protagonist
    text: 鈴木[すずき] さん は どの 政党[せいとう] が…
    meaning:
      en: Which party do you…
      pt: A senhora apoia qual partido…
  - speaker: suzuki
    text: ふふ、 それ は 秘密[ひみつ] です。 政治[せいじ] の 話[はなし] は 家族[かぞく] と だけ。
    meaning:
      en: Heh, that's a secret. Politics I only talk about with family.
      pt: Rá, isso é segredo. Política, só com a família.
  - speaker: protagonist
    text: すみません。 外国人[がいこくじん] は 投票[とうひょう] できません けど、 ニュース は 見[み]ます。
    meaning:
      en: Sorry. Foreigners can't vote, but I do watch the news.
      pt: Desculpe. Estrangeiro não vota, mas eu acompanho o noticiário.
