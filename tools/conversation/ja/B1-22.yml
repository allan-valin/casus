- type: narrator
  text:
    en: '«に よる と» gives your source: «ニュース に よる と», according to the news. It goes well with hearsay endings: «〜 そう です», «〜 らしい», «〜 かも しれない» — might.'
    pt: '«に よる と» dá a fonte: «ニュース に よる と», segundo o noticiário. Combina com as terminações de ouvir dizer: «〜 そう です», «〜 らしい», «〜 かも しれない» — pode ser que.'
