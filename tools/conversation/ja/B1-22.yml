- type: narrator
  text:
    en: Voting in Japan is voluntary, and turnout among young people is often low. Foreign residents cannot vote. Many Japanese avoid politics outside the family, so asking someone's party is personal —
      let them offer it.
    pt: No Japão votar é facultativo, e o comparecimento dos jovens costuma ser baixo. Estrangeiros residentes não votam. Muitos japoneses evitam política fora da família, então perguntar o partido de alguém
      é pessoal — deixe que a pessoa conte se quiser.
- type: narrator
