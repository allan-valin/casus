steps:
- type: narrator
  text:
    en: On the line, Kenta counts the parts in a box. You check with him. Listen to the conversation; you don't need to understand it yet.
    pt: Na linha, o Kenta conta as peças de uma caixa. Você confere com ele. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: この 箱[はこ] に 部品[ぶひん] が 十[じゅう] 個[こ] あります。
    meaning:
      en: There are ten parts in this box.
      pt: Nesta caixa há dez peças.
  - speaker: protagonist
    text: 十[じゅう] 個[こ]？ 数[かぞ]えます。 一[いち]、 二[に]、 三[さん]…
    meaning:
      en: Ten? I'll count. One, two, three…
      pt: Dez? Vou contar. Um, dois, três…
  - speaker: kenta
    text: 全部[ぜんぶ] で 何個[なんこ] です か。
    meaning:
      en: How many in all?
      pt: Quantas no total?
  - speaker: protagonist
    text: 九[きゅう] 個[こ] です。 ひとつ 足[た]りません。
    meaning:
      en: Nine. One is missing.
      pt: Nove. Falta uma.
  - speaker: kenta
    text: 本当[ほんとう] です か。 あ、 ここ に ひとつ。
    meaning:
      en: Really? Oh, here's one.
      pt: Sério? Ah, aqui tem uma.
  - speaker: protagonist
    text: じゃあ、 十[じゅう] 個[こ] です ね。
    meaning:
      en: Then it's ten.
      pt: Então são dez.
  - speaker: kenta
    text: 次[つぎ] の 箱[はこ] は ふたつ です。
    meaning:
      en: The next is two boxes.
      pt: As próximas são duas caixas.
  - speaker: protagonist
    text: ふたつ… みっつ じゃない です か。
    meaning:
      en: Two… isn't it three?
      pt: Duas… não são três?
- type: narrator
  text:
    en: 'Two ways to count. For things in general: «ひとつ», «ふたつ», «みっつ». With a counter: «一[いち]», «二[に]», «三[さん]» plus the counter, like «個[こ]» for small things.'
    pt: 'Duas maneiras de contar. Para coisas em geral: «ひとつ», «ふたつ», «みっつ». Com contador: «一[いち]», «二[に]», «三[さん]» mais o contador, como «個[こ]» para coisas pequenas.'
