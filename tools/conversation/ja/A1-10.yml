- type: narrator
  text:
    en: 'Japanese counts with counters: «個[こ]» for small things, «枚[まい]» for flat ones, «本[ほん]» for long ones, «人[にん]» for people. «ひとつ, ふたつ…» works for almost anything when you don''t know the counter.'
    pt: 'O japonês conta com contadores: «個[こ]» para coisas pequenas, «枚[まい]» para coisas planas, «本[ほん]» para coisas compridas, «人[にん]» para pessoas. «ひとつ, ふたつ…» serve para quase tudo quando você não sabe
      o contador.'
