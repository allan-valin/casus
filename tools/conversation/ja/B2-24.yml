steps:
- type: narrator
  text:
    en: Lunch with Kenta. His grandmother needs care, his town's school is closing, and the factory can't find young workers. Listen to the conversation; you don't need to understand it yet.
    pt: Almoço com o Kenta. A avó dele precisa de cuidados, a escola da cidade dele vai fechar, e a fábrica não acha trabalhadores jovens. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: 祖母[そぼ] が 介護[かいご] が 必要[ひつよう] に なって、 母[はは] が 大変[たいへん] な ん だ。
    meaning:
      en: My grandmother needs care now, and it's hard on my mother.
      pt: Minha avó passou a precisar de cuidados, e está pesado para minha mãe.
  - speaker: protagonist
    text: 介護[かいご] 施設[しせつ] は？
    meaning:
      en: What about a care home?
      pt: E uma casa de repouso?
  - speaker: kenta
    text: 空[あ]き が ない。 介護[かいご] の 仕事[しごと] も 人手[ひとで] 不足[ぶそく] で。
    meaning:
      en: No places. The care jobs are short-staffed too.
      pt: Não tem vaga. O trabalho de cuidador também está com falta de gente.
  - speaker: protagonist
    text: 日本[にほん] は 少子[しょうし] 高齢化[こうれいか] が 進[すす]んで いる ね。
    meaning:
      en: Japan's population is ageing and having fewer children.
      pt: O Japão está com menos crianças e mais idosos.
  - speaker: kenta
    text: うん。 僕[ぼく] の 町[まち] の 小学校[しょうがっこう] も 来年[らいねん] 廃校[はいこう]。 子供[こども] が 減[へ]る に つれて、 学校[がっこう] も 減[へ]る。
    meaning:
      en: Yeah. My town's primary school closes next year too. As children decrease, schools do too.
      pt: É. A escola primária da minha cidade fecha ano que vem. À medida que as crianças diminuem, as escolas também.
  - speaker: protagonist
    text: 工場[こうじょう] で は 外国人[がいこくじん] が 増[ふ]えて いる けど。
    meaning:
      en: At the factory, though, foreigners are increasing.
      pt: Mas na fábrica os estrangeiros estão aumentando.
  - speaker: kenta
    text: 移民[いみん] を どう する か、 日本[にほん] は まだ 決[き]めて いない ん だ よ。
    meaning:
      en: Japan still hasn't decided what to do about immigration.
      pt: O Japão ainda não decidiu o que fazer com a imigração.
  - speaker: protagonist
    text: 人口[じんこう] の 問題[もんだい] は 難[むずか]しい ね。 お祖母[ばあ]さん、 お大事[だいじ] に。
    meaning:
      en: Population is a hard problem. Take care of your grandmother.
      pt: A questão da população é difícil. Melhoras para a sua avó.
