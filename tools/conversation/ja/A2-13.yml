- type: narrator
  text:
    en: 'Trains stop around midnight, and a taxi between cities costs a fortune. Miss the «終電[しゅうでん]» and many wait for the first train in a «ネット カフェ» or «漫画[まんが] 喫茶[きっさ]»: a small booth with a reclining
      chair, comics, free drinks, sometimes a shower, by the hour or as a night pack. Clubs check ID at the door; the legal age is twenty.'
    pt: 'Os trens param por volta da meia-noite, e um táxi entre cidades custa uma fortuna. Quem perde o «終電[しゅうでん]» muitas vezes espera o primeiro trem numa «ネット カフェ» ou «漫画[まんが] 喫茶[きっさ]»: uma cabine com
      poltrona reclinável, mangás, bebida liberada, às vezes chuveiro, por hora ou num pacote para a noite. As baladas pedem documento na entrada; a idade mínima é vinte anos.'
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil a balada vai até o sol nascer e a volta é de Uber. No Japão é o horário do último trem que manda — ou se fica até o primeiro.
