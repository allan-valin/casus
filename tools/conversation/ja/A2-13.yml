steps:
- type: narrator
  text:
    en: 'Saturday night in Shizuoka city with Kenta and his friends: a club, dancing — and the last train home leaves at 23:30. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Sábado à noite na cidade de Shizuoka com o Kenta e os amigos: uma balada, dança — e o último trem para casa sai às 23:30. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: kenta
    text: 入口[いりぐち] で 身分証[みぶんしょう] を 見[み]せて。 二十歳[はたち] 以上[いじょう] だけ。
    meaning:
      en: Show your ID at the door. Over twenty only.
      pt: Mostre o documento na entrada. Só maiores de vinte.
  - speaker: protagonist
    text: 在留[ざいりゅう] カード で いい？
    meaning:
      en: Is the residence card okay?
      pt: O cartão de residência serve?
  - speaker: kenta
    text: うん。 さあ、 踊[おど]ろう！
    meaning:
      en: Yeah. Come on, let's dance!
      pt: Serve. Bora dançar!
  - speaker: protagonist
    text: 楽[たの]しい！ でも 何時[なんじ] まで いる？
    meaning:
      en: Fun! But until what time are we staying?
      pt: Que divertido! Mas vamos ficar até que horas?
  - speaker: kenta
    text: 終電[しゅうでん] は 十一時[じゅういちじ] 半[はん]。 逃[のが]したら、 朝[あさ] まで 帰[かえ]れない よ。
    meaning:
      en: The last train is at half past eleven. If we miss it, we can't get home till morning.
      pt: O último trem é às onze e meia. Se perder, só volta de manhã.
  - speaker: protagonist
    text: タクシー は？
    meaning:
      en: What about a taxi?
      pt: E táxi?
  - speaker: kenta
    text: 浜松[はままつ] まで は すごく 高[たか]い。 逃[のが]したら、 ネット カフェ で 寝[ね]る。
    meaning:
      en: To Hamamatsu it's really expensive. If we miss it, we sleep at an internet café.
      pt: Até Hamamatsu é caríssimo. Se perder, dorme na lan house.
  - speaker: protagonist
    text: え、 もう 十一時[じゅういちじ] 十分[じゅっぷん]！ 急[いそ]いで！
    meaning:
      en: What, it's already ten past eleven! Hurry!
      pt: Nossa, já são onze e dez! Corre!
