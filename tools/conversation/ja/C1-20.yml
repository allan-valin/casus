- type: narrator
  text:
    en: 'When a pregnancy is reported to city hall, the mother receives the «母子[ぼし] 手帳[てちょう]»: one booklet for check-ups, the birth and the child''s growth and vaccinations, plus vouchers that make most
      check-ups free. Hamamatsu offers it in Portuguese too. Your own spouse is «夫[おっと]» / «妻[つま]»; someone else''s is «ご主人[しゅじん]» / «奥[おく]さん».'
    pt: 'Quando a gravidez é comunicada à prefeitura, a mãe recebe o «母子[ぼし] 手帳[てちょう]»: uma caderneta para o pré-natal, o parto e o crescimento e as vacinas da criança, além de vales que tornam a maioria
      das consultas gratuitas. Hamamatsu oferece também em português. O próprio cônjuge é «夫[おっと]» / «妻[つま]»; o dos outros é «ご主人[しゅじん]» / «奥[おく]さん».'
- type: narrator
  for:
  - pt
  text:
    pt: 'A caderneta lembra a Caderneta da Gestante e a da Criança do SUS, só que é uma só, da gravidez até a escola. Guarde bem: no Japão ela vai para todo lado com vocês.'
