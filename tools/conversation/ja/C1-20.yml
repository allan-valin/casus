steps:
- type: narrator
  text:
    en: You and Yui married quietly last spring. Now she's pregnant. At city hall she receives the maternal and child health booklet; then the first check-up. Listen to the conversation; you don't need
      to understand it yet.
    pt: Você e a Yui casaram discretamente na primavera passada. Agora ela está grávida. Na prefeitura ela recebe a caderneta de saúde da mãe e do bebê; depois, o primeiro pré-natal. Escute a conversa;
      ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: yui
    text: 市役所[しやくしょ] で 母子[ぼし] 手帳[てちょう] を もらった よ。
    meaning:
      en: I got the maternal and child health booklet at city hall.
      pt: Peguei a caderneta da mãe e do bebê na prefeitura.
  - speaker: protagonist
    text: これ に 全部[ぜんぶ] 記録[きろく] する の？
    meaning:
      en: Everything gets recorded in this?
      pt: Tudo fica registrado aqui?
  - speaker: yui
    text: うん。 妊娠[にんしん] 中[ちゅう] の 検診[けんしん] から、 赤[あか]ちゃん の 予防[よぼう] 接種[せっしゅ] まで。
    meaning:
      en: Yes. From the check-ups during pregnancy to the baby's vaccinations.
      pt: É. Do pré-natal até as vacinas do bebê.
  - speaker: isha
    text: 出産[しゅっさん] 予定日[よていび] は 十月[じゅうがつ] 三日[みっか] です。 つわり は 大丈夫[だいじょうぶ] です か。
    meaning:
      en: The due date is the 3rd of October. How's the morning sickness?
      pt: A data prevista do parto é 3 de outubro. E o enjoo?
  - speaker: yui
    text: 少[すこ]し あります が、 大丈夫[だいじょうぶ] です。
    meaning:
      en: A little, but I'm fine.
      pt: Um pouco, mas estou bem.
  - speaker: isha
    text: ご主人[しゅじん] も 一緒[いっしょ] に 両親[りょうしん] 学級[がっきゅう] に 来[き]て ください ね。
    meaning:
      en: Please come to the parents' class together with your husband.
      pt: Venha com o seu marido às aulas para pais, viu.
  - speaker: protagonist
    text: はい。 妻[つま] が 元気[げんき] な うち に、 赤[あか]ちゃん の 部屋[へや] を 準備[じゅんび] して おきます。
    meaning:
      en: Yes. While my wife is still feeling well, I'll get the baby's room ready.
      pt: Sim. Enquanto minha esposa ainda está bem, vou deixar o quarto do bebê pronto.
  - speaker: yui
    text: 頼[たの]もしい 夫[おっと] だ ね。
    meaning:
      en: What a dependable husband.
      pt: Que marido prestativo.
