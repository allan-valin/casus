steps:
- type: narrator
  text:
    en: You and Yui bought an old house. Before the renovation starts, the builder takes you round the neighbours with towels as greeting gifts. Listen to the conversation; you don't need to understand
      it yet.
    pt: Você e a Yui compraram uma casa velha. Antes de a reforma começar, o empreiteiro leva vocês para cumprimentar os vizinhos com toalhas de presente. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 来週[らいしゅう] から 隣[となり] で リフォーム の 工事[こうじ] を します。 ご迷惑[めいわく] を おかけ します。
    meaning:
      en: From next week we'll be renovating next door. We'll cause you some trouble.
      pt: A partir da semana que vem vamos reformar a casa ao lado. Vamos causar algum transtorno.
  - speaker: suzuki
    text: まあ、 ご丁寧[ていねい] に。 工期[こうき] は どの くらい？
    meaning:
      en: Oh, how thoughtful. How long will the work take?
      pt: Ah, que gentileza. Quanto tempo vai levar a obra?
  - speaker: protagonist
    text: 二[に] か月[げつ] です。 朝[あさ] 九時[くじ] から 夕方[ゆうがた] 五時[ごじ] まで。 これ、 つまらない もの です が…
    meaning:
      en: Two months. Nine in the morning to five in the evening. This is just a little something…
      pt: Dois meses. Das nove da manhã às cinco da tarde. Isto é só uma lembrancinha…
  - speaker: suzuki
    text: タオル です ね。 ありがとう。 大工[だいく] さん の 車[くるま] は どこ に？
    meaning:
      en: Towels. Thank you. Where will the carpenters park?
      pt: Toalhas. Obrigada. Onde os carpinteiros vão estacionar?
  - speaker: protagonist
    text: 近[ちか]く の 駐車場[ちゅうしゃじょう] を 借[か]りました。 道[みち] に は 止[と]めません。
    meaning:
      en: We've rented a parking space nearby. They won't park on the street.
      pt: Alugamos uma vaga num estacionamento perto. Não vão parar na rua.
  - speaker: suzuki
    text: それ なら 安心[あんしん]。 ご挨拶[あいさつ] の ついで に、 うち の 野菜[やさい] も 持[も]って 行[い]って。
    meaning:
      en: Then I'm reassured. And since you're here, take some of my vegetables.
      pt: Assim fico tranquila. E aproveitando a visita, leve umas verduras minhas.
  - speaker: protagonist
    text: いつも すみません。 何卒[なにとぞ] よろしく お願[ねが]い いたします。
    meaning:
      en: Thank you, as always. We humbly ask for your understanding.
      pt: Sempre tão gentil. Contamos com a sua compreensão.
  - speaker: suzuki
    text: 引[ひ]っ越[こ]して きたら、 今度[こんど] は ご近所[きんじょ] さん です ね。
    meaning:
      en: Once you move in, we'll be neighbours again.
      pt: Quando se mudarem, seremos vizinhos de novo.
