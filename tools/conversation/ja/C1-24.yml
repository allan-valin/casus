- type: narrator
  text:
    en: Before building work, you and the builder visit the neighbours on both sides, across the street and behind — «向[む]こう 三軒[さんげん] 両隣[りょうどなり]» — with a small gift, often towels or detergent, giving the
      dates, hours and parking plan. It prevents most complaints before they start.
    pt: Antes de uma obra, você e o empreiteiro visitam os vizinhos dos dois lados, da frente e dos fundos — «向[む]こう 三軒[さんげん] 両隣[りょうどなり]» — com um presentinho, muitas vezes toalhas ou detergente, informando
      datas, horários e onde vão estacionar. Isso evita a maioria das reclamações antes que comecem.
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil a gente avisa o vizinho da obra, quando avisa. No Japão o aviso tem roteiro, presente e lista de casas — e funciona.
