- type: narrator
  text:
    en: 'Japanese karaoke is not a stage in a bar: you rent a «個室[こしつ]», a private room, by the hour, and order drinks by the phone on the wall. Many people go alone, «一人[ひとり] カラオケ», to practise or just
      to sing; some places have rooms made for one.'
    pt: 'O karaokê japonês não é um palco no bar: você aluga um «個室[こしつ]», uma sala só sua, por hora, e pede bebida pelo telefone da parede. Muita gente vai sozinha, «一人[ひとり] カラオケ», para treinar ou só cantar;
      alguns lugares têm salas feitas para uma pessoa.'
- type: narrator
