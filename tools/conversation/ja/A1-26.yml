steps:
- type: narrator
  text:
    en: 'Friday after work. Kenta and two colleagues take you to a karaoke box: a small private room with a screen, a menu and a phone on the wall. Listen to the conversation; you don''t need to understand
      it yet.'
    pt: 'Sexta depois do trabalho. O Kenta e dois colegas levam você a um karaokê de cabines: uma salinha só de vocês, com tela, cardápio e um telefone na parede. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: kenta
    text: 今日[きょう] カラオケ 行[い]かない？ あ、 敬語[けいご] で… カラオケ に 行[い]きません か。
    meaning:
      en: Karaoke today? Oh, politely… Won't you come to karaoke?
      pt: Karaokê hoje? Ah, educadamente… Não quer ir ao karaokê?
  - speaker: protagonist
    text: いい ね！ でも 歌[うた] は 下手[へた] だ よ。
    meaning:
      en: Sounds good! But I'm bad at singing.
      pt: Boa! Mas eu canto mal.
  - speaker: kenta
    text: 大丈夫[だいじょうぶ]。 個室[こしつ] だ から、 僕[ぼく]たち だけ。
    meaning:
      en: It's fine. It's a private room, just us.
      pt: Tranquilo. É sala privativa, só a gente.
  - speaker: protagonist
    text: 一時間[いちじかん] いくら？
    meaning:
      en: How much for an hour?
      pt: Quanto é uma hora?
  - speaker: kenta
    text: 安[やす]い よ。 じゃあ、 乾杯[かんぱい]！
    meaning:
      en: It's cheap. Okay — cheers!
      pt: É barato. Então — saúde!
  - speaker: protagonist
    text: 乾杯[かんぱい]！
    meaning:
      en: Cheers!
      pt: Saúde!
  - speaker: kenta
    text: ブラジル の 歌[うた]、 歌[うた]いません か。
    meaning:
      en: Won't you sing a Brazilian song?
      pt: Não quer cantar uma música brasileira?
  - speaker: protagonist
    text: うん、 歌[うた]う！ …楽[たの]しい！ 延長[えんちょう] しよう！
    meaning:
      en: Yeah, I'll sing! …This is fun! Let's add more time!
      pt: Vou, sim! …Que divertido! Vamos prorrogar!
  - speaker: kenta
    text: 実[じつ] は 僕[ぼく]、 一人[ひとり] カラオケ も 好[す]き なんだ。
    meaning:
      en: Actually, I like karaoke alone, too.
      pt: Na verdade, eu também gosto de karaokê sozinho.
