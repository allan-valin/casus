- type: narrator
  text:
    en: Many Brazilian children in Japan lose Portuguese as Japanese school takes over, and some end up fluent in neither. Families who keep a «heritage language» usually set rules — one language at home
      — and use books, songs, video calls with grandparents and weekend Portuguese classes.
    pt: Muitas crianças brasileiras no Japão perdem o português quando a escola japonesa toma conta, e algumas acabam sem dominar bem nenhuma das duas. Famílias que mantêm a «língua de herança» geralmente
      criam regras — uma língua em casa — e usam livros, músicas, videochamadas com os avós e aulas de português no fim de semana.
