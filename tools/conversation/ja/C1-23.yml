steps:
- type: narrator
  text:
    en: Maria's son Davi answers her Portuguese in Japanese. At the bakery she asks your advice — Portuguese at home, Japanese outside? Listen to the conversation; you don't need to understand it yet.
    pt: O filho da Maria, o Davi, responde em japonês quando ela fala português. Na padaria ela pede o seu conselho — português em casa, japonês fora? Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: maria
    text: ダビ は 家[いえ] で も 日本語[にほんご] で 返事[へんじ] する の。 ポルトガル語[ご] を 忘[わす]れ そう。
    meaning:
      en: Davi answers in Japanese even at home. He's going to forget Portuguese.
      pt: O Davi responde em japonês até em casa. Ele vai acabar esquecendo o português.
  - speaker: protagonist
    text: 学校[がっこう] で は 一日中[いちにちじゅう] 日本語[にほんご] だ から ね。
    meaning:
      en: Well, at school it's Japanese all day.
      pt: Na escola é japonês o dia inteiro, né?
  - speaker: maria
    text: 友達[ともだち] の 前[まえ] で ポルトガル語[ご] を 話[はな]す の を 恥[は]ずかしがる の よ。
    meaning:
      en: He's embarrassed to speak Portuguese in front of his friends.
      pt: Ele tem vergonha de falar português na frente dos amigos.
  - speaker: protagonist
    text: 子供[こども] に とって、 みんな と 同[おな]じ で ある こと は 大事[だいじ] な ん だ と 思[おも]う。
    meaning:
      en: For a child, being the same as everyone matters a lot, I think.
      pt: Para uma criança, ser igual a todo mundo é muito importante, eu acho.
  - speaker: maria
    text: でも 祖父母[そふぼ] と 話[はな]せなく なる の は 悲[かな]しい。
    meaning:
      en: But it's sad if he can't talk to his grandparents.
      pt: Mas é triste ele não conseguir mais falar com os avós.
  - speaker: protagonist
    text: 家[いえ] で は ポルトガル語[ご]、 外[そと] で は 日本語[にほんご]。 ルール を 決[き]めたら？ ポルトガル語[ご] の 絵本[えほん] も いい よ。
    meaning:
      en: Portuguese at home, Japanese outside — why not set that rule? Portuguese picture books help too.
      pt: Em casa português, fora japonês — que tal fazer essa regra? Livro infantil em português também ajuda.
  - speaker: maria
    text: そう ね。 二[ふた]つ の 言葉[ことば] は、 あの 子[こ] の アイデンティティ だ から。
    meaning:
      en: Yes. The two languages are part of who he is.
      pt: É. As duas línguas são a identidade dele.
  - speaker: protagonist
    text: バイリンガル は 宝物[たからもの] だ よ。
    meaning:
      en: Being bilingual is a treasure.
      pt: Ser bilíngue é um tesouro.
