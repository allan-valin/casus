steps:
- type: narrator
  text:
    en: Mrs Suzuki helps you measure the tatami room for a new carpet. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Suzuki ajuda você a medir o quarto de tatame para um tapete novo. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: この 部屋[へや] は 六畳[ろくじょう] です。
    meaning:
      en: This room is six tatami.
      pt: Este quarto é de seis tatames.
  - speaker: protagonist
    text: 六畳[ろくじょう]？ 広[ひろ]い です か、 狭[せま]い です か。
    meaning:
      en: Six tatami? Is that big or small?
      pt: Seis tatames? É grande ou pequeno?
  - speaker: suzuki
    text: 少[すこ]し 狭[せま]い です ね。 一畳[いちじょう] は 約[やく] 一[いち] メートル 半[はん] と 一[いち] メートル です。
    meaning:
      en: A little small. One tatami is about one and a half metres by one metre.
      pt: Um pouco pequeno. Um tatame tem cerca de um metro e meio por um metro.
  - speaker: protagonist
    text: じゃあ、 部屋[へや] は 三[さん] メートル と 三[さん] メートル ぐらい？
    meaning:
      en: So the room is about three by three metres?
      pt: Então o quarto tem uns três por três metros?
  - speaker: suzuki
    text: ちょうど です。 頭[あたま] が いい です ね！
    meaning:
      en: Exactly. You're clever!
      pt: Exatamente. Que inteligente!
  - speaker: protagonist
    text: この カーペット は 大[おお]きい です か。
    meaning:
      en: Is this carpet big?
      pt: Este tapete é grande?
  - speaker: suzuki
    text: 長[なが]い です ね。 小[ちい]さい の が いい です。
    meaning:
      en: It's long. A small one is better.
      pt: É comprido. Um pequeno é melhor.
  - speaker: protagonist
    text: わかりました。 四角[しかく] の 小[ちい]さい の に します。
    meaning:
      en: I see. I'll take a small square one.
      pt: Entendi. Vou escolher um pequeno quadrado.
