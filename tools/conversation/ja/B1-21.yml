- type: narrator
  text:
    en: «雨[あめ] ニモ マケズ» was found in Miyazawa Kenji's notebook after his death in 1933; today it is in the public domain and known to almost every Japanese person. After the 2011 earthquake and tsunami in
      Tōhoku, his home region, it was read aloud across the country.
    pt: «雨[あめ] ニモ マケズ» foi encontrado no caderninho de Miyazawa Kenji depois da morte dele, em 1933; hoje está em domínio público e quase todo japonês conhece. Depois do terremoto e do tsunami de 2011 em
      Tōhoku, a terra dele, foi lido em voz alta pelo país inteiro.
- type: narrator
  for:
  - pt
  text:
    pt: 'É um pouco como «E agora, José?» de Drummond para nós: um poema que todo mundo reconhece. O de Kenji fala de ser forte e simples, e de ajudar os outros sem querer elogio.'
