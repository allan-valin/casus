steps:
- type: narrator
  text:
    en: Mrs Suzuki keeps a poem by Miyazawa Kenji framed in her kitchen. She reads it aloud and explains the old written style. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Suzuki tem um poema de Miyazawa Kenji emoldurado na cozinha. Ela lê em voz alta e explica o estilo escrito antigo. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: これ は 宮沢[みやざわ] 賢治[けんじ] の 詩[し] です。 読[よ]みます ね。
    meaning:
      en: This is a poem by Miyazawa Kenji. I'll read it.
      pt: Este é um poema de Miyazawa Kenji. Vou ler.
  - speaker: suzuki
    text: 雨[あめ] ニモ マケズ、 風[かぜ] ニモ マケズ、 雪[ゆき] ニモ 夏[なつ] ノ 暑[あつ]サ ニモ マケヌ、 丈夫[じょうぶ] ナ カラダ ヲ モチ…
    meaning:
      en: Not losing to the rain, not losing to the wind, not losing to the snow nor the summer heat, with a sturdy body…
      pt: Sem se render à chuva, sem se render ao vento, sem se render à neve nem ao calor do verão, com um corpo forte…
  - speaker: protagonist
    text: カタカナ が 多[おお]い です ね。 「マケズ」 は 何[なん] です か。
    meaning:
      en: There's a lot of katakana. What's “makezu”?
      pt: Tem muito katakana. O que é «makezu»?
  - speaker: suzuki
    text: 昔[むかし] の 言葉[ことば] で「負[ま]けない」 と いう 意味[いみ] です。
    meaning:
      en: It's old language for “not losing”.
      pt: É linguagem antiga para «não se render».
  - speaker: protagonist
    text: どんな 詩人[しじん] でした か。
    meaning:
      en: What kind of poet was he?
      pt: Que tipo de poeta ele era?
  - speaker: suzuki
    text: 東北[とうほく] の 先生[せんせい] で、 農家[のうか] の ため に 働[はたら]きました。 この 詩[し] は 手帳[てちょう] に 書[か]かれて いた ん です よ。
    meaning:
      en: A teacher in Tōhoku who worked for farmers. This poem was found written in his notebook.
      pt: Um professor de Tōhoku que trabalhou pelos agricultores. Este poema foi encontrado escrito num caderninho dele.
  - speaker: protagonist
    text: 感動[かんどう] しました。 日本[にほん] の 文学[ぶんがく] を もっと 読[よ]みたい です。
    meaning:
      en: I'm moved. I want to read more Japanese literature.
      pt: Fiquei emocionada. Quero ler mais literatura japonesa.
  - speaker: suzuki
    text: 地震[じしん] の 後[あと]、 たくさん の 人[ひと] が この 詩[し] を 読[よ]みました よ。
    meaning:
      en: After the earthquake, many people read this poem.
      pt: Depois do terremoto, muita gente leu este poema.
