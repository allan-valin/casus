- type: narrator
  text:
    en: 'Old written Japanese makes the negative with «ず» (and «ぬ»): «負[ま]けず» is «負[ま]けない», not losing. You still hear it in set phrases: «思[おも]わず», without thinking; «知[し]らず に», without knowing. Kenji
      wrote the poem in katakana, as telegrams and notes often were then.'
    pt: 'O japonês escrito antigo faz o negativo com «ず» (e «ぬ»): «負[ま]けず» é «負[ま]けない», sem se render. Ainda se ouve em expressões: «思[おも]わず», sem pensar; «知[し]らず に», sem saber. Kenji escreveu o poema em
      katakana, como se escreviam telegramas e anotações na época.'
