  - okurenaide
- type: narrator
  text:
    en: 'When the chief says nine «は ちょっと…», she means: nine is too late. In a Japanese office, five minutes early is on time and on time is already late. Trains do run on the minute, but when one is late
      the station gives you a delay certificate, «遅延証明書[ちえんしょうめいしょ]», to show at work.'
    pt: 'Quando a chefe diz que nove «は ちょっと…», quer dizer: nove já é tarde. No escritório japonês, cinco minutos antes é a hora certa, e na hora já é atraso. Os trens são pontuais, mas quando um atrasa
      a estação dá um comprovante de atraso, «遅延証明書[ちえんしょうめいしょ]», para mostrar no trabalho.'
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil uma reunião às nove muitas vezes começa nove e quinze, e ninguém estranha. No Japão, chegar às nove em ponto já parece descuido.
