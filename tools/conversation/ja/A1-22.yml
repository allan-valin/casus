steps:
- type: narrator
  text:
    en: Chief Sato tells you about tomorrow's meeting in the office. You ask what time it starts. Listen to the conversation; you don't need to understand it yet.
    pt: A chefe Sato avisa sobre a reunião de amanhã no escritório. Você pergunta a que horas começa. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sato
    text: 明日[あした] は 会議[かいぎ] が あります。
    meaning:
      en: There's a meeting tomorrow.
      pt: Amanhã tem reunião.
  - speaker: protagonist
    text: 何時[なんじ] から です か。
    meaning:
      en: What time does it start?
      pt: Começa a que horas?
  - speaker: sato
    text: 九時[くじ] から です。 一時間[いちじかん] ぐらい です。
    meaning:
      en: At nine. About an hour.
      pt: Às nove. Mais ou menos uma hora.
  - speaker: protagonist
    text: わかりました。 九時[くじ] に 来[き]ます。
    meaning:
      en: Understood. I'll come at nine.
      pt: Entendido. Venho às nove.
  - speaker: sato
    text: 九時[くじ] は ちょっと… 五分[ごふん] 前[まえ] に 来[き]て ください。
    meaning:
      en: Nine is a bit… Please come five minutes before.
      pt: Nove é meio… Venha cinco minutos antes.
  - speaker: protagonist
    text: 五分[ごふん] 前[まえ] です ね。 遅[おく]れません。
    meaning:
      en: Five minutes before. I won't be late.
      pt: Cinco minutos antes. Não vou me atrasar.
  - speaker: sato
    text: 電車[でんしゃ] が 遅[おく]れます から、 早[はや]く 出[で]て ください ね。
    meaning:
      en: Trains can be late, so leave early.
      pt: O trem pode atrasar, então saia cedo.
  - speaker: protagonist
    text: はい。 あの、 今[いま] 何時[なんじ] です か。
    meaning:
      en: Yes. Um, what time is it now?
      pt: Certo. Hum, que horas são agora?
  - speaker: sato
    text: 五時[ごじ] 十分[じゅっぷん] です。 お疲[つか]れさま でした。
    meaning:
      en: Ten past five. Thanks for your work today.
      pt: Cinco e dez. Bom trabalho hoje.
