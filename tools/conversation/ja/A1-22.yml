    en: 'Hours are the number plus «時[じ]»: «一時[いちじ]», «二時[にじ]», «五時[ごじ]». Watch nine: «九時[くじ]», not «きゅうじ». Minutes are «分[ふん]» or «分[ぷん]»: «五分[ごふん]», «十分[じゅっぷん]».'
    pt: 'As horas são o número mais «時[じ]»: «一時[いちじ]», «二時[にじ]», «五時[ごじ]». Atenção ao nove: «九時[くじ]», não «きゅうじ». Os minutos são «分[ふん]» ou «分[ぷん]»: «五分[ごふん]», «十分[じゅっぷん]».'
