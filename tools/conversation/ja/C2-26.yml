- type: narrator
  text:
    en: A haiku has seventeen sounds in five-seven-five, a «季語[きご]» that places it in a season, and often a «切[き]れ字[じ]» like «や» that cuts the poem and leaves a pause. Bashō's frog poem (1686) is the most
      famous of all; it is centuries in the public domain. Read slowly, with a breath at the cut.
    pt: Um haicai tem dezessete sons em cinco-sete-cinco, um «季語[きご]» que o situa numa estação e muitas vezes um «切[き]れ字[じ]» como «や», que corta o poema e deixa uma pausa. O haicai do sapo de Bashō (1686)
      é o mais famoso de todos; está em domínio público há séculos. Leia devagar, com uma respiração no corte.
- type: narrator
  for:
  - pt
  text:
    pt: O Brasil tem tradição de haicai — Guilherme de Almeida, Paulo Leminski. Ler Bashō no original, depois de tudo, é fechar um círculo.
