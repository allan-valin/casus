steps:
- type: narrator
  text:
    en: 'The last evening class of the year: each student reads a haiku by Bashō (1644–1694) aloud and explains its season word. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'A última aula noturna do ano: cada aluno lê em voz alta um haicai de Bashō (1644–1694) e explica a palavra de estação. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: kouza-sensei
    text: では、 芭蕉[ばしょう] の 俳句[はいく] を 朗読[ろうどく] して ください。
    meaning:
      en: Now, please read a haiku by Bashō aloud.
      pt: Agora, leia em voz alta um haicai de Bashō, por favor.
  - speaker: protagonist
    text: 古池[ふるいけ] や、 蛙[かわず] 飛[と]び込[こ]む、 水[みず] の 音[おと]。
    meaning:
      en: An old pond — a frog jumps in — the sound of water.
      pt: Um velho tanque — um sapo pula — o som da água.
  - speaker: kouza-sensei
    text: 季語[きご] は どれ です か。
    meaning:
      en: Which is the season word?
      pt: Qual é a palavra de estação?
  - speaker: protagonist
    text: 「蛙[かわず]」 です。 春[はる] の 季語[きご] です。
    meaning:
      en: “Frog”. It's a spring season word.
      pt: «Sapo». É palavra de primavera.
  - speaker: kouza-sensei
    text: 「や」 は 何[なん] の 役割[やくわり] です か。
    meaning:
      en: And what does “ya” do?
      pt: E qual é a função do «ya»?
  - speaker: protagonist
    text: 切[き]れ字[じ] です。 そこ で 一度[いちど] 止[と]まって、 静[しず]けさ を 感[かん]じさせます。
    meaning:
      en: It's a cutting word. It stops you there for a moment and lets you feel the stillness.
      pt: É uma palavra de corte. Faz uma pausa ali e deixa sentir a quietude.
  - speaker: kouza-sensei
    text: 五七五[ごしちご] の 十七[じゅうしち] 音[おん] に、 世界[せかい] が 入[はい]って いる ん です。
    meaning:
      en: In seventeen sounds, five-seven-five, a whole world fits.
      pt: Em dezessete sons, cinco-sete-cinco, cabe um mundo inteiro.
  - speaker: protagonist
    text: 音[おと] が した 後[あと] の 静[しず]けさ が、 一番[いちばん] 心[こころ] に 残[のこ]ります。
    meaning:
      en: It's the stillness after the sound that stays with me most.
      pt: É a quietude depois do som que mais fica no coração.
