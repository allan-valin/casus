- type: narrator
  text:
    en: 'A «銭湯[せんとう]» is a neighbourhood bath: you pay a few hundred yen, wash at the taps, then soak in big tubs, men and women apart. Old ones have a painting of Fuji on the wall, and a bottle of milk
      after the bath — hand on hip — is the classic.'
    pt: 'O «銭湯[せんとう]» é o banho do bairro: paga-se algumas centenas de ienes, lava-se nas torneiras e depois se relaxa nas banheiras grandes, homens e mulheres separados. Os antigos têm uma pintura do Fuji
      na parede, e um leitinho depois do banho — mão na cintura — é o clássico.'
