steps:
- type: narrator
  text:
    en: 'Kenta''s family invites you to the neighbourhood public bath. On the women''s side: Kenta''s mother and his sister Aya. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'A família do Kenta convida você para o banho público do bairro. Do lado das mulheres: a mãe do Kenta e a irmã dele, a Aya. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: kenta-haha
    text: ここ が 女湯[おんなゆ] です よ。 まず 体[からだ] を 洗[あら]って ね。
    meaning:
      en: This is the women's side. Wash first, okay?
      pt: Aqui é o lado das mulheres. Primeiro se lave, viu?
  - speaker: aya
    text: 早[はや]く 入[はい]ろう！ この 湯船[ゆぶね]、 でかい でしょ。
    meaning:
      en: Let's get in quick! This tub's huge, right?
      pt: Vamos entrar logo! Essa banheira é enorme, né?
  - speaker: protagonist
    text: うわ、 熱[あつ]い ね！ でも なんか 気持[きも]ち いい。
    meaning:
      en: Whoa, it's hot! But it kind of feels good.
      pt: Nossa, que quente! Mas é meio gostoso.
  - speaker: aya
    text: でしょ？ 壁[かべ] の 富士山[ふじさん] も 見[み]て。
    meaning:
      en: Right? Look at the Fuji on the wall too.
      pt: Né? Olha o Fuji na parede também.
  - speaker: protagonist
    text: 絵[え] だ！ どの 銭湯[せんとう] に も ある の？
    meaning:
      en: A painting! Do all public baths have one?
      pt: Uma pintura! Todo banho público tem?
  - speaker: kenta-haha
    text: 古[ふる]い 銭湯[せんとう] は 多[おお]い です ね。 お風呂[ふろ] 上[あ]がり は 牛乳[ぎゅうにゅう] です よ。
    meaning:
      en: Many old ones do. After the bath, it's milk.
      pt: Os antigos, muitos têm. Depois do banho, é leite.
  - speaker: aya
    text: フルーツ 牛乳[ぎゅうにゅう]、 飲[の]もう！
    meaning:
      en: Let's have fruit milk!
      pt: Vamos tomar leite de fruta!
  - speaker: protagonist
    text: やった！ 腰[こし] に 手[て] を あてて 飲[の]む ん でしょ？
    meaning:
      en: Yay! You drink it with a hand on your hip, right?
      pt: Eba! Bebe com a mão na cintura, né?
