steps:
- type: narrator
  text:
    en: Your mother turns sixty in March. You want a week of paid leave to fly to Brazil — but nobody in the department takes more than two days. Listen to the conversation; you don't need to understand
      it yet.
    pt: Sua mãe faz sessenta anos em março. Você quer uma semana de férias para ir ao Brasil — mas ninguém no departamento tira mais de dois dias. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 部長[ぶちょう]、 少[すこ]し よろしい でしょう か。
    meaning:
      en: Sir, do you have a moment?
      pt: Chefe, o senhor tem um minuto?
  - speaker: buchou
    text: どうぞ。
    meaning:
      en: Go ahead.
      pt: Pode falar.
  - speaker: protagonist
    text: 三月[さんがつ] に 母[はは] が 還暦[かんれき] を 迎[むか]えます。 一週間[いっしゅうかん]、 有給[ゆうきゅう] を いただいて も よろしい でしょう か。
    meaning:
      en: My mother turns sixty in March. May I take a week of paid leave?
      pt: Minha mãe faz sessenta anos em março. Eu poderia tirar uma semana de férias?
  - speaker: buchou
    text: 一週間[いっしゅうかん] か。 仕事[しごと] へ の 影響[えいきょう] は？
    meaning:
      en: A week, huh. What about the effect on work?
      pt: Uma semana, é? E o impacto no trabalho?
  - speaker: protagonist
    text: 引[ひ]き継[つ]ぎ は 前[まえ] の 週[しゅう] に 済[す]ませます。 皆[みな]さん に ご迷惑[めいわく] を かけない ように します。
    meaning:
      en: I'll finish the handover the week before. I'll make sure not to cause anyone trouble.
      pt: Faço a passagem de trabalho na semana anterior. Vou cuidar para não causar transtorno a ninguém.
  - speaker: buchou
    text: いい よ。 有給[ゆうきゅう] は 権利[けんり] です から。 申請[しんせい] を 出[だ]して ください。
    meaning:
      en: Fine. Paid leave is your right. Submit the application.
      pt: Pode ir. Férias são um direito seu. Faça o requerimento.
  - speaker: protagonist
    text: ありがとう ございます。 遠慮[えんりょ] して いました。
    meaning:
      en: Thank you. I'd been holding back.
      pt: Obrigado. Eu estava sem jeito de pedir.
  - speaker: buchou
    text: みんな もっと 休暇[きゅうか] を 取[と]る べき だ よ。 お母[かあ]さん に よろしく。
    meaning:
      en: Everyone should take more leave. My regards to your mother.
      pt: Todo mundo devia tirar mais férias. Mande lembranças à sua mãe.
