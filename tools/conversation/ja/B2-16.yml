- type: narrator
  text:
    en: 'People hold back from taking leave, «遠慮[えんりょ]», for fear of «迷惑[めいわく]» to colleagues. Asking well: choose a calm moment, give the reason briefly, show the handover plan, then submit the form. «還暦[かんれき]»,
      the 60th birthday, is celebrated — traditionally with something red.'
    pt: 'As pessoas se seguram para tirar férias, «遠慮[えんりょ]», com medo de causar «迷惑[めいわく]» aos colegas. Pedir bem: escolha um momento tranquilo, dê o motivo em poucas palavras, mostre o plano de passagem
      de trabalho e então entregue o requerimento. O «還暦[かんれき]», os 60 anos, é comemorado — tradicionalmente com algo vermelho.'
- type: narrator
  for:
  - pt
  text:
    pt: Pela CLT ninguém precisa pedir desculpas por tirar férias. No Japão o direito existe igual; o que pesa é o «迷惑[めいわく]» — por isso a passagem de trabalho bem feita abre a porta.
