- type: narrator
  text:
    en: 'The most polite way to ask permission: «〜て も よろしい でしょう か» — «いただいて も よろしい でしょう か», might I receive…? Or ask them to do it: «〜て いただけない でしょう か». Both soften the request with a question about possibility.'
    pt: 'O jeito mais educado de pedir licença: «〜て も よろしい でしょう か» — «いただいて も よろしい でしょう か», eu poderia receber…? Ou pedir que a pessoa faça: «〜て いただけない でしょう か». Os dois suavizam o pedido com uma pergunta
      sobre a possibilidade.'
