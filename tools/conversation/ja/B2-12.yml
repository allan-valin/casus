steps:
- type: narrator
  text:
    en: 'December: the whole office is buying Year-End Jumbo lottery tickets. Kenta asks if you want in. You do the maths. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Dezembro: o escritório todo está comprando bilhetes da loteria de fim de ano. O Kenta pergunta se você quer entrar. Você faz as contas. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: kenta
    text: 年末[ねんまつ] ジャンボ 宝[たから]くじ、 一緒[いっしょ] に 買[か]う？ 一等[いっとう] は 七億円[ななおくえん] だ よ。
    meaning:
      en: Shall we buy Year-End Jumbo tickets together? First prize is 700 million yen.
      pt: Vamos comprar a loteria de fim de ano juntos? O primeiro prêmio é 700 milhões de ienes.
  - speaker: protagonist
    text: 当[あ]たる 確率[かくりつ] は？
    meaning:
      en: What are the odds of winning?
      pt: Qual a chance de ganhar?
  - speaker: kenta
    text: 一等[いっとう] は 二千万[にせんまん] 分[ぶん] の 一[いち] ぐらい。
    meaning:
      en: First prize is about one in twenty million.
      pt: O primeiro prêmio é uns um em vinte milhões.
  - speaker: protagonist
    text: 雷[かみなり] に 当[あ]たる ほど 低[ひく]い ね。
    meaning:
      en: As low as being hit by lightning.
      pt: Tão baixa quanto ser atingido por um raio.
  - speaker: kenta
    text: でも 夢[ゆめ] を 買[か]う ん だ よ。 宝[たから]くじ は 夢[ゆめ]。
    meaning:
      en: But you're buying a dream. The lottery is a dream.
      pt: Mas você compra um sonho. Loteria é sonho.
  - speaker: protagonist
    text: 明日[あした] の 降水[こうすい] 確率[かくりつ] は 八十[はちじゅう] パーセント だ けど、 それ は 信[しん]じる よ。
    meaning:
      en: Tomorrow's chance of rain is 80 percent — that one I believe.
      pt: A chance de chuva de amanhã é de 80 por cento — nessa eu acredito.
  - speaker: kenta
    text: ははは。 じゃあ 一枚[いちまい] だけ。 三百円[さんびゃくえん]。
    meaning:
      en: Ha ha. Then just one ticket. 300 yen.
      pt: Ha ha. Então só um bilhete. 300 ienes.
  - speaker: protagonist
    text: 三百円[さんびゃくえん] なら、 死[し]ぬ ほど 後悔[こうかい] しない。 買[か]おう！
    meaning:
      en: For 300 yen I won't regret it to death. Let's buy!
      pt: Por 300 ienes não vou me arrepender até a morte. Vamos comprar!
