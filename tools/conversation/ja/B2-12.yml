- type: narrator
  text:
    en: 'Japanese counts big numbers in «万[まん]» (10,000) and «億[おく]» (100 million): «七億円[ななおくえん]» is 700 million yen, «二千万[にせんまん]» is twenty million. The weather forecast always gives «降水[こうすい] 確率[かくりつ]»,
      the chance of rain, in steps of ten percent.'
    pt: 'O japonês conta números grandes em «万[まん]» (10 mil) e «億[おく]» (100 milhões): «七億円[ななおくえん]» são 700 milhões de ienes, «二千万[にせんまん]» são vinte milhões. A previsão do tempo sempre dá o «降水[こうすい] 確率[かくりつ]»,
      a chance de chuva, de dez em dez por cento.'
