- type: narrator
  text:
    en: 'A Japanese presentation has a fixed frame: «それでは、 発表[はっぴょう] を 始[はじ]めます», the structure in one sentence, the handout pages, «結論[けつろん] と して», and «以上[いじょう] です» to end. Numbers in the handout matter
      more than slides; because of the «根回[ねまわ]し», the questions rarely surprise.'
    pt: 'Uma apresentação japonesa tem moldura fixa: «それでは、 発表[はっぴょう] を 始[はじ]めます», a estrutura numa frase, as páginas do material, «結論[けつろん] と して» e «以上[いじょう] です» para terminar. Os números no material contam
      mais que os slides; por causa do «根回[ねまわ]し», as perguntas raramente surpreendem.'
- type: narrator
  for:
  - pt
  text:
    pt: '«以上[いじょう] です» não tem tradução exata: é o «é isso, obrigado» que avisa que você terminou. Sem ele, a sala fica esperando.'
