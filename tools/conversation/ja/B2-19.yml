steps:
- type: narrator
  text:
    en: Your Portuguese safety-sign project goes to the managers' meeting. You present it, then take questions. Listen to the conversation; you don't need to understand it yet.
    pt: Seu projeto de placas de segurança em português vai para a reunião dos gerentes. Você apresenta e depois responde às perguntas. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: それでは、 発表[はっぴょう] を 始[はじ]めます。 まず 目的[もくてき] を 説明[せつめい] して から、 費用[ひよう] と 効果[こうか] を お話[はな]し します。
    meaning:
      en: Let me begin. First I'll explain the purpose, and after that the cost and effect.
      pt: Vou começar a apresentação. Primeiro explico o objetivo, depois falo do custo e do resultado.
  - speaker: protagonist
    text: 資料[しりょう] の 二[に] ページ を ご覧[らん] ください。 工場[こうじょう] の 三割[さんわり] は ブラジル 人[じん] です。
    meaning:
      en: Please look at page two of the handout. Thirty percent of the factory staff are Brazilian.
      pt: Vejam a página dois do material. Trinta por cento da fábrica são brasileiros.
  - speaker: protagonist
    text: 結論[けつろん] と して、 ポルトガル語[ご] の 標識[ひょうしき] で ヒヤリ ハット を 減[へ]らせる と 考[かんが]えます。 以上[いじょう] です。
    meaning:
      en: In conclusion, I believe Portuguese signs can reduce near misses. That's all.
      pt: Concluindo, acredito que as placas em português podem reduzir os quase acidentes. É isso.
  - speaker: buchou
    text: ありがとう。 では、 質疑[しつぎ] 応答[おうとう] に 移[うつ]ります。
    meaning:
      en: Thank you. Let's move to questions.
      pt: Obrigado. Vamos às perguntas.
  - speaker: sato
    text: 費用[ひよう] は どの くらい です か。
    meaning:
      en: How much will it cost?
      pt: Quanto vai custar?
  - speaker: protagonist
    text: 資料[しりょう] の 四[よん] ページ に あります が、 約[やく] 三十万円[さんじゅうまんえん] です。
    meaning:
      en: It's on page four of the handout — about 300,000 yen.
      pt: Está na página quatro do material — cerca de 300 mil ienes.
  - speaker: buchou
    text: 効果[こうか] は どう やって 確認[かくにん] します か。
    meaning:
      en: How will you confirm the effect?
      pt: Como vai confirmar o resultado?
  - speaker: protagonist
    text: 設置[せっち] して から 三[さん] か月[げつ]、 ヒヤリ ハット の 数[かず] を 比[くら]べます。 ほか に ご質問[しつもん] は ございます か。
    meaning:
      en: For three months after installing them, we'll compare the number of near misses. Are there any other questions?
      pt: Três meses depois de instalar, comparamos o número de quase acidentes. Mais alguma pergunta?
