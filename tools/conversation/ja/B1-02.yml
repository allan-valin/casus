- type: narrator
  text:
    en: 'Hamamatsu is the home of big motorbike, car and musical-instrument makers, and most people drive: buses are few, and the trains run along one line. Even «正直[しょうじき] に» opinions usually keep a «ちょっと».'
    pt: 'Hamamatsu é sede de grandes fabricantes de motos, carros e instrumentos musicais, e quase todo mundo anda de carro: há poucos ônibus, e o trem segue uma linha só. Mesmo opiniões «正直[しょうじき] に» costumam
      guardar um «ちょっと».'
