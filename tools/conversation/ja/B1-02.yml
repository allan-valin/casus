steps:
- type: narrator
  text:
    en: Lunch on the factory roof. Kenta asks what you really think of Hamamatsu after almost a year. Listen to the conversation; you don't need to understand it yet.
    pt: Almoço no terraço da fábrica. O Kenta pergunta o que você realmente acha de Hamamatsu depois de quase um ano. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: 浜松[はままつ]、 どう？ 正直[しょうじき] に 言[い]って。
    meaning:
      en: How's Hamamatsu? Be honest.
      pt: E aí, Hamamatsu? Fala a verdade.
  - speaker: protagonist
    text: 正直[しょうじき] に 言[い]う と… 電車[でんしゃ] が 少[すく]ない から、 ちょっと 不便[ふべん] か な。
    meaning:
      en: To be honest… there aren't many trains, so maybe a bit inconvenient.
      pt: Para ser sincero… tem pouco trem, então talvez seja meio inconveniente.
  - speaker: kenta
    text: そう だ ね。 浜松[はままつ] は 車[くるま] の 町[まち] だ から。
    meaning:
      en: True. Hamamatsu's a car town.
      pt: É verdade. Hamamatsu é cidade de carro.
  - speaker: protagonist
    text: でも スーパー も 病院[びょういん] も 近[ちか]くて、 便利[べんり] だ と 思[おも]う。
    meaning:
      en: But the supermarket and hospital are close, so I think it's convenient.
      pt: Mas o mercado e o hospital são perto, então acho prático.
  - speaker: kenta
    text: 東京[とうきょう] と 比[くら]べたら、 田舎[いなか] でしょ。
    meaning:
      en: Compared with Tokyo, it's the countryside, right?
      pt: Comparado com Tóquio, é interior, né?
  - speaker: protagonist
    text: 都会[とかい] じゃ ない けど、 それ が いい と 思[おも]う。 静[しず]か だし。
    meaning:
      en: It's not a big city, but I think that's good. It's quiet.
      pt: Não é cidade grande, mas acho que isso é bom. É tranquilo.
  - speaker: kenta
    text: よかった。 一年[いちねん] で 帰[かえ]る の？
    meaning:
      en: Glad to hear. Are you going back after one year?
      pt: Que bom. Vai voltar depois de um ano?
  - speaker: protagonist
    text: わからない。 浜松[はままつ] が 好[す]き に なった から。
    meaning:
      en: I don't know. I've come to like Hamamatsu.
      pt: Não sei. Passei a gostar de Hamamatsu.
- type: narrator
  text:
    en: 'Casual opinion: a plain sentence plus «と 思[おも]う». Softer still with «か な» at the end — I wonder, maybe: «ちょっと 不便[ふべん] か な». Japanese wraps a criticism in «ちょっと» and «か な» so it doesn''t land too
      hard.'
    pt: 'Opinião informal: frase simples mais «と 思[おも]う». Mais suave ainda com «か な» no fim — será, talvez: «ちょっと 不便[ふべん] か な». O japonês embrulha a crítica em «ちょっと» e «か な» para ela não cair pesada.'
