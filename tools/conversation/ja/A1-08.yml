steps:
- type: narrator
  text:
    en: Your first day at the car-parts factory. The section chief, Ms Sato, receives you in the office. Listen to the conversation; you don't need to understand it yet.
    pt: Seu primeiro dia na fábrica de autopeças. A chefe de seção, a senhora Sato, recebe você no escritório. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sato
    text: 佐藤[さとう] です。 この 課[か] の 課長[かちょう] です。
    meaning:
      en: I'm Sato. I'm the chief of this section.
      pt: Sou Sato. Sou a chefe desta seção.
  - speaker: protagonist
    text: はじめまして。 今日[きょう] から 入[はい]ります。 どうぞ よろしく お願[ねが]いします。
    meaning:
      en: Nice to meet you. I start today. Pleased to meet you.
      pt: Muito prazer. Começo hoje. Muito prazer em conhecê-la.
  - speaker: sato
    text: 仕事[しごと] は 通訳[つうやく] です ね。
    meaning:
      en: Your job is interpreting, right.
      pt: Seu trabalho é de intérprete, né?
  - speaker: protagonist
    text: はい。 ポルトガル語[ご] と 英語[えいご] の 通訳[つうやく] です。
    meaning:
      en: Yes. Portuguese and English interpreting.
      pt: Sim. Intérprete de português e inglês.
  - speaker: sato
    text: この 会社[かいしゃ] は ブラジル の 人[ひと] が 多[おお]い です。
    meaning:
      en: This company has many Brazilian people.
      pt: Esta empresa tem muitos brasileiros.
  - speaker: protagonist
    text: 佐藤[さとう] さん…
    meaning:
      en: Ms Sato…
      pt: Senhora Sato…
  - speaker: sato
    text: 会社[かいしゃ] で は 「佐藤[さとう] 課長[かちょう]」 です。
    meaning:
      en: At the company it's 'Section Chief Sato'.
      pt: Na empresa é 'chefe Sato'.
  - speaker: protagonist
    text: 失礼[しつれい] しました、 佐藤[さとう] 課長[かちょう]。
    meaning:
      en: Excuse me, Chief Sato.
      pt: Desculpe, chefe Sato.
  - speaker: sato
    text: 頑張[がんば]って ください。
    meaning:
      en: Do your best.
      pt: Força!
