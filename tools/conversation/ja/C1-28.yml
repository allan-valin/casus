- type: narrator
  text:
    en: 'Interpreting for family at a formal meal means translating tone, not only words: a Brazilian hug becomes a bow in Japanese, a loud compliment becomes a humble phrase. Tell both sides beforehand
      what to expect — shoes, chopsticks, gifts — and the evening goes smoothly.'
    pt: 'Interpretar para a família num jantar formal é traduzir o tom, não só as palavras: o abraço brasileiro vira reverência em japonês, o elogio barulhento vira frase humilde. Conte antes para os dois
      lados o que esperar — sapatos, hashi, presentes — e a noite corre tranquila.'
