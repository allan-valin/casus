steps:
- type: narrator
  text:
    en: 'Your parents fly in to meet their grandson. Dinner with Yui''s parents: you translate both ways, choosing every humble and respectful word. Listen to the conversation; you don''t need to understand
      it yet.'
    pt: 'Seus pais vêm conhecer o neto. Jantar com os pais da Yui: você traduz nos dois sentidos, escolhendo cada palavra humilde e respeitosa. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: ご紹介[しょうかい] します。 私[わたし] の 父[ちち] と 母[はは] です。 ブラジル から 参[まい]りました。
    meaning:
      en: Let me introduce my father and mother. They have come from Brazil.
      pt: Permitam-me apresentar meu pai e minha mãe. Vieram do Brasil.
  - speaker: yui-chichi
    text: 遠[とお]い ところ を、 よく いらっしゃいました。
    meaning:
      en: Welcome — you've come such a long way.
      pt: Sejam bem-vindos — vieram de tão longe.
  - speaker: protagonist
    text: 母[はは] が「日本[にほん] は 初[はじ]めて で、 何[なに] もかも 美[うつく]しい」 と 申[もう]して おります。
    meaning:
      en: My mother says, “It's my first time in Japan, and everything is beautiful.”
      pt: 'Minha mãe diz: «É a minha primeira vez no Japão, e tudo é lindo».'
  - speaker: yui-chichi
    text: ブラジル と 比[くら]べて、 日本[にほん] の 料理[りょうり] は どう です か。
    meaning:
      en: Compared with Brazil, how do you find Japanese food?
      pt: Comparando com o Brasil, o que acham da comida japonesa?
  - speaker: protagonist
    text: 父[ちち] は「お刺身[さしみ] は 初[はじ]めて です が、 おいしい」 と 申[もう]して おります。
    meaning:
      en: My father says, “It's my first time eating sashimi, but it's delicious.”
      pt: 'Meu pai diz: «É a primeira vez que como sashimi, mas está delicioso».'
  - speaker: yui
    text: お義父[とう]さん、 お孫[まご] さん を 抱[だ]っこ して みます か。
    meaning:
      en: Father, would you like to hold your grandson?
      pt: Sogro, quer pegar o seu neto no colo?
  - speaker: protagonist
    text: 父[ちち] が 泣[な]いて います。 初[はじ]めて の 孫[まご] だ から。
    meaning:
      en: My father is crying. It's his first grandchild.
      pt: Meu pai está chorando. É o primeiro neto dele.
  - speaker: yui-chichi
    text: 習慣[しゅうかん] の 違[ちが]い は あって も、 孫[まご] を 思[おも]う 気持[きも]ち は 同[おな]じ です ね。
    meaning:
      en: Our customs may differ, but the love for a grandchild is the same.
      pt: Os costumes podem ser diferentes, mas o carinho pelo neto é igual.
