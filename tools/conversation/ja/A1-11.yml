steps:
- type: narrator
  text:
    en: Mr Yamada from a supplier visits the factory. Chief Sato introduces you. Cards come out. Listen to the conversation; you don't need to understand it yet.
    pt: O senhor Yamada, de um fornecedor, visita a fábrica. A chefe Sato apresenta você. Os cartões aparecem. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sato
    text: 山田[やまだ] さん、 紹介[しょうかい] します。 新[あたら]しい 通訳[つうやく] です。
    meaning:
      en: Mr Yamada, let me introduce our new interpreter.
      pt: Senhor Yamada, apresento nossa nova intérprete.
  - speaker: yamada
    text: はじめまして。 山田[やまだ] です。
    meaning:
      en: Nice to meet you. I'm Yamada.
      pt: Muito prazer. Sou Yamada.
  - speaker: protagonist
    text: はじめまして。 どうぞ よろしく お願[ねが]いします。
    meaning:
      en: Nice to meet you. Pleased to meet you.
      pt: Muito prazer. É um prazer conhecê-lo.
  - speaker: yamada
    text: こちら こそ。 名刺[めいし] を どうぞ。
    meaning:
      en: Likewise. Here is my card.
      pt: Igualmente. Aqui está meu cartão.
  - speaker: protagonist
    text: 頂戴[ちょうだい] します。
    meaning:
      en: Thank you, I receive it.
      pt: Recebo com gratidão.
  - speaker: sato
    text: 名刺[めいし] は 両手[りょうて] で 持[も]ちます。 そして、 よく 見[み]ます。
    meaning:
      en: You hold the card with both hands. And look at it well.
      pt: O cartão se segura com as duas mãos. E se olha bem.
  - speaker: protagonist
    text: ポケット は？
    meaning:
      en: In the pocket?
      pt: No bolso?
  - speaker: sato
    text: いいえ。 会議[かいぎ] の 間[あいだ] は 机[つくえ] の 上[うえ] に 置[お]きます。
    meaning:
      en: No. During the meeting you put it on the table.
      pt: Não. Durante a reunião ele fica em cima da mesa.
