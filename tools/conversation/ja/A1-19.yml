steps:
- type: narrator
  text:
    en: You need Friday off for an appointment at the consulate. You ask Chief Sato. Listen to the conversation; you don't need to understand it yet.
    pt: Você precisa da sexta livre para ir ao consulado. Você pede à chefe Sato. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 佐藤[さとう] 課長[かちょう]、 金曜日[きんようび] に 休[やす]み を お願[ねが]いします。
    meaning:
      en: Chief Sato, I'd like Friday off, please.
      pt: Chefe Sato, queria pedir folga na sexta.
  - speaker: sato
    text: 金曜日[きんようび] です か。 金曜日[きんようび] は ちょっと…。
    meaning:
      en: Friday? Friday is a little…
      pt: Sexta? Sexta é meio…
  - speaker: protagonist
    text: 領事館[りょうじかん] です。 どうしても…。
    meaning:
      en: It's the consulate. I really need to…
      pt: É o consulado. Preciso mesmo…
  - speaker: sato
    text: うーん、 金曜日[きんようび] は 忙[いそが]しい です から。 難[むずか]しい です ね。
    meaning:
      en: Hmm, Friday is busy. It's difficult.
      pt: Hmm, sexta é corrido. Fica difícil.
  - speaker: protagonist
    text: 午前[ごぜん] だけ は どう です か。
    meaning:
      en: How about just the morning?
      pt: E só a manhã?
  - speaker: sato
    text: 午前[ごぜん] だけ…。 考[かんが]えて おきます。
    meaning:
      en: Just the morning… I'll think about it.
      pt: Só a manhã… Vou pensar.
  - speaker: protagonist
    text: ありがとう ございます。
    meaning:
      en: Thank you.
      pt: Obrigada.
  - speaker: sato
    text: …はい、 午前[ごぜん] なら 大丈夫[だいじょうぶ] です。
    meaning:
      en: …Yes, the morning is fine.
      pt: …Sim, de manhã tudo bem.
- type: narrator
  text:
    en: Japanese rarely says a flat no. «ちょっと…» with the sentence left open, or «難[むずか]しい です ね», usually means no. Don't push the same request — offer something smaller.
    pt: O japonês raramente diz um não seco. «ちょっと…» com a frase em aberto, ou «難[むずか]しい です ね», em geral, quer dizer não. Não insista no mesmo pedido — ofereça algo menor.
