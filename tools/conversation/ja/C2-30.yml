steps:
- type: narrator
  text:
    en: Five years since you arrived in Hamamatsu. At the summer festival the taiko group plays, and your son watches from Yui's shoulders. The whole story, one last time. Listen to the conversation; you
      don't need to understand it yet.
    pt: Cinco anos desde que você chegou a Hamamatsu. No festival de verão o grupo de taikô toca, e seu filho assiste do ombro da Yui. A história toda, uma última vez. Escute a conversa; ainda não precisa
      entender.
- type: dialogue
  lines:
  - speaker: yui
    text: 五年間[ごねんかん]、 色々[いろいろ] あった ね。
    meaning:
      en: So much happened in five years.
      pt: Aconteceu tanta coisa em cinco anos.
  - speaker: protagonist
    text: 始[はじ]まり は「はじめまして、 ブラジル 人[じん] です」 だけ だった。
    meaning:
      en: It began with nothing but “Nice to meet you, I'm Brazilian.”
      pt: Começou só com «Muito prazer, sou brasileiro».
  - speaker: kenta
    text: 今[いま] は 太鼓[たいこ] の リーダー で、 遠州[えんしゅう] 弁[べん] まで わかる。
    meaning:
      en: Now you lead the taiko group and even understand Enshū dialect.
      pt: Agora você lidera o taikô e entende até o dialeto de Enshū.
  - speaker: protagonist
    text: たくさん の 人[ひと] の おかげ で、 ここ に たどり着[つ]いた。 みんな に 感謝[かんしゃ] して います。
    meaning:
      en: Thanks to so many people, I made it here. I'm grateful to all of you.
      pt: Graças a muita gente, cheguei até aqui. Sou grato a todos vocês.
  - speaker: yui
    text: この 子[こ] に とって は、 故郷[こきょう] が 二[ふた]つ ある ん だ よ ね。
    meaning:
      en: For this little one, there are two homelands.
      pt: Para este pequeno, existem duas terras natais.
  - speaker: protagonist
    text: 日本[にほん] と ブラジル、 両方[りょうほう] の 物語[ものがたり] を 伝[つた]えたい。
    meaning:
      en: I want to pass on the stories of both Japan and Brazil.
      pt: Quero transmitir as histórias do Japão e do Brasil.
  - speaker: kenta
    text: さあ、 太鼓[たいこ] が 始[はじ]まる よ！ リーダー、 行[い]って こい！
    meaning:
      en: Come on, the taiko's starting! Leader, off you go!
      pt: Vamos, o taikô vai começar! Líder, vai lá!
  - speaker: protagonist
    text: これ は 終[お]わり で は ない。 これ から の 物語[ものがたり] の 始[はじ]まり だ。 …やらまいか！
    meaning:
      en: This isn't the end. It's the beginning of the story from here on. …Yaramaika!
      pt: Isso não é o fim. É o começo da história daqui em diante. …Yaramaika!
