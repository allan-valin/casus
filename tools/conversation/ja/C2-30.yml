- type: narrator
  text:
    en: That's the end of the course. From «はじめまして» to Bashō, from the rubbish days to a council briefing, you've moved through plain and polite, humble and respectful, dialect and literature. The language
      goes on — keep talking with your Kenta, your Mrs Suzuki, your town.
    pt: Fim do curso. Do «はじめまして» a Bashō, dos dias do lixo à reunião na prefeitura, você passou pelo informal e o educado, o humilde e o respeitoso, o dialeto e a literatura. A língua continua — siga conversando
      com o seu Kenta, a sua senhora Suzuki, a sua cidade.
- type: narrator
