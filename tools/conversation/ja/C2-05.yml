- type: narrator
  text:
    en: 'Enshū dialect, around Hamamatsu, has easy markers: «〜だら» for «だろう» (isn''t it?); «〜まい» for «〜よう» (let''s — «行[い]きまい», «飲[の]んで いきまい»); «〜だに» for «だよ» or «だから». The famous «やらまいか» means let''s do
      it — a local motto of enterprise.'
    pt: 'O dialeto de Enshū, na região de Hamamatsu, tem marcas fáceis: «〜だら» no lugar de «だろう» (não é?); «〜まい» no lugar de «〜よう» (vamos — «行[い]きまい», «飲[の]んで いきまい»); «〜だに» no lugar de «だよ» ou «だから». O famoso
      «やらまいか» quer dizer vamos fazer — um lema local de iniciativa.'
