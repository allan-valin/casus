    pt: Muitos japoneses usam o japonês padrão com quem é de fora e o dialeto com quem sentem próximo — por isso ouvir o dialeto é sinal de aceitação. O «やらまいか» é associado aos fundadores das empresas de
      motos, carros e instrumentos de Hamamatsu.
