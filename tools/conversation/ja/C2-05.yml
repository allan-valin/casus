steps:
- type: narrator
  text:
    en: Five years on, Mrs Suzuki finally speaks to you in her own dialect, 遠州弁 — the speech of the Hamamatsu area. Listen to the conversation; you don't need to understand it yet.
    pt: Cinco anos depois, a senhora Suzuki finalmente fala com você no próprio dialeto, o 遠州弁 — a fala da região de Hamamatsu. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: 今日[きょう] は 暑[あつ]い だら。 冷[つめ]たい お茶[ちゃ]、 飲[の]んで いきまい。
    meaning:
      en: Hot today, isn't it. Have a cold tea before you go.
      pt: Hoje está quente, né? Toma um chá gelado antes de ir.
  - speaker: protagonist
    text: 鈴木[すずき] さん、 今[いま] の は 方言[ほうげん] です か。 初[はじ]めて 聞[き]きました。
    meaning:
      en: Mrs Suzuki, was that dialect? It's the first time I've heard it.
      pt: Senhora Suzuki, isso foi dialeto? É a primeira vez que ouço.
  - speaker: suzuki
    text: 遠州[えんしゅう] 弁[べん] だに。 今[いま] まで は 標準語[ひょうじゅんご] で 話[はな]して いた けど、 あんた は もう 仲間[なかま] だ で。
    meaning:
      en: It's Enshū dialect. Till now I spoke standard Japanese to you, but you're one of us now.
      pt: É o dialeto de Enshū. Até agora eu falava o japonês padrão com você, mas agora você é das nossas.
  - speaker: protagonist
    text: 嬉[うれ]しい！ 「だら」 は「だろう」 です か。
    meaning:
      en: I'm so glad! Is “dara” the same as “darō”?
      pt: Que alegria! «Dara» é o mesmo que «darō»?
  - speaker: suzuki
    text: そう。「行[い]きまい」 は「行[い]こう」。「やらまいか」 は 浜松[はままつ] の 合言葉[あいことば] だ よ。
    meaning:
      en: Yes. “Ikimai” is “let's go”. And “yaramaika” is Hamamatsu's motto.
      pt: Isso. «Ikimai» é «vamos». E «yaramaika» é o lema de Hamamatsu.
  - speaker: protagonist
    text: やらまいか… 「やって みよう」 です ね。
    meaning:
      en: Yaramaika… “let's give it a go”.
      pt: Yaramaika… «vamos tentar».
  - speaker: suzuki
    text: 浜松[はままつ] の 会社[かいしゃ] は みんな、 その 気持[きも]ち で 始[はじ]まった だに。
    meaning:
      en: All the Hamamatsu companies started with that spirit.
      pt: Todas as empresas de Hamamatsu começaram com esse espírito.
  - speaker: protagonist
    text: 方言[ほうげん] で 話[はな]して もらえる と、 親[した]しみ を 感[かん]じます。 地元[じもと] に なった みたい。
    meaning:
      en: When you speak dialect to me, I feel close. Like this has become my home.
      pt: Quando a senhora fala em dialeto comigo, sinto intimidade. Parece que virou a minha terra.
