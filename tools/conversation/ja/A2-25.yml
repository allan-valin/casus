- type: narrator
  text:
    en: 'Japanese salons are known for care: a long wash with a head massage, a towel over your face, often a shoulder massage at the end. Bring a photo — it saves a lot of words. No tip, as everywhere.'
    pt: 'Os salões japoneses são famosos pelo capricho: lavagem demorada com massagem na cabeça, uma toalhinha no rosto, muitas vezes massagem nos ombros no fim. Leve uma foto — economiza muita palavra.
      Sem gorjeta, como em todo lugar.'
- type: narrator
