steps:
- type: narrator
  text:
    en: Your first haircut in Japan. You booked online; the hairdresser asks what you'd like. Listen to the conversation; you don't need to understand it yet.
    pt: Seu primeiro corte de cabelo no Japão. Você agendou pela internet; a cabeleireira pergunta o que você quer. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: biyoushi
    text: いらっしゃいませ。 ご予約[よやく] の 方[かた] です ね。
    meaning:
      en: Welcome. You have a booking, right?
      pt: Bem-vinda. Você tem horário marcado, certo?
  - speaker: protagonist
    text: はい。 カット を お願[ねが]いします。
    meaning:
      en: Yes. A cut, please.
      pt: Sim. Um corte, por favor.
  - speaker: biyoushi
    text: 今日[きょう] は どう しましょう か。
    meaning:
      en: What shall we do today?
      pt: O que vamos fazer hoje?
  - speaker: protagonist
    text: 全体[ぜんたい] を 少[すこ]し だけ 短[みじか]く して ください。 この くらい。
    meaning:
      en: Make it all just a little shorter, please. About this much.
      pt: Deixe tudo só um pouco mais curto, por favor. Mais ou menos assim.
  - speaker: biyoushi
    text: 前髪[まえがみ] は？
    meaning:
      en: And the fringe?
      pt: E a franja?
  - speaker: protagonist
    text: 前髪[まえがみ] は 軽[かる]く して ください。
    meaning:
      en: Make the fringe lighter, please.
      pt: Deixe a franja mais leve, por favor.
  - speaker: biyoushi
    text: かしこまりました。 まず シャンプー を します ね。
    meaning:
      en: Certainly. First a hair wash.
      pt: Pois não. Primeiro vamos lavar.
  - speaker: protagonist
    text: わあ、 きれい に なりました！ ありがとう ございます。
    meaning:
      en: Wow, it looks great! Thank you.
      pt: Nossa, ficou lindo! Obrigada.
