- type: narrator
  text:
    en: 'An «い» adjective becomes an adverb with «く»: «短[みじか]い» → «短[みじか]く», «軽[かる]い» → «軽[かる]く». With «して ください» it means make it so: «短[みじか]く して ください», make it short. «な» words take «に»: «きれい に».'
    pt: 'Um adjetivo com «い» vira advérbio com «く»: «短[みじか]い» → «短[みじか]く», «軽[かる]い» → «軽[かる]く». Com «して ください» quer dizer deixe assim: «短[みじか]く して ください», deixe curto. Palavras com «な» levam «に»: «きれい に».'
