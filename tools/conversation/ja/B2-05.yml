steps:
- type: narrator
  text:
    en: You want to propose Portuguese safety signs for the factory at Friday's meeting. Chief Sato says the meeting is too late — do the 根回し first. Listen to the conversation; you don't need to understand
      it yet.
    pt: Você quer propor placas de segurança em português para a fábrica na reunião de sexta. A chefe Sato diz que a reunião já é tarde — primeiro, o 根回し. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 金曜日[きんようび] の 会議[かいぎ] で、 ポルトガル語[ご] の 標識[ひょうしき] を 提案[ていあん] したい です。
    meaning:
      en: At Friday's meeting I'd like to propose Portuguese signs.
      pt: Na reunião de sexta quero propor placas em português.
  - speaker: sato
    text: いい 提案[ていあん] です ね。 でも、 根回[ねまわ]し は しました か。
    meaning:
      en: Good proposal. But have you done the groundwork?
      pt: Boa proposta. Mas você já costurou o apoio?
  - speaker: protagonist
    text: 根回[ねまわ]し？
    meaning:
      en: Groundwork?
      pt: Costurar o apoio?
  - speaker: sato
    text: 会議[かいぎ] の 前[まえ] に、 一人[ひとり] ずつ 意見[いけん] を 聞[き]いて、 賛成[さんせい] を 得[え]て おく ん です。
    meaning:
      en: Before the meeting, you ask each person's opinion one by one and win their support.
      pt: Antes da reunião, você ouve a opinião de cada um e consegue o apoio deles.
  - speaker: protagonist
    text: 会議[かいぎ] で 決[き]める ん じゃ ない ん です か。
    meaning:
      en: Isn't the decision made at the meeting?
      pt: A decisão não é tomada na reunião?
  - speaker: sato
    text: 会社[かいしゃ] に よって 違[ちが]います が、 多[おお]く の 場合[ばあい]、 会議[かいぎ] は 決定[けってい] を 確認[かくにん] する 場所[ばしょ] です。
    meaning:
      en: It depends on the company, but often the meeting is where the decision is confirmed.
      pt: Depende da empresa, mas em muitos casos a reunião é o lugar onde a decisão é confirmada.
  - speaker: protagonist
    text: なるほど。 じゃあ、 事前[じぜん] に 工場長[こうじょうちょう] と 安全[あんぜん] 担当[たんとう] に 話[はな]して おきます。
    meaning:
      en: I see. Then I'll talk to the plant manager and the safety officer beforehand.
      pt: Entendi. Então vou conversar antes com o gerente da fábrica e o responsável pela segurança.
  - speaker: sato
    text: それ が いい です。 議題[ぎだい] に は 私[わたし] が 入[い]れて おきます ね。
    meaning:
      en: Good. I'll put it on the agenda.
      pt: Isso. Eu coloco na pauta.
