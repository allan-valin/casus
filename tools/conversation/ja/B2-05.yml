- type: narrator
  text:
    en: '«根回[ねまわ]し» comes from gardening: digging round a tree''s roots before moving it. Before a meeting you talk to each person who matters, hear objections and win support, so the meeting can approve
      without conflict. Surprising people with a new idea in the meeting can embarrass them.'
    pt: '«根回[ねまわ]し» vem da jardinagem: cavar em volta das raízes antes de transplantar uma árvore. Antes de uma reunião você conversa com cada pessoa importante, ouve as objeções e conquista o apoio, para
      a reunião aprovar sem conflito. Surpreender as pessoas com uma ideia nova na reunião pode deixá-las constrangidas.'
- type: narrator
  for:
  - pt
  text:
    pt: 'No Brasil se diria «fazer o meio de campo» ou «costurar politicamente». No Japão isso não é jeitinho: é o caminho normal para uma proposta passar.'
