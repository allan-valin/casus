steps:
- type: narrator
  text:
    en: 'Three years in Hamamatsu. Everyone at the izakaya: Kenta and Misaki, Yui, Lucas, Mrs Suzuki. A look back at all of C1. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Três anos em Hamamatsu. Todo mundo no izakaya: o Kenta e a Misaki, a Yui, o Lucas, a senhora Suzuki. Uma revisão de todo o C1. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: kenta
    text: 三年[さんねん] 前[まえ] は「タメ口[ぐち] で いい よ」 から 始[はじ]まった ね。
    meaning:
      en: Three years ago it started with “plain talk is fine”.
      pt: Três anos atrás começou com «pode falar normal comigo».
  - speaker: protagonist
    text: 振[ふ]り返[かえ]る と、 たくさん の 人[ひと] に 支[ささ]えられて きた。
    meaning:
      en: Looking back, I've been supported by so many people.
      pt: Olhando para trás, fui apoiado por muita gente.
  - speaker: suzuki
    text: ゴミ の 日[ひ] も 知[し]らなかった の に、 今[いま] は 町内会[ちょうないかい] の 人[ひと] です から ね。
    meaning:
      en: You didn't even know the rubbish days, and now you're in the neighbourhood association.
      pt: Você nem sabia os dias do lixo, e agora é da associação do bairro.
  - speaker: misaki
    text: 陽菜[ひな] も、 おじさん の ポルトガル語[ご] の 歌[うた] が 好[す]き です よ。
    meaning:
      en: Hina loves your Portuguese songs too, uncle.
      pt: A Hina também adora as músicas em português do tio.
  - speaker: lucas
    text: 俺[おれ] も 来年[らいねん] は N1 に 合格[ごうかく] する！
    meaning:
      en: Next year I'll pass N1 too!
      pt: Ano que vem eu também passo no N1!
  - speaker: yui
    text: 浜松[はままつ] は、 あなた の 第二[だいに] の 故郷[こきょう] に なった ね。
    meaning:
      en: Hamamatsu has become your second home.
      pt: Hamamatsu virou a sua segunda terra natal.
  - speaker: protagonist
    text: うん。 皆[みな]さん と の 出会[であ]い に 感謝[かんしゃ] して います。 これ から も よろしく お願[ねが]い します。
    meaning:
      en: Yes. I'm grateful for meeting all of you. Please keep being part of my life.
      pt: É. Sou grato por ter conhecido todos vocês. Conto com vocês daqui em diante também.
  - speaker: kenta
    text: じゃあ、 これ から の 三年[さんねん] に 乾杯[かんぱい]！
    meaning:
      en: Then, a toast to the next three years!
      pt: Então, um brinde aos próximos três anos!
