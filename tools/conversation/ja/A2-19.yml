- type: narrator
  text:
    en: 'The great-uncle speaks Hiroshima dialect: «よう» for «よく», «のう» for «ね», «おる» for «いる». From the 1900s to the 1960s whole villages in Hiroshima, Kumamoto, Okinawa and Fukuoka sent emigrants to Brazil;
      many still keep photos and letters from the other side.'
    pt: 'O tio-avô fala o dialeto de Hiroshima: «よう» no lugar de «よく», «のう» no lugar de «ね», «おる» no lugar de «いる». Dos anos 1900 aos 1960, aldeias inteiras de Hiroshima, Kumamoto, Okinawa e Fukuoka mandaram
      emigrantes para o Brasil; muitas famílias ainda guardam fotos e cartas do outro lado.'
- type: narrator
