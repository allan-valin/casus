steps:
- type: narrator
  text:
    en: 'A long weekend in Hiroshima prefecture: the village your grandmother left as a child. Her younger brother, now eighty, is waiting at the bus stop. Listen to the conversation; you don''t need to
      understand it yet.'
    pt: 'Um feriado prolongado na província de Hiroshima: a aldeia que sua avó deixou quando criança. O irmão mais novo dela, hoje com oitenta anos, espera no ponto de ônibus. Escute a conversa; ainda não
      precisa entender.'
- type: dialogue
  lines:
  - speaker: ojisan
    text: よう 来[き]た のう。 おかえり。
    meaning:
      en: Good of you to come. Welcome home.
      pt: Que bom que veio. Bem-vinda de volta.
  - speaker: protagonist
    text: はじめまして。 千代[ちよ] の 孫[まご] です。
    meaning:
      en: Nice to meet you. I'm Chiyo's granddaughter.
      pt: Muito prazer. Sou neta da Chiyo.
  - speaker: ojisan
    text: 姉[あね] に よう 似[に]て いる。 日本[にほん] に 来[き]た こと が ある か。
    meaning:
      en: You look just like my sister. Have you been to Japan before?
      pt: Você é a cara da minha irmã. Já tinha vindo ao Japão?
  - speaker: protagonist
    text: いいえ、 来[き]た こと が ありません でした。 今[いま] は 浜松[はままつ] で 働[はたら]いて います。
    meaning:
      en: No, I'd never been. Now I work in Hamamatsu.
      pt: Não, nunca tinha vindo. Agora trabalho em Hamamatsu.
  - speaker: ojisan
    text: この 村[むら] から、 昔[むかし] たくさん の 移民[いみん] が ブラジル へ 行[い]った。
    meaning:
      en: Long ago, many emigrants left this village for Brazil.
      pt: Antigamente, muitos emigrantes saíram desta aldeia para o Brasil.
  - speaker: protagonist
    text: ブラジル に 行[い]った こと が あります か。
    meaning:
      en: Have you ever been to Brazil?
      pt: O senhor já foi ao Brasil?
  - speaker: ojisan
    text: ない。 でも 親戚[しんせき] が たくさん おる。 まず、 お墓[はか] に お参[まい]り しよう。
    meaning:
      en: No. But I have many relatives there. First, let's visit the family grave.
      pt: Não. Mas tenho muitos parentes lá. Primeiro, vamos visitar o túmulo da família.
  - speaker: protagonist
    text: はい。 祖母[そぼ] の 写真[しゃしん] を 持[も]って きました。
    meaning:
      en: Yes. I brought grandmother's photo.
      pt: Vamos. Eu trouxe a foto da vovó.
