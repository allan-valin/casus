steps:
- type: narrator
  text:
    en: Summer. The factory asks everyone to save electricity. At lunch Kenta and Chief Sato talk about nuclear power — the Hamaoka plant is not far from Hamamatsu. Listen to the conversation; you don't
      need to understand it yet.
    pt: Verão. A fábrica pede a todos que economizem energia. No almoço o Kenta e a chefe Sato falam de energia nuclear — a usina de Hamaoka fica perto de Hamamatsu. Escute a conversa; ainda não precisa
      entender.
- type: dialogue
  lines:
  - speaker: sato
    text: 今年[ことし] も 節電[せつでん] を お願[ねが]いします。 エアコン は 二十八度[にじゅうはちど] に して ください。
    meaning:
      en: Please save electricity again this year. Set the air conditioning to 28 degrees.
      pt: Este ano também, economizem energia, por favor. Ar-condicionado em 28 graus.
  - speaker: kenta
    text: 暑[あつ]い ので、 二十八度[にじゅうはちど] は つらい です ね。
    meaning:
      en: It's hot, so 28 is tough.
      pt: Como está calor, 28 graus é sofrido.
  - speaker: protagonist
    text: どうして 節電[せつでん] が 必要[ひつよう] な ん です か。
    meaning:
      en: Why do we need to save electricity?
      pt: Por que precisa economizar energia?
  - speaker: sato
    text: 2011 年[ねん] の 事故[じこ] の 後[あと]、 原発[げんぱつ] が 止[と]まった ので。 浜岡[はまおか] 原発[げんぱつ] も まだ 止[と]まって います。
    meaning:
      en: After the 2011 accident the nuclear plants stopped. Hamaoka is still stopped.
      pt: Depois do acidente de 2011 as usinas nucleares pararam. Hamaoka continua parada.
  - speaker: kenta
    text: 電気代[でんきだい] も 高[たか]く なった し。
    meaning:
      en: And the electricity bill went up.
      pt: E a conta de luz subiu.
  - speaker: protagonist
    text: 原発[げんぱつ] に は 賛成[さんせい] です か、 反対[はんたい] です か。
    meaning:
      en: Are you for or against nuclear power?
      pt: Vocês são a favor ou contra a energia nuclear?
  - speaker: sato
    text: 難[むずか]しい です ね。 安全[あんぜん] の 問題[もんだい] も ある し、 エネルギー も 必要[ひつよう] です。
    meaning:
      en: It's difficult. There's the safety issue, and we need energy too.
      pt: É difícil. Tem a questão de segurança, e a energia também é necessária.
  - speaker: kenta
    text: 僕[ぼく] は 太陽光[たいようこう] が もっと 増[ふ]えて ほしい。
    meaning:
      en: I want more solar power.
      pt: Eu queria mais energia solar.
