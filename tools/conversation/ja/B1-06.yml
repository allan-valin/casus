- type: narrator
  text:
    en: After the 2011 earthquake and the Fukushima accident, Japan stopped its nuclear plants; some have restarted since, others, like Hamaoka in Shizuoka, have not. Summer «節電[せつでん]» campaigns ask offices
      to set air conditioning to 28 °C. Opinions are divided, and people say so carefully.
    pt: Depois do terremoto de 2011 e do acidente de Fukushima, o Japão parou suas usinas nucleares; algumas voltaram desde então, outras, como Hamaoka em Shizuoka, não. Campanhas de «節電[せつでん]» no verão
      pedem aos escritórios ar-condicionado em 28 °C. As opiniões são divididas, e ditas com cuidado.
