steps:
- type: narrator
  text:
    en: Tomorrow you interpret for an important client. Chief Sato gives advice on how to dress. Listen to the conversation; you don't need to understand it yet.
    pt: Amanhã você vai interpretar para um cliente importante. A chefe Sato dá conselhos sobre como se vestir. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sato
    text: 明日[あした] は 大事[だいじ] な お客様[きゃくさま] です。 スーツ を 着[き]た ほう が いい です よ。
    meaning:
      en: Tomorrow's client is important. You'd better wear a suit.
      pt: O cliente de amanhã é importante. É melhor vir de tailleur.
  - speaker: protagonist
    text: はい。 色[いろ] は 何[なに] が いい です か。
    meaning:
      en: Yes. What colour is best?
      pt: Certo. Que cor é melhor?
  - speaker: sato
    text: 紺[こん] か 黒[くろ]。 地味[じみ] な 色[いろ] が いい です。 派手[はで] な の は ちょっと…
    meaning:
      en: Navy or black. A plain colour. Something flashy is a bit…
      pt: Azul-marinho ou preto. Uma cor discreta. Chamativo é meio…
  - speaker: protagonist
    text: 香水[こうすい] は？ ブラジル で は 毎日[まいにち] つけます。
    meaning:
      en: And perfume? In Brazil I wear it every day.
      pt: E perfume? No Brasil eu passo todo dia.
  - speaker: sato
    text: 強[つよ]い 香水[こうすい] は つけない ほう が いい です ね。 清潔[せいけつ] が 一番[いちばん] です。
    meaning:
      en: Better not wear strong perfume. Clean is best.
      pt: É melhor não passar perfume forte. Limpo é o melhor.
  - speaker: protagonist
    text: 身[み]だしなみ は 大事[だいじ] です ね。
    meaning:
      en: Appearance matters, then.
      pt: A aparência importa, então.
  - speaker: sato
    text: ええ。 靴[くつ] も 磨[みが]いた ほう が いい です よ。
    meaning:
      en: Yes. You'd better polish your shoes too.
      pt: Sim. É melhor engraxar os sapatos também.
  - speaker: protagonist
    text: わかりました。 今晩[こんばん] 準備[じゅんび] して おきます。
    meaning:
      en: Understood. I'll get everything ready tonight.
      pt: Entendido. Vou deixar tudo pronto hoje à noite.
