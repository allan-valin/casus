- type: narrator
  text:
    en: Permanent residence, «永住[えいじゅう]», usually needs about ten years in Japan, fewer for spouses of Japanese citizens and for some highly skilled workers. Many Brazilians in Hamamatsu live between the
      two countries for years before deciding.
    pt: A residência permanente, «永住[えいじゅう]», em geral pede uns dez anos no Japão, menos para cônjuges de japoneses e para alguns profissionais altamente qualificados. Muitos brasileiros de Hamamatsu vivem
      entre os dois países por anos antes de decidir.
- type: narrator
  text:
    en: 'That''s the end of B2. You can work in Japanese: humble and respectful verbs, email and phone, meetings and presentations, complaints and apologies, leave and promotions — and talk about the harder
      topics: ageing, marriage, harassment, the news. In C1: life in depth.'
    pt: 'Fim do B2. Você consegue trabalhar em japonês: verbos humildes e respeitosos, e-mail e telefone, reuniões e apresentações, reclamações e desculpas, férias e promoções — e falar dos temas mais difíceis:
      envelhecimento, casamento, assédio, o noticiário. No C1: a vida em profundidade.'
