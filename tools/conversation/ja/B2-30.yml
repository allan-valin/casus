steps:
- type: narrator
  text:
    en: 'Two years in Japan. Yui asks the question you''ve been avoiding: stay, or go back to Brazil? A look back at all of B2. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Dois anos no Japão. A Yui faz a pergunta que você vinha evitando: ficar, ou voltar para o Brasil? Uma revisão de todo o B2. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: yui
    text: ねえ、 将来[しょうらい] の こと、 考[かんが]えて る？ 帰国[きこく] する の？
    meaning:
      en: Hey, have you thought about the future? Are you going back?
      pt: Ei, você pensa no futuro? Vai voltar?
  - speaker: protagonist
    text: ずっと 迷[まよ]って いた。 家族[かぞく] は ブラジル に いる から。
    meaning:
      en: I've been torn for a long time. My family's in Brazil.
      pt: Fiquei em dúvida esse tempo todo. Minha família está no Brasil.
  - speaker: yui
    text: そう だ よね…
    meaning:
      en: Right…
      pt: É…
  - speaker: protagonist
    text: でも 決心[けっしん] した。 日本[にほん] に 残[のこ]る。 由衣[ゆい] と 一緒[いっしょ] に いたい。
    meaning:
      en: But I've decided. I'm staying in Japan. I want to be with you.
      pt: Mas decidi. Vou ficar no Japão. Quero ficar com você.
  - speaker: yui
    text: 本当[ほんとう]？ 嬉[うれ]しい！
    meaning:
      en: Really? I'm so happy!
      pt: Sério? Que alegria!
  - speaker: protagonist
    text: 仕事[しごと] で も、 両方[りょうほう] の 国[くに] の 架[か]け橋[はし] に なりたい。 いつか 永住[えいじゅう] も 申請[しんせい] する つもり。
    meaning:
      en: At work too, I want to be a bridge between both countries. Someday I plan to apply for permanent residence.
      pt: No trabalho também, quero ser uma ponte entre os dois países. Um dia pretendo pedir a residência permanente.
  - speaker: yui
    text: お母[かあ]さん たち は 大丈夫[だいじょうぶ]？
    meaning:
      en: Will your mother and family be all right?
      pt: E a sua mãe e a família?
  - speaker: protagonist
    text: 毎年[まいとし] 会[あ]い に 行[い]く。 心配[しんぱい] しないで。 次[つぎ] は 由衣[ゆい] も 一緒[いっしょ] に ブラジル へ 行[い]こう。
    meaning:
      en: I'll go and see them every year. Don't worry. Next time, let's go to Brazil together.
      pt: Vou visitar todo ano. Não se preocupe. Da próxima vez, vamos juntos para o Brasil.
