- type: narrator
  text:
    en: 'Neighbours in Japan rarely knock on your door to complain: a note appears, or the management company calls. Thin walls carry voices, and «夜[よる] 十時[じゅうじ] 以降[いこう]» quiet is a common rule. Going over
      to argue can make things worse — let the company handle it, and apologise through them.'
    pt: 'No Japão o vizinho raramente bate na porta para reclamar: aparece um bilhete, ou a administradora liga. As paredes finas deixam passar vozes, e silêncio «夜[よる] 十時[じゅうじ] 以降[いこう]» é regra comum.
      Ir lá discutir pode piorar — deixe a administradora cuidar e peça desculpas por meio dela.'
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil a gente resolve com o vizinho no corredor. No Japão o caminho indireto é o educado — o bilhete não é covardia, é cortesia.
