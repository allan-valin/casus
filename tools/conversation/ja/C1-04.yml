steps:
- type: narrator
  text:
    en: 'A note appears on your door: complaints about noise late at night. It''s your Brazilian friends'' Saturday visits. You call the management company. Listen to the conversation; you don''t need to
      understand it yet.'
    pt: 'Aparece um bilhete na sua porta: reclamação de barulho tarde da noite. São as visitas de sábado dos seus amigos brasileiros. Você liga para a administradora. Escute a conversa; ainda não precisa
      entender.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: もしもし、 ドア に 騒音[そうおん] の 張[は]り紙[がみ] が あって…
    meaning:
      en: Hello, there's a notice about noise on my door…
      pt: Alô, colaram um aviso de barulho na minha porta…
  - speaker: madoguchi
    text: はい、 近所[きんじょ] の 方[かた] から 苦情[くじょう] が ありました。 土曜日[どようび] の 夜[よる] の 話[はな]し声[ごえ] です。
    meaning:
      en: Yes, we had a complaint from a neighbour. Voices on Saturday nights.
      pt: Sim, um vizinho reclamou. Vozes no sábado à noite.
  - speaker: protagonist
    text: すみません。 友達[ともだち] が 来[き]て いました。 直接[ちょくせつ] 謝[あやま]りに 行[い]った ほう が いい です か。
    meaning:
      en: Sorry. Friends were over. Should I go and apologise in person?
      pt: Desculpe. Uns amigos estavam aqui. É melhor eu ir pedir desculpas pessoalmente?
  - speaker: madoguchi
    text: お気持[きも]ち は わかります が、 直接[ちょくせつ] 行[い]く と トラブル に なり かねません。 こちら から お伝[つた]え します。
    meaning:
      en: I understand, but going directly could turn into trouble. We'll pass it on.
      pt: Entendo, mas ir direto pode acabar em problema. Nós transmitimos.
  - speaker: protagonist
    text: わかりました。 管理[かんり] 規約[きやく] で は 何時[なんじ] まで です か。
    meaning:
      en: Understood. Until what time do the building rules allow?
      pt: Entendi. Pelo regulamento do prédio, até que horas pode?
  - speaker: madoguchi
    text: 夜[よる] 十時[じゅうじ] 以降[いこう] は 静[しず]か に して ください。
    meaning:
      en: Please keep quiet after 10 p.m.
      pt: Depois das 22h, silêncio, por favor.
  - speaker: protagonist
    text: 以後[いご] 気[き] を つけます。 ご迷惑[めいわく] を おかけ しました。
    meaning:
      en: I'll be careful from now on. Sorry for the trouble.
      pt: Daqui em diante vou tomar cuidado. Desculpe o transtorno.
  - speaker: madoguchi
    text: ご理解[りかい] ありがとう ございます。
    meaning:
      en: Thank you for understanding.
      pt: Obrigada pela compreensão.
