steps:
- type: narrator
  text:
    en: Your bag of plastics comes back with a sticker on it. Mrs Suzuki explains. Listen to the conversation; you don't need to understand it yet.
    pt: Sua sacola de plástico volta com um adesivo. A senhora Suzuki explica. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: これ、 あなた の ごみ です ね。
    meaning:
      en: This is your rubbish, isn't it.
      pt: Isto é o seu lixo, né?
  - speaker: protagonist
    text: はい…。 すみません。 何[なん] です か。
    meaning:
      en: Yes… Sorry. What's wrong?
      pt: Sim… Desculpe. O que foi?
  - speaker: suzuki
    text: 今日[きょう] は 燃[も]える ごみ の 日[ひ] です。 プラスチック は 木曜日[もくようび] です。
    meaning:
      en: Today is burnable rubbish day. Plastics are on Thursday.
      pt: Hoje é dia de lixo queimável. Plástico é na quinta.
  - speaker: protagonist
    text: 燃[も]える ごみ は 何曜日[なんようび] です か。
    meaning:
      en: What day is burnable rubbish?
      pt: Lixo queimável é em que dia?
  - speaker: suzuki
    text: 月曜日[げつようび] と 木曜日[もくようび]。 朝[あさ] 八時[はちじ] まで に 出[だ]します。
    meaning:
      en: Monday and Thursday. You put it out by eight in the morning.
      pt: Segunda e quinta. Põe-se para fora até as oito da manhã.
  - speaker: protagonist
    text: 八時[はちじ] まで に。 わかりました。
    meaning:
      en: By eight. Understood.
      pt: Até as oito. Entendi.
  - speaker: suzuki
    text: この 紙[かみ] に 全部[ぜんぶ] あります。
    meaning:
      en: It's all on this sheet.
      pt: Está tudo nesta folha.
  - speaker: protagonist
    text: ありがとう ございます。 気[き] を つけます。
    meaning:
      en: Thank you. I'll be careful.
      pt: Obrigada. Vou tomar cuidado.
- type: narrator
  text:
    en: Rubbish is sorted by type and goes out on fixed days. A wrong bag comes back with a sticker.
    pt: O lixo é separado por tipo e sai em dias fixos. A sacola errada volta com um adesivo.
