- type: narrator
  text:
    en: 'Almost three in ten people in Japan are over 65, and many live alone. «孤独死[こどくし]» — dying alone, found days later — is a known social problem. Neighbourhood associations, mail carriers and delivery
      services keep an eye out: piled-up newspapers are a warning sign.'
    pt: 'Quase três em cada dez pessoas no Japão têm mais de 65 anos, e muitas moram sozinhas. O «孤独死[こどくし]» — morrer sozinho e ser encontrado dias depois — é um problema social conhecido. Associações de
      bairro, carteiros e serviços de entrega ficam atentos: jornal acumulado é sinal de alerta.'
