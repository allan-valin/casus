steps:
- type: narrator
  text:
    en: The old lady downstairs hasn't taken her newspaper in for two days. You knock; she's fine, but lonely. Mrs Suzuki explains the neighbourhood watch. Listen to the conversation; you don't need to
      understand it yet.
    pt: A senhora idosa do andar de baixo não recolhe o jornal há dois dias. Você bate na porta; ela está bem, mas sozinha. A senhora Suzuki explica a vigilância do bairro. Escute a conversa; ainda não
      precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: こんにちは。 新聞[しんぶん] が たまって いた ので… お元気[げんき] です か。
    meaning:
      en: Hello. Your newspapers were piling up, so… are you well?
      pt: Boa tarde. Os jornais estavam acumulando, então… a senhora está bem?
  - speaker: obaasan
    text: まあ、 ありがとう。 足[あし] が 痛[いた]くて、 外[そと] に 出[で]られなかった の。
    meaning:
      en: Oh, thank you. My legs hurt, I couldn't go out.
      pt: Ah, obrigada. As pernas estavam doendo, não consegui sair.
  - speaker: protagonist
    text: 一人[ひとり] 暮[ぐ]らし です か。
    meaning:
      en: Do you live alone?
      pt: A senhora mora sozinha?
  - speaker: obaasan
    text: 主人[しゅじん] が 亡[な]くなって から、 十年[じゅうねん]。 話[はな]す 人[ひと] が いなくて ね。
    meaning:
      en: Ten years since my husband died. There's no one to talk to.
      pt: Faz dez anos que meu marido morreu. Não tenho com quem conversar.
  - speaker: protagonist
    text: また 来[き]ます ね。 何[なに] か あったら 呼[よ]んで ください。
    meaning:
      en: I'll come again. Call me if anything happens.
      pt: Eu volto, viu. Se precisar de algo, me chame.
  - speaker: suzuki
    text: えらい です ね。 町内会[ちょうないかい] でも、 高齢者[こうれいしゃ] の 見守[みまも]り を して います。
    meaning:
      en: Good of you. The neighbourhood association watches over the elderly too.
      pt: Que bom que você foi. A associação do bairro também acompanha os idosos.
  - speaker: protagonist
    text: 孤独[こどく] な 人[ひと] が 多[おお]い ん です か。
    meaning:
      en: Are there many lonely people?
      pt: Tem muita gente sozinha?
  - speaker: suzuki
    text: ええ。 家族[かぞく] が 心配[しんぱい] しない ように、 毎朝[まいあさ] 声[こえ] を かける ん です。
    meaning:
      en: Yes. So their families don't worry, we check on them every morning.
      pt: Sim. Para que as famílias não se preocupem, a gente passa para falar com eles toda manhã.
