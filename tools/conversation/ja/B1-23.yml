- type: narrator
  text:
    en: With an ageing population, Japan depends more and more on foreign workers — in convenience stores, factories, farms and care homes. Many are students allowed to work limited hours. Long hours, language
      barriers and visa rules make it hard; it is one of the country's big debates.
    pt: Com a população envelhecendo, o Japão depende cada vez mais de trabalhadores estrangeiros — em lojas de conveniência, fábricas, lavouras e casas de repouso. Muitos são estudantes que podem trabalhar
      um número limitado de horas. Jornada longa, barreira da língua e regras de visto tornam tudo difícil; é um dos grandes debates do país.
- type: narrator
  for:
  - pt
  text:
    pt: 'Para os brasileiros de Hamamatsu, isso não é novidade: desde 1990 a comunidade trabalha nas fábricas. Hoje divide o espaço com vietnamitas, nepaleses, filipinos e muitos outros.'
