steps:
- type: narrator
  text:
    en: Midnight at the convenience store. The clerk is Lucas, a Brazilian from Londrina, studying a Japanese textbook between customers. The manager is restocking. Listen to the conversation; you don't
      need to understand it yet.
    pt: Meia-noite na loja de conveniência. O atendente é o Lucas, um brasileiro de Londrina, estudando um livro de japonês entre um cliente e outro. O gerente está repondo as prateleiras. Escute a conversa;
      ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: あれ、 ブラジル の 人[ひと]？ 夜勤[やきん]、 大変[たいへん] でしょう。
    meaning:
      en: Oh, are you Brazilian? The night shift must be tough.
      pt: Opa, você é brasileiro? O turno da noite deve ser puxado.
  - speaker: lucas
    text: うん、 ちょっと 眠[ねむ]い。 でも 働[はたら]きながら 日本語[にほんご] を 勉強[べんきょう] して る。
    meaning:
      en: Yeah, a bit sleepy. But I study Japanese while I work.
      pt: É, dá um soninho. Mas estudo japonês enquanto trabalho.
  - speaker: protagonist
    text: すごい！ 時給[じきゅう] は いい の？
    meaning:
      en: Great! Is the hourly pay good?
      pt: Que legal! O salário por hora é bom?
  - speaker: lucas
    text: 夜[よる] は 少[すこ]し 高[たか]い。 昼[ひる] は 学校[がっこう]。
    meaning:
      en: A bit higher at night. School in the day.
      pt: À noite é um pouco mais alto. De dia, escola.
  - speaker: tencho
    text: ルーカス くん、 よく 頑張[がんば]って くれる ん です よ。 人手[ひとで] 不足[ぶそく] だ から、 本当[ほんとう] に 助[たす]かります。
    meaning:
      en: Lucas works really hard for us. We're short of staff, so it's a big help.
      pt: O Lucas se esforça muito. Está faltando gente, então ajuda demais.
  - speaker: protagonist
    text: 外国人[がいこくじん] 労働者[ろうどうしゃ] は 増[ふ]えて います か。
    meaning:
      en: Are foreign workers increasing?
      pt: Os trabalhadores estrangeiros estão aumentando?
  - speaker: tencho
    text: ええ。 コンビニ も 工場[こうじょう] も、 留学生[りゅうがくせい] や 外国[がいこく] の 人[ひと] が いない と 回[まわ]りません。
    meaning:
      en: Yes. Konbini and factories can't run without international students and foreign workers.
      pt: Sim. Loja de conveniência e fábrica não funcionam sem estudantes e trabalhadores estrangeiros.
  - speaker: lucas
    text: でも 言葉[ことば] や ビザ の 問題[もんだい] も ある。 簡単[かんたん] じゃ ない よ。
    meaning:
      en: But there are language and visa problems too. It's not easy.
      pt: Mas tem o problema da língua e do visto também. Não é fácil.
