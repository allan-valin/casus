    en: 'Group taiko, «組[くみ]太鼓[だいこ]», is a full-body art: low stance, drumming with the hips, shouts like «ソーレ！» and «ハッ！». Practices start and end with a loud greeting and a bow; neighbourhood groups play
      at festivals and welcome newcomers.'
    pt: 'O taikô em grupo, «組[くみ]太鼓[だいこ]», é uma arte do corpo inteiro: postura baixa, toque com o quadril, gritos como «ソーレ！» e «ハッ！». Os treinos começam e terminam com um cumprimento alto e uma reverência;
      os grupos de bairro tocam nos festivais e recebem bem quem chega.'
