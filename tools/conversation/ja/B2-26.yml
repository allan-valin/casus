steps:
- type: narrator
  text:
    en: Kenta talks you into joining the neighbourhood taiko group, which drums at the summer festival. First practice with Ōno-sensei. Listen to the conversation; you don't need to understand it yet.
    pt: O Kenta te convence a entrar no grupo de taikô do bairro, que toca no festival de verão. Primeiro treino com a professora Ōno. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: taiko-sensei
    text: よろしく お願[ねが]い します！ では、 練習[れんしゅう] を 始[はじ]めます。
    meaning:
      en: Yoroshiku onegai shimasu! Let's begin practice.
      pt: Yoroshiku onegai shimasu! Vamos começar o treino.
  - speaker: protagonist
    text: よろしく お願[ねが]い します！ ばち は こう 持[も]ちます か。
    meaning:
      en: Yoroshiku onegai shimasu! Do I hold the sticks like this?
      pt: Yoroshiku onegai shimasu! Seguro as baquetas assim?
  - speaker: taiko-sensei
    text: まず 姿勢[しせい]。 足[あし] を 広[ひろ]げて、 腰[こし] を 落[お]として。 いい 音[おと] を 出[だ]す ため に は、 体[からだ] 全体[ぜんたい] で 打[う]ちます。
    meaning:
      en: First, posture. Feet apart, hips low. To make a good sound, you hit with your whole body.
      pt: Primeiro, a postura. Pés afastados, quadril baixo. Para tirar um bom som, você bate com o corpo todo.
  - speaker: kenta
    text: 掛[か]け声[ごえ] も 大事[だいじ] だ よ。 「ソーレ！」 って。
    meaning:
      en: The shouts matter too. “Sōre!”
      pt: O grito também é importante. «Sōre!»
  - speaker: protagonist
    text: ソーレ！ …リズム が 難[むずか]しい。 サンバ と 違[ちが]う。
    meaning:
      en: Sōre! …The rhythm's hard. It's not like samba.
      pt: Sōre! …O ritmo é difícil. É diferente do samba.
  - speaker: taiko-sensei
    text: 呼吸[こきゅう] を みんな と 合[あ]わせて。 上手[じょうず] に なる ため に、 毎週[まいしゅう] 来[き]て ください。
    meaning:
      en: Match your breathing with everyone. To get good, come every week.
      pt: Acompanhe a respiração de todos. Para ficar bom, venha toda semana.
  - speaker: protagonist
    text: はい。 夏祭[なつまつ]り で 叩[たた]く ため に、 頑張[がんば]ります。
    meaning:
      en: Yes. I'll work hard so I can drum at the summer festival.
      pt: Sim. Vou me esforçar para tocar no festival de verão.
  - speaker: taiko-sensei
    text: ありがとう ございました！ 今日[きょう] は ここ まで。
    meaning:
      en: Thank you! That's it for today.
      pt: Obrigada! Por hoje é só.
