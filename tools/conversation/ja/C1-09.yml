- type: narrator
  text:
    en: In Japan any traffic accident, however small, must be reported to the police — it's the law, and without the police report there's no «事故[じこ] 証明[しょうめい]» and your insurance may not pay. Fault is
      split in percentages, «過失[かしつ] 割合[わりあい]», based on standard tables.
    pt: No Japão todo acidente de trânsito, por menor que seja, tem que ser comunicado à polícia — é lei, e sem o registro policial não sai a «事故[じこ] 証明[しょうめい]» e o seguro pode não pagar. A culpa é dividida
      em porcentagens, «過失[かしつ] 割合[わりあい]», com base em tabelas padrão.
- type: narrator
  for:
  - pt
  text:
    pt: 'No Brasil muita batida leve se resolve com foto e WhatsApp. No Japão, acordo sem polícia é arriscado: o seguro pede o documento oficial.'
