steps:
- type: narrator
  text:
    en: A car backs into yours in a supermarket car park — a scratch, nobody hurt. The other driver wants to settle it privately. Shota says call the police. Listen to the conversation; you don't need to
      understand it yet.
    pt: Um carro dá ré e bate no seu no estacionamento do supermercado — um arranhão, ninguém ferido. O outro motorista quer resolver entre vocês. O Shota diz para chamar a polícia. Escute a conversa; ainda
      não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: ちょっと 傷[きず] が ついた だけ です。 怪我[けが] は ありません。
    meaning:
      en: It's just a small scratch. Nobody's hurt.
      pt: Foi só um arranhãozinho. Ninguém se feriu.
  - speaker: shota
    text: それでも 警察[けいさつ] を 呼[よ]ぼう。 相手[あいて] は 示談[じだん] に したい みたい だ けど。
    meaning:
      en: Even so, let's call the police. The other driver seems to want a private settlement, though.
      pt: Mesmo assim, vamos chamar a polícia. O outro motorista parece querer um acordo particular.
  - speaker: protagonist
    text: どうして？ 小[ちい]さな 事故[じこ] な のに。
    meaning:
      en: Why? It's such a small accident.
      pt: Por quê? É um acidente tão pequeno.
  - speaker: shota
    text: 警察[けいさつ] が 来[こ]ない と、 事故[じこ] 証明[しょうめい] が 出[で]ない。 保険[ほけん] が 使[つか]えない ん だ。
    meaning:
      en: If the police don't come, there's no accident certificate. Then you can't use the insurance.
      pt: Sem a polícia, não sai a certidão de acidente. Aí não dá para usar o seguro.
  - speaker: omawari
    text: お怪我[けが] は ない です か。 状況[じょうきょう] を 教[おし]えて ください。
    meaning:
      en: Is anyone hurt? Please tell me what happened.
      pt: Alguém se feriu? Conte o que aconteceu, por favor.
  - speaker: protagonist
    text: 止[と]まって いたら、 後[うし]ろ から ぶつけられました。
    meaning:
      en: I was stopped and got hit from behind.
      pt: Eu estava parada e bateram atrás.
  - speaker: omawari
    text: わかりました。 過失[かしつ] の 割合[わりあい] は、 この 記録[きろく] に 基[もと]づいて 保険[ほけん] 会社[がいしゃ] が 決[き]めます。
    meaning:
      en: Understood. The insurance companies will decide the share of fault based on this record.
      pt: Entendido. A proporção da culpa será decidida pelas seguradoras com base neste registro.
  - speaker: shota
    text: 相手[あいて] と 連絡先[れんらくさき] を 交換[こうかん] して おこう。
    meaning:
      en: Let's exchange contact details with the other driver.
      pt: Vamos trocar contatos com o outro motorista.
