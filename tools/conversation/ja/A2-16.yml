  - jaa-sukoshi
- type: narrator
  text:
    en: '«遠慮[えんりょ]» is holding back so as not to impose. Many people decline an offer once out of politeness and accept when it comes a second time — a custom, not a rule: sometimes the no is real. So offer
      twice, and if you want something, accept the second offer. And no tips in Japan: service is in the price, and leaving money can confuse the staff.'
    pt: '«遠慮[えんりょ]» é se conter para não incomodar. Muita gente recusa uma oferta uma vez por educação e aceita quando ela vem de novo — um costume, não uma regra: às vezes o não é verdadeiro. Então ofereça
      duas vezes, e se quiser algo, aceite na segunda. E nada de gorjeta no Japão: o serviço está no preço, e deixar dinheiro pode confundir o atendente.'
- type: narrator
  for:
  - pt
  text:
    pt: 'No Brasil também não há cultura de gorjeta à parte: a conta traz a taxa de serviço, em geral 10 %, às vezes 12 a 15 %, e por lei ela é opcional (Lei 13.419/2017). No Japão nem isso — o preço do
      cardápio é o que se paga.'
