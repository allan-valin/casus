steps:
- type: narrator
  text:
    en: Dinner with Yui at a small restaurant. Time to pay — and she offers you her dessert. Listen to the conversation; you don't need to understand it yet.
    pt: Jantar com a Yui num restaurante pequeno. Hora de pagar — e ela oferece a sobremesa dela. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: yui
    text: この デザート、 半分[はんぶん] どう です か。
    meaning:
      en: Would you like half of this dessert?
      pt: Quer metade desta sobremesa?
  - speaker: protagonist
    text: いえ、 大丈夫[だいじょうぶ] です。
    meaning:
      en: No, I'm fine.
      pt: Não, estou bem.
  - speaker: yui
    text: 遠慮[えんりょ] しないで。 おいしい です よ。
    meaning:
      en: Don't hold back. It's good.
      pt: Não faça cerimônia. Está gostoso.
  - speaker: protagonist
    text: じゃあ、 少[すこ]し だけ。 …本当[ほんとう] だ、 おいしい！
    meaning:
      en: Well then, just a little. …You're right, it's delicious!
      pt: Então, só um pouquinho. …É mesmo, está uma delícia!
  - speaker: yui
    text: すみません、 お会計[かいけい] お願[ねが]いします。 割[わ]り勘[かん] に しましょう。
    meaning:
      en: Excuse me, the bill please. Let's split it.
      pt: Com licença, a conta, por favor. Vamos rachar.
  - speaker: protagonist
    text: 今日[きょう] は 僕[ぼく] が おごります。 チップ は いくら です か。
    meaning:
      en: It's my treat today. How much is the tip?
      pt: Hoje eu pago. Quanto é a gorjeta?
  - speaker: yui
    text: 日本[にほん] で は チップ は いりません よ。 払[はら]わなくて いい です。
    meaning:
      en: In Japan there's no tip. You don't need to pay it.
      pt: No Japão não tem gorjeta. Não precisa pagar.
  - speaker: protagonist
    text: そう です か。 でも 次[つぎ] は 由衣[ゆい] さん が 払[はら]わなければ なりません よ。
    meaning:
      en: I see. But next time you have to pay, Yui.
      pt: Entendi. Mas da próxima vez você é que tem que pagar, Yui.
