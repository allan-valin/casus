- type: narrator
  text:
    en: 'Japanese has three giving verbs. «あげる» — I or someone gives to someone else: «由衣[ゆい] に あげる». «くれる» — someone gives to me or my side: «健太[けんた] くん が くれた». «もらう» — I receive: «課長[かちょう] から もらった». The
      direction matters more than in Portuguese.'
    pt: 'O japonês tem três verbos de dar. «あげる» — eu ou alguém dá para outra pessoa: «由衣[ゆい] に あげる». «くれる» — alguém dá para mim ou para o meu lado: «健太[けんた] くん が くれた». «もらう» — eu recebo: «課長[かちょう] から もらった».
      A direção importa mais que em português.'
