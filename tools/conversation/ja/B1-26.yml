- type: narrator
  text:
    en: 'Gifts in Japan come in pairs: what you receive, you return — «お返[かえ]し», often worth about half. On Valentine''s Day women traditionally give chocolate; on White Day, 14 March, men return it. Many
      people now also give to friends or themselves.'
    pt: 'Presentes no Japão vêm em pares: o que se recebe, se retribui — «お返[かえ]し», muitas vezes de cerca de metade do valor. No Valentine''s Day as mulheres tradicionalmente dão chocolate; no White Day,
      14 de março, os homens retribuem. Hoje muita gente também dá para amigos ou para si mesma.'
- type: narrator
  for:
  - pt
  text:
    pt: 'No Brasil o Dia dos Namorados é em 12 de junho e os dois trocam presentes no mesmo dia. No Japão é dividido em dois: fevereiro elas dão, março eles devolvem.'
