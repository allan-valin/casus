steps:
- type: narrator
  text:
    en: Your birthday. Yui brings a small cake; Kenta gave you something at work. Then she reminds you about White Day. Listen to the conversation; you don't need to understand it yet.
    pt: Seu aniversário. A Yui traz um bolinho; o Kenta te deu algo no trabalho. Depois ela lembra você do White Day. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: yui
    text: 誕生日[たんじょうび] おめでとう！ ケーキ を 作[つく]った よ。
    meaning:
      en: Happy birthday! I made a cake.
      pt: Feliz aniversário! Fiz um bolo.
  - speaker: protagonist
    text: ありがとう！ すごく うれしい。
    meaning:
      en: Thank you! I'm so happy.
      pt: Obrigado! Fiquei muito feliz.
  - speaker: yui
    text: プレゼント、 もう 誰[だれ] か に もらった？
    meaning:
      en: Have you got presents from anyone yet?
      pt: Já ganhou presente de alguém?
  - speaker: protagonist
    text: 健太[けんた] くん が ネクタイ を くれた。 課長[かちょう] から は お菓子[かし] を もらった。
    meaning:
      en: Kenta gave me a tie. I got sweets from the chief.
      pt: O Kenta me deu uma gravata. Da chefe ganhei doces.
  - speaker: yui
    text: これ は 私[わたし] から。 開[あ]けて みて。
    meaning:
      en: This is from me. Open it.
      pt: Esta é minha. Abre.
  - speaker: protagonist
    text: 財布[さいふ] だ！ 前[まえ] の は 古[ふる]かった から、 助[たす]かる。
    meaning:
      en: A wallet! My old one was worn out, so this helps.
      pt: Uma carteira! A antiga estava velha, então ajuda muito.
  - speaker: yui
    text: バレンタイン に チョコ を あげた でしょ。 ホワイト デー の お返[かえ]し、 待[ま]って る よ。
    meaning:
      en: I gave you chocolate on Valentine's, remember. I'm waiting for the White Day return gift.
      pt: Eu te dei chocolate no Dia dos Namorados, lembra? Estou esperando a retribuição do White Day.
  - speaker: protagonist
    text: 三月[さんがつ] 十四日[じゅうよっか] だ ね。 由衣[ゆい] に 何[なに] を あげよう か な。
    meaning:
      en: The 14th of March, right. What shall I give you, I wonder.
      pt: 14 de março, né? O que será que eu dou para você.
