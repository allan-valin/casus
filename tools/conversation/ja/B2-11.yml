steps:
- type: narrator
  text:
    en: The department's drinking party is on Friday — the same night as Shota's birthday dinner. You ask Chief Sato whether you can skip it. Listen to the conversation; you don't need to understand it
      yet.
    pt: O nomikai do departamento é na sexta — na mesma noite do jantar de aniversário do Shota. Você pergunta à chefe Sato se pode faltar. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 課長[かちょう]、 金曜日[きんようび] の 飲[の]み会[かい] です が、 その 日[ひ] は 都合[つごう] が 悪[わる]くて…
    meaning:
      en: Chief, about Friday's party, that day isn't convenient for me…
      pt: Chefe, sobre o nomikai de sexta, nesse dia eu não posso…
  - speaker: sato
    text: そう です か。 欠席[けっせき] でも 大丈夫[だいじょうぶ] です よ。
    meaning:
      en: I see. It's fine not to come.
      pt: Entendo. Pode faltar, tudo bem.
  - speaker: protagonist
    text: 本当[ほんとう] に いい ん です か。 飲[の]み会[かい] も 仕事[しごと] だ と 聞[き]きました。
    meaning:
      en: Is it really okay? I heard parties are part of the job.
      pt: É mesmo? Ouvi dizer que o nomikai também faz parte do trabalho.
  - speaker: sato
    text: 付[つ]き合[あ]い は 大事[だいじ] です が、 強制[きょうせい] では ありません。 今[いま] は 来[こ]ない 人[ひと] も 多[おお]い です。
    meaning:
      en: Socialising matters, but it's not compulsory. Many people don't come nowadays.
      pt: A convivência é importante, mas não é obrigatória. Hoje muita gente não vai.
  - speaker: protagonist
    text: 行[い]きたく ない わけ では ない ん です。 彼[かれ] の 誕生日[たんじょうび] で。
    meaning:
      en: It's not that I don't want to go. It's my boyfriend's birthday.
      pt: Não é que eu não queira ir. É o aniversário do meu namorado.
  - speaker: sato
    text: それ は 大切[たいせつ] です ね。 幹事[かんじ] に は 私[わたし] から 言[い]って おきます。
    meaning:
      en: That's important. I'll let the organiser know.
      pt: Isso é importante. Eu aviso o organizador.
  - speaker: protagonist
    text: ありがとう ございます。 残念[ざんねん] です が、 次[つぎ] は ぜひ 参加[さんか] します。
    meaning:
      en: Thank you. Unfortunately not this time, but next time I'll definitely come.
      pt: Obrigada. Infelizmente não dá, mas da próxima vou com certeza.
  - speaker: sato
    text: 楽[たの]しんで ね。
    meaning:
      en: Enjoy.
      pt: Aproveite.
