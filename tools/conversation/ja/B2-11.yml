- type: narrator
  text:
    en: After-work parties used to feel compulsory; younger workers now skip them more freely, and many companies say so openly. Decline early, with «都合[つごう] が 悪[わる]くて» — no long excuse needed — and show
      willingness for next time.
    pt: Os nomikai já pareceram obrigatórios; os mais jovens hoje faltam com mais liberdade, e muitas empresas dizem isso abertamente. Recuse cedo, com «都合[つごう] が 悪[わる]くて» — sem desculpa comprida — e mostre
      vontade de ir na próxima.
