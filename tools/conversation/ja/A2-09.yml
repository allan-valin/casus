- type: narrator
  text:
    en: 'Consumption tax is 10 %, but 8 % on food you take away. Labels show both prices — the big number is often before tax, so read the small one to know what you pay. In the evening supermarkets put
      discount stickers on fresh food: 20 %, 30 %, then «半額[はんがく]».'
    pt: 'O imposto de consumo é 10 %, mas 8 % na comida para levar. As etiquetas mostram os dois preços — o número grande muitas vezes é sem imposto, então leia o pequeno para saber quanto vai pagar. No
      fim da tarde os supermercados colam adesivos de desconto na comida fresca: 20 %, 30 %, depois «半額[はんがく]».'
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil o preço da etiqueta já inclui tudo. No Japão, conte com até 10 % a mais no caixa quando só o preço grande for olhado.
