- type: narrator
  text:
    en: 'Japanese counts big numbers in groups of four zeros, not three: «千[せん]» is 1,000, but «万[まん]» is 10,000. So 10,000 yen is «一万円[いちまんえん]» — one «万[まん]» — and 100,000 is «十万[じゅうまん]», ten «万[まん]».'
    pt: 'O japonês conta números grandes de quatro em quatro zeros, não de três: «千[せん]» é 1.000, mas «万[まん]» é 10.000. Então 10 mil ienes é «一万円[いちまんえん]» — um «万[まん]» — e 100 mil é «十万[じゅうまん]», dez «万[まん]».'
