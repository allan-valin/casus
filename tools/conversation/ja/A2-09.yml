steps:
- type: narrator
  text:
    en: Saturday at the supermarket with Mrs Suzuki. Yellow stickers, two prices on every label. Listen to the conversation; you don't need to understand it yet.
    pt: Sábado no supermercado com a senhora Suzuki. Etiquetas amarelas, dois preços em cada etiqueta. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: 見[み]て ください。 この シール は 半額[はんがく] です よ。
    meaning:
      en: Look. This sticker means half price.
      pt: Olhe. Esta etiqueta é metade do preço.
  - speaker: protagonist
    text: 半額[はんがく]？ 安[やす]い！ どうして です か。
    meaning:
      en: Half price? Cheap! Why?
      pt: Metade do preço? Barato! Por quê?
  - speaker: suzuki
    text: 夕方[ゆうがた] に なる と、 お弁当[べんとう] は 割引[わりびき] に なります。
    meaning:
      en: In the evening the boxed lunches get discounted.
      pt: No fim da tarde as marmitas entram em desconto.
  - speaker: protagonist
    text: この 値段[ねだん] は 税抜[ぜいぬ]き です か、 税込[ぜいこ]み です か。
    meaning:
      en: Is this price before tax or with tax?
      pt: Este preço é sem imposto ou com imposto?
  - speaker: suzuki
    text: 大[おお]きい の は 税抜[ぜいぬ]き、 小[ちい]さい の が 税込[ぜいこ]み です。
    meaning:
      en: The big number is before tax, the small one with tax.
      pt: O número grande é sem imposto, o pequeno é com imposto.
  - speaker: protagonist
    text: 食[た]べ物[もの] は 八[はち] パーセント です ね。
    meaning:
      en: Food is eight percent, right?
      pt: Comida é oito por cento, né?
  - speaker: suzuki
    text: はい。 全部[ぜんぶ] で 千[せん] 九百[きゅうひゃく] 八十円[はちじゅうえん] です。
    meaning:
      en: Yes. Altogether 1,980 yen.
      pt: Isso. Ao todo, 1.980 ienes.
  - speaker: protagonist
    text: 一万円[いちまんえん] で お願[ねが]いします。
    meaning:
      en: Here's ten thousand yen.
      pt: Aqui, dez mil ienes.
