steps:
- type: narrator
  text:
    en: At night the building shakes for a few seconds. In the morning Mrs Suzuki explains earthquakes, and why her house is made of wood. Listen to the conversation; you don't need to understand it yet.
    pt: À noite o prédio treme por alguns segundos. De manhã a senhora Suzuki explica os terremotos, e por que a casa dela é de madeira. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: 昨日[きのう] の 夜[よる]、 地震[じしん] が ありました ね。 大丈夫[だいじょうぶ] でした か。
    meaning:
      en: There was an earthquake last night. Were you okay?
      pt: Ontem à noite teve terremoto. Você estava bem?
  - speaker: protagonist
    text: はい。 でも すごく 揺[ゆ]れました。 怖[こわ]かった です。
    meaning:
      en: Yes. But it shook a lot. It was scary.
      pt: Sim. Mas tremeu muito. Deu medo.
  - speaker: suzuki
    text: 日本[にほん] は 地震[じしん] が 多[おお]い です から。
    meaning:
      en: Japan has many earthquakes, you see.
      pt: É que no Japão tem muito terremoto.
  - speaker: protagonist
    text: 鈴木[すずき] さん の 家[いえ] は 木造[もくぞう] です か。
    meaning:
      en: Is your house made of wood?
      pt: A sua casa é de madeira?
  - speaker: suzuki
    text: はい。 木[き] は 揺[ゆ]れます から、 倒[たお]れません。
    meaning:
      en: Yes. Wood sways, so it doesn't fall.
      pt: É. A madeira balança, por isso não cai.
  - speaker: protagonist
    text: 地震[じしん] の 時[とき]、 何[なに] を します か。
    meaning:
      en: What do you do in an earthquake?
      pt: O que se faz num terremoto?
  - speaker: suzuki
    text: まず 机[つくえ] の 下[した] に 入[はい]ります。 外[そと] は 危[あぶ]ない です。
    meaning:
      en: First get under the table. Outside is dangerous.
      pt: Primeiro entre debaixo da mesa. Lá fora é perigoso.
  - speaker: suzuki
    text: 来週[らいしゅう]、 町[まち] の 訓練[くんれん] が あります よ。 一緒[いっしょ] に 行[い]きましょう。
    meaning:
      en: There's a town drill next week. Let's go together.
      pt: Semana que vem tem simulado do bairro. Vamos juntas.
