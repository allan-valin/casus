- type: narrator
  text:
    en: 'In a quake: under a table, hold its legs, wait. Don''t run outside while it shakes — roof tiles and glass fall. Schools and towns hold drills, «訓練[くんれん]», and phones sound an alarm seconds before
      strong shaking.'
    pt: 'No terremoto: debaixo da mesa, segure os pés dela, espere. Não saia correndo enquanto treme — caem telhas e vidro. Escolas e bairros fazem simulados, «訓練[くんれん]», e o celular toca um alarme segundos
      antes de um tremor forte.'
