  text:
    en: '«から» after a sentence gives the reason: «木[き] は 揺[ゆ]れます から、 倒[たお]れません» — wood sways, so it doesn''t fall. The reason comes first, then what follows — the opposite order of «porque».'
    pt: '«から» depois de uma frase dá o motivo: «木[き] は 揺[ゆ]れます から、 倒[たお]れません» — a madeira balança, por isso não cai. O motivo vem antes, depois a consequência — ao contrário do «porque».'
