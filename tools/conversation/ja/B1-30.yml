- type: narrator
  text:
    en: 'A night out moves: the «一次会[いちじかい]» at an izakaya, the «二次会[にじかい]» somewhere else — karaoke, a bar — and some go on, «はしご 酒[ざけ]», climbing the ladder from bar to bar. Izakaya charge a small «お通[とお]し»
      starter, and a bowl of ramen is the classic «締[し]め».'
    pt: 'A noite anda: o «一次会[いちじかい]» num izakaya, o «二次会[にじかい]» em outro lugar — karaokê, um bar — e alguns continuam, «はしご 酒[ざけ]», subindo a escada de bar em bar. Os izakaya cobram um petisco de entrada,
      «お通[とお]し», e uma tigela de lámen é o «締[し]め» clássico.'
- type: narrator
  text:
    en: 'That''s the end of B1. You talk with friends in plain Japanese, give opinions and reasons, report what you heard, guess, regret, decide and plan, give and receive, and read the air when a «検討[けんとう]
      します» means no. In B2: work — honorifics, meetings, and the harder conversations.'
    pt: 'Fim do B1. Você conversa com amigos em japonês informal, dá opinião e motivo, conta o que ouviu, supõe, se arrepende, decide e planeja, dá e recebe, e lê o clima quando um «検討[けんとう] します» quer dizer
      não. No B2: trabalho — linguagem honorífica, reuniões e as conversas mais difíceis.'
- type: narrator
  for:
  - pt
  text:
    pt: 'No Brasil o rolê também muda de bar, mas sem nome para cada etapa. No Japão a noite tem capítulos: primeiro, segundo, terceiro… e o lámen no fim.'
