steps:
- type: narrator
  text:
    en: Friday at an izakaya with Kenta, Yui and Lucas. Then a second place, and a third — a look back at all of B1. Listen to the conversation; you don't need to understand it yet.
    pt: Sexta num izakaya com o Kenta, a Yui e o Lucas. Depois um segundo lugar, e um terceiro — uma revisão de todo o B1. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: とりあえず ビール！ 乾杯[かんぱい]！
    meaning:
      en: A beer to start! Cheers!
      pt: Pra começar, cerveja! Saúde!
  - speaker: lucas
    text: この 小[ちい]さい 料理[りょうり] は 何[なに]？ 頼[たの]んで ない よ。
    meaning:
      en: What's this little dish? We didn't order it.
      pt: Que pratinho é esse? A gente não pediu.
  - speaker: yui
    text: お通[とお]し。 席[せき] の 料金[りょうきん] みたい な もの。
    meaning:
      en: It's otōshi. Like a table charge.
      pt: É o otōshi. Tipo uma taxa de mesa.
  - speaker: protagonist
    text: 焼[や]き鳥[とり] も 頼[たの]もう。 一次会[いちじかい] は ここ で。
    meaning:
      en: Let's order yakitori too. First round here.
      pt: Vamos pedir espetinho também. A primeira rodada é aqui.
  - speaker: kenta
    text: 二次会[にじかい] は カラオケ ね。 その 後[あと] は はしご 酒[ざけ] だ。
    meaning:
      en: Second round at karaoke. After that, bar-hopping.
      pt: A segunda rodada é no karaokê. Depois, de bar em bar.
  - speaker: yui
    text: 最後[さいご] は ラーメン で 締[し]めよう。
    meaning:
      en: Let's finish the night with ramen.
      pt: Vamos fechar a noite com lámen.
  - speaker: lucas
    text: もう 一軒[いっけん] 行[い]こう！
    meaning:
      en: One more place!
      pt: Mais um lugar!
  - speaker: protagonist
    text: もう 一時[いちじ] だ よ。 終電[しゅうでん] も ない。 そろそろ 帰[かえ]ろう か… タクシー で。
    meaning:
      en: It's already one. No last train either. Shall we head home… by taxi.
      pt: Já é uma hora. Nem tem mais trem. Vamos indo… de táxi.
