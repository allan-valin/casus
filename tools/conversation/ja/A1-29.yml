- type: narrator
  text:
    en: A Japanese apology is not an admission of guilt in court; it repairs the relationship. Apologise first, explain later — or not at all — and say what you'll do next time. A bow goes with it.
    pt: No Japão, pedir desculpas não é confessar culpa no tribunal; é consertar a relação. Primeiro peça desculpas, depois explique — ou nem explique — e diga o que vai fazer da próxima vez. Uma reverência
      acompanha.
- type: narrator
  for:
