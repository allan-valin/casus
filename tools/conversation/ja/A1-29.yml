steps:
- type: narrator
  text:
    en: 'You translated a delivery date wrong for a Brazilian worker: Thursday instead of Tuesday. Chief Sato calls you over. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Você traduziu errado uma data de entrega para um trabalhador brasileiro: quinta em vez de terça. A chefe Sato chama você. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: sato
    text: 木曜日[もくようび] じゃ なくて、 火曜日[かようび] です よ。
    meaning:
      en: Not Thursday — Tuesday.
      pt: Não é quinta — é terça.
  - speaker: protagonist
    text: あ… 間違[まちが]えました。 申[もう]し訳[わけ] ありません。
    meaning:
      en: Oh… I made a mistake. I'm terribly sorry.
      pt: Ah… eu errei. Peço mil desculpas.
  - speaker: sato
    text: 大丈夫[だいじょうぶ]。 もう 一度[いちど]、 説明[せつめい] して ください。
    meaning:
      en: It's alright. Please explain it to him once more.
      pt: Tudo bem. Explique para ele mais uma vez.
  - speaker: protagonist
    text: はい。 次[つぎ] から 確認[かくにん] します。
    meaning:
      en: Yes. From now on I'll double-check.
      pt: Sim. Da próxima vez vou conferir.
  - speaker: sato
    text: 間違[まちが]い は 誰[だれ] でも あります。
    meaning:
      en: Everyone makes mistakes.
      pt: Todo mundo erra.
  - speaker: protagonist
    text: 本当[ほんとう] に 申[もう]し訳[わけ] ありません でした。
    meaning:
      en: I'm truly sorry.
      pt: De verdade, me desculpe.
  - speaker: sato
    text: もう いい です よ。 気[き] に しないで ください。
    meaning:
      en: That's enough. Don't worry about it.
      pt: Já está bom. Não se preocupe.
  - speaker: kenta
    text: 大丈夫[だいじょうぶ]？ 課長[かちょう]、 優[やさ]しい でしょ。
    meaning:
      en: You okay? The chief is kind, isn't she?
      pt: Tudo bem? A chefe é gente boa, né?
  - speaker: protagonist
    text: うん。 ごめん、 ちょっと 疲[つか]れた。
    meaning:
      en: Yeah. Sorry, I'm a bit tired.
      pt: Aham. Foi mal, estou meio cansada.
- type: narrator
  text:
    en: 'Japanese has a ladder of apologies. «ごめん» — casual, to a friend. «ごめんなさい» — sorry, to family or friends. «すみません» — excuse me, sorry, to anyone. «申[もう]し訳[わけ] ありません» — at work, to the boss or a customer:
      literally, there is no excuse.'
    pt: 'O japonês tem uma escada de desculpas. «ごめん» — informal, para um amigo. «ごめんなさい» — desculpa, para família ou amigos. «すみません» — com licença, desculpe, para qualquer pessoa. «申[もう]し訳[わけ] ありません» —
      no trabalho, para o chefe ou um cliente: ao pé da letra, não há desculpa.'
