steps:
- type: narrator
  text:
    en: Mrs Suzuki in her vegetable garden at dawn. You ask why she gets up so early at seventy — she talks about 生きがい. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Suzuki na horta ao amanhecer. Você pergunta por que ela acorda tão cedo aos setenta — ela fala de 生きがい. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 鈴木[すずき] さん、 毎朝[まいあさ] 早[はや]い です ね。
    meaning:
      en: Mrs Suzuki, you're up early every morning.
      pt: Senhora Suzuki, a senhora acorda cedo toda manhã.
  - speaker: suzuki
    text: 畑[はたけ] で 野菜[やさい] を 育[そだ]てる の が 私[わたし] の 生[い]きがい です よ。
    meaning:
      en: Growing vegetables in the garden is my reason for living.
      pt: Cultivar verduras na horta é a minha razão de viver.
  - speaker: protagonist
    text: 生[い]きがい？
    meaning:
      en: Reason for living?
      pt: Razão de viver?
  - speaker: suzuki
    text: 朝[あさ] 起[お]きる 理由[りゆう] です。 小[ちい]さな こと でも、 あれば 幸[しあわ]せ です。
    meaning:
      en: The reason to get up in the morning. Even a small thing — if you have one, you're happy.
      pt: O motivo para levantar de manhã. Mesmo uma coisa pequena — se você tiver, é feliz.
  - speaker: protagonist
    text: 僕[ぼく] は 仕事[しごと] の ストレス が 多[おお]い です。
    meaning:
      en: I have a lot of stress from work.
      pt: Eu tenho muito estresse no trabalho.
  - speaker: suzuki
    text: 休[やす]めば いい ん です よ。 働[はたら]けば 働[はたら]く ほど 幸[しあわ]せ、 では ありません。
    meaning:
      en: Then rest. The more you work isn't the happier you are.
      pt: 'É só descansar. Não é: quanto mais trabalha, mais feliz.'
  - speaker: protagonist
    text: 心[こころ] の ゆとり が 大事[だいじ] です ね。
    meaning:
      en: Room to breathe matters, then.
      pt: A tranquilidade é importante, então.
  - speaker: suzuki
    text: ええ。 トマト を 持[も]って 帰[かえ]れば？ 毎日[まいにち] が 楽[たの]しく なります よ。
    meaning:
      en: Yes. Why not take some tomatoes home? Every day gets nicer.
      pt: Isso. Leve uns tomates para casa! Todo dia fica mais gostoso.
