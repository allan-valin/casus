- type: narrator
  text:
    en: '«生[い]きがい» is the reason you get up in the morning — not necessarily big: a garden, grandchildren, a hobby, your work. It''s often linked to Okinawa''s long-lived elders. «ゆとり», breathing room,
      is what many busy Japanese say they lack.'
    pt: '«生[い]きがい» é o motivo para levantar de manhã — não precisa ser grande: uma horta, os netos, um hobby, o trabalho. É muito associado aos idosos longevos de Okinawa. «ゆとり», folga, é o que muitos japoneses
      atarefados dizem que lhes falta.'
