steps:
- type: narrator
  text:
    en: Mrs Suzuki, now eighty, has decided to move in with her daughter in Tokyo. She asks you to help sort the house — and tells you what will happen to it. Listen to the conversation; you don't need
      to understand it yet.
    pt: A senhora Suzuki, agora com oitenta anos, decidiu morar com a filha em Tóquio. Ela pede que você ajude a arrumar a casa — e conta o que vai acontecer com ela. Escute a conversa; ainda não precisa
      entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: 娘[むすめ] の 所[ところ] へ 行[い]く こと に した ん です よ。 この 家[いえ] の 片付[かたづ]け、 手伝[てつだ]って くれる？
    meaning:
      en: I've decided to go to my daughter's. Will you help me sort out this house?
      pt: Decidi ir para a casa da minha filha. Você me ajuda a arrumar esta casa?
  - speaker: protagonist
    text: もちろん です。 でも… 寂[さび]しく なります。
    meaning:
      en: Of course. But… I'll miss you.
      pt: Claro. Mas… vou sentir falta.
  - speaker: suzuki
    text: これ も 終活[しゅうかつ] です。 遺言[ゆいごん] 書[しょ] も 書[か]きました。 子供[こども] たち が 相続[そうぞく] で もめない よう に ね。
    meaning:
      en: This is part of preparing for the end too. I've written a will, so the children don't quarrel over the inheritance.
      pt: Isso também é preparar o fim da vida. Já escrevi o testamento, para os filhos não brigarem pela herança.
  - speaker: protagonist
    text: この 家[いえ] は 空[あ]き家[や] に なる ん です か。
    meaning:
      en: Will the house be left empty?
      pt: A casa vai ficar vazia?
  - speaker: suzuki
    text: 空[あ]き家[や] は 町[まち] の 問題[もんだい] に なる から… あなた たち が 住[す]み続[つづ]けて くれたら、 嬉[うれ]しい わ。
    meaning:
      en: Empty houses become a problem for the town… I'd be happy if you two lived on here.
      pt: Casa vazia vira problema para a cidade… Eu ficaria feliz se vocês continuassem morando aqui.
  - speaker: protagonist
    text: 私[わたし]たち が？ 家族[かぞく] と 相談[そうだん] します。
    meaning:
      en: Us? I'll talk it over with the family.
      pt: Nós? Vou conversar com a família.
  - speaker: suzuki
    text: 思[おも]い出[で] の 品[しな] は ほとんど 手放[てばな]す けど、 この 畑[はたけ] は 誰[だれ] か に 受[う]け継[つ]いで ほしい の。
    meaning:
      en: I'm letting go of most of the keepsakes, but I'd like someone to take on this vegetable garden.
      pt: Vou me desfazer da maioria das recordações, mas queria que alguém herdasse esta horta.
  - speaker: protagonist
    text: 畑[はたけ] は、 私[わたし] が 守[まも]ります。 トマト の 育[そだ]て方[かた]、 全部[ぜんぶ] 教[おし]えて ください。
    meaning:
      en: I'll look after the garden. Teach me everything about growing tomatoes.
      pt: A horta, eu cuido. Me ensine tudo sobre plantar tomate.
