- type: narrator
  text:
    en: '«終活[しゅうかつ]» — preparing for the end of life — is openly discussed in Japan: writing a will, sorting belongings, deciding where to live. Japan has millions of «空[あ]き家[や]», empty houses, as owners
      age and children live in cities; towns encourage new residents to take them over.'
    pt: 'O «終活[しゅうかつ]» — preparar o fim da vida — é discutido abertamente no Japão: escrever testamento, organizar os pertences, decidir onde morar. O Japão tem milhões de «空[あ]き家[や]», casas vazias, porque
      os donos envelhecem e os filhos moram nas cidades; as prefeituras incentivam novos moradores a assumi-las.'
