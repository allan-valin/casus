steps:
- type: narrator
  text:
    en: The great-uncle takes you to the Hiroshima Peace Memorial Museum. He speaks quietly about what his parents told him of August 1945. Listen to the conversation; you don't need to understand it yet.
    pt: O tio-avô leva você ao Museu Memorial da Paz de Hiroshima. Ele fala baixo sobre o que os pais dele contaram de agosto de 1945. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ojisan
    text: わし の 両親[りょうしん] は、 あの 朝[あさ] 広島[ひろしま] の 町[まち] に おった。
    meaning:
      en: My parents were in the city of Hiroshima that morning.
      pt: Os meus pais estavam na cidade de Hiroshima naquela manhã.
  - speaker: protagonist
    text: ……言葉[ことば] が 出[で]ません。
    meaning:
      en: …I'm lost for words.
      pt: …Fico sem palavras.
  - speaker: ojisan
    text: 二人[ふたり] とも 被爆者[ひばくしゃ] じゃ。 でも 生[い]きて、 わし と 姉[あね] を 育[そだ]てて くれた。
    meaning:
      en: They were both survivors. But they lived, and raised my sister and me.
      pt: Os dois foram sobreviventes. Mas viveram, e criaram a mim e a minha irmã.
  - speaker: protagonist
    text: 祖母[そぼ] が ブラジル に 渡[わた]った の も、 その 後[あと] の こと です ね。
    meaning:
      en: So my grandmother went to Brazil after that.
      pt: Então a minha avó foi para o Brasil depois disso.
  - speaker: ojisan
    text: そう じゃ。 戦争[せんそう] の 後[あと]、 新[あたら]しい 生活[せいかつ] を 探[さが]して な。
    meaning:
      en: That's right. After the war, looking for a new life.
      pt: Isso mesmo. Depois da guerra, procurando uma vida nova.
  - speaker: protagonist
    text: 歴史[れきし] は 本[ほん] で 読[よ]んで いました が、 家族[かぞく] の 記憶[きおく] と して 聞[き]く と、 重[おも]さ が 違[ちが]います。
    meaning:
      en: I'd read the history in books, but hearing it as family memory, the weight is different.
      pt: Eu tinha lido a história nos livros, mas ouvindo como memória da família, o peso é outro.
  - speaker: ojisan
    text: わし ら の 世代[せだい] が いなく なる 前[まえ] に、 語[かた]り継[つ]いで ほしい。
    meaning:
      en: Before our generation is gone, I want you to pass it on.
      pt: Antes que a nossa geração se vá, quero que vocês passem isso adiante.
  - speaker: protagonist
    text: はい。 平和[へいわ] を 祈[いの]って、 子供[こども] たち に も 伝[つた]えます。
    meaning:
      en: Yes. Praying for peace, I'll tell the children too.
      pt: Sim. Rezando pela paz, vou contar para as crianças também.
