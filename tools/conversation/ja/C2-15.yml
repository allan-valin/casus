- type: narrator
  text:
    en: 'Talking about painful history in Japanese calls for care: short sentences, silence where needed, listening more than asking. «言葉[ことば] が 出[で]ません» is an honest response. Survivors'' testimonies are
      being recorded and passed on, «語[かた]り継[つ]ぐ», as their generation grows old.'
    pt: 'Falar de uma história dolorosa em japonês pede cuidado: frases curtas, silêncio quando preciso, mais ouvir do que perguntar. «言葉[ことば] が 出[で]ません» é uma resposta honesta. Os depoimentos dos sobreviventes
      estão sendo gravados e transmitidos, «語[かた]り継[つ]ぐ», enquanto a geração deles envelhece.'
- type: narrator
  for:
  - pt
  text:
    pt: Muitos nikkeis no Brasil têm raízes em Hiroshima. Às vezes a história mundial está guardada numa conversa baixinha com um parente de oitenta anos.
