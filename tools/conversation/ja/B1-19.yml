- type: narrator
  text:
    en: Typhoon season runs from about July to October, peaking in August and September. Railways announce suspensions, «計画[けいかく] 運休[うんきゅう]», a day ahead; schools close and shops board up. Stock water and
      food, charge your phone, stay in.
    pt: A temporada de tufões vai mais ou menos de julho a outubro, com pico em agosto e setembro. As ferrovias anunciam suspensões, «計画[けいかく] 運休[うんきゅう]», com um dia de antecedência; escolas fecham e lojas
      se protegem. Tenha água e comida, carregue o celular, fique em casa.
- type: narrator
  for:
  - pt
  text:
    pt: O Brasil quase não tem tufão, mas tem temporal de verão. No Japão o tufão tem nome, número e previsão de rota — e o país se organiza com antecedência.
