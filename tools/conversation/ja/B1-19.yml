steps:
- type: narrator
  text:
    en: September. You and Yui planned a weekend in Kyoto. A typhoon is coming, and the trains may stop. Listen to the conversation; you don't need to understand it yet.
    pt: Setembro. Você e a Yui planejaram um fim de semana em Kyoto. Um tufão está chegando, e os trens podem parar. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: yui
    text: ニュース 見[み]た？ 台風[たいふう] が 来[く]る みたい。
    meaning:
      en: Did you see the news? Looks like a typhoon is coming.
      pt: Viu o noticiário? Parece que vem um tufão.
  - speaker: protagonist
    text: え、 週末[しゅうまつ] は 京都[きょうと] に 行[い]こう と 思[おも]って いた のに。
    meaning:
      en: What, and I was planning to go to Kyoto at the weekend.
      pt: Ah, e eu que ia para Kyoto no fim de semana.
  - speaker: yui
    text: 新幹線[しんかんせん] が 運休[うんきゅう] に なる かも しれない。
    meaning:
      en: The shinkansen might be suspended.
      pt: O trem-bala pode ser suspenso.
  - speaker: protagonist
    text: 残念[ざんねん]… 旅行[りょこう] は 中止[ちゅうし]？
    meaning:
      en: What a pity… Is the trip off?
      pt: Que pena… A viagem está cancelada?
  - speaker: yui
    text: 中止[ちゅうし] じゃ なくて、 延期[えんき] に しよう。 安全[あんぜん] 第一[だいいち]。
    meaning:
      en: Not cancelled — let's postpone it. Safety first.
      pt: Cancelada não — vamos adiar. Segurança em primeiro lugar.
  - speaker: protagonist
    text: そう だ ね。 ホテル を キャンセル する。
    meaning:
      en: Right. I'll cancel the hotel.
      pt: Verdade. Vou cancelar o hotel.
  - speaker: yui
    text: 週末[しゅうまつ] は 家[いえ] で 映画[えいが] を 見[み]よう。 水[みず] と 食[た]べ物[もの] も 買[か]って おこう。
    meaning:
      en: Let's watch films at home this weekend. And buy water and food in advance.
      pt: No fim de semana vamos ver filme em casa. E comprar água e comida antes.
  - speaker: protagonist
    text: 新[あたら]しい 予定[よてい] も 悪[わる]く ない ね。
    meaning:
      en: The new plan isn't bad either.
      pt: O plano novo também não é ruim.
