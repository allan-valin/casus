steps:
- type: narrator
  text:
    en: Lunch break. Kenta asks whether Brazil is carnival all year. You ask whether Japan is like anime. Listen to the conversation; you don't need to understand it yet.
    pt: Intervalo do almoço. O Kenta pergunta se o Brasil é carnaval o ano todo. Você pergunta se o Japão é como nos animes. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: ブラジル は 毎日[まいにち] カーニバル です か。
    meaning:
      en: Is Brazil carnival every day?
      pt: No Brasil é carnaval todo dia?
  - speaker: protagonist
    text: 違[ちが]います よ！ 一年[いちねん] に 一回[いっかい] です。
    meaning:
      en: No! Once a year.
      pt: Não! Uma vez por ano.
  - speaker: kenta
    text: でも、 ブラジル人[じん] は みんな サッカー が 上手[じょうず] です よ ね。
    meaning:
      en: But all Brazilians are good at football, right?
      pt: Mas todo brasileiro é bom de futebol, né?
  - speaker: protagonist
    text: 私[わたし] は 下手[へた] です。 日本[にほん] は アニメ みたい です か。
    meaning:
      en: I'm bad at it. Is Japan like anime?
      pt: Eu sou ruim. O Japão é como nos animes?
  - speaker: kenta
    text: うーん、 違[ちが]います。 忍者[にんじゃ] も いません。
    meaning:
      en: Hmm, no. There are no ninjas either.
      pt: Hmm, não. Ninja também não tem.
  - speaker: protagonist
    text: 本当[ほんとう] です か。 残念[ざんねん]！
    meaning:
      en: Really? What a pity!
      pt: Sério? Que pena!
  - speaker: kenta
    text: でも 日本人[にほんじん] は みんな アニメ が 好[す]き です。
    meaning:
      en: But all Japanese people like anime.
      pt: Mas todo japonês gosta de anime.
  - speaker: protagonist
    text: 健太[けんた] さん、 それ も 違[ちが]います よ ね？
    meaning:
      en: Kenta, that's not right either, is it?
      pt: Kenta, isso também não é bem assim, né?
- type: narrator
  text:
    en: «違[ちが]います» — literally 'it differs' — is the polite way to say that's not right. Softer than «いいえ».
    pt: «違[ちが]います» — literalmente 'é diferente' — é o jeito educado de dizer que não é assim. Mais suave que «いいえ».
