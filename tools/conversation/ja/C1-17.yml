    pt: '«〜に 関[かん]して» é a respeito de — um «sobre» formal: «育休[いくきゅう] に 関[かん]して 質問[しつもん] が あります», tenho uma pergunta a respeito da licença. Antes de substantivo: «育休[いくきゅう] に 関[かん]する 法律[ほうりつ]», a lei sobre
