- type: narrator
  text:
    en: Japan's childcare-leave law is generous on paper — both parents can take up to a year or more, partly paid — but for years few fathers used it. New rules since 2022 require companies to tell employees
      about it and let fathers take leave in the weeks after birth, and the share of fathers taking it has risen sharply, though leaves are often short.
    pt: A lei japonesa de licença para cuidar dos filhos é generosa no papel — pai e mãe podem tirar até um ano ou mais, com parte paga —, mas por anos poucos pais usavam. Regras novas desde 2022 obrigam
      as empresas a informar os funcionários e permitem que o pai tire licença nas semanas após o nascimento, e a parcela de pais que tiram subiu muito, embora as licenças muitas vezes sejam curtas.
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil a licença-paternidade é de cinco dias (vinte em empresas do programa Empresa Cidadã). No Japão o direito é bem maior — o desafio é a cultura deixar usar.
