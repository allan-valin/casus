- type: narrator
  text:
    en: '«七夕[たなばた]» on 7 July: an old legend says two stars, the weaver and the cowherd, are lovers kept apart by the Milky Way and may meet only that night. People write wishes on paper strips, «短冊[たんざく]»,
      and hang them on bamboo, «笹[ささ]».'
    pt: '«七夕[たなばた]» em 7 de julho: uma lenda antiga diz que duas estrelas, a tecelã e o pastor, são namorados separados pela Via Láctea e só podem se encontrar nessa noite. As pessoas escrevem desejos em
      tiras de papel, «短冊[たんざく]», e penduram no bambu, «笹[ささ]».'
