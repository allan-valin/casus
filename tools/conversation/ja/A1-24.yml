steps:
- type: narrator
  text:
    en: The evening of 7 July. Mrs Suzuki has a bamboo branch at her door and hands you a strip of coloured paper to write a wish on. Listen to the conversation; you don't need to understand it yet.
    pt: Noite de 7 de julho. A senhora Suzuki tem um galho de bambu na porta e entrega a você uma tira de papel colorido para escrever um desejo. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: 今日[きょう] は 七夕[たなばた] です よ。 願[ねが]い を 書[か]きましょう。
    meaning:
      en: Today is Tanabata. Let's write wishes.
      pt: Hoje é Tanabata. Vamos escrever desejos.
  - speaker: protagonist
    text: 七夕[たなばた]？ 何[なん] です か。
    meaning:
      en: Tanabata? What's that?
      pt: Tanabata? O que é?
  - speaker: suzuki
    text: 空[そら] の 二[ふた]つ の 星[ほし] が 一年[いちねん] に 一回[いっかい] 会[あ]います。
    meaning:
      en: Two stars in the sky meet once a year.
      pt: Duas estrelas no céu se encontram uma vez por ano.
  - speaker: protagonist
    text: ロマンチック です ね。 この 紙[かみ] に 書[か]きます か。
    meaning:
      en: How romantic. Do I write on this paper?
      pt: Que romântico. Escrevo neste papel?
  - speaker: suzuki
    text: はい、 短冊[たんざく] です。 それから 笹[ささ] に つけます。
    meaning:
      en: Yes, it's a tanzaku. Then you tie it to the bamboo.
      pt: Sim, é um tanzaku. Depois você amarra no bambu.
  - speaker: protagonist
    text: じゃあ…「日本語[にほんご] が 上手[じょうず] に なりたい です」。
    meaning:
      en: Then… “I want to get good at Japanese.”
      pt: Então… «Quero ficar bom em japonês».
  - speaker: suzuki
    text: いい 願[ねが]い です ね。 私[わたし] は「元気[げんき] で いたい」。
    meaning:
      en: That's a good wish. Mine is “I want to stay healthy”.
      pt: Bom desejo. O meu é «quero continuar com saúde».
  - speaker: protagonist
    text: あ、 月[つき] も 星[ほし] も 見[み]えます。 きれい です ね。
    meaning:
      en: Oh, you can see the moon and the stars. Beautiful.
      pt: Olha, dá para ver a lua e as estrelas. Que lindo.
