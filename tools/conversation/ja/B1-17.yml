steps:
- type: narrator
  text:
    en: You're meeting Yui at Shizuoka station. You're at the north exit; she's not there. Your phone rings. Listen to the conversation; you don't need to understand it yet.
    pt: Você vai encontrar a Yui na estação de Shizuoka. Você está na saída norte; ela não está lá. O celular toca. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: yui
    text: もしもし、 今[いま]、 どこ？
    meaning:
      en: Hello, where are you now?
      pt: Alô, onde você está agora?
  - speaker: protagonist
    text: 北口[きたぐち] の 改札[かいさつ] の 前[まえ]。 由衣[ゆい] は？
    meaning:
      en: In front of the north exit ticket gate. And you?
      pt: Na frente da catraca da saída norte. E você?
  - speaker: yui
    text: 私[わたし] は 南口[みなみぐち]。 南口[みなみぐち] で 待[ま]ち合[あ]わせ と 言[い]った よ。
    meaning:
      en: I'm at the south exit. I said we'd meet at the south exit.
      pt: Eu estou na saída sul. Eu disse que era na saída sul.
  - speaker: protagonist
    text: え、 北口[きたぐち] と 聞[き]いた と 思[おも]った。 ごめん、 迷[まよ]った。
    meaning:
      en: What, I thought I heard north. Sorry, I got lost.
      pt: Ué, achei que tinha ouvido norte. Desculpa, me perdi.
  - speaker: yui
    text: 大丈夫[だいじょうぶ]。 駅[えき] の 中[なか] を 通[とお]って、 南[みなみ] へ 向[む]かって。
    meaning:
      en: It's fine. Go through the station and head south.
      pt: Tudo bem. Atravessa a estação e vem para o sul.
  - speaker: protagonist
    text: 目印[めじるし] は？
    meaning:
      en: Any landmark?
      pt: Algum ponto de referência?
  - speaker: yui
    text: 大[おお]きい 時計[とけい] の 下[した]。 白[しろ]い コート を 着[き]て いる。
    meaning:
      en: Under the big clock. I'm wearing a white coat.
      pt: Embaixo do relógio grande. Estou de casaco branco.
  - speaker: protagonist
    text: 見[み]えた！ 今[いま] 行[い]く。
    meaning:
      en: I see you! Coming now.
      pt: Te vi! Já vou.
