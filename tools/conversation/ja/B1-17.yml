- type: narrator
  text:
    en: 'Big Japanese stations have several exits, each named — 北口, 南口, 東口, 西口, or after a landmark — and they can be far apart. Always arrange a meeting by exit and a landmark: a clock, a statue, a shop.'
    pt: 'As estações grandes do Japão têm várias saídas, cada uma com nome — 北口, 南口, 東口, 西口, ou o de um marco — e elas podem ficar longe uma da outra. Marque sempre o encontro pela saída e por um ponto
      de referência: um relógio, uma estátua, uma loja.'
