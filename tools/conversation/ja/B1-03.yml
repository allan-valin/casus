- type: narrator
  text:
    en: 'Science words in Japanese are built from kanji meanings: «細胞[さいぼう]» is thin + sac, «顕微鏡[けんびきょう]» is show-tiny-mirror. Learn the kanji and you can guess many technical words.'
    pt: 'As palavras de ciência em japonês são montadas pelos sentidos dos kanji: «細胞[さいぼう]» é fino + bolsa, «顕微鏡[けんびきょう]» é mostrar-minúsculo-espelho. Aprendendo os kanji, dá para adivinhar muitos termos
      técnicos.'
- type: narrator
  for:
  - pt
  text:
    pt: 'No português a ciência vem do grego e do latim — «microscópio», «núcleo». No japonês vem dos kanji: o mesmo truque de montar palavras, com peças diferentes.'
