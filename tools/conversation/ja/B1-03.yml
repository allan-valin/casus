- type: narrator
  text:
    en: 'The passive: «る» verbs take «られる» — «作[つく]る» → «作[つく]られる», is made; other verbs change their last sound to «あ» and add «れる»; «する» becomes «される» — «発見[はっけん] される», is discovered. The doer takes «に»:
      «フック に 発見[はっけん] された», discovered by Hooke.'
    pt: 'A passiva: verbos em «る» levam «られる» — «作[つく]る» → «作[つく]られる», é feito; os outros mudam o último som para «あ» e acrescentam «れる»; «する» vira «される» — «発見[はっけん] される», é descoberto. Quem faz leva «に»:
      «フック に 発見[はっけん] された», descoberta por Hooke.'
