steps:
- type: narrator
  text:
    en: Aya, Kenta's sister, studies biology. She shows you cells under her microscope and explains, with plenty of passives. Listen to the conversation; you don't need to understand it yet.
    pt: A Aya, irmã do Kenta, estuda biologia. Ela mostra células no microscópio dela e explica, com muita voz passiva. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: aya
    text: これ、 玉[たま]ねぎ の 細胞[さいぼう]。 見[み]える？
    meaning:
      en: This is an onion cell. Can you see it?
      pt: Isto é uma célula de cebola. Dá para ver?
  - speaker: protagonist
    text: 見[み]える！ 真[ま]ん中[なか] の 丸[まる]い の は 何[なに]？
    meaning:
      en: I can! What's the round thing in the middle?
      pt: Dá! O que é a coisa redonda no meio?
  - speaker: aya
    text: 核[かく] だ よ。 細胞[さいぼう] は 核[かく] の 情報[じょうほう] で 作[つく]られる。
    meaning:
      en: That's the nucleus. The cell is made from the information in it.
      pt: É o núcleo. A célula é feita a partir da informação dele.
  - speaker: protagonist
    text: 細胞[さいぼう] は どう やって 増[ふ]える の？
    meaning:
      en: How do cells multiply?
      pt: Como as células se multiplicam?
  - speaker: aya
    text: 二[ふた]つ に 分[わ]かれる の。 体[からだ] の 細胞[さいぼう] は すごい 数[かず] だ よ。
    meaning:
      en: They split in two. The cells in your body are an enormous number.
      pt: Elas se dividem em duas. As células do corpo são um número enorme.
  - speaker: protagonist
    text: 細胞[さいぼう] は 誰[だれ] に 発見[はっけん] された の？
    meaning:
      en: Who discovered cells?
      pt: Quem descobriu a célula?
  - speaker: aya
    text: フック と いう イギリス 人[じん] に 発見[はっけん] された。 千六百[せんろっぴゃく] 年代[ねんだい]。
    meaning:
      en: They were discovered by an Englishman called Hooke. In the 1600s.
      pt: Foi descoberta por um inglês chamado Hooke. Nos anos 1600.
  - speaker: protagonist
    text: 生物[せいぶつ] って 面白[おもしろ]い ね。
    meaning:
      en: Biology is interesting.
      pt: Biologia é interessante.
