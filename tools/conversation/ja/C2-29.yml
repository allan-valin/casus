steps:
- type: narrator
  text:
    en: A farewell dinner for Mrs Suzuki before she leaves for Tokyo. Kenta, Misaki, Maria, Lucas, Shota — and you, giving the last toast. Listen to the conversation; you don't need to understand it yet.
    pt: Um jantar de despedida para a senhora Suzuki antes de ela ir para Tóquio. O Kenta, a Misaki, a Maria, o Lucas, o Shota — e você, fazendo o último brinde. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 鈴木[すずき] さん、 五年[ごねん] 前[まえ]、 ゴミ の 出[だ]し方[かた] から 教[おし]えて くださいました ね。
    meaning:
      en: Mrs Suzuki, five years ago you taught me everything, starting with how to put out the rubbish.
      pt: Senhora Suzuki, cinco anos atrás a senhora me ensinou tudo, a começar por como separar o lixo.
  - speaker: suzuki
    text: あの 頃[ころ] は「すみません」 しか 言[い]えなかった だら。
    meaning:
      en: Back then all you could say was “sumimasen”, wasn't it.
      pt: Naquela época você só sabia dizer «sumimasen», né?
  - speaker: protagonist
    text: 教[おし]えて もらった こと は、 一生[いっしょう] 忘[わす]れません。 本当[ほんとう] に お世話[せわ] に なりました。
    meaning:
      en: I'll never forget what you taught me. Thank you for everything, truly.
      pt: Nunca vou esquecer o que a senhora me ensinou. Muito obrigada por tudo, de verdade.
  - speaker: kenta
    text: 鈴木[すずき] さん が いない と、 寂[さび]しく なります。
    meaning:
      en: It'll be lonely without you, Mrs Suzuki.
      pt: Vai ficar vazio sem a senhora.
  - speaker: suzuki
    text: 東京[とうきょう] は 近[ちか]い よ。 新幹線[しんかんせん] で 一時間[いちじかん] 半[はん]。 また お会[あ]い しましょう。
    meaning:
      en: Tokyo isn't far. An hour and a half by shinkansen. Let's meet again.
      pt: Tóquio é perto. Uma hora e meia de trem-bala. Vamos nos ver de novo.
  - speaker: protagonist
    text: 畑[はたけ] の トマト、 毎年[まいとし] 送[おく]ります。 いつ でも 帰[かえ]って きて ください。
    meaning:
      en: I'll send tomatoes from the garden every year. Come back any time.
      pt: Vou mandar tomate da horta todo ano. Volte quando quiser.
  - speaker: suzuki
    text: ありがとう。 みんな、 いつ まで も お元気[げんき] で ね。
    meaning:
      en: Thank you. Everyone, stay well, always.
      pt: Obrigada. Todos vocês, fiquem bem, sempre.
  - speaker: protagonist
    text: それでは、 鈴木[すずき] さん に 乾杯[かんぱい]！
    meaning:
      en: Then — to Mrs Suzuki!
      pt: Então — à senhora Suzuki!
