- type: narrator
  text:
    en: 'Farewells have their set phrases: «本当[ほんとう] に お世話[せわ] に なりました» for all that was done for you, «寂[さび]しく なります» — it will be lonely — to show affection without drama, «お元気[げんき] で» to send someone
      off, «また お会[あ]い しましょう» to keep the door open.'
    pt: 'As despedidas têm frases prontas: «本当[ほんとう] に お世話[せわ] に なりました» por tudo o que fizeram por você, «寂[さび]しく なります» — vai ficar vazio — para mostrar carinho sem drama, «お元気[げんき] で» para mandar alguém
      embora com bons votos, «また お会[あ]い しましょう» para deixar a porta aberta.'
