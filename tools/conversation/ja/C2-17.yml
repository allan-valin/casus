- type: narrator
  text:
    en: 'Repairing a social mistake: name it («失礼[しつれい] な こと を 言[い]いました»), apologise, admit the effect («傷[きず]つけて しまいました») before explaining, flag the explanation as possibly an excuse («言[い]い訳[わけ] に なります
      が»), then promise. Explaining first sounds like defending yourself.'
    pt: 'Para reparar um erro social: nomeie («失礼[しつれい] な こと を 言[い]いました»), peça desculpas, admita o efeito («傷[きず]つけて しまいました») antes de explicar, avise que a explicação pode soar como desculpa («言[い]い訳[わけ]
      に なります が») e então prometa. Explicar primeiro soa como se defender.'
