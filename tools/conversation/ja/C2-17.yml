steps:
- type: narrator
  text:
    en: At lunch you joked that Chief Sato “looked tired and old” today — teasing the Brazilian way. She went quiet. You go to repair it. Listen to the conversation; you don't need to understand it yet.
    pt: No almoço você brincou que a chefe Sato estava «com cara de cansada e velha» hoje — provocação à brasileira. Ela ficou quieta. Você vai consertar. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 課長[かちょう]、 お昼[ひる] は 失礼[しつれい] な こと を 言[い]いました。 申[もう]し訳[わけ] ありません。
    meaning:
      en: Chief, I said something rude at lunch. I'm very sorry.
      pt: Chefe, eu disse uma coisa indelicada no almoço. Peço desculpas.
  - speaker: sato
    text: …ああ、「疲[つか]れて 老[ふ]けて 見[み]える」 です か。
    meaning:
      en: …Ah, “you look tired and old”?
      pt: …Ah, o «está com cara de cansada e velha»?
  - speaker: protagonist
    text: 冗談[じょうだん] の つもり で した。 そんな つもり じゃ なかった ん です が、 傷[きず]つけて しまいました。
    meaning:
      en: I meant it as a joke. I didn't mean it that way, but I hurt you.
      pt: Era para ser brincadeira. Não foi essa a intenção, mas acabei magoando a senhora.
  - speaker: protagonist
    text: 言[い]い訳[わけ] に なります が、 ブラジル で は 親[した]しい 人[ひと] を からかう の は 愛情[あいじょう] な ん です。
    meaning:
      en: It may sound like an excuse, but in Brazil teasing people you're close to is a sign of affection.
      pt: Pode parecer desculpa, mas no Brasil provocar quem é próximo é sinal de carinho.
  - speaker: sato
    text: なるほど、 文化[ぶんか] の 違[ちが]い です ね。 日本[にほん] で は 見[み]た目[め] の 冗談[じょうだん] は、 特[とく] に 女性[じょせい] に は 敏感[びんかん] な ん です。
    meaning:
      en: I see, a cultural difference. In Japan jokes about appearance are sensitive, especially for women.
      pt: Entendo, diferença cultural. No Japão piada sobre aparência é delicada, principalmente com mulheres.
  - speaker: protagonist
    text: 教[おし]えて くださって、 ありがとう ございます。 二度[にど] と 言[い]いません。
    meaning:
      en: Thank you for telling me. I won't say it again.
      pt: Obrigada por me explicar. Nunca mais digo isso.
  - speaker: sato
    text: もう 気[き] に して いない わ。 正直[しょうじき] に 言[い]って くれて、 嬉[うれ]しかった。
    meaning:
      en: I don't mind any more. I was glad you came and told me honestly.
      pt: Já não me importo. Fiquei feliz de você vir falar com sinceridade.
  - speaker: protagonist
    text: 誤解[ごかい] が 解[と]けて、 よかった です。
    meaning:
      en: I'm glad the misunderstanding is cleared up.
      pt: Que bom que o mal-entendido se desfez.
