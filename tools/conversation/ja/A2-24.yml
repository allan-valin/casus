steps:
- type: narrator
  text:
    en: Seven in the evening. Your work is done, but the office is full. Kenta whispers about 付き合い残業 — staying because the boss stays. Listen to the conversation; you don't need to understand it yet.
    pt: Sete da noite. Seu trabalho acabou, mas o escritório está cheio. O Kenta cochicha sobre o 付き合い残業 — ficar porque o chefe fica. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: もう 定時[ていじ] だ けど、 みんな まだ いる ね。
    meaning:
      en: It's past finishing time, but everyone's still here.
      pt: Já deu o horário, mas todo mundo ainda está aqui.
  - speaker: protagonist
    text: 仕事[しごと] は 終[お]わった から、 帰[かえ]りたい。 でも 帰[かえ]って も いい？
    meaning:
      en: My work's finished, so I want to go home. But can I?
      pt: Meu trabalho acabou, então quero ir embora. Mas pode?
  - speaker: kenta
    text: 上司[じょうし] が 帰[かえ]らない から、 帰[かえ]りにくい。 付[つ]き合[あ]い 残業[ざんぎょう] って いう ん だ。
    meaning:
      en: The boss isn't leaving, so it's hard to leave. It's called 'keeping company' overtime.
      pt: O chefe não vai embora, então fica difícil sair. Chamam de hora extra de companhia.
  - speaker: protagonist
    text: でも 疲[つか]れた よ。 過労[かろう] は 問題[もんだい] でしょ。
    meaning:
      en: But I'm tired. Overwork is a problem, right?
      pt: Mas estou cansado. Excesso de trabalho é um problema, né?
  - speaker: kenta
    text: うん。 今[いま] は 古[ふる]い ルール だ と 思[おも]う 人[ひと] が 多[おお]い よ。 定時[ていじ] に 帰[かえ]る の は 権利[けんり] だ。
    meaning:
      en: Yeah. Most people think it's an outdated rule now. Leaving on time is your right.
      pt: É. Hoje a maioria acha que é regra ultrapassada. Sair no horário é seu direito.
  - speaker: protagonist
    text: じゃあ… お先[さき] に 失礼[しつれい] します。
    meaning:
      en: Then… excuse me for leaving first.
      pt: Então… com licença, já vou indo.
  - speaker: sato
    text: お疲[つか]れさま。 有給[ゆうきゅう] も ちゃんと 使[つか]って ね。
    meaning:
      en: Good work. Make sure you use your paid leave too.
      pt: Bom trabalho. E tire suas férias direitinho, viu.
  - speaker: protagonist
    text: はい、 ありがとう ございます。
    meaning:
      en: Yes, thank you.
      pt: Sim, obrigado.
