- type: narrator
  text:
    en: '«付[つ]き合[あ]い 残業[ざんぎょう]», staying late because the boss stays, is the unwritten rule many still feel — but in a 2023 survey 82.8 % called it the most outdated work value. It''s a custom, not a law:
      leaving on time is your right. Paid leave is 10 to 20 days a year by law, yet people take only about two thirds (12.1 of 18.1 days in 2024); since 2019 employers must make sure you take at least five.'
    pt: 'O «付[つ]き合[あ]い 残業[ざんぎょう]», ficar até tarde porque o chefe fica, é a regra não escrita que muitos ainda sentem — mas numa pesquisa de 2023, 82,8 % a apontaram como o valor de trabalho mais ultrapassado.
      É costume, não lei: sair no horário é seu direito. As férias remuneradas são de 10 a 20 dias por ano por lei, mas o pessoal tira só cerca de dois terços (12,1 de 18,1 dias em 2024); desde 2019 o empregador
      tem que garantir que você tire pelo menos cinco.'
- type: narrator
  for:
  - pt
  text:
    pt: Pela CLT você tem 30 dias de férias com um terço a mais, e a hora extra vale pelo menos 50 % a mais. No Japão o problema não é a lei, é o costume — por isso tire as suas férias e saia no horário
      quando o trabalho acabar.
