steps:
- type: narrator
  text:
    en: Monday after the factory league match against the team from the paint plant. Kenta replays it in plain Japanese. Listen to the conversation; you don't need to understand it yet.
    pt: Segunda depois do jogo da liga das fábricas contra o time da fábrica de tintas. O Kenta conta tudo em japonês informal. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: 昨日[きのう] の 試合[しあい]、 見[み]た？
    meaning:
      en: Did you see yesterday's match?
      pt: Viu o jogo de ontem?
  - speaker: protagonist
    text: 見[み]た よ！ 応援[おうえん] に 行[い]った。
    meaning:
      en: I did! I went to cheer.
      pt: Vi! Fui torcer.
  - speaker: kenta
    text: 相手[あいて]、 強[つよ]かった ね。
    meaning:
      en: The other team was strong.
      pt: O adversário era forte, né?
  - speaker: protagonist
    text: うん。 でも 最後[さいご] に 健太[けんた] くん が ゴール した！
    meaning:
      en: Yeah. But at the end you scored, Kenta!
      pt: É. Mas no fim você fez o gol, Kenta!
  - speaker: kenta
    text: それで 勝[か]った。 リーグ で 二位[にい] に なった よ。
    meaning:
      en: And we won. We're second in the league now.
      pt: E ganhamos. Ficamos em segundo na liga.
  - speaker: protagonist
    text: すごい！ 試合[しあい] の 後[あと] 何[なに] した？
    meaning:
      en: Great! What did you do after the match?
      pt: Demais! O que vocês fizeram depois do jogo?
  - speaker: kenta
    text: みんな で ラーメン を 食[た]べた。 ブラジル の 選手[せんしゅ] も 来[き]た よ。
    meaning:
      en: We all ate ramen. The Brazilian players came too.
      pt: Comemos lámen todo mundo junto. Os jogadores brasileiros vieram também.
  - speaker: protagonist
    text: いい ね。 次[つぎ] は 僕[ぼく] も 行[い]く！
    meaning:
      en: Nice. Next time I'm coming too!
      pt: Legal. Da próxima eu também vou!
- type: narrator
  text:
    en: 'The plain past is the «て» form with «た» instead of «て»: «行[い]って» → «行[い]った», «食[た]べて» → «食[た]べた», «して» → «した», «来[き]て» → «来[き]た». It''s what friends use — Kenta''s «見[み]た？» is the plain «見[み]ました
      か».'
    pt: 'O passado simples é a forma «て» com «た» no lugar de «て»: «行[い]って» → «行[い]った», «食[た]べて» → «食[た]べた», «して» → «した», «来[き]て» → «来[き]た». É o que os amigos usam — o «見[み]た？» do Kenta é o «見[み]ました か» informal.'
