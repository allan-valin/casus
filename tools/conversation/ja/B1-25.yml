steps:
- type: narrator
  text:
    en: Shota suggests moving in together to save on rent. You like the idea — but what will his parents think? Listen to the conversation; you don't need to understand it yet.
    pt: O Shota sugere morarem juntos para economizar no aluguel. Você gosta da ideia — mas o que os pais dele vão achar? Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: shota
    text: 一緒[いっしょ] に 住[す]まない？ 家賃[やちん] も 節約[せつやく] できる し。
    meaning:
      en: Shall we live together? We'd save on rent too.
      pt: Vamos morar juntos? A gente economiza no aluguel também.
  - speaker: protagonist
    text: いい ね！ でも、 ご両親[りょうしん] は 大丈夫[だいじょうぶ]？
    meaning:
      en: Nice! But will your parents be okay with it?
      pt: Boa! Mas seus pais vão aceitar?
  - speaker: shota
    text: うーん… 結婚[けっこん] 前[まえ] の 同棲[どうせい] に は 反対[はんたい] する かも しれない。
    meaning:
      en: Hmm… they might be against living together before marriage.
      pt: Hum… pode ser que sejam contra morar junto antes de casar.
  - speaker: protagonist
    text: やっぱり。 私[わたし] の 両親[りょうしん] も 心配[しんぱい] する かも。
    meaning:
      en: I thought so. My parents might worry too.
      pt: Eu imaginava. Meus pais também podem se preocupar.
  - speaker: shota
    text: ブラジル でも？
    meaning:
      en: In Brazil too?
      pt: No Brasil também?
  - speaker: protagonist
    text: 家族[かぞく] に よる よ。 うち は 古[ふる]い から。
    meaning:
      en: Depends on the family. Mine is old-fashioned.
      pt: Depende da família. A minha é tradicional.
  - speaker: shota
    text: じゃあ、 まず 両親[りょうしん] に 正直[しょうじき] に 話[はな]そう。
    meaning:
      en: Then let's talk to our parents honestly first.
      pt: Então vamos primeiro falar com sinceridade com os nossos pais.
  - speaker: protagonist
    text: うん。 将来[しょうらい] の こと も ちゃんと 説明[せつめい] しよう。
    meaning:
      en: Yes. Let's explain our plans for the future properly too.
      pt: Isso. E explicar direitinho os planos para o futuro.
