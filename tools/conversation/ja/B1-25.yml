- type: narrator
  text:
    en: '«同棲[どうせい]», living together before marriage, is more common than it was, but many parents still see it as a step before engagement, not instead of it. Couples often present it with a plan: when
      they''ll marry, how they''ll share costs.'
    pt: '«同棲[どうせい]», morar junto antes de casar, é mais comum do que era, mas muitos pais ainda veem como um passo antes do noivado, não no lugar dele. Os casais muitas vezes apresentam com um plano: quando
      vão casar, como vão dividir as despesas.'
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil, juntar as escovas de dente é comum e às vezes nem se anuncia. No Japão, muitos casais conversam antes com as duas famílias — e o plano de casamento costuma vir junto.
