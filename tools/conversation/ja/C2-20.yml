steps:
- type: narrator
  text:
    en: 'Three families rent a holiday house by the sea in Izu for the weekend: you and Yui, Kenta and Misaki, Lucas. Sunday night: settling up. Listen to the conversation; you don''t need to understand
      it yet.'
    pt: 'Três famílias alugam uma casa de veraneio na praia em Izu para o fim de semana: você e a Yui, o Kenta e a Misaki, o Lucas. Domingo à noite: o acerto de contas. Escute a conversa; ainda não precisa
      entender.'
- type: dialogue
  lines:
  - speaker: lucas
    text: バーベキュー 最高[さいこう] だった！ ブラジル の シュハスコ に 負[ま]けない ね。
    meaning:
      en: The barbecue was great! As good as a Brazilian churrasco.
      pt: O churrasco foi demais! Não perde para o churrasco brasileiro.
  - speaker: kenta
    text: じゃあ、 精算[せいさん] しよう。 別荘[べっそう] は 僕[ぼく] が 立[た]て替[か]えた。
    meaning:
      en: Then let's settle up. I paid for the house up front.
      pt: Então vamos acertar as contas. Eu adiantei o aluguel da casa.
  - speaker: protagonist
    text: 肉[にく] と 飲[の]み物[もの] は 僕[ぼく] が 払[はら]った。 領収書[りょうしゅうしょ] は ここ。
    meaning:
      en: I paid for the meat and drinks. Here are the receipts.
      pt: A carne e as bebidas eu paguei. Os recibos estão aqui.
  - speaker: misaki
    text: 大人[おとな] は 一人[ひとり] 一万円[いちまんえん] ずつ、 子供[こども] は 半額[はんがく] で どう？
    meaning:
      en: How about 10,000 yen each for adults and half for children?
      pt: Que tal 10 mil ienes por adulto e metade para as crianças?
  - speaker: yui
    text: 賛成[さんせい]。 計算[けいさん] は 私[わたし] が する ね。
    meaning:
      en: Agreed. I'll do the calculation.
      pt: Concordo. Eu faço a conta.
  - speaker: lucas
    text: 俺[おれ] は 一人[ひとり] だ から、 ちょっと 得[とく] した かな。
    meaning:
      en: I'm on my own, so I came out a bit ahead, maybe.
      pt: Eu estou sozinho, então saí no lucro, acho.
  - speaker: yui
    text: …はい、 出[で]ました。 健太[けんた] さん が 一番[いちばん] 多[おお]く 立[た]て替[か]えた から、 みんな から 少[すこ]し ずつ 返[かえ]して ね。
    meaning:
      en: …Here it is. Kenta paid the most up front, so everyone pays him back a little each.
      pt: …Pronto, saiu. O Kenta adiantou mais, então todo mundo devolve um pouco para ele.
  - speaker: protagonist
    text: 来年[らいねん] も みんな で 来[こ]よう。
    meaning:
      en: Let's all come again next year.
      pt: Ano que vem vamos vir todo mundo de novo.
