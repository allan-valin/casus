- type: narrator
  text:
    en: 'Among friends, Japanese groups settle costs carefully and openly: whoever paid «立[た]て替[か]える», receipts are shown, and the «精算[せいさん]» is done to the yen — often with a payment app. Being exact is
      a form of politeness, not stinginess.'
    pt: 'Entre amigos, os grupos japoneses acertam os custos com cuidado e às claras: quem pagou «立[た]て替[か]える», mostra os recibos, e o «精算[せいさん]» é feito até o último iene — muitas vezes com aplicativo
      de pagamento. Ser exato é uma forma de educação, não mesquinharia.'
- type: narrator
