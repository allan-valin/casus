steps:
- type: narrator
  text:
    en: 'Your son was born in October. Yui wants to go back to work in April, so you start 保活: hunting for a daycare place. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Seu filho nasceu em outubro. A Yui quer voltar a trabalhar em abril, então vocês começam o 保活: a caça por uma vaga na creche. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: yui
    text: 四月[しがつ] に 復職[ふくしょく] する ため に、 保育園[ほいくえん] を 探[さが]さなきゃ。
    meaning:
      en: To go back to work in April, we have to find a daycare.
      pt: Para eu voltar a trabalhar em abril, precisamos achar uma creche.
  - speaker: protagonist
    text: 保活[ほかつ] って、 そんな に 大変[たいへん] な の？
    meaning:
      en: Is daycare hunting that hard?
      pt: Caçar vaga em creche é tão difícil assim?
  - speaker: yui
    text: 子供[こども] が 減[へ]って いる 一方[いっぽう] で、 保育園[ほいくえん] に 入[はい]れない 待機[たいき] 児童[じどう] も まだ いる の。
    meaning:
      en: While the number of children is falling, there are still kids who can't get into daycare.
      pt: Enquanto o número de crianças diminui, ainda tem criança na fila sem conseguir vaga.
  - speaker: protagonist
    text: どう やって 決[き]まる の？
    meaning:
      en: How is it decided?
      pt: Como é decidido?
  - speaker: yui
    text: 点数[てんすう] で 決[き]まる。 両親[りょうしん] が フルタイム で 働[はたら]く と 点数[てんすう] が 高[たか]い。
    meaning:
      en: By points. If both parents work full-time, the points are higher.
      pt: Por pontuação. Se os dois pais trabalham em tempo integral, a pontuação é maior.
  - speaker: protagonist
    text: じゃあ、 まず 近[ちか]く の 保育園[ほいくえん] を 見学[けんがく] しよう。
    meaning:
      en: Then let's first visit the daycares nearby.
      pt: Então vamos primeiro visitar as creches perto de casa.
  - speaker: yui
    text: 保育士[ほいくし] さん の 雰囲気[ふんいき] も 見[み]たい ね。 申[もう]し込[こ]み は 十一月[じゅういちがつ] まで。
    meaning:
      en: I want to see what the teachers are like too. Applications close in November.
      pt: Quero ver como são as educadoras também. As inscrições vão até novembro.
  - speaker: protagonist
    text: 落[お]ちたら どう する？
    meaning:
      en: And if we don't get in?
      pt: E se a gente não conseguir?
