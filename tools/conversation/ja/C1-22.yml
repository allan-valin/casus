- type: narrator
  text:
    en: Public daycare places are allocated by city hall with a points system — full-time work, single parents and other needs add points. Applications for April close in autumn. Waiting lists have shrunk
      in many cities, but popular areas still have them; families visit several nurseries and apply to many.
    pt: As vagas nas creches públicas são distribuídas pela prefeitura por um sistema de pontos — trabalho em tempo integral, família monoparental e outras necessidades somam pontos. As inscrições para
      abril fecham no outono. As filas diminuíram em muitas cidades, mas bairros procurados ainda as têm; as famílias visitam várias creches e se inscrevem em muitas.
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil a fila da creche pública também existe, e muita gente recorre aos avós. No Japão, com os avós longe, o 保活 vira um projeto de família — com planilha e tudo.
