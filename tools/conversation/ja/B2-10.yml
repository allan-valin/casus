steps:
- type: narrator
  text:
    en: The office phone rings. Mr Yamada, the supplier, asks for Chief Sato — who is in a meeting. You take the message. Listen to the conversation; you don't need to understand it yet.
    pt: O telefone do escritório toca. O senhor Yamada, o fornecedor, pede para falar com a chefe Sato — que está em reunião. Você anota o recado. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: お電話[でんわ] ありがとう ございます。 浜松[はままつ] 工業[こうぎょう] の ソウザ で ございます。
    meaning:
      en: Thank you for calling. Hamamatsu Industries, Souza speaking.
      pt: Obrigado pela ligação. Hamamatsu Indústrias, Souza falando.
  - speaker: yamada
    text: 山田[やまだ] 商事[しょうじ] の 山田[やまだ] です。 佐藤[さとう] 課長[かちょう] は いらっしゃいます か。
    meaning:
      en: This is Yamada from Yamada Trading. Is Chief Sato there?
      pt: Aqui é o Yamada, da Yamada Comércio. A chefe Sato está?
  - speaker: protagonist
    text: 申[もう]し訳[わけ] ございません。 佐藤[さとう] は ただいま 席[せき] を 外[はず]して おります。
    meaning:
      en: I'm very sorry. Sato is away from her desk right now.
      pt: Peço desculpas. A Sato não está na mesa no momento.
  - speaker: yamada
    text: そう です か。 では、 伝言[でんごん] を お願[ねが]い できます か。
    meaning:
      en: I see. Then could you take a message?
      pt: Entendo. Então, pode anotar um recado?
  - speaker: protagonist
    text: かしこまりました。 伺[うかが]います。
    meaning:
      en: Certainly. Go ahead.
      pt: Pois não. Pode falar.
  - speaker: yamada
    text: 明日[あした] の 納品[のうひん] が 一日[いちにち] 遅[おく]れます、 と お伝[つた]え ください。
    meaning:
      en: Please tell her tomorrow's delivery will be a day late.
      pt: Diga a ela que a entrega de amanhã vai atrasar um dia, por favor.
  - speaker: protagonist
    text: 恐[おそ]れ入[い]ります が、 ご連絡先[れんらくさき] を 伺[うかが]えます か。 佐藤[さとう] から 折[お]り返[かえ]し お電話[でんわ] いたします。
    meaning:
      en: Sorry to trouble you, may I have your number? Sato will call you back.
      pt: Desculpe o incômodo, pode me passar seu contato? A Sato retorna a ligação.
  - speaker: yamada
    text: ありがとう ございます。 では、 よろしく お願[ねが]い します。
    meaning:
      en: Thank you. I'll leave it with you.
      pt: Obrigado. Então, conto com você.
