- type: narrator
  text:
    en: 'That is the end of A1. You can greet, introduce yourself, buy, ask the time and the way, invite, refuse softly, apologise at the right depth, and switch to plain talk with a friend. In A2 you settle
      in: the «て» form, rules, plans and stories.'
    pt: 'Fim do A1. Você sabe cumprimentar, se apresentar, comprar, perguntar a hora e o caminho, convidar, recusar com jeito, pedir desculpas na medida certa e passar para a fala informal com um amigo.
      No A2 você se estabelece: a forma «て», regras, planos e histórias.'
