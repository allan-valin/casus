steps:
- type: narrator
  text:
    en: Sunday morning. Kenta plays futsal with Brazilian and Japanese workers from the factory and asks you to join. A look back at the whole of A1. Listen to the conversation; you don't need to understand
      it yet.
    pt: Domingo de manhã. O Kenta joga futsal com trabalhadores brasileiros e japoneses da fábrica e chama você. Uma revisão de todo o A1. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: 日曜日[にちようび]、 フットサル の 試合[しあい] が ある。 来[く]る？
    meaning:
      en: There's a futsal match on Sunday. Coming?
      pt: Domingo tem jogo de futsal. Vem?
  - speaker: protagonist
    text: うん、 行[い]く！ ブラジル人[じん] も いる？
    meaning:
      en: Yeah, I'll come! Are there Brazilians?
      pt: Vou! Tem brasileiro?
  - speaker: kenta
    text: 半分[はんぶん] ブラジル人[じん]。 チーム の 中[なか] は ポルトガル語[ご] と 日本語[にほんご] だ よ。
    meaning:
      en: Half are Brazilian. In the team it's Portuguese and Japanese.
      pt: Metade é brasileira. No time se fala português e japonês.
  - speaker: protagonist
    text: ゴール！ 見[み]た？
    meaning:
      en: Goal! Did you see?
      pt: Gol! Viu?
  - speaker: kenta
    text: すごい！ 勝[か]った よ！
    meaning:
      en: Amazing! We won!
      pt: Demais! Ganhamos!
  - speaker: protagonist
    text: 楽[たの]しかった！ また 来週[らいしゅう]。
    meaning:
      en: That was fun! See you next week.
      pt: Foi divertido! Até semana que vem.
  - speaker: kenta
    text: 日本語[にほんご]、 本当[ほんとう] に 上手[じょうず] に なった ね。
    meaning:
      en: Your Japanese has really got good.
      pt: Seu japonês melhorou muito mesmo.
  - speaker: protagonist
    text: まだ まだ だ よ。 でも、 ありがとう。
    meaning:
      en: Not yet. But thanks.
      pt: Que nada, ainda falta. Mas obrigado.
