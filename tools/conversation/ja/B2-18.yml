- type: narrator
  text:
    en: Asked for a political opinion by an elder, a foreigner does well to speak about topics rather than parties, find something good on each side, and turn the question back. «勉強[べんきょう] に なります» — I'm
      learning from this — closes any argument kindly.
    pt: Quando um mais velho pede opinião política, o estrangeiro se sai bem falando de temas e não de partidos, achando algo bom em cada lado e devolvendo a pergunta. «勉強[べんきょう] に なります» — estou aprendendo
      com isso — encerra qualquer discussão com gentileza.
- type: narrator
