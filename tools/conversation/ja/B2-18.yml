steps:
- type: narrator
  text:
    en: Dinner at Yui's parents'. Her father, a retired civil servant, brings up the coming election and asks what you think. Listen to the conversation; you don't need to understand it yet.
    pt: Jantar na casa dos pais da Yui. O pai dela, funcionário público aposentado, puxa o assunto da eleição e pergunta o que você acha. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: yui-chichi
    text: 君[きみ] は 今度[こんど] の 選挙[せんきょ] を どう 思[おも]う？
    meaning:
      en: What do you think of the coming election?
      pt: O que você acha da próxima eleição?
  - speaker: protagonist
    text: 外国人[がいこくじん] の 視点[してん] です が… 経済[けいざい] の 政策[せいさく] に 一番[いちばん] 興味[きょうみ] が あります。
    meaning:
      en: From a foreigner's point of view… I'm most interested in economic policy.
      pt: Do ponto de vista de um estrangeiro… o que mais me interessa é a política econômica.
  - speaker: yui-chichi
    text: 与党[よとう] と 野党[やとう]、 どっち が いい と 思[おも]う？
    meaning:
      en: Ruling party or opposition — which do you think is better?
      pt: Governo ou oposição — qual você acha melhor?
  - speaker: yui
    text: お父[とう]さん、 その 質問[しつもん] は ちょっと…
    meaning:
      en: Dad, that question is a bit…
      pt: Pai, essa pergunta é meio…
  - speaker: protagonist
    text: 大丈夫[だいじょうぶ]。 どちら に も いい 点[てん] が ある と 思[おも]います。 お父[とう]さん は？
    meaning:
      en: It's fine. I think both have good points. And you, sir?
      pt: Tudo bem. Acho que os dois têm pontos bons. E o senhor?
  - speaker: yui-chichi
    text: 私[わたし] は 長[なが]い 間[あいだ] 公務員[こうむいん] だった から ね。 意見[いけん] が 違[ちが]う と して も、 怒[おこ]らない よ。
    meaning:
      en: I was a civil servant for a long time, you see. Even if our opinions differ, I won't get angry.
      pt: Fui funcionário público por muito tempo. Mesmo que a gente discorde, não vou ficar bravo.
  - speaker: protagonist
    text: お話[はなし]、 勉強[べんきょう] に なります。 お互[たが]い の 意見[いけん] を 尊重[そんちょう] したい です。
    meaning:
      en: This is very instructive. I'd like us to respect each other's views.
      pt: Estou aprendendo muito. Quero que a gente respeite a opinião um do outro.
  - speaker: yui
    text: …よかった。 じゃあ、 デザート に しましょう！
    meaning:
      en: …Phew. Then, let's have dessert!
      pt: …Ufa. Então, vamos à sobremesa!
