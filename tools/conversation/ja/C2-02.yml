steps:
- type: narrator
  text:
    en: 'Back from a meeting in Kyoto, you tell Takahashi-buchō how kind the client was: he praised your watch twice. The department head laughs. Listen to the conversation; you don''t need to understand
      it yet.'
    pt: 'De volta de uma reunião em Kyoto, você conta ao chefe Takahashi como o cliente foi gentil: elogiou o seu relógio duas vezes. O chefe dá risada. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: 京都[きょうと] の お客様[きゃくさま] は 親切[しんせつ] でした。「いい 時計[とけい] を して はります な」 と 二回[にかい] も 褒[ほ]めて くれました。
    meaning:
      en: 'The Kyoto client was kind. He praised me twice: “What a nice watch you have.”'
      pt: 'O cliente de Kyoto foi gentil. Elogiou duas vezes: «Que relógio bonito o senhor tem».'
  - speaker: buchou
    text: ははは。 それ は「もう 時間[じかん] です よ」 と いう 意味[いみ] だ よ。
    meaning:
      en: Ha ha. That means “it's time you left.”
      pt: Rá. Isso quer dizer «já está na hora».
  - speaker: protagonist
    text: え？ 褒[ほ]めて いる よう で、 帰[かえ]れ と？
    meaning:
      en: What? Seeming to praise, he meant go home?
      pt: Quê? Parecendo elogiar, ele queria que eu fosse embora?
  - speaker: buchou
    text: 京都[きょうと] は 遠回[とおまわ]し な 言[い]い方[かた] で 有名[ゆうめい] だ。「ぶぶ漬[づ]け でも どうぞ」 も 同[おな]じ。
    meaning:
      en: Kyoto is famous for roundabout ways of speaking. “Have some tea over rice” is the same.
      pt: Kyoto é famosa pelo jeito indireto. «Aceita um chá com arroz?» é a mesma coisa.
  - speaker: protagonist
    text: 裏[うら] の 意味[いみ] に 全然[ぜんぜん] 気[き]付[づ]きません でした。
    meaning:
      en: I didn't notice the hidden meaning at all.
      pt: Não percebi nada do sentido oculto.
  - speaker: buchou
    text: 「いい ご身分[みぶん] です ね」 も 気[き] を つけて。 羨[うらや]ましい ん じゃ なくて、 皮肉[ひにく] だ から。
    meaning:
      en: Watch out for “must be nice” too. It's not envy, it's irony.
      pt: Cuidado também com «que vida boa, hein». Não é inveja, é ironia.
  - speaker: protagonist
    text: 「結構[けっこう] です」 も、 いい なのか、 いらない なのか…
    meaning:
      en: And “kekkō desu” — is it “fine” or “no thanks”…
      pt: E «kekkō desu» — é «ótimo» ou «não, obrigado»…
  - speaker: buchou
    text: 顔[かお] と 声[こえ] で 判断[はんだん] する ん だ。 君[きみ] も もう 上級者[じょうきゅうしゃ] だ から、 わかる はず。
    meaning:
      en: You judge by face and voice. You're advanced now — you should get it.
      pt: Você julga pelo rosto e pela voz. Agora você é avançado — deve entender.
