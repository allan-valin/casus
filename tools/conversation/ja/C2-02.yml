- type: narrator
  text:
    en: 'Irony by politeness says the opposite through praise or an offer: «いい ご身分[みぶん] です ね» (must be nice — you''re slacking), a Kyoto host praising your watch or offering «ぶぶ漬[づ]け» (time to leave). These
      Kyoto examples are partly stereotype and joke, but the habit is real: read the face, the timing, the context.'
    pt: 'A ironia pela cortesia diz o contrário por meio de um elogio ou de uma oferta: «いい ご身分[みぶん] です ね» (que vida boa — você está à toa), o anfitrião de Kyoto elogiando o seu relógio ou oferecendo «ぶぶ漬[づ]け»
      (hora de ir). Esses exemplos de Kyoto são em parte estereótipo e piada, mas o hábito é real: leia o rosto, o momento, o contexto.'
