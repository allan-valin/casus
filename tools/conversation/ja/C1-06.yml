- type: narrator
  text:
    en: 'A Japanese debate builds carefully: «確[たし]か に» concedes a point, «しかし» turns it, «根拠[こんきょ]» backs it up, «結論[けつろん] と して» closes. Being assigned the side you don''t hold is a classic school and
      workshop exercise.'
    pt: 'Um debate em japonês se constrói com cuidado: «確[たし]か に» admite um ponto, «しかし» vira o argumento, «根拠[こんきょ]» sustenta, «結論[けつろん] と して» fecha. Defender o lado de que você discorda é um exercício
      clássico de escola e de oficina.'
