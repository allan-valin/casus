steps:
- type: narrator
  text:
    en: 'Ishida-sensei splits the evening class into sides: should Japan accept more immigrants? You''re put on the side you don''t agree with. Listen to the conversation; you don''t need to understand
      it yet.'
    pt: 'O professor Ishida divide a turma em lados: o Japão deve aceitar mais imigrantes? Você cai no lado de que discorda. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: kouza-sensei
    text: 今日[きょう] は 討論[とうろん] です。 あなた は 反対[はんたい] の 立場[たちば] で 話[はな]して ください。
    meaning:
      en: Today is a debate. Please speak from the opposing position.
      pt: Hoje é debate. Fale pela posição contrária, por favor.
  - speaker: protagonist
    text: 自分[じぶん] の 意見[いけん] と 違[ちが]います が… やって みます。
    meaning:
      en: It's not my own opinion, but… I'll try.
      pt: Não é minha opinião, mas… vou tentar.
  - speaker: protagonist
    text: 確[たし]か に 人手[ひとで] 不足[ぶそく] は 深刻[しんこく] です。 しかし、 言葉[ことば] や 住宅[じゅうたく] の 支援[しえん] が 足[た]りません。
    meaning:
      en: Admittedly the labour shortage is serious. However, support with language and housing is lacking.
      pt: É verdade que a falta de mão de obra é séria. No entanto, falta apoio com a língua e a moradia.
  - speaker: kouza-sensei
    text: その 主張[しゅちょう] の 根拠[こんきょ] は？
    meaning:
      en: What are the grounds for that argument?
      pt: Qual é o fundamento desse argumento?
  - speaker: protagonist
    text: 私[わたし] 自身[じしん] の 経験[けいけん] です。 日本[にほん] に 限[かぎ]らず、 どの 国[くに] でも 受[う]け入[い]れ の 準備[じゅんび] が 先[さき] です。
    meaning:
      en: My own experience. Not only in Japan — in any country, preparing to receive people comes first.
      pt: A minha própria experiência. Não só no Japão — em qualquer país, preparar o acolhimento vem primeiro.
  - speaker: kouza-sensei
    text: なるほど、 一理[いちり] ある。 では、 反論[はんろん] は？
    meaning:
      en: I see, there's something in that. Now, any counter-argument?
      pt: Entendo, tem razão em parte. Agora, algum contra-argumento?
  - speaker: protagonist
    text: 結論[けつろん] と して、 受[う]け入[い]れ に 反対[はんたい] する の では なく、 準備[じゅんび] なし の 受[う]け入[い]れ に 反対[はんたい] します。
    meaning:
      en: In conclusion, I'm not against accepting people — I'm against accepting them without preparation.
      pt: Em conclusão, não sou contra acolher — sou contra acolher sem preparo.
  - speaker: kouza-sensei
    text: 見事[みごと]。 反対[はんたい] の 立場[たちば] から、 賛成[さんせい] に 近[ちか]い 結論[けつろん] に なりました ね。
    meaning:
      en: Splendid. From the opposing side you reached a conclusion close to being in favour.
      pt: Excelente. Partindo do lado contrário, você chegou a uma conclusão quase a favor.
