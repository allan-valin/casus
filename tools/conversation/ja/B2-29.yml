steps:
- type: narrator
  text:
    en: 'Under the cherry trees where you once had hanami, Shota takes out a ring. Afterwards: how to tell both families. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Debaixo das cerejeiras onde vocês fizeram hanami, o Shota tira um anel. Depois: como contar para as duas famílias. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: shota
    text: 覚[おぼ]えて る？ 初[はじ]めて 一緒[いっしょ] に 花見[はなみ] を した 所[ところ]。
    meaning:
      en: Remember? The place where we first did hanami together.
      pt: Lembra? O lugar onde a gente fez hanami juntos pela primeira vez.
  - speaker: protagonist
    text: もちろん。 …え、 指輪[ゆびわ]？
    meaning:
      en: Of course. …Wait, a ring?
      pt: Claro. …Ué, um anel?
  - speaker: shota
    text: 一生[いっしょう] 幸[しあわ]せ に する。 結婚[けっこん] して ほしい。
    meaning:
      en: I'll make you happy for the rest of your life. I want you to marry me.
      pt: Vou te fazer feliz a vida toda. Quero que você case comigo.
  - speaker: protagonist
    text: …はい、 喜[よろこ]んで！
    meaning:
      en: …Yes, gladly!
      pt: …Sim, com muito prazer!
  - speaker: shota
    text: よかった！ 次[つぎ] は 両家[りょうけ] の 顔合[かおあ]わせ だ ね。
    meaning:
      en: Wonderful! Next is the first meeting of both families.
      pt: Que bom! O próximo passo é o encontro das duas famílias.
  - speaker: protagonist
    text: 結納[ゆいのう] も する の？
    meaning:
      en: Do we do a yuinō too?
      pt: A gente faz yuinō também?
  - speaker: shota
    text: 最近[さいきん] は 食事[しょくじ] 会[かい] だけ の 人[ひと] が 多[おお]い よ。 両親[りょうしん] に 来[き]て ほしい の は 日本[にほん]？ ブラジル？
    meaning:
      en: These days many just have a dinner. Where do you want your parents to come — Japan or Brazil?
      pt: Hoje em dia muita gente faz só um jantar. Você quer que seus pais venham ao Japão, ou fazemos no Brasil?
  - speaker: protagonist
    text: 母[はは] に は 日本[にほん] に 来[き]て ほしい。 祖母[そぼ] の 国[くに] だ から。
    meaning:
      en: I want my mother to come to Japan. It's my grandmother's country.
      pt: Quero que minha mãe venha ao Japão. É o país da minha avó.
