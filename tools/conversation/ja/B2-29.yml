- type: narrator
  text:
    en: 'After a proposal, the families meet: traditionally with «結納[ゆいのう]», a formal exchange of gifts and money, but today most couples hold a simpler «顔合[かおあ]わせ» dinner. With an international couple,
      distance decides a lot — video calls often join in.'
    pt: 'Depois do pedido, as famílias se encontram: tradicionalmente com o «結納[ゆいのう]», uma troca formal de presentes e dinheiro, mas hoje a maioria dos casais faz um jantar mais simples, o «顔合[かおあ]わせ».
      Com casal internacional, a distância decide muito — videochamadas costumam entrar na roda.'
