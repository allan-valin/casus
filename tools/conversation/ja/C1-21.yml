steps:
- type: narrator
  text:
    en: Married to Shota and living in Japan for years now, you apply for permanent residence at the immigration office. The officer goes through the requirements. Listen to the conversation; you don't
      need to understand it yet.
    pt: Casada com o Shota e morando no Japão há anos, você pede a residência permanente no escritório de imigração. A atendente repassa os requisitos. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: madoguchi
    text: 永住権[えいじゅうけん] の 申請[しんせい] です ね。 今[いま] の 在留[ざいりゅう] 資格[しかく] は？
    meaning:
      en: An application for permanent residency. Your current residence status?
      pt: Pedido de residência permanente, certo. Qual é o seu status de residência atual?
  - speaker: protagonist
    text: 日本人[にほんじん] の 配偶者[はいぐうしゃ] です。 結婚[けっこん] して 三年[さんねん] に なります。
    meaning:
      en: Spouse of a Japanese national. We've been married three years.
      pt: Cônjuge de japonês. Estamos casados há três anos.
  - speaker: madoguchi
    text: 要件[ようけん] を 満[み]たして います ね。 納税[のうぜい] 証明書[しょうめいしょ] と 年金[ねんきん] の 記録[きろく] も 必要[ひつよう] です。
    meaning:
      en: You meet the requirements. We also need tax payment certificates and your pension record.
      pt: Você atende aos requisitos. Também precisamos das certidões de impostos e do histórico da previdência.
  - speaker: protagonist
    text: 住民税[じゅうみんぜい] は 全部[ぜんぶ] 払[はら]って います。
    meaning:
      en: I've paid all my residence tax.
      pt: Paguei todo o imposto de residência.
  - speaker: madoguchi
    text: それ は 大事[だいじ] です。 書類[しょるい] は 状況[じょうきょう] に 応[おう]じて 追加[ついか] で お願[ねが]い する こと も あります。
    meaning:
      en: That's important. Depending on the case, we may ask for additional documents.
      pt: Isso é importante. Conforme o caso, podemos pedir documentos adicionais.
  - speaker: protagonist
    text: 審査[しんさ] に は どの くらい かかります か。
    meaning:
      en: How long does the review take?
      pt: Quanto tempo leva a análise?
  - speaker: madoguchi
    text: 数[すう] か月[げつ] かかる こと が 多[おお]い です。 結果[けっか] の 通知[つうち] は はがき で 届[とど]きます。
    meaning:
      en: It often takes several months. The notice of the result comes by postcard.
      pt: Muitas vezes leva alguns meses. O aviso do resultado chega por cartão-postal.
  - speaker: protagonist
    text: わかりました。 身元[みもと] 保証人[ほしょうにん] は 夫[おっと] に 頼[たの]みます。
    meaning:
      en: Understood. I'll ask my husband to be my guarantor.
      pt: Entendido. Vou pedir ao meu marido para ser o fiador.
