- type: narrator
  text:
    en: Permanent residence usually needs around ten years in Japan, but spouses of Japanese nationals can apply after about three years of marriage and one in Japan. Paid taxes, pension and insurance weigh
      heavily in the review. The rules change — always check the Immigration Services Agency before applying.
    pt: A residência permanente em geral pede uns dez anos no Japão, mas cônjuges de japoneses podem pedir depois de cerca de três anos de casamento e um no Japão. Impostos, previdência e seguro em dia
      pesam muito na análise. As regras mudam — sempre confira na Agência de Imigração antes de pedir.
- type: narrator
  for:
  - pt
  text:
    pt: Para muitos brasileiros, o «永住[えいじゅう]» é o fim da renovação de visto a cada poucos anos. Mas imposto ou previdência atrasados podem atrapalhar — guarde todos os comprovantes.
