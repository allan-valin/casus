- type: narrator
  text:
    en: Japan is twelve hours ahead of Brasília, so your morning is their evening and the other way round. «会[あ]いたい» and «寂[さび]しい» are the closest Japanese has to saudade — said to someone, they're tender
      words.
    pt: O Japão está doze horas à frente de Brasília, então sua manhã é a noite deles e vice-versa. «会[あ]いたい» e «寂[さび]しい» são o mais perto de saudade no japonês — ditas a alguém, são palavras carinhosas.
