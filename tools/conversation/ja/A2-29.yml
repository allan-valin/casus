steps:
- type: narrator
  text:
    en: At Maria's bakery on a grey Sunday. You miss home; Maria, who came from Paraná twenty years ago, knows the feeling. Listen to the conversation; you don't need to understand it yet.
    pt: Na padaria da Maria num domingo cinzento. Você está com saudade de casa; a Maria, que veio do Paraná há vinte anos, conhece bem. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: maria
    text: どうした の？ 元気[げんき] ない ね。
    meaning:
      en: What's wrong? You look down.
      pt: O que foi? Você está desanimada.
  - speaker: protagonist
    text: 家族[かぞく] に 会[あ]いたい です。 ちょっと 寂[さび]しい。
    meaning:
      en: I miss my family. I'm a bit lonely.
      pt: Quero ver minha família. Estou meio sozinha.
  - speaker: maria
    text: わかる よ。 私[わたし] も 最初[さいしょ] は 毎日[まいにち] 帰[かえ]りたかった。
    meaning:
      en: I get it. At first I wanted to go home every day too.
      pt: Eu entendo. No começo eu também queria voltar todo dia.
  - speaker: protagonist
    text: お母[かあ]さん と ビデオ 通話[つうわ] したい けど、 時差[じさ] が…
    meaning:
      en: I want to video call my mother, but the time difference…
      pt: Quero fazer videochamada com minha mãe, mas o fuso…
  - speaker: maria
    text: 十二時間[じゅうにじかん] だ から、 日本[にほん] の 朝[あさ] は ブラジル の 夜[よる]。
    meaning:
      en: It's twelve hours, so morning in Japan is night in Brazil.
      pt: São doze horas, então a manhã no Japão é a noite no Brasil.
  - speaker: protagonist
    text: じゃあ、 明日[あした] の 朝[あさ] 八時[はちじ] に かけます。
    meaning:
      en: Then I'll call tomorrow at eight in the morning.
      pt: Então ligo amanhã às oito da manhã.
  - speaker: maria
    text: うん。 それから、 これ。 故郷[ふるさと] の 味[あじ]。
    meaning:
      en: Good. And here — a taste of home.
      pt: Isso. E toma — o gosto da terra.
  - speaker: protagonist
    text: ポン・デ・ケージョ！ 元気[げんき] に なります。
    meaning:
      en: Pão de queijo! That cheers me up.
      pt: Pão de queijo! Já fico melhor.
