    en: After the 2016 Kumamoto earthquake, a fake post with a photo claimed a lion had escaped from a zoo; the man who posted it was arrested. Disasters bring a flood of «デマ». Check official sources —
      the city, the zoo, the national broadcaster — before you share.
    pt: Depois do terremoto de Kumamoto em 2016, um post falso com foto disse que um leão tinha fugido do zoológico; o homem que postou foi preso. Desastres trazem uma enxurrada de «デマ». Confira as fontes
      oficiais — a prefeitura, o zoológico, a emissora pública — antes de compartilhar.
