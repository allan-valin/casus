      share after checking.'
    pt: 'Você conhece «らしい», parece que — o que você ouviu, não verificou. Nas notícias é uma luz de alerta: «逃[に]げた らしい» quer dizer que ninguém confirmou. Combine com «〜て から», depois de: «調[しら]べて から 拡散[かくさん]
