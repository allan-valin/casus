steps:
- type: narrator
  text:
    en: 'After a strong quake, a post goes viral: a lion has escaped from the zoo. Aya is about to share it. You stop her. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Depois de um terremoto forte, um post viraliza: um leão fugiu do zoológico. A Aya está para compartilhar. Você impede. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: aya
    text: 見[み]て！ 動物園[どうぶつえん] から ライオン が 逃[に]げた らしい！ 拡散[かくさん] しよう。
    meaning:
      en: Look! Apparently a lion escaped from the zoo! Let's share it.
      pt: Olha! Parece que um leão fugiu do zoológico! Vamos compartilhar.
  - speaker: protagonist
    text: 待[ま]って。 出典[しゅってん] は どこ？
    meaning:
      en: Wait. What's the source?
      pt: Espera. Qual é a fonte?
  - speaker: aya
    text: 知[し]らない 人[ひと] の 投稿[とうこう]。 写真[しゃしん] も ある よ。
    meaning:
      en: A post from someone I don't know. There's a photo.
      pt: Um post de alguém que eu não conheço. Tem foto.
  - speaker: protagonist
    text: 写真[しゃしん] は 加工[かこう] できる。 動物園[どうぶつえん] の 公式[こうしき] サイト は？
    meaning:
      en: Photos can be edited. What does the zoo's official site say?
      pt: Foto dá para editar. E o site oficial do zoológico?
  - speaker: aya
    text: …何[なに] も 書[か]いて ない。 ニュース の 記事[きじ] も ない。
    meaning:
      en: …Nothing there. No news article either.
      pt: …Não diz nada. Nem matéria no noticiário.
  - speaker: protagonist
    text: じゃあ、 デマ かも しれない。 地震[じしん] の 後[あと] は デマ が 多[おお]い って 聞[き]いた。
    meaning:
      en: Then it might be fake. I heard there's a lot of fake news after earthquakes.
      pt: Então pode ser fake. Ouvi dizer que depois de terremoto tem muito boato.
  - speaker: aya
    text: 危[あぶ]なかった。 信[しん]じる 前[まえ] に、 調[しら]べて から 拡散[かくさん] する べき だ ね。
    meaning:
      en: That was close. You should check before you believe and share.
      pt: Essa foi por pouco. Antes de acreditar, tem que verificar, e só depois compartilhar.
  - speaker: protagonist
    text: うん。 偽物[にせもの] の 写真[しゃしん] は 本当[ほんとう] に 多[おお]い から。
    meaning:
      en: Yeah. There are really a lot of fake photos.
      pt: É. Tem muita foto falsa por aí.
