steps:
- type: narrator
  text:
    en: Monday morning at the factory gate. Kenta asks about your weekend. Listen to the conversation; you don't need to understand it yet.
    pt: Segunda de manhã, no portão da fábrica. O Kenta pergunta do seu fim de semana. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: おはよう。 週末[しゅうまつ]、 何[なに] した？
    meaning:
      en: Morning. What did you do at the weekend?
      pt: Bom dia. O que você fez no fim de semana?
  - speaker: protagonist
    text: 土曜日[どようび] は 浜松[はままつ] 駅[えき] に 行[い]きました。 買[か]い物[もの] です。
    meaning:
      en: On Saturday I went to Hamamatsu station. Shopping.
      pt: No sábado fui à estação de Hamamatsu. Compras.
  - speaker: kenta
    text: 何[なに] を 買[か]った の？
    meaning:
      en: What did you buy?
      pt: O que você comprou?
  - speaker: protagonist
    text: 冬[ふゆ] の コート を 買[か]いました。 健太[けんた] くん は？
    meaning:
      en: I bought a winter coat. And you, Kenta?
      pt: Comprei um casaco de inverno. E você, Kenta?
  - speaker: kenta
    text: 昨日[きのう] 映画[えいが] を 見[み]た よ。 一昨日[おととい] は 何[なに] も しなかった。
    meaning:
      en: I saw a film yesterday. The day before, nothing.
      pt: Ontem vi um filme. Anteontem, nada.
  - speaker: protagonist
    text: 映画[えいが]、 どう でした か。
    meaning:
      en: How was the film?
      pt: Como foi o filme?
  - speaker: kenta
    text: 長[なが]かった けど、 面白[おもしろ]かった。
    meaning:
      en: Long, but interesting.
      pt: Comprido, mas interessante.
  - speaker: protagonist
    text: 日曜日[にちようび] は ゆっくり しました。
    meaning:
      en: On Sunday I took it easy.
      pt: No domingo descansei.
