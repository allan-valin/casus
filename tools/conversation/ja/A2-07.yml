steps:
- type: narrator
  text:
    en: The section's after-work drinks at an izakaya. Chief Sato raises her glass; Kenta sits next to you. Listen to the conversation; you don't need to understand it yet.
    pt: O happy hour do setor num izakaya. A chefe Sato levanta o copo; o Kenta senta do seu lado. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sato
    text: 皆[みな]さん、 お疲[つか]れさま でした。 乾杯[かんぱい]！
    meaning:
      en: Everyone, good work this week. Cheers!
      pt: Pessoal, bom trabalho. Saúde!
  - speaker: protagonist
    text: 乾杯[かんぱい]！
    meaning:
      en: Cheers!
      pt: Saúde!
  - speaker: kenta
    text: 課長[かちょう] の コップ、 空[から] だ よ。
    meaning:
      en: The chief's glass is empty.
      pt: O copo da chefe está vazio.
  - speaker: protagonist
    text: 課長[かちょう]、 お注[つ]ぎ します。
    meaning:
      en: Chief, let me pour for you.
      pt: Chefe, deixe eu servir.
  - speaker: sato
    text: ありがとう。 じゃあ、 私[わたし] も。 ビール で いい？
    meaning:
      en: Thank you. Then let me pour yours. Beer okay?
      pt: Obrigada. Então eu sirvo você também. Pode ser cerveja?
  - speaker: protagonist
    text: すみません、 お酒[さけ] は あまり 飲[の]めません。 ウーロン茶[ちゃ] で。
    meaning:
      en: Sorry, I can't drink much alcohol. Oolong tea, please.
      pt: Desculpe, quase não bebo álcool. Chá oolong, por favor.
  - speaker: sato
    text: 大丈夫[だいじょうぶ] です よ。 さあ、 たくさん 食[た]べましょう。
    meaning:
      en: That's fine. Now, let's eat plenty.
      pt: Tudo bem. Agora, vamos comer bastante.
  - speaker: kenta
    text: もう 一杯[いっぱい] どう？
    meaning:
      en: Another one?
      pt: Mais um?
  - speaker: protagonist
    text: いえ、 もう 結構[けっこう] です。
    meaning:
      en: No, I'm fine, thanks.
      pt: Não, já estou bem, obrigada.
