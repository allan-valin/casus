- type: narrator
  text:
    en: 'At a «飲[の]み会[かい]» you never pour your own drink: you watch the glasses around you and fill them, starting with the chief, holding the bottle with both hands. When someone pours for you, lift your
      glass. Not drinking is fine — say so early and order tea; nobody should push.'
    pt: 'No «飲[の]み会[かい]» você nunca serve o próprio copo: fica de olho nos copos em volta e enche, começando pela chefe, segurando a garrafa com as duas mãos. Quando alguém servir você, levante o copo.
      Não beber é normal — diga logo e peça chá; ninguém deve insistir.'
- type: narrator
  for:
  - pt
  text:
    pt: 'No happy hour brasileiro cada um pede e serve o seu, e a conta muitas vezes se divide no fim. No nomikai a ordem importa: primeiro os outros, e a chefe antes de todos.'
