steps:
- type: narrator
  text:
    en: 'A client, Ms Nakamura, calls: a shipment arrived with the wrong parts. She is angry. Chief Sato is out; you handle it. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Uma cliente, a senhora Nakamura, liga: uma remessa chegou com as peças erradas. Ela está brava. A chefe Sato saiu; você atende. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: kyaku
    text: 注文[ちゅうもん] と 違[ちが]う 部品[ぶひん] が 届[とど]きました。 明日[あした] から 生産[せいさん] が 止[と]まります！
    meaning:
      en: Parts different from our order arrived. Our production stops tomorrow!
      pt: Chegaram peças diferentes do pedido. Nossa produção para amanhã!
  - speaker: protagonist
    text: 大変[たいへん] ご迷惑[めいわく] を おかけ しました。 誠[まこと] に 申[もう]し訳[わけ] ございません。
    meaning:
      en: We've caused you great trouble. I am truly sorry.
      pt: Causamos um grande transtorno. Peço sinceras desculpas.
  - speaker: kyaku
    text: どう して くれる ん です か。
    meaning:
      en: What are you going to do about it?
      pt: E o que vocês vão fazer?
  - speaker: protagonist
    text: ただいま 至急[しきゅう] 確認[かくにん] いたします。 注文[ちゅうもん] 番号[ばんごう] を お教[おし]え いただけます か。
    meaning:
      en: I will check urgently right now. Could you give me the order number?
      pt: Vou verificar com urgência agora. A senhora poderia me passar o número do pedido?
  - speaker: kyaku
    text: A の 三五二[さんごーに] です。
    meaning:
      en: A-352.
      pt: A-352.
  - speaker: protagonist
    text: 確認[かくにん] いたしました。 こちら の 間違[まちが]い です。 正[ただ]しい 部品[ぶひん] を 今日[きょう] 中[じゅう] に お送[おく]り 直[なお]し いたします。
    meaning:
      en: I've checked. It was our mistake. We will resend the correct parts today.
      pt: Verifiquei. O erro foi nosso. Reenviamos as peças corretas ainda hoje.
  - speaker: kyaku
    text: 今日[きょう] 中[じゅう] なら、 何[なん] とか なります。
    meaning:
      en: If it's today, we can manage.
      pt: Se for hoje, a gente dá um jeito.
  - speaker: protagonist
    text: 再発[さいはつ] 防止[ぼうし] の 対策[たいさく] も、 改[あらた]めて ご報告[ほうこく] いたします。 本当[ほんとう] に 申[もう]し訳[わけ] ございません でした。
    meaning:
      en: We'll also report the measures to prevent it happening again. Once more, I am truly sorry.
      pt: Também vamos informar as medidas para que não se repita. Mais uma vez, peço sinceras desculpas.
