- type: narrator
  text:
    en: 'Complaint handling uses the highest politeness: «誠[まこと] に 申[もう]し訳[わけ] ございません», «ご迷惑[めいわく] を おかけ しました», humble «いたします» for everything you do. The order: apologise first, listen, check, admit, offer
      a fix with a time, promise «再発[さいはつ] 防止[ぼうし]», apologise again.'
    pt: 'O atendimento de reclamação usa a cortesia máxima: «誠[まこと] に 申[もう]し訳[わけ] ございません», «ご迷惑[めいわく] を おかけ しました», o humilde «いたします» para tudo o que você faz. A ordem: desculpar-se primeiro, ouvir, verificar,
      admitir, oferecer solução com prazo, prometer «再発[さいはつ] 防止[ぼうし]» e desculpar-se de novo.'
- type: prompt
  ask:
    en: 'Say the famous saying: the customer is god.'
    pt: 'Diga o ditado famoso: o cliente é deus.'
  answer:
    speaker: protagonist
    text: お客様[きゃくさま] は 神様[かみさま]
  items:
  - okyakusama-wa-kamisama
- type: narrator
  text:
    en: '«お客様[きゃくさま] は 神様[かみさま]» comes from a 1960s singer''s stage line and became a slogan for service. Today there is pushback: abusive customers, «カスハラ», are recognised as a problem, and some places,
      Tokyo first, now have rules protecting staff.'
    pt: '«お客様[きゃくさま] は 神様[かみさま]» vem de uma frase de palco de um cantor dos anos 1960 e virou lema do atendimento. Hoje há reação: clientes abusivos, a «カスハラ», são reconhecidos como problema, e alguns lugares,
      Tóquio primeiro, já têm regras protegendo os funcionários.'
- type: narrator
  for:
  - pt
  text:
    pt: 'No Brasil se diz «o cliente tem sempre razão». No Japão o cliente é deus — mas até deus, hoje, tem limite: a «カスハラ» virou tema de lei.'
