steps:
- type: narrator
  text:
    en: 'You got the permanent post. Chief Sato goes through the contract with you: monthly pay, bonuses, the probation period. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Você conseguiu a vaga efetiva. A chefe Sato repassa o contrato com você: salário mensal, bônus, período de experiência. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: sato
    text: 来月[らいげつ] から 正社員[せいしゃいん] と して 働[はたら]く こと に なりました。 おめでとう。
    meaning:
      en: It's been decided you'll work as a permanent employee from next month. Congratulations.
      pt: Ficou decidido que você vai trabalhar como efetivo a partir do mês que vem. Parabéns.
  - speaker: protagonist
    text: ありがとう ございます。 条件[じょうけん] を 確認[かくにん] しても よろしい です か。
    meaning:
      en: Thank you. May I check the terms?
      pt: Obrigado. Posso conferir as condições?
  - speaker: sato
    text: はい。 最初[さいしょ] の 三[さん] か月[げつ] は 試用[しよう] 期間[きかん] です。
    meaning:
      en: Yes. The first three months are a probation period.
      pt: Sim. Os três primeiros meses são de experiência.
  - speaker: protagonist
    text: 月給[げっきゅう] と ボーナス は？
    meaning:
      en: And the monthly salary and bonuses?
      pt: E o salário mensal e o bônus?
  - speaker: sato
    text: ボーナス は 年[ねん] に 二回[にかい]、 夏[なつ] と 冬[ふゆ] です。 社会[しゃかい] 保険[ほけん] と 年金[ねんきん] も あります。
    meaning:
      en: Bonuses twice a year, summer and winter. There's social insurance and a pension too.
      pt: Bônus duas vezes por ano, no verão e no inverno. Tem previdência e plano de saúde também.
  - speaker: protagonist
    text: 年金[ねんきん] は 帰国[きこく] したら どう なります か。
    meaning:
      en: What happens to the pension if I go back home?
      pt: E a aposentadoria, se eu voltar para o Brasil?
  - speaker: sato
    text: ブラジル と 日本[にほん] は 協定[きょうてい] が ある ので、 期間[きかん] を 合[あ]わせられます。
    meaning:
      en: Brazil and Japan have an agreement, so the periods can be combined.
      pt: O Brasil e o Japão têm um acordo, então dá para somar os períodos.
  - speaker: sato
    text: では、 ここ に 判子[はんこ] を 押[お]して ください。
    meaning:
      en: Then please stamp your seal here.
      pt: Então carimbe aqui, por favor.
