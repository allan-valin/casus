- type: narrator
  text:
    en: Many Japanese companies pay a bonus twice a year, in summer and winter, often worth one or more months' salary each — though it depends on the company and on results. Brazil and Japan have a social-security
      agreement, so years paid into either pension can count toward the other.
    pt: Muitas empresas japonesas pagam bônus duas vezes por ano, no verão e no inverno, muitas vezes de um ou mais salários cada — mas depende da empresa e dos resultados. O Brasil e o Japão têm um acordo
      de previdência, então os anos de contribuição num país podem contar no outro.
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil há o 13º salário e as férias com um terço; no Japão, o bônus de verão e de inverno faz esse papel — só que não é garantido por lei como o nosso 13º.
