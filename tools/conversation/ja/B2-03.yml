- type: narrator
  text:
    en: People with one Japanese parent are commonly called «ハーフ», from «half»; some prefer «ミックス» or «ダブル» — both, not half. The older «混血[こんけつ]», mixed blood, is avoided now. Words change as Japan becomes
      more diverse.
    pt: Pessoas com um pai ou mãe japonês costumam ser chamadas de «ハーフ», do inglês half; algumas preferem «ミックス» ou «ダブル» — os dois, não metade. O antigo «混血[こんけつ]», sangue misturado, hoje se evita. As
      palavras mudam conforme o Japão fica mais diverso.
- type: narrator
