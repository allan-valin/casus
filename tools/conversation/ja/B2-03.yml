steps:
- type: narrator
  text:
    en: 'Aya''s genetics class sent her home with a family-tree exercise. She asks about yours: a Japanese grandmother, a Portuguese grandfather. Listen to the conversation; you don''t need to understand
      it yet.'
    pt: 'A aula de genética da Aya mandou um exercício de árvore genealógica. Ela pergunta da sua: avó japonesa, avô português. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: aya
    text: 家系図[かけいず] の 宿題[しゅくだい] なんだ。 先祖[せんぞ] は どこ の 人[ひと]？
    meaning:
      en: It's family-tree homework. Where are your ancestors from?
      pt: É lição de árvore genealógica. De onde são seus antepassados?
  - speaker: protagonist
    text: 母方[ははかた] の 祖母[そぼ] は 日本人[にほんじん]。 父方[ちちかた] の 祖父[そふ] は ポルトガル 人[じん]。
    meaning:
      en: My grandmother on my mother's side is Japanese. My grandfather on my father's side is Portuguese.
      pt: Minha avó por parte de mãe é japonesa. Meu avô por parte de pai é português.
  - speaker: aya
    text: だから 目[め] の 色[いろ] が ちょっと 明[あか]るい ん だ！ 遺伝[いでん] って 面白[おもしろ]い。
    meaning:
      en: So that's why your eyes are a bit lighter! Heredity is fascinating.
      pt: Por isso seus olhos são mais claros! Hereditariedade é fascinante.
  - speaker: protagonist
    text: ブラジル で は いろいろ な 遺伝子[いでんし] が 混[ま]ざって いる よ。
    meaning:
      en: In Brazil all sorts of genes are mixed.
      pt: No Brasil tem todo tipo de gene misturado.
  - speaker: aya
    text: 日本[にほん] で は「ハーフ」 って 言[い]う けど、 今[いま] は「ミックス」 と 言[い]う 人[ひと] も いる。
    meaning:
      en: In Japan people say “hāfu”, but some now say “mikkusu”.
      pt: No Japão se diz «hāfu», mas hoje tem gente que diz «mikkusu».
  - speaker: protagonist
    text: 半分[はんぶん] じゃ なくて、 両方[りょうほう] だ から ね。
    meaning:
      en: Because you're not half — you're both.
      pt: Porque não é metade — é os dois.
  - speaker: aya
    text: うん。 昔[むかし] の「混血[こんけつ]」 は 今[いま] は あまり 使[つか]わない。
    meaning:
      en: Yeah. The old word “konketsu” isn't used much now.
      pt: É. A palavra antiga «konketsu» quase não se usa mais.
  - speaker: protagonist
    text: 日本人[にほんじん] に 対[たい]して、 ブラジル 人[じん] は 見[み]た目[め] が 本当[ほんとう] に いろいろ。
    meaning:
      en: Compared with Japanese people, Brazilians look really varied.
      pt: Ao contrário dos japoneses, os brasileiros têm aparências bem variadas.
