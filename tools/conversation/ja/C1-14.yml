steps:
- type: narrator
  text:
    en: 'Sunday in Shizuoka city: a quiet march about restarting the Hamaoka nuclear plant. Kenta has come to collect signatures; you go along to see. Listen to the conversation; you don''t need to understand
      it yet.'
    pt: 'Domingo na cidade de Shizuoka: uma passeata tranquila sobre religar a usina nuclear de Hamaoka. O Kenta veio recolher assinaturas; você vai junto para ver. Escute a conversa; ainda não precisa
      entender.'
- type: dialogue
  lines:
  - speaker: kenta
    text: 浜岡[はまおか] の 再稼働[さいかどう] を めぐって、 住民[じゅうみん] 投票[とうひょう] を 求[もと]める 署名[しょめい] を 集[あつ]めて いる ん だ。
    meaning:
      en: Over the Hamaoka restart, we're collecting signatures asking for a local referendum.
      pt: Sobre o religamento de Hamaoka, estamos recolhendo assinaturas pedindo um plebiscito.
  - speaker: protagonist
    text: デモ って、 もっと 激[はげ]しい と 思[おも]って いた。
    meaning:
      en: I thought demonstrations were more intense.
      pt: Achei que manifestação fosse mais agitada.
  - speaker: kenta
    text: 日本[にほん] の デモ は 平和[へいわ] 的[てき]。 警察[けいさつ] が 道[みち] を 案内[あんない] して くれる くらい。
    meaning:
      en: Japanese demos are peaceful. The police even guide the route.
      pt: Manifestação japonesa é pacífica. A polícia até guia o caminho.
  - speaker: protagonist
    text: 要求[ようきゅう] は 何[なん] な の？
    meaning:
      en: What's the demand?
      pt: Qual é a reivindicação?
  - speaker: kenta
    text: 賛成[さんせい] か 反対[はんたい] か、 県民[けんみん] に 決[き]めて ほしい って こと。
    meaning:
      en: That the people of the prefecture decide, for or against.
      pt: Que o povo da província decida, a favor ou contra.
  - speaker: protagonist
    text: 外国人[がいこくじん] も 参加[さんか] して も いい の？
    meaning:
      en: Can foreigners take part?
      pt: Estrangeiro pode participar?
  - speaker: kenta
    text: デモ を 見[み]る の も 歩[ある]く の も 自由[じゆう] だ よ。 でも 署名[しょめい] は 有権者[ゆうけんしゃ] だけ。
    meaning:
      en: Watching or walking is free. But only voters can sign.
      pt: Ver e caminhar é livre. Mas só eleitor pode assinar.
  - speaker: protagonist
    text: 意見[いけん] が 分[わ]かれる 問題[もんだい] だ から、 みんな が 主張[しゅちょう] できる の は いい ね。
    meaning:
      en: It's a divisive issue, so it's good that everyone can speak up.
      pt: É uma questão que divide opiniões, então é bom que todo mundo possa se manifestar.
