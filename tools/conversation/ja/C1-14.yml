- type: narrator
  text:
    en: Demonstrations in Japan need a permit, follow a set route with police escort, and are usually calm. Residents can petition for a local referendum; in Shizuoka, a petition about Hamaoka gathered
      enough signatures, though the assembly decided not to hold the vote. Foreigners may watch or march, but only registered voters sign.
    pt: Manifestações no Japão precisam de autorização, seguem um trajeto definido com escolta policial e costumam ser calmas. Os moradores podem pedir um plebiscito local; em Shizuoka, um abaixo-assinado
      sobre Hamaoka reuniu assinaturas suficientes, mas a assembleia decidiu não fazer a votação. Estrangeiros podem assistir ou caminhar, mas só eleitores assinam.
- type: narrator
  for:
  - pt
  text:
    pt: Passeata no Brasil tem carro de som, bateria e às vezes confronto. No Japão é silenciosa, organizada — e a força está nas assinaturas.
