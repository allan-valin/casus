steps:
- type: narrator
  text:
    en: A summer evening at the shrine. Mrs Suzuki has lent you a yukata; Kenta waits by the food stalls. Fireworks later. Listen to the conversation; you don't need to understand it yet.
    pt: Uma noite de verão no santuário. A senhora Suzuki emprestou um yukata para você; o Kenta espera perto das barracas de comida. Fogos mais tarde. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: 浴衣[ゆかた]、 似合[にあ]います ね。
    meaning:
      en: The yukata suits you.
      pt: O yukata fica bem em você.
  - speaker: protagonist
    text: ありがとう ございます。 初[はじ]めて 着[き]ました。
    meaning:
      en: Thank you. It's the first time I've worn one.
      pt: Obrigado. É a primeira vez que visto um.
  - speaker: kenta
    text: おーい！ こっち、 屋台[やたい] が たくさん ある よ。
    meaning:
      en: Hey! Over here, lots of stalls.
      pt: Ei! Aqui, tem um monte de barraca.
  - speaker: protagonist
    text: 賑[にぎ]やか です ね。 あれ は 何[なん] です か。
    meaning:
      en: It's lively. What's that?
      pt: Que movimento. O que é aquilo?
  - speaker: kenta
    text: 金魚[きんぎょ] すくい。 やりたい？
    meaning:
      en: Goldfish scooping. Want to try?
      pt: Pescaria de peixinho dourado. Quer tentar?
  - speaker: protagonist
    text: はい、 やりたい です！ それから 花火[はなび] も 見[み]たい です。
    meaning:
      en: Yes, I want to! And I want to see the fireworks too.
      pt: Quero! E também quero ver os fogos.
  - speaker: suzuki
    text: 花火[はなび] は 八時[はちじ] から です。 夏[なつ] は これ が 一番[いちばん] です よ。
    meaning:
      en: The fireworks start at eight. This is the best thing about summer.
      pt: Os fogos começam às oito. Isso é o melhor do verão.
  - speaker: protagonist
    text: 来年[らいねん] も 浴衣[ゆかた] を 着[き]たい です。
    meaning:
      en: I want to wear a yukata next year too.
      pt: Ano que vem quero vestir yukata de novo.
