- type: narrator
  text:
    en: 'Summer festivals fill shrines and streets from July to August: stalls with grilled corn, shaved ice and goldfish scooping, «盆踊[ぼんおど]り» dances in a circle, and fireworks over rivers and lakes. A
      cotton «浴衣[ゆかた]» is the usual dress — left side over right.'
    pt: 'Os festivais de verão enchem santuários e ruas de julho a agosto: barracas de milho assado, raspadinha e pescaria de peixinho, a dança em roda «盆踊[ぼんおど]り» e fogos sobre rios e lagos. O «浴衣[ゆかた]»
      de algodão é a roupa de sempre — lado esquerdo por cima do direito.'
- type: narrator
