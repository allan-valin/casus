steps:
- type: narrator
  text:
    en: Hamamatsu station, the ticket office. You plan a weekend in Tokyo by shinkansen. Listen to the conversation; you don't need to understand it yet.
    pt: Estação de Hamamatsu, a bilheteria. Você planeja um fim de semana em Tóquio de trem-bala. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 東京[とうきょう] まで、 新幹線[しんかんせん] の 切符[きっぷ] を お願[ねが]いします。
    meaning:
      en: A shinkansen ticket to Tokyo, please.
      pt: Uma passagem de trem-bala para Tóquio, por favor.
  - speaker: madoguchi
    text: 片道[かたみち] です か、 往復[おうふく] です か。
    meaning:
      en: One way or return?
      pt: Só ida ou ida e volta?
  - speaker: protagonist
    text: 往復[おうふく] です。 土曜日[どようび] に 行[い]って、 日曜日[にちようび] に 帰[かえ]る つもり です。
    meaning:
      en: Return. I plan to go on Saturday and come back on Sunday.
      pt: Ida e volta. Pretendo ir no sábado e voltar no domingo.
  - speaker: madoguchi
    text: 指定席[していせき] と 自由席[じゆうせき]、 どちら に します か。
    meaning:
      en: Reserved or unreserved seat?
      pt: Assento reservado ou livre?
  - speaker: protagonist
    text: 指定席[していせき] で。 窓側[まどがわ] が いい です。 富士山[ふじさん] が 見[み]たい ので。
    meaning:
      en: Reserved. A window seat, please. I want to see Mount Fuji.
      pt: Reservado. Na janela, por favor. Quero ver o monte Fuji.
  - speaker: madoguchi
    text: では、 E 席[せき]、 左側[ひだりがわ] の 窓[まど] です ね。
    meaning:
      en: Then seat E, the left-hand window.
      pt: Então o assento E, janela do lado esquerdo.
  - speaker: protagonist
    text: 東京[とうきょう] まで 何時間[なんじかん] です か。
    meaning:
      en: How many hours to Tokyo?
      pt: Quantas horas até Tóquio?
  - speaker: madoguchi
    text: ひかり で 一時間[いちじかん] 半[はん] ぐらい です。
    meaning:
      en: About an hour and a half on the Hikari.
      pt: Uma hora e meia, mais ou menos, no Hikari.
