- type: narrator
  text:
    en: 'Business manners you''ll be judged on: cards given and taken with both hands, read and placed on the table; at a toast, your glass a little lower than a senior''s; pour for others, not yourself;
      chopsticks never upright in rice or passed from chopsticks to chopsticks (both funeral rites); quiet on trains. Escalators: Tokyo stands left, Osaka right — custom, not law, and Saitama and Nagoya
      now ask everyone to stand still. When unsure, do what the people around you do.'
    pt: 'Etiqueta de trabalho em que você vai ser observado: cartão entregue e recebido com as duas mãos, lido e deixado na mesa; no brinde, o copo um pouco mais baixo que o de quem é mais velho; servir
      os outros, não a si; hashi nunca em pé no arroz nem passado de hashi para hashi (os dois são ritos de funeral); silêncio no trem. Escadas rolantes: Tóquio fica à esquerda, Osaka à direita — costume,
      não lei, e Saitama e Nagoya hoje pedem que todos fiquem parados. Na dúvida, faça como as pessoas em volta.'
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil a escada rolante é «fica à direita, anda à esquerda». Em Tóquio é o contrário — e em Osaka igual ao Brasil. Olhe a fila antes de subir.
