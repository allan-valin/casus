steps:
- type: narrator
  text:
    en: First day at head office in Tokyo. Business cards with the department head, then a welcome dinner with Chief Sato and the team. Listen to the conversation; you don't need to understand it yet.
    pt: Primeiro dia na sede em Tóquio. Cartões de visita com o chefe do departamento, depois um jantar de boas-vindas com a chefe Sato e a equipe. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: buchou
    text: 高橋[たかはし] です。 よろしく。
    meaning:
      en: I'm Takahashi. Pleased to meet you.
      pt: Sou o Takahashi. Muito prazer.
  - speaker: protagonist
    text: ソウザ と 申[もう]します。 どうぞ よろしく お願[ねが]いいたします。
    meaning:
      en: My name is Souza. I look forward to working with you.
      pt: Me chamo Souza. Conto com o senhor.
  - speaker: sato
    text: 部長[ぶちょう] は ブラジル に 三年[さんねん] いらっしゃった ん です よ。
    meaning:
      en: The department head spent three years in Brazil, you know.
      pt: O chefe de departamento morou três anos no Brasil, sabia?
  - speaker: buchou
    text: ポルトガル語[ご] は もう 忘[わす]れた けど ね。
    meaning:
      en: Though I've forgotten my Portuguese.
      pt: Mas já esqueci o português.
  - speaker: protagonist
    text: 部長[ぶちょう] が そう おっしゃって も、 発音[はつおん] が きれい です。
    meaning:
      en: Even if you say so, your pronunciation is lovely.
      pt: Mesmo o senhor dizendo isso, sua pronúncia é ótima.
  - speaker: sato
    text: では、 乾杯[かんぱい]！ …グラス は 部長[ぶちょう] より 少[すこ]し 低[ひく]く ね。
    meaning:
      en: Then, cheers! …Hold your glass a little lower than the head's.
      pt: Então, saúde! …O copo um pouco mais baixo que o do chefe, viu.
  - speaker: protagonist
    text: はい。 お箸[はし] は ご飯[はん] に 立[た]てて は いけない、 です よね。
    meaning:
      en: Yes. And chopsticks must never stand upright in the rice, right?
      pt: Certo. E o hashi nunca pode ficar em pé no arroz, né?
  - speaker: sato
    text: そう。 それから、 東京[とうきょう] の エスカレーター は 左[ひだり] に 立[た]ちます よ。 大阪[おおさか] は 右[みぎ]。
    meaning:
      en: Right. And on Tokyo escalators you stand on the left. In Osaka, the right.
      pt: Isso. E nas escadas rolantes de Tóquio se fica à esquerda. Em Osaka, à direita.
