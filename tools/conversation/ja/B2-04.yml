      humble «申[もう]す», «参[まい]る».'
    pt: 'Os verbos respeitosos, «尊敬[そんけい]語[ご]», elevam o outro: «いる» / «来[く]る» / «行[い]く» → «いらっしゃる»; «言[い]う» → «おっしゃる». Usados para o chefe ou um cliente, nunca para si mesmo — para si se usa o humilde
      «申[もう]す», «参[まい]る».'
