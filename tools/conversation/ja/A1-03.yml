      pt: Aqui. É a idade.
  - speaker: protagonist
    text: 病院[びょういん] は？
    meaning:
      en: And the clinic?
      pt: E o médico?
  - speaker: suzuki
    text: いいえ、 大丈夫[だいじょうぶ] です。
    meaning:
