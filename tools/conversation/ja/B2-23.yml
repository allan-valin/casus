steps:
- type: narrator
  text:
    en: 'Department head Takahashi calls you in: from April you''ll be a team lead, with three people under you. Afterwards Chief Sato gives advice. Listen to the conversation; you don''t need to understand
      it yet.'
    pt: 'O chefe de departamento Takahashi chama você: a partir de abril você será líder de equipe, com três pessoas abaixo de você. Depois a chefe Sato dá conselhos. Escute a conversa; ainda não precisa
      entender.'
- type: dialogue
  lines:
  - speaker: buchou
    text: 四月[しがつ] から 主任[しゅにん] に なって もらいます。 昇進[しょうしん] です。
    meaning:
      en: From April you'll be a team lead. A promotion.
      pt: A partir de abril você vai ser líder de equipe. É uma promoção.
  - speaker: protagonist
    text: ありがとう ございます。 期待[きたい] に 応[こた]えられる よう、 頑張[がんば]ります。
    meaning:
      en: Thank you. I'll do my best to live up to your hopes.
      pt: Muito obrigada. Vou me esforçar para corresponder às expectativas.
  - speaker: buchou
    text: 部下[ぶか] が 三人[さんにん] です。 責任[せきにん] も 大[おお]きく なります よ。
    meaning:
      en: Three people under you. The responsibility grows too.
      pt: Três subordinados. A responsabilidade também aumenta.
  - speaker: sato
    text: おめでとう！ 上司[じょうし] に なったら、 まず 部下[ぶか] の 話[はなし] を 聞[き]く べき です。
    meaning:
      en: Congratulations! Once you're a boss, first of all you should listen to your people.
      pt: Parabéns! Quando virar chefe, a primeira coisa é ouvir a equipe.
  - speaker: protagonist
    text: 叱[しか]る 時[とき] は どう する べき です か。
    meaning:
      en: How should I scold someone?
      pt: E quando for preciso repreender?
  - speaker: sato
    text: 叱[しか]る の は 二人[ふたり] の 時[とき]。 褒[ほ]める の は みんな の 前[まえ]。
    meaning:
      en: Scold in private. Praise in front of everyone.
      pt: Repreender a sós. Elogiar na frente de todos.
  - speaker: protagonist
    text: ブラジル で も そう 言[い]います。 自分[じぶん] が 見本[みほん] に ならなきゃ。
    meaning:
      en: We say that in Brazil too. I have to be the example myself.
      pt: No Brasil também se diz isso. Eu mesma tenho que ser o exemplo.
  - speaker: sato
    text: そう。 困[こま]ったら、 いつでも 協力[きょうりょく] します から。
    meaning:
      en: Right. If you're stuck, I'll always help.
      pt: Isso. Se tiver dificuldade, conte comigo sempre.
