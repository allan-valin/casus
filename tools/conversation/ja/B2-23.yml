- type: narrator
  text:
    en: 'Japanese titles climb step by step — «主任[しゅにん]», «係長[かかりちょう]», «課長[かちょう]», «部長[ぶちょう]» — and people are called by them. Promotions are announced in spring with the new fiscal year in April; the
      expected answer is humble: you''ll try to meet expectations.'
    pt: 'Os cargos japoneses sobem degrau por degrau — «主任[しゅにん]», «係長[かかりちょう]», «課長[かちょう]», «部長[ぶちょう]» — e as pessoas são chamadas por eles. As promoções saem na primavera, com o ano fiscal que começa
      em abril; a resposta esperada é humilde: você vai se esforçar para corresponder.'
