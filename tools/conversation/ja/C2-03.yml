steps:
- type: narrator
  text:
    en: Local TV is filming the taiko group for the evening news. The reporter wants a word from the Brazilian member — live. Listen to the conversation; you don't need to understand it yet.
    pt: A TV local está filmando o grupo de taikô para o jornal da noite. A repórter quer uma palavra da integrante brasileira — ao vivo. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: reporter
    text: 視聴者[しちょうしゃ] の 皆[みな]さん、 こんばんは。 今日[きょう] は 浜松[はままつ] の 太鼓[たいこ] グループ を 取材[しゅざい] して います。
    meaning:
      en: Good evening, viewers. Today we're reporting on a taiko group in Hamamatsu.
      pt: Boa noite, telespectadores. Hoje estamos com um grupo de taikô de Hamamatsu.
  - speaker: reporter
    text: ブラジル 出身[しゅっしん] の メンバー に インタビュー します。 太鼓[たいこ] の 魅力[みりょく] は 何[なん] です か。
    meaning:
      en: We'll interview a member from Brazil. What's the appeal of taiko?
      pt: Vamos entrevistar uma integrante brasileira. Qual é o encanto do taikô?
  - speaker: protagonist
    text: 緊張[きんちょう] して います が… 体[からだ] 全体[ぜんたい] に 響[ひび]く 迫力[はくりょく] です。 みんな の 心[こころ] が 一[ひと]つ に なる ところ も 好[す]き です。
    meaning:
      en: I'm nervous, but… the power that resonates through your whole body. And I love how everyone's hearts become one.
      pt: Estou nervosa, mas… a força que vibra no corpo todo. E adoro como o coração de todos vira um só.
  - speaker: reporter
    text: 日本[にほん] に 来[き]て、 地域[ちいき] と の つながり は 変[か]わりました か。
    meaning:
      en: Since coming to Japan, has your connection with the community changed?
      pt: Desde que veio ao Japão, a sua ligação com a comunidade mudou?
  - speaker: protagonist
    text: はい。 太鼓[たいこ] の おかげ で、 近所[きんじょ] の 方々[かたがた] と 家族[かぞく] の よう に なりました。
    meaning:
      en: Yes. Thanks to taiko, the neighbours have become like family.
      pt: Sim. Graças ao taikô, os vizinhos viraram quase uma família.
  - speaker: reporter
    text: 最後[さいご] に、 感想[かんそう] を 一言[ひとこと] お願[ねが]い します。
    meaning:
      en: Finally, a word on your thoughts, please.
      pt: Por fim, uma palavra sobre suas impressões, por favor.
  - speaker: protagonist
    text: ブラジル の リズム と 日本[にほん] の 太鼓[たいこ]、 両方[りょうほう] を 大切[たいせつ] に、 これ から も 続[つづ]けて いきたい です。
    meaning:
      en: Treasuring both Brazilian rhythm and Japanese taiko, I want to keep going.
      pt: Valorizando o ritmo brasileiro e o taikô japonês, quero continuar.
  - speaker: reporter
    text: ありがとう ございました。 以上[いじょう]、 浜松[はままつ] から お伝[つた]え しました。
    meaning:
      en: Thank you. That was our report from Hamamatsu.
      pt: Muito obrigada. Esta foi a nossa reportagem direto de Hamamatsu.
