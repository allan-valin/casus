- type: narrator
  text:
    en: 'Broadcast Japanese has its own register: the reporter opens with «視聴者[しちょうしゃ] の 皆[みな]さん», closes with «以上[いじょう]、 〜 から お伝[つた]え しました». Interviewees answer in short, positive, polite sentences — «〜て
      いきたい です», I want to keep doing — that can be cut into a clip.'
    pt: 'O japonês da TV tem registro próprio: a repórter abre com «視聴者[しちょうしゃ] の 皆[みな]さん», fecha com «以上[いじょう]、 〜 から お伝[つた]え しました». Os entrevistados respondem com frases curtas, positivas e educadas —
      «〜て いきたい です», quero continuar fazendo — que dão para cortar num trecho.'
