steps:
- type: narrator
  text:
    en: Saturday morning. Kenta has never eaten pão de queijo. You take him to Maria's Brazilian bakery. Listen to the conversation; you don't need to understand it yet.
    pt: Sábado de manhã. O Kenta nunca comeu pão de queijo. Você leva ele à padaria brasileira da Maria. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: maria
    text: いらっしゃい！ あ、 久[ひさ]しぶり。
    meaning:
      en: Welcome! Oh, long time no see.
      pt: Bem-vindo! Ah, quanto tempo.
  - speaker: protagonist
    text: マリア さん、 こちら は 友達[ともだち] の 健太[けんた] さん です。 初[はじ]めて です。
    meaning:
      en: Maria, this is my friend Kenta. It's his first time.
      pt: Maria, este é meu amigo Kenta. É a primeira vez dele.
  - speaker: kenta
    text: はじめまして。 この 店[みせ] は 人気[にんき] です ね。
    meaning:
      en: Nice to meet you. This shop is popular, isn't it.
      pt: Muito prazer. Esta loja é bem popular, né?
  - speaker: protagonist
    text: ポン・デ・ケージョ を ふたつ ください。 コーヒー も。
    meaning:
      en: Two pão de queijo, please. Coffee too.
      pt: Dois pães de queijo, por favor. Café também.
  - speaker: kenta
    text: わあ、 もちもち です ね！ おいしい！
    meaning:
      en: Wow, it's chewy! Delicious!
      pt: Nossa, é macio e elástico! Gostoso!
  - speaker: maria
    text: ブラジル の チーズ パン です よ。
    meaning:
      en: It's Brazilian cheese bread.
      pt: É pão de queijo brasileiro.
  - speaker: kenta
    text: 昨日[きのう] の パン も おいしかった です か。
    meaning:
      en: Was yesterday's bread good too?
      pt: O pão de ontem também estava gostoso?
  - speaker: protagonist
    text: 昨日[きのう] は 休[やす]み でした。
    meaning:
      en: Yesterday it was closed.
      pt: Ontem estava fechado.
  - speaker: kenta
    text: ごちそうさま でした。 本当[ほんとう] に おいしかった です。
    meaning:
      en: Thank you for the meal. It was really delicious.
      pt: Obrigado pela comida. Estava muito gostoso mesmo.
