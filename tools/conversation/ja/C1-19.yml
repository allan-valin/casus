- type: narrator
  text:
    en: 'Official forms use fixed words: «記入[きにゅう]» fill in, «提出[ていしゅつ]» submit, «受理[じゅり]» accepted, «本日[ほんじつ]» today (formal). In Japan a marriage is legal the moment the «婚姻届[こんいんとどけ]» is accepted at
      city hall — the ceremony is optional and has no legal weight.'
    pt: 'Os formulários oficiais usam palavras fixas: «記入[きにゅう]» preencher, «提出[ていしゅつ]» entregar, «受理[じゅり]» aceito, «本日[ほんじつ]» hoje (formal). No Japão o casamento é legal no momento em que o «婚姻届[こんいんとどけ]»
      é aceito na prefeitura — a cerimônia é opcional e não tem valor legal.'
- type: narrator
  text:
    en: The form needs two adult witnesses. A foreign spouse also brings a passport and a certificate from their consulate showing they are free to marry, with a Japanese translation. Foreigners have no
      «戸籍[こせき]»; the marriage is recorded in the Japanese spouse's register.
    pt: O formulário precisa de duas testemunhas adultas. O cônjuge estrangeiro leva também o passaporte e uma certidão do consulado mostrando que está livre para casar, com tradução para o japonês. Estrangeiros
      não têm «戸籍[こせき]»; o casamento fica registrado no do cônjuge japonês.
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil o casamento civil tem juiz de paz, proclamas e cerimônia no cartório. No Japão é um papel entregue no balcão — e depois é preciso registrar o casamento também no consulado brasileiro.
