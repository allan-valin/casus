steps:
- type: narrator
  text:
    en: You and Shota bring the marriage registration form to city hall. Two witnesses have signed. You also need a document from your consulate. Listen to the conversation; you don't need to understand
      it yet.
    pt: Você e o Shota levam o formulário de registro de casamento à prefeitura. Duas testemunhas já assinaram. Você também precisa de um documento do seu consulado. Escute a conversa; ainda não precisa
      entender.
- type: dialogue
  lines:
  - speaker: madoguchi
    text: 婚姻届[こんいんとどけ] です ね。 証人[しょうにん] 二人[ふたり] の 記入[きにゅう] も ある か、 確認[かくにん] します。
    meaning:
      en: A marriage registration. I'll check the two witnesses have filled it in.
      pt: Registro de casamento, certo. Vou conferir se as duas testemunhas preencheram.
  - speaker: shota
    text: 証人[しょうにん] は 健太[けんた] と 鈴木[すずき] さん です。
    meaning:
      en: The witnesses are Kenta and Mrs Suzuki.
      pt: As testemunhas são o Kenta e a senhora Suzuki.
  - speaker: madoguchi
    text: 外国籍[がいこくせき] の 方[かた] は、 領事館[りょうじかん] の 証明書[しょうめいしょ] と パスポート も お願[ねが]い します。
    meaning:
      en: For the foreign spouse, the consulate certificate and passport as well, please.
      pt: Para quem é estrangeiro, a certidão do consulado e o passaporte também, por favor.
  - speaker: protagonist
    text: はい、 書類[しょるい] は 全部[ぜんぶ] あります。 日本語[にほんご] の 訳[やく] も 付[つ]けました。
    meaning:
      en: Yes, I have all the documents. I attached Japanese translations too.
      pt: Sim, estão todos os documentos aqui. Anexei a tradução em japonês também.
  - speaker: madoguchi
    text: …はい、 受理[じゅり] しました。 本日[ほんじつ] から ご夫婦[ふうふ] です。 おめでとう ございます。
    meaning:
      en: …Done, it's accepted. You're married as of today. Congratulations.
      pt: …Pronto, foi aceito. A partir de hoje vocês são casados. Parabéns.
  - speaker: protagonist
    text: え、 これ で 結婚[けっこん]？ 式[しき] は まだ な のに。
    meaning:
      en: What, that's it — we're married? We haven't even had the ceremony.
      pt: Ué, só isso — já estamos casados? E a cerimônia nem aconteceu ainda.
  - speaker: shota
    text: 日本[にほん] で は 届[とど]け を 出[だ]した 日[ひ] が 結婚[けっこん] 記念日[きねんび] な ん だ よ。 戸籍[こせき] に 記録[きろく] される。
    meaning:
      en: In Japan the day you file is your wedding anniversary. It's recorded in the family register.
      pt: No Japão o dia da entrega é o aniversário de casamento. Fica registrado no registro familiar.
  - speaker: protagonist
    text: じゃあ、 今日[きょう] は 特別[とくべつ] な 日[ひ] だ ね。
    meaning:
      en: Then today's a special day.
      pt: Então hoje é um dia especial.
