- type: narrator
  text:
    en: '«〜次第[しだい]» has two meanings. After a verb stem: as soon as — «結果[けっか] が 出[で] 次第[しだい]», as soon as the results are out. After a noun: depending on — «検査[けんさ] の 種類[しゅるい] 次第[しだい]», depending on the
      type of test.'
    pt: '«〜次第[しだい]» tem dois sentidos. Depois do radical do verbo: assim que — «結果[けっか] が 出[で] 次第[しだい]», assim que sair o resultado. Depois de substantivo: dependendo de — «検査[けんさ] の 種類[しゅるい] 次第[しだい]»,
      depende do tipo de exame.'
