steps:
- type: narrator
  text:
    en: A pain that won't go away. The local doctor writes you a referral letter for the university hospital — the wait, the tests, the results. Listen to the conversation; you don't need to understand
      it yet.
    pt: Uma dor que não passa. O médico do bairro escreve uma carta de encaminhamento para o hospital universitário — a espera, os exames, os resultados. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: isha
    text: 念[ねん] の ため、 大学[だいがく] 病院[びょういん] で 詳[くわ]しい 検査[けんさ] を 受[う]けて ください。 紹介状[しょうかいじょう] を 書[か]きます。
    meaning:
      en: To be safe, please get detailed tests at the university hospital. I'll write you a referral.
      pt: Por precaução, faça exames detalhados no hospital universitário. Vou escrever um encaminhamento.
  - speaker: protagonist
    text: 紹介状[しょうかいじょう] が ない と、 行[い]けない ん です か。
    meaning:
      en: Can't I go without a referral?
      pt: Sem encaminhamento não dá para ir?
  - speaker: isha
    text: 行[い]けます が、 紹介状[しょうかいじょう] なし だ と 特別[とくべつ] な 料金[りょうきん] が かかります。 それに、 かかりつけ 医[い] から の 情報[じょうほう] が ある と、 早[はや]い です。
    meaning:
      en: You can, but without one there's a special extra fee. And with information from your family doctor, it's quicker.
      pt: Dá, mas sem encaminhamento cobram uma taxa extra. E com as informações do médico de família, é mais rápido.
  - speaker: protagonist
    text: 待[ま]ち時間[じかん] は 長[なが]い です か。
    meaning:
      en: Is the wait long?
      pt: A espera é longa?
  - speaker: isha
    text: 予約[よやく] を 取[と]って も、 二[に]、 三時間[さんじかん] 待[ま]つ こと も あります。 本[ほん] を 持[も]って 行[い]って ください。
    meaning:
      en: Even with an appointment you may wait two or three hours. Take a book.
      pt: Mesmo com hora marcada, às vezes se espera duas, três horas. Leve um livro.
  - speaker: protagonist
    text: 結果[けっか] は いつ わかります か。
    meaning:
      en: When will I know the results?
      pt: Quando saem os resultados?
  - speaker: isha
    text: 検査[けんさ] の 種類[しゅるい] 次第[しだい] です。 結果[けっか] が 出[で] 次第[しだい]、 専門医[せんもんい] から 説明[せつめい] が あります。
    meaning:
      en: It depends on the type of test. As soon as the results are out, the specialist will explain.
      pt: Depende do tipo de exame. Assim que sair o resultado, o especialista explica.
  - speaker: protagonist
    text: わかりました。 少[すこ]し 安心[あんしん] しました。
    meaning:
      en: I see. I feel a little relieved.
      pt: Entendi. Fiquei um pouco mais tranquila.
