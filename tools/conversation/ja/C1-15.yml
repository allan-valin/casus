- type: narrator
  text:
    en: 'Japan wants patients to see a local clinic first: big hospitals charge an extra fee — several thousand yen — to anyone who comes without a «紹介状[しょうかいじょう]». Waits at university hospitals can be
      long even with an appointment; your «かかりつけ 医[い]» keeps your history and refers you.'
    pt: 'O Japão quer que o paciente passe primeiro na clínica do bairro: hospitais grandes cobram uma taxa extra — alguns milhares de ienes — de quem chega sem «紹介状[しょうかいじょう]». A espera nos hospitais universitários
      pode ser longa mesmo com hora marcada; o seu «かかりつけ 医[い]» guarda o histórico e faz o encaminhamento.'
- type: narrator
  for:
  - pt
  text:
    pt: Parecido com o SUS, que também pede encaminhamento para o especialista. A diferença é que no Japão dá para pular a fila — pagando a taxa extra.
