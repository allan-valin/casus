steps:
- type: narrator
  text:
    en: Aya is writing a paper on why young Japanese marry less. She interviews you, then Kenta's older cousin, who is doing 婚活. Listen to the conversation; you don't need to understand it yet.
    pt: A Aya está escrevendo um trabalho sobre por que os jovens japoneses casam menos. Ela entrevista você, e depois a prima mais velha do Kenta, que está fazendo 婚活. Escute a conversa; ainda não precisa
      entender.
- type: dialogue
  lines:
  - speaker: aya
    text: 日本[にほん] では 独身[どくしん] の 人[ひと] が 増[ふ]えて いる ん だ。 どうして だ と 思[おも]う？
    meaning:
      en: In Japan the number of single people is rising. Why do you think?
      pt: No Japão o número de solteiros está aumentando. Por que você acha?
  - speaker: protagonist
    text: 仕事[しごと] が 忙[いそが]しくて、 出会[であ]い が 少[すく]ない から かな。
    meaning:
      en: Maybe because people are busy at work and have few chances to meet someone.
      pt: Talvez porque o trabalho é corrido e há poucas chances de conhecer alguém.
  - speaker: aya
    text: それ も ある。 アンケート で は、 経済的[けいざいてき] な 不安[ふあん] も 多[おお]い。
    meaning:
      en: That's one reason. In surveys, financial insecurity comes up a lot too.
      pt: Também. Nas pesquisas, a insegurança financeira aparece muito.
  - speaker: aya
    text: いとこ の 真理[まり] さん は 婚活[こんかつ] 中[ちゅう]。 結婚[けっこん] したい ものの、 なかなか 合[あ]う 人[ひと] が いない って。
    meaning:
      en: My cousin Mari is marriage hunting. Although she wants to marry, she says she can't find the right person.
      pt: Minha prima Mari está na busca ativa. Embora queira casar, diz que não acha a pessoa certa.
  - speaker: protagonist
    text: 価値観[かちかん] が 合[あ]う 人[ひと] を 探[さが]す の は 大変[たいへん] だ よね。
    meaning:
      en: Finding someone with the same values is hard.
      pt: Achar alguém com os mesmos valores é difícil.
  - speaker: aya
    text: 自由[じゆう] な 時間[じかん] が 好[す]き で、 結婚[けっこん] しない 人[ひと] も いる。
    meaning:
      en: Some people don't marry because they like their freedom.
      pt: Tem quem não case porque gosta do tempo livre.
  - speaker: protagonist
    text: 少子化[しょうしか] も その せい？
    meaning:
      en: Is the falling birth rate because of that too?
      pt: A queda da natalidade também é por causa disso?
  - speaker: aya
    text: 日本[にほん] で は 結婚[けっこん] して から 子供[こども] を 持[も]つ 人[ひと] が ほとんど だ から、 関係[かんけい] は 深[ふか]い よ。
    meaning:
      en: In Japan almost everyone has children after marrying, so the connection is strong.
      pt: No Japão quase todo mundo só tem filhos depois de casar, então a relação é forte.
