- type: narrator
  text:
    en: Fewer Japanese marry, and later, and because almost all children are born within marriage, this drives the falling birth rate. Long hours, insecure jobs and costs weigh on it. «婚活[こんかつ]» — agencies,
      matchmaking events, apps — grew in response; some cities even run their own.
    pt: Menos japoneses casam, e mais tarde, e como quase todas as crianças nascem dentro do casamento, isso puxa a queda da natalidade. Jornadas longas, empregos instáveis e custos pesam. O «婚活[こんかつ]»
      — agências, eventos de encontros, aplicativos — cresceu em resposta; algumas prefeituras até organizam os seus.
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil muitos filhos nascem fora do casamento e morar junto é comum. No Japão casamento e filhos andam juntos — por isso menos casamentos são logo menos bebês.
