- type: narrator
  text:
    en: '«パワハラ», power harassment, is abuse using a position of power: shouting, humiliation, impossible tasks. Since 2020 (2022 for smaller firms) the law requires companies to prevent it and to have a
      place to report it. Keep dates and details, talk to the help desk or HR, and outside the company to a labour consultation centre.'
    pt: '«パワハラ», assédio moral, é o abuso usando a posição de poder: gritos, humilhação, tarefas impossíveis. Desde 2020 (2022 para empresas menores) a lei obriga as empresas a preveni-lo e a ter um canal
      de denúncia. Anote datas e detalhes, procure o canal da empresa ou o RH e, fora da empresa, um centro de consulta trabalhista.'
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil também há assédio moral, e a Justiça do Trabalho reconhece. No Japão a cultura do «我慢[がまん]» faz muita gente aguentar calada — por isso ouvir de um amigo «não aguenta» ajuda.
