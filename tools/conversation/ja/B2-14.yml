  text:
    en: 'The causative-passive is being made to do something: the causative «やり直[なお]させる», make someone redo, plus the passive — «やり直[なお]させられる», be made to redo. «待[ま]たせられる», «飲[の]ませられる»: you didn''t want
      to, someone made you.'
    pt: 'O causativo-passivo é ser obrigado a fazer algo: o causativo «やり直[なお]させる», fazer alguém refazer, mais a passiva — «やり直[なお]させられる», ser obrigado a refazer. «待[ま]たせられる», «飲[の]ませられる»: você não queria,
      alguém obrigou.'
