steps:
- type: narrator
  text:
    en: Kenta looks exhausted. His new line leader shouts at him in front of everyone and makes him redo work at night. He's been putting up with it. Listen to the conversation; you don't need to understand
      it yet.
    pt: O Kenta está com cara de exausto. O novo líder de linha grita com ele na frente de todos e faz ele refazer o trabalho à noite. Ele está aguentando calado. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 健太[けんた] くん、 大丈夫[だいじょうぶ]？ 顔色[かおいろ] が 悪[わる]い よ。
    meaning:
      en: Kenta, are you okay? You look pale.
      pt: Kenta, tudo bem? Você está pálido.
  - speaker: kenta
    text: 新[あたら]しい 班長[はんちょう] に 毎日[まいにち] みんな の 前[まえ] で 怒鳴[どな]られる ん だ。
    meaning:
      en: The new line leader shouts at me every day in front of everyone.
      pt: O novo líder de linha grita comigo todo dia na frente de todo mundo.
  - speaker: protagonist
    text: それ は ひどい。
    meaning:
      en: That's awful.
      pt: Que horror.
  - speaker: kenta
    text: 昨日[きのう] も 夜[よる] 十時[じゅうじ] まで 仕事[しごと] を やり直[なお]させられた。 でも 我慢[がまん] する しか ない。
    meaning:
      en: Yesterday I was made to redo work until ten at night too. But I've got no choice but to put up with it.
      pt: Ontem também fui obrigado a refazer o trabalho até as dez da noite. Mas não tenho escolha a não ser aguentar.
  - speaker: protagonist
    text: 我慢[がまん] しない ほう が いい。 それ は パワハラ だ と 思[おも]う。
    meaning:
      en: Better not to put up with it. I think that's power harassment.
      pt: Melhor não aguentar. Acho que isso é assédio moral.
  - speaker: kenta
    text: でも 誰[だれ] に 相談[そうだん] すれば いい？
    meaning:
      en: But who should I talk to?
      pt: Mas com quem eu converso?
  - speaker: protagonist
    text: 会社[かいしゃ] に は 相談[そうだん] 窓口[まどぐち] が ある はず。 法律[ほうりつ] で 決[き]まって いる ん だ よ。 まず 記録[きろく] を つけて。
    meaning:
      en: The company should have a help desk. It's required by law. First, keep a record.
      pt: A empresa deve ter um canal de denúncia. É exigido por lei. Primeiro, anote tudo.
  - speaker: kenta
    text: わかった。 一人[ひとり] で 抱[かか]え込[こ]まない よう に する。
    meaning:
      en: Okay. I'll try not to keep it all to myself.
      pt: Tá. Vou tentar não guardar tudo sozinho.
