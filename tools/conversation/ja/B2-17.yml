- type: narrator
  text:
    en: Japanese factories collect «ヒヤリ ハット» — moments that made you go «ヒヤリ» (a chill) or «ハッ» (a gasp) — on the idea that every serious accident is preceded by many near misses. In Hamamatsu many lines
      have Brazilian staff, and interpreters turn safety rules into Portuguese every day.
    pt: As fábricas japonesas coletam «ヒヤリ ハット» — momentos que deram um «ヒヤリ» (calafrio) ou um «ハッ» (susto) — na ideia de que todo acidente grave é precedido por muitos quase acidentes. Em Hamamatsu muitas
      linhas têm brasileiros, e intérpretes passam as regras de segurança para o português todo dia.
- type: narrator
