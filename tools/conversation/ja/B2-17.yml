steps:
- type: narrator
  text:
    en: On the assembly line. Line leader Mori has new safety rules for the Brazilian team; you interpret, turning his words into Portuguese. Listen to the conversation; you don't need to understand it
      yet.
    pt: Na linha de montagem. O líder de linha Mori tem regras novas de segurança para a equipe brasileira; você interpreta, passando as palavras dele para o português. Escute a conversa; ainda não precisa
      entender.
- type: dialogue
  lines:
  - speaker: hanchou
    text: 今日[きょう] から 新[あたら]しい 安全[あんぜん] ルール です。 説明[せつめい] を 通訳[つうやく] して ください。
    meaning:
      en: New safety rules from today. Please interpret my explanation.
      pt: A partir de hoje, regras novas de segurança. Interprete a minha explicação, por favor.
  - speaker: protagonist
    text: はい、 伝[つた]えます。
    meaning:
      en: Yes, I'll pass it on.
      pt: Certo, vou transmitir.
  - speaker: hanchou
    text: 工場[こうじょう] に 入[はい]る 時[とき] は、 必[かなら]ず ヘルメット を かぶる ように 言[い]って ください。
    meaning:
      en: Please tell them to always wear helmets when they enter the factory.
      pt: Diga para eles sempre usarem capacete ao entrar na fábrica.
  - speaker: protagonist
    text: わかりました。 機械[きかい] の こと は？
    meaning:
      en: Understood. What about the machines?
      pt: Entendido. E as máquinas?
  - speaker: hanchou
    text: 動[うご]いて いる 機械[きかい] に は 絶対[ぜったい] 触[さわ]らない ように。 おかしい と 思[おも]ったら、 すぐ 緊急[きんきゅう] 停止[ていし] ボタン。
    meaning:
      en: Never touch a moving machine. If anything seems wrong, the emergency stop button at once.
      pt: Nunca toquem numa máquina em movimento. Se algo parecer estranho, o botão de parada de emergência na hora.
  - speaker: protagonist
    text: 「ヒヤリ ハット」 は 何[なん] と 訳[やく]せば いい でしょう か。
    meaning:
      en: How should I translate “hiyari hatto”?
      pt: Como devo traduzir «hiyari hatto»?
  - speaker: hanchou
    text: 事故[じこ] に なりそう だった こと。 小[ちい]さな こと でも 報告[ほうこく] する ように 言[い]って ください。
    meaning:
      en: Something that almost became an accident. Tell them to report even small ones.
      pt: Uma coisa que quase virou acidente. Diga para eles relatarem até as pequenas.
  - speaker: protagonist
    text: 「quase acidente」 です ね。 全部[ぜんぶ] 伝[つた]えました。 みんな、 安全[あんぜん] 第一[だいいち] で！
    meaning:
      en: “Quase acidente”, then. I've passed it all on. Everyone — safety first!
      pt: «Quase acidente», então. Transmiti tudo. Pessoal — segurança em primeiro lugar!
