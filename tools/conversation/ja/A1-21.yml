steps:
- type: narrator
  text:
    en: Early April. Kenta and Mrs Suzuki take you to see the cherry blossoms in the park at Hamamatsu Castle. Listen to the conversation; you don't need to understand it yet.
    pt: Começo de abril. O Kenta e a senhora Suzuki levam você para ver as cerejeiras no parque do Castelo de Hamamatsu. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: 見[み]て ください。 桜[さくら] が 満開[まんかい] です よ。
    meaning:
      en: Look. The cherry trees are in full bloom.
      pt: Olhe. As cerejeiras estão totalmente floridas.
  - speaker: protagonist
    text: わあ、 きれい！ 木[き] が 全部[ぜんぶ] ピンク です ね。
    meaning:
      en: Wow, beautiful! All the trees are pink.
      pt: Nossa, que lindo! As árvores estão todas cor-de-rosa.
  - speaker: kenta
    text: 会社[かいしゃ] の 人[ひと] が 朝[あさ] から 場所[ばしょ]取[と]り を しました。 あそこ です。
    meaning:
      en: People from the company kept a spot since the morning. Over there.
      pt: O pessoal da empresa guardou lugar desde cedo. Ali.
  - speaker: protagonist
    text: 朝[あさ] から？ すごい です ね。
    meaning:
      en: Since the morning? Wow.
      pt: Desde cedo? Que coisa.
  - speaker: suzuki
    text: お弁当[べんとう] が あります。 食[た]べましょう。
    meaning:
      en: I have packed lunches. Let's eat.
      pt: Tenho marmitas. Vamos comer.
  - speaker: protagonist
    text: いただきます！ 後[あと] で お城[しろ] に 行[い]きましょう か。
    meaning:
      en: Thank you for the food! Shall we go to the castle later?
      pt: Obrigada pela comida! Vamos ao castelo depois?
  - speaker: suzuki
    text: 春[はる] は 花見[はなみ] です よ。 毎年[まいとし] ここ に 来[き]ます。
    meaning:
      en: Spring means hanami. I come here every year.
      pt: Primavera é tempo de ver as cerejeiras. Venho aqui todo ano.
  - speaker: kenta
    text: いい です ね。 その 前[まえ] に、 三人[さんにん] で 写真[しゃしん] を 撮[と]りましょう。
    meaning:
      en: Good idea. Before that, let's take a photo, the three of us.
      pt: Boa. Antes disso, vamos tirar uma foto, nós três.
