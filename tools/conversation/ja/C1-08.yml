- type: narrator
  text:
    en: «車検[しゃけん]» is required every two years (three for a new car the first time) and includes repairs, compulsory insurance and taxes, so it can cost a lot — one reason many Japanese sell older cars
      rather than keep them. Driving with an expired inspection is a serious offence.
    pt: O «車検[しゃけん]» é obrigatório a cada dois anos (três na primeira vez, para carro novo) e inclui consertos, seguro obrigatório e impostos, então pode sair caro — um dos motivos por que muitos japoneses
      vendem carros mais velhos em vez de ficar com eles. Dirigir com a inspeção vencida é infração grave.
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil há o licenciamento anual e, em alguns estados, a vistoria. O shaken japonês é bem mais rigoroso — por isso o mercado de usados japoneses é cheio de carros novinhos.
