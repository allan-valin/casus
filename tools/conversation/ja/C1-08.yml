steps:
- type: narrator
  text:
    en: Your second-hand car's inspection is due. At the garage, the estimate is far more than you expected. Kenta came along to help. Listen to the conversation; you don't need to understand it yet.
    pt: A inspeção do seu carro usado está vencendo. Na oficina, o orçamento é bem maior do que você esperava. O Kenta veio junto para ajudar. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: madoguchi
    text: 車検[しゃけん] の 見積[みつ]もり です。 ブレーキ の 部品[ぶひん] を 替[か]えざる を 得[え]ません。
    meaning:
      en: Here's the inspection estimate. We have no choice but to replace the brake parts.
      pt: Este é o orçamento da inspeção. Não tem jeito, precisamos trocar as peças do freio.
  - speaker: protagonist
    text: え、 こんな に 高[たか]い ん です か。
    meaning:
      en: What, it's this expensive?
      pt: Nossa, tudo isso?
  - speaker: madoguchi
    text: 走行[そうこう] 距離[きょり] が 十万[じゅうまん] キロ を 超[こ]えて います から。 自賠責[じばいせき] 保険[ほけん] と 税金[ぜいきん] も 入[はい]って います。
    meaning:
      en: The mileage is over 100,000 km. Compulsory insurance and tax are included too.
      pt: A quilometragem passou dos 100 mil km. O seguro obrigatório e os impostos também estão incluídos.
  - speaker: kenta
    text: 中古車[ちゅうこしゃ] は 車検[しゃけん] が 高[たか]く なる ん だ よ。
    meaning:
      en: Inspections get expensive with second-hand cars.
      pt: Carro usado tem inspeção cara.
  - speaker: protagonist
    text: 買[か]い替[か]えた ほう が いい か な。
    meaning:
      en: Should I just replace it with another car?
      pt: Será que é melhor trocar de carro?
  - speaker: kenta
    text: でも 今月[こんげつ] 車検[しゃけん] が 切[き]れる なら、 受[う]けざる を 得[え]ない よ。 切[き]れたら 運転[うんてん] できない。
    meaning:
      en: But if the inspection runs out this month, you have no choice but to do it. If it lapses, you can't drive.
      pt: Mas se a inspeção vence este mês, não tem saída. Vencida, não pode dirigir.
  - speaker: protagonist
    text: 仕方[しかた] ない。 点検[てんけん] を お願[ねが]い します。 ブレーキ は 安全[あんぜん] の ため だ から。
    meaning:
      en: No choice. Please do the inspection. The brakes are for safety, after all.
      pt: Fazer o quê. Pode fazer a revisão. Freio é segurança.
  - speaker: madoguchi
    text: かしこまりました。 二年後[にねんご] に また お待[ま]ち して います。
    meaning:
      en: Certainly. We'll see you again in two years.
      pt: Pois não. Esperamos o senhor de novo daqui a dois anos.
