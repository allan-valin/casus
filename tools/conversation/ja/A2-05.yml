steps:
- type: narrator
  text:
    en: You have a cold and a fever. The clinic near the station, then the pharmacy next door. Listen to the conversation; you don't need to understand it yet.
    pt: Você está resfriada e com febre. A clínica perto da estação, depois a farmácia ao lado. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: すみません、 風邪[かぜ] を ひきました。 熱[ねつ] が あります。
    meaning:
      en: Excuse me, I've caught a cold. I have a fever.
      pt: Com licença, peguei um resfriado. Estou com febre.
  - speaker: isha
    text: 保険証[ほけんしょう] を 見[み]せて ください。 喉[のど] は 痛[いた]い です か。
    meaning:
      en: Please show your insurance card. Does your throat hurt?
      pt: Mostre o cartão do seguro, por favor. A garganta dói?
  - speaker: protagonist
    text: はい、 少[すこ]し 痛[いた]い です。
    meaning:
      en: Yes, a little.
      pt: Sim, um pouco.
  - speaker: isha
    text: この 薬[くすり] を 一日[いちにち] 三回[さんかい]、 食後[しょくご] に 飲[の]んで ください。
    meaning:
      en: Take this medicine three times a day, after meals.
      pt: Tome este remédio três vezes ao dia, depois das refeições.
  - speaker: protagonist
    text: 薬[くすり] は ここ で もらえます か。
    meaning:
      en: Can I get the medicine here?
      pt: Pego o remédio aqui?
  - speaker: isha
    text: いいえ、 隣[となり] の 薬局[やっきょく] です。
    meaning:
      en: No, at the pharmacy next door.
      pt: Não, na farmácia ao lado.
  - speaker: protagonist
    text: 仕事[しごと] は 休[やす]んで も いい です か。
    meaning:
      en: May I take time off work?
      pt: Posso faltar ao trabalho?
  - speaker: isha
    text: はい、 三日[みっか] ぐらい 休[やす]んで ください。
    meaning:
      en: Yes, rest about three days.
      pt: Sim, descanse uns três dias.
