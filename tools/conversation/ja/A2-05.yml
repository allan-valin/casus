- type: narrator
  text:
    en: 'Show the «保険証[ほけんしょう]» — or the My Number card that is replacing it — at every visit: the insurance pays 70 %, you pay 30 %. The clinic writes the prescription; the pharmacy next door, «薬局[やっきょく]»,
      hands out the medicine.'
    pt: 'Mostre o «保険証[ほけんしょう]» — ou o cartão My Number, que está substituindo — em toda consulta: o seguro paga 70 %, você paga 30 %. A clínica faz a receita; a farmácia ao lado, «薬局[やっきょく]», entrega o
      remédio.'
- type: narrator
