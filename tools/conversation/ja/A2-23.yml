steps:
- type: narrator
  text:
    en: An autumn festival in the shopping street. Kenta stops at a takoyaki stall; everything smells wonderful. Listen to the conversation; you don't need to understand it yet.
    pt: Um festival de outono na rua comercial. O Kenta para numa barraca de takoyaki; tudo cheira bem. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: いい 匂[にお]い！ あれ、 おいしそう。
    meaning:
      en: Smells good! That looks delicious.
      pt: Que cheiro bom! Aquilo parece gostoso.
  - speaker: kenta
    text: たこ焼[や]き だ よ。 中[なか] に たこ が 入[はい]って いる。
    meaning:
      en: That's takoyaki. There's octopus inside.
      pt: É takoyaki. Tem polvo dentro.
  - speaker: protagonist
    text: たこ？ ちょっと 怖[こわ]そう… でも 食[た]べて みる。
    meaning:
      en: Octopus? Looks a bit scary… but I'll try it.
      pt: Polvo? Parece meio assustador… mas vou provar.
  - speaker: yatai
    text: いらっしゃい！ いくつ？
    meaning:
      en: Welcome! How many?
      pt: Bem-vinda! Quantos?
  - speaker: protagonist
    text: 六個[ろっこ] ください。
    meaning:
      en: Six, please.
      pt: Seis, por favor.
  - speaker: kenta
    text: 熱[あつ]そう だ から、 気[き] を つけて。
    meaning:
      en: They look hot, so careful.
      pt: Parecem quentes, então cuidado.
  - speaker: protagonist
    text: 熱[あつ]っ！ …でも、 おいしい！ あの 焼[や]きそば も おいしそう。
    meaning:
      en: Hot! …But delicious! That yakisoba looks good too.
      pt: Ai, quente! …Mas que delícia! Aquele yakissoba também parece gostoso.
  - speaker: kenta
    text: あっち の クレープ は 甘[あま]そう だ ね。
    meaning:
      en: The crêpes over there look sweet.
      pt: Os crepes ali parecem doces.
