- type: narrator
  text:
    en: 'Legal Japanese is dense with Sino-Japanese words: «原告[げんこく]», «被告[ひこく]», «証拠[しょうこ]», «判決[はんけつ]», «和解[わかい]». Phrases like «原則[げんそく] と して», in principle, hedge carefully. Ordinary wear and tear is
      the landlord''s cost under government guidelines — a common reason deposits are disputed.'
    pt: 'O japonês jurídico é cheio de palavras de origem chinesa: «原告[げんこく]», «被告[ひこく]», «証拠[しょうこ]», «判決[はんけつ]», «和解[わかい]». Expressões como «原則[げんそく] と して», em princípio, ressalvam com cuidado. O desgaste
      do uso normal fica a cargo do proprietário segundo as diretrizes do governo — motivo comum de disputa pela caução.'
- type: narrator
  text:
    en: Small-claims court handles money claims up to 600,000 yen, usually in a single hearing, without a lawyer. The «法[ほう] テラス» centres give free or cheap legal advice, with interpreters on request.
    pt: O juizado de pequenas causas cuida de cobranças de até 600 mil ienes, geralmente numa audiência só, sem advogado. Os centros «法[ほう] テラス» dão orientação jurídica gratuita ou barata, com intérprete
      se pedir.
- type: narrator
  for:
  - pt
  text:
    pt: 'Lembra o Juizado Especial Cível no Brasil: causa pequena, rápido, sem advogado. E a regra de ouro vale nos dois países — fotografe tudo ao entrar no imóvel.'
