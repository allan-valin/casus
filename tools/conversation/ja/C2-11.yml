steps:
- type: narrator
  text:
    en: You and Shota moved out, but the landlord kept the whole deposit for “cleaning”. At the public legal-support centre, a lawyer explains small-claims court. Listen to the conversation; you don't need
      to understand it yet.
    pt: Você e o Shota saíram do apartamento, mas o proprietário ficou com toda a caução para «limpeza». No centro público de apoio jurídico, um advogado explica o juizado de pequenas causas. Escute a conversa;
      ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 敷金[しききん] が 全額[ぜんがく] 戻[もど]って きません でした。 クリーニング 代[だい] だ そう です。
    meaning:
      en: We didn't get any of the deposit back. They say it's for cleaning.
      pt: Não devolveram nada da caução. Dizem que é para a limpeza.
  - speaker: bengoshi
    text: 通常[つうじょう] の 使用[しよう] で できた 汚[よご]れ は、 借主[かりぬし] が 払[はら]う 必要[ひつよう] は ありません。
    meaning:
      en: Dirt from normal wear and tear doesn't have to be paid by the tenant.
      pt: A sujeira do uso normal não precisa ser paga pelo inquilino.
  - speaker: protagonist
    text: 証拠[しょうこ] は 入居[にゅうきょ] の 時[とき] の 写真[しゃしん] が あります。
    meaning:
      en: As evidence, we have photos from when we moved in.
      pt: Como prova, temos fotos de quando entramos.
  - speaker: bengoshi
    text: それ は 強[つよ]い 証拠[しょうこ] です。 六十万円[ろくじゅうまんえん] 以下[いか] なら、 少額[しょうがく] 訴訟[そしょう] が 使[つか]えます。
    meaning:
      en: That's strong evidence. If it's 600,000 yen or less, you can use small-claims court.
      pt: Essa é uma prova forte. Se o valor for até 600 mil ienes, dá para usar o juizado de pequenas causas.
  - speaker: shota
    text: 弁護士[べんごし] を 頼[たの]まない と だめ です か。
    meaning:
      en: Do we have to hire a lawyer?
      pt: Precisamos contratar advogado?
  - speaker: bengoshi
    text: いいえ、 本人[ほんにん] だけ で できます。 原則[げんそく] と して 一日[いちにち] で 終[お]わり、 その 日[ひ] に 判決[はんけつ] が 出[で]ます。
    meaning:
      en: No, you can do it yourselves. In principle it's over in one day, with the ruling that same day.
      pt: Não, vocês mesmos podem entrar. Em princípio termina num dia, com a sentença no mesmo dia.
  - speaker: protagonist
    text: 和解[わかい] に なる こと も あります か。
    meaning:
      en: Can it end in a settlement?
      pt: Pode terminar em acordo?
  - speaker: bengoshi
    text: 多[おお]い です よ。 被告[ひこく] の 大家[おおや] さん も、 裁判[さいばん] より 和解[わかい] を 選[えら]ぶ こと が よく あります。
    meaning:
      en: Often. Landlords who are sued often choose to settle rather than go to trial.
      pt: Muitas vezes. O proprietário processado muitas vezes prefere um acordo a ir a julgamento.
