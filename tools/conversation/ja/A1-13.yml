steps:
- type: narrator
  text:
    en: Saturday trip to Nagoya. At Hamamatsu station you ask a station attendant. Listen to the conversation; you don't need to understand it yet.
    pt: Passeio de sábado a Nagoya. Na estação de Hamamatsu você pergunta a um funcionário. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: すみません。 名古屋[なごや] に 行[い]きます。 何番線[なんばんせん] です か。
    meaning:
      en: Excuse me. I'm going to Nagoya. Which platform?
      pt: Com licença. Vou para Nagoya. Qual plataforma?
  - speaker: ekiin
    text: 一番線[いちばんせん] です。 豊橋[とよはし] で 乗[の]り換[か]え です。
    meaning:
      en: Platform one. You change at Toyohashi.
      pt: Plataforma um. Baldeação em Toyohashi.
  - speaker: protagonist
    text: 乗[の]り換[か]え？ 何番線[なんばんせん] で？
    meaning:
      en: Change? On which platform?
      pt: Baldeação? Em que plataforma?
  - speaker: ekiin
    text: 豊橋[とよはし] 駅[えき] で 聞[き]いて ください。
    meaning:
      en: Please ask at Toyohashi station.
      pt: Pergunte na estação de Toyohashi.
  - speaker: protagonist
    text: 切符[きっぷ] は いくら です か。
    meaning:
      en: How much is the ticket?
      pt: Quanto é a passagem?
  - speaker: ekiin
    text: 千[せん] 三百[さんびゃく] 二十[にじゅう] 円[えん] です。 カード でも 乗[の]れます。
    meaning:
      en: 1,320 yen. You can also ride with a card.
      pt: 1.320 ienes. Também dá para usar o cartão.
  - speaker: protagonist
    text: 次[つぎ] の 電車[でんしゃ] は 何時[なんじ] です か。
    meaning:
      en: What time is the next train?
      pt: A que horas é o próximo trem?
  - speaker: ekiin
    text: 十時[じゅうじ] 五分[ごふん] です。
    meaning:
      en: Five past ten.
      pt: Dez e cinco.
