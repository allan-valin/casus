steps:
- type: narrator
  text:
    en: The taiko group drums by the course of the Hamanako marathon. Lucas is running his first full marathon. You meet him at the finish — eventually. Listen to the conversation; you don't need to understand
      it yet.
    pt: O grupo de taikô toca na beira do percurso da maratona do lago Hamana. O Lucas corre a sua primeira maratona completa. Você o encontra na chegada — finalmente. Escute a conversa; ainda não precisa
      entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: ルーカス、 頑張[がんば]れ！ あと 五[ご] キロ！
    meaning:
      en: Lucas, come on! Five kilometres to go!
      pt: Lucas, força! Faltam cinco quilômetros!
  - speaker: lucas
    text: もう 限界[げんかい]… 太鼓[たいこ] の 音[おと] で 元気[げんき] が 出[で]た！
    meaning:
      en: I'm at my limit… the taiko drums gave me energy!
      pt: Estou no limite… o som do taikô me deu força!
  - speaker: kenta
    text: 給水[きゅうすい] で 水[みず] を 取[と]って ね！
    meaning:
      en: Grab water at the water station!
      pt: Pega água no posto!
  - speaker: protagonist
    text: …ゴール 地点[ちてん] で 一時間[いちじかん] 待[ま]った けど、 ルーカス が 来[こ]ない。
    meaning:
      en: …I waited an hour at the finish line, but Lucas hasn't come.
      pt: …Esperei uma hora na chegada, mas o Lucas não apareceu.
  - speaker: lucas
    text: ごめん！ 足[あし] が つって、 歩[ある]いた あげく、 ゴール の 場所[ばしょ] も 間違[まちが]えた。
    meaning:
      en: Sorry! I got a cramp, walked for ages, and in the end even went to the wrong finish.
      pt: Desculpa! Deu cãibra, andei um tempão e no fim ainda errei o lugar da chegada.
  - speaker: protagonist
    text: でも 完走[かんそう] した ん だ ね！ おめでとう！
    meaning:
      en: But you finished! Congratulations!
      pt: Mas você completou! Parabéns!
  - speaker: lucas
    text: うん。 明日[あした] は 筋肉痛[きんにくつう] で 歩[ある]けない かも。
    meaning:
      en: Yeah. Tomorrow I might not be able to walk from the muscle ache.
      pt: É. Amanhã talvez nem consiga andar de tanta dor muscular.
  - speaker: kenta
    text: 来年[らいねん] は 僕[ぼく]たち も 走[はし]ろう か。
    meaning:
      en: Shall we run too next year?
      pt: Ano que vem a gente também corre?
