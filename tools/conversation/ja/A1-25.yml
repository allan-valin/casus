- type: narrator
  text:
    en: 'To ask permission, take the «て» form of the verb and add «も いい です か» — is it fine even if I…: «食[た]べて も いい です か», may I eat? «使[つか]って も いい です か», may I use it? You heard «すすって も いい» with the ramen.'
    pt: 'Para pedir licença, use a forma «て» do verbo e acrescente «も いい です か» — tudo bem se eu…: «食[た]べて も いい です か», posso comer? «使[つか]って も いい です か», posso usar? Você ouviu «すすって も いい» no lámen.'
