- type: narrator
  text:
    en: 'Chopsticks: never stand them upright in the rice and never pass food from chopsticks to chopsticks — both belong to funerals. Don''t point with them. When praised, answer «まだ まだ です», not yet.'
    pt: 'Hashi: nunca deixe em pé espetado no arroz e nunca passe comida de hashi para hashi — as duas coisas são de funeral. Não aponte com eles. Quando elogiarem, responda «まだ まだ です», ainda não.'
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil, aceitar a segunda porção é elogio à cozinheira, e recusar pode parecer desfeita. No Japão também se pode pedir «おかわり», mas deixar o prato limpo e dizer «ごちそうさま» já é o maior elogio.
