steps:
- type: narrator
  text:
    en: Mrs Suzuki invites you to dinner. Grilled fish, rice, soup — and chopsticks. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Suzuki convida você para jantar. Peixe grelhado, arroz, sopa — e hashi. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: どうぞ。 夕飯[ゆうはん] です よ。
    meaning:
      en: Here you are. Dinner.
      pt: Pode servir-se. O jantar.
  - speaker: protagonist
    text: わあ、 魚[さかな] です ね。 いただきます！
    meaning:
      en: Oh, fish! Itadakimasu!
      pt: Nossa, peixe! Itadakimasu!
  - speaker: suzuki
    text: お箸[はし]、 大丈夫[だいじょうぶ] です か。 フォーク も あります よ。
    meaning:
      en: Are chopsticks okay? There's a fork too.
      pt: Consegue com o hashi? Também tem garfo.
  - speaker: protagonist
    text: お箸[はし] で 食[た]べたい です。 練習[れんしゅう] します。
    meaning:
      en: I want to eat with chopsticks. I'll practise.
      pt: Quero comer de hashi. Vou treinar.
  - speaker: suzuki
    text: あら、 上手[じょうず] です ね。
    meaning:
      en: Oh, you're good at it.
      pt: Olha, você é boa nisso.
  - speaker: protagonist
    text: まだ まだ です。 この お醤油[しょうゆ]、 使[つか]って も いい です か。
    meaning:
      en: Not yet. May I use this soy sauce?
      pt: Ainda não. Posso usar este shoyu?
  - speaker: suzuki
    text: どうぞ、 どうぞ。 ご飯[はん] の おかわり は？
    meaning:
      en: Go ahead. More rice?
      pt: Fique à vontade. Quer mais arroz?
  - speaker: protagonist
    text: お腹[なか] いっぱい です。 ごちそうさま でした！
    meaning:
      en: I'm full. Thank you for the meal!
      pt: Estou satisfeita. Obrigada pela refeição!
- type: narrator
  text:
    en: Before eating, hands together, you say «いただきます» — I humbly receive. After, «ごちそうさま でした» — it was a feast. Both thank the cook and the food itself; you say them even when eating alone.
    pt: Antes de comer, mãos juntas, se diz «いただきます» — recebo com gratidão. Depois, «ごちそうさま でした» — foi um banquete. As duas agradecem a quem cozinhou e à própria comida; diz-se até comendo sozinho.
