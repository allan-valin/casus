steps:
- type: narrator
  text:
    en: The taiko group turns twenty. As the new leader you open the anniversary concert; Ōno-sensei, retired, sits in the front row. Listen to the conversation; you don't need to understand it yet.
    pt: O grupo de taikô faz vinte anos. Como novo líder, você abre o concerto de aniversário; a professora Ōno, aposentada, está na primeira fila. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 皆様[みなさま]、 本日[ほんじつ] は お忙[いそが]しい 中[なか]、 ご来場[らいじょう] いただき、 誠[まこと] に ありがとう ございます。
    meaning:
      en: Ladies and gentlemen, thank you so much for coming today despite your busy schedules.
      pt: Senhoras e senhores, muito obrigado por virem hoje, apesar da agenda corrida.
  - speaker: protagonist
    text: おかげ さま で、 私[わたし]たち の 太鼓[たいこ] グループ は 創立[そうりつ] 二十[にじゅう] 周年[しゅうねん] を 迎[むか]えました。
    meaning:
      en: Thanks to you, our taiko group has reached its twentieth anniversary.
      pt: Graças a vocês, o nosso grupo de taikô chega ao vigésimo aniversário de fundação.
  - speaker: protagonist
    text: 歴代[れきだい] の 会員[かいいん]、 そして 大野[おおの] 先生[せんせい] に、 心[こころ] より 御礼[おんれい] 申[もう]し上[あ]げます。
    meaning:
      en: To all the members across the years, and to Ōno-sensei, we offer our heartfelt thanks.
      pt: A todos os membros de todas as gerações, e à professora Ōno, agradecemos de coração.
  - speaker: taiko-sensei
    text: みんな、 立派[りっぱ] に なった わ ね。
    meaning:
      en: You've all grown so much.
      pt: Como vocês cresceram.
  - speaker: protagonist
    text: 今日[きょう] は 子供[こども] から 八十代[はちじゅうだい] まで、 三[みっ]つ の 世代[せだい] が 一緒[いっしょ] に 叩[たた]きます。
    meaning:
      en: Today three generations, from children to people in their eighties, drum together.
      pt: Hoje três gerações, das crianças aos oitentões, tocam juntas.
  - speaker: kenta
    text: 陽菜[ひな] も 初[はじ]めて の 本番[ほんばん] です！
    meaning:
      en: It's Hina's first performance too!
      pt: É a primeira apresentação da Hina também!
  - speaker: protagonist
    text: 記念[きねん] の 演奏[えんそう]、 最後[さいご] まで ごゆっくり お楽[たの]しみ ください。
    meaning:
      en: Please enjoy our anniversary performance to the very end.
      pt: Aproveitem à vontade a nossa apresentação comemorativa até o fim.
  - speaker: taiko-sensei
    text: 立派[りっぱ] な 挨拶[あいさつ] でした よ。
    meaning:
      en: That was a fine speech.
      pt: Foi um belo discurso.
