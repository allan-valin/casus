- type: narrator
  text:
    en: '«本音[ほんね]» and «建前[たてまえ]»: what you really think and what you say to keep harmony. In business «検討[けんとう] します», «前向[まえむ]き に 考[かんが]えます» or «また 今度[こんど]» often mean no. Watch the face, the pause, the
      «ちょっと…» — and if you must know, ask a colleague, not the client.'
    pt: '«本音[ほんね]» e «建前[たてまえ]»: o que se pensa de verdade e o que se diz para manter a harmonia. Nos negócios, «検討[けんとう] します», «前向[まえむ]き に 考[かんが]えます» ou «また 今度[こんど]» muitas vezes querem dizer não. Repare
      no rosto, na pausa, no «ちょっと…» — e se precisar saber, pergunte a um colega, não ao cliente.'
- type: narrator
  for:
  - pt
  text:
    pt: O brasileiro também enrola — «vamos ver», «te ligo» —, mas costuma ser mais claro no trabalho. Com japoneses, trate «vamos estudar» como um não educado até prova em contrário.
