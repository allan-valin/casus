- type: narrator
  text:
    en: '«よう だ» is it seems — your guess from what you see: «困[こま]った よう でした», he looked troubled. Nouns and «な» words take «の» or «な»: «断[ことわ]り の よう です», it seems to be a refusal; «だめ な よう です», it seems
      it''s a no.'
    pt: '«よう だ» é parece — seu palpite pelo que você vê: «困[こま]った よう でした», parecia sem jeito. Substantivos e palavras com «な» levam «の» ou «な»: «断[ことわ]り の よう です», parece uma recusa; «だめ な よう です», parece
      que não vai dar.'
