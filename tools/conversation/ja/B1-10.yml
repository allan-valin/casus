steps:
- type: narrator
  text:
    en: You proposed a new delivery schedule to Mr Yamada, the supplier. He smiled and said he'd consider it. You're pleased — until Chief Sato explains. Listen to the conversation; you don't need to understand
      it yet.
    pt: Você propôs um novo cronograma de entregas ao senhor Yamada, o fornecedor. Ele sorriu e disse que ia considerar. Você ficou contente — até a chefe Sato explicar. Escute a conversa; ainda não precisa
      entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 山田[やまだ] さん は「検討[けんとう] します」 と 言[い]いました。 よかった！
    meaning:
      en: Mr Yamada said “we'll consider it”. Great!
      pt: O senhor Yamada disse «vamos estudar». Que bom!
  - speaker: sato
    text: うーん… それ は 断[ことわ]り の よう です ね。
    meaning:
      en: Hmm… that sounds like a refusal.
      pt: Hum… isso parece uma recusa.
  - speaker: protagonist
    text: え？ はっきり「いいえ」 と 言[い]いません でした よ。
    meaning:
      en: What? He didn't clearly say “no”.
      pt: Como? Ele não disse «não» com clareza.
  - speaker: sato
    text: 日本[にほん] で は、 はっきり 断[ことわ]る の は 失礼[しつれい] な ので。 表情[ひょうじょう] は どう でした か。
    meaning:
      en: In Japan refusing directly is rude. What was his expression like?
      pt: No Japão recusar diretamente é falta de educação. Qual era a expressão dele?
  - speaker: protagonist
    text: 笑[わら]って いました けど、 ちょっと 困[こま]った よう でした。
    meaning:
      en: He was smiling, but he looked a bit troubled.
      pt: Estava sorrindo, mas parecia meio sem jeito.
  - speaker: sato
    text: それ が 本音[ほんね] です。 言葉[ことば] は 建前[たてまえ]。
    meaning:
      en: That's his real feeling. The words are the polite surface.
      pt: Esse é o que ele pensa de verdade. As palavras são a fachada educada.
  - speaker: protagonist
    text: 空気[くうき] を 読[よ]む の は 難[むずか]しい です ね。
    meaning:
      en: Reading the atmosphere is hard.
      pt: Ler o clima é difícil.
  - speaker: sato
    text: 慣[な]れます よ。 また 今度[こんど]、 別[べつ] の 案[あん] を 出[だ]しましょう。
    meaning:
      en: You'll get used to it. Let's offer another idea another time.
      pt: Você se acostuma. Outra hora a gente apresenta outra proposta.
