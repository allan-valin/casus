steps:
- type: narrator
  text:
    en: 'You sign up for an evening course at the city''s lifelong-learning centre: “Reading Japanese society”, taught by Ishida-sensei, a retired newspaper editor. First homework: an essay in written style.
      Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Você se inscreve num curso noturno no centro de educação continuada da prefeitura: «Lendo a sociedade japonesa», com o professor Ishida, editor de jornal aposentado. Primeira lição de casa: uma
      redação em estilo escrito. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: kouza-sensei
    text: 皆[みな]さん、 この 講座[こうざ] を 受講[じゅこう] して くださって、 ありがとう ございます。
    meaning:
      en: Everyone, thank you for taking this course.
      pt: Pessoal, obrigado por se inscreverem neste curso.
  - speaker: kouza-sensei
    text: 最初[さいしょ] の 課題[かだい] は 作文[さくぶん] です。 テーマ は「私[わたし] から 見[み]た 日本[にほん] 社会[しゃかい]」。
    meaning:
      en: 'The first assignment is an essay. The theme: “Japanese society as I see it”.'
      pt: 'A primeira tarefa é uma redação. Tema: «A sociedade japonesa vista por mim».'
  - speaker: protagonist
    text: 先生[せんせい]、 作文[さくぶん] は です・ます で 書[か]いて も いい です か。
    meaning:
      en: Sensei, may I write the essay in desu/masu?
      pt: Professor, posso escrever a redação com desu e masu?
  - speaker: kouza-sensei
    text: いいえ、 作文[さくぶん] は「で ある」 で 書[か]いて ください。「日本[にほん] は 島国[しまぐに] で ある」 の よう に。
    meaning:
      en: No, write the essay in “de aru”. Like “Japan is an island nation”.
      pt: Não, escreva com «de aru». Como em «O Japão é um país insular».
  - speaker: protagonist
    text: 新聞[しんぶん] の 文章[ぶんしょう] と 同[おな]じ です ね。
    meaning:
      en: Like newspaper writing, then.
      pt: Como o texto de jornal, então.
  - speaker: kouza-sensei
    text: その 通[とお]り。 書[か]き出[だ]し が 大事[だいじ] で ある。 …と、 書[か]きます。
    meaning:
      en: Exactly. “The opening is important.” …That's how you write it.
      pt: Exatamente. «A abertura é importante.» …É assim que se escreve.
  - speaker: protagonist
    text: 締[し]め切[き]り は いつ です か。
    meaning:
      en: When's the deadline?
      pt: Qual é o prazo?
  - speaker: kouza-sensei
    text: 来週[らいしゅう] の 講座[こうざ] まで に。 受講生[じゅこうせい] の 皆[みな]さん の 文章[ぶんしょう] を 楽[たの]しみ に して います。
    meaning:
      en: By next week's class. I look forward to all your writing.
      pt: Até a aula da semana que vem. Estou ansioso para ler os textos de todos.
