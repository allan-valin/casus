- type: narrator
  text:
    en: Most Japanese children attend free public schools, but exams decide the route to high school and university, and many go to «塾[じゅく]» from primary age. In big cities some families even prepare preschoolers
      for private-school «お受験[じゅけん]». The pressure is a long-running social debate.
    pt: A maioria das crianças japonesas estuda em escola pública gratuita, mas as provas decidem o caminho até o ensino médio e a universidade, e muitas frequentam «塾[じゅく]» desde o primário. Nas cidades
      grandes algumas famílias preparam até crianças de pré-escola para a «お受験[じゅけん]» das escolas particulares. A pressão é um debate social antigo.
