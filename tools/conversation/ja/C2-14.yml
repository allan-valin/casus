- type: narrator
  text:
    en: '«〜もの なら» is if — for something hard or unlikely: «できる もの なら», if it were possible. With the volitional it''s a warning: «遅刻[ちこく] しよう もの なら、 怒[おこ]られる», if you dare be late, you''ll be scolded.'
    pt: '«〜もの なら» é se — para algo difícil ou improvável: «できる もの なら», se fosse possível. Com o volitivo vira aviso: «遅刻[ちこく] しよう もの なら、 怒[おこ]られる», se ousar chegar atrasado, leva bronca.'
