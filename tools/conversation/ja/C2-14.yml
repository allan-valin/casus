steps:
- type: narrator
  text:
    en: Kenta and Misaki are wondering whether to send Hina, now five, to cram school for a private primary-school entrance exam. They ask what you and Yui think. Listen to the conversation; you don't need
      to understand it yet.
    pt: O Kenta e a Misaki estão pensando se mandam a Hina, agora com cinco anos, para um cursinho de preparação para a prova de uma escola primária particular. Eles perguntam o que você e a Yui acham.
      Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: misaki
    text: 陽菜[ひな] を 私立[しりつ] の 小学校[しょうがっこう] に 入[い]れたい ん だ けど、 その ため に は 塾[じゅく] が 必要[ひつよう] な の。
    meaning:
      en: We'd like to get Hina into a private primary school, but for that she needs cram school.
      pt: Queremos colocar a Hina numa escola primária particular, mas para isso ela precisa de cursinho.
  - speaker: protagonist
    text: 五歳[ごさい] で 塾[じゅく]？ お受験[じゅけん] って 大変[たいへん] だ ね。
    meaning:
      en: Cram school at five? These child entrance exams are tough.
      pt: Cursinho aos cinco anos? Essa prova infantil é puxada.
  - speaker: kenta
    text: 東京[とうきょう] ほど じゃ ない けど、 浜松[はままつ] でも 競争[きょうそう] が ある ん だ。
    meaning:
      en: Not as bad as Tokyo, but there's competition in Hamamatsu too.
      pt: Não é tanto quanto em Tóquio, mas em Hamamatsu também tem competição.
  - speaker: yui
    text: 将来[しょうらい] の ため も 大事[だいじ] だ けど、 今[いま] は のびのび 遊[あそ]ぶ 時期[じき] じゃ ない？
    meaning:
      en: The future matters, but isn't now the time for her to play freely?
      pt: O futuro importa, mas agora não é a fase de brincar à vontade?
  - speaker: misaki
    text: わかる。 私[わたし] も 教育[きょういく] ママ に は なりたく ない。
    meaning:
      en: I know. I don't want to be a pushy education mum either.
      pt: Eu sei. Também não quero virar mãe obcecada com estudos.
  - speaker: protagonist
    text: できる もの なら、 本人[ほんにん] に 聞[き]いて みたら？ 陽菜[ひな] ちゃん は 何[なに] が したい か。
    meaning:
      en: If you can, why not ask her? What Hina herself wants to do.
      pt: Se der, por que não perguntam a ela? O que a Hina quer fazer.
  - speaker: kenta
    text: 陽菜[ひな] は「太鼓[たいこ] が したい」 って 言[い]って た な。
    meaning:
      en: Hina said she wants to do taiko.
      pt: A Hina disse que quer tocar taikô.
  - speaker: yui
    text: 公立[こうりつ] で も 太鼓[たいこ] は できる よ。 家族[かぞく] で 決[き]めて ね。
    meaning:
      en: She can do taiko at a public school too. Decide as a family.
      pt: Dá para fazer taikô na escola pública também. Decidam em família.
