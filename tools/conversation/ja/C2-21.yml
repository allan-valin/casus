steps:
- type: narrator
  text:
    en: Lucas's snack shop is losing money, and he's talking about closing it and going back to Brazil. You sit with him after closing time. Listen to the conversation; you don't need to understand it yet.
    pt: A lanchonete do Lucas está dando prejuízo, e ele fala em fechar e voltar para o Brasil. Você senta com ele depois que a loja fecha. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: lucas
    text: 三[さん] か月[げつ] 赤字[あかじ] な ん だ。 もう 店[みせ] を 閉[し]めて、 ブラジル に 帰[かえ]ろう か な。
    meaning:
      en: Three months in the red. Maybe I'll close the shop and go back to Brazil.
      pt: Três meses no vermelho. Acho que vou fechar a loja e voltar para o Brasil.
  - speaker: protagonist
    text: そう だった ん だ… つらかった ね。
    meaning:
      en: So that's how it is… That must have been hard.
      pt: Então era isso… Deve ter sido difícil.
  - speaker: lucas
    text: みんな に 応援[おうえん] して もらった のに、 情[なさ]けない。
    meaning:
      en: Everyone supported me, and I feel pathetic.
      pt: Todo mundo me apoiou, e eu me sinto um fracasso.
  - speaker: protagonist
    text: 情[なさ]けなく ない よ。 よく 頑張[がんば]った。 無理[むり] に 話[はな]さなくて いい から、 そば に いる よ。
    meaning:
      en: You're not pathetic. You did really well. You don't have to talk; I'm here.
      pt: Não é fracasso. Você se esforçou muito. Não precisa falar; estou aqui com você.
  - speaker: lucas
    text: …ありがとう。 誰[だれ] に も 言[い]えなかった。
    meaning:
      en: …Thank you. I couldn't tell anyone.
      pt: …Obrigado. Não consegui contar para ninguém.
  - speaker: protagonist
    text: 一人[ひとり] で 抱[かか]えないで。 健太[けんた] くん も マリア さん も、 支[ささ]え に なりたい と 思[おも]って いる。
    meaning:
      en: Don't carry it alone. Kenta and Maria want to support you too.
      pt: Não carregue isso sozinho. O Kenta e a Maria também querem te apoiar.
  - speaker: lucas
    text: 店[みせ] を 続[つづ]ける 方法[ほうほう]、 一緒[いっしょ] に 考[かんが]えて くれる？
    meaning:
      en: Will you help me think of a way to keep the shop going?
      pt: Você me ajuda a pensar num jeito de manter a loja?
  - speaker: protagonist
    text: もちろん。 いつ でも 呼[よ]んで。
    meaning:
      en: Of course. Call me any time.
      pt: Claro. Me chama quando precisar.
