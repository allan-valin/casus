- type: narrator
  text:
    en: 'Comfort in Japanese leans on presence more than advice: «つらかった ね» acknowledges the pain, «よく 頑張[がんば]った» honours the effort — not «頑張[がんば]って», which can pressure someone who is already worn out
      — and «そば に いる よ» offers company. Silence is allowed.'
    pt: 'O consolo em japonês se apoia mais na presença que no conselho: «つらかった ね» reconhece a dor, «よく 頑張[がんば]った» honra o esforço — e não «頑張[がんば]って», que pode pressionar quem já está esgotado — e «そば
      に いる よ» oferece companhia. O silêncio é permitido.'
- type: narrator
  for:
  - pt
  text:
    pt: O brasileiro tende a dar força com «vai dar tudo certo!». Em japonês, às vezes ajuda mais dizer «foi difícil, né» e só ficar junto.
