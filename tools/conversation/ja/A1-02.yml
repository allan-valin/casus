steps:
- type: narrator
  text:
    en: Mrs Suzuki shows you the flat. At the door there is a low step — the genkan. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Suzuki mostra o apartamento. Na porta há um degrau baixo — o genkan. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: どうぞ。 ここ は 玄関[げんかん] です。
    meaning:
      en: Please come in. This is the genkan.
      pt: Pode entrar. Aqui é o genkan.
  - speaker: protagonist
    text: 失礼[しつれい] します。
    meaning:
      en: Excuse me.
      pt: Com licença.
  - speaker: suzuki
    text: あ、 靴[くつ]！ 靴[くつ] は ここ です。
    meaning:
      en: Oh, your shoes! Shoes stay here.
      pt: Ah, os sapatos! Os sapatos ficam aqui.
  - speaker: protagonist
    text: すみません。 これ は 何[なん] です か。
    meaning:
      en: Sorry. What is this?
      pt: Desculpe. O que é isto?
  - speaker: suzuki
    text: それ は スリッパ です。 どうぞ。
    meaning:
      en: Those are slippers. Here you are.
      pt: Isso são chinelos. Aqui estão.
  - speaker: protagonist
    text: ありがとう ございます。
    meaning:
      en: Thank you.
      pt: Obrigado.
  - speaker: suzuki
    text: これ は トイレ の スリッパ です。
    meaning:
      en: These are the toilet slippers.
      pt: Estes são os chinelos do banheiro.
  - speaker: protagonist
    text: トイレ の スリッパ？ はい、 わかりました。
    meaning:
      en: Toilet slippers? Yes, I see.
      pt: Chinelos do banheiro? Sim, entendi.
- type: narrator
  text:
    en: When you enter someone's home, say «失礼[しつれい] します» — literally 'I commit a rudeness'.
    pt: Ao entrar na casa de alguém, diga «失礼[しつれい] します» — literalmente 'cometo uma falta de educação'.
