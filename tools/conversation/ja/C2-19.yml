- type: narrator
  text:
    en: 'Asking a doctor for time without sounding distrustful uses the humble causative: «考[かんが]えさせて いただけます か» — may I be allowed to think about it? A second opinion is a recognised right; the first hospital
      provides the records, «診療[しんりょう] 情報[じょうほう] 提供[ていきょう] 書[しょ]», and the patient usually pays for that consultation privately.'
    pt: 'Pedir tempo ao médico sem parecer desconfiança usa o causativo humilde: «考[かんが]えさせて いただけます か» — posso ter um tempo para pensar? A segunda opinião é um direito reconhecido; o primeiro hospital fornece
      os registros, «診療[しんりょう] 情報[じょうほう] 提供[ていきょう] 書[しょ]», e o paciente geralmente paga essa consulta à parte.'
