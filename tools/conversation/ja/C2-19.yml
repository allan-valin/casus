steps:
- type: narrator
  text:
    en: The university hospital recommends surgery for your knee. Before deciding, you ask your family doctor about a second opinion. Listen to the conversation; you don't need to understand it yet.
    pt: O hospital universitário recomenda cirurgia no seu joelho. Antes de decidir, você pergunta ao médico de família sobre uma segunda opinião. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 大学[だいがく] 病院[びょういん] で、 膝[ひざ] の 手術[しゅじゅつ] を 勧[すす]められました。
    meaning:
      en: At the university hospital they recommended knee surgery.
      pt: No hospital universitário me recomendaram uma cirurgia no joelho.
  - speaker: isha
    text: 診断[しんだん] は 何[なん] と 言[い]われました か。
    meaning:
      en: What was the diagnosis they gave you?
      pt: Qual foi o diagnóstico que deram?
  - speaker: protagonist
    text: 半月板[はんげつばん] の 損傷[そんしょう] だ そう です。 でも、 手術[しゅじゅつ] 以外[いがい] の 治療[ちりょう] は ない の か と 思[おも]って。
    meaning:
      en: Meniscus damage, they say. But I wondered whether there's no treatment other than surgery.
      pt: Lesão no menisco, disseram. Mas fiquei pensando se não existe tratamento além da cirurgia.
  - speaker: isha
    text: セカンド オピニオン を 受[う]ける の は、 患者[かんじゃ] の 権利[けんり] です よ。
    meaning:
      en: Getting a second opinion is the patient's right.
      pt: Pedir segunda opinião é direito do paciente.
  - speaker: protagonist
    text: 失礼[しつれい] に なりません か。 先生[せんせい] を 信[しん]じて いない よう で。
    meaning:
      en: Isn't it rude? As if I don't trust the doctor.
      pt: Não é falta de educação? Parece que não confio no médico.
  - speaker: isha
    text: いいえ。 大学[だいがく] 病院[びょういん] に 所見[しょけん] と 資料[しりょう] を 出[だ]して もらいましょう。 ほか の 方法[ほうほう]、 例[たと]えば リハビリ の 可能性[かのうせい] も 聞[き]けます。
    meaning:
      en: Not at all. Let's ask the university hospital to send the findings and records. You can also ask about other options, like physio.
      pt: De jeito nenhum. Vamos pedir ao hospital universitário que envie o parecer e os exames. Você pode perguntar também sobre outras opções, como fisioterapia.
  - speaker: protagonist
    text: では、 少[すこ]し 考[かんが]えさせて いただけます か と 大学[だいがく] 病院[びょういん] に 伝[つた]えます。
    meaning:
      en: Then I'll tell the university hospital, “May I take a little time to think?”
      pt: 'Então vou dizer ao hospital universitário: «Posso pensar um pouco?»'
  - speaker: isha
    text: 納得[なっとく] して から 治療[ちりょう] を 選[えら]ぶ の が 一番[いちばん] です。
    meaning:
      en: It's best to choose a treatment once you're convinced.
      pt: O melhor é escolher o tratamento depois de estar convencida.
