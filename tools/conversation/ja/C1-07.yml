- type: narrator
  text:
    en: «嫁[よめ]» — bride, daughter-in-law — once meant a woman who joined her husband's household and served it; many younger people now avoid it and say «妻[つま]» or the name. Gender roles at family gatherings
      are shifting, but slowly, and varied by family and region.
    pt: «嫁[よめ]» — nora, esposa — já quis dizer a mulher que entrava na casa do marido e a servia; muitos jovens hoje evitam a palavra e dizem «妻[つま]» ou o nome. Os papéis de gênero nas reuniões de família
      estão mudando, mas devagar, e variam de família para família e de região para região.
