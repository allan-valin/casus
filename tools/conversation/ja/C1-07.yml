steps:
- type: narrator
  text:
    en: New Year at Shota's parents' farmhouse. His mother hands you an apron; the kitchen is full of women. Shota and his father watch TV. Listen to the conversation; you don't need to understand it yet.
    pt: Ano-novo na casa de fazenda dos pais do Shota. A mãe dele te entrega um avental; a cozinha está cheia de mulheres. O Shota e o pai veem TV. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: shota-haha
    text: 実家[じっか] の 帰省[きせい] で 疲[つか]れた でしょう。 でも、 これ、 お願[ねが]い できる？
    meaning:
      en: You must be tired from the trip home. But could you help with this?
      pt: Você deve estar cansada da viagem. Mas pode me ajudar com isto?
  - speaker: protagonist
    text: はい、 手伝[てつだ]います。 …あの、 翔太[しょうた] さん は 手伝[てつだ]わない ん です か。
    meaning:
      en: Yes, I'll help. …Um, doesn't Shota help?
      pt: Claro, eu ajudo. …Hum, o Shota não ajuda?
  - speaker: shota-haha
    text: うち は 昔[むかし] から、 台所[だいどころ] は 女[おんな] の 役割[やくわり] で ね。
    meaning:
      en: In our family the kitchen has always been the women's role.
      pt: Na nossa família a cozinha sempre foi papel das mulheres.
  - speaker: protagonist
    text: ブラジル の 私[わたし] の 実家[じっか] で は、 男[おとこ] も 皿[さら] を 洗[あら]います よ。
    meaning:
      en: At my family's home in Brazil, the men wash dishes too.
      pt: Na casa dos meus pais no Brasil, os homens também lavam a louça.
  - speaker: shota
    text: …聞[き]こえた。 俺[おれ] も やる よ。 お父[とう]さん も。
    meaning:
      en: …I heard that. I'll do it too. And Dad.
      pt: …Escutei. Eu também faço. O pai também.
  - speaker: shota-chichi
    text: え、 わし も？ …まあ、 時代[じだい] は 変[か]わって きた から な。
    meaning:
      en: What, me too? …Well, times have been changing.
      pt: Ué, eu também? …Bom, os tempos estão mudando.
  - speaker: shota-haha
    text: あなた の よう な お嫁[よめ] さん が 来[き]て、 よかった わ。
    meaning:
      en: I'm glad a bride like you is joining us.
      pt: Que bom que uma nora como você chegou.
  - speaker: protagonist
    text: 家族[かぞく] だ から こそ、 みんな で やりたい ん です。 遠慮[えんりょ] なく 言[い]って ください ね。
    meaning:
      en: Precisely because we're family, I want us all to do it together. Please feel free to tell me things.
      pt: Justamente porque somos família, quero que todo mundo faça junto. Pode falar comigo sem cerimônia.
