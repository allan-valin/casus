steps:
- type: narrator
  text:
    en: The taiko group's first performance at the summer festival. It rained all afternoon; the crowd stayed anyway. Afterwards, Ōno-sensei and Kenta. Listen to the conversation; you don't need to understand
      it yet.
    pt: A primeira apresentação do grupo de taikô no festival de verão. Choveu a tarde toda; o público ficou mesmo assim. Depois, a professora Ōno e o Kenta. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: taiko-sensei
    text: 皆[みな]さん、 雨[あめ] にも かかわらず、 最後[さいご] まで 素晴[すば]らしかった！
    meaning:
      en: Everyone, despite the rain, you were wonderful to the end!
      pt: Pessoal, apesar da chuva, vocês foram maravilhosos até o fim!
  - speaker: protagonist
    text: 本番[ほんばん] は 緊張[きんちょう] しました。 一回[いっかい] 間違[まちが]えた し。
    meaning:
      en: I was nervous on the day. And I made a mistake once.
      pt: Fiquei nervoso na apresentação. E errei uma vez.
  - speaker: kenta
    text: 誰[だれ] も 気[き] が つかなかった よ。 拍手[はくしゅ]、 すごかった じゃん。
    meaning:
      en: Nobody noticed. The applause was huge, wasn't it.
      pt: Ninguém percebeu. O aplauso foi enorme, né?
  - speaker: protagonist
    text: 観客[かんきゃく] が 雨[あめ] の 中[なか] で 待[ま]って いて くれた。 感動[かんどう] した。
    meaning:
      en: The audience waited in the rain for us. I was moved.
      pt: O público esperou na chuva por nós. Fiquei emocionado.
  - speaker: taiko-sensei
    text: 練習[れんしゅう] が 少[すく]なかった にも かかわらず、 みんな の 気持[きも]ち が 一[ひと]つ に なりました ね。
    meaning:
      en: Even though we practised little, everyone's hearts beat as one.
      pt: Apesar de termos treinado pouco, todos ficaram em sintonia.
  - speaker: kenta
    text: 衣装[いしょう] も 濡[ぬ]れた けど、 大[だい] 成功[せいこう]！
    meaning:
      en: The costumes got wet too, but it was a big success!
      pt: O figurino molhou também, mas foi um sucesso!
  - speaker: taiko-sensei
    text: では、 打[う]ち上[あ]げ に 行[い]きましょう！
    meaning:
      en: Now, let's go to the after-party!
      pt: Agora, vamos comemorar!
  - speaker: protagonist
    text: はい！ 次[つぎ] の 本番[ほんばん] が もう 楽[たの]しみ です。
    meaning:
      en: Yes! I'm already looking forward to the next performance.
      pt: Vamos! Já estou ansioso pela próxima apresentação.
