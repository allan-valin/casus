- type: narrator
  text:
    en: After a performance, project or event comes the «打[う]ち上[あ]げ» — named after fireworks being launched — where the group thanks each other. Mistakes in a group performance are shrugged off; what's
      praised is the group sounding as one.
    pt: Depois de uma apresentação, projeto ou evento vem o «打[う]ち上[あ]げ» — o nome vem do lançamento de fogos — em que o grupo agradece uns aos outros. Errar numa apresentação em grupo não pesa; o elogio
      vai para o grupo soar como um só.
- type: narrator
  for:
  - pt
  text:
    pt: 'É o «chopp depois do ensaio» elevado a ritual: ninguém vai embora sem o 打ち上げ — e quem errou é o primeiro a ser abraçado.'
