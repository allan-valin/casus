steps:
- type: narrator
  text:
    en: May in Hiroshima. Your grandmother's brother asks you to help plant rice. Barefoot in the mud, he tells you how it used to be. Listen to the conversation; you don't need to understand it yet.
    pt: Maio em Hiroshima. O irmão da sua avó pede ajuda para plantar arroz. Descalço na lama, ele conta como era antigamente. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ojisan
    text: 昔[むかし] は 村[むら] の みんな で 田植[たう]え を した もん じゃ。
    meaning:
      en: In the old days the whole village planted rice together.
      pt: Antigamente a aldeia inteira plantava arroz junto.
  - speaker: protagonist
    text: 今[いま] は 機械[きかい] で する ん です よね。
    meaning:
      en: Nowadays it's done by machine, right?
      pt: Hoje é com máquina, né?
  - speaker: ojisan
    text: そう じゃ。 でも この 小[ちい]さい 田[た]んぼ は 手[て] で 植[う]える。 苗[なえ] を 三本[さんぼん] ずつ。
    meaning:
      en: That's right. But this little paddy we plant by hand. Three seedlings at a time.
      pt: Isso mesmo. Mas este arrozal pequeno a gente planta à mão. Três mudas por vez.
  - speaker: protagonist
    text: 泥[どろ] が 冷[つめ]たくて 気持[きも]ち いい。 でも 腰[こし] が 痛[いた]い！
    meaning:
      en: The mud is cool and feels nice. But my back hurts!
      pt: A lama é fresquinha e gostosa. Mas as costas doem!
  - speaker: ojisan
    text: 農家[のうか] の 仕事[しごと] は そういう もの じゃ。
    meaning:
      en: That's how farm work is.
      pt: Trabalho de agricultor é assim mesmo.
  - speaker: protagonist
    text: 祖母[そぼ] も 子供[こども] の 時[とき]、 この 田[た]んぼ で 手伝[てつだ]った ん でしょう か。
    meaning:
      en: Do you think my grandmother helped in this paddy as a child?
      pt: Será que a minha avó ajudava neste arrozal quando era criança?
  - speaker: ojisan
    text: おお、 姉[あね] と よく 泥[どろ] だらけ に なった もん じゃ。
    meaning:
      en: Oh, my sister and I used to get covered in mud.
      pt: Ah, eu e minha irmã vivíamos cobertos de lama.
  - speaker: protagonist
    text: 秋[あき] に は 稲刈[いねか]り も 手伝[てつだ]い に 来[き]ます。
    meaning:
      en: In autumn I'll come and help with the harvest too.
      pt: No outono venho ajudar na colheita também.
