- type: narrator
  text:
    en: Rice is planted in May and June and harvested in September and October. Most of it is done by machine now, and farmers are ageing; many small paddies survive because relatives come back on weekends
      to help.
    pt: O arroz é plantado em maio e junho e colhido em setembro e outubro. Hoje quase tudo é feito com máquina, e os agricultores estão envelhecendo; muitos arrozais pequenos sobrevivem porque os parentes
      voltam nos fins de semana para ajudar.
