- type: narrator
  text:
    en: '«〜もの だ» has two common uses: with a past verb, fond memories — «よく やった もの だ», we used to do it a lot; with a plain verb or adjective, that''s the nature of things — «農家[のうか] の 仕事[しごと] は そういう もの
      だ», that''s how farm work is. In speech it often shortens to «もん だ», and in Hiroshima dialect «もん じゃ».'
    pt: '«〜もの だ» tem dois usos comuns: com verbo no passado, lembrança carinhosa — «よく やった もの だ», a gente fazia muito; com verbo ou adjetivo simples, a natureza das coisas — «農家[のうか] の 仕事[しごと] は そういう もの
      だ», trabalho de agricultor é assim. Na fala vira «もん だ», e no dialeto de Hiroshima «もん じゃ».'
