steps:
- type: narrator
  text:
    en: The department's year-end party. As the new team lead you give a short speech; Takahashi-buchō closes with the one-clap ending. Listen to the conversation; you don't need to understand it yet.
    pt: A festa de fim de ano do departamento. Como novo líder de equipe, você faz um discurso curto; o chefe Takahashi fecha com a palma única. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: buchou
    text: では、 新[あたら]しい 主任[しゅにん] から 一言[ひとこと] お願[ねが]い します。
    meaning:
      en: Now, a few words from our new team lead.
      pt: Agora, umas palavras do nosso novo líder de equipe.
  - speaker: protagonist
    text: 皆[みな]さん、 今年[ことし] 一年[いちねん]、 大変[たいへん] お世話[せわ] に なりました。
    meaning:
      en: Everyone, thank you so much for everything this year.
      pt: Pessoal, muito obrigado por tudo neste ano.
  - speaker: protagonist
    text: 一年[いちねん] 前[まえ] は 日本語[にほんご] も 話[はな]せません でした。 皆[みな]さん に 心[こころ] から 感謝[かんしゃ] して います。
    meaning:
      en: A year ago I couldn't even speak Japanese. I'm grateful to all of you from my heart.
      pt: Há um ano eu nem falava japonês. Agradeço a todos de coração.
  - speaker: protagonist
    text: 来年[らいねん] も 一緒[いっしょ] に 頑張[がんば]りましょう。 乾杯[かんぱい]！
    meaning:
      en: Let's do our best together next year too. Cheers!
      pt: Ano que vem, vamos dar o nosso melhor juntos de novo. Saúde!
  - speaker: sato
    text: 乾杯[かんぱい]！ いい 挨拶[あいさつ] でした よ。
    meaning:
      en: Cheers! That was a good speech.
      pt: Saúde! Foi um bom discurso.
  - speaker: buchou
    text: それでは、 一本締[いっぽんじ]め で 締[し]めたい と 思[おも]います。 ご唱和[しょうわ] ください。 いよーっ！
    meaning:
      en: Then let's close with the one-clap ending. Please join in. Iyō!
      pt: Então vamos encerrar com a palma única. Acompanhem, por favor. Iyō!
  - speaker: kenta
    text: （パン！） お疲[つか]れさま でした！
    meaning:
      en: (Clap!) Thank you for your hard work!
      pt: (Palma!) Obrigado pelo trabalho!
  - speaker: protagonist
    text: お疲[つか]れさま でした！ 皆[みな]さん、 良[よ]い お年[とし] を！
    meaning:
      en: Thank you for your hard work! Everyone, have a good New Year!
      pt: Obrigado pelo trabalho! Pessoal, um bom ano-novo!
