- type: narrator
  text:
    en: 'Ceremonies run on formulas: thank for the year with «お世話[せわ] に なりました», look ahead with «来年[らいねん] も よろしく», then «乾杯[かんぱい]». At the end, «一本締[いっぽんじ]め»: the leader calls «いよーっ！» and everyone claps
      once together. Before New Year say «良[よ]い お年[とし] を»; after it, «明[あ]けまして おめでとう».'
    pt: 'Cerimônias funcionam com fórmulas: agradecer o ano com «お世話[せわ] に なりました», olhar para frente com «来年[らいねん] も よろしく», depois «乾杯[かんぱい]». No fim, o «一本締[いっぽんじ]め»: quem conduz grita «いよーっ！» e todos
      batem uma palma juntos. Antes do ano-novo se diz «良[よ]い お年[とし] を»; depois, «明[あ]けまして おめでとう».'
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil a confraternização termina com amigo-secreto e abraço. No Japão termina com uma palma só, todos juntos — curta, seca e estranhamente emocionante.
