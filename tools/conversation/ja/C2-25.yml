steps:
- type: narrator
  text:
    en: On the phone with a client, Hiroto said «了解[りょうかい] です» and «ご苦労[くろう] さま です». After the call, you correct him — kindly. Listen to the conversation; you don't need to understand it yet.
    pt: No telefone com um cliente, o Hiroto disse «了解[りょうかい] です» e «ご苦労[くろう] さま です». Depois da ligação, você o corrige — com jeito. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 大翔[ひろと] くん、 ちょっと いい？ 叱[しか]る ん じゃ なくて、 言葉[ことば] 遣[づか]い の 話[はなし]。
    meaning:
      en: Hiroto, got a minute? I'm not scolding you — it's about wording.
      pt: Hiroto, tem um minutinho? Não é bronca — é sobre o jeito de falar.
  - speaker: hiroto
    text: はい… 何[なに] か 間違[まちが]えました か。
    meaning:
      en: Yes… did I make a mistake?
      pt: Sim… eu errei alguma coisa?
  - speaker: protagonist
    text: お客様[きゃくさま] に「了解[りょうかい] です」 は ちょっと 軽[かる]い。「かしこまりました」 が いい よ。
    meaning:
      en: “Ryōkai desu” is a bit too light for a client. “Kashikomarimashita” is better.
      pt: «Ryōkai desu» é meio leve demais para cliente. «Kashikomarimashita» é melhor.
  - speaker: hiroto
    text: そう だった ん です か。 友達[ともだち] に は いつも 使[つか]って いて。
    meaning:
      en: Oh, I didn't know. I always use it with friends.
      pt: Ah, eu não sabia. Uso sempre com os amigos.
  - speaker: protagonist
    text: それ と、「ご苦労[くろう] さま」 は 目上[めうえ] の 人[ひと] が 下[した] の 人[ひと] に 言[い]う 言葉[ことば]。 お客様[きゃくさま] や 上司[じょうし] に は「お疲[つか]れさま です」。
    meaning:
      en: And “gokurōsama” is what superiors say to juniors. To clients and bosses, it's “otsukaresama desu”.
      pt: E «gokurōsama» é o que o superior diz ao subordinado. Para cliente e chefe, é «otsukaresama desu».
  - speaker: hiroto
    text: 外国[がいこく] から 来[き]た 先輩[せんぱい] に 敬語[けいご] を 直[なお]される とは… 勉強[べんきょう] に なりました。
    meaning:
      en: Having my keigo corrected by a senior from abroad… I learned a lot.
      pt: Ser corrigido no keigo por uma veterana estrangeira… aprendi muito.
  - speaker: protagonist
    text: 私[わたし] も 最初[さいしょ] は 全部[ぜんぶ] 間違[まちが]えて いた よ。 気[き] を つけて ほしい けど、 心配[しんぱい] しないで。
    meaning:
      en: I got all of it wrong at first too. I'd like you to be careful, but don't worry.
      pt: Eu também errava tudo no começo. Quero que tome cuidado, mas não se preocupe.
  - speaker: hiroto
    text: ありがとう ございます。 次[つぎ] から 直[なお]します。
    meaning:
      en: Thank you. I'll fix it from next time.
      pt: Obrigado. Da próxima vez eu corrijo.
- type: prompt
  ask:
    en: 'Say: wording, choice of words.'
    pt: 'Diga: o jeito de falar.'
