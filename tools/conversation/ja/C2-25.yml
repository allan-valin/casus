- type: narrator
  text:
    en: 'Some everyday work phrases carry rank: «ご苦労[くろう] さま» goes down the ladder; «お疲[つか]れさま です» is safe in all directions; «了解[りょうかい] です» is fine among peers but too casual for clients — «かしこまりました» or
      «承知[しょうち] しました». Correcting a junior works best in private, with reassurance.'
    pt: 'Algumas frases do dia a dia carregam hierarquia: «ご苦労[くろう] さま» desce a escada; «お疲[つか]れさま です» é segura em qualquer direção; «了解[りょうかい] です» serve entre colegas, mas é informal demais para clientes
      — «かしこまりました» ou «承知[しょうち] しました». Corrigir um subordinado funciona melhor a sós e com tranquilidade.'
