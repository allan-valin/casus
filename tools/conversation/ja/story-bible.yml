# STORY BIBLE — Japanese, narrator Brazilian Portuguese (Allan's pair ja·pt-BR, "jp>pt", 5th in his order). DRAFT
# 2026-10-21 for Allan's review, written by AI (Claude) after the guide; units come after.
# The story is set in Hamamatsu, home of one of Japan's largest Brazilian communities, so Brazil is in the story too.

language: ja
narrator_languages: [en, pt]          # en: neutral (Allan 2026-10-21, for international offices); pt: with Brazil comparisons
country: Japan
standard: >-
  Standard Japanese (標準語) in the polite です・ます form; plain form among friends once agreed; 敬語 (respectful and
  humble forms) in set phrases from A1 and as grammar from B2. Hamamatsu dialect (遠州弁, …だら) appears only in a
  B-level unit as colour.

