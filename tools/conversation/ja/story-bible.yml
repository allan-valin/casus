formality:
  summary: >-
    Polite です・ます with anyone not a close friend; plain form (だ, 食べる) with friends, family, younger people,
    once agreed. 敬語: respectful forms for others (いらっしゃる, 召し上がる), humble forms for oneself (参る, いただく),
    heard in shops and at work from day one. Names: family name + さん; titles at work (課長); second-person あなた is
    avoided — use the name. First names only among friends.
  rules:
    - です・ます with everyone in A1; set 敬語 phrases are learnt as whole phrases (よろしくお願いします).
    - Plain form only with Kenta after he proposes it (A1-14).
    - Never あなた to a person you know; family name + さん, or the title.
  sources:
    - {title: "Wikipedia: Honorific speech in Japanese", url: "https://en.wikipedia.org/wiki/Honorific_speech_in_Japanese", licence: CC BY-SA}
    - {title: "Wikipedia: Brazilians in Japan (Hamamatsu)", url: "https://en.wikipedia.org/wiki/Brazilians_in_Japan", licence: CC BY-SA}

culture:
  taught:
    - {topic: bowing, note: "A bow instead of a handshake; deeper for apologies and thanks to superiors."}
    - {topic: shoes, note: "Shoes off in the 玄関; slippers inside; separate toilet slippers; no slippers on tatami."}
    - {topic: rubbish, note: "Rubbish by type on fixed days (burnable, plastics, cans, bottles), in the town's bags, before 8 am; the neighbourhood notices mistakes."}
    - {topic: quiet, note: "No phone calls on trains; low voices in public; no noise at night in flats."}
    - {topic: refusals, note: "No is said indirectly: ちょっと…, 検討します; reading the situation (空気を読む) is expected."}
    - {topic: cards, note: "Business cards (名刺) given and taken with both hands, read, kept on the table during the meeting."}
    - {topic: gifts, note: "お土産 from trips for colleagues; gifts are wrapped and received with both hands, often not opened at once."}
    - {topic: eating, note: "いただきます / ごちそうさま; don't stick chopsticks upright in rice or pass food chopstick to chopstick; slurping noodles is fine; no tipping."}
    - {topic: punctuality, note: "Trains and meetings start on the minute; five minutes early is on time."}
    - {topic: bath, note: "Onsen and sentō: wash before entering, no swimsuits, tattoos often not allowed."}
    - {topic: Brazilians, note: "Hamamatsu has Brazilian shops, schools and churches; Portuguese signs at the station and city hall."}
  narrator:
    - {lang: en, topic: contact, note: "Many cultures greet with a handshake, a hug or a kiss; in Japan a bow, almost no touching."}
    - {lang: en, topic: refusals, note: "A Japanese ちょっと… ('a little…') is a clear no, said softly."}
    - {lang: en, topic: time, note: "8時 means ready at 7:55."}
    - {lang: en, topic: nikkei, note: "Descendants of Japanese emigrants (日系) are often seen as foreigners in Japan and as Japanese abroad."}
    - {lang: pt, topic: contact, note: "Brazilians kiss and hug; in Japan a bow, almost no touching."}
    - {lang: pt, topic: refusals, note: "A Brazilian 'vou ver' is also a soft no; a Japanese ちょっと… is a clear no."}
    - {lang: pt, topic: noise, note: "Brazilian social life is loud and in the street; Japanese public space is quiet."}
    - {lang: pt, topic: time, note: "Brazilian 'chego às oito' means around eight; Japanese 8時 means 7:55."}
    - {lang: pt, topic: rubbish, note: "In Brazil rubbish goes out any day; in Japan the day decides."}
    - {lang: pt, topic: nikkei, note: "Japanese Brazilians are 'japonês' in Brazil and 'ブラジル人' in Japan — an identity theme for B levels."}
  clashes:
    - {situation: "Hugging the landlady and walking in with shoes on", unit: A1-01}
    - {situation: "Putting out plastics on burnable day; the bag comes back with a note", unit: A1-05}
    - {situation: "Calling the section chief by her first name", unit: A1-08}
    - {situation: "Taking ちょっと… as a yes", unit: A1-12}
    - {situation: "A phone call on the train", unit: A1-10}
    - {situation: "Arriving at 9:00 for a 9:00 meeting", unit: A2}

arc:
  - {level: A1, units: 30, summary: "Arrival in Hamamatsu: the landlady, shoes and slippers, the konbini, hiragana, rubbish days, the factory office, business cards, the train, a Brazilian bakery, Kenta proposes plain form."}
  - {level: A2, units: 30, summary: "Settling in: residence card at city hall, bank, clinic, a 飲み会, the summer festival, onsen, the grandmother's village."}
  - {level: B1, units: 30, summary: "Friends: futsal with Kenta, karaoke, opinions, nikkei identity, a misunderstanding by indirectness."}
  - {level: B2, units: 30, summary: "Work: 敬語 in earnest, meetings, e-mails, phone calls, interpreting for Brazilian workers."}
  - {level: C1, units: 30, summary: "Evening courses: science talked about at school level."}
  - {level: C2, units: 30, summary: "Ideas: philosophy, history handled with care, humour, register."}
