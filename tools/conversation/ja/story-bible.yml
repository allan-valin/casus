protagonist:
  forms: {f: ja-f, m: ja-m}
  name: null
  background: >-
    Brazilian from São Paulo, about 30, grandchild of a Japanese immigrant (日系三世) but speaks no Japanese; comes to
    Hamamatsu for a year as a Portuguese–English interpreter at a car-parts factory. Knows a few words from the
    grandmother (いただきます, おばあちゃん), no kana.
  alternation: odd units f, even units m (first person 私 for both in polite speech; 僕 / あたし only among friends, later)

cast:
  - id: suzuki
    name: 鈴木さん (Suzuki-san)
    role: landlady, about 70, lives next door, grows vegetables
    voice: ja-f2
    register: formal
    arc: polite form throughout; teaches the rubbish days and brings vegetables; explains why the grandmother's words sound old-fashioned
  - id: kenta
    name: 健太 (Kenta)
    role: neighbour, 27, works at the same factory on the line, plays futsal with Brazilians
    voice: ja-m3
    register: formal
    arc: です・ます at first; proposes plain form (タメ口でいいよ) in A1-14; knows some Portuguese swear words
  - id: sato
    name: 佐藤課長 (Satō-kachō)
    role: colleague, 31, section chief (課長) in the office
    voice: ja-f3
    register: formal
    arc: 佐藤課長 / 佐藤さん, never 美穂; business cards in A1-08; indirect refusals (ちょっと…)
  - id: tencho
    name: 店長 (tenchō)
    role: convenience-store manager, about 50
    voice: ja-m2
    register: formal
    arc: いらっしゃいませ, 温めますか?, ポイントカードはお持ちですか?; the protagonist's everyday teacher

  - id: yamada
