steps:
- type: narrator
  text:
    en: 'Cleaning the bathroom mould, you reach for a second bottle. Mrs Suzuki stops you at the door: read the label. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Limpando o mofo do banheiro, você pega um segundo frasco. A senhora Suzuki te para na porta: leia o rótulo. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: suzuki
    text: あっ、 待[ま]って！ その 二[ふた]つ を 混[ま]ぜて は いけません！
    meaning:
      en: Ah, wait! You mustn't mix those two!
      pt: Ah, espere! Não pode misturar esses dois!
  - speaker: protagonist
    text: え？ 両方[りょうほう] カビ 取[と]り です よ。 昨日[きのう] 買[か]った ばかり です。
    meaning:
      en: What? Both are mould removers. I only bought them yesterday.
      pt: Como? Os dois são tira-mofo. Acabei de comprar ontem.
  - speaker: suzuki
    text: ラベル を 見[み]て。「混[ま]ぜる な 危険[きけん]」 と 書[か]いて あります。
    meaning:
      en: 'Look at the label. It says “Danger: do not mix”.'
      pt: 'Olhe o rótulo. Está escrito «perigo: não misture».'
  - speaker: protagonist
    text: どうして 危険[きけん] な ん です か。
    meaning:
      en: Why is it dangerous?
      pt: Por que é perigoso?
  - speaker: suzuki
    text: 塩素[えんそ] と 酸性[さんせい] の 洗剤[せんざい] を 混[ま]ぜる と、 毒[どく] の ガス が 出[で]ます。
    meaning:
      en: Mixing chlorine with an acidic cleaner gives off a poisonous gas.
      pt: Misturar cloro com um produto ácido solta um gás venenoso.
  - speaker: protagonist
    text: 化学[かがく] の 授業[じゅぎょう] で 習[なら]った はず なのに、 忘[わす]れて いました。
    meaning:
      en: I should have learned that in chemistry class, but I'd forgotten.
      pt: Eu devia ter aprendido isso na aula de química, mas tinha esquecido.
  - speaker: suzuki
    text: 掃除[そうじ] の 時[とき] は 窓[まど] を 開[あ]けて、 換気[かんき] を して ください。
    meaning:
      en: When you clean, open the window and ventilate.
      pt: Na hora de limpar, abra a janela e ventile.
  - speaker: protagonist
    text: これから は 説明書[せつめいしょ] を ちゃんと 読[よ]みます。
    meaning:
      en: From now on I'll read the instructions properly.
      pt: Daqui em diante vou ler as instruções direito.
