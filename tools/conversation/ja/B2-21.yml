steps:
- type: narrator
  text:
    en: 'Shota shows you round Kyoto at last: a shrine in the morning, a Buddhist temple after lunch. You ask what his religion is. He has to think. Listen to the conversation; you don''t need to understand
      it yet.'
    pt: 'O Shota finalmente leva você para conhecer Kyoto: um santuário de manhã, um templo budista depois do almoço. Você pergunta qual é a religião dele. Ele precisa pensar. Escute a conversa; ainda não
      precisa entender.'
- type: dialogue
  lines:
  - speaker: shota
    text: ここ が 神社[じんじゃ]。 鳥居[とりい] を くぐる 前[まえ] に、 お辞儀[じぎ] する ん だ よ。
    meaning:
      en: This is the shrine. You bow before passing through the gate.
      pt: Este é o santuário. Antes de passar pelo portal, a gente faz uma reverência.
  - speaker: protagonist
    text: 翔太[しょうた] の 宗教[しゅうきょう] は 何[なに]？ 神道[しんとう]？ 仏教[ぶっきょう]？
    meaning:
      en: What's your religion, Shota? Shinto? Buddhism?
      pt: Qual é a sua religião, Shota? Xintoísmo? Budismo?
  - speaker: shota
    text: うーん… 両方[りょうほう] かな。 お正月[しょうがつ] は 神社[じんじゃ] に 初詣[はつもうで]、 お葬式[そうしき] は お寺[てら]。
    meaning:
      en: Hmm… both, I guess. New Year at the shrine, funerals at the temple.
      pt: Hum… os dois, acho. Ano-novo no santuário, funeral no templo.
  - speaker: protagonist
    text: クリスマス も する でしょ？
    meaning:
      en: And you do Christmas too, right?
      pt: E vocês também fazem Natal, né?
  - speaker: shota
    text: する する。 ケーキ とか チキン とか。 でも 宗教[しゅうきょう] と して じゃ ない。
    meaning:
      en: We do. Cake and chicken and so on. But not as religion.
      pt: Fazemos, sim. Bolo, frango e tal. Mas não como religião.
  - speaker: protagonist
    text: お守[まも]り を 買[か]おう か な。 おみくじ も 引[ひ]きたい。
    meaning:
      en: Maybe I'll buy an amulet. And I want to draw a fortune too.
      pt: Acho que vou comprar um amuleto. E quero tirar um papel da sorte.
  - speaker: shota
    text: …大吉[だいきち]！ 神様[かみさま] は 君[きみ] の 味方[みかた] だ ね。
    meaning:
      en: …Great luck! The gods are on your side.
      pt: …Grande sorte! Os deuses estão do seu lado.
  - speaker: protagonist
    text: 午後[ごご] は お寺[てら] で、 仏様[ほとけさま] に も お願[ねが]い しなきゃ。
    meaning:
      en: This afternoon at the temple I'd better ask the Buddha too.
      pt: À tarde, no templo, tenho que pedir ao Buda também.
