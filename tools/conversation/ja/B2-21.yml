- type: narrator
  text:
    en: 'Most Japanese take part in both Shinto and Buddhism without feeling they belong to either: shrines for births, New Year and good luck; temples for funerals and ancestors. A «鳥居[とりい]» marks a shrine;
      incense and a Buddha mark a temple.'
    pt: 'A maioria dos japoneses participa do xintoísmo e do budismo sem sentir que pertence a nenhum: santuário para nascimento, ano-novo e boa sorte; templo para funeral e antepassados. O «鳥居[とりい]» marca
      o santuário; incenso e uma imagem de Buda marcam o templo.'
