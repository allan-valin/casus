steps:
- type: narrator
  text:
    en: A company in São Paulo offers you a big job. Yui would come; your son is starting school. On the riverbank, you weigh it one last time with Kenta. Listen to the conversation; you don't need to understand
      it yet.
    pt: Uma empresa em São Paulo oferece um cargo importante. A Yui iria junto; seu filho está começando a escola. Na beira do rio, você pesa tudo uma última vez com o Kenta. Escute a conversa; ainda não
      precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: サンパウロ の 話[はなし]、 決断[けつだん] した？
    meaning:
      en: Have you decided about São Paulo?
      pt: Já decidiu sobre São Paulo?
  - speaker: protagonist
    text: まだ 迷[まよ]い が ある。 給料[きゅうりょう] は いい し、 両親[りょうしん] の 近[ちか]く に も 住[す]める。
    meaning:
      en: I still have doubts. The salary's good, and I could live near my parents.
      pt: Ainda estou em dúvida. O salário é bom, e eu poderia morar perto dos meus pais.
  - speaker: kenta
    text: でも 浜松[はままつ] に は 根[ね] を 下[お]ろした だろ。
    meaning:
      en: But you've put down roots in Hamamatsu.
      pt: Mas você criou raízes em Hamamatsu.
  - speaker: protagonist
    text: 五年[ごねん] 前[まえ]、 誰[だれ] も 知[し]らない 町[まち] で、 君[きみ] が「タメ口[ぐち] で いい よ」 と 言[い]って くれた 時[とき]、 どんなに 嬉[うれ]しかった こと か。
    meaning:
      en: Five years ago, in a town where I knew no one, when you said “plain talk is fine” — how happy I was!
      pt: Cinco anos atrás, numa cidade onde eu não conhecia ninguém, quando você disse «pode falar normal comigo» — como fiquei feliz!
  - speaker: kenta
    text: 急[きゅう] に 何[なに] だ よ。 照[て]れる な。
    meaning:
      en: Where's this coming from? You're making me blush.
      pt: Que é isso de repente? Fico sem graça.
  - speaker: protagonist
    text: ここ に は 居場所[いばしょ] が ある。 太鼓[たいこ] も 畑[はたけ] も、 この 町[まち] の 友達[ともだち] も、 諦[あきら]める もの か。
    meaning:
      en: Here I have a place. The taiko, the garden, the friends in this town — I'll never give them up.
      pt: Aqui eu tenho um lugar. O taikô, a horta, os amigos desta cidade — nunca vou desistir disso.
  - speaker: kenta
    text: じゃあ、 心[こころ] が 決[き]まった ね。
    meaning:
      en: Then you've made up your mind.
      pt: Então já decidiu.
  - speaker: protagonist
    text: うん、 残[のこ]る。 ブラジル と の 架[か]け橋[はし] は、 ここ から でも できる から。
    meaning:
      en: Yes, I'm staying. I can be a bridge to Brazil from here too.
      pt: É, vou ficar. Dá para ser ponte com o Brasil daqui mesmo.
