  text:
    en: 'Two emphatic patterns of strong feeling: «〜もの か» is a fierce never — «諦[あきら]める もの か», I''ll never give up (casual «もん か»). «〜こと か» is an exclamation of degree — «どんなに 嬉[うれ]しかった こと か», how happy
      I was! Both belong to speeches and heartfelt moments.'
    pt: 'Dois padrões enfáticos de sentimento forte: «〜もの か» é um nunca firme — «諦[あきら]める もの か», nunca vou desistir (informal «もん か»). «〜こと か» é exclamação de intensidade — «どんなに 嬉[うれ]しかった こと か», como fiquei
