- type: narrator
  text:
    en: '«報連相[ほうれんそう]» — 報告, report; 連絡, inform; 相談, consult — sounds like spinach and is drilled into every new employee: bad news early is better than a surprise late. A delay goes: apologise, give the
      cause briefly, propose a new time, and say how you''ll prevent it.'
    pt: '«報連相[ほうれんそう]» — 報告, relatar; 連絡, informar; 相談, consultar — soa como espinafre e é martelado em todo funcionário novo: notícia ruim cedo é melhor que surpresa tarde. Um atraso se comunica assim:
      pedir desculpas, dar a causa em poucas palavras, propor um novo prazo e dizer como vai evitar.'
