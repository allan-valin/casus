steps:
- type: narrator
  text:
    en: The translated safety report was due today at noon. It's 11:30 and you're not done. You go to the department head before he has to ask. Listen to the conversation; you don't need to understand it
      yet.
    pt: O relatório de segurança traduzido era para hoje ao meio-dia. São 11h30 e você não terminou. Você vai até o chefe de departamento antes que ele precise perguntar. Escute a conversa; ainda não precisa
      entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 部長[ぶちょう]、 申[もう]し訳[わけ] ありません。 報告書[ほうこくしょ] が 締[し]め切[き]り に 間[ま]に合[あ]いません。
    meaning:
      en: Sir, I'm sorry. The report won't make the deadline.
      pt: Chefe, peço desculpas. O relatório não vai ficar pronto no prazo.
  - speaker: buchou
    text: そう か。 どの くらい 遅[おく]れる？
    meaning:
      en: I see. How late will it be?
      pt: Entendi. Quanto vai atrasar?
  - speaker: protagonist
    text: 専門[せんもん] 用語[ようご] の 確認[かくにん] に 時間[じかん] が かかりました。 明日[あした] の 朝[あさ] まで 延長[えんちょう] させて いただけない でしょう か。
    meaning:
      en: Checking the technical terms took time. Could you allow me until tomorrow morning?
      pt: A conferência dos termos técnicos levou tempo. O senhor me permitiria entregar até amanhã de manhã?
  - speaker: buchou
    text: 早[はや]め に 言[い]って くれて、 よかった。 明日[あした] の 九時[くじ] で いい よ。
    meaning:
      en: Good that you told me early. Nine tomorrow is fine.
      pt: Que bom que avisou cedo. Amanhã às nove está bom.
  - speaker: protagonist
    text: ありがとう ございます。 明日[あした] 九時[くじ] に 提出[ていしゅつ] させて いただきます。
    meaning:
      en: Thank you. I'll submit it at nine tomorrow.
      pt: Obrigada. Entrego amanhã às nove.
  - speaker: buchou
    text: 原因[げんいん] は わかった。 次[つぎ] の 対策[たいさく] は？
    meaning:
      en: I understand the cause. What will you do differently next time?
      pt: Entendi a causa. E qual a medida para a próxima?
  - speaker: protagonist
    text: 用語集[ようごしゅう] を 作[つく]って、 次[つぎ] から は 三日[みっか] 前[まえ] に 確認[かくにん] させて いただきます。
    meaning:
      en: I'll make a glossary and, from next time, check three days ahead.
      pt: Vou fazer um glossário e, da próxima vez, confiro três dias antes.
  - speaker: buchou
    text: それ が 報連相[ほうれんそう] だ よ。
    meaning:
      en: That's hō-ren-sō.
      pt: Isso é o hō-ren-sō.
