id: A2-29
protagonist: f
title: [Homesick, Saudade de casa]
situation: ["At Maria's bakery on a grey Sunday. You miss home; Maria, who came from Paraná twenty years ago, knows the feeling.", "Na padaria da Maria num domingo cinzento. Você está com saudade de casa; a Maria, que veio do Paraná há vinte anos, conhece bem."]
learn: [n5-048]
culture: Twelve hours apart
items:
  - [aitai, "会[あ]いたい", "I miss (someone), want to see", "quero ver, sinto falta"]
  - [jisa, "時差[じさ]", "time difference", "fuso horário"]
  - [bideo-tsuuwa, "ビデオ 通話[つうわ]", "video call", "videochamada", {rare: true}]
  - [kazoku-ni-aitai, "家族[かぞく] に 会[あ]いたい です", "I miss my family", "quero ver minha família"]
  - [sabishii, "寂[さび]しい", "lonely", "sozinha, com saudade"]
  - [kaeritai, "帰[かえ]りたい", "I want to go home", "quero voltar"]
  - [juuni-jikan, "十二時間[じゅうにじかん]", "twelve hours", "doze horas"]
  - [asa-to-yoru, "朝[あさ] と 夜[よる]", "morning and night", "manhã e noite"]
  - [genki-ni-naru, "元気[げんき] に なります", "cheer up, get better", "fico melhor, me animo"]
  - [furusato, "故郷[ふるさと]", "hometown", "terra natal"]
dialogue:
  - [maria, "どうした の？ 元気[げんき] ない ね。", "What's wrong? You look down.", "O que foi? Você está desanimada."]
  - [protagonist, "家族[かぞく] に 会[あ]いたい です。 ちょっと 寂[さび]しい。", "I miss my family. I'm a bit lonely.", "Quero ver minha família. Estou meio sozinha."]
  - [maria, "わかる よ。 私[わたし] も 最初[さいしょ] は 毎日[まいにち] 帰[かえ]りたかった。", "I get it. At first I wanted to go home every day too.", "Eu entendo. No começo eu também queria voltar todo dia."]
  - [protagonist, "お母[かあ]さん と ビデオ 通話[つうわ] したい けど、 時差[じさ] が…", "I want to video call my mother, but the time difference…", "Quero fazer videochamada com minha mãe, mas o fuso…"]
  - [maria, "十二時間[じゅうにじかん] だ から、 日本[にほん] の 朝[あさ] は ブラジル の 夜[よる]。", "It's twelve hours, so morning in Japan is night in Brazil.", "São doze horas, então a manhã no Japão é a noite no Brasil."]
  - [protagonist, "じゃあ、 明日[あした] の 朝[あさ] 八時[はちじ] に かけます。", "Then I'll call tomorrow at eight in the morning.", "Então ligo amanhã às oito da manhã."]
  - [maria, "うん。 それから、 これ。 故郷[ふるさと] の 味[あじ]。", "Good. And here — a taste of home.", "Isso. E toma — o gosto da terra."]
  - [protagonist, "ポン・デ・ケージョ！ 元気[げんき] に なります。", "Pão de queijo! That cheers me up.", "Pão de queijo! Já fico melhor."]
teach:
  - ask: ["Say: I miss my family.", "Diga: quero ver minha família.", "家族[かぞく] に 会[あ]いたい です。", kazoku-ni-aitai]
  - ask: ["Say: I miss — want to see.", "Diga: quero ver, sinto falta.", "会[あ]いたい。", aitai]
  - ask: ["Say: I'm lonely.", "Diga: estou sozinha, com saudade.", "寂[さび]しい です。", sabishii]
  - ask: ["Say: I want to go home.", "Diga: quero voltar.", "帰[かえ]りたい。", kaeritai]
  - ask: ["Say: the time difference.", "Diga: o fuso horário.", "時差[じさ]", jisa]
  - ask: ["Say: twelve hours.", "Diga: doze horas.", "十二時間[じゅうにじかん]", juuni-jikan]
  - ask: ["Say: morning and night.", "Diga: manhã e noite.", "朝[あさ] と 夜[よる]", asa-to-yoru]
  - ask: ["Say: a video call.", "Diga: videochamada.", "ビデオ 通話[つうわ]", bideo-tsuuwa]
  - ask: ["Say: I want to video call my mother.", "Diga: quero fazer videochamada com minha mãe.", "お母[かあ]さん と ビデオ 通話[つうわ] したい です。", bideo-tsuuwa]
  - ask: ["Say: hometown.", "Diga: terra natal.", "故郷[ふるさと]", furusato]
  - ask: ["Say: it cheers me up.", "Diga: fico melhor.", "元気[げんき] に なります。", genki-ni-naru]
  - note: ["Japan is twelve hours ahead of Brasília, so your morning is their evening and the other way round. «会[あ]いたい» and «寂[さび]しい» are the closest Japanese has to saudade — said to someone, they're tender words.", "O Japão está doze horas à frente de Brasília, então sua manhã é a noite deles e vice-versa. «会[あ]いたい» e «寂[さび]しい» são o mais perto de saudade no japonês — ditas a alguém, são palavras carinhosas."]
  - pt_only: "Em Hamamatsu há padaria, mercado e igreja brasileiros: quando bater a saudade, um pão de queijo e um papo em português ajudam muito."
