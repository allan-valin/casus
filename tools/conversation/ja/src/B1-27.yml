id: B1-27
protagonist: f
title: ["Irony", "Ironia"]
situation: ["You arrive at futsal twenty minutes late, out of breath. Kenta greets you with a perfectly straight face.", "Você chega ao futsal vinte minutos atrasada, sem fôlego. O Kenta te recebe com a cara mais séria do mundo."]
learn: []
culture: —
items:
  - [sasuga, "さすが", "as expected of you (praise or irony)", "como era de se esperar (elogio ou ironia)"]
  - [yokatta-ne, "よかった ね…", "good for you… (said flatly)", "que bom para você… (dito sem emoção)"]
  - [hiniku, "皮肉[ひにく]", "irony, sarcasm", "ironia, sarcasmo"]
  - [joudan-da-yo, "冗談[じょうだん] だ よ", "just kidding", "é brincadeira"]
  - [majime-na-kao, "真面目[まじめ] な 顔[かお]", "a straight face", "cara séria"]
  - [hayai-ne, "早[はや]い ね", "you're early (ironically: late)", "chegou cedo, hein (ironia: atrasada)"]
  - [ikinari, "いきなり", "suddenly, out of nowhere", "do nada, de repente"]
  - [tsukkomi, "ツッコミ", "the comeback (comic retort)", "a resposta (no humor)", {rare: true}]
  - [boke, "ボケ", "the fool's line (comic)", "a fala do bobo (no humor)", {rare: true}]
  - [owarai, "お笑[わら]い", "comedy", "comédia, humor"]
  - [nande-yanen, "なんで やねん", "what the heck! (Kansai comeback)", "como assim?! (resposta do Kansai)", {rare: true}]
dialogue:
  - [kenta, "おお、 早[はや]い ね。 さすが。", "Oh, you're early. As expected.", "Opa, chegou cedo, hein. Como sempre."]
  - [protagonist, "早[はや]い？ 二十分[にじゅっぷん] 遅[おく]れた よ！", "Early? I'm twenty minutes late!", "Cedo? Me atrasei vinte minutos!"]
  - [kenta, "冗談[じょうだん] だ よ。 皮肉[ひにく]。", "Just kidding. Irony.", "É brincadeira. Ironia."]
  - [protagonist, "真面目[まじめ] な 顔[かお] で 言[い]う から、 わからない よ。", "You say it with a straight face, so I can't tell.", "Você fala com essa cara séria, aí não dá para saber."]
  - [kenta, "ブラジル で は 皮肉[ひにく] は ない の？", "Isn't there irony in Brazil?", "No Brasil não tem ironia?"]
  - [protagonist, "ある けど、 顔[かお] で わかる。 日本[にほん] の お笑[わら]い も 難[むずか]しい。", "There is, but you can tell from the face. Japanese comedy is hard too.", "Tem, mas dá para ver pela cara. O humor japonês também é difícil."]
  - [kenta, "お笑[わら]い は ボケ と ツッコミ。 僕[ぼく] が ボケ たら、 「なんで やねん！」 って 言[い]って。", "Comedy is the fool and the comeback. When I play the fool, you say “nande yanen!”.", "O humor é o bobo e a resposta. Quando eu faço o bobo, você diz «nande yanen!»."]
  - [protagonist, "よかった ね… 遅[おく]れて も 練習[れんしゅう] に なった。", "Good for me… even late, I got some practice.", "Que bom para mim… mesmo atrasada, deu para treinar."]
teach:
  - note: ["Irony in Japanese lives in the tone: «さすが» is praise — as expected of you — but said flat, it means the opposite. «早[はや]い ね» to someone late, «よかった ね…» with a dead voice. Listen to the voice, not only the words.", "A ironia em japonês mora no tom: «さすが» é elogio — como era de se esperar de você — mas dito sem emoção, quer dizer o contrário. «早[はや]い ね» para quem chegou atrasado, «よかった ね…» com voz morta. Escute a voz, não só as palavras."]
  - ask: ["Say: as expected of you.", "Diga: como era de se esperar.", "さすが", sasuga]
  - ask: ["Say it flatly: good for you…", "Diga sem emoção: que bom para você…", "よかった ね…", yokatta-ne]
  - ask: ["Say ironically: you're early.", "Diga com ironia: chegou cedo, hein.", "早[はや]い ね。", hayai-ne]
  - ask: ["Say: irony.", "Diga: ironia.", "皮肉[ひにく]", hiniku]
  - ask: ["Say: just kidding.", "Diga: é brincadeira.", "冗談[じょうだん] だ よ。", joudan-da-yo]
  - ask: ["Say: a straight face.", "Diga: cara séria.", "真面目[まじめ] な 顔[かお]", majime-na-kao]
  - ask: ["Say: suddenly, out of nowhere.", "Diga: do nada.", "いきなり", ikinari]
  - ask: ["Say: comedy.", "Diga: humor.", "お笑[わら]い", owarai]
  - ask: ["Say: the fool's line.", "Diga: a fala do bobo.", "ボケ", boke]
  - ask: ["Say: the comeback.", "Diga: a resposta.", "ツッコミ", tsukkomi]
  - ask: ["Give the Kansai comeback.", "Dê a resposta do Kansai.", "なんで やねん！", nande-yanen]
  - note: ["Japanese stand-up, «漫才[まんざい]», is a pair: the «ボケ» says something silly, the «ツッコミ» hits back — often «なんで やねん！» in Osaka dialect, with a slap on the shoulder. Friends play the roles in everyday talk, too.", "O stand-up japonês, «漫才[まんざい]», é em dupla: o «ボケ» fala uma bobagem, o «ツッコミ» rebate — muitas vezes com «なんで やねん！» no dialeto de Osaka, e um tapinha no ombro. Amigos fazem esses papéis no dia a dia também."]
  - pt_only: "Brasileiro ironiza com um sorrisinho e um «ah, tá». O japonês pode fazer cara de paisagem total — se não entender, pergunte «冗談[じょうだん]？»."
