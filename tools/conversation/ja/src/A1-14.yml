id: A1-14
protagonist: m
title: [Silence, Silêncio]
situation: ["A full train in the morning. Your phone rings loudly. An elderly woman looks at you.", "Trem cheio de manhã. Seu celular toca alto. Uma senhora idosa olha para você."]
learn: []
culture: Phones silent on trains
items:
  - [denwa, "電話[でんわ]", "telephone, phone call", "telefone, ligação"]
  - [keitai, "携帯[けいたい]", "mobile phone", "celular"]
  - [shizuka-ni, "静[しず]か に", "quietly", "em silêncio"]
  - [dekimasen, "できません", "can't (do)", "não pode, não dá"]
  - [mainaa-moodo, "マナー モード", "silent mode", "modo silencioso"]
  - [shimasu, "します", "do", "faço"]
  - [hanasimasen, "話[はな]しません", "don't talk", "não falo"]
  - [shitsurei-shimashita, "失礼[しつれい] しました", "excuse me (for what I did)", "desculpe (pelo que fiz)"]
  - [ki-ni-shinaide, "気[き] に しないで", "don't worry about it", "não se preocupe"]
  - [mukashi, "昔[むかし]", "long ago, in the old days", "antigamente"]
dialogue:
  - [obaasan, "…", "(silence — a look)", "(silêncio — um olhar)"]
  - [protagonist, "すみません！ 失礼[しつれい] しました。", "Sorry! Excuse me.", "Desculpe! Perdão."]
  - [obaasan, "電車[でんしゃ] で は 電話[でんわ] は できません よ。", "You can't make calls on the train.", "No trem não se fala ao telefone."]
  - [protagonist, "はい。 マナー モード に します。", "Yes. I'll put it on silent.", "Sim. Vou pôr no silencioso."]
  - [obaasan, "日本[にほん] の 電車[でんしゃ] は 静[しず]か です から ね。", "Japanese trains are quiet, you see.", "Os trens japoneses são silenciosos, sabe."]
  - [protagonist, "ブラジル で は みんな 話[はな]します。", "In Brazil everyone talks.", "No Brasil todo mundo conversa."]
  - [obaasan, "そう です か。 気[き] に しないで。 昔[むかし] は 私[わたし] も うるさかった です。", "Is that so. Don't worry. I was loud too, long ago.", "É mesmo? Não se preocupe. Antigamente eu também era barulhenta."]
  - [protagonist, "ありがとう ございます。 静[しず]か に します。", "Thank you. I'll be quiet.", "Obrigado. Vou ficar quieto."]
teach:
  - ask: ["Apologise for what you just did.", "Peça desculpas pelo que acabou de fazer.", "失礼[しつれい] しました。", shitsurei-shimashita]
  - note: ["Negative polite verbs end in «ません»: «できます» — can, «できません» — can't; «話[はな]します» — talk, «話[はな]しません» — don't talk.", "Os verbos educados no negativo terminam em «ません»: «できます» — pode, «できません» — não pode; «話[はな]します» — falo, «話[はな]しません» — não falo."]
  - ask: ["Say: on the train you can't make phone calls.", "Diga: no trem não se pode telefonar.", "電車[でんしゃ] で は 電話[でんわ] は できません。", denwa, dekimasen]
  - ask: ["Say: I don't talk.", "Diga: não falo.", "話[はな]しません。", hanasimasen]
  - ask: ["Say: silent mode.", "Diga: modo silencioso.", "マナー モード", mainaa-moodo]
  - ask: ["Say: I'll put it on silent.", "Diga: vou pôr no silencioso.", "マナー モード に します。", mainaa-moodo, shimasu]
  - ask: ["Say: mobile phone.", "Diga: celular.", "携帯[けいたい]", keitai]
  - ask: ["Say: I'll be quiet.", "Diga: vou ficar em silêncio.", "静[しず]か に します。", shizuka-ni, shimasu]
  - ask: ["She says don't worry. How?", "Ela diz para não se preocupar. Como?", "気[き] に しないで。", ki-ni-shinaide]
  - ask: ["Say: long ago.", "Diga: antigamente.", "昔[むかし]", mukashi]
  - note: ["On trains and buses phones are on silent ('manner mode'), no calls, quiet voices. Priority seats near the doors are for elderly, pregnant and disabled people; near them, phones should even be switched off on some lines.", "Em trens e ônibus o celular fica no silencioso ('manner mode'), sem ligações, vozes baixas. Os assentos preferenciais perto das portas são para idosos, grávidas e pessoas com deficiência; perto deles, em algumas linhas, o celular deve até ficar desligado."]
  - pt_only: "A vida social brasileira é barulhenta e na rua; o espaço público japonês é silencioso. Não é frieza — é consideração com quem está perto."
