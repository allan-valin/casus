id: C1-07
protagonist: f
title: ["The in-laws", "Os sogros"]
situation: ["New Year at Shota's parents' farmhouse. His mother hands you an apron; the kitchen is full of women. Shota and his father watch TV.", "Ano-novo na casa de fazenda dos pais do Shota. A mãe dele te entrega um avental; a cozinha está cheia de mulheres. O Shota e o pai veem TV."]
learn: []
culture: —
items:
  - [giri-no-ryoushin, "義理[ぎり] の 両親[りょうしん]", "parents-in-law", "sogros"]
  - [jikka, "実家[じっか]", "(one's) family home", "casa dos pais"]
  - [kisei, "帰省[きせい]", "going home for the holidays", "visitar a terra natal nas festas", {rare: true}]
  - [yome, "嫁[よめ]", "bride; daughter-in-law (old-fashioned)", "nora, esposa (antiquado)"]
  - [kara-koso, "〜から こそ", "precisely because", "justamente porque"]
  - [kazoku-dakara-koso, "家族[かぞく] だ から こそ", "precisely because we're family", "justamente porque somos família"]
  - [tetsudaimasu, "手伝[てつだ]います", "I'll help", "eu ajudo"]
  - [enryo-naku, "遠慮[えんりょ] なく", "without hesitation, feel free", "sem cerimônia"]
  - [yakuwari, "役割[やくわり]", "role", "papel, função"]
  - [kawatte-kita, "変[か]わって きた", "has been changing", "vem mudando"]
dialogue:
  - [shota-haha, "実家[じっか] の 帰省[きせい] で 疲[つか]れた でしょう。 でも、 これ、 お願[ねが]い できる？", "You must be tired from the trip home. But could you help with this?", "Você deve estar cansada da viagem. Mas pode me ajudar com isto?"]
  - [protagonist, "はい、 手伝[てつだ]います。 …あの、 翔太[しょうた] さん は 手伝[てつだ]わない ん です か。", "Yes, I'll help. …Um, doesn't Shota help?", "Claro, eu ajudo. …Hum, o Shota não ajuda?"]
  - [shota-haha, "うち は 昔[むかし] から、 台所[だいどころ] は 女[おんな] の 役割[やくわり] で ね。", "In our family the kitchen has always been the women's role.", "Na nossa família a cozinha sempre foi papel das mulheres."]
  - [protagonist, "ブラジル の 私[わたし] の 実家[じっか] で は、 男[おとこ] も 皿[さら] を 洗[あら]います よ。", "At my family's home in Brazil, the men wash dishes too.", "Na casa dos meus pais no Brasil, os homens também lavam a louça."]
  - [shota, "…聞[き]こえた。 俺[おれ] も やる よ。 お父[とう]さん も。", "…I heard that. I'll do it too. And Dad.", "…Escutei. Eu também faço. O pai também."]
  - [shota-chichi, "え、 わし も？ …まあ、 時代[じだい] は 変[か]わって きた から な。", "What, me too? …Well, times have been changing.", "Ué, eu também? …Bom, os tempos estão mudando."]
  - [shota-haha, "あなた の よう な お嫁[よめ] さん が 来[き]て、 よかった わ。", "I'm glad a bride like you is joining us.", "Que bom que uma nora como você chegou."]
  - [protagonist, "家族[かぞく] だ から こそ、 みんな で やりたい ん です。 遠慮[えんりょ] なく 言[い]って ください ね。", "Precisely because we're family, I want us all to do it together. Please feel free to tell me things.", "Justamente porque somos família, quero que todo mundo faça junto. Pode falar comigo sem cerimônia."]
teach:
  - ask: ["Say: parents-in-law.", "Diga: sogros.", "義理[ぎり] の 両親[りょうしん]", giri-no-ryoushin]
  - ask: ["Say: the family home.", "Diga: a casa dos pais.", "実家[じっか]", jikka]
  - ask: ["Say: going home for the holidays.", "Diga: visitar a terra natal nas festas.", "帰省[きせい]", kisei]
  - ask: ["Offer: I'll help.", "Ofereça: eu ajudo.", "手伝[てつだ]います。", tetsudaimasu]
  - ask: ["Say: role.", "Diga: papel, função.", "役割[やくわり]", yakuwari]
  - ask: ["Say: has been changing.", "Diga: vem mudando.", "変[か]わって きた", kawatte-kita]
  - note: ["«〜から こそ» is precisely because — it puts weight on the reason: «家族[かぞく] だ から こそ、 みんな で やりたい», precisely because we're family, I want us all to do it. Often turns a reason the other way from what's expected.", "«〜から こそ» é justamente porque — dá peso ao motivo: «家族[かぞく] だ から こそ、 みんな で やりたい», justamente porque somos família, quero que todos façam juntos. Muitas vezes vira o motivo para o lado contrário do esperado."]
  - ask: ["Say the pattern: precisely because.", "Diga o padrão: «justamente porque».", "〜から こそ", kara-koso]
  - ask: ["Say: precisely because we're family.", "Diga: justamente porque somos família.", "家族[かぞく] だ から こそ", kazoku-dakara-koso]
  - ask: ["Say: feel free, without hesitation.", "Diga: sem cerimônia.", "遠慮[えんりょ] なく", enryo-naku]
  - ask: ["Say the old word for daughter-in-law.", "Diga a palavra antiga para nora.", "嫁[よめ]", yome]
  - note: ["«嫁[よめ]» — bride, daughter-in-law — once meant a woman who joined her husband's household and served it; many younger people now avoid it and say «妻[つま]» or the name. Gender roles at family gatherings are shifting, but slowly, and varied by family and region.", "«嫁[よめ]» — nora, esposa — já quis dizer a mulher que entrava na casa do marido e a servia; muitos jovens hoje evitam a palavra e dizem «妻[つま]» ou o nome. Os papéis de gênero nas reuniões de família estão mudando, mas devagar, e variam de família para família e de região para região."]
  - pt_only: "No Brasil também tem a cozinha cheia de mulheres no Natal. A diferença é como se puxa a mudança: aqui, sem confronto, com «家族[かぞく] だ から こそ» e um sorriso."
