id: B1-26
protagonist: m
title: ["Birthday", "Aniversário"]
situation: ["Your birthday. Yui brings a small cake; Kenta gave you something at work. Then she reminds you about White Day.", "Seu aniversário. A Yui traz um bolinho; o Kenta te deu algo no trabalho. Depois ela lembra você do White Day."]
learn: []
culture: Return gifts (お返し)
items:
  - [tanjoubi, "誕生日[たんじょうび]", "birthday", "aniversário"]
  - [keeki, "ケーキ", "cake", "bolo"]
  - [purezento, "プレゼント", "present", "presente"]
  - [okaeshi, "お返[かえ]し", "a return gift", "presente de retribuição", {rare: true}]
  - [ageru, "あげる", "give (to others)", "dar (a outra pessoa)"]
  - [morau, "もらう", "receive", "receber, ganhar"]
  - [kureru, "くれる", "give (to me / us)", "dar (para mim / nós)"]
  - [kenta-ga-kureta, "健太[けんた] くん が くれた", "Kenta gave (it to) me", "o Kenta me deu"]
  - [yui-ni-ageru, "由衣[ゆい] に あげる", "give (it) to Yui", "dar para a Yui"]
  - [omedetou-tanjoubi, "誕生日[たんじょうび] おめでとう", "happy birthday", "feliz aniversário"]
  - [howaito-dee, "ホワイト デー", "White Day (14 March)", "White Day (14 de março)", {rare: true}]
dialogue:
  - [yui, "誕生日[たんじょうび] おめでとう！ ケーキ を 作[つく]った よ。", "Happy birthday! I made a cake.", "Feliz aniversário! Fiz um bolo."]
  - [protagonist, "ありがとう！ すごく うれしい。", "Thank you! I'm so happy.", "Obrigado! Fiquei muito feliz."]
  - [yui, "プレゼント、 もう 誰[だれ] か に もらった？", "Have you got presents from anyone yet?", "Já ganhou presente de alguém?"]
  - [protagonist, "健太[けんた] くん が ネクタイ を くれた。 課長[かちょう] から は お菓子[かし] を もらった。", "Kenta gave me a tie. I got sweets from the chief.", "O Kenta me deu uma gravata. Da chefe ganhei doces."]
  - [yui, "これ は 私[わたし] から。 開[あ]けて みて。", "This is from me. Open it.", "Esta é minha. Abre."]
  - [protagonist, "財布[さいふ] だ！ 前[まえ] の は 古[ふる]かった から、 助[たす]かる。", "A wallet! My old one was worn out, so this helps.", "Uma carteira! A antiga estava velha, então ajuda muito."]
  - [yui, "バレンタイン に チョコ を あげた でしょ。 ホワイト デー の お返[かえ]し、 待[ま]って る よ。", "I gave you chocolate on Valentine's, remember. I'm waiting for the White Day return gift.", "Eu te dei chocolate no Dia dos Namorados, lembra? Estou esperando a retribuição do White Day."]
  - [protagonist, "三月[さんがつ] 十四日[じゅうよっか] だ ね。 由衣[ゆい] に 何[なに] を あげよう か な。", "The 14th of March, right. What shall I give you, I wonder.", "14 de março, né? O que será que eu dou para você."]
teach:
  - ask: ["Say: a birthday.", "Diga: aniversário.", "誕生日[たんじょうび]", tanjoubi]
  - ask: ["Wish her: happy birthday.", "Deseje: feliz aniversário.", "誕生日[たんじょうび] おめでとう！", omedetou-tanjoubi]
  - ask: ["Say: a cake.", "Diga: um bolo.", "ケーキ", keeki]
  - ask: ["Say: a present.", "Diga: um presente.", "プレゼント", purezento]
  - note: ["Japanese has three giving verbs. «あげる» — I or someone gives to someone else: «由衣[ゆい] に あげる». «くれる» — someone gives to me or my side: «健太[けんた] くん が くれた». «もらう» — I receive: «課長[かちょう] から もらった». The direction matters more than in Portuguese.", "O japonês tem três verbos de dar. «あげる» — eu ou alguém dá para outra pessoa: «由衣[ゆい] に あげる». «くれる» — alguém dá para mim ou para o meu lado: «健太[けんた] くん が くれた». «もらう» — eu recebo: «課長[かちょう] から もらった». A direção importa mais que em português."]
  - ask: ["Say: give — to someone else.", "Diga: dar — para outra pessoa.", "あげる", ageru]
  - ask: ["Say: give — to me.", "Diga: dar — para mim.", "くれる", kureru]
  - ask: ["Say: receive.", "Diga: receber.", "もらう", morau]
  - ask: ["Say: Kenta gave it to me.", "Diga: o Kenta me deu.", "健太[けんた] くん が くれた。", kenta-ga-kureta]
  - ask: ["Say: I'll give it to Yui.", "Diga: vou dar para a Yui.", "由衣[ゆい] に あげる。", yui-ni-ageru]
  - ask: ["Say: a return gift.", "Diga: presente de retribuição.", "お返[かえ]し", okaeshi]
  - ask: ["Say: White Day.", "Diga: White Day.", "ホワイト デー", howaito-dee]
  - note: ["Gifts in Japan come in pairs: what you receive, you return — «お返[かえ]し», often worth about half. On Valentine's Day women traditionally give chocolate; on White Day, 14 March, men return it. Many people now also give to friends or themselves.", "Presentes no Japão vêm em pares: o que se recebe, se retribui — «お返[かえ]し», muitas vezes de cerca de metade do valor. No Valentine's Day as mulheres tradicionalmente dão chocolate; no White Day, 14 de março, os homens retribuem. Hoje muita gente também dá para amigos ou para si mesma."]
  - pt_only: "No Brasil o Dia dos Namorados é em 12 de junho e os dois trocam presentes no mesmo dia. No Japão é dividido em dois: fevereiro elas dão, março eles devolvem."
