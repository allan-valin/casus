id: C2-05
protagonist: f
title: ["The Enshū dialect", "O dialeto de Enshū"]
situation: ["Five years on, Mrs Suzuki finally speaks to you in her own dialect, 遠州弁 — the speech of the Hamamatsu area.", "Cinco anos depois, a senhora Suzuki finalmente fala com você no próprio dialeto, o 遠州弁 — a fala da região de Hamamatsu."]
learn: []
culture: Hamamatsu's own dialect
items:
  - [enshuu-ben, "遠州[えんしゅう] 弁[べん]", "Enshū dialect (Hamamatsu area)", "dialeto de Enshū (região de Hamamatsu)", {rare: true}]
  - [hougen, "方言[ほうげん]", "dialect", "dialeto"]
  - [yaramaika, "やらまいか", "let's do it! (Enshū spirit)", "vamos fazer! (espírito de Enshū)", {rare: true}]
  - [mai, "〜まい", "let's (Enshū volitional)", "vamos (volitivo de Enshū)"]
  - [dara, "〜だら", "isn't it? right? (= だろう)", "né? não é? (= だろう)"]
  - [dani, "〜だに", "you know, because (= だよ, だから)", "sabe, porque (= だよ, だから)"]
  - [hyojungo, "標準語[ひょうじゅんご]", "standard Japanese", "japonês padrão"]
  - [jimoto, "地元[じもと]", "one's home area", "a terra da gente"]
  - [shitashimi, "親[した]しみ", "familiarity, closeness", "intimidade, proximidade"]
  - [nakama, "仲間[なかま]", "one of us, companion", "um dos nossos"]
dialogue:
  - [suzuki, "今日[きょう] は 暑[あつ]い だら。 冷[つめ]たい お茶[ちゃ]、 飲[の]んで いきまい。", "Hot today, isn't it. Have a cold tea before you go.", "Hoje está quente, né? Toma um chá gelado antes de ir."]
  - [protagonist, "鈴木[すずき] さん、 今[いま] の は 方言[ほうげん] です か。 初[はじ]めて 聞[き]きました。", "Mrs Suzuki, was that dialect? It's the first time I've heard it.", "Senhora Suzuki, isso foi dialeto? É a primeira vez que ouço."]
  - [suzuki, "遠州[えんしゅう] 弁[べん] だに。 今[いま] まで は 標準語[ひょうじゅんご] で 話[はな]して いた けど、 あんた は もう 仲間[なかま] だ で。", "It's Enshū dialect. Till now I spoke standard Japanese to you, but you're one of us now.", "É o dialeto de Enshū. Até agora eu falava o japonês padrão com você, mas agora você é das nossas."]
  - [protagonist, "嬉[うれ]しい！ 「だら」 は「だろう」 です か。", "I'm so glad! Is “dara” the same as “darō”?", "Que alegria! «Dara» é o mesmo que «darō»?"]
  - [suzuki, "そう。「行[い]きまい」 は「行[い]こう」。「やらまいか」 は 浜松[はままつ] の 合言葉[あいことば] だ よ。", "Yes. “Ikimai” is “let's go”. And “yaramaika” is Hamamatsu's motto.", "Isso. «Ikimai» é «vamos». E «yaramaika» é o lema de Hamamatsu."]
  - [protagonist, "やらまいか… 「やって みよう」 です ね。", "Yaramaika… “let's give it a go”.", "Yaramaika… «vamos tentar»."]
  - [suzuki, "浜松[はままつ] の 会社[かいしゃ] は みんな、 その 気持[きも]ち で 始[はじ]まった だに。", "All the Hamamatsu companies started with that spirit.", "Todas as empresas de Hamamatsu começaram com esse espírito."]
  - [protagonist, "方言[ほうげん] で 話[はな]して もらえる と、 親[した]しみ を 感[かん]じます。 地元[じもと] に なった みたい。", "When you speak dialect to me, I feel close. Like this has become my home.", "Quando a senhora fala em dialeto comigo, sinto intimidade. Parece que virou a minha terra."]
teach:
  - ask: ["Say: a dialect.", "Diga: um dialeto.", "方言[ほうげん]", hougen]
  - ask: ["Say: Enshū dialect.", "Diga: o dialeto de Enshū.", "遠州[えんしゅう] 弁[べん]", enshuu-ben]
  - ask: ["Say: standard Japanese.", "Diga: japonês padrão.", "標準語[ひょうじゅんご]", hyojungo]
  - note: ["Enshū dialect, around Hamamatsu, has easy markers: «〜だら» for «だろう» (isn't it?); «〜まい» for «〜よう» (let's — «行[い]きまい», «飲[の]んで いきまい»); «〜だに» for «だよ» or «だから». The famous «やらまいか» means let's do it — a local motto of enterprise.", "O dialeto de Enshū, na região de Hamamatsu, tem marcas fáceis: «〜だら» no lugar de «だろう» (não é?); «〜まい» no lugar de «〜よう» (vamos — «行[い]きまい», «飲[の]んで いきまい»); «〜だに» no lugar de «だよ» ou «だから». O famoso «やらまいか» quer dizer vamos fazer — um lema local de iniciativa."]
  - ask: ["Say the Enshū: isn't it?", "Diga o de Enshū: não é?", "〜だら", dara]
  - ask: ["Say the Enshū: let's.", "Diga o de Enshū: vamos.", "〜まい", mai]
  - ask: ["Say the Enshū: you know.", "Diga o de Enshū: sabe.", "〜だに", dani]
  - ask: ["Say Hamamatsu's motto.", "Diga o lema de Hamamatsu.", "やらまいか", yaramaika]
  - ask: ["Say: one of us.", "Diga: um dos nossos.", "仲間[なかま]", nakama]
  - ask: ["Say: one's home area.", "Diga: a terra da gente.", "地元[じもと]", jimoto]
  - ask: ["Say: closeness, familiarity.", "Diga: intimidade.", "親[した]しみ", shitashimi]
  - note: ["Many Japanese switch to standard Japanese with outsiders and to dialect with people they feel close to — so being spoken to in dialect is a sign of acceptance. «やらまいか» is linked to the founders of Hamamatsu's motorbike, car and instrument companies.", "Muitos japoneses usam o japonês padrão com quem é de fora e o dialeto com quem sentem próximo — por isso ouvir o dialeto é sinal de aceitação. O «やらまいか» é associado aos fundadores das empresas de motos, carros e instrumentos de Hamamatsu."]
  - pt_only: "É como quando o mineiro solta o «uai» ou o gaúcho o «bah» com você: virou de casa."
