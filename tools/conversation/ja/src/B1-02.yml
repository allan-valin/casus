id: B1-02
protagonist: m
title: ["What do you think?", "O que você acha?"]
situation: ["Lunch on the factory roof. Kenta asks what you really think of Hamamatsu after almost a year.", "Almoço no terraço da fábrica. O Kenta pergunta o que você realmente acha de Hamamatsu depois de quase um ano."]
learn: [n4-063]
culture: Opinions softened
items:
  - [to-omou, "〜と 思[おも]う", "I think (casual)", "acho que (informal)"]
  - [benri, "便利[べんり]", "convenient", "prático, conveniente"]
  - [fuben, "不便[ふべん]", "inconvenient", "inconveniente"]
  - [shoujiki, "正直[しょうじき]", "honestly", "sinceramente"]
  - [shoujiki-ni-iu-to, "正直[しょうじき] に 言[い]う と", "to be honest", "para ser sincero"]
  - [kuruma, "車[くるま]", "car", "carro"]
  - [inaka, "田舎[いなか]", "the countryside", "o interior, a roça"]
  - [tokai, "都会[とかい]", "the city (big city)", "cidade grande"]
  - [chotto-fuben-kana, "ちょっと 不便[ふべん] か な", "maybe a bit inconvenient", "talvez um pouco inconveniente"]
  - [kana, "〜か な", "I wonder; maybe", "será que; talvez"]
  - [suki-ni-natta, "好[す]き に なった", "I've come to like it", "passei a gostar"]
dialogue:
  - [kenta, "浜松[はままつ]、 どう？ 正直[しょうじき] に 言[い]って。", "How's Hamamatsu? Be honest.", "E aí, Hamamatsu? Fala a verdade."]
  - [protagonist, "正直[しょうじき] に 言[い]う と… 電車[でんしゃ] が 少[すく]ない から、 ちょっと 不便[ふべん] か な。", "To be honest… there aren't many trains, so maybe a bit inconvenient.", "Para ser sincero… tem pouco trem, então talvez seja meio inconveniente."]
  - [kenta, "そう だ ね。 浜松[はままつ] は 車[くるま] の 町[まち] だ から。", "True. Hamamatsu's a car town.", "É verdade. Hamamatsu é cidade de carro."]
  - [protagonist, "でも スーパー も 病院[びょういん] も 近[ちか]くて、 便利[べんり] だ と 思[おも]う。", "But the supermarket and hospital are close, so I think it's convenient.", "Mas o mercado e o hospital são perto, então acho prático."]
  - [kenta, "東京[とうきょう] と 比[くら]べたら、 田舎[いなか] でしょ。", "Compared with Tokyo, it's the countryside, right?", "Comparado com Tóquio, é interior, né?"]
  - [protagonist, "都会[とかい] じゃ ない けど、 それ が いい と 思[おも]う。 静[しず]か だし。", "It's not a big city, but I think that's good. It's quiet.", "Não é cidade grande, mas acho que isso é bom. É tranquilo."]
  - [kenta, "よかった。 一年[いちねん] で 帰[かえ]る の？", "Glad to hear. Are you going back after one year?", "Que bom. Vai voltar depois de um ano?"]
  - [protagonist, "わからない。 浜松[はままつ] が 好[す]き に なった から。", "I don't know. I've come to like Hamamatsu.", "Não sei. Passei a gostar de Hamamatsu."]
teach:
  - note: ["Casual opinion: a plain sentence plus «と 思[おも]う». Softer still with «か な» at the end — I wonder, maybe: «ちょっと 不便[ふべん] か な». Japanese wraps a criticism in «ちょっと» and «か な» so it doesn't land too hard.", "Opinião informal: frase simples mais «と 思[おも]う». Mais suave ainda com «か な» no fim — será, talvez: «ちょっと 不便[ふべん] か な». O japonês embrulha a crítica em «ちょっと» e «か な» para ela não cair pesada."]
  - ask: ["Say the casual pattern: I think…", "Diga o padrão informal: acho que…", "〜と 思[おも]う", to-omou]
  - ask: ["Say: convenient.", "Diga: prático.", "便利[べんり]", benri]
  - ask: ["Say casually: I think it's convenient.", "Diga, informal: acho prático.", "便利[べんり] だ と 思[おも]う。", benri, to-omou]
  - ask: ["Say: inconvenient.", "Diga: inconveniente.", "不便[ふべん]", fuben]
  - ask: ["Say the softener: I wonder, maybe.", "Diga o suavizador: será, talvez.", "〜か な", kana]
  - ask: ["Soften it: maybe a bit inconvenient.", "Suavize: talvez um pouco inconveniente.", "ちょっと 不便[ふべん] か な。", chotto-fuben-kana]
  - ask: ["Say: honestly.", "Diga: sinceramente.", "正直[しょうじき]", shoujiki]
  - ask: ["Say: to be honest…", "Diga: para ser sincero…", "正直[しょうじき] に 言[い]う と", shoujiki-ni-iu-to]
  - ask: ["Say: a car.", "Diga: um carro.", "車[くるま]", kuruma]
  - ask: ["Say: the countryside.", "Diga: o interior.", "田舎[いなか]", inaka]
  - ask: ["Say: a big city.", "Diga: cidade grande.", "都会[とかい]", tokai]
  - ask: ["Say: I've come to like it.", "Diga: passei a gostar.", "好[す]き に なった。", suki-ni-natta]
  - note: ["Hamamatsu is the home of big motorbike, car and musical-instrument makers, and most people drive: buses are few, and the trains run along one line. Even «正直[しょうじき] に» opinions usually keep a «ちょっと».", "Hamamatsu é sede de grandes fabricantes de motos, carros e instrumentos musicais, e quase todo mundo anda de carro: há poucos ônibus, e o trem segue uma linha só. Mesmo opiniões «正直[しょうじき] に» costumam guardar um «ちょっと»."]
  - pt_only: "Brasileiro diz «sinceramente, é ruim» sem medo. Em japonês, mesmo o «sinceramente» vem acolchoado — ouça o «ちょっと» e o «か な» e entenda que a crítica é mais forte do que parece."
