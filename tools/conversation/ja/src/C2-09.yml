id: C2-09
protagonist: f
title: ["Polite requests", "Pedidos educados"]
situation: ["You now lead a team. Hiroto, the newest member, needs to redo a report, stay late once, and cover a client meeting. How do you ask?", "Agora você lidera uma equipe. O Hiroto, o mais novo, precisa refazer um relatório, ficar até mais tarde uma vez e cobrir uma reunião com cliente. Como pedir?"]
learn: []
culture: —
items:
  - [kyoushuku-desu-ga, "恐縮[きょうしゅく] です が", "I'm sorry to ask, but", "desculpe pedir, mas"]
  - [te-itadakemasu-ka, "〜て いただけます か", "could you…? (polite)", "você poderia…? (educado)"]
  - [te-moraeru, "〜て もらえる？", "could you…? (casual)", "dá para…? (informal)"]
  - [onegai-dekimasu-ka, "お願[ねが]い できます か", "could I ask you to…", "posso te pedir…"]
  - [moushiwake-nai-kedo, "申[もう]し訳[わけ] ない けど", "sorry, but (soft)", "desculpa, mas (suave)"]
  - [tasukatta, "助[たす]かった", "that really helped", "ajudou muito"]
  - [tanomu, "頼[たの]む", "ask (a favour), rely on", "pedir, contar com"]
  - [shiji, "指示[しじ]", "instruction", "orientação, instrução"]
  - [teinei-sa, "丁寧[ていねい] さ の 度合[どあ]い", "degree of politeness", "grau de cortesia", {rare: true}]
  - [kouhai, "後輩[こうはい]", "junior (colleague)", "colega mais novo"]
dialogue:
  - [protagonist, "大翔[ひろと] くん、 この 報告書[ほうこくしょ]、 ここ だけ 直[なお]して もらえる？", "Hiroto, could you fix just this part of the report?", "Hiroto, dá para corrigir só esta parte do relatório?"]
  - [hiroto, "はい、 すぐ やります。", "Yes, right away.", "Sim, faço já."]
  - [protagonist, "それ と… 申[もう]し訳[わけ] ない けど、 明日[あした] は 一時間[いちじかん] 残[のこ]って いただけます か。 急[きゅう] な 注文[ちゅうもん] が 入[はい]って。", "And… I'm sorry, but could you stay an hour late tomorrow? An urgent order came in.", "E… desculpa, mas você poderia ficar uma hora a mais amanhã? Entrou um pedido urgente."]
  - [hiroto, "大丈夫[だいじょうぶ] です。", "That's fine.", "Tudo bem."]
  - [protagonist, "最後[さいご] に、 恐縮[きょうしゅく] です が、 金曜日[きんようび] の お客様[きゃくさま] と の 会議[かいぎ] を お願[ねが]い できます か。 私[わたし] が 出張[しゅっちょう] で。", "Lastly, I'm sorry to ask, but could I ask you to cover Friday's client meeting? I'll be on a business trip.", "Por último, desculpe pedir, mas posso te pedir para cobrir a reunião com o cliente na sexta? Eu vou viajar a trabalho."]
  - [hiroto, "えっ、 私[わたし] が 一人[ひとり] で？ …はい、 頑張[がんば]ります。", "What, me alone? …Yes, I'll do my best.", "Quê, eu sozinho? …Certo, vou dar o meu melhor."]
  - [protagonist, "資料[しりょう] と 指示[しじ] は 全部[ぜんぶ] 渡[わた]す から、 安心[あんしん] して。 頼[たの]りに して いる よ。", "I'll give you all the materials and instructions, don't worry. I'm counting on you.", "Passo todo o material e as orientações, fique tranquilo. Conto com você."]
  - [hiroto, "ありがとう ございます。 先輩[せんぱい] の 頼[たの]み方[かた]、 いつも 丁寧[ていねい] です ね。", "Thank you. You always ask so politely.", "Obrigado. O seu jeito de pedir é sempre educado."]
teach:
  - ask: ["Say: a junior colleague.", "Diga: colega mais novo.", "後輩[こうはい]", kouhai]
  - ask: ["Say: an instruction.", "Diga: uma orientação.", "指示[しじ]", shiji]
  - ask: ["Say: to ask a favour.", "Diga: pedir um favor.", "頼[たの]む", tanomu]
  - note: ["Even with a junior, the size of the request sets the politeness: a small fix — «〜て もらえる？»; a bigger favour — «申[もう]し訳[わけ] ない けど、 〜て いただけます か»; a real burden — «恐縮[きょうしゅく] です が、 〜を お願[ねが]い できます か». The «degree of politeness» tracks the weight, not just rank.", "Mesmo com um subordinado, o tamanho do pedido define a cortesia: uma correção pequena — «〜て もらえる？»; um favor maior — «申[もう]し訳[わけ] ない けど、 〜て いただけます か»; um peso de verdade — «恐縮[きょうしゅく] です が、 〜を お願[ねが]い できます か». O grau de cortesia acompanha o peso, não só a hierarquia."]
  - ask: ["Ask casually: could you…?", "Peça informal: dá para…?", "〜て もらえる？", te-moraeru]
  - ask: ["Soften: sorry, but…", "Suavize: desculpa, mas…", "申[もう]し訳[わけ] ない けど", moushiwake-nai-kedo]
  - ask: ["Ask politely: could you…?", "Peça com educação: você poderia…?", "〜て いただけます か", te-itadakemasu-ka]
  - ask: ["Open a big request: I'm sorry to ask, but…", "Abra um pedido grande: desculpe pedir, mas…", "恐縮[きょうしゅく] です が", kyoushuku-desu-ga]
  - ask: ["Ask: could I ask you to…?", "Pergunte: posso te pedir…?", "お願[ねが]い できます か", onegai-dekimasu-ka]
  - ask: ["Say: the degree of politeness.", "Diga: o grau de cortesia.", "丁寧[ていねい] さ の 度合[どあ]い", teinei-sa]
  - ask: ["Thank him after: that really helped.", "Agradeça depois: ajudou muito.", "助[たす]かった。", tasukatta]
  - pt_only: "Chefe brasileiro às vezes manda: «faz isso aí». No Japão até o chefe pede — e quanto maior o favor, mais longa a frase."
