id: B2-22
protagonist: m
title: ["New Year", "Ano-novo"]
situation: ["New Year's Day with Yui's family: lacquer boxes of osechi, envelopes for the children, then the first shrine visit of the year.", "Dia de Ano-Novo com a família da Yui: caixas laqueadas de osechi, envelopes para as crianças, depois a primeira visita do ano ao santuário."]
learn: []
culture: New Year rituals
items:
  - [oshougatsu, "お正月[しょうがつ]", "New Year (holidays)", "ano-novo (feriado)"]
  - [osechi, "おせち", "New Year food in boxes", "comida de ano-novo em caixas", {rare: true}]
  - [otoshidama, "お年玉[としだま]", "New Year money for children", "dinheiro de ano-novo para as crianças", {rare: true}]
  - [akemashite, "明[あ]けまして おめでとう ございます", "Happy New Year", "feliz ano-novo"]
  - [kotoshi-mo-yoroshiku, "今年[ことし] も よろしく お願[ねが]い します", "I look forward to this year with you too", "conto com você neste ano também"]
  - [uchi-ni, "〜うち に", "while (before it changes)", "enquanto (antes que mude)"]
  - [atatakai-uchi-ni, "温[あたた]かい うち に", "while it's warm", "enquanto está quente"]
  - [ozouni, "お雑煮[ぞうに]", "New Year mochi soup", "sopa de mochi do ano-novo", {rare: true}]
  - [nengajou, "年賀状[ねんがじょう]", "New Year card", "cartão de ano-novo", {rare: true}]
  - [engi, "縁起[えんぎ] が いい", "lucky, auspicious", "dá sorte"]
dialogue:
  - [protagonist, "明[あ]けまして おめでとう ございます。 今年[ことし] も よろしく お願[ねが]い します。", "Happy New Year. I look forward to this year with you too.", "Feliz ano-novo. Conto com vocês neste ano também."]
  - [yui-chichi, "おめでとう。 さあ、 おせち を どうぞ。", "Happy New Year. Now, have some osechi.", "Feliz ano-novo. Vamos, sirva-se de osechi."]
  - [protagonist, "きれい です ね。 一[ひと]つ 一[ひと]つ に 意味[いみ] が ある ん です か。", "It's beautiful. Does every dish mean something?", "Que bonito. Cada coisa tem um significado?"]
  - [yui, "うん。 黒豆[くろまめ] は 健康[けんこう]、 えび は 長生[ながい]き。 全部[ぜんぶ] 縁起[えんぎ] が いい の。", "Yes. Black beans for health, prawns for long life. All lucky.", "É. Feijão-preto é saúde, camarão é vida longa. Tudo dá sorte."]
  - [yui-chichi, "お雑煮[ぞうに] も 温[あたた]かい うち に 食[た]べて ください。", "Have the zōni too, while it's warm.", "Coma o zōni também, enquanto está quente."]
  - [protagonist, "いただきます。 甥[おい]っ子[こ] に お年玉[としだま] を 準備[じゅんび] しました。", "Thank you. I've prepared New Year money for your nephew.", "Obrigado. Preparei o dinheiro de ano-novo para o seu sobrinho."]
  - [yui, "ありがとう！ 混[こ]まない うち に、 初詣[はつもうで] に 行[い]こう。", "Thanks! Let's go for the first shrine visit before it gets crowded.", "Obrigada! Vamos ao santuário antes que lote."]
  - [protagonist, "ブラジル で は 白[しろ]い 服[ふく] を 着[き]て、 海[うみ] で 年[とし] を 越[こ]します よ。", "In Brazil we wear white and see the new year in at the beach.", "No Brasil a gente veste branco e vira o ano na praia."]
teach:
  - ask: ["Say: the New Year holidays.", "Diga: o ano-novo.", "お正月[しょうがつ]", oshougatsu]
  - build: [akemashite, ["おめでとう ございます", "明[あ]けまして おめでとう ございます"]]
  - ask: ["Wish them: Happy New Year.", "Deseje: feliz ano-novo.", "明[あ]けまして おめでとう ございます。", akemashite]
  - ask: ["Add: I look forward to this year with you too.", "Acrescente: conto com vocês neste ano também.", "今年[ことし] も よろしく お願[ねが]い します。", kotoshi-mo-yoroshiku]
  - ask: ["Say: New Year food in boxes.", "Diga: comida de ano-novo em caixas.", "おせち", osechi]
  - ask: ["Say: New Year mochi soup.", "Diga: sopa de mochi do ano-novo.", "お雑煮[ぞうに]", ozouni]
  - ask: ["Say: New Year money for children.", "Diga: dinheiro de ano-novo para as crianças.", "お年玉[としだま]", otoshidama]
  - ask: ["Say: a New Year card.", "Diga: cartão de ano-novo.", "年賀状[ねんがじょう]", nengajou]
  - ask: ["Say: lucky, auspicious.", "Diga: dá sorte.", "縁起[えんぎ] が いい", engi]
  - note: ["«〜うち に» is while — do it before the situation changes: «温[あたた]かい うち に», while it's warm (before it cools); with a negative, «混[こ]まない うち に», before it gets crowded.", "«〜うち に» é enquanto — faça antes que a situação mude: «温[あたた]かい うち に», enquanto está quente (antes que esfrie); com negativo, «混[こ]まない うち に», antes que lote."]
  - ask: ["Say the pattern: while, before it changes.", "Diga o padrão: enquanto, antes que mude.", "〜うち に", uchi-ni]
  - ask: ["Say: while it's warm.", "Diga: enquanto está quente.", "温[あたた]かい うち に", atatakai-uchi-ni]
  - note: ["New Year is Japan's biggest family holiday: «年賀状[ねんがじょう]» cards arrive on 1 January, families eat «おせち» and «お雑煮[ぞうに]», children get «お年玉[としだま]» in little envelopes, and millions make «初詣[はつもうで]», the first shrine visit.", "O ano-novo é o maior feriado de família do Japão: os cartões «年賀状[ねんがじょう]» chegam no dia 1º de janeiro, as famílias comem «おせち» e «お雑煮[ぞうに]», as crianças ganham «お年玉[としだま]» em pequenos envelopes, e milhões fazem o «初詣[はつもうで]», a primeira visita ao santuário."]
  - pt_only: "O nosso réveillon é festa na rua, de branco, com fogos e sete ondas; o ano-novo japonês é quieto, em família, com comida fria e bonita e uma fila no santuário."
