id: C1-19
protagonist: f
title: ["The marriage registration", "O registro de casamento"]
situation: ["You and Shota bring the marriage registration form to city hall. Two witnesses have signed. You also need a document from your consulate.", "Você e o Shota levam o formulário de registro de casamento à prefeitura. Duas testemunhas já assinaram. Você também precisa de um documento do seu consulado."]
learn: []
culture: Registration is the marriage
items:
  - [konintodoke, "婚姻届[こんいんとどけ]", "marriage registration form", "formulário de registro de casamento", {rare: true}]
  - [shounin, "証人[しょうにん]", "witness", "testemunha"]
  - [koseki, "戸籍[こせき]", "family register", "registro familiar", {rare: true}]
  - [shorui, "書類[しょるい]", "documents, paperwork", "documentos"]
  - [kisai, "記入[きにゅう]", "filling in (a form)", "preenchimento"]
  - [teishutsu-review, "提出[ていしゅつ] する", "submit", "entregar"]
  - [ryouji-kan-shoumei, "領事館[りょうじかん] の 証明書[しょうめいしょ]", "consulate certificate", "certidão do consulado"]
  - [juri, "受理[じゅり]", "acceptance (of a filing)", "aceite (do documento)", {rare: true}]
  - [kinenbi, "記念日[きねんび]", "anniversary, memorial day", "data comemorativa"]
  - [fuufu, "夫婦[ふうふ]", "married couple", "casal (casado)"]
dialogue:
  - [madoguchi, "婚姻届[こんいんとどけ] です ね。 証人[しょうにん] 二人[ふたり] の 記入[きにゅう] も ある か、 確認[かくにん] します。", "A marriage registration. I'll check the two witnesses have filled it in.", "Registro de casamento, certo. Vou conferir se as duas testemunhas preencheram."]
  - [shota, "証人[しょうにん] は 健太[けんた] と 鈴木[すずき] さん です。", "The witnesses are Kenta and Mrs Suzuki.", "As testemunhas são o Kenta e a senhora Suzuki."]
  - [madoguchi, "外国籍[がいこくせき] の 方[かた] は、 領事館[りょうじかん] の 証明書[しょうめいしょ] と パスポート も お願[ねが]い します。", "For the foreign spouse, the consulate certificate and passport as well, please.", "Para quem é estrangeiro, a certidão do consulado e o passaporte também, por favor."]
  - [protagonist, "はい、 書類[しょるい] は 全部[ぜんぶ] あります。 日本語[にほんご] の 訳[やく] も 付[つ]けました。", "Yes, I have all the documents. I attached Japanese translations too.", "Sim, estão todos os documentos aqui. Anexei a tradução em japonês também."]
  - [madoguchi, "…はい、 受理[じゅり] しました。 本日[ほんじつ] から ご夫婦[ふうふ] です。 おめでとう ございます。", "…Done, it's accepted. You're married as of today. Congratulations.", "…Pronto, foi aceito. A partir de hoje vocês são casados. Parabéns."]
  - [protagonist, "え、 これ で 結婚[けっこん]？ 式[しき] は まだ な のに。", "What, that's it — we're married? We haven't even had the ceremony.", "Ué, só isso — já estamos casados? E a cerimônia nem aconteceu ainda."]
  - [shota, "日本[にほん] で は 届[とど]け を 出[だ]した 日[ひ] が 結婚[けっこん] 記念日[きねんび] な ん だ よ。 戸籍[こせき] に 記録[きろく] される。", "In Japan the day you file is your wedding anniversary. It's recorded in the family register.", "No Japão o dia da entrega é o aniversário de casamento. Fica registrado no registro familiar."]
  - [protagonist, "じゃあ、 今日[きょう] は 特別[とくべつ] な 日[ひ] だ ね。", "Then today's a special day.", "Então hoje é um dia especial."]
teach:
  - ask: ["Say: the marriage registration form.", "Diga: o formulário de registro de casamento.", "婚姻届[こんいんとどけ]", konintodoke]
  - ask: ["Say: a witness.", "Diga: uma testemunha.", "証人[しょうにん]", shounin]
  - ask: ["Say: filling in a form.", "Diga: preenchimento.", "記入[きにゅう]", kisai]
  - ask: ["Say: documents.", "Diga: documentos.", "書類[しょるい]", shorui]
  - ask: ["Say: the consulate certificate.", "Diga: a certidão do consulado.", "領事館[りょうじかん] の 証明書[しょうめいしょ]", ryouji-kan-shoumei]
  - ask: ["Say: submit.", "Diga: entregar.", "提出[ていしゅつ] する", teishutsu-review]
  - ask: ["Say: acceptance of a filing.", "Diga: o aceite do documento.", "受理[じゅり]", juri]
  - ask: ["Say: the family register.", "Diga: o registro familiar.", "戸籍[こせき]", koseki]
  - ask: ["Say: a married couple.", "Diga: um casal casado.", "夫婦[ふうふ]", fuufu]
  - ask: ["Say: an anniversary.", "Diga: data comemorativa.", "記念日[きねんび]", kinenbi]
  - note: ["Official forms use fixed words: «記入[きにゅう]» fill in, «提出[ていしゅつ]» submit, «受理[じゅり]» accepted, «本日[ほんじつ]» today (formal). In Japan a marriage is legal the moment the «婚姻届[こんいんとどけ]» is accepted at city hall — the ceremony is optional and has no legal weight.", "Os formulários oficiais usam palavras fixas: «記入[きにゅう]» preencher, «提出[ていしゅつ]» entregar, «受理[じゅり]» aceito, «本日[ほんじつ]» hoje (formal). No Japão o casamento é legal no momento em que o «婚姻届[こんいんとどけ]» é aceito na prefeitura — a cerimônia é opcional e não tem valor legal."]
  - note: ["The form needs two adult witnesses. A foreign spouse also brings a passport and a certificate from their consulate showing they are free to marry, with a Japanese translation. Foreigners have no «戸籍[こせき]»; the marriage is recorded in the Japanese spouse's register.", "O formulário precisa de duas testemunhas adultas. O cônjuge estrangeiro leva também o passaporte e uma certidão do consulado mostrando que está livre para casar, com tradução para o japonês. Estrangeiros não têm «戸籍[こせき]»; o casamento fica registrado no do cônjuge japonês."]
  - pt_only: "No Brasil o casamento civil tem juiz de paz, proclamas e cerimônia no cartório. No Japão é um papel entregue no balcão — e depois é preciso registrar o casamento também no consulado brasileiro."
