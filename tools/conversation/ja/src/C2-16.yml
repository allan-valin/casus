id: C2-16
protagonist: m
title: ["The group's anniversary", "O aniversário do grupo"]
situation: ["The taiko group turns twenty. As the new leader you open the anniversary concert; Ōno-sensei, retired, sits in the front row.", "O grupo de taikô faz vinte anos. Como novo líder, você abre o concerto de aniversário; a professora Ōno, aposentada, está na primeira fila."]
learn: []
culture: —
items:
  - [souritsu, "創立[そうりつ]", "founding", "fundação"]
  - [kinen, "記念[きねん]", "commemoration", "comemoração"]
  - [kaiin, "会員[かいいん]", "member", "membro, sócio"]
  - [souritsu-nijuu-shuunen, "創立[そうりつ] 二十[にじゅう] 周年[しゅうねん]", "20th anniversary of the founding", "20º aniversário de fundação", {rare: true}]
  - [hommoku-wa, "本日[ほんじつ] は お忙[いそが]しい 中[なか]", "despite your busy schedules today", "apesar da agenda corrida de hoje"]
  - [goraijou, "ご来場[らいじょう]", "attending (honorific)", "a presença (honorífico)", {rare: true}]
  - [kokoro-yori-kansha, "心[こころ] より 御礼[おんれい] 申[もう]し上[あ]げます", "we thank you from our hearts", "agradecemos de coração", {rare: true}]
  - [rekidai, "歴代[れきだい]", "successive (leaders, members)", "sucessivos, de todas as gerações", {rare: true}]
  - [saigo-made, "最後[さいご] まで", "to the end", "até o fim"]
  - [goyukkuri, "ごゆっくり お楽[たの]しみ ください", "please enjoy (it) at your leisure", "aproveitem à vontade"]
dialogue:
  - [protagonist, "皆様[みなさま]、 本日[ほんじつ] は お忙[いそが]しい 中[なか]、 ご来場[らいじょう] いただき、 誠[まこと] に ありがとう ございます。", "Ladies and gentlemen, thank you so much for coming today despite your busy schedules.", "Senhoras e senhores, muito obrigado por virem hoje, apesar da agenda corrida."]
  - [protagonist, "おかげ さま で、 私[わたし]たち の 太鼓[たいこ] グループ は 創立[そうりつ] 二十[にじゅう] 周年[しゅうねん] を 迎[むか]えました。", "Thanks to you, our taiko group has reached its twentieth anniversary.", "Graças a vocês, o nosso grupo de taikô chega ao vigésimo aniversário de fundação."]
  - [protagonist, "歴代[れきだい] の 会員[かいいん]、 そして 大野[おおの] 先生[せんせい] に、 心[こころ] より 御礼[おんれい] 申[もう]し上[あ]げます。", "To all the members across the years, and to Ōno-sensei, we offer our heartfelt thanks.", "A todos os membros de todas as gerações, e à professora Ōno, agradecemos de coração."]
  - [taiko-sensei, "みんな、 立派[りっぱ] に なった わ ね。", "You've all grown so much.", "Como vocês cresceram."]
  - [protagonist, "今日[きょう] は 子供[こども] から 八十代[はちじゅうだい] まで、 三[みっ]つ の 世代[せだい] が 一緒[いっしょ] に 叩[たた]きます。", "Today three generations, from children to people in their eighties, drum together.", "Hoje três gerações, das crianças aos oitentões, tocam juntas."]
  - [kenta, "陽菜[ひな] も 初[はじ]めて の 本番[ほんばん] です！", "It's Hina's first performance too!", "É a primeira apresentação da Hina também!"]
  - [protagonist, "記念[きねん] の 演奏[えんそう]、 最後[さいご] まで ごゆっくり お楽[たの]しみ ください。", "Please enjoy our anniversary performance to the very end.", "Aproveitem à vontade a nossa apresentação comemorativa até o fim."]
  - [taiko-sensei, "立派[りっぱ] な 挨拶[あいさつ] でした よ。", "That was a fine speech.", "Foi um belo discurso."]
teach:
  - ask: ["Say: the founding.", "Diga: a fundação.", "創立[そうりつ]", souritsu]
  - ask: ["Say: the 20th anniversary of the founding.", "Diga: 20º aniversário de fundação.", "創立[そうりつ] 二十[にじゅう] 周年[しゅうねん]", souritsu-nijuu-shuunen]
  - ask: ["Say: commemoration.", "Diga: comemoração.", "記念[きねん]", kinen]
  - ask: ["Say: a member.", "Diga: um membro.", "会員[かいいん]", kaiin]
  - ask: ["Say: successive, across the years.", "Diga: de todas as gerações.", "歴代[れきだい]", rekidai]
  - note: ["Ceremony openings follow a script: «本日[ほんじつ] は お忙[いそが]しい 中[なか]、 ご来場[らいじょう] いただき、 誠[まこと] に ありがとう ございます», then «おかげ さま で…», thanks «心[こころ] より 御礼[おんれい] 申[もう]し上[あ]げます», and close with «ごゆっくり お楽[たの]しみ ください».", "As aberturas de cerimônia seguem um roteiro: «本日[ほんじつ] は お忙[いそが]しい 中[なか]、 ご来場[らいじょう] いただき、 誠[まこと] に ありがとう ございます», depois «おかげ さま で…», os agradecimentos «心[こころ] より 御礼[おんれい] 申[もう]し上[あ]げます», e o fecho «ごゆっくり お楽[たの]しみ ください»."]
  - ask: ["Open: despite your busy schedules today…", "Abra: apesar da agenda corrida de hoje…", "本日[ほんじつ] は お忙[いそが]しい 中[なか]", hommoku-wa]
  - ask: ["Say: attending — honorific.", "Diga: a presença — honorífico.", "ご来場[らいじょう]", goraijou]
  - ask: ["Thank them: from our hearts.", "Agradeça: de coração.", "心[こころ] より 御礼[おんれい] 申[もう]し上[あ]げます。", kokoro-yori-kansha]
  - ask: ["Say: to the end.", "Diga: até o fim.", "最後[さいご] まで", saigo-made]
  - ask: ["Close: please enjoy at your leisure.", "Feche: aproveitem à vontade.", "ごゆっくり お楽[たの]しみ ください。", goyukkuri]
  - pt_only: "Cinco anos atrás você aprendia a segurar a baqueta. Hoje abre o concerto — com a fórmula certa e a professora aplaudindo da plateia."
