id: A2-15
protagonist: f
title: [Music, Música]
situation: ["Mrs Suzuki plays an old record and sings along. Enka, she says — the songs of her youth.", "A senhora Suzuki põe um disco antigo e canta junto. Enka, diz ela — as músicas da juventude dela."]
learn: [n5-011, n5-012]
culture: —
items:
  - [enka, "演歌[えんか]", "enka (sentimental ballads)", "enka (baladas sentimentais)", {rare: true}]
  - [kashi, "歌詞[かし]", "lyrics", "letra (de música)", {rare: true}]
  - [shouwa, "昭和[しょうわ]", "the Showa era (1926–1989)", "a era Showa (1926–1989)", {rare: true}]
  - [ongaku, "音楽[おんがく]", "music", "música"]
  - [kikimasu-listen, "聴[き]きます", "listen (to music)", "escuto"]
  - [kanashii, "悲[かな]しい", "sad", "triste"]
  - [ii-kyoku-desu-ne, "いい 曲[きょく] です ね", "it's a good song, isn't it", "que música boa, não é"]
  - [natsukashii, "懐[なつ]かしい", "it brings back memories", "que saudade, que nostalgia"]
  - [desu-yo, "〜です よ", "(I'm telling you) …", "(te digo que) …"]
  - [wakai-koro, "若[わか]い 頃[ころ]", "when (I was) young", "quando (eu era) jovem"]
dialogue:
  - [suzuki, "この 歌[うた]、 懐[なつ]かしい わ。 若[わか]い 頃[ころ] に よく 聴[き]きました。", "This song brings back memories. I listened to it a lot when I was young.", "Esta música me dá saudade. Eu ouvia muito quando era jovem."]
  - [protagonist, "何[なん] の 音楽[おんがく] です か。", "What kind of music is it?", "Que música é essa?"]
  - [suzuki, "演歌[えんか] です よ。 昭和[しょうわ] の 歌[うた] です。", "It's enka. A song from the Showa era.", "É enka. Uma música da era Showa."]
  - [protagonist, "ちょっと 悲[かな]しい です ね。", "It's a bit sad, isn't it.", "É meio triste, né?"]
  - [suzuki, "ええ、 歌詞[かし] は 別[わか]れ の 話[はなし] です よ。", "Yes, the lyrics are about a parting.", "É, a letra fala de uma despedida."]
  - [protagonist, "でも、 いい 曲[きょく] です ね。 ブラジル の サウダージ みたい。", "But it's a good song. Like Brazilian saudade.", "Mas é uma música boa. Parece a saudade brasileira."]
  - [suzuki, "サウダージ？ それ は 何[なん] です か。", "Saudade? What's that?", "Saudade? O que é isso?"]
  - [protagonist, "会[あ]いたい 気持[きも]ち です。 演歌[えんか] と 同[おな]じ です よ。", "The feeling of missing someone. Same as enka, I'm telling you.", "É o sentimento de querer ver alguém. Igual ao enka, viu."]
teach:
  - ask: ["Say: music.", "Diga: música.", "音楽[おんがく]", ongaku]
  - ask: ["Say: I listen to music.", "Diga: escuto música.", "音楽[おんがく] を 聴[き]きます。", kikimasu-listen]
  - ask: ["Say: enka.", "Diga: enka.", "演歌[えんか]", enka]
  - ask: ["Say: the Showa era.", "Diga: a era Showa.", "昭和[しょうわ]", shouwa]
  - ask: ["Say: the lyrics.", "Diga: a letra.", "歌詞[かし]", kashi]
  - ask: ["Say: it's sad.", "Diga: é triste.", "悲[かな]しい です。", kanashii]
  - ask: ["Say: it brings back memories.", "Diga: que nostalgia.", "懐[なつ]かしい。", natsukashii]
  - ask: ["Say: when I was young.", "Diga: quando eu era jovem.", "若[わか]い 頃[ころ]", wakai-koro]
  - note: ["Two little words at the end change the tone. «ね» asks for agreement — «いい 曲[きょく] です ね», good song, isn't it? «よ» tells something the other may not know — «演歌[えんか] です よ», it's enka, I'm telling you. Mrs Suzuki's «わ» is an older, feminine softener.", "Duas palavrinhas no fim mudam o tom. «ね» pede concordância — «いい 曲[きょく] です ね», música boa, não é? «よ» conta algo que o outro talvez não saiba — «演歌[えんか] です よ», é enka, viu. O «わ» da senhora Suzuki é um suavizador feminino, mais antigo."]
  - ask: ["Agree with her: it's a good song, isn't it.", "Concorde com ela: música boa, não é.", "いい 曲[きょく] です ね。", ii-kyoku-desu-ne]
  - ask: ["Tell her, as news: it's the same, I'm telling you.", "Conte a ela, como novidade: é igual, viu.", "同[おな]じ です よ。", desu-yo]
  - note: ["Enka are slow ballads of parting, the sea, the hometown and drink, sung with a trembling voice. They were at their height in the Showa era; many older people still sing them at karaoke.", "Enka são baladas lentas de despedida, mar, terra natal e bebida, cantadas com a voz tremida. Viveram o auge na era Showa; muitos mais velhos ainda cantam no karaokê."]
  - pt_only: "Enka tem algo de samba-canção ou de modão sertanejo: a dor da despedida cantada bem devagar. «懐[なつ]かしい» é o mais perto de saudade que o japonês tem."
