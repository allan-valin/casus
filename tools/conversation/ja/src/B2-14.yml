id: B2-14
protagonist: m
title: ["The difficult boss", "O chefe difícil"]
situation: ["Kenta looks exhausted. His new line leader shouts at him in front of everyone and makes him redo work at night. He's been putting up with it.", "O Kenta está com cara de exausto. O novo líder de linha grita com ele na frente de todos e faz ele refazer o trabalho à noite. Ele está aguentando calado."]
learn: []
culture: Power harassment — a social problem
items:
  - [pawahara, "パワハラ", "power harassment", "assédio moral"]
  - [soudan, "相談[そうだん]", "consultation, talking it over", "conversar, pedir conselho"]
  - [saserareru, "〜させられる", "be made to (against your will)", "ser obrigado a"]
  - [yarinaosaserareta, "やり直[なお]させられた", "was made to redo it", "fui obrigado a refazer"]
  - [donarareru, "怒鳴[どな]られる", "be shouted at", "levar bronca aos gritos"]
  - [madoguchi-soudan, "相談[そうだん] 窓口[まどぐち]", "help desk (for complaints)", "canal de denúncia"]
  - [kiroku, "記録[きろく]", "record", "registro"]
  - [hitori-de, "一人[ひとり] で 抱[かか]え込[こ]まないで", "don't keep it all to yourself", "não guarde tudo sozinho"]
  - [jinji, "人事[じんじ]", "personnel, HR", "recursos humanos, RH"]
  - [hou-de, "法律[ほうりつ] で", "by law", "por lei"]
dialogue:
  - [protagonist, "健太[けんた] くん、 大丈夫[だいじょうぶ]？ 顔色[かおいろ] が 悪[わる]い よ。", "Kenta, are you okay? You look pale.", "Kenta, tudo bem? Você está pálido."]
  - [kenta, "新[あたら]しい 班長[はんちょう] に 毎日[まいにち] みんな の 前[まえ] で 怒鳴[どな]られる ん だ。", "The new line leader shouts at me every day in front of everyone.", "O novo líder de linha grita comigo todo dia na frente de todo mundo."]
  - [protagonist, "それ は ひどい。", "That's awful.", "Que horror."]
  - [kenta, "昨日[きのう] も 夜[よる] 十時[じゅうじ] まで 仕事[しごと] を やり直[なお]させられた。 でも 我慢[がまん] する しか ない。", "Yesterday I was made to redo work until ten at night too. But I've got no choice but to put up with it.", "Ontem também fui obrigado a refazer o trabalho até as dez da noite. Mas não tenho escolha a não ser aguentar."]
  - [protagonist, "我慢[がまん] しない ほう が いい。 それ は パワハラ だ と 思[おも]う。", "Better not to put up with it. I think that's power harassment.", "Melhor não aguentar. Acho que isso é assédio moral."]
  - [kenta, "でも 誰[だれ] に 相談[そうだん] すれば いい？", "But who should I talk to?", "Mas com quem eu converso?"]
  - [protagonist, "会社[かいしゃ] に は 相談[そうだん] 窓口[まどぐち] が ある はず。 法律[ほうりつ] で 決[き]まって いる ん だ よ。 まず 記録[きろく] を つけて。", "The company should have a help desk. It's required by law. First, keep a record.", "A empresa deve ter um canal de denúncia. É exigido por lei. Primeiro, anote tudo."]
  - [kenta, "わかった。 一人[ひとり] で 抱[かか]え込[こ]まない よう に する。", "Okay. I'll try not to keep it all to myself.", "Tá. Vou tentar não guardar tudo sozinho."]
teach:
  - ask: ["Say: power harassment.", "Diga: assédio moral.", "パワハラ", pawahara]
  - ask: ["Say: be shouted at.", "Diga: levar bronca aos gritos.", "怒鳴[どな]られる", donarareru]
  - note: ["The causative-passive is being made to do something: the causative «やり直[なお]させる», make someone redo, plus the passive — «やり直[なお]させられる», be made to redo. «待[ま]たせられる», «飲[の]ませられる»: you didn't want to, someone made you.", "O causativo-passivo é ser obrigado a fazer algo: o causativo «やり直[なお]させる», fazer alguém refazer, mais a passiva — «やり直[なお]させられる», ser obrigado a refazer. «待[ま]たせられる», «飲[の]ませられる»: você não queria, alguém obrigou."]
  - ask: ["Say the ending: be made to.", "Diga a terminação: ser obrigado a.", "〜させられる", saserareru]
  - ask: ["Say: I was made to redo it.", "Diga: fui obrigado a refazer.", "やり直[なお]させられた。", yarinaosaserareta]
  - ask: ["Say: talking it over, consultation.", "Diga: conversar, pedir conselho.", "相談[そうだん]", soudan]
  - ask: ["Say: the company's help desk for complaints.", "Diga: o canal de denúncia da empresa.", "相談[そうだん] 窓口[まどぐち]", madoguchi-soudan]
  - ask: ["Say: HR.", "Diga: o RH.", "人事[じんじ]", jinji]
  - ask: ["Say: a record.", "Diga: um registro.", "記録[きろく]", kiroku]
  - ask: ["Say: by law.", "Diga: por lei.", "法律[ほうりつ] で", hou-de]
  - ask: ["Tell him: don't keep it all to yourself.", "Diga a ele: não guarde tudo sozinho.", "一人[ひとり] で 抱[かか]え込[こ]まないで。", hitori-de]
  - note: ["«パワハラ», power harassment, is abuse using a position of power: shouting, humiliation, impossible tasks. Since 2020 (2022 for smaller firms) the law requires companies to prevent it and to have a place to report it. Keep dates and details, talk to the help desk or HR, and outside the company to a labour consultation centre.", "«パワハラ», assédio moral, é o abuso usando a posição de poder: gritos, humilhação, tarefas impossíveis. Desde 2020 (2022 para empresas menores) a lei obriga as empresas a preveni-lo e a ter um canal de denúncia. Anote datas e detalhes, procure o canal da empresa ou o RH e, fora da empresa, um centro de consulta trabalhista."]
  - pt_only: "No Brasil também há assédio moral, e a Justiça do Trabalho reconhece. No Japão a cultura do «我慢[がまん]» faz muita gente aguentar calada — por isso ouvir de um amigo «não aguenta» ajuda."
