id: A1-08
protagonist: m
title: [The factory, A fábrica]
situation: ["Your first day at the car-parts factory. The section chief, Ms Sato, receives you in the office.", "Seu primeiro dia na fábrica de autopeças. A chefe de seção, a senhora Sato, recebe você no escritório."]
learn: []
culture: Titles, not first names
items:
  - [kaisha, "会社[かいしゃ]", "company", "empresa"]
  - [kachou, "課長[かちょう]", "section chief", "chefe de seção"]
  - [tsuuyaku, "通訳[つうやく]", "interpreter", "intérprete"]
  - [kyou-kara, "今日[きょう] から", "from today", "a partir de hoje"]
  - [hairimasu, "入[はい]ります", "join, enter", "entro, começo"]
  - [shigoto, "仕事[しごと]", "work, job", "trabalho"]
  - [portugarugo, "ポルトガル語[ご]", "Portuguese (language)", "português (língua)"]
  - [eigo, "英語[えいご]", "English", "inglês"]
  - [ganbatte, "頑張[がんば]って ください", "do your best (encouragement)", "força! (incentivo)"]
  - [onegaishimasu-yoroshiku, "どうぞ よろしく お願[ねが]いします", "pleased to meet you (very polite)", "muito prazer (bem formal)"]
dialogue:
  - [sato, "佐藤[さとう] です。 この 課[か] の 課長[かちょう] です。", "I'm Sato. I'm the chief of this section.", "Sou Sato. Sou a chefe desta seção."]
  - [protagonist, "はじめまして。 今日[きょう] から 入[はい]ります。 どうぞ よろしく お願[ねが]いします。", "Nice to meet you. I start today. Pleased to meet you.", "Muito prazer. Começo hoje. Muito prazer em conhecê-la."]
  - [sato, "仕事[しごと] は 通訳[つうやく] です ね。", "Your job is interpreting, right.", "Seu trabalho é de intérprete, né?"]
  - [protagonist, "はい。 ポルトガル語[ご] と 英語[えいご] の 通訳[つうやく] です。", "Yes. Portuguese and English interpreting.", "Sim. Intérprete de português e inglês."]
  - [sato, "この 会社[かいしゃ] は ブラジル の 人[ひと] が 多[おお]い です。", "This company has many Brazilian people.", "Esta empresa tem muitos brasileiros."]
  - [protagonist, "佐藤[さとう] さん…", "Ms Sato…", "Senhora Sato…"]
  - [sato, "会社[かいしゃ] で は 「佐藤[さとう] 課長[かちょう]」 です。", "At the company it's 'Section Chief Sato'.", "Na empresa é 'chefe Sato'."]
  - [protagonist, "失礼[しつれい] しました、 佐藤[さとう] 課長[かちょう]。", "Excuse me, Chief Sato.", "Desculpe, chefe Sato."]
  - [sato, "頑張[がんば]って ください。", "Do your best.", "Força!"]
teach:
  - ask: ["Greet her very politely on your first day.", "Cumprimente-a com muita educação no primeiro dia.", "はじめまして。 どうぞ よろしく お願[ねが]いします。", onegaishimasu-yoroshiku]
  - ask: ["Say: I start today.", "Diga: começo hoje.", "今日[きょう] から 入[はい]ります。", kyou-kara, hairimasu]
  - note: ["«の» joins nouns: «ポルトガル語[ご] の 通訳[つうやく]» — an interpreter of Portuguese; «この 課[か] の 課長[かちょう]» — the chief of this section.", "«の» junta substantivos: «ポルトガル語[ご] の 通訳[つうやく]» — intérprete de português; «この 課[か] の 課長[かちょう]» — a chefe desta seção."]
  - ask: ["Say: I'm a Portuguese interpreter.", "Diga: sou intérprete de português.", "ポルトガル語[ご] の 通訳[つうやく] です。", portugarugo, no-particle, tsuuyaku]
  - ask: ["Say: Portuguese and English.", "Diga: português e inglês.", "ポルトガル語[ご] と 英語[えいご]", portugarugo, eigo]
  - ask: ["Say: my job is interpreting.", "Diga: meu trabalho é de intérprete.", "仕事[しごと] は 通訳[つうやく] です。", shigoto, tsuuyaku]
  - ask: ["Say: the company.", "Diga: a empresa.", "会社[かいしゃ]", kaisha]
  - note: ["At work you call her by her title: «佐藤[さとう] 課長[かちょう]», not «さん», and never her first name.", "No trabalho você a chama pelo cargo: «佐藤[さとう] 課長[かちょう]», não «さん», e nunca pelo primeiro nome."]
  - ask: ["Address her properly.", "Chame-a corretamente.", "佐藤[さとう] 課長[かちょう]", kachou]
  - ask: ["She encourages you. What does she say?", "Ela incentiva você. O que ela diz?", "頑張[がんば]って ください。", ganbatte]
  - pt_only: "No Brasil chamamos o chefe pelo primeiro nome com naturalidade; no Japão o cargo vem com o sobrenome: 佐藤課長."
