id: A2-01
protagonist: f
title: ["What did you do on Sunday?", "O que você fez no domingo?"]
situation: ["Monday morning at the factory gate. Kenta asks about your weekend.", "Segunda de manhã, no portão da fábrica. O Kenta pergunta do seu fim de semana."]
learn: []
culture: —
items:
  - [shuumatsu, "週末[しゅうまつ]", "weekend", "fim de semana"]
  - [kinou, "昨日[きのう]", "yesterday", "ontem"]
  - [ototoi, "一昨日[おととい]", "the day before yesterday", "anteontem"]
  - [ikimashita, "行[い]きました", "went", "fui"]
  - [mimashita, "見[み]ました", "saw, watched", "vi, assisti"]
  - [kaimashita, "買[か]いました", "bought", "comprei"]
  - [nani-shimashita, "何[なに] を しました か", "what did you do?", "o que você fez?"]
  - [nanimo, "何[なに] も しません でした", "I didn't do anything", "não fiz nada"]
  - [yukkuri, "ゆっくり しました", "I took it easy", "descansei, fiquei de boa"]
  - [kaimono, "買[か]い物[もの]", "shopping", "compras"]
  - [eiga, "映画[えいが]", "film", "filme"]
  - [dou-deshita, "どう でした か", "how was it?", "como foi?"]
dialogue:
  - [kenta, "おはよう。 週末[しゅうまつ]、 何[なに] した？", "Morning. What did you do at the weekend?", "Bom dia. O que você fez no fim de semana?"]
  - [protagonist, "土曜日[どようび] は 浜松[はままつ] 駅[えき] に 行[い]きました。 買[か]い物[もの] です。", "On Saturday I went to Hamamatsu station. Shopping.", "No sábado fui à estação de Hamamatsu. Compras."]
  - [kenta, "何[なに] を 買[か]った の？", "What did you buy?", "O que você comprou?"]
  - [protagonist, "冬[ふゆ] の コート を 買[か]いました。 健太[けんた] くん は？", "I bought a winter coat. And you, Kenta?", "Comprei um casaco de inverno. E você, Kenta?"]
  - [kenta, "昨日[きのう] 映画[えいが] を 見[み]た よ。 一昨日[おととい] は 何[なに] も しなかった。", "I saw a film yesterday. The day before, nothing.", "Ontem vi um filme. Anteontem, nada."]
  - [protagonist, "映画[えいが]、 どう でした か。", "How was the film?", "Como foi o filme?"]
  - [kenta, "長[なが]かった けど、 面白[おもしろ]かった。", "Long, but interesting.", "Comprido, mas interessante."]
  - [protagonist, "日曜日[にちようび] は ゆっくり しました。", "On Sunday I took it easy.", "No domingo descansei."]
teach:
  - ask: ["Say: the weekend.", "Diga: o fim de semana.", "週末[しゅうまつ]", shuumatsu]
  - ask: ["Say: yesterday.", "Diga: ontem.", "昨日[きのう]", kinou]
  - ask: ["Say: the day before yesterday.", "Diga: anteontem.", "一昨日[おととい]", ototoi]
  - note: ["The polite past changes «ます» to «ました»: «行[い]きます» → «行[い]きました», went. The negative past is «ません でした»: «しません でした», I didn't do.", "O passado educado troca «ます» por «ました»: «行[い]きます» → «行[い]きました», fui. O passado negativo é «ません でした»: «しません でした», não fiz."]
  - ask: ["Say: I went.", "Diga: eu fui.", "行[い]きました。", ikimashita]
  - ask: ["Say: I watched.", "Diga: eu assisti.", "見[み]ました。", mimashita]
  - ask: ["Say: I bought.", "Diga: eu comprei.", "買[か]いました。", kaimashita]
  - ask: ["Say: shopping.", "Diga: compras.", "買[か]い物[もの]", kaimono]
  - ask: ["Say: a film.", "Diga: um filme.", "映画[えいが]", eiga]
  - ask: ["Say: I saw a film yesterday.", "Diga: ontem vi um filme.", "昨日[きのう] 映画[えいが] を 見[み]ました。", kinou, eiga, mimashita]
  - build: [nani-shimashita, ["しました か", "何[なに] を しました か"]]
  - ask: ["Ask him what he did.", "Pergunte o que ele fez.", "何[なに] を しました か。", nani-shimashita]
  - ask: ["Say you didn't do anything.", "Diga que não fez nada.", "何[なに] も しません でした。", nanimo]
  - ask: ["Say you took it easy.", "Diga que descansou.", "ゆっくり しました。", yukkuri]
  - ask: ["Ask: how was it?", "Pergunte: como foi?", "どう でした か。", dou-deshita]
  - note: ["Kenta talks plain to you now: «何[なに] した？», «見[み]た よ». In A2 you learn that plain past, «〜た»; for now, answer him in the polite form if you like — it is never wrong.", "O Kenta agora fala informal com você: «何[なに] した？», «見[み]た よ». No A2 você aprende esse passado simples, «〜た»; por enquanto pode responder na forma educada — nunca está errado."]
