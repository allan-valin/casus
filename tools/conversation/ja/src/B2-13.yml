id: B2-13
protagonist: f
title: ["The deadline", "O prazo"]
situation: ["The translated safety report was due today at noon. It's 11:30 and you're not done. You go to the department head before he has to ask.", "O relatório de segurança traduzido era para hoje ao meio-dia. São 11h30 e você não terminou. Você vai até o chefe de departamento antes que ele precise perguntar."]
learn: []
culture: —
items:
  - [shimekiri, "締[し]め切[き]り", "deadline", "prazo"]
  - [houkokusho, "報告書[ほうこくしょ]", "report (document)", "relatório (documento)"]
  - [enchou, "延長[えんちょう]", "extension", "prorrogação"]
  - [okurete-moushiwake, "遅[おく]れて 申[もう]し訳[わけ] ありません", "I'm sorry for the delay", "peço desculpas pelo atraso"]
  - [sasete-itadaku, "〜させて いただく", "humbly do (with your permission)", "fazer (com sua permissão, humilde)"]
  - [teishutsu-sasete, "提出[ていしゅつ] させて いただきます", "I'll submit it (with your permission)", "vou entregar (com sua permissão)"]
  - [teishutsu, "提出[ていしゅつ]", "submission", "entrega"]
  - [genin, "原因[げんいん]", "cause", "causa"]
  - [taisaku, "対策[たいさく]", "countermeasure", "medida (para evitar)"]
  - [hayame-ni, "早[はや]め に", "early, in good time", "com antecedência"]
  - [houkoku-renraku-soudan, "報連相[ほうれんそう]", "report, inform, consult", "relatar, informar, consultar", {rare: true}]
dialogue:
  - [protagonist, "部長[ぶちょう]、 申[もう]し訳[わけ] ありません。 報告書[ほうこくしょ] が 締[し]め切[き]り に 間[ま]に合[あ]いません。", "Sir, I'm sorry. The report won't make the deadline.", "Chefe, peço desculpas. O relatório não vai ficar pronto no prazo."]
  - [buchou, "そう か。 どの くらい 遅[おく]れる？", "I see. How late will it be?", "Entendi. Quanto vai atrasar?"]
  - [protagonist, "専門[せんもん] 用語[ようご] の 確認[かくにん] に 時間[じかん] が かかりました。 明日[あした] の 朝[あさ] まで 延長[えんちょう] させて いただけない でしょう か。", "Checking the technical terms took time. Could you allow me until tomorrow morning?", "A conferência dos termos técnicos levou tempo. O senhor me permitiria entregar até amanhã de manhã?"]
  - [buchou, "早[はや]め に 言[い]って くれて、 よかった。 明日[あした] の 九時[くじ] で いい よ。", "Good that you told me early. Nine tomorrow is fine.", "Que bom que avisou cedo. Amanhã às nove está bom."]
  - [protagonist, "ありがとう ございます。 明日[あした] 九時[くじ] に 提出[ていしゅつ] させて いただきます。", "Thank you. I'll submit it at nine tomorrow.", "Obrigada. Entrego amanhã às nove."]
  - [buchou, "原因[げんいん] は わかった。 次[つぎ] の 対策[たいさく] は？", "I understand the cause. What will you do differently next time?", "Entendi a causa. E qual a medida para a próxima?"]
  - [protagonist, "用語集[ようごしゅう] を 作[つく]って、 次[つぎ] から は 三日[みっか] 前[まえ] に 確認[かくにん] させて いただきます。", "I'll make a glossary and, from next time, check three days ahead.", "Vou fazer um glossário e, da próxima vez, confiro três dias antes."]
  - [buchou, "それ が 報連相[ほうれんそう] だ よ。", "That's hō-ren-sō.", "Isso é o hō-ren-sō."]
teach:
  - ask: ["Say: the deadline.", "Diga: o prazo.", "締[し]め切[き]り", shimekiri]
  - ask: ["Say: a report document.", "Diga: um relatório.", "報告書[ほうこくしょ]", houkokusho]
  - ask: ["Apologise: I'm sorry for the delay.", "Peça desculpas: peço desculpas pelo atraso.", "遅[おく]れて 申[もう]し訳[わけ] ありません。", okurete-moushiwake]
  - ask: ["Say: an extension.", "Diga: prorrogação.", "延長[えんちょう]", enchou]
  - note: ["«〜させて いただく» is the humble causative: let me do, with your permission — «提出[ていしゅつ] させて いただきます», I will (humbly) submit it. Asking: «〜させて いただけない でしょう か», would you allow me to…? It's heard everywhere at work, sometimes too much.", "«〜させて いただく» é o causativo humilde: deixe-me fazer, com sua permissão — «提出[ていしゅつ] させて いただきます», vou entregar (com humildade). Pedindo: «〜させて いただけない でしょう か», o senhor me permitiria…? Ouve-se em todo lugar no trabalho, às vezes até demais."]
  - ask: ["Say the humble pattern: with your permission I'll…", "Diga o padrão humilde: com sua permissão, vou…", "〜させて いただく", sasete-itadaku]
  - build: [teishutsu-sasete, ["いただきます", "させて いただきます", "提出[ていしゅつ] させて いただきます"]]
  - ask: ["Say: I'll submit it, with your permission.", "Diga: vou entregar, com sua permissão.", "提出[ていしゅつ] させて いただきます。", teishutsu-sasete]
  - ask: ["Say: submission.", "Diga: entrega.", "提出[ていしゅつ]", teishutsu]
  - ask: ["Say: the cause.", "Diga: a causa.", "原因[げんいん]", genin]
  - ask: ["Say: a countermeasure.", "Diga: uma medida para evitar.", "対策[たいさく]", taisaku]
  - ask: ["Say: early, in good time.", "Diga: com antecedência.", "早[はや]め に", hayame-ni]
  - ask: ["Say: report, inform, consult.", "Diga: relatar, informar, consultar.", "報連相[ほうれんそう]", houkoku-renraku-soudan]
  - note: ["«報連相[ほうれんそう]» — 報告, report; 連絡, inform; 相談, consult — sounds like spinach and is drilled into every new employee: bad news early is better than a surprise late. A delay goes: apologise, give the cause briefly, propose a new time, and say how you'll prevent it.", "«報連相[ほうれんそう]» — 報告, relatar; 連絡, informar; 相談, consultar — soa como espinafre e é martelado em todo funcionário novo: notícia ruim cedo é melhor que surpresa tarde. Um atraso se comunica assim: pedir desculpas, dar a causa em poucas palavras, propor um novo prazo e dizer como vai evitar."]
  - pt_only: "No Brasil às vezes se espera o chefe cobrar. No Japão, avisar antes é a regra de ouro — o atraso perdoa-se, a surpresa não."
