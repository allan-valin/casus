id: C1-04
protagonist: m
title: ["The noisy neighbour", "O vizinho barulhento"]
situation: ["A note appears on your door: complaints about noise late at night. It's your Brazilian friends' Saturday visits. You call the management company.", "Aparece um bilhete na sua porta: reclamação de barulho tarde da noite. São as visitas de sábado dos seus amigos brasileiros. Você liga para a administradora."]
learn: [n2-159]
culture: Complaints by note
items:
  - [souon, "騒音[そうおん]", "noise", "barulho"]
  - [kujou, "苦情[くじょう]", "complaint", "queixa, reclamação"]
  - [kanri-gaisha, "管理[かんり] 会社[がいしゃ]", "management company", "administradora"]
  - [harigami, "張[は]り紙[がみ]", "notice (posted)", "aviso (colado)"]
  - [kanenai, "〜かねない", "could well (bad result)", "pode acabar (resultado ruim)"]
  - [toraburu-ni-nari-kanenai, "トラブル に なり かねない", "could turn into trouble", "pode virar problema"]
  - [kinjo, "近所[きんじょ]", "neighbourhood, neighbours", "vizinhança"]
  - [ki-wo-tsukemasu-review, "以後[いご] 気[き] を つけます", "I'll be careful from now on", "daqui em diante vou tomar cuidado"]
  - [kanri-kiyaku, "管理[かんり] 規約[きやく]", "building rules", "regulamento do prédio", {rare: true}]
  - [yoru-juuji-ikou, "夜[よる] 十時[じゅうじ] 以降[いこう]", "after 10 p.m.", "depois das 22h"]
dialogue:
  - [protagonist, "もしもし、 ドア に 騒音[そうおん] の 張[は]り紙[がみ] が あって…", "Hello, there's a notice about noise on my door…", "Alô, colaram um aviso de barulho na minha porta…"]
  - [madoguchi, "はい、 近所[きんじょ] の 方[かた] から 苦情[くじょう] が ありました。 土曜日[どようび] の 夜[よる] の 話[はな]し声[ごえ] です。", "Yes, we had a complaint from a neighbour. Voices on Saturday nights.", "Sim, um vizinho reclamou. Vozes no sábado à noite."]
  - [protagonist, "すみません。 友達[ともだち] が 来[き]て いました。 直接[ちょくせつ] 謝[あやま]りに 行[い]った ほう が いい です か。", "Sorry. Friends were over. Should I go and apologise in person?", "Desculpe. Uns amigos estavam aqui. É melhor eu ir pedir desculpas pessoalmente?"]
  - [madoguchi, "お気持[きも]ち は わかります が、 直接[ちょくせつ] 行[い]く と トラブル に なり かねません。 こちら から お伝[つた]え します。", "I understand, but going directly could turn into trouble. We'll pass it on.", "Entendo, mas ir direto pode acabar em problema. Nós transmitimos."]
  - [protagonist, "わかりました。 管理[かんり] 規約[きやく] で は 何時[なんじ] まで です か。", "Understood. Until what time do the building rules allow?", "Entendi. Pelo regulamento do prédio, até que horas pode?"]
  - [madoguchi, "夜[よる] 十時[じゅうじ] 以降[いこう] は 静[しず]か に して ください。", "Please keep quiet after 10 p.m.", "Depois das 22h, silêncio, por favor."]
  - [protagonist, "以後[いご] 気[き] を つけます。 ご迷惑[めいわく] を おかけ しました。", "I'll be careful from now on. Sorry for the trouble.", "Daqui em diante vou tomar cuidado. Desculpe o transtorno."]
  - [madoguchi, "ご理解[りかい] ありがとう ございます。", "Thank you for understanding.", "Obrigada pela compreensão."]
teach:
  - ask: ["Say: noise.", "Diga: barulho.", "騒音[そうおん]", souon]
  - ask: ["Say: a complaint.", "Diga: uma queixa.", "苦情[くじょう]", kujou]
  - ask: ["Say: a posted notice.", "Diga: um aviso colado.", "張[は]り紙[がみ]", harigami]
  - ask: ["Say: the neighbourhood, the neighbours.", "Diga: a vizinhança.", "近所[きんじょ]", kinjo]
  - ask: ["Say: the management company.", "Diga: a administradora.", "管理[かんり] 会社[がいしゃ]", kanri-gaisha]
  - ask: ["Say: the building rules.", "Diga: o regulamento do prédio.", "管理[かんり] 規約[きやく]", kanri-kiyaku]
  - ask: ["Say: after 10 p.m.", "Diga: depois das 22h.", "夜[よる] 十時[じゅうじ] 以降[いこう]", yoru-juuji-ikou]
  - note: ["«〜かねない» is could well — a bad outcome that might happen: the verb stem plus «かねない». «トラブル に なり かねない», it could turn into trouble. Politely: «〜かねません». Used in warnings, news and careful advice.", "«〜かねない» é pode acabar — um resultado ruim que pode acontecer: radical do verbo mais «かねない». «トラブル に なり かねない», pode virar problema. Educado: «〜かねません». Usado em avisos, notícias e conselhos cuidadosos."]
  - ask: ["Say the pattern: could well (go wrong).", "Diga o padrão: pode acabar (mal).", "〜かねない", kanenai]
  - ask: ["Say: it could turn into trouble.", "Diga: pode virar problema.", "トラブル に なり かねない", toraburu-ni-nari-kanenai]
  - ask: ["Promise: I'll be careful from now on.", "Prometa: daqui em diante vou tomar cuidado.", "以後[いご] 気[き] を つけます。", ki-wo-tsukemasu-review]
  - note: ["Neighbours in Japan rarely knock on your door to complain: a note appears, or the management company calls. Thin walls carry voices, and «夜[よる] 十時[じゅうじ] 以降[いこう]» quiet is a common rule. Going over to argue can make things worse — let the company handle it, and apologise through them.", "No Japão o vizinho raramente bate na porta para reclamar: aparece um bilhete, ou a administradora liga. As paredes finas deixam passar vozes, e silêncio «夜[よる] 十時[じゅうじ] 以降[いこう]» é regra comum. Ir lá discutir pode piorar — deixe a administradora cuidar e peça desculpas por meio dela."]
  - pt_only: "No Brasil a gente resolve com o vizinho no corredor. No Japão o caminho indireto é o educado — o bilhete não é covardia, é cortesia."
