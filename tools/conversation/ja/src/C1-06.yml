id: C1-06
protagonist: m
title: ["A debate in class", "Debate na aula"]
situation: ["Ishida-sensei splits the evening class into sides: should Japan accept more immigrants? You're put on the side you don't agree with.", "O professor Ishida divide a turma em lados: o Japão deve aceitar mais imigrantes? Você cai no lado de que discorda."]
learn: []
culture: —
items:
  - [touron, "討論[とうろん]", "debate", "debate"]
  - [konkyo, "根拠[こんきょ]", "grounds, evidence", "fundamento, base"]
  - [ni-kagirazu, "〜に 限[かぎ]らず", "not only, not limited to", "não só, não apenas"]
  - [nihon-ni-kagirazu, "日本[にほん] に 限[かぎ]らず", "not only in Japan", "não só no Japão"]
  - [shuchou, "主張[しゅちょう]", "argument, claim", "argumento, posição"]
  - [hanron, "反論[はんろん]", "counter-argument", "contra-argumento"]
  - [tachiba, "立場[たちば]", "position, standpoint", "posição, ponto de vista"]
  - [tashika-ni, "確[たし]か に", "admittedly, certainly", "de fato, é verdade que"]
  - [shikashi, "しかし", "however", "no entanto"]
  - [ketsuron-to-shite, "結論[けつろん] と して", "in conclusion", "em conclusão"]
  - [ichiri-aru, "一理[いちり] ある", "there's something in that", "tem razão em parte"]
dialogue:
  - [kouza-sensei, "今日[きょう] は 討論[とうろん] です。 あなた は 反対[はんたい] の 立場[たちば] で 話[はな]して ください。", "Today is a debate. Please speak from the opposing position.", "Hoje é debate. Fale pela posição contrária, por favor."]
  - [protagonist, "自分[じぶん] の 意見[いけん] と 違[ちが]います が… やって みます。", "It's not my own opinion, but… I'll try.", "Não é minha opinião, mas… vou tentar."]
  - [protagonist, "確[たし]か に 人手[ひとで] 不足[ぶそく] は 深刻[しんこく] です。 しかし、 言葉[ことば] や 住宅[じゅうたく] の 支援[しえん] が 足[た]りません。", "Admittedly the labour shortage is serious. However, support with language and housing is lacking.", "É verdade que a falta de mão de obra é séria. No entanto, falta apoio com a língua e a moradia."]
  - [kouza-sensei, "その 主張[しゅちょう] の 根拠[こんきょ] は？", "What are the grounds for that argument?", "Qual é o fundamento desse argumento?"]
  - [protagonist, "私[わたし] 自身[じしん] の 経験[けいけん] です。 日本[にほん] に 限[かぎ]らず、 どの 国[くに] でも 受[う]け入[い]れ の 準備[じゅんび] が 先[さき] です。", "My own experience. Not only in Japan — in any country, preparing to receive people comes first.", "A minha própria experiência. Não só no Japão — em qualquer país, preparar o acolhimento vem primeiro."]
  - [kouza-sensei, "なるほど、 一理[いちり] ある。 では、 反論[はんろん] は？", "I see, there's something in that. Now, any counter-argument?", "Entendo, tem razão em parte. Agora, algum contra-argumento?"]
  - [protagonist, "結論[けつろん] と して、 受[う]け入[い]れ に 反対[はんたい] する の では なく、 準備[じゅんび] なし の 受[う]け入[い]れ に 反対[はんたい] します。", "In conclusion, I'm not against accepting people — I'm against accepting them without preparation.", "Em conclusão, não sou contra acolher — sou contra acolher sem preparo."]
  - [kouza-sensei, "見事[みごと]。 反対[はんたい] の 立場[たちば] から、 賛成[さんせい] に 近[ちか]い 結論[けつろん] に なりました ね。", "Splendid. From the opposing side you reached a conclusion close to being in favour.", "Excelente. Partindo do lado contrário, você chegou a uma conclusão quase a favor."]
teach:
  - ask: ["Say: a debate.", "Diga: um debate.", "討論[とうろん]", touron]
  - ask: ["Say: position, standpoint.", "Diga: posição.", "立場[たちば]", tachiba]
  - ask: ["Say: an argument, a claim.", "Diga: um argumento.", "主張[しゅちょう]", shuchou]
  - ask: ["Ask for the grounds.", "Pergunte pelo fundamento.", "根拠[こんきょ] は？", konkyo]
  - ask: ["Concede a point: admittedly…", "Admita um ponto: é verdade que…", "確[たし]か に", tashika-ni]
  - ask: ["Turn it: however.", "Vire o argumento: no entanto.", "しかし", shikashi]
  - note: ["«〜に 限[かぎ]らず» is not only — widens the claim beyond one case: «日本[にほん] に 限[かぎ]らず、 どの 国[くに] でも», not only in Japan but in any country. Formal; common in speeches and essays.", "«〜に 限[かぎ]らず» é não só — amplia a afirmação além de um caso: «日本[にほん] に 限[かぎ]らず、 どの 国[くに] でも», não só no Japão, mas em qualquer país. Formal; comum em discursos e redações."]
  - ask: ["Say the pattern: not only.", "Diga o padrão: não só.", "〜に 限[かぎ]らず", ni-kagirazu]
  - ask: ["Say: not only in Japan.", "Diga: não só no Japão.", "日本[にほん] に 限[かぎ]らず", nihon-ni-kagirazu]
  - ask: ["Say: a counter-argument.", "Diga: um contra-argumento.", "反論[はんろん]", hanron]
  - ask: ["Grant it: there's something in that.", "Conceda: tem razão em parte.", "一理[いちり] ある。", ichiri-aru]
  - ask: ["Sum up: in conclusion.", "Resuma: em conclusão.", "結論[けつろん] と して", ketsuron-to-shite]
  - note: ["A Japanese debate builds carefully: «確[たし]か に» concedes a point, «しかし» turns it, «根拠[こんきょ]» backs it up, «結論[けつろん] と して» closes. Being assigned the side you don't hold is a classic school and workshop exercise.", "Um debate em japonês se constrói com cuidado: «確[たし]か に» admite um ponto, «しかし» vira o argumento, «根拠[こんきょ]» sustenta, «結論[けつろん] と して» fecha. Defender o lado de que você discorda é um exercício clássico de escola e de oficina."]
  - pt_only: "«É verdade que…, no entanto…» também é a estrutura da redação do Enem. O debate japonês só é mais cerimonioso — e o elogio ao adversário, «一理[いちり] ある», é obrigatório."
