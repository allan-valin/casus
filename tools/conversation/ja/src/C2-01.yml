id: C2-01
protagonist: f
title: ["The speech", "O discurso"]
situation: ["Aya is getting married, and she has asked you to give a speech at the reception. Mrs Suzuki checks your draft for words you must not say.", "A Aya vai casar e pediu que você faça um discurso na festa. A senhora Suzuki revisa o seu rascunho procurando palavras que não se pode dizer."]
learn: []
culture: 忌み言葉
items:
  - [shukuji, "祝辞[しゅくじ]", "congratulatory speech", "discurso de felicitação", {rare: true}]
  - [suenagaku, "末永[すえなが]く", "for ever and ever", "para todo o sempre", {rare: true}]
  - [kadode, "門出[かどで]", "a new start (in life)", "um novo começo (na vida)", {rare: true}]
  - [imikotoba, "忌[い]み言葉[ことば]", "taboo words (for an occasion)", "palavras-tabu (numa ocasião)", {rare: true}]
  - [kireru, "切[き]れる", "be cut, break off", "cortar-se, romper-se"]
  - [wakareru-review, "別[わか]れる", "part, separate", "separar-se"]
  - [kasanegasane, "重[かさ]ね重[がさ]ね", "repeatedly (taboo at weddings)", "repetidamente (tabu em casamentos)"]
  - [musubi, "結[むす]び", "closing (of a speech)", "encerramento (do discurso)"]
  - [oshiawase-ni, "お幸[しあわ]せ に", "be happy", "sejam felizes"]
  - [hare-no-hi, "晴[は]れ の 日[ひ]", "a day of celebration", "um dia de festa"]
dialogue:
  - [suzuki, "「二人[ふたり] の 関係[かんけい] が 切[き]れない よう に」… これ は だめ です よ。", "“So that your bond never breaks”… that one's not allowed.", "«Para que o laço de vocês nunca se rompa»… esta não pode."]
  - [protagonist, "どうして です か。 いい 意味[いみ] です よ。", "Why? It means something good.", "Por quê? O sentido é bom."]
  - [suzuki, "結婚式[けっこんしき] で は「切[き]れる」 や「別[わか]れる」 は 忌[い]み言葉[ことば] です。 否定[ひてい] でも 使[つか]いません。", "At weddings, “break” and “separate” are taboo words. Not even in the negative.", "No casamento, «romper» e «separar» são palavras-tabu. Nem na forma negativa."]
  - [protagonist, "「重[かさ]ね重[がさ]ね お祝[いわ]い 申[もう]し上[あ]げます」 は？", "And “I congratulate you again and again”?", "E «felicito vocês de novo e de novo»?"]
  - [suzuki, "それ も。 重[かさ]ね 言葉[ことば] は 再婚[さいこん] を 思[おも]わせる ので。", "That too. Repeated words suggest remarriage.", "Essa também. Palavra repetida lembra segundo casamento."]
  - [protagonist, "じゃあ、「お二人[ふたり] の 門出[かどで] を 心[こころ] から お祝[いわ]い 申[もう]し上[あ]げます」。", "Then: “From my heart I congratulate you both on your new start.”", "Então: «Do fundo do coração, felicito vocês dois pelo novo começo»."]
  - [suzuki, "いい です ね。 結[むす]び は「末永[すえなが]く お幸[しあわ]せ に」。", "Good. And close with “Be happy for ever and ever.”", "Ótimo. E feche com «Sejam felizes para todo o sempre»."]
  - [protagonist, "晴[は]れ の 日[ひ] に 失礼[しつれい] が ない よう に、 練習[れんしゅう] します。", "I'll practise so I don't put a foot wrong on her big day.", "Vou treinar para não cometer nenhuma gafe no grande dia dela."]
teach:
  - ask: ["Say: a congratulatory speech.", "Diga: discurso de felicitação.", "祝辞[しゅくじ]", shukuji]
  - ask: ["Say: taboo words.", "Diga: palavras-tabu.", "忌[い]み言葉[ことば]", imikotoba]
  - ask: ["Say the taboo word: break off.", "Diga a palavra-tabu: romper-se.", "切[き]れる", kireru]
  - ask: ["Say the taboo word: separate.", "Diga a palavra-tabu: separar-se.", "別[わか]れる", wakareru-review]
  - ask: ["Say the taboo repetition: again and again.", "Diga a repetição-tabu: de novo e de novo.", "重[かさ]ね重[がさ]ね", kasanegasane]
  - ask: ["Say: a new start in life.", "Diga: um novo começo.", "門出[かどで]", kadode]
  - ask: ["Say: for ever and ever.", "Diga: para todo o sempre.", "末永[すえなが]く", suenagaku]
  - ask: ["Close the speech: be happy for ever and ever.", "Feche o discurso: sejam felizes para todo o sempre.", "末永[すえなが]く お幸[しあわ]せ に。", oshiawase-ni]
  - ask: ["Say: the closing of a speech.", "Diga: o encerramento do discurso.", "結[むす]び", musubi]
  - ask: ["Say: a day of celebration.", "Diga: um dia de festa.", "晴[は]れ の 日[ひ]", hare-no-hi]
  - note: ["At weddings, «忌[い]み言葉[ことば]» are avoided even in positive sentences: words of cutting and parting («切[き]れる», «別[わか]れる», «離[はな]れる», «終[お]わる»), and doubled words («重[かさ]ね重[がさ]ね», «たびたび») that suggest a second marriage. Funerals have their own list — there, doubled words suggest more deaths.", "Nos casamentos, as «忌[い]み言葉[ことば]» são evitadas até em frases positivas: palavras de corte e separação («切[き]れる», «別[わか]れる», «離[はな]れる», «終[お]わる») e palavras repetidas («重[かさ]ね重[がさ]ね», «たびたび»), que lembram um segundo casamento. Funerais têm a sua própria lista — lá, a repetição lembra mais mortes."]
  - pt_only: "No Brasil o discurso de padrinho pode ter piada e até lembrança da ex. No Japão cada palavra é checada — e um bom discurso é curto, cheio de fórmulas e sem nenhum «corte»."
