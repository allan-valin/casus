id: C1-16
protagonist: m
title: ["Volunteering", "Voluntariado"]
situation: ["Heavy rain flooded a town in the west of the prefecture. You and Kenta join the volunteers: shovelling mud out of houses.", "Uma chuva forte inundou uma cidade no oeste da província. Você e o Kenta entram no grupo de voluntários: tirar lama das casas com pá."]
learn: [n4-004, n3-047]
culture: —
items:
  - [borantia, "ボランティア", "volunteer", "voluntário"]
  - [saigai, "災害[さいがい]", "disaster", "desastre"]
  - [dorokaki, "泥[どろ] かき", "shovelling mud", "tirar lama", {rare: true}]
  - [shien, "支援[しえん]", "support, aid", "apoio, ajuda"]
  - [nagara-mo, "〜ながら も", "although, while (contrast)", "embora, apesar de"]
  - [tsukarenagara-mo, "疲[つか]れながら も", "although tired", "embora cansado"]
  - [shinsui, "浸水[しんすい]", "flooding (of a house)", "alagamento"]
  - [hisaisha, "被災者[ひさいしゃ]", "disaster victim", "vítima do desastre", {rare: true}]
  - [nagagutsu, "長靴[ながぐつ]", "rubber boots", "galochas"]
  - [netchuushou, "熱中症[ねっちゅうしょう]", "heatstroke", "insolação"]
  - [kokoro-no-kea, "心[こころ] の ケア", "emotional care", "apoio emocional"]
dialogue:
  - [kenta, "長靴[ながぐつ] と マスク、 持[も]って きた？ 泥[どろ] かき は 大変[たいへん] だ よ。", "Did you bring rubber boots and a mask? Shovelling mud is tough.", "Trouxe galochas e máscara? Tirar lama é pesado."]
  - [protagonist, "持[も]って きた。 この 家[いえ] は 一階[いっかい] が 全部[ぜんぶ] 浸水[しんすい] した ん だ ね。", "I did. The whole ground floor of this house flooded.", "Trouxe. O térreo desta casa alagou inteiro."]
  - [hisaisha, "遠[とお]く から 来[き]て くれて、 本当[ほんとう] に ありがとう。", "Thank you so much for coming from far away.", "Muito obrigada por terem vindo de tão longe."]
  - [protagonist, "とんでも ない です。 少[すこ]し でも 支援[しえん] に なれば。", "Not at all. If it's even a little help.", "Imagina. Se for de alguma ajuda."]
  - [kenta, "暑[あつ]い から、 熱中症[ねっちゅうしょう] に 気[き] を つけて。 三十分[さんじゅっぷん] ごと に 休[やす]もう。", "It's hot, watch out for heatstroke. Let's rest every thirty minutes.", "Está quente, cuidado com insolação. Vamos descansar a cada trinta minutos."]
  - [protagonist, "疲[つか]れながら も、 みんな 笑顔[えがお] で 働[はたら]いて いる ね。", "Although they're tired, everyone's working with a smile.", "Embora cansados, todos trabalham sorrindo."]
  - [hisaisha, "家[いえ] は 片付[かたづ]いて も、 心[こころ] は まだ… 話[はなし] を 聞[き]いて くれる だけ で 嬉[うれ]しい。", "Even if the house gets cleared, my heart is still… Just listening to me makes me happy.", "A casa pode até ficar limpa, mas o coração ainda… Só de vocês me ouvirem, já fico feliz."]
  - [protagonist, "心[こころ] の ケア も 大事[だいじ] です ね。 また 来[き]ます。", "Emotional care matters too. I'll come again.", "O apoio emocional também importa. Eu volto."]
teach:
  - ask: ["Say: a disaster.", "Diga: um desastre.", "災害[さいがい]", saigai]
  - ask: ["Say: a volunteer.", "Diga: voluntário.", "ボランティア", borantia]
  - ask: ["Say: flooding of a house.", "Diga: alagamento.", "浸水[しんすい]", shinsui]
  - ask: ["Say: shovelling mud.", "Diga: tirar lama.", "泥[どろ] かき", dorokaki]
  - ask: ["Say: rubber boots.", "Diga: galochas.", "長靴[ながぐつ]", nagagutsu]
  - ask: ["Say: support, aid.", "Diga: apoio.", "支援[しえん]", shien]
  - ask: ["Say: disaster victims.", "Diga: vítimas do desastre.", "被災者[ひさいしゃ]", hisaisha]
  - ask: ["Warn: heatstroke.", "Avise: insolação.", "熱中症[ねっちゅうしょう]", netchuushou]
  - note: ["«〜ながら も» is although — two things that clash at the same time: «疲[つか]れながら も、 笑顔[えがお] で 働[はたら]く», though tired, they work smiling. With adjectives: «狭[せま]いながら も», though small. More written than «けど».", "«〜ながら も» é embora — duas coisas que se contradizem ao mesmo tempo: «疲[つか]れながら も、 笑顔[えがお] で 働[はたら]く», embora cansados, trabalham sorrindo. Com adjetivos: «狭[せま]いながら も», embora pequeno. Mais escrito que «けど»."]
  - ask: ["Say the pattern: although.", "Diga o padrão: embora.", "〜ながら も", nagara-mo]
  - ask: ["Say: although tired.", "Diga: embora cansado.", "疲[つか]れながら も", tsukarenagara-mo]
  - ask: ["Say: emotional care.", "Diga: apoio emocional.", "心[こころ] の ケア", kokoro-no-kea]
  - note: ["After floods and earthquakes, local volunteer centres, «災害[さいがい] ボランティア センター», match volunteers with houses. Bring your own boots, gloves, water and food — you must not burden the town — and register first. Listening to people is part of the work.", "Depois de enchentes e terremotos, os centros locais de voluntariado, «災害[さいがい] ボランティア センター», distribuem os voluntários pelas casas. Leve suas próprias galochas, luvas, água e comida — não pode pesar para a cidade — e faça o cadastro antes. Ouvir as pessoas faz parte do trabalho."]
  - pt_only: "Quem viu as enchentes do Rio Grande do Sul conhece a cena: lama, pá e gente de fora ajudando. No Japão o voluntário chega organizado e autossuficiente."
