id: A1-24
protagonist: m
title: [The sky, O céu]
situation: ["The evening of 7 July. Mrs Suzuki has a bamboo branch at her door and hands you a strip of coloured paper to write a wish on.", "Noite de 7 de julho. A senhora Suzuki tem um galho de bambu na porta e entrega a você uma tira de papel colorido para escrever um desejo."]
learn: [n5-048]
culture: Tanabata wishes
items:
  - [hoshi, "星[ほし]", "star", "estrela"]
  - [tanabata, "七夕[たなばた]", "Tanabata, the star festival (7 July)", "Tanabata, a festa das estrelas (7 de julho)", {rare: true}]
  - [negai, "願[ねが]い", "wish", "desejo"]
  - [sora, "空[そら]", "sky", "céu"]
  - [tsuki, "月[つき]", "moon", "lua"]
  - [yoru, "夜[よる]", "night", "noite"]
  - [tanzaku, "短冊[たんざく]", "paper strip for a wish", "tira de papel para o desejo", {rare: true}]
  - [sasa, "笹[ささ]", "bamboo branch", "galho de bambu", {rare: true}]
  - [kakimasu, "書[か]きます", "write", "escrevo"]
  - [naritai, "なりたい です", "I want to become", "quero ser, quero ficar"]
  - [jouzu-ni, "上手[じょうず] に", "well, skilfully", "bem, com jeito"]
  - [kirei-desu-ne, "きれい です ね", "it's beautiful, isn't it", "que lindo, não é"]
dialogue:
  - [suzuki, "今日[きょう] は 七夕[たなばた] です よ。 願[ねが]い を 書[か]きましょう。", "Today is Tanabata. Let's write wishes.", "Hoje é Tanabata. Vamos escrever desejos."]
  - [protagonist, "七夕[たなばた]？ 何[なん] です か。", "Tanabata? What's that?", "Tanabata? O que é?"]
  - [suzuki, "空[そら] の 二[ふた]つ の 星[ほし] が 一年[いちねん] に 一回[いっかい] 会[あ]います。", "Two stars in the sky meet once a year.", "Duas estrelas no céu se encontram uma vez por ano."]
  - [protagonist, "ロマンチック です ね。 この 紙[かみ] に 書[か]きます か。", "How romantic. Do I write on this paper?", "Que romântico. Escrevo neste papel?"]
  - [suzuki, "はい、 短冊[たんざく] です。 それから 笹[ささ] に つけます。", "Yes, it's a tanzaku. Then you tie it to the bamboo.", "Sim, é um tanzaku. Depois você amarra no bambu."]
  - [protagonist, "じゃあ…「日本語[にほんご] が 上手[じょうず] に なりたい です」。", "Then… “I want to get good at Japanese.”", "Então… «Quero ficar bom em japonês»."]
  - [suzuki, "いい 願[ねが]い です ね。 私[わたし] は「元気[げんき] で いたい」。", "That's a good wish. Mine is “I want to stay healthy”.", "Bom desejo. O meu é «quero continuar com saúde»."]
  - [protagonist, "あ、 月[つき] も 星[ほし] も 見[み]えます。 きれい です ね。", "Oh, you can see the moon and the stars. Beautiful.", "Olha, dá para ver a lua e as estrelas. Que lindo."]
teach:
  - ask: ["Say: a star.", "Diga: uma estrela.", "星[ほし]", hoshi]
  - ask: ["Say: the sky.", "Diga: o céu.", "空[そら]", sora]
  - ask: ["Say: the moon.", "Diga: a lua.", "月[つき]", tsuki]
  - ask: ["Say: night.", "Diga: noite.", "夜[よる]", yoru]
  - note: ["«七夕[たなばた]» on 7 July: an old legend says two stars, the weaver and the cowherd, are lovers kept apart by the Milky Way and may meet only that night. People write wishes on paper strips, «短冊[たんざく]», and hang them on bamboo, «笹[ささ]».", "«七夕[たなばた]» em 7 de julho: uma lenda antiga diz que duas estrelas, a tecelã e o pastor, são namorados separados pela Via Láctea e só podem se encontrar nessa noite. As pessoas escrevem desejos em tiras de papel, «短冊[たんざく]», e penduram no bambu, «笹[ささ]»."]
  - ask: ["Say: Tanabata.", "Diga: Tanabata.", "七夕[たなばた]", tanabata]
  - ask: ["Say: a wish.", "Diga: um desejo.", "願[ねが]い", negai]
  - ask: ["Say: the paper strip.", "Diga: a tira de papel.", "短冊[たんざく]", tanzaku]
  - ask: ["Say: the bamboo branch.", "Diga: o galho de bambu.", "笹[ささ]", sasa]
  - ask: ["Say: I'll write a wish.", "Diga: vou escrever um desejo.", "願[ねが]い を 書[か]きます。", kakimasu]
  - note: ["You know «〜たい です», I want to: «食[た]べたい です». With «なります», become, it is «なりたい です», I want to become. «上手[じょうず] に なりたい» — I want to become good at it.", "Você conhece «〜たい です», quero: «食[た]べたい です». Com «なります», ficar, tornar-se, vira «なりたい です», quero ficar. «上手[じょうず] に なりたい» — quero ficar bom nisso."]
  - ask: ["Write your wish: I want to get good at Japanese.", "Escreva seu desejo: quero ficar bom em japonês.", "日本語[にほんご] が 上手[じょうず] に なりたい です。", jouzu-ni, naritai]
  - ask: ["Look up and say: the stars are beautiful, aren't they.", "Olhe para cima e diga: as estrelas são lindas, não é.", "星[ほし] が きれい です ね。", kirei-desu-ne]
  - pt_only: "Lembra um pouco as fitinhas do Senhor do Bonfim: um desejo amarrado e deixado lá. Mas o tanzaku não espera a fita arrebentar — depois da festa os galhos são levados ou queimados no templo."
