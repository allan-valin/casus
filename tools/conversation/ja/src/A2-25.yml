id: A2-25
protagonist: f
title: [The hairdresser, O cabeleireiro]
situation: ["Your first haircut in Japan. You booked online; the hairdresser asks what you'd like.", "Seu primeiro corte de cabelo no Japão. Você agendou pela internet; a cabeleireira pergunta o que você quer."]
learn: []
culture: —
items:
  - [biyouin, "美容院[びよういん]", "hair salon", "salão de beleza"]
  - [yoyaku, "予約[よやく]", "booking, appointment", "reserva, horário marcado"]
  - [mijikaku, "短[みじか]く", "short (adverb)", "curto (advérbio)"]
  - [maegami, "前髪[まえがみ]", "fringe, bangs", "franja", {rare: true}]
  - [kami, "髪[かみ]", "hair", "cabelo"]
  - [kitte-kudasai, "切[き]って ください", "please cut", "corte, por favor"]
  - [sukoshi-dake, "少[すこ]し だけ", "just a little", "só um pouco"]
  - [karuku, "軽[かる]く", "lightly, lighter", "mais leve"]
  - [kirei-ni, "きれい に", "neatly, nicely", "bonito, caprichado"]
  - [shanpuu, "シャンプー", "shampoo; hair wash", "xampu; lavagem"]
  - [kono-kurai, "この くらい", "about this much", "mais ou menos assim"]
dialogue:
  - [biyoushi, "いらっしゃいませ。 ご予約[よやく] の 方[かた] です ね。", "Welcome. You have a booking, right?", "Bem-vinda. Você tem horário marcado, certo?"]
  - [protagonist, "はい。 カット を お願[ねが]いします。", "Yes. A cut, please.", "Sim. Um corte, por favor."]
  - [biyoushi, "今日[きょう] は どう しましょう か。", "What shall we do today?", "O que vamos fazer hoje?"]
  - [protagonist, "全体[ぜんたい] を 少[すこ]し だけ 短[みじか]く して ください。 この くらい。", "Make it all just a little shorter, please. About this much.", "Deixe tudo só um pouco mais curto, por favor. Mais ou menos assim."]
  - [biyoushi, "前髪[まえがみ] は？", "And the fringe?", "E a franja?"]
  - [protagonist, "前髪[まえがみ] は 軽[かる]く して ください。", "Make the fringe lighter, please.", "Deixe a franja mais leve, por favor."]
  - [biyoushi, "かしこまりました。 まず シャンプー を します ね。", "Certainly. First a hair wash.", "Pois não. Primeiro vamos lavar."]
  - [protagonist, "わあ、 きれい に なりました！ ありがとう ございます。", "Wow, it looks great! Thank you.", "Nossa, ficou lindo! Obrigada."]
teach:
  - ask: ["Say: a hair salon.", "Diga: um salão de beleza.", "美容院[びよういん]", biyouin]
  - ask: ["Say: a booking.", "Diga: horário marcado.", "予約[よやく]", yoyaku]
  - ask: ["Say: hair.", "Diga: cabelo.", "髪[かみ]", kami]
  - ask: ["Say: please cut it.", "Diga: corte, por favor.", "切[き]って ください。", kitte-kudasai]
  - ask: ["Say: the fringe.", "Diga: a franja.", "前髪[まえがみ]", maegami]
  - note: ["An «い» adjective becomes an adverb with «く»: «短[みじか]い» → «短[みじか]く», «軽[かる]い» → «軽[かる]く». With «して ください» it means make it so: «短[みじか]く して ください», make it short. «な» words take «に»: «きれい に».", "Um adjetivo com «い» vira advérbio com «く»: «短[みじか]い» → «短[みじか]く», «軽[かる]い» → «軽[かる]く». Com «して ください» quer dizer deixe assim: «短[みじか]く して ください», deixe curto. Palavras com «な» levam «に»: «きれい に»."]
  - ask: ["Say: short — as an adverb.", "Diga: curto — como advérbio.", "短[みじか]く", mijikaku]
  - ask: ["Say: make it short, please.", "Diga: deixe curto, por favor.", "短[みじか]く して ください。", mijikaku]
  - ask: ["Say: lighter.", "Diga: mais leve.", "軽[かる]く", karuku]
  - ask: ["Say: just a little.", "Diga: só um pouco.", "少[すこ]し だけ", sukoshi-dake]
  - ask: ["Show with your fingers: about this much.", "Mostre com os dedos: mais ou menos assim.", "この くらい", kono-kurai]
  - ask: ["Say: a hair wash.", "Diga: lavagem.", "シャンプー", shanpuu]
  - ask: ["Say: it looks great — it became nice.", "Diga: ficou lindo.", "きれい に なりました。", kirei-ni]
  - note: ["Japanese salons are known for care: a long wash with a head massage, a towel over your face, often a shoulder massage at the end. Bring a photo — it saves a lot of words. No tip, as everywhere.", "Os salões japoneses são famosos pelo capricho: lavagem demorada com massagem na cabeça, uma toalhinha no rosto, muitas vezes massagem nos ombros no fim. Leve uma foto — economiza muita palavra. Sem gorjeta, como em todo lugar."]
  - pt_only: "No Brasil o salão é lugar de conversa solta com a cabeleireira. No Japão pode ser silencioso — e tudo bem: se quiser conversar, eles conversam; se não, respeitam."
