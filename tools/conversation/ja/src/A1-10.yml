id: A1-10
protagonist: m
title: [Numbers, Números]
situation: ["On the line, Kenta counts the parts in a box. You check with him.", "Na linha, o Kenta conta as peças de uma caixa. Você confere com ele."]
learn: []
culture: Counters for things
items:
  - [hitotsu, "ひとつ", "one (thing)", "um (objeto)"]
  - [futatsu, "ふたつ", "two (things)", "dois (objetos)"]
  - [mittsu, "みっつ", "three (things)", "três (objetos)"]
  - [ichi, "一[いち]", "one", "um"]
  - [ni, "二[に]", "two", "dois"]
  - [san, "三[さん]", "three", "três"]
  - [juu, "十[じゅう]", "ten", "dez"]
  - [nanko, "何個[なんこ]", "how many (small things)", "quantos (objetos pequenos)"]
  - [ko, "個[こ]", "(counter for small things)", "(contador para objetos pequenos)"]
  - [hako, "箱[はこ]", "box", "caixa"]
  - [tarimasen, "足[た]りません", "it's not enough, one is missing", "falta, não é suficiente"]
  - [zenbu, "全部[ぜんぶ]", "all", "tudo"]
dialogue:
  - [kenta, "この 箱[はこ] に 部品[ぶひん] が 十[じゅう] 個[こ] あります。", "There are ten parts in this box.", "Nesta caixa há dez peças."]
  - [protagonist, "十[じゅう] 個[こ]？ 数[かぞ]えます。 一[いち]、 二[に]、 三[さん]…", "Ten? I'll count. One, two, three…", "Dez? Vou contar. Um, dois, três…"]
  - [kenta, "全部[ぜんぶ] で 何個[なんこ] です か。", "How many in all?", "Quantas no total?"]
  - [protagonist, "九[きゅう] 個[こ] です。 ひとつ 足[た]りません。", "Nine. One is missing.", "Nove. Falta uma."]
  - [kenta, "本当[ほんとう] です か。 あ、 ここ に ひとつ。", "Really? Oh, here's one.", "Sério? Ah, aqui tem uma."]
  - [protagonist, "じゃあ、 十[じゅう] 個[こ] です ね。", "Then it's ten.", "Então são dez."]
  - [kenta, "次[つぎ] の 箱[はこ] は ふたつ です。", "The next is two boxes.", "As próximas são duas caixas."]
  - [protagonist, "ふたつ… みっつ じゃない です か。", "Two… isn't it three?", "Duas… não são três?"]
teach:
  - note: ["Two ways to count. For things in general: «ひとつ», «ふたつ», «みっつ». With a counter: «一[いち]», «二[に]», «三[さん]» plus the counter, like «個[こ]» for small things.", "Duas maneiras de contar. Para coisas em geral: «ひとつ», «ふたつ», «みっつ». Com contador: «一[いち]», «二[に]», «三[さん]» mais o contador, como «個[こ]» para coisas pequenas."]
  - ask: ["Say: one thing.", "Diga: uma coisa.", "ひとつ", hitotsu]
  - ask: ["Say: two things.", "Diga: duas coisas.", "ふたつ", futatsu]
  - ask: ["Say: three things.", "Diga: três coisas.", "みっつ", mittsu]
  - ask: ["Count to three.", "Conte até três.", "一[いち]、 二[に]、 三[さん]", ichi, ni, san]
  - ask: ["Say: ten (small things).", "Diga: dez (objetos pequenos).", "十[じゅう] 個[こ]", juu, ko]
  - ask: ["Ask how many in all.", "Pergunte quantos no total.", "全部[ぜんぶ] で 何個[なんこ] です か。", zenbu, nanko]
  - ask: ["Say: one is missing.", "Diga: falta um.", "ひとつ 足[た]りません。", hitotsu, tarimasen]
  - ask: ["Say: the box.", "Diga: a caixa.", "箱[はこ]", hako]
  - note: ["Japanese counts with counters: «個[こ]» for small things, «枚[まい]» for flat ones, «本[ほん]» for long ones, «人[にん]» for people. «ひとつ, ふたつ…» works for almost anything when you don't know the counter.", "O japonês conta com contadores: «個[こ]» para coisas pequenas, «枚[まい]» para coisas planas, «本[ほん]» para coisas compridas, «人[にん]» para pessoas. «ひとつ, ふたつ…» serve para quase tudo quando você não sabe o contador."]
