id: B2-27
protagonist: f
title: ["Why not marry?", "Por que não casar?"]
situation: ["Aya is writing a paper on why young Japanese marry less. She interviews you, then Kenta's older cousin, who is doing 婚活.", "A Aya está escrevendo um trabalho sobre por que os jovens japoneses casam menos. Ela entrevista você, e depois a prima mais velha do Kenta, que está fazendo 婚活."]
learn: [n3-023, n2-068]
culture: 婚活 — a social problem
items:
  - [kekkon, "結婚[けっこん]", "marriage", "casamento"]
  - [shoushika, "少子化[しょうしか]", "falling birth rate", "queda da natalidade", {rare: true}]
  - [konkatsu, "婚活[こんかつ]", "marriage hunting", "busca ativa por casamento", {rare: true}]
  - [dokushin, "独身[どくしん]", "single, unmarried", "solteiro"]
  - [monono, "〜ものの", "although (it's true that)", "embora, apesar de"]
  - [kekkon-shitai-monono, "結婚[けっこん] したい ものの", "although I want to marry", "embora eu queira casar"]
  - [keizaiteki, "経済的[けいざいてき] に", "financially", "financeiramente"]
  - [fuan, "不安[ふあん]", "anxiety, insecurity", "insegurança, ansiedade"]
  - [deai, "出会[であ]い", "meeting (someone)", "encontro, conhecer alguém"]
  - [kachikan, "価値観[かちかん]", "values", "valores"]
  - [jiyuu-na-jikan, "自由[じゆう] な 時間[じかん]", "free time", "tempo livre"]
dialogue:
  - [aya, "日本[にほん] では 独身[どくしん] の 人[ひと] が 増[ふ]えて いる ん だ。 どうして だ と 思[おも]う？", "In Japan the number of single people is rising. Why do you think?", "No Japão o número de solteiros está aumentando. Por que você acha?"]
  - [protagonist, "仕事[しごと] が 忙[いそが]しくて、 出会[であ]い が 少[すく]ない から かな。", "Maybe because people are busy at work and have few chances to meet someone.", "Talvez porque o trabalho é corrido e há poucas chances de conhecer alguém."]
  - [aya, "それ も ある。 アンケート で は、 経済的[けいざいてき] な 不安[ふあん] も 多[おお]い。", "That's one reason. In surveys, financial insecurity comes up a lot too.", "Também. Nas pesquisas, a insegurança financeira aparece muito."]
  - [aya, "いとこ の 真理[まり] さん は 婚活[こんかつ] 中[ちゅう]。 結婚[けっこん] したい ものの、 なかなか 合[あ]う 人[ひと] が いない って。", "My cousin Mari is marriage hunting. Although she wants to marry, she says she can't find the right person.", "Minha prima Mari está na busca ativa. Embora queira casar, diz que não acha a pessoa certa."]
  - [protagonist, "価値観[かちかん] が 合[あ]う 人[ひと] を 探[さが]す の は 大変[たいへん] だ よね。", "Finding someone with the same values is hard.", "Achar alguém com os mesmos valores é difícil."]
  - [aya, "自由[じゆう] な 時間[じかん] が 好[す]き で、 結婚[けっこん] しない 人[ひと] も いる。", "Some people don't marry because they like their freedom.", "Tem quem não case porque gosta do tempo livre."]
  - [protagonist, "少子化[しょうしか] も その せい？", "Is the falling birth rate because of that too?", "A queda da natalidade também é por causa disso?"]
  - [aya, "日本[にほん] で は 結婚[けっこん] して から 子供[こども] を 持[も]つ 人[ひと] が ほとんど だ から、 関係[かんけい] は 深[ふか]い よ。", "In Japan almost everyone has children after marrying, so the connection is strong.", "No Japão quase todo mundo só tem filhos depois de casar, então a relação é forte."]
teach:
  - ask: ["Say: marriage.", "Diga: casamento.", "結婚[けっこん]", kekkon]
  - ask: ["Say: single.", "Diga: solteiro.", "独身[どくしん]", dokushin]
  - ask: ["Say: marriage hunting.", "Diga: busca ativa por casamento.", "婚活[こんかつ]", konkatsu]
  - ask: ["Say: the falling birth rate.", "Diga: a queda da natalidade.", "少子化[しょうしか]", shoushika]
  - ask: ["Say: meeting someone.", "Diga: conhecer alguém.", "出会[であ]い", deai]
  - ask: ["Say: values.", "Diga: valores.", "価値観[かちかん]", kachikan]
  - ask: ["Say: financially.", "Diga: financeiramente.", "経済的[けいざいてき] に", keizaiteki]
  - ask: ["Say: insecurity, anxiety.", "Diga: insegurança.", "不安[ふあん]", fuan]
  - note: ["«〜ものの» is although — it grants a fact, then something unexpected follows: «結婚[けっこん] したい ものの、 合[あ]う 人[ひと] が いない», although she wants to marry, she can't find the right person. More written than «けど».", "«〜ものの» é embora — admite um fato e depois vem algo inesperado: «結婚[けっこん] したい ものの、 合[あ]う 人[ひと] が いない», embora queira casar, não acha a pessoa certa. Mais escrito que «けど»."]
  - ask: ["Say the pattern: although.", "Diga o padrão: embora.", "〜ものの", monono]
  - ask: ["Say: although I want to marry.", "Diga: embora eu queira casar.", "結婚[けっこん] したい ものの", kekkon-shitai-monono]
  - ask: ["Say: free time.", "Diga: tempo livre.", "自由[じゆう] な 時間[じかん]", jiyuu-na-jikan]
  - note: ["Fewer Japanese marry, and later, and because almost all children are born within marriage, this drives the falling birth rate. Long hours, insecure jobs and costs weigh on it. «婚活[こんかつ]» — agencies, matchmaking events, apps — grew in response; some cities even run their own.", "Menos japoneses casam, e mais tarde, e como quase todas as crianças nascem dentro do casamento, isso puxa a queda da natalidade. Jornadas longas, empregos instáveis e custos pesam. O «婚活[こんかつ]» — agências, eventos de encontros, aplicativos — cresceu em resposta; algumas prefeituras até organizam os seus."]
  - pt_only: "No Brasil muitos filhos nascem fora do casamento e morar junto é comum. No Japão casamento e filhos andam juntos — por isso menos casamentos são logo menos bebês."
