id: A1-20
protagonist: m
title: [I want…, Eu quero…]
situation: ["After the late shift Kenta takes you to his favourite ramen shop. You order at a ticket machine.", "Depois do turno da noite o Kenta leva você ao lámen preferido dele. Pede-se numa máquina de tíquetes."]
learn: []
culture: Slurping is fine
items:
  - [raamen, "ラーメン", "ramen", "lámen"]
  - [tabetai, "食[た]べたい です", "I want to eat", "quero comer"]
  - [nomitai, "飲[の]みたい です", "I want to drink", "quero beber"]
  - [tai, "〜たい です", "want to (do)", "quero (fazer)"]
  - [karai, "辛[から]い", "spicy hot", "apimentado"]
  - [atsui-food, "熱[あつ]い", "hot (to the touch, food)", "quente (ao toque, comida)"]
  - [kenbaiki, "券売機[けんばいき]", "ticket machine", "máquina de tíquetes", {rare: true}]
  - [oomori, "大盛[おおも]り", "large portion", "porção grande", {rare: true}]
  - [susuru, "すすります", "slurp", "sorver fazendo barulho", {rare: true}]
  - [onaka-suita, "お腹[なか] が 空[す]きました", "I'm hungry", "estou com fome"]
  - [nani-ga-ii, "何[なに] が いい です か", "what's good? what would you like?", "o que é bom? o que você quer?"]
dialogue:
  - [kenta, "お腹[なか] が 空[す]きました ね。 何[なに] が いい です か。", "I'm hungry. What would you like?", "Que fome. O que você quer?"]
  - [protagonist, "辛[から]い ラーメン が 食[た]べたい です。", "I want to eat spicy ramen.", "Quero comer um lámen apimentado."]
  - [kenta, "じゃあ、 券売機[けんばいき] で この ボタン です。 大盛[おおも]り も ありますよ。", "Then it's this button on the ticket machine. There's a large size too.", "Então é este botão na máquina. Tem porção grande também."]
  - [protagonist, "大盛[おおも]り に します。 ビール も 飲[の]みたい です。", "I'll have the large. I want a beer too.", "Vou de porção grande. Quero uma cerveja também."]
  - [kenta, "明日[あした] も 仕事[しごと] です よ。", "We work tomorrow too, you know.", "Amanhã tem trabalho também, hein."]
  - [protagonist, "じゃあ、 お水[みず] で。", "Water, then.", "Então, água."]
  - [kenta, "熱[あつ]い から 気[き] を つけて。 すすって も いい です よ。", "It's hot, careful. You can slurp.", "Está quente, cuidado. Pode sorver fazendo barulho."]
  - [protagonist, "すすって も いい？ ブラジル で は だめ です よ！", "Slurping is okay? In Brazil it's rude!", "Pode fazer barulho? No Brasil é falta de educação!"]
teach:
  - ask: ["Say: I'm hungry.", "Diga: estou com fome.", "お腹[なか] が 空[す]きました。", onaka-suita]
  - ask: ["Ask what he would like.", "Pergunte o que ele quer.", "何[なに] が いい です か。", nani-ga-ii]
  - note: ["To say what you want to do, take the verb's «ます» stem and add «たい です»: «食[た]べます» → «食[た]べたい です» — I want to eat.", "Para dizer o que você quer fazer, tire o «ます» do verbo e acrescente «たい です»: «食[た]べます» → «食[た]べたい です» — quero comer."]
  - ask: ["Say: I want to eat ramen.", "Diga: quero comer lámen.", "ラーメン が 食[た]べたい です。", raamen, tabetai]
  - ask: ["Say: I want to drink a beer.", "Diga: quero beber uma cerveja.", "ビール が 飲[の]みたい です。", nomitai]
  - ask: ["Say: I want to go to Nagoya.", "Diga: quero ir para Nagoya.", "名古屋[なごや] に 行[い]きたい です。", tai]
  - ask: ["Say: spicy.", "Diga: apimentado.", "辛[から]い", karai]
  - ask: ["Warn him: it's hot, careful.", "Avise: está quente, cuidado.", "熱[あつ]い から 気[き] を つけて。", atsui-food]
  - ask: ["Say: the ticket machine.", "Diga: a máquina de tíquetes.", "券売機[けんばいき]", kenbaiki]
  - ask: ["Order the large portion.", "Peça a porção grande.", "大盛[おおも]り に します。", oomori]
  - ask: ["Say: you may slurp.", "Diga: pode sorver fazendo barulho.", "すすって も いい です よ。", susuru]
  - note: ["«暑[あつ]い» is hot weather; «熱[あつ]い» is hot to the touch — same sound, different kanji. Slurping noodles is normal and even shows you enjoy them; it also cools them.", "«暑[あつ]い» é calor do tempo; «熱[あつ]い» é quente ao toque — mesmo som, kanji diferente. Sorver o macarrão com barulho é normal e até mostra que você está gostando; também esfria."]
