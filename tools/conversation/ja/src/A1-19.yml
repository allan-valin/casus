id: A1-19
protagonist: f
title: ["Chotto…", "Chotto…"]
situation: ["You need Friday off for an appointment at the consulate. You ask Chief Sato.", "Você precisa da sexta livre para ir ao consulado. Você pede à chefe Sato."]
learn: [n5-043, n5-044]
culture: Indirect refusals
items:
  - [chotto, "ちょっと…", "a little… (a soft no)", "um pouco… (um não suave)"]
  - [muzukashii-desu, "難[むずか]しい です ね", "that's difficult (often: no)", "é difícil (muitas vezes: não)"]
  - [yasumi, "休[やす]み", "day off, holiday", "folga, feriado"]
  - [kinyoubi, "金曜日[きんようび]", "Friday", "sexta-feira"]
  - [ryoujikan, "領事館[りょうじかん]", "consulate", "consulado"]
  - [kangaete-okimasu, "考[かんが]えて おきます", "I'll think about it", "vou pensar"]
  - [isogashii, "忙[いそが]しい", "busy", "ocupado"]
  - [dou-shite-mo, "どうしても", "no matter what, really need to", "de qualquer jeito, preciso mesmo"]
  - [gozen, "午前[ごぜん]", "morning, a.m.", "manhã, de manhã"]
  - [daijoubu-desu, "大丈夫[だいじょうぶ] です", "that's fine", "tudo bem"]
dialogue:
  - [protagonist, "佐藤[さとう] 課長[かちょう]、 金曜日[きんようび] に 休[やす]み を お願[ねが]いします。", "Chief Sato, I'd like Friday off, please.", "Chefe Sato, queria pedir folga na sexta."]
  - [sato, "金曜日[きんようび] です か。 金曜日[きんようび] は ちょっと…。", "Friday? Friday is a little…", "Sexta? Sexta é meio…"]
  - [protagonist, "領事館[りょうじかん] です。 どうしても…。", "It's the consulate. I really need to…", "É o consulado. Preciso mesmo…"]
  - [sato, "うーん、 金曜日[きんようび] は 忙[いそが]しい です から。 難[むずか]しい です ね。", "Hmm, Friday is busy. It's difficult.", "Hmm, sexta é corrido. Fica difícil."]
  - [protagonist, "午前[ごぜん] だけ は どう です か。", "How about just the morning?", "E só a manhã?"]
  - [sato, "午前[ごぜん] だけ…。 考[かんが]えて おきます。", "Just the morning… I'll think about it.", "Só a manhã… Vou pensar."]
  - [protagonist, "ありがとう ございます。", "Thank you.", "Obrigada."]
  - [sato, "…はい、 午前[ごぜん] なら 大丈夫[だいじょうぶ] です。", "…Yes, the morning is fine.", "…Sim, de manhã tudo bem."]
teach:
  - note: ["Japanese rarely says a flat no. «ちょっと…» with the sentence left open, or «難[むずか]しい です ね», usually means no. Don't push the same request — offer something smaller.", "O japonês raramente diz um não seco. «ちょっと…» com a frase em aberto, ou «難[むずか]しい です ね», em geral, quer dizer não. Não insista no mesmo pedido — ofereça algo menor."]
  - ask: ["She says 'Friday is a little…'. How?", "Ela diz 'sexta é meio…'. Como?", "金曜日[きんようび] は ちょっと…。", kinyoubi, chotto]
  - ask: ["She says it's difficult. What does it really mean?", "Ela diz que é difícil. O que quer dizer de verdade?", "難[むずか]しい です ね。", muzukashii-desu]
  - ask: ["Ask for Friday off.", "Peça folga na sexta.", "金曜日[きんようび] に 休[やす]み を お願[ねが]いします。", yasumi, onegaishimasu]
  - ask: ["Say: it's the consulate.", "Diga: é o consulado.", "領事館[りょうじかん] です。", ryoujikan]
  - ask: ["Say: Friday is busy.", "Diga: sexta é corrido.", "金曜日[きんようび] は 忙[いそが]しい です。", isogashii]
  - ask: ["Offer something smaller: just the morning?", "Ofereça algo menor: só a manhã?", "午前[ごぜん] だけ は どう です か。", gozen, dou-desu-ka]
  - ask: ["She'll think about it. How does she say it?", "Ela vai pensar. Como ela diz?", "考[かんが]えて おきます。", kangaete-okimasu]
  - ask: ["Say: that's fine.", "Diga: tudo bem.", "大丈夫[だいじょうぶ] です。", daijoubu-desu]
  - ask: ["Say: I really need to…", "Diga: preciso mesmo…", "どうしても…。", dou-shite-mo]
  - pt_only: "No Brasil 'vou pensar' às vezes é não; no Japão 考えておきます muitas vezes é não — mas aqui a chefe Sato aceitou a manhã. Ouça o tom e o que vem depois."
