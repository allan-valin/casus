  - note: ["That's the end of C1. You can write in the «で ある» style, handle contracts, taxes, insurance and city hall, speak at funerals and celebrations, debate, interpret between families, and talk about mental health, equality and politics with care. In C2: mastery — dialects, subtle keigo, idioms, humour.", "Fim do C1. Você escreve no estilo «で ある», lida com contratos, impostos, seguros e prefeitura, fala em funerais e comemorações, debate, interpreta entre famílias e conversa com cuidado sobre saúde mental, igualdade e política. No C2: maestria — dialetos, keigo sutil, expressões idiomáticas, humor."]
