id: C1-15
protagonist: f
title: ["The specialist", "O especialista"]
situation: ["A pain that won't go away. The local doctor writes you a referral letter for the university hospital — the wait, the tests, the results.", "Uma dor que não passa. O médico do bairro escreve uma carta de encaminhamento para o hospital universitário — a espera, os exames, os resultados."]
learn: []
culture: Referral fee without a letter
items:
  - [shoukaijou, "紹介状[しょうかいじょう]", "referral letter", "carta de encaminhamento"]
  - [daigaku-byouin, "大学[だいがく] 病院[びょういん]", "university hospital", "hospital universitário"]
  - [machijikan, "待[ま]ち時間[じかん]", "waiting time", "tempo de espera"]
  - [kensa, "検査[けんさ]", "test, examination", "exame"]
  - [shidai, "〜次第[しだい]", "as soon as; depending on", "assim que; dependendo de"]
  - [kekka-ga-de-shidai, "結果[けっか] が 出[で] 次第[しだい]", "as soon as the results are out", "assim que sair o resultado"]
  - [senmon-i, "専門医[せんもんい]", "specialist (doctor)", "médico especialista"]
  - [shoshinryou, "初診料[しょしんりょう]", "first-visit fee", "taxa de primeira consulta", {rare: true}]
  - [yoyaku-review, "予約[よやく] を 取[と]る", "make an appointment", "marcar consulta"]
  - [kakaritsukei, "かかりつけ 医[い]", "family doctor", "médico de família"]
dialogue:
  - [isha, "念[ねん] の ため、 大学[だいがく] 病院[びょういん] で 詳[くわ]しい 検査[けんさ] を 受[う]けて ください。 紹介状[しょうかいじょう] を 書[か]きます。", "To be safe, please get detailed tests at the university hospital. I'll write you a referral.", "Por precaução, faça exames detalhados no hospital universitário. Vou escrever um encaminhamento."]
  - [protagonist, "紹介状[しょうかいじょう] が ない と、 行[い]けない ん です か。", "Can't I go without a referral?", "Sem encaminhamento não dá para ir?"]
  - [isha, "行[い]けます が、 紹介状[しょうかいじょう] なし だ と 特別[とくべつ] な 料金[りょうきん] が かかります。 それに、 かかりつけ 医[い] から の 情報[じょうほう] が ある と、 早[はや]い です。", "You can, but without one there's a special extra fee. And with information from your family doctor, it's quicker.", "Dá, mas sem encaminhamento cobram uma taxa extra. E com as informações do médico de família, é mais rápido."]
  - [protagonist, "待[ま]ち時間[じかん] は 長[なが]い です か。", "Is the wait long?", "A espera é longa?"]
  - [isha, "予約[よやく] を 取[と]って も、 二[に]、 三時間[さんじかん] 待[ま]つ こと も あります。 本[ほん] を 持[も]って 行[い]って ください。", "Even with an appointment you may wait two or three hours. Take a book.", "Mesmo com hora marcada, às vezes se espera duas, três horas. Leve um livro."]
  - [protagonist, "結果[けっか] は いつ わかります か。", "When will I know the results?", "Quando saem os resultados?"]
  - [isha, "検査[けんさ] の 種類[しゅるい] 次第[しだい] です。 結果[けっか] が 出[で] 次第[しだい]、 専門医[せんもんい] から 説明[せつめい] が あります。", "It depends on the type of test. As soon as the results are out, the specialist will explain.", "Depende do tipo de exame. Assim que sair o resultado, o especialista explica."]
  - [protagonist, "わかりました。 少[すこ]し 安心[あんしん] しました。", "I see. I feel a little relieved.", "Entendi. Fiquei um pouco mais tranquila."]
teach:
  - ask: ["Say: a referral letter.", "Diga: carta de encaminhamento.", "紹介状[しょうかいじょう]", shoukaijou]
  - ask: ["Say: the university hospital.", "Diga: o hospital universitário.", "大学[だいがく] 病院[びょういん]", daigaku-byouin]
  - ask: ["Say: your family doctor.", "Diga: o médico de família.", "かかりつけ 医[い]", kakaritsukei]
  - ask: ["Say: a specialist.", "Diga: um especialista.", "専門医[せんもんい]", senmon-i]
  - ask: ["Say: a test, an examination.", "Diga: um exame.", "検査[けんさ]", kensa]
  - ask: ["Say: waiting time.", "Diga: tempo de espera.", "待[ま]ち時間[じかん]", machijikan]
  - ask: ["Say: make an appointment.", "Diga: marcar consulta.", "予約[よやく] を 取[と]る", yoyaku-review]
  - note: ["«〜次第[しだい]» has two meanings. After a verb stem: as soon as — «結果[けっか] が 出[で] 次第[しだい]», as soon as the results are out. After a noun: depending on — «検査[けんさ] の 種類[しゅるい] 次第[しだい]», depending on the type of test.", "«〜次第[しだい]» tem dois sentidos. Depois do radical do verbo: assim que — «結果[けっか] が 出[で] 次第[しだい]», assim que sair o resultado. Depois de substantivo: dependendo de — «検査[けんさ] の 種類[しゅるい] 次第[しだい]», depende do tipo de exame."]
  - ask: ["Say the pattern: as soon as; depending on.", "Diga o padrão: assim que; dependendo de.", "〜次第[しだい]", shidai]
  - ask: ["Say: as soon as the results are out.", "Diga: assim que sair o resultado.", "結果[けっか] が 出[で] 次第[しだい]", kekka-ga-de-shidai]
  - ask: ["Say: the first-visit fee.", "Diga: a taxa de primeira consulta.", "初診料[しょしんりょう]", shoshinryou]
  - note: ["Japan wants patients to see a local clinic first: big hospitals charge an extra fee — several thousand yen — to anyone who comes without a «紹介状[しょうかいじょう]». Waits at university hospitals can be long even with an appointment; your «かかりつけ 医[い]» keeps your history and refers you.", "O Japão quer que o paciente passe primeiro na clínica do bairro: hospitais grandes cobram uma taxa extra — alguns milhares de ienes — de quem chega sem «紹介状[しょうかいじょう]». A espera nos hospitais universitários pode ser longa mesmo com hora marcada; o seu «かかりつけ 医[い]» guarda o histórico e faz o encaminhamento."]
  - pt_only: "Parecido com o SUS, que também pede encaminhamento para o especialista. A diferença é que no Japão dá para pular a fila — pagando a taxa extra."
