id: B2-05
protagonist: f
title: ["The meeting", "A reunião"]
situation: ["You want to propose Portuguese safety signs for the factory at Friday's meeting. Chief Sato says the meeting is too late — do the 根回し first.", "Você quer propor placas de segurança em português para a fábrica na reunião de sexta. A chefe Sato diz que a reunião já é tarde — primeiro, o 根回し."]
learn: [n3-138]
culture: Nemawashi
items:
  - [nemawashi, "根回[ねまわ]し", "laying the groundwork (before a meeting)", "costurar o apoio antes (da reunião)", {rare: true}]
  - [kettei, "決定[けってい]", "decision", "decisão"]
  - [gidai, "議題[ぎだい]", "agenda item", "pauta", {rare: true}]
  - [ni-yotte, "〜に よって", "depending on; by", "dependendo de; por"]
  - [hito-ni-yotte, "人[ひと] に よって", "depending on the person", "dependendo da pessoa"]
  - [teian, "提案[ていあん]", "proposal", "proposta"]
  - [sansei-wo-eru, "賛成[さんせい] を 得[え]る", "win support", "conseguir apoio"]
  - [jizen-ni, "事前[じぜん] に", "beforehand", "com antecedência"]
  - [hyoshiki, "標識[ひょうしき]", "sign (notice)", "placa (de aviso)"]
  - [iken, "意見[いけん]", "opinion", "opinião"]
  - [kakunin-shite-oku, "確認[かくにん] して おく", "check in advance", "confirmar antes"]
dialogue:
  - [protagonist, "金曜日[きんようび] の 会議[かいぎ] で、 ポルトガル語[ご] の 標識[ひょうしき] を 提案[ていあん] したい です。", "At Friday's meeting I'd like to propose Portuguese signs.", "Na reunião de sexta quero propor placas em português."]
  - [sato, "いい 提案[ていあん] です ね。 でも、 根回[ねまわ]し は しました か。", "Good proposal. But have you done the groundwork?", "Boa proposta. Mas você já costurou o apoio?"]
  - [protagonist, "根回[ねまわ]し？", "Groundwork?", "Costurar o apoio?"]
  - [sato, "会議[かいぎ] の 前[まえ] に、 一人[ひとり] ずつ 意見[いけん] を 聞[き]いて、 賛成[さんせい] を 得[え]て おく ん です。", "Before the meeting, you ask each person's opinion one by one and win their support.", "Antes da reunião, você ouve a opinião de cada um e consegue o apoio deles."]
  - [protagonist, "会議[かいぎ] で 決[き]める ん じゃ ない ん です か。", "Isn't the decision made at the meeting?", "A decisão não é tomada na reunião?"]
  - [sato, "会社[かいしゃ] に よって 違[ちが]います が、 多[おお]く の 場合[ばあい]、 会議[かいぎ] は 決定[けってい] を 確認[かくにん] する 場所[ばしょ] です。", "It depends on the company, but often the meeting is where the decision is confirmed.", "Depende da empresa, mas em muitos casos a reunião é o lugar onde a decisão é confirmada."]
  - [protagonist, "なるほど。 じゃあ、 事前[じぜん] に 工場長[こうじょうちょう] と 安全[あんぜん] 担当[たんとう] に 話[はな]して おきます。", "I see. Then I'll talk to the plant manager and the safety officer beforehand.", "Entendi. Então vou conversar antes com o gerente da fábrica e o responsável pela segurança."]
  - [sato, "それ が いい です。 議題[ぎだい] に は 私[わたし] が 入[い]れて おきます ね。", "Good. I'll put it on the agenda.", "Isso. Eu coloco na pauta."]
teach:
  - ask: ["Say: a proposal.", "Diga: uma proposta.", "提案[ていあん]", teian]
  - ask: ["Say: a sign, a notice.", "Diga: uma placa.", "標識[ひょうしき]", hyoshiki]
  - ask: ["Say: laying the groundwork.", "Diga: costurar o apoio antes.", "根回[ねまわ]し", nemawashi]
  - ask: ["Say: opinion.", "Diga: opinião.", "意見[いけん]", iken]
  - ask: ["Say: win support.", "Diga: conseguir apoio.", "賛成[さんせい] を 得[え]る", sansei-wo-eru]
  - ask: ["Say: beforehand.", "Diga: com antecedência.", "事前[じぜん] に", jizen-ni]
  - ask: ["Say: a decision.", "Diga: uma decisão.", "決定[けってい]", kettei]
  - ask: ["Say: an agenda item.", "Diga: um item da pauta.", "議題[ぎだい]", gidai]
  - note: ["«〜に よって» is depending on — «会社[かいしゃ] に よって 違[ちが]います», it differs from company to company; «人[ひと] に よって», depending on the person. It also marks the doer in written passives: «社長[しゃちょう] に よって 決[き]められた», decided by the president.", "«〜に よって» é dependendo de — «会社[かいしゃ] に よって 違[ちが]います», varia de empresa para empresa; «人[ひと] に よって», dependendo da pessoa. Também marca quem fez na passiva escrita: «社長[しゃちょう] に よって 決[き]められた», decidido pelo presidente."]
  - ask: ["Say the pattern: depending on.", "Diga o padrão: dependendo de.", "〜に よって", ni-yotte]
  - ask: ["Say: depending on the person.", "Diga: dependendo da pessoa.", "人[ひと] に よって", hito-ni-yotte]
  - ask: ["Say: check in advance.", "Diga: confirmar antes.", "確認[かくにん] して おく", kakunin-shite-oku]
  - note: ["«根回[ねまわ]し» comes from gardening: digging round a tree's roots before moving it. Before a meeting you talk to each person who matters, hear objections and win support, so the meeting can approve without conflict. Surprising people with a new idea in the meeting can embarrass them.", "«根回[ねまわ]し» vem da jardinagem: cavar em volta das raízes antes de transplantar uma árvore. Antes de uma reunião você conversa com cada pessoa importante, ouve as objeções e conquista o apoio, para a reunião aprovar sem conflito. Surpreender as pessoas com uma ideia nova na reunião pode deixá-las constrangidas."]
  - pt_only: "No Brasil se diria «fazer o meio de campo» ou «costurar politicamente». No Japão isso não é jeitinho: é o caminho normal para uma proposta passar."
