id: C1-18
protagonist: m
title: ["The marathon", "A maratona"]
situation: ["The taiko group drums by the course of the Hamanako marathon. Lucas is running his first full marathon. You meet him at the finish — eventually.", "O grupo de taikô toca na beira do percurso da maratona do lago Hamana. O Lucas corre a sua primeira maratona completa. Você o encontra na chegada — finalmente."]
learn: [ja-wben104-136]
culture: —
items:
  - [marason, "マラソン", "marathon", "maratona"]
  - [kansou, "完走[かんそう]", "finishing (a race)", "completar (a prova)"]
  - [kinnikutsuu, "筋肉痛[きんにくつう]", "muscle ache", "dor muscular"]
  - [ageku, "〜あげく", "after much…, in the end (bad)", "depois de muito…, acabou que (mal)"]
  - [mayotta-ageku, "迷[まよ]った あげく", "after getting lost for ages", "depois de se perder muito"]
  - [gooru-review, "ゴール 地点[ちてん]", "finish line", "linha de chegada"]
  - [kyuusui, "給水[きゅうすい]", "water station", "posto de água", {rare: true}]
  - [genkai, "限界[げんかい]", "limit", "limite"]
  - [ganbare, "頑張[がんば]れ！", "come on! (cheering)", "vai! força! (torcendo)"]
  - [ashi-ga-tsuru, "足[あし] が つる", "get a leg cramp", "dar cãibra na perna"]
dialogue:
  - [protagonist, "ルーカス、 頑張[がんば]れ！ あと 五[ご] キロ！", "Lucas, come on! Five kilometres to go!", "Lucas, força! Faltam cinco quilômetros!"]
  - [lucas, "もう 限界[げんかい]… 太鼓[たいこ] の 音[おと] で 元気[げんき] が 出[で]た！", "I'm at my limit… the taiko drums gave me energy!", "Estou no limite… o som do taikô me deu força!"]
  - [kenta, "給水[きゅうすい] で 水[みず] を 取[と]って ね！", "Grab water at the water station!", "Pega água no posto!"]
  - [protagonist, "…ゴール 地点[ちてん] で 一時間[いちじかん] 待[ま]った けど、 ルーカス が 来[こ]ない。", "…I waited an hour at the finish line, but Lucas hasn't come.", "…Esperei uma hora na chegada, mas o Lucas não apareceu."]
  - [lucas, "ごめん！ 足[あし] が つって、 歩[ある]いた あげく、 ゴール の 場所[ばしょ] も 間違[まちが]えた。", "Sorry! I got a cramp, walked for ages, and in the end even went to the wrong finish.", "Desculpa! Deu cãibra, andei um tempão e no fim ainda errei o lugar da chegada."]
  - [protagonist, "でも 完走[かんそう] した ん だ ね！ おめでとう！", "But you finished! Congratulations!", "Mas você completou! Parabéns!"]
  - [lucas, "うん。 明日[あした] は 筋肉痛[きんにくつう] で 歩[ある]けない かも。", "Yeah. Tomorrow I might not be able to walk from the muscle ache.", "É. Amanhã talvez nem consiga andar de tanta dor muscular."]
  - [kenta, "来年[らいねん] は 僕[ぼく]たち も 走[はし]ろう か。", "Shall we run too next year?", "Ano que vem a gente também corre?"]
teach:
  - ask: ["Say: a marathon.", "Diga: uma maratona.", "マラソン", marason]
  - ask: ["Cheer him on: come on!", "Torça: força!", "頑張[がんば]れ！", ganbare]
  - ask: ["Say: my limit.", "Diga: meu limite.", "限界[げんかい]", genkai]
  - ask: ["Say: the water station.", "Diga: o posto de água.", "給水[きゅうすい]", kyuusui]
  - ask: ["Say: the finish line.", "Diga: a linha de chegada.", "ゴール 地点[ちてん]", gooru-review]
  - ask: ["Say: I got a leg cramp.", "Diga: deu cãibra na perna.", "足[あし] が つった。", ashi-ga-tsuru]
  - note: ["«〜あげく» is after much…, in the end — usually a bad or tiring result after a long process: «迷[まよ]った あげく», after getting lost for ages; «歩[ある]いた あげく、 場所[ばしょ] も 間違[まちが]えた», walked and walked and then even got the place wrong.", "«〜あげく» é depois de muito…, acabou que — geralmente um resultado ruim ou cansativo depois de um longo processo: «迷[まよ]った あげく», depois de se perder muito; «歩[ある]いた あげく、 場所[ばしょ] も 間違[まちが]えた», andou e andou e no fim ainda errou o lugar."]
  - ask: ["Say the pattern: after much…, in the end.", "Diga o padrão: depois de muito…, acabou que.", "〜あげく", ageku]
  - ask: ["Say: after getting lost for ages.", "Diga: depois de se perder muito.", "迷[まよ]った あげく", mayotta-ageku]
  - ask: ["Say: finishing the race.", "Diga: completar a prova.", "完走[かんそう]", kansou]
  - ask: ["Say: muscle ache.", "Diga: dor muscular.", "筋肉痛[きんにくつう]", kinnikutsuu]
  - note: ["Japanese city marathons are huge, with lotteries for places, and the crowds cheer every runner, not just friends: «頑張[がんば]れ！», «ファイト！». Taiko groups, school bands and local cheer squads line the course.", "As maratonas das cidades japonesas são enormes, com sorteio de vagas, e o público torce por todos os corredores, não só pelos amigos: «頑張[がんば]れ！», «ファイト！». Grupos de taikô, bandas de escola e torcidas locais se espalham pelo percurso."]
  - pt_only: "A São Silvestre tem a festa; a maratona japonesa tem taikô em cada esquina e desconhecidos gritando o seu nome escrito no peito."
