id: B1-13
protagonist: f
title: [The hangover, A ressaca]
situation: ["Saturday morning after the team's drinking night. Your head hurts. Kenta calls — and Mrs Suzuki brings clam soup.", "Sábado de manhã, depois da noitada do time. Sua cabeça dói. O Kenta liga — e a senhora Suzuki traz uma sopa de mariscos."]
learn: []
culture: —
items:
  - [futsukayoi, "二日酔[ふつかよ]い", "hangover", "ressaca"]
  - [shijimijiru, "しじみ 汁[じる]", "freshwater clam soup", "sopa de mariscos de água doce", {rare: true}]
  - [oboete-nai, "覚[おぼ]えて ない", "I don't remember (casual)", "não lembro (informal)"]
  - [nomisugita, "飲[の]みすぎた", "I drank too much", "bebi demais"]
  - [sugiru, "〜すぎる", "too much", "demais"]
  - [tabesugi, "食[た]べすぎ", "eating too much", "comer demais"]
  - [atama-ga-itai, "頭[あたま] が 痛[いた]い", "my head hurts", "minha cabeça dói"]
  - [kimochi-warui, "気持[きも]ち 悪[わる]い", "I feel sick", "estou enjoada"]
  - [mizu-wo-nonde, "水[みず] を たくさん 飲[の]んで", "drink lots of water", "beba bastante água"]
  - [hazukashii-koto, "恥[は]ずかしい こと", "something embarrassing", "uma coisa vergonhosa"]
  - [nani-shita, "私[わたし]、 何[なに] した？", "what did I do?", "o que eu fiz?"]
dialogue:
  - [kenta, "おはよう。 大丈夫[だいじょうぶ]？ 昨日[きのう]、 飲[の]みすぎた ね。", "Morning. You okay? You drank too much yesterday.", "Bom dia. Tudo bem? Ontem você bebeu demais."]
  - [protagonist, "頭[あたま] が 痛[いた]い… 気持[きも]ち 悪[わる]い。 二日酔[ふつかよ]い だ。", "My head hurts… I feel sick. A hangover.", "Minha cabeça dói… estou enjoada. É ressaca."]
  - [kenta, "カラオケ で サンバ を 踊[おど]った の、 覚[おぼ]えて る？", "Do you remember dancing samba at karaoke?", "Lembra que você sambou no karaokê?"]
  - [protagonist, "覚[おぼ]えて ない！ 私[わたし]、 何[なに] した？ 恥[は]ずかしい こと？", "I don't remember! What did I do? Something embarrassing?", "Não lembro! O que eu fiz? Alguma coisa vergonhosa?"]
  - [kenta, "大丈夫[だいじょうぶ]、 みんな 楽[たの]しかった よ。 水[みず] を たくさん 飲[の]んで ね。", "It's fine, everyone had fun. Drink lots of water.", "Tranquilo, todo mundo se divertiu. Beba bastante água."]
  - [suzuki, "顔色[かおいろ] が 悪[わる]い です よ。 しじみ 汁[じる] を 作[つく]りました。", "You look pale. I made clam soup.", "Você está pálida. Fiz uma sopa de mariscos."]
  - [protagonist, "ありがとう ございます… 昨日[きのう] は 食[た]べすぎ と 飲[の]みすぎ でした。", "Thank you… yesterday I ate too much and drank too much.", "Obrigada… ontem foi comida demais e bebida demais."]
  - [suzuki, "しじみ は 二日酔[ふつかよ]い に いい ん です よ。", "Clams are good for a hangover.", "Marisco é bom para ressaca."]
teach:
  - ask: ["Say: a hangover.", "Diga: ressaca.", "二日酔[ふつかよ]い", futsukayoi]
  - ask: ["Say: my head hurts.", "Diga: minha cabeça dói.", "頭[あたま] が 痛[いた]い。", atama-ga-itai]
  - ask: ["Say: I feel sick.", "Diga: estou enjoada.", "気持[きも]ち 悪[わる]い。", kimochi-warui]
  - note: ["Too much: the verb stem plus «すぎる» — «飲[の]みます» → «飲[の]みすぎる», drink too much; «食[た]べすぎる», eat too much. Adjectives drop «い»: «高[たか]すぎる», too expensive. As a noun: «食[た]べすぎ», overeating.", "Demais: radical do verbo mais «すぎる» — «飲[の]みます» → «飲[の]みすぎる», beber demais; «食[た]べすぎる», comer demais. Adjetivos perdem o «い»: «高[たか]すぎる», caro demais. Como substantivo: «食[た]べすぎ», comilança."]
  - ask: ["Say the ending: too much.", "Diga a terminação: demais.", "〜すぎる", sugiru]
  - ask: ["Say: I drank too much.", "Diga: bebi demais.", "飲[の]みすぎた。", nomisugita]
  - ask: ["Say: eating too much.", "Diga: comer demais.", "食[た]べすぎ", tabesugi]
  - ask: ["Say casually: I don't remember.", "Diga, informal: não lembro.", "覚[おぼ]えて ない。", oboete-nai]
  - ask: ["Ask in a panic: what did I do?", "Pergunte em pânico: o que eu fiz?", "私[わたし]、 何[なに] した？", nani-shita]
  - ask: ["Say: something embarrassing.", "Diga: uma coisa vergonhosa.", "恥[は]ずかしい こと", hazukashii-koto]
  - ask: ["Tell a friend: drink lots of water.", "Diga a um amigo: beba bastante água.", "水[みず] を たくさん 飲[の]んで。", mizu-wo-nonde]
  - ask: ["Say: clam soup.", "Diga: sopa de mariscos.", "しじみ 汁[じる]", shijimijiru]
  - note: ["«しじみ 汁[じる]», miso soup with tiny freshwater clams, is the classic Japanese hangover cure; konbini also sell hangover drinks. What happens at the «飲[の]み会[かい]» is often politely forgotten the next day.", "«しじみ 汁[じる]», sopa de missô com mariscos pequenininhos de água doce, é o remédio clássico japonês para ressaca; as lojas de conveniência também vendem bebidas para ressaca. O que acontece no «飲[の]み会[かい]» muitas vezes é educadamente esquecido no dia seguinte."]
  - pt_only: "No Brasil é caldo de mocotó, água de coco ou um bom pastel. No Japão, sopa de mariscos — e a gentileza de ninguém comentar o samba no karaokê."
