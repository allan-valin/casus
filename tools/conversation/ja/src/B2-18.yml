id: B2-18
protagonist: m
title: ["Politics without a fight", "Política sem briga"]
situation: ["Dinner at Yui's parents'. Her father, a retired civil servant, brings up the coming election and asks what you think.", "Jantar na casa dos pais da Yui. O pai dela, funcionário público aposentado, puxa o assunto da eleição e pergunta o que você acha."]
learn: []
culture: Handled with care
items:
  - [yotou, "与党[よとう]", "ruling party", "partido do governo", {rare: true}]
  - [yatou, "野党[やとう]", "opposition party", "oposição", {rare: true}]
  - [to-shite-mo, "〜と して も", "even if, even supposing", "mesmo que, ainda que"]
  - [hantai-da-to-shite-mo, "反対[はんたい] だ と して も", "even if (you) disagree", "mesmo que discorde"]
  - [iken-ga-chigau, "意見[いけん] が 違[ちが]う", "have different opinions", "ter opiniões diferentes"]
  - [sonchou, "尊重[そんちょう]", "respect (for a view)", "respeito (a uma opinião)"]
  - [seisaku, "政策[せいさく]", "policy", "política (medida)"]
  - [keizai, "経済[けいざい]", "economy", "economia"]
  - [gaikokujin-no-shiten, "外国人[がいこくじん] の 視点[してん]", "a foreigner's point of view", "o ponto de vista de um estrangeiro"]
  - [benkyou-ni-narimasu, "勉強[べんきょう] に なります", "that's very instructive", "aprendo muito com isso"]
dialogue:
  - [yui-chichi, "君[きみ] は 今度[こんど] の 選挙[せんきょ] を どう 思[おも]う？", "What do you think of the coming election?", "O que você acha da próxima eleição?"]
  - [protagonist, "外国人[がいこくじん] の 視点[してん] です が… 経済[けいざい] の 政策[せいさく] に 一番[いちばん] 興味[きょうみ] が あります。", "From a foreigner's point of view… I'm most interested in economic policy.", "Do ponto de vista de um estrangeiro… o que mais me interessa é a política econômica."]
  - [yui-chichi, "与党[よとう] と 野党[やとう]、 どっち が いい と 思[おも]う？", "Ruling party or opposition — which do you think is better?", "Governo ou oposição — qual você acha melhor?"]
  - [yui, "お父[とう]さん、 その 質問[しつもん] は ちょっと…", "Dad, that question is a bit…", "Pai, essa pergunta é meio…"]
  - [protagonist, "大丈夫[だいじょうぶ]。 どちら に も いい 点[てん] が ある と 思[おも]います。 お父[とう]さん は？", "It's fine. I think both have good points. And you, sir?", "Tudo bem. Acho que os dois têm pontos bons. E o senhor?"]
  - [yui-chichi, "私[わたし] は 長[なが]い 間[あいだ] 公務員[こうむいん] だった から ね。 意見[いけん] が 違[ちが]う と して も、 怒[おこ]らない よ。", "I was a civil servant for a long time, you see. Even if our opinions differ, I won't get angry.", "Fui funcionário público por muito tempo. Mesmo que a gente discorde, não vou ficar bravo."]
  - [protagonist, "お話[はなし]、 勉強[べんきょう] に なります。 お互[たが]い の 意見[いけん] を 尊重[そんちょう] したい です。", "This is very instructive. I'd like us to respect each other's views.", "Estou aprendendo muito. Quero que a gente respeite a opinião um do outro."]
  - [yui, "…よかった。 じゃあ、 デザート に しましょう！", "…Phew. Then, let's have dessert!", "…Ufa. Então, vamos à sobremesa!"]
teach:
  - ask: ["Say: the ruling party.", "Diga: o partido do governo.", "与党[よとう]", yotou]
  - ask: ["Say: the opposition.", "Diga: a oposição.", "野党[やとう]", yatou]
  - ask: ["Say: policy.", "Diga: uma medida política.", "政策[せいさく]", seisaku]
  - ask: ["Say: the economy.", "Diga: a economia.", "経済[けいざい]", keizai]
  - ask: ["Say: a foreigner's point of view.", "Diga: o ponto de vista de um estrangeiro.", "外国人[がいこくじん] の 視点[してん]", gaikokujin-no-shiten]
  - note: ["«〜と して も» is even if, even supposing: «意見[いけん] が 違[ちが]う と して も», even if our opinions differ. It concedes a possibility and holds firm: «反対[はんたい] だ と して も、 話[はな]しましょう» — even if you disagree, let's talk.", "«〜と して も» é mesmo que, ainda que: «意見[いけん] が 違[ちが]う と して も», mesmo que nossas opiniões sejam diferentes. Admite uma possibilidade e se mantém firme: «反対[はんたい] だ と して も、 話[はな]しましょう» — mesmo que discorde, vamos conversar."]
  - ask: ["Say the pattern: even if.", "Diga o padrão: mesmo que.", "〜と して も", to-shite-mo]
  - ask: ["Say: even if you disagree.", "Diga: mesmo que discorde.", "反対[はんたい] だ と して も", hantai-da-to-shite-mo]
  - ask: ["Say: have different opinions.", "Diga: ter opiniões diferentes.", "意見[いけん] が 違[ちが]う", iken-ga-chigau]
  - ask: ["Say: respect for a view.", "Diga: respeito a uma opinião.", "尊重[そんちょう]", sonchou]
  - ask: ["Thank him: that's very instructive.", "Agradeça: aprendo muito com isso.", "勉強[べんきょう] に なります。", benkyou-ni-narimasu]
  - note: ["Asked for a political opinion by an elder, a foreigner does well to speak about topics rather than parties, find something good on each side, and turn the question back. «勉強[べんきょう] に なります» — I'm learning from this — closes any argument kindly.", "Quando um mais velho pede opinião política, o estrangeiro se sai bem falando de temas e não de partidos, achando algo bom em cada lado e devolvendo a pergunta. «勉強[べんきょう] に なります» — estou aprendendo com isso — encerra qualquer discussão com gentileza."]
  - pt_only: "No almoço de família brasileiro a política vira briga num minuto. Na casa da Yui o jogo é outro: escutar, concordar com uma parte e mudar de assunto na hora certa."
