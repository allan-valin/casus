id: B2-23
protagonist: f
title: ["The promotion", "A promoção"]
situation: ["Department head Takahashi calls you in: from April you'll be a team lead, with three people under you. Afterwards Chief Sato gives advice.", "O chefe de departamento Takahashi chama você: a partir de abril você será líder de equipe, com três pessoas abaixo de você. Depois a chefe Sato dá conselhos."]
learn: []
culture: —
items:
  - [shoushin, "昇進[しょうしん]", "promotion", "promoção"]
  - [sekinin, "責任[せきにん]", "responsibility", "responsabilidade"]
  - [buka, "部下[ぶか]", "subordinate", "subordinado"]
  - [beki, "〜べき", "should, ought to", "deveria, tem que"]
  - [kiku-beki, "話[はなし] を 聞[き]く べき", "should listen", "deveria ouvir"]
  - [shunin, "主任[しゅにん]", "team lead, chief (junior)", "líder de equipe"]
  - [kitai-expect, "期待[きたい]", "expectation, hopes", "expectativa"]
  - [kyouryoku, "協力[きょうりょく]", "cooperation", "cooperação"]
  - [mihon, "見本[みほん]", "example, model", "exemplo"]
  - [shikaru, "叱[しか]る", "scold", "repreender"]
  - [homeru, "褒[ほ]める", "praise", "elogiar"]
dialogue:
  - [buchou, "四月[しがつ] から 主任[しゅにん] に なって もらいます。 昇進[しょうしん] です。", "From April you'll be a team lead. A promotion.", "A partir de abril você vai ser líder de equipe. É uma promoção."]
  - [protagonist, "ありがとう ございます。 期待[きたい] に 応[こた]えられる よう、 頑張[がんば]ります。", "Thank you. I'll do my best to live up to your hopes.", "Muito obrigada. Vou me esforçar para corresponder às expectativas."]
  - [buchou, "部下[ぶか] が 三人[さんにん] です。 責任[せきにん] も 大[おお]きく なります よ。", "Three people under you. The responsibility grows too.", "Três subordinados. A responsabilidade também aumenta."]
  - [sato, "おめでとう！ 上司[じょうし] に なったら、 まず 部下[ぶか] の 話[はなし] を 聞[き]く べき です。", "Congratulations! Once you're a boss, first of all you should listen to your people.", "Parabéns! Quando virar chefe, a primeira coisa é ouvir a equipe."]
  - [protagonist, "叱[しか]る 時[とき] は どう する べき です か。", "How should I scold someone?", "E quando for preciso repreender?"]
  - [sato, "叱[しか]る の は 二人[ふたり] の 時[とき]。 褒[ほ]める の は みんな の 前[まえ]。", "Scold in private. Praise in front of everyone.", "Repreender a sós. Elogiar na frente de todos."]
  - [protagonist, "ブラジル で も そう 言[い]います。 自分[じぶん] が 見本[みほん] に ならなきゃ。", "We say that in Brazil too. I have to be the example myself.", "No Brasil também se diz isso. Eu mesma tenho que ser o exemplo."]
  - [sato, "そう。 困[こま]ったら、 いつでも 協力[きょうりょく] します から。", "Right. If you're stuck, I'll always help.", "Isso. Se tiver dificuldade, conte comigo sempre."]
teach:
  - ask: ["Say: a promotion.", "Diga: uma promoção.", "昇進[しょうしん]", shoushin]
  - ask: ["Say: team lead.", "Diga: líder de equipe.", "主任[しゅにん]", shunin]
  - ask: ["Say: responsibility.", "Diga: responsabilidade.", "責任[せきにん]", sekinin]
  - ask: ["Say: a subordinate.", "Diga: um subordinado.", "部下[ぶか]", buka]
  - ask: ["Say: expectations.", "Diga: expectativas.", "期待[きたい]", kitai-expect]
  - note: ["«〜べき» is should — a duty or the right thing, stronger than «〜ほう が いい»: «聞[き]く べき です», you should listen. Negative: «〜べき では ない», should not. «する» takes «すべき» or «するべき».", "«〜べき» é deveria — um dever ou o certo a fazer, mais forte que «〜ほう が いい»: «聞[き]く べき です», você deveria ouvir. Negativo: «〜べき では ない», não deveria. «する» vira «すべき» ou «するべき»."]
  - ask: ["Say the pattern: should, ought to.", "Diga o padrão: deveria.", "〜べき", beki]
  - ask: ["Say: you should listen.", "Diga: você deveria ouvir.", "話[はなし] を 聞[き]く べき", kiku-beki]
  - ask: ["Say: to scold.", "Diga: repreender.", "叱[しか]る", shikaru]
  - ask: ["Say: to praise.", "Diga: elogiar.", "褒[ほ]める", homeru]
  - ask: ["Say: an example, a model.", "Diga: um exemplo.", "見本[みほん]", mihon]
  - ask: ["Say: cooperation.", "Diga: cooperação.", "協力[きょうりょく]", kyouryoku]
  - note: ["Japanese titles climb step by step — «主任[しゅにん]», «係長[かかりちょう]», «課長[かちょう]», «部長[ぶちょう]» — and people are called by them. Promotions are announced in spring with the new fiscal year in April; the expected answer is humble: you'll try to meet expectations.", "Os cargos japoneses sobem degrau por degrau — «主任[しゅにん]», «係長[かかりちょう]», «課長[かちょう]», «部長[ぶちょう]» — e as pessoas são chamadas por eles. As promoções saem na primavera, com o ano fiscal que começa em abril; a resposta esperada é humilde: você vai se esforçar para corresponder."]
  - pt_only: "«Elogie em público, critique em particular» vale nos dois países. A diferença é que no Japão até o elogio em público costuma ser discreto."
