id: C1-25
protagonist: f
title: ["The PTA", "A PTA"]
situation: ["Maria asks you to interpret at her son's PTA meeting. Every parent must take a role; the roles are drawn by lot.", "A Maria pede que você interprete na reunião da PTA da escola do filho. Todo pai e mãe tem que assumir um cargo; os cargos são sorteados."]
learn: [n3-074]
culture: Everyone takes a turn
items:
  - [piitiiee, "PTA", "parent-teacher association", "associação de pais e mestres"]
  - [yakuin, "役員[やくいん]", "officer (committee role)", "membro da diretoria"]
  - [kuji-lots, "くじ", "lottery, drawing lots", "sorteio"]
  - [gyouji, "行事[ぎょうじ]", "event (school)", "evento (da escola)"]
  - [wake-da, "〜わけ だ", "so that's why; no wonder", "então é por isso; não admira"]
  - [isogashii-wake-da, "忙[いそが]しい わけ だ", "no wonder (they're) busy", "não admira que estejam ocupados"]
  - [undoukai, "運動会[うんどうかい]", "sports day", "gincana esportiva"]
  - [tantou, "担当[たんとう]", "in charge of", "responsável por"]
  - [kotowareru, "断[ことわ]れない", "can't refuse", "não dá para recusar"]
  - [tsuuyaku-shimasu, "通訳[つうやく] します", "I'll interpret", "vou interpretar"]
dialogue:
  - [maria, "今日[きょう] は PTA の 役員[やくいん] を 決[き]める 日[ひ] な の。 通訳[つうやく] して くれる？", "Today they choose the PTA officers. Will you interpret?", "Hoje é o dia de escolher a diretoria da PTA. Você interpreta para mim?"]
  - [protagonist, "もちろん、 通訳[つうやく] します。", "Of course, I'll interpret.", "Claro, eu interpreto."]
  - [madoguchi, "では、 役員[やくいん] は くじ で 決[き]めます。 運動会[うんどうかい] の 担当[たんとう] は… ダビ くん の お母[かあ]さん です。", "Then we'll choose officers by drawing lots. In charge of sports day… Davi's mother.", "Então os cargos serão sorteados. Responsável pela gincana esportiva… a mãe do Davi."]
  - [maria, "え、 私[わたし]？ 日本語[にほんご] の 書類[しょるい] も 多[おお]い のに…", "What, me? With all the paperwork in Japanese…", "Quê, eu? Com tanta papelada em japonês…"]
  - [protagonist, "みんな 一回[いっかい] は やる 決[き]まり みたい。 断[ことわ]れない わけ だ。", "It seems everyone has to do it once. So that's why you can't refuse.", "Parece que todo mundo tem que fazer uma vez. Por isso não dá para recusar."]
  - [maria, "だから お母[かあ]さん たち、 いつも 忙[いそが]しい わけ ね。", "So that's why the mothers are always so busy.", "Então é por isso que as mães vivem ocupadas."]
  - [protagonist, "行事[ぎょうじ] の 準備[じゅんび] は 手伝[てつだ]う よ。 翻訳[ほんやく] も する から。", "I'll help prepare the events. And I'll translate too.", "Eu ajudo a preparar os eventos. E traduzo também."]
  - [maria, "ありがとう！ これ で 学校[がっこう] の 日本人[にほんじん] の ママ 友[とも] も できる かも。", "Thank you! Maybe I'll make some Japanese mum friends at school this way.", "Obrigada! Quem sabe assim eu faço amizade com as mães japonesas da escola."]
teach:
  - ask: ["Say: the PTA.", "Diga: a PTA.", "PTA", piitiiee]
  - ask: ["Say: a committee officer.", "Diga: membro da diretoria.", "役員[やくいん]", yakuin]
  - ask: ["Say: drawing lots.", "Diga: sorteio.", "くじ", kuji-lots]
  - ask: ["Say: a school event.", "Diga: um evento da escola.", "行事[ぎょうじ]", gyouji]
  - ask: ["Say: sports day.", "Diga: gincana esportiva.", "運動会[うんどうかい]", undoukai]
  - ask: ["Say: in charge of.", "Diga: responsável por.", "担当[たんとう]", tantou]
  - ask: ["Offer: I'll interpret.", "Ofereça: vou interpretar.", "通訳[つうやく] します。", tsuuyaku-shimasu]
  - note: ["«〜わけ だ» draws a conclusion from facts: so that's why, no wonder. «みんな 一回[いっかい] は やる。 断[ことわ]れない わけ だ» — everyone does it once; that's why you can't refuse. «忙[いそが]しい わけ だ», no wonder they're busy.", "«〜わけ だ» tira uma conclusão dos fatos: então é por isso, não admira. «みんな 一回[いっかい] は やる。 断[ことわ]れない わけ だ» — todo mundo faz uma vez; por isso não dá para recusar. «忙[いそが]しい わけ だ», não admira que estejam ocupados."]
  - ask: ["Say the pattern: so that's why.", "Diga o padrão: então é por isso.", "〜わけ だ", wake-da]
  - ask: ["Say: no wonder they're busy.", "Diga: não admira que estejam ocupados.", "忙[いそが]しい わけ だ", isogashii-wake-da]
  - ask: ["Say: you can't refuse.", "Diga: não dá para recusar.", "断[ことわ]れない", kotowareru]
  - note: ["Japanese PTAs run school events and patrols with parent volunteers, and many schools expect every family to serve once — often chosen by lot. It is a heavy load for working and foreign parents; some schools now make roles voluntary or lighter. Offering an interpreter or a translation is a real help.", "As PTAs japonesas organizam eventos e rondas da escola com pais voluntários, e muitas escolas esperam que cada família sirva uma vez — muitas vezes por sorteio. É uma carga pesada para pais que trabalham e para estrangeiros; algumas escolas hoje tornaram os cargos voluntários ou mais leves. Oferecer intérprete ou tradução ajuda de verdade."]
  - pt_only: "No Brasil a reunião de pais é uma vez por bimestre e pronto. No Japão a PTA é quase um segundo emprego — e também a porta de entrada para fazer amigos japoneses."
