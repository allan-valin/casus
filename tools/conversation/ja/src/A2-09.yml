id: A2-09
protagonist: f
title: [Money and percentages, Dinheiro e porcentagem]
situation: ["Saturday at the supermarket with Mrs Suzuki. Yellow stickers, two prices on every label.", "Sábado no supermercado com a senhora Suzuki. Etiquetas amarelas, dois preços em cada etiqueta."]
learn: []
culture: Prices with and without tax
items:
  - [waribiki, "割引[わりびき]", "discount", "desconto"]
  - [zeikomi, "税込[ぜいこ]み", "tax included", "com imposto", {rare: true}]
  - [zeinuki, "税抜[ぜいぬ]き", "before tax", "sem imposto", {rare: true}]
  - [hangaku, "半額[はんがく]", "half price", "metade do preço", {rare: true}]
  - [man, "万[まん]", "ten thousand", "dez mil"]
  - [ichiman-en, "一万円[いちまんえん]", "10,000 yen", "10 mil ienes"]
  - [sen, "千[せん]", "thousand", "mil"]
  - [paasento, "パーセント", "percent", "por cento"]
  - [yasui, "安[やす]い", "cheap", "barato"]
  - [takai, "高[たか]い", "expensive", "caro"]
  - [zenbu-de, "全部[ぜんぶ] で", "altogether", "ao todo"]
dialogue:
  - [suzuki, "見[み]て ください。 この シール は 半額[はんがく] です よ。", "Look. This sticker means half price.", "Olhe. Esta etiqueta é metade do preço."]
  - [protagonist, "半額[はんがく]？ 安[やす]い！ どうして です か。", "Half price? Cheap! Why?", "Metade do preço? Barato! Por quê?"]
  - [suzuki, "夕方[ゆうがた] に なる と、 お弁当[べんとう] は 割引[わりびき] に なります。", "In the evening the boxed lunches get discounted.", "No fim da tarde as marmitas entram em desconto."]
  - [protagonist, "この 値段[ねだん] は 税抜[ぜいぬ]き です か、 税込[ぜいこ]み です か。", "Is this price before tax or with tax?", "Este preço é sem imposto ou com imposto?"]
  - [suzuki, "大[おお]きい の は 税抜[ぜいぬ]き、 小[ちい]さい の が 税込[ぜいこ]み です。", "The big number is before tax, the small one with tax.", "O número grande é sem imposto, o pequeno é com imposto."]
  - [protagonist, "食[た]べ物[もの] は 八[はち] パーセント です ね。", "Food is eight percent, right?", "Comida é oito por cento, né?"]
  - [suzuki, "はい。 全部[ぜんぶ] で 千[せん] 九百[きゅうひゃく] 八十円[はちじゅうえん] です。", "Yes. Altogether 1,980 yen.", "Isso. Ao todo, 1.980 ienes."]
  - [protagonist, "一万円[いちまんえん] で お願[ねが]いします。", "Here's ten thousand yen.", "Aqui, dez mil ienes."]
teach:
  - ask: ["Say: cheap.", "Diga: barato.", "安[やす]い", yasui]
  - ask: ["Say: expensive.", "Diga: caro.", "高[たか]い", takai]
  - ask: ["Say: a discount.", "Diga: desconto.", "割引[わりびき]", waribiki]
  - ask: ["Say: half price.", "Diga: metade do preço.", "半額[はんがく]", hangaku]
  - ask: ["Say: percent.", "Diga: por cento.", "パーセント", paasento]
  - ask: ["Say: tax included.", "Diga: com imposto.", "税込[ぜいこ]み", zeikomi]
  - ask: ["Say: before tax.", "Diga: sem imposto.", "税抜[ぜいぬ]き", zeinuki]
  - note: ["Japanese counts big numbers in groups of four zeros, not three: «千[せん]» is 1,000, but «万[まん]» is 10,000. So 10,000 yen is «一万円[いちまんえん]» — one «万[まん]» — and 100,000 is «十万[じゅうまん]», ten «万[まん]».", "O japonês conta números grandes de quatro em quatro zeros, não de três: «千[せん]» é 1.000, mas «万[まん]» é 10.000. Então 10 mil ienes é «一万円[いちまんえん]» — um «万[まん]» — e 100 mil é «十万[じゅうまん]», dez «万[まん]»."]
  - ask: ["Say: thousand.", "Diga: mil.", "千[せん]", sen]
  - ask: ["Say: ten thousand.", "Diga: dez mil.", "万[まん]", man]
  - ask: ["Say: ten thousand yen.", "Diga: dez mil ienes.", "一万円[いちまんえん]", ichiman-en]
  - ask: ["Ask: how much altogether?", "Pergunte: quanto é ao todo?", "全部[ぜんぶ] で いくら です か。", zenbu-de]
  - note: ["Consumption tax is 10 %, but 8 % on food you take away. Labels show both prices — the big number is often before tax, so read the small one to know what you pay. In the evening supermarkets put discount stickers on fresh food: 20 %, 30 %, then «半額[はんがく]».", "O imposto de consumo é 10 %, mas 8 % na comida para levar. As etiquetas mostram os dois preços — o número grande muitas vezes é sem imposto, então leia o pequeno para saber quanto vai pagar. No fim da tarde os supermercados colam adesivos de desconto na comida fresca: 20 %, 30 %, depois «半額[はんがく]»."]
  - pt_only: "No Brasil o preço da etiqueta já inclui tudo. No Japão, conte com até 10 % a mais no caixa quando só o preço grande for olhado."
