id: C2-12
protagonist: m
title: ["The family business", "O negócio da família"]
situation: ["Lucas, now fluent and N1, wants to open a Brazilian snack shop near the station. He asks you to look at his business plan with him.", "O Lucas, agora fluente e com N1, quer abrir uma lanchonete brasileira perto da estação. Ele pede para você olhar o plano de negócios com ele."]
learn: []
culture: Brazilian shops in the city
items:
  - [kaigyou, "開業[かいぎょう]", "opening a business", "abrir um negócio"]
  - [yuushi, "融資[ゆうし]", "loan, financing", "financiamento"]
  - [risuku, "リスク", "risk", "risco"]
  - [jouren, "常連[じょうれん]", "regular customer", "cliente fiel"]
  - [nai-koto-niwa, "〜ない こと に は", "unless (you) do…", "a não ser que…, sem…"]
  - [yatte-minai-koto-niwa, "やって みない こと に は", "unless you try", "sem tentar"]
  - [jigyou-keikakusho, "事業[じぎょう] 計画[けいかく] 書[しょ]", "business plan", "plano de negócios", {rare: true}]
  - [shikin, "資金[しきん]", "funds, capital", "capital"]
  - [kokyaku, "顧客[こきゃく]", "clientele", "clientela"]
  - [shiire, "仕入[しい]れ", "stock purchasing", "compra de mercadoria"]
  - [kyougou, "競合[きょうごう]", "competition (rival businesses)", "concorrência"]
dialogue:
  - [lucas, "駅前[えきまえ] で コシーニャ と パステル の 店[みせ] を 開業[かいぎょう] したい ん だ。", "I want to open a coxinha and pastel shop by the station.", "Quero abrir uma loja de coxinha e pastel perto da estação."]
  - [protagonist, "いい ね。 資金[しきん] は どう する の？", "Nice. What about funding?", "Que legal. E o capital?"]
  - [lucas, "銀行[ぎんこう] の 融資[ゆうし] を 申[もう]し込[こ]む。 事業[じぎょう] 計画[けいかく] 書[しょ] を 見[み]て くれる？", "I'll apply for a bank loan. Will you look at my business plan?", "Vou pedir financiamento no banco. Você olha o meu plano de negócios?"]
  - [protagonist, "顧客[こきゃく] は ブラジル 人[じん] だけ？ 日本人[にほんじん] も 狙[ねら]う なら、 メニュー は 日本語[にほんご] も 必要[ひつよう] だ よ。", "Is your clientele only Brazilians? If you're aiming at Japanese customers too, you need a Japanese menu.", "A clientela é só brasileira? Se quiser pegar japonês também, precisa de cardápio em japonês."]
  - [lucas, "両方[りょうほう]。 でも 競合[きょうごう] の 店[みせ] も ある し、 リスク が 心配[しんぱい]。", "Both. But there are competing shops, and I'm worried about the risk.", "Os dois. Mas tem loja concorrente, e me preocupo com o risco."]
  - [protagonist, "やって みない こと に は、 わからない。 最初[さいしょ] の 常連[じょうれん] は 僕[ぼく] と 健太[けんた] だ。", "Unless you try, you won't know. Your first regulars are me and Kenta.", "Sem tentar, não dá para saber. Os primeiros clientes fiéis somos eu e o Kenta."]
  - [lucas, "ははは。 仕入[しい]れ は マリア さん の パン屋[や] と 協力[きょうりょく] する つもり。", "Ha ha. For supplies I plan to team up with Maria's bakery.", "Rá. Para a mercadoria, pretendo fazer parceria com a padaria da Maria."]
  - [protagonist, "やらまいか、 だ ね。", "Yaramaika, then.", "Yaramaika, então."]
teach:
  - ask: ["Say: opening a business.", "Diga: abrir um negócio.", "開業[かいぎょう]", kaigyou]
  - ask: ["Say: a business plan.", "Diga: plano de negócios.", "事業[じぎょう] 計画[けいかく] 書[しょ]", jigyou-keikakusho]
  - ask: ["Say: funds, capital.", "Diga: capital.", "資金[しきん]", shikin]
  - ask: ["Say: a loan.", "Diga: financiamento.", "融資[ゆうし]", yuushi]
  - ask: ["Say: the clientele.", "Diga: a clientela.", "顧客[こきゃく]", kokyaku]
  - ask: ["Say: competition.", "Diga: concorrência.", "競合[きょうごう]", kyougou]
  - ask: ["Say: risk.", "Diga: risco.", "リスク", risuku]
  - note: ["«〜ない こと に は» is unless — without doing X, Y can't happen: «やって みない こと に は、 わからない», unless you try, you won't know. The second part is usually negative.", "«〜ない こと に は» é a não ser que — sem fazer X, Y não acontece: «やって みない こと に は、 わからない», sem tentar, não dá para saber. A segunda parte costuma ser negativa."]
  - ask: ["Say the pattern: unless…", "Diga o padrão: a não ser que…", "〜ない こと に は", nai-koto-niwa]
  - ask: ["Say: unless you try.", "Diga: sem tentar.", "やって みない こと に は", yatte-minai-koto-niwa]
  - ask: ["Say: buying in stock.", "Diga: compra de mercadoria.", "仕入[しい]れ", shiire]
  - ask: ["Say: a regular customer.", "Diga: cliente fiel.", "常連[じょうれん]", jouren]
  - note: ["Hamamatsu has Brazilian supermarkets, bakeries, restaurants, churches and schools, many opened by former factory workers. Foreigners can open a business in Japan, but the visa matters: permanent residents and spouses of Japanese nationals can do so freely; others may need a business-manager status.", "Hamamatsu tem supermercados, padarias, restaurantes, igrejas e escolas brasileiras, muitos abertos por ex-trabalhadores de fábrica. Estrangeiros podem abrir negócio no Japão, mas o visto importa: residentes permanentes e cônjuges de japoneses podem livremente; os outros podem precisar de um status de gestor de empresa."]
  - pt_only: "Coxinha e pastel já conquistaram muito japonês em Hamamatsu. Quem sabe a lanchonete do Lucas vira ponto de encontro das duas comunidades."
