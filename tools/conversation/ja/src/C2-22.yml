id: C2-22
protagonist: m
title: ["Reunion in São Paulo", "Reencontro em São Paulo"]
situation: ["You take Yui and Kenta to São Paulo for the first time. In Liberdade, the Japanese neighbourhood, Kenta is amazed — and you switch between three registers at once.", "Você leva a Yui e o Kenta a São Paulo pela primeira vez. Na Liberdade, o bairro japonês, o Kenta fica impressionado — e você alterna três registros ao mesmo tempo."]
learn: []
culture: Brazil has the largest nikkei population outside Japan
items:
  - [riberudaaji, "リベルダージ", "Liberdade (São Paulo's Japanese district)", "Liberdade (o bairro japonês de São Paulo)", {rare: true}]
  - [nikkei-shakai, "日系[にっけい] 社会[しゃかい]", "nikkei community", "comunidade nikkei"]
  - [ijuu, "移住[いじゅう]", "migration (settling abroad)", "imigração, mudar-se para outro país"]
  - [furusato-review, "第二[だいに] の 日本[にほん]", "a second Japan", "um segundo Japão"]
  - [chouchin, "提灯[ちょうちん]", "paper lantern", "lanterna de papel", {rare: true}]
  - [natsukashii-aji, "懐[なつ]かしい 味[あじ]", "a taste of the past", "gosto de antigamente"]
  - [rejisutaa-kirikae, "言葉[ことば] を 切[き]り替[か]える", "switch languages, registers", "trocar de língua, de registro"]
  - [ichiban-ooi, "世界[せかい] で 一番[いちばん] 多[おお]い", "the most in the world", "o maior do mundo"]
  - [mukashi-no-nihongo, "昔[むかし] の 日本語[にほんご]", "old-fashioned Japanese", "japonês de antigamente"]
  - [kangeki-review, "胸[むね] が いっぱい", "my heart is full", "o coração cheio"]
dialogue:
  - [kenta, "すごい！ 赤[あか]い 鳥居[とりい] と 提灯[ちょうちん]… ここ は 本当[ほんとう] に ブラジル？", "Amazing! Red torii and lanterns… is this really Brazil?", "Incrível! Torii vermelho e lanternas… isso é mesmo o Brasil?"]
  - [protagonist, "リベルダージ だ よ。 ブラジル は 日本[にほん] の 外[そと] で 日系[にっけい] 人[じん] が 世界[せかい] で 一番[いちばん] 多[おお]い 国[くに] な ん だ。", "This is Liberdade. Brazil has the largest nikkei population in the world outside Japan.", "Esta é a Liberdade. O Brasil tem a maior população nikkei do mundo fora do Japão."]
  - [yui, "お店[みせ] の おばあさん、 昔[むかし] の 日本語[にほんご] を 話[はな]して いる！", "The old lady in the shop is speaking old-fashioned Japanese!", "A senhora da loja está falando japonês de antigamente!"]
  - [protagonist, "移住[いじゅう] した 一世[いっせい] の 言葉[ことば] が 残[のこ]って いる ん だ。 ポルトガル語[ご] と 日本語[にほんご] が 混[ま]ざって いる よ。", "The words of the first-generation migrants have survived. It's a mix of Portuguese and Japanese.", "As palavras dos imigrantes da primeira geração ficaram. É uma mistura de português e japonês."]
  - [kenta, "この お饅頭[まんじゅう]、 懐[なつ]かしい 味[あじ] が する。 第二[だいに] の 日本[にほん] みたい だ。", "This sweet bun tastes like the old days. It's like a second Japan.", "Este manju tem gosto de antigamente. Parece um segundo Japão."]
  - [protagonist, "健太[けんた] に は タメ口[ぐち]、 お店[みせ] の 人[ひと] に は 敬語[けいご]、 家族[かぞく] に は ポルトガル語[ご]。 言葉[ことば] を 切[き]り替[か]える の が 忙[いそが]しい。", "Plain talk with Kenta, keigo with the shopkeeper, Portuguese with my family. Switching is busy work.", "Fala informal com o Kenta, keigo com a dona da loja, português com a família. Trocar de registro dá trabalho."]
  - [yui, "日系[にっけい] 社会[しゃかい] の 歴史[れきし] を、 ここ で 初[はじ]めて 実感[じっかん] した。", "Here I really felt the history of the nikkei community for the first time.", "Aqui senti na pele, pela primeira vez, a história da comunidade nikkei."]
  - [protagonist, "祖母[そぼ] も この 町[まち] で 買[か]い物[もの] を して いた。 胸[むね] が いっぱい だ よ。", "My grandmother used to shop in this neighbourhood. My heart is full.", "A minha avó fazia compras neste bairro. Estou com o coração cheio."]
teach:
  - ask: ["Say: Liberdade.", "Diga: Liberdade.", "リベルダージ", riberudaaji]
  - ask: ["Say: the nikkei community.", "Diga: a comunidade nikkei.", "日系[にっけい] 社会[しゃかい]", nikkei-shakai]
  - ask: ["Say: migration, settling abroad.", "Diga: imigração.", "移住[いじゅう]", ijuu]
  - ask: ["Say: the most in the world.", "Diga: o maior do mundo.", "世界[せかい] で 一番[いちばん] 多[おお]い", ichiban-ooi]
  - ask: ["Say: a paper lantern.", "Diga: lanterna de papel.", "提灯[ちょうちん]", chouchin]
  - ask: ["Say: old-fashioned Japanese.", "Diga: japonês de antigamente.", "昔[むかし] の 日本語[にほんご]", mukashi-no-nihongo]
  - ask: ["Say: a taste of the past.", "Diga: gosto de antigamente.", "懐[なつ]かしい 味[あじ]", natsukashii-aji]
  - ask: ["Say: a second Japan.", "Diga: um segundo Japão.", "第二[だいに] の 日本[にほん]", furusato-review]
  - ask: ["Say: switch registers.", "Diga: trocar de registro.", "言葉[ことば] を 切[き]り替[か]える", rejisutaa-kirikae]
  - ask: ["Say: my heart is full.", "Diga: o coração cheio.", "胸[むね] が いっぱい", kangeki-review]
  - note: ["Register shift is daily life for bilingual nikkei: plain Japanese with a friend, keigo with an elder, Portuguese with family — sometimes in one sentence. Older nikkei in Brazil keep a Japanese full of pre-war words and Portuguese loans, sometimes called «コロニア 語[ご]».", "A troca de registro é o dia a dia dos nikkeis bilíngues: japonês informal com um amigo, keigo com um mais velho, português com a família — às vezes numa frase só. Os nikkeis mais velhos no Brasil mantêm um japonês cheio de palavras de antes da guerra e empréstimos do português, às vezes chamado de «コロニア 語[ご]»."]
  - pt_only: "O Brasil tem cerca de dois milhões de descendentes de japoneses — a maior comunidade nikkei fora do Japão. Na Liberdade, os dois lados da sua história se encontram numa esquina."
