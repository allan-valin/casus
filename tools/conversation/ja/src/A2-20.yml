id: A2-20
protagonist: m
title: [Futsal, Futsal]
situation: ["Monday after the factory league match against the team from the paint plant. Kenta replays it in plain Japanese.", "Segunda depois do jogo da liga das fábricas contra o time da fábrica de tintas. O Kenta conta tudo em japonês informal."]
learn: []
culture: —
items:
  - [itta, "行[い]った", "went (plain)", "fui (simples)"]
  - [mita, "見[み]た", "saw (plain)", "vi (simples)"]
  - [tabeta, "食[た]べた", "ate (plain)", "comi (simples)"]
  - [shita, "した", "did (plain)", "fiz (simples)"]
  - [kita, "来[き]た", "came (plain)", "vim (simples)"]
  - [katta, "勝[か]った", "won (plain)", "ganhamos (simples)"]
  - [maketa, "負[ま]けた", "lost (plain)", "perdemos (simples)"]
  - [riigu, "リーグ", "league", "liga"]
  - [aite, "相手[あいて]", "the opponent", "o adversário"]
  - [tsuyokatta, "強[つよ]かった", "(they) were strong", "(eles) eram fortes"]
  - [ouen, "応援[おうえん]", "cheering, support", "torcida, apoio"]
dialogue:
  - [kenta, "昨日[きのう] の 試合[しあい]、 見[み]た？", "Did you see yesterday's match?", "Viu o jogo de ontem?"]
  - [protagonist, "見[み]た よ！ 応援[おうえん] に 行[い]った。", "I did! I went to cheer.", "Vi! Fui torcer."]
  - [kenta, "相手[あいて]、 強[つよ]かった ね。", "The other team was strong.", "O adversário era forte, né?"]
  - [protagonist, "うん。 でも 最後[さいご] に 健太[けんた] くん が ゴール した！", "Yeah. But at the end you scored, Kenta!", "É. Mas no fim você fez o gol, Kenta!"]
  - [kenta, "それで 勝[か]った。 リーグ で 二位[にい] に なった よ。", "And we won. We're second in the league now.", "E ganhamos. Ficamos em segundo na liga."]
  - [protagonist, "すごい！ 試合[しあい] の 後[あと] 何[なに] した？", "Great! What did you do after the match?", "Demais! O que vocês fizeram depois do jogo?"]
  - [kenta, "みんな で ラーメン を 食[た]べた。 ブラジル の 選手[せんしゅ] も 来[き]た よ。", "We all ate ramen. The Brazilian players came too.", "Comemos lámen todo mundo junto. Os jogadores brasileiros vieram também."]
  - [protagonist, "いい ね。 次[つぎ] は 僕[ぼく] も 行[い]く！", "Nice. Next time I'm coming too!", "Legal. Da próxima eu também vou!"]
teach:
  - note: ["The plain past is the «て» form with «た» instead of «て»: «行[い]って» → «行[い]った», «食[た]べて» → «食[た]べた», «して» → «した», «来[き]て» → «来[き]た». It's what friends use — Kenta's «見[み]た？» is the plain «見[み]ました か».", "O passado simples é a forma «て» com «た» no lugar de «て»: «行[い]って» → «行[い]った», «食[た]べて» → «食[た]べた», «して» → «した», «来[き]て» → «来[き]た». É o que os amigos usam — o «見[み]た？» do Kenta é o «見[み]ました か» informal."]
  - ask: ["Say: went — plain.", "Diga: fui — simples.", "行[い]った", itta]
  - ask: ["Say: saw — plain.", "Diga: vi — simples.", "見[み]た", mita]
  - ask: ["Say: ate — plain.", "Diga: comi — simples.", "食[た]べた", tabeta]
  - ask: ["Say: did — plain.", "Diga: fiz — simples.", "した", shita]
  - ask: ["Say: came — plain.", "Diga: vim — simples.", "来[き]た", kita]
  - ask: ["Ask Kenta, plain: did you see yesterday's match?", "Pergunte ao Kenta, informal: viu o jogo de ontem?", "昨日[きのう] の 試合[しあい]、 見[み]た？", mita]
  - ask: ["Say: we won — plain.", "Diga: ganhamos — simples.", "勝[か]った。", katta]
  - ask: ["Say: we lost — plain.", "Diga: perdemos — simples.", "負[ま]けた。", maketa]
  - ask: ["Say: the opponent.", "Diga: o adversário.", "相手[あいて]", aite]
  - ask: ["Say: they were strong.", "Diga: eles eram fortes.", "強[つよ]かった。", tsuyokatta]
  - ask: ["Say: the league.", "Diga: a liga.", "リーグ", riigu]
  - ask: ["Say: cheering, support.", "Diga: torcida, apoio.", "応援[おうえん]", ouen]
  - ask: ["Tell him plain: I went to cheer.", "Diga a ele, informal: fui torcer.", "応援[おうえん] に 行[い]った。", ouen, itta]
  - note: ["Many factories around Hamamatsu have company sports teams and local leagues, and Brazilian and Japanese workers often play side by side — one of the easiest places to make friends.", "Muitas fábricas em volta de Hamamatsu têm times e ligas locais, e trabalhadores brasileiros e japoneses jogam lado a lado — um dos lugares mais fáceis para fazer amigos."]
  - pt_only: "Torcer no Japão é organizado: cantos ensaiados, palmas no ritmo, e no fim os dois times se curvam um para o outro e para a torcida."
