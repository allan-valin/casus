id: B2-30
protagonist: m
title: ["The future", "O futuro"]
situation: ["Two years in Japan. Yui asks the question you've been avoiding: stay, or go back to Brazil? A look back at all of B2.", "Dois anos no Japão. A Yui faz a pergunta que você vinha evitando: ficar, ou voltar para o Brasil? Uma revisão de todo o B2."]
learn: []
culture: —
items:
  - [shourai, "将来[しょうらい]", "the future", "o futuro"]
  - [kikoku, "帰国[きこく]", "returning to one's country", "voltar ao país de origem"]
  - [nokoru, "残[のこ]る", "stay, remain", "ficar"]
  - [mayou, "迷[まよ]う", "be torn, hesitate", "ficar em dúvida"]
  - [kesshin, "決心[けっしん]", "decision, resolve", "decisão"]
  - [eijuu, "永住[えいじゅう]", "permanent residence", "residência permanente", {rare: true}]
  - [ryouhou-no-kuni, "両方[りょうほう] の 国[くに]", "both countries", "os dois países"]
  - [hashi-ni-naru, "架[か]け橋[はし] に なる", "become a bridge", "ser uma ponte"]
  - [isshoni-iru, "一緒[いっしょ] に いたい", "I want to be with (you)", "quero ficar com (você)"]
  - [shinpai-shinaide, "心配[しんぱい] しないで", "don't worry", "não se preocupe"]
dialogue:
  - [yui, "ねえ、 将来[しょうらい] の こと、 考[かんが]えて る？ 帰国[きこく] する の？", "Hey, have you thought about the future? Are you going back?", "Ei, você pensa no futuro? Vai voltar?"]
  - [protagonist, "ずっと 迷[まよ]って いた。 家族[かぞく] は ブラジル に いる から。", "I've been torn for a long time. My family's in Brazil.", "Fiquei em dúvida esse tempo todo. Minha família está no Brasil."]
  - [yui, "そう だ よね…", "Right…", "É…"]
  - [protagonist, "でも 決心[けっしん] した。 日本[にほん] に 残[のこ]る。 由衣[ゆい] と 一緒[いっしょ] に いたい。", "But I've decided. I'm staying in Japan. I want to be with you.", "Mas decidi. Vou ficar no Japão. Quero ficar com você."]
  - [yui, "本当[ほんとう]？ 嬉[うれ]しい！", "Really? I'm so happy!", "Sério? Que alegria!"]
  - [protagonist, "仕事[しごと] で も、 両方[りょうほう] の 国[くに] の 架[か]け橋[はし] に なりたい。 いつか 永住[えいじゅう] も 申請[しんせい] する つもり。", "At work too, I want to be a bridge between both countries. Someday I plan to apply for permanent residence.", "No trabalho também, quero ser uma ponte entre os dois países. Um dia pretendo pedir a residência permanente."]
  - [yui, "お母[かあ]さん たち は 大丈夫[だいじょうぶ]？", "Will your mother and family be all right?", "E a sua mãe e a família?"]
  - [protagonist, "毎年[まいとし] 会[あ]い に 行[い]く。 心配[しんぱい] しないで。 次[つぎ] は 由衣[ゆい] も 一緒[いっしょ] に ブラジル へ 行[い]こう。", "I'll go and see them every year. Don't worry. Next time, let's go to Brazil together.", "Vou visitar todo ano. Não se preocupe. Da próxima vez, vamos juntos para o Brasil."]
teach:
  - ask: ["Say: the future.", "Diga: o futuro.", "将来[しょうらい]", shourai]
  - ask: ["Say: returning to your country.", "Diga: voltar ao país de origem.", "帰国[きこく]", kikoku]
  - ask: ["Say: to be torn.", "Diga: ficar em dúvida.", "迷[まよ]う", mayou]
  - ask: ["Say: a decision, resolve.", "Diga: uma decisão.", "決心[けっしん]", kesshin]
  - ask: ["Say: to stay.", "Diga: ficar.", "残[のこ]る", nokoru]
  - ask: ["Tell her: I want to be with you.", "Diga a ela: quero ficar com você.", "一緒[いっしょ] に いたい。", isshoni-iru]
  - ask: ["Say: both countries.", "Diga: os dois países.", "両方[りょうほう] の 国[くに]", ryouhou-no-kuni]
  - ask: ["Say: become a bridge.", "Diga: ser uma ponte.", "架[か]け橋[はし] に なる", hashi-ni-naru]
  - ask: ["Say: permanent residence.", "Diga: residência permanente.", "永住[えいじゅう]", eijuu]
  - ask: ["Reassure her: don't worry.", "Tranquilize-a: não se preocupe.", "心配[しんぱい] しないで。", shinpai-shinaide]
  - note: ["Permanent residence, «永住[えいじゅう]», usually needs about ten years in Japan, fewer for spouses of Japanese citizens and for some highly skilled workers. Many Brazilians in Hamamatsu live between the two countries for years before deciding.", "A residência permanente, «永住[えいじゅう]», em geral pede uns dez anos no Japão, menos para cônjuges de japoneses e para alguns profissionais altamente qualificados. Muitos brasileiros de Hamamatsu vivem entre os dois países por anos antes de decidir."]
  - note: ["That's the end of B2. You can work in Japanese: humble and respectful verbs, email and phone, meetings and presentations, complaints and apologies, leave and promotions — and talk about the harder topics: ageing, marriage, harassment, the news. In C1: life in depth.", "Fim do B2. Você consegue trabalhar em japonês: verbos humildes e respeitosos, e-mail e telefone, reuniões e apresentações, reclamações e desculpas, férias e promoções — e falar dos temas mais difíceis: envelhecimento, casamento, assédio, o noticiário. No C1: a vida em profundidade."]
  - pt_only: "Ficar ou voltar é a pergunta de quase todo brasileiro no Japão. Não tem resposta certa — tem a sua."
