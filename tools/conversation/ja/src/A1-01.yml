id: A1-01
protagonist: f
title: [The landlady, A dona do apartamento]
situation: ["You arrive at your new flat in Hamamatsu. The landlady, Mrs Suzuki, opens the door next door.", "Você chega ao apartamento novo em Hamamatsu. A dona, a senhora Suzuki, abre a porta ao lado."]
learn: []
culture: A bow, not a hug
items:
  - [konnichiwa, "こんにちは", "Hello / good afternoon", "Olá / boa tarde"]
  - [hajimemashite, "はじめまして", "Nice to meet you (first meeting)", "Muito prazer (no primeiro encontro)"]
  - [desu, "です", "am / is / are (polite)", "sou / é (educado)"]
  - [yoroshiku, "よろしく お願[ねが]いします", "Please treat me kindly (said when meeting)", "Conto com a senhora (dito ao se conhecer)"]
  - [burajiru, "ブラジル", "Brazil", "Brasil"]
  - [kara, "から", "from", "de (origem)"]
  - [kimashita, "来[き]ました", "came", "vim"]
  - [watashi, "私[わたし]", "I", "eu"]
  - [suzuki-san, "鈴木[すずき] さん", "Mrs Suzuki", "senhora Suzuki"]
  - [hai, "はい", "yes", "sim"]
  - [sumimasen, "すみません", "excuse me / sorry", "com licença / desculpe"]
  - [wakarimasen, "わかりません", "I don't understand", "não entendo"]
dialogue:
  - [suzuki, "はい？ どちら 様[さま] です か。", "Yes? Who is it?", "Sim? Quem é?"]
  - [protagonist, "こんにちは。 はじめまして。", "Hello. Nice to meet you.", "Olá! Muito prazer."]
  - [suzuki, "ああ、 新[あたら]しい 人[ひと] です ね。", "Ah, you're the new person.", "Ah, você é a pessoa nova."]
  - [protagonist, "すみません、 わかりません。", "Sorry, I don't understand.", "Desculpe, não entendo."]
  - [suzuki, "鈴木[すずき] です。 よろしく お願[ねが]いします。", "I'm Suzuki. Pleased to meet you.", "Sou Suzuki. Muito prazer."]
  - [protagonist, "鈴木[すずき] さん。 私[わたし] は ブラジル から 来[き]ました。", "Mrs Suzuki. I came from Brazil.", "Senhora Suzuki. Eu vim do Brasil."]
  - [suzuki, "ブラジル！ 遠[とお]い です ね。", "Brazil! That's far.", "Brasil! É longe."]
  - [protagonist, "はい。 よろしく お願[ねが]いします。", "Yes. Pleased to meet you.", "Sim. Muito prazer."]
teach:
  - note: ["The first word of almost every meeting: «こんにちは» — hello, good afternoon.", "A primeira palavra de quase todo encontro: «こんにちは» — olá, boa tarde."]
  - ask: ["Greet the landlady.", "Cumprimente a dona do apartamento.", "こんにちは。", konnichiwa]
  - note: ["The very first time you meet someone, add «はじめまして» — nice to meet you.", "Na primeira vez que você conhece alguém, acrescente «はじめまして» — muito prazer."]
  - ask: ["Greet her for the first time.", "Cumprimente-a pela primeira vez.", "こんにちは。 はじめまして。", konnichiwa, hajimemashite]
  - note: ["She didn't understand you? Say so politely: «すみません、 わかりません».", "Não entendeu? Diga com educação: «すみません、 わかりません»."]
  - ask: ["Say you don't understand, politely.", "Diga que não entende, com educação.", "すみません、 わかりません。", sumimasen, wakarimasen]
  - note: ["In Japan you use the family name plus «さん»: «鈴木[すずき] さん». Never the first name of an older person.", "No Japão se usa o sobrenome mais «さん»: «鈴木[すずき] さん». Nunca o primeiro nome de uma pessoa mais velha."]
  - line: [suzuki, suzuki-san]
  - ask: ["Call her by her name.", "Chame-a pelo nome.", "鈴木[すずき] さん。", suzuki-san]
  - note: ["«私[わたし] は ブラジル から 来[き]ました» — I came from Brazil. «は» marks what you talk about, «から» means from.", "«私[わたし] は ブラジル から 来[き]ました» — eu vim do Brasil. «は» marca o assunto, «から» quer dizer 'de' (origem)."]
  - ask: ["Say: I.", "Diga: eu.", "私[わたし]", watashi]
  - ask: ["Say: Brazil.", "Diga: Brasil.", "ブラジル", burajiru]
  - ask: ["Say: from Brazil.", "Diga: do Brasil.", "ブラジル から", burajiru, kara]
  - ask: ["Say: I came from Brazil.", "Diga: eu vim do Brasil.", "私[わたし] は ブラジル から 来[き]ました。", watashi, burajiru, kara, kimashita]
  - note: ["«よろしく お願[ねが]いします» has no translation: it asks the other person to treat you kindly from now on. You say it when you meet, with a small bow.", "«よろしく お願[ねが]いします» não tem tradução: pede que a pessoa seja gentil com você daqui em diante. Diz-se ao conhecer alguém, com uma pequena reverência."]
  - build: [yoroshiku, ["お願[ねが]いします", "よろしく お願[ねが]いします"]]
  - ask: ["Say it to her, with a bow.", "Diga isso a ela, com uma reverência.", "よろしく お願[ねが]いします。", yoroshiku]
  - ask: ["She asks if you're the new tenant. Answer yes.", "Ela pergunta se você é a nova inquilina. Responda que sim.", "はい。", hai]
  - ask: ["Say: I'm Brazilian — word for word, 'I am Brazil person'.", "Diga: sou brasileira — palavra por palavra, 'eu sou pessoa do Brasil'.", "私[わたし] は ブラジル 人[じん] です。", watashi, burajiru, desu]
  - pt_only: "No Brasil a gente abraça e dá beijo; no Japão, uma reverência e nada de toque. E os sapatos ficam na porta — isso é a próxima unidade."
