id: C2-24
protagonist: m
title: ["Local politics", "Política local"]
situation: ["The city holds a public briefing on a new budget for foreign residents. Council member Tanaka — the loudspeaker-car candidate, now elected — invites questions; you stand up and speak.", "A prefeitura faz uma reunião pública sobre um novo orçamento para moradores estrangeiros. O vereador Tanaka — aquele candidato do carro de som, agora eleito — abre para perguntas; você se levanta e fala."]
learn: []
culture: —
items:
  - [setsumeikai, "説明会[せつめいかい]", "public briefing", "reunião de esclarecimento"]
  - [yosan, "予算[よさん]", "budget", "orçamento"]
  - [giin, "議員[ぎいん]", "council member, legislator", "vereador, parlamentar"]
  - [hatsugen, "発言[はつげん]", "speaking (in a meeting)", "fala, intervenção"]
  - [teian-review, "提案[ていあん] させて いただきます", "allow me to propose", "permitam-me propor"]
  - [touji-sha, "当事者[とうじしゃ]", "the people directly concerned", "os diretamente envolvidos", {rare: true}]
  - [koe, "声[こえ]", "voice (opinion)", "voz (opinião)"]
  - [hanei, "反映[はんえい]", "reflecting (opinions in policy)", "refletir (opiniões em políticas)"]
  - [nihongo-kyoushitsu, "日本語[にほんご] 教室[きょうしつ]", "Japanese class (for residents)", "aula de japonês (para moradores)"]
  - [gutaiteki-ni, "具体的[ぐたいてき] に", "concretely", "concretamente"]
dialogue:
  - [kouhosha, "では、 予算[よさん] に ついて、 ご質問[しつもん] や ご意見[いけん] を どうぞ。", "Now, questions or opinions about the budget, please.", "Agora, perguntas ou opiniões sobre o orçamento, por favor."]
  - [protagonist, "発言[はつげん] の 機会[きかい] を いただき、 ありがとう ございます。 ブラジル 出身[しゅっしん] で、 浜松[はままつ] に 住[す]んで 五年[ごねん] に なります。", "Thank you for the chance to speak. I'm from Brazil and have lived in Hamamatsu for five years.", "Obrigado pela oportunidade de falar. Sou do Brasil e moro em Hamamatsu há cinco anos."]
  - [protagonist, "具体的[ぐたいてき] に 二[ふた]つ 提案[ていあん] させて いただきます。 一[ひと]つ 目[め] は、 夜[よる] の 日本語[にほんご] 教室[きょうしつ] の 予算[よさん] です。", "Allow me to make two concrete proposals. The first is funding for evening Japanese classes.", "Permitam-me fazer duas propostas concretas. A primeira é o orçamento para aulas de japonês à noite."]
  - [protagonist, "二[ふた]つ 目[め] は、 計画[けいかく] を 作[つく]る 段階[だんかい] から、 当事者[とうじしゃ] で ある 外国人[がいこくじん] の 声[こえ] を 反映[はんえい] して いただきたい と いう こと です。", "The second is that we'd like the voices of the foreigners concerned to be reflected from the planning stage.", "A segunda é que gostaríamos que a voz dos estrangeiros, que são os diretamente envolvidos, fosse ouvida desde o planejamento."]
  - [kouhosha, "貴重[きちょう] な ご意見[いけん]、 ありがとう ございます。 議員[ぎいん] と して 持[も]ち帰[かえ]って 検討[けんとう] します。", "Thank you for this valuable opinion. As a council member, I'll take it back and consider it.", "Obrigado pela valiosa contribuição. Como vereador, vou levar e estudar."]
  - [protagonist, "検討[けんとう] の 結果[けっか] を、 次回[じかい] の 説明会[せつめいかい] で 教[おし]えて いただけます か。", "Could you tell us the result of that consideration at the next briefing?", "O senhor poderia nos dizer o resultado desse estudo na próxima reunião?"]
  - [kouhosha, "…はい。 必[かなら]ず ご報告[ほうこく] します。", "…Yes. I'll certainly report back.", "…Sim. Com certeza vou informar."]
  - [protagonist, "ありがとう ございます。 以上[いじょう] です。", "Thank you. That's all.", "Obrigado. É isso."]
teach:
  - ask: ["Say: a public briefing.", "Diga: reunião de esclarecimento.", "説明会[せつめいかい]", setsumeikai]
  - ask: ["Say: the budget.", "Diga: o orçamento.", "予算[よさん]", yosan]
  - ask: ["Say: a council member.", "Diga: um vereador.", "議員[ぎいん]", giin]
  - ask: ["Say: speaking in a meeting.", "Diga: uma intervenção.", "発言[はつげん]", hatsugen]
  - ask: ["Say: concretely.", "Diga: concretamente.", "具体的[ぐたいてき] に", gutaiteki-ni]
  - ask: ["Say: allow me to propose.", "Diga: permitam-me propor.", "提案[ていあん] させて いただきます", teian-review]
  - ask: ["Say: evening Japanese classes.", "Diga: aulas de japonês.", "日本語[にほんご] 教室[きょうしつ]", nihongo-kyoushitsu]
  - ask: ["Say: the people directly concerned.", "Diga: os diretamente envolvidos.", "当事者[とうじしゃ]", touji-sha]
  - ask: ["Say: voice, opinion.", "Diga: voz, opinião.", "声[こえ]", koe]
  - ask: ["Say: reflecting opinions in policy.", "Diga: refletir opiniões em políticas.", "反映[はんえい]", hanei]
  - note: ["Public speaking at a meeting: thank for the chance («発言[はつげん] の 機会[きかい] を いただき»), introduce yourself in one line, number your points («一[ひと]つ 目[め] は… 二[ふた]つ 目[め] は…»), close with «以上[いじょう] です». And remember «検討[けんとう] します» — ask when you'll hear the result.", "Falar em reunião pública: agradecer a oportunidade («発言[はつげん] の 機会[きかい] を いただき»), se apresentar numa linha, numerar os pontos («一[ひと]つ 目[め] は… 二[ふた]つ 目[め] は…»), fechar com «以上[いじょう] です». E lembre do «検討[けんとう] します» — pergunte quando vai sair o resultado."]
  - pt_only: "Foi aquele «検討[けんとう] します» que você aprendeu no B1 que quer dizer «não». Agora você sabe a resposta: pedir, educadamente, o resultado na próxima reunião."
