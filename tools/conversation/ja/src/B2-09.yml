id: B2-09
protagonist: f
title: ["The universe", "O universo"]
situation: ["A clear winter night on the tea farm. Shota points out the stars and tells you about Hayabusa2, the probe that brought back asteroid dust.", "Uma noite clara de inverno na plantação de chá. O Shota mostra as estrelas e conta da Hayabusa2, a sonda que trouxe poeira de um asteroide."]
learn: []
culture: —
items:
  - [uchuu, "宇宙[うちゅう]", "space, the universe", "espaço, universo"]
  - [tansaki, "探査機[たんさき]", "space probe", "sonda espacial", {rare: true}]
  - [ginga, "銀河[ぎんが]", "galaxy", "galáxia"]
  - [amanogawa, "天[あま]の川[がわ]", "the Milky Way", "a Via Láctea"]
  - [hazu, "〜はず", "should be (expected)", "deve ser (esperado)"]
  - [mieru-hazu, "見[み]える はず", "should be visible", "deve dar para ver"]
  - [shouwakusei, "小惑星[しょうわくせい]", "asteroid", "asteroide", {rare: true}]
  - [chikyuu, "地球[ちきゅう]", "the Earth", "a Terra"]
  - [kaette-kita, "帰[かえ]って きた", "came back", "voltou"]
  - [nagareboshi, "流[なが]れ 星[ぼし]", "shooting star", "estrela-cadente"]
  - [negaigoto, "願[ねが]い事[ごと]", "a wish", "um pedido"]
dialogue:
  - [shota, "今夜[こんや] は 晴[は]れて いる から、 天[あま]の川[がわ] が 見[み]える はず だ よ。", "It's clear tonight, so we should see the Milky Way.", "Hoje está limpo, então deve dar para ver a Via Láctea."]
  - [protagonist, "あ、 本当[ほんとう] だ！ あれ が 私[わたし]たち の 銀河[ぎんが]？", "Oh, it's true! Is that our galaxy?", "Ah, é mesmo! Aquilo é a nossa galáxia?"]
  - [shota, "そう。 宇宙[うちゅう] って 大[おお]きい よね。", "Yes. Space is huge, isn't it.", "É. O universo é enorme, né?"]
  - [protagonist, "日本[にほん] の 探査機[たんさき] が 小惑星[しょうわくせい] から 帰[かえ]って きた ん でしょ？", "A Japanese probe came back from an asteroid, right?", "Uma sonda japonesa voltou de um asteroide, não foi?"]
  - [shota, "はやぶさ２。 リュウグウ の 砂[すな] を 地球[ちきゅう] に 持[も]って 帰[かえ]った。 2020 年[ねん] だった はず。", "Hayabusa2. It brought sand from Ryugu back to Earth. In 2020, I think.", "A Hayabusa2. Trouxe areia do Ryugu para a Terra. Foi em 2020, eu acho."]
  - [protagonist, "すごい！ あ、 流[なが]れ 星[ぼし]！", "Amazing! Oh, a shooting star!", "Incrível! Olha, uma estrela-cadente!"]
  - [shota, "願[ねが]い事[ごと]、 した？", "Did you make a wish?", "Fez um pedido?"]
  - [protagonist, "した。 でも 秘密[ひみつ]。", "I did. But it's a secret.", "Fiz. Mas é segredo."]
teach:
  - ask: ["Say: space, the universe.", "Diga: o universo.", "宇宙[うちゅう]", uchuu]
  - ask: ["Say: a galaxy.", "Diga: uma galáxia.", "銀河[ぎんが]", ginga]
  - ask: ["Say: the Milky Way.", "Diga: a Via Láctea.", "天[あま]の川[がわ]", amanogawa]
  - note: ["«〜はず» is should be — what you expect from what you know: «晴[は]れて いる から、 見[み]える はず», it's clear, so it should be visible. «2020 年[ねん] だった はず», it should have been 2020 — I'm fairly sure. «はず が ない» is it can't be.", "«〜はず» é deve ser — o que se espera pelo que se sabe: «晴[は]れて いる から、 見[み]える はず», está limpo, então deve dar para ver. «2020 年[ねん] だった はず», deve ter sido em 2020 — tenho quase certeza. «はず が ない» é não pode ser."]
  - ask: ["Say the pattern: should be.", "Diga o padrão: deve ser.", "〜はず", hazu]
  - ask: ["Say: it should be visible.", "Diga: deve dar para ver.", "見[み]える はず", mieru-hazu]
  - ask: ["Say: a space probe.", "Diga: uma sonda espacial.", "探査機[たんさき]", tansaki]
  - ask: ["Say: an asteroid.", "Diga: um asteroide.", "小惑星[しょうわくせい]", shouwakusei]
  - ask: ["Say: the Earth.", "Diga: a Terra.", "地球[ちきゅう]", chikyuu]
  - ask: ["Say: it came back.", "Diga: voltou.", "帰[かえ]って きた", kaette-kita]
  - ask: ["Say: a shooting star.", "Diga: uma estrela-cadente.", "流[なが]れ 星[ぼし]", nagareboshi]
  - ask: ["Say: a wish.", "Diga: um pedido.", "願[ねが]い事[ごと]", negaigoto]
  - note: ["JAXA's probe «はやぶさ２» collected samples from the asteroid Ryugu and dropped them in a capsule over Australia in December 2020 — the first time material from below an asteroid's surface reached Earth.", "A sonda «はやぶさ２» da JAXA coletou amostras do asteroide Ryugu e as soltou numa cápsula sobre a Austrália em dezembro de 2020 — a primeira vez que material de baixo da superfície de um asteroide chegou à Terra."]
  - pt_only: "No hemisfério sul a Via Láctea brilha forte no inverno; no Japão, no verão. E o pedido à estrela-cadente funciona igual nos dois lados do mundo."
