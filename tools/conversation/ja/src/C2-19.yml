id: C2-19
protagonist: f
title: ["The diagnosis", "O diagnóstico"]
situation: ["The university hospital recommends surgery for your knee. Before deciding, you ask your family doctor about a second opinion.", "O hospital universitário recomenda cirurgia no seu joelho. Antes de decidir, você pergunta ao médico de família sobre uma segunda opinião."]
learn: []
culture: —
items:
  - [shindan, "診断[しんだん]", "diagnosis", "diagnóstico"]
  - [chiryou, "治療[ちりょう]", "treatment", "tratamento"]
  - [sekando-opinion, "セカンド オピニオン", "second opinion", "segunda opinião"]
  - [shoken, "所見[しょけん]", "medical findings", "parecer médico", {rare: true}]
  - [shujutsu, "手術[しゅじゅつ]", "surgery", "cirurgia"]
  - [hokano-houhou, "ほか の 方法[ほうほう]", "another option", "outra opção"]
  - [rehabiri, "リハビリ", "rehabilitation, physio", "fisioterapia"]
  - [kangaete-mo-yoroshii, "考[かんが]えさせて いただけます か", "may I think about it", "posso pensar um pouco"]
  - [shinryou-jouhou, "診療[しんりょう] 情報[じょうほう] 提供[ていきょう] 書[しょ]", "medical information letter", "relatório médico para outro serviço", {rare: true}]
  - [nattoku, "納得[なっとく]", "being convinced, agreeing", "estar convencido"]
dialogue:
  - [protagonist, "大学[だいがく] 病院[びょういん] で、 膝[ひざ] の 手術[しゅじゅつ] を 勧[すす]められました。", "At the university hospital they recommended knee surgery.", "No hospital universitário me recomendaram uma cirurgia no joelho."]
  - [isha, "診断[しんだん] は 何[なん] と 言[い]われました か。", "What was the diagnosis they gave you?", "Qual foi o diagnóstico que deram?"]
  - [protagonist, "半月板[はんげつばん] の 損傷[そんしょう] だ そう です。 でも、 手術[しゅじゅつ] 以外[いがい] の 治療[ちりょう] は ない の か と 思[おも]って。", "Meniscus damage, they say. But I wondered whether there's no treatment other than surgery.", "Lesão no menisco, disseram. Mas fiquei pensando se não existe tratamento além da cirurgia."]
  - [isha, "セカンド オピニオン を 受[う]ける の は、 患者[かんじゃ] の 権利[けんり] です よ。", "Getting a second opinion is the patient's right.", "Pedir segunda opinião é direito do paciente."]
  - [protagonist, "失礼[しつれい] に なりません か。 先生[せんせい] を 信[しん]じて いない よう で。", "Isn't it rude? As if I don't trust the doctor.", "Não é falta de educação? Parece que não confio no médico."]
  - [isha, "いいえ。 大学[だいがく] 病院[びょういん] に 所見[しょけん] と 資料[しりょう] を 出[だ]して もらいましょう。 ほか の 方法[ほうほう]、 例[たと]えば リハビリ の 可能性[かのうせい] も 聞[き]けます。", "Not at all. Let's ask the university hospital to send the findings and records. You can also ask about other options, like physio.", "De jeito nenhum. Vamos pedir ao hospital universitário que envie o parecer e os exames. Você pode perguntar também sobre outras opções, como fisioterapia."]
  - [protagonist, "では、 少[すこ]し 考[かんが]えさせて いただけます か と 大学[だいがく] 病院[びょういん] に 伝[つた]えます。", "Then I'll tell the university hospital, “May I take a little time to think?”", "Então vou dizer ao hospital universitário: «Posso pensar um pouco?»"]
  - [isha, "納得[なっとく] して から 治療[ちりょう] を 選[えら]ぶ の が 一番[いちばん] です。", "It's best to choose a treatment once you're convinced.", "O melhor é escolher o tratamento depois de estar convencida."]
teach:
  - ask: ["Say: a diagnosis.", "Diga: um diagnóstico.", "診断[しんだん]", shindan]
  - ask: ["Say: surgery.", "Diga: cirurgia.", "手術[しゅじゅつ]", shujutsu]
  - ask: ["Say: treatment.", "Diga: tratamento.", "治療[ちりょう]", chiryou]
  - ask: ["Say: a second opinion.", "Diga: segunda opinião.", "セカンド オピニオン", sekando-opinion]
  - ask: ["Say: medical findings.", "Diga: parecer médico.", "所見[しょけん]", shoken]
  - ask: ["Say: another option.", "Diga: outra opção.", "ほか の 方法[ほうほう]", hokano-houhou]
  - ask: ["Say: physio.", "Diga: fisioterapia.", "リハビリ", rehabiri]
  - note: ["Asking a doctor for time without sounding distrustful uses the humble causative: «考[かんが]えさせて いただけます か» — may I be allowed to think about it? A second opinion is a recognised right; the first hospital provides the records, «診療[しんりょう] 情報[じょうほう] 提供[ていきょう] 書[しょ]», and the patient usually pays for that consultation privately.", "Pedir tempo ao médico sem parecer desconfiança usa o causativo humilde: «考[かんが]えさせて いただけます か» — posso ter um tempo para pensar? A segunda opinião é um direito reconhecido; o primeiro hospital fornece os registros, «診療[しんりょう] 情報[じょうほう] 提供[ていきょう] 書[しょ]», e o paciente geralmente paga essa consulta à parte."]
  - ask: ["Ask for time: may I think about it?", "Peça tempo: posso pensar um pouco?", "考[かんが]えさせて いただけます か", kangaete-mo-yoroshii]
  - ask: ["Say: the medical information letter.", "Diga: o relatório médico para outro serviço.", "診療[しんりょう] 情報[じょうほう] 提供[ていきょう] 書[しょ]", shinryou-jouhou]
  - ask: ["Say: being convinced.", "Diga: estar convencido.", "納得[なっとく]", nattoku]
  - pt_only: "No Brasil é comum ouvir dois ou três médicos antes de operar. No Japão também é direito — só pede um pouco mais de jeito para pedir."
