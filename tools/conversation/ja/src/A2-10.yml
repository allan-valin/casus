id: A2-10
protagonist: m
title: [A date, Um encontro]
situation: ["You matched with Yui, a designer, on a dating app. First meeting at a café near the station, then a walk.", "Você deu match com a Yui, designer, num aplicativo de namoro. Primeiro encontro num café perto da estação, depois uma caminhada."]
learn: []
culture: Make clear what you each want
items:
  - [deeto, "デート", "date", "encontro"]
  - [kafe, "カフェ", "café", "café (o lugar)", {rare: true}]
  - [apuri, "アプリ", "app", "aplicativo", {rare: true}]
  - [renrakusaki, "連絡先[れんらくさき]", "contact details", "contato", {rare: true}]
  - [shumi, "趣味[しゅみ]", "hobby", "hobby, passatempo"]
  - [shigoto-wa, "お仕事[しごと] は", "and your work?", "e o seu trabalho?"]
  - [itte-mite, "行[い]って、 見[み]て", "went and saw (て sequence)", "fui e vi (sequência com て)"]
  - [tabete-hanashite, "食[た]べて、 話[はな]して", "ate and talked", "comemos e conversamos"]
  - [majime, "真面目[まじめ]", "serious, sincere", "sério, sincero"]
  - [mata-aemasu-ka, "また 会[あ]えます か", "can we meet again?", "podemos nos ver de novo?"]
  - [hontou-ni, "本当[ほんとう] に", "really, truly", "de verdade"]
dialogue:
  - [yui, "はじめまして、 由衣[ゆい] です。 アプリ の 写真[しゃしん] と 同[おな]じ です ね。", "Nice to meet you, I'm Yui. You look like your photo on the app.", "Prazer, sou a Yui. Você é igual à foto do aplicativo."]
  - [protagonist, "よかった。 由衣[ゆい] さん の お仕事[しごと] は デザイン です よね。", "Good. Your work is design, right?", "Que bom. Você trabalha com design, não é?"]
  - [yui, "はい。 趣味[しゅみ] は カフェ めぐり です。 外国[がいこく] の 人[ひと] と デート は 初[はじ]めて です。", "Yes. My hobby is going round cafés. It's my first date with someone from abroad.", "Sim. Meu hobby é conhecer cafés. É meu primeiro encontro com alguém de fora."]
  - [protagonist, "僕[ぼく] は 一年[いちねん] 日本[にほん] に います。 遊[あそ]び じゃ なくて、 真面目[まじめ] に 付[つ]き合[あ]いたい です。", "I'm in Japan for a year. I'm not looking for a fling — I want something serious.", "Vou ficar um ano no Japão. Não quero só curtir — quero algo sério."]
  - [yui, "そう です か。 私[わたし] も 国籍[こくせき] より 人柄[ひとがら] だ と 思[おも]います。", "I see. I think personality matters more than nationality, too.", "Entendi. Eu também acho que o jeito da pessoa importa mais que a nacionalidade."]
  - [protagonist, "今日[きょう] は コーヒー を 飲[の]んで、 たくさん 話[はな]して、 楽[たの]しかった です。", "Today we had coffee, talked a lot — it was fun.", "Hoje tomamos café, conversamos bastante — foi divertido."]
  - [yui, "私[わたし] も。 連絡先[れんらくさき]、 交換[こうかん] しましょう か。", "Me too. Shall we swap contacts?", "Eu também. Vamos trocar contato?"]
  - [protagonist, "はい！ また 会[あ]えます か。", "Yes! Can we meet again?", "Vamos! A gente pode se ver de novo?"]
teach:
  - ask: ["Say: a date.", "Diga: um encontro.", "デート", deeto]
  - ask: ["Say: an app.", "Diga: um aplicativo.", "アプリ", apuri]
  - ask: ["Say: a café.", "Diga: um café, o lugar.", "カフェ", kafe]
  - ask: ["Ask about her work, gently: and your work?", "Pergunte do trabalho dela, com jeito: e o seu trabalho?", "お仕事[しごと] は？", shigoto-wa]
  - ask: ["Say: hobby.", "Diga: hobby.", "趣味[しゅみ]", shumi]
  - note: ["The «て» form strings a day together: «コーヒー を 飲[の]んで、 話[はな]して、 楽[たの]しかった» — we had coffee, talked, and it was fun. Only the last word carries the past.", "A forma «て» encadeia um dia inteiro: «コーヒー を 飲[の]んで、 話[はな]して、 楽[たの]しかった» — tomamos café, conversamos e foi divertido. Só a última palavra leva o passado."]
  - ask: ["Say: went and saw.", "Diga: fui e vi.", "行[い]って、 見[み]て", itte-mite]
  - ask: ["Say: we ate and talked.", "Diga: comemos e conversamos.", "食[た]べて、 話[はな]して", tabete-hanashite]
  - ask: ["Say: really, truly.", "Diga: de verdade.", "本当[ほんとう] に", hontou-ni]
  - ask: ["Say: serious, sincere.", "Diga: sério, sincero.", "真面目[まじめ]", majime]
  - ask: ["Say: contact details.", "Diga: o contato.", "連絡先[れんらくさき]", renrakusaki]
  - ask: ["Ask her: can we meet again?", "Pergunte a ela: podemos nos ver de novo?", "また 会[あ]えます か。", mata-aemasu-ka]
  - note: ["Asked what matters in a partner, most Japanese say personality over nationality. Curiosity about foreigners is real, and for some it is mostly an adventure — so say early what you are looking for, as he did. About one marriage in 25 in Japan is international.", "Perguntados sobre o que importa num parceiro, a maioria dos japoneses diz que é o jeito da pessoa, não a nacionalidade. A curiosidade por estrangeiros existe, e para alguns é mais uma aventura — por isso diga cedo o que você procura, como ele fez. Cerca de um casamento em 25 no Japão é internacional."]
  - pt_only: "No Brasil o primeiro encontro já pode ter beijo; no Japão o ritmo costuma ser mais lento, e muitos casais só se consideram namorados depois de uma declaração clara — é a próxima unidade."
