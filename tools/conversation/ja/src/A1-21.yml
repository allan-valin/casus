id: A1-21
protagonist: f
title: [Plants, Plantas]
situation: ["Early April. Kenta and Mrs Suzuki take you to see the cherry blossoms in the park at Hamamatsu Castle.", "Começo de abril. O Kenta e a senhora Suzuki levam você para ver as cerejeiras no parque do Castelo de Hamamatsu."]
learn: []
culture: Hanami, and keeping a spot
items:
  - [sakura, "桜[さくら]", "cherry blossom, cherry tree", "flor de cerejeira, cerejeira", {rare: true}]
  - [hanami, "花見[はなみ]", "cherry-blossom viewing", "piquenique para ver as cerejeiras", {rare: true}]
  - [hana, "花[はな]", "flower", "flor"]
  - [ki-tree, "木[き]", "tree", "árvore"]
  - [oshiro, "お城[しろ]", "castle", "castelo"]
  - [kouen, "公園[こうえん]", "park", "parque"]
  - [haru, "春[はる]", "spring", "primavera"]
  - [sakimashita, "咲[さ]きました", "(it) bloomed, is in bloom", "floresceu, está florido"]
  - [mankai, "満開[まんかい]", "in full bloom", "totalmente florido", {rare: true}]
  - [bashotori, "場所[ばしょ]取[と]り", "keeping a spot (for a picnic)", "guardar lugar (para o piquenique)", {rare: true}]
  - [obentou, "お弁当[べんとう]", "packed lunch, bentō", "marmita, bentô"]
  - [ikimashou, "行[い]きましょう", "let's go", "vamos"]
  - [tabemashou, "食[た]べましょう", "let's eat", "vamos comer"]
  - [shashin-torimashou, "写真[しゃしん] を 撮[と]りましょう", "let's take a photo", "vamos tirar uma foto"]
dialogue:
  - [suzuki, "見[み]て ください。 桜[さくら] が 満開[まんかい] です よ。", "Look. The cherry trees are in full bloom.", "Olhe. As cerejeiras estão totalmente floridas."]
  - [protagonist, "わあ、 きれい！ 木[き] が 全部[ぜんぶ] ピンク です ね。", "Wow, beautiful! All the trees are pink.", "Nossa, que lindo! As árvores estão todas cor-de-rosa."]
  - [kenta, "会社[かいしゃ] の 人[ひと] が 朝[あさ] から 場所[ばしょ]取[と]り を しました。 あそこ です。", "People from the company kept a spot since the morning. Over there.", "O pessoal da empresa guardou lugar desde cedo. Ali."]
  - [protagonist, "朝[あさ] から？ すごい です ね。", "Since the morning? Wow.", "Desde cedo? Que coisa."]
  - [suzuki, "お弁当[べんとう] が あります。 食[た]べましょう。", "I have packed lunches. Let's eat.", "Tenho marmitas. Vamos comer."]
  - [protagonist, "いただきます！ 後[あと] で お城[しろ] に 行[い]きましょう か。", "Thank you for the food! Shall we go to the castle later?", "Obrigada pela comida! Vamos ao castelo depois?"]
  - [suzuki, "春[はる] は 花見[はなみ] です よ。 毎年[まいとし] ここ に 来[き]ます。", "Spring means hanami. I come here every year.", "Primavera é tempo de ver as cerejeiras. Venho aqui todo ano."]
  - [kenta, "いい です ね。 その 前[まえ] に、 三人[さんにん] で 写真[しゃしん] を 撮[と]りましょう。", "Good idea. Before that, let's take a photo, the three of us.", "Boa. Antes disso, vamos tirar uma foto, nós três."]
teach:
  - ask: ["Say: cherry blossoms.", "Diga: cerejeiras.", "桜[さくら]", sakura]
  - ask: ["Tell her the trees are in full bloom — say: the cherry trees are in full bloom.", "Diga que as árvores estão totalmente floridas: as cerejeiras estão totalmente floridas.", "桜[さくら] が 満開[まんかい] です。", mankai]
  - note: ["«花見[はなみ]» is «花[はな]» flower plus «見[み]» see: going to look at the cherry blossoms, with food and friends under the trees. The blossoms last about a week, so everyone goes at once.", "«花見[はなみ]» é «花[はな]» flor mais «見[み]» ver: ir olhar as cerejeiras, com comida e amigos debaixo das árvores. As flores duram mais ou menos uma semana, então todo mundo vai ao mesmo tempo."]
  - ask: ["Say: cherry-blossom viewing.", "Diga: ver as cerejeiras.", "花見[はなみ]", hanami]
  - ask: ["Say: a flower.", "Diga: uma flor.", "花[はな]", hana]
  - ask: ["Say: the trees are beautiful.", "Diga: as árvores são lindas.", "木[き] が きれい です。", ki-tree]
  - ask: ["Say: it's spring.", "Diga: é primavera.", "春[はる] です。", haru]
  - ask: ["Say: the cherry trees have bloomed.", "Diga: as cerejeiras floresceram.", "桜[さくら] が 咲[さ]きました。", sakimashita]
  - note: ["To invite someone — let's do it — take the verb's «ます» stem and add «ましょう»: «行[い]きます» → «行[い]きましょう», let's go. With «か» at the end it becomes a softer offer: shall we? You met it in «手伝[てつだ]いましょう か».", "Para convidar — vamos fazer — tire o «ます» do verbo e acrescente «ましょう»: «行[い]きます» → «行[い]きましょう», vamos. Com «か» no fim vira uma proposta mais suave: vamos? Você já viu em «手伝[てつだ]いましょう か»."]
  - ask: ["Say: let's go.", "Diga: vamos.", "行[い]きましょう。", ikimashou]
  - ask: ["Say: let's go to the park.", "Diga: vamos ao parque.", "公園[こうえん] に 行[い]きましょう。", kouen, ikimashou]
  - ask: ["Suggest going to the castle, softly: shall we go to the castle?", "Proponha com jeito: vamos ao castelo?", "お城[しろ] に 行[い]きましょう か。", oshiro]
  - ask: ["She has packed lunches. Say: let's eat.", "Ela trouxe marmitas. Diga: vamos comer.", "お弁当[べんとう] を 食[た]べましょう。", obentou, tabemashou]
  - build: [shashin-torimashou, ["撮[と]りましょう", "写真[しゃしん] を 撮[と]りましょう"]]
  - ask: ["Say: let's take a photo.", "Diga: vamos tirar uma foto.", "写真[しゃしん] を 撮[と]りましょう。", shashin-torimashou]
  - note: ["«場所[ばしょ]取[と]り» is keeping a spot: someone, often the newest employee, spreads a blue plastic sheet under the trees early in the morning and waits there for the others.", "«場所[ばしょ]取[と]り» é guardar lugar: alguém, muitas vezes o funcionário mais novo, estende uma lona azul debaixo das árvores cedo de manhã e espera ali pelos outros."]
  - ask: ["Say: keeping a spot.", "Diga: guardar lugar.", "場所[ばしょ]取[と]り", bashotori]
  - pt_only: "No Brasil o parecido é o ipê: perde as folhas e se cobre de flores amarelas, roxas ou brancas por poucos dias. A diferença é que no Japão a florada vira festa, com marmita, lona e o pessoal do trabalho."
