id: A2-23
protagonist: f
title: [Street food, Comida de rua]
situation: ["An autumn festival in the shopping street. Kenta stops at a takoyaki stall; everything smells wonderful.", "Um festival de outono na rua comercial. O Kenta para numa barraca de takoyaki; tudo cheira bem."]
learn: [n4-078, n4-079, n4-080]
culture: —
items:
  - [takoyaki, "たこ焼[や]き", "takoyaki (octopus balls)", "takoyaki (bolinhos de polvo)", {rare: true}]
  - [tako, "たこ", "octopus", "polvo"]
  - [oishisou, "おいしそう", "looks delicious", "parece gostoso"]
  - [sou, "〜そう", "looks…, seems…", "parece…"]
  - [atsusou, "熱[あつ]そう", "looks hot", "parece quente"]
  - [amasou, "甘[あま]そう", "looks sweet", "parece doce"]
  - [ikko, "一[ひと]つ ください", "one, please", "um, por favor"]
  - [ikutsu, "いくつ", "how many", "quantos"]
  - [yakisoba, "焼[や]きそば", "fried noodles", "yakissoba"]
  - [nioi, "匂[にお]い", "smell", "cheiro"]
  - [ii-nioi, "いい 匂[にお]い", "smells good", "cheiro bom"]
dialogue:
  - [protagonist, "いい 匂[にお]い！ あれ、 おいしそう。", "Smells good! That looks delicious.", "Que cheiro bom! Aquilo parece gostoso."]
  - [kenta, "たこ焼[や]き だ よ。 中[なか] に たこ が 入[はい]って いる。", "That's takoyaki. There's octopus inside.", "É takoyaki. Tem polvo dentro."]
  - [protagonist, "たこ？ ちょっと 怖[こわ]そう… でも 食[た]べて みる。", "Octopus? Looks a bit scary… but I'll try it.", "Polvo? Parece meio assustador… mas vou provar."]
  - [yatai, "いらっしゃい！ いくつ？", "Welcome! How many?", "Bem-vinda! Quantos?"]
  - [protagonist, "六個[ろっこ] ください。", "Six, please.", "Seis, por favor."]
  - [kenta, "熱[あつ]そう だ から、 気[き] を つけて。", "They look hot, so careful.", "Parecem quentes, então cuidado."]
  - [protagonist, "熱[あつ]っ！ …でも、 おいしい！ あの 焼[や]きそば も おいしそう。", "Hot! …But delicious! That yakisoba looks good too.", "Ai, quente! …Mas que delícia! Aquele yakissoba também parece gostoso."]
  - [kenta, "あっち の クレープ は 甘[あま]そう だ ね。", "The crêpes over there look sweet.", "Os crepes ali parecem doces."]
teach:
  - ask: ["Say: smells good.", "Diga: cheiro bom.", "いい 匂[にお]い", ii-nioi]
  - ask: ["Say: smell.", "Diga: cheiro.", "匂[にお]い", nioi]
  - note: ["Looks…: take an adjective, drop «い», add «そう»: «おいしい» → «おいしそう», looks delicious; «熱[あつ]い» → «熱[あつ]そう», looks hot. It's what you see, not what you know yet.", "Parece…: pegue um adjetivo, tire o «い» e acrescente «そう»: «おいしい» → «おいしそう», parece gostoso; «熱[あつ]い» → «熱[あつ]そう», parece quente. É o que você vê, não o que já sabe."]
  - ask: ["Say the ending: looks…", "Diga a terminação: parece…", "〜そう", sou]
  - ask: ["Say: it looks delicious.", "Diga: parece gostoso.", "おいしそう。", oishisou]
  - ask: ["Say: it looks hot.", "Diga: parece quente.", "熱[あつ]そう。", atsusou]
  - ask: ["Say: it looks sweet.", "Diga: parece doce.", "甘[あま]そう。", amasou]
  - ask: ["Say: takoyaki.", "Diga: takoyaki.", "たこ焼[や]き", takoyaki]
  - ask: ["Say: octopus.", "Diga: polvo.", "たこ", tako]
  - ask: ["Say: yakisoba.", "Diga: yakissoba.", "焼[や]きそば", yakisoba]
  - ask: ["Ask: how many?", "Pergunte: quantos?", "いくつ？", ikutsu]
  - ask: ["Order one.", "Peça um.", "一[ひと]つ ください。", ikko]
  - note: ["Festival stalls, «屋台[やたい]», sell takoyaki, yakisoba, grilled squid and sweet crêpes. You eat standing near the stall — walking while eating is frowned on in many places.", "As barracas de festival, «屋台[やたい]», vendem takoyaki, yakissoba, lula grelhada e crepe doce. Come-se em pé perto da barraca — comer andando é malvisto em muitos lugares."]
  - pt_only: "Yakissoba no Brasil virou prato de feira, com molho e legumes; o japonês é mais simples, frito na chapa com molho escuro. Prove e compare."
