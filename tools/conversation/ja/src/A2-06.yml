id: A2-06
protagonist: m
title: [Electricity, Eletricidade]
situation: ["A hot evening. The air conditioner, the microwave and the kettle are on — and everything goes dark. Kenta comes over from next door.", "Uma noite quente. Ar-condicionado, micro-ondas e chaleira ligados — e tudo apaga. O Kenta vem do apartamento ao lado."]
learn: []
culture: Two frequencies in Japan
items:
  - [denki, "電気[でんき]", "electricity; the light", "eletricidade; a luz"]
  - [bureekaa, "ブレーカー", "breaker", "disjuntor", {rare: true}]
  - [eakon, "エアコン", "air conditioner", "ar-condicionado"]
  - [tsukemasu, "つけます", "turn on", "ligo"]
  - [keshimasu, "消[け]します", "turn off", "desligo"]
  - [kiete-imasu, "消[き]えて います", "is off, has gone out", "está apagado"]
  - [tsuite-imasu, "ついて います", "is on", "está ligado"]
  - [ochimashita, "落[お]ちました", "(the breaker) tripped", "caiu (o disjuntor)"]
  - [kurai, "暗[くら]い", "dark", "escuro"]
  - [hyaku-boruto, "百[ひゃく] ボルト", "100 volts", "100 volts"]
  - [doushite, "どうして", "why", "por quê"]
dialogue:
  - [protagonist, "あれ？ 暗[くら]い！ 電気[でんき] が 消[き]えて います。", "Huh? It's dark! The lights are out.", "Ué? Escureceu! A luz apagou."]
  - [kenta, "大丈夫[だいじょうぶ]？ 何[なに] を つけて た？", "You okay? What did you have on?", "Tudo bem? O que estava ligado?"]
  - [protagonist, "エアコン と 電子[でんし] レンジ と ケトル です。", "The air conditioner, the microwave and the kettle.", "O ar-condicionado, o micro-ondas e a chaleira."]
  - [kenta, "ああ、 ブレーカー が 落[お]ちた ね。 ほら、 ここ。", "Ah, the breaker tripped. Look, here.", "Ah, o disjuntor caiu. Olha, aqui."]
  - [protagonist, "どうして です か。", "Why?", "Por quê?"]
  - [kenta, "この 部屋[へや] は 三十[さんじゅう] アンペア だから、 一緒[いっしょ] に 使[つか]う と 落[お]ちる よ。", "This flat has thirty amps, so if you use them together it trips.", "Este apartamento tem trinta ampères, então usando tudo junto ele cai."]
  - [protagonist, "じゃあ、 ケトル を 消[け]します。 …あ、 電気[でんき] が ついて います！", "Then I'll turn off the kettle. …Oh, the lights are on!", "Então desligo a chaleira. …Ah, a luz voltou!"]
  - [kenta, "それ と、 日本[にほん] は 百[ひゃく] ボルト だ よ。 ブラジル の ドライヤー は 気[き] を つけて。", "And Japan is 100 volts. Careful with a Brazilian hair dryer.", "E o Japão é 100 volts. Cuidado com secador do Brasil."]
teach:
  - ask: ["Say: electricity, the light.", "Diga: eletricidade, a luz.", "電気[でんき]", denki]
  - ask: ["Say: it's dark.", "Diga: está escuro.", "暗[くら]い です。", kurai]
  - ask: ["Say: the air conditioner.", "Diga: o ar-condicionado.", "エアコン", eakon]
  - ask: ["Say: I turn on the air conditioner.", "Diga: ligo o ar-condicionado.", "エアコン を つけます。", tsukemasu]
  - ask: ["Say: I turn off the light.", "Diga: apago a luz.", "電気[でんき] を 消[け]します。", keshimasu]
  - note: ["«〜て います» describes a state that lasts: «消[き]えて います» — it has gone out and is still off; «ついて います» — it is on. With action verbs it is what is going on now: «食[た]べて います», I'm eating.", "«〜て います» descreve um estado que dura: «消[き]えて います» — apagou e continua apagado; «ついて います» — está ligado. Com verbos de ação é o que está acontecendo agora: «食[た]べて います», estou comendo."]
  - ask: ["Say: the light is out.", "Diga: a luz está apagada.", "電気[でんき] が 消[き]えて います。", kiete-imasu]
  - ask: ["Say: the light is on.", "Diga: a luz está acesa.", "電気[でんき] が ついて います。", tsuite-imasu]
  - ask: ["Say: the breaker.", "Diga: o disjuntor.", "ブレーカー", bureekaa]
  - ask: ["Say: the breaker tripped.", "Diga: o disjuntor caiu.", "ブレーカー が 落[お]ちました。", ochimashita]
  - ask: ["Ask: why?", "Pergunte: por quê?", "どうして です か。", doushite]
  - ask: ["Say: 100 volts.", "Diga: 100 volts.", "百[ひゃく] ボルト", hyaku-boruto]
  - note: ["Japanese homes run on 100 volts, and each flat has a limit in amperes: too many machines at once and the breaker trips — you just switch it back on. Japan also has two frequencies: 50 Hz in the east, 60 Hz in the west. Hamamatsu is 60 Hz.", "As casas japonesas usam 100 volts, e cada apartamento tem um limite em ampères: muita coisa ligada ao mesmo tempo e o disjuntor cai — é só religar. O Japão tem ainda duas frequências: 50 Hz no leste, 60 Hz no oeste. Hamamatsu é 60 Hz."]
  - pt_only: "No Brasil a tomada pode ser 127 ou 220 volts, dependendo da cidade. Aparelho de 220 trazido do Brasil precisa de transformador no Japão; os bivolt funcionam."
