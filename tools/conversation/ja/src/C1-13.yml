id: C1-13
protagonist: f
title: ["Local elections", "Eleições locais"]
situation: ["A city election. A loudspeaker car drives past shouting a candidate's name over and over. At the station, the candidate shakes your hand.", "Eleição municipal. Um carro de som passa gritando o nome de um candidato sem parar. Na estação, o candidato aperta a sua mão."]
learn: []
culture: Loudspeaker cars
items:
  - [kouhosha, "候補者[こうほしゃ]", "candidate", "candidato"]
  - [senkyo-kaa, "選挙[せんきょ] カー", "campaign loudspeaker car", "carro de som da campanha", {rare: true}]
  - [kouyaku, "公約[こうやく]", "campaign promise", "promessa de campanha", {rare: true}]
  - [to-tomoni, "〜と とも に", "together with; as", "junto com; à medida que"]
  - [shimin-to-tomoni, "市民[しみん] と とも に", "together with the citizens", "junto com os cidadãos"]
  - [shimin, "市民[しみん]", "citizen (of a city)", "cidadão (da cidade)"]
  - [gaitou-enzetsu, "街頭[がいとう] 演説[えんぜつ]", "street speech", "discurso na rua", {rare: true}]
  - [akushu, "握手[あくしゅ]", "handshake", "aperto de mão"]
  - [urusai, "うるさい", "noisy, annoying", "barulhento, chato"]
  - [tabunka-kyousei, "多文化[たぶんか] 共生[きょうせい]", "multicultural coexistence", "convivência multicultural", {rare: true}]
dialogue:
  - [kouhosha, "「田中[たなか]、 田中[たなか] で ございます！ よろしく お願[ねが]い します！」", "“Tanaka, this is Tanaka! I'm counting on you!”", "«Tanaka, aqui é o Tanaka! Conto com vocês!»"]
  - [protagonist, "選挙[せんきょ] カー って、 名前[なまえ] を 言[い]う だけ です ね。 ちょっと うるさい。", "Loudspeaker cars just say the name, don't they. A bit noisy.", "Carro de som só fala o nome, né? Meio barulhento."]
  - [suzuki, "日本[にほん] で は、 名前[なまえ] を 覚[おぼ]えて もらう の が 一番[いちばん] 大事[だいじ] なん です よ。", "In Japan, getting people to remember your name matters most.", "No Japão, o mais importante é fazer as pessoas lembrarem o nome."]
  - [protagonist, "公約[こうやく] は 何[なん] です か。", "What are the campaign promises?", "E quais são as promessas de campanha?"]
  - [suzuki, "駅前[えきまえ] で 街頭[がいとう] 演説[えんぜつ] が ある から、 聞[き]いて みましょう。", "There's a street speech at the station, let's go and listen.", "Tem discurso na frente da estação, vamos ouvir."]
  - [kouhosha, "市民[しみん] と とも に、 多文化[たぶんか] 共生[きょうせい] の 町[まち] を 作[つく]ります！", "Together with the citizens, I'll build a town of multicultural coexistence!", "Junto com os cidadãos, vou construir uma cidade de convivência multicultural!"]
  - [protagonist, "外国人[がいこくじん] は 投票[とうひょう] できない のに、 握手[あくしゅ] して くれました。", "Foreigners can't vote, but he shook my hand.", "Estrangeiro não vota, mas ele apertou a minha mão."]
  - [suzuki, "浜松[はままつ] で は 外国人[がいこくじん] 市民[しみん] も 大事[だいじ] な 住民[じゅうみん] です から ね。", "In Hamamatsu foreign residents are important members of the community too.", "Em Hamamatsu os moradores estrangeiros também são cidadãos importantes."]
teach:
  - ask: ["Say: a candidate.", "Diga: um candidato.", "候補者[こうほしゃ]", kouhosha]
  - ask: ["Say: the campaign loudspeaker car.", "Diga: o carro de som da campanha.", "選挙[せんきょ] カー", senkyo-kaa]
  - ask: ["Say: noisy, annoying.", "Diga: barulhento.", "うるさい", urusai]
  - ask: ["Say: a campaign promise.", "Diga: promessa de campanha.", "公約[こうやく]", kouyaku]
  - ask: ["Say: a street speech.", "Diga: discurso na rua.", "街頭[がいとう] 演説[えんぜつ]", gaitou-enzetsu]
  - ask: ["Say: a citizen of the city.", "Diga: cidadão da cidade.", "市民[しみん]", shimin]
  - note: ["«〜と とも に» is together with — formal, for speeches and writing: «市民[しみん] と とも に», together with the citizens. With a verb or noun of change it means as: «時代[じだい] と とも に 変[か]わる», change with the times.", "«〜と とも に» é junto com — formal, de discurso e texto: «市民[しみん] と とも に», junto com os cidadãos. Com verbo ou substantivo de mudança quer dizer à medida que: «時代[じだい] と とも に 変[か]わる», mudar com os tempos."]
  - ask: ["Say the pattern: together with.", "Diga o padrão: junto com.", "〜と とも に", to-tomoni]
  - ask: ["Say: together with the citizens.", "Diga: junto com os cidadãos.", "市民[しみん] と とも に", shimin-to-tomoni]
  - ask: ["Say: a handshake.", "Diga: um aperto de mão.", "握手[あくしゅ]", akushu]
  - ask: ["Say: multicultural coexistence.", "Diga: convivência multicultural.", "多文化[たぶんか] 共生[きょうせい]", tabunka-kyousei]
  - note: ["Japanese campaign law limits posters, flyers and home visits, so candidates rely on «選挙[せんきょ] カー» repeating their names and on morning speeches at stations. Foreign residents can't vote in national or local elections, but cities like Hamamatsu have policies — and candidates — for «多文化[たぶんか] 共生[きょうせい]».", "A lei eleitoral japonesa limita cartazes, panfletos e visitas de casa em casa, então os candidatos contam com o «選挙[せんきょ] カー» repetindo o nome e com discursos de manhã nas estações. Estrangeiros residentes não votam nem em eleição nacional nem local, mas cidades como Hamamatsu têm políticas — e candidatos — de «多文化[たぶんか] 共生[きょうせい]»."]
  - pt_only: "O carro de som brasileiro toca jingle; o japonês grita o nome com «よろしく お願[ねが]い します» e um coro de luvas brancas acenando. Barulho dos dois lados do mundo."
