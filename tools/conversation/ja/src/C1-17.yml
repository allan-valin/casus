id: C1-17
protagonist: f
title: ["Equality", "Igualdade"]
situation: ["Kenta announces at work that he'll take three months of paternity leave for baby Hina. Chief Sato is supportive; an older colleague less so.", "O Kenta anuncia no trabalho que vai tirar três meses de licença-paternidade pela bebê Hina. A chefe Sato apoia; um colega mais velho, nem tanto."]
learn: []
culture: Handled with care
