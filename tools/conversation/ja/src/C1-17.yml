dialogue:
  - [kenta, "皆[みな]さん、 来月[らいげつ] から 三[さん] か月[げつ]、 育休[いくきゅう] を 取得[しゅとく] します。", "Everyone, from next month I'm taking three months of childcare leave.", "Pessoal, a partir do mês que vem vou tirar três meses de licença para cuidar da filha."]
  - [sato, "おめでとう。 職場[しょくば] で 男性[だんせい] の 育休[いくきゅう] は 初[はじ]めて ね。 応援[おうえん] する わ。", "Congratulations. It's the first paternity leave in this workplace. I'm behind you.", "Parabéns. É a primeira licença-paternidade aqui. Tem o meu apoio."]
  - [protagonist, "美咲[みさき] さん も 共働[ともばたら]き だ から、 二人[ふたり] で 子育[こそだ]て する ん だ よね。", "Misaki works too, so you'll raise her together.", "A Misaki também trabalha, então vocês vão criar a filha juntos."]
  - [kenta, "うん。 でも 山本[やまもと] さん に は「男[おとこ] が 休[やす]む なんて」 と 言[い]われた。", "Yeah. But Yamamoto-san told me “a man taking time off, really?”.", "É. Mas o Yamamoto me disse «homem tirando licença, onde já se viu»."]
  - [sato, "意識[いしき] は 少[すこ]し ずつ 変[か]わって います。 法律[ほうりつ] も 変[か]わりました し。", "Mindsets are changing little by little. The law has changed too.", "A mentalidade está mudando aos poucos. A lei também mudou."]
  - [protagonist, "育休[いくきゅう] に 関[かん]して、 ブラジル の 父親[ちちおや] は 普通[ふつう] 五日[いつか] だけ です。 日本[にほん] の ほう が 長[なが]い ですね。", "Regarding leave, Brazilian fathers usually get just five days. Japan's is longer.", "Quanto à licença, pai no Brasil normalmente tem só cinco dias. A do Japão é maior."]
  - [sato, "制度[せいど] は ある けど、 取[と]る 人[ひと] が まだ 少[すく]ない の が 問題[もんだい] な の。", "The system exists, but the problem is that few people still take it.", "O direito existe, mas o problema é que pouca gente ainda tira."]
  - [kenta, "だから こそ、 僕[ぼく] が 最初[さいしょ] に 取[と]ります。", "Which is exactly why I'll be the first to take it.", "Por isso mesmo, eu vou ser o primeiro."]
