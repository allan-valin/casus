  - [dansei-no-ikukyuu, "男性[だんせい] の 育休[いくきゅう]", "paternity leave", "licença-paternidade"]
  - [shutoku, "取得[しゅとく]", "taking (leave), acquiring", "tirar (licença), obter"]
