  - note: ["«〜に 関[かん]して» is regarding — a formal about: «育休[いくきゅう] に 関[かん]して 質問[しつもん] が あります», I have a question regarding leave. Before a noun: «育休[いくきゅう] に 関[かん]する 法律[ほうりつ]», the law on childcare leave.", "«〜に 関[かん]して» é a respeito de — um «sobre» formal: «育休[いくきゅう] に 関[かん]して 質問[しつもん] が あります», tenho uma pergunta a respeito da licença. Antes de substantivo: «育休[いくきゅう] に 関[かん]する 法律[ほうりつ]», a lei sobre a licença."]
  - ask: ["Say the pattern: regarding.", "Diga o padrão: a respeito de.", "〜に 関[かん]して", ni-kanshite]
  - ask: ["Say: regarding childcare leave.", "Diga: a respeito da licença.", "育休[いくきゅう] に 関[かん]して", ikukyuu-ni-kanshite]
  - note: ["Japan's childcare-leave law is generous on paper — both parents can take up to a year or more, partly paid — but for years few fathers used it. New rules since 2022 require companies to tell employees about it and let fathers take leave in the weeks after birth, and the share of fathers taking it has risen sharply, though leaves are often short.", "A lei japonesa de licença para cuidar dos filhos é generosa no papel — pai e mãe podem tirar até um ano ou mais, com parte paga —, mas por anos poucos pais usavam. Regras novas desde 2022 obrigam as empresas a informar os funcionários e permitem que o pai tire licença nas semanas após o nascimento, e a parcela de pais que tiram subiu muito, embora as licenças muitas vezes sejam curtas."]
  - pt_only: "No Brasil a licença-paternidade é de cinco dias (vinte em empresas do programa Empresa Cidadã). No Japão o direito é bem maior — o desafio é a cultura deixar usar."
