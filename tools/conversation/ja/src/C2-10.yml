id: C2-10
protagonist: m
title: ["Proverbs at work", "Provérbios no trabalho"]
situation: ["You propose changing a long-standing procedure in a meeting. Afterwards Takahashi-buchō answers with proverbs — and some advice.", "Você propõe mudar um procedimento antigo numa reunião. Depois o chefe Takahashi responde com provérbios — e um conselho."]
learn: []
culture: The nail that sticks out
items:
  - [isogaba-maware, "急[いそ]がば 回[まわ]れ", "more haste, less speed", "devagar se vai ao longe", {rare: true}]
  - [deru-kui, "出[で]る 杭[くい] は 打[う]たれる", "the nail that sticks out gets hammered", "o prego que se destaca leva martelada", {rare: true}]
  - [ishibashi, "石橋[いしばし] を 叩[たた]いて 渡[わた]る", "tap the stone bridge before crossing", "testar a ponte de pedra antes de atravessar", {rare: true}]
  - [nana-korobi, "七転[ななころ]び 八起[やお]き", "fall seven times, rise eight", "cair sete vezes, levantar oito", {rare: true}]
  - [zenrei, "前例[ぜんれい]", "precedent", "precedente"]
  - [kaizen, "改善[かいぜん]", "improvement", "melhoria"]
  - [tekisetsu-na, "適切[てきせつ] な 時[とき] に", "at the right moment", "no momento certo"]
  - [kokoro-ni-hibiku, "心[こころ] に 響[ひび]く", "strike a chord", "tocar fundo"]
  - [jikkan, "実感[じっかん]", "real feeling, experience", "sensação na pele"]
  - [hanashi-wo-matomeru, "話[はなし] を まとめる", "sum up", "resumir"]
dialogue:
  - [buchou, "今日[きょう] の 提案[ていあん]、 いい 改善[かいぜん] 案[あん] だった。 でも 反対[はんたい] も 多[おお]かった ね。", "Today's proposal was a good improvement. But there was a lot of opposition.", "A proposta de hoje foi uma boa melhoria. Mas teve muita oposição."]
  - [protagonist, "「前例[ぜんれい] が ない」 と 言[い]われました。 出[で]る 杭[くい] は 打[う]たれる、 です ね。", "They said “there's no precedent”. The nail that sticks out gets hammered.", "Disseram que «não tem precedente». O prego que se destaca leva martelada."]
  - [buchou, "そう 感[かん]じた か。 でも「急[いそ]がば 回[まわ]れ」 だ よ。 根回[ねまわ]し から やり直[なお]そう。", "You felt that, did you. But “more haste, less speed”. Let's start again from the groundwork.", "Você sentiu isso, né? Mas «devagar se vai ao longe». Vamos recomeçar pelo nemawashi."]
  - [protagonist, "石橋[いしばし] を 叩[たた]いて 渡[わた]る、 です ね。", "Tap the stone bridge before crossing, then.", "Testar a ponte antes de atravessar, então."]
  - [buchou, "ははは、 ことわざ で 返[かえ]して くる と は。 さすが だ。", "Ha ha, answering me with a proverb. Impressive.", "Rá, me respondendo com provérbio. Muito bem."]
  - [protagonist, "鈴木[すずき] さん に 習[なら]いました。 七転[ななころ]び 八起[やお]き の 気持[きも]ち で、 もう 一度[いちど] 挑戦[ちょうせん] します。", "I learned from Mrs Suzuki. In the spirit of “fall seven times, rise eight”, I'll try again.", "Aprendi com a senhora Suzuki. No espírito de «cair sete vezes, levantar oito», vou tentar de novo."]
  - [buchou, "ことわざ は 適切[てきせつ] な 時[とき] に 使[つか]う と、 心[こころ] に 響[ひび]く。 君[きみ] は もう 使[つか]い 方[かた] を 知[し]って いる。", "Used at the right moment, a proverb strikes a chord. You already know how.", "Usado no momento certo, o provérbio toca fundo. Você já sabe usar."]
  - [protagonist, "では、 次[つぎ] の 会議[かいぎ] まで に 話[はなし] を まとめて おきます。", "Then I'll have everything summed up before the next meeting.", "Então até a próxima reunião deixo tudo resumido."]
teach:
  - ask: ["Say: a precedent.", "Diga: um precedente.", "前例[ぜんれい]", zenrei]
  - ask: ["Say: improvement.", "Diga: melhoria.", "改善[かいぜん]", kaizen]
  - ask: ["Say the proverb: the nail that sticks out gets hammered.", "Diga o provérbio: o prego que se destaca leva martelada.", "出[で]る 杭[くい] は 打[う]たれる", deru-kui]
  - ask: ["Say: more haste, less speed.", "Diga: devagar se vai ao longe.", "急[いそ]がば 回[まわ]れ", isogaba-maware]
  - ask: ["Say: tap the stone bridge before crossing.", "Diga: testar a ponte de pedra antes de atravessar.", "石橋[いしばし] を 叩[たた]いて 渡[わた]る", ishibashi]
  - ask: ["Say: fall seven times, rise eight.", "Diga: cair sete vezes, levantar oito.", "七転[ななころ]び 八起[やお]き", nana-korobi]
  - ask: ["Say: at the right moment.", "Diga: no momento certo.", "適切[てきせつ] な 時[とき] に", tekisetsu-na]
  - ask: ["Say: strike a chord.", "Diga: tocar fundo.", "心[こころ] に 響[ひび]く", kokoro-ni-hibiku]
  - ask: ["Say: sum up.", "Diga: resumir.", "話[はなし] を まとめる", hanashi-wo-matomeru]
  - ask: ["Say: a felt experience.", "Diga: sensação na pele.", "実感[じっかん]", jikkan]
  - note: ["Proverbs at work are a quick, shared shorthand: «出[で]る 杭[くい] は 打[う]たれる» names the pressure to conform; «急[いそ]がば 回[まわ]れ» and «石橋[いしばし] を 叩[たた]いて 渡[わた]る» recommend caution; «七転[ななころ]び 八起[やお]き» encourages persistence. Answering a proverb with another is a sign of real fluency.", "Provérbios no trabalho são um atalho comum a todos: «出[で]る 杭[くい] は 打[う]たれる» nomeia a pressão para se conformar; «急[いそ]がば 回[まわ]れ» e «石橋[いしばし] を 叩[たた]いて 渡[わた]る» recomendam cautela; «七転[ななころ]び 八起[やお]き» incentiva a persistência. Responder um provérbio com outro é sinal de fluência de verdade."]
  - pt_only: "«Devagar se vai ao longe», «quem não arrisca não petisca» — o português também vive de provérbios. A graça é achar o par japonês na hora certa."
