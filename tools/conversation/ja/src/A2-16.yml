id: A2-16
protagonist: m
title: ["A tip? No", "Gorjeta? Não"]
situation: ["Dinner with Yui at a small restaurant. Time to pay — and she offers you her dessert.", "Jantar com a Yui num restaurante pequeno. Hora de pagar — e ela oferece a sobremesa dela."]
learn: []
culture: No tipping; offer twice
items:
  - [okaikei, "お会計[かいけい]", "the bill", "a conta"]
  - [warikan, "割[わ]り勘[かん]", "splitting the bill", "rachar a conta", {rare: true}]
  - [chippu, "チップ", "tip", "gorjeta", {rare: true}]
  - [harawanakereba, "払[はら]わなければ なりません", "I must pay", "preciso pagar"]
  - [nakereba, "〜なければ なりません", "must, have to", "tenho que, preciso"]
  - [haraimasu, "払[はら]います", "pay", "pago"]
  - [ogorimasu, "おごります", "it's my treat", "eu pago, é por minha conta"]
  - [enryo, "遠慮[えんりょ]", "holding back out of politeness", "fazer cerimônia"]
  - [enryo-shinaide, "遠慮[えんりょ] しないで", "don't hold back", "não faça cerimônia"]
  - [jaa-sukoshi, "じゃあ、 少[すこ]し だけ", "well then, just a little", "então, só um pouquinho"]
  - [dezaato, "デザート", "dessert", "sobremesa"]
dialogue:
  - [yui, "この デザート、 半分[はんぶん] どう です か。", "Would you like half of this dessert?", "Quer metade desta sobremesa?"]
  - [protagonist, "いえ、 大丈夫[だいじょうぶ] です。", "No, I'm fine.", "Não, estou bem."]
  - [yui, "遠慮[えんりょ] しないで。 おいしい です よ。", "Don't hold back. It's good.", "Não faça cerimônia. Está gostoso."]
  - [protagonist, "じゃあ、 少[すこ]し だけ。 …本当[ほんとう] だ、 おいしい！", "Well then, just a little. …You're right, it's delicious!", "Então, só um pouquinho. …É mesmo, está uma delícia!"]
  - [yui, "すみません、 お会計[かいけい] お願[ねが]いします。 割[わ]り勘[かん] に しましょう。", "Excuse me, the bill please. Let's split it.", "Com licença, a conta, por favor. Vamos rachar."]
  - [protagonist, "今日[きょう] は 僕[ぼく] が おごります。 チップ は いくら です か。", "It's my treat today. How much is the tip?", "Hoje eu pago. Quanto é a gorjeta?"]
  - [yui, "日本[にほん] で は チップ は いりません よ。 払[はら]わなくて いい です。", "In Japan there's no tip. You don't need to pay it.", "No Japão não tem gorjeta. Não precisa pagar."]
  - [protagonist, "そう です か。 でも 次[つぎ] は 由衣[ゆい] さん が 払[はら]わなければ なりません よ。", "I see. But next time you have to pay, Yui.", "Entendi. Mas da próxima vez você é que tem que pagar, Yui."]
teach:
  - ask: ["Say: the bill.", "Diga: a conta.", "お会計[かいけい]", okaikei]
  - ask: ["Ask for the bill.", "Peça a conta.", "お会計[かいけい] お願[ねが]いします。", okaikei]
  - ask: ["Say: splitting the bill.", "Diga: rachar a conta.", "割[わ]り勘[かん]", warikan]
  - ask: ["Say: I pay.", "Diga: eu pago.", "払[はら]います。", haraimasu]
  - ask: ["Say: it's my treat.", "Diga: é por minha conta.", "おごります。", ogorimasu]
  - ask: ["Say: a tip.", "Diga: gorjeta.", "チップ", chippu]
  - note: ["Must: take the negative «払[はら]わない», swap «ない» for «なければ», and add «なりません»: «払[はら]わなければ なりません» — I must pay. Literally: if I don't pay, it won't do.", "Ter que: pegue o negativo «払[はら]わない», troque «ない» por «なければ» e acrescente «なりません»: «払[はら]わなければ なりません» — preciso pagar. Ao pé da letra: se eu não pagar, não dá."]
  - ask: ["Say the pattern: must.", "Diga o padrão: ter que.", "〜なければ なりません", nakereba]
  - build: [harawanakereba, ["なりません", "払[はら]わなければ なりません"]]
  - ask: ["Say: I must pay.", "Diga: preciso pagar.", "払[はら]わなければ なりません。", harawanakereba]
  - ask: ["Say: dessert.", "Diga: sobremesa.", "デザート", dezaato]
  - ask: ["Say the word for polite holding back.", "Diga a palavra para fazer cerimônia.", "遠慮[えんりょ]", enryo]
  - ask: ["Insist: don't hold back.", "Insista: não faça cerimônia.", "遠慮[えんりょ] しないで。", enryo-shinaide]
  - ask: ["Accept the second offer: well then, just a little.", "Aceite na segunda vez: então, só um pouquinho.", "じゃあ、 少[すこ]し だけ。", jaa-sukoshi]
  - note: ["«遠慮[えんりょ]» is holding back so as not to impose. Many people decline an offer once out of politeness and accept when it comes a second time — a custom, not a rule: sometimes the no is real. So offer twice, and if you want something, accept the second offer. And no tips in Japan: service is in the price, and leaving money can confuse the staff.", "«遠慮[えんりょ]» é se conter para não incomodar. Muita gente recusa uma oferta uma vez por educação e aceita quando ela vem de novo — um costume, não uma regra: às vezes o não é verdadeiro. Então ofereça duas vezes, e se quiser algo, aceite na segunda. E nada de gorjeta no Japão: o serviço está no preço, e deixar dinheiro pode confundir o atendente."]
  - pt_only: "No Brasil também não há cultura de gorjeta à parte: a conta traz a taxa de serviço, em geral 10 %, às vezes 12 a 15 %, e por lei ela é opcional (Lei 13.419/2017). No Japão nem isso — o preço do cardápio é o que se paga."
