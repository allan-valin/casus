id: A2-12
protagonist: m
title: [Geography, Geografia]
situation: ["A Sunday drive with Kenta along Lake Hamana to the sea. On a clear day, Mount Fuji far to the east.", "Um passeio de carro no domingo com o Kenta, pelo lago Hamana até o mar. Num dia claro, o monte Fuji longe, a leste."]
learn: []
culture: —
items:
  - [yama, "山[やま]", "mountain", "montanha"]
  - [umi, "海[うみ]", "sea", "mar"]
  - [mizuumi, "湖[みずうみ]", "lake", "lago"]
  - [hamanako, "浜名湖[はまなこ]", "Lake Hamana", "lago Hamana", {rare: true}]
  - [fujisan, "富士山[ふじさん]", "Mount Fuji", "monte Fuji", {rare: true}]
  - [kawa, "川[かわ]", "river", "rio"]
  - [yori, "〜より", "than", "do que"]
  - [ichiban-takai, "一番[いちばん] 高[たか]い", "the highest", "o mais alto"]
  - [unagi, "うなぎ", "eel", "enguia"]
  - [meibutsu, "名物[めいぶつ]", "local speciality", "especialidade local"]
dialogue:
  - [kenta, "ほら、 浜名湖[はまなこ] だ よ。", "Look, Lake Hamana.", "Olha, o lago Hamana."]
  - [protagonist, "広[ひろ]い！ 湖[みずうみ] と 海[うみ] が つながって いる？", "It's big! Are the lake and the sea connected?", "Que grande! O lago e o mar se ligam?"]
  - [kenta, "うん。 だから 水[みず] が 少[すこ]し しょっぱい。 うなぎ が 名物[めいぶつ] だ よ。", "Yeah. So the water's a bit salty. Eel is the local speciality.", "É. Por isso a água é meio salgada. A enguia é a especialidade daqui."]
  - [protagonist, "あ、 あれ は 富士山[ふじさん]？", "Oh, is that Mount Fuji?", "Ah, aquilo é o monte Fuji?"]
  - [kenta, "そう。 日本[にほん] で 一番[いちばん] 高[たか]い 山[やま]。", "Yes. The highest mountain in Japan.", "É. A montanha mais alta do Japão."]
  - [protagonist, "ブラジル の 一番[いちばん] 高[たか]い 山[やま] より 高[たか]い？", "Higher than the highest mountain in Brazil?", "Mais alto que a montanha mais alta do Brasil?"]
  - [kenta, "知[し]らない。 どっち？", "No idea. Which is?", "Não sei. Qual é?"]
  - [protagonist, "富士山[ふじさん] の ほう が 高[たか]い。 ピコ・ダ・ネブリナ は 三千[さんぜん] メートル ぐらい。", "Fuji is higher. Pico da Neblina is about three thousand metres.", "O Fuji é mais alto. O Pico da Neblina tem uns três mil metros."]
teach:
  - ask: ["Say: a mountain.", "Diga: uma montanha.", "山[やま]", yama]
  - ask: ["Say: the sea.", "Diga: o mar.", "海[うみ]", umi]
  - ask: ["Say: a lake.", "Diga: um lago.", "湖[みずうみ]", mizuumi]
  - ask: ["Say: a river.", "Diga: um rio.", "川[かわ]", kawa]
  - ask: ["Say: Lake Hamana.", "Diga: o lago Hamana.", "浜名湖[はまなこ]", hamanako]
  - ask: ["Say: Mount Fuji.", "Diga: o monte Fuji.", "富士山[ふじさん]", fujisan]
  - ask: ["Say: it's big — wide.", "Diga: é grande, amplo.", "広[ひろ]い です。", hiroi]
  - note: ["To compare: «A は B より 高[たか]い» — A is higher than B. To ask which: «どっち が 高[たか]い？», and to answer «A の ほう が 高[たか]い». The most: «一番[いちばん]» before the adjective — «一番[いちばん] 高[たか]い», the highest.", "Para comparar: «A は B より 高[たか]い» — A é mais alto que B. Para perguntar qual: «どっち が 高[たか]い？», e responder «A の ほう が 高[たか]い». O mais: «一番[いちばん]» antes do adjetivo — «一番[いちばん] 高[たか]い», o mais alto."]
  - ask: ["Say the word: than.", "Diga a palavra: do que.", "〜より", yori]
  - ask: ["Say: Fuji is higher than Pico da Neblina.", "Diga: o Fuji é mais alto que o Pico da Neblina.", "富士山[ふじさん] は ピコ・ダ・ネブリナ より 高[たか]い です。", yori]
  - ask: ["Say: the highest mountain.", "Diga: a montanha mais alta.", "一番[いちばん] 高[たか]い 山[やま]", ichiban-takai]
  - ask: ["Say: eel.", "Diga: enguia.", "うなぎ", unagi]
  - ask: ["Say: the local speciality.", "Diga: a especialidade local.", "名物[めいぶつ]", meibutsu]
  - note: ["Lake Hamana opens to the Pacific, so its water is brackish — and Hamamatsu is famous for eel, «うなぎ», grilled with a sweet sauce. Mount Fuji, 3,776 m, is the highest in Japan.", "O lago Hamana se abre para o Pacífico, então a água é salobra — e Hamamatsu é famosa pela enguia, «うなぎ», grelhada com molho adocicado. O monte Fuji, 3.776 m, é o mais alto do Japão."]
  - pt_only: "O Pico da Neblina tem 2.995 m, então o Fuji ganha por quase 800 metros. Em compensação, o Japão inteiro caberia mais de vinte vezes no Brasil."
