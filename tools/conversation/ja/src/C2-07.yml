id: C2-07
protagonist: f
title: ["A letter to city hall", "Carta à prefeitura"]
situation: ["The city wants to cut the bus line that Brazilian workers and elderly residents use. You draft a formal petition to the mayor; Ishida-sensei checks the letter style.", "A prefeitura quer cortar a linha de ônibus que os trabalhadores brasileiros e os idosos usam. Você escreve um requerimento formal ao prefeito; o professor Ishida revisa o estilo da carta."]
learn: []
culture: —
items:
  - [youbousho, "要望書[ようぼうしょ]", "petition, written request", "requerimento, petição", {rare: true}]
  - [haikei, "拝啓[はいけい]", "Dear Sir/Madam (letter opening)", "Prezado(a) (abertura de carta)", {rare: true}]
  - [keigu, "敬具[けいぐ]", "Yours faithfully (letter closing)", "Atenciosamente (fecho de carta)", {rare: true}]
  - [shichou, "市長[しちょう]", "mayor", "prefeito"]
  - [jikou-no-aisatsu, "時候[じこう] の 挨拶[あいさつ]", "seasonal greeting (letters)", "saudação da estação (em cartas)", {rare: true}]
  - [sonzoku, "存続[そんぞく]", "continuation, survival", "continuidade, permanência"]
  - [onegai-moushiagemasu, "お願[ねが]い 申[もう]し上[あ]げます", "we humbly request", "solicitamos respeitosamente"]
  - [riyousha, "利用者[りようしゃ]", "users", "usuários"]
  - [shomei-wo-soete, "署名[しょめい] を 添[そ]えて", "with signatures attached", "com assinaturas anexas"]
  - [kokoro-yori-review, "ご高配[こうはい] を 賜[たまわ]ります よう", "that you kindly give consideration", "que nos conceda a sua atenção", {rare: true}]
dialogue:
  - [kouza-sensei, "正式[せいしき] な 手紙[てがみ] は「拝啓[はいけい]」 で 始[はじ]めて、「敬具[けいぐ]」 で 終[お]わります。", "A formal letter starts with “haikei” and ends with “keigu”.", "Uma carta formal começa com «haikei» e termina com «keigu»."]
  - [protagonist, "その 間[あいだ] に 時候[じこう] の 挨拶[あいさつ] を 入[い]れる ん です よね。「秋[あき] 深[ふか]まる 候[こう]」 など。", "And between them, a seasonal greeting. Like “As autumn deepens”.", "E no meio, a saudação da estação. Como «Neste outono que se aprofunda»."]
  - [kouza-sensei, "その 通[とお]り。 では、 本文[ほんぶん] を 読[よ]んで ください。", "Exactly. Now read me the body.", "Exatamente. Agora leia o corpo da carta."]
  - [protagonist, "「バス 路線[ろせん] の 存続[そんぞく] を お願[ねが]い 申[もう]し上[あ]げます。 利用者[りようしゃ] 三百人[さんびゃくにん] の 署名[しょめい] を 添[そ]えて、 ご高配[こうはい] を 賜[たまわ]ります よう、 お願[ねが]い 申[もう]し上[あ]げます」。", "“We humbly request the continuation of the bus line. With the signatures of three hundred users attached, we ask that you kindly give this your consideration.”", "«Solicitamos respeitosamente a permanência da linha de ônibus. Com as assinaturas de trezentos usuários anexas, pedimos que nos conceda a sua atenção.»"]
  - [kouza-sensei, "見事[みごと] です。 市長[しちょう] の 宛名[あてな] は「浜松[はままつ] 市長[しちょう] 様[さま]」 で いい。", "Splendid. Address it to “The Mayor of Hamamatsu”.", "Excelente. O destinatário pode ser «Ilustríssimo Prefeito de Hamamatsu»."]
  - [protagonist, "要望書[ようぼうしょ] は 怒[おこ]った 調子[ちょうし] で 書[か]かない ほう が いい です よね。", "It's better not to write a petition in an angry tone, right?", "É melhor não escrever o requerimento num tom bravo, né?"]
  - [kouza-sensei, "ええ。 丁寧[ていねい] な 言葉[ことば] ほど、 相手[あいて] は 無視[むし] しにくい もの です。", "Yes. The more polite the words, the harder they are to ignore.", "Sim. Quanto mais educadas as palavras, mais difícil é ignorá-las."]
  - [protagonist, "ありがとう ございます。 明日[あした]、 署名[しょめい] と 一緒[いっしょ] に 市役所[しやくしょ] へ 届[とど]けます。", "Thank you. Tomorrow I'll deliver it to city hall with the signatures.", "Obrigada. Amanhã entrego na prefeitura junto com as assinaturas."]
teach:
  - ask: ["Say: a petition.", "Diga: um requerimento.", "要望書[ようぼうしょ]", youbousho]
  - ask: ["Say: the mayor.", "Diga: o prefeito.", "市長[しちょう]", shichou]
  - ask: ["Open a formal letter.", "Abra uma carta formal.", "拝啓[はいけい]", haikei]
  - ask: ["Close a formal letter.", "Feche uma carta formal.", "敬具[けいぐ]", keigu]
  - ask: ["Say: the seasonal greeting.", "Diga: a saudação da estação.", "時候[じこう] の 挨拶[あいさつ]", jikou-no-aisatsu]
  - ask: ["Say: continuation.", "Diga: continuidade.", "存続[そんぞく]", sonzoku]
  - ask: ["Say: users.", "Diga: usuários.", "利用者[りようしゃ]", riyousha]
  - ask: ["Say: with signatures attached.", "Diga: com assinaturas anexas.", "署名[しょめい] を 添[そ]えて", shomei-wo-soete]
  - note: ["Formal letters have a frame: «拝啓[はいけい]», a seasonal greeting, the body, then «敬具[けいぐ]». Requests climb to the top of humble language: «お願[ねが]い 申[もう]し上[あ]げます», «ご高配[こうはい] を 賜[たまわ]ります よう» — that you might bestow your kind consideration.", "Cartas formais têm moldura: «拝啓[はいけい]», uma saudação da estação, o corpo, depois «敬具[けいぐ]». Os pedidos sobem ao topo da linguagem humilde: «お願[ねが]い 申[もう]し上[あ]げます», «ご高配[こうはい] を 賜[たまわ]ります よう» — que nos conceda a sua generosa atenção."]
  - ask: ["Request humbly: we humbly request.", "Peça com humildade: solicitamos respeitosamente.", "お願[ねが]い 申[もう]し上[あ]げます。", onegai-moushiagemasu]
  - ask: ["Say the top formula: that you kindly give consideration.", "Diga a fórmula máxima: que nos conceda a sua atenção.", "ご高配[こうはい] を 賜[たまわ]ります よう", kokoro-yori-review]
  - pt_only: "O ofício brasileiro tem «Excelentíssimo Senhor» e «Respeitosamente». O japonês acrescenta o tempo lá fora — o outono, a chuva — antes de pedir qualquer coisa."
