id: B1-12
protagonist: m
title: [Happiness, Felicidade]
situation: ["Mrs Suzuki in her vegetable garden at dawn. You ask why she gets up so early at seventy — she talks about 生きがい.", "A senhora Suzuki na horta ao amanhecer. Você pergunta por que ela acorda tão cedo aos setenta — ela fala de 生きがい."]
learn: [n4-049]
culture: 生きがい
items:
  - [shiawase, "幸[しあわ]せ", "happy, happiness", "feliz, felicidade"]
  - [ikigai, "生[い]きがい", "a reason for living", "razão de viver"]
  - [sutoresu, "ストレス", "stress", "estresse"]
  - [yutori, "ゆとり", "room to breathe, ease", "folga, tranquilidade", {rare: true}]
  - [ba, "〜ば", "if (conditional)", "se (condicional)"]
  - [hatarakeba, "働[はたら]けば", "if you work", "se trabalhar"]
  - [yasumeba, "休[やす]めば", "if you rest", "se descansar"]
  - [hatake, "畑[はたけ]", "vegetable field, garden", "horta"]
  - [sodateru, "育[そだ]てる", "grow, raise", "cultivar, criar"]
  - [mainichi-tanoshii, "毎日[まいにち] が 楽[たの]しい", "every day is fun", "todo dia é bom"]
  - [chiisana, "小[ちい]さな", "small, little", "pequeno"]
dialogue:
  - [protagonist, "鈴木[すずき] さん、 毎朝[まいあさ] 早[はや]い です ね。", "Mrs Suzuki, you're up early every morning.", "Senhora Suzuki, a senhora acorda cedo toda manhã."]
  - [suzuki, "畑[はたけ] で 野菜[やさい] を 育[そだ]てる の が 私[わたし] の 生[い]きがい です よ。", "Growing vegetables in the garden is my reason for living.", "Cultivar verduras na horta é a minha razão de viver."]
  - [protagonist, "生[い]きがい？", "Reason for living?", "Razão de viver?"]
  - [suzuki, "朝[あさ] 起[お]きる 理由[りゆう] です。 小[ちい]さな こと でも、 あれば 幸[しあわ]せ です。", "The reason to get up in the morning. Even a small thing — if you have one, you're happy.", "O motivo para levantar de manhã. Mesmo uma coisa pequena — se você tiver, é feliz."]
  - [protagonist, "僕[ぼく] は 仕事[しごと] の ストレス が 多[おお]い です。", "I have a lot of stress from work.", "Eu tenho muito estresse no trabalho."]
  - [suzuki, "休[やす]めば いい ん です よ。 働[はたら]けば 働[はたら]く ほど 幸[しあわ]せ、 では ありません。", "Then rest. The more you work isn't the happier you are.", "É só descansar. Não é: quanto mais trabalha, mais feliz."]
  - [protagonist, "心[こころ] の ゆとり が 大事[だいじ] です ね。", "Room to breathe matters, then.", "A tranquilidade é importante, então."]
  - [suzuki, "ええ。 トマト を 持[も]って 帰[かえ]れば？ 毎日[まいにち] が 楽[たの]しく なります よ。", "Yes. Why not take some tomatoes home? Every day gets nicer.", "Isso. Leve uns tomates para casa! Todo dia fica mais gostoso."]
teach:
  - ask: ["Say: happy, happiness.", "Diga: feliz, felicidade.", "幸[しあわ]せ", shiawase]
  - ask: ["Say: a reason for living.", "Diga: razão de viver.", "生[い]きがい", ikigai]
  - ask: ["Say: stress.", "Diga: estresse.", "ストレス", sutoresu]
  - ask: ["Say: room to breathe.", "Diga: tranquilidade, folga.", "ゆとり", yutori]
  - ask: ["Say: the vegetable garden.", "Diga: a horta.", "畑[はたけ]", hatake]
  - ask: ["Say: to grow, raise.", "Diga: cultivar, criar.", "育[そだ]てる", sodateru]
  - note: ["«〜ば» is if: change the last «う» sound to «え» and add «ば»: «休[やす]む» → «休[やす]めば», if you rest; «働[はたら]く» → «働[はたら]けば», if you work; «ある» → «あれば», if you have. «〜ば いい» suggests: «休[やす]めば いい», you just need to rest.", "«〜ば» é se: troque o último som em «う» por «え» e acrescente «ば»: «休[やす]む» → «休[やす]めば», se descansar; «働[はたら]く» → «働[はたら]けば», se trabalhar; «ある» → «あれば», se tiver. «〜ば いい» sugere: «休[やす]めば いい», é só descansar."]
  - ask: ["Say the ending: if.", "Diga a terminação: se.", "〜ば", ba]
  - ask: ["Say: if you rest.", "Diga: se descansar.", "休[やす]めば", yasumeba]
  - ask: ["Say: if you work.", "Diga: se trabalhar.", "働[はたら]けば", hatarakeba]
  - ask: ["Say: a small thing.", "Diga: uma coisa pequena.", "小[ちい]さな こと", chiisana]
  - ask: ["Say: every day is fun.", "Diga: todo dia é bom.", "毎日[まいにち] が 楽[たの]しい。", mainichi-tanoshii]
  - note: ["«生[い]きがい» is the reason you get up in the morning — not necessarily big: a garden, grandchildren, a hobby, your work. It's often linked to Okinawa's long-lived elders. «ゆとり», breathing room, is what many busy Japanese say they lack.", "«生[い]きがい» é o motivo para levantar de manhã — não precisa ser grande: uma horta, os netos, um hobby, o trabalho. É muito associado aos idosos longevos de Okinawa. «ゆとり», folga, é o que muitos japoneses atarefados dizem que lhes falta."]
  - pt_only: "Brasileiro diria «o que te faz levantar da cama». A senhora Suzuki responde com tomates — e talvez ela tenha razão."
