id: A2-30
protagonist: m
title: [Jokes, Piadas]
situation: ["The section's year-end party. Chief Sato tells a dad joke and everyone groans — a look back at all of A2.", "A festa de fim de ano do setor. A chefe Sato conta uma piada de tiozão e todo mundo resmunga — uma revisão de todo o A2."]
learn: []
culture: Dad jokes are supposed to be cold
items:
  - [oyaji-gyagu, "おやじ ギャグ", "dad joke, pun", "piada de tiozão, trocadilho", {rare: true}]
  - [omoshiroi, "面白[おもしろ]い", "funny, interesting", "engraçado, interessante"]
  - [dajare, "駄洒落[だじゃれ]", "pun", "trocadilho", {rare: true}]
  - [warau, "笑[わら]います", "laugh", "rio"]
  - [joudan, "冗談[じょうだん]", "joke", "piada, brincadeira"]
  - [bounenkai, "忘年会[ぼうねんかい]", "year-end party", "festa de fim de ano", {rare: true}]
  - [kotoshi, "今年[ことし]", "this year", "este ano"]
  - [rainen, "来年[らいねん]", "next year", "ano que vem"]
  - [osewa, "お世話[せわ] に なりました", "thank you for all your help", "obrigado por tudo"]
  - [yoroshiku-rainen, "来年[らいねん] も よろしく お願[ねが]いします", "I look forward to next year too", "conto com vocês no ano que vem"]
dialogue:
  - [sato, "皆[みな]さん、 今年[ことし] も お疲[つか]れさま でした。 忘年会[ぼうねんかい] です！", "Everyone, thanks for this year's hard work. It's the year-end party!", "Pessoal, obrigada pelo trabalho este ano. É a festa de fim de ano!"]
  - [kenta, "課長[かちょう]、 何[なに] か 面白[おもしろ]い 話[はなし] を！", "Chief, tell us something funny!", "Chefe, conta algo engraçado!"]
  - [sato, "じゃあ…「布団[ふとん] が 吹[ふ]っ飛[と]んだ」。", "Well… “the futon flew away” (futon ga futtonda).", "Então… «o futon voou longe» (futon ga futtonda)."]
  - [kenta, "さむっ！ おやじ ギャグ だ！", "So cold! A dad joke!", "Que gelo! Piada de tiozão!"]
  - [protagonist, "寒[さむ]い？ でも 面白[おもしろ]い です。 笑[わら]いました。", "Cold? But it's funny. I laughed.", "Gelada? Mas é engraçada. Eu ri."]
  - [sato, "ありがとう。 ブラジル に も 冗談[じょうだん] が あります か。", "Thank you. Do you have jokes like that in Brazil?", "Obrigada. No Brasil também tem piadas assim?"]
  - [protagonist, "あります。 ブラジル の おやじ ギャグ も とても 寒[さむ]い です よ。", "We do. Brazilian dad jokes are very cold too.", "Tem. As piadas de tiozão brasileiras também são bem geladas."]
  - [protagonist, "今年[ことし] は お世話[せわ] に なりました。 来年[らいねん] も よろしく お願[ねが]いします。", "Thank you for all your help this year. I look forward to next year too.", "Obrigado por tudo este ano. Conto com vocês no ano que vem."]
teach:
  - ask: ["Say: the year-end party.", "Diga: a festa de fim de ano.", "忘年会[ぼうねんかい]", bounenkai]
  - ask: ["Say: this year.", "Diga: este ano.", "今年[ことし]", kotoshi]
  - ask: ["Say: next year.", "Diga: ano que vem.", "来年[らいねん]", rainen]
  - ask: ["Say: a joke.", "Diga: uma piada.", "冗談[じょうだん]", joudan]
  - ask: ["Say: a pun.", "Diga: um trocadilho.", "駄洒落[だじゃれ]", dajare]
  - ask: ["Say: a dad joke.", "Diga: piada de tiozão.", "おやじ ギャグ", oyaji-gyagu]
  - ask: ["Say: it's funny.", "Diga: é engraçado.", "面白[おもしろ]い です。", omoshiroi]
  - ask: ["Say: I laughed.", "Diga: eu ri.", "笑[わら]いました。", warau]
  - note: ["A bad pun in Japanese is «寒[さむ]い», cold — the joke freezes the room. Groaning «さむっ！» is the right reaction, and the teller usually enjoys it.", "Trocadilho ruim em japonês é «寒[さむ]い», frio — a piada congela a sala. Resmungar «さむっ！» é a reação certa, e quem contou geralmente gosta."]
  - build: [osewa, ["なりました", "お世話[せわ] に なりました"]]
  - ask: ["Thank everyone for this year.", "Agradeça a todos por este ano.", "お世話[せわ] に なりました。", osewa]
  - ask: ["Say: I look forward to next year too.", "Diga: conto com vocês no ano que vem.", "来年[らいねん] も よろしく お願[ねが]いします。", yoroshiku-rainen]
  - note: ["That's the end of A2. You can handle city hall, the bank and the clinic, give advice and opinions, ask permission and forbid, talk about plans and the past, and get through a date, a nomikai and an onsen. In B1: friends, plain speech, and more feelings.", "Fim do A2. Você dá conta da prefeitura, do banco e da clínica, dá conselho e opinião, pede licença e proíbe, fala de planos e do passado, e sobrevive a um encontro, a um nomikai e a um onsen. No B1: amigos, fala informal e mais sentimentos."]
  - pt_only: "Piada de tiozão é universal: «o futon voou longe» é prima japonesa dos nossos trocadilhos de almoço de domingo. O resmungo é a melhor resposta nos dois países."
