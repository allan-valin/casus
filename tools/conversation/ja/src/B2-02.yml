id: B2-02
protagonist: m
title: ["The contract", "O contrato"]
situation: ["You got the permanent post. Chief Sato goes through the contract with you: monthly pay, bonuses, the probation period.", "Você conseguiu a vaga efetiva. A chefe Sato repassa o contrato com você: salário mensal, bônus, período de experiência."]
learn: [n3-067, n3-098]
culture: Bonuses twice a year
items:
  - [keiyakusho, "契約書[けいやくしょ]", "contract (document)", "contrato (documento)"]
  - [bonasu, "ボーナス", "bonus", "bônus"]
  - [shiyou-kikan, "試用[しよう] 期間[きかん]", "probation period", "período de experiência", {rare: true}]
  - [koto-ni-naru, "〜こと に なる", "it's been decided that…", "ficou decidido que…"]
  - [hairu-koto-ni-natta, "入[はい]る こと に なりました", "it's been decided I'll join", "ficou decidido que vou entrar"]
  - [gekkyuu, "月給[げっきゅう]", "monthly salary", "salário mensal"]
  - [shakai-hoken, "社会[しゃかい] 保険[ほけん]", "social insurance", "previdência e plano de saúde", {rare: true}]
  - [nenkin, "年金[ねんきん]", "pension", "aposentadoria, pensão"]
  - [hanko-wo-osu, "判子[はんこ] を 押[お]す", "stamp your seal", "carimbar"]
  - [joukou, "条件[じょうけん]", "conditions, terms", "condições"]
  - [yoroshii-desu-ka, "よろしい です か", "is that all right? (polite)", "está bem? (educado)"]
dialogue:
  - [sato, "来月[らいげつ] から 正社員[せいしゃいん] と して 働[はたら]く こと に なりました。 おめでとう。", "It's been decided you'll work as a permanent employee from next month. Congratulations.", "Ficou decidido que você vai trabalhar como efetivo a partir do mês que vem. Parabéns."]
  - [protagonist, "ありがとう ございます。 条件[じょうけん] を 確認[かくにん] しても よろしい です か。", "Thank you. May I check the terms?", "Obrigado. Posso conferir as condições?"]
  - [sato, "はい。 最初[さいしょ] の 三[さん] か月[げつ] は 試用[しよう] 期間[きかん] です。", "Yes. The first three months are a probation period.", "Sim. Os três primeiros meses são de experiência."]
  - [protagonist, "月給[げっきゅう] と ボーナス は？", "And the monthly salary and bonuses?", "E o salário mensal e o bônus?"]
  - [sato, "ボーナス は 年[ねん] に 二回[にかい]、 夏[なつ] と 冬[ふゆ] です。 社会[しゃかい] 保険[ほけん] と 年金[ねんきん] も あります。", "Bonuses twice a year, summer and winter. There's social insurance and a pension too.", "Bônus duas vezes por ano, no verão e no inverno. Tem previdência e plano de saúde também."]
  - [protagonist, "年金[ねんきん] は 帰国[きこく] したら どう なります か。", "What happens to the pension if I go back home?", "E a aposentadoria, se eu voltar para o Brasil?"]
  - [sato, "ブラジル と 日本[にほん] は 協定[きょうてい] が ある ので、 期間[きかん] を 合[あ]わせられます。", "Brazil and Japan have an agreement, so the periods can be combined.", "O Brasil e o Japão têm um acordo, então dá para somar os períodos."]
  - [sato, "では、 ここ に 判子[はんこ] を 押[お]して ください。", "Then please stamp your seal here.", "Então carimbe aqui, por favor."]
teach:
  - ask: ["Say: the contract.", "Diga: o contrato.", "契約書[けいやくしょ]", keiyakusho]
  - ask: ["Say: terms, conditions.", "Diga: as condições.", "条件[じょうけん]", joukou]
  - ask: ["Ask politely: is that all right?", "Pergunte com educação: está bem?", "よろしい です か。", yoroshii-desu-ka]
  - note: ["«〜こと に なる» is it's been decided — by others or by circumstances: «働[はたら]く こと に なりました», it's been arranged that I'll work. Compare «〜こと に する», I decided. Japanese often uses «なる» to sound modest about good news.", "«〜こと に なる» é ficou decidido — pelos outros ou pelas circunstâncias: «働[はたら]く こと に なりました», ficou acertado que vou trabalhar. Compare «〜こと に する», eu decidi. O japonês usa muito «なる» para soar modesto com uma boa notícia."]
  - ask: ["Say the pattern: it's been decided that…", "Diga o padrão: ficou decidido que…", "〜こと に なる", koto-ni-naru]
  - ask: ["Say: it's been decided I'll join.", "Diga: ficou decidido que vou entrar.", "入[はい]る こと に なりました。", hairu-koto-ni-natta]
  - ask: ["Say: the probation period.", "Diga: o período de experiência.", "試用[しよう] 期間[きかん]", shiyou-kikan]
  - ask: ["Say: monthly salary.", "Diga: salário mensal.", "月給[げっきゅう]", gekkyuu]
  - ask: ["Say: bonus.", "Diga: bônus.", "ボーナス", bonasu]
  - ask: ["Say: social insurance.", "Diga: previdência e plano de saúde.", "社会[しゃかい] 保険[ほけん]", shakai-hoken]
  - ask: ["Say: pension.", "Diga: aposentadoria.", "年金[ねんきん]", nenkin]
  - ask: ["Say: stamp your seal.", "Diga: carimbar.", "判子[はんこ] を 押[お]す", hanko-wo-osu]
  - note: ["Many Japanese companies pay a bonus twice a year, in summer and winter, often worth one or more months' salary each — though it depends on the company and on results. Brazil and Japan have a social-security agreement, so years paid into either pension can count toward the other.", "Muitas empresas japonesas pagam bônus duas vezes por ano, no verão e no inverno, muitas vezes de um ou mais salários cada — mas depende da empresa e dos resultados. O Brasil e o Japão têm um acordo de previdência, então os anos de contribuição num país podem contar no outro."]
  - pt_only: "No Brasil há o 13º salário e as férias com um terço; no Japão, o bônus de verão e de inverno faz esse papel — só que não é garantido por lei como o nosso 13º."
