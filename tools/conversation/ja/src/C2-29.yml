protagonist: f
title: ["The farewell", "A despedida"]
situation: ["A farewell dinner for Mrs Suzuki before she leaves for Tokyo. Kenta, Misaki, Maria, Lucas, Shota — and you, giving the last toast.", "Um jantar de despedida para a senhora Suzuki antes de ela ir para Tóquio. O Kenta, a Misaki, a Maria, o Lucas, o Shota — e você, fazendo o último brinde."]
learn: []
culture: —
items:
  - [owakare, "お別[わか]れ", "farewell", "despedida"]
  - [sabishiku-narimasu, "寂[さび]しく なります", "we'll miss you", "vamos sentir sua falta"]
  - [ogenki-de, "お元気[げんき] で", "take care, stay well", "fique bem, se cuide"]
  - [hontou-ni-osewa, "本当[ほんとう] に お世話[せわ] に なりました", "thank you for everything, truly", "obrigada por tudo, de verdade"]
  - [mata-aimashou, "また お会[あ]い しましょう", "let's meet again", "vamos nos ver de novo"]
  - [wasuremasen-review, "一生[いっしょう] 忘[わす]れません", "I'll never forget, all my life", "nunca vou esquecer, a vida toda"]
  - [oshiete-moratta, "教[おし]えて もらった こと", "what you taught me", "o que a senhora me ensinou"]
  - [itsumademo, "いつ まで も", "for ever, always", "para sempre"]
  - [kanpai-farewell, "鈴木[すずき] さん に 乾杯[かんぱい]", "to Mrs Suzuki!", "à senhora Suzuki!"]
  - [kaette-kite, "いつ でも 帰[かえ]って きて ください", "come back any time", "volte quando quiser"]
dialogue:
  - [protagonist, "鈴木[すずき] さん、 五年[ごねん] 前[まえ]、 ゴミ の 出[だ]し方[かた] から 教[おし]えて くださいました ね。", "Mrs Suzuki, five years ago you taught me everything, starting with how to put out the rubbish.", "Senhora Suzuki, cinco anos atrás a senhora me ensinou tudo, a começar por como separar o lixo."]
  - [suzuki, "あの 頃[ころ] は「すみません」 しか 言[い]えなかった だら。", "Back then all you could say was “sumimasen”, wasn't it.", "Naquela época você só sabia dizer «sumimasen», né?"]
  - [protagonist, "教[おし]えて もらった こと は、 一生[いっしょう] 忘[わす]れません。 本当[ほんとう] に お世話[せわ] に なりました。", "I'll never forget what you taught me. Thank you for everything, truly.", "Nunca vou esquecer o que a senhora me ensinou. Muito obrigada por tudo, de verdade."]
  - [kenta, "鈴木[すずき] さん が いない と、 寂[さび]しく なります。", "It'll be lonely without you, Mrs Suzuki.", "Vai ficar vazio sem a senhora."]
  - [suzuki, "東京[とうきょう] は 近[ちか]い よ。 新幹線[しんかんせん] で 一時間[いちじかん] 半[はん]。 また お会[あ]い しましょう。", "Tokyo isn't far. An hour and a half by shinkansen. Let's meet again.", "Tóquio é perto. Uma hora e meia de trem-bala. Vamos nos ver de novo."]
  - [protagonist, "畑[はたけ] の トマト、 毎年[まいとし] 送[おく]ります。 いつ でも 帰[かえ]って きて ください。", "I'll send tomatoes from the garden every year. Come back any time.", "Vou mandar tomate da horta todo ano. Volte quando quiser."]
  - [suzuki, "ありがとう。 みんな、 いつ まで も お元気[げんき] で ね。", "Thank you. Everyone, stay well, always.", "Obrigada. Todos vocês, fiquem bem, sempre."]
  - [protagonist, "それでは、 鈴木[すずき] さん に 乾杯[かんぱい]！", "Then — to Mrs Suzuki!", "Então — à senhora Suzuki!"]
