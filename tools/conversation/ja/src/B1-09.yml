id: B1-09
protagonist: f
title: [Statistics, Estatística]
situation: ["The factory ran an anonymous survey of its younger workers. Chief Sato asks you to translate the results for the Brazilian staff.", "A fábrica fez uma pesquisa anônima com os funcionários mais jovens. A chefe Sato pede que você traduza os resultados para os brasileiros."]
learn: [n4-078, n4-079]
culture: —
items:
  - [chousa, "調査[ちょうさ]", "survey, investigation", "pesquisa, levantamento"]
  - [heikin, "平均[へいきん]", "average", "média"]
  - [toukei, "統計[とうけい]", "statistics", "estatística"]
  - [kaitou, "回答[かいとう]", "answer, response", "resposta"]
  - [souda-hearsay, "〜そう だ", "I hear that…", "dizem que…, parece que (ouvi)"]
  - [ooi-sou-desu, "多[おお]い そう です", "I hear there are many", "dizem que são muitos"]
  - [hansuu, "半数[はんすう]", "half (of the number)", "metade (do total)"]
  - [wariai, "割合[わりあい]", "proportion, rate", "proporção"]
  - [nenrei, "年齢[ねんれい]", "age", "idade"]
  - [kekka, "結果[けっか]", "result", "resultado"]
  - [ijou, "〜以上[いじょう]", "or more", "ou mais"]
dialogue:
  - [sato, "これ が 若[わか]い 社員[しゃいん] の 調査[ちょうさ] の 結果[けっか] です。", "These are the results of the survey of young employees.", "Este é o resultado da pesquisa com os funcionários jovens."]
  - [protagonist, "回答[かいとう] は 何人[なんにん] です か。", "How many answered?", "Quantos responderam?"]
  - [sato, "二百人[にひゃくにん] です。 平均[へいきん] 年齢[ねんれい] は 二十七歳[にじゅうななさい]。", "Two hundred. The average age is 27.", "Duzentos. A idade média é 27 anos."]
  - [protagonist, "「残業[ざんぎょう] を 減[へ]らしたい」 が 半数[はんすう] 以上[いじょう] です ね。", "More than half say “I want less overtime”.", "Mais da metade diz «quero menos hora extra»."]
  - [sato, "ええ。 ほか の 会社[かいしゃ] でも 同[おな]じ 割合[わりあい] だ そう です。", "Yes. I hear the rate is the same at other companies.", "Sim. Dizem que em outras empresas a proporção é a mesma."]
  - [protagonist, "ブラジル 人[じん] の 回答[かいとう] も ある ん です か。", "Are there answers from Brazilians too?", "Tem respostas dos brasileiros também?"]
  - [sato, "はい、 ポルトガル語[ご] の 調査[ちょうさ] も ありました。 その 統計[とうけい] を 訳[やく]して ください。", "Yes, there was a Portuguese version. Please translate those statistics.", "Sim, teve a pesquisa em português também. Traduza essas estatísticas, por favor."]
  - [protagonist, "わかりました。 明日[あした] まで に 訳[やく]して おきます。", "Understood. I'll have it translated by tomorrow.", "Entendido. Até amanhã deixo traduzido."]
teach:
  - ask: ["Say: a survey.", "Diga: uma pesquisa.", "調査[ちょうさ]", chousa]
  - ask: ["Say: the result.", "Diga: o resultado.", "結果[けっか]", kekka]
  - ask: ["Say: a response.", "Diga: uma resposta.", "回答[かいとう]", kaitou]
  - ask: ["Say: average.", "Diga: média.", "平均[へいきん]", heikin]
  - ask: ["Say: age.", "Diga: idade.", "年齢[ねんれい]", nenrei]
  - ask: ["Say: statistics.", "Diga: estatística.", "統計[とうけい]", toukei]
  - ask: ["Say: half.", "Diga: metade.", "半数[はんすう]", hansuu]
  - ask: ["Say: or more.", "Diga: ou mais.", "〜以上[いじょう]", ijou]
  - ask: ["Say: proportion, rate.", "Diga: proporção.", "割合[わりあい]", wariai]
  - note: ["Hearsay: a plain sentence plus «そう です» — «同[おな]じ だ そう です», I hear it's the same. Don't mix it up with «おいしそう», looks delicious: there «そう» joins the stem; here it follows a whole sentence and means people say.", "Ouvi dizer: frase simples mais «そう です» — «同[おな]じ だ そう です», dizem que é igual. Não confunda com «おいしそう», parece gostoso: lá o «そう» cola no radical; aqui vem depois da frase inteira e quer dizer dizem que."]
  - ask: ["Say the hearsay ending: I hear that…", "Diga a terminação de ouvir dizer: dizem que…", "〜そう だ", souda-hearsay]
  - ask: ["Say: I hear there are many.", "Diga: dizem que são muitos.", "多[おお]い そう です。", ooi-sou-desu]
  - note: ["This survey is the factory's own, in the story. When you quote real figures, «〜そう です» or «〜に よると» — according to — tells people it's something you heard or read, not your own claim.", "Esta pesquisa é da própria fábrica, na história. Quando citar números reais, «〜そう です» ou «〜に よると» — segundo — mostra que é algo que você ouviu ou leu, não uma afirmação sua."]
  - pt_only: "Quem interpreta números tem uma regra de ouro nos dois idiomas: diga de onde veio o dado. Em japonês o próprio «そう です» já faz esse serviço."
