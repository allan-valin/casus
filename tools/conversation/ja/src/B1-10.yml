id: B1-10
protagonist: m
title: [Too indirect, Indireto demais]
situation: ["You proposed a new delivery schedule to Mr Yamada, the supplier. He smiled and said he'd consider it. You're pleased — until Chief Sato explains.", "Você propôs um novo cronograma de entregas ao senhor Yamada, o fornecedor. Ele sorriu e disse que ia considerar. Você ficou contente — até a chefe Sato explicar."]
learn: [n4-073]
culture: Indirect refusals
items:
  - [kentou-shimasu, "検討[けんとう] します", "we'll consider it", "vamos estudar"]
  - [honne, "本音[ほんね]", "true feelings", "o que se pensa de verdade", {rare: true}]
  - [tatemae, "建前[たてまえ]", "the public face", "o que se diz por educação", {rare: true}]
  - [you-da, "〜よう だ", "it seems, apparently (from what I see)", "parece que (pelo que vejo)"]
  - [dame-na-you-desu, "だめ な よう です", "it seems it's a no", "parece que não vai dar"]
  - [kotowaru, "断[ことわ]る", "refuse, turn down", "recusar"]
  - [hakkiri, "はっきり", "clearly, directly", "com clareza, diretamente"]
  - [kuuki-wo-yomu, "空気[くうき] を 読[よ]む", "read the atmosphere", "ler o clima"]
  - [hyoujou, "表情[ひょうじょう]", "facial expression", "expressão do rosto"]
  - [mata-kondo, "また 今度[こんど]", "another time", "fica para outra vez"]
dialogue:
  - [protagonist, "山田[やまだ] さん は「検討[けんとう] します」 と 言[い]いました。 よかった！", "Mr Yamada said “we'll consider it”. Great!", "O senhor Yamada disse «vamos estudar». Que bom!"]
  - [sato, "うーん… それ は 断[ことわ]り の よう です ね。", "Hmm… that sounds like a refusal.", "Hum… isso parece uma recusa."]
  - [protagonist, "え？ はっきり「いいえ」 と 言[い]いません でした よ。", "What? He didn't clearly say “no”.", "Como? Ele não disse «não» com clareza."]
  - [sato, "日本[にほん] で は、 はっきり 断[ことわ]る の は 失礼[しつれい] な ので。 表情[ひょうじょう] は どう でした か。", "In Japan refusing directly is rude. What was his expression like?", "No Japão recusar diretamente é falta de educação. Qual era a expressão dele?"]
  - [protagonist, "笑[わら]って いました けど、 ちょっと 困[こま]った よう でした。", "He was smiling, but he looked a bit troubled.", "Estava sorrindo, mas parecia meio sem jeito."]
  - [sato, "それ が 本音[ほんね] です。 言葉[ことば] は 建前[たてまえ]。", "That's his real feeling. The words are the polite surface.", "Esse é o que ele pensa de verdade. As palavras são a fachada educada."]
  - [protagonist, "空気[くうき] を 読[よ]む の は 難[むずか]しい です ね。", "Reading the atmosphere is hard.", "Ler o clima é difícil."]
  - [sato, "慣[な]れます よ。 また 今度[こんど]、 別[べつ] の 案[あん] を 出[だ]しましょう。", "You'll get used to it. Let's offer another idea another time.", "Você se acostuma. Outra hora a gente apresenta outra proposta."]
teach:
  - ask: ["Say what Mr Yamada said: we'll consider it.", "Diga o que o senhor Yamada disse: vamos estudar.", "検討[けんとう] します。", kentou-shimasu]
  - ask: ["Say: to refuse.", "Diga: recusar.", "断[ことわ]る", kotowaru]
  - ask: ["Say: clearly, directly.", "Diga: com clareza.", "はっきり", hakkiri]
  - note: ["«よう だ» is it seems — your guess from what you see: «困[こま]った よう でした», he looked troubled. Nouns and «な» words take «の» or «な»: «断[ことわ]り の よう です», it seems to be a refusal; «だめ な よう です», it seems it's a no.", "«よう だ» é parece — seu palpite pelo que você vê: «困[こま]った よう でした», parecia sem jeito. Substantivos e palavras com «な» levam «の» ou «な»: «断[ことわ]り の よう です», parece uma recusa; «だめ な よう です», parece que não vai dar."]
  - ask: ["Say the pattern: it seems.", "Diga o padrão: parece que.", "〜よう だ", you-da]
  - ask: ["Say: it seems it's a no.", "Diga: parece que não vai dar.", "だめ な よう です。", dame-na-you-desu]
  - ask: ["Say: facial expression.", "Diga: expressão do rosto.", "表情[ひょうじょう]", hyoujou]
  - ask: ["Say: true feelings.", "Diga: o que se pensa de verdade.", "本音[ほんね]", honne]
  - ask: ["Say: the public face.", "Diga: a fachada educada.", "建前[たてまえ]", tatemae]
  - ask: ["Say: read the atmosphere.", "Diga: ler o clima.", "空気[くうき] を 読[よ]む", kuuki-wo-yomu]
  - ask: ["Say: another time.", "Diga: fica para outra vez.", "また 今度[こんど]", mata-kondo]
  - note: ["«本音[ほんね]» and «建前[たてまえ]»: what you really think and what you say to keep harmony. In business «検討[けんとう] します», «前向[まえむ]き に 考[かんが]えます» or «また 今度[こんど]» often mean no. Watch the face, the pause, the «ちょっと…» — and if you must know, ask a colleague, not the client.", "«本音[ほんね]» e «建前[たてまえ]»: o que se pensa de verdade e o que se diz para manter a harmonia. Nos negócios, «検討[けんとう] します», «前向[まえむ]き に 考[かんが]えます» ou «また 今度[こんど]» muitas vezes querem dizer não. Repare no rosto, na pausa, no «ちょっと…» — e se precisar saber, pergunte a um colega, não ao cliente."]
  - pt_only: "O brasileiro também enrola — «vamos ver», «te ligo» —, mas costuma ser mais claro no trabalho. Com japoneses, trate «vamos estudar» como um não educado até prova em contrário."
