id: A1-09
protagonist: f
title: [Colours, Cores]
situation: ["At the factory you get your uniform. Kenta helps you choose a helmet.", "Na fábrica você recebe o uniforme. O Kenta ajuda você a escolher um capacete."]
learn: [n5-027]
culture: —
items:
  - [aka, "赤[あか]", "red", "vermelho"]
  - [ao, "青[あお]", "blue", "azul"]
  - [shiro, "白[しろ]", "white", "branco"]
  - [kuro, "黒[くろ]", "black", "preto"]
  - [kiiro, "黄色[きいろ]", "yellow", "amarelo"]
  - [seifuku, "制服[せいふく]", "uniform", "uniforme"]
  - [herumetto, "ヘルメット", "helmet", "capacete"]
  - [kirei, "きれい", "pretty, clean", "bonito, limpo"]
  - [suki, "好[す]き", "liked, favourite", "gosta de, preferido"]
  - [nani-iro, "何色[なにいろ]", "what colour", "que cor"]
  - [dou-desu-ka, "どう です か", "how about it?", "que tal?"]
dialogue:
  - [kenta, "これ が 制服[せいふく] です。 青[あお] です。", "This is the uniform. It's blue.", "Este é o uniforme. É azul."]
  - [protagonist, "きれい です ね。 ヘルメット は 何色[なにいろ] です か。", "It's nice. What colour is the helmet?", "Que bonito. O capacete é de que cor?"]
  - [kenta, "白[しろ] と 黄色[きいろ] が あります。", "There are white and yellow ones.", "Tem branco e amarelo."]
  - [protagonist, "赤[あか] は？", "And red?", "E vermelho?"]
  - [kenta, "赤[あか] は 課長[かちょう] の 色[いろ] です。", "Red is the chiefs' colour.", "Vermelho é a cor dos chefes."]
  - [protagonist, "じゃあ、 黄色[きいろ] が 好[す]き です。", "Then I like yellow.", "Então eu gosto do amarelo."]
  - [kenta, "黄色[きいろ] は 新人[しんじん] の 色[いろ] です よ。", "Yellow is the newcomers' colour.", "Amarelo é a cor dos novatos."]
  - [protagonist, "ぴったり です ね！", "Perfect, then!", "Perfeito, então!"]
teach:
  - ask: ["Say: blue.", "Diga: azul.", "青[あお]", ao]
  - ask: ["Say: red.", "Diga: vermelho.", "赤[あか]", aka]
  - ask: ["Say: white.", "Diga: branco.", "白[しろ]", shiro]
  - ask: ["Say: black.", "Diga: preto.", "黒[くろ]", kuro]
  - ask: ["Say: yellow.", "Diga: amarelo.", "黄色[きいろ]", kiiro]
  - ask: ["Ask what colour the helmet is.", "Pergunte de que cor é o capacete.", "ヘルメット は 何色[なにいろ] です か。", herumetto, nani-iro]
  - note: ["Some adjectives take «な» before a noun and stand alone before «です»: «きれい です», «好[す]き です» — you like it.", "Alguns adjetivos levam «な» antes de um substantivo e ficam sozinhos antes de «です»: «きれい です», «好[す]き です» — você gosta."]
  - ask: ["Say: the uniform is pretty.", "Diga: o uniforme é bonito.", "制服[せいふく] は きれい です。", seifuku, kirei]
  - ask: ["Say: I like yellow.", "Diga: eu gosto de amarelo.", "黄色[きいろ] が 好[す]き です。", kiiro, suki]
  - ask: ["Ask: how about it?", "Pergunte: que tal?", "どう です か。", dou-desu-ka]
