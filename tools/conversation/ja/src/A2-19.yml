id: A2-19
protagonist: f
title: [Grandmother's village, A aldeia da avó]
situation: ["A long weekend in Hiroshima prefecture: the village your grandmother left as a child. Her younger brother, now eighty, is waiting at the bus stop.", "Um feriado prolongado na província de Hiroshima: a aldeia que sua avó deixou quando criança. O irmão mais novo dela, hoje com oitenta anos, espera no ponto de ônibus."]
learn: []
culture: The emigrant villages
items:
  - [mura, "村[むら]", "village", "aldeia, vilarejo"]
  - [imin, "移民[いみん]", "emigrant, emigration", "emigrante, emigração"]
  - [shinseki, "親戚[しんせき]", "relatives", "parentes"]
  - [ta-koto-ga-arimasu, "〜た こと が あります", "have (ever) done", "já fiz (alguma vez)"]
  - [kita-koto, "来[き]た こと が あります", "have been here before", "já vim aqui"]
  - [itta-koto-ga-nai, "行[い]った こと が ありません", "have never been", "nunca fui"]
  - [mukashi-no, "昔[むかし] の", "of the old days", "de antigamente"]
  - [haka, "お墓[はか]", "grave", "túmulo", {rare: true}]
  - [omairi, "お参[まい]り", "visit (to a grave or shrine)", "visita (ao túmulo ou santuário)"]
  - [nite-imasu, "似[に]て います", "look alike", "é parecido, puxou"]
  - [okaeri, "おかえり", "welcome home", "bem-vinda de volta"]
dialogue:
  - [ojisan, "よう 来[き]た のう。 おかえり。", "Good of you to come. Welcome home.", "Que bom que veio. Bem-vinda de volta."]
  - [protagonist, "はじめまして。 千代[ちよ] の 孫[まご] です。", "Nice to meet you. I'm Chiyo's granddaughter.", "Muito prazer. Sou neta da Chiyo."]
  - [ojisan, "姉[あね] に よう 似[に]て いる。 日本[にほん] に 来[き]た こと が ある か。", "You look just like my sister. Have you been to Japan before?", "Você é a cara da minha irmã. Já tinha vindo ao Japão?"]
  - [protagonist, "いいえ、 来[き]た こと が ありません でした。 今[いま] は 浜松[はままつ] で 働[はたら]いて います。", "No, I'd never been. Now I work in Hamamatsu.", "Não, nunca tinha vindo. Agora trabalho em Hamamatsu."]
  - [ojisan, "この 村[むら] から、 昔[むかし] たくさん の 移民[いみん] が ブラジル へ 行[い]った。", "Long ago, many emigrants left this village for Brazil.", "Antigamente, muitos emigrantes saíram desta aldeia para o Brasil."]
  - [protagonist, "ブラジル に 行[い]った こと が あります か。", "Have you ever been to Brazil?", "O senhor já foi ao Brasil?"]
  - [ojisan, "ない。 でも 親戚[しんせき] が たくさん おる。 まず、 お墓[はか] に お参[まい]り しよう。", "No. But I have many relatives there. First, let's visit the family grave.", "Não. Mas tenho muitos parentes lá. Primeiro, vamos visitar o túmulo da família."]
  - [protagonist, "はい。 祖母[そぼ] の 写真[しゃしん] を 持[も]って きました。", "Yes. I brought grandmother's photo.", "Vamos. Eu trouxe a foto da vovó."]
teach:
  - ask: ["Say: a village.", "Diga: uma aldeia.", "村[むら]", mura]
  - ask: ["Say: emigrants.", "Diga: emigrantes.", "移民[いみん]", imin]
  - ask: ["Say: relatives.", "Diga: parentes.", "親戚[しんせき]", shinseki]
  - note: ["Have done, ever: the plain past plus «こと が あります» — «来[き]た こと が あります», I have been here before. Never: «〜た こと が ありません» — «行[い]った こと が ありません», I have never been.", "Já fiz, alguma vez: o passado simples mais «こと が あります» — «来[き]た こと が あります», já vim aqui. Nunca: «〜た こと が ありません» — «行[い]った こと が ありません», nunca fui."]
  - ask: ["Say the pattern: have ever done.", "Diga o padrão: já fiz alguma vez.", "〜た こと が あります", ta-koto-ga-arimasu]
  - build: [kita-koto, ["あります", "こと が あります", "来[き]た こと が あります"]]
  - ask: ["Say: I've been here before.", "Diga: já vim aqui.", "来[き]た こと が あります。", kita-koto]
  - ask: ["Say: I've never been.", "Diga: nunca fui.", "行[い]った こと が ありません。", itta-koto-ga-nai]
  - ask: ["Ask him if he's ever been to Brazil.", "Pergunte se ele já foi ao Brasil.", "ブラジル に 行[い]った こと が あります か。", ta-koto-ga-arimasu]
  - ask: ["Say: of the old days.", "Diga: de antigamente.", "昔[むかし] の", mukashi-no]
  - ask: ["Say: you look alike.", "Diga: é parecido, puxou.", "似[に]て います。", nite-imasu]
  - ask: ["Say: the grave.", "Diga: o túmulo.", "お墓[はか]", haka]
  - ask: ["Say: a visit to the grave.", "Diga: visita ao túmulo.", "お参[まい]り", omairi]
  - ask: ["Say what family says when you come back: welcome home.", "Diga o que a família diz quando você volta: bem-vinda de volta.", "おかえり。", okaeri]
  - note: ["The great-uncle speaks Hiroshima dialect: «よう» for «よく», «のう» for «ね», «おる» for «いる». From the 1900s to the 1960s whole villages in Hiroshima, Kumamoto, Okinawa and Fukuoka sent emigrants to Brazil; many still keep photos and letters from the other side.", "O tio-avô fala o dialeto de Hiroshima: «よう» no lugar de «よく», «のう» no lugar de «ね», «おる» no lugar de «いる». Dos anos 1900 aos 1960, aldeias inteiras de Hiroshima, Kumamoto, Okinawa e Fukuoka mandaram emigrantes para o Brasil; muitas famílias ainda guardam fotos e cartas do outro lado."]
  - pt_only: "Para muitos descendentes, a visita à aldeia fecha um círculo: a família que ficou também guardou a história de quem partiu. Leve fotos — eles vão querer ver."
