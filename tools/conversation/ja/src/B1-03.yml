id: B1-03
protagonist: f
title: [The cell, A célula]
situation: ["Aya, Kenta's sister, studies biology. She shows you cells under her microscope and explains, with plenty of passives.", "A Aya, irmã do Kenta, estuda biologia. Ela mostra células no microscópio dela e explica, com muita voz passiva."]
learn: [n4-040, n4-041]
culture: —
items:
  - [saibou, "細胞[さいぼう]", "cell", "célula"]
  - [kaku, "核[かく]", "nucleus", "núcleo"]
  - [wakareru, "分[わ]かれる", "divide, split", "se dividir"]
  - [seibutsu, "生物[せいぶつ]", "living thing; biology", "ser vivo; biologia"]
  - [kenbikyou, "顕微鏡[けんびきょう]", "microscope", "microscópio", {rare: true}]
  - [rareru, "〜られる", "passive (is …-ed)", "voz passiva (é …-do)"]
  - [tsukurareru, "作[つく]られる", "is made", "é feito"]
  - [hakken-sareta, "発見[はっけん] された", "was discovered", "foi descoberto"]
  - [mieru, "見[み]える", "can be seen, is visible", "dá para ver"]
  - [karada, "体[からだ]", "body", "corpo"]
  - [sugoi-kazu, "すごい 数[かず]", "an enormous number", "um número enorme"]
dialogue:
  - [aya, "これ、 玉[たま]ねぎ の 細胞[さいぼう]。 見[み]える？", "This is an onion cell. Can you see it?", "Isto é uma célula de cebola. Dá para ver?"]
  - [protagonist, "見[み]える！ 真[ま]ん中[なか] の 丸[まる]い の は 何[なに]？", "I can! What's the round thing in the middle?", "Dá! O que é a coisa redonda no meio?"]
  - [aya, "核[かく] だ よ。 細胞[さいぼう] は 核[かく] の 情報[じょうほう] で 作[つく]られる。", "That's the nucleus. The cell is made from the information in it.", "É o núcleo. A célula é feita a partir da informação dele."]
  - [protagonist, "細胞[さいぼう] は どう やって 増[ふ]える の？", "How do cells multiply?", "Como as células se multiplicam?"]
  - [aya, "二[ふた]つ に 分[わ]かれる の。 体[からだ] の 細胞[さいぼう] は すごい 数[かず] だ よ。", "They split in two. The cells in your body are an enormous number.", "Elas se dividem em duas. As células do corpo são um número enorme."]
  - [protagonist, "細胞[さいぼう] は 誰[だれ] に 発見[はっけん] された の？", "Who discovered cells?", "Quem descobriu a célula?"]
  - [aya, "フック と いう イギリス 人[じん] に 発見[はっけん] された。 千六百[せんろっぴゃく] 年代[ねんだい]。", "They were discovered by an Englishman called Hooke. In the 1600s.", "Foi descoberta por um inglês chamado Hooke. Nos anos 1600."]
  - [protagonist, "生物[せいぶつ] って 面白[おもしろ]い ね。", "Biology is interesting.", "Biologia é interessante."]
teach:
  - ask: ["Say: a cell.", "Diga: uma célula.", "細胞[さいぼう]", saibou]
  - ask: ["Say: the nucleus.", "Diga: o núcleo.", "核[かく]", kaku]
  - ask: ["Say: a microscope.", "Diga: um microscópio.", "顕微鏡[けんびきょう]", kenbikyou]
  - ask: ["Say: can you see it? — casually.", "Diga: dá para ver? — informal.", "見[み]える？", mieru]
  - ask: ["Say: the body.", "Diga: o corpo.", "体[からだ]", karada]
  - ask: ["Say: they divide.", "Diga: elas se dividem.", "分[わ]かれる。", wakareru]
  - ask: ["Say: biology, living things.", "Diga: biologia, seres vivos.", "生物[せいぶつ]", seibutsu]
  - note: ["The passive: «る» verbs take «られる» — «作[つく]る» → «作[つく]られる», is made; other verbs change their last sound to «あ» and add «れる»; «する» becomes «される» — «発見[はっけん] される», is discovered. The doer takes «に»: «フック に 発見[はっけん] された», discovered by Hooke.", "A passiva: verbos em «る» levam «られる» — «作[つく]る» → «作[つく]られる», é feito; os outros mudam o último som para «あ» e acrescentam «れる»; «する» vira «される» — «発見[はっけん] される», é descoberto. Quem faz leva «に»: «フック に 発見[はっけん] された», descoberta por Hooke."]
  - ask: ["Say the passive ending.", "Diga a terminação da passiva.", "〜られる", rareru]
  - ask: ["Say: it is made.", "Diga: é feito.", "作[つく]られる", tsukurareru]
  - ask: ["Say: it was discovered.", "Diga: foi descoberto.", "発見[はっけん] された", hakken-sareta]
  - ask: ["Say: an enormous number.", "Diga: um número enorme.", "すごい 数[かず]", sugoi-kazu]
  - note: ["Science words in Japanese are built from kanji meanings: «細胞[さいぼう]» is thin + sac, «顕微鏡[けんびきょう]» is show-tiny-mirror. Learn the kanji and you can guess many technical words.", "As palavras de ciência em japonês são montadas pelos sentidos dos kanji: «細胞[さいぼう]» é fino + bolsa, «顕微鏡[けんびきょう]» é mostrar-minúsculo-espelho. Aprendendo os kanji, dá para adivinhar muitos termos técnicos."]
  - pt_only: "No português a ciência vem do grego e do latim — «microscópio», «núcleo». No japonês vem dos kanji: o mesmo truque de montar palavras, com peças diferentes."
