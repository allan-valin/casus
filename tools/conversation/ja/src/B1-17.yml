id: B1-17
protagonist: m
title: [The wrong exit, A saída errada]
situation: ["You're meeting Yui at Shizuoka station. You're at the north exit; she's not there. Your phone rings.", "Você vai encontrar a Yui na estação de Shizuoka. Você está na saída norte; ela não está lá. O celular toca."]
learn: []
culture: Meeting at named exits
items:
  - [kitaguchi, "北口[きたぐち]", "north exit", "saída norte"]
  - [minamiguchi, "南口[みなみぐち]", "south exit", "saída sul"]
  - [mayotta, "迷[まよ]った", "got lost", "me perdi"]
  - [to-itta, "〜と 言[い]った", "said that…", "disse que…"]
  - [minami-to-itta, "南口[みなみぐち] と 言[い]った", "(I) said the south exit", "eu disse saída sul"]
  - [kaisatsu, "改札[かいさつ]", "ticket gate", "catraca, bloqueio"]
  - [machiawase, "待[ま]ち合[あ]わせ", "meeting up (at a set place)", "encontro marcado (num lugar)"]
  - [mejirushi, "目印[めじるし]", "landmark", "ponto de referência", {rare: true}]
  - [ima-doko, "今[いま]、 どこ？", "where are you now?", "onde você está agora?"]
  - [mukau, "向[む]かう", "head towards", "ir em direção a"]
dialogue:
  - [yui, "もしもし、 今[いま]、 どこ？", "Hello, where are you now?", "Alô, onde você está agora?"]
  - [protagonist, "北口[きたぐち] の 改札[かいさつ] の 前[まえ]。 由衣[ゆい] は？", "In front of the north exit ticket gate. And you?", "Na frente da catraca da saída norte. E você?"]
  - [yui, "私[わたし] は 南口[みなみぐち]。 南口[みなみぐち] で 待[ま]ち合[あ]わせ と 言[い]った よ。", "I'm at the south exit. I said we'd meet at the south exit.", "Eu estou na saída sul. Eu disse que era na saída sul."]
  - [protagonist, "え、 北口[きたぐち] と 聞[き]いた と 思[おも]った。 ごめん、 迷[まよ]った。", "What, I thought I heard north. Sorry, I got lost.", "Ué, achei que tinha ouvido norte. Desculpa, me perdi."]
  - [yui, "大丈夫[だいじょうぶ]。 駅[えき] の 中[なか] を 通[とお]って、 南[みなみ] へ 向[む]かって。", "It's fine. Go through the station and head south.", "Tudo bem. Atravessa a estação e vem para o sul."]
  - [protagonist, "目印[めじるし] は？", "Any landmark?", "Algum ponto de referência?"]
  - [yui, "大[おお]きい 時計[とけい] の 下[した]。 白[しろ]い コート を 着[き]て いる。", "Under the big clock. I'm wearing a white coat.", "Embaixo do relógio grande. Estou de casaco branco."]
  - [protagonist, "見[み]えた！ 今[いま] 行[い]く。", "I see you! Coming now.", "Te vi! Já vou."]
teach:
  - ask: ["Say: the north exit.", "Diga: a saída norte.", "北口[きたぐち]", kitaguchi]
  - ask: ["Say: the south exit.", "Diga: a saída sul.", "南口[みなみぐち]", minamiguchi]
  - ask: ["Say: the ticket gate.", "Diga: a catraca.", "改札[かいさつ]", kaisatsu]
  - ask: ["Say: a meet-up at a set place.", "Diga: encontro marcado.", "待[ま]ち合[あ]わせ", machiawase]
  - ask: ["Ask: where are you now?", "Pergunte: onde você está agora?", "今[いま]、 どこ？", ima-doko]
  - note: ["Reporting speech: the words plus «と 言[い]った» — «南口[みなみぐち] と 言[い]った», I said the south exit. With a whole sentence: «南口[みなみぐち] で 待[ま]ち合[あ]わせ と 言[い]った». The same «と» marks what you heard or thought: «北口[きたぐち] と 聞[き]いた».", "Discurso relatado: as palavras mais «と 言[い]った» — «南口[みなみぐち] と 言[い]った», eu disse saída sul. Com uma frase inteira: «南口[みなみぐち] で 待[ま]ち合[あ]わせ と 言[い]った». O mesmo «と» marca o que se ouviu ou pensou: «北口[きたぐち] と 聞[き]いた»."]
  - ask: ["Say the pattern: said that…", "Diga o padrão: disse que…", "〜と 言[い]った", to-itta]
  - ask: ["Say: I said the south exit.", "Diga: eu disse saída sul.", "南口[みなみぐち] と 言[い]った。", minami-to-itta]
  - ask: ["Say: I got lost.", "Diga: me perdi.", "迷[まよ]った。", mayotta]
  - ask: ["Ask: any landmark?", "Pergunte: algum ponto de referência?", "目印[めじるし] は？", mejirushi]
  - ask: ["Say: head towards the south.", "Diga: ir em direção ao sul.", "南[みなみ] へ 向[む]かう", mukau]
  - note: ["Big Japanese stations have several exits, each named — 北口, 南口, 東口, 西口, or after a landmark — and they can be far apart. Always arrange a meeting by exit and a landmark: a clock, a statue, a shop.", "As estações grandes do Japão têm várias saídas, cada uma com nome — 北口, 南口, 東口, 西口, ou o de um marco — e elas podem ficar longe uma da outra. Marque sempre o encontro pela saída e por um ponto de referência: um relógio, uma estátua, uma loja."]
  - pt_only: "É como marcar «na estação da Sé» sem dizer qual saída: você pode ficar meia hora no lado errado. No Japão, saída e ponto de referência, sempre."
