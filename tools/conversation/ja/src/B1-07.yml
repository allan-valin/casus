id: B1-07
protagonist: f
title: ["Japanese in Brazil, Brazilian in Japan", "Japonês no Brasil, brasileiro no Japão"]
situation: ["A shop assistant spoke to you in English, though you look Japanese. At the bakery you tell Maria — she has lived this for twenty years.", "Um vendedor falou com você em inglês, mesmo você tendo cara de japonesa. Na padaria você conta para a Maria — ela vive isso há vinte anos."]
learn: [n4-006, n4-007]
culture: Nikkei identity
items:
  - [gaikokujin, "外国人[がいこくじん]", "foreigner", "estrangeiro"]
  - [mitame, "見[み]た目[め]", "appearance, looks", "aparência"]
  - [ibasho, "居場所[いばしょ]", "a place where you belong", "um lugar onde se pertence", {rare: true}]
  - [noni, "〜のに", "even though (with frustration)", "mesmo que, apesar de (com frustração)"]
  - [nihonjin-na-noni, "日系[にっけい] な のに", "even though I'm nikkei", "mesmo sendo nikkei"]
  - [chuuto-hanpa, "中途半端[ちゅうとはんぱ]", "halfway, neither one nor the other", "nem uma coisa nem outra", {rare: true}]
  - [doushite-mo, "どうしても", "no matter what, somehow", "de qualquer jeito"]
  - [ryouhou, "両方[りょうほう]", "both", "os dois, ambos"]
  - [jibun, "自分[じぶん]", "oneself", "si mesmo, a gente"]
  - [kimochi-wakaru, "気持[きも]ち、 わかる", "I know how you feel", "entendo o que você sente"]
dialogue:
  - [protagonist, "今日[きょう]、 店員[てんいん] に 英語[えいご] で 話[はな]されました。 見[み]た目[め] は 日本人[にほんじん] な のに。", "Today a shop assistant talked to me in English. Even though I look Japanese.", "Hoje um vendedor falou comigo em inglês. Mesmo eu tendo cara de japonesa."]
  - [maria, "気持[きも]ち、 わかる よ。 私[わたし] も ブラジル で は「ジャポネーザ」 だった。", "I know how you feel. In Brazil I was “the Japanese girl”.", "Entendo o que você sente. No Brasil eu era «a japonesa»."]
  - [protagonist, "日本[にほん] で は 外国人[がいこくじん]、 ブラジル で は 日本人[にほんじん]。 中途半端[ちゅうとはんぱ] です ね。", "In Japan a foreigner, in Brazil Japanese. Neither one nor the other.", "No Japão estrangeira, no Brasil japonesa. Nem uma coisa nem outra."]
  - [maria, "私[わたし] も そう 思[おも]った。 日本語[にほんご] を 勉強[べんきょう] した のに、 まだ 外国人[がいこくじん]。", "I thought so too. I studied Japanese, and still a foreigner.", "Eu também achava. Estudei japonês, e ainda assim estrangeira."]
  - [protagonist, "自分[じぶん] の 居場所[いばしょ] は どこ だろう。", "Where do I belong, I wonder.", "Onde será que é o meu lugar?"]
  - [maria, "今[いま] は 両方[りょうほう] だ と 思[おも]う。 ブラジル も 日本[にほん] も、 私[わたし] の 国[くに]。", "Now I think it's both. Brazil and Japan are both my countries.", "Hoje acho que são os dois. O Brasil e o Japão, os dois são meu país."]
  - [protagonist, "両方[りょうほう] か。 いい です ね。", "Both, huh. That's nice.", "Os dois, é? Que bom."]
  - [maria, "この パン屋[や] が 私[わたし] の 居場所[いばしょ]。 あなた も いつでも 来[き]て ね。", "This bakery is where I belong. Come any time, you too.", "Esta padaria é o meu lugar. Venha quando quiser, você também."]
teach:
  - ask: ["Say: a foreigner.", "Diga: um estrangeiro.", "外国人[がいこくじん]", gaikokujin]
  - ask: ["Say: looks, appearance.", "Diga: aparência.", "見[み]た目[め]", mitame]
  - note: ["«のに» is even though — with a note of frustration or surprise: «勉強[べんきょう] した のに、 まだ 外国人[がいこくじん]» — I studied, and still a foreigner. After nouns and «な» words: «な のに».", "«のに» é mesmo que, apesar de — com um tom de frustração ou surpresa: «勉強[べんきょう] した のに、 まだ 外国人[がいこくじん]» — estudei, e ainda assim estrangeira. Depois de substantivos e palavras com «な»: «な のに»."]
  - ask: ["Say the ending: even though…", "Diga a terminação: mesmo que…", "〜のに", noni]
  - ask: ["Say: even though I'm nikkei.", "Diga: mesmo sendo nikkei.", "日系[にっけい] な のに", nihonjin-na-noni]
  - ask: ["Say: neither one nor the other.", "Diga: nem uma coisa nem outra.", "中途半端[ちゅうとはんぱ]", chuuto-hanpa]
  - ask: ["Say: a place where you belong.", "Diga: um lugar onde se pertence.", "居場所[いばしょ]", ibasho]
  - ask: ["Say: oneself.", "Diga: si mesmo.", "自分[じぶん]", jibun]
  - ask: ["Say: both.", "Diga: os dois.", "両方[りょうほう]", ryouhou]
  - ask: ["Say: no matter what, somehow.", "Diga: de qualquer jeito.", "どうしても", doushite-mo]
  - ask: ["Tell a friend: I know how you feel.", "Diga a um amigo: entendo o que você sente.", "気持[きも]ち、 わかる。", kimochi-wakaru]
  - note: ["Many nikkei know this: «ジャポネーザ» in Brazil, «外国人[がいこくじん]» in Japan. Japanese people may expect a Japanese face to speak perfect Japanese — or assume it can't. Communities like Hamamatsu's, with Brazilian shops and schools, are where many find their «居場所[いばしょ]».", "Muitos nikkeis conhecem isso: «ジャポネーザ» no Brasil, «外国人[がいこくじん]» no Japão. Os japoneses podem esperar que um rosto japonês fale japonês perfeito — ou achar que não fala. Comunidades como a de Hamamatsu, com lojas e escolas brasileiras, são onde muitos encontram o seu «居場所[いばしょ]»."]
  - pt_only: "A segunda e a terceira geração costumam sentir isso nos dois países. Não há resposta certa — muita gente acaba, como a Maria, chamando os dois lugares de casa."
