id: A1-16
protagonist: m
title: [The Brazilian bakery, A padaria brasileira]
situation: ["Saturday morning. Kenta has never eaten pão de queijo. You take him to Maria's Brazilian bakery.", "Sábado de manhã. O Kenta nunca comeu pão de queijo. Você leva ele à padaria brasileira da Maria."]
learn: []
culture: Brazil inside Japan
items:
  - [pan, "パン", "bread", "pão"]
  - [pao-de-queijo, "ポン・デ・ケージョ", "pão de queijo", "pão de queijo"]
  - [oishii, "おいしい", "tasty, delicious", "gostoso"]
  - [oishikatta, "おいしかった です", "it was delicious", "estava gostoso"]
  - [deshita, "でした", "was (polite past of です)", "era, foi (passado educado de です)"]
  - [hajimete, "初[はじ]めて", "for the first time", "pela primeira vez"]
  - [mise, "店[みせ]", "shop", "loja"]
  - [ninki, "人気[にんき]", "popular", "popular"]
  - [koohii, "コーヒー", "coffee", "café"]
  - [futatsu-kudasai, "ふたつ ください", "two, please", "dois, por favor"]
  - [mochimochi, "もちもち", "chewy, springy (texture)", "elástico, macio (textura)"]
dialogue:
  - [maria, "いらっしゃい！ あ、 久[ひさ]しぶり。", "Welcome! Oh, long time no see.", "Bem-vindo! Ah, quanto tempo."]
  - [protagonist, "マリア さん、 こちら は 友達[ともだち] の 健太[けんた] さん です。 初[はじ]めて です。", "Maria, this is my friend Kenta. It's his first time.", "Maria, este é meu amigo Kenta. É a primeira vez dele."]
  - [kenta, "はじめまして。 この 店[みせ] は 人気[にんき] です ね。", "Nice to meet you. This shop is popular, isn't it.", "Muito prazer. Esta loja é bem popular, né?"]
  - [protagonist, "ポン・デ・ケージョ を ふたつ ください。 コーヒー も。", "Two pão de queijo, please. Coffee too.", "Dois pães de queijo, por favor. Café também."]
  - [kenta, "わあ、 もちもち です ね！ おいしい！", "Wow, it's chewy! Delicious!", "Nossa, é macio e elástico! Gostoso!"]
  - [maria, "ブラジル の チーズ パン です よ。", "It's Brazilian cheese bread.", "É pão de queijo brasileiro."]
  - [kenta, "昨日[きのう] の パン も おいしかった です か。", "Was yesterday's bread good too?", "O pão de ontem também estava gostoso?"]
  - [protagonist, "昨日[きのう] は 休[やす]み でした。", "Yesterday it was closed.", "Ontem estava fechado."]
  - [kenta, "ごちそうさま でした。 本当[ほんとう] に おいしかった です。", "Thank you for the meal. It was really delicious.", "Obrigado pela comida. Estava muito gostoso mesmo."]
teach:
  - ask: ["Say: bread.", "Diga: pão.", "パン", pan]
  - ask: ["Say: pão de queijo, the Japanese way.", "Diga: pão de queijo, do jeito japonês.", "ポン・デ・ケージョ", pao-de-queijo]
  - ask: ["Order two, please.", "Peça dois, por favor.", "ポン・デ・ケージョ を ふたつ ください。", futatsu-kudasai, wo]
  - ask: ["Say: coffee too.", "Diga: café também.", "コーヒー も。", koohii]
  - ask: ["Say: it's delicious!", "Diga: que gostoso!", "おいしい！", oishii]
  - note: ["The past of «です» is «でした»: «休[やす]み でした» — it was closed. An い-adjective changes itself: «おいしい» → «おいしかった です».", "O passado de «です» é «でした»: «休[やす]み でした» — estava fechado. O adjetivo em い muda ele mesmo: «おいしい» → «おいしかった です»."]
  - ask: ["Say: it was delicious.", "Diga: estava gostoso.", "おいしかった です。", oishikatta]
  - ask: ["Say: yesterday it was closed.", "Diga: ontem estava fechado.", "昨日[きのう] は 休[やす]み でした。", deshita]
  - ask: ["Say: it's his first time.", "Diga: é a primeira vez dele.", "初[はじ]めて です。", hajimete]
  - ask: ["Say: this shop is popular.", "Diga: esta loja é popular.", "この 店[みせ] は 人気[にんき] です。", mise, ninki]
  - ask: ["Describe the texture of pão de queijo.", "Descreva a textura do pão de queijo.", "もちもち です。", mochimochi]
  - note: ["Hamamatsu has one of the largest Brazilian communities in Japan, mostly nikkei families who came from the 1990s: Brazilian shops, schools, churches, and signs in Portuguese.", "Hamamatsu tem uma das maiores comunidades brasileiras do Japão, sobretudo famílias nikkeis que vieram a partir dos anos 1990: lojas brasileiras, escolas, igrejas e placas em português."]
