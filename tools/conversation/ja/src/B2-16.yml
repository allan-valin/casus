id: B2-16
protagonist: m
title: ["Asking for leave", "Pedir folga"]
situation: ["Your mother turns sixty in March. You want a week of paid leave to fly to Brazil — but nobody in the department takes more than two days.", "Sua mãe faz sessenta anos em março. Você quer uma semana de férias para ir ao Brasil — mas ninguém no departamento tira mais de dois dias."]
learn: []
culture: Unused leave
items:
  - [kyuuka, "休暇[きゅうか]", "leave, holiday", "férias, folga"]
  - [shinsei, "申請[しんせい]", "application (form)", "requerimento, pedido"]
  - [yoroshii-deshou-ka, "〜て も よろしい でしょう か", "may I…? (very polite)", "eu poderia…? (muito educado)"]
  - [itadakemasu-deshou-ka, "いただけない でしょう か", "could you possibly…?", "o senhor poderia…?"]
  - [kanreki, "還暦[かんれき]", "60th birthday", "60 anos (aniversário)", {rare: true}]
  - [isshuukan, "一週間[いっしゅうかん]", "one week", "uma semana"]
  - [hikitsugi, "引[ひ]き継[つ]ぎ", "handover (of work)", "passagem de trabalho"]
  - [meiwaku, "迷惑[めいわく]", "trouble, inconvenience (to others)", "incômodo, transtorno (aos outros)"]
  - [eikyou, "影響[えいきょう]", "effect, impact", "impacto"]
  - [kenri-desu-kara, "権利[けんり] です から", "since it's your right", "já que é seu direito"]
dialogue:
  - [protagonist, "部長[ぶちょう]、 少[すこ]し よろしい でしょう か。", "Sir, do you have a moment?", "Chefe, o senhor tem um minuto?"]
  - [buchou, "どうぞ。", "Go ahead.", "Pode falar."]
  - [protagonist, "三月[さんがつ] に 母[はは] が 還暦[かんれき] を 迎[むか]えます。 一週間[いっしゅうかん]、 有給[ゆうきゅう] を いただいて も よろしい でしょう か。", "My mother turns sixty in March. May I take a week of paid leave?", "Minha mãe faz sessenta anos em março. Eu poderia tirar uma semana de férias?"]
  - [buchou, "一週間[いっしゅうかん] か。 仕事[しごと] へ の 影響[えいきょう] は？", "A week, huh. What about the effect on work?", "Uma semana, é? E o impacto no trabalho?"]
  - [protagonist, "引[ひ]き継[つ]ぎ は 前[まえ] の 週[しゅう] に 済[す]ませます。 皆[みな]さん に ご迷惑[めいわく] を かけない ように します。", "I'll finish the handover the week before. I'll make sure not to cause anyone trouble.", "Faço a passagem de trabalho na semana anterior. Vou cuidar para não causar transtorno a ninguém."]
  - [buchou, "いい よ。 有給[ゆうきゅう] は 権利[けんり] です から。 申請[しんせい] を 出[だ]して ください。", "Fine. Paid leave is your right. Submit the application.", "Pode ir. Férias são um direito seu. Faça o requerimento."]
  - [protagonist, "ありがとう ございます。 遠慮[えんりょ] して いました。", "Thank you. I'd been holding back.", "Obrigado. Eu estava sem jeito de pedir."]
  - [buchou, "みんな もっと 休暇[きゅうか] を 取[と]る べき だ よ。 お母[かあ]さん に よろしく。", "Everyone should take more leave. My regards to your mother.", "Todo mundo devia tirar mais férias. Mande lembranças à sua mãe."]
teach:
  - ask: ["Interrupt politely: do you have a moment?", "Interrompa com educação: o senhor tem um minuto?", "少[すこ]し よろしい でしょう か。", yoroshii-deshou-ka]
  - ask: ["Say: leave, holiday.", "Diga: férias, folga.", "休暇[きゅうか]", kyuuka]
  - ask: ["Say: one week.", "Diga: uma semana.", "一週間[いっしゅうかん]", isshuukan]
  - ask: ["Say: a sixtieth birthday.", "Diga: aniversário de sessenta anos.", "還暦[かんれき]", kanreki]
  - note: ["The most polite way to ask permission: «〜て も よろしい でしょう か» — «いただいて も よろしい でしょう か», might I receive…? Or ask them to do it: «〜て いただけない でしょう か». Both soften the request with a question about possibility.", "O jeito mais educado de pedir licença: «〜て も よろしい でしょう か» — «いただいて も よろしい でしょう か», eu poderia receber…? Ou pedir que a pessoa faça: «〜て いただけない でしょう か». Os dois suavizam o pedido com uma pergunta sobre a possibilidade."]
  - ask: ["Say the pattern: may I…? — very polite.", "Diga o padrão: eu poderia…? — muito educado.", "〜て も よろしい でしょう か", yoroshii-deshou-ka]
  - ask: ["Say the pattern: could you possibly…?", "Diga o padrão: o senhor poderia…?", "いただけない でしょう か", itadakemasu-deshou-ka]
  - ask: ["Say: the handover of work.", "Diga: a passagem de trabalho.", "引[ひ]き継[つ]ぎ", hikitsugi]
  - ask: ["Say: trouble to others.", "Diga: transtorno aos outros.", "迷惑[めいわく]", meiwaku]
  - ask: ["Say: impact.", "Diga: impacto.", "影響[えいきょう]", eikyou]
  - ask: ["Say: an application form.", "Diga: um requerimento.", "申請[しんせい]", shinsei]
  - ask: ["Repeat what he said: since it's your right.", "Repita o que ele disse: já que é seu direito.", "権利[けんり] です から", kenri-desu-kara]
  - note: ["People hold back from taking leave, «遠慮[えんりょ]», for fear of «迷惑[めいわく]» to colleagues. Asking well: choose a calm moment, give the reason briefly, show the handover plan, then submit the form. «還暦[かんれき]», the 60th birthday, is celebrated — traditionally with something red.", "As pessoas se seguram para tirar férias, «遠慮[えんりょ]», com medo de causar «迷惑[めいわく]» aos colegas. Pedir bem: escolha um momento tranquilo, dê o motivo em poucas palavras, mostre o plano de passagem de trabalho e então entregue o requerimento. O «還暦[かんれき]», os 60 anos, é comemorado — tradicionalmente com algo vermelho."]
  - pt_only: "Pela CLT ninguém precisa pedir desculpas por tirar férias. No Japão o direito existe igual; o que pesa é o «迷惑[めいわく]» — por isso a passagem de trabalho bem feita abre a porta."
