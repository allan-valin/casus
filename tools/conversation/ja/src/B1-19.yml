id: B1-19
protagonist: m
title: [Plans that changed, Planos que mudaram]
situation: ["September. You and Yui planned a weekend in Kyoto. A typhoon is coming, and the trains may stop.", "Setembro. Você e a Yui planejaram um fim de semana em Kyoto. Um tufão está chegando, e os trens podem parar."]
learn: []
culture: Typhoon season
items:
  - [taifuu, "台風[たいふう]", "typhoon", "tufão"]
  - [chuushi, "中止[ちゅうし]", "cancellation, called off", "cancelamento"]
  - [yotei, "予定[よてい]", "plan, schedule", "plano, programação"]
  - [enki, "延期[えんき]", "postponement", "adiamento"]
  - [you-to-omotte-ita, "〜よう と 思[おも]って いた", "I was going to…, I'd planned to…", "eu pretendia…, ia…"]
  - [ikou-to-omotte-ita, "行[い]こう と 思[おも]って いた", "I was planning to go", "eu ia, pretendia ir"]
  - [unkyuu, "運休[うんきゅう]", "(train) service suspended", "serviço suspenso", {rare: true}]
  - [kyouto, "京都[きょうと]", "Kyoto", "Kyoto"]
  - [zannen, "残念[ざんねん]", "what a pity", "que pena"]
  - [anzen-daiichi, "安全[あんぜん] 第一[だいいち]", "safety first", "segurança em primeiro lugar"]
  - [kyanseru, "キャンセル", "cancel (a booking)", "cancelar (reserva)"]
dialogue:
  - [yui, "ニュース 見[み]た？ 台風[たいふう] が 来[く]る みたい。", "Did you see the news? Looks like a typhoon is coming.", "Viu o noticiário? Parece que vem um tufão."]
  - [protagonist, "え、 週末[しゅうまつ] は 京都[きょうと] に 行[い]こう と 思[おも]って いた のに。", "What, and I was planning to go to Kyoto at the weekend.", "Ah, e eu que ia para Kyoto no fim de semana."]
  - [yui, "新幹線[しんかんせん] が 運休[うんきゅう] に なる かも しれない。", "The shinkansen might be suspended.", "O trem-bala pode ser suspenso."]
  - [protagonist, "残念[ざんねん]… 旅行[りょこう] は 中止[ちゅうし]？", "What a pity… Is the trip off?", "Que pena… A viagem está cancelada?"]
  - [yui, "中止[ちゅうし] じゃ なくて、 延期[えんき] に しよう。 安全[あんぜん] 第一[だいいち]。", "Not cancelled — let's postpone it. Safety first.", "Cancelada não — vamos adiar. Segurança em primeiro lugar."]
  - [protagonist, "そう だ ね。 ホテル を キャンセル する。", "Right. I'll cancel the hotel.", "Verdade. Vou cancelar o hotel."]
  - [yui, "週末[しゅうまつ] は 家[いえ] で 映画[えいが] を 見[み]よう。 水[みず] と 食[た]べ物[もの] も 買[か]って おこう。", "Let's watch films at home this weekend. And buy water and food in advance.", "No fim de semana vamos ver filme em casa. E comprar água e comida antes."]
  - [protagonist, "新[あたら]しい 予定[よてい] も 悪[わる]く ない ね。", "The new plan isn't bad either.", "O plano novo também não é ruim."]
teach:
  - ask: ["Say: a typhoon.", "Diga: um tufão.", "台風[たいふう]", taifuu]
  - ask: ["Say: a plan.", "Diga: um plano.", "予定[よてい]", yotei]
  - note: ["What you were going to do: the volitional plus «と 思[おも]って いた» — «行[い]こう と 思[おも]って いた», I was planning to go. Often followed by «のに» or «けど», because something changed.", "O que você ia fazer: o volitivo mais «と 思[おも]って いた» — «行[い]こう と 思[おも]って いた», eu pretendia ir. Muitas vezes vem com «のに» ou «けど», porque algo mudou."]
  - ask: ["Say the pattern: I was going to…", "Diga o padrão: eu pretendia…", "〜よう と 思[おも]って いた", you-to-omotte-ita]
  - build: [ikou-to-omotte-ita, ["思[おも]って いた", "と 思[おも]って いた", "行[い]こう と 思[おも]って いた"]]
  - ask: ["Say: I was planning to go.", "Diga: eu pretendia ir.", "行[い]こう と 思[おも]って いた。", ikou-to-omotte-ita]
  - ask: ["Say: Kyoto.", "Diga: Kyoto.", "京都[きょうと]", kyouto]
  - ask: ["Say: service suspended.", "Diga: serviço suspenso.", "運休[うんきゅう]", unkyuu]
  - ask: ["Say: what a pity.", "Diga: que pena.", "残念[ざんねん]", zannen]
  - ask: ["Say: called off.", "Diga: cancelamento.", "中止[ちゅうし]", chuushi]
  - ask: ["Say: postponement.", "Diga: adiamento.", "延期[えんき]", enki]
  - ask: ["Say: safety first.", "Diga: segurança em primeiro lugar.", "安全[あんぜん] 第一[だいいち]", anzen-daiichi]
  - ask: ["Say: I'll cancel the hotel.", "Diga: vou cancelar o hotel.", "ホテル を キャンセル する。", kyanseru]
  - note: ["Typhoon season runs from about July to October, peaking in August and September. Railways announce suspensions, «計画[けいかく] 運休[うんきゅう]», a day ahead; schools close and shops board up. Stock water and food, charge your phone, stay in.", "A temporada de tufões vai mais ou menos de julho a outubro, com pico em agosto e setembro. As ferrovias anunciam suspensões, «計画[けいかく] 運休[うんきゅう]», com um dia de antecedência; escolas fecham e lojas se protegem. Tenha água e comida, carregue o celular, fique em casa."]
  - pt_only: "O Brasil quase não tem tufão, mas tem temporal de verão. No Japão o tufão tem nome, número e previsão de rota — e o país se organiza com antecedência."
