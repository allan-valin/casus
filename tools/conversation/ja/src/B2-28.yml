id: B2-28
protagonist: m
title: ["The year-end party", "A festa de fim de ano"]
situation: ["The department's year-end party. As the new team lead you give a short speech; Takahashi-buchō closes with the one-clap ending.", "A festa de fim de ano do departamento. Como novo líder de equipe, você faz um discurso curto; o chefe Takahashi fecha com a palma única."]
learn: []
culture: The one-clap close
items:
  - [aisatsu, "挨拶[あいさつ]", "speech, greeting", "discurso, cumprimento"]
  - [ippon-jime, "一本締[いっぽんじ]め", "one-clap ending", "palma única de encerramento", {rare: true}]
  - [kotoshi-ichinen, "今年[ことし] 一年[いちねん]", "this whole year", "este ano inteiro"]
  - [osewa-ni-narimashita-review, "大変[たいへん] お世話[せわ] に なりました", "thank you so much for everything", "muito obrigado por tudo"]
  - [hito-koto, "一言[ひとこと]", "a few words", "umas palavras"]
  - [kansha, "感謝[かんしゃ]", "gratitude", "gratidão"]
  - [ganbarimashou, "頑張[がんば]りましょう", "let's do our best", "vamos dar o nosso melhor"]
  - [yoi-otoshi-wo, "良[よ]い お年[とし] を", "have a good New Year (said before)", "bom ano-novo (dito antes)"]
  - [go-shouchou, "ご唱和[しょうわ] ください", "please join in", "acompanhem, por favor", {rare: true}]
  - [otsukaresama-deshita, "お疲[つか]れさま でした", "thank you for your hard work", "obrigado pelo trabalho"]
dialogue:
  - [buchou, "では、 新[あたら]しい 主任[しゅにん] から 一言[ひとこと] お願[ねが]い します。", "Now, a few words from our new team lead.", "Agora, umas palavras do nosso novo líder de equipe."]
  - [protagonist, "皆[みな]さん、 今年[ことし] 一年[いちねん]、 大変[たいへん] お世話[せわ] に なりました。", "Everyone, thank you so much for everything this year.", "Pessoal, muito obrigado por tudo neste ano."]
  - [protagonist, "一年[いちねん] 前[まえ] は 日本語[にほんご] も 話[はな]せません でした。 皆[みな]さん に 心[こころ] から 感謝[かんしゃ] して います。", "A year ago I couldn't even speak Japanese. I'm grateful to all of you from my heart.", "Há um ano eu nem falava japonês. Agradeço a todos de coração."]
  - [protagonist, "来年[らいねん] も 一緒[いっしょ] に 頑張[がんば]りましょう。 乾杯[かんぱい]！", "Let's do our best together next year too. Cheers!", "Ano que vem, vamos dar o nosso melhor juntos de novo. Saúde!"]
  - [sato, "乾杯[かんぱい]！ いい 挨拶[あいさつ] でした よ。", "Cheers! That was a good speech.", "Saúde! Foi um bom discurso."]
  - [buchou, "それでは、 一本締[いっぽんじ]め で 締[し]めたい と 思[おも]います。 ご唱和[しょうわ] ください。 いよーっ！", "Then let's close with the one-clap ending. Please join in. Iyō!", "Então vamos encerrar com a palma única. Acompanhem, por favor. Iyō!"]
  - [kenta, "お疲[つか]れさま でした！", "Thank you for your hard work!", "Obrigado pelo trabalho!"]
  - [protagonist, "お疲[つか]れさま でした！ 皆[みな]さん、 良[よ]い お年[とし] を！", "Thank you for your hard work! Everyone, have a good New Year!", "Obrigado pelo trabalho! Pessoal, um bom ano-novo!"]
teach:
  - ask: ["Say: a speech, a greeting.", "Diga: um discurso.", "挨拶[あいさつ]", aisatsu]
  - ask: ["Say: a few words.", "Diga: umas palavras.", "一言[ひとこと]", hito-koto]
  - ask: ["Say: this whole year.", "Diga: este ano inteiro.", "今年[ことし] 一年[いちねん]", kotoshi-ichinen]
  - ask: ["Open the speech: thank you so much for everything.", "Abra o discurso: muito obrigado por tudo.", "大変[たいへん] お世話[せわ] に なりました。", osewa-ni-narimashita-review]
  - ask: ["Say: gratitude.", "Diga: gratidão.", "感謝[かんしゃ]", kansha]
  - ask: ["Call them on: let's do our best.", "Anime todos: vamos dar o nosso melhor.", "頑張[がんば]りましょう。", ganbarimashou]
  - ask: ["Say: the one-clap ending.", "Diga: a palma única.", "一本締[いっぽんじ]め", ippon-jime]
  - ask: ["Say: please join in.", "Diga: acompanhem, por favor.", "ご唱和[しょうわ] ください", go-shouchou]
  - ask: ["Say: thank you for your hard work — at the end.", "Diga: obrigado pelo trabalho — no fim.", "お疲[つか]れさま でした！", otsukaresama-deshita]
  - ask: ["Wish them a good New Year — before it comes.", "Deseje um bom ano-novo — antes que chegue.", "良[よ]い お年[とし] を！", yoi-otoshi-wo]
  - note: ["Ceremonies run on formulas: thank for the year with «お世話[せわ] に なりました», look ahead with «来年[らいねん] も よろしく», then «乾杯[かんぱい]». At the end, «一本締[いっぽんじ]め»: the leader calls «いよーっ！» and everyone claps once together. Before New Year say «良[よ]い お年[とし] を»; after it, «明[あ]けまして おめでとう».", "Cerimônias funcionam com fórmulas: agradecer o ano com «お世話[せわ] に なりました», olhar para frente com «来年[らいねん] も よろしく», depois «乾杯[かんぱい]». No fim, o «一本締[いっぽんじ]め»: quem conduz grita «いよーっ！» e todos batem uma palma juntos. Antes do ano-novo se diz «良[よ]い お年[とし] を»; depois, «明[あ]けまして おめでとう»."]
  - pt_only: "No Brasil a confraternização termina com amigo-secreto e abraço. No Japão termina com uma palma só, todos juntos — curta, seca e estranhamente emocionante."
