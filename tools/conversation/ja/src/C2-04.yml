id: C2-04
protagonist: m
title: ["Negotiating", "Negociar"]
situation: ["Another company has offered you a job. You talk to Takahashi-buchō about your salary — carefully, so it doesn't sound like a threat.", "Outra empresa ofereceu um emprego a você. Você conversa com o chefe Takahashi sobre o salário — com cuidado, para não soar como ameaça."]
learn: []
culture: —
items:
  - [koushou, "交渉[こうしょう]", "negotiation", "negociação"]
  - [jouho, "譲歩[じょうほ]", "concession", "concessão"]
  - [dakyou, "妥協[だきょう]", "compromise", "acordo, meio-termo"]
  - [ten-shoku, "転職[てんしょく]", "changing jobs", "mudar de emprego"]
  - [sasoi, "お誘[さそ]い", "invitation, offer", "convite, oferta"]
  - [kentou-shite-itadakemasen-ka, "ご検討[けんとう] いただけません でしょう か", "would you kindly consider", "o senhor poderia considerar"]
  - [hyouka, "評価[ひょうか]", "evaluation, appraisal", "avaliação"]
  - [kyuuyo, "給与[きゅうよ]", "salary (formal)", "remuneração"]
  - [tsuzuketai, "この 会社[かいしゃ] で 働[はたら]き 続[つづ]けたい", "I want to keep working here", "quero continuar trabalhando aqui"]
  - [chuukan, "間[あいだ] を 取[と]る", "meet in the middle", "chegar a um meio-termo"]
dialogue:
  - [protagonist, "部長[ぶちょう]、 少[すこ]し ご相談[そうだん] が ございます。 実[じつ] は、 他社[たしゃ] から お誘[さそ]い を いただきました。", "Sir, I have something to discuss. Actually, I've received an offer from another company.", "Chefe, preciso conversar com o senhor. Na verdade, recebi uma proposta de outra empresa."]
  - [buchou, "そう か。 転職[てんしょく] を 考[かんが]えて いる の か。", "I see. Are you thinking of changing jobs?", "Entendi. Você está pensando em mudar de emprego?"]
  - [protagonist, "いいえ、 私[わたし] は この 会社[かいしゃ] で 働[はたら]き 続[つづ]けたい と 思[おも]って おります。 ただ、 今[いま] の 仕事[しごと] の 範囲[はんい] に 見合[みあ]う 給与[きゅうよ] を ご検討[けんとう] いただけません でしょう か。", "No, I'd like to keep working at this company. I only ask whether you might consider a salary that matches my current responsibilities.", "Não, quero continuar trabalhando nesta empresa. Só gostaria de pedir que o senhor considerasse uma remuneração à altura das minhas responsabilidades atuais."]
  - [buchou, "君[きみ] の 評価[ひょうか] は 高[たか]い。 ただ、 すぐ に 全額[ぜんがく] は 難[むずか]しい。", "Your evaluations are high. But the full amount straight away is difficult.", "A sua avaliação é ótima. Mas o valor todo de uma vez é difícil."]
  - [protagonist, "では、 半分[はんぶん] を 今年[ことし]、 残[のこ]り を 来年[らいねん] の 評価[ひょうか] で、 と いう 形[かたち] は いかが でしょう か。", "Then how about half this year, and the rest based on next year's evaluation?", "Então, que tal metade este ano e o resto conforme a avaliação do ano que vem?"]
  - [buchou, "間[あいだ] を 取[と]る わけ だ な。 その 妥協[だきょう] 案[あん] なら、 人事[じんじ] と 交渉[こうしょう] して みよう。", "So we meet in the middle. With that compromise, I'll try negotiating with HR.", "Chegamos a um meio-termo, então. Com essa proposta de acordo, vou negociar com o RH."]
  - [protagonist, "ご配慮[はいりょ] いただき、 ありがとう ございます。 譲歩[じょうほ] して いただいた 分[ぶん]、 成果[せいか] で お返[かえ]し します。", "Thank you for your consideration. I'll repay your concession with results.", "Agradeço a consideração. Vou retribuir a concessão com resultados."]
  - [buchou, "期待[きたい] して いる よ。", "I'm counting on it.", "Conto com isso."]
teach:
  - ask: ["Say: negotiation.", "Diga: negociação.", "交渉[こうしょう]", koushou]
  - ask: ["Say: changing jobs.", "Diga: mudar de emprego.", "転職[てんしょく]", ten-shoku]
  - ask: ["Say: an offer, an invitation.", "Diga: uma proposta.", "お誘[さそ]い", sasoi]
  - ask: ["Say: salary — formally.", "Diga: remuneração — formal.", "給与[きゅうよ]", kyuuyo]
  - ask: ["Say: appraisal.", "Diga: avaliação.", "評価[ひょうか]", hyouka]
  - ask: ["Make clear: I want to keep working here.", "Deixe claro: quero continuar trabalhando aqui.", "この 会社[かいしゃ] で 働[はたら]き 続[つづ]けたい", tsuzuketai]
  - note: ["A request to a superior climbs the politeness ladder: «〜て ください» → «〜て いただけますか» → «〜て いただけません でしょう か», the most cautious — a negative question that leaves room to refuse. Proposals get softened too: «〜と いう 形[かたち] は いかが でしょう か», how about something like…?", "Um pedido a um superior sobe a escada da cortesia: «〜て ください» → «〜て いただけますか» → «〜て いただけません でしょう か», o mais cauteloso — uma pergunta negativa que deixa espaço para recusar. As propostas também se suavizam: «〜と いう 形[かたち] は いかが でしょう か», que tal algo como…?"]
  - ask: ["Ask: would you kindly consider…", "Peça: o senhor poderia considerar…", "ご検討[けんとう] いただけません でしょう か", kentou-shite-itadakemasen-ka]
  - ask: ["Say: meet in the middle.", "Diga: chegar a um meio-termo.", "間[あいだ] を 取[と]る", chuukan]
  - ask: ["Say: a compromise.", "Diga: um acordo, meio-termo.", "妥協[だきょう]", dakyou]
  - ask: ["Say: a concession.", "Diga: uma concessão.", "譲歩[じょうほ]", jouho]
  - note: ["Salary talks are rare and delicate in Japanese companies. A job offer from elsewhere is mentioned as «ご相談[そうだん]», not as leverage; you state loyalty first, ask with «いただけません でしょう か», propose a middle way, and promise results. Pushing hard can backfire.", "Conversas sobre salário são raras e delicadas nas empresas japonesas. Uma proposta de fora é mencionada como «ご相談[そうだん]», não como pressão; você declara lealdade primeiro, pede com «いただけません でしょう か», propõe um meio-termo e promete resultados. Pressionar demais pode sair pela culatra."]
  - pt_only: "No Brasil, mostrar a proposta de outra empresa é jogo aberto. No Japão, é preciso embrulhar em lealdade — a negociação existe, só que de luvas."
