id: C1-29
protagonist: f
title: ["The exam", "O exame"]
situation: ["Two months after the December JLPT, the results are online. You check N1 with Shota and Ishida-sensei's evening class.", "Dois meses depois do JLPT de dezembro, os resultados saem na internet. Você confere o N1 com o Shota e a turma noturna do professor Ishida."]
learn: []
culture: —
items:
  - [nouryoku-shiken, "日本語[にほんご] 能力[のうりょく] 試験[しけん]", "Japanese-Language Proficiency Test (JLPT)", "Exame de Proficiência em Língua Japonesa (JLPT)", {rare: true}]
  - [goukaku, "合格[ごうかく]", "passing (an exam)", "aprovação"]
  - [juken, "受験[じゅけん]", "taking an exam", "fazer a prova"]
  - [okage-de, "〜おかげ で", "thanks to", "graças a"]
  - [sensei-no-okage, "先生[せんせい] の おかげ で", "thanks to the teacher", "graças ao professor"]
  - [fugoukaku, "不合格[ふごうかく]", "failing", "reprovação"]
  - [tokuten, "得点[とくてん]", "score", "pontuação"]
  - [dokkai, "読解[どっかい]", "reading comprehension", "compreensão de leitura"]
  - [choukai, "聴解[ちょうかい]", "listening comprehension", "compreensão auditiva"]
  - [doryoku, "努力[どりょく]", "effort", "esforço"]
dialogue:
  - [shota, "結果[けっか]、 出[で]た？ 早[はや]く 見[み]よう。", "Are the results out? Let's look, quick.", "Saiu o resultado? Vamos ver, rápido."]
  - [protagonist, "…合格[ごうかく]！ N1 に 合格[ごうかく] した！", "…Passed! I passed N1!", "…Passei! Passei no N1!"]
  - [shota, "おめでとう！ 得点[とくてん] は？", "Congratulations! What's the score?", "Parabéns! Qual a pontuação?"]
  - [protagonist, "読解[どっかい] は ぎりぎり。 聴解[ちょうかい] は 高[たか]かった。 太鼓[たいこ] と カラオケ の おかげ かな。", "Reading just made it. Listening was high. Thanks to taiko and karaoke, maybe.", "Leitura foi no limite. Auditiva foi alta. Graças ao taikô e ao karaokê, talvez."]
  - [kouza-sensei, "おめでとう ございます。 三年[さんねん] 前[まえ] は ひらがな も 書[か]けなかった のに。", "Congratulations. Three years ago you couldn't even write hiragana.", "Parabéns. Três anos atrás você nem escrevia hiragana."]
  - [protagonist, "先生[せんせい] の 作文[さくぶん] の 課題[かだい] の おかげ で、 読解[どっかい] も 何[なん] とか なりました。", "Thanks to your essay assignments, I managed the reading too.", "Graças às suas redações, consegui passar na leitura também."]
  - [kouza-sensei, "いえ、 あなた の 努力[どりょく] です よ。 受験[じゅけん] した クラス の 皆[みな]さん は？", "No, it's your own effort. And the others in the class who took it?", "Não, foi o seu esforço. E os outros da turma que fizeram a prova?"]
  - [protagonist, "ルーカス は 不合格[ふごうかく] でした が、 来年[らいねん] また 受験[じゅけん] する そう です。", "Lucas didn't pass, but he says he'll take it again next year.", "O Lucas não passou, mas disse que vai fazer de novo no ano que vem."]
teach:
  - ask: ["Say: the JLPT.", "Diga: o JLPT.", "日本語[にほんご] 能力[のうりょく] 試験[しけん]", nouryoku-shiken]
  - ask: ["Say: taking an exam.", "Diga: fazer a prova.", "受験[じゅけん]", juken]
  - ask: ["Shout it: I passed!", "Grite: passei!", "合格[ごうかく]！", goukaku]
  - ask: ["Say: failing.", "Diga: reprovação.", "不合格[ふごうかく]", fugoukaku]
  - ask: ["Say: the score.", "Diga: a pontuação.", "得点[とくてん]", tokuten]
  - ask: ["Say: reading comprehension.", "Diga: compreensão de leitura.", "読解[どっかい]", dokkai]
  - ask: ["Say: listening comprehension.", "Diga: compreensão auditiva.", "聴解[ちょうかい]", choukai]
  - note: ["«〜おかげ で» is thanks to — for a good result, with gratitude: «先生[せんせい] の おかげ で 合格[ごうかく] した», I passed thanks to the teacher. For a bad result use «〜せい で», because of (blame).", "«〜おかげ で» é graças a — para um resultado bom, com gratidão: «先生[せんせい] の おかげ で 合格[ごうかく] した», passei graças ao professor. Para um resultado ruim usa-se «〜せい で», por culpa de."]
  - ask: ["Say the pattern: thanks to.", "Diga o padrão: graças a.", "〜おかげ で", okage-de]
  - ask: ["Say: thanks to the teacher.", "Diga: graças ao professor.", "先生[せんせい] の おかげ で", sensei-no-okage]
  - ask: ["Say: effort.", "Diga: esforço.", "努力[どりょく]", doryoku]
  - note: ["The JLPT is held in July and December, with five levels from N5 to N1. N1 — reading newspapers and following lectures — opens doors: points for some visas, professional jobs, university entry. Many people need several tries.", "O JLPT é aplicado em julho e dezembro, com cinco níveis, do N5 ao N1. O N1 — ler jornal e acompanhar palestras — abre portas: pontos para alguns vistos, empregos qualificados, entrada em universidades. Muita gente precisa de várias tentativas."]
  - pt_only: "O JLPT também é aplicado no Brasil, em várias capitais. Para quem começou do zero, como você, o N1 é como um diploma — e a festa é merecida."
