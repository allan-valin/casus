id: A1-30
protagonist: m
title: [Sport, Esporte]
situation: ["Sunday morning. Kenta plays futsal with Brazilian and Japanese workers from the factory and asks you to join. A look back at the whole of A1.", "Domingo de manhã. O Kenta joga futsal com trabalhadores brasileiros e japoneses da fábrica e chama você. Uma revisão de todo o A1."]
learn: []
culture: —
items:
  - [futtosaru, "フットサル", "futsal", "futsal", {rare: true}]
  - [shiai, "試合[しあい]", "match, game", "jogo, partida"]
  - [tanoshikatta, "楽[たの]しかった", "it was fun", "foi divertido"]
  - [kachimashita, "勝[か]ちました", "we won", "ganhamos"]
  - [makemashita, "負[ま]けました", "we lost", "perdemos"]
  - [chiimu, "チーム", "team", "time, equipe"]
  - [gooru, "ゴール", "goal", "gol", {rare: true}]
  - [mata-raishuu, "また 来週[らいしゅう]", "see you next week", "até semana que vem"]
  - [jouzu-ni-narimashita, "上手[じょうず] に なりました", "has got good (at it)", "ficou bom (nisso)"]
  - [nihongo, "日本語[にほんご]", "Japanese (language)", "japonês (a língua)"]
dialogue:
  - [kenta, "日曜日[にちようび]、 フットサル の 試合[しあい] が ある。 来[く]る？", "There's a futsal match on Sunday. Coming?", "Domingo tem jogo de futsal. Vem?"]
  - [protagonist, "うん、 行[い]く！ ブラジル人[じん] も いる？", "Yeah, I'll come! Are there Brazilians?", "Vou! Tem brasileiro?"]
  - [kenta, "半分[はんぶん] ブラジル人[じん]。 チーム の 中[なか] は ポルトガル語[ご] と 日本語[にほんご] だ よ。", "Half are Brazilian. In the team it's Portuguese and Japanese.", "Metade é brasileira. No time se fala português e japonês."]
  - [protagonist, "ゴール！ 見[み]た？", "Goal! Did you see?", "Gol! Viu?"]
  - [kenta, "すごい！ 勝[か]った よ！", "Amazing! We won!", "Demais! Ganhamos!"]
  - [protagonist, "楽[たの]しかった！ また 来週[らいしゅう]。", "That was fun! See you next week.", "Foi divertido! Até semana que vem."]
  - [kenta, "日本語[にほんご]、 本当[ほんとう] に 上手[じょうず] に なった ね。", "Your Japanese has really got good.", "Seu japonês melhorou muito mesmo."]
  - [protagonist, "まだ まだ だ よ。 でも、 ありがとう。", "Not yet. But thanks.", "Que nada, ainda falta. Mas obrigado."]
teach:
  - ask: ["Say: futsal.", "Diga: futsal.", "フットサル", futtosaru]
  - ask: ["Say: a match.", "Diga: um jogo.", "試合[しあい]", shiai]
  - ask: ["Say: the team.", "Diga: o time.", "チーム", chiimu]
  - ask: ["Shout it: goal!", "Grite: gol!", "ゴール！", gooru]
  - ask: ["Say: we won.", "Diga: ganhamos.", "勝[か]ちました。", kachimashita]
  - ask: ["Say: we lost.", "Diga: perdemos.", "負[ま]けました。", makemashita]
  - note: ["Past of an adjective: drop «い», add «かった»: «楽[たの]しい» → «楽[たの]しかった», it was fun. You met it in «おいしかった».", "Passado de adjetivo: tire o «い» e acrescente «かった»: «楽[たの]しい» → «楽[たの]しかった», foi divertido. Você já viu em «おいしかった»."]
  - ask: ["Say: it was fun.", "Diga: foi divertido.", "楽[たの]しかった。", tanoshikatta]
  - ask: ["Say: see you next week.", "Diga: até semana que vem.", "また 来週[らいしゅう]。", mata-raishuu]
  - ask: ["Say: Japanese, the language.", "Diga: japonês, a língua.", "日本語[にほんご]", nihongo]
  - ask: ["Say it politely: the Japanese has got good.", "Diga, de forma educada: o japonês melhorou.", "日本語[にほんご] が 上手[じょうず] に なりました。", jouzu-ni-narimashita]
  - note: ["That is the end of A1. You can greet, introduce yourself, buy, ask the time and the way, invite, refuse softly, apologise at the right depth, and switch to plain talk with a friend. In A2 you settle in: the «て» form, rules, plans and stories.", "Fim do A1. Você sabe cumprimentar, se apresentar, comprar, perguntar a hora e o caminho, convidar, recusar com jeito, pedir desculpas na medida certa e passar para a fala informal com um amigo. No A2 você se estabelece: a forma «て», regras, planos e histórias."]
  - pt_only: "Futebol é a ponte mais fácil: em Hamamatsu, times de fábrica misturam brasileiros e japoneses, e o gol se comemora igual nas duas línguas."
