id: A1-29
protagonist: f
title: [Sorry, Desculpe]
situation: ["You translated a delivery date wrong for a Brazilian worker: Thursday instead of Tuesday. Chief Sato calls you over.", "Você traduziu errado uma data de entrega para um trabalhador brasileiro: quinta em vez de terça. A chefe Sato chama você."]
learn: [ja-wbja475-8]
culture: How deep an apology goes
items:
  - [moushiwake, "申[もう]し訳[わけ] ありません", "I'm terribly sorry (formal)", "peço mil desculpas (formal)"]
  - [machigaemashita, "間違[まちが]えました", "I made a mistake", "eu errei"]
  - [machigai, "間違[まちが]い", "mistake", "erro"]
  - [kayoubi, "火曜日[かようび]", "Tuesday", "terça-feira"]
  - [gomen, "ごめん", "sorry (casual)", "foi mal (informal)"]
  - [gomennasai, "ごめんなさい", "I'm sorry", "desculpa"]
  - [tsugi-kara, "次[つぎ] から", "from next time", "da próxima vez"]
  - [kakunin, "確認[かくにん] します", "I'll check, confirm", "vou conferir"]
  - [mou-ichido, "もう 一度[いちど]", "once more", "mais uma vez"]
  - [kinishinai-de-kudasai, "気[き] に しないで ください", "don't worry about it", "não se preocupe"]
dialogue:
  - [sato, "木曜日[もくようび] じゃ なくて、 火曜日[かようび] です よ。", "Not Thursday — Tuesday.", "Não é quinta — é terça."]
  - [protagonist, "あ… 間違[まちが]えました。 申[もう]し訳[わけ] ありません。", "Oh… I made a mistake. I'm terribly sorry.", "Ah… eu errei. Peço mil desculpas."]
  - [sato, "大丈夫[だいじょうぶ]。 もう 一度[いちど]、 説明[せつめい] して ください。", "It's alright. Please explain it to him once more.", "Tudo bem. Explique para ele mais uma vez."]
  - [protagonist, "はい。 次[つぎ] から 確認[かくにん] します。", "Yes. From now on I'll double-check.", "Sim. Da próxima vez vou conferir."]
  - [sato, "間違[まちが]い は 誰[だれ] でも あります。", "Everyone makes mistakes.", "Todo mundo erra."]
  - [protagonist, "本当[ほんとう] に 申[もう]し訳[わけ] ありません でした。", "I'm truly sorry.", "De verdade, me desculpe."]
  - [sato, "もう いい です よ。 気[き] に しないで ください。", "That's enough. Don't worry about it.", "Já está bom. Não se preocupe."]
  - [kenta, "大丈夫[だいじょうぶ]？ 課長[かちょう]、 優[やさ]しい でしょ。", "You okay? The chief is kind, isn't she?", "Tudo bem? A chefe é gente boa, né?"]
  - [protagonist, "うん。 ごめん、 ちょっと 疲[つか]れた。", "Yeah. Sorry, I'm a bit tired.", "Aham. Foi mal, estou meio cansada."]
teach:
  - note: ["Japanese has a ladder of apologies. «ごめん» — casual, to a friend. «ごめんなさい» — sorry, to family or friends. «すみません» — excuse me, sorry, to anyone. «申[もう]し訳[わけ] ありません» — at work, to the boss or a customer: literally, there is no excuse.", "O japonês tem uma escada de desculpas. «ごめん» — informal, para um amigo. «ごめんなさい» — desculpa, para família ou amigos. «すみません» — com licença, desculpe, para qualquer pessoa. «申[もう]し訳[わけ] ありません» — no trabalho, para o chefe ou um cliente: ao pé da letra, não há desculpa."]
  - build: [moushiwake, ["ありません", "申[もう]し訳[わけ] ありません"]]
  - ask: ["Apologise to the chief.", "Peça desculpas à chefe.", "申[もう]し訳[わけ] ありません。", moushiwake]
  - ask: ["Say: I made a mistake.", "Diga: eu errei.", "間違[まちが]えました。", machigaemashita]
  - ask: ["Say: a mistake.", "Diga: um erro.", "間違[まちが]い", machigai]
  - ask: ["Say: Tuesday.", "Diga: terça-feira.", "火曜日[かようび]", kayoubi]
  - ask: ["Say: from next time I'll check.", "Diga: da próxima vez vou conferir.", "次[つぎ] から 確認[かくにん] します。", tsugi-kara, kakunin]
  - ask: ["Say: once more.", "Diga: mais uma vez.", "もう 一度[いちど]", mou-ichido]
  - ask: ["Tell someone: don't worry about it.", "Diga a alguém: não se preocupe.", "気[き] に しないで ください。", kinishinai-de-kudasai]
  - ask: ["To your mother: I'm sorry.", "Para a sua mãe: desculpa.", "ごめんなさい。", gomennasai]
  - ask: ["To Kenta, casually: sorry.", "Para o Kenta, informal: foi mal.", "ごめん。", gomen]
  - note: ["A Japanese apology is not an admission of guilt in court; it repairs the relationship. Apologise first, explain later — or not at all — and say what you'll do next time. A bow goes with it.", "No Japão, pedir desculpas não é confessar culpa no tribunal; é consertar a relação. Primeiro peça desculpas, depois explique — ou nem explique — e diga o que vai fazer da próxima vez. Uma reverência acompanha."]
  - pt_only: "No Brasil a gente costuma explicar logo o motivo do erro. No Japão isso pode soar como desculpa esfarrapada: primeiro o «申[もう]し訳[わけ] ありません», a explicação só se perguntarem."
