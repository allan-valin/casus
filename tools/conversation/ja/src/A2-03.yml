id: A2-03
protagonist: f
title: [Water, A água]
situation: ["Mrs Suzuki sees you carrying bottles of water home, and explains the tap water — and the bath.", "A senhora Suzuki vê você carregando garrafas de água para casa, e explica a água da torneira — e o banho de ofurô."]
learn: []
culture: Tap water is safe
items:
  - [suidousui, "水道水[すいどうすい]", "tap water", "água da torneira", {rare: true}]
  - [nomemasu, "飲[の]めます", "can drink, is drinkable", "dá para beber"]
  - [ofuro, "お風呂[ふろ]", "bath", "banho de ofurô, banheira"]
  - [wakashimasu, "沸[わ]かします", "heat (the bath), boil", "esquento, fervo"]
  - [oyu, "お湯[ゆ]", "hot water", "água quente"]
  - [kedo, "〜けど", "but, though", "mas, só que"]
  - [anzen, "安全[あんぜん]", "safe", "seguro"]
  - [mottainai, "もったいない", "what a waste", "que desperdício"]
  - [hairu-mae, "入[はい]る 前[まえ] に", "before getting in", "antes de entrar"]
  - [araimasu, "洗[あら]います", "wash", "lavo"]
  - [kazoku-de, "家族[かぞく] で", "as a family", "em família"]
dialogue:
  - [suzuki, "まあ、 重[おも]い でしょう。 その 水[みず]、 買[か]いました か。", "Oh, that must be heavy. Did you buy that water?", "Nossa, deve estar pesado. Você comprou essa água?"]
  - [protagonist, "はい。 水道水[すいどうすい] は ちょっと 怖[こわ]い です。", "Yes. Tap water is a bit scary.", "Sim. Água da torneira me dá um pouco de medo."]
  - [suzuki, "日本[にほん] の 水道水[すいどうすい] は 飲[の]めます よ。 安全[あんぜん] です。", "Japanese tap water is drinkable. It's safe.", "A água da torneira no Japão dá para beber. É segura."]
  - [protagonist, "本当[ほんとう] です か。 もったいない！", "Really? What a waste!", "Sério? Que desperdício!"]
  - [suzuki, "お風呂[ふろ] は 毎日[まいにち] 沸[わ]かします か。", "Do you heat the bath every day?", "Você esquenta o ofurô todo dia?"]
  - [protagonist, "いいえ、 シャワー だけ です。 お風呂[ふろ] は 好[す]き です けど…", "No, just a shower. I like baths, but…", "Não, só chuveiro. Gosto de ofurô, mas…"]
  - [suzuki, "入[はい]る 前[まえ] に 体[からだ] を 洗[あら]います。 お湯[ゆ] は 家族[かぞく] で 使[つか]います。", "You wash before getting in. The hot water is shared by the family.", "Você se lava antes de entrar. A água quente é usada pela família toda."]
  - [protagonist, "だから お湯[ゆ] が きれい なんですね。", "So that's why the water stays clean.", "Por isso a água fica limpa."]
teach:
  - ask: ["Say: tap water.", "Diga: água da torneira.", "水道水[すいどうすい]", suidousui]
  - ask: ["Say: you can drink it.", "Diga: dá para beber.", "飲[の]めます。", nomemasu]
  - ask: ["Say: it's safe.", "Diga: é seguro.", "安全[あんぜん] です。", anzen]
  - ask: ["Say: what a waste!", "Diga: que desperdício!", "もったいない！", mottainai]
  - ask: ["Say: the bath.", "Diga: o ofurô.", "お風呂[ふろ]", ofuro]
  - ask: ["Say: hot water.", "Diga: água quente.", "お湯[ゆ]", oyu]
  - note: ["Japanese has two words for water: «水[みず]» cold, «お湯[ゆ]» hot. «沸[わ]かします» is heating it — the bath too: «お風呂[ふろ] を 沸[わ]かします».", "O japonês tem duas palavras para água: «水[みず]» fria, «お湯[ゆ]» quente. «沸[わ]かします» é esquentar — o ofurô também: «お風呂[ふろ] を 沸[わ]かします»."]
  - ask: ["Say: I heat the bath.", "Diga: esquento o ofurô.", "お風呂[ふろ] を 沸[わ]かします。", wakashimasu]
  - note: ["«けど» at the end of a clause is but, though: «好[す]き です けど…» — I like it, but… Left hanging, it softens: the other person understands the rest.", "«けど» no fim de uma oração quer dizer «mas», «só que»: «好[す]き です けど…» — gosto, mas… Deixado no ar, suaviza: o outro entende o resto."]
  - ask: ["Say the word: but.", "Diga a palavra: mas.", "〜けど", kedo]
  - ask: ["Say: I like baths, but…", "Diga: gosto de ofurô, mas…", "お風呂[ふろ] は 好[す]き です けど…", kedo]
  - build: [hairu-mae, ["前[まえ] に", "入[はい]る 前[まえ] に"]]
  - ask: ["Say: before getting in.", "Diga: antes de entrar.", "入[はい]る 前[まえ] に", hairu-mae]
  - ask: ["Say: I wash.", "Diga: eu lavo.", "洗[あら]います。", araimasu]
  - ask: ["Say: as a family.", "Diga: em família.", "家族[かぞく] で", kazoku-de]
  - note: ["The bath is for soaking, not for washing: you shower first on a stool beside it, then get in clean. The same hot water serves the whole family, so never pull the plug when you leave.", "A banheira é para relaxar, não para se lavar: você toma banho antes, num banquinho ao lado, e entra limpo. A mesma água quente serve a família toda, então nunca tire a tampa quando sair."]
  - pt_only: "No Brasil muita gente filtra ou compra água para beber. No Japão a água da torneira é tratada e segura — o galão é gasto à toa."
