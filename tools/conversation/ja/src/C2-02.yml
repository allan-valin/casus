id: C2-02
protagonist: m
title: ["Subtle irony", "Ironia fina"]
situation: ["Back from a meeting in Kyoto, you tell Takahashi-buchō how kind the client was: he praised your watch twice. The department head laughs.", "De volta de uma reunião em Kyoto, você conta ao chefe Takahashi como o cliente foi gentil: elogiou o seu relógio duas vezes. O chefe dá risada."]
learn: []
culture: —
items:
  - [kekkou-desu-review, "結構[けっこう] です", "fine / no thank you (ambiguous)", "está ótimo / não, obrigado (ambíguo)"]
  - [ii-gomibun, "いい ご身分[みぶん] です ね", "must be nice (ironic)", "que vida boa, hein (irônico)", {rare: true}]
  - [ii-tokei, "いい 時計[とけい] を して はります な", "what a nice watch you have (Kyoto: time to go)", "que relógio bonito (Kyoto: hora de ir)", {rare: true}]
  - [ura, "裏[うら] の 意味[いみ]", "hidden meaning", "sentido oculto"]
  - [toomawashi, "遠回[とおまわ]し", "roundabout (way of saying)", "indireto, com rodeios"]
  - [kyouto-ben, "京都[きょうと] 弁[べん]", "Kyoto dialect", "dialeto de Kyoto", {rare: true}]
  - [hometeru, "褒[ほ]めて いる よう で", "seeming to praise", "parecendo elogiar"]
  - [kidzuku, "気[き]付[づ]く", "notice, realise", "perceber"]
  - [bubuzuke, "ぶぶ漬[づ]け", "tea over rice (Kyoto: please leave)", "chá com arroz (Kyoto: hora de ir)", {rare: true}]
  - [kuchiguse, "口癖[くちぐせ]", "habitual phrase", "bordão"]
dialogue:
  - [protagonist, "京都[きょうと] の お客様[きゃくさま] は 親切[しんせつ] でした。「いい 時計[とけい] を して はります な」 と 二回[にかい] も 褒[ほ]めて くれました。", "The Kyoto client was kind. He praised me twice: “What a nice watch you have.”", "O cliente de Kyoto foi gentil. Elogiou duas vezes: «Que relógio bonito o senhor tem»."]
  - [buchou, "ははは。 それ は「もう 時間[じかん] です よ」 と いう 意味[いみ] だ よ。", "Ha ha. That means “it's time you left.”", "Rá. Isso quer dizer «já está na hora»."]
  - [protagonist, "え？ 褒[ほ]めて いる よう で、 帰[かえ]れ と？", "What? Seeming to praise, he meant go home?", "Quê? Parecendo elogiar, ele queria que eu fosse embora?"]
  - [buchou, "京都[きょうと] は 遠回[とおまわ]し な 言[い]い方[かた] で 有名[ゆうめい] だ。「ぶぶ漬[づ]け でも どうぞ」 も 同[おな]じ。", "Kyoto is famous for roundabout ways of speaking. “Have some tea over rice” is the same.", "Kyoto é famosa pelo jeito indireto. «Aceita um chá com arroz?» é a mesma coisa."]
  - [protagonist, "裏[うら] の 意味[いみ] に 全然[ぜんぜん] 気[き]付[づ]きません でした。", "I didn't notice the hidden meaning at all.", "Não percebi nada do sentido oculto."]
  - [buchou, "「いい ご身分[みぶん] です ね」 も 気[き] を つけて。 羨[うらや]ましい ん じゃ なくて、 皮肉[ひにく] だ から。", "Watch out for “must be nice” too. It's not envy, it's irony.", "Cuidado também com «que vida boa, hein». Não é inveja, é ironia."]
  - [protagonist, "「結構[けっこう] です」 も、 いい なのか、 いらない なのか…", "And “kekkō desu” — is it “fine” or “no thanks”…", "E «kekkō desu» — é «ótimo» ou «não, obrigado»…"]
  - [buchou, "顔[かお] と 声[こえ] で 判断[はんだん] する ん だ。 君[きみ] も もう 上級者[じょうきゅうしゃ] だ から、 わかる はず。", "You judge by face and voice. You're advanced now — you should get it.", "Você julga pelo rosto e pela voz. Agora você é avançado — deve entender."]
teach:
  - ask: ["Say: a hidden meaning.", "Diga: sentido oculto.", "裏[うら] の 意味[いみ]", ura]
  - ask: ["Say: roundabout, indirect.", "Diga: indireto.", "遠回[とおまわ]し", toomawashi]
  - ask: ["Say: seeming to praise.", "Diga: parecendo elogiar.", "褒[ほ]めて いる よう で", hometeru]
  - ask: ["Say: notice, realise.", "Diga: perceber.", "気[き]付[づ]く", kidzuku]
  - ask: ["Say: Kyoto dialect.", "Diga: dialeto de Kyoto.", "京都[きょうと] 弁[べん]", kyouto-ben]
  - ask: ["Say the Kyoto hint: what a nice watch you have.", "Diga a indireta de Kyoto: que relógio bonito.", "いい 時計[とけい] を して はります な", ii-tokei]
  - ask: ["Say the other one: tea over rice.", "Diga a outra: chá com arroz.", "ぶぶ漬[づ]け", bubuzuke]
  - ask: ["Say the ironic: must be nice.", "Diga o irônico: que vida boa, hein.", "いい ご身分[みぶん] です ね", ii-gomibun]
  - ask: ["Say the ambiguous: fine, or no thank you.", "Diga o ambíguo: ótimo, ou não, obrigado.", "結構[けっこう] です", kekkou-desu-review]
  - ask: ["Say: a habitual phrase.", "Diga: um bordão.", "口癖[くちぐせ]", kuchiguse]
  - note: ["Irony by politeness says the opposite through praise or an offer: «いい ご身分[みぶん] です ね» (must be nice — you're slacking), a Kyoto host praising your watch or offering «ぶぶ漬[づ]け» (time to leave). These Kyoto examples are partly stereotype and joke, but the habit is real: read the face, the timing, the context.", "A ironia pela cortesia diz o contrário por meio de um elogio ou de uma oferta: «いい ご身分[みぶん] です ね» (que vida boa — você está à toa), o anfitrião de Kyoto elogiando o seu relógio ou oferecendo «ぶぶ漬[づ]け» (hora de ir). Esses exemplos de Kyoto são em parte estereótipo e piada, mas o hábito é real: leia o rosto, o momento, o contexto."]
  - pt_only: "O brasileiro diz «olha a hora!» e todo mundo entende. Em Kyoto, o relógio é elogiado — e você é que tem que entender."
