id: A1-06
protagonist: m
title: [The weather, O tempo]
situation: ["June. It has rained for a week. Kenta, your neighbour, meets you on the stairs.", "Junho. Chove há uma semana. Kenta, seu vizinho, encontra você na escada."]
learn: [n5-026]
culture: The rainy season
items:
  - [ame, "雨[あめ]", "rain", "chuva"]
  - [tsuyu, "梅雨[つゆ]", "the rainy season (June–July)", "a estação das chuvas (junho–julho)"]
  - [atsui, "暑[あつ]い", "hot (weather)", "quente (tempo)"]
  - [samui, "寒[さむ]い", "cold (weather)", "frio (tempo)"]
  - [mushiatsui, "蒸[む]し暑[あつ]い", "hot and humid", "abafado"]
  - [kyou, "今日[きょう]", "today", "hoje"]
  - [ashita, "明日[あした]", "tomorrow", "amanhã"]
  - [ii-tenki, "いい 天気[てんき]", "nice weather", "tempo bom"]
  - [desu-ne, "です ね", "isn't it (agreeing)", "né (concordando)"]
  - [kasa, "傘[かさ]", "umbrella", "guarda-chuva"]
  - [ohayou, "おはよう ございます", "good morning", "bom dia"]
dialogue:
  - [kenta, "おはよう ございます。 また 雨[あめ] です ね。", "Good morning. Rain again.", "Bom dia. Chuva de novo, né?"]
  - [protagonist, "おはよう ございます。 梅雨[つゆ] です か。", "Good morning. Is it the rainy season?", "Bom dia. É a estação das chuvas?"]
  - [kenta, "はい。 七月[しちがつ] まで です。", "Yes. Until July.", "Sim. Até julho."]
  - [protagonist, "蒸[む]し暑[あつ]い です ね。", "It's hot and humid, isn't it.", "Que abafado, né?"]
  - [kenta, "ブラジル は 暑[あつ]い です か。", "Is Brazil hot?", "O Brasil é quente?"]
  - [protagonist, "はい。 でも 冬[ふゆ] は 少[すこ]し 寒[さむ]い です。", "Yes. But winter is a little cold.", "Sim. Mas o inverno é um pouco frio."]
  - [kenta, "明日[あした] は いい 天気[てんき] です よ。", "Tomorrow the weather will be nice.", "Amanhã vai fazer tempo bom."]
  - [protagonist, "よかった！ 今日[きょう] は 傘[かさ] です ね。", "Good! Today it's an umbrella, then.", "Que bom! Hoje é guarda-chuva, né?"]
teach:
  - note: ["Mornings start with «おはよう ございます» — good morning — until about ten.", "As manhãs começam com «おはよう ございます» — bom dia — até umas dez horas."]
  - ask: ["Greet Kenta in the morning.", "Cumprimente o Kenta de manhã.", "おはよう ございます。", ohayou]
  - note: ["«です ね» at the end asks for agreement, like 'né' in Portuguese: «雨[あめ] です ね» — rain, isn't it.", "«です ね» no fim pede concordância, como o 'né' do português: «雨[あめ] です ね» — chuva, né?"]
  - ask: ["Say: rain again, isn't it.", "Diga: chuva de novo, né?", "また 雨[あめ] です ね。", ame, desu-ne]
  - ask: ["Ask if it's the rainy season.", "Pergunte se é a estação das chuvas.", "梅雨[つゆ] です か。", tsuyu]
  - note: ["Adjectives ending in «い» go straight before «です»: «暑[あつ]い です» — it's hot.", "Adjetivos terminados em «い» vão direto antes de «です»: «暑[あつ]い です» — está quente."]
  - ask: ["Say: it's hot.", "Diga: está quente.", "暑[あつ]い です。", atsui]
  - ask: ["Say: it's cold.", "Diga: está frio.", "寒[さむ]い です。", samui]
  - ask: ["Say: it's hot and humid, isn't it.", "Diga: que abafado, né?", "蒸[む]し暑[あつ]い です ね。", mushiatsui, desu-ne]
  - ask: ["Say: today.", "Diga: hoje.", "今日[きょう]", kyou]
  - ask: ["Say: tomorrow the weather will be nice.", "Diga: amanhã vai fazer tempo bom.", "明日[あした] は いい 天気[てんき] です。", ashita, ii-tenki]
  - ask: ["Say: an umbrella.", "Diga: guarda-chuva.", "傘[かさ]", kasa]
  - note: ["The rainy season, «梅雨[つゆ]», runs from June to mid-July; then summer is hot and very humid. Shops sell plastic umbrellas everywhere, and many are left in a stand at the door.", "A estação das chuvas, «梅雨[つゆ]», vai de junho a meados de julho; depois o verão é quente e muito úmido. Vendem guarda-chuva de plástico em todo lugar, e muitos ficam num suporte na porta."]
