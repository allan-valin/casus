id: C2-13
protagonist: f
title: ["A talk", "Uma palestra"]
situation: ["A tech meetup in Shizuoka invited you to speak about building translation tools for factory floors. Twenty minutes, then questions from the audience.", "Um encontro de tecnologia em Shizuoka convidou você para falar sobre ferramentas de tradução para chão de fábrica. Vinte minutos, depois perguntas da plateia."]
learn: []
culture: —
items:
  - [kouen-talk, "講演[こうえん]", "lecture, talk", "palestra"]
  - [suraido, "スライド", "slide", "slide"]
  - [choushuu, "聴衆[ちょうしゅう]", "audience", "plateia", {rare: true}]
  - [goshoukai-ni-azukarimashita, "ご紹介[しょうかい] に 預[あず]かりました", "as just introduced (opening a talk)", "como acabaram de apresentar (abrindo a palestra)", {rare: true}]
  - [honjitsu, "本日[ほんじつ]", "today (formal)", "hoje (formal)"]
  - [gaiyou, "概要[がいよう]", "overview", "visão geral"]
  - [jirei, "事例[じれい]", "case, example", "caso, exemplo"]
  - [kadai-review, "課題[かだい] と 展望[てんぼう]", "challenges and outlook", "desafios e perspectivas", {rare: true}]
  - [goseichou, "ご清聴[せいちょう] ありがとう ございました", "thank you for listening", "obrigada pela atenção"]
  - [ii-shitsumon, "いい ご質問[しつもん] です ね", "that's a good question", "boa pergunta"]
dialogue:
  - [protagonist, "ただいま ご紹介[しょうかい] に 預[あず]かりました、 ソウザ です。 本日[ほんじつ] は 工場[こうじょう] の 翻訳[ほんやく] ツール に ついて お話[はな]し します。", "As just introduced, I'm Souza. Today I'll talk about translation tools for factories.", "Como acabaram de apresentar, sou a Souza. Hoje vou falar sobre ferramentas de tradução para fábricas."]
  - [protagonist, "まず 概要[がいよう]、 次[つぎ] に 浜松[はままつ] の 事例[じれい]、 最後[さいご] に 課題[かだい] と 展望[てんぼう] です。 スライド を ご覧[らん] ください。", "First an overview, then the Hamamatsu case, and finally challenges and outlook. Please look at the slide.", "Primeiro uma visão geral, depois o caso de Hamamatsu e, por fim, desafios e perspectivas. Vejam o slide."]
  - [protagonist, "…以上[いじょう] です。 ご清聴[せいちょう] ありがとう ございました。", "…That's all. Thank you for listening.", "…É isso. Obrigada pela atenção."]
  - [kouza-sensei, "興味深[きょうみぶか]い お話[はなし] でした。 機械[きかい] 翻訳[ほんやく] の 間違[まちが]い は、 安全[あんぜん] に 影響[えいきょう] しません か。", "A fascinating talk. Don't machine-translation errors affect safety?", "Palestra muito interessante. Erros de tradução automática não afetam a segurança?"]
  - [protagonist, "いい ご質問[しつもん] です ね。 安全[あんぜん] に 関[かん]わる 文[ぶん] は、 必[かなら]ず 人[ひと] が 確認[かくにん] する 仕組[しく]み に して います。", "That's a good question. Any sentence about safety is always checked by a person, by design.", "Boa pergunta. Toda frase ligada à segurança é sempre conferida por uma pessoa, faz parte do sistema."]
  - [kouza-sensei, "なるほど。 聴衆[ちょうしゅう] の 皆[みな]さん も 納得[なっとく] した よう です ね。", "I see. The audience seems convinced too.", "Entendi. A plateia também parece convencida."]
  - [protagonist, "ありがとう ございます。 ほか に ご質問[しつもん] は ございます でしょう か。", "Thank you. Are there any other questions?", "Obrigada. Há mais alguma pergunta?"]
  - [kouza-sensei, "最後[さいご] に 拍手[はくしゅ] を！", "One last round of applause!", "Uma última salva de palmas!"]
teach:
  - ask: ["Say: a talk, a lecture.", "Diga: uma palestra.", "講演[こうえん]", kouen-talk]
  - ask: ["Say: the audience.", "Diga: a plateia.", "聴衆[ちょうしゅう]", choushuu]
  - ask: ["Open a talk after being introduced.", "Abra a palestra depois de ser apresentada.", "ご紹介[しょうかい] に 預[あず]かりました", goshoukai-ni-azukarimashita]
  - ask: ["Say: today — formally.", "Diga: hoje — formal.", "本日[ほんじつ]", honjitsu]
  - ask: ["Say: an overview.", "Diga: uma visão geral.", "概要[がいよう]", gaiyou]
  - ask: ["Say: a case, an example.", "Diga: um caso.", "事例[じれい]", jirei]
  - ask: ["Say: challenges and outlook.", "Diga: desafios e perspectivas.", "課題[かだい] と 展望[てんぼう]", kadai-review]
  - ask: ["Say: a slide.", "Diga: um slide.", "スライド", suraido]
  - ask: ["Close the talk: thank you for listening.", "Feche a palestra: obrigada pela atenção.", "ご清聴[せいちょう] ありがとう ございました。", goseichou]
  - ask: ["Buy time in the Q&A: that's a good question.", "Ganhe tempo nas perguntas: boa pergunta.", "いい ご質問[しつもん] です ね。", ii-shitsumon]
  - note: ["A formal talk has a fixed frame: «ただいま ご紹介[しょうかい] に 預[あず]かりました○○ です» to open, the structure in one breath («まず… 次[つぎ] に… 最後[さいご] に…»), «以上[いじょう] です» and «ご清聴[せいちょう] ありがとう ございました» to close. In the Q&A, «いい ご質問[しつもん] です ね» buys a second.", "Uma palestra formal tem moldura fixa: «ただいま ご紹介[しょうかい] に 預[あず]かりました○○ です» para abrir, a estrutura de um fôlego só («まず… 次[つぎ] に… 最後[さいご] に…»), «以上[いじょう] です» e «ご清聴[せいちょう] ありがとう ございました» para fechar. Nas perguntas, «いい ご質問[しつもん] です ね» dá um segundo para pensar."]
  - pt_only: "No Brasil se abre a palestra com uma piada. No Japão, com a fórmula e uma reverência — a piada, se vier, é no meio."
