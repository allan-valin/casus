id: A1-28
protagonist: m
title: [The family, A família]
situation: ["You show Mrs Suzuki an old photo of your grandmother, born in Japan, who sailed to Brazil as a child.", "Você mostra à senhora Suzuki uma foto antiga da sua avó, nascida no Japão, que foi para o Brasil de navio quando criança."]
learn: []
culture: Nikkei identity
items:
  - [kazoku, "家族[かぞく]", "family", "família"]
  - [sobo, "祖母[そぼ]", "my grandmother", "minha avó"]
  - [sofu, "祖父[そふ]", "my grandfather", "meu avô"]
  - [haha, "母[はは]", "my mother", "minha mãe"]
  - [chichi, "父[ちち]", "my father", "meu pai"]
  - [nikkei, "日系[にっけい]", "of Japanese descent (nikkei)", "descendente de japoneses (nikkei)", {rare: true}]
  - [shashin, "写真[しゃしん]", "photo", "foto"]
  - [umaremashita, "生[う]まれました", "was born", "nasci, nasceu"]
  - [kodomo, "子供[こども]", "child", "criança"]
  - [sansei, "三世[さんせい]", "third generation", "terceira geração", {rare: true}]
  - [okaasan, "お母[かあ]さん", "(someone's) mother", "a mãe (de alguém)"]
dialogue:
  - [protagonist, "これ は 家族[かぞく] の 写真[しゃしん] です。", "This is a photo of my family.", "Esta é uma foto da minha família."]
  - [suzuki, "まあ、 古[ふる]い 写真[しゃしん] です ね。 この 方[かた] は？", "Oh, an old photo. Who is this?", "Nossa, que foto antiga. Quem é esta senhora?"]
  - [protagonist, "祖母[そぼ] です。 広島[ひろしま] で 生[う]まれました。", "My grandmother. She was born in Hiroshima.", "É minha avó. Nasceu em Hiroshima."]
  - [suzuki, "子供[こども] の 時[とき] に ブラジル へ？", "To Brazil as a child?", "Foi para o Brasil criança?"]
  - [protagonist, "はい、 船[ふね] で。 祖父[そふ] も 日本人[にほんじん] です。", "Yes, by ship. My grandfather is Japanese too.", "Sim, de navio. Meu avô também é japonês."]
  - [suzuki, "じゃあ、 お母[かあ]さん は 日系[にっけい] 二世[にせい] です ね。", "So your mother is second-generation nikkei.", "Então sua mãe é nikkei de segunda geração."]
  - [protagonist, "はい。 母[はは] は 二世[にせい]、 私[わたし] は 三世[さんせい] です。 でも 日本語[にほんご] は 話[はな]せません でした。", "Yes. My mother is second generation, I'm third. But I couldn't speak Japanese.", "Isso. Minha mãe é segunda geração, eu sou terceira. Mas eu não falava japonês."]
  - [suzuki, "今[いま] は 話[はな]して います よ。 おばあさん、 喜[よろこ]びます ね。", "You're speaking it now. Your grandmother would be happy.", "Agora você está falando. Sua avó ficaria feliz."]
teach:
  - ask: ["Say: family.", "Diga: família.", "家族[かぞく]", kazoku]
  - ask: ["Say: a photo.", "Diga: uma foto.", "写真[しゃしん]", shashin]
  - note: ["Japanese has two words for each relative: a humble one for your own family, and a polite one for someone else's. My grandmother is «祖母[そぼ]»; hers is «おばあさん». My mother is «母[はは]»; yours is «お母[かあ]さん».", "O japonês tem duas palavras para cada parente: uma humilde para a sua família e uma educada para a família dos outros. Minha avó é «祖母[そぼ]»; a dela é «おばあさん». Minha mãe é «母[はは]»; a sua é «お母[かあ]さん»."]
  - ask: ["Say: my grandmother.", "Diga: minha avó.", "祖母[そぼ]", sobo]
  - ask: ["Say: my grandfather.", "Diga: meu avô.", "祖父[そふ]", sofu]
  - ask: ["Say: my mother.", "Diga: minha mãe.", "母[はは]", haha]
  - ask: ["Say: my father.", "Diga: meu pai.", "父[ちち]", chichi]
  - ask: ["Now someone else's mother.", "Agora a mãe de outra pessoa.", "お母[かあ]さん", okaasan]
  - ask: ["Say: my grandmother was born in Hiroshima.", "Diga: minha avó nasceu em Hiroshima.", "祖母[そぼ] は 広島[ひろしま] で 生[う]まれました。", umaremashita]
  - ask: ["Say: a child.", "Diga: uma criança.", "子供[こども]", kodomo]
  - ask: ["Say: nikkei, of Japanese descent.", "Diga: nikkei, descendente de japoneses.", "日系[にっけい]", nikkei]
  - ask: ["Say: third generation.", "Diga: terceira geração.", "三世[さんせい]", sansei]
  - note: ["The first ship of Japanese emigrants reached Santos in 1908. Their children are «二世[にせい]», grandchildren «三世[さんせい]». Many came back to work in factories from 1990, when Japan opened a visa for descendants — that is why Hamamatsu has so many Brazilians.", "O primeiro navio de imigrantes japoneses chegou a Santos em 1908. Os filhos são «二世[にせい]», os netos «三世[さんせい]». Muitos voltaram para trabalhar nas fábricas a partir de 1990, quando o Japão abriu um visto para descendentes — é por isso que Hamamatsu tem tantos brasileiros."]
  - pt_only: "No Brasil você é «o japonês» da turma; no Japão, «o brasileiro». Muitos nikkeis sentem isso: estrangeiros nos dois lugares, e de casa nos dois também."
