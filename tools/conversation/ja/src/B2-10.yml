id: B2-10
protagonist: m
title: ["The telephone", "O telefone"]
situation: ["The office phone rings. Mr Yamada, the supplier, asks for Chief Sato — who is in a meeting. You take the message.", "O telefone do escritório toca. O senhor Yamada, o fornecedor, pede para falar com a chefe Sato — que está em reunião. Você anota o recado."]
learn: []
culture: —
items:
  - [odenwa, "お電話[でんわ]", "telephone (polite)", "telefone (educado)"]
  - [moushiwake-gozaimasen, "申[もう]し訳[わけ] ございません", "I'm very sorry (most polite)", "peço muitas desculpas (o mais educado)"]
  - [dengon, "伝言[でんごん]", "message", "recado"]
  - [seki-wo-hazushite, "席[せき] を 外[はず]して おります", "is away from (their) desk", "não está na mesa no momento"]
  - [ukagaimasu, "伺[うかが]います", "ask, hear, visit (humble)", "pergunto, ouço, visito (humilde)"]
  - [moushitsutaemasu, "申[もう]し伝[つた]えます", "I'll pass it on (humble)", "vou transmitir (humilde)"]
  - [orikaeshi, "折[お]り返[かえ]し", "calling back", "retornar a ligação"]
  - [osore-irimasu-ga, "恐[おそ]れ入[い]ります が", "I'm sorry to trouble you, but", "desculpe o incômodo, mas"]
  - [renrakusaki-ukagau, "ご連絡先[れんらくさき] を 伺[うかが]えます か", "may I have your contact number?", "pode me passar seu contato?"]
  - [kashikomarimashita, "かしこまりました", "certainly (very polite)", "pois não, entendido (muito educado)"]
dialogue:
  - [protagonist, "お電話[でんわ] ありがとう ございます。 浜松[はままつ] 工業[こうぎょう] の ソウザ で ございます。", "Thank you for calling. Hamamatsu Industries, Souza speaking.", "Obrigado pela ligação. Hamamatsu Indústrias, Souza falando."]
  - [yamada, "山田[やまだ] 商事[しょうじ] の 山田[やまだ] です。 佐藤[さとう] 課長[かちょう] は いらっしゃいます か。", "This is Yamada from Yamada Trading. Is Chief Sato there?", "Aqui é o Yamada, da Yamada Comércio. A chefe Sato está?"]
  - [protagonist, "申[もう]し訳[わけ] ございません。 佐藤[さとう] は ただいま 席[せき] を 外[はず]して おります。", "I'm very sorry. Sato is away from her desk right now.", "Peço desculpas. A Sato não está na mesa no momento."]
  - [yamada, "そう です か。 では、 伝言[でんごん] を お願[ねが]い できます か。", "I see. Then could you take a message?", "Entendo. Então, pode anotar um recado?"]
  - [protagonist, "かしこまりました。 伺[うかが]います。", "Certainly. Go ahead.", "Pois não. Pode falar."]
  - [yamada, "明日[あした] の 納品[のうひん] が 一日[いちにち] 遅[おく]れます、 と お伝[つた]え ください。", "Please tell her tomorrow's delivery will be a day late.", "Diga a ela que a entrega de amanhã vai atrasar um dia, por favor."]
  - [protagonist, "恐[おそ]れ入[い]ります が、 ご連絡先[れんらくさき] を 伺[うかが]えます か。 佐藤[さとう] から 折[お]り返[かえ]し お電話[でんわ] いたします。", "Sorry to trouble you, may I have your number? Sato will call you back.", "Desculpe o incômodo, pode me passar seu contato? A Sato retorna a ligação."]
  - [yamada, "ありがとう ございます。 では、 よろしく お願[ねが]い します。", "Thank you. I'll leave it with you.", "Obrigado. Então, conto com você."]
teach:
  - ask: ["Answer the phone politely: thank you for calling.", "Atenda com educação: obrigado pela ligação.", "お電話[でんわ] ありがとう ございます。", odenwa]
  - note: ["On the phone to an outsider, your own boss is family: you drop «課長[かちょう]» and «さん» and say «佐藤[さとう] は 席[せき] を 外[はず]して おります», with humble verbs — even though inside the company you'd call her «佐藤[さとう] 課長[かちょう]». The outsider gets the respect.", "No telefone com alguém de fora, sua própria chefe é como família: você tira o «課長[かちょう]» e o «さん» e diz «佐藤[さとう] は 席[せき] を 外[はず]して おります», com verbos humildes — mesmo que dentro da empresa você a chame de «佐藤[さとう] 課長[かちょう]». O respeito vai para quem é de fora."]
  - ask: ["Apologise in the most polite way.", "Peça desculpas do jeito mais educado.", "申[もう]し訳[わけ] ございません。", moushiwake-gozaimasen]
  - ask: ["Say: she's away from her desk — humble.", "Diga: ela não está na mesa — humilde.", "席[せき] を 外[はず]して おります。", seki-wo-hazushite]
  - ask: ["Say: a message.", "Diga: um recado.", "伝言[でんごん]", dengon]
  - ask: ["Say: certainly.", "Diga: pois não.", "かしこまりました。", kashikomarimashita]
  - ask: ["Say humbly: I'll hear it, go ahead.", "Diga com humildade: pode falar, eu ouço.", "伺[うかが]います。", ukagaimasu]
  - ask: ["Soften a request: sorry to trouble you, but…", "Suavize um pedido: desculpe o incômodo, mas…", "恐[おそ]れ入[い]ります が", osore-irimasu-ga]
  - ask: ["Ask for their contact number.", "Peça o contato.", "ご連絡先[れんらくさき] を 伺[うかが]えます か。", renrakusaki-ukagau]
  - ask: ["Say: calling back.", "Diga: retornar a ligação.", "折[お]り返[かえ]し", orikaeshi]
  - ask: ["Promise humbly: I'll pass it on.", "Prometa com humildade: vou transmitir.", "申[もう]し伝[つた]えます。", moushitsutaemasu]
  - note: ["Office phones run on set phrases: «お電話[でんわ] ありがとう ございます», your company and name, «申[もう]し訳[わけ] ございません», «席[せき] を 外[はず]して おります», «伺[うかが]います», «申[もう]し伝[つた]えます». Write down name, company, number and message, and read them back.", "O telefone do escritório funciona com frases prontas: «お電話[でんわ] ありがとう ございます», sua empresa e nome, «申[もう]し訳[わけ] ございません», «席[せき] を 外[はず]して おります», «伺[うかが]います», «申[もう]し伝[つた]えます». Anote nome, empresa, número e recado, e confirme lendo de volta."]
  - pt_only: "No Brasil se diria «ela não está, quer deixar recado?». No Japão a mesma coisa leva o triplo de palavras — e tirar o título da própria chefe é sinal de respeito ao cliente, não de desrespeito a ela."
