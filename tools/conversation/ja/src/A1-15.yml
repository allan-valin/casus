id: A1-15
protagonist: f
title: [Numbers and shapes, Números e formas]
situation: ["Mrs Suzuki helps you measure the tatami room for a new carpet.", "A senhora Suzuki ajuda você a medir o quarto de tatame para um tapete novo."]
learn: []
culture: Rooms measured in tatami
items:
  - [tatami, "畳[たたみ]", "tatami mat", "tatame"]
  - [hiroi, "広[ひろ]い", "spacious, wide", "espaçoso, largo"]
  - [semai, "狭[せま]い", "narrow, small (room)", "apertado, pequeno (cômodo)"]
  - [rokujou, "六畳[ろくじょう]", "six tatami (a room size)", "seis tatames (tamanho de cômodo)"]
  - [heya, "部屋[へや]", "room", "quarto, cômodo"]
  - [nagai, "長[なが]い", "long", "comprido"]
  - [shikaku, "四角[しかく]", "square, rectangle", "quadrado, retângulo"]
  - [meetoru, "メートル", "metre", "metro"]
  - [han, "半[はん]", "half", "meio"]
  - [chodo, "ちょうど", "exactly", "exatamente"]
  - [ookii, "大[おお]きい", "big", "grande"]
  - [chiisai, "小[ちい]さい", "small", "pequeno"]
dialogue:
  - [suzuki, "この 部屋[へや] は 六畳[ろくじょう] です。", "This room is six tatami.", "Este quarto é de seis tatames."]
  - [protagonist, "六畳[ろくじょう]？ 広[ひろ]い です か、 狭[せま]い です か。", "Six tatami? Is that big or small?", "Seis tatames? É grande ou pequeno?"]
  - [suzuki, "少[すこ]し 狭[せま]い です ね。 一畳[いちじょう] は 約[やく] 一[いち] メートル 半[はん] と 一[いち] メートル です。", "A little small. One tatami is about one and a half metres by one metre.", "Um pouco pequeno. Um tatame tem cerca de um metro e meio por um metro."]
  - [protagonist, "じゃあ、 部屋[へや] は 三[さん] メートル と 三[さん] メートル ぐらい？", "So the room is about three by three metres?", "Então o quarto tem uns três por três metros?"]
  - [suzuki, "ちょうど です。 頭[あたま] が いい です ね！", "Exactly. You're clever!", "Exatamente. Que inteligente!"]
  - [protagonist, "この カーペット は 大[おお]きい です か。", "Is this carpet big?", "Este tapete é grande?"]
  - [suzuki, "長[なが]い です ね。 小[ちい]さい の が いい です。", "It's long. A small one is better.", "É comprido. Um pequeno é melhor."]
  - [protagonist, "わかりました。 四角[しかく] の 小[ちい]さい の に します。", "I see. I'll take a small square one.", "Entendi. Vou escolher um pequeno quadrado."]
teach:
  - ask: ["Say: this room is six tatami.", "Diga: este quarto é de seis tatames.", "この 部屋[へや] は 六畳[ろくじょう] です。", heya, rokujou]
  - ask: ["Say: tatami.", "Diga: tatame.", "畳[たたみ]", tatami]
  - ask: ["Ask if it is spacious or small.", "Pergunte se é espaçoso ou pequeno.", "広[ひろ]い です か、 狭[せま]い です か。", hiroi, semai]
  - note: ["Rooms are measured in tatami: «六畳[ろくじょう]» — six mats, about ten square metres. The counter for mats is «畳[じょう]».", "Os cômodos se medem em tatames: «六畳[ろくじょう]» — seis tatames, cerca de dez metros quadrados. O contador de tatames é «畳[じょう]»."]
  - ask: ["Say: one and a half metres.", "Diga: um metro e meio.", "一[いち] メートル 半[はん]", meetoru, han]
  - ask: ["She says exactly. How?", "Ela diz exatamente. Como?", "ちょうど です。", chodo]
  - ask: ["Ask if the carpet is big.", "Pergunte se o tapete é grande.", "カーペット は 大[おお]きい です か。", ookii]
  - ask: ["Say: it's long.", "Diga: é comprido.", "長[なが]い です。", nagai]
  - ask: ["Say: a small one is better.", "Diga: um pequeno é melhor.", "小[ちい]さい の が いい です。", chiisai]
  - ask: ["Say: square.", "Diga: quadrado.", "四角[しかく]", shikaku]
  - note: ["Flat adverts give room sizes in 畳 and layouts like 1K or 2LDK (rooms + Living, Dining, Kitchen). A six-mat room is a normal bedroom.", "Anúncios de apartamento dão os cômodos em 畳 e plantas como 1K ou 2LDK (quartos + sala, jantar, cozinha). Um quarto de seis tatames é um quarto normal."]
