id: C2-30
protagonist: m
title: ["Five years", "Cinco anos"]
situation: ["Five years since you arrived in Hamamatsu. At the summer festival the taiko group plays, and your son watches from Yui's shoulders. The whole story, one last time.", "Cinco anos desde que você chegou a Hamamatsu. No festival de verão o grupo de taikô toca, e seu filho assiste do ombro da Yui. A história toda, uma última vez."]
learn: []
culture: —
items:
  - [gonen-kan, "五年間[ごねんかん]", "five years (span)", "cinco anos (período)"]
  - [hajimari, "始[はじ]まり", "the beginning", "o começo"]
  - [tadoritsuita, "たどり着[つ]いた", "finally arrived at", "finalmente cheguei a"]
  - [tsuzuku, "続[つづ]く", "continue, go on", "continuar"]
  - [kokyou-ga-futatsu, "故郷[こきょう] が 二[ふた]つ", "two homelands", "duas terras natais"]
  - [kansha-shite-imasu, "感謝[かんしゃ] して います", "I'm grateful", "sou grato"]
  - [kore-kara-no, "これ から の 物語[ものがたり]", "the story from here on", "a história daqui em diante"]
  - [monogatari, "物語[ものがたり]", "story, tale", "história, narrativa"]
  - [tsutaetai, "伝[つた]えたい", "I want to pass on", "quero transmitir"]
  - [owari-de-wa-nai, "終[お]わり で は ない", "it's not the end", "não é o fim"]
dialogue:
  - [yui, "五年間[ごねんかん]、 色々[いろいろ] あった ね。", "So much happened in five years.", "Aconteceu tanta coisa em cinco anos."]
  - [protagonist, "始[はじ]まり は「はじめまして、 ブラジル 人[じん] です」 だけ だった。", "It began with nothing but “Nice to meet you, I'm Brazilian.”", "Começou só com «Muito prazer, sou brasileiro»."]
  - [kenta, "今[いま] は 太鼓[たいこ] の リーダー で、 遠州[えんしゅう] 弁[べん] まで わかる。", "Now you lead the taiko group and even understand Enshū dialect.", "Agora você lidera o taikô e entende até o dialeto de Enshū."]
  - [protagonist, "たくさん の 人[ひと] の おかげ で、 ここ に たどり着[つ]いた。 みんな に 感謝[かんしゃ] して います。", "Thanks to so many people, I made it here. I'm grateful to all of you.", "Graças a muita gente, cheguei até aqui. Sou grato a todos vocês."]
  - [yui, "この 子[こ] に とって は、 故郷[こきょう] が 二[ふた]つ ある ん だ よ ね。", "For this little one, there are two homelands.", "Para este pequeno, existem duas terras natais."]
  - [protagonist, "日本[にほん] と ブラジル、 両方[りょうほう] の 物語[ものがたり] を 伝[つた]えたい。", "I want to pass on the stories of both Japan and Brazil.", "Quero transmitir as histórias do Japão e do Brasil."]
  - [kenta, "さあ、 太鼓[たいこ] が 始[はじ]まる よ！ リーダー、 行[い]って こい！", "Come on, the taiko's starting! Leader, off you go!", "Vamos, o taikô vai começar! Líder, vai lá!"]
  - [protagonist, "これ は 終[お]わり で は ない。 これ から の 物語[ものがたり] の 始[はじ]まり だ。 …やらまいか！", "This isn't the end. It's the beginning of the story from here on. …Yaramaika!", "Isso não é o fim. É o começo da história daqui em diante. …Yaramaika!"]
teach:
  - ask: ["Say: five years.", "Diga: cinco anos.", "五年間[ごねんかん]", gonen-kan]
  - ask: ["Say: the beginning.", "Diga: o começo.", "始[はじ]まり", hajimari]
  - ask: ["Say: I finally made it here.", "Diga: finalmente cheguei aqui.", "たどり着[つ]いた", tadoritsuita]
  - ask: ["Say: I'm grateful.", "Diga: sou grato.", "感謝[かんしゃ] して います。", kansha-shite-imasu]
  - ask: ["Say: two homelands.", "Diga: duas terras natais.", "故郷[こきょう] が 二[ふた]つ", kokyou-ga-futatsu]
  - ask: ["Say: a story.", "Diga: uma história.", "物語[ものがたり]", monogatari]
  - ask: ["Say: I want to pass it on.", "Diga: quero transmitir.", "伝[つた]えたい", tsutaetai]
  - ask: ["Say: the story from here on.", "Diga: a história daqui em diante.", "これ から の 物語[ものがたり]", kore-kara-no]
  - ask: ["Say: it goes on.", "Diga: continua.", "続[つづ]く", tsuzuku]
  - ask: ["Say: it's not the end.", "Diga: não é o fim.", "終[お]わり で は ない", owari-de-wa-nai]
  - note: ["That's the end of the course. From «はじめまして» to Bashō, from the rubbish days to a council briefing, you've moved through plain and polite, humble and respectful, dialect and literature. The language goes on — keep talking with your Kenta, your Mrs Suzuki, your town.", "Fim do curso. Do «はじめまして» a Bashō, dos dias do lixo à reunião na prefeitura, você passou pelo informal e o educado, o humilde e o respeitoso, o dialeto e a literatura. A língua continua — siga conversando com o seu Kenta, a sua senhora Suzuki, a sua cidade."]
  - pt_only: "Cinco anos, cento e oitenta unidades. Obrigado por ter vindo até aqui — e やらまいか: o resto da história é com você."
