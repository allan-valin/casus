title: ["A friend's baby", "O nascimento de um amigo"]
situation: ["Kenta and Misaki have a baby girl. You visit with a gift; Misaki tells you about the shrine visit next month — and gives you something back.", "O Kenta e a Misaki tiveram uma menina. Você visita com um presente; a Misaki conta da visita ao santuário no mês que vem — e te dá algo em troca."]
learn: []
culture: Return gifts
items:
  - [shussan-iwai, "出産[しゅっさん] 祝[いわ]い", "gift for a birth", "presente de nascimento", {rare: true}]
  - [omiyamairi, "お宮参[みやまい]り", "baby's first shrine visit", "primeira visita do bebê ao santuário", {rare: true}]
  - [akachan, "赤[あか]ちゃん", "baby", "bebê"]
  - [uchiiwai, "内祝[うちいわ]い", "return gift (from the family)", "lembrança de retribuição (da família)", {rare: true}]
  - [zu-ni, "〜ず に", "without (doing)", "sem (fazer)"]
  - [nezu-ni, "寝[ね]ず に", "without sleeping", "sem dormir"]
  - [dakko, "抱[だ]っこ", "holding (a baby)", "colo"]
  - [kawaii-review, "可愛[かわい]い", "cute", "fofo"]
  - [omedetou-gozaimasu-birth, "ご出産[しゅっさん] おめでとう ございます", "congratulations on the birth", "parabéns pelo nascimento"]
  - [nazuke, "名付[なづ]け", "naming (a baby)", "dar nome (ao bebê)", {rare: true}]
dialogue:
  - [protagonist, "ご出産[しゅっさん] おめでとう ございます。 これ、 出産[しゅっさん] 祝[いわ]い です。", "Congratulations on the birth. Here's a little gift.", "Parabéns pelo nascimento. Aqui, um presentinho."]
  - [misaki, "ありがとう！ 抱[だ]っこ して みる？", "Thank you! Want to hold her?", "Obrigada! Quer pegar no colo?"]
  - [protagonist, "いい ん です か。 …可愛[かわい]い！ 名前[なまえ] は？", "Can I? …So cute! What's her name?", "Posso? …Que fofa! Como ela se chama?"]
  - [kenta, "陽菜[ひな]。 名付[なづ]け に 一週間[いっしゅうかん] かかった よ。", "Hina. The naming took us a week.", "Hina. Levamos uma semana para escolher o nome."]
  - [misaki, "健太[けんた] は 夜[よる] も 寝[ね]ず に 名前[なまえ] の 本[ほん] を 読[よ]んで いた の。", "Kenta read baby-name books without sleeping at night.", "O Kenta lia livro de nomes à noite sem dormir."]
  - [protagonist, "来月[らいげつ] は お宮参[みやまい]り です か。", "Is the shrine visit next month?", "A visita ao santuário é mês que vem?"]
  - [misaki, "そう。 浜松[はままつ] の 神社[じんじゃ] で。 あ、 これ は 内祝[うちいわ]い。 気[き] を 遣[つか]わず に 受[う]け取[と]って ね。", "Yes, at a Hamamatsu shrine. Oh, and this is our return gift. Take it without worrying.", "Isso, num santuário de Hamamatsu. Ah, e isto é a nossa lembrança. Pode aceitar sem cerimônia."]
  - [protagonist, "ありがとう ございます。 陽菜[ひな] ちゃん、 元気[げんき] に 大[おお]きく なって ね。", "Thank you. Hina, grow up big and healthy.", "Obrigado. Hina, cresça forte e com saúde."]
teach:
  - ask: ["Congratulate the parents.", "Dê os parabéns aos pais.", "ご出産[しゅっさん] おめでとう ございます。", omedetou-gozaimasu-birth]
  - ask: ["Say: a baby.", "Diga: um bebê.", "赤[あか]ちゃん", akachan]
  - ask: ["Say: a gift for a birth.", "Diga: presente de nascimento.", "出産[しゅっさん] 祝[いわ]い", shussan-iwai]
  - ask: ["Say: holding a baby.", "Diga: pegar no colo.", "抱[だ]っこ", dakko]
  - ask: ["Say: cute.", "Diga: fofo.", "可愛[かわい]い", kawaii-review]
  - ask: ["Say: naming a baby.", "Diga: dar nome ao bebê.", "名付[なづ]け", nazuke]
  - note: ["«〜ず に» is without doing — the written cousin of «〜ないで»: «寝[ね]ず に», without sleeping; «気[き] を 遣[つか]わず に», without worrying about it. «する» becomes «せず に».", "«〜ず に» é sem fazer — o primo escrito do «〜ないで»: «寝[ね]ず に», sem dormir; «気[き] を 遣[つか]わず に», sem se preocupar. «する» vira «せず に»."]
  - ask: ["Say the pattern: without doing.", "Diga o padrão: sem fazer.", "〜ず に", zu-ni]
  - ask: ["Say: without sleeping.", "Diga: sem dormir.", "寝[ね]ず に", nezu-ni]
  - ask: ["Say: the baby's first shrine visit.", "Diga: a primeira visita do bebê ao santuário.", "お宮参[みやまい]り", omiyamairi]
  - ask: ["Say: the family's return gift.", "Diga: a lembrança de retribuição.", "内祝[うちいわ]い", uchiiwai]
  - note: ["A birth brings gifts both ways: friends give «出産[しゅっさん] 祝[いわ]い», and the family later sends «内祝[うちいわ]い», usually worth about half. Around a month after birth comes «お宮参[みやまい]り», the baby's first visit to a shrine, often with grandparents.", "O nascimento traz presentes nos dois sentidos: os amigos dão «出産[しゅっさん] 祝[いわ]い», e a família depois envia o «内祝[うちいわ]い», em geral de cerca de metade do valor. Cerca de um mês depois do parto vem a «お宮参[みやまい]り», a primeira visita do bebê ao santuário, muitas vezes com os avós."]
  - pt_only: "No Brasil tem a lembrancinha da maternidade e o chá de bebê antes. No Japão o presente vem depois do parto, e a família retribui — de novo, a «お返[かえ]し»."
