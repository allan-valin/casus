id: C2-18
protagonist: m
title: ["The journalist", "O jornalista"]
situation: ["A national newspaper is writing about foreign residents settling in regional Japan. The reporter interviews you; every sentence may be quoted.", "Um jornal nacional está escrevendo sobre estrangeiros que se fixam no interior do Japão. A repórter entrevista você; cada frase pode ser citada."]
learn: []
culture: —
items:
  - [teijuu, "定住[ていじゅう]", "settling permanently", "fixar residência"]
  - [sabetsu, "差別[さべつ]", "discrimination", "discriminação"]
  - [kyousei, "共生[きょうせい]", "coexistence", "convivência"]
  - [inyou, "引用[いんよう]", "quotation", "citação"]
  - [kotoba-wo-erabu, "言葉[ことば] を 選[えら]ぶ", "choose one's words", "escolher as palavras"]
  - [tashika-ni-aru, "確[たし]か に ある", "certainly exists", "certamente existe"]
  - [ippou-review, "その 一方[いっぽう] で", "on the other hand", "por outro lado"]
  - [kanyou, "寛容[かんよう]", "tolerance, open-mindedness", "tolerância"]
  - [chiiki-shakai, "地域[ちいき] 社会[しゃかい]", "local community", "comunidade local"]
  - [hito-to-hito, "人[ひと] と 人[ひと]", "person to person", "de pessoa para pessoa"]
dialogue:
  - [reporter, "浜松[はままつ] に 定住[ていじゅう] して 五年[ごねん]。 差別[さべつ] を 感[かん]じた こと は ありますか。", "Five years settled in Hamamatsu. Have you felt discrimination?", "Cinco anos morando em Hamamatsu. Já sentiu discriminação?"]
  - [protagonist, "言葉[ことば] を 選[えら]んで 答[こた]えます。 差別[さべつ] は 確[たし]か に あります。 部屋[へや] を 借[か]りる 時[とき] に 断[ことわ]られた こと も あります。", "I'll choose my words. Discrimination certainly exists. I was once refused when renting a flat.", "Vou escolher as palavras. A discriminação certamente existe. Já me recusaram ao alugar um apartamento."]
  - [reporter, "その 経験[けいけん] は、 記事[きじ] に 引用[いんよう] して も よろしい でしょう か。", "May I quote that experience in the article?", "Posso citar essa experiência na matéria?"]
  - [protagonist, "はい。 ただ、 その 一方[いっぽう] で、 地域[ちいき] 社会[しゃかい] に 温[あたた]かく 迎[むか]えられた こと も 書[か]いて ください。", "Yes. But please also write that, on the other hand, the local community welcomed me warmly.", "Pode. Mas, por favor, escreva também que, por outro lado, a comunidade local me acolheu com carinho."]
  - [reporter, "共生[きょうせい] の ため に、 何[なに] が 一番[いちばん] 必要[ひつよう] だ と 思[おも]います か。", "What do you think is most needed for coexistence?", "O que você acha que é mais necessário para a convivência?"]
  - [protagonist, "制度[せいど] も 大事[だいじ] です が、 結局[けっきょく] は 人[ひと] と 人[ひと] の 出会[であ]い だ と 思[おも]います。 太鼓[たいこ] や フットサル の よう な。", "Systems matter, but in the end I think it's people meeting people. Like through taiko or futsal.", "As políticas importam, mas no fim acho que é o encontro de pessoa para pessoa. Como no taikô ou no futsal."]
  - [reporter, "いい 言葉[ことば] です ね。 見出[みだ]し に なる かも しれません。", "Nice words. That might become the headline.", "Boa frase. Pode virar manchete."]
  - [protagonist, "寛容[かんよう] は 両方[りょうほう] から 必要[ひつよう] です。 それ も 一緒[いっしょ] に お願[ねが]い します。", "Tolerance is needed from both sides. Please include that too.", "A tolerância precisa vir dos dois lados. Coloque isso também, por favor."]
teach:
  - ask: ["Say: settling permanently.", "Diga: fixar residência.", "定住[ていじゅう]", teijuu]
  - ask: ["Say: discrimination.", "Diga: discriminação.", "差別[さべつ]", sabetsu]
  - ask: ["Say: coexistence.", "Diga: convivência.", "共生[きょうせい]", kyousei]
  - ask: ["Say: the local community.", "Diga: a comunidade local.", "地域[ちいき] 社会[しゃかい]", chiiki-shakai]
  - ask: ["Buy a moment: I'll choose my words.", "Ganhe um momento: vou escolher as palavras.", "言葉[ことば] を 選[えら]ぶ", kotoba-wo-erabu]
  - ask: ["Say: it certainly exists.", "Diga: certamente existe.", "確[たし]か に ある", tashika-ni-aru]
  - ask: ["Balance it: on the other hand.", "Equilibre: por outro lado.", "その 一方[いっぽう] で", ippou-review]
  - ask: ["Say: a quotation.", "Diga: uma citação.", "引用[いんよう]", inyou]
  - ask: ["Say: person to person.", "Diga: de pessoa para pessoa.", "人[ひと] と 人[ひと]", hito-to-hito]
  - ask: ["Say: tolerance.", "Diga: tolerância.", "寛容[かんよう]", kanyou]
  - note: ["Speaking to a journalist calls for a quotable register: short, complete sentences that stand alone, a fact and its counterweight («確[たし]か に… その 一方[いっぽう] で…»), and asking for both to be printed. A single line can become a headline.", "Falar com jornalista pede um registro citável: frases curtas e completas que fiquem de pé sozinhas, um fato e o seu contrapeso («確[たし]か に… その 一方[いっぽう] で…»), e o pedido para que os dois sejam publicados. Uma única frase pode virar manchete."]
  - pt_only: "Recusa de aluguel por ser estrangeiro ainda acontece no Japão. Falar disso em público, com equilíbrio, ajuda quem vem depois."
