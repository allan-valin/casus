id: C2-11
protagonist: f
title: ["A lawsuit", "Um processo"]
situation: ["You and Shota moved out, but the landlord kept the whole deposit for “cleaning”. At the public legal-support centre, a lawyer explains small-claims court.", "Você e o Shota saíram do apartamento, mas o proprietário ficou com toda a caução para «limpeza». No centro público de apoio jurídico, um advogado explica o juizado de pequenas causas."]
learn: []
culture: —
items:
  - [shougaku-soshou, "少額[しょうがく] 訴訟[そしょう]", "small-claims lawsuit", "ação de pequenas causas", {rare: true}]
  - [bengoshi-item, "弁護士[べんごし]", "lawyer", "advogado"]
  - [shouko, "証拠[しょうこ]", "evidence", "prova"]
  - [hanketsu, "判決[はんけつ]", "judgement, ruling", "sentença"]
  - [houterasu, "法[ほう] テラス", "public legal-support centre", "centro público de apoio jurídico", {rare: true}]
  - [genkoku, "原告[げんこく]", "plaintiff", "autor (da ação)", {rare: true}]
  - [hikoku, "被告[ひこく]", "defendant", "réu"]
  - [wakai, "和解[わかい]", "settlement", "acordo (judicial)"]
  - [tsuujou-shiyou, "通常[つうじょう] の 使用[しよう]", "normal wear and tear", "uso normal"]
  - [ichinichi-de, "一日[いちにち] で 終[お]わる", "be over in one day", "terminar num dia"]
dialogue:
  - [protagonist, "敷金[しききん] が 全額[ぜんがく] 戻[もど]って きません でした。 クリーニング 代[だい] だ そう です。", "We didn't get any of the deposit back. They say it's for cleaning.", "Não devolveram nada da caução. Dizem que é para a limpeza."]
  - [bengoshi, "通常[つうじょう] の 使用[しよう] で できた 汚[よご]れ は、 借主[かりぬし] が 払[はら]う 必要[ひつよう] は ありません。", "Dirt from normal wear and tear doesn't have to be paid by the tenant.", "A sujeira do uso normal não precisa ser paga pelo inquilino."]
  - [protagonist, "証拠[しょうこ] は 入居[にゅうきょ] の 時[とき] の 写真[しゃしん] が あります。", "As evidence, we have photos from when we moved in.", "Como prova, temos fotos de quando entramos."]
  - [bengoshi, "それ は 強[つよ]い 証拠[しょうこ] です。 六十万円[ろくじゅうまんえん] 以下[いか] なら、 少額[しょうがく] 訴訟[そしょう] が 使[つか]えます。", "That's strong evidence. If it's 600,000 yen or less, you can use small-claims court.", "Essa é uma prova forte. Se o valor for até 600 mil ienes, dá para usar o juizado de pequenas causas."]
  - [shota, "弁護士[べんごし] を 頼[たの]まない と だめ です か。", "Do we have to hire a lawyer?", "Precisamos contratar advogado?"]
  - [bengoshi, "いいえ、 本人[ほんにん] だけ で できます。 原則[げんそく] と して 一日[いちにち] で 終[お]わり、 その 日[ひ] に 判決[はんけつ] が 出[で]ます。", "No, you can do it yourselves. In principle it's over in one day, with the ruling that same day.", "Não, vocês mesmos podem entrar. Em princípio termina num dia, com a sentença no mesmo dia."]
  - [protagonist, "和解[わかい] に なる こと も あります か。", "Can it end in a settlement?", "Pode terminar em acordo?"]
  - [bengoshi, "多[おお]い です よ。 被告[ひこく] の 大家[おおや] さん も、 裁判[さいばん] より 和解[わかい] を 選[えら]ぶ こと が よく あります。", "Often. Landlords who are sued often choose to settle rather than go to trial.", "Muitas vezes. O proprietário processado muitas vezes prefere um acordo a ir a julgamento."]
teach:
  - ask: ["Say: a lawyer.", "Diga: um advogado.", "弁護士[べんごし]", bengoshi-item]
  - ask: ["Say: the public legal-support centre.", "Diga: o centro público de apoio jurídico.", "法[ほう] テラス", houterasu]
  - ask: ["Say: a small-claims lawsuit.", "Diga: ação de pequenas causas.", "少額[しょうがく] 訴訟[そしょう]", shougaku-soshou]
  - ask: ["Say: evidence.", "Diga: prova.", "証拠[しょうこ]", shouko]
  - ask: ["Say: normal wear and tear.", "Diga: uso normal.", "通常[つうじょう] の 使用[しよう]", tsuujou-shiyou]
  - ask: ["Say: the plaintiff.", "Diga: o autor da ação.", "原告[げんこく]", genkoku]
  - ask: ["Say: the defendant.", "Diga: o réu.", "被告[ひこく]", hikoku]
  - ask: ["Say: the ruling.", "Diga: a sentença.", "判決[はんけつ]", hanketsu]
  - ask: ["Say: a settlement.", "Diga: um acordo.", "和解[わかい]", wakai]
  - ask: ["Say: be over in one day.", "Diga: terminar num dia.", "一日[いちにち] で 終[お]わる", ichinichi-de]
  - note: ["Legal Japanese is dense with Sino-Japanese words: «原告[げんこく]», «被告[ひこく]», «証拠[しょうこ]», «判決[はんけつ]», «和解[わかい]». Phrases like «原則[げんそく] と して», in principle, hedge carefully. Ordinary wear and tear is the landlord's cost under government guidelines — a common reason deposits are disputed.", "O japonês jurídico é cheio de palavras de origem chinesa: «原告[げんこく]», «被告[ひこく]», «証拠[しょうこ]», «判決[はんけつ]», «和解[わかい]». Expressões como «原則[げんそく] と して», em princípio, ressalvam com cuidado. O desgaste do uso normal fica a cargo do proprietário segundo as diretrizes do governo — motivo comum de disputa pela caução."]
  - note: ["Small-claims court handles money claims up to 600,000 yen, usually in a single hearing, without a lawyer. The «法[ほう] テラス» centres give free or cheap legal advice, with interpreters on request.", "O juizado de pequenas causas cuida de cobranças de até 600 mil ienes, geralmente numa audiência só, sem advogado. Os centros «法[ほう] テラス» dão orientação jurídica gratuita ou barata, com intérprete se pedir."]
  - pt_only: "Lembra o Juizado Especial Cível no Brasil: causa pequena, rápido, sem advogado. E a regra de ouro vale nos dois países — fotografe tudo ao entrar no imóvel."
