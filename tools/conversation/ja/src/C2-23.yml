id: C2-23
protagonist: f
title: ["Saudade", "Saudade"]
situation: ["In Ishida-sensei's class you're asked to explain «saudade» to Japanese people. You reach for 懐かしい, 恋しい, 切ない — and 物の哀れ.", "Na aula do professor Ishida pedem que você explique «saudade» para japoneses. Você recorre a 懐かしい, 恋しい, 切ない — e a 物の哀れ."]
learn: []
culture: —
items:
  - [koishii, "恋[こい]しい", "longing for (someone, something)", "sentir falta, ansiar"]
  - [setsunai, "切[せつ]ない", "bittersweet ache", "aperto no coração"]
  - [mono-no-aware, "物[もの] の 哀[あわ]れ", "the pathos of things (transience)", "a melancolia das coisas (o efêmero)", {rare: true}]
  - [hon-yaku-dekinai, "翻訳[ほんやく] できない 言葉[ことば]", "untranslatable word", "palavra intraduzível"]
  - [hakanai, "儚[はかな]い", "fleeting", "efêmero"]
  - [kanjou, "感情[かんじょう]", "emotion", "emoção"]
  - [chikai, "近[ちか]い", "close (in meaning)", "próximo (no sentido)"]
  - [zenbu-awaseru, "全部[ぜんぶ] 合[あ]わせた", "all of them put together", "tudo junto"]
  - [nuance, "ニュアンス", "nuance", "nuance"]
  - [sakura-no-you-ni, "桜[さくら] の よう に", "like cherry blossoms", "como as cerejeiras"]
dialogue:
  - [kouza-sensei, "ポルトガル語[ご] の「サウダージ」 を 日本語[にほんご] で 説明[せつめい] して ください。", "Please explain the Portuguese “saudade” in Japanese.", "Explique a «saudade» do português em japonês, por favor."]
  - [protagonist, "翻訳[ほんやく] できない 言葉[ことば] です が… 懐[なつ]かしい に 近[ちか]い です。 でも、 もっと 痛[いた]い 感情[かんじょう] です。", "It's an untranslatable word, but… it's close to natsukashii. Yet it's a more painful emotion.", "É uma palavra intraduzível, mas… é próxima de natsukashii. Só que é uma emoção mais dolorida."]
  - [kouza-sensei, "では、「恋[こい]しい」 は？", "Then what about “koishii”?", "E «koishii»?"]
  - [protagonist, "恋[こい]しい も 入[はい]って います。 会[あ]えない 人[ひと] を 思[おも]う 気持[きも]ち。 そして「切[せつ]ない」 も。", "Koishii is in it too — thinking of someone you can't see. And “setsunai” too.", "Koishii também está dentro — pensar em alguém que não se pode ver. E «setsunai» também."]
  - [kouza-sensei, "物[もの] の 哀[あわ]れ と 比[くら]べる と、 どう です か。", "How does it compare with mono no aware?", "E comparando com mono no aware?"]
  - [protagonist, "物[もの] の 哀[あわ]れ は、 桜[さくら] の よう に 儚[はかな]い もの へ の 感動[かんどう] です ね。 サウダージ は、 失[うしな]った もの へ の 愛[あい] です。", "Mono no aware is being moved by fleeting things, like cherry blossoms. Saudade is love for what is lost.", "Mono no aware é a emoção diante do que é efêmero, como as cerejeiras. Saudade é amor pelo que se perdeu."]
  - [kouza-sensei, "見事[みごと] です。 ニュアンス が よく 伝[つた]わりました。", "Splendid. The nuance came across well.", "Excelente. A nuance ficou bem clara."]
  - [protagonist, "全部[ぜんぶ] 合[あ]わせた 気持[きも]ち が、 サウダージ かも しれません。", "Maybe saudade is all of these feelings put together.", "Talvez a saudade seja todos esses sentimentos juntos."]
teach:
  - ask: ["Say: an untranslatable word.", "Diga: palavra intraduzível.", "翻訳[ほんやく] できない 言葉[ことば]", hon-yaku-dekinai]
  - ask: ["Say: emotion.", "Diga: emoção.", "感情[かんじょう]", kanjou]
  - ask: ["Say: close in meaning.", "Diga: próximo no sentido.", "近[ちか]い", chikai]
  - ask: ["Say: longing for.", "Diga: sentir falta, ansiar.", "恋[こい]しい", koishii]
  - ask: ["Say: a bittersweet ache.", "Diga: aperto no coração.", "切[せつ]ない", setsunai]
  - ask: ["Say: fleeting.", "Diga: efêmero.", "儚[はかな]い", hakanai]
  - ask: ["Say: like cherry blossoms.", "Diga: como as cerejeiras.", "桜[さくら] の よう に", sakura-no-you-ni]
  - ask: ["Say: the pathos of things.", "Diga: a melancolia das coisas.", "物[もの] の 哀[あわ]れ", mono-no-aware]
  - ask: ["Say: nuance.", "Diga: nuance.", "ニュアンス", nuance]
  - ask: ["Say: all of them put together.", "Diga: tudo junto.", "全部[ぜんぶ] 合[あ]わせた", zenbu-awaseru]
  - note: ["Explaining an untranslatable word means triangulating with near neighbours: «懐[なつ]かしい» (fond nostalgia), «恋[こい]しい» (longing for someone absent), «切[せつ]ない» (an aching sweetness), and the classical aesthetic «物[もの] の 哀[あわ]れ» — the gentle sadness of things passing.", "Explicar uma palavra intraduzível é triangular com as vizinhas: «懐[なつ]かしい» (nostalgia carinhosa), «恋[こい]しい» (falta de alguém ausente), «切[せつ]ない» (um aperto doce) e a estética clássica «物[もの] の 哀[あわ]れ» — a tristeza mansa das coisas que passam."]
  - pt_only: "Ninguém traduz saudade de verdade. Mas explicar em japonês, usando as palavras deles, é talvez a prova mais bonita de que você chegou ao C2."
