id: B2-17
protagonist: f
title: ["Interpreting for the Brazilians", "Interpretar para os brasileiros"]
situation: ["On the assembly line. Line leader Mori has new safety rules for the Brazilian team; you interpret, turning his words into Portuguese.", "Na linha de montagem. O líder de linha Mori tem regras novas de segurança para a equipe brasileira; você interpreta, passando as palavras dele para o português."]
learn: []
culture: Brazilian workers in Hamamatsu
items:
  - [koujou, "工場[こうじょう]", "factory", "fábrica"]
  - [setsumei, "説明[せつめい]", "explanation", "explicação"]
  - [anzen-item, "安全[あんぜん] 第一[だいいち] で", "with safety first", "com segurança em primeiro lugar"]
  - [you-ni-iu, "〜ように 言[い]う", "tell (someone) to…", "dizer para (alguém)…"]
  - [kaburu-you-ni, "ヘルメット を かぶる ように 言[い]って ください", "please tell them to wear helmets", "diga para eles usarem capacete"]
  - [kikai, "機械[きかい]", "machine", "máquina"]
  - [sawaranai-you-ni, "触[さわ]らない ように", "(so as) not to touch", "para não tocar"]
  - [teishi, "停止[ていし]", "stop (machine)", "parada (da máquina)"]
  - [kinkyuu-teishi, "緊急[きんきゅう] 停止[ていし] ボタン", "emergency stop button", "botão de parada de emergência", {rare: true}]
  - [hiyari-hatto, "ヒヤリ ハット", "near miss", "quase acidente", {rare: true}]
  - [tsutaemasu, "伝[つた]えます", "I'll pass it on", "vou transmitir"]
dialogue:
  - [hanchou, "今日[きょう] から 新[あたら]しい 安全[あんぜん] ルール です。 説明[せつめい] を 通訳[つうやく] して ください。", "New safety rules from today. Please interpret my explanation.", "A partir de hoje, regras novas de segurança. Interprete a minha explicação, por favor."]
  - [protagonist, "はい、 伝[つた]えます。", "Yes, I'll pass it on.", "Certo, vou transmitir."]
  - [hanchou, "工場[こうじょう] に 入[はい]る 時[とき] は、 必[かなら]ず ヘルメット を かぶる ように 言[い]って ください。", "Please tell them to always wear helmets when they enter the factory.", "Diga para eles sempre usarem capacete ao entrar na fábrica."]
  - [protagonist, "わかりました。 機械[きかい] の こと は？", "Understood. What about the machines?", "Entendido. E as máquinas?"]
  - [hanchou, "動[うご]いて いる 機械[きかい] に は 絶対[ぜったい] 触[さわ]らない ように。 おかしい と 思[おも]ったら、 すぐ 緊急[きんきゅう] 停止[ていし] ボタン。", "Never touch a moving machine. If anything seems wrong, the emergency stop button at once.", "Nunca toquem numa máquina em movimento. Se algo parecer estranho, o botão de parada de emergência na hora."]
  - [protagonist, "「ヒヤリ ハット」 は 何[なん] と 訳[やく]せば いい でしょう か。", "How should I translate “hiyari hatto”?", "Como devo traduzir «hiyari hatto»?"]
  - [hanchou, "事故[じこ] に なりそう だった こと。 小[ちい]さな こと でも 報告[ほうこく] する ように 言[い]って ください。", "Something that almost became an accident. Tell them to report even small ones.", "Uma coisa que quase virou acidente. Diga para eles relatarem até as pequenas."]
  - [protagonist, "「quase acidente」 です ね。 全部[ぜんぶ] 伝[つた]えました。 みんな、 安全[あんぜん] 第一[だいいち] で！", "“Quase acidente”, then. I've passed it all on. Everyone — safety first!", "«Quase acidente», então. Transmiti tudo. Pessoal — segurança em primeiro lugar!"]
teach:
  - ask: ["Say: the factory.", "Diga: a fábrica.", "工場[こうじょう]", koujou]
  - ask: ["Say: an explanation.", "Diga: uma explicação.", "説明[せつめい]", setsumei]
  - ask: ["Promise: I'll pass it on.", "Prometa: vou transmitir.", "伝[つた]えます。", tsutaemasu]
  - note: ["Passing on an instruction: a plain verb plus «ように 言[い]う» — «かぶる ように 言[い]って ください», please tell them to wear it; negative «触[さわ]らない ように», tell them not to touch. Interpreters use it all day.", "Repassando uma ordem: verbo simples mais «ように 言[い]う» — «かぶる ように 言[い]って ください», diga para eles usarem; negativo «触[さわ]らない ように», diga para não tocarem. Intérpretes usam o dia inteiro."]
  - ask: ["Say the pattern: tell them to…", "Diga o padrão: dizer para…", "〜ように 言[い]う", you-ni-iu]
  - ask: ["Say what he asked: please tell them to wear helmets.", "Repita o pedido: diga para usarem capacete.", "ヘルメット を かぶる ように 言[い]って ください。", kaburu-you-ni]
  - ask: ["Say: a machine.", "Diga: uma máquina.", "機械[きかい]", kikai]
  - ask: ["Say: so as not to touch.", "Diga: para não tocar.", "触[さわ]らない ように", sawaranai-you-ni]
  - ask: ["Say: stop — a machine stop.", "Diga: parada da máquina.", "停止[ていし]", teishi]
  - ask: ["Say: the emergency stop button.", "Diga: o botão de parada de emergência.", "緊急[きんきゅう] 停止[ていし] ボタン", kinkyuu-teishi]
  - ask: ["Say: a near miss.", "Diga: quase acidente.", "ヒヤリ ハット", hiyari-hatto]
  - ask: ["Shout it to the team: safety first!", "Grite para a equipe: segurança em primeiro lugar!", "安全[あんぜん] 第一[だいいち] で！", anzen-item]
  - note: ["Japanese factories collect «ヒヤリ ハット» — moments that made you go «ヒヤリ» (a chill) or «ハッ» (a gasp) — on the idea that every serious accident is preceded by many near misses. In Hamamatsu many lines have Brazilian staff, and interpreters turn safety rules into Portuguese every day.", "As fábricas japonesas coletam «ヒヤリ ハット» — momentos que deram um «ヒヤリ» (calafrio) ou um «ハッ» (susto) — na ideia de que todo acidente grave é precedido por muitos quase acidentes. Em Hamamatsu muitas linhas têm brasileiros, e intérpretes passam as regras de segurança para o português todo dia."]
  - pt_only: "Interpretar segurança é traduzir também o tom: o japonês diz «絶対[ぜったい] に» — nunca, de jeito nenhum —, e em português o recado tem que sair com a mesma força."
