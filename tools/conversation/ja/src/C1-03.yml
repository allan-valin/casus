id: C1-03
protagonist: f
title: ["The rental contract", "O contrato de aluguel"]
situation: ["You and Shota are looking for a flat together. At the estate agent's, the first-month costs add up fast.", "Você e o Shota estão procurando um apartamento juntos. Na imobiliária, os custos de entrada somam rápido."]
learn: [n3-144]
culture: Key money — check the contract
items:
  - [reikin, "礼金[れいきん]", "key money (non-refundable)", "luvas (não reembolsáveis)", {rare: true}]
  - [shikikin, "敷金[しききん]", "deposit", "caução, depósito"]
  - [hoshounin, "保証人[ほしょうにん]", "guarantor", "fiador"]
  - [koushinryou, "更新料[こうしんりょう]", "renewal fee", "taxa de renovação", {rare: true}]
  - [wo-hajime, "〜を はじめ", "starting with, including", "a começar por, incluindo"]
  - [shikikin-wo-hajime, "敷金[しききん] を はじめ", "starting with the deposit", "a começar pela caução"]
  - [hoshou-gaisha, "保証[ほしょう] 会社[がいしゃ]", "guarantor company", "empresa fiadora"]
  - [madori, "間取[まど]り", "floor plan", "planta (do imóvel)"]
  - [shoki-hiyou, "初期[しょき] 費用[ひよう]", "move-in costs", "custos de entrada"]
  - [genjou-kaifuku, "原状[げんじょう] 回復[かいふく]", "restoring to original state", "devolver como estava", {rare: true}]
  - [keiyaku-kikan, "契約[けいやく] 期間[きかん]", "contract period", "prazo do contrato"]
dialogue:
  - [fudousan, "こちら の 物件[ぶっけん]、 間取[まど]り は 二[に] LDK です。 初期[しょき] 費用[ひよう] は 敷金[しききん] を はじめ、 礼金[れいきん]、 仲介[ちゅうかい] 手数料[てすうりょう] など です。", "This place is a 2LDK. Move-in costs include, starting with the deposit, key money, agency fee and so on.", "Este imóvel tem planta 2LDK. Os custos de entrada incluem, a começar pela caução, as luvas, a taxa da imobiliária etc."]
  - [protagonist, "礼金[れいきん] は 戻[もど]って こない ん です よね。", "Key money doesn't come back, right?", "As luvas não voltam, né?"]
  - [fudousan, "はい、 大家[おおや] さん へ の お礼[れい] です から。 敷金[しききん] は 退去[たいきょ] の 時[とき] に 原状[げんじょう] 回復[かいふく] の 費用[ひよう] を 引[ひ]いて 返[かえ]します。", "Right, it's a thank-you to the landlord. The deposit is returned when you move out, minus repair costs.", "Isso, é um agradecimento ao proprietário. A caução volta na saída, descontado o custo de devolver como estava."]
  - [shota, "保証人[ほしょうにん] は 必要[ひつよう] です か。", "Do we need a guarantor?", "Precisa de fiador?"]
  - [fudousan, "保証[ほしょう] 会社[がいしゃ] を 使[つか]えば、 保証人[ほしょうにん] は 要[い]りません。", "If you use a guarantor company, you don't need a guarantor.", "Usando uma empresa fiadora, não precisa."]
  - [protagonist, "契約[けいやく] 期間[きかん] は？", "And the contract period?", "E o prazo do contrato?"]
  - [fudousan, "二年[にねん] です。 更新[こうしん] の 時[とき] に 更新料[こうしんりょう] が かかります。", "Two years. There's a renewal fee when you renew.", "Dois anos. Na renovação, cobra-se uma taxa."]
  - [protagonist, "契約書[けいやくしょ] を 家[いえ] で ゆっくり 読[よ]んで から、 決[き]めます。", "We'll read the contract at home carefully, then decide.", "Vamos ler o contrato com calma em casa e depois decidimos."]
teach:
  - ask: ["Say: the floor plan.", "Diga: a planta.", "間取[まど]り", madori]
  - ask: ["Say: move-in costs.", "Diga: custos de entrada.", "初期[しょき] 費用[ひよう]", shoki-hiyou]
  - ask: ["Say: the deposit.", "Diga: a caução.", "敷金[しききん]", shikikin]
  - ask: ["Say: key money.", "Diga: luvas.", "礼金[れいきん]", reikin]
  - note: ["«〜を はじめ» is starting with — it names the chief example of a group: «敷金[しききん] を はじめ、 礼金[れいきん]、 手数料[てすうりょう]…», starting with the deposit, key money, fees… Formal, common in announcements.", "«〜を はじめ» é a começar por — cita o exemplo principal de um grupo: «敷金[しききん] を はじめ、 礼金[れいきん]、 手数料[てすうりょう]…», a começar pela caução, as luvas, as taxas… Formal, comum em comunicados."]
  - ask: ["Say the pattern: starting with.", "Diga o padrão: a começar por.", "〜を はじめ", wo-hajime]
  - ask: ["Say: starting with the deposit.", "Diga: a começar pela caução.", "敷金[しききん] を はじめ", shikikin-wo-hajime]
  - ask: ["Say: a guarantor.", "Diga: um fiador.", "保証人[ほしょうにん]", hoshounin]
  - ask: ["Say: a guarantor company.", "Diga: uma empresa fiadora.", "保証[ほしょう] 会社[がいしゃ]", hoshou-gaisha]
  - ask: ["Say: the contract period.", "Diga: o prazo do contrato.", "契約[けいやく] 期間[きかん]", keiyaku-kikan]
  - ask: ["Say: the renewal fee.", "Diga: a taxa de renovação.", "更新料[こうしんりょう]", koushinryou]
  - ask: ["Say: restoring to the original state.", "Diga: devolver como estava.", "原状[げんじょう] 回復[かいふく]", genjou-kaifuku]
  - note: ["Renting in Japan has costs Brazilians don't expect: «礼金[れいきん]», key money, a gift to the landlord that never comes back; «敷金[しききん]», a deposit returned minus repairs; agency fees; and every two years a «更新料[こうしんりょう]». Some flats have no key money — always check the contract and ask what the deposit covers.", "Alugar no Japão tem custos que o brasileiro não espera: «礼金[れいきん]», as luvas, um presente ao proprietário que nunca volta; «敷金[しききん]», uma caução devolvida menos os reparos; a taxa da imobiliária; e a cada dois anos uma «更新料[こうしんりょう]». Alguns imóveis não cobram luvas — sempre leia o contrato e pergunte o que a caução cobre."]
  - pt_only: "No Brasil se fala de fiador, seguro-fiança e três aluguéis de caução. No Japão a empresa fiadora resolve o fiador — mas as luvas são um gasto a mais que não volta."
