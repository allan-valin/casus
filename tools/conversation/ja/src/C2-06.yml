items:
  - [manzai, "漫才[まんざい]", "manzai (double-act comedy)", "manzai (comédia em dupla)", {rare: true}]
  - [warai, "笑[わら]い", "laughter", "risada"]
  - [kuse-ni, "〜くせ に", "even though (critical)", "sendo que, mesmo (crítico)"]
  - [nihonjin-no-kuse-ni, "日本人[にほんじん] の くせ に", "even though you're Japanese", "sendo japonês"]
  - [neta, "ネタ", "material (comedy)", "texto, material (do humor)"]
  - [uketa, "ウケた", "went down well", "fez sucesso, arrancou risada"]
  - [suberu, "滑[すべ]る", "fall flat (joke)", "não ter graça, cair no vazio"]
  - [ai-kata, "相方[あいかた]", "comedy partner", "parceiro de dupla", {rare: true}]
