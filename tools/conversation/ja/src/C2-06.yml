  - [nande-yanen-review, "なんで やねん", "what the heck (Kansai comeback)", "como assim? (resposta do Kansai)"]
dialogue:
  - [kenta, "どうも ー！ ブラジル と 浜松[はままつ] の コンビ です！", "Hellooo! We're the Brazil–Hamamatsu duo!", "Olááá! Somos a dupla Brasil–Hamamatsu!"]
  - [protagonist, "僕[ぼく] は 日本[にほん] に 来[き]て、 お箸[はし] の 使[つか]い方[かた] が 一番[いちばん] 上手[じょうず] に なりました。 納豆[なっとう] も 箸[はし] で 一粒[ひとつぶ] ずつ 食[た]べます。", "Since coming to Japan, the thing I got best at is chopsticks. I eat natto one bean at a time.", "Desde que vim ao Japão, o que eu mais aprendi foi usar hashi. Como natto um grão de cada vez."]
  - [kenta, "なんで やねん！ 一晩[ひとばん] かかる わ！", "What the heck! That'd take all night!", "Como assim?! Vai levar a noite toda!"]
  - [protagonist, "健太[けんた] さん は 日本人[にほんじん] の くせ に、 納豆[なっとう] が 食[た]べられない ん です よ。", "And Kenta here can't even eat natto, even though he's Japanese.", "E o Kenta, sendo japonês, nem consegue comer natto."]
  - [kenta, "それ は 秘密[ひみつ] やろ！ 西[にし] の 方[ほう] の 人[ひと] は 苦手[にがて] な 人[ひと] が 多[おお]い ねん！", "That was a secret! Lots of people in western Japan can't stand it!", "Isso era segredo! Muita gente do oeste do Japão não suporta!"]
  - [protagonist, "…ウケた！ みんな 笑[わら]って る。", "…It went down well! Everyone's laughing.", "…Fez sucesso! Todo mundo está rindo."]
  - [kenta, "間[ま] が よかった。 最初[さいしょ] の ネタ は 滑[すべ]る と 思[おも]った けど。", "The timing was good. I thought the first bit would fall flat.", "O timing foi bom. Achei que a primeira piada ia cair no vazio."]
  - [protagonist, "最高[さいこう] の 相方[あいかた] だ ね。", "You're the best comedy partner.", "Você é o melhor parceiro de dupla."]
teach:
  - ask: ["Say: manzai.", "Diga: manzai.", "漫才[まんざい]", manzai]
  - ask: ["Say: a comedy partner.", "Diga: parceiro de dupla.", "相方[あいかた]", ai-kata]
  - ask: ["Say: comedy material.", "Diga: o material do humor.", "ネタ", neta]
  - ask: ["Say: timing.", "Diga: timing.", "間[ま]", ma]
  - ask: ["Say: laughter.", "Diga: risada.", "笑[わら]い", warai]
  - ask: ["Say: it went down well.", "Diga: fez sucesso.", "ウケた", uketa]
  - ask: ["Say: it fell flat.", "Diga: não teve graça.", "滑[すべ]った", suberu]
  - note: ["«〜くせ に» is even though — with criticism or teasing: «日本人[にほんじん] の くせ に、 納豆[なっとう] が 食[た]べられない», even though he's Japanese, he can't eat natto. Rude if said seriously; in comedy, a playful jab.", "«〜くせ に» é sendo que, mesmo — com crítica ou provocação: «日本人[にほんじん] の くせ に、 納豆[なっとう] が 食[た]べられない», sendo japonês, não consegue comer natto. Grosseiro se dito a sério; no humor, uma alfinetada de brincadeira."]
  - ask: ["Say the pattern: even though (critical).", "Diga o padrão: sendo que (crítico).", "〜くせ に", kuse-ni]
  - ask: ["Tease him: even though you're Japanese.", "Provoque: sendo japonês.", "日本人[にほんじん] の くせ に", nihonjin-no-kuse-ni]
  - ask: ["Give the comeback.", "Dê a resposta.", "なんで やねん", nande-yanen-review]
  - note: ["Manzai is built on «ボケ» and «ツッコミ»: the fool says something absurd, the straight man corrects him sharply, often in Kansai dialect — «なんで やねん», «〜やろ», «〜ねん». Timing, «間[ま]», is everything. Natto, the sticky fermented beans, really is disliked by many people from western Japan.", "O manzai se baseia em «ボケ» e «ツッコミ»: o bobo diz um absurdo, o escada corrige seco, muitas vezes no dialeto do Kansai — «なんで やねん», «〜やろ», «〜ねん». O timing, «間[ま]», é tudo. O natto, o feijão fermentado e grudento, é mesmo detestado por muita gente do oeste do Japão."]
  - pt_only: "A dupla bobo e escada é velha conhecida: Os Trapalhões, os palhaços de circo. O manzai é a mesma ideia, com ritmo de metralhadora e tapa na cabeça."
