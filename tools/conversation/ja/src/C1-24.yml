id: C1-24
protagonist: m
title: ["The renovation", "A reforma"]
situation: ["You and Yui bought an old house. Before the renovation starts, the builder takes you round the neighbours with towels as greeting gifts.", "Você e a Yui compraram uma casa velha. Antes de a reforma começar, o empreiteiro leva vocês para cumprimentar os vizinhos com toalhas de presente."]
learn: []
culture: Greeting neighbours before work
items:
  - [rifoomu, "リフォーム", "renovation", "reforma"]
  - [kouji, "工事[こうじ]", "construction work", "obra"]
  - [tsuide-ni, "〜ついで に", "while (you're at it)", "aproveitando que, de passagem"]
  - [aisatsu-no-tsuide, "挨拶[あいさつ] の ついで に", "while greeting (them)", "aproveitando o cumprimento"]
  - [souon-review, "ご迷惑[めいわく] を おかけ します", "we'll cause you some trouble", "vamos causar algum transtorno"]
  - [kouki, "工期[こうき]", "construction period", "prazo da obra", {rare: true}]
  - [taoru-review, "タオル", "towel (as a greeting gift)", "toalha (de presente)"]
  - [daiku, "大工[だいく]", "carpenter", "carpinteiro"]
  - [chuushajou, "駐車場[ちゅうしゃじょう]", "parking", "estacionamento"]
  - [yoroshiku-onegai-itashimasu-review, "何卒[なにとぞ] よろしく お願[ねが]い いたします", "we humbly ask for your understanding", "contamos com a sua compreensão"]
dialogue:
  - [protagonist, "来週[らいしゅう] から 隣[となり] で リフォーム の 工事[こうじ] を します。 ご迷惑[めいわく] を おかけ します。", "From next week we'll be renovating next door. We'll cause you some trouble.", "A partir da semana que vem vamos reformar a casa ao lado. Vamos causar algum transtorno."]
  - [suzuki, "まあ、 ご丁寧[ていねい] に。 工期[こうき] は どの くらい？", "Oh, how thoughtful. How long will the work take?", "Ah, que gentileza. Quanto tempo vai levar a obra?"]
  - [protagonist, "二[に] か月[げつ] です。 朝[あさ] 九時[くじ] から 夕方[ゆうがた] 五時[ごじ] まで。 これ、 つまらない もの です が…", "Two months. Nine in the morning to five in the evening. This is just a little something…", "Dois meses. Das nove da manhã às cinco da tarde. Isto é só uma lembrancinha…"]
  - [suzuki, "タオル です ね。 ありがとう。 大工[だいく] さん の 車[くるま] は どこ に？", "Towels. Thank you. Where will the carpenters park?", "Toalhas. Obrigada. Onde os carpinteiros vão estacionar?"]
  - [protagonist, "近[ちか]く の 駐車場[ちゅうしゃじょう] を 借[か]りました。 道[みち] に は 止[と]めません。", "We've rented a parking space nearby. They won't park on the street.", "Alugamos uma vaga num estacionamento perto. Não vão parar na rua."]
  - [suzuki, "それ なら 安心[あんしん]。 ご挨拶[あいさつ] の ついで に、 うち の 野菜[やさい] も 持[も]って 行[い]って。", "Then I'm reassured. And since you're here, take some of my vegetables.", "Assim fico tranquila. E aproveitando a visita, leve umas verduras minhas."]
  - [protagonist, "いつも すみません。 何卒[なにとぞ] よろしく お願[ねが]い いたします。", "Thank you, as always. We humbly ask for your understanding.", "Sempre tão gentil. Contamos com a sua compreensão."]
  - [suzuki, "引[ひ]っ越[こ]して きたら、 今度[こんど] は ご近所[きんじょ] さん です ね。", "Once you move in, we'll be neighbours again.", "Quando se mudarem, seremos vizinhos de novo."]
teach:
  - ask: ["Say: a renovation.", "Diga: uma reforma.", "リフォーム", rifoomu]
  - ask: ["Say: construction work.", "Diga: obra.", "工事[こうじ]", kouji]
  - ask: ["Say: the construction period.", "Diga: o prazo da obra.", "工期[こうき]", kouki]
  - ask: ["Say: a carpenter.", "Diga: um carpinteiro.", "大工[だいく]", daiku]
  - ask: ["Say: parking.", "Diga: estacionamento.", "駐車場[ちゅうしゃじょう]", chuushajou]
  - ask: ["Warn the neighbour: we'll cause you some trouble.", "Avise o vizinho: vamos causar algum transtorno.", "ご迷惑[めいわく] を おかけ します。", souon-review]
  - ask: ["Say: a towel — the greeting gift.", "Diga: toalha — o presente de cumprimento.", "タオル", taoru-review]
  - note: ["«〜ついで に» is while you're at it — doing a second thing on the occasion of the first: «挨拶[あいさつ] の ついで に», while greeting; «買[か]い物[もの] の ついで に 郵便局[ゆうびんきょく] へ», drop by the post office while shopping.", "«〜ついで に» é aproveitando — fazer uma segunda coisa na ocasião da primeira: «挨拶[あいさつ] の ついで に», aproveitando o cumprimento; «買[か]い物[もの] の ついで に 郵便局[ゆうびんきょく] へ», passar no correio aproveitando as compras."]
  - ask: ["Say the pattern: while you're at it.", "Diga o padrão: aproveitando.", "〜ついで に", tsuide-ni]
  - ask: ["Say: while greeting them.", "Diga: aproveitando o cumprimento.", "挨拶[あいさつ] の ついで に", aisatsu-no-tsuide]
  - ask: ["Ask humbly for understanding.", "Peça humildemente compreensão.", "何卒[なにとぞ] よろしく お願[ねが]い いたします。", yoroshiku-onegai-itashimasu-review]
  - note: ["Before building work, you and the builder visit the neighbours on both sides, across the street and behind — «向[む]こう 三軒[さんげん] 両隣[りょうどなり]» — with a small gift, often towels or detergent, giving the dates, hours and parking plan. It prevents most complaints before they start.", "Antes de uma obra, você e o empreiteiro visitam os vizinhos dos dois lados, da frente e dos fundos — «向[む]こう 三軒[さんげん] 両隣[りょうどなり]» — com um presentinho, muitas vezes toalhas ou detergente, informando datas, horários e onde vão estacionar. Isso evita a maioria das reclamações antes que comecem."]
  - pt_only: "No Brasil a gente avisa o vizinho da obra, quando avisa. No Japão o aviso tem roteiro, presente e lista de casas — e funciona."
