id: A1-11
protagonist: f
title: [The business card, O cartão de visita]
situation: ["Mr Yamada from a supplier visits the factory. Chief Sato introduces you. Cards come out.", "O senhor Yamada, de um fornecedor, visita a fábrica. A chefe Sato apresenta você. Os cartões aparecem."]
learn: [n5-010]
culture: Cards with both hands
items:
  - [meishi, "名刺[めいし]", "business card", "cartão de visita"]
  - [choudai, "頂戴[ちょうだい] します", "I humbly receive it", "recebo com gratidão"]
  - [ryoute-de, "両手[りょうて] で", "with both hands", "com as duas mãos"]
  - [wo, "を", "(marks the object)", "(marca o objeto)"]
  - [douzo-yoroshiku, "どうぞ よろしく", "pleased to meet you (short)", "muito prazer (curto)"]
  - [mochimasu, "持[も]ちます", "hold", "segurar"]
  - [mimasu, "見[み]ます", "look at", "olhar"]
  - [tsukue, "机[つくえ]", "desk, table", "mesa"]
  - [oku, "置[お]きます", "put, place", "colocar"]
  - [kochira-koso, "こちら こそ", "likewise, the pleasure is mine", "igualmente"]
  - [shoukai, "紹介[しょうかい] します", "let me introduce", "apresento"]
dialogue:
  - [sato, "山田[やまだ] さん、 紹介[しょうかい] します。 新[あたら]しい 通訳[つうやく] です。", "Mr Yamada, let me introduce our new interpreter.", "Senhor Yamada, apresento nossa nova intérprete."]
  - [yamada, "はじめまして。 山田[やまだ] です。", "Nice to meet you. I'm Yamada.", "Muito prazer. Sou Yamada."]
  - [protagonist, "はじめまして。 どうぞ よろしく お願[ねが]いします。", "Nice to meet you. Pleased to meet you.", "Muito prazer. É um prazer conhecê-lo."]
  - [yamada, "こちら こそ。 名刺[めいし] を どうぞ。", "Likewise. Here is my card.", "Igualmente. Aqui está meu cartão."]
  - [protagonist, "頂戴[ちょうだい] します。", "Thank you, I receive it.", "Recebo com gratidão."]
  - [sato, "名刺[めいし] は 両手[りょうて] で 持[も]ちます。 そして、 よく 見[み]ます。", "You hold the card with both hands. And look at it well.", "O cartão se segura com as duas mãos. E se olha bem."]
  - [protagonist, "ポケット は？", "In the pocket?", "No bolso?"]
  - [sato, "いいえ。 会議[かいぎ] の 間[あいだ] は 机[つくえ] の 上[うえ] に 置[お]きます。", "No. During the meeting you put it on the table.", "Não. Durante a reunião ele fica em cima da mesa."]
teach:
  - ask: ["Say: pleased to meet you, the short way.", "Diga: muito prazer, a forma curta.", "どうぞ よろしく。", douzo-yoroshiku]
  - ask: ["He says the pleasure is his. How?", "Ele diz que o prazer é dele. Como?", "こちら こそ。", kochira-koso]
  - note: ["«を» marks the object, the thing you hold or give: «名刺[めいし] を どうぞ» — here, the card.", "«を» marca o objeto, a coisa que se segura ou se dá: «名刺[めいし] を どうぞ» — aqui está o cartão."]
  - ask: ["Offer your card.", "Ofereça seu cartão.", "名刺[めいし] を どうぞ。", meishi, wo]
  - note: ["Receiving it, say «頂戴[ちょうだい] します» — a humble 'I receive'.", "Ao receber, diga «頂戴[ちょうだい] します» — um 'recebo' humilde."]
  - ask: ["Receive his card.", "Receba o cartão dele.", "頂戴[ちょうだい] します。", choudai]
  - ask: ["Say: with both hands.", "Diga: com as duas mãos.", "両手[りょうて] で", ryoute-de]
  - ask: ["Say: I hold the card with both hands.", "Diga: seguro o cartão com as duas mãos.", "名刺[めいし] を 両手[りょうて] で 持[も]ちます。", meishi, ryoute-de, mochimasu]
  - ask: ["Say: I look at it well.", "Diga: olho bem.", "よく 見[み]ます。", mimasu]
  - ask: ["Say: I put it on the table.", "Diga: coloco em cima da mesa.", "机[つくえ] の 上[うえ] に 置[お]きます。", tsukue, oku]
  - ask: ["Introduce Kenta to someone.", "Apresente o Kenta a alguém.", "健太[けんた] さん を 紹介[しょうかい] します。", shoukai, wo]
  - note: ["A business card is the person: given and taken with both hands, read, kept on the table during the meeting, never written on or pocketed in front of them.", "O cartão de visita é a pessoa: dado e recebido com as duas mãos, lido, deixado sobre a mesa durante a reunião, nunca rabiscado nem guardado no bolso na frente dela."]
