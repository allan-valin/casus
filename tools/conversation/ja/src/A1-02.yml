id: A1-02
protagonist: m
title: [The genkan, O genkan]
situation: ["Mrs Suzuki shows you the flat. At the door there is a low step — the genkan.", "A senhora Suzuki mostra o apartamento. Na porta há um degrau baixo — o genkan."]
learn: []
culture: Shoes off, slippers on — and toilet slippers
items:
  - [genkan, "玄関[げんかん]", "entrance hall (where shoes come off)", "entrada (onde se tiram os sapatos)"]
  - [kutsu, "靴[くつ]", "shoes", "sapatos"]
  - [surippa, "スリッパ", "slippers", "chinelos"]
  - [douzo, "どうぞ", "please (go ahead / here you are)", "por favor (pode entrar / aqui está)"]
  - [shitsurei, "失礼[しつれい] します", "excuse me (entering)", "com licença (ao entrar)"]
  - [koko, "ここ", "here", "aqui"]
  - [kore, "これ", "this (near me)", "isto (perto de mim)"]
  - [sore, "それ", "that (near you)", "isso (perto de você)"]
  - [nan-desu-ka, "何[なん] です か", "what is it?", "o que é?"]
  - [toire, "トイレ", "toilet", "banheiro"]
  - [no-particle, "の", "'s / of", "de (posse)"]
  - [arigatou, "ありがとう ございます", "thank you (polite)", "obrigado (educado)"]
  - [wakarimashita, "わかりました", "understood / I see", "entendi"]
dialogue:
  - [suzuki, "どうぞ。 ここ は 玄関[げんかん] です。", "Please come in. This is the genkan.", "Pode entrar. Aqui é o genkan."]
  - [protagonist, "失礼[しつれい] します。", "Excuse me.", "Com licença."]
  - [suzuki, "あ、 靴[くつ]！ 靴[くつ] は ここ です。", "Oh, your shoes! Shoes stay here.", "Ah, os sapatos! Os sapatos ficam aqui."]
  - [protagonist, "すみません。 これ は 何[なん] です か。", "Sorry. What is this?", "Desculpe. O que é isto?"]
  - [suzuki, "それ は スリッパ です。 どうぞ。", "Those are slippers. Here you are.", "Isso são chinelos. Aqui estão."]
  - [protagonist, "ありがとう ございます。", "Thank you.", "Obrigado."]
  - [suzuki, "これ は トイレ の スリッパ です。", "These are the toilet slippers.", "Estes são os chinelos do banheiro."]
  - [protagonist, "トイレ の スリッパ？ はい、 わかりました。", "Toilet slippers? Yes, I see.", "Chinelos do banheiro? Sim, entendi."]
teach:
  - note: ["When you enter someone's home, say «失礼[しつれい] します» — literally 'I commit a rudeness'.", "Ao entrar na casa de alguém, diga «失礼[しつれい] します» — literalmente 'cometo uma falta de educação'."]
  - ask: ["Enter, politely.", "Entre, com educação.", "失礼[しつれい] します。", shitsurei]
  - note: ["The low step at the door is the «玄関[げんかん]». Shoes stay there, always.", "O degrau baixo na porta é o «玄関[げんかん]». Os sapatos ficam ali, sempre."]
  - ask: ["Say: shoes.", "Diga: sapatos.", "靴[くつ]", kutsu]
  - ask: ["Say: the genkan.", "Diga: o genkan.", "玄関[げんかん]", genkan]
  - ask: ["Say: shoes stay here — 'shoes, here it is'.", "Diga: os sapatos ficam aqui — 'sapatos, é aqui'.", "靴[くつ] は ここ です。", kutsu, koko]
  - note: ["«これ» is something near you, «それ» something near the other person. «何[なん] です か» asks what it is.", "«これ» é algo perto de você, «それ» algo perto da outra pessoa. «何[なん] です か» pergunta o que é."]
  - ask: ["Point at something near you and ask what it is.", "Aponte para algo perto de você e pergunte o que é.", "これ は 何[なん] です か。", kore, nan-desu-ka]
  - ask: ["She holds slippers. Say: those are slippers.", "Ela segura chinelos. Diga: isso são chinelos.", "それ は スリッパ です。", sore, surippa]
  - ask: ["She hands them to you with «どうぞ». Thank her.", "Ela entrega com «どうぞ». Agradeça.", "ありがとう ございます。", arigatou]
  - note: ["«の» joins two nouns like 'de': «トイレ の スリッパ» — slippers of the toilet. They stay in the toilet; never walk out in them.", "«の» junta dois substantivos como 'de': «トイレ の スリッパ» — chinelos do banheiro. Ficam no banheiro; nunca saia com eles."]
  - ask: ["Say: toilet slippers.", "Diga: chinelos do banheiro.", "トイレ の スリッパ", toire, no-particle, surippa]
  - ask: ["Say: I see, understood.", "Diga: entendi.", "わかりました。", wakarimashita]
  - ask: ["Offer her something: here you are.", "Ofereça algo a ela: aqui está.", "どうぞ。", douzo]
  - pt_only: "No Brasil muita gente entra de sapato em casa. No Japão, nunca — e no tatame, nem de chinelo."
