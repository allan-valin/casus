id: A2-13
protagonist: f
title: [A night out, Uma noite fora]
situation: ["Saturday night in Shizuoka city with Kenta and his friends: a club, dancing — and the last train home leaves at 23:30.", "Sábado à noite na cidade de Shizuoka com o Kenta e os amigos: uma balada, dança — e o último trem para casa sai às 23:30."]
learn: []
culture: The last-train rule
items:
  - [kurabu, "クラブ", "club (for dancing)", "balada, casa noturna"]
  - [shuuden, "終電[しゅうでん]", "the last train", "o último trem", {rare: true}]
  - [odorimasu, "踊[おど]ります", "dance", "danço"]
  - [mibunshou, "身分証[みぶんしょう]", "ID", "documento de identidade", {rare: true}]
  - [nanji-made, "何時[なんじ] まで", "until what time", "até que horas"]
  - [tara, "〜たら", "when, if (once…)", "quando, se (assim que…)"]
  - [owattara, "終[お]わったら", "when it's over", "quando acabar"]
  - [nogashitara, "逃[のが]したら", "if (you) miss it", "se perder"]
  - [netto-kafe, "ネット カフェ", "internet café (with booths to sleep)", "lan house com cabines (para dormir)", {rare: true}]
  - [takushii, "タクシー", "taxi", "táxi"]
  - [isoide, "急[いそ]いで", "hurry", "rápido, corre"]
dialogue:
  - [kenta, "入口[いりぐち] で 身分証[みぶんしょう] を 見[み]せて。 二十歳[はたち] 以上[いじょう] だけ。", "Show your ID at the door. Over twenty only.", "Mostre o documento na entrada. Só maiores de vinte."]
  - [protagonist, "在留[ざいりゅう] カード で いい？", "Is the residence card okay?", "O cartão de residência serve?"]
  - [kenta, "うん。 さあ、 踊[おど]ろう！", "Yeah. Come on, let's dance!", "Serve. Bora dançar!"]
  - [protagonist, "楽[たの]しい！ でも 何時[なんじ] まで いる？", "Fun! But until what time are we staying?", "Que divertido! Mas vamos ficar até que horas?"]
  - [kenta, "終電[しゅうでん] は 十一時[じゅういちじ] 半[はん]。 逃[のが]したら、 朝[あさ] まで 帰[かえ]れない よ。", "The last train is at half past eleven. If we miss it, we can't get home till morning.", "O último trem é às onze e meia. Se perder, só volta de manhã."]
  - [protagonist, "タクシー は？", "What about a taxi?", "E táxi?"]
  - [kenta, "浜松[はままつ] まで は すごく 高[たか]い。 逃[のが]したら、 ネット カフェ で 寝[ね]る。", "To Hamamatsu it's really expensive. If we miss it, we sleep at an internet café.", "Até Hamamatsu é caríssimo. Se perder, dorme na lan house."]
  - [protagonist, "え、 もう 十一時[じゅういちじ] 十分[じゅっぷん]！ 急[いそ]いで！", "What, it's already ten past eleven! Hurry!", "Nossa, já são onze e dez! Corre!"]
teach:
  - ask: ["Say: a club.", "Diga: uma balada.", "クラブ", kurabu]
  - ask: ["Say: ID.", "Diga: documento de identidade.", "身分証[みぶんしょう]", mibunshou]
  - ask: ["Say: I dance.", "Diga: eu danço.", "踊[おど]ります。", odorimasu]
  - ask: ["Ask: until what time?", "Pergunte: até que horas?", "何時[なんじ] まで？", nanji-made]
  - ask: ["Say: the last train.", "Diga: o último trem.", "終電[しゅうでん]", shuuden]
  - note: ["«〜たら» is when or if — once something happens: take the plain past and add «ら». «終[お]わります» → «終[お]わった» → «終[お]わったら», when it's over. «逃[のが]したら», if you miss it.", "«〜たら» é quando ou se — assim que algo acontecer: pegue o passado simples e acrescente «ら». «終[お]わります» → «終[お]わった» → «終[お]わったら», quando acabar. «逃[のが]したら», se perder."]
  - ask: ["Say the ending: when, if.", "Diga a terminação: quando, se.", "〜たら", tara]
  - ask: ["Say: when it's over.", "Diga: quando acabar.", "終[お]わったら", owattara]
  - ask: ["Say: if we miss the last train.", "Diga: se a gente perder o último trem.", "終電[しゅうでん] を 逃[のが]したら", nogashitara]
  - ask: ["Say: a taxi.", "Diga: um táxi.", "タクシー", takushii]
  - ask: ["Say: an internet café.", "Diga: uma lan house.", "ネット カフェ", netto-kafe]
  - ask: ["Tell them to hurry.", "Diga para eles correrem.", "急[いそ]いで！", isoide]
  - note: ["Trains stop around midnight, and a taxi between cities costs a fortune. Miss the «終電[しゅうでん]» and many wait for the first train in a «ネット カフェ» or «漫画[まんが] 喫茶[きっさ]»: a small booth with a reclining chair, comics, free drinks, sometimes a shower, by the hour or as a night pack. Clubs check ID at the door; the legal age is twenty.", "Os trens param por volta da meia-noite, e um táxi entre cidades custa uma fortuna. Quem perde o «終電[しゅうでん]» muitas vezes espera o primeiro trem numa «ネット カフェ» ou «漫画[まんが] 喫茶[きっさ]»: uma cabine com poltrona reclinável, mangás, bebida liberada, às vezes chuveiro, por hora ou num pacote para a noite. As baladas pedem documento na entrada; a idade mínima é vinte anos."]
  - pt_only: "No Brasil a balada vai até o sol nascer e a volta é de Uber. No Japão é o horário do último trem que manda — ou se fica até o primeiro."
