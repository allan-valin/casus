id: B1-28
protagonist: m
title: ["The rainy season", "A estação das chuvas"]
situation: ["June. Three weeks of rain, and black spots on your bathroom wall and the back of your shoes. Mrs Suzuki inspects.", "Junho. Três semanas de chuva, e manchas pretas na parede do banheiro e atrás dos sapatos. A senhora Suzuki inspeciona."]
learn: [n3-003, n3-004]
culture: —
items:
  - [shikke, "湿気[しっけ]", "humidity, damp", "umidade"]
  - [kabi, "カビ", "mould", "mofo, bolor"]
  - [aida-ni, "〜間[あいだ] に", "while, during (before it ends)", "enquanto, durante (antes de acabar)"]
  - [hareteiru-aida-ni, "晴[は]れて いる 間[あいだ] に", "while it's sunny", "enquanto está sol"]
  - [joshitsuki, "除湿機[じょしつき]", "dehumidifier", "desumidificador", {rare: true}]
  - [mado-wo-akeru, "窓[まど] を 開[あ]ける", "open the window", "abrir a janela"]
  - [kawakasu, "乾[かわ]かす", "dry (something)", "secar"]
  - [jimejime, "じめじめ", "damp and muggy", "úmido e abafado"]
  - [heya-boshi, "部屋[へや] 干[ぼ]し", "drying laundry indoors", "secar roupa dentro de casa", {rare: true}]
  - [sentakumono, "洗濯物[せんたくもの]", "laundry", "roupa lavada"]
  - [tsuyu-ake, "梅雨[つゆ] 明[あ]け", "end of the rainy season", "fim da estação das chuvas", {rare: true}]
dialogue:
  - [suzuki, "まあ、 カビ が 出[で]て います ね。 湿気[しっけ] が 多[おお]い から。", "Oh, there's mould. It's the damp.", "Nossa, apareceu mofo. É a umidade."]
  - [protagonist, "毎日[まいにち] じめじめ して、 洗濯物[せんたくもの] も 乾[かわ]きません。", "It's muggy every day, and the laundry won't dry.", "Todo dia abafado, e a roupa não seca."]
  - [suzuki, "梅雨[つゆ] の 間[あいだ] は 部屋[へや] 干[ぼ]し です よ。 除湿機[じょしつき] を 使[つか]って。", "During the rainy season you dry indoors. Use a dehumidifier.", "Na estação das chuvas se seca dentro de casa. Use um desumidificador."]
  - [protagonist, "除湿機[じょしつき]？ ブラジル で は 使[つか]った こと が ありません。", "A dehumidifier? I've never used one in Brazil.", "Desumidificador? Nunca usei no Brasil."]
  - [suzuki, "晴[は]れて いる 間[あいだ] に、 窓[まど] を 開[あ]けて 空気[くうき] を 入[い]れて ください。", "While it's sunny, open the windows and let the air in.", "Enquanto estiver sol, abra as janelas e deixe o ar entrar."]
  - [protagonist, "靴[くつ] の カビ は？", "And the mould on my shoes?", "E o mofo dos sapatos?"]
  - [suzuki, "拭[ふ]いて、 よく 乾[かわ]かして ください。 新聞紙[しんぶんし] を 入[い]れる と いい です よ。", "Wipe them and dry them well. Newspaper inside helps.", "Limpe e seque bem. Pôr jornal dentro ajuda."]
  - [protagonist, "梅雨[つゆ] 明[あ]け が 待[ま]ち遠[どお]しい です。", "I can't wait for the rainy season to end.", "Não vejo a hora de acabar a estação das chuvas."]
teach:
  - ask: ["Say: humidity, damp.", "Diga: umidade.", "湿気[しっけ]", shikke]
  - ask: ["Say: mould.", "Diga: mofo.", "カビ", kabi]
  - ask: ["Say: damp and muggy.", "Diga: úmido e abafado.", "じめじめ", jimejime]
  - ask: ["Say: laundry.", "Diga: roupa lavada.", "洗濯物[せんたくもの]", sentakumono]
  - ask: ["Say: drying laundry indoors.", "Diga: secar roupa dentro de casa.", "部屋[へや] 干[ぼ]し", heya-boshi]
  - ask: ["Say: a dehumidifier.", "Diga: um desumidificador.", "除湿機[じょしつき]", joshitsuki]
  - note: ["«〜間[あいだ] に» is while — during a period, before it ends: «晴[は]れて いる 間[あいだ] に», while it's sunny (do it before the rain comes back). Without «に», «間[あいだ]» means the whole time: «梅雨[つゆ] の 間[あいだ] は» — throughout the rainy season.", "«〜間[あいだ] に» é enquanto — dentro de um período, antes que acabe: «晴[は]れて いる 間[あいだ] に», enquanto está sol (faça antes que a chuva volte). Sem «に», «間[あいだ]» é o tempo todo: «梅雨[つゆ] の 間[あいだ] は» — durante toda a estação das chuvas."]
  - ask: ["Say the pattern: while, during.", "Diga o padrão: enquanto, durante.", "〜間[あいだ] に", aida-ni]
  - build: [hareteiru-aida-ni, ["間[あいだ] に", "いる 間[あいだ] に", "晴[は]れて いる 間[あいだ] に"]]
  - ask: ["Say: while it's sunny.", "Diga: enquanto está sol.", "晴[は]れて いる 間[あいだ] に", hareteiru-aida-ni]
  - ask: ["Say: open the window.", "Diga: abrir a janela.", "窓[まど] を 開[あ]ける", mado-wo-akeru]
  - ask: ["Say: dry it.", "Diga: secar.", "乾[かわ]かす", kawakasu]
  - ask: ["Say: the end of the rainy season.", "Diga: o fim da estação das chuvas.", "梅雨[つゆ] 明[あ]け", tsuyu-ake]
  - note: ["«梅雨[つゆ]» lasts from about early June to mid-July in most of Japan. Damp gets into everything: dehumidifiers, moisture absorbers in closets, indoor drying and airing on sunny days are part of the routine. The news announces «梅雨[つゆ] 明[あ]け» — then real summer starts.", "O «梅雨[つゆ]» vai mais ou menos do começo de junho a meados de julho na maior parte do Japão. A umidade entra em tudo: desumidificador, absorvedor de umidade nos armários, roupa secando dentro de casa e janelas abertas nos dias de sol fazem parte da rotina. O noticiário anuncia o «梅雨[つゆ] 明[あ]け» — aí começa o verão de verdade."]
  - pt_only: "Quem é de São Paulo conhece o mofo de inverno; o do Japão é o mesmo inimigo, só que no início do verão e mais teimoso."
