id: A1-18
protagonist: m
title: [Food and cooking, Comida e cozinha]
situation: ["Mrs Suzuki teaches you to cook rice and miso soup in her kitchen.", "A senhora Suzuki ensina você a fazer arroz e missoshiru na cozinha dela."]
learn: [n5-053]
culture: —
items:
  - [gohan, "ご飯[はん]", "cooked rice; a meal", "arroz cozido; refeição"]
  - [misoshiru, "味噌汁[みそしる]", "miso soup", "sopa de missô", {rare: true}]
  - [kome, "米[こめ]", "uncooked rice", "arroz cru"]
  - [aratte, "洗[あら]って ください", "please wash (it)", "lave, por favor"]
  - [irete, "入[い]れて ください", "please put (it) in", "coloque, por favor"]
  - [mite, "見[み]て ください", "please look", "olhe, por favor"]
  - [suihanki, "炊飯器[すいはんき]", "rice cooker", "panela de arroz elétrica", {rare: true}]
  - [mizu, "水[みず]", "water", "água"]
  - [tofu, "豆腐[とうふ]", "tofu", "tofu"]
  - [kantan, "簡単[かんたん]", "easy, simple", "fácil, simples"]
  - [takimasu, "炊[た]きます", "cook (rice)", "cozinho (arroz)", {rare: true}]
dialogue:
  - [suzuki, "まず、 お米[こめ] を 洗[あら]って ください。", "First, please wash the rice.", "Primeiro, lave o arroz."]
  - [protagonist, "何回[なんかい] です か。", "How many times?", "Quantas vezes?"]
  - [suzuki, "三回[さんかい] ぐらい。 水[みず] が きれい に なります。", "About three times. The water turns clear.", "Umas três vezes. A água fica limpa."]
  - [protagonist, "ブラジル で は 油[あぶら] と にんにく で 炊[た]きます。", "In Brazil we cook it with oil and garlic.", "No Brasil a gente faz com óleo e alho."]
  - [suzuki, "へえ、 おいしそう。 日本[にほん] は 水[みず] だけ です。 炊飯器[すいはんき] に 入[い]れて ください。", "Oh, sounds tasty. In Japan it's just water. Put it in the rice cooker.", "Ah, parece gostoso. No Japão é só água. Coloque na panela de arroz."]
  - [protagonist, "味噌汁[みそしる] は？", "And the miso soup?", "E o missoshiru?"]
  - [suzuki, "お湯[ゆ] に 味噌[みそ] と 豆腐[とうふ]。 見[み]て ください、 簡単[かんたん] でしょう？", "Miso and tofu in hot water. Look, it's easy, isn't it?", "Missô e tofu na água quente. Olhe, é fácil, não é?"]
  - [protagonist, "本当[ほんとう] に 簡単[かんたん] です ね！", "It really is easy!", "É fácil mesmo!"]
teach:
  - ask: ["Say: rice (cooked); a meal.", "Diga: arroz (cozido); refeição.", "ご飯[はん]", gohan]
  - ask: ["Say: miso soup.", "Diga: missoshiru.", "味噌汁[みそしる]", misoshiru]
  - ask: ["Say: uncooked rice.", "Diga: arroz cru.", "お米[こめ]", kome]
  - note: ["To ask someone to do something: the verb's «て» form + «ください». «洗[あら]います» → «洗[あら]って ください» — please wash it.", "Para pedir que alguém faça algo: a forma «て» do verbo + «ください». «洗[あら]います» → «洗[あら]って ください» — lave, por favor."]
  - ask: ["Ask her to wash the rice.", "Peça para ela lavar o arroz.", "お米[こめ] を 洗[あら]って ください。", kome, aratte]
  - ask: ["Ask: put it in the rice cooker.", "Peça: coloque na panela de arroz.", "炊飯器[すいはんき] に 入[い]れて ください。", suihanki, irete]
  - ask: ["Say: please look.", "Diga: olhe, por favor.", "見[み]て ください。", mite]
  - ask: ["Say: water.", "Diga: água.", "水[みず]", mizu]
  - ask: ["Say: in Brazil we cook rice with garlic.", "Diga: no Brasil a gente faz arroz com alho.", "ブラジル で は にんにく で 炊[た]きます。", takimasu]
  - ask: ["Say: it's easy.", "Diga: é fácil.", "簡単[かんたん] です。", kantan]
  - ask: ["Say: tofu.", "Diga: tofu.", "豆腐[とうふ]", tofu]
  - pt_only: "ご飯 quer dizer arroz e também refeição — como 'pão nosso de cada dia'. 朝ご飯, 昼ご飯, 晩ご飯: café da manhã, almoço, jantar."
