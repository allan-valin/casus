id: B1-23
protagonist: f
title: ["The konbini at night", "O konbini à noite"]
situation: ["Midnight at the convenience store. The clerk is Lucas, a Brazilian from Londrina, studying a Japanese textbook between customers. The manager is restocking.", "Meia-noite na loja de conveniência. O atendente é o Lucas, um brasileiro de Londrina, estudando um livro de japonês entre um cliente e outro. O gerente está repondo as prateleiras."]
learn: [n4-004, n3-047]
culture: Foreign workers — a social problem
items:
  - [yakin, "夜勤[やきん]", "night shift", "turno da noite"]
  - [gaikokujin-roudousha, "外国人[がいこくじん] 労働者[ろうどうしゃ]", "foreign workers", "trabalhadores estrangeiros", {rare: true}]
  - [nagara, "〜ながら", "while (doing two things)", "enquanto (fazendo duas coisas)"]
  - [benkyou-shinagara, "勉強[べんきょう] しながら", "while studying", "enquanto estuda"]
  - [hatarakinagara, "働[はたら]きながら", "while working", "enquanto trabalha"]
  - [jikyuu, "時給[じきゅう]", "hourly wage", "salário por hora"]
  - [hitode-busoku, "人手[ひとで] 不足[ぶそく]", "labour shortage", "falta de mão de obra"]
  - [ryuugakusei, "留学生[りゅうがくせい]", "international student", "estudante estrangeiro"]
  - [taihen, "大変[たいへん]", "tough, hard", "puxado, difícil"]
  - [nemui, "眠[ねむ]い", "sleepy", "com sono"]
  - [tasukaru, "助[たす]かります", "it's a big help", "ajuda muito"]
dialogue:
  - [protagonist, "あれ、 ブラジル の 人[ひと]？ 夜勤[やきん]、 大変[たいへん] でしょう。", "Oh, are you Brazilian? The night shift must be tough.", "Opa, você é brasileiro? O turno da noite deve ser puxado."]
  - [lucas, "うん、 ちょっと 眠[ねむ]い。 でも 働[はたら]きながら 日本語[にほんご] を 勉強[べんきょう] して る。", "Yeah, a bit sleepy. But I study Japanese while I work.", "É, dá um soninho. Mas estudo japonês enquanto trabalho."]
  - [protagonist, "すごい！ 時給[じきゅう] は いい の？", "Great! Is the hourly pay good?", "Que legal! O salário por hora é bom?"]
  - [lucas, "夜[よる] は 少[すこ]し 高[たか]い。 昼[ひる] は 学校[がっこう]。", "A bit higher at night. School in the day.", "À noite é um pouco mais alto. De dia, escola."]
  - [tencho, "ルーカス くん、 よく 頑張[がんば]って くれる ん です よ。 人手[ひとで] 不足[ぶそく] だ から、 本当[ほんとう] に 助[たす]かります。", "Lucas works really hard for us. We're short of staff, so it's a big help.", "O Lucas se esforça muito. Está faltando gente, então ajuda demais."]
  - [protagonist, "外国人[がいこくじん] 労働者[ろうどうしゃ] は 増[ふ]えて います か。", "Are foreign workers increasing?", "Os trabalhadores estrangeiros estão aumentando?"]
  - [tencho, "ええ。 コンビニ も 工場[こうじょう] も、 留学生[りゅうがくせい] や 外国[がいこく] の 人[ひと] が いない と 回[まわ]りません。", "Yes. Konbini and factories can't run without international students and foreign workers.", "Sim. Loja de conveniência e fábrica não funcionam sem estudantes e trabalhadores estrangeiros."]
  - [lucas, "でも 言葉[ことば] や ビザ の 問題[もんだい] も ある。 簡単[かんたん] じゃ ない よ。", "But there are language and visa problems too. It's not easy.", "Mas tem o problema da língua e do visto também. Não é fácil."]
teach:
  - ask: ["Say: the night shift.", "Diga: o turno da noite.", "夜勤[やきん]", yakin]
  - ask: ["Say: sleepy.", "Diga: com sono.", "眠[ねむ]い", nemui]
  - ask: ["Say: tough, hard.", "Diga: puxado.", "大変[たいへん]", taihen]
  - note: ["«〜ながら» is doing two things at once: the verb stem plus «ながら» — «働[はたら]きながら», while working; «勉強[べんきょう] しながら», while studying. The main action comes last: «働[はたら]きながら 勉強[べんきょう] する», study while working.", "«〜ながら» é fazer duas coisas ao mesmo tempo: radical do verbo mais «ながら» — «働[はたら]きながら», enquanto trabalha; «勉強[べんきょう] しながら», enquanto estuda. A ação principal vem por último: «働[はたら]きながら 勉強[べんきょう] する», estudar enquanto trabalha."]
  - ask: ["Say the ending: while.", "Diga a terminação: enquanto.", "〜ながら", nagara]
  - ask: ["Say: while working.", "Diga: enquanto trabalha.", "働[はたら]きながら", hatarakinagara]
  - ask: ["Say: while studying.", "Diga: enquanto estuda.", "勉強[べんきょう] しながら", benkyou-shinagara]
  - ask: ["Say: the hourly wage.", "Diga: o salário por hora.", "時給[じきゅう]", jikyuu]
  - ask: ["Say: labour shortage.", "Diga: falta de mão de obra.", "人手[ひとで] 不足[ぶそく]", hitode-busoku]
  - ask: ["Say: foreign workers.", "Diga: trabalhadores estrangeiros.", "外国人[がいこくじん] 労働者[ろうどうしゃ]", gaikokujin-roudousha]
  - ask: ["Say: an international student.", "Diga: um estudante estrangeiro.", "留学生[りゅうがくせい]", ryuugakusei]
  - ask: ["Say: it's a big help.", "Diga: ajuda muito.", "助[たす]かります。", tasukaru]
  - note: ["With an ageing population, Japan depends more and more on foreign workers — in convenience stores, factories, farms and care homes. Many are students allowed to work limited hours. Long hours, language barriers and visa rules make it hard; it is one of the country's big debates.", "Com a população envelhecendo, o Japão depende cada vez mais de trabalhadores estrangeiros — em lojas de conveniência, fábricas, lavouras e casas de repouso. Muitos são estudantes que podem trabalhar um número limitado de horas. Jornada longa, barreira da língua e regras de visto tornam tudo difícil; é um dos grandes debates do país."]
  - pt_only: "Para os brasileiros de Hamamatsu, isso não é novidade: desde 1990 a comunidade trabalha nas fábricas. Hoje divide o espaço com vietnamitas, nepaleses, filipinos e muitos outros."
