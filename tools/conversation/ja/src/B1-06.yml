id: B1-06
protagonist: m
title: [Energy, Energia]
situation: ["Summer. The factory asks everyone to save electricity. At lunch Kenta and Chief Sato talk about nuclear power — the Hamaoka plant is not far from Hamamatsu.", "Verão. A fábrica pede a todos que economizem energia. No almoço o Kenta e a chefe Sato falam de energia nuclear — a usina de Hamaoka fica perto de Hamamatsu."]
learn: [n3-079]
culture: —
items:
  - [genpatsu, "原発[げんぱつ]", "nuclear power plant", "usina nuclear"]
  - [enerugii, "エネルギー", "energy", "energia"]
  - [setsuden, "節電[せつでん]", "saving electricity", "economia de energia"]
  - [taiyoukou, "太陽光[たいようこう]", "solar power", "energia solar"]
  - [node, "〜ので", "because, so (polite reason)", "como, porque (motivo educado)"]
  - [atsui-node, "暑[あつ]い ので", "because it's hot", "como está calor"]
  - [jiko, "事故[じこ]", "accident", "acidente"]
  - [anzen-mondai, "安全[あんぜん] の 問題[もんだい]", "a safety issue", "uma questão de segurança"]
  - [sansei-favour, "賛成[さんせい]", "in favour", "a favor"]
  - [hantai, "反対[はんたい]", "against", "contra"]
  - [denkidai, "電気代[でんきだい]", "electricity bill", "conta de luz"]
dialogue:
  - [sato, "今年[ことし] も 節電[せつでん] を お願[ねが]いします。 エアコン は 二十八度[にじゅうはちど] に して ください。", "Please save electricity again this year. Set the air conditioning to 28 degrees.", "Este ano também, economizem energia, por favor. Ar-condicionado em 28 graus."]
  - [kenta, "暑[あつ]い ので、 二十八度[にじゅうはちど] は つらい です ね。", "It's hot, so 28 is tough.", "Como está calor, 28 graus é sofrido."]
  - [protagonist, "どうして 節電[せつでん] が 必要[ひつよう] な ん です か。", "Why do we need to save electricity?", "Por que precisa economizar energia?"]
  - [sato, "2011 年[ねん] の 事故[じこ] の 後[あと]、 原発[げんぱつ] が 止[と]まった ので。 浜岡[はまおか] 原発[げんぱつ] も まだ 止[と]まって います。", "After the 2011 accident the nuclear plants stopped. Hamaoka is still stopped.", "Depois do acidente de 2011 as usinas nucleares pararam. Hamaoka continua parada."]
  - [kenta, "電気代[でんきだい] も 高[たか]く なった し。", "And the electricity bill went up.", "E a conta de luz subiu."]
  - [protagonist, "原発[げんぱつ] に は 賛成[さんせい] です か、 反対[はんたい] です か。", "Are you for or against nuclear power?", "Vocês são a favor ou contra a energia nuclear?"]
  - [sato, "難[むずか]しい です ね。 安全[あんぜん] の 問題[もんだい] も ある し、 エネルギー も 必要[ひつよう] です。", "It's difficult. There's the safety issue, and we need energy too.", "É difícil. Tem a questão de segurança, e a energia também é necessária."]
  - [kenta, "僕[ぼく] は 太陽光[たいようこう] が もっと 増[ふ]えて ほしい。", "I want more solar power.", "Eu queria mais energia solar."]
teach:
  - ask: ["Say: energy.", "Diga: energia.", "エネルギー", enerugii]
  - ask: ["Say: saving electricity.", "Diga: economia de energia.", "節電[せつでん]", setsuden]
  - ask: ["Say: the electricity bill.", "Diga: a conta de luz.", "電気代[でんきだい]", denkidai]
  - note: ["«ので» gives a reason like «から», but softer and more polite — good for explaining yourself at work: «暑[あつ]い ので» — since it's hot. After nouns and «な» words it becomes «な ので».", "«ので» dá um motivo como «から», mas mais suave e educado — bom para se explicar no trabalho: «暑[あつ]い ので» — como está calor. Depois de substantivos e palavras com «な» vira «な ので»."]
  - ask: ["Say the word: because — politely.", "Diga a palavra: porque — educado.", "〜ので", node]
  - ask: ["Say: because it's hot.", "Diga: como está calor.", "暑[あつ]い ので", atsui-node]
  - ask: ["Say: a nuclear power plant.", "Diga: uma usina nuclear.", "原発[げんぱつ]", genpatsu]
  - ask: ["Say: an accident.", "Diga: um acidente.", "事故[じこ]", jiko]
  - ask: ["Say: a safety issue.", "Diga: uma questão de segurança.", "安全[あんぜん] の 問題[もんだい]", anzen-mondai]
  - ask: ["Say: in favour.", "Diga: a favor.", "賛成[さんせい]", sansei-favour]
  - ask: ["Say: against.", "Diga: contra.", "反対[はんたい]", hantai]
  - ask: ["Say: solar power.", "Diga: energia solar.", "太陽光[たいようこう]", taiyoukou]
  - note: ["After the 2011 earthquake and the Fukushima accident, Japan stopped its nuclear plants; some have restarted since, others, like Hamaoka in Shizuoka, have not. Summer «節電[せつでん]» campaigns ask offices to set air conditioning to 28 °C. Opinions are divided, and people say so carefully.", "Depois do terremoto de 2011 e do acidente de Fukushima, o Japão parou suas usinas nucleares; algumas voltaram desde então, outras, como Hamaoka em Shizuoka, não. Campanhas de «節電[せつでん]» no verão pedem aos escritórios ar-condicionado em 28 °C. As opiniões são divididas, e ditas com cuidado."]
  - pt_only: "O Brasil vive de hidrelétricas, e usina nuclear é coisa de Angra. No Japão, sem rios grandes nem petróleo, a energia é uma questão nacional sempre em debate."
