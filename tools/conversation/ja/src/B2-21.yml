id: B2-21
protagonist: f
title: ["Religion", "Religião"]
situation: ["Shota shows you round Kyoto at last: a shrine in the morning, a Buddhist temple after lunch. You ask what his religion is. He has to think.", "O Shota finalmente leva você para conhecer Kyoto: um santuário de manhã, um templo budista depois do almoço. Você pergunta qual é a religião dele. Ele precisa pensar."]
learn: []
culture: Shinto and Buddhism side by side
items:
  - [otera, "お寺[てら]", "Buddhist temple", "templo budista"]
  - [shintou, "神道[しんとう]", "Shinto", "xintoísmo", {rare: true}]
  - [bukkyou, "仏教[ぶっきょう]", "Buddhism", "budismo"]
  - [toka, "〜とか 〜とか", "things like … and …", "coisas como … e …"]
  - [hatsumoude, "初詣[はつもうで]", "first shrine visit of the year", "primeira visita ao santuário no ano", {rare: true}]
  - [shuukyou, "宗教[しゅうきょう]", "religion", "religião"]
  - [torii, "鳥居[とりい]", "shrine gate", "portal do santuário", {rare: true}]
  - [omamori, "お守[まも]り", "amulet, charm", "amuleto"]
  - [omikuji, "おみくじ", "fortune slip", "papel da sorte"]
  - [kami-sama, "神様[かみさま]", "the gods, a god", "os deuses, um deus"]
  - [osoushiki, "お葬式[そうしき]", "funeral", "funeral"]
dialogue:
  - [shota, "ここ が 神社[じんじゃ]。 鳥居[とりい] を くぐる 前[まえ] に、 お辞儀[じぎ] する ん だ よ。", "This is the shrine. You bow before passing through the gate.", "Este é o santuário. Antes de passar pelo portal, a gente faz uma reverência."]
  - [protagonist, "翔太[しょうた] の 宗教[しゅうきょう] は 何[なに]？ 神道[しんとう]？ 仏教[ぶっきょう]？", "What's your religion, Shota? Shinto? Buddhism?", "Qual é a sua religião, Shota? Xintoísmo? Budismo?"]
  - [shota, "うーん… 両方[りょうほう] かな。 お正月[しょうがつ] は 神社[じんじゃ] に 初詣[はつもうで]、 お葬式[そうしき] は お寺[てら]。", "Hmm… both, I guess. New Year at the shrine, funerals at the temple.", "Hum… os dois, acho. Ano-novo no santuário, funeral no templo."]
  - [protagonist, "クリスマス も する でしょ？", "And you do Christmas too, right?", "E vocês também fazem Natal, né?"]
  - [shota, "する する。 ケーキ とか チキン とか。 でも 宗教[しゅうきょう] と して じゃ ない。", "We do. Cake and chicken and so on. But not as religion.", "Fazemos, sim. Bolo, frango e tal. Mas não como religião."]
  - [protagonist, "お守[まも]り を 買[か]おう か な。 おみくじ も 引[ひ]きたい。", "Maybe I'll buy an amulet. And I want to draw a fortune too.", "Acho que vou comprar um amuleto. E quero tirar um papel da sorte."]
  - [shota, "…大吉[だいきち]！ 神様[かみさま] は 君[きみ] の 味方[みかた] だ ね。", "…Great luck! The gods are on your side.", "…Grande sorte! Os deuses estão do seu lado."]
  - [protagonist, "午後[ごご] は お寺[てら] で、 仏様[ほとけさま] に も お願[ねが]い しなきゃ。", "This afternoon at the temple I'd better ask the Buddha too.", "À tarde, no templo, tenho que pedir ao Buda também."]
teach:
  - ask: ["Say: religion.", "Diga: religião.", "宗教[しゅうきょう]", shuukyou]
  - ask: ["Say: Shinto.", "Diga: xintoísmo.", "神道[しんとう]", shintou]
  - ask: ["Say: Buddhism.", "Diga: budismo.", "仏教[ぶっきょう]", bukkyou]
  - ask: ["Say: a Buddhist temple.", "Diga: um templo budista.", "お寺[てら]", otera]
  - ask: ["Say: the shrine gate.", "Diga: o portal do santuário.", "鳥居[とりい]", torii]
  - ask: ["Say: the gods.", "Diga: os deuses.", "神様[かみさま]", kami-sama]
  - note: ["«〜とか 〜とか» lists examples loosely — things like this and that: «ケーキ とか チキン とか», cake, chicken and so on. More casual than «〜や 〜など».", "«〜とか 〜とか» lista exemplos de forma solta — coisas como isso e aquilo: «ケーキ とか チキン とか», bolo, frango e tal. Mais informal que «〜や 〜など»."]
  - ask: ["Say the pattern: things like … and …", "Diga o padrão: coisas como … e …", "〜とか 〜とか", toka]
  - ask: ["Say: the first shrine visit of the year.", "Diga: a primeira visita ao santuário no ano.", "初詣[はつもうで]", hatsumoude]
  - ask: ["Say: a funeral.", "Diga: um funeral.", "お葬式[そうしき]", osoushiki]
  - ask: ["Say: an amulet.", "Diga: um amuleto.", "お守[まも]り", omamori]
  - ask: ["Say: a fortune slip.", "Diga: um papel da sorte.", "おみくじ", omikuji]
  - note: ["Most Japanese take part in both Shinto and Buddhism without feeling they belong to either: shrines for births, New Year and good luck; temples for funerals and ancestors. A «鳥居[とりい]» marks a shrine; incense and a Buddha mark a temple.", "A maioria dos japoneses participa do xintoísmo e do budismo sem sentir que pertence a nenhum: santuário para nascimento, ano-novo e boa sorte; templo para funeral e antepassados. O «鳥居[とりい]» marca o santuário; incenso e uma imagem de Buda marcam o templo."]
  - pt_only: "Lembra o brasileiro que é católico, vai ao centro espírita e pula sete ondas no réveillon: misturar crenças é normal nos dois países."
