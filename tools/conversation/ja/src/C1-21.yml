id: C1-21
protagonist: f
title: ["Permanent residence", "Residência permanente"]
situation: ["Married to Shota and living in Japan for years now, you apply for permanent residence at the immigration office. The officer goes through the requirements.", "Casada com o Shota e morando no Japão há anos, você pede a residência permanente no escritório de imigração. A atendente repassa os requisitos."]
learn: [n2-194]
culture: Check the current rules
items:
  - [eijuuken, "永住権[えいじゅうけん]", "permanent residency", "residência permanente", {rare: true}]
  - [zairyuu-shikaku, "在留[ざいりゅう] 資格[しかく]", "residence status", "status de residência", {rare: true}]
  - [shinsa, "審査[しんさ]", "review, screening", "análise"]
  - [ni-oujite, "〜に 応[おう]じて", "according to, depending on", "de acordo com, conforme"]
  - [jijou-ni-oujite, "状況[じょうきょう] に 応[おう]じて", "depending on the situation", "conforme a situação"]
  - [nouzei-shoumei, "納税[のうぜい] 証明書[しょうめいしょ]", "tax payment certificate", "certidão de impostos pagos", {rare: true}]
  - [mimoto-hoshounin, "身元[みもと] 保証人[ほしょうにん]", "personal guarantor", "fiador pessoal", {rare: true}]
  - [haiguusha, "配偶者[はいぐうしゃ]", "spouse", "cônjuge"]
  - [youken, "要件[ようけん]", "requirement", "requisito"]
  - [shinsei-review, "申請[しんせい] 書[しょ]", "application form", "formulário de requerimento"]
  - [kekka-tsuuchi, "結果[けっか] の 通知[つうち]", "notice of the result", "aviso do resultado"]
dialogue:
  - [madoguchi, "永住権[えいじゅうけん] の 申請[しんせい] です ね。 今[いま] の 在留[ざいりゅう] 資格[しかく] は？", "An application for permanent residency. Your current residence status?", "Pedido de residência permanente, certo. Qual é o seu status de residência atual?"]
  - [protagonist, "日本人[にほんじん] の 配偶者[はいぐうしゃ] です。 結婚[けっこん] して 三年[さんねん] に なります。", "Spouse of a Japanese national. We've been married three years.", "Cônjuge de japonês. Estamos casados há três anos."]
  - [madoguchi, "要件[ようけん] を 満[み]たして います ね。 納税[のうぜい] 証明書[しょうめいしょ] と 年金[ねんきん] の 記録[きろく] も 必要[ひつよう] です。", "You meet the requirements. We also need tax payment certificates and your pension record.", "Você atende aos requisitos. Também precisamos das certidões de impostos e do histórico da previdência."]
  - [protagonist, "住民税[じゅうみんぜい] は 全部[ぜんぶ] 払[はら]って います。", "I've paid all my residence tax.", "Paguei todo o imposto de residência."]
  - [madoguchi, "それ は 大事[だいじ] です。 書類[しょるい] は 状況[じょうきょう] に 応[おう]じて 追加[ついか] で お願[ねが]い する こと も あります。", "That's important. Depending on the case, we may ask for additional documents.", "Isso é importante. Conforme o caso, podemos pedir documentos adicionais."]
  - [protagonist, "審査[しんさ] に は どの くらい かかります か。", "How long does the review take?", "Quanto tempo leva a análise?"]
  - [madoguchi, "数[すう] か月[げつ] かかる こと が 多[おお]い です。 結果[けっか] の 通知[つうち] は はがき で 届[とど]きます。", "It often takes several months. The notice of the result comes by postcard.", "Muitas vezes leva alguns meses. O aviso do resultado chega por cartão-postal."]
  - [protagonist, "わかりました。 身元[みもと] 保証人[ほしょうにん] は 夫[おっと] に 頼[たの]みます。", "Understood. I'll ask my husband to be my guarantor.", "Entendido. Vou pedir ao meu marido para ser o fiador."]
teach:
  - ask: ["Say: permanent residency.", "Diga: residência permanente.", "永住権[えいじゅうけん]", eijuuken]
  - ask: ["Say: residence status.", "Diga: status de residência.", "在留[ざいりゅう] 資格[しかく]", zairyuu-shikaku]
  - ask: ["Say: a spouse.", "Diga: cônjuge.", "配偶者[はいぐうしゃ]", haiguusha]
  - ask: ["Say: a requirement.", "Diga: um requisito.", "要件[ようけん]", youken]
  - ask: ["Say: the application form.", "Diga: o formulário de requerimento.", "申請[しんせい] 書[しょ]", shinsei-review]
  - ask: ["Say: a tax payment certificate.", "Diga: certidão de impostos pagos.", "納税[のうぜい] 証明書[しょうめいしょ]", nouzei-shoumei]
  - ask: ["Say: a personal guarantor.", "Diga: um fiador pessoal.", "身元[みもと] 保証人[ほしょうにん]", mimoto-hoshounin]
  - ask: ["Say: review, screening.", "Diga: análise.", "審査[しんさ]", shinsa]
  - note: ["«〜に 応[おう]じて» is according to, in response to — the outcome adjusts: «状況[じょうきょう] に 応[おう]じて», depending on the situation; «収入[しゅうにゅう] に 応[おう]じた 税金[ぜいきん]», tax according to income. Official, common on forms and notices.", "«〜に 応[おう]じて» é de acordo com, conforme — o resultado se ajusta: «状況[じょうきょう] に 応[おう]じて», conforme a situação; «収入[しゅうにゅう] に 応[おう]じた 税金[ぜいきん]», imposto conforme a renda. Oficial, comum em formulários e avisos."]
  - ask: ["Say the pattern: according to.", "Diga o padrão: de acordo com.", "〜に 応[おう]じて", ni-oujite]
  - ask: ["Say: depending on the situation.", "Diga: conforme a situação.", "状況[じょうきょう] に 応[おう]じて", jijou-ni-oujite]
  - ask: ["Say: the notice of the result.", "Diga: o aviso do resultado.", "結果[けっか] の 通知[つうち]", kekka-tsuuchi]
  - note: ["Permanent residence usually needs around ten years in Japan, but spouses of Japanese nationals can apply after about three years of marriage and one in Japan. Paid taxes, pension and insurance weigh heavily in the review. The rules change — always check the Immigration Services Agency before applying.", "A residência permanente em geral pede uns dez anos no Japão, mas cônjuges de japoneses podem pedir depois de cerca de três anos de casamento e um no Japão. Impostos, previdência e seguro em dia pesam muito na análise. As regras mudam — sempre confira na Agência de Imigração antes de pedir."]
  - pt_only: "Para muitos brasileiros, o «永住[えいじゅう]» é o fim da renovação de visto a cada poucos anos. Mas imposto ou previdência atrasados podem atrapalhar — guarde todos os comprovantes."
