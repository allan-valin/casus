id: B2-25
protagonist: f
title: ["Home office", "Home office"]
situation: ["Two days a week you now work from home. An online meeting with Chief Sato — and a contract that still needs a stamp in the office.", "Dois dias por semana você agora trabalha de casa. Uma reunião online com a chefe Sato — e um contrato que ainda precisa de carimbo no escritório."]
learn: []
culture: The hanko obstacle
items:
  - [zaitaku-kinmu, "在宅[ざいたく] 勤務[きんむ]", "working from home", "trabalho em casa", {rare: true}]
  - [onrain-kaigi, "オンライン 会議[かいぎ]", "online meeting", "reunião online"]
  - [shussha, "出社[しゅっしゃ]", "going in to the office", "ir ao escritório"]
  - [shuuchuu, "集中[しゅうちゅう]", "concentration", "concentração"]
  - [tokoro, "〜ところ", "just about to / in the middle of / just did", "prestes a / no meio de / acabou de"]
  - [iku-tokoro, "行[い]く ところ", "about to go", "prestes a ir"]
  - [shite-iru-tokoro, "して いる ところ", "in the middle of doing", "no meio de fazer"]
  - [owatta-tokoro, "終[お]わった ところ", "just finished", "acabou de terminar"]
  - [oto-ga-kikoenai, "音[おと] が 聞[き]こえません", "I can't hear (you)", "não estou ouvindo"]
  - [myuuto, "ミュート", "mute", "mudo"]
  - [denshi-in, "電子[でんし] 印鑑[いんかん]", "electronic seal", "carimbo eletrônico", {rare: true}]
dialogue:
  - [sato, "もしもし、 聞[き]こえます か。", "Hello, can you hear me?", "Alô, está me ouvindo?"]
  - [protagonist, "すみません、 音[おと] が 聞[き]こえません… あ、 ミュート でした。", "Sorry, I can't hear… ah, I was on mute.", "Desculpe, não estou ouvindo… ah, estava no mudo."]
  - [sato, "在宅[ざいたく] 勤務[きんむ] は どう です か。", "How's working from home?", "Como está o trabalho em casa?"]
  - [protagonist, "集中[しゅうちゅう] できます。 ちょうど 翻訳[ほんやく] が 終[お]わった ところ です。", "I can concentrate. I've just finished the translation.", "Consigo me concentrar. Acabei de terminar a tradução."]
  - [sato, "よかった。 契約書[けいやくしょ] は どう？", "Good. What about the contract?", "Ótimo. E o contrato?"]
  - [protagonist, "今[いま] 確認[かくにん] して いる ところ です が、 判子[はんこ] が 必要[ひつよう] です。", "I'm in the middle of checking it, but it needs a stamp.", "Estou conferindo agora, mas precisa de carimbo."]
  - [sato, "まだ 電子[でんし] 印鑑[いんかん] に なって いない ん です よね。 明日[あした] 出社[しゅっしゃ] できます か。", "It's not on electronic seals yet, is it. Can you come in tomorrow?", "Ainda não passou para carimbo eletrônico, né? Você pode ir ao escritório amanhã?"]
  - [protagonist, "はい、 判子[はんこ] の ため に 出社[しゅっしゃ] します。 ちょうど 今[いま]、 お昼[ひる] に 行[い]く ところ でした。", "Yes, I'll come in for the stamp. I was just about to go for lunch.", "Sim, vou ao escritório pelo carimbo. Eu estava prestes a sair para almoçar."]
teach:
  - ask: ["Say: working from home.", "Diga: trabalho em casa.", "在宅[ざいたく] 勤務[きんむ]", zaitaku-kinmu]
  - ask: ["Say: an online meeting.", "Diga: uma reunião online.", "オンライン 会議[かいぎ]", onrain-kaigi]
  - ask: ["Say: I can't hear you.", "Diga: não estou ouvindo.", "音[おと] が 聞[き]こえません。", oto-ga-kikoenai]
  - ask: ["Say: mute.", "Diga: mudo.", "ミュート", myuuto]
  - ask: ["Say: concentration.", "Diga: concentração.", "集中[しゅうちゅう]", shuuchuu]
  - note: ["«ところ» pins the moment: plain verb + «ところ», about to — «行[い]く ところ»; «〜て いる ところ», in the middle of — «確認[かくにん] して いる ところ»; past + «ところ», just did — «終[お]わった ところ».", "«ところ» marca o momento: verbo simples + «ところ», prestes a — «行[い]く ところ»; «〜て いる ところ», no meio de — «確認[かくにん] して いる ところ»; passado + «ところ», acabou de — «終[お]わった ところ»."]
  - ask: ["Say the word that pins the moment.", "Diga a palavra que marca o momento.", "〜ところ", tokoro]
  - ask: ["Say: about to go.", "Diga: prestes a ir.", "行[い]く ところ", iku-tokoro]
  - ask: ["Say: in the middle of doing.", "Diga: no meio de fazer.", "して いる ところ", shite-iru-tokoro]
  - ask: ["Say: just finished.", "Diga: acabou de terminar.", "終[お]わった ところ", owatta-tokoro]
  - ask: ["Say: going in to the office.", "Diga: ir ao escritório.", "出社[しゅっしゃ]", shussha]
  - ask: ["Say: an electronic seal.", "Diga: carimbo eletrônico.", "電子[でんし] 印鑑[いんかん]", denshi-in]
  - note: ["The pandemic pushed Japanese offices online, but paper and the «判子[はんこ]» kept pulling people back in: «判子[はんこ] 出社[しゅっしゃ]», going in just to stamp documents, became a phrase. The government has since cut hanko from most of its procedures, and electronic seals are spreading.", "A pandemia levou os escritórios japoneses para o online, mas o papel e o «判子[はんこ]» puxavam as pessoas de volta: «判子[はんこ] 出社[しゅっしゃ]», ir ao escritório só para carimbar, virou expressão. O governo já tirou o carimbo da maioria dos seus procedimentos, e o carimbo eletrônico está se espalhando."]
  - pt_only: "No Brasil a assinatura digital pegou rápido. No Japão o carimbo resistiu à pandemia — e ainda tem gente indo ao escritório só por causa dele."
