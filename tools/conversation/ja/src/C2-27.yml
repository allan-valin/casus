id: C2-27
protagonist: f
title: ["The inheritance", "A herança"]
situation: ["Mrs Suzuki, now eighty, has decided to move in with her daughter in Tokyo. She asks you to help sort the house — and tells you what will happen to it.", "A senhora Suzuki, agora com oitenta anos, decidiu morar com a filha em Tóquio. Ela pede que você ajude a arrumar a casa — e conta o que vai acontecer com ela."]
learn: []
culture: —
items:
  - [souzoku, "相続[そうぞく]", "inheritance (process)", "herança (processo), sucessão"]
  - [isan, "遺産[いさん]", "estate, legacy", "patrimônio deixado, herança"]
  - [katazuke, "片付[かたづ]け", "tidying, sorting out", "arrumação"]
  - [shuukatsu, "終活[しゅうかつ]", "preparing for the end of life", "preparação para o fim da vida", {rare: true}]
  - [akiya, "空[あ]き家[や]", "empty house", "casa vazia"]
  - [yuigonsho, "遺言[ゆいごん] 書[しょ]", "will (document)", "testamento"]
  - [omoide-no-shina, "思[おも]い出[で] の 品[しな]", "keepsakes", "objetos de recordação"]
  - [te-shimau-farewell, "手放[てばな]す", "let go of, part with", "desfazer-se de"]
  - [uketsugu, "受[う]け継[つ]ぐ", "inherit, take on", "herdar, receber"]
  - [sumi-tsuzukeru, "住[す]み続[つづ]ける", "keep living (there)", "continuar morando"]
dialogue:
  - [suzuki, "娘[むすめ] の 所[ところ] へ 行[い]く こと に した ん です よ。 この 家[いえ] の 片付[かたづ]け、 手伝[てつだ]って くれる？", "I've decided to go to my daughter's. Will you help me sort out this house?", "Decidi ir para a casa da minha filha. Você me ajuda a arrumar esta casa?"]
  - [protagonist, "もちろん です。 でも… 寂[さび]しく なります。", "Of course. But… I'll miss you.", "Claro. Mas… vou sentir falta."]
  - [suzuki, "これ も 終活[しゅうかつ] です。 遺言[ゆいごん] 書[しょ] も 書[か]きました。 子供[こども] たち が 相続[そうぞく] で もめない よう に ね。", "This is part of preparing for the end too. I've written a will, so the children don't quarrel over the inheritance.", "Isso também é preparar o fim da vida. Já escrevi o testamento, para os filhos não brigarem pela herança."]
  - [protagonist, "この 家[いえ] は 空[あ]き家[や] に なる ん です か。", "Will the house be left empty?", "A casa vai ficar vazia?"]
  - [suzuki, "空[あ]き家[や] は 町[まち] の 問題[もんだい] に なる から… あなた たち が 住[す]み続[つづ]けて くれたら、 嬉[うれ]しい わ。", "Empty houses become a problem for the town… I'd be happy if you two lived on here.", "Casa vazia vira problema para a cidade… Eu ficaria feliz se vocês continuassem morando aqui."]
  - [protagonist, "私[わたし]たち が？ 家族[かぞく] と 相談[そうだん] します。", "Us? I'll talk it over with the family.", "Nós? Vou conversar com a família."]
  - [suzuki, "思[おも]い出[で] の 品[しな] は ほとんど 手放[てばな]す けど、 この 畑[はたけ] は 誰[だれ] か に 受[う]け継[つ]いで ほしい の。", "I'm letting go of most of the keepsakes, but I'd like someone to take on this vegetable garden.", "Vou me desfazer da maioria das recordações, mas queria que alguém herdasse esta horta."]
  - [protagonist, "畑[はたけ] は、 私[わたし] が 守[まも]ります。 トマト の 育[そだ]て方[かた]、 全部[ぜんぶ] 教[おし]えて ください。", "I'll look after the garden. Teach me everything about growing tomatoes.", "A horta, eu cuido. Me ensine tudo sobre plantar tomate."]
teach:
  - ask: ["Say: tidying, sorting out.", "Diga: arrumação.", "片付[かたづ]け", katazuke]
  - ask: ["Say: preparing for the end of life.", "Diga: preparação para o fim da vida.", "終活[しゅうかつ]", shuukatsu]
  - ask: ["Say: a will.", "Diga: um testamento.", "遺言[ゆいごん] 書[しょ]", yuigonsho]
  - ask: ["Say: inheritance, succession.", "Diga: herança, sucessão.", "相続[そうぞく]", souzoku]
  - ask: ["Say: estate, legacy.", "Diga: patrimônio, herança.", "遺産[いさん]", isan]
  - ask: ["Say: an empty house.", "Diga: uma casa vazia.", "空[あ]き家[や]", akiya]
  - ask: ["Say: keepsakes.", "Diga: objetos de recordação.", "思[おも]い出[で] の 品[しな]", omoide-no-shina]
  - ask: ["Say: let go of, part with.", "Diga: desfazer-se de.", "手放[てばな]す", te-shimau-farewell]
  - ask: ["Say: inherit, take on.", "Diga: herdar, receber.", "受[う]け継[つ]ぐ", uketsugu]
  - ask: ["Say: keep living there.", "Diga: continuar morando.", "住[す]み続[つづ]ける", sumi-tsuzukeru]
  - note: ["«終活[しゅうかつ]» — preparing for the end of life — is openly discussed in Japan: writing a will, sorting belongings, deciding where to live. Japan has millions of «空[あ]き家[や]», empty houses, as owners age and children live in cities; towns encourage new residents to take them over.", "O «終活[しゅうかつ]» — preparar o fim da vida — é discutido abertamente no Japão: escrever testamento, organizar os pertences, decidir onde morar. O Japão tem milhões de «空[あ]き家[や]», casas vazias, porque os donos envelhecem e os filhos moram nas cidades; as prefeituras incentivam novos moradores a assumi-las."]
  - pt_only: "No Brasil se evita falar de testamento com a avó. A senhora Suzuki fala com calma — e entrega a horta como quem entrega uma história."
