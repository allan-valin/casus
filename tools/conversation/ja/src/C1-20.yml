id: C1-20
protagonist: m
title: ["A child", "Uma criança"]
situation: ["You and Yui married quietly last spring. Now she's pregnant. At city hall she receives the maternal and child health booklet; then the first check-up.", "Você e a Yui casaram discretamente na primavera passada. Agora ela está grávida. Na prefeitura ela recebe a caderneta de saúde da mãe e do bebê; depois, o primeiro pré-natal."]
learn: [n1-138]
culture: The 母子手帳
items:
  - [ninshin, "妊娠[にんしん]", "pregnancy", "gravidez"]
  - [boshitechou, "母子[ぼし] 手帳[てちょう]", "maternal and child health booklet", "caderneta da mãe e do bebê", {rare: true}]
  - [shussan, "出産[しゅっさん]", "giving birth", "parto"]
  - [kenshin, "検診[けんしん]", "check-up", "consulta de rotina, pré-natal"]
  - [yoteibi, "出産[しゅっさん] 予定日[よていび]", "due date", "data prevista do parto"]
  - [tsuwari, "つわり", "morning sickness", "enjoo da gravidez"]
  - [uchi-ni-review, "元気[げんき] な うち に", "while (you're) still feeling well", "enquanto ainda está bem"]
  - [junbi-review, "準備[じゅんび] して おく", "get ready in advance", "deixar preparado"]
  - [otto, "夫[おっと]", "husband", "marido"]
  - [tsuma, "妻[つま]", "wife", "esposa"]
dialogue:
  - [yui, "市役所[しやくしょ] で 母子[ぼし] 手帳[てちょう] を もらった よ。", "I got the maternal and child health booklet at city hall.", "Peguei a caderneta da mãe e do bebê na prefeitura."]
  - [protagonist, "これ に 全部[ぜんぶ] 記録[きろく] する の？", "Everything gets recorded in this?", "Tudo fica registrado aqui?"]
  - [yui, "うん。 妊娠[にんしん] 中[ちゅう] の 検診[けんしん] から、 赤[あか]ちゃん の 予防[よぼう] 接種[せっしゅ] まで。", "Yes. From the check-ups during pregnancy to the baby's vaccinations.", "É. Do pré-natal até as vacinas do bebê."]
  - [isha, "出産[しゅっさん] 予定日[よていび] は 十月[じゅうがつ] 三日[みっか] です。 つわり は 大丈夫[だいじょうぶ] です か。", "The due date is the 3rd of October. How's the morning sickness?", "A data prevista do parto é 3 de outubro. E o enjoo?"]
  - [yui, "少[すこ]し あります が、 大丈夫[だいじょうぶ] です。", "A little, but I'm fine.", "Um pouco, mas estou bem."]
  - [isha, "ご主人[しゅじん] も 一緒[いっしょ] に 両親[りょうしん] 学級[がっきゅう] に 来[き]て ください ね。", "Please come to the parents' class together with your husband.", "Venha com o seu marido às aulas para pais, viu."]
  - [protagonist, "はい。 妻[つま] が 元気[げんき] な うち に、 赤[あか]ちゃん の 部屋[へや] を 準備[じゅんび] して おきます。", "Yes. While my wife is still feeling well, I'll get the baby's room ready.", "Sim. Enquanto minha esposa ainda está bem, vou deixar o quarto do bebê pronto."]
  - [yui, "頼[たの]もしい 夫[おっと] だ ね。", "What a dependable husband.", "Que marido prestativo."]
teach:
  - ask: ["Say: pregnancy.", "Diga: gravidez.", "妊娠[にんしん]", ninshin]
  - ask: ["Say: the maternal and child health booklet.", "Diga: a caderneta da mãe e do bebê.", "母子[ぼし] 手帳[てちょう]", boshitechou]
  - ask: ["Say: a check-up.", "Diga: pré-natal, consulta de rotina.", "検診[けんしん]", kenshin]
  - ask: ["Say: the due date.", "Diga: a data prevista do parto.", "出産[しゅっさん] 予定日[よていび]", yoteibi]
  - ask: ["Say: morning sickness.", "Diga: enjoo da gravidez.", "つわり", tsuwari]
  - ask: ["Say: giving birth.", "Diga: parto.", "出産[しゅっさん]", shussan]
  - ask: ["Say: my husband.", "Diga: meu marido.", "夫[おっと]", otto]
  - ask: ["Say: my wife.", "Diga: minha esposa.", "妻[つま]", tsuma]
  - note: ["You met «〜うち に», while — before things change. Here: «元気[げんき] な うち に», while she's still feeling well (before the pregnancy gets heavy). With «〜て おく»: do it now, ready for later.", "Você já viu «〜うち に», enquanto — antes que as coisas mudem. Aqui: «元気[げんき] な うち に», enquanto ela ainda está bem (antes de a gravidez pesar). Com «〜て おく»: fazer agora, pronto para depois."]
  - ask: ["Say: while she's still feeling well.", "Diga: enquanto ela ainda está bem.", "元気[げんき] な うち に", uchi-ni-review]
  - ask: ["Say: get it ready in advance.", "Diga: deixar preparado.", "準備[じゅんび] して おく", junbi-review]
  - note: ["When a pregnancy is reported to city hall, the mother receives the «母子[ぼし] 手帳[てちょう]»: one booklet for check-ups, the birth and the child's growth and vaccinations, plus vouchers that make most check-ups free. Hamamatsu offers it in Portuguese too. Your own spouse is «夫[おっと]» / «妻[つま]»; someone else's is «ご主人[しゅじん]» / «奥[おく]さん».", "Quando a gravidez é comunicada à prefeitura, a mãe recebe o «母子[ぼし] 手帳[てちょう]»: uma caderneta para o pré-natal, o parto e o crescimento e as vacinas da criança, além de vales que tornam a maioria das consultas gratuitas. Hamamatsu oferece também em português. O próprio cônjuge é «夫[おっと]» / «妻[つま]»; o dos outros é «ご主人[しゅじん]» / «奥[おく]さん»."]
  - pt_only: "A caderneta lembra a Caderneta da Gestante e a da Criança do SUS, só que é uma só, da gravidez até a escola. Guarde bem: no Japão ela vai para todo lado com vocês."
