id: C2-28
protagonist: m
title: ["Stay or go", "Ficar ou ir"]
situation: ["A company in São Paulo offers you a big job. Yui would come; your son is starting school. On the riverbank, you weigh it one last time with Kenta.", "Uma empresa em São Paulo oferece um cargo importante. A Yui iria junto; seu filho está começando a escola. Na beira do rio, você pesa tudo uma última vez com o Kenta."]
learn: []
culture: —
items:
  - [ketsudan, "決断[けつだん]", "decision (a big one)", "decisão (importante)"]
  - [ne-wo-orosu, "根[ね] を 下[お]ろす", "put down roots", "criar raízes"]
  - [mono-ka, "〜もの か", "never! (strong denial)", "de jeito nenhum! (negação forte)"]
  - [akirameru-mono-ka, "諦[あきら]める もの か", "I'll never give up", "nunca vou desistir"]
  - [koto-ka, "〜こと か", "how (very)…! (exclamation)", "como…! (exclamação)"]
  - [ureshikatta-koto-ka, "どんなに 嬉[うれ]しかった こと か", "how happy I was!", "como fiquei feliz!"]
  - [mayoi, "迷[まよ]い", "hesitation, doubt", "dúvida, hesitação"]
  - [kiba, "居場所[いばしょ] が ある", "have a place to belong", "ter um lugar"]
  - [ryouhou-no-kuni-review, "どちら を 選[えら]んで も", "whichever you choose", "qualquer que seja a escolha"]
  - [kokoro-ga-kimaru, "心[こころ] が 決[き]まる", "make up one's mind", "decidir-se"]
dialogue:
  - [kenta, "サンパウロ の 話[はなし]、 決断[けつだん] した？", "Have you decided about São Paulo?", "Já decidiu sobre São Paulo?"]
  - [protagonist, "まだ 迷[まよ]い が ある。 給料[きゅうりょう] は いい し、 両親[りょうしん] の 近[ちか]く に も 住[す]める。", "I still have doubts. The salary's good, and I could live near my parents.", "Ainda estou em dúvida. O salário é bom, e eu poderia morar perto dos meus pais."]
  - [kenta, "でも 浜松[はままつ] に は 根[ね] を 下[お]ろした だろ。", "But you've put down roots in Hamamatsu.", "Mas você criou raízes em Hamamatsu."]
  - [protagonist, "五年[ごねん] 前[まえ]、 誰[だれ] も 知[し]らない 町[まち] で、 君[きみ] が「タメ口[ぐち] で いい よ」 と 言[い]って くれた 時[とき]、 どんなに 嬉[うれ]しかった こと か。", "Five years ago, in a town where I knew no one, when you said “plain talk is fine” — how happy I was!", "Cinco anos atrás, numa cidade onde eu não conhecia ninguém, quando você disse «pode falar normal comigo» — como fiquei feliz!"]
  - [kenta, "急[きゅう] に 何[なに] だ よ。 照[て]れる な。", "Where's this coming from? You're making me blush.", "Que é isso de repente? Fico sem graça."]
  - [protagonist, "ここ に は 居場所[いばしょ] が ある。 太鼓[たいこ] も 畑[はたけ] も、 この 町[まち] の 友達[ともだち] も、 諦[あきら]める もの か。", "Here I have a place. The taiko, the garden, the friends in this town — I'll never give them up.", "Aqui eu tenho um lugar. O taikô, a horta, os amigos desta cidade — nunca vou desistir disso."]
  - [kenta, "じゃあ、 心[こころ] が 決[き]まった ね。", "Then you've made up your mind.", "Então já decidiu."]
  - [protagonist, "うん、 残[のこ]る。 ブラジル と の 架[か]け橋[はし] は、 ここ から でも できる から。", "Yes, I'm staying. I can be a bridge to Brazil from here too.", "É, vou ficar. Dá para ser ponte com o Brasil daqui mesmo."]
teach:
  - ask: ["Say: a big decision.", "Diga: uma decisão importante.", "決断[けつだん]", ketsudan]
  - ask: ["Say: hesitation, doubt.", "Diga: dúvida.", "迷[まよ]い", mayoi]
  - ask: ["Say: put down roots.", "Diga: criar raízes.", "根[ね] を 下[お]ろす", ne-wo-orosu]
  - ask: ["Say: have a place to belong.", "Diga: ter um lugar.", "居場所[いばしょ] が ある", kiba]
  - note: ["Two emphatic patterns of strong feeling: «〜もの か» is a fierce never — «諦[あきら]める もの か», I'll never give up (casual «もん か»). «〜こと か» is an exclamation of degree — «どんなに 嬉[うれ]しかった こと か», how happy I was! Both belong to speeches and heartfelt moments.", "Dois padrões enfáticos de sentimento forte: «〜もの か» é um nunca firme — «諦[あきら]める もの か», nunca vou desistir (informal «もん か»). «〜こと か» é exclamação de intensidade — «どんなに 嬉[うれ]しかった こと か», como fiquei feliz! Os dois são de discursos e momentos de coração aberto."]
  - ask: ["Say the pattern: never! (strong denial).", "Diga o padrão: de jeito nenhum!", "〜もの か", mono-ka]
  - ask: ["Say: I'll never give up.", "Diga: nunca vou desistir.", "諦[あきら]める もの か", akirameru-mono-ka]
  - ask: ["Say the pattern: how very…!", "Diga o padrão: como…!", "〜こと か", koto-ka]
  - ask: ["Say: how happy I was!", "Diga: como fiquei feliz!", "どんなに 嬉[うれ]しかった こと か", ureshikatta-koto-ka]
  - ask: ["Say: whichever you choose.", "Diga: qualquer que seja a escolha.", "どちら を 選[えら]んで も", ryouhou-no-kuni-review]
  - ask: ["Say: make up one's mind.", "Diga: decidir-se.", "心[こころ] が 決[き]まる", kokoro-ga-kimaru]
  - pt_only: "Muita gente na comunidade brasileira de Hamamatsu passa por essa encruzilhada. Não há resposta certa — mas há a sua, dita com as palavras que você levou cinco anos para aprender."
