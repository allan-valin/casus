id: B2-04
protagonist: m
title: ["The first day", "O primeiro dia"]
situation: ["First day at head office in Tokyo. Business cards with the department head, then a welcome dinner with Chief Sato and the team.", "Primeiro dia na sede em Tóquio. Cartões de visita com o chefe do departamento, depois um jantar de boas-vindas com a chefe Sato e a equipe."]
learn: []
culture: Cards, toasts, chopsticks, escalators
items:
  - [buchou-item, "部長[ぶちょう]", "department head", "chefe de departamento"]
  - [senpai, "先輩[せんぱい]", "senior colleague", "colega mais antigo"]
  - [irassharu, "いらっしゃる", "is, comes, goes (respectful)", "está, vem, vai (respeitoso)"]
  - [ossharu, "おっしゃる", "says (respectful)", "diz (respeitoso)"]
  - [sonkeigo, "尊敬語[そんけいご]", "respectful language", "linguagem respeitosa", {rare: true}]
  - [kanpai-hikuku, "グラス を 低[ひく]く", "(hold) the glass lower", "(segure) o copo mais baixo"]
  - [tatete-wa-ikenai, "立[た]てて は いけない", "must not stand (them) upright", "não pode deixar em pé"]
  - [esukareetaa, "エスカレーター", "escalator", "escada rolante"]
  - [hidari-ni-tatsu, "左[ひだり] に 立[た]つ", "stand on the left", "ficar à esquerda"]
  - [onaji-you-ni, "周[まわ]り と 同[おな]じ よう に", "like the people around you", "como as pessoas em volta"]
  - [goaisatsu, "ご挨拶[あいさつ]", "greeting (formal)", "cumprimento (formal)"]
dialogue:
  - [buchou, "高橋[たかはし] です。 よろしく。", "I'm Takahashi. Pleased to meet you.", "Sou o Takahashi. Muito prazer."]
  - [protagonist, "ソウザ と 申[もう]します。 どうぞ よろしく お願[ねが]いいたします。", "My name is Souza. I look forward to working with you.", "Me chamo Souza. Conto com o senhor."]
  - [sato, "部長[ぶちょう] は ブラジル に 三年[さんねん] いらっしゃった ん です よ。", "The department head spent three years in Brazil, you know.", "O chefe de departamento morou três anos no Brasil, sabia?"]
  - [buchou, "ポルトガル語[ご] は もう 忘[わす]れた けど ね。", "Though I've forgotten my Portuguese.", "Mas já esqueci o português."]
  - [protagonist, "部長[ぶちょう] が そう おっしゃって も、 発音[はつおん] が きれい です。", "Even if you say so, your pronunciation is lovely.", "Mesmo o senhor dizendo isso, sua pronúncia é ótima."]
  - [sato, "では、 乾杯[かんぱい]！ …グラス は 部長[ぶちょう] より 少[すこ]し 低[ひく]く ね。", "Then, cheers! …Hold your glass a little lower than the head's.", "Então, saúde! …O copo um pouco mais baixo que o do chefe, viu."]
  - [protagonist, "はい。 お箸[はし] は ご飯[はん] に 立[た]てて は いけない、 です よね。", "Yes. And chopsticks must never stand upright in the rice, right?", "Certo. E o hashi nunca pode ficar em pé no arroz, né?"]
  - [sato, "そう。 それから、 東京[とうきょう] の エスカレーター は 左[ひだり] に 立[た]ちます よ。 大阪[おおさか] は 右[みぎ]。", "Right. And on Tokyo escalators you stand on the left. In Osaka, the right.", "Isso. E nas escadas rolantes de Tóquio se fica à esquerda. Em Osaka, à direita."]
teach:
  - ask: ["Say: department head.", "Diga: chefe de departamento.", "部長[ぶちょう]", buchou-item]
  - ask: ["Say: a senior colleague.", "Diga: um colega mais antigo.", "先輩[せんぱい]", senpai]
  - ask: ["Say: a formal greeting.", "Diga: cumprimento formal.", "ご挨拶[あいさつ]", goaisatsu]
  - note: ["Respectful verbs, «尊敬[そんけい]語[ご]», raise the other person: «いる» / «来[く]る» / «行[い]く» → «いらっしゃる»; «言[い]う» → «おっしゃる». Used about the boss or a client, never about yourself — for yourself you use the humble «申[もう]す», «参[まい]る».", "Os verbos respeitosos, «尊敬[そんけい]語[ご]», elevam o outro: «いる» / «来[く]る» / «行[い]く» → «いらっしゃる»; «言[い]う» → «おっしゃる». Usados para o chefe ou um cliente, nunca para si mesmo — para si se usa o humilde «申[もう]す», «参[まい]る»."]
  - ask: ["Say: respectful language.", "Diga: linguagem respeitosa.", "尊敬語[そんけいご]", sonkeigo]
  - ask: ["Say the respectful is, comes, goes.", "Diga o respeitoso de estar, vir, ir.", "いらっしゃる", irassharu]
  - ask: ["Say the respectful says.", "Diga o respeitoso de dizer.", "おっしゃる", ossharu]
  - ask: ["Remember at the toast: the glass lower.", "Lembre no brinde: o copo mais baixo.", "グラス を 低[ひく]く", kanpai-hikuku]
  - ask: ["Say: chopsticks must not stand upright.", "Diga: o hashi não pode ficar em pé.", "立[た]てて は いけない", tatete-wa-ikenai]
  - ask: ["Say: escalator.", "Diga: escada rolante.", "エスカレーター", esukareetaa]
  - ask: ["Say: stand on the left.", "Diga: ficar à esquerda.", "左[ひだり] に 立[た]つ", hidari-ni-tatsu]
  - ask: ["Say: like the people around you.", "Diga: como as pessoas em volta.", "周[まわ]り と 同[おな]じ よう に", onaji-you-ni]
  - note: ["Business manners you'll be judged on: cards given and taken with both hands, read and placed on the table; at a toast, your glass a little lower than a senior's; pour for others, not yourself; chopsticks never upright in rice or passed from chopsticks to chopsticks (both funeral rites); quiet on trains. Escalators: Tokyo stands left, Osaka right — custom, not law, and Saitama and Nagoya now ask everyone to stand still. When unsure, do what the people around you do.", "Etiqueta de trabalho em que você vai ser observado: cartão entregue e recebido com as duas mãos, lido e deixado na mesa; no brinde, o copo um pouco mais baixo que o de quem é mais velho; servir os outros, não a si; hashi nunca em pé no arroz nem passado de hashi para hashi (os dois são ritos de funeral); silêncio no trem. Escadas rolantes: Tóquio fica à esquerda, Osaka à direita — costume, não lei, e Saitama e Nagoya hoje pedem que todos fiquem parados. Na dúvida, faça como as pessoas em volta."]
  - pt_only: "No Brasil a escada rolante é «fica à direita, anda à esquerda». Em Tóquio é o contrário — e em Osaka igual ao Brasil. Olhe a fila antes de subir."
