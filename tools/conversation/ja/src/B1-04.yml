id: B1-04
protagonist: m
title: [Going out, Namorando]
situation: ["Kenta asks how it went with Yui. You tell him — you ended up confessing first.", "O Kenta pergunta como foi com a Yui. Você conta — acabou se declarando primeiro."]
learn: [n4-013]
culture: —
items:
  - [tsukiau, "付[つ]き合[あ]う", "go out, date (as a couple)", "namorar"]
  - [te-shimau, "〜て しまう", "end up …-ing; (regret / completion)", "acabar …-ndo; (lamento / conclusão)"]
  - [itte-shimatta, "言[い]って しまった", "I blurted it out", "acabei falando"]
  - [chatta, "〜ちゃった", "ended up (casual of てしまった)", "acabei (informal de てしまった)"]
  - [okkee, "オッケー", "okay", "OK"]
  - [kinchou-shita, "緊張[きんちょう] した", "I was nervous", "fiquei nervoso"]
  - [omedetou, "おめでとう", "congratulations", "parabéns"]
  - [kanojo-ga-dekita, "彼女[かのじょ] が できた", "I got a girlfriend", "arrumei namorada"]
  - [tsugi-no, "次[つぎ] の", "the next", "o próximo"]
  - [yappari, "やっぱり", "as expected, after all", "no fim, como eu imaginava"]
dialogue:
  - [kenta, "で、 由衣[ゆい] さん と は どう なった？", "So, how did it go with Yui?", "E aí, como ficou com a Yui?"]
  - [protagonist, "実[じつ] は… 僕[ぼく] から 告白[こくはく] して しまった。", "Actually… I ended up confessing first.", "Na verdade… acabei me declarando primeiro."]
  - [kenta, "え、 マジ で？ 返事[へんじ] は？", "Seriously? And the answer?", "Sério? E a resposta?"]
  - [protagonist, "オッケー だった！ 付[つ]き合[あ]う こと に なった。", "It was okay! We're going out now.", "Ela topou! A gente está namorando."]
  - [kenta, "おめでとう！ 彼女[かのじょ] が できた ね。", "Congratulations! You've got a girlfriend.", "Parabéns! Arrumou namorada."]
  - [protagonist, "すごく 緊張[きんちょう] した。 言[い]う つもり なかった のに、 言[い]っちゃった。", "I was so nervous. I didn't plan to say it, but it just came out.", "Fiquei muito nervoso. Não ia falar, mas acabei falando."]
  - [kenta, "やっぱり ね。 次[つぎ] の デート は どこ？", "Knew it. Where's the next date?", "Eu sabia. Qual é o próximo encontro?"]
  - [protagonist, "まだ 決[き]めて ない。 健太[けんた] くん と 美咲[みさき] さん は？", "Haven't decided. What about you and Misaki?", "Ainda não decidi. E você e a Misaki?"]
teach:
  - ask: ["Say: to go out, date.", "Diga: namorar.", "付[つ]き合[あ]う", tsukiau]
  - note: ["«〜て しまう» means the action is done and gone — often with regret or surprise: «言[い]って しまった», I went and said it. In casual speech it shrinks: «言[い]っちゃった», «食[た]べちゃった».", "«〜て しまう» diz que a ação aconteceu e não tem volta — muitas vezes com lamento ou surpresa: «言[い]って しまった», acabei falando. Na fala informal encolhe: «言[い]っちゃった», «食[た]べちゃった»."]
  - ask: ["Say the pattern: end up doing.", "Diga o padrão: acabar fazendo.", "〜て しまう", te-shimau]
  - build: [itte-shimatta, ["しまった", "言[い]って しまった"]]
  - ask: ["Say: I blurted it out.", "Diga: acabei falando.", "言[い]って しまった。", itte-shimatta]
  - ask: ["Say the casual ending: ended up…", "Diga a terminação informal: acabei…", "〜ちゃった", chatta]
  - ask: ["Say casually: I blurted it out.", "Diga, informal: acabei falando.", "言[い]っちゃった。", chatta]
  - ask: ["Say: I was nervous.", "Diga: fiquei nervoso.", "緊張[きんちょう] した。", kinchou-shita]
  - ask: ["Say: it was okay — she said yes.", "Diga: ela topou.", "オッケー だった。", okkee]
  - ask: ["Congratulate him.", "Dê os parabéns.", "おめでとう！", omedetou]
  - ask: ["Say: I've got a girlfriend.", "Diga: arrumei namorada.", "彼女[かのじょ] が できた。", kanojo-ga-dekita]
  - ask: ["Say: as expected, after all.", "Diga: como eu imaginava.", "やっぱり", yappari]
  - ask: ["Say: the next one.", "Diga: o próximo.", "次[つぎ] の", tsugi-no]
  - note: ["«彼女[かのじょ] が できた» — literally, a girlfriend came into being — is how you announce it. Many couples keep it low-key at work; friends are told first.", "«彼女[かのじょ] が できた» — ao pé da letra, surgiu uma namorada — é como se anuncia. Muitos casais são discretos no trabalho; os amigos sabem primeiro."]
  - pt_only: "No Brasil a gente posta logo a foto do casal. No Japão muitos casais preferem discrição, e demonstração de carinho em público é rara."
