id: C1-26
protagonist: m
title: ["The master's farewell", "A despedida do mestre"]
situation: ["Ōno-sensei is retiring after twenty years leading the taiko group. You've been asked to read the thank-you certificate at her farewell.", "A professora Ōno vai se aposentar depois de vinte anos à frente do grupo de taikô. Pediram para você ler o certificado de agradecimento na despedida."]
learn: []
culture: —
items:
  - [intai, "引退[いんたい]", "retirement", "aposentadoria (de uma atividade)"]
  - [kanshajou, "感謝状[かんしゃじょう]", "certificate of thanks", "certificado de agradecimento", {rare: true}]
  - [omoide, "思[おも]い出[で]", "memories", "lembranças"]
  - [nagai-aida, "長[なが]い 間[あいだ]", "for a long time", "por muito tempo"]
  - [shidou, "ご指導[しどう]", "guidance, teaching", "orientação, ensino"]
  - [kokoro-kara, "心[こころ] から", "from the heart", "do fundo do coração"]
  - [hyoushou, "ここ に 感謝[かんしゃ] の 意[い] を 表[ひょう]します", "we hereby express our gratitude", "aqui expressamos nossa gratidão", {rare: true}]
  - [hiki-tsugu, "引[ひ]き継[つ]ぐ", "carry on, take over", "dar continuidade"]
  - [wasuremasen, "決[けっ]して 忘[わす]れません", "we will never forget", "nunca vamos esquecer"]
  - [otsukaresama-retire, "長[なが]い 間[あいだ] お疲[つか]れさま でした", "thank you for all your years of work", "obrigado por todos esses anos"]
dialogue:
  - [protagonist, "感謝状[かんしゃじょう]。 大野[おおの] 先生[せんせい]。", "Certificate of thanks. To Ōno-sensei.", "Certificado de agradecimento. À professora Ōno."]
  - [protagonist, "あなた は 二十年[にじゅうねん] の 長[なが]い 間[あいだ]、 私[わたし]たち を ご指導[しどう] くださいました。 ここ に 感謝[かんしゃ] の 意[い] を 表[ひょう]します。", "For twenty long years you have guided us. We hereby express our gratitude.", "Por vinte longos anos a senhora nos orientou. Aqui expressamos nossa gratidão."]
  - [taiko-sensei, "ありがとう… 思[おも]い出[で] が たくさん あります。", "Thank you… I have so many memories.", "Obrigada… tenho tantas lembranças."]
  - [kenta, "雨[あめ] の 中[なか] の 初[はつ] 本番[ほんばん]、 覚[おぼ]えて います か。", "Do you remember our first performance in the rain?", "A senhora lembra da primeira apresentação na chuva?"]
  - [taiko-sensei, "もちろん。 ブラジル から 来[き]た 人[ひと] が サンバ の リズム で 叩[たた]いて いた わ。", "Of course. The one from Brazil was drumming in samba rhythm.", "Claro. O que veio do Brasil estava tocando no ritmo do samba."]
  - [protagonist, "先生[せんせい] の ご指導[しどう] は 決[けっ]して 忘[わす]れません。 これ から は 私[わたし]たち が 引[ひ]き継[つ]ぎます。", "We will never forget your teaching. From now on we'll carry it on.", "Nunca vamos esquecer os seus ensinamentos. Daqui em diante, nós damos continuidade."]
  - [kenta, "長[なが]い 間[あいだ]、 本当[ほんとう] に お疲[つか]れさま でした！", "Thank you so much for all your years!", "Muito obrigado por todos esses anos!"]
  - [taiko-sensei, "心[こころ] から ありがとう。 太鼓[たいこ] は みんな の もの です よ。", "Thank you from my heart. The taiko belongs to all of you.", "Obrigada do fundo do coração. O taikô é de vocês."]
teach:
  - ask: ["Say: retirement.", "Diga: aposentadoria.", "引退[いんたい]", intai]
  - ask: ["Say: a certificate of thanks.", "Diga: certificado de agradecimento.", "感謝状[かんしゃじょう]", kanshajou]
  - ask: ["Say: memories.", "Diga: lembranças.", "思[おも]い出[で]", omoide]
  - ask: ["Say: for a long time.", "Diga: por muito tempo.", "長[なが]い 間[あいだ]", nagai-aida]
  - ask: ["Say: guidance, teaching — politely.", "Diga: orientação — com respeito.", "ご指導[しどう]", shidou]
  - note: ["Formal speeches and certificates use set phrases: «長[なが]い 間[あいだ] ご指導[しどう] くださいました» — you guided us for a long time; «ここ に 感謝[かんしゃ] の 意[い] を 表[ひょう]します» — we hereby express our gratitude; «決[けっ]して 忘[わす]れません» — we will never forget. A «感謝状[かんしゃじょう]» is read aloud, then handed over with both hands and a bow.", "Discursos e certificados formais usam frases prontas: «長[なが]い 間[あいだ] ご指導[しどう] くださいました» — a senhora nos orientou por muito tempo; «ここ に 感謝[かんしゃ] の 意[い] を 表[ひょう]します» — aqui expressamos nossa gratidão; «決[けっ]して 忘[わす]れません» — nunca vamos esquecer. O «感謝状[かんしゃじょう]» é lido em voz alta e entregue com as duas mãos e uma reverência."]
  - ask: ["Read the formula: we hereby express our gratitude.", "Leia a fórmula: aqui expressamos nossa gratidão.", "ここ に 感謝[かんしゃ] の 意[い] を 表[ひょう]します。", hyoushou]
  - ask: ["Say: from the heart.", "Diga: do fundo do coração.", "心[こころ] から", kokoro-kara]
  - ask: ["Promise: we will never forget.", "Prometa: nunca vamos esquecer.", "決[けっ]して 忘[わす]れません。", wasuremasen]
  - ask: ["Say: carry it on.", "Diga: dar continuidade.", "引[ひ]き継[つ]ぐ", hiki-tsugu]
  - ask: ["Thank her for all her years.", "Agradeça por todos os anos.", "長[なが]い 間[あいだ] お疲[つか]れさま でした。", otsukaresama-retire]
  - pt_only: "No Brasil a despedida teria discurso emocionado e improvisado. No Japão a emoção cabe numa fórmula lida devagar — e por isso mesmo faz todo mundo chorar."
