id: B1-25
protagonist: f
title: ["Living together?", "Morar junto?"]
situation: ["Shota suggests moving in together to save on rent. You like the idea — but what will his parents think?", "O Shota sugere morarem juntos para economizar no aluguel. Você gosta da ideia — mas o que os pais dele vão achar?"]
learn: [n4-066]
culture: —
items:
  - [dousei, "同棲[どうせい]", "living together (unmarried)", "morar junto (sem casar)", {rare: true}]
  - [kekkon-mae, "結婚[けっこん] 前[まえ]", "before marriage", "antes do casamento"]
  - [ryoushin, "両親[りょうしん]", "(my) parents", "(meus) pais"]
  - [kamoshirenai, "〜かも しれない", "might, maybe", "pode ser que, talvez"]
  - [hantai-suru-kamo, "反対[はんたい] する かも しれない", "they might be against it", "pode ser que sejam contra"]
  - [yachin, "家賃[やちん]", "rent", "aluguel"]
  - [setsuyaku, "節約[せつやく]", "saving money", "economia"]
  - [isshoni-sumu, "一緒[いっしょ] に 住[す]む", "live together", "morar junto"]
  - [shinpai, "心配[しんぱい]", "worry", "preocupação"]
  - [setsumei-suru, "説明[せつめい] する", "explain", "explicar"]
  - [shoujiki-ni-hanasu, "正直[しょうじき] に 話[はな]す", "talk honestly", "falar com sinceridade"]
dialogue:
  - [shota, "一緒[いっしょ] に 住[す]まない？ 家賃[やちん] も 節約[せつやく] できる し。", "Shall we live together? We'd save on rent too.", "Vamos morar juntos? A gente economiza no aluguel também."]
  - [protagonist, "いい ね！ でも、 ご両親[りょうしん] は 大丈夫[だいじょうぶ]？", "Nice! But will your parents be okay with it?", "Boa! Mas seus pais vão aceitar?"]
  - [shota, "うーん… 結婚[けっこん] 前[まえ] の 同棲[どうせい] に は 反対[はんたい] する かも しれない。", "Hmm… they might be against living together before marriage.", "Hum… pode ser que sejam contra morar junto antes de casar."]
  - [protagonist, "やっぱり。 私[わたし] の 両親[りょうしん] も 心配[しんぱい] する かも。", "I thought so. My parents might worry too.", "Eu imaginava. Meus pais também podem se preocupar."]
  - [shota, "ブラジル でも？", "In Brazil too?", "No Brasil também?"]
  - [protagonist, "家族[かぞく] に よる よ。 うち は 古[ふる]い から。", "Depends on the family. Mine is old-fashioned.", "Depende da família. A minha é tradicional."]
  - [shota, "じゃあ、 まず 両親[りょうしん] に 正直[しょうじき] に 話[はな]そう。", "Then let's talk to our parents honestly first.", "Então vamos primeiro falar com sinceridade com os nossos pais."]
  - [protagonist, "うん。 将来[しょうらい] の こと も ちゃんと 説明[せつめい] しよう。", "Yes. Let's explain our plans for the future properly too.", "Isso. E explicar direitinho os planos para o futuro."]
teach:
  - ask: ["Say: living together.", "Diga: morar junto.", "一緒[いっしょ] に 住[す]む", isshoni-sumu]
  - ask: ["Say: living together before marriage.", "Diga: morar junto sem casar.", "同棲[どうせい]", dousei]
  - ask: ["Say: before marriage.", "Diga: antes do casamento.", "結婚[けっこん] 前[まえ]", kekkon-mae]
  - ask: ["Say: the rent.", "Diga: o aluguel.", "家賃[やちん]", yachin]
  - ask: ["Say: saving money.", "Diga: economia.", "節約[せつやく]", setsuyaku]
  - ask: ["Say: my parents.", "Diga: meus pais.", "両親[りょうしん]", ryoushin]
  - note: ["«〜かも しれない» is might, maybe — less sure than «でしょう»: a plain sentence plus «かも しれない». Casually just «かも»: «心配[しんぱい] する かも», they might worry.", "«〜かも しれない» é pode ser que, talvez — menos certo que «でしょう»: frase simples mais «かも しれない». No informal, só «かも»: «心配[しんぱい] する かも», podem se preocupar."]
  - ask: ["Say the pattern: might.", "Diga o padrão: pode ser que.", "〜かも しれない", kamoshirenai]
  - build: [hantai-suru-kamo, ["しれない", "かも しれない", "反対[はんたい] する かも しれない"]]
  - ask: ["Say: they might be against it.", "Diga: pode ser que sejam contra.", "反対[はんたい] する かも しれない。", hantai-suru-kamo]
  - ask: ["Say: worry.", "Diga: preocupação.", "心配[しんぱい]", shinpai]
  - ask: ["Say: talk honestly.", "Diga: falar com sinceridade.", "正直[しょうじき] に 話[はな]す", shoujiki-ni-hanasu]
  - ask: ["Say: explain.", "Diga: explicar.", "説明[せつめい] する", setsumei-suru]
  - note: ["«同棲[どうせい]», living together before marriage, is more common than it was, but many parents still see it as a step before engagement, not instead of it. Couples often present it with a plan: when they'll marry, how they'll share costs.", "«同棲[どうせい]», morar junto antes de casar, é mais comum do que era, mas muitos pais ainda veem como um passo antes do noivado, não no lugar dele. Os casais muitas vezes apresentam com um plano: quando vão casar, como vão dividir as despesas."]
  - pt_only: "No Brasil, juntar as escovas de dente é comum e às vezes nem se anuncia. No Japão, muitos casais conversam antes com as duas famílias — e o plano de casamento costuma vir junto."
