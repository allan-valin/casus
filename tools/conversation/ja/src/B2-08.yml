id: B2-08
protagonist: m
title: ["Overtime", "Hora extra"]
situation: ["Head office, 18:30. Department head Takahashi is still at his desk; you promised Yui dinner at seven. You need to leave without making waves.", "Sede, 18h30. O chefe de departamento Takahashi ainda está na mesa; você prometeu jantar com a Yui às sete. Precisa sair sem causar mal-estar."]
learn: []
culture: Reading the air
items:
  - [nikui, "〜にくい", "hard to…", "difícil de…"]
  - [kaerinikui, "帰[かえ]りにくい", "hard to leave", "difícil ir embora"]
  - [iinikui, "言[い]いにくい", "hard to say", "difícil de dizer"]
  - [saabisu-zangyou, "サービス 残業[ざんぎょう]", "unpaid overtime", "hora extra não paga", {rare: true}]
  - [zangyoudai, "残業代[ざんぎょうだい]", "overtime pay", "pagamento de hora extra"]
  - [yotei-ga-arimashite, "予定[よてい] が ありまして", "I have plans (polite excuse)", "tenho um compromisso (desculpa educada)"]
  - [nanika-otetsudai, "何[なに] か お手伝[てつだ]い する こと は", "is there anything I can help with?", "há algo em que eu possa ajudar?"]
  - [kyou-wa-kore-de, "今日[きょう] は これ で", "that's it for today", "por hoje é isso"]
  - [houkoku, "報告[ほうこく]", "report", "relatório, comunicado"]
  - [rakuni, "気楽[きらく] に", "relaxed, at ease", "à vontade"]
dialogue:
  - [protagonist, "（部長[ぶちょう] が まだ いる… 帰[かえ]りにくい な。）", "(The head's still here… hard to leave.)", "(O chefe ainda está aqui… difícil ir embora.)"]
  - [protagonist, "部長[ぶちょう]、 今日[きょう] の 報告[ほうこく] です。 何[なに] か お手伝[てつだ]い する こと は ございます か。", "Sir, here's today's report. Is there anything I can help with?", "Chefe, aqui está o relatório de hoje. Há algo em que eu possa ajudar?"]
  - [buchou, "いや、 大丈夫[だいじょうぶ]。 ありがとう。", "No, I'm fine. Thank you.", "Não, tudo bem. Obrigado."]
  - [protagonist, "実[じつ] は 今晩[こんばん] 予定[よてい] が ありまして… 今日[きょう] は これ で 失礼[しつれい] しても よろしい でしょう か。", "Actually I have plans tonight… may I leave for today?", "Na verdade tenho um compromisso hoje à noite… posso ir embora por hoje?"]
  - [buchou, "もちろん。 私[わたし] が 残[のこ]って いる から って、 気[き] に しないで。", "Of course. Don't worry just because I'm staying.", "Claro. Não se preocupe só porque eu fico."]
  - [protagonist, "ありがとう ございます。 お先[さき] に 失礼[しつれい] します。", "Thank you. Excuse me for leaving first.", "Obrigado. Com licença, já vou indo."]
  - [buchou, "お疲[つか]れさま。 それに、 残業[ざんぎょう] した 日[ひ] は ちゃんと 申請[しんせい] して ね。 サービス 残業[ざんぎょう] は だめ だ よ。", "Good work. And when you do work overtime, claim it properly. No unpaid overtime.", "Bom trabalho. E quando fizer hora extra, registre direitinho. Hora extra sem pagar, não."]
  - [protagonist, "はい。 気楽[きらく] に 言[い]って いただけて、 助[たす]かります。", "Yes. It helps that you say it so easily.", "Certo. Ajuda muito o senhor dizer isso assim, à vontade."]
teach:
  - note: ["«〜にくい» is hard to: the verb stem plus «にくい» — «帰[かえ]りにくい», hard to leave (because of the atmosphere, not the door); «言[い]いにくい», hard to say. The opposite is «〜やすい», easy to.", "«〜にくい» é difícil de: radical do verbo mais «にくい» — «帰[かえ]りにくい», difícil ir embora (pelo clima, não pela porta); «言[い]いにくい», difícil de dizer. O contrário é «〜やすい», fácil de."]
  - ask: ["Say the ending: hard to…", "Diga a terminação: difícil de…", "〜にくい", nikui]
  - ask: ["Think it: hard to leave.", "Pense: difícil ir embora.", "帰[かえ]りにくい。", kaerinikui]
  - ask: ["Say: hard to say.", "Diga: difícil de dizer.", "言[い]いにくい", iinikui]
  - ask: ["Say: a report.", "Diga: um relatório.", "報告[ほうこく]", houkoku]
  - ask: ["Offer help before leaving: is there anything I can help with?", "Ofereça ajuda antes de sair: há algo em que eu possa ajudar?", "何[なに] か お手伝[てつだ]い する こと は ございます か。", nanika-otetsudai]
  - ask: ["Give the polite excuse: I have plans.", "Dê a desculpa educada: tenho um compromisso.", "予定[よてい] が ありまして…", yotei-ga-arimashite]
  - ask: ["Say: that's it for today.", "Diga: por hoje é isso.", "今日[きょう] は これ で", kyou-wa-kore-de]
  - ask: ["Say: overtime pay.", "Diga: pagamento de hora extra.", "残業代[ざんぎょうだい]", zangyoudai]
  - ask: ["Say: unpaid overtime.", "Diga: hora extra não paga.", "サービス 残業[ざんぎょう]", saabisu-zangyou]
  - ask: ["Say: relaxed, at ease.", "Diga: à vontade.", "気楽[きらく] に", rakuni]
  - note: ["Leaving before the boss goes smoothly with a ritual: report what you did, offer help, give a short polite reason, then «お先[さき] に 失礼[しつれい] します». «サービス 残業[ざんぎょう]», unpaid overtime, is illegal — every hour worked must be paid — though it still happens.", "Sair antes do chefe fica tranquilo com um ritual: relatar o que fez, oferecer ajuda, dar um motivo curto e educado, e então «お先[さき] に 失礼[しつれい] します». A «サービス 残業[ざんぎょう]», hora extra não paga, é ilegal — toda hora trabalhada deve ser paga — mas ainda acontece."]
  - pt_only: "Você viu o costume no A2; aqui está a técnica para sair sem atrito. E guarde a lei: hora extra é paga, no Japão como pela CLT."
