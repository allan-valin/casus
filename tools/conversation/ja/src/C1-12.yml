id: C1-12
protagonist: m
title: ["The farm", "A fazenda"]
situation: ["May in Hiroshima. Your grandmother's brother asks you to help plant rice. Barefoot in the mud, he tells you how it used to be.", "Maio em Hiroshima. O irmão da sua avó pede ajuda para plantar arroz. Descalço na lama, ele conta como era antigamente."]
learn: [n2-050]
culture: —
items:
  - [taue, "田植[たう]え", "rice planting", "plantio de arroz"]
  - [tanbo, "田[た]んぼ", "rice paddy", "arrozal"]
  - [nouka, "農家[のうか]", "farmer, farming family", "agricultor, família de agricultores"]
  - [tetsudai, "手伝[てつだ]い", "help", "ajuda"]
  - [mono-da, "〜もの だ", "used to (with nostalgia); that's how it is", "costumava (com saudade); é assim mesmo"]
  - [yatta-mono-da, "よく やった もの だ", "we used to do it a lot", "a gente fazia muito"]
  - [nae, "苗[なえ]", "seedling", "muda"]
  - [doro, "泥[どろ]", "mud", "lama"]
  - [koshi-ga-itai, "腰[こし] が 痛[いた]い", "my back hurts", "minhas costas doem"]
  - [kikai-de, "機械[きかい] で", "by machine", "com máquina"]
  - [aki-ni-wa, "秋[あき] に は", "in autumn", "no outono"]
dialogue:
  - [ojisan, "昔[むかし] は 村[むら] の みんな で 田植[たう]え を した もん じゃ。", "In the old days the whole village planted rice together.", "Antigamente a aldeia inteira plantava arroz junto."]
  - [protagonist, "今[いま] は 機械[きかい] で する ん です よね。", "Nowadays it's done by machine, right?", "Hoje é com máquina, né?"]
  - [ojisan, "そう じゃ。 でも この 小[ちい]さい 田[た]んぼ は 手[て] で 植[う]える。 苗[なえ] を 三本[さんぼん] ずつ。", "That's right. But this little paddy we plant by hand. Three seedlings at a time.", "Isso mesmo. Mas este arrozal pequeno a gente planta à mão. Três mudas por vez."]
  - [protagonist, "泥[どろ] が 冷[つめ]たくて 気持[きも]ち いい。 でも 腰[こし] が 痛[いた]い！", "The mud is cool and feels nice. But my back hurts!", "A lama é fresquinha e gostosa. Mas as costas doem!"]
  - [ojisan, "農家[のうか] の 仕事[しごと] は そういう もの じゃ。", "That's how farm work is.", "Trabalho de agricultor é assim mesmo."]
  - [protagonist, "祖母[そぼ] も 子供[こども] の 時[とき]、 この 田[た]んぼ で 手伝[てつだ]った ん でしょう か。", "Do you think my grandmother helped in this paddy as a child?", "Será que a minha avó ajudava neste arrozal quando era criança?"]
  - [ojisan, "おお、 姉[あね] と よく 泥[どろ] だらけ に なった もん じゃ。", "Oh, my sister and I used to get covered in mud.", "Ah, eu e minha irmã vivíamos cobertos de lama."]
  - [protagonist, "秋[あき] に は 稲刈[いねか]り も 手伝[てつだ]い に 来[き]ます。", "In autumn I'll come and help with the harvest too.", "No outono venho ajudar na colheita também."]
teach:
  - ask: ["Say: rice planting.", "Diga: plantio de arroz.", "田植[たう]え", taue]
  - ask: ["Say: a rice paddy.", "Diga: um arrozal.", "田[た]んぼ", tanbo]
  - ask: ["Say: a seedling.", "Diga: uma muda.", "苗[なえ]", nae]
  - ask: ["Say: mud.", "Diga: lama.", "泥[どろ]", doro]
  - ask: ["Say: a farming family.", "Diga: família de agricultores.", "農家[のうか]", nouka]
  - ask: ["Say: help.", "Diga: ajuda.", "手伝[てつだ]い", tetsudai]
  - ask: ["Say: my back hurts.", "Diga: minhas costas doem.", "腰[こし] が 痛[いた]い。", koshi-ga-itai]
  - note: ["«〜もの だ» has two common uses: with a past verb, fond memories — «よく やった もの だ», we used to do it a lot; with a plain verb or adjective, that's the nature of things — «農家[のうか] の 仕事[しごと] は そういう もの だ», that's how farm work is. In speech it often shortens to «もん だ», and in Hiroshima dialect «もん じゃ».", "«〜もの だ» tem dois usos comuns: com verbo no passado, lembrança carinhosa — «よく やった もの だ», a gente fazia muito; com verbo ou adjetivo simples, a natureza das coisas — «農家[のうか] の 仕事[しごと] は そういう もの だ», trabalho de agricultor é assim. Na fala vira «もん だ», e no dialeto de Hiroshima «もん じゃ»."]
  - ask: ["Say the pattern: used to; that's how it is.", "Diga o padrão: costumava; é assim mesmo.", "〜もの だ", mono-da]
  - ask: ["Say: we used to do it a lot.", "Diga: a gente fazia muito.", "よく やった もの だ", yatta-mono-da]
  - ask: ["Say: by machine.", "Diga: com máquina.", "機械[きかい] で", kikai-de]
  - ask: ["Say: in autumn.", "Diga: no outono.", "秋[あき] に は", aki-ni-wa]
  - note: ["Rice is planted in May and June and harvested in September and October. Most of it is done by machine now, and farmers are ageing; many small paddies survive because relatives come back on weekends to help.", "O arroz é plantado em maio e junho e colhido em setembro e outubro. Hoje quase tudo é feito com máquina, e os agricultores estão envelhecendo; muitos arrozais pequenos sobrevivem porque os parentes voltam nos fins de semana para ajudar."]
  - pt_only: "Muitos imigrantes japoneses no Brasil foram trabalhar justamente na lavoura. Plantar arroz na aldeia da avó é fazer o caminho de volta."
