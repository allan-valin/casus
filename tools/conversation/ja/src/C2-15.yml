id: C2-15
protagonist: f
title: ["History, with care", "A história, com cuidado"]
situation: ["The great-uncle takes you to the Hiroshima Peace Memorial Museum. He speaks quietly about what his parents told him of August 1945.", "O tio-avô leva você ao Museu Memorial da Paz de Hiroshima. Ele fala baixo sobre o que os pais dele contaram de agosto de 1945."]
learn: []
culture: History handled with care
items:
  - [sedai, "世代[せだい]", "generation", "geração"]
  - [sensou, "戦争[せんそう]", "war", "guerra"]
  - [kioku, "記憶[きおく]", "memory", "memória"]
  - [heiwa, "平和[へいわ]", "peace", "paz"]
  - [genbaku, "原爆[げんばく]", "atomic bomb", "bomba atômica"]
  - [hibakusha, "被爆者[ひばくしゃ]", "atomic-bomb survivor", "sobrevivente da bomba atômica", {rare: true}]
  - [katari-tsugu, "語[かた]り継[つ]ぐ", "pass down (stories)", "transmitir (a história) às gerações"]
  - [kotoba-ga-denai, "言葉[ことば] が 出[で]ません", "I'm lost for words", "fico sem palavras"]
  - [inoru, "祈[いの]る", "pray", "rezar, orar"]
  - [ikiru-chikara, "生[い]きる 力[ちから]", "the strength to live", "a força de viver"]
dialogue:
  - [ojisan, "わし の 両親[りょうしん] は、 あの 朝[あさ] 広島[ひろしま] の 町[まち] に おった。", "My parents were in the city of Hiroshima that morning.", "Os meus pais estavam na cidade de Hiroshima naquela manhã."]
  - [protagonist, "……言葉[ことば] が 出[で]ません。", "…I'm lost for words.", "…Fico sem palavras."]
  - [ojisan, "二人[ふたり] とも 被爆者[ひばくしゃ] じゃ。 でも 生[い]きて、 わし と 姉[あね] を 育[そだ]てて くれた。", "They were both survivors. But they lived, and raised my sister and me.", "Os dois foram sobreviventes. Mas viveram, e criaram a mim e a minha irmã."]
  - [protagonist, "祖母[そぼ] が ブラジル に 渡[わた]った の も、 その 後[あと] の こと です ね。", "So my grandmother went to Brazil after that.", "Então a minha avó foi para o Brasil depois disso."]
  - [ojisan, "そう じゃ。 戦争[せんそう] の 後[あと]、 新[あたら]しい 生活[せいかつ] を 探[さが]して な。", "That's right. After the war, looking for a new life.", "Isso mesmo. Depois da guerra, procurando uma vida nova."]
  - [protagonist, "歴史[れきし] は 本[ほん] で 読[よ]んで いました が、 家族[かぞく] の 記憶[きおく] と して 聞[き]く と、 重[おも]さ が 違[ちが]います。", "I'd read the history in books, but hearing it as family memory, the weight is different.", "Eu tinha lido a história nos livros, mas ouvindo como memória da família, o peso é outro."]
  - [ojisan, "わし ら の 世代[せだい] が いなく なる 前[まえ] に、 語[かた]り継[つ]いで ほしい。", "Before our generation is gone, I want you to pass it on.", "Antes que a nossa geração se vá, quero que vocês passem isso adiante."]
  - [protagonist, "はい。 平和[へいわ] を 祈[いの]って、 子供[こども] たち に も 伝[つた]えます。", "Yes. Praying for peace, I'll tell the children too.", "Sim. Rezando pela paz, vou contar para as crianças também."]
teach:
  - ask: ["Say: history.", "Diga: história.", "歴史[れきし]", rekishi]
  - ask: ["Say: war.", "Diga: guerra.", "戦争[せんそう]", sensou]
  - ask: ["Say: the atomic bomb.", "Diga: a bomba atômica.", "原爆[げんばく]", genbaku]
  - ask: ["Say: an atomic-bomb survivor.", "Diga: sobrevivente da bomba atômica.", "被爆者[ひばくしゃ]", hibakusha]
  - ask: ["Say quietly: I'm lost for words.", "Diga baixinho: fico sem palavras.", "言葉[ことば] が 出[で]ません。", kotoba-ga-denai]
  - ask: ["Say: memory.", "Diga: memória.", "記憶[きおく]", kioku]
  - ask: ["Say: a generation.", "Diga: uma geração.", "世代[せだい]", sedai]
  - ask: ["Say: pass the story down.", "Diga: transmitir a história.", "語[かた]り継[つ]ぐ", katari-tsugu]
  - ask: ["Say: peace.", "Diga: paz.", "平和[へいわ]", heiwa]
  - ask: ["Say: pray.", "Diga: rezar.", "祈[いの]る", inoru]
  - ask: ["Say: the strength to live.", "Diga: a força de viver.", "生[い]きる 力[ちから]", ikiru-chikara]
  - note: ["Talking about painful history in Japanese calls for care: short sentences, silence where needed, listening more than asking. «言葉[ことば] が 出[で]ません» is an honest response. Survivors' testimonies are being recorded and passed on, «語[かた]り継[つ]ぐ», as their generation grows old.", "Falar de uma história dolorosa em japonês pede cuidado: frases curtas, silêncio quando preciso, mais ouvir do que perguntar. «言葉[ことば] が 出[で]ません» é uma resposta honesta. Os depoimentos dos sobreviventes estão sendo gravados e transmitidos, «語[かた]り継[つ]ぐ», enquanto a geração deles envelhece."]
  - pt_only: "Muitos nikkeis no Brasil têm raízes em Hiroshima. Às vezes a história mundial está guardada numa conversa baixinha com um parente de oitenta anos."
