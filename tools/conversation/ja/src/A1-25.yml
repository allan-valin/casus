id: A1-25
protagonist: f
title: [Itadakimasu, Itadakimasu]
situation: ["Mrs Suzuki invites you to dinner. Grilled fish, rice, soup — and chopsticks.", "A senhora Suzuki convida você para jantar. Peixe grelhado, arroz, sopa — e hashi."]
learn: []
culture: Chopstick rules
items:
  - [itadakimasu, "いただきます", "(said before eating)", "(dito antes de comer)"]
  - [gochisousama, "ごちそうさま でした", "(said after eating: thank you for the meal)", "(dito depois de comer: obrigado pela refeição)"]
  - [ohashi, "お箸[はし]", "chopsticks", "hashi, pauzinhos"]
  - [sakana, "魚[さかな]", "fish", "peixe"]
  - [yuuhan, "夕飯[ゆうはん]", "dinner", "jantar"]
  - [temo-ii, "〜ても いい です か", "may I…?", "posso…?"]
  - [tabete-mo-ii, "食[た]べて も いい です か", "may I eat?", "posso comer?"]
  - [tsukatte-mo-ii, "使[つか]って も いい です か", "may I use (it)?", "posso usar?"]
  - [fooku, "フォーク", "fork", "garfo"]
  - [okawari, "おかわり", "a second helping", "repetir o prato", {rare: true}]
  - [onaka-ippai, "お腹[なか] いっぱい です", "I'm full", "estou satisfeita, cheia"]
  - [jouzu-desu-ne, "上手[じょうず] です ね", "you're good at it", "você é boa nisso"]
dialogue:
  - [suzuki, "どうぞ。 夕飯[ゆうはん] です よ。", "Here you are. Dinner.", "Pode servir-se. O jantar."]
  - [protagonist, "わあ、 魚[さかな] です ね。 いただきます！", "Oh, fish! Itadakimasu!", "Nossa, peixe! Itadakimasu!"]
  - [suzuki, "お箸[はし]、 大丈夫[だいじょうぶ] です か。 フォーク も あります よ。", "Are chopsticks okay? There's a fork too.", "Consegue com o hashi? Também tem garfo."]
  - [protagonist, "お箸[はし] で 食[た]べたい です。 練習[れんしゅう] します。", "I want to eat with chopsticks. I'll practise.", "Quero comer de hashi. Vou treinar."]
  - [suzuki, "あら、 上手[じょうず] です ね。", "Oh, you're good at it.", "Olha, você é boa nisso."]
  - [protagonist, "まだ まだ です。 この お醤油[しょうゆ]、 使[つか]って も いい です か。", "Not yet. May I use this soy sauce?", "Ainda não. Posso usar este shoyu?"]
  - [suzuki, "どうぞ、 どうぞ。 ご飯[はん] の おかわり は？", "Go ahead. More rice?", "Fique à vontade. Quer mais arroz?"]
  - [protagonist, "お腹[なか] いっぱい です。 ごちそうさま でした！", "I'm full. Thank you for the meal!", "Estou satisfeita. Obrigada pela refeição!"]
teach:
  - note: ["Before eating, hands together, you say «いただきます» — I humbly receive. After, «ごちそうさま でした» — it was a feast. Both thank the cook and the food itself; you say them even when eating alone.", "Antes de comer, mãos juntas, se diz «いただきます» — recebo com gratidão. Depois, «ごちそうさま でした» — foi um banquete. As duas agradecem a quem cozinhou e à própria comida; diz-se até comendo sozinho."]
  - ask: ["Say it before you eat.", "Diga antes de comer.", "いただきます。", itadakimasu]
  - build: [gochisousama, ["でした", "ごちそうさま でした"]]
  - ask: ["Say it after the meal.", "Diga depois da refeição.", "ごちそうさま でした。", gochisousama]
  - ask: ["Say: chopsticks.", "Diga: hashi.", "お箸[はし]", ohashi]
  - ask: ["Say: fish.", "Diga: peixe.", "魚[さかな]", sakana]
  - ask: ["Say: dinner.", "Diga: jantar.", "夕飯[ゆうはん]", yuuhan]
  - ask: ["Say: a fork.", "Diga: um garfo.", "フォーク", fooku]
  - note: ["To ask permission, take the «て» form of the verb and add «も いい です か» — is it fine even if I…: «食[た]べて も いい です か», may I eat? «使[つか]って も いい です か», may I use it? You heard «すすって も いい» with the ramen.", "Para pedir licença, use a forma «て» do verbo e acrescente «も いい です か» — tudo bem se eu…: «食[た]べて も いい です か», posso comer? «使[つか]って も いい です か», posso usar? Você ouviu «すすって も いい» no lámen."]
  - ask: ["Say the pattern: may I…?", "Diga o padrão: posso…?", "〜ても いい です か", temo-ii]
  - ask: ["Ask: may I eat?", "Pergunte: posso comer?", "食[た]べて も いい です か。", tabete-mo-ii]
  - build: [tsukatte-mo-ii, ["いい です か", "使[つか]って も いい です か"]]
  - ask: ["Ask if you may use the soy sauce — just: may I use it?", "Pergunte se pode usar o shoyu — só: posso usar?", "使[つか]って も いい です か。", tsukatte-mo-ii]
  - ask: ["She praises you. Say what she said: you're good at it.", "Ela elogia você. Repita o que ela disse: você é boa nisso.", "上手[じょうず] です ね。", jouzu-desu-ne]
  - ask: ["Say: a second helping.", "Diga: repetir o prato.", "おかわり", okawari]
  - ask: ["Say: I'm full.", "Diga: estou satisfeita.", "お腹[なか] いっぱい です。", onaka-ippai]
  - note: ["Chopsticks: never stand them upright in the rice and never pass food from chopsticks to chopsticks — both belong to funerals. Don't point with them. When praised, answer «まだ まだ です», not yet.", "Hashi: nunca deixe em pé espetado no arroz e nunca passe comida de hashi para hashi — as duas coisas são de funeral. Não aponte com eles. Quando elogiarem, responda «まだ まだ です», ainda não."]
  - pt_only: "No Brasil, aceitar a segunda porção é elogio à cozinheira, e recusar pode parecer desfeita. No Japão também se pode pedir «おかわり», mas deixar o prato limpo e dizer «ごちそうさま» já é o maior elogio."
