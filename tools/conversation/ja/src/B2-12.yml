id: B2-12
protagonist: m
title: ["Probability", "Probabilidade"]
situation: ["December: the whole office is buying Year-End Jumbo lottery tickets. Kenta asks if you want in. You do the maths.", "Dezembro: o escritório todo está comprando bilhetes da loteria de fim de ano. O Kenta pergunta se você quer entrar. Você faz as contas."]
learn: [n3-053, n3-054, ja-wben104-73]
culture: —
items:
  - [kakuritsu, "確率[かくりつ]", "probability", "probabilidade"]
  - [takarakuji, "宝[たから]くじ", "lottery", "loteria"]
  - [ataru, "当[あ]たる", "win (a prize); hit", "ganhar (prêmio); acertar"]
  - [kousui-kakuritsu, "降水[こうすい] 確率[かくりつ]", "chance of rain", "probabilidade de chuva", {rare: true}]
  - [hodo, "〜ほど", "to the extent that; as … as", "a ponto de; tanto quanto"]
  - [shinu-hodo, "死[し]ぬ ほど", "to death (extremely)", "de morrer (extremamente)"]
  - [hodo-de-wa-nai, "〜ほど では ない", "not as much as", "não tanto quanto"]
  - [nisen-man-bun-no-ichi, "二千万[にせんまん] 分[ぶん] の 一[いち]", "one in twenty million", "um em vinte milhões"]
  - [yume, "夢[ゆめ]", "dream", "sonho"]
  - [kaimasu-ka, "買[か]います か", "will you buy?", "vai comprar?"]
dialogue:
  - [kenta, "年末[ねんまつ] ジャンボ 宝[たから]くじ、 一緒[いっしょ] に 買[か]う？ 一等[いっとう] は 七億円[ななおくえん] だ よ。", "Shall we buy Year-End Jumbo tickets together? First prize is 700 million yen.", "Vamos comprar a loteria de fim de ano juntos? O primeiro prêmio é 700 milhões de ienes."]
  - [protagonist, "当[あ]たる 確率[かくりつ] は？", "What are the odds of winning?", "Qual a chance de ganhar?"]
  - [kenta, "一等[いっとう] は 二千万[にせんまん] 分[ぶん] の 一[いち] ぐらい。", "First prize is about one in twenty million.", "O primeiro prêmio é uns um em vinte milhões."]
  - [protagonist, "雷[かみなり] に 当[あ]たる ほど 低[ひく]い ね。", "As low as being hit by lightning.", "Tão baixa quanto ser atingido por um raio."]
  - [kenta, "でも 夢[ゆめ] を 買[か]う ん だ よ。 宝[たから]くじ は 夢[ゆめ]。", "But you're buying a dream. The lottery is a dream.", "Mas você compra um sonho. Loteria é sonho."]
  - [protagonist, "明日[あした] の 降水[こうすい] 確率[かくりつ] は 八十[はちじゅう] パーセント だ けど、 それ は 信[しん]じる よ。", "Tomorrow's chance of rain is 80 percent — that one I believe.", "A chance de chuva de amanhã é de 80 por cento — nessa eu acredito."]
  - [kenta, "ははは。 じゃあ 一枚[いちまい] だけ。 三百円[さんびゃくえん]。", "Ha ha. Then just one ticket. 300 yen.", "Ha ha. Então só um bilhete. 300 ienes."]
  - [protagonist, "三百円[さんびゃくえん] なら、 死[し]ぬ ほど 後悔[こうかい] しない。 買[か]おう！", "For 300 yen I won't regret it to death. Let's buy!", "Por 300 ienes não vou me arrepender até a morte. Vamos comprar!"]
teach:
  - ask: ["Say: the lottery.", "Diga: a loteria.", "宝[たから]くじ", takarakuji]
  - ask: ["Say: to win, to hit.", "Diga: ganhar, acertar.", "当[あ]たる", ataru]
  - ask: ["Say: probability.", "Diga: probabilidade.", "確率[かくりつ]", kakuritsu]
  - ask: ["Say: one in twenty million.", "Diga: um em vinte milhões.", "二千万[にせんまん] 分[ぶん] の 一[いち]", nisen-man-bun-no-ichi]
  - note: ["«〜ほど» measures degree: «雷[かみなり] に 当[あ]たる ほど 低[ひく]い» — as low as being hit by lightning; «死[し]ぬ ほど» — to death, extremely. With a negative it compares: «A は B ほど 高[たか]く ない» — A isn't as high as B.", "«〜ほど» mede grau: «雷[かみなり] に 当[あ]たる ほど 低[ひく]い» — tão baixo quanto ser atingido por um raio; «死[し]ぬ ほど» — de morrer, extremamente. Com negativo, compara: «A は B ほど 高[たか]く ない» — A não é tão alto quanto B."]
  - ask: ["Say the pattern: to the extent that.", "Diga o padrão: a ponto de.", "〜ほど", hodo]
  - ask: ["Say: extremely — to death.", "Diga: de morrer.", "死[し]ぬ ほど", shinu-hodo]
  - ask: ["Say the pattern: not as much as.", "Diga o padrão: não tanto quanto.", "〜ほど では ない", hodo-de-wa-nai]
  - ask: ["Say: a dream.", "Diga: um sonho.", "夢[ゆめ]", yume]
  - ask: ["Say: the chance of rain.", "Diga: a probabilidade de chuva.", "降水[こうすい] 確率[かくりつ]", kousui-kakuritsu]
  - ask: ["Ask: will you buy?", "Pergunte: vai comprar?", "買[か]います か。", kaimasu-ka]
  - note: ["Japanese counts big numbers in «万[まん]» (10,000) and «億[おく]» (100 million): «七億円[ななおくえん]» is 700 million yen, «二千万[にせんまん]» is twenty million. The weather forecast always gives «降水[こうすい] 確率[かくりつ]», the chance of rain, in steps of ten percent.", "O japonês conta números grandes em «万[まん]» (10 mil) e «億[おく]» (100 milhões): «七億円[ななおくえん]» são 700 milhões de ienes, «二千万[にせんまん]» são vinte milhões. A previsão do tempo sempre dá o «降水[こうすい] 確率[かくりつ]», a chance de chuva, de dez em dez por cento."]
  - pt_only: "A Mega da Virada é o nosso «年末[ねんまつ] ジャンボ»: o país inteiro compra o mesmo sonho em dezembro. As chances, nos dois casos, são de raio na cabeça."
