id: C1-28
protagonist: m
title: ["Visitors from Brazil", "Visitas do Brasil"]
situation: ["Your parents fly in to meet their grandson. Dinner with Yui's parents: you translate both ways, choosing every humble and respectful word.", "Seus pais vêm conhecer o neto. Jantar com os pais da Yui: você traduz nos dois sentidos, escolhendo cada palavra humilde e respeitosa."]
learn: []
culture: Two cultures at one table
items:
  - [goshoukai, "ご紹介[しょうかい] します", "let me introduce (humble)", "permita-me apresentar (humilde)"]
  - [kuraberu, "比[くら]べる", "compare", "comparar"]
  - [hajimete-review, "初[はじ]めて の 日本[にほん]", "first time in Japan", "primeira vez no Japão"]
  - [mairimashita-review, "参[まい]りました", "came (humble, of my family)", "vieram (humilde, da minha família)"]
  - [irasshatta, "いらっしゃった", "came (respectful, of others)", "vieram (respeitoso, dos outros)"]
  - [haha-ga-moushite, "母[はは] が 申[もう]して おります", "my mother says (humble)", "minha mãe diz (humilde)"]
  - [ossharu-review, "お義父[とう]さん が おっしゃる", "father-in-law says (respectful)", "o sogro diz (respeitoso)"]
  - [omago, "お孫[まご] さん", "(your) grandchild", "o neto (dos outros)"]
  - [mago, "孫[まご]", "(my) grandchild", "neto (meu)"]
  - [shuukan-no-chigai, "習慣[しゅうかん] の 違[ちが]い", "difference in customs", "diferença de costumes"]
dialogue:
  - [protagonist, "ご紹介[しょうかい] します。 私[わたし] の 父[ちち] と 母[はは] です。 ブラジル から 参[まい]りました。", "Let me introduce my father and mother. They have come from Brazil.", "Permitam-me apresentar meu pai e minha mãe. Vieram do Brasil."]
  - [yui-chichi, "遠[とお]い ところ を、 よく いらっしゃいました。", "Welcome — you've come such a long way.", "Sejam bem-vindos — vieram de tão longe."]
  - [protagonist, "母[はは] が「日本[にほん] は 初[はじ]めて で、 何[なに] もかも 美[うつく]しい」 と 申[もう]して おります。", "My mother says, “It's my first time in Japan, and everything is beautiful.”", "Minha mãe diz: «É a minha primeira vez no Japão, e tudo é lindo»."]
  - [yui-chichi, "ブラジル と 比[くら]べて、 日本[にほん] の 料理[りょうり] は どう です か。", "Compared with Brazil, how do you find Japanese food?", "Comparando com o Brasil, o que acham da comida japonesa?"]
  - [protagonist, "父[ちち] は「お刺身[さしみ] は 初[はじ]めて です が、 おいしい」 と 申[もう]して おります。", "My father says, “It's my first time eating sashimi, but it's delicious.”", "Meu pai diz: «É a primeira vez que como sashimi, mas está delicioso»."]
  - [yui, "お義父[とう]さん、 お孫[まご] さん を 抱[だ]っこ して みます か。", "Father, would you like to hold your grandson?", "Sogro, quer pegar o seu neto no colo?"]
  - [protagonist, "父[ちち] が 泣[な]いて います。 初[はじ]めて の 孫[まご] だ から。", "My father is crying. It's his first grandchild.", "Meu pai está chorando. É o primeiro neto dele."]
  - [yui-chichi, "習慣[しゅうかん] の 違[ちが]い は あって も、 孫[まご] を 思[おも]う 気持[きも]ち は 同[おな]じ です ね。", "Our customs may differ, but the love for a grandchild is the same.", "Os costumes podem ser diferentes, mas o carinho pelo neto é igual."]
teach:
  - ask: ["Introduce them humbly: let me introduce…", "Apresente-os com humildade: permitam-me apresentar…", "ご紹介[しょうかい] します。", goshoukai]
  - note: ["Translating between families is a «謙譲語[けんじょうご]» and «尊敬語[そんけいご]» exercise: your own parents are lowered — «参[まい]りました», «母[はは] が 申[もう]して おります» — and the in-laws raised — «いらっしゃいました», «おっしゃる». Your grandchild is «孫[まご]»; theirs, «お孫[まご] さん».", "Traduzir entre famílias é um exercício de «謙譲語[けんじょうご]» e «尊敬語[そんけいご]»: os próprios pais se rebaixam — «参[まい]りました», «母[はは] が 申[もう]して おります» — e os sogros se elevam — «いらっしゃいました», «おっしゃる». O seu neto é «孫[まご]»; o deles, «お孫[まご] さん»."]
  - ask: ["Say humbly: they came — your own parents.", "Diga com humildade: vieram — seus próprios pais.", "参[まい]りました。", mairimashita-review]
  - ask: ["Say respectfully: they came — the in-laws.", "Diga com respeito: vieram — os sogros.", "いらっしゃった", irasshatta]
  - ask: ["Report humbly: my mother says…", "Relate com humildade: minha mãe diz…", "母[はは] が 申[もう]して おります。", haha-ga-moushite]
  - ask: ["Say respectfully: my father-in-law says.", "Diga com respeito: o sogro diz.", "お義父[とう]さん が おっしゃる", ossharu-review]
  - ask: ["Say: compare.", "Diga: comparar.", "比[くら]べる", kuraberu]
  - ask: ["Say: first time in Japan.", "Diga: primeira vez no Japão.", "初[はじ]めて の 日本[にほん]", hajimete-review]
  - ask: ["Say: my grandchild.", "Diga: meu neto.", "孫[まご]", mago]
  - ask: ["Say: your grandchild — politely.", "Diga: o seu neto — com respeito.", "お孫[まご] さん", omago]
  - ask: ["Say: a difference in customs.", "Diga: diferença de costumes.", "習慣[しゅうかん] の 違[ちが]い", shuukan-no-chigai]
  - note: ["Interpreting for family at a formal meal means translating tone, not only words: a Brazilian hug becomes a bow in Japanese, a loud compliment becomes a humble phrase. Tell both sides beforehand what to expect — shoes, chopsticks, gifts — and the evening goes smoothly.", "Interpretar para a família num jantar formal é traduzir o tom, não só as palavras: o abraço brasileiro vira reverência em japonês, o elogio barulhento vira frase humilde. Conte antes para os dois lados o que esperar — sapatos, hashi, presentes — e a noite corre tranquila."]
  - pt_only: "Seus pais vão querer abraçar os sogros. Avise antes: uma reverência funciona, e o abraço pode vir no fim da noite, quando o gelo já quebrou."
