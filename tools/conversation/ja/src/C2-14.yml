id: C2-14
protagonist: m
title: ["Raising children", "Criar filhos"]
situation: ["Kenta and Misaki are wondering whether to send Hina, now five, to cram school for a private primary-school entrance exam. They ask what you and Yui think.", "O Kenta e a Misaki estão pensando se mandam a Hina, agora com cinco anos, para um cursinho de preparação para a prova de uma escola primária particular. Eles perguntam o que você e a Yui acham."]
learn: []
culture: Exam pressure — a social problem
items:
  - [juku, "塾[じゅく]", "cram school", "cursinho"]
  - [ojuken, "お受験[じゅけん]", "entrance exam for young children", "prova de admissão para crianças pequenas", {rare: true}]
  - [kyouiku-mama, "教育[きょういく] ママ", "pushy education mum", "mãe obcecada com estudos", {rare: true}]
  - [kyousou, "競争[きょうそう]", "competition", "competição"]
  - [mono-nara, "〜もの なら", "if (you) could / if you dare", "se der para / se ousar"]
  - [dekiru-mono-nara, "できる もの なら", "if it were possible", "se fosse possível"]
  - [shigaku, "私立[しりつ]", "private (school)", "particular"]
  - [kouritsu, "公立[こうりつ]", "public (school)", "pública"]
  - [nobi-nobi, "のびのび", "freely, without pressure", "à vontade, sem pressão"]
  - [shourai-no-tame, "将来[しょうらい] の ため", "for the future", "pelo futuro"]
dialogue:
  - [misaki, "陽菜[ひな] を 私立[しりつ] の 小学校[しょうがっこう] に 入[い]れたい ん だ けど、 その ため に は 塾[じゅく] が 必要[ひつよう] な の。", "We'd like to get Hina into a private primary school, but for that she needs cram school.", "Queremos colocar a Hina numa escola primária particular, mas para isso ela precisa de cursinho."]
  - [protagonist, "五歳[ごさい] で 塾[じゅく]？ お受験[じゅけん] って 大変[たいへん] だ ね。", "Cram school at five? These child entrance exams are tough.", "Cursinho aos cinco anos? Essa prova infantil é puxada."]
  - [kenta, "東京[とうきょう] ほど じゃ ない けど、 浜松[はままつ] でも 競争[きょうそう] が ある ん だ。", "Not as bad as Tokyo, but there's competition in Hamamatsu too.", "Não é tanto quanto em Tóquio, mas em Hamamatsu também tem competição."]
  - [yui, "将来[しょうらい] の ため も 大事[だいじ] だ けど、 今[いま] は のびのび 遊[あそ]ぶ 時期[じき] じゃ ない？", "The future matters, but isn't now the time for her to play freely?", "O futuro importa, mas agora não é a fase de brincar à vontade?"]
  - [misaki, "わかる。 私[わたし] も 教育[きょういく] ママ に は なりたく ない。", "I know. I don't want to be a pushy education mum either.", "Eu sei. Também não quero virar mãe obcecada com estudos."]
  - [protagonist, "できる もの なら、 本人[ほんにん] に 聞[き]いて みたら？ 陽菜[ひな] ちゃん は 何[なに] が したい か。", "If you can, why not ask her? What Hina herself wants to do.", "Se der, por que não perguntam a ela? O que a Hina quer fazer."]
  - [kenta, "陽菜[ひな] は「太鼓[たいこ] が したい」 って 言[い]って た な。", "Hina said she wants to do taiko.", "A Hina disse que quer tocar taikô."]
  - [yui, "公立[こうりつ] で も 太鼓[たいこ] は できる よ。 家族[かぞく] で 決[き]めて ね。", "She can do taiko at a public school too. Decide as a family.", "Dá para fazer taikô na escola pública também. Decidam em família."]
teach:
  - ask: ["Say: cram school.", "Diga: cursinho.", "塾[じゅく]", juku]
  - ask: ["Say: the entrance exam for small children.", "Diga: a prova de admissão infantil.", "お受験[じゅけん]", ojuken]
  - ask: ["Say: competition.", "Diga: competição.", "競争[きょうそう]", kyousou]
  - ask: ["Say: a private school.", "Diga: escola particular.", "私立[しりつ]", shigaku]
  - ask: ["Say: a public school.", "Diga: escola pública.", "公立[こうりつ]", kouritsu]
  - ask: ["Say: freely, without pressure.", "Diga: à vontade.", "のびのび", nobi-nobi]
  - ask: ["Say: for the future.", "Diga: pelo futuro.", "将来[しょうらい] の ため", shourai-no-tame]
  - ask: ["Say: a pushy education mum.", "Diga: mãe obcecada com estudos.", "教育[きょういく] ママ", kyouiku-mama]
  - note: ["«〜もの なら» is if — for something hard or unlikely: «できる もの なら», if it were possible. With the volitional it's a warning: «遅刻[ちこく] しよう もの なら、 怒[おこ]られる», if you dare be late, you'll be scolded.", "«〜もの なら» é se — para algo difícil ou improvável: «できる もの なら», se fosse possível. Com o volitivo vira aviso: «遅刻[ちこく] しよう もの なら、 怒[おこ]られる», se ousar chegar atrasado, leva bronca."]
  - ask: ["Say the pattern: if (it were) possible.", "Diga o padrão: se der para.", "〜もの なら", mono-nara]
  - ask: ["Say: if it were possible.", "Diga: se fosse possível.", "できる もの なら", dekiru-mono-nara]
  - note: ["Most Japanese children attend free public schools, but exams decide the route to high school and university, and many go to «塾[じゅく]» from primary age. In big cities some families even prepare preschoolers for private-school «お受験[じゅけん]». The pressure is a long-running social debate.", "A maioria das crianças japonesas estuda em escola pública gratuita, mas as provas decidem o caminho até o ensino médio e a universidade, e muitas frequentam «塾[じゅく]» desde o primário. Nas cidades grandes algumas famílias preparam até crianças de pré-escola para a «お受験[じゅけん]» das escolas particulares. A pressão é um debate social antigo."]
  - pt_only: "O cursinho brasileiro é para o vestibular; o japonês começa às vezes no jardim de infância. A pergunta da Yui vale nos dois países: e a infância?"
