id: A1-12
protagonist: m
title: [Animals, Animais]
situation: ["Sunday at the small shrine near your flat. Kenta shows you the cats that live there.", "Domingo no pequeno santuário perto de casa. O Kenta mostra os gatos que moram ali."]
learn: [n5-019, n5-020]
culture: いる for the living, ある for things
items:
  - [neko, "猫[ねこ]", "cat", "gato"]
  - [inu, "犬[いぬ]", "dog", "cachorro"]
  - [tori, "鳥[とり]", "bird", "pássaro"]
  - [kawaii, "かわいい", "cute", "fofo"]
  - [imasu, "います", "there is (living things)", "há, tem (seres vivos)"]
  - [arimasu, "あります", "there is (things)", "há, tem (coisas)"]
  - [jinja, "神社[じんじゃ]", "shrine", "santuário"]
  - [nanbiki, "何匹[なんびき]", "how many (animals)", "quantos (animais)"]
  - [ooi, "多[おお]い", "many", "muitos"]
  - [sawaru, "触[さわ]っても いい です か", "may I touch?", "posso tocar?"]
  - [dame, "だめ", "no good, not allowed", "não pode"]
dialogue:
  - [kenta, "ここ が 神社[じんじゃ] です。 猫[ねこ] が います よ。", "This is the shrine. There are cats.", "Este é o santuário. Tem gatos."]
  - [protagonist, "本当[ほんとう] だ！ かわいい！ 何匹[なんびき] います か。", "Really! Cute! How many are there?", "É verdade! Que fofos! Quantos tem?"]
  - [kenta, "五匹[ごひき] くらい。 鳥[とり] も 多[おお]い です。", "About five. There are lots of birds too.", "Uns cinco. Tem muitos pássaros também."]
  - [protagonist, "犬[いぬ] は？", "And dogs?", "E cachorros?"]
  - [kenta, "犬[いぬ] は いません。 あそこ に お守[まも]り が あります。", "No dogs. Over there are amulets.", "Cachorros, não. Ali tem amuletos."]
  - [protagonist, "猫[ねこ] を 触[さわ]っても いい です か。", "May I touch the cats?", "Posso tocar nos gatos?"]
  - [kenta, "うーん、 ちょっと だめ です ね。", "Hmm, better not.", "Hmm, melhor não."]
  - [protagonist, "わかりました。 見[み]る だけ。", "Understood. Just looking.", "Entendi. Só olhando."]
teach:
  - ask: ["Say: cat.", "Diga: gato.", "猫[ねこ]", neko]
  - ask: ["Say: dog.", "Diga: cachorro.", "犬[いぬ]", inu]
  - ask: ["Say: bird.", "Diga: pássaro.", "鳥[とり]", tori]
  - ask: ["Say: cute!", "Diga: que fofo!", "かわいい！", kawaii]
  - note: ["'There is' has two verbs: «います» for living things, «あります» for things. «猫[ねこ] が います», but «お守[まも]り が あります».", "'Há' tem dois verbos: «います» para seres vivos, «あります» para coisas. «猫[ねこ] が います», mas «お守[まも]り が あります»."]
  - ask: ["Say: there are cats.", "Diga: tem gatos.", "猫[ねこ] が います。", neko, imasu]
  - ask: ["Say: there are no dogs.", "Diga: não tem cachorros.", "犬[いぬ] は いません。", inu, imasu]
  - ask: ["Say: there are amulets over there.", "Diga: ali tem amuletos.", "あそこ に お守[まも]り が あります。", arimasu]
  - ask: ["Ask how many there are (animals).", "Pergunte quantos tem (animais).", "何匹[なんびき] います か。", nanbiki, imasu]
  - ask: ["Say: the shrine.", "Diga: o santuário.", "神社[じんじゃ]", jinja]
  - ask: ["Say: there are many birds.", "Diga: tem muitos pássaros.", "鳥[とり] が 多[おお]い です。", tori, ooi]
  - ask: ["Ask if you may touch the cat.", "Pergunte se pode tocar no gato.", "猫[ねこ] を 触[さわ]っても いい です か。", sawaru]
  - ask: ["He says it's not allowed, softly. What's the word?", "Ele diz que não pode, com jeito. Qual a palavra?", "だめ", dame]
