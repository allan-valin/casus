id: A2-26
protagonist: m
title: [A date again, Um encontro de novo]
situation: ["Second date with Yui: a walk by the lake at sunset. A long silence — and you start to worry.", "Segundo encontro com a Yui: uma caminhada à beira do lago no pôr do sol. Um silêncio comprido — e você começa a se preocupar."]
learn: [n5-048]
culture: Silence is not rejection
items:
  - [chinmoku, "沈黙[ちんもく]", "silence", "silêncio", {rare: true}]
  - [hazukashii, "恥[は]ずかしい", "embarrassed, shy", "com vergonha, tímido"]
  - [mata-aitai, "また 会[あ]いたい", "I want to see you again", "quero te ver de novo"]
  - [tereru, "照[て]れます", "get bashful", "fico sem graça"]
  - [yuuhi, "夕日[ゆうひ]", "sunset, evening sun", "pôr do sol"]
  - [shizuka, "静[しず]か", "quiet", "quieto, silencioso"]
  - [daijoubu-desu-ka-nani-ka, "何[なに] か あった？", "did something happen?", "aconteceu alguma coisa?"]
  - [ureshii, "嬉[うれ]しい", "happy, glad", "feliz, contente"]
  - [kanjimasu, "感[かん]じます", "feel", "sinto"]
  - [issho-ni-iru, "一緒[いっしょ] に いる", "being together", "estar junto"]
dialogue:
  - [yui, "夕日[ゆうひ]、 きれい です ね。", "The sunset is beautiful.", "O pôr do sol está lindo."]
  - [protagonist, "そう です ね。", "Yes, it is.", "É mesmo."]
  - [yui, "……", "……", "……"]
  - [protagonist, "あの… 何[なに] か あった？ 静[しず]か だ けど。", "Um… did something happen? You're quiet.", "Hum… aconteceu alguma coisa? Você está quieta."]
  - [yui, "いいえ。 一緒[いっしょ] に いる と、 話[はな]さなくて も 楽[たの]しい です。", "No. When we're together, it's nice even without talking.", "Não. Quando a gente está junto, é bom mesmo sem falar."]
  - [protagonist, "ブラジル で は、 沈黙[ちんもく] は ちょっと 怖[こわ]い です。", "In Brazil silence is a bit scary.", "No Brasil o silêncio dá um pouco de medo."]
  - [yui, "日本[にほん] で は 普通[ふつう] です よ。 …今日[きょう] は 嬉[うれ]しかった です。", "In Japan it's normal. …I was happy today.", "No Japão é normal. …Hoje eu fiquei feliz."]
  - [protagonist, "僕[ぼく] も。 また 会[あ]いたい です。 …恥[は]ずかしい！ 照[て]れます ね。", "Me too. I want to see you again. …Embarrassing! I'm blushing.", "Eu também. Quero te ver de novo. …Que vergonha! Fiquei sem graça."]
teach:
  - ask: ["Say: the sunset.", "Diga: o pôr do sol.", "夕日[ゆうひ]", yuuhi]
  - ask: ["Say: silence.", "Diga: silêncio.", "沈黙[ちんもく]", chinmoku]
  - ask: ["Say: she's quiet.", "Diga: ela está quieta.", "静[しず]か です。", shizuka]
  - ask: ["Ask gently: did something happen?", "Pergunte com jeito: aconteceu alguma coisa?", "何[なに] か あった？", daijoubu-desu-ka-nani-ka]
  - ask: ["Say: being together.", "Diga: estar junto.", "一緒[いっしょ] に いる", issho-ni-iru]
  - ask: ["Say: I feel it.", "Diga: eu sinto.", "感[かん]じます。", kanjimasu]
  - ask: ["Say: I'm happy.", "Diga: estou feliz.", "嬉[うれ]しい です。", ureshii]
  - note: ["You know «〜たい», want to. Said to a person, «また 会[あ]いたい» — I want to see you again — is already a lot in Japanese: direct feelings are said rarely, so they weigh more.", "Você conhece «〜たい», quero. Dito a uma pessoa, «また 会[あ]いたい» — quero te ver de novo — já é muito em japonês: sentimento dito direto é raro, por isso pesa mais."]
  - build: [mata-aitai, ["会[あ]いたい", "また 会[あ]いたい"]]
  - ask: ["Tell her: I want to see you again.", "Diga a ela: quero te ver de novo.", "また 会[あ]いたい です。", mata-aitai]
  - ask: ["Say: embarrassing.", "Diga: que vergonha.", "恥[は]ずかしい。", hazukashii]
  - ask: ["Say: I'm getting bashful.", "Diga: fiquei sem graça.", "照[て]れます。", tereru]
  - note: ["In Japanese conversation a pause is not a problem to fix: silence can mean comfort, thinking, or shared feeling. Filling every gap can feel pushy. If you're unsure, a soft «何[なに] か あった？» is enough.", "Na conversa japonesa a pausa não é um problema a resolver: o silêncio pode ser conforto, reflexão ou sentimento em comum. Preencher todo vazio pode parecer insistência. Se ficar em dúvida, um «何[なに] か あった？» suave basta."]
  - pt_only: "Brasileiro preenche o silêncio quase por reflexo. No Japão, um silêncio tranquilo num encontro costuma ser bom sinal."
