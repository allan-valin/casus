id: A1-22
protagonist: m
title: [Times, Horários]
situation: ["Chief Sato tells you about tomorrow's meeting in the office. You ask what time it starts.", "A chefe Sato avisa sobre a reunião de amanhã no escritório. Você pergunta a que horas começa."]
learn: [n5-902]
culture: Five minutes early is on time
items:
  - [kaigi, "会議[かいぎ]", "meeting", "reunião"]
  - [kuji, "九時[くじ]", "nine o'clock", "nove horas"]
  - [nanji-kara, "何時[なんじ] から です か", "from what time is it?", "começa a que horas?"]
  - [jikan, "時間[じかん]", "time; hour", "tempo; hora"]
  - [gofun-mae, "五分[ごふん] 前[まえ]", "five minutes before", "cinco minutos antes"]
  - [okuremasu, "遅[おく]れます", "be late", "atraso, chego atrasado"]
  - [okurenaide, "遅[おく]れないで ください", "please don't be late", "não se atrase, por favor"]
  - [hayaku, "早[はや]く", "early", "cedo"]
  - [kimasu, "来[き]ます", "come", "venho"]
  - [jippun, "十分[じゅっぷん]", "ten minutes", "dez minutos"]
  - [ima, "今[いま]", "now", "agora"]
  - [nanji-desu-ka, "今[いま] 何時[なんじ] です か", "what time is it now?", "que horas são agora?"]
dialogue:
  - [sato, "明日[あした] は 会議[かいぎ] が あります。", "There's a meeting tomorrow.", "Amanhã tem reunião."]
  - [protagonist, "何時[なんじ] から です か。", "What time does it start?", "Começa a que horas?"]
  - [sato, "九時[くじ] から です。 一時間[いちじかん] ぐらい です。", "At nine. About an hour.", "Às nove. Mais ou menos uma hora."]
  - [protagonist, "わかりました。 九時[くじ] に 来[き]ます。", "Understood. I'll come at nine.", "Entendido. Venho às nove."]
  - [sato, "九時[くじ] は ちょっと… 五分[ごふん] 前[まえ] に 来[き]て ください。", "Nine is a bit… Please come five minutes before.", "Nove é meio… Venha cinco minutos antes."]
  - [protagonist, "五分[ごふん] 前[まえ] です ね。 遅[おく]れません。", "Five minutes before. I won't be late.", "Cinco minutos antes. Não vou me atrasar."]
  - [sato, "電車[でんしゃ] が 遅[おく]れます から、 早[はや]く 出[で]て ください ね。", "Trains can be late, so leave early.", "O trem pode atrasar, então saia cedo."]
  - [protagonist, "はい。 あの、 今[いま] 何時[なんじ] です か。", "Yes. Um, what time is it now?", "Certo. Hum, que horas são agora?"]
  - [sato, "五時[ごじ] 十分[じゅっぷん] です。 お疲[つか]れさま でした。", "Ten past five. Thanks for your work today.", "Cinco e dez. Bom trabalho hoje."]
teach:
  - ask: ["Say: a meeting.", "Diga: uma reunião.", "会議[かいぎ]", kaigi]
  - note: ["Hours are the number plus «時[じ]»: «一時[いちじ]», «二時[にじ]», «五時[ごじ]». Watch nine: «九時[くじ]», not «きゅうじ». Minutes are «分[ふん]» or «分[ぷん]»: «五分[ごふん]», «十分[じゅっぷん]».", "As horas são o número mais «時[じ]»: «一時[いちじ]», «二時[にじ]», «五時[ごじ]». Atenção ao nove: «九時[くじ]», não «きゅうじ». Os minutos são «分[ふん]» ou «分[ぷん]»: «五分[ごふん]», «十分[じゅっぷん]»."]
  - ask: ["Say: nine o'clock.", "Diga: nove horas.", "九時[くじ]", kuji]
  - ask: ["Ask what time the meeting starts.", "Pergunte a que horas começa a reunião.", "何時[なんじ] から です か。", nanji-kara]
  - ask: ["Say: time.", "Diga: tempo, hora.", "時間[じかん]", jikan]
  - ask: ["Say: now.", "Diga: agora.", "今[いま]", ima]
  - build: [nanji-desu-ka, ["です か", "何時[なんじ] です か", "今[いま] 何時[なんじ] です か"]]
  - ask: ["Ask what time it is now.", "Pergunte que horas são agora.", "今[いま] 何時[なんじ] です か。", nanji-desu-ka]
  - ask: ["Say: ten minutes.", "Diga: dez minutos.", "十分[じゅっぷん]", jippun]
  - ask: ["Say: five minutes before.", "Diga: cinco minutos antes.", "五分[ごふん] 前[まえ]", gofun-mae]
  - ask: ["Promise to come at nine.", "Prometa vir às nove.", "九時[くじ] に 来[き]ます。", kimasu]
  - ask: ["Say: the train is late.", "Diga: o trem está atrasado.", "電車[でんしゃ] が 遅[おく]れます。", okuremasu]
  - ask: ["Say: I'll come early.", "Diga: venho cedo.", "早[はや]く 来[き]ます。", hayaku]
  - ask: ["Ask a colleague not to be late.", "Peça a um colega que não se atrase.", "遅[おく]れないで ください。", okurenaide]
  - note: ["When the chief says nine «は ちょっと…», she means: nine is too late. In a Japanese office, five minutes early is on time and on time is already late. Trains do run on the minute, but when one is late the station gives you a delay certificate, «遅延証明書[ちえんしょうめいしょ]», to show at work.", "Quando a chefe diz que nove «は ちょっと…», quer dizer: nove já é tarde. No escritório japonês, cinco minutos antes é a hora certa, e na hora já é atraso. Os trens são pontuais, mas quando um atrasa a estação dá um comprovante de atraso, «遅延証明書[ちえんしょうめいしょ]», para mostrar no trabalho."]
  - pt_only: "No Brasil uma reunião às nove muitas vezes começa nove e quinze, e ninguém estranha. No Japão, chegar às nove em ponto já parece descuido."
