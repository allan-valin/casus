id: B1-29
protagonist: f
title: ["The neighbour alone", "O vizinho sozinho"]
situation: ["The old lady downstairs hasn't taken her newspaper in for two days. You knock; she's fine, but lonely. Mrs Suzuki explains the neighbourhood watch.", "A senhora idosa do andar de baixo não recolhe o jornal há dois dias. Você bate na porta; ela está bem, mas sozinha. A senhora Suzuki explica a vigilância do bairro."]
learn: []
culture: The ageing society — a social problem
items:
  - [hitorigurashi, "一人[ひとり] 暮[ぐ]らし", "living alone", "morar sozinho"]
  - [koureisha, "高齢者[こうれいしゃ]", "elderly people", "idosos"]
  - [kodoku, "孤独[こどく]", "loneliness", "solidão"]
  - [mimamori, "見守[みまも]り", "watching over (someone)", "olhar por alguém, acompanhar", {rare: true}]
  - [you-ni, "〜ように", "so that…", "para que…"]
  - [shinpai-shinai-you-ni, "心配[しんぱい] しない ように", "so that (they) don't worry", "para que não se preocupem"]
  - [koe-wo-kakeru, "声[こえ] を かける", "speak to, check on", "puxar conversa, dar uma palavra"]
  - [shinbun, "新聞[しんぶん]", "newspaper", "jornal"]
  - [daijoubu-desu-ka-polite, "お元気[げんき] です か", "are you well?", "a senhora está bem?"]
  - [mata-kimasu, "また 来[き]ます ね", "I'll come again", "eu volto, viu"]
  - [kodokushi, "孤独死[こどくし]", "dying alone (unnoticed)", "morrer sozinho (sem ninguém saber)", {rare: true}]
dialogue:
  - [protagonist, "こんにちは。 新聞[しんぶん] が たまって いた ので… お元気[げんき] です か。", "Hello. Your newspapers were piling up, so… are you well?", "Boa tarde. Os jornais estavam acumulando, então… a senhora está bem?"]
  - [obaasan, "まあ、 ありがとう。 足[あし] が 痛[いた]くて、 外[そと] に 出[で]られなかった の。", "Oh, thank you. My legs hurt, I couldn't go out.", "Ah, obrigada. As pernas estavam doendo, não consegui sair."]
  - [protagonist, "一人[ひとり] 暮[ぐ]らし です か。", "Do you live alone?", "A senhora mora sozinha?"]
  - [obaasan, "主人[しゅじん] が 亡[な]くなって から、 十年[じゅうねん]。 話[はな]す 人[ひと] が いなくて ね。", "Ten years since my husband died. There's no one to talk to.", "Faz dez anos que meu marido morreu. Não tenho com quem conversar."]
  - [protagonist, "また 来[き]ます ね。 何[なに] か あったら 呼[よ]んで ください。", "I'll come again. Call me if anything happens.", "Eu volto, viu. Se precisar de algo, me chame."]
  - [suzuki, "えらい です ね。 町内会[ちょうないかい] でも、 高齢者[こうれいしゃ] の 見守[みまも]り を して います。", "Good of you. The neighbourhood association watches over the elderly too.", "Que bom que você foi. A associação do bairro também acompanha os idosos."]
  - [protagonist, "孤独[こどく] な 人[ひと] が 多[おお]い ん です か。", "Are there many lonely people?", "Tem muita gente sozinha?"]
  - [suzuki, "ええ。 家族[かぞく] が 心配[しんぱい] しない ように、 毎朝[まいあさ] 声[こえ] を かける ん です。", "Yes. So their families don't worry, we check on them every morning.", "Sim. Para que as famílias não se preocupem, a gente passa para falar com eles toda manhã."]
teach:
  - ask: ["Say: living alone.", "Diga: morar sozinho.", "一人[ひとり] 暮[ぐ]らし", hitorigurashi]
  - ask: ["Say: elderly people.", "Diga: idosos.", "高齢者[こうれいしゃ]", koureisha]
  - ask: ["Say: loneliness.", "Diga: solidão.", "孤独[こどく]", kodoku]
  - ask: ["Say: a newspaper.", "Diga: um jornal.", "新聞[しんぶん]", shinbun]
  - ask: ["Ask an older neighbour politely: are you well?", "Pergunte com respeito a uma vizinha idosa: a senhora está bem?", "お元気[げんき] です か。", daijoubu-desu-ka-polite]
  - ask: ["Promise: I'll come again.", "Prometa: eu volto, viu.", "また 来[き]ます ね。", mata-kimasu]
  - ask: ["Say: watching over someone.", "Diga: acompanhar alguém.", "見守[みまも]り", mimamori]
  - ask: ["Say: check on someone, speak to them.", "Diga: dar uma palavra com alguém.", "声[こえ] を かける", koe-wo-kakeru]
  - note: ["«〜ように» is so that — a purpose you can't fully control: «心配[しんぱい] しない ように», so they don't worry; «忘[わす]れない ように», so as not to forget. With a plain verb, positive or negative.", "«〜ように» é para que — um objetivo que você não controla totalmente: «心配[しんぱい] しない ように», para que não se preocupem; «忘[わす]れない ように», para não esquecer. Com verbo simples, afirmativo ou negativo."]
  - ask: ["Say the pattern: so that…", "Diga o padrão: para que…", "〜ように", you-ni]
  - ask: ["Say: so that they don't worry.", "Diga: para que não se preocupem.", "心配[しんぱい] しない ように", shinpai-shinai-you-ni]
  - ask: ["Say: dying alone, unnoticed.", "Diga: morrer sozinho sem ninguém saber.", "孤独死[こどくし]", kodokushi]
  - note: ["Almost three in ten people in Japan are over 65, and many live alone. «孤独死[こどくし]» — dying alone, found days later — is a known social problem. Neighbourhood associations, mail carriers and delivery services keep an eye out: piled-up newspapers are a warning sign.", "Quase três em cada dez pessoas no Japão têm mais de 65 anos, e muitas moram sozinhas. O «孤独死[こどくし]» — morrer sozinho e ser encontrado dias depois — é um problema social conhecido. Associações de bairro, carteiros e serviços de entrega ficam atentos: jornal acumulado é sinal de alerta."]
  - pt_only: "No Brasil a avó costuma morar com a família ou perto dela. No Japão muitos idosos vivem sós — uma visita, um «お元気[げんき] です か», faz diferença."
