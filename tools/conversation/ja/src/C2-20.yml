id: C2-20
protagonist: m
title: ["The beach house", "A casa na praia"]
situation: ["Three families rent a holiday house by the sea in Izu for the weekend: you and Yui, Kenta and Misaki, Lucas. Sunday night: settling up.", "Três famílias alugam uma casa de veraneio na praia em Izu para o fim de semana: você e a Yui, o Kenta e a Misaki, o Lucas. Domingo à noite: o acerto de contas."]
learn: [n5-047]
culture: —
items:
  - [bessou, "別荘[べっそう]", "holiday house", "casa de veraneio"]
  - [seisan, "精算[せいさん]", "settling up (the bill)", "acerto de contas"]
  - [baabekyuu, "バーベキュー", "barbecue", "churrasco"]
  - [zutsu, "〜ずつ", "each, apiece", "cada um, por pessoa"]
  - [hitori-ichiman-zutsu, "一人[ひとり] 一万円[いちまんえん] ずつ", "10,000 yen each", "10 mil ienes cada um"]
  - [ryoushuusho, "領収書[りょうしゅうしょ]", "receipt", "recibo"]
  - [tatekae, "立[た]て替[か]える", "pay for someone (to be paid back)", "pagar adiantado por alguém"]
  - [ichiban-ooku, "一番[いちばん] 多[おお]く", "the most", "o máximo, a maior parte"]
  - [kodomo-wa-hangaku, "子供[こども] は 半額[はんがく]", "children pay half", "criança paga metade"]
  - [keisan, "計算[けいさん]", "calculation", "cálculo, conta"]
dialogue:
  - [lucas, "バーベキュー 最高[さいこう] だった！ ブラジル の シュハスコ に 負[ま]けない ね。", "The barbecue was great! As good as a Brazilian churrasco.", "O churrasco foi demais! Não perde para o churrasco brasileiro."]
  - [kenta, "じゃあ、 精算[せいさん] しよう。 別荘[べっそう] は 僕[ぼく] が 立[た]て替[か]えた。", "Then let's settle up. I paid for the house up front.", "Então vamos acertar as contas. Eu adiantei o aluguel da casa."]
  - [protagonist, "肉[にく] と 飲[の]み物[もの] は 僕[ぼく] が 払[はら]った。 領収書[りょうしゅうしょ] は ここ。", "I paid for the meat and drinks. Here are the receipts.", "A carne e as bebidas eu paguei. Os recibos estão aqui."]
  - [misaki, "大人[おとな] は 一人[ひとり] 一万円[いちまんえん] ずつ、 子供[こども] は 半額[はんがく] で どう？", "How about 10,000 yen each for adults and half for children?", "Que tal 10 mil ienes por adulto e metade para as crianças?"]
  - [yui, "賛成[さんせい]。 計算[けいさん] は 私[わたし] が する ね。", "Agreed. I'll do the calculation.", "Concordo. Eu faço a conta."]
  - [lucas, "俺[おれ] は 一人[ひとり] だ から、 ちょっと 得[とく] した かな。", "I'm on my own, so I came out a bit ahead, maybe.", "Eu estou sozinho, então saí no lucro, acho."]
  - [yui, "…はい、 出[で]ました。 健太[けんた] さん が 一番[いちばん] 多[おお]く 立[た]て替[か]えた から、 みんな から 少[すこ]し ずつ 返[かえ]して ね。", "…Here it is. Kenta paid the most up front, so everyone pays him back a little each.", "…Pronto, saiu. O Kenta adiantou mais, então todo mundo devolve um pouco para ele."]
  - [protagonist, "来年[らいねん] も みんな で 来[こ]よう。", "Let's all come again next year.", "Ano que vem vamos vir todo mundo de novo."]
teach:
  - ask: ["Say: a holiday house.", "Diga: casa de veraneio.", "別荘[べっそう]", bessou]
  - ask: ["Say: barbecue.", "Diga: churrasco.", "バーベキュー", baabekyuu]
  - ask: ["Say: settling up.", "Diga: acerto de contas.", "精算[せいさん]", seisan]
  - ask: ["Say: pay up front for others.", "Diga: pagar adiantado por alguém.", "立[た]て替[か]える", tatekae]
  - ask: ["Say: a receipt.", "Diga: um recibo.", "領収書[りょうしゅうしょ]", ryoushuusho]
  - note: ["«〜ずつ» is each, apiece — the same amount for every unit: «一人[ひとり] 一万円[いちまんえん] ずつ», 10,000 yen each; «少[すこ]し ずつ», a little at a time, a little each.", "«〜ずつ» é cada um, por unidade — a mesma quantidade para cada um: «一人[ひとり] 一万円[いちまんえん] ずつ», 10 mil ienes cada; «少[すこ]し ずつ», um pouco de cada vez, um pouco cada um."]
  - ask: ["Say the ending: each, apiece.", "Diga a terminação: cada um.", "〜ずつ", zutsu]
  - ask: ["Say: 10,000 yen each.", "Diga: 10 mil ienes cada um.", "一人[ひとり] 一万円[いちまんえん] ずつ", hitori-ichiman-zutsu]
  - ask: ["Propose: children pay half.", "Proponha: criança paga metade.", "子供[こども] は 半額[はんがく]", kodomo-wa-hangaku]
  - ask: ["Say: the calculation.", "Diga: a conta.", "計算[けいさん]", keisan]
  - ask: ["Say: the most.", "Diga: o máximo.", "一番[いちばん] 多[おお]く", ichiban-ooku]
  - note: ["Among friends, Japanese groups settle costs carefully and openly: whoever paid «立[た]て替[か]える», receipts are shown, and the «精算[せいさん]» is done to the yen — often with a payment app. Being exact is a form of politeness, not stinginess.", "Entre amigos, os grupos japoneses acertam os custos com cuidado e às claras: quem pagou «立[た]て替[か]える», mostra os recibos, e o «精算[せいさん]» é feito até o último iene — muitas vezes com aplicativo de pagamento. Ser exato é uma forma de educação, não mesquinharia."]
  - pt_only: "O brasileiro diz «depois a gente vê» e às vezes nunca vê. No Japão o acerto é no mesmo dia — e ninguém fica constrangido por isso."
