id: C1-05
protagonist: f
title: ["Taxes", "Impostos"]
situation: ["A letter from the city: a residence-tax bill, based on last year's income. Chief Sato explains why it arrives a year late — and about the tax return.", "Uma carta da prefeitura: a cobrança do imposto de residência, com base na renda do ano passado. A chefe Sato explica por que ele chega um ano depois — e fala da declaração."]
learn: []
culture: The idea, no amounts
items:
  - [juuminzei, "住民税[じゅうみんぜい]", "residence tax", "imposto de residência", {rare: true}]
  - [kakutei-shinkoku, "確定[かくてい] 申告[しんこく]", "tax return", "declaração de imposto de renda", {rare: true}]
  - [koujo, "控除[こうじょ]", "deduction", "dedução"]
  - [noufusho, "納付書[のうふしょ]", "payment slip", "boleto de pagamento", {rare: true}]
  - [wake-niwa-ikanai, "〜わけ には いかない", "can't very well…", "não dá para…, não posso simplesmente…"]
  - [harawanai-wake-niwa, "払[はら]わない わけ には いかない", "can't very well not pay", "não dá para não pagar"]
  - [shotoku, "所得[しょとく]", "income", "renda"]
  - [zenen, "前年[ぜんねん]", "the previous year", "o ano anterior"]
  - [gensen-choushuu, "源泉[げんせん] 徴収[ちょうしゅう]", "tax withheld at source", "imposto retido na fonte", {rare: true}]
  - [furusato-nouzei, "ふるさと 納税[のうぜい]", "hometown tax donation", "doação de imposto à cidade natal", {rare: true}]
dialogue:
  - [protagonist, "市役所[しやくしょ] から 住民税[じゅうみんぜい] の 納付書[のうふしょ] が 来[き]ました。 もう 給料[きゅうりょう] から 引[ひ]かれて いる のに。", "A residence-tax payment slip came from the city. Even though tax is already taken from my salary.", "Chegou um boleto do imposto de residência da prefeitura. Mesmo já sendo descontado do salário."]
  - [sato, "給料[きゅうりょう] から 引[ひ]かれる の は 所得税[しょとくぜい] です。 住民税[じゅうみんぜい] は 前年[ぜんねん] の 所得[しょとく] で 決[き]まる から、 一年[いちねん] 遅[おく]れて 来[く]る ん です。", "What's withheld from your salary is income tax. Residence tax is based on the previous year's income, so it comes a year late.", "O que se desconta do salário é o imposto de renda. O imposto de residência é calculado pela renda do ano anterior, então chega um ano depois."]
  - [protagonist, "日本[にほん] に 来[き]た 年[とし] の 分[ぶん] です か。", "So it's for the year I arrived?", "Então é do ano em que eu cheguei?"]
  - [sato, "そう です。 払[はら]わない わけ には いきません よ。", "That's right. You can't very well not pay it.", "Isso. Não dá para não pagar."]
  - [protagonist, "もちろん 払[はら]います。 確定[かくてい] 申告[しんこく] は 必要[ひつよう] です か。", "Of course I'll pay. Do I need to file a tax return?", "Claro que pago. Preciso fazer declaração?"]
  - [sato, "会社員[かいしゃいん] は 普通[ふつう]、 会社[かいしゃ] が して くれます。 でも 医療費[いりょうひ] が 多[おお]かった 年[とし] は、 控除[こうじょ] の ため に 自分[じぶん] で 申告[しんこく] します。", "Employees usually have it done by the company. But in a year with big medical costs, you file yourself for the deduction.", "Funcionário normalmente tem a declaração feita pela empresa. Mas num ano com muito gasto médico, você mesmo declara para ter a dedução."]
  - [protagonist, "ふるさと 納税[のうぜい] も 控除[こうじょ] に なる と 聞[き]きました。", "I heard hometown tax donations count as deductions too.", "Ouvi dizer que a doação à cidade natal também vira dedução."]
  - [sato, "ええ。 家族[かぞく] の ため に も、 一度[いちど] 調[しら]べる べき です ね。", "Yes. For your family's sake too, you should look into it once.", "Sim. Pela família também, vale pesquisar uma vez."]
teach:
  - ask: ["Say: residence tax.", "Diga: imposto de residência.", "住民税[じゅうみんぜい]", juuminzei]
  - ask: ["Say: a payment slip.", "Diga: um boleto.", "納付書[のうふしょ]", noufusho]
  - ask: ["Say: income.", "Diga: renda.", "所得[しょとく]", shotoku]
  - ask: ["Say: the previous year.", "Diga: o ano anterior.", "前年[ぜんねん]", zenen]
  - ask: ["Say: tax withheld at source.", "Diga: imposto retido na fonte.", "源泉[げんせん] 徴収[ちょうしゅう]", gensen-choushuu]
  - note: ["«〜わけ には いかない» is can't very well — something your sense of duty or the situation rules out: «払[はら]わない わけ には いかない», I can't very well not pay; «休[やす]む わけ には いかない», I can't just take the day off.", "«〜わけ には いかない» é não dá para — algo que o dever ou a situação não permite: «払[はら]わない わけ には いかない», não dá para não pagar; «休[やす]む わけ には いかない», não posso simplesmente faltar."]
  - ask: ["Say the pattern: can't very well…", "Diga o padrão: não dá para…", "〜わけ には いかない", wake-niwa-ikanai]
  - ask: ["Say: I can't very well not pay.", "Diga: não dá para não pagar.", "払[はら]わない わけ には いかない", harawanai-wake-niwa]
  - ask: ["Say: the tax return.", "Diga: a declaração.", "確定[かくてい] 申告[しんこく]", kakutei-shinkoku]
  - ask: ["Say: a deduction.", "Diga: uma dedução.", "控除[こうじょ]", koujo]
  - ask: ["Say: hometown tax donation.", "Diga: doação à cidade natal.", "ふるさと 納税[のうぜい]", furusato-nouzei]
  - note: ["Income tax is withheld from pay and settled by the employer at year's end; «住民税[じゅうみんぜい]», the local tax, is calculated on the previous year's income and billed from June — so newcomers meet it in their second year, and people leaving Japan still owe it. File a «確定[かくてい] 申告[しんこく]» yourself for big medical costs or donations.", "O imposto de renda é retido do salário e acertado pela empresa no fim do ano; o «住民税[じゅうみんぜい]», o imposto municipal, é calculado sobre a renda do ano anterior e cobrado a partir de junho — por isso quem chega o encontra no segundo ano, e quem sai do Japão ainda o deve. Faça você mesmo o «確定[かくてい] 申告[しんこく]» em caso de gastos médicos altos ou doações."]
  - pt_only: "No Brasil todo mundo conhece a declaração de abril. No Japão o funcionário quase nunca declara — mas o imposto de residência atrasado pega muita gente de surpresa, principalmente na hora de voltar ao Brasil."
