id: C2-17
protagonist: f
title: ["A cultural misunderstanding", "Mal-entendido cultural"]
situation: ["At lunch you joked that Chief Sato “looked tired and old” today — teasing the Brazilian way. She went quiet. You go to repair it.", "No almoço você brincou que a chefe Sato estava «com cara de cansada e velha» hoje — provocação à brasileira. Ela ficou quieta. Você vai consertar."]
learn: []
culture: Humour across cultures
items:
  - [gokai, "誤解[ごかい]", "misunderstanding", "mal-entendido"]
  - [sonna-tsumori, "そんな つもり じゃ なかった", "I didn't mean it that way", "não foi essa a intenção"]
  - [kizutsuketa, "傷[きず]つけて しまった", "I hurt (you)", "acabei magoando"]
  - [shitsurei-na-koto, "失礼[しつれい] な こと を 言[い]いました", "I said something rude", "disse uma coisa indelicada"]
  - [joudan-no-tsumori, "冗談[じょうだん] の つもり で", "meaning it as a joke", "com a intenção de brincar"]
  - [bunka-no-chigai, "文化[ぶんか] の 違[ちが]い", "cultural difference", "diferença cultural"]
  - [ii-wake-review, "言[い]い訳[わけ] に なります が", "it may sound like an excuse, but", "pode parecer desculpa, mas"]
  - [ki-ni-shite-inai, "気[き] に して いない", "I don't mind", "não me importo"]
  - [shoujiki-ni-iu, "正直[しょうじき] に 言[い]って くれて", "thank you for being honest", "obrigada por ser sincera"]
  - [nakanaori-review, "関係[かんけい] を 修復[しゅうふく] する", "repair a relationship", "reparar uma relação", {rare: true}]
dialogue:
  - [protagonist, "課長[かちょう]、 お昼[ひる] は 失礼[しつれい] な こと を 言[い]いました。 申[もう]し訳[わけ] ありません。", "Chief, I said something rude at lunch. I'm very sorry.", "Chefe, eu disse uma coisa indelicada no almoço. Peço desculpas."]
  - [sato, "…ああ、「疲[つか]れて 老[ふ]けて 見[み]える」 です か。", "…Ah, “you look tired and old”?", "…Ah, o «está com cara de cansada e velha»?"]
  - [protagonist, "冗談[じょうだん] の つもり で した。 そんな つもり じゃ なかった ん です が、 傷[きず]つけて しまいました。", "I meant it as a joke. I didn't mean it that way, but I hurt you.", "Era para ser brincadeira. Não foi essa a intenção, mas acabei magoando a senhora."]
  - [protagonist, "言[い]い訳[わけ] に なります が、 ブラジル で は 親[した]しい 人[ひと] を からかう の は 愛情[あいじょう] な ん です。", "It may sound like an excuse, but in Brazil teasing people you're close to is a sign of affection.", "Pode parecer desculpa, mas no Brasil provocar quem é próximo é sinal de carinho."]
  - [sato, "なるほど、 文化[ぶんか] の 違[ちが]い です ね。 日本[にほん] で は 見[み]た目[め] の 冗談[じょうだん] は、 特[とく] に 女性[じょせい] に は 敏感[びんかん] な ん です。", "I see, a cultural difference. In Japan jokes about appearance are sensitive, especially for women.", "Entendo, diferença cultural. No Japão piada sobre aparência é delicada, principalmente com mulheres."]
  - [protagonist, "教[おし]えて くださって、 ありがとう ございます。 二度[にど] と 言[い]いません。", "Thank you for telling me. I won't say it again.", "Obrigada por me explicar. Nunca mais digo isso."]
  - [sato, "もう 気[き] に して いない わ。 正直[しょうじき] に 言[い]って くれて、 嬉[うれ]しかった。", "I don't mind any more. I was glad you came and told me honestly.", "Já não me importo. Fiquei feliz de você vir falar com sinceridade."]
  - [protagonist, "誤解[ごかい] が 解[と]けて、 よかった です。", "I'm glad the misunderstanding is cleared up.", "Que bom que o mal-entendido se desfez."]
teach:
  - ask: ["Say: a misunderstanding.", "Diga: um mal-entendido.", "誤解[ごかい]", gokai]
  - ask: ["Admit it: I said something rude.", "Admita: disse uma coisa indelicada.", "失礼[しつれい] な こと を 言[い]いました。", shitsurei-na-koto]
  - ask: ["Say: I meant it as a joke.", "Diga: era para ser brincadeira.", "冗談[じょうだん] の つもり で", joudan-no-tsumori]
  - ask: ["Say: I didn't mean it that way.", "Diga: não foi essa a intenção.", "そんな つもり じゃ なかった", sonna-tsumori]
  - ask: ["Say: I ended up hurting you.", "Diga: acabei magoando.", "傷[きず]つけて しまった", kizutsuketa]
  - ask: ["Explain carefully: it may sound like an excuse, but…", "Explique com cuidado: pode parecer desculpa, mas…", "言[い]い訳[わけ] に なります が", ii-wake-review]
  - ask: ["Say: a cultural difference.", "Diga: diferença cultural.", "文化[ぶんか] の 違[ちが]い", bunka-no-chigai]
  - ask: ["Say: I don't mind.", "Diga: não me importo.", "気[き] に して いない", ki-ni-shite-inai]
  - ask: ["Thank her: for being honest.", "Agradeça: por ser sincera.", "正直[しょうじき] に 言[い]って くれて", shoujiki-ni-iu]
  - ask: ["Say: repair a relationship.", "Diga: reparar uma relação.", "関係[かんけい] を 修復[しゅうふく] する", nakanaori-review]
  - note: ["Repairing a social mistake: name it («失礼[しつれい] な こと を 言[い]いました»), apologise, admit the effect («傷[きず]つけて しまいました») before explaining, flag the explanation as possibly an excuse («言[い]い訳[わけ] に なります が»), then promise. Explaining first sounds like defending yourself.", "Para reparar um erro social: nomeie («失礼[しつれい] な こと を 言[い]いました»), peça desculpas, admita o efeito («傷[きず]つけて しまいました») antes de explicar, avise que a explicação pode soar como desculpa («言[い]い訳[わけ] に なります が») e então prometa. Explicar primeiro soa como se defender."]
  - pt_only: "O «você está velho, hein» brasileiro é carinho entre amigos. No Japão, aparência — idade, peso, rugas — é terreno minado. Na dúvida, elogie, não provoque."
