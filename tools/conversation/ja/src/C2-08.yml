dialogue:
  - [kouza-sensei, "夏目[なつめ] 漱石[そうせき] の『こころ』、 結末[けつまつ] は どう でした か。", "How did you find the ending of Natsume Sōseki's “Kokoro”?", "O que acharam do desfecho de «Kokoro», de Natsume Sōseki?"]
  - [protagonist, "最後[さいご] は 先生[せんせい] の 手紙[てがみ] で 終[お]わります が、 その 後[あと] が 書[か]かれて いない の が 印象[いんしょう] に 残[のこ]りました。", "It ends with Sensei's letter, but what stayed with me is that what happens next isn't written.", "Termina com a carta do Sensei, mas o que ficou na memória foi que o que vem depois não está escrito."]
  - [kouza-sensei, "それ が 余韻[よいん] です。 日本[にほん] の 小説[しょうせつ] は、 書[か]かれて いない こと で 語[かた]る こと が 多[おお]い。", "That's yoin, the lingering feeling. Japanese novels often speak through what isn't written.", "Isso é yoin, o que fica ressoando. O romance japonês muitas vezes fala pelo que não está escrito."]
  - [protagonist, "登場[とうじょう] 人物[じんぶつ] は みんな、 孤独[こどく] な 心[こころ] を 持[も]って いる よう に 感[かん]じました。", "I felt all the characters had lonely hearts.", "Senti que todos os personagens tinham um coração solitário."]
  - [kouza-sensei, "いい 解釈[かいしゃく] です ね。 主人公[しゅじんこう] の「私[わたし]」 に ついて は？", "A good interpretation. And the narrator, “I”?", "Boa interpretação. E o narrador, o «eu»?"]
  - [protagonist, "外国[がいこく] から 来[き]た 私[わたし] も、 先生[せんせい] の 沈黙[ちんもく] を 理解[りかい] しよう と する「私[わたし]」 に 似[に]て いる と 思[おも]いました。", "I thought I, coming from abroad, am like that “I” trying to understand Sensei's silence.", "Achei que eu, vindo de fora, pareço com aquele «eu» tentando entender o silêncio do Sensei."]
  - [kouza-sensei, "文学[ぶんがく] は、 読[よ]む 人[ひと] の 人生[じんせい] に よって 変[か]わる もの です。", "Literature changes according to the life of the person reading it.", "A literatura muda conforme a vida de quem lê."]
  - [protagonist, "次[つぎ] は 原文[げんぶん] で もう 一度[いちど] 読[よ]んで みます。", "Next I'll try reading it again in the original.", "Da próxima vez vou ler de novo no original."]
