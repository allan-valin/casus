  - ask: ["Say: the characters.", "Diga: os personagens.", "登場[とうじょう] 人物[じんぶつ]", toujou-jinbutsu]
  - ask: ["Say: the protagonist.", "Diga: o protagonista.", "主人公[しゅじんこう]", shujinkou]
  - ask: ["Say: the ending.", "Diga: o desfecho.", "結末[けつまつ]", ketsumatsu]
  - ask: ["Say: the lingering feeling.", "Diga: o que fica ressoando.", "余韻[よいん]", yoin]
  - ask: ["Say: what isn't written.", "Diga: o que não está escrito.", "書[か]かれて いない こと", kakarete-inai]
  - ask: ["Say: an interpretation.", "Diga: uma interpretação.", "解釈[かいしゃく]", kaishaku]
  - ask: ["Say: a lonely heart.", "Diga: um coração solitário.", "孤独[こどく] な 心[こころ]", kodoku-review]
  - ask: ["Say: it stayed in my mind.", "Diga: ficou na memória.", "印象[いんしょう] に 残[のこ]った", inshou-ni-nokoru]
  - note: ["Literary talk has its own words: «登場[とうじょう] 人物[じんぶつ]», «主人公[しゅじんこう]», «結末[けつまつ]», «解釈[かいしゃく]». «余韻[よいん]» — the resonance after a bell stops — is a central value: what a story leaves unsaid can matter more than what it says.", "A conversa literária tem palavras próprias: «登場[とうじょう] 人物[じんぶつ]», «主人公[しゅじんこう]», «結末[けつまつ]», «解釈[かいしゃく]». O «余韻[よいん]» — a ressonância depois que o sino para — é um valor central: o que a história deixa sem dizer pode importar mais do que o que diz."]
  - pt_only: "«Kokoro» é de 1914 e está em domínio público — dá para ler de graça, em japonês, no Aozora Bunko. É o Machado de Assis deles: silêncio, culpa e um narrador que não conta tudo."
