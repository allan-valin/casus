id: B2-26
protagonist: m
title: ["The taiko club", "O clube de taikô"]
situation: ["Kenta talks you into joining the neighbourhood taiko group, which drums at the summer festival. First practice with Ōno-sensei.", "O Kenta te convence a entrar no grupo de taikô do bairro, que toca no festival de verão. Primeiro treino com a professora Ōno."]
learn: [n3-021, n3-022]
culture: —
items:
  - [taiko, "太鼓[たいこ]", "taiko drum", "taikô, tambor japonês"]
  - [renshuu, "練習[れんしゅう]", "practice", "treino"]
  - [rizumu, "リズム", "rhythm", "ritmo"]
  - [tame-ni, "〜ために", "in order to; for", "para, a fim de"]
  - [jouzu-ni-naru-tame-ni, "上手[じょうず] に なる ために", "in order to get good", "para ficar bom"]
  - [bachi, "ばち", "drumsticks (taiko)", "baquetas (do taikô)", {rare: true}]
  - [kakegoe, "掛[か]け声[ごえ]", "shout (in rhythm)", "grito (no ritmo)", {rare: true}]
  - [shisei, "姿勢[しせい]", "posture", "postura"]
  - [kokyuu, "呼吸[こきゅう]", "breathing", "respiração"]
  - [awaseru, "合[あ]わせる", "match, play together", "acompanhar, tocar junto"]
  - [onegai-shimasu-start, "よろしく お願[ねが]い します！", "(said loudly at the start of practice)", "(dito alto no começo do treino)"]
dialogue:
  - [taiko-sensei, "よろしく お願[ねが]い します！ では、 練習[れんしゅう] を 始[はじ]めます。", "Yoroshiku onegai shimasu! Let's begin practice.", "Yoroshiku onegai shimasu! Vamos começar o treino."]
  - [protagonist, "よろしく お願[ねが]い します！ ばち は こう 持[も]ちます か。", "Yoroshiku onegai shimasu! Do I hold the sticks like this?", "Yoroshiku onegai shimasu! Seguro as baquetas assim?"]
  - [taiko-sensei, "まず 姿勢[しせい]。 足[あし] を 広[ひろ]げて、 腰[こし] を 落[お]として。 いい 音[おと] を 出[だ]す ため に は、 体[からだ] 全体[ぜんたい] で 打[う]ちます。", "First, posture. Feet apart, hips low. To make a good sound, you hit with your whole body.", "Primeiro, a postura. Pés afastados, quadril baixo. Para tirar um bom som, você bate com o corpo todo."]
  - [kenta, "掛[か]け声[ごえ] も 大事[だいじ] だ よ。 「ソーレ！」 って。", "The shouts matter too. “Sōre!”", "O grito também é importante. «Sōre!»"]
  - [protagonist, "ソーレ！ …リズム が 難[むずか]しい。 サンバ と 違[ちが]う。", "Sōre! …The rhythm's hard. It's not like samba.", "Sōre! …O ritmo é difícil. É diferente do samba."]
  - [taiko-sensei, "呼吸[こきゅう] を みんな と 合[あ]わせて。 上手[じょうず] に なる ため に、 毎週[まいしゅう] 来[き]て ください。", "Match your breathing with everyone. To get good, come every week.", "Acompanhe a respiração de todos. Para ficar bom, venha toda semana."]
  - [protagonist, "はい。 夏祭[なつまつ]り で 叩[たた]く ため に、 頑張[がんば]ります。", "Yes. I'll work hard so I can drum at the summer festival.", "Sim. Vou me esforçar para tocar no festival de verão."]
  - [taiko-sensei, "ありがとう ございました！ 今日[きょう] は ここ まで。", "Thank you! That's it for today.", "Obrigada! Por hoje é só."]
teach:
  - ask: ["Say: the taiko drum.", "Diga: o taikô.", "太鼓[たいこ]", taiko]
  - ask: ["Say: practice.", "Diga: treino.", "練習[れんしゅう]", renshuu]
  - ask: ["Start practice the Japanese way.", "Comece o treino do jeito japonês.", "よろしく お願[ねが]い します！", onegai-shimasu-start]
  - ask: ["Say: the drumsticks.", "Diga: as baquetas.", "ばち", bachi]
  - ask: ["Say: posture.", "Diga: postura.", "姿勢[しせい]", shisei]
  - ask: ["Say: rhythm.", "Diga: ritmo.", "リズム", rizumu]
  - ask: ["Say: the rhythmic shout.", "Diga: o grito no ritmo.", "掛[か]け声[ごえ]", kakegoe]
  - ask: ["Say: breathing.", "Diga: respiração.", "呼吸[こきゅう]", kokyuu]
  - ask: ["Say: match, play together.", "Diga: acompanhar.", "合[あ]わせる", awaseru]
  - note: ["«〜ために» is in order to — a goal you work towards with your own will: «上手[じょうず] に なる ために», in order to get good; «いい 音[おと] を 出[だ]す ため に», to make a good sound. Compare «〜ように», for goals you can't fully control.", "«〜ために» é para, a fim de — um objetivo que você busca por vontade própria: «上手[じょうず] に なる ために», para ficar bom; «いい 音[おと] を 出[だ]す ため に», para tirar um bom som. Compare com «〜ように», para objetivos que você não controla totalmente."]
  - ask: ["Say the pattern: in order to.", "Diga o padrão: para, a fim de.", "〜ために", tame-ni]
  - ask: ["Say: in order to get good.", "Diga: para ficar bom.", "上手[じょうず] に なる ために", jouzu-ni-naru-tame-ni]
  - note: ["Group taiko, «組[くみ]太鼓[だいこ]», is a full-body art: low stance, drumming with the hips, shouts like «ソーレ！» and «ハッ！». Practices start and end with a loud greeting and a bow; neighbourhood groups play at festivals and welcome newcomers.", "O taikô em grupo, «組[くみ]太鼓[だいこ]», é uma arte do corpo inteiro: postura baixa, toque com o quadril, gritos como «ソーレ！» e «ハッ！». Os treinos começam e terminam com um cumprimento alto e uma reverência; os grupos de bairro tocam nos festivais e recebem bem quem chega."]
  - pt_only: "Quem já tocou numa bateria de escola de samba vai reconhecer: pulso coletivo, respiração junta, o mestre comandando. Só o balanço é outro."
