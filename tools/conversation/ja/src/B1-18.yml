id: B1-18
protagonist: f
title: [Art, Arte]
situation: ["Shota takes you to a small museum in Yui, an old post town in Shizuoka: woodblock prints of the Tōkaidō road by Hiroshige — one of them Hamamatsu.", "O Shota leva você a um museu pequeno em Yui, uma antiga cidade de posta em Shizuoka: xilogravuras da estrada Tōkaidō de Hiroshige — uma delas é Hamamatsu."]
learn: [n4-011]
culture: —
items:
  - [ukiyoe, "浮世絵[うきよえ]", "ukiyo-e (woodblock prints)", "ukiyo-e (xilogravuras)", {rare: true}]
  - [bijutsukan, "美術館[びじゅつかん]", "art museum", "museu de arte"]
  - [dentou, "伝統[でんとう]", "tradition", "tradição"]
  - [sakuhin, "作品[さくひん]", "work (of art)", "obra"]
  - [te-miru, "〜て みる", "try doing", "experimentar fazer"]
  - [itte-miru, "行[い]って みる", "go and see (try)", "ir ver, experimentar ir"]
  - [yatte-mitai, "やって みたい", "I'd like to try it", "quero experimentar"]
  - [hanga, "版画[はんが]", "print, woodblock print", "gravura"]
  - [edo-jidai, "江戸[えど] 時代[じだい]", "the Edo period", "o período Edo"]
  - [keshiki, "景色[けしき]", "scenery", "paisagem"]
  - [mukashi-no-hamamatsu, "昔[むかし] の 浜松[はままつ]", "old Hamamatsu", "a Hamamatsu de antigamente"]
dialogue:
  - [shota, "ここ は 広重[ひろしげ] の 美術館[びじゅつかん]。 東海道[とうかいどう] の 浮世絵[うきよえ] が ある よ。", "This is the Hiroshige museum. It has ukiyo-e of the Tōkaidō road.", "Este é o museu do Hiroshige. Tem ukiyo-e da estrada Tōkaidō."]
  - [protagonist, "浮世絵[うきよえ] って、 江戸[えど] 時代[じだい] の 版画[はんが] だ よね。", "Ukiyo-e are Edo-period prints, right?", "Ukiyo-e são gravuras do período Edo, né?"]
  - [shota, "そう。 見[み]て、 この 作品[さくひん] は 昔[むかし] の 浜松[はままつ]。", "Yes. Look, this work is old Hamamatsu.", "Isso. Olha, esta obra é a Hamamatsu de antigamente."]
  - [protagonist, "すごい！ 景色[けしき] が 全然[ぜんぜん] 違[ちが]う。", "Amazing! The scenery is totally different.", "Que incrível! A paisagem é totalmente diferente."]
  - [shota, "版画[はんが] を 作[つく]る 体験[たいけん] も できる よ。 やって みる？", "You can try making a print too. Want to try?", "Também dá para experimentar fazer uma gravura. Quer tentar?"]
  - [protagonist, "うん、 やって みたい！", "Yes, I'd like to try!", "Quero, sim!"]
  - [shota, "伝統[でんとう] の 技術[ぎじゅつ] だ から、 難[むずか]しい けど ね。", "It's a traditional technique, so it's hard, though.", "É uma técnica tradicional, então é difícil."]
  - [protagonist, "今度[こんど]、 東京[とうきょう] の 大[おお]きい 美術館[びじゅつかん] に も 行[い]って みよう。", "Next time let's try the big museum in Tokyo too.", "Da próxima vez vamos ver o museu grande de Tóquio também."]
teach:
  - ask: ["Say: an art museum.", "Diga: um museu de arte.", "美術館[びじゅつかん]", bijutsukan]
  - ask: ["Say: ukiyo-e.", "Diga: ukiyo-e.", "浮世絵[うきよえ]", ukiyoe]
  - ask: ["Say: a print.", "Diga: uma gravura.", "版画[はんが]", hanga]
  - ask: ["Say: the Edo period.", "Diga: o período Edo.", "江戸[えど] 時代[じだい]", edo-jidai]
  - ask: ["Say: a work of art.", "Diga: uma obra.", "作品[さくひん]", sakuhin]
  - ask: ["Say: scenery.", "Diga: paisagem.", "景色[けしき]", keshiki]
  - ask: ["Say: old Hamamatsu.", "Diga: a Hamamatsu de antigamente.", "昔[むかし] の 浜松[はままつ]", mukashi-no-hamamatsu]
  - note: ["«〜て みる» is try and see: the «て» form plus «みる». «やって みる？» — want to try? «やって みたい» — I'd like to try. «行[い]って みよう» — let's go and see.", "«〜て みる» é experimentar: forma «て» mais «みる». «やって みる？» — quer tentar? «やって みたい» — quero experimentar. «行[い]って みよう» — vamos lá ver."]
  - ask: ["Say the pattern: try doing.", "Diga o padrão: experimentar fazer.", "〜て みる", te-miru]
  - ask: ["Say: I'd like to try it.", "Diga: quero experimentar.", "やって みたい。", yatte-mitai]
  - ask: ["Say: go and see.", "Diga: ir ver.", "行[い]って みる", itte-miru]
  - ask: ["Say: tradition.", "Diga: tradição.", "伝統[でんとう]", dentou]
  - note: ["Hiroshige's «東海道[とうかいどう] 五十三次[ごじゅうさんつぎ]», the 53 stations of the Tōkaidō, show the old road from Edo to Kyoto — Hamamatsu and Yui among them. Ukiyo-e inspired Van Gogh and Monet.", "As «東海道[とうかいどう] 五十三次[ごじゅうさんつぎ]» de Hiroshige, as 53 estações do Tōkaidō, mostram a antiga estrada de Edo a Kyoto — Hamamatsu e Yui entre elas. O ukiyo-e inspirou Van Gogh e Monet."]
  - pt_only: "As xilogravuras do cordel nordestino têm parentesco de técnica com o ukiyo-e: madeira entalhada, tinta e papel. Vale comparar as duas tradições."
