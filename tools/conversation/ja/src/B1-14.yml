id: B1-14
protagonist: m
title: [A lovers' quarrel, Briga de casal]
situation: ["You forgot your date with Yui and went to futsal. Her messages are short. You call her.", "Você esqueceu o encontro com a Yui e foi jogar futsal. As mensagens dela estão curtas. Você liga."]
learn: [n4-006, n4-007]
culture: —
items:
  - [kenka, "喧嘩[けんか]", "quarrel, fight", "briga"]
  - [okotteru, "怒[おこ]って る", "is angry", "está brava"]
  - [okoranaide, "怒[おこ]らないで", "don't be angry", "não fica brava"]
  - [wasureta, "忘[わす]れた", "forgot", "esqueci"]
  - [yakusoku, "約束[やくそく]", "promise; appointment", "promessa; compromisso"]
  - [matte-ita-noni, "待[ま]って いた のに", "even though I was waiting", "e eu esperando"]
  - [hidoi, "ひどい", "that's awful, cruel", "que horrível, que maldade"]
  - [hontou-ni-gomen, "本当[ほんとう] に ごめん", "I'm really sorry", "desculpa mesmo"]
  - [daiji-ni-shite, "大事[だいじ] に して", "treat (me) as important", "me dá valor"]
  - [nakanaori, "仲直[なかなお]り", "making up", "fazer as pazes"]
dialogue:
  - [protagonist, "由衣[ゆい]、 怒[おこ]って る？", "Yui, are you angry?", "Yui, você está brava?"]
  - [yui, "…約束[やくそく]、 忘[わす]れた でしょ。 一時間[いちじかん] 待[ま]って いた のに。", "…You forgot our date, didn't you. And I waited an hour.", "…Você esqueceu o nosso compromisso, né? E eu esperando uma hora."]
  - [protagonist, "本当[ほんとう] に ごめん。 フットサル に 行[い]って しまった。", "I'm really sorry. I went to futsal.", "Desculpa mesmo. Acabei indo para o futsal."]
  - [yui, "ひどい。 連絡[れんらく] も なかった。", "That's awful. You didn't even message.", "Que horrível. Nem avisou."]
  - [protagonist, "携帯[けいたい] を 見[み]なかった。 言[い]い訳[わけ] だ けど…", "I didn't look at my phone. It's an excuse, but…", "Não olhei o celular. É desculpa, mas…"]
  - [yui, "私[わたし] の こと、 もっと 大事[だいじ] に して。 寂[さび]しかった。", "Treat me as more important. I felt lonely.", "Me dá mais valor. Eu me senti sozinha."]
  - [protagonist, "わかった。 明日[あした]、 会[あ]えない？ 仲直[なかなお]り したい。", "Okay. Can we meet tomorrow? I want to make up.", "Entendi. A gente se vê amanhã? Quero fazer as pazes."]
  - [yui, "…いい よ。 でも 今度[こんど] は 遅[おく]れない で ね。", "…Okay. But this time don't be late.", "…Tá bom. Mas dessa vez não se atrasa, hein."]
teach:
  - ask: ["Say: a quarrel.", "Diga: uma briga.", "喧嘩[けんか]", kenka]
  - ask: ["Ask: are you angry?", "Pergunte: você está brava?", "怒[おこ]って る？", okotteru]
  - ask: ["Plead: don't be angry.", "Peça: não fica brava.", "怒[おこ]らないで。", okoranaide]
  - ask: ["Say: a promise, a date you agreed.", "Diga: um compromisso.", "約束[やくそく]", yakusoku]
  - ask: ["Admit it: I forgot.", "Admita: esqueci.", "忘[わす]れた。", wasureta]
  - note: ["You met «のに», even though. In a quarrel it carries the hurt: «待[ま]って いた のに» — and I was waiting (and you didn't come). The ending is often left unsaid; the tone says the rest.", "Você conhece «のに», mesmo que. Numa briga ela carrega a mágoa: «待[ま]って いた のに» — e eu esperando (e você não veio). O resto muitas vezes nem se diz; o tom diz."]
  - ask: ["Say what she said: and I was waiting.", "Repita o que ela disse: e eu esperando.", "待[ま]って いた のに。", matte-ita-noni]
  - ask: ["Say: that's awful.", "Diga: que horrível.", "ひどい。", hidoi]
  - ask: ["Say: I'm really sorry.", "Diga: desculpa mesmo.", "本当[ほんとう] に ごめん。", hontou-ni-gomen]
  - ask: ["Say what she asked: treat me as important.", "Repita o pedido dela: me dá valor.", "大事[だいじ] に して。", daiji-ni-shite]
  - ask: ["Say: making up.", "Diga: fazer as pazes.", "仲直[なかなお]り", nakanaori]
  - ask: ["Say: I want to make up.", "Diga: quero fazer as pazes.", "仲直[なかなお]り したい。", nakanaori]
  - note: ["Couples quarrel quietly in Japanese: short messages, «別[べつ] に», «大丈夫[だいじょうぶ]» that doesn't mean okay. Apologise plainly — «本当[ほんとう] に ごめん» — don't over-explain, and offer a way to make up.", "Os casais japoneses brigam baixinho: mensagens curtas, «別[べつ] に», um «大丈夫[だいじょうぶ]» que não quer dizer tudo bem. Peça desculpas sem rodeio — «本当[ほんとう] に ごめん» —, não explique demais, e proponha fazer as pazes."]
  - pt_only: "Briga de casal brasileiro costuma ser em voz alta e resolvida na hora. Com japoneses, o sinal é o silêncio e a mensagem seca — leia isso como alarme."
