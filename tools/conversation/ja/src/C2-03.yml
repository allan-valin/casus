id: C2-03
protagonist: f
title: ["TV interview", "Entrevista na TV"]
situation: ["Local TV is filming the taiko group for the evening news. The reporter wants a word from the Brazilian member — live.", "A TV local está filmando o grupo de taikô para o jornal da noite. A repórter quer uma palavra da integrante brasileira — ao vivo."]
learn: []
culture: —
items:
  - [shuzai, "取材[しゅざい]", "news coverage, reporting", "cobertura jornalística"]
  - [intabyuu, "インタビュー", "interview", "entrevista"]
  - [shichousha, "視聴者[しちょうしゃ]", "viewers", "telespectadores", {rare: true}]
  - [kansou-thoughts, "感想[かんそう]", "impressions, thoughts", "impressões"]
  - [tsuzukete-ikitai, "これ から も 続[つづ]けて いきたい", "I want to keep going", "quero continuar"]
  - [miryoku, "魅力[みりょく]", "appeal, charm", "encanto, atrativo"]
  - [hakuryoku, "迫力[はくりょく]", "power, impact", "impacto, força"]
  - [chiiki, "地域[ちいき]", "local community, region", "comunidade local"]
  - [tsunagari, "つながり", "connection", "ligação, conexão"]
  - [kinchou-shimashita, "緊張[きんちょう] して います が", "I'm nervous, but", "estou nervosa, mas"]
dialogue:
  - [reporter, "視聴者[しちょうしゃ] の 皆[みな]さん、 こんばんは。 今日[きょう] は 浜松[はままつ] の 太鼓[たいこ] グループ を 取材[しゅざい] して います。", "Good evening, viewers. Today we're reporting on a taiko group in Hamamatsu.", "Boa noite, telespectadores. Hoje estamos com um grupo de taikô de Hamamatsu."]
  - [reporter, "ブラジル 出身[しゅっしん] の メンバー に インタビュー します。 太鼓[たいこ] の 魅力[みりょく] は 何[なん] です か。", "We'll interview a member from Brazil. What's the appeal of taiko?", "Vamos entrevistar uma integrante brasileira. Qual é o encanto do taikô?"]
  - [protagonist, "緊張[きんちょう] して います が… 体[からだ] 全体[ぜんたい] に 響[ひび]く 迫力[はくりょく] です。 みんな の 心[こころ] が 一[ひと]つ に なる ところ も 好[す]き です。", "I'm nervous, but… the power that resonates through your whole body. And I love how everyone's hearts become one.", "Estou nervosa, mas… a força que vibra no corpo todo. E adoro como o coração de todos vira um só."]
  - [reporter, "日本[にほん] に 来[き]て、 地域[ちいき] と の つながり は 変[か]わりました か。", "Since coming to Japan, has your connection with the community changed?", "Desde que veio ao Japão, a sua ligação com a comunidade mudou?"]
  - [protagonist, "はい。 太鼓[たいこ] の おかげ で、 近所[きんじょ] の 方々[かたがた] と 家族[かぞく] の よう に なりました。", "Yes. Thanks to taiko, the neighbours have become like family.", "Sim. Graças ao taikô, os vizinhos viraram quase uma família."]
  - [reporter, "最後[さいご] に、 感想[かんそう] を 一言[ひとこと] お願[ねが]い します。", "Finally, a word on your thoughts, please.", "Por fim, uma palavra sobre suas impressões, por favor."]
  - [protagonist, "ブラジル の リズム と 日本[にほん] の 太鼓[たいこ]、 両方[りょうほう] を 大切[たいせつ] に、 これ から も 続[つづ]けて いきたい です。", "Treasuring both Brazilian rhythm and Japanese taiko, I want to keep going.", "Valorizando o ritmo brasileiro e o taikô japonês, quero continuar."]
  - [reporter, "ありがとう ございました。 以上[いじょう]、 浜松[はままつ] から お伝[つた]え しました。", "Thank you. That was our report from Hamamatsu.", "Muito obrigada. Esta foi a nossa reportagem direto de Hamamatsu."]
teach:
  - ask: ["Say: news coverage.", "Diga: cobertura jornalística.", "取材[しゅざい]", shuzai]
  - ask: ["Say: an interview.", "Diga: uma entrevista.", "インタビュー", intabyuu]
  - ask: ["Say: viewers.", "Diga: telespectadores.", "視聴者[しちょうしゃ]", shichousha]
  - ask: ["Say: appeal, charm.", "Diga: encanto.", "魅力[みりょく]", miryoku]
  - ask: ["Say: power, impact.", "Diga: impacto.", "迫力[はくりょく]", hakuryoku]
  - ask: ["Say: the local community.", "Diga: a comunidade local.", "地域[ちいき]", chiiki]
  - ask: ["Say: connection.", "Diga: ligação.", "つながり", tsunagari]
  - ask: ["Say: impressions, thoughts.", "Diga: impressões.", "感想[かんそう]", kansou-thoughts]
  - ask: ["Start your answer: I'm nervous, but…", "Comece a resposta: estou nervosa, mas…", "緊張[きんちょう] して います が", kinchou-shimashita]
  - ask: ["Close on camera: I want to keep going.", "Feche na câmera: quero continuar.", "これ から も 続[つづ]けて いきたい です。", tsuzukete-ikitai]
  - note: ["Broadcast Japanese has its own register: the reporter opens with «視聴者[しちょうしゃ] の 皆[みな]さん», closes with «以上[いじょう]、 〜 から お伝[つた]え しました». Interviewees answer in short, positive, polite sentences — «〜て いきたい です», I want to keep doing — that can be cut into a clip.", "O japonês da TV tem registro próprio: a repórter abre com «視聴者[しちょうしゃ] の 皆[みな]さん», fecha com «以上[いじょう]、 〜 から お伝[つた]え しました». Os entrevistados respondem com frases curtas, positivas e educadas — «〜て いきたい です», quero continuar fazendo — que dão para cortar num trecho."]
  - pt_only: "Na TV brasileira o entrevistado manda um beijo para a mãe. Na japonesa, uma frase redonda com «これ から も 頑張[がんば]ります» — e uma reverência para a câmera."
