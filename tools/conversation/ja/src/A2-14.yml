id: A2-14
protagonist: m
title: ["Japan = anime?", "Japão = anime?"]
situation: ["Lunch in the canteen. New colleagues ask about Brazil — and you ask what they think of Japan's image abroad.", "Almoço no refeitório. Colegas novos perguntam do Brasil — e você pergunta o que eles acham da imagem do Japão lá fora."]
learn: []
culture: Stereotypes both ways
items:
  - [to-omoimasu, "〜と 思[おも]います", "I think that…", "acho que…"]
  - [dou-omoimasu-ka, "どう 思[おも]います か", "what do you think?", "o que você acha?"]
  - [sanba, "サンバ", "samba", "samba"]
  - [sutereotaipu, "ステレオタイプ", "stereotype", "estereótipo", {rare: true}]
  - [imeeji, "イメージ", "image (of a place)", "imagem (de um lugar)"]
  - [chigau-to-omou, "違[ちが]う と 思[おも]う", "I don't think so (I think it's different)", "acho que não (acho que é diferente)"]
  - [amari, "あまり 〜ません", "not much, not really", "não muito"]
  - [zenzen, "全然[ぜんぜん] 〜ません", "not at all", "nada, de jeito nenhum"]
  - [tokidoki, "時々[ときどき]", "sometimes", "às vezes"]
  - [kikimasu, "聞[き]きます", "hear; ask", "ouço; pergunto"]
dialogue:
  - [kenta, "ブラジル の 人[ひと] は みんな サンバ が 上手[じょうず] だ と 思[おも]って いた。", "I thought all Brazilians were good at samba.", "Eu achava que todo brasileiro sambava bem."]
  - [protagonist, "違[ちが]う と 思[おも]います。 僕[ぼく] は 全然[ぜんぜん] 踊[おど]れません。", "I don't think so. I can't dance at all.", "Acho que não. Eu não sei dançar nada."]
  - [sato, "日本[にほん] の イメージ は どう です か。 ブラジル で。", "What's Japan's image like in Brazil?", "Qual é a imagem do Japão no Brasil?"]
  - [protagonist, "アニメ と 寿司[すし] と 忍者[にんじゃ] だ と 思[おも]います。", "I think anime, sushi and ninjas.", "Acho que anime, sushi e ninja."]
  - [sato, "私[わたし] は アニメ を あまり 見[み]ません よ。", "I don't really watch anime.", "Eu quase não vejo anime."]
  - [kenta, "僕[ぼく] は 時々[ときどき] 見[み]る けど。 ステレオタイプ は おもしろい ね。", "I do sometimes. Stereotypes are funny.", "Eu vejo às vezes. Estereótipo é engraçado, né?"]
  - [protagonist, "日本[にほん] の 人[ひと] は みんな 時間[じかん] に 厳[きび]しい と 聞[き]きました。", "I heard all Japanese are strict about time.", "Ouvi dizer que todo japonês é rigoroso com horário."]
  - [sato, "それ は… 本当[ほんとう] だ と 思[おも]います。", "That one… I think is true.", "Isso aí… acho que é verdade."]
teach:
  - note: ["To give an opinion, end a plain sentence with «と 思[おも]います» — I think that: «本当[ほんとう] だ と 思[おも]います», I think it's true. Nouns and «な» words take «だ» before «と». To ask: «どう 思[おも]います か».", "Para dar opinião, termine uma frase simples com «と 思[おも]います» — acho que: «本当[ほんとう] だ と 思[おも]います», acho que é verdade. Substantivos e palavras com «な» levam «だ» antes do «と». Para perguntar: «どう 思[おも]います か»."]
  - ask: ["Say the pattern: I think that…", "Diga o padrão: acho que…", "〜と 思[おも]います", to-omoimasu]
  - ask: ["Ask: what do you think?", "Pergunte: o que você acha?", "どう 思[おも]います か。", dou-omoimasu-ka]
  - ask: ["Say: I think it's true.", "Diga: acho que é verdade.", "本当[ほんとう] だ と 思[おも]います。", to-omoimasu]
  - ask: ["Disagree, plainly: I don't think so.", "Discorde, informal: acho que não.", "違[ちが]う と 思[おも]う。", chigau-to-omou]
  - ask: ["Say: samba.", "Diga: samba.", "サンバ", sanba]
  - ask: ["Say: stereotype.", "Diga: estereótipo.", "ステレオタイプ", sutereotaipu]
  - ask: ["Say: image — of a country.", "Diga: imagem — de um país.", "イメージ", imeeji]
  - ask: ["Say: everyone.", "Diga: todo mundo.", "みんな", minna]
  - ask: ["Say: I don't watch much anime.", "Diga: quase não vejo anime.", "アニメ を あまり 見[み]ません。", amari]
  - ask: ["Say: I can't dance at all.", "Diga: não sei dançar nada.", "全然[ぜんぜん] 踊[おど]れません。", zenzen]
  - ask: ["Say: sometimes.", "Diga: às vezes.", "時々[ときどき]", tokidoki]
  - ask: ["Say: I heard that.", "Diga: ouvi dizer.", "聞[き]きました。", kikimasu]
  - note: ["«と 思[おも]います» also softens: Japanese rarely states an opinion bare. Even a strong one comes as «〜と 思[おも]います», and a disagreement as «違[ちが]う と 思[おも]います» — I think it's different — rather than «no».", "«と 思[おも]います» também suaviza: o japonês raramente dá opinião seca. Até uma opinião forte vem como «〜と 思[おも]います», e uma discordância como «違[ちが]う と 思[おも]います» — acho que é diferente — em vez de «não»."]
  - pt_only: "Brasileiro também sofre com estereótipo: nem todo mundo samba, joga bola ou mora na praia. Rir disso junto, dos dois lados, quebra o gelo."
