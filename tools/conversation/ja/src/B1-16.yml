id: B1-16
protagonist: f
title: [Apologies, Desculpas]
situation: ["The rumour was true — and Misaki is upset that it spread before they told their families. Kenta asks you how to apologise.", "O boato era verdade — e a Misaki está chateada porque espalhou antes de eles contarem às famílias. O Kenta pergunta como pedir desculpas."]
learn: [n4-047, n4-073, n4-074]
culture: —
items:
  - [ayamaru, "謝[あやま]る", "apologise", "pedir desculpas"]
  - [yurushite, "許[ゆる]して", "forgive me", "me perdoa"]
  - [mou-nidoto, "もう 二度[にど] と", "never again", "nunca mais"]
  - [you-volitional, "〜よう", "let's (plain volitional)", "vamos (volitivo simples)"]
  - [ayamarou, "謝[あやま]ろう", "let's apologise; I'll apologise", "vamos pedir desculpas; vou pedir desculpas"]
  - [hanasou, "話[はな]そう", "let's talk", "vamos conversar"]
  - [ikou, "行[い]こう", "let's go (plain)", "vamos (simples)"]
  - [kimochi-wo-tsutaeru, "気持[きも]ち を 伝[つた]える", "convey your feelings", "dizer o que sente"]
  - [hana-wo-kaou, "花[はな] を 買[か]おう", "let's buy flowers", "vamos comprar flores"]
  - [chokusetsu, "直接[ちょくせつ]", "directly, in person", "pessoalmente"]
  - [hansei, "反省[はんせい]", "reflecting on a mistake", "reconhecer o erro, refletir"]
dialogue:
  - [kenta, "美咲[みさき] が 怒[おこ]って る。 俺[おれ] が 友達[ともだち] に 言[い]っちゃった から。", "Misaki's angry. Because I told a friend.", "A Misaki está brava. Porque eu contei para um amigo."]
  - [protagonist, "じゃあ、 謝[あやま]ろう。 直接[ちょくせつ] 会[あ]って 話[はな]そう よ。", "Then apologise. Meet her and talk in person.", "Então pede desculpas. Encontra ela e conversa pessoalmente."]
  - [kenta, "LINE じゃ だめ？", "Not on LINE?", "Pelo LINE não dá?"]
  - [protagonist, "だめ。 大事[だいじ] な こと は 直接[ちょくせつ]。 花[はな] を 買[か]おう か。", "No. Important things in person. Shall we buy flowers?", "Não. Coisa importante é pessoalmente. Vamos comprar flores?"]
  - [kenta, "何[なん] て 言[い]えば いい？", "What should I say?", "O que eu falo?"]
  - [protagonist, "「ごめん。 反省[はんせい] して る。 もう 二度[にど] と しない。 許[ゆる]して」。", "“I'm sorry. I've thought about what I did. I'll never do it again. Forgive me.”", "«Desculpa. Reconheço o erro. Nunca mais faço isso. Me perdoa.»"]
  - [kenta, "よし、 今[いま] から 行[い]こう。 気持[きも]ち を 伝[つた]える。", "Right, I'll go now. I'll tell her how I feel.", "Beleza, vou agora. Vou dizer o que sinto."]
  - [protagonist, "頑張[がんば]って！ 結果[けっか]、 教[おし]えて ね。", "Good luck! Tell me how it goes.", "Boa sorte! Depois me conta."]
teach:
  - ask: ["Say: to apologise.", "Diga: pedir desculpas.", "謝[あやま]る", ayamaru]
  - note: ["The plain «let's» — the volitional: «る» verbs take «よう» («食[た]べよう»); others change the last sound to «お» and lengthen it: «謝[あやま]る» → «謝[あやま]ろう», «話[はな]す» → «話[はな]そう», «行[い]く» → «行[い]こう». It's the casual «〜ましょう», and also I'll (decide to).", "O «vamos» simples — o volitivo: verbos em «る» levam «よう» («食[た]べよう»); os outros trocam o último som por «お» e alongam: «謝[あやま]る» → «謝[あやま]ろう», «話[はな]す» → «話[はな]そう», «行[い]く» → «行[い]こう». É o «〜ましょう» informal, e também vou (decidi)."]
  - ask: ["Say the ending: let's (plain).", "Diga a terminação: vamos (simples).", "〜よう", you-volitional]
  - ask: ["Say: let's apologise.", "Diga: vamos pedir desculpas.", "謝[あやま]ろう。", ayamarou]
  - ask: ["Say: let's talk.", "Diga: vamos conversar.", "話[はな]そう。", hanasou]
  - ask: ["Say: let's go — plain.", "Diga: vamos — simples.", "行[い]こう。", ikou]
  - ask: ["Say: let's buy flowers.", "Diga: vamos comprar flores.", "花[はな] を 買[か]おう。", hana-wo-kaou]
  - ask: ["Say: in person.", "Diga: pessoalmente.", "直接[ちょくせつ]", chokusetsu]
  - ask: ["Say: reflecting on a mistake.", "Diga: reconhecer o erro.", "反省[はんせい]", hansei]
  - ask: ["Say: never again.", "Diga: nunca mais.", "もう 二度[にど] と", mou-nidoto]
  - ask: ["Say: forgive me.", "Diga: me perdoa.", "許[ゆる]して。", yurushite]
  - ask: ["Say: convey your feelings.", "Diga: dizer o que sente.", "気持[きも]ち を 伝[つた]える", kimochi-wo-tsutaeru]
  - note: ["A Japanese apology shows «反省[はんせい]» — that you've thought about what you did — and promises it won't happen again. Saying it in person, not by message, is what makes it count. Kenta switches to «俺[おれ]», the rough male I, among close friends.", "Um pedido de desculpas japonês mostra «反省[はんせい]» — que você pensou no que fez — e promete que não vai se repetir. Dizer pessoalmente, e não por mensagem, é o que faz valer. O Kenta passa a usar «俺[おれ]», o eu masculino mais bruto, entre amigos próximos."]
  - pt_only: "No Brasil um áudio de desculpas às vezes resolve. No Japão, para coisa séria, só pessoalmente — e de preferência com um gesto, como flores ou um doce."
