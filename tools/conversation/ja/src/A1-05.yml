id: A1-05
protagonist: f
title: [Hiragana, Hiragana]
situation: ["After work the konbini manager walks with you to the station and shows you the signs.", "Depois do trabalho o gerente da konbini vai com você até a estação e mostra as placas."]
learn: []
culture: Three scripts at once
items:
  - [hiragana, "ひらがな", "hiragana (the round script)", "hiragana (a escrita arredondada)"]
  - [katakana, "カタカナ", "katakana (the angular script, for foreign words)", "katakana (a escrita angulosa, para palavras estrangeiras)"]
  - [kanji, "漢字[かんじ]", "kanji (Chinese characters)", "kanji (caracteres chineses)"]
  - [eki, "駅[えき]", "station", "estação"]
  - [deguchi, "出口[でぐち]", "exit", "saída"]
  - [iriguchi, "入口[いりぐち]", "entrance", "entrada"]
  - [asoko, "あそこ", "over there", "ali, lá"]
  - [yomemasu-ka, "読[よ]めます か", "can you read (it)?", "consegue ler?"]
  - [muzukashii, "難[むずか]しい", "difficult", "difícil"]
  - [ganbarimasu, "頑張[がんば]ります", "I'll do my best", "vou me esforçar"]
  - [doko-desu-ka, "どこ です か", "where is it?", "onde fica?"]
dialogue:
  - [tencho, "あそこ が 駅[えき] です。", "That's the station over there.", "Ali é a estação."]
  - [protagonist, "あの 字[じ] は？ 読[よ]めません。", "Those characters? I can't read them.", "Aquelas letras? Não consigo ler."]
  - [tencho, "漢字[かんじ] です。 「出口[でぐち]」。 外[そと] に 出[で]る 所[ところ] です。", "They're kanji: 'exit'. Where you go out.", "São kanji: 'saída'. Onde se sai."]
  - [protagonist, "入口[いりぐち] は どこ です か。", "Where's the entrance?", "Onde fica a entrada?"]
  - [tencho, "あそこ です。 ひらがな は 読[よ]めます か。", "Over there. Can you read hiragana?", "Ali. Consegue ler hiragana?"]
  - [protagonist, "少[すこ]し。 カタカナ も 少[すこ]し。", "A little. Katakana too, a little.", "Um pouco. Katakana também, um pouco."]
  - [tencho, "日本語[にほんご] は 難[むずか]しい です ね。", "Japanese is difficult, isn't it.", "Japonês é difícil, né?"]
  - [protagonist, "はい。 でも 頑張[がんば]ります！", "Yes. But I'll do my best!", "Sim. Mas vou me esforçar!"]
teach:
  - note: ["Japanese uses three scripts at once: round «ひらがな», angular «カタカナ» for foreign words, and «漢字[かんじ]», characters from Chinese.", "O japonês usa três escritas ao mesmo tempo: a arredondada «ひらがな», a angulosa «カタカナ» para palavras estrangeiras, e «漢字[かんじ]», caracteres vindos do chinês."]
  - ask: ["Say: hiragana.", "Diga: hiragana.", "ひらがな", hiragana]
  - ask: ["Say: katakana.", "Diga: katakana.", "カタカナ", katakana]
  - ask: ["Say: kanji.", "Diga: kanji.", "漢字[かんじ]", kanji]
  - note: ["«あそこ が 駅[えき] です» — over there is the station. «が» points at the one: that one, over there.", "«あそこ が 駅[えき] です» — ali é a estação. «が» aponta: aquela, ali."]
  - ask: ["Say: the station is over there.", "Diga: a estação é ali.", "あそこ が 駅[えき] です。", asoko, ga, eki]
  - ask: ["Say: exit.", "Diga: saída.", "出口[でぐち]", deguchi]
  - ask: ["Ask where the entrance is.", "Pergunte onde fica a entrada.", "入口[いりぐち] は どこ です か。", iriguchi, doko-desu-ka]
  - ask: ["He asks if you can read hiragana. How?", "Ele pergunta se você consegue ler hiragana. Como?", "ひらがな は 読[よ]めます か。", yomemasu-ka]
  - ask: ["Say: Japanese is difficult.", "Diga: japonês é difícil.", "日本語[にほんご] は 難[むずか]しい です。", muzukashii]
  - ask: ["Promise to do your best.", "Prometa se esforçar.", "頑張[がんば]ります！", ganbarimasu]
  - note: ["Signs at the station are also in English, and in Hamamatsu many are in Portuguese too. Learning «出口[でぐち]» and «入口[いりぐち]» first saves you every day.", "As placas da estação também estão em inglês, e em Hamamatsu muitas em português. Aprender «出口[でぐち]» e «入口[いりぐち]» primeiro salva você todo dia."]
