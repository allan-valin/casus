id: B2-11
protagonist: f
title: ["The obligatory nomikai?", "O nomikai obrigatório?"]
situation: ["The department's drinking party is on Friday — the same night as Shota's birthday dinner. You ask Chief Sato whether you can skip it.", "O nomikai do departamento é na sexta — na mesma noite do jantar de aniversário do Shota. Você pergunta à chefe Sato se pode faltar."]
learn: [n3-076]
culture: Norms are changing
items:
  - [kesseki, "欠席[けっせき]", "absence, not attending", "ausência, não comparecer"]
  - [tsugou, "都合[つごう]", "convenience, circumstances", "disponibilidade, compromissos"]
  - [sanka, "参加[さんか]", "participation", "participação"]
  - [tsukiai, "付[つ]き合[あ]い", "socialising (for work)", "convivência (de trabalho)"]
  - [wake-dewa-nai, "〜わけ では ない", "it's not that…", "não é que…"]
  - [kyousei-dewa-nai, "強制[きょうせい] では ない", "it's not compulsory", "não é obrigatório"]
  - [tsugou-ga-warui, "都合[つごう] が 悪[わる]い", "it's not convenient (I can't)", "não posso, não dá"]
  - [zannen-desu-ga, "残念[ざんねん] です が", "unfortunately", "infelizmente"]
  - [tsugi-wa-zehi, "次[つぎ] は ぜひ", "next time for sure", "da próxima, com certeza"]
  - [kanji-san, "幹事[かんじ]", "party organiser", "organizador (da festa)", {rare: true}]
dialogue:
  - [protagonist, "課長[かちょう]、 金曜日[きんようび] の 飲[の]み会[かい] です が、 その 日[ひ] は 都合[つごう] が 悪[わる]くて…", "Chief, about Friday's party, that day isn't convenient for me…", "Chefe, sobre o nomikai de sexta, nesse dia eu não posso…"]
  - [sato, "そう です か。 欠席[けっせき] でも 大丈夫[だいじょうぶ] です よ。", "I see. It's fine not to come.", "Entendo. Pode faltar, tudo bem."]
  - [protagonist, "本当[ほんとう] に いい ん です か。 飲[の]み会[かい] も 仕事[しごと] だ と 聞[き]きました。", "Is it really okay? I heard parties are part of the job.", "É mesmo? Ouvi dizer que o nomikai também faz parte do trabalho."]
  - [sato, "付[つ]き合[あ]い は 大事[だいじ] です が、 強制[きょうせい] では ありません。 今[いま] は 来[こ]ない 人[ひと] も 多[おお]い です。", "Socialising matters, but it's not compulsory. Many people don't come nowadays.", "A convivência é importante, mas não é obrigatória. Hoje muita gente não vai."]
  - [protagonist, "行[い]きたく ない わけ では ない ん です。 彼[かれ] の 誕生日[たんじょうび] で。", "It's not that I don't want to go. It's my boyfriend's birthday.", "Não é que eu não queira ir. É o aniversário do meu namorado."]
  - [sato, "それ は 大切[たいせつ] です ね。 幹事[かんじ] に は 私[わたし] から 言[い]って おきます。", "That's important. I'll let the organiser know.", "Isso é importante. Eu aviso o organizador."]
  - [protagonist, "ありがとう ございます。 残念[ざんねん] です が、 次[つぎ] は ぜひ 参加[さんか] します。", "Thank you. Unfortunately not this time, but next time I'll definitely come.", "Obrigada. Infelizmente não dá, mas da próxima vou com certeza."]
  - [sato, "楽[たの]しんで ね。", "Enjoy.", "Aproveite."]
teach:
  - ask: ["Say: participation.", "Diga: participação.", "参加[さんか]", sanka]
  - ask: ["Say: not attending.", "Diga: ausência.", "欠席[けっせき]", kesseki]
  - ask: ["Say: convenience, circumstances.", "Diga: disponibilidade.", "都合[つごう]", tsugou]
  - ask: ["Decline gently: it's not convenient for me.", "Recuse com jeito: eu não posso.", "都合[つごう] が 悪[わる]くて…", tsugou-ga-warui]
  - ask: ["Say: socialising for work.", "Diga: convivência de trabalho.", "付[つ]き合[あ]い", tsukiai]
  - ask: ["Say: it's not compulsory.", "Diga: não é obrigatório.", "強制[きょうせい] では ない", kyousei-dewa-nai]
  - note: ["«〜わけ では ない» is it's not that…: it denies a conclusion the other might draw. «行[い]きたく ない わけ では ない» — it's not that I don't want to go. Useful to say no without offending.", "«〜わけ では ない» é não é que…: nega uma conclusão que o outro poderia tirar. «行[い]きたく ない わけ では ない» — não é que eu não queira ir. Útil para dizer não sem ofender."]
  - ask: ["Say the pattern: it's not that…", "Diga o padrão: não é que…", "〜わけ では ない", wake-dewa-nai]
  - ask: ["Say: it's not that I don't want to go.", "Diga: não é que eu não queira ir.", "行[い]きたく ない わけ では ない。", wake-dewa-nai]
  - ask: ["Say: unfortunately.", "Diga: infelizmente.", "残念[ざんねん] です が", zannen-desu-ga]
  - ask: ["Promise: next time for sure.", "Prometa: da próxima, com certeza.", "次[つぎ] は ぜひ", tsugi-wa-zehi]
  - ask: ["Say: the party organiser.", "Diga: o organizador.", "幹事[かんじ]", kanji-san]
  - note: ["After-work parties used to feel compulsory; younger workers now skip them more freely, and many companies say so openly. Decline early, with «都合[つごう] が 悪[わる]くて» — no long excuse needed — and show willingness for next time.", "Os nomikai já pareceram obrigatórios; os mais jovens hoje faltam com mais liberdade, e muitas empresas dizem isso abertamente. Recuse cedo, com «都合[つごう] が 悪[わる]くて» — sem desculpa comprida — e mostre vontade de ir na próxima."]
  - pt_only: "«都合[つごう] が 悪[わる]くて» é a desculpa universal japonesa: não precisa explicar o quê. Como o nosso «não vai dar», só que mais elegante."
