id: C1-14
protagonist: m
title: ["Protest", "Protesto"]
situation: ["Sunday in Shizuoka city: a quiet march about restarting the Hamaoka nuclear plant. Kenta has come to collect signatures; you go along to see.", "Domingo na cidade de Shizuoka: uma passeata tranquila sobre religar a usina nuclear de Hamaoka. O Kenta veio recolher assinaturas; você vai junto para ver."]
learn: []
culture: Civic life
items:
  - [demo, "デモ", "demonstration, march", "manifestação, passeata"]
  - [youkyuu, "要求[ようきゅう]", "demand", "reivindicação"]
  - [shomei-petition, "署名[しょめい]", "signature (on a petition)", "assinatura (num abaixo-assinado)"]
  - [wo-megutte, "〜を めぐって", "over, concerning (a dispute)", "em torno de, sobre (uma disputa)"]
  - [saikadou, "再稼働[さいかどう]", "restart (of a plant)", "religamento (de usina)", {rare: true}]
  - [juumin-touhyou, "住民[じゅうみん] 投票[とうひょう]", "local referendum", "plebiscito local", {rare: true}]
  - [heiwa-teki, "平和[へいわ] 的[てき] に", "peacefully", "pacificamente"]
  - [iken-ga-wakareru, "意見[いけん] が 分[わ]かれる", "opinions are divided", "as opiniões se dividem"]
  - [shuchou-suru, "主張[しゅちょう] する", "assert, speak up for", "defender, reivindicar"]
  - [sanka-shite-mo-ii, "参加[さんか] して も いい", "may take part", "pode participar"]
dialogue:
  - [kenta, "浜岡[はまおか] の 再稼働[さいかどう] を めぐって、 住民[じゅうみん] 投票[とうひょう] を 求[もと]める 署名[しょめい] を 集[あつ]めて いる ん だ。", "Over the Hamaoka restart, we're collecting signatures asking for a local referendum.", "Sobre o religamento de Hamaoka, estamos recolhendo assinaturas pedindo um plebiscito."]
  - [protagonist, "デモ って、 もっと 激[はげ]しい と 思[おも]って いた。", "I thought demonstrations were more intense.", "Achei que manifestação fosse mais agitada."]
  - [kenta, "日本[にほん] の デモ は 平和[へいわ] 的[てき]。 警察[けいさつ] が 道[みち] を 案内[あんない] して くれる くらい。", "Japanese demos are peaceful. The police even guide the route.", "Manifestação japonesa é pacífica. A polícia até guia o caminho."]
  - [protagonist, "要求[ようきゅう] は 何[なん] な の？", "What's the demand?", "Qual é a reivindicação?"]
  - [kenta, "賛成[さんせい] か 反対[はんたい] か、 県民[けんみん] に 決[き]めて ほしい って こと。", "That the people of the prefecture decide, for or against.", "Que o povo da província decida, a favor ou contra."]
  - [protagonist, "外国人[がいこくじん] も 参加[さんか] して も いい の？", "Can foreigners take part?", "Estrangeiro pode participar?"]
  - [kenta, "デモ を 見[み]る の も 歩[ある]く の も 自由[じゆう] だ よ。 でも 署名[しょめい] は 有権者[ゆうけんしゃ] だけ。", "Watching or walking is free. But only voters can sign.", "Ver e caminhar é livre. Mas só eleitor pode assinar."]
  - [protagonist, "意見[いけん] が 分[わ]かれる 問題[もんだい] だ から、 みんな が 主張[しゅちょう] できる の は いい ね。", "It's a divisive issue, so it's good that everyone can speak up.", "É uma questão que divide opiniões, então é bom que todo mundo possa se manifestar."]
teach:
  - ask: ["Say: a demonstration.", "Diga: uma manifestação.", "デモ", demo]
  - ask: ["Say: restart of a plant.", "Diga: religamento de usina.", "再稼働[さいかどう]", saikadou]
  - note: ["«〜を めぐって» is over, concerning — a topic people argue about: «再稼働[さいかどう] を めぐって», over the restart; «遺産[いさん] を めぐる 争[あらそ]い», a fight over an inheritance. News language.", "«〜を めぐって» é em torno de — um assunto sobre o qual se discute: «再稼働[さいかどう] を めぐって», sobre o religamento; «遺産[いさん] を めぐる 争[あらそ]い», uma briga em torno de uma herança. Linguagem de noticiário."]
  - ask: ["Say the pattern: over, concerning.", "Diga o padrão: em torno de.", "〜を めぐって", wo-megutte]
  - ask: ["Say: a demand.", "Diga: uma reivindicação.", "要求[ようきゅう]", youkyuu]
  - ask: ["Say: a signature on a petition.", "Diga: assinatura num abaixo-assinado.", "署名[しょめい]", shomei-petition]
  - ask: ["Say: a local referendum.", "Diga: um plebiscito local.", "住民[じゅうみん] 投票[とうひょう]", juumin-touhyou]
  - ask: ["Say: peacefully.", "Diga: pacificamente.", "平和[へいわ] 的[てき] に", heiwa-teki]
  - ask: ["Ask: may I take part?", "Pergunte: posso participar?", "参加[さんか] して も いい？", sanka-shite-mo-ii]
  - ask: ["Say: opinions are divided.", "Diga: as opiniões se dividem.", "意見[いけん] が 分[わ]かれる", iken-ga-wakareru]
  - ask: ["Say: to speak up for something.", "Diga: defender, reivindicar.", "主張[しゅちょう] する", shuchou-suru]
  - note: ["Demonstrations in Japan need a permit, follow a set route with police escort, and are usually calm. Residents can petition for a local referendum; in Shizuoka, a petition about Hamaoka gathered enough signatures, though the assembly decided not to hold the vote. Foreigners may watch or march, but only registered voters sign.", "Manifestações no Japão precisam de autorização, seguem um trajeto definido com escolta policial e costumam ser calmas. Os moradores podem pedir um plebiscito local; em Shizuoka, um abaixo-assinado sobre Hamaoka reuniu assinaturas suficientes, mas a assembleia decidiu não fazer a votação. Estrangeiros podem assistir ou caminhar, mas só eleitores assinam."]
  - pt_only: "Passeata no Brasil tem carro de som, bateria e às vezes confronto. No Japão é silenciosa, organizada — e a força está nas assinaturas."
