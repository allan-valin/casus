id: B2-15
protagonist: f
title: ["Truth and media", "Verdade e mídia"]
situation: ["After a strong quake, a post goes viral: a lion has escaped from the zoo. Aya is about to share it. You stop her.", "Depois de um terremoto forte, um post viraliza: um leão fugiu do zoológico. A Aya está para compartilhar. Você impede."]
learn: [n4-081]
culture: —
items:
  - [dema, "デマ", "false rumour, fake news", "boato falso, fake news"]
  - [shutten, "出典[しゅってん]", "source", "fonte"]
  - [kiji, "記事[きじ]", "article", "matéria, artigo"]
  - [kakusan, "拡散[かくさん]", "spreading, sharing widely", "espalhar, compartilhar", {rare: true}]
  - [rashii-review, "〜らしい けど", "apparently, but…", "parece que, mas…"]
  - [koushiki, "公式[こうしき]", "official", "oficial"]
  - [shinjiru, "信[しん]じる", "believe", "acreditar"]
  - [shirabete-kara, "調[しら]べて から", "after checking", "depois de verificar"]
  - [nisemono, "偽物[にせもの]", "fake (thing)", "falso, falsificado"]
  - [shashin-no-kakou, "写真[しゃしん] の 加工[かこう]", "edited photo", "foto editada", {rare: true}]
dialogue:
  - [aya, "見[み]て！ 動物園[どうぶつえん] から ライオン が 逃[に]げた らしい！ 拡散[かくさん] しよう。", "Look! Apparently a lion escaped from the zoo! Let's share it.", "Olha! Parece que um leão fugiu do zoológico! Vamos compartilhar."]
  - [protagonist, "待[ま]って。 出典[しゅってん] は どこ？", "Wait. What's the source?", "Espera. Qual é a fonte?"]
  - [aya, "知[し]らない 人[ひと] の 投稿[とうこう]。 写真[しゃしん] も ある よ。", "A post from someone I don't know. There's a photo.", "Um post de alguém que eu não conheço. Tem foto."]
  - [protagonist, "写真[しゃしん] は 加工[かこう] できる。 動物園[どうぶつえん] の 公式[こうしき] サイト は？", "Photos can be edited. What does the zoo's official site say?", "Foto dá para editar. E o site oficial do zoológico?"]
  - [aya, "…何[なに] も 書[か]いて ない。 ニュース の 記事[きじ] も ない。", "…Nothing there. No news article either.", "…Não diz nada. Nem matéria no noticiário."]
  - [protagonist, "じゃあ、 デマ かも しれない。 地震[じしん] の 後[あと] は デマ が 多[おお]い って 聞[き]いた。", "Then it might be fake. I heard there's a lot of fake news after earthquakes.", "Então pode ser fake. Ouvi dizer que depois de terremoto tem muito boato."]
  - [aya, "危[あぶ]なかった。 信[しん]じる 前[まえ] に、 調[しら]べて から 拡散[かくさん] する べき だ ね。", "That was close. You should check before you believe and share.", "Essa foi por pouco. Antes de acreditar, tem que verificar, e só depois compartilhar."]
  - [protagonist, "うん。 偽物[にせもの] の 写真[しゃしん] は 本当[ほんとう] に 多[おお]い から。", "Yeah. There are really a lot of fake photos.", "É. Tem muita foto falsa por aí."]
teach:
  - ask: ["Say: fake news, a false rumour.", "Diga: fake news, boato falso.", "デマ", dema]
  - ask: ["Say: spreading, sharing widely.", "Diga: espalhar.", "拡散[かくさん]", kakusan]
  - ask: ["Ask: what's the source?", "Pergunte: qual é a fonte?", "出典[しゅってん] は？", shutten]
  - ask: ["Say: official.", "Diga: oficial.", "公式[こうしき]", koushiki]
  - ask: ["Say: a news article.", "Diga: uma matéria.", "記事[きじ]", kiji]
  - ask: ["Say: an edited photo.", "Diga: uma foto editada.", "写真[しゃしん] の 加工[かこう]", shashin-no-kakou]
  - ask: ["Say: fake, a fake thing.", "Diga: falso, falsificado.", "偽物[にせもの]", nisemono]
  - note: ["You met «らしい», apparently — what you've heard, not checked. In the news it's a warning light: «逃[に]げた らしい» means nobody has confirmed it. Pair it with «〜て から», after: «調[しら]べて から 拡散[かくさん] する», share after checking.", "Você conhece «らしい», parece que — o que você ouviu, não verificou. Nas notícias é uma luz de alerta: «逃[に]げた らしい» quer dizer que ninguém confirmou. Combine com «〜て から», depois de: «調[しら]べて から 拡散[かくさん] する», compartilhar depois de verificar."]
  - ask: ["Say: apparently, but…", "Diga: parece que, mas…", "〜らしい けど", rashii-review]
  - ask: ["Say: after checking.", "Diga: depois de verificar.", "調[しら]べて から", shirabete-kara]
  - ask: ["Say: believe.", "Diga: acreditar.", "信[しん]じる", shinjiru]
  - note: ["After the 2016 Kumamoto earthquake, a fake post with a photo claimed a lion had escaped from a zoo; the man who posted it was arrested. Disasters bring a flood of «デマ». Check official sources — the city, the zoo, the national broadcaster — before you share.", "Depois do terremoto de Kumamoto em 2016, um post falso com foto disse que um leão tinha fugido do zoológico; o homem que postou foi preso. Desastres trazem uma enxurrada de «デマ». Confira as fontes oficiais — a prefeitura, o zoológico, a emissora pública — antes de compartilhar."]
  - pt_only: "Corrente de WhatsApp e fake news são velhas conhecidas no Brasil. A regra é a mesma nas duas línguas: fonte primeiro, compartilhar depois."
