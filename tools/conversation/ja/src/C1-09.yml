id: C1-09
protagonist: f
title: ["The accident", "O acidente"]
situation: ["A car backs into yours in a supermarket car park — a scratch, nobody hurt. The other driver wants to settle it privately. Shota says call the police.", "Um carro dá ré e bate no seu no estacionamento do supermercado — um arranhão, ninguém ferido. O outro motorista quer resolver entre vocês. O Shota diz para chamar a polícia."]
learn: [n2-191]
culture: Always call the police
items:
  - [sesshoku-jiko, "接触[せっしょく] 事故[じこ]", "minor collision", "batida leve"]
  - [hoken, "保険[ほけん]", "insurance", "seguro"]
  - [keisatsu, "警察[けいさつ]", "police", "polícia"]
  - [kashitsu, "過失[かしつ]", "fault, negligence", "culpa"]
  - [ni-motozuite, "〜に 基[もと]づいて", "based on", "com base em"]
  - [jiko-shoumei, "事故[じこ] 証明[しょうめい]", "accident certificate", "certidão de acidente", {rare: true}]
  - [kega, "怪我[けが]", "injury", "ferimento"]
  - [kizu, "傷[きず]", "scratch, damage", "arranhão"]
  - [jidan, "示談[じだん]", "private settlement", "acordo particular", {rare: true}]
  - [renraku-saki-koukan, "連絡先[れんらくさき] を 交換[こうかん] する", "exchange contact details", "trocar contatos"]
dialogue:
  - [protagonist, "ちょっと 傷[きず] が ついた だけ です。 怪我[けが] は ありません。", "It's just a small scratch. Nobody's hurt.", "Foi só um arranhãozinho. Ninguém se feriu."]
  - [shota, "それでも 警察[けいさつ] を 呼[よ]ぼう。 相手[あいて] は 示談[じだん] に したい みたい だ けど。", "Even so, let's call the police. The other driver seems to want a private settlement, though.", "Mesmo assim, vamos chamar a polícia. O outro motorista parece querer um acordo particular."]
  - [protagonist, "どうして？ 小[ちい]さな 事故[じこ] な のに。", "Why? It's such a small accident.", "Por quê? É um acidente tão pequeno."]
  - [shota, "警察[けいさつ] が 来[こ]ない と、 事故[じこ] 証明[しょうめい] が 出[で]ない。 保険[ほけん] が 使[つか]えない ん だ。", "If the police don't come, there's no accident certificate. Then you can't use the insurance.", "Sem a polícia, não sai a certidão de acidente. Aí não dá para usar o seguro."]
  - [omawari, "お怪我[けが] は ない です か。 状況[じょうきょう] を 教[おし]えて ください。", "Is anyone hurt? Please tell me what happened.", "Alguém se feriu? Conte o que aconteceu, por favor."]
  - [protagonist, "止[と]まって いたら、 後[うし]ろ から ぶつけられました。", "I was stopped and got hit from behind.", "Eu estava parada e bateram atrás."]
  - [omawari, "わかりました。 過失[かしつ] の 割合[わりあい] は、 この 記録[きろく] に 基[もと]づいて 保険[ほけん] 会社[がいしゃ] が 決[き]めます。", "Understood. The insurance companies will decide the share of fault based on this record.", "Entendido. A proporção da culpa será decidida pelas seguradoras com base neste registro."]
  - [shota, "相手[あいて] と 連絡先[れんらくさき] を 交換[こうかん] して おこう。", "Let's exchange contact details with the other driver.", "Vamos trocar contatos com o outro motorista."]
teach:
  - ask: ["Say: a minor collision.", "Diga: uma batida leve.", "接触[せっしょく] 事故[じこ]", sesshoku-jiko]
  - ask: ["Say: a scratch.", "Diga: um arranhão.", "傷[きず]", kizu]
  - ask: ["Say: an injury.", "Diga: um ferimento.", "怪我[けが]", kega]
  - ask: ["Say: the police.", "Diga: a polícia.", "警察[けいさつ]", keisatsu]
  - ask: ["Say: insurance.", "Diga: seguro.", "保険[ほけん]", hoken]
  - ask: ["Say: a private settlement.", "Diga: um acordo particular.", "示談[じだん]", jidan]
  - ask: ["Say: the accident certificate.", "Diga: a certidão de acidente.", "事故[じこ] 証明[しょうめい]", jiko-shoumei]
  - ask: ["Say: fault.", "Diga: culpa.", "過失[かしつ]", kashitsu]
  - note: ["«〜に 基[もと]づいて» is based on — rules, data, records: «記録[きろく] に 基[もと]づいて 決[き]める», decide based on the record. Before a noun: «事実[じじつ] に 基[もと]づいた 話[はなし]», a story based on facts.", "«〜に 基[もと]づいて» é com base em — regras, dados, registros: «記録[きろく] に 基[もと]づいて 決[き]める», decidir com base no registro. Antes de substantivo: «事実[じじつ] に 基[もと]づいた 話[はなし]», história baseada em fatos."]
  - ask: ["Say the pattern: based on.", "Diga o padrão: com base em.", "〜に 基[もと]づいて", ni-motozuite]
  - ask: ["Say: exchange contact details.", "Diga: trocar contatos.", "連絡先[れんらくさき] を 交換[こうかん] する", renraku-saki-koukan]
  - note: ["In Japan any traffic accident, however small, must be reported to the police — it's the law, and without the police report there's no «事故[じこ] 証明[しょうめい]» and your insurance may not pay. Fault is split in percentages, «過失[かしつ] 割合[わりあい]», based on standard tables.", "No Japão todo acidente de trânsito, por menor que seja, tem que ser comunicado à polícia — é lei, e sem o registro policial não sai a «事故[じこ] 証明[しょうめい]» e o seguro pode não pagar. A culpa é dividida em porcentagens, «過失[かしつ] 割合[わりあい]», com base em tabelas padrão."]
  - pt_only: "No Brasil muita batida leve se resolve com foto e WhatsApp. No Japão, acordo sem polícia é arriscado: o seguro pede o documento oficial."
