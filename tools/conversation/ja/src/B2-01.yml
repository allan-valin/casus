id: B2-01
protagonist: f
title: ["The interview", "A entrevista"]
situation: ["Your one-year contract is ending. The company offers an interview for a permanent post with Mr Takahashi, head of the overseas department.", "Seu contrato de um ano está acabando. A empresa oferece uma entrevista para uma vaga efetiva com o senhor Takahashi, chefe do departamento internacional."]
learn: []
culture: The interview script
items:
  - [mensetsu, "面接[めんせつ]", "interview", "entrevista"]
  - [jiko-shoukai, "自己[じこ] 紹介[しょうかい]", "self-introduction", "apresentação pessoal"]
  - [chousho, "長所[ちょうしょ]", "strong point", "ponto forte"]
  - [tansho, "短所[たんしょ]", "weak point", "ponto fraco"]
  - [shibou-douki, "志望[しぼう] 動機[どうき]", "reason for applying", "motivo da candidatura", {rare: true}]
  - [moushimasu, "〜と 申[もう]します", "my name is… (humble)", "me chamo… (humilde)"]
  - [orimasu, "おります", "am, is (humble いる)", "estou (humilde de いる)"]
  - [mairimashita, "参[まい]りました", "came (humble)", "vim (humilde)"]
  - [shitsurei-itashimasu, "失礼[しつれい] いたします", "excuse me (very polite)", "com licença (muito educado)"]
  - [seishain, "正社員[せいしゃいん]", "permanent employee", "funcionário efetivo"]
  - [kouken, "貢献[こうけん]", "contribution", "contribuição"]
dialogue:
  - [protagonist, "失礼[しつれい] いたします。", "Excuse me.", "Com licença."]
  - [buchou, "どうぞ、 おかけ ください。 では、 自己[じこ] 紹介[しょうかい] を お願[ねが]いします。", "Please have a seat. Then, introduce yourself, please.", "Sente-se, por favor. Então, apresente-se, por favor."]
  - [protagonist, "ブラジル の サンパウロ から 参[まい]りました、 ソウザ と 申[もう]します。 一年[いちねん]、 浜松[はままつ] 工場[こうじょう] で 通訳[つうやく] を して おります。", "My name is Souza, I came from São Paulo, Brazil. For a year I've been working as an interpreter at the Hamamatsu plant.", "Me chamo Souza, vim de São Paulo, no Brasil. Há um ano trabalho como intérprete na fábrica de Hamamatsu."]
  - [buchou, "志望[しぼう] 動機[どうき] は 何[なん] です か。", "What is your reason for applying?", "Qual é o motivo da sua candidatura?"]
  - [protagonist, "正社員[せいしゃいん] と して、 日本[にほん] と ブラジル の 架[か]け橋[はし] に なりたい と 思[おも]って おります。", "As a permanent employee, I'd like to be a bridge between Japan and Brazil.", "Como funcionária efetiva, quero ser uma ponte entre o Japão e o Brasil."]
  - [buchou, "長所[ちょうしょ] と 短所[たんしょ] を 教[おし]えて ください。", "Tell me your strong and weak points.", "Diga seus pontos fortes e fracos."]
  - [protagonist, "長所[ちょうしょ] は 明[あか]るい ところ です。 短所[たんしょ] は 漢字[かんじ] が まだ 苦手[にがて] な ところ です が、 毎日[まいにち] 勉強[べんきょう] して おります。", "My strong point is that I'm cheerful. My weak point is that I'm still weak at kanji, but I study every day.", "Meu ponto forte é ser alegre. Meu ponto fraco é que ainda tenho dificuldade com kanji, mas estudo todo dia."]
  - [buchou, "わかりました。 会社[かいしゃ] に どう 貢献[こうけん] できます か。", "I see. How can you contribute to the company?", "Entendi. Como você pode contribuir com a empresa?"]
teach:
  - ask: ["Say: a job interview.", "Diga: uma entrevista de emprego.", "面接[めんせつ]", mensetsu]
  - ask: ["Enter the room very politely.", "Entre na sala com muita educação.", "失礼[しつれい] いたします。", shitsurei-itashimasu]
  - ask: ["Say: a self-introduction.", "Diga: apresentação pessoal.", "自己[じこ] 紹介[しょうかい]", jiko-shoukai]
  - note: ["At work you lower yourself with humble verbs, «謙譲語[けんじょうご]»: «言[い]う» → «申[もう]す» («ソウザ と 申[もう]します», my name is Souza); «いる» → «おる» («して おります», I am doing); «来[く]る» / «行[い]く» → «参[まい]る» («参[まい]りました», I came). You never use them about the other person.", "No trabalho você se rebaixa com verbos humildes, «謙譲語[けんじょうご]»: «言[い]う» → «申[もう]す» («ソウザ と 申[もう]します», me chamo Souza); «いる» → «おる» («して おります», estou fazendo); «来[く]る» / «行[い]く» → «参[まい]る» («参[まい]りました», vim). Nunca se usam para falar do outro."]
  - ask: ["Introduce yourself humbly: my name is Souza.", "Apresente-se com humildade: me chamo Souza.", "ソウザ と 申[もう]します。", moushimasu]
  - ask: ["Say humbly: I came from São Paulo.", "Diga com humildade: vim de São Paulo.", "サンパウロ から 参[まい]りました。", mairimashita]
  - ask: ["Say humbly: I am, I'm doing — the humble いる.", "Diga com humildade: estou — o いる humilde.", "おります", orimasu]
  - ask: ["Say: reason for applying.", "Diga: motivo da candidatura.", "志望[しぼう] 動機[どうき]", shibou-douki]
  - ask: ["Say: permanent employee.", "Diga: funcionário efetivo.", "正社員[せいしゃいん]", seishain]
  - ask: ["Say: strong point.", "Diga: ponto forte.", "長所[ちょうしょ]", chousho]
  - ask: ["Say: weak point.", "Diga: ponto fraco.", "短所[たんしょ]", tansho]
  - ask: ["Say: contribution.", "Diga: contribuição.", "貢献[こうけん]", kouken]
  - note: ["Japanese interviews follow a script: knock three times, «失礼[しつれい] いたします», wait to be told to sit, a short self-introduction, the reason for applying, strong and weak points — a weakness always comes with what you're doing about it. Answers are short and humble.", "Entrevistas japonesas seguem um roteiro: bater três vezes, «失礼[しつれい] いたします», esperar mandarem sentar, uma apresentação curta, o motivo da candidatura, pontos fortes e fracos — o ponto fraco sempre vem com o que você está fazendo para melhorar. Respostas curtas e humildes."]
  - pt_only: "No Brasil a entrevista é mais conversa, e se vende o próprio peixe. No Japão, humildade e roteiro: fale pouco de si, muito do que pode fazer pela empresa."
