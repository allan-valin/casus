id: B1-01
protagonist: f
title: [The sentō, O sentō]
situation: ["Kenta's family invites you to the neighbourhood public bath. On the women's side: Kenta's mother and his sister Aya.", "A família do Kenta convida você para o banho público do bairro. Do lado das mulheres: a mãe do Kenta e a irmã dele, a Aya."]
learn: []
culture: The public bath
items:
  - [sentou, "銭湯[せんとう]", "public bath", "banho público", {rare: true}]
  - [yubune, "湯船[ゆぶね]", "the bathtub (the hot pool)", "a banheira (a piscina quente)", {rare: true}]
  - [gyuunyuu, "牛乳[ぎゅうにゅう]", "milk", "leite"]
  - [onna-yu, "女湯[おんなゆ]", "women's bath", "banho feminino", {rare: true}]
  - [atsui-casual, "熱[あつ]い ね", "it's hot, huh (casual)", "que quente, hein (informal)"]
  - [nanka, "なんか", "kind of, like", "tipo, meio"]
  - [dekai, "でかい", "huge (casual)", "enorme (informal)"]
  - [desho, "でしょ", "right?, see?", "né?, viu?"]
  - [hairou, "入[はい]ろう", "let's get in (casual)", "vamos entrar (informal)"]
  - [yatta, "やった", "yay!", "eba!"]
  - [furo-agari, "風呂[ふろ] 上[あ]がり", "after the bath", "depois do banho"]
dialogue:
  - [kenta-haha, "ここ が 女湯[おんなゆ] です よ。 まず 体[からだ] を 洗[あら]って ね。", "This is the women's side. Wash first, okay?", "Aqui é o lado das mulheres. Primeiro se lave, viu?"]
  - [aya, "早[はや]く 入[はい]ろう！ この 湯船[ゆぶね]、 でかい でしょ。", "Let's get in quick! This tub's huge, right?", "Vamos entrar logo! Essa banheira é enorme, né?"]
  - [protagonist, "うわ、 熱[あつ]い ね！ でも なんか 気持[きも]ち いい。", "Whoa, it's hot! But it kind of feels good.", "Nossa, que quente! Mas é meio gostoso."]
  - [aya, "でしょ？ 壁[かべ] の 富士山[ふじさん] も 見[み]て。", "Right? Look at the Fuji on the wall too.", "Né? Olha o Fuji na parede também."]
  - [protagonist, "絵[え] だ！ どの 銭湯[せんとう] に も ある の？", "A painting! Do all public baths have one?", "Uma pintura! Todo banho público tem?"]
  - [kenta-haha, "古[ふる]い 銭湯[せんとう] は 多[おお]い です ね。 お風呂[ふろ] 上[あ]がり は 牛乳[ぎゅうにゅう] です よ。", "Many old ones do. After the bath, it's milk.", "Os antigos, muitos têm. Depois do banho, é leite."]
  - [aya, "フルーツ 牛乳[ぎゅうにゅう]、 飲[の]もう！", "Let's have fruit milk!", "Vamos tomar leite de fruta!"]
  - [protagonist, "やった！ 腰[こし] に 手[て] を あてて 飲[の]む ん でしょ？", "Yay! You drink it with a hand on your hip, right?", "Eba! Bebe com a mão na cintura, né?"]
teach:
  - ask: ["Say: the public bath.", "Diga: o banho público.", "銭湯[せんとう]", sentou]
  - ask: ["Say: the women's bath.", "Diga: o banho feminino.", "女湯[おんなゆ]", onna-yu]
  - ask: ["Say: the bathtub.", "Diga: a banheira.", "湯船[ゆぶね]", yubune]
  - note: ["Among friends Japanese drops です and ます and adds little words: «でしょ？» right?, «なんか» kind of, «ね» huh. «入[はい]ろう» is the plain «入[はい]りましょう», let's get in. Aya is younger — with her you talk like this.", "Entre amigos o japonês larga o です e o ます e acrescenta palavrinhas: «でしょ？» né?, «なんか» tipo, meio, «ね» hein. «入[はい]ろう» é o «入[はい]りましょう» informal, vamos entrar. A Aya é mais nova — com ela se fala assim."]
  - ask: ["Say, casually: let's get in.", "Diga, informal: vamos entrar.", "入[はい]ろう！", hairou]
  - ask: ["Say, casually: it's hot, huh.", "Diga, informal: que quente, hein.", "熱[あつ]い ね！", atsui-casual]
  - ask: ["Say: kind of, like.", "Diga: tipo, meio.", "なんか", nanka]
  - ask: ["Say, casually: huge.", "Diga, informal: enorme.", "でかい", dekai]
  - ask: ["Ask for agreement: right?", "Peça concordância: né?", "でしょ？", desho]
  - ask: ["Say: after the bath.", "Diga: depois do banho.", "風呂[ふろ] 上[あ]がり", furo-agari]
  - ask: ["Say: milk.", "Diga: leite.", "牛乳[ぎゅうにゅう]", gyuunyuu]
  - ask: ["Cheer: yay!", "Comemore: eba!", "やった！", yatta]
  - note: ["A «銭湯[せんとう]» is a neighbourhood bath: you pay a few hundred yen, wash at the taps, then soak in big tubs, men and women apart. Old ones have a painting of Fuji on the wall, and a bottle of milk after the bath — hand on hip — is the classic.", "O «銭湯[せんとう]» é o banho do bairro: paga-se algumas centenas de ienes, lava-se nas torneiras e depois se relaxa nas banheiras grandes, homens e mulheres separados. Os antigos têm uma pintura do Fuji na parede, e um leitinho depois do banho — mão na cintura — é o clássico."]
  - pt_only: "O sentō é um pouco o clube do bairro: os vizinhos se encontram, conversam, os mais velhos vão todo dia. Muitos fecharam, mas os que sobraram são um pedaço do Japão antigo."
