id: A2-18
protagonist: m
title: [Proverbs, Provérbios]
situation: ["You complain to Mrs Suzuki that your Japanese is slow and that you made a silly mistake at work. She answers with sayings.", "Você reclama com a senhora Suzuki que seu japonês está lento e que cometeu um erro bobo no trabalho. Ela responde com provérbios."]
learn: []
culture: —
items:
  - [kotowaza, "ことわざ", "proverb, saying", "provérbio, ditado"]
  - [saru-mo, "猿[さる] も 木[き] から 落[お]ちる", "even monkeys fall from trees", "até macaco cai da árvore", {rare: true}]
  - [ishi-no-ue, "石[いし] の 上[うえ] に も 三年[さんねん]", "three years even on a stone", "três anos até em cima de uma pedra", {rare: true}]
  - [to-iu, "〜と いう", "called…, that says…", "que se chama…, que diz…"]
  - [imi, "意味[いみ]", "meaning", "significado"]
  - [dou-iu-imi, "どう いう 意味[いみ] です か", "what does it mean?", "o que significa?"]
  - [shippai, "失敗[しっぱい]", "mistake, failure", "erro, fracasso"]
  - [osoi, "遅[おそ]い", "slow; late", "lento; tarde"]
  - [gaman, "我慢[がまん]", "patience, enduring", "paciência, aguentar firme"]
  - [jouzu-na-hito, "上手[じょうず] な 人[ひと]", "a skilled person", "uma pessoa habilidosa"]
dialogue:
  - [protagonist, "日本語[にほんご] が 遅[おそ]い です。 それに 今日[きょう]、 仕事[しごと] で 失敗[しっぱい] しました。", "My Japanese is slow. And today I made a mistake at work.", "Meu japonês está lento. E hoje errei no trabalho."]
  - [suzuki, "「猿[さる] も 木[き] から 落[お]ちる」 と いう ことわざ が あります よ。", "There's a saying, “even monkeys fall from trees”.", "Tem um ditado: «até macaco cai da árvore»."]
  - [protagonist, "どう いう 意味[いみ] です か。", "What does it mean?", "O que significa?"]
  - [suzuki, "上手[じょうず] な 人[ひと] も 失敗[しっぱい] します、 と いう 意味[いみ] です。", "It means even skilled people make mistakes.", "Significa que até quem é bom erra."]
  - [protagonist, "いい ことわざ です ね。 日本語[にほんご] の ため の ことわざ も あります か。", "Nice saying. Is there one for learning Japanese?", "Que ditado bom. Tem um para quem aprende japonês?"]
  - [suzuki, "「石[いし] の 上[うえ] に も 三年[さんねん]」。 冷[つめ]たい 石[いし] も、 三年[さんねん] 座[すわ]る と 温[あたた]かく なります。", "“Three years even on a stone.” Sit on a cold stone three years and it gets warm.", "«Três anos até em cima de uma pedra.» Sente três anos numa pedra fria e ela esquenta."]
  - [protagonist, "我慢[がまん] です ね。", "So: patience.", "Ou seja: paciência."]
  - [suzuki, "そう。 ブラジル に も ことわざ が あります か。", "Yes. Does Brazil have sayings too?", "Isso. O Brasil também tem ditados?"]
teach:
  - ask: ["Say: a proverb.", "Diga: um provérbio.", "ことわざ", kotowaza]
  - ask: ["Say: a mistake.", "Diga: um erro.", "失敗[しっぱい]", shippai]
  - ask: ["Say: it's slow.", "Diga: está lento.", "遅[おそ]い です。", osoi]
  - ask: ["Say: meaning.", "Diga: significado.", "意味[いみ]", imi]
  - ask: ["Ask: what does it mean?", "Pergunte: o que significa?", "どう いう 意味[いみ] です か。", dou-iu-imi]
  - note: ["«と いう» names or quotes: «猿[さる] も 木[き] から 落[お]ちる と いう ことわざ» — a saying called “even monkeys fall from trees”. «〜 と いう 意味[いみ] です» — it means that…", "«と いう» dá nome ou cita: «猿[さる] も 木[き] から 落[お]ちる と いう ことわざ» — um ditado que diz «até macaco cai da árvore». «〜 と いう 意味[いみ] です» — significa que…"]
  - ask: ["Say the pattern: called, that says.", "Diga o padrão: que se chama, que diz.", "〜と いう", to-iu]
  - ask: ["Say the saying: even monkeys fall from trees.", "Diga o ditado: até macaco cai da árvore.", "猿[さる] も 木[き] から 落[お]ちる。", saru-mo]
  - ask: ["Say: a skilled person.", "Diga: uma pessoa habilidosa.", "上手[じょうず] な 人[ひと]", jouzu-na-hito]
  - ask: ["Say the other one: three years even on a stone.", "Diga o outro: três anos até em cima de uma pedra.", "石[いし] の 上[うえ] に も 三年[さんねん]。", ishi-no-ue]
  - ask: ["Say: patience.", "Diga: paciência.", "我慢[がまん]", gaman]
  - note: ["Older people love «ことわざ», and quoting one back is a small compliment. «我慢[がまん]», enduring without complaint, is a value you will hear a lot.", "Os mais velhos adoram «ことわざ», e citar um de volta é um pequeno elogio. «我慢[がまん]», aguentar sem reclamar, é um valor que você vai ouvir muito."]
  - pt_only: "Em português o parecido é «quem nunca errou que atire a primeira pedra», e para a paciência, «água mole em pedra dura, tanto bate até que fura» — pedra nos dois!"
