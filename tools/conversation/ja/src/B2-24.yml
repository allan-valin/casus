id: B2-24
protagonist: m
title: ["The ageing society", "A sociedade que envelhece"]
situation: ["Lunch with Kenta. His grandmother needs care, his town's school is closing, and the factory can't find young workers.", "Almoço com o Kenta. A avó dele precisa de cuidados, a escola da cidade dele vai fechar, e a fábrica não acha trabalhadores jovens."]
learn: []
culture: The ageing society — a social problem
items:
  - [shoushi-koureika, "少子[しょうし] 高齢化[こうれいか]", "fewer children, more elderly", "menos crianças, mais idosos", {rare: true}]
  - [kaigo, "介護[かいご]", "care (for the elderly)", "cuidado (de idosos)"]
  - [ni-tsurete, "〜に つれて", "as (one thing changes, another does)", "à medida que"]
  - [toshi-wo-toru-ni-tsurete, "年[とし] を 取[と]る に つれて", "as (one) gets older", "à medida que envelhece"]
  - [jinkou, "人口[じんこう]", "population", "população"]
  - [heru, "減[へ]る", "decrease", "diminuir"]
  - [fueru, "増[ふ]える", "increase", "aumentar"]
  - [haikou, "廃校[はいこう]", "school closure", "fechamento de escola", {rare: true}]
  - [shussei-ritsu, "出生率[しゅっしょうりつ]", "birth rate", "taxa de natalidade", {rare: true}]
  - [kaigo-shisetsu, "介護[かいご] 施設[しせつ]", "care home", "casa de repouso"]
dialogue:
  - [kenta, "祖母[そぼ] が 介護[かいご] が 必要[ひつよう] に なって、 母[はは] が 大変[たいへん] な ん だ。", "My grandmother needs care now, and it's hard on my mother.", "Minha avó passou a precisar de cuidados, e está pesado para minha mãe."]
  - [protagonist, "介護[かいご] 施設[しせつ] は？", "What about a care home?", "E uma casa de repouso?"]
  - [kenta, "空[あ]き が ない。 介護[かいご] の 仕事[しごと] も 人手[ひとで] 不足[ぶそく] で。", "No places. The care jobs are short-staffed too.", "Não tem vaga. O trabalho de cuidador também está com falta de gente."]
  - [protagonist, "日本[にほん] は 少子[しょうし] 高齢化[こうれいか] が 進[すす]んで いる ね。", "Japan's population is ageing and having fewer children.", "O Japão está com menos crianças e mais idosos."]
  - [kenta, "うん。 僕[ぼく] の 町[まち] の 小学校[しょうがっこう] も 来年[らいねん] 廃校[はいこう]。 子供[こども] が 減[へ]る に つれて、 学校[がっこう] も 減[へ]る。", "Yeah. My town's primary school closes next year too. As children decrease, schools do too.", "É. A escola primária da minha cidade fecha ano que vem. À medida que as crianças diminuem, as escolas também."]
  - [protagonist, "工場[こうじょう] で は 外国人[がいこくじん] が 増[ふ]えて いる けど。", "At the factory, though, foreigners are increasing.", "Mas na fábrica os estrangeiros estão aumentando."]
  - [kenta, "移民[いみん] を どう する か、 日本[にほん] は まだ 決[き]めて いない ん だ よ。", "Japan still hasn't decided what to do about immigration.", "O Japão ainda não decidiu o que fazer com a imigração."]
  - [protagonist, "人口[じんこう] の 問題[もんだい] は 難[むずか]しい ね。 お祖母[ばあ]さん、 お大事[だいじ] に。", "Population is a hard problem. Take care of your grandmother.", "A questão da população é difícil. Melhoras para a sua avó."]
teach:
  - ask: ["Say: care for the elderly.", "Diga: cuidado de idosos.", "介護[かいご]", kaigo]
  - ask: ["Say: a care home.", "Diga: uma casa de repouso.", "介護[かいご] 施設[しせつ]", kaigo-shisetsu]
  - ask: ["Say: fewer children, more elderly.", "Diga: menos crianças, mais idosos.", "少子[しょうし] 高齢化[こうれいか]", shoushi-koureika]
  - ask: ["Say: population.", "Diga: população.", "人口[じんこう]", jinkou]
  - ask: ["Say: to decrease.", "Diga: diminuir.", "減[へ]る", heru]
  - ask: ["Say: to increase.", "Diga: aumentar.", "増[ふ]える", fueru]
  - note: ["«〜に つれて» is as — one change follows another: «子供[こども] が 減[へ]る に つれて、 学校[がっこう] も 減[へ]る», as children decrease, so do schools. «年[とし] を 取[と]る に つれて», as one gets older.", "«〜に つれて» é à medida que — uma mudança acompanha a outra: «子供[こども] が 減[へ]る に つれて、 学校[がっこう] も 減[へ]る», à medida que as crianças diminuem, as escolas também. «年[とし] を 取[と]る に つれて», à medida que se envelhece."]
  - ask: ["Say the pattern: as (one changes, so does the other).", "Diga o padrão: à medida que.", "〜に つれて", ni-tsurete]
  - ask: ["Say: as one gets older.", "Diga: à medida que se envelhece.", "年[とし] を 取[と]る に つれて", toshi-wo-toru-ni-tsurete]
  - ask: ["Say: school closure.", "Diga: fechamento de escola.", "廃校[はいこう]", haikou]
  - ask: ["Say: the birth rate.", "Diga: a taxa de natalidade.", "出生率[しゅっしょうりつ]", shussei-ritsu]
  - note: ["Japan's population has been shrinking since around 2010; births are at record lows, and almost three in ten people are over 65. Rural schools close, care homes lack staff, and foreign workers fill more jobs — while immigration policy remains a debate.", "A população do Japão vem encolhendo desde mais ou menos 2010; os nascimentos estão no menor nível da história, e quase três em cada dez pessoas têm mais de 65 anos. Escolas do interior fecham, casas de repouso não têm funcionários, e trabalhadores estrangeiros ocupam mais vagas — enquanto a política de imigração continua em debate."]
  - pt_only: "O Brasil também está envelhecendo, só que mais devagar. O Japão mostra o que vem pela frente: menos crianças, mais idosos e a pergunta de quem vai cuidar deles."
