id: C2-21
protagonist: f
title: ["A friend in crisis", "Um amigo em crise"]
situation: ["Lucas's snack shop is losing money, and he's talking about closing it and going back to Brazil. You sit with him after closing time.", "A lanchonete do Lucas está dando prejuízo, e ele fala em fechar e voltar para o Brasil. Você senta com ele depois que a loja fecha."]
learn: []
culture: —
items:
  - [sasae, "支[ささ]え", "support (emotional)", "apoio"]
  - [soba-ni-iru, "そば に いる よ", "I'm here for you", "estou aqui com você"]
  - [daijoubu-casual, "大丈夫[だいじょうぶ]？", "are you okay?", "você está bem?"]
  - [muri-ni, "無理[むり] に 話[はな]さなくて いい", "you don't have to talk", "não precisa falar"]
  - [tsurakatta-ne, "つらかった ね", "that must have been hard", "deve ter sido difícil"]
  - [ganbatta, "よく 頑張[がんば]った", "you did really well", "você se esforçou muito"]
  - [akaji, "赤字[あかじ]", "in the red, a loss", "no vermelho, prejuízo"]
  - [hitori-de-kakaenaide, "一人[ひとり] で 抱[かか]えないで", "don't carry it alone", "não carregue isso sozinho"]
  - [itsu-demo, "いつ でも", "any time", "quando precisar"]
  - [kimochi-wa-wakaru, "気持[きも]ち は わかる", "I understand how you feel", "entendo o que você sente"]
dialogue:
  - [lucas, "三[さん] か月[げつ] 赤字[あかじ] な ん だ。 もう 店[みせ] を 閉[し]めて、 ブラジル に 帰[かえ]ろう か な。", "Three months in the red. Maybe I'll close the shop and go back to Brazil.", "Três meses no vermelho. Acho que vou fechar a loja e voltar para o Brasil."]
  - [protagonist, "そう だった ん だ… つらかった ね。", "So that's how it is… That must have been hard.", "Então era isso… Deve ter sido difícil."]
  - [lucas, "みんな に 応援[おうえん] して もらった のに、 情[なさ]けない。", "Everyone supported me, and I feel pathetic.", "Todo mundo me apoiou, e eu me sinto um fracasso."]
  - [protagonist, "情[なさ]けなく ない よ。 よく 頑張[がんば]った。 無理[むり] に 話[はな]さなくて いい から、 そば に いる よ。", "You're not pathetic. You did really well. You don't have to talk; I'm here.", "Não é fracasso. Você se esforçou muito. Não precisa falar; estou aqui com você."]
  - [lucas, "…ありがとう。 誰[だれ] に も 言[い]えなかった。", "…Thank you. I couldn't tell anyone.", "…Obrigado. Não consegui contar para ninguém."]
  - [protagonist, "一人[ひとり] で 抱[かか]えないで。 健太[けんた] くん も マリア さん も、 支[ささ]え に なりたい と 思[おも]って いる。", "Don't carry it alone. Kenta and Maria want to support you too.", "Não carregue isso sozinho. O Kenta e a Maria também querem te apoiar."]
  - [lucas, "店[みせ] を 続[つづ]ける 方法[ほうほう]、 一緒[いっしょ] に 考[かんが]えて くれる？", "Will you help me think of a way to keep the shop going?", "Você me ajuda a pensar num jeito de manter a loja?"]
  - [protagonist, "もちろん。 いつ でも 呼[よ]んで。", "Of course. Call me any time.", "Claro. Me chama quando precisar."]
teach:
  - ask: ["Ask gently: are you okay?", "Pergunte com cuidado: você está bem?", "大丈夫[だいじょうぶ]？", daijoubu-casual]
  - ask: ["Say: in the red, a loss.", "Diga: prejuízo.", "赤字[あかじ]", akaji]
  - ask: ["Say: that must have been hard.", "Diga: deve ter sido difícil.", "つらかった ね。", tsurakatta-ne]
  - ask: ["Say: you did really well.", "Diga: você se esforçou muito.", "よく 頑張[がんば]った。", ganbatta]
  - ask: ["Say: you don't have to talk.", "Diga: não precisa falar.", "無理[むり] に 話[はな]さなくて いい", muri-ni]
  - ask: ["Say: I'm here for you.", "Diga: estou aqui com você.", "そば に いる よ。", soba-ni-iru]
  - ask: ["Say: don't carry it alone.", "Diga: não carregue sozinho.", "一人[ひとり] で 抱[かか]えないで。", hitori-de-kakaenaide]
  - ask: ["Say: support.", "Diga: apoio.", "支[ささ]え", sasae]
  - ask: ["Say: I understand how you feel.", "Diga: entendo o que você sente.", "気持[きも]ち は わかる", kimochi-wa-wakaru]
  - ask: ["Say: any time.", "Diga: quando precisar.", "いつ でも", itsu-demo]
  - note: ["Comfort in Japanese leans on presence more than advice: «つらかった ね» acknowledges the pain, «よく 頑張[がんば]った» honours the effort — not «頑張[がんば]って», which can pressure someone who is already worn out — and «そば に いる よ» offers company. Silence is allowed.", "O consolo em japonês se apoia mais na presença que no conselho: «つらかった ね» reconhece a dor, «よく 頑張[がんば]った» honra o esforço — e não «頑張[がんば]って», que pode pressionar quem já está esgotado — e «そば に いる よ» oferece companhia. O silêncio é permitido."]
  - pt_only: "O brasileiro tende a dar força com «vai dar tudo certo!». Em japonês, às vezes ajuda mais dizer «foi difícil, né» e só ficar junto."
