id: C1-08
protagonist: m
title: ["The car and the shaken", "O carro e o shaken"]
situation: ["Your second-hand car's inspection is due. At the garage, the estimate is far more than you expected. Kenta came along to help.", "A inspeção do seu carro usado está vencendo. Na oficina, o orçamento é bem maior do que você esperava. O Kenta veio junto para ajudar."]
learn: []
culture: The expensive inspection
items:
  - [shaken, "車検[しゃけん]", "vehicle inspection", "inspeção veicular", {rare: true}]
  - [chuukosha, "中古車[ちゅうこしゃ]", "second-hand car", "carro usado"]
  - [soukou-kyori, "走行[そうこう] 距離[きょり]", "mileage", "quilometragem", {rare: true}]
  - [tenken, "点検[てんけん]", "check, inspection", "revisão"]
  - [zaru-wo-enai, "〜ざる を 得[え]ない", "have no choice but to", "não ter outra saída senão"]
  - [kaezaru-wo-enai, "替[か]えざる を 得[え]ない", "have no choice but to replace", "não ter outra saída senão trocar"]
  - [mitsumori-review, "見積[みつ]もり", "estimate", "orçamento"]
  - [buhin, "部品[ぶひん]", "part (machine)", "peça"]
  - [kyouseihoken, "自賠責[じばいせき] 保険[ほけん]", "compulsory car insurance", "seguro obrigatório", {rare: true}]
  - [kaikae, "買[か]い替[か]え", "replacing (by buying new)", "trocar por outro"]
dialogue:
  - [madoguchi, "車検[しゃけん] の 見積[みつ]もり です。 ブレーキ の 部品[ぶひん] を 替[か]えざる を 得[え]ません。", "Here's the inspection estimate. We have no choice but to replace the brake parts.", "Este é o orçamento da inspeção. Não tem jeito, precisamos trocar as peças do freio."]
  - [protagonist, "え、 こんな に 高[たか]い ん です か。", "What, it's this expensive?", "Nossa, tudo isso?"]
  - [madoguchi, "走行[そうこう] 距離[きょり] が 十万[じゅうまん] キロ を 超[こ]えて います から。 自賠責[じばいせき] 保険[ほけん] と 税金[ぜいきん] も 入[はい]って います。", "The mileage is over 100,000 km. Compulsory insurance and tax are included too.", "A quilometragem passou dos 100 mil km. O seguro obrigatório e os impostos também estão incluídos."]
  - [kenta, "中古車[ちゅうこしゃ] は 車検[しゃけん] が 高[たか]く なる ん だ よ。", "Inspections get expensive with second-hand cars.", "Carro usado tem inspeção cara."]
  - [protagonist, "買[か]い替[か]えた ほう が いい か な。", "Should I just replace it with another car?", "Será que é melhor trocar de carro?"]
  - [kenta, "でも 今月[こんげつ] 車検[しゃけん] が 切[き]れる なら、 受[う]けざる を 得[え]ない よ。 切[き]れたら 運転[うんてん] できない。", "But if the inspection runs out this month, you have no choice but to do it. If it lapses, you can't drive.", "Mas se a inspeção vence este mês, não tem saída. Vencida, não pode dirigir."]
  - [protagonist, "仕方[しかた] ない。 点検[てんけん] を お願[ねが]い します。 ブレーキ は 安全[あんぜん] の ため だ から。", "No choice. Please do the inspection. The brakes are for safety, after all.", "Fazer o quê. Pode fazer a revisão. Freio é segurança."]
  - [madoguchi, "かしこまりました。 二年後[にねんご] に また お待[ま]ち して います。", "Certainly. We'll see you again in two years.", "Pois não. Esperamos o senhor de novo daqui a dois anos."]
teach:
  - ask: ["Say: the vehicle inspection.", "Diga: a inspeção veicular.", "車検[しゃけん]", shaken]
  - ask: ["Say: a second-hand car.", "Diga: um carro usado.", "中古車[ちゅうこしゃ]", chuukosha]
  - ask: ["Say: mileage.", "Diga: quilometragem.", "走行[そうこう] 距離[きょり]", soukou-kyori]
  - ask: ["Say: an estimate.", "Diga: um orçamento.", "見積[みつ]もり", mitsumori-review]
  - ask: ["Say: a machine part.", "Diga: uma peça.", "部品[ぶひん]", buhin]
  - ask: ["Say: compulsory car insurance.", "Diga: seguro obrigatório.", "自賠責[じばいせき] 保険[ほけん]", kyouseihoken]
  - note: ["«〜ざる を 得[え]ない» is have no choice but to — written-style and serious: the «ない» stem plus «ざる を 得[え]ない». «替[か]える» → «替[か]えざる を 得[え]ない», have no choice but to replace; «する» → «せざる を 得[え]ない».", "«〜ざる を 得[え]ない» é não ter outra saída senão — estilo escrito, sério: o radical do «ない» mais «ざる を 得[え]ない». «替[か]える» → «替[か]えざる を 得[え]ない», não ter saída senão trocar; «する» → «せざる を 得[え]ない»."]
  - ask: ["Say the pattern: have no choice but to.", "Diga o padrão: não ter outra saída senão.", "〜ざる を 得[え]ない", zaru-wo-enai]
  - ask: ["Say: have no choice but to replace.", "Diga: não ter saída senão trocar.", "替[か]えざる を 得[え]ない", kaezaru-wo-enai]
  - ask: ["Say: a check, a service.", "Diga: uma revisão.", "点検[てんけん]", tenken]
  - ask: ["Say: replacing the car with another.", "Diga: trocar de carro.", "買[か]い替[か]え", kaikae]
  - note: ["«車検[しゃけん]» is required every two years (three for a new car the first time) and includes repairs, compulsory insurance and taxes, so it can cost a lot — one reason many Japanese sell older cars rather than keep them. Driving with an expired inspection is a serious offence.", "O «車検[しゃけん]» é obrigatório a cada dois anos (três na primeira vez, para carro novo) e inclui consertos, seguro obrigatório e impostos, então pode sair caro — um dos motivos por que muitos japoneses vendem carros mais velhos em vez de ficar com eles. Dirigir com a inspeção vencida é infração grave."]
  - pt_only: "No Brasil há o licenciamento anual e, em alguns estados, a vistoria. O shaken japonês é bem mais rigoroso — por isso o mercado de usados japoneses é cheio de carros novinhos."
