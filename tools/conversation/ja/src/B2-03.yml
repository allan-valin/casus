id: B2-03
protagonist: f
title: ["DNA", "DNA"]
situation: ["Aya's genetics class sent her home with a family-tree exercise. She asks about yours: a Japanese grandmother, a Portuguese grandfather.", "A aula de genética da Aya mandou um exercício de árvore genealógica. Ela pergunta da sua: avó japonesa, avô português."]
learn: []
culture: —
items:
  - [idenshi, "遺伝子[いでんし]", "gene", "gene"]
  - [iden, "遺伝[いでん]", "heredity", "hereditariedade"]
  - [ni-taishite, "〜に 対[たい]して", "towards, in contrast to", "em relação a, ao contrário de"]
  - [hahakata, "母方[ははかた]", "mother's side", "lado da mãe", {rare: true}]
  - [chichikata, "父方[ちちかた]", "father's side", "lado do pai", {rare: true}]
  - [hada-no-iro, "肌[はだ] の 色[いろ]", "skin colour", "cor da pele"]
  - [me-no-iro, "目[め] の 色[いろ]", "eye colour", "cor dos olhos"]
  - [konketsu, "混血[こんけつ]", "mixed heritage (dated word)", "mestiço (palavra antiga)", {rare: true}]
  - [haafu, "ハーフ", "mixed-heritage (everyday word)", "filho de pais de origens diferentes"]
  - [kakeizu, "家系図[かけいず]", "family tree", "árvore genealógica", {rare: true}]
  - [senzo, "先祖[せんぞ]", "ancestors", "antepassados"]
dialogue:
  - [aya, "家系図[かけいず] の 宿題[しゅくだい] なんだ。 先祖[せんぞ] は どこ の 人[ひと]？", "It's family-tree homework. Where are your ancestors from?", "É lição de árvore genealógica. De onde são seus antepassados?"]
  - [protagonist, "母方[ははかた] の 祖母[そぼ] は 日本人[にほんじん]。 父方[ちちかた] の 祖父[そふ] は ポルトガル 人[じん]。", "My grandmother on my mother's side is Japanese. My grandfather on my father's side is Portuguese.", "Minha avó por parte de mãe é japonesa. Meu avô por parte de pai é português."]
  - [aya, "だから 目[め] の 色[いろ] が ちょっと 明[あか]るい ん だ！ 遺伝[いでん] って 面白[おもしろ]い。", "So that's why your eyes are a bit lighter! Heredity is fascinating.", "Por isso seus olhos são mais claros! Hereditariedade é fascinante."]
  - [protagonist, "ブラジル で は いろいろ な 遺伝子[いでんし] が 混[ま]ざって いる よ。", "In Brazil all sorts of genes are mixed.", "No Brasil tem todo tipo de gene misturado."]
  - [aya, "日本[にほん] で は「ハーフ」 って 言[い]う けど、 今[いま] は「ミックス」 と 言[い]う 人[ひと] も いる。", "In Japan people say “hāfu”, but some now say “mikkusu”.", "No Japão se diz «hāfu», mas hoje tem gente que diz «mikkusu»."]
  - [protagonist, "半分[はんぶん] じゃ なくて、 両方[りょうほう] だ から ね。", "Because you're not half — you're both.", "Porque não é metade — é os dois."]
  - [aya, "うん。 昔[むかし] の「混血[こんけつ]」 は 今[いま] は あまり 使[つか]わない。", "Yeah. The old word “konketsu” isn't used much now.", "É. A palavra antiga «konketsu» quase não se usa mais."]
  - [protagonist, "日本人[にほんじん] に 対[たい]して、 ブラジル 人[じん] は 見[み]た目[め] が 本当[ほんとう] に いろいろ。", "Compared with Japanese people, Brazilians look really varied.", "Ao contrário dos japoneses, os brasileiros têm aparências bem variadas."]
teach:
  - ask: ["Say: a gene.", "Diga: um gene.", "遺伝子[いでんし]", idenshi]
  - ask: ["Say: heredity.", "Diga: hereditariedade.", "遺伝[いでん]", iden]
  - ask: ["Say: a family tree.", "Diga: árvore genealógica.", "家系図[かけいず]", kakeizu]
  - ask: ["Say: ancestors.", "Diga: antepassados.", "先祖[せんぞ]", senzo]
  - ask: ["Say: on my mother's side.", "Diga: por parte de mãe.", "母方[ははかた]", hahakata]
  - ask: ["Say: on my father's side.", "Diga: por parte de pai.", "父方[ちちかた]", chichikata]
  - ask: ["Say: eye colour.", "Diga: cor dos olhos.", "目[め] の 色[いろ]", me-no-iro]
  - ask: ["Say: skin colour.", "Diga: cor da pele.", "肌[はだ] の 色[いろ]", hada-no-iro]
  - note: ["«〜に 対[たい]して» has two uses: towards someone («先生[せんせい] に 対[たい]して 失礼[しつれい]», rude to the teacher) and in contrast to («日本人[にほんじん] に 対[たい]して、 ブラジル 人[じん] は…», unlike Japanese people, Brazilians…).", "«〜に 対[たい]して» tem dois usos: em relação a alguém («先生[せんせい] に 対[たい]して 失礼[しつれい]», falta de respeito com o professor) e em contraste com («日本人[にほんじん] に 対[たい]して、 ブラジル 人[じん] は…», ao contrário dos japoneses, os brasileiros…)."]
  - ask: ["Say the pattern: towards, in contrast to.", "Diga o padrão: em relação a, ao contrário de.", "〜に 対[たい]して", ni-taishite]
  - ask: ["Say the everyday word for mixed heritage.", "Diga a palavra comum para filho de origens diferentes.", "ハーフ", haafu]
  - ask: ["Say the old word, now avoided.", "Diga a palavra antiga, hoje evitada.", "混血[こんけつ]", konketsu]
  - note: ["People with one Japanese parent are commonly called «ハーフ», from «half»; some prefer «ミックス» or «ダブル» — both, not half. The older «混血[こんけつ]», mixed blood, is avoided now. Words change as Japan becomes more diverse.", "Pessoas com um pai ou mãe japonês costumam ser chamadas de «ハーフ», do inglês half; algumas preferem «ミックス» ou «ダブル» — os dois, não metade. O antigo «混血[こんけつ]», sangue misturado, hoje se evita. As palavras mudam conforme o Japão fica mais diverso."]
  - pt_only: "O Brasil é misturado desde sempre, e a gente nem pensa nisso. No Japão a mistura ainda chama atenção — e as palavras para falar dela estão mudando agora."
