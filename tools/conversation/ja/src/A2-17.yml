id: A2-17
protagonist: f
title: [The onsen, O onsen]
situation: ["Mrs Suzuki takes you to a hot spring. At the entrance, a sign about tattoos — and you have a small one on your ankle.", "A senhora Suzuki leva você a uma fonte termal. Na entrada, uma placa sobre tatuagens — e você tem uma pequena no tornozelo."]
learn: [n2-107]
culture: Tattoos, stickers and private baths
items:
  - [onsen, "温泉[おんせん]", "hot spring", "fonte termal", {rare: true}]
  - [irezumi, "入[い]れ墨[ずみ]", "tattoo", "tatuagem", {rare: true}]
  - [taoru, "タオル", "towel", "toalha"]
  - [karada-wo-araimasu, "体[からだ] を 洗[あら]います", "wash (your) body", "lavo o corpo"]
  - [haitte-wa-ikemasen, "入[はい]って は いけません", "you must not go in", "não pode entrar"]
  - [te-wa-ikemasen, "〜ては いけません", "must not", "não pode"]
  - [mizugi, "水着[みずぎ]", "swimsuit", "maiô, roupa de banho", {rare: true}]
  - [shiiru, "シール", "sticker", "adesivo", {rare: true}]
  - [kakushimasu, "隠[かく]します", "cover, hide", "cubro, escondo"]
  - [kashikiri, "貸切[かしきり] 風呂[ぶろ]", "private bath", "ofurô privativo", {rare: true}]
  - [kimochi-ii, "気持[きも]ち いい", "it feels good", "que delícia, que gostoso"]
dialogue:
  - [suzuki, "ここ は 入[い]れ墨[ずみ] の 人[ひと] は 入[はい]って は いけません、 と 書[か]いて あります ね。", "It says here people with tattoos must not go in.", "Aqui diz que gente com tatuagem não pode entrar."]
  - [protagonist, "足[あし] に 小[ちい]さい の が あります… だめ です か。", "I have a small one on my foot… Is that no good?", "Eu tenho uma pequena no pé… Não pode?"]
  - [suzuki, "聞[き]いて みましょう。 すみません、 小[ちい]さい 入[い]れ墨[ずみ] は？", "Let's ask. Excuse me, what about a small tattoo?", "Vamos perguntar. Com licença, e uma tatuagem pequena?"]
  - [madoguchi, "この シール で 隠[かく]して ください。 それなら 大丈夫[だいじょうぶ] です。", "Please cover it with this sticker. Then it's fine.", "Cubra com este adesivo, por favor. Assim pode."]
  - [suzuki, "入[はい]る 前[まえ] に 体[からだ] を 洗[あら]います よ。 水着[みずぎ] は 着[き]ては いけません。", "You wash your body before going in. No swimsuits.", "Antes de entrar, lave o corpo. Roupa de banho não pode."]
  - [protagonist, "タオル は？", "And the towel?", "E a toalha?"]
  - [suzuki, "お湯[ゆ] に 入[い]れて は いけません。 頭[あたま] の 上[うえ] に。", "It mustn't go in the water. On your head.", "Não pode pôr na água. Em cima da cabeça."]
  - [protagonist, "ああ、 気持[きも]ち いい！", "Ah, that feels good!", "Ah, que delícia!"]
teach:
  - ask: ["Say: a hot spring.", "Diga: uma fonte termal.", "温泉[おんせん]", onsen]
  - ask: ["Say: a tattoo.", "Diga: uma tatuagem.", "入[い]れ墨[ずみ]", irezumi]
  - note: ["Must not: the «て» form plus «は いけません»: «入[はい]って は いけません» — you must not go in. It's the opposite of «〜て も いい です», you may.", "Não pode: a forma «て» mais «は いけません»: «入[はい]って は いけません» — não pode entrar. É o contrário de «〜て も いい です», pode."]
  - ask: ["Say the pattern: must not.", "Diga o padrão: não pode.", "〜ては いけません", te-wa-ikemasen]
  - build: [haitte-wa-ikemasen, ["いけません", "入[はい]って は いけません"]]
  - ask: ["Read the sign: you must not go in.", "Leia a placa: não pode entrar.", "入[はい]って は いけません。", haitte-wa-ikemasen]
  - ask: ["Say: a sticker.", "Diga: um adesivo.", "シール", shiiru]
  - ask: ["Say: I'll cover it.", "Diga: vou cobrir.", "隠[かく]します。", kakushimasu]
  - ask: ["Say: I wash my body.", "Diga: lavo o corpo.", "体[からだ] を 洗[あら]います。", karada-wo-araimasu]
  - ask: ["Say: a swimsuit.", "Diga: roupa de banho.", "水着[みずぎ]", mizugi]
  - ask: ["Say: a towel.", "Diga: uma toalha.", "タオル", taoru]
  - ask: ["Say: a private bath.", "Diga: um ofurô privativo.", "貸切[かしきり] 風呂[ぶろ]", kashikiri]
  - ask: ["Sink into the water and say: that feels good!", "Entre na água e diga: que delícia!", "気持[きも]ち いい！", kimochi-ii]
  - note: ["Many onsen still refuse tattoos, an old link to the yakuza. But since 2016 the Tourism Agency has said a tattoo alone should not be the reason to turn someone away, and more places accept them: many let a small one in under a skin-coloured sticker. A «貸切[かしきり] 風呂[ぶろ]», a private bath, or a room with its own open-air bath avoids the question. Always ask the place.", "Muitos onsen ainda recusam tatuagem, um velho vínculo com a yakuza. Mas desde 2016 a Agência de Turismo diz que só a tatuagem não deveria ser motivo para barrar alguém, e mais lugares aceitam: muitos deixam entrar uma pequena coberta com um adesivo cor da pele. Um «貸切[かしきり] 風呂[ぶろ]», ofurô privativo, ou um quarto com banheira ao ar livre própria evitam a questão. Sempre pergunte ao lugar."]
  - pt_only: "No Brasil tatuagem não fecha porta nenhuma, e na piscina se usa maiô. No onsen é o contrário: sem roupa nenhuma, separado por sexo, e a tatuagem é que pode ser o problema."
