id: C1-23
protagonist: f
title: ["Bilingualism", "Bilinguismo"]
situation: ["Maria's son Davi answers her Portuguese in Japanese. At the bakery she asks your advice — Portuguese at home, Japanese outside?", "O filho da Maria, o Davi, responde em japonês quando ela fala português. Na padaria ela pede o seu conselho — português em casa, japonês fora?"]
learn: []
culture: Nikkei children between languages
items:
  - [bairingaru, "バイリンガル", "bilingual", "bilíngue"]
  - [ie-dewa, "家[いえ] で は", "at home", "em casa"]
  - [gakkou-dewa, "学校[がっこう] で は", "at school", "na escola"]
  - [ni-totte, "〜に とって", "for (someone), from (their) point of view", "para (alguém)"]
  - [kodomo-ni-totte, "子供[こども] に とって", "for a child", "para uma criança"]
  - [bogo, "母語[ぼご]", "mother tongue", "língua materna"]
  - [keishou-go, "継承[けいしょう] 語[ご]", "heritage language", "língua de herança", {rare: true}]
  - [hanbun-zutsu, "半分[はんぶん] ずつ", "half and half", "metade cada um"]
  - [hazukashigaru, "恥[は]ずかしがる", "be embarrassed (about it)", "ter vergonha (disso)"]
  - [aidentiti, "アイデンティティ", "identity", "identidade"]
dialogue:
  - [maria, "ダビ は 家[いえ] で も 日本語[にほんご] で 返事[へんじ] する の。 ポルトガル語[ご] を 忘[わす]れ そう。", "Davi answers in Japanese even at home. He's going to forget Portuguese.", "O Davi responde em japonês até em casa. Ele vai acabar esquecendo o português."]
  - [protagonist, "学校[がっこう] で は 一日中[いちにちじゅう] 日本語[にほんご] だ から ね。", "Well, at school it's Japanese all day.", "Na escola é japonês o dia inteiro, né?"]
  - [maria, "友達[ともだち] の 前[まえ] で ポルトガル語[ご] を 話[はな]す の を 恥[は]ずかしがる の よ。", "He's embarrassed to speak Portuguese in front of his friends.", "Ele tem vergonha de falar português na frente dos amigos."]
  - [protagonist, "子供[こども] に とって、 みんな と 同[おな]じ で ある こと は 大事[だいじ] な ん だ と 思[おも]う。", "For a child, being the same as everyone matters a lot, I think.", "Para uma criança, ser igual a todo mundo é muito importante, eu acho."]
  - [maria, "でも 祖父母[そふぼ] と 話[はな]せなく なる の は 悲[かな]しい。", "But it's sad if he can't talk to his grandparents.", "Mas é triste ele não conseguir mais falar com os avós."]
  - [protagonist, "家[いえ] で は ポルトガル語[ご]、 外[そと] で は 日本語[にほんご]。 ルール を 決[き]めたら？ ポルトガル語[ご] の 絵本[えほん] も いい よ。", "Portuguese at home, Japanese outside — why not set that rule? Portuguese picture books help too.", "Em casa português, fora japonês — que tal fazer essa regra? Livro infantil em português também ajuda."]
  - [maria, "そう ね。 二[ふた]つ の 言葉[ことば] は、 あの 子[こ] の アイデンティティ だ から。", "Yes. The two languages are part of who he is.", "É. As duas línguas são a identidade dele."]
  - [protagonist, "バイリンガル は 宝物[たからもの] だ よ。", "Being bilingual is a treasure.", "Ser bilíngue é um tesouro."]
teach:
  - ask: ["Say: bilingual.", "Diga: bilíngue.", "バイリンガル", bairingaru]
  - ask: ["Say: at home.", "Diga: em casa.", "家[いえ] で は", ie-dewa]
  - ask: ["Say: at school.", "Diga: na escola.", "学校[がっこう] で は", gakkou-dewa]
  - ask: ["Say: mother tongue.", "Diga: língua materna.", "母語[ぼご]", bogo]
  - ask: ["Say: heritage language.", "Diga: língua de herança.", "継承[けいしょう] 語[ご]", keishou-go]
  - note: ["«〜に とって» is for — from someone's point of view: «子供[こども] に とって、 同[おな]じ で ある こと は 大事[だいじ]», for a child, being the same matters. It frames how something is for a person, not an action done for them (that's «〜の ため に»).", "«〜に とって» é para — do ponto de vista de alguém: «子供[こども] に とって、 同[おな]じ で ある こと は 大事[だいじ]», para uma criança, ser igual importa. Mostra como algo é para a pessoa, não uma ação feita para ela (isso é «〜の ため に»)."]
  - ask: ["Say the pattern: for, from their point of view.", "Diga o padrão: para (do ponto de vista).", "〜に とって", ni-totte]
  - ask: ["Say: for a child.", "Diga: para uma criança.", "子供[こども] に とって", kodomo-ni-totte]
  - ask: ["Say: be embarrassed about it.", "Diga: ter vergonha disso.", "恥[は]ずかしがる", hazukashigaru]
  - ask: ["Say: half and half.", "Diga: metade cada um.", "半分[はんぶん] ずつ", hanbun-zutsu]
  - ask: ["Say: identity.", "Diga: identidade.", "アイデンティティ", aidentiti]
  - note: ["Many Brazilian children in Japan lose Portuguese as Japanese school takes over, and some end up fluent in neither. Families who keep a «heritage language» usually set rules — one language at home — and use books, songs, video calls with grandparents and weekend Portuguese classes.", "Muitas crianças brasileiras no Japão perdem o português quando a escola japonesa toma conta, e algumas acabam sem dominar bem nenhuma das duas. Famílias que mantêm a «língua de herança» geralmente criam regras — uma língua em casa — e usam livros, músicas, videochamadas com os avós e aulas de português no fim de semana."]
  - pt_only: "Hamamatsu tem escolas brasileiras e aulas de português para crianças. Um dia, o filho da Maria vai agradecer pela regra de casa."
