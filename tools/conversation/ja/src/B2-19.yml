id: B2-19
protagonist: f
title: ["The presentation", "A apresentação"]
situation: ["Your Portuguese safety-sign project goes to the managers' meeting. You present it, then take questions.", "Seu projeto de placas de segurança em português vai para a reunião dos gerentes. Você apresenta e depois responde às perguntas."]
learn: [n3-011]
culture: —
items:
  - [happyou, "発表[はっぴょう]", "presentation", "apresentação"]
  - [shiryou, "資料[しりょう]", "handout, materials", "material, apostila"]
  - [shitsugi-outou, "質疑[しつぎ] 応答[おうとう]", "Q&A", "perguntas e respostas", {rare: true}]
  - [ketsuron, "結論[けつろん]", "conclusion", "conclusão"]
  - [te-kara, "〜て から", "after (doing)", "depois de (fazer)"]
  - [setsumei-shite-kara, "説明[せつめい] して から", "after explaining", "depois de explicar"]
  - [mokuteki, "目的[もくてき]", "purpose", "objetivo"]
  - [hiyou, "費用[ひよう]", "cost", "custo"]
  - [kouka, "効果[こうか]", "effect, result", "efeito, resultado"]
  - [goshitsumon, "ご質問[しつもん]", "your questions (polite)", "suas perguntas (educado)"]
  - [ijou-desu, "以上[いじょう] です", "that's all (end of presentation)", "é isso (fim da apresentação)"]
dialogue:
  - [protagonist, "それでは、 発表[はっぴょう] を 始[はじ]めます。 まず 目的[もくてき] を 説明[せつめい] して から、 費用[ひよう] と 効果[こうか] を お話[はな]し します。", "Let me begin. First I'll explain the purpose, and after that the cost and effect.", "Vou começar a apresentação. Primeiro explico o objetivo, depois falo do custo e do resultado."]
  - [protagonist, "資料[しりょう] の 二[に] ページ を ご覧[らん] ください。 工場[こうじょう] の 三割[さんわり] は ブラジル 人[じん] です。", "Please look at page two of the handout. Thirty percent of the factory staff are Brazilian.", "Vejam a página dois do material. Trinta por cento da fábrica são brasileiros."]
  - [protagonist, "結論[けつろん] と して、 ポルトガル語[ご] の 標識[ひょうしき] で ヒヤリ ハット を 減[へ]らせる と 考[かんが]えます。 以上[いじょう] です。", "In conclusion, I believe Portuguese signs can reduce near misses. That's all.", "Concluindo, acredito que as placas em português podem reduzir os quase acidentes. É isso."]
  - [buchou, "ありがとう。 では、 質疑[しつぎ] 応答[おうとう] に 移[うつ]ります。", "Thank you. Let's move to questions.", "Obrigado. Vamos às perguntas."]
  - [sato, "費用[ひよう] は どの くらい です か。", "How much will it cost?", "Quanto vai custar?"]
  - [protagonist, "資料[しりょう] の 四[よん] ページ に あります が、 約[やく] 三十万円[さんじゅうまんえん] です。", "It's on page four of the handout — about 300,000 yen.", "Está na página quatro do material — cerca de 300 mil ienes."]
  - [buchou, "効果[こうか] は どう やって 確認[かくにん] します か。", "How will you confirm the effect?", "Como vai confirmar o resultado?"]
  - [protagonist, "設置[せっち] して から 三[さん] か月[げつ]、 ヒヤリ ハット の 数[かず] を 比[くら]べます。 ほか に ご質問[しつもん] は ございます か。", "For three months after installing them, we'll compare the number of near misses. Are there any other questions?", "Três meses depois de instalar, comparamos o número de quase acidentes. Mais alguma pergunta?"]
teach:
  - ask: ["Say: a presentation.", "Diga: uma apresentação.", "発表[はっぴょう]", happyou]
  - ask: ["Say: the handout.", "Diga: o material.", "資料[しりょう]", shiryou]
  - ask: ["Say: the purpose.", "Diga: o objetivo.", "目的[もくてき]", mokuteki]
  - ask: ["Say: cost.", "Diga: custo.", "費用[ひよう]", hiyou]
  - ask: ["Say: effect, result.", "Diga: resultado.", "効果[こうか]", kouka]
  - note: ["«〜て から» is after — one step finished, then the next: «目的[もくてき] を 説明[せつめい] して から、 費用[ひよう] を 話[はな]します», after explaining the purpose, I'll talk about cost. Good for structuring a talk.", "«〜て から» é depois de — um passo terminado, depois o próximo: «目的[もくてき] を 説明[せつめい] して から、 費用[ひよう] を 話[はな]します», depois de explicar o objetivo, falo do custo. Bom para estruturar uma apresentação."]
  - ask: ["Say the pattern: after doing.", "Diga o padrão: depois de fazer.", "〜て から", te-kara]
  - ask: ["Say: after explaining.", "Diga: depois de explicar.", "説明[せつめい] して から", setsumei-shite-kara]
  - ask: ["Say: the conclusion.", "Diga: a conclusão.", "結論[けつろん]", ketsuron]
  - ask: ["End your talk: that's all.", "Termine a apresentação: é isso.", "以上[いじょう] です。", ijou-desu]
  - ask: ["Say: Q&A.", "Diga: perguntas e respostas.", "質疑[しつぎ] 応答[おうとう]", shitsugi-outou]
  - ask: ["Ask the room: any questions? — politely.", "Pergunte à sala: alguma pergunta? — com educação.", "ご質問[しつもん] は ございます か。", goshitsumon]
  - note: ["A Japanese presentation has a fixed frame: «それでは、 発表[はっぴょう] を 始[はじ]めます», the structure in one sentence, the handout pages, «結論[けつろん] と して», and «以上[いじょう] です» to end. Numbers in the handout matter more than slides; because of the «根回[ねまわ]し», the questions rarely surprise.", "Uma apresentação japonesa tem moldura fixa: «それでは、 発表[はっぴょう] を 始[はじ]めます», a estrutura numa frase, as páginas do material, «結論[けつろん] と して» e «以上[いじょう] です» para terminar. Os números no material contam mais que os slides; por causa do «根回[ねまわ]し», as perguntas raramente surpreendem."]
  - pt_only: "«以上[いじょう] です» não tem tradução exata: é o «é isso, obrigado» que avisa que você terminou. Sem ele, a sala fica esperando."
