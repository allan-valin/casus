id: A1-23
protagonist: f
title: [Plain talk is fine, "Pode falar normal"]
situation: ["Saturday afternoon on the stairs of your building. Kenta has known you for months now and offers to drop the polite form.", "Sábado à tarde, na escada do prédio. O Kenta já conhece você há meses e propõe deixar a forma educada de lado."]
learn: [n5-024]
culture: When plain form is fine
items:
  - [tameguchi, "タメ口[ぐち]", "plain, casual talk (between equals)", "fala informal, de igual para igual"]
  - [ii-yo, "いい よ", "it's fine, sure (casual)", "tudo bem, pode (informal)"]
  - [un, "うん", "yeah (casual yes)", "é, aham (sim informal)"]
  - [uun, "ううん", "nah (casual no)", "não, nada (não informal)"]
  - [iku, "行[い]く", "go (plain form)", "ir, vou (forma simples)"]
  - [taberu, "食[た]べる", "eat (plain form)", "comer, como (forma simples)"]
  - [miru, "見[み]る", "see, watch (plain form)", "ver, vejo (forma simples)"]
  - [nani-suru, "何[なに] する", "what are you doing? (plain)", "o que você vai fazer? (informal)"]
  - [issho-ni, "一緒[いっしょ] に", "together", "junto"]
  - [hima, "暇[ひま]", "free (not busy)", "livre, à toa"]
  - [kenta-kun, "健太[けんた] くん", "Kenta (friendly, for a young man)", "Kenta (tratamento amigável para rapaz)"]
dialogue:
  - [kenta, "あの… もう タメ口[ぐち] で いい よ。", "Um… plain talk is fine now.", "Olha… pode falar normal comigo agora."]
  - [protagonist, "タメ口[ぐち]？ 本当[ほんとう] に いい です か。", "Plain talk? Is that really okay?", "Falar normal? Pode mesmo?"]
  - [kenta, "うん、 いい よ。 同[おな]じ 年[とし] ぐらい だし。", "Yeah, sure. We're about the same age.", "Aham, pode. A gente tem quase a mesma idade."]
  - [protagonist, "じゃあ… 健太[けんた] くん、 今日[きょう] 何[なに] する？", "Then… Kenta, what are you doing today?", "Então… Kenta, o que você vai fazer hoje?"]
  - [kenta, "暇[ひま] だ よ。 映画[えいが] 見[み]る？", "I'm free. Want to see a film?", "Estou à toa. Vamos ver um filme?"]
  - [protagonist, "うん、 見[み]る！ その 後[あと]、 一緒[いっしょ] に 食[た]べる？", "Yeah, let's! After that, eat together?", "Vamos! Depois, a gente come junto?"]
  - [kenta, "いい ね。 駅[えき] の 前[まえ] に 行[い]く？", "Nice. Shall we go to the front of the station?", "Boa. Vamos para a frente da estação?"]
  - [protagonist, "うん。 あ、 でも 課長[かちょう] に は タメ口[ぐち] は だめ だ よ ね。", "Yeah. Oh, but with the section chief, no plain talk, right?", "Vamos. Ah, mas com a chefe não pode falar assim, né?"]
  - [kenta, "うん、 絶対[ぜったい] だめ。", "Right, absolutely not.", "É, de jeito nenhum."]
teach:
  - note: ["Until now you used «です» and «ます» with everyone: the polite form. Among friends of the same age, Japanese drops it. That is «タメ口[ぐち]» — talk between equals. The other person offers it; you don't start it.", "Até agora você usou «です» e «ます» com todo mundo: a forma educada. Entre amigos da mesma idade, o japonês deixa isso de lado. Isso é «タメ口[ぐち]» — fala de igual para igual. É o outro que oferece; não é você que começa."]
  - ask: ["Say: plain talk.", "Diga: fala informal.", "タメ口[ぐち]", tameguchi]
  - ask: ["He asks if it's okay. Say: sure, it's fine — casually.", "Ele pergunta se tudo bem. Diga: pode, tudo bem — informal.", "いい よ。", ii-yo]
  - ask: ["Say yes, casually.", "Diga sim, informal.", "うん。", un]
  - ask: ["Say no, casually.", "Diga não, informal.", "ううん。", uun]
  - note: ["The plain form of a verb is the one in the dictionary: «行[い]きます» → «行[い]く», «食[た]べます» → «食[た]べる», «見[み]ます» → «見[み]る». With a rising voice it becomes a question: «見[み]る？» — want to watch?", "A forma simples do verbo é a do dicionário: «行[い]きます» → «行[い]く», «食[た]べます» → «食[た]べる», «見[み]ます» → «見[み]る». Com a voz subindo vira pergunta: «見[み]る？» — quer ver?"]
  - ask: ["Say: go — plain form.", "Diga: ir — forma simples.", "行[い]く", iku]
  - ask: ["Say: eat — plain form.", "Diga: comer — forma simples.", "食[た]べる", taberu]
  - ask: ["Ask him if he wants to watch, plain.", "Pergunte se ele quer ver, informal.", "見[み]る？", miru]
  - build: [nani-suru, ["する", "何[なに] する"]]
  - ask: ["Ask him what he's doing today, plain.", "Pergunte o que ele vai fazer hoje, informal.", "今日[きょう] 何[なに] する？", nani-suru]
  - ask: ["Say: I'm free.", "Diga: estou à toa.", "暇[ひま] だ よ。", hima]
  - ask: ["Ask: eat together?", "Pergunte: a gente come junto?", "一緒[いっしょ] に 食[た]べる？", issho-ni]
  - ask: ["Call him by name, the friendly way.", "Chame-o pelo nome, do jeito amigável.", "健太[けんた] くん", kenta-kun]
  - note: ["Plain form is for friends, younger people and family — never for the chief, customers or the landlady. «くん» after a young man's name is friendly; «さん» is always safe.", "A forma simples é para amigos, gente mais nova e família — nunca para a chefe, clientes ou a dona do apartamento. «くん» depois do nome de um rapaz é amigável; «さん» é sempre seguro."]
  - pt_only: "Em português o «você» serve para quase todo mundo, e a gente passa para o informal sem pedir licença. No Japão a mudança é combinada, e quem é mais velho ou mais alto na hierarquia é quem propõe."
