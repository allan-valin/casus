id: C1-02
protagonist: m
title: ["The taiko group", "O grupo de taikô"]
situation: ["The taiko group's first performance at the summer festival. It rained all afternoon; the crowd stayed anyway. Afterwards, Ōno-sensei and Kenta.", "A primeira apresentação do grupo de taikô no festival de verão. Choveu a tarde toda; o público ficou mesmo assim. Depois, a professora Ōno e o Kenta."]
learn: [n2-078]
culture: —
items:
  - [honban, "本番[ほんばん]", "the real performance", "a apresentação de verdade"]
  - [ishou, "衣装[いしょう]", "costume", "figurino"]
  - [hakushu, "拍手[はくしゅ]", "applause", "aplauso"]
  - [nimo-kakawarazu, "〜にも かかわらず", "despite, in spite of", "apesar de"]
  - [ame-nimo-kakawarazu, "雨[あめ] にも かかわらず", "despite the rain", "apesar da chuva"]
  - [kankyaku, "観客[かんきゃく]", "audience", "público, plateia"]
  - [machigaeta, "間違[まちが]えた", "made a mistake (plain)", "errei (simples)"]
  - [kimochi-ga-hitotsu, "気持[きも]ち が 一[ひと]つ に なる", "hearts beat as one", "ficar todos em sintonia"]
  - [seikou, "成功[せいこう]", "success", "sucesso"]
  - [uchiage, "打[う]ち上[あ]げ", "after-party", "comemoração depois do evento", {rare: true}]
dialogue:
  - [taiko-sensei, "皆[みな]さん、 雨[あめ] にも かかわらず、 最後[さいご] まで 素晴[すば]らしかった！", "Everyone, despite the rain, you were wonderful to the end!", "Pessoal, apesar da chuva, vocês foram maravilhosos até o fim!"]
  - [protagonist, "本番[ほんばん] は 緊張[きんちょう] しました。 一回[いっかい] 間違[まちが]えた し。", "I was nervous on the day. And I made a mistake once.", "Fiquei nervoso na apresentação. E errei uma vez."]
  - [kenta, "誰[だれ] も 気[き] が つかなかった よ。 拍手[はくしゅ]、 すごかった じゃん。", "Nobody noticed. The applause was huge, wasn't it.", "Ninguém percebeu. O aplauso foi enorme, né?"]
  - [protagonist, "観客[かんきゃく] が 雨[あめ] の 中[なか] で 待[ま]って いて くれた。 感動[かんどう] した。", "The audience waited in the rain for us. I was moved.", "O público esperou na chuva por nós. Fiquei emocionado."]
  - [taiko-sensei, "練習[れんしゅう] が 少[すく]なかった にも かかわらず、 みんな の 気持[きも]ち が 一[ひと]つ に なりました ね。", "Even though we practised little, everyone's hearts beat as one.", "Apesar de termos treinado pouco, todos ficaram em sintonia."]
  - [kenta, "衣装[いしょう] も 濡[ぬ]れた けど、 大[だい] 成功[せいこう]！", "The costumes got wet too, but it was a big success!", "O figurino molhou também, mas foi um sucesso!"]
  - [taiko-sensei, "では、 打[う]ち上[あ]げ に 行[い]きましょう！", "Now, let's go to the after-party!", "Agora, vamos comemorar!"]
  - [protagonist, "はい！ 次[つぎ] の 本番[ほんばん] が もう 楽[たの]しみ です。", "Yes! I'm already looking forward to the next performance.", "Vamos! Já estou ansioso pela próxima apresentação."]
teach:
  - ask: ["Say: the real performance.", "Diga: a apresentação de verdade.", "本番[ほんばん]", honban]
  - ask: ["Say: costume.", "Diga: figurino.", "衣装[いしょう]", ishou]
  - ask: ["Say: the audience.", "Diga: o público.", "観客[かんきゃく]", kankyaku]
  - ask: ["Say: applause.", "Diga: aplauso.", "拍手[はくしゅ]", hakushu]
  - note: ["«〜にも かかわらず» is despite — more formal than «のに», common in writing and speeches: «雨[あめ] にも かかわらず», despite the rain; with a verb, «練習[れんしゅう] が 少[すく]なかった にも かかわらず», even though practice was short.", "«〜にも かかわらず» é apesar de — mais formal que «のに», comum em textos e discursos: «雨[あめ] にも かかわらず», apesar da chuva; com verbo, «練習[れんしゅう] が 少[すく]なかった にも かかわらず», apesar de termos treinado pouco."]
  - ask: ["Say the pattern: despite.", "Diga o padrão: apesar de.", "〜にも かかわらず", nimo-kakawarazu]
  - ask: ["Say: despite the rain.", "Diga: apesar da chuva.", "雨[あめ] にも かかわらず", ame-nimo-kakawarazu]
  - ask: ["Admit it, plainly: I made a mistake.", "Admita, informal: errei.", "間違[まちが]えた。", machigaeta]
  - ask: ["Say: hearts beat as one.", "Diga: ficar todos em sintonia.", "気持[きも]ち が 一[ひと]つ に なる", kimochi-ga-hitotsu]
  - ask: ["Say: success.", "Diga: sucesso.", "成功[せいこう]", seikou]
  - ask: ["Say: the after-party.", "Diga: a comemoração depois.", "打[う]ち上[あ]げ", uchiage]
  - note: ["After a performance, project or event comes the «打[う]ち上[あ]げ» — named after fireworks being launched — where the group thanks each other. Mistakes in a group performance are shrugged off; what's praised is the group sounding as one.", "Depois de uma apresentação, projeto ou evento vem o «打[う]ち上[あ]げ» — o nome vem do lançamento de fogos — em que o grupo agradece uns aos outros. Errar numa apresentação em grupo não pesa; o elogio vai para o grupo soar como um só."]
  - pt_only: "É o «chopp depois do ensaio» elevado a ritual: ninguém vai embora sem o 打ち上げ — e quem errou é o primeiro a ser abraçado."
