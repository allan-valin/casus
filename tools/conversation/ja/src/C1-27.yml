id: C1-27
protagonist: f
title: ["Mental health", "Saúde mental"]
situation: ["Aya, now working in Tokyo, calls late at night. She can't sleep, can't eat, cries before work. You listen, and help her find someone to talk to.", "A Aya, agora trabalhando em Tóquio, liga tarde da noite. Não consegue dormir, nem comer, chora antes do trabalho. Você ouve e a ajuda a achar alguém com quem conversar."]
learn: []
culture: Stigma lifting
items:
  - [moetsuki, "燃[も]え尽[つ]き", "burnout", "esgotamento, burnout", {rare: true}]
  - [utsu, "うつ", "depression", "depressão"]
  - [kaunseringu, "カウンセリング", "counselling", "terapia, aconselhamento"]
  - [osore-ga-aru, "〜おそれ が ある", "there is a risk that", "há o risco de"]
  - [byouki-ni-naru-osore, "病気[びょうき] に なる おそれ が ある", "there's a risk of getting ill", "há o risco de adoecer"]
  - [nemurenai, "眠[ねむ]れない", "can't sleep", "não consigo dormir"]
  - [muri-shinaide, "無理[むり] しないで", "don't push yourself", "não se force"]
  - [kyuushoku, "休職[きゅうしょく]", "leave of absence (sick)", "afastamento do trabalho", {rare: true}]
  - [shinryou-naika, "心療[しんりょう] 内科[ないか]", "psychosomatic clinic", "clínica de saúde mental", {rare: true}]
  - [hitori-ja-nai, "一人[ひとり] じゃ ない", "you're not alone", "você não está sozinha"]
dialogue:
  - [aya, "最近[さいきん]、 眠[ねむ]れない の。 朝[あさ]、 会社[かいしゃ] に 行[い]く 前[まえ] に 涙[なみだ] が 出[で]る。", "Lately I can't sleep. In the morning I cry before going to work.", "Ultimamente não consigo dormir. De manhã, antes de ir trabalhar, as lágrimas saem."]
  - [protagonist, "話[はな]して くれて ありがとう。 一人[ひとり] じゃ ない よ。", "Thank you for telling me. You're not alone.", "Obrigada por me contar. Você não está sozinha."]
  - [aya, "でも 休[やす]んだら、 みんな に 迷惑[めいわく] が かかる。", "But if I take time off, it'll be a burden on everyone.", "Mas se eu tirar folga, vou atrapalhar todo mundo."]
  - [protagonist, "無理[むり] しないで。 この まま だ と、 本当[ほんとう] に 病気[びょうき] に なる おそれ が ある。", "Don't push yourself. If this goes on, there's a real risk you'll get ill.", "Não se force. Se continuar assim, há o risco de você adoecer de verdade."]
  - [aya, "燃[も]え尽[つ]き かな。 うつ かも しれない。", "Maybe it's burnout. It might be depression.", "Talvez seja burnout. Pode ser depressão."]
  - [protagonist, "心療[しんりょう] 内科[ないか] で 相談[そうだん] して みよう。 会社[かいしゃ] の カウンセリング も ある はず だ よ。", "Let's try talking to a psychosomatic clinic. Your company should have counselling too.", "Vamos tentar conversar com uma clínica de saúde mental. A empresa deve ter atendimento psicológico também."]
  - [aya, "休職[きゅうしょく] って、 できる の か な。", "I wonder if I can take a leave of absence.", "Será que dá para me afastar do trabalho?"]
  - [protagonist, "医者[いしゃ] の 診断書[しんだんしょ] が あれば できる。 まず は 明日[あした]、 一緒[いっしょ] に 予約[よやく] しよう。", "With a doctor's certificate you can. First, let's book an appointment together tomorrow.", "Com atestado médico, dá. Primeiro, amanhã a gente marca uma consulta juntas."]
teach:
  - ask: ["Say: I can't sleep.", "Diga: não consigo dormir.", "眠[ねむ]れない。", nemurenai]
  - ask: ["Tell her: you're not alone.", "Diga a ela: você não está sozinha.", "一人[ひとり] じゃ ない よ。", hitori-ja-nai]
  - ask: ["Say: don't push yourself.", "Diga: não se force.", "無理[むり] しないで。", muri-shinaide]
  - ask: ["Say: burnout.", "Diga: burnout.", "燃[も]え尽[つ]き", moetsuki]
  - ask: ["Say: depression.", "Diga: depressão.", "うつ", utsu]
  - note: ["«〜おそれ が ある» is there is a risk that — a formal warning of something bad: «病気[びょうき] に なる おそれ が ある», there's a risk of getting ill; weather news: «大雨[おおあめ] の おそれ», risk of heavy rain.", "«〜おそれ が ある» é há o risco de — um aviso formal de algo ruim: «病気[びょうき] に なる おそれ が ある», há o risco de adoecer; na previsão do tempo: «大雨[おおあめ] の おそれ», risco de chuva forte."]
  - ask: ["Say the pattern: there is a risk that.", "Diga o padrão: há o risco de.", "〜おそれ が ある", osore-ga-aru]
  - ask: ["Say: there's a risk of getting ill.", "Diga: há o risco de adoecer.", "病気[びょうき] に なる おそれ が ある", byouki-ni-naru-osore]
  - ask: ["Say: counselling.", "Diga: terapia.", "カウンセリング", kaunseringu]
  - ask: ["Say: a psychosomatic clinic.", "Diga: clínica de saúde mental.", "心療[しんりょう] 内科[ないか]", shinryou-naika]
  - ask: ["Say: a sick leave of absence.", "Diga: afastamento do trabalho.", "休職[きゅうしょく]", kyuushoku]
  - note: ["Mental illness carried a strong stigma in Japan, and many still hesitate to seek help, but it is lifting: «心療[しんりょう] 内科[ないか]» clinics are common, companies must offer stress checks, and sick leave with a doctor's certificate is a right. Japan's government runs a national mental-health phone line, «こころ の 健康[けんこう] 相談[そうだん] 統一[とういつ] ダイヤル» — look up the current number on the Ministry of Health's site.", "A doença mental carregava um estigma forte no Japão, e muitos ainda hesitam em pedir ajuda, mas isso está mudando: clínicas «心療[しんりょう] 内科[ないか]» são comuns, as empresas precisam oferecer avaliação de estresse, e o afastamento com atestado médico é um direito. O governo japonês mantém uma linha nacional de saúde mental, «こころ の 健康[けんこう] 相談[そうだん] 統一[とういつ] ダイヤル» — confira o número atual no site do Ministério da Saúde."]
  - pt_only: "No Brasil há o CVV, 188, para quem precisa conversar. No Japão também há linhas de apoio, em japonês e às vezes em português — pedir ajuda é coragem, não fraqueza."
