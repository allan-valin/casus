id: A1-03
protagonist: f
title: [The body, O corpo]
situation: ["Mrs Suzuki is in her vegetable garden, holding her knee.", "A senhora Suzuki está na horta, segurando o joelho."]
learn: [n5-004]
culture: —
items:
  - [daijoubu, "大丈夫[だいじょうぶ] です か", "are you all right?", "a senhora está bem?"]
  - [itai, "痛[いた]い", "painful, it hurts", "dói, dolorido"]
  - [hiza, "膝[ひざ]", "knee", "joelho"]
  - [atama, "頭[あたま]", "head", "cabeça"]
  - [te, "手[て]", "hand", "mão"]
  - [ashi, "足[あし]", "foot, leg", "pé, perna"]
  - [ga, "が", "(marks who or what does something)", "(marca quem ou o que faz algo)"]
  - [sukoshi, "少[すこ]し", "a little", "um pouco"]
  - [doko, "どこ", "where", "onde"]
  - [byouin, "病院[びょういん]", "hospital, clinic", "hospital, clínica"]
  - [iie, "いいえ", "no", "não"]
  - [tetsudaimashou-ka, "手伝[てつだ]いましょう か", "shall I help?", "posso ajudar?"]
dialogue:
  - [protagonist, "鈴木[すずき] さん、 大丈夫[だいじょうぶ] です か。", "Mrs Suzuki, are you all right?", "Senhora Suzuki, a senhora está bem?"]
  - [suzuki, "膝[ひざ] が 少[すこ]し 痛[いた]い です。", "My knee hurts a little.", "O joelho dói um pouco."]
  - [protagonist, "膝[ひざ]？ どこ です か。", "Your knee? Where?", "O joelho? Onde?"]
  - [suzuki, "ここ です。 年[とし] です ね。", "Here. It's my age.", "Aqui. É a idade."]
  - [protagonist, "病院[びょういん] は？", "And the clinic?", "E o médico?"]
  - [suzuki, "いいえ、 大丈夫[だいじょうぶ] です。", "No, I'm fine.", "Não, estou bem."]
  - [protagonist, "手伝[てつだ]いましょう か。", "Shall I help?", "Posso ajudar?"]
  - [suzuki, "ありがとう。 優[やさ]しい です ね。", "Thank you. You're kind.", "Obrigada. Você é gentil."]
teach:
  - note: ["To ask if someone is all right: «大丈夫[だいじょうぶ] です か». The same word answers: «大丈夫[だいじょうぶ] です» — I'm fine.", "Para perguntar se alguém está bem: «大丈夫[だいじょうぶ] です か». A mesma palavra responde: «大丈夫[だいじょうぶ] です» — estou bem."]
  - ask: ["Ask her if she is all right.", "Pergunte se ela está bem.", "大丈夫[だいじょうぶ] です か。", daijoubu]
  - note: ["«膝[ひざ] が 痛[いた]い です» — my knee hurts. The part of the body, then «が», then «痛[いた]い です».", "«膝[ひざ] が 痛[いた]い です» — o joelho dói. A parte do corpo, depois «が», depois «痛[いた]い です»."]
  - line: [suzuki, hiza]
  - ask: ["Say your knee hurts.", "Diga que o joelho dói.", "膝[ひざ] が 痛[いた]い です。", hiza, ga, itai]
  - ask: ["Your head hurts.", "A cabeça dói.", "頭[あたま] が 痛[いた]い です。", atama, ga, itai]
  - ask: ["Your hand hurts.", "A mão dói.", "手[て] が 痛[いた]い です。", te, ga, itai]
  - ask: ["Your foot hurts a little.", "O pé dói um pouco.", "足[あし] が 少[すこ]し 痛[いた]い です。", ashi, sukoshi, itai]
  - ask: ["Ask where it hurts — 'where is it?'", "Pergunte onde dói — 'onde é?'", "どこ です か。", doko]
  - ask: ["Suggest the clinic, as a short question.", "Sugira o médico, numa pergunta curta.", "病院[びょういん] は？", byouin]
  - ask: ["She says no, she's fine. How?", "Ela diz que não, está bem. Como?", "いいえ、 大丈夫[だいじょうぶ] です。", iie, daijoubu]
  - ask: ["Offer to help.", "Ofereça ajuda.", "手伝[てつだ]いましょう か。", tetsudaimashou-ka]
