id: B2-29
protagonist: f
title: ["The proposal", "O pedido"]
situation: ["Under the cherry trees where you once had hanami, Shota takes out a ring. Afterwards: how to tell both families.", "Debaixo das cerejeiras onde vocês fizeram hanami, o Shota tira um anel. Depois: como contar para as duas famílias."]
learn: []
culture: —
items:
  - [puropoozu, "プロポーズ", "marriage proposal", "pedido de casamento"]
  - [yubiwa, "指輪[ゆびわ]", "ring", "anel"]
  - [yuinou, "結納[ゆいのう]", "formal betrothal gift exchange", "troca formal de presentes de noivado", {rare: true}]
  - [ryouke, "両家[りょうけ]", "both families", "as duas famílias", {rare: true}]
  - [te-hoshii, "〜て ほしい", "want (someone) to…", "quero que (alguém)…"]
  - [kekkon-shite-hoshii, "結婚[けっこん] して ほしい", "I want you to marry me", "quero que você case comigo"]
  - [kaoawase, "顔合[かおあ]わせ", "first meeting of both families", "primeiro encontro das famílias", {rare: true}]
  - [isshou, "一生[いっしょう]", "a whole lifetime", "a vida toda"]
  - [shiawase-ni-suru, "幸[しあわ]せ に する", "make (someone) happy", "fazer (alguém) feliz"]
  - [yorokonde, "喜[よろこ]んで", "gladly, with pleasure", "com muito prazer"]
dialogue:
  - [shota, "覚[おぼ]えて る？ 初[はじ]めて 一緒[いっしょ] に 花見[はなみ] を した 所[ところ]。", "Remember? The place where we first did hanami together.", "Lembra? O lugar onde a gente fez hanami juntos pela primeira vez."]
  - [protagonist, "もちろん。 …え、 指輪[ゆびわ]？", "Of course. …Wait, a ring?", "Claro. …Ué, um anel?"]
  - [shota, "一生[いっしょう] 幸[しあわ]せ に する。 結婚[けっこん] して ほしい。", "I'll make you happy for the rest of your life. I want you to marry me.", "Vou te fazer feliz a vida toda. Quero que você case comigo."]
  - [protagonist, "…はい、 喜[よろこ]んで！", "…Yes, gladly!", "…Sim, com muito prazer!"]
  - [shota, "よかった！ 次[つぎ] は 両家[りょうけ] の 顔合[かおあ]わせ だ ね。", "Wonderful! Next is the first meeting of both families.", "Que bom! O próximo passo é o encontro das duas famílias."]
  - [protagonist, "結納[ゆいのう] も する の？", "Do we do a yuinō too?", "A gente faz yuinō também?"]
  - [shota, "最近[さいきん] は 食事[しょくじ] 会[かい] だけ の 人[ひと] が 多[おお]い よ。 両親[りょうしん] に 来[き]て ほしい の は 日本[にほん]？ ブラジル？", "These days many just have a dinner. Where do you want your parents to come — Japan or Brazil?", "Hoje em dia muita gente faz só um jantar. Você quer que seus pais venham ao Japão, ou fazemos no Brasil?"]
  - [protagonist, "母[はは] に は 日本[にほん] に 来[き]て ほしい。 祖母[そぼ] の 国[くに] だ から。", "I want my mother to come to Japan. It's my grandmother's country.", "Quero que minha mãe venha ao Japão. É o país da minha avó."]
teach:
  - ask: ["Say: a marriage proposal.", "Diga: um pedido de casamento.", "プロポーズ", puropoozu]
  - ask: ["Say: a ring.", "Diga: um anel.", "指輪[ゆびわ]", yubiwa]
  - ask: ["Say: a whole lifetime.", "Diga: a vida toda.", "一生[いっしょう]", isshou]
  - ask: ["Promise: I'll make you happy.", "Prometa: vou te fazer feliz.", "幸[しあわ]せ に する。", shiawase-ni-suru]
  - note: ["«〜て ほしい» is wanting someone else to do something: «結婚[けっこん] して ほしい», I want you to marry me; «母[はは] に 来[き]て ほしい», I want my mother to come. The person takes «に». Compare «〜たい», which is what you yourself want to do.", "«〜て ほしい» é querer que outra pessoa faça algo: «結婚[けっこん] して ほしい», quero que você case comigo; «母[はは] に 来[き]て ほしい», quero que minha mãe venha. A pessoa leva «に». Compare com «〜たい», que é o que você mesmo quer fazer."]
  - ask: ["Say the pattern: want someone to…", "Diga o padrão: querer que alguém…", "〜て ほしい", te-hoshii]
  - ask: ["Say his words: I want you to marry me.", "Diga as palavras dele: quero que você case comigo.", "結婚[けっこん] して ほしい。", kekkon-shite-hoshii]
  - ask: ["Accept: yes, gladly.", "Aceite: sim, com muito prazer.", "はい、 喜[よろこ]んで！", yorokonde]
  - ask: ["Say: both families.", "Diga: as duas famílias.", "両家[りょうけ]", ryouke]
  - ask: ["Say: the first meeting of both families.", "Diga: o encontro das duas famílias.", "顔合[かおあ]わせ", kaoawase]
  - ask: ["Say: the formal betrothal exchange.", "Diga: a troca formal de noivado.", "結納[ゆいのう]", yuinou]
  - note: ["After a proposal, the families meet: traditionally with «結納[ゆいのう]», a formal exchange of gifts and money, but today most couples hold a simpler «顔合[かおあ]わせ» dinner. With an international couple, distance decides a lot — video calls often join in.", "Depois do pedido, as famílias se encontram: tradicionalmente com o «結納[ゆいのう]», uma troca formal de presentes e dinheiro, mas hoje a maioria dos casais faz um jantar mais simples, o «顔合[かおあ]わせ». Com casal internacional, a distância decide muito — videochamadas costumam entrar na roda."]
  - pt_only: "No Brasil o noivo às vezes pede a mão ao pai da noiva. No Japão quem se encontra são as duas famílias inteiras — e os pais costumam conversar entre si mais que os noivos."
