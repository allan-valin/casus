id: C2-26
protagonist: m
title: ["A poem", "Um poema"]
situation: ["The last evening class of the year: each student reads a haiku by Bashō (1644–1694) aloud and explains its season word.", "A última aula noturna do ano: cada aluno lê em voz alta um haicai de Bashō (1644–1694) e explica a palavra de estação."]
learn: []
culture: —
items:
  - [bashou, "芭蕉[ばしょう]", "Bashō (poet)", "Bashō (poeta)", {rare: true}]
  - [haiku, "俳句[はいく]", "haiku", "haicai"]
  - [kigo, "季語[きご]", "season word", "palavra de estação", {rare: true}]
  - [roudoku, "朗読[ろうどく]", "reading aloud", "leitura em voz alta"]
  - [furuike, "古池[ふるいけ] や", "an old pond —", "um velho tanque —", {rare: true}]
  - [kawazu, "蛙[かわず] 飛[と]び込[こ]む", "a frog jumps in", "um sapo pula", {rare: true}]
  - [mizu-no-oto, "水[みず] の 音[おと]", "the sound of water", "o som da água"]
  - [go-shichi-go, "五七五[ごしちご]", "five-seven-five", "cinco-sete-cinco"]
  - [kireji, "切[き]れ字[じ]", "cutting word (や, かな)", "palavra de corte (や, かな)", {rare: true}]
  - [shizukesa, "静[しず]けさ", "stillness", "quietude"]
dialogue:
  - [kouza-sensei, "では、 芭蕉[ばしょう] の 俳句[はいく] を 朗読[ろうどく] して ください。", "Now, please read a haiku by Bashō aloud.", "Agora, leia em voz alta um haicai de Bashō, por favor."]
  - [protagonist, "古池[ふるいけ] や、 蛙[かわず] 飛[と]び込[こ]む、 水[みず] の 音[おと]。", "An old pond — a frog jumps in — the sound of water.", "Um velho tanque — um sapo pula — o som da água."]
  - [kouza-sensei, "季語[きご] は どれ です か。", "Which is the season word?", "Qual é a palavra de estação?"]
  - [protagonist, "「蛙[かわず]」 です。 春[はる] の 季語[きご] です。", "“Frog”. It's a spring season word.", "«Sapo». É palavra de primavera."]
  - [kouza-sensei, "「や」 は 何[なん] の 役割[やくわり] です か。", "And what does “ya” do?", "E qual é a função do «ya»?"]
  - [protagonist, "切[き]れ字[じ] です。 そこ で 一度[いちど] 止[と]まって、 静[しず]けさ を 感[かん]じさせます。", "It's a cutting word. It stops you there for a moment and lets you feel the stillness.", "É uma palavra de corte. Faz uma pausa ali e deixa sentir a quietude."]
  - [kouza-sensei, "五七五[ごしちご] の 十七[じゅうしち] 音[おん] に、 世界[せかい] が 入[はい]って いる ん です。", "In seventeen sounds, five-seven-five, a whole world fits.", "Em dezessete sons, cinco-sete-cinco, cabe um mundo inteiro."]
  - [protagonist, "音[おと] が した 後[あと] の 静[しず]けさ が、 一番[いちばん] 心[こころ] に 残[のこ]ります。", "It's the stillness after the sound that stays with me most.", "É a quietude depois do som que mais fica no coração."]
teach:
  - ask: ["Say: haiku.", "Diga: haicai.", "俳句[はいく]", haiku]
  - ask: ["Say the poet's name: Bashō.", "Diga o nome do poeta: Bashō.", "芭蕉[ばしょう]", bashou]
  - ask: ["Say: reading aloud.", "Diga: leitura em voz alta.", "朗読[ろうどく]", roudoku]
  - ask: ["Say: the season word.", "Diga: a palavra de estação.", "季語[きご]", kigo]
  - ask: ["Say: five-seven-five.", "Diga: cinco-sete-cinco.", "五七五[ごしちご]", go-shichi-go]
  - ask: ["Say: the cutting word.", "Diga: a palavra de corte.", "切[き]れ字[じ]", kireji]
  - build: [furuike, ["や", "古池[ふるいけ] や"]]
  - ask: ["Recite the first line: an old pond —", "Recite o primeiro verso: um velho tanque —", "古池[ふるいけ] や", furuike]
  - ask: ["The second: a frog jumps in.", "O segundo: um sapo pula.", "蛙[かわず] 飛[と]び込[こ]む", kawazu]
  - ask: ["The third: the sound of water.", "O terceiro: o som da água.", "水[みず] の 音[おと]", mizu-no-oto]
  - ask: ["Say: stillness.", "Diga: quietude.", "静[しず]けさ", shizukesa]
  - note: ["A haiku has seventeen sounds in five-seven-five, a «季語[きご]» that places it in a season, and often a «切[き]れ字[じ]» like «や» that cuts the poem and leaves a pause. Bashō's frog poem (1686) is the most famous of all; it is centuries in the public domain. Read slowly, with a breath at the cut.", "Um haicai tem dezessete sons em cinco-sete-cinco, um «季語[きご]» que o situa numa estação e muitas vezes um «切[き]れ字[じ]» como «や», que corta o poema e deixa uma pausa. O haicai do sapo de Bashō (1686) é o mais famoso de todos; está em domínio público há séculos. Leia devagar, com uma respiração no corte."]
  - pt_only: "O Brasil tem tradição de haicai — Guilherme de Almeida, Paulo Leminski. Ler Bashō no original, depois de tudo, é fechar um círculo."
