id: B2-20
protagonist: m
title: ["The client", "O cliente"]
situation: ["A client, Ms Nakamura, calls: a shipment arrived with the wrong parts. She is angry. Chief Sato is out; you handle it.", "Uma cliente, a senhora Nakamura, liga: uma remessa chegou com as peças erradas. Ela está brava. A chefe Sato saiu; você atende."]
learn: []
culture: The customer is god
items:
  - [kureemu, "クレーム", "complaint", "reclamação"]
  - [taiou, "対応[たいおう]", "dealing with, response", "atendimento, providência"]
  - [owabi, "お詫[わ]び", "apology (formal)", "pedido de desculpas (formal)"]
  - [okyakusama, "お客様[きゃくさま]", "customer (honorific)", "cliente (honorífico)"]
  - [makoto-ni, "誠[まこと] に 申[もう]し訳[わけ] ございません", "I am truly, deeply sorry", "peço sinceras desculpas"]
  - [kakunin-itashimasu, "確認[かくにん] いたします", "I will check (humble)", "vou verificar (humilde)"]
  - [shikyuu, "至急[しきゅう]", "urgently", "com urgência"]
  - [okuri-naoshi, "お送[おく]り 直[なお]し", "resending", "reenvio"]
  - [ninotsuki, "ご迷惑[めいわく] を おかけ しました", "we caused you trouble", "causamos transtorno"]
  - [saihatsu-boushi, "再発[さいはつ] 防止[ぼうし]", "preventing a recurrence", "evitar que se repita", {rare: true}]
  - [okyakusama-wa-kamisama, "お客様[きゃくさま] は 神様[かみさま]", "the customer is god", "o cliente é deus"]
dialogue:
  - [kyaku, "注文[ちゅうもん] と 違[ちが]う 部品[ぶひん] が 届[とど]きました。 明日[あした] から 生産[せいさん] が 止[と]まります！", "Parts different from our order arrived. Our production stops tomorrow!", "Chegaram peças diferentes do pedido. Nossa produção para amanhã!"]
  - [protagonist, "大変[たいへん] ご迷惑[めいわく] を おかけ しました。 誠[まこと] に 申[もう]し訳[わけ] ございません。", "We've caused you great trouble. I am truly sorry.", "Causamos um grande transtorno. Peço sinceras desculpas."]
  - [kyaku, "どう して くれる ん です か。", "What are you going to do about it?", "E o que vocês vão fazer?"]
  - [protagonist, "ただいま 至急[しきゅう] 確認[かくにん] いたします。 注文[ちゅうもん] 番号[ばんごう] を お教[おし]え いただけます か。", "I will check urgently right now. Could you give me the order number?", "Vou verificar com urgência agora. A senhora poderia me passar o número do pedido?"]
  - [kyaku, "A の 三五二[さんごーに] です。", "A-352.", "A-352."]
  - [protagonist, "確認[かくにん] いたしました。 こちら の 間違[まちが]い です。 正[ただ]しい 部品[ぶひん] を 今日[きょう] 中[じゅう] に お送[おく]り 直[なお]し いたします。", "I've checked. It was our mistake. We will resend the correct parts today.", "Verifiquei. O erro foi nosso. Reenviamos as peças corretas ainda hoje."]
  - [kyaku, "今日[きょう] 中[じゅう] なら、 何[なん] とか なります。", "If it's today, we can manage.", "Se for hoje, a gente dá um jeito."]
  - [protagonist, "再発[さいはつ] 防止[ぼうし] の 対策[たいさく] も、 改[あらた]めて ご報告[ほうこく] いたします。 本当[ほんとう] に 申[もう]し訳[わけ] ございません でした。", "We'll also report the measures to prevent it happening again. Once more, I am truly sorry.", "Também vamos informar as medidas para que não se repita. Mais uma vez, peço sinceras desculpas."]
teach:
  - ask: ["Say: a complaint.", "Diga: uma reclamação.", "クレーム", kureemu]
  - ask: ["Say: the customer — with honour.", "Diga: o cliente — com respeito.", "お客様[きゃくさま]", okyakusama]
  - ask: ["Say: we caused you trouble.", "Diga: causamos transtorno.", "ご迷惑[めいわく] を おかけ しました。", ninotsuki]
  - ask: ["Apologise at the deepest level.", "Peça desculpas no nível mais profundo.", "誠[まこと] に 申[もう]し訳[わけ] ございません。", makoto-ni]
  - ask: ["Say: a formal apology.", "Diga: um pedido de desculpas formal.", "お詫[わ]び", owabi]
  - ask: ["Say humbly: I will check.", "Diga com humildade: vou verificar.", "確認[かくにん] いたします。", kakunin-itashimasu]
  - ask: ["Say: urgently.", "Diga: com urgência.", "至急[しきゅう]", shikyuu]
  - ask: ["Say: resending.", "Diga: reenvio.", "お送[おく]り 直[なお]し", okuri-naoshi]
  - ask: ["Say: dealing with it, the response.", "Diga: o atendimento, a providência.", "対応[たいおう]", taiou]
  - ask: ["Say: preventing a recurrence.", "Diga: evitar que se repita.", "再発[さいはつ] 防止[ぼうし]", saihatsu-boushi]
  - note: ["Complaint handling uses the highest politeness: «誠[まこと] に 申[もう]し訳[わけ] ございません», «ご迷惑[めいわく] を おかけ しました», humble «いたします» for everything you do. The order: apologise first, listen, check, admit, offer a fix with a time, promise «再発[さいはつ] 防止[ぼうし]», apologise again.", "O atendimento de reclamação usa a cortesia máxima: «誠[まこと] に 申[もう]し訳[わけ] ございません», «ご迷惑[めいわく] を おかけ しました», o humilde «いたします» para tudo o que você faz. A ordem: desculpar-se primeiro, ouvir, verificar, admitir, oferecer solução com prazo, prometer «再発[さいはつ] 防止[ぼうし]» e desculpar-se de novo."]
  - ask: ["Say the famous saying: the customer is god.", "Diga o ditado famoso: o cliente é deus.", "お客様[きゃくさま] は 神様[かみさま]", okyakusama-wa-kamisama]
  - note: ["«お客様[きゃくさま] は 神様[かみさま]» comes from a 1960s singer's stage line and became a slogan for service. Today there is pushback: abusive customers, «カスハラ», are recognised as a problem, and some places, Tokyo first, now have rules protecting staff.", "«お客様[きゃくさま] は 神様[かみさま]» vem de uma frase de palco de um cantor dos anos 1960 e virou lema do atendimento. Hoje há reação: clientes abusivos, a «カスハラ», são reconhecidos como problema, e alguns lugares, Tóquio primeiro, já têm regras protegendo os funcionários."]
  - pt_only: "No Brasil se diz «o cliente tem sempre razão». No Japão o cliente é deus — mas até deus, hoje, tem limite: a «カスハラ» virou tema de lei."
