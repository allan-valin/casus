id: A2-08
protagonist: m
title: [The summer festival, O festival de verão]
situation: ["A summer evening at the shrine. Mrs Suzuki has lent you a yukata; Kenta waits by the food stalls. Fireworks later.", "Uma noite de verão no santuário. A senhora Suzuki emprestou um yukata para você; o Kenta espera perto das barracas de comida. Fogos mais tarde."]
learn: []
culture: Summer festivals
items:
  - [natsumatsuri, "夏祭[なつまつ]り", "summer festival", "festival de verão", {rare: true}]
  - [yukata, "浴衣[ゆかた]", "yukata, summer kimono", "yukata, quimono de verão", {rare: true}]
  - [hanabi, "花火[はなび]", "fireworks", "fogos de artifício"]
  - [yatai, "屋台[やたい]", "food stall", "barraca de comida", {rare: true}]
  - [natsu, "夏[なつ]", "summer", "verão"]
  - [mitai, "見[み]たい です", "I want to see", "quero ver"]
  - [kitai, "着[き]たい です", "I want to wear", "quero vestir"]
  - [kimasu-wear, "着[き]ます", "wear, put on", "visto"]
  - [nigiyaka, "賑[にぎ]やか", "lively", "animado, movimentado"]
  - [kingyo-sukui, "金魚[きんぎょ] すくい", "goldfish scooping", "pescaria de peixinho dourado", {rare: true}]
  - [niaimasu, "似合[にあ]います ね", "it suits you", "fica bem em você"]
dialogue:
  - [suzuki, "浴衣[ゆかた]、 似合[にあ]います ね。", "The yukata suits you.", "O yukata fica bem em você."]
  - [protagonist, "ありがとう ございます。 初[はじ]めて 着[き]ました。", "Thank you. It's the first time I've worn one.", "Obrigado. É a primeira vez que visto um."]
  - [kenta, "おーい！ こっち、 屋台[やたい] が たくさん ある よ。", "Hey! Over here, lots of stalls.", "Ei! Aqui, tem um monte de barraca."]
  - [protagonist, "賑[にぎ]やか です ね。 あれ は 何[なん] です か。", "It's lively. What's that?", "Que movimento. O que é aquilo?"]
  - [kenta, "金魚[きんぎょ] すくい。 やりたい？", "Goldfish scooping. Want to try?", "Pescaria de peixinho dourado. Quer tentar?"]
  - [protagonist, "はい、 やりたい です！ それから 花火[はなび] も 見[み]たい です。", "Yes, I want to! And I want to see the fireworks too.", "Quero! E também quero ver os fogos."]
  - [suzuki, "花火[はなび] は 八時[はちじ] から です。 夏[なつ] は これ が 一番[いちばん] です よ。", "The fireworks start at eight. This is the best thing about summer.", "Os fogos começam às oito. Isso é o melhor do verão."]
  - [protagonist, "来年[らいねん] も 浴衣[ゆかた] を 着[き]たい です。", "I want to wear a yukata next year too.", "Ano que vem quero vestir yukata de novo."]
teach:
  - ask: ["Say: summer.", "Diga: verão.", "夏[なつ]", natsu]
  - ask: ["Say: the summer festival.", "Diga: o festival de verão.", "夏祭[なつまつ]り", natsumatsuri]
  - ask: ["Say: a yukata.", "Diga: um yukata.", "浴衣[ゆかた]", yukata]
  - ask: ["Say: I wear it.", "Diga: eu visto.", "着[き]ます。", kimasu-wear]
  - ask: ["Tell Kenta it suits him.", "Diga ao Kenta que fica bem nele.", "似合[にあ]います ね。", niaimasu]
  - ask: ["Say: a food stall.", "Diga: uma barraca de comida.", "屋台[やたい]", yatai]
  - ask: ["Say: it's lively.", "Diga: está animado.", "賑[にぎ]やか です ね。", nigiyaka]
  - ask: ["Say: goldfish scooping.", "Diga: pescaria de peixinho dourado.", "金魚[きんぎょ] すくい", kingyo-sukui]
  - note: ["Back to «〜たい です», I want to: «見[み]ます» → «見[み]たい です», «着[き]ます» → «着[き]たい です». The thing you want takes «が» or «を»: «花火[はなび] が 見[み]たい» or «花火[はなび] を 見[み]たい» — both are heard.", "De volta ao «〜たい です», quero: «見[み]ます» → «見[み]たい です», «着[き]ます» → «着[き]たい です». O que você quer leva «が» ou «を»: «花火[はなび] が 見[み]たい» ou «花火[はなび] を 見[み]たい» — as duas se ouvem."]
  - ask: ["Say: fireworks.", "Diga: fogos de artifício.", "花火[はなび]", hanabi]
  - ask: ["Say: I want to see the fireworks.", "Diga: quero ver os fogos.", "花火[はなび] を 見[み]たい です。", mitai]
  - ask: ["Say: I want to wear a yukata.", "Diga: quero vestir um yukata.", "浴衣[ゆかた] を 着[き]たい です。", kitai]
  - note: ["Summer festivals fill shrines and streets from July to August: stalls with grilled corn, shaved ice and goldfish scooping, «盆踊[ぼんおど]り» dances in a circle, and fireworks over rivers and lakes. A cotton «浴衣[ゆかた]» is the usual dress — left side over right.", "Os festivais de verão enchem santuários e ruas de julho a agosto: barracas de milho assado, raspadinha e pescaria de peixinho, a dança em roda «盆踊[ぼんおど]り» e fogos sobre rios e lagos. O «浴衣[ゆかた]» de algodão é a roupa de sempre — lado esquerdo por cima do direito."]
  - pt_only: "Lembra muito uma festa junina: barraquinha, comida de rua, brincadeira de pescaria, roupa típica. Só que no Japão é no calor de agosto, e termina com fogos."
