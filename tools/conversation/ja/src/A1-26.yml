id: A1-26
protagonist: m
title: [Karaoke, Karaokê]
situation: ["Friday after work. Kenta and two colleagues take you to a karaoke box: a small private room with a screen, a menu and a phone on the wall.", "Sexta depois do trabalho. O Kenta e dois colegas levam você a um karaokê de cabines: uma salinha só de vocês, com tela, cardápio e um telefone na parede."]
learn: []
culture: Karaoke boxes, and singing alone
items:
  - [karaoke, "カラオケ", "karaoke", "karaokê", {rare: true}]
  - [utaimasu, "歌[うた]います", "sing", "canto"]
  - [uta, "歌[うた]", "song", "música, canção"]
  - [kanpai, "乾杯[かんぱい]", "cheers!", "saúde! (no brinde)"]
  - [ikimasen-ka, "行[い]きません か", "won't you come? shall we go?", "não quer ir? vamos?"]
  - [utaimasen-ka, "歌[うた]いません か", "won't you sing?", "não quer cantar?"]
  - [heya-kojin, "個室[こしつ]", "private room", "sala privativa", {rare: true}]
  - [ichijikan, "一時間[いちじかん]", "one hour", "uma hora"]
  - [encho, "延長[えんちょう]", "extension (more time)", "prorrogação (mais tempo)", {rare: true}]
  - [hitori-karaoke, "一人[ひとり] カラオケ", "karaoke alone", "karaokê sozinho", {rare: true}]
  - [heta, "下手[へた]", "bad at (it)", "ruim nisso"]
  - [tanoshii, "楽[たの]しい", "fun", "divertido"]
dialogue:
  - [kenta, "今日[きょう] カラオケ 行[い]かない？ あ、 敬語[けいご] で… カラオケ に 行[い]きません か。", "Karaoke today? Oh, politely… Won't you come to karaoke?", "Karaokê hoje? Ah, educadamente… Não quer ir ao karaokê?"]
  - [protagonist, "いい ね！ でも 歌[うた] は 下手[へた] だ よ。", "Sounds good! But I'm bad at singing.", "Boa! Mas eu canto mal."]
  - [kenta, "大丈夫[だいじょうぶ]。 個室[こしつ] だ から、 僕[ぼく]たち だけ。", "It's fine. It's a private room, just us.", "Tranquilo. É sala privativa, só a gente."]
  - [protagonist, "一時間[いちじかん] いくら？", "How much for an hour?", "Quanto é uma hora?"]
  - [kenta, "安[やす]い よ。 じゃあ、 乾杯[かんぱい]！", "It's cheap. Okay — cheers!", "É barato. Então — saúde!"]
  - [protagonist, "乾杯[かんぱい]！", "Cheers!", "Saúde!"]
  - [kenta, "ブラジル の 歌[うた]、 歌[うた]いません か。", "Won't you sing a Brazilian song?", "Não quer cantar uma música brasileira?"]
  - [protagonist, "うん、 歌[うた]う！ …楽[たの]しい！ 延長[えんちょう] しよう！", "Yeah, I'll sing! …This is fun! Let's add more time!", "Vou, sim! …Que divertido! Vamos prorrogar!"]
  - [kenta, "実[じつ] は 僕[ぼく]、 一人[ひとり] カラオケ も 好[す]き なんだ。", "Actually, I like karaoke alone, too.", "Na verdade, eu também gosto de karaokê sozinho."]
teach:
  - ask: ["Say: karaoke.", "Diga: karaokê.", "カラオケ", karaoke]
  - ask: ["Say: a song.", "Diga: uma música.", "歌[うた]", uta]
  - ask: ["Say: I sing.", "Diga: eu canto.", "歌[うた]います。", utaimasu]
  - note: ["To invite politely, use the negative question: «行[い]きません か» — won't you go? It leaves the other person room to say no, so it sounds kinder than «行[い]きましょう», let's go.", "Para convidar com educação, use a pergunta negativa: «行[い]きません か» — não quer ir? Deixa espaço para o outro recusar, por isso soa mais gentil que «行[い]きましょう», vamos."]
  - build: [ikimasen-ka, ["か", "行[い]きません か"]]
  - ask: ["Invite him: won't you come?", "Convide-o: não quer ir?", "行[い]きません か。", ikimasen-ka]
  - ask: ["Invite him to karaoke.", "Convide-o para o karaokê.", "カラオケ に 行[い]きません か。", karaoke, ikimasen-ka]
  - ask: ["Ask: won't you sing?", "Pergunte: não quer cantar?", "歌[うた]いません か。", utaimasen-ka]
  - ask: ["Raise your glass: cheers!", "Levante o copo: saúde!", "乾杯[かんぱい]！", kanpai]
  - ask: ["Say: a private room.", "Diga: sala privativa.", "個室[こしつ]", heya-kojin]
  - ask: ["Say: one hour.", "Diga: uma hora.", "一時間[いちじかん]", ichijikan]
  - ask: ["Say: I'm bad at it — plain, to Kenta.", "Diga: sou ruim nisso — informal, para o Kenta.", "下手[へた] だ よ。", heta]
  - ask: ["Say: this is fun!", "Diga: que divertido!", "楽[たの]しい！", tanoshii]
  - ask: ["Say: an extension, more time.", "Diga: prorrogação, mais tempo.", "延長[えんちょう]", encho]
  - ask: ["Say: karaoke alone.", "Diga: karaokê sozinho.", "一人[ひとり] カラオケ", hitori-karaoke]
  - note: ["Japanese karaoke is not a stage in a bar: you rent a «個室[こしつ]», a private room, by the hour, and order drinks by the phone on the wall. Many people go alone, «一人[ひとり] カラオケ», to practise or just to sing; some places have rooms made for one.", "O karaokê japonês não é um palco no bar: você aluga um «個室[こしつ]», uma sala só sua, por hora, e pede bebida pelo telefone da parede. Muita gente vai sozinha, «一人[ひとり] カラオケ», para treinar ou só cantar; alguns lugares têm salas feitas para uma pessoa."]
  - pt_only: "No Brasil o karaokê costuma ser no bar, com plateia de desconhecidos. No Japão, cantar mal é sem vergonha: só os amigos estão na sala."
