id: B1-08
protagonist: m
title: [The wedding, O casamento]
situation: ["A colleague from the factory invited you to his wedding reception. Kenta explains the money envelope the night before.", "Um colega da fábrica convidou você para a festa de casamento. O Kenta explica o envelope de dinheiro na véspera."]
learn: [n4-005]
culture: New notes in the envelope
items:
  - [kekkonshiki, "結婚式[けっこんしき]", "wedding (ceremony)", "casamento (cerimônia)"]
  - [hirouen, "披露宴[ひろうえん]", "wedding reception", "festa de casamento", {rare: true}]
  - [goshuugi, "ご祝儀[しゅうぎ]", "wedding gift money", "dinheiro de presente de casamento", {rare: true}]
  - [fuutou, "封筒[ふうとう]", "envelope", "envelope"]
  - [shinsatsu, "新札[しんさつ]", "new (crisp) banknotes", "notas novas", {rare: true}]
  - [ireru, "入[い]れて も いい", "may put in", "pode colocar"]
  - [sanman-en, "三万円[さんまんえん]", "30,000 yen", "30 mil ienes"]
  - [guusuu, "偶数[ぐうすう]", "even number", "número par"]
  - [wakareru-imi, "別[わか]れる 意味[いみ]", "the meaning of splitting up", "o sentido de se separar"]
  - [hikidemono, "引[ひ]き出[で]物[もの]", "return gift for guests", "lembrança para os convidados", {rare: true}]
  - [omedetou-gozaimasu, "おめでとう ございます", "congratulations (polite)", "parabéns (educado)"]
dialogue:
  - [protagonist, "明日[あした] の 披露宴[ひろうえん]、 プレゼント は 何[なに] が いい？", "For tomorrow's reception, what's a good present?", "Para a festa de amanhã, que presente é bom?"]
  - [kenta, "プレゼント じゃ なくて、 ご祝儀[しゅうぎ]。 お金[かね] を 封筒[ふうとう] に 入[い]れる ん だ。", "Not a present — gift money. You put money in an envelope.", "Não é presente — é dinheiro. Você põe num envelope."]
  - [protagonist, "いくら 入[い]れて も いい の？", "How much should I put in?", "Quanto eu ponho?"]
  - [kenta, "友達[ともだち] や 同僚[どうりょう] は 三万円[さんまんえん] が 普通[ふつう]。 新札[しんさつ] で ね。", "For friends and colleagues 30,000 yen is normal. In new notes.", "Para amigo e colega, 30 mil ienes é o normal. Em notas novas."]
  - [protagonist, "二万円[にまんえん] でも いい？", "Would 20,000 be okay?", "Pode ser 20 mil?"]
  - [kenta, "偶数[ぐうすう] は 別[わか]れる 意味[いみ] が ある から、 避[さ]けた ほう が いい。", "Even numbers can mean splitting up, so better avoid them.", "Número par tem o sentido de se separar, então é melhor evitar."]
  - [protagonist, "なるほど。 帰[かえ]り に は 何[なに] か もらえる？", "I see. Do guests get something to take home?", "Entendi. Na saída a gente ganha alguma coisa?"]
  - [kenta, "引[ひ]き出[で]物[もの] が ある よ。 明日[あした]、 新郎[しんろう] に「おめでとう ございます」 って 言[い]って ね。", "There's a return gift. Tomorrow say “congratulations” to the groom.", "Tem uma lembrança. Amanhã diga «parabéns» para o noivo."]
teach:
  - ask: ["Say: a wedding.", "Diga: um casamento.", "結婚式[けっこんしき]", kekkonshiki]
  - ask: ["Say: the wedding reception.", "Diga: a festa de casamento.", "披露宴[ひろうえん]", hirouen]
  - ask: ["Say: the gift money.", "Diga: o dinheiro de presente.", "ご祝儀[しゅうぎ]", goshuugi]
  - ask: ["Say: an envelope.", "Diga: um envelope.", "封筒[ふうとう]", fuutou]
  - ask: ["Say: crisp new banknotes.", "Diga: notas novas.", "新札[しんさつ]", shinsatsu]
  - note: ["Asking what's acceptable: «〜て も いい の？» casually — «いくら 入[い]れて も いい の？», how much is it okay to put in? With a noun: «二万円[にまんえん] でも いい？» — would 20,000 be okay?", "Perguntando o que é aceitável: «〜て も いい の？» no informal — «いくら 入[い]れて も いい の？», quanto pode pôr? Com substantivo: «二万円[にまんえん] でも いい？» — 20 mil pode ser?"]
  - ask: ["Ask casually: is it okay to put it in?", "Pergunte, informal: pode colocar?", "入[い]れて も いい？", ireru]
  - ask: ["Say: 30,000 yen.", "Diga: 30 mil ienes.", "三万円[さんまんえん]", sanman-en]
  - ask: ["Say: an even number.", "Diga: número par.", "偶数[ぐうすう]", guusuu]
  - ask: ["Say: the meaning of splitting up.", "Diga: o sentido de se separar.", "別[わか]れる 意味[いみ]", wakareru-imi]
  - ask: ["Say: the return gift for guests.", "Diga: a lembrança dos convidados.", "引[ひ]き出[で]物[もの]", hikidemono]
  - ask: ["Congratulate the groom politely.", "Dê os parabéns ao noivo, com educação.", "おめでとう ございます。", omedetou-gozaimasu]
  - note: ["Guests bring «ご祝儀[しゅうぎ]» in a special decorated envelope: usually 30,000 yen from a friend or colleague, in brand-new notes — new notes show you prepared for the happy day. Odd amounts are preferred, because an even number splits in two. Guests leave with a gift, «引[ひ]き出[で]物[もの]».", "Os convidados levam «ご祝儀[しゅうぎ]» num envelope decorado especial: em geral 30 mil ienes de amigo ou colega, em notas novinhas — nota nova mostra que você se preparou para o dia feliz. Prefere-se valor ímpar, porque número par se divide em dois. Os convidados saem com uma lembrança, «引[ひ]き出[で]物[もの]»."]
  - pt_only: "No Brasil se dá presente da lista ou um Pix para a lua de mel. No Japão é dinheiro vivo, em envelope bonito — e o valor praticamente paga o jantar da festa."
