id: B1-22
protagonist: m
title: ["The news", "As notícias"]
situation: ["Dinner at Mrs Suzuki's with the evening news on. An election is coming. You ask about it — carefully.", "Jantar na casa da senhora Suzuki com o noticiário ligado. Vem aí uma eleição. Você pergunta sobre isso — com cuidado."]
learn: [n3-068, n3-138]
culture: Politics carefully
items:
  - [nyuusu, "ニュース", "the news", "o noticiário, as notícias"]
  - [senkyo, "選挙[せんきょ]", "election", "eleição"]
  - [shushou, "首相[しゅしょう]", "prime minister", "primeiro-ministro"]
  - [seitou, "政党[せいとう]", "political party", "partido político"]
  - [ni-yoru-to, "〜に よる と", "according to…", "segundo…, de acordo com…"]
  - [nyuusu-ni-yoru-to, "ニュース に よる と", "according to the news", "segundo o noticiário"]
  - [touhyou, "投票[とうひょう]", "voting, a vote", "votação, voto"]
  - [touhyouritsu, "投票率[とうひょうりつ]", "turnout", "comparecimento às urnas", {rare: true}]
  - [seiji, "政治[せいじ]", "politics", "política"]
  - [kokkai, "国会[こっかい]", "the Diet (parliament)", "o parlamento (Dieta)", {rare: true}]
  - [gimu, "義務[ぎむ]", "obligation, duty", "obrigação"]
dialogue:
  - [suzuki, "来月[らいげつ]、 選挙[せんきょ] が あります よ。", "There's an election next month.", "Mês que vem tem eleição."]
  - [protagonist, "ニュース に よる と、 新[あたら]しい 首相[しゅしょう] が 決[き]まる かも しれない ん です ね。", "According to the news, a new prime minister might be decided.", "Segundo o noticiário, pode ser que se defina um novo primeiro-ministro."]
  - [suzuki, "ええ。 でも 若[わか]い 人[ひと] は あまり 投票[とうひょう] に 行[い]きません。", "Yes. But young people don't vote much.", "Sim. Mas os jovens votam pouco."]
  - [protagonist, "ブラジル で は 投票[とうひょう] は 義務[ぎむ] です。", "In Brazil voting is compulsory.", "No Brasil votar é obrigatório."]
  - [suzuki, "まあ、 そう です か。 日本[にほん] は 自由[じゆう] です。 投票率[とうひょうりつ] は 低[ひく]い です けど。", "Oh, is it? In Japan it's voluntary. Turnout is low, though.", "É mesmo? No Japão é livre. Só que o comparecimento é baixo."]
  - [protagonist, "鈴木[すずき] さん は どの 政党[せいとう] が…", "Which party do you…", "A senhora apoia qual partido…"]
  - [suzuki, "ふふ、 それ は 秘密[ひみつ] です。 政治[せいじ] の 話[はなし] は 家族[かぞく] と だけ。", "Heh, that's a secret. Politics I only talk about with family.", "Rá, isso é segredo. Política, só com a família."]
  - [protagonist, "すみません。 外国人[がいこくじん] は 投票[とうひょう] できません けど、 ニュース は 見[み]ます。", "Sorry. Foreigners can't vote, but I do watch the news.", "Desculpe. Estrangeiro não vota, mas eu acompanho o noticiário."]
teach:
  - ask: ["Say: the news.", "Diga: o noticiário.", "ニュース", nyuusu]
  - note: ["«に よる と» gives your source: «ニュース に よる と», according to the news. It goes well with hearsay endings: «〜 そう です», «〜 らしい», «〜 かも しれない» — might.", "«に よる と» dá a fonte: «ニュース に よる と», segundo o noticiário. Combina com as terminações de ouvir dizer: «〜 そう です», «〜 らしい», «〜 かも しれない» — pode ser que."]
  - ask: ["Say the pattern: according to…", "Diga o padrão: segundo…", "〜に よる と", ni-yoru-to]
  - ask: ["Say: according to the news.", "Diga: segundo o noticiário.", "ニュース に よる と", nyuusu-ni-yoru-to]
  - ask: ["Say: an election.", "Diga: uma eleição.", "選挙[せんきょ]", senkyo]
  - ask: ["Say: the prime minister.", "Diga: o primeiro-ministro.", "首相[しゅしょう]", shushou]
  - ask: ["Say: a political party.", "Diga: um partido político.", "政党[せいとう]", seitou]
  - ask: ["Say: politics.", "Diga: política.", "政治[せいじ]", seiji]
  - ask: ["Say: the parliament, the Diet.", "Diga: o parlamento.", "国会[こっかい]", kokkai]
  - ask: ["Say: voting.", "Diga: votação.", "投票[とうひょう]", touhyou]
  - ask: ["Say: turnout.", "Diga: comparecimento às urnas.", "投票率[とうひょうりつ]", touhyouritsu]
  - ask: ["Say: an obligation.", "Diga: uma obrigação.", "義務[ぎむ]", gimu]
  - note: ["Voting in Japan is voluntary, and turnout among young people is often low. Foreign residents cannot vote. Many Japanese avoid politics outside the family, so asking someone's party is personal — let them offer it.", "No Japão votar é facultativo, e o comparecimento dos jovens costuma ser baixo. Estrangeiros residentes não votam. Muitos japoneses evitam política fora da família, então perguntar o partido de alguém é pessoal — deixe que a pessoa conte se quiser."]
  - pt_only: "No Brasil, voto obrigatório e discussão política no churrasco. No Japão, voto livre e o assunto guardado para casa — pergunte de leve, como o protagonista."
