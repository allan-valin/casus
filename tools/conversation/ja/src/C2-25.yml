id: C2-25
protagonist: f
title: ["Language at work", "A língua no trabalho"]
situation: ["On the phone with a client, Hiroto said «了解[りょうかい] です» and «ご苦労[くろう] さま です». After the call, you correct him — kindly.", "No telefone com um cliente, o Hiroto disse «了解[りょうかい] です» e «ご苦労[くろう] さま です». Depois da ligação, você o corrige — com jeito."]
learn: []
culture: —
items:
  - [kashikomarimashita-review, "かしこまりました", "certainly (to clients)", "pois não (a clientes)"]
  - [ryoukai, "了解[りょうかい] です", "got it (casual, to peers)", "entendido (informal, entre colegas)"]
  - [gokurousama, "ご苦労[くろう] さま", "thanks for your trouble (to juniors)", "obrigado pelo esforço (a subordinados)"]
  - [otsukaresama-review, "お疲[つか]れさま です", "thanks for your work (to anyone at work)", "bom trabalho (a qualquer colega)"]
  - [naosu, "直[なお]す", "correct, fix", "corrigir"]
  - [me-ue, "目上[めうえ] の 人[ひと]", "superiors, elders", "superiores, mais velhos"]
  - [kotoba-zukai, "言葉[ことば] 遣[づか]い", "choice of words, wording", "jeito de falar"]
  - [ki-wo-tsukete-hoshii, "気[き] を つけて ほしい", "I'd like you to be careful", "quero que você tome cuidado"]
  - [shikaru-janakute, "叱[しか]る ん じゃ なくて", "I'm not scolding you", "não é bronca"]
  - [benkyou-ni-narimashita, "勉強[べんきょう] に なりました", "I learned a lot", "aprendi muito"]
dialogue:
  - [protagonist, "大翔[ひろと] くん、 ちょっと いい？ 叱[しか]る ん じゃ なくて、 言葉[ことば] 遣[づか]い の 話[はなし]。", "Hiroto, got a minute? I'm not scolding you — it's about wording.", "Hiroto, tem um minutinho? Não é bronca — é sobre o jeito de falar."]
  - [hiroto, "はい… 何[なに] か 間違[まちが]えました か。", "Yes… did I make a mistake?", "Sim… eu errei alguma coisa?"]
  - [protagonist, "お客様[きゃくさま] に「了解[りょうかい] です」 は ちょっと 軽[かる]い。「かしこまりました」 が いい よ。", "“Ryōkai desu” is a bit too light for a client. “Kashikomarimashita” is better.", "«Ryōkai desu» é meio leve demais para cliente. «Kashikomarimashita» é melhor."]
  - [hiroto, "そう だった ん です か。 友達[ともだち] に は いつも 使[つか]って いて。", "Oh, I didn't know. I always use it with friends.", "Ah, eu não sabia. Uso sempre com os amigos."]
  - [protagonist, "それ と、「ご苦労[くろう] さま」 は 目上[めうえ] の 人[ひと] が 下[した] の 人[ひと] に 言[い]う 言葉[ことば]。 お客様[きゃくさま] や 上司[じょうし] に は「お疲[つか]れさま です」。", "And “gokurōsama” is what superiors say to juniors. To clients and bosses, it's “otsukaresama desu”.", "E «gokurōsama» é o que o superior diz ao subordinado. Para cliente e chefe, é «otsukaresama desu»."]
  - [hiroto, "外国[がいこく] から 来[き]た 先輩[せんぱい] に 敬語[けいご] を 直[なお]される とは… 勉強[べんきょう] に なりました。", "Having my keigo corrected by a senior from abroad… I learned a lot.", "Ser corrigido no keigo por uma veterana estrangeira… aprendi muito."]
  - [protagonist, "私[わたし] も 最初[さいしょ] は 全部[ぜんぶ] 間違[まちが]えて いた よ。 気[き] を つけて ほしい けど、 心配[しんぱい] しないで。", "I got all of it wrong at first too. I'd like you to be careful, but don't worry.", "Eu também errava tudo no começo. Quero que tome cuidado, mas não se preocupe."]
  - [hiroto, "ありがとう ございます。 次[つぎ] から 直[なお]します。", "Thank you. I'll fix it from next time.", "Obrigado. Da próxima vez eu corrijo."]
teach:
  - ask: ["Say: wording, choice of words.", "Diga: o jeito de falar.", "言葉[ことば] 遣[づか]い", kotoba-zukai]
  - ask: ["Reassure him: I'm not scolding you.", "Tranquilize-o: não é bronca.", "叱[しか]る ん じゃ なくて", shikaru-janakute]
  - ask: ["Say the casual: got it.", "Diga o informal: entendido.", "了解[りょうかい] です", ryoukai]
  - ask: ["Say the right one for clients: certainly.", "Diga o certo para clientes: pois não.", "かしこまりました", kashikomarimashita-review]
  - ask: ["Say the one for juniors: thanks for your trouble.", "Diga o de superior para subordinado.", "ご苦労[くろう] さま", gokurousama]
  - ask: ["Say the safe one: thanks for your work.", "Diga o seguro: bom trabalho.", "お疲[つか]れさま です", otsukaresama-review]
  - ask: ["Say: superiors, elders.", "Diga: superiores.", "目上[めうえ] の 人[ひと]", me-ue]
  - ask: ["Say: correct, fix.", "Diga: corrigir.", "直[なお]す", naosu]
  - ask: ["Say: I'd like you to be careful.", "Diga: quero que você tome cuidado.", "気[き] を つけて ほしい", ki-wo-tsukete-hoshii]
  - ask: ["Say: I learned a lot.", "Diga: aprendi muito.", "勉強[べんきょう] に なりました", benkyou-ni-narimashita]
  - note: ["Some everyday work phrases carry rank: «ご苦労[くろう] さま» goes down the ladder; «お疲[つか]れさま です» is safe in all directions; «了解[りょうかい] です» is fine among peers but too casual for clients — «かしこまりました» or «承知[しょうち] しました». Correcting a junior works best in private, with reassurance.", "Algumas frases do dia a dia carregam hierarquia: «ご苦労[くろう] さま» desce a escada; «お疲[つか]れさま です» é segura em qualquer direção; «了解[りょうかい] です» serve entre colegas, mas é informal demais para clientes — «かしこまりました» ou «承知[しょうち] しました». Corrigir um subordinado funciona melhor a sós e com tranquilidade."]
  - pt_only: "Cinco anos atrás você aprendia «お疲[つか]れさま» com o Kenta. Hoje é você que ensina keigo a um japonês — e com o tato que aprendeu aqui."
