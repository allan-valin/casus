id: A1-04
protagonist: m
title: [The konbini, A konbini]
situation: ["Lunch at the convenience store near the factory. The manager is at the till.", "Almoço na loja de conveniência perto da fábrica. O gerente está no caixa."]
learn: []
culture: Heated food, bags and points cards at the till
items:
  - [irasshaimase, "いらっしゃいませ", "welcome (shop staff)", "bem-vindo (dito pelos funcionários)"]
  - [kore-kudasai, "これ ください", "this, please", "isto, por favor"]
  - [kudasai, "ください", "please (give me)", "por favor (me dê)"]
  - [atatamemasu-ka, "温[あたた]めます か", "shall I heat it?", "quer que esquente?", {rare: true}]
  - [onegaishimasu, "お願[ねが]いします", "please (yes, do)", "por favor (sim, faça)"]
  - [fukuro, "袋[ふくろ]", "bag", "sacola", {rare: true}]
  - [irimasen, "いりません", "I don't need it", "não preciso"]
  - [ikura, "いくら です か", "how much is it?", "quanto é?"]
  - [en, "円[えん]", "yen", "iene"]
  - [hyaku, "百[ひゃく]", "hundred", "cem"]
  - [kaado, "カード", "card", "cartão"]
  - [arigatou-gozaimashita, "ありがとう ございました", "thank you (for what was done)", "obrigado (pelo que foi feito)"]
dialogue:
  - [tencho, "いらっしゃいませ。", "Welcome.", "Bem-vindo."]
  - [protagonist, "これ ください。", "This, please.", "Isto, por favor."]
  - [tencho, "お弁当[べんとう] です ね。 温[あたた]めます か。", "A lunch box. Shall I heat it?", "Uma marmita. Quer que esquente?"]
  - [protagonist, "はい、 お願[ねが]いします。", "Yes, please.", "Sim, por favor."]
  - [tencho, "袋[ふくろ] は？", "A bag?", "Sacola?"]
  - [protagonist, "いいえ、 いりません。 いくら です か。", "No, I don't need one. How much is it?", "Não, não preciso. Quanto é?"]
  - [tencho, "五百[ごひゃく] 円[えん] です。", "Five hundred yen.", "Quinhentos ienes."]
  - [protagonist, "カード で お願[ねが]いします。", "By card, please.", "No cartão, por favor."]
  - [tencho, "ありがとう ございました。", "Thank you very much.", "Muito obrigado."]
teach:
  - note: ["Staff greet you with «いらっしゃいませ». You don't answer it — a small nod is enough.", "Os funcionários dizem «いらっしゃいませ». Não se responde — basta um aceno de cabeça."]
  - note: ["To buy: point and say «これ ください» — this, please.", "Para comprar: aponte e diga «これ ください» — isto, por favor."]
  - ask: ["Ask for the lunch box you are holding.", "Peça a marmita que você está segurando.", "これ ください。", kore-kudasai]
  - note: ["He asks «温[あたた]めます か» — shall I heat it? Yes: «はい、 お願[ねが]いします».", "Ele pergunta «温[あたた]めます か» — quer que esquente? Sim: «はい、 お願[ねが]いします»."]
  - line: [tencho, atatamemasu-ka]
  - ask: ["Say yes, please.", "Diga sim, por favor.", "はい、 お願[ねが]いします。", onegaishimasu]
  - ask: ["He offers a bag. Say you don't need one.", "Ele oferece uma sacola. Diga que não precisa.", "いいえ、 いりません。", irimasen]
  - ask: ["Ask how much it is.", "Pergunte quanto é.", "いくら です か。", ikura]
  - note: ["«百[ひゃく]» is a hundred, «円[えん]» is yen: five hundred yen is «五百[ごひゃく] 円[えん]».", "«百[ひゃく]» é cem, «円[えん]» é iene: quinhentos ienes é «五百[ごひゃく] 円[えん]»."]
  - ask: ["Say: one hundred yen.", "Diga: cem ienes.", "百[ひゃく] 円[えん]", hyaku, en]
  - ask: ["Say you'll pay by card.", "Diga que vai pagar no cartão.", "カード で お願[ねが]いします。", kaado, onegaishimasu]
  - ask: ["How does he thank you as you leave?", "Como ele agradece quando você sai?", "ありがとう ございました。", arigatou-gozaimashita]
  - ask: ["Ask for something, with 'please' alone.", "Peça algo, só com 'por favor'.", "ください。", kudasai]
  - pt_only: "Sem gorjeta no Japão — o preço é o preço. E a konbini é muito mais que conveniência: ali se pagam contas, se imprime documento e se manda encomenda."
