id: B1-30
protagonist: m
title: ["Friday night", "Sexta à noite"]
situation: ["Friday at an izakaya with Kenta, Yui and Lucas. Then a second place, and a third — a look back at all of B1.", "Sexta num izakaya com o Kenta, a Yui e o Lucas. Depois um segundo lugar, e um terceiro — uma revisão de todo o B1."]
learn: []
culture: はしご酒 — bar-hopping
items:
  - [izakaya, "居酒屋[いざかや]", "izakaya (Japanese pub)", "izakaya (bar japonês)"]
  - [hashigozake, "はしご 酒[ざけ]", "bar-hopping", "ir de bar em bar", {rare: true}]
  - [nijikai, "二次会[にじかい]", "the second round (next place)", "a segunda rodada (outro lugar)", {rare: true}]
  - [ichijikai, "一次会[いちじかい]", "the first round", "a primeira rodada", {rare: true}]
  - [toriaezu, "とりあえず ビール", "a beer to start with", "pra começar, uma cerveja"]
  - [otooshi, "お通[とお]し", "the small starter you're charged for", "petisco de entrada cobrado", {rare: true}]
  - [yakitori, "焼[や]き鳥[とり]", "grilled chicken skewers", "espetinho de frango"]
  - [shime, "締[し]め", "the dish that ends the night", "o prato que fecha a noite", {rare: true}]
  - [mou-ikken, "もう 一軒[いっけん]", "one more place", "mais um lugar"]
  - [kaerou-ka, "そろそろ 帰[かえ]ろう か", "shall we head home soon?", "vamos indo?"]
dialogue:
  - [kenta, "とりあえず ビール！ 乾杯[かんぱい]！", "A beer to start! Cheers!", "Pra começar, cerveja! Saúde!"]
  - [lucas, "この 小[ちい]さい 料理[りょうり] は 何[なに]？ 頼[たの]んで ない よ。", "What's this little dish? We didn't order it.", "Que pratinho é esse? A gente não pediu."]
  - [yui, "お通[とお]し。 席[せき] の 料金[りょうきん] みたい な もの。", "It's otōshi. Like a table charge.", "É o otōshi. Tipo uma taxa de mesa."]
  - [protagonist, "焼[や]き鳥[とり] も 頼[たの]もう。 一次会[いちじかい] は ここ で。", "Let's order yakitori too. First round here.", "Vamos pedir espetinho também. A primeira rodada é aqui."]
  - [kenta, "二次会[にじかい] は カラオケ ね。 その 後[あと] は はしご 酒[ざけ] だ。", "Second round at karaoke. After that, bar-hopping.", "A segunda rodada é no karaokê. Depois, de bar em bar."]
  - [yui, "最後[さいご] は ラーメン で 締[し]めよう。", "Let's finish the night with ramen.", "Vamos fechar a noite com lámen."]
  - [lucas, "もう 一軒[いっけん] 行[い]こう！", "One more place!", "Mais um lugar!"]
  - [protagonist, "もう 一時[いちじ] だ よ。 終電[しゅうでん] も ない。 そろそろ 帰[かえ]ろう か… タクシー で。", "It's already one. No last train either. Shall we head home… by taxi.", "Já é uma hora. Nem tem mais trem. Vamos indo… de táxi."]
teach:
  - ask: ["Say: an izakaya.", "Diga: um izakaya.", "居酒屋[いざかや]", izakaya]
  - ask: ["Order the classic: a beer to start with.", "Peça o clássico: pra começar, uma cerveja.", "とりあえず ビール！", toriaezu]
  - ask: ["Say: the small starter you pay for.", "Diga: o petisco de entrada cobrado.", "お通[とお]し", otooshi]
  - ask: ["Say: grilled chicken skewers.", "Diga: espetinho de frango.", "焼[や]き鳥[とり]", yakitori]
  - ask: ["Say: the first round.", "Diga: a primeira rodada.", "一次会[いちじかい]", ichijikai]
  - ask: ["Say: the second round.", "Diga: a segunda rodada.", "二次会[にじかい]", nijikai]
  - ask: ["Say: bar-hopping.", "Diga: ir de bar em bar.", "はしご 酒[ざけ]", hashigozake]
  - ask: ["Say: one more place!", "Diga: mais um lugar!", "もう 一軒[いっけん]！", mou-ikken]
  - ask: ["Say: the dish that ends the night.", "Diga: o prato que fecha a noite.", "締[し]め", shime]
  - ask: ["Suggest heading home.", "Sugira irem embora.", "そろそろ 帰[かえ]ろう か。", kaerou-ka]
  - note: ["A night out moves: the «一次会[いちじかい]» at an izakaya, the «二次会[にじかい]» somewhere else — karaoke, a bar — and some go on, «はしご 酒[ざけ]», climbing the ladder from bar to bar. Izakaya charge a small «お通[とお]し» starter, and a bowl of ramen is the classic «締[し]め».", "A noite anda: o «一次会[いちじかい]» num izakaya, o «二次会[にじかい]» em outro lugar — karaokê, um bar — e alguns continuam, «はしご 酒[ざけ]», subindo a escada de bar em bar. Os izakaya cobram um petisco de entrada, «お通[とお]し», e uma tigela de lámen é o «締[し]め» clássico."]
  - note: ["That's the end of B1. You talk with friends in plain Japanese, give opinions and reasons, report what you heard, guess, regret, decide and plan, give and receive, and read the air when a «検討[けんとう] します» means no. In B2: work — honorifics, meetings, and the harder conversations.", "Fim do B1. Você conversa com amigos em japonês informal, dá opinião e motivo, conta o que ouviu, supõe, se arrepende, decide e planeja, dá e recebe, e lê o clima quando um «検討[けんとう] します» quer dizer não. No B2: trabalho — linguagem honorífica, reuniões e as conversas mais difíceis."]
  - pt_only: "No Brasil o rolê também muda de bar, mas sem nome para cada etapa. No Japão a noite tem capítulos: primeiro, segundo, terceiro… e o lámen no fim."
