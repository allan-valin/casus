id: A1-17
protagonist: f
title: [It's not anime, Não é anime]
situation: ["Lunch break. Kenta asks whether Brazil is carnival all year. You ask whether Japan is like anime.", "Intervalo do almoço. O Kenta pergunta se o Brasil é carnaval o ano todo. Você pergunta se o Japão é como nos animes."]
learn: []
culture: Stereotypes both ways
items:
  - [anime, "アニメ", "anime", "anime"]
  - [hontou, "本当[ほんとう] です か", "really? is it true?", "é verdade?"]
  - [chigaimasu, "違[ちが]います", "that's not right; it's different", "não é bem assim; é diferente"]
  - [kaanibaru, "カーニバル", "carnival", "carnaval"]
  - [mainichi, "毎日[まいにち]", "every day", "todo dia"]
  - [minna, "みんな", "everyone", "todo mundo"]
  - [sakkaa, "サッカー", "football", "futebol"]
  - [jouzu, "上手[じょうず]", "good at, skilled", "bom em, habilidoso"]
  - [nihon-jin, "日本人[にほんじん]", "Japanese person", "japonês (pessoa)"]
  - [burajiru-jin, "ブラジル人[じん]", "Brazilian person", "brasileiro (pessoa)"]
  - [ninja, "忍者[にんじゃ]", "ninja", "ninja"]
dialogue:
  - [kenta, "ブラジル は 毎日[まいにち] カーニバル です か。", "Is Brazil carnival every day?", "No Brasil é carnaval todo dia?"]
  - [protagonist, "違[ちが]います よ！ 一年[いちねん] に 一回[いっかい] です。", "No! Once a year.", "Não! Uma vez por ano."]
  - [kenta, "でも、 ブラジル人[じん] は みんな サッカー が 上手[じょうず] です よ ね。", "But all Brazilians are good at football, right?", "Mas todo brasileiro é bom de futebol, né?"]
  - [protagonist, "私[わたし] は 下手[へた] です。 日本[にほん] は アニメ みたい です か。", "I'm bad at it. Is Japan like anime?", "Eu sou ruim. O Japão é como nos animes?"]
  - [kenta, "うーん、 違[ちが]います。 忍者[にんじゃ] も いません。", "Hmm, no. There are no ninjas either.", "Hmm, não. Ninja também não tem."]
  - [protagonist, "本当[ほんとう] です か。 残念[ざんねん]！", "Really? What a pity!", "Sério? Que pena!"]
  - [kenta, "でも 日本人[にほんじん] は みんな アニメ が 好[す]き です。", "But all Japanese people like anime.", "Mas todo japonês gosta de anime."]
  - [protagonist, "健太[けんた] さん、 それ も 違[ちが]います よ ね？", "Kenta, that's not right either, is it?", "Kenta, isso também não é bem assim, né?"]
teach:
  - note: ["«違[ちが]います» — literally 'it differs' — is the polite way to say that's not right. Softer than «いいえ».", "«違[ちが]います» — literalmente 'é diferente' — é o jeito educado de dizer que não é assim. Mais suave que «いいえ»."]
  - ask: ["Say: that's not right.", "Diga: não é bem assim.", "違[ちが]います。", chigaimasu]
  - ask: ["Ask if Brazil is carnival every day.", "Pergunte se no Brasil é carnaval todo dia.", "ブラジル は 毎日[まいにち] カーニバル です か。", mainichi, kaanibaru]
  - ask: ["Say: Brazilian.", "Diga: brasileiro.", "ブラジル人[じん]", burajiru-jin]
  - ask: ["Say: Japanese (person).", "Diga: japonês (pessoa).", "日本人[にほんじん]", nihon-jin]
  - ask: ["Say: everyone is good at football.", "Diga: todo mundo é bom de futebol.", "みんな サッカー が 上手[じょうず] です。", minna, sakkaa, jouzu]
  - ask: ["Ask: really?", "Pergunte: é verdade?", "本当[ほんとう] です か。", hontou]
  - ask: ["Ask if Japan is like anime.", "Pergunte se o Japão é como nos animes.", "日本[にほん] は アニメ みたい です か。", anime]
  - ask: ["Say: there are no ninjas.", "Diga: não tem ninjas.", "忍者[にんじゃ] は いません。", ninja, imasu]
  - note: ["Stereotypes run both ways: Brazil as carnival and football, Japan as anime, ninjas and robots. A friendly «違[ちが]います よ» with a smile opens the real conversation.", "Os estereótipos vão nos dois sentidos: o Brasil como carnaval e futebol, o Japão como anime, ninja e robô. Um «違[ちが]います よ» simpático, com um sorriso, abre a conversa de verdade."]
