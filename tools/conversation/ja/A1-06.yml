steps:
- type: narrator
  text:
    en: June. It has rained for a week. Kenta, your neighbour, meets you on the stairs. Listen to the conversation; you don't need to understand it yet.
    pt: Junho. Chove há uma semana. Kenta, seu vizinho, encontra você na escada. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: おはよう ございます。 また 雨[あめ] です ね。
    meaning:
      en: Good morning. Rain again.
      pt: Bom dia. Chuva de novo, né?
  - speaker: protagonist
    text: おはよう ございます。 梅雨[つゆ] です か。
    meaning:
      en: Good morning. Is it the rainy season?
      pt: Bom dia. É a estação das chuvas?
  - speaker: kenta
    text: はい。 七月[しちがつ] まで です。
    meaning:
      en: Yes. Until July.
      pt: Sim. Até julho.
  - speaker: protagonist
    text: 蒸[む]し暑[あつ]い です ね。
    meaning:
      en: It's hot and humid, isn't it.
      pt: Que abafado, né?
  - speaker: kenta
    text: ブラジル は 暑[あつ]い です か。
    meaning:
      en: Is Brazil hot?
      pt: O Brasil é quente?
  - speaker: protagonist
    text: はい。 でも 冬[ふゆ] は 少[すこ]し 寒[さむ]い です。
    meaning:
      en: Yes. But winter is a little cold.
      pt: Sim. Mas o inverno é um pouco frio.
  - speaker: kenta
    text: 明日[あした] は いい 天気[てんき] です よ。
    meaning:
      en: Tomorrow the weather will be nice.
      pt: Amanhã vai fazer tempo bom.
  - speaker: protagonist
    text: よかった！ 今日[きょう] は 傘[かさ] です ね。
    meaning:
      en: Good! Today it's an umbrella, then.
      pt: Que bom! Hoje é guarda-chuva, né?
