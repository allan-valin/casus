steps:
- type: narrator
  text:
    en: You arrive at your new flat in Hamamatsu. The landlady, Mrs Suzuki, opens the door next door. Listen to the conversation; you don't need to understand it yet.
    pt: Você chega ao apartamento novo em Hamamatsu. A dona, a senhora Suzuki, abre a porta ao lado. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: はい？ どちら 様[さま] です か。
    meaning:
      en: Yes? Who is it?
      pt: Sim? Quem é?
  - speaker: protagonist
    text: こんにちは。 はじめまして。
    meaning:
      en: Hello. Nice to meet you.
      pt: Olá! Muito prazer.
  - speaker: suzuki
    text: ああ、 新[あたら]しい 人[ひと] です ね。
    meaning:
      en: Ah, you're the new person.
      pt: Ah, você é a pessoa nova.
  - speaker: protagonist
    text: すみません、 わかりません。
    meaning:
      en: Sorry, I don't understand.
      pt: Desculpe, não entendo.
  - speaker: suzuki
    text: 鈴木[すずき] です。 よろしく お願[ねが]いします。
    meaning:
      en: I'm Suzuki. Pleased to meet you.
      pt: Sou Suzuki. Muito prazer.
  - speaker: protagonist
    text: 鈴木[すずき] さん。 私[わたし] は ブラジル から 来[き]ました。
    meaning:
      en: Mrs Suzuki. I came from Brazil.
      pt: Senhora Suzuki. Eu vim do Brasil.
  - speaker: suzuki
    text: ブラジル！ 遠[とお]い です ね。
    meaning:
      en: Brazil! That's far.
      pt: Brasil! É longe.
  - speaker: protagonist
    text: はい。 よろしく お願[ねが]いします。
    meaning:
      en: Yes. Pleased to meet you.
      pt: Sim. Muito prazer.
