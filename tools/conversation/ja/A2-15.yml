- type: narrator
  text:
    en: Two little words at the end change the tone. «ね» asks for agreement — «いい 曲[きょく] です ね», good song, isn't it? «よ» tells something the other may not know — «演歌[えんか] です よ», it's enka, I'm telling you.
      Mrs Suzuki's «わ» is an older, feminine softener.
    pt: Duas palavrinhas no fim mudam o tom. «ね» pede concordância — «いい 曲[きょく] です ね», música boa, não é? «よ» conta algo que o outro talvez não saiba — «演歌[えんか] です よ», é enka, viu. O «わ» da senhora Suzuki
      é um suavizador feminino, mais antigo.
