steps:
- type: narrator
  text:
    en: Mrs Suzuki plays an old record and sings along. Enka, she says — the songs of her youth. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Suzuki põe um disco antigo e canta junto. Enka, diz ela — as músicas da juventude dela. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: この 歌[うた]、 懐[なつ]かしい わ。 若[わか]い 頃[ころ] に よく 聴[き]きました。
    meaning:
      en: This song brings back memories. I listened to it a lot when I was young.
      pt: Esta música me dá saudade. Eu ouvia muito quando era jovem.
  - speaker: protagonist
    text: 何[なん] の 音楽[おんがく] です か。
    meaning:
      en: What kind of music is it?
      pt: Que música é essa?
  - speaker: suzuki
    text: 演歌[えんか] です よ。 昭和[しょうわ] の 歌[うた] です。
    meaning:
      en: It's enka. A song from the Showa era.
      pt: É enka. Uma música da era Showa.
  - speaker: protagonist
    text: ちょっと 悲[かな]しい です ね。
    meaning:
      en: It's a bit sad, isn't it.
      pt: É meio triste, né?
  - speaker: suzuki
    text: ええ、 歌詞[かし] は 別[わか]れ の 話[はなし] です よ。
    meaning:
      en: Yes, the lyrics are about a parting.
      pt: É, a letra fala de uma despedida.
  - speaker: protagonist
    text: でも、 いい 曲[きょく] です ね。 ブラジル の サウダージ みたい。
    meaning:
      en: But it's a good song. Like Brazilian saudade.
      pt: Mas é uma música boa. Parece a saudade brasileira.
  - speaker: suzuki
    text: サウダージ？ それ は 何[なん] です か。
    meaning:
      en: Saudade? What's that?
      pt: Saudade? O que é isso?
  - speaker: protagonist
    text: 会[あ]いたい 気持[きも]ち です。 演歌[えんか] と 同[おな]じ です よ。
    meaning:
      en: The feeling of missing someone. Same as enka, I'm telling you.
      pt: É o sentimento de querer ver alguém. Igual ao enka, viu.
