- type: narrator
  text:
    en: Enka are slow ballads of parting, the sea, the hometown and drink, sung with a trembling voice. They were at their height in the Showa era; many older people still sing them at karaoke.
    pt: Enka são baladas lentas de despedida, mar, terra natal e bebida, cantadas com a voz tremida. Viveram o auge na era Showa; muitos mais velhos ainda cantam no karaokê.
- type: narrator
  for:
  - pt
  text:
    pt: 'Enka tem algo de samba-canção ou de modão sertanejo: a dor da despedida cantada bem devagar. «懐[なつ]かしい» é o mais perto de saudade que o japonês tem.'
