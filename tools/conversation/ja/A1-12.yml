steps:
- type: narrator
  text:
    en: Sunday at the small shrine near your flat. Kenta shows you the cats that live there. Listen to the conversation; you don't need to understand it yet.
    pt: Domingo no pequeno santuário perto de casa. O Kenta mostra os gatos que moram ali. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: ここ が 神社[じんじゃ] です。 猫[ねこ] が います よ。
    meaning:
      en: This is the shrine. There are cats.
      pt: Este é o santuário. Tem gatos.
  - speaker: protagonist
    text: 本当[ほんとう] だ！ かわいい！ 何匹[なんびき] います か。
    meaning:
      en: Really! Cute! How many are there?
      pt: É verdade! Que fofos! Quantos tem?
  - speaker: kenta
    text: 五匹[ごひき] くらい。 鳥[とり] も 多[おお]い です。
    meaning:
      en: About five. There are lots of birds too.
      pt: Uns cinco. Tem muitos pássaros também.
  - speaker: protagonist
    text: 犬[いぬ] は？
    meaning:
      en: And dogs?
      pt: E cachorros?
  - speaker: kenta
    text: 犬[いぬ] は いません。 あそこ に お守[まも]り が あります。
    meaning:
      en: No dogs. Over there are amulets.
      pt: Cachorros, não. Ali tem amuletos.
  - speaker: protagonist
    text: 猫[ねこ] を 触[さわ]っても いい です か。
    meaning:
      en: May I touch the cats?
      pt: Posso tocar nos gatos?
  - speaker: kenta
    text: うーん、 ちょっと だめ です ね。
    meaning:
      en: Hmm, better not.
      pt: Hmm, melhor não.
  - speaker: protagonist
    text: わかりました。 見[み]る だけ。
    meaning:
      en: Understood. Just looking.
      pt: Entendi. Só olhando.
