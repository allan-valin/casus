- type: narrator
  text:
    en: 'New Year is Japan''s biggest family holiday: «年賀状[ねんがじょう]» cards arrive on 1 January, families eat «おせち» and «お雑煮[ぞうに]», children get «お年玉[としだま]» in little envelopes, and millions make «初詣[はつもうで]»,
      the first shrine visit.'
    pt: 'O ano-novo é o maior feriado de família do Japão: os cartões «年賀状[ねんがじょう]» chegam no dia 1º de janeiro, as famílias comem «おせち» e «お雑煮[ぞうに]», as crianças ganham «お年玉[としだま]» em pequenos envelopes,
      e milhões fazem o «初詣[はつもうで]», a primeira visita ao santuário.'
