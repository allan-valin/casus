steps:
- type: narrator
  text:
    en: 'New Year''s Day with Yui''s family: lacquer boxes of osechi, envelopes for the children, then the first shrine visit of the year. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Dia de Ano-Novo com a família da Yui: caixas laqueadas de osechi, envelopes para as crianças, depois a primeira visita do ano ao santuário. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: 明[あ]けまして おめでとう ございます。 今年[ことし] も よろしく お願[ねが]い します。
    meaning:
      en: Happy New Year. I look forward to this year with you too.
      pt: Feliz ano-novo. Conto com vocês neste ano também.
  - speaker: yui-chichi
    text: おめでとう。 さあ、 おせち を どうぞ。
    meaning:
      en: Happy New Year. Now, have some osechi.
      pt: Feliz ano-novo. Vamos, sirva-se de osechi.
  - speaker: protagonist
    text: きれい です ね。 一[ひと]つ 一[ひと]つ に 意味[いみ] が ある ん です か。
    meaning:
      en: It's beautiful. Does every dish mean something?
      pt: Que bonito. Cada coisa tem um significado?
  - speaker: yui
    text: うん。 黒豆[くろまめ] は 健康[けんこう]、 えび は 長生[ながい]き。 全部[ぜんぶ] 縁起[えんぎ] が いい の。
    meaning:
      en: Yes. Black beans for health, prawns for long life. All lucky.
      pt: É. Feijão-preto é saúde, camarão é vida longa. Tudo dá sorte.
  - speaker: yui-chichi
    text: お雑煮[ぞうに] も 温[あたた]かい うち に 食[た]べて ください。
    meaning:
      en: Have the zōni too, while it's warm.
      pt: Coma o zōni também, enquanto está quente.
  - speaker: protagonist
    text: いただきます。 甥[おい]っ子[こ] に お年玉[としだま] を 準備[じゅんび] しました。
    meaning:
      en: Thank you. I've prepared New Year money for your nephew.
      pt: Obrigado. Preparei o dinheiro de ano-novo para o seu sobrinho.
  - speaker: yui
    text: ありがとう！ 混[こ]まない うち に、 初詣[はつもうで] に 行[い]こう。
    meaning:
      en: Thanks! Let's go for the first shrine visit before it gets crowded.
      pt: Obrigada! Vamos ao santuário antes que lote.
  - speaker: protagonist
    text: ブラジル で は 白[しろ]い 服[ふく] を 着[き]て、 海[うみ] で 年[とし] を 越[こ]します よ。
    meaning:
      en: In Brazil we wear white and see the new year in at the beach.
      pt: No Brasil a gente veste branco e vira o ano na praia.
