- type: narrator
  text:
    en: Asked what matters in a partner, most Japanese say personality over nationality. Curiosity about foreigners is real, and for some it is mostly an adventure — so say early what you are looking for,
      as he did. About one marriage in 25 in Japan is international.
    pt: Perguntados sobre o que importa num parceiro, a maioria dos japoneses diz que é o jeito da pessoa, não a nacionalidade. A curiosidade por estrangeiros existe, e para alguns é mais uma aventura —
      por isso diga cedo o que você procura, como ele fez. Cerca de um casamento em 25 no Japão é internacional.
- type: narrator
