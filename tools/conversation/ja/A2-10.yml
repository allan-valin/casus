steps:
- type: narrator
  text:
    en: You matched with Yui, a designer, on a dating app. First meeting at a café near the station, then a walk. Listen to the conversation; you don't need to understand it yet.
    pt: Você deu match com a Yui, designer, num aplicativo de namoro. Primeiro encontro num café perto da estação, depois uma caminhada. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: yui
    text: はじめまして、 由衣[ゆい] です。 アプリ の 写真[しゃしん] と 同[おな]じ です ね。
    meaning:
      en: Nice to meet you, I'm Yui. You look like your photo on the app.
      pt: Prazer, sou a Yui. Você é igual à foto do aplicativo.
  - speaker: protagonist
    text: よかった。 由衣[ゆい] さん の お仕事[しごと] は デザイン です よね。
    meaning:
      en: Good. Your work is design, right?
      pt: Que bom. Você trabalha com design, não é?
  - speaker: yui
    text: はい。 趣味[しゅみ] は カフェ めぐり です。 外国[がいこく] の 人[ひと] と デート は 初[はじ]めて です。
    meaning:
      en: Yes. My hobby is going round cafés. It's my first date with someone from abroad.
      pt: Sim. Meu hobby é conhecer cafés. É meu primeiro encontro com alguém de fora.
  - speaker: protagonist
    text: 僕[ぼく] は 一年[いちねん] 日本[にほん] に います。 遊[あそ]び じゃ なくて、 真面目[まじめ] に 付[つ]き合[あ]いたい です。
    meaning:
      en: I'm in Japan for a year. I'm not looking for a fling — I want something serious.
      pt: Vou ficar um ano no Japão. Não quero só curtir — quero algo sério.
  - speaker: yui
    text: そう です か。 私[わたし] も 国籍[こくせき] より 人柄[ひとがら] だ と 思[おも]います。
    meaning:
      en: I see. I think personality matters more than nationality, too.
      pt: Entendi. Eu também acho que o jeito da pessoa importa mais que a nacionalidade.
  - speaker: protagonist
    text: 今日[きょう] は コーヒー を 飲[の]んで、 たくさん 話[はな]して、 楽[たの]しかった です。
    meaning:
      en: Today we had coffee, talked a lot — it was fun.
      pt: Hoje tomamos café, conversamos bastante — foi divertido.
  - speaker: yui
    text: 私[わたし] も。 連絡先[れんらくさき]、 交換[こうかん] しましょう か。
    meaning:
      en: Me too. Shall we swap contacts?
      pt: Eu também. Vamos trocar contato?
  - speaker: protagonist
    text: はい！ また 会[あ]えます か。
    meaning:
      en: Yes! Can we meet again?
      pt: Vamos! A gente pode se ver de novo?
