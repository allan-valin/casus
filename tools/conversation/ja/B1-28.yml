- type: narrator
  text:
    en: '«梅雨[つゆ]» lasts from about early June to mid-July in most of Japan. Damp gets into everything: dehumidifiers, moisture absorbers in closets, indoor drying and airing on sunny days are part of the
      routine. The news announces «梅雨[つゆ] 明[あ]け» — then real summer starts.'
    pt: 'O «梅雨[つゆ]» vai mais ou menos do começo de junho a meados de julho na maior parte do Japão. A umidade entra em tudo: desumidificador, absorvedor de umidade nos armários, roupa secando dentro de
      casa e janelas abertas nos dias de sol fazem parte da rotina. O noticiário anuncia o «梅雨[つゆ] 明[あ]け» — aí começa o verão de verdade.'
