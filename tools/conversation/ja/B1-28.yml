steps:
- type: narrator
  text:
    en: June. Three weeks of rain, and black spots on your bathroom wall and the back of your shoes. Mrs Suzuki inspects. Listen to the conversation; you don't need to understand it yet.
    pt: Junho. Três semanas de chuva, e manchas pretas na parede do banheiro e atrás dos sapatos. A senhora Suzuki inspeciona. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: まあ、 カビ が 出[で]て います ね。 湿気[しっけ] が 多[おお]い から。
    meaning:
      en: Oh, there's mould. It's the damp.
      pt: Nossa, apareceu mofo. É a umidade.
  - speaker: protagonist
    text: 毎日[まいにち] じめじめ して、 洗濯物[せんたくもの] も 乾[かわ]きません。
    meaning:
      en: It's muggy every day, and the laundry won't dry.
      pt: Todo dia abafado, e a roupa não seca.
  - speaker: suzuki
    text: 梅雨[つゆ] の 間[あいだ] は 部屋[へや] 干[ぼ]し です よ。 除湿機[じょしつき] を 使[つか]って。
    meaning:
      en: During the rainy season you dry indoors. Use a dehumidifier.
      pt: Na estação das chuvas se seca dentro de casa. Use um desumidificador.
  - speaker: protagonist
    text: 除湿機[じょしつき]？ ブラジル で は 使[つか]った こと が ありません。
    meaning:
      en: A dehumidifier? I've never used one in Brazil.
      pt: Desumidificador? Nunca usei no Brasil.
  - speaker: suzuki
    text: 晴[は]れて いる 間[あいだ] に、 窓[まど] を 開[あ]けて 空気[くうき] を 入[い]れて ください。
    meaning:
      en: While it's sunny, open the windows and let the air in.
      pt: Enquanto estiver sol, abra as janelas e deixe o ar entrar.
  - speaker: protagonist
    text: 靴[くつ] の カビ は？
    meaning:
      en: And the mould on my shoes?
      pt: E o mofo dos sapatos?
  - speaker: suzuki
    text: 拭[ふ]いて、 よく 乾[かわ]かして ください。 新聞紙[しんぶんし] を 入[い]れる と いい です よ。
    meaning:
      en: Wipe them and dry them well. Newspaper inside helps.
      pt: Limpe e seque bem. Pôr jornal dentro ajuda.
  - speaker: protagonist
    text: 梅雨[つゆ] 明[あ]け が 待[ま]ち遠[どお]しい です。
    meaning:
      en: I can't wait for the rainy season to end.
      pt: Não vejo a hora de acabar a estação das chuvas.
