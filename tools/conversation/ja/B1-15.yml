- type: narrator
  text:
    en: 'Japanese schools are known for strict «校則[こうそく]»: uniforms, hair colour, even underwear colour in some. Rules forcing students with naturally brown hair to dye it black became a national debate,
      and many schools have relaxed them; more now let students choose trousers or skirts.'
    pt: 'As escolas japonesas são conhecidas pelo «校則[こうそく]» rígido: uniforme, cor do cabelo, em algumas até a cor da roupa íntima. Regras que obrigavam alunos com cabelo naturalmente castanho a tingir
      de preto viraram debate nacional, e muitas escolas afrouxaram; mais escolas hoje deixam escolher entre calça e saia.'
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil uniforme é comum, mas cabelo e unha são problema de cada um. Para uma brasileira nikkei de cabelo castanho, ouvir isso pode ser um susto — e mostra quanto o Japão está mudando.
