steps:
- type: narrator
  text:
    en: 'Aya shows you photos from her high school: identical uniforms, black hair. She tells you about the rules — and what changed. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'A Aya mostra fotos do colégio: uniformes iguais, cabelo preto. Ela conta das regras — e do que mudou. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: aya
    text: これ、 高校[こうこう] の 写真[しゃしん]。 みんな 同[おな]じ 制服[せいふく] でしょ。
    meaning:
      en: This is my high-school photo. Everyone in the same uniform, see?
      pt: Esta é a foto do colégio. Todo mundo de uniforme igual, viu?
  - speaker: protagonist
    text: 髪[かみ] も みんな 黒[くろ] だ ね。
    meaning:
      en: And everyone's hair is black.
      pt: E o cabelo de todo mundo é preto.
  - speaker: aya
    text: 校則[こうそく] が 厳[きび]しかった の。 髪[かみ] を 染[そ]める の は 禁止[きんし]。
    meaning:
      en: The rules were strict. Dyeing your hair was forbidden.
      pt: O regulamento era rígido. Tingir o cabelo era proibido.
  - speaker: protagonist
    text: 髪[かみ] が 茶色[ちゃいろ] の 人[ひと] は？
    meaning:
      en: What about people with brown hair?
      pt: E quem tem cabelo castanho?
  - speaker: aya
    text: 地毛[じげ] でも、 黒[くろ] に 染[そ]めろ って 言[い]われた 人[ひと] も いた。 ひどい でしょ。
    meaning:
      en: Some were told to dye it black even if it was natural. Awful, right?
      pt: Teve gente que mandaram tingir de preto, mesmo sendo cabelo natural. Absurdo, né?
  - speaker: protagonist
    text: 今[いま] も そう？
    meaning:
      en: Is it still like that?
      pt: Ainda é assim?
  - speaker: aya
    text: 今[いま] は 変[か]わった。 地毛[じげ] は 染[そ]めなくて も いい し、 スカート か ズボン か 選[えら]べる 学校[がっこう] も 増[ふ]えた。
    meaning:
      en: Now it's changed. You don't have to dye natural hair, and more schools let you choose skirt or trousers.
      pt: Agora mudou. Não precisa tingir o cabelo natural, e aumentaram as escolas onde dá para escolher saia ou calça.
  - speaker: protagonist
    text: 自由[じゆう] が 少[すこ]し 増[ふ]えた ん だ ね。
    meaning:
      en: So there's a little more freedom.
      pt: Então a liberdade aumentou um pouco.
