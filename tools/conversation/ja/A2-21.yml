steps:
- type: narrator
  text:
    en: September 1st, Disaster Prevention Day. The neighbourhood drill at the school; Mrs Suzuki shows you her emergency bag. Listen to the conversation; you don't need to understand it yet.
    pt: 1º de setembro, Dia da Prevenção de Desastres. O simulado do bairro na escola; a senhora Suzuki mostra a mochila de emergência dela. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: 今日[きょう] は 防災[ぼうさい] の 日[ひ] です。 避難[ひなん] の 訓練[くんれん] が あります よ。
    meaning:
      en: Today is Disaster Prevention Day. There's an evacuation drill.
      pt: Hoje é o Dia da Prevenção de Desastres. Tem simulado de evacuação.
  - speaker: protagonist
    text: どこ に 避難[ひなん] します か。
    meaning:
      en: Where do we evacuate to?
      pt: Para onde a gente evacua?
  - speaker: suzuki
    text: 小学校[しょうがっこう] が 避難所[ひなんじょ] です。 これ は 私[わたし] の 非常[ひじょう] 持[も]ち出[だ]し 袋[ぶくろ]。
    meaning:
      en: The primary school is the shelter. This is my emergency bag.
      pt: A escola primária é o abrigo. Esta é a minha mochila de emergência.
  - speaker: protagonist
    text: 何[なに] が 入[はい]って います か。
    meaning:
      en: What's in it?
      pt: O que tem dentro?
  - speaker: suzuki
    text: 三日分[みっかぶん] の 水[みず] と 食[た]べ物[もの]、 懐中[かいちゅう] 電灯[でんとう]、 薬[くすり]。
    meaning:
      en: Three days' water and food, a torch, medicine.
      pt: Água e comida para três dias, lanterna, remédio.
  - speaker: protagonist
    text: 私[わたし] は 何[なに] も 準備[じゅんび] して いません…
    meaning:
      en: I haven't prepared anything…
      pt: Eu não preparei nada…
  - speaker: suzuki
    text: 今週[こんしゅう]、 準備[じゅんび] して おいて ください ね。 浜松[はままつ] は 海[うみ] が 近[ちか]い から、 津波[つなみ] の 時[とき] は 高[たか]い 所[ところ] へ。
    meaning:
      en: Please get one ready this week. Hamamatsu is near the sea, so in a tsunami, go to high ground.
      pt: Prepare uma esta semana, por favor. Hamamatsu é perto do mar, então em tsunami, vá para um lugar alto.
  - speaker: protagonist
    text: はい。 水[みず] と 電灯[でんとう] を 買[か]って おきます。
    meaning:
      en: Yes. I'll buy water and a torch in advance.
      pt: Certo. Vou comprar água e lanterna antes.
