- type: narrator
  text:
    en: Every town has shelters, usually schools, and coastal towns mark tsunami routes to high ground. Keep water and food for at least three days. Phones sound an emergency alert for strong quakes and
      tsunamis; Hamamatsu's city site has disaster information in Portuguese.
    pt: Toda cidade tem abrigos, geralmente escolas, e cidades costeiras marcam rotas de fuga de tsunami para lugares altos. Tenha água e comida para pelo menos três dias. O celular toca um alerta de emergência
      para terremotos fortes e tsunamis; o site da prefeitura de Hamamatsu tem informações sobre desastres em português.
