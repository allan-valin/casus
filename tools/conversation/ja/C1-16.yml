steps:
- type: narrator
  text:
    en: 'Heavy rain flooded a town in the west of the prefecture. You and Kenta join the volunteers: shovelling mud out of houses. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Uma chuva forte inundou uma cidade no oeste da província. Você e o Kenta entram no grupo de voluntários: tirar lama das casas com pá. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: kenta
    text: 長靴[ながぐつ] と マスク、 持[も]って きた？ 泥[どろ] かき は 大変[たいへん] だ よ。
    meaning:
      en: Did you bring rubber boots and a mask? Shovelling mud is tough.
      pt: Trouxe galochas e máscara? Tirar lama é pesado.
  - speaker: protagonist
    text: 持[も]って きた。 この 家[いえ] は 一階[いっかい] が 全部[ぜんぶ] 浸水[しんすい] した ん だ ね。
    meaning:
      en: I did. The whole ground floor of this house flooded.
      pt: Trouxe. O térreo desta casa alagou inteiro.
  - speaker: hisaisha
    text: 遠[とお]く から 来[き]て くれて、 本当[ほんとう] に ありがとう。
    meaning:
      en: Thank you so much for coming from far away.
      pt: Muito obrigada por terem vindo de tão longe.
  - speaker: protagonist
    text: とんでも ない です。 少[すこ]し でも 支援[しえん] に なれば。
    meaning:
      en: Not at all. If it's even a little help.
      pt: Imagina. Se for de alguma ajuda.
  - speaker: kenta
    text: 暑[あつ]い から、 熱中症[ねっちゅうしょう] に 気[き] を つけて。 三十分[さんじゅっぷん] ごと に 休[やす]もう。
    meaning:
      en: It's hot, watch out for heatstroke. Let's rest every thirty minutes.
      pt: Está quente, cuidado com insolação. Vamos descansar a cada trinta minutos.
  - speaker: protagonist
    text: 疲[つか]れながら も、 みんな 笑顔[えがお] で 働[はたら]いて いる ね。
    meaning:
      en: Although they're tired, everyone's working with a smile.
      pt: Embora cansados, todos trabalham sorrindo.
  - speaker: hisaisha
    text: 家[いえ] は 片付[かたづ]いて も、 心[こころ] は まだ… 話[はなし] を 聞[き]いて くれる だけ で 嬉[うれ]しい。
    meaning:
      en: Even if the house gets cleared, my heart is still… Just listening to me makes me happy.
      pt: A casa pode até ficar limpa, mas o coração ainda… Só de vocês me ouvirem, já fico feliz.
  - speaker: protagonist
    text: 心[こころ] の ケア も 大事[だいじ] です ね。 また 来[き]ます。
    meaning:
      en: Emotional care matters too. I'll come again.
      pt: O apoio emocional também importa. Eu volto.
