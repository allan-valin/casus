- type: narrator
  text:
    en: After floods and earthquakes, local volunteer centres, «災害[さいがい] ボランティア センター», match volunteers with houses. Bring your own boots, gloves, water and food — you must not burden the town — and register
      first. Listening to people is part of the work.
    pt: Depois de enchentes e terremotos, os centros locais de voluntariado, «災害[さいがい] ボランティア センター», distribuem os voluntários pelas casas. Leve suas próprias galochas, luvas, água e comida — não pode pesar
      para a cidade — e faça o cadastro antes. Ouvir as pessoas faz parte do trabalho.
- type: narrator
  for:
  - pt
  text:
    pt: 'Quem viu as enchentes do Rio Grande do Sul conhece a cena: lama, pá e gente de fora ajudando. No Japão o voluntário chega organizado e autossuficiente.'
