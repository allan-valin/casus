steps:
- type: narrator
  text:
    en: After work the konbini manager walks with you to the station and shows you the signs. Listen to the conversation; you don't need to understand it yet.
    pt: Depois do trabalho o gerente da konbini vai com você até a estação e mostra as placas. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: tencho
    text: あそこ が 駅[えき] です。
    meaning:
      en: That's the station over there.
      pt: Ali é a estação.
  - speaker: protagonist
    text: あの 字[じ] は？ 読[よ]めません。
    meaning:
      en: Those characters? I can't read them.
      pt: Aquelas letras? Não consigo ler.
  - speaker: tencho
    text: 漢字[かんじ] です。 「出口[でぐち]」。 外[そと] に 出[で]る 所[ところ] です。
    meaning:
      en: 'They''re kanji: ''exit''. Where you go out.'
      pt: 'São kanji: ''saída''. Onde se sai.'
  - speaker: protagonist
    text: 入口[いりぐち] は どこ です か。
    meaning:
      en: Where's the entrance?
      pt: Onde fica a entrada?
  - speaker: tencho
    text: あそこ です。 ひらがな は 読[よ]めます か。
    meaning:
      en: Over there. Can you read hiragana?
      pt: Ali. Consegue ler hiragana?
  - speaker: protagonist
    text: 少[すこ]し。 カタカナ も 少[すこ]し。
    meaning:
      en: A little. Katakana too, a little.
      pt: Um pouco. Katakana também, um pouco.
  - speaker: tencho
    text: 日本語[にほんご] は 難[むずか]しい です ね。
    meaning:
      en: Japanese is difficult, isn't it.
      pt: Japonês é difícil, né?
  - speaker: protagonist
    text: はい。 でも 頑張[がんば]ります！
    meaning:
      en: Yes. But I'll do my best!
      pt: Sim. Mas vou me esforçar!
- type: narrator
  text:
    en: 'Japanese uses three scripts at once: round «ひらがな», angular «カタカナ» for foreign words, and «漢字[かんじ]», characters from Chinese.'
    pt: 'O japonês usa três escritas ao mesmo tempo: a arredondada «ひらがな», a angulosa «カタカナ» para palavras estrangeiras, e «漢字[かんじ]», caracteres vindos do chinês.'
