steps:
- type: narrator
  text:
    en: 'Lunch break. Kenta is nervous: he wants to tell a girl from his futsal team that he likes her. He explains 告白 to you. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Hora do almoço. O Kenta está nervoso: quer dizer a uma moça do time de futsal que gosta dela. Ele explica o 告白 para você. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: kenta
    text: 実[じつ] は… 今日[きょう]、 告白[こくはく] する。
    meaning:
      en: Actually… I'm going to confess today.
      pt: Na verdade… hoje vou me declarar.
  - speaker: protagonist
    text: 告白[こくはく]？ 誰[だれ] に？
    meaning:
      en: Confess? To whom?
      pt: Se declarar? Para quem?
  - speaker: kenta
    text: フットサル の 美咲[みさき] さん。 緊張[きんちょう] する よ。
    meaning:
      en: Misaki from futsal. I'm nervous.
      pt: A Misaki do futsal. Estou nervoso.
  - speaker: protagonist
    text: もう デート は した？
    meaning:
      en: Have you been on dates already?
      pt: Vocês já saíram?
  - speaker: kenta
    text: 三回[さんかい]。 でも 日本[にほん] では、 告白[こくはく] して から 付[つ]き合[あ]う ん だ。
    meaning:
      en: Three times. But in Japan you start dating after a confession.
      pt: Três vezes. Mas no Japão a gente só começa a namorar depois da declaração.
  - speaker: protagonist
    text: 何[なん] て 言[い]う の？
    meaning:
      en: What do you say?
      pt: E o que você diz?
  - speaker: kenta
    text: 「好[す]き です。 付[つ]き合[あ]って ください」。 それから 返事[へんじ] を 待[ま]つ。
    meaning:
      en: “I like you. Please go out with me.” Then you wait for the answer.
      pt: «Gosto de você. Namora comigo?» Depois espera a resposta.
  - speaker: protagonist
    text: 教[おし]えて くれて ありがとう。 頑張[がんば]って！
    meaning:
      en: Thanks for telling me. Go for it!
      pt: Obrigada por me contar. Vai lá!
