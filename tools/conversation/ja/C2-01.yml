- type: narrator
  text:
    en: 'At weddings, «忌[い]み言葉[ことば]» are avoided even in positive sentences: words of cutting and parting («切[き]れる», «別[わか]れる», «離[はな]れる», «終[お]わる»), and doubled words («重[かさ]ね重[がさ]ね», «たびたび») that suggest
      a second marriage. Funerals have their own list — there, doubled words suggest more deaths.'
    pt: 'Nos casamentos, as «忌[い]み言葉[ことば]» são evitadas até em frases positivas: palavras de corte e separação («切[き]れる», «別[わか]れる», «離[はな]れる», «終[お]わる») e palavras repetidas («重[かさ]ね重[がさ]ね», «たびたび»), que
      lembram um segundo casamento. Funerais têm a sua própria lista — lá, a repetição lembra mais mortes.'
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil o discurso de padrinho pode ter piada e até lembrança da ex. No Japão cada palavra é checada — e um bom discurso é curto, cheio de fórmulas e sem nenhum «corte».
