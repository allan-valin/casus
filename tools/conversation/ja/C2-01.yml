steps:
- type: narrator
  text:
    en: Aya is getting married, and she has asked you to give a speech at the reception. Mrs Suzuki checks your draft for words you must not say. Listen to the conversation; you don't need to understand
      it yet.
    pt: A Aya vai casar e pediu que você faça um discurso na festa. A senhora Suzuki revisa o seu rascunho procurando palavras que não se pode dizer. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: 「二人[ふたり] の 関係[かんけい] が 切[き]れない よう に」… これ は だめ です よ。
    meaning:
      en: “So that your bond never breaks”… that one's not allowed.
      pt: «Para que o laço de vocês nunca se rompa»… esta não pode.
  - speaker: protagonist
    text: どうして です か。 いい 意味[いみ] です よ。
    meaning:
      en: Why? It means something good.
      pt: Por quê? O sentido é bom.
  - speaker: suzuki
    text: 結婚式[けっこんしき] で は「切[き]れる」 や「別[わか]れる」 は 忌[い]み言葉[ことば] です。 否定[ひてい] でも 使[つか]いません。
    meaning:
      en: At weddings, “break” and “separate” are taboo words. Not even in the negative.
      pt: No casamento, «romper» e «separar» são palavras-tabu. Nem na forma negativa.
  - speaker: protagonist
    text: 「重[かさ]ね重[がさ]ね お祝[いわ]い 申[もう]し上[あ]げます」 は？
    meaning:
      en: And “I congratulate you again and again”?
      pt: E «felicito vocês de novo e de novo»?
  - speaker: suzuki
    text: それ も。 重[かさ]ね 言葉[ことば] は 再婚[さいこん] を 思[おも]わせる ので。
    meaning:
      en: That too. Repeated words suggest remarriage.
      pt: Essa também. Palavra repetida lembra segundo casamento.
  - speaker: protagonist
    text: じゃあ、「お二人[ふたり] の 門出[かどで] を 心[こころ] から お祝[いわ]い 申[もう]し上[あ]げます」。
    meaning:
      en: 'Then: “From my heart I congratulate you both on your new start.”'
      pt: 'Então: «Do fundo do coração, felicito vocês dois pelo novo começo».'
  - speaker: suzuki
    text: いい です ね。 結[むす]び は「末永[すえなが]く お幸[しあわ]せ に」。
    meaning:
      en: Good. And close with “Be happy for ever and ever.”
      pt: Ótimo. E feche com «Sejam felizes para todo o sempre».
  - speaker: protagonist
    text: 晴[は]れ の 日[ひ] に 失礼[しつれい] が ない よう に、 練習[れんしゅう] します。
    meaning:
      en: I'll practise so I don't put a foot wrong on her big day.
      pt: Vou treinar para não cometer nenhuma gafe no grande dia dela.
