steps:
- type: narrator
  text:
    en: You now lead a team. Hiroto, the newest member, needs to redo a report, stay late once, and cover a client meeting. How do you ask? Listen to the conversation; you don't need to understand it yet.
    pt: Agora você lidera uma equipe. O Hiroto, o mais novo, precisa refazer um relatório, ficar até mais tarde uma vez e cobrir uma reunião com cliente. Como pedir? Escute a conversa; ainda não precisa
      entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 大翔[ひろと] くん、 この 報告書[ほうこくしょ]、 ここ だけ 直[なお]して もらえる？
    meaning:
      en: Hiroto, could you fix just this part of the report?
      pt: Hiroto, dá para corrigir só esta parte do relatório?
  - speaker: hiroto
    text: はい、 すぐ やります。
    meaning:
      en: Yes, right away.
      pt: Sim, faço já.
  - speaker: protagonist
    text: それ と… 申[もう]し訳[わけ] ない けど、 明日[あした] は 一時間[いちじかん] 残[のこ]って いただけます か。 急[きゅう] な 注文[ちゅうもん] が 入[はい]って。
    meaning:
      en: And… I'm sorry, but could you stay an hour late tomorrow? An urgent order came in.
      pt: E… desculpa, mas você poderia ficar uma hora a mais amanhã? Entrou um pedido urgente.
  - speaker: hiroto
    text: 大丈夫[だいじょうぶ] です。
    meaning:
      en: That's fine.
      pt: Tudo bem.
  - speaker: protagonist
    text: 最後[さいご] に、 恐縮[きょうしゅく] です が、 金曜日[きんようび] の お客様[きゃくさま] と の 会議[かいぎ] を お願[ねが]い できます か。 私[わたし] が 出張[しゅっちょう] で。
    meaning:
      en: Lastly, I'm sorry to ask, but could I ask you to cover Friday's client meeting? I'll be on a business trip.
      pt: Por último, desculpe pedir, mas posso te pedir para cobrir a reunião com o cliente na sexta? Eu vou viajar a trabalho.
  - speaker: hiroto
    text: えっ、 私[わたし] が 一人[ひとり] で？ …はい、 頑張[がんば]ります。
    meaning:
      en: What, me alone? …Yes, I'll do my best.
      pt: Quê, eu sozinho? …Certo, vou dar o meu melhor.
  - speaker: protagonist
    text: 資料[しりょう] と 指示[しじ] は 全部[ぜんぶ] 渡[わた]す から、 安心[あんしん] して。 頼[たの]りに して いる よ。
    meaning:
      en: I'll give you all the materials and instructions, don't worry. I'm counting on you.
      pt: Passo todo o material e as orientações, fique tranquilo. Conto com você.
  - speaker: hiroto
    text: ありがとう ございます。 先輩[せんぱい] の 頼[たの]み方[かた]、 いつも 丁寧[ていねい] です ね。
    meaning:
      en: Thank you. You always ask so politely.
      pt: Obrigado. O seu jeito de pedir é sempre educado.
