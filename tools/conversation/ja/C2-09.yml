- type: narrator
  text:
    en: 'Even with a junior, the size of the request sets the politeness: a small fix — «〜て もらえる？»; a bigger favour — «申[もう]し訳[わけ] ない けど、 〜て いただけます か»; a real burden — «恐縮[きょうしゅく] です が、 〜を お願[ねが]い できます
      か». The «degree of politeness» tracks the weight, not just rank.'
    pt: 'Mesmo com um subordinado, o tamanho do pedido define a cortesia: uma correção pequena — «〜て もらえる？»; um favor maior — «申[もう]し訳[わけ] ない けど、 〜て いただけます か»; um peso de verdade — «恐縮[きょうしゅく] です が、 〜を
      お願[ねが]い できます か». O grau de cortesia acompanha o peso, não só a hierarquia.'
