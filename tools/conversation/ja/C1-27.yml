steps:
- type: narrator
  text:
    en: Aya, now working in Tokyo, calls late at night. She can't sleep, can't eat, cries before work. You listen, and help her find someone to talk to. Listen to the conversation; you don't need to understand
      it yet.
    pt: A Aya, agora trabalhando em Tóquio, liga tarde da noite. Não consegue dormir, nem comer, chora antes do trabalho. Você ouve e a ajuda a achar alguém com quem conversar. Escute a conversa; ainda
      não precisa entender.
- type: dialogue
  lines:
  - speaker: aya
    text: 最近[さいきん]、 眠[ねむ]れない の。 朝[あさ]、 会社[かいしゃ] に 行[い]く 前[まえ] に 涙[なみだ] が 出[で]る。
    meaning:
      en: Lately I can't sleep. In the morning I cry before going to work.
      pt: Ultimamente não consigo dormir. De manhã, antes de ir trabalhar, as lágrimas saem.
  - speaker: protagonist
    text: 話[はな]して くれて ありがとう。 一人[ひとり] じゃ ない よ。
    meaning:
      en: Thank you for telling me. You're not alone.
      pt: Obrigada por me contar. Você não está sozinha.
  - speaker: aya
    text: でも 休[やす]んだら、 みんな に 迷惑[めいわく] が かかる。
    meaning:
      en: But if I take time off, it'll be a burden on everyone.
      pt: Mas se eu tirar folga, vou atrapalhar todo mundo.
  - speaker: protagonist
    text: 無理[むり] しないで。 この まま だ と、 本当[ほんとう] に 病気[びょうき] に なる おそれ が ある。
    meaning:
      en: Don't push yourself. If this goes on, there's a real risk you'll get ill.
      pt: Não se force. Se continuar assim, há o risco de você adoecer de verdade.
  - speaker: aya
    text: 燃[も]え尽[つ]き かな。 うつ かも しれない。
    meaning:
      en: Maybe it's burnout. It might be depression.
      pt: Talvez seja burnout. Pode ser depressão.
  - speaker: protagonist
    text: 心療[しんりょう] 内科[ないか] で 相談[そうだん] して みよう。 会社[かいしゃ] の カウンセリング も ある はず だ よ。
    meaning:
      en: Let's try talking to a psychosomatic clinic. Your company should have counselling too.
      pt: Vamos tentar conversar com uma clínica de saúde mental. A empresa deve ter atendimento psicológico também.
  - speaker: aya
    text: 休職[きゅうしょく] って、 できる の か な。
    meaning:
      en: I wonder if I can take a leave of absence.
      pt: Será que dá para me afastar do trabalho?
  - speaker: protagonist
    text: 医者[いしゃ] の 診断書[しんだんしょ] が あれば できる。 まず は 明日[あした]、 一緒[いっしょ] に 予約[よやく] しよう。
    meaning:
      en: With a doctor's certificate you can. First, let's book an appointment together tomorrow.
      pt: Com atestado médico, dá. Primeiro, amanhã a gente marca uma consulta juntas.
