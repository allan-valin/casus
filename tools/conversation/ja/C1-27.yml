- type: narrator
  text:
    en: 'Mental illness carried a strong stigma in Japan, and many still hesitate to seek help, but it is lifting: «心療[しんりょう] 内科[ないか]» clinics are common, companies must offer stress checks, and sick leave
      with a doctor''s certificate is a right. Japan''s government runs a national mental-health phone line, «こころ の 健康[けんこう] 相談[そうだん] 統一[とういつ] ダイヤル» — look up the current number on the Ministry of Health''s
      site.'
    pt: 'A doença mental carregava um estigma forte no Japão, e muitos ainda hesitam em pedir ajuda, mas isso está mudando: clínicas «心療[しんりょう] 内科[ないか]» são comuns, as empresas precisam oferecer avaliação
      de estresse, e o afastamento com atestado médico é um direito. O governo japonês mantém uma linha nacional de saúde mental, «こころ の 健康[けんこう] 相談[そうだん] 統一[とういつ] ダイヤル» — confira o número atual no site
      do Ministério da Saúde.'
