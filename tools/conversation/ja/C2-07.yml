steps:
- type: narrator
  text:
    en: The city wants to cut the bus line that Brazilian workers and elderly residents use. You draft a formal petition to the mayor; Ishida-sensei checks the letter style. Listen to the conversation;
      you don't need to understand it yet.
    pt: A prefeitura quer cortar a linha de ônibus que os trabalhadores brasileiros e os idosos usam. Você escreve um requerimento formal ao prefeito; o professor Ishida revisa o estilo da carta. Escute
      a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kouza-sensei
    text: 正式[せいしき] な 手紙[てがみ] は「拝啓[はいけい]」 で 始[はじ]めて、「敬具[けいぐ]」 で 終[お]わります。
    meaning:
      en: A formal letter starts with “haikei” and ends with “keigu”.
      pt: Uma carta formal começa com «haikei» e termina com «keigu».
  - speaker: protagonist
    text: その 間[あいだ] に 時候[じこう] の 挨拶[あいさつ] を 入[い]れる ん です よね。「秋[あき] 深[ふか]まる 候[こう]」 など。
    meaning:
      en: And between them, a seasonal greeting. Like “As autumn deepens”.
      pt: E no meio, a saudação da estação. Como «Neste outono que se aprofunda».
  - speaker: kouza-sensei
    text: その 通[とお]り。 では、 本文[ほんぶん] を 読[よ]んで ください。
    meaning:
      en: Exactly. Now read me the body.
      pt: Exatamente. Agora leia o corpo da carta.
  - speaker: protagonist
    text: 「バス 路線[ろせん] の 存続[そんぞく] を お願[ねが]い 申[もう]し上[あ]げます。 利用者[りようしゃ] 三百人[さんびゃくにん] の 署名[しょめい] を 添[そ]えて、 ご高配[こうはい] を 賜[たまわ]ります よう、 お願[ねが]い 申[もう]し上[あ]げます」。
    meaning:
      en: “We humbly request the continuation of the bus line. With the signatures of three hundred users attached, we ask that you kindly give this your consideration.”
      pt: «Solicitamos respeitosamente a permanência da linha de ônibus. Com as assinaturas de trezentos usuários anexas, pedimos que nos conceda a sua atenção.»
  - speaker: kouza-sensei
    text: 見事[みごと] です。 市長[しちょう] の 宛名[あてな] は「浜松[はままつ] 市長[しちょう] 様[さま]」 で いい。
    meaning:
      en: Splendid. Address it to “The Mayor of Hamamatsu”.
      pt: Excelente. O destinatário pode ser «Ilustríssimo Prefeito de Hamamatsu».
  - speaker: protagonist
    text: 要望書[ようぼうしょ] は 怒[おこ]った 調子[ちょうし] で 書[か]かない ほう が いい です よね。
    meaning:
      en: It's better not to write a petition in an angry tone, right?
      pt: É melhor não escrever o requerimento num tom bravo, né?
  - speaker: kouza-sensei
    text: ええ。 丁寧[ていねい] な 言葉[ことば] ほど、 相手[あいて] は 無視[むし] しにくい もの です。
    meaning:
      en: Yes. The more polite the words, the harder they are to ignore.
      pt: Sim. Quanto mais educadas as palavras, mais difícil é ignorá-las.
  - speaker: protagonist
    text: ありがとう ございます。 明日[あした]、 署名[しょめい] と 一緒[いっしょ] に 市役所[しやくしょ] へ 届[とど]けます。
    meaning:
      en: Thank you. Tomorrow I'll deliver it to city hall with the signatures.
      pt: Obrigada. Amanhã entrego na prefeitura junto com as assinaturas.
