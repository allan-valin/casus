steps:
- type: narrator
  text:
    en: Kenta asks how it went with Yui. You tell him — you ended up confessing first. Listen to the conversation; you don't need to understand it yet.
    pt: O Kenta pergunta como foi com a Yui. Você conta — acabou se declarando primeiro. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: で、 由衣[ゆい] さん と は どう なった？
    meaning:
      en: So, how did it go with Yui?
      pt: E aí, como ficou com a Yui?
  - speaker: protagonist
    text: 実[じつ] は… 僕[ぼく] から 告白[こくはく] して しまった。
    meaning:
      en: Actually… I ended up confessing first.
      pt: Na verdade… acabei me declarando primeiro.
  - speaker: kenta
    text: え、 マジ で？ 返事[へんじ] は？
    meaning:
      en: Seriously? And the answer?
      pt: Sério? E a resposta?
  - speaker: protagonist
    text: オッケー だった！ 付[つ]き合[あ]う こと に なった。
    meaning:
      en: It was okay! We're going out now.
      pt: Ela topou! A gente está namorando.
  - speaker: kenta
    text: おめでとう！ 彼女[かのじょ] が できた ね。
    meaning:
      en: Congratulations! You've got a girlfriend.
      pt: Parabéns! Arrumou namorada.
  - speaker: protagonist
    text: すごく 緊張[きんちょう] した。 言[い]う つもり なかった のに、 言[い]っちゃった。
    meaning:
      en: I was so nervous. I didn't plan to say it, but it just came out.
      pt: Fiquei muito nervoso. Não ia falar, mas acabei falando.
  - speaker: kenta
    text: やっぱり ね。 次[つぎ] の デート は どこ？
    meaning:
      en: Knew it. Where's the next date?
      pt: Eu sabia. Qual é o próximo encontro?
  - speaker: protagonist
    text: まだ 決[き]めて ない。 健太[けんた] くん と 美咲[みさき] さん は？
    meaning:
      en: Haven't decided. What about you and Misaki?
      pt: Ainda não decidi. E você e a Misaki?
