steps:
- type: narrator
  text:
    en: You moved flats inside Hamamatsu and must report the new address at city hall. A machine gives you a numbered ticket. Listen to the conversation; you don't need to understand it yet.
    pt: Você mudou de apartamento dentro de Hamamatsu e precisa informar o novo endereço na prefeitura. Uma máquina dá uma senha numerada. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: すみません、 引[ひ]っ越[こ]し を しました。
    meaning:
      en: Excuse me, I've moved.
      pt: Com licença, eu me mudei.
  - speaker: madoguchi
    text: 番号札[ばんごうふだ] を 取[と]って、 待[ま]って ください。
    meaning:
      en: Please take a numbered ticket and wait.
      pt: Pegue uma senha e espere, por favor.
  - speaker: madoguchi
    text: 三十五番[さんじゅうごばん] の 方[かた]。 在留[ざいりゅう] カード を 見[み]せて ください。
    meaning:
      en: Number thirty-five. Please show your residence card.
      pt: Número trinta e cinco. Mostre o cartão de residência, por favor.
  - speaker: protagonist
    text: はい、 どうぞ。
    meaning:
      en: Here you are.
      pt: Aqui está.
  - speaker: madoguchi
    text: 新[あたら]しい 住所[じゅうしょ] を ここ に 書[か]いて ください。
    meaning:
      en: Please write the new address here.
      pt: Escreva o novo endereço aqui, por favor.
  - speaker: protagonist
    text: ポルトガル語[ご] の 紙[かみ] は ありますか。
    meaning:
      en: Do you have the form in Portuguese?
      pt: Tem o formulário em português?
  - speaker: madoguchi
    text: あります よ。 住民票[じゅうみんひょう] も 要[い]ります か。
    meaning:
      en: We do. Do you need a certificate of residence too?
      pt: Tem, sim. Precisa de um atestado de residência também?
  - speaker: protagonist
    text: はい、 一枚[いちまい] お願[ねが]いします。
    meaning:
      en: Yes, one copy please.
      pt: Sim, uma via, por favor.
