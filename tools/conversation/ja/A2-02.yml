    en: Moving in or within the city, you report the new address at city hall within 14 days and bring your «在留[ざいりゅう] カード». A machine hands out numbered tickets and a screen calls the numbers. In Hamamatsu
      many forms come in Portuguese, and some days there are interpreters.
