    en: 'Leaving before the boss goes smoothly with a ritual: report what you did, offer help, give a short polite reason, then «お先[さき] に 失礼[しつれい] します». «サービス 残業[ざんぎょう]», unpaid overtime, is illegal — every
      hour worked must be paid — though it still happens.'
