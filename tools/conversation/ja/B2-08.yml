steps:
- type: narrator
  text:
    en: Head office, 18:30. Department head Takahashi is still at his desk; you promised Yui dinner at seven. You need to leave without making waves. Listen to the conversation; you don't need to understand
      it yet.
    pt: Sede, 18h30. O chefe de departamento Takahashi ainda está na mesa; você prometeu jantar com a Yui às sete. Precisa sair sem causar mal-estar. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: （部長[ぶちょう] が まだ いる… 帰[かえ]りにくい な。）
    meaning:
      en: (The head's still here… hard to leave.)
      pt: (O chefe ainda está aqui… difícil ir embora.)
  - speaker: protagonist
    text: 部長[ぶちょう]、 今日[きょう] の 報告[ほうこく] です。 何[なに] か お手伝[てつだ]い する こと は ございます か。
    meaning:
      en: Sir, here's today's report. Is there anything I can help with?
      pt: Chefe, aqui está o relatório de hoje. Há algo em que eu possa ajudar?
  - speaker: buchou
    text: いや、 大丈夫[だいじょうぶ]。 ありがとう。
    meaning:
      en: No, I'm fine. Thank you.
      pt: Não, tudo bem. Obrigado.
  - speaker: protagonist
    text: 実[じつ] は 今晩[こんばん] 予定[よてい] が ありまして… 今日[きょう] は これ で 失礼[しつれい] しても よろしい でしょう か。
    meaning:
      en: Actually I have plans tonight… may I leave for today?
      pt: Na verdade tenho um compromisso hoje à noite… posso ir embora por hoje?
  - speaker: buchou
    text: もちろん。 私[わたし] が 残[のこ]って いる から って、 気[き] に しないで。
    meaning:
      en: Of course. Don't worry just because I'm staying.
      pt: Claro. Não se preocupe só porque eu fico.
  - speaker: protagonist
    text: ありがとう ございます。 お先[さき] に 失礼[しつれい] します。
    meaning:
      en: Thank you. Excuse me for leaving first.
      pt: Obrigado. Com licença, já vou indo.
  - speaker: buchou
    text: お疲[つか]れさま。 それに、 残業[ざんぎょう] した 日[ひ] は ちゃんと 申請[しんせい] して ね。 サービス 残業[ざんぎょう] は だめ だ よ。
    meaning:
      en: Good work. And when you do work overtime, claim it properly. No unpaid overtime.
      pt: Bom trabalho. E quando fizer hora extra, registre direitinho. Hora extra sem pagar, não.
  - speaker: protagonist
    text: はい。 気楽[きらく] に 言[い]って いただけて、 助[たす]かります。
    meaning:
      en: Yes. It helps that you say it so easily.
      pt: Certo. Ajuda muito o senhor dizer isso assim, à vontade.
- type: narrator
  text:
    en: '«〜にくい» is hard to: the verb stem plus «にくい» — «帰[かえ]りにくい», hard to leave (because of the atmosphere, not the door); «言[い]いにくい», hard to say. The opposite is «〜やすい», easy to.'
    pt: '«〜にくい» é difícil de: radical do verbo mais «にくい» — «帰[かえ]りにくい», difícil ir embora (pelo clima, não pela porta); «言[い]いにくい», difícil de dizer. O contrário é «〜やすい», fácil de.'
