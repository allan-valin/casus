- type: narrator
  text:
    en: The «印鑑[いんかん]» is a small seal with your name, stamped in red ink instead of signing. Many banks and offices now accept a signature, but contracts, rentals and some offices still ask for it. Shops
      make one with your name in katakana in a few minutes.
    pt: O «印鑑[いんかん]» é um pequeno carimbo com o seu nome, batido em tinta vermelha no lugar da assinatura. Muitos bancos e órgãos hoje aceitam assinatura, mas contratos, aluguéis e algumas repartições ainda
      pedem. Lojas fazem um com seu nome em katakana em poucos minutos.
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil vale a assinatura e, no máximo, firma reconhecida em cartório. No Japão o carimbo faz esse papel — guarde-o bem, como guardaria um cartão.
