steps:
- type: narrator
  text:
    en: You open a bank account to receive your salary. The clerk asks for your seal. Listen to the conversation; you don't need to understand it yet.
    pt: Você abre uma conta no banco para receber o salário. A atendente pede o seu carimbo pessoal. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 口座[こうざ] を 作[つく]りたい です。 給料[きゅうりょう] の ため です。
    meaning:
      en: I'd like to open an account. For my salary.
      pt: Quero abrir uma conta. Para o salário.
  - speaker: madoguchi
    text: 在留[ざいりゅう] カード と 印鑑[いんかん] は あります か。
    meaning:
      en: Do you have your residence card and a seal?
      pt: Tem o cartão de residência e um carimbo?
  - speaker: protagonist
    text: 印鑑[いんかん]？ サイン は だめ です か。
    meaning:
      en: A seal? Isn't a signature okay?
      pt: Carimbo? Assinatura não serve?
  - speaker: madoguchi
    text: この 銀行[ぎんこう] は サイン でも 大丈夫[だいじょうぶ] です。 でも 印鑑[いんかん] が 便利[べんり] です よ。
    meaning:
      en: This bank accepts a signature. But a seal is handy.
      pt: Este banco aceita assinatura. Mas o carimbo é prático.
  - speaker: protagonist
    text: じゃあ、 店[みせ] に 行[い]って、 印鑑[いんかん] を 買[か]って、 また 来[き]ます。
    meaning:
      en: Then I'll go to a shop, buy a seal, and come back.
      pt: Então vou numa loja, compro um carimbo e volto.
  - speaker: madoguchi
    text: はい。 暗証番号[あんしょうばんごう] は 四桁[よんけた] です。
    meaning:
      en: Fine. The PIN is four digits.
      pt: Certo. A senha tem quatro dígitos.
  - speaker: protagonist
    text: 通帳[つうちょう] も もらえます か。
    meaning:
      en: Do I get a bankbook too?
      pt: Recebo a caderneta também?
  - speaker: madoguchi
    text: はい、 通帳[つうちょう] と カード です。
    meaning:
      en: Yes, a bankbook and a card.
      pt: Sim, caderneta e cartão.
