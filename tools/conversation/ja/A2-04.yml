- type: narrator
  text:
    en: 'The «て» form also joins actions in order: «行[い]って、 買[か]って、 来[き]ます» — I''ll go, buy, and come. Only the last verb carries the tense and politeness. It''s made from the «ます» stem: «行[い]きます» → «行[い]って»,
      «買[か]います» → «買[か]って».'
    pt: 'A forma «て» também junta ações em sequência: «行[い]って、 買[か]って、 来[き]ます» — vou, compro e volto. Só o último verbo leva o tempo e a educação. Ela vem do radical do «ます»: «行[い]きます» → «行[い]って», «買[か]います»
      → «買[か]って».'
