steps:
- type: narrator
  text:
    en: 'Shota takes you to a small museum in Yui, an old post town in Shizuoka: woodblock prints of the Tōkaidō road by Hiroshige — one of them Hamamatsu. Listen to the conversation; you don''t need to
      understand it yet.'
    pt: 'O Shota leva você a um museu pequeno em Yui, uma antiga cidade de posta em Shizuoka: xilogravuras da estrada Tōkaidō de Hiroshige — uma delas é Hamamatsu. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: shota
    text: ここ は 広重[ひろしげ] の 美術館[びじゅつかん]。 東海道[とうかいどう] の 浮世絵[うきよえ] が ある よ。
    meaning:
      en: This is the Hiroshige museum. It has ukiyo-e of the Tōkaidō road.
      pt: Este é o museu do Hiroshige. Tem ukiyo-e da estrada Tōkaidō.
  - speaker: protagonist
    text: 浮世絵[うきよえ] って、 江戸[えど] 時代[じだい] の 版画[はんが] だ よね。
    meaning:
      en: Ukiyo-e are Edo-period prints, right?
      pt: Ukiyo-e são gravuras do período Edo, né?
  - speaker: shota
    text: そう。 見[み]て、 この 作品[さくひん] は 昔[むかし] の 浜松[はままつ]。
    meaning:
      en: Yes. Look, this work is old Hamamatsu.
      pt: Isso. Olha, esta obra é a Hamamatsu de antigamente.
  - speaker: protagonist
    text: すごい！ 景色[けしき] が 全然[ぜんぜん] 違[ちが]う。
    meaning:
      en: Amazing! The scenery is totally different.
      pt: Que incrível! A paisagem é totalmente diferente.
  - speaker: shota
    text: 版画[はんが] を 作[つく]る 体験[たいけん] も できる よ。 やって みる？
    meaning:
      en: You can try making a print too. Want to try?
      pt: Também dá para experimentar fazer uma gravura. Quer tentar?
  - speaker: protagonist
    text: うん、 やって みたい！
    meaning:
      en: Yes, I'd like to try!
      pt: Quero, sim!
  - speaker: shota
    text: 伝統[でんとう] の 技術[ぎじゅつ] だ から、 難[むずか]しい けど ね。
    meaning:
      en: It's a traditional technique, so it's hard, though.
      pt: É uma técnica tradicional, então é difícil.
  - speaker: protagonist
    text: 今度[こんど]、 東京[とうきょう] の 大[おお]きい 美術館[びじゅつかん] に も 行[い]って みよう。
    meaning:
      en: Next time let's try the big museum in Tokyo too.
      pt: Da próxima vez vamos ver o museu grande de Tóquio também.
