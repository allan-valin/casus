steps:
- type: narrator
  text:
    en: A clear winter night on the tea farm. Shota points out the stars and tells you about Hayabusa2, the probe that brought back asteroid dust. Listen to the conversation; you don't need to understand
      it yet.
    pt: Uma noite clara de inverno na plantação de chá. O Shota mostra as estrelas e conta da Hayabusa2, a sonda que trouxe poeira de um asteroide. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: shota
    text: 今夜[こんや] は 晴[は]れて いる から、 天[あま]の川[がわ] が 見[み]える はず だ よ。
    meaning:
      en: It's clear tonight, so we should see the Milky Way.
      pt: Hoje está limpo, então deve dar para ver a Via Láctea.
  - speaker: protagonist
    text: あ、 本当[ほんとう] だ！ あれ が 私[わたし]たち の 銀河[ぎんが]？
    meaning:
      en: Oh, it's true! Is that our galaxy?
      pt: Ah, é mesmo! Aquilo é a nossa galáxia?
  - speaker: shota
    text: そう。 宇宙[うちゅう] って 大[おお]きい よね。
    meaning:
      en: Yes. Space is huge, isn't it.
      pt: É. O universo é enorme, né?
  - speaker: protagonist
    text: 日本[にほん] の 探査機[たんさき] が 小惑星[しょうわくせい] から 帰[かえ]って きた ん でしょ？
    meaning:
      en: A Japanese probe came back from an asteroid, right?
      pt: Uma sonda japonesa voltou de um asteroide, não foi?
  - speaker: shota
    text: はやぶさ２。 リュウグウ の 砂[すな] を 地球[ちきゅう] に 持[も]って 帰[かえ]った。 2020 年[ねん] だった はず。
    meaning:
      en: Hayabusa2. It brought sand from Ryugu back to Earth. In 2020, I think.
      pt: A Hayabusa2. Trouxe areia do Ryugu para a Terra. Foi em 2020, eu acho.
  - speaker: protagonist
    text: すごい！ あ、 流[なが]れ 星[ぼし]！
    meaning:
      en: Amazing! Oh, a shooting star!
      pt: Incrível! Olha, uma estrela-cadente!
  - speaker: shota
    text: 願[ねが]い事[ごと]、 した？
    meaning:
      en: Did you make a wish?
      pt: Fez um pedido?
  - speaker: protagonist
    text: した。 でも 秘密[ひみつ]。
    meaning:
      en: I did. But it's a secret.
      pt: Fiz. Mas é segredo.
