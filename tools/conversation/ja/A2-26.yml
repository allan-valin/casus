steps:
- type: narrator
  text:
    en: 'Second date with Yui: a walk by the lake at sunset. A long silence — and you start to worry. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Segundo encontro com a Yui: uma caminhada à beira do lago no pôr do sol. Um silêncio comprido — e você começa a se preocupar. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: yui
    text: 夕日[ゆうひ]、 きれい です ね。
    meaning:
      en: The sunset is beautiful.
      pt: O pôr do sol está lindo.
  - speaker: protagonist
    text: そう です ね。
    meaning:
      en: Yes, it is.
      pt: É mesmo.
  - speaker: yui
    text: ……
    meaning:
      en: ……
      pt: ……
  - speaker: protagonist
    text: あの… 何[なに] か あった？ 静[しず]か だ けど。
    meaning:
      en: Um… did something happen? You're quiet.
      pt: Hum… aconteceu alguma coisa? Você está quieta.
  - speaker: yui
    text: いいえ。 一緒[いっしょ] に いる と、 話[はな]さなくて も 楽[たの]しい です。
    meaning:
      en: No. When we're together, it's nice even without talking.
      pt: Não. Quando a gente está junto, é bom mesmo sem falar.
  - speaker: protagonist
    text: ブラジル で は、 沈黙[ちんもく] は ちょっと 怖[こわ]い です。
    meaning:
      en: In Brazil silence is a bit scary.
      pt: No Brasil o silêncio dá um pouco de medo.
  - speaker: yui
    text: 日本[にほん] で は 普通[ふつう] です よ。 …今日[きょう] は 嬉[うれ]しかった です。
    meaning:
      en: In Japan it's normal. …I was happy today.
      pt: No Japão é normal. …Hoje eu fiquei feliz.
  - speaker: protagonist
    text: 僕[ぼく] も。 また 会[あ]いたい です。 …恥[は]ずかしい！ 照[て]れます ね。
    meaning:
      en: Me too. I want to see you again. …Embarrassing! I'm blushing.
      pt: Eu também. Quero te ver de novo. …Que vergonha! Fiquei sem graça.
