- type: narrator
  text:
    en: 'Japanese homes run on 100 volts, and each flat has a limit in amperes: too many machines at once and the breaker trips — you just switch it back on. Japan also has two frequencies: 50 Hz in the
      east, 60 Hz in the west. Hamamatsu is 60 Hz.'
    pt: 'As casas japonesas usam 100 volts, e cada apartamento tem um limite em ampères: muita coisa ligada ao mesmo tempo e o disjuntor cai — é só religar. O Japão tem ainda duas frequências: 50 Hz no
      leste, 60 Hz no oeste. Hamamatsu é 60 Hz.'
