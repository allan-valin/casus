steps:
- type: narrator
  text:
    en: A hot evening. The air conditioner, the microwave and the kettle are on — and everything goes dark. Kenta comes over from next door. Listen to the conversation; you don't need to understand it yet.
    pt: Uma noite quente. Ar-condicionado, micro-ondas e chaleira ligados — e tudo apaga. O Kenta vem do apartamento ao lado. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: あれ？ 暗[くら]い！ 電気[でんき] が 消[き]えて います。
    meaning:
      en: Huh? It's dark! The lights are out.
      pt: Ué? Escureceu! A luz apagou.
  - speaker: kenta
    text: 大丈夫[だいじょうぶ]？ 何[なに] を つけて た？
    meaning:
      en: You okay? What did you have on?
      pt: Tudo bem? O que estava ligado?
  - speaker: protagonist
    text: エアコン と 電子[でんし] レンジ と ケトル です。
    meaning:
      en: The air conditioner, the microwave and the kettle.
      pt: O ar-condicionado, o micro-ondas e a chaleira.
  - speaker: kenta
    text: ああ、 ブレーカー が 落[お]ちた ね。 ほら、 ここ。
    meaning:
      en: Ah, the breaker tripped. Look, here.
      pt: Ah, o disjuntor caiu. Olha, aqui.
  - speaker: protagonist
    text: どうして です か。
    meaning:
      en: Why?
      pt: Por quê?
  - speaker: kenta
    text: この 部屋[へや] は 三十[さんじゅう] アンペア だから、 一緒[いっしょ] に 使[つか]う と 落[お]ちる よ。
    meaning:
      en: This flat has thirty amps, so if you use them together it trips.
      pt: Este apartamento tem trinta ampères, então usando tudo junto ele cai.
  - speaker: protagonist
    text: じゃあ、 ケトル を 消[け]します。 …あ、 電気[でんき] が ついて います！
    meaning:
      en: Then I'll turn off the kettle. …Oh, the lights are on!
      pt: Então desligo a chaleira. …Ah, a luz voltou!
  - speaker: kenta
    text: それ と、 日本[にほん] は 百[ひゃく] ボルト だ よ。 ブラジル の ドライヤー は 気[き] を つけて。
    meaning:
      en: And Japan is 100 volts. Careful with a Brazilian hair dryer.
      pt: E o Japão é 100 volts. Cuidado com secador do Brasil.
