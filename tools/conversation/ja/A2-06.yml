- type: narrator
  text:
    en: '«〜て います» describes a state that lasts: «消[き]えて います» — it has gone out and is still off; «ついて います» — it is on. With action verbs it is what is going on now: «食[た]べて います», I''m eating.'
    pt: '«〜て います» descreve um estado que dura: «消[き]えて います» — apagou e continua apagado; «ついて います» — está ligado. Com verbos de ação é o que está acontecendo agora: «食[た]べて います», estou comendo.'
