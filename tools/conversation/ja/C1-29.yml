steps:
- type: narrator
  text:
    en: Two months after the December JLPT, the results are online. You check N1 with Shota and Ishida-sensei's evening class. Listen to the conversation; you don't need to understand it yet.
    pt: Dois meses depois do JLPT de dezembro, os resultados saem na internet. Você confere o N1 com o Shota e a turma noturna do professor Ishida. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: shota
    text: 結果[けっか]、 出[で]た？ 早[はや]く 見[み]よう。
    meaning:
      en: Are the results out? Let's look, quick.
      pt: Saiu o resultado? Vamos ver, rápido.
  - speaker: protagonist
    text: …合格[ごうかく]！ N1 に 合格[ごうかく] した！
    meaning:
      en: …Passed! I passed N1!
      pt: …Passei! Passei no N1!
  - speaker: shota
    text: おめでとう！ 得点[とくてん] は？
    meaning:
      en: Congratulations! What's the score?
      pt: Parabéns! Qual a pontuação?
  - speaker: protagonist
    text: 読解[どっかい] は ぎりぎり。 聴解[ちょうかい] は 高[たか]かった。 太鼓[たいこ] と カラオケ の おかげ かな。
    meaning:
      en: Reading just made it. Listening was high. Thanks to taiko and karaoke, maybe.
      pt: Leitura foi no limite. Auditiva foi alta. Graças ao taikô e ao karaokê, talvez.
  - speaker: kouza-sensei
    text: おめでとう ございます。 三年[さんねん] 前[まえ] は ひらがな も 書[か]けなかった のに。
    meaning:
      en: Congratulations. Three years ago you couldn't even write hiragana.
      pt: Parabéns. Três anos atrás você nem escrevia hiragana.
  - speaker: protagonist
    text: 先生[せんせい] の 作文[さくぶん] の 課題[かだい] の おかげ で、 読解[どっかい] も 何[なん] とか なりました。
    meaning:
      en: Thanks to your essay assignments, I managed the reading too.
      pt: Graças às suas redações, consegui passar na leitura também.
  - speaker: kouza-sensei
    text: いえ、 あなた の 努力[どりょく] です よ。 受験[じゅけん] した クラス の 皆[みな]さん は？
    meaning:
      en: No, it's your own effort. And the others in the class who took it?
      pt: Não, foi o seu esforço. E os outros da turma que fizeram a prova?
  - speaker: protagonist
    text: ルーカス は 不合格[ふごうかく] でした が、 来年[らいねん] また 受験[じゅけん] する そう です。
    meaning:
      en: Lucas didn't pass, but he says he'll take it again next year.
      pt: O Lucas não passou, mas disse que vai fazer de novo no ano que vem.
