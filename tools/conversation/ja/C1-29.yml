- type: narrator
  text:
    en: 'The JLPT is held in July and December, with five levels from N5 to N1. N1 — reading newspapers and following lectures — opens doors: points for some visas, professional jobs, university entry.
      Many people need several tries.'
    pt: 'O JLPT é aplicado em julho e dezembro, com cinco níveis, do N5 ao N1. O N1 — ler jornal e acompanhar palestras — abre portas: pontos para alguns vistos, empregos qualificados, entrada em universidades.
      Muita gente precisa de várias tentativas.'
