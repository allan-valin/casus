steps:
- type: narrator
  text:
    en: 'The futsal team''s LINE group is buzzing: a rumour says Kenta and Misaki are engaged. Aya messages you privately. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'O grupo de LINE do time de futsal está agitado: um boato diz que o Kenta e a Misaki estão noivos. A Aya manda mensagem no privado. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: aya
    text: ねえ、 グループ 見[み]た？ お兄[にい]ちゃん、 美咲[みさき] さん と 結婚[けっこん] する らしい よ。
    meaning:
      en: Hey, did you see the group? Apparently my brother's marrying Misaki.
      pt: Ei, viu o grupo? Parece que meu irmão vai casar com a Misaki.
  - speaker: protagonist
    text: マジ？ 誰[だれ] が 言[い]った の？
    meaning:
      en: Seriously? Who said so?
      pt: Sério? Quem disse?
  - speaker: aya
    text: わからない。 ただ の 噂[うわさ] かも。 でも みんな その 話[はなし] ばかり。
    meaning:
      en: No idea. Maybe just a rumour. But everyone's talking about it.
      pt: Não sei. Pode ser só boato. Mas todo mundo só fala disso.
  - speaker: protagonist
    text: 本人[ほんにん] に 聞[き]いて みたら？
    meaning:
      en: Why not ask him directly?
      pt: Por que não pergunta para ele?
  - speaker: aya
    text: 聞[き]いた けど、 既読[きどく] スルー。 怪[あや]しい でしょ。
    meaning:
      en: I did, but he left me on read. Suspicious, right?
      pt: Perguntei, mas ele deixou no visto. Suspeito, né?
  - speaker: protagonist
    text: 秘密[ひみつ] に したい の か な。
    meaning:
      en: Maybe he wants to keep it secret.
      pt: Vai ver ele quer manter segredo.
  - speaker: aya
    text: そう らしい。 じゃあ、 これ は 二人[ふたり] の 秘密[ひみつ] ね。
    meaning:
      en: Seems so. Then this is our secret.
      pt: Parece. Então isso fica entre nós duas.
  - speaker: protagonist
    text: うん、 誰[だれ] に も 言[い]わない。
    meaning:
      en: Yeah, I won't tell anyone.
      pt: Tá, não conto para ninguém.
