steps:
- type: narrator
  text:
    en: Mrs Suzuki sees you carrying bottles of water home, and explains the tap water — and the bath. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Suzuki vê você carregando garrafas de água para casa, e explica a água da torneira — e o banho de ofurô. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: まあ、 重[おも]い でしょう。 その 水[みず]、 買[か]いました か。
    meaning:
      en: Oh, that must be heavy. Did you buy that water?
      pt: Nossa, deve estar pesado. Você comprou essa água?
  - speaker: protagonist
    text: はい。 水道水[すいどうすい] は ちょっと 怖[こわ]い です。
    meaning:
      en: Yes. Tap water is a bit scary.
      pt: Sim. Água da torneira me dá um pouco de medo.
  - speaker: suzuki
    text: 日本[にほん] の 水道水[すいどうすい] は 飲[の]めます よ。 安全[あんぜん] です。
    meaning:
      en: Japanese tap water is drinkable. It's safe.
      pt: A água da torneira no Japão dá para beber. É segura.
  - speaker: protagonist
    text: 本当[ほんとう] です か。 もったいない！
    meaning:
      en: Really? What a waste!
      pt: Sério? Que desperdício!
  - speaker: suzuki
    text: お風呂[ふろ] は 毎日[まいにち] 沸[わ]かします か。
    meaning:
      en: Do you heat the bath every day?
      pt: Você esquenta o ofurô todo dia?
  - speaker: protagonist
    text: いいえ、 シャワー だけ です。 お風呂[ふろ] は 好[す]き です けど…
    meaning:
      en: No, just a shower. I like baths, but…
      pt: Não, só chuveiro. Gosto de ofurô, mas…
  - speaker: suzuki
    text: 入[はい]る 前[まえ] に 体[からだ] を 洗[あら]います。 お湯[ゆ] は 家族[かぞく] で 使[つか]います。
    meaning:
      en: You wash before getting in. The hot water is shared by the family.
      pt: Você se lava antes de entrar. A água quente é usada pela família toda.
  - speaker: protagonist
    text: だから お湯[ゆ] が きれい なんですね。
    meaning:
      en: So that's why the water stays clean.
      pt: Por isso a água fica limpa.
