- type: narrator
  text:
    en: 'Japanese has two words for water: «水[みず]» cold, «お湯[ゆ]» hot. «沸[わ]かします» is heating it — the bath too: «お風呂[ふろ] を 沸[わ]かします».'
    pt: 'O japonês tem duas palavras para água: «水[みず]» fria, «お湯[ゆ]» quente. «沸[わ]かします» é esquentar — o ofurô também: «お風呂[ふろ] を 沸[わ]かします».'
