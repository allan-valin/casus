- type: narrator
  text:
    en: A Japanese apology shows «反省[はんせい]» — that you've thought about what you did — and promises it won't happen again. Saying it in person, not by message, is what makes it count. Kenta switches to
      «俺[おれ]», the rough male I, among close friends.
    pt: Um pedido de desculpas japonês mostra «反省[はんせい]» — que você pensou no que fez — e promete que não vai se repetir. Dizer pessoalmente, e não por mensagem, é o que faz valer. O Kenta passa a usar
      «俺[おれ]», o eu masculino mais bruto, entre amigos próximos.
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil um áudio de desculpas às vezes resolve. No Japão, para coisa séria, só pessoalmente — e de preferência com um gesto, como flores ou um doce.
