    en: 'The plain «let''s» — the volitional: «る» verbs take «よう» («食[た]べよう»); others change the last sound to «お» and lengthen it: «謝[あやま]る» → «謝[あやま]ろう», «話[はな]す» → «話[はな]そう», «行[い]く» → «行[い]こう». It''s
      the casual «〜ましょう», and also I''ll (decide to).'
    pt: 'O «vamos» simples — o volitivo: verbos em «る» levam «よう» («食[た]べよう»); os outros trocam o último som por «お» e alongam: «謝[あやま]る» → «謝[あやま]ろう», «話[はな]す» → «話[はな]そう», «行[い]く» → «行[い]こう». É o «〜ましょう»
      informal, e também vou (decidi).'
