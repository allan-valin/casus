steps:
- type: narrator
  text:
    en: The rumour was true — and Misaki is upset that it spread before they told their families. Kenta asks you how to apologise. Listen to the conversation; you don't need to understand it yet.
    pt: O boato era verdade — e a Misaki está chateada porque espalhou antes de eles contarem às famílias. O Kenta pergunta como pedir desculpas. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: 美咲[みさき] が 怒[おこ]って る。 俺[おれ] が 友達[ともだち] に 言[い]っちゃった から。
    meaning:
      en: Misaki's angry. Because I told a friend.
      pt: A Misaki está brava. Porque eu contei para um amigo.
  - speaker: protagonist
    text: じゃあ、 謝[あやま]ろう。 直接[ちょくせつ] 会[あ]って 話[はな]そう よ。
    meaning:
      en: Then apologise. Meet her and talk in person.
      pt: Então pede desculpas. Encontra ela e conversa pessoalmente.
  - speaker: kenta
    text: LINE じゃ だめ？
    meaning:
      en: Not on LINE?
      pt: Pelo LINE não dá?
  - speaker: protagonist
    text: だめ。 大事[だいじ] な こと は 直接[ちょくせつ]。 花[はな] を 買[か]おう か。
    meaning:
      en: No. Important things in person. Shall we buy flowers?
      pt: Não. Coisa importante é pessoalmente. Vamos comprar flores?
  - speaker: kenta
    text: 何[なん] て 言[い]えば いい？
    meaning:
      en: What should I say?
      pt: O que eu falo?
  - speaker: protagonist
    text: 「ごめん。 反省[はんせい] して る。 もう 二度[にど] と しない。 許[ゆる]して」。
    meaning:
      en: “I'm sorry. I've thought about what I did. I'll never do it again. Forgive me.”
      pt: «Desculpa. Reconheço o erro. Nunca mais faço isso. Me perdoa.»
  - speaker: kenta
    text: よし、 今[いま] から 行[い]こう。 気持[きも]ち を 伝[つた]える。
    meaning:
      en: Right, I'll go now. I'll tell her how I feel.
      pt: Beleza, vou agora. Vou dizer o que sinto.
  - speaker: protagonist
    text: 頑張[がんば]って！ 結果[けっか]、 教[おし]えて ね。
    meaning:
      en: Good luck! Tell me how it goes.
      pt: Boa sorte! Depois me conta.
