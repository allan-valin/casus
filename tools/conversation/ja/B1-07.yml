- type: narrator
  text:
    en: 'Many nikkei know this: «ジャポネーザ» in Brazil, «外国人[がいこくじん]» in Japan. Japanese people may expect a Japanese face to speak perfect Japanese — or assume it can''t. Communities like Hamamatsu''s, with
      Brazilian shops and schools, are where many find their «居場所[いばしょ]».'
    pt: 'Muitos nikkeis conhecem isso: «ジャポネーザ» no Brasil, «外国人[がいこくじん]» no Japão. Os japoneses podem esperar que um rosto japonês fale japonês perfeito — ou achar que não fala. Comunidades como a de Hamamatsu,
      com lojas e escolas brasileiras, são onde muitos encontram o seu «居場所[いばしょ]».'
- type: narrator
