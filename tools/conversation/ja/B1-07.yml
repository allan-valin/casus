steps:
- type: narrator
  text:
    en: A shop assistant spoke to you in English, though you look Japanese. At the bakery you tell Maria — she has lived this for twenty years. Listen to the conversation; you don't need to understand it
      yet.
    pt: Um vendedor falou com você em inglês, mesmo você tendo cara de japonesa. Na padaria você conta para a Maria — ela vive isso há vinte anos. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 今日[きょう]、 店員[てんいん] に 英語[えいご] で 話[はな]されました。 見[み]た目[め] は 日本人[にほんじん] な のに。
    meaning:
      en: Today a shop assistant talked to me in English. Even though I look Japanese.
      pt: Hoje um vendedor falou comigo em inglês. Mesmo eu tendo cara de japonesa.
  - speaker: maria
    text: 気持[きも]ち、 わかる よ。 私[わたし] も ブラジル で は「ジャポネーザ」 だった。
    meaning:
      en: I know how you feel. In Brazil I was “the Japanese girl”.
      pt: Entendo o que você sente. No Brasil eu era «a japonesa».
  - speaker: protagonist
    text: 日本[にほん] で は 外国人[がいこくじん]、 ブラジル で は 日本人[にほんじん]。 中途半端[ちゅうとはんぱ] です ね。
    meaning:
      en: In Japan a foreigner, in Brazil Japanese. Neither one nor the other.
      pt: No Japão estrangeira, no Brasil japonesa. Nem uma coisa nem outra.
  - speaker: maria
    text: 私[わたし] も そう 思[おも]った。 日本語[にほんご] を 勉強[べんきょう] した のに、 まだ 外国人[がいこくじん]。
    meaning:
      en: I thought so too. I studied Japanese, and still a foreigner.
      pt: Eu também achava. Estudei japonês, e ainda assim estrangeira.
  - speaker: protagonist
    text: 自分[じぶん] の 居場所[いばしょ] は どこ だろう。
    meaning:
      en: Where do I belong, I wonder.
      pt: Onde será que é o meu lugar?
  - speaker: maria
    text: 今[いま] は 両方[りょうほう] だ と 思[おも]う。 ブラジル も 日本[にほん] も、 私[わたし] の 国[くに]。
    meaning:
      en: Now I think it's both. Brazil and Japan are both my countries.
      pt: Hoje acho que são os dois. O Brasil e o Japão, os dois são meu país.
  - speaker: protagonist
    text: 両方[りょうほう] か。 いい です ね。
    meaning:
      en: Both, huh. That's nice.
      pt: Os dois, é? Que bom.
  - speaker: maria
    text: この パン屋[や] が 私[わたし] の 居場所[いばしょ]。 あなた も いつでも 来[き]て ね。
    meaning:
      en: This bakery is where I belong. Come any time, you too.
      pt: Esta padaria é o meu lugar. Venha quando quiser, você também.
