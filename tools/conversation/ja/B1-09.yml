- type: narrator
  text:
    en: 'Hearsay: a plain sentence plus «そう です» — «同[おな]じ だ そう です», I hear it''s the same. Don''t mix it up with «おいしそう», looks delicious: there «そう» joins the stem; here it follows a whole sentence and
      means people say.'
    pt: 'Ouvi dizer: frase simples mais «そう です» — «同[おな]じ だ そう です», dizem que é igual. Não confunda com «おいしそう», parece gostoso: lá o «そう» cola no radical; aqui vem depois da frase inteira e quer dizer
      dizem que.'
- type: prompt
  ask:
    en: 'Say the hearsay ending: I hear that…'
    pt: 'Diga a terminação de ouvir dizer: dizem que…'
  answer:
    speaker: protagonist
    text: 〜そう だ
  items:
  - souda-hearsay
- type: prompt
  ask:
    en: 'Say: I hear there are many.'
    pt: 'Diga: dizem que são muitos.'
  answer:
    speaker: protagonist
    text: 多[おお]い そう です。
  items:
  - ooi-sou-desu
- type: narrator
  text:
    en: This survey is the factory's own, in the story. When you quote real figures, «〜そう です» or «〜に よると» — according to — tells people it's something you heard or read, not your own claim.
    pt: Esta pesquisa é da própria fábrica, na história. Quando citar números reais, «〜そう です» ou «〜に よると» — segundo — mostra que é algo que você ouviu ou leu, não uma afirmação sua.
- type: narrator
  for:
  - pt
  text:
    pt: 'Quem interpreta números tem uma regra de ouro nos dois idiomas: diga de onde veio o dado. Em japonês o próprio «そう です» já faz esse serviço.'
