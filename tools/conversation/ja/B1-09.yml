steps:
- type: narrator
  text:
    en: The factory ran an anonymous survey of its younger workers. Chief Sato asks you to translate the results for the Brazilian staff. Listen to the conversation; you don't need to understand it yet.
    pt: A fábrica fez uma pesquisa anônima com os funcionários mais jovens. A chefe Sato pede que você traduza os resultados para os brasileiros. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sato
    text: これ が 若[わか]い 社員[しゃいん] の 調査[ちょうさ] の 結果[けっか] です。
    meaning:
      en: These are the results of the survey of young employees.
      pt: Este é o resultado da pesquisa com os funcionários jovens.
  - speaker: protagonist
    text: 回答[かいとう] は 何人[なんにん] です か。
    meaning:
      en: How many answered?
      pt: Quantos responderam?
  - speaker: sato
    text: 二百人[にひゃくにん] です。 平均[へいきん] 年齢[ねんれい] は 二十七歳[にじゅうななさい]。
    meaning:
      en: Two hundred. The average age is 27.
      pt: Duzentos. A idade média é 27 anos.
  - speaker: protagonist
    text: 「残業[ざんぎょう] を 減[へ]らしたい」 が 半数[はんすう] 以上[いじょう] です ね。
    meaning:
      en: More than half say “I want less overtime”.
      pt: Mais da metade diz «quero menos hora extra».
  - speaker: sato
    text: ええ。 ほか の 会社[かいしゃ] でも 同[おな]じ 割合[わりあい] だ そう です。
    meaning:
      en: Yes. I hear the rate is the same at other companies.
      pt: Sim. Dizem que em outras empresas a proporção é a mesma.
  - speaker: protagonist
    text: ブラジル 人[じん] の 回答[かいとう] も ある ん です か。
    meaning:
      en: Are there answers from Brazilians too?
      pt: Tem respostas dos brasileiros também?
  - speaker: sato
    text: はい、 ポルトガル語[ご] の 調査[ちょうさ] も ありました。 その 統計[とうけい] を 訳[やく]して ください。
    meaning:
      en: Yes, there was a Portuguese version. Please translate those statistics.
      pt: Sim, teve a pesquisa em português também. Traduza essas estatísticas, por favor.
  - speaker: protagonist
    text: わかりました。 明日[あした] まで に 訳[やく]して おきます。
    meaning:
      en: Understood. I'll have it translated by tomorrow.
      pt: Entendido. Até amanhã deixo traduzido.
