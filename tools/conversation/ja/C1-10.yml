steps:
- type: narrator
  text:
    en: Kenta and Misaki have a baby girl. You visit with a gift; Misaki tells you about the shrine visit next month — and gives you something back. Listen to the conversation; you don't need to understand
      it yet.
    pt: O Kenta e a Misaki tiveram uma menina. Você visita com um presente; a Misaki conta da visita ao santuário no mês que vem — e te dá algo em troca. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: ご出産[しゅっさん] おめでとう ございます。 これ、 出産[しゅっさん] 祝[いわ]い です。
    meaning:
      en: Congratulations on the birth. Here's a little gift.
      pt: Parabéns pelo nascimento. Aqui, um presentinho.
  - speaker: misaki
    text: ありがとう！ 抱[だ]っこ して みる？
    meaning:
      en: Thank you! Want to hold her?
      pt: Obrigada! Quer pegar no colo?
  - speaker: protagonist
    text: いい ん です か。 …可愛[かわい]い！ 名前[なまえ] は？
    meaning:
      en: Can I? …So cute! What's her name?
      pt: Posso? …Que fofa! Como ela se chama?
  - speaker: kenta
    text: 陽菜[ひな]。 名付[なづ]け に 一週間[いっしゅうかん] かかった よ。
    meaning:
      en: Hina. The naming took us a week.
      pt: Hina. Levamos uma semana para escolher o nome.
  - speaker: misaki
    text: 健太[けんた] は 夜[よる] も 寝[ね]ず に 名前[なまえ] の 本[ほん] を 読[よ]んで いた の。
    meaning:
      en: Kenta read baby-name books without sleeping at night.
      pt: O Kenta lia livro de nomes à noite sem dormir.
  - speaker: protagonist
    text: 来月[らいげつ] は お宮参[みやまい]り です か。
    meaning:
      en: Is the shrine visit next month?
      pt: A visita ao santuário é mês que vem?
  - speaker: misaki
    text: そう。 浜松[はままつ] の 神社[じんじゃ] で。 あ、 これ は 内祝[うちいわ]い。 気[き] を 遣[つか]わず に 受[う]け取[と]って ね。
    meaning:
      en: Yes, at a Hamamatsu shrine. Oh, and this is our return gift. Take it without worrying.
      pt: Isso, num santuário de Hamamatsu. Ah, e isto é a nossa lembrança. Pode aceitar sem cerimônia.
  - speaker: protagonist
    text: ありがとう ございます。 陽菜[ひな] ちゃん、 元気[げんき] に 大[おお]きく なって ね。
    meaning:
      en: Thank you. Hina, grow up big and healthy.
      pt: Obrigado. Hina, cresça forte e com saúde.
