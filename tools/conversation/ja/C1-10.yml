- type: narrator
  text:
    en: 'A birth brings gifts both ways: friends give «出産[しゅっさん] 祝[いわ]い», and the family later sends «内祝[うちいわ]い», usually worth about half. Around a month after birth comes «お宮参[みやまい]り», the baby''s first
      visit to a shrine, often with grandparents.'
    pt: 'O nascimento traz presentes nos dois sentidos: os amigos dão «出産[しゅっさん] 祝[いわ]い», e a família depois envia o «内祝[うちいわ]い», em geral de cerca de metade do valor. Cerca de um mês depois do parto vem
      a «お宮参[みやまい]り», a primeira visita do bebê ao santuário, muitas vezes com os avós.'
