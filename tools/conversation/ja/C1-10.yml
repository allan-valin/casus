- type: narrator
  text:
    en: '«〜ず に» is without doing — the written cousin of «〜ないで»: «寝[ね]ず に», without sleeping; «気[き] を 遣[つか]わず に», without worrying about it. «する» becomes «せず に».'
    pt: '«〜ず に» é sem fazer — o primo escrito do «〜ないで»: «寝[ね]ず に», sem dormir; «気[き] を 遣[つか]わず に», sem se preocupar. «する» vira «せず に».'
