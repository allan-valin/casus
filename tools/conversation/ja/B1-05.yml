steps:
- type: narrator
  text:
    en: Shota, Kenta's teammate you've been seeing since the summer festival, takes you to meet his parents. Their tea farm is outside Shizuoka. Listen to the conversation; you don't need to understand
      it yet.
    pt: O Shota, colega de time do Kenta com quem você sai desde o festival de verão, leva você para conhecer os pais dele. A plantação de chá deles fica perto de Shizuoka. Escute a conversa; ainda não
      precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: お邪魔[じゃま] します。 初[はじ]めて お目[め] に かかります。
    meaning:
      en: Excuse me for intruding. It's an honour to meet you.
      pt: Com licença. É uma honra conhecê-los.
  - speaker: shota-haha
    text: いらっしゃい。 どうぞ、 上[あ]がって ください。
    meaning:
      en: Welcome. Please come in.
      pt: Seja bem-vinda. Entre, por favor.
  - speaker: protagonist
    text: これ、 つまらない もの です が…
    meaning:
      en: This is just a little something…
      pt: Isto é só uma lembrancinha…
  - speaker: shota-haha
    text: まあ、 ご丁寧[ていねい] に。 ありがとう ございます。
    meaning:
      en: Oh, how kind of you. Thank you.
      pt: Ah, que gentileza. Muito obrigada.
  - speaker: shota-chichi
    text: 足[あし] を 崩[くず]して ください。 正座[せいざ] は 大変[たいへん] でしょう。
    meaning:
      en: Please sit comfortably. Kneeling must be hard.
      pt: Sente-se à vontade. Ficar de joelhos deve ser difícil.
  - speaker: protagonist
    text: ありがとう ございます。 では、 失礼[しつれい] します。
    meaning:
      en: Thank you. Then, excuse me.
      pt: Obrigada. Então, com licença.
  - speaker: shota-haha
    text: うち の お茶[ちゃ] です。 どうぞ。
    meaning:
      en: Our own tea. Please.
      pt: É o nosso chá. Sirva-se.
  - speaker: protagonist
    text: 頂戴[ちょうだい] します。 …おいしい！ 翔太[しょうた] さん の ご両親[りょうしん] の お茶[ちゃ] です ね。
    meaning:
      en: Thank you, I will. …Delicious! This is your own tea, then.
      pt: Aceito com prazer. …Que delícia! É o chá da família do Shota.
  - speaker: shota
    text: ほら、 大丈夫[だいじょうぶ] だった でしょ。
    meaning:
      en: See, it went fine, didn't it.
      pt: Viu, deu tudo certo, não deu?
