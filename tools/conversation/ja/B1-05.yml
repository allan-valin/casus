  text:
    en: 'Visiting a home is full of set phrases: «お邪魔[じゃま] します» on entering — literally, I''m intruding; «初[はじ]めて お目[め] に かかります», a humble it''s an honour to meet you; «つまらない もの です が…» with the gift — it''s
      nothing much. They''re said whole, like «よろしく お願[ねが]いします».'
    pt: 'Visitar uma casa é cheio de frases prontas: «お邪魔[じゃま] します» ao entrar — ao pé da letra, estou atrapalhando; «初[はじ]めて お目[め] に かかります», um humilde é uma honra conhecê-los; «つまらない もの です が…» com o presente
      — não é nada de mais. Elas se dizem inteiras, como «よろしく お願[ねが]いします».'
