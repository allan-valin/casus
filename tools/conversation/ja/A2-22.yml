steps:
- type: narrator
  text:
    en: You put an old chair out with the burnable rubbish. Next morning it's still there — with a sticker from the town. Mrs Suzuki explains. Listen to the conversation; you don't need to understand it
      yet.
    pt: Você pôs uma cadeira velha junto com o lixo queimável. Na manhã seguinte ela continua lá — com um adesivo da prefeitura. A senhora Suzuki explica. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: この 椅子[いす] は 粗大[そだい] ごみ です よ。 普通[ふつう] の 日[ひ] に 出[だ]さないで ください。
    meaning:
      en: This chair is bulky waste. Please don't put it out on normal days.
      pt: Esta cadeira é lixo volumoso. Não ponha para fora em dia normal, por favor.
  - speaker: protagonist
    text: すみません。 どう すれば いい です か。
    meaning:
      en: Sorry. What should I do?
      pt: Desculpe. O que eu faço?
  - speaker: suzuki
    text: まず 電話[でんわ] で 申[もう]し込[こ]み を します。 回収[かいしゅう] の 日[ひ] を 決[き]めます。
    meaning:
      en: First you book by phone. You set a pickup day.
      pt: Primeiro agenda por telefone. Marca o dia da coleta.
  - speaker: protagonist
    text: お金[かね] は かかります か。
    meaning:
      en: Does it cost money?
      pt: Custa dinheiro?
  - speaker: suzuki
    text: はい。 シール 券[けん] を 買[か]って、 椅子[いす] に 貼[は]ります。 コンビニ で 買[か]えます よ。
    meaning:
      en: Yes. You buy a sticker ticket and stick it on the chair. You can buy them at a convenience store.
      pt: Sim. Você compra um adesivo e cola na cadeira. Dá para comprar na loja de conveniência.
  - speaker: protagonist
    text: わかりました。 公園[こうえん] に 捨[す]てて も いい です か… 冗談[じょうだん] です。
    meaning:
      en: Got it. Can I dump it in the park… just kidding.
      pt: Entendi. Posso largar no parque… brincadeira.
  - speaker: suzuki
    text: 絶対[ぜったい] に 捨[す]てないで ください！ 罰金[ばっきん] です よ。
    meaning:
      en: Don't ever dump it! There's a fine.
      pt: Não largue de jeito nenhum! Dá multa.
  - speaker: protagonist
    text: はい、 明日[あした] 電話[でんわ] します。
    meaning:
      en: Yes, I'll call tomorrow.
      pt: Certo, ligo amanhã.
