- type: narrator
  text:
    en: Japanese campaign law limits posters, flyers and home visits, so candidates rely on «選挙[せんきょ] カー» repeating their names and on morning speeches at stations. Foreign residents can't vote in national
      or local elections, but cities like Hamamatsu have policies — and candidates — for «多文化[たぶんか] 共生[きょうせい]».
    pt: A lei eleitoral japonesa limita cartazes, panfletos e visitas de casa em casa, então os candidatos contam com o «選挙[せんきょ] カー» repetindo o nome e com discursos de manhã nas estações. Estrangeiros
      residentes não votam nem em eleição nacional nem local, mas cidades como Hamamatsu têm políticas — e candidatos — de «多文化[たぶんか] 共生[きょうせい]».
