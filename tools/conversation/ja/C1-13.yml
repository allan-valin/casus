steps:
- type: narrator
  text:
    en: A city election. A loudspeaker car drives past shouting a candidate's name over and over. At the station, the candidate shakes your hand. Listen to the conversation; you don't need to understand
      it yet.
    pt: Eleição municipal. Um carro de som passa gritando o nome de um candidato sem parar. Na estação, o candidato aperta a sua mão. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kouhosha
    text: 「田中[たなか]、 田中[たなか] で ございます！ よろしく お願[ねが]い します！」
    meaning:
      en: “Tanaka, this is Tanaka! I'm counting on you!”
      pt: «Tanaka, aqui é o Tanaka! Conto com vocês!»
  - speaker: protagonist
    text: 選挙[せんきょ] カー って、 名前[なまえ] を 言[い]う だけ です ね。 ちょっと うるさい。
    meaning:
      en: Loudspeaker cars just say the name, don't they. A bit noisy.
      pt: Carro de som só fala o nome, né? Meio barulhento.
  - speaker: suzuki
    text: 日本[にほん] で は、 名前[なまえ] を 覚[おぼ]えて もらう の が 一番[いちばん] 大事[だいじ] なん です よ。
    meaning:
      en: In Japan, getting people to remember your name matters most.
      pt: No Japão, o mais importante é fazer as pessoas lembrarem o nome.
  - speaker: protagonist
    text: 公約[こうやく] は 何[なん] です か。
    meaning:
      en: What are the campaign promises?
      pt: E quais são as promessas de campanha?
  - speaker: suzuki
    text: 駅前[えきまえ] で 街頭[がいとう] 演説[えんぜつ] が ある から、 聞[き]いて みましょう。
    meaning:
      en: There's a street speech at the station, let's go and listen.
      pt: Tem discurso na frente da estação, vamos ouvir.
  - speaker: kouhosha
    text: 市民[しみん] と とも に、 多文化[たぶんか] 共生[きょうせい] の 町[まち] を 作[つく]ります！
    meaning:
      en: Together with the citizens, I'll build a town of multicultural coexistence!
      pt: Junto com os cidadãos, vou construir uma cidade de convivência multicultural!
  - speaker: protagonist
    text: 外国人[がいこくじん] は 投票[とうひょう] できない のに、 握手[あくしゅ] して くれました。
    meaning:
      en: Foreigners can't vote, but he shook my hand.
      pt: Estrangeiro não vota, mas ele apertou a minha mão.
  - speaker: suzuki
    text: 浜松[はままつ] で は 外国人[がいこくじん] 市民[しみん] も 大事[だいじ] な 住民[じゅうみん] です から ね。
    meaning:
      en: In Hamamatsu foreign residents are important members of the community too.
      pt: Em Hamamatsu os moradores estrangeiros também são cidadãos importantes.
