- type: narrator
  text:
    en: 'Japanese business emails are built from fixed parts: the name with «様[さま]», «お世話[せわ] に なって おります», your name and company, the business itself, then «よろしく お願[ねが]い いたします» and a signature block. «お
      + verb stem + する» is a humble way to do something for the other person: «お送[おく]り します».'
    pt: 'Os e-mails de trabalho japoneses são montados com peças fixas: o nome com «様[さま]», «お世話[せわ] に なって おります», seu nome e empresa, o assunto em si, depois «よろしく お願[ねが]い いたします» e um bloco de assinatura.
      «お + radical do verbo + する» é um jeito humilde de fazer algo para o outro: «お送[おく]り します».'
- type: narrator
  for:
  - pt
  text:
    pt: O e-mail brasileiro de trabalho já é formal com «Prezado» e «Atenciosamente». O japonês tem mais peças obrigatórias — mas, decoradas, servem para quase tudo.
