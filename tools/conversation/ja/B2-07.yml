steps:
- type: narrator
  text:
    en: 'Your first business email in Japanese: sending a supplier the translated manual. Chief Sato reads your draft — it starts with «こんにちは». Listen to the conversation; you don''t need to understand
      it yet.'
    pt: 'Seu primeiro e-mail de trabalho em japonês: enviar a um fornecedor o manual traduzido. A chefe Sato lê o rascunho — começa com «こんにちは». Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: sato
    text: メール の 最初[さいしょ] は「こんにちは」 じゃ なくて、「お世話[せわ] に なって おります」 です。
    meaning:
      en: An email doesn't start with “konnichiwa” but with “osewa ni natte orimasu”.
      pt: O e-mail não começa com «konnichiwa», e sim com «osewa ni natte orimasu».
  - speaker: protagonist
    text: お世話[せわ] に なって おります… 毎回[まいかい] 書[か]く ん です か。
    meaning:
      en: Osewa ni natte orimasu… Do I write it every time?
      pt: Osewa ni natte orimasu… Escrevo toda vez?
  - speaker: sato
    text: はい、 毎回[まいかい] です。 相手[あいて] の 名前[なまえ] に は「様[さま]」 を つけて。
    meaning:
      en: Yes, every time. Add “sama” to the other person's name.
      pt: Sim, toda vez. Coloque «sama» depois do nome da pessoa.
  - speaker: protagonist
    text: 山田[やまだ] 様[さま]、 お世話[せわ] に なって おります。 マニュアル を 添付[てんぷ] で お送[おく]り します。
    meaning:
      en: Mr Yamada, thank you for your continued support. I'm sending the manual as an attachment.
      pt: Sr. Yamada, agradecemos a parceria. Envio o manual em anexo.
  - speaker: sato
    text: いい です ね。 件名[けんめい] も わかりやすく。「マニュアル 送付[そうふ] の 件[けん]」 とか。
    meaning:
      en: 'Good. Make the subject line clear too. Like “Re: sending the manual”.'
      pt: Bom. Deixe o assunto claro também. Tipo «Envio do manual».
  - speaker: protagonist
    text: 最後[さいご] は？
    meaning:
      en: And the ending?
      pt: E o final?
  - speaker: sato
    text: 「ご確認[かくにん] ください。 よろしく お願[ねが]い いたします」。 それから 署名[しょめい]。
    meaning:
      en: “Please check it. Yoroshiku onegai itashimasu.” Then your signature.
      pt: «Favor conferir. Yoroshiku onegai itashimasu.» Depois a assinatura.
  - speaker: protagonist
    text: 失礼[しつれい] が ない ように、 送[おく]る 前[まえ] に 見[み]て いただけます か。
    meaning:
      en: So I'm not rude, could you check it before I send?
      pt: Para eu não ser indelicada, a senhora pode olhar antes de eu enviar?
