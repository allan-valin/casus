steps:
- type: narrator
  text:
    en: After the late shift Kenta takes you to his favourite ramen shop. You order at a ticket machine. Listen to the conversation; you don't need to understand it yet.
    pt: Depois do turno da noite o Kenta leva você ao lámen preferido dele. Pede-se numa máquina de tíquetes. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: お腹[なか] が 空[す]きました ね。 何[なに] が いい です か。
    meaning:
      en: I'm hungry. What would you like?
      pt: Que fome. O que você quer?
  - speaker: protagonist
    text: 辛[から]い ラーメン が 食[た]べたい です。
    meaning:
      en: I want to eat spicy ramen.
      pt: Quero comer um lámen apimentado.
  - speaker: kenta
    text: じゃあ、 券売機[けんばいき] で この ボタン です。 大盛[おおも]り も ありますよ。
    meaning:
      en: Then it's this button on the ticket machine. There's a large size too.
      pt: Então é este botão na máquina. Tem porção grande também.
  - speaker: protagonist
    text: 大盛[おおも]り に します。 ビール も 飲[の]みたい です。
    meaning:
      en: I'll have the large. I want a beer too.
      pt: Vou de porção grande. Quero uma cerveja também.
  - speaker: kenta
    text: 明日[あした] も 仕事[しごと] です よ。
    meaning:
      en: We work tomorrow too, you know.
      pt: Amanhã tem trabalho também, hein.
  - speaker: protagonist
    text: じゃあ、 お水[みず] で。
    meaning:
      en: Water, then.
      pt: Então, água.
  - speaker: kenta
    text: 熱[あつ]い から 気[き] を つけて。 すすって も いい です よ。
    meaning:
      en: It's hot, careful. You can slurp.
      pt: Está quente, cuidado. Pode sorver fazendo barulho.
  - speaker: protagonist
    text: すすって も いい？ ブラジル で は だめ です よ！
    meaning:
      en: Slurping is okay? In Brazil it's rude!
      pt: Pode fazer barulho? No Brasil é falta de educação!
