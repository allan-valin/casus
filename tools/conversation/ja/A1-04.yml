- type: narrator
  text:
    en: Lunch at the convenience store near the factory. The manager is at the till. Listen to the conversation; you don't need to understand it yet.
    pt: Almoço na loja de conveniência perto da fábrica. O gerente está no caixa. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: tencho
    text: いらっしゃいませ。
    meaning:
      en: Welcome.
      pt: Bem-vindo.
  - speaker: protagonist
    text: これ ください。
    meaning:
      en: This, please.
      pt: Isto, por favor.
  - speaker: tencho
    text: お弁当[べんとう] です ね。 温[あたた]めます か。
    meaning:
      en: A lunch box. Shall I heat it?
      pt: Uma marmita. Quer que esquente?
  - speaker: protagonist
    text: はい、 お願[ねが]いします。
    meaning:
      en: Yes, please.
      pt: Sim, por favor.
  - speaker: tencho
    text: 袋[ふくろ] は？
    meaning:
      en: A bag?
      pt: Sacola?
  - speaker: protagonist
    text: いいえ、 いりません。 いくら です か。
    meaning:
      en: No, I don't need one. How much is it?
      pt: Não, não preciso. Quanto é?
  - speaker: tencho
    text: 五百[ごひゃく] 円[えん] です。
    meaning:
      en: Five hundred yen.
      pt: Quinhentos ienes.
  - speaker: protagonist
    text: カード で お願[ねが]いします。
    meaning:
      en: By card, please.
      pt: No cartão, por favor.
  - speaker: tencho
    text: ありがとう ございました。
    meaning:
      en: Thank you very much.
      pt: Muito obrigado.
- type: narrator
  text:
    en: Staff greet you with «いらっしゃいませ». You don't answer it — a small nod is enough.
    pt: Os funcionários dizem «いらっしゃいませ». Não se responde — basta um aceno de cabeça.
