steps:
- type: narrator
  text:
    en: Ōno-sensei is retiring after twenty years leading the taiko group. You've been asked to read the thank-you certificate at her farewell. Listen to the conversation; you don't need to understand it
      yet.
    pt: A professora Ōno vai se aposentar depois de vinte anos à frente do grupo de taikô. Pediram para você ler o certificado de agradecimento na despedida. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 感謝状[かんしゃじょう]。 大野[おおの] 先生[せんせい]。
    meaning:
      en: Certificate of thanks. To Ōno-sensei.
      pt: Certificado de agradecimento. À professora Ōno.
  - speaker: protagonist
    text: あなた は 二十年[にじゅうねん] の 長[なが]い 間[あいだ]、 私[わたし]たち を ご指導[しどう] くださいました。 ここ に 感謝[かんしゃ] の 意[い] を 表[ひょう]します。
    meaning:
      en: For twenty long years you have guided us. We hereby express our gratitude.
      pt: Por vinte longos anos a senhora nos orientou. Aqui expressamos nossa gratidão.
  - speaker: taiko-sensei
    text: ありがとう… 思[おも]い出[で] が たくさん あります。
    meaning:
      en: Thank you… I have so many memories.
      pt: Obrigada… tenho tantas lembranças.
  - speaker: kenta
    text: 雨[あめ] の 中[なか] の 初[はつ] 本番[ほんばん]、 覚[おぼ]えて います か。
    meaning:
      en: Do you remember our first performance in the rain?
      pt: A senhora lembra da primeira apresentação na chuva?
  - speaker: taiko-sensei
    text: もちろん。 ブラジル から 来[き]た 人[ひと] が サンバ の リズム で 叩[たた]いて いた わ。
    meaning:
      en: Of course. The one from Brazil was drumming in samba rhythm.
      pt: Claro. O que veio do Brasil estava tocando no ritmo do samba.
  - speaker: protagonist
    text: 先生[せんせい] の ご指導[しどう] は 決[けっ]して 忘[わす]れません。 これ から は 私[わたし]たち が 引[ひ]き継[つ]ぎます。
    meaning:
      en: We will never forget your teaching. From now on we'll carry it on.
      pt: Nunca vamos esquecer os seus ensinamentos. Daqui em diante, nós damos continuidade.
  - speaker: kenta
    text: 長[なが]い 間[あいだ]、 本当[ほんとう] に お疲[つか]れさま でした！
    meaning:
      en: Thank you so much for all your years!
      pt: Muito obrigado por todos esses anos!
  - speaker: taiko-sensei
    text: 心[こころ] から ありがとう。 太鼓[たいこ] は みんな の もの です よ。
    meaning:
      en: Thank you from my heart. The taiko belongs to all of you.
      pt: Obrigada do fundo do coração. O taikô é de vocês.
