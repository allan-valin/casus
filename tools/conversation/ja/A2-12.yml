steps:
- type: narrator
  text:
    en: A Sunday drive with Kenta along Lake Hamana to the sea. On a clear day, Mount Fuji far to the east. Listen to the conversation; you don't need to understand it yet.
    pt: Um passeio de carro no domingo com o Kenta, pelo lago Hamana até o mar. Num dia claro, o monte Fuji longe, a leste. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: ほら、 浜名湖[はまなこ] だ よ。
    meaning:
      en: Look, Lake Hamana.
      pt: Olha, o lago Hamana.
  - speaker: protagonist
    text: 広[ひろ]い！ 湖[みずうみ] と 海[うみ] が つながって いる？
    meaning:
      en: It's big! Are the lake and the sea connected?
      pt: Que grande! O lago e o mar se ligam?
  - speaker: kenta
    text: うん。 だから 水[みず] が 少[すこ]し しょっぱい。 うなぎ が 名物[めいぶつ] だ よ。
    meaning:
      en: Yeah. So the water's a bit salty. Eel is the local speciality.
      pt: É. Por isso a água é meio salgada. A enguia é a especialidade daqui.
  - speaker: protagonist
    text: あ、 あれ は 富士山[ふじさん]？
    meaning:
      en: Oh, is that Mount Fuji?
      pt: Ah, aquilo é o monte Fuji?
  - speaker: kenta
    text: そう。 日本[にほん] で 一番[いちばん] 高[たか]い 山[やま]。
    meaning:
      en: Yes. The highest mountain in Japan.
      pt: É. A montanha mais alta do Japão.
  - speaker: protagonist
    text: ブラジル の 一番[いちばん] 高[たか]い 山[やま] より 高[たか]い？
    meaning:
      en: Higher than the highest mountain in Brazil?
      pt: Mais alto que a montanha mais alta do Brasil?
  - speaker: kenta
    text: 知[し]らない。 どっち？
    meaning:
      en: No idea. Which is?
      pt: Não sei. Qual é?
  - speaker: protagonist
    text: 富士山[ふじさん] の ほう が 高[たか]い。 ピコ・ダ・ネブリナ は 三千[さんぜん] メートル ぐらい。
    meaning:
      en: Fuji is higher. Pico da Neblina is about three thousand metres.
      pt: O Fuji é mais alto. O Pico da Neblina tem uns três mil metros.
