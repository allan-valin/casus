- type: narrator
  text:
    en: Lake Hamana opens to the Pacific, so its water is brackish — and Hamamatsu is famous for eel, «うなぎ», grilled with a sweet sauce. Mount Fuji, 3,776 m, is the highest in Japan.
    pt: O lago Hamana se abre para o Pacífico, então a água é salobra — e Hamamatsu é famosa pela enguia, «うなぎ», grelhada com molho adocicado. O monte Fuji, 3.776 m, é o mais alto do Japão.
- type: narrator
