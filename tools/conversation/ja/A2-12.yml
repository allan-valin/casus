    en: 'To compare: «A は B より 高[たか]い» — A is higher than B. To ask which: «どっち が 高[たか]い？», and to answer «A の ほう が 高[たか]い». The most: «一番[いちばん]» before the adjective — «一番[いちばん] 高[たか]い», the highest.'
    pt: 'Para comparar: «A は B より 高[たか]い» — A é mais alto que B. Para perguntar qual: «どっち が 高[たか]い？», e responder «A の ほう が 高[たか]い». O mais: «一番[いちばん]» antes do adjetivo — «一番[いちばん] 高[たか]い», o mais alto.'
