- type: narrator
  text:
    en: 'Most Japanese funerals are Buddhist: a «通夜[つや]» wake the evening before, the «葬式[そうしき]» next day. «香典[こうでん]» goes in a black-and-white envelope, in used notes; at the altar you offer a pinch of
      incense, «焼香[しょうこう]», bow, and follow what others do.'
    pt: 'A maioria dos funerais japoneses é budista: o velório «通夜[つや]» na véspera, à noite, o «葬式[そうしき]» no dia seguinte. O «香典[こうでん]» vai num envelope preto e branco, em notas usadas; no altar você oferece
      uma pitada de incenso, «焼香[しょうこう]», faz uma reverência e segue o que os outros fazem.'
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil o velório é abraço e choro junto. No Japão é sóbrio e silencioso — a fórmula baixinha e a reverência dizem tudo.
