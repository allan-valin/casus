- type: narrator
  text:
    en: 'Condolences are fixed formulas, said softly and briefly: «この 度[たび] は ご愁傷様[しゅうしょうさま] です» or, more formal, «心[こころ] より お悔[く]やみ 申[もう]し上[あ]げます». Avoid words that repeat («重[かさ]ね重[がさ]ね», «たびたび»), as
      they suggest more deaths.'
    pt: 'Os pêsames são fórmulas fixas, ditas baixo e curto: «この 度[たび] は ご愁傷様[しゅうしょうさま] です» ou, mais formal, «心[こころ] より お悔[く]やみ 申[もう]し上[あ]げます». Evite palavras repetidas («重[かさ]ね重[がさ]ね», «たびたび»), que sugerem
      mais mortes.'
