steps:
- type: narrator
  text:
    en: 'The old lady from downstairs has died. Mrs Suzuki takes you to the wake: black clothes, an envelope of condolence money, incense. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'A senhora idosa do andar de baixo faleceu. A senhora Suzuki leva você ao velório: roupa preta, um envelope com dinheiro de condolências, incenso. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: suzuki
    text: 通夜[つや] で は 喪服[もふく] を 着[き]て、 数珠[じゅず] を 持[も]って 行[い]きます。
    meaning:
      en: For the wake you wear mourning clothes and bring prayer beads.
      pt: Para o velório se usa roupa de luto e se leva o rosário budista.
  - speaker: protagonist
    text: 香典[こうでん] は どう やって 渡[わた]します か。
    meaning:
      en: How do I hand over the condolence money?
      pt: Como entrego o dinheiro de condolências?
  - speaker: suzuki
    text: 受付[うけつけ] で 渡[わた]します。 新[あたら]しい お札[さつ] は 使[つか]わない で。 準備[じゅんび] して いた よう に 見[み]える から。
    meaning:
      en: At the reception desk. Don't use new notes — it looks as if you'd prepared for it.
      pt: Na recepção. Não use nota nova — parece que você já estava preparada.
  - speaker: protagonist
    text: 結婚式[けっこんしき] と 反対[はんたい] です ね。
    meaning:
      en: The opposite of a wedding.
      pt: O contrário do casamento.
  - speaker: suzuki
    text: そう。 遺族[いぞく] の 方[かた] に は「この 度[たび] は ご愁傷様[しゅうしょうさま] です」 と 小[ちい]さい 声[こえ] で。
    meaning:
      en: 'Yes. To the family, in a low voice: “Kono tabi wa goshūshōsama desu.”'
      pt: 'Isso. Para a família, em voz baixa: «Kono tabi wa goshūshōsama desu».'
  - speaker: protagonist
    text: この 度[たび] は ご愁傷様[しゅうしょうさま] です。 心[こころ] より お悔[く]やみ 申[もう]し上[あ]げます。
    meaning:
      en: My condolences on this occasion. My heartfelt sympathy.
      pt: Meus pêsames. Meus sinceros sentimentos.
  - speaker: suzuki
    text: 焼香[しょうこう] は 私[わたし] の 後[あと] に、 同[おな]じ よう に して ください。
    meaning:
      en: For the incense, do it after me, the same way.
      pt: No incenso, faça depois de mim, do mesmo jeito.
  - speaker: protagonist
    text: はい。 …いつも 新聞[しんぶん] を 一緒[いっしょ] に 読[よ]んで くれた 方[かた] でした。
    meaning:
      en: Yes. …She always read the newspaper with me.
      pt: Sim. …Ela sempre lia o jornal comigo.
