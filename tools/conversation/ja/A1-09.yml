steps:
- type: narrator
  text:
    en: At the factory you get your uniform. Kenta helps you choose a helmet. Listen to the conversation; you don't need to understand it yet.
    pt: Na fábrica você recebe o uniforme. O Kenta ajuda você a escolher um capacete. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: これ が 制服[せいふく] です。 青[あお] です。
    meaning:
      en: This is the uniform. It's blue.
      pt: Este é o uniforme. É azul.
  - speaker: protagonist
    text: きれい です ね。 ヘルメット は 何色[なにいろ] です か。
    meaning:
      en: It's nice. What colour is the helmet?
      pt: Que bonito. O capacete é de que cor?
  - speaker: kenta
    text: 白[しろ] と 黄色[きいろ] が あります。
    meaning:
      en: There are white and yellow ones.
      pt: Tem branco e amarelo.
  - speaker: protagonist
    text: 赤[あか] は？
    meaning:
      en: And red?
      pt: E vermelho?
  - speaker: kenta
    text: 赤[あか] は 課長[かちょう] の 色[いろ] です。
    meaning:
      en: Red is the chiefs' colour.
      pt: Vermelho é a cor dos chefes.
  - speaker: protagonist
    text: じゃあ、 黄色[きいろ] が 好[す]き です。
    meaning:
      en: Then I like yellow.
      pt: Então eu gosto do amarelo.
  - speaker: kenta
    text: 黄色[きいろ] は 新人[しんじん] の 色[いろ] です よ。
    meaning:
      en: Yellow is the newcomers' colour.
      pt: Amarelo é a cor dos novatos.
  - speaker: protagonist
    text: ぴったり です ね！
    meaning:
      en: Perfect, then!
      pt: Perfeito, então!
