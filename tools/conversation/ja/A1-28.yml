steps:
- type: narrator
  text:
    en: You show Mrs Suzuki an old photo of your grandmother, born in Japan, who sailed to Brazil as a child. Listen to the conversation; you don't need to understand it yet.
    pt: Você mostra à senhora Suzuki uma foto antiga da sua avó, nascida no Japão, que foi para o Brasil de navio quando criança. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: これ は 家族[かぞく] の 写真[しゃしん] です。
    meaning:
      en: This is a photo of my family.
      pt: Esta é uma foto da minha família.
  - speaker: suzuki
    text: まあ、 古[ふる]い 写真[しゃしん] です ね。 この 方[かた] は？
    meaning:
      en: Oh, an old photo. Who is this?
      pt: Nossa, que foto antiga. Quem é esta senhora?
  - speaker: protagonist
    text: 祖母[そぼ] です。 広島[ひろしま] で 生[う]まれました。
    meaning:
      en: My grandmother. She was born in Hiroshima.
      pt: É minha avó. Nasceu em Hiroshima.
  - speaker: suzuki
    text: 子供[こども] の 時[とき] に ブラジル へ？
    meaning:
      en: To Brazil as a child?
      pt: Foi para o Brasil criança?
  - speaker: protagonist
    text: はい、 船[ふね] で。 祖父[そふ] も 日本人[にほんじん] です。
    meaning:
      en: Yes, by ship. My grandfather is Japanese too.
      pt: Sim, de navio. Meu avô também é japonês.
  - speaker: suzuki
    text: じゃあ、 お母[かあ]さん は 日系[にっけい] 二世[にせい] です ね。
    meaning:
      en: So your mother is second-generation nikkei.
      pt: Então sua mãe é nikkei de segunda geração.
  - speaker: protagonist
    text: はい。 母[はは] は 二世[にせい]、 私[わたし] は 三世[さんせい] です。 でも 日本語[にほんご] は 話[はな]せません でした。
    meaning:
      en: Yes. My mother is second generation, I'm third. But I couldn't speak Japanese.
      pt: Isso. Minha mãe é segunda geração, eu sou terceira. Mas eu não falava japonês.
  - speaker: suzuki
    text: 今[いま] は 話[はな]して います よ。 おばあさん、 喜[よろこ]びます ね。
    meaning:
      en: You're speaking it now. Your grandmother would be happy.
      pt: Agora você está falando. Sua avó ficaria feliz.
