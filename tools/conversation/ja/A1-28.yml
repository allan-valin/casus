- type: narrator
  text:
    en: The first ship of Japanese emigrants reached Santos in 1908. Their children are «二世[にせい]», grandchildren «三世[さんせい]». Many came back to work in factories from 1990, when Japan opened a visa for descendants
      — that is why Hamamatsu has so many Brazilians.
    pt: O primeiro navio de imigrantes japoneses chegou a Santos em 1908. Os filhos são «二世[にせい]», os netos «三世[さんせい]». Muitos voltaram para trabalhar nas fábricas a partir de 1990, quando o Japão abriu
      um visto para descendentes — é por isso que Hamamatsu tem tantos brasileiros.
- type: narrator
