- type: narrator
  text:
    en: 'Japanese has two words for each relative: a humble one for your own family, and a polite one for someone else''s. My grandmother is «祖母[そぼ]»; hers is «おばあさん». My mother is «母[はは]»; yours is «お母[かあ]さん».'
    pt: 'O japonês tem duas palavras para cada parente: uma humilde para a sua família e uma educada para a família dos outros. Minha avó é «祖母[そぼ]»; a dela é «おばあさん». Minha mãe é «母[はは]»; a sua é «お母[かあ]さん».'
