steps:
- type: narrator
  text:
    en: You complain to Mrs Suzuki that your Japanese is slow and that you made a silly mistake at work. She answers with sayings. Listen to the conversation; you don't need to understand it yet.
    pt: Você reclama com a senhora Suzuki que seu japonês está lento e que cometeu um erro bobo no trabalho. Ela responde com provérbios. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 日本語[にほんご] が 遅[おそ]い です。 それに 今日[きょう]、 仕事[しごと] で 失敗[しっぱい] しました。
    meaning:
      en: My Japanese is slow. And today I made a mistake at work.
      pt: Meu japonês está lento. E hoje errei no trabalho.
  - speaker: suzuki
    text: 「猿[さる] も 木[き] から 落[お]ちる」 と いう ことわざ が あります よ。
    meaning:
      en: There's a saying, “even monkeys fall from trees”.
      pt: 'Tem um ditado: «até macaco cai da árvore».'
  - speaker: protagonist
    text: どう いう 意味[いみ] です か。
    meaning:
      en: What does it mean?
      pt: O que significa?
  - speaker: suzuki
    text: 上手[じょうず] な 人[ひと] も 失敗[しっぱい] します、 と いう 意味[いみ] です。
    meaning:
      en: It means even skilled people make mistakes.
      pt: Significa que até quem é bom erra.
  - speaker: protagonist
    text: いい ことわざ です ね。 日本語[にほんご] の ため の ことわざ も あります か。
    meaning:
      en: Nice saying. Is there one for learning Japanese?
      pt: Que ditado bom. Tem um para quem aprende japonês?
  - speaker: suzuki
    text: 「石[いし] の 上[うえ] に も 三年[さんねん]」。 冷[つめ]たい 石[いし] も、 三年[さんねん] 座[すわ]る と 温[あたた]かく なります。
    meaning:
      en: “Three years even on a stone.” Sit on a cold stone three years and it gets warm.
      pt: «Três anos até em cima de uma pedra.» Sente três anos numa pedra fria e ela esquenta.
  - speaker: protagonist
    text: 我慢[がまん] です ね。
    meaning:
      en: 'So: patience.'
      pt: 'Ou seja: paciência.'
  - speaker: suzuki
    text: そう。 ブラジル に も ことわざ が あります か。
    meaning:
      en: Yes. Does Brazil have sayings too?
      pt: Isso. O Brasil também tem ditados?
