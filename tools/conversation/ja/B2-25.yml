steps:
- type: narrator
  text:
    en: Two days a week you now work from home. An online meeting with Chief Sato — and a contract that still needs a stamp in the office. Listen to the conversation; you don't need to understand it yet.
    pt: Dois dias por semana você agora trabalha de casa. Uma reunião online com a chefe Sato — e um contrato que ainda precisa de carimbo no escritório. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sato
    text: もしもし、 聞[き]こえます か。
    meaning:
      en: Hello, can you hear me?
      pt: Alô, está me ouvindo?
  - speaker: protagonist
    text: すみません、 音[おと] が 聞[き]こえません… あ、 ミュート でした。
    meaning:
      en: Sorry, I can't hear… ah, I was on mute.
      pt: Desculpe, não estou ouvindo… ah, estava no mudo.
  - speaker: sato
    text: 在宅[ざいたく] 勤務[きんむ] は どう です か。
    meaning:
      en: How's working from home?
      pt: Como está o trabalho em casa?
  - speaker: protagonist
    text: 集中[しゅうちゅう] できます。 ちょうど 翻訳[ほんやく] が 終[お]わった ところ です。
    meaning:
      en: I can concentrate. I've just finished the translation.
      pt: Consigo me concentrar. Acabei de terminar a tradução.
  - speaker: sato
    text: よかった。 契約書[けいやくしょ] は どう？
    meaning:
      en: Good. What about the contract?
      pt: Ótimo. E o contrato?
  - speaker: protagonist
    text: 今[いま] 確認[かくにん] して いる ところ です が、 判子[はんこ] が 必要[ひつよう] です。
    meaning:
      en: I'm in the middle of checking it, but it needs a stamp.
      pt: Estou conferindo agora, mas precisa de carimbo.
  - speaker: sato
    text: まだ 電子[でんし] 印鑑[いんかん] に なって いない ん です よね。 明日[あした] 出社[しゅっしゃ] できます か。
    meaning:
      en: It's not on electronic seals yet, is it. Can you come in tomorrow?
      pt: Ainda não passou para carimbo eletrônico, né? Você pode ir ao escritório amanhã?
  - speaker: protagonist
    text: はい、 判子[はんこ] の ため に 出社[しゅっしゃ] します。 ちょうど 今[いま]、 お昼[ひる] に 行[い]く ところ でした。
    meaning:
      en: Yes, I'll come in for the stamp. I was just about to go for lunch.
      pt: Sim, vou ao escritório pelo carimbo. Eu estava prestes a sair para almoçar.
