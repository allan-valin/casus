- type: narrator
  text:
    en: 'The pandemic pushed Japanese offices online, but paper and the «判子[はんこ]» kept pulling people back in: «判子[はんこ] 出社[しゅっしゃ]», going in just to stamp documents, became a phrase. The government has
      since cut hanko from most of its procedures, and electronic seals are spreading.'
    pt: 'A pandemia levou os escritórios japoneses para o online, mas o papel e o «判子[はんこ]» puxavam as pessoas de volta: «判子[はんこ] 出社[しゅっしゃ]», ir ao escritório só para carimbar, virou expressão. O governo
      já tirou o carimbo da maioria dos seus procedimentos, e o carimbo eletrônico está se espalhando.'
- type: narrator
  for:
