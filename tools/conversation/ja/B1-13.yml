steps:
- type: narrator
  text:
    en: Saturday morning after the team's drinking night. Your head hurts. Kenta calls — and Mrs Suzuki brings clam soup. Listen to the conversation; you don't need to understand it yet.
    pt: Sábado de manhã, depois da noitada do time. Sua cabeça dói. O Kenta liga — e a senhora Suzuki traz uma sopa de mariscos. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: おはよう。 大丈夫[だいじょうぶ]？ 昨日[きのう]、 飲[の]みすぎた ね。
    meaning:
      en: Morning. You okay? You drank too much yesterday.
      pt: Bom dia. Tudo bem? Ontem você bebeu demais.
  - speaker: protagonist
    text: 頭[あたま] が 痛[いた]い… 気持[きも]ち 悪[わる]い。 二日酔[ふつかよ]い だ。
    meaning:
      en: My head hurts… I feel sick. A hangover.
      pt: Minha cabeça dói… estou enjoada. É ressaca.
  - speaker: kenta
    text: カラオケ で サンバ を 踊[おど]った の、 覚[おぼ]えて る？
    meaning:
      en: Do you remember dancing samba at karaoke?
      pt: Lembra que você sambou no karaokê?
  - speaker: protagonist
    text: 覚[おぼ]えて ない！ 私[わたし]、 何[なに] した？ 恥[は]ずかしい こと？
    meaning:
      en: I don't remember! What did I do? Something embarrassing?
      pt: Não lembro! O que eu fiz? Alguma coisa vergonhosa?
  - speaker: kenta
    text: 大丈夫[だいじょうぶ]、 みんな 楽[たの]しかった よ。 水[みず] を たくさん 飲[の]んで ね。
    meaning:
      en: It's fine, everyone had fun. Drink lots of water.
      pt: Tranquilo, todo mundo se divertiu. Beba bastante água.
  - speaker: suzuki
    text: 顔色[かおいろ] が 悪[わる]い です よ。 しじみ 汁[じる] を 作[つく]りました。
    meaning:
      en: You look pale. I made clam soup.
      pt: Você está pálida. Fiz uma sopa de mariscos.
  - speaker: protagonist
    text: ありがとう ございます… 昨日[きのう] は 食[た]べすぎ と 飲[の]みすぎ でした。
    meaning:
      en: Thank you… yesterday I ate too much and drank too much.
      pt: Obrigada… ontem foi comida demais e bebida demais.
  - speaker: suzuki
    text: しじみ は 二日酔[ふつかよ]い に いい ん です よ。
    meaning:
      en: Clams are good for a hangover.
      pt: Marisco é bom para ressaca.
