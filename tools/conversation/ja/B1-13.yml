  text:
    en: 'Too much: the verb stem plus «すぎる» — «飲[の]みます» → «飲[の]みすぎる», drink too much; «食[た]べすぎる», eat too much. Adjectives drop «い»: «高[たか]すぎる», too expensive. As a noun: «食[た]べすぎ», overeating.'
    pt: 'Demais: radical do verbo mais «すぎる» — «飲[の]みます» → «飲[の]みすぎる», beber demais; «食[た]べすぎる», comer demais. Adjetivos perdem o «い»: «高[たか]すぎる», caro demais. Como substantivo: «食[た]べすぎ», comilança.'
