- type: narrator
  text:
    en: «しじみ 汁[じる]», miso soup with tiny freshwater clams, is the classic Japanese hangover cure; konbini also sell hangover drinks. What happens at the «飲[の]み会[かい]» is often politely forgotten the next
      day.
    pt: «しじみ 汁[じる]», sopa de missô com mariscos pequenininhos de água doce, é o remédio clássico japonês para ressaca; as lojas de conveniência também vendem bebidas para ressaca. O que acontece no «飲[の]み会[かい]»
      muitas vezes é educadamente esquecido no dia seguinte.
- type: narrator
