steps:
- type: narrator
  text:
    en: Mrs Suzuki takes you to a hot spring. At the entrance, a sign about tattoos — and you have a small one on your ankle. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Suzuki leva você a uma fonte termal. Na entrada, uma placa sobre tatuagens — e você tem uma pequena no tornozelo. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: suzuki
    text: ここ は 入[い]れ墨[ずみ] の 人[ひと] は 入[はい]って は いけません、 と 書[か]いて あります ね。
    meaning:
      en: It says here people with tattoos must not go in.
      pt: Aqui diz que gente com tatuagem não pode entrar.
  - speaker: protagonist
    text: 足[あし] に 小[ちい]さい の が あります… だめ です か。
    meaning:
      en: I have a small one on my foot… Is that no good?
      pt: Eu tenho uma pequena no pé… Não pode?
  - speaker: suzuki
    text: 聞[き]いて みましょう。 すみません、 小[ちい]さい 入[い]れ墨[ずみ] は？
    meaning:
      en: Let's ask. Excuse me, what about a small tattoo?
      pt: Vamos perguntar. Com licença, e uma tatuagem pequena?
  - speaker: madoguchi
    text: この シール で 隠[かく]して ください。 それなら 大丈夫[だいじょうぶ] です。
    meaning:
      en: Please cover it with this sticker. Then it's fine.
      pt: Cubra com este adesivo, por favor. Assim pode.
  - speaker: suzuki
    text: 入[はい]る 前[まえ] に 体[からだ] を 洗[あら]います よ。 水着[みずぎ] は 着[き]ては いけません。
    meaning:
      en: You wash your body before going in. No swimsuits.
      pt: Antes de entrar, lave o corpo. Roupa de banho não pode.
  - speaker: protagonist
    text: タオル は？
    meaning:
      en: And the towel?
      pt: E a toalha?
  - speaker: suzuki
    text: お湯[ゆ] に 入[い]れて は いけません。 頭[あたま] の 上[うえ] に。
    meaning:
      en: It mustn't go in the water. On your head.
      pt: Não pode pôr na água. Em cima da cabeça.
  - speaker: protagonist
    text: ああ、 気持[きも]ち いい！
    meaning:
      en: Ah, that feels good!
      pt: Ah, que delícia!
