- type: narrator
  text:
    en: 'Many onsen still refuse tattoos, an old link to the yakuza. But since 2016 the Tourism Agency has said a tattoo alone should not be the reason to turn someone away, and more places accept them:
      many let a small one in under a skin-coloured sticker. A «貸切[かしきり] 風呂[ぶろ]», a private bath, or a room with its own open-air bath avoids the question. Always ask the place.'
    pt: 'Muitos onsen ainda recusam tatuagem, um velho vínculo com a yakuza. Mas desde 2016 a Agência de Turismo diz que só a tatuagem não deveria ser motivo para barrar alguém, e mais lugares aceitam:
      muitos deixam entrar uma pequena coberta com um adesivo cor da pele. Um «貸切[かしきり] 風呂[ぶろ]», ofurô privativo, ou um quarto com banheira ao ar livre própria evitam a questão. Sempre pergunte ao lugar.'
- type: narrator
  for:
  - pt
  text:
    pt: 'No Brasil tatuagem não fecha porta nenhuma, e na piscina se usa maiô. No onsen é o contrário: sem roupa nenhuma, separado por sexo, e a tatuagem é que pode ser o problema.'
