- type: narrator
  text:
    en: 'Japanese interviews follow a script: knock three times, «失礼[しつれい] いたします», wait to be told to sit, a short self-introduction, the reason for applying, strong and weak points — a weakness always
      comes with what you''re doing about it. Answers are short and humble.'
    pt: 'Entrevistas japonesas seguem um roteiro: bater três vezes, «失礼[しつれい] いたします», esperar mandarem sentar, uma apresentação curta, o motivo da candidatura, pontos fortes e fracos — o ponto fraco sempre
      vem com o que você está fazendo para melhorar. Respostas curtas e humildes.'
- type: narrator
  for:
  - pt
  text:
    pt: 'No Brasil a entrevista é mais conversa, e se vende o próprio peixe. No Japão, humildade e roteiro: fale pouco de si, muito do que pode fazer pela empresa.'
