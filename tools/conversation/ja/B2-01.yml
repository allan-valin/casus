steps:
- type: narrator
  text:
    en: Your one-year contract is ending. The company offers an interview for a permanent post with Mr Takahashi, head of the overseas department. Listen to the conversation; you don't need to understand
      it yet.
    pt: Seu contrato de um ano está acabando. A empresa oferece uma entrevista para uma vaga efetiva com o senhor Takahashi, chefe do departamento internacional. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 失礼[しつれい] いたします。
    meaning:
      en: Excuse me.
      pt: Com licença.
  - speaker: buchou
    text: どうぞ、 おかけ ください。 では、 自己[じこ] 紹介[しょうかい] を お願[ねが]いします。
    meaning:
      en: Please have a seat. Then, introduce yourself, please.
      pt: Sente-se, por favor. Então, apresente-se, por favor.
  - speaker: protagonist
    text: ブラジル の サンパウロ から 参[まい]りました、 ソウザ と 申[もう]します。 一年[いちねん]、 浜松[はままつ] 工場[こうじょう] で 通訳[つうやく] を して おります。
    meaning:
      en: My name is Souza, I came from São Paulo, Brazil. For a year I've been working as an interpreter at the Hamamatsu plant.
      pt: Me chamo Souza, vim de São Paulo, no Brasil. Há um ano trabalho como intérprete na fábrica de Hamamatsu.
  - speaker: buchou
    text: 志望[しぼう] 動機[どうき] は 何[なん] です か。
    meaning:
      en: What is your reason for applying?
      pt: Qual é o motivo da sua candidatura?
  - speaker: protagonist
    text: 正社員[せいしゃいん] と して、 日本[にほん] と ブラジル の 架[か]け橋[はし] に なりたい と 思[おも]って おります。
    meaning:
      en: As a permanent employee, I'd like to be a bridge between Japan and Brazil.
      pt: Como funcionária efetiva, quero ser uma ponte entre o Japão e o Brasil.
  - speaker: buchou
    text: 長所[ちょうしょ] と 短所[たんしょ] を 教[おし]えて ください。
    meaning:
      en: Tell me your strong and weak points.
      pt: Diga seus pontos fortes e fracos.
  - speaker: protagonist
    text: 長所[ちょうしょ] は 明[あか]るい ところ です。 短所[たんしょ] は 漢字[かんじ] が まだ 苦手[にがて] な ところ です が、 毎日[まいにち] 勉強[べんきょう] して おります。
    meaning:
      en: My strong point is that I'm cheerful. My weak point is that I'm still weak at kanji, but I study every day.
      pt: Meu ponto forte é ser alegre. Meu ponto fraco é que ainda tenho dificuldade com kanji, mas estudo todo dia.
  - speaker: buchou
    text: わかりました。 会社[かいしゃ] に どう 貢献[こうけん] できます か。
    meaning:
      en: I see. How can you contribute to the company?
      pt: Entendi. Como você pode contribuir com a empresa?
