- type: narrator
  text:
    en: 'At work you lower yourself with humble verbs, «謙譲語[けんじょうご]»: «言[い]う» → «申[もう]す» («ソウザ と 申[もう]します», my name is Souza); «いる» → «おる» («して おります», I am doing); «来[く]る» / «行[い]く» → «参[まい]る» («参[まい]りました»,
      I came). You never use them about the other person.'
    pt: 'No trabalho você se rebaixa com verbos humildes, «謙譲語[けんじょうご]»: «言[い]う» → «申[もう]す» («ソウザ と 申[もう]します», me chamo Souza); «いる» → «おる» («して おります», estou fazendo); «来[く]る» / «行[い]く» → «参[まい]る» («参[まい]りました»,
      vim). Nunca se usam para falar do outro.'
