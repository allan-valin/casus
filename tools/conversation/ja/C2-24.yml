steps:
- type: narrator
  text:
    en: The city holds a public briefing on a new budget for foreign residents. Council member Tanaka — the loudspeaker-car candidate, now elected — invites questions; you stand up and speak. Listen to
      the conversation; you don't need to understand it yet.
    pt: A prefeitura faz uma reunião pública sobre um novo orçamento para moradores estrangeiros. O vereador Tanaka — aquele candidato do carro de som, agora eleito — abre para perguntas; você se levanta
      e fala. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kouhosha
    text: では、 予算[よさん] に ついて、 ご質問[しつもん] や ご意見[いけん] を どうぞ。
    meaning:
      en: Now, questions or opinions about the budget, please.
      pt: Agora, perguntas ou opiniões sobre o orçamento, por favor.
  - speaker: protagonist
    text: 発言[はつげん] の 機会[きかい] を いただき、 ありがとう ございます。 ブラジル 出身[しゅっしん] で、 浜松[はままつ] に 住[す]んで 五年[ごねん] に なります。
    meaning:
      en: Thank you for the chance to speak. I'm from Brazil and have lived in Hamamatsu for five years.
      pt: Obrigado pela oportunidade de falar. Sou do Brasil e moro em Hamamatsu há cinco anos.
  - speaker: protagonist
    text: 具体的[ぐたいてき] に 二[ふた]つ 提案[ていあん] させて いただきます。 一[ひと]つ 目[め] は、 夜[よる] の 日本語[にほんご] 教室[きょうしつ] の 予算[よさん] です。
    meaning:
      en: Allow me to make two concrete proposals. The first is funding for evening Japanese classes.
      pt: Permitam-me fazer duas propostas concretas. A primeira é o orçamento para aulas de japonês à noite.
  - speaker: protagonist
    text: 二[ふた]つ 目[め] は、 計画[けいかく] を 作[つく]る 段階[だんかい] から、 当事者[とうじしゃ] で ある 外国人[がいこくじん] の 声[こえ] を 反映[はんえい] して いただきたい と いう こと です。
    meaning:
      en: The second is that we'd like the voices of the foreigners concerned to be reflected from the planning stage.
      pt: A segunda é que gostaríamos que a voz dos estrangeiros, que são os diretamente envolvidos, fosse ouvida desde o planejamento.
  - speaker: kouhosha
    text: 貴重[きちょう] な ご意見[いけん]、 ありがとう ございます。 議員[ぎいん] と して 持[も]ち帰[かえ]って 検討[けんとう] します。
    meaning:
      en: Thank you for this valuable opinion. As a council member, I'll take it back and consider it.
      pt: Obrigado pela valiosa contribuição. Como vereador, vou levar e estudar.
  - speaker: protagonist
    text: 検討[けんとう] の 結果[けっか] を、 次回[じかい] の 説明会[せつめいかい] で 教[おし]えて いただけます か。
    meaning:
      en: Could you tell us the result of that consideration at the next briefing?
      pt: O senhor poderia nos dizer o resultado desse estudo na próxima reunião?
  - speaker: kouhosha
    text: …はい。 必[かなら]ず ご報告[ほうこく] します。
    meaning:
      en: …Yes. I'll certainly report back.
      pt: …Sim. Com certeza vou informar.
  - speaker: protagonist
    text: ありがとう ございます。 以上[いじょう] です。
    meaning:
      en: Thank you. That's all.
      pt: Obrigado. É isso.
