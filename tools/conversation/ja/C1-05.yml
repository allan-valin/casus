- type: narrator
  text:
    en: Income tax is withheld from pay and settled by the employer at year's end; «住民税[じゅうみんぜい]», the local tax, is calculated on the previous year's income and billed from June — so newcomers meet it
      in their second year, and people leaving Japan still owe it. File a «確定[かくてい] 申告[しんこく]» yourself for big medical costs or donations.
    pt: O imposto de renda é retido do salário e acertado pela empresa no fim do ano; o «住民税[じゅうみんぜい]», o imposto municipal, é calculado sobre a renda do ano anterior e cobrado a partir de junho — por isso
      quem chega o encontra no segundo ano, e quem sai do Japão ainda o deve. Faça você mesmo o «確定[かくてい] 申告[しんこく]» em caso de gastos médicos altos ou doações.
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil todo mundo conhece a declaração de abril. No Japão o funcionário quase nunca declara — mas o imposto de residência atrasado pega muita gente de surpresa, principalmente na hora de voltar
      ao Brasil.
