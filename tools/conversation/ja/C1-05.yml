steps:
- type: narrator
  text:
    en: 'A letter from the city: a residence-tax bill, based on last year''s income. Chief Sato explains why it arrives a year late — and about the tax return. Listen to the conversation; you don''t need
      to understand it yet.'
    pt: 'Uma carta da prefeitura: a cobrança do imposto de residência, com base na renda do ano passado. A chefe Sato explica por que ele chega um ano depois — e fala da declaração. Escute a conversa; ainda
      não precisa entender.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: 市役所[しやくしょ] から 住民税[じゅうみんぜい] の 納付書[のうふしょ] が 来[き]ました。 もう 給料[きゅうりょう] から 引[ひ]かれて いる のに。
    meaning:
      en: A residence-tax payment slip came from the city. Even though tax is already taken from my salary.
      pt: Chegou um boleto do imposto de residência da prefeitura. Mesmo já sendo descontado do salário.
  - speaker: sato
    text: 給料[きゅうりょう] から 引[ひ]かれる の は 所得税[しょとくぜい] です。 住民税[じゅうみんぜい] は 前年[ぜんねん] の 所得[しょとく] で 決[き]まる から、 一年[いちねん] 遅[おく]れて 来[く]る ん です。
    meaning:
      en: What's withheld from your salary is income tax. Residence tax is based on the previous year's income, so it comes a year late.
      pt: O que se desconta do salário é o imposto de renda. O imposto de residência é calculado pela renda do ano anterior, então chega um ano depois.
  - speaker: protagonist
    text: 日本[にほん] に 来[き]た 年[とし] の 分[ぶん] です か。
    meaning:
      en: So it's for the year I arrived?
      pt: Então é do ano em que eu cheguei?
  - speaker: sato
    text: そう です。 払[はら]わない わけ には いきません よ。
    meaning:
      en: That's right. You can't very well not pay it.
      pt: Isso. Não dá para não pagar.
  - speaker: protagonist
    text: もちろん 払[はら]います。 確定[かくてい] 申告[しんこく] は 必要[ひつよう] です か。
    meaning:
      en: Of course I'll pay. Do I need to file a tax return?
      pt: Claro que pago. Preciso fazer declaração?
  - speaker: sato
    text: 会社員[かいしゃいん] は 普通[ふつう]、 会社[かいしゃ] が して くれます。 でも 医療費[いりょうひ] が 多[おお]かった 年[とし] は、 控除[こうじょ] の ため に 自分[じぶん] で 申告[しんこく] します。
    meaning:
      en: Employees usually have it done by the company. But in a year with big medical costs, you file yourself for the deduction.
      pt: Funcionário normalmente tem a declaração feita pela empresa. Mas num ano com muito gasto médico, você mesmo declara para ter a dedução.
  - speaker: protagonist
    text: ふるさと 納税[のうぜい] も 控除[こうじょ] に なる と 聞[き]きました。
    meaning:
      en: I heard hometown tax donations count as deductions too.
      pt: Ouvi dizer que a doação à cidade natal também vira dedução.
  - speaker: sato
    text: ええ。 家族[かぞく] の ため に も、 一度[いちど] 調[しら]べる べき です ね。
    meaning:
      en: Yes. For your family's sake too, you should look into it once.
      pt: Sim. Pela família também, vale pesquisar uma vez.
