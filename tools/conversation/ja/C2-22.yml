- type: narrator
  text:
    en: 'Register shift is daily life for bilingual nikkei: plain Japanese with a friend, keigo with an elder, Portuguese with family — sometimes in one sentence. Older nikkei in Brazil keep a Japanese
      full of pre-war words and Portuguese loans, sometimes called «コロニア 語[ご]».'
    pt: 'A troca de registro é o dia a dia dos nikkeis bilíngues: japonês informal com um amigo, keigo com um mais velho, português com a família — às vezes numa frase só. Os nikkeis mais velhos no Brasil
      mantêm um japonês cheio de palavras de antes da guerra e empréstimos do português, às vezes chamado de «コロニア 語[ご]».'
- type: narrator
  for:
  - pt
  text:
    pt: O Brasil tem cerca de dois milhões de descendentes de japoneses — a maior comunidade nikkei fora do Japão. Na Liberdade, os dois lados da sua história se encontram numa esquina.
