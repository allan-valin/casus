steps:
- type: narrator
  text:
    en: You take Yui and Kenta to São Paulo for the first time. In Liberdade, the Japanese neighbourhood, Kenta is amazed — and you switch between three registers at once. Listen to the conversation; you
      don't need to understand it yet.
    pt: Você leva a Yui e o Kenta a São Paulo pela primeira vez. Na Liberdade, o bairro japonês, o Kenta fica impressionado — e você alterna três registros ao mesmo tempo. Escute a conversa; ainda não precisa
      entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: すごい！ 赤[あか]い 鳥居[とりい] と 提灯[ちょうちん]… ここ は 本当[ほんとう] に ブラジル？
    meaning:
      en: Amazing! Red torii and lanterns… is this really Brazil?
      pt: Incrível! Torii vermelho e lanternas… isso é mesmo o Brasil?
  - speaker: protagonist
    text: リベルダージ だ よ。 ブラジル は 日本[にほん] の 外[そと] で 日系[にっけい] 人[じん] が 世界[せかい] で 一番[いちばん] 多[おお]い 国[くに] な ん だ。
    meaning:
      en: This is Liberdade. Brazil has the largest nikkei population in the world outside Japan.
      pt: Esta é a Liberdade. O Brasil tem a maior população nikkei do mundo fora do Japão.
  - speaker: yui
    text: お店[みせ] の おばあさん、 昔[むかし] の 日本語[にほんご] を 話[はな]して いる！
    meaning:
      en: The old lady in the shop is speaking old-fashioned Japanese!
      pt: A senhora da loja está falando japonês de antigamente!
  - speaker: protagonist
    text: 移住[いじゅう] した 一世[いっせい] の 言葉[ことば] が 残[のこ]って いる ん だ。 ポルトガル語[ご] と 日本語[にほんご] が 混[ま]ざって いる よ。
    meaning:
      en: The words of the first-generation migrants have survived. It's a mix of Portuguese and Japanese.
      pt: As palavras dos imigrantes da primeira geração ficaram. É uma mistura de português e japonês.
  - speaker: kenta
    text: この お饅頭[まんじゅう]、 懐[なつ]かしい 味[あじ] が する。 第二[だいに] の 日本[にほん] みたい だ。
    meaning:
      en: This sweet bun tastes like the old days. It's like a second Japan.
      pt: Este manju tem gosto de antigamente. Parece um segundo Japão.
  - speaker: protagonist
    text: 健太[けんた] に は タメ口[ぐち]、 お店[みせ] の 人[ひと] に は 敬語[けいご]、 家族[かぞく] に は ポルトガル語[ご]。 言葉[ことば] を 切[き]り替[か]える の が 忙[いそが]しい。
    meaning:
      en: Plain talk with Kenta, keigo with the shopkeeper, Portuguese with my family. Switching is busy work.
      pt: Fala informal com o Kenta, keigo com a dona da loja, português com a família. Trocar de registro dá trabalho.
  - speaker: yui
    text: 日系[にっけい] 社会[しゃかい] の 歴史[れきし] を、 ここ で 初[はじ]めて 実感[じっかん] した。
    meaning:
      en: Here I really felt the history of the nikkei community for the first time.
      pt: Aqui senti na pele, pela primeira vez, a história da comunidade nikkei.
  - speaker: protagonist
    text: 祖母[そぼ] も この 町[まち] で 買[か]い物[もの] を して いた。 胸[むね] が いっぱい だ よ。
    meaning:
      en: My grandmother used to shop in this neighbourhood. My heart is full.
      pt: A minha avó fazia compras neste bairro. Estou com o coração cheio.
