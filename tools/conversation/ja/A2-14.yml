steps:
- type: narrator
  text:
    en: Lunch in the canteen. New colleagues ask about Brazil — and you ask what they think of Japan's image abroad. Listen to the conversation; you don't need to understand it yet.
    pt: Almoço no refeitório. Colegas novos perguntam do Brasil — e você pergunta o que eles acham da imagem do Japão lá fora. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kenta
    text: ブラジル の 人[ひと] は みんな サンバ が 上手[じょうず] だ と 思[おも]って いた。
    meaning:
      en: I thought all Brazilians were good at samba.
      pt: Eu achava que todo brasileiro sambava bem.
  - speaker: protagonist
    text: 違[ちが]う と 思[おも]います。 僕[ぼく] は 全然[ぜんぜん] 踊[おど]れません。
    meaning:
      en: I don't think so. I can't dance at all.
      pt: Acho que não. Eu não sei dançar nada.
  - speaker: sato
    text: 日本[にほん] の イメージ は どう です か。 ブラジル で。
    meaning:
      en: What's Japan's image like in Brazil?
      pt: Qual é a imagem do Japão no Brasil?
  - speaker: protagonist
    text: アニメ と 寿司[すし] と 忍者[にんじゃ] だ と 思[おも]います。
    meaning:
      en: I think anime, sushi and ninjas.
      pt: Acho que anime, sushi e ninja.
  - speaker: sato
    text: 私[わたし] は アニメ を あまり 見[み]ません よ。
    meaning:
      en: I don't really watch anime.
      pt: Eu quase não vejo anime.
  - speaker: kenta
    text: 僕[ぼく] は 時々[ときどき] 見[み]る けど。 ステレオタイプ は おもしろい ね。
    meaning:
      en: I do sometimes. Stereotypes are funny.
      pt: Eu vejo às vezes. Estereótipo é engraçado, né?
  - speaker: protagonist
    text: 日本[にほん] の 人[ひと] は みんな 時間[じかん] に 厳[きび]しい と 聞[き]きました。
    meaning:
      en: I heard all Japanese are strict about time.
      pt: Ouvi dizer que todo japonês é rigoroso com horário.
  - speaker: sato
    text: それ は… 本当[ほんとう] だ と 思[おも]います。
    meaning:
      en: That one… I think is true.
      pt: Isso aí… acho que é verdade.
- type: narrator
  text:
    en: 'To give an opinion, end a plain sentence with «と 思[おも]います» — I think that: «本当[ほんとう] だ と 思[おも]います», I think it''s true. Nouns and «な» words take «だ» before «と». To ask: «どう 思[おも]います か».'
    pt: 'Para dar opinião, termine uma frase simples com «と 思[おも]います» — acho que: «本当[ほんとう] だ と 思[おも]います», acho que é verdade. Substantivos e palavras com «な» levam «だ» antes do «と». Para perguntar: «どう
      思[おも]います か».'
