- type: narrator
  text:
    en: '«と 思[おも]います» also softens: Japanese rarely states an opinion bare. Even a strong one comes as «〜と 思[おも]います», and a disagreement as «違[ちが]う と 思[おも]います» — I think it''s different — rather than «no».'
    pt: '«と 思[おも]います» também suaviza: o japonês raramente dá opinião seca. Até uma opinião forte vem como «〜と 思[おも]います», e uma discordância como «違[ちが]う と 思[おも]います» — acho que é diferente — em vez de «não».'
