steps:
- type: narrator
  text:
    en: A national newspaper is writing about foreign residents settling in regional Japan. The reporter interviews you; every sentence may be quoted. Listen to the conversation; you don't need to understand
      it yet.
    pt: Um jornal nacional está escrevendo sobre estrangeiros que se fixam no interior do Japão. A repórter entrevista você; cada frase pode ser citada. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: reporter
    text: 浜松[はままつ] に 定住[ていじゅう] して 五年[ごねん]。 差別[さべつ] を 感[かん]じた こと は ありますか。
    meaning:
      en: Five years settled in Hamamatsu. Have you felt discrimination?
      pt: Cinco anos morando em Hamamatsu. Já sentiu discriminação?
  - speaker: protagonist
    text: 言葉[ことば] を 選[えら]んで 答[こた]えます。 差別[さべつ] は 確[たし]か に あります。 部屋[へや] を 借[か]りる 時[とき] に 断[ことわ]られた こと も あります。
    meaning:
      en: I'll choose my words. Discrimination certainly exists. I was once refused when renting a flat.
      pt: Vou escolher as palavras. A discriminação certamente existe. Já me recusaram ao alugar um apartamento.
  - speaker: reporter
    text: その 経験[けいけん] は、 記事[きじ] に 引用[いんよう] して も よろしい でしょう か。
    meaning:
      en: May I quote that experience in the article?
      pt: Posso citar essa experiência na matéria?
  - speaker: protagonist
    text: はい。 ただ、 その 一方[いっぽう] で、 地域[ちいき] 社会[しゃかい] に 温[あたた]かく 迎[むか]えられた こと も 書[か]いて ください。
    meaning:
      en: Yes. But please also write that, on the other hand, the local community welcomed me warmly.
      pt: Pode. Mas, por favor, escreva também que, por outro lado, a comunidade local me acolheu com carinho.
  - speaker: reporter
    text: 共生[きょうせい] の ため に、 何[なに] が 一番[いちばん] 必要[ひつよう] だ と 思[おも]います か。
    meaning:
      en: What do you think is most needed for coexistence?
      pt: O que você acha que é mais necessário para a convivência?
  - speaker: protagonist
    text: 制度[せいど] も 大事[だいじ] です が、 結局[けっきょく] は 人[ひと] と 人[ひと] の 出会[であ]い だ と 思[おも]います。 太鼓[たいこ] や フットサル の よう な。
    meaning:
      en: Systems matter, but in the end I think it's people meeting people. Like through taiko or futsal.
      pt: As políticas importam, mas no fim acho que é o encontro de pessoa para pessoa. Como no taikô ou no futsal.
  - speaker: reporter
    text: いい 言葉[ことば] です ね。 見出[みだ]し に なる かも しれません。
    meaning:
      en: Nice words. That might become the headline.
      pt: Boa frase. Pode virar manchete.
  - speaker: protagonist
    text: 寛容[かんよう] は 両方[りょうほう] から 必要[ひつよう] です。 それ も 一緒[いっしょ] に お願[ねが]い します。
    meaning:
      en: Tolerance is needed from both sides. Please include that too.
      pt: A tolerância precisa vir dos dois lados. Coloque isso também, por favor.
