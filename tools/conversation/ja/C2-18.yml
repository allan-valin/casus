- type: narrator
  text:
    en: 'Speaking to a journalist calls for a quotable register: short, complete sentences that stand alone, a fact and its counterweight («確[たし]か に… その 一方[いっぽう] で…»), and asking for both to be printed.
      A single line can become a headline.'
    pt: 'Falar com jornalista pede um registro citável: frases curtas e completas que fiquem de pé sozinhas, um fato e o seu contrapeso («確[たし]か に… その 一方[いっぽう] で…»), e o pedido para que os dois sejam publicados.
      Uma única frase pode virar manchete.'
