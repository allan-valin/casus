steps:
- type: narrator
  text:
    en: A tech meetup in Shizuoka invited you to speak about building translation tools for factory floors. Twenty minutes, then questions from the audience. Listen to the conversation; you don't need to
      understand it yet.
    pt: Um encontro de tecnologia em Shizuoka convidou você para falar sobre ferramentas de tradução para chão de fábrica. Vinte minutos, depois perguntas da plateia. Escute a conversa; ainda não precisa
      entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: ただいま ご紹介[しょうかい] に 預[あず]かりました、 ソウザ です。 本日[ほんじつ] は 工場[こうじょう] の 翻訳[ほんやく] ツール に ついて お話[はな]し します。
    meaning:
      en: As just introduced, I'm Souza. Today I'll talk about translation tools for factories.
      pt: Como acabaram de apresentar, sou a Souza. Hoje vou falar sobre ferramentas de tradução para fábricas.
  - speaker: protagonist
    text: まず 概要[がいよう]、 次[つぎ] に 浜松[はままつ] の 事例[じれい]、 最後[さいご] に 課題[かだい] と 展望[てんぼう] です。 スライド を ご覧[らん] ください。
    meaning:
      en: First an overview, then the Hamamatsu case, and finally challenges and outlook. Please look at the slide.
      pt: Primeiro uma visão geral, depois o caso de Hamamatsu e, por fim, desafios e perspectivas. Vejam o slide.
  - speaker: protagonist
    text: …以上[いじょう] です。 ご清聴[せいちょう] ありがとう ございました。
    meaning:
      en: …That's all. Thank you for listening.
      pt: …É isso. Obrigada pela atenção.
  - speaker: kouza-sensei
    text: 興味深[きょうみぶか]い お話[はなし] でした。 機械[きかい] 翻訳[ほんやく] の 間違[まちが]い は、 安全[あんぜん] に 影響[えいきょう] しません か。
    meaning:
      en: A fascinating talk. Don't machine-translation errors affect safety?
      pt: Palestra muito interessante. Erros de tradução automática não afetam a segurança?
  - speaker: protagonist
    text: いい ご質問[しつもん] です ね。 安全[あんぜん] に 関[かん]わる 文[ぶん] は、 必[かなら]ず 人[ひと] が 確認[かくにん] する 仕組[しく]み に して います。
    meaning:
      en: That's a good question. Any sentence about safety is always checked by a person, by design.
      pt: Boa pergunta. Toda frase ligada à segurança é sempre conferida por uma pessoa, faz parte do sistema.
  - speaker: kouza-sensei
    text: なるほど。 聴衆[ちょうしゅう] の 皆[みな]さん も 納得[なっとく] した よう です ね。
    meaning:
      en: I see. The audience seems convinced too.
      pt: Entendi. A plateia também parece convencida.
  - speaker: protagonist
    text: ありがとう ございます。 ほか に ご質問[しつもん] は ございます でしょう か。
    meaning:
      en: Thank you. Are there any other questions?
      pt: Obrigada. Há mais alguma pergunta?
  - speaker: kouza-sensei
    text: 最後[さいご] に 拍手[はくしゅ] を！
    meaning:
      en: One last round of applause!
      pt: Uma última salva de palmas!
