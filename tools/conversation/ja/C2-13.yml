- type: narrator
  text:
    en: 'A formal talk has a fixed frame: «ただいま ご紹介[しょうかい] に 預[あず]かりました○○ です» to open, the structure in one breath («まず… 次[つぎ] に… 最後[さいご] に…»), «以上[いじょう] です» and «ご清聴[せいちょう] ありがとう ございました» to close. In the
      Q&A, «いい ご質問[しつもん] です ね» buys a second.'
    pt: 'Uma palestra formal tem moldura fixa: «ただいま ご紹介[しょうかい] に 預[あず]かりました○○ です» para abrir, a estrutura de um fôlego só («まず… 次[つぎ] に… 最後[さいご] に…»), «以上[いじょう] です» e «ご清聴[せいちょう] ありがとう ございました» para fechar.
      Nas perguntas, «いい ご質問[しつもん] です ね» dá um segundo para pensar.'
