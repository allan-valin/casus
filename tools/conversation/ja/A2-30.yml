steps:
- type: narrator
  text:
    en: The section's year-end party. Chief Sato tells a dad joke and everyone groans — a look back at all of A2. Listen to the conversation; you don't need to understand it yet.
    pt: A festa de fim de ano do setor. A chefe Sato conta uma piada de tiozão e todo mundo resmunga — uma revisão de todo o A2. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sato
    text: 皆[みな]さん、 今年[ことし] も お疲[つか]れさま でした。 忘年会[ぼうねんかい] です！
    meaning:
      en: Everyone, thanks for this year's hard work. It's the year-end party!
      pt: Pessoal, obrigada pelo trabalho este ano. É a festa de fim de ano!
  - speaker: kenta
    text: 課長[かちょう]、 何[なに] か 面白[おもしろ]い 話[はなし] を！
    meaning:
      en: Chief, tell us something funny!
      pt: Chefe, conta algo engraçado!
  - speaker: sato
    text: じゃあ…「布団[ふとん] が 吹[ふ]っ飛[と]んだ」。
    meaning:
      en: Well… “the futon flew away” (futon ga futtonda).
      pt: Então… «o futon voou longe» (futon ga futtonda).
  - speaker: kenta
    text: さむっ！ おやじ ギャグ だ！
    meaning:
      en: So cold! A dad joke!
      pt: Que gelo! Piada de tiozão!
  - speaker: protagonist
    text: 寒[さむ]い？ でも 面白[おもしろ]い です。 笑[わら]いました。
    meaning:
      en: Cold? But it's funny. I laughed.
      pt: Gelada? Mas é engraçada. Eu ri.
  - speaker: sato
    text: ありがとう。 ブラジル に も 冗談[じょうだん] が あります か。
    meaning:
      en: Thank you. Do you have jokes like that in Brazil?
      pt: Obrigada. No Brasil também tem piadas assim?
  - speaker: protagonist
    text: あります。 ブラジル の おやじ ギャグ も とても 寒[さむ]い です よ。
    meaning:
      en: We do. Brazilian dad jokes are very cold too.
      pt: Tem. As piadas de tiozão brasileiras também são bem geladas.
  - speaker: protagonist
    text: 今年[ことし] は お世話[せわ] に なりました。 来年[らいねん] も よろしく お願[ねが]いします。
    meaning:
      en: Thank you for all your help this year. I look forward to next year too.
      pt: Obrigado por tudo este ano. Conto com vocês no ano que vem.
