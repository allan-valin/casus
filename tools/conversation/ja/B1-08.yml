steps:
- type: narrator
  text:
    en: A colleague from the factory invited you to his wedding reception. Kenta explains the money envelope the night before. Listen to the conversation; you don't need to understand it yet.
    pt: Um colega da fábrica convidou você para a festa de casamento. O Kenta explica o envelope de dinheiro na véspera. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 明日[あした] の 披露宴[ひろうえん]、 プレゼント は 何[なに] が いい？
    meaning:
      en: For tomorrow's reception, what's a good present?
      pt: Para a festa de amanhã, que presente é bom?
  - speaker: kenta
    text: プレゼント じゃ なくて、 ご祝儀[しゅうぎ]。 お金[かね] を 封筒[ふうとう] に 入[い]れる ん だ。
    meaning:
      en: Not a present — gift money. You put money in an envelope.
      pt: Não é presente — é dinheiro. Você põe num envelope.
  - speaker: protagonist
    text: いくら 入[い]れて も いい の？
    meaning:
      en: How much should I put in?
      pt: Quanto eu ponho?
  - speaker: kenta
    text: 友達[ともだち] や 同僚[どうりょう] は 三万円[さんまんえん] が 普通[ふつう]。 新札[しんさつ] で ね。
    meaning:
      en: For friends and colleagues 30,000 yen is normal. In new notes.
      pt: Para amigo e colega, 30 mil ienes é o normal. Em notas novas.
  - speaker: protagonist
    text: 二万円[にまんえん] でも いい？
    meaning:
      en: Would 20,000 be okay?
      pt: Pode ser 20 mil?
  - speaker: kenta
    text: 偶数[ぐうすう] は 別[わか]れる 意味[いみ] が ある から、 避[さ]けた ほう が いい。
    meaning:
      en: Even numbers can mean splitting up, so better avoid them.
      pt: Número par tem o sentido de se separar, então é melhor evitar.
  - speaker: protagonist
    text: なるほど。 帰[かえ]り に は 何[なに] か もらえる？
    meaning:
      en: I see. Do guests get something to take home?
      pt: Entendi. Na saída a gente ganha alguma coisa?
  - speaker: kenta
    text: 引[ひ]き出[で]物[もの] が ある よ。 明日[あした]、 新郎[しんろう] に「おめでとう ございます」 って 言[い]って ね。
    meaning:
      en: There's a return gift. Tomorrow say “congratulations” to the groom.
      pt: Tem uma lembrança. Amanhã diga «parabéns» para o noivo.
