- type: narrator
  text:
    en: 'Guests bring «ご祝儀[しゅうぎ]» in a special decorated envelope: usually 30,000 yen from a friend or colleague, in brand-new notes — new notes show you prepared for the happy day. Odd amounts are preferred,
      because an even number splits in two. Guests leave with a gift, «引[ひ]き出[で]物[もの]».'
    pt: 'Os convidados levam «ご祝儀[しゅうぎ]» num envelope decorado especial: em geral 30 mil ienes de amigo ou colega, em notas novinhas — nota nova mostra que você se preparou para o dia feliz. Prefere-se
      valor ímpar, porque número par se divide em dois. Os convidados saem com uma lembrança, «引[ひ]き出[で]物[もの]».'
- type: narrator
  for:
  - pt
  text:
    pt: No Brasil se dá presente da lista ou um Pix para a lua de mel. No Japão é dinheiro vivo, em envelope bonito — e o valor praticamente paga o jantar da festa.
