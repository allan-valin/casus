# UNIT — template, filled in with a short German example. A real unit introduces 10–20 items and has an
# 8–10-line dialogue; this one is shorter so the template stays readable (the checker prints warnings for it).
# Copy to tools/conversation/<code>/<LEVEL>-<NN>.yml. The guide explains each field: docs/conversation/GUIDE.*.md,
# section "Unit".

id: A1-01
level: A1
number: 1
protagonist: f                  # a form from the story bible; alternate between units
title: {pt: "A dona do apartamento", en: "The landlady"}
situation:                      # one or two sentences: where, who, what is at stake
  pt: "Você acabou de chegar ao prédio em Leipzig. A dona do apartamento, Frau Becker, abre a porta."
  en: "You have just arrived at the building in Leipzig. The landlady, Frau Becker, opens the door."
learn_lessons: []               # ids of the Learn lessons this unit practises (Learn links back); the build fails on an id Learn lacks
# learn_missing: [numbers]      # a theme Learn has no lesson for yet: listed in docs/conversation/COVERAGE.md
culture: Calling the landlady by her first name / greeting her with a kiss   # a clash from the bible

new_items:                      # what the learner can say after this unit; meanings in every narrator language
  - {id: guten-tag, text: "Guten Tag", meaning: {pt: "Bom dia / boa tarde", en: "Hello (good day)"}, register: formal}
  - {id: entschuldigung, text: "Entschuldigung", meaning: {pt: "Com licença / desculpe", en: "Excuse me / sorry"}}
  - {id: verstehe-nicht, text: "Ich verstehe nicht", meaning: {pt: "Eu não entendo", en: "I don't understand"}}
  - {id: sprechen-englisch, text: "Sprechen Sie Englisch?", meaning: {pt: "A senhora fala inglês?", en: "Do you speak English?"}, register: formal}
  - {id: danke, text: "Danke", meaning: {pt: "Obrigada / obrigado", en: "Thank you"}}

reviews: []                     # unit 1 has nothing to review

steps:
  - type: narrator
    text:
      pt: "Você acabou de chegar à Alemanha. Escute a conversa com a dona do apartamento. Ainda não precisa entender."
      en: "You have just arrived in Germany. Listen to the conversation with the landlady. You don't need to understand it yet."
  - type: dialogue              # heard first, understood at the end
    lines:
      - {speaker: protagonist, text: "Guten Tag!", meaning: {pt: "Boa tarde!", en: "Hello!"}}
      - {speaker: becker, text: "Guten Tag. Sie sind die neue Mieterin?", meaning: {pt: "Boa tarde. A senhora é a nova inquilina?", en: "Hello. You are the new tenant?"}}
      - {speaker: protagonist, text: "Entschuldigung, ich verstehe nicht.", meaning: {pt: "Desculpe, eu não entendo.", en: "Sorry, I don't understand."}}
      - {speaker: becker, text: "Die neue Mieterin? Aus Brasilien?", meaning: {pt: "A nova inquilina? Do Brasil?", en: "The new tenant? From Brazil?"}}
      - {speaker: protagonist, text: "Ja! Sprechen Sie Englisch?", meaning: {pt: "Sim! A senhora fala inglês?", en: "Yes! Do you speak English?"}}
      - {speaker: becker, text: "Ein bisschen. Hier ist der Schlüssel.", meaning: {pt: "Um pouco. Aqui está a chave.", en: "A little. Here is the key."}}
      - {speaker: protagonist, text: "Danke, Frau Becker!", meaning: {pt: "Obrigada, Frau Becker!", en: "Thank you, Frau Becker!"}}
      - {speaker: becker, text: "Bitte. Willkommen in Leipzig.", meaning: {pt: "De nada. Bem-vinda a Leipzig.", en: "You're welcome. Welcome to Leipzig."}}
  - type: narrator
    text:
      pt: "Na Alemanha, as pessoas se cumprimentam com um aperto de mão, não com beijo. Escute como se diz 'boa tarde'."
      en: "In Germany people greet with a handshake, not a kiss. Listen to how to say 'hello'."
  - {type: line, speaker: becker, item: guten-tag}
  - type: prompt                # anticipation: ask → the learner answers aloud → the answer plays
    ask: {pt: "Cumprimente a dona do apartamento.", en: "Greet the landlady."}
    answer: {speaker: protagonist, text: "Guten Tag!"}
    items: [guten-tag]
  - type: buildup               # a long word built from its end, so its stress and rhythm stay right
    item: entschuldigung
    parts: ["-gung", "-digung", "-schuldigung", "Entschuldigung"]
  - type: prompt
    ask: {pt: "Peça licença para falar com ela.", en: "Say 'excuse me' to get her attention."}
    answer: {speaker: protagonist, text: "Entschuldigung!"}
    items: [entschuldigung]
  - {type: line, speaker: becker, item: verstehe-nicht}
  - type: prompt
    ask: {pt: "Diga que você não entende.", en: "Say that you don't understand."}
    answer: {speaker: protagonist, text: "Ich verstehe nicht."}
    items: [verstehe-nicht]
  - type: prompt
    ask: {pt: "Peça desculpas e diga de novo que não entende.", en: "Apologise and say again that you don't understand."}
    answer: {speaker: protagonist, text: "Entschuldigung, ich verstehe nicht."}
    items: [entschuldigung, verstehe-nicht]
  - type: narrator
    text:
      pt: "Com uma senhora desconhecida, use 'Sie', a forma educada. Pergunte se ela fala inglês."
      en: "With a lady you don't know, use 'Sie', the polite form. Ask whether she speaks English."
  - type: prompt
    ask: {pt: "Pergunte: a senhora fala inglês?", en: "Ask: do you speak English?"}
    answer: {speaker: protagonist, text: "Sprechen Sie Englisch?"}
    items: [sprechen-englisch]
  - type: prompt
    ask: {pt: "Ela lhe entrega a chave. Agradeça.", en: "She hands you the key. Thank her."}
    answer: {speaker: protagonist, text: "Danke!"}
    items: [danke]
  - type: prompt
    ask: {pt: "Cumprimente-a de novo e pergunte se ela fala inglês.", en: "Greet her again and ask whether she speaks English."}
    answer: {speaker: protagonist, text: "Guten Tag! Sprechen Sie Englisch?"}
    items: [guten-tag, sprechen-englisch]
  - type: prompt
    ask: {pt: "Agradeça, chamando-a pelo sobrenome.", en: "Thank her, using her surname."}
    answer: {speaker: protagonist, text: "Danke, Frau Becker!"}
    items: [danke]
  - type: narrator
    text:
      pt: "Escute a conversa outra vez. Agora você entende."
      en: "Listen to the conversation again. Now you understand it."
  - {type: dialogue, again: true}
  - type: selfcheck             # about 4 in 5 answered without help → go on; otherwise repeat the unit
