steps:
- type: narrator
  text:
    en: A survey says Germans are fairly happy but complain a lot. You discuss it with Lena. Listen to the conversation; you don't need to understand it yet.
    ar: استطلاع يقول إن الألمان سعداء إلى حدّ ما لكنهم يتذمرون كثيرًا. تناقشين ذلك مع لينا. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Анкета вели дека Германците се прилично среќни, но многу се жалат. Разговарате со Лена. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: lena
    text: Wir Deutschen sind eigentlich zufrieden. Aber wir meckern gern!
    meaning:
      en: We Germans are actually content. But we love to grumble!
      ar: نحن الألمان راضون في الواقع. لكننا نحب التذمّر!
      mk: Ние Германците сме всушност задоволни. Но сакаме да мрмориме!
  - speaker: protagonist
    text: Worüber?
    meaning:
      en: About what?
      ar: عن ماذا؟
      mk: За што?
  - speaker: lena
    text: Über das Wetter, die Bahn, die Politik...
    meaning:
      en: About the weather, the trains, politics...
      ar: عن الطقس، والقطارات، والسياسة...
      mk: За времето, возовите, политиката...
  - speaker: protagonist
    text: Was ist für dich das Wichtigste zum Glück?
    meaning:
      en: What's the most important thing for happiness, for you?
      ar: ما أهم شيء للسعادة بالنسبة لكِ؟
      mk: Што е за тебе најважно за среќата?
  - speaker: lena
    text: Die Freunde, mit denen ich lachen kann. Und Gesundheit.
    meaning:
      en: Friends I can laugh with. And health.
      ar: الأصدقاء الذين أستطيع أن أضحك معهم. والصحة.
      mk: Пријателите со кои можам да се смеам. И здравјето.
  - speaker: protagonist
    text: Für mich auch die Sicherheit. Ein Mensch, dem nichts fehlt, ist glücklich.
    meaning:
      en: For me safety too. A person who lacks nothing is happy.
      ar: بالنسبة لي الأمان أيضًا. الإنسان الذي لا ينقصه شيء سعيد.
      mk: За мене и сигурноста. Човекот на кој ништо не му недостига е среќен.
  - speaker: lena
    text: Schön gesagt. Und trotzdem meckern wir!
    meaning:
      en: Nicely put. And still we grumble!
      ar: قلتِها جميلة. ومع ذلك نتذمّر!
      mk: Убаво кажано. А сепак мрмориме!
  - speaker: protagonist
    text: Das ist dann euer Hobby!
    meaning:
      en: Then that's your hobby!
      ar: إذن هذه هوايتكم!
      mk: Тогаш тоа е вашето хоби!
