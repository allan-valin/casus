- type: narrator
  text:
    en: 'The Basic Law (1949) begins with human dignity because it was written after the Nazi dictatorship. It guarantees free speech and the right to criticise those in power — with limits: insult, threats
      and incitement to hatred are crimes.'
    ar: 'القانون الأساسي (1949) يبدأ بكرامة الإنسان لأنه كُتب بعد الديكتاتورية النازية. وهو يضمن حرية التعبير وحق انتقاد السلطة — ضمن حدود: الإهانة والتهديد والتحريض على الكراهية جرائم.'
    mk: 'Основниот закон (1949) почнува со човековото достоинство затоа што е напишан по нацистичката диктатура. Ја гарантира слободата на говорот и правото да се критикува власта — со граници: навредата,
      заканите и поттикнувањето омраза се кривични дела.'
