  text:
    en: 'For the past, Konjunktiv II uses «hätte» or «wäre» + participle: «Das hätte ich nicht gedacht» (I wouldn''t have thought), «Das wäre gefährlich gewesen» (that would have been dangerous).'
    ar: 'للماضي، صيغة التمني تستعمل «hätte» أو «wäre» مع اسم المفعول: «Das hätte ich nicht gedacht» (ما كنتُ لأظن)، «Das wäre gefährlich gewesen» (كان ذلك سيكون خطرًا).'
    mk: 'За минатото, Konjunktiv II користи «hätte» или «wäre» + партицип: «Das hätte ich nicht gedacht» (не би помислил), «Das wäre gefährlich gewesen» (тоа ќе беше опасно).'
