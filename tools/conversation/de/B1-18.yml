steps:
- type: narrator
  text:
    en: A VHS evening on the Grundgesetz, Germany's constitution. Professor Hartmann reads Article 1. Listen to the conversation; you don't need to understand it yet.
    ar: أمسية في الجامعة الشعبية عن القانون الأساسي، دستور ألمانيا. البروفيسور هارتمان يقرأ المادة الأولى. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Вечер на народниот универзитет за Основниот закон, германскиот устав. Професорот Хартман го чита член 1. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: hartmann
    text: 'Artikel eins: Die Würde des Menschen ist unantastbar.'
    meaning:
      en: 'Article one: Human dignity is inviolable.'
      ar: 'المادة الأولى: كرامة الإنسان لا تُمسّ.'
      mk: 'Член еден: Достоинството на човекот е неприкосновено.'
  - speaker: protagonist
    text: Warum steht das ganz am Anfang?
    meaning:
      en: Why is that right at the beginning?
      ar: لماذا هذا في البداية تمامًا؟
      mk: Зошто тоа е на самиот почеток?
  - speaker: hartmann
    text: Das Grundgesetz wurde 1949 geschrieben, nach dem Krieg und der Diktatur.
    meaning:
      en: The Basic Law was written in 1949, after the war and the dictatorship.
      ar: كُتب القانون الأساسي عام 1949، بعد الحرب والديكتاتورية.
      mk: Основниот закон е напишан во 1949, по војната и диктатурата.
  - speaker: protagonist
    text: Und Artikel fünf ist die Meinungsfreiheit?
    meaning:
      en: And Article five is freedom of expression?
      ar: والمادة الخامسة هي حرية الرأي؟
      mk: А член пет е слободата на мислење?
  - speaker: hartmann
    text: Genau. Jeder darf die Regierung kritisieren.
    meaning:
      en: Exactly. Everyone may criticise the government.
      ar: بالضبط. يحق لكل أحد أن ينتقد الحكومة.
      mk: Точно. Секој смее да ја критикува владата.
  - speaker: protagonist
    text: Das hätte ich früher nicht gedacht. Bei uns wäre das gefährlich gewesen.
    meaning:
      en: I wouldn't have thought that before. Where I'm from that would have been dangerous.
      ar: ما كنتُ لأظن ذلك من قبل. عندنا كان ذلك سيكون خطرًا.
      mk: Порано не би помислил така. Кај нас тоа ќе беше опасно.
  - speaker: hartmann
    text: 'Aber auch hier gibt es Grenzen: Beleidigung und Hetze sind verboten.'
    meaning:
      en: 'But here too there are limits: insults and incitement are forbidden.'
      ar: 'لكن هنا أيضًا حدود: الإهانة والتحريض ممنوعان.'
      mk: 'Но и тука има граници: навредата и поттикнувањето омраза се забранети.'
  - speaker: protagonist
    text: Wenn ich das früher gewusst hätte, wäre ich früher gekommen!
    meaning:
      en: If I'd known that earlier, I'd have come sooner!
      ar: لو كنتُ أعرف ذلك من قبل، لجئتُ أبكر!
      mk: Да го знаев тоа порано, ќе дојдев порано!
