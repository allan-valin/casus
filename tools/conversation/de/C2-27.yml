    text: Heute treffe ich keine Entscheidung.
  items:
  - die-entscheidung-c2
- type: narrator
  text:
    en: 'Staying, moving within Germany, or going back are all legitimate — and none is final: residence rights, pensions and qualifications can often be kept or transferred. Before deciding, check what
      a longer absence means for your residence status.'
    ar: 'البقاء أو الانتقال داخل ألمانيا أو العودة كلها خيارات مشروعة — ولا شيء منها نهائي: حقوق الإقامة والتقاعد والمؤهّلات يمكن غالبًا الاحتفاظ بها أو نقلها. وقبل القرار، تحقّقي مما يعنيه الغياب الطويل
      لوضع إقامتكِ.'
    mk: 'Останувањето, селењето во рамки на Германија или враќањето се сите легитимни — и ниту едно не е конечно: правата на престој, пензиите и квалификациите често може да се задржат или пренесат. Пред
      да одлучите, проверете што значи подолго отсуство за вашиот статус на престој.'
