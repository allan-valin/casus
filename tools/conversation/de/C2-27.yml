steps:
- type: narrator
  text:
    en: 'An offer: a good job in Munich. Or stay in Leipzig. Or go back home one day. Over a long evening, Lena helps you weigh it up. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'عرض: وظيفة جيدة في ميونخ. أو البقاء في لايبزيغ. أو العودة يومًا إلى الوطن. في سهرة طويلة تساعدكِ لينا على الموازنة. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.'
    mk: 'Понуда: добра работа во Минхен. Или да останете во Лајпциг. Или еден ден да се вратите дома. Во долга вечер Лена ви помага да одмерите. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: lena
    text: 'Also: das Jobangebot in München. Was spricht dafür?'
    meaning:
      en: 'So: the job offer in Munich. What speaks for it?'
      ar: 'إذن: عرض العمل في ميونخ. ما الذي يؤيّده؟'
      mk: 'Значи: понудата за работа во Минхен. Што зборува за тоа?'
  - speaker: protagonist
    text: Mehr Geld, mehr Verantwortung. Aber würde ich gehen, verlöre ich alles, was ich hier aufgebaut habe.
    meaning:
      en: More money, more responsibility. But if I went, I'd lose everything I've built here.
      ar: مال أكثر ومسؤولية أكبر. لكن لو ذهبتُ لخسرتُ كل ما بنيته هنا.
      mk: Повеќе пари, повеќе одговорност. Но да заминам, би изгубила сè што изградив тука.
  - speaker: lena
    text: Und zurück in die Heimat?
    meaning:
      en: And back home?
      ar: والعودة إلى الوطن؟
      mk: А назад дома?
  - speaker: protagonist
    text: Manchmal denke ich daran. Hätte mir jemand vor zehn Jahren gesagt, dass ich hier Wurzeln schlage — ich hätte gelacht.
    meaning:
      en: Sometimes I think about it. If someone had told me ten years ago that I'd put down roots here — I'd have laughed.
      ar: أحيانًا أفكّر في ذلك. لو قال لي أحد قبل عشر سنوات إنني سأضرب جذورًا هنا — لضحكتُ.
      mk: Понекогаш размислувам. Да ми кажеше некој пред десет години дека тука ќе пуштам корени — ќе се смеев.
  - speaker: lena
    text: Jede Entscheidung hat ihren Preis. Was sagt dein Bauchgefühl?
    meaning:
      en: Every decision comes at a price. What does your gut say?
      ar: لكل قرار ثمنه. ماذا يقول حدسكِ؟
      mk: Секоја одлука има своја цена. Што ти вели стомакот?
  - speaker: protagonist
    text: 'Mein Bauch sagt: bleiben. Mein Kopf sagt: das Für und Wider aufschreiben.'
    meaning:
      en: 'My gut says: stay. My head says: write down the pros and cons.'
      ar: 'حدسي يقول: ابقي. وعقلي يقول: اكتبي الإيجابيات والسلبيات.'
      mk: 'Стомакот ми вели: остани. Главата ми вели: запиши за и против.'
  - speaker: lena
    text: 'Typisch deutsch geworden! Aber vergiss nicht: Nichts ist endgültig.'
    meaning:
      en: 'You''ve become typically German! But don''t forget: nothing is final.'
      ar: 'صرتِ ألمانية نموذجية! لكن لا تنسي: لا شيء نهائي.'
      mk: 'Стана типично германски! Но не заборавај: ништо не е конечно.'
  - speaker: protagonist
    text: Dann treffe ich heute keine Entscheidung. Heute trinken wir Tee.
    meaning:
      en: Then I won't make a decision today. Today we drink tea.
      ar: إذن لن أتّخذ قرارًا اليوم. اليوم نشرب الشاي.
      mk: Тогаш денес нема да донесам одлука. Денес пиеме чај.
- type: prompt
  ask:
    en: 'Say: the job offer.'
    ar: 'قولي: عرض العمل.'
    mk: 'Кажете: понудата за работа.'
  answer:
    speaker: protagonist
    text: Das Jobangebot.
  items:
  - das-jobangebot
- type: narrator
  text:
    en: 'Konjunktiv for weighing a life choice: «Würde ich gehen, verlöre ich…» (if I went, I''d lose — with the old Konjunktiv II «verlöre»), «Hätte mir jemand gesagt…, hätte ich gelacht» (past unreal).
      The «wenn» can be dropped: the verb moves to the front.'
    ar: 'صيغة التمني لموازنة قرار مصيري: «Würde ich gehen, verlöre ich…» (لو ذهبتُ لخسرتُ — بالصيغة القديمة «verlöre»)، «Hätte mir jemand gesagt…, hätte ich gelacht» (فرضية ماضية). ويمكن حذف «wenn»: فيتقدّم
      الفعل إلى البداية.'
    mk: 'Konjunktiv за одмерување животен избор: «Würde ich gehen, verlöre ich…» (да заминам, би изгубила — со стариот Konjunktiv II «verlöre»), «Hätte mir jemand gesagt…, hätte ich gelacht» (минато нереално).
      «wenn» може да се испушти: глаголот оди напред.'
- type: prompt
  ask:
    en: 'Say: if I went, I''d lose everything.'
    ar: 'قولي: لو ذهبتُ لخسرتُ كل شيء.'
    mk: 'Кажете: да заминам, би изгубила сè.'
  answer:
    speaker: protagonist
    text: Würde ich gehen, verlöre ich alles.
  items:
  - wuerde-ich-gehen
