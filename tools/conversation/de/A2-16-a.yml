steps:
- type: narrator
  text:
    ar: في «Familienkasse»، مكتب إعانات العائلة. تقدّم طلب إعانة الأطفال ليارا. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
- type: dialogue
  lines:
  - speaker: schulz
    text: Sie möchten Kindergeld beantragen?
    meaning:
      ar: تريد أن تقدّم طلب إعانة الأطفال؟
  - speaker: protagonist
    text: Ja. Hier ist der Antrag für meine Tochter.
    meaning:
      ar: نعم. هذا الطلب لابنتي.
  - speaker: schulz
    text: Haben Sie die Geburtsurkunde?
    meaning:
      ar: هل معك شهادة الميلاد؟
  - speaker: protagonist
    text: Ja, übersetzt. Die Übersetzung war teuer.
    meaning:
      ar: نعم، مترجَمة. الترجمة كانت غالية.
  - speaker: schulz
    text: Und die Steuer-ID des Kindes?
    meaning:
      ar: والرقم الضريبي للطفلة؟
  - speaker: protagonist
    text: Hier. Ich hatte sie zuerst nicht — sie kam per Post.
    meaning:
      ar: تفضّل. لم يكن معي في البداية — وصل بالبريد.
  - speaker: schulz
    text: Gut. Sie bekommen einen Bescheid per Post.
    meaning:
      ar: جيد. ستصلك رسالة القرار بالبريد.
  - speaker: protagonist
    text: Gibt es das Geld auch rückwirkend?
    meaning:
      ar: هل يُدفع المال بأثر رجعي أيضًا؟
  - speaker: schulz
    text: Für einige Monate, ja. Die genauen Regeln stehen im Bescheid.
    meaning:
      ar: لعدة أشهر، نعم. القواعد الدقيقة مكتوبة في القرار.
