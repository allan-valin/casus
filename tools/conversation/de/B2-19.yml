steps:
- type: narrator
  text:
    en: 'At the VHS everyone gives a five-minute talk. Yours: your home town. Professor Hartmann gives feedback. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'في الجامعة الشعبية يقدّم كل واحد عرضًا مدته خمس دقائق. عرضك: مدينتك. البروفيسور هارتمان يعطي ملاحظاته. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.'
    mk: 'На народниот универзитет секој држи говор од пет минути. Вашиот: родниот град. Професорот Хартман дава повратна информација. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: Mein Thema ist meine Heimatstadt. Zunächst die Geschichte, anschließend das Essen, zum Schluss die Menschen.
    meaning:
      en: My topic is my home town. First the history, then the food, finally the people.
      ar: موضوعي مدينتي. أولًا التاريخ، بعد ذلك الطعام، وفي الختام الناس.
      mk: Мојата тема е мојот роден град. Најпрвин историјата, потоа храната, на крајот луѓето.
  - speaker: protagonist
    text: Auf dieser Folie sehen Sie die Altstadt.
    meaning:
      en: On this slide you can see the old town.
      ar: في هذه الشريحة ترون المدينة القديمة.
      mk: На овој слајд го гледате стариот град.
  - speaker: protagonist
    text: 'Zusammenfassend: eine alte Stadt mit jungen Menschen. Vielen Dank für Ihre Aufmerksamkeit. Gibt es Fragen?'
    meaning:
      en: 'In summary: an old city with young people. Thank you for your attention. Are there any questions?'
      ar: 'باختصار: مدينة قديمة بأناس شباب. شكرًا على حسن استماعكم. هل هناك أسئلة؟'
      mk: 'Накратко: стар град со млади луѓе. Благодарам за вниманието. Има ли прашања?'
  - speaker: hartmann
    text: Sehr gut! Die Gliederung war klar. Das ist in Deutschland wichtig.
    meaning:
      en: Very good! The structure was clear. That's important in Germany.
      ar: جيد جدًا! الهيكل كان واضحًا. هذا مهم في ألمانيا.
      mk: Многу добро! Структурата беше јасна. Тоа е важно во Германија.
  - speaker: protagonist
    text: Und was kann ich besser machen?
    meaning:
      en: And what can I do better?
      ar: وماذا يمكنني أن أحسّن؟
      mk: А што можам да направам подобро?
  - speaker: hartmann
    text: Mehr Blickkontakt. Sie haben fast nur auf die Folien geschaut.
    meaning:
      en: More eye contact. You looked almost only at the slides.
      ar: تواصل بصري أكثر. كنتَ تنظر إلى الشرائح فقط تقريبًا.
      mk: Повеќе контакт со очите. Гледавте речиси само во слајдовите.
  - speaker: protagonist
    text: Ich war nervös.
    meaning:
      en: I was nervous.
      ar: كنتُ متوترًا.
      mk: Бев нервозен.
  - speaker: hartmann
    text: Das merkt man nicht. Nur weniger Text auf den Folien — höchstens fünf Zeilen.
    meaning:
      en: You couldn't tell. Just less text on the slides — five lines at most.
      ar: لم يكن ذلك ظاهرًا. فقط نص أقل على الشرائح — خمسة أسطر على الأكثر.
      mk: Не се забележува. Само помалку текст на слајдовите — најмногу пет реда.
- type: prompt
  ask:
    en: 'Say: my topic is my home town.'
    ar: 'قل: موضوعي مدينتي.'
    mk: 'Кажете: мојата тема е мојот роден град.'
  answer:
    speaker: protagonist
    text: Mein Thema ist meine Heimatstadt.
  items:
  - die-heimatstadt
- type: narrator
  text:
    en: 'Talks follow signposts: «zunächst» (first), «anschließend» (then), «zum Schluss» (finally), «zusammenfassend» (in summary). The verb comes right after them.'
    ar: 'العروض تتبع إشارات طريق: «zunächst» (أولًا)، «anschließend» (بعد ذلك)، «zum Schluss» (في الختام)، «zusammenfassend» (باختصار). والفعل يأتي بعدها مباشرة.'
    mk: 'Говорите следат патокази: «zunächst» (најпрвин), «anschließend» (потоа), «zum Schluss» (на крајот), «zusammenfassend» (накратко). Глаголот доаѓа веднаш по нив.'
- type: prompt
  ask:
    en: 'Say: first the history, then the food.'
    ar: 'قل: أولًا التاريخ، بعد ذلك الطعام.'
    mk: 'Кажете: најпрвин историјата, потоа храната.'
  answer:
    speaker: protagonist
    text: Zunächst die Geschichte, anschließend das Essen.
  items:
  - zunaechst
  - anschliessend
- type: prompt
  ask:
    en: 'Say: on this slide you see the old town.'
    ar: 'قل: في هذه الشريحة ترون المدينة القديمة.'
    mk: 'Кажете: на овој слајд го гледате стариот град.'
  answer:
    speaker: protagonist
    text: Auf dieser Folie sehen Sie die Altstadt.
  items:
  - die-folie
- type: prompt
  ask:
    en: 'Say: in summary.'
