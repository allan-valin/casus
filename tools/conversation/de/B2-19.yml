  items:
  - zusammenfassend
- type: prompt
  ask:
    en: End your talk politely.
    ar: اختم عرضك بأدب.
    mk: Завршете го говорот учтиво.
  answer:
    speaker: protagonist
    text: Vielen Dank für Ihre Aufmerksamkeit.
  items:
  - vielen-dank-fuer-ihre
- type: prompt
  ask:
    en: 'Ask: are there any questions?'
    ar: 'اسأل: هل هناك أسئلة؟'
    mk: 'Прашајте: има ли прашања?'
  answer:
    speaker: protagonist
    text: Gibt es Fragen?
  items:
  - gibt-es-fragen
- type: prompt
  ask:
    en: 'He says: the structure was clear.'
    ar: 'يقول: الهيكل كان واضحًا.'
    mk: 'Тој вели: структурата беше јасна.'
  answer:
