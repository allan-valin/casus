- type: narrator
  text:
    en: 'German audiences expect the structure up front (''first…, then…, finally…''), a clear summary and time kept to the minute. Slides support you, they don''t replace you: few lines, big pictures,
      eyes on the audience.'
    ar: 'الجمهور الألماني يتوقّع الهيكل من البداية («أولًا…، ثم…، وأخيرًا…»)، وخلاصة واضحة، والتزامًا بالوقت حتى الدقيقة. الشرائح تدعمك ولا تحلّ محلّك: أسطر قليلة، صور كبيرة، وعيناك على الجمهور.'
    mk: 'Германската публика ја очекува структурата однапред („најпрвин…, потоа…, на крајот…“), јасно сумирање и почитување на времето до минута. Слајдовите ве поддржуваат, не ве заменуваат: малку редови,
      големи слики, очите кон публиката.'
