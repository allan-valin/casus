steps:
- type: narrator
  text:
    en: 'A letter from a law firm: you shared a film online, they say. They want hundreds of euros. You show it to Jonas. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'رسالة من مكتب محاماة: يقولون إنكِ شاركتِ فيلمًا على الإنترنت. يريدون مئات اليوروهات. تُرين الرسالة ليوناس. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.'
    mk: 'Писмо од адвокатска канцеларија: велат дека сте споделиле филм на интернет. Бараат стотици евра. Му го покажувате на Јонас. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: Jonas, was ist eine Abmahnung? Hier steht, ein Film wurde von mir geteilt.
    meaning:
      en: Jonas, what's an Abmahnung? It says a film was shared by me.
      ar: يوناس، ما هي «Abmahnung»؟ مكتوب هنا أن فيلمًا شوركَ مني.
      mk: Јонас, што е опомена? Тука пишува дека сум споделила филм.
  - speaker: jonas
    text: Oh nein. Hast du Filme über Tauschbörsen geladen?
    meaning:
      en: Oh no. Did you download films through file-sharing?
      ar: يا للأسف. هل حمّلتِ أفلامًا عبر مواقع المشاركة؟
      mk: О, не. Дали симнуваше филмови преку споделување датотеки?
  - speaker: protagonist
    text: Einmal... Sie wollen achthundert Euro. Und ich soll das hier unterschreiben.
    meaning:
      en: Once... They want eight hundred euros. And I'm supposed to sign this.
      ar: مرة واحدة... يريدون ثمانمئة يورو. ويجب أن أوقّع هذا.
      mk: Еднаш... Бараат осумстотини евра. И треба да го потпишам ова.
  - speaker: jonas
    text: Unterschreib nichts und zahl nicht sofort! Das ist eine Unterlassungserklärung.
    meaning:
      en: Sign nothing and don't pay straight away! That's a cease-and-desist declaration.
      ar: لا توقّعي شيئًا ولا تدفعي فورًا! هذا تعهّد بالامتناع.
      mk: Не потпишувај ништо и не плаќај веднаш! Тоа е изјава за прекин.
  - speaker: protagonist
    text: Und jetzt? Was mache ich jetzt?
    meaning:
      en: And now? What do I do now?
      ar: والآن؟ ماذا أفعل الآن؟
      mk: А сега? Што правам сега?
  - speaker: jonas
    text: Mein Cousin hatte das auch. Er ging zu einem eigenen Anwalt.
    meaning:
      en: My cousin had this too. He went to a lawyer of his own.
      ar: ابن عمي حدث له ذلك أيضًا. ذهب إلى محامٍ خاص به.
      mk: И братучед ми го имаше ова. Отиде кај свој адвокат.
  - speaker: protagonist
    text: Und?
    meaning:
      en: And?
      ar: وماذا حدث؟
      mk: И?
  - speaker: jonas
    text: Der Anwalt hat verhandelt. Am Ende war es viel weniger. Aber achte auf die Frist!
    meaning:
      en: The lawyer negotiated. In the end it was much less. But watch the deadline!
      ar: المحامي فاوض. في النهاية كان المبلغ أقل بكثير. لكن انتبهي للمهلة!
      mk: Адвокатот преговараше. На крајот беше многу помалку. Но внимавај на рокот!
