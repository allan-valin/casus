- type: narrator
  text:
    en: 'Sharing films or music through file-sharing networks is tracked and brings warning letters from law firms. Don''t ignore the deadline — but don''t sign their declaration or pay at once either.
      A lawyer of your own, or a consumer advice centre, often costs less than the demand and negotiates it down. (The course gives no amounts: they vary by case.)'
    ar: 'مشاركة الأفلام أو الموسيقى عبر شبكات تبادل الملفات تُرصد، وتجلب إنذارات من مكاتب المحاماة. لا تتجاهلي المهلة — لكن لا توقّعي تعهّدهم ولا تدفعي فورًا. محامٍ خاص بكِ أو مركز استشارات المستهلك يكلّف
      غالبًا أقل من المطلوب ويخفّض المبلغ بالتفاوض. (لا نذكر مبالغ: تختلف من حالة لأخرى.)'
    mk: 'Споделувањето филмови или музика преку мрежи за размена се следи и носи опомени од адвокатски канцеларии. Не го игнорирајте рокот — но ниту потпишувајте ја нивната изјава, ниту плаќајте веднаш.
      Свој адвокат или потрошувачко советувалиште често чини помалку од бараното и го намалува со преговори. (Курсот не дава износи: зависат од случајот.)'
