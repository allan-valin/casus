steps:
- type: narrator
  text:
    mk: Гордана ви раскажува за својата тетка, која со години трпела — и што научила тука. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: gordana
    text: Meine Tante hat jahrelang geschwiegen. Ihr Mann hat sie geschlagen.
    meaning:
      mk: Мојата тетка молчеше со години. Мажот ја тепаше.
  - speaker: protagonist
    text: Und niemand hat geholfen?
    meaning:
      mk: И никој не помогна?
  - speaker: gordana
    text: 'Man sagte: Das ist Familiensache. Und manche gaben ihr sogar die Schuld.'
    meaning:
      mk: 'Велеа: тоа е семејна работа. А некои дури неа ја обвинуваа.'
  - speaker: protagonist
    text: Sie war das Opfer. Nie die Schuldige.
    meaning:
      mk: Таа беше жртвата. Никогаш виновникот.
  - speaker: gordana
    text: Hier ist häusliche Gewalt keine Familiensache, sondern eine Straftat.
    meaning:
      mk: Тука семејното насилство не е семејна работа, туку кривично дело.
  - speaker: protagonist
    text: Und Gleichberechtigung gilt für alle — auch für ältere Frauen.
    meaning:
      mk: А еднаквите права важат за сите — и за постарите жени.
  - speaker: gordana
    text: Es gibt ein Hilfetelefon, anonym und in vielen Sprachen.
    meaning:
      mk: Има телефонска линија за помош, анонимна и на многу јазици.
  - speaker: protagonist
    text: Und Frauenhäuser. Die Entscheidung über das eigene Leben hat jede Frau selbst.
    meaning:
      mk: И засолништа за жени. Одлуката за сопствениот живот секоја жена ја носи сама.
