steps:
- type: narrator
  text:
    en: Ten years in Germany. You've invited everyone — Jonas, Svenja, Lena, Paul, Petra, even Herr Schulz. Time for your speech. Listen to the conversation; you don't need to understand it yet.
    ar: عشر سنوات في ألمانيا. دعوتِ الجميع — يوناس وسفينيا ولينا وباول وبيترا، وحتى السيد شولتس. حان وقت كلمتكِ. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Десет години во Германија. Ги поканивте сите — Јонас, Свења, Лена, Паул, Петра, дури и господин Шулц. Време е за вашиот говор. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 'Liebe Freunde! Vor zehn Jahren war mein erstes deutsches Wort: „Entschuldigung“.'
    meaning:
      en: 'Dear friends! Ten years ago my first German word was: ''Entschuldigung'' (sorry).'
      ar: 'أصدقائي الأعزاء! قبل عشر سنوات كانت أول كلمة ألمانية لي: «Entschuldigung» (عذرًا).'
      mk: 'Драги пријатели! Пред десет години мојот прв германски збор беше: „Entschuldigung“ (извинете).'
  - speaker: protagonist
    text: Ich sagte es zu Herrn Schulz, weil ich die falsche Nummer gezogen hatte.
    meaning:
      en: I said it to Herr Schulz, because I'd taken the wrong number.
      ar: قلتُها للسيد شولتس، لأنني أخذتُ الرقم الخطأ.
      mk: Му го реков на господин Шулц, затоа што имав земено погрешен број.
  - speaker: schulz
    text: (lacht) Daran erinnere ich mich!
    meaning:
      en: (laughs) I remember that!
      ar: (يضحك) أتذكّر ذلك!
      mk: (се смее) Се сеќавам на тоа!
  - speaker: protagonist
    text: Heute stehe ich hier — mit einem Job, einem Verein, einer Wohnung und, vor allem, mit euch.
    meaning:
      en: Today I stand here — with a job, a club, a flat and, above all, with you.
      ar: اليوم أقف هنا — بوظيفة ونادٍ وشقة، وفوق كل شيء معكم.
      mk: Денес стојам тука — со работа, клуб, стан и, пред сѐ, со вас.
  - speaker: protagonist
    text: 'Mein Dank gilt euch allen: für eure Geduld, eure Kritik und euren Kuchen.'
    meaning:
      en: 'My thanks go to all of you: for your patience, your criticism and your cake.'
      ar: 'شكري موجّه إليكم جميعًا: على صبركم ونقدكم وكعككم.'
      mk: 'Мојата благодарност оди кон сите вас: за трпението, критиката и колачот.'
  - speaker: protagonist
    text: Der Weg war nicht immer leicht. Aber ihr wart an meiner Seite. Das ist das größte Geschenk.
    meaning:
      en: The journey wasn't always easy. But you were at my side. That's the greatest gift.
      ar: لم يكن الطريق سهلًا دائمًا. لكنكم كنتم إلى جانبي. هذه أعظم هدية.
      mk: Патот не беше секогаш лесен. Но вие бевте до мене. Тоа е најголемиот подарок.
  - speaker: jonas
    text: Und dein Deutsch ist inzwischen besser als meins!
    meaning:
      en: And by now your German is better than mine!
      ar: ولغتكِ الألمانية الآن أفضل من لغتي!
      mk: А твојот германски сега е подобар од мојот!
  - speaker: protagonist
    text: Nicht schlecht, oder? — Auf uns!
    meaning:
      en: Not bad, right? — To us!
      ar: ليس سيئًا، أليس كذلك؟ — نخبنا!
      mk: Не е лошо, нели? — За нас!
- type: prompt
  ask:
    en: 'Say: ten years ago.'
    ar: 'قولي: قبل عشر سنوات.'
    mk: 'Кажете: пред десет години.'
  answer:
    speaker: protagonist
    text: Vor zehn Jahren.
  items:
  - vor-zehn-jahren
- type: prompt
  ask:
    en: 'Say: my first German word.'
    ar: 'قولي: أول كلمة ألمانية لي.'
    mk: 'Кажете: мојот прв германски збор.'
  answer:
    speaker: protagonist
    text: Mein erstes deutsches Wort.
  items:
  - mein-erstes-wort
- type: narrator
  text:
    en: 'A personal speech uses a frame: start with a small, funny memory («Vor zehn Jahren…»), turn to the present («Heute stehe ich hier…»), list with rhythm («mit einem Job, einem Verein, einer Wohnung»),
      thank («Mein Dank gilt…») and end on a toast — ideally with a callback, like «Nicht schlecht».'
    ar: 'الكلمة الشخصية تستعمل إطارًا: ابدئي بذكرى صغيرة طريفة («Vor zehn Jahren…»)، ثم انتقلي إلى الحاضر («Heute stehe ich hier…»)، وعدّدي بإيقاع («mit einem Job, einem Verein, einer Wohnung»)، واشكري
      («Mein Dank gilt…») واختمي بنخب — ويُستحسن بإحالة إلى ما سبق، مثل «Nicht schlecht».'
    mk: 'Личниот говор користи рамка: почнете со мало, смешно сеќавање («Vor zehn Jahren…»), свртете кон сегашноста («Heute stehe ich hier…»), набројувајте со ритам («mit einem Job, einem Verein, einer
      Wohnung»), заблагодарете («Mein Dank gilt…») и завршете со здравица — идеално со повикување на нешто претходно, како «Nicht schlecht».'
- type: prompt
  ask:
    en: 'Say: today I stand here.'
