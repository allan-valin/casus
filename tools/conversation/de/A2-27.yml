steps:
- type: narrator
  text:
    en: Frau Becker has a saying for everything. Today she explains a few. Listen to the conversation; you don't need to understand it yet.
    ar: السيدة بيكر لديها مثل لكل شيء. اليوم تشرح لكِ بعضها. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Госпоѓа Бекер има поговорка за сè. Денес ви објаснува неколку. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: becker
    text: Ende gut, alles gut! Ihre Heizung funktioniert wieder.
    meaning:
      en: All's well that ends well! Your heating works again.
      ar: العبرة بالخواتيم! تدفئتكِ تعمل من جديد.
      mk: Сè е добро што добро завршува! Греењето пак ви работи.
  - speaker: protagonist
    text: Was heißt das, „Ende gut, alles gut“?
    meaning:
      en: What does it mean, 'Ende gut, alles gut'?
      ar: ماذا يعني «Ende gut, alles gut»؟
      mk: Што значи „Ende gut, alles gut“?
  - speaker: becker
    text: Wenn das Ende gut ist, ist alles gut. Das ist ein Sprichwort.
    meaning:
      en: If the end is good, everything's good. It's a saying.
      ar: إذا كانت النهاية جيدة، فكل شيء جيد. هذا مثل.
      mk: Ако крајот е добар, сè е добро. Тоа е поговорка.
  - speaker: protagonist
    text: Haben Sie noch eins?
    meaning:
      en: Do you have another one?
      ar: هل عندكِ مثل آخر؟
      mk: Имате ли уште една?
  - speaker: becker
    text: „Der frühe Vogel fängt den Wurm.“ Ein Mensch, der früh aufsteht, hat Erfolg.
    meaning:
      en: '''The early bird catches the worm.'' A person who gets up early succeeds.'
      ar: «الطائر المبكر يصطاد الدودة.» الإنسان الذي يستيقظ باكرًا ينجح.
      mk: „Раната птица го фаќа црвот.“ Човек што рано станува успева.
  - speaker: protagonist
    text: Bei uns sagt man fast das Gleiche!
    meaning:
      en: Where I'm from we say almost the same!
      ar: عندنا يقولون الشيء نفسه تقريبًا!
      mk: Кај нас се вели речиси исто!
  - speaker: becker
    text: 'Und mein Lieblingssprichwort: „Ordnung muss sein.“'
    meaning:
      en: 'And my favourite saying: ''There must be order.'''
      ar: 'ومثلي المفضّل: «لا بد من النظام.»'
      mk: 'А мојата омилена поговорка: „Мора да има ред.“'
  - speaker: protagonist
    text: 'Das passt zu Ihnen! Und für mich: „Aller Anfang ist schwer.“'
    meaning:
      en: 'That suits you! And for me: ''Every beginning is hard.'''
      ar: 'هذا يناسبكِ! أما أنا: «كل بداية صعبة.»'
      mk: 'Тоа ви одговара! А за мене: „Секој почеток е тежок.“'
- type: prompt
  ask:
    en: 'Say: all''s well that ends well.'
    ar: 'قولي: العبرة بالخواتيم.'
    mk: 'Кажете: сè е добро што добро завршува.'
  answer:
    speaker: protagonist
    text: Ende gut, alles gut.
  items:
  - ende-gut
