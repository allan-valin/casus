steps:
- type: narrator
  text:
    en: The club's youth coach is leaving. Petra asks if you'd take over the under-tens — and explains what that involves. Listen to the conversation; you don't need to understand it yet.
    ar: مدرّب الناشئين في النادي يغادر. بيترا تسألكِ إن كنتِ ستتولّين فريق ما دون العاشرة — وتشرح ما يتطلّبه ذلك. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Тренерот на младите во клубот заминува. Петра ве прашува дали би ги презеле децата под десет — и објаснува што значи тоа. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: petra
    text: Würdest du die Kinder übernehmen? Du wärst die neue Jugendtrainerin.
    meaning:
      en: Would you take over the kids? You'd be the new youth coach.
      ar: هل تتولّين الأطفال؟ ستكونين مدرّبة الناشئين الجديدة.
      mk: Би ги презела ли децата? Ќе бидеш новата тренерка на младите.
  - speaker: protagonist
    text: Gern! Aber das ist viel Verantwortung.
    meaning:
      en: Gladly! But that's a lot of responsibility.
      ar: بكل سرور! لكن هذه مسؤولية كبيرة.
      mk: Со задоволство! Но тоа е голема одговорност.
  - speaker: petra
    text: Stimmt. Zuerst hast du ein erweitertes Führungszeugnis vorzulegen. Das ist Pflicht.
    meaning:
      en: True. First you have to show an extended police certificate. It's compulsory.
      ar: صحيح. أولًا عليكِ أن تقدّمي شهادة حسن سيرة موسّعة. هذا إلزامي.
      mk: Точно. Прво треба да поднесеш проширено уверение за неосудуваност. Тоа е задолжително.
  - speaker: protagonist
    text: Und muss ich eine Ausbildung machen?
    meaning:
      en: And do I need training?
      ar: وهل يجب أن أتدرّب؟
      mk: А мора ли да се обучам?
  - speaker: petra
    text: Der Verein bezahlt dir die Übungsleiterlizenz. Es ist wichtig, die Regeln zu kennen.
    meaning:
      en: The club pays for your coaching licence. It's important to know the rules.
      ar: النادي يدفع لكِ رخصة المدرّب. من المهم أن تعرفي القواعد.
      mk: Клубот ти ја плаќа тренерската лиценца. Важно е да ги знаеш правилата.
  - speaker: protagonist
    text: Welche Regeln?
    meaning:
      en: Which rules?
      ar: أي قواعد؟
      mk: Кои правила?
  - speaker: petra
    text: Die Aufsichtspflicht ist immer zu beachten. Kein Kind geht allein nach Hause, ohne die Eltern zu informieren.
    meaning:
      en: The duty of supervision must always be observed. No child goes home alone without informing the parents.
      ar: واجب الإشراف يجب مراعاته دائمًا. لا يذهب أي طفل إلى البيت وحده دون إبلاغ الأهل.
      mk: Должноста за надзор секогаш треба да се почитува. Ниту едно дете не оди само дома без да се известат родителите.
  - speaker: protagonist
    text: Und anstatt nur zu gewinnen, sollen sie Spaß haben.
    meaning:
      en: And instead of just winning, they should have fun.
      ar: وبدلًا من أن يفوزوا فقط، يجب أن يستمتعوا.
      mk: И наместо само да победуваат, треба да се забавуваат.
  - speaker: petra
    text: Genau die richtige Einstellung!
    meaning:
      en: Exactly the right attitude!
      ar: هذا بالضبط الموقف الصحيح!
      mk: Токму вистинскиот став!
- type: prompt
  ask:
    en: 'Say: the youth coach.'
    ar: 'قولي: مدرّبة الناشئين.'
    mk: 'Кажете: тренерката на младите.'
  answer:
    speaker: protagonist
    text: Die Jugendtrainerin.
  items:
  - der-jugendtrainer
- type: prompt
  ask:
    en: 'Say: a lot of responsibility.'
    ar: 'قولي: مسؤولية كبيرة.'
    mk: 'Кажете: голема одговорност.'
  answer:
    speaker: protagonist
    text: Viel Verantwortung.
  items:
  - die-verantwortung
- type: narrator
  text:
    en: 'Infinitive constructions for duties: «haben … zu» (= must: «Du hast ein Zeugnis vorzulegen»), «sein … zu» (= must be done: «Die Aufsichtspflicht ist zu beachten»), and «es ist wichtig, … zu», «ohne
      … zu», «anstatt … zu».'
    ar: 'تراكيب المصدر للواجبات: «haben … zu» (= يجب: «Du hast ein Zeugnis vorzulegen»)، «sein … zu» (= يجب أن يُفعل: «Die Aufsichtspflicht ist zu beachten»)، و«es ist wichtig, … zu»، «ohne … zu»، «anstatt
      … zu».'
    mk: 'Инфинитивни конструкции за обврски: «haben … zu» (= мора: «Du hast ein Zeugnis vorzulegen»), «sein … zu» (= мора да се направи: «Die Aufsichtspflicht ist zu beachten»), и «es ist wichtig, … zu»,
      «ohne … zu», «anstatt … zu».'
- type: prompt
  ask:
    en: 'She says: you have to show an extended police certificate.'
    ar: 'تقول: عليكِ أن تقدّمي شهادة حسن سيرة موسّعة.'
    mk: 'Таа вели: треба да поднесеш проширено уверение.'
  answer:
    speaker: protagonist
    text: Du hast ein erweitertes Führungszeugnis vorzulegen.
  items:
  - hat-zu
  - das-fuehrungszeugnis
- type: prompt
  ask:
    en: 'Say: the coaching licence.'
    ar: 'قولي: رخصة المدرّب.'
    mk: 'Кажете: тренерската лиценца.'
  answer:
    speaker: protagonist
    text: Die Übungsleiterlizenz.
  items:
  - die-uebungsleiterlizenz
- type: prompt
  ask:
    en: 'Say: it''s important to know the rules.'
    ar: 'قولي: من المهم أن تعرفي القواعد.'
    mk: 'Кажете: важно е да ги знаеш правилата.'
  answer:
    speaker: protagonist
    text: Es ist wichtig, die Regeln zu kennen.
  items:
  - es-ist-wichtig-zu
- type: prompt
  ask:
    en: 'Say: the duty of supervision must be observed.'
    ar: 'قولي: واجب الإشراف يجب مراعاته.'
    mk: 'Кажете: должноста за надзор треба да се почитува.'
  answer:
    speaker: protagonist
    text: Die Aufsichtspflicht ist zu beachten.
  items:
  - die-aufsichtspflicht
  - ist-zu-beachten
- type: prompt
  ask:
    en: 'Say: without informing the parents.'
    ar: 'قولي: دون إبلاغ الأهل.'
    mk: 'Кажете: без да се известат родителите.'
  answer:
    speaker: protagonist
    text: Ohne die Eltern zu informieren.
  items:
  - die-eltern-anrufen
- type: prompt
  ask:
    en: 'Say: instead of just winning.'
    ar: 'قولي: بدلًا من أن يفوزوا فقط.'
    mk: 'Кажете: наместо само да победуваат.'
  answer:
    speaker: protagonist
    text: Anstatt nur zu gewinnen.
  items:
  - anstatt-zu
- type: narrator
  text:
    en: 'Anyone working with children in a club must show an extended police certificate (cheap or free for volunteers). Clubs pay for coaching licences, and youth coaches get a small tax-free allowance.
      Supervision duty is serious: a child leaves only with a parent or with their written permission.'
    ar: 'كل من يعمل مع الأطفال في نادٍ يجب أن يقدّم شهادة حسن سيرة موسّعة (رخيصة أو مجانية للمتطوعين). والأندية تدفع رخص التدريب، ومدرّبو الناشئين يحصلون على تعويض صغير معفى من الضريبة. وواجب الإشراف جدّي:
      لا يغادر الطفل إلا مع أحد والديه أو بإذنهما الكتابي.'
    mk: 'Секој што работи со деца во клуб мора да поднесе проширено уверение за неосудуваност (евтино или бесплатно за волонтери). Клубовите ги плаќаат тренерските лиценци, а тренерите на младите добиваат
      мал неоданочен надоместок. Должноста за надзор е сериозна: детето заминува само со родител или со нивна писмена дозвола.'
- type: prompt
  ask:
    en: 'Once more: say “the youth coach (f)”.'
    ar: 'مرة أخرى: قولي “مدرّبة الناشئين”.'
    mk: 'Уште еднаш: кажете „тренерката на младите“.'
  answer:
