steps:
- type: narrator
  text:
    mk: Родителите на Ања доаѓаат на кафе кај Петар. Прв пат ги запознавате пријателите — сватовите. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: anja
    text: Mama, Papa — das ist Petars Mutter!
    meaning:
      mk: Мамо, тато — ова е мајката на Петар!
  - speaker: frauwolf
    text: Guten Tag! Schön, Sie kennenzulernen.
    meaning:
      mk: Добар ден! Мило ми е што ве запознав.
  - speaker: protagonist
    text: Guten Tag. Freut mich. Ich spreche nur ein bisschen Deutsch.
    meaning:
      mk: Добар ден. Мило ми е. Зборувам само малку германски.
  - speaker: herrwolf
    text: Kein Problem! Möchten Sie Kaffee?
    meaning:
      mk: Нема проблем! Сакате ли кафе?
  - speaker: protagonist
    text: Ja, gern.
    meaning:
      mk: Да, со задоволство.
  - speaker: frauwolf
    text: Und ein Stück Kuchen? Der Kuchen ist selbst gemacht.
    meaning:
      mk: И парче колач? Колачот е домашен.
  - speaker: protagonist
    text: Danke. Sehr lecker!
    meaning:
      mk: Благодарам. Многу вкусно!
  - speaker: herrwolf
    text: Wie lange bleiben Sie in Leipzig?
    meaning:
      mk: Колку долго останувате во Лајпциг?
  - speaker: protagonist
    text: Drei Monate. Im Mai muss ich zurück.
    meaning:
      mk: Три месеци. Во мај морам да се вратам.
  - speaker: frauwolf
    text: Dann müssen wir uns oft sehen!
    meaning:
      mk: Тогаш мора често да се гледаме!
