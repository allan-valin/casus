- type: narrator
  text:
    en: From 1961 West Germany recruited 'guest workers' from Turkey, Italy, Greece and Yugoslavia; many stayed. Their children and grandchildren are Germans — often with two homes, like Herr Yilmaz.
    ar: منذ 1961 استقدمت ألمانيا الغربية «عمالًا ضيوفًا» من تركيا وإيطاليا واليونان ويوغوسلافيا؛ وبقي كثير منهم. أولادهم وأحفادهم ألمان — غالبًا بوطنين، مثل السيد يلماز.
    mk: Од 1961 Западна Германија регрутирала „гастарбајтери“ од Турција, Италија, Грција и Југославија; многумина останале. Нивните деца и внуци се Германци — често со два дома, како господин Јилмаз.
