steps:
- type: narrator
  text:
    en: A quiet morning at the market. Herr Yilmaz tells you how he came to Leipzig. Listen to the conversation; you don't need to understand it yet.
    ar: صباح هادئ في السوق. السيد يلماز يحكي لك كيف جاء إلى لايبزيغ. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Мирно утро на пазарот. Господин Јилмаз ви раскажува како дошол во Лајпциг. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Seit wann sind Sie in Leipzig, Herr Yilmaz?
    meaning:
      en: How long have you been in Leipzig, Mr Yilmaz?
      ar: منذ متى وأنت في لايبزيغ يا سيد يلماز؟
      mk: Од кога сте во Лајпциг, господине Јилмаз?
  - speaker: yilmaz
    text: Seit dreißig Jahren. Seit der Wende.
    meaning:
      en: For thirty years. Since reunification.
      ar: منذ ثلاثين عامًا. منذ إعادة التوحيد.
      mk: Веќе триесет години. Од обединувањето.
  - speaker: protagonist
    text: Und vorher?
    meaning:
      en: And before?
      ar: وقبل ذلك؟
      mk: А пред тоа?
  - speaker: yilmaz
    text: Ich bin in Berlin aufgewachsen. Mein Vater ist als Gastarbeiter aus der Türkei gekommen.
    meaning:
      en: I grew up in Berlin. My father came from Turkey as a guest worker.
      ar: نشأتُ في برلين. أبي جاء من تركيا عاملًا ضيفًا.
      mk: Пораснав во Берлин. Татко ми дошол од Турција како гастарбајтер.
  - speaker: protagonist
    text: Und seit wann haben Sie den Laden?
    meaning:
      en: And since when have you had the shop?
      ar: ومنذ متى عندك المحل؟
      mk: А од кога ја имате продавницата?
  - speaker: yilmaz
    text: Seit zwanzig Jahren. Meine Kinder helfen am Samstag.
    meaning:
      en: For twenty years. My children help on Saturdays.
      ar: منذ عشرين عامًا. أولادي يساعدون يوم السبت.
      mk: Веќе дваесет години. Децата помагаат во сабота.
  - speaker: protagonist
    text: Ist Deutschland Ihre Heimat oder die Türkei?
    meaning:
      en: Is Germany your home, or Turkey?
      ar: هل ألمانيا وطنك أم تركيا؟
      mk: Дали Германија ви е татковина или Турција?
  - speaker: yilmaz
    text: Beides. Ich fühle mich als Leipziger — mit türkischem Tee!
    meaning:
      en: Both. I feel like a Leipziger — with Turkish tea!
      ar: كلاهما. أشعر أنني من لايبزيغ — مع الشاي التركي!
      mk: И двете. Се чувствувам Лајпцигер — со турски чај!
- type: narrator
  text:
    en: '«seit» (since, for) takes the dative and the present tense: «seit dreißig Jahren» — for thirty years; «seit der Wende». German says ''I am here since…'', not ''I have been''.'
    ar: '«seit» (منذ) تأخذ حالة الجر والزمن الحاضر: «seit dreißig Jahren» — منذ ثلاثين عامًا؛ «seit der Wende». والألمانية تقول «أنا هنا منذ…» بالحاضر.'
    mk: '«seit» (од, веќе) бара датив и сегашно време: «seit dreißig Jahren» — веќе триесет години; «seit der Wende». Германскиот вели „тука сум од…“, во сегашно.'
