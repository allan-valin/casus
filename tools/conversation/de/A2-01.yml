steps:
- type: narrator
  text:
    en: Monday morning on the stairs. Jonas asks about your weekend. Listen to the conversation; you don't need to understand it yet.
    ar: صباح الاثنين على الدرج. يوناس يسألكِ عن عطلة نهاية الأسبوع. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Понеделник наутро на скалите. Јонас ве прашува за викендот. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: Morgen! Was hast du am Wochenende gemacht?
    meaning:
      en: Morning! What did you do at the weekend?
      ar: صباح الخير! ماذا فعلتِ في عطلة نهاية الأسبوع؟
      mk: Утро! Што прави за викендот?
  - speaker: protagonist
    text: Am Samstag bin ich in den Zoo gegangen.
    meaning:
      en: On Saturday I went to the zoo.
      ar: يوم السبت ذهبتُ إلى حديقة الحيوان.
      mk: Во сабота отидов во зоолошка.
  - speaker: jonas
    text: Toll! Was hast du gesehen?
    meaning:
      en: Great! What did you see?
      ar: رائع! ماذا رأيتِ؟
      mk: Супер! Што виде?
  - speaker: protagonist
    text: Elefanten und Tiger. Und ich habe ein Eis gegessen.
    meaning:
      en: Elephants and tigers. And I had an ice cream.
      ar: فيلة ونمورًا. وأكلتُ بوظة.
      mk: Слонови и тигри. И јадев сладолед.
  - speaker: jonas
    text: Und am Sonntag?
    meaning:
      en: And on Sunday?
      ar: ويوم الأحد؟
      mk: А во недела?
  - speaker: protagonist
    text: Am Sonntag habe ich nichts gemacht. Ich habe lange geschlafen.
    meaning:
      en: On Sunday I did nothing. I slept for a long time.
      ar: يوم الأحد لم أفعل شيئًا. نمتُ طويلًا.
      mk: Во недела не правев ништо. Спиев долго.
  - speaker: jonas
    text: Sonntag ist Ruhetag!
    meaning:
      en: Sunday is a day of rest!
      ar: الأحد يوم راحة!
      mk: Неделата е ден за одмор!
  - speaker: protagonist
    text: Genau. Und du? Was hast du gemacht?
    meaning:
      en: Exactly. And you? What did you do?
      ar: بالضبط. وأنت؟ ماذا فعلت؟
      mk: Точно. А ти? Што прави?
  - speaker: jonas
    text: Ich habe gelernt. Prüfung am Mittwoch!
    meaning:
      en: I studied. Exam on Wednesday!
      ar: درستُ. عندي امتحان يوم الأربعاء!
      mk: Учев. Испит во среда!
- type: narrator
  text:
    en: 'To talk about the past, German mostly uses «haben» or «sein» plus a past participle at the end: «Ich habe ein Eis gegessen», «Ich bin in den Zoo gegangen». Verbs of movement take «sein».'
    ar: 'للحديث عن الماضي تستعمل الألمانية غالبًا «haben» أو «sein» مع اسم المفعول في آخر الجملة: «Ich habe ein Eis gegessen»، «Ich bin in den Zoo gegangen». أفعال الحركة تأخذ «sein».'
    mk: 'За минатото германскиот најчесто користи «haben» или «sein» и партицип на крајот: «Ich habe ein Eis gegessen», «Ich bin in den Zoo gegangen». Глаголите на движење одат со «sein».'
