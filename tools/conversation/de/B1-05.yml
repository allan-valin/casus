steps:
- type: narrator
  text:
    en: A late evening on the balcony with Jonas and Lena. Everyone dreams aloud. Listen to the conversation; you don't need to understand it yet.
    ar: سهرة متأخرة على الشرفة مع يوناس ولينا. الجميع يحلمون بصوت عالٍ. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Доцна вечер на балконот со Јонас и Лена. Сите сонуваат на глас. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: lena
    text: Wenn ich reich wäre, würde ich ein Haus am Meer kaufen.
    meaning:
      en: If I were rich, I'd buy a house by the sea.
      ar: لو كنتُ غنية، لاشتريتُ بيتًا على البحر.
      mk: Да сум богата, би купила куќа покрај морето.
  - speaker: jonas
    text: Ich würde um die Welt reisen. Ein Jahr lang!
    meaning:
      en: I'd travel round the world. For a whole year!
      ar: كنتُ سأسافر حول العالم. سنة كاملة!
      mk: Јас би патувал околу светот. Цела година!
  - speaker: lena
    text: Und du? Was würdest du machen?
    meaning:
      en: And you? What would you do?
      ar: وأنتِ؟ ماذا كنتِ ستفعلين؟
      mk: А ти? Што би направила?
  - speaker: protagonist
    text: Ich hätte gern mehr Zeit. Für meine Familie.
    meaning:
      en: I'd like to have more time. For my family.
      ar: كنتُ أودّ أن يكون عندي وقت أكثر. لعائلتي.
      mk: Би сакала да имам повеќе време. За семејството.
  - speaker: jonas
    text: Das ist ein schöner Traum. Noch ein Bier?
    meaning:
      en: That's a lovely dream. Another beer?
      ar: هذا حلم جميل. بيرة أخرى؟
      mk: Тоа е убав сон. Уште едно пиво?
  - speaker: protagonist
    text: Für mich lieber einen Tee.
    meaning:
      en: Tea for me, please.
      ar: أفضّل شايًا.
      mk: За мене подобро чај.
  - speaker: lena
    text: Wenn ich Zeit hätte, würde ich Arabisch lernen. Oder Mazedonisch!
    meaning:
      en: If I had time, I'd learn Arabic. Or Macedonian!
      ar: لو كان عندي وقت لتعلّمتُ العربية. أو المقدونية!
      mk: Да имам време, би учела арапски. Или македонски!
  - speaker: protagonist
    text: Und warum nicht jetzt?
    meaning:
      en: And why not now?
      ar: ولماذا ليس الآن؟
      mk: А зошто не сега?
  - speaker: lena
    text: Keine Zeit! Schade.
    meaning:
      en: No time! What a pity.
      ar: لا وقت! يا للأسف.
      mk: Немам време! Штета.
- type: narrator
  text:
    en: 'Dreams and wishes use the Konjunktiv II: «wäre» (would be), «hätte» (would have), «würde» + infinitive for other verbs: «Wenn ich reich wäre, würde ich reisen».'
    ar: 'الأحلام والأمنيات تستعمل صيغة التمني (Konjunktiv II): «wäre» (لو كان)، «hätte» (لو كان عندي)، و«würde» مع المصدر لبقية الأفعال: «Wenn ich reich wäre, würde ich reisen».'
    mk: 'Соништа и желби користат Konjunktiv II: «wäre» (би бил), «hätte» (би имал), «würde» + инфинитив за другите глаголи: «Wenn ich reich wäre, würde ich reisen».'
- type: prompt
  ask:
    en: 'Say: if I were rich…'
    ar: 'قولي: لو كنتُ غنية…'
    mk: 'Кажете: да сум богата…'
  answer:
    speaker: protagonist
    text: Wenn ich reich wäre…
  items:
  - wenn-ich
  - waere
  - reich
