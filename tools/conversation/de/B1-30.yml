steps:
- type: narrator
  text:
    en: Rain on the day of the planned picnic. Jonas's dry humour — and a look back at the whole of B1. Listen to the conversation; you don't need to understand it yet.
    ar: مطر في يوم النزهة المخطّط لها. فكاهة يوناس الجافة — ونظرة إلى المستوى B1 كله. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Дожд на денот на планираниот пикник. Сувиот хумор на Јонас — и поглед наназад кон целото B1. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: Es regnet in Strömen. Na toll! Perfektes Picknickwetter.
    meaning:
      en: It's pouring. Oh great! Perfect picnic weather.
      ar: إنها تمطر بغزارة. رائع جدًا! طقس مثالي للنزهة.
      mk: Врне како од кабел. Баш убаво! Совршено време за пикник.
  - speaker: protagonist
    text: Meinst du das ernst?
    meaning:
      en: Are you serious?
      ar: هل تقصد ذلك جديًا؟
      mk: Сериозно ли мислиш?
  - speaker: jonas
    text: Natürlich nicht! Das ist Ironie. Ich meine genau das Gegenteil.
    meaning:
      en: Of course not! That's irony. I mean exactly the opposite.
      ar: طبعًا لا! هذه سخرية. أقصد العكس تمامًا.
      mk: Се разбира не! Тоа е иронија. Мислам токму спротивното.
  - speaker: protagonist
    text: Woran erkenne ich das?
    meaning:
      en: How do I recognise it?
      ar: كيف أعرف ذلك؟
      mk: По што да го препознаам?
  - speaker: jonas
    text: Am Ton. Und am Gesicht. Ich lache nicht.
    meaning:
      en: From the tone. And the face. I don't laugh.
      ar: من النبرة. ومن الوجه. أنا لا أضحك.
      mk: По тонот. И по лицето. Не се смеам.
  - speaker: protagonist
    text: 'Dann sage ich: Sehr witzig, Jonas! Wo picknicken wir jetzt?'
    meaning:
      en: 'Then I''ll say: very funny, Jonas! Where are we picnicking now?'
      ar: 'إذن أقول: مضحك جدًا يا يوناس! أين نتنزّه الآن؟'
      mk: 'Тогаш велам: многу смешно, Јонас! Каде сега ќе правиме пикник?'
  - speaker: jonas
    text: In meiner WG. Paul hat sogar den Putzplan gemacht. Na ja, fast.
    meaning:
      en: At my flat-share. Paul even did the cleaning rota. Well, almost.
      ar: في سكني المشترك. باول التزم حتى بجدول التنظيف. حسنًا، تقريبًا.
      mk: Во мојот заеднички стан. Паул дури го направи распоредот за чистење. Па, речиси.
  - speaker: protagonist
    text: Na toll! Dann putze ich vorher.
    meaning:
      en: Oh great! Then I'll clean first.
      ar: رائع جدًا! إذن سأنظّف قبلها.
      mk: Баш убаво! Тогаш прво ќе чистам.
  - speaker: jonas
    text: Siehst du? Jetzt kannst du es auch!
    meaning:
      en: See? Now you can do it too!
      ar: أرأيت؟ الآن تستطيع ذلك أنت أيضًا!
      mk: Гледаш? Сега и ти знаеш!
