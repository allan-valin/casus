- type: narrator
  text:
    en: 'German irony is dry: the words say the opposite, the face stays straight. «Na toll!», «Super!», «Sehr witzig!» said flatly mean the reverse. If you''re unsure, ask «Meinst du das ernst?» — nobody
      minds.'
    ar: 'السخرية الألمانية جافة: الكلمات تقول العكس، والوجه يبقى جادًا. «Na toll!» و«Super!» و«Sehr witzig!» بنبرة مسطّحة تعني العكس. إذا لم تكن متأكدًا، اسأل «Meinst du das ernst?» — لا أحد ينزعج.'
    mk: 'Германската иронија е сува: зборовите кажуваат спротивно, лицето останува сериозно. «Na toll!», «Super!», «Sehr witzig!» кажани рамно значат обратно. Ако не сте сигурни, прашајте «Meinst du das
      ernst?» — никому не му пречи.'
