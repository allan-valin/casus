steps:
- type: narrator
  text:
    ar: زملاؤك في العمل يدعونك إلى أمسية في مقهى بعد الدوام. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
- type: dialogue
  lines:
  - speaker: meier
    text: Wir treffen uns heute nach der Arbeit im Café am Markt. Kommen Sie mit?
    meaning:
      ar: نلتقي اليوم بعد العمل في المقهى عند السوق. هل تأتي معنا؟
  - speaker: protagonist
    text: Gern, ich freue mich! Aber nicht so spät.
    meaning:
      ar: بكل سرور، يسعدني ذلك! لكن ليس متأخرًا جدًا.
  - speaker: jonas
    text: Was trinkst du? Ein Bier?
    meaning:
      ar: ماذا تشرب؟ بيرة؟
  - speaker: protagonist
    text: Nein, danke, ich trinke keinen Alkohol. Eine Limo, bitte.
    meaning:
      ar: لا، شكرًا، لا أشرب الكحول. مشروب غازي من فضلك.
  - speaker: meier
    text: Kein Problem. Viele Kollegen trinken auch nichts.
    meaning:
      ar: لا مشكلة. كثير من الزملاء لا يشربون أيضًا.
  - speaker: protagonist
    text: Schön, dass wir uns außerhalb der Arbeit unterhalten.
    meaning:
      ar: جميل أن نتحدث خارج العمل.
  - speaker: meier
    text: Ja, das ist entspannt.
    meaning:
      ar: نعم، هذا مريح.
  - speaker: protagonist
    text: Es ist neun. Ich muss los — meine Tochter schläft bald.
    meaning:
      ar: الساعة التاسعة. يجب أن أذهب — ابنتي ستنام قريبًا.
