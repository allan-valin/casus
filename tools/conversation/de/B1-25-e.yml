- type: narrator
  text:
    en: Non-EU students may work a yearly limit of full or half days (140 full or 280 half since 2024 — check the current numbers); more than four hours counts as a full day; a mandatory internship doesn't
      count; in the semester break full-time work is allowed. Hourly jobs may send you home when the work is done. A minijob brings no health insurance of its own, and a second job is taxed in class VI.
