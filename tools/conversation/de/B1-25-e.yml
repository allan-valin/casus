steps:
- type: narrator
  text:
    en: You need money beside your studies. Mia explains the options — and the rules for international students. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Mia, soll ich einen Minijob nehmen oder Werkstudentin werden?
    meaning:
      en: Mia, should I take a minijob or become a working student?
  - speaker: mia
    text: Als Werkstudentin verdienst du mehr und lernst etwas für den Beruf.
    meaning:
      en: As a working student you earn more and learn something for your career.
  - speaker: protagonist
    text: Und die Regeln für mich? Ich komme nicht aus der EU.
    meaning:
      en: And the rules for me? I'm not from the EU.
  - speaker: mia
    text: 'Du hast eine Grenze pro Jahr: ganze oder halbe Arbeitstage. Mehr als vier Stunden sind ein ganzer Tag. Zähl mit!'
    meaning:
      en: 'You have a limit per year: full or half working days. More than four hours is a full day. Keep count!'
  - speaker: protagonist
    text: Und das Pflichtpraktikum?
    meaning:
      en: And the mandatory internship?
  - speaker: mia
    text: Das zählt nicht. Und in den Semesterferien darfst du Vollzeit arbeiten.
    meaning:
      en: That doesn't count. And in the semester break you may work full time.
  - speaker: protagonist
    text: Der Stundenlohn im Café ist gut, aber manchmal schicken sie mich früher nach Hause.
    meaning:
      en: The hourly wage at the café is good, but sometimes they send me home early.
  - speaker: mia
    text: Ja, wenn du schnell fertig bist. Und frag nach der Krankenversicherung — beim Minijob bist du nicht automatisch versichert.
    meaning:
      en: Yes, if you finish fast. And ask about health insurance — with a minijob you're not automatically insured.
