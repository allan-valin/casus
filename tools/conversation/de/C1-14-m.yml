steps:
- type: narrator
  text:
    mk: 'Во поштенското сандаче: известување за гласање. Како граѓанин на ЕУ, вие смеете да гласате на локалните избори во Лајпциг! Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: Petar, schau! Eine Wahlbenachrichtigung — für mich?
    meaning:
      mk: Петре, види! Известување за гласање — за мене?
  - speaker: petar
    text: Ja! Als EU-Bürger mit Wohnsitz hier hast du das kommunale Wahlrecht.
    meaning:
      mk: Да! Како граѓанин на ЕУ со живеалиште тука имаш право на глас на локалните избори.
  - speaker: protagonist
    text: Für den Stadtrat? Und für den Bundestag?
    meaning:
      mk: За градскиот совет? А за Бундестагот?
  - speaker: petar
    text: Nur Stadtrat und Europawahl. Den Bundestag wählen nur Deutsche.
    meaning:
      mk: Само градскиот совет и европските избори. Бундестагот го избираат само Германците.
  - speaker: protagonist
    text: Frau Wolf sagt, es heiße, man dürfe drei Stimmen geben. Stimmt das?
    meaning:
      mk: Госпоѓа Волф вели дека, се вели, човек смее да даде три гласа. Точно ли е?
  - speaker: petar
    text: In Sachsen ja. Du kreuzt auf dem Stimmzettel bis zu drei Namen an.
    meaning:
      mk: Во Саксонија да. Заокружуваш на гласачкото ливче до три имиња.
  - speaker: protagonist
    text: Und wenn wir im Sommer in Bitola sind?
    meaning:
      mk: А ако во лето сме во Битола?
  - speaker: petar
    text: Dann machst du Briefwahl. So verpasst du nichts.
    meaning:
      mk: Тогаш гласаш по пошта. Така ништо не пропушташ.
