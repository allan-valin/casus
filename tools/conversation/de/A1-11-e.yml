steps:
- type: narrator
  text:
    en: Your first lecture. You find the hall at ten to eight — and Jonas is in your course. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Entschuldigung, ist das der Hörsaal drei?
    meaning:
      en: Excuse me, is this lecture hall three?
  - speaker: jonas
    text: Ja! Du auch hier? Die Vorlesung beginnt um acht.
    meaning:
      en: Yes! You're here too? The lecture begins at eight.
  - speaker: protagonist
    text: Um acht? Es ist schon zehn vor acht!
    meaning:
      en: At eight? It's already ten to eight!
  - speaker: jonas
    text: Genau, wir müssen pünktlich sein. Komm, setz dich!
    meaning:
      en: Exactly, we have to be on time. Come on, sit down!
  - speaker: protagonist
    text: Muss ich mich für den Kurs anmelden?
    meaning:
      en: Do I have to register for the course?
  - speaker: jonas
    text: Ja, online. Und für die Prüfung auch.
    meaning:
      en: Yes, online. And for the exam too.
  - speaker: protagonist
    text: Und die Folien?
    meaning:
      en: And the slides?
  - speaker: jonas
    text: Die Folien sind online, im Portal.
    meaning:
      en: The slides are online, in the portal.
  - speaker: protagonist
    text: Okay. Ich muss viel lernen!
    meaning:
      en: OK. I have to study a lot!
