- type: narrator
  text:
    en: Parents may take up to three years of Elternzeit with a guaranteed return to their job; Elterngeld pays part of the lost income for about a year, longer if both parents take months. From age one
      every child has a legal right to a Kita place — in practice there are waiting lists, so register early. The Eingewöhnung lasts weeks with a parent present.
    ar: يحق للوالدين أخذ إجازة والدين حتى ثلاث سنوات مع ضمان العودة إلى العمل؛ وعلاوة الوالدين تعوّض جزءًا من الدخل المفقود لنحو سنة، ومدة أطول إذا أخذ الوالدان كلاهما أشهرًا. ومن عمر سنة لكل طفل حق قانوني
      في مكان بالروضة — لكن عمليًا هناك قوائم انتظار، فسجّلي مبكرًا. فترة التأقلم تستمر أسابيع بحضور أحد الوالدين.
    mk: Родителите можат да земат до три години Elternzeit со загарантирано враќање на работа; Elterngeld плаќа дел од изгубениот приход околу една година, подолго ако двајцата родители земат месеци. Од
      една година секое дете има законско право на место во градинка — во пракса има листи на чекање, па пријавете се рано. Навикнувањето трае со недели со присуство на родител.
