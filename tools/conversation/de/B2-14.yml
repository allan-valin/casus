steps:
- type: narrator
  text:
    en: Lena goes back to work after a year at home with the baby. Over coffee she tells you how she organises it. Listen to the conversation; you don't need to understand it yet.
    ar: لينا تعود إلى العمل بعد سنة في البيت مع الرضيع. على القهوة تحكي لكِ كيف تنظّم الأمر. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Лена се враќа на работа по една година дома со бебето. На кафе ви раскажува како го организира тоа. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: lena
    text: Nach einem Jahr Elternzeit gehe ich zurück — in Teilzeit, dreißig Stunden.
    meaning:
      en: After a year of parental leave I'm going back — part time, thirty hours.
      ar: بعد سنة من إجازة الوالدين أعود — بدوام جزئي، ثلاثين ساعة.
      mk: По една година родителско отсуство се враќам — скратено, триесет часа.
  - speaker: protagonist
    text: Und wer passt auf die Kleine auf?
    meaning:
      en: And who looks after the little one?
      ar: ومن يعتني بالصغيرة؟
      mk: А кој ја чува малата?
  - speaker: lena
    text: Wir haben endlich einen Kitaplatz! Wir standen ein Jahr auf der Warteliste.
    meaning:
      en: We finally have a Kita place! We were on the waiting list for a year.
      ar: أخيرًا حصلنا على مكان في الروضة! بقينا سنة على قائمة الانتظار.
      mk: Конечно имаме место во градинка! Една година бевме на листата на чекање.
  - speaker: protagonist
    text: Und dein Mann?
    meaning:
      en: And your husband?
      ar: وزوجكِ؟
      mk: А мажот ти?
  - speaker: lena
    text: Er hat auch zwei Monate Elternzeit genommen. Jetzt wechseln wir uns ab, statt alles mir zu überlassen.
    meaning:
      en: He took two months of parental leave too. Now we take turns, instead of leaving everything to me.
      ar: أخذ هو أيضًا شهرين من إجازة الوالدين. الآن نتناوب، بدلًا من أن يُترك كل شيء لي.
      mk: И тој зеде два месеци родителско отсуство. Сега се сменуваме, наместо сè да ми го остави мене.
  - speaker: protagonist
    text: Bei uns hilft die Oma. Hier sind die Großeltern oft weit weg.
    meaning:
      en: With us, grandma helps. Here the grandparents are often far away.
      ar: عندنا تساعد الجدة. هنا الأجداد غالبًا بعيدون.
      mk: Кај нас помага бабата. Тука бабите и дедовците често се далеку.
  - speaker: lena
    text: Genau. Und die Eingewöhnung in der Kita dauert Wochen. Ohne Geduld zu haben, geht es nicht.
    meaning:
      en: Exactly. And settling in at the Kita takes weeks. It doesn't work without having patience.
      ar: بالضبط. وفترة التأقلم في الروضة تستغرق أسابيع. لا يمكن ذلك دون أن يكون لديكِ صبر.
      mk: Точно. А навикнувањето во градинката трае со недели. Без да имаш трпение, не оди.
  - speaker: protagonist
    text: Hast du ein schlechtes Gewissen?
    meaning:
      en: Do you feel guilty?
      ar: هل تشعرين بتأنيب الضمير؟
      mk: Те гризе ли совеста?
  - speaker: lena
    text: Manchmal. Aber sie spielt mit anderen Kindern, statt allein zu Hause zu sein.
    meaning:
      en: Sometimes. But she plays with other children instead of being alone at home.
      ar: أحيانًا. لكنها تلعب مع أطفال آخرين بدلًا من أن تكون وحدها في البيت.
      mk: Понекогаш. Но таа си игра со други деца наместо да биде сама дома.
- type: prompt
  ask:
    en: 'She says: after a year of parental leave.'
    ar: 'تقول: بعد سنة من إجازة الوالدين.'
    mk: 'Таа вели: по една година родителско отсуство.'
  answer:
    speaker: protagonist
    text: Nach einem Jahr Elternzeit.
  items:
  - die-elternzeit
- type: prompt
  ask:
    en: 'Say: part time.'
    ar: 'قولي: دوام جزئي.'
    mk: 'Кажете: скратено работно време.'
