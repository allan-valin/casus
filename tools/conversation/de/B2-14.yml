- type: narrator
  text:
    en: 'Infinitive groups with «statt … zu» (instead of), «ohne … zu» (without) and «um … zu» (in order to): «statt allein zu Hause zu sein», «ohne Geduld zu haben». The verb with «zu» stands at the end.'
    ar: 'مجموعات المصدر مع «statt … zu» (بدلًا من)، و«ohne … zu» (دون أن)، و«um … zu» (لكي): «statt allein zu Hause zu sein»، «ohne Geduld zu haben». والفعل مع «zu» في الآخر.'
    mk: 'Инфинитивни групи со «statt … zu» (наместо), «ohne … zu» (без да) и «um … zu» (за да): «statt allein zu Hause zu sein», «ohne Geduld zu haben». Глаголот со «zu» стои на крајот.'
