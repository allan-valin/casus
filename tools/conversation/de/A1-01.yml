steps:
- type: narrator
  text:
    en: Your first day in Leipzig. A woman opens the door of the ground-floor flat. Listen to the conversation; you don't need to understand it yet.
    ar: يومك الأول في لايبزيغ. امرأة تفتح باب الشقة في الطابق الأرضي. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Вашиот прв ден во Лајпциг. Една жена ја отвора вратата на станот во приземјето. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: becker
    text: Guten Tag! Sie sind neu hier, oder?
    meaning:
      en: Hello! You're new here, aren't you?
      ar: نهارك سعيد! أنتِ جديدة هنا، أليس كذلك؟
      mk: Добар ден! Вие сте нова тука, нели?
  - speaker: protagonist
    text: Guten Tag. Entschuldigung, ich verstehe nicht.
    meaning:
      en: Hello. Sorry, I don't understand.
      ar: نهارك سعيد. عفوًا، لا أفهم.
      mk: Добар ден. Извинете, не разбирам.
  - speaker: becker
    text: Sie – sind – neu – hier?
    meaning:
      en: You – are – new – here?
      ar: أنتِ – جديدة – هنا؟
      mk: Вие – сте – нова – тука?
  - speaker: protagonist
    text: Ah! Ja, ich bin neu hier. Sprechen Sie Englisch?
    meaning:
      en: Ah! Yes, I'm new here. Do you speak English?
      ar: آه! نعم، أنا جديدة هنا. هل تتكلمين الإنجليزية؟
      mk: А! Да, нова сум тука. Зборувате ли англиски?
  - speaker: becker
    text: Ein bisschen. Ich bin Frau Becker. Ich wohne unten.
    meaning:
      en: A little. I'm Mrs Becker. I live downstairs.
      ar: قليلًا. أنا السيدة بيكر. أسكن في الأسفل.
      mk: Малку. Јас сум госпоѓа Бекер. Живеам долу.
  - speaker: protagonist
    text: Freut mich, Frau Becker.
    meaning:
      en: Nice to meet you, Mrs Becker.
      ar: تشرفنا يا سيدة بيكر.
      mk: Мило ми е, госпоѓо Бекер.
  - speaker: becker
    text: Willkommen im Haus! Hier ist der Schlüssel für die Haustür.
    meaning:
      en: Welcome to the house! Here is the key for the front door.
      ar: أهلًا بك في البيت! هذا مفتاح باب العمارة.
      mk: Добредојдовте во зградата! Еве го клучот за влезната врата.
  - speaker: protagonist
    text: Danke schön!
    meaning:
      en: Thank you very much!
      ar: شكرًا جزيلًا!
      mk: Благодарам многу!
  - speaker: becker
    text: Bitte schön. Auf Wiedersehen!
    meaning:
      en: You're welcome. Goodbye!
      ar: عفوًا. مع السلامة!
      mk: Нема зошто. Довидување!
  - speaker: protagonist
    text: Auf Wiedersehen!
    meaning:
      en: Goodbye!
      ar: مع السلامة!
      mk: Довидување!
- type: narrator
  text:
    en: 'To greet someone you don''t know: «Guten Tag». In the evening: «Guten Abend».'
    ar: 'لتحية شخص لا تعرفينه: «Guten Tag». وفي المساء: «Guten Abend».'
    mk: 'За поздрав со непознат: «Guten Tag». Навечер: «Guten Abend».'
- type: prompt
  ask:
    en: Greet the woman at the door.
    ar: حيّي المرأة عند الباب.
    mk: Поздравете ја жената на вратата.
  answer:
    speaker: protagonist
    text: Guten Tag.
  items:
  - guten-tag
- type: prompt
  ask:
    en: 'Say politely: excuse me, I don''t understand.'
    ar: 'قولي بأدب: عفوًا، لا أفهم.'
    mk: 'Кажете учтиво: извинете, не разбирам.'
  answer:
    speaker: protagonist
    text: Entschuldigung, ich verstehe nicht.
  items:
  - entschuldigung
  - ich-verstehe-nicht
- type: narrator
  text:
    en: «Sie» is the polite 'you', written with a capital S — for strangers, officials and older people. Friends say «du».
    ar: «Sie» هي صيغة المخاطبة المؤدبة، وتُكتب بحرف S كبير — مع الغرباء والموظفين وكبار السن. أما الأصدقاء فيقولون «du».
    mk: «Sie» е учтивото „Вие“, со голема буква — за непознати, службеници и постари. Пријателите си велат «du».
- type: prompt
  ask:
    en: She asks if you are new here. How?
    ar: تسألك إن كنتِ جديدة هنا. كيف تقول ذلك؟
    mk: Ве прашува дали сте нова тука. Како?
  answer:
    speaker: protagonist
    text: Sie sind neu hier?
  items:
  - sie-sind
  - neu-hier
- type: narrator
  text:
    en: '«ich bin» — I am; «Sie sind» — you are, polite. The same verb: «sein», to be.'
    ar: '«ich bin» تعني: أنا أكون؛ و«Sie sind»: أنتِ تكونين، بصيغة الاحترام. الفعل نفسه: «sein»، أي يكون.'
    mk: '«ich bin» — јас сум; «Sie sind» — Вие сте. Истиот глагол: «sein», сум.'
- type: prompt
  ask:
    en: 'Answer: yes, I''m new here.'
    ar: 'أجيبي: نعم، أنا جديدة هنا.'
    mk: 'Одговорете: да, нова сум тука.'
  answer:
    speaker: protagonist
    text: Ja, ich bin neu hier.
  items:
  - ja
  - ich-bin
  - neu-hier
