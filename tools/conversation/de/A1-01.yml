- type: narrator
  text:
    en: 'Germans shake hands when they meet: brief and firm, with eye contact. No cheek kisses between strangers.'
    ar: 'يتصافح الألمان عند التعارف: مصافحة قصيرة وثابتة مع النظر في العينين، ولا قُبلات على الخد بين الغرباء.'
    mk: 'Германците се ракуваат при запознавање: кратко и цврсто, со поглед во очи. Бакнежи во образ меѓу непознати нема.'
- type: narrator
  for:
  - ar
  text:
    ar: إن كنتِ لا تصافحين الرجال، فضعي يدك على صدرك وابتسمي وقولي «Freut mich» — هذا مفهوم في ألمانيا ومقبول.
- type: prompt
