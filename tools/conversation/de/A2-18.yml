steps:
- type: narrator
  text:
    en: On the train back, Jonas shows you the map of Germany on his phone. Listen to the conversation; you don't need to understand it yet.
    ar: في قطار العودة، يوناس يريك خريطة ألمانيا على هاتفه. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Во возот назад, Јонас ви ја покажува картата на Германија на телефонот. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: Schau, die Landkarte. Hier ist Dresden, an der Elbe.
    meaning:
      en: Look, the map. Here's Dresden, on the Elbe.
      ar: انظر، الخريطة. هنا دريسدن، على نهر إلبه.
      mk: Погледни, картата. Тука е Дрезден, на Елба.
  - speaker: protagonist
    text: Ein großer Fluss! Wohin fließt er?
    meaning:
      en: A big river! Where does it flow?
      ar: نهر كبير! إلى أين يجري؟
      mk: Голема река! Каде тече?
  - speaker: jonas
    text: Nach Norden, bis Hamburg und ins Meer.
    meaning:
      en: North, to Hamburg and into the sea.
      ar: نحو الشمال، حتى هامبورغ وإلى البحر.
      mk: На север, до Хамбург и во морето.
  - speaker: protagonist
    text: Und die Berge?
    meaning:
      en: And the mountains?
      ar: والجبال؟
      mk: А планините?
  - speaker: jonas
    text: Im Süden die Alpen. Hier bei uns das Erzgebirge.
    meaning:
      en: In the south the Alps. Here near us the Ore Mountains.
      ar: في الجنوب جبال الألب. وهنا قربنا جبال الخام.
      mk: На југ Алпите. Тука кај нас Рудните планини.
  - speaker: protagonist
    text: Und Berlin ist die Hauptstadt des Landes.
    meaning:
      en: And Berlin is the capital of the country.
      ar: وبرلين عاصمة البلد.
      mk: А Берлин е главниот град на земјата.
  - speaker: jonas
    text: Genau. Leipzig, Dresden, Berlin — alles im Osten.
    meaning:
      en: Exactly. Leipzig, Dresden, Berlin — all in the east.
      ar: بالضبط. لايبزيغ ودريسدن وبرلين — كلها في الشرق.
      mk: Точно. Лајпциг, Дрезден, Берлин — сѐ на исток.
  - speaker: protagonist
    text: Ist der Osten anders als der Westen?
    meaning:
      en: Is the east different from the west?
      ar: هل الشرق مختلف عن الغرب؟
      mk: Дали истокот е поинаков од западот?
  - speaker: jonas
    text: Ein bisschen. Das ist eine lange Geschichte — die Mauer.
    meaning:
      en: A bit. That's a long story — the Wall.
      ar: قليلًا. هذه قصة طويلة — الجدار.
      mk: Малку. Тоа е долга приказна — ѕидот.
