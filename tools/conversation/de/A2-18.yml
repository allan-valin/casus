    en: Until 1990 Germany was two states. The east was the GDR; many differences of income and outlook remain, and Saxony is proud of its own dialect and history.
    ar: حتى عام 1990 كانت ألمانيا دولتين. الشرق كان جمهورية ألمانيا الديمقراطية؛ وما زالت فروق كثيرة في الدخل والنظرة، وساكسونيا تفخر بلهجتها وتاريخها.
    mk: До 1990 Германија беше две држави. Истокот беше ГДР; остануваат многу разлики во приходите и погледите, а Саксонија се гордее со својот дијалект и историја.
