steps:
- type: narrator
  text:
    mk: Родителите на Ања ве канат на ручек во нивниот дом. Што да донесете? Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: frauwolf
    text: Wir möchten Sie zum Mittagessen einladen. Am Sonntag um zwölf.
    meaning:
      mk: Сакаме да ве поканиме на ручек. Во недела во дванаесет.
  - speaker: protagonist
    text: Danke für die Einladung! Wir kommen gern.
    meaning:
      mk: Благодарам за поканата! Доаѓаме со задоволство.
  - speaker: protagonist
    text: Sollen wir etwas mitbringen?
    meaning:
      mk: Да донесеме ли нешто?
  - speaker: frauwolf
    text: Nicht nötig!
    meaning:
      mk: Не е потребно!
  - speaker: protagonist
    text: Wir bringen einen Wein. Und ein Glas Ajvar — selbst gemacht.
    meaning:
      mk: Ќе донесеме едно вино. И тегла ајвар — домашен.
  - speaker: herrwolf
    text: Ajvar? Was ist das?
    meaning:
      mk: Ајвар? Што е тоа?
  - speaker: protagonist
    text: Eine Paprikacreme aus Mazedonien. Sehr lecker!
    meaning:
      mk: Намаз од пиперки од Македонија. Многу вкусно!
  - speaker: frauwolf
    text: Das ist zu viel! Aber wir freuen uns sehr.
    meaning:
      mk: Тоа е премногу! Но многу се радуваме.
