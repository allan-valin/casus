steps:
- type: narrator
  text:
    en: 'A VHS debate evening: ''Heimat — a place or a feeling?'' Lena says place. You argue: feeling. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'أمسية نقاش في الجامعة الشعبية: «الوطن — مكان أم شعور؟» لينا تقول مكان. وأنت تجادل: شعور. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.'
    mk: 'Вечер на дебата на народниот универзитет: „Heimat — место или чувство?“ Лена вели место. Вие тврдите: чувство. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: hartmann
    text: „Heimat“ gilt als unübersetzbar. Ist sie ein Ort oder ein Gefühl?
    meaning:
      en: '''Heimat'' is considered untranslatable. Is it a place or a feeling?'
      ar: تُعدّ كلمة «Heimat» غير قابلة للترجمة. هل هي مكان أم شعور؟
      mk: „Heimat“ важи за непреводлива. Дали е место или чувство?
  - speaker: lena
    text: Ein Ort. Heimat ist Herkunft — die Landschaft, der Dialekt, die Verwurzelung.
    meaning:
      en: A place. Heimat is origin — the landscape, the dialect, rootedness.
      ar: مكان. الوطن هو الأصل — المشهد الطبيعي، اللهجة، التجذّر.
      mk: Место. Heimat е потекло — пејзажот, дијалектот, вкоренетоста.
  - speaker: protagonist
    text: 'Da widerspreche ich. Heimat ist ein Gefühl, kein Ort: Geborgenheit und Zugehörigkeit.'
    meaning:
      en: 'I disagree. Heimat is a feeling, not a place: safety and belonging.'
      ar: 'هنا أعترض. الوطن شعور لا مكان: أمان وانتماء.'
      mk: 'Тука не се согласувам. Heimat е чувство, не место: сигурност и припадност.'
  - speaker: lena
    text: Aber deine Identität kommt doch von dort, wo du geboren bist.
    meaning:
      en: But your identity surely comes from where you were born.
      ar: لكن هويتك تأتي بالتأكيد من حيث وُلدت.
      mk: Но твојот идентитет сепак доаѓа од таму каде што си роден.
  - speaker: protagonist
    text: Auch. Aber Zugehörigkeit kann man finden — sie ist auch eine Frage der Wahl.
    meaning:
      en: That too. But belonging can be found — it's also a matter of choice.
      ar: وكذلك. لكن الانتماء يمكن إيجاده — إنه أيضًا مسألة اختيار.
      mk: И тоа. Но припадноста може да се најде — таа е и прашање на избор.
  - speaker: hartmann
    text: Und welche Rolle spielt die Sprache?
    meaning:
      en: And what role does language play?
      ar: وما دور اللغة؟
      mk: А каква улога игра јазикот?
  - speaker: protagonist
    text: Für viele ist die Sprache Heimat. Ich habe inzwischen zwei — also mehrere Heimaten.
    meaning:
      en: For many, language is home. I now have two — so several homelands.
      ar: للكثيرين اللغة هي الوطن. لديّ الآن اثنتان — إذن أوطان متعدّدة.
      mk: За многумина јазикот е дом. Јас сега имам два — значи повеќе татковини.
  - speaker: hartmann
    text: 'Ein schöner Gedanke: Heimat im Plural. Das Publikum stimmt ab!'
    meaning:
      en: 'A beautiful thought: Heimat in the plural. The audience votes!'
      ar: 'فكرة جميلة: الوطن بصيغة الجمع. الجمهور يصوّت!'
      mk: 'Убава мисла: Heimat во множина. Публиката гласа!'
- type: prompt
  ask:
    en: 'Say: Heimat is considered untranslatable.'
    ar: 'قل: تُعدّ Heimat غير قابلة للترجمة.'
    mk: 'Кажете: Heimat важи за непреводлива.'
  answer:
    speaker: protagonist
    text: Heimat gilt als unübersetzbar.
  items:
  - unuebersetzbar
- type: prompt
  ask:
    en: 'Say: origin and rootedness.'
    ar: 'قل: الأصل والتجذّر.'
    mk: 'Кажете: потекло и вкоренетост.'
  answer:
    speaker: protagonist
    text: Herkunft und Verwurzelung.
  items:
  - die-herkunft
  - die-verwurzelung
- type: narrator
  text:
    en: 'Abstract nouns carry the debate: «die Zugehörigkeit» (belonging), «die Geborgenheit» (safety and warmth — hard to translate), «die Identität», «die Verwurzelung». Most end in -heit, -keit, -ung
      or -ität and are feminine.'
    ar: 'الأسماء المجرّدة تحمل النقاش: «die Zugehörigkeit» (الانتماء)، «die Geborgenheit» (الأمان والدفء — صعبة الترجمة)، «die Identität»، «die Verwurzelung». ومعظمها ينتهي بـ -heit أو -keit أو -ung أو
      -ität وهي مؤنثة.'
    mk: 'Апстрактните именки ја носат дебатата: «die Zugehörigkeit» (припадност), «die Geborgenheit» (сигурност и топлина — тешко преводливо), «die Identität», «die Verwurzelung». Повеќето завршуваат на
      -heit, -keit, -ung или -ität и се од женски род.'
- type: prompt
  ask:
    en: 'Say: a feeling, not a place.'
    ar: 'قل: شعور لا مكان.'
    mk: 'Кажете: чувство, не место.'
  answer:
