- type: narrator
  text:
    en: «Heimat» mixes place, childhood, language and belonging — and has a political history, from Romantic longing to Nazi misuse to today's debates about who belongs. The plural «Heimaten» used to be
      rare; many people with two homes now use it on purpose.
    ar: كلمة «Heimat» تمزج المكان والطفولة واللغة والانتماء — ولها تاريخ سياسي، من حنين الرومانسية إلى إساءة النازيين إلى نقاشات اليوم حول من ينتمي. وصيغة الجمع «Heimaten» كانت نادرة؛ واليوم يستعملها عمدًا
      كثيرون ممن لهم بيتان.
    mk: „Heimat“ меша место, детство, јазик и припадност — и има политичка историја, од романтичарскиот копнеж преку нацистичката злоупотреба до денешните дебати за тоа кој припаѓа. Множината „Heimaten“
      порано беше ретка; многумина со два дома сега намерно ја користат.
