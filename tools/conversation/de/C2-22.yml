- type: prompt
  review: true
  ask:
    en: 'Say: “the holiday house — and “the cost split — and “per head — and “the kitty — and “Wouldn''t it be fairer if …? — and “If we had …, it would be … — and “the expense app — and “settle up — and
      “the Baltic Sea — and “generous — and “the statutes — and “the motion — and “I declare the meeting open — and “the quorum — and “vote on the motion — and “carried, accepted — and “rejected — and “I
      give the floor to … — and “the chair — and “I declare the meeting closed”.'
    ar: 'قل: “بيت العطلة — و“تقسيم التكاليف — و“للفرد — و“الصندوق المشترك — و“أليس من الأعدل أن …؟ — و“لو كان لدينا …، لكان … — و“تطبيق المصاريف — و“يصفّي الحساب — و“بحر البلطيق — و“كريم — و“النظام الأساسي
