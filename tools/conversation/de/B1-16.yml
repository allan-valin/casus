steps:
- type: narrator
  text:
    en: Your new phone switches itself off. Back to the shop, receipt in hand. Listen to the conversation; you don't need to understand it yet.
    ar: هاتفك الجديد ينطفئ وحده. تعود إلى المتجر والإيصال في يدك. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Новиот телефон сам се исклучува. Назад во продавницата, со сметката в рака. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Guten Tag. Ich möchte mich beschweren. Das Handy geht von selbst aus.
    meaning:
      en: Hello. I'd like to make a complaint. The phone switches itself off.
      ar: مرحبًا. أريد أن أقدّم شكوى. الهاتف ينطفئ وحده.
      mk: Добар ден. Сакам да се пожалам. Телефонот сам се исклучува.
  - speaker: kasse
    text: Haben Sie die Quittung?
    meaning:
      en: Do you have the receipt?
      ar: هل معك الإيصال؟
      mk: Ја имате ли сметката?
  - speaker: protagonist
    text: Ja, hier. Ich habe es vor zwei Wochen gekauft.
    meaning:
      en: Yes, here. I bought it two weeks ago.
      ar: نعم، تفضلي. اشتريته قبل أسبوعين.
      mk: Да, еве. Го купив пред две недели.
  - speaker: kasse
    text: Dann haben Sie Garantie. Das Gerät wird eingeschickt und repariert.
    meaning:
      en: Then you have a warranty. The device is sent in and repaired.
      ar: إذن لديك ضمان. الجهاز يُرسَل ويُصلَح.
      mk: Тогаш имате гаранција. Апаратот се испраќа и се поправа.
  - speaker: protagonist
    text: Wie lange dauert das?
    meaning:
      en: How long does that take?
      ar: كم يستغرق ذلك؟
      mk: Колку трае тоа?
  - speaker: kasse
    text: Zwei bis drei Wochen.
    meaning:
      en: Two to three weeks.
      ar: من أسبوعين إلى ثلاثة.
      mk: Две до три недели.
  - speaker: protagonist
    text: So lange? Kann ich es nicht umtauschen? Oder das Geld zurück?
    meaning:
      en: That long? Can't I exchange it? Or get the money back?
      ar: كل هذه المدة؟ ألا يمكنني استبداله؟ أو استرداد المال؟
      mk: Толку долго? Не можам ли да го заменам? Или парите назад?
  - speaker: kasse
    text: Moment, ich frage meinen Chef... Gut, Sie bekommen ein neues.
    meaning:
      en: One moment, I'll ask my boss... OK, you get a new one.
      ar: لحظة، سأسأل مديري... حسنًا، ستحصل على جهاز جديد.
      mk: Момент, ќе го прашам шефот... Добро, добивате нов.
