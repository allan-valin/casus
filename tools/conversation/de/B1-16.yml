- type: narrator
  text:
    en: 'In the EU the seller is responsible for faults for two years (Gewährleistung), on top of any maker''s warranty. Keep the receipt. Shops don''t have to take back working goods you simply don''t
      like — online purchases are different: there you can usually return within 14 days.'
    ar: 'في الاتحاد الأوروبي البائع مسؤول عن العيوب لمدة سنتين (Gewährleistung)، إضافة إلى ضمان المصنّع. احتفظ بالإيصال. المتاجر غير ملزمة باسترجاع بضاعة سليمة لم تعجبك — أما المشتريات عبر الإنترنت فمختلفة:
      يمكن عادةً إرجاعها خلال 14 يومًا.'
    mk: 'Во ЕУ продавачот одговара за дефекти две години (Gewährleistung), покрај гаранцијата на производителот. Чувајте ја сметката. Продавниците не мора да вратат исправна стока што едноставно не ви се
      допаѓа — купувањето преку интернет е различно: таму обично може да вратите во рок од 14 дена.'
