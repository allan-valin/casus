steps:
- type: narrator
  text:
    en: The lecture is at eight. You arrive at eight sharp — and everyone is already seated. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Entschuldigung, bin ich zu spät? Es ist genau acht.
    meaning:
      en: Sorry, am I late? It's exactly eight.
  - speaker: jonas
    text: Fast! Alle sind schon da. Wir kommen um Viertel vor acht.
    meaning:
      en: Almost! Everyone's already here. We come at quarter to eight.
  - speaker: protagonist
    text: Viertel vor acht? So früh?
    meaning:
      en: Quarter to eight? That early?
  - speaker: jonas
    text: Ja. Und um halb acht ist der Professor da.
    meaning:
      en: Yes. And at half past seven the professor is here.
  - speaker: protagonist
    text: Wie spät ist es jetzt?
    meaning:
      en: What time is it now?
  - speaker: jonas
    text: Fünf nach acht. Er beginnt.
    meaning:
      en: Five past eight. He's starting.
  - speaker: protagonist
    text: Und die Bahn hatte Verspätung...
    meaning:
      en: And the train was delayed...
  - speaker: jonas
    text: Das sagen alle! Das nächste Mal früher.
    meaning:
      en: Everyone says that! Earlier next time.
