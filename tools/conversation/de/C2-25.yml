  answer:
    speaker: protagonist
    text: Auf den Rhythmus achten.
  items:
  - der-rhythmus
- type: prompt
  ask:
    en: 'Recite: Lord, it is time. The summer was immense.'
    ar: 'ألقي: يا ربّ، لقد حان الوقت. كان الصيف عظيمًا.'
    mk: 'Рецитирајте: Господи, време е. Летото беше големо.'
  answer:
