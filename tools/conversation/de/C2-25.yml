    text: 'Herr: es ist Zeit. Der Sommer war sehr groß.'
  items:
  - der-dichter-c2
- type: narrator
  text:
    en: 'Poetic language bends normal German: imperatives to God («Leg deinen Schatten…»), inverted word order («und auf den Fluren lass die Winde los»), and rare nouns («die Vollendung», «die Süße»). Read
      it slowly, with the stress on every second syllable.'
    ar: 'اللغة الشعرية تثني الألمانية العادية: أوامر موجّهة إلى الله («Leg deinen Schatten…»)، وترتيب كلمات مقلوب («und auf den Fluren lass die Winde los»)، وأسماء نادرة («die Vollendung»، «die Süße»).
      اقرئيها ببطء والنبر على كل مقطع ثانٍ.'
    mk: 'Поетскиот јазик го свиткува обичниот германски: императиви кон Бога («Leg deinen Schatten…»), превртен ред на зборовите («und auf den Fluren lass die Winde los»), ретки именки («die Vollendung»,
      «die Süße»). Читајте бавно, со нагласок на секој втор слог.'
- type: prompt
  ask:
