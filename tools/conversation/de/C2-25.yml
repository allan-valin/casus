steps:
- type: narrator
  text:
    en: Autumn at the VHS. Professor Hartmann asks you to read Rilke's 'Herbsttag' aloud — rhythm, rhyme and all. Listen to the conversation; you don't need to understand it yet.
    ar: الخريف في الجامعة الشعبية. البروفيسور هارتمان يطلب منكِ قراءة قصيدة ريلكه «يوم خريفي» بصوت عالٍ — بإيقاعها وقافيتها. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Есен на народниот универзитет. Професорот Хартман ве моли гласно да ја прочитате „Есенски ден“ од Рилке — со ритамот и римата. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: hartmann
    text: Bitte tragen Sie die erste Strophe vor. Achten Sie auf den Rhythmus.
    meaning:
      en: Please recite the first stanza. Pay attention to the rhythm.
      ar: من فضلكِ ألقي المقطع الأول. انتبهي للإيقاع.
      mk: Ве молам рецитирајте ја првата строфа. Внимавајте на ритамот.
  - speaker: protagonist
    text: '„Herr: es ist Zeit. Der Sommer war sehr groß. Leg deinen Schatten auf die Sonnenuhren, und auf den Fluren lass die Winde los.“'
    meaning:
      en: '''Lord: it is time. The summer was immense. Lay your shadow on the sundials, and on the meadows let the winds loose.'''
      ar: '«يا ربّ: لقد حان الوقت. كان الصيف عظيمًا جدًا. ضع ظلّك على المزاول، وأطلق الرياح على المروج.»'
      mk: '„Господи: време е. Летото беше многу големо. Стави ја сенката своја на сончевите часовници, и по полињата пушти ги ветровите.“'
  - speaker: hartmann
    text: Schön. Hören Sie den Reim? „groß“ — „los“, „Sonnenuhren“ — „Fluren“.
    meaning:
      en: Lovely. Can you hear the rhyme? 'groß' — 'los', 'Sonnenuhren' — 'Fluren'.
      ar: جميل. هل تسمعين القافية؟ «groß» — «los»، «Sonnenuhren» — «Fluren».
      mk: Убаво. Ја слушате ли римата? „groß“ — „los“, „Sonnenuhren“ — „Fluren“.
  - speaker: protagonist
    text: Ja. Und die Betonung — fünf Hebungen pro Zeile, wie ein langsamer Schritt.
    meaning:
      en: Yes. And the stress — five beats per line, like a slow step.
      ar: نعم. والنبر — خمس نبرات في كل سطر، كخطوة بطيئة.
      mk: Да. И нагласокот — пет удари во стих, како бавен чекор.
  - speaker: hartmann
    text: Genau. Und die letzte Strophe?
    meaning:
      en: Exactly. And the last stanza?
      ar: بالضبط. والمقطع الأخير؟
      mk: Точно. А последната строфа?
  - speaker: protagonist
    text: „Wer jetzt kein Haus hat, baut sich keines mehr. Wer jetzt allein ist, wird es lange bleiben.“
    meaning:
      en: '''Whoever has no house now will not build one. Whoever is alone now will long remain so.'''
      ar: «من لا بيت له الآن لن يبني بيتًا بعد. ومن هو وحيد الآن سيبقى وحيدًا طويلًا.»
      mk: „Кој сега нема куќа, повеќе нема да гради. Кој сега е сам, долго ќе остане.“
  - speaker: hartmann
    text: Wie klingt das für Sie?
    meaning:
      en: How does that sound to you?
      ar: كيف يبدو لكِ ذلك؟
      mk: Како ви звучи тоа?
  - speaker: protagonist
    text: Nach Melancholie. Aber ich habe hier ein Haus gefunden — und bin nicht allein. Also lese ich es mit einem Lächeln.
    meaning:
      en: Like melancholy. But I've found a home here — and I'm not alone. So I read it with a smile.
      ar: كآبة شجيّة. لكنني وجدتُ هنا بيتًا — ولستُ وحيدة. لذلك أقرؤها بابتسامة.
      mk: Како меланхолија. Но јас тука најдов дом — и не сум сама. Затоа ја читам со насмевка.
- type: prompt
  ask:
    en: 'Say: recite the first stanza.'
    ar: 'قولي: ألقي المقطع الأول.'
    mk: 'Кажете: рецитирај ја првата строфа.'
  answer:
