- type: prompt
  ask:
    en: 'Say: it sounds like melancholy.'
    ar: 'قولي: يبدو ككآبة شجيّة.'
    mk: 'Кажете: звучи како меланхолија.'
  answer:
    speaker: protagonist
    text: Es klingt nach Melancholie.
  items:
  - die-melancholie
- type: narrator
  text:
    en: 'Rilke''s ''Herbsttag'' (1902) is one of the most quoted German poems; many Germans know its first and last lines by heart. Reading a poem aloud — slowly, with its rhythm — is a fine test of C2:
      you hear whether you feel the language, not just understand it.'
    ar: 'قصيدة ريلكه «يوم خريفي» (1902) من أكثر القصائد الألمانية اقتباسًا؛ وكثير من الألمان يحفظون أسطرها الأولى والأخيرة. وقراءة قصيدة بصوت عالٍ — ببطء وبإيقاعها — اختبار جميل لمستوى C2: تسمعين إن كنتِ
      تشعرين باللغة لا تفهمينها فقط.'
    mk: '„Есенски ден“ (1902) од Рилке е една од најцитираните германски песни; многу Германци ги знаат напамет првите и последните стихови. Гласното читање песна — бавно, со нејзиниот ритам — е убав тест
      за C2: слушате дали го чувствувате јазикот, не само дали го разбирате.'
