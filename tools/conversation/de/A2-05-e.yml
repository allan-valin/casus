steps:
- type: narrator
  text:
    en: At the public health insurer's office. Public or private? The clerk explains. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: kasse
    text: Möchten Sie gesetzlich oder privat versichert sein?
    meaning:
      en: Would you like to be publicly or privately insured?
  - speaker: protagonist
    text: Was ist der Unterschied?
    meaning:
      en: What's the difference?
  - speaker: kasse
    text: Gesetzlich gibt es den Studententarif — bei allen Kassen gleich, bis etwa dreißig.
    meaning:
      en: Public insurance has the student rate — the same at every insurer, until about thirty.
  - speaker: protagonist
    text: Und privat? Es ist billiger.
    meaning:
      en: And private? It's cheaper.
  - speaker: kasse
    text: Am Anfang. Aber oft mit Wartezeit, Sie bezahlen vorher, und es gibt eine Selbstbeteiligung.
    meaning:
      en: At first. But often with a waiting period, you pay first, and there's an excess.
  - speaker: protagonist
    text: Und später zurück zur gesetzlichen Kasse?
    meaning:
      en: And later back to public?
  - speaker: kasse
    text: Während des Studiums gibt es kein Zurück.
    meaning:
      en: During your studies there's no way back.
  - speaker: protagonist
    text: Dann bleibe ich gesetzlich. Sprechen Sie mit mir Englisch?
    meaning:
      en: Then I'll stay public. Will you speak English with me?
  - speaker: kasse
    text: Ein bisschen. Ich empfehle Ihnen das Formular auf Englisch.
    meaning:
      en: A little. I recommend the form in English to you.
