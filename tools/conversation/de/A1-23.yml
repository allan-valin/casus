  text:
    en: '«dürfen» — be allowed: «man darf» (one may), «Darf ich …?» (may I?). With «nicht» it means ''must not'': «man darf nicht laut sein».'
    ar: '«dürfen» تعني: يُسمح. «man darf» (يجوز)، «Darf ich …?» (هل يُسمح لي؟). ومع «nicht» تعني: لا يجوز: «man darf nicht laut sein».'
    mk: '«dürfen» — смее: «man darf» (се смее), «Darf ich …?» (смеам ли?). Со «nicht» значи не смее: «man darf nicht laut sein».'
