steps:
- type: narrator
  text:
    en: 'Ten past ten at night. Friends are visiting. Someone knocks: Frau Becker in her dressing gown. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'العاشرة وعشر دقائق ليلًا. عندكِ ضيوف. أحدهم يطرق الباب: السيدة بيكر بثوب النوم. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.'
    mk: 'Десет и десет навечер. Имате гости. Некој чука: госпоѓа Бекер во бањарка. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: becker
    text: Entschuldigung, es ist zu laut. Es ist nach zehn Uhr.
    meaning:
      en: Excuse me, it's too loud. It's after ten o'clock.
      ar: عفوًا، الصوت عالٍ جدًا. الساعة بعد العاشرة.
      mk: Извинете, премногу бучно е. Поминато е десет часот.
  - speaker: protagonist
    text: Oh! Entschuldigung. Ist das ein Problem?
    meaning:
      en: Oh! Sorry. Is that a problem?
      ar: آه! عفوًا. هل هذه مشكلة؟
      mk: О! Извинете. Дали е проблем?
  - speaker: becker
    text: Ab zehn ist Ruhezeit. Dann darf man nicht mehr laut sein.
    meaning:
      en: From ten it's quiet hours. Then you mustn't be loud any more.
      ar: من العاشرة ساعات الهدوء. حينها لا يجوز رفع الصوت.
      mk: Од десет е време за мир. Тогаш не смее да се биде гласно.
  - speaker: protagonist
    text: Die Gäste gehen bald.
    meaning:
      en: The guests are leaving soon.
      ar: الضيوف سيغادرون قريبًا.
      mk: Гостите наскоро си одат.
  - speaker: becker
    text: Gut. Ich schlafe unten, und ich arbeite um sechs.
    meaning:
      en: Good. I sleep downstairs, and I work at six.
      ar: حسنًا. أنا أنام في الأسفل، وأعمل في السادسة.
      mk: Добро. Јас спијам долу, а работам во шест.
  - speaker: protagonist
    text: Natürlich. Wir sind jetzt leise.
    meaning:
      en: Of course. We'll be quiet now.
      ar: طبعًا. سنكون هادئين الآن.
      mk: Секако. Сега ќе бидеме тивко.
  - speaker: protagonist
    text: Darf ich am Samstag Gäste haben? Bis elf?
    meaning:
      en: May I have guests on Saturday? Until eleven?
      ar: هل يُسمح لي باستقبال ضيوف يوم السبت؟ حتى الحادية عشرة؟
      mk: Смеам ли во сабота да имам гости? До единаесет?
  - speaker: becker
    text: Sagen Sie es vorher. Dann ist es kein Problem. Gute Nacht!
    meaning:
      en: Tell me beforehand. Then it's no problem. Good night!
      ar: أخبريني مسبقًا. عندها لا مشكلة. تصبحين على خير!
      mk: Кажете ми однапред. Тогаш не е проблем. Добра ноќ!
