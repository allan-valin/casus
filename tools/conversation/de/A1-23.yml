- type: narrator
  text:
    en: House rules usually set quiet hours from 10 p.m. to 6 a.m., and all of Sunday. Tell your neighbours before a party — a note on the door is enough — and most will say yes.
    ar: قواعد العمارة تحدد عادةً ساعات الهدوء من العاشرة ليلًا حتى السادسة صباحًا، ويوم الأحد كله. أخبري الجيران قبل أي حفلة — ورقة على الباب تكفي — وأغلبهم سيوافق.
    mk: Куќниот ред обично одредува време за мир од десет навечер до шест наутро, и цела недела. Кажете им на соседите пред забава — доволна е белешка на вратата — и повеќето ќе се согласат.
- type: narrator
  for:
  - ar
  - mk
  text:
