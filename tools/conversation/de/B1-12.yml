steps:
- type: narrator
  text:
    en: The evening news shows a poll. Frau Becker and you argue about what the numbers really say. Listen to the conversation; you don't need to understand it yet.
    ar: نشرة الأخبار المسائية تعرض استطلاعًا. أنت والسيدة بيكر تتجادلان حول ما تقوله الأرقام حقًا. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Вечерните вести прикажуваат анкета. Вие и госпоѓа Бекер се расправате што навистина кажуваат бројките. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: becker
    text: Sehen Sie! Die Mehrheit ist gegen das neue Gesetz. Sechzig Prozent!
    meaning:
      en: See! The majority is against the new law. Sixty per cent!
      ar: انظر! الأغلبية ضد القانون الجديد. ستون بالمئة!
      mk: Гледате! Мнозинството е против новиот закон. Шеесет проценти!
  - speaker: protagonist
    text: Wie viele Leute wurden befragt?
    meaning:
      en: How many people were asked?
      ar: كم شخصًا سُئلوا؟
      mk: Колку луѓе беа анкетирани?
  - speaker: becker
    text: Tausend. Ist das nicht genug?
    meaning:
      en: A thousand. Isn't that enough?
      ar: ألف. أليس هذا كافيًا؟
      mk: Илјада. Зарем не е доволно?
  - speaker: protagonist
    text: Wenn die Umfrage repräsentativ ist, ja. Was ist die Quelle?
    meaning:
      en: If the poll is representative, yes. What's the source?
      ar: إذا كان الاستطلاع تمثيليًا، نعم. ما المصدر؟
      mk: Ако анкетата е репрезентативна, да. Кој е изворот?
  - speaker: becker
    text: Das steht klein unter der Grafik.
    meaning:
      en: It's in small print under the chart.
      ar: مكتوب بخط صغير تحت الرسم البياني.
      mk: Пишува ситно под графиконот.
  - speaker: protagonist
    text: Könnten Sie das Bild anhalten? ... Online befragt, nur Menschen über sechzig.
    meaning:
      en: Could you pause the picture? ... Surveyed online, only people over sixty.
      ar: هل يمكنكِ إيقاف الصورة؟ ... سُئلوا على الإنترنت، فقط من تجاوزوا الستين.
      mk: Дали би можеле да ја запрете сликата? ... Анкетирани на интернет, само луѓе над шеесет.
  - speaker: becker
    text: Hm. Dann ist es nicht der Durchschnitt aller Deutschen.
    meaning:
      en: Hm. Then it isn't the average of all Germans.
      ar: همم. إذن ليس متوسط كل الألمان.
      mk: Хм. Тогаш тоа не е просекот на сите Германци.
  - speaker: protagonist
    text: Genau. Hätten Sie Lust auf einen Tee? Dann diskutieren wir weiter.
    meaning:
      en: Exactly. Would you fancy a tea? Then we'll keep discussing.
      ar: بالضبط. هل لديكِ رغبة في شاي؟ ثم نواصل النقاش.
      mk: Точно. Дали би сакале чај? Па ќе продолжиме да дискутираме.
