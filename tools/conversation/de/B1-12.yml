- type: narrator
  text:
    en: Before trusting a poll, ask who was asked, how many, how (online, phone) and by whom. The small print under the chart usually tells you.
    ar: 'قبل أن تثق باستطلاع، اسأل: من سُئل، وكم عددهم، وكيف (عبر الإنترنت أو الهاتف)، ومن أجراه. الخط الصغير تحت الرسم يخبرك غالبًا.'
    mk: Пред да ѝ верувате на анкета, прашајте кој бил анкетиран, колку, како (на интернет, по телефон) и од кого. Ситните букви под графиконот обично кажуваат.
