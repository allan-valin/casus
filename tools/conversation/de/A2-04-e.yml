steps:
- type: narrator
  text:
    en: Jonas asks how foreign students finance their studies. You explain the blocked account. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: jonas
    text: Wie finanzierst du das Studium?
    meaning:
      en: How do you finance your studies?
  - speaker: protagonist
    text: Mit einem Sperrkonto. Ich muss nachweisen, dass ich genug Geld habe.
    meaning:
      en: With a blocked account. I have to prove I have enough money.
  - speaker: jonas
    text: Ein Sperrkonto? Was ist das?
    meaning:
      en: A blocked account? What's that?
  - speaker: protagonist
    text: Das Geld liegt auf dem Konto, und ich bekomme jeden Monat einen Teil.
    meaning:
      en: The money sits in the account, and I get a part every month.
  - speaker: jonas
    text: Wie viel?
    meaning:
      en: How much?
  - speaker: protagonist
    text: Das ändert sich jedes Jahr. Es steht auf der Website der Botschaft.
    meaning:
      en: That changes every year. It's on the embassy's website.
  - speaker: jonas
    text: Und wenn man das Geld nicht hat?
    meaning:
      en: And if you don't have the money?
  - speaker: protagonist
    text: Dann geht ein Stipendium, eine Verpflichtungserklärung oder ein Einkommen.
    meaning:
      en: Then a scholarship, a sponsor's guarantee or an income will do.
  - speaker: jonas
    text: Kompliziert! Weil alles kontrolliert wird.
    meaning:
      en: Complicated! Because everything gets checked.
