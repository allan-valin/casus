steps:
- type: narrator
  text:
    en: 'A letter from the ''Beitragsservice'': you owe the broadcasting fee. You don''t even own a TV. Paul explains. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'رسالة من «Beitragsservice»: عليكِ رسوم البث. وأنتِ لا تملكين حتى تلفازًا. باول يشرح. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.'
    mk: 'Писмо од „Beitragsservice“: должите радиодифузна такса. А немате ни телевизор. Паул објаснува. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: Eine Zahlungsaufforderung vom Beitragsservice. Ich habe keinen Fernseher!
    meaning:
      en: A payment demand from the Beitragsservice. I don't have a TV!
      ar: مطالبة بالدفع من «Beitragsservice». ليس لديّ تلفاز!
      mk: Барање за плаќање од Beitragsservice. Немам телевизор!
  - speaker: paul
    text: Egal. Der Rundfunkbeitrag wird pro Wohnung bezahlt, nicht pro Gerät.
    meaning:
      en: Doesn't matter. The broadcasting fee is paid per flat, not per device.
      ar: لا يهم. رسوم البث تُدفع لكل مسكن، لا لكل جهاز.
      mk: Небитно. Радиодифузната такса се плаќа по стан, не по уред.
  - speaker: protagonist
    text: Und wofür?
    meaning:
      en: And what for?
      ar: ولأجل ماذا؟
      mk: А за што?
  - speaker: paul
    text: 'Für den öffentlich-rechtlichen Rundfunk: Nachrichten, Radio, die Mediathek. Unabhängig von Werbung und Regierung.'
    meaning:
      en: 'For public broadcasting: news, radio, the online library. Independent of advertising and government.'
      ar: 'للبث العام: الأخبار، الراديو، المكتبة الرقمية. مستقل عن الإعلانات والحكومة.'
      mk: 'За јавниот сервис: вести, радио, медијатеката. Независно од реклами и влада.'
  - speaker: protagonist
    text: In der WG zahlt jeder?
    meaning:
      en: In a flat-share does everyone pay?
      ar: في السكن المشترك يدفع كل واحد؟
      mk: Во заеднички стан плаќа секој?
  - speaker: paul
    text: Nein, einer zahlt für alle. Die anderen geben ihm ihren Anteil.
    meaning:
      en: No, one pays for everyone. The others give him their share.
      ar: لا، واحد يدفع عن الجميع. والآخرون يعطونه حصتهم.
      mk: Не, еден плаќа за сите. Другите му го даваат својот дел.
  - speaker: protagonist
    text: Kann ich den Brief einfach ignorieren?
    meaning:
      en: Can I just ignore the letter?
      ar: هل يمكنني ببساطة تجاهل الرسالة؟
      mk: Можам ли едноставно да го игнорирам писмото?
  - speaker: paul
    text: Bloß nicht! Dann kommen Mahngebühren. Mit wenig Einkommen gibt es eine Befreiung — beantrage sie.
    meaning:
      en: Absolutely not! Then come reminder fees. With low income there's an exemption — apply for it.
      ar: إياكِ! عندها تأتي رسوم التذكير. مع دخل قليل يوجد إعفاء — قدّمي طلبًا.
      mk: Никако! Тогаш доаѓаат казнени такси. Со мал приход има ослободување — побарај го.
