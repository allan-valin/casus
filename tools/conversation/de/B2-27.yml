- type: narrator
  text:
    en: Every household pays one broadcasting fee, whether it has a TV or not; registering your address triggers the letter. In a shared flat one person pays. People on certain benefits, students with BAföG
      and some others can be exempted — on application. Ignoring the letters leads to reminder fees and enforcement.
    ar: كل مسكن يدفع رسم بث واحدًا، سواء كان فيه تلفاز أم لا؛ وتسجيل عنوانكِ يجلب الرسالة. في السكن المشترك يدفع شخص واحد. ويمكن إعفاء مستفيدين من إعانات معيّنة وطلاب بمنحة «BAföG» وآخرين — بناءً على طلب.
      وتجاهل الرسائل يؤدي إلى رسوم تذكير وتنفيذ إجباري.
    mk: Секое домаќинство плаќа една радиодифузна такса, без разлика дали има телевизор; пријавувањето на адресата го предизвикува писмото. Во заеднички стан плаќа едно лице. Луѓе што примаат одредена социјална
      помош, студенти со BAföG и некои други можат да бидат ослободени — со барање. Игнорирањето на писмата води до казнени такси и присилна наплата.
