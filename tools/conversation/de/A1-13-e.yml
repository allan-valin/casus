steps:
- type: narrator
  text:
    en: 'Lunch at the Mensa: six queues, six coffee machines — and someone steps in front of you. Listen to the conversation; you don''t need to understand it yet.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: Entschuldigung, ich war zuerst da.
    meaning:
      en: Excuse me, I was here first.
  - speaker: jonas
    text: Oh, stimmt. Sorry!
    meaning:
      en: Oh, that's right. Sorry!
  - speaker: protagonist
    text: Kein Problem. Warum gibt es so viele Schlangen?
    meaning:
      en: No problem. Why are there so many queues?
  - speaker: jonas
    text: Eine Schlange für jedes Essen. Und eine für jeden Kaffeeautomaten.
    meaning:
      en: One queue for each meal. And one for each coffee machine.
  - speaker: protagonist
    text: Ist das Essen vegetarisch?
    meaning:
      en: Is the meal vegetarian?
  - speaker: jonas
    text: Das hier ja. Kein Fleisch.
    meaning:
      en: This one, yes. No meat.
  - speaker: protagonist
    text: Und schmeckt es?
    meaning:
      en: And is it good?
  - speaker: jonas
    text: Nicht so gut. Aber billig!
    meaning:
      en: Not so good. But cheap!
  - speaker: protagonist
    text: Und einen Kaffee?
    meaning:
      en: And a coffee?
  - speaker: jonas
    text: Heute nicht. Die Schlange ist zu lang.
    meaning:
      en: Not today. The queue's too long.
