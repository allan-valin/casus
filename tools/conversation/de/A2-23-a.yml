steps:
- type: narrator
  text:
    ar: ابن أختكِ عمر، سبع سنوات، وصل مع عائلته. تذهبين مع أختكِ لتسجيله في المدرسة. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
- type: dialogue
  lines:
  - speaker: lehrerin
    text: Guten Morgen. Sie möchten ein Kind anmelden?
    meaning:
      ar: صباح الخير. تريدين تسجيل طفل؟
  - speaker: protagonist
    text: Ja, meinen Neffen Omar. Er ist letzte Woche angekommen.
    meaning:
      ar: نعم، ابن أختي عمر. وصل الأسبوع الماضي.
  - speaker: lehrerin
    text: Wie alt ist er?
    meaning:
      ar: كم عمره؟
  - speaker: protagonist
    text: Sieben. Er hat in Syrien zwei Jahre Schule gehabt.
    meaning:
      ar: سبع سنوات. درس سنتين في سوريا.
  - speaker: lehrerin
    text: Hat er schon Deutsch gelernt?
    meaning:
      ar: هل تعلّم الألمانية؟
  - speaker: protagonist
    text: Nein, noch nicht.
    meaning:
      ar: لا، ليس بعد.
  - speaker: lehrerin
    text: Dann kommt er zuerst in die Willkommensklasse. Dort lernt er Deutsch.
    meaning:
      ar: إذن يدخل أولًا صف الترحيب. هناك يتعلّم الألمانية.
  - speaker: protagonist
    text: Muss er sofort in die Schule?
    meaning:
      ar: هل يجب أن يذهب إلى المدرسة فورًا؟
  - speaker: lehrerin
    text: Ja, in Deutschland gibt es Schulpflicht. Ab Montag!
    meaning:
      ar: نعم، في ألمانيا التعليم إلزامي. ابتداءً من الاثنين!
