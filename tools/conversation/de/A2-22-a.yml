steps:
- type: narrator
  text:
    ar: الجارة السيدة نويمان تدعو عائلتك إلى القهوة يوم الأحد. ماذا تحضرون معكم؟ استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
- type: dialogue
  lines:
  - speaker: neumann
    text: Ich möchte Sie und Ihre Familie zum Kaffee einladen. Am Sonntag um drei?
    meaning:
      ar: أودّ أن أدعوك أنت وعائلتك إلى القهوة. يوم الأحد في الثالثة؟
  - speaker: protagonist
    text: Danke für die Einladung! Wir kommen gern.
    meaning:
      ar: شكرًا على الدعوة! نأتي بكل سرور.
  - speaker: protagonist
    text: Sollen wir etwas mitbringen? Meine Frau macht gutes Gebäck.
    meaning:
      ar: هل نحضر شيئًا معنا؟ زوجتي تصنع معجنات طيبة.
  - speaker: neumann
    text: Nein, nein, nur Sie selbst! Ich backe einen Kuchen.
    meaning:
      ar: لا، لا، فقط أنتم! سأخبز كعكة.
  - speaker: protagonist
    text: Gut. Dann bringen wir Blumen.
    meaning:
      ar: حسنًا. إذن نحضر أزهارًا.
  - speaker: neumann
    text: Das ist nett. Und Ihre Tochter trinkt Kakao?
    meaning:
      ar: هذا لطيف. وابنتك تشرب الكاكاو؟
  - speaker: protagonist
    text: Ja, sehr gern. Also pünktlich um drei!
    meaning:
      ar: نعم، كثيرًا. إذن في الثالثة تمامًا!
  - speaker: neumann
    text: Wir freuen uns!
    meaning:
      ar: يسعدنا ذلك!
