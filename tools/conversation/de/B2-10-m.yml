steps:
- type: narrator
  text:
    mk: Господин Волф, таткото на Ања, има семејна столарница и бара чирак. Ве моли да му помогнете да ги прочита пријавите. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: herrwolf
    text: Unsere Tischlerei ist ein Familienbetrieb, seit drei Generationen. Jetzt brauche ich einen Azubi.
    meaning:
      mk: Нашата столарница е семејна фирма веќе три генерации. Сега ми треба чирак.
  - speaker: protagonist
    text: Wie viele Bewerbungen haben Sie?
    meaning:
      mk: Колку пријави имате?
  - speaker: herrwolf
    text: Nur vier. Junge Leute wollen kein Handwerk mehr.
    meaning:
      mk: Само четири. Младите веќе не сакаат занает.
  - speaker: protagonist
    text: Bei uns war Handwerk immer etwas Gutes. Mein Vater war Tischler.
    meaning:
      mk: Кај нас занаетот секогаш беше нешто добро. Татко ми беше столар.
  - speaker: herrwolf
    text: Wirklich? Dann helfen Sie mir bei der Auswahl!
    meaning:
      mk: Навистина? Тогаш помогнете ми во изборот!
  - speaker: protagonist
    text: 'Dieser hier schreibt: „Zuverlässigkeit und Freude am Handwerk“.'
    meaning:
      mk: 'Овој тука пишува: „Доверливост и радост од занаетот“.'
  - speaker: herrwolf
    text: Gut. Und geschickt? Die Ausbildung dauert drei Jahre.
    meaning:
      mk: Добро. А вешт? Стручното образование трае три години.
  - speaker: protagonist
    text: Laden Sie ihn zum Probetag ein. Vielleicht wird er sogar Ihre Nachfolge.
    meaning:
      mk: Поканете го на пробен ден. Можеби дури ќе стане ваш наследник.
