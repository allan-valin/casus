steps:
- type: narrator
  text:
    en: The international office pairs you with a German buddy. First meeting in a café. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: mia
    text: Hi! Ich bin Mia, dein Buddy. Willkommen!
    meaning:
      en: Hi! I'm Mia, your buddy. Welcome!
  - speaker: protagonist
    text: Danke! Was macht ein Buddy?
    meaning:
      en: Thanks! What does a buddy do?
  - speaker: mia
    text: 'Ich helfe dir: bei der Anmeldung, bei der Wohnungssuche, im Studium.'
    meaning:
      en: 'I help you: with registration, flat hunting, your studies.'
  - speaker: protagonist
    text: Super. Ich habe viele Fragen.
    meaning:
      en: Great. I have lots of questions.
  - speaker: mia
    text: Stell sie! Und geh ins Tutorium — da lernst du Leute kennen.
    meaning:
      en: Ask them! And go to the tutorial — you'll meet people there.
  - speaker: protagonist
    text: Und wenn ich Probleme habe?
    meaning:
      en: And if I have problems?
  - speaker: mia
    text: Dann gibt es die Beratung im International Office.
    meaning:
      en: Then there's advice at the International Office.
  - speaker: protagonist
    text: Gut zu wissen.
    meaning:
      en: Good to know.
  - speaker: mia
    text: 'Und hier: eine Einladung zum Stammtisch, am Donnerstag.'
    meaning:
      en: 'And here: an invitation to the regulars'' evening, on Thursday.'
