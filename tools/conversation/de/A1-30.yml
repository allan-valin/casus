steps:
- type: narrator
  text:
    en: A trial evening at the Sportverein. Trainer Petra says du to everyone — and A1 comes back. Listen to the conversation; you don't need to understand it yet.
    ar: أمسية تجريبية في النادي الرياضي. المدرّبة بيترا تخاطب الجميع بـ«du» — والمستوى A1 يعود. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Пробна вечер во спортскиот клуб. Тренерката Петра на сите им вели «du» — и A1 се враќа. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: petra
    text: Hallo! Ich bin Petra, die Trainerin. Bist du neu?
    meaning:
      en: Hi! I'm Petra, the trainer. Are you new?
      ar: مرحبًا! أنا بيترا، المدرّبة. هل أنت جديد؟
      mk: Здраво! Јас сум Петра, тренерката. Нов си?
  - speaker: protagonist
    text: Ja. Ich möchte ein Probetraining machen.
    meaning:
      en: Yes. I'd like to do a trial session.
      ar: نعم. أودّ أن أجرّب تمرينًا.
      mk: Да. Би сакал да направам пробен тренинг.
  - speaker: petra
    text: Super! Mach einfach mit. Im Verein sagen alle du.
    meaning:
      en: Great! Just join in. In the club everyone says du.
      ar: رائع! شارك فقط. في النادي الجميع يقولون «du».
      mk: Супер! Само придружи се. Во клубот сите си велат «du».
  - speaker: protagonist
    text: Okay! Das Training ist schnell...
    meaning:
      en: OK! The training is fast...
      ar: حسنًا! التمرين سريع...
      mk: Во ред! Тренингот е брз...
  - speaker: petra
    text: Schnell und anstrengend! Kannst du noch?
    meaning:
      en: Fast and tiring! Can you keep going?
      ar: سريع ومتعب! هل ما زلت تستطيع؟
      mk: Брз и напорен! Можеш ли уште?
  - speaker: protagonist
    text: Ein bisschen. Mein Arm tut weh!
    meaning:
      en: A bit. My arm hurts!
      ar: قليلًا. ذراعي تؤلمني!
      mk: Малку. Ме боли раката!
  - speaker: petra
    text: Willst du Mitglied werden?
    meaning:
      en: Do you want to become a member?
      ar: هل تريد أن تصبح عضوًا؟
      mk: Сакаш ли да станеш член?
  - speaker: protagonist
    text: Ja, gern! Wann ist das nächste Training?
    meaning:
      en: Yes, gladly! When's the next training?
      ar: نعم، بكل سرور! متى التمرين القادم؟
      mk: Да, со задоволство! Кога е следниот тренинг?
  - speaker: petra
    text: Am Donnerstag um sieben. Bis dann!
    meaning:
      en: On Thursday at seven. See you then!
      ar: يوم الخميس في السابعة. إلى اللقاء!
      mk: Во четврток во седум. Се гледаме!
