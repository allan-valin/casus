- type: prompt
  ask:
    en: 'She says: go to the tenants'' association.'
    ar: 'تقول: اذهب إلى جمعية المستأجرين.'
    mk: 'Таа вели: оди во здружението на станари.'
  answer:
    speaker: protagonist
    text: Geh zum Mieterverein.
  items:
  - der-mieterverein
- type: narrator
  text:
    en: Where the rent brake applies, a new rent may be only a little above the local reference rent (shown in the Mietspiegel); there are exceptions, e.g. new buildings. Social housing needs a Wohnberechtigungsschein
      from the city, based on income. A tenants' association checks rent rises and statements for a small yearly fee. Rules differ by city — check yours.
    ar: حيث تُطبَّق فرملة الإيجار، لا يجوز أن يتجاوز الإيجار الجديد الإيجار المرجعي المحلي إلا قليلًا (يظهر في «Mietspiegel»)؛ وهناك استثناءات، كالمباني الجديدة. والسكن الاجتماعي يحتاج شهادة استحقاق من
      البلدية بحسب الدخل. وجمعية المستأجرين تراجع زيادات الإيجار والكشوف مقابل رسم سنوي صغير. القواعد تختلف بين المدن — تحقّق من مدينتك.
    mk: Каде што важи сопирачката, новата кирија смее да биде само малку над вообичаената локална кирија (во Mietspiegel); има исклучоци, на пр. новоградби. За социјален стан треба Wohnberechtigungsschein
      од градот, според приходот. Здружението на станари проверува зголемувања и пресметки за мала годишна членарина. Правилата се разликуваат по градови — проверете го вашиот.
