  text:
    en: 'Passive forms side by side: «wird gebaut» (is being built — process), «wurde erhöht» (was raised — past), «ist begrenzt» (is limited — state).'
    ar: 'صيغ المبني للمجهول متجاورة: «wird gebaut» (يُبنى — عملية)، «wurde erhöht» (رُفع — ماضٍ)، «ist begrenzt» (محدود — حالة).'
    mk: 'Пасивни форми една до друга: «wird gebaut» (се гради — процес), «wurde erhöht» (беше зголемена — минато), «ist begrenzt» (е ограничено — состојба).'
- type: prompt
