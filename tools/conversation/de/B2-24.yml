steps:
- type: narrator
  text:
    en: 'Frau Becker reads the paper aloud: rents up again. Is the rent brake working? You talk it through. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'السيدة بيكر تقرأ الصحيفة بصوت عالٍ: الإيجارات ارتفعت مجددًا. هل تنجح «فرملة الإيجار»؟ تناقشان الأمر. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.'
    mk: 'Госпоѓа Бекер чита весник на глас: киријата пак порасна. Дали функционира сопирачката на кириите? Разговарате. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: becker
    text: 'Hier steht: Die Mieten wurden wieder erhöht. Zehn Prozent in drei Jahren!'
    meaning:
      en: 'It says here: rents were raised again. Ten per cent in three years!'
      ar: 'مكتوب هنا: رُفعت الإيجارات مجددًا. عشرة بالمئة في ثلاث سنوات!'
      mk: 'Тука пишува: кириите пак беа зголемени. Десет проценти за три години!'
  - speaker: protagonist
    text: Gibt es nicht die Mietpreisbremse?
    meaning:
      en: Isn't there the rent brake?
      ar: أليست هناك «فرملة الإيجار»؟
      mk: Нели постои сопирачка на кириите?
  - speaker: becker
    text: 'Doch. Bei neuen Verträgen ist die Miete begrenzt: höchstens etwas über der ortsüblichen Vergleichsmiete.'
    meaning:
      en: 'Yes. In new contracts the rent is limited: at most a bit above the local reference rent.'
      ar: 'بلى. في العقود الجديدة الإيجار محدود: على الأكثر أعلى قليلًا من الإيجار المرجعي المحلي.'
      mk: 'Да. Кај нови договори киријата е ограничена: најмногу малку над вообичаената локална кирија.'
  - speaker: protagonist
    text: Und warum steigt sie trotzdem?
    meaning:
      en: And why does it rise anyway?
      ar: ولماذا ترتفع مع ذلك؟
      mk: А зошто сепак расте?
  - speaker: becker
    text: Die Nachfrage ist größer als das Angebot. Es wird zu wenig gebaut.
    meaning:
      en: Demand is greater than supply. Too little is being built.
      ar: الطلب أكبر من العرض. يُبنى القليل جدًا.
      mk: Побарувачката е поголема од понудата. Се гради премалку.
  - speaker: protagonist
    text: Und Sozialwohnungen?
    meaning:
      en: And social housing?
      ar: والسكن الاجتماعي؟
      mk: А социјални станови?
  - speaker: becker
    text: Mit einem Wohnberechtigungsschein. Aber die Wartelisten sind lang.
    meaning:
      en: With a housing entitlement certificate. But the waiting lists are long.
      ar: بشهادة استحقاق السكن. لكن قوائم الانتظار طويلة.
      mk: Со потврда за право на социјален стан. Но листите на чекање се долги.
  - speaker: protagonist
    text: Was mache ich, wenn meine Miete zu hoch ist?
    meaning:
      en: What do I do if my rent is too high?
      ar: ماذا أفعل إذا كان إيجاري مرتفعًا جدًا؟
      mk: Што да правам ако киријата ми е превисока?
  - speaker: becker
    text: Geh zum Mieterverein. Die prüfen das — ich bin ja Vermieterin, ich sage dir das nicht gern!
    meaning:
      en: Go to the tenants' association. They check it — I'm a landlady, I don't like telling you this!
      ar: اذهب إلى جمعية المستأجرين. هم يتحقّقون من ذلك — أنا مؤجِّرة، ولا يسرّني أن أقول لك هذا!
      mk: Оди во здружението на станари. Тие проверуваат — јас сум станодавка, не ти го кажувам тоа радо!
- type: prompt
  ask:
    en: 'Say: rents were raised again.'
    ar: 'قل: رُفعت الإيجارات مجددًا.'
    mk: 'Кажете: кириите пак беа зголемени.'
  answer:
    speaker: protagonist
    text: Die Mieten wurden wieder erhöht.
  items:
  - wurde-erhoeht
- type: prompt
  ask:
    en: 'Ask: isn''t there the rent brake?'
