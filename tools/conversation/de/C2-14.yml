- type: narrator
  text:
    en: 'Remembrance has its own careful register: plain facts («deportiert 1942, ermordet in Auschwitz»), no jokes, no comparisons, and the distinction «Schuld» (guilt) vs «Verantwortung» (responsibility).'
    ar: 'لإحياء الذكرى أسلوب حذر خاص: وقائع بسيطة («deportiert 1942, ermordet in Auschwitz»)، بلا نكات ولا مقارنات، مع التمييز بين «Schuld» (الذنب) و«Verantwortung» (المسؤولية).'
    mk: 'Сеќавањето има свој внимателен регистар: прости факти («deportiert 1942, ermordet in Auschwitz»), без шеги, без споредби, и разликата «Schuld» (вина) и «Verantwortung» (одговорност).'
