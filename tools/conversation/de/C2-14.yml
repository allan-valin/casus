steps:
- type: narrator
  text:
    en: 9 November. With Professor Hartmann you clean the Stolpersteine on your street — small brass plaques for people murdered by the Nazis. Listen to the conversation; you don't need to understand it
      yet.
    ar: 9 نوفمبر. مع البروفيسور هارتمان تنظّف «حجارة العثرة» في شارعك — لوحات نحاسية صغيرة لأناس قتلهم النازيون. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: 9 ноември. Со професорот Хартман ги чистите Stolpersteine на вашата улица — мали месингани плочки за луѓе убиени од нацистите. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: hartmann
    text: „Hier wohnte Clara Rosenthal, Jahrgang 1921, deportiert 1942, ermordet in Auschwitz.“
    meaning:
      en: '''Here lived Clara Rosenthal, born 1921, deported 1942, murdered in Auschwitz.'''
      ar: «هنا عاشت كلارا روزنتال، مواليد 1921، رُحِّلت 1942، قُتلت في أوشفيتز.»
      mk: „Тука живееше Клара Розентал, родена 1921, депортирана 1942, убиена во Аушвиц.“
  - speaker: protagonist
    text: Sie war jünger als ich, als sie starb.
    meaning:
      en: She was younger than me when she died.
      ar: كانت أصغر مني حين ماتت.
      mk: Беше помлада од мене кога умре.
  - speaker: hartmann
    text: Darum putzen wir heute die Steine. Am 9. November 1938 war die Pogromnacht.
    meaning:
      en: That's why we clean the stones today. 9 November 1938 was the night of the pogrom.
      ar: لهذا ننظّف الحجارة اليوم. في 9 نوفمبر 1938 كانت ليلة البوغروم.
      mk: Затоа денес ги чистиме каменчињата. На 9 ноември 1938 беше ноќта на погромот.
  - speaker: protagonist
    text: Warum liegen sie im Boden, wo man darauf tritt?
    meaning:
      en: Why do they lie in the ground, where people step on them?
      ar: لماذا هي في الأرض حيث يدوس الناس عليها؟
      mk: Зошто се во земјата, каде што се гази по нив?
  - speaker: hartmann
    text: Wer sie lesen will, muss sich verbeugen. Das ist die Idee.
    meaning:
      en: Whoever wants to read them has to bow. That's the idea.
      ar: من يريد قراءتها عليه أن ينحني. هذه هي الفكرة.
      mk: Кој сака да ги прочита, мора да се поклони. Тоа е идејата.
  - speaker: protagonist
    text: Ist das nicht schwer — für Deutsche, für alle?
    meaning:
      en: Isn't that hard — for Germans, for everyone?
      ar: أليس هذا صعبًا — على الألمان، على الجميع؟
      mk: Зарем не е тешко — за Германците, за сите?
  - speaker: hartmann
    text: Schuld erben wir nicht. Aber Verantwortung. „Nie wieder“ gilt auch für Sie und Ihre Kinder.
    meaning:
      en: We don't inherit guilt. But responsibility. 'Never again' applies to you and your children too.
      ar: نحن لا نرث الذنب. لكننا نرث المسؤولية. «لن يتكرّر أبدًا» ينطبق عليك وعلى أطفالك أيضًا.
      mk: Вината не ја наследуваме. Но одговорноста да. „Никогаш повеќе“ важи и за вас и вашите деца.
  - speaker: protagonist
    text: Dann komme ich nächstes Jahr wieder — mit einer Rose.
    meaning:
      en: Then I'll come again next year — with a rose.
      ar: إذن سأعود العام القادم — بوردة.
      mk: Тогаш ќе дојдам пак следната година — со роза.
- type: prompt
  ask:
    en: 'Read the plaque: here lived…'
    ar: 'اقرأ اللوحة: هنا عاش…'
    mk: 'Прочитајте ја плочката: тука живееше…'
  answer:
    speaker: protagonist
    text: Hier wohnte…
  items:
  - hier-wohnte
