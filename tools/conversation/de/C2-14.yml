- type: narrator
  text:
    en: Stolpersteine, set by the artist Gunter Demnig since 1992, mark the last chosen home of people persecuted by the Nazis — Jews above all, also Sinti and Roma, the disabled, political opponents and
      others. Over 100,000 lie across Europe. On 9 November and 27 January many people clean them and lay flowers or candles.
    ar: حجارة العثرة، التي يضعها الفنان غونتر ديمنيغ منذ 1992، تُعلّم آخر مسكن اختاره أناس اضطهدهم النازيون — اليهود قبل الجميع، وأيضًا السنتي والروما وذوو الإعاقة والمعارضون السياسيون وغيرهم. أكثر من 100,000
      منها في أنحاء أوروبا. وفي 9 نوفمبر و27 يناير ينظّفها كثيرون ويضعون الزهور أو الشموع.
    mk: Stolpersteine, што ги поставува уметникот Гунтер Демниг од 1992, го означуваат последниот избран дом на луѓе прогонувани од нацистите — пред сè Евреи, но и Синти и Роми, лица со попреченост, политички
      противници и други. Над 100 000 има низ Европа. На 9 ноември и 27 јануари многумина ги чистат и оставаат цвеќе или свеќи.
