steps:
- type: narrator
  text:
    en: Your first payslip at the new job. Why is net so much less than gross? Tim goes through it line by line. Listen to the conversation; you don't need to understand it yet.
    ar: أول كشف راتب في الوظيفة الجديدة. لماذا الصافي أقل بكثير من الإجمالي؟ تيم يمرّ عليه سطرًا سطرًا. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Brutto ist gut. Aber netto? Fast ein Drittel weniger!
    meaning:
      en: Gross is good. But net? Almost a third less!
      ar: الإجمالي جيد. لكن الصافي؟ أقل بنحو الثلث!
  - speaker: tim
    text: 'Willkommen in Deutschland. Schau: zuerst die Lohnsteuer, aufgrund deiner Steuerklasse.'
    meaning:
      en: 'Welcome to Germany. Look: first income tax, due to your tax class.'
      ar: 'أهلًا بك في ألمانيا. انظر: أولًا ضريبة الأجور، بسبب فئتك الضريبية.'
  - speaker: protagonist
    text: Und der Soli? Und hier — Kirchensteuer? Ich bin kein Kirchenmitglied!
    meaning:
      en: And the Soli? And here — church tax? I'm not a church member!
      ar: وضريبة التضامن؟ وهنا — ضريبة الكنيسة؟ أنا لستُ عضوًا في كنيسة!
  - speaker: tim
    text: Den Soli zahlst du bei deinem Gehalt nicht. Die Kirchensteuer ist ein Fehler — melde das innerhalb des Monats!
    meaning:
      en: You don't pay the Soli on your salary. The church tax is a mistake — report it within the month!
      ar: لا تدفع ضريبة التضامن براتبك. ضريبة الكنيسة خطأ — أبلغ عنه خلال الشهر!
  - speaker: protagonist
    text: Und dann die Versicherungen?
    meaning:
      en: And then the insurances?
      ar: ثم التأمينات؟
  - speaker: tim
    text: Kranken-, Pflege-, Renten- und Arbeitslosenversicherung. Die Hälfte zahlt der Arbeitgeber dazu — der Arbeitgeberanteil.
    meaning:
      en: Health, care, pension and unemployment insurance. The employer pays half on top — the employer's share.
      ar: التأمين الصحي وتأمين الرعاية وتأمين التقاعد وتأمين البطالة. وصاحب العمل يدفع النصف إضافة — حصة صاحب العمل.
  - speaker: protagonist
    text: Also brutto abzüglich der Steuern und Abgaben ist netto.
    meaning:
      en: So gross minus taxes and contributions is net.
      ar: إذن الإجمالي مطروحًا منه الضرائب والاشتراكات هو الصافي.
  - speaker: tim
    text: Genau. Dafür bist du versichert, wenn du krank wirst oder alt.
    meaning:
      en: Exactly. In return you're insured when you're ill or old.
      ar: بالضبط. في المقابل أنت مؤمَّن عندما تمرض أو تكبر.
