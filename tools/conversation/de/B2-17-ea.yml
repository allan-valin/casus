- type: narrator
  text:
    en: 'Some prepositions take the genitive, mostly in written German: «aufgrund deiner Steuerklasse» (due to), «innerhalb des Monats» (within), «abzüglich der Steuern» (minus). In speech people often
      use «wegen» with the dative.'
    ar: 'بعض حروف الجر تأخذ حالة الإضافة، خاصة في الألمانية المكتوبة: «aufgrund deiner Steuerklasse» (بسبب)، «innerhalb des Monats» (خلال)، «abzüglich der Steuern» (مطروحًا منه). وفي الكلام يستعمل الناس
      غالبًا «wegen» مع حالة الجر.'
