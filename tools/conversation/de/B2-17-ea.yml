- type: narrator
  text:
    en: 'From a third to almost half of gross pay goes before you see it: income tax (by tax class), sometimes Soli and church tax, and the four social insurances; the employer pays roughly the same share
      of the insurances on top. Church tax only applies to members of churches that levy it — if it appears wrongly, tell payroll and the tax office quickly. (No amounts: rates change yearly.)'
    ar: 'من الثلث إلى ما يقارب النصف من الراتب الإجمالي يُقتطع قبل أن تراه: ضريبة الأجور (حسب الفئة الضريبية)، وأحيانًا ضريبة التضامن وضريبة الكنيسة، والتأمينات الاجتماعية الأربعة؛ وصاحب العمل يدفع حصة
      مماثلة تقريبًا من التأمينات إضافة. ضريبة الكنيسة تخصّ أعضاء الكنائس التي تفرضها فقط — إن ظهرت خطأً فأبلغ قسم الرواتب ومكتب الضرائب بسرعة. (لا مبالغ: النسب تتغيّر سنويًا.)'
