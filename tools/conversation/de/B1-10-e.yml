steps:
- type: narrator
  text:
    en: Your café cuts your hours. Can you get benefits? Mia explains what helps students instead. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Das Café gibt mir weniger Stunden. Wie soll ich die Miete zahlen?
    meaning:
      en: The café's giving me fewer hours. How am I meant to pay the rent?
  - speaker: mia
    text: Oh nein. Bekommst du Bürgergeld?
    meaning:
      en: Oh no. Do you get basic income support?
  - speaker: protagonist
    text: Ich glaube nicht, obwohl ich hier wohne.
    meaning:
      en: I don't think so, although I live here.
  - speaker: mia
    text: Stimmt. Studierende haben meistens keinen Anspruch darauf.
    meaning:
      en: Right. Students mostly have no entitlement to it.
  - speaker: protagonist
    text: Und Wohngeld?
    meaning:
      en: And housing benefit?
  - speaker: mia
    text: Auch schwierig. Geh zur Sozialberatung vom Studentenwerk.
    meaning:
      en: Also difficult. Go to the student services' social counselling.
  - speaker: protagonist
    text: Was machen die?
    meaning:
      en: What do they do?
  - speaker: mia
    text: Sie kennen Notfonds, Stipendien und Jobs. Sie helfen dir, obwohl alles kompliziert ist.
    meaning:
      en: They know emergency funds, scholarships and jobs. They help you, even though it's all complicated.
