steps:
- type: narrator
  text:
    mk: 'Лука е во четврто одделение. Петар е загрижен: гимназија или основно средно? Ви објаснува. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: petar
    text: Luka ist in der vierten Klasse. Jetzt kommt die Bildungsempfehlung.
    meaning:
      mk: Лука е во четврто одделение. Сега доаѓа препораката од училиштето.
  - speaker: protagonist
    text: Was für eine Empfehlung?
    meaning:
      mk: Каква препорака?
  - speaker: petar
    text: 'Die von der Lehrerin ausgestellte Empfehlung: Gymnasium oder Oberschule.'
    meaning:
      mk: 'Препораката издадена од наставничката: гимназија или средно училиште.'
  - speaker: protagonist
    text: Mit zehn Jahren? Bei uns entscheidet man das mit vierzehn!
    meaning:
      mk: На десет години? Кај нас тоа се одлучува на четиринаесет!
  - speaker: petar
    text: Hier früher. Der Notendurchschnitt ist entscheidend.
    meaning:
      mk: Тука порано. Просекот на оценки е одлучувачки.
  - speaker: protagonist
    text: Und wenn er auf die Oberschule kommt — ist das schlecht?
    meaning:
      mk: А ако оди во средно училиште — дали е тоа лошо?
  - speaker: petar
    text: Nein. Danach kann er eine Lehre machen oder wechseln. Es gibt Durchlässigkeit.
    meaning:
      mk: Не. Потоа може да учи занает или да премине. Има можност за премин.
  - speaker: protagonist
    text: 'Dann sag Luka: Opa ist stolz, egal welche Schule.'
    meaning:
      mk: 'Тогаш кажи му на Лука: дедо е горд, без разлика кое училиште.'
