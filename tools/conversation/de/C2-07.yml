- type: narrator
  text:
    en: Any resident may write to the Oberbürgermeister; letters are answered, usually by the responsible office. Name the facts, those affected and one concrete request, and copy in the office concerned.
      Local newspapers and the city council's question time are the next steps.
    ar: يحق لأي مقيم الكتابة إلى رئيس البلدية؛ والرسائل يُردّ عليها، عادةً من المكتب المختص. اذكري الوقائع والمتضرّرين وطلبًا محدّدًا واحدًا، وأرسلي نسخة إلى المكتب المعني. والصحف المحلية ووقت أسئلة المواطنين
      في مجلس المدينة هي الخطوات التالية.
    mk: Секој жител може да му пишува на градоначалникот; на писмата се одговара, обично од надлежната служба. Наведете ги фактите, засегнатите и едно конкретно барање и ставете ја надлежната служба во
      копија. Локалните весници и часот за прашања на граѓаните во советот се следните чекори.
