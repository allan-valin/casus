- type: prompt
  ask:
    en: 'Say: an old-fashioned very formal closing.'
    ar: 'قولي: ختامًا رسميًا جدًا قديم الطراز.'
    mk: 'Кажете: старомоден многу формален завршеток.'
  answer:
