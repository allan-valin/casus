steps:
- type: narrator
  text:
    en: The youth team has lost its hall time. The city didn't answer. Lena helps you write to the Lord Mayor directly. Listen to the conversation; you don't need to understand it yet.
    ar: فريق الناشئين خسر وقته في القاعة. المدينة لم تردّ. لينا تساعدكِ على الكتابة إلى رئيس البلدية مباشرة. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Младинската екипа го изгуби терминот во салата. Градот не одговори. Лена ви помага да му пишете директно на градоначалникот. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: lena
    text: 'Bürgermeister schreibt man: „Sehr geehrter Herr Oberbürgermeister“. Nicht „Hallo“!'
    meaning:
      en: 'To a mayor you write: ''Dear Lord Mayor''. Not ''Hello''!'
      ar: 'إلى رئيس البلدية تكتبين: «حضرة رئيس البلدية المحترم». لا «مرحبًا»!'
      mk: 'До градоначалник се пишува: „Почитуван господине градоначалник“. Не „Здраво“!'
  - speaker: protagonist
    text: „Mit Bedauern habe ich zur Kenntnis genommen, dass die Hallenzeit ersatzlos gestrichen wurde.“
    meaning:
      en: '''I note with regret that the hall slot has been cancelled without replacement.'''
      ar: «علمتُ بأسف أنّ وقت القاعة أُلغي دون بديل.»
      mk: „Со жалење дознав дека терминот во салата е укинат без замена.“
  - speaker: lena
    text: Gut. Jetzt das Anliegen — höflich, aber klar.
    meaning:
      en: Good. Now the request — polite but clear.
      ar: جيد. الآن الطلب — بأدب لكن بوضوح.
      mk: Добро. Сега барањето — учтиво, но јасно.
  - speaker: protagonist
    text: „Ich wende mich an Sie mit der Bitte, eine neue Hallenzeit für vierzig Kinder zu finden.“
    meaning:
      en: '''I am writing to ask you to find a new hall slot for forty children.'''
      ar: «أتوجّه إليكم راجيةً إيجاد وقت جديد في القاعة لأربعين طفلًا.»
      mk: „Ви се обраќам со молба да се најде нов термин во салата за четириесет деца.“
  - speaker: lena
    text: 'Nenn die Betroffenen: Kinder aus zwölf Nationen. Das zählt.'
    meaning:
      en: 'Name those affected: children from twelve nations. That counts.'
      ar: 'اذكري المتضرّرين: أطفال من اثنتي عشرة جنسية. هذا مهم.'
      mk: 'Наведи ги засегнатите: деца од дванаесет нации. Тоа е важно.'
  - speaker: protagonist
    text: „Für eine baldige Antwort wäre ich Ihnen dankbar. Hochachtungsvoll …“ Zu viel?
    meaning:
      en: '''I would be grateful for a prompt reply. Yours faithfully…'' Too much?'
      ar: «سأكون ممتنة لردّ قريب. وتفضّلوا بقبول فائق الاحترام…» مبالغ فيه؟
      mk: „Би ви била благодарна за брз одговор. Со длабока почит…“ Премногу?
  - speaker: lena
    text: „Mit freundlichen Grüßen“ reicht heute. Und das Sportamt in Kopie!
    meaning:
      en: '''Kind regards'' is enough today. And copy in the sports office!'
      ar: «مع أطيب التحيات» تكفي اليوم. وأرسلي نسخة إلى مكتب الرياضة!
      mk: „Со почит“ денес е доволно. И спортската служба во копија!
  - speaker: protagonist
    text: 'Abgeschickt. Jetzt heißt es: warten — und Daumen drücken.'
    meaning:
      en: 'Sent. Now it''s: wait — and keep fingers crossed.'
      ar: 'أُرسلت. الآن: الانتظار — والدعاء بالتوفيق.'
      mk: 'Испратено. Сега: чекање — и стискање палци.'
- type: prompt
  ask:
    en: Address the mayor.
    ar: خاطبي رئيس البلدية.
    mk: Обратете му се на градоначалникот.
  answer:
    speaker: protagonist
    text: Sehr geehrter Herr Oberbürgermeister,
  items:
  - sehr-geehrter-herr-ob
- type: narrator
  text:
    en: 'Very formal written register: «Mit Bedauern habe ich zur Kenntnis genommen, dass…», «Ich wende mich an Sie mit der Bitte, … zu …», «Für eine baldige Antwort wäre ich Ihnen dankbar». «Hochachtungsvoll»
      is old-fashioned; «Mit freundlichen Grüßen» is standard even to a mayor.'
    ar: 'الأسلوب المكتوب الرسمي جدًا: «Mit Bedauern habe ich zur Kenntnis genommen, dass…»، «Ich wende mich an Sie mit der Bitte, … zu …»، «Für eine baldige Antwort wäre ich Ihnen dankbar». و«Hochachtungsvoll»
      قديمة الطراز؛ و«Mit freundlichen Grüßen» هي المعتادة حتى مع رئيس البلدية.'
    mk: 'Многу формален писмен регистар: «Mit Bedauern habe ich zur Kenntnis genommen, dass…», «Ich wende mich an Sie mit der Bitte, … zu …», «Für eine baldige Antwort wäre ich Ihnen dankbar». «Hochachtungsvoll»
      е старомодно; «Mit freundlichen Grüßen» е стандардно дури и до градоначалник.'
- type: prompt
  ask:
    en: 'Write: I note with regret that…'
    ar: 'اكتبي: علمتُ بأسف أنّ…'
    mk: 'Напишете: со жалење дознав дека…'
  answer:
    speaker: protagonist
    text: Mit Bedauern habe ich zur Kenntnis genommen, dass…
  items:
  - mit-bedauern
- type: prompt
  ask:
    en: 'Write: the hall slot was cancelled without replacement.'
    ar: 'اكتبي: وقت القاعة أُلغي دون بديل.'
    mk: 'Напишете: терминот е укинат без замена.'
  answer:
    speaker: protagonist
    text: Die Hallenzeit wurde ersatzlos gestrichen.
