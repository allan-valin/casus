- type: narrator
  text:
    en: Flat-shares (WGs) are how many students and young workers live. A Putzplan on the fridge decides who cleans what each week — and breaking it is a real source of conflict.
    ar: السكن المشترك (WG) هو طريقة عيش كثير من الطلاب والشباب العاملين. وجدول التنظيف على الثلاجة يحدّد من ينظّف ماذا كل أسبوع — ومخالفته مصدر حقيقي للخلاف.
    mk: Заедничките станови (WG) се начинот на кој живеат многу студенти и млади вработени. Распоредот на фрижидерот одлучува кој што чисти секоја недела — а неговото кршење е вистински извор на кавги.
