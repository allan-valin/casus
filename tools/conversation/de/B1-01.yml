steps:
- type: narrator
  text:
    en: 'Jonas moves into a WG, a shared flat, and shows you round. On the fridge: the cleaning rota. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'يوناس ينتقل إلى سكن مشترك ويريكِ المكان. على الثلاجة: جدول التنظيف. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.'
    mk: 'Јонас се сели во заеднички стан и ви го покажува. На фрижидерот: распоредот за чистење. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: jonas
    text: Willkommen in meiner WG! Das ist Paul, der Mitbewohner, der Physik studiert.
    meaning:
      en: Welcome to my flat-share! This is Paul, the flatmate who studies physics.
      ar: أهلًا بكِ في سكني المشترك! هذا باول، شريك السكن الذي يدرس الفيزياء.
      mk: Добредојде во мојот заеднички стан! Ова е Паул, цимерот што студира физика.
  - speaker: protagonist
    text: Hallo! Und das ist dein Zimmer?
    meaning:
      en: Hi! And this is your room?
      ar: مرحبًا! وهذه غرفتك؟
      mk: Здраво! А ова е твојата соба?
  - speaker: jonas
    text: Ja, das Zimmer, das zum Hof geht. Und hier die Gemeinschaftsküche.
    meaning:
      en: Yes, the room that faces the courtyard. And here's the shared kitchen.
      ar: نعم، الغرفة التي تطلّ على الفناء. وهنا المطبخ المشترك.
      mk: Да, собата што гледа кон дворот. А тука заедничката кујна.
  - speaker: protagonist
    text: Was ist das am Kühlschrank?
    meaning:
      en: What's that on the fridge?
      ar: ما هذا على الثلاجة؟
      mk: Што е тоа на фрижидерот?
  - speaker: jonas
    text: Der Putzplan. Jede Woche ist eine Person dran.
    meaning:
      en: The cleaning rota. Every week one person has a turn.
      ar: جدول التنظيف. كل أسبوع يأتي دور شخص.
      mk: Распоредот за чистење. Секоја недела е некој на ред.
  - speaker: protagonist
    text: Und wer ist diese Woche dran?
    meaning:
      en: And whose turn is it this week?
      ar: ودور من هذا الأسبوع؟
      mk: А кој е на ред оваа недела?
  - speaker: jonas
    text: Ich. Ich muss das Bad putzen. Die Regeln sind streng!
    meaning:
      en: Me. I have to clean the bathroom. The rules are strict!
      ar: دوري. يجب أن أنظف الحمام. القواعد صارمة!
      mk: Јас. Морам да ја исчистам бањата. Правилата се строги!
  - speaker: protagonist
    text: Und die Person, die nicht putzt?
    meaning:
      en: And the person who doesn't clean?
      ar: والشخص الذي لا ينظّف؟
      mk: А лицето што не чисти?
  - speaker: jonas
    text: Die kauft Bier für alle!
    meaning:
      en: That person buys beer for everyone!
      ar: يشتري البيرة للجميع!
      mk: Тоа купува пиво за сите!
- type: prompt
  ask:
    en: 'Say: the flat-share.'
    ar: 'قولي: السكن المشترك.'
    mk: 'Кажете: заедничкиот стан.'
  answer:
    speaker: protagonist
    text: Die WG.
  items:
  - die-wg
- type: narrator
  text:
    en: 'Relative clauses describe a noun and send the verb to the end; the pronoun matches the noun: «der Mitbewohner, der Physik studiert», «das Zimmer, das zum Hof geht», «die Person, die nicht putzt».'
    ar: 'جمل الصلة تصف الاسم وترسل الفعل إلى الآخر، والضمير يطابق الاسم: «der Mitbewohner, der Physik studiert»، «das Zimmer, das zum Hof geht»، «die Person, die nicht putzt».'
