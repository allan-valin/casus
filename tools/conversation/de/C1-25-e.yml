steps:
- type: narrator
  text:
    en: Priya tells you about her cousin at home, who was not allowed to choose — and about what she learned here. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: priya
    text: Meine Cousine durfte nicht studieren. Die Familie hat ihren Mann ausgesucht.
    meaning:
      en: My cousin wasn't allowed to study. The family chose her husband.
  - speaker: protagonist
    text: Das ist schlimm. Wollte sie das?
    meaning:
      en: That's terrible. Did she want that?
  - speaker: priya
    text: Niemand hat sie gefragt. Und wenn etwas schiefging, gab man ihr die Schuld.
    meaning:
      en: No one asked her. And when something went wrong, she was blamed.
  - speaker: protagonist
    text: Aber sie ist das Opfer, nicht die Schuldige.
    meaning:
      en: But she's the victim, not the guilty one.
  - speaker: priya
    text: 'Hier habe ich gelernt: Die Entscheidung über das eigene Leben ist ein Recht. Selbstbestimmung.'
    meaning:
      en: 'Here I learned: the decision about your own life is a right. Self-determination.'
  - speaker: protagonist
    text: Und Gleichberechtigung steht im Grundgesetz.
    meaning:
      en: And equal rights are in the Basic Law.
  - speaker: priya
    text: 'Wenn eine Freundin hier Hilfe braucht: Es gibt ein Hilfetelefon, anonym und in vielen Sprachen.'
    meaning:
      en: 'If a friend here needs help: there''s a helpline, anonymous and in many languages.'
  - speaker: protagonist
    text: Und Frauenhäuser, falls sie nicht nach Hause kann. Niemand darf sie zwingen.
    meaning:
      en: And women's shelters, if she can't go home. No one may force her.
