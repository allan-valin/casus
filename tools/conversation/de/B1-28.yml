steps:
- type: narrator
  text:
    en: The club tournament in May. You helped all day. In the evening Petra asks how it went. Listen to the conversation; you don't need to understand it yet.
    ar: بطولة النادي في مايو. ساعدت طوال اليوم. في المساء تسألك بيترا كيف جرى الأمر. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Клупскиот турнир во мај. Помагавте цел ден. Навечер Петра прашува како помина. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: petra
    text: Na, wie lief das Turnier?
    meaning:
      en: So, how did the tournament go?
      ar: إذن، كيف جرت البطولة؟
      mk: Па, како помина турнирот?
  - speaker: protagonist
    text: Super! Ich stand den ganzen Tag am Kuchenbuffet. Um drei war alles ausverkauft.
    meaning:
      en: Great! I stood at the cake stall all day. By three everything was sold out.
      ar: رائعة! وقفتُ طوال اليوم عند طاولة الكعك. في الثالثة نفد كل شيء.
      mk: Супер! Цел ден стоев кај колачите. До три сè беше распродадено.
  - speaker: petra
    text: Und das Finale?
    meaning:
      en: And the final?
      ar: والمباراة النهائية؟
      mk: А финалето?
  - speaker: protagonist
    text: Spannend! Es stand eins zu eins. Dann pfiff der Schiedsrichter Elfmeter.
    meaning:
      en: Exciting! It was one-all. Then the referee gave a penalty.
      ar: مثيرة! كانت النتيجة واحد لواحد. ثم صفّر الحَكَم ضربة جزاء.
      mk: Возбудливо! Беше еден спрема еден. Потоа судијата свирна пенал.
  - speaker: petra
    text: Für uns?
    meaning:
      en: For us?
      ar: لصالحنا؟
      mk: За нас?
  - speaker: protagonist
    text: Für uns! Und Ali schoss ihn rein. Bei der Siegerehrung bekamen wir den Pokal.
    meaning:
      en: For us! And Ali scored it. At the award ceremony we got the cup.
      ar: لصالحنا! وسجّلها علي. وفي تتويج الفائزين حصلنا على الكأس.
      mk: За нас! И Али го постигна. На доделувањето награди го добивме пехарот.
  - speaker: petra
    text: Toll! Ohne die Helfer gäbe es kein Turnier. Danke dir.
    meaning:
      en: Brilliant! Without the helpers there'd be no tournament. Thank you.
      ar: رائع! بدون المساعدين ما كانت هناك بطولة. شكرًا لك.
      mk: Одлично! Без помагачите немаше да има турнир. Ти благодарам.
  - speaker: protagonist
    text: Gern. Nächstes Jahr backe ich selbst einen Kuchen!
    meaning:
      en: My pleasure. Next year I'll bake a cake myself!
      ar: بكل سرور. السنة القادمة سأخبز كعكة بنفسي!
      mk: Со задоволство. Следната година самиот ќе испечам колач!
