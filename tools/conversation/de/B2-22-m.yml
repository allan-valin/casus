steps:
- type: narrator
  text:
    mk: 'Гордана е загрижена: потпишала хартија кај новиот шеф, а сега здравствената каса бара пари. Ви раскажува. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: gordana
    text: Der Pflegedienst hat einen neuen Besitzer. Er sagte, ich soll nur zur Kenntnisnahme unterschreiben.
    meaning:
      mk: Службата за нега има нов сопственик. Рече само да потпишам за знаење.
  - speaker: protagonist
    text: Und was stand im Papier?
    meaning:
      mk: А што пишуваше во хартијата?
  - speaker: gordana
    text: Ich weiß es nicht genau. Er sagte, das sei nur eine Formalität.
    meaning:
      mk: Не знам точно. Рече дека тоа е само формалност.
  - speaker: petar
    text: Zeig mal. ... Eine Vertragsänderung! Jetzt bist du nur noch Minijobberin.
    meaning:
      mk: Покажи. ... Измена на договорот! Сега си само на Minijob.
  - speaker: gordana
    text: Und der Lohn kommt verspätet. Und jetzt will die Krankenkasse eine Nachzahlung!
    meaning:
      mk: А платата доаѓа со задоцнување. А сега касата бара доплата!
  - speaker: protagonist
    text: Bei uns hätte man so etwas nie ohne Dolmetscher unterschrieben.
    meaning:
      mk: Кај нас такво нешто никој не би потпишал без преведувач.
  - speaker: petar
    text: Geh zur Beratungsstelle. Und bitte die Krankenkasse um Ratenzahlung.
    meaning:
      mk: Оди во советувалиштето. И замоли ја касата за плаќање на рати.
  - speaker: gordana
    text: Nie wieder ohne zu lesen unterschreiben.
    meaning:
      mk: Никогаш повеќе нема да потпишам без да прочитам.
