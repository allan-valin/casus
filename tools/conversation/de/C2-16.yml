- type: prompt
  review: true
  ask:
    en: 'Say: “the statutes — and “the motion — and “I declare the meeting open — and “the quorum — and “vote on the motion — and “carried, accepted — and “rejected — and “I give the floor to … — and “the
      chair — and “I declare the meeting closed — and “set limits — and “screen time — and “spoil — and “consistent — and “the tantrum — and “(particle) ever, already — and “(particles) that''s just how
      it is — and “(particles) surely — and “the time-out — and “upbringing — and “It''s buzzing there (a great party)”.'
    ar: 'قل: “النظام الأساسي — و“الاقتراح، الطلب — و“أفتتح الجلسة — و“النصاب — و“التصويت على الاقتراح — و“مقبول، أُقرّ — و“مرفوض — و“أعطي الكلمة لـ… — و“الرئاسة — و“أختتم الجلسة — و“يضع حدودًا — و“وقت الشاشة
      — و“يدلّل — و“ثابت على موقفه — و“نوبة العناد — و“(أداة) من قبل — و“(أداتان) هكذا الأمر — و“(أداتان) بالتأكيد — و“فترة التهدئة — و“التربية — و“هناك حفلة صاخبة”.'
