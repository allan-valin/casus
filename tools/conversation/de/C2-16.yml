- type: narrator
  text:
    en: 'Idioms for social repair: «Das kam falsch rüber» (came across wrong), «ins Fettnäpfchen treten» (put your foot in it), «Das war nicht böse gemeint», «Schwamm drüber!» (let''s wipe it away), «Andere
      Länder, andere Sitten».'
    ar: 'تعابير لإصلاح العلاقات: «Das kam falsch rüber» (فُهم خطأً)، «ins Fettnäpfchen treten» (ارتكاب زلّة)، «Das war nicht böse gemeint»، «Schwamm drüber!» (لنمسح الأمر)، «Andere Länder, andere Sitten».'
    mk: 'Идиоми за поправање односи: «Das kam falsch rüber» (излезе погрешно), «ins Fettnäpfchen treten» (направи гаф), «Das war nicht böse gemeint», «Schwamm drüber!» (да избришеме), «Andere Länder, andere
      Sitten».'
