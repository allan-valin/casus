steps:
- type: narrator
  text:
    en: 'Back from holiday, you tell Sabine warmly: ''You''ve put on weight — you look healthy!'' Her face freezes. Tim takes you aside. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'عائدًا من الإجازة تقول لزابينه بودّ: «لقد زاد وزنكِ — تبدين بصحة جيدة!» يتجمّد وجهها. تيم يأخذك جانبًا. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.'
    mk: 'Враќајќи се од одмор, топло ѝ велите на Сабине: „Се здебели — изгледаш здраво!“ Лицето ѝ се вкочанува. Тим ве повлекува настрана. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: tim
    text: Sag mal, was hast du zu Sabine gesagt? Sie ist total beleidigt.
    meaning:
      en: Tell me, what did you say to Sabine? She's really offended.
      ar: قل لي، ماذا قلتَ لزابينه؟ إنها مستاءة جدًا.
      mk: Кажи, што ѝ рече на Сабине? Сосема е навредена.
  - speaker: protagonist
    text: Dass sie zugenommen hat und gesund aussieht. Das war ein Kompliment!
    meaning:
      en: That she'd put on weight and looks healthy. It was a compliment!
      ar: أنّ وزنها زاد وأنها تبدو بصحة جيدة. كان إطراءً!
      mk: Дека се здебелила и изгледа здраво. Тоа беше комплимент!
  - speaker: tim
    text: Bei euch vielleicht. Hier ist Gewicht fast ein Tabu. Das kam völlig falsch rüber.
    meaning:
      en: Maybe where you're from. Here weight is almost a taboo. That came across completely wrong.
      ar: ربما عندكم. هنا الوزن تقريبًا محظور. فُهم ذلك خطأً تمامًا.
      mk: Можеби кај вас. Тука тежината е речиси табу. Тоа излезе сосема погрешно.
  - speaker: protagonist
    text: Oh nein. Da bin ich voll ins Fettnäpfchen getreten.
    meaning:
      en: Oh no. I really put my foot in it.
      ar: يا للأسف. لقد ارتكبتُ زلّة محرجة تمامًا.
      mk: О не. Баш направив гаф.
  - speaker: tim
    text: Geh hin und entschuldige dich. Kurz und ehrlich.
    meaning:
      en: Go and apologise. Short and honest.
      ar: اذهب واعتذر. باختصار وصدق.
      mk: Оди и извини се. Кратко и искрено.
  - speaker: protagonist
    text: Sabine, es tut mir aufrichtig leid. Das war nicht böse gemeint — bei uns ist das ein Kompliment.
    meaning:
      en: Sabine, I'm sincerely sorry. It wasn't meant badly — where I'm from it's a compliment.
      ar: زابينه، أنا آسف بصدق. لم أقصد سوءًا — عندنا هذا إطراء.
      mk: Сабине, искрено ми е жал. Не беше мислено лошо — кај нас тоа е комплимент.
  - speaker: sabine
    text: Ach so! Andere Länder, andere Sitten. Schwamm drüber!
    meaning:
      en: Oh, I see! Other countries, other customs. Let's forget it!
      ar: آه، فهمت! لكل بلد عاداته. لننسَ الأمر!
      mk: А, така! Друга земја, други обичаи. Да заборавиме!
  - speaker: protagonist
    text: Danke. Ab jetzt lobe ich nur noch deine Schuhe.
    meaning:
      en: Thank you. From now on I'll only praise your shoes.
      ar: شكرًا. من الآن سأمدح حذاءكِ فقط.
      mk: Благодарам. Отсега ќе ти ги фалам само чевлите.
