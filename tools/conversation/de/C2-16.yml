- type: narrator
  text:
    en: Comments on weight, age, salary or someone's looks — even kind ones — are taboo with colleagues in Germany. If something comes out wrong, a short, sincere apology plus a word of explanation repairs
      almost everything; Germans respect directness in apologising too.
    ar: التعليقات على الوزن أو العمر أو الراتب أو المظهر — حتى اللطيفة منها — محظورة مع الزملاء في ألمانيا. وإذا خرج شيء خطأً، فاعتذار قصير صادق مع كلمة تفسير يصلح كل شيء تقريبًا؛ والألمان يقدّرون الصراحة
      في الاعتذار أيضًا.
    mk: Коментарите за тежина, возраст, плата или изглед — дури и љубезните — се табу со колегите во Германија. Ако нешто излезе погрешно, кратко, искрено извинување со еден збор објаснување поправа речиси
      сè; Германците ја ценат директноста и во извинувањето.
