steps:
- type: narrator
  text:
    en: Sunday lunch at Svenja's grandfather's. Opa Lehmann speaks broad Saxon — and enjoys testing you. Listen to the conversation; you don't need to understand it yet.
    ar: غداء الأحد عند جدّ سفينيا. الجدّ ليمان يتكلّم السكسونية الثقيلة — ويستمتع باختباركِ. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Неделен ручек кај дедото на Свења. Дедо Леман зборува тежок саксонски — и ужива да ве тестира. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: opa
    text: Nu, nehm Se sich noch ne Bemme! Mir ham genug.
    meaning:
      en: (Saxon) Go on, have another slice of bread! We've got enough.
      ar: (بالسكسونية) هيا، خذي شريحة خبز أخرى! لدينا ما يكفي.
      mk: (саксонски) Ајде, земете уште едно парче леб! Имаме доволно.
  - speaker: protagonist
    text: Eine Bemme? Ach — eine Scheibe Brot! Danke.
    meaning:
      en: A Bemme? Oh — a slice of bread! Thank you.
      ar: «Bemme»؟ آه — شريحة خبز! شكرًا.
      mk: „Bemme“? А — парче леб! Благодарам.
  - speaker: opa
    text: Ei verbibbsch! Se verstehn Sächsisch? Des hätt ich ni gedacht.
    meaning:
      en: (Saxon) Good grief! You understand Saxon? I'd never have thought.
      ar: (بالسكسونية) يا للعجب! تفهمين السكسونية؟ ما كنتُ لأظن ذلك.
      mk: (саксонски) Леле! Разбирате саксонски? Тоа не би го помислил.
  - speaker: svenja
    text: Opa, sie lernt seit Jahren Hochdeutsch. Sprich mal langsam!
    meaning:
      en: Grandpa, she's been learning standard German for years. Speak slowly for once!
      ar: يا جدّي، إنها تتعلّم الفصحى منذ سنوات. تكلّم ببطء ولو مرة!
      mk: Дедо, таа со години учи стандарден германски. Зборувај малку побавно!
  - speaker: protagonist
    text: Nein, es macht Spaß! „Mir“ heißt „wir“, „ni“ heißt „nicht“, oder?
    meaning:
      en: No, it's fun! 'Mir' means 'we', 'ni' means 'not', right?
      ar: لا، هذا ممتع! «mir» تعني «نحن»، و«ni» تعني «لا»، أليس كذلك؟
      mk: Не, забавно е! „Mir“ значи „ние“, „ni“ значи „не“, нели?
  - speaker: opa
    text: Gans genau! Und nach'm Essen gehn mir heeme.
    meaning:
      en: (Saxon) Exactly! And after the meal we go home.
      ar: (بالسكسونية) بالضبط! وبعد الطعام نذهب إلى البيت.
      mk: (саксонски) Точно така! А по јадењето одиме дома.
  - speaker: protagonist
    text: Heeme — nach Hause. Alles weich ausgesprochen. Urgemütlich!
    meaning:
      en: Heeme — home. Everything pronounced softly. Really cosy!
      ar: «heeme» — إلى البيت. كل شيء يُنطق بليونة. دافئ جدًا!
      mk: „Heeme“ — дома. Сè меко изговорено. Многу пријатно!
  - speaker: opa
    text: Sie sin ja ne halbe Sächsin! Da bin ich stolz.
    meaning:
      en: (Saxon) You're half Saxon already! That makes me proud.
      ar: (بالسكسونية) أنتِ نصف سكسونية بالفعل! هذا يجعلني فخورًا.
      mk: (саксонски) Веќе сте полу Саксонка! Горд сум.
- type: prompt
  ask:
    en: 'Say: a slice of bread, the Saxon way.'
    ar: 'قولي: شريحة خبز، على الطريقة السكسونية.'
    mk: 'Кажете: парче леб, на саксонски.'
  answer:
    speaker: protagonist
    text: Eine Bemme.
  items:
  - die-bemme
- type: prompt
  ask:
    en: 'Exclaim in Saxon: good grief!'
    ar: 'اهتفي بالسكسونية: يا للعجب!'
    mk: 'Извикајте на саксонски: леле!'
  answer:
    speaker: protagonist
    text: Ei verbibbsch!
  items:
  - ei-verbibbsch
- type: narrator
  text:
    en: 'Saxon in brief: k, p, t soften to g, b, d («Gaffee», «Bemme»); «mir» = wir, «ni» = nicht, «heeme» = heim; vowels are rounded and soft. Understand it — you don''t have to speak it.'
    ar: 'السكسونية باختصار: k وp وt تلين إلى g وb وd («Gaffee»، «Bemme»)؛ «mir» = wir، «ni» = nicht، «heeme» = heim؛ والحروف الصائتة مدوّرة ليّنة. افهميها — لستِ مضطرة للتكلّم بها.'
    mk: 'Саксонски накратко: k, p, t омекнуваат во g, b, d («Gaffee», «Bemme»); «mir» = wir, «ni» = nicht, «heeme» = heim; самогласките се заоблени и меки. Разберете го — не мора да го зборувате.'
- type: prompt
  ask:
    en: 'Say: ''mir'' means ''we''.'
    ar: 'قولي: «mir» تعني «نحن».'
    mk: 'Кажете: „mir“ значи „ние“.'
  answer:
    speaker: protagonist
    text: „Mir“ heißt „wir“.
  items:
  - mir-wir
- type: prompt
  ask:
