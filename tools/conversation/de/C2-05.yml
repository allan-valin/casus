- type: narrator
  text:
    en: Saxon is often mocked in Germany — Saxons know it and joke about it themselves. Showing interest in someone's dialect is a warm compliment; imitating it to make fun of them is not.
    ar: السكسونية كثيرًا ما يُسخر منها في ألمانيا — والسكسونيون يعرفون ذلك ويمزحون عنه بأنفسهم. وإظهار الاهتمام بلهجة أحدهم مجاملة دافئة؛ أما تقليدها للسخرية منه فلا.
    mk: Саксонскиот често се исмева во Германија — Саксонците го знаат тоа и самите се шегуваат. Интересот за нечиј дијалект е топол комплимент; имитирањето за да се исмева не е.
