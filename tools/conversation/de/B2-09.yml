- type: narrator
  text:
    en: 'Nominalisation turns verbs into nouns: «entfernt sein» → «die Entfernung», «beobachten» → «die Beobachtung», «entstehen» → «die Entstehung». Formal and science texts use them a lot: «die Beobachtung
      der Planeten».'
    ar: 'التسمية تحوّل الأفعال إلى أسماء: «entfernt sein» ← «die Entfernung»، «beobachten» ← «die Beobachtung»، «entstehen» ← «die Entstehung». والنصوص الرسمية والعلمية تكثر منها: «die Beobachtung der Planeten».'
    mk: 'Номинализацијата ги прави глаголите именки: «entfernt sein» → «die Entfernung», «beobachten» → «die Beobachtung», «entstehen» → «die Entstehung». Формалните и научните текстови многу ги користат:
      «die Beobachtung der Planeten».'
