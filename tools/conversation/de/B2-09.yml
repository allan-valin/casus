steps:
- type: narrator
  text:
    en: The VHS course goes to the planetarium. The dome turns dark — Professor Hartmann points to the stars. Listen to the conversation; you don't need to understand it yet.
    ar: دورة الجامعة الشعبية تذهب إلى القبة السماوية. تُظلم القبة — والبروفيسور هارتمان يشير إلى النجوم. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Курсот на народниот универзитет оди во планетариумот. Куполата се затемнува — професорот Хартман покажува кон ѕвездите. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: hartmann
    text: Das ist die Milchstraße. Unsere Sonne ist einer von Milliarden Sternen.
    meaning:
      en: This is the Milky Way. Our sun is one of billions of stars.
      ar: هذا درب التبانة. شمسنا واحدة من مليارات النجوم.
      mk: Ова е Млечниот Пат. Нашето сонце е една од милијарди ѕвезди.
  - speaker: protagonist
    text: Wie groß ist die Entfernung zum nächsten Stern?
    meaning:
      en: How great is the distance to the nearest star?
      ar: كم المسافة إلى أقرب نجم؟
      mk: Колкава е оддалеченоста до најблиската ѕвезда?
  - speaker: hartmann
    text: Gut vier Lichtjahre. Das Licht ist über vier Jahre unterwegs.
    meaning:
      en: A good four light years. The light travels for over four years.
      ar: أكثر من أربع سنوات ضوئية. الضوء يسافر أكثر من أربع سنوات.
      mk: Добри четири светлосни години. Светлината патува повеќе од четири години.
  - speaker: protagonist
    text: Und die Erde dreht sich auf ihrer Umlaufbahn um die Sonne.
    meaning:
      en: And the earth turns in its orbit around the sun.
      ar: والأرض تدور في مدارها حول الشمس.
      mk: А Земјата се врти по својата орбита околу сонцето.
  - speaker: hartmann
    text: Ja. Die Beobachtung der Planeten war der Anfang der modernen Wissenschaft.
    meaning:
      en: Yes. Observing the planets was the beginning of modern science.
      ar: نعم. رصد الكواكب كان بداية العلم الحديث.
      mk: Да. Набљудувањето на планетите беше почетокот на модерната наука.
  - speaker: protagonist
    text: Und die Entstehung des Weltalls?
    meaning:
      en: And the origin of the universe?
      ar: ونشأة الكون؟
      mk: А настанувањето на вселената?
  - speaker: hartmann
    text: Vor fast vierzehn Milliarden Jahren. Mit dem Teleskop sehen wir weit in die Vergangenheit.
    meaning:
      en: Almost fourteen billion years ago. With the telescope we see far into the past.
      ar: قبل نحو أربعة عشر مليار عام. بالتلسكوب نرى بعيدًا في الماضي.
      mk: Пред речиси четиринаесет милијарди години. Со телескопот гледаме далеку во минатото.
  - speaker: protagonist
    text: Da fühlt man sich winzig.
    meaning:
      en: It makes you feel tiny.
      ar: يشعر المرء هنا بأنه ضئيل.
      mk: Човек тука се чувствува мајушен.
- type: prompt
  ask:
