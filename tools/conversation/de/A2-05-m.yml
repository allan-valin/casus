steps:
- type: narrator
  text:
    mk: Ве боли забот. Ања се јавува во стоматолошката ординација и прашува што покрива вашето осигурување. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: kasse
    text: Zahnarztpraxis, guten Tag. Was kann ich für Sie tun?
    meaning:
      mk: Стоматолошка ординација, добар ден. Што можам да направам за вас?
  - speaker: anja
    text: Meine Schwiegermutter hat Zahnschmerzen. Sie ist aus Mazedonien zu Besuch.
    meaning:
      mk: Мојата свекрва има забоболка. На гости е од Македонија.
  - speaker: kasse
    text: Welche Versicherung hat sie?
    meaning:
      mk: Какво осигурување има?
  - speaker: protagonist
    text: Die europäische Karte und eine Reiseversicherung.
    meaning:
      mk: Европската картичка и патно осигурување.
  - speaker: kasse
    text: Die europäische Karte bezahlt nur im Notfall.
    meaning:
      mk: Европската картичка плаќа само во итен случај.
  - speaker: anja
    text: Zahnschmerzen sind ein Notfall!
    meaning:
      mk: Забоболката е итен случај!
  - speaker: kasse
    text: Dann kommen Sie heute. Bringen Sie die Karte mit.
    meaning:
      mk: Тогаш дојдете денес. Донесете ја картичката.
  - speaker: protagonist
    text: Und die Rechnung?
    meaning:
      mk: А сметката?
  - speaker: kasse
    text: Die bezahlen Sie vielleicht zuerst. Die Reiseversicherung hilft Ihnen, das Geld zurückzuholen.
    meaning:
      mk: Можеби прво ќе ја платите. Патното осигурување ќе ви помогне да ги вратите парите.
