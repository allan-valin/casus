steps:
- type: narrator
  text:
    ar: اليوم الأول في دورة الاندماج (Integrationskurs). يارا في الحضانة، وأنتِ في الصف. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
- type: dialogue
  lines:
  - speaker: lehrerin
    text: Guten Morgen! Willkommen im Integrationskurs.
    meaning:
      ar: صباح الخير! أهلًا بكِ في دورة الاندماج.
  - speaker: protagonist
    text: Guten Morgen. Bin ich hier richtig? Kurs A1?
    meaning:
      ar: صباح الخير. هل أنا في المكان الصحيح؟ دورة A1؟
  - speaker: lehrerin
    text: Ja, richtig. Schreiben Sie bitte Ihren Namen hier.
    meaning:
      ar: نعم، صحيح. اكتبي اسمكِ هنا من فضلك.
  - speaker: protagonist
    text: Muss ich jeden Tag kommen?
    meaning:
      ar: هل يجب أن آتي كل يوم؟
  - speaker: lehrerin
    text: Ja, Sie müssen jeden Tag kommen. Von Montag bis Freitag, vier Stunden.
    meaning:
      ar: نعم، يجب أن تأتي كل يوم. من الاثنين إلى الجمعة، أربع ساعات.
  - speaker: protagonist
    text: Vier Stunden! Und die Kita?
    meaning:
      ar: أربع ساعات! والحضانة؟
  - speaker: lehrerin
    text: Der Kurs ist von acht bis zwölf. Die Kita ist länger offen.
    meaning:
      ar: الدورة من الثامنة إلى الثانية عشرة. والحضانة مفتوحة لوقت أطول.
  - speaker: protagonist
    text: Gut. Muss ich etwas bezahlen?
    meaning:
      ar: جيد. هل يجب أن أدفع شيئًا؟
  - speaker: lehrerin
    text: Das klären wir mit dem Amt.
    meaning:
      ar: هذا نوضّحه مع الدائرة الرسمية.
  - speaker: protagonist
    text: Danke. Ich muss viel lernen!
    meaning:
      ar: شكرًا. يجب أن أتعلّم كثيرًا!
