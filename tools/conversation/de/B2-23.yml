steps:
- type: narrator
  text:
    en: The Leipzig Book Fair. In the queue for coffee, a stranger starts talking. Small talk — German style. Listen to the conversation; you don't need to understand it yet.
    ar: معرض لايبزيغ للكتاب. في طابور القهوة يبدأ غريب الحديث. دردشة — على الطريقة الألمانية. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Саемот на книгата во Лајпциг. Во редот за кафе, непознат почнува разговор. Мал разговор — на германски начин. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: fahrer
    text: Ganz schön voll heute, oder?
    meaning:
      en: Pretty crowded today, isn't it?
      ar: مزدحم جدًا اليوم، أليس كذلك؟
      mk: Прилично полно денес, нели?
  - speaker: protagonist
    text: Ja! Die Schlange ist so lang wie das Buch, das ich kaufen will.
    meaning:
      en: Yes! The queue is as long as the book I want to buy.
      ar: نعم! الطابور طويل مثل الكتاب الذي أريد شراءه.
      mk: Да! Редицата е долга како книгата што сакам да ја купам.
  - speaker: fahrer
    text: Ha! Sind Sie beruflich oder privat hier?
    meaning:
      en: Ha! Are you here for work or for pleasure?
      ar: ها! هل أنتِ هنا للعمل أم للمتعة؟
      mk: Ха! Тука сте службено или приватно?
  - speaker: protagonist
    text: Privat. Ich will zur Lesung um drei. Die Autorin ist toll, ne?
    meaning:
      en: For pleasure. I want to go to the reading at three. The author is great, right?
      ar: للمتعة. أريد حضور القراءة في الثالثة. الكاتبة رائعة، صح؟
      mk: Приватно. Сакам да одам на читањето во три. Авторката е одлична, а?
  - speaker: fahrer
    text: Sehr! Sie kommen nicht aus Leipzig, oder?
    meaning:
      en: Very! You're not from Leipzig, are you?
      ar: جدًا! أنتِ لستِ من لايبزيغ، أليس كذلك؟
      mk: Многу! Вие не сте од Лајпциг, нели?
  - speaker: protagonist
    text: Nein, aber ich wohne hier. Und Sie? Sie klingen wie aus Bayern, gell?
    meaning:
      en: No, but I live here. And you? You sound like you're from Bavaria, right?
      ar: لا، لكنني أسكن هنا. وأنت؟ تبدو من بافاريا، صح؟
      mk: Не, но живеам тука. А вие? Звучите како од Баварија, нели?
  - speaker: fahrer
    text: Erwischt! ... Oh, ich bin dran. Schönen Tag noch!
    meaning:
      en: Caught out! ... Oh, it's my turn. Have a nice day!
      ar: كشفتِني! ... آه، جاء دوري. يومًا سعيدًا!
      mk: Ме фативте! ... О, јас сум на ред. Убав ден уште!
  - speaker: protagonist
    text: Ihnen auch! Viel Spaß auf der Messe.
    meaning:
      en: You too! Enjoy the fair.
      ar: ولك أيضًا! استمتع بالمعرض.
      mk: И вам! Уживајте на саемот.
- type: prompt
  ask:
    en: 'Say: the book fair.'
    ar: 'قولي: معرض الكتاب.'
    mk: 'Кажете: саемот на книгата.'
  answer:
    speaker: protagonist
    text: Die Buchmesse.
  items:
  - die-buchmesse
- type: prompt
  ask:
    en: 'He says: pretty crowded today.'
    ar: 'يقول: مزدحم جدًا اليوم.'
    mk: 'Тој вели: прилично полно денес.'
  answer:
    speaker: protagonist
    text: Ganz schön voll heute.
  items:
  - voll-heute
- type: narrator
  text:
    en: 'Question tags invite agreement: «…, oder?» (everywhere), «…, ne?» (north and centre, casual), «…, gell?» (south). They make a statement friendly: «Die Autorin ist toll, ne?».'
    ar: 'أدوات التذييل تدعو إلى الموافقة: «…, oder?» (في كل مكان)، «…, ne?» (الشمال والوسط، عاميًا)، «…, gell?» (الجنوب). تجعل الجملة ودّية: «Die Autorin ist toll, ne?».'
    mk: 'Прашалните додатоци бараат согласност: «…, oder?» (насекаде), «…, ne?» (север и центар, разговорно), «…, gell?» (југ). Ја прават изјавата пријателска: «Die Autorin ist toll, ne?».'
