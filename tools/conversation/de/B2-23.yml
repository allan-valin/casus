- type: narrator
  text:
    en: 'Small talk with strangers is short and light: the weather, the queue, the event — not salary, religion or politics. It ends without fuss: «Schönen Tag noch!». At fairs and conferences it''s the
      normal way to start; follow-up comes with a business card.'
    ar: 'الدردشة مع الغرباء قصيرة وخفيفة: الطقس، الطابور، الحدث — لا الراتب ولا الدين ولا السياسة. وتنتهي ببساطة: «Schönen Tag noch!». في المعارض والمؤتمرات هي الطريقة المعتادة للبدء؛ والمتابعة تأتي ببطاقة
      العمل.'
    mk: 'Малиот разговор со непознати е краток и лесен: времето, редицата, настанот — не плата, религија или политика. Завршува без церемонии: «Schönen Tag noch!». На саеми и конференции тоа е нормалниот
      почеток; продолжението доаѓа со визит-карта.'
