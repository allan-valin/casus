- type: narrator
  text:
    en: 'Leipzig: Bach was cantor at St Thomas for 27 years; the Monday demonstrations of autumn 1989 started at St Nicholas Church and helped bring down the GDR without violence. When family visits, you
      become the interpreter of two cultures — dinner times, table manners, how long a visit lasts.'
    ar: 'لايبزيغ: كان باخ قائد جوقة كنيسة القديس توما 27 عامًا؛ ومظاهرات الاثنين في خريف 1989 بدأت من كنيسة القديس نيكولاي وساعدت على إسقاط ألمانيا الشرقية دون عنف. وحين تزوركِ العائلة تصبحين مترجمة بين
      ثقافتين — مواعيد الطعام، وآداب المائدة، ومدة الزيارة.'
    mk: 'Лајпциг: Бах бил кантор во Св. Тома 27 години; понеделничните демонстрации есента 1989 почнале од Црквата Св. Никола и помогнале ГДР да падне без насилство. Кога ве посетува семејството, станувате
      преведувач меѓу две култури — време за вечера, манири на маса, колку трае посетата.'
