steps:
- type: narrator
  text:
    en: Your sister and her husband are back for a week. You show them Leipzig — and at dinner with Jonas and Svenja, two cultures share one table. Listen to the conversation; you don't need to understand
      it yet.
    ar: أختكِ وزوجها عادا لأسبوع. تُرينهما لايبزيغ — وعلى العشاء مع يوناس وسفينيا، تجتمع ثقافتان على طاولة واحدة. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Сестра ви и нејзиниот сопруг пак се тука за една недела. Им го покажувате Лајпциг — а на вечера со Јонас и Свења, две култури на една маса. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: schwester
    text: Und hier hat Bach gearbeitet? In der Thomaskirche?
    meaning:
      en: And Bach worked here? In St Thomas Church?
      ar: وهنا عمل باخ؟ في كنيسة القديس توما؟
      mk: И тука работел Бах? Во Црквата Св. Тома?
  - speaker: protagonist
    text: Ja! Und 1989 begann hier die Friedliche Revolution — mit Kerzen, nicht mit Waffen.
    meaning:
      en: Yes! And in 1989 the Peaceful Revolution started here — with candles, not weapons.
      ar: نعم! وفي 1989 بدأت هنا الثورة السلمية — بالشموع لا بالسلاح.
      mk: Да! А во 1989 тука почна Мирната револуција — со свеќи, не со оружје.
  - speaker: schwager
    text: Das wusste ich überhaupt nicht.
    meaning:
      en: I didn't know that at all.
      ar: لم أكن أعرف ذلك أصلًا.
      mk: Тоа воопшто не го знаев.
  - speaker: svenja
    text: Setzt euch! Ich hole eben mal das Essen.
    meaning:
      en: Sit down! I'll just get the food.
      ar: اجلسوا! سأحضر الطعام بسرعة.
      mk: Седнете! Набрзина ќе ја донесам храната.
  - speaker: schwester
    text: Warum isst man hier um sechs? Bei uns isst man um neun!
    meaning:
      en: Why do people eat at six here? With us people eat at nine!
      ar: لماذا يأكلون هنا في السادسة؟ عندنا نأكل في التاسعة!
      mk: Зошто тука се јаде во шест? Кај нас се јаде во девет!
  - speaker: jonas
    text: Na ja, wir stehen eben früh auf. Was ist bei euch noch anders?
    meaning:
      en: Well, we get up early, that's all. What else is different with you?
      ar: حسنًا، نحن نستيقظ باكرًا فقط. ما الذي يختلف عندكم أيضًا؟
      mk: Па, ние едноставно рано стануваме. Што уште е различно кај вас?
  - speaker: protagonist
    text: 'Ich übersetze: Sie sagt, bei uns bleibt niemand unter drei Stunden am Tisch.'
    meaning:
      en: 'I''ll translate: she says with us no one leaves the table in under three hours.'
      ar: 'سأترجم: تقول إنه عندنا لا يقوم أحد عن الطاولة قبل ثلاث ساعات.'
      mk: 'Ќе преведам: вели дека кај нас никој не станува од маса за помалку од три часа.'
  - speaker: svenja
    text: 'Dann machen wir heute beide Kulturen: um sechs anfangen, um neun aufhören!'
    meaning:
      en: 'Then tonight we''ll do both cultures: start at six, stop at nine!'
      ar: 'إذن نجمع الليلة الثقافتين: نبدأ في السادسة وننتهي في التاسعة!'
      mk: 'Тогаш вечерва правиме двете култури: почнуваме во шест, завршуваме во девет!'
- type: prompt
  ask:
    en: 'Say: the city tour.'
    ar: 'قولي: الجولة في المدينة.'
    mk: 'Кажете: обиколката на градот.'
  answer:
    speaker: protagonist
