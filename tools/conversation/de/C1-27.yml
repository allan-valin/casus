- type: narrator
  text:
    en: 'Particles again: «überhaupt» (at all — strengthens a negative), «eben mal» (just quickly), «na ja» (well… — hesitating), «eben» (that''s just how it is).'
    ar: 'أدوات مرة أخرى: «überhaupt» (أصلًا — تقوّي النفي)، «eben mal» (بسرعة فقط)، «na ja» (حسنًا… — تردّد)، «eben» (هكذا الأمر فقط).'
    mk: 'Пак честички: «überhaupt» (воопшто — ја засилува негацијата), «eben mal» (набрзина), «na ja» (па… — двоумење), «eben» (така е едноставно).'
- type: prompt
  ask:
