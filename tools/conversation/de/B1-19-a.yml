steps:
- type: narrator
  text:
    ar: رنا، صديقتكِ السورية، جاءت لاجئة. في حفلة المدينة تقف عند كشك الفلافل الذي فتحته وتحكي لكِ. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Rana! Dein Falafelstand ist voll!
    meaning:
      ar: رنا! كشك الفلافل عندكِ ممتلئ!
  - speaker: rana
    text: Endlich! Als ich ankam, wohnte ich zwei Jahre in einer Unterkunft.
    meaning:
      ar: أخيرًا! حين وصلتُ سكنتُ عامين في مسكن للاجئين.
  - speaker: protagonist
    text: Zwei Jahre! Und Deutsch?
    meaning:
      ar: عامين! والألمانية؟
  - speaker: rana
    text: Vor der Anerkennung gab es keinen Deutschkurs. Ich lernte mit dem Handy.
    meaning:
      ar: قبل الاعتراف لم تكن هناك دورة ألمانية. تعلّمتُ بالهاتف.
  - speaker: protagonist
    text: Und die Nachbarn?
    meaning:
      ar: والجيران؟
  - speaker: rana
    text: Am Anfang brachten sie Geschenke. Nach Weihnachten grüßten viele nicht mehr.
    meaning:
      ar: في البداية أحضروا هدايا. بعد عيد الميلاد كثيرون لم يعودوا يحيّون.
  - speaker: protagonist
    text: Das tut mir leid. Und jetzt?
    meaning:
      ar: يؤسفني ذلك. والآن؟
  - speaker: rana
    text: Jetzt zog ich in eine Wohnung um und machte den Stand auf. Und im Rathaus gibt es einen Gebetsraum!
    meaning:
      ar: الآن انتقلتُ إلى شقة وفتحتُ الكشك. وفي البلدية يوجد مصلّى!
