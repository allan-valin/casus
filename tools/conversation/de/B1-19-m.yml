steps:
- type: narrator
  text:
    mk: Во зградата на Петар живее Гордана од Гостивар. Ви раскажува како дошла нејзината фамилија. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Gordana, wie kamt ihr nach Deutschland?
    meaning:
      mk: Гордана, како дојдовте во Германија?
  - speaker: gordana
    text: Mein Mann kam zuerst an, vor zehn Jahren. Mit einem Arbeitsvertrag.
    meaning:
      mk: Мојот маж прв пристигна, пред десет години. Со договор за работа.
  - speaker: protagonist
    text: Mit der Westbalkanregelung?
    meaning:
      mk: Со правилото за Западен Балкан?
  - speaker: gordana
    text: 'Ja. Er fing auf dem Bau an. Dann rief er mich an: komm!'
    meaning:
      mk: 'Да. Почна на градежништво. Потоа ми се јави: дојди!'
  - speaker: protagonist
    text: Und viele Nachbarn haben bulgarische Pässe, oder?
    meaning:
      mk: А многу соседи имаат бугарски пасоши, нели?
  - speaker: gordana
    text: Ja, viele von uns. Mit dem Pass sind wir EU-Bürger und brauchen kein Visum.
    meaning:
      mk: Да, многумина од нас. Со пасошот сме граѓани на ЕУ и не ни треба виза.
  - speaker: protagonist
    text: Wie wir. Und unser Sohn zog wegen der Arbeit hierher um.
    meaning:
      mk: Како нас. А нашиот син се пресели тука поради работата.
  - speaker: gordana
    text: Und ich arbeite beim Pflegedienst. Es gibt viele Wege hierher.
    meaning:
      mk: А јас работам во службата за нега. Има многу патишта до тука.
