steps:
- type: narrator
  text:
    en: MDR television reports on the club's youth team, which you coach. The camera's running — and the reporter wants a statement. Listen to the conversation; you don't need to understand it yet.
    ar: تلفزيون MDR يغطّي فريق الناشئين في النادي الذي تدرّبينه. الكاميرا تعمل — والمراسلة تريد تصريحًا. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Телевизијата MDR известува за младинската екипа на клубот што ја тренирате. Камерата снима — а репортерката сака изјава. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: reporterin
    text: Kamera läuft. Was bedeutet der Verein für die Kinder hier?
    meaning:
      en: Camera's rolling. What does the club mean for the children here?
      ar: الكاميرا تعمل. ماذا يعني النادي للأطفال هنا؟
      mk: Камерата снима. Што значи клубот за децата тука?
  - speaker: protagonist
    text: Na ja, die Kids haben halt mega Spaß und so...
    meaning:
      en: Well, the kids have loads of fun, like...
      ar: يعني، الأطفال يستمتعون جدًا وكذا...
      mk: Па, децата баш се забавуваат и така...
  - speaker: reporterin
    text: Könnten Sie das etwas formeller sagen? Für die Nachrichten.
    meaning:
      en: Could you say that a bit more formally? For the news.
      ar: هل يمكنكِ قول ذلك بشكل أكثر رسمية؟ للأخبار.
      mk: Може ли тоа малку поформално? За вестите.
  - speaker: protagonist
    text: 'Gern. Im Namen des Vereins: Es freut uns sehr, dass Kinder aus zwölf Nationen bei uns gemeinsam trainieren.'
    meaning:
      en: 'Gladly. On behalf of the club: we''re very pleased that children from twelve nations train together with us.'
      ar: 'بكل سرور. باسم النادي: يسعدنا كثيرًا أنّ أطفالًا من اثنتي عشرة جنسية يتدرّبون معًا لدينا.'
      mk: 'Со задоволство. Во име на клубот: многу нè радува што деца од дванаесет нации тренираат заедно кај нас.'
  - speaker: protagonist
    text: Ich möchte darauf hinweisen, dass Integration durch Sport ohne Ehrenamtliche nicht möglich wäre.
    meaning:
      en: I'd like to point out that integration through sport wouldn't be possible without volunteers.
      ar: أودّ أن أشير إلى أنّ الاندماج عبر الرياضة لم يكن ممكنًا دون المتطوّعين.
      mk: Би сакала да укажам дека интеграцијата преку спорт не би била можна без доброволците.
  - speaker: reporterin
    text: Und was wünschen Sie sich?
    meaning:
      en: And what would you like to see?
      ar: وماذا تتمنّين؟
      mk: А што посакувате?
  - speaker: protagonist
    text: 'Abschließend: mehr Förderung durch die Stadt — vor allem für neue Trainingszeiten in der Halle.'
    meaning:
      en: 'In conclusion: more support from the city — above all for new training slots in the hall.'
      ar: 'ختامًا: دعم أكبر من المدينة — خاصةً لمواعيد تدريب جديدة في القاعة.'
      mk: 'Заклучно: повеќе поддршка од градот — пред сè за нови термини за тренинг во салата.'
  - speaker: reporterin
    text: Perfekt. Danke! Sie waren gar nicht nervös.
    meaning:
      en: Perfect. Thank you! You weren't nervous at all.
      ar: ممتاز. شكرًا! لم تكوني متوتّرة إطلاقًا.
      mk: Совршено. Благодарам! Воопшто не бевте нервозна.
- type: prompt
  ask:
    en: 'Say: the interview.'
    ar: 'قولي: المقابلة.'
    mk: 'Кажете: интервјуто.'
  answer:
    speaker: protagonist
    text: Das Interview.
  items:
  - das-interview
