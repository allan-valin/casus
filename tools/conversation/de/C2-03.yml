- type: narrator
  text:
    en: On camera, speak in short complete sentences that work without the question (they'll be cut), name who you speak for, make one clear point and one concrete wish. Youth slang like «mega» and «Kids»
      is fine with friends, not in a statement.
    ar: أمام الكاميرا تكلّمي بجمل قصيرة كاملة تفهم دون السؤال (سيُقصّ)، وسمّي من تتحدّثين باسمه، وقدّمي فكرة واضحة واحدة وأمنية محدّدة واحدة. وعامية الشباب مثل «mega» و«Kids» مقبولة مع الأصدقاء لا في تصريح.
    mk: Пред камера зборувајте во кратки целосни реченици што се разбираат без прашањето (ќе го исечат), кажете во чие име зборувате, една јасна поента и една конкретна желба. Младешкиот сленг како «mega»
      и «Kids» е во ред со пријатели, не во изјава.
