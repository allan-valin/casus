- type: narrator
  text:
    en: Now some things from earlier units, in this new situation.
    ar: والآن بعض ما تعلمتِه في الوحدات السابقة، في هذا الموقف الجديد.
    mk: Сега нешто од претходните лекции, во оваа нова ситуација.
- type: prompt
  review: true
  ask:
    en: 'Say: “Not bad (= very good) — and “understatement — and “That''s one way (= doubtful) — and “quite interesting (= not convinced) — and “You really made an effort (ironic or sincere) — and “the
      highest praise — and “between the lines — and “how it''s meant — and “the tone of voice — and “Well, all right (= reluctant) — and “looking back — and “the change — and “grateful — and “familiar —
      and “foreign parts, being abroad — and “adopted home — and “to the next five years — and “criticism — and “the level, stage — and “Do you remember …? — and “the (formal) appeal”.'
    ar: 'قولي: “ليس سيئًا (= ممتاز) — و“التهوين — و“يمكن ذلك (= بتشكّك) — و“مثير للاهتمام نوعًا ما (= غير مقتنع) — و“لقد بذلتَ جهدًا حقًا (ساخرًا أو صادقًا) — و“أعلى مديح — و“ما بين السطور — و“ما المقصود
      — و“نبرة الصوت — و“حسنًا، لا بأس (= على مضض) — و“بالنظر إلى الماضي — و“التغيير — و“ممتنّ — و“مألوف — و“الغربة — و“الوطن المختار — و“نخب السنوات الخمس القادمة — و“النقد — و“المستوى، المرحلة — و“أتذكر
      …؟ — و“الاعتراض الرسمي”.'
    mk: 'Кажете: „Не е лошо (= многу добро)“ — и „потценувањето“ — и „Може и така (= со сомнеж)“ — и „прилично интересно (= не е убеден)“ — и „Баш си се потрудил (иронично или искрено)“ — и „најголемата
      пофалба“ — и „меѓу редовите“ — и „како е мислено“ — и „тонот на гласот“ — и „Па, добро (= неволно)“ — и „гледајќи наназад“ — и „промената“ — и „благодарен“ — и „блиско, познато“ — и „туѓината“ — и
      „избраната татковина“ — и „за следните пет години“ — и „критиката“ — и „нивото, степенот“ — и „Се сеќаваш ли …?“ — и „жалбата“.'
