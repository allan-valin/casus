- type: narrator
  text:
    en: Many Germans prefer guests to stay in a hotel for longer visits; hosting family at home is a sign of closeness everywhere, but neighbours expect to be invited with notice.
    ar: كثير من الألمان يفضّلون أن ينزل الضيوف في فندق في الزيارات الطويلة؛ واستضافة العائلة في البيت علامة قرب في كل مكان، لكن الجيران ينتظرون دعوة مسبقة.
    mk: Многу Германци за подолги посети претпочитаат гостите да спијат во хотел; угостувањето на семејството дома е знак на блискост насекаде, но соседите очекуваат покана однапред.
