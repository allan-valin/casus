steps:
- type: narrator
  text:
    en: Your sister and her husband visit for a week. You show them Leipzig — and what's different. Listen to the conversation; you don't need to understand it yet.
    ar: أختكِ وزوجها يزورونكِ أسبوعًا. تُرينهم لايبزيغ — وما المختلف فيها. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Сестра ви и нејзиниот сопруг доаѓаат на една недела. Им го покажувате Лајпциг — и што е различно. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Willkommen! Ihr schlaft bei mir, nicht im Hotel.
    meaning:
      en: Welcome! You're sleeping at my place, not in a hotel.
      ar: أهلًا وسهلًا! ستنامون عندي، لا في فندق.
      mk: Добредојдовте! Ќе спиете кај мене, не во хотел.
  - speaker: schwester
    text: Aber du hast kein Gästezimmer!
    meaning:
      en: But you don't have a guest room!
      ar: لكن ليس عندكِ غرفة ضيوف!
      mk: Но немаш гостинска соба!
  - speaker: protagonist
    text: Ich habe ein Schlafsofa. Bei uns schläft Familie nie im Hotel.
    meaning:
      en: I have a sofa bed. In our family, family never sleeps in a hotel.
      ar: عندي أريكة سرير. عندنا العائلة لا تنام في فندق أبدًا.
      mk: Имам кауч за спиење. Кај нас семејството никогаш не спие во хотел.
  - speaker: schwester
    text: Was zeigst du uns?
    meaning:
      en: What are you going to show us?
      ar: ماذا ستُريننا؟
      mk: Што ќе ни покажеш?
  - speaker: protagonist
    text: Sowohl die Altstadt als auch den Zoo. Und entweder das Völkerschlachtdenkmal oder die Seen.
    meaning:
      en: Both the old town and the zoo. And either the monument or the lakes.
      ar: كلًّا من المدينة القديمة وحديقة الحيوان. وإما النصب أو البحيرات.
      mk: И стариот град и зоолошката. И или споменикот или езерата.
  - speaker: schwager
    text: Und die Nachbarn? Kommen sie zum Essen?
    meaning:
      en: And the neighbours? Are they coming to eat?
      ar: والجيران؟ هل يأتون للطعام؟
      mk: А соседите? Ќе дојдат на јадење?
  - speaker: protagonist
    text: Hier lädt man weder spontan ein, noch kommt man ohne Termin.
    meaning:
      en: Here you neither invite on the spot nor come without arranging it.
      ar: هنا لا يدعو الناس فجأة ولا يأتون بلا موعد.
      mk: Тука ниту се кани спонтано, ниту се доаѓа без договор.
  - speaker: schwester
    text: Seltsam! Aber eine Woche bei dir ist genug Gastfreundschaft.
    meaning:
      en: Strange! But a week at your place is enough hospitality.
      ar: غريب! لكن أسبوعًا عندكِ ضيافة كافية.
      mk: Чудно! Но една недела кај тебе е доволно гостопримство.
- type: prompt
  ask:
    en: 'Say: you''re sleeping at my place.'
    ar: 'قولي: ستنامون عندي.'
    mk: 'Кажете: ќе спиете кај мене.'
  answer:
    speaker: protagonist
    text: Ihr schlaft bei mir.
  items:
