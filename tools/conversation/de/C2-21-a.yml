steps:
- type: narrator
  text:
    ar: أول زيارة منذ سنوات لعائلتكِ في غازي عنتاب. يارا، العاشرة الآن، تسألكِ بالألمانية — لغتها الأسهل. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
- type: dialogue
  lines:
  - speaker: yara
    text: Mama, warum lachen alle, wenn ich Arabisch spreche?
    meaning:
      ar: ماما، لماذا يضحك الجميع حين أتكلّم العربية؟
  - speaker: protagonist
    text: Weil du einen deutschen Akzent hast, mein Schatz. Das ist lieb gemeint.
    meaning:
      ar: لأنّ لديكِ لكنة ألمانية يا حبيبتي. يقصدون ذلك بلطف.
  - speaker: yara
    text: Ich verstehe nicht alles. Die Cousins sprechen so schnell.
    meaning:
      ar: لا أفهم كل شيء. أبناء العم يتكلّمون بسرعة كبيرة.
  - speaker: protagonist
    text: Mir geht es auch so — manches ist mir fremd geworden. Alles hat sich verändert.
    meaning:
      ar: وأنا كذلك — بعض الأمور صارت غريبة عليّ. كل شيء تغيّر.
  - speaker: yara
    text: Vermisst du Aleppo?
    meaning:
      ar: هل تشتاقين إلى حلب؟
  - speaker: protagonist
    text: Ich habe Sehnsucht nach meinen Erinnerungen. Aber die Familie ist jetzt überall — hier, in Leipzig, in der Diaspora.
    meaning:
      ar: أحنّ إلى ذكرياتي. لكن العائلة الآن في كل مكان — هنا، في لايبزيغ، في الشتات.
  - speaker: yara
    text: Und wo sind wir zu Hause?
    meaning:
      ar: وأين بيتنا؟
  - speaker: protagonist
    text: Wir sind doppelt zu Hause. Auch wenn wir manchmal zwischen den Stühlen sitzen.
    meaning:
      ar: نحن في البيت مرتين. حتى لو وقفنا أحيانًا بين عالمين.
