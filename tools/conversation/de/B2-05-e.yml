steps:
- type: narrator
  text:
    en: Your master's is nearly done. At the Ausländerbehörde, Herr Schulz explains how to stay and look for work. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Mein Studium endet im März. Darf ich danach bleiben?
    meaning:
      en: My studies end in March. May I stay afterwards?
  - speaker: schulz
    text: Ja. Nach dem Studienabschluss gibt es eine Aufenthaltserlaubnis zur Arbeitssuche.
    meaning:
      en: Yes. After graduating there's a residence permit for job-seeking.
  - speaker: protagonist
    text: Wie lange gilt die?
    meaning:
      en: How long is it valid?
  - speaker: schulz
    text: Mehrere Monate. Die genaue Dauer steht auf unserer Webseite. Stellen Sie den Antrag rechtzeitig.
    meaning:
      en: Several months. The exact length is on our website. Submit the application in good time.
  - speaker: protagonist
    text: Und wenn ich eine Stelle finde?
    meaning:
      en: And if I find a job?
  - speaker: schulz
    text: 'Dann wechseln Sie: zur Blauen Karte oder zur Erlaubnis als Fachkraft.'
    meaning:
      en: 'Then you switch: to the Blue Card or to the permit as a skilled worker.'
  - speaker: mia
    text: Und? Was hat er gesagt?
    meaning:
      en: So? What did he say?
  - speaker: protagonist
    text: Er sagt, es sei möglich. Ich müsse nur rechtzeitig den Antrag stellen.
    meaning:
      en: He says it's possible. I only have to apply in good time.
