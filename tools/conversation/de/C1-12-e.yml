steps:
- type: narrator
  text:
    en: 'Tim''s son is in year four. Next year: Gymnasium or Oberschule? Tim is worried — and explains the system to you. Listen to the conversation; you don''t need to understand it yet.'
- type: dialogue
  lines:
  - speaker: tim
    text: Mein Sohn ist in der vierten Klasse. Morgen ist das Elterngespräch.
    meaning:
      en: My son is in year four. Tomorrow is the parent–teacher meeting.
  - speaker: protagonist
    text: Mit zehn schon? Worum geht es?
    meaning:
      en: At ten already? What's it about?
  - speaker: tim
    text: 'Um die von der Schule ausgestellte Bildungsempfehlung: Gymnasium oder Oberschule.'
    meaning:
      en: 'About the school recommendation issued by the school: Gymnasium or Oberschule.'
  - speaker: protagonist
    text: Und wovon hängt das ab?
    meaning:
      en: And what does it depend on?
  - speaker: tim
    text: Vom Notendurchschnitt in Deutsch, Mathe und Sachkunde. Der Druck ist enorm.
    meaning:
      en: On the grade average in German, maths and general studies. The pressure is enormous.
  - speaker: protagonist
    text: Bei uns entscheidet man das viel später.
    meaning:
      en: Where I'm from that's decided much later.
  - speaker: tim
    text: 'Ich weiß. Aber es gibt Durchlässigkeit: Man kann später wechseln oder das Abitur nachholen.'
    meaning:
      en: 'I know. But you can switch: you can change school later or do the Abitur afterwards.'
  - speaker: protagonist
    text: Dann ist die heute getroffene Entscheidung nicht für immer.
    meaning:
      en: Then the decision made today isn't for ever.
