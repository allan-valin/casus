steps:
- type: narrator
  text:
    en: Saturday night, the cloakroom of a club where you work. Your colleague Priya is a trained nurse — she's waiting for her licence. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: priya
    text: Jacke? Nummer zweiundvierzig. ... In Indien war ich Pflegefachkraft. Hier hänge ich Jacken auf.
    meaning:
      en: Jacket? Number forty-two. ... In India I was a nurse. Here I hang up jackets.
  - speaker: protagonist
    text: Warum arbeitest du nicht als Krankenschwester?
    meaning:
      en: Why aren't you working as a nurse?
  - speaker: priya
    text: Ich brauche eine Berufserlaubnis. Das Anerkennungsverfahren läuft seit einem Jahr.
    meaning:
      en: I need a licence to practise. The recognition procedure has been running for a year.
  - speaker: protagonist
    text: Ein Jahr! Was wurde verlangt?
    meaning:
      en: A year! What was required?
  - speaker: priya
    text: Beglaubigte Unterlagen, Übersetzungen, Deutsch B2. Mein Abschluss wurde nur teilweise anerkannt.
    meaning:
      en: Certified documents, translations, German B2. My degree was only partly recognised.
  - speaker: protagonist
    text: Und jetzt?
    meaning:
      en: And now?
  - speaker: priya
    text: 'Jetzt mache ich eine Kenntnisprüfung. Bis dahin: Garderobe. Ich bin überqualifiziert, aber es zahlt die Miete.'
    meaning:
      en: 'Now I''m taking a knowledge exam. Until then: the cloakroom. I''m overqualified, but it pays the rent.'
  - speaker: protagonist
    text: Die Krankenhäuser suchen doch Leute!
    meaning:
      en: But the hospitals are looking for people!
  - speaker: priya
    text: Eben. Und ich stehe hier. Nummer dreiundvierzig!
    meaning:
      en: Exactly. And here I stand. Number forty-three!
