steps:
- type: narrator
  text:
    ar: بعد الحضانة، يارا على الأرجوحة. أمٌّ أخرى تبدأ الحديث معكِ. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
- type: dialogue
  lines:
  - speaker: lena
    text: Hallo! Wie alt ist sie?
    meaning:
      ar: مرحبًا! كم عمرها؟
  - speaker: protagonist
    text: Hallo. Yara ist vier Jahre alt.
    meaning:
      ar: مرحبًا. يارا عمرها أربع سنوات.
  - speaker: lena
    text: Mein Sohn auch! In welche Kita geht sie?
    meaning:
      ar: ابني أيضًا! إلى أيّ حضانة تذهب؟
  - speaker: protagonist
    text: In die Kita Sonnenschein.
    meaning:
      ar: إلى حضانة زونِنشاين.
  - speaker: lena
    text: Ah, die ist gut! Isst Yara dort zu Mittag?
    meaning:
      ar: آه، إنها جيدة! هل تتغدّى يارا هناك؟
  - speaker: protagonist
    text: Ja, aber sie isst kein Schweinefleisch.
    meaning:
      ar: نعم، لكنها لا تأكل لحم الخنزير.
  - speaker: lena
    text: Kein Problem, die Kita kocht auch ohne Fleisch.
    meaning:
      ar: لا مشكلة، الحضانة تطبخ أيضًا بلا لحم.
  - speaker: protagonist
    text: Gut. Yara, nicht so hoch auf der Schaukel!
    meaning:
      ar: جيد. يارا، ليس بهذا العلو على الأرجوحة!
  - speaker: lena
    text: Ich bin Lena. Bis bald!
    meaning:
      ar: أنا لينا. إلى اللقاء قريبًا!
