steps:
- type: narrator
  text:
    ar: 'دعتك الجامعة لتلقي محاضرة ضيف عن مشروعك الهندسي: جسر بأقل إسمنت. بعدها أسئلة الطلاب. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: 'In dieser Gastvorlesung stelle ich ein Projekt vor: eine Brücke mit dreißig Prozent weniger Zement.'
    meaning:
      ar: 'في محاضرة الضيف هذه أعرض مشروعًا: جسرًا بإسمنت أقل بثلاثين بالمئة.'
  - speaker: protagonist
    text: Es lässt sich zeigen, dass die Tragfähigkeit dabei gleich bleibt.
    meaning:
      ar: يمكن إثبات أنّ قدرة التحمّل تبقى كما هي.
  - speaker: hartmann
    text: Welcher Werkstoff ersetzt den Zement?
    meaning:
      ar: أي مادة تحلّ محلّ الإسمنت؟
  - speaker: protagonist
    text: Ein Gemisch aus Ton und Kalk. Das ist ein Gewinn für die Nachhaltigkeit.
    meaning:
      ar: مزيج من الطين والكلس. هذا مكسب للاستدامة.
  - speaker: hartmann
    text: Und wo sehen Sie Einschränkungen?
    meaning:
      ar: وأين ترى القيود؟
  - speaker: protagonist
    text: 'Bei großen Spannweiten fehlen noch Ergebnisse. Der Ausblick: Tests im Winter.'
    meaning:
      ar: 'في البحور الكبيرة ما زالت النتائج ناقصة. والآفاق: اختبارات في الشتاء.'
  - speaker: hartmann
    text: Sie sprechen die Fachsprache wie ein Muttersprachler.
    meaning:
      ar: تتكلّم اللغة التخصّصية كأنها لغتك الأم.
  - speaker: protagonist
    text: In Aleppo habe ich auf Arabisch studiert — hier lerne ich alles ein zweites Mal.
    meaning:
      ar: درستُ في حلب بالعربية — وهنا أتعلّم كل شيء مرة ثانية.
