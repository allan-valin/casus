steps:
- type: narrator
  text:
    mk: На Сениорската академија во Лајпциг ве замолија да зборувате за Битола — од Хераклеја до денес. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Im Folgenden spreche ich über Bitola — von der Antike bis heute.
    meaning:
      mk: Во продолжение ќе зборувам за Битола — од антиката до денес.
  - speaker: protagonist
    text: Die Ausgrabungen von Heraclea zeigen Mosaike aus dem fünften Jahrhundert.
    meaning:
      mk: Ископините на Хераклеја покажуваат мозаици од петтиот век.
  - speaker: hartmann
    text: Aus welcher Epoche stammt die heutige Altstadt?
    meaning:
      mk: Од која епоха потекнува денешниот стар град?
  - speaker: protagonist
    text: Aus der Zeit des Osmanischen Reiches. Später war Bitola die Stadt der Konsuln.
    meaning:
      mk: Од времето на Отоманската империја. Подоцна Битола беше градот на конзулите.
  - speaker: hartmann
    text: Woher wissen wir das?
    meaning:
      mk: Од каде го знаеме тоа?
  - speaker: protagonist
    text: Aus historischen Quellen. Es lässt sich zeigen, dass dort zwölf Konsulate standen.
    meaning:
      mk: Од историски извори. Може да се покаже дека таму имало дванаесет конзулати.
  - speaker: hartmann
    text: Faszinierend. Und auf Deutsch — mit fünfundsechzig gelernt!
    meaning:
      mk: Фасцинантно. И на германски — научен на шеесет и пет!
  - speaker: protagonist
    text: Man ist nie zu alt. Das ist mein wichtigstes Ergebnis.
    meaning:
      mk: Човек никогаш не е премногу стар. Тоа е мојот најважен резултат.
