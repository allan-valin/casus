steps:
- type: narrator
  text:
    en: 'The C1 exam at the VHS: writing, reading, listening — and the oral part. Afterwards, the results. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'امتحان C1 في الجامعة الشعبية: كتابة وقراءة واستماع — والجزء الشفهي. ثم النتائج. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.'
    mk: 'Испитот C1 на народниот универзитет: пишување, читање, слушање — и усниот дел. Потоа резултатите. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: hartmann
    text: Die mündliche Prüfung beginnt. Bitte stellen Sie sich kurz vor.
    meaning:
      en: The oral exam begins. Please introduce yourself briefly.
      ar: يبدأ الامتحان الشفهي. قدّمي نفسكِ باختصار من فضلكِ.
      mk: Усниот испит почнува. Ве молам накратко претставете се.
  - speaker: protagonist
    text: Gern. Seit fünf Jahren lebe ich in Leipzig. Die Vorbereitung auf diese Prüfung war intensiv.
    meaning:
      en: Gladly. I've lived in Leipzig for five years. The preparation for this exam was intensive.
      ar: بكل سرور. أعيش في لايبزيغ منذ خمس سنوات. التحضير لهذا الامتحان كان مكثّفًا.
      mk: Со задоволство. Пет години живеам во Лајпциг. Подготовката за овој испит беше интензивна.
  - speaker: hartmann
    text: 'Ihr Thema: die Bedeutung der Sprache für die Integration. Bitte.'
    meaning:
      en: 'Your topic: the significance of language for integration. Go ahead.'
      ar: 'موضوعكِ: أهمية اللغة للاندماج. تفضّلي.'
      mk: 'Вашата тема: значењето на јазикот за интеграцијата. Повелете.'
  - speaker: protagonist
    text: Die Beherrschung der Sprache ist der Schlüssel — aber nicht die einzige Voraussetzung.
    meaning:
      en: Command of the language is the key — but not the only condition.
      ar: إتقان اللغة هو المفتاح — لكنه ليس الشرط الوحيد.
      mk: Владеењето на јазикот е клучот — но не и единствениот услов.
  - speaker: hartmann
    text: '... Vielen Dank. Die Bewertung bekommen Sie in zwei Wochen.'
    meaning:
      en: '... Thank you very much. You''ll get the marks in two weeks.'
      ar: '... شكرًا جزيلًا. تحصلين على التقييم بعد أسبوعين.'
      mk: '... Многу благодарам. Оценката ќе ја добиете за две недели.'
  - speaker: lena
    text: Und? Bestanden?
    meaning:
      en: So? Passed?
      ar: وماذا؟ نجحتِ؟
      mk: И? Положи?
  - speaker: protagonist
    text: Bestanden — sogar mit Auszeichnung! Ich dachte, ich falle im schriftlichen Teil durch.
    meaning:
      en: Passed — even with distinction! I thought I'd fail the written part.
      ar: نجحتُ — بل بامتياز! ظننتُ أنني سأرسب في الجزء الكتابي.
      mk: Положив — дури со одлика! Мислев дека ќе паднам на писмениот дел.
  - speaker: lena
    text: Mit dem Zertifikat stehen dir jetzt viele Türen offen!
    meaning:
      en: With the certificate many doors are open to you now!
      ar: مع الشهادة تُفتح أمامكِ الآن أبواب كثيرة!
      mk: Со сертификатот сега многу врати ти се отворени!
- type: prompt
  ask:
    en: 'Say: the oral exam.'
    ar: 'قولي: الامتحان الشفهي.'
    mk: 'Кажете: усниот испит.'
  answer:
    speaker: protagonist
    text: Die mündliche Prüfung.
  items:
  - die-muendliche-pruefung
  - die-pruefung-c1
- type: prompt
  ask:
    en: 'Say: the preparation was intensive.'
    ar: 'قولي: التحضير كان مكثّفًا.'
    mk: 'Кажете: подготовката беше интензивна.'
  answer:
    speaker: protagonist
    text: Die Vorbereitung war intensiv.
  items:
  - die-vorbereitung
- type: narrator
  text:
    en: 'Exam German at C1 is nominal: «die Bedeutung der Sprache für die Integration» (= why language matters for integration), «die Beherrschung der Sprache» (= being able to use the language well). Answer
      in the same register.'
    ar: 'ألمانية الامتحان في C1 اسمية: «die Bedeutung der Sprache für die Integration» (= لماذا تهمّ اللغة للاندماج)، «die Beherrschung der Sprache» (= إتقان اللغة). أجيبي بالأسلوب نفسه.'
    mk: 'Испитниот германски на C1 е номинален: «die Bedeutung der Sprache für die Integration» (= зошто јазикот е важен за интеграцијата), «die Beherrschung der Sprache» (= добро владеење на јазикот).
      Одговорете во истиот регистар.'
- type: prompt
  ask:
    en: 'Say: command of the language is the key.'
    ar: 'قولي: إتقان اللغة هو المفتاح.'
    mk: 'Кажете: владеењето на јазикот е клучот.'
  answer:
    speaker: protagonist
    text: Die Beherrschung der Sprache ist der Schlüssel.
  items:
  - die-beherrschung
- type: prompt
  ask:
    en: 'Say: the recognition of the certificate.'
    ar: 'قولي: الاعتراف بالشهادة.'
    mk: 'Кажете: признавањето на сертификатот.'
  answer:
    speaker: protagonist
    text: Die Anerkennung des Zertifikats.
  items:
  - die-anerkennung-zertifikat
- type: prompt
  ask:
    en: 'Say: the marks come in two weeks.'
    ar: 'قولي: التقييم بعد أسبوعين.'
    mk: 'Кажете: оценката за две недели.'
  answer:
    speaker: protagonist
    text: Die Bewertung kommt in zwei Wochen.
  items:
  - die-bewertung
- type: prompt
  ask:
    en: 'Say: passed — with distinction!'
    ar: 'قولي: نجحتُ — بامتياز!'
    mk: 'Кажете: положив — со одлика!'
  answer:
    speaker: protagonist
    text: Bestanden — mit Auszeichnung!
  items:
  - bestehen
  - mit-auszeichnung
- type: prompt
  ask:
    en: 'Say: I thought I''d fail the written part.'
    ar: 'قولي: ظننتُ أنني سأرسب في الجزء الكتابي.'
    mk: 'Кажете: мислев дека ќе паднам на писмениот дел.'
  answer:
    speaker: protagonist
    text: Ich dachte, ich falle im schriftlichen Teil durch.
  items:
  - durchfallen
  - die-schriftliche-pruefung
- type: prompt
  ask:
    en: 'Say: the certificate.'
    ar: 'قولي: الشهادة.'
    mk: 'Кажете: сертификатот.'
  answer:
    speaker: protagonist
    text: Das Zertifikat.
  items:
  - das-zertifikat
- type: narrator
  text:
    en: Recognised German certificates (telc, Goethe, ÖSD, TestDaF, DSH) are accepted by authorities, employers and universities; a VHS course certificate alone often isn't — check which exam you need.
      C1 opens university admission and many qualified jobs.
    ar: شهادات الألمانية المعترف بها (telc، Goethe، ÖSD، TestDaF، DSH) تقبلها الدوائر وأصحاب العمل والجامعات؛ أما شهادة حضور الدورة وحدها فغالبًا لا — تحقّقي من الامتحان الذي تحتاجينه. ومستوى C1 يفتح القبول
      الجامعي ووظائف مؤهّلة كثيرة.
    mk: Признаените германски сертификати (telc, Goethe, ÖSD, TestDaF, DSH) ги прифаќаат институциите, работодавците и универзитетите; само потврда за курс често не — проверете кој испит ви треба. C1 отвора
      упис на универзитет и многу квалификувани работи.
