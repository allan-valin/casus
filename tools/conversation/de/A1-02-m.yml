steps:
- type: narrator
  text:
    mk: Прв пат сами го земате внукот Лука од градинката (Kita). Ве пречекува воспитувачката. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: kruger
    text: Guten Tag! Kann ich Ihnen helfen?
    meaning:
      mk: Добар ден! Можам ли да ви помогнам?
  - speaker: protagonist
    text: Guten Tag. Ich bin der Opa von Luka. Ich hole Luka ab.
    meaning:
      mk: Добар ден. Јас сум дедото на Лука. Дојдов да го земам Лука.
  - speaker: kruger
    text: Ah, der Opa aus Mazedonien! Ich bin Frau Krüger, die Erzieherin.
    meaning:
      mk: А, дедото од Македонија! Јас сум госпоѓа Кригер, воспитувачката.
  - speaker: kruger
    text: Luka! Dein Opa ist da!
    meaning:
      mk: Лука! Дедо ти дојде!
  - speaker: luka
    text: Opa!
    meaning:
      mk: Дедо!
  - speaker: protagonist
    text: Hallo, mein Schatz!
    meaning:
      mk: Здраво, душо моја!
  - speaker: kruger
    text: Haben Sie den Ausweis, bitte?
    meaning:
      mk: Ја имате ли личната карта, ве молам?
  - speaker: protagonist
    text: Ja, hier. Das ist der Ausweis.
    meaning:
      mk: Да, еве. Ова е документот.
  - speaker: kruger
    text: Danke. Die Mama hat es gesagt. Tschüss, Luka! Bis morgen!
    meaning:
      mk: Благодарам. Мама кажа. Чао, Лука! До утре!
  - speaker: protagonist
    text: Tschüss! Bis morgen!
    meaning:
      mk: Чао! До утре!
- type: narrator
  text:
    mk: 'Германските именки имаат три рода, а членот го покажува: «der» (машки), «die» (женски), «das» (среден). «der Opa», «die Kita», «das Kind». Секоја именка учете ја со членот.'
