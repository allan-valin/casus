steps:
- type: narrator
  text:
    en: A check-up. Dr Wagner measures your blood pressure and gives you advice. Listen to the conversation; you don't need to understand it yet.
    ar: فحص دوري. الطبيبة فاغنر تقيس ضغط دمكِ وتنصحكِ. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Контролен преглед. Д-р Вагнер ви мери притисок и ви дава совет. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: wagner
    text: Guten Tag! Wie geht es Ihnen?
    meaning:
      en: Hello! How are you?
      ar: نهارك سعيد! كيف حالكِ؟
      mk: Добар ден! Како сте?
  - speaker: protagonist
    text: Mir geht es gut, danke. Nur ein Check-up.
    meaning:
      en: I'm well, thanks. Just a check-up.
      ar: أنا بخير، شكرًا. مجرد فحص دوري.
      mk: Добро сум, благодарам. Само контрола.
  - speaker: wagner
    text: Ich messe den Blutdruck. Hm, ein bisschen hoch.
    meaning:
      en: I'll measure your blood pressure. Hm, a bit high.
      ar: سأقيس ضغط الدم. همم، مرتفع قليلًا.
      mk: Ќе ви го измерам притисокот. Хм, малку висок.
  - speaker: protagonist
    text: Ist das schlimm? Und das Herz?
    meaning:
      en: Is that bad? And my heart?
      ar: هل هذا خطير؟ والقلب؟
      mk: Дали е страшно? А срцето?
  - speaker: wagner
    text: Das Herz ist gesund. Ich zeige Ihnen die Werte.
    meaning:
      en: Your heart is healthy. I'll show you the readings.
      ar: القلب سليم. سأريكِ القيم.
      mk: Срцето е здраво. Ќе ви ги покажам вредностите.
  - speaker: protagonist
    text: Was soll ich tun?
    meaning:
      en: What should I do?
      ar: ماذا أفعل؟
      mk: Што треба да правам?
  - speaker: wagner
    text: Weniger Salz, mehr Bewegung. Gehen Sie jeden Tag spazieren.
    meaning:
      en: Less salt, more exercise. Go for a walk every day.
      ar: ملح أقل، وحركة أكثر. تمشّي كل يوم.
      mk: Помалку сол, повеќе движење. Шетајте секој ден.
  - speaker: protagonist
    text: Das hilft mir. Danke!
    meaning:
      en: That helps me. Thank you!
      ar: هذا يساعدني. شكرًا!
      mk: Тоа ми помага. Благодарам!
  - speaker: wagner
    text: Kommen Sie in einem Monat wieder.
    meaning:
      en: Come back in a month.
      ar: عودي بعد شهر.
      mk: Дојдете повторно за еден месец.
- type: prompt
  ask:
    en: She asks how you are. How?
    ar: تسألكِ عن حالكِ. كيف؟
    mk: Ве прашува како сте. Како?
  answer:
    speaker: protagonist
    text: Wie geht es Ihnen?
  items:
  - wie-geht-es-ihnen
- type: narrator
  text:
    en: 'Some phrases put the person in the dative: «mir» (to me), «Ihnen» (to you, polite). «Mir geht es gut» — it goes well for me. «Ich zeige Ihnen» — I show you.'
    ar: 'بعض العبارات تضع الشخص في حالة الجر: «mir» (لي)، «Ihnen» (لكِ، بصيغة الاحترام). «Mir geht es gut» — حرفيًا: الأمور تسير معي جيدًا. «Ich zeige Ihnen» — أُريكِ.'
    mk: 'Некои изрази го ставаат лицето во датив: «mir» (мене), «Ihnen» (вам, учтиво). «Mir geht es gut» — ми оди добро. «Ich zeige Ihnen» — ви покажувам.'
