  ask:
    en: 'Say: upbringing.'
    ar: 'قولي: التربية.'
    mk: 'Кажете: воспитувањето.'
  answer:
    speaker: protagonist
    text: Die Erziehung.
  items:
  - die-erziehung
- type: narrator
  text:
    en: Hitting children is forbidden by law in Germany (since 2000), including a slap. Parents are expected to set clear limits calmly and consistently. Many paediatricians advise no screens under three
      and short, guided screen time afterwards. Grandparents' spoiling is a joke everywhere — and a clash point in many families.
    ar: ضرب الأطفال ممنوع قانونًا في ألمانيا (منذ 2000)، بما في ذلك الصفعة. ويُتوقّع من الوالدين وضع حدود واضحة بهدوء وثبات. وكثير من أطباء الأطفال ينصحون بلا شاشات تحت الثالثة، ثم بوقت شاشة قصير ومُوجَّه.
      وتدليل الأجداد نكتة في كل مكان — ونقطة خلاف في عائلات كثيرة.
    mk: Удирањето деца е забрането со закон во Германија (од 2000), вклучително и шамар. Од родителите се очекува мирно и доследно да поставуваат јасни граници. Многу педијатри советуваат без екрани под
      три години, а потоа кратко, водено време. Разгалувањето од бабите и дедовците е шега насекаде — и точка на судир во многу семејства.
- type: prompt
  ask:
    en: 'Once more: say “set limits”.'
    ar: 'مرة أخرى: قولي “يضع حدودًا”.'
    mk: 'Уште еднаш: кажете „поставува граници“.'
  answer:
