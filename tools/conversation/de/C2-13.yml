steps:
- type: narrator
  text:
    en: Emma is three now. Over coffee Svenja talks about rules, screen time — and grandparents who spoil her. Listen to the conversation; you don't need to understand it yet.
    ar: إيما في الثالثة الآن. على القهوة تتحدّث سفينيا عن القواعد ووقت الشاشة — والأجداد الذين يدلّلونها. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Ема сега има три години. На кафе Свења зборува за правила, време пред екран — и за бабите и дедовците што ја разгалуваат. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: svenja
    text: Hattest du schon mal einen Trotzanfall im Supermarkt? Emma gestern — eine halbe Stunde!
    meaning:
      en: Have you ever had a tantrum in the supermarket? Emma yesterday — half an hour!
      ar: هل مرّت بكِ من قبل نوبة عناد في السوبرماركت؟ إيما أمس — نصف ساعة!
      mk: Дали некогаш ти се случил напад на тврдоглавост во супермаркет? Ема вчера — половина час!
  - speaker: protagonist
    text: Was hast du gemacht?
    meaning:
      en: What did you do?
      ar: ماذا فعلتِ؟
      mk: Што направи?
  - speaker: svenja
    text: Ruhig bleiben und konsequent sein. Nein heißt nein — auch an der Kasse.
    meaning:
      en: Stay calm and be consistent. No means no — even at the checkout.
      ar: أن أبقى هادئة وثابتة. «لا» تعني لا — حتى عند الصندوق.
      mk: Да останам мирна и доследна. Не значи не — и на каса.
  - speaker: protagonist
    text: Bei uns hätte die Oma ihr einfach Schokolade gegeben.
    meaning:
      en: With us grandma would simply have given her chocolate.
      ar: عندنا كانت الجدة ستعطيها الشوكولاتة ببساطة.
      mk: Кај нас бабата едноставно ќе ѝ дадеше чоколадо.
  - speaker: svenja
    text: Meine Mutter auch! Großeltern verwöhnen halt eben. Das ist doch wohl ihr Recht.
    meaning:
      en: My mother too! Grandparents just spoil them, that's how it is. Surely that's their right.
      ar: أمي أيضًا! الأجداد يدلّلون، هكذا الأمر. بالتأكيد هذا حقّهم.
      mk: И мајка ми! Бабите и дедовците така е — разгалуваат. Тоа сигурно им е право.
  - speaker: protagonist
    text: Und Medienzeit? Bekommt Emma ein Tablet?
    meaning:
      en: And screen time? Does Emma get a tablet?
      ar: ووقت الشاشة؟ هل تحصل إيما على جهاز لوحي؟
      mk: А времето пред екран? Дали Ема добива таблет?
  - speaker: svenja
    text: 'Höchstens eine halbe Stunde am Tag. Die Kinderärztin sagt: unter drei am besten gar nicht.'
    meaning:
      en: 'Half an hour a day at most. The paediatrician says: under three, ideally not at all.'
      ar: 'نصف ساعة يوميًا على الأكثر. طبيبة الأطفال تقول: تحت الثالثة الأفضل ألّا يكون إطلاقًا.'
      mk: 'Најмногу половина час дневно. Педијатарката вели: под три години најдобро воопшто не.'
  - speaker: protagonist
    text: Grenzen setzen und trotzdem liebevoll sein — das ist die Kunst.
    meaning:
      en: Setting limits and still being loving — that's the art.
      ar: وضع الحدود مع البقاء محبّة — هذا هو الفن.
      mk: Поставување граници и сепак да бидеш нежна — тоа е уметноста.
- type: prompt
  ask:
    en: 'Say: a tantrum.'
    ar: 'قولي: نوبة عناد.'
    mk: 'Кажете: напад на тврдоглавост.'
  answer:
    speaker: protagonist
    text: Ein Trotzanfall.
  items:
  - der-trotzanfall
- type: narrator
  text:
    en: 'Particles carry attitude: «schon mal» (ever), «halt eben» (that''s just how it is — resigned), «doch wohl» (surely — expecting agreement). Two particles together soften or strengthen even more.'
    ar: 'الأدوات تحمل الموقف: «schon mal» (من قبل)، «halt eben» (هكذا الأمر — باستسلام)، «doch wohl» (بالتأكيد — مع توقّع الموافقة). وأداتان معًا تلطّفان أو تقوّيان أكثر.'
    mk: 'Честичките носат став: «schon mal» (некогаш), «halt eben» (така е — со помирување), «doch wohl» (сигурно — очекувајќи согласност). Две честички заедно уште повеќе омекнуваат или засилуваат.'
- type: prompt
  ask:
    en: 'Ask: have you ever had a tantrum?'
    ar: 'اسألي: هل مرّت بكِ من قبل نوبة عناد؟'
    mk: 'Прашајте: дали некогаш имаше напад?'
  answer:
    speaker: protagonist
    text: Hattest du schon mal einen Trotzanfall?
  items:
  - schon-mal
- type: prompt
  ask:
    en: 'Say: be consistent.'
    ar: 'قولي: كوني ثابتة.'
    mk: 'Кажете: биди доследна.'
  answer:
    speaker: protagonist
    text: Konsequent sein.
  items:
  - konsequent
- type: prompt
  ask:
    en: 'Say: grandparents just spoil them.'
    ar: 'قولي: الأجداد يدلّلون، هكذا الأمر.'
    mk: 'Кажете: бабите и дедовците така е — разгалуваат.'
  answer:
    speaker: protagonist
    text: Großeltern verwöhnen halt eben.
  items:
  - verwoehnen
  - halt-eben
- type: prompt
  ask:
    en: 'Say: surely that''s their right.'
    ar: 'قولي: بالتأكيد هذا حقّهم.'
    mk: 'Кажете: тоа сигурно им е право.'
  answer:
    speaker: protagonist
    text: Das ist doch wohl ihr Recht.
  items:
  - doch-wohl
- type: prompt
