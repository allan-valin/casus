- type: narrator
  text:
    en: 'A registered club (e.V.) is a small democracy: members elect the board at the general meeting, the treasurer reports each year, and auditors check the books. Anyone who has been a member a while
      can stand — newcomers are welcome, because volunteers are scarce.'
    ar: 'النادي المسجَّل (e.V.) ديمقراطية صغيرة: الأعضاء ينتخبون مجلس الإدارة في الجمعية العمومية، وأمين الصندوق يقدّم تقريرًا كل سنة، ومدقّقون يراجعون الحسابات. ويمكن لأي عضو مضى عليه وقت أن يترشّح — والقادمون
