- type: narrator
  text:
    en: 'Formal speech has fixed formulas: «Liebe Mitglieder» to open, «Vielen Dank für Ihr Vertrauen», «Ich nehme die Wahl an». Even among friends who say du, a speech to the meeting uses «Sie» or «ihr»
      for the group.'
    ar: 'للخطاب الرسمي صيغ ثابتة: «Liebe Mitglieder» للافتتاح، «Vielen Dank für Ihr Vertrauen»، «Ich nehme die Wahl an». وحتى بين أصدقاء يتخاطبون بـ«du»، تستعمل الكلمة أمام الجمعية «Sie» أو «ihr» للمجموعة.'
