steps:
- type: narrator
  text:
    en: The Verein's annual general meeting. The treasurer is retiring — and Petra proposes you. Listen to the conversation; you don't need to understand it yet.
    ar: الجمعية العمومية السنوية للنادي. أمين الصندوق يتقاعد — وبيترا تقترحكِ. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
- type: dialogue
  lines:
  - speaker: petra
    text: Für das Amt der Kassenwartin schlage ich sie vor. Sie ist zuverlässig und kann rechnen.
    meaning:
      en: For the post of treasurer I propose her. She's reliable and good with numbers.
      ar: لمنصب أمينة الصندوق أقترحها. إنها موثوقة وتجيد الحساب.
  - speaker: protagonist
    text: Ich? Ich bin erst zwei Jahre im Verein!
    meaning:
      en: Me? I've only been in the club two years!
      ar: أنا؟ لم يمضِ عليّ في النادي إلا سنتان!
  - speaker: petra
    text: 'Gerade deshalb. Wir brauchen neue Leute im Vorstand. Kommen wir zur Abstimmung: Wer ist dafür?'
    meaning:
      en: 'Exactly why. We need new people on the board. Let''s vote: who''s in favour?'
      ar: 'لهذا بالذات. نحتاج أشخاصًا جددًا في مجلس الإدارة. لننتقل إلى التصويت: من يؤيّد؟'
  - speaker: petra
    text: Gegenstimmen? Keine. Enthaltungen? Keine. Einstimmig gewählt!
    meaning:
      en: Against? None. Abstentions? None. Elected unanimously!
      ar: معارضون؟ لا أحد. ممتنعون؟ لا أحد. انتُخبت بالإجماع!
  - speaker: protagonist
    text: Liebe Mitglieder, vielen Dank für Ihr Vertrauen. Ich nehme die Wahl an.
    meaning:
      en: Dear members, thank you very much for your trust. I accept the election.
      ar: أعزائي الأعضاء، شكرًا جزيلًا على ثقتكم. أقبل الانتخاب.
  - speaker: protagonist
    text: Ich werde die Kasse sorgfältig führen und jedes Jahr Bericht erstatten.
    meaning:
      en: I'll keep the accounts carefully and report every year.
      ar: سأدير الصندوق بعناية وأقدّم تقريرًا كل سنة.
  - speaker: petra
    text: Herzlichen Glückwunsch! Jetzt bist du offiziell eine von uns.
    meaning:
      en: Congratulations! Now you're officially one of us.
      ar: تهانينا! الآن أنتِ رسميًا واحدة منّا.
  - speaker: protagonist
    text: 'Und als Erstes: der Mitgliedsbeitrag bleibt gleich!'
    meaning:
      en: 'And first thing: the membership fee stays the same!'
      ar: 'وأول شيء: رسوم العضوية تبقى كما هي!'
