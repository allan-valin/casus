- type: narrator
  text:
    en: 'Team conflicts are said openly and solved on the facts: name both positions, propose something concrete and time-limited, and get a clear ''einverstanden''. Talking behind someone''s back is considered
      worse than open disagreement.'
    ar: 'خلافات الفريق تُقال بصراحة وتُحلّ على أساس الوقائع: سمّي الموقفين، واقترحي شيئًا محددًا ومحدودًا بوقت، واحصلي على «einverstanden» واضحة. والكلام من وراء الظهر يُعدّ أسوأ من الاختلاف العلني.'
    mk: 'Тимските конфликти се кажуваат отворено и се решаваат според фактите: именувајте ги двете позиции, предложете нешто конкретно и временски ограничено и добијте јасно „einverstanden“. Зборувањето
      зад грб се смета за полошо од отвореното несогласување.'
