steps:
- type: narrator
  text:
    en: 'Tim and his colleague Sabine are blocking each other: new system or old? Frau Schröder asks you to mediate. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'تيم وزميلته زابينه يعرقلان بعضهما: النظام الجديد أم القديم؟ السيدة شرودر تطلب منكِ التوسّط. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.'
    mk: 'Тим и колешката Сабине се блокираат: нов систем или стар? Госпоѓа Шредер ве моли да посредувате. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: tim
    text: Das neue System ist schneller. Wir müssen wechseln!
    meaning:
      en: The new system is faster. We have to switch!
      ar: النظام الجديد أسرع. يجب أن ننتقل إليه!
      mk: Новиот систем е побрз. Мора да се смениме!
  - speaker: sabine
    text: Und wer lernt es? Das alte funktioniert. Ich blockiere nicht — ich habe nur keine Zeit.
    meaning:
      en: And who'll learn it? The old one works. I'm not blocking — I just have no time.
      ar: ومن سيتعلّمه؟ القديم يعمل. أنا لا أعرقل — لكن ليس لديّ وقت.
      mk: А кој ќе го учи? Стариот работи. Не блокирам — само немам време.
  - speaker: protagonist
    text: Darf ich vermitteln? Ich verstehe beide Standpunkte.
    meaning:
      en: May I mediate? I understand both points of view.
      ar: هل يمكنني التوسّط؟ أفهم وجهتي النظر.
      mk: Смеам ли да посредувам? Ги разбирам двете гледишта.
  - speaker: tim
    text: Bitte.
    meaning:
      en: Please.
      ar: تفضّلي.
      mk: Повели.
  - speaker: protagonist
    text: Obwohl beide recht haben, brauchen wir eine Lösung. Wie wäre eine Testphase von einem Monat?
    meaning:
      en: Although you're both right, we need a solution. How about a one-month trial phase?
      ar: مع أنّ كليكما على حق، نحتاج إلى حل. ما رأيكما في مرحلة تجريبية لشهر؟
      mk: Иако и двајцата сте во право, ни треба решение. Што велите за пробна фаза од еден месец?
  - speaker: sabine
    text: Und die Schulung?
    meaning:
      en: And the training?
      ar: والتدريب؟
      mk: А обуката?
  - speaker: protagonist
    text: Tim zeigt es dir — während der Arbeitszeit. Dennoch bleibt das alte System als Reserve.
    meaning:
      en: Tim shows you — during working hours. Nonetheless the old system stays as a backup.
      ar: تيم يُريكِ — خلال وقت العمل. ومع ذلك يبقى النظام القديم احتياطيًا.
      mk: Тим ќе ти покаже — во работно време. Сепак стариот систем останува како резерва.
  - speaker: sabine
    text: Einverstanden. Das ist ein fairer Kompromiss.
    meaning:
      en: Agreed. That's a fair compromise.
      ar: موافقة. هذا حل وسط عادل.
      mk: Се согласувам. Тоа е фер компромис.
  - speaker: tim
    text: Okay. Konflikt gelöst!
    meaning:
      en: OK. Conflict solved!
      ar: حسنًا. حُلّ الخلاف!
      mk: Добро. Конфликтот е решен!
- type: prompt
  ask:
    en: 'Ask: may I mediate?'
    ar: 'اسألي: هل يمكنني التوسّط؟'
    mk: 'Прашајте: смеам ли да посредувам?'
  answer:
    speaker: protagonist
    text: Darf ich vermitteln?
  items:
  - vermitteln
