- type: narrator
  text:
    en: 'Concessive clauses again, more formal: «obwohl» (verb at the end), «dennoch» (= trotzdem, verb right after). «Obwohl beide recht haben, brauchen wir eine Lösung».'
    ar: 'جمل التسليم مرة أخرى، بصيغة أكثر رسمية: «obwohl» (الفعل في الآخر)، و«dennoch» (= trotzdem، والفعل بعدها مباشرة). «Obwohl beide recht haben, brauchen wir eine Lösung».'
    mk: 'Допусни реченици пак, поформално: «obwohl» (глаголот на крајот), «dennoch» (= trotzdem, глаголот веднаш потоа). «Obwohl beide recht haben, brauchen wir eine Lösung».'
- type: prompt
