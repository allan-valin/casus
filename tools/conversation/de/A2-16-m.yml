steps:
- type: narrator
  text:
    mk: Петар ви објаснува што добива семејството за Лука — и како беше кога тој беше мал. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Petar, was bekommt ihr für Luka?
    meaning:
      mk: Петре, што добивате за Лука?
  - speaker: petar
    text: Kindergeld, jeden Monat. Vom Staat.
    meaning:
      mk: Детски додаток, секој месец. Од државата.
  - speaker: protagonist
    text: Und nach der Geburt? Anja war zu Hause.
    meaning:
      mk: А по раѓањето? Ања беше дома.
  - speaker: petar
    text: Ja, sie hatte Elterngeld. Ein Jahr. Und ich war zwei Monate zu Hause.
    meaning:
      mk: Да, имаше родителски надомест. Една година. А јас бев два месеци дома.
  - speaker: protagonist
    text: Du? Zu Hause bleiben, als Mann?
    meaning:
      mk: Ти? Да останеш дома, како маж?
  - speaker: petar
    text: Das ist hier normal, Tata.
    meaning:
      mk: Тоа тука е нормално, тато.
  - speaker: protagonist
    text: Als du klein warst, war alles anders.
    meaning:
      mk: Кога ти беше мал, сè беше поинаку.
  - speaker: petar
    text: Ich weiß. Du hattest keine Zeit für mich.
    meaning:
      mk: Знам. Ти немаше време за мене.
- type: prompt
