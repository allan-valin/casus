steps:
- type: narrator
  text:
    en: 'A discussion evening at the VHS on integration. A man says: ''They don''t want to integrate.'' You answer — calmly. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'أمسية نقاش في الجامعة الشعبية عن الاندماج. رجل يقول: «إنهم لا يريدون الاندماج.» تجيبين — بهدوء. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.'
    mk: 'Вечер на дискусија на народниот универзитет за интеграцијата. Еден човек вели: „Тие не сакаат да се интегрираат.“ Одговарате — мирно. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: hartmann
    text: 'Unser Thema heute: Integration und Teilhabe. Wer möchte anfangen?'
    meaning:
      en: 'Our topic today: integration and participation. Who''d like to start?'
      ar: 'موضوعنا اليوم: الاندماج والمشاركة. من يودّ أن يبدأ؟'
      mk: 'Нашата тема денес: интеграција и учество. Кој сака да почне?'
  - speaker: poebler
    text: Die wollen sich doch gar nicht integrieren.
    meaning:
      en: They don't even want to integrate.
      ar: هم لا يريدون الاندماج أصلًا.
      mk: Тие воопшто не сакаат да се интегрираат.
  - speaker: protagonist
    text: Das stimmt so nicht. Das ist pauschal.
    meaning:
      en: That's not quite right. That's a sweeping statement.
      ar: هذا ليس صحيحًا هكذا. هذا تعميم.
      mk: Тоа не е баш така. Тоа е паушално.
  - speaker: protagonist
    text: Einerseits lernen wir Deutsch, arbeiten und zahlen Steuern. Andererseits warten viele Jahre auf Kurse und Anerkennung.
    meaning:
      en: On the one hand we learn German, work and pay taxes. On the other, many wait years for courses and recognition.
      ar: من جهة نتعلّم الألمانية ونعمل وندفع الضرائب. ومن جهة أخرى ينتظر كثيرون سنوات للدورات والاعتراف.
      mk: Од една страна учиме германски, работиме и плаќаме даноци. Од друга страна многумина чекаат години за курсеви и признавање.
  - speaker: poebler
    text: Aber die Kriminalität...
    meaning:
      en: But the crime...
      ar: لكن الجريمة...
      mk: Но криминалот...
  - speaker: protagonist
    text: 'Außerdem: mit einem fremden Namen bekommt man seltener eine Wohnung oder einen Job. Folglich ist Integration auch Ihre Aufgabe.'
    meaning:
      en: 'Besides: with a foreign name you get a flat or a job less often. Consequently integration is your task too.'
      ar: 'فضلًا عن ذلك: باسم أجنبي يحصل المرء على شقة أو عمل بنسبة أقل. وبالتالي فالاندماج مهمتك أنت أيضًا.'
      mk: 'Освен тоа: со странско име поретко се добива стан или работа. Следствено, интеграцијата е и ваша задача.'
  - speaker: hartmann
    text: 'Ein wichtiger Punkt: Chancengleichheit auf dem Arbeitsmarkt.'
    meaning:
      en: 'An important point: equal opportunity on the job market.'
      ar: 'نقطة مهمة: تكافؤ الفرص في سوق العمل.'
      mk: 'Важна поента: еднакви можности на пазарот на трудот.'
  - speaker: protagonist
    text: Wir wollen beitragen. Lassen Sie uns.
    meaning:
      en: We want to contribute. Let us.
      ar: نحن نريد أن نساهم. دعونا نفعل.
      mk: Сакаме да придонесеме. Дозволете ни.
- type: prompt
  ask:
    en: 'Say: integration and participation.'
    ar: 'قولي: الاندماج والمشاركة.'
    mk: 'Кажете: интеграција и учество.'
  answer:
    speaker: protagonist
    text: Integration und Teilhabe.
  items:
  - die-teilhabe
- type: prompt
  ask:
    en: 'Answer calmly: that''s not quite right.'
    ar: 'أجيبي بهدوء: هذا ليس صحيحًا هكذا.'
    mk: 'Одговорете мирно: тоа не е баш така.'
  answer:
    speaker: protagonist
    text: Das stimmt so nicht.
  items:
  - das-stimmt-so-nicht
- type: prompt
  ask:
    en: 'Say: that''s a sweeping statement.'
    ar: 'قولي: هذا تعميم.'
    mk: 'Кажете: тоа е паушално.'
  answer:
    speaker: protagonist
    text: Das ist pauschal.
  items:
  - pauschal
- type: narrator
  text:
    en: 'Connectors structure an argument: «einerseits … andererseits» (on the one hand … on the other), «außerdem» (besides), «folglich» (consequently). After «außerdem» and «folglich» the verb comes next.'
    ar: 'أدوات الربط تنظّم الحجة: «einerseits … andererseits» (من جهة … ومن جهة أخرى)، «außerdem» (فضلًا عن ذلك)، «folglich» (بالتالي). وبعد «außerdem» و«folglich» يأتي الفعل مباشرة.'
    mk: 'Сврзниците го структурираат аргументот: «einerseits … andererseits» (од една страна … од друга), «außerdem» (освен тоа), «folglich» (следствено). По «außerdem» и «folglich» глаголот доаѓа веднаш.'
- type: prompt
  ask:
    en: 'Say: on the one hand we learn German, on the other we wait.'
    ar: 'قولي: من جهة نتعلّم الألمانية، ومن جهة أخرى ننتظر.'
    mk: 'Кажете: од една страна учиме германски, од друга чекаме.'
  answer:
    speaker: protagonist
    text: Einerseits lernen wir Deutsch, andererseits warten wir.
  items:
  - einerseits-andererseits
- type: prompt
  ask:
    en: 'Say: besides, it''s harder with a foreign name.'
    ar: 'قولي: فضلًا عن ذلك، الأمر أصعب باسم أجنبي.'
    mk: 'Кажете: освен тоа, потешко е со странско име.'
  answer:
    speaker: protagonist
    text: Außerdem ist es mit einem fremden Namen schwerer.
  items:
  - ausserdem
- type: prompt
  ask:
    en: 'Say: consequently it''s your task too.'
    ar: 'قولي: وبالتالي فهي مهمتك أيضًا.'
    mk: 'Кажете: следствено, тоа е и ваша задача.'
  answer:
    speaker: protagonist
    text: Folglich ist es auch Ihre Aufgabe.
  items:
  - folglich
- type: prompt
  ask:
    en: 'Say: equal opportunity on the job market.'
    ar: 'قولي: تكافؤ الفرص في سوق العمل.'
    mk: 'Кажете: еднакви можности на пазарот на трудот.'
  answer:
    speaker: protagonist
    text: Chancengleichheit auf dem Arbeitsmarkt.
  items:
  - die-chancengleichheit
  - der-arbeitsmarkt
- type: prompt
  ask:
    en: 'Say: we want to contribute.'
    ar: 'قولي: نريد أن نساهم.'
    mk: 'Кажете: сакаме да придонесеме.'
  answer:
    speaker: protagonist
    text: Wir wollen beitragen.
  items:
  - beitragen
- type: prompt
  ask:
    en: 'Name it: that''s racism.'
    ar: 'سمّيه: هذه عنصرية.'
    mk: 'Именувајте го: тоа е расизам.'
  answer:
    speaker: protagonist
    text: Das ist Rassismus.
  items:
  - der-rassismus
- type: narrator
  text:
    en: 'Against a sweeping remark, stay factual: name it (''Das ist pauschal''), give one or two concrete facts, and turn it into a shared task. You don''t have to convince the speaker — often the listeners
      are the ones you reach. If it becomes abuse or a threat, you may end the conversation, and anti-discrimination offices advise for free.'
    ar: 'أمام ملاحظة تعميمية ابقي موضوعية: سمّيها («Das ist pauschal»)، واذكري حقيقة أو اثنتين محددتين، وحوّليها إلى مهمة مشتركة. لستِ مضطرة لإقناع المتكلّم — غالبًا المستمعون هم من تصلين إليهم. وإذا صارت
      إساءة أو تهديدًا فلكِ أن تنهي الحديث، ومكاتب مكافحة التمييز تقدّم استشارة مجانية.'
    mk: 'Против паушална забелешка останете фактички: именувајте ја („Das ist pauschal“), дајте еден-два конкретни факти и претворете ја во заедничка задача. Не мора да го убедите говорникот — често слушателите
      се тие до кои ќе стигнете. Ако премине во навреда или закана, смеете да го прекинете разговорот, а канцелариите против дискриминација советуваат бесплатно.'
