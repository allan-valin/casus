steps:
- type: narrator
  text:
    en: 'A doctor''s waiting room: twenty people, nobody speaks. Later you ask Lena why. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'غرفة انتظار عند الطبيب: عشرون شخصًا، ولا أحد يتكلم. لاحقًا تسألين لينا عن السبب. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.'
    mk: 'Чекална кај лекар: дваесет луѓе, никој не зборува. Подоцна ја прашувате Лена зошто. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: Lena, im Wartezimmer hat niemand gesprochen. Zwanzig Leute!
    meaning:
      en: Lena, nobody spoke in the waiting room. Twenty people!
      ar: لينا، لم يتكلم أحد في غرفة الانتظار. عشرون شخصًا!
      mk: Лена, во чекалната никој не зборуваше. Дваесет луѓе!
  - speaker: lena
    text: Das ist normal. Wir schweigen gern.
    meaning:
      en: That's normal. We like silence.
      ar: هذا عادي. نحن نحب الصمت.
      mk: Тоа е нормално. Сакаме да молчиме.
  - speaker: protagonist
    text: Ich frage mich, ob das unhöflich ist.
    meaning:
      en: I wonder whether that's impolite.
      ar: أتساءل إن كان هذا غير مؤدب.
      mk: Се прашувам дали тоа е неучтиво.
  - speaker: lena
    text: Nein! Das ist Privatsphäre. Man stört nicht.
    meaning:
      en: No! It's privacy. You don't disturb people.
      ar: لا! هذه خصوصية. لا يزعج أحد الآخر.
      mk: Не! Тоа е приватност. Не се вознемирува.
  - speaker: protagonist
    text: Und im Seminar? Ich weiß nicht, warum alle schweigen.
    meaning:
      en: And in the seminar? I don't know why everyone is quiet.
      ar: وفي الحلقة الدراسية؟ لا أعرف لماذا يصمت الجميع.
      mk: А на семинарот? Не знам зошто сите молчат.
  - speaker: lena
    text: 'Sie hören zu. Schweigen heißt oft: Ich denke nach.'
    meaning:
      en: 'They''re listening. Silence often means: I''m thinking.'
      ar: 'إنهم يستمعون. الصمت يعني غالبًا: أنا أفكّر.'
      mk: 'Тие слушаат. Молчењето често значи: размислувам.'
  - speaker: protagonist
    text: Bei uns ist Smalltalk wichtig.
    meaning:
      en: Where I come from, small talk matters.
      ar: عندنا الدردشة الخفيفة مهمة.
      mk: Кај нас краткиот разговор е важно.
  - speaker: lena
    text: Hier auch — aber kurz. Und nicht mit Fremden im Wartezimmer!
    meaning:
      en: Here too — but short. And not with strangers in a waiting room!
      ar: هنا أيضًا — لكن باختصار. وليس مع الغرباء في غرفة الانتظار!
      mk: И тука — но кратко. И не со непознати во чекална!
- type: prompt
  ask:
    en: 'Say: in the waiting room nobody spoke.'
    ar: 'قولي: في غرفة الانتظار لم يتكلم أحد.'
    mk: 'Кажете: во чекалната никој не зборуваше.'
  answer:
    speaker: protagonist
    text: Im Wartezimmer hat niemand gesprochen.
