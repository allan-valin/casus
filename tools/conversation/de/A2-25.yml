- type: narrator
  text:
    en: Strangers rarely chat in waiting rooms, trams or lifts; silence in a seminar is often attention, not coldness. Friendship takes longer here — but once made, it lasts.
    ar: نادرًا ما يدردش الغرباء في غرف الانتظار أو الترام أو المصاعد؛ والصمت في الحلقة الدراسية غالبًا انتباه، لا برود. الصداقة تحتاج وقتًا أطول هنا — لكنها حين تُعقد تدوم.
    mk: Непознатите ретко разговараат во чекални, трамваи или лифтови; молкот на семинар често е внимание, не студенило. Пријателството тука трае подолго да се создаде — но кога ќе се создаде, трае.
