- type: narrator
  text:
    en: 'Rhetoric under time pressure: a list of three («Erstens… Zweitens… Drittens…»), one concrete question («Ich frage Sie ganz konkret: …»), and a short, memorable contrast at the end («Eine schriftliche
      Antwort ist gut. Eine Halle wäre besser.»).'
    ar: 'البلاغة تحت ضغط الوقت: قائمة من ثلاثة («Erstens… Zweitens… Drittens…»)، وسؤال محدّد واحد («Ich frage Sie ganz konkret: …»)، ومقابلة قصيرة لا تُنسى في النهاية («Eine schriftliche Antwort ist gut.
      Eine Halle wäre besser.»).'
    mk: 'Реторика под временски притисок: листа од три («Erstens… Zweitens… Drittens…»), едно конкретно прашање («Ich frage Sie ganz konkret: …») и краток контраст што се памети на крајот («Eine schriftliche
      Antwort ist gut. Eine Halle wäre besser.»).'
