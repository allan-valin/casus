- type: narrator
  text:
    en: 'Most city councils hold a public question time where any resident — with or without a German passport — may ask a question, often registered in advance. Three minutes, one question, facts first:
      that''s what gets an answer on the record.'
    ar: 'معظم مجالس المدن تعقد وقتًا لأسئلة المواطنين يحق فيه لأي مقيم — بجواز ألماني أو بدونه — طرح سؤال، غالبًا بتسجيل مسبق. ثلاث دقائق، سؤال واحد، والوقائع أولًا: هذا ما يجلب جوابًا مسجّلًا.'
    mk: 'Повеќето градски совети имаат час за прашања каде секој жител — со или без германски пасош — може да постави прашање, често со пријава однапред. Три минути, едно прашање, прво фактите: тоа носи
      одговор што се запишува.'
