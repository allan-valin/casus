steps:
- type: narrator
  text:
    en: The mayor's office never solved the hall problem. At the council's public question time you have three minutes. Listen to the conversation; you don't need to understand it yet.
    ar: مكتب رئيس البلدية لم يحلّ مشكلة القاعة قط. في وقت أسئلة المواطنين بمجلس المدينة لديكِ ثلاث دقائق. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Канцеларијата на градоначалникот никогаш не го реши проблемот со салата. На часот за прашања на граѓаните во советот имате три минути. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: ratsvorsitz
    text: Bürgerfragestunde. Sie haben drei Minuten Redezeit.
    meaning:
      en: Public question time. You have three minutes' speaking time.
      ar: وقت أسئلة المواطنين. لديكِ ثلاث دقائق للكلام.
      mk: Час за прашања на граѓаните. Имате три минути време за говор.
  - speaker: protagonist
    text: Sehr geehrter Herr Vorsitzender, sehr geehrte Stadträtinnen und Stadträte!
    meaning:
      en: Mr Chairman, ladies and gentlemen of the council!
      ar: السيد الرئيس المحترم، أعضاء المجلس المحترمون!
      mk: Почитуван господине претседавач, почитувани советнички и советници!
  - speaker: protagonist
    text: 'Drei Tatsachen. Erstens: Vierzig Kinder haben keine Halle. Zweitens: Es gab eine Zusage. Drittens: Seit sechs Monaten passiert nichts.'
    meaning:
      en: 'Three facts. First: forty children have no hall. Second: there was a promise. Third: for six months nothing has happened.'
      ar: 'ثلاث حقائق. أولًا: أربعون طفلًا بلا قاعة. ثانيًا: كان هناك وعد. ثالثًا: منذ ستة أشهر لا شيء يحدث.'
      mk: 'Три факти. Прво: четириесет деца немаат сала. Второ: имаше ветување. Трето: шест месеци ништо не се случува.'
  - speaker: protagonist
    text: 'Ich frage Sie ganz konkret: Wann bekommen diese Kinder ihre Hallenzeit?'
    meaning:
      en: 'I ask you very concretely: when will these children get their hall time?'
      ar: 'أسألكم بشكل محدّد تمامًا: متى يحصل هؤلاء الأطفال على وقتهم في القاعة؟'
      mk: 'Ве прашувам сосема конкретно: кога овие деца ќе го добијат својот термин?'
  - speaker: ratsvorsitz
    text: Danke. Das Sportamt antwortet Ihnen schriftlich innerhalb von vier Wochen.
    meaning:
      en: Thank you. The sports office will answer you in writing within four weeks.
      ar: شكرًا. مكتب الرياضة سيردّ عليكِ كتابيًا خلال أربعة أسابيع.
      mk: Благодарам. Спортската служба ќе ви одговори писмено во рок од четири недели.
  - speaker: protagonist
    text: Eine schriftliche Antwort ist gut. Eine Halle wäre besser.
    meaning:
      en: A written answer is good. A hall would be better.
      ar: الردّ المكتوب جيد. لكن القاعة أفضل.
      mk: Писмениот одговор е добар. Сала би била подобра.
  - speaker: ratsvorsitz
    text: (Applaus) Bitte keine Beifallsbekundungen. Wir vertagen den Punkt nicht — er kommt auf die nächste Tagesordnung.
    meaning:
      en: (Applause) No applause, please. We won't postpone the item — it goes on the next agenda.
      ar: (تصفيق) من فضلكم لا تصفيق. لن نؤجّل البند — سيُدرج في جدول الأعمال القادم.
      mk: (Аплауз) Ве молам без аплаузи. Нема да ја одложиме точката — оди на следниот дневен ред.
  - speaker: protagonist
    text: Dann komme ich wieder. Mit vierzig Kindern.
    meaning:
      en: Then I'll come again. With forty children.
      ar: إذن سأعود. مع أربعين طفلًا.
      mk: Тогаш пак ќе дојдам. Со четириесет деца.
- type: prompt
  ask:
    en: 'Say: public question time.'
    ar: 'قولي: وقت أسئلة المواطنين.'
    mk: 'Кажете: час за прашања на граѓаните.'
  answer:
    speaker: protagonist
    text: Die Bürgerfragestunde.
  items:
  - die-buergerfragestunde
