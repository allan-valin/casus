- type: narrator
  text:
    en: 'Guests usually bring something small — wine, flowers, chocolate — and come on time. Dinner is early, often at six or seven. Many Germans find food very spicy that you find mild: ask before adding
      chilli.'
    ar: 'عادة يحضر الضيوف شيئًا صغيرًا — نبيذًا أو أزهارًا أو شوكولاتة — ويأتون في الموعد. العشاء مبكر، غالبًا في السادسة أو السابعة. وكثير من الألمان يجدون حارًّا ما تراه أنت خفيفًا: اسأل قبل أن تضيف الفلفل.'
    mk: 'Гостите обично носат нешто мало — вино, цвеќе, чоколадо — и доаѓаат точно. Вечерата е рано, често во шест или седум. Многу Германци наоѓаат за луто тоа што вам ви е благо: прашајте пред да ставите
      лута пиперка.'
- type: narrator
