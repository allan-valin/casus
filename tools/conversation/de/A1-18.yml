steps:
- type: narrator
  text:
    en: Jonas and Lena are coming to dinner. You cook a dish from home on the new stove. Listen to the conversation; you don't need to understand it yet.
    ar: يوناس ولينا قادمان للعشاء. تطبخ طبقًا من بلدك على الموقد الجديد. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Јонас и Лена доаѓаат на вечера. Готвите јадење од дома на новиот шпорет. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: Hallo! Wir haben Wein mitgebracht. Was kochst du?
    meaning:
      en: Hi! We've brought wine. What are you cooking?
      ar: مرحبًا! أحضرنا معنا نبيذًا. ماذا تطبخ؟
      mk: Здраво! Донесовме вино. Што готвиш?
  - speaker: protagonist
    text: Ich koche den Reis mit Gemüse. Ein Rezept von zu Hause.
    meaning:
      en: I'm cooking the rice with vegetables. A recipe from home.
      ar: أطبخ الأرز مع الخضار. وصفة من بلدي.
      mk: Готвам ориз со зеленчук. Рецепт од дома.
  - speaker: lena
    text: Vorsicht, der Herd ist heiß!
    meaning:
      en: Careful, the stove is hot!
      ar: انتبه، الموقد ساخن!
      mk: Внимавај, шпоретот е жежок!
  - speaker: protagonist
    text: Probier mal! Ist es zu salzig?
    meaning:
      en: Have a taste! Is it too salty?
      ar: ذوقي! هل هو مالح جدًا؟
      mk: Проба! Дали е пресолено?
  - speaker: lena
    text: Nein, es schmeckt super. Ein bisschen scharf!
    meaning:
      en: No, it tastes great. A bit spicy!
      ar: لا، طعمه رائع. حار قليلًا!
      mk: Не, супер е. Малку луто!
  - speaker: jonas
    text: Für mich ist es sehr scharf!
    meaning:
      en: For me it's very spicy!
      ar: بالنسبة لي إنه حار جدًا!
      mk: За мене е многу луто!
  - speaker: protagonist
    text: Hier ist Wasser. Und Brot.
    meaning:
      en: Here's water. And bread.
      ar: هذا ماء. وخبز.
      mk: Еве вода. И леб.
  - speaker: lena
    text: Gibst du mir das Rezept?
    meaning:
      en: Will you give me the recipe?
      ar: هل تعطيني الوصفة؟
      mk: Ќе ми го дадеш рецептот?
  - speaker: protagonist
    text: Klar! Guten Appetit!
    meaning:
      en: Sure! Enjoy your meal!
      ar: طبعًا! بالهناء والشفاء!
      mk: Секако! Пријатно!
- type: prompt
  ask:
    en: 'Jonas says: we''ve brought wine.'
    ar: 'يوناس يقول: أحضرنا معنا نبيذًا.'
    mk: 'Јонас вели: донесовме вино.'
  answer:
    speaker: protagonist
    text: Wir haben Wein mitgebracht.
  items:
  - mitgebracht
- type: narrator
  text:
    en: 'After a verb like «kochen» the object takes the accusative — only «der» changes: «der Reis» → «Ich koche den Reis». «das Gemüse» and «die Suppe» stay.'
    ar: 'بعد فعل مثل «kochen» يأتي المفعول به في حالة النصب — فقط «der» تتغير: «der Reis» → «Ich koche den Reis». أما «das Gemüse» و«die Suppe» فتبقيان.'
    mk: 'По глагол како «kochen» предметот е во акузатив — се менува само «der»: «der Reis» → «Ich koche den Reis». «das Gemüse» и «die Suppe» остануваат.'
- type: prompt
  ask:
    en: 'Say: I''m cooking the rice with vegetables.'
    ar: 'قل: أطبخ الأرز مع الخضار.'
    mk: 'Кажете: готвам ориз со зеленчук.'
  answer:
    speaker: protagonist
    text: Ich koche den Reis mit Gemüse.
  items:
