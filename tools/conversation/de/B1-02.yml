steps:
- type: narrator
  text:
    en: In the WG kitchen. Paul wants to ban cars from the city centre. Jonas disagrees. Listen to the conversation; you don't need to understand it yet.
    ar: في مطبخ السكن المشترك. باول يريد منع السيارات من وسط المدينة. يوناس لا يوافق. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Во кујната на заедничкиот стан. Паул сака да ги забрани колите од центарот. Јонас не се согласува. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: paul
    text: Ich finde, dass Autos in der Innenstadt verboten werden sollten.
    meaning:
      en: I think cars should be banned from the city centre.
      ar: أرى أنّ السيارات يجب أن تُمنع في وسط المدينة.
      mk: Мислам дека колите треба да се забранат во центарот.
  - speaker: jonas
    text: Ich bin dagegen. Meine Oma kann nicht laufen.
    meaning:
      en: I'm against it. My grandma can't walk.
      ar: أنا ضد ذلك. جدتي لا تستطيع المشي.
      mk: Јас сум против. Баба ми не може да оди.
  - speaker: paul
    text: Das stimmt zwar, aber das Klima!
    meaning:
      en: That's true, but the climate!
      ar: صحيح، لكن المناخ!
      mk: Тоа е точно, но климата!
  - speaker: protagonist
    text: Und was ist deine Meinung, Jonas?
    meaning:
      en: And what's your opinion, Jonas?
      ar: وما رأيك يا يوناس؟
      mk: А кое е твоето мислење, Јонас?
  - speaker: jonas
    text: Meiner Meinung nach brauchen wir besseren Nahverkehr. Dann fahren weniger Autos.
    meaning:
      en: In my opinion we need better public transport. Then fewer cars will drive.
      ar: في رأيي نحتاج نقلًا محليًا أفضل. عندها تقلّ السيارات.
      mk: Според мене ни треба подобар градски превоз. Тогаш ќе има помалку коли.
  - speaker: protagonist
    text: Da bin ich dafür.
    meaning:
      en: I'm for that.
      ar: أنا مع ذلك.
      mk: За тоа сум.
  - speaker: paul
    text: Okay. Dann sind wir uns einig.
    meaning:
      en: OK. Then we agree.
      ar: حسنًا. إذن نحن متفقون.
      mk: Добро. Тогаш се согласуваме.
  - speaker: protagonist
    text: Ihr streitet so offen! Ist das normal?
    meaning:
      en: You argue so openly! Is that normal?
      ar: تتجادلون بصراحة شديدة! هل هذا عادي؟
      mk: Толку отворено се расправате! Дали е тоа нормално?
  - speaker: jonas
    text: Klar. Wir streiten über die Sache, nicht über die Person.
    meaning:
      en: Sure. We argue about the issue, not the person.
      ar: طبعًا. نتجادل في الموضوع، لا في الشخص.
      mk: Секако. Се расправаме за работата, не за човекот.
