steps:
- type: narrator
  text:
    en: The house summer party in the courtyard. Jonas tries to explain German humour — and A2 comes back. Listen to the conversation; you don't need to understand it yet.
    ar: حفلة الصيف في فناء العمارة. يوناس يحاول شرح الفكاهة الألمانية — والمستوى A2 يعود. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Летната забава во дворот на зградата. Јонас се обидува да го објасни германскиот хумор — и A2 се враќа. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: Willkommen beim Sommerfest! Kennst du einen deutschen Witz?
    meaning:
      en: Welcome to the summer party! Do you know a German joke?
      ar: أهلًا بك في حفلة الصيف! هل تعرف نكتة ألمانية؟
      mk: Добредојде на летната забава! Знаеш ли германска шега?
  - speaker: protagonist
    text: Nein. Gibt es deutschen Humor?
    meaning:
      en: No. Is there German humour?
      ar: لا. هل هناك فكاهة ألمانية؟
      mk: Не. Постои ли германски хумор?
  - speaker: jonas
    text: 'Ha! Das ist der Witz! ... Okay: Was ist grün und klopft an die Tür? Ein Klopfsalat!'
    meaning:
      en: 'Ha! That''s the joke! ... OK: what''s green and knocks at the door? A knock salad!'
      ar: 'ها! هذه هي النكتة! ... حسنًا: ما الأخضر الذي يطرق الباب؟ سلطة طرّاقة!'
      mk: 'Ха! Тоа е шегата! ... Добро: што е зелено и чука на врата? Чукална салата!'
  - speaker: protagonist
    text: Ich verstehe den Witz nicht.
    meaning:
      en: I don't get the joke.
      ar: لم أفهم النكتة.
      mk: Не ја разбирам шегата.
  - speaker: jonas
    text: Kopfsalat, Klopfsalat — ein Wortspiel! Die Pointe ist schlecht, das ist lustig.
    meaning:
      en: Lettuce, 'knock-lettuce' — a pun! The punchline is bad, that's what's funny.
      ar: خسّ، «خسّ طرّاق» — تلاعب بالألفاظ! ذروة النكتة سيئة، وهذا المضحك.
      mk: Зелена салата, „чукална салата“ — игра на зборови! Поентата е лоша, тоа е смешното.
  - speaker: becker
    text: Deutscher Humor ist trocken. Man lacht nicht laut.
    meaning:
      en: German humour is dry. People don't laugh loudly.
      ar: الفكاهة الألمانية جافة. لا يضحك الناس بصوت عالٍ.
      mk: Германскиот хумор е сув. Луѓето не се смеат гласно.
  - speaker: protagonist
    text: Dann lache ich leise. Prost!
    meaning:
      en: Then I'll laugh quietly. Cheers!
      ar: إذن سأضحك بهدوء. في صحتكم!
      mk: Тогаш ќе се смеам тивко. Наздравје!
  - speaker: jonas
    text: Prost! Jetzt verstehst du alles!
    meaning:
      en: Cheers! Now you understand everything!
      ar: في صحتك! الآن تفهم كل شيء!
      mk: Наздравје! Сега разбираш сѐ!
