- type: narrator
  text:
    en: German humour exists — it is often dry, ironic, and loves puns and self-mockery ('German humour? That's the joke!'). Laughing quietly at a bad pun is exactly right.
    ar: الفكاهة الألمانية موجودة — غالبًا جافة وساخرة، وتحب التلاعب بالألفاظ والسخرية من الذات («فكاهة ألمانية؟ هذه هي النكتة!»). والضحك بهدوء على نكتة سيئة هو التصرف الصحيح تمامًا.
    mk: Германскиот хумор постои — често е сув, ироничен, сака игри на зборови и самоиронија („Германски хумор? Тоа е шегата!“). Тивко смеење на лоша игра на зборови е токму вистинската реакција.
