steps:
- type: narrator
  text:
    en: A café with Lena. Music, food, and what you like best. Listen to the conversation; you don't need to understand it yet.
    ar: مقهى مع لينا. الموسيقى والطعام وما تحبينه أكثر. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Кафуле со Лена. Музика, храна и што најмногу сакате. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: lena
    text: Magst du Kuchen oder lieber etwas Salziges?
    meaning:
      en: Do you like cake, or would you rather have something savoury?
      ar: هل تحبين الكعك أم تفضّلين شيئًا مالحًا؟
      mk: Сакаш ли колач или повеќе нешто солено?
  - speaker: protagonist
    text: Ich mag beides. Aber am liebsten Kuchen!
    meaning:
      en: I like both. But cake most of all!
      ar: أحبّ الاثنين. لكن الكعك أكثر شيء!
      mk: Ги сакам и двете. Но најмногу колач!
  - speaker: lena
    text: Der Käsekuchen hier ist super. Nicht so süß.
    meaning:
      en: The cheesecake here is great. Not too sweet.
      ar: كعكة الجبن هنا رائعة. ليست حلوة جدًا.
      mk: Колачот со сирење тука е супер. Не е многу сладок.
  - speaker: protagonist
    text: Gut, ich mag es nicht so süß.
    meaning:
      en: Good, I don't like it too sweet.
      ar: جيد، لا أحبه حلوًا جدًا.
      mk: Добро, не сакам многу слатко.
  - speaker: lena
    text: Und Musik? Was hörst du gern?
    meaning:
      en: And music? What do you like listening to?
      ar: والموسيقى؟ ماذا تحبين أن تسمعي؟
      mk: А музика? Што сакаш да слушаш?
  - speaker: protagonist
    text: Ich höre gern Musik aus meiner Heimat. Und du?
    meaning:
      en: I like listening to music from home. And you?
      ar: أحب الاستماع إلى موسيقى من وطني. وأنتِ؟
      mk: Сакам да слушам музика од мојата земја. А ти?
  - speaker: lena
    text: Ich mag Techno — Leipzig ist eine Techno-Stadt!
    meaning:
      en: I like techno — Leipzig is a techno city!
      ar: أحبّ التكنو — لايبزيغ مدينة التكنو!
      mk: Сакам техно — Лајпциг е техно-град!
  - speaker: protagonist
    text: Techno mag ich nicht so. Lieber etwas Ruhiges.
    meaning:
      en: I'm not so into techno. I'd rather have something calm.
      ar: لا أحب التكنو كثيرًا. أفضّل شيئًا هادئًا.
      mk: Техното не ми се допаѓа толку. Повеќе нешто мирно.
