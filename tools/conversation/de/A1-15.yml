steps:
- type: narrator
  text:
    en: A sofa from the internet. Will it fit? Jonas helps you measure. Listen to the conversation; you don't need to understand it yet.
    ar: أريكة من الإنترنت. هل ستتسع؟ يوناس يساعدك في القياس. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Кауч од интернет. Дали ќе собере? Јонас ви помага да мерите. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Passt das Sofa hier?
    meaning:
      en: Will the sofa fit here?
      ar: هل تتسع الأريكة هنا؟
      mk: Ќе собере ли каучот тука?
  - speaker: jonas
    text: Wir messen. Wie breit ist das Sofa?
    meaning:
      en: Let's measure. How wide is the sofa?
      ar: لنقِس. كم عرض الأريكة؟
      mk: Да мериме. Колку е широк каучот?
  - speaker: protagonist
    text: Zwei Meter zwanzig.
    meaning:
      en: Two metres twenty.
      ar: متران وعشرون.
      mk: Два метри и дваесет.
  - speaker: jonas
    text: Und die Wand? Zwei Meter zehn.
    meaning:
      en: And the wall? Two metres ten.
      ar: والحائط؟ متران وعشرة.
      mk: А ѕидот? Два метри и десет.
  - speaker: protagonist
    text: Zehn Zentimeter zu lang!
    meaning:
      en: Ten centimetres too long!
      ar: أطول بعشرة سنتيمترات!
      mk: Десет сантиметри подолг!
  - speaker: jonas
    text: Und in der Ecke?
    meaning:
      en: And in the corner?
      ar: وفي الزاوية؟
      mk: А во аголот?
  - speaker: protagonist
    text: Nein, das Sofa ist eckig, die Ecke ist rund.
    meaning:
      en: No, the sofa is square, the corner is round.
      ar: لا، الأريكة مربّعة، والزاوية مستديرة.
      mk: Не, каучот е аглест, аголот е заоблен.
  - speaker: jonas
    text: Genau. Das Sofa ist zu groß.
    meaning:
      en: Exactly. The sofa is too big.
      ar: بالضبط. الأريكة كبيرة جدًا.
      mk: Точно. Каучот е преголем.
  - speaker: protagonist
    text: Dann kaufe ich ein kleines Sofa.
    meaning:
      en: Then I'll buy a small sofa.
      ar: إذن سأشتري أريكة صغيرة.
      mk: Тогаш ќе купам мал кауч.
