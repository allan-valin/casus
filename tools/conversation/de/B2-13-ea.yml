steps:
- type: narrator
  text:
    en: You got the new job. Now you have to tell Frau Schröder — in writing, with the right notice period. Listen to the conversation; you don't need to understand it yet.
    ar: حصلتَ على الوظيفة الجديدة. الآن عليك أن تخبر السيدة شرودر — كتابيًا، مع مراعاة مهلة الإنهاء. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Frau Schröder, ich muss Ihnen etwas sagen. Ich habe eine neue Stelle und möchte kündigen.
    meaning:
      en: Mrs Schröder, I have to tell you something. I have a new job and would like to give notice.
      ar: سيدة شرودر، يجب أن أخبركِ بشيء. لديّ وظيفة جديدة وأريد أن أستقيل.
  - speaker: schroeder
    text: Schade, dass Sie gehen! Aber herzlichen Glückwunsch. Die Kündigungsfrist ist ein Monat zum Monatsende.
    meaning:
      en: A pity you're going! But congratulations. The notice period is one month to the end of the month.
      ar: مؤسف أنك ستغادر! لكن تهانينا. مهلة الإنهاء شهر حتى نهاية الشهر.
  - speaker: protagonist
    text: Hier ist meine Kündigung, schriftlich und unterschrieben.
    meaning:
      en: Here's my notice, in writing and signed.
      ar: هذه استقالتي، كتابيًا وموقَّعة.
  - speaker: schroeder
    text: Danke. Eine E-Mail reicht nicht — gut, dass Sie das wissen.
    meaning:
      en: Thank you. An email isn't enough — good that you know that.
      ar: شكرًا. البريد الإلكتروني لا يكفي — جيد أنك تعرف ذلك.
  - speaker: protagonist
    text: Ich möchte Sie bitten, mir ein Arbeitszeugnis zu schreiben.
    meaning:
      en: I'd like to ask you to write me a job reference.
      ar: أودّ أن أطلب منكِ أن تكتبي لي شهادة عمل.
  - speaker: schroeder
    text: Selbstverständlich. Und Ihr Resturlaub? Noch fünf Tage.
    meaning:
      en: Of course. And your remaining holiday? Five more days.
      ar: بالطبع. وإجازتك المتبقية؟ ما زالت خمسة أيام.
  - speaker: protagonist
    text: Wären Sie so freundlich, sie mir am Ende zu geben? Vorher mache ich die Übergabe an Tim.
    meaning:
      en: Would you be so kind as to give them to me at the end? Before that I'll do the handover to Tim.
      ar: هل تتكرّمين بمنحها لي في النهاية؟ قبل ذلك سأسلّم العمل لتيم.
  - speaker: schroeder
    text: Sehr gern. So macht man das.
    meaning:
      en: With pleasure. That's how it's done.
      ar: بكل سرور. هكذا يُفعل الأمر.
