- type: narrator
  text:
    en: Notice must be on paper and signed — an email or text message is not valid. Look up the period in your contract. You have a right to a written reference (Arbeitszeugnis); its friendly phrases are
      coded, so ask someone experienced to read it. Remaining holiday is taken or paid out.
    ar: الاستقالة يجب أن تكون على ورق وموقَّعة — البريد الإلكتروني أو الرسالة النصية غير صالحين. ابحث عن المهلة في عقدك. لك الحق في شهادة عمل مكتوبة (Arbeitszeugnis)؛ وعباراتها اللطيفة مشفّرة، فاطلب من
      شخص ذي خبرة أن يقرأها. والإجازة المتبقية تُؤخذ أو يُدفع مقابلها.
