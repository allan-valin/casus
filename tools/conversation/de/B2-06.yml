steps:
- type: narrator
  text:
    en: 'A VHS evening: chemistry in the kitchen. Professor Hartmann drops lemon juice into red cabbage water. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'أمسية في الجامعة الشعبية: الكيمياء في المطبخ. البروفيسور هارتمان يقطّر عصير الليمون في ماء الملفوف الأحمر. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.'
    mk: 'Вечер на народниот универзитет: хемија во кујната. Професорот Хартман капе сок од лимон во вода од црвена зелка. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: hartmann
    text: Hier ist Rotkohlwasser aus dem kochenden Wasser von vorhin. Es ist lila.
    meaning:
      en: Here is red cabbage water from the boiling water earlier. It's purple.
      ar: هذا ماء الملفوف الأحمر من الماء المغلي قبل قليل. لونه بنفسجي.
      mk: Ова е вода од црвена зелка од врелата вода од малку порано. Виолетова е.
  - speaker: protagonist
    text: Und jetzt kommt die geschnittene Zitrone?
    meaning:
      en: And now the cut lemon goes in?
      ar: والآن تأتي الليمونة المقطّعة؟
      mk: А сега доаѓа исечениот лимон?
  - speaker: hartmann
    text: Genau. Zitrone ist eine Säure. Sehen Sie? Die Farbe ändert sich — rot!
    meaning:
      en: Exactly. Lemon is an acid. See? The colour changes — red!
      ar: بالضبط. الليمون حمض. أترين؟ اللون يتغيّر — أحمر!
      mk: Точно. Лимонот е киселина. Гледате? Бојата се менува — црвено!
  - speaker: protagonist
    text: Und mit Natron?
    meaning:
      en: And with baking soda?
      ar: ومع بيكربونات الصوديوم؟
      mk: А со сода бикарбона?
  - speaker: hartmann
    text: Natron ist eine Base. Das Wasser wird grün oder blau.
    meaning:
      en: Baking soda is a base. The water turns green or blue.
      ar: البيكربونات قاعدة. يصبح الماء أخضر أو أزرق.
      mk: Содата е база. Водата станува зелена или сина.
  - speaker: protagonist
    text: Und reines Wasser ist neutral?
    meaning:
      en: And pure water is neutral?
      ar: والماء النقي متعادل؟
      mk: А чистата вода е неутрална?
  - speaker: hartmann
    text: 'Richtig. Essig, Zitrone, Joghurt: alles Saure ist eine Säure.'
    meaning:
      en: 'Right. Vinegar, lemon, yoghurt: everything sour is an acid.'
      ar: 'صحيح. الخل والليمون واللبن: كل شيء حامض هو حمض.'
      mk: 'Точно. Оцет, лимон, јогурт: сѐ што е кисело е киселина.'
  - speaker: protagonist
    text: Ein schöner Versuch! Den zeige ich Lenas Kindern.
    meaning:
      en: A lovely experiment! I'll show it to Lena's children.
      ar: تجربة جميلة! سأُريها لأطفال لينا.
      mk: Убав експеримент! Ќе им го покажам на децата на Лена.
- type: prompt
  ask:
    en: 'Say: red cabbage.'
    ar: 'قولي: الملفوف الأحمر.'
    mk: 'Кажете: црвена зелка.'
  answer:
    speaker: protagonist
    text: Der Rotkohl.
  items:
  - der-rotkohl
- type: narrator
  text:
    en: 'Participles can work as adjectives: «kochen» → «das kochende Wasser» (boiling water, present participle -end), «schneiden» → «die geschnittene Zitrone» (the cut lemon, past participle).'
    ar: 'اسم الفاعل واسم المفعول يعملان صفةً: «kochen» ← «das kochende Wasser» (الماء المغلي، باللاحقة -end)، «schneiden» ← «die geschnittene Zitrone» (الليمونة المقطّعة).'
    mk: 'Партиципите можат да бидат придавки: «kochen» → «das kochende Wasser» (врелата вода, сегашен партицип -end), «schneiden» → «die geschnittene Zitrone» (исечениот лимон, минат партицип).'
