- type: prompt
  review: true
  ask:
    en: 'Say: “Dear Lord Mayor — and “I am writing to you to ask … — and “I note with regret that … — and “the hall slot — and “cancelled without replacement — and “I would be grateful for a prompt reply
      — and “copied to (cc) — and “the concern, request — and “Yours faithfully (very formal) — and “those affected — and “slice of bread (Saxon) — and “we (Saxon ''mir'') — and “not (Saxon ''ni'') — and
      “home (Saxon ''heeme'') — and “Good grief! (Saxon) — and “the dialect word — and “in standard German — and “pronounced softly — and “really cosy — and “pride in one''s home region — and “the toast”.'
    ar: 'قل: “حضرة رئيس البلدية المحترم — و“أتوجّه إليكم راجيةً … — و“علمتُ بأسف أنّ … — و“وقت القاعة — و“أُلغي دون بديل — و“سأكون ممتنة لردّ قريب — و“نسخة إلى — و“الطلب، الشأن — و“وتفضّلوا بقبول فائق الاحترام
      — و“المتضرّرون — و“شريحة خبز (سكسونية) — و“نحن (mir بالسكسونية) — و“لا (ni بالسكسونية) — و“إلى البيت (heeme) — و“يا للعجب! (سكسونية) — و“كلمة لهجية — و“بالألمانية الفصحى — و“يُنطق بليونة — و“دافئ
      جدًا — و“الاعتزاز بالمنطقة — و“النخب”.'
