    text: Das ist ein weites Feld.
  items:
  - das-ist-ein-weites-feld
- type: narrator
  text:
    en: Theodor Fontane's 'Effi Briest' (1895) tells of a young woman married off to an older man and destroyed by the honour code of Prussian society. Her father's evasive phrase «Das ist ein weites Feld»
      became a German saying for avoiding a difficult question.
    ar: رواية «إيفي بريست» (1895) لتيودور فونتانه تحكي عن شابة زُوّجت لرجل أكبر منها ودمّرها قانون الشرف في المجتمع البروسي. وعبارة والدها المراوغة «Das ist ein weites Feld» صارت قولًا ألمانيًا للتهرّب
      من سؤال صعب.
    mk: „Ефи Брист“ (1895) од Теодор Фонтане раскажува за млада жена омажена за постар човек и уништена од кодексот на честа на пруското општество. Избегнувачката фраза на нејзиниот татко «Das ist ein weites
      Feld» стана германска изрека за избегнување тешко прашање.
