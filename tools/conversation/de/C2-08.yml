steps:
- type: narrator
  text:
    en: The VHS reading circle is discussing Fontane's 'Effi Briest'. Professor Hartmann asks for your view of the narrator. Listen to the conversation; you don't need to understand it yet.
    ar: حلقة القراءة في الجامعة الشعبية تناقش «إيفي بريست» لفونتانه. البروفيسور هارتمان يسألك عن رأيك في الراوي. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Читачкиот круг на народниот универзитет разговара за „Ефи Брист“ од Фонтане. Професорот Хартман ве прашува за раскажувачот. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: hartmann
    text: Wie wirkt der Erzähler auf Sie?
    meaning:
      en: How does the narrator strike you?
      ar: كيف يبدو لك الراوي؟
      mk: Каков ви се чини раскажувачот?
  - speaker: protagonist
    text: Er urteilt nie direkt. Er deutet nur an — wie ein höflicher Beobachter.
    meaning:
      en: He never judges directly. He only hints — like a polite observer.
      ar: لا يحكم مباشرة أبدًا. بل يلمّح فقط — كمراقب مهذّب.
      mk: Никогаш не суди директно. Само навестува — како учтив набљудувач.
  - speaker: lena
    text: Und Effi? Für mich ist sie die tragischste Figur des Romans.
    meaning:
      en: And Effi? For me she's the novel's most tragic character.
      ar: وإيفي؟ بالنسبة لي هي أكثر شخصيات الرواية مأساوية.
      mk: А Ефи? За мене таа е најтрагичниот лик во романот.
  - speaker: protagonist
    text: Sie ist Opfer einer Gesellschaft, in der der Ehrenkodex wichtiger ist als das Leben.
    meaning:
      en: She's the victim of a society in which the code of honour matters more than life.
      ar: إنها ضحية مجتمع يكون فيه قانون الشرف أهم من الحياة.
      mk: Таа е жртва на општество во кое кодексот на честа е поважен од животот.
  - speaker: hartmann
    text: Ein starker Satz. Kennen Sie solche Gesellschaften?
    meaning:
      en: A strong sentence. Do you know such societies?
      ar: جملة قوية. هل تعرف مجتمعات كهذه؟
      mk: Силна реченица. Познавате ли такви општества?
  - speaker: protagonist
    text: Leider ja. Deshalb berührt mich das Buch. Und das Motiv der Schaukel — Freiheit, die endet.
    meaning:
      en: Sadly, yes. That's why the book moves me. And the motif of the swing — freedom that ends.
      ar: للأسف نعم. لذلك يلمسني الكتاب. ودافع الأرجوحة — حرية تنتهي.
      mk: За жал, да. Затоа ме допира книгата. И мотивот на лулашката — слобода што завршува.
  - speaker: lena
    text: Und der Schauplatz, das kleine Kessin am Meer — so eng!
    meaning:
      en: And the setting, little Kessin by the sea — so narrow!
      ar: ومسرح الأحداث، كيسين الصغيرة على البحر — ضيّقة جدًا!
      mk: А местото на дејството, малиот Кесин крај морето — толку тесно!
  - speaker: hartmann
    text: 'Wie Effis Vater sagt: „Das ist ein weites Feld.“ Bis nächste Woche!'
    meaning:
      en: 'As Effi''s father says: ''That''s a big subject.'' Until next week!'
      ar: 'كما يقول والد إيفي: «هذا موضوع واسع.» إلى الأسبوع القادم!'
      mk: 'Како што вели таткото на Ефи: „Тоа е широко поле.“ До следната недела!'
- type: prompt
  ask:
    en: He asks about the narrator.
    ar: يسأل عن الراوي.
    mk: Тој прашува за раскажувачот.
  answer:
