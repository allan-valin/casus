    en: 'Literary talk uses its own vocabulary — «Figur», «Erzähler», «Motiv», «Schauplatz» — and complex sentences: «Opfer einer Gesellschaft, in der der Ehrenkodex wichtiger ist als das Leben».'
    ar: 'الحديث الأدبي له مفرداته — «Figur»، «Erzähler»، «Motiv»، «Schauplatz» — وجمله المركّبة: «Opfer einer Gesellschaft, in der der Ehrenkodex wichtiger ist als das Leben».'
    mk: 'Книжевниот разговор има свој речник — «Figur», «Erzähler», «Motiv», «Schauplatz» — и сложени реченици: «Opfer einer Gesellschaft, in der der Ehrenkodex wichtiger ist als das Leben».'
