steps:
- type: narrator
  text:
    en: An order went wrong. Frau Schröder is blunt. Afterwards, a colleague explains it wasn't anger. Listen to the conversation; you don't need to understand it yet.
    ar: طلبية سارت بشكل خاطئ. السيدة شرودر صريحة جدًا. بعدها يشرح لك زميل أنه لم يكن غضبًا. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Една нарачка тргна наопаку. Госпоѓа Шредер е груба. Потоа колега ви објаснува дека тоа не бил гнев. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: schroeder
    text: Die Bestellung war falsch. Das geht so nicht.
    meaning:
      en: The order was wrong. That won't do.
      ar: الطلبية كانت خاطئة. هذا لا يصلح هكذا.
      mk: Нарачката беше погрешна. Така не оди.
  - speaker: protagonist
    text: Es tut mir leid. Das war mein Fehler.
    meaning:
      en: I'm sorry. That was my mistake.
      ar: أنا آسف. كان ذلك خطئي.
      mk: Ми е жал. Тоа беше моја грешка.
  - speaker: schroeder
    text: Prüfen Sie doch mal die Liste vor dem Senden. Beim nächsten Mal bitte.
    meaning:
      en: Just check the list before sending. Next time, please.
      ar: راجع القائمة قبل الإرسال فقط. في المرة القادمة من فضلك.
      mk: Ајде проверете ја листата пред да ја пратите. Следниот пат, ве молам.
  - speaker: protagonist
    text: Natürlich.
    meaning:
      en: Of course.
      ar: طبعًا.
      mk: Се разбира.
  - speaker: tim
    text: Alles okay? Du siehst blass aus.
    meaning:
      en: All OK? You look pale.
      ar: هل كل شيء بخير؟ تبدو شاحبًا.
      mk: Сè во ред? Изгледаш бледо.
  - speaker: protagonist
    text: Sie war so wütend!
    meaning:
      en: She was so angry!
      ar: كانت غاضبة جدًا!
      mk: Беше толку лута!
  - speaker: tim
    text: Nee, das war nur sachlich. Nicht persönlich. Fehler kommen ja vor.
    meaning:
      en: Nah, that was just matter-of-fact. Not personal. Mistakes happen, you know.
      ar: لا، كان ذلك موضوعيًا فقط. ليس شخصيًا. الأخطاء تحدث كما تعلم.
      mk: Не, тоа беше само деловно. Не лично. Грешки се случуваат, знаеш.
  - speaker: protagonist
    text: Bei uns hätte sie geschrien, wenn sie wütend gewesen wäre.
    meaning:
      en: Where I'm from she'd have shouted if she'd been angry.
      ar: عندنا لكانت صرخت لو كانت غاضبة.
      mk: Кај нас ќе викаше ако беше лута.
  - speaker: tim
    text: Eben. Sie hat nicht geschrien. Sie ist halt so.
    meaning:
      en: Exactly. She didn't shout. That's just how she is.
      ar: بالضبط. لم تصرخ. هي هكذا فقط.
      mk: Токму. Не викаше. Таква е едноставно.
- type: prompt
  ask:
    en: 'She says: that won''t do.'
    ar: 'تقول: هذا لا يصلح هكذا.'
    mk: 'Таа вели: така не оди.'
  answer:
    speaker: protagonist
    text: Das geht so nicht.
  items:
  - das-geht-so-nicht
- type: prompt
  ask:
