- type: narrator
  text:
    en: 'Small particles change the tone: «doch mal» softens an order («Prüfen Sie doch mal…»), «ja» means ''as we both know'', «halt» and «eben» mean ''that''s just how it is''.'
    ar: 'الأدوات الصغيرة تغيّر النبرة: «doch mal» تلطّف الأمر («Prüfen Sie doch mal…»)، و«ja» تعني «كما نعلم كلانا»، و«halt» و«eben» تعنيان «هكذا هو الأمر».'
    mk: 'Малите честички го менуваат тонот: «doch mal» ја омекнува наредбата («Prüfen Sie doch mal…»), «ja» значи „како што двајцата знаеме“, «halt» и «eben» значат „така е едноставно“.'
