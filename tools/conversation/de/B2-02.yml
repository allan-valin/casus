- type: narrator
  text:
    en: A calm, short «Das geht so nicht» is the normal German way to criticise at work — no shouting, no hints. It doesn't mean anger or a threat to your job. Fix the problem and move on.
    ar: عبارة «Das geht so nicht» الهادئة القصيرة هي الطريقة الألمانية المعتادة للانتقاد في العمل — بلا صراخ ولا تلميح. لا تعني غضبًا ولا تهديدًا لوظيفتك. أصلح المشكلة وتابع.
    mk: Мирното, кратко «Das geht so nicht» е нормалниот германски начин на критика на работа — без викање, без навестувања. Не значи гнев ниту закана за работата. Поправете го проблемот и продолжете.
