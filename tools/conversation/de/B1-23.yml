- type: narrator
  text:
    en: Who you vote for is private; many people don't say. Only Germans vote in federal and state elections; EU citizens also vote locally and in European elections. The AfD is the strongest far-right
      party, and parts of it are officially classed as right-wing extremist; right-wing violence is more frequent in some regions. If you are attacked or threatened, Opferberatung services help for free
      and in many languages.
    ar: التصويت أمر شخصي؛ كثيرون لا يقولون لمن يصوّتون. الألمان وحدهم يصوّتون في الانتخابات الاتحادية وانتخابات الولايات؛ ومواطنو الاتحاد الأوروبي يصوّتون أيضًا محليًا وفي الانتخابات الأوروبية. حزب «AfD»
      أقوى أحزاب أقصى اليمين، وأجزاء منه مصنّفة رسميًا يمينية متطرفة؛ والعنف اليميني أكثر تواترًا في بعض المناطق. إذا تعرّضتِ لاعتداء أو تهديد، فخدمات استشارة الضحايا تساعد مجانًا وبلغات كثيرة.
    mk: За кого гласате е приватно; многумина не кажуваат. Само Германците гласаат на сојузните и покраинските избори; граѓаните на ЕУ гласаат и локално и на европските избори. АфД е најсилната крајно десна
      партија, а делови од неа официјално се класифицирани како десничарски екстремни; десничарското насилство е почесто во некои региони. Ако ве нападнат или ви се закануваат, службите Opferberatung помагаат
      бесплатно и на многу јазици.
