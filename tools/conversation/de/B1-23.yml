steps:
- type: narrator
  text:
    en: Election posters everywhere. Lena explains who may vote — and tells you, carefully, where to be careful. Listen to the conversation; you don't need to understand it yet.
    ar: ملصقات الانتخابات في كل مكان. لينا تشرح من يحق له التصويت — وتخبركِ بحذر أين يجب أن تكوني حذرة. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Изборни плакати насекаде. Лена објаснува кој смее да гласа — и внимателно ви кажува каде треба да внимавате. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Darf ich bei der Wahl wählen?
    meaning:
      en: May I vote in the election?
      ar: هل يحق لي التصويت في الانتخابات؟
      mk: Смеам ли да гласам на изборите?
  - speaker: lena
    text: Bei der Bundestagswahl nur mit deutschem Pass. EU-Bürger dürfen bei der Kommunalwahl wählen.
    meaning:
      en: In the federal election only with a German passport. EU citizens may vote in local elections.
      ar: في الانتخابات الاتحادية فقط بجواز ألماني. ومواطنو الاتحاد الأوروبي يحق لهم التصويت في الانتخابات المحلية.
      mk: На сојузните избори само со германски пасош. Граѓаните на ЕУ смеат да гласаат на локалните избори.
  - speaker: protagonist
    text: Und wen würdest du wählen?
    meaning:
      en: And who would you vote for?
      ar: ولمن كنتِ ستصوّتين؟
      mk: А за кого би гласала ти?
  - speaker: lena
    text: Das sagt man hier nicht so gern! Die Wahl ist geheim.
    meaning:
      en: People here don't like saying that! The vote is secret.
      ar: هنا لا يحب الناس قول ذلك! التصويت سرّي.
      mk: Тоа тука не се кажува радо! Гласањето е тајно.
  - speaker: protagonist
    text: Und die Partei auf dem blauen Plakat?
    meaning:
      en: And the party on the blue poster?
      ar: والحزب على الملصق الأزرق؟
      mk: А партијата на синиот плакат?
  - speaker: lena
    text: Die AfD. Teile davon gelten als rechtsextrem. In manchen Gegenden gibt es Angriffe auf Migranten.
    meaning:
      en: The AfD. Parts of it are classed as far-right extremist. In some areas there are attacks on migrants.
      ar: حزب البديل من أجل ألمانيا. أجزاء منه تُصنَّف يمينية متطرفة. في بعض المناطق تقع اعتداءات على المهاجرين.
      mk: АфД. Делови од неа важат за екстремно десни. Во некои краишта има напади врз мигранти.
  - speaker: protagonist
    text: Was würdest du an meiner Stelle machen?
    meaning:
      en: What would you do in my place?
      ar: ماذا كنتِ ستفعلين لو كنتِ مكاني؟
      mk: Што би направила ти на мое место?
  - speaker: lena
    text: 'Sei vorsichtig, aber hab keine Angst. Und wenn etwas passiert: die Opferberatung hilft.'
    meaning:
      en: 'Be careful, but don''t be afraid. And if something happens: victim counselling helps.'
      ar: 'كوني حذرة لكن لا تخافي. وإذا حدث شيء: استشارة الضحايا تساعد.'
      mk: 'Внимавај, но немај страв. И ако се случи нешто: советувалиштето за жртви помага.'
  - speaker: protagonist
    text: Danke. Und am Samstag gehe ich zur Demonstration gegen Rassismus.
    meaning:
      en: Thanks. And on Saturday I'm going to the demonstration against racism.
      ar: شكرًا. ويوم السبت سأذهب إلى المظاهرة ضد العنصرية.
      mk: Благодарам. А во сабота одам на демонстрацијата против расизам.
- type: prompt
  ask:
    en: 'Ask: may I vote in the election?'
    ar: 'اسألي: هل يحق لي التصويت في الانتخابات؟'
    mk: 'Прашајте: смеам ли да гласам на изборите?'
  answer:
    speaker: protagonist
    text: Darf ich bei der Wahl wählen?
  items:
