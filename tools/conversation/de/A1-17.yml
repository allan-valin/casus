    ar: 'تقول: افتحي النافذة تمامًا.'
    mk: 'Таа вели: отворете го прозорецот целосно.'
  answer:
    speaker: protagonist
    text: Machen Sie das Fenster ganz auf.
  items:
  - machen-sie
  - das-fenster
  - ganz-auf
