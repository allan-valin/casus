steps:
- type: narrator
  text:
    en: January, minus five. Frau Becker sees your windows always closed — and the damp in the corner. Listen to the conversation; you don't need to understand it yet.
    ar: يناير، خمس درجات تحت الصفر. السيدة بيكر ترى نوافذك مغلقة دائمًا — والرطوبة في الزاوية. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Јануари, минус пет. Госпоѓа Бекер гледа дека прозорците ви се секогаш затворени — и влагата во аголот. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: becker
    text: Guten Morgen! Lüften Sie nicht?
    meaning:
      en: Good morning! Don't you air the flat?
      ar: صباح الخير! ألا تهوّين الشقة؟
      mk: Добро утро! Не проветрувате ли?
  - speaker: protagonist
    text: Lüften? Es ist so kalt!
    meaning:
      en: Air it? It's so cold!
      ar: أهوّيها؟ الجو بارد جدًا!
      mk: Да проветрувам? Толку е ладно!
  - speaker: becker
    text: Sehen Sie die Ecke? Das ist Schimmel. Die Wohnung ist feucht.
    meaning:
      en: See the corner? That's mould. The flat is damp.
      ar: هل ترين الزاوية؟ هذا عفن. الشقة رطبة.
      mk: Го гледате аголот? Тоа е мувла. Станот е влажен.
  - speaker: protagonist
    text: Was soll ich machen?
    meaning:
      en: What should I do?
      ar: ماذا أفعل؟
      mk: Што да правам?
  - speaker: becker
    text: Machen Sie das Fenster ganz auf. Fünf Minuten, zweimal am Tag.
    meaning:
      en: Open the window wide. Five minutes, twice a day.
      ar: افتحي النافذة تمامًا. خمس دقائق، مرتين في اليوم.
      mk: Отворете го прозорецот целосно. Пет минути, двапати на ден.
  - speaker: protagonist
    text: Und die Heizung?
    meaning:
      en: And the heating?
      ar: والتدفئة؟
      mk: А греењето?
  - speaker: becker
    text: Die Heizung machen Sie dann aus.
    meaning:
      en: Turn the heating off for that time.
      ar: أطفئي التدفئة في هذه المدة.
      mk: Греењето тогаш исклучете го.
  - speaker: protagonist
    text: Und das Fenster kippen?
    meaning:
      en: And tilting the window?
      ar: وأميل النافذة؟
      mk: А да го накосам прозорецот?
  - speaker: becker
    text: Lieber nicht. Das kostet nur Heizung.
    meaning:
      en: Better not. That only wastes heating.
      ar: الأفضل لا. هذا يهدر التدفئة فقط.
      mk: Подобро не. Тоа само троши греење.
- type: prompt
  ask:
    en: 'She asks: don''t you air the flat?'
    ar: 'تسأل: ألا تهوّين الشقة؟'
    mk: 'Таа прашува: не проветрувате ли?'
  answer:
    speaker: protagonist
    text: Lüften Sie nicht?
  items:
  - lueften
