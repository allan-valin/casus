- type: narrator
  text:
    en: '«Stoßlüften»: windows wide open for a few minutes, several times a day, even in deep winter — it changes the air without cooling the walls, and stops mould. A tilted window all day only cools the
      room and wastes heating.'
    ar: '«Stoßlüften»: النوافذ مفتوحة تمامًا لبضع دقائق، عدة مرات في اليوم، حتى في عزّ الشتاء — يتجدّد الهواء دون أن تبرد الجدران، فلا يتكوّن العفن. أما النافذة المائلة طوال اليوم فتبرّد الغرفة وتهدر التدفئة
      فقط.'
    mk: '«Stoßlüften»: прозорците широко отворени неколку минути, неколку пати на ден, дури и во најлута зима — воздухот се менува без ѕидовите да изладат, па нема мувла. Накосен прозорец цел ден само ја
      лади собата и троши греење.'
- type: narrator
  for:
  - mk
  text:
    mk: Да, ова е токму промајата од која се плашиме дома. Германците сметаат дека кратката промаја е здрава — а мувлата е опасна. Ако ве плаши, излезете од собата за тие пет минути.
