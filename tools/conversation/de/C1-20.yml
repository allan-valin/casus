steps:
- type: narrator
  text:
    en: Svenja and Jonas have a baby girl. You visit on day five — the midwife is just there. Listen to the conversation; you don't need to understand it yet.
    ar: سفينيا ويوناس رُزقا بطفلة. تزورهم في اليوم الخامس — والقابلة هناك للتو. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Свења и Јонас добија ќерка. Ги посетувате петтиот ден — бабицата е токму таму. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Herzlichen Glückwunsch zur Geburt! Wie heißt sie?
    meaning:
      en: Congratulations on the birth! What's her name?
      ar: مبروك المولودة! ما اسمها؟
      mk: Честитки за раѓањето! Како се вика?
  - speaker: svenja
    text: Emma. Sie wurde am Montag geboren, um drei Uhr nachts.
    meaning:
      en: Emma. She was born on Monday, at three in the morning.
      ar: إيما. وُلدت يوم الاثنين في الثالثة فجرًا.
      mk: Ема. Родена е во понеделник, во три по полноќ.
  - speaker: hebamme
    text: So, Emma wird jetzt gewogen. ... Sehr gut, sie hat schon zugenommen.
    meaning:
      en: Right, Emma's being weighed now. ... Very good, she's already gained weight.
      ar: حسنًا، الآن تُوزن إيما. ... ممتاز، لقد زاد وزنها بالفعل.
      mk: Така, Ема сега се мери. ... Многу добро, веќе се здебели.
  - speaker: protagonist
    text: Kommt die Hebamme jeden Tag?
    meaning:
      en: Does the midwife come every day?
      ar: هل تأتي القابلة كل يوم؟
      mk: Дали бабицата доаѓа секој ден?
  - speaker: hebamme
    text: Im Wochenbett regelmäßig, ja. Das wird von der Krankenkasse bezahlt.
    meaning:
      en: During the first weeks regularly, yes. It's paid by the health insurance.
      ar: في فترة النفاس بانتظام، نعم. يدفع ذلك التأمين الصحي.
      mk: Во бабињето редовно, да. Тоа го плаќа здравствената каса.
  - speaker: jonas
    text: Und Emma ist schon beim Standesamt angemeldet. Die Geburtsurkunde kam gestern.
    meaning:
      en: And Emma's already registered at the registry office. The birth certificate came yesterday.
      ar: وإيما مسجّلة بالفعل في مكتب السجل المدني. شهادة الميلاد وصلت أمس.
      mk: А Ема е веќе пријавена во матичното. Изводот стигна вчера.
  - speaker: protagonist
    text: Bei uns kommt nach der Geburt die ganze Familie für Wochen.
    meaning:
      en: With us the whole family comes for weeks after a birth.
      ar: عندنا تأتي العائلة كلها لأسابيع بعد الولادة.
      mk: Кај нас по раѓањето доаѓа цело семејство со недели.
  - speaker: svenja
    text: Hier ist es ruhiger. Aber ein Essen vor der Tür wäre toll!
    meaning:
      en: Here it's quieter. But a meal left at the door would be great!
      ar: هنا الأمر أهدأ. لكن وجبة أمام الباب ستكون رائعة!
      mk: Тука е помирно. Но оброк пред вратата би бил одличен!
- type: prompt
  ask:
    en: Congratulate on the birth.
    ar: هنّئ بالمولودة.
    mk: Честитајте за раѓањето.
  answer:
    speaker: protagonist
    text: Herzlichen Glückwunsch zur Geburt!
  items:
  - herzlichen-glueckwunsch-geburt
- type: prompt
  ask:
    en: 'She says: she was born on Monday.'
    ar: 'تقول: وُلدت يوم الاثنين.'
    mk: 'Таа вели: родена е во понеделник.'
  answer:
    speaker: protagonist
    text: Sie wurde am Montag geboren.
  items:
  - wurde-geboren
  - die-geburt
- type: narrator
  text:
    en: 'Passive forms around a birth: «wurde geboren» (was born — past), «wird gewogen» (is being weighed — process), «ist angemeldet» (is registered — state), «wird bezahlt» (is paid).'
    ar: 'صيغ المبني للمجهول حول الولادة: «wurde geboren» (وُلدت — ماضٍ)، «wird gewogen» (تُوزن — عملية)، «ist angemeldet» (مسجّلة — حالة)، «wird bezahlt» (يُدفع).'
    mk: 'Пасивни форми околу раѓање: «wurde geboren» (е родена — минато), «wird gewogen» (се мери — процес), «ist angemeldet» (е пријавена — состојба), «wird bezahlt» (се плаќа).'
