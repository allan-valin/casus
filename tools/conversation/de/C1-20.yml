- type: narrator
  text:
    en: Every mother has a right to a midwife before and after birth, paid by health insurance — but midwives are scarce, so look for one early in pregnancy. The birth is registered at the registry office
      within a week; then apply for Kindergeld and Elterngeld. Visits in the first weeks are short and announced; bringing food is very welcome.
    ar: لكل أم الحق في قابلة قبل الولادة وبعدها، يدفعها التأمين الصحي — لكن القابلات قليلات، فابحثوا عن واحدة مبكرًا في الحمل. وتُسجَّل الولادة في مكتب السجل المدني خلال أسبوع؛ ثم يُقدَّم طلب علاوة الأطفال
      وعلاوة الوالدين. والزيارات في الأسابيع الأولى قصيرة ومُعلَن عنها مسبقًا؛ وإحضار الطعام مرحَّب به جدًا.
    mk: Секоја мајка има право на бабица пред и по раѓањето, платена од касата — но бабиците се малку, па барајте рано во бременоста. Раѓањето се пријавува во матичното во рок од една недела; потоа се бара
      Kindergeld и Elterngeld. Посетите во првите недели се кратки и најавени; донесувањето храна е многу добредојдено.
