steps:
- type: narrator
  text:
    en: June. Light at four in the morning, still light at ten at night. Then a heat wave. Listen to the conversation; you don't need to understand it yet.
    ar: يونيو. الضوء في الرابعة صباحًا، وما زال النهار في العاشرة ليلًا. ثم موجة حرّ. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Јуни. Светло во четири наутро, сѐ уште светло во десет навечер. Потоа топлотен бран. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Es ist zehn Uhr abends und noch hell!
    meaning:
      en: It's ten in the evening and still light!
      ar: الساعة العاشرة مساءً وما زال الجو مضيئًا!
      mk: Десет навечер е, а уште е светло!
  - speaker: jonas
    text: Im Juni sind die Tage am längsten. Die Nacht ist kurz.
    meaning:
      en: In June the days are longest. The night is short.
      ar: في يونيو الأيام هي الأطول. والليل قصير.
      mk: Во јуни деновите се најдолги. Ноќта е кратка.
  - speaker: protagonist
    text: Und diese Hitze! Heißer als bei mir zu Hause.
    meaning:
      en: And this heat! Hotter than at home.
      ar: وهذا الحرّ! أحرّ مما في بلدي.
      mk: А оваа жештина! Пожешко отколку дома.
  - speaker: jonas
    text: Fünfunddreißig Grad. Ich schwitze nur.
    meaning:
      en: Thirty-five degrees. I'm just sweating.
      ar: خمس وثلاثون درجة. لا أفعل إلا العرق.
      mk: Триесет и пет степени. Само се потам.
  - speaker: protagonist
    text: Hast du eine Klimaanlage?
    meaning:
      en: Do you have air conditioning?
      ar: هل عندك مكيّف؟
      mk: Имаш ли клима?
  - speaker: jonas
    text: Nein, keine Klimaanlage. Fast niemand hat eine.
    meaning:
      en: No, no air conditioning. Almost nobody has one.
      ar: لا، لا مكيّف. تقريبًا لا أحد عنده.
      mk: Не, нема клима. Речиси никој нема.
  - speaker: protagonist
    text: Dann kaufe ich einen Ventilator.
    meaning:
      en: Then I'll buy a fan.
      ar: إذن سأشتري مروحة.
      mk: Тогаш ќе купам вентилатор.
  - speaker: jonas
    text: Viel Glück — die Ventilatoren sind überall ausverkauft!
    meaning:
      en: Good luck — fans are sold out everywhere!
      ar: حظًا موفقًا — المراوح نفدت في كل مكان!
      mk: Среќно — вентилаторите се распродадени насекаде!
  - speaker: protagonist
    text: Und wie schläfst du?
    meaning:
      en: And how do you sleep?
      ar: وكيف تنام؟
      mk: А како спиеш?
  - speaker: jonas
    text: Tagsüber die Vorhänge zu, nachts die Fenster auf.
    meaning:
      en: Curtains closed by day, windows open at night.
      ar: الستائر مغلقة نهارًا، والنوافذ مفتوحة ليلًا.
      mk: Дење завесите затворени, ноќе прозорците отворени.
