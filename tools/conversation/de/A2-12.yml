- type: narrator
  text:
    en: Summer days are very long — light from about four to ten. Heat waves now reach the high thirties, but homes have no air conditioning, and fans sell out fast. Many people buy blackout curtains to
      sleep.
    ar: أيام الصيف طويلة جدًا — ضوء من الرابعة تقريبًا حتى العاشرة. وموجات الحرّ تبلغ الآن أواخر الثلاثينات، لكن البيوت بلا مكيّفات، والمراوح تنفد سريعًا. كثيرون يشترون ستائر معتمة للنوم.
    mk: Летните денови се многу долги — светло од околу четири до десет. Топлотните бранови сега достигнуваат кон четириесет, но домовите немаат клима, а вентилаторите брзо се распродаваат. Многумина купуваат
      темни завеси за спиење.
