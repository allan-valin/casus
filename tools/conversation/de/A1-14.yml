steps:
- type: narrator
  text:
    en: You carry one big bag down to the bins. Frau Becker stops you. Listen to the conversation; you don't need to understand it yet.
    ar: تنزل كيسًا كبيرًا واحدًا إلى الحاويات. السيدة بيكر توقفك. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Носите една голема кеса до контејнерите. Госпоѓа Бекер ве запира. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: becker
    text: Moment mal! Ist das alles zusammen?
    meaning:
      en: Hang on! Is that all together?
      ar: لحظة! هل هذا كله معًا؟
      mk: Чекајте малку! Сето ова е заедно?
  - speaker: protagonist
    text: Ja, das ist der Müll.
    meaning:
      en: Yes, that's the rubbish.
      ar: نعم، هذه النفايات.
      mk: Да, ова е ѓубрето.
  - speaker: becker
    text: Hier trennen wir den Müll. Plastik kommt in die gelbe Tonne.
    meaning:
      en: Here we sort the rubbish. Plastic goes in the yellow bin.
      ar: هنا نفرز النفايات. البلاستيك في الحاوية الصفراء.
      mk: Тука го одвојуваме ѓубрето. Пластиката оди во жолтиот контејнер.
  - speaker: protagonist
    text: Und das Papier?
    meaning:
      en: And the paper?
      ar: والورق؟
      mk: А хартијата?
  - speaker: becker
    text: Papier in die blaue. Biomüll in die braune.
    meaning:
      en: Paper in the blue one. Food waste in the brown one.
      ar: الورق في الزرقاء. والنفايات العضوية في البنية.
      mk: Хартијата во синиот. Органскиот отпад во кафеавиот.
  - speaker: protagonist
    text: Und der Rest?
    meaning:
      en: And the rest?
      ar: والباقي؟
      mk: А остатокот?
  - speaker: becker
    text: Restmüll in die graue. Und das Glas — bringen Sie es zum Container an der Ecke.
    meaning:
      en: General waste in the grey one. And the glass — take it to the container on the corner.
      ar: بقية النفايات في الرمادية. والزجاج — خذه إلى الحاوية عند الزاوية.
      mk: Останатото во сивиот. А стаклото — однесете го до контејнерот на аголот.
  - speaker: protagonist
    text: So viele Farben!
    meaning:
      en: So many colours!
      ar: ألوان كثيرة جدًا!
      mk: Толку многу бои!
  - speaker: becker
    text: Sie lernen das schnell. Trennen Sie bitte immer.
    meaning:
      en: You'll learn it fast. Please always sort.
      ar: ستتعلّم ذلك بسرعة. افرز دائمًا من فضلك.
      mk: Брзо ќе научите. Секогаш одвојувајте, ве молам.
- type: prompt
  ask:
    en: 'She stops you: hang on!'
    ar: 'توقفك: لحظة!'
    mk: 'Ве запира: чекајте малку!'
  answer:
    speaker: protagonist
    text: Moment mal!
  items:
  - moment-mal
