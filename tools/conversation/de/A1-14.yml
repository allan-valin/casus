    en: 'Sorting is taken seriously: neighbours notice the wrong bin. Glass goes by colour to street containers, and not on Sundays or late in the evening — the noise.'
    ar: 'الفرز أمر جدي: الجيران يلاحظون الحاوية الخطأ. والزجاج يُرمى حسب لونه في حاويات الشارع، لا يوم الأحد ولا في وقت متأخر من المساء — بسبب الضجيج.'
    mk: 'Одвојувањето е сериозна работа: соседите забележуваат погрешен контејнер. Стаклото се фрла по боја во уличните контејнери, не во недела и не доцна навечер — поради бучавата.'
