steps:
- type: narrator
  text:
    en: Your old landlord kept the deposit. You sued at the local court. The judge proposes a settlement. Listen to the conversation; you don't need to understand it yet.
    ar: مؤجّرك القديم احتفظ بالتأمين. رفعتَ دعوى في المحكمة المحلية. القاضية تقترح تسوية. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Поранешниот станодавец го задржа депозитот. Поднесовте тужба на основниот суд. Судијката предлага порамнување. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: richterin
    text: Ich eröffne die mündliche Verhandlung. Kläger ist der frühere Mieter, Beklagter der Vermieter.
    meaning:
      en: I open the oral hearing. The plaintiff is the former tenant, the defendant the landlord.
      ar: أفتتح الجلسة الشفهية. المدّعي هو المستأجر السابق، والمدّعى عليه المؤجِّر.
      mk: Ја отворам усната расправа. Тужител е поранешниот станар, тужен е станодавецот.
  - speaker: richterin
    text: 'Zum Sachverhalt: Der Kläger verlangt die Rückzahlung der Kaution.'
    meaning:
      en: 'On the facts: the plaintiff demands repayment of the deposit.'
      ar: 'عن وقائع القضية: المدّعي يطالب بردّ التأمين.'
      mk: 'За фактичката состојба: тужителот бара враќање на депозитот.'
  - speaker: verwaltung
    text: Die Wohnung war in schlechtem Zustand. Wir mussten renovieren.
    meaning:
      en: The flat was in poor condition. We had to renovate.
      ar: كانت الشقة في حالة سيئة. اضطررنا إلى الترميم.
      mk: Станот беше во лоша состојба. Моравме да реновираме.
  - speaker: protagonist
    text: 'Frau Vorsitzende, hier ist das Übergabeprotokoll: keine Schäden, nur normale Abnutzung.'
    meaning:
      en: 'Madam Chair, here''s the handover report: no damage, only normal wear and tear.'
      ar: 'سيدتي الرئيسة، هذا محضر التسليم: لا أضرار، فقط استهلاك عادي.'
      mk: 'Госпоѓо претседателке, еве го записникот за предавање: без штети, само нормално абење.'
  - speaker: richterin
    text: 'Das Protokoll spricht für den Kläger. Ich schlage einen Vergleich vor: achtzig Prozent zurück.'
    meaning:
      en: 'The report favours the plaintiff. I propose a settlement: eighty per cent back.'
      ar: 'المحضر في صالح المدّعي. أقترح تسوية: ثمانون بالمئة تُردّ.'
      mk: 'Записникот е во корист на тужителот. Предлагам порамнување: осумдесет проценти назад.'
  - speaker: protagonist
    text: Und wer trägt die Kosten?
    meaning:
      en: And who bears the costs?
      ar: ومن يتحمّل التكاليف؟
      mk: А кој ги сноси трошоците?
  - speaker: richterin
    text: Bei einem Vergleich teilen Sie sie. Ohne Vergleich entscheide ich — mit offenem Ausgang.
    meaning:
      en: In a settlement you share them. Without a settlement I decide — with an open outcome.
      ar: في التسوية تتقاسمونها. وبلا تسوية أقرّر أنا — والنتيجة مفتوحة.
      mk: Со порамнување ги делите. Без порамнување одлучувам јас — со неизвесен исход.
  - speaker: protagonist
    text: Dann nehme ich den Vergleich an.
    meaning:
      en: Then I accept the settlement.
      ar: إذن أقبل التسوية.
      mk: Тогаш го прифаќам порамнувањето.
- type: prompt
  ask:
    en: 'Say: the local court.'
    ar: 'قل: المحكمة المحلية.'
    mk: 'Кажете: основниот суд.'
  answer:
    speaker: protagonist
    text: Das Amtsgericht.
  items:
  - das-amtsgericht
- type: prompt
  ask:
    en: 'Say: the oral hearing.'
    ar: 'قل: الجلسة الشفهية.'
    mk: 'Кажете: усната расправа.'
  answer:
