    text: Die mündliche Verhandlung.
  items:
  - die-verhandlung
- type: narrator
  text:
    en: 'Legal register names roles, not people: «der Kläger» (plaintiff), «der Beklagte» (defendant), «der Sachverhalt» (the facts), and speaks of «die Rückzahlung der Kaution» rather than ''giving the
      money back''. Address the judge as «Frau Vorsitzende» / «Herr Vorsitzender».'
    ar: 'الأسلوب القانوني يسمّي الأدوار لا الأشخاص: «der Kläger» (المدّعي)، «der Beklagte» (المدّعى عليه)، «der Sachverhalt» (الوقائع)، ويقول «die Rückzahlung der Kaution» بدلًا من «إرجاع المال». وتُخاطَب
      القاضية بـ«Frau Vorsitzende» / والقاضي بـ«Herr Vorsitzender».'
    mk: 'Правниот регистар ги именува улогите, не луѓето: «der Kläger» (тужител), «der Beklagte» (тужен), «der Sachverhalt» (фактите), и вели «die Rückzahlung der Kaution» наместо „враќање на парите“. На
      судијата се обраќа со «Frau Vorsitzende» / «Herr Vorsitzender».'
- type: prompt
  ask:
    en: 'Say: the plaintiff and the defendant.'
    ar: 'قل: المدّعي والمدّعى عليه.'
    mk: 'Кажете: тужителот и тужениот.'
  answer:
