- type: narrator
  text:
    en: Small claims go to the Amtsgericht; below a certain amount you don't need a lawyer. Judges almost always propose a settlement (Vergleich) first — it's quick and cheaper. Legal-expenses insurance
      or the tenants' association often covers costs; people on low incomes can get legal aid (Prozesskostenhilfe).
    ar: الدعاوى الصغيرة تذهب إلى المحكمة المحلية (Amtsgericht)؛ وتحت مبلغ معيّن لا تحتاج محاميًا. والقضاة يقترحون أولًا تسوية (Vergleich) دائمًا تقريبًا — فهي سريعة وأرخص. وتأمين الحماية القانونية أو جمعية
      المستأجرين يغطّي غالبًا التكاليف؛ وذوو الدخل المنخفض يمكنهم الحصول على المساعدة القضائية (Prozesskostenhilfe).
    mk: Малите спорови одат на Amtsgericht; под одреден износ не ви треба адвокат. Судиите речиси секогаш прво предлагаат порамнување (Vergleich) — брзо е и поевтино. Осигурувањето за правна заштита или
      здружението на станари често ги покрива трошоците; луѓето со ниски примања можат да добијат правна помош (Prozesskostenhilfe).
