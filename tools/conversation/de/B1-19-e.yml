steps:
- type: narrator
  text:
    en: Omid, from your seminar, came from Afghanistan as a refugee. Over coffee he tells you how he arrived. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Omid, wie bist du nach Deutschland gekommen?
    meaning:
      en: Omid, how did you come to Germany?
  - speaker: omid
    text: Mit sechzehn, allein. Ich kam im Winter an.
    meaning:
      en: At sixteen, alone. I arrived in winter.
  - speaker: protagonist
    text: Wo hast du gewohnt?
    meaning:
      en: Where did you live?
  - speaker: omid
    text: Zuerst in einer Unterkunft mit vielen Leuten. Das Asylverfahren dauerte lange.
    meaning:
      en: First in a shelter with lots of people. The asylum procedure took a long time.
  - speaker: protagonist
    text: Und dann?
    meaning:
      en: And then?
  - speaker: omid
    text: Nach der Anerkennung zog ich in eine WG um. Ich habe das Abitur nachgeholt.
    meaning:
      en: After recognition I moved into a flat-share. I caught up on my school-leaving exams.
  - speaker: protagonist
    text: Und jetzt studierst du Informatik. Das ist toll!
    meaning:
      en: And now you're studying computer science. That's great!
  - speaker: omid
    text: Ja. Ich habe ganz unten angefangen. Heute bin ich stolz.
    meaning:
      en: Yes. I started right at the bottom. Today I'm proud.
