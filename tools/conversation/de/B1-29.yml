steps:
- type: narrator
  text:
    en: A barbecue in the courtyard. Paul from Munich and Frau Becker, who grew up in the GDR, start arguing about the Soli. Listen to the conversation; you don't need to understand it yet.
    ar: حفلة شواء في الفناء. باول القادم من ميونخ والسيدة بيكر التي نشأت في ألمانيا الشرقية يبدآن جدالًا حول ضريبة التضامن. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Скара во дворот. Паул од Минхен и госпоѓа Бекер, која пораснала во ГДР, почнуваат да се расправаат за Soli. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: paul
    text: Wir im Westen haben den Osten mit dem Soli bezahlt!
    meaning:
      en: We in the West paid for the East with the Soli!
      ar: نحن في الغرب دفعنا ثمن الشرق بضريبة التضامن!
      mk: Ние на Запад го плативме Истокот со Soli!
  - speaker: becker
    text: Unsinn! Der Soli wurde im Osten genauso bezahlt. Von mir auch!
    meaning:
      en: Nonsense! The Soli was paid in the East just the same. By me too!
      ar: هراء! ضريبة التضامن دُفعت في الشرق أيضًا بالقدر نفسه. وأنا دفعتُها أيضًا!
      mk: Глупости! Soli се плаќаше и на Исток исто така. И јас го плаќав!
  - speaker: protagonist
    text: Wann wurde er eingeführt?
    meaning:
      en: When was it introduced?
      ar: متى فُرضت؟
      mk: Кога беше воведен?
  - speaker: becker
    text: Nach der Wende, 1991. Die Mauer wurde 1989 geöffnet — ich stand selbst auf der Straße.
    meaning:
      en: After the Wende, in 1991. The Wall was opened in 1989 — I was out on the street myself.
      ar: بعد التحوّل، عام 1991. فُتح الجدار عام 1989 — وكنتُ أنا نفسي في الشارع.
      mk: По преломот, 1991. Ѕидот беше отворен 1989 — јас самата бев на улица.
  - speaker: paul
    text: Okay. Aber heute zahlen ihn fast nur noch Reiche und Firmen.
    meaning:
      en: OK. But today almost only the rich and companies pay it.
      ar: حسنًا. لكن اليوم يدفعها الأغنياء والشركات تقريبًا فقط.
      mk: Добро. Но денес го плаќаат речиси само богатите и фирмите.
  - speaker: becker
    text: Und die Gehälter im Osten sind immer noch niedriger. Das ist kein Vorurteil.
    meaning:
      en: And salaries in the East are still lower. That's not a prejudice.
      ar: والرواتب في الشرق ما زالت أقل. هذا ليس حكمًا مسبقًا.
      mk: А платите на Исток се сѐ уште пониски. Тоа не е предрасуда.
  - speaker: protagonist
    text: Und im Süden sind die großen Firmen, oder?
    meaning:
      en: And the big companies are in the south, aren't they?
      ar: والشركات الكبيرة في الجنوب، أليس كذلك؟
      mk: А големите фирми се на југ, нели?
  - speaker: paul
    text: Stimmt. Ossi, Wessi — es gibt auch Nord und Süd!
    meaning:
      en: True. Ossi, Wessi — there's north and south too!
      ar: صحيح. شرقي، غربي — وهناك شمال وجنوب أيضًا!
      mk: Точно. Оси, Веси — има и север и југ!
  - speaker: protagonist
    text: Beide Seiten haben recht. Und jetzt grillen wir weiter!
    meaning:
      en: Both sides are right. And now let's get on with the barbecue!
      ar: الطرفان على حق. والآن نواصل الشواء!
      mk: Двете страни се во право. А сега продолжуваме со скарата!
