- type: narrator
  text:
    en: 'Germany has its own divides. The Soli was paid in East and West alike; today mostly high earners and companies pay it — check the current rule. Wages in the East are still lower on average, and
      the newer gap runs north–south: most big companies and the highest wages are in the south and west. ''Ossi'' and ''Wessi'' are colloquial and can sting — use them only as jokes among friends.'
    ar: 'لألمانيا انقساماتها الخاصة. ضريبة التضامن دُفعت في الشرق والغرب على السواء؛ واليوم يدفعها غالبًا أصحاب الدخل المرتفع والشركات — تحقّقي من القاعدة الحالية. الأجور في الشرق ما زالت أقل في المتوسط،
      والفجوة الأحدث بين الشمال والجنوب: معظم الشركات الكبيرة وأعلى الأجور في الجنوب والغرب. و«Ossi» و«Wessi» كلمتان عاميتان قد تجرحان — استعمليهما مزاحًا بين الأصدقاء فقط.'
    mk: 'Германија има свои поделби. Soli се плаќаше и на Исток и на Запад; денес главно го плаќаат луѓето со високи примања и фирмите — проверете го тековното правило. Платите на Исток се во просек сѐ
      уште пониски, а поновиот јаз е север–југ: повеќето големи фирми и највисоките плати се на југ и запад. „Ossi“ и „Wessi“ се разговорни и можат да навредат — користете ги само како шега меѓу пријатели.'
