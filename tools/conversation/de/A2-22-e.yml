steps:
- type: narrator
  text:
    en: A first date with someone from your course. At the end comes the bill. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: kasse
    text: Zusammen oder getrennt?
    meaning:
      en: Together or separately?
  - speaker: protagonist
    text: Soll ich bezahlen?
    meaning:
      en: Shall I pay?
  - speaker: mia
    text: Getrennt, bitte. Das ist normal.
    meaning:
      en: Separately, please. That's normal.
  - speaker: protagonist
    text: Okay. Aber den Kaffee — ich lade dich ein.
    meaning:
      en: OK. But the coffee — it's on me.
  - speaker: mia
    text: Danke! Dann das nächste Mal ich.
    meaning:
      en: Thanks! Then next time it's me.
  - speaker: protagonist
    text: Es war ein schöner Abend.
    meaning:
      en: It was a lovely evening.
  - speaker: mia
    text: Ja, es war schön. Gerne wieder.
    meaning:
      en: Yes, it was lovely. Happy to do it again.
  - speaker: protagonist
    text: Wann sehen wir uns wieder?
    meaning:
      en: When will we see each other again?
  - speaker: mia
    text: Schreib mir!
    meaning:
      en: Text me!
