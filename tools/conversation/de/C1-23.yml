- type: narrator
  text:
    en: 'Modal verbs to weigh claims: «Das dürfte gegen das Gesetz verstoßen» (is likely to), «Er will nichts gewusst haben» (claims — she doubts it), «Er soll das öfter machen» (is said to — hearsay).'
    ar: 'أفعال مساعدة لوزن الادّعاءات: «Das dürfte gegen das Gesetz verstoßen» (يُرجَّح)، «Er will nichts gewusst haben» (يزعم — وهي تشكّ)، «Er soll das öfter machen» (يُقال — نقلًا).'
    mk: 'Модални глаголи за проценка на тврдења: «Das dürfte gegen das Gesetz verstoßen» (веројатно), «Er will nichts gewusst haben» (тврди — таа се сомнева), «Er soll das öfter machen» (наводно — од слушање).'
