- type: narrator
  text:
    en: The Equal Treatment Act (AGG) forbids discrimination by origin, religion, sex and more in housing and work. A matched application — same profile, a German name — is accepted as evidence. Claims
      must be made in writing within two months. Free anti-discrimination advice centres help with letters and next steps; the first-day version of this topic was A1-25.
    ar: قانون المساواة في المعاملة (AGG) يمنع التمييز بسبب الأصل والدين والجنس وغيرها في السكن والعمل. والطلب الاختباري المقارن — الملف نفسه باسم ألماني — يُقبل دليلًا. ويجب تقديم المطالبات كتابيًا خلال
      شهرين. ومراكز استشارات مكافحة التمييز المجانية تساعد في الرسائل والخطوات التالية.
    mk: Законот за еднаков третман (AGG) забранува дискриминација по потекло, религија, пол и друго во домувањето и работата. Тест-пријава — ист профил, германско име — се прифаќа како доказ. Барањата се
      поднесуваат писмено во рок од два месеци. Бесплатните советувалишта против дискриминација помагаат со писмата и следните чекори.
