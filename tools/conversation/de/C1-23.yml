steps:
- type: narrator
  text:
    en: 'You applied for a flat: no reply. Svenja applied for the same flat with her German name: invited at once. You go to the anti-discrimination advice centre. Listen to the conversation; you don''t
      need to understand it yet.'
    ar: 'تقدّمتِ لشقة: لا رد. سفينيا تقدّمت للشقة نفسها باسمها الألماني: دُعيت فورًا. تذهبين إلى مركز استشارات مكافحة التمييز. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.'
    mk: 'Се пријавивте за стан: нема одговор. Свења се пријави за истиот стан со германското име: веднаш поканета. Одите во советувалиштето против дискриминација. Слушнете го разговорот; уште не мора да
      го разберете.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: Ich bekam keine Antwort. Meine Freundin Svenja bekam sofort eine Einladung — für dieselbe Wohnung.
    meaning:
      en: I got no reply. My friend Svenja got an invitation straight away — for the same flat.
      ar: لم أتلقَّ ردًا. صديقتي سفينيا تلقّت دعوة فورًا — للشقة نفسها.
      mk: Не добив одговор. Мојата пријателка Свења веднаш доби покана — за истиот стан.
  - speaker: beraterin
    text: Das ist ein starkes Indiz. Das dürfte gegen das Gleichbehandlungsgesetz verstoßen.
    meaning:
      en: That's strong circumstantial evidence. That is likely to violate the Equal Treatment Act.
      ar: هذه قرينة قوية. يُرجَّح أنّ ذلك يخالف قانون المساواة في المعاملة.
      mk: Тоа е силна индиција. Тоа веројатно го прекршува законот за еднаков третман.
  - speaker: protagonist
    text: Der Vermieter sagt, die Wohnung sei schon vergeben gewesen.
    meaning:
      en: The landlord says the flat had already been taken.
      ar: المؤجِّر يقول إنّ الشقة كانت محجوزة بالفعل.
      mk: Станодавецот вели дека станот веќе бил даден.
  - speaker: beraterin
    text: Er will davon nichts gewusst haben? Aber Ihre Freundin wurde danach eingeladen. Er soll das übrigens öfter machen.
    meaning:
      en: He claims to have known nothing? But your friend was invited after you. He's said to do this often, by the way.
      ar: يزعم أنه لم يعلم شيئًا؟ لكن صديقتكِ دُعيت بعدكِ. ويُقال بالمناسبة إنه يفعل ذلك كثيرًا.
      mk: Тврди дека ништо не знаел? Но вашата пријателка беше поканета потоа. Патем, наводно тоа често го прави.
  - speaker: protagonist
    text: Was kann ich tun?
    meaning:
      en: What can I do?
      ar: ماذا يمكنني أن أفعل؟
      mk: Што можам да направам?
  - speaker: beraterin
    text: Sie können eine Entschädigung schriftlich geltend machen — innerhalb von zwei Monaten. Wir helfen beim Brief.
    meaning:
      en: You can claim compensation in writing — within two months. We'll help with the letter.
      ar: يمكنكِ المطالبة بتعويض كتابيًا — خلال شهرين. سنساعدكِ في الرسالة.
      mk: Можете писмено да барате обештетување — во рок од два месеци. Ќе ви помогнеме со писмото.
  - speaker: protagonist
    text: Ich will keine Wohnung von ihm. Aber er soll es nicht wieder tun.
    meaning:
      en: I don't want a flat from him. But he shouldn't do it again.
      ar: لا أريد شقة منه. لكن يجب ألّا يكرّر ذلك.
      mk: Не сакам стан од него. Но не треба повторно да го прави тоа.
  - speaker: beraterin
    text: Genau dafür ist die Beschwerde da. Sie sind nicht allein.
    meaning:
      en: That's exactly what the complaint is for. You're not alone.
      ar: لهذا بالضبط وُجدت الشكوى. لستِ وحدكِ.
      mk: Токму за тоа е жалбата. Не сте сами.
