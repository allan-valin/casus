steps:
- type: narrator
  text:
    en: Your last day. In Germany the one who leaves brings the food — so you bring a cake, and give a short speech. Listen to the conversation; you don't need to understand it yet.
    ar: يومك الأخير. في ألمانيا من يغادر هو من يُحضر الطعام — فتُحضر كعكة وتلقي كلمة قصيرة. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
- type: dialogue
  lines:
  - speaker: tim
    text: Du hast selbst Kuchen mitgebracht? Sehr deutsch!
    meaning:
      en: You brought cake yourself? Very German!
      ar: أحضرتَ الكعكة بنفسك؟ ألماني جدًا!
  - speaker: protagonist
    text: 'Sabine hat es mir erklärt: beim Ausstand und am Geburtstag bringt man selbst etwas mit.'
    meaning:
      en: 'Sabine explained it to me: at a leaving do and on your birthday you bring something yourself.'
      ar: 'سابينه شرحت لي: في حفلة الوداع وفي عيد الميلاد يُحضر المرء شيئًا بنفسه.'
  - speaker: schroeder
    text: Darf ich um Ruhe bitten? Unser Kollege möchte etwas sagen.
    meaning:
      en: May I ask for quiet? Our colleague would like to say something.
      ar: هل لي أن أطلب الهدوء؟ زميلنا يودّ أن يقول شيئًا.
  - speaker: protagonist
    text: Liebe Kolleginnen und Kollegen, heute ist mein letzter Arbeitstag. Ich möchte mich bei Ihnen bedanken.
    meaning:
      en: Dear colleagues, today is my last working day. I'd like to thank you.
      ar: زميلاتي وزملائي الأعزاء، اليوم آخر يوم عمل لي. أودّ أن أشكركم.
  - speaker: protagonist
    text: Für die gute Zusammenarbeit, für die Geduld mit meinem Deutsch — und für das ehrliche Feedback.
    meaning:
      en: For the good cooperation, for the patience with my German — and for the honest feedback.
      ar: على التعاون الجيد، وعلى الصبر على لغتي الألمانية — وعلى الملاحظات الصريحة.
  - speaker: schroeder
    text: Sie werden uns fehlen. Hier ist eine Abschiedskarte von allen. Alles Gute!
    meaning:
      en: We'll miss you. Here's a farewell card from everyone. All the best!
      ar: سنفتقدك. هذه بطاقة وداع من الجميع. كل التوفيق!
  - speaker: protagonist
    text: Danke! Ihr werdet mir auch fehlen. Lasst uns in Kontakt bleiben.
    meaning:
      en: Thank you! I'll miss you too. Let's stay in touch.
      ar: شكرًا! سأفتقدكم أنا أيضًا. لنبقَ على تواصل.
  - speaker: tim
    text: 'Klar. Und jetzt: Kuchen!'
    meaning:
      en: 'Sure. And now: cake!'
      ar: 'طبعًا. والآن: الكعكة!'
