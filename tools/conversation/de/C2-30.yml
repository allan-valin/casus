steps:
- type: narrator
  text:
    en: Late at night after the party, you and Jonas sit on the stairs where you first met. The whole story, looking back. Listen to the conversation; you don't need to understand it yet.
    ar: في وقت متأخر من الليل بعد الحفلة، تجلس أنت ويوناس على الدرج حيث التقيتما أول مرة. القصة كلها، بنظرة إلى الماضي. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Доцна ноќта по забавата, вие и Јонас седите на скалите каде што првпат се запознавте. Целата приказна, гледајќи наназад. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: Weißt du noch? Auf derselben Treppe hast du am ersten Tag gefragt, wo der Müll hinkommt.
    meaning:
      en: Remember? On this same staircase, on the first day, you asked where the rubbish goes.
      ar: أتذكر؟ على الدرج نفسه سألتَ في اليوم الأول أين توضع القمامة.
      mk: Се сеќаваш? На истите скали, првиот ден, праша каде оди ѓубрето.
  - speaker: protagonist
    text: Und du hast mir eine halbe Stunde lang Mülltrennung erklärt.
    meaning:
      en: And you explained recycling to me for half an hour.
      ar: وأنت شرحتَ لي فرز القمامة نصف ساعة.
      mk: А ти ми ја објаснуваше селекцијата половина час.
  - speaker: jonas
    text: Wer hätte das gedacht? Heute bist du Emmas Lieblingsonkel.
    meaning:
      en: Who'd have thought it? Today you're Emma's favourite uncle.
      ar: من كان يظن ذلك؟ اليوم أنت عمّ إيما المفضّل.
      mk: Кој би помислил? Денес си омилениот чичко на Ема.
  - speaker: protagonist
    text: Zehn Jahre. Von „Entschuldigung“ bis zu Rilke. Vom Café bis zum Stadtrat.
    meaning:
      en: Ten years. From 'Entschuldigung' to Rilke. From the café to the city council.
      ar: عشر سنوات. من «عذرًا» إلى ريلكه. من المقهى إلى مجلس المدينة.
      mk: Десет години. Од „Entschuldigung“ до Рилке. Од кафулето до градскиот совет.
  - speaker: jonas
    text: Bist du angekommen?
    meaning:
      en: Have you arrived?
      ar: هل استقررتَ؟
      mk: Пристигна ли?
  - speaker: protagonist
    text: Ja. Nicht, weil ich alles verstehe. Sondern weil ich weiß, wen ich fragen kann.
    meaning:
      en: Yes. Not because I understand everything. But because I know whom to ask.
      ar: نعم. لا لأنني أفهم كل شيء. بل لأنني أعرف من أسأل.
      mk: Да. Не затоа што разбирам сè. Туку затоа што знам кого да прашам.
  - speaker: jonas
    text: Schön gesagt. Und die nächsten zehn Jahre?
    meaning:
      en: Nicely put. And the next ten years?
      ar: قلتَها جميلة. والسنوات العشر القادمة؟
      mk: Убаво кажано. А следните десет години?
  - speaker: protagonist
    text: Es geht weiter. Unsere Geschichte ist nicht zu Ende.
    meaning:
      en: It goes on. Our story isn't over.
      ar: الحكاية تستمرّ. قصتنا لم تنتهِ.
      mk: Продолжува. Нашата приказна не е завршена.
