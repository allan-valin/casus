- type: narrator
  text:
    en: 'From a first «Entschuldigung» to reading Rilke and speaking at the city council: that is the whole way from A1 to C2. Arriving doesn''t mean understanding everything — it means knowing whom to
      ask. Viel Glück — and keep talking.'
    ar: 'من أول «Entschuldigung» إلى قراءة ريلكه والكلام في مجلس المدينة: هذا هو الطريق كله من A1 إلى C2. والاستقرار لا يعني أن تفهم كل شيء — بل أن تعرف من تسأل. بالتوفيق — وواصل الكلام.'
    mk: 'Од првото „Entschuldigung“ до читање Рилке и говор во градскиот совет: тоа е целиот пат од A1 до C2. Да пристигнеш не значи да разбираш сè — туку да знаеш кого да прашаш. Viel Glück — и продолжете
      да зборувате.'
