- type: narrator
  text:
    en: 'Some prepositions take the genitive: «anstelle einer großen Feier» (instead of a big celebration), «trotz des kleinen Budgets» (despite the small budget). In speech many people use the dative after
      «trotz».'
    ar: 'بعض حروف الجر تأخذ حالة الإضافة: «anstelle einer großen Feier» (بدلًا من احتفال كبير)، «trotz des kleinen Budgets» (رغم الميزانية الصغيرة). وفي الكلام يستعمل كثيرون حالة الجر بعد «trotz».'
    mk: 'Некои предлози бараат генитив: «anstelle einer großen Feier» (наместо голема прослава), «trotz des kleinen Budgets» (и покрај малиот буџет). Во говорот многумина по «trotz» користат датив.'
- type: prompt
  ask:
    en: 'Say: instead of a big celebration.'
    ar: 'قل: بدلًا من احتفال كبير.'
    mk: 'Кажете: наместо голема прослава.'
  answer:
    speaker: protagonist
    text: Anstelle einer großen Feier.
  items:
  - anstelle
  - die-feier
- type: prompt
  ask:
    en: 'Say: despite the small budget.'
    ar: 'قل: رغم الميزانية الصغيرة.'
    mk: 'Кажете: и покрај малиот буџет.'
  answer:
    speaker: protagonist
    text: Trotz des kleinen Budgets.
  items:
  - trotz
  - das-budget
- type: prompt
  ask:
    en: 'Say: the bride and groom dance.'
    ar: 'قل: العروسان يرقصان.'
    mk: 'Кажете: младенците танцуваат.'
  answer:
    speaker: protagonist
    text: Das Brautpaar tanzt.
  items:
  - das-brautpaar
- type: prompt
  ask:
    en: 'Say: after the ''I do''.'
    ar: 'قل: بعد كلمة «نعم».'
    mk: 'Кажете: по „да“-то.'
  answer:
    speaker: protagonist
    text: Nach dem Jawort.
  items:
  - das-ja-wort
- type: narrator
  text:
    en: In Germany only the registry office makes a marriage legal; a church or mosque ceremony may follow but has no legal effect. Weddings are often small — family and close friends — and guests usually
      give money or something from a gift list. Five hundred guests would astonish most Germans.
    ar: في ألمانيا مكتب السجل المدني وحده يجعل الزواج قانونيًا؛ وقد تتبعه مراسم في كنيسة أو مسجد لكن بلا أثر قانوني. والأعراس صغيرة غالبًا — العائلة والأصدقاء المقرّبون — ويقدّم الضيوف عادةً مالًا أو شيئًا
      من قائمة هدايا. خمسمئة ضيف تدهش معظم الألمان.
    mk: Во Германија само матичното го прави бракот законски; може да следи црковна церемонија или во џамија, но без правно дејство. Свадбите често се мали — семејство и блиски пријатели — а гостите обично
      даваат пари или нешто од листа на подароци. Петстотини гости би ги зачудиле повеќето Германци.
