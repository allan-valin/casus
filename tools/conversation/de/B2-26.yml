- type: prompt
  ask:
    en: 'Say: at the registry office.'
    ar: 'قل: في مكتب السجل المدني.'
    mk: 'Кажете: во матичното.'
  answer:
    speaker: protagonist
    text: Im Standesamt.
  items:
  - das-standesamt
- type: prompt
  ask:
    en: 'Say: hold the rings.'
    ar: 'قل: احمل الخاتمين.'
    mk: 'Кажете: држи ги прстените.'
  answer:
    speaker: protagonist
    text: Die Ringe halten.
  items:
