steps:
- type: narrator
  text:
    en: Jonas and Svenja get married at the registry office. Jonas asks you to be his witness. Listen to the conversation; you don't need to understand it yet.
    ar: يوناس وسفينيا يتزوّجان في مكتب السجل المدني. يوناس يطلب منك أن تكون شاهده. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Јонас и Свења се венчаваат во матичното. Јонас ве моли да му бидете кум. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: Willst du mein Trauzeuge sein?
    meaning:
      en: Will you be my wedding witness?
      ar: هل تكون شاهد زواجي؟
      mk: Сакаш ли да ми бидеш кум?
  - speaker: protagonist
    text: Was für eine Ehre! Was muss ich machen?
    meaning:
      en: What an honour! What do I have to do?
      ar: يا له من شرف! ماذا عليّ أن أفعل؟
      mk: Каква чест! Што треба да правам?
  - speaker: jonas
    text: Im Standesamt unterschreiben und die Ringe halten. Mehr nicht.
    meaning:
      en: Sign at the registry office and hold the rings. That's all.
      ar: التوقيع في مكتب السجل المدني وحمل الخاتمين. لا أكثر.
      mk: Да потпишеш во матичното и да ги држиш прстените. Ништо повеќе.
  - speaker: protagonist
    text: Und wie viele Gäste?
    meaning:
      en: And how many guests?
      ar: وكم ضيفًا؟
      mk: А колку гости?
  - speaker: svenja
    text: Vierzig. Anstelle einer großen Feier machen wir ein Picknick im Park.
    meaning:
      en: Forty. Instead of a big celebration we're having a picnic in the park.
      ar: أربعون. بدلًا من احتفال كبير سنقيم نزهة في الحديقة.
      mk: Четириесет. Наместо голема прослава правиме пикник во паркот.
  - speaker: protagonist
    text: Vierzig! Bei uns kommen fünfhundert — das ganze Dorf.
    meaning:
      en: Forty! With us five hundred come — the whole village.
      ar: أربعون! عندنا يأتي خمسمئة — القرية كلها.
      mk: Четириесет! Кај нас доаѓаат петстотини — целото село.
  - speaker: jonas
    text: Trotz des kleinen Budgets wird es schön. Und das Brautpaar tanzt!
    meaning:
      en: Despite the small budget it'll be lovely. And the bride and groom dance!
      ar: رغم الميزانية الصغيرة سيكون جميلًا. والعروسان سيرقصان!
      mk: И покрај малиот буџет ќе биде убаво. А младенците ќе танцуваат!
  - speaker: protagonist
    text: Dann tanze ich auch. Nach dem Jawort!
    meaning:
      en: Then I'll dance too. After the 'I do'!
      ar: إذن سأرقص أنا أيضًا. بعد كلمة «نعم»!
      mk: Тогаш и јас ќе танцувам. По „да“-то!
- type: prompt
  ask:
    en: 'He asks: will you be my witness?'
    ar: 'يسأل: هل تكون شاهدي؟'
    mk: 'Тој прашува: сакаш ли да ми бидеш кум?'
  answer:
    speaker: protagonist
    text: Willst du mein Trauzeuge sein?
  items:
  - der-trauzeuge
- type: prompt
  ask:
    en: 'Say: the wedding.'
    ar: 'قل: الزفاف.'
    mk: 'Кажете: свадбата.'
