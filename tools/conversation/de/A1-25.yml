steps:
- type: narrator
  text:
    en: Evening tram. A man starts shouting at you because you are a foreigner. A woman stands up next to you. Listen to the conversation; you don't need to understand it yet.
    ar: ترام المساء. رجل يبدأ بالصراخ عليكِ لأنكِ أجنبية. امرأة تقف بجانبك. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Вечерен трамвај. Еден човек почнува да вика на вас затоа што сте странец. Една жена станува до вас. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: poebler
    text: Ausländer raus! Was machen Sie hier?
    meaning:
      en: Foreigners out! What are you doing here?
      ar: اخرجوا أيها الأجانب! ماذا تفعلين هنا؟
      mk: Странци надвор! Што барате тука?
  - speaker: protagonist
    text: Lassen Sie mich in Ruhe!
    meaning:
      en: Leave me alone!
      ar: اتركني وشأني!
      mk: Оставете ме на мира!
  - speaker: lena
    text: Hören Sie auf! Sofort!
    meaning:
      en: Stop it! Right now!
      ar: توقّف! فورًا!
      mk: Престанете! Веднаш!
  - speaker: lena
    text: Alles okay? Ich bin bei Ihnen.
    meaning:
      en: Are you all right? I'm with you.
      ar: هل أنتِ بخير؟ أنا معكِ.
      mk: Дали сте во ред? Јас сум со вас.
  - speaker: protagonist
    text: Danke. Ich habe Angst.
    meaning:
      en: Thank you. I'm frightened.
      ar: شكرًا. أنا خائفة.
      mk: Благодарам. Се плашам.
  - speaker: lena
    text: Wir sagen es dem Fahrer. Oder wir rufen die Polizei, hundertzehn.
    meaning:
      en: We'll tell the driver. Or we call the police, one-one-zero.
      ar: نخبر السائق. أو نتصل بالشرطة، 110.
      mk: Ќе му кажеме на возачот. Или ќе ја повикаме полицијата, 110.
  - speaker: lena
    text: Steigen Sie aus! Sie sind hier nicht willkommen!
    meaning:
      en: Get off! You're not welcome here!
      ar: انزل! أنت غير مرحَّب بك هنا!
      mk: Симнете се! Не сте добредојдени тука!
  - speaker: protagonist
    text: Er steigt aus... Danke für die Hilfe.
    meaning:
      en: He's getting off... Thanks for your help.
      ar: إنه ينزل... شكرًا على المساعدة.
      mk: Се симнува... Благодарам за помошта.
  - speaker: lena
    text: Gern. Das ist nicht normal. Das ist nicht Leipzig.
    meaning:
      en: You're welcome. That isn't normal. That isn't Leipzig.
      ar: عفوًا. هذا ليس عاديًا. هذه ليست لايبزيغ.
      mk: Нема зошто. Тоа не е нормално. Тоа не е Лајпциг.
- type: narrator
  text:
    en: 'Hard to hear, but better said on the first day: it can happen. Speak loudly and clearly, so that others hear — most people will help.'
    ar: 'صعب سماعه، لكن من الأفضل قوله من اليوم الأول: قد يحدث هذا. تكلّمي بصوت عالٍ وواضح، كي يسمع الآخرون — أغلب الناس سيساعدون.'
    mk: 'Тешко е да се чуе, но подобро е да се каже од првиот ден: може да се случи. Зборувајте гласно и јасно, за да слушнат другите — повеќето ќе помогнат.'
- type: prompt
  ask:
    en: 'Say firmly: leave me alone!'
    ar: 'قولي بحزم: اتركني وشأني!'
    mk: 'Кажете цврсто: оставете ме на мира!'
  answer:
    speaker: protagonist
    text: Lassen Sie mich in Ruhe!
  items:
