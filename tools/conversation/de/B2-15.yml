- type: narrator
  text:
    en: 'Before sharing, ask: who says it, what''s the source, do serious media report it? Public broadcasters and independent fact-check sites test viral claims. Posts that make you angry are built to
      be shared — that''s a reason to slow down.'
    ar: 'قبل المشاركة اسأل: من يقول ذلك، وما المصدر، وهل تنقله وسائل إعلام جادة؟ القنوات العامة ومواقع التحقّق المستقلة تفحص الادّعاءات المنتشرة. والمنشورات التي تُغضبك مصمَّمة لتُشارَك — وهذا سبب للتمهّل.'
    mk: 'Пред да споделите, прашајте: кој го кажува, кој е изворот, дали сериозните медиуми известуваат? Јавните радиодифузери и независни страници за проверка на факти ги тестираат виралните тврдења. Објавите
      што ве лутат се направени за да се споделуваат — тоа е причина да забавите.'
