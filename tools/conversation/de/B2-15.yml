steps:
- type: narrator
  text:
    en: 'Paul shows you a post: ''Migrants get free flats!'' Shared ten thousand times. You check it together. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'باول يريك منشورًا: «المهاجرون يحصلون على شقق مجانية!» شُورك عشرة آلاف مرة. تتحقّقان منه معًا. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.'
    mk: 'Паул ви покажува објава: „Мигрантите добиваат бесплатни станови!“ Споделена десет илјади пати. Заедно ја проверувате. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: paul
    text: 'Schau mal: „Migranten bekommen kostenlose Wohnungen!“ Zehntausend Mal geteilt.'
    meaning:
      en: 'Look: ''Migrants get free flats!'' Shared ten thousand times.'
      ar: 'انظر: «المهاجرون يحصلون على شقق مجانية!» شُورك عشرة آلاف مرة.'
      mk: 'Види: „Мигрантите добиваат бесплатни станови!“ Споделено десет илјади пати.'
  - speaker: protagonist
    text: Das ist eine Behauptung. Wo ist der Beweis?
    meaning:
      en: That's a claim. Where's the proof?
      ar: هذا ادّعاء. أين الدليل؟
      mk: Тоа е тврдење. Каде е доказот?
  - speaker: paul
    text: Es gibt zwar keine Quelle, aber so viele Leute teilen es!
    meaning:
      en: Admittedly there's no source, but so many people are sharing it!
      ar: صحيح أنه لا يوجد مصدر، لكن كثيرين يشاركونه!
      mk: Иако нема извор, сепак толку многу луѓе го споделуваат!
  - speaker: protagonist
    text: Auch wenn es eine Million teilen — es bleibt falsch, wenn es falsch ist.
    meaning:
      en: Even if a million share it — it stays false if it's false.
      ar: حتى لو شاركه مليون — يبقى كاذبًا إن كان كاذبًا.
      mk: Дури и ако го споделат милион — останува лажно ако е лажно.
  - speaker: paul
    text: Okay. Wie überprüfen wir das?
    meaning:
      en: OK. How do we check it?
      ar: حسنًا. كيف نتحقّق منه؟
      mk: Добро. Како да го провериме?
  - speaker: protagonist
    text: 'Mit einem Faktencheck. ... Hier: Falschmeldung. Ich kenne niemanden mit einer kostenlosen Wohnung.'
    meaning:
      en: 'With a fact check. ... Here: fake news. I don''t know anyone with a free flat.'
      ar: 'بالتحقّق من الحقائق. ... هنا: خبر كاذب. لا أعرف أحدًا لديه شقة مجانية.'
      mk: 'Со проверка на факти. ... Еве: лажна вест. Не познавам никого со бесплатен стан.'
  - speaker: paul
    text: Trotzdem glauben es viele.
    meaning:
      en: Nevertheless many believe it.
      ar: مع ذلك يصدّقه كثيرون.
      mk: Сепак многумина веруваат.
  - speaker: protagonist
    text: Weil es Hetze ist. Sie macht Angst und Wut — und das teilt man schnell.
    meaning:
      en: Because it's a hate campaign. It creates fear and anger — and people share that fast.
      ar: لأنه تحريض. يثير الخوف والغضب — وهذا ما يشاركه الناس بسرعة.
      mk: Затоа што е поттикнување омраза. Создава страв и бес — а тоа брзо се споделува.
