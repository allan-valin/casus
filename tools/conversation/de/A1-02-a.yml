steps:
- type: narrator
  text:
    ar: اليوم الأول لابنتك يارا في الحضانة (الكيتا). ترافقها إلى الباب وتستقبلكما المربية. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
- type: dialogue
  lines:
  - speaker: kruger
    text: Guten Morgen! Sie sind der Papa von Yara?
    meaning:
      ar: صباح الخير! أنت والد يارا؟
  - speaker: protagonist
    text: Ja, guten Morgen. Das ist Yara.
    meaning:
      ar: نعم، صباح الخير. هذه يارا.
  - speaker: kruger
    text: Hallo, Yara! Ich bin Frau Krüger, die Erzieherin.
    meaning:
      ar: مرحبًا يا يارا! أنا السيدة كروغر، المربية.
  - speaker: yara
    text: Papa, ich will nach Hause!
    meaning:
      ar: بابا، أريد أن أذهب إلى البيت!
  - speaker: protagonist
    text: Yara, das ist die Kita. Das ist gut.
    meaning:
      ar: يارا، هذه هي الحضانة. هذا جيد.
  - speaker: kruger
    text: Keine Angst, Yara. Wann holen Sie Yara ab?
    meaning:
      ar: لا تخافي يا يارا. متى تأتي لأخذ يارا؟
  - speaker: protagonist
    text: Um drei Uhr.
    meaning:
      ar: في الساعة الثالثة.
  - speaker: kruger
    text: Gut. Tschüss, Papa! Bis später!
    meaning:
      ar: حسنًا. إلى اللقاء يا بابا! أراك لاحقًا!
  - speaker: protagonist
    text: Tschüss, Yara! Bis später!
    meaning:
      ar: إلى اللقاء يا يارا! أراكِ لاحقًا!
