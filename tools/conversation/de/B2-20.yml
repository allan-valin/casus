steps:
- type: narrator
  text:
    en: Too much overtime, and your holiday request was refused. Sabine from the works council explains your rights. Listen to the conversation; you don't need to understand it yet.
    ar: ساعات إضافية كثيرة، وطلب إجازتكِ رُفض. زابينه من مجلس العاملين تشرح لكِ حقوقكِ. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Премногу прекувремена работа, а барањето за одмор ви е одбиено. Сабине од работничкиот совет ви ги објаснува правата. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Mein Urlaubsantrag ist abgelehnt. Und ich mache jede Woche Überstunden.
    meaning:
      en: My holiday request has been refused. And I do overtime every week.
      ar: طلب إجازتي مرفوض. وأعمل ساعات إضافية كل أسبوع.
      mk: Барањето за одмор ми е одбиено. А секоја недела работам прекувремено.
  - speaker: sabine
    text: Gut, dass du zum Betriebsrat kommst. Die Überstunden müssen ausgeglichen werden — mit Geld oder Freizeit.
    meaning:
      en: Good that you've come to the works council. The overtime must be compensated — with money or time off.
      ar: جيد أنكِ جئتِ إلى مجلس العاملين. يجب تعويض الساعات الإضافية — بالمال أو بوقت حر.
      mk: Добро е што дојде во работничкиот совет. Прекувремената мора да се надомести — со пари или слободно време.
  - speaker: protagonist
    text: Ist das irgendwo geregelt?
    meaning:
      en: Is that set out anywhere?
      ar: هل هذا منظَّم في مكان ما؟
      mk: Дали тоа е некаде регулирано?
  - speaker: sabine
    text: Ja, im Arbeitsvertrag und im Arbeitszeitgesetz. Die Höchstarbeitszeit ist festgelegt.
    meaning:
      en: Yes, in your contract and in the working hours law. The maximum working time is fixed.
      ar: نعم، في عقد العمل وفي قانون ساعات العمل. الحد الأقصى لساعات العمل محدَّد.
      mk: Да, во договорот за работа и во законот за работно време. Максималното работно време е утврдено.
  - speaker: protagonist
    text: Und wie viele Urlaubstage habe ich? Ich arbeite vier Tage pro Woche.
    meaning:
      en: And how many holiday days do I have? I work four days a week.
      ar: وكم يوم إجازة لديّ؟ أعمل أربعة أيام في الأسبوع.
      mk: А колку денови одмор имам? Работам четири дена неделно.
  - speaker: sabine
    text: 'Der Urlaub hängt von den Arbeitstagen ab: bei fünf Tagen mindestens zwanzig, bei vier mindestens sechzehn.'
    meaning:
      en: 'Holiday depends on working days: with five days at least twenty, with four at least sixteen.'
      ar: 'الإجازة تتوقّف على أيام العمل: مع خمسة أيام عشرون على الأقل، ومع أربعة ستة عشر على الأقل.'
      mk: 'Одморот зависи од работните денови: со пет дена најмалку дваесет, со четири најмалку шеснаесет.'
  - speaker: protagonist
    text: Und einzelne Tage? Zum Beispiel ein Brückentag?
    meaning:
      en: And single days? For example a bridge day?
      ar: وأيام منفردة؟ مثلًا يوم جسر؟
      mk: А поединечни денови? На пример мостен ден?
  - speaker: sabine
    text: Kein Problem — der kostet nur einen Urlaubstag. Ich spreche mit der Chefin über deinen Antrag.
    meaning:
      en: No problem — it only costs one holiday day. I'll talk to the boss about your request.
      ar: لا مشكلة — يكلّف يوم إجازة واحدًا فقط. سأتحدّث مع المديرة بشأن طلبكِ.
      mk: Нема проблем — чини само еден ден одмор. Ќе зборувам со шефицата за твоето барање.
- type: prompt
  ask:
    en: 'Say: my holiday request has been refused.'
    ar: 'قولي: طلب إجازتي مرفوض.'
    mk: 'Кажете: барањето за одмор ми е одбиено.'
  answer:
    speaker: protagonist
    text: Mein Urlaubsantrag ist abgelehnt.
  items:
  - der-urlaubsantrag
  - ist-abgelehnt
- type: prompt
  ask:
    en: 'Say: overtime every week.'
    ar: 'قولي: ساعات إضافية كل أسبوع.'
    mk: 'Кажете: прекувремено секоја недела.'
  answer:
    speaker: protagonist
    text: Jede Woche Überstunden.
  items:
  - die-ueberstunden
- type: prompt
  ask:
    en: 'Say: the works council.'
    ar: 'قولي: مجلس العاملين.'
    mk: 'Кажете: работничкиот совет.'
  answer:
    speaker: protagonist
    text: Der Betriebsrat.
  items:
  - der-betriebsrat
- type: prompt
  ask:
    en: 'She says: overtime must be compensated.'
    ar: 'تقول: يجب تعويض الساعات الإضافية.'
    mk: 'Таа вели: прекувремената мора да се надомести.'
  answer:
    speaker: protagonist
    text: Überstunden müssen ausgeglichen werden.
  items:
  - ausgleichen
- type: narrator
  text:
    en: 'The passive of state uses «sein» + participle for a result: «Der Antrag ist abgelehnt» (is refused — it''s done), «Das ist geregelt» (is set out), «Die Arbeitszeit ist festgelegt» (is fixed). Compare
      «wird abgelehnt» — is being refused.'
    ar: 'المبني للمجهول الدالّ على الحالة يستعمل «sein» مع اسم المفعول لنتيجة: «Der Antrag ist abgelehnt» (مرفوض — انتهى الأمر)، «Das ist geregelt» (منظَّم)، «Die Arbeitszeit ist festgelegt» (محدَّد). قارني
      مع «wird abgelehnt» — يجري رفضه.'
    mk: 'Пасивот на состојба користи «sein» + партицип за резултат: «Der Antrag ist abgelehnt» (е одбиено — готово е), «Das ist geregelt» (е регулирано), «Die Arbeitszeit ist festgelegt» (е утврдено). Споредете
      «wird abgelehnt» — се одбива.'
- type: prompt
  ask:
    en: 'Ask: is that set out anywhere?'
    ar: 'اسألي: هل هذا منظَّم في مكان ما؟'
    mk: 'Прашајте: дали тоа е некаде регулирано?'
  answer:
    speaker: protagonist
    text: Ist das irgendwo geregelt?
  items:
  - ist-geregelt
- type: prompt
  ask:
    en: 'Say: the maximum working time is fixed.'
    ar: 'قولي: الحد الأقصى لساعات العمل محدَّد.'
    mk: 'Кажете: максималното работно време е утврдено.'
  answer:
    speaker: protagonist
    text: Die Höchstarbeitszeit ist festgelegt.
  items:
  - ist-festgelegt
- type: prompt
  ask:
    en: 'Say: the working hours law.'
    ar: 'قولي: قانون ساعات العمل.'
    mk: 'Кажете: законот за работно време.'
  answer:
    speaker: protagonist
    text: Das Arbeitszeitgesetz.
  items:
  - das-arbeitszeitgesetz
- type: prompt
  ask:
    en: 'Ask: how many holiday days do I have?'
    ar: 'اسألي: كم يوم إجازة لديّ؟'
    mk: 'Прашајте: колку денови одмор имам?'
  answer:
    speaker: protagonist
    text: Wie viele Urlaubstage habe ich?
  items:
  - die-urlaubstage
- type: prompt
  ask:
    en: 'Say: a bridge day.'
    ar: 'قولي: يوم جسر.'
    mk: 'Кажете: мостен ден.'
  answer:
    speaker: protagonist
    text: Ein Brückentag.
  items:
  - der-brueckentag
- type: narrator
  text:
    en: 'Legal minimum holiday is four weeks: twenty days with a five-day week, sixteen with four, twelve with three — minijobs included. You may take single days; a Brückentag between a public holiday
      and the weekend costs one day and gives four free. Public holidays are quiet like Sundays: shops closed, no noisy work. A works council, where one exists, must be heard on overtime and holiday rules.'
    ar: 'الحد الأدنى القانوني للإجازة أربعة أسابيع: عشرون يومًا مع أسبوع من خمسة أيام، وستة عشر مع أربعة، واثنا عشر مع ثلاثة — بما في ذلك الأعمال الصغيرة. يمكنكِ أخذ أيام منفردة؛ ويوم الجسر بين عطلة رسمية
      ونهاية الأسبوع يكلّف يومًا واحدًا ويمنح أربعة أيام حرة. العطل الرسمية هادئة مثل الأحد: المتاجر مغلقة، ولا أعمال مزعجة. ومجلس العاملين، حيث وُجد، يجب استشارته في قواعد الساعات الإضافية والإجازات.'
    mk: 'Законскиот минимум одмор е четири недели: дваесет дена при работна недела од пет дена, шеснаесет при четири, дванаесет при три — вклучително и Minijob. Смеете да земате поединечни денови; мостен
      ден меѓу празник и викенд чини еден ден и дава четири слободни. Празниците се тивки како недела: продавниците затворени, без бучна работа. Работничкиот совет, каде што постои, мора да се консултира
      за правилата за прекувремена работа и одмор.'
