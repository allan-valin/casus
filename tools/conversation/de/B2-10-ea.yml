steps:
- type: narrator
  text:
    en: You want to apply for a better job. Tim reads your cover letter — and finds it too modest. Listen to the conversation; you don't need to understand it yet.
    ar: تريدين التقدّم لوظيفة أفضل. تيم يقرأ رسالة التقديم — ويجدها متواضعة أكثر من اللازم. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
- type: dialogue
  lines:
  - speaker: tim
    text: „Ich weiß nicht, ob ich gut genug bin“? Das kannst du nicht schreiben!
    meaning:
      en: '''I don''t know if I''m good enough''? You can''t write that!'
      ar: «لا أعرف إن كنتُ جيدة بما يكفي»؟ لا يمكنكِ كتابة هذا!
  - speaker: protagonist
    text: Bei uns ist das höflich. Man lobt sich nicht selbst.
    meaning:
      en: Where I'm from that's polite. You don't praise yourself.
      ar: عندنا هذا من الأدب. لا يمدح المرء نفسه.
  - speaker: tim
    text: 'Hier bist du damit zu bescheiden. Schreib: „Hiermit bewerbe ich mich um die Stelle als Teamleiterin.“'
    meaning:
      en: 'Here that''s too modest. Write: ''I hereby apply for the position of team leader.'''
      ar: 'هنا هذا تواضع زائد. اكتبي: «أتقدّم بموجب هذا لوظيفة قائدة فريق.»'
  - speaker: protagonist
    text: Und dann? Meine Erfahrung?
    meaning:
      en: And then? My experience?
      ar: ثم ماذا؟ خبرتي؟
  - speaker: tim
    text: 'Ja, mit Beispielen: die Übernahme von Verantwortung, deine Teamfähigkeit.'
    meaning:
      en: 'Yes, with examples: taking on responsibility, being a team player.'
      ar: 'نعم، مع أمثلة: تحمّل المسؤولية، وقدرتكِ على العمل الجماعي.'
  - speaker: protagonist
    text: Und am Ende?
    meaning:
      en: And at the end?
      ar: وفي النهاية؟
  - speaker: tim
    text: „Über eine Einladung zu einem Gespräch freue ich mich.“ Lebenslauf und Zeugnisse im Anhang.
    meaning:
      en: '''I would be glad to be invited for an interview.'' CV and references attached.'
      ar: «يسعدني أن تُوجَّه إليّ دعوة لمقابلة.» السيرة الذاتية والشهادات في المرفق.
  - speaker: protagonist
    text: Klingt selbstbewusst. Fast zu selbstbewusst!
    meaning:
      en: Sounds confident. Almost too confident!
      ar: يبدو واثقًا. واثقًا أكثر من اللازم تقريبًا!
  - speaker: tim
    text: Genau richtig für Deutschland.
    meaning:
      en: Just right for Germany.
      ar: مناسب تمامًا لألمانيا.
- type: prompt
  ask:
    en: 'Say: the cover letter.'
    ar: 'قولي: رسالة التقديم.'
  answer:
    speaker: protagonist
    text: Das Anschreiben.
  items:
  - das-anschreiben-ea
