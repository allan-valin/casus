- type: narrator
  text:
    en: 'German applications are factual and confident: say what you did and can do, with examples. Modesty (''I''m not sure I''m good enough'') reads as lack of ability. A photo is optional today; a gap-free
      CV in table form is expected.'
    ar: 'رسائل التقديم الألمانية واقعية وواثقة: قولي ما فعلتِ وما تستطيعين، مع أمثلة. التواضع («لست متأكدة أنني جيدة بما يكفي») يُفهم ضعفًا في القدرة. الصورة اختيارية اليوم؛ والمتوقّع سيرة ذاتية في جدول
      بلا فجوات.'
