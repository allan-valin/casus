- type: narrator
  text:
    en: 'Applications love nouns: «die Übernahme von Verantwortung» (taking on responsibility), «Teamfähigkeit» (being able to work in a team). One noun can replace a whole clause.'
    ar: 'رسائل التقديم تحب الأسماء: «die Übernahme von Verantwortung» (تحمّل المسؤولية)، «Teamfähigkeit» (القدرة على العمل الجماعي). اسم واحد يمكن أن يحلّ محلّ جملة كاملة.'
