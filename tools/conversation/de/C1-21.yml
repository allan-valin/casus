  items:
  - die-familiensprache
- type: narrator
  text:
    en: 'Research is clear: children can grow up with two or more languages without harm; mixing is a normal stage. Parents should speak the language they''re most at ease in — a warm, rich home language
      helps German too, not the other way round. Some cities offer heritage-language classes.'
    ar: 'الأبحاث واضحة: يمكن للأطفال أن ينشؤوا بلغتين أو أكثر دون ضرر؛ والخلط مرحلة طبيعية. وعلى الوالدين أن يتكلّما اللغة التي يرتاحان فيها أكثر — فلغة البيت الدافئة الغنية تساعد الألمانية أيضًا، لا العكس.
      وبعض المدن تقدّم دروسًا في لغة الأصل.'
    mk: 'Истражувањата се јасни: децата можат да растат со два или повеќе јазика без штета; мешањето е нормална фаза. Родителите треба да зборуваат на јазикот на кој им е најлесно — топол, богат домашен
      јазик му помага и на германскиот, не обратно. Некои градови нудат часови по мајчин јазик.'
