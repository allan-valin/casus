  text:
    en: Now some things from earlier units, in this new situation.
    ar: والآن بعض ما تعلمتِه في الوحدات السابقة، في هذا الموقف الجديد.
    mk: Сега нешто од претходните лекции, во оваа нова ситуација.
- type: prompt
  review: true
  ask:
    en: 'Say: “the midwife — and “the birth — and “the first weeks after birth — and “was born — and “is weighed — and “is registered — and “the birth certificate — and “breastfeed — and “child benefit
      — and “is paid — and “Congratulations on the birth! — and “the Enlightenment — and “duty — and “reason, understanding — and “courage — and “the categorical imperative — and “reason — and “the rule
      to be followed — and “universally valid — and “intellectual maturity, autonomy — and “act — and “the accident”.'
    ar: 'قولي: “القابلة — و“الولادة — و“فترة النفاس — و“وُلدت — و“يُوزن — و“مسجَّل — و“شهادة الميلاد — و“ترضع — و“علاوة الأطفال — و“يُدفع — و“مبروك المولودة! — و“عصر التنوير — و“الواجب — و“العقل — و“الشجاعة
      — و“الأمر المطلق — و“العقل، المنطق — و“القاعدة الواجب اتّباعها — و“صالح للجميع — و“الرشد — و“يتصرّف — و“الحادث”.'
    mk: 'Кажете: „бабицата“ — и „раѓањето“ — и „бабињето“ — и „е родена“ — и „се мери“ — и „е пријавено“ — и „изводот од матичната книга на родени“ — и „дои“ — и „детскиот додаток“ — и „се плаќа“ — и „Честитки
      за раѓањето!“ — и „просветителството“ — и „должноста“ — и „разумот“ — и „храброста“ — и „категоричкиот императив“ — и „умот“ — и „правилото што треба да се следи“ — и „општо важечко“ — и „полнолетството
