steps:
- type: narrator
  text:
    en: Lena's husband is Polish. Their son mixes Polish and German — and a neighbour said it's bad for him. Lena asks you. Listen to the conversation; you don't need to understand it yet.
    ar: زوج لينا بولندي. ابنهما يخلط البولندية بالألمانية — وقالت جارة إن ذلك يضرّه. لينا تسألكِ. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Мажот на Лена е Полјак. Нивниот син ги меша полскиот и германскиот — а една соседка рекла дека тоа му штети. Лена ве прашува. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: lena
    text: Jan sagt „Ich will mleko“. Ist das etwa schlecht? Die Nachbarin meint ja.
    meaning:
      en: Jan says 'I want mleko'. That's surely not bad, is it? The neighbour thinks so.
      ar: يان يقول «أريد mleko». هل يُعقل أن يكون هذا سيئًا؟ الجارة تظن ذلك.
      mk: Јан вели „Ich will mleko“. Зар е тоа лошо? Соседката мисли дека е.
  - speaker: protagonist
    text: Nein! Mischen ist bei zweisprachigen Kindern ganz normal. Das hört von selbst auf.
    meaning:
      en: No! Mixing is completely normal for bilingual children. It stops by itself.
      ar: لا! الخلط طبيعي تمامًا عند الأطفال ثنائيي اللغة. يتوقّف من تلقاء نفسه.
      mk: Не! Мешањето е сосема нормално кај двојазичните деца. Само по себе престанува.
  - speaker: lena
    text: Und welche Sprache soll Tomasz denn mit ihm sprechen?
    meaning:
      en: And which language should Tomasz speak with him, then?
      ar: وبأي لغة يجب أن يكلّمه توماش إذن؟
      mk: А на кој јазик па треба Томаш да зборува со него?
  - speaker: protagonist
    text: Seine Muttersprache. Viele machen „eine Person, eine Sprache“.
    meaning:
      en: His mother tongue. Many do 'one person, one language'.
      ar: لغته الأم. كثيرون يتّبعون «شخص واحد، لغة واحدة».
      mk: Својот мајчин јазик. Многумина прават „една личност, еден јазик“.
  - speaker: lena
    text: Und Deutsch lernt er trotzdem gut?
    meaning:
      en: And he still learns German well?
      ar: وسيتعلّم الألمانية جيدًا مع ذلك؟
      mk: И сепак добро ќе научи германски?
  - speaker: protagonist
    text: In der Kita sowieso. Zwei Sprachen sind ein Vorteil fürs Gehirn, kein Problem.
    meaning:
      en: At the Kita anyway. Two languages are an advantage for the brain, not a problem.
      ar: في الروضة على أي حال. لغتان ميزة للدماغ، لا مشكلة.
      mk: Во градинката секако. Два јазика се предност за мозокот, не проблем.
  - speaker: lena
    text: Dann sag ich der Nachbarin das mal.
    meaning:
      en: Then I'll tell the neighbour that.
      ar: إذن سأقول هذا للجارة.
      mk: Тогаш ќе ѝ кажам на соседката.
  - speaker: protagonist
    text: Sag es ihr ruhig. Und sprecht zu Hause, was ihr fühlt.
    meaning:
      en: Go ahead and tell her. And at home speak what you feel.
      ar: قوليها لها بلا تردّد. وتكلّموا في البيت باللغة التي تشعرون بها.
      mk: Слободно кажи ѝ. А дома зборувајте на јазикот што го чувствувате.
- type: prompt
  ask:
    en: 'Say: bilingual.'
    ar: 'قولي: ثنائي اللغة.'
    mk: 'Кажете: двојазично.'
  answer:
    speaker: protagonist
    text: Zweisprachig.
  items:
  - zweisprachig
- type: narrator
  text:
    en: 'Particles in questions and advice: «Ist das etwa schlecht?» (surely not bad? — hoping for ''no''), «Welche Sprache denn?» (which language, then? — real interest), «Sag es ihr ruhig» (go ahead —
      encouraging).'
    ar: 'أدوات في الأسئلة والنصائح: «Ist das etwa schlecht?» (هل يُعقل أنه سيئ؟ — مع رجاء «لا»)، «Welche Sprache denn?» (أي لغة إذن؟ — اهتمام حقيقي)، «Sag es ihr ruhig» (قوليها بلا تردّد — تشجيع).'
    mk: 'Честички во прашања и совети: «Ist das etwa schlecht?» (зар е лошо? — со надеж за „не“), «Welche Sprache denn?» (па кој јазик? — вистински интерес), «Sag es ihr ruhig» (слободно кажи ѝ — охрабрување).'
- type: prompt
  ask:
    en: 'Ask hopefully: that''s surely not bad?'
    ar: 'اسألي برجاء: هل يُعقل أنه سيئ؟'
    mk: 'Прашајте со надеж: зар е тоа лошо?'
  answer:
    speaker: protagonist
