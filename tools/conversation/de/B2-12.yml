steps:
- type: narrator
  text:
    en: Jonas buys a lottery ticket every week. Lena, a maths teacher, explains the odds — and the weather forecast. Listen to the conversation; you don't need to understand it yet.
    ar: يوناس يشتري ورقة يانصيب كل أسبوع. لينا، معلّمة الرياضيات، تشرح الاحتمالات — والنشرة الجوية. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Јонас секоја недела купува лотарија. Лена, наставничка по математика, ги објаснува шансите — и временската прогноза. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: Fast! Hätte ich die Sieben getippt, hätte ich gewonnen!
    meaning:
      en: So close! If I'd picked the seven, I'd have won!
      ar: كدتُ! لو اخترتُ الرقم سبعة لفزتُ!
      mk: Речиси! Да ја типовав седумката, ќе добиев!
  - speaker: lena
    text: Die Wahrscheinlichkeit für den Jackpot ist etwa eins zu hundertvierzig Millionen.
    meaning:
      en: The probability of the jackpot is about one in a hundred and forty million.
      ar: احتمال الجائزة الكبرى نحو واحد من مئة وأربعين مليونًا.
      mk: Веројатноста за џекпотот е околу еден спрема сто и четириесет милиони.
  - speaker: protagonist
    text: Das ist weniger als ein Blitz, oder?
    meaning:
      en: That's less than lightning, isn't it?
      ar: هذا أقل من البرق، أليس كذلك؟
      mk: Тоа е помалку од молња, нели?
  - speaker: lena
    text: Viel weniger! Vom Blitz getroffen zu werden ist wahrscheinlicher.
    meaning:
      en: Much less! Being hit by lightning is more likely.
      ar: أقل بكثير! احتمال أن يصيبك البرق أكبر.
      mk: Многу помалку! Поверојатно е да те погоди молња.
  - speaker: jonas
    text: Aber jemand gewinnt doch immer! Das ist Zufall.
    meaning:
      en: But someone always wins! That's chance.
      ar: لكن أحدًا يفوز دائمًا! هذه مصادفة.
      mk: Но некој секогаш добива! Тоа е случајност.
  - speaker: protagonist
    text: Und was heißt „siebzig Prozent Regenwahrscheinlichkeit“ heute?
    meaning:
      en: And what does 'seventy per cent chance of rain' mean today?
      ar: وماذا تعني «احتمال المطر سبعون بالمئة» اليوم؟
      mk: А што значи „седумдесет проценти веројатност за дожд“ денес?
  - speaker: lena
    text: An sieben von zehn solchen Tagen regnet es. Wärst du gestern mit Schirm gekommen, wärst du trocken geblieben!
    meaning:
      en: On seven of ten such days it rains. If you'd come with an umbrella yesterday, you'd have stayed dry!
      ar: في سبعة من كل عشرة أيام كهذه تمطر. لو جئتِ أمس بمظلة لبقيتِ جافة!
      mk: Во седум од десет такви денови врне. Да дојдеше вчера со чадор, ќе останеше сува!
  - speaker: protagonist
    text: 'Und Jonas: das Geld für Lotto ist verschwendet.'
    meaning:
      en: 'And Jonas: the lottery money is wasted.'
      ar: 'ويا يوناس: مال اليانصيب مُهدَر.'
      mk: 'А Јонас: парите за лото се потрошени залудно.'
  - speaker: jonas
    text: Aber der Traum ist billig!
    meaning:
      en: But the dream is cheap!
      ar: لكن الحلم رخيص!
      mk: Но сонот е евтин!
- type: narrator
  text:
    en: 'Konjunktiv II past for missed chances: «Hätte ich die Sieben getippt, hätte ich gewonnen» (if I had…, I would have…). With movement verbs: «Wärst du gekommen, wärst du trocken geblieben».'
    ar: 'صيغة التمني في الماضي للفرص الضائعة: «Hätte ich die Sieben getippt, hätte ich gewonnen» (لو كنتُ…، لكنتُ…). ومع أفعال الحركة: «Wärst du gekommen, wärst du trocken geblieben».'
    mk: 'Konjunktiv II во минато за пропуштени шанси: «Hätte ich die Sieben getippt, hätte ich gewonnen» (да бев…, ќе…). Со глаголи на движење: «Wärst du gekommen, wärst du trocken geblieben».'
