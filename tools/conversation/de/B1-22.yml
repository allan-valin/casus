steps:
- type: narrator
  text:
    en: Saturday at the Tafel, the food bank. You help hand out food — and meet Herr Fischer, who goes with newcomers to their appointments. Listen to the conversation; you don't need to understand it yet.
    ar: السبت في «Tafel»، بنك الطعام. تساعد في توزيع الطعام — وتلتقي السيد فيشر الذي يرافق القادمين الجدد إلى مواعيدهم. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Сабота во Tafel, банката за храна. Помагате во делењето храна — и го запознавате господин Фишер, кој ги придружува новодојдените на термини. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: fischer
    text: Sie helfen heute zum ersten Mal? Willkommen bei der Tafel!
    meaning:
      en: You're helping for the first time today? Welcome to the Tafel!
      ar: تساعد اليوم لأول مرة؟ أهلًا بك في بنك الطعام!
      mk: Денес прв пат помагате? Добредојдовте во Tafel!
  - speaker: protagonist
    text: Ja. Ich bin hier, um etwas zurückzugeben.
    meaning:
      en: Yes. I'm here to give something back.
      ar: نعم. أنا هنا لأردّ الجميل.
      mk: Да. Тука сум за да вратам нешто.
  - speaker: fischer
    text: Schön. Wir verteilen Lebensmittel, die Supermärkte nicht mehr verkaufen.
    meaning:
      en: Lovely. We hand out food the supermarkets no longer sell.
      ar: جميل. نوزّع مواد غذائية لم تعد المتاجر تبيعها.
      mk: Убаво. Делиме намирници што супермаркетите веќе не ги продаваат.
  - speaker: protagonist
    text: Und Sie machen das freiwillig?
    meaning:
      en: And you do it voluntarily?
      ar: وأنت تفعل ذلك طوعًا؟
      mk: А вие тоа го правите доброволно?
  - speaker: fischer
    text: Ja. Ich bin Rentner. Und ich begleite Neue zu Terminen, beim Jobcenter oder beim Amt.
    meaning:
      en: Yes. I'm a pensioner. And I go with newcomers to appointments, at the Jobcenter or at offices.
      ar: نعم. أنا متقاعد. وأرافق القادمين الجدد إلى المواعيد، في مركز العمل أو في الدوائر.
      mk: Да. Пензионер сум. И ги придружувам новите на термини, во Jobcenter или во канцелариите.
  - speaker: protagonist
    text: Warum?
    meaning:
      en: Why?
      ar: لماذا؟
      mk: Зошто?
  - speaker: fischer
    text: Mit einem Deutschen daneben öffnen sich Türen. Leider ist das so.
    meaning:
      en: With a German beside them, doors open. Sadly, that's how it is.
      ar: مع ألماني بجانبهم تُفتح الأبواب. للأسف هكذا الأمر.
      mk: Со Германец до нив, вратите се отвораат. За жал, така е.
  - speaker: protagonist
    text: Ohne Menschen wie Sie wäre alles schwerer.
    meaning:
      en: Without people like you everything would be harder.
      ar: بدون أناس مثلك لكان كل شيء أصعب.
      mk: Без луѓе како вас сѐ би било потешко.
  - speaker: fischer
    text: Ach was. Es macht mir Spaß.
    meaning:
      en: Oh, come on. I enjoy it.
      ar: لا داعي. أستمتع بذلك.
      mk: Ма, ајде. Ми е забавно.
