- type: narrator
  text:
    en: The Tafeln collect food shops can't sell and give it to people with little money; they run on volunteers. Volunteers who go with newcomers to offices are common — one helpful local can change how
      an appointment goes. Ask at the Tafel, the church or the town's volunteer agency.
    ar: بنوك الطعام (Tafeln) تجمع طعامًا لا تستطيع المتاجر بيعه وتعطيه لذوي الدخل المحدود؛ وتعمل بالمتطوعين. والمتطوعون الذين يرافقون القادمين الجدد إلى الدوائر كثيرون — شخص محلي متعاون واحد قد يغيّر مسار
      موعد. اسأل في بنك الطعام أو الكنيسة أو مكتب التطوّع في المدينة.
    mk: Tafeln собираат храна што продавниците не можат да ја продадат и ја даваат на луѓе со малку пари; работат со волонтери. Волонтери што ги придружуваат новодојдените во канцелариите се чести — еден
      услужлив локален човек може да го смени текот на терминот. Прашајте во Tafel, во црквата или во градската агенција за волонтери.
