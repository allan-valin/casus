steps:
- type: narrator
  text:
    en: Leipzig is one of the least religious cities in Europe. Over tea, Lena and you talk about faith — and that line on the payslip. Listen to the conversation; you don't need to understand it yet.
    ar: لايبزيغ من أقل مدن أوروبا تديّنًا. على الشاي تتحدّثين مع لينا عن الإيمان — وعن ذلك السطر في كشف الراتب. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Лајпциг е еден од најмалку религиозните градови во Европа. На чај разговарате со Лена за верата — и за онаа ставка во платниот лист. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: lena
    text: Laut einer Umfrage sei die Mehrheit in Leipzig konfessionslos.
    meaning:
      en: According to a survey, the majority in Leipzig has no religious affiliation.
      ar: بحسب استطلاع، فإنّ أغلبية سكان لايبزيغ بلا انتماء ديني.
      mk: Според една анкета, мнозинството во Лајпциг било без вероисповед.
  - speaker: protagonist
    text: Und du? Bist du gläubig?
    meaning:
      en: And you? Are you religious?
      ar: وأنتِ؟ هل أنتِ مؤمنة؟
      mk: А ти? Дали си верник?
  - speaker: lena
    text: Nicht wirklich. Ich bin aus der Kirche ausgetreten — wegen der Kirchensteuer.
    meaning:
      en: Not really. I left the church — because of the church tax.
      ar: ليس تمامًا. خرجتُ من الكنيسة — بسبب ضريبة الكنيسة.
      mk: Не баш. Излегов од црквата — поради црковниот данок.
  - speaker: protagonist
    text: Muss man dafür etwas machen?
    meaning:
      en: Do you have to do anything for that?
      ar: هل يجب فعل شيء لذلك؟
      mk: Дали треба нешто да се направи за тоа?
  - speaker: lena
    text: Ja, der Kirchenaustritt ist ein Termin beim Amt. Wer nicht Mitglied der Kirche ist, zahlt nichts.
    meaning:
      en: Yes, leaving the church is an appointment at the office. Whoever isn't a church member pays nothing.
      ar: نعم، الخروج من الكنيسة موعد في الدائرة. ومن ليس عضوًا في الكنيسة لا يدفع شيئًا.
      mk: Да, излегувањето од црквата е термин во канцеларијата. Кој не е член на црквата, не плаќа ништо.
  - speaker: protagonist
    text: Und Moscheen? Orthodoxe Kirchen?
    meaning:
      en: And mosques? Orthodox churches?
      ar: والمساجد؟ والكنائس الأرثوذكسية؟
      mk: А џамиите? Православните цркви?
  - speaker: lena
    text: Die nehmen keine Kirchensteuer. Die Gemeinden leben von Spenden.
    meaning:
      en: They don't take church tax. The communities live on donations.
      ar: لا تأخذ ضريبة كنيسة. الجماعات تعيش من التبرّعات.
      mk: Тие не земаат црковен данок. Заедниците живеат од донации.
  - speaker: protagonist
    text: Mein Nachbar sagt, es gebe hier keine Religionsfreiheit.
    meaning:
      en: My neighbour says there's no freedom of religion here.
      ar: جاري يقول إنه لا توجد هنا حرية دينية.
      mk: Мојот сосед вели дека тука немало слобода на вероисповед.
  - speaker: lena
    text: Doch! Jeder darf glauben, was er will — oder nichts. Man respektiert es nur leise.
    meaning:
      en: There is! Everyone may believe what they want — or nothing. People just respect it quietly.
      ar: بل توجد! يحق لكل أحد أن يؤمن بما يريد — أو بلا شيء. الناس يحترمون ذلك بهدوء فقط.
      mk: Има! Секој смее да верува што сака — или ништо. Луѓето само тивко го почитуваат.
- type: narrator
  text:
    en: 'Konjunktiv I reports what someone else claims, keeping a distance: «Die Mehrheit sei konfessionslos» (is, they say), «es gebe keine Religionsfreiheit» (there is, he says).'
    ar: 'صيغة Konjunktiv I تنقل ما يدّعيه غيرك مع الاحتفاظ بمسافة: «Die Mehrheit sei konfessionslos» (إنّ الأغلبية…، كما يقولون)، «es gebe keine Religionsfreiheit» (إنه لا يوجد…، كما يقول).'
    mk: 'Konjunktiv I пренесува што тврди некој друг, со дистанца: «Die Mehrheit sei konfessionslos» (била, велат), «es gebe keine Religionsfreiheit» (немало, вели тој).'
