- type: narrator
  text:
    en: 'Church tax is collected with your wages only for members of churches that levy it — Catholic, Protestant and some Jewish communities. Mosques and almost all Orthodox churches don''t; they live
      on donations. If you''re registered as a member by mistake or want to leave, it''s a formal step at the registry office or court, not a letter to the church. Faith is seen as private: people seldom
      talk about it, but freedom of religion is in the Basic Law.'
    ar: 'ضريبة الكنيسة تُقتطع من الأجر فقط لأعضاء الكنائس التي تفرضها — الكاثوليكية والبروتستانتية وبعض الجماعات اليهودية. المساجد ومعظم الكنائس الأرثوذكسية لا تفرضها؛ وتعيش من التبرّعات. إذا سُجّلتِ عضوة
      خطأً أو أردتِ الخروج، فهذه خطوة رسمية في مكتب السجل المدني أو المحكمة، لا رسالة إلى الكنيسة. والإيمان يُعدّ شأنًا خاصًا: نادرًا ما يتحدّث الناس عنه، لكن حرية الدين مكفولة في القانون الأساسي.'
    mk: 'Црковниот данок се наплаќа со платата само на членовите на цркви што го наплаќаат — католичката, протестантската и некои еврејски заедници. Џамиите и речиси сите православни цркви не; живеат од
      донации. Ако сте погрешно запишани како член или сакате да излезете, тоа е формален чекор во матичното или во судот, не писмо до црквата. Верата се смета за приватна: ретко се зборува за неа, но слободата
      на вероисповед е во Основниот закон.'
