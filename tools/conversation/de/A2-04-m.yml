steps:
- type: narrator
  text:
    mk: Херр Волф прашува како пензионерите од Македонија живеат три месеци во Лајпциг. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: herrwolf
    text: Reicht Ihre Rente für Deutschland?
    meaning:
      mk: Дали ви е доволна пензијата за Германија?
  - speaker: protagonist
    text: Knapp. Weil die Preise hier hoch sind.
    meaning:
      mk: Тесно. Затоа што цените тука се високи.
  - speaker: herrwolf
    text: Ja, alles ist teuer.
    meaning:
      mk: Да, сè е скапо.
  - speaker: protagonist
    text: Aber wir wohnen bei Petar. Keine Miete.
    meaning:
      mk: Но живееме кај Петар. Без кирија.
  - speaker: herrwolf
    text: Und wenn Sie krank werden?
    meaning:
      mk: А ако се разболите?
  - speaker: protagonist
    text: Wir haben eine Reisekrankenversicherung, zur Sicherheit.
    meaning:
      mk: Имаме патно здравствено осигурување, за секој случај.
  - speaker: herrwolf
    text: Und die europäische Karte?
    meaning:
      mk: А европската картичка?
  - speaker: protagonist
    text: Mit dem bulgarischen Pass auch, ja. Wir sparen das ganze Jahr für die Reise.
    meaning:
      mk: Со бугарскиот пасош и тоа, да. Штедиме цела година за патувањето.
