steps:
- type: narrator
  text:
    en: 'The Christmas market in the centre: crowds, lights, the smell of mulled wine. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'سوق عيد الميلاد في وسط المدينة: زحام وأضواء ورائحة النبيذ الساخن. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.'
    mk: 'Божиќниот пазар во центарот: гужва, светла, мирис на варено вино. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: jonas
    text: Willkommen auf dem Weihnachtsmarkt! Einen Glühwein?
    meaning:
      en: Welcome to the Christmas market! A mulled wine?
      ar: أهلًا بك في سوق عيد الميلاد! نبيذ ساخن؟
      mk: Добредојде на божиќниот пазар! Едно варено вино?
  - speaker: protagonist
    text: Gibt es auch etwas ohne Alkohol?
    meaning:
      en: Is there anything alcohol-free too?
      ar: هل هناك شيء بلا كحول أيضًا؟
      mk: Има ли нешто и без алкохол?
  - speaker: jonas
    text: Klar, Kinderpunsch. Den trinken auch Erwachsene.
    meaning:
      en: Sure, children's punch. Adults drink it too.
      ar: طبعًا، بنش الأطفال. الكبار يشربونه أيضًا.
      mk: Секако, детски пунч. И возрасните го пијат.
  - speaker: protagonist
    text: Dann einen Kinderpunsch. Warum ist die Tasse so teuer?
    meaning:
      en: Then a children's punch. Why is the mug so expensive?
      ar: إذن بنش الأطفال. لماذا الكوب غالٍ هكذا؟
      mk: Тогаш детски пунч. Зошто шолјата е толку скапа?
  - speaker: jonas
    text: Das ist Pfand für die Tasse. Wenn du sie zurückbringst, bekommst du das Geld.
    meaning:
      en: That's a deposit on the mug. If you bring it back, you get the money.
      ar: هذا تأمين على الكوب. إذا أعدته تستعيد المال.
      mk: Тоа е кауција за шолјата. Ако ја вратиш, ги добиваш парите.
  - speaker: protagonist
    text: Und eine Bratwurst?
    meaning:
      en: And a sausage?
      ar: ونقانق؟
      mk: А колбас?
  - speaker: jonas
    text: Die ist aus Schwein. Wenn du willst, gibt es dort Langos — ohne Fleisch.
    meaning:
      en: That's pork. If you like, there's lángos over there — no meat.
      ar: إنها من لحم الخنزير. إذا أردت، هناك لانغوش — بلا لحم.
      mk: Тој е од свинско. Ако сакаш, таму има лангош — без месо.
  - speaker: protagonist
    text: So voll hier! Und die Lichter sind schön.
    meaning:
      en: So crowded here! And the lights are lovely.
      ar: المكان مزدحم جدًا! والأضواء جميلة.
      mk: Толку полно тука! А светлата се убави.
