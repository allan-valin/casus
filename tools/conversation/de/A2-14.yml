- type: narrator
  text:
    en: 'Christmas markets run from late November: mulled wine, sausages, roasted almonds, crafts. Every stand serves an alcohol-free punch, and meat-free food is easy to find. Keep the mug as a souvenir
      or return it for the deposit.'
    ar: 'أسواق عيد الميلاد تبدأ أواخر نوفمبر: نبيذ ساخن ونقانق ولوز محمّص وأشغال يدوية. كل كشك يقدّم بنشًا بلا كحول، والطعام بلا لحم سهل الإيجاد. احتفظ بالكوب تذكارًا أو أعده لتستعيد التأمين.'
    mk: 'Божиќните пазари почнуваат кон крајот на ноември: варено вино, колбаси, печени бадеми, рачни изработки. Секоја тезга има пунч без алкохол, а храна без месо лесно се наоѓа. Шолјата задржете ја за
      спомен или вратете ја за кауцијата.'
