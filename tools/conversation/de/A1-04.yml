- type: narrator
  text:
    en: 'Question words come first: «Wo?» (where), «Wann?» (when), «Warum?» (why), «Welche?» (which). The verb comes right after: «Wo wohnen Sie?»'
    ar: 'كلمات السؤال تأتي أولًا: «Wo?» (أين)، «Wann?» (متى)، «Warum?» (لماذا)، «Welche?» (أيّ). ويأتي الفعل بعدها مباشرة: «Wo wohnen Sie?»'
    mk: 'Прашалните зборови одат напред: «Wo?» (каде), «Wann?» (кога), «Warum?» (зошто), «Welche?» (која). Глаголот веднаш потоа: «Wo wohnen Sie?»'
