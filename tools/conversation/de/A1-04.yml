- type: narrator
  text:
    en: You register within two weeks of moving in, with the landlord's confirmation. Appointments are booked online and can be weeks ahead — book as soon as you know the address.
    ar: يجب التسجيل خلال أسبوعين من السكن، مع تأكيد المؤجِّر. المواعيد تُحجز عبر الإنترنت وقد تكون بعد أسابيع — احجز فور معرفة العنوان.
    mk: Пријавата е во рок од две недели по вселувањето, со потврдата од сопственикот на станот. Термините се закажуваат на интернет и може да чекате со недели — закажете штом ја знаете адресата.
