- type: narrator
  text:
    en: 'The religion box decides church tax: members of the Catholic and Protestant churches pay it through their salary. Ask the office which churches levy it before you answer.'
    ar: 'خانة الديانة تحدّد ضريبة الكنيسة: أعضاء الكنيستين الكاثوليكية والإنجيلية يدفعونها من رواتبهم. اسأل الموظف أيّ الطوائف تُفرض عليها قبل أن تجيب.'
    mk: 'Полето за вероисповест одлучува за црковниот данок: членовите на католичката и евангелската црква го плаќаат од платата. Прашајте во службата кои цркви го наплаќаат пред да одговорите.'
- type: narrator
  for:
  - ar
  - mk
  text:
    ar: لا تُفرض ضريبة الكنيسة على المسلمين؛ يمكنك أن تقول «Ich bin Muslim» أو ببساطة «keins von beiden».
    mk: Православните во Германија вообичаено не плаќаат црковен данок. Како граѓани на ЕУ (со бугарски пасош) само се пријавувате — без виза.
