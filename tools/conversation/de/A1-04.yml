steps:
- type: narrator
  text:
    en: The Bürgeramt, to register your address. Herr Schulz has a form — and an unexpected question. Listen to the conversation; you don't need to understand it yet.
    ar: في دائرة المواطنين (Bürgeramt) لتسجيل عنوانك. السيد شولتس معه استمارة — وسؤال غير متوقع. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Во општинската служба (Bürgeramt), да ја пријавите адресата. Господин Шулц има формулар — и неочекувано прашање. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: schulz
    text: Guten Tag. Haben Sie einen Termin?
    meaning:
      en: Good morning. Do you have an appointment?
      ar: صباح الخير. هل عندك موعد؟
      mk: Добар ден. Имате ли термин?
  - speaker: protagonist
    text: Ja, um zehn Uhr. Ich möchte mich anmelden.
    meaning:
      en: Yes, at ten. I'd like to register.
      ar: نعم، في العاشرة. أودّ أن أسجّل عنواني.
      mk: Да, во десет. Би сакал да се пријавам.
  - speaker: schulz
    text: Gut. Das Formular, bitte. Und die Wohnungsgeberbestätigung.
    meaning:
      en: Good. The form, please. And the landlord's confirmation.
      ar: حسنًا. الاستمارة من فضلك. وتأكيد المؤجِّر.
      mk: Добро. Формуларот, ве молам. И потврдата од сопственикот на станот.
  - speaker: protagonist
    text: Hier, bitte.
    meaning:
      en: Here you are.
      ar: تفضّل.
      mk: Повелете.
  - speaker: schulz
    text: Wo wohnen Sie?
    meaning:
      en: Where do you live?
      ar: أين تسكن؟
      mk: Каде живеете?
  - speaker: protagonist
    text: In der Karl-Liebknecht-Straße, Nummer zwölf.
    meaning:
      en: On Karl-Liebknecht-Straße, number twelve.
      ar: في شارع كارل ليبكنشت، رقم اثني عشر.
      mk: На улица Карл Либкнехт, број дванаесет.
  - speaker: schulz
    text: Welche Religion haben Sie? Katholisch oder evangelisch?
    meaning:
      en: What religion are you? Catholic or Protestant?
      ar: ما ديانتك؟ كاثوليكي أم إنجيلي؟
      mk: Која вероисповест? Католичка или евангелска?
  - speaker: protagonist
    text: Warum? ... Keins von beiden.
    meaning:
      en: Why? ... Neither.
      ar: لماذا؟ ... ولا واحد منهما.
      mk: Зошто? ... Ниту едно ниту друго.
  - speaker: schulz
    text: Für die Kirchensteuer. Gut, dann keine. Fertig!
    meaning:
      en: For the church tax. Fine, then none. Done!
      ar: من أجل ضريبة الكنيسة. حسنًا، إذن لا شيء. انتهينا!
      mk: За црковниот данок. Добро, тогаш ништо. Готово!
  - speaker: protagonist
    text: Das war's? Danke! Schönen Tag noch!
    meaning:
      en: Is that it? Thanks! Have a nice day!
      ar: هل هذا كل شيء؟ شكرًا! يومًا سعيدًا!
      mk: Толку ли беше? Благодарам! Убав ден!
