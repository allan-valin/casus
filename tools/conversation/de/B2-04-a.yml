steps:
- type: narrator
  text:
    ar: مساء السبت عند صديقك سامر، الطبيب السوري. يعمل في غرفة المعاطف في نادٍ ليلي ريثما يحصل على ترخيص المزاولة. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Samer, wie geht es mit der Approbation?
    meaning:
      ar: سامر، كيف تسير أمور ترخيص المزاولة؟
  - speaker: samer
    text: Langsam. Meine Unterlagen wurden geprüft. Jetzt kommt die Fachsprachprüfung, dann die Kenntnisprüfung.
    meaning:
      ar: ببطء. فُحصت أوراقي. الآن يأتي امتحان اللغة المهنية، ثم امتحان المعرفة.
  - speaker: protagonist
    text: Und bis dahin?
    meaning:
      ar: وحتى ذلك الحين؟
  - speaker: samer
    text: Nachts arbeite ich in der Garderobe. Ein Arzt hängt Jacken auf!
    meaning:
      ar: أعمل ليلًا في غرفة المعاطف. طبيب يعلّق المعاطف!
  - speaker: protagonist
    text: Bei mir ging es schneller. Mein Diplom wurde für die Blaue Karte anerkannt — durch eine Zeugnisbewertung.
    meaning:
      ar: عندي كان الأمر أسرع. اعتُرف بشهادتي للبطاقة الزرقاء — عبر تقييم الشهادة.
  - speaker: samer
    text: Ingenieur ist nicht reglementiert. Arzt schon. Das dauert.
    meaning:
      ar: الهندسة ليست مهنة منظَّمة. الطب منظَّم. هذا يستغرق وقتًا.
  - speaker: protagonist
    text: Du bist so überqualifiziert.
    meaning:
      ar: أنت مؤهَّل أكثر من اللازم بكثير.
  - speaker: samer
    text: Ja. Aber nächstes Jahr bin ich wieder Arzt. Inschallah.
    meaning:
      ar: نعم. لكن في السنة القادمة سأعود طبيبًا. إن شاء الله.
