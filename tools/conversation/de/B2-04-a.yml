    ar: المهن المنظَّمة — الطب والتمريض والتعليم والمحاماة — تحتاج اعترافًا رسميًا قبل مزاولتها، وغالبًا امتحان لغة مهنية وامتحان معرفة. أما الهندسة فتكفي غالبًا لتأشيرة العمل مقارنةُ الشهادة (Zeugnisbewertung).
