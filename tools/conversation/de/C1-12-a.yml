steps:
- type: narrator
  text:
    ar: 'يارا في الصف الرابع. مع زوجتك تذهبان إلى حديث الأهل مع المعلّمة: ثانوية أكاديمية أم مدرسة عامة؟ استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.'
- type: dialogue
  lines:
  - speaker: klassenlehrerin
    text: Yara ist eine gute Schülerin. Die in Mathe erreichte Note ist sehr gut.
    meaning:
      ar: يارا تلميذة جيدة. الدرجة المحقَّقة في الرياضيات ممتازة.
  - speaker: protagonist
    text: Und in Deutsch?
    meaning:
      ar: وفي الألمانية؟
  - speaker: klassenlehrerin
    text: Die in Deutsch erreichte Note ist eine Drei. Für das Gymnasium braucht sie einen besseren Notendurchschnitt.
    meaning:
      ar: الدرجة المحقَّقة في الألمانية ثلاثة. للثانوية الأكاديمية تحتاج معدّل درجات أفضل.
  - speaker: protagonist
    text: Sie spricht zu Hause Arabisch. Ist das ein Nachteil?
    meaning:
      ar: إنها تتكلّم العربية في البيت. هل هذا عائق؟
  - speaker: klassenlehrerin
    text: Nein, Zweisprachigkeit ist ein Vorteil. Mit Förderung in Deutsch schafft sie das.
    meaning:
      ar: لا، ثنائية اللغة ميزة. مع دعم في الألمانية ستنجح.
  - speaker: protagonist
    text: Und wenn sie zuerst auf die Oberschule geht?
    meaning:
      ar: وإذا ذهبت أولًا إلى المدرسة العامة؟
  - speaker: klassenlehrerin
    text: Es gibt Durchlässigkeit. Mit guten Noten kann sie später wechseln.
    meaning:
      ar: هناك إمكانية انتقال. بدرجات جيدة يمكنها أن تنتقل لاحقًا.
  - speaker: protagonist
    text: Dann organisieren wir Nachhilfe und entscheiden im Frühling.
    meaning:
      ar: إذن ننظّم دروسًا خصوصية ونقرّر في الربيع.
