- type: narrator
  text:
    ar: 'في معظم الولايات يُوزَّع الأطفال بعد الصف الرابع (في سن العاشرة): الثانوية الأكاديمية (Gymnasium) تؤدّي إلى البكالوريا، والمدارس الأخرى إلى مسارات مهنية. التوصية تعتمد على الدرجات، ومدى إلزاميتها
      يختلف بين الولايات. الانتقال لاحقًا ممكن، ويمكن نيل البكالوريا بعد ذلك. والعربية في البيت ميزة لا عائق — والدعم في الألمانية متاح في المدرسة.'
