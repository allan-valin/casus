- type: narrator
  text:
    en: 'Adjective endings follow the article: «ein gutes Schloss», «ein altes Fahrrad», «neue Reifen». Learn them in phrases, not as a table.'
    ar: 'نهايات النعوت تتبع الأداة: «ein gutes Schloss»، «ein altes Fahrrad»، «neue Reifen». احفظيها في عبارات، لا في جدول.'
    mk: 'Наставките на придавките го следат членот: «ein gutes Schloss», «ein altes Fahrrad», «neue Reifen». Учете ги во изрази, не во табела.'
