- type: narrator
  text:
    en: 'Bikes are everywhere — and so are bike thieves: lock the frame to something fixed. Ride in bike lanes, never on the pavement, and with lights after dark: police do check.'
    ar: 'الدراجات في كل مكان — وكذلك لصوص الدراجات: اربطي الإطار بشيء ثابت. قودي على مسارات الدراجات، لا على الرصيف أبدًا، ومع الأضواء بعد الغروب: الشرطة تفحص فعلًا.'
    mk: 'Велосипеди има насекаде — а и крадци: заклучете ја рамката за нешто цврсто. Возете по велосипедски патеки, никогаш по тротоар, и со светла во темно: полицијата проверува.'
