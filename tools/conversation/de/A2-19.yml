steps:
- type: narrator
  text:
    en: A second-hand bike from an online ad. The seller lives round the corner. Listen to the conversation; you don't need to understand it yet.
    ar: دراجة مستعملة من إعلان على الإنترنت. البائع يسكن قريبًا. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Половен велосипед од оглас на интернет. Продавачот живее зад аголот. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: kasse
    text: Hallo! Das ist das Fahrrad. Ein altes, aber ein gutes.
    meaning:
      en: Hi! This is the bike. An old one, but a good one.
      ar: مرحبًا! هذه الدراجة. قديمة لكنها جيدة.
      mk: Здраво! Ова е велосипедот. Стар, но добар.
  - speaker: protagonist
    text: Funktionieren die Bremsen?
    meaning:
      en: Do the brakes work?
      ar: هل تعمل المكابح؟
      mk: Работат ли сопирачките?
  - speaker: kasse
    text: Ja. Und es hat neue Reifen.
    meaning:
      en: Yes. And it has new tyres.
      ar: نعم. وفيها إطارات جديدة.
      mk: Да. И има нови гуми.
  - speaker: protagonist
    text: Und das Licht?
    meaning:
      en: And the light?
      ar: والضوء؟
      mk: А светлото?
  - speaker: kasse
    text: Funktioniert auch. Möchten Sie eine Probefahrt machen?
    meaning:
      en: Works too. Would you like a test ride?
      ar: يعمل أيضًا. هل تودّين تجربتها؟
      mk: И тоа работи. Сакате ли пробно возење?
  - speaker: protagonist
    text: Gern! ... Der Korb vorne ist praktisch.
    meaning:
      en: Gladly! ... The basket at the front is handy.
      ar: بكل سرور! ... السلة في الأمام عملية.
      mk: Со задоволство! ... Кошничката напред е практична.
  - speaker: kasse
    text: Kaufen Sie unbedingt ein gutes Schloss. In Leipzig klaut man Fahrräder.
    meaning:
      en: Be sure to buy a good lock. In Leipzig bikes get stolen.
      ar: اشتري قفلًا جيدًا بالتأكيد. في لايبزيغ تُسرق الدراجات.
      mk: Обавезно купете добра брава. Во Лајпциг се крадат велосипеди.
  - speaker: protagonist
    text: Und ich fahre auf dem Radweg, nicht auf dem Gehweg?
    meaning:
      en: And I ride in the bike lane, not on the pavement?
      ar: وأقود على مسار الدراجات، لا على الرصيف؟
      mk: И возам по велосипедската патека, не по тротоарот?
  - speaker: kasse
    text: Genau. Und abends mit Licht!
    meaning:
      en: Exactly. And with lights in the evening!
      ar: بالضبط. وفي المساء مع الضوء!
      mk: Точно. И навечер со светло!
- type: prompt
  ask:
