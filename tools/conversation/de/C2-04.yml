    ar: 'قل: “التصريح — و“المقابلة — و“أمام الكاميرا — و“باسم النادي — و“يسعدنا كثيرًا أنّ … — و“الدعم — و“الاندماج عبر الرياضة — و“أودّ أن أشير إلى أنّ … — و“ختامًا — و“متوتّر — و“النخب — و“الضيوف الأعزاء
