steps:
- type: narrator
  text:
    en: Your annual review — and this time you ask for more money. Frau Schröder makes a counter-offer. Listen to the conversation; you don't need to understand it yet.
    ar: حديث التقييم السنوي — وهذه المرة تطلب مالًا أكثر. السيدة شرودر تقدّم عرضًا مضادًا. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Годишниот разговор — и овој пат барате повеќе пари. Госпоѓа Шредер дава контрапонуда. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Ich habe Verantwortung für zwei Projekte übernommen. Ich hätte mir eine Gehaltserhöhung von zehn Prozent vorgestellt.
    meaning:
      en: I've taken on responsibility for two projects. I had a ten per cent raise in mind.
      ar: تولّيتُ مسؤولية مشروعين. كنتُ أتصوّر زيادة في الراتب بعشرة بالمئة.
      mk: Презедов одговорност за два проекти. Замислував покачување на платата од десет проценти.
  - speaker: schroeder
    text: Zehn Prozent? Das Budget ist dieses Jahr begrenzt.
    meaning:
      en: Ten per cent? The budget is limited this year.
      ar: عشرة بالمئة؟ الميزانية محدودة هذا العام.
      mk: Десет проценти? Буџетот оваа година е ограничен.
  - speaker: protagonist
    text: Das verstehe ich. Aber mein Marktwert ist gestiegen — ich habe mich informiert.
    meaning:
      en: I understand that. But my market value has gone up — I've done my research.
      ar: أفهم ذلك. لكن قيمتي السوقية ارتفعت — لقد اطّلعتُ على الأمر.
      mk: Тоа го разбирам. Но мојата пазарна вредност порасна — се информирав.
  - speaker: schroeder
    text: 'Mein Gegenangebot: fünf Prozent jetzt.'
    meaning:
      en: 'My counter-offer: five per cent now.'
      ar: 'عرضي المضاد: خمسة بالمئة الآن.'
      mk: 'Мојата контрапонуда: пет проценти сега.'
  - speaker: protagonist
    text: Wäre es denkbar, dass wir uns bei sieben treffen — und zwei zusätzliche Urlaubstage?
    meaning:
      en: Would it be conceivable for us to meet at seven — plus two extra holiday days?
      ar: هل من الممكن أن نلتقي عند سبعة — مع يومي إجازة إضافيين؟
      mk: Дали би било замисливо да се сретнеме на седум — и два дополнителни дена одмор?
  - speaker: schroeder
    text: Sie verhandeln gut. Sechs Prozent und die Urlaubstage.
    meaning:
      en: You negotiate well. Six per cent and the holiday days.
      ar: تفاوض جيدًا. ستة بالمئة وأيام الإجازة.
      mk: Добро преговарате. Шест проценти и деновите одмор.
  - speaker: protagonist
    text: Ich würde vorschlagen, dass wir das schriftlich festhalten.
    meaning:
      en: I would suggest we put that in writing.
      ar: أقترح أن نثبّت ذلك كتابيًا.
      mk: Би предложил тоа да го запишеме.
  - speaker: schroeder
    text: Selbstverständlich. Dann haben wir eine Vereinbarung.
    meaning:
      en: Of course. Then we have an agreement.
      ar: بالطبع. إذن لدينا اتفاق.
      mk: Се разбира. Тогаш имаме договор.
- type: prompt
  ask:
    en: 'Say: the salary negotiation.'
    ar: 'قل: التفاوض على الراتب.'
    mk: 'Кажете: преговорите за плата.'
  answer:
    speaker: protagonist
    text: Die Gehaltsverhandlung.
  items:
  - die-gehaltsverhandlung
- type: narrator
  text:
    en: 'Konjunktiv II makes firm demands polite and leaves room to move: «Ich hätte mir … vorgestellt» (I had in mind), «Wäre es denkbar, dass…?» (would it be conceivable), «Ich würde vorschlagen, …» (I''d
      suggest).'
    ar: 'صيغة التمني تجعل المطالب الحازمة مؤدبة وتترك مجالًا للتحرّك: «Ich hätte mir … vorgestellt» (كنتُ أتصوّر)، «Wäre es denkbar, dass…?» (هل من الممكن)، «Ich würde vorschlagen, …» (أقترح).'
    mk: 'Konjunktiv II ги прави цврстите барања учтиви и остава простор: «Ich hätte mir … vorgestellt» (замислував), «Wäre es denkbar, dass…?» (дали би било замисливо), «Ich würde vorschlagen, …» (би предложил).'
