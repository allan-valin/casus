- type: narrator
  text:
    en: In Germany you ask for a raise yourself — usually in the annual review — with arguments (new responsibility, market data), not personal needs. Start a little high, accept a counter-offer, trade
      money for holidays or training, and get the result in writing.
    ar: في ألمانيا تطلب الزيادة بنفسك — عادةً في حديث التقييم السنوي — بحجج (مسؤولية جديدة، بيانات السوق) لا باحتياجات شخصية. ابدأ أعلى قليلًا، واقبل عرضًا مضادًا، وبادل المال بإجازات أو تدريب، واحصل على
      النتيجة كتابيًا.
    mk: Во Германија сами барате покачување — обично на годишниот разговор — со аргументи (нова одговорност, пазарни податоци), не лични потреби. Почнете малку повисоко, прифатете контрапонуда, заменете
      пари за одмор или обука и добијте го резултатот писмено.
