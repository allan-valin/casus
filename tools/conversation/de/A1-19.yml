- type: narrator
  text:
    en: 'Most towns hold a weekly market in the main square: farmers, bakers, stalls run by families from Turkey, Vietnam, Italy. Prices are fixed; bargaining isn''t usual, but a regular gets a little extra.'
    ar: 'في معظم المدن سوق أسبوعي في الساحة الرئيسية: مزارعون وخبّازون وأكشاك تديرها عائلات من تركيا وفيتنام وإيطاليا. الأسعار ثابتة والمساومة ليست عادة، لكن الزبون الدائم يحصل على شيء إضافي.'
    mk: 'Во повеќето градови има неделен пазар на главниот плоштад: земјоделци, пекари, тезги на семејства од Турција, Виетнам, Италија. Цените се фиксни; пазарење не е обичај, но редовниот купувач добива
      нешто повеќе.'
