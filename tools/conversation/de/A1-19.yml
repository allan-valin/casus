steps:
- type: narrator
  text:
    en: Saturday market. Herr Yilmaz sells fruit and vegetables and jokes with everyone. Listen to the conversation; you don't need to understand it yet.
    ar: سوق السبت. السيد يلماز يبيع الخضار والفاكهة ويمازح الجميع. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Сабота, пазарот. Господин Јилмаз продава овошје и зеленчук и се шегува со сите. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: yilmaz
    text: Guten Morgen! Alles frisch, alles aus der Region!
    meaning:
      en: Good morning! All fresh, all local!
      ar: صباح الخير! كله طازج، كله من المنطقة!
      mk: Добро утро! Сè свежо, сè од регионот!
  - speaker: protagonist
    text: Guten Morgen. Ein Kilo Tomaten, bitte.
    meaning:
      en: Good morning. A kilo of tomatoes, please.
      ar: صباح الخير. كيلو طماطم من فضلك.
      mk: Добро утро. Едно кило домати, ве молам.
  - speaker: yilmaz
    text: Gern! Noch etwas?
    meaning:
      en: With pleasure! Anything else?
      ar: بكل سرور! شيء آخر؟
      mk: Со задоволство! Уште нешто?
  - speaker: protagonist
    text: Ein halbes Kilo Äpfel. Und eine Gurke.
    meaning:
      en: Half a kilo of apples. And a cucumber.
      ar: نصف كيلو تفاح. وخيارة.
      mk: Половина кило јаболка. И една краставица.
  - speaker: yilmaz
    text: Die Gurke kostet achtzig Cent das Stück.
    meaning:
      en: The cucumber is eighty cents each.
      ar: الخيارة بثمانين سنتًا للقطعة.
      mk: Краставицата чини осумдесет центи парчето.
  - speaker: protagonist
    text: Gut. Das ist alles. Was kostet das zusammen?
    meaning:
      en: Good. That's all. How much is that altogether?
      ar: حسنًا. هذا كل شيء. كم المجموع؟
      mk: Добро. Тоа е сè. Колку чини вкупно?
  - speaker: yilmaz
    text: Fünf Euro zwanzig.
    meaning:
      en: Five euros twenty.
      ar: خمسة يورو وعشرون.
      mk: Пет евра и дваесет.
  - speaker: protagonist
    text: Hier sind sechs Euro. Stimmt so!
    meaning:
      en: Here are six euros. Keep the change!
      ar: هذه ستة يورو. احتفظ بالباقي!
      mk: Еве шест евра. Нема потреба од кусур!
  - speaker: yilmaz
    text: Danke! Und die Petersilie ist geschenkt.
    meaning:
      en: Thanks! And the parsley's on the house.
      ar: شكرًا! والبقدونس هدية.
      mk: Благодарам! А магдоносот е подарок.
