- type: narrator
  text:
    en: 'You pay monthly advances for heating and water; once a year the landlord sends the real bill. If you used more, you pay the difference — if less, you get money back. Check the statement: you may
      ask to see the receipts.'
    ar: 'تدفع دفعات شهرية مسبقة للتدفئة والماء؛ ومرة في السنة يرسل المؤجِّر الفاتورة الحقيقية. إن استهلكت أكثر تدفع الفرق — وإن استهلكت أقل تستعيد مالًا. راجع الكشف: يحق لك طلب الاطلاع على الإيصالات.'
    mk: 'Плаќате месечни аконтации за греење и вода; еднаш годишно сопственикот ја праќа вистинската сметка. Ако потрошивте повеќе, ја доплаќате разликата — ако помалку, добивате пари назад. Проверете ја
      пресметката: имате право да ги видите сметките.'
