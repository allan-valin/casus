steps:
- type: narrator
  text:
    en: 'The yearly heating statement arrives: you owe money. Frau Becker explains — and talks about her solar panels. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'تصل كشوف التدفئة السنوية: عليك مبلغ. السيدة بيكر تشرح — وتتحدث عن ألواحها الشمسية. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.'
    mk: 'Стигнува годишната пресметка за греење: должите пари. Госпоѓа Бекер објаснува — и зборува за своите сончеви панели. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: Frau Becker, ich muss nachzahlen! Dreihundert Euro.
    meaning:
      en: Mrs Becker, I have to pay extra! Three hundred euros.
      ar: سيدة بيكر، يجب أن أدفع فرقًا! ثلاثمئة يورو.
      mk: Госпоѓо Бекер, морам да доплатам! Триста евра.
  - speaker: becker
    text: Das ist die Nebenkostenabrechnung. Einmal im Jahr wird alles berechnet.
    meaning:
      en: That's the yearly utilities statement. Once a year everything is calculated.
      ar: هذا كشف التكاليف الإضافية. مرة في السنة يُحسَب كل شيء.
      mk: Тоа е годишната пресметка. Еднаш годишно сѐ се пресметува.
  - speaker: protagonist
    text: Aber ich zahle doch jeden Monat einen Abschlag.
    meaning:
      en: But I pay an advance every month.
      ar: لكنني أدفع دفعة مسبقة كل شهر.
      mk: Но јас плаќам аконтација секој месец.
  - speaker: becker
    text: Ja, aber Ihr Verbrauch war höher. Der Winter war kalt.
    meaning:
      en: Yes, but your consumption was higher. The winter was cold.
      ar: نعم، لكن استهلاكك كان أعلى. الشتاء كان باردًا.
      mk: Да, но потрошувачката ви беше повисока. Зимата беше студена.
  - speaker: protagonist
    text: Wie kann ich Energie sparen?
    meaning:
      en: How can I save energy?
      ar: كيف يمكنني توفير الطاقة؟
      mk: Како можам да штедам енергија?
  - speaker: becker
    text: Stoßlüften, nicht kippen! Und die Heizung nachts runter.
    meaning:
      en: Air briefly, don't tilt! And the heating down at night.
      ar: هوِّ بقوة لا بالإمالة! واخفض التدفئة ليلًا.
      mk: Проветрувајте накратко, не накосувајте! И греењето ноќе намалено.
  - speaker: protagonist
    text: Sie haben eine Solaranlage auf dem Dach, oder?
    meaning:
      en: You have solar panels on the roof, don't you?
      ar: عندك ألواح شمسية على السطح، أليس كذلك؟
      mk: Имате сончеви панели на покривот, нели?
  - speaker: becker
    text: Ja! Dort wird mein Strom erzeugt — im Sommer fast alles.
    meaning:
      en: Yes! That's where my electricity is produced — almost all of it in summer.
      ar: نعم! هناك تُنتَج كهربائي — تقريبًا كلها في الصيف.
      mk: Да! Таму се произведува мојата струја — во лето речиси сета.
