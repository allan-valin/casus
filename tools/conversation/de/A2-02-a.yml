steps:
- type: narrator
  text:
    ar: دائرة الأجانب. السيد شولتس يراجع بطاقتك الزرقاء وإقامة زوجتك وابنتك. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
- type: dialogue
  lines:
  - speaker: schulz
    text: Sie haben eine Blaue Karte. Und Ihre Familie?
    meaning:
      ar: عندك البطاقة الزرقاء. وعائلتك؟
  - speaker: protagonist
    text: Meine Frau und meine Tochter sind im Herbst gekommen. Familiennachzug.
    meaning:
      ar: زوجتي وابنتي جاءتا في الخريف. لمّ الشمل.
  - speaker: schulz
    text: Gut. Haben Sie den Arbeitsvertrag?
    meaning:
      ar: جيد. هل معك عقد العمل؟
  - speaker: protagonist
    text: Ja, ich habe alles mitgebracht.
    meaning:
      ar: نعم، أحضرتُ كل شيء.
  - speaker: schulz
    text: Ihre Frau bekommt auch einen Aufenthaltstitel.
    meaning:
      ar: زوجتك تحصل أيضًا على تصريح إقامة.
  - speaker: protagonist
    text: Darf meine Frau arbeiten?
    meaning:
      ar: هل يُسمح لزوجتي أن تعمل؟
  - speaker: schulz
    text: Ja. Die Regeln ändern sich aber — prüfen Sie es bitte jedes Mal.
    meaning:
      ar: نعم. لكن القواعد تتغير — تحقّق منها في كل مرة من فضلك.
  - speaker: protagonist
    text: Und wann muss ich verlängern?
    meaning:
      ar: ومتى يجب أن أمدّد؟
  - speaker: schulz
    text: Kommen Sie drei Monate vorher. Termine sind knapp.
    meaning:
      ar: تعال قبل ثلاثة أشهر. المواعيد قليلة.
