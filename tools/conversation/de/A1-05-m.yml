- type: narrator
  text:
    mk: «das U-Heft» е жолта книшка што се добива при раѓање, со сите редовни прегледи на детето (U1 до U9). Замолете ги Петар и Ања да ви ја дадат заедно со картичката, кога вие го носите Лука.
- type: prompt
