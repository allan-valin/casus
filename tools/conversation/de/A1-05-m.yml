steps:
- type: narrator
  text:
    mk: Лука се разболе, а родителите се на работа. Со картичката од осигурувањето го носите кај детската лекарка. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: wagner
    text: Guten Tag. Sie sind …?
    meaning:
      mk: Добар ден. Вие сте …?
  - speaker: protagonist
    text: Ich bin die Oma von Luka. Die Eltern arbeiten.
    meaning:
      mk: Јас сум бабата на Лука. Родителите се на работа.
  - speaker: wagner
    text: Gut. Was fehlt Luka?
    meaning:
      mk: Добро. Што му е на Лука?
  - speaker: protagonist
    text: Luka hat Fieber. Seit heute Morgen.
    meaning:
      mk: Лука има температура. Од утрово.
  - speaker: wagner
    text: Haben Sie die Karte und das U-Heft?
    meaning:
      mk: Ги имате ли картичката и жолтата книшка?
  - speaker: protagonist
    text: Die Karte, ja. Das U-Heft ... nein.
    meaning:
      mk: Картичката, да. Книшката ... не.
  - speaker: wagner
    text: Kein Problem. Hustet er auch?
    meaning:
      mk: Нема проблем. Кашла ли?
  - speaker: protagonist
    text: Ja, ein bisschen.
    meaning:
      mk: Да, малку.
  - speaker: wagner
    text: Ich gebe Ihnen einen Saft. Dreimal am Tag. Gute Besserung, Luka!
    meaning:
      mk: Ќе ви дадам сируп. Три пати на ден. Брзо оздравување, Лука!
  - speaker: protagonist
    text: Vielen Dank!
    meaning:
      mk: Многу благодарам!
- type: prompt
  ask:
    mk: 'Претставете се: јас сум бабата на Лука.'
  answer:
    speaker: protagonist
    text: Ich bin die Oma von Luka.
  items:
