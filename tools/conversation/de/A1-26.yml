- type: narrator
  text:
    en: 'Germans shake hands when they introduce themselves, also between men and women. People introduce themselves by surname: «Neumann», and you answer «Frau Neumann».'
    ar: 'يتصافح الألمان عند التعارف، بين الرجال والنساء أيضًا. ويعرّفون أنفسهم بالكنية: «Neumann»، فتجيب «Frau Neumann».'
    mk: 'Германците се ракуваат кога се претставуваат, и меѓу мажи и жени. Се претставуваат со презимето: «Neumann», а вие одговарате «Frau Neumann».'
