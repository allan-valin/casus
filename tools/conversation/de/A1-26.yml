steps:
- type: narrator
  text:
    en: A new neighbour moves in on the first floor. She rings your bell to introduce herself. Listen to the conversation; you don't need to understand it yet.
    ar: جارة جديدة تسكن في الطابق الأول. تقرع جرس بابك لتعرّف بنفسها. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Нова соседка се вселува на првиот кат. Ѕвони на вашата врата да се претстави. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: neumann
    text: Guten Tag! Darf ich mich vorstellen? Mein Name ist Neumann.
    meaning:
      en: Good afternoon! May I introduce myself? My name is Neumann.
      ar: نهارك سعيد! هل تسمح لي أن أعرّفك بنفسي؟ اسمي نويمان.
      mk: Добар ден! Може ли да се претставам? Моето име е Нојман.
  - speaker: protagonist
    text: Guten Tag, Frau Neumann. Willkommen im Haus!
    meaning:
      en: Good afternoon, Mrs Neumann. Welcome to the house!
      ar: نهارك سعيد يا سيدة نويمان. أهلًا بك في العمارة!
      mk: Добар ден, госпоѓо Нојман. Добредојдовте во зградата!
  - speaker: neumann
    text: Danke! Ich wohne jetzt im ersten Stock. Freut mich!
    meaning:
      en: Thanks! I live on the first floor now. Nice to meet you!
      ar: شكرًا! أسكن الآن في الطابق الأول. تشرفنا!
      mk: Благодарам! Сега живеам на првиот кат. Мило ми е!
  - speaker: protagonist
    text: Freut mich auch.
    meaning:
      en: Nice to meet you too.
      ar: تشرفنا أيضًا.
      mk: И мене ми е мило.
  - speaker: neumann
    text: Wohnen Sie schon lange hier?
    meaning:
      en: Have you lived here long?
      ar: هل تسكن هنا منذ وقت طويل؟
      mk: Дали живеете тука веќе долго?
  - speaker: protagonist
    text: Seit drei Monaten.
    meaning:
      en: For three months.
      ar: منذ ثلاثة أشهر.
      mk: Веќе три месеци.
  - speaker: neumann
    text: Und? Wie gefällt es Ihnen?
    meaning:
      en: And? How do you like it?
      ar: وكيف تجد المكان؟
      mk: И? Како ви се допаѓа?
  - speaker: protagonist
    text: Gut! Nur der Winter ist lang.
    meaning:
      en: Good! Only the winter is long.
      ar: جيد! فقط الشتاء طويل.
      mk: Добро! Само зимата е долга.
  - speaker: neumann
    text: Der Frühling kommt! Wenn Sie etwas brauchen, klingeln Sie einfach.
    meaning:
      en: Spring is coming! If you need anything, just ring.
      ar: الربيع قادم! إن احتجت شيئًا فاقرع الجرس فقط.
      mk: Пролетта доаѓа! Ако ви треба нешто, само ѕвонете.
  - speaker: protagonist
    text: Danke, gleichfalls!
    meaning:
      en: Thanks, likewise!
      ar: شكرًا، وأنت أيضًا!
      mk: Благодарам, исто така!
- type: prompt
  ask:
    en: 'She asks: may I introduce myself?'
    ar: 'تسأل: هل تسمح لي أن أعرّفك بنفسي؟'
    mk: 'Таа прашува: може ли да се претставам?'
  answer:
    speaker: protagonist
    text: Darf ich mich vorstellen?
  items:
  - darf-ich-mich-vorstellen
- type: prompt
  ask:
