- type: narrator
  text:
    en: Around Leipzig, old open-cast coal mines have been flooded into lakes — the 'Neuseenland'. Never walk on ice unless the city declares it safe.
    ar: حول لايبزيغ غُمرت مناجم الفحم المكشوفة القديمة بالماء فأصبحت بحيرات — «أرض البحيرات الجديدة». لا تمشِ على الجليد أبدًا إلا إذا أعلنت المدينة أنه آمن.
    mk: Околу Лајпциг старите површински рудници за јаглен се поплавени и станаа езера — „Ноизенланд“. Никогаш не одете по мраз ако градот не објавил дека е безбедно.
