steps:
- type: narrator
  text:
    en: February. Jonas takes you to the Cospudener See, a lake south of Leipzig — frozen. Listen to the conversation; you don't need to understand it yet.
    ar: فبراير. يوناس يأخذك إلى بحيرة كوسبودينر، جنوب لايبزيغ — متجمّدة. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Февруари. Јонас ве носи на езерото Коспуденер, јужно од Лајпциг — замрзнато. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: Das ist der Cospudener See. Im Winter ist er gefroren.
    meaning:
      en: This is the Cospudener See. In winter it's frozen.
      ar: هذه بحيرة كوسبودينر. في الشتاء تتجمّد.
      mk: Ова е езерото Коспуденер. Во зима е замрзнато.
  - speaker: protagonist
    text: Ein See so nah an der Stadt?
    meaning:
      en: A lake so close to the city?
      ar: بحيرة قريبة جدًا من المدينة؟
      mk: Езеро толку близу до градот?
  - speaker: jonas
    text: Früher war hier ein Bergwerk. Dann ist es ein See geworden.
    meaning:
      en: There used to be a mine here. Then it became a lake.
      ar: في الماضي كان هنا منجم. ثم أصبح بحيرة.
      mk: Порано тука имаше рудник. Потоа стана езеро.
  - speaker: protagonist
    text: Können wir auf dem Eis gehen?
    meaning:
      en: Can we walk on the ice?
      ar: هل يمكننا المشي على الجليد؟
      mk: Може ли да одиме по мразот?
  - speaker: jonas
    text: Nein, das ist gefährlich. Letzte Woche ist es geschmolzen und wieder gefroren.
    meaning:
      en: No, that's dangerous. Last week it melted and froze again.
      ar: لا، هذا خطير. الأسبوع الماضي ذاب ثم تجمّد من جديد.
      mk: Не, опасно е. Минатата недела се стопи и пак замрзна.
  - speaker: protagonist
    text: Wir sind schon lange gelaufen. Mir ist kalt.
    meaning:
      en: We've walked a long way. I'm cold.
      ar: مشينا طويلًا. أشعر بالبرد.
      mk: Долго одевме. Ладно ми е.
  - speaker: jonas
    text: Dort ist ein Café. Siehst du den Dampf? Heißer Tee!
    meaning:
      en: There's a café over there. See the steam? Hot tea!
      ar: هناك مقهى. هل ترى البخار؟ شاي ساخن!
      mk: Таму има кафуле. Ја гледаш пареата? Топол чај!
  - speaker: protagonist
    text: Und im Sommer?
    meaning:
      en: And in summer?
      ar: وفي الصيف؟
      mk: А во лето?
  - speaker: jonas
    text: Im Sommer baden alle hier. Das Wasser ist sauber.
    meaning:
      en: In summer everyone swims here. The water is clean.
      ar: في الصيف يسبح الجميع هنا. الماء نظيف.
      mk: Во лето сите се капат тука. Водата е чиста.
