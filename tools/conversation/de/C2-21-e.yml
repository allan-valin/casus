steps:
- type: narrator
  text:
    en: Two weeks back in your home country after years away. On a video call, Lena asks how it feels. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: lena
    text: Und? Wie ist es, wieder zu Hause zu sein?
    meaning:
      en: So? How is it to be home again?
  - speaker: protagonist
    text: Komisch. Meine alte Heimat ist mir ein bisschen fremd geworden.
    meaning:
      en: Strange. My old homeland has become a bit unfamiliar to me.
  - speaker: lena
    text: Inwiefern?
    meaning:
      en: In what way?
  - speaker: protagonist
    text: Ich ertappe mich dabei, dass ich mich über Unpünktlichkeit ärgere. Wie eine Deutsche!
    meaning:
      en: I catch myself getting annoyed about unpunctuality. Like a German!
  - speaker: lena
    text: Das nennt man umgekehrten Kulturschock.
    meaning:
      en: That's called reverse culture shock.
  - speaker: protagonist
    text: Und ich vermisse sogar die Mülltrennung. Aber hier ist meine Familie, meine Sprache, das Essen...
    meaning:
      en: And I even miss recycling. But here is my family, my language, the food...
  - speaker: lena
    text: Du sitzt zwischen den Stühlen.
    meaning:
      en: You're caught between two worlds.
  - speaker: protagonist
    text: Oder ich bin doppelt zu Hause. Das gefällt mir besser.
    meaning:
      en: Or I'm at home twice over. I like that better.
