- type: narrator
  text:
    en: 'Reporting questions: question word or «ob» + verb at the end. «Er fragte, warum ich dort arbeiten möchte», «Er wollte wissen, ob ich Fragen habe».'
    ar: 'نقل الأسئلة: كلمة السؤال أو «ob» ثم الفعل في الآخر. «Er fragte, warum ich dort arbeiten möchte»، «Er wollte wissen, ob ich Fragen habe».'
