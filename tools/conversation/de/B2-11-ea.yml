steps:
- type: narrator
  text:
    en: 'Your cover letter worked: an interview with Herr Lange, head of personnel. Afterwards Tim wants every detail. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'رسالة التقديم نجحت: مقابلة مع السيد لانغه، رئيس شؤون الموظفين. بعدها يريد تيم كل التفاصيل. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.'
- type: dialogue
  lines:
  - speaker: lange
    text: Warum möchten Sie bei uns arbeiten?
    meaning:
      en: Why would you like to work for us?
      ar: لماذا تريد العمل لدينا؟
  - speaker: protagonist
    text: Ich habe mich über Ihre Firma informiert. Ihre Projekte passen zu meiner Erfahrung.
    meaning:
      en: I've researched your company. Your projects fit my experience.
      ar: اطّلعتُ على معلومات عن شركتكم. مشاريعكم تناسب خبرتي.
  - speaker: lange
    text: Hier ist eine Lücke im Lebenslauf. Was haben Sie damals gemacht?
    meaning:
      en: There's a gap in your CV here. What were you doing then?
      ar: هنا فجوة في السيرة الذاتية. ماذا كنت تفعل حينها؟
  - speaker: protagonist
    text: Ich habe Deutsch gelernt und meine Familie unterstützt. Das war meine Motivation.
    meaning:
      en: I was learning German and supporting my family. That was my motivation.
      ar: كنتُ أتعلّم الألمانية وأدعم عائلتي. كان ذلك دافعي.
  - speaker: lange
    text: Und Ihre Gehaltsvorstellung? ... Gut. Haben Sie noch Fragen?
    meaning:
      en: And your salary expectation? ... Good. Do you have any questions?
      ar: وما الراتب الذي تتوقّعه؟ ... جيد. هل لديك أسئلة؟
  - speaker: protagonist
    text: Wie lange dauert die Probezeit?
    meaning:
      en: How long is the probation period?
      ar: كم تستغرق فترة التجربة؟
  - speaker: tim
    text: Und? Erzähl! Was hat er gefragt?
    meaning:
      en: So? Tell me! What did he ask?
      ar: وماذا؟ احكِ لي! ماذا سأل؟
  - speaker: protagonist
    text: Er fragte, warum ich dort arbeiten möchte. Und er wollte wissen, ob ich Fragen habe.
    meaning:
      en: He asked why I want to work there. And he wanted to know whether I had questions.
      ar: سألني لماذا أريد العمل هناك. وأراد أن يعرف إن كانت لديّ أسئلة.
  - speaker: tim
    text: Und die Lücke?
    meaning:
      en: And the gap?
      ar: والفجوة؟
  - speaker: protagonist
    text: Ich habe sie erklärt. Ehrlich und kurz.
    meaning:
      en: I explained it. Honestly and briefly.
      ar: شرحتُها. بصدق واختصار.
- type: prompt
  ask:
