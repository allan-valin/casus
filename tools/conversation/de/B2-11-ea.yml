- type: narrator
  text:
    en: German interviewers ask about every gap in the CV — explain it briefly and honestly (language course, family, migration are fine reasons). Always have a question ready at the end; 'none' sounds
      uninterested. Probation is usually up to six months, with short notice on both sides.
    ar: المحاورون الألمان يسألون عن كل فجوة في السيرة الذاتية — اشرحها باختصار وصدق (دورة لغة، العائلة، الهجرة أسباب مقبولة). جهّز دائمًا سؤالًا للنهاية؛ فعبارة «لا شيء» تبدو عدم اهتمام. فترة التجربة عادةً
      حتى ستة أشهر، مع مهلة إنهاء قصيرة للطرفين.
