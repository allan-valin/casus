steps:
- type: narrator
  text:
    en: Jonas, Svenja, Paul and you rent a house on the Baltic. Who pays what? Svenja suggests a fair split. Listen to the conversation; you don't need to understand it yet.
    ar: يوناس وسفينيا وباول وأنتِ تستأجرون بيتًا على بحر البلطيق. من يدفع ماذا؟ سفينيا تقترح تقسيمًا عادلًا. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Јонас, Свења, Паул и вие изнајмувате куќа на Балтикот. Кој што плаќа? Свења предлага праведна поделба. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: svenja
    text: Das Ferienhaus kostet achthundert Euro. Pro Kopf zweihundert.
    meaning:
      en: The holiday house costs eight hundred euros. Two hundred per head.
      ar: بيت العطلة يكلّف ثمانمئة يورو. مئتان للفرد.
      mk: Куќата за одмор чини осумстотини евра. По глава двесте.
  - speaker: paul
    text: Aber Jonas und Svenja haben das große Zimmer mit Meerblick.
    meaning:
      en: But Jonas and Svenja have the big room with a sea view.
      ar: لكن يوناس وسفينيا لديهما الغرفة الكبيرة المطلّة على البحر.
      mk: Но Јонас и Свења ја имаат големата соба со поглед на морето.
  - speaker: protagonist
    text: Wäre es nicht fairer, wenn das große Zimmer etwas mehr zahlt?
    meaning:
      en: Wouldn't it be fairer if the big room paid a bit more?
      ar: أليس من الأعدل أن تدفع الغرفة الكبيرة أكثر قليلًا؟
      mk: Зарем не би било поправедно големата соба да плати малку повеќе?
  - speaker: svenja
    text: Einverstanden. Und für Essen machen wir eine gemeinsame Kasse.
    meaning:
      en: Agreed. And for food we'll have a kitty.
      ar: موافقة. وللطعام نعمل صندوقًا مشتركًا.
      mk: Се согласувам. А за храна правиме заедничка каса.
  - speaker: protagonist
    text: Bei uns würde einer einfach alles bezahlen — beim nächsten Mal der andere.
    meaning:
      en: With us one person would simply pay for everything — next time the other.
      ar: عندنا يدفع واحد كل شيء ببساطة — وفي المرة القادمة الآخر.
      mk: Кај нас еден едноставно би платил сè — следниот пат другиот.
  - speaker: jonas
    text: Das ist großzügig! Aber hätten wir das so gemacht, wäre Paul pleite.
    meaning:
      en: That's generous! But if we'd done it that way, Paul would be broke.
      ar: هذا كرم! لكن لو فعلنا ذلك لأفلس باول.
      mk: Тоа е дарежливо! Но да го направевме така, Паул ќе беше без пара.
  - speaker: paul
    text: Danke! Ich trage alles in die Ausgaben-App ein. Am Ende rechnen wir ab.
    meaning:
      en: Thanks! I'll put everything into the expense app. At the end we settle up.
      ar: شكرًا! سأسجّل كل شيء في تطبيق المصاريف. في النهاية نصفّي الحساب.
      mk: Благодарам! Сè ќе внесам во апликацијата за трошоци. На крајот ќе пресметаме.
  - speaker: protagonist
    text: 'Typisch deutsch — auf den Cent genau. Aber ehrlich gesagt: sehr entspannend.'
    meaning:
      en: 'Typically German — to the cent. But honestly: very relaxing.'
      ar: 'ألماني نموذجي — بدقة السنت. لكن بصراحة: مريح جدًا.'
      mk: 'Типично германски — до цент. Но искрено: многу опуштачки.'
- type: prompt
  ask:
    en: 'Say: the holiday house on the Baltic.'
    ar: 'قولي: بيت العطلة على بحر البلطيق.'
    mk: 'Кажете: куќата за одмор на Балтикот.'
  answer:
    speaker: protagonist
    text: Das Ferienhaus an der Ostsee.
  items:
  - das-ferienhaus
  - die-ostsee
- type: prompt
  ask:
    en: 'Say: two hundred per head.'
