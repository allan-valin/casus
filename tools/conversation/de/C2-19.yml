- type: narrator
  text:
    en: 'Among German friends, splitting exactly — to the cent, often with an app — is normal and not stingy: it keeps friendships free of unspoken debts. Inviting someone (''Ich lade dich ein'') is also
      common, but said clearly.'
    ar: 'بين الأصدقاء الألمان التقسيم الدقيق — حتى السنت، غالبًا بتطبيق — أمر عادي وليس بخلًا: يحفظ الصداقة من الديون غير المعلنة. ودعوة أحد («Ich lade dich ein») شائعة أيضًا، لكنها تُقال بوضوح.'
    mk: 'Меѓу германски пријатели, точната поделба — до цент, често со апликација — е нормална и не е скржавост: ги чува пријателствата од неизговорени долгови. Покана („Ich lade dich ein“) е исто честа,
      но се кажува јасно.'
