steps:
- type: narrator
  text:
    mk: Лука ќе тргне на училиште за две години. Со Ања одите на денот на отворени врати. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: anja
    text: Hier ist die Schule. Heute ist Tag der offenen Tür.
    meaning:
      mk: Ова е училиштето. Денес е ден на отворени врати.
  - speaker: protagonist
    text: Wann kommt Luka in die Schule?
    meaning:
      mk: Кога Лука ќе тргне на училиште?
  - speaker: anja
    text: Mit sechs Jahren. Die Einschulung ist ein großes Fest.
    meaning:
      mk: На шест години. Поаѓањето на училиште е голем празник.
  - speaker: lehrerin
    text: Willkommen! Das ist eine erste Klasse.
    meaning:
      mk: Добредојдовте! Ова е прво одделение.
  - speaker: protagonist
    text: Ich bin auch mit sechs in die Schule gegangen — in Bitola.
    meaning:
      mk: И јас тргнав на училиште на шест години — во Битола.
  - speaker: anja
    text: Und hast du eine Schultüte bekommen?
    meaning:
      mk: И доби ли кеса со слатки?
  - speaker: protagonist
    text: Eine Schultüte? Nein. Was ist das?
    meaning:
      mk: Кеса со слатки? Не. Што е тоа?
  - speaker: anja
    text: Eine große Tüte mit Süßigkeiten, für den ersten Schultag. Und einen Ranzen!
    meaning:
      mk: Голема кеса со слатки, за првиот училишен ден. И училишна чанта!
  - speaker: protagonist
    text: Dann kaufe ich die Schultüte für Luka!
    meaning:
      mk: Тогаш јас ќе ја купам кесата за Лука!
