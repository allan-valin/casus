steps:
- type: narrator
  text:
    en: Saturday, two in the morning, a techno club. The bouncer looks at you for a long time. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: jonas
    text: Wir treffen uns um eins vor dem Club, okay?
    meaning:
      en: We meet at one in front of the club, OK?
  - speaker: protagonist
    text: Okay. Ich ziehe mich noch um.
    meaning:
      en: OK. I'll just change first.
  - speaker: fahrer
    text: Wie viele seid ihr?
    meaning:
      en: How many of you are there?
  - speaker: jonas
    text: Zwei.
    meaning:
      en: Two.
  - speaker: fahrer
    text: Keine Fotos drinnen. Handy-Kamera wird zugeklebt.
    meaning:
      en: No photos inside. Phone cameras get taped over.
  - speaker: protagonist
    text: Klar. Wir freuen uns!
    meaning:
      en: Sure. We're looking forward to it!
  - speaker: fahrer
    text: Okay, rein. Die Garderobe ist links.
    meaning:
      en: OK, in you go. The cloakroom's on the left.
  - speaker: protagonist
    text: Puh! Und wie lange tanzen die Leute?
    meaning:
      en: Phew! And how long do people dance?
  - speaker: jonas
    text: Bis morgens. Manche bis Sonntagmittag.
    meaning:
      en: Until the morning. Some till Sunday lunchtime.
- type: narrator
