- type: narrator
  text:
    en: The landlady who once scolded you about rubbish bins becomes, years later, the neighbour you visit every Sunday — that's a very common German story. Relationships here start slowly and formally,
      and then last.
    ar: المؤجِّرة التي وبّختك يومًا بسبب صناديق القمامة تصبح بعد سنوات الجارة التي تزورها كل أحد — هذه قصة ألمانية شائعة جدًا. العلاقات هنا تبدأ ببطء ورسمية، ثم تدوم.
    mk: Станодавката што некогаш ве караше за кантите за ѓубре, години подоцна станува соседката што ја посетувате секоја недела — многу честа германска приказна. Односите тука почнуваат бавно и формално,
      а потоа траат.
