steps:
- type: narrator
  text:
    en: A farewell party in the courtyard for Frau Becker. The whole house is there. You say goodbye — in the right words. Listen to the conversation; you don't need to understand it yet.
    ar: حفلة وداع في الفناء للسيدة بيكر. البيت كله حاضر. تودّعها — بالكلمات المناسبة. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Прошталната забава во дворот за госпоѓа Бекер. Целата зграда е тука. Се поздравувате — со вистинските зборови. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Liebe Monika, du warst die gute Seele des Hauses. Streng, aber herzlich.
    meaning:
      en: Dear Monika, you were the good soul of the house. Strict, but warm.
      ar: عزيزتي مونيكا، كنتِ روح البيت الطيّبة. صارمة لكن دافئة.
      mk: Драга Моника, ти беше добрата душа на зградата. Строга, но срдечна.
  - speaker: becker
    text: Streng? Ich? Nur bei der Mülltrennung!
    meaning:
      en: Strict? Me? Only about recycling!
      ar: صارمة؟ أنا؟ فقط في فرز القمامة!
      mk: Строга? Јас? Само за селекцијата на отпад!
  - speaker: protagonist
    text: Ohne dich wäre ich nicht so gut angekommen. Dafür meine tiefe Dankbarkeit.
    meaning:
      en: Without you I wouldn't have settled in so well. For that, my deep gratitude.
      ar: لولاكِ لما استقررتُ بهذا الشكل الجيد. لذلك امتناني العميق.
      mk: Без тебе немаше толку добро да се сместам. За тоа, моја длабока благодарност.
  - speaker: jonas
    text: 'Hier, unser Abschiedsgeschenk: ein Foto vom ganzen Haus.'
    meaning:
      en: 'Here, our farewell present: a photo of the whole house.'
      ar: 'تفضّلي، هدية وداعنا: صورة للبيت كله.'
      mk: 'Еве, нашиот проштален подарок: фотографија од целата зграда.'
  - speaker: becker
    text: Jetzt kommt mir eine Träne. Ihr werdet mir alle fehlen.
    meaning:
      en: Now there's a tear coming. I'll miss you all.
      ar: الآن تنزل دمعة. سأفتقدكم جميعًا.
      mk: Сега ми доаѓа солза. Сите ќе ми недостигате.
  - speaker: protagonist
    text: Du wirst mir auch fehlen. Alles Gute für den neuen Lebensabschnitt!
    meaning:
      en: I'll miss you too. All the best for the new chapter!
      ar: وأنتِ أيضًا سأفتقدكِ. كل التوفيق في مرحلة الحياة الجديدة!
      mk: И ти ќе ми недостигаш. Сè најдобро во новото животно поглавје!
  - speaker: becker
    text: Das ist kein Lebewohl, sondern Auf Wiedersehen. Das betreute Wohnen ist nur drei Haltestellen weiter.
    meaning:
      en: This isn't farewell, but see you again. The assisted living is only three stops away.
      ar: هذا ليس وداعًا بل إلى اللقاء. السكن مع الرعاية على بعد ثلاث محطات فقط.
      mk: Ова не е збогум, туку довидување. Домот со нега е само три постојки понатаму.
  - speaker: protagonist
    text: Dann komme ich dich jeden Sonntag besuchen. Mit Kuchen. Mach's gut, Monika!
    meaning:
      en: Then I'll visit you every Sunday. With cake. Take care, Monika!
      ar: إذن سأزوركِ كل أحد. مع كعكة. اعتني بنفسكِ يا مونيكا!
      mk: Тогаш ќе те посетувам секоја недела. Со колач. Чувај се, Моника!
- type: prompt
  ask:
    en: 'Say: the good soul of the house.'
    ar: 'قل: روح البيت الطيّبة.'
    mk: 'Кажете: добрата душа на зградата.'
  answer:
    speaker: protagonist
    text: Die gute Seele des Hauses.
  items:
  - die-gute-seele
- type: prompt
  ask:
    en: 'Say: without you I wouldn''t have settled in.'
    ar: 'قل: لولاكِ لما استقررتُ.'
    mk: 'Кажете: без тебе немаше да се сместам.'
  answer:
