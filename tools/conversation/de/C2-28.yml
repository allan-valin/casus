- type: narrator
  text:
    en: 'Farewells have set phrases: «Du wirst mir fehlen» (literally ''you will be missing to me''), «Alles Gute für den neuen Lebensabschnitt», «Mach''s gut!», «kein Lebewohl, sondern Auf Wiedersehen»
      — ''Lebewohl'' sounds final, ''Auf Wiedersehen'' hopes to meet again.'
    ar: 'للوداع عبارات ثابتة: «Du wirst mir fehlen» (حرفيًا «ستكونين ناقصة لي»)، «Alles Gute für den neuen Lebensabschnitt»، «Mach''s gut!»، «kein Lebewohl, sondern Auf Wiedersehen» — «Lebewohl» تبدو نهائية،
      و«Auf Wiedersehen» ترجو لقاءً آخر.'
    mk: 'Збогувањата имаат фиксни фрази: «Du wirst mir fehlen» (буквално „ќе ми недостигаш“), «Alles Gute für den neuen Lebensabschnitt», «Mach''s gut!», «kein Lebewohl, sondern Auf Wiedersehen» — „Lebewohl“
      звучи конечно, „Auf Wiedersehen“ се надева на нова средба.'
