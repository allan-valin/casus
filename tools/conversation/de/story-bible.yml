# STORY BIBLE — German, narrators Macedonian and Arabic (Allan's pairs de·mk and de·ar). ACCEPTED by Allan 2026-10-21;
# units come next. The template (tools/conversation/_template) shows German units with a Portuguese
# narrator; this course is its own, built for newcomers from North Macedonia and from the Arab world.

language: de
in_development: true   # shown as a banner; false once every Learn grammar lesson is practised (build then fails on gaps)
narrator_languages: [en, ar, mk]        # en neutral (international offices); ar and mk with their comparisons
country: Germany
standard: >-
  Standard German (Hochdeutsch) as taught in grammars and at integration courses; no dialect in the units. An
  optional chapter could meet Swabian, Bavarian or Saxon (no open voice for them yet).

