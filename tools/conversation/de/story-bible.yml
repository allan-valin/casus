protagonist:
  forms: {f: de-f, m: de-m}
  name: null
  # one protagonist pair per audience (Allan, 2026-10-21); odd units the woman, even units the man; rows with
  # different needs have E / A / M versions (docs/conversation/PLAN-de.md, unit field `tracks`)
  background:
    en: "An international student, about 25, starting a master's in Leipzig; English, no German."
    ar: "A Syrian couple from Aleppo. She, about 25, married through the families, Muslim, came through family reunification with their small child and no German (spouses of Blue Card holders need no A1 first). He, about 30, an engineer with a Blue Card at a Leipzig firm."
    mk: "A Macedonian couple from Bitola, about 60, with Bulgarian (EU) passports like many Macedonians; their son lives in Leipzig with his German wife and their child. They come for months at a time and cannot talk to the in-laws, the neighbours or the Kita."
  alternation: odd units f, even units m
cast:
  - {id: becker, name: Frau Becker, role: "landlady, about 60, ground floor", voice: de-f2, register: formal, arc: "Sie throughout; strict about the house rules (Mülltrennung, Ruhezeiten), warm underneath"}
  - {id: jonas, name: Jonas, role: "neighbour, about 25, student", voice: de-m2, register: informal, arc: "du at once; becomes a friend"}
  - {id: schulz, name: Herr Schulz, role: "official at the Bürgeramt, later the Ausländerbehörde", voice: de-s-m, register: formal, arc: "appears in every paperwork unit; patient, precise"}
  - {id: meier, name: Dr. Meier, role: "the protagonist's boss at the hospital / university", voice: de-me-f, register: formal, arc: "Sie, then du offered at the Christmas party (B1)"}

