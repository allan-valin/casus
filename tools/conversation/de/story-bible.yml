formality:
  summary: >-
    Sie + surname with strangers, officials, older people, at work until du is offered; du with friends, family,
    children, among young people and students. Offering du is a step, usually by the older or more senior person.
  rules:
    - "Sie with Frau Becker, Herr Schulz and Dr. Meier; du with Jonas from the first line."
    - "Titles: Herr / Frau + surname; Dr. kept in formal settings (Frau Dr. Meier)."
    - "The du offer is a scene of its own (B1, Christmas party)."
  # who speaks to whom in which style from which unit (T4, 2026-10-27; tools/register_check.py); cast register is the default
  relationships:
    - {from: becker, to: protagonist, style: informal, from_unit: B1-14, note: 'Auf das Du! at the Christmas party'}
    - {from: protagonist, to: becker, style: informal, from_unit: B1-14}
    - {from: lena, to: protagonist, style: formal, from_unit: A1-13, note: 'first meeting at the playground'}
    - {from: protagonist, to: lena, style: formal, from_unit: A1-13}
    - {from: lena, to: protagonist, style: informal, from_unit: A1-18}
    - {from: protagonist, to: lena, style: informal, from_unit: A1-18}
    - {from: stefan, to: protagonist, style: formal, from_unit: B1-25, note: 'first meeting, a job offer'}
    - {from: protagonist, to: stefan, style: any, from_unit: B1-25, note: "the grandmother may say du to her son's younger friend"}
  sources:
    - {title: "Wikipedia: Siezen und Duzen", url: "https://de.wikipedia.org/wiki/Siezen", licence: CC BY-SA}

culture:
  taught:
    - {topic: registration, note: "Anmeldung at the Bürgeramt within two weeks, with the landlord's Wohnungsgeberbestätigung; appointments booked online, often weeks ahead.", source: "Bundesmeldegesetz §17, §19"}
    - {topic: Sunday, note: "Shops closed on Sundays and holidays; bakeries on Sunday mornings; quiet hours (Ruhezeiten) in house rules.", source: "Ladenschlussgesetz; Hausordnung"}
    - {topic: waste, note: "Mülltrennung: paper, packaging (gelber Sack), glass by colour, organic, residual; Pfand on bottles returned at machines.", source: "Verpackungsgesetz"}
    - {topic: punctuality, note: "Being on time is expected; five minutes late needs an apology; appointments (Termine) for almost everything.", source: "general"}
    - {topic: directness, note: "Criticism and refusals are said plainly; 'Nein' is not rude; small talk is short.", source: "general"}
    - {topic: flats, note: "Unfurnished flats often have no kitchen at all — not even a sink, only the water and power connections; a kitchen the landlord supplies is his to repair, so many supply none. Tenants buy, take along or sell on their kitchen.", source: "Allan; BGB §535 (landlord keeps the rented items in repair)"}
    - {topic: copyright letters, note: "Sharing films or music over P2P brings an Abmahnung from a law firm; don't pay or sign at once — a lawyer of your own often costs less than the demand and negotiates it down.", source: "Allan (his brother's case); test.de"}
    - {topic: Soli, note: "The Solidaritätszuschlag (since 1991) was paid in East and West alike; since 2021 mostly by high earners, on capital gains and by companies; the Constitutional Court upheld it in 2025. 'The West paid for the East' is a prejudice of its own.", source: "finanztip.de; BVerfG 2 BvR 1505/20"}
    - {topic: rain, note: "Hardly anyone carries an umbrella: good rain jackets with hoods, cyclists in rain trousers.", source: "deutschweh 2019"}
    - {topic: silence, note: "Strangers don't chat; silence in a seminar is often listening, not coldness.", source: "deutschweh 2019; expat accounts"}
    - {topic: university, note: "Germans sit down before the hour; attendance and taking part count; exam rules are per programme (Prüfungsordnung); professors choose content and method (Lehrfreiheit) but grades can be challenged; ask for the buddy programme.", source: "deutschweh 2019; Allan"}
    - {topic: queues, note: "Often one queue per machine or till, and people step into a gap; 'Entschuldigung, ich war zuerst da' is the polite answer.", source: "Allan, 'Sehr geehrte Deutsche', deutschweh 2019"}
    - {topic: money, note: "Payslip: income tax, Soli (few still pay), church tax for members of churches that levy it, health, care, pension and unemployment insurance; the employer pays its share on top. Minijob: no health insurance through it; a second job is taxed in class VI. Students: the public student rate ends around 30; private insurance means no way back during studies; students get no Bürgergeld. Never amounts in units.", source: "Allan; finanztip.de"}
    - {topic: cash and cards, note: "Cash still common; EC card everywhere, credit cards less.", source: "Bundesbank payment studies"}
  narrator:
    # neutral English: the curious note, no "back home"
    - {lang: en, topic: language, note: "In big cities people switch to English when you hesitate — keep going in German; in small towns you hear 'you speak so well!' for trying."}
    - {lang: en, topic: queues, note: "Often one queue per till or machine; 'Entschuldigung, ich war zuerst da' when someone steps in."}
    - {lang: en, topic: winter, note: "Grey from nine to three, then dark; three layers outside, an overheated room inside."}
    - {lang: en, topic: offices, note: "Bring every document; nobody works out your case for you."}
    - {lang: ar, topic: family reunification, note: "Spouses usually need A1 German before the visa — not the spouse of a Blue Card holder; the Integrationskurs comes after arrival."}
    - {lang: mk, topic: EU passports, note: "Many Macedonians hold Bulgarian passports and live in Germany as EU citizens: registration, no visa; others come under the Western Balkans rule."}
    - {lang: mk, topic: hospitality, note: "Guests are offered coffee and food at once and refusing is impolite; Germans may offer nothing unannounced, or only water."}
    - {lang: mk, topic: time, note: "Relaxed punctuality at home; a coffee that lasts two hours is normal."}
    - {lang: mk, topic: shoes and drafts, note: "Shoes off and slippers at home; fear of промаја — Germans air rooms with open windows (Stoßlüften) even in winter."}
    - {lang: mk, topic: bureaucracy, note: "Paperwork with personal contacts helps; in Germany everything goes by appointment and form."}
    - {lang: ar, topic: greetings, note: "Long greetings and questions about family before business; between men and women a handshake may be avoided — in Germany a refused handshake can be misread."}
    - {lang: ar, topic: hospitality, note: "A guest is fed generously and the host insists; in Germany one may be asked 'Möchtest du etwas trinken?' only once — saying no the first time means no."}
    - {lang: ar, topic: weekend, note: "Friday is the day off in much of the Arab world; in Germany Sunday is, and Sunday quiet is strict."}
    - {lang: ar, topic: food, note: "Halal food and pork in everything (Wurst, Gelatine); labels must be read."}
    - {lang: ar, topic: time, note: "Appointments are approximate; in Germany the doctor's appointment at 9:15 means 9:15."}
