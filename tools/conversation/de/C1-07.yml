- type: narrator
  text:
    en: A Sunday visit to a German family is often 'Kaffee und Kuchen' at three — punctual, with flowers or chocolates, and over before dinner. Second helpings are offered once; say yes if you want them.
      Leaving at the agreed time is polite, not cold.
    ar: زيارة الأحد لعائلة ألمانية غالبًا «قهوة وكعك» في الثالثة — في الموعد، مع زهور أو شوكولاتة، وتنتهي قبل العشاء. القطعة الثانية تُعرض مرة واحدة؛ قولي نعم إن أردتِها. والمغادرة في الموعد المتّفق عليه
      أدب لا برود.
    mk: Неделна посета на германско семејство често е „кафе и колач“ во три — точно, со цвеќе или чоколади, и завршува пред вечера. Второ парче се нуди еднаш; кажете да ако сакате. Заминувањето во договореното
      време е учтивост, не студенило.
