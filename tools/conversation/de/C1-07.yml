- type: narrator
  text:
    en: 'Particles carry the tone: «Kommen Sie doch rein!» (do come in — warm), «Der ist ja köstlich!» (that''s really delicious — surprise), «wohl» (probably), «schon» (already, surely). They''re unstressed
      and almost untranslatable.'
    ar: 'الأدوات تحمل النبرة: «Kommen Sie doch rein!» (تفضّلي بالدخول — دفء)، «Der ist ja köstlich!» (إنها لذيذة حقًا — مفاجأة)، «wohl» (على الأرجح)، «schon» (بالفعل، بالتأكيد). لا تُشدَّد ويكاد يستحيل
      ترجمتها.'
    mk: 'Честичките го носат тонот: «Kommen Sie doch rein!» (повелете — топло), «Der ist ja köstlich!» (баш е вкусен — изненадување), «wohl» (веројатно), «schon» (веќе, сигурно). Ненагласени се и речиси
      непреводливи.'
