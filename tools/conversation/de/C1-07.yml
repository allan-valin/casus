steps:
- type: narrator
  text:
    en: Svenja invites you along to her parents' for Sunday coffee. Three o'clock sharp, cake on the table. Listen to the conversation; you don't need to understand it yet.
    ar: سفينيا تدعوكِ معها إلى والديها لقهوة الأحد. الساعة الثالثة تمامًا، والكعكة على الطاولة. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Свења ве кани со неа кај нејзините родители на неделно кафе. Точно во три, колачот на масата. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: svenjamutter
    text: Kommen Sie doch rein! Sie sind ja pünktlich um drei.
    meaning:
      en: Do come in! You're right on time at three.
      ar: تفضّلي بالدخول! أنتِ في الثالثة تمامًا.
      mk: Повелете, влезете! Точно сте во три.
  - speaker: protagonist
    text: Vielen Dank für die Einladung. Hier sind Blumen.
    meaning:
      en: Thank you very much for the invitation. Here are some flowers.
      ar: شكرًا جزيلًا على الدعوة. هذه زهور.
      mk: Ви благодарам за поканата. Еве цвеќе.
  - speaker: svenjavater
    text: Setzen Sie sich. Es gibt Kaffee und Kuchen — Pflaumenkuchen, selbst gebacken.
    meaning:
      en: Sit down. There's coffee and cake — plum cake, home-made.
      ar: اجلسي. هناك قهوة وكعك — كعكة برقوق، من صنع البيت.
      mk: Седнете. Има кафе и колач — со сливи, домашен.
  - speaker: protagonist
    text: Der ist ja köstlich!
    meaning:
      en: That's delicious!
      ar: إنها لذيذة جدًا!
      mk: Овој е баш вкусен!
  - speaker: svenjamutter
    text: Nehmen Sie doch noch ein Stück!
    meaning:
      en: Do have another piece!
      ar: خذي قطعة أخرى!
      mk: Земете уште едно парче!
  - speaker: protagonist
    text: Gern. Bei uns müsste man mich dreimal bitten, aber hier sage ich lieber gleich ja.
    meaning:
      en: Gladly. With us you'd have to ask me three times, but here I'd rather say yes straight away.
      ar: بكل سرور. عندنا يجب أن يُلحّ عليّ ثلاث مرات، لكن هنا أفضّل أن أقول نعم فورًا.
      mk: Со задоволство. Кај нас би морале три пати да ме молат, но тука подобро веднаш велам да.
  - speaker: svenjavater
    text: Sie haben Deutschland wohl schon gut verstanden!
    meaning:
      en: You've probably understood Germany well already!
      ar: على الأرجح فهمتِ ألمانيا جيدًا بالفعل!
      mk: Веројатно веќе добро ја разбравте Германија!
  - speaker: svenja
    text: Um sechs verabschieden wir uns. Meine Eltern essen um halb sieben.
    meaning:
      en: We'll take our leave at six. My parents have dinner at half past six.
      ar: في السادسة نستأذن. والداي يتعشّيان في السادسة والنصف.
      mk: Во шест се поздравуваме. Моите родители вечераат во шест и пол.
- type: prompt
  ask:
    en: 'Say: coffee and cake.'
    ar: 'قولي: القهوة والكعك.'
    mk: 'Кажете: кафе и колач.'
  answer:
    speaker: protagonist
    text: Kaffee und Kuchen.
  items:
  - kaffee-und-kuchen
- type: prompt
  ask:
