steps:
- type: narrator
  text:
    en: A VHS evening on Kant. Over coffee afterwards, Professor Hartmann explains the Enlightenment — and duty. Listen to the conversation; you don't need to understand it yet.
    ar: أمسية في الجامعة الشعبية عن كانط. على القهوة بعدها يشرح البروفيسور هارتمان عصر التنوير — والواجب. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Вечер на народниот универзитет за Кант. На кафе потоа професорот Хартман го објаснува просветителството — и должноста. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: hartmann
    text: 'Kant sagt: „Habe Mut, dich deines eigenen Verstandes zu bedienen.“ Das ist Aufklärung.'
    meaning:
      en: 'Kant says: ''Have the courage to use your own understanding.'' That''s Enlightenment.'
      ar: 'يقول كانط: «تحلَّ بالشجاعة لتستعمل عقلك.» هذا هو التنوير.'
      mk: 'Кант вели: „Имај храброст да се служиш со сопствениот разум.“ Тоа е просветителство.'
  - speaker: protagonist
    text: Also selbst denken, statt nur zu gehorchen?
    meaning:
      en: So think for yourself instead of only obeying?
      ar: أي أن تفكّر بنفسك بدلًا من أن تطيع فقط؟
      mk: Значи, да мислиш сам, наместо само да слушаш?
  - speaker: hartmann
    text: Genau. Er nennt das Mündigkeit. Und der von ihm formulierte kategorische Imperativ sagt, wie wir handeln sollen.
    meaning:
      en: Exactly. He calls it maturity. And the categorical imperative he formulated says how we should act.
      ar: بالضبط. يسمّي ذلك الرشد. والأمر المطلق الذي صاغه يقول كيف يجب أن نتصرّف.
      mk: Точно. Тој го нарекува тоа полнолетство. А категоричкиот императив што го формулирал вели како треба да постапуваме.
  - speaker: protagonist
    text: Und wie?
    meaning:
      en: And how?
      ar: وكيف؟
      mk: А како?
  - speaker: hartmann
    text: Handle nur nach der Regel, von der du willst, dass sie für alle gilt. Allgemein gültig, verstehen Sie?
    meaning:
      en: Act only by the rule you would want to hold for everyone. Universally valid, you see?
      ar: تصرّف فقط وفق القاعدة التي تريدها أن تنطبق على الجميع. صالحة للجميع، أتفهم؟
      mk: Постапувај само според правилото за кое сакаш да важи за сите. Општо важечко, разбирате?
  - speaker: protagonist
    text: Dann ist Lügen nie erlaubt — auch nicht aus Höflichkeit?
    meaning:
      en: Then lying is never allowed — not even out of politeness?
      ar: إذن الكذب غير مسموح أبدًا — ولا حتى من باب الأدب؟
      mk: Тогаш лажењето никогаш не е дозволено — ни од учтивост?
  - speaker: hartmann
    text: Für Kant nicht. Die Pflicht zur Wahrheit ist die zu befolgende Regel. Sehr deutsch, oder?
    meaning:
      en: Not for Kant. The duty to truth is the rule to be followed. Very German, isn't it?
      ar: ليس عند كانط. واجب الصدق هو القاعدة الواجب اتّباعها. ألماني جدًا، أليس كذلك؟
      mk: Не за Кант. Должноста кон вистината е правилото што треба да се следи. Многу германски, нели?
  - speaker: protagonist
    text: Das erklärt das „Nein heißt nein“ bei Jonas!
    meaning:
      en: That explains Jonas's 'no means no'!
      ar: هذا يفسّر «لا تعني لا» عند يوناس!
      mk: Тоа го објаснува „не значи не“ кај Јонас!
- type: prompt
  ask:
    en: 'Say: the Enlightenment.'
    ar: 'قل: عصر التنوير.'
    mk: 'Кажете: просветителството.'
  answer:
    speaker: protagonist
    text: Die Aufklärung.
  items:
  - die-aufklaerung
- type: prompt
  ask:
