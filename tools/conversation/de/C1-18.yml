- type: narrator
  text:
    en: 'Extended attributes in academic German: «der von ihm formulierte kategorische Imperativ» (= the imperative that he formulated), «die zu befolgende Regel» (= the rule that must be followed: zu +
      present participle).'
    ar: 'الصفات الممتدة في الألمانية الأكاديمية: «der von ihm formulierte kategorische Imperativ» (= الأمر الذي صاغه)، «die zu befolgende Regel» (= القاعدة التي يجب اتّباعها: zu مع اسم الفاعل).'
    mk: 'Проширени атрибути во академскиот германски: «der von ihm formulierte kategorische Imperativ» (= императивот што тој го формулирал), «die zu befolgende Regel» (= правилото што мора да се следи:
      zu + сегашен партицип).'
- type: prompt
  ask:
    en: 'Say: the categorical imperative he formulated.'
    ar: 'قل: الأمر المطلق الذي صاغه.'
    mk: 'Кажете: категоричкиот императив што го формулирал.'
  answer:
    speaker: protagonist
    text: Der von ihm formulierte kategorische Imperativ.
  items:
  - der-kategorische-imperativ
- type: prompt
