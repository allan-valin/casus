    ar: 'قل: تصرّف فقط وفق قاعدة صالحة للجميع.'
    mk: 'Кажете: постапувај само по правило важечко за сите.'
  answer:
    speaker: protagonist
    text: Handle nur nach einer allgemein gültigen Regel.
  items:
