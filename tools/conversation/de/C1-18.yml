    text: Die Vernunft.
  items:
  - die-vernunft
- type: narrator
  text:
    en: Immanuel Kant (1724–1804) defined Enlightenment as leaving 'self-incurred immaturity' — thinking for yourself. His categorical imperative asks you to act only by rules you could want everyone to
      follow. Many Germans' strictness about honesty and rules is often traced, half-jokingly, to him.
    ar: عرّف إيمانويل كانط (1724–1804) التنوير بأنه الخروج من «القصور الذي يتحمّل الإنسان مسؤوليته» — أي التفكير بنفسك. وأمره المطلق يطلب منك أن تتصرّف وفق قواعد تريد أن يتّبعها الجميع. وكثيرًا ما يُنسب
      إليه، نصف مزاحًا، صرامة كثير من الألمان في الصدق والقواعد.
    mk: Имануел Кант (1724–1804) го дефинирал просветителството како излез од „самопредизвиканата незрелост“ — да мислиш сам. Неговиот категорички императив бара да постапуваш само по правила за кои би
      сакал сите да ги следат. Строгоста на многу Германци за искреноста и правилата често, полу на шега, се припишува нему.
