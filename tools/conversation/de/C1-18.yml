- type: prompt
  ask:
    en: 'Say: the rule to be followed.'
    ar: 'قل: القاعدة الواجب اتّباعها.'
    mk: 'Кажете: правилото што треба да се следи.'
  answer:
    speaker: protagonist
    text: Die zu befolgende Regel.
  items:
  - der-zu-befolgende
- type: prompt
  ask:
    en: 'Say: the duty to truth.'
    ar: 'قل: واجب الصدق.'
    mk: 'Кажете: должноста кон вистината.'
  answer:
    speaker: protagonist
    text: Die Pflicht zur Wahrheit.
  items:
  - die-pflicht
- type: prompt
  ask:
    en: 'Say: reason.'
    ar: 'قل: العقل.'
    mk: 'Кажете: умот.'
  answer:
