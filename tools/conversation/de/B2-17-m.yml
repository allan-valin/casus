steps:
- type: narrator
  text:
    mk: Петар ви го покажува својот платен лист. Зошто нето е толку помалку од бруто? Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Petar, das ist dein Gehalt? Brutto viel — netto viel weniger!
    meaning:
      mk: Петре, ова ти е платата? Бруто многу — нето многу помалку!
  - speaker: petar
    text: Ja, Papa. Abzüglich der Steuern und Abgaben bleibt etwa die Hälfte.
    meaning:
      mk: Да, тато. Одбиено даноците и давачките, останува околу половина.
  - speaker: protagonist
    text: Die Hälfte! Warum?
    meaning:
      mk: Половина! Зошто?
  - speaker: petar
    text: Aufgrund der Steuerklasse zahle ich Lohnsteuer. Dann Kranken-, Pflege-, Renten- und Arbeitslosenversicherung.
    meaning:
      mk: Поради даночната класа плаќам данок на плата. Потоа здравствено, за нега, пензиско и осигурување за невработеност.
  - speaker: anja
    text: Und Kirchensteuer zahlt er nicht, weil er orthodox ist.
    meaning:
      mk: А црковен данок не плаќа, затоа што е православен.
  - speaker: protagonist
    text: Bei uns war das anders.
    meaning:
      mk: Кај нас беше поинаку.
  - speaker: petar
    text: Dafür zahlt der Arbeitgeber noch einmal fast so viel dazu — den Arbeitgeberanteil. Und während der Krankheit bin ich versichert.
    meaning:
      mk: Затоа работодавачот доплаќа речиси исто толку — делот на работодавачот. А за време на болест сум осигурен.
  - speaker: protagonist
    text: Und die Rentenversicherung — die bekommst du später zurück?
    meaning:
      mk: А пензиското осигурување — ќе го добиеш назад подоцна?
  - speaker: petar
    text: Als Rente, ja. Hoffentlich.
    meaning:
      mk: Како пензија, да. Се надевам.
