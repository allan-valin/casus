steps:
- type: narrator
  text:
    en: Three months of training. Petra invites you to become a member — and to the club evening. Listen to the conversation; you don't need to understand it yet.
    ar: ثلاثة أشهر من التمرين. بيترا تدعوك لتصبح عضوًا — وإلى أمسية النادي. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Три месеци тренинг. Петра ве кани да станете член — и на клупската вечер. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: petra
    text: Willst du Mitglied werden? Hier ist das Aufnahmeformular.
    meaning:
      en: Do you want to become a member? Here's the membership form.
      ar: هل تريد أن تصبح عضوًا؟ هذه استمارة العضوية.
      mk: Сакаш ли да станеш член? Еве го формуларот за зачленување.
  - speaker: protagonist
    text: Gern! Wie hoch ist der Mitgliedsbeitrag?
    meaning:
      en: Gladly! How much is the membership fee?
      ar: بكل سرور! كم رسوم العضوية؟
      mk: Со задоволство! Колкава е членарината?
  - speaker: petra
    text: Nicht viel — jährlich. Er steht auf dem Formular.
    meaning:
      en: Not much — yearly. It's on the form.
      ar: ليست كثيرة — سنويًا. مكتوبة على الاستمارة.
      mk: Не многу — годишно. Пишува на формуларот.
  - speaker: protagonist
    text: Ich komme in den Verein, um neue Leute kennenzulernen.
    meaning:
      en: I'm joining the club to meet new people.
      ar: أنضم إلى النادي لأتعرّف على أشخاص جدد.
      mk: Влегувам во клубот за да запознаам нови луѓе.
  - speaker: petra
    text: Dann komm zum Vereinsabend am Freitag! Die ganze Mannschaft ist da.
    meaning:
      en: Then come to the club evening on Friday! The whole team will be there.
      ar: إذن تعال إلى أمسية النادي يوم الجمعة! الفريق كله سيكون هناك.
      mk: Тогаш дојди на клупската вечер во петок! Цела екипа ќе биде таму.
  - speaker: protagonist
    text: Wer organisiert das alles?
    meaning:
      en: Who organises all of it?
      ar: من ينظّم كل هذا؟
      mk: Кој го организира сето ова?
  - speaker: petra
    text: Wir alle, ehrenamtlich. Hilfst du beim Turnier im Mai mit?
    meaning:
      en: All of us, voluntarily. Will you help out at the tournament in May?
      ar: كلنا، تطوعًا. هل تساعد في البطولة في مايو؟
      mk: Сите ние, доброволно. Ќе помогнеш на турнирот во мај?
  - speaker: protagonist
    text: Klar! Um zu helfen, bin ich da.
    meaning:
      en: Sure! That's what I'm here for — to help.
      ar: طبعًا! أنا هنا لأساعد.
      mk: Секако! Тука сум за да помагам.
