    en: Most clubs are run by unpaid volunteers. Helping at a tournament or behind the bar is how newcomers become part of the group — and the fee stays low because of it.
    ar: معظم الأندية يديرها متطوعون بلا أجر. المساعدة في بطولة أو خلف البار هي طريق القادم الجديد ليصبح جزءًا من المجموعة — وبفضل ذلك تبقى الرسوم منخفضة.
    mk: Повеќето клубови ги водат доброволци без плата. Помагањето на турнир или зад шанкот е начинот на кој новите стануваат дел од групата — и затоа членарината е ниска.
