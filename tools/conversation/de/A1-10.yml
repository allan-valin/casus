steps:
- type: narrator
  text:
    en: A young man runs down the stairs with a bike. Jonas, from the second floor. Listen to the conversation; you don't need to understand it yet.
    ar: شاب ينزل الدرج مسرعًا ومعه دراجة. إنه يوناس، من الطابق الثاني. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Еден млад човек трча по скалите со велосипед. Јонас, од вториот кат. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: Hey! Du bist neu hier, oder?
    meaning:
      en: Hey! You're new here, right?
      ar: أهلًا! أنت جديد هنا، صح؟
      mk: Здраво! Ти си нов тука, нели?
  - speaker: protagonist
    text: Ja! Ich wohne oben. Und du?
    meaning:
      en: Yes! I live upstairs. And you?
      ar: نعم! أسكن في الأعلى. وأنت؟
      mk: Да! Живеам горе. А ти?
  - speaker: jonas
    text: Ich bin Jonas, ich wohne im zweiten Stock. Wie geht's?
    meaning:
      en: I'm Jonas, I live on the second floor. How are you?
      ar: أنا يوناس، أسكن في الطابق الثاني. كيف الحال؟
      mk: Јас сум Јонас, живеам на вториот кат. Како си?
  - speaker: protagonist
    text: Gut, danke. Und dir?
    meaning:
      en: Fine, thanks. And you?
      ar: بخير، شكرًا. وأنت؟
      mk: Добро, благодарам. А ти?
  - speaker: jonas
    text: Auch gut. Sprichst du Deutsch — oder lieber Englisch?
    meaning:
      en: Good too. Do you speak German — or would you rather speak English?
      ar: بخير أيضًا. هل تتكلم الألمانية — أم تفضّل الإنجليزية؟
      mk: И јас добро. Зборуваш ли германски — или повеќе сакаш англиски?
  - speaker: protagonist
    text: Bitte auf Deutsch! Ich lerne Deutsch.
    meaning:
      en: German, please! I'm learning German.
      ar: بالألمانية من فضلك! أنا أتعلّم الألمانية.
      mk: На германски, те молам! Учам германски.
  - speaker: jonas
    text: Super! Du sprichst schon gut.
    meaning:
      en: Great! You already speak well.
      ar: رائع! أنت تتكلم جيدًا بالفعل.
      mk: Супер! Веќе зборуваш добро.
  - speaker: protagonist
    text: Danke. Aber bitte langsam.
    meaning:
      en: Thanks. But slowly, please.
      ar: شكرًا. لكن ببطء من فضلك.
      mk: Благодарам. Но полека, те молам.
  - speaker: jonas
    text: Klar! Tschüss, bis bald!
    meaning:
      en: Sure! Bye, see you soon!
      ar: طبعًا! إلى اللقاء، أراك قريبًا!
      mk: Секако! Чао, се гледаме!
- type: narrator
  text:
    en: 'Young people, students and friends say «du» from the first word, and «Hallo» instead of «Guten Tag». With «du» the verb changes: «du bist», «du sprichst».'
    ar: 'الشباب والطلاب والأصدقاء يقولون «du» من الكلمة الأولى، و«Hallo» بدل «Guten Tag». ومع «du» يتغيّر الفعل: «du bist»، «du sprichst».'
    mk: 'Младите, студентите и пријателите си велат «du» од првиот збор, и «Hallo» наместо «Guten Tag». Со «du» глаголот се менува: «du bist», «du sprichst».'
