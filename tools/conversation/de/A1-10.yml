- type: narrator
  text:
    en: In big cities people often switch to English as soon as you hesitate. Answer «Bitte auf Deutsch» — most people are glad to slow down for you. In small towns you'll hear «Sie sprechen aber gut!»
      for every sentence.
    ar: في المدن الكبيرة كثيرًا ما يتحول الناس إلى الإنجليزية بمجرد أن تتردد. أجب «Bitte auf Deutsch» — أغلب الناس يسعدون بالتمهّل من أجلك. وفي البلدات الصغيرة ستسمع «Sie sprechen aber gut!» عند كل جملة.
    mk: Во големите градови луѓето често преминуваат на англиски штом ќе се двоумите. Одговорете «Bitte auf Deutsch» — повеќето радо ќе зборуваат побавно. Во малите места за секоја реченица ќе слушнете
      «Sie sprechen aber gut!»
