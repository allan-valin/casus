steps:
- type: narrator
  text:
    en: On your bike at a crossing, a car turning right hits you. Only bruises. The police take statements. Listen to the conversation; you don't need to understand it yet.
    ar: على درّاجتك عند تقاطع، سيارة تنعطف يمينًا تصدمك. كدمات فقط. الشرطة تأخذ الإفادات. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Со велосипед на раскрсница, кола што свртува десно ве удира. Само модринки. Полицијата зема изјави. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: polizist
    text: Sind Sie verletzt?
    meaning:
      en: Are you injured?
      ar: هل أنت مصاب؟
      mk: Повредени ли сте?
  - speaker: protagonist
    text: Nur eine Prellung am Knie. Ich war auf dem Radweg, er ist rechts abgebogen.
    meaning:
      en: Just a bruise on my knee. I was in the cycle lane, he turned right.
      ar: كدمة في الركبة فقط. كنتُ على مسار الدرّاجات، وهو انعطف يمينًا.
      mk: Само модринка на коленото. Бев на велосипедската патека, тој сврте десно.
  - speaker: polizist
    text: Der Fahrer behauptet, Sie seien bei Rot gefahren.
    meaning:
      en: The driver claims you rode through a red light.
      ar: السائق يدّعي أنك عبرتَ والإشارة حمراء.
      mk: Возачот тврди дека сте возеле на црвено.
  - speaker: protagonist
    text: Das stimmt nicht! Ich hatte Grün und Vorfahrt.
    meaning:
      en: That's not true! I had green and right of way.
      ar: هذا غير صحيح! كانت الإشارة خضراء ولي أولوية المرور.
      mk: Тоа не е точно! Имав зелено и првенство.
  - speaker: polizist
    text: Es gibt einen Zeugen. Er sagt, er habe alles gesehen.
    meaning:
      en: There's a witness. He says he saw everything.
      ar: هناك شاهد. يقول إنه رأى كل شيء.
      mk: Има сведок. Вели дека видел сè.
  - speaker: protagonist
    text: Und was sagt er?
    meaning:
      en: And what does he say?
      ar: وماذا يقول؟
      mk: А што вели?
  - speaker: polizist
    text: Laut seiner Aussage sei die Ampel für Sie grün gewesen. Das kommt in den Unfallbericht.
    meaning:
      en: According to his statement, the light was green for you. That goes in the accident report.
      ar: بحسب إفادته كانت الإشارة خضراء لك. هذا سيُدرج في تقرير الحادث.
      mk: Според неговата изјава семафорот бил зелен за вас. Тоа влегува во записникот.
  - speaker: protagonist
    text: Bekomme ich eine Kopie?
    meaning:
      en: Do I get a copy?
      ar: هل أحصل على نسخة؟
      mk: Ќе добијам ли копија?
  - speaker: polizist
    text: Sie bekommen ein Aktenzeichen. Damit fordert Ihre Versicherung den Bericht an.
    meaning:
      en: You get a case number. Your insurance requests the report with it.
      ar: تحصل على رقم ملف. به يطلب تأمينك التقرير.
      mk: Добивате број на предмет. Со него вашето осигурување го бара записникот.
- type: prompt
  ask:
    en: 'Say: just a bruise on my knee.'
    ar: 'قل: كدمة في الركبة فقط.'
    mk: 'Кажете: само модринка на коленото.'
  answer:
    speaker: protagonist
    text: Nur eine Prellung am Knie.
  items:
  - die-prellung
- type: prompt
  ask:
    en: 'Say: I was in the cycle lane, he turned right.'
    ar: 'قل: كنتُ على مسار الدرّاجات، وهو انعطف يمينًا.'
    mk: 'Кажете: бев на патеката, тој сврте десно.'
  answer:
    speaker: protagonist
    text: Ich war auf dem Radweg, er ist rechts abgebogen.
  items:
  - der-radweg
  - abbiegen
- type: narrator
  text:
    en: 'Police and reports use Konjunktiv I to keep claims apart: «Der Fahrer behauptet, Sie seien bei Rot gefahren», «Er sagt, er habe alles gesehen», «die Ampel sei grün gewesen». Nobody''s word is taken
      as fact yet.'
    ar: 'الشرطة والتقارير تستعمل Konjunktiv I للفصل بين الادّعاءات: «Der Fahrer behauptet, Sie seien bei Rot gefahren»، «Er sagt, er habe alles gesehen»، «die Ampel sei grün gewesen». لا يُعتبر كلام أحد
      حقيقة بعد.'
    mk: 'Полицијата и записниците користат Konjunktiv I за да ги одвојат тврдењата: «Der Fahrer behauptet, Sie seien bei Rot gefahren», «Er sagt, er habe alles gesehen», «die Ampel sei grün gewesen». Ничиј
      збор уште не се зема како факт.'
- type: prompt
  ask:
    en: 'Report: the driver claims I rode through red.'
    ar: 'انقل: السائق يدّعي أنني عبرتُ والإشارة حمراء.'
    mk: 'Пренесете: возачот тврди дека сум возел на црвено.'
  answer:
    speaker: protagonist
    text: Er behauptet, ich sei bei Rot gefahren.
  items:
  - er-behauptet-ich-sei
- type: prompt
  ask:
    en: 'Say: I had right of way.'
    ar: 'قل: كانت لي أولوية المرور.'
    mk: 'Кажете: имав првенство.'
  answer:
    speaker: protagonist
    text: Ich hatte Vorfahrt.
  items:
  - die-vorfahrt
- type: prompt
  ask:
    en: 'Say: at the crossing.'
    ar: 'قل: عند التقاطع.'
    mk: 'Кажете: на раскрсницата.'
  answer:
    speaker: protagonist
    text: An der Kreuzung.
  items:
  - die-kreuzung
- type: prompt
  ask:
    en: 'Report: the witness says he saw everything.'
    ar: 'انقل: الشاهد يقول إنه رأى كل شيء.'
    mk: 'Пренесете: сведокот вели дека видел сè.'
  answer:
    speaker: protagonist
    text: Der Zeuge sagt, er habe alles gesehen.
  items:
  - der-zeuge
  - er-habe-gesehen
- type: prompt
  ask:
    en: 'Say: according to his statement.'
    ar: 'قل: بحسب إفادته.'
    mk: 'Кажете: според неговата изјава.'
  answer:
    speaker: protagonist
    text: Laut seiner Aussage.
  items:
  - die-aussage
- type: prompt
  ask:
    en: 'Say: the accident report.'
    ar: 'قل: تقرير الحادث.'
    mk: 'Кажете: записникот за несреќата.'
  answer:
    speaker: protagonist
    text: Der Unfallbericht.
  items:
  - der-unfallbericht
  - der-unfall
- type: prompt
  ask:
    en: 'Say: the case number.'
    ar: 'قل: رقم الملف.'
    mk: 'Кажете: бројот на предметот.'
  answer:
    speaker: protagonist
    text: Das Aktenzeichen.
  items:
  - das-aktenzeichen
- type: narrator
  text:
    en: 'After an accident: secure the place, call 110 if anyone is hurt, take names and phone numbers of witnesses and photos. Don''t admit fault on the spot. Note the case number (Aktenzeichen) — insurers
      ask for it. Cars turning right must let cyclists going straight pass.'
    ar: 'بعد الحادث: أمّن المكان، واتصل بـ110 إن أُصيب أحد، وخذ أسماء الشهود وأرقامهم والتقط صورًا. لا تعترف بالخطأ في المكان. سجّل رقم الملف (Aktenzeichen) — شركات التأمين تطلبه. والسيارات المنعطفة يمينًا
      يجب أن تترك راكبي الدرّاجات المتقدّمين مباشرة يمرّون.'
    mk: 'По несреќа: обезбедете го местото, јавете се на 110 ако некој е повреден, земете имиња и телефони на сведоци и фотографии. Не признавајте вина на лице место. Запишете го бројот на предметот (Aktenzeichen)
      — осигурителите го бараат. Колите што свртуваат десно мора да ги пуштат велосипедистите што возат право.'
- type: prompt
  ask:
