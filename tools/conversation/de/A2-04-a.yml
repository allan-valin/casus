steps:
- type: narrator
  text:
    ar: يوناس، جارك، يسأل كيف تعيش العائلة من راتب واحد. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
- type: dialogue
  lines:
  - speaker: jonas
    text: Reicht dein Gehalt für die ganze Familie?
    meaning:
      ar: هل يكفي راتبك للعائلة كلها؟
  - speaker: protagonist
    text: Ja, weil die Blaue Karte gut bezahlt ist.
    meaning:
      ar: نعم، لأن عمل البطاقة الزرقاء أجره جيد.
  - speaker: jonas
    text: Und die Miete? Leipzig wird teuer.
    meaning:
      ar: والإيجار؟ لايبزيغ تصبح غالية.
  - speaker: protagonist
    text: Die Miete ist hoch. Aber wir bekommen Kindergeld.
    meaning:
      ar: الإيجار مرتفع. لكننا نحصل على إعانة الأطفال.
  - speaker: jonas
    text: Arbeitet deine Frau?
    meaning:
      ar: هل تعمل زوجتك؟
  - speaker: protagonist
    text: Noch nicht. Meine Frau lernt Deutsch. Sie will später arbeiten.
    meaning:
      ar: ليس بعد. زوجتي تتعلم الألمانية. تريد أن تعمل لاحقًا.
  - speaker: jonas
    text: Und ihr spart?
    meaning:
      ar: وهل توفّرون؟
  - speaker: protagonist
    text: Ein bisschen. Weil wir Familie in Syrien unterstützen.
    meaning:
      ar: قليلًا. لأننا ندعم العائلة في سوريا.
