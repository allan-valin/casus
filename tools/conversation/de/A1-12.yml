- type: narrator
  text:
    en: Dogs ride trams and buses and come into many shops and offices, usually on a lead and very calm. Feeding pigeons is banned in many city centres.
    ar: تركب الكلاب الترام والحافلات وتدخل كثيرًا من المحلات والمكاتب، عادةً بالمقود وبهدوء تام. وإطعام الحمام ممنوع في وسط كثير من المدن.
    mk: Кучињата се возат во трамваи и автобуси и влегуваат во многу продавници и канцеларии, обично на поводник и многу мирни. Хранењето гулаби е забрането во центарот на многу градови.
