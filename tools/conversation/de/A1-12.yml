steps:
- type: narrator
  text:
    en: A big dog gets on the tram and sits next to you. Listen to the conversation; you don't need to understand it yet.
    ar: كلب كبير يصعد إلى الترام ويجلس بجانبك. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Едно големо куче се качува во трамвајот и седнува до вас. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: fahrer
    text: Keine Angst, der Hund ist lieb.
    meaning:
      en: Don't worry, the dog is friendly.
      ar: لا تخف، الكلب لطيف.
      mk: Не плашете се, кучето е мило.
  - speaker: protagonist
    text: Ein Hund in der Straßenbahn?
    meaning:
      en: A dog on the tram?
      ar: كلب في الترام؟
      mk: Куче во трамвај?
  - speaker: fahrer
    text: Ja, Hunde dürfen mitfahren. Mit Leine.
    meaning:
      en: Yes, dogs are allowed to ride. On a lead.
      ar: نعم، يُسمح للكلاب بالركوب. بالمقود.
      mk: Да, кучињата смеат да се возат. Со поводник.
  - speaker: protagonist
    text: Wie heißt er?
    meaning:
      en: What's his name?
      ar: ما اسمه؟
      mk: Како се вика?
  - speaker: fahrer
    text: Bruno. Haben Sie auch Tiere?
    meaning:
      en: Bruno. Do you have pets too?
      ar: برونو. هل عندك حيوانات أيضًا؟
      mk: Бруно. Имате ли и вие животни?
  - speaker: protagonist
    text: Zu Hause habe ich zwei Katzen.
    meaning:
      en: At home I have two cats.
      ar: في البيت عندي قطتان.
      mk: Дома имам две мачки.
  - speaker: fahrer
    text: Katzen! Schön. Und im Park, so viele Vögel.
    meaning:
      en: Cats! Nice. And in the park, so many birds.
      ar: قطط! جميل. وفي الحديقة، طيور كثيرة جدًا.
      mk: Мачки! Убаво. А во паркот, толку многу птици.
  - speaker: protagonist
    text: Die Tauben! Ich habe Brot für die Tauben.
    meaning:
      en: The pigeons! I've got bread for the pigeons.
      ar: الحمام! معي خبز للحمام.
      mk: Гулабите! Имам леб за гулабите.
  - speaker: fahrer
    text: Bitte nicht füttern. Das ist verboten.
    meaning:
      en: Please don't feed them. It's forbidden.
      ar: من فضلك لا تطعمها. هذا ممنوع.
      mk: Ве молам, не ги хранете. Тоа е забрането.
- type: prompt
  ask:
    en: 'She says: the dog is friendly.'
    ar: 'تقول: الكلب لطيف.'
    mk: 'Таа вели: кучето е мило.'
  answer:
    speaker: protagonist
    text: Der Hund ist lieb.
  items:
  - der-hund
  - lieb
- type: prompt
  ask:
