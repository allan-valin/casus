    en: 'Telling a story, German often uses the simple past of strong verbs: «gewann» (won), «verlor» (lost), «schoss» (shot), «sangen» (sang), «fiel» (fell). Learn them in pairs: gewinnen — gewann.'
    ar: 'عند سرد القصة تستعمل الألمانية غالبًا الماضي البسيط للأفعال القوية: «gewann» (فاز)، «verlor» (خسر)، «schoss» (سدّد)، «sangen» (غنّوا)، «fiel» (سقط). احفظها أزواجًا: gewinnen — gewann.'
    mk: 'Кога се раскажува, германскиот често користи просто минато на силните глаголи: «gewann» (победи), «verlor» (загуби), «schoss» (шутна), «sangen» (пееја), «fiel» (падна). Учете ги во парови: gewinnen
