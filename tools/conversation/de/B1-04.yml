steps:
- type: narrator
  text:
    en: Monday after the derby. Jonas tells you how the match went — he was in the stadium. Listen to the conversation; you don't need to understand it yet.
    ar: الاثنين بعد المباراة الكبيرة. يوناس يحكي لك كيف كانت المباراة — كان في الملعب. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Понеделник по дербито. Јонас ви раскажува како помина натпреварот — беше на стадионот. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Wie war das Spiel am Samstag?
    meaning:
      en: How was the match on Saturday?
      ar: كيف كانت المباراة يوم السبت؟
      mk: Како беше натпреварот во сабота?
  - speaker: jonas
    text: Super! Ich war im Stadion. Die Stimmung war unglaublich.
    meaning:
      en: Great! I was in the stadium. The atmosphere was unbelievable.
      ar: رائعة! كنت في الملعب. الأجواء كانت لا تُصدَّق.
      mk: Супер! Бев на стадионот. Атмосферата беше неверојатна.
  - speaker: protagonist
    text: Wer gewann?
    meaning:
      en: Who won?
      ar: من فاز؟
      mk: Кој победи?
  - speaker: jonas
    text: Leipzig gewann zwei zu eins. Das zweite Tor fiel in der letzten Minute!
    meaning:
      en: Leipzig won two-one. The second goal came in the last minute!
      ar: لايبزيغ فاز اثنين لواحد. الهدف الثاني جاء في الدقيقة الأخيرة!
      mk: Лајпциг победи два спрема еден. Вториот гол падна во последната минута!
  - speaker: protagonist
    text: Wer schoss das Tor?
    meaning:
      en: Who scored the goal?
      ar: من سجّل الهدف؟
      mk: Кој го постигна голот?
  - speaker: jonas
    text: Ein junger Spieler aus Frankreich. Alle Fans sangen.
    meaning:
      en: A young player from France. All the fans were singing.
      ar: لاعب شاب من فرنسا. كل المشجعين كانوا يغنّون.
      mk: Еден млад играч од Франција. Сите навивачи пееја.
  - speaker: protagonist
    text: Und letzte Woche?
    meaning:
      en: And last week?
      ar: والأسبوع الماضي؟
      mk: А минатата недела?
  - speaker: jonas
    text: Da verloren wir. Und davor unentschieden. Die Saison ist lang.
    meaning:
      en: We lost that one. And before that a draw. The season is long.
      ar: حينها خسرنا. وقبلها تعادل. الموسم طويل.
      mk: Тогаш изгубивме. А пред тоа нерешено. Сезоната е долга.
