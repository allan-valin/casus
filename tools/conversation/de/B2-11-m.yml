steps:
- type: narrator
  text:
    mk: Јан, кандидатот за чирак, доаѓа на пробен ден во столарницата на господин Волф. Вие помагате — и потоа му раскажувате на Петар. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: herrwolf
    text: Willkommen in der Werkstatt, Jan. Warum möchtest du Tischler werden?
    meaning:
      mk: Добредојде во работилницата, Јан. Зошто сакаш да станеш столар?
  - speaker: azubi
    text: Ich arbeite gern mit den Händen. Und ich liebe Holz.
    meaning:
      mk: Сакам да работам со рацете. И го сакам дрвото.
  - speaker: protagonist
    text: Vorsicht mit der Säge! So hält man sie.
    meaning:
      mk: Внимавај со пилата! Вака се држи.
  - speaker: azubi
    text: Danke! Darf ich fragen, ob Sie auch Tischler sind?
    meaning:
      mk: Благодарам! Смеам ли да прашам дали и вие сте столар?
  - speaker: protagonist
    text: Mein Vater war Meister. Ich habe es als Kind gelernt.
    meaning:
      mk: Татко ми беше мајстор. Јас научив како дете.
  - speaker: petar
    text: Und? Wie war der Probetag, Papa?
    meaning:
      mk: И? Како беше пробниот ден, тато?
  - speaker: protagonist
    text: Gut! Herr Wolf fragte, warum er Tischler werden will. Und Jan wollte wissen, ob ich auch Tischler bin.
    meaning:
      mk: Добро! Господин Волф праша зошто сака да стане столар. А Јан сакаше да знае дали и јас сум столар.
  - speaker: petar
    text: Und? Nimmt er ihn?
    meaning:
      mk: И? Ќе го земе?
  - speaker: protagonist
    text: Ich glaube schon. Er hat Talent.
    meaning:
      mk: Мислам дека да. Има талент.
