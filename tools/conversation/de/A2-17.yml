  items:
  - zum-bahnsteig
- type: prompt
  ask:
    en: 'Say: the train is running late.'
    ar: 'قولي: القطار متأخر.'
    mk: 'Кажете: возот доцни.'
  answer:
    speaker: protagonist
    text: Der Zug kommt mit Verspätung.
  items:
  - mit-verspaetung
- type: prompt
  ask:
    en: 'Ask: and my connection?'
    ar: 'اسألي: وقطاري الموصل؟'
    mk: 'Прашајте: а мојата врска?'
  answer:
    speaker: protagonist
    text: Und mein Anschluss?
  items:
  - der-anschluss
- type: prompt
  ask:
    en: 'Say: it''s cancelled.'
    ar: 'قولي: أُلغي.'
    mk: 'Кажете: откажан е.'
  answer:
    speaker: protagonist
    text: Er fällt aus.
  items:
