  items:
  - entschaedigung
- type: prompt
  ask:
    en: 'Say: get on the train!'
    ar: 'قولي: اصعدي القطار!'
    mk: 'Кажете: качете се во возот!'
  answer:
    speaker: protagonist
    text: In den Zug!
  items:
  - in-den-zug
- type: narrator
  text:
    en: Long-distance trains are often late. With a long delay you can claim part of the fare back — the rules are on the Bahn's website and in its app. Check the platform on the board until the last minute.
    ar: قطارات المسافات الطويلة تتأخر كثيرًا. وعند التأخير الطويل يمكنكِ استرداد جزء من ثمن التذكرة — القواعد في موقع «Bahn» وتطبيقها. تابعي لوحة الأرصفة حتى آخر دقيقة.
    mk: Возовите на долги релации често доцнат. При долго доцнење може да вратите дел од билетот — правилата се на страницата и во апликацијата на Бан. Следете ја таблата за перонот до последната минута.
