steps:
- type: narrator
  text:
    en: Saturday, the train to Dresden. Platform changed, delay announced. Listen to the conversation; you don't need to understand it yet.
    ar: يوم السبت، القطار إلى دريسدن. تغيّر الرصيف، وأُعلن عن تأخير. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Сабота, возот за Дрезден. Перонот сменет, најавено доцнење. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Entschuldigung, fährt der Zug nach Dresden auf Gleis fünf?
    meaning:
      en: Excuse me, does the train to Dresden leave from platform five?
      ar: عفوًا، هل يغادر القطار إلى دريسدن من الرصيف خمسة؟
      mk: Извинете, дали возот за Дрезден тргнува од перон пет?
  - speaker: fahrer
    text: Hören Sie die Durchsage? Jetzt Gleis acht!
    meaning:
      en: Hear the announcement? Platform eight now!
      ar: هل تسمعين الإعلان؟ الآن الرصيف ثمانية!
      mk: Ја слушате ли најавата? Сега перон осум!
  - speaker: protagonist
    text: Oh! Wo ist der Weg zum Bahnsteig?
    meaning:
      en: Oh! Which way to the platform?
      ar: أوه! من أين الطريق إلى الرصيف؟
      mk: О! Каде е патот до перонот?
  - speaker: fahrer
    text: Die Treppe hoch. Aber der Zug kommt mit Verspätung — zwanzig Minuten.
    meaning:
      en: Up the stairs. But the train is running late — twenty minutes.
      ar: اصعدي الدرج. لكن القطار متأخر — عشرين دقيقة.
      mk: По скалите горе. Но возот доцни — дваесет минути.
  - speaker: protagonist
    text: Zwanzig Minuten! Und mein Anschluss?
    meaning:
      en: Twenty minutes! And my connection?
      ar: عشرين دقيقة! وقطاري الموصل؟
      mk: Дваесет минути! А мојата врска?
  - speaker: fahrer
    text: Ihr Anschluss fällt vielleicht aus. Fragen Sie im Zug.
    meaning:
      en: Your connection may be cancelled. Ask on the train.
      ar: ربما يُلغى قطارك الموصل. اسألي في القطار.
      mk: Вашата врска можеби е откажана. Прашајте во возот.
  - speaker: protagonist
    text: Ich dachte, in Deutschland sind die Züge pünktlich!
    meaning:
      en: I thought trains in Germany were punctual!
      ar: ظننتُ أن القطارات في ألمانيا دقيقة!
      mk: Мислев дека во Германија возовите се точни!
  - speaker: fahrer
    text: Ha! Bei viel Verspätung gibt es eine Entschädigung. Steigen Sie schnell in den Zug!
    meaning:
      en: Ha! With a long delay there's compensation. Quick, get on the train!
      ar: ها! عند التأخير الطويل هناك تعويض. اصعدي القطار بسرعة!
      mk: Ха! При долго доцнење има надомест. Брзо качете се во возот!
- type: prompt
  ask:
    en: 'Ask: does the train to Dresden leave from platform five?'
    ar: 'اسألي: هل يغادر القطار إلى دريسدن من الرصيف خمسة؟'
    mk: 'Прашајте: дали возот за Дрезден тргнува од перон пет?'
  answer:
    speaker: protagonist
    text: Fährt der Zug nach Dresden auf Gleis fünf?
  items:
  - nach-dresden
  - auf-gleis
  - das-gleis
- type: prompt
  ask:
    en: 'Say: the announcement.'
    ar: 'قولي: الإعلان.'
    mk: 'Кажете: најавата.'
  answer:
    speaker: protagonist
    text: Die Durchsage.
  items:
  - die-durchsage
- type: narrator
  text:
    en: 'Direction words: «nach» for cities and countries («nach Dresden»), «zu» for people and places («zum Bahnsteig»), «in» + accusative for going into («in den Zug»).'
    ar: 'كلمات الاتجاه: «nach» للمدن والبلدان («nach Dresden»)، و«zu» للأشخاص والأماكن («zum Bahnsteig»)، و«in» مع حالة النصب للدخول («in den Zug»).'
    mk: 'Зборови за насока: «nach» за градови и земји («nach Dresden»), «zu» за луѓе и места («zum Bahnsteig»), «in» + акузатив за влегување («in den Zug»).'
- type: prompt
  ask:
    en: 'Ask: which way to the platform?'
    ar: 'اسألي: من أين الطريق إلى الرصيف؟'
    mk: 'Прашајте: каде е патот до перонот?'
  answer:
    speaker: protagonist
