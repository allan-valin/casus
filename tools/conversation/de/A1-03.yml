  answer:
    speaker: protagonist
    text: Haben Sie Fieber?
  items:
  - haben-sie
  - fieber
- type: narrator
  text:
    en: '«kein» says ''no'' before a noun: «kein Fieber», no temperature. «nicht» says ''not'' for the rest: «nicht schlimm».'
    ar: '«kein» تنفي الاسم: «kein Fieber»، لا حرارة. و«nicht» تنفي غير ذلك: «nicht schlimm»، ليس خطيرًا.'
    mk: '«kein» негира именка: «kein Fieber», нема температура. «nicht» негира сè друго: «nicht schlimm», не е страшно.'
- type: prompt
  ask:
    en: 'Say: no, no temperature.'
    ar: 'قولي: لا، لا حرارة.'
    mk: 'Кажете: не, немам температура.'
  answer:
