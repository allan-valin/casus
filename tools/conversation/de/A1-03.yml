- type: narrator
  text:
    en: You see a family doctor (Hausarzt) first, with your health insurance card; specialists usually after a referral. Appointments are booked, often by phone or app.
    ar: تزورين أولًا طبيب العائلة (Hausarzt) ومعكِ بطاقة التأمين الصحي؛ وإلى الأخصائي غالبًا بتحويل. المواعيد تُحجز مسبقًا بالهاتف أو بتطبيق.
    mk: Прво одите кај матичен лекар (Hausarzt) со картичката од здравственото осигурување; кај специјалист обично со упат. Терминот се закажува, често по телефон или апликација.
