steps:
- type: narrator
  text:
    en: Your head hurts. A first visit to Dr Wagner, the family doctor. Listen to the conversation; you don't need to understand it yet.
    ar: رأسك يؤلمك. زيارتك الأولى للطبيبة فاغنر، طبيبة العائلة. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Ве боли главата. Прва посета кај д-р Вагнер, матичната лекарка. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: wagner
    text: Guten Tag. Was fehlt Ihnen?
    meaning:
      en: Hello. What's wrong?
      ar: نهارك سعيد. ما بكِ؟
      mk: Добар ден. Што ви е?
  - speaker: protagonist
    text: Mein Kopf tut weh. Und mein Bauch.
    meaning:
      en: My head hurts. And my belly.
      ar: رأسي يؤلمني. وبطني أيضًا.
      mk: Ме боли главата. И стомакот.
  - speaker: wagner
    text: Seit wann?
    meaning:
      en: Since when?
      ar: منذ متى؟
      mk: Од кога?
  - speaker: protagonist
    text: Seit gestern.
    meaning:
      en: Since yesterday.
      ar: منذ أمس.
      mk: Од вчера.
  - speaker: wagner
    text: Haben Sie Fieber?
    meaning:
      en: Do you have a temperature?
      ar: هل عندكِ حرارة؟
      mk: Имате ли температура?
  - speaker: protagonist
    text: Nein, kein Fieber. Aber mein Arm tut auch ein bisschen weh.
    meaning:
      en: No, no temperature. But my arm hurts a little too.
      ar: لا، لا حرارة. لكن ذراعي تؤلمني قليلًا أيضًا.
      mk: Не, немам температура. Но и раката малку ме боли.
  - speaker: wagner
    text: Das ist nicht schlimm. Trinken Sie viel Wasser und ruhen Sie sich aus.
    meaning:
      en: That's not serious. Drink plenty of water and rest.
      ar: هذا ليس خطيرًا. اشربي ماءً كثيرًا وارتاحي.
      mk: Тоа не е страшно. Пијте многу вода и одморете се.
  - speaker: protagonist
    text: Danke, Frau Doktor.
    meaning:
      en: Thank you, Doctor.
      ar: شكرًا يا حضرة الطبيبة.
      mk: Благодарам, госпоѓо докторке.
- type: prompt
  ask:
    en: The doctor asks what's wrong. How?
    ar: تسألك الطبيبة ما بكِ. كيف؟
    mk: Лекарката прашува што ви е. Како?
  answer:
    speaker: protagonist
    text: Was fehlt Ihnen?
  items:
  - was-fehlt-ihnen
- type: narrator
  text:
    en: '«tut weh» — hurts. «Mein Kopf tut weh»: word for word, ''my head does pain''. «mein» goes with «der» and «das» words; with «die» words it becomes «meine»: «meine Hand».'
    ar: '«tut weh» تعني: يؤلم. «Mein Kopf tut weh» حرفيًا: رأسي يفعل ألمًا. «mein» تأتي مع أسماء «der» و«das»؛ ومع أسماء «die» تصبح «meine»: «meine Hand».'
    mk: '«tut weh» — боли. «Mein Kopf tut weh»: збор по збор, „мојата глава прави болка“. «mein» оди со именки со «der» и «das»; со «die» станува «meine»: «meine Hand».'
- type: prompt
  ask:
    en: 'Say: my head hurts.'
    ar: 'قولي: رأسي يؤلمني.'
    mk: 'Кажете: ме боли главата.'
  answer:
    speaker: protagonist
    text: Mein Kopf tut weh.
  items:
  - mein
  - der-kopf
  - tut-weh
- type: prompt
  ask:
    en: 'Say: and my belly.'
    ar: 'قولي: وبطني.'
    mk: 'Кажете: и стомакот.'
  answer:
    speaker: protagonist
    text: Und mein Bauch.
  items:
  - der-bauch
- type: prompt
  ask:
    en: She asks since when. How?
    ar: تسأل منذ متى. كيف؟
    mk: Прашува од кога. Како?
  answer:
    speaker: protagonist
    text: Seit wann?
  items:
  - seit-wann
- type: prompt
  ask:
    en: 'Answer: since yesterday.'
