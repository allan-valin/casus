- type: narrator
  text:
    en: Public holidays are Christian ones, varying by state. For other festivals you take leave — employers and schools usually allow it if you ask early.
    ar: العطل الرسمية مسيحية وتختلف من ولاية لأخرى. وللأعياد الأخرى تأخذ إجازة — وأصحاب العمل والمدارس يوافقون عادةً إذا طلبت مبكرًا.
    mk: Државните празници се христијански и се разликуваат по покраини. За други празници земате одмор — работодавците и училиштата обично дозволуваат ако прашате навреме.
- type: narrator
  for:
  - ar
  - mk
  text:
    ar: 'في رمضان يمكنكِ أن تقولي: «Ich faste im Ramadan» — أنا صائمة في رمضان. وفي العيد: «Heute ist Zuckerfest» أو «Bayram». كثير من الحضانات والمدارس تعرف ذلك.'
    mk: 'Православниот Велигден честопати паѓа една или повеќе недели по католичкиот, а Божиќ на 7 јануари. Кажете: «Bei uns ist Weihnachten am 7. Januar».'
