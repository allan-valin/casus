steps:
- type: narrator
  text:
    en: December. Frau Becker decorates the stairwell and asks which festivals you celebrate. Listen to the conversation; you don't need to understand it yet.
    ar: ديسمبر. السيدة بيكر تزيّن الدرج وتسألكِ عن الأعياد التي تحتفلين بها. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Декември. Госпоѓа Бекер ги украсува скалите и ве прашува кои празници ги славите. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: becker
    text: Bald ist Weihnachten! Feiern Sie auch Weihnachten?
    meaning:
      en: Christmas is coming! Do you celebrate Christmas too?
      ar: عيد الميلاد قريب! هل تحتفلين به أيضًا؟
      mk: Наскоро е Божиќ! Го славите ли и вие Божиќ?
  - speaker: protagonist
    text: Bei uns gibt es andere Feste — zu einer anderen Zeit.
    meaning:
      en: Where I come from there are other festivals — at a different time.
      ar: عندنا أعياد أخرى — في وقت آخر.
      mk: Кај нас има други празници — во друго време.
  - speaker: becker
    text: Und dann haben Sie frei?
    meaning:
      en: And then you have time off?
      ar: وهل تأخذين إجازة حينها؟
      mk: И тогаш сте слободни?
  - speaker: protagonist
    text: Nein, ich muss frei nehmen, weil es hier kein Feiertag ist.
    meaning:
      en: No, I have to take a day off, because it's not a holiday here.
      ar: لا، يجب أن آخذ إجازة، لأنه ليس عطلة هنا.
      mk: Не, морам да земам слободен ден, затоа што тука не е празник.
  - speaker: becker
    text: Was machen Sie an dem Fest?
    meaning:
      en: What do you do at the festival?
      ar: ماذا تفعلين في العيد؟
      mk: Што правите на празникот?
  - speaker: protagonist
    text: Wir besuchen die Familie, wir essen zusammen, es gibt Geschenke für die Kinder.
    meaning:
      en: We visit the family, we eat together, there are presents for the children.
      ar: نزور العائلة ونأكل معًا، وهناك هدايا للأطفال.
      mk: Го посетуваме семејството, јадеме заедно, има подароци за децата.
  - speaker: becker
    text: Wie bei uns an Weihnachten! Und Ostern?
    meaning:
      en: Like us at Christmas! And Easter?
      ar: مثلنا في عيد الميلاد! وعيد الفصح؟
      mk: Како кај нас за Божиќ! А Велигден?
  - speaker: protagonist
    text: Das ist bei jedem anders. Frohe Feiertage, Frau Becker!
    meaning:
      en: That's different for everyone. Happy holidays, Mrs Becker!
      ar: هذا يختلف من شخص لآخر. أعيادًا سعيدة يا سيدة بيكر!
      mk: Тоа е различно кај секого. Среќни празници, госпоѓо Бекер!
- type: prompt
  ask:
    en: She asks if you celebrate Christmas.
    ar: تسألكِ إن كنتِ تحتفلين بعيد الميلاد.
    mk: Ве прашува дали го славите Божиќ.
  answer:
    speaker: protagonist
    text: Feiern Sie Weihnachten?
