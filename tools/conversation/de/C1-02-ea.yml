- type: narrator
  text:
    en: 'Permanent residence (Niederlassungserlaubnis) usually needs: some years of residence, your own income, a set number of months of pension contributions, German at B1, the ''Leben in Deutschland''
      test, and adequate housing. Blue Card holders and skilled workers can get it sooner. Numbers change — check the current rules and apply before your permit expires.'
    ar: 'الإقامة الدائمة (Niederlassungserlaubnis) تحتاج عادةً: بضع سنوات من الإقامة، ودخلًا خاصًا، وعددًا محددًا من أشهر اشتراك التقاعد، وألمانية بمستوى B1، واختبار «الحياة في ألمانيا»، ومسكنًا مناسبًا.
      وحاملو البطاقة الزرقاء والعمالة الماهرة يحصلون عليها أسرع. الأرقام تتغيّر — تحقّقي من القواعد الحالية وقدّمي الطلب قبل انتهاء إقامتكِ.'
