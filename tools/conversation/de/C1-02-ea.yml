steps:
- type: narrator
  text:
    en: Some years in Germany now. At the Ausländerbehörde, Herr Schulz goes through the conditions for permanent residence. Listen to the conversation; you don't need to understand it yet.
    ar: مضت سنوات في ألمانيا. في دائرة الأجانب يراجع السيد شولتس شروط الإقامة الدائمة. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Ich möchte einen unbefristeten Aufenthalt beantragen. Was sind die Voraussetzungen?
    meaning:
      en: I'd like to apply for permanent residence. What are the conditions?
      ar: أريد التقدّم بطلب إقامة غير محددة المدة. ما الشروط؟
  - speaker: schulz
    text: Erstens die Sicherung des Lebensunterhalts durch eigene Arbeit.
    meaning:
      en: First, securing your livelihood through your own work.
      ar: 'أولًا: تأمين المعيشة من عملكِ الخاص.'
  - speaker: schulz
    text: Zweitens eine bestimmte Zahl von Beitragsmonaten in der Rentenversicherung.
    meaning:
      en: Second, a certain number of months of pension contributions.
      ar: 'ثانيًا: عدد معيّن من أشهر الاشتراك في تأمين التقاعد.'
  - speaker: protagonist
    text: Und die Sprache?
    meaning:
      en: And the language?
      ar: واللغة؟
  - speaker: schulz
    text: Ein Sprachnachweis, mindestens B1, und der Test „Leben in Deutschland“. Dazu ausreichender Wohnraum.
    meaning:
      en: Proof of language, at least B1, and the 'Life in Germany' test. Plus sufficient living space.
      ar: إثبات لغوي، B1 على الأقل، واختبار «الحياة في ألمانيا». إضافة إلى مسكن كافٍ.
  - speaker: protagonist
    text: Mit der Blauen Karte geht es schneller, oder?
    meaning:
      en: With the Blue Card it's faster, isn't it?
      ar: مع البطاقة الزرقاء يكون أسرع، أليس كذلك؟
  - speaker: schulz
    text: Ja, bei Erfüllung aller Voraussetzungen deutlich schneller. Die genauen Fristen stehen auf unserer Webseite.
    meaning:
      en: Yes, if all conditions are met, considerably faster. The exact periods are on our website.
      ar: نعم، عند استيفاء كل الشروط أسرع بكثير. المدد الدقيقة على موقعنا.
  - speaker: protagonist
    text: Und die Bearbeitungszeit?
    meaning:
      en: And the processing time?
      ar: ومدة المعالجة؟
  - speaker: schulz
    text: Mehrere Monate. Stellen Sie den Antrag vor Ablauf Ihres jetzigen Titels.
    meaning:
      en: Several months. Submit the application before your current permit expires.
      ar: عدة أشهر. قدّمي الطلب قبل انتهاء إقامتكِ الحالية.
