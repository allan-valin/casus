steps:
- type: narrator
  text:
    en: 'You''ve finished a big project. Frau Schröder says: ''Not bad.'' Are you in trouble? Sabine decodes German understatement. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'أنهيتَ مشروعًا كبيرًا. السيدة شرودر تقول: «ليس سيئًا.» هل أنت في ورطة؟ زابينه تفكّ شيفرة التهوين الألماني. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.'
    mk: 'Завршивте голем проект. Госпоѓа Шредер вели: „Не е лошо.“ Дали сте во неволја? Сабине го дешифрира германското потценување. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: schroeder
    text: Die Präsentation? Nicht schlecht.
    meaning:
      en: The presentation? Not bad.
      ar: العرض؟ ليس سيئًا.
      mk: Презентацијата? Не е лошо.
  - speaker: protagonist
    text: Sabine, sie fand es nur „nicht schlecht“. Muss ich mir Sorgen machen?
    meaning:
      en: Sabine, she only found it 'not bad'. Should I worry?
      ar: زابينه، لقد وجدته «ليس سيئًا» فقط. هل يجب أن أقلق؟
      mk: Сабине, таа рече само „не е лошо“. Треба ли да се грижам?
  - speaker: sabine
    text: Im Gegenteil! Von ihr ist „nicht schlecht“ das höchste Lob.
    meaning:
      en: On the contrary! From her, 'not bad' is the highest praise.
      ar: بالعكس! «ليس سيئًا» منها هو أعلى مديح.
      mk: Напротив! Од неа „не е лошо“ е најголемата пофалба.
  - speaker: protagonist
    text: Und was bedeutet „ganz interessant“?
    meaning:
      en: And what does 'quite interesting' mean?
      ar: وماذا تعني «مثير للاهتمام نوعًا ما»؟
      mk: А што значи „прилично интересно“?
  - speaker: sabine
    text: 'Das heißt: Sie ist nicht überzeugt. Und „kann man machen“ heißt eigentlich: lieber nicht.'
    meaning:
      en: 'That means: she isn''t convinced. And ''that''s one way'' actually means: better not.'
      ar: 'يعني: إنها غير مقتنعة. و«يمكن ذلك» تعني في الحقيقة: الأفضل لا.'
      mk: 'Тоа значи: не е убедена. А „може и така“ всушност значи: подобро не.'
  - speaker: protagonist
    text: Man muss also zwischen den Zeilen lesen.
    meaning:
      en: So you have to read between the lines.
      ar: إذن يجب القراءة ما بين السطور.
      mk: Значи треба да се чита меѓу редовите.
  - speaker: sabine
    text: Und auf den Tonfall hören. „Da hast du dir ja Mühe gegeben“ kann Lob oder Spott sein.
    meaning:
      en: And listen to the tone. 'You really made an effort' can be praise or mockery.
      ar: والإصغاء إلى النبرة. «لقد بذلتَ جهدًا حقًا» قد تكون مديحًا أو سخرية.
      mk: И да се слуша тонот. „Баш си се потрудил“ може да е пофалба или потсмев.
  - speaker: protagonist
    text: Na ja, gut — dann sage ich jetzt auch öfter „nicht schlecht“.
    meaning:
      en: Well, all right — then I'll say 'not bad' more often too.
      ar: حسنًا، لا بأس — إذن سأقول أنا أيضًا «ليس سيئًا» أكثر.
      mk: Па, добро — тогаш и јас почесто ќе велам „не е лошо“.
- type: prompt
  ask:
    en: 'She says: not bad (= very good).'
    ar: 'تقول: ليس سيئًا (= ممتاز).'
    mk: 'Таа вели: не е лошо (= многу добро).'
  answer:
    speaker: protagonist
    text: Nicht schlecht.
  items:
  - nicht-schlecht
- type: prompt
  ask:
    en: 'Sabine: the highest praise.'
    ar: 'زابينه: أعلى مديح.'
    mk: 'Сабине: најголемата пофалба.'
  answer:
    speaker: protagonist
    text: Das höchste Lob.
  items:
  - das-hoechste-lob
- type: narrator
  text:
    en: 'German understatement and irony live in small words and tone: «nicht schlecht» (= very good), «ganz interessant» (= not convinced), «kann man machen» (= rather not), «Na ja, gut» (= reluctantly).
      The particle «ja» can make praise sound ironic.'
    ar: 'التهوين والسخرية في الألمانية يعيشان في الكلمات الصغيرة والنبرة: «nicht schlecht» (= ممتاز)، «ganz interessant» (= غير مقتنع)، «kann man machen» (= الأفضل لا)، «Na ja, gut» (= على مضض). والأداة
      «ja» قد تجعل المديح يبدو ساخرًا.'
    mk: 'Германското потценување и иронија живеат во мали зборови и тон: «nicht schlecht» (= многу добро), «ganz interessant» (= не е убеден), «kann man machen» (= подобро не), «Na ja, gut» (= неволно).
      Честичката «ja» може пофалбата да ја направи иронична.'
- type: prompt
  ask:
    en: 'Decode: quite interesting.'
    ar: 'فكّ الشيفرة: مثير للاهتمام نوعًا ما.'
    mk: 'Дешифрирајте: прилично интересно.'
  answer:
    speaker: protagonist
    text: Ganz interessant.
  items:
  - ganz-interessant
- type: prompt
  ask:
    en: 'Decode: that''s one way.'
    ar: 'فكّ الشيفرة: يمكن ذلك.'
    mk: 'Дешифрирајте: може и така.'
  answer:
    speaker: protagonist
    text: Kann man machen.
  items:
  - kann-man-machen
