steps:
- type: narrator
  text:
    mk: Петар и Ања работат цел ден. Вие го земате Лука од градинка и го чувате до вечер. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: kruger
    text: Guten Tag! Sie holen Luka heute ab? Stehen Sie auf der Abholberechtigung?
    meaning:
      mk: Добар ден! Вие го земате Лука денес? Дали сте на списокот со овластени?
  - speaker: protagonist
    text: Ja, ich bin der Opa. Mein Sohn hat mich eingetragen.
    meaning:
      mk: Да, јас сум дедото. Синот ме запиша.
  - speaker: kruger
    text: Gut. Er hatte keinen Mittagsschlaf, er ist müde.
    meaning:
      mk: Добро. Немаше попладневен сон, уморен е.
  - speaker: protagonist
    text: Könnten Sie mir bitte seine Jacke geben? ... Danke.
    meaning:
      mk: Дали би можеле, ве молам, да ми ја дадете јакната? ... Благодарам.
  - speaker: luka
    text: Opa! Liest du mir das Bilderbuch vor?
    meaning:
      mk: Дедо! Ќе ми ја прочиташ сликовницата?
  - speaker: protagonist
    text: Natürlich. Und dann Abendessen. Mama und Papa kommen um sechs.
    meaning:
      mk: Се разбира. А потоа вечера. Мама и тато доаѓаат во шест.
  - speaker: kruger
    text: Ich möchte Sie bitten, morgen Gummistiefel mitzubringen. Wir gehen in den Wald.
    meaning:
      mk: Би сакала да ве замолам утре да донесете гумени чизми. Одиме во шума.
  - speaker: protagonist
    text: Mache ich. Wir passen gut auf ihn auf.
    meaning:
      mk: Ќе донесам. Добро ќе внимаваме на него.
