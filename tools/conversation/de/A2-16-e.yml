steps:
- type: narrator
  text:
    en: Your classmate Mia had a baby last year — and still studies. You ask how it works. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Mia, wie war das letzte Jahr mit dem Baby?
    meaning:
      en: Mia, how was last year with the baby?
  - speaker: mia
    text: Schwer! Ich hatte wenig Schlaf.
    meaning:
      en: Hard! I had little sleep.
  - speaker: protagonist
    text: Und das Studium?
    meaning:
      en: And your studies?
  - speaker: mia
    text: Ich hatte ein Urlaubssemester. Jetzt ist die Kleine in der Uni-Kita.
    meaning:
      en: I took a semester off. Now the little one is in the university nursery.
  - speaker: protagonist
    text: Bekommst du Unterstützung?
    meaning:
      en: Do you get support?
  - speaker: mia
    text: Ja, Kindergeld. Der Antrag war einfach — bei der Familienkasse.
    meaning:
      en: Yes, child benefit. The application was easy — at the family benefits office.
  - speaker: protagonist
    text: Bekommen das auch internationale Studenten?
    meaning:
      en: Do international students get it too?
  - speaker: mia
    text: Das hängt vom Aufenthaltstitel ab. Frag bei der Familienkasse.
    meaning:
      en: That depends on the residence permit. Ask at the family benefits office.
- type: narrator
  text:
    en: 'For ''was'' and ''had'', German usually uses the simple past even in speech: «war», «hatte». «Wie war das Jahr?» «Ich hatte wenig Schlaf.»'
