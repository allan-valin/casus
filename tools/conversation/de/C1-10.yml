- type: narrator
  text:
    en: 'Mourning has fixed formal phrases — use them as they are: «Mein herzliches Beileid», «Ich bin in Gedanken bei Ihnen», «Er wird uns fehlen». Speak quietly and briefly; nobody expects more.'
    ar: 'للحداد عبارات رسمية ثابتة — استعملها كما هي: «Mein herzliches Beileid»، «Ich bin in Gedanken bei Ihnen»، «Er wird uns fehlen». تكلّم بهدوء وباختصار؛ لا أحد يتوقّع أكثر.'
    mk: 'Жалоста има фиксни формални фрази — користете ги такви какви што се: «Mein herzliches Beileid», «Ich bin in Gedanken bei Ihnen», «Er wird uns fehlen». Зборувајте тивко и кратко; никој не очекува
      повеќе.'
