- type: narrator
  text:
    en: 'German mourning is quiet and private: the burial is often for close family (''im engsten Kreis''), others attend the memorial service, send a card or flowers, or donate as the family asks. Dark,
      plain clothes; no long visits to the house. Muslim and Orthodox communities in Germany keep their own customs — ask the family what they wish.'
    ar: 'الحداد الألماني هادئ وخاص: الدفن غالبًا للعائلة المقرّبة («im engsten Kreis»)، والآخرون يحضرون مراسم التأبين، أو يرسلون بطاقة أو زهورًا، أو يتبرّعون كما تطلب العائلة. ملابس داكنة بسيطة؛ ولا زيارات
      طويلة للبيت. والجماعات المسلمة والأرثوذكسية في ألمانيا تحافظ على عاداتها — اسأل العائلة عمّا تريد.'
    mk: 'Германската жалост е тивка и приватна: погребот често е во најтесен круг („im engsten Kreis“), другите доаѓаат на комеморацијата, праќаат картичка или цвеќе, или донираат како што бара семејството.
      Темна, едноставна облека; без долги посети дома. Муслиманските и православните заедници во Германија ги чуваат своите обичаи — прашајте го семејството што сака.'
