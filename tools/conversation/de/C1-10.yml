steps:
- type: narrator
  text:
    en: Herr Fischer, the volunteer from the Tafel, has died. At the memorial service you speak to his daughter. Listen to the conversation; you don't need to understand it yet.
    ar: السيد فيشر، المتطوّع من بنك الطعام، توفّي. في مراسم التأبين تتحدّث إلى ابنته. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Господин Фишер, волонтерот од Tafel, почина. На комеморацијата зборувате со неговата ќерка. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Frau Fischer, mein herzliches Beileid.
    meaning:
      en: Mrs Fischer, my sincere condolences.
      ar: سيدة فيشر، أصدق التعازي.
      mk: Госпоѓо Фишер, искрено сочувство.
  - speaker: tochter
    text: Danke. Kannten Sie meinen Vater?
    meaning:
      en: Thank you. Did you know my father?
      ar: شكرًا. هل كنتَ تعرف والدي؟
      mk: Благодарам. Дали го познававте татко ми?
  - speaker: protagonist
    text: Von der Tafel. Er hat mich am Anfang zu jedem Termin begleitet.
    meaning:
      en: From the Tafel. At the beginning he went with me to every appointment.
      ar: من بنك الطعام. في البداية رافقني إلى كل موعد.
      mk: Од Tafel. На почетокот ме придружуваше на секој термин.
  - speaker: tochter
    text: Das sieht ihm ähnlich. Er hat viel von Ihnen erzählt.
    meaning:
      en: That's just like him. He talked about you a lot.
      ar: هذا يشبهه. لقد حدّثنا عنك كثيرًا.
      mk: Тоа е баш тој. Многу раскажуваше за вас.
  - speaker: protagonist
    text: Er wird uns sehr fehlen. Ich bin in Gedanken bei Ihnen und Ihrer Familie.
    meaning:
      en: We will miss him very much. My thoughts are with you and your family.
      ar: سنفتقده كثيرًا. أفكاري معكِ ومع عائلتكِ.
      mk: Многу ќе ни недостига. Во мислите сум со вас и вашето семејство.
  - speaker: tochter
    text: Die Beerdigung ist im engsten Kreis. Aber Sie dürfen gern später ans Grab kommen.
    meaning:
      en: The burial is for close family only. But you're welcome to visit the grave later.
      ar: الدفن يقتصر على العائلة المقرّبة. لكن مرحَّب بك أن تزور القبر لاحقًا.
      mk: Погребот е во најтесен круг. Но слободно дојдете подоцна на гробот.
  - speaker: protagonist
    text: Bei uns kommen alle zur Beerdigung, und man bleibt tagelang bei der Familie.
    meaning:
      en: With us everyone comes to the burial, and you stay with the family for days.
      ar: عندنا يأتي الجميع إلى الدفن، ويبقى الناس أيامًا مع العائلة.
      mk: Кај нас сите доаѓаат на погребот, и се седи со денови кај семејството.
  - speaker: tochter
    text: Hier ist es stiller. Aber eine Karte von Ihnen würde mich freuen.
    meaning:
      en: Here it's quieter. But a card from you would mean a lot to me.
      ar: هنا الأمر أهدأ. لكن بطاقة منك ستسعدني.
      mk: Тука е потивко. Но картичка од вас би ме израдувала.
- type: prompt
  ask:
    en: Offer condolences.
    ar: قدّم التعازي.
    mk: Изразете сочувство.
  answer:
    speaker: protagonist
    text: Mein herzliches Beileid.
  items:
  - das-beileid
- type: prompt
  ask:
    en: 'Say: the memorial service.'
    ar: 'قل: مراسم التأبين.'
    mk: 'Кажете: комеморацијата.'
  answer:
    speaker: protagonist
    text: Die Trauerfeier.
  items:
  - die-trauerfeier
- type: prompt
  ask:
    en: 'Say: we will miss him very much.'
    ar: 'قل: سنفتقده كثيرًا.'
    mk: 'Кажете: многу ќе ни недостига.'
  answer:
    speaker: protagonist
    text: Er wird uns sehr fehlen.
  items:
  - er-wird-fehlen
- type: prompt
  ask:
