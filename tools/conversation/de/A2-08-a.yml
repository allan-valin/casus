steps:
- type: narrator
  text:
    ar: أمسية أولياء الأمور في الحضانة. السيدة كروغر تتحدث عن احتفال الفوانيس. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
- type: dialogue
  lines:
  - speaker: kruger
    text: Willkommen zum Elternabend! Am Freitag ist das Laternenfest.
    meaning:
      ar: أهلًا بكم في أمسية أولياء الأمور! يوم الجمعة احتفال الفوانيس.
  - speaker: protagonist
    text: Was ist ein Laternenfest?
    meaning:
      ar: ما هو احتفال الفوانيس؟
  - speaker: kruger
    text: Die Kinder basteln Laternen, und wir gehen am Abend zusammen spazieren und singen.
    meaning:
      ar: يصنع الأطفال فوانيس، ونتمشى معًا في المساء ونغني.
  - speaker: protagonist
    text: Schön! Soll ich etwas mitbringen?
    meaning:
      ar: جميل! هل أحضر شيئًا معي؟
  - speaker: kruger
    text: Ja, hier ist die Liste. Jede Familie bringt etwas zu essen mit.
    meaning:
      ar: نعم، هذه القائمة. كل عائلة تحضر شيئًا من الطعام.
  - speaker: protagonist
    text: Ich bringe Gebäck mit. Und die Würstchen — sind sie ohne Schweinefleisch?
    meaning:
      ar: سأحضر معجنات. والنقانق — هل هي بلا لحم خنزير؟
  - speaker: kruger
    text: Gute Frage! Wir machen auch Würstchen aus Geflügel.
    meaning:
      ar: سؤال جيد! سنحضّر أيضًا نقانق من الدجاج.
  - speaker: protagonist
    text: Danke für die Einladung. Yara wird sich freuen.
    meaning:
      ar: شكرًا على الدعوة. يارا ستفرح.
