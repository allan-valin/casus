steps:
- type: narrator
  text:
    mk: Петар ви раскажува како неговата диплома од Скопје била признаена — и што работел дотогаш. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Petar, wie war das damals mit deinem Diplom?
    meaning:
      mk: Петре, како беше тогаш со твојата диплома?
  - speaker: petar
    text: Zuerst wurde alles übersetzt und beglaubigt. Dann wurde mein Diplom mit einem deutschen verglichen.
    meaning:
      mk: Прво сè беше преведено и заверено. Потоа мојата диплома беше споредена со германска.
  - speaker: protagonist
    text: Und es wurde anerkannt?
    meaning:
      mk: И беше признаена?
  - speaker: petar
    text: Ja, aber das dauerte. Zwei Jahre lang arbeitete ich im Lager.
    meaning:
      mk: Да, но траеше. Две години работев во магацин.
  - speaker: protagonist
    text: Ein Ingenieur im Lager!
    meaning:
      mk: Инженер во магацин!
  - speaker: petar
    text: Ich war überqualifiziert. Aber ich lernte dort Deutsch.
    meaning:
      mk: Бев преквалификуван. Но таму научив германски.
  - speaker: protagonist
    text: Und die erste Stelle als Ingenieur?
    meaning:
      mk: А првата работа како инженер?
  - speaker: petar
    text: Kam mit der Geduld. Und mit Anja, die meine Bewerbungen korrigiert hat.
    meaning:
      mk: Дојде со трпение. И со Ања, која ми ги поправаше пријавите.
  - speaker: protagonist
    text: Ich bin stolz auf dich, Sohn.
    meaning:
      mk: Горд сум на тебе, сине.
