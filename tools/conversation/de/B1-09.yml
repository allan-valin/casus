- type: narrator
  text:
    en: Germany lies in the middle of the Eurasian plate, so earthquakes are rare and weak. The Eifel's volcanoes last erupted about 11,000 years ago and left round crater lakes, the Maare. Syria and North
      Macedonia, by contrast, lie near plate boundaries.
    ar: تقع ألمانيا في وسط الصفيحة الأوراسية، لذا الزلازل فيها نادرة وضعيفة. وآخر ثوران لبراكين آيفل كان قبل نحو 11 ألف عام وترك بحيرات فوهة مستديرة. أما سوريا ومقدونيا الشمالية فتقعان قرب حدود الصفائح.
    mk: Германија лежи во средината на Евроазиската плоча, па земјотресите се ретки и слаби. Вулканите во Ајфел последен пат изригнале пред околу 11 000 години и оставиле тркалезни кратерски езера. Сирија
      и Северна Македонија, пак, лежат блиску до границите на плочите.
