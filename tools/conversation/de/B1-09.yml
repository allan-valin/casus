- type: prompt
  review: true
  ask:
    en: 'Say: “Would you like …? (informal) — and “No, thanks — and “means no — and “I didn''t know whether … — and “polite — and “honest(ly) — and “I was thirsty — and “the second time — and “Just say
      … — and “gladly, yes please — and “the yearly utilities statement — and “pay extra (afterwards) — and “the monthly advance payment — and “is calculated — and “the consumption — and “save energy —
      and “the solar panels — and “on the roof — and “is produced”.'
    ar: 'قولي: “هل تريد …؟ — و“لا، شكرًا — و“تعني لا — و“لم أكن أعرف إن كان … — و“مؤدب — و“بصراحة — و“كنت عطشانًا — و“في المرة الثانية — و“قل ببساطة … — و“بكل سرور — و“كشف التكاليف الإضافية السنوي — و“يدفع
      فرقًا — و“الدفعة الشهرية المسبقة — و“يُحسَب — و“الاستهلاك — و“يوفّر الطاقة — و“الألواح الشمسية — و“على السطح — و“يُنتَج”.'
    mk: 'Кажете: „Сакаш ли …?“ — и „Не, благодарам“ — и „значи не“ — и „Не знаев дали …“ — и „учтив“ — и „искрено“ — и „бев жеден“ — и „вториот пат“ — и „Само кажи …“ — и „со задоволство“ — и „годишната
      пресметка за режиски трошоци“ — и „доплаќа“ — и „месечната аконтација“ — и „се пресметува“ — и „потрошувачката“ — и „штеди енергија“ — и „сончевите панели“ — и „на покривот“ — и „се произведува“.'
