steps:
- type: narrator
  text:
    en: 'A geology evening at the VHS: are there volcanoes in Germany? Professor Hartmann says yes. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'أمسية جيولوجيا في الجامعة الشعبية: هل في ألمانيا براكين؟ البروفيسور هارتمان يقول نعم. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.'
    mk: 'Вечер по геологија на народниот универзитет: има ли вулкани во Германија? Професорот Хартман вели да. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: hartmann
    text: In der Eifel gibt es Vulkane. Sie sind ruhig — im Moment.
    meaning:
      en: There are volcanoes in the Eifel. They're quiet — for now.
      ar: في منطقة آيفل براكين. إنها هادئة — في الوقت الحالي.
      mk: Во Ајфел има вулкани. Мирни се — засега.
  - speaker: protagonist
    text: Wann brach der letzte Vulkan aus?
    meaning:
      en: When did the last volcano erupt?
      ar: متى ثار آخر بركان؟
      mk: Кога изригна последниот вулкан?
  - speaker: hartmann
    text: Vor langer Zeit, vor etwa elftausend Jahren. Dabei entstand ein Kratersee.
    meaning:
      en: A long time ago, about eleven thousand years ago. A crater lake formed then.
      ar: منذ زمن بعيد، قبل نحو أحد عشر ألف عام. وتكوّنت حينها بحيرة فوهة.
      mk: Одамна, пред околу единаесет илјади години. Тогаш настана кратерско езеро.
  - speaker: protagonist
    text: Und Erdbeben?
    meaning:
      en: And earthquakes?
      ar: والزلازل؟
      mk: А земјотреси?
  - speaker: hartmann
    text: Selten und klein. Deutschland liegt nicht am Rand einer Platte.
    meaning:
      en: Rare and small. Germany doesn't lie on the edge of a plate.
      ar: نادرة وصغيرة. ألمانيا لا تقع على حافة صفيحة.
      mk: Ретки и мали. Германија не лежи на работ на плоча.
  - speaker: protagonist
    text: Bei uns gibt es oft Erdbeben.
    meaning:
      en: Where I'm from there are often earthquakes.
      ar: عندنا تحدث الزلازل كثيرًا.
      mk: Кај нас често има земјотреси.
  - speaker: hartmann
    text: Ja, dort treffen sich Platten. Hier ist es ruhig.
    meaning:
      en: Yes, plates meet there. Here it's quiet.
      ar: نعم، هناك تلتقي الصفائح. هنا الوضع هادئ.
      mk: Да, таму се среќаваат плочи. Тука е мирно.
  - speaker: protagonist
    text: Dann schlafe ich hier ruhiger!
    meaning:
      en: Then I'll sleep more peacefully here!
      ar: إذن سأنام هنا براحة أكبر!
      mk: Тогаш тука ќе спијам помирно!
