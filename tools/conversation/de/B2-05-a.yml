steps:
- type: narrator
  text:
    ar: إقامتكِ مرتبطة ببطاقة زوجكِ الزرقاء. في دائرة الأجانب تسألين السيد شولتس عن إقامة خاصة بكِ — وعن الجنسية. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Mein Aufenthalt hängt am Familiennachzug. Kann ich einen eigenständigen Titel bekommen?
    meaning:
      ar: إقامتي مرتبطة بلمّ الشمل. هل يمكنني الحصول على إقامة مستقلة؟
  - speaker: schulz
    text: Ja, nach einigen Jahren Ehe in Deutschland. Die genauen Voraussetzungen erkläre ich Ihnen gern.
    meaning:
      ar: نعم، بعد بضع سنوات من الزواج في ألمانيا. يسعدني أن أشرح لكِ الشروط بالتفصيل.
  - speaker: protagonist
    text: Und die Niederlassungserlaubnis?
    meaning:
      ar: والإقامة الدائمة؟
  - speaker: schulz
    text: Mit gutem Deutsch und eigener Arbeit früher. Ihr Mann bekommt sie mit der Blauen Karte schneller.
    meaning:
      ar: مع ألمانية جيدة وعمل خاص بكِ في وقت أبكر. زوجكِ يحصل عليها أسرع مع البطاقة الزرقاء.
  - speaker: protagonist
    text: Ab wann ist die Einbürgerung möglich?
    meaning:
      ar: متى يصبح التجنّس ممكنًا؟
  - speaker: schulz
    text: Nach mehreren Jahren Aufenthalt, mit Einbürgerungstest. Die Regeln haben sich kürzlich geändert.
    meaning:
      ar: بعد عدة سنوات من الإقامة، مع اختبار التجنّس. القواعد تغيّرت مؤخرًا.
  - speaker: jonas
    text: Und? Was hat er gesagt?
    meaning:
      ar: وماذا؟ ماذا قال؟
  - speaker: protagonist
    text: Er sagt, es sei möglich. Ich müsse nur zuerst den Titel wechseln.
    meaning:
      ar: يقول إن ذلك ممكن. يجب عليّ فقط أن أغيّر الإقامة أولًا.
