steps:
- type: narrator
  text:
    en: A Monday evening at the Nikolaikirche. Frau Becker tells you what happened here in 1989. Listen to the conversation; you don't need to understand it yet.
    ar: مساء يوم اثنين عند كنيسة نيكولاي. السيدة بيكر تحكي لكِ ما حدث هنا عام 1989. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Понеделник навечер кај црквата Николаи. Госпоѓа Бекер ви раскажува што се случило тука во 1989. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: becker
    text: In dieser Kirche hat alles angefangen. Jeden Montag gab es ein Gebet für den Frieden.
    meaning:
      en: It all started in this church. Every Monday there was a prayer for peace.
      ar: في هذه الكنيسة بدأ كل شيء. كل يوم اثنين كانت هناك صلاة من أجل السلام.
      mk: Во оваа црква сѐ почна. Секој понеделник имаше молитва за мир.
  - speaker: protagonist
    text: Und dann?
    meaning:
      en: And then?
      ar: ثم ماذا؟
      mk: А потоа?
  - speaker: becker
    text: Dann kamen die Demonstrationen. Am 9. Oktober waren wir siebzigtausend.
    meaning:
      en: Then came the demonstrations. On 9 October we were seventy thousand.
      ar: ثم جاءت المظاهرات. في التاسع من أكتوبر كنا سبعين ألفًا.
      mk: Потоа дојдоа демонстрациите. На 9 октомври бевме седумдесет илјади.
  - speaker: protagonist
    text: Hatten Sie Angst?
    meaning:
      en: Were you afraid?
      ar: هل كنتِ خائفة؟
      mk: Дали се плашевте?
  - speaker: becker
    text: Ja, wir hatten Angst. Es gab viel Polizei. Aber alles blieb friedlich.
    meaning:
      en: Yes, we were afraid. There were lots of police. But everything stayed peaceful.
      ar: نعم، كنا خائفين. كانت هناك شرطة كثيرة. لكن كل شيء بقي سلميًا.
      mk: Да, се плашевме. Имаше многу полиција. Но сѐ остана мирно.
  - speaker: protagonist
    text: Was haben die Leute gerufen?
    meaning:
      en: What did people chant?
      ar: ماذا هتف الناس؟
      mk: Што викаа луѓето?
  - speaker: becker
    text: „Wir sind das Volk!“ Wir wollten Freiheit.
    meaning:
      en: '''We are the people!'' We wanted freedom.'
      ar: «نحن الشعب!» أردنا الحرية.
      mk: „Ние сме народот!“ Сакавме слобода.
  - speaker: protagonist
    text: Und einen Monat später fiel die Mauer.
    meaning:
      en: And a month later the Wall fell.
      ar: وبعد شهر سقط الجدار.
      mk: А еден месец подоцна падна ѕидот.
  - speaker: becker
    text: Genau. Ich war dabei. Ich vergesse das nie.
    meaning:
      en: Exactly. I was there. I'll never forget it.
      ar: بالضبط. كنت هناك. لن أنسى ذلك أبدًا.
      mk: Точно. Бев таму. Никогаш нема да го заборавам.
- type: narrator
  text:
    en: 'Stories and history use the simple past (Präteritum): «es gab» (there was), «kamen» (came), «blieb» (stayed), «fiel» (fell). In speech the Perfekt is more common, but «war», «hatte», «gab» are
      everywhere.'
    ar: 'القصص والتاريخ تستعمل الماضي البسيط: «es gab» (كان هناك)، «kamen» (جاؤوا)، «blieb» (بقي)، «fiel» (سقط). في الكلام اليومي الماضي المركب أكثر، لكن «war» و«hatte» و«gab» في كل مكان.'
    mk: 'Приказните и историјата користат просто минато (Präteritum): «es gab» (имаше), «kamen» (дојдоа), «blieb» (остана), «fiel» (падна). Во говор е почест перфектот, но «war», «hatte», «gab» се насекаде.'
