- type: narrator
  text:
    en: In autumn 1989 the Monday demonstrations in Leipzig grew week by week; on 9 October about 70,000 marched, and it stayed peaceful. On 9 November the Berlin Wall opened. Leipzig calls itself the 'city
      of the peaceful revolution'.
    ar: في خريف 1989 كبرت مظاهرات الاثنين في لايبزيغ أسبوعًا بعد أسبوع؛ في التاسع من أكتوبر سار نحو سبعين ألفًا وبقيت سلمية. وفي التاسع من نوفمبر فُتح جدار برلين. تسمّي لايبزيغ نفسها «مدينة الثورة السلمية».
    mk: Есента 1989 понеделнишните демонстрации во Лајпциг растеа од недела во недела; на 9 октомври марширале околу 70 000 и остана мирно. На 9 ноември се отвори Берлинскиот ѕид. Лајпциг се нарекува „град
      на мирната револуција“.
