steps:
- type: narrator
  text:
    en: A clear night at the Monument to the Battle of the Nations. Jonas brings a telescope. Listen to the conversation; you don't need to understand it yet.
    ar: ليلة صافية عند نصب معركة الأمم. يوناس يحضر تلسكوبًا. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Ведра ноќ кај Споменикот на битката на народите. Јонас носи телескоп. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: Schau mal! Der Himmel ist heute klar.
    meaning:
      en: Look! The sky is clear today.
      ar: انظر! السماء صافية اليوم.
      mk: Погледни! Небото е ведро денес.
  - speaker: protagonist
    text: So viele Sterne! In der Stadt sieht man sie nicht.
    meaning:
      en: So many stars! In the city you can't see them.
      ar: نجوم كثيرة جدًا! في المدينة لا تُرى.
      mk: Толку многу ѕвезди! Во градот не се гледаат.
  - speaker: jonas
    text: Und da, am Himmel — das ist kein Stern. Das ist ein Planet.
    meaning:
      en: And there, in the sky — that's not a star. That's a planet.
      ar: وهناك، في السماء — هذا ليس نجمًا. إنه كوكب.
      mk: А таму, на небото — тоа не е ѕвезда. Тоа е планета.
  - speaker: protagonist
    text: Welcher Planet?
    meaning:
      en: Which planet?
      ar: أيّ كوكب؟
      mk: Која планета?
  - speaker: jonas
    text: Jupiter. So hell!
    meaning:
      en: Jupiter. So bright!
      ar: المشتري. مضيء جدًا!
      mk: Јупитер. Толку светол!
  - speaker: protagonist
    text: Und der Mond ist auch schön.
    meaning:
      en: And the moon is lovely too.
      ar: والقمر جميل أيضًا.
      mk: И месечината е убава.
  - speaker: jonas
    text: Oben auf dem Turm ist es noch besser.
    meaning:
      en: Up on the tower it's even better.
      ar: فوق، على البرج، المنظر أجمل.
      mk: Горе на кулата е уште подобро.
  - speaker: protagonist
    text: Wunderschön. Zu Hause sehe ich andere Sterne.
    meaning:
      en: Beautiful. At home I see other stars.
      ar: رائع. في بلدي أرى نجومًا أخرى.
      mk: Прекрасно. Дома гледам други ѕвезди.
