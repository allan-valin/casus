steps:
- type: narrator
  text:
    en: The Ausländerbehörde. Herr Schulz checks your student visa before it runs out. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: schulz
    text: Ihr Visum läuft im März ab. Sie wollen verlängern?
    meaning:
      en: Your visa runs out in March. You want to extend it?
  - speaker: protagonist
    text: Ja, bitte. Ich bin zum Studieren hier.
    meaning:
      en: Yes, please. I'm here to study.
  - speaker: schulz
    text: Haben Sie die Immatrikulationsbescheinigung?
    meaning:
      en: Do you have the enrolment certificate?
  - speaker: protagonist
    text: Ja, ich habe alles mitgebracht.
    meaning:
      en: Yes, I've brought everything.
  - speaker: schulz
    text: Gut. Dann bekommen Sie einen Aufenthaltstitel für das Studium.
    meaning:
      en: Good. Then you'll get a residence permit for your studies.
  - speaker: protagonist
    text: Darf ich auch arbeiten?
    meaning:
      en: Am I allowed to work too?
  - speaker: schulz
    text: Ja, aber begrenzt. Die Regeln ändern sich — prüfen Sie es auf der Website.
    meaning:
      en: Yes, but limited. The rules change — check them on the website.
  - speaker: protagonist
    text: Und nach dem Studium?
    meaning:
      en: And after my studies?
  - speaker: schulz
    text: Dann gibt es einen Titel für die Jobsuche. Kommen Sie rechtzeitig vorher.
    meaning:
      en: Then there's a permit for job hunting. Come in good time beforehand.
