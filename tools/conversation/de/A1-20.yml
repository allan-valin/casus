- type: narrator
  text:
    en: Even friends plan days ahead; a spontaneous visit is rare. Once agreed, a time is kept — cancel early if you can't make it.
    ar: حتى الأصدقاء يخططون قبل أيام؛ والزيارة المفاجئة نادرة. وإذا اتُّفق على موعد فيُحترم — ألغِه مبكرًا إن لم تستطع.
    mk: Дури и пријателите се договараат неколку дена однапред; спонтана посета е ретка. Договореното време се почитува — откажете навреме ако не можете.
