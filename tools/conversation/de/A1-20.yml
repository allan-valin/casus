steps:
- type: narrator
  text:
    en: Jonas wants to meet up. Your week is full of appointments. Listen to the conversation; you don't need to understand it yet.
    ar: يوناس يريد أن يلتقي بك. أسبوعك مليء بالمواعيد. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Јонас сака да се видите. Неделата ви е полна со термини. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: Hast du diese Woche Zeit? Für ein Bier?
    meaning:
      en: Do you have time this week? For a beer?
      ar: هل عندك وقت هذا الأسبوع؟ لشرب شيء؟
      mk: Имаш ли време оваа недела? За едно пиво?
  - speaker: protagonist
    text: Am Montag habe ich keine Zeit. Da ist der Arzt.
    meaning:
      en: On Monday I have no time. That's the doctor.
      ar: يوم الاثنين ليس عندي وقت. عندي موعد مع الطبيب.
      mk: Во понеделник немам време. Тогаш е докторот.
  - speaker: jonas
    text: Und am Dienstag?
    meaning:
      en: And on Tuesday?
      ar: ويوم الثلاثاء؟
      mk: А во вторник?
  - speaker: protagonist
    text: Dienstag ist die Bank, Mittwoch das Amt.
    meaning:
      en: Tuesday is the bank, Wednesday the office.
      ar: الثلاثاء البنك، والأربعاء الدائرة.
      mk: Во вторник банката, во среда службата.
  - speaker: jonas
    text: Donnerstag? Freitag?
    meaning:
      en: Thursday? Friday?
      ar: الخميس؟ الجمعة؟
      mk: Четврток? Петок?
  - speaker: protagonist
    text: Am Donnerstag kann ich. Heute ist Montag, oder?
    meaning:
      en: On Thursday I can. Today is Monday, right?
      ar: يوم الخميس أستطيع. اليوم الاثنين، أليس كذلك؟
      mk: Во четврток можам. Денес е понеделник, нели?
  - speaker: jonas
    text: Nein, heute ist Dienstag! Morgen ist Mittwoch.
    meaning:
      en: No, today's Tuesday! Tomorrow is Wednesday.
      ar: لا، اليوم الثلاثاء! وغدًا الأربعاء.
      mk: Не, денес е вторник! Утре е среда.
  - speaker: protagonist
    text: Oh nein, die Bank! ... Passt dir Donnerstag um sieben?
    meaning:
      en: Oh no, the bank! ... Does Thursday at seven suit you?
      ar: يا للأسف، البنك! ... هل يناسبك الخميس في السابعة؟
      mk: О не, банката! ... Ти одговара ли четврток во седум?
  - speaker: jonas
    text: Abgemacht!
    meaning:
      en: Deal!
      ar: اتفقنا!
      mk: Договорено!
- type: prompt
  ask:
    en: 'Jonas asks: do you have time?'
    ar: 'يوناس يسأل: هل عندك وقت؟'
    mk: 'Јонас прашува: имаш ли време?'
  answer:
    speaker: protagonist
    text: Hast du Zeit?
