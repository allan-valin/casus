steps:
- type: narrator
  text:
    en: The January sales. A winter jacket, thirty per cent off — or is it? Listen to the conversation; you don't need to understand it yet.
    ar: تخفيضات يناير. سترة شتوية بخصم ثلاثين بالمئة — أو هكذا يبدو؟ استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Јануарски попусти. Зимска јакна, триесет проценти попуст — или не? Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Die Jacke ist reduziert? Dreißig Prozent Rabatt?
    meaning:
      en: The jacket is reduced? Thirty per cent off?
      ar: السترة مخفّضة؟ خصم ثلاثين بالمئة؟
      mk: Јакната е намалена? Триесет проценти попуст?
  - speaker: kasse
    text: Ja, der alte Preis war hundert Euro.
    meaning:
      en: Yes, the old price was a hundred euros.
      ar: نعم، السعر القديم كان مئة يورو.
      mk: Да, старата цена беше сто евра.
  - speaker: protagonist
    text: Dann ist der neue Preis siebzig Euro.
    meaning:
      en: Then the new price is seventy euros.
      ar: إذن السعر الجديد سبعون يورو.
      mk: Тогаш новата цена е седумдесет евра.
  - speaker: kasse
    text: Genau. An der Kasse bekommen Sie noch zehn Prozent.
    meaning:
      en: Exactly. At the till you get another ten per cent.
      ar: بالضبط. وعند الصندوق تحصلين على عشرة بالمئة إضافية.
      mk: Точно. На касата добивате уште десет проценти.
  - speaker: protagonist
    text: Zehn Prozent von siebzig — dreiundsechzig Euro. Stimmt das?
    meaning:
      en: Ten per cent of seventy — sixty-three euros. Is that right?
      ar: عشرة بالمئة من سبعين — ثلاثة وستون يورو. هل هذا صحيح؟
      mk: Десет проценти од седумдесет — шеесет и три евра. Точно ли е?
  - speaker: kasse
    text: Stimmt! Fast die Hälfte.
    meaning:
      en: Right! Almost half price.
      ar: صحيح! تقريبًا النصف.
      mk: Точно! Речиси половина.
  - speaker: protagonist
    text: Kann ich die Jacke umtauschen?
    meaning:
      en: Can I exchange the jacket?
      ar: هل يمكنني استبدال السترة؟
      mk: Може ли да ја заменам јакната?
  - speaker: kasse
    text: Innerhalb von zwei Wochen, mit dem Kassenbon.
    meaning:
      en: Within two weeks, with the receipt.
      ar: خلال أسبوعين، مع الإيصال.
      mk: Во рок од две недели, со сметката.
