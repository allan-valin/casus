- type: narrator
  text:
    en: 'Wichteln: everyone draws a name and buys a small, cheap present for that person in secret. Christmas parties at work, clubs and courses are friendly and short; you''re welcome whatever your religion.'
    ar: '«Wichteln»: كل واحد يسحب اسمًا ويشتري لصاحبه هدية صغيرة رخيصة سرًّا. حفلات عيد الميلاد في العمل والنوادي والدورات ودّية وقصيرة؛ وأنتِ مرحَّب بكِ أيًّا كان دينكِ.'
    mk: '«Wichteln»: секој влече име и тајно купува мал, евтин подарок за тоа лице. Божиќните забави на работа, во клубови и курсеви се пријатни и кратки; добредојдени сте без оглед на верата.'
