steps:
- type: narrator
  text:
    en: The evening course's Christmas party. Everyone brought a small present for Secret Santa — and Professor Hartmann gives a speech. Listen to the conversation; you don't need to understand it yet.
    ar: حفلة عيد الميلاد لدورة المساء. كل واحد أحضر هدية صغيرة لتبادل الهدايا السري — والبروفيسور هارتمان يلقي كلمة. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Божиќната забава на вечерниот курс. Секој донесе мал подарок за тајниот Дедо Мраз — а професорот Хартман држи говор. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: hartmann
    text: Liebe Teilnehmer des Kurses! Am Ende des Jahres möchte ich Danke sagen.
    meaning:
      en: Dear participants of the course! At the end of the year I'd like to say thank you.
      ar: أعزائي المشاركين في الدورة! في نهاية العام أودّ أن أقول شكرًا.
      mk: Драги учесници на курсот! На крајот на годината сакам да кажам благодарам.
  - speaker: hartmann
    text: Wegen Ihrer Arbeit ist Ihr Deutsch so viel besser.
    meaning:
      en: Because of your work your German is so much better.
      ar: بسبب عملكم أصبحت لغتكم الألمانية أفضل بكثير.
      mk: Поради вашата работа германскиот ви е многу подобар.
  - speaker: protagonist
    text: Danke! Und jetzt — das Wichteln?
    meaning:
      en: Thank you! And now — Secret Santa?
      ar: شكرًا! والآن — تبادل الهدايا السري؟
      mk: Благодарам! А сега — тајниот Дедо Мраз?
  - speaker: lena
    text: Ja! Jeder zieht einen Namen. Das Geschenk kostet höchstens zehn Euro.
    meaning:
      en: Yes! Everyone draws a name. The present costs ten euros at most.
      ar: نعم! كل واحد يسحب اسمًا. الهدية تكلّف عشرة يورو على الأكثر.
      mk: Да! Секој влече име. Подарокот чини најмногу десет евра.
  - speaker: protagonist
    text: Und wer hat mich gezogen?
    meaning:
      en: And who drew me?
      ar: ومن سحب اسمي؟
      mk: А кој ме извлече мене?
  - speaker: lena
    text: Das verrate ich nicht! Das ist das Geheimnis des Wichtelns.
    meaning:
      en: I won't give that away! That's the secret of Secret Santa.
      ar: لن أكشف ذلك! هذا سرّ تبادل الهدايا.
      mk: Тоа нема да го откријам! Тоа е тајната на играта.
  - speaker: protagonist
    text: Oh, ein Buch! Danke, wer auch immer du bist.
    meaning:
      en: Oh, a book! Thanks, whoever you are.
      ar: آه، كتاب! شكرًا، أيًّا كنت.
      mk: О, книга! Благодарам, кој и да си.
  - speaker: hartmann
    text: Frohe Weihnachten und einen guten Rutsch!
    meaning:
      en: Merry Christmas and a happy New Year!
      ar: عيد ميلاد مجيد وسنة جديدة سعيدة!
      mk: Среќен Божиќ и среќна Нова година!
- type: prompt
  ask:
    en: 'Say: the Christmas party.'
    ar: 'قولي: حفلة عيد الميلاد.'
    mk: 'Кажете: божиќната забава.'
  answer:
