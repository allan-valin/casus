- type: narrator
  text:
    en: 'The genitive says ''of'' in written and formal German: «die Teilnehmer des Kurses», «das Ende des Jahres». «wegen» (because of) takes it too: «wegen Ihrer Arbeit».'
    ar: 'حالة الإضافة تعني «لـ / من» في الألمانية المكتوبة والرسمية: «die Teilnehmer des Kurses»، «das Ende des Jahres». و«wegen» (بسبب) تأخذها أيضًا: «wegen Ihrer Arbeit».'
    mk: 'Генитивот кажува „на“ во писмениот и формалниот германски: «die Teilnehmer des Kurses», «das Ende des Jahres». И «wegen» (поради) го бара: «wegen Ihrer Arbeit».'
