- type: prompt
  ask:
    en: 'Ask: is that inappropriate?'
    ar: 'اسأل: هل هذا غير لائق؟'
    mk: 'Прашајте: дали е тоа несоодветно?'
  answer:
    speaker: protagonist
    text: Ist das unangemessen?
  items:
