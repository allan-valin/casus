- type: prompt
  ask:
    en: 'Say: that''s tact.'
    ar: 'قل: هذا هو الحسّ المرهف.'
    mk: 'Кажете: тоа е чувство за мерка.'
  answer:
    speaker: protagonist
    text: Das ist Fingerspitzengefühl.
  items:
  - das-fingerspitzengefuehl
- type: prompt
  ask:
    en: 'Say: the form of address.'
    ar: 'قل: صيغة المخاطبة.'
