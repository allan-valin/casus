steps:
- type: narrator
  text:
    en: Leon, the new intern, greets the boss with 'Hey, na, alles fit?' and writes emails in chat style. You take him aside — kindly. Listen to the conversation; you don't need to understand it yet.
    ar: ليون، المتدرّب الجديد، يحيّي المديرة بـ«هاي، كيف الحال؟» ويكتب الرسائل بأسلوب الدردشة. تأخذه جانبًا — بلطف. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Леон, новиот практикант, ја поздравува шефицата со „Еј, што има?“ и пишува мејлови во стил на чет. Го повлекувате настрана — љубезно. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Leon, darf ich dir einen Tipp geben? Nimm es nicht persönlich.
    meaning:
      en: Leon, may I give you a tip? Don't take it personally.
      ar: ليون، هل تسمح لي بنصيحة؟ لا تأخذ الأمر على محمل شخصي.
      mk: Леон, смеам ли да ти дадам совет? Не земај го лично.
  - speaker: leon
    text: Klar. Hab ich was verbockt?
    meaning:
      en: Sure. Did I mess something up?
      ar: طبعًا. هل أفسدتُ شيئًا؟
      mk: Секако. Дали нешто зезнав?
  - speaker: protagonist
    text: Im Team duzen wir uns. Aber Frau Schröder siezen wir — bis sie das Du anbietet.
    meaning:
      en: In the team we say du. But Frau Schröder we address as Sie — until she offers du.
      ar: في الفريق نتخاطب بـdu. لكن السيدة شرودر نخاطبها بـSie — حتى تعرض هي الـdu.
      mk: Во тимот си велиме du. Но на госпоѓа Шредер ѝ персираме — додека таа не понуди du.
  - speaker: leon
    text: Oh. Ich hab „Hey, na, alles fit?“ gesagt. Wie peinlich!
    meaning:
      en: Oh. I said 'Hey, all good?'. How embarrassing!
      ar: آه. قلتُ «هاي، كيف الحال؟». يا للإحراج!
      mk: О. Реков „Еј, што има?“. Колку непријатно!
  - speaker: protagonist
    text: 'Halb so schlimm. Und in E-Mails an Kunden: keine Smileys, nicht umgangssprachlich.'
    meaning:
      en: 'Not that bad. And in emails to clients: no smileys, nothing colloquial.'
      ar: 'ليس بهذا السوء. وفي الرسائل للزبائن: لا وجوه ضاحكة، ولا أسلوب عامّي.'
      mk: 'Не е толку страшно. А во мејлови до клиенти: без смајлиња, не разговорно.'
  - speaker: leon
    text: Ist „LG“ auch unangemessen?
    meaning:
      en: Is 'LG' (best wishes) inappropriate too?
      ar: وهل «LG» (أطيب التحيات اختصارًا) غير لائقة أيضًا؟
      mk: Дали и „LG“ (поздрав, кратенка) е несоодветно?
  - speaker: protagonist
    text: Für Kollegen okay, für Kunden „Mit freundlichen Grüßen“. Das ist Fingerspitzengefühl.
    meaning:
      en: Fine for colleagues; for clients 'Kind regards'. That's tact.
      ar: مقبولة للزملاء؛ وللزبائن «مع أطيب التحيات». هذا هو الحسّ المرهف.
      mk: За колегите во ред; за клиентите „Со почит“. Тоа е чувство за мерка.
  - speaker: leon
    text: Danke. Das hätte mir an der Uni keiner gesagt.
    meaning:
      en: Thanks. Nobody at uni would have told me that.
      ar: شكرًا. لم يكن أحد في الجامعة ليقول لي هذا.
      mk: Благодарам. Тоа никој на факултет немаше да ми го каже.
- type: prompt
  ask:
    en: 'Ask: may I give you a tip?'
    ar: 'اسأل: هل تسمح لي بنصيحة؟'
    mk: 'Прашајте: смеам ли да ти дадам совет?'
  answer:
    speaker: protagonist
    text: Darf ich dir einen Tipp geben?
  items:
  - darf-ich-dir-einen-tipp-geben
- type: prompt
  ask:
    en: 'Say: don''t take it personally.'
    ar: 'قل: لا تأخذ الأمر على محمل شخصي.'
    mk: 'Кажете: не земај го лично.'
  answer:
    speaker: protagonist
    text: Nimm es nicht persönlich.
  items:
  - nimm-es-nicht-persoenlich
- type: narrator
  text:
    en: 'Correcting someone''s register politely: ask permission («Darf ich dir einen Tipp geben?»), soften («Halb so schlimm»), give the rule plus an example. «du» in the team, «Sie» upwards until offered
      — and the written register stricter than the spoken.'
    ar: 'تصحيح أسلوب أحدهم بلطف: اطلب الإذن («Darf ich dir einen Tipp geben?»)، ولطّف («Halb so schlimm»)، وأعطِ القاعدة مع مثال. «du» داخل الفريق، و«Sie» لمن هو أعلى حتى يعرض الـdu — والأسلوب المكتوب أصرم
      من المنطوق.'
    mk: 'Учтиво поправање на нечиј регистар: побарајте дозвола («Darf ich dir einen Tipp geben?»), омекнете («Halb so schlimm»), дајте правило и пример. «du» во тимот, «Sie» нагоре додека не се понуди —
      а пишаниот регистар е построг од говорниот.'
- type: prompt
  ask:
    en: 'Say: in the team we say du.'
    ar: 'قل: في الفريق نتخاطب بـdu.'
    mk: 'Кажете: во тимот си велиме du.'
  answer:
    speaker: protagonist
    text: Im Team duzen wir uns.
  items:
  - im-team-duzen
- type: prompt
  ask:
    en: 'Say: we address the boss as Sie.'
    ar: 'قل: نخاطب المديرة بـSie.'
    mk: 'Кажете: на шефицата ѝ персираме.'
  answer:
    speaker: protagonist
    text: Die Chefin siezen wir.
  items:
  - die-chefin-siezen
- type: prompt
  ask:
    en: 'He says: how embarrassing!'
    ar: 'يقول: يا للإحراج!'
    mk: 'Тој вели: колку непријатно!'
  answer:
