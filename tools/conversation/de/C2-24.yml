  answer:
    speaker: protagonist
    text: Der Praktikant.
  items:
  - der-praktikant
- type: narrator
  text:
    en: 'Many teams — especially in start-ups — use du with everyone, but in more traditional firms and with clients Sie stays standard. When unsure, listen first and mirror. At C2 you can do what natives
      find hard: tell someone kindly that their register is off.'
    ar: 'كثير من الفرق — خاصة في الشركات الناشئة — تستعمل du مع الجميع، لكن في الشركات التقليدية ومع الزبائن تبقى Sie هي المعتادة. وحين تشكّ، استمع أولًا وقلّد. وفي مستوى C2 تستطيع ما يصعب على أهل اللغة:
      أن تخبر أحدًا بلطف أنّ أسلوبه غير مناسب.'
    mk: 'Многу тимови — особено во стартапи — користат du со сите, но во потрадиционални фирми и со клиенти Sie останува стандард. Кога не сте сигурни, прво слушајте и огледувајте. На C2 го можете она што
      и на родените им е тешко: љубезно да му кажете некому дека регистарот не му е соодветен.'
