- type: prompt
  ask:
    en: 'Say: that must surely be in the report.'
    ar: 'قل: لا بد أنّ ذلك مكتوب في المحضر.'
    mk: 'Кажете: тоа сигурно мора да пишува во записникот.'
  answer:
