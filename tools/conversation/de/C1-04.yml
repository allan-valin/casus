- type: narrator
  text:
    en: 'Modal verbs can show how sure you are, not what you must do: «dürfte» (probably), «soll» (is said to — hearsay), «muss wohl» (surely — strong conclusion). «Die Klausel dürfte unwirksam sein» =
      it''s probably void.'
    ar: 'الأفعال المساعدة قد تُظهر درجة يقينك لا ما يجب فعله: «dürfte» (يُرجَّح)، «soll» (يُقال — نقلًا)، «muss wohl» (لا بد — استنتاج قوي). «Die Klausel dürfte unwirksam sein» = يُرجَّح أنها باطلة.'
    mk: 'Модалните глаголи може да покажат колку сте сигурни, не што мора: «dürfte» (веројатно), «soll» (наводно — од слушање), «muss wohl» (сигурно — силен заклучок). «Die Klausel dürfte unwirksam sein»
      = веројатно е неважечка.'
- type: prompt
  ask:
    en: 'Say: this clause is probably invalid.'
    ar: 'قل: يُرجَّح أنّ هذا البند باطل.'
    mk: 'Кажете: оваа клаузула веројатно е неважечка.'
  answer:
    speaker: protagonist
    text: Diese Klausel dürfte unwirksam sein.
  items:
  - duerfte
  - unwirksam
- type: prompt
  ask:
    en: 'Say: the association is said to be clear.'
    ar: 'قل: يُقال إنّ الجمعية واضحة.'
    mk: 'Кажете: здружението наводно е јасно.'
  answer:
    speaker: protagonist
    text: Der Mieterverein soll klar sein.
  items:
