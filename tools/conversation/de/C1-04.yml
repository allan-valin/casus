steps:
- type: narrator
  text:
    en: You're moving out. The property management demands you repaint the whole flat — 'it's in the contract'. Jonas reads the clause. Listen to the conversation; you don't need to understand it yet.
    ar: ستغادر الشقة. إدارة العقار تطالبك بإعادة طلاء الشقة كلها — «إنه في العقد». يوناس يقرأ البند. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Се иселувате. Управата бара да го пребоите целиот стан — „така пишува во договорот“. Јонас ја чита клаузулата. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: verwaltung
    text: Laut Paragraf zwölf müssen Sie beim Auszug alle Räume streichen.
    meaning:
      en: According to clause twelve you have to paint all the rooms when you move out.
      ar: بحسب البند الثاني عشر يجب أن تطلي كل الغرف عند المغادرة.
      mk: Според член дванаесет мора да ги пребоите сите простории при иселување.
  - speaker: protagonist
    text: Alle? Ich habe nur drei Jahre hier gewohnt.
    meaning:
      en: All of them? I only lived here three years.
      ar: كلها؟ سكنتُ هنا ثلاث سنوات فقط.
      mk: Сите? Живеев тука само три години.
  - speaker: jonas
    text: Zeig mal den Vertrag. ... Diese Klausel dürfte unwirksam sein. Starre Fristen sind nicht erlaubt.
    meaning:
      en: Show me the contract. ... This clause is probably invalid. Rigid deadlines aren't allowed.
      ar: أرني العقد. ... يُرجَّح أنّ هذا البند باطل. المدد الجامدة غير مسموحة.
      mk: Покажи го договорот. ... Оваа клаузула веројатно е неважечка. Строги рокови не се дозволени.
  - speaker: protagonist
    text: Woher weißt du das?
    meaning:
      en: How do you know?
      ar: كيف تعرف ذلك؟
      mk: Од каде знаеш?
  - speaker: jonas
    text: Der Mieterverein soll da sehr klar sein. Und die Wohnung war beim Einzug unrenoviert, oder?
    meaning:
      en: The tenants' association is said to be very clear on it. And the flat was unrenovated when you moved in, right?
      ar: يُقال إنّ جمعية المستأجرين واضحة جدًا في ذلك. والشقة لم تكن مجدّدة عند انتقالك، أليس كذلك؟
      mk: Здружението на станари наводно е многу јасно за тоа. А станот беше нереновиран кога се всели, нели?
  - speaker: protagonist
    text: Ja, die Wände waren grau. Das muss wohl im Übergabeprotokoll stehen.
    meaning:
      en: Yes, the walls were grey. That must surely be in the handover report.
      ar: نعم، كانت الجدران رمادية. لا بد أنّ ذلك مكتوب في محضر التسليم.
      mk: Да, ѕидовите беа сиви. Тоа сигурно мора да пишува во записникот за предавање.
  - speaker: jonas
    text: Dann zahlst du nur für Schäden, nicht für normale Abnutzung.
    meaning:
      en: Then you only pay for damage, not for normal wear and tear.
      ar: إذن تدفع فقط عن الأضرار، لا عن الاستهلاك العادي.
      mk: Тогаш плаќаш само за штети, не за нормално абење.
  - speaker: protagonist
    text: Ich schreibe der Verwaltung — schriftlich, mit Frist.
    meaning:
      en: I'll write to the management — in writing, with a deadline.
      ar: سأكتب إلى الإدارة — كتابيًا، مع مهلة.
      mk: Ќе ѝ пишам на управата — писмено, со рок.
