    text: Die Wohnungsübergabe.
  items:
  - die-uebergabe-wohnung
- type: narrator
  text:
    en: 'Many standard clauses in tenancy agreements are void: rigid repainting deadlines, painting a flat that was unrenovated at move-in, fixed colours. Normal wear is your landlord''s cost. Keep the
      handover report and photos, and ask a tenants'' association before you pay. Student halls sometimes read ''no subletting'' as ''no guest may sleep over'' — ask what the rule really allows.'
    ar: 'كثير من البنود المعتادة في عقود الإيجار باطلة: مدد الطلاء الجامدة، وطلاء شقة لم تكن مجدّدة عند الانتقال، والألوان المفروضة. والاستهلاك العادي على المؤجِّر. احتفظ بمحضر التسليم والصور، واسأل جمعية
      مستأجرين قبل أن تدفع. والمساكن الطلابية أحيانًا تفسّر «ممنوع التأجير من الباطن» على أنها «ممنوع مبيت أي ضيف» — اسأل عمّا تسمح به القاعدة فعلًا.'
    mk: 'Многу стандардни клаузули во договорите за наем се неважечки: строги рокови за боење, боење на стан што бил нереновиран при вселување, наметнати бои. Нормалното абење е трошок на станодавецот.
      Чувајте го записникот и фотографиите и прашајте здружение на станари пред да платите.'
