steps:
- type: narrator
  text:
    en: Your first big shop. At the till, the cashier asks about bottles and bags. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: kasse
    text: Hallo! Brauchen Sie eine Tüte?
    meaning:
      en: Hi! Do you need a bag?
  - speaker: protagonist
    text: Ja, bitte. Ich nehme eine Tüte.
    meaning:
      en: Yes, please. I'll take a bag.
  - speaker: kasse
    text: Das macht zwölf Euro achtzig. Mit Karte oder bar?
    meaning:
      en: That comes to twelve euros eighty. Card or cash?
  - speaker: protagonist
    text: Mit Karte. ... Warum ist der Saft so teuer?
    meaning:
      en: By card. ... Why is the juice so expensive?
  - speaker: kasse
    text: Das ist das Pfand. Fünfundzwanzig Cent pro Flasche.
    meaning:
      en: That's the deposit. Twenty-five cents a bottle.
  - speaker: protagonist
    text: Pfand? Was ist das?
    meaning:
      en: Deposit? What's that?
  - speaker: kasse
    text: Sie bringen die Flaschen zurück, in den Automaten. Dann bekommen Sie das Geld zurück.
    meaning:
      en: You bring the bottles back, into the machine. Then you get the money back.
  - speaker: protagonist
    text: Ah! Wo ist der Automat?
    meaning:
      en: Ah! Where's the machine?
  - speaker: kasse
    text: Dort hinten, links. Hier ist Ihr Bon.
    meaning:
      en: Back there, on the left. Here's your receipt.
