steps:
- type: narrator
  text:
    en: The Volkshochschule, the adult evening school. You want to sign up for a German course. Listen to the conversation; you don't need to understand it yet.
    ar: الجامعة الشعبية (Volkshochschule)، مدرسة الكبار المسائية. تريدين التسجيل في دورة ألمانية. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Народниот универзитет (Volkshochschule), вечерно училиште за возрасни. Сакате да се запишете на курс по германски. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: hartmann
    text: Guten Abend. Was möchten Sie lernen?
    meaning:
      en: Good evening. What would you like to learn?
      ar: مساء الخير. ماذا تودّين أن تتعلّمي؟
      mk: Добровечер. Што сакате да учите?
  - speaker: protagonist
    text: Ich habe vor, mein Deutsch zu verbessern.
    meaning:
      en: I plan to improve my German.
      ar: أنوي أن أحسّن لغتي الألمانية.
      mk: Планирам да го подобрам германскиот.
  - speaker: hartmann
    text: Welches Niveau haben Sie?
    meaning:
      en: What level are you?
      ar: ما مستواكِ؟
      mk: Какво ниво имате?
  - speaker: protagonist
    text: A2, glaube ich. Es ist schwer, die Artikel zu lernen!
    meaning:
      en: A2, I think. It's hard to learn the articles!
      ar: A2، على ما أظن. من الصعب أن أتعلّم الأدوات!
      mk: A2, мислам. Тешко е да се научат членовите!
  - speaker: hartmann
    text: Dann machen Sie zuerst den Einstufungstest.
    meaning:
      en: Then take the placement test first.
      ar: إذن قومي أولًا باختبار تحديد المستوى.
      mk: Тогаш прво направете го тестот за ниво.
  - speaker: protagonist
    text: Wann ist der Kurs?
    meaning:
      en: When is the course?
      ar: متى الدورة؟
      mk: Кога е курсот?
  - speaker: hartmann
    text: Abends, zweimal pro Woche. Wir fangen im März an.
    meaning:
      en: In the evenings, twice a week. We start in March.
      ar: مساءً، مرتين في الأسبوع. نبدأ في مارس.
      mk: Навечер, двапати неделно. Почнуваме во март.
  - speaker: protagonist
    text: Und die Gebühr?
    meaning:
      en: And the fee?
      ar: والرسوم؟
      mk: А таксата?
  - speaker: hartmann
    text: Sie steht im Programmheft. Es gibt auch Ermäßigungen.
    meaning:
      en: It's in the programme booklet. There are also reductions.
      ar: مكتوبة في كتيّب البرنامج. وهناك تخفيضات أيضًا.
      mk: Пишува во програмата. Има и попусти.
