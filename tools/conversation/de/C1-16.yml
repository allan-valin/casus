steps:
- type: narrator
  text:
    en: For months you've slept badly and felt empty. Dr Wagner listens — and talks about therapy. Listen to the conversation; you don't need to understand it yet.
    ar: منذ أشهر تنام بشكل سيئ وتشعر بالفراغ. الدكتورة فاغنر تستمع — وتتحدّث عن العلاج النفسي. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Со месеци лошо спиете и се чувствувате празно. Д-р Вагнер слуша — и зборува за терапија. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Ich schlafe schlecht und fühle mich leer. Seit Monaten.
    meaning:
      en: I sleep badly and feel empty. For months.
      ar: أنام بشكل سيئ وأشعر بالفراغ. منذ أشهر.
      mk: Лошо спијам и се чувствувам празно. Со месеци.
  - speaker: wagner
    text: Das könnte eine Erschöpfung sein, vielleicht ein Burnout. Das muss nichts Schlimmes bedeuten, aber wir nehmen es ernst.
    meaning:
      en: That could be exhaustion, perhaps burnout. It doesn't have to mean anything bad, but we take it seriously.
      ar: قد يكون هذا إنهاكًا، ربما احتراقًا نفسيًا. ليس بالضرورة أن يعني شيئًا سيئًا، لكننا نأخذه بجدية.
      mk: Тоа би можело да е исцрпеност, можеби согорување. Не мора да значи нешто лошо, но го сфаќаме сериозно.
  - speaker: protagonist
    text: Bei uns spricht man darüber nicht. Ich schäme mich ein bisschen.
    meaning:
      en: Where I'm from people don't talk about it. I'm a bit ashamed.
      ar: عندنا لا يتحدّث الناس عن ذلك. أخجل قليلًا.
      mk: Кај нас за тоа не се зборува. Малку се срамам.
  - speaker: wagner
    text: Das müssen Sie nicht. Fast jeder Dritte hat einmal im Leben so etwas.
    meaning:
      en: You don't have to be. Almost one in three has something like this once in their life.
      ar: لا داعي لذلك. ما يقارب واحدًا من كل ثلاثة يمرّ بشيء كهذا مرة في حياته.
      mk: Не мора. Речиси секој трет еднаш во животот има нешто такво.
  - speaker: protagonist
    text: Und was kann ich tun?
    meaning:
      en: And what can I do?
      ar: وماذا يمكنني أن أفعل؟
      mk: А што можам да направам?
  - speaker: wagner
    text: Eine Psychotherapie. Ein Therapieplatz dürfte schwer zu finden sein — aber eine erste Sprechstunde geht schneller, auch über 116117.
    meaning:
      en: Psychotherapy. A place in therapy is likely to be hard to find — but a first consultation is quicker, also through 116117.
      ar: العلاج النفسي. يُرجَّح أن يكون العثور على مكان للعلاج صعبًا — لكن الاستشارة الأولى أسرع، عبر 116117 أيضًا.
      mk: Психотерапија. Место за терапија веројатно тешко ќе се најде — но првата консултација е побрза, и преку 116117.
  - speaker: protagonist
    text: Und die Arbeit?
    meaning:
      en: And work?
      ar: والعمل؟
      mk: А работата?
  - speaker: wagner
    text: Ich schreibe Sie erst einmal zwei Wochen krank. Ruhe ist jetzt Teil der Behandlung.
    meaning:
      en: I'll give you a sick note for two weeks first. Rest is now part of the treatment.
      ar: سأمنحك أولًا إجازة مرضية لأسبوعين. الراحة الآن جزء من العلاج.
      mk: Прво ќе ве ставам на боледување две недели. Одморот сега е дел од лекувањето.
- type: prompt
  ask:
    en: 'Say: I sleep badly and feel empty.'
    ar: 'قل: أنام بشكل سيئ وأشعر بالفراغ.'
    mk: 'Кажете: лошо спијам и се чувствувам празно.'
  answer:
    speaker: protagonist
    text: Ich schlafe schlecht und fühle mich leer.
  items:
  - schlecht-schlafen
- type: narrator
  text:
    en: 'Modals for careful judgements: «Das könnte ein Burnout sein» (could be), «Das muss nichts Schlimmes bedeuten» (doesn''t have to mean), «Ein Therapieplatz dürfte schwer zu finden sein» (is likely
      to be).'
