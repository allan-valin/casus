- type: narrator
  text:
    en: 'Psychotherapy is paid by public health insurance. You can book a first consultation (psychotherapeutische Sprechstunde) directly or via 116117; regular therapy places often have waiting lists,
      so ask several practices. In a crisis: 112, or the Telefonseelsorge (0800 111 0 111, free, day and night). Talking about mental health is increasingly normal here.'
    ar: 'العلاج النفسي يدفعه التأمين الصحي العام. يمكنك حجز استشارة أولى مباشرة أو عبر 116117؛ وأماكن العلاج المنتظم عليها غالبًا قوائم انتظار، فاسأل عدة عيادات. في الأزمة: 112، أو خط المساعدة الهاتفية
      (0800 111 0 111، مجاني، ليلًا ونهارًا). والحديث عن الصحة النفسية أصبح أمرًا عاديًا هنا أكثر فأكثر.'
    mk: 'Психотерапијата ја плаќа јавното здравствено осигурување. Прва консултација можете да закажете директно или преку 116117; за редовна терапија често има листи на чекање, па прашајте во повеќе ординации.
      Во криза: 112 или Telefonseelsorge (0800 111 0 111, бесплатно, дење и ноќе). Зборувањето за менталното здравје тука сè повеќе е нормално.'
