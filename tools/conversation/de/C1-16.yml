    mk: 'Модални глаголи за внимателни проценки: «Das könnte ein Burnout sein» (би можело), «Das muss nichts Schlimmes bedeuten» (не мора да значи), «Ein Therapieplatz dürfte schwer zu finden sein» (веројатно).'
