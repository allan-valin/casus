steps:
- type: narrator
  text:
    en: Jonas has lost his job. He sits on your balcony, silent. You listen — and help without taking over. Listen to the conversation; you don't need to understand it yet.
    ar: يوناس فقد عمله. يجلس على شرفتك صامتًا. تستمع — وتساعد دون أن تفرض نفسك. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Јонас ја изгуби работата. Седи на вашиот балкон, молчи. Слушате — и помагате без да преземете сè. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Du bist so still. Erzähl mal — was ist los?
    meaning:
      en: You're so quiet. Go on, tell me — what's up?
      ar: أنت صامت جدًا. هيا احكِ — ما الأمر؟
      mk: Толку си тивок. Ајде, раскажи — што е?
  - speaker: jonas
    text: Mir wurde gekündigt. Nach acht Jahren. Die Firma macht dicht.
    meaning:
      en: I've been let go. After eight years. The company's shutting down.
      ar: فُصلتُ من العمل. بعد ثماني سنوات. الشركة تُغلق.
      mk: Добив отказ. По осум години. Фирмата се затвора.
  - speaker: protagonist
    text: Das ist ja auch hart. Und mit Emma und Svenja...
    meaning:
      en: That really is hard. And with Emma and Svenja...
      ar: هذا صعب حقًا. ومع إيما وسفينيا...
      mk: Тоа навистина е тешко. А со Ема и Свења...
  - speaker: jonas
    text: Alle geben mir Ratschläge. Ich will gerade keine Ratschläge.
    meaning:
      en: Everyone gives me advice. I don't want advice right now.
      ar: الجميع يعطونني نصائح. لا أريد نصائح الآن.
      mk: Сите ми даваат совети. Сега не сакам совети.
  - speaker: protagonist
    text: Verstehe. Dann höre ich einfach zu. Ich bin für dich da.
    meaning:
      en: I understand. Then I'll just listen. I'm here for you.
      ar: أفهم. إذن سأصغي فقط. أنا هنا من أجلك.
      mk: Разбирам. Тогаш само ќе слушам. Тука сум за тебе.
  - speaker: jonas
    text: '... Danke. Das tut gut. Ich habe Angst, wieder ganz unten anzufangen.'
    meaning:
      en: '... Thanks. That helps. I''m afraid of starting at the bottom again.'
      ar: '... شكرًا. هذا يريحني. أخاف أن أبدأ من الصفر من جديد.'
      mk: '... Благодарам. Ова ми прија. Се плашам пак да почнам од најдолу.'
  - speaker: protagonist
    text: Das kenne ich. Weißt du noch? Ich habe im Café angefangen. Das wird schon.
    meaning:
      en: I know that feeling. Remember? I started in a café. It'll work out.
      ar: أعرف هذا الشعور. أتذكر؟ بدأتُ في مقهى. ستتحسّن الأمور.
      mk: Тоа го знам. Се сеќаваш? Јас почнав во кафуле. Ќе се среди.
  - speaker: jonas
    text: Du hast recht. Kopf hoch. Morgen gehe ich zur Agentur für Arbeit — heute nur Bier.
    meaning:
      en: You're right. Chin up. Tomorrow I'll go to the job agency — today just beer.
      ar: معك حق. ارفع رأسك. غدًا أذهب إلى وكالة العمل — واليوم البيرة فقط.
      mk: Во право си. Глава горе. Утре одам во агенцијата за вработување — денес само пиво.
- type: prompt
  ask:
    en: 'Say: go on, tell me.'
    ar: 'قل: هيا احكِ.'
    mk: 'Кажете: ајде, раскажи.'
  answer:
    speaker: protagonist
    text: Erzähl mal.
  items:
  - mal-eben
- type: prompt
  ask:
    en: 'He says: I''ve been let go.'
    ar: 'يقول: فُصلتُ من العمل.'
    mk: 'Тој вели: добив отказ.'
  answer:
