- type: narrator
  text:
    en: Now some things from earlier units, in this new situation.
    ar: والآن بعض ما تعلمتَه في الوحدات السابقة، في هذا الموقف الجديد.
    mk: Сега нешто од претходните лекции, во оваа нова ситуација.
- type: prompt
  review: true
  ask:
    en: 'Say: “the holiday house — and “the cost split — and “per head — and “the kitty — and “Wouldn''t it be fairer if …? — and “If we had …, it would be … — and “the expense app — and “settle up — and
      “the Baltic Sea — and “generous — and “play to a cliché — and “from my own experience — and “make distinctions — and “generalise — and “may I quote you? — and “the headline — and “diversity — and
      “I''d like to stress that … — and “the counter-question — and “approve the interview text”.'
    ar: 'قل: “بيت العطلة — و“تقسيم التكاليف — و“للفرد — و“الصندوق المشترك — و“أليس من الأعدل أن …؟ — و“لو كان لدينا …، لكان … — و“تطبيق المصاريف — و“يصفّي الحساب — و“بحر البلطيق — و“كريم — و“يكرّس الصورة
      النمطية — و“من تجربتي الخاصة — و“يميّز، يفصّل — و“يعمّم — و“هل يمكنني اقتباس كلامك؟ — و“العنوان الرئيسي — و“التنوّع — و“أودّ أن أؤكّد أنّ … — و“السؤال المضاد — و“يعتمد نصّ المقابلة”.'
    mk: 'Кажете: „куќата за одмор“ — и „поделбата на трошоците“ — и „по глава“ — и „заедничката каса“ — и „Зарем не би било поправедно ако …?“ — и „Да имавме …, ќе беше …“ — и „апликацијата за трошоци“
      — и „пресметува“ — и „Балтичкото Море“ — и „дарежливо“ — и „го потхранува клишето“ — и „од сопствено искуство“ — и „прави разлика“ — и „генерализира“ — и „смеам ли да ве цитирам?“ — и „насловот“ —
      и „разновидноста“ — и „Би сакала да нагласам дека …“ — и „противпрашањето“ — и „го одобрува интервјуто“.'
  answer:
