- type: narrator
  text:
    en: 'When someone is in crisis, listening often helps more than advice. Practical points come later: register with the Agentur für Arbeit within three days of learning about the dismissal, check the
      notice and any severance offer with a lawyer or union, and don''t sign a termination agreement in a hurry.'
    ar: 'حين يمرّ أحد بأزمة، الإصغاء غالبًا يساعد أكثر من النصيحة. والأمور العملية تأتي لاحقًا: التسجيل في وكالة العمل خلال ثلاثة أيام من العلم بالفصل، ومراجعة الإنذار وأي عرض تعويض مع محامٍ أو نقابة، وعدم
      التسرّع في توقيع اتفاق إنهاء.'
    mk: 'Кога некој е во криза, слушањето често помага повеќе од совет. Практичните работи доаѓаат подоцна: пријава во агенцијата за вработување во рок од три дена откако ќе се дознае за отказот, проверка
      на отказот и понудата за отпремнина со адвокат или синдикат, и без брзање со потпишување договор за раскинување.'
