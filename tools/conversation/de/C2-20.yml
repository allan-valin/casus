    text: Mir wurde gekündigt.
  items:
  - gekuendigt-werden
- type: narrator
  text:
    en: 'Particles of sympathy: «Erzähl mal» (mal — gentle invitation), «Das ist ja auch hart» (ja auch — ''of course it''s hard''), «Das wird schon» (schon — reassurance). They show feeling without big
      words.'
    ar: 'أدوات التعاطف: «Erzähl mal» (mal — دعوة لطيفة)، «Das ist ja auch hart» (ja auch — «طبعًا هذا صعب»)، «Das wird schon» (schon — طمأنة). تُظهر الشعور دون كلمات كبيرة.'
    mk: 'Честички на сочувство: «Erzähl mal» (mal — нежна покана), «Das ist ja auch hart» (ja auch — „се разбира дека е тешко“), «Das wird schon» (schon — уверување). Покажуваат чувство без големи зборови.'
