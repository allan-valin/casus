- type: narrator
  text:
    en: 'Since 2024 Germany allows dual citizenship. Naturalisation needs years of legal residence, your own income, German at B1, the naturalisation test — a fixed public pool of 300 general questions
      plus 10 for your federal state, practise them online — and a commitment to the constitution. A study permit at the time of applying is not enough. Periods and details change: check the current law.'
    ar: 'منذ 2024 تسمح ألمانيا بالجنسية المزدوجة. والتجنّس يحتاج سنوات من الإقامة القانونية، ودخلًا خاصًا، وألمانية B1، واختبار التجنّس — مجموعة علنية ثابتة من 300 سؤال عام و10 أسئلة لولايتك، تدرّب عليها
      عبر الإنترنت — والالتزام بالدستور. وإقامة الدراسة وقت تقديم الطلب لا تكفي. المدد والتفاصيل تتغيّر: تحقّق من القانون الحالي.'
