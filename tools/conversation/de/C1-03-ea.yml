steps:
- type: narrator
  text:
    en: You're thinking about German citizenship. At the naturalisation office an advisor explains — and afterwards you tell Tim what she said. Listen to the conversation; you don't need to understand it
      yet.
    ar: تفكّر في الجنسية الألمانية. في مكتب التجنيس تشرح مستشارة — وبعدها تحكي لتيم ما قالته. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Welche Voraussetzungen gelten für die Einbürgerung?
    meaning:
      en: What conditions apply for naturalisation?
      ar: ما الشروط المطلوبة للتجنّس؟
  - speaker: beraterin
    text: Mehrere Jahre Aufenthalt, eigenes Einkommen, Deutsch B1, der Einbürgerungstest und das Bekenntnis zur Grundordnung.
    meaning:
      en: Several years of residence, your own income, German B1, the naturalisation test and a commitment to the constitutional order.
      ar: عدة سنوات من الإقامة، ودخل خاص، وألمانية B1، واختبار التجنّس، والالتزام بالنظام الأساسي.
  - speaker: protagonist
    text: Werden meine Studienjahre angerechnet?
    meaning:
      en: Do my years of study count?
      ar: هل تُحتسب سنوات دراستي؟
  - speaker: beraterin
    text: Teilweise. Aber mit einem Aufenthalt zum Studium können Sie keinen Antrag stellen. Dafür brauchen Sie einen anderen Titel.
    meaning:
      en: Partly. But with a residence permit for study you can't apply. For that you need a different permit.
      ar: جزئيًا. لكن بإقامة دراسة لا يمكنك تقديم الطلب. لذلك تحتاج إلى إقامة أخرى.
  - speaker: protagonist
    text: Und muss ich meinen Pass abgeben?
    meaning:
      en: And do I have to give up my passport?
      ar: وهل يجب أن أتخلّى عن جوازي؟
  - speaker: beraterin
    text: Nein. Die doppelte Staatsangehörigkeit ist heute erlaubt.
    meaning:
      en: No. Dual citizenship is allowed today.
      ar: لا. الجنسية المزدوجة مسموحة اليوم.
  - speaker: tim
    text: Und? Was hat sie gesagt?
    meaning:
      en: So? What did she say?
      ar: وماذا؟ ماذا قالت؟
  - speaker: protagonist
    text: Sie sagte, man müsse B1 haben und den Test bestehen. Die doppelte Staatsangehörigkeit sei möglich.
    meaning:
      en: She said you have to have B1 and pass the test. Dual citizenship is possible.
      ar: قالت إنه يجب أن يكون لدى المرء B1 وأن ينجح في الاختبار. والجنسية المزدوجة ممكنة.
  - speaker: tim
    text: Und der Test?
    meaning:
      en: And the test?
      ar: والاختبار؟
  - speaker: protagonist
    text: 'Man habe einen festen Fragenkatalog: dreihundert allgemeine Fragen und zehn für das Bundesland.'
    meaning:
      en: 'There''s a fixed question pool: three hundred general questions and ten for the federal state.'
      ar: 'هناك مجموعة أسئلة ثابتة: ثلاثمئة سؤال عام وعشرة خاصة بالولاية.'
