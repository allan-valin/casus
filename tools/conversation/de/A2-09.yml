- type: narrator
  text:
    en: You choose your own electricity provider; without a contract you land in the more expensive basic supply. Note the meter reading on the day you move in. Prices change — compare before you sign,
      and again every year or two.
    ar: تختارين مزوّد الكهرباء بنفسكِ؛ وبلا عقد تقعين في التزويد الأساسي الأغلى. سجّلي قراءة العدّاد يوم السكن. الأسعار تتغير — قارني قبل التوقيع، ثم كل سنة أو سنتين.
    mk: Давателот на струја го избирате сами; без договор паѓате во поскапото основно снабдување. Запишете ја состојбата на броилото на денот на вселувањето. Цените се менуваат — споредете пред да потпишете,
      и пак на една-две години.
