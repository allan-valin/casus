steps:
- type: narrator
  text:
    en: 'A letter from the electricity company: you must choose a contract. Jonas reads it with you. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'رسالة من شركة الكهرباء: يجب أن تختاري عقدًا. يوناس يقرؤها معكِ. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.'
    mk: 'Писмо од електродистрибуцијата: мора да изберете договор. Јонас го чита со вас. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: Hier steht, dass ich einen Vertrag brauche. Für Strom.
    meaning:
      en: It says here that I need a contract. For electricity.
      ar: مكتوب هنا أنني أحتاج عقدًا. للكهرباء.
      mk: Тука пишува дека ми треба договор. За струја.
  - speaker: jonas
    text: Ja. Du kannst den Anbieter wählen.
    meaning:
      en: Yes. You can choose the provider.
      ar: نعم. يمكنكِ أن تختاري المزوّد.
      mk: Да. Можеш да го избереш давателот.
  - speaker: protagonist
    text: Welcher ist gut?
    meaning:
      en: Which one is good?
      ar: أيّهم جيد؟
      mk: Кој е добар?
  - speaker: jonas
    text: Ich glaube, dass man vergleichen muss. Im Internet.
    meaning:
      en: I think you have to compare. Online.
      ar: أظن أنه يجب المقارنة. على الإنترنت.
      mk: Мислам дека мора да се споредува. На интернет.
  - speaker: protagonist
    text: Und was brauche ich?
    meaning:
      en: And what do I need?
      ar: وماذا أحتاج؟
      mk: А што ми треба?
  - speaker: jonas
    text: Die Zählernummer. Der Zähler ist im Keller. Lies auch den Stand ab.
    meaning:
      en: The meter number. The meter is in the basement. Read the figure too.
      ar: رقم العدّاد. العدّاد في القبو. اقرئي القراءة أيضًا.
      mk: Бројот на броилото. Броилото е во подрумот. Отчитај ја и состојбата.
  - speaker: protagonist
    text: Kann ich später wechseln?
    meaning:
      en: Can I switch later?
      ar: هل يمكنني أن أغيّر لاحقًا؟
      mk: Може ли подоцна да сменам?
  - speaker: jonas
    text: Ja. Oft ist ein neuer Vertrag günstiger.
    meaning:
      en: Yes. A new contract is often cheaper.
      ar: نعم. غالبًا ما يكون العقد الجديد أرخص.
      mk: Да. Нов договор често е поевтин.
- type: narrator
  text:
    en: '«dass» (that) sends the verb to the end, like «weil»: «Hier steht, dass ich einen Vertrag brauche».'
    ar: '«dass» (أنّ) ترسل الفعل إلى آخر الجملة، مثل «weil»: «Hier steht, dass ich einen Vertrag brauche».'
    mk: '«dass» (дека) го праќа глаголот на крајот, како «weil»: «Hier steht, dass ich einen Vertrag brauche».'
- type: prompt
  ask:
    en: 'Say: it says that I need a contract.'
    ar: 'قولي: مكتوب أنني أحتاج عقدًا.'
    mk: 'Кажете: пишува дека ми треба договор.'
  answer:
    speaker: protagonist
    text: Hier steht, dass ich einen Vertrag brauche.
  items:
  - dass
  - der-vertrag
- type: prompt
