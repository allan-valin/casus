steps:
- type: narrator
  text:
    en: 'You want a used car. Paul comes along to the seller: the TÜV, the registration, the insurance. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'تريدين سيارة مستعملة. باول يرافقكِ إلى البائع: الفحص الفني، والتسجيل، والتأمين. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.'
    mk: 'Сакате половен автомобил. Паул доаѓа со вас кај продавачот: технички преглед, регистрација, осигурување. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: fahrer
    text: 'Gebrauchtwagen, zehn Jahre alt, unfallfrei. Kilometerstand: neunzigtausend.'
    meaning:
      en: 'Used car, ten years old, accident-free. Mileage: ninety thousand.'
      ar: 'سيارة مستعملة، عمرها عشر سنوات، خالية من الحوادث. عدد الكيلومترات: تسعون ألفًا.'
      mk: 'Половен автомобил, десет години стар, без незгоди. Километража: деведесет илјади.'
  - speaker: paul
    text: Und der TÜV? ... Der ist abgelaufen!
    meaning:
      en: And the TÜV? ... It's expired!
      ar: والفحص الفني؟ ... انتهت صلاحيته!
      mk: А техничкиот? ... Истечен е!
  - speaker: fahrer
    text: Der muss noch gemacht werden. Das wird diese Woche erledigt.
    meaning:
      en: That still has to be done. It'll be done this week.
      ar: يجب أن يُجرى بعد. سيُنجز هذا الأسبوع.
      mk: Тој уште мора да се направи. Ќе се заврши оваа недела.
  - speaker: protagonist
    text: Dann kaufe ich erst danach. Darf ich eine Probefahrt machen?
    meaning:
      en: Then I'll buy only afterwards. May I take a test drive?
      ar: إذن لن أشتري إلا بعد ذلك. هل يمكنني تجربة القيادة؟
      mk: Тогаш ќе купам дури потоа. Смеам ли пробно возење?
  - speaker: fahrer
    text: Natürlich. Der Wagen wurde regelmäßig gewartet. Alles steht im Serviceheft.
    meaning:
      en: Of course. The car was serviced regularly. It's all in the service book.
      ar: طبعًا. السيارة صِينت بانتظام. كل شيء مكتوب في دفتر الصيانة.
      mk: Се разбира. Колата редовно се сервисирала. Сè пишува во сервисната книшка.
  - speaker: paul
    text: 'Und dann: Kaufvertrag, Versicherung, Zulassung. Ohne Versicherung wird kein Auto zugelassen.'
    meaning:
      en: 'And then: purchase contract, insurance, registration. Without insurance no car gets registered.'
      ar: 'ثم: عقد البيع، التأمين، التسجيل. بلا تأمين لا تُسجَّل أي سيارة.'
      mk: 'А потоа: договор за купопродажба, осигурување, регистрација. Без осигурување ниту една кола не се регистрира.'
  - speaker: protagonist
    text: Und mein Führerschein? Er wurde in meiner Heimat ausgestellt.
    meaning:
      en: And my driving licence? It was issued in my home country.
      ar: ورخصة قيادتي؟ صدرت في بلدي.
      mk: А мојата возачка? Издадена е во мојата земја.
  - speaker: paul
    text: Der muss vielleicht umgeschrieben werden. Frag bei der Führerscheinstelle.
    meaning:
      en: It may have to be converted. Ask at the licence office.
      ar: ربما يجب تحويلها. اسألي في مكتب رخص القيادة.
      mk: Можеби мора да се замени. Прашај во канцеларијата за возачки.
- type: prompt
  ask:
    en: 'Say: a used car, accident-free.'
    ar: 'قولي: سيارة مستعملة، خالية من الحوادث.'
    mk: 'Кажете: половен автомобил, без незгоди.'
  answer:
    speaker: protagonist
    text: Ein Gebrauchtwagen, unfallfrei.
  items:
  - der-gebrauchtwagen
  - unfallfrei
- type: prompt
  ask:
    en: 'Say: the mileage.'
    ar: 'قولي: عدد الكيلومترات.'
    mk: 'Кажете: километражата.'
  answer:
    speaker: protagonist
    text: Der Kilometerstand.
  items:
  - der-kilometerstand
- type: prompt
  ask:
    en: 'Say: the TÜV has expired!'
    ar: 'قولي: الفحص الفني انتهت صلاحيته!'
    mk: 'Кажете: техничкиот е истечен!'
  answer:
    speaker: protagonist
    text: Der TÜV ist abgelaufen!
  items:
  - der-tuev
  - ist-abgelaufen
- type: narrator
  text:
    en: 'Passive forms at C1: «muss gemacht werden» (must be done), «wird erledigt» (is being done), «wurde gewartet» (was serviced), «ist abgelaufen» (state). Modal + participle + «werden» is common in
      rules: «Ohne Versicherung wird kein Auto zugelassen».'
    ar: 'صيغ المبني للمجهول في C1: «muss gemacht werden» (يجب أن يُجرى)، «wird erledigt» (يُنجز)، «wurde gewartet» (صِين)، «ist abgelaufen» (حالة). والفعل المساعد مع اسم المفعول و«werden» شائع في القواعد:
      «Ohne Versicherung wird kein Auto zugelassen».'
    mk: 'Пасивни форми на C1: «muss gemacht werden» (мора да се направи), «wird erledigt» (се завршува), «wurde gewartet» (се сервисирала), «ist abgelaufen» (состојба). Модален + партицип + «werden» е често
      во правилата: «Ohne Versicherung wird kein Auto zugelassen».'
- type: prompt
  ask:
    en: 'He says: it still has to be done.'
    ar: 'يقول: يجب أن يُجرى بعد.'
    mk: 'Тој вели: уште мора да се направи.'
  answer:
    speaker: protagonist
    text: Der muss noch gemacht werden.
  items:
  - muss-gemacht-werden
- type: prompt
  ask:
    en: 'Ask: may I take a test drive?'
    ar: 'اسألي: هل يمكنني تجربة القيادة؟'
    mk: 'Прашајте: смеам ли пробно возење?'
  answer:
    speaker: protagonist
    text: Darf ich eine Probefahrt machen?
  items:
  - die-probefahrt
- type: prompt
  ask:
    en: 'Say: the purchase contract.'
    ar: 'قولي: عقد البيع.'
    mk: 'Кажете: договорот за купопродажба.'
  answer:
    speaker: protagonist
    text: Der Kaufvertrag.
  items:
  - der-kaufvertrag
- type: prompt
  ask:
    en: 'Say: car insurance.'
    ar: 'قولي: تأمين السيارة.'
    mk: 'Кажете: автоосигурување.'
  answer:
    speaker: protagonist
    text: Die Kfz-Versicherung.
  items:
  - die-kfz-versicherung
- type: prompt
  ask:
    en: 'Say: without insurance no car gets registered.'
    ar: 'قولي: بلا تأمين لا تُسجَّل أي سيارة.'
    mk: 'Кажете: без осигурување ниту една кола не се регистрира.'
  answer:
    speaker: protagonist
    text: Ohne Versicherung wird kein Auto zugelassen.
  items:
  - die-zulassung
- type: narrator
  text:
    en: 'The TÜV inspection is due every two years; buy only with a valid one. Registration (Zulassung) needs proof of insurance first. Licences from outside the EU usually have to be converted within six
      months of moving here — some need a test. Rules depend on the country: ask the Führerscheinstelle.'
    ar: 'الفحص الفني (TÜV) مستحق كل سنتين؛ لا تشتري إلا بفحص ساري. والتسجيل يحتاج أولًا إثبات تأمين. ورخص القيادة من خارج الاتحاد الأوروبي يجب غالبًا تحويلها خلال ستة أشهر من الانتقال — وبعضها يحتاج اختبارًا.
      القواعد تتوقّف على البلد: اسألي مكتب رخص القيادة.'
    mk: 'Техничкиот преглед (TÜV) е на секои две години; купувајте само со важечки. За регистрација прво треба доказ за осигурување. Возачките дозволи од надвор од ЕУ обично мора да се заменат во рок од
      шест месеци по преселувањето — за некои треба испит. Правилата зависат од земјата: прашајте во Führerscheinstelle.'
