steps:
- type: narrator
  text:
    mk: Со мажот размислувате да се преселите во Лајпциг засекогаш. Петар објаснува што значи тоа за граѓани на ЕУ. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Petar, wenn wir ganz nach Leipzig ziehen — brauchen wir eine Erlaubnis?
    meaning:
      mk: Петре, ако се преселиме сосема во Лајпциг — ни треба ли дозвола?
  - speaker: petar
    text: Nein. Als EU-Bürger braucht ihr keine. Nach fünf Jahren ununterbrochenem Aufenthalt habt ihr ein Daueraufenthaltsrecht.
    meaning:
      mk: Не. Како граѓани на ЕУ не ви треба. По пет години престој без прекин имате право на постојан престој.
  - speaker: protagonist
    text: Und was müssen wir tun?
    meaning:
      mk: А што треба да направиме?
  - speaker: petar
    text: Den Wohnsitz anmelden. Der Lebensmittelpunkt muss hier sein, nicht in Bitola.
    meaning:
      mk: Да го пријавите живеалиштето. Центарот на животот мора да биде тука, не во Битола.
  - speaker: protagonist
    text: Und unsere Rente?
    meaning:
      mk: А нашата пензија?
  - speaker: petar
    text: Die Rentenzahlung ins Ausland ist möglich. Fragt beim Rentenfonds in Skopje nach.
    meaning:
      mk: Исплатата на пензија во странство е можна. Прашајте во Пензискиот фонд во Скопје.
  - speaker: protagonist
    text: Und die Krankenversicherung? Das ist meine größte Sorge.
    meaning:
      mk: А здравственото осигурување? Тоа е мојата најголема грижа.
  - speaker: petar
    text: Zu Recht. Das klären wir vor der Entscheidung — nicht danach.
    meaning:
      mk: Со право. Тоа ќе го разјасниме пред одлуката — не потоа.
