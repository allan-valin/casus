steps:
- type: narrator
  text:
    en: Your yearly feedback talk with Frau Schröder, your boss. She is friendly — and very direct. Listen to the conversation; you don't need to understand it yet.
    ar: حديث التقييم السنوي مع السيدة شرودر، مديرتكِ. إنها لطيفة — ومباشرة جدًا. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Годишниот разговор за оценка со госпоѓа Шредер, вашата шефица. Љубезна е — и многу директна. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: schroeder
    text: 'Fangen wir mit Ihren Stärken an: Zuverlässigkeit und Pünktlichkeit. Sehr gut.'
    meaning:
      en: 'Let''s start with your strengths: reliability and punctuality. Very good.'
      ar: 'لنبدأ بنقاط قوتكِ: الموثوقية والالتزام بالمواعيد. جيد جدًا.'
      mk: 'Да почнеме со вашите силни страни: доверливост и точност. Многу добро.'
  - speaker: protagonist
    text: Danke. Und die Schwächen?
    meaning:
      en: Thank you. And the weaknesses?
      ar: شكرًا. ونقاط الضعف؟
      mk: Благодарам. А слабите страни?
  - speaker: schroeder
    text: Die Kommunikation mit Kunden ist noch ausbaufähig. Sie sprechen zu leise.
    meaning:
      en: Communication with customers still has room for improvement. You speak too quietly.
      ar: التواصل مع الزبائن ما زال قابلًا للتحسين. تتكلّمين بصوت منخفض جدًا.
      mk: Комуникацијата со клиентите сè уште има простор за подобрување. Зборувате премногу тивко.
  - speaker: protagonist
    text: Oh... Das nehme ich mit.
    meaning:
      en: Oh... I'll take that on board.
      ar: آه... سآخذ ذلك بعين الاعتبار.
      mk: О... Ќе го земам предвид.
  - speaker: schroeder
    text: Das ist keine Kritik an Ihrer Person. Insgesamt bin ich sehr zufrieden mit Ihnen.
    meaning:
      en: It's not criticism of you as a person. Overall I'm very satisfied with you.
      ar: هذا ليس انتقادًا لشخصكِ. إجمالًا أنا راضية عنكِ جدًا.
      mk: Тоа не е критика на вашата личност. Генерално сум многу задоволна од вас.
  - speaker: protagonist
    text: Was ist mein Ziel für das nächste Jahr?
    meaning:
      en: What's my goal for next year?
      ar: ما هدفي للسنة القادمة؟
      mk: Која е мојата цел за следната година?
  - speaker: schroeder
    text: Die Verbesserung der Kommunikation. Ich schlage eine Weiterbildung vor.
    meaning:
      en: Improving communication. I suggest some further training.
      ar: تحسين التواصل. أقترح تدريبًا مستمرًا.
      mk: Подобрување на комуникацијата. Предлагам дообука.
  - speaker: protagonist
    text: Gern. Wird die Weiterbildung von der Firma bezahlt?
    meaning:
      en: Gladly. Is the training paid for by the company?
      ar: بكل سرور. هل تدفع الشركة ثمن التدريب؟
      mk: Со задоволство. Дали дообуката ја плаќа фирмата?
  - speaker: schroeder
    text: Selbstverständlich.
    meaning:
      en: Of course.
      ar: بالطبع.
      mk: Се разбира.
- type: prompt
  ask:
    en: 'Say: the feedback talk.'
    ar: 'قولي: حديث التقييم.'
    mk: 'Кажете: разговор за оценка.'
  answer:
    speaker: protagonist
    text: Das Feedbackgespräch.
  items:
  - das-feedbackgespraech
- type: narrator
  text:
    en: 'Work German loves nouns: «die Zuverlässigkeit» (from zuverlässig), «die Pünktlichkeit», «die Verbesserung der Kommunikation» (improving communication). -keit, -heit and -ung make nouns.'
    ar: 'ألمانية العمل تحب الأسماء: «die Zuverlässigkeit» (من zuverlässig)، «die Pünktlichkeit»، «die Verbesserung der Kommunikation» (تحسين التواصل). اللواحق -keit و-heit و-ung تصنع أسماء.'
    mk: 'Работниот германски сака именки: «die Zuverlässigkeit» (од zuverlässig), «die Pünktlichkeit», «die Verbesserung der Kommunikation» (подобрување на комуникацијата). -keit, -heit и -ung прават именки.'
- type: prompt
  ask:
    en: 'Say: my strengths are reliability and punctuality.'
    ar: 'قولي: نقاط قوتي الموثوقية والالتزام بالمواعيد.'
