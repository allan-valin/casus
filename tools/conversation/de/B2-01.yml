- type: narrator
  text:
    en: In a German feedback talk criticism is said plainly — «ausbaufähig», «zu leise» — and praise just as plainly. It's about the work, not you. Answer calmly («Das nehme ich mit») and ask for a concrete
      goal.
    ar: في حديث التقييم الألماني يُقال الانتقاد بوضوح — «ausbaufähig»، «zu leise» — والمديح بالوضوح نفسه. الأمر يتعلق بالعمل لا بكِ. أجيبي بهدوء («Das nehme ich mit») واطلبي هدفًا محددًا.
    mk: Во германски разговор за оценка критиката се кажува отворено — «ausbaufähig», «zu leise» — а и пофалбата исто така. Станува збор за работата, не за вас. Одговорете мирно («Das nehme ich mit») и
      побарајте конкретна цел.
