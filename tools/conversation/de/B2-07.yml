steps:
- type: narrator
  text:
    en: The monthly team meeting. Frau Schröder asks you to take the minutes. Listen to the conversation; you don't need to understand it yet.
    ar: اجتماع الفريق الشهري. السيدة شرودر تطلب منك كتابة المحضر. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Месечниот тимски состанок. Госпоѓа Шредер ве моли да водите записник. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: schroeder
    text: 'Wer führt heute Protokoll? ... Danke. Punkt eins der Tagesordnung: der neue Dienstplan.'
    meaning:
      en: 'Who''s taking the minutes today? ... Thank you. Item one on the agenda: the new rota.'
      ar: 'من يكتب المحضر اليوم؟ ... شكرًا. البند الأول من جدول الأعمال: جدول المناوبات الجديد.'
      mk: 'Кој води записник денес? ... Благодарам. Точка еден од дневниот ред: новиот распоред.'
  - speaker: tim
    text: Der Dienstplan muss bis Freitag entschieden werden.
    meaning:
      en: The rota has to be decided by Friday.
      ar: يجب أن يُقرَّر جدول المناوبات حتى الجمعة.
      mk: Распоредот мора да се одлучи до петок.
  - speaker: protagonist
    text: Kann die Entscheidung verschoben werden? Ich habe noch Fragen.
    meaning:
      en: Can the decision be postponed? I still have questions.
      ar: هل يمكن تأجيل القرار؟ ما زالت لديّ أسئلة.
      mk: Може ли одлуката да се одложи? Имам уште прашања.
  - speaker: schroeder
    text: Nein, wir müssen die Frist einhalten. Stellen Sie Ihre Fragen jetzt.
    meaning:
      en: No, we have to meet the deadline. Ask your questions now.
      ar: لا، يجب أن نلتزم بالمهلة. اطرح أسئلتك الآن.
      mk: Не, мора да го почитуваме рокот. Поставете ги прашањата сега.
  - speaker: protagonist
    text: Gut. Kann der Samstag fair verteilt werden?
    meaning:
      en: All right. Can Saturdays be shared out fairly?
      ar: حسنًا. هل يمكن توزيع أيام السبت بعدل؟
      mk: Добро. Може ли саботите праведно да се поделат?
  - speaker: schroeder
    text: 'Gute Frage. Wer übernimmt das? ... Tim. Punkt zwei, und zum Schluss: Verschiedenes.'
    meaning:
      en: 'Good question. Who''ll take that on? ... Tim. Item two, and finally: any other business.'
      ar: 'سؤال جيد. من يتولّى ذلك؟ ... تيم. البند الثاني، وفي الختام: متفرقات.'
      mk: 'Добро прашање. Кој го презема тоа? ... Тим. Точка два, и на крајот: разно.'
  - speaker: tim
    text: 'Unter Verschiedenes: Wer bringt nächstes Mal Kuchen?'
    meaning:
      en: 'Under any other business: who brings cake next time?'
      ar: 'تحت المتفرقات: من يحضر الكعك في المرة القادمة؟'
      mk: 'Под разно: кој носи колач следниот пат?'
  - speaker: protagonist
    text: Das schreibe ich ins Protokoll!
    meaning:
      en: I'll put that in the minutes!
      ar: سأكتب ذلك في المحضر!
      mk: Тоа ќе го запишам во записникот!
- type: prompt
  ask:
    en: 'Ask: who''s taking the minutes?'
    ar: 'اسأل: من يكتب المحضر؟'
    mk: 'Прашајте: кој води записник?'
  answer:
    speaker: protagonist
    text: Wer führt Protokoll?
  items:
  - protokoll-fuehren
  - das-protokoll
- type: prompt
  ask:
    en: 'Say: item one on the agenda.'
    ar: 'قل: البند الأول من جدول الأعمال.'
    mk: 'Кажете: точка еден од дневниот ред.'
  answer:
    speaker: protagonist
    text: Punkt eins der Tagesordnung.
  items:
  - die-tagesordnung
- type: prompt
  ask:
    en: 'Say: the agenda item.'
    ar: 'قل: بند جدول الأعمال.'
    mk: 'Кажете: точката од дневниот ред.'
  answer:
    speaker: protagonist
    text: Der Tagesordnungspunkt.
  items:
  - der-punkt
- type: narrator
  text:
    en: 'Passive with a modal, again: «muss entschieden werden» (must be decided), «kann verschoben werden» (can be postponed), «kann verteilt werden» (can be shared out).'
    ar: 'المبني للمجهول مع فعل مساعد مرة أخرى: «muss entschieden werden» (يجب أن يُقرَّر)، «kann verschoben werden» (يمكن أن يُؤجَّل)، «kann verteilt werden» (يمكن أن يُوزَّع).'
    mk: 'Пасив со модален глагол, пак: «muss entschieden werden» (мора да се одлучи), «kann verschoben werden» (може да се одложи), «kann verteilt werden» (може да се подели).'
- type: prompt
  ask:
    en: 'Say: it must be decided by Friday.'
    ar: 'قل: يجب أن يُقرَّر حتى الجمعة.'
    mk: 'Кажете: мора да се одлучи до петок.'
  answer:
    speaker: protagonist
    text: Es muss bis Freitag entschieden werden.
  items:
  - muss-entschieden-werden
- type: prompt
  ask:
    en: 'Ask: can the decision be postponed?'
    ar: 'اسأل: هل يمكن تأجيل القرار؟'
    mk: 'Прашајте: може ли одлуката да се одложи?'
  answer:
    speaker: protagonist
    text: Kann die Entscheidung verschoben werden?
  items:
  - kann-verschoben-werden
- type: prompt
  ask:
    en: 'She says: we have to meet the deadline.'
    ar: 'تقول: يجب أن نلتزم بالمهلة.'
    mk: 'Таа вели: мора да го почитуваме рокот.'
  answer:
    speaker: protagonist
    text: Wir müssen die Frist einhalten.
  items:
  - die-frist-einhalten
- type: prompt
  ask:
    en: 'She asks: who''ll take that on?'
    ar: 'تسأل: من يتولّى ذلك؟'
    mk: 'Таа прашува: кој го презема тоа?'
  answer:
    speaker: protagonist
    text: Wer übernimmt das?
  items:
  - wer-uebernimmt
- type: prompt
  ask:
    en: 'Say: and finally: any other business.'
    ar: 'قل: وفي الختام: متفرقات.'
    mk: 'Кажете: и на крајот: разно.'
  answer:
    speaker: protagonist
    text: 'Und zum Schluss: Verschiedenes.'
  items:
  - zum-schluss
  - verschiedenes
- type: narrator
  text:
    en: German meetings follow the agenda, start and end on time, and someone writes minutes that everyone receives. Questions belong in the meeting, not afterwards in the corridor; 'Verschiedenes' at the
      end is for anything else.
    ar: الاجتماعات الألمانية تتبع جدول الأعمال، وتبدأ وتنتهي في موعدها، ويكتب أحدهم محضرًا يصل إلى الجميع. الأسئلة مكانها في الاجتماع لا بعده في الممر؛ و«Verschiedenes» في النهاية لأي شيء آخر.
    mk: Германските состаноци го следат дневниот ред, почнуваат и завршуваат на време, а некој води записник што го добиваат сите. Прашањата се поставуваат на состанокот, не потоа во ходникот; „Verschiedenes“
      на крајот е за сè друго.
- type: prompt
