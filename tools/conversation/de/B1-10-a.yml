steps:
- type: narrator
  text:
    ar: شركتك تعيد الهيكلة. جارك يوناس يشرح ما يحدث لو فقدت العمل. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Die Firma baut Stellen ab. Ich mache mir Sorgen.
    meaning:
      ar: الشركة تلغي وظائف. أنا قلق.
  - speaker: jonas
    text: Keine Panik! Du hast in die Arbeitslosenversicherung eingezahlt.
    meaning:
      ar: لا داعي للذعر! لقد دفعت اشتراكات تأمين البطالة.
  - speaker: protagonist
    text: Dann bekomme ich Arbeitslosengeld?
    meaning:
      ar: إذن أحصل على إعانة البطالة؟
  - speaker: jonas
    text: Ja, für eine bestimmte Zeit. Melde dich sofort bei der Agentur für Arbeit.
    meaning:
      ar: نعم، لمدة محددة. سجّل نفسك فورًا في وكالة العمل.
  - speaker: protagonist
    text: Und meine Blaue Karte? Obwohl ich keinen Job habe?
    meaning:
      ar: وبطاقتي الزرقاء؟ مع أنه لن يكون عندي عمل؟
  - speaker: jonas
    text: Du musst die Ausländerbehörde informieren. Dann hast du Zeit, einen neuen Job zu suchen.
    meaning:
      ar: يجب أن تُبلغ دائرة الأجانب. ثم يكون لديك وقت للبحث عن عمل جديد.
  - speaker: protagonist
    text: Wie lange?
    meaning:
      ar: كم من الوقت؟
  - speaker: jonas
    text: Das weiß ich nicht genau. Frag die Behörde — die Regeln ändern sich.
    meaning:
      ar: لا أعرف بالضبط. اسأل الدائرة — القواعد تتغيّر.
