steps:
- type: narrator
  text:
    en: The club's last match of the season. Win and you go up a league; lose and the rivals go down. Petra does the maths. Listen to the conversation; you don't need to understand it yet.
    ar: المباراة الأخيرة للنادي في الموسم. الفوز يعني الصعود؛ والخسارة تعني هبوط المنافسين. بيترا تحسب. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Последниот натпревар на клубот во сезоната. Победа значи искачување; пораз — соперниците испаѓаат. Петра пресметува. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: petra
    text: Wir sind auf dem zweiten Platz. Ein Unentschieden könnte für den Aufstieg reichen.
    meaning:
      en: We're in second place. A draw could be enough for promotion.
      ar: نحن في المركز الثاني. التعادل قد يكفي للصعود.
      mk: На второ место сме. Нерешено би можело да биде доволно за искачување.
  - speaker: protagonist
    text: Und wenn wir verlieren?
    meaning:
      en: And if we lose?
      ar: وإذا خسرنا؟
      mk: А ако изгубиме?
  - speaker: petra
    text: Dann müsste der Dritte hoch gewinnen. Das dürfte schwer werden — sein Torverhältnis ist schlecht.
    meaning:
      en: Then third place would have to win big. That should be hard — their goal difference is bad.
      ar: عندها يجب أن يفوز صاحب المركز الثالث بفارق كبير. يُرجَّح أن يكون ذلك صعبًا — فارق أهدافه سيئ.
      mk: Тогаш третиот би морал да победи високо. Тоа веројатно ќе биде тешко — гол-разликата им е лоша.
  - speaker: protagonist
    text: Und der Gegner heute?
    meaning:
      en: And today's opponent?
      ar: والخصم اليوم؟
      mk: А денешниот противник?
  - speaker: petra
    text: Der steht vor dem Abstieg. Die werden kämpfen wie Löwen.
    meaning:
      en: They're facing relegation. They'll fight like lions.
      ar: إنه مهدَّد بالهبوط. سيقاتلون كالأسود.
      mk: Тие се пред испаѓање. Ќе се борат како лавови.
  - speaker: protagonist
    text: Das kann ich verstehen. Laut Tabelle könnte alles passieren.
    meaning:
      en: I can understand that. According to the table anything could happen.
      ar: أفهم ذلك. بحسب الجدول قد يحدث أي شيء.
      mk: Тоа го разбирам. Според табелата сè би можело да се случи.
  - speaker: petra
    text: '... Abpfiff! Eins zu eins! Wir steigen auf!'
    meaning:
      en: '... Final whistle! One-all! We''re promoted!'
      ar: '... صافرة النهاية! واحد لواحد! صعدنا!'
      mk: '... Последен свиреж! Еден спрема еден! Се искачуваме!'
  - speaker: protagonist
    text: Was für ein Jubel! Das müsste man filmen!
    meaning:
      en: What cheering! Someone should film this!
      ar: يا له من هتاف! يجب أن يصوّر أحد هذا!
      mk: Каква веселба! Ова би требало да се снима!
- type: prompt
  ask:
    en: 'Say: we''re in second place.'
    ar: 'قل: نحن في المركز الثاني.'
    mk: 'Кажете: на второ место сме.'
  answer:
    speaker: protagonist
    text: Wir sind auf dem zweiten Platz.
  items:
  - der-tabellenplatz
- type: narrator
  text:
    en: 'Konjunktiv II of modals for estimates: «könnte reichen» (could be enough), «müsste gewinnen» (would have to win), «dürfte schwer werden» (should be hard — likely). Sports talk is full of them.'
    ar: 'صيغة التمني للأفعال المساعدة للتقديرات: «könnte reichen» (قد يكفي)، «müsste gewinnen» (يجب أن يفوز افتراضًا)، «dürfte schwer werden» (يُرجَّح أن يكون صعبًا). كلام الرياضة مليء بها.'
    mk: 'Konjunktiv II на модалните за проценки: «könnte reichen» (би можело да е доволно), «müsste gewinnen» (би морал да победи), «dürfte schwer werden» (веројатно ќе биде тешко). Спортскиот говор е полн
      со нив.'
