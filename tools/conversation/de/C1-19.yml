steps:
- type: narrator
  text:
    en: You've rented an allotment garden. Herr Krause's hedge next door blocks all your sun. Talking hasn't helped — now a mediator comes. Listen to the conversation; you don't need to understand it yet.
    ar: استأجرتِ حديقة صغيرة. سياج السيد كراوزه المجاور يحجب الشمس كلها. الحديث لم ينفع — الآن يأتي وسيط. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Изнајмивте мала градина. Живата ограда на господин Краузе до вас ви го зема целото сонце. Разговорот не помогна — сега доаѓа помирувач. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: krause
    text: Die Hecke steht seit dreißig Jahren. Die schneide ich nicht!
    meaning:
      en: The hedge has stood for thirty years. I'm not cutting it!
      ar: السياج قائم منذ ثلاثين عامًا. لن أقلّمه!
      mk: Оградата стои триесет години. Нема да ја сечам!
  - speaker: protagonist
    text: Wenngleich sie schön ist — sie ist fast drei Meter hoch. Meine Tomaten bekommen keine Sonne.
    meaning:
      en: Even though it's beautiful — it's almost three metres high. My tomatoes get no sun.
      ar: وإن كان جميلًا — فارتفاعه نحو ثلاثة أمتار. طماطمي لا تحصل على شمس.
      mk: Иако е убава — висока е речиси три метри. Моите домати не добиваат сонце.
  - speaker: beraterin
    text: Ich bin die Schiedsperson. Laut Gartenordnung sind Hecken an der Grenze höchstens ein Meter fünfundzwanzig hoch.
    meaning:
      en: I'm the mediator. According to the garden rules, hedges at the boundary are at most one metre twenty-five.
      ar: أنا الوسيطة. بحسب نظام الحدائق لا يزيد ارتفاع السياج على الحدود عن متر وخمسة وعشرين سنتيمترًا.
      mk: Јас сум помирувачот. Според правилникот, оградите на границата се највисоко еден метар и дваесет и пет.
  - speaker: krause
    text: Selbst wenn — die Vögel nisten darin!
    meaning:
      en: Even so — the birds nest in it!
      ar: حتى لو — الطيور تعشّش فيه!
      mk: Дури и да е така — птиците гнездат во неа!
  - speaker: beraterin
    text: Das stimmt. Deshalb darf man erst ab Oktober zurückschneiden. Wäre das eine Einigung?
    meaning:
      en: That's true. That's why cutting back is only allowed from October. Would that be an agreement?
      ar: صحيح. لذلك لا يجوز التقليم إلا ابتداءً من أكتوبر. هل هذا اتفاق؟
      mk: Точно. Затоа смее да се поткаструва дури од октомври. Дали тоа би била спогодба?
  - speaker: protagonist
    text: Für mich ja. Ich helfe sogar beim Schneiden.
    meaning:
      en: For me, yes. I'll even help with the cutting.
      ar: بالنسبة لي نعم. بل سأساعد في التقليم.
      mk: За мене да. Дури ќе помогнам во сечењето.
  - speaker: krause
    text: Na gut. Im Oktober. Aber nur auf meinem Grundstück fasse ich selbst an.
    meaning:
      en: All right. In October. But on my own plot I'll do it myself.
      ar: حسنًا. في أكتوبر. لكن في أرضي أقوم بذلك بنفسي.
      mk: Добро. Во октомври. Но на мојата парцела сам ќе работам.
  - speaker: beraterin
    text: Dann schreibe ich die Einigung auf. Ganz ohne Gericht.
    meaning:
      en: Then I'll write the agreement down. Without any court.
      ar: إذن أكتب الاتفاق. دون أي محكمة.
      mk: Тогаш ќе ја запишам спогодбата. Сосема без суд.
