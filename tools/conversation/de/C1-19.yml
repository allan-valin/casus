- type: narrator
  text:
    en: 'Formal concessive connectors: «wenngleich» (even though — verb at the end), «selbst wenn» (even if). They admit the other''s point before your own: «Wenngleich sie schön ist, …».'
    ar: 'أدوات التسليم الرسمية: «wenngleich» (وإن كان — الفعل في الآخر)، «selbst wenn» (حتى لو). تقرّ بنقطة الآخر قبل نقطتكِ: «Wenngleich sie schön ist, …».'
    mk: 'Формални допусни сврзници: «wenngleich» (иако — глаголот на крајот), «selbst wenn» (дури и ако). Ја признаваат поентата на другиот пред вашата: «Wenngleich sie schön ist, …».'
