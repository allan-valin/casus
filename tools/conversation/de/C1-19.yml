  - die-schlichtung
- type: narrator
  text:
    en: 'Allotment gardens (Kleingärten) were invented in Leipzig and come with strict rules: hedge heights, a share of vegetables, quiet hours. Neighbour disputes go first to a local mediator (Schiedsperson)
      — in many states that''s required before you may sue. Hedges may only be cut back hard from October to February, to protect nesting birds.'
    ar: 'الحدائق الصغيرة (Kleingärten) اختُرعت في لايبزيغ وتأتي بقواعد صارمة: ارتفاع السياج، ونسبة للخضروات، وساعات هدوء. وخلافات الجيران تذهب أولًا إلى وسيط محلي (Schiedsperson) — وفي ولايات كثيرة هذا
      إلزامي قبل رفع دعوى. ولا يجوز التقليم الجذري للسياج إلا من أكتوبر إلى فبراير، حمايةً للطيور المعشّشة.'
    mk: 'Малите градини (Kleingärten) се измислени во Лајпциг и имаат строги правила: висина на оградите, дел за зеленчук, часови на тишина. Соседските спорови прво одат кај локален помирувач (Schiedsperson)
      — во многу покраини тоа е задолжително пред тужба. Оградите смеат силно да се поткаструваат само од октомври до февруари, за заштита на птиците.'
