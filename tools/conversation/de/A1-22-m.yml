steps:
- type: narrator
  text:
    mk: Градинката се затвора во четири и пол. Пристигнувате во пет помалку петнаесет. Госпоѓа Кригер чека со Лука. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Entschuldigung! Bin ich zu spät?
    meaning:
      mk: Извинете! Дали доцнам?
  - speaker: kruger
    text: Ja. Wir schließen um halb fünf. Jetzt ist es Viertel vor fünf.
    meaning:
      mk: Да. Затвораме во четири и пол. Сега е пет помалку петнаесет.
  - speaker: protagonist
    text: Es tut mir leid. Die Straßenbahn hatte Verspätung.
    meaning:
      mk: Жал ми е. Трамвајот доцнеше.
  - speaker: kruger
    text: Das kann passieren. Aber bitte rufen Sie an.
    meaning:
      mk: Може да се случи. Но ве молам јавете се.
  - speaker: protagonist
    text: Wie spät kann ich kommen?
    meaning:
      mk: До колку часот можам да дојдам?
  - speaker: kruger
    text: Bis halb fünf. Pünktlich, bitte.
    meaning:
      mk: До четири и пол. Точно, ве молам.
  - speaker: protagonist
    text: Verstanden. Das nächste Mal bin ich pünktlich.
    meaning:
      mk: Разбрав. Следниот пат ќе бидам точен.
  - speaker: luka
    text: Opa! Ich habe gewartet!
    meaning:
      mk: Дедо! Чекав!
- type: prompt
