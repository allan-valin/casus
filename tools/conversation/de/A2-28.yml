- type: narrator
  text:
    en: 'Homesickness often peaks in the first winter: short days, little contact. Say it to someone — neighbours, the club, the course. Universities and cities offer counselling in many languages.'
    ar: 'الحنين يبلغ ذروته غالبًا في الشتاء الأول: أيام قصيرة وتواصل قليل. قلها لأحد — للجيران، للنادي، للدورة. والجامعات والمدن تقدّم استشارات بلغات كثيرة.'
    mk: 'Носталгијата често е најсилна во првата зима: кратки денови, малку контакти. Кажете му некому — на соседите, во клубот, на курсот. Универзитетите и градовите нудат советување на многу јазици.'
