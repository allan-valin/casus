steps:
- type: narrator
  text:
    en: A grey Sunday evening, alone. You call home, and afterwards Jonas knocks. Listen to the conversation; you don't need to understand it yet.
    ar: مساء أحد رمادي، وحدك. تتصل بالأهل، وبعدها يطرق يوناس الباب. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Сива недела навечер, сам. Се јавувате дома, а потоа Јонас чука. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: Hey, alles okay? Du siehst traurig aus.
    meaning:
      en: Hey, all OK? You look sad.
      ar: مرحبًا، هل كل شيء بخير؟ تبدو حزينًا.
      mk: Еј, сè во ред? Изгледаш тажно.
  - speaker: protagonist
    text: Ich habe Heimweh. Ich vermisse meine Familie.
    meaning:
      en: I'm homesick. I miss my family.
      ar: عندي حنين إلى الوطن. أشتاق إلى عائلتي.
      mk: Имам носталгија. Ми недостига семејството.
  - speaker: jonas
    text: Das ist normal, am Anfang.
    meaning:
      en: That's normal, at the beginning.
      ar: هذا طبيعي في البداية.
      mk: Тоа е нормално, на почетокот.
  - speaker: protagonist
    text: Ich fühle mich einsam. Und ich mache mir Sorgen um meine Eltern.
    meaning:
      en: I feel lonely. And I'm worried about my parents.
      ar: أشعر بالوحدة. وأنا قلق على والديّ.
      mk: Се чувствувам осамено. И се грижам за родителите.
  - speaker: jonas
    text: Es wird besser. Glaub mir.
    meaning:
      en: It gets better. Believe me.
      ar: سيتحسّن الوضع. صدّقني.
      mk: Ќе биде подобро. Верувај ми.
  - speaker: protagonist
    text: Ich wünsche mir nur einen Abend wie zu Hause.
    meaning:
      en: I just wish for an evening like at home.
      ar: أتمنى فقط أمسية مثل أمسيات البيت.
      mk: Посакувам само една вечер како дома.
  - speaker: jonas
    text: Dann komm rein! Ich koche uns Nudeln. Und du erzählst mir von zu Hause.
    meaning:
      en: Then come in! I'll cook us pasta. And you tell me about home.
      ar: إذن ادخل! سأطبخ لنا معكرونة. وأنت تحكي لي عن بلدك.
      mk: Тогаш влези! Ќе ни зготвам тестенини. А ти раскажи ми за дома.
  - speaker: protagonist
    text: Danke, Jonas. Das tut gut.
    meaning:
      en: Thanks, Jonas. That does me good.
      ar: شكرًا يا يوناس. هذا يريحني.
      mk: Благодарам, Јонас. Ова ми прија.
