  text:
    mk: Клубовите за пензионери (Seniorentreff), често во општината или црквата, нудат кафе, излети, курсеви и друштво. Добредојдени се и луѓе што не зборуваат совршено германски — а македонска вечер е
      одличен начин да се запознаат соседите.
