steps:
- type: narrator
  text:
    mk: Во клубот за пензионери (Seniorentreff) се избира нов одбор. Госпоѓа Волф, мајката на Ања, ве предлага вас. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: frauwolf
    text: Für den Vorstand schlage ich Frau... na, Lukas Oma vor! Sie organisiert die besten Abende.
    meaning:
      mk: За одборот ја предлагам госпоѓа... па, бабата на Лука! Таа ги организира најдобрите вечери.
  - speaker: protagonist
    text: Ich? Aber mein Deutsch!
    meaning:
      mk: Јас? Но мојот германски!
  - speaker: frauwolf
    text: Ist gut genug. Kommen wir zur Abstimmung. Wer ist dafür? ... Einstimmig!
    meaning:
      mk: Доволно е добар. Да преминеме на гласање. Кој е за? ... Едногласно!
  - speaker: protagonist
    text: Liebe Mitglieder, vielen Dank für Ihr Vertrauen. Ich nehme die Wahl an.
    meaning:
      mk: Драги членови, ви благодарам за довербата. Го прифаќам изборот.
  - speaker: protagonist
    text: 'Ich werde jeden Monat eine Veranstaltung organisieren. Zuerst: ein mazedonischer Abend mit Musik und Essen!'
    meaning:
      mk: 'Секој месец ќе организирам настан. Прво: македонска вечер со музика и храна!'
  - speaker: frauwolf
    text: Wunderbar! Und ich bringe den Kuchen.
    meaning:
      mk: Прекрасно! А јас ќе донесам колач.
  - speaker: protagonist
    text: Und Sie lernen ein mazedonisches Lied.
    meaning:
      mk: А вие ќе научите една македонска песна.
  - speaker: frauwolf
    text: Abgemacht!
    meaning:
      mk: Договорено!
