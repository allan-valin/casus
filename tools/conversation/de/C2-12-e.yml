steps:
- type: narrator
  text:
    en: Your master's thesis colloquium. Twenty minutes of presentation, then questions from the examiners. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 'Im Rahmen dieser Arbeit untersuche ich folgende Forschungsfrage: Wie lernen Erwachsene Fachsprache?'
    meaning:
      en: 'Within this thesis I examine the following research question: how do adults learn technical language?'
  - speaker: protagonist
    text: 'Zur Methodik: Ich habe vierzig Lernende über ein Jahr begleitet.'
    meaning:
      en: 'On methodology: I followed forty learners over one year.'
  - speaker: protagonist
    text: Es lässt sich zeigen, dass Fachwörter im Kontext doppelt so schnell gelernt werden.
    meaning:
      en: It can be shown that technical words are learned twice as fast in context.
  - speaker: hartmann
    text: Danke. Welche Einschränkungen sehen Sie bei Ihren Ergebnissen?
    meaning:
      en: Thank you. What limitations do you see in your results?
  - speaker: protagonist
    text: Die Stichprobe ist klein. Das ist eine klare Einschränkung.
    meaning:
      en: The sample is small. That's a clear limitation.
  - speaker: hartmann
    text: Und der Ausblick?
    meaning:
      en: And the outlook?
  - speaker: protagonist
    text: Eine größere Studie mit Kontrollgruppe wäre der nächste Schritt.
    meaning:
      en: A larger study with a control group would be the next step.
  - speaker: hartmann
    text: Überzeugend. Die Gutachterin und ich beraten uns kurz.
    meaning:
      en: Convincing. The examiner and I will confer briefly.
