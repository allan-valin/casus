- type: narrator
  text:
    en: 'Academic register avoids ''I think'': «Es lässt sich zeigen, dass…» (it can be shown), «im Rahmen dieser Arbeit», «Zur Methodik:». It names its own limits («Einschränkung») and ends with an outlook
      («Ausblick»).'
