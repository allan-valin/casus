steps:
- type: narrator
  text:
    en: Four in the afternoon and already dark. You come in from the snow; Frau Becker is in the hallway. Listen to the conversation; you don't need to understand it yet.
    ar: الساعة الرابعة عصرًا والدنيا مظلمة. تدخل من الثلج، والسيدة بيكر في المدخل. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Четири попладне, а веќе е темно. Влегувате од снегот; госпоѓа Бекер е во ходникот. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: becker
    text: Guten Abend! Ist es kalt draußen?
    meaning:
      en: Good evening! Is it cold outside?
      ar: مساء الخير! هل الجو بارد في الخارج؟
      mk: Добровечер! Ладно ли е надвор?
  - speaker: protagonist
    text: Ja, sehr kalt. Und es ist schon dunkel — um vier Uhr!
    meaning:
      en: Yes, very cold. And it's already dark — at four o'clock!
      ar: نعم، بارد جدًا. وقد أظلمت الدنيا — في الساعة الرابعة!
      mk: Да, многу ладно. И веќе е темно — во четири часот!
  - speaker: becker
    text: Im Winter ist es von neun bis drei hell. Dann ist es dunkel.
    meaning:
      en: In winter it's light from nine to three. Then it's dark.
      ar: في الشتاء يكون النهار من التاسعة إلى الثالثة. ثم يحلّ الظلام.
      mk: Во зима е светло од девет до три. Потоа е темно.
  - speaker: protagonist
    text: Und immer grau.
    meaning:
      en: And always grey.
      ar: ودائمًا رمادي.
      mk: И секогаш сиво.
  - speaker: becker
    text: Treten Sie bitte die Schuhe ab. Der Boden ist nass.
    meaning:
      en: Please wipe your shoes. The floor is wet.
      ar: امسح حذاءك من فضلك. الأرض مبلّلة.
      mk: Избришете ги чевлите, ве молам. Подот е мокар.
  - speaker: protagonist
    text: Entschuldigung! Drinnen ist es so warm. Ich ziehe die Jacke aus.
    meaning:
      en: Sorry! It's so warm inside. I'll take my jacket off.
      ar: عفوًا! الجو دافئ جدًا في الداخل. سأخلع السترة.
      mk: Извинете! Внатре е толку топло. Ќе ја соблечам јакната.
  - speaker: becker
    text: Ja, die Heizung ist an. Draußen drei Jacken, drinnen ein T-Shirt!
    meaning:
      en: Yes, the heating's on. Outside three jackets, inside a T-shirt!
      ar: نعم، التدفئة شغّالة. في الخارج ثلاث سترات، وفي الداخل قميص قصير!
      mk: Да, греењето е вклучено. Надвор три јакни, внатре маичка!
  - speaker: protagonist
    text: Und kein Regenschirm?
    meaning:
      en: And no umbrella?
      ar: ولا مظلة؟
      mk: А чадор не?
  - speaker: becker
    text: Nein, es ist zu windig. Wir tragen eine Regenjacke.
    meaning:
      en: No, it's too windy. We wear a rain jacket.
      ar: لا، الرياح شديدة. نلبس سترة للمطر.
      mk: Не, премногу е ветровито. Носиме јакна за дожд.
