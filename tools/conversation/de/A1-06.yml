- type: narrator
  text:
    en: 'Winter here: grey days, light from about nine to three, then dark; often below zero. Outside you wear layers; inside, rooms are heated warm. Rain is often light but windy, so many people wear a
      hooded rain jacket instead of carrying an umbrella.'
    ar: 'الشتاء هنا: أيام رمادية، والنهار من التاسعة تقريبًا إلى الثالثة، ثم الظلام؛ وكثيرًا ما تنخفض الحرارة تحت الصفر. في الخارج تلبس طبقات من الثياب، وفي الداخل تُدفّأ الغرف جيدًا. المطر غالبًا خفيف
      لكن مع رياح، لذلك يلبس كثيرون سترة بقلنسوة بدل حمل المظلة.'
    mk: 'Зимата тука: сиви денови, светло од околу девет до три, потоа темно; често под нулата. Надвор се облекувате во слоеви, а внатре собите се добро загреани. Дождот често е слаб, но со ветер, па многумина
      носат јакна со качулка наместо чадор.'
