    mk: 'Некои глаголи се делат на два дела: «abtreten» (бришење чевли) станува «Treten Sie die Schuhe ab»; «ausziehen» (соблекување) станува «Ich ziehe die Jacke aus». Малиот дел оди на крајот.'
