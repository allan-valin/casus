steps:
- type: narrator
  text:
    en: The VHS evening ends in Auerbachs Keller, the tavern from Goethe's Faust. Professor Hartmann recites. Listen to the conversation; you don't need to understand it yet.
    ar: أمسية الجامعة الشعبية تنتهي في «Auerbachs Keller»، الحانة من مسرحية «فاوست» لغوته. البروفيسور هارتمان يُلقي. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Вечерта на народниот универзитет завршува во Auerbachs Keller, кафеаната од Гетеовиот „Фауст“. Професорот Хартман рецитира. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: hartmann
    text: In diesem Keller spielt eine Szene aus Goethes Faust. Hier trank der Teufel mit Studenten.
    meaning:
      en: A scene from Goethe's Faust takes place in this cellar. The devil drank with students here.
      ar: في هذا القبو يجري مشهد من «فاوست» لغوته. هنا شرب الشيطان مع الطلاب.
      mk: Во оваа визба се одвива сцена од Гетеовиот „Фауст“. Тука ѓаволот пиел со студенти.
  - speaker: protagonist
    text: Goethe war in Leipzig?
    meaning:
      en: Goethe was in Leipzig?
      ar: غوته كان في لايبزيغ؟
      mk: Гете бил во Лајпциг?
  - speaker: hartmann
    text: Ja, als Student. Er ist der berühmteste deutsche Dichter.
    meaning:
      en: Yes, as a student. He's the most famous German poet.
      ar: نعم، طالبًا. إنه أشهر شاعر ألماني.
      mk: Да, како студент. Тој е најпознатиот германски поет.
  - speaker: protagonist
    text: Können Sie ein Gedicht auswendig?
    meaning:
      en: Do you know a poem by heart?
      ar: هل تحفظ قصيدة عن ظهر قلب؟
      mk: Знаете ли некоја песна напамет?
  - speaker: hartmann
    text: „Über allen Gipfeln ist Ruh.“ Nur ein paar Verse, aber sehr schön.
    meaning:
      en: '''Over all the peaks is peace.'' Only a few lines, but very beautiful.'
      ar: «فوق كل القمم سكون.» أبيات قليلة لكنها جميلة جدًا.
      mk: „Над сите врвови е мир.“ Само неколку стиха, но многу убави.
  - speaker: protagonist
    text: Das ist schwer zu verstehen. Gibt es eine Übersetzung?
    meaning:
      en: That's hard to understand. Is there a translation?
      ar: هذا صعب الفهم. هل توجد ترجمة؟
      mk: Тоа е тешко за разбирање. Има ли превод?
  - speaker: hartmann
    text: In fast jeder Sprache. Aber Sie werden es bald auf Deutsch lesen.
    meaning:
      en: In almost every language. But soon you'll read it in German.
      ar: بكل اللغات تقريبًا. لكنك ستقرؤها قريبًا بالألمانية.
      mk: На речиси секој јазик. Но наскоро ќе ја читате на германски.
  - speaker: protagonist
    text: Ich werde den Faust lesen — irgendwann!
    meaning:
      en: I will read Faust — some day!
      ar: سأقرأ «فاوست» — يومًا ما!
      mk: Ќе го прочитам „Фауст“ — некогаш!
- type: prompt
  ask:
    en: 'Say: the devil drank with students here.'
    ar: 'قل: هنا شرب الشيطان مع الطلاب.'
    mk: 'Кажете: тука ѓаволот пиел со студенти.'
  answer:
    speaker: protagonist
