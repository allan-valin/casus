    text: Ein Theaterstück.
  items:
  - das-theaterstueck
- type: narrator
  text:
    en: Goethe studied law in Leipzig and set a scene of Faust in Auerbachs Keller, which still serves food today. «Wandrers Nachtlied» (Über allen Gipfeln ist Ruh) is one of the best-known German poems
      — eight short lines.
    ar: درس غوته الحقوق في لايبزيغ ووضع مشهدًا من «فاوست» في «Auerbachs Keller»، الذي ما زال مطعمًا حتى اليوم. وقصيدة «أغنية المسافر الليلية» (Über allen Gipfeln ist Ruh) من أشهر القصائد الألمانية — ثمانية
      أبيات قصيرة.
    mk: Гете студирал право во Лајпциг и сместил сцена од „Фауст“ во Auerbachs Keller, кој и денес служи храна. „Ноќна песна на патникот“ (Über allen Gipfeln ist Ruh) е една од најпознатите германски песни
      — осум кратки стиха.
