- type: narrator
  text:
    en: 'The future uses «werden» + infinitive at the end: «Sie werden es lesen», «Ich werde den Faust lesen». In speech, the present with a time word is more common: «Ich lese ihn bald».'
    ar: 'المستقبل يستعمل «werden» مع المصدر في الآخر: «Sie werden es lesen»، «Ich werde den Faust lesen». وفي الكلام يشيع المضارع مع كلمة زمن: «Ich lese ihn bald».'
    mk: 'Идното време користи «werden» + инфинитив на крајот: «Sie werden es lesen», «Ich werde den Faust lesen». Во говорот е почесто сегашно време со збор за време: «Ich lese ihn bald».'
- type: prompt
