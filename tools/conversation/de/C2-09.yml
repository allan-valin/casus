  meaning:
    en: It's buzzing there (a great party)
    ar: هناك حفلة صاخبة
    mk: Таму е луда журка
- id: nur-bahnhof
  text: Ich verstehe nur Bahnhof
  meaning:
    en: It's all Greek to me
    ar: لا أفهم شيئًا
    mk: Ништо не разбирам
- id: nicht-mein-bier
  text: Das ist nicht mein Bier
  meaning:
    en: That's not my business
    ar: ليس هذا من شأني
    mk: Тоа не е моја работа
- id: daumen-druecken
  text: Ich drücke dir die Daumen
  meaning:
    en: I'll keep my fingers crossed for you
    ar: أتمنّى لكِ التوفيق
    mk: Ќе ти стискам палци
- id: tomaten-auf-den-augen
  text: Tomaten auf den Augen haben
  meaning:
    en: be blind to something obvious
    ar: لا يرى الواضح
    mk: да не гледаш очигледно
- id: den-nagel-auf-den-kopf
  text: den Nagel auf den Kopf treffen
  meaning:
    en: hit the nail on the head
    ar: يصيب كبد الحقيقة
    mk: погодува во десетка
- id: ins-fettnaepfchen
  text: ins Fettnäpfchen treten
  meaning:
    en: put your foot in it
    ar: يرتكب زلّة محرجة
    mk: згазува во лајно (прави гаф)
- id: hals-und-beinbruch
  text: Hals- und Beinbruch!
  meaning:
    en: Break a leg!
    ar: 'بالتوفيق! (حرفيًا: كسر العنق والساق)'
    mk: 'Среќно! (буквално: скршен врат и нога)'
