steps:
- type: narrator
  text:
    en: Jonas speaks almost only in idioms tonight. You decode them — and try a few yourself, at the right moment. Listen to the conversation; you don't need to understand it yet.
    ar: يوناس يتكلّم الليلة بالتعابير الاصطلاحية فقط تقريبًا. تفكّين شيفرتها — وتجرّبين بعضها بنفسكِ، في اللحظة المناسبة. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Јонас вечерва зборува речиси само во идиоми. Ги дешифрирате — и самите пробувате неколку, во вистинскиот момент. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: Gehst du heute zum Sommerfest? Da steppt der Bär!
    meaning:
      en: Are you going to the summer party today? It'll be buzzing!
      ar: هل ستذهبين اليوم إلى حفلة الصيف؟ ستكون صاخبة!
      mk: Одиш ли денес на летната забава? Таму е луда журка!
  - speaker: protagonist
    text: Ein Bär? Ich verstehe nur Bahnhof.
    meaning:
      en: A bear? It's all Greek to me.
      ar: دبّ؟ لا أفهم شيئًا.
      mk: Мечка? Ништо не разбирам.
  - speaker: jonas
    text: 'Ha! Du kannst es ja schon. „Da steppt der Bär“ heißt: Da ist viel los.'
    meaning:
      en: 'Ha! You can already do it. ''Da steppt der Bär'' means: there''s a lot going on.'
      ar: 'ها! أنتِ تجيدينها بالفعل. «Da steppt der Bär» تعني: هناك الكثير من الحركة.'
      mk: 'Ха! Веќе знаеш. „Da steppt der Bär“ значи: таму има многу живост.'
  - speaker: protagonist
    text: Und Paul? Er hat gestern der Chefin gesagt, sie sehe müde aus.
    meaning:
      en: And Paul? Yesterday he told the boss she looked tired.
      ar: وباول؟ أمس قال للمديرة إنها تبدو متعبة.
      mk: А Паул? Вчера ѝ рекол на шефицата дека изгледа уморно.
  - speaker: jonas
    text: Da ist er voll ins Fettnäpfchen getreten. Aber das ist nicht mein Bier.
    meaning:
      en: He really put his foot in it there. But that's not my business.
      ar: لقد ارتكب زلّة محرجة تمامًا. لكن ليس هذا من شأني.
      mk: Таму баш направил гаф. Но тоа не е моја работа.
  - speaker: protagonist
    text: Morgen habe ich meine Prüfung für den Trainerschein.
    meaning:
      en: Tomorrow I have my exam for the coaching licence.
      ar: غدًا لديّ امتحان رخصة التدريب.
      mk: Утре го имам испитот за тренерската лиценца.
  - speaker: jonas
    text: Dann drücke ich dir die Daumen! Hals- und Beinbruch!
    meaning:
      en: Then I'll keep my fingers crossed! Break a leg!
      ar: إذن أتمنّى لكِ التوفيق! بالتوفيق!
      mk: Тогаш ти стискам палци! Среќно!
  - speaker: protagonist
    text: Danke. Du hast mit dem Bären übrigens den Nagel auf den Kopf getroffen — ich komme!
    meaning:
      en: Thanks. And you hit the nail on the head with the bear, by the way — I'm coming!
      ar: شكرًا. وبالمناسبة أصبتَ كبد الحقيقة مع الدبّ — سآتي!
      mk: Благодарам. Патем, со мечката погоди во десетка — доаѓам!
- type: prompt
  ask:
    en: 'Say: it''ll be buzzing there!'
    ar: 'قولي: ستكون حفلة صاخبة!'
    mk: 'Кажете: таму ќе е луда журка!'
  answer:
    speaker: protagonist
    text: Da steppt der Bär!
  items:
  - da-steppt-der-baer
- type: prompt
  ask:
    en: 'Say: it''s all Greek to me.'
    ar: 'قولي: لا أفهم شيئًا.'
    mk: 'Кажете: ништо не разбирам.'
  answer:
    speaker: protagonist
    text: Ich verstehe nur Bahnhof.
  items:
  - nur-bahnhof
- type: narrator
  text:
    en: 'Idioms only work at the right moment and in the right register: «Da steppt der Bär» and «nicht mein Bier» are casual — use them with friends, never in a letter. Learn them in a situation, not in
      lists.'
    ar: 'التعابير الاصطلاحية لا تنجح إلا في اللحظة والأسلوب المناسبين: «Da steppt der Bär» و«nicht mein Bier» عامية — استعمليها مع الأصدقاء، لا في رسالة أبدًا. تعلّميها في موقف، لا في قوائم.'
    mk: 'Идиомите функционираат само во вистинскиот момент и регистар: «Da steppt der Bär» и «nicht mein Bier» се разговорни — користете ги со пријатели, никогаш во писмо. Учете ги во ситуација, не од листи.'
- type: prompt
  ask:
    en: 'Say: he put his foot in it.'
    ar: 'قولي: ارتكب زلّة محرجة.'
    mk: 'Кажете: направи гаф.'
  answer:
    speaker: protagonist
    text: Er ist ins Fettnäpfchen getreten.
  items:
  - ins-fettnaepfchen
- type: prompt
  ask:
    en: 'Say: that''s not my business.'
    ar: 'قولي: ليس هذا من شأني.'
    mk: 'Кажете: тоа не е моја работа.'
  answer:
    speaker: protagonist
    text: Das ist nicht mein Bier.
  items:
  - nicht-mein-bier
- type: prompt
  ask:
    en: 'Say: I''ll keep my fingers crossed.'
    ar: 'قولي: أتمنّى لكَ التوفيق.'
    mk: 'Кажете: ќе ти стискам палци.'
  answer:
    speaker: protagonist
    text: Ich drücke dir die Daumen.
  items:
  - daumen-druecken
- type: prompt
  ask:
    en: 'Wish: break a leg!'
    ar: 'تمنّي: بالتوفيق!'
    mk: 'Посакајте: среќно!'
  answer:
    speaker: protagonist
    text: Hals- und Beinbruch!
  items:
  - hals-und-beinbruch
- type: prompt
  ask:
    en: 'Say: you hit the nail on the head.'
    ar: 'قولي: أصبتَ كبد الحقيقة.'
    mk: 'Кажете: погоди во десетка.'
  answer:
    speaker: protagonist
    text: Du hast den Nagel auf den Kopf getroffen.
  items:
  - den-nagel-auf-den-kopf
- type: prompt
  ask:
    en: 'Say: you''re blind to the obvious.'
    ar: 'قولي: لا ترى الواضح.'
    mk: 'Кажете: не го гледаш очигледното.'
  answer:
    speaker: protagonist
    text: Du hast Tomaten auf den Augen.
  items:
  - tomaten-auf-den-augen
- type: prompt
  ask:
    en: 'Say: an idiom, at the right moment.'
    ar: 'قولي: تعبير اصطلاحي، في اللحظة المناسبة.'
    mk: 'Кажете: идиом, во вистинскиот момент.'
  answer:
    speaker: protagonist
    text: Eine Redewendung im richtigen Moment.
  items:
  - die-redewendung
  - im-richtigen-moment
- type: narrator
  text:
    en: A few well-placed idioms make your German sound natural; too many sound learned from a book. Some have surprising images (dancing bears, fat pots, tomatoes on your eyes) — and many have equivalents
      in your own language worth comparing.
    ar: بضعة تعابير اصطلاحية في مكانها تجعل ألمانيتكِ طبيعية؛ والكثير منها يبدو محفوظًا من كتاب. بعضها له صور مفاجئة (دببة ترقص، أواني دهن، طماطم على العيون) — وكثير منها له مقابلات في لغتكِ تستحق المقارنة.
    mk: Неколку добро поставени идиоми прават германскиот да звучи природно; премногу звучат научено од книга. Некои имаат изненадувачки слики (мечки што танцуваат, тенџериња со маст, домати на очите) —
      а многу имаат еквиваленти на вашиот јазик што вреди да се споредат.
