title:
  en: Idioms
  ar: التعابير الاصطلاحية
  mk: Идиоми
situation:
  en: Jonas speaks almost only in idioms tonight. You decode them — and try a few yourself, at the right moment.
  ar: يوناس يتكلّم الليلة بالتعابير الاصطلاحية فقط تقريبًا. تفكّين شيفرتها — وتجرّبين بعضها بنفسكِ، في اللحظة المناسبة.
  mk: Јонас вечерва зборува речиси само во идиоми. Ги дешифрирате — и самите пробувате неколку, во вистинскиот момент.
