  text: die Redewendung
  meaning:
    en: the idiom
    ar: التعبير الاصطلاحي
    mk: идиомот
- id: im-richtigen-moment
  text: im richtigen Moment
  meaning:
    en: at the right moment
    ar: في اللحظة المناسبة
    mk: во вистинскиот момент
