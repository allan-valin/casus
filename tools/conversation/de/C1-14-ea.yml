steps:
- type: narrator
  text:
    en: Local elections. Svenja votes; you can't — or can you? She tells you what she read about the Migrationsbeirat. Listen to the conversation; you don't need to understand it yet.
    ar: انتخابات محلية. سفينيا تصوّت؛ وأنت لا تستطيع — أم تستطيع؟ تحكي لك ما قرأته عن مجلس الهجرة. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
- type: dialogue
  lines:
  - speaker: svenja
    text: Ich gehe heute ins Wahllokal. Kommst du mit?
    meaning:
      en: I'm going to the polling station today. Coming along?
      ar: سأذهب اليوم إلى مركز الاقتراع. هل تأتي معي؟
  - speaker: protagonist
    text: Ich darf nicht wählen. Ohne EU-Pass gibt es kein kommunales Wahlrecht.
    meaning:
      en: I'm not allowed to vote. Without an EU passport there's no right to vote locally.
      ar: لا يحق لي التصويت. بلا جواز أوروبي لا يوجد حق تصويت محلي.
  - speaker: svenja
    text: Für den Stadtrat nicht. Aber in der Zeitung stand, es gebe einen Migrationsbeirat.
    meaning:
      en: Not for the city council. But the paper said there's a migrants' advisory council.
      ar: ليس لمجلس المدينة. لكن الصحيفة ذكرت أنّ هناك مجلس هجرة استشاريًا.
  - speaker: protagonist
    text: Was macht der?
    meaning:
      en: What does it do?
      ar: ماذا يفعل؟
  - speaker: svenja
    text: Es heiße, er berate den Stadtrat. Alle Einwohner ohne deutschen Pass dürften ihn wählen.
    meaning:
      en: It says it advises the city council. All residents without a German passport may elect it.
      ar: يُقال إنه يقدّم المشورة لمجلس المدينة. ويحق لكل السكان بلا جواز ألماني انتخابه.
  - speaker: protagonist
    text: Dann kann ich doch mitbestimmen! Und kann man da auch kandidieren?
    meaning:
      en: Then I can have a say after all! And can you stand for it too?
      ar: إذن يمكنني أن أشارك في القرار! وهل يمكن الترشّح له أيضًا؟
  - speaker: svenja
    text: Ja. Die nächste Wahl werde im Herbst sein, stand da.
    meaning:
      en: Yes. The next election will be in autumn, it said.
      ar: نعم. الانتخاب القادم سيكون في الخريف، كما ورد.
  - speaker: protagonist
    text: Dann gebe ich im Herbst meine Stimme ab. Vielleicht sogar für mich selbst!
    meaning:
      en: Then I'll cast my vote in autumn. Maybe even for myself!
      ar: إذن سأدلي بصوتي في الخريف. وربما لنفسي!
