- type: narrator
  text:
    en: Only Germans vote in federal and state elections; EU citizens also vote in local and European elections. Residents from outside the EU have no vote in these — but many cities elect a migrants' or
      integration council (Migrationsbeirat, Ausländerbeirat) that advises the city council, and every resident without a German passport may vote and stand. Check whether your city has one.
    ar: الألمان وحدهم يصوّتون في الانتخابات الاتحادية وانتخابات الولايات؛ ومواطنو الاتحاد الأوروبي يصوّتون أيضًا في الانتخابات المحلية والأوروبية. أما المقيمون من خارج الاتحاد فلا صوت لهم في هذه — لكن مدنًا
      كثيرة تنتخب مجلسًا للهجرة أو الاندماج يقدّم المشورة لمجلس المدينة، ويحق لكل مقيم بلا جواز ألماني التصويت فيه والترشّح. تحقّق إن كانت مدينتك تملك مجلسًا كهذا.
