steps:
- type: narrator
  text:
    mk: Сакате да останете кај Петар подолго од три месеци. Тој ви објаснува што ви треба. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Petar, wir möchten länger als drei Monate bleiben. Geht das?
    meaning:
      mk: Петре, сакаме да останеме подолго од три месеци. Може ли?
  - speaker: petar
    text: Ja, mit dem bulgarischen Pass habt ihr Freizügigkeit. Aber ihr müsst etwas nachweisen.
    meaning:
      mk: Да, со бугарскиот пасош имате слобода на движење. Но мора нешто да докажете.
  - speaker: protagonist
    text: Was denn?
    meaning:
      mk: Што?
  - speaker: petar
    text: Ausreichende Mittel — eure Rente — und Versicherungsschutz.
    meaning:
      mk: Доволно средства — вашата пензија — и осигурителна заштита.
  - speaker: protagonist
    text: Gilt unsere Versicherung aus Mazedonien hier?
    meaning:
      mk: Дали нашето осигурување од Македонија важи тука?
  - speaker: petar
    text: Teilweise, durch ein Sozialversicherungsabkommen. Für Lücken nehmen viele eine Auslandskrankenversicherung.
    meaning:
      mk: Делумно, преку договор за социјално осигурување. За празнините многумина земаат патно здравствено осигурување.
  - speaker: anja
    text: Und? Was sagt Petar?
    meaning:
      mk: И? Што вели Петар?
  - speaker: protagonist
    text: Er sagt, es sei möglich. Ich müsse nur die Versicherung klären.
    meaning:
      mk: Вели дека е можно. Само морам да го разјаснам осигурувањето.
