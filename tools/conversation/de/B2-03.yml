steps:
- type: narrator
  text:
    en: A VHS evening on heredity. Why do you have your grandmother's eyes? Professor Hartmann explains. Listen to the conversation; you don't need to understand it yet.
    ar: أمسية في الجامعة الشعبية عن الوراثة. لماذا لديكِ عينا جدتكِ؟ البروفيسور هارتمان يشرح. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Вечер на народниот универзитет за наследноста. Зошто ги имате очите на баба ви? Професорот Хартман објаснува. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: hartmann
    text: 'Jeder Mensch hat zwei Kopien von jedem Gen: eine von der Mutter, eine vom Vater.'
    meaning:
      en: 'Every person has two copies of each gene: one from the mother, one from the father.'
      ar: 'كل إنسان لديه نسختان من كل جين: واحدة من الأم وواحدة من الأب.'
      mk: 'Секој човек има две копии од секој ген: една од мајката, една од таткото.'
  - speaker: protagonist
    text: Und warum habe ich die Augenfarbe meiner Oma?
    meaning:
      en: And why do I have my grandma's eye colour?
      ar: ولماذا لديّ لون عينَي جدتي؟
      mk: А зошто ја имам бојата на очите на баба ми?
  - speaker: hartmann
    text: Manche Merkmale können über Generationen vererbt werden. Sie springen manchmal.
    meaning:
      en: Some traits can be inherited over generations. They sometimes skip.
      ar: بعض الصفات يمكن أن تُورَث عبر الأجيال. أحيانًا تقفز جيلًا.
      mk: Некои особини можат да се наследат низ генерации. Понекогаш прескокнуваат.
  - speaker: protagonist
    text: Sind auch Krankheiten erblich?
    meaning:
      en: Are diseases hereditary too?
      ar: هل الأمراض وراثية أيضًا؟
      mk: Дали и болестите се наследни?
  - speaker: hartmann
    text: Manche. Dann muss das beim Arzt untersucht werden.
    meaning:
      en: Some. Then it has to be examined at the doctor's.
      ar: بعضها. عندها يجب أن يُفحص ذلك عند الطبيب.
      mk: Некои. Тогаш тоа мора да се испита кај лекар.
  - speaker: protagonist
    text: Ist also alles in den Genen?
    meaning:
      en: So is everything in the genes?
      ar: إذن هل كل شيء في الجينات؟
      mk: Значи, сè е во гените?
  - speaker: hartmann
    text: 'Nein. Die Umwelt ist auch wichtig: Essen, Sport, Stress. Wir sind eine Mischung.'
    meaning:
      en: 'No. The environment matters too: food, sport, stress. We''re a mix.'
      ar: 'لا. البيئة مهمة أيضًا: الطعام والرياضة والضغط. نحن مزيج.'
      mk: 'Не. И околината е важна: храна, спорт, стрес. Ние сме мешавина.'
  - speaker: protagonist
    text: Dann gebe ich meinen Genen nicht die Schuld!
    meaning:
      en: Then I won't blame my genes!
      ar: إذن لن ألوم جيناتي!
      mk: Тогаш нема да ги обвинувам гените!
