steps:
- type: narrator
  text:
    en: Your first exam result is worse than you expected. Mia explains how exams work here. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Ich habe die Klausur geschrieben — eine Vier. Bin ich durchgefallen?
    meaning:
      en: I sat the exam — a four. Did I fail?
  - speaker: mia
    text: Nein! Vier ist bestanden. Fünf ist durchgefallen.
    meaning:
      en: No! A four is a pass. Five is a fail.
  - speaker: protagonist
    text: Bei uns ist es anders. Und wer entscheidet die Regeln?
    meaning:
      en: Back home it's different. And who decides the rules?
  - speaker: mia
    text: Die Prüfungsordnung von deinem Studiengang. Jedes Modul hat eigene Regeln.
    meaning:
      en: Your degree programme's exam regulations. Every module has its own rules.
  - speaker: protagonist
    text: Und der Professor? Er hat nur Theorie gefragt.
    meaning:
      en: And the professor? He only asked theory.
  - speaker: mia
    text: Er wählt den Inhalt und die Methode. Das ist die Lehrfreiheit.
    meaning:
      en: He chooses the content and the method. That's academic freedom.
  - speaker: protagonist
    text: Kann ich die Klausur sehen?
    meaning:
      en: Can I see my paper?
  - speaker: mia
    text: Ja, bei der Klausureinsicht. Und du kannst widersprechen, wenn etwas falsch ist.
    meaning:
      en: Yes, at the exam review. And you can object if something's wrong.
  - speaker: protagonist
    text: Gut. Das habe ich verstanden.
    meaning:
      en: Good. I've understood that.
