steps:
- type: narrator
  text:
    mk: Канцеларијата за странци. Сакате да останете кај Петар подолго — ви треба ли виза? Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Guten Tag. Ich bleibe bei meinem Sohn. Brauche ich ein Visum?
    meaning:
      mk: Добар ден. Престојувам кај синот. Ми треба ли виза?
  - speaker: schulz
    text: Welchen Pass haben Sie?
    meaning:
      mk: Каков пасош имате?
  - speaker: protagonist
    text: Einen bulgarischen Pass.
    meaning:
      mk: Бугарски пасош.
  - speaker: schulz
    text: Dann sind Sie EU-Bürger. Sie brauchen kein Visum. Das ist die Freizügigkeit.
    meaning:
      mk: Тогаш сте граѓанин на ЕУ. Не ви треба виза. Тоа е слободата на движење.
  - speaker: protagonist
    text: Ich habe gelesen, man muss sich anmelden?
    meaning:
      mk: Прочитав дека мора да се пријави?
  - speaker: schulz
    text: Wenn Sie länger bleiben und hier wohnen, ja — beim Bürgeramt.
    meaning:
      mk: Ако останете подолго и живеете тука, да — во општинската служба.
  - speaker: protagonist
    text: Und mit dem mazedonischen Pass?
    meaning:
      mk: А со македонскиот пасош?
  - speaker: schulz
    text: Dafür gelten andere Regeln. Prüfen Sie bitte die aktuellen Regeln.
    meaning:
      mk: За него важат други правила. Ве молам, проверете ги сегашните правила.
