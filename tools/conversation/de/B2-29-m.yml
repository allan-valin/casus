steps:
- type: narrator
  text:
    mk: Петар и Ања работат до доцна. Вие одите на првата родителска средба на Лука. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: klassenlehrerin
    text: Willkommen zum ersten Elternabend. Sind Sie Lukas Oma?
    meaning:
      mk: Добредојдовте на првата родителска средба. Вие сте бабата на Лука?
  - speaker: protagonist
    text: Ja. Die Eltern arbeiten heute lange.
    meaning:
      mk: Да. Родителите денес работат до доцна.
  - speaker: klassenlehrerin
    text: Kein Problem. Luka lernt gut lesen. Er hat einen Sitznachbarn, mit dem er sich gut versteht.
    meaning:
      mk: Нема проблем. Лука добро учи да чита. Има соученик до него со кој добро се разбира.
  - speaker: protagonist
    text: Und die Hausaufgaben? Ich helfe ihm am Nachmittag.
    meaning:
      mk: А домашните задачи? Јас му помагам попладне.
  - speaker: klassenlehrerin
    text: Höchstens zwanzig Minuten am Tag. Lassen Sie ihn selbst probieren.
    meaning:
      mk: Најмногу дваесет минути дневно. Оставете го сам да проба.
  - speaker: protagonist
    text: Gibt es den Ausflug, an dem alle Kinder teilnehmen?
    meaning:
      mk: Дали има излет на кој учествуваат сите деца?
  - speaker: klassenlehrerin
    text: Im Mai, in den Zoo. Frau Weber ist die Elternvertreterin, bei der Sie sich in die Liste eintragen.
    meaning:
      mk: Во мај, во зоолошката. Госпоѓа Вебер е претставничката на родителите кај која се запишувате на листата.
  - speaker: protagonist
    text: Gut. Ich trage mich ein — als Begleitung!
    meaning:
      mk: Добро. Ќе се запишам — како придружба!
