- type: prompt
  review: true
  ask:
    en: 'Say: “the exam — and “pass (an exam) — and “the oral exam — and “the written part — and “command of the language — and “the certificate — and “the assessment, mark — and “the preparation — and
      “fail (an exam) — and “with distinction — and “the recognition of the certificate — and “the city tour — and “the Monument to the Battle of the Nations — and “St Thomas Church (Bach''s church) — and
      “the Peaceful Revolution (1989) — and “(particle) at all, anyway”.'
    ar: 'قل: “الامتحان — و“ينجح في — و“الامتحان الشفهي — و“الجزء الكتابي — و“إتقان اللغة — و“الشهادة — و“التقييم — و“التحضير — و“يرسب — و“بامتياز — و“الاعتراف بالشهادة — و“الجولة في المدينة — و“نصب معركة
      الأمم — و“كنيسة القديس توما — و“الثورة السلمية — و“(أداة) أصلًا”.'
    mk: 'Кажете: „испитот“ — и „положува“ — и „усниот испит“ — и „писмениот дел“ — и „владеењето на јазикот“ — и „сертификатот“ — и „оценувањето“ — и „подготовката“ — и „паѓа (на испит)“ — и „со одлика“
      — и „признавањето на сертификатот“ — и „обиколката на градот“ — и „Споменикот на битката на народите“ — и „Црквата Св. Тома“ — и „Мирната револуција“ — и „(честичка) воопшто“.'
