steps:
- type: narrator
  text:
    en: Five years since you arrived. Frau Becker, Jonas and Svenja with little Emma come for dinner. A look back at all of C1. Listen to the conversation; you don't need to understand it yet.
    ar: خمس سنوات منذ وصولك. السيدة بيكر ويوناس وسفينيا مع الصغيرة إيما يأتون للعشاء. نظرة إلى المستوى C1 كله. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Пет години откако пристигнавте. Госпоѓа Бекер, Јонас и Свења со малата Ема доаѓаат на вечера. Поглед наназад кон целото C1. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: becker
    text: Fünf Jahre! Weißt du noch, wie du am ersten Tag den Müll falsch getrennt hast?
    meaning:
      en: Five years! Do you remember sorting the rubbish wrong on your first day?
      ar: خمس سنوات! أتذكر كيف فرزتَ القمامة خطأً في يومك الأول؟
      mk: Пет години! Се сеќаваш ли како првиот ден погрешно го одвои ѓубрето?
  - speaker: protagonist
    text: Und wie streng du warst! Heute erkläre ich den Neuen die Mülltrennung.
    meaning:
      en: And how strict you were! Today I explain recycling to the newcomers.
      ar: وكم كنتِ صارمة! اليوم أنا من يشرح فرز القمامة للقادمين الجدد.
      mk: А колку беше строга! Денес јас им ја објаснувам селекцијата на новите.
  - speaker: jonas
    text: 'Rückblickend: Was war die größte Veränderung?'
    meaning:
      en: 'Looking back: what was the biggest change?'
      ar: 'بالنظر إلى الماضي: ما أكبر تغيير؟'
      mk: 'Гледајќи наназад: која беше најголемата промена?'
  - speaker: protagonist
    text: Dass mir die Fremde vertraut geworden ist. Leipzig ist meine Wahlheimat.
    meaning:
      en: That foreign parts have become familiar to me. Leipzig is my adopted home.
      ar: أنّ الغربة صارت مألوفة لي. لايبزيغ وطني المختار.
      mk: Тоа што туѓината ми стана блиска. Лајпциг е мојата избрана татковина.
  - speaker: svenja
    text: Und Emma sagt schon „Onkel“ zu dir!
    meaning:
      en: And Emma already calls you 'uncle'!
      ar: وإيما تناديك «عمّو» بالفعل!
      mk: А Ема веќе те вика „чичко“!
  - speaker: protagonist
    text: Ich bin sehr dankbar. Für die Geduld, die Kritik und den Kuchen.
    meaning:
      en: I'm very grateful. For the patience, the criticism and the cake.
      ar: أنا ممتنّ جدًا. على الصبر والنقد والكعك.
      mk: Многу сум благодарен. За трпението, критиката и колачот.
  - speaker: becker
    text: Auf die nächsten fünf Jahre!
    meaning:
      en: To the next five years!
      ar: نخب السنوات الخمس القادمة!
      mk: За следните пет години!
  - speaker: protagonist
    text: 'Und auf die nächste Stufe: C2!'
    meaning:
      en: 'And to the next level: C2!'
      ar: 'ونخب المستوى التالي: C2!'
      mk: 'И за следното ниво: C2!'
- type: prompt
  ask:
    en: 'She asks: do you remember…?'
    ar: 'تسأل: أتذكر…؟'
    mk: 'Таа прашува: се сеќаваш ли…?'
  answer:
    speaker: protagonist
    text: Weißt du noch…?
  items:
  - weisst-du-noch
