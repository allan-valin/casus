- type: narrator
  text:
    en: At C1 you can argue, appeal, comfort, negotiate and joke in German. 'Wahlheimat' — the home you chose — is how many people describe the place where they arrived and stayed.
    ar: في مستوى C1 تستطيع أن تجادل وتعترض وتواسي وتفاوض وتمزح بالألمانية. و«Wahlheimat» — الوطن الذي اخترته — هي الكلمة التي يصف بها كثيرون المكان الذي وصلوا إليه وبقوا فيه.
    mk: На C1 можете на германски да расправате, да се жалите, да тешите, да преговарате и да се шегувате. „Wahlheimat“ — домот што сте го избрале — е како многумина го опишуваат местото каде што пристигнале
      и останале.
