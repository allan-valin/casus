steps:
- type: narrator
  text:
    en: The courtyard garden. Frau Becker waters her flowers and gives you a small plant. Listen to the conversation; you don't need to understand it yet.
    ar: حديقة الفناء. السيدة بيكر تسقي أزهارها وتعطيكِ نبتة صغيرة. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Градината во дворот. Госпоѓа Бекер ги полева цвеќињата и ви дава мало растение. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: becker
    text: Guten Tag! Gefällt Ihnen der Garten?
    meaning:
      en: Hello! Do you like the garden?
      ar: نهارك سعيد! هل تعجبكِ الحديقة؟
      mk: Добар ден! Ви се допаѓа градината?
  - speaker: protagonist
    text: Ja, sehr! Die Blumen sind schön.
    meaning:
      en: Yes, very much! The flowers are lovely.
      ar: نعم، كثيرًا! الأزهار جميلة.
      mk: Да, многу! Цвеќињата се убави.
  - speaker: becker
    text: Ich gieße sie jeden Abend. Und der Baum ist alt — achtzig Jahre!
    meaning:
      en: I water them every evening. And the tree is old — eighty years!
      ar: أسقيها كل مساء. والشجرة قديمة — ثمانون عامًا!
      mk: Ги полевам секоја вечер. А дрвото е старо — осумдесет години!
  - speaker: protagonist
    text: Im Sommer ist es hier bestimmt schön.
    meaning:
      en: In summer it must be lovely here.
      ar: في الصيف لا بد أن المكان جميل هنا.
      mk: Во лето сигурно е убаво тука.
  - speaker: becker
    text: Hier, eine Pflanze für Sie. Ein Basilikum.
    meaning:
      en: Here, a plant for you. Basil.
      ar: تفضّلي، نبتة لكِ. ريحان.
      mk: Еве, едно растение за вас. Босилек.
  - speaker: protagonist
    text: Danke! Was braucht die Pflanze?
    meaning:
      en: Thank you! What does the plant need?
      ar: شكرًا! ماذا تحتاج النبتة؟
      mk: Благодарам! Што му треба на растението?
  - speaker: becker
    text: Viel Sonne. Stellen Sie sie ans Fenster.
    meaning:
      en: Lots of sun. Put it at the window.
      ar: شمسًا كثيرة. ضعيها عند النافذة.
      mk: Многу сонце. Ставете го до прозорецот.
  - speaker: protagonist
    text: Und Wasser? Jeden Tag?
    meaning:
      en: And water? Every day?
      ar: والماء؟ كل يوم؟
      mk: А вода? Секој ден?
  - speaker: becker
    text: Jeden zweiten Tag. Nicht zu viel Wasser!
    meaning:
      en: Every other day. Not too much water!
      ar: كل يومين. لا تكثري الماء!
      mk: Секој втор ден. Не премногу вода!
