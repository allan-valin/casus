steps:
- type: narrator
  text:
    en: Sunday morning. You want to buy bread — and the supermarket is shut. Listen to the conversation; you don't need to understand it yet.
    ar: صباح الأحد. تريدين شراء الخبز — والسوبرماركت مغلق. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Недела наутро. Сакате да купите леб — а маркетот е затворен. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Guten Morgen, Frau Becker! Der Supermarkt ist geschlossen!
    meaning:
      en: Good morning, Mrs Becker! The supermarket is closed!
      ar: صباح الخير يا سيدة بيكر! السوبرماركت مغلق!
      mk: Добро утро, госпоѓо Бекер! Маркетот е затворен!
  - speaker: becker
    text: Natürlich, heute ist Sonntag. Sonntags ist alles geschlossen.
    meaning:
      en: Of course, today is Sunday. On Sundays everything is closed.
      ar: طبعًا، اليوم الأحد. أيام الأحد كل شيء مغلق.
      mk: Секако, денес е недела. Во недела сè е затворено.
  - speaker: protagonist
    text: Kann ich irgendwo Brot kaufen?
    meaning:
      en: Can I buy bread anywhere?
      ar: هل يمكنني شراء الخبز في مكان ما؟
      mk: Можам ли некаде да купам леб?
  - speaker: becker
    text: Die Bäckerei an der Ecke ist bis elf Uhr offen.
    meaning:
      en: The bakery on the corner is open till eleven.
      ar: المخبز عند الزاوية مفتوح حتى الحادية عشرة.
      mk: Пекарницата на аголот е отворена до единаесет.
  - speaker: protagonist
    text: Und morgen?
    meaning:
      en: And tomorrow?
      ar: وغدًا؟
      mk: А утре?
  - speaker: becker
    text: Morgen ist Feiertag. Auch alles geschlossen.
    meaning:
      en: Tomorrow is a holiday. Everything closed too.
      ar: غدًا عطلة رسمية. كل شيء مغلق أيضًا.
      mk: Утре е празник. Исто сè затворено.
  - speaker: protagonist
    text: Oh nein! Kann ich heute Wäsche waschen?
    meaning:
      en: Oh no! Can I do the laundry today?
      ar: يا للأسف! هل يمكنني غسل الملابس اليوم؟
      mk: О, не! Можам ли денес да перам алишта?
  - speaker: becker
    text: 'Lieber nicht. Sonntag ist Ruhe. Meine Nachbarin aus Ägypten sagt: Bei uns ist der Freitag ruhig.'
    meaning:
      en: 'Better not. Sunday is quiet time. My neighbour from Egypt says: at home Friday is the quiet day.'
      ar: 'الأفضل لا. الأحد يوم هدوء. جارتي من مصر تقول: عندنا يوم الجمعة هو اليوم الهادئ.'
      mk: 'Подобро не. Неделата е за мир. Мојата соседка од Египет вели: кај нас петокот е мирниот ден.'
  - speaker: protagonist
    text: Gut, dann gehe ich spazieren.
    meaning:
      en: Fine, then I'll go for a walk.
      ar: حسنًا، إذن سأتمشّى.
      mk: Добро, тогаш одам на прошетка.
