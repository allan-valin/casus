- type: narrator
  text:
    en: 'Shops close on Sundays and public holidays; bakeries open for a few hours in the morning, and petrol stations and stations sell food. Sunday is a quiet day: no drilling, no loud laundry in many
      buildings.'
    ar: 'تُغلق المحلات أيام الأحد والعطل الرسمية؛ تفتح المخابز بضع ساعات صباحًا، وتبيع محطات الوقود ومحطات القطار الطعام. الأحد يوم هدوء: لا ثقب ولا غسالة صاخبة في كثير من العمارات.'
    mk: 'Продавниците се затворени во недела и на празници; пекарниците работат неколку часа наутро, а бензинските и железничките станици продаваат храна. Неделата е мирен ден: без дупчење и без бучна машина
      за перење во многу згради.'
