steps:
- type: narrator
  text:
    en: Frau Becker has been to the notary to make her will. Over coffee she tells you what the notary explained. Listen to the conversation; you don't need to understand it yet.
    ar: السيدة بيكر ذهبت إلى كاتب العدل لتكتب وصيتها. على القهوة تحكي لك ما شرحه كاتب العدل. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Госпоѓа Бекер била кај нотар за да го состави тестаментот. На кафе ви раскажува што ѝ објаснил нотарот. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: becker
    text: Ich war beim Notar. Mit sechzig sollte man ein Testament haben.
    meaning:
      en: I went to the notary. At sixty you should have a will.
      ar: ذهبتُ إلى كاتب العدل. في الستين يجب أن تكون للمرء وصية.
      mk: Бев кај нотар. На шеесет години треба да имаш тестамент.
  - speaker: protagonist
    text: Braucht man dafür einen Notar?
    meaning:
      en: Do you need a notary for that?
      ar: هل يحتاج ذلك إلى كاتب عدل؟
      mk: Дали за тоа треба нотар?
  - speaker: becker
    text: Nein. Er sagte, ein handschriftliches Testament sei auch gültig — ganz mit der Hand geschrieben und unterschrieben.
    meaning:
      en: No. He said a handwritten will is also valid — written entirely by hand and signed.
      ar: لا. قال إنّ الوصية المكتوبة بخط اليد صالحة أيضًا — مكتوبة كلها باليد وموقَّعة.
      mk: Не. Рече дека и рачно напишан тестамент е важечки — целиот напишан со рака и потпишан.
  - speaker: protagonist
    text: Und kann man alles vermachen, wem man will?
    meaning:
      en: And can you leave everything to whoever you want?
      ar: وهل يمكن أن يوصي المرء بكل شيء لمن يشاء؟
      mk: А може ли да се остави сè на кого сакаш?
  - speaker: becker
    text: Fast. Er sagte, es gebe einen Pflichtteil für die Kinder. Den bekommen sie immer.
    meaning:
      en: Almost. He said there's a compulsory share for the children. They always get that.
      ar: تقريبًا. قال إنّ هناك حصة إلزامية للأولاد. يحصلون عليها دائمًا.
      mk: Речиси. Рече дека постои задолжителен дел за децата. Тој секогаш го добиваат.
  - speaker: protagonist
    text: Und ohne Testament?
    meaning:
      en: And without a will?
      ar: وبلا وصية؟
      mk: А без тестамент?
  - speaker: becker
    text: Dann gilt die gesetzliche Erbfolge. Ehepartner und Kinder erben zuerst.
    meaning:
      en: Then statutory succession applies. Spouses and children inherit first.
      ar: عندها يسري الإرث القانوني. الزوج والأولاد يرثون أولًا.
      mk: Тогаш важи законскиот наследен ред. Брачниот другар и децата наследуваат први.
  - speaker: protagonist
    text: Bei uns regelt das oft die Familie, ohne Papier.
    meaning:
      en: With us the family often settles it, without paper.
      ar: عندنا كثيرًا ما تنظّم العائلة ذلك، بلا أوراق.
      mk: Кај нас тоа често го решава семејството, без хартија.
  - speaker: becker
    text: Und genau das führt hier oft zu Streit. Mein Fahrrad bekommst übrigens du!
    meaning:
      en: And that's exactly what often leads to quarrels here. By the way, you're getting my bike!
      ar: وهذا بالضبط ما يؤدّي هنا غالبًا إلى الخلاف. بالمناسبة، دراجتي ستكون لك!
      mk: А токму тоа тука често води до кавги. Патем, мојот велосипед е твој!
