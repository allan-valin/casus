- type: narrator
  text:
    en: A will is valid if handwritten entirely by you and signed, or made at a notary (safer, registered centrally). Children and spouse always keep a compulsory share (Pflichtteil). Without a will, statutory
      succession applies. Inheritance tax applies only above generous allowances for close family. For property abroad, foreign law may apply — ask a notary.
    ar: الوصية صالحة إذا كتبتها كلها بخط يدك ووقّعتها، أو حرّرتها عند كاتب عدل (أكثر أمانًا، وتُسجَّل مركزيًا). ويحتفظ الأولاد والزوج دائمًا بحصة إلزامية. وبلا وصية يسري الإرث القانوني. ولا تُفرض ضريبة
      الإرث إلا فوق إعفاءات سخية للعائلة القريبة. وللعقارات في الخارج قد يسري القانون الأجنبي — اسأل كاتب عدل.
    mk: Тестаментот е важечки ако е целиот рачно напишан и потпишан од вас, или составен кај нотар (посигурно, централно регистрирано). Децата и брачниот другар секогаш го задржуваат задолжителниот дел.
      Без тестамент важи законскиот ред. Данок на наследство има само над големи ослободувања за блиско семејство. За имот во странство може да важи странско право — прашајте нотар.
