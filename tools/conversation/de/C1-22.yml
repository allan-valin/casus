- type: narrator
  text:
    en: 'Reporting what the notary said, Konjunktiv I: «Er sagte, ein handschriftliches Testament sei gültig», «es gebe einen Pflichtteil». Becker keeps the source clear — it''s the notary''s word.'
    ar: 'نقل ما قاله كاتب العدل بصيغة Konjunktiv I: «Er sagte, ein handschriftliches Testament sei gültig»، «es gebe einen Pflichtteil». بيكر توضّح المصدر — إنه كلام كاتب العدل.'
    mk: 'Пренесување што рекол нотарот, Konjunktiv I: «Er sagte, ein handschriftliches Testament sei gültig», «es gebe einen Pflichtteil». Бекер го држи изворот јасен — тоа е зборот на нотарот.'
