- type: narrator
  text:
    en: In Germany interviewees may ask to approve ('autorisieren') their quotes before print — newspapers usually agree. Clichéd questions are often meant to provoke a clear answer; stay calm, concrete
      and personal.
    ar: في ألمانيا يحق لمن تُجرى معه مقابلة أن يطلب اعتماد اقتباساته قبل النشر — والصحف توافق عادةً. والأسئلة النمطية غالبًا ما تهدف إلى استفزاز جواب واضح؛ ابقي هادئة ومحدّدة وشخصية.
    mk: Во Германија интервјуираните можат да побараат да ги одобрат цитатите пред печатење — весниците обично се согласуваат. Клишеизираните прашања често имаат цел да предизвикаат јасен одговор; останете
      мирни, конкретни и лични.
