    mk: 'Кажете: „одговорноста“ — и „депортиран“ — и „убиен“ — и „ноќта на погромот“ — и „Никогаш повеќе“ — и „културата на сеќавање“ — и „Тука живееше …“ — и „достоинствено“ — и „тужбата“ — и „тужителот“
      — и „тужениот“ — и „порамнувањето“.'
