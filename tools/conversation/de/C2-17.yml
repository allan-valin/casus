steps:
- type: narrator
  text:
    en: 'The local paper is doing a series: ''New Leipzigers''. The reporter interviews you — and tries a cliché or two. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'الصحيفة المحلية تعدّ سلسلة: «سكان لايبزيغ الجدد». المراسلة تحاوركِ — وتجرّب قالبًا نمطيًا أو اثنين. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.'
    mk: 'Локалниот весник прави серија: „Новите Лајпцижани“. Репортерката ве интервјуира — и пробува клише или две. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: reporterin
    text: 'Viele Leser fragen: Wollen Migranten sich überhaupt integrieren?'
    meaning:
      en: 'Many readers ask: do migrants even want to integrate?'
      ar: 'كثير من القرّاء يسألون: هل يريد المهاجرون الاندماج أصلًا؟'
      mk: 'Многу читатели прашуваат: дали мигрантите воопшто сакаат да се интегрираат?'
  - speaker: protagonist
    text: Darf ich eine Gegenfrage stellen? Wer sind „die Migranten“? Wir sind ein Ingenieur, eine Pflegerin, ein Student...
    meaning:
      en: May I ask a counter-question? Who are 'the migrants'? We're an engineer, a nurse, a student...
      ar: هل يمكنني طرح سؤال مضاد؟ من هم «المهاجرون»؟ نحن مهندس، وممرّضة، وطالب...
      mk: Смеам ли да поставам противпрашање? Кои се „мигрантите“? Ние сме инженер, медицинска сестра, студент...
  - speaker: reporterin
    text: Gutes Argument. Aber gibt es nicht auch Probleme?
    meaning:
      en: Good point. But aren't there problems too?
      ar: حجة جيدة. لكن أليست هناك مشكلات أيضًا؟
      mk: Добар аргумент. Но зарем нема и проблеми?
  - speaker: protagonist
    text: Natürlich. Ich möchte nur betonen, dass man differenzieren muss, statt zu pauschalisieren.
    meaning:
      en: Of course. I'd just like to stress that you have to make distinctions instead of generalising.
      ar: طبعًا. أودّ فقط أن أؤكّد أنه يجب التمييز بدلًا من التعميم.
      mk: Се разбира. Само би сакала да нагласам дека треба да се прави разлика наместо да се генерализира.
  - speaker: reporterin
    text: Und aus eigener Erfahrung?
    meaning:
      en: And from your own experience?
      ar: ومن تجربتكِ الخاصة؟
      mk: А од сопствено искуство?
  - speaker: protagonist
    text: Leipzig hat mir viel gegeben — Nachbarn, einen Verein, Freunde. Und ich gebe zurück.
    meaning:
      en: Leipzig has given me a lot — neighbours, a club, friends. And I give back.
      ar: لايبزيغ أعطتني الكثير — جيرانًا ونادًيا وأصدقاء. وأنا أردّ الجميل.
      mk: Лајпциг ми даде многу — соседи, клуб, пријатели. А јас враќам.
  - speaker: reporterin
    text: 'Darf ich Sie zitieren? Vielleicht als Schlagzeile: „Vielfalt ist kein Problem“.'
    meaning:
      en: 'May I quote you? Maybe as a headline: ''Diversity is no problem''.'
      ar: 'هل يمكنني اقتباس كلامكِ؟ ربما كعنوان رئيسي: «التنوّع ليس مشكلة».'
      mk: 'Смеам ли да ве цитирам? Можеби како наслов: „Разновидноста не е проблем“.'
  - speaker: protagonist
    text: Gern — aber ich möchte das Interview vorher autorisieren.
    meaning:
      en: Gladly — but I'd like to approve the interview text beforehand.
      ar: بكل سرور — لكنني أودّ اعتماد نصّ المقابلة مسبقًا.
      mk: Со задоволство — но би сакала претходно да го одобрам интервјуто.
- type: prompt
  ask:
    en: Ask a counter-question.
    ar: اطرحي سؤالًا مضادًا.
    mk: Поставете противпрашање.
  answer:
    speaker: protagonist
    text: Darf ich eine Gegenfrage stellen?
  items:
  - die-gegenfrage
- type: narrator
  text:
    en: 'Answering clichés in a public register: question the category («Wer sind ‚die Migranten‘?»), concede («Natürlich»), then stress your point («Ich möchte betonen, dass…»). «differenzieren statt pauschalisieren»
      is the key phrase.'
    ar: 'الردّ على القوالب النمطية بأسلوب علني: شكّكي في الفئة («Wer sind ‚die Migranten‘?»)، وسلّمي («Natürlich»)، ثم أكّدي فكرتكِ («Ich möchte betonen, dass…»). و«differenzieren statt pauschalisieren»
      هي العبارة المفتاح.'
    mk: 'Одговарање на клишеа во јавен регистар: доведете ја во прашање категоријата («Wer sind ‚die Migranten‘?»), признајте («Natürlich»), па нагласете ја поентата («Ich möchte betonen, dass…»). «differenzieren
      statt pauschalisieren» е клучната фраза.'
