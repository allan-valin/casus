- type: prompt
  review: true
  ask:
    en: 'Say: “the misunderstanding — and “That came across wrong — and “It wasn''t meant badly — and “Let''s forget it! — and “a taboo — and “the weight — and “apologise sincerely — and “a compliment —
      and “offended — and “Other countries, other customs — and “Stolperstein (''stumbling stone'' memorial) — and “remembrance”.'
    ar: 'قولي: “سوء الفهم — و“فُهم ذلك خطأً — و“لم أقصد سوءًا — و“لننسَ الأمر! — و“محظور، تابو — و“الوزن — و“يعتذر بصدق — و“إطراء — و“مستاء، مُهان — و“لكل بلد عاداته — و“حجر العثرة (نصب تذكاري) — و“إحياء
      الذكرى”.'
    mk: 'Кажете: „недоразбирањето“ — и „Тоа излезе погрешно“ — и „Не беше мислено лошо“ — и „Да заборавиме!“ — и „табу“ — и „тежината“ — и „искрено се извинува“ — и „комплимент“ — и „навредено“ — и „Друга
      земја, други обичаи“ — и „Stolperstein (камен-спомен)“ — и „одбележувањето, сеќавањето“.'
  answer:
    speaker: protagonist
    text: das Missverständnis … Das kam falsch rüber … Das war nicht böse gemeint … Schwamm drüber! … ein Tabu … das Gewicht … sich aufrichtig entschuldigen … ein Kompliment … beleidigt … Andere Länder,
      andere Sitten … der Stolperstein … das Gedenken
