steps:
- type: narrator
  text:
    ar: عند شركة التأمين الصحي. تسألين إن كنتِ مؤمَّنة مع زوجكِ. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Guten Tag. Bin ich bei meinem Mann mitversichert?
    meaning:
      ar: نهارك سعيد. هل أنا مؤمَّنة مع زوجي؟
  - speaker: kasse
    text: Wenn Sie kein eigenes Einkommen haben, ja. Familienversicherung.
    meaning:
      ar: إن لم يكن لديكِ دخل خاص، نعم. التأمين العائلي.
  - speaker: protagonist
    text: Und meine Tochter?
    meaning:
      ar: وابنتي؟
  - speaker: kasse
    text: Auch. Kinder sind kostenlos mitversichert.
    meaning:
      ar: أيضًا. الأطفال مؤمَّنون مجانًا.
  - speaker: protagonist
    text: Bekomme ich eine eigene Karte?
    meaning:
      ar: هل أحصل على بطاقة خاصة بي؟
  - speaker: kasse
    text: Ja, eine Versichertenkarte mit Foto. Schicken Sie mir das Foto per App.
    meaning:
      ar: نعم، بطاقة تأمين مع صورة. أرسلي لي الصورة عبر التطبيق.
  - speaker: protagonist
    text: Und der Zahnarzt? Sind die Zähne auch versichert?
    meaning:
      ar: وطبيب الأسنان؟ هل الأسنان مؤمَّنة أيضًا؟
  - speaker: kasse
    text: Teilweise. Für manches müssen Sie zuzahlen.
    meaning:
      ar: جزئيًا. لبعض الأشياء يجب أن تدفعي مبلغًا إضافيًا.
