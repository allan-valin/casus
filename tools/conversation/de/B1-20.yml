- type: narrator
  text:
    en: '«als» is for one moment in the past: «Als ich sie vorgestellt habe…». «wenn» is for repeated, present or future events and for ''if'': «Wenn es ernst ist…».'
    ar: '«als» للحظة واحدة في الماضي: «Als ich sie vorgestellt habe…». و«wenn» للأحداث المتكررة أو الحاضرة أو المستقبلية ولمعنى «إذا»: «Wenn es ernst ist…».'
    mk: '«als» е за еден момент во минатото: «Als ich sie vorgestellt habe…». «wenn» е за повторувани, сегашни или идни настани и за „ако“: «Wenn es ernst ist…».'
