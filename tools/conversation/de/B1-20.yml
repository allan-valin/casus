- type: narrator
  text:
    en: Many German couples live together for years before marrying, or never marry; parents are told, not asked. Families elsewhere often have more say — neither is wrong, and German friends are usually
      curious, not judging.
    ar: كثير من الأزواج الألمان يسكنون معًا سنوات قبل الزواج، أو لا يتزوّجون أبدًا؛ والأهل يُخبَرون ولا يُستأذنون. وفي أماكن أخرى للعائلة رأي أكبر غالبًا — ولا أحد منهما خطأ، والأصدقاء الألمان فضوليون عادةً
      لا يحكمون.
    mk: Многу германски парови живеат заедно со години пред венчавка, или никогаш не се венчаваат; родителите се известуваат, не се прашуваат. Други семејства често имаат повеќе збор — ниту едното не е
      погрешно, а германските пријатели обично се љубопитни, не осудуваат.
