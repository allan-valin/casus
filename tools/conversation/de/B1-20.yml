steps:
- type: narrator
  text:
    en: Jonas wants to move in with his girlfriend Svenja. He asks what you think — and how it works where you're from. Listen to the conversation; you don't need to understand it yet.
    ar: يوناس يريد أن يسكن مع صديقته سفينيا. يسألك عن رأيك — وكيف يجري الأمر عندكم. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Јонас сака да се всели со девојката Свења. Ве прашува што мислите — и како е тоа кај вас. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: Svenja und ich wollen zusammenziehen. Wir sind seit zwei Jahren zusammen.
    meaning:
      en: Svenja and I want to move in together. We've been together for two years.
      ar: أنا وسفينيا نريد أن نسكن معًا. نحن معًا منذ سنتين.
      mk: Свења и јас сакаме да се вселиме заедно. Заедно сме веќе две години.
  - speaker: protagonist
    text: Dann ist es ernst! Kennen deine Eltern sie?
    meaning:
      en: Then it's serious! Do your parents know her?
      ar: إذن الأمر جدّي! هل يعرفها والداك؟
      mk: Тогаш е сериозно! Ја познаваат ли твоите родители?
  - speaker: jonas
    text: Ja. Als ich sie meinen Eltern vorgestellt habe, war meine Mutter sofort verliebt.
    meaning:
      en: Yes. When I introduced her to my parents, my mother loved her straight away.
      ar: نعم. حين عرّفتُها على والديّ، أحبّتها أمي فورًا.
      mk: Да. Кога ја запознав со родителите, мајка ми веднаш се вљуби во неа.
  - speaker: protagonist
    text: Bei uns redet die Familie mehr mit. Zusammenziehen ohne Heirat? Schwierig.
    meaning:
      en: With us the family has more say. Moving in together without marriage? Difficult.
      ar: عندنا العائلة لها رأي أكبر. السكن معًا بلا زواج؟ صعب.
      mk: Кај нас семејството има повеќе збор. Заедно без венчавка? Тешко.
  - speaker: jonas
    text: Und wenn du jemanden liebst?
    meaning:
      en: And if you love someone?
      ar: وإذا أحببتَ أحدًا؟
      mk: А ако некого сакаш?
  - speaker: protagonist
    text: Wenn es ernst ist, besucht man zuerst die Familien. Dann heiratet man.
    meaning:
      en: If it's serious, you first visit the families. Then you marry.
      ar: إذا كان الأمر جدّيًا، يزور المرء العائلتين أولًا. ثم يتزوّج.
      mk: Ако е сериозно, прво се посетуваат семејствата. Потоа се венчава.
  - speaker: jonas
    text: Bei uns heiraten viele erst nach Jahren. Oder nie!
    meaning:
      en: With us, many only marry after years. Or never!
      ar: عندنا كثيرون يتزوّجون بعد سنوات فقط. أو أبدًا!
      mk: Кај нас многумина се венчаваат дури по години. Или никогаш!
  - speaker: protagonist
    text: Jede Beziehung ist anders. Viel Glück euch beiden!
    meaning:
      en: Every relationship is different. Good luck to you both!
      ar: كل علاقة مختلفة. بالتوفيق لكما!
      mk: Секоја врска е различна. Среќно на двајцата!
- type: prompt
  ask:
    en: 'He says: we want to move in together.'
    ar: 'يقول: نريد أن نسكن معًا.'
    mk: 'Тој вели: сакаме да се вселиме заедно.'
  answer:
    speaker: protagonist
    text: Wir wollen zusammenziehen.
  items:
  - zusammenziehen
- type: prompt
  ask:
