steps:
- type: narrator
  text:
    en: Rents keep rising. Could you buy a flat? Herr Vogel at the bank explains what a purchase really costs. Listen to the conversation; you don't need to understand it yet.
    ar: الإيجارات ترتفع باستمرار. هل يمكنكِ شراء شقة؟ السيد فوغل في البنك يشرح كم يكلّف الشراء فعلًا. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Кириите постојано растат. Дали би можеле да купите стан? Господин Фогел во банката објаснува колку навистина чини купувањето. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: bankberater
    text: Für die Finanzierung einer Wohnung brauchen Sie zuerst Eigenkapital.
    meaning:
      en: To finance a flat you first need your own capital.
      ar: لتمويل شقة تحتاجين أولًا إلى رأس مال خاص.
      mk: За финансирање на стан прво ви треба сопствен капитал.
  - speaker: protagonist
    text: Wie viel?
    meaning:
      en: How much?
      ar: كم؟
      mk: Колку?
  - speaker: bankberater
    text: 'Mindestens die Kaufnebenkosten: Grunderwerbsteuer, Notar, Grundbuch und eventuell der Makler. Besser mehr.'
    meaning:
      en: 'At least the additional purchase costs: land transfer tax, notary, land registry and possibly the agent. More is better.'
      ar: 'على الأقل تكاليف الشراء الإضافية: ضريبة نقل الملكية، كاتب العدل، السجل العقاري، وربما السمسار. والأفضل أكثر.'
      mk: 'Најмалку дополнителните трошоци: данок на промет, нотар, катастар и евентуално агент. Подобро повеќе.'
  - speaker: protagonist
    text: Und der Rest ist ein Kredit?
    meaning:
      en: And the rest is a loan?
      ar: والباقي قرض؟
      mk: А остатокот е кредит?
  - speaker: bankberater
    text: Genau. Die monatliche Rate besteht aus Zinsen und Tilgung. Die Höhe der Zinsen ändert sich mit dem Markt.
    meaning:
      en: Exactly. The monthly instalment is interest plus repayment. The interest level changes with the market.
      ar: بالضبط. القسط الشهري يتكوّن من الفوائد وسداد أصل القرض. مستوى الفوائد يتغيّر مع السوق.
      mk: Точно. Месечната рата се состои од камата и отплата. Висината на каматата се менува со пазарот.
  - speaker: protagonist
    text: In Leipzig ist alles teurer geworden.
    meaning:
      en: Everything has got more expensive in Leipzig.
      ar: كل شيء صار أغلى في لايبزيغ.
      mk: Во Лајпциг сè поскапе.
  - speaker: bankberater
    text: Auf dem Land und im Osten ist Eigentum noch deutlich günstiger. Aber prüfen Sie die Verkehrsanbindung.
    meaning:
      en: In the countryside and in the east, property is still considerably cheaper. But check the transport links.
      ar: في الريف وفي الشرق لا تزال الملكية أرخص بكثير. لكن تحقّقي من المواصلات.
      mk: На село и на исток имотот е сè уште значително поевтин. Но проверете го превозот.
  - speaker: protagonist
    text: Danke. Ich rechne erst einmal — und spare weiter.
    meaning:
      en: Thank you. I'll do the maths first — and keep saving.
      ar: شكرًا. سأحسب أولًا — وأواصل الادّخار.
      mk: Благодарам. Прво ќе пресметам — и ќе продолжам да штедам.
- type: prompt
  ask:
    en: 'Say: the financing of a flat.'
    ar: 'قولي: تمويل شقة.'
    mk: 'Кажете: финансирањето на стан.'
  answer:
    speaker: protagonist
    text: Die Finanzierung einer Wohnung.
  items:
  - die-finanzierung
- type: prompt
  ask:
    en: 'Say: you first need own capital.'
    ar: 'قولي: تحتاجين أولًا إلى رأس مال خاص.'
    mk: 'Кажете: прво треба сопствен капитал.'
  answer:
    speaker: protagonist
    text: Zuerst braucht man Eigenkapital.
  items:
  - das-eigenkapital
- type: narrator
  text:
    en: 'Money German is nominal: «die Finanzierung einer Wohnung» (= financing a flat), «die Höhe der Zinsen» (= how high the interest is), «die Kaufnebenkosten» (= what you pay on top of the price).'
    ar: 'ألمانية المال اسمية: «die Finanzierung einer Wohnung» (= تمويل شقة)، «die Höhe der Zinsen» (= مقدار الفوائد)، «die Kaufnebenkosten» (= ما تدفعينه فوق السعر).'
    mk: 'Финансискиот германски е номинален: «die Finanzierung einer Wohnung» (= финансирање стан), «die Höhe der Zinsen» (= колку е висока каматата), «die Kaufnebenkosten» (= што плаќате над цената).'
- type: prompt
  ask:
    en: 'Say: the additional purchase costs.'
    ar: 'قولي: تكاليف الشراء الإضافية.'
    mk: 'Кажете: дополнителните трошоци.'
  answer:
    speaker: protagonist
    text: Die Kaufnebenkosten.
  items:
  - die-kaufnebenkosten
- type: prompt
  ask:
    en: 'Say: land transfer tax, notary, agent.'
    ar: 'قولي: ضريبة نقل الملكية، كاتب العدل، السمسار.'
