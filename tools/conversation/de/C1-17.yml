- type: prompt
  ask:
    en: 'Ask: and the rest is a loan?'
    ar: 'اسألي: والباقي قرض؟'
    mk: 'Прашајте: а остатокот е кредит?'
  answer:
    speaker: protagonist
    text: Und der Rest ist ein Kredit?
  items:
  - der-kredit
- type: prompt
  ask:
    en: 'Say: interest and repayment.'
    ar: 'قولي: الفوائد وسداد أصل القرض.'
    mk: 'Кажете: камата и отплата.'
  answer:
    speaker: protagonist
    text: Zinsen und Tilgung.
  items:
  - die-zinsen
  - die-tilgung
- type: prompt
  ask:
    en: 'Say: in the countryside it''s cheaper.'
    ar: 'قولي: في الريف أرخص.'
    mk: 'Кажете: на село е поевтино.'
  answer:
    speaker: protagonist
    text: Auf dem Land ist es günstiger.
  items:
  - auf-dem-land
- type: narrator
  text:
    en: 'Buying costs more than the price: land transfer tax (rate set by each state), notary and land registry, and often an estate agent. Banks expect you to pay at least these extra costs from your own
      money, better more. Property is far cheaper in the east and the countryside than in big western cities. Rates change constantly — compare offers from several banks.'
    ar: 'الشراء يكلّف أكثر من السعر: ضريبة نقل الملكية (تحدّد كل ولاية نسبتها)، وكاتب العدل والسجل العقاري، وغالبًا سمسار. والبنوك تتوقّع أن تدفعي على الأقل هذه التكاليف الإضافية من مالكِ، والأفضل أكثر.
      والعقارات أرخص بكثير في الشرق والريف منها في المدن الغربية الكبيرة. النسب تتغيّر باستمرار — قارني عروض عدة بنوك.'
    mk: 'Купувањето чини повеќе од цената: данок на промет на недвижности (стапката ја одредува секоја покраина), нотар и катастар, и често агент. Банките очекуваат барем овие дополнителни трошоци да ги
      платите од свои пари, подобро повеќе. Имотот е многу поевтин на исток и на село отколку во големите западни градови. Стапките постојано се менуваат — споредете понуди од повеќе банки.'
