steps:
- type: narrator
  text:
    en: Saturday, minus eight, and the radiators are cold. You call the property management. Listen to the conversation; you don't need to understand it yet.
    ar: يوم السبت، ثماني درجات تحت الصفر، والمدافئ باردة. تتصلين بإدارة العقار. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Сабота, минус осум, а радијаторите се ладни. Се јавувате во управата на зградата. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: verwaltung
    text: Hausverwaltung Meyer, guten Tag.
    meaning:
      en: Meyer Property Management, good morning.
      ar: إدارة عقارات ماير، نهارك سعيد.
      mk: Управа Мајер, добар ден.
  - speaker: protagonist
    text: Guten Tag. Die Heizung ist kaputt. Es ist sehr kalt in der Wohnung.
    meaning:
      en: Good morning. The heating is broken. It's very cold in the flat.
      ar: نهارك سعيد. التدفئة معطّلة. الجو بارد جدًا في الشقة.
      mk: Добар ден. Греењето е расипано. Многу е ладно во станот.
  - speaker: verwaltung
    text: Seit wann?
    meaning:
      en: Since when?
      ar: منذ متى؟
      mk: Од кога?
  - speaker: protagonist
    text: Seit heute Morgen.
    meaning:
      en: Since this morning.
      ar: منذ صباح اليوم.
      mk: Од утрово.
  - speaker: verwaltung
    text: Der Handwerker kann am Montag kommen.
    meaning:
      en: The repairman can come on Monday.
      ar: الفني يمكنه أن يأتي يوم الاثنين.
      mk: Мајсторот може да дојде во понеделник.
  - speaker: protagonist
    text: Am Montag? Das ist zu spät! Es sind minus acht Grad.
    meaning:
      en: On Monday? That's too late! It's minus eight.
      ar: يوم الاثنين؟ هذا متأخر جدًا! الحرارة ثماني درجات تحت الصفر.
      mk: Во понеделник? Тоа е предоцна! Минус осум е.
  - speaker: verwaltung
    text: Dann rufen Sie den Notdienst an. Ich gebe Ihnen die Nummer.
    meaning:
      en: Then call the emergency service. I'll give you the number.
      ar: إذن اتصلي بخدمة الطوارئ. سأعطيك الرقم.
      mk: Тогаш јавете се на дежурната служба. Ќе ви го дадам бројот.
  - speaker: protagonist
    text: Muss ich etwas bezahlen?
    meaning:
      en: Do I have to pay anything?
      ar: هل يجب أن أدفع شيئًا؟
      mk: Морам ли нешто да платам?
  - speaker: verwaltung
    text: Nein, die Heizung ist Sache des Vermieters.
    meaning:
      en: No, the heating is the landlord's responsibility.
      ar: لا، التدفئة من مسؤولية المؤجِّر.
      mk: Не, греењето е обврска на сопственикот на станот.
