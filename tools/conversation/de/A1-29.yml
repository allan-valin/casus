- type: narrator
  text:
    en: Heating in winter is the landlord's duty; outside office hours property managers name an emergency service. Report defects in writing too, by e-mail — it counts later if the rent is reduced.
    ar: التدفئة في الشتاء من واجب المؤجِّر؛ وخارج ساعات العمل تعطي إدارات العقار رقم خدمة طوارئ. أبلغي عن العطل كتابيًا أيضًا، بالبريد الإلكتروني — فهذا يُعتدّ به لاحقًا إن خُفّض الإيجار.
    mk: Греењето во зима е обврска на сопственикот на станот; надвор од работното време управите даваат дежурна служба. Пријавете го дефектот и писмено, по е-пошта — тоа се смета подоцна ако се намалува
      киријата.
