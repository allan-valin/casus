- type: narrator
  text:
    en: 'Official papers pack actions into nouns: «zur Kenntnisnahme» (= so that you take note), «Vertragsänderung» (= the contract is changed), «Prüfung durch einen Anwalt» (= a lawyer checks it). Unpack
      them before you sign.'
    ar: 'الأوراق الرسمية تحشر الأفعال في أسماء: «zur Kenntnisnahme» (= لكي تأخذ علمًا)، «Vertragsänderung» (= العقد يتغيّر)، «Prüfung durch einen Anwalt» (= محامٍ يراجعه). فكّكها قبل أن توقّع.'
