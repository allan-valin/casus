steps:
- type: narrator
  text:
    en: The firm was sold. Months ago you signed a paper 'acknowledging the change'. Now the health insurer sends a bill. Tim reads the papers with you. Listen to the conversation; you don't need to understand
      it yet.
    ar: بيعت الشركة. قبل أشهر وقّعتَ ورقة «علمًا بالتغيير». الآن يرسل صندوق التأمين الصحي فاتورة. تيم يقرأ الأوراق معك. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Die Krankenkasse will eine Nachzahlung. Für sechs Monate!
    meaning:
      en: The health insurer wants a back payment. For six months!
      ar: صندوق التأمين يطلب مبلغًا متأخرًا. عن ستة أشهر!
  - speaker: tim
    text: 'Zeig mal. ... Hier: „Betriebsübergang — zur Kenntnisnahme“. Du hast unterschrieben.'
    meaning:
      en: 'Show me. ... Here: ''Transfer of the business — for acknowledgement''. You signed.'
      ar: 'أرني. ... هنا: «انتقال ملكية المنشأة — للعلم». لقد وقّعت.'
  - speaker: protagonist
    text: Der neue Chef sagte, das sei nur eine Formalität.
    meaning:
      en: The new boss said it was only a formality.
      ar: المدير الجديد قال إنها مجرّد إجراء شكلي.
  - speaker: tim
    text: 'Auf Seite zwei steht eine Vertragsänderung: aus Vollzeit wurde ein Minijob. Damit endete dein Versicherungsstatus.'
    meaning:
      en: 'Page two has a change of contract: full time became a minijob. That ended your insurance status.'
      ar: 'في الصفحة الثانية تعديل للعقد: تحوّل الدوام الكامل إلى عمل صغير. وبذلك انتهى وضع تأمينك.'
  - speaker: protagonist
    text: Und der Lohn kam immer zu spät...
    meaning:
      en: And the wages always came late...
      ar: والأجر كان يتأخّر دائمًا...
  - speaker: tim
    text: 'Lohnrückstand ist ein Fall für das Arbeitsgericht. Aber zuerst: Prüfung durch einen Anwalt.'
    meaning:
      en: 'Wages in arrears are a case for the labour court. But first: a check by a lawyer.'
      ar: 'الأجور المتأخرة قضية لمحكمة العمل. لكن أولًا: مراجعة من محامٍ.'
  - speaker: protagonist
    text: Und die Krankenkasse? So viel Geld habe ich nicht.
    meaning:
      en: And the health insurer? I don't have that much money.
      ar: وصندوق التأمين؟ ليس لديّ هذا المبلغ.
  - speaker: tim
    text: Ruf an und bitte um Ratenzahlung. Das geht fast immer. Und nie wieder ohne zu lesen unterschreiben!
    meaning:
      en: Call and ask for instalments. That almost always works. And never again sign without reading!
      ar: اتصل واطلب الدفع بالتقسيط. هذا ممكن دائمًا تقريبًا. ولا توقّع أبدًا مرة أخرى دون قراءة!
