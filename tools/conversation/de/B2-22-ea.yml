- type: narrator
  text:
    en: Never sign what you haven't read and understood — 'only a formality' is a warning sign. A new owner takes over existing contracts unchanged; a change to your hours or insurance needs your signature,
      so ask what you are signing. If an insurer later claims contributions, ask for a payment plan (Ratenzahlung) — it is almost always granted. Unpaid wages can be claimed at the labour court; there are
      short deadlines, so get advice quickly (unions, lawyers, the Arbeitnehmerkammer in some states).
    ar: لا توقّع أبدًا ما لم تقرأه وتفهمه — «مجرّد إجراء شكلي» علامة تحذير. المالك الجديد يتسلّم العقود القائمة دون تغيير؛ وأي تغيير في ساعاتك أو تأمينك يحتاج توقيعك، فاسأل عمّا توقّع عليه. وإذا طالب صندوق
      التأمين لاحقًا باشتراكات، فاطلب خطة تقسيط — تُمنح دائمًا تقريبًا. والأجور غير المدفوعة يمكن المطالبة بها في محكمة العمل؛ وهناك مهل قصيرة، فاطلب المشورة بسرعة (النقابات، المحامون).
