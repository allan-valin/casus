steps:
- type: narrator
  text:
    en: You show Jonas a postcard with Lederhosen. He laughs — and asks about your country's clichés. Listen to the conversation; you don't need to understand it yet.
    ar: تُرين يوناس بطاقة بريدية عليها سراويل جلدية. يضحك — ويسألكِ عن الصور النمطية عن بلدكِ. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Му покажувате на Јонас разгледница со кожени панталони. Тој се смее — и прашува за клишеата за вашата земја. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Ist das Deutschland? Lederhosen und Bier?
    meaning:
      en: Is this Germany? Lederhosen and beer?
      ar: هل هذه ألمانيا؟ سراويل جلدية وبيرة؟
      mk: Ова ли е Германија? Кожени панталони и пиво?
  - speaker: jonas
    text: Das ist ein Klischee aus Bayern! In Sachsen ist alles anders.
    meaning:
      en: That's a cliché from Bavaria! In Saxony everything's different.
      ar: هذه صورة نمطية من بافاريا! في ساكسونيا كل شيء مختلف.
      mk: Тоа е клише од Баварија! Во Саксонија сè е поинаку.
  - speaker: protagonist
    text: Wie anders?
    meaning:
      en: Different how?
      ar: مختلف كيف؟
      mk: Како поинаку?
  - speaker: jonas
    text: Wir trinken mehr Kaffee als Bier! Und Bayern ist größer als Sachsen.
    meaning:
      en: We drink more coffee than beer! And Bavaria is bigger than Saxony.
      ar: نشرب القهوة أكثر من البيرة! وبافاريا أكبر من ساكسونيا.
      mk: Пиеме повеќе кафе отколку пиво! А Баварија е поголема од Саксонија.
  - speaker: protagonist
    text: Und das Wetter? Kälter als bei mir zu Hause!
    meaning:
      en: And the weather? Colder than at home!
      ar: والطقس؟ أبرد مما في بلدي!
      mk: А времето? Постудено отколку дома!
  - speaker: jonas
    text: Und was sind die Klischees bei euch?
    meaning:
      en: And what are the clichés about your country?
      ar: وما الصور النمطية عندكم؟
      mk: А кои се клишеата кај вас?
  - speaker: protagonist
    text: Viele denken, es ist gefährlich bei uns. Das stimmt nicht.
    meaning:
      en: Many think it's dangerous where I'm from. That's not true.
      ar: كثيرون يظنون أن بلدنا خطير. هذا غير صحيح.
      mk: Многумина мислат дека кај нас е опасно. Тоа не е точно.
  - speaker: jonas
    text: Siehst du — Vorurteile gibt es überall.
    meaning:
      en: See — prejudices are everywhere.
      ar: أرأيتِ — الأحكام المسبقة موجودة في كل مكان.
      mk: Гледаш — предрасуди има насекаде.
  - speaker: protagonist
    text: 'Was ich am meisten mag: das Brot!'
    meaning:
      en: 'What I like most: the bread!'
      ar: 'أكثر ما أحبه: الخبز!'
      mk: 'Тоа што најмногу ми се допаѓа: лебот!'
- type: prompt
  ask:
    en: 'Say: that''s a cliché.'
    ar: 'قولي: هذه صورة نمطية.'
    mk: 'Кажете: тоа е клише.'
  answer:
    speaker: protagonist
    text: Das ist ein Klischee.
  items:
  - das-klischee
- type: prompt
  ask:
    en: 'Say: leather trousers.'
    ar: 'قولي: سروال جلدي.'
    mk: 'Кажете: кожени панталони.'
  answer:
    speaker: protagonist
    text: Die Lederhose.
  items:
  - die-lederhose
- type: prompt
  ask:
    en: 'Say: in Bavaria everything''s different.'
    ar: 'قولي: في بافاريا كل شيء مختلف.'
    mk: 'Кажете: во Баварија сè е поинаку.'
  answer:
    speaker: protagonist
    text: In Bayern ist alles anders.
  items:
  - in-bayern
  - anders
- type: narrator
  text:
    en: 'Comparisons: add -er and use «als»: «größer als» (bigger than), «kälter als» (colder than). The most: «am meisten», «am größten».'
    ar: 'المقارنة: أضيفي -er واستعملي «als»: «größer als» (أكبر من)، «kälter als» (أبرد من). والأكثر: «am meisten»، «am größten».'
    mk: 'Споредба: додајте -er и користете «als»: «größer als» (поголем од), «kälter als» (постудено од). Најмногу: «am meisten», «am größten».'
- type: prompt
  ask:
    en: 'Say: Bavaria is bigger than Saxony.'
    ar: 'قولي: بافاريا أكبر من ساكسونيا.'
    mk: 'Кажете: Баварија е поголема од Саксонија.'
  answer:
    speaker: protagonist
    text: Bayern ist größer als Sachsen.
  items:
  - groesser-als
  - in-sachsen
- type: prompt
  ask:
    en: 'Say: colder than at home!'
    ar: 'قولي: أبرد مما في بلدي!'
    mk: 'Кажете: постудено отколку дома!'
  answer:
    speaker: protagonist
    text: Kälter als zu Hause!
  items:
  - kaelter-als
- type: prompt
  ask:
    en: He asks about the clichés where you're from.
    ar: يسألكِ عن الصور النمطية عندكم.
    mk: Тој прашува за клишеата кај вас.
  answer:
