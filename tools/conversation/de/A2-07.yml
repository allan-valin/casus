    ar: 'قولي: الأحكام المسبقة موجودة في كل مكان.'
    mk: 'Кажете: предрасуди има насекаде.'
  answer:
    speaker: protagonist
    text: Vorurteile gibt es überall.
  items:
  - das-vorurteil
- type: prompt
  ask:
    en: 'Say: what I like most: the bread!'
    ar: 'قولي: أكثر ما أحبه: الخبز!'
    mk: 'Кажете: најмногу ми се допаѓа лебот!'
  answer:
    speaker: protagonist
    text: Am meisten mag ich das Brot!
  items:
  - am-meisten
- type: narrator
  text:
    en: Lederhosen, beer halls and Alps are Bavaria, not all of Germany; Saxony prides itself on coffee and cake. And every newcomer meets the clichés about their own country — answering with humour works
      best.
    ar: السراويل الجلدية وقاعات البيرة والألب هي بافاريا وليست كل ألمانيا؛ وساكسونيا تفخر بالقهوة والكعك. وكل قادم جديد يصادف الصور النمطية عن بلده — والرد بروح الدعابة هو الأفضل.
    mk: Кожените панталони, пивниците и Алпите се Баварија, не цела Германија; Саксонија се гордее со кафе и колачи. А секој дојденец ги среќава клишеата за својата земја — најдобро е да одговори со хумор.
- type: narrator
  for:
  - ar
  - mk
  text:
    ar: 'وأنتِ أيضًا ستسمعين صورًا نمطية عن سوريا والعرب. صديقة يوناس من الأردن تقول: «Nicht alle Araber sind gleich» — ليس كل العرب متشابهين.'
    mk: И вие ќе слушнете клишеа — дека Македонија е Русија, или дека е многу далеку. Одговорете со хумор и со една фотографија од Охрид.
