- type: narrator
  text:
    en: 'Extended attributes pack a whole clause before the noun: «die in Studien belegte Produktivität» (= the productivity that is shown in studies), «der seit Jahren bekannte Fachkräftemangel». Typical
      of written and formal German — read from the article to the noun, then back.'
    ar: 'الصفات الممتدة تحشر جملة كاملة قبل الاسم: «die in Studien belegte Produktivität» (= الإنتاجية التي أُثبتت في الدراسات)، «der seit Jahren bekannte Fachkräftemangel». نموذجية في الألمانية المكتوبة
      والرسمية — اقرئي من أداة التعريف إلى الاسم ثم ارجعي.'
    mk: 'Проширените атрибути пакуваат цела реченица пред именката: «die in Studien belegte Produktivität» (= продуктивноста што е докажана во студии), «der seit Jahren bekannte Fachkräftemangel». Типично
      за пишан и формален германски — читајте од членот до именката, па назад.'
