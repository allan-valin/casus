steps:
- type: narrator
  text:
    en: 'A new VHS course: debating. Motion of the evening: ''A four-day week for everyone''. You argue against Lena. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'دورة جديدة في الجامعة الشعبية: المناظرة. موضوع المساء: «أسبوع عمل من أربعة أيام للجميع». تجادلين ضد لينا. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.'
    mk: 'Нов курс на народниот универзитет: дебата. Темата на вечерта: „Четиридневна работна недела за сите“. Дебатирате против Лена. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: hartmann
    text: 'Die These: Die Vier-Tage-Woche für alle. Lena, Ihr Argument.'
    meaning:
      en: 'The motion: the four-day week for all. Lena, your argument.'
      ar: 'الأطروحة: أسبوع عمل من أربعة أيام للجميع. لينا، حجتكِ.'
      mk: 'Тезата: четиридневна недела за сите. Лена, вашиот аргумент.'
  - speaker: lena
    text: Die in Studien belegte höhere Produktivität spricht dafür. Ausgeruhte Menschen arbeiten besser.
    meaning:
      en: The higher productivity shown in studies speaks for it. Rested people work better.
      ar: الإنتاجية الأعلى المثبتة في الدراسات تؤيّد ذلك. الناس المرتاحون يعملون أفضل.
      mk: Повисоката продуктивност докажана во студии зборува за тоа. Одморените луѓе работат подобро.
  - speaker: protagonist
    text: Da widerspreche ich. Die oft genannte Produktivität gilt nicht für alle Berufe.
    meaning:
      en: I disagree there. The often-cited productivity doesn't apply to all jobs.
      ar: هنا أعترض. الإنتاجية التي يُستشهد بها كثيرًا لا تنطبق على كل المهن.
      mk: Тука не се согласувам. Често спомнуваната продуктивност не важи за сите професии.
  - speaker: protagonist
    text: Eine Pflegekraft kann nicht in vier Tagen fünf Tage Patienten versorgen.
    meaning:
      en: A nurse can't care for patients for five days in four.
      ar: الممرّضة لا تستطيع رعاية المرضى خمسة أيام في أربعة.
      mk: Медицинска сестра не може за четири дена да ги згрижи пациентите за пет.
  - speaker: lena
    text: Dann stellt man mehr Leute ein.
    meaning:
      en: Then you hire more people.
      ar: إذن يوظّفون أشخاصًا أكثر.
      mk: Тогаш се вработуваат повеќе луѓе.
  - speaker: protagonist
    text: Bei dem seit Jahren bekannten Fachkräftemangel? Woher?
    meaning:
      en: With the skills shortage known for years? From where?
      ar: مع نقص العمالة الماهرة المعروف منذ سنوات؟ من أين؟
      mk: Со недостигот на стручен кадар познат со години? Од каде?
  - speaker: hartmann
    text: Ein starkes Gegenargument! Wer war überzeugender?
    meaning:
      en: A strong counter-argument! Who was more convincing?
      ar: حجة مضادة قوية! من كان أكثر إقناعًا؟
      mk: Силен контрааргумент! Кој беше поубедлив?
  - speaker: lena
    text: Leider sie. Nächstes Mal tauschen wir die Seiten!
    meaning:
      en: Sadly, her. Next time we swap sides!
      ar: للأسف هي. في المرة القادمة نتبادل الجانبين!
      mk: За жал, таа. Следниот пат ги менуваме страните!
- type: prompt
  ask:
    en: 'Say: the debate.'
    ar: 'قولي: المناظرة.'
    mk: 'Кажете: дебатата.'
  answer:
    speaker: protagonist
    text: Die Debatte.
  items:
  - die-debatte
- type: prompt
  ask:
