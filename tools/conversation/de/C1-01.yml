- type: narrator
  text:
    en: German debating values a clear thesis, evidence and a direct reply to the other side's best point — not volume or personal attack. «Da widerspreche ich» is polite and normal.
    ar: المناظرة الألمانية تُقدّر الأطروحة الواضحة والدليل والردّ المباشر على أقوى نقطة لدى الطرف الآخر — لا علوّ الصوت ولا الهجوم الشخصي. وعبارة «Da widerspreche ich» مؤدبة وعادية.
    mk: Германската дебата цени јасна теза, докази и директен одговор на најдобрата поента на другата страна — не гласност или личен напад. «Da widerspreche ich» е учтиво и нормално.
