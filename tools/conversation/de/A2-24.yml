- type: narrator
  text:
    en: Johann Sebastian Bach worked in Leipzig for 27 years as cantor of the Thomaskirche, where his grave is; the boys' choir still sings there most Fridays and Saturdays. The same city has one of Germany's
      biggest techno scenes.
    ar: عمل يوهان سيباستيان باخ في لايبزيغ 27 عامًا قائدًا لجوقة كنيسة توماس، حيث قبره؛ وما زالت جوقة الأولاد تغني هناك أغلب أيام الجمعة والسبت. والمدينة نفسها فيها من أكبر مشاهد التكنو في ألمانيا.
    mk: Јохан Себастијан Бах работел во Лајпциг 27 години како кантор на црквата Томас, каде што е и неговиот гроб; момчешкиот хор и денес пее таму речиси секој петок и сабота. Истиот град има една од најголемите
      техно-сцени во Германија.
