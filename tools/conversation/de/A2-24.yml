steps:
- type: narrator
  text:
    en: 'Friday evening at the Thomaskirche: the boys'' choir sings Bach. Afterwards Jonas wants to go to a techno club. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'مساء الجمعة في كنيسة توماس: جوقة الأولاد تغني باخ. بعدها يريد يوناس الذهاب إلى نادي تكنو. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.'
    mk: 'Петок навечер во црквата Томас: момчешкиот хор пее Бах. Потоа Јонас сака во техно-клуб. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: jonas
    text: Das ist der Thomanerchor. Bach war hier Kantor.
    meaning:
      en: That's the Thomanerchor. Bach was cantor here.
      ar: هذه جوقة توماس. كان باخ قائد الجوقة هنا.
      mk: Ова е хорот Томанер. Бах бил кантор тука.
  - speaker: protagonist
    text: Bach? Der berühmte Komponist?
    meaning:
      en: Bach? The famous composer?
      ar: باخ؟ المؤلف الموسيقي المشهور؟
      mk: Бах? Познатиот композитор?
  - speaker: jonas
    text: Genau. Sein Grab ist hier in der Kirche.
    meaning:
      en: Exactly. His grave is here in the church.
      ar: بالضبط. قبره هنا في الكنيسة.
      mk: Точно. Неговиот гроб е тука во црквата.
  - speaker: protagonist
    text: Das Konzert gefällt mir sehr.
    meaning:
      en: I like the concert very much.
      ar: الحفلة تعجبني كثيرًا.
      mk: Концертот многу ми се допаѓа.
  - speaker: jonas
    text: 'Mir auch. Aber jetzt: Techno! Leipzig gehört auch den Clubs.'
    meaning:
      en: 'Me too. But now: techno! Leipzig belongs to the clubs too.'
      ar: 'وأنا أيضًا. لكن الآن: تكنو! لايبزيغ ملك للنوادي أيضًا.'
      mk: 'И мене. Но сега: техно! Лајпциг им припаѓа и на клубовите.'
  - speaker: protagonist
    text: Klassisch und Techno am selben Abend?
    meaning:
      en: Classical and techno on the same evening?
      ar: كلاسيكي وتكنو في الأمسية نفسها؟
      mk: Класично и техно во иста вечер?
  - speaker: jonas
    text: Warum nicht? Ein Bier hilft dir.
    meaning:
      en: Why not? A beer will help.
      ar: لم لا؟ بيرة تساعدك.
      mk: Зошто да не? Едно пиво ќе ти помогне.
  - speaker: protagonist
    text: Lieber eine Cola. Bier schmeckt mir nicht.
    meaning:
      en: I'd rather have a cola. I don't like beer.
      ar: أفضّل كولا. طعم البيرة لا يعجبني.
      mk: Повеќе кола. Пивото не ми е вкусно.
