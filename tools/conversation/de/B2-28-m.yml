steps:
- type: narrator
  text:
    mk: Денот на тргнување на училиште (Einschulung). Лука со голема Schultüte, вие и сите роднини во салата. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: klassenlehrerin
    text: Liebe Eltern, liebe Großeltern, herzlich willkommen zum ersten Schultag!
    meaning:
      mk: Драги родители, драги баби и дедовци, срдечно добредојдовте на првиот училиштен ден!
  - speaker: luka
    text: Opa, schau! Meine Schultüte ist so groß wie ich!
    meaning:
      mk: Дедо, види! Мојата Schultüte е голема колку мене!
  - speaker: protagonist
    text: Und dein Ranzen auch! Bist du aufgeregt?
    meaning:
      mk: И торбата исто! Возбуден ли си?
  - speaker: luka
    text: Ein bisschen. Wer ist meine Klassenlehrerin?
    meaning:
      mk: Малку. Која е мојата класна?
  - speaker: klassenlehrerin
    text: Das bin ich, Frau Hahn. Kommt, Kinder, wir gehen in die Klasse!
    meaning:
      mk: Тоа сум јас, госпоѓа Хан. Ајде деца, одиме во училницата!
  - speaker: petar
    text: Papa, machst du ein Foto? Für Oma in Bitola.
    meaning:
      mk: Тато, ќе направиш фотографија? За баба во Битола.
  - speaker: protagonist
    text: Natürlich. Ich bin so stolz. Bei uns gab es keine Schultüte!
    meaning:
      mk: Се разбира. Толку сум горд. Кај нас немаше Schultüte!
  - speaker: anja
    text: Und nach der Feier gehen wir alle essen.
    meaning:
      mk: А по прославата одиме сите на ручек.
