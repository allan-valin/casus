- type: narrator
  text:
    en: «Altbau» flats (built before about 1950) have high ceilings, wooden floors and thick walls; «Neubau» flats are insulated and cheaper to heat. Many Germans love the Altbau — and its creaking floors.
    ar: شقق «Altbau» (المبنية قبل 1950 تقريبًا) سقوفها عالية وأرضياتها خشبية وجدرانها سميكة؛ وشقق «Neubau» معزولة وتدفئتها أرخص. كثير من الألمان يحبون الـAltbau — وصرير أرضياته.
    mk: Становите «Altbau» (градени пред околу 1950) имаат високи тавани, дрвени подови и дебели ѕидови; «Neubau» се изолирани и поевтини за греење. Многу Германци го сакаат Altbau — и подот што крцка.
