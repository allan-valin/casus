steps:
- type: narrator
  text:
    en: Your flat is in an old building from 1905. Frau Becker explains why it stays warm. Listen to the conversation; you don't need to understand it yet.
    ar: شقتكِ في مبنى قديم من عام 1905. السيدة بيكر تشرح لماذا يبقى دافئًا. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Станот ви е во стара зграда од 1905. Госпоѓа Бекер објаснува зошто останува топол. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: becker
    text: Das Haus ist von 1905. Ein Altbau.
    meaning:
      en: The house is from 1905. An old building.
      ar: البيت من عام 1905. مبنى قديم.
      mk: Куќата е од 1905. Стара зграда.
  - speaker: protagonist
    text: Darum sind die Decken so hoch!
    meaning:
      en: That's why the ceilings are so high!
      ar: لهذا السقوف عالية جدًا!
      mk: Затоа таваните се толку високи!
  - speaker: becker
    text: Genau. Und die Wände sind aus Stein, sehr dick.
    meaning:
      en: Exactly. And the walls are stone, very thick.
      ar: بالضبط. والجدران من الحجر، سميكة جدًا.
      mk: Точно. А ѕидовите се од камен, многу дебели.
  - speaker: protagonist
    text: Und der Boden ist aus Holz.
    meaning:
      en: And the floor is wood.
      ar: والأرضية من الخشب.
      mk: А подот е од дрво.
  - speaker: becker
    text: Ja, alt, aber schön. Im Winter ist es warm, im Sommer kühl.
    meaning:
      en: Yes, old, but lovely. In winter it's warm, in summer cool.
      ar: نعم، قديمة لكنها جميلة. في الشتاء دافئ وفي الصيف بارد.
      mk: Да, стар, но убав. Во зима е топло, во лето свежо.
  - speaker: protagonist
    text: Mein Freund wohnt in einem Neubau.
    meaning:
      en: My friend lives in a new building.
      ar: صديقي يسكن في مبنى جديد.
      mk: Мојот пријател живее во новоградба.
  - speaker: becker
    text: Neubauten sind modern, mit Dämmung und doppelten Fenstern.
    meaning:
      en: New buildings are modern, with insulation and double glazing.
      ar: المباني الجديدة حديثة، فيها عزل ونوافذ مزدوجة.
      mk: Новоградбите се модерни, со изолација и двојни прозорци.
  - speaker: protagonist
    text: Und was ist besser?
    meaning:
      en: And which is better?
      ar: وأيّهما أفضل؟
      mk: А што е подобро?
  - speaker: becker
    text: Altbau ist schöner. Neubau ist billiger zu heizen.
    meaning:
      en: Old buildings are nicer. New ones are cheaper to heat.
      ar: المبنى القديم أجمل. والجديد تدفئته أرخص.
      mk: Старата е поубава. Новата е поевтина за греење.
