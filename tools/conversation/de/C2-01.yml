- type: narrator
  text:
    en: Wedding speeches in Germany are short (three to five minutes), personal and funny, with one or two harmless anecdotes — nothing embarrassing about ex-partners — and end with a toast. Water or juice
      in your glass is perfectly fine.
    ar: خطب الأعراس في ألمانيا قصيرة (ثلاث إلى خمس دقائق)، شخصية ومضحكة، مع طرفة أو اثنتين بريئتين — لا شيء محرج عن الشركاء السابقين — وتنتهي بنخب. والماء أو العصير في كأسكِ مقبول تمامًا.
    mk: Свадбените говори во Германија се кратки (три до пет минути), лични и смешни, со една-две безопасни анегдоти — ништо непријатно за поранешни партнери — и завршуваат со здравица. Вода или сок во
      чашата е сосема во ред.
