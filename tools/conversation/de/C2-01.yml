- type: narrator
  text:
    en: 'Rhetorical devices: the rhetorical question («Wer hätte gedacht, dass…?»), the anecdote, the contrast «nicht nur…, sondern auch…», and the rule of three («Liebe, Treue, Humor»). End with a clear
      call: «Erheben Sie mit mir das Glas».'
    ar: 'أدوات بلاغية: السؤال البلاغي («Wer hätte gedacht, dass…?»)، والطرفة، والمقابلة «nicht nur…, sondern auch…»، وقاعدة الثلاثة («Liebe, Treue, Humor»). واختمي بدعوة واضحة: «Erheben Sie mit mir das
      Glas».'
    mk: 'Реторички средства: реторичко прашање («Wer hätte gedacht, dass…?»), анегдота, контраст «nicht nur…, sondern auch…» и правилото на тројката («Liebe, Treue, Humor»). Завршете со јасен повик: «Erheben
      Sie mit mir das Glas».'
