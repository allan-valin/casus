steps:
- type: narrator
  text:
    en: Paul is getting married. As his friend from the WG days, you give the toast — the whole hall listens. Listen to the conversation; you don't need to understand it yet.
    ar: باول يتزوّج. بصفتكِ صديقته منذ أيام السكن المشترك تلقين كلمة الزفاف — والقاعة كلها تستمع. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Паул се жени. Како негова пријателка од времето на заедничкиот стан, ја држите здравицата — целата сала слуша. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Liebe Gäste, liebes Brautpaar! Ich darf ein paar Worte sagen.
    meaning:
      en: Dear guests, dear bride and groom! Allow me to say a few words.
      ar: الضيوف الأعزاء، العروسان العزيزان! اسمحوا لي أن أقول بضع كلمات.
      mk: Драги гости, драги младенци! Дозволете ми да кажам неколку зборови.
  - speaker: protagonist
    text: Wer hätte gedacht, dass Paul — der Paul, der nie den Putzplan einhielt — heute heiratet?
    meaning:
      en: Who would have thought that Paul — the Paul who never kept to the cleaning rota — would get married today?
      ar: من كان يظن أنّ باول — باول الذي لم يلتزم قط بجدول التنظيف — سيتزوّج اليوم؟
      mk: Кој би помислил дека Паул — Паул што никогаш не го почитуваше распоредот за чистење — денес ќе се жени?
  - speaker: paul
    text: (lacht) Das stimmt leider.
    meaning:
      en: (laughs) Sadly, that's true.
      ar: (يضحك) هذا صحيح للأسف.
      mk: (се смее) За жал, тоа е точно.
  - speaker: protagonist
    text: 'Eine Anekdote: Als ich neu war, erklärte er mir eine Stunde lang die deutsche Mülltrennung. Falsch.'
    meaning:
      en: 'An anecdote: when I was new, he explained German recycling to me for an hour. Wrongly.'
      ar: 'طرفة: حين كنتُ جديدة شرح لي فرز القمامة الألماني ساعة كاملة. بشكل خاطئ.'
      mk: 'Анегдота: кога бев нова, ми ја објаснуваше германската селекција на отпад цел час. Погрешно.'
  - speaker: protagonist
    text: Aber er ist nicht nur ein schlechter Mülltrenner, sondern auch der treueste Freund, den ich kenne.
    meaning:
      en: But he's not only a bad recycler, but also the most loyal friend I know.
      ar: لكنه ليس فقط سيئًا في فرز القمامة، بل أيضًا أوفى صديق أعرفه.
      mk: Но тој не е само лош во селекцијата, туку и најверниот пријател што го познавам.
  - speaker: protagonist
    text: Liebe, Treue, Humor — das wünsche ich euch. Und einen Putzplan.
    meaning:
      en: Love, faithfulness, humour — that's what I wish you. And a cleaning rota.
      ar: الحب والوفاء والفكاهة — هذا ما أتمنّاه لكما. وجدول تنظيف.
      mk: Љубов, верност, хумор — тоа ви посакувам. И распоред за чистење.
  - speaker: protagonist
    text: 'Erheben Sie mit mir das Glas: auf das glückliche Paar!'
    meaning:
      en: 'Raise your glasses with me: to the happy couple!'
      ar: 'ارفعوا الكؤوس معي: نخب الزوجين السعيدين!'
      mk: 'Кренете ги чашите со мене: за среќната двојка!'
  - speaker: jonas
    text: Auf das Brautpaar! — Eine perfekte Rede.
    meaning:
      en: To the bride and groom! — A perfect speech.
      ar: نخب العروسين! — كلمة مثالية.
      mk: За младенците! — Совршен говор.
