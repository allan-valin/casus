steps:
- type: narrator
  text:
    en: A year on the same staircase. Frau Becker invites you for a glass — and makes an offer. Listen to the conversation; you don't need to understand it yet.
    ar: عام على الدرج نفسه. السيدة بيكر تدعوك إلى كأس — وتقدّم عرضًا. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Една година на истите скали. Госпоѓа Бекер ве кани на чаша — и дава понуда. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: becker
    text: Wir wohnen schon ein Jahr im selben Haus. Wollen wir uns duzen?
    meaning:
      en: We've lived in the same house for a year. Shall we say du?
      ar: نسكن في البيت نفسه منذ عام. هل نتخاطب بـ«du»؟
      mk: Веќе една година живееме во иста зграда. Ќе си велиме ли «du»?
  - speaker: protagonist
    text: Sehr gern! Das ist eine Ehre.
    meaning:
      en: With great pleasure! That's an honour.
      ar: بكل سرور! هذا شرف لي.
      mk: Со големо задоволство! Тоа е чест.
  - speaker: becker
    text: Ich heiße Monika.
    meaning:
      en: My name is Monika.
      ar: اسمي مونيكا.
      mk: Јас се викам Моника.
  - speaker: protagonist
    text: Monika... das ist ungewohnt!
    meaning:
      en: Monika... that feels strange!
      ar: مونيكا... هذا غير معتاد!
      mk: Моника... ова е невообичаено!
  - speaker: becker
    text: Dann stoßen wir an. Auf das Du!
    meaning:
      en: Then let's clink glasses. To du!
      ar: إذن نقرع الكؤوس. نخب الـ«du»!
      mk: Тогаш да наздравиме. За «du»!
  - speaker: protagonist
    text: Auf das Du! Und ab jetzt sage ich nicht mehr „Frau Becker“?
    meaning:
      en: To du! And from now on I don't say 'Mrs Becker' any more?
      ar: نخب الـ«du»! ومن الآن لا أقول «السيدة بيكر»؟
      mk: За «du»! И од сега веќе не велам „госпоѓо Бекер“?
  - speaker: becker
    text: Nein. Aber den Putzplan gibt es trotzdem!
    meaning:
      en: No. But the cleaning rota still applies!
      ar: لا. لكن جدول التنظيف يبقى قائمًا!
      mk: Не. Но распоредот за чистење сепак останува!
  - speaker: protagonist
    text: Klar, Monika!
    meaning:
      en: Of course, Monika!
      ar: طبعًا يا مونيكا!
      mk: Секако, Моника!
- type: prompt
  ask:
    en: 'She offers: shall we say du? How?'
    ar: 'تعرض: هل نتخاطب بـ«du»؟ كيف؟'
    mk: 'Таа нуди: ќе си велиме ли «du»? Како?'
  answer:
    speaker: protagonist
    text: Wollen wir uns duzen?
  items:
  - wollen-wir-uns-duzen
