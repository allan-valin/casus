steps:
- type: narrator
  text:
    en: The Verein turns one hundred. After Petra's speech, she asks you to say a few words for the newer members. Listen to the conversation; you don't need to understand it yet.
    ar: النادي يبلغ مئة عام. بعد كلمة بيترا تطلب منك أن تقول بضع كلمات باسم الأعضاء الجدد. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Клубот полни сто години. По говорот на Петра, таа ве моли да кажете неколку зборови во име на поновите членови. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: petra
    text: Verehrte Gäste, liebe Mitglieder! Seit der Gründung 1925 hat unser Verein Krieg, Teilung und Wende erlebt.
    meaning:
      en: Honoured guests, dear members! Since its founding in 1925 our club has lived through war, division and reunification.
      ar: الضيوف الكرام، الأعضاء الأعزاء! منذ تأسيسه عام 1925 عاش نادينا الحرب والتقسيم والتحوّل.
      mk: Почитувани гости, драги членови! Од основањето во 1925 нашиот клуб преживеа војна, поделба и пресврт.
  - speaker: petra
    text: Und jetzt bitte ich ein neueres Mitglied nach vorn.
    meaning:
      en: And now I'd like to call one of our newer members to the front.
      ar: والآن أدعو أحد الأعضاء الجدد إلى الأمام.
      mk: А сега повикувам еден понов член напред.
  - speaker: protagonist
    text: Verehrte Gäste, es ist mir eine Ehre, im Namen der neuen Mitglieder zu sprechen.
    meaning:
      en: Honoured guests, it is an honour for me to speak on behalf of the new members.
      ar: الضيوف الكرام، إنه لشرف لي أن أتحدّث باسم الأعضاء الجدد.
      mk: Почитувани гости, чест ми е да зборувам во име на новите членови.
  - speaker: protagonist
    text: Als ich kam, kannte ich niemanden. Dieser Verein hat mir eine Gemeinschaft geschenkt.
    meaning:
      en: When I came, I knew no one. This club gave me a community.
      ar: حين جئتُ لم أكن أعرف أحدًا. هذا النادي منحني مجتمعًا.
      mk: Кога дојдов, не познавав никого. Овој клуб ми подари заедница.
  - speaker: protagonist
    text: Hundert Jahre, vier Generationen — und heute Mitglieder aus zwanzig Ländern.
    meaning:
      en: A hundred years, four generations — and today members from twenty countries.
      ar: مئة عام، أربعة أجيال — واليوم أعضاء من عشرين بلدًا.
      mk: Сто години, четири генерации — и денес членови од дваесет земји.
  - speaker: protagonist
    text: 'Ich erhebe mein Glas: auf die nächsten hundert Jahre!'
    meaning:
      en: 'I raise my glass: to the next hundred years!'
      ar: 'أرفع كأسي: نخب المئة عام القادمة!'
      mk: 'Ја кревам чашата: за следните сто години!'
  - speaker: petra
    text: 'Danke! Und eine Überraschung: Herr Schulz, unser ältestes Mitglied, wird Ehrenmitglied.'
    meaning:
      en: 'Thank you! And a surprise: Herr Schulz, our oldest member, becomes an honorary member.'
      ar: 'شكرًا! ومفاجأة: السيد شولتس، أقدم أعضائنا، يصبح عضوًا فخريًا.'
      mk: 'Благодарам! И едно изненадување: господин Шулц, нашиот најстар член, станува почесен член.'
  - speaker: protagonist
    text: Der Herr vom Bürgeramt? Die Welt ist klein!
    meaning:
      en: The man from the Bürgeramt? It's a small world!
      ar: الرجل من مكتب المواطنين؟ ما أصغر العالم!
      mk: Господинот од Бирото за граѓани? Светот е мал!
