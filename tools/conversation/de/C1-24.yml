- type: narrator
  text:
    en: Many German clubs are over a hundred years old and survived the war, division and reunification. Anniversaries are celebrated with speeches, honours for long membership and a party — a good moment
      for newer members to be seen.
    ar: كثير من الأندية الألمانية يتجاوز عمرها مئة عام، ونجت من الحرب والتقسيم والتوحيد. وتُحتفل الذكريات بالخطب وتكريم العضويات الطويلة وحفلة — لحظة جيدة ليظهر فيها الأعضاء الجدد.
    mk: Многу германски клубови се постари од сто години и ги преживеале војната, поделбата и обединувањето. Јубилеите се слават со говори, признанија за долго членство и забава — добар момент новите членови
      да бидат видени.
