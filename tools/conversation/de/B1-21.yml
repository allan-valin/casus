- type: narrator
  text:
    en: 'Caspar David Friedrich (1774–1840), the great painter of German Romanticism: lonely figures before fog, sea and mountains. Many museums are free or cheap one day a month — ask at the desk.'
    ar: 'كاسبار دافيد فريدريش (1774–1840)، الرسّام الكبير للرومانسية الألمانية: شخوص وحيدة أمام الضباب والبحر والجبال. كثير من المتاحف مجانية أو رخيصة يومًا في الشهر — اسألي عند المدخل.'
    mk: 'Каспар Давид Фридрих (1774–1840), големиот сликар на германскиот романтизам: осамени фигури пред магла, море и планини. Многу музеи се бесплатни или евтини еден ден во месецот — прашајте на благајната.'
