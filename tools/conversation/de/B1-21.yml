- type: narrator
  text:
    en: 'Relative pronouns follow their role in the clause: «der Mann, der dort steht» (subject), «der Nebel, den man sieht» (object), «der Maler, dessen Bilder hier hängen» (whose).'
    ar: 'ضمائر الصلة تتبع دورها في الجملة: «der Mann, der dort steht» (فاعل)، «der Nebel, den man sieht» (مفعول)، «der Maler, dessen Bilder hier hängen» (الذي … لوحاته).'
    mk: 'Релативните заменки ја следат улогата во реченицата: «der Mann, der dort steht» (подмет), «der Nebel, den man sieht» (предмет), «der Maler, dessen Bilder hier hängen» (чии).'
