steps:
- type: narrator
  text:
    en: The VHS course visits Leipzig's Museum of Fine Arts. Professor Hartmann stops in front of a large painting. Listen to the conversation; you don't need to understand it yet.
    ar: دورة الجامعة الشعبية تزور متحف الفنون الجميلة في لايبزيغ. البروفيسور هارتمان يتوقف أمام لوحة كبيرة. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Курсот на народниот универзитет го посетува Музејот на ликовни уметности во Лајпциг. Професорот Хартман застанува пред голема слика. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: hartmann
    text: Das ist ein Gemälde von Caspar David Friedrich. Welchen Eindruck haben Sie?
    meaning:
      en: This is a painting by Caspar David Friedrich. What's your impression?
      ar: هذه لوحة لكاسبار دافيد فريدريش. ما انطباعكِ؟
      mk: Ова е слика од Каспар Давид Фридрих. Каков ви е впечатокот?
  - speaker: protagonist
    text: Sie wirkt traurig. Die Farben sind dunkel.
    meaning:
      en: It seems sad. The colours are dark.
      ar: تبدو حزينة. الألوان داكنة.
      mk: Делува тажно. Боите се темни.
  - speaker: hartmann
    text: Und der Mann, der dort steht?
    meaning:
      en: And the man who's standing there?
      ar: والرجل الذي يقف هناك؟
      mk: А човекот што стои таму?
  - speaker: protagonist
    text: Er schaut in den Nebel, den man im Hintergrund sieht. Er ist allein.
    meaning:
      en: He's looking into the fog you can see in the background. He's alone.
      ar: ينظر إلى الضباب الذي نراه في الخلفية. إنه وحيد.
      mk: Гледа во маглата што се гледа во позадината. Сам е.
  - speaker: hartmann
    text: Genau. Der Maler, dessen Bilder hier hängen, liebte die Natur und das Licht.
    meaning:
      en: Exactly. The painter whose pictures hang here loved nature and light.
      ar: بالضبط. الرسّام الذي تُعلَّق لوحاته هنا أحبّ الطبيعة والضوء.
      mk: Точно. Сликарот чии слики висат тука ја сакаше природата и светлината.
  - speaker: protagonist
    text: Am besten gefällt mir das Licht am Horizont.
    meaning:
      en: What I like best is the light on the horizon.
      ar: أكثر ما يعجبني الضوء في الأفق.
      mk: Најмногу ми се допаѓа светлината на хоризонтот.
  - speaker: hartmann
    text: Schön gesagt. Nächsten Monat gibt es eine neue Ausstellung.
    meaning:
      en: Nicely put. Next month there's a new exhibition.
      ar: قلتِها جميلة. الشهر القادم معرض جديد.
      mk: Убаво кажано. Следниот месец има нова изложба.
  - speaker: protagonist
    text: Da komme ich wieder!
    meaning:
      en: I'll come back for that!
      ar: سأعود من أجله!
      mk: Тогаш пак ќе дојдам!
