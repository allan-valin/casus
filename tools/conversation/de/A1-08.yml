steps:
- type: narrator
  text:
    en: To the main station. The bus driver sends you to the tram. Listen to the conversation; you don't need to understand it yet.
    ar: إلى المحطة الرئيسية. سائق الحافلة يرسلك إلى الترام. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: До главната станица. Возачот на автобусот ве праќа на трамвај. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Entschuldigung, fährt der Bus zum Hauptbahnhof?
    meaning:
      en: Excuse me, does the bus go to the main station?
      ar: عفوًا، هل تذهب الحافلة إلى المحطة الرئيسية؟
      mk: Извинете, оди ли автобусот до главната станица?
  - speaker: fahrer
    text: Nein. Sie müssen umsteigen. Nehmen Sie die Straßenbahn Nummer vier.
    meaning:
      en: No. You have to change. Take tram number four.
      ar: لا. عليك أن تغيّر. خذ الترام رقم أربعة.
      mk: Не. Мора да се префрлите. Земете го трамвајот број четири.
  - speaker: protagonist
    text: Wo ist die Haltestelle?
    meaning:
      en: Where is the stop?
      ar: أين المحطة؟
      mk: Каде е станицата?
  - speaker: fahrer
    text: Da drüben. Haben Sie eine Fahrkarte?
    meaning:
      en: Over there. Do you have a ticket?
      ar: هناك. هل معك تذكرة؟
      mk: Таму преку. Имате ли билет?
  - speaker: protagonist
    text: Nein. Kann ich hier eine Fahrkarte kaufen?
    meaning:
      en: No. Can I buy a ticket here?
      ar: لا. هل يمكنني شراء تذكرة هنا؟
      mk: Не. Можам ли тука да купам билет?
  - speaker: fahrer
    text: Am Automaten oder mit der App.
    meaning:
      en: At the machine or with the app.
      ar: من الآلة أو بالتطبيق.
      mk: На автоматот или со апликацијата.
  - speaker: protagonist
    text: Danke. Und wo steige ich ein?
    meaning:
      en: Thanks. And where do I get on?
      ar: شكرًا. ومن أين أصعد؟
      mk: Благодарам. А каде се качувам?
  - speaker: fahrer
    text: Steigen Sie hinten ein. Da ist Platz für Kinderwagen.
    meaning:
      en: Get on at the back. There's room for prams there.
      ar: اصعد من الخلف. هناك مكان لعربات الأطفال.
      mk: Качете се одзади. Таму има место за колички.
  - speaker: protagonist
    text: Und am Hauptbahnhof steige ich aus.
    meaning:
      en: And at the main station I get off.
      ar: وأنزل في المحطة الرئيسية.
      mk: А на главната станица се симнувам.
