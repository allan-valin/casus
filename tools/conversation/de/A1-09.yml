steps:
- type: narrator
  text:
    en: The flat is dark from three o'clock. You go to buy a lamp. Listen to the conversation; you don't need to understand it yet.
    ar: الشقة مظلمة منذ الساعة الثالثة. تذهبين لشراء مصباح. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Станот е темен уште од три часот. Одите да купите ламба. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: kasse
    text: Guten Tag! Suchen Sie etwas?
    meaning:
      en: Hello! Are you looking for something?
      ar: نهارك سعيد! هل تبحثين عن شيء؟
      mk: Добар ден! Барате ли нешто?
  - speaker: protagonist
    text: Ja, ich suche eine Lampe. Meine Wohnung ist so dunkel.
    meaning:
      en: Yes, I'm looking for a lamp. My flat is so dark.
      ar: نعم، أبحث عن مصباح. شقتي مظلمة جدًا.
      mk: Да, барам ламба. Станот ми е толку темен.
  - speaker: kasse
    text: Wir haben viele Lampen. Welche Farbe?
    meaning:
      en: We have lots of lamps. What colour?
      ar: عندنا مصابيح كثيرة. أيّ لون؟
      mk: Имаме многу ламби. Која боја?
  - speaker: protagonist
    text: Weiß oder grau.
    meaning:
      en: White or grey.
      ar: أبيض أو رمادي.
      mk: Бела или сива.
  - speaker: kasse
    text: Diese weiße Lampe ist sehr hell.
    meaning:
      en: This white lamp is very bright.
      ar: هذا المصباح الأبيض مضيء جدًا.
      mk: Оваа бела ламба е многу светла.
  - speaker: protagonist
    text: Zu hell! Ich möchte warmes Licht, gelb.
    meaning:
      en: Too bright! I'd like warm light, yellow.
      ar: مضيء أكثر من اللازم! أريد ضوءًا دافئًا، أصفر.
      mk: Премногу светла! Сакам топла светлина, жолта.
  - speaker: kasse
    text: Dann diese hier. Warmes Licht, und sie ist schön klein.
    meaning:
      en: Then this one. Warm light, and nice and small.
      ar: إذن هذه. ضوء دافئ، وهي صغيرة وجميلة.
      mk: Тогаш оваа. Топла светлина, и убаво е мала.
  - speaker: protagonist
    text: Was kostet sie?
    meaning:
      en: How much is it?
      ar: كم سعرها؟
      mk: Колку чини?
  - speaker: kasse
    text: Neunundzwanzig Euro.
    meaning:
      en: Twenty-nine euros.
      ar: تسعة وعشرون يورو.
      mk: Дваесет и девет евра.
  - speaker: protagonist
    text: Gut, ich nehme die kleine Lampe.
    meaning:
      en: Good, I'll take the small lamp.
      ar: حسنًا، سآخذ المصباح الصغير.
      mk: Добро, ја земам малата ламба.
