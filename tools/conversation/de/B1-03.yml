- type: narrator
  text:
    en: 'The passive uses «werden» + participle: «Die Information wird gespeichert» (is stored), «Die Zelle wird geteilt» (is divided). The doer often disappears.'
    ar: 'المبني للمجهول يستعمل «werden» مع اسم المفعول: «Die Information wird gespeichert» (تُخزَّن)، «Die Zelle wird geteilt» (تنقسم). والفاعل يختفي غالبًا.'
    mk: 'Пасивот користи «werden» + партицип: «Die Information wird gespeichert» (се чува), «Die Zelle wird geteilt» (се дели). Вршителот често исчезнува.'
