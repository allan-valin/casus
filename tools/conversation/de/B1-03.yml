steps:
- type: narrator
  text:
    en: A biology evening at the VHS. Professor Hartmann puts a microscope in front of you. Listen to the conversation; you don't need to understand it yet.
    ar: أمسية علوم الأحياء في الجامعة الشعبية. البروفيسور هارتمان يضع أمامكِ مجهرًا. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Вечер по биологија на народниот универзитет. Професорот Хартман става микроскоп пред вас. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: hartmann
    text: Schauen Sie ins Mikroskop. Was sehen Sie?
    meaning:
      en: Look into the microscope. What do you see?
      ar: انظري في المجهر. ماذا ترين؟
      mk: Погледнете во микроскопот. Што гледате?
  - speaker: protagonist
    text: Kleine Kreise. Sind das Zellen?
    meaning:
      en: Little circles. Are those cells?
      ar: دوائر صغيرة. هل هذه خلايا؟
      mk: Мали кругови. Дали тоа се клетки?
  - speaker: hartmann
    text: Genau. Und in der Mitte ist der Zellkern.
    meaning:
      en: Exactly. And in the middle is the nucleus.
      ar: بالضبط. وفي الوسط نواة الخلية.
      mk: Точно. А во средината е јадрото.
  - speaker: protagonist
    text: Was macht der Zellkern?
    meaning:
      en: What does the nucleus do?
      ar: ماذا تفعل النواة؟
      mk: Што прави јадрото?
  - speaker: hartmann
    text: Dort wird die Information gespeichert — die DNA.
    meaning:
      en: That's where the information is stored — the DNA.
      ar: هناك تُخزَّن المعلومات — الحمض النووي.
      mk: Таму се чува информацијата — ДНК.
  - speaker: protagonist
    text: Und wie wächst der Körper?
    meaning:
      en: And how does the body grow?
      ar: وكيف ينمو الجسم؟
      mk: А како расте телото?
  - speaker: hartmann
    text: Die Zelle wird geteilt — aus einer werden zwei. Der Körper besteht aus Millionen Zellen.
    meaning:
      en: The cell divides — one becomes two. The body consists of millions of cells.
      ar: الخلية تنقسم — من واحدة تصبح اثنتين. والجسم يتكوّن من ملايين الخلايا.
      mk: Клетката се дели — од една стануваат две. Телото се состои од милиони клетки.
  - speaker: protagonist
    text: Unglaublich! Sie erklären das sehr gut.
    meaning:
      en: Unbelievable! You explain it very well.
      ar: لا يُصدَّق! أنت تشرح ذلك جيدًا جدًا.
      mk: Неверојатно! Многу добро објаснувате.
