steps:
- type: narrator
  text:
    en: First week at the new employer. Herr Lange shows you round and explains your induction plan. Listen to the conversation; you don't need to understand it yet.
    ar: الأسبوع الأول عند صاحب العمل الجديد. السيد لانغه يُريكِ المكان ويشرح خطة تأهيلكِ. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
- type: dialogue
  lines:
  - speaker: lange
    text: Willkommen! Hier ist Ihr Einarbeitungsplan für die ersten Wochen.
    meaning:
      en: Welcome! Here's your induction plan for the first weeks.
      ar: أهلًا بكِ! هذه خطة تأهيلكِ للأسابيع الأولى.
  - speaker: protagonist
    text: Danke. Wer ist meine Ansprechpartnerin?
    meaning:
      en: Thank you. Who's my contact person?
      ar: شكرًا. من الشخص الذي أتواصل معه؟
  - speaker: lange
    text: Frau Krause ist Ihre Patin — die Kollegin, bei der Sie alles fragen können.
    meaning:
      en: Mrs Krause is your buddy — the colleague you can ask anything.
      ar: السيدة كراوزه مرشدتكِ — الزميلة التي يمكنكِ أن تسأليها عن كل شيء.
  - speaker: protagonist
    text: Und das Projekt, an dem ich arbeiten werde?
    meaning:
      en: And the project I'll be working on?
      ar: والمشروع الذي سأعمل عليه؟
  - speaker: lange
    text: Startet nächste Woche. Das Team, mit dem Sie arbeiten, sitzt im zweiten Stock.
    meaning:
      en: Starts next week. The team you'll work with sits on the second floor.
      ar: يبدأ الأسبوع القادم. الفريق الذي ستعملين معه في الطابق الثاني.
  - speaker: protagonist
    text: Wann muss ich da sein?
    meaning:
      en: When do I have to be there?
      ar: متى يجب أن أكون هناك؟
  - speaker: lange
    text: Wir haben Gleitzeit. Die Kernzeit ist von zehn bis drei.
    meaning:
      en: We have flexitime. Core hours are ten to three.
      ar: لدينا دوام مرن. ساعات الحضور الإلزامي من العاشرة حتى الثالثة.
  - speaker: protagonist
    text: Und mein Zugang zum System?
    meaning:
      en: And my login to the system?
      ar: وصلاحية دخولي إلى النظام؟
  - speaker: lange
    text: Kommt heute Nachmittag. Jetzt zeige ich Ihnen die Kantine — das Wichtigste!
    meaning:
      en: Comes this afternoon. Now I'll show you the canteen — the most important thing!
      ar: تصل بعد ظهر اليوم. الآن سأُريكِ المقصف — أهم شيء!
