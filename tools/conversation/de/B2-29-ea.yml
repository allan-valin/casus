- type: narrator
  text:
    en: Good employers give an induction plan and a buddy (Pate/Patin) for the first weeks. Ask everything early — questions are expected in the first months, not later. With flexitime you choose start
      and end within limits, but must be present in the core hours.
    ar: أصحاب العمل الجيّدون يقدّمون خطة تأهيل ومرشدًا (Pate/Patin) للأسابيع الأولى. اسألي عن كل شيء مبكرًا — الأسئلة متوقَّعة في الأشهر الأولى لا بعدها. ومع الدوام المرن تختارين البداية والنهاية ضمن حدود،
      لكن يجب أن تحضري في ساعات الحضور الإلزامي.
