steps:
- type: narrator
  text:
    en: A summer evening on Jonas and Svenja's balcony. Will you stay in Germany — or go back one day? A look back at all of B2. Listen to the conversation; you don't need to understand it yet.
    ar: أمسية صيفية على شرفة يوناس وسفينيا. هل ستبقى في ألمانيا — أم تعود يومًا ما؟ نظرة إلى المستوى B2 كله. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Летна вечер на балконот на Јонас и Свења. Дали ќе останете во Германија — или еден ден ќе се вратите? Поглед наназад кон целото B2. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: svenja
    text: Und? Bleibst du für immer in Deutschland?
    meaning:
      en: So? Are you staying in Germany for ever?
      ar: إذن؟ هل ستبقى في ألمانيا إلى الأبد؟
      mk: И? Остануваш ли засекогаш во Германија?
  - speaker: protagonist
    text: Wer weiß? Manchmal denke ich, ich gehe zurück. Manchmal will ich hierbleiben.
    meaning:
      en: Who knows? Sometimes I think I'll go back. Sometimes I want to stay here.
      ar: من يدري؟ أحيانًا أفكّر أن أعود. وأحيانًا أريد أن أبقى هنا.
      mk: Кој знае? Понекогаш мислам дека ќе се вратам. Понекогаш сакам да останам тука.
  - speaker: jonas
    text: Das klingt nach zwei Welten.
    meaning:
      en: That sounds like two worlds.
      ar: هذا يبدو مثل عالمين.
      mk: Тоа звучи како два света.
  - speaker: protagonist
    text: Genau. Meine Heimat ist dort. Aber mein Zuhause ist hier.
    meaning:
      en: Exactly. My homeland is there. But my home is here.
      ar: بالضبط. وطني هناك. لكن بيتي هنا.
      mk: Точно. Татковината ми е таму. Но домот ми е тука.
  - speaker: svenja
    text: Ist das ein Widerspruch?
    meaning:
      en: Is that a contradiction?
      ar: هل هذا تناقض؟
      mk: Дали е тоа противречност?
  - speaker: protagonist
    text: Nein. Ich glaube, ich bin angekommen — mit beiden.
    meaning:
      en: No. I think I've arrived — with both.
      ar: لا. أظن أنني استقررتُ — مع الاثنين.
      mk: Не. Мислам дека пристигнав — со двете.
  - speaker: jonas
    text: Auf die Zukunft! Wo auch immer.
    meaning:
      en: To the future! Wherever it is.
      ar: نخب المستقبل! أينما كان.
      mk: За иднината! Каде и да е.
  - speaker: protagonist
    text: Auf die Zukunft. Und auf euch.
    meaning:
      en: To the future. And to you.
      ar: نخب المستقبل. ونخبكما.
      mk: За иднината. И за вас.
