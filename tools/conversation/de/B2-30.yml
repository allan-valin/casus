- type: narrator
  text:
    en: '''Heimat'' is where you come from and belong; ''Zuhause'' is where you live now. Many people who move hold both — and that''s not a contradiction. Whatever you decide: you can now talk about work,
      rights, money and feelings in German.'
    ar: '«Heimat» هو المكان الذي جئتَ منه وتنتمي إليه؛ و«Zuhause» هو المكان الذي تعيش فيه الآن. كثير ممن ينتقلون يحملون الاثنين — وهذا ليس تناقضًا. أيًّا كان قرارك: يمكنك الآن أن تتحدّث بالألمانية عن العمل
      والحقوق والمال والمشاعر.'
    mk: '„Heimat“ е местото од каде доаѓате и каде припаѓате; „Zuhause“ е каде живеете сега. Многумина што се преселуваат ги носат двете — и тоа не е противречност. Што и да одлучите: сега можете на германски
      да зборувате за работа, права, пари и чувства.'
