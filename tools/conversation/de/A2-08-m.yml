steps:
- type: narrator
  text:
    mk: Празник на фенерите во градинката на Лука. Петар работи, па одите вие. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: kruger
    text: Willkommen! Heute ist das Laternenfest.
    meaning:
      mk: Добредојдовте! Денес е празникот на фенерите.
  - speaker: protagonist
    text: Danke für die Einladung. Petar arbeitet, ich bin der Opa.
    meaning:
      mk: Благодарам за поканата. Петар работи, јас сум дедото.
  - speaker: kruger
    text: Schön! Luka hat seine Laterne selbst gebastelt.
    meaning:
      mk: Убаво! Лука сам си го направи фенерот.
  - speaker: luka
    text: Opa, schau! Meine Laterne!
    meaning:
      mk: Дедо, погледни! Мојот фенер!
  - speaker: protagonist
    text: Wunderschön! Ist da eine Kerze drin?
    meaning:
      mk: Прекрасно! Има ли свеќа внатре?
  - speaker: kruger
    text: Nein, ein Licht mit Batterie. Sicherer.
    meaning:
      mk: Не, светло со батерија. Побезбедно.
  - speaker: protagonist
    text: Und was machen wir jetzt?
    meaning:
      mk: А што правиме сега?
  - speaker: kruger
    text: Ein Umzug durch den Park. Die Kinder singen.
    meaning:
      mk: Поворка низ паркот. Децата пеат.
  - speaker: protagonist
    text: Ich habe Kuchen mitgebracht. Eine Überraschung von Oma.
    meaning:
      mk: Донесов колач. Изненадување од баба.
