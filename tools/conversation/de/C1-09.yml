steps:
- type: narrator
  text:
    en: 'Knee pain for weeks. Dr Wagner gives you a referral to an orthopaedist. On the phone: the first free appointment is in four months. Listen to the conversation; you don''t need to understand it
      yet.'
    ar: 'ألم في الركبة منذ أسابيع. الدكتورة فاغنر تعطيكِ تحويلًا إلى طبيب عظام. على الهاتف: أول موعد متاح بعد أربعة أشهر. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.'
    mk: 'Болка во коленото со недели. Д-р Вагнер ви дава упат за ортопед. На телефон: првиот слободен термин е за четири месеци. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: praxis
    text: Praxis Dr. Krämer. Der nächste freie Termin ist im März.
    meaning:
      en: Dr Krämer's practice. The next free appointment is in March.
      ar: عيادة الدكتور كريمر. أول موعد متاح في مارس.
      mk: Ординација д-р Кремер. Следниот слободен термин е во март.
  - speaker: protagonist
    text: In vier Monaten? Ich habe eine Überweisung mit Dringlichkeit.
    meaning:
      en: In four months? I have a referral marked urgent.
      ar: بعد أربعة أشهر؟ معي تحويل مستعجل.
      mk: За четири месеци? Имам упат со итност.
  - speaker: praxis
    text: Sind Sie gesetzlich oder privat versichert?
    meaning:
      en: Are you publicly or privately insured?
      ar: هل أنتِ مؤمَّنة في التأمين العام أم الخاص؟
      mk: Јавно или приватно сте осигурени?
  - speaker: protagonist
    text: Gesetzlich. Spielt das eine Rolle?
    meaning:
      en: Publicly. Does that matter?
      ar: في التأمين العام. هل لذلك أهمية؟
      mk: Јавно. Дали тоа е важно?
  - speaker: praxis
    text: Für Privatpatienten hätte ich nächste Woche etwas. Für Sie leider nicht.
    meaning:
      en: For private patients I'd have something next week. For you, sadly not.
      ar: للمرضى المؤمَّنين تأمينًا خاصًا لديّ موعد الأسبوع القادم. لكِ للأسف لا.
      mk: За приватни пациенти би имала нешто следната недела. За вас, за жал, не.
  - speaker: protagonist
    text: Das ist unfair. Gibt es eine andere Möglichkeit?
    meaning:
      en: That's unfair. Is there another option?
      ar: هذا غير عادل. هل هناك إمكانية أخرى؟
      mk: Тоа е неправедно. Има ли друга можност?
  - speaker: praxis
    text: Mit der Überweisung hilft Ihnen die Terminservicestelle unter 116117. Die Vermittlung dauert meist wenige Wochen.
    meaning:
      en: With the referral, the appointment service on 116117 helps you. Arranging it usually takes a few weeks.
      ar: مع التحويل تساعدكِ خدمة المواعيد على الرقم 116117. الترتيب يستغرق عادةً أسابيع قليلة.
      mk: Со упатот ви помага службата за термини на 116117. Посредувањето обично трае неколку недели.
  - speaker: protagonist
    text: Und setzen Sie mich bitte auf die Liste für Absagen.
    meaning:
      en: And please put me on the cancellation list.
      ar: وضعيني من فضلكِ على قائمة الإلغاءات.
      mk: И ве молам ставете ме на листата за откажувања.
- type: prompt
  ask:
    en: 'Say: a referral to a specialist.'
    ar: 'قولي: تحويل إلى طبيب أخصائي.'
    mk: 'Кажете: упат за специјалист.'
  answer:
    speaker: protagonist
    text: Eine Überweisung zum Facharzt.
  items:
  - die-ueberweisung
  - der-facharzt
- type: prompt
  ask:
    en: 'Say: the orthopaedist.'
    ar: 'قولي: طبيب العظام.'
    mk: 'Кажете: ортопедот.'
  answer:
    speaker: protagonist
    text: Der Orthopäde.
  items:
  - der-orthopaede
- type: narrator
  text:
    en: 'Medical German compresses: «eine Überweisung mit Dringlichkeit» (= a referral that says it''s urgent), «die Vermittlung eines Termins» (= someone arranges an appointment for you), «die Wartezeit
      auf einen Termin».'
    ar: 'الألمانية الطبية تختصر: «eine Überweisung mit Dringlichkeit» (= تحويل مكتوب عليه أنه مستعجل)، «die Vermittlung eines Termins» (= أحدهم يرتّب لكِ موعدًا)، «die Wartezeit auf einen Termin».'
    mk: 'Медицинскиот германски збива: «eine Überweisung mit Dringlichkeit» (= упат на кој пишува дека е итно), «die Vermittlung eines Termins» (= некој ви закажува термин), «die Wartezeit auf einen Termin».'
- type: prompt
  ask:
    en: 'Say: a referral marked urgent.'
    ar: 'قولي: تحويل مستعجل.'
    mk: 'Кажете: упат со итност.'
  answer:
    speaker: protagonist
    text: Eine Überweisung mit Dringlichkeit.
  items:
  - die-dringlichkeit
- type: prompt
  ask:
    en: 'Say: the wait for an appointment.'
    ar: 'قولي: مدة انتظار الموعد.'
    mk: 'Кажете: чекањето за термин.'
  answer:
    speaker: protagonist
    text: Die Wartezeit auf einen Termin.
  items:
