- type: prompt
  ask:
    en: 'Say: the appointment service.'
    ar: 'قولي: خدمة المواعيد.'
    mk: 'Кажете: службата за термини.'
  answer:
    speaker: protagonist
    text: Die Terminservicestelle.
  items:
  - die-terminservicestelle
- type: prompt
  ask:
    en: 'Say: it arranges appointments.'
    ar: 'قولي: ترتّب المواعيد.'
    mk: 'Кажете: посредува за термини.'
  answer:
    speaker: protagonist
    text: Die Vermittlung von Terminen.
  items:
  - die-vermittlung
- type: prompt
  ask:
    en: Ask for the cancellation list.
    ar: اطلبي قائمة الإلغاءات.
    mk: Побарајте листа за откажувања.
  answer:
    speaker: protagonist
    text: Die Liste für Absagen.
  items:
  - die-absage
- type: narrator
  text:
    en: Most people are in public insurance; private patients often get faster appointments, because doctors earn more from them — a known unfairness. With a referral marked urgent, the 116117 appointment
      service must find you a specialist within a few weeks. Ask to go on the cancellation list, and call early in the morning.
    ar: معظم الناس في التأمين العام؛ والمرضى ذوو التأمين الخاص يحصلون غالبًا على مواعيد أسرع، لأن الأطباء يكسبون منهم أكثر — ظلم معروف. ومع تحويل مستعجل يجب على خدمة المواعيد 116117 أن تجد لكِ أخصائيًا
      خلال أسابيع قليلة. اطلبي وضعكِ على قائمة الإلغاءات، واتصلي صباحًا باكرًا.
    mk: Повеќето луѓе се во јавното осигурување; приватните пациенти често добиваат побрзи термини, бидејќи лекарите повеќе заработуваат од нив — позната неправда. Со упат со итност, службата 116117 мора
      да ви најде специјалист за неколку недели. Побарајте листа за откажувања и јавувајте се рано наутро.
