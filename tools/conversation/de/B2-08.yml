- type: narrator
  text:
    en: 'Formal emails: ''Sehr geehrte Frau X'' / ''Sehr geehrter Herr Y'' or ''Sehr geehrte Damen und Herren'', a comma, the text starting lowercase, and ''Mit freundlichen Grüßen'' (MfG only in informal
      mail). With landlords and offices, put everything important in writing, with a date and a deadline: it counts as proof.'
    ar: 'الرسائل الرسمية: «Sehr geehrte Frau X» / «Sehr geehrter Herr Y» أو «Sehr geehrte Damen und Herren»، ثم فاصلة، ويبدأ النص بحرف صغير، والختام «Mit freundlichen Grüßen» (والاختصار MfG في الرسائل غير
      الرسمية فقط). مع المؤجّرين والدوائر اكتبي كل ما هو مهم كتابيًا مع تاريخ ومهلة: إنه يُعتدّ به دليلًا.'
    mk: 'Формални пораки: „Sehr geehrte Frau X“ / „Sehr geehrter Herr Y“ или „Sehr geehrte Damen und Herren“, запирка, текстот почнува со мала буква, и „Mit freundlichen Grüßen“ (MfG само во неформални
      пораки). Со станодавци и канцеларии сѐ важно пишувајте писмено, со датум и рок: тоа важи како доказ.'
