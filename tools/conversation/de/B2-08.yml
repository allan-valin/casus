steps:
- type: narrator
  text:
    en: The heating is broken again. Jonas helps you write a formal email to the property management. Listen to the conversation; you don't need to understand it yet.
    ar: التدفئة معطّلة مرة أخرى. يوناس يساعدكِ في كتابة رسالة رسمية إلى إدارة العقار. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Греењето пак не работи. Јонас ви помага да напишете формална е-пошта до управата на зградата. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: 'Nicht „Hallo“! Bei der Hausverwaltung schreibst du: „Sehr geehrte Damen und Herren“.'
    meaning:
      en: 'Not ''Hello''! To the property management you write: ''Dear Sir or Madam''.'
      ar: 'ليس «مرحبًا»! لإدارة العقار تكتبين: «السادة المحترمون».'
      mk: 'Не „Здраво“! До управата пишуваш: „Почитувани“.'
  - speaker: protagonist
    text: Und der Betreff?
    meaning:
      en: And the subject line?
      ar: والموضوع؟
      mk: А предметот?
  - speaker: jonas
    text: 'Kurz und klar: „Heizungsausfall, Wohnung 3, seit dem 2. Februar“.'
    meaning:
      en: 'Short and clear: ''Heating failure, flat 3, since 2 February''.'
      ar: 'قصير وواضح: «تعطّل التدفئة، شقة 3، منذ 2 فبراير».'
      mk: 'Кратко и јасно: „Дефект на греењето, стан 3, од 2 февруари“.'
  - speaker: protagonist
    text: „Hiermit teile ich Ihnen mit, dass die Heizung nicht funktioniert. Ich bitte um umgehende Reparatur.“
    meaning:
      en: '''I hereby inform you that the heating isn''t working. I request prompt repair.'''
      ar: «أبلغكم بموجب هذا أنّ التدفئة لا تعمل. أرجو الإصلاح على وجه السرعة.»
      mk: „Со ова ве известувам дека греењето не работи. Ве молам за итна поправка.“
  - speaker: jonas
    text: 'Perfekt. Fotos im Anhang. Und schreib: „Ich bitte um Rückmeldung bis Freitag.“'
    meaning:
      en: 'Perfect. Photos attached. And write: ''Please reply by Friday.'''
      ar: 'ممتاز. الصور في المرفق. واكتبي: «أرجو الرد حتى الجمعة.»'
      mk: 'Совршено. Фотографиите во прилог. И напиши: „Ве молам за одговор до петок.“'
  - speaker: protagonist
    text: Und wenn sie nichts machen?
    meaning:
      en: And if they do nothing?
      ar: وإذا لم يفعلوا شيئًا؟
      mk: А ако не направат ништо?
  - speaker: jonas
    text: 'Dann ist eine Mietminderung möglich. Darum: alles schriftlich!'
    meaning:
      en: 'Then a rent reduction is possible. That''s why: everything in writing!'
      ar: 'عندها يمكن تخفيض الإيجار. لذلك: كل شيء كتابيًا!'
      mk: 'Тогаш е можно намалување на киријата. Затоа: сѐ писмено!'
  - speaker: protagonist
    text: „Mit freundlichen Grüßen.“ Fertig!
    meaning:
      en: '''Yours sincerely.'' Done!'
      ar: «مع أطيب التحيات.» انتهيت!
      mk: „Со почит.“ Готово!
- type: prompt
  ask:
