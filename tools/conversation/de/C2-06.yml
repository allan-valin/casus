steps:
- type: narrator
  text:
    en: Jonas takes you to the Pfeffermühle, Leipzig's famous political cabaret. Afterwards, over beer, he explains the jokes you missed. Listen to the conversation; you don't need to understand it yet.
    ar: يوناس يأخذك إلى «Pfeffermühle»، الكباريه السياسي الشهير في لايبزيغ. بعدها، على البيرة، يشرح لك النكات التي فاتتك. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Јонас ве води во Pfeffermühle, познатото политичко кабаре во Лајпциг. Потоа, на пиво, ви ги објаснува шегите што ви промакнале. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Alle haben gelacht, als sie „Die Bahn ist pünktlich“ sagte. Warum?
    meaning:
      en: Everyone laughed when she said 'The trains are on time'. Why?
      ar: ضحك الجميع حين قالت «القطارات في موعدها». لماذا؟
      mk: Сите се насмеаја кога рече „Возовите се точни“. Зошто?
  - speaker: jonas
    text: 'Das ist Satire. Jeder weiß: Der Zug fällt aus. Sie meint das Gegenteil.'
    meaning:
      en: 'That''s satire. Everyone knows: the train is cancelled. She means the opposite.'
      ar: 'هذا هجاء ساخر. الكل يعرف: القطار أُلغي. تقصد العكس.'
      mk: 'Тоа е сатира. Сите знаат: возот е откажан. Таа мисли спротивно.'
  - speaker: protagonist
    text: Und der Satz über den Minister und das „schwarze Loch“?
    meaning:
      en: And the line about the minister and the 'black hole'?
      ar: والجملة عن الوزير و«الثقب الأسود»؟
      mk: А реченицата за министерот и „црната дупка“?
  - speaker: jonas
    text: 'Doppeldeutig: das Loch im Haushalt und das im Kopf. Ein Seitenhieb.'
    meaning:
      en: 'Double meaning: the hole in the budget and the one in his head. A dig.'
      ar: 'ذو معنيين: الثقب في الميزانية والثقب في رأسه. غمزة لاذعة.'
      mk: 'Двосмислено: дупката во буџетот и онаа во главата. Боцкање.'
  - speaker: protagonist
    text: Sie nehmen ja alle auf die Schippe — sogar den Kanzler!
    meaning:
      en: They make fun of everyone — even the chancellor!
      ar: إنهم يسخرون من الجميع — حتى المستشار!
      mk: Тие ги зафркаваат сите — дури и канцеларот!
  - speaker: jonas
    text: 'Gerade den. Das ist Kabarett. Und am Ende das Brecht-Zitat: „Wer A sagt, der muss nicht B sagen.“'
    meaning:
      en: 'Him above all. That''s cabaret. And at the end the Brecht quote: ''Whoever says A needn''t say B.'''
      ar: 'هو بالذات. هذا هو الكباريه. وفي النهاية اقتباس بريشت: «من قال ألف لا يلزمه أن يقول باء.»'
      mk: 'Токму него. Тоа е кабаре. А на крајот цитатот од Брехт: „Кој кажал А, не мора да каже Б.“'
  - speaker: protagonist
    text: „Er kann auch erkennen, dass A falsch war.“ Das kannte ich!
    meaning:
      en: '''He can also recognise that A was wrong.'' I knew that one!'
      ar: «بل يمكنه أن يدرك أنّ ألف كانت خطأ.» هذه أعرفها!
      mk: „Може и да сфати дека А било погрешно.“ Тоа го знаев!
  - speaker: jonas
    text: Dann verstehst du jetzt auch die Anspielungen. Willkommen im schwarzen Humor!
    meaning:
      en: Then you get the allusions now too. Welcome to black humour!
      ar: إذن تفهم الآن التلميحات أيضًا. أهلًا بك في الفكاهة السوداء!
      mk: Тогаш сега ги разбираш и алузиите. Добредојде во црниот хумор!
