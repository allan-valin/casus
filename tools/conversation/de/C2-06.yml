- type: narrator
  text:
    en: 'German Kabarett is political satire on stage: nobody is spared, least of all the government. Leipzig''s Pfeffermühle, founded in GDR times, still plays nightly. Understanding cabaret jokes — the
      allusions to the news, the twisted sayings — is one of the last steps to C2.'
    ar: 'الكباريه الألماني هجاء سياسي على المسرح: لا أحد ينجو، والحكومة أولًا. و«Pfeffermühle» في لايبزيغ، التي تأسّست في زمن ألمانيا الشرقية، ما زالت تعرض كل ليلة. وفهم نكات الكباريه — التلميحات إلى الأخبار
      والأقوال المقلوبة — من آخر خطوات الوصول إلى C2.'
    mk: 'Германското кабаре е политичка сатира на сцена: никој не е поштеден, најмалку владата. Pfeffermühle во Лајпциг, основана во времето на ГДР, и денес игра секоја вечер. Разбирањето на кабаретските
      шеги — алузиите на вестите, превртените изреки — е еден од последните чекори до C2.'
