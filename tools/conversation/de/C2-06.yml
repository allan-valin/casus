- type: narrator
  text:
    en: 'Wordplay works through double meanings («doppeldeutig»: the hole in the budget / in the head), allusion («Anspielung») and turning a familiar saying round: «Wer A sagt, muss B sagen» becomes Brecht''s
      «…muss nicht B sagen».'
    ar: 'التلاعب بالألفاظ يقوم على المعنيين («doppeldeutig»: الثقب في الميزانية / في الرأس)، والتلميح («Anspielung»)، وقلب قول مألوف: «Wer A sagt, muss B sagen» يصبح عند بريشت «…muss nicht B sagen».'
    mk: 'Играта со зборови работи преку двојни значења («doppeldeutig»: дупката во буџетот / во главата), алузија («Anspielung») и превртување на позната изрека: «Wer A sagt, muss B sagen» станува Брехтовото
      «…muss nicht B sagen».'
