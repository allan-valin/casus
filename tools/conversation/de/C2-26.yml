- type: prompt
  ask:
    en: Ask about notice for own use.
    ar: اسأل عن الإنهاء لحاجة المالك.
    mk: Прашајте за отказ поради сопствена потреба.
  answer:
    speaker: protagonist
    text: Und eine Eigenbedarfskündigung?
  items:
  - die-eigenbedarfskuendigung
- type: prompt
  ask:
    en: 'Say: the change of owner.'
    ar: 'قل: تغيّر المالك.'
    mk: 'Кажете: промената на сопственикот.'
  answer:
    speaker: protagonist
    text: Der Eigentümerwechsel.
  items:
  - der-eigentuemerwechsel
- type: narrator
  text:
    en: When a house is sold, given away or inherited, the new owner takes over existing tenancies unchanged — 'Kauf bricht nicht Miete'. A notice for the owner's own use (Eigenbedarf) must be justified,
      follows the legal notice periods, and can be challenged; a tenants' association helps.
    ar: حين يُباع البيت أو يُوهب أو يُورث، يتسلّم المالك الجديد عقود الإيجار القائمة دون تغيير — «البيع لا ينهي الإيجار». والإنهاء لحاجة المالك الشخصية (Eigenbedarf) يجب تعليله، ويتبع مهل الإنهاء القانونية،
      ويمكن الطعن فيه؛ وجمعية المستأجرين تساعد.
    mk: Кога куќата се продава, подарува или наследува, новиот сопственик ги презема постојните наеми непроменети — „Kauf bricht nicht Miete“. Отказ поради сопствена потреба (Eigenbedarf) мора да се образложи,
      ги следи законските рокови и може да се оспори; здружението на станари помага.
