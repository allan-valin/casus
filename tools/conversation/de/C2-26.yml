steps:
- type: narrator
  text:
    en: Frau Becker is moving into assisted living and gives the house to her nephew Thomas. What does that mean for your tenancy? Listen to the conversation; you don't need to understand it yet.
    ar: السيدة بيكر تنتقل إلى سكن مع رعاية وتهب البيت لابن أخيها توماس. ماذا يعني ذلك لعقد إيجارك؟ استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Госпоѓа Бекер се сели во дом со нега и му ја подарува куќата на внукот Томас. Што значи тоа за вашиот наем? Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: becker
    text: Ich ziehe ins betreute Wohnen. Das Haus geht als Schenkung an meinen Neffen Thomas.
    meaning:
      en: I'm moving into assisted living. The house goes to my nephew Thomas as a gift.
      ar: أنتقل إلى السكن مع الرعاية. البيت يذهب هبةً لابن أخي توماس.
      mk: Се селам во дом со нега. Куќата оди како подарок на внукот Томас.
  - speaker: protagonist
    text: Und mein Mietvertrag?
    meaning:
      en: And my tenancy?
      ar: وعقد إيجاري؟
      mk: А мојот договор за наем?
  - speaker: neffe
    text: Bleibt unverändert. Mit der Eintragung ins Grundbuch trete ich in den Vertrag ein.
    meaning:
      en: Stays unchanged. With the entry in the land register I take over the contract.
      ar: يبقى دون تغيير. بالقيد في السجل العقاري أحلّ محلّ المؤجِّرة في العقد.
      mk: Останува непроменет. Со уписот во катастарот влегувам во договорот.
  - speaker: protagonist
    text: 'Also gilt: Kauf bricht nicht Miete — auch bei einer Schenkung?'
    meaning:
      en: 'So it applies: a sale doesn''t break a tenancy — even with a gift?'
      ar: 'إذن ينطبق: البيع لا ينهي الإيجار — حتى في الهبة؟'
      mk: 'Значи важи: продажбата не го раскинува наемот — и при подарување?'
  - speaker: neffe
    text: Genau. Der Mietvertrag besteht fort, zu denselben Bedingungen.
    meaning:
      en: Exactly. The tenancy continues on the same terms.
      ar: بالضبط. عقد الإيجار يستمرّ بالشروط نفسها.
      mk: Точно. Договорот продолжува под истите услови.
  - speaker: protagonist
    text: Und eine Eigenbedarfskündigung? Ich frage lieber direkt.
    meaning:
      en: And notice for your own use? I'd rather ask directly.
      ar: وماذا عن الإنهاء لحاجة المالك؟ أفضّل أن أسأل مباشرة.
      mk: А отказ поради сопствена потреба? Подобро прашувам директно.
  - speaker: neffe
    text: Kein Gedanke. Ich wohne in Hamburg. Und meine Tante würde mich enterben!
    meaning:
      en: Not a thought. I live in Hamburg. And my aunt would disinherit me!
      ar: لا تفكير في ذلك. أنا أسكن في هامبورغ. وعمّتي ستحرمني من الإرث!
      mk: Ниту помислувам. Живеам во Хамбург. А тетка ми ќе ме лиши од наследство!
  - speaker: becker
    text: Darauf kannst du dich verlassen. Er ist ein guter Mieter.
    meaning:
      en: You can count on that. He's a good tenant.
      ar: يمكنك الاعتماد على ذلك. إنه مستأجر جيد.
      mk: На тоа можеш да се потпреш. Тој е добар станар.
- type: prompt
  ask:
    en: 'Say: assisted living.'
    ar: 'قل: السكن مع الرعاية.'
    mk: 'Кажете: дом со нега.'
  answer:
    speaker: protagonist
    text: Das betreute Wohnen.
  items:
  - das-betreute-wohnen
- type: prompt
  ask:
    en: 'Say: as a gift to her nephew.'
    ar: 'قل: هبةً لابن أخيها.'
    mk: 'Кажете: како подарок на внукот.'
  answer:
    speaker: protagonist
    text: Als Schenkung an den Neffen.
  items:
  - die-schenkung
  - der-neffe
- type: narrator
  text:
    en: 'Legal register in everyday use: «Der Mietvertrag besteht fort» (continues), «in den Vertrag eintreten» (take over the contract), and the old legal saying «Kauf bricht nicht Miete». Asking directly
      about «Eigenbedarf» is fine and wise.'
    ar: 'الأسلوب القانوني في الحياة اليومية: «Der Mietvertrag besteht fort» (يستمرّ)، «in den Vertrag eintreten» (يحلّ محلّ الطرف في العقد)، والقول القانوني القديم «Kauf bricht nicht Miete». والسؤال المباشر
      عن «Eigenbedarf» مقبول وحكيم.'
    mk: 'Правен регистар во секојдневието: «Der Mietvertrag besteht fort» (продолжува), «in den Vertrag eintreten» (влегува во договорот), и старата правна изрека «Kauf bricht nicht Miete». Директното прашање
      за «Eigenbedarf» е во ред и мудро.'
- type: prompt
  ask:
    en: 'Say: the tenancy stays unchanged.'
    ar: 'قل: عقد الإيجار يبقى دون تغيير.'
    mk: 'Кажете: договорот останува непроменет.'
  answer:
    speaker: protagonist
    text: Der Mietvertrag bleibt unverändert.
  items:
  - unveraendert
- type: prompt
  ask:
    en: 'Say: entry in the land register.'
    ar: 'قل: القيد في السجل العقاري.'
    mk: 'Кажете: упис во катастарот.'
  answer:
    speaker: protagonist
    text: Die Eintragung ins Grundbuch.
  items:
  - die-grundbucheintragung
- type: prompt
  ask:
    en: 'He says: I take over the contract.'
    ar: 'يقول: أحلّ محلّها في العقد.'
    mk: 'Тој вели: влегувам во договорот.'
  answer:
    speaker: protagonist
    text: Ich trete in den Vertrag ein.
  items:
  - der-vermieter-c2
- type: prompt
  ask:
    en: 'Quote the rule: a sale doesn''t break a tenancy.'
    ar: 'اقتبس القاعدة: البيع لا ينهي الإيجار.'
