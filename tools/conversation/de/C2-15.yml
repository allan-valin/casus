- type: narrator
  text:
    en: 'Club meetings follow the statutes (Satzung): a quorum, an agenda sent in advance, motions, votes, minutes. Chairing well means being neutral, giving everyone the floor in turn and stating results
      clearly — the same skills as in a city council.'
    ar: 'اجتماعات الأندية تتبع النظام الأساسي (Satzung): نصاب، وجدول أعمال يُرسل مسبقًا، واقتراحات، وتصويت، ومحضر. والرئاسة الجيدة تعني الحياد وإعطاء الكلمة للجميع بالدور وإعلان النتائج بوضوح — المهارات
      نفسها في مجلس المدينة.'
    mk: 'Клупските собранија го следат статутот (Satzung): кворум, дневен ред испратен однапред, предлози, гласања, записник. Доброто претседавање значи неутралност, давање збор на сите по ред и јасно соопштување
      на резултатите — истите вештини како во градски совет.'
- type: prompt
  ask:
    en: 'Once more: say “the statutes”.'
    ar: 'مرة أخرى: قولي “النظام الأساسي”.'
    mk: 'Уште еднаш: кажете „статутот“.'
  answer:
