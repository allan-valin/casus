steps:
- type: narrator
  text:
    en: Petra is stepping down; you've been elected chair. Your first general meeting — by the book. Listen to the conversation; you don't need to understand it yet.
    ar: بيترا تتنحّى؛ وانتُخبتِ رئيسة. أول جمعية عمومية لكِ — وفق الأصول. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Петра се повлекува; вие сте избрана за претседателка. Вашето прво годишно собрание — по правилата. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 'Ich eröffne die Sitzung und stelle die Beschlussfähigkeit fest: zweiundvierzig Mitglieder sind anwesend.'
    meaning:
      en: 'I declare the meeting open and note that we have a quorum: forty-two members are present.'
      ar: 'أفتتح الجلسة وأقرّ بتوفّر النصاب: اثنان وأربعون عضوًا حاضرون.'
      mk: 'Ја отворам седницата и го утврдувам кворумот: присутни се четириесет и два члена.'
  - speaker: protagonist
    text: 'Tagesordnungspunkt drei: Antrag auf eine Frauen-Fußballmannschaft. Ich erteile Lena das Wort.'
    meaning:
      en: 'Agenda item three: motion for a women''s football team. I give the floor to Lena.'
      ar: 'البند الثالث: اقتراح تشكيل فريق كرة قدم نسائي. أعطي الكلمة للينا.'
      mk: 'Точка три: предлог за женска фудбалска екипа. Ѝ давам збор на Лена.'
  - speaker: lena
    text: Zwanzig Frauen wollen spielen. Laut Satzung darf jedes Mitglied eine Abteilung beantragen.
    meaning:
      en: Twenty women want to play. Under the statutes any member may propose a section.
      ar: عشرون امرأة يردن اللعب. بحسب النظام الأساسي يحق لكل عضو اقتراح قسم.
      mk: Дваесет жени сакаат да играат. Според статутот секој член смее да предложи секција.
  - speaker: petra
    text: Und die Hallenzeit? Die Jugend braucht sie auch.
    meaning:
      en: And the hall time? The youth need it too.
      ar: ووقت القاعة؟ الناشئون يحتاجونه أيضًا.
      mk: А терминот во салата? И младите ни требаат.
  - speaker: protagonist
    text: Ein berechtigter Einwand. Die Stadt hat uns neue Zeiten zugesagt. Wir stimmen jetzt über den Antrag ab.
    meaning:
      en: A fair objection. The city has promised us new slots. We'll now vote on the motion.
      ar: اعتراض وجيه. وعدتنا المدينة بأوقات جديدة. نصوّت الآن على الاقتراح.
      mk: Оправдан приговор. Градот ни вети нови термини. Сега гласаме за предлогот.
  - speaker: protagonist
    text: Wer ist dafür? ... Dagegen? ... Enthaltungen? ... Der Antrag ist mit großer Mehrheit angenommen.
    meaning:
      en: Who's in favour? ... Against? ... Abstentions? ... The motion is carried by a large majority.
      ar: من يؤيّد؟ ... من يعارض؟ ... من يمتنع؟ ... أُقرّ الاقتراح بأغلبية كبيرة.
      mk: Кој е за? ... Против? ... Воздржани? ... Предлогот е прифатен со големо мнозинство.
  - speaker: lena
    text: Danke! Die Damenmannschaft lädt alle zum ersten Spiel ein.
    meaning:
      en: Thank you! The women's team invites everyone to the first match.
      ar: شكرًا! الفريق النسائي يدعو الجميع إلى المباراة الأولى.
      mk: Благодарам! Женската екипа ги кани сите на првиот натпревар.
  - speaker: protagonist
    text: Weitere Wortmeldungen? Keine. Ich schließe die Sitzung.
    meaning:
      en: Any more requests to speak? None. I declare the meeting closed.
      ar: طلبات كلام أخرى؟ لا. أختتم الجلسة.
      mk: Други јавувања за збор? Нема. Ја затворам седницата.
- type: prompt
  ask:
    en: Open the meeting.
    ar: افتتحي الجلسة.
    mk: Отворете ја седницата.
  answer:
    speaker: protagonist
    text: Ich eröffne die Sitzung.
  items:
  - ich-eroeffne-die-sitzung
- type: prompt
  ask:
