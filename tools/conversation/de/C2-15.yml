    ar: أقرّي بتوفّر النصاب.
    mk: Утврдете го кворумот.
  answer:
    speaker: protagonist
    text: Ich stelle die Beschlussfähigkeit fest.
  items:
  - die-beschlussfaehigkeit
- type: narrator
  text:
    en: 'Formal procedure uses fixed phrases: «Ich eröffne die Sitzung», «Ich stelle die Beschlussfähigkeit fest», «Ich erteile … das Wort», «Wir stimmen über den Antrag ab», «Der Antrag ist angenommen
      / abgelehnt», «Ich schließe die Sitzung».'
    ar: 'الإجراءات الرسمية تستعمل عبارات ثابتة: «Ich eröffne die Sitzung»، «Ich stelle die Beschlussfähigkeit fest»، «Ich erteile … das Wort»، «Wir stimmen über den Antrag ab»، «Der Antrag ist angenommen
      / abgelehnt»، «Ich schließe die Sitzung».'
    mk: 'Формалната процедура користи фиксни фрази: «Ich eröffne die Sitzung», «Ich stelle die Beschlussfähigkeit fest», «Ich erteile … das Wort», «Wir stimmen über den Antrag ab», «Der Antrag ist angenommen
      / abgelehnt», «Ich schließe die Sitzung».'
- type: prompt
  ask:
    en: Give Lena the floor.
    ar: أعطي الكلمة للينا.
    mk: Дајте ѝ збор на Лена.
  answer:
    speaker: protagonist
    text: Ich erteile Lena das Wort.
  items:
  - das-wort-erteilen
