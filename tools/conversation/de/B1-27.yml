- type: narrator
  text:
    en: 'Reported speech uses Konjunktiv I, mostly in news and writing: «Sie sagt, sie sei aus Leipzig und habe nie Hochdeutsch gelernt». In everyday talk people often use the normal form: «Sie sagt, sie
      ist aus Leipzig».'
    ar: 'الكلام المنقول يستعمل صيغة Konjunktiv I، غالبًا في الأخبار والكتابة: «Sie sagt, sie sei aus Leipzig und habe nie Hochdeutsch gelernt». وفي الكلام اليومي يستعمل الناس غالبًا الصيغة العادية: «Sie
      sagt, sie ist aus Leipzig».'
    mk: 'Пренесениот говор користи Konjunktiv I, главно во вестите и пишувањето: «Sie sagt, sie sei aus Leipzig und habe nie Hochdeutsch gelernt». Во секојдневниот говор луѓето често користат обична форма:
      «Sie sagt, sie ist aus Leipzig».'
