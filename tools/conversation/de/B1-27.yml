steps:
- type: narrator
  text:
    en: At the bakery an old woman speaks Saxon. You understand nothing. Frau Becker translates — and reports what she said. Listen to the conversation; you don't need to understand it yet.
    ar: في المخبز امرأة عجوز تتكلّم اللهجة السكسونية. لا تفهمين شيئًا. السيدة بيكر تترجم — وتنقل ما قالته. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Во пекарницата една старица зборува саксонски. Ништо не разбирате. Госпоѓа Бекер преведува — и пренесува што рекла. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: baeckerin
    text: Nu, gännse mir ma ä Gäffchen machen?
    meaning:
      en: (Saxon) Right, could you make me a little coffee?
      ar: (بالسكسونية) طيب، ممكن تعمليلي قهوة صغيرة؟
      mk: (саксонски) Ајде, можете ли да ми направите едно кафенце?
  - speaker: protagonist
    text: Entschuldigung... ich verstehe kein Wort.
    meaning:
      en: Sorry... I don't understand a word.
      ar: عذرًا... لا أفهم ولا كلمة.
      mk: Извинете... не разбирам ниту збор.
  - speaker: becker
    text: Das ist Sächsisch. Sie sagt, sie möchte einen Kaffee. „Nu“ heißt ja.
    meaning:
      en: That's Saxon. She says she'd like a coffee. 'Nu' means yes.
      ar: هذه السكسونية. تقول إنها تريد قهوة. «Nu» تعني نعم.
      mk: Тоа е саксонски. Вели дека сака кафе. „Nu“ значи да.
  - speaker: protagonist
    text: Und was hat sie jetzt gesagt?
    meaning:
      en: And what did she just say?
      ar: وماذا قالت الآن؟
      mk: А што рече сега?
  - speaker: becker
    text: Sie sagt, sie sei aus Leipzig und habe nie Hochdeutsch gelernt.
    meaning:
      en: She says she's from Leipzig and never learned standard German.
      ar: تقول إنها من لايبزيغ ولم تتعلّم الألمانية الفصحى قط.
      mk: Вели дека е од Лајпциг и никогаш не научила стандарден германски.
  - speaker: protagonist
    text: Sprechen alle hier so?
    meaning:
      en: Does everyone here speak like that?
      ar: هل يتكلّم الجميع هنا هكذا؟
      mk: Дали сите тука зборуваат така?
  - speaker: becker
    text: Die Älteren mehr. Die Jungen haben nur einen Akzent. Es klingt gemütlich, oder?
    meaning:
      en: Older people more. The young only have an accent. It sounds cosy, doesn't it?
      ar: الكبار أكثر. والشباب لديهم لكنة فقط. يبدو الأمر دافئًا، أليس كذلك؟
      mk: Постарите повеќе. Младите имаат само акцент. Звучи пријатно, нели?
  - speaker: protagonist
    text: Nu! Ich möchte auch einen Gaffee.
    meaning:
      en: Nu! I'd like a coffee too.
      ar: Nu! أريد قهوة أنا أيضًا.
      mk: Nu! И јас сакам едно кафе.
