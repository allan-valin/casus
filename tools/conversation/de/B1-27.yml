  - gaffee
- type: narrator
  text:
    en: 'Germany has many dialects: Saxon around Leipzig and Dresden softens k, p, t to g, b, d (Gaffee). Bavarian, Swabian and Low German sound different again. Everyone understands standard German; dialect
      is a sign of home, not of poor education — never mock it.'
    ar: 'في ألمانيا لهجات كثيرة: السكسونية حول لايبزيغ ودرسدن تليّن k وp وt إلى g وb وd (Gaffee). والبافارية والشوابية والألمانية السفلى تبدو مختلفة أيضًا. الجميع يفهم الفصحى؛ واللهجة علامة على الانتماء
      لا على قلة التعليم — لا تسخري منها أبدًا.'
    mk: 'Германија има многу дијалекти: саксонскиот околу Лајпциг и Дрезден ги омекнува k, p, t во g, b, d (Gaffee). Баварскиот, швапскиот и долногерманскиот звучат пак поинаку. Сите го разбираат стандардниот
      германски; дијалектот е знак на родно место, не на слабо образование — никогаш не се потсмевајте.'
