    text: Ich bitte um erneute Prüfung.
  items:
  - ich-bitte-um-pruefung
- type: narrator
  text:
    en: Every official decision (Bescheid) ends with a notice of how and by when you can appeal — usually one month. Appeal in writing and signed, keep proof of delivery, and give reasons (you may add them
      later). An appeal is free; if it's rejected, the next step is court. Tax decisions use 'Einspruch' instead.
    ar: كل قرار رسمي (Bescheid) ينتهي بإشعار بكيفية الاعتراض وموعده — عادةً شهر واحد. اعترض كتابيًا وموقَّعًا، واحتفظ بإثبات التسليم، واذكر الأسباب (يمكنك إضافتها لاحقًا). الاعتراض مجاني؛ وإن رُفض فالخطوة
      التالية المحكمة. وفي القرارات الضريبية يُسمّى «Einspruch».
    mk: Секое официјално решение (Bescheid) завршува со поука како и до кога можете да се жалите — обично еден месец. Жалете се писмено и потпишано, чувајте доказ за доставување и дајте причини (може и
      подоцна). Жалбата е бесплатна; ако се одбие, следен чекор е суд. Кај даночните решенија се вика „Einspruch“.
