steps:
- type: narrator
  text:
    en: The city refused your resident parking permit — wrongly, you think. Jonas helps you write an appeal, in time. Listen to the conversation; you don't need to understand it yet.
    ar: رفضت المدينة تصريح موقف السكان الخاص بك — خطأً كما تظن. يوناس يساعدك في كتابة اعتراض، في الموعد. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Градот ви ја одби дозволата за паркирање на жители — погрешно, мислите. Јонас ви помага да напишете жалба, навреме. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Die Stadt sagt, mein Auto sei nicht auf mich zugelassen. Aber das stimmt nicht!
    meaning:
      en: The city says my car isn't registered to me. But that's not true!
      ar: المدينة تقول إنّ سيارتي ليست مسجّلة باسمي. لكن هذا غير صحيح!
      mk: Градот вели дека колата не е регистрирана на мене. Но тоа не е точно!
  - speaker: jonas
    text: 'Steht unten eine Rechtsbehelfsbelehrung? ... Ja: ein Monat für den Widerspruch.'
    meaning:
      en: 'Is there a notice of appeal rights at the bottom? ... Yes: one month for an appeal.'
      ar: 'هل في الأسفل إشعار سبل الطعن؟ ... نعم: شهر واحد للاعتراض.'
      mk: 'Има ли долу поука за правен лек? ... Да: еден месец за жалба.'
  - speaker: protagonist
    text: Und wie fange ich an?
    meaning:
      en: And how do I start?
      ar: وكيف أبدأ؟
      mk: А како да почнам?
  - speaker: jonas
    text: 'So: „Hiermit lege ich fristgerecht Widerspruch gegen den Bescheid vom 3. Mai ein, Aktenzeichen ...“'
    meaning:
      en: 'Like this: ''I hereby lodge an appeal within the deadline against the decision of 3 May, reference …'''
      ar: 'هكذا: «أتقدّم بموجب هذا في المهلة المحدّدة باعتراض على القرار المؤرَّخ في 3 مايو، رقم الملف …»'
      mk: 'Вака: „Со ова во рок поднесувам жалба против решението од 3 мај, број на предмет …“'
  - speaker: protagonist
    text: Und dann die Begründung?
    meaning:
      en: And then the grounds?
      ar: ثم التعليل؟
      mk: А потоа образложението?
  - speaker: jonas
    text: 'Genau. Kurz und sachlich: der Fahrzeugschein als Anlage. Dann: „Ich bitte um erneute Prüfung.“'
    meaning:
      en: 'Exactly. Short and factual: the vehicle registration document as an enclosure. Then: ''I request a re-examination.'''
      ar: 'بالضبط. قصير وموضوعي: وثيقة تسجيل المركبة مرفقة. ثم: «أرجو إعادة النظر.»'
      mk: 'Точно. Кратко и деловно: сообраќајната дозвола во прилог. Потоа: „Барам повторна проверка.“'
  - speaker: protagonist
    text: Mit Unterschrift, per Post?
    meaning:
      en: With a signature, by post?
      ar: بتوقيع، بالبريد؟
      mk: Со потпис, по пошта?
  - speaker: jonas
    text: Ja, oder persönlich mit Eingangsstempel. Dann hast du den Beweis.
    meaning:
      en: Yes, or in person with a receipt stamp. Then you have proof.
      ar: نعم، أو شخصيًا مع ختم الاستلام. عندها يكون لديك الدليل.
      mk: Да, или лично со печат за прием. Тогаш имаш доказ.
- type: prompt
  ask:
    en: 'Say: the resident parking permit.'
    ar: 'قل: تصريح موقف السكان.'
    mk: 'Кажете: дозволата за паркирање.'
  answer:
    speaker: protagonist
    text: Der Bewohnerparkausweis.
  items:
  - der-bewohnerparkausweis
- type: prompt
  ask:
    en: 'Say: the notice of appeal rights.'
    ar: 'قل: إشعار سبل الطعن.'
    mk: 'Кажете: поуката за правен лек.'
  answer:
    speaker: protagonist
    text: Die Rechtsbehelfsbelehrung.
  items:
  - die-rechtsbehelfsbelehrung
- type: narrator
  text:
    en: 'An appeal letter has fixed parts: «Hiermit lege ich fristgerecht Widerspruch gegen den Bescheid vom … ein», «Aktenzeichen», «Begründung», «Anlage», «Ich bitte um erneute Prüfung», signature.'
    ar: 'لرسالة الاعتراض أجزاء ثابتة: «Hiermit lege ich fristgerecht Widerspruch gegen den Bescheid vom … ein»، «Aktenzeichen»، «Begründung»، «Anlage»، «Ich bitte um erneute Prüfung»، والتوقيع.'
    mk: 'Писмото за жалба има фиксни делови: «Hiermit lege ich fristgerecht Widerspruch gegen den Bescheid vom … ein», «Aktenzeichen», «Begründung», «Anlage», «Ich bitte um erneute Prüfung», потпис.'
