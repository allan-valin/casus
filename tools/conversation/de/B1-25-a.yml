steps:
- type: narrator
  text:
    ar: يارا في الروضة حتى الظهر. تفكّرين في عمل صغير، وزوجكِ في عمل ثانٍ. الجارة لينا تنصحكما. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Lena, Yara ist vormittags in der Kita. Ich möchte einen Minijob.
    meaning:
      ar: لينا، يارا في الروضة قبل الظهر. أريد عملًا صغيرًا.
  - speaker: lena
    text: Gute Idee! In der Bäckerei suchen sie jemanden. Frag nach dem Stundenlohn.
    meaning:
      ar: فكرة جيدة! المخبز يبحث عن أحد. اسألي عن الأجر بالساعة.
  - speaker: protagonist
    text: Und mein Mann will einen zweiten Job, am Wochenende.
    meaning:
      ar: وزوجي يريد عملًا ثانيًا في نهاية الأسبوع.
  - speaker: lena
    text: 'Vorsicht: ein zweiter Job kommt in Steuerklasse sechs. Da bleibt wenig netto.'
    meaning:
      ar: 'انتبهي: العمل الثاني يدخل في الفئة الضريبية السادسة. لا يبقى صافٍ إلا القليل.'
  - speaker: protagonist
    text: Lohnt sich das dann überhaupt?
    meaning:
      ar: إذن هل يستحق ذلك العناء أصلًا؟
  - speaker: lena
    text: Rechne nach! Vielleicht bringen Überstunden in der Firma mehr netto.
    meaning:
      ar: احسبي! ربما الساعات الإضافية في الشركة تجلب صافيًا أكثر.
  - speaker: protagonist
    text: Und die Kita-Zeiten? Die Bäckerei öffnet um sechs.
    meaning:
      ar: ومواعيد الروضة؟ المخبز يفتح في السادسة.
  - speaker: lena
    text: 'Dann sag ihm: frag deinen Chef nach Gleitzeit. Und du nimmst die späten Stunden.'
    meaning:
      ar: 'إذن قولي له: اسأل مديرك عن الدوام المرن. وأنتِ تأخذين الساعات المتأخرة.'
