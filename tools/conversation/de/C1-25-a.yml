steps:
- type: narrator
  text:
    ar: رنا تحكي لكِ عن ابنة عمّها التي بقيت في البلد ولم يُسمح لها أن تختار — وعمّا تعلّمته هنا. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
- type: dialogue
  lines:
  - speaker: rana
    text: Meine Cousine durfte nicht weiter zur Schule gehen. Mit sechzehn wurde sie verheiratet.
    meaning:
      ar: ابنة عمّي لم يُسمح لها بمتابعة المدرسة. زُوّجت في السادسة عشرة.
  - speaker: protagonist
    text: Hat man sie gefragt?
    meaning:
      ar: هل سألها أحد؟
  - speaker: rana
    text: Nein. Und als die Ehe schlecht war, gab man ihr die Schuld.
    meaning:
      ar: لا. وحين ساء الزواج لاموها هي.
  - speaker: protagonist
    text: Sie ist das Opfer. Nicht die Schuldige.
    meaning:
      ar: إنها الضحية. لا المذنبة.
  - speaker: rana
    text: 'Hier habe ich ein Wort gelernt: Selbstbestimmung. Die Entscheidung über das eigene Leben.'
    meaning:
      ar: 'هنا تعلّمتُ كلمة: تقرير المصير. القرار في الحياة الخاصة.'
  - speaker: protagonist
    text: Und Gleichberechtigung steht im Grundgesetz — für alle Frauen hier.
    meaning:
      ar: والمساواة في الحقوق منصوص عليها في القانون الأساسي — لكل النساء هنا.
  - speaker: rana
    text: 'Wenn eine Frau hier Hilfe braucht: Es gibt ein Hilfetelefon, anonym, auch auf Arabisch.'
    meaning:
      ar: 'إذا احتاجت امرأة هنا إلى مساعدة: هناك خط هاتفي للمساعدة، دون كشف الهوية، بالعربية أيضًا.'
  - speaker: protagonist
    text: Und Frauenhäuser. Niemand darf eine Frau hier zwingen.
    meaning:
      ar: ودور حماية النساء. لا يحق لأحد هنا أن يُكره امرأة.
