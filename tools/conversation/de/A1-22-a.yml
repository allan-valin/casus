steps:
- type: narrator
  text:
    ar: الحضانة تغلق في الرابعة والنصف. تصل في الخامسة إلا ربعًا. السيدة كروغر تنتظر مع يارا. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Entschuldigung! Bin ich zu spät?
    meaning:
      ar: عفوًا! هل تأخرت؟
  - speaker: kruger
    text: Ja. Wir schließen um halb fünf. Jetzt ist es Viertel vor fünf.
    meaning:
      ar: نعم. نغلق في الرابعة والنصف. الآن الخامسة إلا ربعًا.
  - speaker: protagonist
    text: Es tut mir leid. Die Straßenbahn hatte Verspätung.
    meaning:
      ar: آسف. الترام تأخر.
  - speaker: kruger
    text: Das kann passieren. Aber bitte rufen Sie an.
    meaning:
      ar: قد يحدث هذا. لكن من فضلك اتصل.
  - speaker: protagonist
    text: Wie spät kann ich kommen?
    meaning:
      ar: إلى أيّ ساعة يمكنني أن آتي؟
  - speaker: kruger
    text: Bis halb fünf. Pünktlich, bitte.
    meaning:
      ar: حتى الرابعة والنصف. في الموعد من فضلك.
  - speaker: protagonist
    text: Verstanden. Das nächste Mal bin ich pünktlich.
    meaning:
      ar: فهمت. في المرة القادمة سآتي في الموعد.
  - speaker: yara
    text: Papa! Ich habe gewartet!
    meaning:
      ar: بابا! انتظرتُ!
