steps:
- type: narrator
  text:
    mk: Стефан, пријателот на Петар, има кафуле и му треба помош за колачите. Ве прашува дали би помогнале. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: stefan
    text: Petar sagt, Sie backen den besten Kuchen. Können Sie bei mir aushelfen?
    meaning:
      mk: Петар вели дека го печете најдобриот колач. Можете ли да ми помогнете?
  - speaker: protagonist
    text: Gerne! Aber nenn mich einfach Baba. Hier, probier mal meine Baklava.
    meaning:
      mk: Со задоволство! Но викај ме само баба. Еве, проба ја мојата баклава.
  - speaker: stefan
    text: Unglaublich! Bring morgen das Rezept mit!
    meaning:
      mk: Неверојатно! Донеси го рецептот утре!
  - speaker: protagonist
    text: Und das Geld? Ich will nicht schwarzarbeiten.
    meaning:
      mk: А парите? Не сакам да работам на црно.
  - speaker: stefan
    text: Natürlich nicht. Ich melde Sie als Minijob an.
    meaning:
      mk: Се разбира не. Ќе ве пријавам како мала работа.
  - speaker: protagonist
    text: Ist das ein Problem mit meiner Rente?
    meaning:
      mk: Дали е тоа проблем со мојата пензија?
  - speaker: stefan
    text: Fragen Sie in Mazedonien nach. Petar hilft Ihnen.
    meaning:
      mk: Прашајте во Македонија. Петар ќе ви помогне.
  - speaker: protagonist
    text: 'Gut. Und du: back nie wieder Kuchen aus der Packung!'
    meaning:
      mk: 'Добро. А ти: никогаш повеќе не печи колач од кутија!'
