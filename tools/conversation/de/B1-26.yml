steps:
- type: narrator
  text:
    en: 31 December on the street with Jonas and Paul. Fireworks everywhere — and good resolutions. Listen to the conversation; you don't need to understand it yet.
    ar: 31 ديسمبر في الشارع مع يوناس وباول. ألعاب نارية في كل مكان — وقرارات حسنة للسنة الجديدة. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: 31 декември на улица со Јонас и Паул. Огномет насекаде — и добри одлуки. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: Noch zehn Minuten bis Mitternacht! Hast du gute Vorsätze?
    meaning:
      en: Ten more minutes to midnight! Do you have resolutions?
      ar: عشر دقائق حتى منتصف الليل! هل عندك قرارات للسنة الجديدة؟
      mk: Уште десет минути до полноќ! Имаш ли новогодишни одлуки?
  - speaker: protagonist
    text: Ja. Ich werde jeden Tag Deutsch sprechen. Und du?
    meaning:
      en: Yes. I'll speak German every day. And you?
      ar: نعم. سأتكلّم الألمانية كل يوم. وأنت؟
      mk: Да. Секој ден ќе зборувам германски. А ти?
  - speaker: jonas
    text: Ich werde aufhören zu rauchen. Wie jedes Jahr!
    meaning:
      en: I'll stop smoking. Like every year!
      ar: سأتوقّف عن التدخين. كما في كل سنة!
      mk: Ќе престанам да пушам. Како секоја година!
  - speaker: paul
    text: Und ich werde anfangen, Sport zu machen. Morgen. Oder übermorgen.
    meaning:
      en: And I'll start doing sport. Tomorrow. Or the day after.
      ar: وأنا سأبدأ ممارسة الرياضة. غدًا. أو بعد غد.
      mk: А јас ќе почнам да вежбам. Утре. Или задутре.
  - speaker: protagonist
    text: Warum knallt es schon überall?
    meaning:
      en: Why is everything already banging?
      ar: لماذا الدويّ في كل مكان منذ الآن؟
      mk: Зошто веќе насекаде треска?
  - speaker: jonas
    text: Silvester eben! Aber pass auf, Feuerwerk ist gefährlich. Nicht zu nah!
    meaning:
      en: That's New Year's Eve! But careful, fireworks are dangerous. Not too close!
      ar: إنها ليلة رأس السنة! لكن انتبه، الألعاب النارية خطيرة. لا تقترب كثيرًا!
      mk: Таква е новогодишната ноќ! Но внимавај, огнометот е опасен. Не премногу блиску!
  - speaker: paul
    text: Drei, zwei, eins — Frohes neues Jahr!
    meaning:
      en: Three, two, one — Happy New Year!
      ar: ثلاثة، اثنان، واحد — سنة جديدة سعيدة!
      mk: Три, два, еден — Среќна Нова година!
  - speaker: protagonist
    text: 'Frohes neues Jahr! Und morgen: Wachsgießen?'
    meaning:
      en: 'Happy New Year! And tomorrow: wax pouring?'
      ar: 'سنة جديدة سعيدة! وغدًا: صبّ الشمع؟'
      mk: 'Среќна Нова година! А утре: леење восок?'
- type: prompt
  ask:
    en: 'Say: ten minutes to midnight.'
    ar: 'قل: عشر دقائق حتى منتصف الليل.'
    mk: 'Кажете: десет минути до полноќ.'
  answer:
    speaker: protagonist
    text: Zehn Minuten bis Mitternacht.
  items:
  - um-mitternacht
- type: prompt
  ask:
    en: 'Ask: do you have resolutions?'
    ar: 'اسأل: هل عندك قرارات للسنة الجديدة؟'
