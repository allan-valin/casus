- type: narrator
  text:
    en: On Silvester private fireworks are allowed — the streets bang from the evening on, and every year people are hurt. Keep your distance, keep children and pets inside. Fireworks are sold only in the
      last days of December. On 1 January you wish «Frohes neues Jahr» for days.
    ar: في ليلة رأس السنة يُسمح بالألعاب النارية الخاصة — تدوّي الشوارع منذ المساء، ويُصاب أناس كل سنة. حافظ على المسافة، وأبقِ الأطفال والحيوانات في البيت. تُباع الألعاب النارية في الأيام الأخيرة من ديسمبر
      فقط. وفي 1 يناير تقول «Frohes neues Jahr» لأيام.
    mk: На Силвестер приватниот огномет е дозволен — улиците треснуваат уште од вечерта, а секоја година има повредени. Држете растојание, децата и миленичињата нека се внатре. Огномет се продава само последните
      денови од декември. На 1 јануари со денови се посакува «Frohes neues Jahr».
