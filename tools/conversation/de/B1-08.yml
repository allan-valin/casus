steps:
- type: narrator
  text:
    en: At Jonas's. He offers a drink once, you politely refuse — and nothing more comes. Listen to the conversation; you don't need to understand it yet.
    ar: عند يوناس. يعرض عليك شرابًا مرة واحدة، فترفض بأدب — ولا يأتي شيء بعد ذلك. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Кај Јонас. Ви нуди пијалок еднаш, вие учтиво одбивате — и ништо повеќе не доаѓа. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: jonas
    text: Möchtest du etwas trinken?
    meaning:
      en: Would you like something to drink?
      ar: هل تريد شيئًا تشربه؟
      mk: Сакаш ли нешто да пиеш?
  - speaker: protagonist
    text: Nein, danke.
    meaning:
      en: No, thanks.
      ar: لا، شكرًا.
      mk: Не, благодарам.
  - speaker: jonas
    text: Okay. Also, der Film...
    meaning:
      en: OK. So, the film...
      ar: حسنًا. إذن، الفيلم...
      mk: Добро. Значи, филмот...
  - speaker: protagonist
    text: Ehrlich gesagt... ich hatte Durst. Ich wusste nicht, ob du noch einmal fragst.
    meaning:
      en: To be honest... I was thirsty. I didn't know whether you'd ask again.
      ar: بصراحة... كنت عطشانًا. لم أكن أعرف إن كنت ستسأل مرة أخرى.
      mk: Искрено... бев жеден. Не знаев дали ќе прашаш уште еднаш.
  - speaker: jonas
    text: Noch einmal? Nein heißt nein!
    meaning:
      en: Again? No means no!
      ar: مرة أخرى؟ «لا» تعني لا!
      mk: Уште еднаш? Не значи не!
  - speaker: protagonist
    text: Bei uns fragt man dreimal. Das erste Nein ist nur höflich.
    meaning:
      en: Where I'm from, people ask three times. The first no is just politeness.
      ar: عندنا يسأل الناس ثلاث مرات. «لا» الأولى مجرد أدب.
      mk: Кај нас се прашува три пати. Првото не е само учтивост.
  - speaker: jonas
    text: Das wusste ich nicht! Sag einfach „gerne“. Wasser oder Saft?
    meaning:
      en: I didn't know that! Just say 'yes please'. Water or juice?
      ar: لم أكن أعرف ذلك! قل ببساطة «بكل سرور». ماء أم عصير؟
      mk: Не го знаев тоа! Само кажи „со задоволство“. Вода или сок?
  - speaker: protagonist
    text: Gerne einen Saft! Beim zweiten Mal sage ich ja.
    meaning:
      en: Juice, please! The second time I say yes.
      ar: عصيرًا بكل سرور! في المرة الثانية أقول نعم.
      mk: Сок, со задоволство! Вториот пат велам да.
- type: prompt
  ask:
    en: 'He offers: would you like something to drink?'
    ar: 'يعرض: هل تريد شيئًا تشربه؟'
    mk: 'Тој нуди: сакаш ли нешто да пиеш?'
  answer:
    speaker: protagonist
