    ar: 'الأسئلة غير المباشرة: «ob» (إن كان) أو كلمة سؤال، والفعل في الآخر: «Ich wusste nicht, ob du noch einmal fragst».'
    mk: 'Индиректни прашања: «ob» (дали) или прашален збор, глаголот на крајот: «Ich wusste nicht, ob du noch einmal fragst».'
