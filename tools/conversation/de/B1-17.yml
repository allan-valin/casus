steps:
- type: narrator
  text:
    en: A flat viewing. Thirty people on the stairs for one flat. Herr Braun shows you round. Listen to the conversation; you don't need to understand it yet.
    ar: معاينة شقة. ثلاثون شخصًا على الدرج لشقة واحدة. السيد براون يُريكِ المكان. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Разгледување стан. Триесет луѓе на скалите за еден стан. Господин Браун ви го покажува. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: braun
    text: Das ist die Wohnung, in der ich zwanzig Jahre gewohnt habe.
    meaning:
      en: This is the flat I lived in for twenty years.
      ar: هذه الشقة التي سكنتُ فيها عشرين عامًا.
      mk: Ова е станот во кој живеев дваесет години.
  - speaker: protagonist
    text: Sehr schön! Wie hoch ist die Kaltmiete?
    meaning:
      en: Very nice! What's the rent without utilities?
      ar: جميلة جدًا! كم الإيجار الصافي؟
      mk: Многу убав! Колкава е киријата без режии?
  - speaker: braun
    text: Sie steht in der Anzeige. Mit Nebenkosten ist die Warmmiete etwa ein Drittel höher.
    meaning:
      en: It's in the ad. With utilities, the full rent is about a third higher.
      ar: مكتوب في الإعلان. مع التكاليف الإضافية يصبح الإيجار الشامل أعلى بنحو الثلث.
      mk: Пишува во огласот. Со режиите киријата е околу третина повисока.
  - speaker: protagonist
    text: Und die Kaution?
    meaning:
      en: And the deposit?
      ar: والتأمين؟
      mk: А депозитот?
  - speaker: braun
    text: Drei Kaltmieten. Haben Sie eine Mappe? Schufa-Auskunft, Gehaltsnachweis?
    meaning:
      en: Three months' rent. Do you have a folder? Credit report, proof of income?
      ar: ثلاثة أشهر من الإيجار الصافي. هل معكِ ملف؟ تقرير ائتماني، إثبات دخل؟
      mk: Три кирии. Имате ли папка? Кредитен извештај, потврда за плата?
  - speaker: protagonist
    text: Ja, alles hier. Und das ist meine Freundin, mit der ich vielleicht einziehe.
    meaning:
      en: Yes, all here. And this is my friend, with whom I may move in.
      ar: نعم، كله هنا. وهذه صديقتي التي قد أسكن معها.
      mk: Да, сѐ е тука. А ова е мојата пријателка, со која можеби ќе се вселам.
  - speaker: braun
    text: Danke. Wir melden uns. Es gibt viele Bewerber.
    meaning:
      en: Thank you. We'll be in touch. There are many applicants.
      ar: شكرًا. سنتواصل معكِ. هناك متقدّمون كثيرون.
      mk: Благодарам. Ќе ви се јавиме. Има многу кандидати.
  - speaker: protagonist
    text: Der Wohnungsmangel ist schlimm hier.
    meaning:
      en: The housing shortage is bad here.
      ar: نقص المساكن سيئ هنا.
      mk: Недостигот на станови е лош тука.
- type: prompt
  ask:
    en: 'Say: the viewing.'
    ar: 'قولي: المعاينة.'
    mk: 'Кажете: разгледувањето.'
  answer:
    speaker: protagonist
    text: Die Besichtigung.
  items:
  - die-besichtigung
- type: narrator
  text:
    en: 'Relative clauses with a preposition: the preposition comes first. «die Wohnung, in der ich gewohnt habe», «meine Freundin, mit der ich einziehe».'
    ar: 'جمل الصلة مع حرف جر: حرف الجر يأتي أولًا. «die Wohnung, in der ich gewohnt habe»، «meine Freundin, mit der ich einziehe».'
    mk: 'Релативни реченици со предлог: предлогот оди прв. «die Wohnung, in der ich gewohnt habe», «meine Freundin, mit der ich einziehe».'
- type: prompt
  ask:
    en: 'Say: the flat I lived in.'
    ar: 'قولي: الشقة التي سكنتُ فيها.'
    mk: 'Кажете: станот во кој живеев.'
  answer:
