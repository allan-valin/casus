- type: narrator
  text:
    en: 'Kaltmiete is the bare rent; Nebenkosten add heating, water, rubbish, caretaker; together they make the Warmmiete — compare that. The deposit is at most three months'' Kaltmiete. In big cities dozens
      apply for one flat, and a foreign name can mean fewer replies: that discrimination is illegal, and anti-discrimination offices advise for free. Students are often pointed to the Wohnheim first — it
      is not always the cheapest; compare a WG too, where you are chosen at a ''WG-Casting''.'
    ar: 'الإيجار الصافي (Kaltmiete) هو الإيجار المجرّد؛ والتكاليف الإضافية تضيف التدفئة والماء والنفايات وحارس العمارة؛ ومعًا تكوّن الإيجار الشامل (Warmmiete) — قارني به. التأمين ثلاثة أشهر من الإيجار الصافي
      على الأكثر. في المدن الكبيرة يتقدّم العشرات لشقة واحدة، وقد يعني الاسم الأجنبي ردودًا أقل: هذا التمييز ممنوع قانونًا، ومكاتب مكافحة التمييز تقدّم استشارة مجانية.'
    mk: 'Kaltmiete е голата кирија; режиите додаваат греење, вода, ѓубре, домар; заедно ја прават Warmmiete — споредувајте ја неа. Депозитот е најмногу три кирии без режии. Во големите градови десетици
      се пријавуваат за еден стан, а странско име може да значи помалку одговори: таа дискриминација е незаконска, а канцелариите против дискриминација советуваат бесплатно.'
