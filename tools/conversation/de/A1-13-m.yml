steps:
- type: narrator
  text:
    mk: Лука е на лулашката. Една млада мајка почнува разговор со вас. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: lena
    text: Hallo! Wie alt ist er?
    meaning:
      mk: Здраво! Колку години има?
  - speaker: protagonist
    text: Hallo. Luka ist vier Jahre alt.
    meaning:
      mk: Здраво. Лука има четири години.
  - speaker: lena
    text: Ist das Ihr Enkel?
    meaning:
      mk: Ова ли е вашиот внук?
  - speaker: protagonist
    text: Ja, ich bin die Oma. Ich bin nicht von hier, aus Mazedonien.
    meaning:
      mk: Да, јас сум бабата. Не сум одовде, од Македонија.
  - speaker: lena
    text: Toll! Sprechen Sie mit Luka Deutsch?
    meaning:
      mk: Супер! Зборувате ли германски со Лука?
  - speaker: protagonist
    text: Nein, Mazedonisch. Mein Deutsch ist nur ein bisschen.
    meaning:
      mk: Не, македонски. Мојот германски е само малку.
  - speaker: lena
    text: Das ist gut! Dann lernt er zwei Sprachen.
    meaning:
      mk: Тоа е добро! Така учи два јазика.
  - speaker: protagonist
    text: Luka, nicht so hoch auf der Schaukel!
    meaning:
      mk: Лука, не толку високо на лулашката!
  - speaker: lena
    text: Ich bin Lena. Bis bald!
    meaning:
      mk: Јас сум Лена. Се гледаме наскоро!
