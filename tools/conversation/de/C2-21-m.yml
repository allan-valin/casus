steps:
- type: narrator
  text:
    mk: Летото го носите Лука во Битола. Тој ве прашува на германски — неговиот полесен јазик. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: luka
    text: Oma, warum kommen hier die Nachbarn einfach vorbei? Ohne Termin?
    meaning:
      mk: Бабо, зошто тука соседите едноставно наминуваат? Без договор?
  - speaker: protagonist
    text: So ist das bei uns. In Leipzig ruft man vorher an.
    meaning:
      mk: Така е кај нас. Во Лајпциг се јавуваш однапред.
  - speaker: luka
    text: Mir gefällt das. Und der Hof mit den Feigen!
    meaning:
      mk: Ми се допаѓа тоа. И дворот со смоквите!
  - speaker: protagonist
    text: Weißt du, mir ist manches fremd geworden. Die Stadt hat sich verändert — und ich auch.
    meaning:
      mk: Знаеш, некои работи ми станаа туѓи. Градот се промени — и јас исто.
  - speaker: luka
    text: Hast du Sehnsucht nach Leipzig?
    meaning:
      mk: Ти недостига ли Лајпциг?
  - speaker: protagonist
    text: Ein bisschen. Nach dir zu Hause, nach der Ordnung. Das ist der umgekehrte Kulturschock.
    meaning:
      mk: Малку. По тебе дома, по редот. Тоа е обратниот културен шок.
  - speaker: luka
    text: Dann sitzt du zwischen den Stühlen, sagt Mama.
    meaning:
      mk: Тогаш си меѓу два стола, вели мама.
  - speaker: protagonist
    text: Oder ich bin doppelt zu Hause — wie du.
    meaning:
      mk: Или сум двојно дома — како тебе.
