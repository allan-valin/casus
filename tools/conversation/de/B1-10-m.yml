steps:
- type: narrator
  text:
    mk: Петар ви објаснува дали како пензионер од ЕУ имате право на нешто во Германија. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Petar, habe ich hier ein Recht auf Rente?
    meaning:
      mk: Петре, имам ли тука право на пензија?
  - speaker: petar
    text: Nein, Papa. Deine Rente kommt aus Mazedonien, weil du dort gearbeitet hast.
    meaning:
      mk: Не, тато. Твојата пензија доаѓа од Македонија, затоа што таму работеше.
  - speaker: protagonist
    text: Obwohl ich einen bulgarischen Pass habe?
    meaning:
      mk: Иако имам бугарски пасош?
  - speaker: petar
    text: Ja. Der Pass gibt dir das Recht, hier zu wohnen — nicht automatisch Geld.
    meaning:
      mk: Да. Пасошот ти дава право да живееш тука — не автоматски пари.
  - speaker: protagonist
    text: Und wenn ich krank werde?
    meaning:
      mk: А ако се разболам?
  - speaker: petar
    text: Die Krankenversicherung ist wichtig. Du musst zeigen, dass du versichert bist und genug zum Leben hast.
    meaning:
      mk: Здравственото осигурување е важно. Мора да покажеш дека си осигурен и дека имаш доволно за живот.
  - speaker: protagonist
    text: Das ist kompliziert.
    meaning:
      mk: Тоа е комплицирано.
  - speaker: petar
    text: Ja. Lass dich beraten — die Regeln für EU-Rentner ändern sich.
    meaning:
      mk: Да. Посоветувај се — правилата за пензионери од ЕУ се менуваат.
