steps:
- type: narrator
  text:
    en: The MRI results are in. Dr Wagner explains the report in detail — and the orthopaedist wants to operate. You ask about a second opinion. Listen to the conversation; you don't need to understand
      it yet.
    ar: وصلت نتائج الرنين المغناطيسي. الدكتورة فاغنر تشرح التقرير بالتفصيل — وطبيب العظام يريد إجراء عملية. تسأل عن رأي ثانٍ. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Резултатите од магнетната резонанца стигнаа. Д-р Вагнер детално го објаснува наодот — а ортопедот сака да оперира. Прашувате за второ мислење. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: wagner
    text: Der Befund zeigt einen Meniskusriss im rechten Knie. Kein Grund zur Panik.
    meaning:
      en: The report shows a torn meniscus in your right knee. No reason to panic.
      ar: التقرير يُظهر تمزّقًا في الغضروف الهلالي في الركبة اليمنى. لا داعي للذعر.
      mk: Наодот покажува кинење на менискусот во десното колено. Нема причина за паника.
  - speaker: protagonist
    text: Der Orthopäde will sofort operieren. Ist der Eingriff wirklich nötig?
    meaning:
      en: The orthopaedist wants to operate at once. Is the procedure really necessary?
      ar: طبيب العظام يريد إجراء العملية فورًا. هل التدخّل ضروري حقًا؟
      mk: Ортопедот сака веднаш да оперира. Дали интервенцијата е навистина потребна?
  - speaker: wagner
    text: Nicht unbedingt. Bei Ihrem Alter kann man oft erst konservativ behandeln — mit Physiotherapie.
    meaning:
      en: Not necessarily. At your age it can often be treated without surgery first — with physiotherapy.
      ar: ليس بالضرورة. في عمرك يمكن غالبًا العلاج أولًا دون جراحة — بالعلاج الطبيعي.
      mk: Не мора. На ваша возраст често прво може да се лекува конзервативно — со физиотерапија.
  - speaker: protagonist
    text: Und die Erfolgsaussichten? Und die Risiken einer Operation?
    meaning:
      en: And the chances of success? And the risks of an operation?
      ar: وفرص النجاح؟ ومخاطر العملية؟
      mk: А изгледите за успех? И ризиците од операција?
  - speaker: wagner
    text: Das muss Ihnen der Operateur im Aufklärungsgespräch genau erklären. Fragen Sie alles.
    meaning:
      en: The surgeon must explain that precisely in the informed-consent talk. Ask everything.
      ar: يجب أن يشرح لك الجرّاح ذلك بدقة في حديث الإفصاح قبل العملية. اسأل عن كل شيء.
      mk: Тоа мора точно да ви го објасни хирургот во разговорот за информирана согласност. Прашајте сè.
  - speaker: protagonist
    text: Darf ich eine Zweitmeinung einholen?
    meaning:
      en: May I get a second opinion?
      ar: هل يحق لي طلب رأي طبي ثانٍ؟
      mk: Смеам ли да побарам второ мислење?
  - speaker: wagner
    text: Selbstverständlich. Bei manchen geplanten Operationen haben Sie sogar einen gesetzlichen Anspruch darauf.
    meaning:
      en: Of course. For some planned operations you even have a legal right to one.
      ar: بالطبع. في بعض العمليات المخطّط لها لديك حتى حق قانوني في ذلك.
      mk: Се разбира. За некои планирани операции имате дури законско право на тоа.
  - speaker: protagonist
    text: Dann warte ich mit der Diagnose ab und hole mir eine zweite Meinung.
    meaning:
      en: Then I'll hold on with the diagnosis and get a second opinion.
      ar: إذن أتريّث بشأن التشخيص وأطلب رأيًا ثانيًا.
      mk: Тогаш ќе почекам со дијагнозата и ќе побарам второ мислење.
