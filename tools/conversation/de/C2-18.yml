- type: narrator
  text:
    en: Before any operation the surgeon must explain it, its risks and alternatives in a consent talk, and you sign only afterwards. For certain planned operations public insurance gives a legal right
      to a second opinion, and many insurers pay for one anyway. You may also ask for copies of all your findings.
    ar: قبل أي عملية يجب أن يشرحها الجرّاح ومخاطرها وبدائلها في حديث إفصاح، ولا توقّع إلا بعد ذلك. وفي عمليات مخطّط لها معيّنة يمنح التأمين العام حقًا قانونيًا في رأي ثانٍ، وكثير من شركات التأمين تدفعه
      على أي حال. ويحق لك أيضًا طلب نسخ من كل تقاريرك.
    mk: Пред секоја операција хирургот мора да ја објасни, ризиците и алтернативите во разговор за согласност, а вие потпишувате дури потоа. За одредени планирани операции јавното осигурување дава законско
      право на второ мислење, а многу каси го плаќаат и онака. Можете да побарате и копии од сите наоди.
