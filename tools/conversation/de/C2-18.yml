- type: narrator
  text:
    en: 'Medical register is precise and nominal: «der Befund», «die Diagnose», «der Eingriff», «konservativ behandeln», «die Erfolgsaussichten». Asking exactly in the same words gets exact answers.'
    ar: 'الأسلوب الطبي دقيق واسمي: «der Befund»، «die Diagnose»، «der Eingriff»، «konservativ behandeln»، «die Erfolgsaussichten». والسؤال بالكلمات نفسها يجلب أجوبة دقيقة.'
    mk: 'Медицинскиот регистар е прецизен и номинален: «der Befund», «die Diagnose», «der Eingriff», «konservativ behandeln», «die Erfolgsaussichten». Прашувањето со истите зборови носи точни одговори.'
