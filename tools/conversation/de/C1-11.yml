steps:
- type: narrator
  text:
    en: A company you've never dealt with keeps calling you. Where did they get your number? Jonas helps you use your GDPR rights. Listen to the conversation; you don't need to understand it yet.
    ar: شركة لم تتعاملي معها قط تتصل بكِ باستمرار. من أين حصلت على رقمكِ؟ يوناس يساعدكِ على استعمال حقوقكِ في حماية البيانات. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Фирма со која никогаш не сте имале работа постојано ви се јавува. Од каде го има бројот? Јонас ви помага да ги искористите правата од GDPR. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Schon wieder diese Firma! Ich habe nie eine Einwilligung gegeben.
    meaning:
      en: That company again! I never gave consent.
      ar: هذه الشركة مجددًا! لم أعطِ موافقتي قط.
      mk: Пак таа фирма! Никогаш не сум дала согласност.
  - speaker: jonas
    text: Dann schick ihnen eine Auskunft nach DSGVO. Sie müssen sagen, woher sie deine Daten haben.
    meaning:
      en: Then send them a GDPR access request. They have to say where they got your data.
      ar: إذن أرسلي لهم طلب اطلاع وفق اللائحة. يجب أن يقولوا من أين حصلوا على بياناتكِ.
      mk: Тогаш прати им барање за пристап според GDPR. Мора да кажат од каде ги имаат податоците.
  - speaker: protagonist
    text: Und dann?
    meaning:
      en: And then?
      ar: ثم ماذا؟
      mk: А потоа?
  - speaker: jonas
    text: Dann verlangst du die Löschung. Ohne Einwilligung müssen die Daten gelöscht werden.
    meaning:
      en: Then you demand deletion. Without consent the data must be deleted.
      ar: ثم تطلبين الحذف. بلا موافقة يجب أن تُحذف البيانات.
      mk: Потоа бараш бришење. Без согласност податоците мора да се избришат.
  - speaker: protagonist
    text: Und sie dürfen sie nicht weitergeben?
    meaning:
      en: And they're not allowed to pass them on?
      ar: ولا يجوز لهم تمريرها؟
      mk: И не смеат да ги пренесат?
  - speaker: jonas
    text: 'Nein. Deine Nummer darf nicht ohne Erlaubnis weitergegeben werden. Wenn sie nicht antworten: Datenschutzbehörde.'
    meaning:
      en: 'No. Your number may not be passed on without permission. If they don''t answer: the data protection authority.'
      ar: 'لا. لا يجوز تمرير رقمكِ دون إذن. وإن لم يردّوا: هيئة حماية البيانات.'
      mk: 'Не. Твојот број не смее да се пренесе без дозвола. Ако не одговорат: агенцијата за заштита на податоци.'
  - speaker: protagonist
    text: 'Komisch: Im Verein durfte Petra kein Mannschaftsfoto aufhängen — „wegen Datenschutz“.'
    meaning:
      en: 'Funny: at the club Petra wasn''t allowed to put up a team photo — ''because of data protection''.'
      ar: 'غريب: في النادي لم يُسمح لبيترا بتعليق صورة الفريق — «بسبب حماية البيانات».'
      mk: 'Чудно: во клубот Петра не смееше да закачи слика од екипата — „поради заштита на податоци“.'
  - speaker: jonas
    text: Ha! Die DSGVO ist die Lieblingsausrede der Deutschen. Mit Einwilligung wäre das Foto kein Problem.
    meaning:
      en: Ha! The GDPR is the Germans' favourite excuse. With consent the photo would be no problem.
      ar: ها! اللائحة هي الذريعة المفضّلة لدى الألمان. مع الموافقة لن تكون الصورة مشكلة.
      mk: Ха! GDPR е омилениот изговор на Германците. Со согласност сликата не би била проблем.
- type: prompt
  ask:
    en: 'Say: I never gave consent.'
    ar: 'قولي: لم أعطِ موافقتي قط.'
    mk: 'Кажете: никогаш не сум дала согласност.'
  answer:
    speaker: protagonist
    text: Ich habe nie eine Einwilligung gegeben.
  items:
  - die-einwilligung
- type: prompt
  ask:
    en: 'Say: a GDPR access request.'
    ar: 'قولي: طلب اطلاع وفق اللائحة.'
    mk: 'Кажете: барање за пристап според GDPR.'
  answer:
    speaker: protagonist
    text: Eine Auskunft nach DSGVO.
  items:
  - die-auskunft
  - die-dsgvo
- type: prompt
  ask:
    en: 'Say: I demand deletion.'
    ar: 'قولي: أطلب الحذف.'
    mk: 'Кажете: барам бришење.'
  answer:
    speaker: protagonist
    text: Ich verlange die Löschung.
  items:
  - die-loeschung
- type: narrator
  text:
    en: 'Passive with modals states rules: «Die Daten müssen gelöscht werden» (must be deleted), «Die Nummer darf nicht weitergegeben werden» (may not be passed on). The modal is conjugated, «werden» goes
      last.'
    ar: 'المبني للمجهول مع الأفعال المساعدة يصوغ القواعد: «Die Daten müssen gelöscht werden» (يجب أن تُحذف)، «Die Nummer darf nicht weitergegeben werden» (لا يجوز تمريره). الفعل المساعد مُصرَّف و«werden»
      في الآخر.'
    mk: 'Пасивот со модални глаголи изразува правила: «Die Daten müssen gelöscht werden» (мора да се избришат), «Die Nummer darf nicht weitergegeben werden» (не смее да се пренесе). Модалниот се менува,
      «werden» оди последно.'
- type: prompt
  ask:
    en: 'Say: the data must be deleted.'
    ar: 'قولي: يجب أن تُحذف البيانات.'
    mk: 'Кажете: податоците мора да се избришат.'
  answer:
    speaker: protagonist
    text: Die Daten müssen gelöscht werden.
  items:
  - muss-geloescht-werden
- type: prompt
  ask:
    en: 'Say: the number may not be passed on.'
    ar: 'قولي: لا يجوز تمرير الرقم.'
    mk: 'Кажете: бројот не смее да се пренесе.'
  answer:
    speaker: protagonist
    text: Die Nummer darf nicht weitergegeben werden.
  items:
  - darf-nicht-weitergegeben-werden
- type: prompt
  ask:
    en: 'Say: the data protection authority.'
    ar: 'قولي: هيئة حماية البيانات.'
    mk: 'Кажете: агенцијата за заштита на податоци.'
  answer:
    speaker: protagonist
    text: Die Datenschutzbehörde.
  items:
  - die-datenschutzbehoerde
- type: prompt
  ask:
    en: 'Say: data protection.'
    ar: 'قولي: حماية البيانات.'
    mk: 'Кажете: заштита на податоци.'
  answer:
    speaker: protagonist
    text: Der Datenschutz.
  items:
  - der-datenschutz
- type: prompt
  ask:
    en: 'Say: I withdraw my consent.'
    ar: 'قولي: أسحب موافقتي.'
    mk: 'Кажете: ја повлекувам согласноста.'
  answer:
    speaker: protagonist
    text: Ich widerrufe meine Einwilligung.
  items:
  - widerrufen
- type: prompt
  ask:
    en: 'Say: the favourite excuse.'
    ar: 'قولي: الذريعة المفضّلة.'
    mk: 'Кажете: омилениот изговор.'
  answer:
    speaker: protagonist
    text: Die Lieblingsausrede.
  items:
  - die-ausrede
- type: narrator
  text:
    en: Under the GDPR you can ask any company what data it holds on you and where it came from (they must answer within a month), demand deletion and withdraw consent at any time; complaints go to the
      state data protection authority. At the same time 'Datenschutz' is a famous excuse for saying no to anything — often a simple consent form would solve it.
    ar: بموجب اللائحة يمكنكِ أن تسألي أي شركة عن البيانات التي تحتفظ بها عنكِ ومصدرها (يجب أن تجيب خلال شهر)، وأن تطلبي الحذف وتسحبي الموافقة في أي وقت؛ والشكاوى إلى هيئة حماية البيانات في الولاية. وفي
      الوقت نفسه «حماية البيانات» ذريعة شهيرة لرفض أي شيء — وغالبًا تحلّ استمارة موافقة بسيطة المسألة.
    mk: Според GDPR можете да прашате секоја фирма кои ваши податоци ги чува и од каде (мора да одговори за еден месец), да барате бришење и да ја повлечете согласноста во секое време; жалбите одат до покраинската
      агенција. Во исто време „Datenschutz“ е познат изговор за одбивање на сè — често едноставен формулар за согласност би го решил тоа.
