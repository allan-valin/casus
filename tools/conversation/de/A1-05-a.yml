steps:
- type: narrator
  text:
    ar: حرارة يارا مرتفعة منذ الليل. عيادة طبيبة الأطفال، ومعكِ الدفتر الأصفر. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
- type: dialogue
  lines:
  - speaker: wagner
    text: Guten Morgen. Was fehlt Yara?
    meaning:
      ar: صباح الخير. ما بها يارا؟
  - speaker: protagonist
    text: Yara hat Fieber. Seit heute Nacht.
    meaning:
      ar: يارا عندها حرارة. منذ الليلة الماضية.
  - speaker: wagner
    text: Haben Sie die Versichertenkarte und das U-Heft?
    meaning:
      ar: هل معكِ بطاقة التأمين والدفتر الأصفر؟
  - speaker: protagonist
    text: Ja, hier ist die Karte. Und das U-Heft.
    meaning:
      ar: نعم، هذه البطاقة. وهذا الدفتر.
  - speaker: wagner
    text: Danke. Hustet Yara auch?
    meaning:
      ar: شكرًا. هل تسعل يارا أيضًا؟
  - speaker: protagonist
    text: Ja, ein bisschen.
    meaning:
      ar: نعم، قليلًا.
  - speaker: wagner
    text: Das ist eine Erkältung. Ich gebe Ihnen einen Saft. Dreimal am Tag.
    meaning:
      ar: هذه نزلة برد. سأعطيكِ شرابًا. ثلاث مرات في اليوم.
  - speaker: protagonist
    text: Vielen Dank, Frau Doktor.
    meaning:
      ar: شكرًا جزيلًا يا حضرة الطبيبة.
  - speaker: wagner
    text: Gute Besserung, Yara!
    meaning:
      ar: شفاءً عاجلًا يا يارا!
