- type: narrator
  text:
    en: 'Civil courage without putting yourself in danger: address the attacker loudly with ''Sie'', speak to specific bystanders (''You in the blue jacket, help me''), call 110, look after the victim afterwards,
      and be a witness. Never get physical. Demonstrations are registered and protected by the police.'
    ar: 'الشجاعة المدنية دون تعريض نفسكِ للخطر: خاطبي المعتدي بصوت عالٍ بصيغة «Sie»، وكلّمي أشخاصًا محدّدين من الحاضرين («أنت ذو السترة الزرقاء، ساعدني»)، واتصلي بـ110، واعتني بالضحية بعدها، وكوني شاهدة.
      لا تلجئي أبدًا إلى القوة. والمظاهرات مسجّلة وتحميها الشرطة.'
    mk: 'Граѓанска храброст без да се доведете во опасност: гласно обратете му се на напаѓачот со „Sie“, обратете се на конкретни минувачи („Вие со сината јакна, помогнете ми“), јавете се на 110, погрижете
      се за жртвата потоа и бидете сведок. Никогаш физички. Демонстрациите се пријавени и заштитени од полицијата.'
