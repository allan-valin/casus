steps:
- type: narrator
  text:
    en: After an attack on a mosque, thousands march through Leipzig. You go with Lena — and on the tram home, you need civil courage. Listen to the conversation; you don't need to understand it yet.
    ar: بعد اعتداء على مسجد، يسير الآلاف في لايبزيغ. تذهبين مع لينا — وفي الترام إلى البيت تحتاجين إلى شجاعة مدنية. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: По напад врз џамија, илјадници маршираат низ Лајпциг. Одите со Лена — а во трамвајот на враќање ви треба граѓанска храброст. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: lena
    text: Schau mal, wie viele! Die Kundgebung ist ja riesig.
    meaning:
      en: Look how many! The rally is huge.
      ar: انظري كم هم! التجمّع ضخم.
      mk: Види колку се! Собирот е огромен.
  - speaker: protagonist
    text: 'Auf meinem Schild steht: „Leipzig hält zusammen“.'
    meaning:
      en: 'My sign says: ''Leipzig stands together''.'
      ar: 'على لافتتي: «لايبزيغ متماسكة».'
      mk: 'На мојата табла пишува: „Лајпциг е заедно“.'
  - speaker: lena
    text: Schön. Solidarität zeigen ist eigentlich das Wichtigste.
    meaning:
      en: Nice. Showing solidarity is actually the most important thing.
      ar: جميل. إظهار التضامن هو في الحقيقة أهم شيء.
      mk: Убаво. Да се покаже солидарност е всушност најважно.
  - speaker: protagonist
    text: '... Lena, schau. Der Mann in der Bahn beleidigt die Frau mit Kopftuch.'
    meaning:
      en: '... Lena, look. The man on the tram is insulting the woman in the headscarf.'
      ar: '... لينا، انظري. الرجل في الترام يشتم المرأة المحجّبة.'
      mk: '... Лена, види. Човекот во трамвајот ја навредува жената со марама.'
  - speaker: lena
    text: Halt mal. Nicht allein eingreifen — sprich ihn laut an und hol andere dazu.
    meaning:
      en: Hold on. Don't intervene alone — address him loudly and get others to join.
      ar: لحظة. لا تتدخّلي وحدكِ — خاطبيه بصوت عالٍ وأشركي آخرين.
      mk: Чекај малку. Не интервенирај сама — гласно обрати му се и повикај други.
  - speaker: protagonist
    text: Hören Sie auf! Lassen Sie die Frau in Ruhe! ... Können Sie mir bitte helfen?
    meaning:
      en: Stop it! Leave the woman alone! ... Can you help me, please?
      ar: توقّف! دع المرأة وشأنها! ... هل يمكنكم مساعدتي من فضلكم؟
      mk: Престанете! Оставете ја жената на мира! ... Можете ли да ми помогнете?
  - speaker: lena
    text: Gut gemacht. Jetzt steigt er aus. Frag sie bloß, ob alles okay ist.
    meaning:
      en: Well done. Now he's getting off. Just ask her if she's OK.
      ar: أحسنتِ. الآن ينزل. اسأليها فقط إن كانت بخير.
      mk: Браво. Сега слегува. Само прашај ја дали е добро.
  - speaker: protagonist
    text: Das war Zivilcourage, oder? Mein Herz klopft.
    meaning:
      en: That was civil courage, wasn't it? My heart's pounding.
      ar: كانت هذه شجاعة مدنية، أليس كذلك؟ قلبي يخفق بشدة.
      mk: Тоа беше граѓанска храброст, нели? Срцето ми чука.
- type: prompt
  ask:
    en: 'Say: the rally is huge.'
    ar: 'قولي: التجمّع ضخم.'
    mk: 'Кажете: собирот е огромен.'
  answer:
    speaker: protagonist
    text: Die Kundgebung ist riesig.
  items:
  - die-kundgebung
- type: prompt
  ask:
    en: 'Say: my sign says…'
    ar: 'قولي: على لافتتي…'
    mk: 'Кажете: на мојата табла пишува…'
  answer:
    speaker: protagonist
    text: Auf meinem Schild steht…
  items:
