- type: narrator
  text:
    en: 'More particles: «eigentlich» (actually — softens or shifts the topic), «halt mal» (hold on), «bloß» in requests (just — urgent: «Frag sie bloß…»). «ja» shows surprise: «Die Kundgebung ist ja riesig!»'
    ar: 'أدوات أخرى: «eigentlich» (في الحقيقة — تلطّف أو تغيّر الموضوع)، «halt mal» (لحظة)، «bloß» في الطلبات (فقط — بإلحاح: «Frag sie bloß…»). و«ja» تُظهر المفاجأة: «Die Kundgebung ist ja riesig!»'
    mk: 'Уште честички: «eigentlich» (всушност — омекнува или ја менува темата), «halt mal» (чекај малку), «bloß» во барања (само — итно: «Frag sie bloß…»). «ja» покажува изненадување: «Die Kundgebung ist
      ja riesig!»'
- type: prompt
  ask:
