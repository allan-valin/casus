- type: narrator
  text:
    en: «Mir ist heiß» means 'I feel hot'; «Ich bin heiß» means 'I'm sexy' — a classic learner's mistake, like «Ich bin kalt» (I'm a cold person) for «Mir ist kalt». Telling your own mistakes is the fastest
      way to win an audience.
    ar: «Mir ist heiß» تعني «أشعر بالحر»؛ و«Ich bin heiß» تعني «أنا مثير» — خطأ كلاسيكي للمتعلّمين، مثل «Ich bin kalt» (أنا شخص بارد) بدلًا من «Mir ist kalt». ورواية أخطائك هي أسرع طريق لكسب الجمهور.
    mk: «Mir ist heiß» значи „ми е жешко“; «Ich bin heiß» значи „јас сум секси“ — класична грешка на учениците, како «Ich bin kalt» (јас сум ладна личност) наместо «Mir ist kalt». Раскажувањето на сопствените
      грешки е најбрзиот начин да ја освоите публиката.
