steps:
- type: narrator
  text:
    en: 'Professor Hartmann has asked you to give a talk at the VHS: ''How I learned German''. Twenty minutes, forty listeners. Listen to the conversation; you don''t need to understand it yet.'
    ar: 'طلب منك البروفيسور هارتمان أن تلقي محاضرة في الجامعة الشعبية: «كيف تعلّمتُ الألمانية». عشرون دقيقة، أربعون مستمعًا. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.'
    mk: 'Професорот Хартман ве замоли да одржите предавање на народниот универзитет: „Како научив германски“. Дваесет минути, четириесет слушатели. Слушнете го разговорот; уште не мора да го разберете.'
- type: dialogue
  lines:
  - speaker: protagonist
    text: 'Guten Abend. Mein Thema: wie ich Deutsch gelernt habe — mit allen von mir gemachten Fehlern.'
    meaning:
      en: 'Good evening. My topic: how I learned German — with all the mistakes I made.'
      ar: 'مساء الخير. موضوعي: كيف تعلّمتُ الألمانية — بكل الأخطاء التي ارتكبتُها.'
      mk: 'Добровечер. Мојата тема: како научив германски — со сите грешки што ги направив.'
  - speaker: protagonist
    text: 'Das am Anfang Gelernte war einfach: „Danke“, „Entschuldigung“, „Ich verstehe nicht“.'
    meaning:
      en: 'What I learned at the start was simple: ''Thank you'', ''Sorry'', ''I don''t understand''.'
      ar: 'ما تعلّمته في البداية كان بسيطًا: «شكرًا»، «عذرًا»، «لا أفهم».'
      mk: 'Наученото на почетокот беше едноставно: „Благодарам“, „Извинете“, „Не разбирам“.'
  - speaker: protagonist
    text: 'Mein peinlichster Fehler: Ich sagte zu meiner Vermieterin „Ich bin heiß“ statt „Mir ist heiß“.'
    meaning:
      en: 'My most embarrassing mistake: I said to my landlady ''I''m hot'' (sexy) instead of ''I feel hot''.'
      ar: 'أكثر أخطائي إحراجًا: قلتُ لمؤجِّرتي «أنا مثير» بدلًا من «أشعر بالحر».'
      mk: 'Мојата најнепријатна грешка: ѝ реков на станодавката „Јас сум жешка личност“ наместо „Ми е жешко“.'
  - speaker: hartmann
    text: (Lachen im Publikum)
    meaning:
      en: (Laughter in the audience)
      ar: (ضحك في الجمهور)
      mk: (Смеа во публиката)
  - speaker: protagonist
    text: 'Die wichtigste Erkenntnis: Fehler sind kein Problem. Schweigen schon.'
    meaning:
      en: 'The most important insight: mistakes aren''t a problem. Silence is.'
      ar: 'أهم استنتاج: الأخطاء ليست مشكلة. الصمت هو المشكلة.'
      mk: 'Најважниот увид: грешките не се проблем. Молчењето е.'
  - speaker: protagonist
    text: 'Zum Abschluss: Sprechen Sie mit allen — mit Nachbarn, im Verein, an der Kasse. Vielen Dank!'
    meaning:
      en: 'To conclude: talk to everyone — neighbours, at the club, at the checkout. Thank you very much!'
      ar: 'في الختام: تحدّثوا مع الجميع — مع الجيران، في النادي، عند الصندوق. شكرًا جزيلًا!'
      mk: 'За крај: зборувајте со сите — со соседите, во клубот, на каса. Ви благодарам!'
  - speaker: hartmann
    text: Sehr anschaulich! Jetzt die Fragerunde. Hatten Sie Lampenfieber?
    meaning:
      en: Very vivid! Now the question round. Did you have stage fright?
      ar: واضح جدًا بالأمثلة! والآن جولة الأسئلة. هل شعرت برهبة المسرح؟
      mk: Многу сликовито! Сега кругот прашања. Дали имавте трема?
  - speaker: protagonist
    text: Furchtbar! Aber auf Deutsch habe ich es geschafft.
    meaning:
      en: Terribly! But I managed it in German.
      ar: بشدة! لكنني نجحتُ بالألمانية.
      mk: Страшна! Но успеав на германски.
- type: prompt
  ask:
    en: 'Say: the talk.'
    ar: 'قل: المحاضرة.'
    mk: 'Кажете: предавањето.'
  answer:
    speaker: protagonist
    text: Der Vortrag.
  items:
  - der-vortrag
- type: narrator
  text:
    en: 'Extended attributes in a talk: «die von mir gemachten Fehler» (= the mistakes that I made), «das am Anfang Gelernte» (= what was learned at the beginning — a participle used as a noun).'
    ar: 'الصفات الممتدة في محاضرة: «die von mir gemachten Fehler» (= الأخطاء التي ارتكبتُها)، «das am Anfang Gelernte» (= ما تعلّمته في البداية — اسم مفعول مستعمل اسمًا).'
    mk: 'Проширени атрибути во предавање: «die von mir gemachten Fehler» (= грешките што ги направив), «das am Anfang Gelernte» (= наученото на почетокот — партицип употребен како именка).'
