id: B1-23
protagonist: f
title: ["Politics", "السياسة", "Политика"]
situation:
  - "Election posters everywhere. Lena explains who may vote — and tells you, carefully, where to be careful."
  - "ملصقات الانتخابات في كل مكان. لينا تشرح من يحق له التصويت — وتخبركِ بحذر أين يجب أن تكوني حذرة."
  - "Изборни плакати насекаде. Лена објаснува кој смее да гласа — и внимателно ви кажува каде треба да внимавате."
learn: [b1-konjunktiv-ii]
culture: Politics, with care
items:
  - [waehlen, "wählen", "vote, elect", "يصوّت، ينتخب", "гласа, избира"]
  - [die-partei, "die Partei", "the party", "الحزب", "партијата"]
  - [die-wahl, "die Wahl", "the election", "الانتخابات", "изборите"]
  - [das-wahlrecht, "das Wahlrecht", "the right to vote", "حق التصويت", "правото на глас"]
  - [die-kommunalwahl, "die Kommunalwahl", "the local election", "الانتخابات المحلية", "локалните избори", {rare: true}]
  - [rechtsextrem, "rechtsextrem", "far-right", "يميني متطرف", "екстремно десно"]
  - [wuerde-ich-waehlen, "ich würde … wählen", "I would vote …", "كنتُ سأصوّت لـ…", "би гласала за …"]
  - [die-opferberatung, "die Opferberatung", "victim counselling", "استشارة الضحايا", "советувалиштето за жртви", {rare: true}]
  - [vorsichtig, "vorsichtig", "careful", "حذِر", "внимателно"]
  - [die-gegend, "die Gegend", "the area", "المنطقة", "крајот"]
dialogue:
  - [protagonist, "Darf ich bei der Wahl wählen?", "May I vote in the election?", "هل يحق لي التصويت في الانتخابات؟", "Смеам ли да гласам на изборите?"]
  - [lena, "Bei der Bundestagswahl nur mit deutschem Pass. EU-Bürger dürfen bei der Kommunalwahl wählen.", "In the federal election only with a German passport. EU citizens may vote in local elections.", "في الانتخابات الاتحادية فقط بجواز ألماني. ومواطنو الاتحاد الأوروبي يحق لهم التصويت في الانتخابات المحلية.", "На сојузните избори само со германски пасош. Граѓаните на ЕУ смеат да гласаат на локалните избори."]
  - [protagonist, "Und wen würdest du wählen?", "And who would you vote for?", "ولمن كنتِ ستصوّتين؟", "А за кого би гласала ти?"]
  - [lena, "Das sagt man hier nicht so gern! Die Wahl ist geheim.", "People here don't like saying that! The vote is secret.", "هنا لا يحب الناس قول ذلك! التصويت سرّي.", "Тоа тука не се кажува радо! Гласањето е тајно."]
  - [protagonist, "Und die Partei auf dem blauen Plakat?", "And the party on the blue poster?", "والحزب على الملصق الأزرق؟", "А партијата на синиот плакат?"]
  - [lena, "Die AfD. Teile davon gelten als rechtsextrem. In manchen Gegenden gibt es Angriffe auf Migranten.", "The AfD. Parts of it are classed as far-right extremist. In some areas there are attacks on migrants.", "حزب البديل من أجل ألمانيا. أجزاء منه تُصنَّف يمينية متطرفة. في بعض المناطق تقع اعتداءات على المهاجرين.", "АфД. Делови од неа важат за екстремно десни. Во некои краишта има напади врз мигранти."]
  - [protagonist, "Was würdest du an meiner Stelle machen?", "What would you do in my place?", "ماذا كنتِ ستفعلين لو كنتِ مكاني؟", "Што би направила ти на мое место?"]
  - [lena, "Sei vorsichtig, aber hab keine Angst. Und wenn etwas passiert: die Opferberatung hilft.", "Be careful, but don't be afraid. And if something happens: victim counselling helps.", "كوني حذرة لكن لا تخافي. وإذا حدث شيء: استشارة الضحايا تساعد.", "Внимавај, но немај страв. И ако се случи нешто: советувалиштето за жртви помага."]
  - [protagonist, "Danke. Und am Samstag gehe ich zur Demonstration gegen Rassismus.", "Thanks. And on Saturday I'm going to the demonstration against racism.", "شكرًا. ويوم السبت سأذهب إلى المظاهرة ضد العنصرية.", "Благодарам. А во сабота одам на демонстрацијата против расизам."]
teach:
  - ask: ["Ask: may I vote in the election?", "اسألي: هل يحق لي التصويت في الانتخابات؟", "Прашајте: смеам ли да гласам на изборите?", "Darf ich bei der Wahl wählen?", waehlen, die-wahl]
  - ask: ["Say: the right to vote.", "قولي: حق التصويت.", "Кажете: правото на глас.", "Das Wahlrecht.", das-wahlrecht]
  - ask: ["Say: the local election.", "قولي: الانتخابات المحلية.", "Кажете: локалните избори.", "Die Kommunalwahl.", die-kommunalwahl]
  - ask: ["Ask: who would you vote for?", "اسألي: لمن كنتِ ستصوّتين؟", "Прашајте: за кого би гласала?", "Wen würdest du wählen?", wuerde-ich-waehlen]
  - ask: ["Say: the party.", "قولي: الحزب.", "Кажете: партијата.", "Die Partei.", die-partei]
  - ask: ["Say: far-right.", "قولي: يميني متطرف.", "Кажете: екстремно десно.", "Rechtsextrem.", rechtsextrem]
  - ask: ["Say: in some areas.", "قولي: في بعض المناطق.", "Кажете: во некои краишта.", "In manchen Gegenden.", die-gegend]
  - ask: ["Ask: what would you do in my place?", "اسألي: ماذا كنتِ ستفعلين مكاني؟", "Прашајте: што би направила на мое место?", "Was würdest du an meiner Stelle machen?", wuerde]
  - ask: ["She says: be careful, but don't be afraid.", "تقول: كوني حذرة لكن لا تخافي.", "Таа вели: внимавај, но немај страв.", "Sei vorsichtig, aber hab keine Angst.", vorsichtig]
  - ask: ["Say: victim counselling.", "قولي: استشارة الضحايا.", "Кажете: советувалиште за жртви.", "Die Opferberatung.", die-opferberatung]
  - ask: ["Say: the demonstration against racism.", "قولي: المظاهرة ضد العنصرية.", "Кажете: демонстрацијата против расизам.", "Die Demonstration gegen Rassismus.", die-demonstration]
  - note: ["Who you vote for is private; many people don't say. Only Germans vote in federal and state elections; EU citizens also vote locally and in European elections. The AfD is the strongest far-right party, and parts of it are officially classed as right-wing extremist; right-wing violence is more frequent in some regions. If you are attacked or threatened, Opferberatung services help for free and in many languages.", "التصويت أمر شخصي؛ كثيرون لا يقولون لمن يصوّتون. الألمان وحدهم يصوّتون في الانتخابات الاتحادية وانتخابات الولايات؛ ومواطنو الاتحاد الأوروبي يصوّتون أيضًا محليًا وفي الانتخابات الأوروبية. حزب «AfD» أقوى أحزاب أقصى اليمين، وأجزاء منه مصنّفة رسميًا يمينية متطرفة؛ والعنف اليميني أكثر تواترًا في بعض المناطق. إذا تعرّضتِ لاعتداء أو تهديد، فخدمات استشارة الضحايا تساعد مجانًا وبلغات كثيرة.", "За кого гласате е приватно; многумина не кажуваат. Само Германците гласаат на сојузните и покраинските избори; граѓаните на ЕУ гласаат и локално и на европските избори. АфД е најсилната крајно десна партија, а делови од неа официјално се класифицирани како десничарски екстремни; десничарското насилство е почесто во некои региони. Ако ве нападнат или ви се закануваат, службите Opferberatung помагаат бесплатно и на многу јазици."]
