id: A2-04-m
tracks: [mk]
protagonist: m
title: ["Пензијата и осигурувањето"]
situation: ["Херр Волф прашува како пензионерите од Македонија живеат три месеци во Лајпциг."]
learn: [a2-weil]
culture: Pension and travel insurance
items:
  - [die-rente, "die Rente", "пензијата"]
  - [weil, "weil", "затоа што (глаголот на крај)"]
  - [die-reisekrankenversicherung, "die Reisekrankenversicherung", "патното здравствено осигурување", {rare: true}]
  - [wir-wohnen-bei, "wir wohnen bei …", "живееме кај …"]
  - [keine-miete, "keine Miete", "без кирија"]
  - [teuer, "teuer", "скапо"]
  - [die-preise, "die Preise", "цените"]
  - [die-europaeische-karte, "die Europäische Krankenversicherungskarte", "европската здравствена картичка", {rare: true}]
  - [zur-sicherheit, "zur Sicherheit", "за секој случај"]
  - [wir-sparen, "wir sparen", "штедиме"]
dialogue:
  - [herrwolf, "Reicht Ihre Rente für Deutschland?", "Дали ви е доволна пензијата за Германија?"]
  - [protagonist, "Knapp. Weil die Preise hier hoch sind.", "Тесно. Затоа што цените тука се високи."]
  - [herrwolf, "Ja, alles ist teuer.", "Да, сè е скапо."]
  - [protagonist, "Aber wir wohnen bei Petar. Keine Miete.", "Но живееме кај Петар. Без кирија."]
  - [herrwolf, "Und wenn Sie krank werden?", "А ако се разболите?"]
  - [protagonist, "Wir haben eine Reisekrankenversicherung, zur Sicherheit.", "Имаме патно здравствено осигурување, за секој случај."]
  - [herrwolf, "Und die europäische Karte?", "А европската картичка?"]
  - [protagonist, "Mit dem bulgarischen Pass auch, ja. Wir sparen das ganze Jahr für die Reise.", "Со бугарскиот пасош и тоа, да. Штедиме цела година за патувањето."]
teach:
  - ask: ["Тој прашува: дали ви е доволна пензијата?", "Reicht Ihre Rente?", die-rente]
  - note: ["«weil» (затоа што) го праќа глаголот на крајот: «weil die Preise hier hoch sind»."]
  - ask: ["Кажете: затоа што цените се високи.", "Weil die Preise hoch sind.", weil, die-preise]
  - ask: ["Кажете: сè е скапо.", "Alles ist teuer.", teuer]
  - ask: ["Кажете: живееме кај Петар.", "Wir wohnen bei Petar.", wir-wohnen-bei]
  - ask: ["Кажете: без кирија.", "Keine Miete.", keine-miete]
  - ask: ["Кажете: имаме патно осигурување.", "Wir haben eine Reisekrankenversicherung.", die-reisekrankenversicherung]
  - ask: ["Кажете: за секој случај.", "Zur Sicherheit.", zur-sicherheit]
  - ask: ["Кажете: европската здравствена картичка.", "Die Europäische Krankenversicherungskarte.", die-europaeische-karte]
  - ask: ["Кажете: штедиме цела година.", "Wir sparen das ganze Jahr.", wir-sparen]
  - note: ["Што покрива вашето осигурување во Германија зависи од тоа каде сте осигурени и со кој пасош. Европската картичка покрива итни случаи; патното осигурување покрива повеќе. Проверете кај осигурителот пред патувањето."]
