id: B1-15
protagonist: f
title: ["Happiness", "السعادة", "Среќата"]
situation:
  - "A survey says Germans are fairly happy but complain a lot. You discuss it with Lena."
  - "استطلاع يقول إن الألمان سعداء إلى حدّ ما لكنهم يتذمرون كثيرًا. تناقشين ذلك مع لينا."
  - "Анкета вели дека Германците се прилично среќни, но многу се жалат. Разговарате со Лена."
learn: [de-pro_05]
culture: Complaining as a hobby
items:
  - [das-glueck, "das Glück", "happiness, luck", "السعادة، الحظ", "среќата"]
  - [zufrieden, "zufrieden", "content, satisfied", "راضٍ", "задоволен"]
  - [meckern, "meckern", "grumble, complain", "يتذمّر", "мрмори, се жали", {rare: true}]
  - [der-mensch-dem, "der Mensch, dem …", "the person to whom …", "الإنسان الذي … له", "човекот на кого …"]
  - [die-freunde-mit-denen, "die Freunde, mit denen …", "the friends with whom …", "الأصدقاء الذين … معهم", "пријателите со кои …"]
  - [das-wichtigste, "das Wichtigste", "the most important thing", "أهم شيء", "најважното"]
  - [gesundheit, "die Gesundheit", "health", "الصحة", "здравјето"]
  - [die-sicherheit, "die Sicherheit", "security, safety", "الأمان", "сигурноста"]
  - [eigentlich, "eigentlich", "actually", "في الواقع", "всушност"]
  - [das-wetter-meckern, "über das Wetter", "about the weather", "عن الطقس", "за времето"]
dialogue:
  - [lena, "Wir Deutschen sind eigentlich zufrieden. Aber wir meckern gern!", "We Germans are actually content. But we love to grumble!", "نحن الألمان راضون في الواقع. لكننا نحب التذمّر!", "Ние Германците сме всушност задоволни. Но сакаме да мрмориме!"]
  - [protagonist, "Worüber?", "About what?", "عن ماذا؟", "За што?"]
  - [lena, "Über das Wetter, die Bahn, die Politik...", "About the weather, the trains, politics...", "عن الطقس، والقطارات، والسياسة...", "За времето, возовите, политиката..."]
  - [protagonist, "Was ist für dich das Wichtigste zum Glück?", "What's the most important thing for happiness, for you?", "ما أهم شيء للسعادة بالنسبة لكِ؟", "Што е за тебе најважно за среќата?"]
  - [lena, "Die Freunde, mit denen ich lachen kann. Und Gesundheit.", "Friends I can laugh with. And health.", "الأصدقاء الذين أستطيع أن أضحك معهم. والصحة.", "Пријателите со кои можам да се смеам. И здравјето."]
  - [protagonist, "Für mich auch die Sicherheit. Ein Mensch, dem nichts fehlt, ist glücklich.", "For me safety too. A person who lacks nothing is happy.", "بالنسبة لي الأمان أيضًا. الإنسان الذي لا ينقصه شيء سعيد.", "За мене и сигурноста. Човекот на кој ништо не му недостига е среќен."]
  - [lena, "Schön gesagt. Und trotzdem meckern wir!", "Nicely put. And still we grumble!", "قلتِها جميلة. ومع ذلك نتذمّر!", "Убаво кажано. А сепак мрмориме!"]
  - [protagonist, "Das ist dann euer Hobby!", "Then that's your hobby!", "إذن هذه هوايتكم!", "Тогаш тоа е вашето хоби!"]
teach:
  - ask: ["Say: we're actually content.", "قولي: نحن راضون في الواقع.", "Кажете: всушност сме задоволни.", "Wir sind eigentlich zufrieden.", eigentlich, zufrieden]
  - ask: ["Say: we love to grumble!", "قولي: نحب التذمّر!", "Кажете: сакаме да мрмориме!", "Wir meckern gern!", meckern]
  - ask: ["Say: about the weather.", "قولي: عن الطقس.", "Кажете: за времето.", "Über das Wetter.", das-wetter-meckern]
  - ask: ["Ask: what's the most important thing for happiness?", "اسألي: ما أهم شيء للسعادة؟", "Прашајте: што е најважно за среќата?", "Was ist das Wichtigste zum Glück?", das-wichtigste, das-glueck]
  - note: ["Relative pronouns change with their role: «die Freunde, mit denen ich lache» (with whom), «ein Mensch, dem nichts fehlt» (to whom nothing is lacking).", "ضمائر الصلة تتغيّر حسب دورها: «die Freunde, mit denen ich lache» (الذين أضحك معهم)، «ein Mensch, dem nichts fehlt» (الذي لا ينقصه شيء).", "Релативните заменки се менуваат според улогата: «die Freunde, mit denen ich lache» (со кои), «ein Mensch, dem nichts fehlt» (на кого ништо не му недостига)."]
  - ask: ["Say: friends I can laugh with.", "قولي: الأصدقاء الذين أستطيع أن أضحك معهم.", "Кажете: пријателите со кои можам да се смеам.", "Die Freunde, mit denen ich lachen kann.", die-freunde-mit-denen]
  - ask: ["Say: and health.", "قولي: والصحة.", "Кажете: и здравјето.", "Und Gesundheit.", gesundheit]
  - ask: ["Say: for me safety too.", "قولي: بالنسبة لي الأمان أيضًا.", "Кажете: за мене и сигурноста.", "Für mich auch die Sicherheit.", die-sicherheit]
  - ask: ["Say: a person who lacks nothing is happy.", "قولي: الإنسان الذي لا ينقصه شيء سعيد.", "Кажете: човекот на кој ништо не му недостига е среќен.", "Ein Mensch, dem nichts fehlt, ist glücklich.", der-mensch-dem]
  - note: ["Grumbling ('meckern') about weather, trains and bureaucracy is a social ritual, not real unhappiness — join in lightly and you belong.", "التذمّر («meckern») من الطقس والقطارات والبيروقراطية طقس اجتماعي، لا تعاسة حقيقية — شاركي فيه بخفة وستصبحين واحدة منهم.", "Мрморењето („meckern“) за времето, возовите и бирократијата е општествен ритуал, не вистинска несреќа — придружете се лесно и ќе бидете дел од нив."]
