id: C1-15
protagonist: f
title: ["The demonstration", "المظاهرة", "Демонстрацијата"]
situation:
  - "After an attack on a mosque, thousands march through Leipzig. You go with Lena — and on the tram home, you need civil courage."
  - "بعد اعتداء على مسجد، يسير الآلاف في لايبزيغ. تذهبين مع لينا — وفي الترام إلى البيت تحتاجين إلى شجاعة مدنية."
  - "По напад врз џамија, илјадници маршираат низ Лајпциг. Одите со Лена — а во трамвајот на враќање ви треба граѓанска храброст."
learn: [c1-particles]
culture: Civil courage
items:
  - [die-kundgebung, "die Kundgebung", "the rally", "التجمّع", "собирот"]
  - [die-zivilcourage, "die Zivilcourage", "civil courage", "الشجاعة المدنية", "граѓанската храброст"]
  - [das-plakat-demo, "das Schild", "the placard, sign", "اللافتة", "таблата"]
  - [der-zusammenhalt, "der Zusammenhalt", "solidarity, cohesion", "التماسك", "заедништвото"]
  - [eingreifen, "eingreifen", "intervene", "يتدخّل", "интервенира"]
  - [laut-ansprechen, "laut ansprechen", "address loudly", "يخاطب بصوت عالٍ", "гласно се обраќа"]
  - [halt-mal, "halt mal", "(particle) just, hold on", "(أداة) لحظة، فقط", "(честичка) чекај малку"]
  - [eigentlich-c1, "eigentlich", "(particle) actually, by the way", "(أداة) في الحقيقة", "(честичка) всушност"]
  - [bloss, "bloß", "(particle) just, only — urgent", "(أداة) فقط — بإلحاح", "(честичка) само — итно"]
  - [die-solidaritaet, "die Solidarität", "solidarity", "التضامن", "солидарноста"]
dialogue:
  - [lena, "Schau mal, wie viele! Die Kundgebung ist ja riesig.", "Look how many! The rally is huge.", "انظري كم هم! التجمّع ضخم.", "Види колку се! Собирот е огромен."]
  - [protagonist, "Auf meinem Schild steht: „Leipzig hält zusammen“.", "My sign says: 'Leipzig stands together'.", "على لافتتي: «لايبزيغ متماسكة».", "На мојата табла пишува: „Лајпциг е заедно“."]
  - [lena, "Schön. Solidarität zeigen ist eigentlich das Wichtigste.", "Nice. Showing solidarity is actually the most important thing.", "جميل. إظهار التضامن هو في الحقيقة أهم شيء.", "Убаво. Да се покаже солидарност е всушност најважно."]
  - [protagonist, "... Lena, schau. Der Mann in der Bahn beleidigt die Frau mit Kopftuch.", "... Lena, look. The man on the tram is insulting the woman in the headscarf.", "... لينا، انظري. الرجل في الترام يشتم المرأة المحجّبة.", "... Лена, види. Човекот во трамвајот ја навредува жената со марама."]
  - [lena, "Halt mal. Nicht allein eingreifen — sprich ihn laut an und hol andere dazu.", "Hold on. Don't intervene alone — address him loudly and get others to join.", "لحظة. لا تتدخّلي وحدكِ — خاطبيه بصوت عالٍ وأشركي آخرين.", "Чекај малку. Не интервенирај сама — гласно обрати му се и повикај други."]
  - [protagonist, "Hören Sie auf! Lassen Sie die Frau in Ruhe! ... Können Sie mir bitte helfen?", "Stop it! Leave the woman alone! ... Can you help me, please?", "توقّف! دع المرأة وشأنها! ... هل يمكنكم مساعدتي من فضلكم؟", "Престанете! Оставете ја жената на мира! ... Можете ли да ми помогнете?"]
  - [lena, "Gut gemacht. Jetzt steigt er aus. Frag sie bloß, ob alles okay ist.", "Well done. Now he's getting off. Just ask her if she's OK.", "أحسنتِ. الآن ينزل. اسأليها فقط إن كانت بخير.", "Браво. Сега слегува. Само прашај ја дали е добро."]
  - [protagonist, "Das war Zivilcourage, oder? Mein Herz klopft.", "That was civil courage, wasn't it? My heart's pounding.", "كانت هذه شجاعة مدنية، أليس كذلك؟ قلبي يخفق بشدة.", "Тоа беше граѓанска храброст, нели? Срцето ми чука."]
teach:
  - ask: ["Say: the rally is huge.", "قولي: التجمّع ضخم.", "Кажете: собирот е огромен.", "Die Kundgebung ist riesig.", die-kundgebung]
  - ask: ["Say: my sign says…", "قولي: على لافتتي…", "Кажете: на мојата табла пишува…", "Auf meinem Schild steht…", das-plakat-demo]
  - ask: ["Say: Leipzig stands together.", "قولي: لايبزيغ متماسكة.", "Кажете: Лајпциг е заедно.", "Leipzig hält zusammen.", der-zusammenhalt]
  - note: ["More particles: «eigentlich» (actually — softens or shifts the topic), «halt mal» (hold on), «bloß» in requests (just — urgent: «Frag sie bloß…»). «ja» shows surprise: «Die Kundgebung ist ja riesig!»", "أدوات أخرى: «eigentlich» (في الحقيقة — تلطّف أو تغيّر الموضوع)، «halt mal» (لحظة)، «bloß» في الطلبات (فقط — بإلحاح: «Frag sie bloß…»). و«ja» تُظهر المفاجأة: «Die Kundgebung ist ja riesig!»", "Уште честички: «eigentlich» (всушност — омекнува или ја менува темата), «halt mal» (чекај малку), «bloß» во барања (само — итно: «Frag sie bloß…»). «ja» покажува изненадување: «Die Kundgebung ist ja riesig!»"]
  - ask: ["Say: showing solidarity is actually the most important thing.", "قولي: إظهار التضامن هو في الحقيقة أهم شيء.", "Кажете: солидарноста е всушност најважна.", "Solidarität zeigen ist eigentlich das Wichtigste.", eigentlich-c1, die-solidaritaet]
  - ask: ["She says: hold on.", "تقول: لحظة.", "Таа вели: чекај малку.", "Halt mal.", halt-mal]
  - ask: ["She says: don't intervene alone.", "تقول: لا تتدخّلي وحدكِ.", "Таа вели: не интервенирај сама.", "Nicht allein eingreifen.", eingreifen]
  - ask: ["She says: address him loudly.", "تقول: خاطبيه بصوت عالٍ.", "Таа вели: гласно обрати му се.", "Sprich ihn laut an.", laut-ansprechen]
  - ask: ["She says: just ask her if she's OK.", "تقول: اسأليها فقط إن كانت بخير.", "Таа вели: само прашај ја дали е добро.", "Frag sie bloß, ob alles okay ist.", bloss]
  - ask: ["Say: that was civil courage.", "قولي: كانت هذه شجاعة مدنية.", "Кажете: тоа беше граѓанска храброст.", "Das war Zivilcourage.", die-zivilcourage]
  - note: ["Civil courage without putting yourself in danger: address the attacker loudly with 'Sie', speak to specific bystanders ('You in the blue jacket, help me'), call 110, look after the victim afterwards, and be a witness. Never get physical. Demonstrations are registered and protected by the police.", "الشجاعة المدنية دون تعريض نفسكِ للخطر: خاطبي المعتدي بصوت عالٍ بصيغة «Sie»، وكلّمي أشخاصًا محدّدين من الحاضرين («أنت ذو السترة الزرقاء، ساعدني»)، واتصلي بـ110، واعتني بالضحية بعدها، وكوني شاهدة. لا تلجئي أبدًا إلى القوة. والمظاهرات مسجّلة وتحميها الشرطة.", "Граѓанска храброст без да се доведете во опасност: гласно обратете му се на напаѓачот со „Sie“, обратете се на конкретни минувачи („Вие со сината јакна, помогнете ми“), јавете се на 110, погрижете се за жртвата потоа и бидете сведок. Никогаш физички. Демонстрациите се пријавени и заштитени од полицијата."]
