id: C2-01
protagonist: f
title: ["The wedding toast", "كلمة الزفاف", "Здравицата на свадбата"]
situation:
  - "Paul is getting married. As his friend from the WG days, you give the toast — the whole hall listens."
  - "باول يتزوّج. بصفتكِ صديقته منذ أيام السكن المشترك تلقين كلمة الزفاف — والقاعة كلها تستمع."
  - "Паул се жени. Како негова пријателка од времето на заедничкиот стан, ја држите здравицата — целата сала слуша."
learn: [c2-rhetoric]
culture: A German wedding speech
items:
  - [der-trinkspruch, "der Trinkspruch", "the toast", "النخب", "здравицата"]
  - [liebe-gaeste, "Liebe Gäste", "Dear guests", "الضيوف الأعزاء", "Драги гости"]
  - [das-brautpaar-c2, "das glückliche Paar", "the happy couple", "الزوجان السعيدان", "среќната двојка"]
  - [wer-haette-gedacht, "Wer hätte gedacht, dass …?", "Who would have thought that …?", "من كان يظن أنّ …؟", "Кој би помислил дека …?"]
  - [die-anekdote, "die Anekdote", "the anecdote", "الطرفة", "анегдотата"]
  - [nicht-nur-sondern-auch, "nicht nur …, sondern auch …", "not only … but also …", "ليس فقط … بل أيضًا …", "не само … туку и …"]
  - [ich-darf, "Ich darf …", "May I … (formal)", "اسمحوا لي أن …", "Дозволете ми да …"]
  - [das-glas-erheben, "Erheben Sie mit mir das Glas", "Raise your glasses with me", "ارفعوا الكؤوس معي", "Кренете ги чашите со мене"]
  - [rhetorisch, "rhetorisch", "rhetorical", "بلاغي", "реторички"]
  - [die-liebe, "die Liebe", "love", "الحب", "љубовта"]
  - [die-treue, "die Treue", "faithfulness", "الوفاء", "верноста"]
dialogue:
  - [protagonist, "Liebe Gäste, liebes Brautpaar! Ich darf ein paar Worte sagen.", "Dear guests, dear bride and groom! Allow me to say a few words.", "الضيوف الأعزاء، العروسان العزيزان! اسمحوا لي أن أقول بضع كلمات.", "Драги гости, драги младенци! Дозволете ми да кажам неколку зборови."]
  - [protagonist, "Wer hätte gedacht, dass Paul — der Paul, der nie den Putzplan einhielt — heute heiratet?", "Who would have thought that Paul — the Paul who never kept to the cleaning rota — would get married today?", "من كان يظن أنّ باول — باول الذي لم يلتزم قط بجدول التنظيف — سيتزوّج اليوم؟", "Кој би помислил дека Паул — Паул што никогаш не го почитуваше распоредот за чистење — денес ќе се жени?"]
  - [paul, "(lacht) Das stimmt leider.", "(laughs) Sadly, that's true.", "(يضحك) هذا صحيح للأسف.", "(се смее) За жал, тоа е точно."]
  - [protagonist, "Eine Anekdote: Als ich neu war, erklärte er mir eine Stunde lang die deutsche Mülltrennung. Falsch.", "An anecdote: when I was new, he explained German recycling to me for an hour. Wrongly.", "طرفة: حين كنتُ جديدة شرح لي فرز القمامة الألماني ساعة كاملة. بشكل خاطئ.", "Анегдота: кога бев нова, ми ја објаснуваше германската селекција на отпад цел час. Погрешно."]
  - [protagonist, "Aber er ist nicht nur ein schlechter Mülltrenner, sondern auch der treueste Freund, den ich kenne.", "But he's not only a bad recycler, but also the most loyal friend I know.", "لكنه ليس فقط سيئًا في فرز القمامة، بل أيضًا أوفى صديق أعرفه.", "Но тој не е само лош во селекцијата, туку и најверниот пријател што го познавам."]
  - [protagonist, "Liebe, Treue, Humor — das wünsche ich euch. Und einen Putzplan.", "Love, faithfulness, humour — that's what I wish you. And a cleaning rota.", "الحب والوفاء والفكاهة — هذا ما أتمنّاه لكما. وجدول تنظيف.", "Љубов, верност, хумор — тоа ви посакувам. И распоред за чистење."]
  - [protagonist, "Erheben Sie mit mir das Glas: auf das glückliche Paar!", "Raise your glasses with me: to the happy couple!", "ارفعوا الكؤوس معي: نخب الزوجين السعيدين!", "Кренете ги чашите со мене: за среќната двојка!"]
  - [jonas, "Auf das Brautpaar! — Eine perfekte Rede.", "To the bride and groom! — A perfect speech.", "نخب العروسين! — كلمة مثالية.", "За младенците! — Совршен говор."]
teach:
  - ask: ["Open the speech.", "افتتحي الكلمة.", "Почнете го говорот.", "Liebe Gäste, liebes Brautpaar!", liebe-gaeste]
  - ask: ["Say formally: allow me to say a few words.", "قولي رسميًا: اسمحوا لي أن أقول بضع كلمات.", "Кажете формално: дозволете ми да кажам неколку зборови.", "Ich darf ein paar Worte sagen.", ich-darf]
  - note: ["Rhetorical devices: the rhetorical question («Wer hätte gedacht, dass…?»), the anecdote, the contrast «nicht nur…, sondern auch…», and the rule of three («Liebe, Treue, Humor»). End with a clear call: «Erheben Sie mit mir das Glas».", "أدوات بلاغية: السؤال البلاغي («Wer hätte gedacht, dass…?»)، والطرفة، والمقابلة «nicht nur…, sondern auch…»، وقاعدة الثلاثة («Liebe, Treue, Humor»). واختمي بدعوة واضحة: «Erheben Sie mit mir das Glas».", "Реторички средства: реторичко прашање («Wer hätte gedacht, dass…?»), анегдота, контраст «nicht nur…, sondern auch…» и правилото на тројката («Liebe, Treue, Humor»). Завршете со јасен повик: «Erheben Sie mit mir das Glas»."]
  - ask: ["Ask rhetorically: who would have thought…?", "اسألي بلاغيًا: من كان يظن…؟", "Прашајте реторички: кој би помислил…?", "Wer hätte gedacht, dass…?", wer-haette-gedacht, rhetorisch]
  - ask: ["Say: an anecdote.", "قولي: طرفة.", "Кажете: анегдота.", "Eine Anekdote.", die-anekdote]
  - ask: ["Say: not only…, but also the most loyal friend.", "قولي: ليس فقط…، بل أيضًا أوفى صديق.", "Кажете: не само…, туку и најверниот пријател.", "Nicht nur…, sondern auch der treueste Freund.", nicht-nur-sondern-auch]
  - ask: ["Say the three wishes.", "قولي الأمنيات الثلاث.", "Кажете ги трите желби.", "Liebe, Treue, Humor.", die-liebe, die-treue]
  - ask: ["Call the toast.", "ادعي إلى النخب.", "Повикајте на здравица.", "Erheben Sie mit mir das Glas!", das-glas-erheben]
  - ask: ["Say: to the happy couple!", "قولي: نخب الزوجين السعيدين!", "Кажете: за среќната двојка!", "Auf das glückliche Paar!", das-brautpaar-c2]
  - ask: ["Say: the toast.", "قولي: النخب.", "Кажете: здравицата.", "Der Trinkspruch.", der-trinkspruch]
  - note: ["Wedding speeches in Germany are short (three to five minutes), personal and funny, with one or two harmless anecdotes — nothing embarrassing about ex-partners — and end with a toast. Water or juice in your glass is perfectly fine.", "خطب الأعراس في ألمانيا قصيرة (ثلاث إلى خمس دقائق)، شخصية ومضحكة، مع طرفة أو اثنتين بريئتين — لا شيء محرج عن الشركاء السابقين — وتنتهي بنخب. والماء أو العصير في كأسكِ مقبول تمامًا.", "Свадбените говори во Германија се кратки (три до пет минути), лични и смешни, со една-две безопасни анегдоти — ништо непријатно за поранешни партнери — и завршуваат со здравица. Вода или сок во чашата е сосема во ред."]
