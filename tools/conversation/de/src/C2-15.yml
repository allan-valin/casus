id: C2-15
protagonist: f
title: ["Chairing the club", "رئاسة النادي", "Претседавање со клубот"]
situation:
  - "Petra is stepping down; you've been elected chair. Your first general meeting — by the book."
  - "بيترا تتنحّى؛ وانتُخبتِ رئيسة. أول جمعية عمومية لكِ — وفق الأصول."
  - "Петра се повлекува; вие сте избрана за претседателка. Вашето прво годишно собрание — по правилата."
learn: []
learn_missing: [formal-procedure]
culture: Running a meeting by the statutes
items:
  - [die-satzung, "die Satzung", "the statutes", "النظام الأساسي", "статутот"]
  - [der-antrag-c2, "der Antrag", "the motion", "الاقتراح، الطلب", "предлогот"]
  - [ich-eroeffne-die-sitzung, "Ich eröffne die Sitzung", "I declare the meeting open", "أفتتح الجلسة", "Ја отворам седницата"]
  - [die-beschlussfaehigkeit, "die Beschlussfähigkeit", "the quorum", "النصاب", "кворумот", {rare: true}]
  - [abstimmen-ueber, "über den Antrag abstimmen", "vote on the motion", "التصويت على الاقتراح", "гласање за предлогот"]
  - [angenommen, "angenommen", "carried, accepted", "مقبول، أُقرّ", "прифатен"]
  - [abgelehnt-c2, "abgelehnt", "rejected", "مرفوض", "одбиен"]
  - [das-wort-erteilen, "Ich erteile … das Wort", "I give the floor to …", "أعطي الكلمة لـ…", "Му давам збор на …"]
  - [der-vorsitz, "der Vorsitz", "the chair", "الرئاسة", "претседавањето"]
  - [die-sitzung-schliessen, "Ich schließe die Sitzung", "I declare the meeting closed", "أختتم الجلسة", "Ја затворам седницата"]
dialogue:
  - [protagonist, "Ich eröffne die Sitzung und stelle die Beschlussfähigkeit fest: zweiundvierzig Mitglieder sind anwesend.", "I declare the meeting open and note that we have a quorum: forty-two members are present.", "أفتتح الجلسة وأقرّ بتوفّر النصاب: اثنان وأربعون عضوًا حاضرون.", "Ја отворам седницата и го утврдувам кворумот: присутни се четириесет и два члена."]
  - [protagonist, "Tagesordnungspunkt drei: Antrag auf eine Frauen-Fußballmannschaft. Ich erteile Lena das Wort.", "Agenda item three: motion for a women's football team. I give the floor to Lena.", "البند الثالث: اقتراح تشكيل فريق كرة قدم نسائي. أعطي الكلمة للينا.", "Точка три: предлог за женска фудбалска екипа. Ѝ давам збор на Лена."]
  - [lena, "Zwanzig Frauen wollen spielen. Laut Satzung darf jedes Mitglied eine Abteilung beantragen.", "Twenty women want to play. Under the statutes any member may propose a section.", "عشرون امرأة يردن اللعب. بحسب النظام الأساسي يحق لكل عضو اقتراح قسم.", "Дваесет жени сакаат да играат. Според статутот секој член смее да предложи секција."]
  - [petra, "Und die Hallenzeit? Die Jugend braucht sie auch.", "And the hall time? The youth need it too.", "ووقت القاعة؟ الناشئون يحتاجونه أيضًا.", "А терминот во салата? И младите ни требаат."]
  - [protagonist, "Ein berechtigter Einwand. Die Stadt hat uns neue Zeiten zugesagt. Wir stimmen jetzt über den Antrag ab.", "A fair objection. The city has promised us new slots. We'll now vote on the motion.", "اعتراض وجيه. وعدتنا المدينة بأوقات جديدة. نصوّت الآن على الاقتراح.", "Оправдан приговор. Градот ни вети нови термини. Сега гласаме за предлогот."]
  - [protagonist, "Wer ist dafür? ... Dagegen? ... Enthaltungen? ... Der Antrag ist mit großer Mehrheit angenommen.", "Who's in favour? ... Against? ... Abstentions? ... The motion is carried by a large majority.", "من يؤيّد؟ ... من يعارض؟ ... من يمتنع؟ ... أُقرّ الاقتراح بأغلبية كبيرة.", "Кој е за? ... Против? ... Воздржани? ... Предлогот е прифатен со големо мнозинство."]
  - [lena, "Danke! Die Damenmannschaft lädt alle zum ersten Spiel ein.", "Thank you! The women's team invites everyone to the first match.", "شكرًا! الفريق النسائي يدعو الجميع إلى المباراة الأولى.", "Благодарам! Женската екипа ги кани сите на првиот натпревар."]
  - [protagonist, "Weitere Wortmeldungen? Keine. Ich schließe die Sitzung.", "Any more requests to speak? None. I declare the meeting closed.", "طلبات كلام أخرى؟ لا. أختتم الجلسة.", "Други јавувања за збор? Нема. Ја затворам седницата."]
teach:
  - ask: ["Open the meeting.", "افتتحي الجلسة.", "Отворете ја седницата.", "Ich eröffne die Sitzung.", ich-eroeffne-die-sitzung]
  - ask: ["Note the quorum.", "أقرّي بتوفّر النصاب.", "Утврдете го кворумот.", "Ich stelle die Beschlussfähigkeit fest.", die-beschlussfaehigkeit]
  - note: ["Formal procedure uses fixed phrases: «Ich eröffne die Sitzung», «Ich stelle die Beschlussfähigkeit fest», «Ich erteile … das Wort», «Wir stimmen über den Antrag ab», «Der Antrag ist angenommen / abgelehnt», «Ich schließe die Sitzung».", "الإجراءات الرسمية تستعمل عبارات ثابتة: «Ich eröffne die Sitzung»، «Ich stelle die Beschlussfähigkeit fest»، «Ich erteile … das Wort»، «Wir stimmen über den Antrag ab»، «Der Antrag ist angenommen / abgelehnt»، «Ich schließe die Sitzung».", "Формалната процедура користи фиксни фрази: «Ich eröffne die Sitzung», «Ich stelle die Beschlussfähigkeit fest», «Ich erteile … das Wort», «Wir stimmen über den Antrag ab», «Der Antrag ist angenommen / abgelehnt», «Ich schließe die Sitzung»."]
  - ask: ["Give Lena the floor.", "أعطي الكلمة للينا.", "Дајте ѝ збор на Лена.", "Ich erteile Lena das Wort.", das-wort-erteilen]
  - ask: ["Say: under the statutes.", "قولي: بحسب النظام الأساسي.", "Кажете: според статутот.", "Laut Satzung.", die-satzung]
  - ask: ["Say: we'll vote on the motion.", "قولي: نصوّت على الاقتراح.", "Кажете: гласаме за предлогот.", "Wir stimmen über den Antrag ab.", abstimmen-ueber, der-antrag-c2]
  - ask: ["Say: the motion is carried.", "قولي: أُقرّ الاقتراح.", "Кажете: предлогот е прифатен.", "Der Antrag ist angenommen.", angenommen]
  - ask: ["Say: the motion is rejected.", "قولي: رُفض الاقتراح.", "Кажете: предлогот е одбиен.", "Der Antrag ist abgelehnt.", abgelehnt-c2]
  - ask: ["Say: the chair.", "قولي: الرئاسة.", "Кажете: претседавањето.", "Der Vorsitz.", der-vorsitz]
  - ask: ["Close the meeting.", "اختتمي الجلسة.", "Затворете ја седницата.", "Ich schließe die Sitzung.", die-sitzung-schliessen]
  - note: ["Club meetings follow the statutes (Satzung): a quorum, an agenda sent in advance, motions, votes, minutes. Chairing well means being neutral, giving everyone the floor in turn and stating results clearly — the same skills as in a city council.", "اجتماعات الأندية تتبع النظام الأساسي (Satzung): نصاب، وجدول أعمال يُرسل مسبقًا، واقتراحات، وتصويت، ومحضر. والرئاسة الجيدة تعني الحياد وإعطاء الكلمة للجميع بالدور وإعلان النتائج بوضوح — المهارات نفسها في مجلس المدينة.", "Клупските собранија го следат статутот (Satzung): кворум, дневен ред испратен однапред, предлози, гласања, записник. Доброто претседавање значи неутралност, давање збор на сите по ред и јасно соопштување на резултатите — истите вештини како во градски совет."]
