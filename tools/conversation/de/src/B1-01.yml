id: B1-01
protagonist: f
title: ["Jonas's flat-share", "سكن يوناس المشترك", "Заедничкиот стан на Јонас"]
situation:
  - "Jonas moves into a WG, a shared flat, and shows you round. On the fridge: the cleaning rota."
  - "يوناس ينتقل إلى سكن مشترك ويريكِ المكان. على الثلاجة: جدول التنظيف."
  - "Јонас се сели во заеднички стан и ви го покажува. На фрижидерот: распоредот за чистење."
learn: [de-pro_05]
culture: The cleaning rota
items:
  - [die-wg, "die WG", "the flat-share", "السكن المشترك", "заедничкиот стан"]
  - [der-mitbewohner, "der Mitbewohner", "the flatmate", "شريك السكن", "цимерот"]
  - [der-putzplan, "der Putzplan", "the cleaning rota", "جدول التنظيف", "распоредот за чистење", {rare: true}]
  - [die-person-die, "die Person, die …", "the person who …", "الشخص الذي …", "лицето што …"]
  - [das-zimmer-das, "das Zimmer, das …", "the room that …", "الغرفة التي …", "собата што …"]
  - [die-gemeinschaftskueche, "die Gemeinschaftsküche", "the shared kitchen", "المطبخ المشترك", "заедничката кујна", {rare: true}]
  - [diese-woche, "diese Woche", "this week", "هذا الأسبوع", "оваа недела"]
  - [ist-dran, "ist dran", "it's (someone's) turn", "دور (فلان)", "е на ред"]
  - [das-bad-putzen, "das Bad putzen", "clean the bathroom", "ينظف الحمام", "чисти бањата"]
  - [streng, "streng", "strict", "صارم", "строго"]
  - [die-regel, "die Regel", "the rule", "القاعدة", "правилото"]
dialogue:
  - [jonas, "Willkommen in meiner WG! Das ist Paul, der Mitbewohner, der Physik studiert.", "Welcome to my flat-share! This is Paul, the flatmate who studies physics.", "أهلًا بكِ في سكني المشترك! هذا باول، شريك السكن الذي يدرس الفيزياء.", "Добредојде во мојот заеднички стан! Ова е Паул, цимерот што студира физика."]
  - [protagonist, "Hallo! Und das ist dein Zimmer?", "Hi! And this is your room?", "مرحبًا! وهذه غرفتك؟", "Здраво! А ова е твојата соба?"]
  - [jonas, "Ja, das Zimmer, das zum Hof geht. Und hier die Gemeinschaftsküche.", "Yes, the room that faces the courtyard. And here's the shared kitchen.", "نعم، الغرفة التي تطلّ على الفناء. وهنا المطبخ المشترك.", "Да, собата што гледа кон дворот. А тука заедничката кујна."]
  - [protagonist, "Was ist das am Kühlschrank?", "What's that on the fridge?", "ما هذا على الثلاجة؟", "Што е тоа на фрижидерот?"]
  - [jonas, "Der Putzplan. Jede Woche ist eine Person dran.", "The cleaning rota. Every week one person has a turn.", "جدول التنظيف. كل أسبوع يأتي دور شخص.", "Распоредот за чистење. Секоја недела е некој на ред."]
  - [protagonist, "Und wer ist diese Woche dran?", "And whose turn is it this week?", "ودور من هذا الأسبوع؟", "А кој е на ред оваа недела?"]
  - [jonas, "Ich. Ich muss das Bad putzen. Die Regeln sind streng!", "Me. I have to clean the bathroom. The rules are strict!", "دوري. يجب أن أنظف الحمام. القواعد صارمة!", "Јас. Морам да ја исчистам бањата. Правилата се строги!"]
  - [protagonist, "Und die Person, die nicht putzt?", "And the person who doesn't clean?", "والشخص الذي لا ينظّف؟", "А лицето што не чисти?"]
  - [jonas, "Die kauft Bier für alle!", "That person buys beer for everyone!", "يشتري البيرة للجميع!", "Тоа купува пиво за сите!"]
teach:
  - ask: ["Say: the flat-share.", "قولي: السكن المشترك.", "Кажете: заедничкиот стан.", "Die WG.", die-wg]
  - note: ["Relative clauses describe a noun and send the verb to the end; the pronoun matches the noun: «der Mitbewohner, der Physik studiert», «das Zimmer, das zum Hof geht», «die Person, die nicht putzt».", "جمل الصلة تصف الاسم وترسل الفعل إلى الآخر، والضمير يطابق الاسم: «der Mitbewohner, der Physik studiert»، «das Zimmer, das zum Hof geht»، «die Person, die nicht putzt».", "Релативните реченици опишуваат именка и го праќаат глаголот на крајот; заменката се согласува со именката: «der Mitbewohner, der Physik studiert», «das Zimmer, das zum Hof geht», «die Person, die nicht putzt»."]
  - ask: ["Say: the flatmate who studies physics.", "قولي: شريك السكن الذي يدرس الفيزياء.", "Кажете: цимерот што студира физика.", "Der Mitbewohner, der Physik studiert.", der-mitbewohner]
  - ask: ["Say: the room that faces the courtyard.", "قولي: الغرفة التي تطلّ على الفناء.", "Кажете: собата што гледа кон дворот.", "Das Zimmer, das zum Hof geht.", das-zimmer-das]
  - ask: ["Say: the shared kitchen.", "قولي: المطبخ المشترك.", "Кажете: заедничката кујна.", "Die Gemeinschaftsküche.", die-gemeinschaftskueche]
  - ask: ["Say: the cleaning rota.", "قولي: جدول التنظيف.", "Кажете: распоредот за чистење.", "Der Putzplan.", der-putzplan]
  - ask: ["Ask: whose turn is it this week?", "اسألي: دور من هذا الأسبوع؟", "Прашајте: кој е на ред оваа недела?", "Wer ist diese Woche dran?", diese-woche, ist-dran]
  - ask: ["Say: I have to clean the bathroom.", "قولي: يجب أن أنظف الحمام.", "Кажете: морам да ја исчистам бањата.", "Ich muss das Bad putzen.", das-bad-putzen]
  - ask: ["Say: the rules are strict!", "قولي: القواعد صارمة!", "Кажете: правилата се строги!", "Die Regeln sind streng!", die-regel, streng]
  - ask: ["Ask: and the person who doesn't clean?", "اسألي: والشخص الذي لا ينظّف؟", "Прашајте: а лицето што не чисти?", "Und die Person, die nicht putzt?", die-person-die]
  - note: ["Flat-shares (WGs) are how many students and young workers live. A Putzplan on the fridge decides who cleans what each week — and breaking it is a real source of conflict.", "السكن المشترك (WG) هو طريقة عيش كثير من الطلاب والشباب العاملين. وجدول التنظيف على الثلاجة يحدّد من ينظّف ماذا كل أسبوع — ومخالفته مصدر حقيقي للخلاف.", "Заедничките станови (WG) се начинот на кој живеат многу студенти и млади вработени. Распоредот на фрижидерот одлучува кој што чисти секоја недела — а неговото кршење е вистински извор на кавги."]
