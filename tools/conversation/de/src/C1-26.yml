id: C1-26
protagonist: m
title: ["Appealing a decision", "الاعتراض على قرار", "Жалба на решение"]
situation:
  - "The city refused your resident parking permit — wrongly, you think. Jonas helps you write an appeal, in time."
  - "رفضت المدينة تصريح موقف السكان الخاص بك — خطأً كما تظن. يوناس يساعدك في كتابة اعتراض، في الموعد."
  - "Градот ви ја одби дозволата за паркирање на жители — погрешно, мислите. Јонас ви помага да напишете жалба, навреме."
learn: [c1-formal-letters]
culture: The one-month deadline
items:
  - [der-widerspruch-amt, "der Widerspruch", "the (formal) appeal", "الاعتراض الرسمي", "жалбата"]
  - [fristgerecht, "fristgerecht", "within the deadline", "في المهلة المحدّدة", "во рок"]
  - [der-bescheid-c1, "der Bescheid vom …", "the decision dated …", "القرار المؤرَّخ في …", "решението од …"]
  - [die-rechtsbehelfsbelehrung, "die Rechtsbehelfsbelehrung", "the notice of appeal rights", "إشعار سبل الطعن", "поуката за правен лек", {rare: true}]
  - [die-begruendung, "die Begründung", "the grounds, reasoning", "التعليل", "образложението"]
  - [hiermit-lege-ich, "Hiermit lege ich … ein", "I hereby lodge …", "أتقدّم بموجب هذا بـ…", "Со ова поднесувам …"]
  - [das-aktenzeichen-c1, "unter dem Aktenzeichen", "under the reference number", "تحت رقم الملف", "под бројот на предметот"]
  - [der-bewohnerparkausweis, "der Bewohnerparkausweis", "the resident parking permit", "تصريح موقف السكان", "дозволата за паркирање на жители", {rare: true}]
  - [die-anlage, "die Anlage", "the enclosure", "المرفَق", "прилогот"]
  - [ich-bitte-um-pruefung, "Ich bitte um erneute Prüfung", "I request a re-examination", "أرجو إعادة النظر", "Барам повторна проверка"]
dialogue:
  - [protagonist, "Die Stadt sagt, mein Auto sei nicht auf mich zugelassen. Aber das stimmt nicht!", "The city says my car isn't registered to me. But that's not true!", "المدينة تقول إنّ سيارتي ليست مسجّلة باسمي. لكن هذا غير صحيح!", "Градот вели дека колата не е регистрирана на мене. Но тоа не е точно!"]
  - [jonas, "Steht unten eine Rechtsbehelfsbelehrung? ... Ja: ein Monat für den Widerspruch.", "Is there a notice of appeal rights at the bottom? ... Yes: one month for an appeal.", "هل في الأسفل إشعار سبل الطعن؟ ... نعم: شهر واحد للاعتراض.", "Има ли долу поука за правен лек? ... Да: еден месец за жалба."]
  - [protagonist, "Und wie fange ich an?", "And how do I start?", "وكيف أبدأ؟", "А како да почнам?"]
  - [jonas, "So: „Hiermit lege ich fristgerecht Widerspruch gegen den Bescheid vom 3. Mai ein, Aktenzeichen ...“", "Like this: 'I hereby lodge an appeal within the deadline against the decision of 3 May, reference …'", "هكذا: «أتقدّم بموجب هذا في المهلة المحدّدة باعتراض على القرار المؤرَّخ في 3 مايو، رقم الملف …»", "Вака: „Со ова во рок поднесувам жалба против решението од 3 мај, број на предмет …“"]
  - [protagonist, "Und dann die Begründung?", "And then the grounds?", "ثم التعليل؟", "А потоа образложението?"]
  - [jonas, "Genau. Kurz und sachlich: der Fahrzeugschein als Anlage. Dann: „Ich bitte um erneute Prüfung.“", "Exactly. Short and factual: the vehicle registration document as an enclosure. Then: 'I request a re-examination.'", "بالضبط. قصير وموضوعي: وثيقة تسجيل المركبة مرفقة. ثم: «أرجو إعادة النظر.»", "Точно. Кратко и деловно: сообраќајната дозвола во прилог. Потоа: „Барам повторна проверка.“"]
  - [protagonist, "Mit Unterschrift, per Post?", "With a signature, by post?", "بتوقيع، بالبريد؟", "Со потпис, по пошта?"]
  - [jonas, "Ja, oder persönlich mit Eingangsstempel. Dann hast du den Beweis.", "Yes, or in person with a receipt stamp. Then you have proof.", "نعم، أو شخصيًا مع ختم الاستلام. عندها يكون لديك الدليل.", "Да, или лично со печат за прием. Тогаш имаш доказ."]
teach:
  - ask: ["Say: the resident parking permit.", "قل: تصريح موقف السكان.", "Кажете: дозволата за паркирање.", "Der Bewohnerparkausweis.", der-bewohnerparkausweis]
  - ask: ["Say: the notice of appeal rights.", "قل: إشعار سبل الطعن.", "Кажете: поуката за правен лек.", "Die Rechtsbehelfsbelehrung.", die-rechtsbehelfsbelehrung]
  - note: ["An appeal letter has fixed parts: «Hiermit lege ich fristgerecht Widerspruch gegen den Bescheid vom … ein», «Aktenzeichen», «Begründung», «Anlage», «Ich bitte um erneute Prüfung», signature.", "لرسالة الاعتراض أجزاء ثابتة: «Hiermit lege ich fristgerecht Widerspruch gegen den Bescheid vom … ein»، «Aktenzeichen»، «Begründung»، «Anlage»، «Ich bitte um erneute Prüfung»، والتوقيع.", "Писмото за жалба има фиксни делови: «Hiermit lege ich fristgerecht Widerspruch gegen den Bescheid vom … ein», «Aktenzeichen», «Begründung», «Anlage», «Ich bitte um erneute Prüfung», потпис."]
  - ask: ["Write: I hereby lodge an appeal within the deadline.", "اكتب: أتقدّم بموجب هذا في المهلة باعتراض.", "Напишете: со ова во рок поднесувам жалба.", "Hiermit lege ich fristgerecht Widerspruch ein.", hiermit-lege-ich, fristgerecht, der-widerspruch-amt]
  - ask: ["Write: against the decision of 3 May.", "اكتب: على القرار المؤرَّخ في 3 مايو.", "Напишете: против решението од 3 мај.", "Gegen den Bescheid vom 3. Mai.", der-bescheid-c1]
  - ask: ["Write: under the reference number.", "اكتب: تحت رقم الملف.", "Напишете: под бројот на предметот.", "Unter dem Aktenzeichen.", das-aktenzeichen-c1]
  - ask: ["Say: the grounds.", "قل: التعليل.", "Кажете: образложението.", "Die Begründung.", die-begruendung]
  - ask: ["Say: as an enclosure.", "قل: مرفقًا.", "Кажете: во прилог.", "Als Anlage.", die-anlage]
  - ask: ["Write: I request a re-examination.", "اكتب: أرجو إعادة النظر.", "Напишете: барам повторна проверка.", "Ich bitte um erneute Prüfung.", ich-bitte-um-pruefung]
  - note: ["Every official decision (Bescheid) ends with a notice of how and by when you can appeal — usually one month. Appeal in writing and signed, keep proof of delivery, and give reasons (you may add them later). An appeal is free; if it's rejected, the next step is court. Tax decisions use 'Einspruch' instead.", "كل قرار رسمي (Bescheid) ينتهي بإشعار بكيفية الاعتراض وموعده — عادةً شهر واحد. اعترض كتابيًا وموقَّعًا، واحتفظ بإثبات التسليم، واذكر الأسباب (يمكنك إضافتها لاحقًا). الاعتراض مجاني؛ وإن رُفض فالخطوة التالية المحكمة. وفي القرارات الضريبية يُسمّى «Einspruch».", "Секое официјално решение (Bescheid) завршува со поука како и до кога можете да се жалите — обично еден месец. Жалете се писмено и потпишано, чувајте доказ за доставување и дајте причини (може и подоцна). Жалбата е бесплатна; ако се одбие, следен чекор е суд. Кај даночните решенија се вика „Einspruch“."]
