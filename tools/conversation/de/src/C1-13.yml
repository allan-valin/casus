id: C1-13
protagonist: f
title: ["Coaching the kids", "تدريب الأطفال", "Тренирање деца"]
situation:
  - "The club's youth coach is leaving. Petra asks if you'd take over the under-tens — and explains what that involves."
  - "مدرّب الناشئين في النادي يغادر. بيترا تسألكِ إن كنتِ ستتولّين فريق ما دون العاشرة — وتشرح ما يتطلّبه ذلك."
  - "Тренерот на младите во клубот заминува. Петра ве прашува дали би ги презеле децата под десет — и објаснува што значи тоа."
learn: [de-vinf_01, de-b2-sein-zu]
culture: The extended police certificate
items:
  - [der-jugendtrainer, "die Jugendtrainerin", "the youth coach (f)", "مدرّبة الناشئين", "тренерката на младите", {rare: true}]
  - [die-verantwortung, "die Verantwortung", "responsibility", "المسؤولية", "одговорноста"]
  - [das-fuehrungszeugnis, "das erweiterte Führungszeugnis", "the extended police certificate", "شهادة حسن السيرة الموسّعة", "проширеното уверение за неосудуваност", {rare: true}]
  - [die-uebungsleiterlizenz, "die Übungsleiterlizenz", "the coaching licence", "رخصة المدرّب", "тренерската лиценца", {rare: true}]
  - [es-ist-wichtig-zu, "es ist wichtig, … zu", "it's important to …", "من المهم أن …", "важно е да …"]
  - [ist-zu-beachten, "ist zu beachten", "must be observed", "يجب مراعاته", "треба да се почитува"]
  - [hat-zu, "hat … zu", "has to …", "عليه أن …", "треба да …"]
  - [anstatt-zu, "anstatt … zu", "instead of …ing", "بدلًا من أن …", "наместо да …"]
  - [die-aufsichtspflicht, "die Aufsichtspflicht", "the duty of supervision", "واجب الإشراف", "должноста за надзор", {rare: true}]
  - [die-eltern-anrufen, "die Eltern informieren", "inform the parents", "يُبلغ الأهل", "ги известува родителите"]
dialogue:
  - [petra, "Würdest du die Kinder übernehmen? Du wärst die neue Jugendtrainerin.", "Would you take over the kids? You'd be the new youth coach.", "هل تتولّين الأطفال؟ ستكونين مدرّبة الناشئين الجديدة.", "Би ги презела ли децата? Ќе бидеш новата тренерка на младите."]
  - [protagonist, "Gern! Aber das ist viel Verantwortung.", "Gladly! But that's a lot of responsibility.", "بكل سرور! لكن هذه مسؤولية كبيرة.", "Со задоволство! Но тоа е голема одговорност."]
  - [petra, "Stimmt. Zuerst hast du ein erweitertes Führungszeugnis vorzulegen. Das ist Pflicht.", "True. First you have to show an extended police certificate. It's compulsory.", "صحيح. أولًا عليكِ أن تقدّمي شهادة حسن سيرة موسّعة. هذا إلزامي.", "Точно. Прво треба да поднесеш проширено уверение за неосудуваност. Тоа е задолжително."]
  - [protagonist, "Und muss ich eine Ausbildung machen?", "And do I need training?", "وهل يجب أن أتدرّب؟", "А мора ли да се обучам?"]
  - [petra, "Der Verein bezahlt dir die Übungsleiterlizenz. Es ist wichtig, die Regeln zu kennen.", "The club pays for your coaching licence. It's important to know the rules.", "النادي يدفع لكِ رخصة المدرّب. من المهم أن تعرفي القواعد.", "Клубот ти ја плаќа тренерската лиценца. Важно е да ги знаеш правилата."]
  - [protagonist, "Welche Regeln?", "Which rules?", "أي قواعد؟", "Кои правила?"]
  - [petra, "Die Aufsichtspflicht ist immer zu beachten. Kein Kind geht allein nach Hause, ohne die Eltern zu informieren.", "The duty of supervision must always be observed. No child goes home alone without informing the parents.", "واجب الإشراف يجب مراعاته دائمًا. لا يذهب أي طفل إلى البيت وحده دون إبلاغ الأهل.", "Должноста за надзор секогаш треба да се почитува. Ниту едно дете не оди само дома без да се известат родителите."]
  - [protagonist, "Und anstatt nur zu gewinnen, sollen sie Spaß haben.", "And instead of just winning, they should have fun.", "وبدلًا من أن يفوزوا فقط، يجب أن يستمتعوا.", "И наместо само да победуваат, треба да се забавуваат."]
  - [petra, "Genau die richtige Einstellung!", "Exactly the right attitude!", "هذا بالضبط الموقف الصحيح!", "Токму вистинскиот став!"]
teach:
  - ask: ["Say: the youth coach.", "قولي: مدرّبة الناشئين.", "Кажете: тренерката на младите.", "Die Jugendtrainerin.", der-jugendtrainer]
  - ask: ["Say: a lot of responsibility.", "قولي: مسؤولية كبيرة.", "Кажете: голема одговорност.", "Viel Verantwortung.", die-verantwortung]
  - note: ["Infinitive constructions for duties: «haben … zu» (= must: «Du hast ein Zeugnis vorzulegen»), «sein … zu» (= must be done: «Die Aufsichtspflicht ist zu beachten»), and «es ist wichtig, … zu», «ohne … zu», «anstatt … zu».", "تراكيب المصدر للواجبات: «haben … zu» (= يجب: «Du hast ein Zeugnis vorzulegen»)، «sein … zu» (= يجب أن يُفعل: «Die Aufsichtspflicht ist zu beachten»)، و«es ist wichtig, … zu»، «ohne … zu»، «anstatt … zu».", "Инфинитивни конструкции за обврски: «haben … zu» (= мора: «Du hast ein Zeugnis vorzulegen»), «sein … zu» (= мора да се направи: «Die Aufsichtspflicht ist zu beachten»), и «es ist wichtig, … zu», «ohne … zu», «anstatt … zu»."]
  - ask: ["She says: you have to show an extended police certificate.", "تقول: عليكِ أن تقدّمي شهادة حسن سيرة موسّعة.", "Таа вели: треба да поднесеш проширено уверение.", "Du hast ein erweitertes Führungszeugnis vorzulegen.", hat-zu, das-fuehrungszeugnis]
  - ask: ["Say: the coaching licence.", "قولي: رخصة المدرّب.", "Кажете: тренерската лиценца.", "Die Übungsleiterlizenz.", die-uebungsleiterlizenz]
  - ask: ["Say: it's important to know the rules.", "قولي: من المهم أن تعرفي القواعد.", "Кажете: важно е да ги знаеш правилата.", "Es ist wichtig, die Regeln zu kennen.", es-ist-wichtig-zu]
  - ask: ["Say: the duty of supervision must be observed.", "قولي: واجب الإشراف يجب مراعاته.", "Кажете: должноста за надзор треба да се почитува.", "Die Aufsichtspflicht ist zu beachten.", die-aufsichtspflicht, ist-zu-beachten]
  - ask: ["Say: without informing the parents.", "قولي: دون إبلاغ الأهل.", "Кажете: без да се известат родителите.", "Ohne die Eltern zu informieren.", die-eltern-anrufen]
  - ask: ["Say: instead of just winning.", "قولي: بدلًا من أن يفوزوا فقط.", "Кажете: наместо само да победуваат.", "Anstatt nur zu gewinnen.", anstatt-zu]
  - note: ["Anyone working with children in a club must show an extended police certificate (cheap or free for volunteers). Clubs pay for coaching licences, and youth coaches get a small tax-free allowance. Supervision duty is serious: a child leaves only with a parent or with their written permission.", "كل من يعمل مع الأطفال في نادٍ يجب أن يقدّم شهادة حسن سيرة موسّعة (رخيصة أو مجانية للمتطوعين). والأندية تدفع رخص التدريب، ومدرّبو الناشئين يحصلون على تعويض صغير معفى من الضريبة. وواجب الإشراف جدّي: لا يغادر الطفل إلا مع أحد والديه أو بإذنهما الكتابي.", "Секој што работи со деца во клуб мора да поднесе проширено уверение за неосудуваност (евтино или бесплатно за волонтери). Клубовите ги плаќаат тренерските лиценци, а тренерите на младите добиваат мал неоданочен надоместок. Должноста за надзор е сериозна: детето заминува само со родител или со нивна писмена дозвола."]
