id: A1-02-e
tracks: [en]
protagonist: m
title: ["The flat"]
situation: ["Frau Becker shows you the flat. You look for the kitchen."]
learn: [de-det_01]
culture: No kitchen, not even a sink
items:
  - [die-wohnung, "die Wohnung", "the flat"]
  - [das-zimmer, "das Zimmer", "the room"]
  - [und-die, "Und die …?", "And the …?"]
  - [die-kueche, "die Küche", "the kitchen"]
  - [es-gibt-keine, "Es gibt keine …", "There is no … (feminine)"]
  - [nur, "nur", "only"]
  - [die-anschluesse, "die Anschlüsse", "the connections (water, power)", {rare: true}]
  - [die-spuele, "die Spüle", "the sink", {rare: true}]
  - [selbst, "selbst", "yourself, myself"]
  - [wo, "Wo …?", "Where …?"]
  - [kaufe-ich, "kaufe ich", "do I buy"]
  - [gebraucht, "gebraucht", "second-hand, used"]
  - [der-kuehlschrank, "der Kühlschrank", "the fridge", {rare: true}]
  - [auch-nicht, "auch nicht", "not … either"]
  - [viel-glueck, "Viel Glück!", "Good luck!"]
dialogue:
  - [becker, "Hier ist die Wohnung. Das ist das Zimmer.", "Here's the flat. This is the room."]
  - [protagonist, "Schön! Und die Küche?", "Nice! And the kitchen?"]
  - [becker, "Es gibt keine Küche. Nur die Anschlüsse.", "There's no kitchen. Only the connections."]
  - [protagonist, "Keine Küche? Auch keine Spüle?", "No kitchen? No sink either?"]
  - [becker, "Nein. Die Küche kaufen Sie selbst.", "No. You buy the kitchen yourself."]
  - [protagonist, "Wo kaufe ich eine Küche?", "Where do I buy a kitchen?"]
  - [becker, "Im Möbelhaus, oder gebraucht im Internet.", "At a furniture store, or second-hand online."]
  - [protagonist, "Und der Kühlschrank?", "And the fridge?"]
  - [becker, "Auch nicht. Viel Glück!", "Not that either. Good luck!"]
teach:
  - note: ["German nouns have three genders, and 'the' shows them: «der» (masculine), «die» (feminine), «das» (neuter). Learn every noun with its article: «der Kühlschrank», «die Küche», «das Zimmer»."]
  - ask: ["Say: here is the flat.", "Hier ist die Wohnung.", die-wohnung]
  - ask: ["Say: this is the room.", "Das ist das Zimmer.", das-zimmer]
  - ask: ["Ask: and the kitchen?", "Und die Küche?", und-die, die-kueche]
  - ask: ["She says: there's no kitchen.", "Es gibt keine Küche.", es-gibt-keine, die-kueche]
  - ask: ["Say: only the connections.", "Nur die Anschlüsse.", nur, die-anschluesse]
  - ask: ["Ask: no sink either?", "Auch keine Spüle?", auch-nicht, die-spuele]
  - note: ["Unfurnished flats often come without a kitchen — not even a sink, only the water and power connections. A kitchen the landlord supplies is the landlord's to repair, so many supply none. Tenants buy one, bring one, or buy the previous tenant's."]
  - ask: ["Say: you buy the kitchen yourself.", "Die Küche kaufen Sie selbst.", selbst]
  - ask: ["Ask where you buy a kitchen.", "Wo kaufe ich eine Küche?", wo, kaufe-ich]
  - ask: ["Say: second-hand, online.", "Gebraucht, im Internet.", gebraucht]
  - ask: ["Ask: and the fridge?", "Und der Kühlschrank?", der-kuehlschrank]
  - ask: ["She says: good luck!", "Viel Glück!", viel-glueck]
