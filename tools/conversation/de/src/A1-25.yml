id: A1-25
protagonist: f
title: ["On the tram", "في الترام", "Во трамвајот"]
situation:
  - "Evening tram. A man starts shouting at you because you are a foreigner. A woman stands up next to you."
  - "ترام المساء. رجل يبدأ بالصراخ عليكِ لأنكِ أجنبية. امرأة تقف بجانبك."
  - "Вечерен трамвај. Еден човек почнува да вика на вас затоа што сте странец. Една жена станува до вас."
learn: [de-vimp_01]
culture: What to say and do
items:
  - [lassen-sie-mich, "Lassen Sie mich in Ruhe!", "Leave me alone! (polite)", "اتركني وشأني!", "Оставете ме на мира!"]
  - [hoeren-sie-auf, "Hören Sie auf!", "Stop it! (polite)", "توقّف!", "Престанете!"]
  - [hilfe, "Hilfe!", "Help!", "النجدة!", "Помош!"]
  - [die-polizei, "die Polizei", "the police", "الشرطة", "полицијата"]
  - [hundertzehn, "hundertzehn", "110 (police number)", "110 (رقم الشرطة)", "110 (број на полиција)"]
  - [alles-okay, "Alles okay?", "Are you all right?", "هل أنتِ بخير؟", "Дали сте во ред?"]
  - [ich-bin-bei-ihnen, "Ich bin bei Ihnen", "I'm with you", "أنا معكِ", "Јас сум со вас"]
  - [der-fahrer, "der Fahrer", "the driver", "السائق", "возачот"]
  - [aussteigen-jetzt, "Steigen Sie aus!", "Get off! (polite)", "انزل!", "Симнете се!"]
  - [danke-fuer-die-hilfe, "Danke für die Hilfe", "Thanks for your help", "شكرًا على المساعدة", "Благодарам за помошта"]
dialogue:
  - [poebler, "Ausländer raus! Was machen Sie hier?", "Foreigners out! What are you doing here?", "اخرجوا أيها الأجانب! ماذا تفعلين هنا؟", "Странци надвор! Што барате тука?"]
  - [protagonist, "Lassen Sie mich in Ruhe!", "Leave me alone!", "اتركني وشأني!", "Оставете ме на мира!"]
  - [lena, "Hören Sie auf! Sofort!", "Stop it! Right now!", "توقّف! فورًا!", "Престанете! Веднаш!"]
  - [lena, "Alles okay? Ich bin bei Ihnen.", "Are you all right? I'm with you.", "هل أنتِ بخير؟ أنا معكِ.", "Дали сте во ред? Јас сум со вас."]
  - [protagonist, "Danke. Ich habe Angst.", "Thank you. I'm frightened.", "شكرًا. أنا خائفة.", "Благодарам. Се плашам."]
  - [lena, "Wir sagen es dem Fahrer. Oder wir rufen die Polizei, hundertzehn.", "We'll tell the driver. Or we call the police, one-one-zero.", "نخبر السائق. أو نتصل بالشرطة، 110.", "Ќе му кажеме на возачот. Или ќе ја повикаме полицијата, 110."]
  - [lena, "Steigen Sie aus! Sie sind hier nicht willkommen!", "Get off! You're not welcome here!", "انزل! أنت غير مرحَّب بك هنا!", "Симнете се! Не сте добредојдени тука!"]
  - [protagonist, "Er steigt aus... Danke für die Hilfe.", "He's getting off... Thanks for your help.", "إنه ينزل... شكرًا على المساعدة.", "Се симнува... Благодарам за помошта."]
  - [lena, "Gern. Das ist nicht normal. Das ist nicht Leipzig.", "You're welcome. That isn't normal. That isn't Leipzig.", "عفوًا. هذا ليس عاديًا. هذه ليست لايبزيغ.", "Нема зошто. Тоа не е нормално. Тоа не е Лајпциг."]
teach:
  - note: ["Hard to hear, but better said on the first day: it can happen. Speak loudly and clearly, so that others hear — most people will help.", "صعب سماعه، لكن من الأفضل قوله من اليوم الأول: قد يحدث هذا. تكلّمي بصوت عالٍ وواضح، كي يسمع الآخرون — أغلب الناس سيساعدون.", "Тешко е да се чуе, но подобро е да се каже од првиот ден: може да се случи. Зборувајте гласно и јасно, за да слушнат другите — повеќето ќе помогнат."]
  - ask: ["Say firmly: leave me alone!", "قولي بحزم: اتركني وشأني!", "Кажете цврсто: оставете ме на мира!", "Lassen Sie mich in Ruhe!", lassen-sie-mich]
  - ask: ["Say: stop it!", "قولي: توقّف!", "Кажете: престанете!", "Hören Sie auf!", hoeren-sie-auf]
  - ask: ["Call for help.", "اطلبي النجدة.", "Повикајте помош.", "Hilfe!", hilfe]
  - ask: ["The woman asks if you're all right.", "المرأة تسألك إن كنتِ بخير.", "Жената ве прашува дали сте во ред.", "Alles okay?", alles-okay]
  - ask: ["She says: I'm with you.", "تقول: أنا معكِ.", "Таа вели: јас сум со вас.", "Ich bin bei Ihnen.", ich-bin-bei-ihnen]
  - ask: ["Say: we'll tell the driver.", "قولي: نخبر السائق.", "Кажете: ќе му кажеме на возачот.", "Wir sagen es dem Fahrer.", der-fahrer]
  - ask: ["Say: the police, one-one-zero.", "قولي: الشرطة، 110.", "Кажете: полицијата, 110.", "Die Polizei, hundertzehn.", die-polizei, hundertzehn]
  - ask: ["She tells him: get off!", "تقول له: انزل!", "Таа му вели: симнете се!", "Steigen Sie aus!", aussteigen-jetzt]
  - ask: ["Thank her for her help.", "اشكريها على المساعدة.", "Заблагодарете ѝ за помошта.", "Danke für die Hilfe.", danke-fuer-die-hilfe]
  - note: ["Police: 110. Ambulance and fire: 112. Trams have an emergency button and an intercom to the driver. Afterwards you can report it — local counselling services for victims of racism exist in every big city.", "الشرطة: 110. الإسعاف والإطفاء: 112. في الترام زر طوارئ وجهاز اتصال بالسائق. وبعد ذلك يمكنكِ الإبلاغ — في كل مدينة كبيرة مراكز استشارية لضحايا العنصرية.", "Полиција: 110. Брза помош и пожарна: 112. Трамваите имаат копче за итни случаи и интерфон до возачот. Потоа може да пријавите — во секој голем град има советувалишта за жртви на расизам."]
