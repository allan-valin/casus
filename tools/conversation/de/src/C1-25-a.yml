id: C1-25-a
tracks: [ar]
protagonist: f
title: ["تقرير المصير"]
situation: ["رنا تحكي لكِ عن ابنة عمّها التي بقيت في البلد ولم يُسمح لها أن تختار — وعمّا تعلّمته هنا."]
learn: [de-c1-nominal-genitive, de-c1-funktionsverbgefuege]
culture: Women's rights — where to get help
items:
  - [die-gleichberechtigung, "die Gleichberechtigung", "المساواة في الحقوق"]
  - [die-selbstbestimmung, "die Selbstbestimmung", "تقرير المصير"]
  - [das-opfer, "das Opfer", "الضحية"]
  - [die-schuld, "die Schuld", "اللوم، الذنب"]
  - [die-zwangsheirat, "die Zwangsheirat", "الزواج القسري", {rare: true}]
  - [das-hilfetelefon, "das Hilfetelefon", "خط المساعدة الهاتفي", {rare: true}]
  - [das-frauenhaus, "das Frauenhaus", "دار حماية النساء", {rare: true}]
  - [anonym, "anonym", "دون كشف الهوية"]
  - [die-entscheidung-ueber, "die Entscheidung über das eigene Leben", "القرار في الحياة الخاصة"]
  - [niemand-darf, "niemand darf …", "لا يحق لأحد …"]
dialogue:
  - [rana, "Meine Cousine durfte nicht weiter zur Schule gehen. Mit sechzehn wurde sie verheiratet.", "ابنة عمّي لم يُسمح لها بمتابعة المدرسة. زُوّجت في السادسة عشرة."]
  - [protagonist, "Hat man sie gefragt?", "هل سألها أحد؟"]
  - [rana, "Nein. Und als die Ehe schlecht war, gab man ihr die Schuld.", "لا. وحين ساء الزواج لاموها هي."]
  - [protagonist, "Sie ist das Opfer. Nicht die Schuldige.", "إنها الضحية. لا المذنبة."]
  - [rana, "Hier habe ich ein Wort gelernt: Selbstbestimmung. Die Entscheidung über das eigene Leben.", "هنا تعلّمتُ كلمة: تقرير المصير. القرار في الحياة الخاصة."]
  - [protagonist, "Und Gleichberechtigung steht im Grundgesetz — für alle Frauen hier.", "والمساواة في الحقوق منصوص عليها في القانون الأساسي — لكل النساء هنا."]
  - [rana, "Wenn eine Frau hier Hilfe braucht: Es gibt ein Hilfetelefon, anonym, auch auf Arabisch.", "إذا احتاجت امرأة هنا إلى مساعدة: هناك خط هاتفي للمساعدة، دون كشف الهوية، بالعربية أيضًا."]
  - [protagonist, "Und Frauenhäuser. Niemand darf eine Frau hier zwingen.", "ودور حماية النساء. لا يحق لأحد هنا أن يُكره امرأة."]
teach:
  - ask: ["قولي: المساواة في الحقوق.", "Die Gleichberechtigung.", die-gleichberechtigung]
  - ask: ["قولي: تقرير المصير.", "Die Selbstbestimmung.", die-selbstbestimmung]
  - note: ["الحقوق تُسمّى بأسماء: «die Entscheidung über das eigene Leben» (= أن تقرّري في حياتكِ)، «die Selbstbestimmung»، «die Gleichberechtigung». هذه كلمات مراكز الاستشارة والقانون."]
  - ask: ["قولي: القرار في الحياة الخاصة حق.", "Die Entscheidung über das eigene Leben ist ein Recht.", die-entscheidung-ueber]
  - ask: ["قولي: إنها الضحية، لا المذنبة.", "Sie ist das Opfer, nicht die Schuldige.", das-opfer, die-schuld]
  - ask: ["قولي: الزواج القسري.", "Die Zwangsheirat.", die-zwangsheirat]
  - ask: ["قولي: خط مساعدة، دون كشف الهوية.", "Ein Hilfetelefon, anonym.", das-hilfetelefon, anonym]
  - ask: ["قولي: دار حماية النساء.", "Das Frauenhaus.", das-frauenhaus]
  - ask: ["قولي: لا يحق لأحد أن يُكرهها.", "Niemand darf sie zwingen.", niemand-darf]
  - note: ["في ألمانيا الزواج القسري جريمة، وكل بالغة تقرّر وحدها في الزواج والدراسة والعمل والدين. وخط «Hilfetelefon Gewalt gegen Frauen» (116 016) مجاني ودون كشف الهوية ومتاح ليلًا ونهارًا بلغات كثيرة منها العربية؛ ودور حماية النساء تستقبل النساء وأطفالهن سريعًا. في الطوارئ: 110. ولا يؤثّر طلب المساعدة على إقامتكِ — اسألي مركز استشارة إن كنتِ قلقة."]
