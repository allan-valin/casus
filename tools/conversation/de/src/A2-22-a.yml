id: A2-22-a
tracks: [ar]
protagonist: m
title: ["دعوة"]
situation: ["الجارة السيدة نويمان تدعو عائلتك إلى القهوة يوم الأحد. ماذا تحضرون معكم؟"]
learn: [a2-sollen]
culture: What to bring
items:
  - [die-einladung-a, "die Einladung", "الدعوة"]
  - [am-sonntag-um, "am Sonntag um drei", "يوم الأحد في الثالثة"]
  - [sollen-wir, "Sollen wir …?", "هل نـ…؟ (ماذا تريدين أن نفعل)"]
  - [etwas-mitbringen, "etwas mitbringen", "نحضر شيئًا معنا"]
  - [nur-sie-selbst, "nur Sie selbst", "فقط أنتم"]
  - [blumen, "Blumen", "أزهار"]
  - [pralinen, "Pralinen", "شوكولاتة", {rare: true}]
  - [puenktlich-um-drei, "pünktlich um drei", "في الثالثة تمامًا"]
  - [wir-kommen-gern, "Wir kommen gern", "نأتي بكل سرور"]
  - [wir-freuen-uns-a, "Wir freuen uns", "يسعدنا ذلك"]
dialogue:
  - [neumann, "Ich möchte Sie und Ihre Familie zum Kaffee einladen. Am Sonntag um drei?", "أودّ أن أدعوك أنت وعائلتك إلى القهوة. يوم الأحد في الثالثة؟"]
  - [protagonist, "Danke für die Einladung! Wir kommen gern.", "شكرًا على الدعوة! نأتي بكل سرور."]
  - [protagonist, "Sollen wir etwas mitbringen? Meine Frau macht gutes Gebäck.", "هل نحضر شيئًا معنا؟ زوجتي تصنع معجنات طيبة."]
  - [neumann, "Nein, nein, nur Sie selbst! Ich backe einen Kuchen.", "لا، لا، فقط أنتم! سأخبز كعكة."]
  - [protagonist, "Gut. Dann bringen wir Blumen.", "حسنًا. إذن نحضر أزهارًا."]
  - [neumann, "Das ist nett. Und Ihre Tochter trinkt Kakao?", "هذا لطيف. وابنتك تشرب الكاكاو؟"]
  - [protagonist, "Ja, sehr gern. Also pünktlich um drei!", "نعم، كثيرًا. إذن في الثالثة تمامًا!"]
  - [neumann, "Wir freuen uns!", "يسعدنا ذلك!"]
teach:
  - ask: ["قل: شكرًا على الدعوة!", "Danke für die Einladung!", die-einladung-a]
  - ask: ["قل: نأتي بكل سرور.", "Wir kommen gern.", wir-kommen-gern]
  - note: ["«sollen» يسأل عمّا يريده الآخر منك: «Sollen wir etwas mitbringen?» — هل نحضر شيئًا معنا؟"]
  - ask: ["اسأل: هل نحضر شيئًا معنا؟", "Sollen wir etwas mitbringen?", sollen-wir, etwas-mitbringen]
  - ask: ["تقول: فقط أنتم!", "Nur Sie selbst!", nur-sie-selbst]
  - ask: ["قل: إذن نحضر أزهارًا.", "Dann bringen wir Blumen.", blumen]
  - ask: ["قل: شوكولاتة.", "Pralinen.", pralinen]
  - ask: ["قل: يوم الأحد في الثالثة.", "Am Sonntag um drei.", am-sonntag-um]
  - ask: ["قل: في الثالثة تمامًا!", "Pünktlich um drei!", puenktlich-um-drei]
  - ask: ["قل: يسعدنا ذلك!", "Wir freuen uns!", wir-freuen-uns-a]
  - note: ["حين يقول الألمان «فقط أنتم» فهم يعنونها غالبًا؛ والهدية الصغيرة — أزهار أو شوكولاتة — تكفي. الطعام الكثير قد يُحرج المضيفة. والوقت دقيق: الثالثة يعني الثالثة."]
