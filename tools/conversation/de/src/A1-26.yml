id: A1-26
protagonist: m
title: ["A handshake", "المصافحة", "Ракување"]
situation:
  - "A new neighbour moves in on the first floor. She rings your bell to introduce herself."
  - "جارة جديدة تسكن في الطابق الأول. تقرع جرس بابك لتعرّف بنفسها."
  - "Нова соседка се вселува на првиот кат. Ѕвони на вашата врата да се претстави."
learn: [de-vrf_01]
culture: Handshakes across genders
items:
  - [darf-ich-mich-vorstellen, "Darf ich mich vorstellen?", "May I introduce myself?", "هل تسمح لي بأن أعرّفك بنفسي؟", "Може ли да се претставам?"]
  - [mein-name-ist, "Mein Name ist …", "My name is …", "اسمي …", "Моето име е …"]
  - [im-ersten-stock, "im ersten Stock", "on the first floor", "في الطابق الأول", "на првиот кат"]
  - [freut-mich-auch, "Freut mich auch", "Nice to meet you too", "تشرفنا أيضًا", "И мене ми е мило"]
  - [schon-lange, "schon lange", "for a long time already", "منذ وقت طويل", "веќе долго"]
  - [seit-drei-monaten, "seit drei Monaten", "for three months", "منذ ثلاثة أشهر", "веќе три месеци"]
  - [wie-gefaellt-es-ihnen, "Wie gefällt es Ihnen?", "How do you like it? (polite)", "كيف تجد المكان؟", "Како ви се допаѓа?"]
  - [der-fruehling, "der Frühling", "spring", "الربيع", "пролетта"]
  - [klingeln-sie, "Klingeln Sie einfach", "Just ring the bell (polite)", "فقط اقرع الجرس", "Само ѕвонете"]
  - [gleichfalls, "Gleichfalls!", "Likewise!", "وأنت أيضًا!", "Исто така!"]
  - [die-hand, "die Hand", "the hand", "اليد", "раката"]
dialogue:
  - [neumann, "Guten Tag! Darf ich mich vorstellen? Mein Name ist Neumann.", "Good afternoon! May I introduce myself? My name is Neumann.", "نهارك سعيد! هل تسمح لي أن أعرّفك بنفسي؟ اسمي نويمان.", "Добар ден! Може ли да се претставам? Моето име е Нојман."]
  - [protagonist, "Guten Tag, Frau Neumann. Willkommen im Haus!", "Good afternoon, Mrs Neumann. Welcome to the house!", "نهارك سعيد يا سيدة نويمان. أهلًا بك في العمارة!", "Добар ден, госпоѓо Нојман. Добредојдовте во зградата!"]
  - [neumann, "Danke! Ich wohne jetzt im ersten Stock. Freut mich!", "Thanks! I live on the first floor now. Nice to meet you!", "شكرًا! أسكن الآن في الطابق الأول. تشرفنا!", "Благодарам! Сега живеам на првиот кат. Мило ми е!"]
  - [protagonist, "Freut mich auch.", "Nice to meet you too.", "تشرفنا أيضًا.", "И мене ми е мило."]
  - [neumann, "Wohnen Sie schon lange hier?", "Have you lived here long?", "هل تسكن هنا منذ وقت طويل؟", "Дали живеете тука веќе долго?"]
  - [protagonist, "Seit drei Monaten.", "For three months.", "منذ ثلاثة أشهر.", "Веќе три месеци."]
  - [neumann, "Und? Wie gefällt es Ihnen?", "And? How do you like it?", "وكيف تجد المكان؟", "И? Како ви се допаѓа?"]
  - [protagonist, "Gut! Nur der Winter ist lang.", "Good! Only the winter is long.", "جيد! فقط الشتاء طويل.", "Добро! Само зимата е долга."]
  - [neumann, "Der Frühling kommt! Wenn Sie etwas brauchen, klingeln Sie einfach.", "Spring is coming! If you need anything, just ring.", "الربيع قادم! إن احتجت شيئًا فاقرع الجرس فقط.", "Пролетта доаѓа! Ако ви треба нешто, само ѕвонете."]
  - [protagonist, "Danke, gleichfalls!", "Thanks, likewise!", "شكرًا، وأنت أيضًا!", "Благодарам, исто така!"]
teach:
  - ask: ["She asks: may I introduce myself?", "تسأل: هل تسمح لي أن أعرّفك بنفسي؟", "Таа прашува: може ли да се претставам?", "Darf ich mich vorstellen?", darf-ich-mich-vorstellen]
  - ask: ["Say for her: my name is Neumann.", "قلها بلسانها: اسمي نويمان.", "Кажете наместо неа: моето име е Нојман.", "Mein Name ist Neumann.", mein-name-ist]
  - ask: ["Say: on the first floor.", "قل: في الطابق الأول.", "Кажете: на првиот кат.", "Im ersten Stock.", im-ersten-stock]
  - note: ["Germans shake hands when they introduce themselves, also between men and women. People introduce themselves by surname: «Neumann», and you answer «Frau Neumann».", "يتصافح الألمان عند التعارف، بين الرجال والنساء أيضًا. ويعرّفون أنفسهم بالكنية: «Neumann»، فتجيب «Frau Neumann».", "Германците се ракуваат кога се претставуваат, и меѓу мажи и жени. Се претставуваат со презимето: «Neumann», а вие одговарате «Frau Neumann»."]
  - only: {ar: "إن كنت لا تصافح النساء، فلا بأس — لكن قل ذلك بلطف ومن البداية، ويدك على صدرك: «Entschuldigung, ich gebe Frauen nicht die Hand. Aber es freut mich sehr!» مع ابتسامة، يُفهم هذا ولا يُعدّ إهانة."}
  - ask: ["Answer: nice to meet you too.", "أجب: تشرفنا أيضًا.", "Одговорете: и мене ми е мило.", "Freut mich auch.", freut-mich-auch]
  - ask: ["She asks: have you lived here long?", "تسأل: هل تسكن هنا منذ وقت طويل؟", "Таа прашува: живеете ли тука веќе долго?", "Wohnen Sie schon lange hier?", schon-lange]
  - ask: ["Say: for three months.", "قل: منذ ثلاثة أشهر.", "Кажете: веќе три месеци.", "Seit drei Monaten.", seit-drei-monaten]
  - ask: ["She asks how you like it.", "تسألك كيف تجد المكان.", "Ве прашува како ви се допаѓа.", "Wie gefällt es Ihnen?", wie-gefaellt-es-ihnen]
  - ask: ["Say: spring is coming!", "قل: الربيع قادم!", "Кажете: пролетта доаѓа!", "Der Frühling kommt!", der-fruehling]
  - ask: ["She says: just ring the bell.", "تقول: فقط اقرع الجرس.", "Таа вели: само ѕвонете.", "Klingeln Sie einfach.", klingeln-sie]
  - ask: ["Say: thanks, likewise!", "قل: شكرًا، وأنت أيضًا!", "Кажете: благодарам, исто така!", "Danke, gleichfalls!", gleichfalls]
  - ask: ["Say: the hand.", "قل: اليد.", "Кажете: раката.", "Die Hand.", die-hand]
