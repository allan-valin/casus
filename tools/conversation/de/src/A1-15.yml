id: A1-15
protagonist: f
title: ["Numbers and shapes", "الأرقام والأشكال", "Броеви и форми"]
situation:
  - "A sofa from the internet. Will it fit? Jonas helps you measure."
  - "أريكة من الإنترنت. هل ستتسع؟ يوناس يساعدك في القياس."
  - "Кауч од интернет. Дали ќе собере? Јонас ви помага да мерите."
learn: []
learn_missing: [numbers]
culture: —
items:
  - [das-sofa, "das Sofa", "the sofa", "الأريكة", "каучот"]
  - [passt, "passt", "fits", "يتسع، يناسب", "собира, одговара"]
  - [messen, "messen", "measure", "يقيس", "мериме"]
  - [wie-breit, "Wie breit …?", "How wide …?", "كم عرض …؟", "Колку е широк …?"]
  - [meter, "Meter", "metres", "متر", "метри"]
  - [zentimeter, "Zentimeter", "centimetres", "سنتيمتر", "сантиметри"]
  - [lang, "lang", "long", "طويل", "долг"]
  - [die-ecke, "die Ecke", "the corner", "الزاوية", "аголот"]
  - [rund, "rund", "round", "مستدير", "тркалезно"]
  - [eckig, "eckig", "square, angular", "مربّع الشكل", "аглесто"]
  - [genau, "genau", "exactly", "بالضبط", "точно"]
  - [zu-gross, "zu groß", "too big", "كبير جدًا", "преголемо"]
dialogue:
  - [protagonist, "Passt das Sofa hier?", "Will the sofa fit here?", "هل تتسع الأريكة هنا؟", "Ќе собере ли каучот тука?"]
  - [jonas, "Wir messen. Wie breit ist das Sofa?", "Let's measure. How wide is the sofa?", "لنقِس. كم عرض الأريكة؟", "Да мериме. Колку е широк каучот?"]
  - [protagonist, "Zwei Meter zwanzig.", "Two metres twenty.", "متران وعشرون.", "Два метри и дваесет."]
  - [jonas, "Und die Wand? Zwei Meter zehn.", "And the wall? Two metres ten.", "والحائط؟ متران وعشرة.", "А ѕидот? Два метри и десет."]
  - [protagonist, "Zehn Zentimeter zu lang!", "Ten centimetres too long!", "أطول بعشرة سنتيمترات!", "Десет сантиметри подолг!"]
  - [jonas, "Und in der Ecke?", "And in the corner?", "وفي الزاوية؟", "А во аголот?"]
  - [protagonist, "Nein, das Sofa ist eckig, die Ecke ist rund.", "No, the sofa is square, the corner is round.", "لا، الأريكة مربّعة، والزاوية مستديرة.", "Не, каучот е аглест, аголот е заоблен."]
  - [jonas, "Genau. Das Sofa ist zu groß.", "Exactly. The sofa is too big.", "بالضبط. الأريكة كبيرة جدًا.", "Точно. Каучот е преголем."]
  - [protagonist, "Dann kaufe ich ein kleines Sofa.", "Then I'll buy a small sofa.", "إذن سأشتري أريكة صغيرة.", "Тогаш ќе купам мал кауч."]
teach:
  - ask: ["Ask: will the sofa fit here?", "اسألي: هل تتسع الأريكة هنا؟", "Прашајте: ќе собере ли каучот тука?", "Passt das Sofa hier?", das-sofa, passt]
  - ask: ["He says: let's measure.", "يقول: لنقِس.", "Тој вели: да мериме.", "Wir messen.", messen]
  - ask: ["Ask: how wide is the sofa?", "اسألي: كم عرض الأريكة؟", "Прашајте: колку е широк каучот?", "Wie breit ist das Sofa?", wie-breit]
  - note: ["Numbers 21 to 99 are said backwards: «zweiundzwanzig» — two-and-twenty. Measurements: «zwei Meter zwanzig», two metres twenty.", "الأعداد من 21 إلى 99 تُقال بالعكس: «zweiundzwanzig» — اثنان وعشرون. والقياسات: «zwei Meter zwanzig»، متران وعشرون.", "Броевите од 21 до 99 се кажуваат обратно: «zweiundzwanzig» — два и дваесет. Мерки: «zwei Meter zwanzig», два метри и дваесет."]
  - ask: ["Say: two metres twenty.", "قولي: متران وعشرون.", "Кажете: два метри и дваесет.", "Zwei Meter zwanzig.", meter]
  - ask: ["Say: ten centimetres too long!", "قولي: أطول بعشرة سنتيمترات!", "Кажете: десет сантиметри подолг!", "Zehn Zentimeter zu lang!", zentimeter, lang]
  - ask: ["Ask: and in the corner?", "اسألي: وفي الزاوية؟", "Прашајте: а во аголот?", "Und in der Ecke?", die-ecke]
  - ask: ["Say: the sofa is square, the corner is round.", "قولي: الأريكة مربّعة، والزاوية مستديرة.", "Кажете: каучот е аглест, аголот е заоблен.", "Das Sofa ist eckig, die Ecke ist rund.", eckig, rund]
  - ask: ["He says: exactly.", "يقول: بالضبط.", "Тој вели: точно.", "Genau.", genau]
  - ask: ["Say: the sofa is too big.", "قولي: الأريكة كبيرة جدًا.", "Кажете: каучот е преголем.", "Das Sofa ist zu groß.", zu-gross]
  - ask: ["Say: then I'll buy a small sofa.", "قولي: إذن سأشتري أريكة صغيرة.", "Кажете: тогаш ќе купам мал кауч.", "Dann kaufe ich ein kleines Sofa.", klein]
