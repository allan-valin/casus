id: B1-28
protagonist: m
title: ["The tournament", "البطولة", "Турнирот"]
situation:
  - "The club tournament in May. You helped all day. In the evening Petra asks how it went."
  - "بطولة النادي في مايو. ساعدت طوال اليوم. في المساء تسألك بيترا كيف جرى الأمر."
  - "Клупскиот турнир во мај. Помагавте цел ден. Навечер Петра прашува како помина."
learn: [b1-praeteritum]
culture: —
items:
  - [der-schiedsrichter, "der Schiedsrichter", "the referee", "الحَكَم", "судијата"]
  - [das-finale, "das Finale", "the final", "المباراة النهائية", "финалето"]
  - [der-pokal, "der Pokal", "the cup, trophy", "الكأس", "пехарот"]
  - [pfiff, "pfiff", "blew the whistle", "صفّر", "свирна"]
  - [lief, "lief", "ran, went", "جرى، سار", "течеше"]
  - [stand, "stand", "stood", "وقف", "стоеше"]
  - [der-elfmeter, "der Elfmeter", "the penalty", "ضربة الجزاء", "пенал"]
  - [das-kuchenbuffet, "das Kuchenbuffet", "the cake stall", "طاولة الكعك", "шведската маса со колачи", {rare: true}]
  - [der-helfer, "die Helfer", "the helpers", "المساعدون", "помагачите"]
  - [die-siegerehrung, "die Siegerehrung", "the award ceremony", "تتويج الفائزين", "доделувањето награди", {rare: true}]
dialogue:
  - [petra, "Na, wie lief das Turnier?", "So, how did the tournament go?", "إذن، كيف جرت البطولة؟", "Па, како помина турнирот?"]
  - [protagonist, "Super! Ich stand den ganzen Tag am Kuchenbuffet. Um drei war alles ausverkauft.", "Great! I stood at the cake stall all day. By three everything was sold out.", "رائعة! وقفتُ طوال اليوم عند طاولة الكعك. في الثالثة نفد كل شيء.", "Супер! Цел ден стоев кај колачите. До три сè беше распродадено."]
  - [petra, "Und das Finale?", "And the final?", "والمباراة النهائية؟", "А финалето?"]
  - [protagonist, "Spannend! Es stand eins zu eins. Dann pfiff der Schiedsrichter Elfmeter.", "Exciting! It was one-all. Then the referee gave a penalty.", "مثيرة! كانت النتيجة واحد لواحد. ثم صفّر الحَكَم ضربة جزاء.", "Возбудливо! Беше еден спрема еден. Потоа судијата свирна пенал."]
  - [petra, "Für uns?", "For us?", "لصالحنا؟", "За нас?"]
  - [protagonist, "Für uns! Und Ali schoss ihn rein. Bei der Siegerehrung bekamen wir den Pokal.", "For us! And Ali scored it. At the award ceremony we got the cup.", "لصالحنا! وسجّلها علي. وفي تتويج الفائزين حصلنا على الكأس.", "За нас! И Али го постигна. На доделувањето награди го добивме пехарот."]
  - [petra, "Toll! Ohne die Helfer gäbe es kein Turnier. Danke dir.", "Brilliant! Without the helpers there'd be no tournament. Thank you.", "رائع! بدون المساعدين ما كانت هناك بطولة. شكرًا لك.", "Одлично! Без помагачите немаше да има турнир. Ти благодарам."]
  - [protagonist, "Gern. Nächstes Jahr backe ich selbst einen Kuchen!", "My pleasure. Next year I'll bake a cake myself!", "بكل سرور. السنة القادمة سأخبز كعكة بنفسي!", "Со задоволство. Следната година самиот ќе испечам колач!"]
teach:
  - ask: ["She asks: how did it go?", "تسأل: كيف جرى الأمر؟", "Таа прашува: како помина?", "Wie lief das Turnier?", lief]
  - ask: ["Say: I stood at the cake stall all day.", "قل: وقفتُ طوال اليوم عند طاولة الكعك.", "Кажете: цел ден стоев кај колачите.", "Ich stand den ganzen Tag am Kuchenbuffet.", stand, das-kuchenbuffet]
  - ask: ["Say: everything was sold out.", "قل: نفد كل شيء.", "Кажете: сè беше распродадено.", "Alles war ausverkauft.", ausverkauft]
  - ask: ["Say: the final.", "قل: المباراة النهائية.", "Кажете: финалето.", "Das Finale.", das-finale]
  - ask: ["Say: the referee gave a penalty.", "قل: صفّر الحَكَم ضربة جزاء.", "Кажете: судијата свирна пенал.", "Der Schiedsrichter pfiff Elfmeter.", der-schiedsrichter, pfiff, der-elfmeter]
  - ask: ["Say: at the award ceremony.", "قل: في تتويج الفائزين.", "Кажете: на доделувањето награди.", "Bei der Siegerehrung.", die-siegerehrung]
  - ask: ["Say: we got the cup.", "قل: حصلنا على الكأس.", "Кажете: го добивме пехарот.", "Wir bekamen den Pokal.", der-pokal]
  - ask: ["Say: next year I'll bake a cake myself.", "قل: السنة القادمة سأخبز كعكة بنفسي.", "Кажете: следната година самиот ќе испечам колач.", "Nächstes Jahr backe ich selbst einen Kuchen.", das-turnier]
  - ask: ["She says: without the helpers there'd be no tournament.", "تقول: بدون المساعدين ما كانت هناك بطولة.", "Таа вели: без помагачите немаше да има турнир.", "Ohne die Helfer gäbe es kein Turnier.", der-helfer]
  - note: ["Strong verbs in the simple past: «laufen — lief», «stehen — stand», «pfeifen — pfiff», «bekommen — bekam», «schießen — schoss». Telling the day afterwards, Germans mix them with the perfect.", "الأفعال القوية في الماضي البسيط: «laufen — lief»، «stehen — stand»، «pfeifen — pfiff»، «bekommen — bekam»، «schießen — schoss». وعند حكاية اليوم بعده يمزج الألمان بينها وبين التام.", "Силни глаголи во простото минато: «laufen — lief», «stehen — stand», «pfeifen — pfiff», «bekommen — bekam», «schießen — schoss». Кога раскажуваат за денот, Германците ги мешаат со перфектот."]
