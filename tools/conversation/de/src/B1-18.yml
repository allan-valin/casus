id: B1-18
protagonist: m
title: ["Freedom", "الحرية", "Слобода"]
situation:
  - "A VHS evening on the Grundgesetz, Germany's constitution. Professor Hartmann reads Article 1."
  - "أمسية في الجامعة الشعبية عن القانون الأساسي، دستور ألمانيا. البروفيسور هارتمان يقرأ المادة الأولى."
  - "Вечер на народниот универзитет за Основниот закон, германскиот устав. Професорот Хартман го чита член 1."
learn: [b1-konjunktiv-ii-past]
culture: The Basic Law
items:
  - [das-grundgesetz, "das Grundgesetz", "the Basic Law (constitution)", "القانون الأساسي", "Основниот закон"]
  - [die-wuerde, "die Würde", "dignity", "الكرامة", "достоинството"]
  - [unantastbar, "unantastbar", "inviolable", "لا تُمسّ", "неприкосновено", {rare: true}]
  - [das-recht-auf, "das Recht auf …", "the right to …", "الحق في …", "правото на …"]
  - [die-meinungsfreiheit, "die Meinungsfreiheit", "freedom of expression", "حرية الرأي", "слободата на мислење"]
  - [haette-gedacht, "hätte gedacht", "would have thought", "كنتُ سأظن", "би помислил"]
  - [waere-gewesen, "wäre gewesen", "would have been", "كان سيكون", "ќе беше"]
  - [wenn-ich-gewusst-haette, "wenn ich gewusst hätte", "if I had known", "لو كنتُ أعرف", "да знаев"]
  - [kritisieren, "kritisieren", "criticise", "ينتقد", "критикува"]
  - [die-regierung, "die Regierung", "the government", "الحكومة", "владата"]
  - [nach-dem-krieg, "nach dem Krieg", "after the war", "بعد الحرب", "по војната"]
dialogue:
  - [hartmann, "Artikel eins: Die Würde des Menschen ist unantastbar.", "Article one: Human dignity is inviolable.", "المادة الأولى: كرامة الإنسان لا تُمسّ.", "Член еден: Достоинството на човекот е неприкосновено."]
  - [protagonist, "Warum steht das ganz am Anfang?", "Why is that right at the beginning?", "لماذا هذا في البداية تمامًا؟", "Зошто тоа е на самиот почеток?"]
  - [hartmann, "Das Grundgesetz wurde 1949 geschrieben, nach dem Krieg und der Diktatur.", "The Basic Law was written in 1949, after the war and the dictatorship.", "كُتب القانون الأساسي عام 1949، بعد الحرب والديكتاتورية.", "Основниот закон е напишан во 1949, по војната и диктатурата."]
  - [protagonist, "Und Artikel fünf ist die Meinungsfreiheit?", "And Article five is freedom of expression?", "والمادة الخامسة هي حرية الرأي؟", "А член пет е слободата на мислење?"]
  - [hartmann, "Genau. Jeder darf die Regierung kritisieren.", "Exactly. Everyone may criticise the government.", "بالضبط. يحق لكل أحد أن ينتقد الحكومة.", "Точно. Секој смее да ја критикува владата."]
  - [protagonist, "Das hätte ich früher nicht gedacht. Bei uns wäre das gefährlich gewesen.", "I wouldn't have thought that before. Where I'm from that would have been dangerous.", "ما كنتُ لأظن ذلك من قبل. عندنا كان ذلك سيكون خطرًا.", "Порано не би помислил така. Кај нас тоа ќе беше опасно."]
  - [hartmann, "Aber auch hier gibt es Grenzen: Beleidigung und Hetze sind verboten.", "But here too there are limits: insults and incitement are forbidden.", "لكن هنا أيضًا حدود: الإهانة والتحريض ممنوعان.", "Но и тука има граници: навредата и поттикнувањето омраза се забранети."]
  - [protagonist, "Wenn ich das früher gewusst hätte, wäre ich früher gekommen!", "If I'd known that earlier, I'd have come sooner!", "لو كنتُ أعرف ذلك من قبل، لجئتُ أبكر!", "Да го знаев тоа порано, ќе дојдев порано!"]
teach:
  - ask: ["Say: human dignity is inviolable.", "قل: كرامة الإنسان لا تُمسّ.", "Кажете: достоинството на човекот е неприкосновено.", "Die Würde des Menschen ist unantastbar.", die-wuerde, unantastbar]
  - ask: ["Say: the Basic Law.", "قل: القانون الأساسي.", "Кажете: Основниот закон.", "Das Grundgesetz.", das-grundgesetz]
  - ask: ["Say: after the war.", "قل: بعد الحرب.", "Кажете: по војната.", "Nach dem Krieg.", nach-dem-krieg]
  - ask: ["Say: freedom of expression.", "قل: حرية الرأي.", "Кажете: слободата на мислење.", "Die Meinungsfreiheit.", die-meinungsfreiheit]
  - ask: ["Say: everyone may criticise the government.", "قل: يحق لكل أحد أن ينتقد الحكومة.", "Кажете: секој смее да ја критикува владата.", "Jeder darf die Regierung kritisieren.", kritisieren, die-regierung]
  - note: ["For the past, Konjunktiv II uses «hätte» or «wäre» + participle: «Das hätte ich nicht gedacht» (I wouldn't have thought), «Das wäre gefährlich gewesen» (that would have been dangerous).", "للماضي، صيغة التمني تستعمل «hätte» أو «wäre» مع اسم المفعول: «Das hätte ich nicht gedacht» (ما كنتُ لأظن)، «Das wäre gefährlich gewesen» (كان ذلك سيكون خطرًا).", "За минатото, Konjunktiv II користи «hätte» или «wäre» + партицип: «Das hätte ich nicht gedacht» (не би помислил), «Das wäre gefährlich gewesen» (тоа ќе беше опасно)."]
  - ask: ["Say: I wouldn't have thought that.", "قل: ما كنتُ لأظن ذلك.", "Кажете: не би помислил така.", "Das hätte ich nicht gedacht.", haette-gedacht]
  - ask: ["Say: that would have been dangerous.", "قل: كان ذلك سيكون خطرًا.", "Кажете: тоа ќе беше опасно.", "Das wäre gefährlich gewesen.", waere-gewesen]
  - ask: ["Say: if I'd known that…", "قل: لو كنتُ أعرف ذلك…", "Кажете: да го знаев тоа…", "Wenn ich das gewusst hätte…", wenn-ich-gewusst-haette]
  - ask: ["Say: the right to freedom of expression.", "قل: الحق في حرية الرأي.", "Кажете: правото на слобода на мислење.", "Das Recht auf Meinungsfreiheit.", das-recht-auf]
  - note: ["The Basic Law (1949) begins with human dignity because it was written after the Nazi dictatorship. It guarantees free speech and the right to criticise those in power — with limits: insult, threats and incitement to hatred are crimes.", "القانون الأساسي (1949) يبدأ بكرامة الإنسان لأنه كُتب بعد الديكتاتورية النازية. وهو يضمن حرية التعبير وحق انتقاد السلطة — ضمن حدود: الإهانة والتهديد والتحريض على الكراهية جرائم.", "Основниот закон (1949) почнува со човековото достоинство затоа што е напишан по нацистичката диктатура. Ја гарантира слободата на говорот и правото да се критикува власта — со граници: навредата, заканите и поттикнувањето омраза се кривични дела."]
