id: C2-06
protagonist: m
title: ["Cabaret", "الكباريه السياسي", "Кабаре"]
situation:
  - "Jonas takes you to the Pfeffermühle, Leipzig's famous political cabaret. Afterwards, over beer, he explains the jokes you missed."
  - "يوناس يأخذك إلى «Pfeffermühle»، الكباريه السياسي الشهير في لايبزيغ. بعدها، على البيرة، يشرح لك النكات التي فاتتك."
  - "Јонас ве води во Pfeffermühle, познатото политичко кабаре во Лајпциг. Потоа, на пиво, ви ги објаснува шегите што ви промакнале."
learn: []
learn_missing: [wordplay]
culture: Political cabaret
items:
  - [das-kabarett, "das Kabarett", "political cabaret", "الكباريه السياسي", "кабарето"]
  - [die-satire, "die Satire", "satire", "الهجاء الساخر", "сатирата"]
  - [der-kabarettist, "die Kabarettistin", "the cabaret artist (f)", "فنانة الكباريه", "кабаретската уметница", {rare: true}]
  - [doppeldeutig, "doppeldeutig", "ambiguous, double meaning", "ذو معنيين", "двосмислено"]
  - [auf-die-schippe-nehmen, "auf die Schippe nehmen", "make fun of, pull someone's leg", "يسخر من", "зафркава"]
  - [der-seitenhieb, "der Seitenhieb", "a dig, a jibe", "غمزة لاذعة", "боцкањето"]
  - [schwarzer-humor, "schwarzer Humor", "black humour", "الفكاهة السوداء", "црниот хумор"]
  - [der-zug-faellt-aus, "Der Zug fällt aus", "The train is cancelled", "القطار أُلغي", "Возот е откажан"]
  - [die-anspielung, "die Anspielung", "the allusion", "التلميح", "алузијата"]
  - [wer-a-sagt, "Wer A sagt, muss nicht B sagen", "Whoever says A needn't say B", "من قال ألف لا يلزمه أن يقول باء", "Кој кажал А, не мора да каже Б"]
dialogue:
  - [protagonist, "Alle haben gelacht, als sie „Die Bahn ist pünktlich“ sagte. Warum?", "Everyone laughed when she said 'The trains are on time'. Why?", "ضحك الجميع حين قالت «القطارات في موعدها». لماذا؟", "Сите се насмеаја кога рече „Возовите се точни“. Зошто?"]
  - [jonas, "Das ist Satire. Jeder weiß: Der Zug fällt aus. Sie meint das Gegenteil.", "That's satire. Everyone knows: the train is cancelled. She means the opposite.", "هذا هجاء ساخر. الكل يعرف: القطار أُلغي. تقصد العكس.", "Тоа е сатира. Сите знаат: возот е откажан. Таа мисли спротивно."]
  - [protagonist, "Und der Satz über den Minister und das „schwarze Loch“?", "And the line about the minister and the 'black hole'?", "والجملة عن الوزير و«الثقب الأسود»؟", "А реченицата за министерот и „црната дупка“?"]
  - [jonas, "Doppeldeutig: das Loch im Haushalt und das im Kopf. Ein Seitenhieb.", "Double meaning: the hole in the budget and the one in his head. A dig.", "ذو معنيين: الثقب في الميزانية والثقب في رأسه. غمزة لاذعة.", "Двосмислено: дупката во буџетот и онаа во главата. Боцкање."]
  - [protagonist, "Sie nehmen ja alle auf die Schippe — sogar den Kanzler!", "They make fun of everyone — even the chancellor!", "إنهم يسخرون من الجميع — حتى المستشار!", "Тие ги зафркаваат сите — дури и канцеларот!"]
  - [jonas, "Gerade den. Das ist Kabarett. Und am Ende das Brecht-Zitat: „Wer A sagt, der muss nicht B sagen.“", "Him above all. That's cabaret. And at the end the Brecht quote: 'Whoever says A needn't say B.'", "هو بالذات. هذا هو الكباريه. وفي النهاية اقتباس بريشت: «من قال ألف لا يلزمه أن يقول باء.»", "Токму него. Тоа е кабаре. А на крајот цитатот од Брехт: „Кој кажал А, не мора да каже Б.“"]
  - [protagonist, "„Er kann auch erkennen, dass A falsch war.“ Das kannte ich!", "'He can also recognise that A was wrong.' I knew that one!", "«بل يمكنه أن يدرك أنّ ألف كانت خطأ.» هذه أعرفها!", "„Може и да сфати дека А било погрешно.“ Тоа го знаев!"]
  - [jonas, "Dann verstehst du jetzt auch die Anspielungen. Willkommen im schwarzen Humor!", "Then you get the allusions now too. Welcome to black humour!", "إذن تفهم الآن التلميحات أيضًا. أهلًا بك في الفكاهة السوداء!", "Тогаш сега ги разбираш и алузиите. Добредојде во црниот хумор!"]
teach:
  - ask: ["Say: political cabaret.", "قل: الكباريه السياسي.", "Кажете: политичко кабаре.", "Das Kabarett.", das-kabarett]
  - ask: ["Say: that's satire.", "قل: هذا هجاء ساخر.", "Кажете: тоа е сатира.", "Das ist Satire.", die-satire]
  - ask: ["Say: the train is cancelled.", "قل: القطار أُلغي.", "Кажете: возот е откажан.", "Der Zug fällt aus.", der-zug-faellt-aus]
  - note: ["Wordplay works through double meanings («doppeldeutig»: the hole in the budget / in the head), allusion («Anspielung») and turning a familiar saying round: «Wer A sagt, muss B sagen» becomes Brecht's «…muss nicht B sagen».", "التلاعب بالألفاظ يقوم على المعنيين («doppeldeutig»: الثقب في الميزانية / في الرأس)، والتلميح («Anspielung»)، وقلب قول مألوف: «Wer A sagt, muss B sagen» يصبح عند بريشت «…muss nicht B sagen».", "Играта со зборови работи преку двојни значења («doppeldeutig»: дупката во буџетот / во главата), алузија («Anspielung») и превртување на позната изрека: «Wer A sagt, muss B sagen» станува Брехтовото «…muss nicht B sagen»."]
  - ask: ["Say: a double meaning.", "قل: ذو معنيين.", "Кажете: двосмислено.", "Doppeldeutig.", doppeldeutig]
  - ask: ["Say: a dig.", "قل: غمزة لاذعة.", "Кажете: боцкање.", "Ein Seitenhieb.", der-seitenhieb]
  - ask: ["Say: they make fun of everyone.", "قل: يسخرون من الجميع.", "Кажете: ги зафркаваат сите.", "Sie nehmen alle auf die Schippe.", auf-die-schippe-nehmen]
  - ask: ["Quote Brecht.", "اقتبس بريشت.", "Цитирајте го Брехт.", "Wer A sagt, muss nicht B sagen.", wer-a-sagt]
  - ask: ["Say: the allusions.", "قل: التلميحات.", "Кажете: алузиите.", "Die Anspielungen.", die-anspielung]
  - ask: ["Say: black humour.", "قل: الفكاهة السوداء.", "Кажете: црн хумор.", "Schwarzer Humor.", schwarzer-humor]
  - ask: ["Say: the cabaret artist.", "قل: فنانة الكباريه.", "Кажете: кабаретската уметница.", "Die Kabarettistin.", der-kabarettist]
  - note: ["German Kabarett is political satire on stage: nobody is spared, least of all the government. Leipzig's Pfeffermühle, founded in GDR times, still plays nightly. Understanding cabaret jokes — the allusions to the news, the twisted sayings — is one of the last steps to C2.", "الكباريه الألماني هجاء سياسي على المسرح: لا أحد ينجو، والحكومة أولًا. و«Pfeffermühle» في لايبزيغ، التي تأسّست في زمن ألمانيا الشرقية، ما زالت تعرض كل ليلة. وفهم نكات الكباريه — التلميحات إلى الأخبار والأقوال المقلوبة — من آخر خطوات الوصول إلى C2.", "Германското кабаре е политичка сатира на сцена: никој не е поштеден, најмалку владата. Pfeffermühle во Лајпциг, основана во времето на ГДР, и денес игра секоја вечер. Разбирањето на кабаретските шеги — алузиите на вестите, превртените изреки — е еден од последните чекори до C2."]
