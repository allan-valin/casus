id: C2-22
protagonist: m
title: ["What is Heimat?", "ما هو الوطن؟", "Што е Heimat?"]
situation:
  - "A VHS debate evening: 'Heimat — a place or a feeling?' Lena says place. You argue: feeling."
  - "أمسية نقاش في الجامعة الشعبية: «الوطن — مكان أم شعور؟» لينا تقول مكان. وأنت تجادل: شعور."
  - "Вечер на дебата на народниот универзитет: „Heimat — место или чувство?“ Лена вели место. Вие тврдите: чувство."
learn: [c2-abstract-nouns]
culture: An untranslatable word
items:
  - [die-zugehoerigkeit, "die Zugehörigkeit", "belonging", "الانتماء", "припадноста"]
  - [die-identitaet, "die Identität", "identity", "الهوية", "идентитетот"]
  - [die-geborgenheit, "die Geborgenheit", "a sense of safety and warmth", "الشعور بالأمان والدفء", "чувството на сигурност и топлина", {rare: true}]
  - [die-verwurzelung, "die Verwurzelung", "rootedness", "التجذّر", "вкоренетоста", {rare: true}]
  - [unuebersetzbar, "unübersetzbar", "untranslatable", "غير قابل للترجمة", "непреводливо"]
  - [die-herkunft, "die Herkunft", "origin", "الأصل", "потеклото"]
  - [frage-der-wahl, "eine Frage der Wahl", "a matter of choice", "مسألة اختيار", "прашање на избор"]
  - [das-gefuehl, "ein Gefühl, kein Ort", "a feeling, not a place", "شعور لا مكان", "чувство, не место"]
  - [die-sprache-als-heimat, "die Sprache als Heimat", "language as home", "اللغة وطنًا", "јазикот како дом"]
  - [die-mehrfachzugehoerigkeit, "mehrere Heimaten", "several homelands", "أوطان متعدّدة", "повеќе татковини"]
dialogue:
  - [hartmann, "„Heimat“ gilt als unübersetzbar. Ist sie ein Ort oder ein Gefühl?", "'Heimat' is considered untranslatable. Is it a place or a feeling?", "تُعدّ كلمة «Heimat» غير قابلة للترجمة. هل هي مكان أم شعور؟", "„Heimat“ важи за непреводлива. Дали е место или чувство?"]
  - [lena, "Ein Ort. Heimat ist Herkunft — die Landschaft, der Dialekt, die Verwurzelung.", "A place. Heimat is origin — the landscape, the dialect, rootedness.", "مكان. الوطن هو الأصل — المشهد الطبيعي، اللهجة، التجذّر.", "Место. Heimat е потекло — пејзажот, дијалектот, вкоренетоста."]
  - [protagonist, "Da widerspreche ich. Heimat ist ein Gefühl, kein Ort: Geborgenheit und Zugehörigkeit.", "I disagree. Heimat is a feeling, not a place: safety and belonging.", "هنا أعترض. الوطن شعور لا مكان: أمان وانتماء.", "Тука не се согласувам. Heimat е чувство, не место: сигурност и припадност."]
  - [lena, "Aber deine Identität kommt doch von dort, wo du geboren bist.", "But your identity surely comes from where you were born.", "لكن هويتك تأتي بالتأكيد من حيث وُلدت.", "Но твојот идентитет сепак доаѓа од таму каде што си роден."]
  - [protagonist, "Auch. Aber Zugehörigkeit kann man finden — sie ist auch eine Frage der Wahl.", "That too. But belonging can be found — it's also a matter of choice.", "وكذلك. لكن الانتماء يمكن إيجاده — إنه أيضًا مسألة اختيار.", "И тоа. Но припадноста може да се најде — таа е и прашање на избор."]
  - [hartmann, "Und welche Rolle spielt die Sprache?", "And what role does language play?", "وما دور اللغة؟", "А каква улога игра јазикот?"]
  - [protagonist, "Für viele ist die Sprache Heimat. Ich habe inzwischen zwei — also mehrere Heimaten.", "For many, language is home. I now have two — so several homelands.", "للكثيرين اللغة هي الوطن. لديّ الآن اثنتان — إذن أوطان متعدّدة.", "За многумина јазикот е дом. Јас сега имам два — значи повеќе татковини."]
  - [hartmann, "Ein schöner Gedanke: Heimat im Plural. Das Publikum stimmt ab!", "A beautiful thought: Heimat in the plural. The audience votes!", "فكرة جميلة: الوطن بصيغة الجمع. الجمهور يصوّت!", "Убава мисла: Heimat во множина. Публиката гласа!"]
teach:
  - ask: ["Say: Heimat is considered untranslatable.", "قل: تُعدّ Heimat غير قابلة للترجمة.", "Кажете: Heimat важи за непреводлива.", "Heimat gilt als unübersetzbar.", unuebersetzbar]
  - ask: ["Say: origin and rootedness.", "قل: الأصل والتجذّر.", "Кажете: потекло и вкоренетост.", "Herkunft und Verwurzelung.", die-herkunft, die-verwurzelung]
  - note: ["Abstract nouns carry the debate: «die Zugehörigkeit» (belonging), «die Geborgenheit» (safety and warmth — hard to translate), «die Identität», «die Verwurzelung». Most end in -heit, -keit, -ung or -ität and are feminine.", "الأسماء المجرّدة تحمل النقاش: «die Zugehörigkeit» (الانتماء)، «die Geborgenheit» (الأمان والدفء — صعبة الترجمة)، «die Identität»، «die Verwurzelung». ومعظمها ينتهي بـ -heit أو -keit أو -ung أو -ität وهي مؤنثة.", "Апстрактните именки ја носат дебатата: «die Zugehörigkeit» (припадност), «die Geborgenheit» (сигурност и топлина — тешко преводливо), «die Identität», «die Verwurzelung». Повеќето завршуваат на -heit, -keit, -ung или -ität и се од женски род."]
  - ask: ["Say: a feeling, not a place.", "قل: شعور لا مكان.", "Кажете: чувство, не место.", "Ein Gefühl, kein Ort.", das-gefuehl]
  - ask: ["Say: safety and belonging.", "قل: أمان وانتماء.", "Кажете: сигурност и припадност.", "Geborgenheit und Zugehörigkeit.", die-geborgenheit, die-zugehoerigkeit]
  - ask: ["Say: identity.", "قل: الهوية.", "Кажете: идентитетот.", "Die Identität.", die-identitaet]
  - ask: ["Say: it's also a matter of choice.", "قل: إنه أيضًا مسألة اختيار.", "Кажете: тоа е и прашање на избор.", "Sie ist auch eine Frage der Wahl.", frage-der-wahl]
  - ask: ["Say: language as home.", "قل: اللغة وطنًا.", "Кажете: јазикот како дом.", "Die Sprache als Heimat.", die-sprache-als-heimat]
  - ask: ["Say: several homelands.", "قل: أوطان متعدّدة.", "Кажете: повеќе татковини.", "Mehrere Heimaten.", die-mehrfachzugehoerigkeit]
  - note: ["«Heimat» mixes place, childhood, language and belonging — and has a political history, from Romantic longing to Nazi misuse to today's debates about who belongs. The plural «Heimaten» used to be rare; many people with two homes now use it on purpose.", "كلمة «Heimat» تمزج المكان والطفولة واللغة والانتماء — ولها تاريخ سياسي، من حنين الرومانسية إلى إساءة النازيين إلى نقاشات اليوم حول من ينتمي. وصيغة الجمع «Heimaten» كانت نادرة؛ واليوم يستعملها عمدًا كثيرون ممن لهم بيتان.", "„Heimat“ меша место, детство, јазик и припадност — и има политичка историја, од романтичарскиот копнеж преку нацистичката злоупотреба до денешните дебати за тоа кој припаѓа. Множината „Heimaten“ порано беше ретка; многумина со два дома сега намерно ја користат."]
