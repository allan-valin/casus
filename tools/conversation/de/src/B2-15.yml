id: B2-15
protagonist: m
title: ["Truth", "الحقيقة", "Вистина"]
situation:
  - "Paul shows you a post: 'Migrants get free flats!' Shared ten thousand times. You check it together."
  - "باول يريك منشورًا: «المهاجرون يحصلون على شقق مجانية!» شُورك عشرة آلاف مرة. تتحقّقان منه معًا."
  - "Паул ви покажува објава: „Мигрантите добиваат бесплатни станови!“ Споделена десет илјади пати. Заедно ја проверувате."
learn: [de-b2-nicht-nur, de-con_04]
culture: Checking a claim
items:
  - [die-behauptung, "die Behauptung", "the claim", "الادّعاء", "тврдењето"]
  - [der-beweis, "der Beweis", "the proof", "الدليل", "доказот"]
  - [die-falschmeldung, "die Falschmeldung", "fake news", "الخبر الكاذب", "лажната вест", {rare: true}]
  - [ueberpruefen, "überprüfen", "check, verify", "يتحقّق", "проверува"]
  - [zwar-aber, "zwar … aber", "admittedly … but", "صحيح أنّ … لكن", "иако … сепак"]
  - [trotzdem, "trotzdem", "nevertheless", "مع ذلك", "сепак"]
  - [auch-wenn, "auch wenn", "even if", "حتى لو", "дури и ако"]
  - [teilen, "teilen", "share", "يشارك", "споделува"]
  - [der-faktencheck, "der Faktencheck", "the fact check", "التحقّق من الحقائق", "проверката на факти", {rare: true}]
  - [die-hetze, "die Hetze", "incitement, hate campaign", "التحريض", "поттикнувањето омраза"]
dialogue:
  - [paul, "Schau mal: „Migranten bekommen kostenlose Wohnungen!“ Zehntausend Mal geteilt.", "Look: 'Migrants get free flats!' Shared ten thousand times.", "انظر: «المهاجرون يحصلون على شقق مجانية!» شُورك عشرة آلاف مرة.", "Види: „Мигрантите добиваат бесплатни станови!“ Споделено десет илјади пати."]
  - [protagonist, "Das ist eine Behauptung. Wo ist der Beweis?", "That's a claim. Where's the proof?", "هذا ادّعاء. أين الدليل؟", "Тоа е тврдење. Каде е доказот?"]
  - [paul, "Es gibt zwar keine Quelle, aber so viele Leute teilen es!", "Admittedly there's no source, but so many people are sharing it!", "صحيح أنه لا يوجد مصدر، لكن كثيرين يشاركونه!", "Иако нема извор, сепак толку многу луѓе го споделуваат!"]
  - [protagonist, "Auch wenn es eine Million teilen — es bleibt falsch, wenn es falsch ist.", "Even if a million share it — it stays false if it's false.", "حتى لو شاركه مليون — يبقى كاذبًا إن كان كاذبًا.", "Дури и ако го споделат милион — останува лажно ако е лажно."]
  - [paul, "Okay. Wie überprüfen wir das?", "OK. How do we check it?", "حسنًا. كيف نتحقّق منه؟", "Добро. Како да го провериме?"]
  - [protagonist, "Mit einem Faktencheck. ... Hier: Falschmeldung. Ich kenne niemanden mit einer kostenlosen Wohnung.", "With a fact check. ... Here: fake news. I don't know anyone with a free flat.", "بالتحقّق من الحقائق. ... هنا: خبر كاذب. لا أعرف أحدًا لديه شقة مجانية.", "Со проверка на факти. ... Еве: лажна вест. Не познавам никого со бесплатен стан."]
  - [paul, "Trotzdem glauben es viele.", "Nevertheless many believe it.", "مع ذلك يصدّقه كثيرون.", "Сепак многумина веруваат."]
  - [protagonist, "Weil es Hetze ist. Sie macht Angst und Wut — und das teilt man schnell.", "Because it's a hate campaign. It creates fear and anger — and people share that fast.", "لأنه تحريض. يثير الخوف والغضب — وهذا ما يشاركه الناس بسرعة.", "Затоа што е поттикнување омраза. Создава страв и бес — а тоа брзо се споделува."]
teach:
  - ask: ["Say: that's a claim.", "قل: هذا ادّعاء.", "Кажете: тоа е тврдење.", "Das ist eine Behauptung.", die-behauptung]
  - ask: ["Ask: where's the proof?", "اسأل: أين الدليل؟", "Прашајте: каде е доказот?", "Wo ist der Beweis?", der-beweis]
  - note: ["Conceding a point and still disagreeing: «zwar …, aber …» (admittedly…, but), «trotzdem» (nevertheless, verb right after), «auch wenn» (even if, verb at the end).", "التسليم بنقطة مع الاختلاف: «zwar …, aber …» (صحيح أنّ…، لكن)، «trotzdem» (مع ذلك، والفعل بعدها مباشرة)، «auch wenn» (حتى لو، والفعل في الآخر).", "Признавање на поента и сепак несогласување: «zwar …, aber …» (иако…, сепак), «trotzdem» (сепак, глаголот веднаш потоа), «auch wenn» (дури и ако, глаголот на крајот)."]
  - ask: ["Say: admittedly there's no source, but…", "قل: صحيح أنه لا يوجد مصدر، لكن…", "Кажете: иако нема извор, сепак…", "Es gibt zwar keine Quelle, aber…", zwar-aber]
  - ask: ["Say: even if a million share it.", "قل: حتى لو شاركه مليون.", "Кажете: дури и ако го споделат милион.", "Auch wenn es eine Million teilen.", auch-wenn, teilen]
  - ask: ["Ask: how do we check it?", "اسأل: كيف نتحقّق منه؟", "Прашајте: како да го провериме?", "Wie überprüfen wir das?", ueberpruefen]
  - ask: ["Say: with a fact check.", "قل: بالتحقّق من الحقائق.", "Кажете: со проверка на факти.", "Mit einem Faktencheck.", der-faktencheck]
  - ask: ["Say: fake news.", "قل: خبر كاذب.", "Кажете: лажна вест.", "Eine Falschmeldung.", die-falschmeldung]
  - ask: ["He says: nevertheless many believe it.", "يقول: مع ذلك يصدّقه كثيرون.", "Тој вели: сепак многумина веруваат.", "Trotzdem glauben es viele.", trotzdem]
  - ask: ["Say: it's a hate campaign.", "قل: إنه تحريض.", "Кажете: тоа е поттикнување омраза.", "Es ist Hetze.", die-hetze]
  - note: ["Before sharing, ask: who says it, what's the source, do serious media report it? Public broadcasters and independent fact-check sites test viral claims. Posts that make you angry are built to be shared — that's a reason to slow down.", "قبل المشاركة اسأل: من يقول ذلك، وما المصدر، وهل تنقله وسائل إعلام جادة؟ القنوات العامة ومواقع التحقّق المستقلة تفحص الادّعاءات المنتشرة. والمنشورات التي تُغضبك مصمَّمة لتُشارَك — وهذا سبب للتمهّل.", "Пред да споделите, прашајте: кој го кажува, кој е изворот, дали сериозните медиуми известуваат? Јавните радиодифузери и независни страници за проверка на факти ги тестираат виралните тврдења. Објавите што ве лутат се направени за да се споделуваат — тоа е причина да забавите."]
