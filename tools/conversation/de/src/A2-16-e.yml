id: A2-16-e
tracks: [en]
protagonist: m
title: ["A classmate's baby"]
situation: ["Your classmate Mia had a baby last year — and still studies. You ask how it works."]
learn: [de-vsp_05, de-vsp_04]
culture: Support for student parents
items:
  - [das-baby, "das Baby", "the baby"]
  - [war, "war", "was"]
  - [hatte, "hatte", "had"]
  - [schwer, "schwer", "hard, difficult"]
  - [das-kindergeld, "das Kindergeld", "child benefit"]
  - [der-antrag, "der Antrag", "the application"]
  - [die-familienkasse, "die Familienkasse", "the family benefits office", {rare: true}]
  - [das-urlaubssemester, "das Urlaubssemester", "a semester off", {rare: true}]
  - [die-kita-uni, "die Uni-Kita", "the university nursery"]
  - [unterstuetzung, "die Unterstützung", "support"]
dialogue:
  - [protagonist, "Mia, wie war das letzte Jahr mit dem Baby?", "Mia, how was last year with the baby?"]
  - [mia, "Schwer! Ich hatte wenig Schlaf.", "Hard! I had little sleep."]
  - [protagonist, "Und das Studium?", "And your studies?"]
  - [mia, "Ich hatte ein Urlaubssemester. Jetzt ist die Kleine in der Uni-Kita.", "I took a semester off. Now the little one is in the university nursery."]
  - [protagonist, "Bekommst du Unterstützung?", "Do you get support?"]
  - [mia, "Ja, Kindergeld. Der Antrag war einfach — bei der Familienkasse.", "Yes, child benefit. The application was easy — at the family benefits office."]
  - [protagonist, "Bekommen das auch internationale Studenten?", "Do international students get it too?"]
  - [mia, "Das hängt vom Aufenthaltstitel ab. Frag bei der Familienkasse.", "That depends on the residence permit. Ask at the family benefits office."]
teach:
  - note: ["For 'was' and 'had', German usually uses the simple past even in speech: «war», «hatte». «Wie war das Jahr?» «Ich hatte wenig Schlaf.»"]
  - ask: ["Ask: how was last year with the baby?", "Wie war das letzte Jahr mit dem Baby?", war, das-baby]
  - ask: ["Say for her: hard!", "Schwer!", schwer]
  - ask: ["Say: I had little sleep.", "Ich hatte wenig Schlaf.", hatte]
  - ask: ["Say: a semester off.", "Ein Urlaubssemester.", das-urlaubssemester]
  - ask: ["Say: the university nursery.", "Die Uni-Kita.", die-kita-uni]
  - ask: ["Ask: do you get support?", "Bekommst du Unterstützung?", unterstuetzung]
  - ask: ["Say: child benefit.", "Kindergeld.", das-kindergeld]
  - ask: ["Say: the application was easy.", "Der Antrag war einfach.", der-antrag]
  - ask: ["Say: at the family benefits office.", "Bei der Familienkasse.", die-familienkasse]
  - note: ["Child benefit is paid for children living in Germany; for non-EU parents it depends on the residence permit. Universities offer nurseries, semesters off and counselling for student parents. Rules and amounts change — the Familienkasse decides."]
