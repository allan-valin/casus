id: C1-03-ea
tracks: [en, ar]
protagonist: m
title: ["Naturalisation", "التجنّس"]
situation:
  - "You're thinking about German citizenship. At the naturalisation office an advisor explains — and afterwards you tell Tim what she said."
  - "تفكّر في الجنسية الألمانية. في مكتب التجنيس تشرح مستشارة — وبعدها تحكي لتيم ما قالته."
learn: [c1-konjunktiv-i]
culture: The citizenship test
items:
  - [die-staatsangehoerigkeit, "die Staatsangehörigkeit", "citizenship", "الجنسية"]
  - [die-doppelte-staatsangehoerigkeit, "die doppelte Staatsangehörigkeit", "dual citizenship", "الجنسية المزدوجة", {rare: true}]
  - [die-einbuergerungsbehoerde, "die Einbürgerungsbehörde", "the naturalisation office", "مكتب التجنيس", {rare: true}]
  - [der-fragenkatalog, "der Fragenkatalog", "the question pool", "مجموعة الأسئلة", {rare: true}]
  - [das-bekenntnis, "das Bekenntnis zur Grundordnung", "commitment to the constitutional order", "الالتزام بالنظام الأساسي", {rare: true}]
  - [sie-sagte-man-muesse, "sie sagte, man müsse …", "she said one must …", "قالت إنه يجب …"]
  - [es-sei-moeglich, "es sei möglich", "(reported) it is possible", "(منقولًا) إنه ممكن"]
  - [man-habe, "man habe …", "(reported) one has …", "(منقولًا) إنه لدى المرء …"]
  - [das-studienvisum, "der Aufenthalt zum Studium", "a residence permit for study", "إقامة الدراسة"]
  - [anrechnen, "anrechnen", "count (towards)", "يُحتسب"]
dialogue:
  - [protagonist, "Welche Voraussetzungen gelten für die Einbürgerung?", "What conditions apply for naturalisation?", "ما الشروط المطلوبة للتجنّس؟"]
  - [beraterin, "Mehrere Jahre Aufenthalt, eigenes Einkommen, Deutsch B1, der Einbürgerungstest und das Bekenntnis zur Grundordnung.", "Several years of residence, your own income, German B1, the naturalisation test and a commitment to the constitutional order.", "عدة سنوات من الإقامة، ودخل خاص، وألمانية B1، واختبار التجنّس، والالتزام بالنظام الأساسي."]
  - [protagonist, "Werden meine Studienjahre angerechnet?", "Do my years of study count?", "هل تُحتسب سنوات دراستي؟"]
  - [beraterin, "Teilweise. Aber mit einem Aufenthalt zum Studium können Sie keinen Antrag stellen. Dafür brauchen Sie einen anderen Titel.", "Partly. But with a residence permit for study you can't apply. For that you need a different permit.", "جزئيًا. لكن بإقامة دراسة لا يمكنك تقديم الطلب. لذلك تحتاج إلى إقامة أخرى."]
  - [protagonist, "Und muss ich meinen Pass abgeben?", "And do I have to give up my passport?", "وهل يجب أن أتخلّى عن جوازي؟"]
  - [beraterin, "Nein. Die doppelte Staatsangehörigkeit ist heute erlaubt.", "No. Dual citizenship is allowed today.", "لا. الجنسية المزدوجة مسموحة اليوم."]
  - [tim, "Und? Was hat sie gesagt?", "So? What did she say?", "وماذا؟ ماذا قالت؟"]
  - [protagonist, "Sie sagte, man müsse B1 haben und den Test bestehen. Die doppelte Staatsangehörigkeit sei möglich.", "She said you have to have B1 and pass the test. Dual citizenship is possible.", "قالت إنه يجب أن يكون لدى المرء B1 وأن ينجح في الاختبار. والجنسية المزدوجة ممكنة."]
  - [tim, "Und der Test?", "And the test?", "والاختبار؟"]
  - [protagonist, "Man habe einen festen Fragenkatalog: dreihundert allgemeine Fragen und zehn für das Bundesland.", "There's a fixed question pool: three hundred general questions and ten for the federal state.", "هناك مجموعة أسئلة ثابتة: ثلاثمئة سؤال عام وعشرة خاصة بالولاية."]
teach:
  - ask: ["Say: citizenship.", "قل: الجنسية.", "Die Staatsangehörigkeit.", die-staatsangehoerigkeit]
  - ask: ["Say: the naturalisation office.", "قل: مكتب التجنيس.", "Die Einbürgerungsbehörde.", die-einbuergerungsbehoerde]
  - ask: ["Say: a commitment to the constitutional order.", "قل: الالتزام بالنظام الأساسي.", "Das Bekenntnis zur Grundordnung.", das-bekenntnis]
  - ask: ["Ask: do my years of study count?", "اسأل: هل تُحتسب سنوات دراستي؟", "Werden meine Studienjahre angerechnet?", anrechnen]
  - ask: ["Say: a residence permit for study.", "قل: إقامة دراسة.", "Ein Aufenthalt zum Studium.", das-studienvisum]
  - ask: ["Say: dual citizenship.", "قل: الجنسية المزدوجة.", "Die doppelte Staatsangehörigkeit.", die-doppelte-staatsangehoerigkeit]
  - note: ["Konjunktiv I reports what an official said, without making it your own claim: «Sie sagte, man müsse B1 haben», «die doppelte Staatsangehörigkeit sei möglich», «man habe einen festen Fragenkatalog».", "صيغة Konjunktiv I تنقل ما قاله موظّف دون أن تجعله ادّعاءك: «Sie sagte, man müsse B1 haben»، «die doppelte Staatsangehörigkeit sei möglich»، «man habe einen festen Fragenkatalog»."]
  - ask: ["Report: she said one must have B1.", "انقل: قالت إنه يجب أن يكون لدى المرء B1.", "Sie sagte, man müsse B1 haben.", sie-sagte-man-muesse]
  - ask: ["Report: dual citizenship is possible.", "انقل: الجنسية المزدوجة ممكنة.", "Die doppelte Staatsangehörigkeit sei möglich.", es-sei-moeglich]
  - ask: ["Report: there's a fixed question pool.", "انقل: هناك مجموعة أسئلة ثابتة.", "Man habe einen festen Fragenkatalog.", man-habe, der-fragenkatalog]
  - note: ["Since 2024 Germany allows dual citizenship. Naturalisation needs years of legal residence, your own income, German at B1, the naturalisation test — a fixed public pool of 300 general questions plus 10 for your federal state, practise them online — and a commitment to the constitution. A study permit at the time of applying is not enough. Periods and details change: check the current law.", "منذ 2024 تسمح ألمانيا بالجنسية المزدوجة. والتجنّس يحتاج سنوات من الإقامة القانونية، ودخلًا خاصًا، وألمانية B1، واختبار التجنّس — مجموعة علنية ثابتة من 300 سؤال عام و10 أسئلة لولايتك، تدرّب عليها عبر الإنترنت — والالتزام بالدستور. وإقامة الدراسة وقت تقديم الطلب لا تكفي. المدد والتفاصيل تتغيّر: تحقّق من القانون الحالي."]
