id: C1-02-m
tracks: [mk]
protagonist: f
title: ["Да останеме засекогаш?"]
situation: ["Со мажот размислувате да се преселите во Лајпциг засекогаш. Петар објаснува што значи тоа за граѓани на ЕУ."]
learn: [c1-nominal-style]
culture: Permanent right of residence for EU citizens
items:
  - [das-daueraufenthaltsrecht, "das Daueraufenthaltsrecht", "правото на постојан престој", {rare: true}]
  - [der-wohnsitz, "der Wohnsitz", "живеалиштето"]
  - [die-ummeldung, "die Ummeldung", "пријавувањето на нова адреса", {rare: true}]
  - [ununterbrochen, "ununterbrochen", "без прекин"]
  - [fuenf-jahre, "fünf Jahre", "пет години"]
  - [die-krankenversicherung-m, "die Krankenversicherung", "здравственото осигурување"]
  - [die-auswanderung, "die Auswanderung", "иселувањето"]
  - [der-lebensmittelpunkt, "der Lebensmittelpunkt", "центарот на животот", {rare: true}]
  - [die-entscheidung, "die Entscheidung", "одлуката"]
  - [die-rente-ins-ausland, "die Rentenzahlung ins Ausland", "исплатата на пензија во странство", {rare: true}]
dialogue:
  - [protagonist, "Petar, wenn wir ganz nach Leipzig ziehen — brauchen wir eine Erlaubnis?", "Петре, ако се преселиме сосема во Лајпциг — ни треба ли дозвола?"]
  - [petar, "Nein. Als EU-Bürger braucht ihr keine. Nach fünf Jahren ununterbrochenem Aufenthalt habt ihr ein Daueraufenthaltsrecht.", "Не. Како граѓани на ЕУ не ви треба. По пет години престој без прекин имате право на постојан престој."]
  - [protagonist, "Und was müssen wir tun?", "А што треба да направиме?"]
  - [petar, "Den Wohnsitz anmelden. Der Lebensmittelpunkt muss hier sein, nicht in Bitola.", "Да го пријавите живеалиштето. Центарот на животот мора да биде тука, не во Битола."]
  - [protagonist, "Und unsere Rente?", "А нашата пензија?"]
  - [petar, "Die Rentenzahlung ins Ausland ist möglich. Fragt beim Rentenfonds in Skopje nach.", "Исплатата на пензија во странство е можна. Прашајте во Пензискиот фонд во Скопје."]
  - [protagonist, "Und die Krankenversicherung? Das ist meine größte Sorge.", "А здравственото осигурување? Тоа е мојата најголема грижа."]
  - [petar, "Zu Recht. Das klären wir vor der Entscheidung — nicht danach.", "Со право. Тоа ќе го разјасниме пред одлуката — не потоа."]
teach:
  - ask: ["Прашајте: ни треба ли дозвола?", "Brauchen wir eine Erlaubnis?", die-auswanderung]
  - note: ["Официјалниот германски ги прави условите именки: «nach fünf Jahren ununterbrochenem Aufenthalt» (= ако живеете пет години без прекин), «vor der Entscheidung» (= пред да одлучите), «die Rentenzahlung ins Ausland» (= пензијата се плаќа во странство)."]
  - ask: ["Кажете: по пет години престој без прекин.", "Nach fünf Jahren ununterbrochenem Aufenthalt.", fuenf-jahre, ununterbrochen]
  - ask: ["Кажете: право на постојан престој.", "Das Daueraufenthaltsrecht.", das-daueraufenthaltsrecht]
  - ask: ["Кажете: да го пријавиме живеалиштето.", "Den Wohnsitz anmelden.", der-wohnsitz]
  - ask: ["Кажете: пријавување на нова адреса.", "Die Ummeldung.", die-ummeldung]
  - ask: ["Кажете: центарот на животот.", "Der Lebensmittelpunkt.", der-lebensmittelpunkt]
  - ask: ["Кажете: исплата на пензија во странство.", "Die Rentenzahlung ins Ausland.", die-rente-ins-ausland]
  - ask: ["Кажете: здравственото осигурување е мојата најголема грижа.", "Die Krankenversicherung ist meine größte Sorge.", die-krankenversicherung-m]
  - ask: ["Кажете: пред одлуката.", "Vor der Entscheidung.", die-entscheidung]
  - note: ["Граѓаните на ЕУ не им треба дозвола за престој; по пет години законски престој стекнуваат право на постојан престој. За пензионери клучни се пензијата (дали се исплатува во Германија) и здравственото осигурување. Разјаснете ги двете пред селењето — правилата се менуваат."]
