id: B1-08
protagonist: m
title: ["No means no", "«لا» تعني لا", "Не значи не"]
situation:
  - "At Jonas's. He offers a drink once, you politely refuse — and nothing more comes."
  - "عند يوناس. يعرض عليك شرابًا مرة واحدة، فترفض بأدب — ولا يأتي شيء بعد ذلك."
  - "Кај Јонас. Ви нуди пијалок еднаш, вие учтиво одбивате — и ништо повеќе не доаѓа."
learn: [de-con_04]
culture: The offer is not repeated
items:
  - [moechtest-du, "Möchtest du …?", "Would you like …? (informal)", "هل تريد …؟", "Сакаш ли …?"]
  - [nein-danke, "Nein, danke", "No, thanks", "لا، شكرًا", "Не, благодарам"]
  - [heisst-nein, "heißt nein", "means no", "تعني لا", "значи не"]
  - [ich-wusste-nicht, "Ich wusste nicht, ob …", "I didn't know whether …", "لم أكن أعرف إن كان …", "Не знаев дали …"]
  - [hoeflich, "höflich", "polite", "مؤدب", "учтив"]
  - [ehrlich, "ehrlich", "honest(ly)", "بصراحة", "искрено"]
  - [ich-hatte-durst, "ich hatte Durst", "I was thirsty", "كنت عطشانًا", "бев жеден"]
  - [beim-zweiten-mal, "beim zweiten Mal", "the second time", "في المرة الثانية", "вториот пат"]
  - [sag-einfach, "Sag einfach …", "Just say …", "قل ببساطة …", "Само кажи …"]
  - [gerne, "gerne", "gladly, yes please", "بكل سرور", "со задоволство"]
dialogue:
  - [jonas, "Möchtest du etwas trinken?", "Would you like something to drink?", "هل تريد شيئًا تشربه؟", "Сакаш ли нешто да пиеш?"]
  - [protagonist, "Nein, danke.", "No, thanks.", "لا، شكرًا.", "Не, благодарам."]
  - [jonas, "Okay. Also, der Film...", "OK. So, the film...", "حسنًا. إذن، الفيلم...", "Добро. Значи, филмот..."]
  - [protagonist, "Ehrlich gesagt... ich hatte Durst. Ich wusste nicht, ob du noch einmal fragst.", "To be honest... I was thirsty. I didn't know whether you'd ask again.", "بصراحة... كنت عطشانًا. لم أكن أعرف إن كنت ستسأل مرة أخرى.", "Искрено... бев жеден. Не знаев дали ќе прашаш уште еднаш."]
  - [jonas, "Noch einmal? Nein heißt nein!", "Again? No means no!", "مرة أخرى؟ «لا» تعني لا!", "Уште еднаш? Не значи не!"]
  - [protagonist, "Bei uns fragt man dreimal. Das erste Nein ist nur höflich.", "Where I'm from, people ask three times. The first no is just politeness.", "عندنا يسأل الناس ثلاث مرات. «لا» الأولى مجرد أدب.", "Кај нас се прашува три пати. Првото не е само учтивост."]
  - [jonas, "Das wusste ich nicht! Sag einfach „gerne“. Wasser oder Saft?", "I didn't know that! Just say 'yes please'. Water or juice?", "لم أكن أعرف ذلك! قل ببساطة «بكل سرور». ماء أم عصير؟", "Не го знаев тоа! Само кажи „со задоволство“. Вода или сок?"]
  - [protagonist, "Gerne einen Saft! Beim zweiten Mal sage ich ja.", "Juice, please! The second time I say yes.", "عصيرًا بكل سرور! في المرة الثانية أقول نعم.", "Сок, со задоволство! Вториот пат велам да."]
teach:
  - ask: ["He offers: would you like something to drink?", "يعرض: هل تريد شيئًا تشربه؟", "Тој нуди: сакаш ли нешто да пиеш?", "Möchtest du etwas trinken?", moechtest-du]
  - ask: ["Say: no, thanks.", "قل: لا، شكرًا.", "Кажете: не, благодарам.", "Nein, danke.", nein-danke]
  - ask: ["Say: to be honest, I was thirsty.", "قل: بصراحة، كنت عطشانًا.", "Кажете: искрено, бев жеден.", "Ehrlich gesagt, ich hatte Durst.", ehrlich, ich-hatte-durst]
  - note: ["Indirect questions: «ob» (whether) or a question word, verb at the end: «Ich wusste nicht, ob du noch einmal fragst».", "الأسئلة غير المباشرة: «ob» (إن كان) أو كلمة سؤال، والفعل في الآخر: «Ich wusste nicht, ob du noch einmal fragst».", "Индиректни прашања: «ob» (дали) или прашален збор, глаголот на крајот: «Ich wusste nicht, ob du noch einmal fragst»."]
  - ask: ["Say: I didn't know whether you'd ask again.", "قل: لم أكن أعرف إن كنت ستسأل مرة أخرى.", "Кажете: не знаев дали ќе прашаш уште еднаш.", "Ich wusste nicht, ob du noch einmal fragst.", ich-wusste-nicht]
  - ask: ["He says: no means no!", "يقول: «لا» تعني لا!", "Тој вели: не значи не!", "Nein heißt nein!", heisst-nein]
  - ask: ["Say: the first no is just politeness.", "قل: «لا» الأولى مجرد أدب.", "Кажете: првото не е само учтивост.", "Das erste Nein ist nur höflich.", hoeflich]
  - ask: ["He says: just say 'yes please'.", "يقول: قل ببساطة «بكل سرور».", "Тој вели: само кажи „со задоволство“.", "Sag einfach „gerne“.", sag-einfach, gerne]
  - ask: ["Say: the second time I say yes.", "قل: في المرة الثانية أقول نعم.", "Кажете: вториот пат велам да.", "Beim zweiten Mal sage ich ja.", beim-zweiten-mal]
  - note: ["A German host usually offers once and takes your answer literally. If you want it, say «Ja, gerne» the first time.", "المضيف الألماني يعرض عادةً مرة واحدة ويأخذ جوابك حرفيًا. إن أردت الشيء، قل «Ja, gerne» من المرة الأولى.", "Германскиот домаќин обично нуди еднаш и го зема одговорот буквално. Ако сакате, кажете «Ja, gerne» уште првиот пат."]
