id: A2-09
protagonist: f
title: ["Electricity", "الكهرباء", "Струјата"]
situation:
  - "A letter from the electricity company: you must choose a contract. Jonas reads it with you."
  - "رسالة من شركة الكهرباء: يجب أن تختاري عقدًا. يوناس يقرؤها معكِ."
  - "Писмо од електродистрибуцијата: мора да изберете договор. Јонас го чита со вас."
learn: [a2-dass]
culture: Choosing a provider
items:
  - [der-strom, "der Strom", "electricity", "الكهرباء", "струјата"]
  - [der-anbieter, "der Anbieter", "the provider", "المزوّد", "давателот"]
  - [der-vertrag, "der Vertrag", "the contract", "العقد", "договорот"]
  - [der-zaehler, "der Zähler", "the meter", "العدّاد", "броилото"]
  - [ablesen, "ablesen", "read (a meter)", "يقرأ (العدّاد)", "отчита"]
  - [dass, "dass", "that (verb to the end)", "أنّ (الفعل في الآخر)", "дека (глаголот на крај)"]
  - [ich-glaube, "ich glaube", "I think", "أظن", "мислам"]
  - [wechseln, "wechseln", "switch, change", "يغيّر", "менува"]
  - [vergleichen, "vergleichen", "compare", "يقارن", "споредува"]
  - [guenstiger, "günstiger", "cheaper", "أرخص", "поевтино"]
  - [die-nummer-zaehler, "die Zählernummer", "the meter number", "رقم العدّاد", "бројот на броилото", {rare: true}]
dialogue:
  - [protagonist, "Hier steht, dass ich einen Vertrag brauche. Für Strom.", "It says here that I need a contract. For electricity.", "مكتوب هنا أنني أحتاج عقدًا. للكهرباء.", "Тука пишува дека ми треба договор. За струја."]
  - [jonas, "Ja. Du kannst den Anbieter wählen.", "Yes. You can choose the provider.", "نعم. يمكنكِ أن تختاري المزوّد.", "Да. Можеш да го избереш давателот."]
  - [protagonist, "Welcher ist gut?", "Which one is good?", "أيّهم جيد؟", "Кој е добар?"]
  - [jonas, "Ich glaube, dass man vergleichen muss. Im Internet.", "I think you have to compare. Online.", "أظن أنه يجب المقارنة. على الإنترنت.", "Мислам дека мора да се споредува. На интернет."]
  - [protagonist, "Und was brauche ich?", "And what do I need?", "وماذا أحتاج؟", "А што ми треба?"]
  - [jonas, "Die Zählernummer. Der Zähler ist im Keller. Lies auch den Stand ab.", "The meter number. The meter is in the basement. Read the figure too.", "رقم العدّاد. العدّاد في القبو. اقرئي القراءة أيضًا.", "Бројот на броилото. Броилото е во подрумот. Отчитај ја и состојбата."]
  - [protagonist, "Kann ich später wechseln?", "Can I switch later?", "هل يمكنني أن أغيّر لاحقًا؟", "Може ли подоцна да сменам?"]
  - [jonas, "Ja. Oft ist ein neuer Vertrag günstiger.", "Yes. A new contract is often cheaper.", "نعم. غالبًا ما يكون العقد الجديد أرخص.", "Да. Нов договор често е поевтин."]
teach:
  - note: ["«dass» (that) sends the verb to the end, like «weil»: «Hier steht, dass ich einen Vertrag brauche».", "«dass» (أنّ) ترسل الفعل إلى آخر الجملة، مثل «weil»: «Hier steht, dass ich einen Vertrag brauche».", "«dass» (дека) го праќа глаголот на крајот, како «weil»: «Hier steht, dass ich einen Vertrag brauche»."]
  - ask: ["Say: it says that I need a contract.", "قولي: مكتوب أنني أحتاج عقدًا.", "Кажете: пишува дека ми треба договор.", "Hier steht, dass ich einen Vertrag brauche.", dass, der-vertrag]
  - ask: ["Say: for electricity.", "قولي: للكهرباء.", "Кажете: за струја.", "Für Strom.", der-strom]
  - ask: ["Say: you can choose the provider.", "قولي: يمكنكِ أن تختاري المزوّد.", "Кажете: можеш да го избереш давателот.", "Du kannst den Anbieter wählen.", der-anbieter]
  - ask: ["Say: I think you have to compare.", "قولي: أظن أنه يجب المقارنة.", "Кажете: мислам дека мора да се споредува.", "Ich glaube, dass man vergleichen muss.", ich-glaube, vergleichen]
  - ask: ["Say: the meter number.", "قولي: رقم العدّاد.", "Кажете: бројот на броилото.", "Die Zählernummer.", die-nummer-zaehler]
  - ask: ["Say: the meter is in the basement.", "قولي: العدّاد في القبو.", "Кажете: броилото е во подрумот.", "Der Zähler ist im Keller.", der-zaehler]
  - ask: ["Say: read the meter.", "قولي: اقرئي العدّاد.", "Кажете: отчитај го броилото.", "Den Zähler ablesen.", ablesen]
  - ask: ["Ask: can I switch later?", "اسألي: هل يمكنني أن أغيّر لاحقًا؟", "Прашајте: може ли подоцна да сменам?", "Kann ich später wechseln?", wechseln]
  - ask: ["Say: a new contract is cheaper.", "قولي: العقد الجديد أرخص.", "Кажете: нов договор е поевтин.", "Ein neuer Vertrag ist günstiger.", guenstiger]
  - note: ["You choose your own electricity provider; without a contract you land in the more expensive basic supply. Note the meter reading on the day you move in. Prices change — compare before you sign, and again every year or two.", "تختارين مزوّد الكهرباء بنفسكِ؛ وبلا عقد تقعين في التزويد الأساسي الأغلى. سجّلي قراءة العدّاد يوم السكن. الأسعار تتغير — قارني قبل التوقيع، ثم كل سنة أو سنتين.", "Давателот на струја го избирате сами; без договор паѓате во поскапото основно снабдување. Запишете ја состојбата на броилото на денот на вселувањето. Цените се менуваат — споредете пред да потпишете, и пак на една-две години."]
