id: B2-12
protagonist: f
title: ["Probability", "الاحتمال", "Веројатност"]
situation:
  - "Jonas buys a lottery ticket every week. Lena, a maths teacher, explains the odds — and the weather forecast."
  - "يوناس يشتري ورقة يانصيب كل أسبوع. لينا، معلّمة الرياضيات، تشرح الاحتمالات — والنشرة الجوية."
  - "Јонас секоја недела купува лотарија. Лена, наставничка по математика, ги објаснува шансите — и временската прогноза."
learn: [b2-konjunktiv-ii-past]
culture: —
items:
  - [die-wahrscheinlichkeit, "die Wahrscheinlichkeit", "the probability", "الاحتمال", "веројатноста"]
  - [der-zufall, "der Zufall", "chance, coincidence", "المصادفة", "случајноста"]
  - [das-lotto, "das Lotto", "the lottery", "اليانصيب", "лотото"]
  - [die-chance, "die Chance", "the chance", "الفرصة", "шансата"]
  - [eins-zu, "eins zu …", "one in …", "واحد من …", "еден спрема …"]
  - [haette-gewonnen, "hätte gewonnen", "would have won", "كان سيفوز", "ќе добиеше"]
  - [waere-gekommen, "wäre gekommen", "would have come", "كان سيأتي", "ќе дојдеше"]
  - [die-regenwahrscheinlichkeit, "die Regenwahrscheinlichkeit", "chance of rain", "احتمال المطر", "веројатноста за дожд", {rare: true}]
  - [der-blitz, "der Blitz", "lightning", "البرق", "молњата"]
  - [verschwendet, "verschwendet", "wasted", "مُهدَر", "потрошено залудно"]
dialogue:
  - [jonas, "Fast! Hätte ich die Sieben getippt, hätte ich gewonnen!", "So close! If I'd picked the seven, I'd have won!", "كدتُ! لو اخترتُ الرقم سبعة لفزتُ!", "Речиси! Да ја типовав седумката, ќе добиев!"]
  - [lena, "Die Wahrscheinlichkeit für den Jackpot ist etwa eins zu hundertvierzig Millionen.", "The probability of the jackpot is about one in a hundred and forty million.", "احتمال الجائزة الكبرى نحو واحد من مئة وأربعين مليونًا.", "Веројатноста за џекпотот е околу еден спрема сто и четириесет милиони."]
  - [protagonist, "Das ist weniger als ein Blitz, oder?", "That's less than lightning, isn't it?", "هذا أقل من البرق، أليس كذلك؟", "Тоа е помалку од молња, нели?"]
  - [lena, "Viel weniger! Vom Blitz getroffen zu werden ist wahrscheinlicher.", "Much less! Being hit by lightning is more likely.", "أقل بكثير! احتمال أن يصيبك البرق أكبر.", "Многу помалку! Поверојатно е да те погоди молња."]
  - [jonas, "Aber jemand gewinnt doch immer! Das ist Zufall.", "But someone always wins! That's chance.", "لكن أحدًا يفوز دائمًا! هذه مصادفة.", "Но некој секогаш добива! Тоа е случајност."]
  - [protagonist, "Und was heißt „siebzig Prozent Regenwahrscheinlichkeit“ heute?", "And what does 'seventy per cent chance of rain' mean today?", "وماذا تعني «احتمال المطر سبعون بالمئة» اليوم؟", "А што значи „седумдесет проценти веројатност за дожд“ денес?"]
  - [lena, "An sieben von zehn solchen Tagen regnet es. Wärst du gestern mit Schirm gekommen, wärst du trocken geblieben!", "On seven of ten such days it rains. If you'd come with an umbrella yesterday, you'd have stayed dry!", "في سبعة من كل عشرة أيام كهذه تمطر. لو جئتِ أمس بمظلة لبقيتِ جافة!", "Во седум од десет такви денови врне. Да дојдеше вчера со чадор, ќе останеше сува!"]
  - [protagonist, "Und Jonas: das Geld für Lotto ist verschwendet.", "And Jonas: the lottery money is wasted.", "ويا يوناس: مال اليانصيب مُهدَر.", "А Јонас: парите за лото се потрошени залудно."]
  - [jonas, "Aber der Traum ist billig!", "But the dream is cheap!", "لكن الحلم رخيص!", "Но сонот е евтин!"]
teach:
  - note: ["Konjunktiv II past for missed chances: «Hätte ich die Sieben getippt, hätte ich gewonnen» (if I had…, I would have…). With movement verbs: «Wärst du gekommen, wärst du trocken geblieben».", "صيغة التمني في الماضي للفرص الضائعة: «Hätte ich die Sieben getippt, hätte ich gewonnen» (لو كنتُ…، لكنتُ…). ومع أفعال الحركة: «Wärst du gekommen, wärst du trocken geblieben».", "Konjunktiv II во минато за пропуштени шанси: «Hätte ich die Sieben getippt, hätte ich gewonnen» (да бев…, ќе…). Со глаголи на движење: «Wärst du gekommen, wärst du trocken geblieben»."]
  - ask: ["He says: I'd have won!", "يقول: لكنتُ فزتُ!", "Тој вели: ќе добиев!", "Ich hätte gewonnen!", haette-gewonnen]
  - ask: ["Say: the lottery.", "قولي: اليانصيب.", "Кажете: лотото.", "Das Lotto.", das-lotto]
  - ask: ["Say: the probability.", "قولي: الاحتمال.", "Кажете: веројатноста.", "Die Wahrscheinlichkeit.", die-wahrscheinlichkeit]
  - ask: ["Say: one in a hundred and forty million.", "قولي: واحد من مئة وأربعين مليونًا.", "Кажете: еден спрема сто и четириесет милиони.", "Eins zu hundertvierzig Millionen.", eins-zu]
  - ask: ["Say: less than lightning.", "قولي: أقل من البرق.", "Кажете: помалку од молња.", "Weniger als ein Blitz.", der-blitz]
  - ask: ["Say: that's chance.", "قولي: هذه مصادفة.", "Кажете: тоа е случајност.", "Das ist Zufall.", der-zufall]
  - ask: ["Say: seventy per cent chance of rain.", "قولي: احتمال المطر سبعون بالمئة.", "Кажете: седумдесет проценти веројатност за дожд.", "Siebzig Prozent Regenwahrscheinlichkeit.", die-regenwahrscheinlichkeit]
  - ask: ["Say: if you had come…", "قولي: لو جئتَ…", "Кажете: да дојдеше…", "Wärst du gekommen…", waere-gekommen]
  - ask: ["Say: the money is wasted.", "قولي: المال مُهدَر.", "Кажете: парите се потрошени залудно.", "Das Geld ist verschwendet.", verschwendet]
  - ask: ["Say: what's my chance?", "قولي: ما فرصتي؟", "Кажете: каква ми е шансата?", "Wie ist meine Chance?", die-chance]
