id: C2-29
protagonist: f
title: ["The anniversary speech", "كلمة الذكرى", "Јубилејниот говор"]
situation:
  - "Ten years in Germany. You've invited everyone — Jonas, Svenja, Lena, Paul, Petra, even Herr Schulz. Time for your speech."
  - "عشر سنوات في ألمانيا. دعوتِ الجميع — يوناس وسفينيا ولينا وباول وبيترا، وحتى السيد شولتس. حان وقت كلمتكِ."
  - "Десет години во Германија. Ги поканивте сите — Јонас, Свења, Лена, Паул, Петра, дури и господин Шулц. Време е за вашиот говор."
learn: []
learn_missing: [rhetoric]
culture: Looking back
items:
  - [der-rueckblick, "der Rückblick", "the look back", "النظرة إلى الماضي", "погледот наназад"]
  - [vor-zehn-jahren, "vor zehn Jahren", "ten years ago", "قبل عشر سنوات", "пред десет години"]
  - [mein-erstes-wort, "mein erstes deutsches Wort", "my first German word", "أول كلمة ألمانية لي", "мојот прв германски збор"]
  - [der-weg, "der Weg", "the path, journey", "الطريق", "патот"]
  - [an-meiner-seite, "an meiner Seite", "at my side", "إلى جانبي", "до мене"]
  - [heute-stehe-ich-hier, "Heute stehe ich hier", "Today I stand here", "اليوم أقف هنا", "Денес стојам тука"]
  - [der-dank-gilt, "Mein Dank gilt …", "My thanks go to …", "شكري موجّه إلى …", "Мојата благодарност оди кон …"]
  - [die-geduld-c2, "eure Geduld", "your patience", "صبركم", "вашето трпение"]
  - [das-geschenk-c2, "das größte Geschenk", "the greatest gift", "أعظم هدية", "најголемиот подарок"]
  - [auf-uns, "Auf uns!", "To us!", "نخبنا!", "За нас!"]
dialogue:
  - [protagonist, "Liebe Freunde! Vor zehn Jahren war mein erstes deutsches Wort: „Entschuldigung“.", "Dear friends! Ten years ago my first German word was: 'Entschuldigung' (sorry).", "أصدقائي الأعزاء! قبل عشر سنوات كانت أول كلمة ألمانية لي: «Entschuldigung» (عذرًا).", "Драги пријатели! Пред десет години мојот прв германски збор беше: „Entschuldigung“ (извинете)."]
  - [protagonist, "Ich sagte es zu Herrn Schulz, weil ich die falsche Nummer gezogen hatte.", "I said it to Herr Schulz, because I'd taken the wrong number.", "قلتُها للسيد شولتس، لأنني أخذتُ الرقم الخطأ.", "Му го реков на господин Шулц, затоа што имав земено погрешен број."]
  - [schulz, "(lacht) Daran erinnere ich mich!", "(laughs) I remember that!", "(يضحك) أتذكّر ذلك!", "(се смее) Се сеќавам на тоа!"]
  - [protagonist, "Heute stehe ich hier — mit einem Job, einem Verein, einer Wohnung und, vor allem, mit euch.", "Today I stand here — with a job, a club, a flat and, above all, with you.", "اليوم أقف هنا — بوظيفة ونادٍ وشقة، وفوق كل شيء معكم.", "Денес стојам тука — со работа, клуб, стан и, пред сè, со вас."]
  - [protagonist, "Mein Dank gilt euch allen: für eure Geduld, eure Kritik und euren Kuchen.", "My thanks go to all of you: for your patience, your criticism and your cake.", "شكري موجّه إليكم جميعًا: على صبركم ونقدكم وكعككم.", "Мојата благодарност оди кон сите вас: за трпението, критиката и колачот."]
  - [protagonist, "Der Weg war nicht immer leicht. Aber ihr wart an meiner Seite. Das ist das größte Geschenk.", "The journey wasn't always easy. But you were at my side. That's the greatest gift.", "لم يكن الطريق سهلًا دائمًا. لكنكم كنتم إلى جانبي. هذه أعظم هدية.", "Патот не беше секогаш лесен. Но вие бевте до мене. Тоа е најголемиот подарок."]
  - [jonas, "Und dein Deutsch ist inzwischen besser als meins!", "And by now your German is better than mine!", "ولغتكِ الألمانية الآن أفضل من لغتي!", "А твојот германски сега е подобар од мојот!"]
  - [protagonist, "Nicht schlecht, oder? — Auf uns!", "Not bad, right? — To us!", "ليس سيئًا، أليس كذلك؟ — نخبنا!", "Не е лошо, нели? — За нас!"]
teach:
  - ask: ["Say: ten years ago.", "قولي: قبل عشر سنوات.", "Кажете: пред десет години.", "Vor zehn Jahren.", vor-zehn-jahren]
  - ask: ["Say: my first German word.", "قولي: أول كلمة ألمانية لي.", "Кажете: мојот прв германски збор.", "Mein erstes deutsches Wort.", mein-erstes-wort]
  - note: ["A personal speech uses a frame: start with a small, funny memory («Vor zehn Jahren…»), turn to the present («Heute stehe ich hier…»), list with rhythm («mit einem Job, einem Verein, einer Wohnung»), thank («Mein Dank gilt…») and end on a toast — ideally with a callback, like «Nicht schlecht».", "الكلمة الشخصية تستعمل إطارًا: ابدئي بذكرى صغيرة طريفة («Vor zehn Jahren…»)، ثم انتقلي إلى الحاضر («Heute stehe ich hier…»)، وعدّدي بإيقاع («mit einem Job, einem Verein, einer Wohnung»)، واشكري («Mein Dank gilt…») واختمي بنخب — ويُستحسن بإحالة إلى ما سبق، مثل «Nicht schlecht».", "Личниот говор користи рамка: почнете со мало, смешно сеќавање («Vor zehn Jahren…»), свртете кон сегашноста («Heute stehe ich hier…»), набројувајте со ритам («mit einem Job, einem Verein, einer Wohnung»), заблагодарете («Mein Dank gilt…») и завршете со здравица — идеално со повикување на нешто претходно, како «Nicht schlecht»."]
  - ask: ["Say: today I stand here.", "قولي: اليوم أقف هنا.", "Кажете: денес стојам тука.", "Heute stehe ich hier.", heute-stehe-ich-hier]
  - ask: ["Say: my thanks go to all of you.", "قولي: شكري موجّه إليكم جميعًا.", "Кажете: мојата благодарност оди кон сите вас.", "Mein Dank gilt euch allen.", der-dank-gilt]
