id: B2-04-e
tracks: [en]
protagonist: m
title: ["Recognition"]
situation: ["Saturday night, the cloakroom of a club where you work. Your colleague Priya is a trained nurse — she's waiting for her licence."]
learn: [b2-passive-past]
culture: Overqualified
items:
  - [der-club, "der Club", "the club"]
  - [bis-dahin, "bis dahin", "until then"]
  - [das-anerkennungsverfahren, "das Anerkennungsverfahren", "the recognition procedure", {rare: true}]
  - [die-berufserlaubnis, "die Berufserlaubnis", "the licence to practise", {rare: true}]
  - [ueberqualifiziert, "überqualifiziert", "overqualified"]
  - [wurde-anerkannt, "wurde anerkannt", "was recognised"]
  - [wurden-verlangt, "wurden verlangt", "were required"]
  - [die-pflegekraft, "die Pflegefachkraft", "the qualified nurse", {rare: true}]
  - [die-kenntnispruefung, "die Kenntnisprüfung", "the knowledge exam", {rare: true}]
  - [die-unterlagen, "die Unterlagen", "the documents"]
  - [beglaubigt, "beglaubigt", "certified"]
dialogue:
  - [priya, "Jacke? Nummer zweiundvierzig. ... In Indien war ich Pflegefachkraft. Hier hänge ich Jacken auf.", "Jacket? Number forty-two. ... In India I was a nurse. Here I hang up jackets."]
  - [protagonist, "Warum arbeitest du nicht als Krankenschwester?", "Why aren't you working as a nurse?"]
  - [priya, "Ich brauche eine Berufserlaubnis. Das Anerkennungsverfahren läuft seit einem Jahr.", "I need a licence to practise. The recognition procedure has been running for a year."]
  - [protagonist, "Ein Jahr! Was wurde verlangt?", "A year! What was required?"]
  - [priya, "Beglaubigte Unterlagen, Übersetzungen, Deutsch B2. Mein Abschluss wurde nur teilweise anerkannt.", "Certified documents, translations, German B2. My degree was only partly recognised."]
  - [protagonist, "Und jetzt?", "And now?"]
  - [priya, "Jetzt mache ich eine Kenntnisprüfung. Bis dahin: Garderobe. Ich bin überqualifiziert, aber es zahlt die Miete.", "Now I'm taking a knowledge exam. Until then: the cloakroom. I'm overqualified, but it pays the rent."]
  - [protagonist, "Die Krankenhäuser suchen doch Leute!", "But the hospitals are looking for people!"]
  - [priya, "Eben. Und ich stehe hier. Nummer dreiundvierzig!", "Exactly. And here I stand. Number forty-three!"]
teach:
  - ask: ["Say: the cloakroom.", "Die Garderobe.", die-garderobe-e]
  - ask: ["Say: in a club.", "In einem Club.", der-club]
  - ask: ["She says: until then, the cloakroom.", "Bis dahin: Garderobe.", bis-dahin]
  - ask: ["Say: I need a licence to practise.", "Ich brauche eine Berufserlaubnis.", die-berufserlaubnis]
  - ask: ["Say: the recognition procedure.", "Das Anerkennungsverfahren.", das-anerkennungsverfahren]
  - note: ["Past passive again: «Was wurde verlangt?» (What was required?), «Mein Abschluss wurde anerkannt» (was recognised). Plural: «Unterlagen wurden verlangt»."]
  - ask: ["Ask: what was required?", "Was wurde verlangt?", wurden-verlangt]
  - ask: ["Say: certified documents.", "Beglaubigte Unterlagen.", beglaubigt, die-unterlagen]
  - ask: ["Say: my degree was only partly recognised.", "Mein Abschluss wurde nur teilweise anerkannt.", wurde-anerkannt]
  - ask: ["Say: the knowledge exam.", "Die Kenntnisprüfung.", die-kenntnispruefung]
  - ask: ["Say: I'm overqualified.", "Ich bin überqualifiziert.", ueberqualifiziert]
  - ask: ["Say: a qualified nurse.", "Eine Pflegefachkraft.", die-pflegekraft]
  - note: ["Regulated professions — nursing, medicine, teaching, law — need formal recognition before you may work in them; it can take months and often ends with an exam or adaptation course. Meanwhile many trained people work far below their level. The 'Anerkennung in Deutschland' portal shows the steps per profession."]
