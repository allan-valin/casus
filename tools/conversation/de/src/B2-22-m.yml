id: B2-22-m
tracks: [mk]
protagonist: m
title: ["Приказната на соседката"]
situation: ["Гордана е загрижена: потпишала хартија кај новиот шеф, а сега здравствената каса бара пари. Ви раскажува."]
learn: [b2-nominal-style]
culture: Never sign what you haven't read
items:
  - [die-kenntnisnahme, "zur Kenntnisnahme", "за знаење", {rare: true}]
  - [der-neue-besitzer, "der neue Besitzer", "новиот сопственик"]
  - [unterschreiben-ohne, "ohne zu lesen unterschreiben", "потпишува без да прочита"]
  - [die-vertragsaenderung, "die Vertragsänderung", "измената на договорот", {rare: true}]
  - [die-nachzahlung, "die Nachzahlung", "доплатата"]
  - [die-ratenzahlung, "die Ratenzahlung", "плаќањето на рати"]
  - [die-beratung-m, "die Beratungsstelle", "советувалиштето"]
  - [die-formalitaet, "nur eine Formalität", "само формалност"]
  - [verspaetet, "verspätet", "со задоцнување"]
  - [der-dolmetscher, "der Dolmetscher", "преведувачот"]
dialogue:
  - [gordana, "Der Pflegedienst hat einen neuen Besitzer. Er sagte, ich soll nur zur Kenntnisnahme unterschreiben.", "Службата за нега има нов сопственик. Рече само да потпишам за знаење."]
  - [protagonist, "Und was stand im Papier?", "А што пишуваше во хартијата?"]
  - [gordana, "Ich weiß es nicht genau. Er sagte, das sei nur eine Formalität.", "Не знам точно. Рече дека тоа е само формалност."]
  - [petar, "Zeig mal. ... Eine Vertragsänderung! Jetzt bist du nur noch Minijobberin.", "Покажи. ... Измена на договорот! Сега си само на Minijob."]
  - [gordana, "Und der Lohn kommt verspätet. Und jetzt will die Krankenkasse eine Nachzahlung!", "А платата доаѓа со задоцнување. А сега касата бара доплата!"]
  - [protagonist, "Bei uns hätte man so etwas nie ohne Dolmetscher unterschrieben.", "Кај нас такво нешто никој не би потпишал без преведувач."]
  - [petar, "Geh zur Beratungsstelle. Und bitte die Krankenkasse um Ratenzahlung.", "Оди во советувалиштето. И замоли ја касата за плаќање на рати."]
  - [gordana, "Nie wieder ohne zu lesen unterschreiben.", "Никогаш повеќе нема да потпишам без да прочитам."]
teach:
  - ask: ["Таа вели: службата има нов сопственик.", "Der Pflegedienst hat einen neuen Besitzer.", der-neue-besitzer]
  - ask: ["Кажете: за знаење.", "Zur Kenntnisnahme.", die-kenntnisnahme]
  - ask: ["Таа вели: само формалност.", "Nur eine Formalität.", die-formalitaet]
  - note: ["Официјалните хартии ги пакуваат дејствијата во именки: «zur Kenntnisnahme» (= за да се запознаете), «Vertragsänderung» (= договорот се менува). Распакувајте ги пред да потпишете."]
  - ask: ["Петар вели: измена на договорот!", "Eine Vertragsänderung!", die-vertragsaenderung]
  - ask: ["Таа вели: платата доаѓа со задоцнување.", "Der Lohn kommt verspätet.", verspaetet]
  - ask: ["Кажете: касата бара доплата.", "Die Krankenkasse will eine Nachzahlung.", die-nachzahlung]
  - ask: ["Кажете: без преведувач.", "Ohne Dolmetscher.", der-dolmetscher]
  - ask: ["Кажете: оди во советувалиштето.", "Geh zur Beratungsstelle.", die-beratung-m]
  - ask: ["Кажете: плаќање на рати.", "Die Ratenzahlung.", die-ratenzahlung]
  - ask: ["Кажете: никогаш без да прочитам.", "Nie wieder ohne zu lesen unterschreiben.", unterschreiben-ohne]
  - note: ["Никогаш не потпишувајте нешто што не сте го прочитале и разбрале — „само формалност“ е знак за предупредување. Новиот сопственик ги презема постојните договори непроменети; секоја измена бара ваш потпис. Ако касата подоцна бара придонеси, побарајте плаќање на рати — речиси секогаш се одобрува. За неплатени плати има кратки рокови: побарајте совет брзо."]
