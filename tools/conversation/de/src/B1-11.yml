id: B1-11
protagonist: f
title: ["Family visit", "زيارة العائلة", "Семејна посета"]
situation:
  - "Your sister and her husband visit for a week. You show them Leipzig — and what's different."
  - "أختكِ وزوجها يزورونكِ أسبوعًا. تُرينهم لايبزيغ — وما المختلف فيها."
  - "Сестра ви и нејзиниот сопруг доаѓаат на една недела. Им го покажувате Лајпциг — и што е различно."
learn: [b1-two-part-conjunctions]
culture: Hosting expectations
items:
  - [das-gaestezimmer, "das Gästezimmer", "the guest room", "غرفة الضيوف", "гостинската соба"]
  - [zeigen, "zeigen", "show", "يُري، يعرض", "покажува"]
  - [sowohl-als-auch, "sowohl … als auch", "both … and", "سواء … أو، كلٌّ من … و", "и … и"]
  - [entweder-oder, "entweder … oder", "either … or", "إما … أو", "или … или"]
  - [weder-noch, "weder … noch", "neither … nor", "لا … ولا", "ниту … ниту"]
  - [die-sehenswuerdigkeit, "die Sehenswürdigkeit", "the sight (to see)", "المعلم السياحي", "знаменитоста", {rare: true}]
  - [das-sofa-bett, "das Schlafsofa", "the sofa bed", "الأريكة السرير", "каучот за спиење", {rare: true}]
  - [die-gastfreundschaft, "die Gastfreundschaft", "hospitality", "الضيافة", "гостопримството"]
  - [hotel-oder-bei-mir, "im Hotel oder bei mir", "at a hotel or at my place", "في فندق أو عندي", "во хотел или кај мене"]
  - [fuer-eine-woche, "für eine Woche", "for a week", "لمدة أسبوع", "за една недела"]
dialogue:
  - [protagonist, "Willkommen! Ihr schlaft bei mir, nicht im Hotel.", "Welcome! You're sleeping at my place, not in a hotel.", "أهلًا وسهلًا! ستنامون عندي، لا في فندق.", "Добредојдовте! Ќе спиете кај мене, не во хотел."]
  - [schwester, "Aber du hast kein Gästezimmer!", "But you don't have a guest room!", "لكن ليس عندكِ غرفة ضيوف!", "Но немаш гостинска соба!"]
  - [protagonist, "Ich habe ein Schlafsofa. Bei uns schläft Familie nie im Hotel.", "I have a sofa bed. In our family, family never sleeps in a hotel.", "عندي أريكة سرير. عندنا العائلة لا تنام في فندق أبدًا.", "Имам кауч за спиење. Кај нас семејството никогаш не спие во хотел."]
  - [schwester, "Was zeigst du uns?", "What are you going to show us?", "ماذا ستُريننا؟", "Што ќе ни покажеш?"]
  - [protagonist, "Sowohl die Altstadt als auch den Zoo. Und entweder das Völkerschlachtdenkmal oder die Seen.", "Both the old town and the zoo. And either the monument or the lakes.", "كلًّا من المدينة القديمة وحديقة الحيوان. وإما النصب أو البحيرات.", "И стариот град и зоолошката. И или споменикот или езерата."]
  - [schwager, "Und die Nachbarn? Kommen sie zum Essen?", "And the neighbours? Are they coming to eat?", "والجيران؟ هل يأتون للطعام؟", "А соседите? Ќе дојдат на јадење?"]
  - [protagonist, "Hier lädt man weder spontan ein, noch kommt man ohne Termin.", "Here you neither invite on the spot nor come without arranging it.", "هنا لا يدعو الناس فجأة ولا يأتون بلا موعد.", "Тука ниту се кани спонтано, ниту се доаѓа без договор."]
  - [schwester, "Seltsam! Aber eine Woche bei dir ist genug Gastfreundschaft.", "Strange! But a week at your place is enough hospitality.", "غريب! لكن أسبوعًا عندكِ ضيافة كافية.", "Чудно! Но една недела кај тебе е доволно гостопримство."]
teach:
  - ask: ["Say: you're sleeping at my place.", "قولي: ستنامون عندي.", "Кажете: ќе спиете кај мене.", "Ihr schlaft bei mir.", hotel-oder-bei-mir]
  - ask: ["Say: the guest room.", "قولي: غرفة الضيوف.", "Кажете: гостинската соба.", "Das Gästezimmer.", das-gaestezimmer]
  - ask: ["Say: I have a sofa bed.", "قولي: عندي أريكة سرير.", "Кажете: имам кауч за спиење.", "Ich habe ein Schlafsofa.", das-sofa-bett]
  - ask: ["Ask: what will you show us?", "اسألي: ماذا ستُريننا؟", "Прашајте: што ќе ни покажеш?", "Was zeigst du uns?", zeigen]
  - note: ["Two-part conjunctions: «sowohl … als auch» (both … and), «entweder … oder» (either … or), «weder … noch» (neither … nor).", "أدوات الربط المزدوجة: «sowohl … als auch» (كلٌّ من … و)، «entweder … oder» (إما … أو)، «weder … noch» (لا … ولا).", "Двојни сврзници: «sowohl … als auch» (и … и), «entweder … oder» (или … или), «weder … noch» (ниту … ниту)."]
  - ask: ["Say: both the old town and the zoo.", "قولي: كلًّا من المدينة القديمة وحديقة الحيوان.", "Кажете: и стариот град и зоолошката.", "Sowohl die Altstadt als auch den Zoo.", sowohl-als-auch]
  - ask: ["Say: either the monument or the lakes.", "قولي: إما النصب أو البحيرات.", "Кажете: или споменикот или езерата.", "Entweder das Denkmal oder die Seen.", entweder-oder]
  - ask: ["Say: neither on the spot nor without arranging.", "قولي: لا فجأة ولا بلا موعد.", "Кажете: ниту спонтано ниту без договор.", "Weder spontan noch ohne Termin.", weder-noch]
  - ask: ["Say: a sight to see.", "قولي: معلم سياحي.", "Кажете: знаменитост.", "Eine Sehenswürdigkeit.", die-sehenswuerdigkeit]
  - ask: ["Say: hospitality.", "قولي: الضيافة.", "Кажете: гостопримство.", "Die Gastfreundschaft.", die-gastfreundschaft]
  - ask: ["Say: for a week.", "قولي: لمدة أسبوع.", "Кажете: за една недела.", "Für eine Woche.", fuer-eine-woche]
  - note: ["Many Germans prefer guests to stay in a hotel for longer visits; hosting family at home is a sign of closeness everywhere, but neighbours expect to be invited with notice.", "كثير من الألمان يفضّلون أن ينزل الضيوف في فندق في الزيارات الطويلة؛ واستضافة العائلة في البيت علامة قرب في كل مكان، لكن الجيران ينتظرون دعوة مسبقة.", "Многу Германци за подолги посети претпочитаат гостите да спијат во хотел; угостувањето на семејството дома е знак на блискост насекаде, но соседите очекуваат покана однапред."]
