id: B2-10-ea
tracks: [en, ar]
protagonist: f
title: ["The application", "طلب التوظيف"]
situation:
  - "You want to apply for a better job. Tim reads your cover letter — and finds it too modest."
  - "تريدين التقدّم لوظيفة أفضل. تيم يقرأ رسالة التقديم — ويجدها متواضعة أكثر من اللازم."
learn: [b2-nominalisation]
culture: Modest or self-promoting
items:
  - [das-anschreiben, "das Anschreiben", "the cover letter", "رسالة التقديم", {rare: true}]
  - [hiermit-bewerbe-ich-mich, "hiermit bewerbe ich mich", "I hereby apply", "أتقدّم بموجب هذا"]
  - [der-lebenslauf, "der Lebenslauf", "the CV", "السيرة الذاتية"]
  - [die-stelle-als, "die Stelle als …", "the position as …", "وظيفة …"]
  - [die-erfahrung, "die Erfahrung", "the experience", "الخبرة"]
  - [die-teamfaehigkeit, "die Teamfähigkeit", "being a team player", "القدرة على العمل الجماعي", {rare: true}]
  - [zu-bescheiden, "zu bescheiden", "too modest", "متواضع أكثر من اللازم"]
  - [die-uebernahme, "die Übernahme von Verantwortung", "taking on responsibility", "تحمّل المسؤولية"]
  - [ueber-eine-einladung, "über eine Einladung freue ich mich", "I'd be glad to be invited", "يسعدني أن تُوجَّه إليّ دعوة"]
  - [das-zeugnis, "die Zeugnisse", "the references, certificates", "الشهادات"]
dialogue:
  - [tim, "„Ich weiß nicht, ob ich gut genug bin“? Das kannst du nicht schreiben!", "'I don't know if I'm good enough'? You can't write that!", "«لا أعرف إن كنتُ جيدة بما يكفي»؟ لا يمكنكِ كتابة هذا!"]
  - [protagonist, "Bei uns ist das höflich. Man lobt sich nicht selbst.", "Where I'm from that's polite. You don't praise yourself.", "عندنا هذا من الأدب. لا يمدح المرء نفسه."]
  - [tim, "Hier bist du damit zu bescheiden. Schreib: „Hiermit bewerbe ich mich um die Stelle als Teamleiterin.“", "Here that's too modest. Write: 'I hereby apply for the position of team leader.'", "هنا هذا تواضع زائد. اكتبي: «أتقدّم بموجب هذا لوظيفة قائدة فريق.»"]
  - [protagonist, "Und dann? Meine Erfahrung?", "And then? My experience?", "ثم ماذا؟ خبرتي؟"]
  - [tim, "Ja, mit Beispielen: die Übernahme von Verantwortung, deine Teamfähigkeit.", "Yes, with examples: taking on responsibility, being a team player.", "نعم، مع أمثلة: تحمّل المسؤولية، وقدرتكِ على العمل الجماعي."]
  - [protagonist, "Und am Ende?", "And at the end?", "وفي النهاية؟"]
  - [tim, "„Über eine Einladung zu einem Gespräch freue ich mich.“ Lebenslauf und Zeugnisse im Anhang.", "'I would be glad to be invited for an interview.' CV and references attached.", "«يسعدني أن تُوجَّه إليّ دعوة لمقابلة.» السيرة الذاتية والشهادات في المرفق."]
  - [protagonist, "Klingt selbstbewusst. Fast zu selbstbewusst!", "Sounds confident. Almost too confident!", "يبدو واثقًا. واثقًا أكثر من اللازم تقريبًا!"]
  - [tim, "Genau richtig für Deutschland.", "Just right for Germany.", "مناسب تمامًا لألمانيا."]
teach:
  - ask: ["Say: the cover letter.", "قولي: رسالة التقديم.", "Das Anschreiben.", das-anschreiben]
  - ask: ["He says: that's too modest.", "يقول: هذا تواضع زائد.", "Das ist zu bescheiden.", zu-bescheiden]
  - ask: ["Write: I hereby apply for the position of team leader.", "اكتبي: أتقدّم بموجب هذا لوظيفة قائدة فريق.", "Hiermit bewerbe ich mich um die Stelle als Teamleiterin.", hiermit-bewerbe-ich-mich, die-stelle-als]
  - ask: ["Say: my experience.", "قولي: خبرتي.", "Meine Erfahrung.", die-erfahrung]
  - note: ["Applications love nouns: «die Übernahme von Verantwortung» (taking on responsibility), «Teamfähigkeit» (being able to work in a team). One noun can replace a whole clause.", "رسائل التقديم تحب الأسماء: «die Übernahme von Verantwortung» (تحمّل المسؤولية)، «Teamfähigkeit» (القدرة على العمل الجماعي). اسم واحد يمكن أن يحلّ محلّ جملة كاملة."]
  - ask: ["Write: taking on responsibility.", "اكتبي: تحمّل المسؤولية.", "Die Übernahme von Verantwortung.", die-uebernahme]
  - ask: ["Write: being a team player.", "اكتبي: القدرة على العمل الجماعي.", "Teamfähigkeit.", die-teamfaehigkeit]
  - ask: ["End: I'd be glad to be invited for an interview.", "اختمي: يسعدني أن تُوجَّه إليّ دعوة لمقابلة.", "Über eine Einladung zu einem Gespräch freue ich mich.", ueber-eine-einladung]
  - ask: ["Say: CV and references attached.", "قولي: السيرة الذاتية والشهادات في المرفق.", "Lebenslauf und Zeugnisse im Anhang.", der-lebenslauf, das-zeugnis]
  - note: ["German applications are factual and confident: say what you did and can do, with examples. Modesty ('I'm not sure I'm good enough') reads as lack of ability. A photo is optional today; a gap-free CV in table form is expected.", "رسائل التقديم الألمانية واقعية وواثقة: قولي ما فعلتِ وما تستطيعين، مع أمثلة. التواضع («لست متأكدة أنني جيدة بما يكفي») يُفهم ضعفًا في القدرة. الصورة اختيارية اليوم؛ والمتوقّع سيرة ذاتية في جدول بلا فجوات."]
