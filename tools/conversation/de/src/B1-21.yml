id: B1-21
protagonist: f
title: ["Art", "الفن", "Уметност"]
situation:
  - "The VHS course visits Leipzig's Museum of Fine Arts. Professor Hartmann stops in front of a large painting."
  - "دورة الجامعة الشعبية تزور متحف الفنون الجميلة في لايبزيغ. البروفيسور هارتمان يتوقف أمام لوحة كبيرة."
  - "Курсот на народниот универзитет го посетува Музејот на ликовни уметности во Лајпциг. Професорот Хартман застанува пред голема слика."
learn: [de-pro_05]
culture: —
items:
  - [das-gemaelde, "das Gemälde", "the painting", "اللوحة", "сликата"]
  - [der-eindruck, "der Eindruck", "the impression", "الانطباع", "впечатокот"]
  - [der-maler, "der Maler", "the painter", "الرسّام", "сликарот"]
  - [die-farbe, "die Farbe", "the colour", "اللون", "бојата"]
  - [der-nebel, "der Nebel", "the fog", "الضباب", "маглата"]
  - [das-licht, "das Licht", "the light", "الضوء", "светлината"]
  - [die-ausstellung, "die Ausstellung", "the exhibition", "المعرض", "изложбата"]
  - [wirkt, "wirkt", "seems, comes across", "يبدو", "делува"]
  - [das-meer-im-bild, "im Hintergrund", "in the background", "في الخلفية", "во позадината"]
  - [mir-gefaellt-am-besten, "Am besten gefällt mir …", "What I like best is …", "أكثر ما يعجبني …", "Најмногу ми се допаѓа …"]
dialogue:
  - [hartmann, "Das ist ein Gemälde von Caspar David Friedrich. Welchen Eindruck haben Sie?", "This is a painting by Caspar David Friedrich. What's your impression?", "هذه لوحة لكاسبار دافيد فريدريش. ما انطباعكِ؟", "Ова е слика од Каспар Давид Фридрих. Каков ви е впечатокот?"]
  - [protagonist, "Sie wirkt traurig. Die Farben sind dunkel.", "It seems sad. The colours are dark.", "تبدو حزينة. الألوان داكنة.", "Делува тажно. Боите се темни."]
  - [hartmann, "Und der Mann, der dort steht?", "And the man who's standing there?", "والرجل الذي يقف هناك؟", "А човекот што стои таму?"]
  - [protagonist, "Er schaut in den Nebel, den man im Hintergrund sieht. Er ist allein.", "He's looking into the fog you can see in the background. He's alone.", "ينظر إلى الضباب الذي نراه في الخلفية. إنه وحيد.", "Гледа во маглата што се гледа во позадината. Сам е."]
  - [hartmann, "Genau. Der Maler, dessen Bilder hier hängen, liebte die Natur und das Licht.", "Exactly. The painter whose pictures hang here loved nature and light.", "بالضبط. الرسّام الذي تُعلَّق لوحاته هنا أحبّ الطبيعة والضوء.", "Точно. Сликарот чии слики висат тука ја сакаше природата и светлината."]
  - [protagonist, "Am besten gefällt mir das Licht am Horizont.", "What I like best is the light on the horizon.", "أكثر ما يعجبني الضوء في الأفق.", "Најмногу ми се допаѓа светлината на хоризонтот."]
  - [hartmann, "Schön gesagt. Nächsten Monat gibt es eine neue Ausstellung.", "Nicely put. Next month there's a new exhibition.", "قلتِها جميلة. الشهر القادم معرض جديد.", "Убаво кажано. Следниот месец има нова изложба."]
  - [protagonist, "Da komme ich wieder!", "I'll come back for that!", "سأعود من أجله!", "Тогаш пак ќе дојдам!"]
teach:
  - ask: ["Say: a painting.", "قولي: لوحة.", "Кажете: слика.", "Ein Gemälde.", das-gemaelde]
  - ask: ["He asks your impression.", "يسأل عن انطباعكِ.", "Тој прашува за впечатокот.", "Welchen Eindruck haben Sie?", der-eindruck]
  - ask: ["Say: it seems sad.", "قولي: تبدو حزينة.", "Кажете: делува тажно.", "Sie wirkt traurig.", wirkt]
  - ask: ["Say: the colours are dark.", "قولي: الألوان داكنة.", "Кажете: боите се темни.", "Die Farben sind dunkel.", die-farbe, dunkel]
  - note: ["Relative pronouns follow their role in the clause: «der Mann, der dort steht» (subject), «der Nebel, den man sieht» (object), «der Maler, dessen Bilder hier hängen» (whose).", "ضمائر الصلة تتبع دورها في الجملة: «der Mann, der dort steht» (فاعل)، «der Nebel, den man sieht» (مفعول)، «der Maler, dessen Bilder hier hängen» (الذي … لوحاته).", "Релативните заменки ја следат улогата во реченицата: «der Mann, der dort steht» (подмет), «der Nebel, den man sieht» (предмет), «der Maler, dessen Bilder hier hängen» (чии)."]
  - ask: ["Say: in the background.", "قولي: في الخلفية.", "Кажете: во позадината.", "Im Hintergrund.", das-meer-im-bild]
  - ask: ["Say: he looks into the fog.", "قولي: ينظر إلى الضباب.", "Кажете: гледа во маглата.", "Er schaut in den Nebel.", der-nebel]
  - ask: ["Say: the painter whose pictures hang here.", "قولي: الرسّام الذي تُعلَّق لوحاته هنا.", "Кажете: сликарот чии слики висат тука.", "Der Maler, dessen Bilder hier hängen.", der-maler]
  - ask: ["Say: what I like best is the light.", "قولي: أكثر ما يعجبني الضوء.", "Кажете: најмногу ми се допаѓа светлината.", "Am besten gefällt mir das Licht.", mir-gefaellt-am-besten, das-licht]
  - ask: ["Say: a new exhibition.", "قولي: معرض جديد.", "Кажете: нова изложба.", "Eine neue Ausstellung.", die-ausstellung]
  - note: ["Caspar David Friedrich (1774–1840), the great painter of German Romanticism: lonely figures before fog, sea and mountains. Many museums are free or cheap one day a month — ask at the desk.", "كاسبار دافيد فريدريش (1774–1840)، الرسّام الكبير للرومانسية الألمانية: شخوص وحيدة أمام الضباب والبحر والجبال. كثير من المتاحف مجانية أو رخيصة يومًا في الشهر — اسألي عند المدخل.", "Каспар Давид Фридрих (1774–1840), големиот сликар на германскиот романтизам: осамени фигури пред магла, море и планини. Многу музеи се бесплатни или евтини еден ден во месецот — прашајте на благајната."]
