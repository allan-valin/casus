id: A2-05-m
tracks: [mk]
protagonist: f
title: ["Што покрива осигурувањето?"]
situation: ["Ве боли забот. Ања се јавува во стоматолошката ординација и прашува што покрива вашето осигурување."]
learn: [a2-dative]
culture: What your insurance covers abroad
items:
  - [die-versicherung, "die Versicherung", "осигурувањето"]
  - [mein-zahn, "mein Zahn", "мојот заб"]
  - [der-zahnarzt, "der Zahnarzt", "заболекарот"]
  - [im-notfall, "im Notfall", "во итен случај"]
  - [bezahlt, "bezahlt", "плаќа"]
  - [die-rechnung, "die Rechnung", "сметката"]
  - [zurueckholen, "das Geld zurückholen", "да ги вратите парите"]
  - [mit-ihr, "mit ihr", "со неа"]
  - [die-karte-m, "die Karte", "картичката"]
  - [hilft-ihnen, "hilft Ihnen", "ви помага"]
dialogue:
  - [kasse, "Zahnarztpraxis, guten Tag. Was kann ich für Sie tun?", "Стоматолошка ординација, добар ден. Што можам да направам за вас?"]
  - [anja, "Meine Schwiegermutter hat Zahnschmerzen. Sie ist aus Mazedonien zu Besuch.", "Мојата свекрва има забоболка. На гости е од Македонија."]
  - [kasse, "Welche Versicherung hat sie?", "Какво осигурување има?"]
  - [protagonist, "Die europäische Karte und eine Reiseversicherung.", "Европската картичка и патно осигурување."]
  - [kasse, "Die europäische Karte bezahlt nur im Notfall.", "Европската картичка плаќа само во итен случај."]
  - [anja, "Zahnschmerzen sind ein Notfall!", "Забоболката е итен случај!"]
  - [kasse, "Dann kommen Sie heute. Bringen Sie die Karte mit.", "Тогаш дојдете денес. Донесете ја картичката."]
  - [protagonist, "Und die Rechnung?", "А сметката?"]
  - [kasse, "Die bezahlen Sie vielleicht zuerst. Die Reiseversicherung hilft Ihnen, das Geld zurückzuholen.", "Можеби прво ќе ја платите. Патното осигурување ќе ви помогне да ги вратите парите."]
teach:
  - ask: ["Кажете: ме боли забот.", "Mein Zahn tut weh.", mein-zahn]
  - ask: ["Прашајте: какво осигурување?", "Welche Versicherung?", die-versicherung]
  - ask: ["Кажете: заболекарот.", "Der Zahnarzt.", der-zahnarzt]
  - ask: ["Таа вели: плаќа само во итен случај.", "Sie bezahlt nur im Notfall.", bezahlt, im-notfall]
  - ask: ["Таа вели: донесете ја картичката.", "Bringen Sie die Karte mit.", die-karte-m]
  - ask: ["Прашајте: а сметката?", "Und die Rechnung?", die-rechnung]
  - note: ["По «mit», «bei», «von», «zu» следува датив: «mit ihr» (со неа), «Ihnen» (вам), «zum Zahnarzt»."]
  - ask: ["Кажете: одам со неа.", "Ich gehe mit ihr.", mit-ihr]
  - ask: ["Таа вели: осигурувањето ви помага.", "Die Versicherung hilft Ihnen.", hilft-ihnen]
  - ask: ["Кажете: да ги вратите парите.", "Das Geld zurückholen.", zurueckholen]
  - note: ["Чувајте ги сите сметки и извештаи: патното осигурување ги враќа парите само со документи. Пред патувањето прашајте што точно покрива."]
