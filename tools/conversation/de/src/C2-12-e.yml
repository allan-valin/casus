id: C2-12-e
tracks: [en]
protagonist: m
title: ["Defending the thesis"]
situation: ["Your master's thesis colloquium. Twenty minutes of presentation, then questions from the examiners."]
learn: []
learn_missing: [academic-register]
culture: The academic register
items:
  - [die-fachsprache, "die Fachsprache", "technical language"]
  - [das-kolloquium, "das Kolloquium", "the thesis defence", {rare: true}]
  - [die-forschungsfrage, "die Forschungsfrage", "the research question", {rare: true}]
  - [die-methodik, "die Methodik", "the methodology", {rare: true}]
  - [die-ergebnisse, "die Ergebnisse", "the results"]
  - [es-laesst-sich-zeigen, "es lässt sich zeigen, dass …", "it can be shown that …"]
  - [im-rahmen-dieser-arbeit, "im Rahmen dieser Arbeit", "within the scope of this thesis"]
  - [die-einschraenkung, "die Einschränkung", "the limitation"]
  - [der-ausblick, "der Ausblick", "the outlook"]
  - [die-gutachterin, "die Gutachterin", "the examiner (f)", {rare: true}]
dialogue:
  - [protagonist, "Im Rahmen dieser Arbeit untersuche ich folgende Forschungsfrage: Wie lernen Erwachsene Fachsprache?", "Within this thesis I examine the following research question: how do adults learn technical language?"]
  - [protagonist, "Zur Methodik: Ich habe vierzig Lernende über ein Jahr begleitet.", "On methodology: I followed forty learners over one year."]
  - [protagonist, "Es lässt sich zeigen, dass Fachwörter im Kontext doppelt so schnell gelernt werden.", "It can be shown that technical words are learned twice as fast in context."]
  - [hartmann, "Danke. Welche Einschränkungen sehen Sie bei Ihren Ergebnissen?", "Thank you. What limitations do you see in your results?"]
  - [protagonist, "Die Stichprobe ist klein. Das ist eine klare Einschränkung.", "The sample is small. That's a clear limitation."]
  - [hartmann, "Und der Ausblick?", "And the outlook?"]
  - [protagonist, "Eine größere Studie mit Kontrollgruppe wäre der nächste Schritt.", "A larger study with a control group would be the next step."]
  - [hartmann, "Überzeugend. Die Gutachterin und ich beraten uns kurz.", "Convincing. The examiner and I will confer briefly."]
teach:
  - ask: ["Say: within the scope of this thesis.", "Im Rahmen dieser Arbeit.", im-rahmen-dieser-arbeit]
  - ask: ["Say: the research question.", "Die Forschungsfrage.", die-forschungsfrage]
  - ask: ["Say: the thesis defence.", "Das Kolloquium.", das-kolloquium]
  - note: ["Academic register avoids 'I think': «Es lässt sich zeigen, dass…» (it can be shown), «im Rahmen dieser Arbeit», «Zur Methodik:». It names its own limits («Einschränkung») and ends with an outlook («Ausblick»)."]
  - ask: ["Say: on methodology.", "Zur Methodik.", die-methodik]
  - ask: ["Say: it can be shown that…", "Es lässt sich zeigen, dass…", es-laesst-sich-zeigen]
  - ask: ["Say: technical language.", "Die Fachsprache.", die-fachsprache]
  - ask: ["Say: a clear limitation of the results.", "Eine klare Einschränkung der Ergebnisse.", die-einschraenkung, die-ergebnisse]
  - ask: ["Say: the outlook.", "Der Ausblick.", der-ausblick]
  - ask: ["Say: the examiner.", "Die Gutachterin.", die-gutachterin]
  - note: ["In a German thesis defence, naming the limits of your own work is a strength, not a weakness. Structure: question, method, results, limitations, outlook — and expect precise follow-up questions."]
