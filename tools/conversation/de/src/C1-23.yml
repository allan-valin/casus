id: C1-23
protagonist: f
title: ["A complaint", "شكوى", "Жалба"]
situation:
  - "You applied for a flat: no reply. Svenja applied for the same flat with her German name: invited at once. You go to the anti-discrimination advice centre."
  - "تقدّمتِ لشقة: لا رد. سفينيا تقدّمت للشقة نفسها باسمها الألماني: دُعيت فورًا. تذهبين إلى مركز استشارات مكافحة التمييز."
  - "Се пријавивте за стан: нема одговор. Свења се пријави за истиот стан со германското име: веднаш поканета. Одите во советувалиштето против дискриминација."
learn: [c1-modal-subjective]
culture: Taking discrimination further
items:
  - [die-diskriminierung, "die Diskriminierung", "discrimination", "التمييز", "дискриминацијата"]
  - [die-antidiskriminierungsstelle, "die Antidiskriminierungsberatung", "anti-discrimination advice", "استشارات مكافحة التمييز", "советувалиштето против дискриминација", {rare: true}]
  - [das-agg, "das Gleichbehandlungsgesetz", "the equal treatment act (AGG)", "قانون المساواة في المعاملة", "законот за еднаков третман", {rare: true}]
  - [der-test-bewerbung, "die Testing-Anfrage", "a matched test application", "طلب اختباري مقارن", "тест-пријава", {rare: true}]
  - [der-beweis-c1, "das Indiz", "the circumstantial evidence", "القرينة", "индицијата", {rare: true}]
  - [verstoesst-gegen, "verstößt gegen", "violates", "يخالف", "ги прекршува"]
  - [will-gewusst-haben, "will nichts gewusst haben", "claims to have known nothing", "يزعم أنه لم يعلم شيئًا", "тврди дека ништо не знаел"]
  - [die-entschaedigung, "die Entschädigung", "compensation", "التعويض", "обештетувањето"]
  - [die-frist-zwei-monate, "innerhalb von zwei Monaten", "within two months", "خلال شهرين", "во рок од два месеци"]
  - [schriftlich-geltend-machen, "schriftlich geltend machen", "assert in writing", "يطالب كتابيًا", "писмено бара"]
dialogue:
  - [protagonist, "Ich bekam keine Antwort. Meine Freundin Svenja bekam sofort eine Einladung — für dieselbe Wohnung.", "I got no reply. My friend Svenja got an invitation straight away — for the same flat.", "لم أتلقَّ ردًا. صديقتي سفينيا تلقّت دعوة فورًا — للشقة نفسها.", "Не добив одговор. Мојата пријателка Свења веднаш доби покана — за истиот стан."]
  - [beraterin, "Das ist ein starkes Indiz. Das dürfte gegen das Gleichbehandlungsgesetz verstoßen.", "That's strong circumstantial evidence. That is likely to violate the Equal Treatment Act.", "هذه قرينة قوية. يُرجَّح أنّ ذلك يخالف قانون المساواة في المعاملة.", "Тоа е силна индиција. Тоа веројатно го прекршува законот за еднаков третман."]
  - [protagonist, "Der Vermieter sagt, die Wohnung sei schon vergeben gewesen.", "The landlord says the flat had already been taken.", "المؤجِّر يقول إنّ الشقة كانت محجوزة بالفعل.", "Станодавецот вели дека станот веќе бил даден."]
  - [beraterin, "Er will davon nichts gewusst haben? Aber Ihre Freundin wurde danach eingeladen. Er soll das übrigens öfter machen.", "He claims to have known nothing? But your friend was invited after you. He's said to do this often, by the way.", "يزعم أنه لم يعلم شيئًا؟ لكن صديقتكِ دُعيت بعدكِ. ويُقال بالمناسبة إنه يفعل ذلك كثيرًا.", "Тврди дека ништо не знаел? Но вашата пријателка беше поканета потоа. Патем, наводно тоа често го прави."]
  - [protagonist, "Was kann ich tun?", "What can I do?", "ماذا يمكنني أن أفعل؟", "Што можам да направам?"]
  - [beraterin, "Sie können eine Entschädigung schriftlich geltend machen — innerhalb von zwei Monaten. Wir helfen beim Brief.", "You can claim compensation in writing — within two months. We'll help with the letter.", "يمكنكِ المطالبة بتعويض كتابيًا — خلال شهرين. سنساعدكِ في الرسالة.", "Можете писмено да барате обештетување — во рок од два месеци. Ќе ви помогнеме со писмото."]
  - [protagonist, "Ich will keine Wohnung von ihm. Aber er soll es nicht wieder tun.", "I don't want a flat from him. But he shouldn't do it again.", "لا أريد شقة منه. لكن يجب ألّا يكرّر ذلك.", "Не сакам стан од него. Но не треба повторно да го прави тоа."]
  - [beraterin, "Genau dafür ist die Beschwerde da. Sie sind nicht allein.", "That's exactly what the complaint is for. You're not alone.", "لهذا بالضبط وُجدت الشكوى. لستِ وحدكِ.", "Токму за тоа е жалбата. Не сте сами."]
teach:
  - ask: ["Say: discrimination.", "قولي: التمييز.", "Кажете: дискриминација.", "Die Diskriminierung.", die-diskriminierung]
  - ask: ["Say: anti-discrimination advice.", "قولي: استشارات مكافحة التمييز.", "Кажете: советувалиште против дискриминација.", "Die Antidiskriminierungsberatung.", die-antidiskriminierungsstelle]
  - ask: ["She says: strong circumstantial evidence.", "تقول: قرينة قوية.", "Таа вели: силна индиција.", "Ein starkes Indiz.", der-beweis-c1]
  - note: ["Modal verbs to weigh claims: «Das dürfte gegen das Gesetz verstoßen» (is likely to), «Er will nichts gewusst haben» (claims — she doubts it), «Er soll das öfter machen» (is said to — hearsay).", "أفعال مساعدة لوزن الادّعاءات: «Das dürfte gegen das Gesetz verstoßen» (يُرجَّح)، «Er will nichts gewusst haben» (يزعم — وهي تشكّ)، «Er soll das öfter machen» (يُقال — نقلًا).", "Модални глаголи за проценка на тврдења: «Das dürfte gegen das Gesetz verstoßen» (веројатно), «Er will nichts gewusst haben» (тврди — таа се сомнева), «Er soll das öfter machen» (наводно — од слушање)."]
  - ask: ["Say: that's likely to violate the law.", "قولي: يُرجَّح أنّ ذلك يخالف القانون.", "Кажете: тоа веројатно го прекршува законот.", "Das dürfte gegen das Gesetz verstoßen.", verstoesst-gegen, das-agg]
  - ask: ["Say doubtfully: he claims to have known nothing.", "قولي بشكّ: يزعم أنه لم يعلم شيئًا.", "Кажете со сомнеж: тврди дека ништо не знаел.", "Er will nichts gewusst haben.", will-gewusst-haben]
  - ask: ["Say: a matched test application.", "قولي: طلب اختباري مقارن.", "Кажете: тест-пријава.", "Eine Testing-Anfrage.", der-test-bewerbung]
  - ask: ["Say: compensation.", "قولي: تعويض.", "Кажете: обештетување.", "Eine Entschädigung.", die-entschaedigung]
  - ask: ["Say: claim it in writing, within two months.", "قولي: طالبي كتابيًا، خلال شهرين.", "Кажете: барајте писмено, во рок од два месеци.", "Schriftlich geltend machen, innerhalb von zwei Monaten.", schriftlich-geltend-machen, die-frist-zwei-monate]
  - note: ["The Equal Treatment Act (AGG) forbids discrimination by origin, religion, sex and more in housing and work. A matched application — same profile, a German name — is accepted as evidence. Claims must be made in writing within two months. Free anti-discrimination advice centres help with letters and next steps; the first-day version of this topic was A1-25.", "قانون المساواة في المعاملة (AGG) يمنع التمييز بسبب الأصل والدين والجنس وغيرها في السكن والعمل. والطلب الاختباري المقارن — الملف نفسه باسم ألماني — يُقبل دليلًا. ويجب تقديم المطالبات كتابيًا خلال شهرين. ومراكز استشارات مكافحة التمييز المجانية تساعد في الرسائل والخطوات التالية.", "Законот за еднаков третман (AGG) забранува дискриминација по потекло, религија, пол и друго во домувањето и работата. Тест-пријава — ист профил, германско име — се прифаќа како доказ. Барањата се поднесуваат писмено во рок од два месеци. Бесплатните советувалишта против дискриминација помагаат со писмата и следните чекори."]
