id: B2-13-m
tracks: [mk]
protagonist: m
title: ["Дедо чува дете"]
situation: ["Петар и Ања работат цел ден. Вие го земате Лука од градинка и го чувате до вечер."]
learn: [b2-formal-requests]
culture: Grandparents as childcare
items:
  - [abholen, "abholen", "зема (некого од некаде)"]
  - [die-abholberechtigung, "die Abholberechtigung", "овластувањето за земање", {rare: true}]
  - [aufpassen-auf, "aufpassen auf", "чува, внимава на"]
  - [der-mittagsschlaf, "der Mittagsschlaf", "попладневниот сон"]
  - [das-abendessen, "das Abendessen", "вечерата"]
  - [koennten-sie-bitte, "Könnten Sie bitte …?", "Дали би можеле, ве молам …?"]
  - [ich-moechte-sie-bitten, "Ich möchte Sie bitten, …", "Би сакал да ве замолам …"]
  - [muede, "müde", "уморен"]
  - [das-bilderbuch, "das Bilderbuch", "сликовницата"]
  - [bis-sechs, "bis sechs Uhr", "до шест часот"]
dialogue:
  - [kruger, "Guten Tag! Sie holen Luka heute ab? Stehen Sie auf der Abholberechtigung?", "Добар ден! Вие го земате Лука денес? Дали сте на списокот со овластени?"]
  - [protagonist, "Ja, ich bin der Opa. Mein Sohn hat mich eingetragen.", "Да, јас сум дедото. Синот ме запиша."]
  - [kruger, "Gut. Er hatte keinen Mittagsschlaf, er ist müde.", "Добро. Немаше попладневен сон, уморен е."]
  - [protagonist, "Könnten Sie mir bitte seine Jacke geben? ... Danke.", "Дали би можеле, ве молам, да ми ја дадете јакната? ... Благодарам."]
  - [luka, "Opa! Liest du mir das Bilderbuch vor?", "Дедо! Ќе ми ја прочиташ сликовницата?"]
  - [protagonist, "Natürlich. Und dann Abendessen. Mama und Papa kommen um sechs.", "Се разбира. А потоа вечера. Мама и тато доаѓаат во шест."]
  - [kruger, "Ich möchte Sie bitten, morgen Gummistiefel mitzubringen. Wir gehen in den Wald.", "Би сакала да ве замолам утре да донесете гумени чизми. Одиме во шума."]
  - [protagonist, "Mache ich. Wir passen gut auf ihn auf.", "Ќе донесам. Добро ќе внимаваме на него."]
teach:
  - ask: ["Кажете: го земам Лука.", "Ich hole Luka ab.", abholen]
  - ask: ["Таа прашува за овластувањето за земање.", "Die Abholberechtigung.", die-abholberechtigung]
  - ask: ["Таа вели: немаше попладневен сон.", "Er hatte keinen Mittagsschlaf.", der-mittagsschlaf]
  - ask: ["Таа вели: уморен е.", "Er ist müde.", muede]
  - note: ["Учтиви барања: «Könnten Sie bitte …?» (дали би можеле…), «Ich möchte Sie bitten, … zu …» (би сакала да ве замолам…). Глаголот оди на крајот со «zu»."]
  - ask: ["Прашајте учтиво за јакната.", "Könnten Sie mir bitte seine Jacke geben?", koennten-sie-bitte]
  - ask: ["Лука: ќе ми ја прочиташ сликовницата?", "Liest du mir das Bilderbuch vor?", das-bilderbuch]
  - ask: ["Кажете: а потоа вечера.", "Und dann Abendessen.", das-abendessen]
  - ask: ["Кажете: доаѓаат во шест.", "Sie kommen um sechs.", bis-sechs]
  - ask: ["Таа вели: би сакала да ве замолам…", "Ich möchte Sie bitten, …", ich-moechte-sie-bitten]
  - ask: ["Кажете: добро ќе внимаваме на него.", "Wir passen gut auf ihn auf.", aufpassen-auf]
  - note: ["Градинката го дава детето само на луѓе запишани на списокот со овластени — родителите мора да ве запишат однапред, а понекогаш бараат и лична карта. Многу германски семејства немаат баби и дедовци во близина; вашата помош е голем подарок."]
