id: C1-27
protagonist: f
title: ["Visitors from home", "زوّار من الوطن", "Гости од дома"]
situation:
  - "Your sister and her husband are back for a week. You show them Leipzig — and at dinner with Jonas and Svenja, two cultures share one table."
  - "أختكِ وزوجها عادا لأسبوع. تُرينهما لايبزيغ — وعلى العشاء مع يوناس وسفينيا، تجتمع ثقافتان على طاولة واحدة."
  - "Сестра ви и нејзиниот сопруг пак се тука за една недела. Им го покажувате Лајпциг — а на вечера со Јонас и Свења, две култури на една маса."
learn: [c1-particles]
culture: Two cultures at one table
items:
  - [die-stadtfuehrung, "die Stadtführung", "the city tour", "الجولة في المدينة", "обиколката на градот"]
  - [das-voelkerschlachtdenkmal, "das Völkerschlachtdenkmal", "the Monument to the Battle of the Nations", "نصب معركة الأمم", "Споменикот на битката на народите", {rare: true}]
  - [die-thomaskirche, "die Thomaskirche", "St Thomas Church (Bach's church)", "كنيسة القديس توما", "Црквата Св. Тома"]
  - [die-friedliche-revolution, "die Friedliche Revolution", "the Peaceful Revolution (1989)", "الثورة السلمية", "Мирната револуција"]
  - [ueberhaupt, "überhaupt", "(particle) at all, anyway", "(أداة) أصلًا", "(честичка) воопшто"]
  - [eben-mal, "eben mal", "(particle) quickly, just", "(أداة) بسرعة، فقط", "(честичка) набрзина"]
  - [die-kerze, "die Kerze", "the candle", "الشمعة", "свеќата"]
  - [uebersetzen, "übersetzen", "translate", "يترجم", "преведува"]
  - [die-gewohnheit, "die Gewohnheit", "the habit, custom", "العادة", "навиката"]
  - [beide-kulturen, "beide Kulturen", "both cultures", "الثقافتان", "двете култури"]
dialogue:
  - [schwester, "Und hier hat Bach gearbeitet? In der Thomaskirche?", "And Bach worked here? In St Thomas Church?", "وهنا عمل باخ؟ في كنيسة القديس توما؟", "И тука работел Бах? Во Црквата Св. Тома?"]
  - [protagonist, "Ja! Und 1989 begann hier die Friedliche Revolution — mit Kerzen, nicht mit Waffen.", "Yes! And in 1989 the Peaceful Revolution started here — with candles, not weapons.", "نعم! وفي 1989 بدأت هنا الثورة السلمية — بالشموع لا بالسلاح.", "Да! А во 1989 тука почна Мирната револуција — со свеќи, не со оружје."]
  - [schwager, "Das wusste ich überhaupt nicht.", "I didn't know that at all.", "لم أكن أعرف ذلك أصلًا.", "Тоа воопшто не го знаев."]
  - [svenja, "Setzt euch! Ich hole eben mal das Essen.", "Sit down! I'll just get the food.", "اجلسوا! سأحضر الطعام بسرعة.", "Седнете! Набрзина ќе ја донесам храната."]
  - [schwester, "Warum isst man hier um sechs? Bei uns isst man um neun!", "Why do people eat at six here? With us people eat at nine!", "لماذا يأكلون هنا في السادسة؟ عندنا نأكل في التاسعة!", "Зошто тука се јаде во шест? Кај нас се јаде во девет!"]
  - [jonas, "Na ja, wir stehen eben früh auf. Was ist bei euch noch anders?", "Well, we get up early, that's all. What else is different with you?", "حسنًا، نحن نستيقظ باكرًا فقط. ما الذي يختلف عندكم أيضًا؟", "Па, ние едноставно рано стануваме. Што уште е различно кај вас?"]
  - [protagonist, "Ich übersetze: Sie sagt, bei uns bleibt niemand unter drei Stunden am Tisch.", "I'll translate: she says with us no one leaves the table in under three hours.", "سأترجم: تقول إنه عندنا لا يقوم أحد عن الطاولة قبل ثلاث ساعات.", "Ќе преведам: вели дека кај нас никој не станува од маса за помалку од три часа."]
  - [svenja, "Dann machen wir heute beide Kulturen: um sechs anfangen, um neun aufhören!", "Then tonight we'll do both cultures: start at six, stop at nine!", "إذن نجمع الليلة الثقافتين: نبدأ في السادسة وننتهي في التاسعة!", "Тогаш вечерва правиме двете култури: почнуваме во шест, завршуваме во девет!"]
teach:
  - ask: ["Say: the city tour.", "قولي: الجولة في المدينة.", "Кажете: обиколката на градот.", "Die Stadtführung.", die-stadtfuehrung]
  - ask: ["Say: St Thomas Church.", "قولي: كنيسة القديس توما.", "Кажете: Црквата Св. Тома.", "Die Thomaskirche.", die-thomaskirche]
  - ask: ["Say: the Peaceful Revolution.", "قولي: الثورة السلمية.", "Кажете: Мирната револуција.", "Die Friedliche Revolution.", die-friedliche-revolution]
  - ask: ["Say: the Monument to the Battle of the Nations.", "قولي: نصب معركة الأمم.", "Кажете: Споменикот на битката на народите.", "Das Völkerschlachtdenkmal.", das-voelkerschlachtdenkmal]
  - note: ["Particles again: «überhaupt» (at all — strengthens a negative), «eben mal» (just quickly), «na ja» (well… — hesitating), «eben» (that's just how it is).", "أدوات مرة أخرى: «überhaupt» (أصلًا — تقوّي النفي)، «eben mal» (بسرعة فقط)، «na ja» (حسنًا… — تردّد)، «eben» (هكذا الأمر فقط).", "Пак честички: «überhaupt» (воопшто — ја засилува негацијата), «eben mal» (набрзина), «na ja» (па… — двоумење), «eben» (така е едноставно)."]
  - ask: ["Say: I didn't know that at all.", "قولي: لم أكن أعرف ذلك أصلًا.", "Кажете: тоа воопшто не го знаев.", "Das wusste ich überhaupt nicht.", ueberhaupt]
  - ask: ["Svenja: I'll just get the food.", "سفينيا: سأحضر الطعام بسرعة.", "Свења: набрзина ќе ја донесам храната.", "Ich hole eben mal das Essen.", eben-mal]
  - ask: ["Jonas hesitates: well…", "يوناس يتردّد: حسنًا…", "Јонас се двоуми: па…", "Na ja…", na-ja]
  - ask: ["Say: with candles, not weapons.", "قولي: بالشموع لا بالسلاح.", "Кажете: со свеќи, не со оружје.", "Mit Kerzen, nicht mit Waffen.", die-kerze]
  - ask: ["Say: I'll translate.", "قولي: سأترجم.", "Кажете: ќе преведам.", "Ich übersetze.", uebersetzen]
  - ask: ["Say: a custom.", "قولي: عادة.", "Кажете: навика.", "Eine Gewohnheit.", die-gewohnheit]
  - ask: ["Say: both cultures.", "قولي: الثقافتان.", "Кажете: двете култури.", "Beide Kulturen.", beide-kulturen]
  - note: ["Leipzig: Bach was cantor at St Thomas for 27 years; the Monday demonstrations of autumn 1989 started at St Nicholas Church and helped bring down the GDR without violence. When family visits, you become the interpreter of two cultures — dinner times, table manners, how long a visit lasts.", "لايبزيغ: كان باخ قائد جوقة كنيسة القديس توما 27 عامًا؛ ومظاهرات الاثنين في خريف 1989 بدأت من كنيسة القديس نيكولاي وساعدت على إسقاط ألمانيا الشرقية دون عنف. وحين تزوركِ العائلة تصبحين مترجمة بين ثقافتين — مواعيد الطعام، وآداب المائدة، ومدة الزيارة.", "Лајпциг: Бах бил кантор во Св. Тома 27 години; понеделничните демонстрации есента 1989 почнале од Црквата Св. Никола и помогнале ГДР да падне без насилство. Кога ве посетува семејството, станувате преведувач меѓу две култури — време за вечера, манири на маса, колку трае посетата."]
