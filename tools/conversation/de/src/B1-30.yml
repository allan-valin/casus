id: B1-30
protagonist: m
title: ["Irony", "السخرية", "Иронија"]
situation:
  - "Rain on the day of the planned picnic. Jonas's dry humour — and a look back at the whole of B1."
  - "مطر في يوم النزهة المخطّط لها. فكاهة يوناس الجافة — ونظرة إلى المستوى B1 كله."
  - "Дожд на денот на планираниот пикник. Сувиот хумор на Јонас — и поглед наназад кон целото B1."
learn: []
culture: Irony, decoded
items:
  - [na-toll, "Na toll!", "Oh great! (ironic)", "رائع جدًا! (ساخرًا)", "Баш убаво! (иронично)"]
  - [sehr-witzig, "Sehr witzig!", "Very funny! (ironic)", "مضحك جدًا! (ساخرًا)", "Многу смешно! (иронично)"]
  - [die-ironie, "die Ironie", "irony", "السخرية", "иронијата"]
  - [meinst-du-das-ernst, "Meinst du das ernst?", "Are you serious?", "هل تقصد ذلك جديًا؟", "Сериозно ли мислиш?"]
  - [das-picknick, "das Picknick", "the picnic", "النزهة", "пикникот"]
  - [es-regnet-in-stroemen, "es regnet in Strömen", "it's pouring", "إنها تمطر بغزارة", "врне како од кабел"]
  - [genau-das-gegenteil, "genau das Gegenteil", "exactly the opposite", "العكس تمامًا", "токму спротивното"]
  - [der-ton, "der Ton", "the tone", "النبرة", "тонот"]
  - [erkennen, "erkennen", "recognise", "يعرف، يميّز", "препознава"]
  - [na-ja, "na ja", "well… (hesitant)", "حسنًا… (بتردّد)", "па…"]
dialogue:
  - [jonas, "Es regnet in Strömen. Na toll! Perfektes Picknickwetter.", "It's pouring. Oh great! Perfect picnic weather.", "إنها تمطر بغزارة. رائع جدًا! طقس مثالي للنزهة.", "Врне како од кабел. Баш убаво! Совршено време за пикник."]
  - [protagonist, "Meinst du das ernst?", "Are you serious?", "هل تقصد ذلك جديًا؟", "Сериозно ли мислиш?"]
  - [jonas, "Natürlich nicht! Das ist Ironie. Ich meine genau das Gegenteil.", "Of course not! That's irony. I mean exactly the opposite.", "طبعًا لا! هذه سخرية. أقصد العكس تمامًا.", "Се разбира не! Тоа е иронија. Мислам токму спротивното."]
  - [protagonist, "Woran erkenne ich das?", "How do I recognise it?", "كيف أعرف ذلك؟", "По што да го препознаам?"]
  - [jonas, "Am Ton. Und am Gesicht. Ich lache nicht.", "From the tone. And the face. I don't laugh.", "من النبرة. ومن الوجه. أنا لا أضحك.", "По тонот. И по лицето. Не се смеам."]
  - [protagonist, "Dann sage ich: Sehr witzig, Jonas! Wo picknicken wir jetzt?", "Then I'll say: very funny, Jonas! Where are we picnicking now?", "إذن أقول: مضحك جدًا يا يوناس! أين نتنزّه الآن؟", "Тогаш велам: многу смешно, Јонас! Каде сега ќе правиме пикник?"]
  - [jonas, "In meiner WG. Paul hat sogar den Putzplan gemacht. Na ja, fast.", "At my flat-share. Paul even did the cleaning rota. Well, almost.", "في سكني المشترك. باول التزم حتى بجدول التنظيف. حسنًا، تقريبًا.", "Во мојот заеднички стан. Паул дури го направи распоредот за чистење. Па, речиси."]
  - [protagonist, "Na toll! Dann putze ich vorher.", "Oh great! Then I'll clean first.", "رائع جدًا! إذن سأنظّف قبلها.", "Баш убаво! Тогаш прво ќе чистам."]
  - [jonas, "Siehst du? Jetzt kannst du es auch!", "See? Now you can do it too!", "أرأيت؟ الآن تستطيع ذلك أنت أيضًا!", "Гледаш? Сега и ти знаеш!"]
teach:
  - ask: ["Say: it's pouring.", "قل: إنها تمطر بغزارة.", "Кажете: врне како од кабел.", "Es regnet in Strömen.", es-regnet-in-stroemen]
  - ask: ["Say, ironically: oh great!", "قل ساخرًا: رائع جدًا!", "Кажете иронично: баш убаво!", "Na toll!", na-toll]
  - ask: ["Ask: are you serious?", "اسأل: هل تقصد ذلك جديًا؟", "Прашајте: сериозно ли мислиш?", "Meinst du das ernst?", meinst-du-das-ernst]
  - ask: ["He says: that's irony.", "يقول: هذه سخرية.", "Тој вели: тоа е иронија.", "Das ist Ironie.", die-ironie]
  - ask: ["He says: I mean exactly the opposite.", "يقول: أقصد العكس تمامًا.", "Тој вели: мислам токму спротивното.", "Ich meine genau das Gegenteil.", genau-das-gegenteil]
  - ask: ["He says: from the tone.", "يقول: من النبرة.", "Тој вели: по тонот.", "Am Ton.", der-ton]
  - ask: ["Ask: how do I recognise it?", "اسأل: كيف أعرف ذلك؟", "Прашајте: по што да го препознаам?", "Woran erkenne ich das?", erkennen]
  - ask: ["He hesitates: well, almost.", "يتردّد: حسنًا، تقريبًا.", "Тој се двоуми: па, речиси.", "Na ja, fast.", na-ja]
  - ask: ["Say, ironically: very funny!", "قل ساخرًا: مضحك جدًا!", "Кажете иронично: многу смешно!", "Sehr witzig!", sehr-witzig]
  - ask: ["Say: the picnic.", "قل: النزهة.", "Кажете: пикникот.", "Das Picknick.", das-picknick]
  - note: ["End of B1. Some more from the whole level.", "نهاية المستوى B1. مزيد من المستوى كله.", "Крај на B1. Уште малку од целото ниво."]
  - ask: ["In the WG: whose turn is it this week?", "في السكن المشترك: دور من هذا الأسبوع؟", "Во заедничкиот стан: кој е на ред оваа недела?", "Wer ist diese Woche dran?", ist-dran]
  - ask: ["Give your opinion: I think that…", "أبدِ رأيك: أرى أنّ…", "Кажете мислење: мислам дека…", "Ich finde, dass…", ich-finde-dass]
  - ask: ["Dream aloud: if I were rich…", "احلم بصوت عالٍ: لو كنتُ غنيًا…", "Сонувајте на глас: да сум богат…", "Wenn ich reich wäre…", wenn-ich]
  - ask: ["At the viewing: and the deposit?", "في المعاينة: والتأمين؟", "На разгледувањето: а депозитот?", "Und die Kaution?", die-kaution]
  - ask: ["Frau Becker offers du. What does she say?", "السيدة بيكر تعرض «du». ماذا تقول؟", "Госпоѓа Бекер нуди «du». Што вели?", "Wollen wir uns duzen?", wollen-wir-uns-duzen]
  - note: ["German irony is dry: the words say the opposite, the face stays straight. «Na toll!», «Super!», «Sehr witzig!» said flatly mean the reverse. If you're unsure, ask «Meinst du das ernst?» — nobody minds.", "السخرية الألمانية جافة: الكلمات تقول العكس، والوجه يبقى جادًا. «Na toll!» و«Super!» و«Sehr witzig!» بنبرة مسطّحة تعني العكس. إذا لم تكن متأكدًا، اسأل «Meinst du das ernst?» — لا أحد ينزعج.", "Германската иронија е сува: зборовите кажуваат спротивно, лицето останува сериозно. «Na toll!», «Super!», «Sehr witzig!» кажани рамно значат обратно. Ако не сте сигурни, прашајте «Meinst du das ernst?» — никому не му пречи."]
