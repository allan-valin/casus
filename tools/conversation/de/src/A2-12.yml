id: A2-12
protagonist: m
title: ["Summer", "الصيف", "Летото"]
situation:
  - "June. Light at four in the morning, still light at ten at night. Then a heat wave."
  - "يونيو. الضوء في الرابعة صباحًا، وما زال النهار في العاشرة ليلًا. ثم موجة حرّ."
  - "Јуни. Светло во четири наутро, сѐ уште светло во десет навечер. Потоа топлотен бран."
learn: [de-adj_05]
culture: No air conditioning
items:
  - [die-hitze, "die Hitze", "the heat", "الحرّ", "жештината"]
  - [heisser-als, "heißer als", "hotter than", "أحرّ من", "пожешко од"]
  - [schwitzen, "schwitzen", "sweat", "يعرق", "се потам"]
  - [der-ventilator, "der Ventilator", "the fan", "المروحة", "вентилаторот"]
  - [keine-klimaanlage, "keine Klimaanlage", "no air conditioning", "لا مكيّف", "нема клима"]
  - [ausverkauft, "ausverkauft", "sold out", "نفد", "распродадено"]
  - [die-vorhaenge, "die Vorhänge", "the curtains", "الستائر", "завесите"]
  - [noch-hell, "noch hell", "still light", "ما زال مضيئًا", "уште светло"]
  - [am-laengsten, "am längsten", "the longest", "الأطول", "најдолго"]
  - [die-nacht-kurz, "die Nacht ist kurz", "the night is short", "الليل قصير", "ноќта е кратка"]
dialogue:
  - [protagonist, "Es ist zehn Uhr abends und noch hell!", "It's ten in the evening and still light!", "الساعة العاشرة مساءً وما زال الجو مضيئًا!", "Десет навечер е, а уште е светло!"]
  - [jonas, "Im Juni sind die Tage am längsten. Die Nacht ist kurz.", "In June the days are longest. The night is short.", "في يونيو الأيام هي الأطول. والليل قصير.", "Во јуни деновите се најдолги. Ноќта е кратка."]
  - [protagonist, "Und diese Hitze! Heißer als bei mir zu Hause.", "And this heat! Hotter than at home.", "وهذا الحرّ! أحرّ مما في بلدي.", "А оваа жештина! Пожешко отколку дома."]
  - [jonas, "Fünfunddreißig Grad. Ich schwitze nur.", "Thirty-five degrees. I'm just sweating.", "خمس وثلاثون درجة. لا أفعل إلا العرق.", "Триесет и пет степени. Само се потам."]
  - [protagonist, "Hast du eine Klimaanlage?", "Do you have air conditioning?", "هل عندك مكيّف؟", "Имаш ли клима?"]
  - [jonas, "Nein, keine Klimaanlage. Fast niemand hat eine.", "No, no air conditioning. Almost nobody has one.", "لا، لا مكيّف. تقريبًا لا أحد عنده.", "Не, нема клима. Речиси никој нема."]
  - [protagonist, "Dann kaufe ich einen Ventilator.", "Then I'll buy a fan.", "إذن سأشتري مروحة.", "Тогаш ќе купам вентилатор."]
  - [jonas, "Viel Glück — die Ventilatoren sind überall ausverkauft!", "Good luck — fans are sold out everywhere!", "حظًا موفقًا — المراوح نفدت في كل مكان!", "Среќно — вентилаторите се распродадени насекаде!"]
  - [protagonist, "Und wie schläfst du?", "And how do you sleep?", "وكيف تنام؟", "А како спиеш?"]
  - [jonas, "Tagsüber die Vorhänge zu, nachts die Fenster auf.", "Curtains closed by day, windows open at night.", "الستائر مغلقة نهارًا، والنوافذ مفتوحة ليلًا.", "Дење завесите затворени, ноќе прозорците отворени."]
teach:
  - ask: ["Say: it's ten in the evening and still light!", "قل: الساعة العاشرة مساءً وما زال الجو مضيئًا!", "Кажете: десет навечер е, а уште е светло!", "Es ist zehn Uhr abends und noch hell!", noch-hell]
  - ask: ["Say: in June the days are longest.", "قل: في يونيو الأيام هي الأطول.", "Кажете: во јуни деновите се најдолги.", "Im Juni sind die Tage am längsten.", am-laengsten]
  - ask: ["Say: the night is short.", "قل: الليل قصير.", "Кажете: ноќта е кратка.", "Die Nacht ist kurz.", die-nacht-kurz]
  - ask: ["Say: this heat!", "قل: هذا الحرّ!", "Кажете: оваа жештина!", "Diese Hitze!", die-hitze]
  - ask: ["Say: hotter than at home.", "قل: أحرّ مما في بلدي.", "Кажете: пожешко отколку дома.", "Heißer als zu Hause.", heisser-als]
  - ask: ["Say: I'm sweating.", "قل: أنا أعرق.", "Кажете: се потам.", "Ich schwitze.", schwitzen]
  - ask: ["Say: no air conditioning.", "قل: لا مكيّف.", "Кажете: нема клима.", "Keine Klimaanlage.", keine-klimaanlage]
  - ask: ["Say: I'll buy a fan.", "قل: سأشتري مروحة.", "Кажете: ќе купам вентилатор.", "Ich kaufe einen Ventilator.", der-ventilator]
  - ask: ["Say: sold out everywhere.", "قل: نفدت في كل مكان.", "Кажете: распродадено насекаде.", "Überall ausverkauft.", ausverkauft]
  - ask: ["Say: curtains closed by day.", "قل: الستائر مغلقة نهارًا.", "Кажете: дење завесите затворени.", "Tagsüber die Vorhänge zu.", die-vorhaenge]
  - note: ["Summer days are very long — light from about four to ten. Heat waves now reach the high thirties, but homes have no air conditioning, and fans sell out fast. Many people buy blackout curtains to sleep.", "أيام الصيف طويلة جدًا — ضوء من الرابعة تقريبًا حتى العاشرة. وموجات الحرّ تبلغ الآن أواخر الثلاثينات، لكن البيوت بلا مكيّفات، والمراوح تنفد سريعًا. كثيرون يشترون ستائر معتمة للنوم.", "Летните денови се многу долги — светло од околу четири до десет. Топлотните бранови сега достигнуваат кон четириесет, но домовите немаат клима, а вентилаторите брзо се распродаваат. Многумина купуваат темни завеси за спиење."]
