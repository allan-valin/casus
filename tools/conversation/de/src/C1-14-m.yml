id: C1-14-m
tracks: [mk]
protagonist: m
title: ["Локални избори"]
situation: ["Во поштенското сандаче: известување за гласање. Како граѓанин на ЕУ, вие смеете да гласате на локалните избори во Лајпциг!"]
learn: [c1-konjunktiv-i]
culture: Who may vote
items:
  - [die-wahlbenachrichtigung, "die Wahlbenachrichtigung", "известувањето за гласање", {rare: true}]
  - [das-kommunale-wahlrecht, "das kommunale Wahlrecht", "правото на глас на локални избори", {rare: true}]
  - [das-wahllokal, "das Wahllokal", "избирачкото место"]
  - [der-stadtrat, "der Stadtrat", "градскиот совет"]
  - [der-stimmzettel, "der Stimmzettel", "гласачкото ливче"]
  - [es-heisse, "es heiße …", "(пренесено) се вели дека …"]
  - [man-duerfe, "man dürfe …", "(пренесено) дека смее …"]
  - [ankreuzen, "ankreuzen", "заокружува со крст"]
  - [die-briefwahl, "die Briefwahl", "гласањето по пошта", {rare: true}]
  - [die-europawahl, "die Europawahl", "европските избори", {rare: true}]
dialogue:
  - [protagonist, "Petar, schau! Eine Wahlbenachrichtigung — für mich?", "Петре, види! Известување за гласање — за мене?"]
  - [petar, "Ja! Als EU-Bürger mit Wohnsitz hier hast du das kommunale Wahlrecht.", "Да! Како граѓанин на ЕУ со живеалиште тука имаш право на глас на локалните избори."]
  - [protagonist, "Für den Stadtrat? Und für den Bundestag?", "За градскиот совет? А за Бундестагот?"]
  - [petar, "Nur Stadtrat und Europawahl. Den Bundestag wählen nur Deutsche.", "Само градскиот совет и европските избори. Бундестагот го избираат само Германците."]
  - [protagonist, "Frau Wolf sagt, es heiße, man dürfe drei Stimmen geben. Stimmt das?", "Госпоѓа Волф вели дека, се вели, човек смее да даде три гласа. Точно ли е?"]
  - [petar, "In Sachsen ja. Du kreuzt auf dem Stimmzettel bis zu drei Namen an.", "Во Саксонија да. Заокружуваш на гласачкото ливче до три имиња."]
  - [protagonist, "Und wenn wir im Sommer in Bitola sind?", "А ако во лето сме во Битола?"]
  - [petar, "Dann machst du Briefwahl. So verpasst du nichts.", "Тогаш гласаш по пошта. Така ништо не пропушташ."]
teach:
  - ask: ["Кажете: известување за гласање.", "Eine Wahlbenachrichtigung.", die-wahlbenachrichtigung]
  - ask: ["Кажете: право на глас на локални избори.", "Das kommunale Wahlrecht.", das-kommunale-wahlrecht]
  - ask: ["Кажете: градскиот совет.", "Der Stadtrat.", der-stadtrat]
  - ask: ["Кажете: европските избори.", "Die Europawahl.", die-europawahl]
  - note: ["Konjunktiv I за нешто што сте го слушнале: «Es heiße, man dürfe drei Stimmen geben» (се вели дека смее…). Тоа покажува: не сум проверил."]
  - ask: ["Пренесете: се вели дека смее три гласа.", "Es heiße, man dürfe drei Stimmen geben.", es-heisse, man-duerfe]
  - ask: ["Кажете: на гласачкото ливче.", "Auf dem Stimmzettel.", der-stimmzettel]
  - ask: ["Кажете: заокружувам до три имиња.", "Ich kreuze bis zu drei Namen an.", ankreuzen]
  - ask: ["Кажете: гласање по пошта.", "Die Briefwahl.", die-briefwahl]
  - ask: ["Кажете: избирачкото место.", "Das Wahllokal.", das-wahllokal]
  - note: ["Граѓаните на ЕУ со живеалиште во Германија гласаат на локалните и европските избори, но не и на сојузните и покраинските. Известувањето стигнува по пошта ако сте пријавени. Правилата за бројот на гласови се разликуваат по покраини. Ако сте отсутни, побарајте гласање по пошта навреме."]
