id: B2-11-m
tracks: [mk]
protagonist: m
title: ["Пробниот ден"]
situation: ["Јан, кандидатот за чирак, доаѓа на пробен ден во столарницата на господин Волф. Вие помагате — и потоа му раскажувате на Петар."]
learn: [de-vsub_04]
culture: A family firm
items:
  - [der-probetag, "der Probetag", "пробниот ден", {rare: true}]
  - [die-werkstatt, "die Werkstatt", "работилницата"]
  - [das-holz, "das Holz", "дрвото"]
  - [er-fragte-warum, "er fragte, warum …", "праша зошто …"]
  - [er-wollte-wissen, "er wollte wissen, ob …", "сакаше да знае дали …"]
  - [die-saege, "die Säge", "пилата"]
  - [vorsichtig-m, "Vorsicht!", "Внимание!"]
  - [die-haende, "mit den Händen", "со рацете"]
  - [der-meister, "der Meister", "мајсторот"]
  - [er-hat-talent, "er hat Talent", "има талент"]
dialogue:
  - [herrwolf, "Willkommen in der Werkstatt, Jan. Warum möchtest du Tischler werden?", "Добредојде во работилницата, Јан. Зошто сакаш да станеш столар?"]
  - [azubi, "Ich arbeite gern mit den Händen. Und ich liebe Holz.", "Сакам да работам со рацете. И го сакам дрвото."]
  - [protagonist, "Vorsicht mit der Säge! So hält man sie.", "Внимавај со пилата! Вака се држи."]
  - [azubi, "Danke! Darf ich fragen, ob Sie auch Tischler sind?", "Благодарам! Смеам ли да прашам дали и вие сте столар?"]
  - [protagonist, "Mein Vater war Meister. Ich habe es als Kind gelernt.", "Татко ми беше мајстор. Јас научив како дете."]
  - [petar, "Und? Wie war der Probetag, Papa?", "И? Како беше пробниот ден, тато?"]
  - [protagonist, "Gut! Herr Wolf fragte, warum er Tischler werden will. Und Jan wollte wissen, ob ich auch Tischler bin.", "Добро! Господин Волф праша зошто сака да стане столар. А Јан сакаше да знае дали и јас сум столар."]
  - [petar, "Und? Nimmt er ihn?", "И? Ќе го земе?"]
  - [protagonist, "Ich glaube schon. Er hat Talent.", "Мислам дека да. Има талент."]
teach:
  - ask: ["Кажете: пробниот ден.", "Der Probetag.", der-probetag]
  - ask: ["Кажете: работилницата.", "Die Werkstatt.", die-werkstatt]
  - ask: ["Јан вели: сакам да работам со рацете.", "Ich arbeite gern mit den Händen.", die-haende]
  - ask: ["Јан вели: го сакам дрвото.", "Ich liebe Holz.", das-holz]
  - ask: ["Кажете: внимавај со пилата!", "Vorsicht mit der Säge!", vorsichtig-m, die-saege]
  - ask: ["Кажете: татко ми беше мајстор.", "Mein Vater war Meister.", der-meister]
  - note: ["Пренесување прашања: прашален збор или «ob» + глагол на крајот. «Er fragte, warum er Tischler werden will», «Jan wollte wissen, ob ich Tischler bin»."]
  - ask: ["Пренесете: праша зошто сака да стане столар.", "Er fragte, warum er Tischler werden will.", er-fragte-warum]
  - ask: ["Пренесете: сакаше да знае дали сум столар.", "Er wollte wissen, ob ich Tischler bin.", er-wollte-wissen]
  - ask: ["Кажете: има талент.", "Er hat Talent.", er-hat-talent]
