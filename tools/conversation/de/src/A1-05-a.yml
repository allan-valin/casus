id: A1-05-a
tracks: [ar]
protagonist: f
title: ["طبيبة الأطفال"]
situation: ["حرارة يارا مرتفعة منذ الليل. عيادة طبيبة الأطفال، ومعكِ الدفتر الأصفر."]
learn: [de-cas_03]
culture: The yellow check-up booklet
items:
  - [die-mama, "die Mama", "الأم، ماما"]
  - [hat-fieber, "hat Fieber", "عندها حرارة"]
  - [seit-heute-nacht, "seit heute Nacht", "منذ الليلة الماضية"]
  - [das-u-heft, "das U-Heft", "دفتر الفحوص الأصفر", {rare: true}]
  - [die-karte, "die Karte", "البطاقة (بطاقة التأمين)"]
  - [die-versichertenkarte, "die Versichertenkarte", "بطاقة التأمين الصحي", {rare: true}]
  - [hustet, "hustet", "تسعل"]
  - [ich-gebe-ihnen, "Ich gebe Ihnen …", "أعطيكِ …"]
  - [den-saft-medizin, "einen Saft", "شرابًا (دواء سائل)"]
  - [dreimal-am-tag, "dreimal am Tag", "ثلاث مرات في اليوم"]
  - [gute-besserung, "Gute Besserung!", "شفاءً عاجلًا!"]
  - [vielen-dank, "Vielen Dank", "شكرًا جزيلًا"]
dialogue:
  - [wagner, "Guten Morgen. Was fehlt Yara?", "صباح الخير. ما بها يارا؟"]
  - [protagonist, "Yara hat Fieber. Seit heute Nacht.", "يارا عندها حرارة. منذ الليلة الماضية."]
  - [wagner, "Haben Sie die Versichertenkarte und das U-Heft?", "هل معكِ بطاقة التأمين والدفتر الأصفر؟"]
  - [protagonist, "Ja, hier ist die Karte. Und das U-Heft.", "نعم، هذه البطاقة. وهذا الدفتر."]
  - [wagner, "Danke. Hustet Yara auch?", "شكرًا. هل تسعل يارا أيضًا؟"]
  - [protagonist, "Ja, ein bisschen.", "نعم، قليلًا."]
  - [wagner, "Das ist eine Erkältung. Ich gebe Ihnen einen Saft. Dreimal am Tag.", "هذه نزلة برد. سأعطيكِ شرابًا. ثلاث مرات في اليوم."]
  - [protagonist, "Vielen Dank, Frau Doktor.", "شكرًا جزيلًا يا حضرة الطبيبة."]
  - [wagner, "Gute Besserung, Yara!", "شفاءً عاجلًا يا يارا!"]
teach:
  - ask: ["قولي: يارا عندها حرارة.", "Yara hat Fieber.", hat-fieber]
  - ask: ["قولي: منذ الليلة الماضية.", "Seit heute Nacht.", seit-heute-nacht]
  - ask: ["تطلب الطبيبة بطاقة التأمين. قوليها.", "Die Versichertenkarte.", die-versichertenkarte]
  - note: ["«das U-Heft» دفتر أصفر يُعطى عند الولادة، فيه كل فحوص الطفل الدورية (U1 إلى U9). احمليه في كل زيارة لطبيب الأطفال. وإن لم يكن معكِ، اسألي الطبيبة: سيبدأون دفترًا جديدًا."]
  - ask: ["قولي: هذه البطاقة، وهذا الدفتر الأصفر.", "Hier ist die Karte. Und das U-Heft.", die-karte, das-u-heft]
  - ask: ["تسأل: هل تسعل يارا؟", "Hustet Yara?", hustet]
  - ask: ["أجيبي: قليلًا.", "Ein bisschen.", ein-bisschen]
  - note: ["بعد أفعال مثل «geben» و«haben» يتغير المفعول به المذكر فقط: «ein Saft» يصبح «einen Saft» — «Ich gebe Ihnen einen Saft». أما «eine» و«ein» للمؤنث والمحايد فلا تتغيران."]
  - ask: ["قولي بلسانها: سأعطيكِ شرابًا.", "Ich gebe Ihnen einen Saft.", ich-gebe-ihnen, den-saft-medizin]
  - ask: ["قولي: ثلاث مرات في اليوم.", "Dreimal am Tag.", dreimal-am-tag]
  - ask: ["اشكريها شكرًا جزيلًا.", "Vielen Dank, Frau Doktor.", vielen-dank, frau-doktor]
  - ask: ["تتمنى ليارا الشفاء. كيف؟", "Gute Besserung!", gute-besserung]
  - ask: ["قولي: الأم.", "Die Mama.", die-mama]
