id: B1-29
protagonist: f
title: ["East and West", "الشرق والغرب", "Исток и Запад"]
situation:
  - "A barbecue in the courtyard. Paul from Munich and Frau Becker, who grew up in the GDR, start arguing about the Soli."
  - "حفلة شواء في الفناء. باول القادم من ميونخ والسيدة بيكر التي نشأت في ألمانيا الشرقية يبدآن جدالًا حول ضريبة التضامن."
  - "Скара во дворот. Паул од Минхен и госпоѓа Бекер, која пораснала во ГДР, почнуваат да се расправаат за Soli."
learn: [de-vpass_03]
culture: Germany's own divides
items:
  - [ossi-wessi, "Ossi und Wessi", "East and West Germans (colloquial)", "شرقي وغربي (عاميًا)", "Оси и Веси (разговорно)"]
  - [unsinn, "Unsinn!", "Nonsense!", "هراء!", "Глупости!"]
  - [der-soli, "der Solidaritätszuschlag", "the solidarity surcharge", "ضريبة التضامن", "солидарниот додаток", {rare: true}]
  - [genauso, "genauso", "just the same", "بالقدر نفسه", "исто така"]
  - [wurde-geoeffnet, "wurde geöffnet", "was opened", "فُتح", "беше отворен"]
  - [wurde-eingefuehrt, "wurde eingeführt", "was introduced", "فُرض، أُدخل", "беше воведен"]
  - [die-ddr, "die DDR", "the GDR (East Germany)", "ألمانيا الشرقية", "ГДР"]
  - [die-gehaelter, "die Gehälter", "the salaries", "الرواتب", "платите"]
  - [niedriger, "niedriger", "lower", "أقل", "пониски"]
  - [grillen, "grillen", "barbecue", "يشوي", "пече на скара"]
  - [beide-seiten, "beide Seiten", "both sides", "الطرفان", "двете страни"]
dialogue:
  - [paul, "Wir im Westen haben den Osten mit dem Soli bezahlt!", "We in the West paid for the East with the Soli!", "نحن في الغرب دفعنا ثمن الشرق بضريبة التضامن!", "Ние на Запад го плативме Истокот со Soli!"]
  - [becker, "Unsinn! Der Soli wurde im Osten genauso bezahlt. Von mir auch!", "Nonsense! The Soli was paid in the East just the same. By me too!", "هراء! ضريبة التضامن دُفعت في الشرق أيضًا بالقدر نفسه. وأنا دفعتُها أيضًا!", "Глупости! Soli се плаќаше и на Исток исто така. И јас го плаќав!"]
  - [protagonist, "Wann wurde er eingeführt?", "When was it introduced?", "متى فُرضت؟", "Кога беше воведен?"]
  - [becker, "Nach der Wende, 1991. Die Mauer wurde 1989 geöffnet — ich stand selbst auf der Straße.", "After the Wende, in 1991. The Wall was opened in 1989 — I was out on the street myself.", "بعد التحوّل، عام 1991. فُتح الجدار عام 1989 — وكنتُ أنا نفسي في الشارع.", "По преломот, 1991. Ѕидот беше отворен 1989 — јас самата бев на улица."]
  - [paul, "Okay. Aber heute zahlen ihn fast nur noch Reiche und Firmen.", "OK. But today almost only the rich and companies pay it.", "حسنًا. لكن اليوم يدفعها الأغنياء والشركات تقريبًا فقط.", "Добро. Но денес го плаќаат речиси само богатите и фирмите."]
  - [becker, "Und die Gehälter im Osten sind immer noch niedriger. Das ist kein Vorurteil.", "And salaries in the East are still lower. That's not a prejudice.", "والرواتب في الشرق ما زالت أقل. هذا ليس حكمًا مسبقًا.", "А платите на Исток се сѐ уште пониски. Тоа не е предрасуда."]
  - [protagonist, "Und im Süden sind die großen Firmen, oder?", "And the big companies are in the south, aren't they?", "والشركات الكبيرة في الجنوب، أليس كذلك؟", "А големите фирми се на југ, нели?"]
  - [paul, "Stimmt. Ossi, Wessi — es gibt auch Nord und Süd!", "True. Ossi, Wessi — there's north and south too!", "صحيح. شرقي، غربي — وهناك شمال وجنوب أيضًا!", "Точно. Оси, Веси — има и север и југ!"]
  - [protagonist, "Beide Seiten haben recht. Und jetzt grillen wir weiter!", "Both sides are right. And now let's get on with the barbecue!", "الطرفان على حق. والآن نواصل الشواء!", "Двете страни се во право. А сега продолжуваме со скарата!"]
teach:
  - ask: ["Say: the solidarity surcharge.", "قولي: ضريبة التضامن.", "Кажете: солидарниот додаток.", "Der Solidaritätszuschlag.", der-soli]
  - ask: ["She says: nonsense! It was paid in the East just the same.", "تقول: هراء! دُفعت في الشرق بالقدر نفسه.", "Таа вели: глупости! Се плаќаше и на Исток исто така.", "Unsinn! Er wurde im Osten genauso bezahlt.", unsinn, genauso]
  - note: ["Past passive: «wurde» + participle. «Der Soli wurde eingeführt» (was introduced), «Die Mauer wurde geöffnet» (was opened), «Er wurde im Osten bezahlt».", "المبني للمجهول في الماضي: «wurde» مع اسم المفعول. «Der Soli wurde eingeführt» (فُرضت)، «Die Mauer wurde geöffnet» (فُتح)، «Er wurde im Osten bezahlt».", "Пасив во минато: «wurde» + партицип. «Der Soli wurde eingeführt» (беше воведен), «Die Mauer wurde geöffnet» (беше отворен), «Er wurde im Osten bezahlt»."]
  - ask: ["Ask: when was it introduced?", "اسألي: متى فُرضت؟", "Прашајте: кога беше воведен?", "Wann wurde er eingeführt?", wurde-eingefuehrt]
  - ask: ["Say: the Wall was opened in 1989.", "قولي: فُتح الجدار عام 1989.", "Кажете: ѕидот беше отворен 1989.", "Die Mauer wurde 1989 geöffnet.", die-mauer, wurde-geoeffnet]
  - ask: ["Say: the GDR.", "قولي: ألمانيا الشرقية.", "Кажете: ГДР.", "Die DDR.", die-ddr]
  - ask: ["Say: salaries in the East are still lower.", "قولي: الرواتب في الشرق ما زالت أقل.", "Кажете: платите на Исток се сѐ уште пониски.", "Die Gehälter im Osten sind immer noch niedriger.", die-gehaelter, niedriger]
  - ask: ["Say: that's not a prejudice.", "قولي: هذا ليس حكمًا مسبقًا.", "Кажете: тоа не е предрасуда.", "Das ist kein Vorurteil.", das-vorurteil]
  - ask: ["Say: the big companies are in the south.", "قولي: الشركات الكبيرة في الجنوب.", "Кажете: големите фирми се на југ.", "Die großen Firmen sind im Süden.", im-sueden]
  - ask: ["Say: Ossi, Wessi.", "قولي: شرقي، غربي.", "Кажете: Оси, Веси.", "Ossi, Wessi.", ossi-wessi]
  - ask: ["Say: both sides are right.", "قولي: الطرفان على حق.", "Кажете: двете страни се во право.", "Beide Seiten haben recht.", beide-seiten]
  - ask: ["Say: let's get on with the barbecue!", "قولي: لنواصل الشواء!", "Кажете: да продолжиме со скарата!", "Wir grillen weiter!", grillen]
  - note: ["Germany has its own divides. The Soli was paid in East and West alike; today mostly high earners and companies pay it — check the current rule. Wages in the East are still lower on average, and the newer gap runs north–south: most big companies and the highest wages are in the south and west. 'Ossi' and 'Wessi' are colloquial and can sting — use them only as jokes among friends.", "لألمانيا انقساماتها الخاصة. ضريبة التضامن دُفعت في الشرق والغرب على السواء؛ واليوم يدفعها غالبًا أصحاب الدخل المرتفع والشركات — تحقّقي من القاعدة الحالية. الأجور في الشرق ما زالت أقل في المتوسط، والفجوة الأحدث بين الشمال والجنوب: معظم الشركات الكبيرة وأعلى الأجور في الجنوب والغرب. و«Ossi» و«Wessi» كلمتان عاميتان قد تجرحان — استعمليهما مزاحًا بين الأصدقاء فقط.", "Германија има свои поделби. Soli се плаќаше и на Исток и на Запад; денес главно го плаќаат луѓето со високи примања и фирмите — проверете го тековното правило. Платите на Исток се во просек сѐ уште пониски, а поновиот јаз е север–југ: повеќето големи фирми и највисоките плати се на југ и запад. „Ossi“ и „Wessi“ се разговорни и можат да навредат — користете ги само како шега меѓу пријатели."]
