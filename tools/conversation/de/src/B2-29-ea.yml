id: B2-29-ea
tracks: [en, ar]
protagonist: f
title: ["The new job", "الوظيفة الجديدة"]
situation:
  - "First week at the new employer. Herr Lange shows you round and explains your induction plan."
  - "الأسبوع الأول عند صاحب العمل الجديد. السيد لانغه يُريكِ المكان ويشرح خطة تأهيلكِ."
learn: [b2-relative-prepositions]
culture: The first week
items:
  - [die-einarbeitung, "die Einarbeitung", "the induction, training-in", "التأهيل للعمل", {rare: true}]
  - [der-einarbeitungsplan, "der Einarbeitungsplan", "the induction plan", "خطة التأهيل", {rare: true}]
  - [der-pate, "die Patin", "the buddy, mentor (f)", "المرشدة"]
  - [bei-der, "bei der …", "with whom, at which …", "التي … عندها", "кај која …"]
  - [an-dem, "an dem …", "on which …", "الذي … عليه", "на кој …"]
  - [mit-denen, "mit denen …", "with whom (plural)", "الذين … معهم", "со кои …"]
  - [der-zugang, "der Zugang", "the access, login", "صلاحية الدخول"]
  - [die-kantine, "die Kantine", "the canteen", "المقصف"]
  - [die-gleitzeit, "die Gleitzeit", "flexitime", "الدوام المرن", {rare: true}]
  - [die-kernzeit, "die Kernzeit", "core hours", "ساعات الحضور الإلزامي", {rare: true}]
dialogue:
  - [lange, "Willkommen! Hier ist Ihr Einarbeitungsplan für die ersten Wochen.", "Welcome! Here's your induction plan for the first weeks.", "أهلًا بكِ! هذه خطة تأهيلكِ للأسابيع الأولى."]
  - [protagonist, "Danke. Wer ist meine Ansprechpartnerin?", "Thank you. Who's my contact person?", "شكرًا. من الشخص الذي أتواصل معه؟"]
  - [lange, "Frau Krause ist Ihre Patin — die Kollegin, bei der Sie alles fragen können.", "Mrs Krause is your buddy — the colleague you can ask anything.", "السيدة كراوزه مرشدتكِ — الزميلة التي يمكنكِ أن تسأليها عن كل شيء."]
  - [protagonist, "Und das Projekt, an dem ich arbeiten werde?", "And the project I'll be working on?", "والمشروع الذي سأعمل عليه؟"]
  - [lange, "Startet nächste Woche. Das Team, mit dem Sie arbeiten, sitzt im zweiten Stock.", "Starts next week. The team you'll work with sits on the second floor.", "يبدأ الأسبوع القادم. الفريق الذي ستعملين معه في الطابق الثاني."]
  - [protagonist, "Wann muss ich da sein?", "When do I have to be there?", "متى يجب أن أكون هناك؟"]
  - [lange, "Wir haben Gleitzeit. Die Kernzeit ist von zehn bis drei.", "We have flexitime. Core hours are ten to three.", "لدينا دوام مرن. ساعات الحضور الإلزامي من العاشرة حتى الثالثة."]
  - [protagonist, "Und mein Zugang zum System?", "And my login to the system?", "وصلاحية دخولي إلى النظام؟"]
  - [lange, "Kommt heute Nachmittag. Jetzt zeige ich Ihnen die Kantine — das Wichtigste!", "Comes this afternoon. Now I'll show you the canteen — the most important thing!", "تصل بعد ظهر اليوم. الآن سأُريكِ المقصف — أهم شيء!"]
teach:
  - ask: ["Say: the induction plan.", "قولي: خطة التأهيل.", "Der Einarbeitungsplan.", der-einarbeitungsplan, die-einarbeitung]
  - ask: ["He says: she's your buddy.", "يقول: إنها مرشدتكِ.", "Sie ist Ihre Patin.", der-pate]
  - note: ["Relative clauses with prepositions: the preposition comes first, and the pronoun takes its case. «die Kollegin, bei der…», «das Projekt, an dem…», «das Team, mit dem…», «die Kollegen, mit denen…».", "جمل الصلة مع حروف الجر: حرف الجر أولًا، والضمير يأخذ حالته. «die Kollegin, bei der…»، «das Projekt, an dem…»، «das Team, mit dem…»، «die Kollegen, mit denen…»."]
  - ask: ["Say: the colleague you can ask anything.", "قولي: الزميلة التي يمكنكِ أن تسأليها عن كل شيء.", "Die Kollegin, bei der Sie alles fragen können.", bei-der]
  - ask: ["Ask: the project I'll work on?", "اسألي: المشروع الذي سأعمل عليه؟", "Das Projekt, an dem ich arbeiten werde?", an-dem]
  - ask: ["Say: the colleagues I work with.", "قولي: الزملاء الذين أعمل معهم.", "Die Kollegen, mit denen ich arbeite.", mit-denen]
  - ask: ["Say: flexitime.", "قولي: دوام مرن.", "Gleitzeit.", die-gleitzeit]
  - ask: ["Say: core hours are ten to three.", "قولي: ساعات الحضور الإلزامي من العاشرة حتى الثالثة.", "Die Kernzeit ist von zehn bis drei.", die-kernzeit]
  - ask: ["Ask: and my login?", "اسألي: وصلاحية دخولي؟", "Und mein Zugang?", der-zugang]
  - ask: ["Say: the canteen.", "قولي: المقصف.", "Die Kantine.", die-kantine]
  - note: ["Good employers give an induction plan and a buddy (Pate/Patin) for the first weeks. Ask everything early — questions are expected in the first months, not later. With flexitime you choose start and end within limits, but must be present in the core hours.", "أصحاب العمل الجيّدون يقدّمون خطة تأهيل ومرشدًا (Pate/Patin) للأسابيع الأولى. اسألي عن كل شيء مبكرًا — الأسئلة متوقَّعة في الأشهر الأولى لا بعدها. ومع الدوام المرن تختارين البداية والنهاية ضمن حدود، لكن يجب أن تحضري في ساعات الحضور الإلزامي."]
