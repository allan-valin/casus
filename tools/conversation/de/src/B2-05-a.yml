id: B2-05-a
tracks: [ar]
protagonist: f
title: ["إقامتي أنا"]
situation: ["إقامتكِ مرتبطة ببطاقة زوجكِ الزرقاء. في دائرة الأجانب تسألين السيد شولتس عن إقامة خاصة بكِ — وعن الجنسية."]
learn: [b2-konjunktiv-i]
culture: Changing the residence title
items:
  - [jahre-ehe, "Jahre Ehe", "سنوات من الزواج"]
  - [eigenstaendig, "eigenständig", "مستقل، خاص بي"]
  - [die-niederlassungserlaubnis, "die Niederlassungserlaubnis", "الإقامة الدائمة", {rare: true}]
  - [die-einbuergerung, "die Einbürgerung", "التجنّس"]
  - [die-voraussetzung, "die Voraussetzung", "الشرط"]
  - [er-sagt-es-sei, "er sagt, es sei …", "يقول إنه …"]
  - [ich-muesse, "ich müsse …", "(منقولًا) يجب عليّ …"]
  - [der-einbuergerungstest, "der Einbürgerungstest", "اختبار التجنّس", {rare: true}]
  - [ab-wann, "Ab wann …?", "منذ متى …؟ / متى يمكن …؟"]
  - [nach-einigen-jahren, "nach einigen Jahren", "بعد بضع سنوات"]
dialogue:
  - [protagonist, "Mein Aufenthalt hängt am Familiennachzug. Kann ich einen eigenständigen Titel bekommen?", "إقامتي مرتبطة بلمّ الشمل. هل يمكنني الحصول على إقامة مستقلة؟"]
  - [schulz, "Ja, nach einigen Jahren Ehe in Deutschland. Die genauen Voraussetzungen erkläre ich Ihnen gern.", "نعم، بعد بضع سنوات من الزواج في ألمانيا. يسعدني أن أشرح لكِ الشروط بالتفصيل."]
  - [protagonist, "Und die Niederlassungserlaubnis?", "والإقامة الدائمة؟"]
  - [schulz, "Mit gutem Deutsch und eigener Arbeit früher. Ihr Mann bekommt sie mit der Blauen Karte schneller.", "مع ألمانية جيدة وعمل خاص بكِ في وقت أبكر. زوجكِ يحصل عليها أسرع مع البطاقة الزرقاء."]
  - [protagonist, "Ab wann ist die Einbürgerung möglich?", "متى يصبح التجنّس ممكنًا؟"]
  - [schulz, "Nach mehreren Jahren Aufenthalt, mit Einbürgerungstest. Die Regeln haben sich kürzlich geändert.", "بعد عدة سنوات من الإقامة، مع اختبار التجنّس. القواعد تغيّرت مؤخرًا."]
  - [jonas, "Und? Was hat er gesagt?", "وماذا؟ ماذا قال؟"]
  - [protagonist, "Er sagt, es sei möglich. Ich müsse nur zuerst den Titel wechseln.", "يقول إن ذلك ممكن. يجب عليّ فقط أن أغيّر الإقامة أولًا."]
teach:
  - ask: ["قولي: لمّ الشمل.", "Der Familiennachzug.", der-familiennachzug-a]
  - ask: ["قولي: وثيقة الإقامة.", "Der Aufenthaltstitel.", der-aufenthaltstitel-a]
  - ask: ["قولي: بعد بضع سنوات من الزواج.", "Nach einigen Jahren Ehe.", jahre-ehe]
  - ask: ["اسألي: هل يمكنني الحصول على إقامة مستقلة؟", "Kann ich einen eigenständigen Titel bekommen?", eigenstaendig]
  - ask: ["يقول: بعد بضع سنوات.", "Nach einigen Jahren.", nach-einigen-jahren]
  - ask: ["قولي: الشروط.", "Die Voraussetzungen.", die-voraussetzung]
  - ask: ["قولي: الإقامة الدائمة.", "Die Niederlassungserlaubnis.", die-niederlassungserlaubnis]
  - ask: ["اسألي: متى يصبح التجنّس ممكنًا؟", "Ab wann ist die Einbürgerung möglich?", ab-wann, die-einbuergerung]
  - ask: ["قولي: اختبار التجنّس.", "Der Einbürgerungstest.", der-einbuergerungstest]
  - note: ["صيغة Konjunktiv I تنقل كلام الآخرين، خاصة في الألمانية الرسمية والمكتوبة: «Er sagt, es sei möglich» (يقول إن ذلك ممكن)، «ich müsse den Titel wechseln» (يجب عليّ تغيير الإقامة)."]
  - ask: ["انقلي: يقول إن ذلك ممكن.", "Er sagt, es sei möglich.", er-sagt-es-sei]
  - ask: ["انقلي: يجب عليّ أولًا تغيير الإقامة.", "Ich müsse zuerst den Titel wechseln.", ich-muesse]
  - note: ["إقامة لمّ الشمل مرتبطة بإقامة الزوج؛ وبعد مدة من الزواج في ألمانيا يمكن الحصول على إقامة مستقلة. والانتقال إلى إقامة بعنوان خاص (عمل، دائمة) يأتي قبل التجنّس. المدد والشروط تغيّرت في السنوات الأخيرة — تحقّقي من دائرة الأجانب أو من مركز استشارة المهاجرين."]
