id: C1-08
protagonist: m
title: ["Season finale", "ختام الموسم", "Финалето на сезоната"]
situation:
  - "The club's last match of the season. Win and you go up a league; lose and the rivals go down. Petra does the maths."
  - "المباراة الأخيرة للنادي في الموسم. الفوز يعني الصعود؛ والخسارة تعني هبوط المنافسين. بيترا تحسب."
  - "Последниот натпревар на клубот во сезоната. Победа значи искачување; пораз — соперниците испаѓаат. Петра пресметува."
learn: [de-c1-soll-will, de-c1-durfte]
culture: —
items:
  - [der-aufstieg, "der Aufstieg", "promotion (to a higher league)", "الصعود", "искачувањето"]
  - [der-abstieg, "der Abstieg", "relegation", "الهبوط", "испаѓањето"]
  - [die-tabelle, "die Tabelle", "the league table", "جدول الترتيب", "табелата"]
  - [der-tabellenplatz, "der zweite Platz", "second place", "المركز الثاني", "второто место"]
  - [koennte-reichen, "könnte reichen", "could be enough", "قد يكفي", "би можело да биде доволно"]
  - [muesste-gewinnen, "müsste gewinnen", "would have to win", "يجب أن يفوز (افتراضًا)", "би морал да победи"]
  - [das-torverhaeltnis, "das Torverhältnis", "goal difference", "فارق الأهداف", "гол-разликата", {rare: true}]
  - [der-gegner, "der Gegner", "the opponent", "الخصم", "противникот"]
  - [die-saison-c1, "am Ende der Saison", "at the end of the season", "في نهاية الموسم", "на крајот на сезоната"]
  - [der-jubel, "der Jubel", "the cheering", "الهتاف", "веселбата"]
dialogue:
  - [petra, "Wir sind auf dem zweiten Platz. Ein Unentschieden könnte für den Aufstieg reichen.", "We're in second place. A draw could be enough for promotion.", "نحن في المركز الثاني. التعادل قد يكفي للصعود.", "На второ место сме. Нерешено би можело да биде доволно за искачување."]
  - [protagonist, "Und wenn wir verlieren?", "And if we lose?", "وإذا خسرنا؟", "А ако изгубиме?"]
  - [petra, "Dann müsste der Dritte hoch gewinnen. Das dürfte schwer werden — sein Torverhältnis ist schlecht.", "Then third place would have to win big. That should be hard — their goal difference is bad.", "عندها يجب أن يفوز صاحب المركز الثالث بفارق كبير. يُرجَّح أن يكون ذلك صعبًا — فارق أهدافه سيئ.", "Тогаш третиот би морал да победи високо. Тоа веројатно ќе биде тешко — гол-разликата им е лоша."]
  - [protagonist, "Und der Gegner heute?", "And today's opponent?", "والخصم اليوم؟", "А денешниот противник?"]
  - [petra, "Der steht vor dem Abstieg. Die werden kämpfen wie Löwen.", "They're facing relegation. They'll fight like lions.", "إنه مهدَّد بالهبوط. سيقاتلون كالأسود.", "Тие се пред испаѓање. Ќе се борат како лавови."]
  - [protagonist, "Das kann ich verstehen. Laut Tabelle könnte alles passieren.", "I can understand that. According to the table anything could happen.", "أفهم ذلك. بحسب الجدول قد يحدث أي شيء.", "Тоа го разбирам. Според табелата сѐ би можело да се случи."]
  - [petra, "... Abpfiff! Eins zu eins! Wir steigen auf!", "... Final whistle! One-all! We're promoted!", "... صافرة النهاية! واحد لواحد! صعدنا!", "... Последен свиреж! Еден спрема еден! Се искачуваме!"]
  - [protagonist, "Was für ein Jubel! Das müsste man filmen!", "What cheering! Someone should film this!", "يا له من هتاف! يجب أن يصوّر أحد هذا!", "Каква веселба! Ова би требало да се снима!"]
teach:
  - ask: ["Say: we're in second place.", "قل: نحن في المركز الثاني.", "Кажете: на второ место сме.", "Wir sind auf dem zweiten Platz.", der-tabellenplatz]
  - note: ["Konjunktiv II of modals for estimates: «könnte reichen» (could be enough), «müsste gewinnen» (would have to win), «dürfte schwer werden» (should be hard — likely). Sports talk is full of them.", "صيغة التمني للأفعال المساعدة للتقديرات: «könnte reichen» (قد يكفي)، «müsste gewinnen» (يجب أن يفوز افتراضًا)، «dürfte schwer werden» (يُرجَّح أن يكون صعبًا). كلام الرياضة مليء بها.", "Konjunktiv II на модалните за проценки: «könnte reichen» (би можело да е доволно), «müsste gewinnen» (би морал да победи), «dürfte schwer werden» (веројатно ќе биде тешко). Спортскиот говор е полн со нив."]
  - ask: ["Say: a draw could be enough.", "قل: التعادل قد يكفي.", "Кажете: нерешено би можело да е доволно.", "Ein Unentschieden könnte reichen.", koennte-reichen]
  - ask: ["Say: for promotion.", "قل: للصعود.", "Кажете: за искачување.", "Für den Aufstieg.", der-aufstieg]
  - ask: ["Say: third place would have to win.", "قل: صاحب المركز الثالث يجب أن يفوز.", "Кажете: третиот би морал да победи.", "Der Dritte müsste gewinnen.", muesste-gewinnen]
  - ask: ["Say: their goal difference is bad.", "قل: فارق أهدافه سيئ.", "Кажете: гол-разликата им е лоша.", "Das Torverhältnis ist schlecht.", das-torverhaeltnis]
  - ask: ["Say: they're facing relegation.", "قل: إنه مهدَّد بالهبوط.", "Кажете: пред испаѓање се.", "Sie stehen vor dem Abstieg.", der-abstieg, der-gegner]
  - ask: ["Say: according to the table.", "قل: بحسب الجدول.", "Кажете: според табелата.", "Laut Tabelle.", die-tabelle]
  - ask: ["Say: at the end of the season.", "قل: في نهاية الموسم.", "Кажете: на крајот на сезоната.", "Am Ende der Saison.", die-saison-c1]
  - ask: ["Say: what cheering!", "قل: يا له من هتاف!", "Кажете: каква веселба!", "Was für ein Jubel!", der-jubel]
