id: C2-23
protagonist: f
title: ["At the city council", "في مجلس المدينة", "Во градскиот совет"]
situation:
  - "The mayor's office never solved the hall problem. At the council's public question time you have three minutes."
  - "مكتب رئيس البلدية لم يحلّ مشكلة القاعة قط. في وقت أسئلة المواطنين بمجلس المدينة لديكِ ثلاث دقائق."
  - "Канцеларијата на градоначалникот никогаш не го реши проблемот со салата. На часот за прашања на граѓаните во советот имате три минути."
learn: []
learn_missing: [rhetoric]
culture: Public question time
items:
  - [die-buergerfragestunde, "die Bürgerfragestunde", "public question time", "وقت أسئلة المواطنين", "часот за прашања на граѓаните", {rare: true}]
  - [der-stadtrat-c2, "die Stadträtinnen und Stadträte", "the city councillors", "أعضاء مجلس المدينة", "советниците"]
  - [sehr-geehrter-herr-vorsitzender, "Sehr geehrter Herr Vorsitzender", "Mr Chairman", "السيد الرئيس المحترم", "Почитуван господине претседавач"]
  - [die-redezeit, "die Redezeit", "the speaking time", "وقت الكلام", "времето за говор"]
  - [ich-frage-sie, "Ich frage Sie:", "I ask you:", "أسألكم:", "Ве прашувам:"]
  - [konkret, "ganz konkret", "very concretely", "بشكل محدّد تمامًا", "сосема конкретно"]
  - [die-zusage, "die Zusage", "the promise, commitment", "الوعد", "ветувањето"]
  - [die-tatsache, "die Tatsache", "the fact", "الحقيقة الواقعة", "фактот"]
  - [die-schriftliche-antwort, "eine schriftliche Antwort", "a written answer", "ردّ مكتوب", "писмен одговор"]
  - [die-vertagung, "vertagen", "adjourn, postpone", "يؤجّل", "одложува"]
dialogue:
  - [ratsvorsitz, "Bürgerfragestunde. Sie haben drei Minuten Redezeit.", "Public question time. You have three minutes' speaking time.", "وقت أسئلة المواطنين. لديكِ ثلاث دقائق للكلام.", "Час за прашања на граѓаните. Имате три минути време за говор."]
  - [protagonist, "Sehr geehrter Herr Vorsitzender, sehr geehrte Stadträtinnen und Stadträte!", "Mr Chairman, ladies and gentlemen of the council!", "السيد الرئيس المحترم، أعضاء المجلس المحترمون!", "Почитуван господине претседавач, почитувани советнички и советници!"]
  - [protagonist, "Drei Tatsachen. Erstens: Vierzig Kinder haben keine Halle. Zweitens: Es gab eine Zusage. Drittens: Seit sechs Monaten passiert nichts.", "Three facts. First: forty children have no hall. Second: there was a promise. Third: for six months nothing has happened.", "ثلاث حقائق. أولًا: أربعون طفلًا بلا قاعة. ثانيًا: كان هناك وعد. ثالثًا: منذ ستة أشهر لا شيء يحدث.", "Три факти. Прво: четириесет деца немаат сала. Второ: имаше ветување. Трето: шест месеци ништо не се случува."]
  - [protagonist, "Ich frage Sie ganz konkret: Wann bekommen diese Kinder ihre Hallenzeit?", "I ask you very concretely: when will these children get their hall time?", "أسألكم بشكل محدّد تمامًا: متى يحصل هؤلاء الأطفال على وقتهم في القاعة؟", "Ве прашувам сосема конкретно: кога овие деца ќе го добијат својот термин?"]
  - [ratsvorsitz, "Danke. Das Sportamt antwortet Ihnen schriftlich innerhalb von vier Wochen.", "Thank you. The sports office will answer you in writing within four weeks.", "شكرًا. مكتب الرياضة سيردّ عليكِ كتابيًا خلال أربعة أسابيع.", "Благодарам. Спортската служба ќе ви одговори писмено во рок од четири недели."]
  - [protagonist, "Eine schriftliche Antwort ist gut. Eine Halle wäre besser.", "A written answer is good. A hall would be better.", "الردّ المكتوب جيد. لكن القاعة أفضل.", "Писмениот одговор е добар. Сала би била подобра."]
  - [ratsvorsitz, "(Applaus) Bitte keine Beifallsbekundungen. Wir vertagen den Punkt nicht — er kommt auf die nächste Tagesordnung.", "(Applause) No applause, please. We won't postpone the item — it goes on the next agenda.", "(تصفيق) من فضلكم لا تصفيق. لن نؤجّل البند — سيُدرج في جدول الأعمال القادم.", "(Аплауз) Ве молам без аплаузи. Нема да ја одложиме точката — оди на следниот дневен ред."]
  - [protagonist, "Dann komme ich wieder. Mit vierzig Kindern.", "Then I'll come again. With forty children.", "إذن سأعود. مع أربعين طفلًا.", "Тогаш пак ќе дојдам. Со четириесет деца."]
teach:
  - ask: ["Say: public question time.", "قولي: وقت أسئلة المواطنين.", "Кажете: час за прашања на граѓаните.", "Die Bürgerfragestunde.", die-buergerfragestunde]
  - ask: ["Address the chair and the council.", "خاطبي الرئيس والمجلس.", "Обратете се на претседавачот и советот.", "Sehr geehrter Herr Vorsitzender, sehr geehrte Stadträtinnen und Stadträte!", sehr-geehrter-herr-vorsitzender, der-stadtrat-c2]
  - note: ["Rhetoric under time pressure: a list of three («Erstens… Zweitens… Drittens…»), one concrete question («Ich frage Sie ganz konkret: …»), and a short, memorable contrast at the end («Eine schriftliche Antwort ist gut. Eine Halle wäre besser.»).", "البلاغة تحت ضغط الوقت: قائمة من ثلاثة («Erstens… Zweitens… Drittens…»)، وسؤال محدّد واحد («Ich frage Sie ganz konkret: …»)، ومقابلة قصيرة لا تُنسى في النهاية («Eine schriftliche Antwort ist gut. Eine Halle wäre besser.»).", "Реторика под временски притисок: листа од три («Erstens… Zweitens… Drittens…»), едно конкретно прашање («Ich frage Sie ganz konkret: …») и краток контраст што се памети на крајот («Eine schriftliche Antwort ist gut. Eine Halle wäre besser.»)."]
  - ask: ["Say: three facts.", "قولي: ثلاث حقائق.", "Кажете: три факти.", "Drei Tatsachen.", die-tatsache]
  - ask: ["Say: there was a promise.", "قولي: كان هناك وعد.", "Кажете: имаше ветување.", "Es gab eine Zusage.", die-zusage]
  - ask: ["Ask very concretely.", "اسألي بشكل محدّد تمامًا.", "Прашајте сосема конкретно.", "Ich frage Sie ganz konkret:", ich-frage-sie, konkret]
  - ask: ["Say: a written answer.", "قولي: ردّ مكتوب.", "Кажете: писмен одговор.", "Eine schriftliche Antwort.", die-schriftliche-antwort]
  - ask: ["Say: the speaking time.", "قولي: وقت الكلام.", "Кажете: времето за говор.", "Die Redezeit.", die-redezeit]
  - ask: ["Say: we won't postpone it.", "قولي: لن نؤجّله.", "Кажете: нема да го одложиме.", "Wir vertagen es nicht.", die-vertagung]
  - note: ["Most city councils hold a public question time where any resident — with or without a German passport — may ask a question, often registered in advance. Three minutes, one question, facts first: that's what gets an answer on the record.", "معظم مجالس المدن تعقد وقتًا لأسئلة المواطنين يحق فيه لأي مقيم — بجواز ألماني أو بدونه — طرح سؤال، غالبًا بتسجيل مسبق. ثلاث دقائق، سؤال واحد، والوقائع أولًا: هذا ما يجلب جوابًا مسجّلًا.", "Повеќето градски совети имаат час за прашања каде секој жител — со или без германски пасош — може да постави прашање, често со пријава однапред. Три минути, едно прашање, прво фактите: тоа носи одговор што се запишува."]
