id: A1-22-a
tracks: [ar]
protagonist: m
title: ["كم الساعة؟"]
situation: ["الحضانة تغلق في الرابعة والنصف. تصل في الخامسة إلا ربعًا. السيدة كروغر تنتظر مع يارا."]
learn: [a1-time]
culture: Five minutes late needs a sorry
items:
  - [wie-spaet-ist-es, "Wie spät ist es?", "كم الساعة؟"]
  - [halb-fuenf, "halb fünf", "الرابعة والنصف"]
  - [viertel-vor, "Viertel vor", "إلا ربعًا"]
  - [viertel-nach, "Viertel nach", "وربع"]
  - [puenktlich-a, "pünktlich", "في الموعد"]
  - [zu-spaet, "zu spät", "متأخر"]
  - [die-verspaetung, "die Verspätung", "التأخير"]
  - [rufen-sie-an, "Rufen Sie an", "اتصل (أمر مؤدب)"]
  - [das-naechste-mal, "das nächste Mal", "في المرة القادمة"]
  - [es-tut-mir-leid, "Es tut mir leid", "آسف"]
dialogue:
  - [protagonist, "Entschuldigung! Bin ich zu spät?", "عفوًا! هل تأخرت؟"]
  - [kruger, "Ja. Wir schließen um halb fünf. Jetzt ist es Viertel vor fünf.", "نعم. نغلق في الرابعة والنصف. الآن الخامسة إلا ربعًا."]
  - [protagonist, "Es tut mir leid. Die Straßenbahn hatte Verspätung.", "آسف. الترام تأخر."]
  - [kruger, "Das kann passieren. Aber bitte rufen Sie an.", "قد يحدث هذا. لكن من فضلك اتصل."]
  - [protagonist, "Wie spät kann ich kommen?", "إلى أيّ ساعة يمكنني أن آتي؟"]
  - [kruger, "Bis halb fünf. Pünktlich, bitte.", "حتى الرابعة والنصف. في الموعد من فضلك."]
  - [protagonist, "Verstanden. Das nächste Mal bin ich pünktlich.", "فهمت. في المرة القادمة سآتي في الموعد."]
  - [yara, "Papa! Ich habe gewartet!", "بابا! انتظرتُ!"]
teach:
  - ask: ["اسأل: هل تأخرت؟", "Bin ich zu spät?", zu-spaet]
  - note: ["الأنصاف تُحسب نحو الساعة التالية: «halb fünf» تعني الرابعة والنصف — حرفيًا «نصف إلى الخامسة». و«Viertel vor fünf» الخامسة إلا ربعًا، و«Viertel nach vier» الرابعة وربع."]
  - ask: ["تقول: نغلق في الرابعة والنصف.", "Wir schließen um halb fünf.", halb-fuenf]
  - ask: ["قل: الخامسة إلا ربعًا.", "Viertel vor fünf.", viertel-vor]
  - ask: ["قل: الرابعة وربع.", "Viertel nach vier.", viertel-nach]
  - ask: ["اعتذر: آسف.", "Es tut mir leid.", es-tut-mir-leid]
  - ask: ["قل: الترام تأخر. (التأخير)", "Die Verspätung.", die-verspaetung]
  - ask: ["تقول: من فضلك اتصل.", "Bitte rufen Sie an.", rufen-sie-an]
  - ask: ["اسأل: كم الساعة؟", "Wie spät ist es?", wie-spaet-ist-es]
  - ask: ["قل: في المرة القادمة سآتي في الموعد.", "Das nächste Mal bin ich pünktlich.", das-naechste-mal, puenktlich-a]
  - note: ["مواعيد الحضانة صارمة: المربيات ينهين عملهن في وقت محدد. إن كنت ستتأخر خمس دقائق فاتصل قبل ذلك؛ والتأخير المتكرر يُكتب ويُناقش."]
