id: A1-10
protagonist: m
title: ["Jonas", "يوناس", "Јонас"]
situation:
  - "A young man runs down the stairs with a bike. Jonas, from the second floor."
  - "شاب ينزل الدرج مسرعًا ومعه دراجة. إنه يوناس، من الطابق الثاني."
  - "Еден млад човек трча по скалите со велосипед. Јонас, од вториот кат."
learn: [de-pro_02]
culture: du at once; switching to English
items:
  - [du-bist, "du bist", "you are (informal)", "أنتَ (غير رسمي)", "ти си"]
  - [oben, "oben", "upstairs", "في الأعلى", "горе"]
  - [und-du, "Und du?", "And you? (informal)", "وأنت؟", "А ти?"]
  - [im-zweiten-stock, "im zweiten Stock", "on the second floor", "في الطابق الثاني", "на вториот кат"]
  - [wie-gehts, "Wie geht's?", "How are you? (informal)", "كيف الحال؟", "Како си?"]
  - [und-dir, "Und dir?", "And you? (after 'how are you')", "وأنت؟ (بعد كيف الحال)", "А ти?"]
  - [sprichst-du, "Sprichst du …?", "Do you speak …? (informal)", "هل تتكلم …؟", "Зборуваш ли …?"]
  - [oder-lieber, "oder lieber …?", "or would you rather …?", "أم تفضّل …؟", "или повеќе сакаш …?"]
  - [ich-lerne, "ich lerne", "I'm learning", "أتعلّم", "учам"]
  - [auf-deutsch, "auf Deutsch", "in German", "بالألمانية", "на германски"]
  - [langsam, "langsam", "slowly", "ببطء", "полека"]
  - [klar, "Klar!", "Sure! Of course!", "طبعًا!", "Секако!"]
dialogue:
  - [jonas, "Hey! Du bist neu hier, oder?", "Hey! You're new here, right?", "أهلًا! أنت جديد هنا، صح؟", "Здраво! Ти си нов тука, нели?"]
  - [protagonist, "Ja! Ich wohne oben. Und du?", "Yes! I live upstairs. And you?", "نعم! أسكن في الأعلى. وأنت؟", "Да! Живеам горе. А ти?"]
  - [jonas, "Ich bin Jonas, ich wohne im zweiten Stock. Wie geht's?", "I'm Jonas, I live on the second floor. How are you?", "أنا يوناس، أسكن في الطابق الثاني. كيف الحال؟", "Јас сум Јонас, живеам на вториот кат. Како си?"]
  - [protagonist, "Gut, danke. Und dir?", "Fine, thanks. And you?", "بخير، شكرًا. وأنت؟", "Добро, благодарам. А ти?"]
  - [jonas, "Auch gut. Sprichst du Deutsch — oder lieber Englisch?", "Good too. Do you speak German — or would you rather speak English?", "بخير أيضًا. هل تتكلم الألمانية — أم تفضّل الإنجليزية؟", "И јас добро. Зборуваш ли германски — или повеќе сакаш англиски?"]
  - [protagonist, "Bitte auf Deutsch! Ich lerne Deutsch.", "German, please! I'm learning German.", "بالألمانية من فضلك! أنا أتعلّم الألمانية.", "На германски, те молам! Учам германски."]
  - [jonas, "Super! Du sprichst schon gut.", "Great! You already speak well.", "رائع! أنت تتكلم جيدًا بالفعل.", "Супер! Веќе зборуваш добро."]
  - [protagonist, "Danke. Aber bitte langsam.", "Thanks. But slowly, please.", "شكرًا. لكن ببطء من فضلك.", "Благодарам. Но полека, те молам."]
  - [jonas, "Klar! Tschüss, bis bald!", "Sure! Bye, see you soon!", "طبعًا! إلى اللقاء، أراك قريبًا!", "Секако! Чао, се гледаме!"]
teach:
  - note: ["Young people, students and friends say «du» from the first word, and «Hallo» instead of «Guten Tag». With «du» the verb changes: «du bist», «du sprichst».", "الشباب والطلاب والأصدقاء يقولون «du» من الكلمة الأولى، و«Hallo» بدل «Guten Tag». ومع «du» يتغيّر الفعل: «du bist»، «du sprichst».", "Младите, студентите и пријателите си велат «du» од првиот збор, и «Hallo» наместо «Guten Tag». Со «du» глаголот се менува: «du bist», «du sprichst»."]
  - ask: ["He says: you're new here, right?", "يقول: أنت جديد هنا، صح؟", "Тој вели: ти си нов тука, нели?", "Du bist neu hier, oder?", du-bist, neu-hier]
  - ask: ["Say: I live upstairs. And you?", "قل: أسكن في الأعلى. وأنت؟", "Кажете: живеам горе. А ти?", "Ich wohne oben. Und du?", oben, und-du]
  - ask: ["He says: on the second floor.", "يقول: في الطابق الثاني.", "Тој вели: на вториот кат.", "Im zweiten Stock.", im-zweiten-stock]
  - ask: ["He asks how you are. How?", "يسألك كيف حالك. كيف؟", "Те прашува како си. Како?", "Wie geht's?", wie-gehts]
  - ask: ["Answer and ask back: fine, thanks. And you?", "أجب واسأله: بخير، شكرًا. وأنت؟", "Одговорете и прашајте: добро, благодарам. А ти?", "Gut, danke. Und dir?", und-dir]
  - ask: ["He asks if you speak German. How?", "يسألك إن كنت تتكلم الألمانية. كيف؟", "Те прашува дали зборуваш германски. Како?", "Sprichst du Deutsch?", sprichst-du]
  - ask: ["He offers: or would you rather English?", "يعرض: أم تفضّل الإنجليزية؟", "Тој нуди: или повеќе сакаш англиски?", "Oder lieber Englisch?", oder-lieber]
  - note: ["In big cities people often switch to English as soon as you hesitate. Answer «Bitte auf Deutsch» — most people are glad to slow down for you. In small towns you'll hear «Sie sprechen aber gut!» for every sentence.", "في المدن الكبيرة كثيرًا ما يتحول الناس إلى الإنجليزية بمجرد أن تتردد. أجب «Bitte auf Deutsch» — أغلب الناس يسعدون بالتمهّل من أجلك. وفي البلدات الصغيرة ستسمع «Sie sprechen aber gut!» عند كل جملة.", "Во големите градови луѓето често преминуваат на англиски штом ќе се двоумите. Одговорете «Bitte auf Deutsch» — повеќето радо ќе зборуваат побавно. Во малите места за секоја реченица ќе слушнете «Sie sprechen aber gut!»"]
  - ask: ["Say: in German, please! I'm learning German.", "قل: بالألمانية من فضلك! أنا أتعلّم الألمانية.", "Кажете: на германски, те молам! Учам германски.", "Bitte auf Deutsch! Ich lerne Deutsch.", auf-deutsch, ich-lerne]
  - ask: ["Say: slowly, please.", "قل: ببطء من فضلك.", "Кажете: полека, те молам.", "Bitte langsam.", langsam]
  - ask: ["He says: sure!", "يقول: طبعًا!", "Тој вели: секако!", "Klar!", klar]
