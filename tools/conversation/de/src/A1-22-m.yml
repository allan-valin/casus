id: A1-22-m
tracks: [mk]
protagonist: m
title: ["Колку е часот?"]
situation: ["Градинката се затвора во четири и пол. Пристигнувате во пет помалку петнаесет. Госпоѓа Кригер чека со Лука."]
learn: [a1-time]
culture: Five minutes late needs a sorry
items:
  - [wie-spaet-ist-es, "Wie spät ist es?", "Колку е часот?"]
  - [halb-fuenf, "halb fünf", "четири и пол"]
  - [viertel-vor, "Viertel vor", "помалку петнаесет"]
  - [viertel-nach, "Viertel nach", "и петнаесет"]
  - [puenktlich-m, "pünktlich", "точно, навреме"]
  - [zu-spaet, "zu spät", "доцна"]
  - [die-verspaetung, "die Verspätung", "доцнењето"]
  - [rufen-sie-an, "Rufen Sie an", "Јавете се"]
  - [das-naechste-mal, "das nächste Mal", "следниот пат"]
  - [es-tut-mir-leid, "Es tut mir leid", "Жал ми е"]
dialogue:
  - [protagonist, "Entschuldigung! Bin ich zu spät?", "Извинете! Дали доцнам?"]
  - [kruger, "Ja. Wir schließen um halb fünf. Jetzt ist es Viertel vor fünf.", "Да. Затвораме во четири и пол. Сега е пет помалку петнаесет."]
  - [protagonist, "Es tut mir leid. Die Straßenbahn hatte Verspätung.", "Жал ми е. Трамвајот доцнеше."]
  - [kruger, "Das kann passieren. Aber bitte rufen Sie an.", "Може да се случи. Но ве молам јавете се."]
  - [protagonist, "Wie spät kann ich kommen?", "До колку часот можам да дојдам?"]
  - [kruger, "Bis halb fünf. Pünktlich, bitte.", "До четири и пол. Точно, ве молам."]
  - [protagonist, "Verstanden. Das nächste Mal bin ich pünktlich.", "Разбрав. Следниот пат ќе бидам точен."]
  - [luka, "Opa! Ich habe gewartet!", "Дедо! Чекав!"]
teach:
  - ask: ["Прашајте: дали доцнам?", "Bin ich zu spät?", zu-spaet]
  - note: ["Половините се бројат кон следниот час: «halb fünf» е четири и пол — збор по збор „половина до пет“. «Viertel vor fünf» е пет помалку петнаесет, «Viertel nach vier» четири и петнаесет."]
  - ask: ["Таа вели: затвораме во четири и пол.", "Wir schließen um halb fünf.", halb-fuenf]
  - ask: ["Кажете: пет помалку петнаесет.", "Viertel vor fünf.", viertel-vor]
  - ask: ["Кажете: четири и петнаесет.", "Viertel nach vier.", viertel-nach]
  - ask: ["Извинете се: жал ми е.", "Es tut mir leid.", es-tut-mir-leid]
  - ask: ["Кажете: доцнењето.", "Die Verspätung.", die-verspaetung]
  - ask: ["Таа вели: ве молам јавете се.", "Bitte rufen Sie an.", rufen-sie-an]
  - ask: ["Прашајте колку е часот.", "Wie spät ist es?", wie-spaet-ist-es]
  - ask: ["Кажете: следниот пат ќе бидам точен.", "Das nächste Mal bin ich pünktlich.", das-naechste-mal, puenktlich-m]
  - note: ["Кај нас половина час доцнење меѓу пријатели е нормално; во Германија, особено во градинката, времето е точно. Ако ќе доцните пет минути, јавете се однапред."]
