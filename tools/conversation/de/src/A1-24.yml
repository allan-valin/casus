id: A1-24
protagonist: m
title: ["The sky", "السماء", "Небото"]
situation:
  - "A clear night at the Monument to the Battle of the Nations. Jonas brings a telescope."
  - "ليلة صافية عند نصب معركة الأمم. يوناس يحضر تلسكوبًا."
  - "Ведра ноќ кај Споменикот на битката на народите. Јонас носи телескоп."
learn: [a1-prepositions]
culture: —
items:
  - [der-himmel, "der Himmel", "the sky", "السماء", "небото"]
  - [die-sterne, "die Sterne", "the stars", "النجوم", "ѕвездите"]
  - [der-mond, "der Mond", "the moon", "القمر", "месечината"]
  - [am-himmel, "am Himmel", "in the sky", "في السماء", "на небото"]
  - [auf-dem-turm, "auf dem Turm", "on the tower", "على البرج", "на кулата"]
  - [in-der-stadt, "in der Stadt", "in the city", "في المدينة", "во градот"]
  - [der-planet, "der Planet", "the planet", "الكوكب", "планетата"]
  - [hell-wie, "so hell", "so bright", "مضيء جدًا", "толку светло"]
  - [schau-mal, "Schau mal!", "Look! (informal)", "انظر!", "Погледни!"]
  - [klar-himmel, "klar", "clear", "صافٍ", "ведро"]
  - [wunderschoen, "wunderschön", "beautiful", "رائع الجمال", "прекрасно"]
dialogue:
  - [jonas, "Schau mal! Der Himmel ist heute klar.", "Look! The sky is clear today.", "انظر! السماء صافية اليوم.", "Погледни! Небото е ведро денес."]
  - [protagonist, "So viele Sterne! In der Stadt sieht man sie nicht.", "So many stars! In the city you can't see them.", "نجوم كثيرة جدًا! في المدينة لا تُرى.", "Толку многу ѕвезди! Во градот не се гледаат."]
  - [jonas, "Und da, am Himmel — das ist kein Stern. Das ist ein Planet.", "And there, in the sky — that's not a star. That's a planet.", "وهناك، في السماء — هذا ليس نجمًا. إنه كوكب.", "А таму, на небото — тоа не е ѕвезда. Тоа е планета."]
  - [protagonist, "Welcher Planet?", "Which planet?", "أيّ كوكب؟", "Која планета?"]
  - [jonas, "Jupiter. So hell!", "Jupiter. So bright!", "المشتري. مضيء جدًا!", "Јупитер. Толку светол!"]
  - [protagonist, "Und der Mond ist auch schön.", "And the moon is lovely too.", "والقمر جميل أيضًا.", "И месечината е убава."]
  - [jonas, "Oben auf dem Turm ist es noch besser.", "Up on the tower it's even better.", "فوق، على البرج، المنظر أجمل.", "Горе на кулата е уште подобро."]
  - [protagonist, "Wunderschön. Zu Hause sehe ich andere Sterne.", "Beautiful. At home I see other stars.", "رائع. في بلدي أرى نجومًا أخرى.", "Прекрасно. Дома гледам други ѕвезди."]
teach:
  - ask: ["Jonas says: look!", "يوناس يقول: انظر!", "Јонас вели: погледни!", "Schau mal!", schau-mal]
  - ask: ["Say: the sky is clear today.", "قل: السماء صافية اليوم.", "Кажете: небото е ведро денес.", "Der Himmel ist heute klar.", der-himmel, klar-himmel]
  - ask: ["Say: so many stars!", "قل: نجوم كثيرة جدًا!", "Кажете: толку многу ѕвезди!", "So viele Sterne!", die-sterne]
  - note: ["Three small words of place: «in» (in), «an» (at, on a vertical surface), «auf» (on top). «in der Stadt», «am Himmel», «auf dem Turm».", "ثلاث كلمات صغيرة للمكان: «in» (في)، «an» (على سطح عمودي، عند)، «auf» (فوق). «in der Stadt»، «am Himmel»، «auf dem Turm».", "Три мали зборови за место: «in» (во), «an» (на, покрај вертикална површина), «auf» (на, одозгора). «in der Stadt», «am Himmel», «auf dem Turm»."]
  - ask: ["Say: in the city you can't see them.", "قل: في المدينة لا تُرى.", "Кажете: во градот не се гледаат.", "In der Stadt sieht man sie nicht.", in-der-stadt]
  - ask: ["Say: in the sky.", "قل: في السماء.", "Кажете: на небото.", "Am Himmel.", am-himmel]
  - ask: ["Say: that's a planet.", "قل: هذا كوكب.", "Кажете: тоа е планета.", "Das ist ein Planet.", der-planet]
  - ask: ["Say: so bright!", "قل: مضيء جدًا!", "Кажете: толку светло!", "So hell!", hell-wie]
  - ask: ["Say: the moon is lovely too.", "قل: القمر جميل أيضًا.", "Кажете: и месечината е убава.", "Der Mond ist auch schön.", der-mond]
  - ask: ["Say: on the tower.", "قل: على البرج.", "Кажете: на кулата.", "Auf dem Turm.", auf-dem-turm]
  - ask: ["Say: beautiful.", "قل: رائع.", "Кажете: прекрасно.", "Wunderschön.", wunderschoen]
