id: A1-19
protagonist: f
title: ["The market", "السوق", "Пазарот"]
situation:
  - "Saturday market. Herr Yilmaz sells fruit and vegetables and jokes with everyone."
  - "سوق السبت. السيد يلماز يبيع الخضار والفاكهة ويمازح الجميع."
  - "Сабота, пазарот. Господин Јилмаз продава овошје и зеленчук и се шегува со сите."
learn: [a1-numbers]
culture: Weekly markets
items:
  - [frisch, "frisch", "fresh", "طازج", "свежо"]
  - [ein-kilo, "ein Kilo", "a kilo", "كيلو", "едно кило"]
  - [tomaten, "Tomaten", "tomatoes", "طماطم", "домати"]
  - [ein-stueck, "ein Stück", "a piece", "قطعة", "парче"]
  - [aepfel, "Äpfel", "apples", "تفاح", "јаболка"]
  - [noch-etwas, "Noch etwas?", "Anything else?", "شيء آخر؟", "Уште нешто?"]
  - [das-wars-alles, "Das ist alles", "That's all", "هذا كل شيء", "Тоа е сè"]
  - [zusammen, "zusammen", "altogether", "المجموع", "вкупно"]
  - [stimmt-so, "Stimmt so", "Keep the change", "احتفظ بالباقي", "Нема потреба од кусур"]
  - [geschenkt, "geschenkt", "free, a gift", "هدية، مجانًا", "подарок, бесплатно"]
  - [ein-halbes-kilo, "ein halbes Kilo", "half a kilo", "نصف كيلو", "половина кило"]
dialogue:
  - [yilmaz, "Guten Morgen! Alles frisch, alles aus der Region!", "Good morning! All fresh, all local!", "صباح الخير! كله طازج، كله من المنطقة!", "Добро утро! Сè свежо, сè од регионот!"]
  - [protagonist, "Guten Morgen. Ein Kilo Tomaten, bitte.", "Good morning. A kilo of tomatoes, please.", "صباح الخير. كيلو طماطم من فضلك.", "Добро утро. Едно кило домати, ве молам."]
  - [yilmaz, "Gern! Noch etwas?", "With pleasure! Anything else?", "بكل سرور! شيء آخر؟", "Со задоволство! Уште нешто?"]
  - [protagonist, "Ein halbes Kilo Äpfel. Und eine Gurke.", "Half a kilo of apples. And a cucumber.", "نصف كيلو تفاح. وخيارة.", "Половина кило јаболка. И една краставица."]
  - [yilmaz, "Die Gurke kostet achtzig Cent das Stück.", "The cucumber is eighty cents each.", "الخيارة بثمانين سنتًا للقطعة.", "Краставицата чини осумдесет центи парчето."]
  - [protagonist, "Gut. Das ist alles. Was kostet das zusammen?", "Good. That's all. How much is that altogether?", "حسنًا. هذا كل شيء. كم المجموع؟", "Добро. Тоа е сè. Колку чини вкупно?"]
  - [yilmaz, "Fünf Euro zwanzig.", "Five euros twenty.", "خمسة يورو وعشرون.", "Пет евра и дваесет."]
  - [protagonist, "Hier sind sechs Euro. Stimmt so!", "Here are six euros. Keep the change!", "هذه ستة يورو. احتفظ بالباقي!", "Еве шест евра. Нема потреба од кусур!"]
  - [yilmaz, "Danke! Und die Petersilie ist geschenkt.", "Thanks! And the parsley's on the house.", "شكرًا! والبقدونس هدية.", "Благодарам! А магдоносот е подарок."]
teach:
  - ask: ["He says: all fresh!", "يقول: كله طازج!", "Тој вели: сè свежо!", "Alles frisch!", frisch]
  - ask: ["Ask for a kilo of tomatoes.", "اطلبي كيلو طماطم.", "Побарајте едно кило домати.", "Ein Kilo Tomaten, bitte.", ein-kilo, tomaten]
  - ask: ["He asks: anything else?", "يسأل: شيء آخر؟", "Тој прашува: уште нешто?", "Noch etwas?", noch-etwas]
  - ask: ["Ask for half a kilo of apples.", "اطلبي نصف كيلو تفاح.", "Побарајте половина кило јаболка.", "Ein halbes Kilo Äpfel.", ein-halbes-kilo, aepfel]
  - ask: ["He says: eighty cents a piece.", "يقول: ثمانون سنتًا للقطعة.", "Тој вели: осумдесет центи парчето.", "Achtzig Cent das Stück.", ein-stueck]
  - ask: ["Say: that's all.", "قولي: هذا كل شيء.", "Кажете: тоа е сè.", "Das ist alles.", das-wars-alles]
  - ask: ["Ask how much it is altogether.", "اسألي كم المجموع.", "Прашајте колку чини вкупно.", "Was kostet das zusammen?", zusammen, was-kostet]
  - note: ["Rounding up and saying «Stimmt so» is how you tip at a market stall, café or taxi — never compulsory.", "التقريب وقول «Stimmt so» هو طريقة إعطاء البقشيش في كشك السوق أو المقهى أو التاكسي — وهو ليس إلزاميًا أبدًا.", "Заокружувањето и «Stimmt so» е начинот на бакшиш на тезга, во кафуле или такси — никогаш задолжително."]
  - ask: ["Hand over six euros: keep the change!", "أعطيه ستة يورو: احتفظ بالباقي!", "Дајте шест евра: нема потреба од кусур!", "Hier sind sechs Euro. Stimmt so!", stimmt-so]
  - ask: ["He says: the parsley's free.", "يقول: البقدونس هدية.", "Тој вели: магдоносот е подарок.", "Die Petersilie ist geschenkt.", geschenkt]
  - note: ["Most towns hold a weekly market in the main square: farmers, bakers, stalls run by families from Turkey, Vietnam, Italy. Prices are fixed; bargaining isn't usual, but a regular gets a little extra.", "في معظم المدن سوق أسبوعي في الساحة الرئيسية: مزارعون وخبّازون وأكشاك تديرها عائلات من تركيا وفيتنام وإيطاليا. الأسعار ثابتة والمساومة ليست عادة، لكن الزبون الدائم يحصل على شيء إضافي.", "Во повеќето градови има неделен пазар на главниот плоштад: земјоделци, пекари, тезги на семејства од Турција, Виетнам, Италија. Цените се фиксни; пазарење не е обичај, но редовниот купувач добива нешто повеќе."]
