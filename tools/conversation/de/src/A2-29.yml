id: A2-29
protagonist: f
title: ["The VHS", "الجامعة الشعبية", "Народниот универзитет"]
situation:
  - "The Volkshochschule, the adult evening school. You want to sign up for a German course."
  - "الجامعة الشعبية (Volkshochschule)، مدرسة الكبار المسائية. تريدين التسجيل في دورة ألمانية."
  - "Народниот универзитет (Volkshochschule), вечерно училиште за возрасни. Сакате да се запишете на курс по германски."
learn: [a2-zu-infinitive]
culture: Evening courses for everyone
items:
  - [die-volkshochschule, "die Volkshochschule", "the adult education centre", "الجامعة الشعبية", "народниот универзитет", {rare: true}]
  - [ich-habe-vor, "ich habe vor, … zu", "I plan to …", "أنوي أن …", "планирам да …"]
  - [es-ist-schwer, "es ist schwer, … zu", "it's hard to …", "من الصعب أن …", "тешко е да …"]
  - [der-einstufungstest, "der Einstufungstest", "the placement test", "اختبار تحديد المستوى", "тестот за ниво", {rare: true}]
  - [das-niveau, "das Niveau", "the level", "المستوى", "нивото"]
  - [abends, "abends", "in the evenings", "مساءً", "навечер"]
  - [zweimal-pro-woche, "zweimal pro Woche", "twice a week", "مرتين في الأسبوع", "двапати неделно"]
  - [hast-du-lust, "Lust haben, … zu", "feel like …", "يرغب في …", "има желба да …"]
  - [anfangen, "anfangen", "start", "يبدأ", "почнува"]
  - [die-gebuehr, "die Gebühr", "the fee", "الرسوم", "таксата"]
dialogue:
  - [hartmann, "Guten Abend. Was möchten Sie lernen?", "Good evening. What would you like to learn?", "مساء الخير. ماذا تودّين أن تتعلّمي؟", "Добровечер. Што сакате да учите?"]
  - [protagonist, "Ich habe vor, mein Deutsch zu verbessern.", "I plan to improve my German.", "أنوي أن أحسّن لغتي الألمانية.", "Планирам да го подобрам германскиот."]
  - [hartmann, "Welches Niveau haben Sie?", "What level are you?", "ما مستواكِ؟", "Какво ниво имате?"]
  - [protagonist, "A2, glaube ich. Es ist schwer, die Artikel zu lernen!", "A2, I think. It's hard to learn the articles!", "A2، على ما أظن. من الصعب أن أتعلّم الأدوات!", "A2, мислам. Тешко е да се научат членовите!"]
  - [hartmann, "Dann machen Sie zuerst den Einstufungstest.", "Then take the placement test first.", "إذن قومي أولًا باختبار تحديد المستوى.", "Тогаш прво направете го тестот за ниво."]
  - [protagonist, "Wann ist der Kurs?", "When is the course?", "متى الدورة؟", "Кога е курсот?"]
  - [hartmann, "Abends, zweimal pro Woche. Wir fangen im März an.", "In the evenings, twice a week. We start in March.", "مساءً، مرتين في الأسبوع. نبدأ في مارس.", "Навечер, двапати неделно. Почнуваме во март."]
  - [protagonist, "Und die Gebühr?", "And the fee?", "والرسوم؟", "А таксата?"]
  - [hartmann, "Sie steht im Programmheft. Es gibt auch Ermäßigungen.", "It's in the programme booklet. There are also reductions.", "مكتوبة في كتيّب البرنامج. وهناك تخفيضات أيضًا.", "Пишува во програмата. Има и попусти."]
teach:
  - ask: ["Say: the Volkshochschule.", "قولي: الجامعة الشعبية.", "Кажете: народниот универзитет.", "Die Volkshochschule.", die-volkshochschule]
  - note: ["Many phrases take «zu» + infinitive at the end: «Ich habe vor, mein Deutsch zu verbessern», «Es ist schwer, die Artikel zu lernen».", "عبارات كثيرة تأخذ «zu» مع المصدر في الآخر: «Ich habe vor, mein Deutsch zu verbessern»، «Es ist schwer, die Artikel zu lernen».", "Многу изрази бараат «zu» + инфинитив на крајот: «Ich habe vor, mein Deutsch zu verbessern», «Es ist schwer, die Artikel zu lernen»."]
  - ask: ["Say: I plan to improve my German.", "قولي: أنوي أن أحسّن لغتي الألمانية.", "Кажете: планирам да го подобрам германскиот.", "Ich habe vor, mein Deutsch zu verbessern.", ich-habe-vor]
  - ask: ["He asks your level.", "يسأل عن مستواكِ.", "Тој прашува за нивото.", "Welches Niveau haben Sie?", das-niveau]
  - ask: ["Say: it's hard to learn the articles!", "قولي: من الصعب أن أتعلّم الأدوات!", "Кажете: тешко е да се научат членовите!", "Es ist schwer, die Artikel zu lernen!", es-ist-schwer]
  - ask: ["Say: the placement test.", "قولي: اختبار تحديد المستوى.", "Кажете: тестот за ниво.", "Der Einstufungstest.", der-einstufungstest]
  - ask: ["Say: in the evenings, twice a week.", "قولي: مساءً، مرتين في الأسبوع.", "Кажете: навечер, двапати неделно.", "Abends, zweimal pro Woche.", abends, zweimal-pro-woche]
  - ask: ["Say: we start in March.", "قولي: نبدأ في مارس.", "Кажете: почнуваме во март.", "Wir fangen im März an.", anfangen]
  - ask: ["Ask: and the fee?", "اسألي: والرسوم؟", "Прашајте: а таксата?", "Und die Gebühr?", die-gebuehr]
  - ask: ["Say: I feel like learning.", "قولي: أرغب في التعلّم.", "Кажете: имам желба да учам.", "Ich habe Lust, zu lernen.", hast-du-lust]
  - note: ["Every town has a Volkshochschule: languages, cooking, computers, yoga, history — for little money, in the evenings. A good place to keep learning German and to meet people outside work.", "في كل مدينة «Volkshochschule»: لغات وطبخ وحاسوب ويوغا وتاريخ — بمال قليل ومساءً. مكان جيد لمواصلة تعلّم الألمانية والتعرّف على أشخاص خارج العمل.", "Секој град има Volkshochschule: јазици, готвење, компјутери, јога, историја — за малку пари, навечер. Добро место да продолжите со германски и да запознаете луѓе надвор од работата."]
