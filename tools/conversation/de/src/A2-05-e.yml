id: A2-05-e
tracks: [en]
protagonist: f
title: ["Health insurance"]
situation: ["At the public health insurer's office. Public or private? The clerk explains."]
learn: [a2-dative]
culture: Public or private insurance
items:
  - [die-krankenkasse, "die Krankenkasse", "the health insurer"]
  - [gesetzlich, "gesetzlich", "public (statutory)"]
  - [privat, "privat", "private"]
  - [der-studententarif, "der Studententarif", "the student rate", {rare: true}]
  - [bis-dreissig, "bis etwa dreißig", "until about thirty"]
  - [die-wartezeit, "die Wartezeit", "the waiting period"]
  - [vorher-bezahlen, "vorher bezahlen", "pay first"]
  - [kein-zurueck, "kein Zurück", "no way back"]
  - [mit-mir, "mit mir", "with me"]
  - [ich-empfehle-ihnen, "Ich empfehle Ihnen …", "I recommend … to you"]
dialogue:
  - [kasse, "Möchten Sie gesetzlich oder privat versichert sein?", "Would you like to be publicly or privately insured?"]
  - [protagonist, "Was ist der Unterschied?", "What's the difference?"]
  - [kasse, "Gesetzlich gibt es den Studententarif — bei allen Kassen gleich, bis etwa dreißig.", "Public insurance has the student rate — the same at every insurer, until about thirty."]
  - [protagonist, "Und privat? Es ist billiger.", "And private? It's cheaper."]
  - [kasse, "Am Anfang. Aber oft mit Wartezeit, Sie bezahlen vorher, und es gibt eine Selbstbeteiligung.", "At first. But often with a waiting period, you pay first, and there's an excess."]
  - [protagonist, "Und später zurück zur gesetzlichen Kasse?", "And later back to public?"]
  - [kasse, "Während des Studiums gibt es kein Zurück.", "During your studies there's no way back."]
  - [protagonist, "Dann bleibe ich gesetzlich. Sprechen Sie mit mir Englisch?", "Then I'll stay public. Will you speak English with me?"]
  - [kasse, "Ein bisschen. Ich empfehle Ihnen das Formular auf Englisch.", "A little. I recommend the form in English to you."]
teach:
  - ask: ["She asks: public or private?", "Gesetzlich oder privat?", gesetzlich, privat]
  - ask: ["Say: the health insurer.", "Die Krankenkasse.", die-krankenkasse]
  - ask: ["Say: the student rate.", "Der Studententarif.", der-studententarif]
  - ask: ["Say: until about thirty.", "Bis etwa dreißig.", bis-dreissig]
  - ask: ["Say: a waiting period.", "Eine Wartezeit.", die-wartezeit]
  - ask: ["Say: you pay first.", "Sie bezahlen vorher.", vorher-bezahlen]
  - ask: ["Say: no way back.", "Kein Zurück.", kein-zurueck]
  - note: ["After «mit», «bei», «von», «zu» the dative follows: «mit mir» (with me), «bei allen Kassen», «zur gesetzlichen» (zu + der)."]
  - ask: ["Ask: will you speak English with me?", "Sprechen Sie mit mir Englisch?", mit-mir]
  - ask: ["She says: I recommend the English form.", "Ich empfehle Ihnen das Formular auf Englisch.", ich-empfehle-ihnen]
  - note: ["Public insurers charge students the same rate up to about thirty. Private plans look cheaper but often mean paying the doctor first, an excess, waiting periods — and no return to public insurance during your studies. Private plans usually reimburse medically necessary visits; read what yours excludes."]
