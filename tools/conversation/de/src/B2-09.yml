id: B2-09
protagonist: m
title: ["The universe", "الكون", "Вселената"]
situation:
  - "The VHS course goes to the planetarium. The dome turns dark — Professor Hartmann points to the stars."
  - "دورة الجامعة الشعبية تذهب إلى القبة السماوية. تُظلم القبة — والبروفيسور هارتمان يشير إلى النجوم."
  - "Курсот на народниот универзитет оди во планетариумот. Куполата се затемнува — професорот Хартман покажува кон ѕвездите."
learn: [b2-nominalisation]
culture: —
items:
  - [das-weltall, "das Weltall", "the universe, space", "الكون", "вселената"]
  - [das-lichtjahr, "das Lichtjahr", "the light year", "السنة الضوئية", "светлосната година"]
  - [die-umlaufbahn, "die Umlaufbahn", "the orbit", "المدار", "орбитата", {rare: true}]
  - [die-vergangenheit, "die Vergangenheit", "the past", "الماضي", "минатото"]
  - [die-milchstrasse, "die Milchstraße", "the Milky Way", "درب التبانة", "Млечниот Пат"]
  - [die-entfernung, "die Entfernung", "the distance", "المسافة", "оддалеченоста"]
  - [die-entstehung, "die Entstehung", "the origin, formation", "النشأة", "настанувањето"]
  - [die-beobachtung, "die Beobachtung", "the observation", "الرصد", "набљудувањето"]
  - [das-fernrohr, "das Teleskop", "the telescope", "التلسكوب", "телескопот"]
  - [winzig, "winzig", "tiny", "ضئيل", "мајушно"]
dialogue:
  - [hartmann, "Das ist die Milchstraße. Unsere Sonne ist einer von Milliarden Sternen.", "This is the Milky Way. Our sun is one of billions of stars.", "هذا درب التبانة. شمسنا واحدة من مليارات النجوم.", "Ова е Млечниот Пат. Нашето сонце е една од милијарди ѕвезди."]
  - [protagonist, "Wie groß ist die Entfernung zum nächsten Stern?", "How great is the distance to the nearest star?", "كم المسافة إلى أقرب نجم؟", "Колкава е оддалеченоста до најблиската ѕвезда?"]
  - [hartmann, "Gut vier Lichtjahre. Das Licht ist über vier Jahre unterwegs.", "A good four light years. The light travels for over four years.", "أكثر من أربع سنوات ضوئية. الضوء يسافر أكثر من أربع سنوات.", "Добри четири светлосни години. Светлината патува повеќе од четири години."]
  - [protagonist, "Und die Erde dreht sich auf ihrer Umlaufbahn um die Sonne.", "And the earth turns in its orbit around the sun.", "والأرض تدور في مدارها حول الشمس.", "А Земјата се врти по својата орбита околу сонцето."]
  - [hartmann, "Ja. Die Beobachtung der Planeten war der Anfang der modernen Wissenschaft.", "Yes. Observing the planets was the beginning of modern science.", "نعم. رصد الكواكب كان بداية العلم الحديث.", "Да. Набљудувањето на планетите беше почетокот на модерната наука."]
  - [protagonist, "Und die Entstehung des Weltalls?", "And the origin of the universe?", "ونشأة الكون؟", "А настанувањето на вселената?"]
  - [hartmann, "Vor fast vierzehn Milliarden Jahren. Mit dem Teleskop sehen wir weit in die Vergangenheit.", "Almost fourteen billion years ago. With the telescope we see far into the past.", "قبل نحو أربعة عشر مليار عام. بالتلسكوب نرى بعيدًا في الماضي.", "Пред речиси четиринаесет милијарди години. Со телескопот гледаме далеку во минатото."]
  - [protagonist, "Da fühlt man sich winzig.", "It makes you feel tiny.", "يشعر المرء هنا بأنه ضئيل.", "Човек тука се чувствува мајушен."]
teach:
  - ask: ["Say: the Milky Way.", "قل: درب التبانة.", "Кажете: Млечниот Пат.", "Die Milchstraße.", die-milchstrasse]
  - note: ["Nominalisation turns verbs into nouns: «entfernt sein» → «die Entfernung», «beobachten» → «die Beobachtung», «entstehen» → «die Entstehung». Formal and science texts use them a lot: «die Beobachtung der Planeten».", "التسمية تحوّل الأفعال إلى أسماء: «entfernt sein» ← «die Entfernung»، «beobachten» ← «die Beobachtung»، «entstehen» ← «die Entstehung». والنصوص الرسمية والعلمية تكثر منها: «die Beobachtung der Planeten».", "Номинализацијата ги прави глаголите именки: «entfernt sein» → «die Entfernung», «beobachten» → «die Beobachtung», «entstehen» → «die Entstehung». Формалните и научните текстови многу ги користат: «die Beobachtung der Planeten»."]
  - ask: ["Ask: how great is the distance?", "اسأل: كم المسافة؟", "Прашајте: колкава е оддалеченоста?", "Wie groß ist die Entfernung?", die-entfernung]
  - ask: ["Say: four light years.", "قل: أربع سنوات ضوئية.", "Кажете: четири светлосни години.", "Vier Lichtjahre.", das-lichtjahr]
  - ask: ["Say: the earth in its orbit.", "قل: الأرض في مدارها.", "Кажете: Земјата во својата орбита.", "Die Erde auf ihrer Umlaufbahn.", die-umlaufbahn]
  - ask: ["Say: observing the planets.", "قل: رصد الكواكب.", "Кажете: набљудувањето на планетите.", "Die Beobachtung der Planeten.", die-beobachtung, der-planet]
  - ask: ["Ask: and the origin of the universe?", "اسأل: ونشأة الكون؟", "Прашајте: а настанувањето на вселената?", "Und die Entstehung des Weltalls?", die-entstehung, das-weltall]
  - ask: ["Say: with the telescope.", "قل: بالتلسكوب.", "Кажете: со телескопот.", "Mit dem Teleskop.", das-fernrohr]
  - ask: ["Say: far into the past.", "قل: بعيدًا في الماضي.", "Кажете: далеку во минатото.", "Weit in die Vergangenheit.", die-vergangenheit]
  - ask: ["Say: you feel tiny.", "قل: يشعر المرء بأنه ضئيل.", "Кажете: човек се чувствува мајушен.", "Man fühlt sich winzig.", winzig]
