id: B2-17-ea
tracks: [en, ar]
protagonist: m
title: ["The payslip", "كشف الراتب"]
situation:
  - "Your first payslip at the new job. Why is net so much less than gross? Tim goes through it line by line."
  - "أول كشف راتب في الوظيفة الجديدة. لماذا الصافي أقل بكثير من الإجمالي؟ تيم يمرّ عليه سطرًا سطرًا."
learn: [de-b2-genitive-prepositions]
culture: Before you see your money
items:
  - [die-lohnabrechnung, "die Lohnabrechnung", "the payslip", "كشف الراتب", {rare: true}]
  - [brutto, "brutto", "gross", "إجمالي"]
  - [netto, "netto", "net", "صافٍ"]
  - [die-lohnsteuer, "die Lohnsteuer", "income tax (on wages)", "ضريبة الأجور", {rare: true}]
  - [die-krankenversicherung, "die Krankenversicherung", "health insurance", "التأمين الصحي"]
  - [die-pflegeversicherung, "die Pflegeversicherung", "long-term care insurance", "تأمين الرعاية", {rare: true}]
  - [die-rentenversicherung, "die Rentenversicherung", "pension insurance", "تأمين التقاعد", {rare: true}]
  - [die-alv, "die Arbeitslosenversicherung", "unemployment insurance", "تأمين البطالة", {rare: true}]
  - [der-arbeitgeberanteil, "der Arbeitgeberanteil", "the employer's share", "حصة صاحب العمل", {rare: true}]
  - [abzueglich, "abzüglich", "minus, less (+ genitive)", "مطروحًا منه"]
  - [aufgrund, "aufgrund", "because of, due to (+ genitive)", "بسبب"]
  - [innerhalb, "innerhalb", "within (+ genitive)", "خلال"]
dialogue:
  - [protagonist, "Brutto ist gut. Aber netto? Fast ein Drittel weniger!", "Gross is good. But net? Almost a third less!", "الإجمالي جيد. لكن الصافي؟ أقل بنحو الثلث!"]
  - [tim, "Willkommen in Deutschland. Schau: zuerst die Lohnsteuer, aufgrund deiner Steuerklasse.", "Welcome to Germany. Look: first income tax, due to your tax class.", "أهلًا بك في ألمانيا. انظر: أولًا ضريبة الأجور، بسبب فئتك الضريبية."]
  - [protagonist, "Und der Soli? Und hier — Kirchensteuer? Ich bin kein Kirchenmitglied!", "And the Soli? And here — church tax? I'm not a church member!", "وضريبة التضامن؟ وهنا — ضريبة الكنيسة؟ أنا لستُ عضوًا في كنيسة!"]
  - [tim, "Den Soli zahlst du bei deinem Gehalt nicht. Die Kirchensteuer ist ein Fehler — melde das innerhalb des Monats!", "You don't pay the Soli on your salary. The church tax is a mistake — report it within the month!", "لا تدفع ضريبة التضامن براتبك. ضريبة الكنيسة خطأ — أبلغ عنه خلال الشهر!"]
  - [protagonist, "Und dann die Versicherungen?", "And then the insurances?", "ثم التأمينات؟"]
  - [tim, "Kranken-, Pflege-, Renten- und Arbeitslosenversicherung. Die Hälfte zahlt der Arbeitgeber dazu — der Arbeitgeberanteil.", "Health, care, pension and unemployment insurance. The employer pays half on top — the employer's share.", "التأمين الصحي وتأمين الرعاية وتأمين التقاعد وتأمين البطالة. وصاحب العمل يدفع النصف إضافة — حصة صاحب العمل."]
  - [protagonist, "Also brutto abzüglich der Steuern und Abgaben ist netto.", "So gross minus taxes and contributions is net.", "إذن الإجمالي مطروحًا منه الضرائب والاشتراكات هو الصافي."]
  - [tim, "Genau. Dafür bist du versichert, wenn du krank wirst oder alt.", "Exactly. In return you're insured when you're ill or old.", "بالضبط. في المقابل أنت مؤمَّن عندما تمرض أو تكبر."]
teach:
  - ask: ["Say: the payslip.", "قل: كشف الراتب.", "Die Lohnabrechnung.", die-lohnabrechnung]
  - ask: ["Say: gross and net.", "قل: الإجمالي والصافي.", "Brutto und netto.", brutto, netto]
  - note: ["Some prepositions take the genitive, mostly in written German: «aufgrund deiner Steuerklasse» (due to), «innerhalb des Monats» (within), «abzüglich der Steuern» (minus). In speech people often use «wegen» with the dative.", "بعض حروف الجر تأخذ حالة الإضافة، خاصة في الألمانية المكتوبة: «aufgrund deiner Steuerklasse» (بسبب)، «innerhalb des Monats» (خلال)، «abzüglich der Steuern» (مطروحًا منه). وفي الكلام يستعمل الناس غالبًا «wegen» مع حالة الجر."]
  - ask: ["Say: income tax, due to your tax class.", "قل: ضريبة الأجور، بسبب فئتك الضريبية.", "Lohnsteuer, aufgrund deiner Steuerklasse.", die-lohnsteuer, aufgrund]
  - ask: ["Say: report it within the month.", "قل: أبلغ عنه خلال الشهر.", "Melde das innerhalb des Monats.", innerhalb]
  - ask: ["Say: health insurance.", "قل: التأمين الصحي.", "Die Krankenversicherung.", die-krankenversicherung]
  - ask: ["Say: care and pension insurance.", "قل: تأمين الرعاية وتأمين التقاعد.", "Pflege- und Rentenversicherung.", die-pflegeversicherung, die-rentenversicherung]
  - ask: ["Say: unemployment insurance.", "قل: تأمين البطالة.", "Die Arbeitslosenversicherung.", die-alv]
  - ask: ["Say: the employer's share.", "قل: حصة صاحب العمل.", "Der Arbeitgeberanteil.", der-arbeitgeberanteil]
  - ask: ["Say: gross minus taxes is net.", "قل: الإجمالي مطروحًا منه الضرائب هو الصافي.", "Brutto abzüglich der Steuern ist netto.", abzueglich]
  - ask: ["Say: church tax.", "قل: ضريبة الكنيسة.", "Die Kirchensteuer.", die-kirchensteuer]
  - note: ["From a third to almost half of gross pay goes before you see it: income tax (by tax class), sometimes Soli and church tax, and the four social insurances; the employer pays roughly the same share of the insurances on top. Church tax only applies to members of churches that levy it — if it appears wrongly, tell payroll and the tax office quickly. (No amounts: rates change yearly.)", "من الثلث إلى ما يقارب النصف من الراتب الإجمالي يُقتطع قبل أن تراه: ضريبة الأجور (حسب الفئة الضريبية)، وأحيانًا ضريبة التضامن وضريبة الكنيسة، والتأمينات الاجتماعية الأربعة؛ وصاحب العمل يدفع حصة مماثلة تقريبًا من التأمينات إضافة. ضريبة الكنيسة تخصّ أعضاء الكنائس التي تفرضها فقط — إن ظهرت خطأً فأبلغ قسم الرواتب ومكتب الضرائب بسرعة. (لا مبالغ: النسب تتغيّر سنويًا.)"]
