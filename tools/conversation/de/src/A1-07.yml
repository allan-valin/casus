id: A1-07
protagonist: f
title: ["Sunday", "الأحد", "Недела"]
situation:
  - "Sunday morning. You want to buy bread — and the supermarket is shut."
  - "صباح الأحد. تريدين شراء الخبز — والسوبرماركت مغلق."
  - "Недела наутро. Сакате да купите леб — а маркетот е затворен."
learn: [de-vm_01]
culture: Sunday closing and quiet
items:
  - [geschlossen, "geschlossen", "closed", "مغلق", "затворено"]
  - [heute-ist-sonntag, "heute ist Sonntag", "today is Sunday", "اليوم الأحد", "денес е недела"]
  - [alles, "alles", "everything", "كل شيء", "сè"]
  - [kann-ich, "Kann ich …?", "Can I …?", "هل يمكنني …؟", "Можам ли …?"]
  - [irgendwo, "irgendwo", "somewhere", "في مكان ما", "некаде"]
  - [brot, "Brot", "bread", "خبز", "леб"]
  - [die-baeckerei, "die Bäckerei", "the bakery", "المخبز", "пекарницата"]
  - [an-der-ecke, "an der Ecke", "on the corner", "عند الزاوية", "на аголот"]
  - [offen, "offen", "open", "مفتوح", "отворено"]
  - [der-feiertag, "der Feiertag", "the public holiday", "العطلة الرسمية", "празникот"]
  - [lieber-nicht, "lieber nicht", "better not", "الأفضل لا", "подобро не"]
  - [die-ruhe, "die Ruhe", "quiet, peace", "الهدوء", "мирот, тишината"]
  - [spazieren, "gehe … spazieren", "go for a walk", "أتمشّى", "одам на прошетка"]
dialogue:
  - [protagonist, "Guten Morgen, Frau Becker! Der Supermarkt ist geschlossen!", "Good morning, Mrs Becker! The supermarket is closed!", "صباح الخير يا سيدة بيكر! السوبرماركت مغلق!", "Добро утро, госпоѓо Бекер! Маркетот е затворен!"]
  - [becker, "Natürlich, heute ist Sonntag. Sonntags ist alles geschlossen.", "Of course, today is Sunday. On Sundays everything is closed.", "طبعًا، اليوم الأحد. أيام الأحد كل شيء مغلق.", "Секако, денес е недела. Во недела сè е затворено."]
  - [protagonist, "Kann ich irgendwo Brot kaufen?", "Can I buy bread anywhere?", "هل يمكنني شراء الخبز في مكان ما؟", "Можам ли некаде да купам леб?"]
  - [becker, "Die Bäckerei an der Ecke ist bis elf Uhr offen.", "The bakery on the corner is open till eleven.", "المخبز عند الزاوية مفتوح حتى الحادية عشرة.", "Пекарницата на аголот е отворена до единаесет."]
  - [protagonist, "Und morgen?", "And tomorrow?", "وغدًا؟", "А утре?"]
  - [becker, "Morgen ist Feiertag. Auch alles geschlossen.", "Tomorrow is a holiday. Everything closed too.", "غدًا عطلة رسمية. كل شيء مغلق أيضًا.", "Утре е празник. Исто сè затворено."]
  - [protagonist, "Oh nein! Kann ich heute Wäsche waschen?", "Oh no! Can I do the laundry today?", "يا للأسف! هل يمكنني غسل الملابس اليوم؟", "О, не! Можам ли денес да перам алишта?"]
  - [becker, "Lieber nicht. Sonntag ist Ruhe. Meine Nachbarin aus Ägypten sagt: Bei uns ist der Freitag ruhig.", "Better not. Sunday is quiet time. My neighbour from Egypt says: at home Friday is the quiet day.", "الأفضل لا. الأحد يوم هدوء. جارتي من مصر تقول: عندنا يوم الجمعة هو اليوم الهادئ.", "Подобро не. Неделата е за мир. Мојата соседка од Египет вели: кај нас петокот е мирниот ден."]
  - [protagonist, "Gut, dann gehe ich spazieren.", "Fine, then I'll go for a walk.", "حسنًا، إذن سأتمشّى.", "Добро, тогаш одам на прошетка."]
teach:
  - ask: ["Say: the supermarket is closed!", "قولي: السوبرماركت مغلق!", "Кажете: маркетот е затворен!", "Der Supermarkt ist geschlossen!", geschlossen]
  - ask: ["Say for her: today is Sunday.", "قوليها بلسانها: اليوم الأحد.", "Кажете наместо неа: денес е недела.", "Heute ist Sonntag.", heute-ist-sonntag]
  - ask: ["Say: everything is closed.", "قولي: كل شيء مغلق.", "Кажете: сè е затворено.", "Alles ist geschlossen.", alles, geschlossen]
  - note: ["«können» — can: «Kann ich …?» The second verb goes to the end, unchanged: «Kann ich Brot kaufen?»", "«können» تعني: يستطيع. «Kann ich …?»: هل يمكنني؟ والفعل الثاني يذهب إلى آخر الجملة بصيغة المصدر: «Kann ich Brot kaufen?»", "«können» — може: «Kann ich …?» Вториот глагол оди на крајот, непроменет: «Kann ich Brot kaufen?»"]
  - ask: ["Ask: can I buy bread somewhere?", "اسألي: هل يمكنني شراء الخبز في مكان ما؟", "Прашајте: можам ли некаде да купам леб?", "Kann ich irgendwo Brot kaufen?", kann-ich, irgendwo, brot]
  - ask: ["Say: the bakery on the corner.", "قولي: المخبز عند الزاوية.", "Кажете: пекарницата на аголот.", "Die Bäckerei an der Ecke.", die-baeckerei, an-der-ecke]
  - ask: ["Say: it's open till eleven.", "قولي: مفتوح حتى الحادية عشرة.", "Кажете: отворено е до единаесет.", "Sie ist bis elf Uhr offen.", offen]
  - ask: ["Say: tomorrow is a public holiday.", "قولي: غدًا عطلة رسمية.", "Кажете: утре е празник.", "Morgen ist Feiertag.", der-feiertag]
  - ask: ["She says: better not.", "تقول: الأفضل لا.", "Таа вели: подобро не.", "Lieber nicht.", lieber-nicht]
  - ask: ["Say: Sunday is for quiet.", "قولي: الأحد للهدوء.", "Кажете: неделата е за мир.", "Sonntag ist Ruhe.", die-ruhe]
  - ask: ["Say: then I'll go for a walk.", "قولي: إذن سأتمشّى.", "Кажете: тогаш одам на прошетка.", "Dann gehe ich spazieren.", spazieren]
  - note: ["Shops close on Sundays and public holidays; bakeries open for a few hours in the morning, and petrol stations and stations sell food. Sunday is a quiet day: no drilling, no loud laundry in many buildings.", "تُغلق المحلات أيام الأحد والعطل الرسمية؛ تفتح المخابز بضع ساعات صباحًا، وتبيع محطات الوقود ومحطات القطار الطعام. الأحد يوم هدوء: لا ثقب ولا غسالة صاخبة في كثير من العمارات.", "Продавниците се затворени во недела и на празници; пекарниците работат неколку часа наутро, а бензинските и железничките станици продаваат храна. Неделата е мирен ден: без дупчење и без бучна машина за перење во многу згради."]
  - only: {ar: "وكما في مصر وسوريا يوم الجمعة، هنا يوم الأحد هو يوم الراحة — لكنه أكثر صرامة: حتى الضجيج ممنوع."}
