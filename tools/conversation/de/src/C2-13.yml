id: C2-13
protagonist: f
title: ["Raising children", "تربية الأطفال", "Воспитување деца"]
situation:
  - "Emma is three now. Over coffee Svenja talks about rules, screen time — and grandparents who spoil her."
  - "إيما في الثالثة الآن. على القهوة تتحدّث سفينيا عن القواعد ووقت الشاشة — والأجداد الذين يدلّلونها."
  - "Ема сега има три години. На кафе Свења зборува за правила, време пред екран — и за бабите и дедовците што ја разгалуваат."
learn: [c2-particles]
culture: Discipline differs
items:
  - [die-grenzen, "Grenzen setzen", "set limits", "يضع حدودًا", "поставува граници"]
  - [die-medienzeit, "die Medienzeit", "screen time", "وقت الشاشة", "времето пред екран", {rare: true}]
  - [verwoehnen, "verwöhnen", "spoil", "يدلّل", "разгалува"]
  - [konsequent, "konsequent", "consistent", "ثابت على موقفه", "доследно"]
  - [der-trotzanfall, "der Trotzanfall", "the tantrum", "نوبة العناد", "нападот на тврдоглавост", {rare: true}]
  - [schon-mal, "schon mal", "(particle) ever, already", "(أداة) من قبل", "(честичка) некогаш"]
  - [halt-eben, "halt eben", "(particles) that's just how it is", "(أداتان) هكذا الأمر", "(честички) така е"]
  - [doch-wohl, "doch wohl", "(particles) surely", "(أداتان) بالتأكيد", "(честички) сигурно"]
  - [die-auszeit, "die Auszeit", "the time-out", "فترة التهدئة", "паузата за смирување"]
  - [die-erziehung, "die Erziehung", "upbringing", "التربية", "воспитувањето"]
dialogue:
  - [svenja, "Hattest du schon mal einen Trotzanfall im Supermarkt? Emma gestern — eine halbe Stunde!", "Have you ever had a tantrum in the supermarket? Emma yesterday — half an hour!", "هل مرّت بكِ من قبل نوبة عناد في السوبرماركت؟ إيما أمس — نصف ساعة!", "Дали некогаш ти се случил напад на тврдоглавост во супермаркет? Ема вчера — половина час!"]
  - [protagonist, "Was hast du gemacht?", "What did you do?", "ماذا فعلتِ؟", "Што направи?"]
  - [svenja, "Ruhig bleiben und konsequent sein. Nein heißt nein — auch an der Kasse.", "Stay calm and be consistent. No means no — even at the checkout.", "أن أبقى هادئة وثابتة. «لا» تعني لا — حتى عند الصندوق.", "Да останам мирна и доследна. Не значи не — и на каса."]
  - [protagonist, "Bei uns hätte die Oma ihr einfach Schokolade gegeben.", "With us grandma would simply have given her chocolate.", "عندنا كانت الجدة ستعطيها الشوكولاتة ببساطة.", "Кај нас бабата едноставно ќе ѝ дадеше чоколадо."]
  - [svenja, "Meine Mutter auch! Großeltern verwöhnen halt eben. Das ist doch wohl ihr Recht.", "My mother too! Grandparents just spoil them, that's how it is. Surely that's their right.", "أمي أيضًا! الأجداد يدلّلون، هكذا الأمر. بالتأكيد هذا حقّهم.", "И мајка ми! Бабите и дедовците така е — разгалуваат. Тоа сигурно им е право."]
  - [protagonist, "Und Medienzeit? Bekommt Emma ein Tablet?", "And screen time? Does Emma get a tablet?", "ووقت الشاشة؟ هل تحصل إيما على جهاز لوحي؟", "А времето пред екран? Дали Ема добива таблет?"]
  - [svenja, "Höchstens eine halbe Stunde am Tag. Die Kinderärztin sagt: unter drei am besten gar nicht.", "Half an hour a day at most. The paediatrician says: under three, ideally not at all.", "نصف ساعة يوميًا على الأكثر. طبيبة الأطفال تقول: تحت الثالثة الأفضل ألّا يكون إطلاقًا.", "Најмногу половина час дневно. Педијатарката вели: под три години најдобро воопшто не."]
  - [protagonist, "Grenzen setzen und trotzdem liebevoll sein — das ist die Kunst.", "Setting limits and still being loving — that's the art.", "وضع الحدود مع البقاء محبّة — هذا هو الفن.", "Поставување граници и сепак да бидеш нежна — тоа е уметноста."]
teach:
  - ask: ["Say: a tantrum.", "قولي: نوبة عناد.", "Кажете: напад на тврдоглавост.", "Ein Trotzanfall.", der-trotzanfall]
  - note: ["Particles carry attitude: «schon mal» (ever), «halt eben» (that's just how it is — resigned), «doch wohl» (surely — expecting agreement). Two particles together soften or strengthen even more.", "الأدوات تحمل الموقف: «schon mal» (من قبل)، «halt eben» (هكذا الأمر — باستسلام)، «doch wohl» (بالتأكيد — مع توقّع الموافقة). وأداتان معًا تلطّفان أو تقوّيان أكثر.", "Честичките носат став: «schon mal» (некогаш), «halt eben» (така е — со помирување), «doch wohl» (сигурно — очекувајќи согласност). Две честички заедно уште повеќе омекнуваат или засилуваат."]
  - ask: ["Ask: have you ever had a tantrum?", "اسألي: هل مرّت بكِ من قبل نوبة عناد؟", "Прашајте: дали некогаш имаше напад?", "Hattest du schon mal einen Trotzanfall?", schon-mal]
  - ask: ["Say: be consistent.", "قولي: كوني ثابتة.", "Кажете: биди доследна.", "Konsequent sein.", konsequent]
  - ask: ["Say: grandparents just spoil them.", "قولي: الأجداد يدلّلون، هكذا الأمر.", "Кажете: бабите и дедовците така е — разгалуваат.", "Großeltern verwöhnen halt eben.", verwoehnen, halt-eben]
  - ask: ["Say: surely that's their right.", "قولي: بالتأكيد هذا حقّهم.", "Кажете: тоа сигурно им е право.", "Das ist doch wohl ihr Recht.", doch-wohl]
  - ask: ["Say: screen time.", "قولي: وقت الشاشة.", "Кажете: времето пред екран.", "Die Medienzeit.", die-medienzeit]
  - ask: ["Say: set limits.", "قولي: ضعي حدودًا.", "Кажете: постави граници.", "Grenzen setzen.", die-grenzen]
  - ask: ["Say: a time-out.", "قولي: فترة تهدئة.", "Кажете: пауза за смирување.", "Eine Auszeit.", die-auszeit]
  - ask: ["Say: upbringing.", "قولي: التربية.", "Кажете: воспитувањето.", "Die Erziehung.", die-erziehung]
  - note: ["Hitting children is forbidden by law in Germany (since 2000), including a slap. Parents are expected to set clear limits calmly and consistently. Many paediatricians advise no screens under three and short, guided screen time afterwards. Grandparents' spoiling is a joke everywhere — and a clash point in many families.", "ضرب الأطفال ممنوع قانونًا في ألمانيا (منذ 2000)، بما في ذلك الصفعة. ويُتوقّع من الوالدين وضع حدود واضحة بهدوء وثبات. وكثير من أطباء الأطفال ينصحون بلا شاشات تحت الثالثة، ثم بوقت شاشة قصير ومُوجَّه. وتدليل الأجداد نكتة في كل مكان — ونقطة خلاف في عائلات كثيرة.", "Удирањето деца е забрането со закон во Германија (од 2000), вклучително и шамар. Од родителите се очекува мирно и доследно да поставуваат јасни граници. Многу педијатри советуваат без екрани под три години, а потоа кратко, водено време. Разгалувањето од бабите и дедовците е шега насекаде — и точка на судир во многу семејства."]
