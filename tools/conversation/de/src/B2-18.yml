id: B2-18
protagonist: f
title: ["Integration", "الاندماج", "Интеграција"]
situation:
  - "A discussion evening at the VHS on integration. A man says: 'They don't want to integrate.' You answer — calmly."
  - "أمسية نقاش في الجامعة الشعبية عن الاندماج. رجل يقول: «إنهم لا يريدون الاندماج.» تجيبين — بهدوء."
  - "Вечер на дискусија на народниот универзитет за интеграцијата. Еден човек вели: „Тие не сакаат да се интегрираат.“ Одговарате — мирно."
learn: [b2-connectors]
culture: Answering racism
items:
  - [die-teilhabe, "die Teilhabe", "participation", "المشاركة", "учеството", {rare: true}]
  - [einerseits-andererseits, "einerseits … andererseits", "on the one hand … on the other", "من جهة … ومن جهة أخرى", "од една страна … од друга страна"]
  - [ausserdem, "außerdem", "besides, moreover", "فضلًا عن ذلك", "освен тоа"]
  - [folglich, "folglich", "consequently", "بالتالي", "следствено"]
  - [pauschal, "pauschal", "sweeping, across the board", "تعميمي", "паушално"]
  - [der-rassismus, "der Rassismus", "racism", "العنصرية", "расизмот"]
  - [das-stimmt-so-nicht, "Das stimmt so nicht", "That's not quite right", "هذا ليس صحيحًا هكذا", "Тоа не е баш така"]
  - [die-chancengleichheit, "die Chancengleichheit", "equal opportunity", "تكافؤ الفرص", "еднаквите можности", {rare: true}]
  - [der-arbeitsmarkt, "der Arbeitsmarkt", "the job market", "سوق العمل", "пазарот на трудот"]
  - [beitragen, "beitragen", "contribute", "يساهم", "придонесува"]
dialogue:
  - [hartmann, "Unser Thema heute: Integration und Teilhabe. Wer möchte anfangen?", "Our topic today: integration and participation. Who'd like to start?", "موضوعنا اليوم: الاندماج والمشاركة. من يودّ أن يبدأ؟", "Нашата тема денес: интеграција и учество. Кој сака да почне?"]
  - [poebler, "Die wollen sich doch gar nicht integrieren.", "They don't even want to integrate.", "هم لا يريدون الاندماج أصلًا.", "Тие воопшто не сакаат да се интегрираат."]
  - [protagonist, "Das stimmt so nicht. Das ist pauschal.", "That's not quite right. That's a sweeping statement.", "هذا ليس صحيحًا هكذا. هذا تعميم.", "Тоа не е баш така. Тоа е паушално."]
  - [protagonist, "Einerseits lernen wir Deutsch, arbeiten und zahlen Steuern. Andererseits warten viele Jahre auf Kurse und Anerkennung.", "On the one hand we learn German, work and pay taxes. On the other, many wait years for courses and recognition.", "من جهة نتعلّم الألمانية ونعمل وندفع الضرائب. ومن جهة أخرى ينتظر كثيرون سنوات للدورات والاعتراف.", "Од една страна учиме германски, работиме и плаќаме даноци. Од друга страна многумина чекаат години за курсеви и признавање."]
  - [poebler, "Aber die Kriminalität...", "But the crime...", "لكن الجريمة...", "Но криминалот..."]
  - [protagonist, "Außerdem: mit einem fremden Namen bekommt man seltener eine Wohnung oder einen Job. Folglich ist Integration auch Ihre Aufgabe.", "Besides: with a foreign name you get a flat or a job less often. Consequently integration is your task too.", "فضلًا عن ذلك: باسم أجنبي يحصل المرء على شقة أو عمل بنسبة أقل. وبالتالي فالاندماج مهمتك أنت أيضًا.", "Освен тоа: со странско име поретко се добива стан или работа. Следствено, интеграцијата е и ваша задача."]
  - [hartmann, "Ein wichtiger Punkt: Chancengleichheit auf dem Arbeitsmarkt.", "An important point: equal opportunity on the job market.", "نقطة مهمة: تكافؤ الفرص في سوق العمل.", "Важна поента: еднакви можности на пазарот на трудот."]
  - [protagonist, "Wir wollen beitragen. Lassen Sie uns.", "We want to contribute. Let us.", "نحن نريد أن نساهم. دعونا نفعل.", "Сакаме да придонесеме. Дозволете ни."]
teach:
  - ask: ["Say: integration and participation.", "قولي: الاندماج والمشاركة.", "Кажете: интеграција и учество.", "Integration und Teilhabe.", die-teilhabe]
  - ask: ["Answer calmly: that's not quite right.", "أجيبي بهدوء: هذا ليس صحيحًا هكذا.", "Одговорете мирно: тоа не е баш така.", "Das stimmt so nicht.", das-stimmt-so-nicht]
  - ask: ["Say: that's a sweeping statement.", "قولي: هذا تعميم.", "Кажете: тоа е паушално.", "Das ist pauschal.", pauschal]
  - note: ["Connectors structure an argument: «einerseits … andererseits» (on the one hand … on the other), «außerdem» (besides), «folglich» (consequently). After «außerdem» and «folglich» the verb comes next.", "أدوات الربط تنظّم الحجة: «einerseits … andererseits» (من جهة … ومن جهة أخرى)، «außerdem» (فضلًا عن ذلك)، «folglich» (بالتالي). وبعد «außerdem» و«folglich» يأتي الفعل مباشرة.", "Сврзниците го структурираат аргументот: «einerseits … andererseits» (од една страна … од друга), «außerdem» (освен тоа), «folglich» (следствено). По «außerdem» и «folglich» глаголот доаѓа веднаш."]
  - ask: ["Say: on the one hand we learn German, on the other we wait.", "قولي: من جهة نتعلّم الألمانية، ومن جهة أخرى ننتظر.", "Кажете: од една страна учиме германски, од друга чекаме.", "Einerseits lernen wir Deutsch, andererseits warten wir.", einerseits-andererseits]
  - ask: ["Say: besides, it's harder with a foreign name.", "قولي: فضلًا عن ذلك، الأمر أصعب باسم أجنبي.", "Кажете: освен тоа, потешко е со странско име.", "Außerdem ist es mit einem fremden Namen schwerer.", ausserdem]
  - ask: ["Say: consequently it's your task too.", "قولي: وبالتالي فهي مهمتك أيضًا.", "Кажете: следствено, тоа е и ваша задача.", "Folglich ist es auch Ihre Aufgabe.", folglich]
  - ask: ["Say: equal opportunity on the job market.", "قولي: تكافؤ الفرص في سوق العمل.", "Кажете: еднакви можности на пазарот на трудот.", "Chancengleichheit auf dem Arbeitsmarkt.", die-chancengleichheit, der-arbeitsmarkt]
  - ask: ["Say: we want to contribute.", "قولي: نريد أن نساهم.", "Кажете: сакаме да придонесеме.", "Wir wollen beitragen.", beitragen]
  - ask: ["Name it: that's racism.", "سمّيه: هذه عنصرية.", "Именувајте го: тоа е расизам.", "Das ist Rassismus.", der-rassismus]
  - note: ["Against a sweeping remark, stay factual: name it ('Das ist pauschal'), give one or two concrete facts, and turn it into a shared task. You don't have to convince the speaker — often the listeners are the ones you reach. If it becomes abuse or a threat, you may end the conversation, and anti-discrimination offices advise for free.", "أمام ملاحظة تعميمية ابقي موضوعية: سمّيها («Das ist pauschal»)، واذكري حقيقة أو اثنتين محددتين، وحوّليها إلى مهمة مشتركة. لستِ مضطرة لإقناع المتكلّم — غالبًا المستمعون هم من تصلين إليهم. وإذا صارت إساءة أو تهديدًا فلكِ أن تنهي الحديث، ومكاتب مكافحة التمييز تقدّم استشارة مجانية.", "Против паушална забелешка останете фактички: именувајте ја („Das ist pauschal“), дајте еден-два конкретни факти и претворете ја во заедничка задача. Не мора да го убедите говорникот — често слушателите се тие до кои ќе стигнете. Ако премине во навреда или закана, смеете да го прекинете разговорот, а канцелариите против дискриминација советуваат бесплатно."]
