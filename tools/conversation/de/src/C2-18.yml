id: C2-18
protagonist: m
title: ["The diagnosis", "التشخيص", "Дијагнозата"]
situation:
  - "The MRI results are in. Dr Wagner explains the report in detail — and the orthopaedist wants to operate. You ask about a second opinion."
  - "وصلت نتائج الرنين المغناطيسي. الدكتورة فاغنر تشرح التقرير بالتفصيل — وطبيب العظام يريد إجراء عملية. تسأل عن رأي ثانٍ."
  - "Резултатите од магнетната резонанца стигнаа. Д-р Вагнер детално го објаснува наодот — а ортопедот сака да оперира. Прашувате за второ мислење."
learn: []
learn_missing: [medical-register]
culture: The right to a second opinion
items:
  - [der-befund, "der Befund", "the findings, report", "التقرير الطبي", "наодот"]
  - [die-diagnose, "die Diagnose", "the diagnosis", "التشخيص", "дијагнозата"]
  - [der-meniskusriss, "der Meniskusriss", "the torn meniscus", "تمزّق الغضروف الهلالي", "кинењето на менискусот", {rare: true}]
  - [der-eingriff, "der Eingriff", "the procedure, operation", "التدخّل الجراحي", "интервенцијата"]
  - [konservativ, "konservativ behandeln", "treat without surgery", "يعالج دون جراحة", "лекува конзервативно"]
  - [die-zweitmeinung, "die Zweitmeinung", "the second opinion", "الرأي الطبي الثاني", "второто мислење"]
  - [die-erfolgsaussichten, "die Erfolgsaussichten", "the chances of success", "فرص النجاح", "изгледите за успех", {rare: true}]
  - [die-risiken, "die Risiken", "the risks", "المخاطر", "ризиците"]
  - [die-physiotherapie, "die Physiotherapie", "physiotherapy", "العلاج الطبيعي", "физиотерапијата"]
  - [die-aufklaerung-arzt, "das Aufklärungsgespräch", "the informed-consent talk", "حديث الإفصاح قبل العملية", "разговорот за информирана согласност", {rare: true}]
dialogue:
  - [wagner, "Der Befund zeigt einen Meniskusriss im rechten Knie. Kein Grund zur Panik.", "The report shows a torn meniscus in your right knee. No reason to panic.", "التقرير يُظهر تمزّقًا في الغضروف الهلالي في الركبة اليمنى. لا داعي للذعر.", "Наодот покажува кинење на менискусот во десното колено. Нема причина за паника."]
  - [protagonist, "Der Orthopäde will sofort operieren. Ist der Eingriff wirklich nötig?", "The orthopaedist wants to operate at once. Is the procedure really necessary?", "طبيب العظام يريد إجراء العملية فورًا. هل التدخّل ضروري حقًا؟", "Ортопедот сака веднаш да оперира. Дали интервенцијата е навистина потребна?"]
  - [wagner, "Nicht unbedingt. Bei Ihrem Alter kann man oft erst konservativ behandeln — mit Physiotherapie.", "Not necessarily. At your age it can often be treated without surgery first — with physiotherapy.", "ليس بالضرورة. في عمرك يمكن غالبًا العلاج أولًا دون جراحة — بالعلاج الطبيعي.", "Не мора. На ваша возраст често прво може да се лекува конзервативно — со физиотерапија."]
  - [protagonist, "Und die Erfolgsaussichten? Und die Risiken einer Operation?", "And the chances of success? And the risks of an operation?", "وفرص النجاح؟ ومخاطر العملية؟", "А изгледите за успех? И ризиците од операција?"]
  - [wagner, "Das muss Ihnen der Operateur im Aufklärungsgespräch genau erklären. Fragen Sie alles.", "The surgeon must explain that precisely in the informed-consent talk. Ask everything.", "يجب أن يشرح لك الجرّاح ذلك بدقة في حديث الإفصاح قبل العملية. اسأل عن كل شيء.", "Тоа мора точно да ви го објасни хирургот во разговорот за информирана согласност. Прашајте сѐ."]
  - [protagonist, "Darf ich eine Zweitmeinung einholen?", "May I get a second opinion?", "هل يحق لي طلب رأي طبي ثانٍ؟", "Смеам ли да побарам второ мислење?"]
  - [wagner, "Selbstverständlich. Bei manchen geplanten Operationen haben Sie sogar einen gesetzlichen Anspruch darauf.", "Of course. For some planned operations you even have a legal right to one.", "بالطبع. في بعض العمليات المخطّط لها لديك حتى حق قانوني في ذلك.", "Се разбира. За некои планирани операции имате дури законско право на тоа."]
  - [protagonist, "Dann warte ich mit der Diagnose ab und hole mir eine zweite Meinung.", "Then I'll hold on with the diagnosis and get a second opinion.", "إذن أتريّث بشأن التشخيص وأطلب رأيًا ثانيًا.", "Тогаш ќе почекам со дијагнозата и ќе побарам второ мислење."]
teach:
  - ask: ["Say: the report shows…", "قل: التقرير يُظهر…", "Кажете: наодот покажува…", "Der Befund zeigt…", der-befund]
  - ask: ["Say: a torn meniscus.", "قل: تمزّق الغضروف الهلالي.", "Кажете: кинење на менискусот.", "Ein Meniskusriss.", der-meniskusriss]
  - note: ["Medical register is precise and nominal: «der Befund», «die Diagnose», «der Eingriff», «konservativ behandeln», «die Erfolgsaussichten». Asking exactly in the same words gets exact answers.", "الأسلوب الطبي دقيق واسمي: «der Befund»، «die Diagnose»، «der Eingriff»، «konservativ behandeln»، «die Erfolgsaussichten». والسؤال بالكلمات نفسها يجلب أجوبة دقيقة.", "Медицинскиот регистар е прецизен и номинален: «der Befund», «die Diagnose», «der Eingriff», «konservativ behandeln», «die Erfolgsaussichten». Прашувањето со истите зборови носи точни одговори."]
  - ask: ["Ask: is the procedure really necessary?", "اسأل: هل التدخّل ضروري حقًا؟", "Прашајте: дали интервенцијата е навистина потребна?", "Ist der Eingriff wirklich nötig?", der-eingriff]
  - ask: ["Say: treat without surgery, with physiotherapy.", "قل: العلاج دون جراحة، بالعلاج الطبيعي.", "Кажете: конзервативно, со физиотерапија.", "Konservativ behandeln, mit Physiotherapie.", konservativ, die-physiotherapie]
  - ask: ["Ask about chances of success and risks.", "اسأل عن فرص النجاح والمخاطر.", "Прашајте за изгледите и ризиците.", "Die Erfolgsaussichten und die Risiken?", die-erfolgsaussichten, die-risiken]
  - ask: ["Say: the informed-consent talk.", "قل: حديث الإفصاح قبل العملية.", "Кажете: разговорот за информирана согласност.", "Das Aufklärungsgespräch.", die-aufklaerung-arzt]
  - ask: ["Ask: may I get a second opinion?", "اسأل: هل يحق لي طلب رأي ثانٍ؟", "Прашајте: смеам ли да побарам второ мислење?", "Darf ich eine Zweitmeinung einholen?", die-zweitmeinung]
  - ask: ["Say: the diagnosis.", "قل: التشخيص.", "Кажете: дијагнозата.", "Die Diagnose.", die-diagnose]
  - note: ["Before any operation the surgeon must explain it, its risks and alternatives in a consent talk, and you sign only afterwards. For certain planned operations public insurance gives a legal right to a second opinion, and many insurers pay for one anyway. You may also ask for copies of all your findings.", "قبل أي عملية يجب أن يشرحها الجرّاح ومخاطرها وبدائلها في حديث إفصاح، ولا توقّع إلا بعد ذلك. وفي عمليات مخطّط لها معيّنة يمنح التأمين العام حقًا قانونيًا في رأي ثانٍ، وكثير من شركات التأمين تدفعه على أي حال. ويحق لك أيضًا طلب نسخ من كل تقاريرك.", "Пред секоја операција хирургот мора да ја објасни, ризиците и алтернативите во разговор за согласност, а вие потпишувате дури потоа. За одредени планирани операции јавното осигурување дава законско право на второ мислење, а многу каси го плаќаат и онака. Можете да побарате и копии од сите наоди."]
