id: A1-13-a
tracks: [ar]
protagonist: f
title: ["الملعب"]
situation: ["بعد الحضانة، يارا على الأرجوحة. أمٌّ أخرى تبدأ الحديث معكِ."]
learn: [a1-negation]
culture: Halal food at the Kita
items:
  - [der-spielplatz, "der Spielplatz", "ملعب الأطفال"]
  - [die-schaukel, "die Schaukel", "الأرجوحة", {rare: true}]
  - [wie-alt-ist-sie, "Wie alt ist sie?", "كم عمرها؟"]
  - [vier-jahre-alt, "vier Jahre alt", "أربع سنوات"]
  - [in-welche-kita, "In welche Kita …?", "إلى أيّ حضانة …؟"]
  - [geht, "geht", "تذهب"]
  - [das-mittagessen, "das Mittagessen", "الغداء"]
  - [kein-schweinefleisch, "kein Schweinefleisch", "بلا لحم خنزير"]
  - [isst, "isst", "تأكل"]
  - [nicht, "nicht", "لا (نفي)"]
  - [bis-bald, "Bis bald!", "إلى اللقاء قريبًا!"]
dialogue:
  - [lena, "Hallo! Wie alt ist sie?", "مرحبًا! كم عمرها؟"]
  - [protagonist, "Hallo. Yara ist vier Jahre alt.", "مرحبًا. يارا عمرها أربع سنوات."]
  - [lena, "Mein Sohn auch! In welche Kita geht sie?", "ابني أيضًا! إلى أيّ حضانة تذهب؟"]
  - [protagonist, "In die Kita Sonnenschein.", "إلى حضانة زونِنشاين."]
  - [lena, "Ah, die ist gut! Isst Yara dort zu Mittag?", "آه، إنها جيدة! هل تتغدّى يارا هناك؟"]
  - [protagonist, "Ja, aber sie isst kein Schweinefleisch.", "نعم، لكنها لا تأكل لحم الخنزير."]
  - [lena, "Kein Problem, die Kita kocht auch ohne Fleisch.", "لا مشكلة، الحضانة تطبخ أيضًا بلا لحم."]
  - [protagonist, "Gut. Yara, nicht so hoch auf der Schaukel!", "جيد. يارا، ليس بهذا العلو على الأرجوحة!"]
  - [lena, "Ich bin Lena. Bis bald!", "أنا لينا. إلى اللقاء قريبًا!"]
teach:
  - ask: ["تسألك عن عمر ابنتك. كيف؟", "Wie alt ist sie?", wie-alt-ist-sie]
  - ask: ["أجيبي: عمرها أربع سنوات.", "Sie ist vier Jahre alt.", vier-jahre-alt]
  - ask: ["تسأل: إلى أيّ حضانة تذهب؟", "In welche Kita geht sie?", in-welche-kita, geht]
  - ask: ["قولي: ملعب الأطفال.", "Der Spielplatz.", der-spielplatz]
  - ask: ["تسأل عن الغداء. قولي: الغداء.", "Das Mittagessen.", das-mittagessen]
  - note: ["«kein» تنفي الاسم: «kein Schweinefleisch». و«nicht» تنفي غيره: «nicht so hoch»."]
  - ask: ["قولي: لا تأكل لحم الخنزير.", "Sie isst kein Schweinefleisch.", isst, kein-schweinefleisch]
  - ask: ["قولي لابنتك: ليس بهذا العلو على الأرجوحة!", "Nicht so hoch auf der Schaukel!", nicht, die-schaukel]
  - ask: ["ودّعيها: إلى اللقاء قريبًا!", "Bis bald!", bis-bald]
  - note: ["معظم الحضانات تقدّم وجبة بلا لحم خنزير أو وجبة نباتية عند الطلب — قوليه للمربية من اليوم الأول. والملعب مكان تعارف: الأمهات والآباء يتكلمون بـ«du» بسرعة."]
