id: C2-12-m
tracks: [mk]
protagonist: m
title: ["Предавање на Сениорската академија"]
situation: ["На Сениорската академија во Лајпциг ве замолија да зборувате за Битола — од Хераклеја до денес."]
learn: [c2-academic-register]
culture: The academic register
items:
  - [die-seniorenakademie, "die Seniorenakademie", "сениорската академија", {rare: true}]
  - [die-antike, "die Antike", "антиката"]
  - [die-ausgrabung, "die Ausgrabung", "ископината"]
  - [das-mosaik, "das Mosaik", "мозаикот"]
  - [es-laesst-sich-zeigen, "es lässt sich zeigen, dass …", "може да се покаже дека …"]
  - [die-quelle-c2, "die historische Quelle", "историскиот извор"]
  - [im-folgenden, "im Folgenden", "во продолжение"]
  - [die-epoche, "die Epoche", "епохата"]
  - [das-osmanische-reich, "das Osmanische Reich", "Отоманската империја"]
  - [die-konsulatsstadt, "die Stadt der Konsuln", "градот на конзулите"]
dialogue:
  - [protagonist, "Im Folgenden spreche ich über Bitola — von der Antike bis heute.", "Во продолжение ќе зборувам за Битола — од антиката до денес."]
  - [protagonist, "Die Ausgrabungen von Heraclea zeigen Mosaike aus dem fünften Jahrhundert.", "Ископините на Хераклеја покажуваат мозаици од петтиот век."]
  - [hartmann, "Aus welcher Epoche stammt die heutige Altstadt?", "Од која епоха потекнува денешниот стар град?"]
  - [protagonist, "Aus der Zeit des Osmanischen Reiches. Später war Bitola die Stadt der Konsuln.", "Од времето на Отоманската империја. Подоцна Битола беше градот на конзулите."]
  - [hartmann, "Woher wissen wir das?", "Од каде го знаеме тоа?"]
  - [protagonist, "Aus historischen Quellen. Es lässt sich zeigen, dass dort zwölf Konsulate standen.", "Од историски извори. Може да се покаже дека таму имало дванаесет конзулати."]
  - [hartmann, "Faszinierend. Und auf Deutsch — mit fünfundsechzig gelernt!", "Фасцинантно. И на германски — научен на шеесет и пет!"]
  - [protagonist, "Man ist nie zu alt. Das ist mein wichtigstes Ergebnis.", "Човек никогаш не е премногу стар. Тоа е мојот најважен резултат."]
teach:
  - ask: ["Кажете: сениорската академија.", "Die Seniorenakademie.", die-seniorenakademie]
  - note: ["Академскиот регистар избегнува „мислам“: «Im Folgenden…» (во продолжение), «Es lässt sich zeigen, dass…» (може да се покаже), и наведува извори: «aus historischen Quellen»."]
  - ask: ["Кажете: во продолжение.", "Im Folgenden.", im-folgenden]
  - ask: ["Кажете: од антиката до денес.", "Von der Antike bis heute.", die-antike]
  - ask: ["Кажете: ископините покажуваат мозаици.", "Die Ausgrabungen zeigen Mosaike.", die-ausgrabung, das-mosaik]
  - ask: ["Прашајте: од која епоха?", "Aus welcher Epoche?", die-epoche]
  - ask: ["Кажете: Отоманската империја.", "Das Osmanische Reich.", das-osmanische-reich]
  - ask: ["Кажете: градот на конзулите.", "Die Stadt der Konsuln.", die-konsulatsstadt]
  - ask: ["Кажете: од историски извори.", "Aus historischen Quellen.", die-quelle-c2]
  - ask: ["Кажете: може да се покаже дека…", "Es lässt sich zeigen, dass…", es-laesst-sich-zeigen]
  - note: ["Сениорските академии и универзитетите за трето доба нудат предавања за постари — и бараат гости што ќе раскажат за својот крај. Наведувањето извори и епохи го прави предавањето академско, а личната приказна го прави живо."]
