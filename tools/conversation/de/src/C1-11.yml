id: C1-11
protagonist: f
title: ["Data protection", "حماية البيانات", "Заштита на податоци"]
situation:
  - "A company you've never dealt with keeps calling you. Where did they get your number? Jonas helps you use your GDPR rights."
  - "شركة لم تتعاملي معها قط تتصل بكِ باستمرار. من أين حصلت على رقمكِ؟ يوناس يساعدكِ على استعمال حقوقكِ في حماية البيانات."
  - "Фирма со која никогаш не сте имале работа постојано ви се јавува. Од каде го има бројот? Јонас ви помага да ги искористите правата од GDPR."
learn: [c1-passive-modal]
culture: GDPR — rights and excuses
items:
  - [der-datenschutz, "der Datenschutz", "data protection", "حماية البيانات", "заштитата на податоци"]
  - [die-dsgvo, "die DSGVO", "the GDPR", "اللائحة العامة لحماية البيانات", "GDPR (регулативата за податоци)", {rare: true}]
  - [die-auskunft, "die Auskunft", "the (data) access request, information", "طلب الاطلاع، المعلومات", "барањето за пристап, информацијата"]
  - [die-einwilligung, "die Einwilligung", "consent", "الموافقة", "согласноста"]
  - [muss-geloescht-werden, "muss gelöscht werden", "must be deleted", "يجب أن يُحذف", "мора да се избрише"]
  - [darf-nicht-weitergegeben-werden, "darf nicht weitergegeben werden", "may not be passed on", "لا يجوز أن يُمرَّر", "не смее да се пренесе"]
  - [die-loeschung, "die Löschung", "the deletion", "الحذف", "бришењето"]
  - [die-datenschutzbehoerde, "die Datenschutzbehörde", "the data protection authority", "هيئة حماية البيانات", "агенцијата за заштита на податоци", {rare: true}]
  - [widerrufen, "widerrufen", "withdraw (consent)", "يسحب (الموافقة)", "повлекува"]
  - [die-ausrede, "die Ausrede", "the excuse", "الذريعة", "изговорот"]
dialogue:
  - [protagonist, "Schon wieder diese Firma! Ich habe nie eine Einwilligung gegeben.", "That company again! I never gave consent.", "هذه الشركة مجددًا! لم أعطِ موافقتي قط.", "Пак таа фирма! Никогаш не сум дала согласност."]
  - [jonas, "Dann schick ihnen eine Auskunft nach DSGVO. Sie müssen sagen, woher sie deine Daten haben.", "Then send them a GDPR access request. They have to say where they got your data.", "إذن أرسلي لهم طلب اطلاع وفق اللائحة. يجب أن يقولوا من أين حصلوا على بياناتكِ.", "Тогаш прати им барање за пристап според GDPR. Мора да кажат од каде ги имаат податоците."]
  - [protagonist, "Und dann?", "And then?", "ثم ماذا؟", "А потоа?"]
  - [jonas, "Dann verlangst du die Löschung. Ohne Einwilligung müssen die Daten gelöscht werden.", "Then you demand deletion. Without consent the data must be deleted.", "ثم تطلبين الحذف. بلا موافقة يجب أن تُحذف البيانات.", "Потоа бараш бришење. Без согласност податоците мора да се избришат."]
  - [protagonist, "Und sie dürfen sie nicht weitergeben?", "And they're not allowed to pass them on?", "ولا يجوز لهم تمريرها؟", "И не смеат да ги пренесат?"]
  - [jonas, "Nein. Deine Nummer darf nicht ohne Erlaubnis weitergegeben werden. Wenn sie nicht antworten: Datenschutzbehörde.", "No. Your number may not be passed on without permission. If they don't answer: the data protection authority.", "لا. لا يجوز تمرير رقمكِ دون إذن. وإن لم يردّوا: هيئة حماية البيانات.", "Не. Твојот број не смее да се пренесе без дозвола. Ако не одговорат: агенцијата за заштита на податоци."]
  - [protagonist, "Komisch: Im Verein durfte Petra kein Mannschaftsfoto aufhängen — „wegen Datenschutz“.", "Funny: at the club Petra wasn't allowed to put up a team photo — 'because of data protection'.", "غريب: في النادي لم يُسمح لبيترا بتعليق صورة الفريق — «بسبب حماية البيانات».", "Чудно: во клубот Петра не смееше да закачи слика од екипата — „поради заштита на податоци“."]
  - [jonas, "Ha! Die DSGVO ist die Lieblingsausrede der Deutschen. Mit Einwilligung wäre das Foto kein Problem.", "Ha! The GDPR is the Germans' favourite excuse. With consent the photo would be no problem.", "ها! اللائحة هي الذريعة المفضّلة لدى الألمان. مع الموافقة لن تكون الصورة مشكلة.", "Ха! GDPR е омилениот изговор на Германците. Со согласност сликата не би била проблем."]
teach:
  - ask: ["Say: I never gave consent.", "قولي: لم أعطِ موافقتي قط.", "Кажете: никогаш не сум дала согласност.", "Ich habe nie eine Einwilligung gegeben.", die-einwilligung]
  - ask: ["Say: a GDPR access request.", "قولي: طلب اطلاع وفق اللائحة.", "Кажете: барање за пристап според GDPR.", "Eine Auskunft nach DSGVO.", die-auskunft, die-dsgvo]
  - ask: ["Say: I demand deletion.", "قولي: أطلب الحذف.", "Кажете: барам бришење.", "Ich verlange die Löschung.", die-loeschung]
  - note: ["Passive with modals states rules: «Die Daten müssen gelöscht werden» (must be deleted), «Die Nummer darf nicht weitergegeben werden» (may not be passed on). The modal is conjugated, «werden» goes last.", "المبني للمجهول مع الأفعال المساعدة يصوغ القواعد: «Die Daten müssen gelöscht werden» (يجب أن تُحذف)، «Die Nummer darf nicht weitergegeben werden» (لا يجوز تمريره). الفعل المساعد مُصرَّف و«werden» في الآخر.", "Пасивот со модални глаголи изразува правила: «Die Daten müssen gelöscht werden» (мора да се избришат), «Die Nummer darf nicht weitergegeben werden» (не смее да се пренесе). Модалниот се менува, «werden» оди последно."]
  - ask: ["Say: the data must be deleted.", "قولي: يجب أن تُحذف البيانات.", "Кажете: податоците мора да се избришат.", "Die Daten müssen gelöscht werden.", muss-geloescht-werden]
  - ask: ["Say: the number may not be passed on.", "قولي: لا يجوز تمرير الرقم.", "Кажете: бројот не смее да се пренесе.", "Die Nummer darf nicht weitergegeben werden.", darf-nicht-weitergegeben-werden]
  - ask: ["Say: the data protection authority.", "قولي: هيئة حماية البيانات.", "Кажете: агенцијата за заштита на податоци.", "Die Datenschutzbehörde.", die-datenschutzbehoerde]
  - ask: ["Say: data protection.", "قولي: حماية البيانات.", "Кажете: заштита на податоци.", "Der Datenschutz.", der-datenschutz]
  - ask: ["Say: I withdraw my consent.", "قولي: أسحب موافقتي.", "Кажете: ја повлекувам согласноста.", "Ich widerrufe meine Einwilligung.", widerrufen]
  - ask: ["Say: the favourite excuse.", "قولي: الذريعة المفضّلة.", "Кажете: омилениот изговор.", "Die Lieblingsausrede.", die-ausrede]
  - note: ["Under the GDPR you can ask any company what data it holds on you and where it came from (they must answer within a month), demand deletion and withdraw consent at any time; complaints go to the state data protection authority. At the same time 'Datenschutz' is a famous excuse for saying no to anything — often a simple consent form would solve it.", "بموجب اللائحة يمكنكِ أن تسألي أي شركة عن البيانات التي تحتفظ بها عنكِ ومصدرها (يجب أن تجيب خلال شهر)، وأن تطلبي الحذف وتسحبي الموافقة في أي وقت؛ والشكاوى إلى هيئة حماية البيانات في الولاية. وفي الوقت نفسه «حماية البيانات» ذريعة شهيرة لرفض أي شيء — وغالبًا تحلّ استمارة موافقة بسيطة المسألة.", "Според GDPR можете да прашате секоја фирма кои ваши податоци ги чува и од каде (мора да одговори за еден месец), да барате бришење и да ја повлечете согласноста во секое време; жалбите одат до покраинската агенција. Во исто време „Datenschutz“ е познат изговор за одбивање на сè — често едноставен формулар за согласност би го решил тоа."]
