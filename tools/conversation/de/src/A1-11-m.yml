id: A1-11-m
tracks: [mk]
protagonist: f
title: ["Пријателите"]
situation: ["Родителите на Ања доаѓаат на кафе кај Петар. Прв пат ги запознавате пријателите — сватовите."]
learn: [a1-modal-muessen]
culture: Kaffee und Kuchen
items:
  - [schoen-kennenzulernen, "Schön, Sie kennenzulernen", "Мило ми е што ве запознав"]
  - [ich-spreche, "ich spreche", "зборувам"]
  - [nur, "nur", "само"]
  - [moechten-sie, "Möchten Sie …?", "Сакате ли …? (учтиво)"]
  - [ja-gern, "Ja, gern", "Да, со задоволство"]
  - [ein-stueck, "ein Stück", "парче"]
  - [der-kuchen, "der Kuchen", "колачот"]
  - [selbst-gemacht, "selbst gemacht", "домашен, сам направен"]
  - [lecker, "lecker", "вкусно"]
  - [wie-lange, "Wie lange …?", "Колку долго …?"]
  - [bleiben, "bleiben", "останувате"]
  - [ich-muss, "ich muss", "морам"]
  - [oft, "oft", "често"]
dialogue:
  - [anja, "Mama, Papa — das ist Petars Mutter!", "Мамо, тато — ова е мајката на Петар!"]
  - [frauwolf, "Guten Tag! Schön, Sie kennenzulernen.", "Добар ден! Мило ми е што ве запознав."]
  - [protagonist, "Guten Tag. Freut mich. Ich spreche nur ein bisschen Deutsch.", "Добар ден. Мило ми е. Зборувам само малку германски."]
  - [herrwolf, "Kein Problem! Möchten Sie Kaffee?", "Нема проблем! Сакате ли кафе?"]
  - [protagonist, "Ja, gern.", "Да, со задоволство."]
  - [frauwolf, "Und ein Stück Kuchen? Der Kuchen ist selbst gemacht.", "И парче колач? Колачот е домашен."]
  - [protagonist, "Danke. Sehr lecker!", "Благодарам. Многу вкусно!"]
  - [herrwolf, "Wie lange bleiben Sie in Leipzig?", "Колку долго останувате во Лајпциг?"]
  - [protagonist, "Drei Monate. Im Mai muss ich zurück.", "Три месеци. Во мај морам да се вратам."]
  - [frauwolf, "Dann müssen wir uns oft sehen!", "Тогаш мора често да се гледаме!"]
teach:
  - ask: ["Таа вели: мило ми е што ве запознав.", "Schön, Sie kennenzulernen.", schoen-kennenzulernen]
  - ask: ["Кажете: зборувам само малку германски.", "Ich spreche nur ein bisschen Deutsch.", ich-spreche, nur, ein-bisschen]
  - ask: ["Тој ве прашува дали сакате кафе. Како?", "Möchten Sie Kaffee?", moechten-sie]
  - ask: ["Одговорете: да, со задоволство.", "Ja, gern.", ja-gern]
  - note: ["Германскиот домаќин нуди еднаш. „Не, благодарам“ од учтивост значи — не. Ако сакате, кажете веднаш «Ja, gern»."]
  - ask: ["Таа нуди парче колач.", "Ein Stück Kuchen?", ein-stueck, der-kuchen]
  - ask: ["Кажете: колачот е домашен.", "Der Kuchen ist selbst gemacht.", selbst-gemacht]
  - ask: ["Пофалете: многу вкусно!", "Sehr lecker!", lecker]
  - ask: ["Тој прашува колку долго останувате.", "Wie lange bleiben Sie?", wie-lange, bleiben]
  - note: ["«müssen» — мора: «ich muss», «wir müssen». Вториот глагол оди на крајот: «Wir müssen uns oft sehen»."]
  - ask: ["Кажете: во мај морам да се вратам.", "Im Mai muss ich zurück.", ich-muss]
  - ask: ["Таа вели: тогаш мора често да се гледаме!", "Dann müssen wir uns oft sehen!", oft]
  - note: ["«Kaffee und Kuchen» е попладневен ритуал, околу три-четири часот: кафе, колач, разговор — еден час, не цело попладне. Не носете храна неповикано; цвеќе или чоколадо е доволно."]
