id: C2-24
protagonist: m
title: ["Language at work", "اللغة في العمل", "Јазикот на работа"]
situation:
  - "Leon, the new intern, greets the boss with 'Hey, na, alles fit?' and writes emails in chat style. You take him aside — kindly."
  - "ليون، المتدرّب الجديد، يحيّي المديرة بـ«هاي، كيف الحال؟» ويكتب الرسائل بأسلوب الدردشة. تأخذه جانبًا — بلطف."
  - "Леон, новиот практикант, ја поздравува шефицата со „Еј, што има?“ и пишува мејлови во стил на чет. Го повлекувате настрана — љубезно."
learn: [c2-register]
culture: Du and Sie in the team
items:
  - [der-praktikant, "der Praktikant", "the intern", "المتدرّب", "практикантот"]
  - [darf-ich-dir-einen-tipp-geben, "Darf ich dir einen Tipp geben?", "May I give you a tip?", "هل تسمح لي بنصيحة؟", "Смеам ли да ти дадам совет?"]
  - [im-team-duzen, "im Team duzen wir uns", "in the team we say du", "في الفريق نتخاطب بـdu", "во тимот си велиме du"]
  - [die-chefin-siezen, "die Chefin siezen", "address the boss as Sie", "يخاطب المديرة بـSie", "на шефицата ѝ се персира"]
  - [die-anrede, "die Anrede", "the form of address", "صيغة المخاطبة", "обраќањето"]
  - [umgangssprachlich, "umgangssprachlich", "colloquial", "عامي", "разговорно"]
  - [unangemessen, "unangemessen", "inappropriate", "غير لائق", "несоодветно"]
  - [das-fingerspitzengefuehl, "das Fingerspitzengefühl", "tact, a feel for the situation", "الحسّ المرهف", "чувството за мерка", {rare: true}]
  - [nimm-es-nicht-persoenlich, "Nimm es nicht persönlich", "Don't take it personally", "لا تأخذ الأمر على محمل شخصي", "Не земај го лично"]
  - [peinlich, "peinlich", "embarrassing", "محرج", "непријатно"]
dialogue:
  - [protagonist, "Leon, darf ich dir einen Tipp geben? Nimm es nicht persönlich.", "Leon, may I give you a tip? Don't take it personally.", "ليون، هل تسمح لي بنصيحة؟ لا تأخذ الأمر على محمل شخصي.", "Леон, смеам ли да ти дадам совет? Не земај го лично."]
  - [leon, "Klar. Hab ich was verbockt?", "Sure. Did I mess something up?", "طبعًا. هل أفسدتُ شيئًا؟", "Секако. Дали нешто зезнав?"]
  - [protagonist, "Im Team duzen wir uns. Aber Frau Schröder siezen wir — bis sie das Du anbietet.", "In the team we say du. But Frau Schröder we address as Sie — until she offers du.", "في الفريق نتخاطب بـdu. لكن السيدة شرودر نخاطبها بـSie — حتى تعرض هي الـdu.", "Во тимот си велиме du. Но на госпоѓа Шредер ѝ персираме — додека таа не понуди du."]
  - [leon, "Oh. Ich hab „Hey, na, alles fit?“ gesagt. Wie peinlich!", "Oh. I said 'Hey, all good?'. How embarrassing!", "آه. قلتُ «هاي، كيف الحال؟». يا للإحراج!", "О. Реков „Еј, што има?“. Колку непријатно!"]
  - [protagonist, "Halb so schlimm. Und in E-Mails an Kunden: keine Smileys, nicht umgangssprachlich.", "Not that bad. And in emails to clients: no smileys, nothing colloquial.", "ليس بهذا السوء. وفي الرسائل للزبائن: لا وجوه ضاحكة، ولا أسلوب عامّي.", "Не е толку страшно. А во мејлови до клиенти: без смајлиња, не разговорно."]
  - [leon, "Ist „LG“ auch unangemessen?", "Is 'LG' (best wishes) inappropriate too?", "وهل «LG» (أطيب التحيات اختصارًا) غير لائقة أيضًا؟", "Дали и „LG“ (поздрав, кратенка) е несоодветно?"]
  - [protagonist, "Für Kollegen okay, für Kunden „Mit freundlichen Grüßen“. Das ist Fingerspitzengefühl.", "Fine for colleagues; for clients 'Kind regards'. That's tact.", "مقبولة للزملاء؛ وللزبائن «مع أطيب التحيات». هذا هو الحسّ المرهف.", "За колегите во ред; за клиентите „Со почит“. Тоа е чувство за мерка."]
  - [leon, "Danke. Das hätte mir an der Uni keiner gesagt.", "Thanks. Nobody at uni would have told me that.", "شكرًا. لم يكن أحد في الجامعة ليقول لي هذا.", "Благодарам. Тоа никој на факултет немаше да ми го каже."]
teach:
  - ask: ["Ask: may I give you a tip?", "اسأل: هل تسمح لي بنصيحة؟", "Прашајте: смеам ли да ти дадам совет?", "Darf ich dir einen Tipp geben?", darf-ich-dir-einen-tipp-geben]
  - ask: ["Say: don't take it personally.", "قل: لا تأخذ الأمر على محمل شخصي.", "Кажете: не земај го лично.", "Nimm es nicht persönlich.", nimm-es-nicht-persoenlich]
  - note: ["Correcting someone's register politely: ask permission («Darf ich dir einen Tipp geben?»), soften («Halb so schlimm»), give the rule plus an example. «du» in the team, «Sie» upwards until offered — and the written register stricter than the spoken.", "تصحيح أسلوب أحدهم بلطف: اطلب الإذن («Darf ich dir einen Tipp geben?»)، ولطّف («Halb so schlimm»)، وأعطِ القاعدة مع مثال. «du» داخل الفريق، و«Sie» لمن هو أعلى حتى يعرض الـdu — والأسلوب المكتوب أصرم من المنطوق.", "Учтиво поправање на нечиј регистар: побарајте дозвола («Darf ich dir einen Tipp geben?»), омекнете («Halb so schlimm»), дајте правило и пример. «du» во тимот, «Sie» нагоре додека не се понуди — а пишаниот регистар е построг од говорниот."]
  - ask: ["Say: in the team we say du.", "قل: في الفريق نتخاطب بـdu.", "Кажете: во тимот си велиме du.", "Im Team duzen wir uns.", im-team-duzen]
  - ask: ["Say: we address the boss as Sie.", "قل: نخاطب المديرة بـSie.", "Кажете: на шефицата ѝ персираме.", "Die Chefin siezen wir.", die-chefin-siezen]
  - ask: ["He says: how embarrassing!", "يقول: يا للإحراج!", "Тој вели: колку непријатно!", "Wie peinlich!", peinlich]
  - ask: ["Say: nothing colloquial.", "قل: لا أسلوب عامّي.", "Кажете: ништо разговорно.", "Nicht umgangssprachlich.", umgangssprachlich]
  - ask: ["Ask: is that inappropriate?", "اسأل: هل هذا غير لائق؟", "Прашајте: дали е тоа несоодветно?", "Ist das unangemessen?", unangemessen]
  - ask: ["Say: that's tact.", "قل: هذا هو الحسّ المرهف.", "Кажете: тоа е чувство за мерка.", "Das ist Fingerspitzengefühl.", das-fingerspitzengefuehl]
  - ask: ["Say: the form of address.", "قل: صيغة المخاطبة.", "Кажете: обраќањето.", "Die Anrede.", die-anrede]
  - ask: ["Say: the intern.", "قل: المتدرّب.", "Кажете: практикантот.", "Der Praktikant.", der-praktikant]
  - note: ["Many teams — especially in start-ups — use du with everyone, but in more traditional firms and with clients Sie stays standard. When unsure, listen first and mirror. At C2 you can do what natives find hard: tell someone kindly that their register is off.", "كثير من الفرق — خاصة في الشركات الناشئة — تستعمل du مع الجميع، لكن في الشركات التقليدية ومع الزبائن تبقى Sie هي المعتادة. وحين تشكّ، استمع أولًا وقلّد. وفي مستوى C2 تستطيع ما يصعب على أهل اللغة: أن تخبر أحدًا بلطف أنّ أسلوبه غير مناسب.", "Многу тимови — особено во стартапи — користат du со сите, но во потрадиционални фирми и со клиенти Sie останува стандард. Кога не сте сигурни, прво слушајте и огледувајте. На C2 го можете она што и на родените им е тешко: љубезно да му кажете некому дека регистарот не му е соодветен."]
