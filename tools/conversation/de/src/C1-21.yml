id: C1-21
protagonist: f
title: ["Two languages", "لغتان", "Два јазика"]
situation:
  - "Lena's husband is Polish. Their son mixes Polish and German — and a neighbour said it's bad for him. Lena asks you."
  - "زوج لينا بولندي. ابنهما يخلط البولندية بالألمانية — وقالت جارة إن ذلك يضرّه. لينا تسألكِ."
  - "Мажот на Лена е Полјак. Нивниот син ги меша полскиот и германскиот — а една соседка рекла дека тоа му штети. Лена ве прашува."
learn: [de-c1-particles]
culture: Raising a child in two languages
items:
  - [zweisprachig, "zweisprachig", "bilingual", "ثنائي اللغة", "двојазично"]
  - [die-muttersprache, "die Muttersprache", "the mother tongue", "اللغة الأم", "мајчиниот јазик"]
  - [mischen, "mischen", "mix", "يخلط", "меша"]
  - [die-familiensprache, "die Familiensprache", "the language spoken at home", "لغة البيت", "јазикот во семејството"]
  - [denn-frage, "denn", "(particle in questions) then, actually", "(أداة استفهام) إذن، يا ترى", "(честичка во прашања) па"]
  - [etwa, "etwa", "(particle) surely not…?", "(أداة) هل يُعقل…؟", "(честичка) зар…?"]
  - [ruhig-partikel, "ruhig", "(particle) go ahead, feel free", "(أداة) لا بأس، تفضّلي", "(честичка) слободно"]
  - [eine-person-eine-sprache, "eine Person, eine Sprache", "one person, one language", "شخص واحد، لغة واحدة", "една личност, еден јазик"]
  - [der-vorteil, "der Vorteil", "the advantage", "الميزة", "предноста"]
  - [das-gehirn, "das Gehirn", "the brain", "الدماغ", "мозокот"]
dialogue:
  - [lena, "Jan sagt „Ich will mleko“. Ist das etwa schlecht? Die Nachbarin meint ja.", "Jan says 'I want mleko'. That's surely not bad, is it? The neighbour thinks so.", "يان يقول «أريد mleko». هل يُعقل أن يكون هذا سيئًا؟ الجارة تظن ذلك.", "Јан вели „Ich will mleko“. Зар е тоа лошо? Соседката мисли дека е."]
  - [protagonist, "Nein! Mischen ist bei zweisprachigen Kindern ganz normal. Das hört von selbst auf.", "No! Mixing is completely normal for bilingual children. It stops by itself.", "لا! الخلط طبيعي تمامًا عند الأطفال ثنائيي اللغة. يتوقّف من تلقاء نفسه.", "Не! Мешањето е сосема нормално кај двојазичните деца. Само по себе престанува."]
  - [lena, "Und welche Sprache soll Tomasz denn mit ihm sprechen?", "And which language should Tomasz speak with him, then?", "وبأي لغة يجب أن يكلّمه توماش إذن؟", "А на кој јазик па треба Томаш да зборува со него?"]
  - [protagonist, "Seine Muttersprache. Viele machen „eine Person, eine Sprache“.", "His mother tongue. Many do 'one person, one language'.", "لغته الأم. كثيرون يتّبعون «شخص واحد، لغة واحدة».", "Својот мајчин јазик. Многумина прават „една личност, еден јазик“."]
  - [lena, "Und Deutsch lernt er trotzdem gut?", "And he still learns German well?", "وسيتعلّم الألمانية جيدًا مع ذلك؟", "И сепак добро ќе научи германски?"]
  - [protagonist, "In der Kita sowieso. Zwei Sprachen sind ein Vorteil fürs Gehirn, kein Problem.", "At the Kita anyway. Two languages are an advantage for the brain, not a problem.", "في الروضة على أي حال. لغتان ميزة للدماغ، لا مشكلة.", "Во градинката секако. Два јазика се предност за мозокот, не проблем."]
  - [lena, "Dann sag ich der Nachbarin das mal.", "Then I'll tell the neighbour that.", "إذن سأقول هذا للجارة.", "Тогаш ќе ѝ кажам на соседката."]
  - [protagonist, "Sag es ihr ruhig. Und sprecht zu Hause, was ihr fühlt.", "Go ahead and tell her. And at home speak what you feel.", "قوليها لها بلا تردّد. وتكلّموا في البيت باللغة التي تشعرون بها.", "Слободно кажи ѝ. А дома зборувајте на јазикот што го чувствувате."]
teach:
  - ask: ["Say: bilingual.", "قولي: ثنائي اللغة.", "Кажете: двојазично.", "Zweisprachig.", zweisprachig]
  - note: ["Particles in questions and advice: «Ist das etwa schlecht?» (surely not bad? — hoping for 'no'), «Welche Sprache denn?» (which language, then? — real interest), «Sag es ihr ruhig» (go ahead — encouraging).", "أدوات في الأسئلة والنصائح: «Ist das etwa schlecht?» (هل يُعقل أنه سيئ؟ — مع رجاء «لا»)، «Welche Sprache denn?» (أي لغة إذن؟ — اهتمام حقيقي)، «Sag es ihr ruhig» (قوليها بلا تردّد — تشجيع).", "Честички во прашања и совети: «Ist das etwa schlecht?» (зар е лошо? — со надеж за „не“), «Welche Sprache denn?» (па кој јазик? — вистински интерес), «Sag es ihr ruhig» (слободно кажи ѝ — охрабрување)."]
  - ask: ["Ask hopefully: that's surely not bad?", "اسألي برجاء: هل يُعقل أنه سيئ؟", "Прашајте со надеж: зар е тоа лошо?", "Ist das etwa schlecht?", etwa]
  - ask: ["Say: mixing is normal.", "قولي: الخلط طبيعي.", "Кажете: мешањето е нормално.", "Mischen ist normal.", mischen]
  - ask: ["Ask: which language, then?", "اسألي: بأي لغة إذن؟", "Прашајте: на кој јазик па?", "Welche Sprache denn?", denn-frage]
  - ask: ["Say: his mother tongue.", "قولي: لغته الأم.", "Кажете: мајчиниот јазик.", "Seine Muttersprache.", die-muttersprache]
  - ask: ["Say: one person, one language.", "قولي: شخص واحد، لغة واحدة.", "Кажете: една личност, еден јазик.", "Eine Person, eine Sprache.", eine-person-eine-sprache]
  - ask: ["Say: an advantage for the brain.", "قولي: ميزة للدماغ.", "Кажете: предност за мозокот.", "Ein Vorteil fürs Gehirn.", der-vorteil, das-gehirn]
  - ask: ["Say: go ahead and tell her.", "قولي: قوليها لها بلا تردّد.", "Кажете: слободно кажи ѝ.", "Sag es ihr ruhig.", ruhig-partikel]
  - ask: ["Say: the language spoken at home.", "قولي: لغة البيت.", "Кажете: јазикот во семејството.", "Die Familiensprache.", die-familiensprache]
  - note: ["Research is clear: children can grow up with two or more languages without harm; mixing is a normal stage. Parents should speak the language they're most at ease in — a warm, rich home language helps German too, not the other way round. Some cities offer heritage-language classes.", "الأبحاث واضحة: يمكن للأطفال أن ينشؤوا بلغتين أو أكثر دون ضرر؛ والخلط مرحلة طبيعية. وعلى الوالدين أن يتكلّما اللغة التي يرتاحان فيها أكثر — فلغة البيت الدافئة الغنية تساعد الألمانية أيضًا، لا العكس. وبعض المدن تقدّم دروسًا في لغة الأصل.", "Истражувањата се јасни: децата можат да растат со два или повеќе јазика без штета; мешањето е нормална фаза. Родителите треба да зборуваат на јазикот на кој им е најлесно — топол, богат домашен јазик му помага и на германскиот, не обратно. Некои градови нудат часови по мајчин јазик."]
