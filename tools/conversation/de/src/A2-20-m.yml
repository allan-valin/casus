id: A2-20-m
tracks: [mk]
protagonist: m
title: ["Балканска вечер"]
situation: ["Петар и Ања ве водат на балканска вечер во ресторан — со жива музика."]
learn: [a2-reflexive]
culture: A Balkan evening in Leipzig
items:
  - [sich-treffen, "wir treffen uns", "се среќаваме"]
  - [ich-freue-mich, "ich freue mich", "ми е драго, се радувам"]
  - [die-livemusik, "die Livemusik", "живата музика"]
  - [wie-zu-hause, "wie zu Hause", "како дома"]
  - [sich-setzen, "setzen wir uns", "да седнеме"]
  - [tanzen, "tanzen", "играат, танцуваат"]
  - [mitmachen, "mitmachen", "да се приклучи"]
  - [ich-erinnere-mich, "ich erinnere mich", "се сеќавам"]
  - [laut, "laut", "гласно"]
  - [ich-fuehle-mich-wohl, "ich fühle mich wohl", "се чувствувам убаво"]
dialogue:
  - [petar, "Wir treffen uns mit Freunden. Heute gibt es Livemusik!", "Се среќаваме со пријатели. Вечерва има жива музика!"]
  - [protagonist, "Ich freue mich! Balkanmusik in Leipzig?", "Се радувам! Балканска музика во Лајпциг?"]
  - [anja, "Ja, jeden ersten Samstag. Setzen wir uns hier.", "Да, секоја прва сабота. Да седнеме тука."]
  - [protagonist, "Das ist wie zu Hause! Laut und fröhlich.", "Ова е како дома! Гласно и весело."]
  - [anja, "Alle tanzen. Machen Sie mit?", "Сите играат. Ќе се приклучите?"]
  - [protagonist, "Natürlich! Ich erinnere mich an dieses Lied.", "Секако! Се сеќавам на оваа песна."]
  - [petar, "Papa, du tanzt besser als ich.", "Тато, играш подобро од мене."]
  - [protagonist, "Hier fühle ich mich wohl.", "Тука се чувствувам убаво."]
teach:
  - note: ["Повратните глаголи користат «mich», «dich», «uns»: «ich freue mich» (се радувам), «wir treffen uns» (се среќаваме), «ich erinnere mich» (се сеќавам)."]
  - ask: ["Кажете: се среќаваме со пријатели.", "Wir treffen uns mit Freunden.", sich-treffen]
  - ask: ["Кажете: се радувам!", "Ich freue mich!", ich-freue-mich]
  - ask: ["Кажете: жива музика.", "Livemusik.", die-livemusik]
  - ask: ["Ања вели: да седнеме тука.", "Setzen wir uns hier.", sich-setzen]
  - ask: ["Кажете: ова е како дома!", "Das ist wie zu Hause!", wie-zu-hause]
  - ask: ["Кажете: гласно и весело.", "Laut und fröhlich.", laut]
  - ask: ["Таа прашува дали ќе се приклучите.", "Machen Sie mit?", mitmachen, tanzen]
  - ask: ["Кажете: се сеќавам на оваа песна.", "Ich erinnere mich an dieses Lied.", ich-erinnere-mich]
  - ask: ["Кажете: тука се чувствувам убаво.", "Hier fühle ich mich wohl.", ich-fuehle-mich-wohl]
  - note: ["Во поголемите германски градови има балкански вечери, ресторани и друштва — место каде што Петар и Ања можат да ве запознаат со други Македонци и со нивните германски пријатели."]
