id: B2-03
protagonist: f
title: ["Genes", "الجينات", "Гени"]
situation:
  - "A VHS evening on heredity. Why do you have your grandmother's eyes? Professor Hartmann explains."
  - "أمسية في الجامعة الشعبية عن الوراثة. لماذا لديكِ عينا جدتكِ؟ البروفيسور هارتمان يشرح."
  - "Вечер на народниот универзитет за наследноста. Зошто ги имате очите на баба ви? Професорот Хартман објаснува."
learn: [de-b2-modal-passive]
culture: —
items:
  - [das-gen, "das Gen", "the gene", "الجين", "генот"]
  - [das-merkmal, "das Merkmal", "the trait", "الصفة", "особината"]
  - [vererben, "vererben", "pass on (by inheritance)", "يورّث", "наследува, пренесува"]
  - [kann-vererbt-werden, "kann vererbt werden", "can be inherited", "يمكن أن يُورَث", "може да се наследи"]
  - [muss-untersucht-werden, "muss untersucht werden", "must be examined", "يجب أن يُفحص", "мора да се испита"]
  - [die-augenfarbe, "die Augenfarbe", "eye colour", "لون العينين", "бојата на очите"]
  - [von-der-mutter, "von der Mutter", "from the mother", "من الأم", "од мајката"]
  - [die-umwelt, "die Umwelt", "the environment", "البيئة", "околината"]
  - [die-krankheit-erblich, "erblich", "hereditary", "وراثي", "наследно"]
  - [die-mischung, "die Mischung", "the mix", "المزيج", "мешавината"]
dialogue:
  - [hartmann, "Jeder Mensch hat zwei Kopien von jedem Gen: eine von der Mutter, eine vom Vater.", "Every person has two copies of each gene: one from the mother, one from the father.", "كل إنسان لديه نسختان من كل جين: واحدة من الأم وواحدة من الأب.", "Секој човек има две копии од секој ген: една од мајката, една од таткото."]
  - [protagonist, "Und warum habe ich die Augenfarbe meiner Oma?", "And why do I have my grandma's eye colour?", "ولماذا لديّ لون عينَي جدتي؟", "А зошто ја имам бојата на очите на баба ми?"]
  - [hartmann, "Manche Merkmale können über Generationen vererbt werden. Sie springen manchmal.", "Some traits can be inherited over generations. They sometimes skip.", "بعض الصفات يمكن أن تُورَث عبر الأجيال. أحيانًا تقفز جيلًا.", "Некои особини можат да се наследат низ генерации. Понекогаш прескокнуваат."]
  - [protagonist, "Sind auch Krankheiten erblich?", "Are diseases hereditary too?", "هل الأمراض وراثية أيضًا؟", "Дали и болестите се наследни?"]
  - [hartmann, "Manche. Dann muss das beim Arzt untersucht werden.", "Some. Then it has to be examined at the doctor's.", "بعضها. عندها يجب أن يُفحص ذلك عند الطبيب.", "Некои. Тогаш тоа мора да се испита кај лекар."]
  - [protagonist, "Ist also alles in den Genen?", "So is everything in the genes?", "إذن هل كل شيء في الجينات؟", "Значи, сè е во гените?"]
  - [hartmann, "Nein. Die Umwelt ist auch wichtig: Essen, Sport, Stress. Wir sind eine Mischung.", "No. The environment matters too: food, sport, stress. We're a mix.", "لا. البيئة مهمة أيضًا: الطعام والرياضة والضغط. نحن مزيج.", "Не. И околината е важна: храна, спорт, стрес. Ние сме мешавина."]
  - [protagonist, "Dann gebe ich meinen Genen nicht die Schuld!", "Then I won't blame my genes!", "إذن لن ألوم جيناتي!", "Тогаш нема да ги обвинувам гените!"]
teach:
  - ask: ["Say: two copies of each gene.", "قولي: نسختان من كل جين.", "Кажете: две копии од секој ген.", "Zwei Kopien von jedem Gen.", das-gen]
  - ask: ["Say: one from the mother.", "قولي: واحدة من الأم.", "Кажете: една од мајката.", "Eine von der Mutter.", von-der-mutter]
  - ask: ["Ask: why do I have my grandma's eye colour?", "اسألي: لماذا لديّ لون عينَي جدتي؟", "Прашајте: зошто ја имам бојата на очите на баба ми?", "Warum habe ich die Augenfarbe meiner Oma?", die-augenfarbe]
  - note: ["Passive with a modal: modal + participle + «werden» at the end. «Merkmale können vererbt werden» (can be inherited), «Das muss untersucht werden» (must be examined).", "المبني للمجهول مع فعل مساعد: الفعل المساعد + اسم المفعول + «werden» في الآخر. «Merkmale können vererbt werden» (يمكن أن تُورَث)، «Das muss untersucht werden» (يجب أن يُفحص).", "Пасив со модален глагол: модален + партицип + «werden» на крајот. «Merkmale können vererbt werden» (можат да се наследат), «Das muss untersucht werden» (мора да се испита)."]
  - ask: ["Say: some traits can be inherited.", "قولي: بعض الصفات يمكن أن تُورَث.", "Кажете: некои особини можат да се наследат.", "Manche Merkmale können vererbt werden.", das-merkmal, kann-vererbt-werden]
  - ask: ["Ask: are diseases hereditary?", "اسألي: هل الأمراض وراثية؟", "Прашајте: дали болестите се наследни?", "Sind Krankheiten erblich?", die-krankheit-erblich]
  - ask: ["Say: it must be examined at the doctor's.", "قولي: يجب أن يُفحص ذلك عند الطبيب.", "Кажете: тоа мора да се испита кај лекар.", "Das muss beim Arzt untersucht werden.", muss-untersucht-werden]
  - ask: ["Say: parents pass on genes.", "قولي: الوالدان يورّثان الجينات.", "Кажете: родителите пренесуваат гени.", "Eltern vererben Gene.", vererben]
  - ask: ["Say: the environment matters too.", "قولي: البيئة مهمة أيضًا.", "Кажете: и околината е важна.", "Die Umwelt ist auch wichtig.", die-umwelt]
  - ask: ["Say: we're a mix.", "قولي: نحن مزيج.", "Кажете: ние сме мешавина.", "Wir sind eine Mischung.", die-mischung]
