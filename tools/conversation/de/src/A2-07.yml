id: A2-07
protagonist: f
title: ["Bavaria isn't Germany", "بافاريا ليست ألمانيا", "Баварија не е Германија"]
situation:
  - "You show Jonas a postcard with Lederhosen. He laughs — and asks about your country's clichés."
  - "تُرين يوناس بطاقة بريدية عليها سراويل جلدية. يضحك — ويسألكِ عن الصور النمطية عن بلدكِ."
  - "Му покажувате на Јонас разгледница со кожени панталони. Тој се смее — и прашува за клишеата за вашата земја."
learn: [a2-comparison]
culture: Clichés both ways
items:
  - [das-klischee, "das Klischee", "the cliché", "الصورة النمطية", "клишето"]
  - [die-lederhose, "die Lederhose", "leather trousers", "السروال الجلدي", "кожените панталони", {rare: true}]
  - [in-bayern, "in Bayern", "in Bavaria", "في بافاريا", "во Баварија"]
  - [in-sachsen, "in Sachsen", "in Saxony", "في ساكسونيا", "во Саксонија"]
  - [anders, "anders", "different", "مختلف", "поинаку"]
  - [groesser-als, "größer als", "bigger than", "أكبر من", "поголем од"]
  - [kaelter-als, "kälter als", "colder than", "أبرد من", "постудено од"]
  - [das-vorurteil, "das Vorurteil", "the prejudice", "التحيّز، الحكم المسبق", "предрасудата"]
  - [stimmt-nicht, "Das stimmt nicht", "That's not true", "هذا غير صحيح", "Тоа не е точно"]
  - [am-meisten, "am meisten", "the most", "أكثر شيء", "најмногу"]
  - [bei-euch, "bei euch", "where you're from, at your place", "عندكم", "кај вас"]
dialogue:
  - [protagonist, "Ist das Deutschland? Lederhosen und Bier?", "Is this Germany? Lederhosen and beer?", "هل هذه ألمانيا؟ سراويل جلدية وبيرة؟", "Ова ли е Германија? Кожени панталони и пиво?"]
  - [jonas, "Das ist ein Klischee aus Bayern! In Sachsen ist alles anders.", "That's a cliché from Bavaria! In Saxony everything's different.", "هذه صورة نمطية من بافاريا! في ساكسونيا كل شيء مختلف.", "Тоа е клише од Баварија! Во Саксонија сè е поинаку."]
  - [protagonist, "Wie anders?", "Different how?", "مختلف كيف؟", "Како поинаку?"]
  - [jonas, "Wir trinken mehr Kaffee als Bier! Und Bayern ist größer als Sachsen.", "We drink more coffee than beer! And Bavaria is bigger than Saxony.", "نشرب القهوة أكثر من البيرة! وبافاريا أكبر من ساكسونيا.", "Пиеме повеќе кафе отколку пиво! А Баварија е поголема од Саксонија."]
  - [protagonist, "Und das Wetter? Kälter als bei mir zu Hause!", "And the weather? Colder than at home!", "والطقس؟ أبرد مما في بلدي!", "А времето? Постудено отколку дома!"]
  - [jonas, "Und was sind die Klischees bei euch?", "And what are the clichés about your country?", "وما الصور النمطية عندكم؟", "А кои се клишеата кај вас?"]
  - [protagonist, "Viele denken, es ist gefährlich bei uns. Das stimmt nicht.", "Many think it's dangerous where I'm from. That's not true.", "كثيرون يظنون أن بلدنا خطير. هذا غير صحيح.", "Многумина мислат дека кај нас е опасно. Тоа не е точно."]
  - [jonas, "Siehst du — Vorurteile gibt es überall.", "See — prejudices are everywhere.", "أرأيتِ — الأحكام المسبقة موجودة في كل مكان.", "Гледаш — предрасуди има насекаде."]
  - [protagonist, "Was ich am meisten mag: das Brot!", "What I like most: the bread!", "أكثر ما أحبه: الخبز!", "Тоа што најмногу ми се допаѓа: лебот!"]
teach:
  - ask: ["Say: that's a cliché.", "قولي: هذه صورة نمطية.", "Кажете: тоа е клише.", "Das ist ein Klischee.", das-klischee]
  - ask: ["Say: leather trousers.", "قولي: سروال جلدي.", "Кажете: кожени панталони.", "Die Lederhose.", die-lederhose]
  - ask: ["Say: in Bavaria everything's different.", "قولي: في بافاريا كل شيء مختلف.", "Кажете: во Баварија сè е поинаку.", "In Bayern ist alles anders.", in-bayern, anders]
  - note: ["Comparisons: add -er and use «als»: «größer als» (bigger than), «kälter als» (colder than). The most: «am meisten», «am größten».", "المقارنة: أضيفي -er واستعملي «als»: «größer als» (أكبر من)، «kälter als» (أبرد من). والأكثر: «am meisten»، «am größten».", "Споредба: додајте -er и користете «als»: «größer als» (поголем од), «kälter als» (постудено од). Најмногу: «am meisten», «am größten»."]
  - ask: ["Say: Bavaria is bigger than Saxony.", "قولي: بافاريا أكبر من ساكسونيا.", "Кажете: Баварија е поголема од Саксонија.", "Bayern ist größer als Sachsen.", groesser-als, in-sachsen]
  - ask: ["Say: colder than at home!", "قولي: أبرد مما في بلدي!", "Кажете: постудено отколку дома!", "Kälter als zu Hause!", kaelter-als]
  - ask: ["He asks about the clichés where you're from.", "يسألكِ عن الصور النمطية عندكم.", "Тој прашува за клишеата кај вас.", "Was sind die Klischees bei euch?", bei-euch]
  - ask: ["Say: that's not true.", "قولي: هذا غير صحيح.", "Кажете: тоа не е точно.", "Das stimmt nicht.", stimmt-nicht]
  - ask: ["Say: prejudices are everywhere.", "قولي: الأحكام المسبقة موجودة في كل مكان.", "Кажете: предрасуди има насекаде.", "Vorurteile gibt es überall.", das-vorurteil]
  - ask: ["Say: what I like most: the bread!", "قولي: أكثر ما أحبه: الخبز!", "Кажете: најмногу ми се допаѓа лебот!", "Am meisten mag ich das Brot!", am-meisten]
  - note: ["Lederhosen, beer halls and Alps are Bavaria, not all of Germany; Saxony prides itself on coffee and cake. And every newcomer meets the clichés about their own country — answering with humour works best.", "السراويل الجلدية وقاعات البيرة والألب هي بافاريا وليست كل ألمانيا؛ وساكسونيا تفخر بالقهوة والكعك. وكل قادم جديد يصادف الصور النمطية عن بلده — والرد بروح الدعابة هو الأفضل.", "Кожените панталони, пивниците и Алпите се Баварија, не цела Германија; Саксонија се гордее со кафе и колачи. А секој дојденец ги среќава клишеата за својата земја — најдобро е да одговори со хумор."]
  - only: {ar: "وأنتِ أيضًا ستسمعين صورًا نمطية عن سوريا والعرب. صديقة يوناس من الأردن تقول: «Nicht alle Araber sind gleich» — ليس كل العرب متشابهين.", mk: "И вие ќе слушнете клишеа — дека Македонија е Русија, или дека е многу далеку. Одговорете со хумор и со една фотографија од Охрид."}
