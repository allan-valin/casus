id: A1-13-e
tracks: [en]
protagonist: f
title: ["The Mensa"]
situation: ["Lunch at the Mensa: six queues, six coffee machines — and someone steps in front of you."]
learn: [de-con_02]
culture: One queue per machine
items:
  - [die-mensa, "die Mensa", "the university canteen", {rare: true}]
  - [die-schlange, "die Schlange", "the queue (also: snake)"]
  - [ich-war-zuerst-da, "Ich war zuerst da", "I was here first"]
  - [stimmt, "Stimmt", "That's right"]
  - [kein-problem, "kein Problem", "no problem"]
  - [das-essen, "das Essen", "the food, the meal"]
  - [vegetarisch, "vegetarisch", "vegetarian"]
  - [kein-fleisch, "kein Fleisch", "no meat"]
  - [nicht-so-gut, "nicht so gut", "not so good"]
  - [der-kaffee, "der Kaffee", "the coffee"]
  - [heute-nicht, "heute nicht", "not today"]
dialogue:
  - [protagonist, "Entschuldigung, ich war zuerst da.", "Excuse me, I was here first."]
  - [jonas, "Oh, stimmt. Sorry!", "Oh, that's right. Sorry!"]
  - [protagonist, "Kein Problem. Warum gibt es so viele Schlangen?", "No problem. Why are there so many queues?"]
  - [jonas, "Eine Schlange für jedes Essen. Und eine für jeden Kaffeeautomaten.", "One queue for each meal. And one for each coffee machine."]
  - [protagonist, "Ist das Essen vegetarisch?", "Is the meal vegetarian?"]
  - [jonas, "Das hier ja. Kein Fleisch.", "This one, yes. No meat."]
  - [protagonist, "Und schmeckt es?", "And is it good?"]
  - [jonas, "Nicht so gut. Aber billig!", "Not so good. But cheap!"]
  - [protagonist, "Und einen Kaffee?", "And a coffee?"]
  - [jonas, "Heute nicht. Die Schlange ist zu lang.", "Not today. The queue's too long."]
teach:
  - ask: ["Someone steps in front of you. Say: excuse me, I was here first.", "Entschuldigung, ich war zuerst da.", entschuldigung, ich-war-zuerst-da]
  - ask: ["He agrees: that's right.", "Stimmt.", stimmt]
  - ask: ["Say: no problem.", "Kein Problem.", kein-problem]
  - ask: ["Ask: why are there so many queues?", "Warum gibt es so viele Schlangen?", warum, die-schlange]
  - ask: ["Ask: is the food vegetarian?", "Ist das Essen vegetarisch?", das-essen, vegetarisch]
  - note: ["«kein» before a noun, «nicht» everywhere else: «kein Fleisch», but «nicht so gut», «heute nicht»."]
  - ask: ["Say: no meat.", "Kein Fleisch.", kein-fleisch]
  - ask: ["Say: not so good.", "Nicht so gut.", nicht-so-gut]
  - ask: ["Ask for a coffee.", "Einen Kaffee, bitte.", der-kaffee]
  - ask: ["Say: not today.", "Heute nicht.", heute-nicht]
  - ask: ["Say: the Mensa.", "Die Mensa.", die-mensa]
  - note: ["Queues are often one per till or machine, and people step into any gap. 'Entschuldigung, ich war zuerst da' is polite, normal and usually answered with an apology."]
