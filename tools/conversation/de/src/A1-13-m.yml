id: A1-13-m
tracks: [mk]
protagonist: f
title: ["Игралиштето"]
situation: ["Лука е на лулашката. Една млада мајка почнува разговор со вас."]
learn: [a1-negation]
culture: Grandparents at the playground
items:
  - [der-spielplatz, "der Spielplatz", "игралиштето"]
  - [die-schaukel, "die Schaukel", "лулашката", {rare: true}]
  - [wie-alt-ist-er, "Wie alt ist er?", "Колку години има?"]
  - [vier-jahre-alt, "vier Jahre alt", "четири години"]
  - [ihr-enkel, "Ihr Enkel", "вашиот внук"]
  - [ich-bin-oma, "ich bin die Oma", "јас сум бабата"]
  - [nicht-von-hier, "nicht von hier", "не сум одовде"]
  - [kein-deutsch, "kein Deutsch", "не (зборувам) германски"]
  - [nur-ein-bisschen, "nur ein bisschen", "само малку"]
  - [nicht, "nicht", "не"]
  - [bis-bald, "Bis bald!", "Се гледаме наскоро!"]
dialogue:
  - [lena, "Hallo! Wie alt ist er?", "Здраво! Колку години има?"]
  - [protagonist, "Hallo. Luka ist vier Jahre alt.", "Здраво. Лука има четири години."]
  - [lena, "Ist das Ihr Enkel?", "Ова ли е вашиот внук?"]
  - [protagonist, "Ja, ich bin die Oma. Ich bin nicht von hier, aus Mazedonien.", "Да, јас сум бабата. Не сум одовде, од Македонија."]
  - [lena, "Toll! Sprechen Sie mit Luka Deutsch?", "Супер! Зборувате ли германски со Лука?"]
  - [protagonist, "Nein, Mazedonisch. Mein Deutsch ist nur ein bisschen.", "Не, македонски. Мојот германски е само малку."]
  - [lena, "Das ist gut! Dann lernt er zwei Sprachen.", "Тоа е добро! Така учи два јазика."]
  - [protagonist, "Luka, nicht so hoch auf der Schaukel!", "Лука, не толку високо на лулашката!"]
  - [lena, "Ich bin Lena. Bis bald!", "Јас сум Лена. Се гледаме наскоро!"]
teach:
  - ask: ["Таа прашува колку години има детето.", "Wie alt ist er?", wie-alt-ist-er]
  - ask: ["Кажете: има четири години.", "Er ist vier Jahre alt.", vier-jahre-alt]
  - ask: ["Таа прашува: ова ли е вашиот внук?", "Ist das Ihr Enkel?", ihr-enkel]
  - ask: ["Кажете: да, јас сум бабата.", "Ja, ich bin die Oma.", ich-bin-oma]
  - note: ["«kein» негира именка: «kein Deutsch». «nicht» негира сè друго: «nicht von hier», «nicht so hoch»."]
  - ask: ["Кажете: не сум одовде.", "Ich bin nicht von hier.", nicht-von-hier]
  - ask: ["Кажете: зборувам само малку германски.", "Nur ein bisschen Deutsch.", nur-ein-bisschen]
  - ask: ["Кажете: не зборувам германски.", "Ich spreche kein Deutsch.", kein-deutsch]
  - ask: ["Викнете му на Лука: не толку високо!", "Nicht so hoch!", nicht]
  - ask: ["Кажете: лулашката.", "Die Schaukel.", die-schaukel]
  - ask: ["Поздравете се: се гледаме наскоро!", "Bis bald!", bis-bald]
  - note: ["Германците сметаат дека детето што слуша два јазика е среќно, не збунето. Зборувајте со Лука македонски — германски ќе научи во градинката."]
