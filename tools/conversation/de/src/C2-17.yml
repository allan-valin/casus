id: C2-17
protagonist: f
title: ["A journalist asks", "صحفية تسأل", "Новинарка прашува"]
situation:
  - "The local paper is doing a series: 'New Leipzigers'. The reporter interviews you — and tries a cliché or two."
  - "الصحيفة المحلية تعدّ سلسلة: «سكان لايبزيغ الجدد». المراسلة تحاوركِ — وتجرّب قالبًا نمطيًا أو اثنين."
  - "Локалниот весник прави серија: „Новите Лајпцижани“. Репортерката ве интервјуира — и пробува клише или две."
learn: [c2-register]
culture: Answering clichés
items:
  - [das-klischee-c2, "ein Klischee bedienen", "play to a cliché", "يكرّس الصورة النمطية", "го потхранува клишето"]
  - [die-erfahrung-c2, "aus eigener Erfahrung", "from my own experience", "من تجربتي الخاصة", "од сопствено искуство"]
  - [differenzieren, "differenzieren", "make distinctions", "يميّز، يفصّل", "прави разлика"]
  - [pauschalisieren, "pauschalisieren", "generalise", "يعمّم", "генерализира"]
  - [das-zitat, "darf ich Sie zitieren?", "may I quote you?", "هل يمكنني اقتباس كلامك؟", "смеам ли да ве цитирам?"]
  - [die-schlagzeile, "die Schlagzeile", "the headline", "العنوان الرئيسي", "насловот"]
  - [die-vielfalt, "die Vielfalt", "diversity", "التنوّع", "разновидноста"]
  - [ich-moechte-betonen, "Ich möchte betonen, dass …", "I'd like to stress that …", "أودّ أن أؤكّد أنّ …", "Би сакала да нагласам дека …"]
  - [die-gegenfrage, "die Gegenfrage", "the counter-question", "السؤال المضاد", "противпрашањето"]
  - [autorisieren, "das Interview autorisieren", "approve the interview text", "يعتمد نصّ المقابلة", "го одобрува интервјуто"]
dialogue:
  - [reporterin, "Viele Leser fragen: Wollen Migranten sich überhaupt integrieren?", "Many readers ask: do migrants even want to integrate?", "كثير من القرّاء يسألون: هل يريد المهاجرون الاندماج أصلًا؟", "Многу читатели прашуваат: дали мигрантите воопшто сакаат да се интегрираат?"]
  - [protagonist, "Darf ich eine Gegenfrage stellen? Wer sind „die Migranten“? Wir sind ein Ingenieur, eine Pflegerin, ein Student...", "May I ask a counter-question? Who are 'the migrants'? We're an engineer, a nurse, a student...", "هل يمكنني طرح سؤال مضاد؟ من هم «المهاجرون»؟ نحن مهندس، وممرّضة، وطالب...", "Смеам ли да поставам противпрашање? Кои се „мигрантите“? Ние сме инженер, медицинска сестра, студент..."]
  - [reporterin, "Gutes Argument. Aber gibt es nicht auch Probleme?", "Good point. But aren't there problems too?", "حجة جيدة. لكن أليست هناك مشكلات أيضًا؟", "Добар аргумент. Но зарем нема и проблеми?"]
  - [protagonist, "Natürlich. Ich möchte nur betonen, dass man differenzieren muss, statt zu pauschalisieren.", "Of course. I'd just like to stress that you have to make distinctions instead of generalising.", "طبعًا. أودّ فقط أن أؤكّد أنه يجب التمييز بدلًا من التعميم.", "Се разбира. Само би сакала да нагласам дека треба да се прави разлика наместо да се генерализира."]
  - [reporterin, "Und aus eigener Erfahrung?", "And from your own experience?", "ومن تجربتكِ الخاصة؟", "А од сопствено искуство?"]
  - [protagonist, "Leipzig hat mir viel gegeben — Nachbarn, einen Verein, Freunde. Und ich gebe zurück.", "Leipzig has given me a lot — neighbours, a club, friends. And I give back.", "لايبزيغ أعطتني الكثير — جيرانًا ونادًيا وأصدقاء. وأنا أردّ الجميل.", "Лајпциг ми даде многу — соседи, клуб, пријатели. А јас враќам."]
  - [reporterin, "Darf ich Sie zitieren? Vielleicht als Schlagzeile: „Vielfalt ist kein Problem“.", "May I quote you? Maybe as a headline: 'Diversity is no problem'.", "هل يمكنني اقتباس كلامكِ؟ ربما كعنوان رئيسي: «التنوّع ليس مشكلة».", "Смеам ли да ве цитирам? Можеби како наслов: „Разновидноста не е проблем“."]
  - [protagonist, "Gern — aber ich möchte das Interview vorher autorisieren.", "Gladly — but I'd like to approve the interview text beforehand.", "بكل سرور — لكنني أودّ اعتماد نصّ المقابلة مسبقًا.", "Со задоволство — но би сакала претходно да го одобрам интервјуто."]
teach:
  - ask: ["Ask a counter-question.", "اطرحي سؤالًا مضادًا.", "Поставете противпрашање.", "Darf ich eine Gegenfrage stellen?", die-gegenfrage]
  - note: ["Answering clichés in a public register: question the category («Wer sind ‚die Migranten‘?»), concede («Natürlich»), then stress your point («Ich möchte betonen, dass…»). «differenzieren statt pauschalisieren» is the key phrase.", "الردّ على القوالب النمطية بأسلوب علني: شكّكي في الفئة («Wer sind ‚die Migranten‘?»)، وسلّمي («Natürlich»)، ثم أكّدي فكرتكِ («Ich möchte betonen, dass…»). و«differenzieren statt pauschalisieren» هي العبارة المفتاح.", "Одговарање на клишеа во јавен регистар: доведете ја во прашање категоријата («Wer sind ‚die Migranten‘?»), признајте («Natürlich»), па нагласете ја поентата («Ich möchte betonen, dass…»). «differenzieren statt pauschalisieren» е клучната фраза."]
  - ask: ["Say: I'd like to stress that…", "قولي: أودّ أن أؤكّد أنّ…", "Кажете: би сакала да нагласам дека…", "Ich möchte betonen, dass…", ich-moechte-betonen]
  - ask: ["Say: make distinctions instead of generalising.", "قولي: التمييز بدلًا من التعميم.", "Кажете: да се прави разлика наместо генерализирање.", "Differenzieren statt pauschalisieren.", differenzieren, pauschalisieren]
  - ask: ["Say: from my own experience.", "قولي: من تجربتي الخاصة.", "Кажете: од сопствено искуство.", "Aus eigener Erfahrung.", die-erfahrung-c2]
  - ask: ["She asks: may I quote you?", "تسأل: هل يمكنني اقتباس كلامكِ؟", "Таа прашува: смеам ли да ве цитирам?", "Darf ich Sie zitieren?", das-zitat]
  - ask: ["Say: the headline.", "قولي: العنوان الرئيسي.", "Кажете: насловот.", "Die Schlagzeile.", die-schlagzeile]
  - ask: ["Say: diversity is no problem.", "قولي: التنوّع ليس مشكلة.", "Кажете: разновидноста не е проблем.", "Vielfalt ist kein Problem.", die-vielfalt]
  - ask: ["Say: I'd like to approve the interview.", "قولي: أودّ اعتماد نصّ المقابلة.", "Кажете: би сакала да го одобрам интервјуто.", "Ich möchte das Interview autorisieren.", autorisieren]
  - ask: ["Say: don't play to a cliché.", "قولي: لا تكرّسي الصورة النمطية.", "Кажете: не го потхранувајте клишето.", "Kein Klischee bedienen.", das-klischee-c2]
  - note: ["In Germany interviewees may ask to approve ('autorisieren') their quotes before print — newspapers usually agree. Clichéd questions are often meant to provoke a clear answer; stay calm, concrete and personal.", "في ألمانيا يحق لمن تُجرى معه مقابلة أن يطلب اعتماد اقتباساته قبل النشر — والصحف توافق عادةً. والأسئلة النمطية غالبًا ما تهدف إلى استفزاز جواب واضح؛ ابقي هادئة ومحدّدة وشخصية.", "Во Германија интервјуираните можат да побараат да ги одобрат цитатите пред печатење — весниците обично се согласуваат. Клишеизираните прашања често имаат цел да предизвикаат јасен одговор; останете мирни, конкретни и лични."]
