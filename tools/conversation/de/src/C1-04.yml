id: C1-04
protagonist: m
title: ["The tenancy agreement", "عقد الإيجار", "Договорот за наем"]
situation:
  - "You're moving out. The property management demands you repaint the whole flat — 'it's in the contract'. Jonas reads the clause."
  - "ستغادر الشقة. إدارة العقار تطالبك بإعادة طلاء الشقة كلها — «إنه في العقد». يوناس يقرأ البند."
  - "Се иселувате. Управата бара да го пребоите целиот стан — „така пишува во договорот“. Јонас ја чита клаузулата."
learn: [de-c1-soll-will, de-c1-durfte]
culture: Clauses that don't count
items:
  - [die-klausel, "die Klausel", "the clause", "البند", "клаузулата"]
  - [die-schoenheitsreparaturen, "die Schönheitsreparaturen", "cosmetic repairs (painting etc.)", "الإصلاحات التجميلية", "естетските поправки", {rare: true}]
  - [unwirksam, "unwirksam", "invalid, void", "باطل", "неважечко"]
  - [der-auszug, "der Auszug", "moving out", "مغادرة المسكن", "иселувањето"]
  - [die-uebergabe-wohnung, "die Wohnungsübergabe", "the handover of the flat", "تسليم الشقة", "предавањето на станот", {rare: true}]
  - [duerfte, "dürfte", "is probably (assumption)", "يُرجَّح أنّ", "веројатно е"]
  - [soll-angeblich, "soll", "is said to, supposedly", "يُقال إنّ", "наводно"]
  - [muss-wohl, "muss wohl", "must (surely)", "لا بد أنّ", "сигурно мора"]
  - [die-abnutzung, "die normale Abnutzung", "normal wear and tear", "الاستهلاك العادي", "нормалното абење", {rare: true}]
  - [das-uebergabeprotokoll, "das Übergabeprotokoll", "the handover report", "محضر التسليم", "записникот за предавање", {rare: true}]
dialogue:
  - [verwaltung, "Laut Paragraf zwölf müssen Sie beim Auszug alle Räume streichen.", "According to clause twelve you have to paint all the rooms when you move out.", "بحسب البند الثاني عشر يجب أن تطلي كل الغرف عند المغادرة.", "Според член дванаесет мора да ги пребоите сите простории при иселување."]
  - [protagonist, "Alle? Ich habe nur drei Jahre hier gewohnt.", "All of them? I only lived here three years.", "كلها؟ سكنتُ هنا ثلاث سنوات فقط.", "Сите? Живеев тука само три години."]
  - [jonas, "Zeig mal den Vertrag. ... Diese Klausel dürfte unwirksam sein. Starre Fristen sind nicht erlaubt.", "Show me the contract. ... This clause is probably invalid. Rigid deadlines aren't allowed.", "أرني العقد. ... يُرجَّح أنّ هذا البند باطل. المدد الجامدة غير مسموحة.", "Покажи го договорот. ... Оваа клаузула веројатно е неважечка. Строги рокови не се дозволени."]
  - [protagonist, "Woher weißt du das?", "How do you know?", "كيف تعرف ذلك؟", "Од каде знаеш?"]
  - [jonas, "Der Mieterverein soll da sehr klar sein. Und die Wohnung war beim Einzug unrenoviert, oder?", "The tenants' association is said to be very clear on it. And the flat was unrenovated when you moved in, right?", "يُقال إنّ جمعية المستأجرين واضحة جدًا في ذلك. والشقة لم تكن مجدّدة عند انتقالك، أليس كذلك؟", "Здружението на станари наводно е многу јасно за тоа. А станот беше нереновиран кога се всели, нели?"]
  - [protagonist, "Ja, die Wände waren grau. Das muss wohl im Übergabeprotokoll stehen.", "Yes, the walls were grey. That must surely be in the handover report.", "نعم، كانت الجدران رمادية. لا بد أنّ ذلك مكتوب في محضر التسليم.", "Да, ѕидовите беа сиви. Тоа сигурно мора да пишува во записникот за предавање."]
  - [jonas, "Dann zahlst du nur für Schäden, nicht für normale Abnutzung.", "Then you only pay for damage, not for normal wear and tear.", "إذن تدفع فقط عن الأضرار، لا عن الاستهلاك العادي.", "Тогаш плаќаш само за штети, не за нормално абење."]
  - [protagonist, "Ich schreibe der Verwaltung — schriftlich, mit Frist.", "I'll write to the management — in writing, with a deadline.", "سأكتب إلى الإدارة — كتابيًا، مع مهلة.", "Ќе ѝ пишам на управата — писмено, со рок."]
teach:
  - ask: ["Say: the clause.", "قل: البند.", "Кажете: клаузулата.", "Die Klausel.", die-klausel]
  - ask: ["Say: when moving out.", "قل: عند المغادرة.", "Кажете: при иселување.", "Beim Auszug.", der-auszug]
  - ask: ["Say: cosmetic repairs.", "قل: الإصلاحات التجميلية.", "Кажете: естетските поправки.", "Die Schönheitsreparaturen.", die-schoenheitsreparaturen]
  - note: ["Modal verbs can show how sure you are, not what you must do: «dürfte» (probably), «soll» (is said to — hearsay), «muss wohl» (surely — strong conclusion). «Die Klausel dürfte unwirksam sein» = it's probably void.", "الأفعال المساعدة قد تُظهر درجة يقينك لا ما يجب فعله: «dürfte» (يُرجَّح)، «soll» (يُقال — نقلًا)، «muss wohl» (لا بد — استنتاج قوي). «Die Klausel dürfte unwirksam sein» = يُرجَّح أنها باطلة.", "Модалните глаголи може да покажат колку сте сигурни, не што мора: «dürfte» (веројатно), «soll» (наводно — од слушање), «muss wohl» (сигурно — силен заклучок). «Die Klausel dürfte unwirksam sein» = веројатно е неважечка."]
  - ask: ["Say: this clause is probably invalid.", "قل: يُرجَّح أنّ هذا البند باطل.", "Кажете: оваа клаузула веројатно е неважечка.", "Diese Klausel dürfte unwirksam sein.", duerfte, unwirksam]
  - ask: ["Say: the association is said to be clear.", "قل: يُقال إنّ الجمعية واضحة.", "Кажете: здружението наводно е јасно.", "Der Mieterverein soll klar sein.", soll-angeblich]
  - ask: ["Say: that must surely be in the report.", "قل: لا بد أنّ ذلك مكتوب في المحضر.", "Кажете: тоа сигурно мора да пишува во записникот.", "Das muss wohl im Protokoll stehen.", muss-wohl, das-uebergabeprotokoll]
  - ask: ["Say: normal wear and tear.", "قل: الاستهلاك العادي.", "Кажете: нормално абење.", "Normale Abnutzung.", die-abnutzung]
  - ask: ["Say: the handover of the flat.", "قل: تسليم الشقة.", "Кажете: предавањето на станот.", "Die Wohnungsübergabe.", die-uebergabe-wohnung]
  - note: ["Many standard clauses in tenancy agreements are void: rigid repainting deadlines, painting a flat that was unrenovated at move-in, fixed colours. Normal wear is your landlord's cost. Keep the handover report and photos, and ask a tenants' association before you pay. Student halls sometimes read 'no subletting' as 'no guest may sleep over' — ask what the rule really allows.", "كثير من البنود المعتادة في عقود الإيجار باطلة: مدد الطلاء الجامدة، وطلاء شقة لم تكن مجدّدة عند الانتقال، والألوان المفروضة. والاستهلاك العادي على المؤجِّر. احتفظ بمحضر التسليم والصور، واسأل جمعية مستأجرين قبل أن تدفع. والمساكن الطلابية أحيانًا تفسّر «ممنوع التأجير من الباطن» على أنها «ممنوع مبيت أي ضيف» — اسأل عمّا تسمح به القاعدة فعلًا.", "Многу стандардни клаузули во договорите за наем се неважечки: строги рокови за боење, боење на стан што бил нереновиран при вселување, наметнати бои. Нормалното абење е трошок на станодавецот. Чувајте го записникот и фотографиите и прашајте здружение на станари пред да платите."]
