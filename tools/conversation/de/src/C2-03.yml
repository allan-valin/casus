id: C2-03
protagonist: f
title: ["A TV interview", "مقابلة تلفزيونية", "ТВ интервју"]
situation:
  - "MDR television reports on the club's youth team, which you coach. The camera's running — and the reporter wants a statement."
  - "تلفزيون MDR يغطّي فريق الناشئين في النادي الذي تدرّبينه. الكاميرا تعمل — والمراسلة تريد تصريحًا."
  - "Телевизијата MDR известува за младинската екипа на клубот што ја тренирате. Камерата снима — а репортерката сака изјава."
learn: []
learn_missing: [register]
culture: Speaking for the camera
items:
  - [die-stellungnahme, "die Stellungnahme", "the statement", "التصريح", "изјавата"]
  - [das-interview, "das Interview", "the interview", "المقابلة", "интервјуто"]
  - [vor-der-kamera, "vor der Kamera", "on camera", "أمام الكاميرا", "пред камерата"]
  - [im-namen-des-vereins, "im Namen des Vereins", "on behalf of the club", "باسم النادي", "во име на клубот"]
  - [es-freut-uns-sehr, "Es freut uns sehr, dass …", "We're very pleased that …", "يسعدنا كثيرًا أنّ …", "Многу нè радува што …"]
  - [die-foerderung-c2, "die Förderung", "support, funding", "الدعم", "поддршката"]
  - [die-integration-durch-sport, "Integration durch Sport", "integration through sport", "الاندماج عبر الرياضة", "интеграција преку спорт"]
  - [darauf-moechte-ich-hinweisen, "Ich möchte darauf hinweisen, dass …", "I'd like to point out that …", "أودّ أن أشير إلى أنّ …", "Би сакала да укажам дека …"]
  - [abschliessend, "abschließend", "in conclusion", "ختامًا", "на крајот, заклучно"]
  - [nervoes, "nervös", "nervous", "متوتّر", "нервозна"]
dialogue:
  - [reporterin, "Kamera läuft. Was bedeutet der Verein für die Kinder hier?", "Camera's rolling. What does the club mean for the children here?", "الكاميرا تعمل. ماذا يعني النادي للأطفال هنا؟", "Камерата снима. Што значи клубот за децата тука?"]
  - [protagonist, "Na ja, die Kids haben halt mega Spaß und so...", "Well, the kids have loads of fun, like...", "يعني، الأطفال يستمتعون جدًا وكذا...", "Па, децата баш се забавуваат и така..."]
  - [reporterin, "Könnten Sie das etwas formeller sagen? Für die Nachrichten.", "Could you say that a bit more formally? For the news.", "هل يمكنكِ قول ذلك بشكل أكثر رسمية؟ للأخبار.", "Може ли тоа малку поформално? За вестите."]
  - [protagonist, "Gern. Im Namen des Vereins: Es freut uns sehr, dass Kinder aus zwölf Nationen bei uns gemeinsam trainieren.", "Gladly. On behalf of the club: we're very pleased that children from twelve nations train together with us.", "بكل سرور. باسم النادي: يسعدنا كثيرًا أنّ أطفالًا من اثنتي عشرة جنسية يتدرّبون معًا لدينا.", "Со задоволство. Во име на клубот: многу нè радува што деца од дванаесет нации тренираат заедно кај нас."]
  - [protagonist, "Ich möchte darauf hinweisen, dass Integration durch Sport ohne Ehrenamtliche nicht möglich wäre.", "I'd like to point out that integration through sport wouldn't be possible without volunteers.", "أودّ أن أشير إلى أنّ الاندماج عبر الرياضة لم يكن ممكنًا دون المتطوّعين.", "Би сакала да укажам дека интеграцијата преку спорт не би била можна без доброволците."]
  - [reporterin, "Und was wünschen Sie sich?", "And what would you like to see?", "وماذا تتمنّين؟", "А што посакувате?"]
  - [protagonist, "Abschließend: mehr Förderung durch die Stadt — vor allem für neue Trainingszeiten in der Halle.", "In conclusion: more support from the city — above all for new training slots in the hall.", "ختامًا: دعم أكبر من المدينة — خاصةً لمواعيد تدريب جديدة في القاعة.", "Заклучно: повеќе поддршка од градот — пред сè за нови термини за тренинг во салата."]
  - [reporterin, "Perfekt. Danke! Sie waren gar nicht nervös.", "Perfect. Thank you! You weren't nervous at all.", "ممتاز. شكرًا! لم تكوني متوتّرة إطلاقًا.", "Совршено. Благодарам! Воопшто не бевте нервозна."]
teach:
  - ask: ["Say: the interview.", "قولي: المقابلة.", "Кажете: интервјуто.", "Das Interview.", das-interview]
  - ask: ["Say: on camera.", "قولي: أمام الكاميرا.", "Кажете: пред камерата.", "Vor der Kamera.", vor-der-kamera]
  - note: ["Register shift: casual «Die Kids haben halt mega Spaß und so» becomes formal «Es freut uns sehr, dass…», «Ich möchte darauf hinweisen, dass…», «Abschließend…». Same message, different clothes.", "تغيير الأسلوب: العامي «Die Kids haben halt mega Spaß und so» يصبح رسميًا «Es freut uns sehr, dass…»، «Ich möchte darauf hinweisen, dass…»، «Abschließend…». الرسالة نفسها بثوب مختلف.", "Промена на регистар: разговорното «Die Kids haben halt mega Spaß und so» станува формално «Es freut uns sehr, dass…», «Ich möchte darauf hinweisen, dass…», «Abschließend…». Иста порака, друга облека."]
  - ask: ["Say formally: on behalf of the club.", "قولي رسميًا: باسم النادي.", "Кажете формално: во име на клубот.", "Im Namen des Vereins.", im-namen-des-vereins]
  - ask: ["Say formally: we're very pleased that…", "قولي رسميًا: يسعدنا كثيرًا أنّ…", "Кажете формално: многу нè радува што…", "Es freut uns sehr, dass…", es-freut-uns-sehr]
  - ask: ["Say: I'd like to point out that…", "قولي: أودّ أن أشير إلى أنّ…", "Кажете: би сакала да укажам дека…", "Ich möchte darauf hinweisen, dass…", darauf-moechte-ich-hinweisen]
  - ask: ["Say: integration through sport.", "قولي: الاندماج عبر الرياضة.", "Кажете: интеграција преку спорт.", "Integration durch Sport.", die-integration-durch-sport]
  - ask: ["Say: in conclusion, more support.", "قولي: ختامًا، دعم أكبر.", "Кажете: заклучно, повеќе поддршка.", "Abschließend: mehr Förderung.", abschliessend, die-foerderung-c2]
  - ask: ["Say: a statement.", "قولي: تصريح.", "Кажете: изјава.", "Eine Stellungnahme.", die-stellungnahme]
  - ask: ["She says: you weren't nervous at all.", "تقول: لم تكوني متوتّرة إطلاقًا.", "Таа вели: воопшто не бевте нервозна.", "Sie waren gar nicht nervös.", nervoes]
  - note: ["On camera, speak in short complete sentences that work without the question (they'll be cut), name who you speak for, make one clear point and one concrete wish. Youth slang like «mega» and «Kids» is fine with friends, not in a statement.", "أمام الكاميرا تكلّمي بجمل قصيرة كاملة تفهم دون السؤال (سيُقصّ)، وسمّي من تتحدّثين باسمه، وقدّمي فكرة واضحة واحدة وأمنية محدّدة واحدة. وعامية الشباب مثل «mega» و«Kids» مقبولة مع الأصدقاء لا في تصريح.", "Пред камера зборувајте во кратки целосни реченици што се разбираат без прашањето (ќе го исечат), кажете во чие име зборувате, една јасна поента и една конкретна желба. Младешкиот сленг како «mega» и «Kids» е во ред со пријатели, не во изјава."]
