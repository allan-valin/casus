id: A2-23-e
tracks: [en]
protagonist: f
title: ["Exams"]
situation: ["Your first exam result is worse than you expected. Mia explains how exams work here."]
learn: [de-vcp_03]
culture: Exam rules per degree programme
items:
  - [die-klausur, "die Klausur", "the written exam"]
  - [die-note, "die Note", "the grade"]
  - [bestanden, "bestanden", "passed"]
  - [durchgefallen, "durchgefallen", "failed"]
  - [die-pruefungsordnung, "die Prüfungsordnung", "the exam regulations", {rare: true}]
  - [das-modul, "das Modul", "the module"]
  - [die-einsicht, "die Klausureinsicht", "the exam review (viewing your paper)", {rare: true}]
  - [widersprechen, "widersprechen", "object, appeal"]
  - [hat-geschrieben, "hat … geschrieben", "has written"]
  - [habe-verstanden, "habe … verstanden", "have understood"]
dialogue:
  - [protagonist, "Ich habe die Klausur geschrieben — eine Vier. Bin ich durchgefallen?", "I sat the exam — a four. Did I fail?"]
  - [mia, "Nein! Vier ist bestanden. Fünf ist durchgefallen.", "No! A four is a pass. Five is a fail."]
  - [protagonist, "Bei uns ist es anders. Und wer entscheidet die Regeln?", "Back home it's different. And who decides the rules?"]
  - [mia, "Die Prüfungsordnung von deinem Studiengang. Jedes Modul hat eigene Regeln.", "Your degree programme's exam regulations. Every module has its own rules."]
  - [protagonist, "Und der Professor? Er hat nur Theorie gefragt.", "And the professor? He only asked theory."]
  - [mia, "Er wählt den Inhalt und die Methode. Das ist die Lehrfreiheit.", "He chooses the content and the method. That's academic freedom."]
  - [protagonist, "Kann ich die Klausur sehen?", "Can I see my paper?"]
  - [mia, "Ja, bei der Klausureinsicht. Und du kannst widersprechen, wenn etwas falsch ist.", "Yes, at the exam review. And you can object if something's wrong."]
  - [protagonist, "Gut. Das habe ich verstanden.", "Good. I've understood that."]
teach:
  - ask: ["Say: I sat the exam.", "Ich habe die Klausur geschrieben.", die-klausur, hat-geschrieben]
  - ask: ["Say: a four. Did I fail?", "Eine Vier. Bin ich durchgefallen?", durchgefallen]
  - ask: ["She says: four is a pass.", "Vier ist bestanden.", bestanden]
  - ask: ["Say: the grade.", "Die Note.", die-note]
  - ask: ["Say: the exam regulations.", "Die Prüfungsordnung.", die-pruefungsordnung]
  - ask: ["Say: every module has its own rules.", "Jedes Modul hat eigene Regeln.", das-modul]
  - ask: ["Ask: can I see my paper?", "Kann ich die Klausur sehen?", die-einsicht]
  - ask: ["Say: you can object.", "Du kannst widersprechen.", widersprechen]
  - note: ["Many past participles are irregular: «geschrieben», «verstanden», «durchgefallen». Learn them with the verb."]
  - ask: ["Say: I've understood that.", "Das habe ich verstanden.", habe-verstanden]
  - note: ["German grades run from 1 (best) to 5 (fail); 4 is a pass. Exam rules are set per degree programme, professors choose content and method (Lehrfreiheit), and you have the right to view your marked paper and to appeal."]
