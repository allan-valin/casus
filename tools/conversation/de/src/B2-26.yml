id: B2-26
protagonist: m
title: ["The wedding", "الزفاف", "Свадбата"]
situation:
  - "Jonas and Svenja get married at the registry office. Jonas asks you to be his witness."
  - "يوناس وسفينيا يتزوّجان في مكتب السجل المدني. يوناس يطلب منك أن تكون شاهده."
  - "Јонас и Свења се венчаваат во матичното. Јонас ве моли да му бидете кум."
learn: [de-cas_08]
culture: A German wedding
items:
  - [das-standesamt, "das Standesamt", "the registry office", "مكتب السجل المدني", "матичното"]
  - [der-trauzeuge, "der Trauzeuge", "the wedding witness", "شاهد الزواج", "кумот"]
  - [die-hochzeit, "die Hochzeit", "the wedding", "الزفاف", "свадбата"]
  - [der-ring, "der Ring", "the ring", "الخاتم", "прстенот"]
  - [das-brautpaar, "das Brautpaar", "the bride and groom", "العروسان", "младенците"]
  - [die-feier, "die Feier", "the celebration", "الاحتفال", "прославата"]
  - [anstelle, "anstelle", "instead of (+ genitive)", "بدلًا من", "наместо"]
  - [trotz, "trotz", "despite (+ genitive)", "رغم", "и покрај"]
  - [das-budget, "das Budget", "the budget", "الميزانية", "буџетот"]
  - [das-ja-wort, "das Jawort", "the 'I do'", "كلمة «نعم» في الزفاف", "„да“-то", {rare: true}]
dialogue:
  - [jonas, "Willst du mein Trauzeuge sein?", "Will you be my wedding witness?", "هل تكون شاهد زواجي؟", "Сакаш ли да ми бидеш кум?"]
  - [protagonist, "Was für eine Ehre! Was muss ich machen?", "What an honour! What do I have to do?", "يا له من شرف! ماذا عليّ أن أفعل؟", "Каква чест! Што треба да правам?"]
  - [jonas, "Im Standesamt unterschreiben und die Ringe halten. Mehr nicht.", "Sign at the registry office and hold the rings. That's all.", "التوقيع في مكتب السجل المدني وحمل الخاتمين. لا أكثر.", "Да потпишеш во матичното и да ги држиш прстените. Ништо повеќе."]
  - [protagonist, "Und wie viele Gäste?", "And how many guests?", "وكم ضيفًا؟", "А колку гости?"]
  - [svenja, "Vierzig. Anstelle einer großen Feier machen wir ein Picknick im Park.", "Forty. Instead of a big celebration we're having a picnic in the park.", "أربعون. بدلًا من احتفال كبير سنقيم نزهة في الحديقة.", "Четириесет. Наместо голема прослава правиме пикник во паркот."]
  - [protagonist, "Vierzig! Bei uns kommen fünfhundert — das ganze Dorf.", "Forty! With us five hundred come — the whole village.", "أربعون! عندنا يأتي خمسمئة — القرية كلها.", "Четириесет! Кај нас доаѓаат петстотини — целото село."]
  - [jonas, "Trotz des kleinen Budgets wird es schön. Und das Brautpaar tanzt!", "Despite the small budget it'll be lovely. And the bride and groom dance!", "رغم الميزانية الصغيرة سيكون جميلًا. والعروسان سيرقصان!", "И покрај малиот буџет ќе биде убаво. А младенците ќе танцуваат!"]
  - [protagonist, "Dann tanze ich auch. Nach dem Jawort!", "Then I'll dance too. After the 'I do'!", "إذن سأرقص أنا أيضًا. بعد كلمة «نعم»!", "Тогаш и јас ќе танцувам. По „да“-то!"]
teach:
  - ask: ["He asks: will you be my witness?", "يسأل: هل تكون شاهدي؟", "Тој прашува: сакаш ли да ми бидеш кум?", "Willst du mein Trauzeuge sein?", der-trauzeuge]
  - ask: ["Say: the wedding.", "قل: الزفاف.", "Кажете: свадбата.", "Die Hochzeit.", die-hochzeit]
  - ask: ["Say: at the registry office.", "قل: في مكتب السجل المدني.", "Кажете: во матичното.", "Im Standesamt.", das-standesamt]
  - ask: ["Say: hold the rings.", "قل: احمل الخاتمين.", "Кажете: држи ги прстените.", "Die Ringe halten.", der-ring]
  - ask: ["Ask: how many guests?", "اسأل: كم ضيفًا؟", "Прашајте: колку гости?", "Wie viele Gäste?", die-gaeste]
  - note: ["Some prepositions take the genitive: «anstelle einer großen Feier» (instead of a big celebration), «trotz des kleinen Budgets» (despite the small budget). In speech many people use the dative after «trotz».", "بعض حروف الجر تأخذ حالة الإضافة: «anstelle einer großen Feier» (بدلًا من احتفال كبير)، «trotz des kleinen Budgets» (رغم الميزانية الصغيرة). وفي الكلام يستعمل كثيرون حالة الجر بعد «trotz».", "Некои предлози бараат генитив: «anstelle einer großen Feier» (наместо голема прослава), «trotz des kleinen Budgets» (и покрај малиот буџет). Во говорот многумина по «trotz» користат датив."]
  - ask: ["Say: instead of a big celebration.", "قل: بدلًا من احتفال كبير.", "Кажете: наместо голема прослава.", "Anstelle einer großen Feier.", anstelle, die-feier]
  - ask: ["Say: despite the small budget.", "قل: رغم الميزانية الصغيرة.", "Кажете: и покрај малиот буџет.", "Trotz des kleinen Budgets.", trotz, das-budget]
  - ask: ["Say: the bride and groom dance.", "قل: العروسان يرقصان.", "Кажете: младенците танцуваат.", "Das Brautpaar tanzt.", das-brautpaar]
  - ask: ["Say: after the 'I do'.", "قل: بعد كلمة «نعم».", "Кажете: по „да“-то.", "Nach dem Jawort.", das-ja-wort]
  - note: ["In Germany only the registry office makes a marriage legal; a church or mosque ceremony may follow but has no legal effect. Weddings are often small — family and close friends — and guests usually give money or something from a gift list. Five hundred guests would astonish most Germans.", "في ألمانيا مكتب السجل المدني وحده يجعل الزواج قانونيًا؛ وقد تتبعه مراسم في كنيسة أو مسجد لكن بلا أثر قانوني. والأعراس صغيرة غالبًا — العائلة والأصدقاء المقرّبون — ويقدّم الضيوف عادةً مالًا أو شيئًا من قائمة هدايا. خمسمئة ضيف تدهش معظم الألمان.", "Во Германија само матичното го прави бракот законски; може да следи црковна церемонија или во џамија, но без правно дејство. Свадбите често се мали — семејство и блиски пријатели — а гостите обично даваат пари или нешто од листа на подароци. Петстотини гости би ги зачудиле повеќето Германци."]
