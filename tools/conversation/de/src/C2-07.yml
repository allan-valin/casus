id: C2-07
protagonist: f
title: ["A letter to the mayor", "رسالة إلى العمدة", "Писмо до градоначалникот"]
situation:
  - "The youth team has lost its hall time. The city didn't answer. Lena helps you write to the Lord Mayor directly."
  - "فريق الناشئين خسر وقته في القاعة. المدينة لم تردّ. لينا تساعدكِ على الكتابة إلى رئيس البلدية مباشرة."
  - "Младинската екипа го изгуби терминот во салата. Градот не одговори. Лена ви помага да му пишете директно на градоначалникот."
learn: [c2-formal-register]
culture: Writing to the top
items:
  - [sehr-geehrter-herr-ob, "Sehr geehrter Herr Oberbürgermeister", "Dear Lord Mayor", "حضرة رئيس البلدية المحترم", "Почитуван господине градоначалник"]
  - [ich-wende-mich-an-sie, "Ich wende mich an Sie mit der Bitte, …", "I am writing to you to ask …", "أتوجّه إليكم راجيةً …", "Ви се обраќам со молба …"]
  - [mit-bedauern, "Mit Bedauern habe ich zur Kenntnis genommen, dass …", "I note with regret that …", "علمتُ بأسف أنّ …", "Со жалење дознав дека …"]
  - [die-hallenzeit, "die Hallenzeit", "the hall slot", "وقت القاعة", "терминот во салата", {rare: true}]
  - [ersatzlos-gestrichen, "ersatzlos gestrichen", "cancelled without replacement", "أُلغي دون بديل", "укинат без замена", {rare: true}]
  - [ihnen-dankbar, "Für eine baldige Antwort wäre ich Ihnen dankbar", "I would be grateful for a prompt reply", "سأكون ممتنة لردّ قريب", "Би ви била благодарна за брз одговор"]
  - [in-kopie, "in Kopie", "copied to (cc)", "نسخة إلى", "во копија"]
  - [das-anliegen, "das Anliegen", "the concern, request", "الطلب، الشأن", "барањето, грижата"]
  - [mit-freundlichen-gruessen-c2, "Hochachtungsvoll", "Yours faithfully (very formal)", "وتفضّلوا بقبول فائق الاحترام", "Со длабока почит"]
  - [die-betroffenen, "die Betroffenen", "those affected", "المتضرّرون", "засегнатите"]
dialogue:
  - [lena, "Bürgermeister schreibt man: „Sehr geehrter Herr Oberbürgermeister“. Nicht „Hallo“!", "To a mayor you write: 'Dear Lord Mayor'. Not 'Hello'!", "إلى رئيس البلدية تكتبين: «حضرة رئيس البلدية المحترم». لا «مرحبًا»!", "До градоначалник се пишува: „Почитуван господине градоначалник“. Не „Здраво“!"]
  - [protagonist, "„Mit Bedauern habe ich zur Kenntnis genommen, dass die Hallenzeit ersatzlos gestrichen wurde.“", "'I note with regret that the hall slot has been cancelled without replacement.'", "«علمتُ بأسف أنّ وقت القاعة أُلغي دون بديل.»", "„Со жалење дознав дека терминот во салата е укинат без замена.“"]
  - [lena, "Gut. Jetzt das Anliegen — höflich, aber klar.", "Good. Now the request — polite but clear.", "جيد. الآن الطلب — بأدب لكن بوضوح.", "Добро. Сега барањето — учтиво, но јасно."]
  - [protagonist, "„Ich wende mich an Sie mit der Bitte, eine neue Hallenzeit für vierzig Kinder zu finden.“", "'I am writing to ask you to find a new hall slot for forty children.'", "«أتوجّه إليكم راجيةً إيجاد وقت جديد في القاعة لأربعين طفلًا.»", "„Ви се обраќам со молба да се најде нов термин во салата за четириесет деца.“"]
  - [lena, "Nenn die Betroffenen: Kinder aus zwölf Nationen. Das zählt.", "Name those affected: children from twelve nations. That counts.", "اذكري المتضرّرين: أطفال من اثنتي عشرة جنسية. هذا مهم.", "Наведи ги засегнатите: деца од дванаесет нации. Тоа е важно."]
  - [protagonist, "„Für eine baldige Antwort wäre ich Ihnen dankbar. Hochachtungsvoll …“ Zu viel?", "'I would be grateful for a prompt reply. Yours faithfully…' Too much?", "«سأكون ممتنة لردّ قريب. وتفضّلوا بقبول فائق الاحترام…» مبالغ فيه؟", "„Би ви била благодарна за брз одговор. Со длабока почит…“ Премногу?"]
  - [lena, "„Mit freundlichen Grüßen“ reicht heute. Und das Sportamt in Kopie!", "'Kind regards' is enough today. And copy in the sports office!", "«مع أطيب التحيات» تكفي اليوم. وأرسلي نسخة إلى مكتب الرياضة!", "„Со почит“ денес е доволно. И спортската служба во копија!"]
  - [protagonist, "Abgeschickt. Jetzt heißt es: warten — und Daumen drücken.", "Sent. Now it's: wait — and keep fingers crossed.", "أُرسلت. الآن: الانتظار — والدعاء بالتوفيق.", "Испратено. Сега: чекање — и стискање палци."]
teach:
  - ask: ["Address the mayor.", "خاطبي رئيس البلدية.", "Обратете му се на градоначалникот.", "Sehr geehrter Herr Oberbürgermeister,", sehr-geehrter-herr-ob]
  - note: ["Very formal written register: «Mit Bedauern habe ich zur Kenntnis genommen, dass…», «Ich wende mich an Sie mit der Bitte, … zu …», «Für eine baldige Antwort wäre ich Ihnen dankbar». «Hochachtungsvoll» is old-fashioned; «Mit freundlichen Grüßen» is standard even to a mayor.", "الأسلوب المكتوب الرسمي جدًا: «Mit Bedauern habe ich zur Kenntnis genommen, dass…»، «Ich wende mich an Sie mit der Bitte, … zu …»، «Für eine baldige Antwort wäre ich Ihnen dankbar». و«Hochachtungsvoll» قديمة الطراز؛ و«Mit freundlichen Grüßen» هي المعتادة حتى مع رئيس البلدية.", "Многу формален писмен регистар: «Mit Bedauern habe ich zur Kenntnis genommen, dass…», «Ich wende mich an Sie mit der Bitte, … zu …», «Für eine baldige Antwort wäre ich Ihnen dankbar». «Hochachtungsvoll» е старомодно; «Mit freundlichen Grüßen» е стандардно дури и до градоначалник."]
  - ask: ["Write: I note with regret that…", "اكتبي: علمتُ بأسف أنّ…", "Напишете: со жалење дознав дека…", "Mit Bedauern habe ich zur Kenntnis genommen, dass…", mit-bedauern]
  - ask: ["Write: the hall slot was cancelled without replacement.", "اكتبي: وقت القاعة أُلغي دون بديل.", "Напишете: терминот е укинат без замена.", "Die Hallenzeit wurde ersatzlos gestrichen.", die-hallenzeit, ersatzlos-gestrichen]
  - ask: ["Write: I am writing to you to ask…", "اكتبي: أتوجّه إليكم راجيةً…", "Напишете: ви се обраќам со молба…", "Ich wende mich an Sie mit der Bitte, …", ich-wende-mich-an-sie]
  - ask: ["Say: the request.", "قولي: الطلب.", "Кажете: барањето.", "Das Anliegen.", das-anliegen]
  - ask: ["Say: name those affected.", "قولي: اذكري المتضرّرين.", "Кажете: наведи ги засегнатите.", "Die Betroffenen nennen.", die-betroffenen]
  - ask: ["Write: I'd be grateful for a prompt reply.", "اكتبي: سأكون ممتنة لردّ قريب.", "Напишете: би ви била благодарна за брз одговор.", "Für eine baldige Antwort wäre ich Ihnen dankbar.", ihnen-dankbar]
  - ask: ["Say: an old-fashioned very formal closing.", "قولي: ختامًا رسميًا جدًا قديم الطراز.", "Кажете: старомоден многу формален завршеток.", "Hochachtungsvoll.", mit-freundlichen-gruessen-c2]
  - ask: ["Say: copy in the sports office.", "قولي: نسخة إلى مكتب الرياضة.", "Кажете: спортската служба во копија.", "Das Sportamt in Kopie.", in-kopie]
  - note: ["Any resident may write to the Oberbürgermeister; letters are answered, usually by the responsible office. Name the facts, those affected and one concrete request, and copy in the office concerned. Local newspapers and the city council's question time are the next steps.", "يحق لأي مقيم الكتابة إلى رئيس البلدية؛ والرسائل يُردّ عليها، عادةً من المكتب المختص. اذكري الوقائع والمتضرّرين وطلبًا محدّدًا واحدًا، وأرسلي نسخة إلى المكتب المعني. والصحف المحلية ووقت أسئلة المواطنين في مجلس المدينة هي الخطوات التالية.", "Секој жител може да му пишува на градоначалникот; на писмата се одговара, обично од надлежната служба. Наведете ги фактите, засегнатите и едно конкретно барање и ставете ја надлежната служба во копија. Локалните весници и часот за прашања на граѓаните во советот се следните чекори."]
