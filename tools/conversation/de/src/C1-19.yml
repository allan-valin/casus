id: C1-19
protagonist: f
title: ["A dispute between neighbours", "خلاف بين الجيران", "Соседски спор"]
situation:
  - "You've rented an allotment garden. Herr Krause's hedge next door blocks all your sun. Talking hasn't helped — now a mediator comes."
  - "استأجرتِ حديقة صغيرة. سياج السيد كراوزه المجاور يحجب الشمس كلها. الحديث لم ينفع — الآن يأتي وسيط."
  - "Изнајмивте мала градина. Живата ограда на господин Краузе до вас ви го зема целото сонце. Разговорот не помогна — сега доаѓа помирувач."
learn: [c1-concessive]
culture: Mediation before court
items:
  - [der-kleingarten, "der Kleingarten", "the allotment garden", "الحديقة الصغيرة المستأجرة", "малата градина", {rare: true}]
  - [die-hecke, "die Hecke", "the hedge", "السياج النباتي", "живата ограда"]
  - [die-schlichtung, "die Schlichtung", "mediation, arbitration", "التسوية الودية", "помирувањето", {rare: true}]
  - [die-schiedsperson, "die Schiedsperson", "the local mediator", "الوسيط المحلي", "помирувачот", {rare: true}]
  - [das-grundstueck, "das Grundstück", "the plot (of land)", "قطعة الأرض", "парцелата"]
  - [die-gartenordnung, "die Gartenordnung", "the garden rules", "نظام الحدائق", "правилникот на градините", {rare: true}]
  - [wenngleich, "wenngleich", "even though (formal)", "وإن كان", "иако (формално)"]
  - [selbst-wenn, "selbst wenn", "even if", "حتى لو", "дури и ако"]
  - [zurueckschneiden, "zurückschneiden", "cut back", "يقلّم", "поткаструва"]
  - [die-einigung, "die Einigung", "the agreement", "الاتفاق", "договорот, спогодбата"]
dialogue:
  - [krause, "Die Hecke steht seit dreißig Jahren. Die schneide ich nicht!", "The hedge has stood for thirty years. I'm not cutting it!", "السياج قائم منذ ثلاثين عامًا. لن أقلّمه!", "Оградата стои триесет години. Нема да ја сечам!"]
  - [protagonist, "Wenngleich sie schön ist — sie ist fast drei Meter hoch. Meine Tomaten bekommen keine Sonne.", "Even though it's beautiful — it's almost three metres high. My tomatoes get no sun.", "وإن كان جميلًا — فارتفاعه نحو ثلاثة أمتار. طماطمي لا تحصل على شمس.", "Иако е убава — висока е речиси три метри. Моите домати не добиваат сонце."]
  - [beraterin, "Ich bin die Schiedsperson. Laut Gartenordnung sind Hecken an der Grenze höchstens ein Meter fünfundzwanzig hoch.", "I'm the mediator. According to the garden rules, hedges at the boundary are at most one metre twenty-five.", "أنا الوسيطة. بحسب نظام الحدائق لا يزيد ارتفاع السياج على الحدود عن متر وخمسة وعشرين سنتيمترًا.", "Јас сум помирувачот. Според правилникот, оградите на границата се највисоко еден метар и дваесет и пет."]
  - [krause, "Selbst wenn — die Vögel nisten darin!", "Even so — the birds nest in it!", "حتى لو — الطيور تعشّش فيه!", "Дури и да е така — птиците гнездат во неа!"]
  - [beraterin, "Das stimmt. Deshalb darf man erst ab Oktober zurückschneiden. Wäre das eine Einigung?", "That's true. That's why cutting back is only allowed from October. Would that be an agreement?", "صحيح. لذلك لا يجوز التقليم إلا ابتداءً من أكتوبر. هل هذا اتفاق؟", "Точно. Затоа смее да се поткаструва дури од октомври. Дали тоа би била спогодба?"]
  - [protagonist, "Für mich ja. Ich helfe sogar beim Schneiden.", "For me, yes. I'll even help with the cutting.", "بالنسبة لي نعم. بل سأساعد في التقليم.", "За мене да. Дури ќе помогнам во сечењето."]
  - [krause, "Na gut. Im Oktober. Aber nur auf meinem Grundstück fasse ich selbst an.", "All right. In October. But on my own plot I'll do it myself.", "حسنًا. في أكتوبر. لكن في أرضي أقوم بذلك بنفسي.", "Добро. Во октомври. Но на мојата парцела сам ќе работам."]
  - [beraterin, "Dann schreibe ich die Einigung auf. Ganz ohne Gericht.", "Then I'll write the agreement down. Without any court.", "إذن أكتب الاتفاق. دون أي محكمة.", "Тогаш ќе ја запишам спогодбата. Сосема без суд."]
teach:
  - ask: ["Say: the allotment garden.", "قولي: الحديقة الصغيرة.", "Кажете: малата градина.", "Der Kleingarten.", der-kleingarten]
  - ask: ["Say: the hedge.", "قولي: السياج النباتي.", "Кажете: живата ограда.", "Die Hecke.", die-hecke]
  - note: ["Formal concessive connectors: «wenngleich» (even though — verb at the end), «selbst wenn» (even if). They admit the other's point before your own: «Wenngleich sie schön ist, …».", "أدوات التسليم الرسمية: «wenngleich» (وإن كان — الفعل في الآخر)، «selbst wenn» (حتى لو). تقرّ بنقطة الآخر قبل نقطتكِ: «Wenngleich sie schön ist, …».", "Формални допусни сврзници: «wenngleich» (иако — глаголот на крајот), «selbst wenn» (дури и ако). Ја признаваат поентата на другиот пред вашата: «Wenngleich sie schön ist, …»."]
  - ask: ["Say: even though it's beautiful…", "قولي: وإن كان جميلًا…", "Кажете: иако е убава…", "Wenngleich sie schön ist…", wenngleich]
  - ask: ["He says: even so.", "يقول: حتى لو.", "Тој вели: дури и да е така.", "Selbst wenn.", selbst-wenn]
  - ask: ["Say: the mediator.", "قولي: الوسيط.", "Кажете: помирувачот.", "Die Schiedsperson.", die-schiedsperson]
  - ask: ["Say: according to the garden rules.", "قولي: بحسب نظام الحدائق.", "Кажете: според правилникот.", "Laut Gartenordnung.", die-gartenordnung]
  - ask: ["Say: cut back from October.", "قولي: التقليم ابتداءً من أكتوبر.", "Кажете: поткастрување од октомври.", "Ab Oktober zurückschneiden.", zurueckschneiden]
  - ask: ["Ask: would that be an agreement?", "اسألي: هل هذا اتفاق؟", "Прашајте: дали тоа би била спогодба?", "Wäre das eine Einigung?", die-einigung]
  - ask: ["Say: on my own plot.", "قولي: في أرضي.", "Кажете: на мојата парцела.", "Auf meinem Grundstück.", das-grundstueck]
  - ask: ["Say: mediation instead of court.", "قولي: تسوية ودية بدلًا من المحكمة.", "Кажете: помирување наместо суд.", "Schlichtung statt Gericht.", die-schlichtung]
  - note: ["Allotment gardens (Kleingärten) were invented in Leipzig and come with strict rules: hedge heights, a share of vegetables, quiet hours. Neighbour disputes go first to a local mediator (Schiedsperson) — in many states that's required before you may sue. Hedges may only be cut back hard from October to February, to protect nesting birds.", "الحدائق الصغيرة (Kleingärten) اختُرعت في لايبزيغ وتأتي بقواعد صارمة: ارتفاع السياج، ونسبة للخضروات، وساعات هدوء. وخلافات الجيران تذهب أولًا إلى وسيط محلي (Schiedsperson) — وفي ولايات كثيرة هذا إلزامي قبل رفع دعوى. ولا يجوز التقليم الجذري للسياج إلا من أكتوبر إلى فبراير، حمايةً للطيور المعشّشة.", "Малите градини (Kleingärten) се измислени во Лајпциг и имаат строги правила: висина на оградите, дел за зеленчук, часови на тишина. Соседските спорови прво одат кај локален помирувач (Schiedsperson) — во многу покраини тоа е задолжително пред тужба. Оградите смеат силно да се поткаструваат само од октомври до февруари, за заштита на птиците."]
