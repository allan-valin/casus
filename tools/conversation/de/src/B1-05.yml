id: B1-05
protagonist: f
title: ["If I were rich", "لو كنتُ غنية", "Да сум богата"]
situation:
  - "A late evening on the balcony with Jonas and Lena. Everyone dreams aloud."
  - "سهرة متأخرة على الشرفة مع يوناس ولينا. الجميع يحلمون بصوت عالٍ."
  - "Доцна вечер на балконот со Јонас и Лена. Сите сонуваат на глас."
learn: [b1-konjunktiv-ii]
culture: Tea or beer
items:
  - [waere, "wäre", "would be, were", "لو كان، سيكون", "би бил, да беше"]
  - [haette, "hätte", "would have", "لو كان عندي", "би имал"]
  - [wuerde, "würde", "would", "لكنتُ (فعلتُ)", "би"]
  - [reich, "reich", "rich", "غني", "богат"]
  - [wenn-ich, "Wenn ich … wäre", "If I were …", "لو كنتُ …", "Да сум …"]
  - [ein-haus-am-meer, "ein Haus am Meer", "a house by the sea", "بيت على البحر", "куќа покрај морето"]
  - [reisen, "reisen", "travel", "يسافر", "патува"]
  - [die-welt, "die Welt", "the world", "العالم", "светот"]
  - [mehr-zeit, "mehr Zeit", "more time", "وقت أكثر", "повеќе време"]
  - [der-traum, "der Traum", "the dream", "الحلم", "сонот"]
  - [schade, "Schade!", "What a pity!", "يا للأسف!", "Штета!"]
dialogue:
  - [lena, "Wenn ich reich wäre, würde ich ein Haus am Meer kaufen.", "If I were rich, I'd buy a house by the sea.", "لو كنتُ غنية، لاشتريتُ بيتًا على البحر.", "Да сум богата, би купила куќа покрај морето."]
  - [jonas, "Ich würde um die Welt reisen. Ein Jahr lang!", "I'd travel round the world. For a whole year!", "كنتُ سأسافر حول العالم. سنة كاملة!", "Јас би патувал околу светот. Цела година!"]
  - [lena, "Und du? Was würdest du machen?", "And you? What would you do?", "وأنتِ؟ ماذا كنتِ ستفعلين؟", "А ти? Што би направила?"]
  - [protagonist, "Ich hätte gern mehr Zeit. Für meine Familie.", "I'd like to have more time. For my family.", "كنتُ أودّ أن يكون عندي وقت أكثر. لعائلتي.", "Би сакала да имам повеќе време. За семејството."]
  - [jonas, "Das ist ein schöner Traum. Noch ein Bier?", "That's a lovely dream. Another beer?", "هذا حلم جميل. بيرة أخرى؟", "Тоа е убав сон. Уште едно пиво?"]
  - [protagonist, "Für mich lieber einen Tee.", "Tea for me, please.", "أفضّل شايًا.", "За мене подобро чај."]
  - [lena, "Wenn ich Zeit hätte, würde ich Arabisch lernen. Oder Mazedonisch!", "If I had time, I'd learn Arabic. Or Macedonian!", "لو كان عندي وقت لتعلّمتُ العربية. أو المقدونية!", "Да имам време, би учела арапски. Или македонски!"]
  - [protagonist, "Und warum nicht jetzt?", "And why not now?", "ولماذا ليس الآن؟", "А зошто не сега?"]
  - [lena, "Keine Zeit! Schade.", "No time! What a pity.", "لا وقت! يا للأسف.", "Немам време! Штета."]
teach:
  - note: ["Dreams and wishes use the Konjunktiv II: «wäre» (would be), «hätte» (would have), «würde» + infinitive for other verbs: «Wenn ich reich wäre, würde ich reisen».", "الأحلام والأمنيات تستعمل صيغة التمني (Konjunktiv II): «wäre» (لو كان)، «hätte» (لو كان عندي)، و«würde» مع المصدر لبقية الأفعال: «Wenn ich reich wäre, würde ich reisen».", "Соништа и желби користат Konjunktiv II: «wäre» (би бил), «hätte» (би имал), «würde» + инфинитив за другите глаголи: «Wenn ich reich wäre, würde ich reisen»."]
  - ask: ["Say: if I were rich…", "قولي: لو كنتُ غنية…", "Кажете: да сум богата…", "Wenn ich reich wäre…", wenn-ich, waere, reich]
  - ask: ["Say: I'd buy a house by the sea.", "قولي: لاشتريتُ بيتًا على البحر.", "Кажете: би купила куќа покрај морето.", "Ich würde ein Haus am Meer kaufen.", wuerde, ein-haus-am-meer]
  - ask: ["Say: I'd travel round the world.", "قولي: كنتُ سأسافر حول العالم.", "Кажете: би патувала околу светот.", "Ich würde um die Welt reisen.", reisen, die-welt]
  - ask: ["Say: I'd like to have more time.", "قولي: كنتُ أودّ أن يكون عندي وقت أكثر.", "Кажете: би сакала да имам повеќе време.", "Ich hätte gern mehr Zeit.", haette, mehr-zeit]
  - ask: ["Say: that's a lovely dream.", "قولي: هذا حلم جميل.", "Кажете: тоа е убав сон.", "Das ist ein schöner Traum.", der-traum]
  - ask: ["Say: tea for me, please.", "قولي: أفضّل شايًا.", "Кажете: за мене подобро чај.", "Für mich lieber einen Tee.", lieber]
  - ask: ["Say: if I had time…", "قولي: لو كان عندي وقت…", "Кажете: да имам време…", "Wenn ich Zeit hätte…", haette]
  - ask: ["Say: what a pity!", "قولي: يا للأسف!", "Кажете: штета!", "Schade!", schade]
  - note: ["«Ich hätte gern» is also the polite way to order: «Ich hätte gern einen Tee».", "«Ich hätte gern» هي أيضًا الطريقة المؤدبة للطلب: «Ich hätte gern einen Tee».", "«Ich hätte gern» е и учтивиот начин да се нарача: «Ich hätte gern einen Tee»."]
