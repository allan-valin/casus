id: B1-19-a
tracks: [ar]
protagonist: f
title: ["صديقة من مسكن اللاجئين"]
situation: ["رنا، صديقتكِ السورية، جاءت لاجئة. في حفلة المدينة تقف عند كشك الفلافل الذي فتحته وتحكي لكِ."]
learn: [b1-separable-past]
culture: Several paths into the same country
items:
  - [die-unterkunft, "die Unterkunft", "مسكن اللاجئين"]
  - [kam-an, "kam an", "وصلتُ"]
  - [das-landratsamt, "das Landratsamt", "دائرة المقاطعة", {rare: true}]
  - [die-anerkennung, "die Anerkennung", "الاعتراف (باللجوء)"]
  - [kein-deutschkurs, "kein Deutschkurs", "لا دورة ألمانية"]
  - [gruessten-nicht-mehr, "grüßten nicht mehr", "لم يعودوا يحيّون"]
  - [der-stand, "der Stand", "الكشك"]
  - [das-stadtfest, "das Stadtfest", "حفلة المدينة"]
  - [der-gebetsraum, "der Gebetsraum", "المصلّى", {rare: true}]
  - [machte-auf, "machte auf", "فتحتُ"]
  - [zog-um, "zog um", "انتقلتُ (من سكن)"]
dialogue:
  - [protagonist, "Rana! Dein Falafelstand ist voll!", "رنا! كشك الفلافل عندكِ ممتلئ!"]
  - [rana, "Endlich! Als ich ankam, wohnte ich zwei Jahre in einer Unterkunft.", "أخيرًا! حين وصلتُ سكنتُ عامين في مسكن للاجئين."]
  - [protagonist, "Zwei Jahre! Und Deutsch?", "عامين! والألمانية؟"]
  - [rana, "Vor der Anerkennung gab es keinen Deutschkurs. Ich lernte mit dem Handy.", "قبل الاعتراف لم تكن هناك دورة ألمانية. تعلّمتُ بالهاتف."]
  - [protagonist, "Und die Nachbarn?", "والجيران؟"]
  - [rana, "Am Anfang brachten sie Geschenke. Nach Weihnachten grüßten viele nicht mehr.", "في البداية أحضروا هدايا. بعد عيد الميلاد كثيرون لم يعودوا يحيّون."]
  - [protagonist, "Das tut mir leid. Und jetzt?", "يؤسفني ذلك. والآن؟"]
  - [rana, "Jetzt zog ich in eine Wohnung um und machte den Stand auf. Und im Rathaus gibt es einen Gebetsraum!", "الآن انتقلتُ إلى شقة وفتحتُ الكشك. وفي البلدية يوجد مصلّى!"]
teach:
  - ask: ["قولي: كشككِ ممتلئ!", "Dein Stand ist voll!", der-stand]
  - note: ["الأفعال المنفصلة تنقسم في الماضي البسيط أيضًا: «ankommen» ← «ich kam an»؛ «aufmachen» ← «ich machte auf»؛ «umziehen» ← «ich zog um»."]
  - ask: ["قولي: حين وصلتُ…", "Als ich ankam…", kam-an]
  - ask: ["قولي: سكنتُ في مسكن للاجئين.", "Ich wohnte in einer Unterkunft.", die-unterkunft]
  - ask: ["قولي: قبل الاعتراف.", "Vor der Anerkennung.", die-anerkennung]
  - ask: ["قولي: لم تكن هناك دورة ألمانية.", "Es gab keinen Deutschkurs.", kein-deutschkurs]
  - ask: ["قولي: كثيرون لم يعودوا يحيّون.", "Viele grüßten nicht mehr.", gruessten-nicht-mehr]
  - ask: ["قولي: انتقلتُ إلى شقة.", "Ich zog in eine Wohnung um.", zog-um]
  - ask: ["قولي: فتحتُ الكشك.", "Ich machte den Stand auf.", machte-auf]
  - ask: ["قولي: حفلة المدينة.", "Das Stadtfest.", das-stadtfest]
  - ask: ["قولي: مصلّى.", "Ein Gebetsraum.", der-gebetsraum]
  - ask: ["قولي: دائرة المقاطعة.", "Das Landratsamt.", das-landratsamt]
  - note: ["طرق كثيرة إلى البلد نفسه: أنتِ جئتِ مع زوجكِ ببطاقته الزرقاء، ورنا جاءت لاجئة. اللاجئون يسكنون غالبًا شهورًا في مساكن جماعية تديرها دائرة المقاطعة (Landratsamt)، والوصول إلى دورة الاندماج قبل الاعتراف يختلف حسب البلد الأصلي. القواعد تتغيّر — تحقّقي من الحالية."]
