id: B1-10-a
tracks: [ar]
protagonist: m
title: ["إذا فقدتُ العمل؟"]
situation: ["شركتك تعيد الهيكلة. جارك يوناس يشرح ما يحدث لو فقدت العمل."]
learn: [de-con_04]
culture: Unemployment insurance and the residence permit
items:
  - [das-arbeitslosengeld, "das Arbeitslosengeld", "إعانة البطالة", {rare: true}]
  - [obwohl, "obwohl", "مع أنّ (الفعل في الآخر)"]
  - [die-arbeitslosenversicherung, "die Arbeitslosenversicherung", "تأمين البطالة", {rare: true}]
  - [eingezahlt, "eingezahlt", "دفعتُ (اشتراكات)"]
  - [die-agentur-fuer-arbeit, "die Agentur für Arbeit", "وكالة العمل", {rare: true}]
  - [sofort-melden, "sich sofort melden", "يسجّل فورًا"]
  - [einen-neuen-job, "einen neuen Job", "عملًا جديدًا"]
  - [die-auslaenderbehoerde-info, "die Ausländerbehörde informieren", "يُبلغ دائرة الأجانب"]
  - [ich-mache-mir-sorgen-a, "ich mache mir Sorgen", "أنا قلق"]
  - [keine-panik, "Keine Panik!", "لا داعي للذعر!"]
dialogue:
  - [protagonist, "Die Firma baut Stellen ab. Ich mache mir Sorgen.", "الشركة تلغي وظائف. أنا قلق."]
  - [jonas, "Keine Panik! Du hast in die Arbeitslosenversicherung eingezahlt.", "لا داعي للذعر! لقد دفعت اشتراكات تأمين البطالة."]
  - [protagonist, "Dann bekomme ich Arbeitslosengeld?", "إذن أحصل على إعانة البطالة؟"]
  - [jonas, "Ja, für eine bestimmte Zeit. Melde dich sofort bei der Agentur für Arbeit.", "نعم، لمدة محددة. سجّل نفسك فورًا في وكالة العمل."]
  - [protagonist, "Und meine Blaue Karte? Obwohl ich keinen Job habe?", "وبطاقتي الزرقاء؟ مع أنه لن يكون عندي عمل؟"]
  - [jonas, "Du musst die Ausländerbehörde informieren. Dann hast du Zeit, einen neuen Job zu suchen.", "يجب أن تُبلغ دائرة الأجانب. ثم يكون لديك وقت للبحث عن عمل جديد."]
  - [protagonist, "Wie lange?", "كم من الوقت؟"]
  - [jonas, "Das weiß ich nicht genau. Frag die Behörde — die Regeln ändern sich.", "لا أعرف بالضبط. اسأل الدائرة — القواعد تتغيّر."]
teach:
  - ask: ["قل: أنا قلق.", "Ich mache mir Sorgen.", ich-mache-mir-sorgen-a]
  - ask: ["يقول: لا داعي للذعر!", "Keine Panik!", keine-panik]
  - ask: ["قل: دفعتُ اشتراكات تأمين البطالة.", "Ich habe in die Arbeitslosenversicherung eingezahlt.", die-arbeitslosenversicherung, eingezahlt]
  - ask: ["قل: إعانة البطالة.", "Das Arbeitslosengeld.", das-arbeitslosengeld]
  - ask: ["قل: وكالة العمل.", "Die Agentur für Arbeit.", die-agentur-fuer-arbeit]
  - ask: ["قل: سجّل نفسك فورًا.", "Melde dich sofort.", sofort-melden]
  - note: ["«obwohl» (مع أنّ) ترسل الفعل إلى الآخر، مثل «weil»: «obwohl ich keinen Job habe»."]
  - ask: ["قل: مع أنه لن يكون عندي عمل.", "Obwohl ich keinen Job habe.", obwohl]
  - ask: ["قل: يجب أن أُبلغ دائرة الأجانب.", "Ich muss die Ausländerbehörde informieren.", die-auslaenderbehoerde-info]
  - ask: ["قل: لأبحث عن عمل جديد.", "Um einen neuen Job zu suchen.", einen-neuen-job]
  - note: ["الموظف الذي دفع اشتراكات تأمين البطالة يحصل على إعانة البطالة لمدة محددة، بشرط التسجيل مبكرًا في وكالة العمل. وحامل البطاقة الزرقاء يجب أن يُبلغ دائرة الأجانب؛ وله مهلة للبحث عن عمل جديد. المدد تتغيّر — تحقّق منها."]
