id: C2-02
protagonist: m
title: ["Irony at the office", "السخرية في المكتب", "Иронија во канцеларијата"]
situation:
  - "You've finished a big project. Frau Schröder says: 'Not bad.' Are you in trouble? Sabine decodes German understatement."
  - "أنهيتَ مشروعًا كبيرًا. السيدة شرودر تقول: «ليس سيئًا.» هل أنت في ورطة؟ زابينه تفكّ شيفرة التهوين الألماني."
  - "Завршивте голем проект. Госпоѓа Шредер вели: „Не е лошо.“ Дали сте во неволја? Сабине го дешифрира германското потценување."
learn: [c2-irony-particles]
culture: Understatement
items:
  - [nicht-schlecht, "Nicht schlecht", "Not bad (= very good)", "ليس سيئًا (= ممتاز)", "Не е лошо (= многу добро)"]
  - [das-understatement, "das Understatement", "understatement", "التهوين", "потценувањето"]
  - [kann-man-machen, "Kann man machen", "That's one way (= doubtful)", "يمكن ذلك (= بتشكّك)", "Може и така (= со сомнеж)"]
  - [ganz-interessant, "ganz interessant", "quite interesting (= not convinced)", "مثير للاهتمام نوعًا ما (= غير مقتنع)", "прилично интересно (= не е убеден)"]
  - [da-hast-du-dir-muehe-gegeben, "Da hast du dir ja Mühe gegeben", "You really made an effort (ironic or sincere)", "لقد بذلتَ جهدًا حقًا (ساخرًا أو صادقًا)", "Баш си се потрудил (иронично или искрено)"]
  - [das-hoechste-lob, "das höchste Lob", "the highest praise", "أعلى مديح", "најголемата пофалба"]
  - [zwischen-den-zeilen, "zwischen den Zeilen", "between the lines", "ما بين السطور", "меѓу редовите"]
  - [gemeint-sein, "wie es gemeint ist", "how it's meant", "ما المقصود", "како е мислено"]
  - [der-tonfall, "der Tonfall", "the tone of voice", "نبرة الصوت", "тонот на гласот"]
  - [na-ja-gut, "Na ja, gut", "Well, all right (= reluctant)", "حسنًا، لا بأس (= على مضض)", "Па, добро (= неволно)"]
dialogue:
  - [schroeder, "Die Präsentation? Nicht schlecht.", "The presentation? Not bad.", "العرض؟ ليس سيئًا.", "Презентацијата? Не е лошо."]
  - [protagonist, "Sabine, sie fand es nur „nicht schlecht“. Muss ich mir Sorgen machen?", "Sabine, she only found it 'not bad'. Should I worry?", "زابينه، لقد وجدته «ليس سيئًا» فقط. هل يجب أن أقلق؟", "Сабине, таа рече само „не е лошо“. Треба ли да се грижам?"]
  - [sabine, "Im Gegenteil! Von ihr ist „nicht schlecht“ das höchste Lob.", "On the contrary! From her, 'not bad' is the highest praise.", "بالعكس! «ليس سيئًا» منها هو أعلى مديح.", "Напротив! Од неа „не е лошо“ е најголемата пофалба."]
  - [protagonist, "Und was bedeutet „ganz interessant“?", "And what does 'quite interesting' mean?", "وماذا تعني «مثير للاهتمام نوعًا ما»؟", "А што значи „прилично интересно“?"]
  - [sabine, "Das heißt: Sie ist nicht überzeugt. Und „kann man machen“ heißt eigentlich: lieber nicht.", "That means: she isn't convinced. And 'that's one way' actually means: better not.", "يعني: إنها غير مقتنعة. و«يمكن ذلك» تعني في الحقيقة: الأفضل لا.", "Тоа значи: не е убедена. А „може и така“ всушност значи: подобро не."]
  - [protagonist, "Man muss also zwischen den Zeilen lesen.", "So you have to read between the lines.", "إذن يجب القراءة ما بين السطور.", "Значи треба да се чита меѓу редовите."]
  - [sabine, "Und auf den Tonfall hören. „Da hast du dir ja Mühe gegeben“ kann Lob oder Spott sein.", "And listen to the tone. 'You really made an effort' can be praise or mockery.", "والإصغاء إلى النبرة. «لقد بذلتَ جهدًا حقًا» قد تكون مديحًا أو سخرية.", "И да се слуша тонот. „Баш си се потрудил“ може да е пофалба или потсмев."]
  - [protagonist, "Na ja, gut — dann sage ich jetzt auch öfter „nicht schlecht“.", "Well, all right — then I'll say 'not bad' more often too.", "حسنًا، لا بأس — إذن سأقول أنا أيضًا «ليس سيئًا» أكثر.", "Па, добро — тогаш и јас почесто ќе велам „не е лошо“."]
teach:
  - ask: ["She says: not bad (= very good).", "تقول: ليس سيئًا (= ممتاز).", "Таа вели: не е лошо (= многу добро).", "Nicht schlecht.", nicht-schlecht]
  - ask: ["Sabine: the highest praise.", "زابينه: أعلى مديح.", "Сабине: најголемата пофалба.", "Das höchste Lob.", das-hoechste-lob]
  - note: ["German understatement and irony live in small words and tone: «nicht schlecht» (= very good), «ganz interessant» (= not convinced), «kann man machen» (= rather not), «Na ja, gut» (= reluctantly). The particle «ja» can make praise sound ironic.", "التهوين والسخرية في الألمانية يعيشان في الكلمات الصغيرة والنبرة: «nicht schlecht» (= ممتاز)، «ganz interessant» (= غير مقتنع)، «kann man machen» (= الأفضل لا)، «Na ja, gut» (= على مضض). والأداة «ja» قد تجعل المديح يبدو ساخرًا.", "Германското потценување и иронија живеат во мали зборови и тон: «nicht schlecht» (= многу добро), «ganz interessant» (= не е убеден), «kann man machen» (= подобро не), «Na ja, gut» (= неволно). Честичката «ja» може пофалбата да ја направи иронична."]
  - ask: ["Decode: quite interesting.", "فكّ الشيفرة: مثير للاهتمام نوعًا ما.", "Дешифрирајте: прилично интересно.", "Ganz interessant.", ganz-interessant]
  - ask: ["Decode: that's one way.", "فكّ الشيفرة: يمكن ذلك.", "Дешифрирајте: може и така.", "Kann man machen.", kann-man-machen]
  - ask: ["Say: read between the lines.", "قل: القراءة ما بين السطور.", "Кажете: читање меѓу редовите.", "Zwischen den Zeilen lesen.", zwischen-den-zeilen]
  - ask: ["Say: listen to the tone.", "قل: الإصغاء إلى النبرة.", "Кажете: слушање на тонот.", "Auf den Tonfall hören.", der-tonfall]
  - ask: ["Say: you really made an effort.", "قل: لقد بذلتَ جهدًا حقًا.", "Кажете: баш си се потрудил.", "Da hast du dir ja Mühe gegeben.", da-hast-du-dir-muehe-gegeben]
  - ask: ["Say reluctantly: well, all right.", "قل على مضض: حسنًا، لا بأس.", "Кажете неволно: па, добро.", "Na ja, gut.", na-ja-gut]
  - ask: ["Say: understatement.", "قل: التهوين.", "Кажете: потценување.", "Das Understatement.", das-understatement]
  - ask: ["Ask: how is it meant?", "اسأل: ما المقصود؟", "Прашајте: како е мислено?", "Wie ist das gemeint?", gemeint-sein]
