id: B1-25-e
tracks: [en]
protagonist: f
title: ["Minijob or working student?"]
situation: ["You need money beside your studies. Mia explains the options — and the rules for international students."]
learn: [b1-imperative-du]
culture: Working as an international student
items:
  - [der-minijob, "der Minijob", "a small job (low-earning)"]
  - [der-werkstudent, "die Werkstudentin", "the working student", {rare: true}]
  - [der-stundenlohn, "der Stundenlohn", "the hourly wage"]
  - [die-arbeitstage, "die Arbeitstage", "the working days"]
  - [der-halbe-tag, "ein halber Tag", "a half day"]
  - [ein-ganzer-tag, "ein ganzer Tag", "a full day"]
  - [die-semesterferien, "die Semesterferien", "the semester break"]
  - [das-pflichtpraktikum, "das Pflichtpraktikum", "the mandatory internship", {rare: true}]
  - [zaehl-mit, "zähl mit", "keep count (informal)"]
  - [frag-nach, "frag nach", "ask about it (informal)"]
  - [krankenversichert, "krankenversichert", "health-insured"]
dialogue:
  - [protagonist, "Mia, soll ich einen Minijob nehmen oder Werkstudentin werden?", "Mia, should I take a minijob or become a working student?"]
  - [mia, "Als Werkstudentin verdienst du mehr und lernst etwas für den Beruf.", "As a working student you earn more and learn something for your career."]
  - [protagonist, "Und die Regeln für mich? Ich komme nicht aus der EU.", "And the rules for me? I'm not from the EU."]
  - [mia, "Du hast eine Grenze pro Jahr: ganze oder halbe Arbeitstage. Mehr als vier Stunden sind ein ganzer Tag. Zähl mit!", "You have a limit per year: full or half working days. More than four hours is a full day. Keep count!"]
  - [protagonist, "Und das Pflichtpraktikum?", "And the mandatory internship?"]
  - [mia, "Das zählt nicht. Und in den Semesterferien darfst du Vollzeit arbeiten.", "That doesn't count. And in the semester break you may work full time."]
  - [protagonist, "Der Stundenlohn im Café ist gut, aber manchmal schicken sie mich früher nach Hause.", "The hourly wage at the café is good, but sometimes they send me home early."]
  - [mia, "Ja, wenn du schnell fertig bist. Und frag nach der Krankenversicherung — beim Minijob bist du nicht automatisch versichert.", "Yes, if you finish fast. And ask about health insurance — with a minijob you're not automatically insured."]
teach:
  - ask: ["Ask: minijob or working student?", "Minijob oder Werkstudentin?", der-minijob, der-werkstudent]
  - ask: ["Say: the hourly wage.", "Der Stundenlohn.", der-stundenlohn]
  - ask: ["Say: full or half working days.", "Ganze oder halbe Arbeitstage.", die-arbeitstage, der-halbe-tag]
  - ask: ["Say: more than four hours is a full day.", "Mehr als vier Stunden sind ein ganzer Tag.", ein-ganzer-tag]
  - note: ["The du-imperative drops the -st and the du: «du zählst mit» → «Zähl mit!»; «du fragst nach» → «Frag nach!». Separable parts go to the end."]
  - ask: ["She says: keep count!", "Zähl mit!", zaehl-mit]
  - ask: ["Say: the mandatory internship doesn't count.", "Das Pflichtpraktikum zählt nicht.", das-pflichtpraktikum]
  - ask: ["Say: full time in the semester break.", "Vollzeit in den Semesterferien.", die-semesterferien]
  - ask: ["She says: ask about health insurance!", "Frag nach der Krankenversicherung!", frag-nach]
  - ask: ["Ask: am I health-insured?", "Bin ich krankenversichert?", krankenversichert]
  - note: ["Non-EU students may work a yearly limit of full or half days (140 full or 280 half since 2024 — check the current numbers); more than four hours counts as a full day; a mandatory internship doesn't count; in the semester break full-time work is allowed. Hourly jobs may send you home when the work is done. A minijob brings no health insurance of its own, and a second job is taxed in class VI."]
