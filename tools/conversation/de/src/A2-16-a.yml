id: A2-16-a
tracks: [ar]
protagonist: m
title: ["إعانة الأطفال"]
situation: ["في «Familienkasse»، مكتب إعانات العائلة. تقدّم طلب إعانة الأطفال ليارا."]
learn: [de-vsp_05, de-vsp_04]
culture: Rules and where to apply
items:
  - [der-antrag, "der Antrag", "الطلب"]
  - [die-familienkasse, "die Familienkasse", "مكتب إعانات العائلة", {rare: true}]
  - [die-geburtsurkunde, "die Geburtsurkunde", "شهادة الميلاد", {rare: true}]
  - [uebersetzt, "übersetzt", "مترجَم"]
  - [war, "war", "كان"]
  - [hatte, "hatte", "كان عندي"]
  - [die-steuer-id-kind, "die Steuer-ID des Kindes", "الرقم الضريبي للطفل", {rare: true}]
  - [rueckwirkend, "rückwirkend", "بأثر رجعي"]
  - [die-bearbeitung, "die Bearbeitung", "معالجة الطلب"]
  - [der-bescheid, "der Bescheid", "القرار الرسمي (الإشعار)"]
dialogue:
  - [schulz, "Sie möchten Kindergeld beantragen?", "تريد أن تقدّم طلب إعانة الأطفال؟"]
  - [protagonist, "Ja. Hier ist der Antrag für meine Tochter.", "نعم. هذا الطلب لابنتي."]
  - [schulz, "Haben Sie die Geburtsurkunde?", "هل معك شهادة الميلاد؟"]
  - [protagonist, "Ja, übersetzt. Die Übersetzung war teuer.", "نعم، مترجَمة. الترجمة كانت غالية."]
  - [schulz, "Und die Steuer-ID des Kindes?", "والرقم الضريبي للطفلة؟"]
  - [protagonist, "Hier. Ich hatte sie zuerst nicht — sie kam per Post.", "تفضّل. لم يكن معي في البداية — وصل بالبريد."]
  - [schulz, "Gut. Sie bekommen einen Bescheid per Post.", "جيد. ستصلك رسالة القرار بالبريد."]
  - [protagonist, "Gibt es das Geld auch rückwirkend?", "هل يُدفع المال بأثر رجعي أيضًا؟"]
  - [schulz, "Für einige Monate, ja. Die genauen Regeln stehen im Bescheid.", "لعدة أشهر، نعم. القواعد الدقيقة مكتوبة في القرار."]
teach:
  - ask: ["قل: إعانة الأطفال.", "Das Kindergeld.", das-kindergeld-a]
  - ask: ["قل: هذا الطلب لابنتي.", "Hier ist der Antrag für meine Tochter.", der-antrag]
  - ask: ["قل: مكتب إعانات العائلة.", "Die Familienkasse.", die-familienkasse]
  - ask: ["قل: شهادة الميلاد، مترجَمة.", "Die Geburtsurkunde, übersetzt.", die-geburtsurkunde, uebersetzt]
  - note: ["لـ«كان» و«كان عندي» تستعمل الألمانية غالبًا الماضي البسيط حتى في الكلام: «war»، «hatte». «Die Übersetzung war teuer.» «Ich hatte sie nicht.»"]
  - ask: ["قل: الترجمة كانت غالية.", "Die Übersetzung war teuer.", war]
  - ask: ["قل: لم يكن معي في البداية.", "Ich hatte sie zuerst nicht.", hatte]
  - ask: ["قل: الرقم الضريبي للطفلة.", "Die Steuer-ID des Kindes.", die-steuer-id-kind]
  - ask: ["قل: القرار الرسمي.", "Der Bescheid.", der-bescheid]
  - ask: ["اسأل: كم تستغرق معالجة الطلب؟", "Wie lange dauert die Bearbeitung?", die-bearbeitung]
  - ask: ["اسأل: هل يُدفع بأثر رجعي؟", "Gibt es das Geld rückwirkend?", rueckwirkend]
  - note: ["إعانة الأطفال تُدفع للأطفال المقيمين في ألمانيا، وللوالدين من خارج الاتحاد الأوروبي حسب تصريح الإقامة. والمبالغ والمدد تتغير — كل شيء مكتوب في «Bescheid»، فاحتفظ به."]
