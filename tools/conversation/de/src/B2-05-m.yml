id: B2-05-m
tracks: [mk]
protagonist: f
title: ["Подолг престој"]
situation: ["Сакате да останете кај Петар подолго од три месеци. Тој ви објаснува што ви треба."]
learn: [de-vsub_04]
culture: Staying longer as an EU citizen
items:
  - [laenger-als, "länger als drei Monate", "подолго од три месеци"]
  - [klaeren, "klären", "разјаснува"]
  - [der-versicherungsschutz, "der Versicherungsschutz", "осигурителната заштита", {rare: true}]
  - [ausreichend, "ausreichend", "доволно"]
  - [die-mittel, "die Mittel", "средствата"]
  - [er-sagt-es-sei, "er sagt, es sei …", "вели дека е …"]
  - [ich-muesse, "ich müsse …", "(пренесено) морам да …"]
  - [die-auslandskrankenversicherung, "die Auslandskrankenversicherung", "патното здравствено осигурување", {rare: true}]
  - [das-sozialabkommen, "das Sozialversicherungsabkommen", "договорот за социјално осигурување", {rare: true}]
  - [nachweisen, "nachweisen", "докажува"]
dialogue:
  - [protagonist, "Petar, wir möchten länger als drei Monate bleiben. Geht das?", "Петре, сакаме да останеме подолго од три месеци. Може ли?"]
  - [petar, "Ja, mit dem bulgarischen Pass habt ihr Freizügigkeit. Aber ihr müsst etwas nachweisen.", "Да, со бугарскиот пасош имате слобода на движење. Но мора нешто да докажете."]
  - [protagonist, "Was denn?", "Што?"]
  - [petar, "Ausreichende Mittel — eure Rente — und Versicherungsschutz.", "Доволно средства — вашата пензија — и осигурителна заштита."]
  - [protagonist, "Gilt unsere Versicherung aus Mazedonien hier?", "Дали нашето осигурување од Македонија важи тука?"]
  - [petar, "Teilweise, durch ein Sozialversicherungsabkommen. Für Lücken nehmen viele eine Auslandskrankenversicherung.", "Делумно, преку договор за социјално осигурување. За празнините многумина земаат патно здравствено осигурување."]
  - [anja, "Und? Was sagt Petar?", "И? Што вели Петар?"]
  - [protagonist, "Er sagt, es sei möglich. Ich müsse nur die Versicherung klären.", "Вели дека е можно. Само морам да го разјаснам осигурувањето."]
teach:
  - ask: ["Кажете: подолго од три месеци.", "Länger als drei Monate.", laenger-als]
  - ask: ["Кажете: слободата на движење.", "Die Freizügigkeit.", die-freizuegigkeit-m]
  - ask: ["Кажете: морам да го разјаснам.", "Ich muss das klären.", klaeren]
  - ask: ["Тој вели: мора да докажете.", "Ihr müsst es nachweisen.", nachweisen]
  - ask: ["Кажете: доволно средства.", "Ausreichende Mittel.", ausreichend, die-mittel]
  - ask: ["Кажете: осигурителна заштита.", "Versicherungsschutz.", der-versicherungsschutz]
  - ask: ["Кажете: договорот за социјално осигурување.", "Das Sozialversicherungsabkommen.", das-sozialabkommen]
  - ask: ["Кажете: патното здравствено осигурување.", "Die Auslandskrankenversicherung.", die-auslandskrankenversicherung]
  - note: ["Konjunktiv I пренесува туѓи зборови, главно во официјалниот и пишаниот германски: «Er sagt, es sei möglich» (вели дека е можно), «ich müsse die Versicherung klären» (морам да го разјаснам осигурувањето)."]
  - ask: ["Пренесете: вели дека е можно.", "Er sagt, es sei möglich.", er-sagt-es-sei]
  - ask: ["Пренесете: морам да го разјаснам осигурувањето.", "Ich müsse die Versicherung klären.", ich-muesse]
  - note: ["Граѓаните на ЕУ можат да останат до три месеци без услови; за подолго, кој не работи мора да има доволно средства и здравствено осигурување. Германија и Северна Македонија имаат договор за социјално осигурување, но тој не покрива сѐ. Прашајте ја вашата каса во Македонија и советувалиште тука — правилата се менуваат."]
