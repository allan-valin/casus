id: A2-05-a
tracks: [ar]
protagonist: f
title: ["التأمين الصحي"]
situation: ["عند شركة التأمين الصحي. تسألين إن كنتِ مؤمَّنة مع زوجكِ."]
learn: [de-cas_07]
culture: Family insurance
items:
  - [die-krankenkasse, "die Krankenkasse", "شركة التأمين الصحي"]
  - [mitversichert, "mitversichert", "مؤمَّنة ضمن العائلة"]
  - [bei-meinem-mann, "bei meinem Mann", "مع زوجي"]
  - [kostenlos, "kostenlos", "مجانًا"]
  - [die-versichertenkarte-a, "die Versichertenkarte", "بطاقة التأمين"]
  - [mit-foto, "mit Foto", "مع صورة"]
  - [schicken-sie-mir, "Schicken Sie mir …", "أرسلي لي …"]
  - [die-zaehne, "die Zähne", "الأسنان"]
  - [teilweise, "teilweise", "جزئيًا"]
  - [zuzahlen, "zuzahlen", "يدفع مبلغًا إضافيًا", {rare: true}]
dialogue:
  - [protagonist, "Guten Tag. Bin ich bei meinem Mann mitversichert?", "نهارك سعيد. هل أنا مؤمَّنة مع زوجي؟"]
  - [kasse, "Wenn Sie kein eigenes Einkommen haben, ja. Familienversicherung.", "إن لم يكن لديكِ دخل خاص، نعم. التأمين العائلي."]
  - [protagonist, "Und meine Tochter?", "وابنتي؟"]
  - [kasse, "Auch. Kinder sind kostenlos mitversichert.", "أيضًا. الأطفال مؤمَّنون مجانًا."]
  - [protagonist, "Bekomme ich eine eigene Karte?", "هل أحصل على بطاقة خاصة بي؟"]
  - [kasse, "Ja, eine Versichertenkarte mit Foto. Schicken Sie mir das Foto per App.", "نعم، بطاقة تأمين مع صورة. أرسلي لي الصورة عبر التطبيق."]
  - [protagonist, "Und der Zahnarzt? Sind die Zähne auch versichert?", "وطبيب الأسنان؟ هل الأسنان مؤمَّنة أيضًا؟"]
  - [kasse, "Teilweise. Für manches müssen Sie zuzahlen.", "جزئيًا. لبعض الأشياء يجب أن تدفعي مبلغًا إضافيًا."]
teach:
  - ask: ["اسألي: هل أنا مؤمَّنة مع زوجي؟", "Bin ich bei meinem Mann mitversichert?", mitversichert, bei-meinem-mann]
  - note: ["بعد «mit» و«bei» و«von» و«zu» تأتي حالة الجر: «bei meinem Mann»، «mit Foto»، «mir» (لي)."]
  - ask: ["قولي: شركة التأمين الصحي.", "Die Krankenkasse.", die-krankenkasse]
  - ask: ["تقول: الأطفال مؤمَّنون مجانًا.", "Kinder sind kostenlos mitversichert.", kostenlos]
  - ask: ["قولي: بطاقة التأمين.", "Die Versichertenkarte.", die-versichertenkarte-a]
  - ask: ["قولي: مع صورة.", "Mit Foto.", mit-foto]
  - ask: ["تقول: أرسلي لي الصورة.", "Schicken Sie mir das Foto.", schicken-sie-mir]
  - ask: ["اسألي: هل الأسنان مؤمَّنة؟", "Sind die Zähne versichert?", die-zaehne]
  - ask: ["تقول: جزئيًا.", "Teilweise.", teilweise]
  - ask: ["قولي: يجب أن أدفع مبلغًا إضافيًا.", "Ich muss zuzahlen.", zuzahlen]
  - note: ["في التأمين الحكومي يمكن تأمين الزوجة والأطفال دون دخل خاص مع الزوج مجانًا (التأمين العائلي). وإن بدأتِ العمل تغيّر الوضع — أخبري شركة التأمين."]
