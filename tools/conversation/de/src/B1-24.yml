id: B1-24
protagonist: m
title: ["Literature", "الأدب", "Литература"]
situation:
  - "The VHS evening ends in Auerbachs Keller, the tavern from Goethe's Faust. Professor Hartmann recites."
  - "أمسية الجامعة الشعبية تنتهي في «Auerbachs Keller»، الحانة من مسرحية «فاوست» لغوته. البروفيسور هارتمان يُلقي."
  - "Вечерта на народниот универзитет завршува во Auerbachs Keller, кафеаната од Гетеовиот „Фауст“. Професорот Хартман рецитира."
learn: [b1-future-i]
culture: Goethe in Leipzig
items:
  - [das-gedicht, "das Gedicht", "the poem", "القصيدة", "песната"]
  - [der-vers, "der Vers", "the verse, line", "البيت الشعري", "стихот"]
  - [der-dichter, "der Dichter", "the poet", "الشاعر", "поетот"]
  - [auswendig, "auswendig", "by heart", "عن ظهر قلب", "напамет"]
  - [ich-werde-lesen, "ich werde … lesen", "I will read …", "سأقرأ …", "ќе читам …"]
  - [das-theaterstueck, "das Theaterstück", "the play", "المسرحية", "театарската претстава"]
  - [der-teufel, "der Teufel", "the devil", "الشيطان", "ѓаволот"]
  - [die-szene, "die Szene", "the scene", "المشهد", "сцената"]
  - [schwer-zu-verstehen, "schwer zu verstehen", "hard to understand", "صعب الفهم", "тешко за разбирање"]
  - [uebersetzung, "die Übersetzung", "the translation", "الترجمة", "преводот"]
dialogue:
  - [hartmann, "In diesem Keller spielt eine Szene aus Goethes Faust. Hier trank der Teufel mit Studenten.", "A scene from Goethe's Faust takes place in this cellar. The devil drank with students here.", "في هذا القبو يجري مشهد من «فاوست» لغوته. هنا شرب الشيطان مع الطلاب.", "Во оваа визба се одвива сцена од Гетеовиот „Фауст“. Тука ѓаволот пиел со студенти."]
  - [protagonist, "Goethe war in Leipzig?", "Goethe was in Leipzig?", "غوته كان في لايبزيغ؟", "Гете бил во Лајпциг?"]
  - [hartmann, "Ja, als Student. Er ist der berühmteste deutsche Dichter.", "Yes, as a student. He's the most famous German poet.", "نعم، طالبًا. إنه أشهر شاعر ألماني.", "Да, како студент. Тој е најпознатиот германски поет."]
  - [protagonist, "Können Sie ein Gedicht auswendig?", "Do you know a poem by heart?", "هل تحفظ قصيدة عن ظهر قلب؟", "Знаете ли некоја песна напамет?"]
  - [hartmann, "„Über allen Gipfeln ist Ruh.“ Nur ein paar Verse, aber sehr schön.", "'Over all the peaks is peace.' Only a few lines, but very beautiful.", "«فوق كل القمم سكون.» أبيات قليلة لكنها جميلة جدًا.", "„Над сите врвови е мир.“ Само неколку стиха, но многу убави."]
  - [protagonist, "Das ist schwer zu verstehen. Gibt es eine Übersetzung?", "That's hard to understand. Is there a translation?", "هذا صعب الفهم. هل توجد ترجمة؟", "Тоа е тешко за разбирање. Има ли превод?"]
  - [hartmann, "In fast jeder Sprache. Aber Sie werden es bald auf Deutsch lesen.", "In almost every language. But soon you'll read it in German.", "بكل اللغات تقريبًا. لكنك ستقرؤها قريبًا بالألمانية.", "На речиси секој јазик. Но наскоро ќе ја читате на германски."]
  - [protagonist, "Ich werde den Faust lesen — irgendwann!", "I will read Faust — some day!", "سأقرأ «فاوست» — يومًا ما!", "Ќе го прочитам „Фауст“ — некогаш!"]
teach:
  - ask: ["Say: the devil drank with students here.", "قل: هنا شرب الشيطان مع الطلاب.", "Кажете: тука ѓаволот пиел со студенти.", "Hier trank der Teufel mit Studenten.", der-teufel]
  - ask: ["Say: a scene from Faust.", "قل: مشهد من «فاوست».", "Кажете: сцена од „Фауст“.", "Eine Szene aus dem Faust.", die-szene]
  - ask: ["Say: the most famous German poet.", "قل: أشهر شاعر ألماني.", "Кажете: најпознатиот германски поет.", "Der berühmteste deutsche Dichter.", beruehmt, der-dichter]
  - ask: ["Ask: do you know a poem by heart?", "اسأل: هل تحفظ قصيدة عن ظهر قلب؟", "Прашајте: знаете ли некоја песна напамет?", "Können Sie ein Gedicht auswendig?", das-gedicht, auswendig]
  - ask: ["Say: only a few lines.", "قل: أبيات قليلة فقط.", "Кажете: само неколку стиха.", "Nur ein paar Verse.", der-vers]
  - ask: ["Say: that's hard to understand.", "قل: هذا صعب الفهم.", "Кажете: тоа е тешко за разбирање.", "Das ist schwer zu verstehen.", schwer-zu-verstehen]
  - ask: ["Ask: is there a translation?", "اسأل: هل توجد ترجمة؟", "Прашајте: има ли превод?", "Gibt es eine Übersetzung?", uebersetzung]
  - note: ["The future uses «werden» + infinitive at the end: «Sie werden es lesen», «Ich werde den Faust lesen». In speech, the present with a time word is more common: «Ich lese ihn bald».", "المستقبل يستعمل «werden» مع المصدر في الآخر: «Sie werden es lesen»، «Ich werde den Faust lesen». وفي الكلام يشيع المضارع مع كلمة زمن: «Ich lese ihn bald».", "Идното време користи «werden» + инфинитив на крајот: «Sie werden es lesen», «Ich werde den Faust lesen». Во говорот е почесто сегашно време со збор за време: «Ich lese ihn bald»."]
  - ask: ["Say: I will read Faust.", "قل: سأقرأ «فاوست».", "Кажете: ќе го прочитам „Фауст“.", "Ich werde den Faust lesen.", ich-werde-lesen]
  - ask: ["Say: a play.", "قل: مسرحية.", "Кажете: театарска претстава.", "Ein Theaterstück.", das-theaterstueck]
  - note: ["Goethe studied law in Leipzig and set a scene of Faust in Auerbachs Keller, which still serves food today. «Wandrers Nachtlied» (Über allen Gipfeln ist Ruh) is one of the best-known German poems — eight short lines.", "درس غوته الحقوق في لايبزيغ ووضع مشهدًا من «فاوست» في «Auerbachs Keller»، الذي ما زال مطعمًا حتى اليوم. وقصيدة «أغنية المسافر الليلية» (Über allen Gipfeln ist Ruh) من أشهر القصائد الألمانية — ثمانية أبيات قصيرة.", "Гете студирал право во Лајпциг и сместил сцена од „Фауст“ во Auerbachs Keller, кој и денес служи храна. „Ноќна песна на патникот“ (Über allen Gipfeln ist Ruh) е една од најпознатите германски песни — осум кратки стиха."]
