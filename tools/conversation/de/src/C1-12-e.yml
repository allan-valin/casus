id: C1-12-e
tracks: [en]
protagonist: m
title: ["Choosing a school"]
situation: ["Tim's son is in year four. Next year: Gymnasium or Oberschule? Tim is worried — and explains the system to you."]
learn: [c1-extended-attributes]
culture: Early school sorting
items:
  - [die-bildungsempfehlung, "die Bildungsempfehlung", "the school recommendation", {rare: true}]
  - [das-gymnasium, "das Gymnasium", "academic secondary school"]
  - [die-oberschule, "die Oberschule", "general secondary school (Saxony)", {rare: true}]
  - [das-elterngespraech, "das Elterngespräch", "the parent–teacher meeting", {rare: true}]
  - [der-notendurchschnitt, "der Notendurchschnitt", "the grade average"]
  - [die-vierte-klasse, "die vierte Klasse", "year four"]
  - [die-durchlaessigkeit, "die Durchlässigkeit", "the possibility of switching", {rare: true}]
  - [die-von-der-schule-ausgestellte, "die von der Schule ausgestellte …", "the … issued by the school"]
  - [das-abitur-spaeter, "das Abitur später nachholen", "do the Abitur later"]
  - [der-druck, "der Druck", "the pressure"]
dialogue:
  - [tim, "Mein Sohn ist in der vierten Klasse. Morgen ist das Elterngespräch.", "My son is in year four. Tomorrow is the parent–teacher meeting."]
  - [protagonist, "Mit zehn schon? Worum geht es?", "At ten already? What's it about?"]
  - [tim, "Um die von der Schule ausgestellte Bildungsempfehlung: Gymnasium oder Oberschule.", "About the school recommendation issued by the school: Gymnasium or Oberschule."]
  - [protagonist, "Und wovon hängt das ab?", "And what does it depend on?"]
  - [tim, "Vom Notendurchschnitt in Deutsch, Mathe und Sachkunde. Der Druck ist enorm.", "On the grade average in German, maths and general studies. The pressure is enormous."]
  - [protagonist, "Bei uns entscheidet man das viel später.", "Where I'm from that's decided much later."]
  - [tim, "Ich weiß. Aber es gibt Durchlässigkeit: Man kann später wechseln oder das Abitur nachholen.", "I know. But you can switch: you can change school later or do the Abitur afterwards."]
  - [protagonist, "Dann ist die heute getroffene Entscheidung nicht für immer.", "Then the decision made today isn't for ever."]
teach:
  - ask: ["He says: my son is in year four.", "Mein Sohn ist in der vierten Klasse.", die-vierte-klasse]
  - ask: ["Say: the parent–teacher meeting.", "Das Elterngespräch.", das-elterngespraech]
  - note: ["Extended attributes again: «die von der Schule ausgestellte Bildungsempfehlung» (= the recommendation that the school issues), «die heute getroffene Entscheidung» (= the decision that is made today)."]
  - ask: ["Say: the recommendation issued by the school.", "Die von der Schule ausgestellte Bildungsempfehlung.", die-von-der-schule-ausgestellte, die-bildungsempfehlung]
  - ask: ["Say: Gymnasium or Oberschule.", "Gymnasium oder Oberschule.", das-gymnasium, die-oberschule]
  - ask: ["Say: the grade average.", "Der Notendurchschnitt.", der-notendurchschnitt]
  - ask: ["Say: the pressure is enormous.", "Der Druck ist enorm.", der-druck]
  - ask: ["Say: you can switch later.", "Es gibt Durchlässigkeit.", die-durchlaessigkeit]
  - ask: ["Say: do the Abitur later.", "Das Abitur später nachholen.", das-abitur-spaeter]
  - note: ["In most states children are sorted after year four (age ten): Gymnasium leads to the Abitur, other schools to vocational paths. The recommendation rests on grades; how binding it is depends on the state. Changing later is possible, and the Abitur can be done afterwards — the early sorting surprises most newcomers."]
