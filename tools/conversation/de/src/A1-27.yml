id: A1-27
protagonist: f
title: ["The house and its materials", "البيت ومواده", "Куќата и материјалите"]
situation:
  - "Your flat is in an old building from 1905. Frau Becker explains why it stays warm."
  - "شقتكِ في مبنى قديم من عام 1905. السيدة بيكر تشرح لماذا يبقى دافئًا."
  - "Станот ви е во стара зграда од 1905. Госпоѓа Бекер објаснува зошто останува топол."
learn: [a1-adjectives]
culture: Altbau and Neubau
items:
  - [der-altbau, "der Altbau", "the old building", "المبنى القديم", "старата зграда", {rare: true}]
  - [der-neubau, "der Neubau", "the new building", "المبنى الجديد", "новоградбата", {rare: true}]
  - [aus-stein, "aus Stein", "made of stone", "من الحجر", "од камен"]
  - [aus-holz, "aus Holz", "made of wood", "من الخشب", "од дрво"]
  - [dick, "dick", "thick", "سميك", "дебел"]
  - [die-waende, "die Wände", "the walls", "الجدران", "ѕидовите"]
  - [hoch, "hoch", "high", "عالٍ", "висок"]
  - [die-decke, "die Decke", "the ceiling", "السقف", "таванот"]
  - [die-daemmung, "die Dämmung", "the insulation", "العزل", "изолацијата", {rare: true}]
  - [doppelte-fenster, "doppelte Fenster", "double-glazed windows", "نوافذ مزدوجة", "двојни прозорци"]
  - [modern, "modern", "modern", "حديث", "модерен"]
dialogue:
  - [becker, "Das Haus ist von 1905. Ein Altbau.", "The house is from 1905. An old building.", "البيت من عام 1905. مبنى قديم.", "Куќата е од 1905. Стара зграда."]
  - [protagonist, "Darum sind die Decken so hoch!", "That's why the ceilings are so high!", "لهذا السقوف عالية جدًا!", "Затоа таваните се толку високи!"]
  - [becker, "Genau. Und die Wände sind aus Stein, sehr dick.", "Exactly. And the walls are stone, very thick.", "بالضبط. والجدران من الحجر، سميكة جدًا.", "Точно. А ѕидовите се од камен, многу дебели."]
  - [protagonist, "Und der Boden ist aus Holz.", "And the floor is wood.", "والأرضية من الخشب.", "А подот е од дрво."]
  - [becker, "Ja, alt, aber schön. Im Winter ist es warm, im Sommer kühl.", "Yes, old, but lovely. In winter it's warm, in summer cool.", "نعم، قديمة لكنها جميلة. في الشتاء دافئ وفي الصيف بارد.", "Да, стар, но убав. Во зима е топло, во лето свежо."]
  - [protagonist, "Mein Freund wohnt in einem Neubau.", "My friend lives in a new building.", "صديقي يسكن في مبنى جديد.", "Мојот пријател живее во новоградба."]
  - [becker, "Neubauten sind modern, mit Dämmung und doppelten Fenstern.", "New buildings are modern, with insulation and double glazing.", "المباني الجديدة حديثة، فيها عزل ونوافذ مزدوجة.", "Новоградбите се модерни, со изолација и двојни прозорци."]
  - [protagonist, "Und was ist besser?", "And which is better?", "وأيّهما أفضل؟", "А што е подобро?"]
  - [becker, "Altbau ist schöner. Neubau ist billiger zu heizen.", "Old buildings are nicer. New ones are cheaper to heat.", "المبنى القديم أجمل. والجديد تدفئته أرخص.", "Старата е поубава. Новата е поевтина за греење."]
teach:
  - ask: ["Say: an old building.", "قولي: مبنى قديم.", "Кажете: стара зграда.", "Ein Altbau.", der-altbau]
  - ask: ["Say: the ceilings are so high!", "قولي: السقوف عالية جدًا!", "Кажете: таваните се толку високи!", "Die Decken sind so hoch!", die-decke, hoch]
  - ask: ["Say: the walls are stone, very thick.", "قولي: الجدران من الحجر، سميكة جدًا.", "Кажете: ѕидовите се од камен, многу дебели.", "Die Wände sind aus Stein, sehr dick.", die-waende, aus-stein, dick]
  - ask: ["Say: the floor is wood.", "قولي: الأرضية من الخشب.", "Кажете: подот е од дрво.", "Der Boden ist aus Holz.", aus-holz]
  - note: ["«aus» says what something is made of: «aus Stein», «aus Holz», «aus Glas».", "«aus» تدل على المادة: «aus Stein» (من الحجر)، «aus Holz» (من الخشب)، «aus Glas» (من الزجاج).", "«aus» кажува од што е нешто: «aus Stein», «aus Holz», «aus Glas»."]
  - ask: ["Say: a new building.", "قولي: مبنى جديد.", "Кажете: новоградба.", "Ein Neubau.", der-neubau]
  - ask: ["Say: with insulation.", "قولي: مع العزل.", "Кажете: со изолација.", "Mit Dämmung.", die-daemmung]
  - ask: ["Say: double-glazed windows.", "قولي: نوافذ مزدوجة.", "Кажете: двојни прозорци.", "Doppelte Fenster.", doppelte-fenster]
  - ask: ["Say: modern.", "قولي: حديث.", "Кажете: модерно.", "Modern.", modern]
  - note: ["«Altbau» flats (built before about 1950) have high ceilings, wooden floors and thick walls; «Neubau» flats are insulated and cheaper to heat. Many Germans love the Altbau — and its creaking floors.", "شقق «Altbau» (المبنية قبل 1950 تقريبًا) سقوفها عالية وأرضياتها خشبية وجدرانها سميكة؛ وشقق «Neubau» معزولة وتدفئتها أرخص. كثير من الألمان يحبون الـAltbau — وصرير أرضياته.", "Становите «Altbau» (градени пред околу 1950) имаат високи тавани, дрвени подови и дебели ѕидови; «Neubau» се изолирани и поевтини за греење. Многу Германци го сакаат Altbau — и подот што крцка."]
