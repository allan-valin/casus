id: B2-04-m
tracks: [mk]
protagonist: m
title: ["Признавањето на дипломата"]
situation: ["Петар ви раскажува како неговата диплома од Скопје била признаена — и што работел дотогаш."]
learn: [b2-passive-past]
culture: Overqualified
items:
  - [die-anerkennung-m, "die Anerkennung", "признавањето"]
  - [wurde-anerkannt, "wurde anerkannt", "беше признаена"]
  - [wurde-uebersetzt, "wurde übersetzt", "беше преведена"]
  - [das-diplom, "das Diplom", "дипломата"]
  - [ueberqualifiziert, "überqualifiziert", "преквалификуван"]
  - [im-lager, "im Lager", "во магацин"]
  - [die-erste-stelle, "die erste Stelle", "првата работа"]
  - [stolz-auf-dich, "stolz auf dich", "горд на тебе"]
  - [die-geduld, "die Geduld", "трпението"]
  - [zwei-jahre-lang, "zwei Jahre lang", "две години"]
dialogue:
  - [protagonist, "Petar, wie war das damals mit deinem Diplom?", "Петре, како беше тогаш со твојата диплома?"]
  - [petar, "Zuerst wurde alles übersetzt und beglaubigt. Dann wurde mein Diplom mit einem deutschen verglichen.", "Прво сè беше преведено и заверено. Потоа мојата диплома беше споредена со германска."]
  - [protagonist, "Und es wurde anerkannt?", "И беше признаена?"]
  - [petar, "Ja, aber das dauerte. Zwei Jahre lang arbeitete ich im Lager.", "Да, но траеше. Две години работев во магацин."]
  - [protagonist, "Ein Ingenieur im Lager!", "Инженер во магацин!"]
  - [petar, "Ich war überqualifiziert. Aber ich lernte dort Deutsch.", "Бев преквалификуван. Но таму научив германски."]
  - [protagonist, "Und die erste Stelle als Ingenieur?", "А првата работа како инженер?"]
  - [petar, "Kam mit der Geduld. Und mit Anja, die meine Bewerbungen korrigiert hat.", "Дојде со трпение. И со Ања, која ми ги поправаше пријавите."]
  - [protagonist, "Ich bin stolz auf dich, Sohn.", "Горд сум на тебе, сине."]
teach:
  - ask: ["Прашајте: како беше со твојата диплома?", "Wie war das mit deinem Diplom?", das-diplom]
  - note: ["Пасив во минато: «wurde» + партицип. «Alles wurde übersetzt» (беше преведено), «Mein Diplom wurde anerkannt» (беше признаена)."]
  - ask: ["Тој вели: сè беше преведено.", "Alles wurde übersetzt.", wurde-uebersetzt]
  - ask: ["Прашајте: и беше признаена?", "Und es wurde anerkannt?", wurde-anerkannt]
  - ask: ["Кажете: признавањето.", "Die Anerkennung.", die-anerkennung-m]
  - ask: ["Тој вели: две години работев во магацин.", "Zwei Jahre lang arbeitete ich im Lager.", zwei-jahre-lang, im-lager]
  - ask: ["Тој вели: бев преквалификуван.", "Ich war überqualifiziert.", ueberqualifiziert]
  - ask: ["Прашајте: а првата работа?", "Und die erste Stelle?", die-erste-stelle]
  - ask: ["Тој вели: со трпение.", "Mit der Geduld.", die-geduld]
  - ask: ["Кажете: горд сум на тебе.", "Ich bin stolz auf dich.", stolz-auf-dich]
  - note: ["Многу луѓе со диплома првите години работат далеку под своето образование, додека дипломата се признава и германскиот се подобрува. За регулирани професии (медицина, нега, учителство) признавањето е задолжително; за инженери обично доволно е споредување на дипломата."]
