id: C2-09
protagonist: f
title: ["Idioms", "التعابير الاصطلاحية", "Идиоми"]
situation:
  - "Jonas speaks almost only in idioms tonight. You decode them — and try a few yourself, at the right moment."
  - "يوناس يتكلّم الليلة بالتعابير الاصطلاحية فقط تقريبًا. تفكّين شيفرتها — وتجرّبين بعضها بنفسكِ، في اللحظة المناسبة."
  - "Јонас вечерва зборува речиси само во идиоми. Ги дешифрирате — и самите пробувате неколку, во вистинскиот момент."
learn: [c2-idioms]
culture: Using idioms well
items:
  - [da-steppt-der-baer, "Da steppt der Bär", "It's buzzing there (a great party)", "هناك حفلة صاخبة", "Таму е луда журка"]
  - [nur-bahnhof, "Ich verstehe nur Bahnhof", "It's all Greek to me", "لا أفهم شيئًا", "Ништо не разбирам"]
  - [nicht-mein-bier, "Das ist nicht mein Bier", "That's not my business", "ليس هذا من شأني", "Тоа не е моја работа"]
  - [daumen-druecken, "Ich drücke dir die Daumen", "I'll keep my fingers crossed for you", "أتمنّى لكِ التوفيق", "Ќе ти стискам палци"]
  - [tomaten-auf-den-augen, "Tomaten auf den Augen haben", "be blind to something obvious", "لا يرى الواضح", "да не гледаш очигледно"]
  - [den-nagel-auf-den-kopf, "den Nagel auf den Kopf treffen", "hit the nail on the head", "يصيب كبد الحقيقة", "погодува во десетка"]
  - [ins-fettnaepfchen, "ins Fettnäpfchen treten", "put your foot in it", "يرتكب زلّة محرجة", "згазува во лајно (прави гаф)"]
  - [hals-und-beinbruch, "Hals- und Beinbruch!", "Break a leg!", "بالتوفيق! (حرفيًا: كسر العنق والساق)", "Среќно! (буквално: скршен врат и нога)"]
  - [die-redewendung, "die Redewendung", "the idiom", "التعبير الاصطلاحي", "идиомот"]
  - [im-richtigen-moment, "im richtigen Moment", "at the right moment", "في اللحظة المناسبة", "во вистинскиот момент"]
dialogue:
  - [jonas, "Gehst du heute zum Sommerfest? Da steppt der Bär!", "Are you going to the summer party today? It'll be buzzing!", "هل ستذهبين اليوم إلى حفلة الصيف؟ ستكون صاخبة!", "Одиш ли денес на летната забава? Таму е луда журка!"]
  - [protagonist, "Ein Bär? Ich verstehe nur Bahnhof.", "A bear? It's all Greek to me.", "دبّ؟ لا أفهم شيئًا.", "Мечка? Ништо не разбирам."]
  - [jonas, "Ha! Du kannst es ja schon. „Da steppt der Bär“ heißt: Da ist viel los.", "Ha! You can already do it. 'Da steppt der Bär' means: there's a lot going on.", "ها! أنتِ تجيدينها بالفعل. «Da steppt der Bär» تعني: هناك الكثير من الحركة.", "Ха! Веќе знаеш. „Da steppt der Bär“ значи: таму има многу живост."]
  - [protagonist, "Und Paul? Er hat gestern der Chefin gesagt, sie sehe müde aus.", "And Paul? Yesterday he told the boss she looked tired.", "وباول؟ أمس قال للمديرة إنها تبدو متعبة.", "А Паул? Вчера ѝ рекол на шефицата дека изгледа уморно."]
  - [jonas, "Da ist er voll ins Fettnäpfchen getreten. Aber das ist nicht mein Bier.", "He really put his foot in it there. But that's not my business.", "لقد ارتكب زلّة محرجة تمامًا. لكن ليس هذا من شأني.", "Таму баш направил гаф. Но тоа не е моја работа."]
  - [protagonist, "Morgen habe ich meine Prüfung für den Trainerschein.", "Tomorrow I have my exam for the coaching licence.", "غدًا لديّ امتحان رخصة التدريب.", "Утре го имам испитот за тренерската лиценца."]
  - [jonas, "Dann drücke ich dir die Daumen! Hals- und Beinbruch!", "Then I'll keep my fingers crossed! Break a leg!", "إذن أتمنّى لكِ التوفيق! بالتوفيق!", "Тогаш ти стискам палци! Среќно!"]
  - [protagonist, "Danke. Du hast mit dem Bären übrigens den Nagel auf den Kopf getroffen — ich komme!", "Thanks. And you hit the nail on the head with the bear, by the way — I'm coming!", "شكرًا. وبالمناسبة أصبتَ كبد الحقيقة مع الدبّ — سآتي!", "Благодарам. Патем, со мечката погоди во десетка — доаѓам!"]
teach:
  - ask: ["Say: it'll be buzzing there!", "قولي: ستكون حفلة صاخبة!", "Кажете: таму ќе е луда журка!", "Da steppt der Bär!", da-steppt-der-baer]
  - ask: ["Say: it's all Greek to me.", "قولي: لا أفهم شيئًا.", "Кажете: ништо не разбирам.", "Ich verstehe nur Bahnhof.", nur-bahnhof]
  - note: ["Idioms only work at the right moment and in the right register: «Da steppt der Bär» and «nicht mein Bier» are casual — use them with friends, never in a letter. Learn them in a situation, not in lists.", "التعابير الاصطلاحية لا تنجح إلا في اللحظة والأسلوب المناسبين: «Da steppt der Bär» و«nicht mein Bier» عامية — استعمليها مع الأصدقاء، لا في رسالة أبدًا. تعلّميها في موقف، لا في قوائم.", "Идиомите функционираат само во вистинскиот момент и регистар: «Da steppt der Bär» и «nicht mein Bier» се разговорни — користете ги со пријатели, никогаш во писмо. Учете ги во ситуација, не од листи."]
  - ask: ["Say: he put his foot in it.", "قولي: ارتكب زلّة محرجة.", "Кажете: направи гаф.", "Er ist ins Fettnäpfchen getreten.", ins-fettnaepfchen]
  - ask: ["Say: that's not my business.", "قولي: ليس هذا من شأني.", "Кажете: тоа не е моја работа.", "Das ist nicht mein Bier.", nicht-mein-bier]
  - ask: ["Say: I'll keep my fingers crossed.", "قولي: أتمنّى لكَ التوفيق.", "Кажете: ќе ти стискам палци.", "Ich drücke dir die Daumen.", daumen-druecken]
  - ask: ["Wish: break a leg!", "تمنّي: بالتوفيق!", "Посакајте: среќно!", "Hals- und Beinbruch!", hals-und-beinbruch]
  - ask: ["Say: you hit the nail on the head.", "قولي: أصبتَ كبد الحقيقة.", "Кажете: погоди во десетка.", "Du hast den Nagel auf den Kopf getroffen.", den-nagel-auf-den-kopf]
  - ask: ["Say: you're blind to the obvious.", "قولي: لا ترى الواضح.", "Кажете: не го гледаш очигледното.", "Du hast Tomaten auf den Augen.", tomaten-auf-den-augen]
  - ask: ["Say: an idiom, at the right moment.", "قولي: تعبير اصطلاحي، في اللحظة المناسبة.", "Кажете: идиом, во вистинскиот момент.", "Eine Redewendung im richtigen Moment.", die-redewendung, im-richtigen-moment]
  - note: ["A few well-placed idioms make your German sound natural; too many sound learned from a book. Some have surprising images (dancing bears, fat pots, tomatoes on your eyes) — and many have equivalents in your own language worth comparing.", "بضعة تعابير اصطلاحية في مكانها تجعل ألمانيتكِ طبيعية؛ والكثير منها يبدو محفوظًا من كتاب. بعضها له صور مفاجئة (دببة ترقص، أواني دهن، طماطم على العيون) — وكثير منها له مقابلات في لغتكِ تستحق المقارنة.", "Неколку добро поставени идиоми прават германскиот да звучи природно; премногу звучат научено од книга. Некои имаат изненадувачки слики (мечки што танцуваат, тенџериња со маст, домати на очите) — а многу имаат еквиваленти на вашиот јазик што вреди да се споредат."]
