id: A2-22-m
tracks: [mk]
protagonist: m
title: ["Покана од пријателите"]
situation: ["Родителите на Ања ве канат на ручек во нивниот дом. Што да донесете?"]
learn: [a2-sollen]
culture: What to bring
items:
  - [die-einladung-m, "die Einladung", "поканата"]
  - [zum-mittagessen, "zum Mittagessen", "на ручек"]
  - [sollen-wir, "Sollen wir …?", "Дали да …?"]
  - [etwas-mitbringen, "etwas mitbringen", "да донесеме нешто"]
  - [einen-wein, "einen Wein", "едно вино"]
  - [ajvar-glas, "ein Glas Ajvar", "тегла ајвар"]
  - [selbst-gemacht-m, "selbst gemacht", "домашен"]
  - [das-ist-zu-viel, "Das ist zu viel", "Тоа е премногу"]
  - [wir-kommen-gern, "Wir kommen gern", "Доаѓаме со задоволство"]
  - [um-zwoelf, "um zwölf", "во дванаесет"]
dialogue:
  - [frauwolf, "Wir möchten Sie zum Mittagessen einladen. Am Sonntag um zwölf.", "Сакаме да ве поканиме на ручек. Во недела во дванаесет."]
  - [protagonist, "Danke für die Einladung! Wir kommen gern.", "Благодарам за поканата! Доаѓаме со задоволство."]
  - [protagonist, "Sollen wir etwas mitbringen?", "Да донесеме ли нешто?"]
  - [frauwolf, "Nicht nötig!", "Не е потребно!"]
  - [protagonist, "Wir bringen einen Wein. Und ein Glas Ajvar — selbst gemacht.", "Ќе донесеме едно вино. И тегла ајвар — домашен."]
  - [herrwolf, "Ajvar? Was ist das?", "Ајвар? Што е тоа?"]
  - [protagonist, "Eine Paprikacreme aus Mazedonien. Sehr lecker!", "Намаз од пиперки од Македонија. Многу вкусно!"]
  - [frauwolf, "Das ist zu viel! Aber wir freuen uns sehr.", "Тоа е премногу! Но многу се радуваме."]
teach:
  - ask: ["Заблагодарете за поканата.", "Danke für die Einladung!", die-einladung-m]
  - ask: ["Кажете: на ручек.", "Zum Mittagessen.", zum-mittagessen]
  - ask: ["Кажете: во дванаесет.", "Um zwölf.", um-zwoelf]
  - note: ["«sollen» прашува што сака другиот да направите: «Sollen wir etwas mitbringen?» — да донесеме ли нешто?"]
  - ask: ["Прашајте: да донесеме ли нешто?", "Sollen wir etwas mitbringen?", sollen-wir, etwas-mitbringen]
  - ask: ["Кажете: ќе донесеме едно вино.", "Wir bringen einen Wein.", einen-wein]
  - ask: ["Кажете: тегла ајвар.", "Ein Glas Ajvar.", ajvar-glas]
  - ask: ["Кажете: домашен.", "Selbst gemacht.", selbst-gemacht-m]
  - ask: ["Таа вели: тоа е премногу!", "Das ist zu viel!", das-ist-zu-viel]
  - ask: ["Кажете: доаѓаме со задоволство.", "Wir kommen gern.", wir-kommen-gern]
  - note: ["„Не е потребно“ кај Германците обично значи токму тоа. Едно вино или нешто домашно од Македонија е убав подарок — но не цела торба храна."]
