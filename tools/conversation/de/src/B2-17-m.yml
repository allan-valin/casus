id: B2-17-m
tracks: [mk]
protagonist: m
title: ["Платниот лист на синот"]
situation: ["Петар ви го покажува својот платен лист. Зошто нето е толку помалку од бруто?"]
learn: [de-b2-genitive-prepositions]
culture: Before you see your money
items:
  - [die-lohnabrechnung, "die Lohnabrechnung", "платниот лист", {rare: true}]
  - [brutto, "brutto", "бруто"]
  - [netto, "netto", "нето"]
  - [die-lohnsteuer, "die Lohnsteuer", "данокот на плата", {rare: true}]
  - [die-krankenversicherung, "die Krankenversicherung", "здравственото осигурување"]
  - [die-rentenversicherung, "die Rentenversicherung", "пензиското осигурување", {rare: true}]
  - [der-arbeitgeberanteil, "der Arbeitgeberanteil", "делот на работодавачот", {rare: true}]
  - [abzueglich, "abzüglich", "минус, одбиено (+ генитив)"]
  - [aufgrund, "aufgrund", "поради (+ генитив)"]
  - [waehrend-gen, "während", "за време на (+ генитив)"]
  - [die-abgaben, "die Abgaben", "давачките"]
dialogue:
  - [protagonist, "Petar, das ist dein Gehalt? Brutto viel — netto viel weniger!", "Петре, ова ти е платата? Бруто многу — нето многу помалку!"]
  - [petar, "Ja, Papa. Abzüglich der Steuern und Abgaben bleibt etwa die Hälfte.", "Да, тато. Одбиено даноците и давачките, останува околу половина."]
  - [protagonist, "Die Hälfte! Warum?", "Половина! Зошто?"]
  - [petar, "Aufgrund der Steuerklasse zahle ich Lohnsteuer. Dann Kranken-, Pflege-, Renten- und Arbeitslosenversicherung.", "Поради даночната класа плаќам данок на плата. Потоа здравствено, за нега, пензиско и осигурување за невработеност."]
  - [anja, "Und Kirchensteuer zahlt er nicht, weil er orthodox ist.", "А црковен данок не плаќа, затоа што е православен."]
  - [protagonist, "Bei uns war das anders.", "Кај нас беше поинаку."]
  - [petar, "Dafür zahlt der Arbeitgeber noch einmal fast so viel dazu — den Arbeitgeberanteil. Und während der Krankheit bin ich versichert.", "Затоа работодавачот доплаќа речиси исто толку — делот на работодавачот. А за време на болест сум осигурен."]
  - [protagonist, "Und die Rentenversicherung — die bekommst du später zurück?", "А пензиското осигурување — ќе го добиеш назад подоцна?"]
  - [petar, "Als Rente, ja. Hoffentlich.", "Како пензија, да. Се надевам."]
teach:
  - ask: ["Кажете: платниот лист.", "Die Lohnabrechnung.", die-lohnabrechnung]
  - ask: ["Кажете: бруто и нето.", "Brutto und netto.", brutto, netto]
  - note: ["Некои предлози бараат генитив, главно во пишан германски: «abzüglich der Steuern» (одбиено даноците), «aufgrund der Steuerklasse» (поради), «während der Krankheit» (за време на)."]
  - ask: ["Кажете: одбиено даноците и давачките.", "Abzüglich der Steuern und Abgaben.", abzueglich, die-abgaben]
  - ask: ["Кажете: поради даночната класа.", "Aufgrund der Steuerklasse.", aufgrund]
  - ask: ["Кажете: данок на плата.", "Die Lohnsteuer.", die-lohnsteuer]
  - ask: ["Кажете: здравственото осигурување.", "Die Krankenversicherung.", die-krankenversicherung]
  - ask: ["Кажете: пензиското осигурување.", "Die Rentenversicherung.", die-rentenversicherung]
  - ask: ["Кажете: делот на работодавачот.", "Der Arbeitgeberanteil.", der-arbeitgeberanteil]
  - ask: ["Кажете: за време на болест.", "Während der Krankheit.", waehrend-gen]
  - note: ["Од третина до речиси половина од бруто платата заминува пред да ја видите: данок на плата (според даночната класа), понекогаш Soli и црковен данок, и четирите социјални осигурувања; работодавачот доплаќа речиси ист дел од осигурувањата. Црковен данок плаќаат само членовите на цркви што го наплаќаат — православните цркви речиси никогаш. (Без износи: стапките се менуваат секоја година.)"]
