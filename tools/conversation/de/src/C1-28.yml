id: C1-28
protagonist: m
title: ["A talk", "محاضرة", "Предавање"]
situation:
  - "Professor Hartmann has asked you to give a talk at the VHS: 'How I learned German'. Twenty minutes, forty listeners."
  - "طلب منك البروفيسور هارتمان أن تلقي محاضرة في الجامعة الشعبية: «كيف تعلّمتُ الألمانية». عشرون دقيقة، أربعون مستمعًا."
  - "Професорот Хартман ве замоли да одржите предавање на народниот универзитет: „Како научив германски“. Дваесет минути, четириесет слушатели."
learn: [c1-extended-attributes]
culture: —
items:
  - [der-vortrag, "der Vortrag", "the talk, lecture", "المحاضرة", "предавањето"]
  - [das-publikum, "das Publikum", "the audience", "الجمهور", "публиката"]
  - [die-erfahrung-c1, "meine Erfahrungen", "my experiences", "تجاربي", "моите искуства"]
  - [die-von-mir-gemachten, "die von mir gemachten Fehler", "the mistakes I made", "الأخطاء التي ارتكبتُها", "грешките што ги направив"]
  - [das-am-anfang-gelernte, "das am Anfang Gelernte", "what was learned at the start", "ما تعلّمته في البداية", "наученото на почетокот"]
  - [die-wichtigste-erkenntnis, "die wichtigste Erkenntnis", "the most important insight", "أهم استنتاج", "најважниот увид"]
  - [anschaulich, "anschaulich", "vivid, illustrative", "واضح بالأمثلة", "сликовито"]
  - [die-fragerunde, "die Fragerunde", "the question round", "جولة الأسئلة", "кругот прашања", {rare: true}]
  - [lampenfieber, "das Lampenfieber", "stage fright", "رهبة المسرح", "тремата", {rare: true}]
  - [zum-abschluss, "zum Abschluss", "to conclude", "في الختام", "за крај"]
dialogue:
  - [protagonist, "Guten Abend. Mein Thema: wie ich Deutsch gelernt habe — mit allen von mir gemachten Fehlern.", "Good evening. My topic: how I learned German — with all the mistakes I made.", "مساء الخير. موضوعي: كيف تعلّمتُ الألمانية — بكل الأخطاء التي ارتكبتُها.", "Добровечер. Мојата тема: како научив германски — со сите грешки што ги направив."]
  - [protagonist, "Das am Anfang Gelernte war einfach: „Danke“, „Entschuldigung“, „Ich verstehe nicht“.", "What I learned at the start was simple: 'Thank you', 'Sorry', 'I don't understand'.", "ما تعلّمته في البداية كان بسيطًا: «شكرًا»، «عذرًا»، «لا أفهم».", "Наученото на почетокот беше едноставно: „Благодарам“, „Извинете“, „Не разбирам“."]
  - [protagonist, "Mein peinlichster Fehler: Ich sagte zu meiner Vermieterin „Ich bin heiß“ statt „Mir ist heiß“.", "My most embarrassing mistake: I said to my landlady 'I'm hot' (sexy) instead of 'I feel hot'.", "أكثر أخطائي إحراجًا: قلتُ لمؤجِّرتي «أنا مثير» بدلًا من «أشعر بالحر».", "Мојата најнепријатна грешка: ѝ реков на станодавката „Јас сум жешка личност“ наместо „Ми е жешко“."]
  - [hartmann, "(Lachen im Publikum)", "(Laughter in the audience)", "(ضحك في الجمهور)", "(Смеа во публиката)"]
  - [protagonist, "Die wichtigste Erkenntnis: Fehler sind kein Problem. Schweigen schon.", "The most important insight: mistakes aren't a problem. Silence is.", "أهم استنتاج: الأخطاء ليست مشكلة. الصمت هو المشكلة.", "Најважниот увид: грешките не се проблем. Молчењето е."]
  - [protagonist, "Zum Abschluss: Sprechen Sie mit allen — mit Nachbarn, im Verein, an der Kasse. Vielen Dank!", "To conclude: talk to everyone — neighbours, at the club, at the checkout. Thank you very much!", "في الختام: تحدّثوا مع الجميع — مع الجيران، في النادي، عند الصندوق. شكرًا جزيلًا!", "За крај: зборувајте со сите — со соседите, во клубот, на каса. Ви благодарам!"]
  - [hartmann, "Sehr anschaulich! Jetzt die Fragerunde. Hatten Sie Lampenfieber?", "Very vivid! Now the question round. Did you have stage fright?", "واضح جدًا بالأمثلة! والآن جولة الأسئلة. هل شعرت برهبة المسرح؟", "Многу сликовито! Сега кругот прашања. Дали имавте трема?"]
  - [protagonist, "Furchtbar! Aber auf Deutsch habe ich es geschafft.", "Terribly! But I managed it in German.", "بشدة! لكنني نجحتُ بالألمانية.", "Страшна! Но успеав на германски."]
teach:
  - ask: ["Say: the talk.", "قل: المحاضرة.", "Кажете: предавањето.", "Der Vortrag.", der-vortrag]
  - note: ["Extended attributes in a talk: «die von mir gemachten Fehler» (= the mistakes that I made), «das am Anfang Gelernte» (= what was learned at the beginning — a participle used as a noun).", "الصفات الممتدة في محاضرة: «die von mir gemachten Fehler» (= الأخطاء التي ارتكبتُها)، «das am Anfang Gelernte» (= ما تعلّمته في البداية — اسم مفعول مستعمل اسمًا).", "Проширени атрибути во предавање: «die von mir gemachten Fehler» (= грешките што ги направив), «das am Anfang Gelernte» (= наученото на почетокот — партицип употребен како именка)."]
  - ask: ["Say: with all the mistakes I made.", "قل: بكل الأخطاء التي ارتكبتُها.", "Кажете: со сите грешки што ги направив.", "Mit allen von mir gemachten Fehlern.", die-von-mir-gemachten]
  - ask: ["Say: what I learned at the start.", "قل: ما تعلّمته في البداية.", "Кажете: наученото на почетокот.", "Das am Anfang Gelernte.", das-am-anfang-gelernte]
  - ask: ["Say: my experiences.", "قل: تجاربي.", "Кажете: моите искуства.", "Meine Erfahrungen.", die-erfahrung-c1]
  - ask: ["Say: the most important insight.", "قل: أهم استنتاج.", "Кажете: најважниот увид.", "Die wichtigste Erkenntnis.", die-wichtigste-erkenntnis]
  - ask: ["Say: to conclude.", "قل: في الختام.", "Кажете: за крај.", "Zum Abschluss.", zum-abschluss]
  - ask: ["Say: laughter in the audience.", "قل: ضحك في الجمهور.", "Кажете: смеа во публиката.", "Lachen im Publikum.", das-publikum]
  - ask: ["He says: very vivid!", "يقول: واضح جدًا بالأمثلة!", "Тој вели: многу сликовито!", "Sehr anschaulich!", anschaulich]
  - ask: ["Say: the question round.", "قل: جولة الأسئلة.", "Кажете: кругот прашања.", "Die Fragerunde.", die-fragerunde]
  - ask: ["Ask: did you have stage fright?", "اسأل: هل شعرت برهبة المسرح؟", "Прашајте: дали имавте трема?", "Hatten Sie Lampenfieber?", lampenfieber]
  - note: ["«Mir ist heiß» means 'I feel hot'; «Ich bin heiß» means 'I'm sexy' — a classic learner's mistake, like «Ich bin kalt» (I'm a cold person) for «Mir ist kalt». Telling your own mistakes is the fastest way to win an audience.", "«Mir ist heiß» تعني «أشعر بالحر»؛ و«Ich bin heiß» تعني «أنا مثير» — خطأ كلاسيكي للمتعلّمين، مثل «Ich bin kalt» (أنا شخص بارد) بدلًا من «Mir ist kalt». ورواية أخطائك هي أسرع طريق لكسب الجمهور.", "«Mir ist heiß» значи „ми е жешко“; «Ich bin heiß» значи „јас сум секси“ — класична грешка на учениците, како «Ich bin kalt» (јас сум ладна личност) наместо «Mir ist kalt». Раскажувањето на сопствените грешки е најбрзиот начин да ја освоите публиката."]
