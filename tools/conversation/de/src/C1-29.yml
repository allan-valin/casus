id: C1-29
protagonist: f
title: ["The course exam", "امتحان الدورة", "Испитот на курсот"]
situation:
  - "The C1 exam at the VHS: writing, reading, listening — and the oral part. Afterwards, the results."
  - "امتحان C1 في الجامعة الشعبية: كتابة وقراءة واستماع — والجزء الشفهي. ثم النتائج."
  - "Испитот C1 на народниот универзитет: пишување, читање, слушање — и усниот дел. Потоа резултатите."
learn: [de-c1-nominal-genitive, de-c1-funktionsverbgefuege]
culture: Certificates that count
items:
  - [die-pruefung-c1, "die Prüfung", "the exam", "الامتحان", "испитот"]
  - [bestehen, "bestehen", "pass (an exam)", "ينجح في", "положува"]
  - [die-muendliche-pruefung, "die mündliche Prüfung", "the oral exam", "الامتحان الشفهي", "усниот испит"]
  - [die-schriftliche-pruefung, "der schriftliche Teil", "the written part", "الجزء الكتابي", "писмениот дел"]
  - [die-beherrschung, "die Beherrschung der Sprache", "command of the language", "إتقان اللغة", "владеењето на јазикот"]
  - [das-zertifikat, "das Zertifikat", "the certificate", "الشهادة", "сертификатот"]
  - [die-bewertung, "die Bewertung", "the assessment, mark", "التقييم", "оценувањето"]
  - [die-vorbereitung, "die Vorbereitung", "the preparation", "التحضير", "подготовката"]
  - [durchfallen, "durchfallen", "fail (an exam)", "يرسب", "паѓа (на испит)"]
  - [mit-auszeichnung, "mit Auszeichnung", "with distinction", "بامتياز", "со одлика"]
  - [die-anerkennung-zertifikat, "die Anerkennung des Zertifikats", "the recognition of the certificate", "الاعتراف بالشهادة", "признавањето на сертификатот"]
dialogue:
  - [hartmann, "Die mündliche Prüfung beginnt. Bitte stellen Sie sich kurz vor.", "The oral exam begins. Please introduce yourself briefly.", "يبدأ الامتحان الشفهي. قدّمي نفسكِ باختصار من فضلكِ.", "Усниот испит почнува. Ве молам накратко претставете се."]
  - [protagonist, "Gern. Seit fünf Jahren lebe ich in Leipzig. Die Vorbereitung auf diese Prüfung war intensiv.", "Gladly. I've lived in Leipzig for five years. The preparation for this exam was intensive.", "بكل سرور. أعيش في لايبزيغ منذ خمس سنوات. التحضير لهذا الامتحان كان مكثّفًا.", "Со задоволство. Пет години живеам во Лајпциг. Подготовката за овој испит беше интензивна."]
  - [hartmann, "Ihr Thema: die Bedeutung der Sprache für die Integration. Bitte.", "Your topic: the significance of language for integration. Go ahead.", "موضوعكِ: أهمية اللغة للاندماج. تفضّلي.", "Вашата тема: значењето на јазикот за интеграцијата. Повелете."]
  - [protagonist, "Die Beherrschung der Sprache ist der Schlüssel — aber nicht die einzige Voraussetzung.", "Command of the language is the key — but not the only condition.", "إتقان اللغة هو المفتاح — لكنه ليس الشرط الوحيد.", "Владеењето на јазикот е клучот — но не и единствениот услов."]
  - [hartmann, "... Vielen Dank. Die Bewertung bekommen Sie in zwei Wochen.", "... Thank you very much. You'll get the marks in two weeks.", "... شكرًا جزيلًا. تحصلين على التقييم بعد أسبوعين.", "... Многу благодарам. Оценката ќе ја добиете за две недели."]
  - [lena, "Und? Bestanden?", "So? Passed?", "وماذا؟ نجحتِ؟", "И? Положи?"]
  - [protagonist, "Bestanden — sogar mit Auszeichnung! Ich dachte, ich falle im schriftlichen Teil durch.", "Passed — even with distinction! I thought I'd fail the written part.", "نجحتُ — بل بامتياز! ظننتُ أنني سأرسب في الجزء الكتابي.", "Положив — дури со одлика! Мислев дека ќе паднам на писмениот дел."]
  - [lena, "Mit dem Zertifikat stehen dir jetzt viele Türen offen!", "With the certificate many doors are open to you now!", "مع الشهادة تُفتح أمامكِ الآن أبواب كثيرة!", "Со сертификатот сега многу врати ти се отворени!"]
teach:
  - ask: ["Say: the oral exam.", "قولي: الامتحان الشفهي.", "Кажете: усниот испит.", "Die mündliche Prüfung.", die-muendliche-pruefung, die-pruefung-c1]
  - ask: ["Say: the preparation was intensive.", "قولي: التحضير كان مكثّفًا.", "Кажете: подготовката беше интензивна.", "Die Vorbereitung war intensiv.", die-vorbereitung]
  - note: ["Exam German at C1 is nominal: «die Bedeutung der Sprache für die Integration» (= why language matters for integration), «die Beherrschung der Sprache» (= being able to use the language well). Answer in the same register.", "ألمانية الامتحان في C1 اسمية: «die Bedeutung der Sprache für die Integration» (= لماذا تهمّ اللغة للاندماج)، «die Beherrschung der Sprache» (= إتقان اللغة). أجيبي بالأسلوب نفسه.", "Испитниот германски на C1 е номинален: «die Bedeutung der Sprache für die Integration» (= зошто јазикот е важен за интеграцијата), «die Beherrschung der Sprache» (= добро владеење на јазикот). Одговорете во истиот регистар."]
  - ask: ["Say: command of the language is the key.", "قولي: إتقان اللغة هو المفتاح.", "Кажете: владеењето на јазикот е клучот.", "Die Beherrschung der Sprache ist der Schlüssel.", die-beherrschung]
  - ask: ["Say: the recognition of the certificate.", "قولي: الاعتراف بالشهادة.", "Кажете: признавањето на сертификатот.", "Die Anerkennung des Zertifikats.", die-anerkennung-zertifikat]
  - ask: ["Say: the marks come in two weeks.", "قولي: التقييم بعد أسبوعين.", "Кажете: оценката за две недели.", "Die Bewertung kommt in zwei Wochen.", die-bewertung]
  - ask: ["Say: passed — with distinction!", "قولي: نجحتُ — بامتياز!", "Кажете: положив — со одлика!", "Bestanden — mit Auszeichnung!", bestehen, mit-auszeichnung]
  - ask: ["Say: I thought I'd fail the written part.", "قولي: ظننتُ أنني سأرسب في الجزء الكتابي.", "Кажете: мислев дека ќе паднам на писмениот дел.", "Ich dachte, ich falle im schriftlichen Teil durch.", durchfallen, die-schriftliche-pruefung]
  - ask: ["Say: the certificate.", "قولي: الشهادة.", "Кажете: сертификатот.", "Das Zertifikat.", das-zertifikat]
  - note: ["Recognised German certificates (telc, Goethe, ÖSD, TestDaF, DSH) are accepted by authorities, employers and universities; a VHS course certificate alone often isn't — check which exam you need. C1 opens university admission and many qualified jobs.", "شهادات الألمانية المعترف بها (telc، Goethe، ÖSD، TestDaF، DSH) تقبلها الدوائر وأصحاب العمل والجامعات؛ أما شهادة حضور الدورة وحدها فغالبًا لا — تحقّقي من الامتحان الذي تحتاجينه. ومستوى C1 يفتح القبول الجامعي ووظائف مؤهّلة كثيرة.", "Признаените германски сертификати (telc, Goethe, ÖSD, TestDaF, DSH) ги прифаќаат институциите, работодавците и универзитетите; само потврда за курс често не — проверете кој испит ви треба. C1 отвора упис на универзитет и многу квалификувани работи."]
