id: A2-11
protagonist: f
title: ["Festivals", "الأعياد", "Празници"]
situation:
  - "December. Frau Becker decorates the stairwell and asks which festivals you celebrate."
  - "ديسمبر. السيدة بيكر تزيّن الدرج وتسألكِ عن الأعياد التي تحتفلين بها."
  - "Декември. Госпоѓа Бекер ги украсува скалите и ве прашува кои празници ги славите."
learn: [de-con_04]
culture: Ramadan, Orthodox Easter, Christmas
items:
  - [das-fest, "das Fest", "the festival", "العيد، الاحتفال", "празникот"]
  - [feiern, "feiern", "celebrate", "يحتفل", "слави"]
  - [weihnachten, "Weihnachten", "Christmas", "عيد الميلاد", "Божиќ"]
  - [ostern, "Ostern", "Easter", "عيد الفصح", "Велигден"]
  - [bei-uns, "bei uns", "where we come from", "عندنا", "кај нас"]
  - [zu-einer-anderen-zeit, "zu einer anderen Zeit", "at a different time", "في وقت آخر", "во друго време"]
  - [frei-nehmen, "frei nehmen", "take a day off", "يأخذ إجازة", "зема слободен ден"]
  - [die-familie-besuchen, "die Familie besuchen", "visit the family", "يزور العائلة", "го посетува семејството"]
  - [geschenke, "Geschenke", "presents", "هدايا", "подароци"]
  - [weil, "weil", "because (verb to the end)", "لأنّ (الفعل في الآخر)", "затоа што (глаголот на крај)"]
  - [frohe-feiertage, "Frohe Feiertage!", "Happy holidays!", "أعيادًا سعيدة!", "Среќни празници!"]
dialogue:
  - [becker, "Bald ist Weihnachten! Feiern Sie auch Weihnachten?", "Christmas is coming! Do you celebrate Christmas too?", "عيد الميلاد قريب! هل تحتفلين به أيضًا؟", "Наскоро е Божиќ! Го славите ли и вие Божиќ?"]
  - [protagonist, "Bei uns gibt es andere Feste — zu einer anderen Zeit.", "Where I come from there are other festivals — at a different time.", "عندنا أعياد أخرى — في وقت آخر.", "Кај нас има други празници — во друго време."]
  - [becker, "Und dann haben Sie frei?", "And then you have time off?", "وهل تأخذين إجازة حينها؟", "И тогаш сте слободни?"]
  - [protagonist, "Nein, ich muss frei nehmen, weil es hier kein Feiertag ist.", "No, I have to take a day off, because it's not a holiday here.", "لا، يجب أن آخذ إجازة، لأنه ليس عطلة هنا.", "Не, морам да земам слободен ден, затоа што тука не е празник."]
  - [becker, "Was machen Sie an dem Fest?", "What do you do at the festival?", "ماذا تفعلين في العيد؟", "Што правите на празникот?"]
  - [protagonist, "Wir besuchen die Familie, wir essen zusammen, es gibt Geschenke für die Kinder.", "We visit the family, we eat together, there are presents for the children.", "نزور العائلة ونأكل معًا، وهناك هدايا للأطفال.", "Го посетуваме семејството, јадеме заедно, има подароци за децата."]
  - [becker, "Wie bei uns an Weihnachten! Und Ostern?", "Like us at Christmas! And Easter?", "مثلنا في عيد الميلاد! وعيد الفصح؟", "Како кај нас за Божиќ! А Велигден?"]
  - [protagonist, "Das ist bei jedem anders. Frohe Feiertage, Frau Becker!", "That's different for everyone. Happy holidays, Mrs Becker!", "هذا يختلف من شخص لآخر. أعيادًا سعيدة يا سيدة بيكر!", "Тоа е различно кај секого. Среќни празници, госпоѓо Бекер!"]
teach:
  - ask: ["She asks if you celebrate Christmas.", "تسألكِ إن كنتِ تحتفلين بعيد الميلاد.", "Ве прашува дали го славите Божиќ.", "Feiern Sie Weihnachten?", feiern, weihnachten]
  - ask: ["Say: where we come from there are other festivals.", "قولي: عندنا أعياد أخرى.", "Кажете: кај нас има други празници.", "Bei uns gibt es andere Feste.", bei-uns, das-fest]
  - ask: ["Say: at a different time.", "قولي: في وقت آخر.", "Кажете: во друго време.", "Zu einer anderen Zeit.", zu-einer-anderen-zeit]
  - ask: ["Say: I have to take a day off.", "قولي: يجب أن آخذ إجازة.", "Кажете: морам да земам слободен ден.", "Ich muss frei nehmen.", frei-nehmen]
  - ask: ["Say: because it's not a holiday here.", "قولي: لأنه ليس عطلة هنا.", "Кажете: затоа што тука не е празник.", "Weil es hier kein Feiertag ist.", weil]
  - ask: ["Say: we visit the family.", "قولي: نزور العائلة.", "Кажете: го посетуваме семејството.", "Wir besuchen die Familie.", die-familie-besuchen]
  - ask: ["Say: presents for the children.", "قولي: هدايا للأطفال.", "Кажете: подароци за децата.", "Geschenke für die Kinder.", geschenke]
  - ask: ["Ask: and Easter?", "اسألي: وعيد الفصح؟", "Прашајте: а Велигден?", "Und Ostern?", ostern]
  - ask: ["Wish her happy holidays.", "تمنَّي لها أعيادًا سعيدة.", "Посакајте ѝ среќни празници.", "Frohe Feiertage!", frohe-feiertage]
  - note: ["Public holidays are Christian ones, varying by state. For other festivals you take leave — employers and schools usually allow it if you ask early.", "العطل الرسمية مسيحية وتختلف من ولاية لأخرى. وللأعياد الأخرى تأخذ إجازة — وأصحاب العمل والمدارس يوافقون عادةً إذا طلبت مبكرًا.", "Државните празници се христијански и се разликуваат по покраини. За други празници земате одмор — работодавците и училиштата обично дозволуваат ако прашате навреме."]
  - only: {ar: "في رمضان يمكنكِ أن تقولي: «Ich faste im Ramadan» — أنا صائمة في رمضان. وفي العيد: «Heute ist Zuckerfest» أو «Bayram». كثير من الحضانات والمدارس تعرف ذلك.", mk: "Православниот Велигден честопати паѓа една или повеќе недели по католичкиот, а Божиќ на 7 јануари. Кажете: «Bei uns ist Weihnachten am 7. Januar»."}
