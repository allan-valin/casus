id: B2-01
protagonist: f
title: ["The feedback talk", "حديث التقييم", "Разговор за оценка"]
situation:
  - "Your yearly feedback talk with Frau Schröder, your boss. She is friendly — and very direct."
  - "حديث التقييم السنوي مع السيدة شرودر، مديرتكِ. إنها لطيفة — ومباشرة جدًا."
  - "Годишниот разговор за оценка со госпоѓа Шредер, вашата шефица. Љубезна е — и многу директна."
learn: [b2-nominal-style]
culture: Direct criticism
items:
  - [das-feedbackgespraech, "das Feedbackgespräch", "the feedback talk", "حديث التقييم", "разговорот за оценка", {rare: true}]
  - [die-staerke, "die Stärken", "the strengths", "نقاط القوة", "силните страни"]
  - [die-schwaeche, "die Schwächen", "the weaknesses", "نقاط الضعف", "слабите страни"]
  - [das-ziel, "das Ziel", "the goal", "الهدف", "целта"]
  - [die-zuverlaessigkeit, "die Zuverlässigkeit", "reliability", "الموثوقية", "сигурноста, доверливоста", {rare: true}]
  - [die-puenktlichkeit, "die Pünktlichkeit", "punctuality", "الالتزام بالمواعيد", "точноста", {rare: true}]
  - [die-verbesserung, "die Verbesserung", "the improvement", "التحسين", "подобрувањето"]
  - [die-weiterbildung, "die Weiterbildung", "further training", "التدريب المستمر", "дообуката", {rare: true}]
  - [verbesserungswuerdig, "ausbaufähig", "room for improvement", "قابل للتحسين", "има простор за подобрување", {rare: true}]
  - [ich-nehme-das-mit, "Das nehme ich mit", "I'll take that on board", "سآخذ ذلك بعين الاعتبار", "Ќе го земам предвид"]
  - [zufrieden-mit, "zufrieden mit", "satisfied with", "راضٍ عن", "задоволна од"]
dialogue:
  - [schroeder, "Fangen wir mit Ihren Stärken an: Zuverlässigkeit und Pünktlichkeit. Sehr gut.", "Let's start with your strengths: reliability and punctuality. Very good.", "لنبدأ بنقاط قوتكِ: الموثوقية والالتزام بالمواعيد. جيد جدًا.", "Да почнеме со вашите силни страни: доверливост и точност. Многу добро."]
  - [protagonist, "Danke. Und die Schwächen?", "Thank you. And the weaknesses?", "شكرًا. ونقاط الضعف؟", "Благодарам. А слабите страни?"]
  - [schroeder, "Die Kommunikation mit Kunden ist noch ausbaufähig. Sie sprechen zu leise.", "Communication with customers still has room for improvement. You speak too quietly.", "التواصل مع الزبائن ما زال قابلًا للتحسين. تتكلّمين بصوت منخفض جدًا.", "Комуникацијата со клиентите сè уште има простор за подобрување. Зборувате премногу тивко."]
  - [protagonist, "Oh... Das nehme ich mit.", "Oh... I'll take that on board.", "آه... سآخذ ذلك بعين الاعتبار.", "О... Ќе го земам предвид."]
  - [schroeder, "Das ist keine Kritik an Ihrer Person. Insgesamt bin ich sehr zufrieden mit Ihnen.", "It's not criticism of you as a person. Overall I'm very satisfied with you.", "هذا ليس انتقادًا لشخصكِ. إجمالًا أنا راضية عنكِ جدًا.", "Тоа не е критика на вашата личност. Генерално сум многу задоволна од вас."]
  - [protagonist, "Was ist mein Ziel für das nächste Jahr?", "What's my goal for next year?", "ما هدفي للسنة القادمة؟", "Која е мојата цел за следната година?"]
  - [schroeder, "Die Verbesserung der Kommunikation. Ich schlage eine Weiterbildung vor.", "Improving communication. I suggest some further training.", "تحسين التواصل. أقترح تدريبًا مستمرًا.", "Подобрување на комуникацијата. Предлагам дообука."]
  - [protagonist, "Gern. Wird die Weiterbildung von der Firma bezahlt?", "Gladly. Is the training paid for by the company?", "بكل سرور. هل تدفع الشركة ثمن التدريب؟", "Со задоволство. Дали дообуката ја плаќа фирмата?"]
  - [schroeder, "Selbstverständlich.", "Of course.", "بالطبع.", "Се разбира."]
teach:
  - ask: ["Say: the feedback talk.", "قولي: حديث التقييم.", "Кажете: разговор за оценка.", "Das Feedbackgespräch.", das-feedbackgespraech]
  - note: ["Work German loves nouns: «die Zuverlässigkeit» (from zuverlässig), «die Pünktlichkeit», «die Verbesserung der Kommunikation» (improving communication). -keit, -heit and -ung make nouns.", "ألمانية العمل تحب الأسماء: «die Zuverlässigkeit» (من zuverlässig)، «die Pünktlichkeit»، «die Verbesserung der Kommunikation» (تحسين التواصل). اللواحق -keit و-heit و-ung تصنع أسماء.", "Работниот германски сака именки: «die Zuverlässigkeit» (од zuverlässig), «die Pünktlichkeit», «die Verbesserung der Kommunikation» (подобрување на комуникацијата). -keit, -heit и -ung прават именки."]
  - ask: ["Say: my strengths are reliability and punctuality.", "قولي: نقاط قوتي الموثوقية والالتزام بالمواعيد.", "Кажете: мои силни страни се доверливоста и точноста.", "Meine Stärken sind Zuverlässigkeit und Pünktlichkeit.", die-staerke, die-zuverlaessigkeit, die-puenktlichkeit]
  - ask: ["Ask: and the weaknesses?", "اسألي: ونقاط الضعف؟", "Прашајте: а слабите страни?", "Und die Schwächen?", die-schwaeche]
  - ask: ["She says: room for improvement.", "تقول: قابل للتحسين.", "Таа вели: има простор за подобрување.", "Noch ausbaufähig.", verbesserungswuerdig]
  - ask: ["Say: I'll take that on board.", "قولي: سآخذ ذلك بعين الاعتبار.", "Кажете: ќе го земам предвид.", "Das nehme ich mit.", ich-nehme-das-mit]
  - ask: ["She says: I'm very satisfied with you.", "تقول: أنا راضية عنكِ جدًا.", "Таа вели: многу сум задоволна од вас.", "Ich bin sehr zufrieden mit Ihnen.", zufrieden-mit]
  - ask: ["Ask: what's my goal?", "اسألي: ما هدفي؟", "Прашајте: која е мојата цел?", "Was ist mein Ziel?", das-ziel]
  - ask: ["Say: improving communication.", "قولي: تحسين التواصل.", "Кажете: подобрување на комуникацијата.", "Die Verbesserung der Kommunikation.", die-verbesserung]
  - ask: ["Ask: is the further training paid by the company?", "اسألي: هل تدفع الشركة ثمن التدريب؟", "Прашајте: дали дообуката ја плаќа фирмата?", "Wird die Weiterbildung von der Firma bezahlt?", die-weiterbildung]
  - note: ["In a German feedback talk criticism is said plainly — «ausbaufähig», «zu leise» — and praise just as plainly. It's about the work, not you. Answer calmly («Das nehme ich mit») and ask for a concrete goal.", "في حديث التقييم الألماني يُقال الانتقاد بوضوح — «ausbaufähig»، «zu leise» — والمديح بالوضوح نفسه. الأمر يتعلق بالعمل لا بكِ. أجيبي بهدوء («Das nehme ich mit») واطلبي هدفًا محددًا.", "Во германски разговор за оценка критиката се кажува отворено — «ausbaufähig», «zu leise» — а и пофалбата исто така. Станува збор за работата, не за вас. Одговорете мирно («Das nehme ich mit») и побарајте конкретна цел."]
