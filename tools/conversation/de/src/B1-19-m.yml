id: B1-19-m
tracks: [mk]
protagonist: f
title: ["Соседи од Гостивар"]
situation: ["Во зградата на Петар живее Гордана од Гостивар. Ви раскажува како дошла нејзината фамилија."]
learn: [b1-separable-past]
culture: Several paths into the same country
items:
  - [kam-an, "kam an", "пристигна"]
  - [der-eu-buerger, "EU-Bürger", "граѓани на ЕУ"]
  - [die-westbalkanregelung, "die Westbalkanregelung", "правилото за Западен Балкан", {rare: true}]
  - [der-bulgarische-pass, "der bulgarische Pass", "бугарскиот пасош"]
  - [ein-arbeitsvertrag, "ein Arbeitsvertrag", "договор за работа"]
  - [zog-um, "zog um", "се пресели"]
  - [rief-an, "rief an", "се јави"]
  - [fing-an, "fing an", "почна"]
  - [der-pflegedienst, "der Pflegedienst", "службата за нега", {rare: true}]
  - [viele-von-uns, "viele von uns", "многумина од нас"]
dialogue:
  - [protagonist, "Gordana, wie kamt ihr nach Deutschland?", "Гордана, како дојдовте во Германија?"]
  - [gordana, "Mein Mann kam zuerst an, vor zehn Jahren. Mit einem Arbeitsvertrag.", "Мојот маж прв пристигна, пред десет години. Со договор за работа."]
  - [protagonist, "Mit der Westbalkanregelung?", "Со правилото за Западен Балкан?"]
  - [gordana, "Ja. Er fing auf dem Bau an. Dann rief er mich an: komm!", "Да. Почна на градежништво. Потоа ми се јави: дојди!"]
  - [protagonist, "Und viele Nachbarn haben bulgarische Pässe, oder?", "А многу соседи имаат бугарски пасоши, нели?"]
  - [gordana, "Ja, viele von uns. Mit dem Pass sind wir EU-Bürger und brauchen kein Visum.", "Да, многумина од нас. Со пасошот сме граѓани на ЕУ и не ни треба виза."]
  - [protagonist, "Wie wir. Und unser Sohn zog wegen der Arbeit hierher um.", "Како нас. А нашиот син се пресели тука поради работата."]
  - [gordana, "Und ich arbeite beim Pflegedienst. Es gibt viele Wege hierher.", "А јас работам во службата за нега. Има многу патишта до тука."]
teach:
  - ask: ["Прашајте: како дојдовте во Германија?", "Wie kamt ihr nach Deutschland?", kam-an]
  - note: ["Одвоивите глаголи се делат и во простото минато: «ankommen» → «er kam an»; «anrufen» → «er rief an»; «anfangen» → «er fing an»."]
  - ask: ["Кажете: со договор за работа.", "Mit einem Arbeitsvertrag.", ein-arbeitsvertrag]
  - ask: ["Кажете: правилото за Западен Балкан.", "Die Westbalkanregelung.", die-westbalkanregelung]
  - ask: ["Кажете: почна на градежништво.", "Er fing auf dem Bau an.", fing-an]
  - ask: ["Кажете: ми се јави.", "Er rief mich an.", rief-an]
  - ask: ["Кажете: многумина од нас.", "Viele von uns.", viele-von-uns]
  - ask: ["Кажете: бугарскиот пасош.", "Der bulgarische Pass.", der-bulgarische-pass]
  - ask: ["Кажете: сме граѓани на ЕУ.", "Wir sind EU-Bürger.", der-eu-buerger]
  - ask: ["Кажете: нашиот син се пресели тука.", "Unser Sohn zog hierher um.", zog-um]
  - ask: ["Кажете: службата за нега.", "Der Pflegedienst.", der-pflegedienst]
  - note: ["Луѓето од Северна Македонија доаѓаат по различни патишта: со бугарски пасош како граѓани на ЕУ, или со договор за работа преку правилото за Западен Балкан, кое има годишна квота. Правилата се менуваат — проверете ги тековните."]
