id: A1-05-e
tracks: [en]
protagonist: f
title: ["The supermarket"]
situation: ["Your first big shop. At the till, the cashier asks about bottles and bags."]
learn: [a1-accusative]
culture: Pfand
items:
  - [ich-nehme, "Ich nehme …", "I'll take …"]
  - [den-saft, "den Saft", "the juice (as an object)"]
  - [eine-tuete, "eine Tüte", "a bag"]
  - [brauchen-sie, "Brauchen Sie …?", "Do you need …? (polite)"]
  - [das-pfand, "das Pfand", "the deposit (on bottles)"]
  - [die-flaschen, "die Flaschen", "the bottles"]
  - [zurueck, "zurück", "back"]
  - [der-automat, "der Automat", "the machine"]
  - [mit-karte, "mit Karte", "by card"]
  - [bar, "bar", "in cash"]
  - [der-bon, "der Bon", "the receipt", {rare: true}]
  - [das-macht, "Das macht …", "That comes to …"]
dialogue:
  - [kasse, "Hallo! Brauchen Sie eine Tüte?", "Hi! Do you need a bag?"]
  - [protagonist, "Ja, bitte. Ich nehme eine Tüte.", "Yes, please. I'll take a bag."]
  - [kasse, "Das macht zwölf Euro achtzig. Mit Karte oder bar?", "That comes to twelve euros eighty. Card or cash?"]
  - [protagonist, "Mit Karte. ... Warum ist der Saft so teuer?", "By card. ... Why is the juice so expensive?"]
  - [kasse, "Das ist das Pfand. Fünfundzwanzig Cent pro Flasche.", "That's the deposit. Twenty-five cents a bottle."]
  - [protagonist, "Pfand? Was ist das?", "Deposit? What's that?"]
  - [kasse, "Sie bringen die Flaschen zurück, in den Automaten. Dann bekommen Sie das Geld zurück.", "You bring the bottles back, into the machine. Then you get the money back."]
  - [protagonist, "Ah! Wo ist der Automat?", "Ah! Where's the machine?"]
  - [kasse, "Dort hinten, links. Hier ist Ihr Bon.", "Back there, on the left. Here's your receipt."]
teach:
  - ask: ["She asks if you need a bag.", "Brauchen Sie eine Tüte?", brauchen-sie, eine-tuete]
  - ask: ["Say: yes, I'll take a bag.", "Ja, ich nehme eine Tüte.", ich-nehme, eine-tuete]
  - note: ["After «nehmen», «haben», «brauchen» the object changes only in the masculine: «der Saft» becomes «den Saft» — «Ich nehme den Saft». «die» and «das» stay the same."]
  - ask: ["Say: I'll take the juice.", "Ich nehme den Saft.", ich-nehme, den-saft]
  - ask: ["She says: that comes to twelve euros.", "Das macht zwölf Euro.", das-macht]
  - ask: ["Say: by card.", "Mit Karte.", mit-karte]
  - ask: ["Or: in cash.", "Bar.", bar]
  - ask: ["She explains: the deposit.", "Das ist das Pfand.", das-pfand]
  - ask: ["Say: I bring the bottles back.", "Ich bringe die Flaschen zurück.", die-flaschen, zurueck]
  - ask: ["Ask where the machine is.", "Wo ist der Automat?", der-automat]
  - ask: ["She hands you the receipt. Say it: the receipt.", "Der Bon.", der-bon]
  - note: ["Most bottles and cans carry a deposit, paid at the till and refunded at a machine in the shop, which prints a voucher. Cash is still common, though cards work almost everywhere."]
