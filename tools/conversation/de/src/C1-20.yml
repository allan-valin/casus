id: C1-20
protagonist: m
title: ["A birth", "ولادة", "Раѓање"]
situation:
  - "Svenja and Jonas have a baby girl. You visit on day five — the midwife is just there."
  - "سفينيا ويوناس رُزقا بطفلة. تزورهم في اليوم الخامس — والقابلة هناك للتو."
  - "Свења и Јонас добија ќерка. Ги посетувате петтиот ден — бабицата е токму таму."
learn: [c1-passive-forms]
culture: The Hebamme and the first weeks
items:
  - [die-hebamme, "die Hebamme", "the midwife", "القابلة", "бабицата"]
  - [die-geburt, "die Geburt", "the birth", "الولادة", "раѓањето"]
  - [das-wochenbett, "das Wochenbett", "the first weeks after birth", "فترة النفاس", "бабињето", {rare: true}]
  - [wurde-geboren, "wurde geboren", "was born", "وُلدت", "е родена"]
  - [wird-gewogen, "wird gewogen", "is weighed", "يُوزن", "се мери"]
  - [ist-angemeldet, "ist angemeldet", "is registered", "مسجَّل", "е пријавено"]
  - [die-geburtsurkunde, "die Geburtsurkunde", "the birth certificate", "شهادة الميلاد", "изводот од матичната книга на родени"]
  - [stillen, "stillen", "breastfeed", "ترضع", "дои"]
  - [das-kindergeld, "das Kindergeld", "child benefit", "علاوة الأطفال", "детскиот додаток"]
  - [wird-bezahlt-c1, "wird bezahlt", "is paid", "يُدفع", "се плаќа"]
  - [herzlichen-glueckwunsch-geburt, "Herzlichen Glückwunsch zur Geburt!", "Congratulations on the birth!", "مبروك المولودة!", "Честитки за раѓањето!"]
dialogue:
  - [protagonist, "Herzlichen Glückwunsch zur Geburt! Wie heißt sie?", "Congratulations on the birth! What's her name?", "مبروك المولودة! ما اسمها؟", "Честитки за раѓањето! Како се вика?"]
  - [svenja, "Emma. Sie wurde am Montag geboren, um drei Uhr nachts.", "Emma. She was born on Monday, at three in the morning.", "إيما. وُلدت يوم الاثنين في الثالثة فجرًا.", "Ема. Родена е во понеделник, во три по полноќ."]
  - [hebamme, "So, Emma wird jetzt gewogen. ... Sehr gut, sie hat schon zugenommen.", "Right, Emma's being weighed now. ... Very good, she's already gained weight.", "حسنًا، الآن تُوزن إيما. ... ممتاز، لقد زاد وزنها بالفعل.", "Така, Ема сега се мери. ... Многу добро, веќе се здебели."]
  - [protagonist, "Kommt die Hebamme jeden Tag?", "Does the midwife come every day?", "هل تأتي القابلة كل يوم؟", "Дали бабицата доаѓа секој ден?"]
  - [hebamme, "Im Wochenbett regelmäßig, ja. Das wird von der Krankenkasse bezahlt.", "During the first weeks regularly, yes. It's paid by the health insurance.", "في فترة النفاس بانتظام، نعم. يدفع ذلك التأمين الصحي.", "Во бабињето редовно, да. Тоа го плаќа здравствената каса."]
  - [jonas, "Und Emma ist schon beim Standesamt angemeldet. Die Geburtsurkunde kam gestern.", "And Emma's already registered at the registry office. The birth certificate came yesterday.", "وإيما مسجّلة بالفعل في مكتب السجل المدني. شهادة الميلاد وصلت أمس.", "А Ема е веќе пријавена во матичното. Изводот стигна вчера."]
  - [protagonist, "Bei uns kommt nach der Geburt die ganze Familie für Wochen.", "With us the whole family comes for weeks after a birth.", "عندنا تأتي العائلة كلها لأسابيع بعد الولادة.", "Кај нас по раѓањето доаѓа цело семејство со недели."]
  - [svenja, "Hier ist es ruhiger. Aber ein Essen vor der Tür wäre toll!", "Here it's quieter. But a meal left at the door would be great!", "هنا الأمر أهدأ. لكن وجبة أمام الباب ستكون رائعة!", "Тука е помирно. Но оброк пред вратата би бил одличен!"]
teach:
  - ask: ["Congratulate on the birth.", "هنّئ بالمولودة.", "Честитајте за раѓањето.", "Herzlichen Glückwunsch zur Geburt!", herzlichen-glueckwunsch-geburt]
  - ask: ["She says: she was born on Monday.", "تقول: وُلدت يوم الاثنين.", "Таа вели: родена е во понеделник.", "Sie wurde am Montag geboren.", wurde-geboren, die-geburt]
  - note: ["Passive forms around a birth: «wurde geboren» (was born — past), «wird gewogen» (is being weighed — process), «ist angemeldet» (is registered — state), «wird bezahlt» (is paid).", "صيغ المبني للمجهول حول الولادة: «wurde geboren» (وُلدت — ماضٍ)، «wird gewogen» (تُوزن — عملية)، «ist angemeldet» (مسجّلة — حالة)، «wird bezahlt» (يُدفع).", "Пасивни форми околу раѓање: «wurde geboren» (е родена — минато), «wird gewogen» (се мери — процес), «ist angemeldet» (е пријавена — состојба), «wird bezahlt» (се плаќа)."]
  - ask: ["Say: she's being weighed.", "قل: إنها تُوزن.", "Кажете: таа се мери.", "Sie wird gewogen.", wird-gewogen]
  - ask: ["Say: the midwife.", "قل: القابلة.", "Кажете: бабицата.", "Die Hebamme.", die-hebamme]
  - ask: ["Say: the first weeks after birth.", "قل: فترة النفاس.", "Кажете: бабињето.", "Das Wochenbett.", das-wochenbett]
  - ask: ["Say: it's paid by the health insurance.", "قل: يدفع ذلك التأمين الصحي.", "Кажете: тоа го плаќа касата.", "Das wird von der Krankenkasse bezahlt.", wird-bezahlt-c1]
  - ask: ["Say: she's registered at the registry office.", "قل: إنها مسجّلة في مكتب السجل المدني.", "Кажете: пријавена е во матичното.", "Sie ist beim Standesamt angemeldet.", ist-angemeldet]
  - ask: ["Say: the birth certificate.", "قل: شهادة الميلاد.", "Кажете: изводот на родените.", "Die Geburtsurkunde.", die-geburtsurkunde]
  - ask: ["Say: child benefit.", "قل: علاوة الأطفال.", "Кажете: детски додаток.", "Das Kindergeld.", das-kindergeld]
  - ask: ["Say: she's breastfeeding.", "قل: إنها ترضع.", "Кажете: таа дои.", "Sie stillt.", stillen]
  - note: ["Every mother has a right to a midwife before and after birth, paid by health insurance — but midwives are scarce, so look for one early in pregnancy. The birth is registered at the registry office within a week; then apply for Kindergeld and Elterngeld. Visits in the first weeks are short and announced; bringing food is very welcome.", "لكل أم الحق في قابلة قبل الولادة وبعدها، يدفعها التأمين الصحي — لكن القابلات قليلات، فابحثوا عن واحدة مبكرًا في الحمل. وتُسجَّل الولادة في مكتب السجل المدني خلال أسبوع؛ ثم يُقدَّم طلب علاوة الأطفال وعلاوة الوالدين. والزيارات في الأسابيع الأولى قصيرة ومُعلَن عنها مسبقًا؛ وإحضار الطعام مرحَّب به جدًا.", "Секоја мајка има право на бабица пред и по раѓањето, платена од касата — но бабиците се малку, па барајте рано во бременоста. Раѓањето се пријавува во матичното во рок од една недела; потоа се бара Kindergeld и Elterngeld. Посетите во првите недели се кратки и најавени; донесувањето храна е многу добредојдено."]
