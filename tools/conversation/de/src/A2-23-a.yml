id: A2-23-a
tracks: [ar]
protagonist: f
title: ["تسجيل المدرسة"]
situation: ["ابن أختكِ عمر، سبع سنوات، وصل مع عائلته. تذهبين مع أختكِ لتسجيله في المدرسة."]
learn: [a2-perfekt-irregular]
culture: Compulsory schooling
items:
  - [die-schule, "die Schule", "المدرسة"]
  - [anmelden-schule, "anmelden", "يسجّل"]
  - [die-schulpflicht, "die Schulpflicht", "التعليم الإلزامي", {rare: true}]
  - [die-klasse, "die Klasse", "الصف"]
  - [die-willkommensklasse, "die Willkommensklasse", "صف الترحيب (للقادمين الجدد)", {rare: true}]
  - [ist-angekommen, "ist … angekommen", "وصل"]
  - [hat-gelernt, "hat … gelernt", "تعلّم"]
  - [der-lehrer, "der Lehrer", "المعلم"]
  - [der-schulweg, "der Schulweg", "الطريق إلى المدرسة", {rare: true}]
  - [ab-montag, "ab Montag", "ابتداءً من الاثنين"]
dialogue:
  - [lehrerin, "Guten Morgen. Sie möchten ein Kind anmelden?", "صباح الخير. تريدين تسجيل طفل؟"]
  - [protagonist, "Ja, meinen Neffen Omar. Er ist letzte Woche angekommen.", "نعم، ابن أختي عمر. وصل الأسبوع الماضي."]
  - [lehrerin, "Wie alt ist er?", "كم عمره؟"]
  - [protagonist, "Sieben. Er hat in Syrien zwei Jahre Schule gehabt.", "سبع سنوات. درس سنتين في سوريا."]
  - [lehrerin, "Hat er schon Deutsch gelernt?", "هل تعلّم الألمانية؟"]
  - [protagonist, "Nein, noch nicht.", "لا، ليس بعد."]
  - [lehrerin, "Dann kommt er zuerst in die Willkommensklasse. Dort lernt er Deutsch.", "إذن يدخل أولًا صف الترحيب. هناك يتعلّم الألمانية."]
  - [protagonist, "Muss er sofort in die Schule?", "هل يجب أن يذهب إلى المدرسة فورًا؟"]
  - [lehrerin, "Ja, in Deutschland gibt es Schulpflicht. Ab Montag!", "نعم، في ألمانيا التعليم إلزامي. ابتداءً من الاثنين!"]
teach:
  - ask: ["قولي: أريد تسجيل ابن أختي.", "Ich möchte meinen Neffen anmelden.", anmelden-schule]
  - ask: ["قولي: المدرسة.", "Die Schule.", die-schule]
  - note: ["كثير من أسماء المفعول شاذة: «angekommen» (وصل)، «gelernt» (تعلّم)، «gehabt» (كان عنده). احفظيها مع الفعل."]
  - ask: ["قولي: وصل الأسبوع الماضي.", "Er ist letzte Woche angekommen.", ist-angekommen]
  - ask: ["تسأل: هل تعلّم الألمانية؟", "Hat er schon Deutsch gelernt?", hat-gelernt]
  - ask: ["قولي: صف الترحيب.", "Die Willkommensklasse.", die-willkommensklasse]
  - ask: ["قولي: الصف.", "Die Klasse.", die-klasse]
  - ask: ["قولي: التعليم الإلزامي.", "Die Schulpflicht.", die-schulpflicht]
  - ask: ["قولي: ابتداءً من الاثنين.", "Ab Montag.", ab-montag]
  - ask: ["قولي: المعلم.", "Der Lehrer.", der-lehrer]
  - ask: ["قولي: الطريق إلى المدرسة.", "Der Schulweg.", der-schulweg]
  - note: ["التعليم إلزامي في ألمانيا لكل الأطفال المقيمين، والتعليم المنزلي غير مسموح. القادمون الجدد يدخلون غالبًا «صف الترحيب» لتعلّم الألمانية أولًا. القواعد تختلف من ولاية لأخرى — اسألي في المدرسة أو في البلدية."]
