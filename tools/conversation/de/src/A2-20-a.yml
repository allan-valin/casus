id: A2-20-a
tracks: [ar]
protagonist: m
title: ["أمسية مع الزملاء"]
situation: ["زملاؤك في العمل يدعونك إلى أمسية في مقهى بعد الدوام."]
learn: [a2-reflexive]
culture: An evening out without alcohol
items:
  - [sich-treffen, "wir treffen uns", "نلتقي"]
  - [ich-freue-mich, "ich freue mich", "يسعدني، أتطلّع"]
  - [nach-der-arbeit, "nach der Arbeit", "بعد العمل"]
  - [ich-trinke-keinen, "ich trinke keinen Alkohol", "لا أشرب الكحول"]
  - [eine-limo, "eine Limo", "مشروب غازي (ليموناضة)"]
  - [die-kollegen, "die Kollegen", "الزملاء"]
  - [sich-unterhalten, "wir unterhalten uns", "نتحدث، ندردش"]
  - [entspannt, "entspannt", "مسترخٍ، هادئ"]
  - [nicht-so-spaet, "nicht so spät", "ليس متأخرًا جدًا"]
  - [ich-muss-los, "Ich muss los", "يجب أن أذهب"]
dialogue:
  - [meier, "Wir treffen uns heute nach der Arbeit im Café am Markt. Kommen Sie mit?", "نلتقي اليوم بعد العمل في المقهى عند السوق. هل تأتي معنا؟"]
  - [protagonist, "Gern, ich freue mich! Aber nicht so spät.", "بكل سرور، يسعدني ذلك! لكن ليس متأخرًا جدًا."]
  - [jonas, "Was trinkst du? Ein Bier?", "ماذا تشرب؟ بيرة؟"]
  - [protagonist, "Nein, danke, ich trinke keinen Alkohol. Eine Limo, bitte.", "لا، شكرًا، لا أشرب الكحول. مشروب غازي من فضلك."]
  - [meier, "Kein Problem. Viele Kollegen trinken auch nichts.", "لا مشكلة. كثير من الزملاء لا يشربون أيضًا."]
  - [protagonist, "Schön, dass wir uns außerhalb der Arbeit unterhalten.", "جميل أن نتحدث خارج العمل."]
  - [meier, "Ja, das ist entspannt.", "نعم، هذا مريح."]
  - [protagonist, "Es ist neun. Ich muss los — meine Tochter schläft bald.", "الساعة التاسعة. يجب أن أذهب — ابنتي ستنام قريبًا."]
teach:
  - note: ["الأفعال الانعكاسية تستعمل «mich» و«dich» و«uns»: «ich freue mich» (يسعدني)، «wir treffen uns» (نلتقي)، «wir unterhalten uns» (نتحدث)."]
  - ask: ["قل: نلتقي بعد العمل.", "Wir treffen uns nach der Arbeit.", sich-treffen, nach-der-arbeit]
  - ask: ["قل: يسعدني ذلك!", "Ich freue mich!", ich-freue-mich]
  - ask: ["قل: لكن ليس متأخرًا جدًا.", "Aber nicht so spät.", nicht-so-spaet]
  - ask: ["قل: لا، شكرًا، لا أشرب الكحول.", "Nein, danke, ich trinke keinen Alkohol.", ich-trinke-keinen]
  - ask: ["اطلب مشروبًا غازيًا.", "Eine Limo, bitte.", eine-limo]
  - ask: ["قل: كثير من الزملاء.", "Viele Kollegen.", die-kollegen]
  - ask: ["قل: نتحدث خارج العمل.", "Wir unterhalten uns außerhalb der Arbeit.", sich-unterhalten]
  - ask: ["قل: هذا مريح.", "Das ist entspannt.", entspannt]
  - ask: ["قل: يجب أن أذهب.", "Ich muss los.", ich-muss-los]
  - note: ["قول «لا أشرب الكحول» أمر عادي تمامًا في ألمانيا، ولن يصرّ أحد. والسهرات مع الزملاء طريقة جيدة للتعارف — ساعة أو ساعتان تكفيان."]
