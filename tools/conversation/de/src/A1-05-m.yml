id: A1-05-m
tracks: [mk]
protagonist: f
title: ["Лука има температура"]
situation: ["Лука се разболе, а родителите се на работа. Со картичката од осигурувањето го носите кај детската лекарка."]
learn: [a1-accusative]
culture: The yellow check-up booklet
items:
  - [die-oma, "die Oma", "бабата"]
  - [hat-fieber, "hat Fieber", "има температура"]
  - [seit-heute-morgen-k, "seit heute Morgen", "од утрово"]
  - [die-eltern, "die Eltern", "родителите"]
  - [arbeiten, "arbeiten", "работат"]
  - [die-karte, "die Karte", "картичката"]
  - [das-u-heft, "das U-Heft", "жолтата книшка за прегледи", {rare: true}]
  - [hustet, "hustet", "кашла"]
  - [ich-gebe-ihnen, "Ich gebe Ihnen …", "Ви давам …"]
  - [einen-saft, "einen Saft", "сируп"]
  - [dreimal-am-tag, "dreimal am Tag", "три пати на ден"]
  - [gute-besserung, "Gute Besserung!", "Брзо оздравување!"]
  - [vielen-dank, "Vielen Dank", "Многу благодарам"]
dialogue:
  - [wagner, "Guten Tag. Sie sind …?", "Добар ден. Вие сте …?"]
  - [protagonist, "Ich bin die Oma von Luka. Die Eltern arbeiten.", "Јас сум бабата на Лука. Родителите се на работа."]
  - [wagner, "Gut. Was fehlt Luka?", "Добро. Што му е на Лука?"]
  - [protagonist, "Luka hat Fieber. Seit heute Morgen.", "Лука има температура. Од утрово."]
  - [wagner, "Haben Sie die Karte und das U-Heft?", "Ги имате ли картичката и жолтата книшка?"]
  - [protagonist, "Die Karte, ja. Das U-Heft ... nein.", "Картичката, да. Книшката ... не."]
  - [wagner, "Kein Problem. Hustet er auch?", "Нема проблем. Кашла ли?"]
  - [protagonist, "Ja, ein bisschen.", "Да, малку."]
  - [wagner, "Ich gebe Ihnen einen Saft. Dreimal am Tag. Gute Besserung, Luka!", "Ќе ви дадам сируп. Три пати на ден. Брзо оздравување, Лука!"]
  - [protagonist, "Vielen Dank!", "Многу благодарам!"]
teach:
  - ask: ["Претставете се: јас сум бабата на Лука.", "Ich bin die Oma von Luka.", ich-bin, die-oma]
  - ask: ["Кажете: родителите работат.", "Die Eltern arbeiten.", die-eltern, arbeiten]
  - ask: ["Кажете: Лука има температура.", "Luka hat Fieber.", hat-fieber]
  - ask: ["Кажете: од утрово.", "Seit heute Morgen.", seit-heute-morgen-k]
  - note: ["«das U-Heft» е жолта книшка што се добива при раѓање, со сите редовни прегледи на детето (U1 до U9). Замолете ги Петар и Ања да ви ја дадат заедно со картичката, кога вие го носите Лука."]
  - ask: ["Кажете: картичката, да.", "Die Karte, ja.", die-karte]
  - ask: ["Кажете: жолтата книшка — не.", "Das U-Heft ... nein.", das-u-heft]
  - ask: ["Таа прашува дали кашла.", "Hustet er?", hustet]
  - note: ["По глаголи како «geben» и «haben» се менува само машкиот предмет: «ein Saft» станува «einen Saft» — «Ich gebe Ihnen einen Saft». Женскиот и средниот род остануваат исти."]
  - ask: ["Кажете наместо неа: ќе ви дадам сируп.", "Ich gebe Ihnen einen Saft.", ich-gebe-ihnen, einen-saft]
  - ask: ["Кажете: три пати на ден.", "Dreimal am Tag.", dreimal-am-tag]
  - ask: ["Таа му посакува на Лука брзо оздравување.", "Gute Besserung!", gute-besserung]
  - ask: ["Заблагодарете се.", "Vielen Dank!", vielen-dank]
