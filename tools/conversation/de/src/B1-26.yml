id: B1-26
protagonist: m
title: ["New Year's Eve", "ليلة رأس السنة", "Новогодишна ноќ"]
situation:
  - "31 December on the street with Jonas and Paul. Fireworks everywhere — and good resolutions."
  - "31 ديسمبر في الشارع مع يوناس وباول. ألعاب نارية في كل مكان — وقرارات حسنة للسنة الجديدة."
  - "31 декември на улица со Јонас и Паул. Огномет насекаде — и добри одлуки."
learn: [de-vf_01]
culture: Silvester
items:
  - [das-feuerwerk, "das Feuerwerk", "the fireworks", "الألعاب النارية", "огнометот"]
  - [die-vorsaetze, "die guten Vorsätze", "New Year's resolutions", "قرارات السنة الجديدة", "новогодишните одлуки", {rare: true}]
  - [silvester, "Silvester", "New Year's Eve", "ليلة رأس السنة", "Новогодишна ноќ"]
  - [um-mitternacht, "um Mitternacht", "at midnight", "عند منتصف الليل", "на полноќ"]
  - [ich-werde-aufhoeren, "ich werde aufhören", "I will stop", "سأتوقّف", "ќе престанам"]
  - [ich-werde-anfangen, "ich werde anfangen", "I will start", "سأبدأ", "ќе почнам"]
  - [rauchen, "rauchen", "smoke", "يدخّن", "пуши"]
  - [der-knall, "der Knall", "the bang", "الدويّ", "треснувањето"]
  - [pass-auf, "Pass auf!", "Careful! (informal)", "انتبه!", "Внимавај!"]
  - [gesundes-neues, "Frohes neues Jahr!", "Happy New Year!", "سنة جديدة سعيدة!", "Среќна Нова година!"]
  - [das-bleigiessen, "das Wachsgießen", "wax pouring (fortune game)", "صبّ الشمع (لعبة التنبّؤ)", "леење восок", {rare: true}]
dialogue:
  - [jonas, "Noch zehn Minuten bis Mitternacht! Hast du gute Vorsätze?", "Ten more minutes to midnight! Do you have resolutions?", "عشر دقائق حتى منتصف الليل! هل عندك قرارات للسنة الجديدة؟", "Уште десет минути до полноќ! Имаш ли новогодишни одлуки?"]
  - [protagonist, "Ja. Ich werde jeden Tag Deutsch sprechen. Und du?", "Yes. I'll speak German every day. And you?", "نعم. سأتكلّم الألمانية كل يوم. وأنت؟", "Да. Секој ден ќе зборувам германски. А ти?"]
  - [jonas, "Ich werde aufhören zu rauchen. Wie jedes Jahr!", "I'll stop smoking. Like every year!", "سأتوقّف عن التدخين. كما في كل سنة!", "Ќе престанам да пушам. Како секоја година!"]
  - [paul, "Und ich werde anfangen, Sport zu machen. Morgen. Oder übermorgen.", "And I'll start doing sport. Tomorrow. Or the day after.", "وأنا سأبدأ ممارسة الرياضة. غدًا. أو بعد غد.", "А јас ќе почнам да вежбам. Утре. Или задутре."]
  - [protagonist, "Warum knallt es schon überall?", "Why is everything already banging?", "لماذا الدويّ في كل مكان منذ الآن؟", "Зошто веќе насекаде треска?"]
  - [jonas, "Silvester eben! Aber pass auf, Feuerwerk ist gefährlich. Nicht zu nah!", "That's New Year's Eve! But careful, fireworks are dangerous. Not too close!", "إنها ليلة رأس السنة! لكن انتبه، الألعاب النارية خطيرة. لا تقترب كثيرًا!", "Таква е новогодишната ноќ! Но внимавај, огнометот е опасен. Не премногу блиску!"]
  - [paul, "Drei, zwei, eins — Frohes neues Jahr!", "Three, two, one — Happy New Year!", "ثلاثة، اثنان، واحد — سنة جديدة سعيدة!", "Три, два, еден — Среќна Нова година!"]
  - [protagonist, "Frohes neues Jahr! Und morgen: Wachsgießen?", "Happy New Year! And tomorrow: wax pouring?", "سنة جديدة سعيدة! وغدًا: صبّ الشمع؟", "Среќна Нова година! А утре: леење восок?"]
teach:
  - ask: ["Say: ten minutes to midnight.", "قل: عشر دقائق حتى منتصف الليل.", "Кажете: десет минути до полноќ.", "Zehn Minuten bis Mitternacht.", um-mitternacht]
  - ask: ["Ask: do you have resolutions?", "اسأل: هل عندك قرارات للسنة الجديدة؟", "Прашајте: имаш ли новогодишни одлуки?", "Hast du gute Vorsätze?", die-vorsaetze]
  - ask: ["Say: I'll speak German every day.", "قل: سأتكلّم الألمانية كل يوم.", "Кажете: секој ден ќе зборувам германски.", "Ich werde jeden Tag Deutsch sprechen.", ich-werde-lesen]
  - ask: ["He says: I'll stop smoking.", "يقول: سأتوقّف عن التدخين.", "Тој вели: ќе престанам да пушам.", "Ich werde aufhören zu rauchen.", ich-werde-aufhoeren, rauchen]
  - ask: ["He says: I'll start doing sport.", "يقول: سأبدأ ممارسة الرياضة.", "Тој вели: ќе почнам да вежбам.", "Ich werde anfangen, Sport zu machen.", ich-werde-anfangen]
  - ask: ["Say: New Year's Eve.", "قل: ليلة رأس السنة.", "Кажете: новогодишна ноќ.", "Silvester.", silvester]
  - ask: ["Say: fireworks are dangerous.", "قل: الألعاب النارية خطيرة.", "Кажете: огнометот е опасен.", "Feuerwerk ist gefährlich.", das-feuerwerk, gefaehrlich]
  - ask: ["He says: careful!", "يقول: انتبه!", "Тој вели: внимавај!", "Pass auf!", pass-auf]
  - ask: ["Say: the bang.", "قل: الدويّ.", "Кажете: треснувањето.", "Der Knall.", der-knall]
  - ask: ["Wish everyone a happy New Year.", "تمنَّ للجميع سنة جديدة سعيدة.", "Посакајте им на сите среќна Нова година.", "Frohes neues Jahr!", gesundes-neues]
  - ask: ["Say: wax pouring.", "قل: صبّ الشمع.", "Кажете: леење восок.", "Wachsgießen.", das-bleigiessen]
  - note: ["On Silvester private fireworks are allowed — the streets bang from the evening on, and every year people are hurt. Keep your distance, keep children and pets inside. Fireworks are sold only in the last days of December. On 1 January you wish «Frohes neues Jahr» for days.", "في ليلة رأس السنة يُسمح بالألعاب النارية الخاصة — تدوّي الشوارع منذ المساء، ويُصاب أناس كل سنة. حافظ على المسافة، وأبقِ الأطفال والحيوانات في البيت. تُباع الألعاب النارية في الأيام الأخيرة من ديسمبر فقط. وفي 1 يناير تقول «Frohes neues Jahr» لأيام.", "На Силвестер приватниот огномет е дозволен — улиците треснуваат уште од вечерта, а секоја година има повредени. Држете растојание, децата и миленичињата нека се внатре. Огномет се продава само последните денови од декември. На 1 јануари со денови се посакува «Frohes neues Jahr»."]
