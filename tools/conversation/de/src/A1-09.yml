id: A1-09
protagonist: f
title: ["Colours and light", "الألوان والضوء", "Бои и светлина"]
situation:
  - "The flat is dark from three o'clock. You go to buy a lamp."
  - "الشقة مظلمة منذ الساعة الثالثة. تذهبين لشراء مصباح."
  - "Станот е темен уште од три часот. Одите да купите ламба."
learn: [a1-adjectives]
culture: —
items:
  - [ich-suche, "Ich suche …", "I'm looking for …", "أبحث عن …", "Барам …"]
  - [die-lampe, "die Lampe", "the lamp", "المصباح", "ламбата"]
  - [so, "so", "so", "جدًا، هكذا", "толку"]
  - [viele, "viele", "many", "كثير من", "многу"]
  - [welche-farbe, "Welche Farbe?", "What colour?", "أيّ لون؟", "Која боја?"]
  - [weiss, "weiß", "white", "أبيض", "бело"]
  - [diese, "diese", "this (feminine)", "هذه", "оваа"]
  - [zu, "zu", "too", "أكثر من اللازم", "премногу"]
  - [warmes-licht, "warmes Licht", "warm light", "ضوء دافئ", "топла светлина"]
  - [gelb, "gelb", "yellow", "أصفر", "жолто"]
  - [klein, "klein", "small", "صغير", "мало"]
  - [was-kostet, "Was kostet …?", "How much is …?", "كم سعر …؟", "Колку чини …?"]
  - [die-kleine, "die kleine", "the small one", "الصغيرة", "малата"]
dialogue:
  - [kasse, "Guten Tag! Suchen Sie etwas?", "Hello! Are you looking for something?", "نهارك سعيد! هل تبحثين عن شيء؟", "Добар ден! Барате ли нешто?"]
  - [protagonist, "Ja, ich suche eine Lampe. Meine Wohnung ist so dunkel.", "Yes, I'm looking for a lamp. My flat is so dark.", "نعم، أبحث عن مصباح. شقتي مظلمة جدًا.", "Да, барам ламба. Станот ми е толку темен."]
  - [kasse, "Wir haben viele Lampen. Welche Farbe?", "We have lots of lamps. What colour?", "عندنا مصابيح كثيرة. أيّ لون؟", "Имаме многу ламби. Која боја?"]
  - [protagonist, "Weiß oder grau.", "White or grey.", "أبيض أو رمادي.", "Бела или сива."]
  - [kasse, "Diese weiße Lampe ist sehr hell.", "This white lamp is very bright.", "هذا المصباح الأبيض مضيء جدًا.", "Оваа бела ламба е многу светла."]
  - [protagonist, "Zu hell! Ich möchte warmes Licht, gelb.", "Too bright! I'd like warm light, yellow.", "مضيء أكثر من اللازم! أريد ضوءًا دافئًا، أصفر.", "Премногу светла! Сакам топла светлина, жолта."]
  - [kasse, "Dann diese hier. Warmes Licht, und sie ist schön klein.", "Then this one. Warm light, and nice and small.", "إذن هذه. ضوء دافئ، وهي صغيرة وجميلة.", "Тогаш оваа. Топла светлина, и убаво е мала."]
  - [protagonist, "Was kostet sie?", "How much is it?", "كم سعرها؟", "Колку чини?"]
  - [kasse, "Neunundzwanzig Euro.", "Twenty-nine euros.", "تسعة وعشرون يورو.", "Дваесет и девет евра."]
  - [protagonist, "Gut, ich nehme die kleine Lampe.", "Good, I'll take the small lamp.", "حسنًا، سآخذ المصباح الصغير.", "Добро, ја земам малата ламба."]
teach:
  - ask: ["Say: I'm looking for a lamp.", "قولي: أبحث عن مصباح.", "Кажете: барам ламба.", "Ich suche eine Lampe.", ich-suche, die-lampe]
  - ask: ["Say: my flat is so dark.", "قولي: شقتي مظلمة جدًا.", "Кажете: станот ми е толку темен.", "Meine Wohnung ist so dunkel.", so, dunkel]
  - ask: ["She says: we have many lamps.", "تقول: عندنا مصابيح كثيرة.", "Таа вели: имаме многу ламби.", "Wir haben viele Lampen.", viele]
  - ask: ["She asks: what colour?", "تسأل: أيّ لون؟", "Таа прашува: која боја?", "Welche Farbe?", welche-farbe]
  - ask: ["Say: white or grey.", "قولي: أبيض أو رمادي.", "Кажете: бела или сива.", "Weiß oder grau.", weiss, grau]
  - note: ["After «ist» an adjective has no ending: «Die Lampe ist weiß». Before a noun it takes one: «die weiße Lampe», «warmes Licht».", "بعد «ist» لا يأخذ النعت نهاية: «Die Lampe ist weiß». وقبل الاسم يأخذ نهاية: «die weiße Lampe»، «warmes Licht».", "По «ist» придавката нема наставка: «Die Lampe ist weiß». Пред именка добива: «die weiße Lampe», «warmes Licht»."]
  - ask: ["She says: this white lamp is very bright.", "تقول: هذا المصباح الأبيض مضيء جدًا.", "Таа вели: оваа бела ламба е многу светла.", "Diese weiße Lampe ist sehr hell.", diese, hell]
  - ask: ["Say: too bright!", "قولي: مضيء أكثر من اللازم!", "Кажете: премногу светла!", "Zu hell!", zu]
  - ask: ["Say: I'd like warm light, yellow.", "قولي: أريد ضوءًا دافئًا، أصفر.", "Кажете: сакам топла светлина, жолта.", "Ich möchte warmes Licht, gelb.", warmes-licht, gelb]
  - ask: ["Say: it's small.", "قولي: إنها صغيرة.", "Кажете: мала е.", "Sie ist klein.", klein]
  - ask: ["Ask how much it is.", "اسألي عن سعرها.", "Прашајте колку чини.", "Was kostet sie?", was-kostet]
  - ask: ["Say: I'll take the small lamp.", "قولي: سآخذ المصباح الصغير.", "Кажете: ја земам малата ламба.", "Ich nehme die kleine Lampe.", die-kleine]
