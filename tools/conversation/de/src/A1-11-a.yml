id: A1-11-a
tracks: [ar]
protagonist: f
title: ["دورة الاندماج"]
situation: ["اليوم الأول في دورة الاندماج (Integrationskurs). يارا في الحضانة، وأنتِ في الصف."]
learn: [de-vm_01]
culture: The Integrationskurs
items:
  - [der-kurs, "der Kurs", "الدورة، الصف"]
  - [bin-ich-richtig, "Bin ich hier richtig?", "هل أنا في المكان الصحيح؟"]
  - [schreiben-sie, "Schreiben Sie …", "اكتبي … (بصيغة الاحترام)"]
  - [ihren-namen, "Ihren Namen", "اسمكِ"]
  - [muss-ich, "Muss ich …?", "هل يجب عليّ …؟"]
  - [jeden-tag, "jeden Tag", "كل يوم"]
  - [von-bis, "von … bis …", "من … إلى …"]
  - [vier-stunden, "vier Stunden", "أربع ساعات"]
  - [sie-muessen, "Sie müssen", "يجب عليكِ"]
  - [bezahlen, "bezahlen", "يدفع"]
  - [das-amt, "das Amt", "الدائرة الرسمية"]
  - [viel-lernen, "viel lernen", "أتعلّم كثيرًا"]
dialogue:
  - [lehrerin, "Guten Morgen! Willkommen im Integrationskurs.", "صباح الخير! أهلًا بكِ في دورة الاندماج."]
  - [protagonist, "Guten Morgen. Bin ich hier richtig? Kurs A1?", "صباح الخير. هل أنا في المكان الصحيح؟ دورة A1؟"]
  - [lehrerin, "Ja, richtig. Schreiben Sie bitte Ihren Namen hier.", "نعم، صحيح. اكتبي اسمكِ هنا من فضلك."]
  - [protagonist, "Muss ich jeden Tag kommen?", "هل يجب أن آتي كل يوم؟"]
  - [lehrerin, "Ja, Sie müssen jeden Tag kommen. Von Montag bis Freitag, vier Stunden.", "نعم، يجب أن تأتي كل يوم. من الاثنين إلى الجمعة، أربع ساعات."]
  - [protagonist, "Vier Stunden! Und die Kita?", "أربع ساعات! والحضانة؟"]
  - [lehrerin, "Der Kurs ist von acht bis zwölf. Die Kita ist länger offen.", "الدورة من الثامنة إلى الثانية عشرة. والحضانة مفتوحة لوقت أطول."]
  - [protagonist, "Gut. Muss ich etwas bezahlen?", "جيد. هل يجب أن أدفع شيئًا؟"]
  - [lehrerin, "Das klären wir mit dem Amt.", "هذا نوضّحه مع الدائرة الرسمية."]
  - [protagonist, "Danke. Ich muss viel lernen!", "شكرًا. يجب أن أتعلّم كثيرًا!"]
teach:
  - ask: ["اسألي: هل أنا في المكان الصحيح؟", "Bin ich hier richtig?", bin-ich-richtig]
  - ask: ["قولي: الدورة.", "Der Kurs.", der-kurs]
  - ask: ["تطلب منكِ أن تكتبي اسمكِ. كيف؟", "Schreiben Sie Ihren Namen.", schreiben-sie, ihren-namen]
  - note: ["«müssen» يعني: يجب. «ich muss»، «Sie müssen». والفعل الثاني يذهب إلى آخر الجملة: «Ich muss jeden Tag kommen»."]
  - ask: ["اسألي: هل يجب أن آتي كل يوم؟", "Muss ich jeden Tag kommen?", muss-ich, jeden-tag]
  - ask: ["تقول: يجب أن تأتي كل يوم.", "Sie müssen jeden Tag kommen.", sie-muessen, jeden-tag]
  - ask: ["قولي: من الاثنين إلى الجمعة.", "Von Montag bis Freitag.", von-bis]
  - ask: ["قولي: أربع ساعات!", "Vier Stunden!", vier-stunden]
  - ask: ["اسألي: هل يجب أن أدفع شيئًا؟", "Muss ich etwas bezahlen?", bezahlen]
  - ask: ["تقول: نوضّح ذلك مع الدائرة الرسمية.", "Das klären wir mit dem Amt.", das-amt]
  - ask: ["قولي: يجب أن أتعلّم كثيرًا!", "Ich muss viel lernen!", viel-lernen]
  - note: ["دورة الاندماج فيها حصص لغة ثم دورة توجيه عن الحياة في ألمانيا، وتنتهي بامتحان. من يدفع وكم، ومن يجب عليه الحضور، يحدده المكتب الاتحادي للهجرة (BAMF) أو مكتب العمل حسب الحالة — اسألي قبل البدء، فالقواعد تتغير."]
  - only: {ar: "كثير من الدورات توفّر رعاية للأطفال، أو مواعيد تناسب الحضانة. لا تترددي في أن تقولي: «Ich habe ein Kind»."}
