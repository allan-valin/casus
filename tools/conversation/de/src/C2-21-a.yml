id: C2-21-a
tracks: [ar]
protagonist: f
title: ["زيارة العائلة"]
situation: ["أول زيارة منذ سنوات لعائلتكِ في غازي عنتاب. يارا، العاشرة الآن، تسألكِ بالألمانية — لغتها الأسهل."]
learn: [c2-register-shifts]
culture: Reverse culture shock
items:
  - [fremd-geworden, "fremd geworden", "صار غريبًا"]
  - [der-umgekehrte-kulturschock, "der umgekehrte Kulturschock", "الصدمة الثقافية المعاكسة", {rare: true}]
  - [zwischen-den-stuehlen, "zwischen den Stühlen sitzen", "الوقوف بين عالمين"]
  - [die-diaspora, "die Diaspora", "الشتات"]
  - [sich-veraendert, "sich verändert haben", "تغيّر"]
  - [die-sehnsucht, "die Sehnsucht", "الحنين"]
  - [die-erinnerung-c2, "die Erinnerungen", "الذكريات"]
  - [die-cousins, "die Cousins und Cousinen", "أبناء وبنات العم والخال"]
  - [verstehen-nicht-alles, "nicht alles verstehen", "لا يفهم كل شيء"]
  - [doppelt-zuhause, "doppelt zu Hause", "في البيت مرتين"]
dialogue:
  - [yara, "Mama, warum lachen alle, wenn ich Arabisch spreche?", "ماما، لماذا يضحك الجميع حين أتكلّم العربية؟"]
  - [protagonist, "Weil du einen deutschen Akzent hast, mein Schatz. Das ist lieb gemeint.", "لأنّ لديكِ لكنة ألمانية يا حبيبتي. يقصدون ذلك بلطف."]
  - [yara, "Ich verstehe nicht alles. Die Cousins sprechen so schnell.", "لا أفهم كل شيء. أبناء العم يتكلّمون بسرعة كبيرة."]
  - [protagonist, "Mir geht es auch so — manches ist mir fremd geworden. Alles hat sich verändert.", "وأنا كذلك — بعض الأمور صارت غريبة عليّ. كل شيء تغيّر."]
  - [yara, "Vermisst du Aleppo?", "هل تشتاقين إلى حلب؟"]
  - [protagonist, "Ich habe Sehnsucht nach meinen Erinnerungen. Aber die Familie ist jetzt überall — hier, in Leipzig, in der Diaspora.", "أحنّ إلى ذكرياتي. لكن العائلة الآن في كل مكان — هنا، في لايبزيغ، في الشتات."]
  - [yara, "Und wo sind wir zu Hause?", "وأين بيتنا؟"]
  - [protagonist, "Wir sind doppelt zu Hause. Auch wenn wir manchmal zwischen den Stühlen sitzen.", "نحن في البيت مرتين. حتى لو وقفنا أحيانًا بين عالمين."]
teach:
  - ask: ["قولي: بعض الأمور صارت غريبة عليّ.", "Manches ist mir fremd geworden.", fremd-geworden]
  - ask: ["قولي: كل شيء تغيّر.", "Alles hat sich verändert.", sich-veraendert]
  - note: ["تغيّر الأسلوب يدلّ على الحال بين بين: تتكلّمين مع ابنتكِ بالألمانية عن البلد، وبحنان («mein Schatz»). والتعبير «zwischen den Stühlen sitzen» يعني الجلوس بين كرسيين، أي بين عالمين."]
  - ask: ["قولي: أبناء وبنات العم.", "Die Cousins und Cousinen.", die-cousins]
  - ask: ["قولي: لا أفهم كل شيء.", "Ich verstehe nicht alles.", verstehen-nicht-alles]
  - ask: ["قولي: أحنّ إلى ذكرياتي.", "Ich habe Sehnsucht nach meinen Erinnerungen.", die-sehnsucht, die-erinnerung-c2]
  - ask: ["قولي: في الشتات.", "In der Diaspora.", die-diaspora]
  - ask: ["قولي: نحن في البيت مرتين.", "Wir sind doppelt zu Hause.", doppelt-zuhause]
  - ask: ["قولي: بين عالمين.", "Zwischen den Stühlen.", zwischen-den-stuehlen]
  - ask: ["قولي: الصدمة الثقافية المعاكسة.", "Der umgekehrte Kulturschock.", der-umgekehrte-kulturschock]
  - note: ["كثير من العائلات السورية مشتّتة اليوم بين بلدان عدة. والأطفال الذين نشؤوا في ألمانيا قد يتكلّمون العربية بلكنة ويشعرون بالغربة في زيارات العائلة — هذا طبيعي. ومن المفيد أن تُحافظ لغة البيت حيّة، دون ضغط على الأطفال."]
