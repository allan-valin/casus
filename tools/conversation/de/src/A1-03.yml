id: A1-03
protagonist: f
title: ["The body", "الجسم", "Телото"]
situation:
  - "Your head hurts. A first visit to Dr Wagner, the family doctor."
  - "رأسك يؤلمك. زيارتك الأولى للطبيبة فاغنر، طبيبة العائلة."
  - "Ве боли главата. Прва посета кај д-р Вагнер, матичната лекарка."
learn: [a1-possessive]
culture: —
items:
  - [was-fehlt-ihnen, "Was fehlt Ihnen?", "What's wrong? (polite)", "ما بكِ؟ (بصيغة الاحترام)", "Што ви е?"]
  - [mein, "mein", "my", "ـي (ضمير الملكية)", "мој"]
  - [der-kopf, "der Kopf", "the head", "الرأس", "главата"]
  - [tut-weh, "tut weh", "hurts", "يؤلم", "боли"]
  - [der-bauch, "der Bauch", "the belly", "البطن", "стомакот"]
  - [seit-wann, "Seit wann?", "Since when?", "منذ متى؟", "Од кога?"]
  - [seit-gestern, "seit gestern", "since yesterday", "منذ أمس", "од вчера"]
  - [haben-sie, "Haben Sie …?", "Do you have …? (polite)", "هل عندكِ …؟ (بصيغة الاحترام)", "Имате ли …?"]
  - [fieber, "Fieber", "fever, temperature", "حمّى، حرارة", "температура"]
  - [kein, "kein", "no, not a", "لا … (نفي الاسم)", "нема, ниту еден"]
  - [der-arm, "der Arm", "the arm", "الذراع", "раката"]
  - [auch, "auch", "too, also", "أيضًا", "исто така"]
  - [nicht-schlimm, "nicht schlimm", "not serious", "ليس خطيرًا", "не е страшно"]
  - [viel-wasser, "viel Wasser", "plenty of water", "ماء كثير", "многу вода"]
  - [frau-doktor, "Frau Doktor", "Doctor (addressing a woman)", "حضرة الطبيبة", "госпоѓо докторке"]
dialogue:
  - [wagner, "Guten Tag. Was fehlt Ihnen?", "Hello. What's wrong?", "نهارك سعيد. ما بكِ؟", "Добар ден. Што ви е?"]
  - [protagonist, "Mein Kopf tut weh. Und mein Bauch.", "My head hurts. And my belly.", "رأسي يؤلمني. وبطني أيضًا.", "Ме боли главата. И стомакот."]
  - [wagner, "Seit wann?", "Since when?", "منذ متى؟", "Од кога?"]
  - [protagonist, "Seit gestern.", "Since yesterday.", "منذ أمس.", "Од вчера."]
  - [wagner, "Haben Sie Fieber?", "Do you have a temperature?", "هل عندكِ حرارة؟", "Имате ли температура?"]
  - [protagonist, "Nein, kein Fieber. Aber mein Arm tut auch ein bisschen weh.", "No, no temperature. But my arm hurts a little too.", "لا، لا حرارة. لكن ذراعي تؤلمني قليلًا أيضًا.", "Не, немам температура. Но и раката малку ме боли."]
  - [wagner, "Das ist nicht schlimm. Trinken Sie viel Wasser und ruhen Sie sich aus.", "That's not serious. Drink plenty of water and rest.", "هذا ليس خطيرًا. اشربي ماءً كثيرًا وارتاحي.", "Тоа не е страшно. Пијте многу вода и одморете се."]
  - [protagonist, "Danke, Frau Doktor.", "Thank you, Doctor.", "شكرًا يا حضرة الطبيبة.", "Благодарам, госпоѓо докторке."]
teach:
  - ask: ["The doctor asks what's wrong. How?", "تسألك الطبيبة ما بكِ. كيف؟", "Лекарката прашува што ви е. Како?", "Was fehlt Ihnen?", was-fehlt-ihnen]
  - note: ["«tut weh» — hurts. «Mein Kopf tut weh»: word for word, 'my head does pain'. «mein» goes with «der» and «das» words; with «die» words it becomes «meine»: «meine Hand».", "«tut weh» تعني: يؤلم. «Mein Kopf tut weh» حرفيًا: رأسي يفعل ألمًا. «mein» تأتي مع أسماء «der» و«das»؛ ومع أسماء «die» تصبح «meine»: «meine Hand».", "«tut weh» — боли. «Mein Kopf tut weh»: збор по збор, „мојата глава прави болка“. «mein» оди со именки со «der» и «das»; со «die» станува «meine»: «meine Hand»."]
  - ask: ["Say: my head hurts.", "قولي: رأسي يؤلمني.", "Кажете: ме боли главата.", "Mein Kopf tut weh.", mein, der-kopf, tut-weh]
  - ask: ["Say: and my belly.", "قولي: وبطني.", "Кажете: и стомакот.", "Und mein Bauch.", der-bauch]
  - ask: ["She asks since when. How?", "تسأل منذ متى. كيف؟", "Прашува од кога. Како?", "Seit wann?", seit-wann]
  - ask: ["Answer: since yesterday.", "أجيبي: منذ أمس.", "Одговорете: од вчера.", "Seit gestern.", seit-gestern]
  - ask: ["She asks if you have a temperature.", "تسألك إن كانت عندكِ حرارة.", "Ве прашува дали имате температура.", "Haben Sie Fieber?", haben-sie, fieber]
  - note: ["«kein» says 'no' before a noun: «kein Fieber», no temperature. «nicht» says 'not' for the rest: «nicht schlimm».", "«kein» تنفي الاسم: «kein Fieber»، لا حرارة. و«nicht» تنفي غير ذلك: «nicht schlimm»، ليس خطيرًا.", "«kein» негира именка: «kein Fieber», нема температура. «nicht» негира сè друго: «nicht schlimm», не е страшно."]
  - ask: ["Say: no, no temperature.", "قولي: لا، لا حرارة.", "Кажете: не, немам температура.", "Nein, kein Fieber.", kein, fieber]
  - ask: ["Say: my arm hurts too.", "قولي: ذراعي تؤلمني أيضًا.", "Кажете: и раката ме боли.", "Mein Arm tut auch weh.", der-arm, auch, tut-weh]
  - ask: ["She says: that's not serious.", "تقول: هذا ليس خطيرًا.", "Таа вели: тоа не е страшно.", "Das ist nicht schlimm.", nicht-schlimm]
  - ask: ["Say: plenty of water.", "قولي: ماء كثير.", "Кажете: многу вода.", "Viel Wasser.", viel-wasser]
  - ask: ["Thank the doctor.", "اشكري الطبيبة.", "Заблагодарете ѝ на лекарката.", "Danke, Frau Doktor.", frau-doktor]
  - note: ["You see a family doctor (Hausarzt) first, with your health insurance card; specialists usually after a referral. Appointments are booked, often by phone or app.", "تزورين أولًا طبيب العائلة (Hausarzt) ومعكِ بطاقة التأمين الصحي؛ وإلى الأخصائي غالبًا بتحويل. المواعيد تُحجز مسبقًا بالهاتف أو بتطبيق.", "Прво одите кај матичен лекар (Hausarzt) со картичката од здравственото осигурување; кај специјалист обично со упат. Терминот се закажува, често по телефон или апликација."]
