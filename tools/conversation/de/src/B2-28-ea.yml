id: B2-28-ea
tracks: [en, ar]
protagonist: m
title: ["Farewell", "الوداع"]
situation:
  - "Your last day. In Germany the one who leaves brings the food — so you bring a cake, and give a short speech."
  - "يومك الأخير. في ألمانيا من يغادر هو من يُحضر الطعام — فتُحضر كعكة وتلقي كلمة قصيرة."
learn: [b2-formal-speech]
culture: You bring your own cake
items:
  - [der-ausstand, "der Ausstand", "the leaving do", "حفلة الوداع", {rare: true}]
  - [der-letzte-arbeitstag, "der letzte Arbeitstag", "the last working day", "آخر يوم عمل"]
  - [liebe-kollegen, "Liebe Kolleginnen und Kollegen", "Dear colleagues", "زميلاتي وزملائي الأعزاء"]
  - [der-dank, "der Dank", "thanks, gratitude", "الشكر"]
  - [ich-moechte-mich-bedanken, "Ich möchte mich bedanken", "I'd like to say thank you", "أودّ أن أشكركم"]
  - [die-zusammenarbeit, "die Zusammenarbeit", "the cooperation", "التعاون"]
  - [vermissen-team, "Ihr werdet mir fehlen", "I'll miss you", "سأفتقدكم"]
  - [in-kontakt-bleiben, "in Kontakt bleiben", "stay in touch", "يبقى على تواصل"]
  - [die-karte, "die Abschiedskarte", "the farewell card", "بطاقة الوداع", {rare: true}]
  - [selbst-mitbringen, "selbst mitbringen", "bring yourself", "يُحضر بنفسه"]
  - [alles-gute, "Alles Gute!", "All the best!", "كل التوفيق!"]
dialogue:
  - [tim, "Du hast selbst Kuchen mitgebracht? Sehr deutsch!", "You brought cake yourself? Very German!", "أحضرتَ الكعكة بنفسك؟ ألماني جدًا!"]
  - [protagonist, "Sabine hat es mir erklärt: beim Ausstand und am Geburtstag bringt man selbst etwas mit.", "Sabine explained it to me: at a leaving do and on your birthday you bring something yourself.", "سابينه شرحت لي: في حفلة الوداع وفي عيد الميلاد يُحضر المرء شيئًا بنفسه."]
  - [schroeder, "Darf ich um Ruhe bitten? Unser Kollege möchte etwas sagen.", "May I ask for quiet? Our colleague would like to say something.", "هل لي أن أطلب الهدوء؟ زميلنا يودّ أن يقول شيئًا."]
  - [protagonist, "Liebe Kolleginnen und Kollegen, heute ist mein letzter Arbeitstag. Ich möchte mich bei Ihnen bedanken.", "Dear colleagues, today is my last working day. I'd like to thank you.", "زميلاتي وزملائي الأعزاء، اليوم آخر يوم عمل لي. أودّ أن أشكركم."]
  - [protagonist, "Für die gute Zusammenarbeit, für die Geduld mit meinem Deutsch — und für das ehrliche Feedback.", "For the good cooperation, for the patience with my German — and for the honest feedback.", "على التعاون الجيد، وعلى الصبر على لغتي الألمانية — وعلى الملاحظات الصريحة."]
  - [schroeder, "Sie werden uns fehlen. Hier ist eine Abschiedskarte von allen. Alles Gute!", "We'll miss you. Here's a farewell card from everyone. All the best!", "سنفتقدك. هذه بطاقة وداع من الجميع. كل التوفيق!"]
  - [protagonist, "Danke! Ihr werdet mir auch fehlen. Lasst uns in Kontakt bleiben.", "Thank you! I'll miss you too. Let's stay in touch.", "شكرًا! سأفتقدكم أنا أيضًا. لنبقَ على تواصل."]
  - [tim, "Klar. Und jetzt: Kuchen!", "Sure. And now: cake!", "طبعًا. والآن: الكعكة!"]
teach:
  - ask: ["Say: the leaving do.", "قل: حفلة الوداع.", "Der Ausstand.", der-ausstand]
  - ask: ["Say: you bring something yourself.", "قل: يُحضر المرء شيئًا بنفسه.", "Man bringt selbst etwas mit.", selbst-mitbringen]
  - ask: ["Open your speech to colleagues.", "افتتح كلمتك لزملائك.", "Liebe Kolleginnen und Kollegen,", liebe-kollegen]
  - ask: ["Say: today is my last working day.", "قل: اليوم آخر يوم عمل لي.", "Heute ist mein letzter Arbeitstag.", der-letzte-arbeitstag]
  - ask: ["Say: I'd like to thank you.", "قل: أودّ أن أشكركم.", "Ich möchte mich bei Ihnen bedanken.", ich-moechte-mich-bedanken]
  - ask: ["Say: for the good cooperation.", "قل: على التعاون الجيد.", "Für die gute Zusammenarbeit.", die-zusammenarbeit]
  - ask: ["Say: with thanks.", "قل: مع الشكر.", "Mit Dank.", der-dank]
  - ask: ["Say: I'll miss you (all).", "قل: سأفتقدكم.", "Ihr werdet mir fehlen.", vermissen-team]
  - ask: ["Say: let's stay in touch.", "قل: لنبقَ على تواصل.", "Lasst uns in Kontakt bleiben.", in-kontakt-bleiben]
  - ask: ["Say: a farewell card.", "قل: بطاقة وداع.", "Eine Abschiedskarte.", die-karte]
  - ask: ["Wish: all the best!", "تمنَّ: كل التوفيق!", "Alles Gute!", alles-gute]
  - note: ["In German workplaces the person celebrating pays: on your birthday and at your leaving do you bring cake or food for the team yourself. Colleagues sign a card and often collect for a small present. A short speech of thanks is expected.", "في أماكن العمل الألمانية من يحتفل هو من يدفع: في عيد ميلادك وفي حفلة وداعك تُحضر الكعك أو الطعام للفريق بنفسك. والزملاء يوقّعون بطاقة ويجمعون غالبًا لهدية صغيرة. ويُتوقَّع منك كلمة شكر قصيرة."]
