id: A2-08-a
tracks: [ar]
protagonist: m
title: ["اجتماع أولياء الأمور"]
situation: ["أمسية أولياء الأمور في الحضانة. السيدة كروغر تتحدث عن احتفال الفوانيس."]
learn: [de-mis_02]
culture: Bringing food, asking about pork
items:
  - [der-elternabend, "der Elternabend", "أمسية أولياء الأمور", {rare: true}]
  - [das-laternenfest, "das Laternenfest", "احتفال الفوانيس", {rare: true}]
  - [die-laterne, "die Laterne", "الفانوس"]
  - [basteln, "basteln", "يصنع يدويًا"]
  - [mitbringen, "mitbringen", "يُحضر معه"]
  - [die-einladung, "die Einladung", "الدعوة"]
  - [die-liste, "die Liste", "القائمة"]
  - [ohne-schwein, "ohne Schweinefleisch", "بلا لحم خنزير"]
  - [die-ueberraschung, "die Überraschung", "المفاجأة"]
  - [die-erzieherin-a, "die Erzieherinnen", "المربيات"]
dialogue:
  - [kruger, "Willkommen zum Elternabend! Am Freitag ist das Laternenfest.", "أهلًا بكم في أمسية أولياء الأمور! يوم الجمعة احتفال الفوانيس."]
  - [protagonist, "Was ist ein Laternenfest?", "ما هو احتفال الفوانيس؟"]
  - [kruger, "Die Kinder basteln Laternen, und wir gehen am Abend zusammen spazieren und singen.", "يصنع الأطفال فوانيس، ونتمشى معًا في المساء ونغني."]
  - [protagonist, "Schön! Soll ich etwas mitbringen?", "جميل! هل أحضر شيئًا معي؟"]
  - [kruger, "Ja, hier ist die Liste. Jede Familie bringt etwas zu essen mit.", "نعم، هذه القائمة. كل عائلة تحضر شيئًا من الطعام."]
  - [protagonist, "Ich bringe Gebäck mit. Und die Würstchen — sind sie ohne Schweinefleisch?", "سأحضر معجنات. والنقانق — هل هي بلا لحم خنزير؟"]
  - [kruger, "Gute Frage! Wir machen auch Würstchen aus Geflügel.", "سؤال جيد! سنحضّر أيضًا نقانق من الدجاج."]
  - [protagonist, "Danke für die Einladung. Yara wird sich freuen.", "شكرًا على الدعوة. يارا ستفرح."]
teach:
  - ask: ["قل: أمسية أولياء الأمور.", "Der Elternabend.", der-elternabend]
  - ask: ["قل: احتفال الفوانيس.", "Das Laternenfest.", das-laternenfest]
  - ask: ["قل: الأطفال يصنعون فوانيس.", "Die Kinder basteln Laternen.", basteln, die-laterne]
  - ask: ["اسأل: هل أحضر شيئًا؟", "Soll ich etwas mitbringen?", mitbringen]
  - ask: ["قل: القائمة.", "Die Liste.", die-liste]
  - ask: ["اسأل: هل هي بلا لحم خنزير؟", "Sind sie ohne Schweinefleisch?", ohne-schwein]
  - note: ["كثير من الأسماء تنتهي بـ«-ung»، وهي مؤنثة دائمًا («die»)، وتأتي من الأفعال: «einladen» → «die Einladung»، «überraschen» → «die Überraschung»."]
  - ask: ["قل: شكرًا على الدعوة.", "Danke für die Einladung.", die-einladung]
  - ask: ["قل: المفاجأة.", "Die Überraschung.", die-ueberraschung]
  - ask: ["قل: المربيات.", "Die Erzieherinnen.", die-erzieherin-a]
  - note: ["احتفال القديس مارتن («Sankt Martin») في نوفمبر: الأطفال يمشون بفوانيس ويغنّون. أصله ديني، لكنه في الحضانات احتفال للجميع. والسؤال عن لحم الخنزير عادي ومفهوم."]
