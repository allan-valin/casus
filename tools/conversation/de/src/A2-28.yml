id: A2-28
protagonist: m
title: ["Homesickness", "الحنين إلى الوطن", "Носталгија"]
situation:
  - "A grey Sunday evening, alone. You call home, and afterwards Jonas knocks."
  - "مساء أحد رمادي، وحدك. تتصل بالأهل، وبعدها يطرق يوناس الباب."
  - "Сива недела навечер, сам. Се јавувате дома, а потоа Јонас чука."
learn: [a2-reflexive-dative]
culture: Loneliness is normal at first
items:
  - [das-heimweh, "das Heimweh", "homesickness", "الحنين إلى الوطن", "носталгијата"]
  - [einsam, "einsam", "lonely", "وحيد", "осамено"]
  - [ich-vermisse, "ich vermisse", "I miss", "أشتاق إلى", "ми недостига"]
  - [ich-mache-mir-sorgen, "ich mache mir Sorgen", "I'm worried", "أنا قلق", "се грижам"]
  - [ich-wuensche-mir, "ich wünsche mir", "I wish for", "أتمنى", "посакувам"]
  - [das-ist-normal, "das ist normal", "that's normal", "هذا طبيعي", "тоа е нормално"]
  - [am-anfang, "am Anfang", "at the beginning", "في البداية", "на почетокот"]
  - [es-wird-besser, "es wird besser", "it gets better", "سيتحسّن الوضع", "ќе биде подобро"]
  - [komm-rein, "Komm rein!", "Come in! (informal)", "ادخل!", "Влези!"]
  - [ich-koche-uns, "ich koche uns …", "I'll cook us …", "أطبخ لنا …", "ќе ни зготвам …"]
dialogue:
  - [jonas, "Hey, alles okay? Du siehst traurig aus.", "Hey, all OK? You look sad.", "مرحبًا، هل كل شيء بخير؟ تبدو حزينًا.", "Еј, сè во ред? Изгледаш тажно."]
  - [protagonist, "Ich habe Heimweh. Ich vermisse meine Familie.", "I'm homesick. I miss my family.", "عندي حنين إلى الوطن. أشتاق إلى عائلتي.", "Имам носталгија. Ми недостига семејството."]
  - [jonas, "Das ist normal, am Anfang.", "That's normal, at the beginning.", "هذا طبيعي في البداية.", "Тоа е нормално, на почетокот."]
  - [protagonist, "Ich fühle mich einsam. Und ich mache mir Sorgen um meine Eltern.", "I feel lonely. And I'm worried about my parents.", "أشعر بالوحدة. وأنا قلق على والديّ.", "Се чувствувам осамено. И се грижам за родителите."]
  - [jonas, "Es wird besser. Glaub mir.", "It gets better. Believe me.", "سيتحسّن الوضع. صدّقني.", "Ќе биде подобро. Верувај ми."]
  - [protagonist, "Ich wünsche mir nur einen Abend wie zu Hause.", "I just wish for an evening like at home.", "أتمنى فقط أمسية مثل أمسيات البيت.", "Посакувам само една вечер како дома."]
  - [jonas, "Dann komm rein! Ich koche uns Nudeln. Und du erzählst mir von zu Hause.", "Then come in! I'll cook us pasta. And you tell me about home.", "إذن ادخل! سأطبخ لنا معكرونة. وأنت تحكي لي عن بلدك.", "Тогаш влези! Ќе ни зготвам тестенини. А ти раскажи ми за дома."]
  - [protagonist, "Danke, Jonas. Das tut gut.", "Thanks, Jonas. That does me good.", "شكرًا يا يوناس. هذا يريحني.", "Благодарам, Јонас. Ова ми прија."]
teach:
  - ask: ["Say: I'm homesick.", "قل: عندي حنين إلى الوطن.", "Кажете: имам носталгија.", "Ich habe Heimweh.", das-heimweh]
  - ask: ["Say: I miss my family.", "قل: أشتاق إلى عائلتي.", "Кажете: ми недостига семејството.", "Ich vermisse meine Familie.", ich-vermisse]
  - ask: ["Jonas says: that's normal, at the beginning.", "يوناس يقول: هذا طبيعي في البداية.", "Јонас вели: нормално е на почетокот.", "Das ist normal, am Anfang.", das-ist-normal, am-anfang]
  - ask: ["Say: I feel lonely.", "قل: أشعر بالوحدة.", "Кажете: се чувствувам осамено.", "Ich fühle mich einsam.", einsam]
  - note: ["Some reflexive phrases use «mir» (dative): «ich mache mir Sorgen» (I'm worried), «ich wünsche mir» (I wish for).", "بعض العبارات الانعكاسية تستعمل «mir» (حالة الجر): «ich mache mir Sorgen» (أنا قلق)، «ich wünsche mir» (أتمنى).", "Некои повратни изрази користат «mir» (датив): «ich mache mir Sorgen» (се грижам), «ich wünsche mir» (посакувам)."]
  - ask: ["Say: I'm worried about my parents.", "قل: أنا قلق على والديّ.", "Кажете: се грижам за родителите.", "Ich mache mir Sorgen um meine Eltern.", ich-mache-mir-sorgen]
  - ask: ["Say: I wish for an evening like at home.", "قل: أتمنى أمسية مثل أمسيات البيت.", "Кажете: посакувам вечер како дома.", "Ich wünsche mir einen Abend wie zu Hause.", ich-wuensche-mir]
  - ask: ["He says: it gets better.", "يقول: سيتحسّن الوضع.", "Тој вели: ќе биде подобро.", "Es wird besser.", es-wird-besser]
  - ask: ["He says: come in!", "يقول: ادخل!", "Тој вели: влези!", "Komm rein!", komm-rein]
  - ask: ["He says: I'll cook us pasta.", "يقول: سأطبخ لنا معكرونة.", "Тој вели: ќе ни зготвам тестенини.", "Ich koche uns Nudeln.", ich-koche-uns]
  - note: ["Homesickness often peaks in the first winter: short days, little contact. Say it to someone — neighbours, the club, the course. Universities and cities offer counselling in many languages.", "الحنين يبلغ ذروته غالبًا في الشتاء الأول: أيام قصيرة وتواصل قليل. قلها لأحد — للجيران، للنادي، للدورة. والجامعات والمدن تقدّم استشارات بلغات كثيرة.", "Носталгијата често е најсилна во првата зима: кратки денови, малку контакти. Кажете му некому — на соседите, во клубот, на курсот. Универзитетите и градовите нудат советување на многу јазици."]
