id: C2-05
protagonist: f
title: ["Understanding Saxon", "فهم اللهجة السكسونية", "Да се разбере саксонскиот"]
situation:
  - "Sunday lunch at Svenja's grandfather's. Opa Lehmann speaks broad Saxon — and enjoys testing you."
  - "غداء الأحد عند جدّ سفينيا. الجدّ ليمان يتكلّم السكسونية الثقيلة — ويستمتع باختباركِ."
  - "Неделен ручек кај дедото на Свења. Дедо Леман зборува тежок саксонски — и ужива да ве тестира."
learn: [c2-dialect]
culture: Saxon
items:
  - [die-bemme, "die Bemme", "slice of bread (Saxon)", "شريحة خبز (سكسونية)", "парче леб (саксонски)", {rare: true}]
  - [mir-wir, "mir = wir", "we (Saxon 'mir')", "نحن (mir بالسكسونية)", "ние (саксонски „mir“)"]
  - [ni, "ni = nicht", "not (Saxon 'ni')", "لا (ni بالسكسونية)", "не (саксонски „ni“)"]
  - [heeme, "heeme = heim", "home (Saxon 'heeme')", "إلى البيت (heeme)", "дома (саксонски „heeme“)", {rare: true}]
  - [ei-verbibbsch, "Ei verbibbsch!", "Good grief! (Saxon)", "يا للعجب! (سكسونية)", "Леле! (саксонски)", {rare: true}]
  - [der-dialektwort, "das Dialektwort", "the dialect word", "كلمة لهجية", "дијалектниот збор"]
  - [hochdeutsch-c2, "auf Hochdeutsch", "in standard German", "بالألمانية الفصحى", "на стандарден германски"]
  - [weich, "weich ausgesprochen", "pronounced softly", "يُنطق بليونة", "меко изговорено"]
  - [gemuetlich-c2, "urgemütlich", "really cosy", "دافئ جدًا", "многу пријатно"]
  - [der-heimatstolz, "der Heimatstolz", "pride in one's home region", "الاعتزاز بالمنطقة", "гордоста со крајот", {rare: true}]
dialogue:
  - [opa, "Nu, nehm Se sich noch ne Bemme! Mir ham genug.", "(Saxon) Go on, have another slice of bread! We've got enough.", "(بالسكسونية) هيا، خذي شريحة خبز أخرى! لدينا ما يكفي.", "(саксонски) Ајде, земете уште едно парче леб! Имаме доволно."]
  - [protagonist, "Eine Bemme? Ach — eine Scheibe Brot! Danke.", "A Bemme? Oh — a slice of bread! Thank you.", "«Bemme»؟ آه — شريحة خبز! شكرًا.", "„Bemme“? А — парче леб! Благодарам."]
  - [opa, "Ei verbibbsch! Se verstehn Sächsisch? Des hätt ich ni gedacht.", "(Saxon) Good grief! You understand Saxon? I'd never have thought.", "(بالسكسونية) يا للعجب! تفهمين السكسونية؟ ما كنتُ لأظن ذلك.", "(саксонски) Леле! Разбирате саксонски? Тоа не би го помислил."]
  - [svenja, "Opa, sie lernt seit Jahren Hochdeutsch. Sprich mal langsam!", "Grandpa, she's been learning standard German for years. Speak slowly for once!", "يا جدّي، إنها تتعلّم الفصحى منذ سنوات. تكلّم ببطء ولو مرة!", "Дедо, таа со години учи стандарден германски. Зборувај малку побавно!"]
  - [protagonist, "Nein, es macht Spaß! „Mir“ heißt „wir“, „ni“ heißt „nicht“, oder?", "No, it's fun! 'Mir' means 'we', 'ni' means 'not', right?", "لا، هذا ممتع! «mir» تعني «نحن»، و«ni» تعني «لا»، أليس كذلك؟", "Не, забавно е! „Mir“ значи „ние“, „ni“ значи „не“, нели?"]
  - [opa, "Gans genau! Und nach'm Essen gehn mir heeme.", "(Saxon) Exactly! And after the meal we go home.", "(بالسكسونية) بالضبط! وبعد الطعام نذهب إلى البيت.", "(саксонски) Точно така! А по јадењето одиме дома."]
  - [protagonist, "Heeme — nach Hause. Alles weich ausgesprochen. Urgemütlich!", "Heeme — home. Everything pronounced softly. Really cosy!", "«heeme» — إلى البيت. كل شيء يُنطق بليونة. دافئ جدًا!", "„Heeme“ — дома. Сè меко изговорено. Многу пријатно!"]
  - [opa, "Sie sin ja ne halbe Sächsin! Da bin ich stolz.", "(Saxon) You're half Saxon already! That makes me proud.", "(بالسكسونية) أنتِ نصف سكسونية بالفعل! هذا يجعلني فخورًا.", "(саксонски) Веќе сте полу Саксонка! Горд сум."]
teach:
  - ask: ["Say: a slice of bread, the Saxon way.", "قولي: شريحة خبز، على الطريقة السكسونية.", "Кажете: парче леб, на саксонски.", "Eine Bemme.", die-bemme]
  - ask: ["Exclaim in Saxon: good grief!", "اهتفي بالسكسونية: يا للعجب!", "Извикајте на саксонски: леле!", "Ei verbibbsch!", ei-verbibbsch]
  - note: ["Saxon in brief: k, p, t soften to g, b, d («Gaffee», «Bemme»); «mir» = wir, «ni» = nicht, «heeme» = heim; vowels are rounded and soft. Understand it — you don't have to speak it.", "السكسونية باختصار: k وp وt تلين إلى g وb وd («Gaffee»، «Bemme»)؛ «mir» = wir، «ni» = nicht، «heeme» = heim؛ والحروف الصائتة مدوّرة ليّنة. افهميها — لستِ مضطرة للتكلّم بها.", "Саксонски накратко: k, p, t омекнуваат во g, b, d («Gaffee», «Bemme»); «mir» = wir, «ni» = nicht, «heeme» = heim; самогласките се заоблени и меки. Разберете го — не мора да го зборувате."]
  - ask: ["Say: 'mir' means 'we'.", "قولي: «mir» تعني «نحن».", "Кажете: „mir“ значи „ние“.", "„Mir“ heißt „wir“.", mir-wir]
  - ask: ["Say: 'ni' means 'not'.", "قولي: «ni» تعني «لا».", "Кажете: „ni“ значи „не“.", "„Ni“ heißt „nicht“.", ni]
  - ask: ["Say: 'heeme' — home.", "قولي: «heeme» — إلى البيت.", "Кажете: „heeme“ — дома.", "Heeme — nach Hause.", heeme]
  - ask: ["Say: pronounced softly.", "قولي: يُنطق بليونة.", "Кажете: меко изговорено.", "Weich ausgesprochen.", weich]
  - ask: ["Say: really cosy!", "قولي: دافئ جدًا!", "Кажете: многу пријатно!", "Urgemütlich!", gemuetlich-c2]
  - ask: ["Say: in standard German.", "قولي: بالألمانية الفصحى.", "Кажете: на стандарден германски.", "Auf Hochdeutsch.", hochdeutsch-c2]
  - ask: ["Say: a dialect word.", "قولي: كلمة لهجية.", "Кажете: дијалектен збор.", "Ein Dialektwort.", der-dialektwort]
  - ask: ["Say: pride in one's home region.", "قولي: الاعتزاز بالمنطقة.", "Кажете: гордост со крајот.", "Der Heimatstolz.", der-heimatstolz]
  - note: ["Saxon is often mocked in Germany — Saxons know it and joke about it themselves. Showing interest in someone's dialect is a warm compliment; imitating it to make fun of them is not.", "السكسونية كثيرًا ما يُسخر منها في ألمانيا — والسكسونيون يعرفون ذلك ويمزحون عنه بأنفسهم. وإظهار الاهتمام بلهجة أحدهم مجاملة دافئة؛ أما تقليدها للسخرية منه فلا.", "Саксонскиот често се исмева во Германија — Саксонците го знаат тоа и самите се шегуваат. Интересот за нечиј дијалект е топол комплимент; имитирањето за да се исмева не е."]
