id: C2-11
protagonist: f
title: ["The family business", "المشروع العائلي", "Семејниот бизнис"]
situation:
  - "Herr Yilmaz is retiring after thirty years. His daughter Elif takes over the shop — and changes a few things."
  - "السيد يلماز يتقاعد بعد ثلاثين عامًا. ابنته إليف تتولّى المتجر — وتغيّر بعض الأشياء."
  - "Господин Јилмаз се пензионира по триесет години. Ќерка му Елиф го презема дуќанот — и менува некои работи."
learn: [c2-nominal-style]
culture: Handing over a business
items:
  - [die-nachfolge-c2, "die Nachfolge", "succession", "الخلافة في العمل", "наследувањето (на фирмата)"]
  - [die-uebergabe-laden, "die Geschäftsübergabe", "the handover of the business", "تسليم المحل", "предавањето на дуќанот", {rare: true}]
  - [der-ruhestand, "der Ruhestand", "retirement", "التقاعد", "пензијата (состојба)"]
  - [die-stammkundschaft, "die Stammkundschaft", "the regular customers", "الزبائن الدائمون", "редовните муштерии"]
  - [die-weiterfuehrung, "die Weiterführung", "the continuation", "الاستمرار", "продолжувањето"]
  - [die-neuausrichtung, "die Neuausrichtung", "the reorientation", "إعادة التوجيه", "новата насока", {rare: true}]
  - [der-onlineshop, "der Onlineshop", "the online shop", "المتجر الإلكتروني", "онлајн продавницата"]
  - [die-tradition, "die Tradition", "tradition", "التقليد", "традицијата"]
  - [das-lebenswerk, "das Lebenswerk", "life's work", "عمل العمر", "животното дело"]
  - [unter-neuer-leitung, "unter neuer Leitung", "under new management", "بإدارة جديدة", "под ново раководство"]
dialogue:
  - [yilmaz, "Nach dreißig Jahren gehe ich in den Ruhestand. Elif übernimmt.", "After thirty years I'm retiring. Elif is taking over.", "بعد ثلاثين عامًا أتقاعد. إليف تتولّى الأمر.", "По триесет години одам во пензија. Елиф презема."]
  - [protagonist, "Ihr Lebenswerk! Fällt Ihnen die Übergabe schwer?", "Your life's work! Is the handover hard for you?", "عمل عمرك! هل يصعب عليك التسليم؟", "Вашето животно дело! Дали ви е тешко предавањето?"]
  - [yilmaz, "Ein bisschen. Aber die Nachfolge in der Familie ist ein Glück. Viele Läden schließen.", "A little. But succession within the family is lucky. Many shops close.", "قليلًا. لكن الخلافة داخل العائلة نعمة. كثير من المحلات تُغلق.", "Малку. Но наследувањето во семејството е среќа. Многу дуќани се затвораат."]
  - [elif, "Die Weiterführung ist klar — aber mit einer Neuausrichtung: Bio-Gemüse und ein Onlineshop.", "Continuing is clear — but with a new direction: organic vegetables and an online shop.", "الاستمرار واضح — لكن بتوجّه جديد: خضروات عضوية ومتجر إلكتروني.", "Продолжувањето е јасно — но со нова насока: органски зеленчук и онлајн продавница."]
  - [protagonist, "Und die Stammkundschaft? Frau Becker kauft hier seit zwanzig Jahren.", "And the regular customers? Frau Becker has shopped here for twenty years.", "والزبائن الدائمون؟ السيدة بيكر تشتري من هنا منذ عشرين عامًا.", "А редовните муштерии? Госпоѓа Бекер купува тука дваесет години."]
  - [elif, "Die Tradition bleibt: Papa steht samstags weiter auf dem Markt — und erzählt seine Witze.", "Tradition stays: Dad will still be at the market on Saturdays — telling his jokes.", "التقليد باقٍ: أبي سيبقى في السوق أيام السبت — ويحكي نكاته.", "Традицијата останува: тато и понатаму сабота е на пазарот — и раскажува шеги."]
  - [yilmaz, "Unter neuer Leitung, aber mit altem Humor!", "Under new management, but with the old humour!", "بإدارة جديدة، لكن بالفكاهة القديمة!", "Под ново раководство, но со стариот хумор!"]
  - [protagonist, "Dann viel Erfolg — Ihnen beiden!", "Then every success — to both of you!", "إذن كل النجاح — لكما أنتما الاثنين!", "Тогаш многу успех — на двајцата!"]
teach:
  - ask: ["He says: I'm retiring.", "يقول: أتقاعد.", "Тој вели: одам во пензија.", "Ich gehe in den Ruhestand.", der-ruhestand]
  - ask: ["Say: your life's work.", "قولي: عمل عمرك.", "Кажете: вашето животно дело.", "Ihr Lebenswerk.", das-lebenswerk]
  - note: ["Business German packs plans into nouns: «die Übergabe» (handing over), «die Nachfolge» (succeeding), «die Weiterführung» (carrying on), «die Neuausrichtung» (re-orienting). Elif's sentence is a plan in four nouns.", "ألمانية الأعمال تحشر الخطط في أسماء: «die Übergabe» (التسليم)، «die Nachfolge» (الخلافة)، «die Weiterführung» (الاستمرار)، «die Neuausrichtung» (إعادة التوجيه). جملة إليف خطة في أربعة أسماء.", "Деловниот германски ги пакува плановите во именки: «die Übergabe» (предавање), «die Nachfolge» (наследување), «die Weiterführung» (продолжување), «die Neuausrichtung» (нова насока). Реченицата на Елиф е план во четири именки."]
  - ask: ["Ask: is the handover hard for you?", "اسألي: هل يصعب عليك التسليم؟", "Прашајте: дали ви е тешко предавањето?", "Fällt Ihnen die Übergabe schwer?", die-uebergabe-laden]
  - ask: ["Say: succession within the family.", "قولي: الخلافة داخل العائلة.", "Кажете: наследување во семејството.", "Die Nachfolge in der Familie.", die-nachfolge-c2]
  - ask: ["Say: continuing, with a new direction.", "قولي: الاستمرار، بتوجّه جديد.", "Кажете: продолжување, со нова насока.", "Die Weiterführung mit einer Neuausrichtung.", die-weiterfuehrung, die-neuausrichtung]
  - ask: ["Say: an online shop.", "قولي: متجر إلكتروني.", "Кажете: онлајн продавница.", "Ein Onlineshop.", der-onlineshop]
  - ask: ["Say: the regular customers.", "قولي: الزبائن الدائمون.", "Кажете: редовните муштерии.", "Die Stammkundschaft.", die-stammkundschaft]
  - ask: ["Say: tradition stays.", "قولي: التقليد باقٍ.", "Кажете: традицијата останува.", "Die Tradition bleibt.", die-tradition]
  - ask: ["Say: under new management.", "قولي: بإدارة جديدة.", "Кажете: под ново раководство.", "Unter neuer Leitung.", unter-neuer-leitung]
  - note: ["Many small family firms in Germany close for lack of a successor. When children take over, they often modernise while keeping the regulars — and the old owner usually stays around for a while to hand over relationships, not just keys.", "كثير من المشاريع العائلية الصغيرة في ألمانيا تُغلق لعدم وجود خليفة. وحين يتولّى الأبناء، غالبًا ما يحدّثون المحل مع الحفاظ على الزبائن الدائمين — ويبقى المالك القديم عادةً لفترة ليسلّم العلاقات لا المفاتيح فقط.", "Многу мали семејни фирми во Германија се затвораат поради недостиг на наследник. Кога децата преземаат, често модернизираат, а ги задржуваат редовните — а стариот сопственик обично останува некое време за да ги предаде врските, не само клучевите."]
