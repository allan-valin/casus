id: C1-06
protagonist: m
title: ["The accident", "الحادث", "Несреќата"]
situation:
  - "On your bike at a crossing, a car turning right hits you. Only bruises. The police take statements."
  - "على درّاجتك عند تقاطع، سيارة تنعطف يمينًا تصدمك. كدمات فقط. الشرطة تأخذ الإفادات."
  - "Со велосипед на раскрсница, кола што свртува десно ве удира. Само модринки. Полицијата зема изјави."
learn: [de-c1-konj1-past, de-c1-konj1-substitute]
culture: Reporting an accident
items:
  - [der-unfall, "der Unfall", "the accident", "الحادث", "несреќата"]
  - [der-unfallbericht, "der Unfallbericht", "the accident report", "تقرير الحادث", "записникот за несреќата", {rare: true}]
  - [der-zeuge, "der Zeuge", "the witness", "الشاهد", "сведокот"]
  - [die-aussage, "die Aussage", "the statement", "الإفادة", "изјавата"]
  - [die-kreuzung, "die Kreuzung", "the crossing, junction", "التقاطع", "раскрсницата"]
  - [abbiegen, "abbiegen", "turn (off)", "ينعطف", "свртува"]
  - [er-behauptet-ich-sei, "er behauptet, ich sei …", "he claims I was …", "يدّعي أنني …", "тврди дека сум …"]
  - [er-habe-gesehen, "er habe … gesehen", "(reported) he saw …", "(منقولًا) إنه رأى …", "(пренесено) дека видел …"]
  - [die-vorfahrt, "die Vorfahrt", "right of way", "أولوية المرور", "првенството"]
  - [die-prellung, "die Prellung", "the bruise", "الكدمة", "модринката"]
  - [das-aktenzeichen, "das Aktenzeichen", "the case number", "رقم الملف", "бројот на предметот", {rare: true}]
dialogue:
  - [polizist, "Sind Sie verletzt?", "Are you injured?", "هل أنت مصاب؟", "Повредени ли сте?"]
  - [protagonist, "Nur eine Prellung am Knie. Ich war auf dem Radweg, er ist rechts abgebogen.", "Just a bruise on my knee. I was in the cycle lane, he turned right.", "كدمة في الركبة فقط. كنتُ على مسار الدرّاجات، وهو انعطف يمينًا.", "Само модринка на коленото. Бев на велосипедската патека, тој сврте десно."]
  - [polizist, "Der Fahrer behauptet, Sie seien bei Rot gefahren.", "The driver claims you rode through a red light.", "السائق يدّعي أنك عبرتَ والإشارة حمراء.", "Возачот тврди дека сте возеле на црвено."]
  - [protagonist, "Das stimmt nicht! Ich hatte Grün und Vorfahrt.", "That's not true! I had green and right of way.", "هذا غير صحيح! كانت الإشارة خضراء ولي أولوية المرور.", "Тоа не е точно! Имав зелено и првенство."]
  - [polizist, "Es gibt einen Zeugen. Er sagt, er habe alles gesehen.", "There's a witness. He says he saw everything.", "هناك شاهد. يقول إنه رأى كل شيء.", "Има сведок. Вели дека видел сè."]
  - [protagonist, "Und was sagt er?", "And what does he say?", "وماذا يقول؟", "А што вели?"]
  - [polizist, "Laut seiner Aussage sei die Ampel für Sie grün gewesen. Das kommt in den Unfallbericht.", "According to his statement, the light was green for you. That goes in the accident report.", "بحسب إفادته كانت الإشارة خضراء لك. هذا سيُدرج في تقرير الحادث.", "Според неговата изјава семафорот бил зелен за вас. Тоа влегува во записникот."]
  - [protagonist, "Bekomme ich eine Kopie?", "Do I get a copy?", "هل أحصل على نسخة؟", "Ќе добијам ли копија?"]
  - [polizist, "Sie bekommen ein Aktenzeichen. Damit fordert Ihre Versicherung den Bericht an.", "You get a case number. Your insurance requests the report with it.", "تحصل على رقم ملف. به يطلب تأمينك التقرير.", "Добивате број на предмет. Со него вашето осигурување го бара записникот."]
teach:
  - ask: ["Say: just a bruise on my knee.", "قل: كدمة في الركبة فقط.", "Кажете: само модринка на коленото.", "Nur eine Prellung am Knie.", die-prellung]
  - ask: ["Say: I was in the cycle lane, he turned right.", "قل: كنتُ على مسار الدرّاجات، وهو انعطف يمينًا.", "Кажете: бев на патеката, тој сврте десно.", "Ich war auf dem Radweg, er ist rechts abgebogen.", der-radweg, abbiegen]
  - note: ["Police and reports use Konjunktiv I to keep claims apart: «Der Fahrer behauptet, Sie seien bei Rot gefahren», «Er sagt, er habe alles gesehen», «die Ampel sei grün gewesen». Nobody's word is taken as fact yet.", "الشرطة والتقارير تستعمل Konjunktiv I للفصل بين الادّعاءات: «Der Fahrer behauptet, Sie seien bei Rot gefahren»، «Er sagt, er habe alles gesehen»، «die Ampel sei grün gewesen». لا يُعتبر كلام أحد حقيقة بعد.", "Полицијата и записниците користат Konjunktiv I за да ги одвојат тврдењата: «Der Fahrer behauptet, Sie seien bei Rot gefahren», «Er sagt, er habe alles gesehen», «die Ampel sei grün gewesen». Ничиј збор уште не се зема како факт."]
  - ask: ["Report: the driver claims I rode through red.", "انقل: السائق يدّعي أنني عبرتُ والإشارة حمراء.", "Пренесете: возачот тврди дека сум возел на црвено.", "Er behauptet, ich sei bei Rot gefahren.", er-behauptet-ich-sei]
  - ask: ["Say: I had right of way.", "قل: كانت لي أولوية المرور.", "Кажете: имав првенство.", "Ich hatte Vorfahrt.", die-vorfahrt]
  - ask: ["Say: at the crossing.", "قل: عند التقاطع.", "Кажете: на раскрсницата.", "An der Kreuzung.", die-kreuzung]
  - ask: ["Report: the witness says he saw everything.", "انقل: الشاهد يقول إنه رأى كل شيء.", "Пренесете: сведокот вели дека видел сè.", "Der Zeuge sagt, er habe alles gesehen.", der-zeuge, er-habe-gesehen]
  - ask: ["Say: according to his statement.", "قل: بحسب إفادته.", "Кажете: според неговата изјава.", "Laut seiner Aussage.", die-aussage]
  - ask: ["Say: the accident report.", "قل: تقرير الحادث.", "Кажете: записникот за несреќата.", "Der Unfallbericht.", der-unfallbericht, der-unfall]
  - ask: ["Say: the case number.", "قل: رقم الملف.", "Кажете: бројот на предметот.", "Das Aktenzeichen.", das-aktenzeichen]
  - note: ["After an accident: secure the place, call 110 if anyone is hurt, take names and phone numbers of witnesses and photos. Don't admit fault on the spot. Note the case number (Aktenzeichen) — insurers ask for it. Cars turning right must let cyclists going straight pass.", "بعد الحادث: أمّن المكان، واتصل بـ110 إن أُصيب أحد، وخذ أسماء الشهود وأرقامهم والتقط صورًا. لا تعترف بالخطأ في المكان. سجّل رقم الملف (Aktenzeichen) — شركات التأمين تطلبه. والسيارات المنعطفة يمينًا يجب أن تترك راكبي الدرّاجات المتقدّمين مباشرة يمرّون.", "По несреќа: обезбедете го местото, јавете се на 110 ако некој е повреден, земете имиња и телефони на сведоци и фотографии. Не признавајте вина на лице место. Запишете го бројот на предметот (Aktenzeichen) — осигурителите го бараат. Колите што свртуваат десно мора да ги пуштат велосипедистите што возат право."]
