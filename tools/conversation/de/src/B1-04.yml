id: B1-04
protagonist: m
title: ["Football", "كرة القدم", "Фудбал"]
situation:
  - "Monday after the derby. Jonas tells you how the match went — he was in the stadium."
  - "الاثنين بعد المباراة الكبيرة. يوناس يحكي لك كيف كانت المباراة — كان في الملعب."
  - "Понеделник по дербито. Јонас ви раскажува како помина натпреварот — беше на стадионот."
learn: [b1-praeteritum]
culture: Football and its fans
items:
  - [das-spiel, "das Spiel", "the match", "المباراة", "натпреварот"]
  - [das-tor, "das Tor", "the goal", "الهدف", "голот"]
  - [der-fan, "der Fan", "the fan", "المشجّع", "навивачот"]
  - [das-stadion, "das Stadion", "the stadium", "الملعب", "стадионот"]
  - [gewann, "gewann", "won", "فاز", "победи"]
  - [verlor, "verlor", "lost", "خسر", "загуби"]
  - [schoss, "schoss", "shot, scored", "سدّد، سجّل", "постигна, шутна"]
  - [die-stimmung, "die Stimmung", "the atmosphere", "الأجواء", "атмосферата"]
  - [unentschieden, "unentschieden", "a draw", "تعادل", "нерешено"]
  - [die-saison, "die Saison", "the season", "الموسم", "сезоната"]
dialogue:
  - [protagonist, "Wie war das Spiel am Samstag?", "How was the match on Saturday?", "كيف كانت المباراة يوم السبت؟", "Како беше натпреварот во сабота?"]
  - [jonas, "Super! Ich war im Stadion. Die Stimmung war unglaublich.", "Great! I was in the stadium. The atmosphere was unbelievable.", "رائعة! كنت في الملعب. الأجواء كانت لا تُصدَّق.", "Супер! Бев на стадионот. Атмосферата беше неверојатна."]
  - [protagonist, "Wer gewann?", "Who won?", "من فاز؟", "Кој победи?"]
  - [jonas, "Leipzig gewann zwei zu eins. Das zweite Tor fiel in der letzten Minute!", "Leipzig won two-one. The second goal came in the last minute!", "لايبزيغ فاز اثنين لواحد. الهدف الثاني جاء في الدقيقة الأخيرة!", "Лајпциг победи два спрема еден. Вториот гол падна во последната минута!"]
  - [protagonist, "Wer schoss das Tor?", "Who scored the goal?", "من سجّل الهدف؟", "Кој го постигна голот?"]
  - [jonas, "Ein junger Spieler aus Frankreich. Alle Fans sangen.", "A young player from France. All the fans were singing.", "لاعب شاب من فرنسا. كل المشجعين كانوا يغنّون.", "Еден млад играч од Франција. Сите навивачи пееја."]
  - [protagonist, "Und letzte Woche?", "And last week?", "والأسبوع الماضي؟", "А минатата недела?"]
  - [jonas, "Da verloren wir. Und davor unentschieden. Die Saison ist lang.", "We lost that one. And before that a draw. The season is long.", "حينها خسرنا. وقبلها تعادل. الموسم طويل.", "Тогаш изгубивме. А пред тоа нерешено. Сезоната е долга."]
teach:
  - ask: ["Ask: how was the match?", "اسأل: كيف كانت المباراة؟", "Прашајте: како беше натпреварот?", "Wie war das Spiel?", das-spiel]
  - ask: ["Say: I was in the stadium.", "قل: كنت في الملعب.", "Кажете: бев на стадионот.", "Ich war im Stadion.", das-stadion]
  - ask: ["Say: the atmosphere was unbelievable.", "قل: الأجواء كانت لا تُصدَّق.", "Кажете: атмосферата беше неверојатна.", "Die Stimmung war unglaublich.", die-stimmung]
  - note: ["Telling a story, German often uses the simple past of strong verbs: «gewann» (won), «verlor» (lost), «schoss» (shot), «sangen» (sang), «fiel» (fell). Learn them in pairs: gewinnen — gewann.", "عند سرد القصة تستعمل الألمانية غالبًا الماضي البسيط للأفعال القوية: «gewann» (فاز)، «verlor» (خسر)، «schoss» (سدّد)، «sangen» (غنّوا)، «fiel» (سقط). احفظها أزواجًا: gewinnen — gewann.", "Кога се раскажува, германскиот често користи просто минато на силните глаголи: «gewann» (победи), «verlor» (загуби), «schoss» (шутна), «sangen» (пееја), «fiel» (падна). Учете ги во парови: gewinnen — gewann."]
  - ask: ["Ask: who won?", "اسأل: من فاز؟", "Прашајте: кој победи?", "Wer gewann?", gewann]
  - ask: ["Say: the goal came in the last minute.", "قل: الهدف جاء في الدقيقة الأخيرة.", "Кажете: голот падна во последната минута.", "Das Tor fiel in der letzten Minute.", das-tor]
  - ask: ["Ask: who scored the goal?", "اسأل: من سجّل الهدف؟", "Прашајте: кој го постигна голот?", "Wer schoss das Tor?", schoss]
  - ask: ["Say: all the fans were singing.", "قل: كل المشجعين كانوا يغنّون.", "Кажете: сите навивачи пееја.", "Alle Fans sangen.", der-fan]
  - ask: ["Say: we lost.", "قل: خسرنا.", "Кажете: изгубивме.", "Wir verloren.", verlor]
  - ask: ["Say: a draw.", "قل: تعادل.", "Кажете: нерешено.", "Unentschieden.", unentschieden]
  - ask: ["Say: the season is long.", "قل: الموسم طويل.", "Кажете: сезоната е долга.", "Die Saison ist lang.", die-saison]
