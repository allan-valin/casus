id: A2-10
protagonist: m
title: ["Herr Yilmaz", "السيد يلماز", "Господин Јилмаз"]
situation:
  - "A quiet morning at the market. Herr Yilmaz tells you how he came to Leipzig."
  - "صباح هادئ في السوق. السيد يلماز يحكي لك كيف جاء إلى لايبزيغ."
  - "Мирно утро на пазарот. Господин Јилмаз ви раскажува како дошол во Лајпциг."
learn: [a2-seit-dative]
culture: A bridge figure
items:
  - [seit-wann-sind-sie, "Seit wann sind Sie …?", "How long have you been …? (polite)", "منذ متى وأنت …؟", "Од кога сте …?"]
  - [seit-dreissig-jahren, "seit dreißig Jahren", "for thirty years", "منذ ثلاثين عامًا", "веќе триесет години"]
  - [mein-vater, "mein Vater", "my father", "أبي", "татко ми"]
  - [als-gastarbeiter, "als Gastarbeiter", "as a guest worker", "عاملًا ضيفًا", "како гастарбајтер", {rare: true}]
  - [aufgewachsen, "aufgewachsen", "grew up", "نشأتُ", "пораснав"]
  - [der-laden, "der Laden", "the shop", "المحل", "продавницата"]
  - [seit-der-wende, "seit der Wende", "since reunification (1989)", "منذ إعادة التوحيد (1989)", "од обединувањето (1989)"]
  - [beides, "beides", "both", "كلاهما", "и двете"]
  - [die-heimat, "die Heimat", "home, homeland", "الوطن", "татковината"]
  - [ich-fuehle-mich, "ich fühle mich", "I feel", "أشعر أنني", "се чувствувам"]
dialogue:
  - [protagonist, "Seit wann sind Sie in Leipzig, Herr Yilmaz?", "How long have you been in Leipzig, Mr Yilmaz?", "منذ متى وأنت في لايبزيغ يا سيد يلماز؟", "Од кога сте во Лајпциг, господине Јилмаз?"]
  - [yilmaz, "Seit dreißig Jahren. Seit der Wende.", "For thirty years. Since reunification.", "منذ ثلاثين عامًا. منذ إعادة التوحيد.", "Веќе триесет години. Од обединувањето."]
  - [protagonist, "Und vorher?", "And before?", "وقبل ذلك؟", "А пред тоа?"]
  - [yilmaz, "Ich bin in Berlin aufgewachsen. Mein Vater ist als Gastarbeiter aus der Türkei gekommen.", "I grew up in Berlin. My father came from Turkey as a guest worker.", "نشأتُ في برلين. أبي جاء من تركيا عاملًا ضيفًا.", "Пораснав во Берлин. Татко ми дошол од Турција како гастарбајтер."]
  - [protagonist, "Und seit wann haben Sie den Laden?", "And since when have you had the shop?", "ومنذ متى عندك المحل؟", "А од кога ја имате продавницата?"]
  - [yilmaz, "Seit zwanzig Jahren. Meine Kinder helfen am Samstag.", "For twenty years. My children help on Saturdays.", "منذ عشرين عامًا. أولادي يساعدون يوم السبت.", "Веќе дваесет години. Децата помагаат во сабота."]
  - [protagonist, "Ist Deutschland Ihre Heimat oder die Türkei?", "Is Germany your home, or Turkey?", "هل ألمانيا وطنك أم تركيا؟", "Дали Германија ви е татковина или Турција?"]
  - [yilmaz, "Beides. Ich fühle mich als Leipziger — mit türkischem Tee!", "Both. I feel like a Leipziger — with Turkish tea!", "كلاهما. أشعر أنني من لايبزيغ — مع الشاي التركي!", "И двете. Се чувствувам Лајпцигер — со турски чај!"]
teach:
  - note: ["«seit» (since, for) takes the dative and the present tense: «seit dreißig Jahren» — for thirty years; «seit der Wende». German says 'I am here since…', not 'I have been'.", "«seit» (منذ) تأخذ حالة الجر والزمن الحاضر: «seit dreißig Jahren» — منذ ثلاثين عامًا؛ «seit der Wende». والألمانية تقول «أنا هنا منذ…» بالحاضر.", "«seit» (од, веќе) бара датив и сегашно време: «seit dreißig Jahren» — веќе триесет години; «seit der Wende». Германскиот вели „тука сум од…“, во сегашно."]
  - ask: ["Ask how long he's been in Leipzig.", "اسأل منذ متى وهو في لايبزيغ.", "Прашајте од кога е во Лајпциг.", "Seit wann sind Sie in Leipzig?", seit-wann-sind-sie]
  - ask: ["Say for him: for thirty years.", "قلها بلسانه: منذ ثلاثين عامًا.", "Кажете наместо него: веќе триесет години.", "Seit dreißig Jahren.", seit-dreissig-jahren]
  - ask: ["Say: since reunification.", "قل: منذ إعادة التوحيد.", "Кажете: од обединувањето.", "Seit der Wende.", seit-der-wende]
  - ask: ["Say: I grew up in Berlin.", "قل: نشأتُ في برلين.", "Кажете: пораснав во Берлин.", "Ich bin in Berlin aufgewachsen.", aufgewachsen]
  - ask: ["Say: my father came as a guest worker.", "قل: أبي جاء عاملًا ضيفًا.", "Кажете: татко ми дошол како гастарбајтер.", "Mein Vater ist als Gastarbeiter gekommen.", mein-vater, als-gastarbeiter]
  - ask: ["Say: the shop.", "قل: المحل.", "Кажете: продавницата.", "Der Laden.", der-laden]
  - ask: ["Ask: is Germany your home?", "اسأل: هل ألمانيا وطنك؟", "Прашајте: дали Германија ви е татковина?", "Ist Deutschland Ihre Heimat?", die-heimat]
  - ask: ["He says: both.", "يقول: كلاهما.", "Тој вели: и двете.", "Beides.", beides]
  - ask: ["Say: I feel like a Leipziger.", "قل: أشعر أنني من لايبزيغ.", "Кажете: се чувствувам Лајпцигер.", "Ich fühle mich als Leipziger.", ich-fuehle-mich]
  - note: ["From 1961 West Germany recruited 'guest workers' from Turkey, Italy, Greece and Yugoslavia; many stayed. Their children and grandchildren are Germans — often with two homes, like Herr Yilmaz.", "منذ 1961 استقدمت ألمانيا الغربية «عمالًا ضيوفًا» من تركيا وإيطاليا واليونان ويوغوسلافيا؛ وبقي كثير منهم. أولادهم وأحفادهم ألمان — غالبًا بوطنين، مثل السيد يلماز.", "Од 1961 Западна Германија регрутирала „гастарбајтери“ од Турција, Италија, Грција и Југославија; многумина останале. Нивните деца и внуци се Германци — често со два дома, како господин Јилмаз."]
  - only: {mk: "Меѓу гастарбајтерите од Југославија имало и многу Македонци — можеби некој од вашето семејство."}
