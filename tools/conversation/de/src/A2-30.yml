id: A2-30
protagonist: m
title: ["Jokes", "النكات", "Шеги"]
situation:
  - "The house summer party in the courtyard. Jonas tries to explain German humour — and A2 comes back."
  - "حفلة الصيف في فناء العمارة. يوناس يحاول شرح الفكاهة الألمانية — والمستوى A2 يعود."
  - "Летната забава во дворот на зградата. Јонас се обидува да го објасни германскиот хумор — и A2 се враќа."
learn: []
culture: German humour, explained
items:
  - [der-witz, "der Witz", "the joke", "النكتة", "шегата"]
  - [die-pointe, "die Pointe", "the punchline", "ذروة النكتة", "поентата", {rare: true}]
  - [lustig, "lustig", "funny", "مضحك", "смешно"]
  - [ich-verstehe-den-witz-nicht, "Ich verstehe den Witz nicht", "I don't get the joke", "لم أفهم النكتة", "Не ја разбирам шегата"]
  - [das-wortspiel, "das Wortspiel", "the pun", "التلاعب بالألفاظ", "игра на зборови", {rare: true}]
  - [trocken, "trocken", "dry, deadpan", "جاف (فكاهة جافة)", "суво"]
  - [lachen, "lachen", "laugh", "يضحك", "се смее"]
  - [der-humor, "der Humor", "humour", "الفكاهة", "хуморот"]
  - [das-sommerfest, "das Sommerfest", "the summer party", "حفلة الصيف", "летната забава"]
  - [prost, "Prost!", "Cheers!", "في صحتك!", "Наздравје!"]
dialogue:
  - [jonas, "Willkommen beim Sommerfest! Kennst du einen deutschen Witz?", "Welcome to the summer party! Do you know a German joke?", "أهلًا بك في حفلة الصيف! هل تعرف نكتة ألمانية؟", "Добредојде на летната забава! Знаеш ли германска шега?"]
  - [protagonist, "Nein. Gibt es deutschen Humor?", "No. Is there German humour?", "لا. هل هناك فكاهة ألمانية؟", "Не. Постои ли германски хумор?"]
  - [jonas, "Ha! Das ist der Witz! ... Okay: Was ist grün und klopft an die Tür? Ein Klopfsalat!", "Ha! That's the joke! ... OK: what's green and knocks at the door? A knock salad!", "ها! هذه هي النكتة! ... حسنًا: ما الأخضر الذي يطرق الباب؟ سلطة طرّاقة!", "Ха! Тоа е шегата! ... Добро: што е зелено и чука на врата? Чукална салата!"]
  - [protagonist, "Ich verstehe den Witz nicht.", "I don't get the joke.", "لم أفهم النكتة.", "Не ја разбирам шегата."]
  - [jonas, "Kopfsalat, Klopfsalat — ein Wortspiel! Die Pointe ist schlecht, das ist lustig.", "Lettuce, 'knock-lettuce' — a pun! The punchline is bad, that's what's funny.", "خسّ، «خسّ طرّاق» — تلاعب بالألفاظ! ذروة النكتة سيئة، وهذا المضحك.", "Зелена салата, „чукална салата“ — игра на зборови! Поентата е лоша, тоа е смешното."]
  - [becker, "Deutscher Humor ist trocken. Man lacht nicht laut.", "German humour is dry. People don't laugh loudly.", "الفكاهة الألمانية جافة. لا يضحك الناس بصوت عالٍ.", "Германскиот хумор е сув. Луѓето не се смеат гласно."]
  - [protagonist, "Dann lache ich leise. Prost!", "Then I'll laugh quietly. Cheers!", "إذن سأضحك بهدوء. في صحتكم!", "Тогаш ќе се смеам тивко. Наздравје!"]
  - [jonas, "Prost! Jetzt verstehst du alles!", "Cheers! Now you understand everything!", "في صحتك! الآن تفهم كل شيء!", "Наздравје! Сега разбираш сѐ!"]
teach:
  - ask: ["Say: the summer party.", "قل: حفلة الصيف.", "Кажете: летната забава.", "Das Sommerfest.", das-sommerfest]
  - ask: ["Jonas asks if you know a joke.", "يوناس يسألك إن كنت تعرف نكتة.", "Јонас прашува дали знаеш шега.", "Kennst du einen Witz?", der-witz]
  - ask: ["Say: I don't get the joke.", "قل: لم أفهم النكتة.", "Кажете: не ја разбирам шегата.", "Ich verstehe den Witz nicht.", ich-verstehe-den-witz-nicht]
  - ask: ["Say: a pun.", "قل: تلاعب بالألفاظ.", "Кажете: игра на зборови.", "Ein Wortspiel.", das-wortspiel]
  - ask: ["Say: the punchline.", "قل: ذروة النكتة.", "Кажете: поентата.", "Die Pointe.", die-pointe]
  - ask: ["Say: that's funny.", "قل: هذا مضحك.", "Кажете: тоа е смешно.", "Das ist lustig.", lustig]
  - ask: ["Say: German humour is dry.", "قل: الفكاهة الألمانية جافة.", "Кажете: германскиот хумор е сув.", "Deutscher Humor ist trocken.", trocken]
  - ask: ["Say: then I'll laugh quietly.", "قل: إذن سأضحك بهدوء.", "Кажете: тогаш ќе се смеам тивко.", "Dann lache ich leise.", lachen, leise]
  - ask: ["Ask: is there German humour?", "اسأل: هل هناك فكاهة ألمانية؟", "Прашајте: постои ли германски хумор?", "Gibt es deutschen Humor?", der-humor]
  - ask: ["Toast!", "اشرب نخبًا!", "Наздравете!", "Prost!", prost]
  - note: ["End of A2. Some more from the whole level.", "نهاية المستوى A2. مزيد من المستوى كله.", "Крај на A2. Уште малку од целото ниво."]
  - ask: ["Monday small talk: what did you do?", "دردشة الاثنين: ماذا فعلت؟", "Понеделнички разговор: што прави?", "Was hast du gemacht?", was-hast-du-gemacht]
  - ask: ["At the Christmas market: anything alcohol-free?", "في سوق عيد الميلاد: شيء بلا كحول؟", "На божиќниот пазар: нешто без алкохол?", "Etwas ohne Alkohol?", ohne-alkohol]
  - ask: ["At the VHS: I plan to improve my German.", "في الجامعة الشعبية: أنوي أن أحسّن لغتي الألمانية.", "На народниот универзитет: планирам да го подобрам германскиот.", "Ich habe vor, mein Deutsch zu verbessern.", ich-habe-vor]
  - note: ["German humour exists — it is often dry, ironic, and loves puns and self-mockery ('German humour? That's the joke!'). Laughing quietly at a bad pun is exactly right.", "الفكاهة الألمانية موجودة — غالبًا جافة وساخرة، وتحب التلاعب بالألفاظ والسخرية من الذات («فكاهة ألمانية؟ هذه هي النكتة!»). والضحك بهدوء على نكتة سيئة هو التصرف الصحيح تمامًا.", "Германскиот хумор постои — често е сув, ироничен, сака игри на зборови и самоиронија („Германски хумор? Тоа е шегата!“). Тивко смеење на лоша игра на зборови е токму вистинската реакција."]
