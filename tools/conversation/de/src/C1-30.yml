id: C1-30
protagonist: m
title: ["Five years in Leipzig", "خمس سنوات في لايبزيغ", "Пет години во Лајпциг"]
situation:
  - "Five years since you arrived. Frau Becker, Jonas and Svenja with little Emma come for dinner. A look back at all of C1."
  - "خمس سنوات منذ وصولك. السيدة بيكر ويوناس وسفينيا مع الصغيرة إيما يأتون للعشاء. نظرة إلى المستوى C1 كله."
  - "Пет години откако пристигнавте. Госпоѓа Бекер, Јонас и Свења со малата Ема доаѓаат на вечера. Поглед наназад кон целото C1."
learn: []
culture: Looking back
items:
  - [rueckblickend, "rückblickend", "looking back", "بالنظر إلى الماضي", "гледајќи наназад"]
  - [die-veraenderung, "die Veränderung", "the change", "التغيير", "промената"]
  - [dankbar, "dankbar", "grateful", "ممتنّ", "благодарен"]
  - [vertraut, "vertraut", "familiar", "مألوف", "блиско, познато"]
  - [die-fremde, "die Fremde", "foreign parts, being abroad", "الغربة", "туѓината"]
  - [die-wahlheimat, "die Wahlheimat", "adopted home", "الوطن المختار", "избраната татковина", {rare: true}]
  - [auf-die-naechsten, "auf die nächsten fünf Jahre", "to the next five years", "نخب السنوات الخمس القادمة", "за следните пет години"]
  - [die-kritik, "die Kritik", "criticism", "النقد", "критиката"]
  - [die-stufe, "die Stufe", "the level, stage", "المستوى، المرحلة", "нивото, степенот"]
  - [weisst-du-noch, "Weißt du noch …?", "Do you remember …?", "أتذكر …؟", "Се сеќаваш ли …?"]
dialogue:
  - [becker, "Fünf Jahre! Weißt du noch, wie du am ersten Tag den Müll falsch getrennt hast?", "Five years! Do you remember sorting the rubbish wrong on your first day?", "خمس سنوات! أتذكر كيف فرزتَ القمامة خطأً في يومك الأول؟", "Пет години! Се сеќаваш ли како првиот ден погрешно го одвои ѓубрето?"]
  - [protagonist, "Und wie streng du warst! Heute erkläre ich den Neuen die Mülltrennung.", "And how strict you were! Today I explain recycling to the newcomers.", "وكم كنتِ صارمة! اليوم أنا من يشرح فرز القمامة للقادمين الجدد.", "А колку беше строга! Денес јас им ја објаснувам селекцијата на новите."]
  - [jonas, "Rückblickend: Was war die größte Veränderung?", "Looking back: what was the biggest change?", "بالنظر إلى الماضي: ما أكبر تغيير؟", "Гледајќи наназад: која беше најголемата промена?"]
  - [protagonist, "Dass mir die Fremde vertraut geworden ist. Leipzig ist meine Wahlheimat.", "That foreign parts have become familiar to me. Leipzig is my adopted home.", "أنّ الغربة صارت مألوفة لي. لايبزيغ وطني المختار.", "Тоа што туѓината ми стана блиска. Лајпциг е мојата избрана татковина."]
  - [svenja, "Und Emma sagt schon „Onkel“ zu dir!", "And Emma already calls you 'uncle'!", "وإيما تناديك «عمّو» بالفعل!", "А Ема веќе те вика „чичко“!"]
  - [protagonist, "Ich bin sehr dankbar. Für die Geduld, die Kritik und den Kuchen.", "I'm very grateful. For the patience, the criticism and the cake.", "أنا ممتنّ جدًا. على الصبر والنقد والكعك.", "Многу сум благодарен. За трпението, критиката и колачот."]
  - [becker, "Auf die nächsten fünf Jahre!", "To the next five years!", "نخب السنوات الخمس القادمة!", "За следните пет години!"]
  - [protagonist, "Und auf die nächste Stufe: C2!", "And to the next level: C2!", "ونخب المستوى التالي: C2!", "И за следното ниво: C2!"]
teach:
  - ask: ["She asks: do you remember…?", "تسأل: أتذكر…؟", "Таа прашува: се сеќаваш ли…?", "Weißt du noch…?", weisst-du-noch]
  - ask: ["He asks: looking back, the biggest change?", "يسأل: بالنظر إلى الماضي، أكبر تغيير؟", "Тој прашува: гледајќи наназад, најголемата промена?", "Rückblickend: die größte Veränderung?", rueckblickend, die-veraenderung]
  - ask: ["Say: foreign parts have become familiar.", "قل: الغربة صارت مألوفة.", "Кажете: туѓината ми стана блиска.", "Die Fremde ist mir vertraut geworden.", die-fremde, vertraut]
  - ask: ["Say: Leipzig is my adopted home.", "قل: لايبزيغ وطني المختار.", "Кажете: Лајпциг е мојата избрана татковина.", "Leipzig ist meine Wahlheimat.", die-wahlheimat]
  - ask: ["Say: I'm very grateful.", "قل: أنا ممتنّ جدًا.", "Кажете: многу сум благодарен.", "Ich bin sehr dankbar.", dankbar]
  - ask: ["Say: for the patience and the criticism.", "قل: على الصبر والنقد.", "Кажете: за трпението и критиката.", "Für die Geduld und die Kritik.", die-kritik]
  - ask: ["Say: to the next level!", "قل: نخب المستوى التالي!", "Кажете: за следното ниво!", "Auf die nächste Stufe!", die-stufe]
  - ask: ["Toast: to the next five years!", "اشرب نخبًا: السنوات الخمس القادمة!", "Наздравете: за следните пет години!", "Auf die nächsten fünf Jahre!", auf-die-naechsten]
  - note: ["End of C1. Some more from the whole level.", "نهاية المستوى C1. مزيد من المستوى كله.", "Крај на C1. Уште малку од целото ниво."]
  - ask: ["Debating: I disagree there.", "في المناظرة: هنا أعترض.", "Дебата: тука не се согласувам.", "Da widerspreche ich.", ich-widerspreche]
  - ask: ["A void clause: it's probably invalid.", "بند باطل: يُرجَّح أنه باطل.", "Неважечка клаузула: веројатно е неважечка.", "Die Klausel dürfte unwirksam sein.", duerfte]
  - ask: ["Condolences.", "التعزية.", "Сочувство.", "Mein herzliches Beileid.", das-beileid]
  - ask: ["An appeal: within the deadline.", "اعتراض: في المهلة المحدّدة.", "Жалба: во рок.", "Fristgerecht.", fristgerecht]
  - ask: ["Civil courage.", "الشجاعة المدنية.", "Граѓанска храброст.", "Die Zivilcourage.", die-zivilcourage]
  - note: ["At C1 you can argue, appeal, comfort, negotiate and joke in German. 'Wahlheimat' — the home you chose — is how many people describe the place where they arrived and stayed.", "في مستوى C1 تستطيع أن تجادل وتعترض وتواسي وتفاوض وتمزح بالألمانية. و«Wahlheimat» — الوطن الذي اخترته — هي الكلمة التي يصف بها كثيرون المكان الذي وصلوا إليه وبقوا فيه.", "На C1 можете на германски да расправате, да се жалите, да тешите, да преговарате и да се шегувате. „Wahlheimat“ — домот што сте го избрале — е како многумина го опишуваат местото каде што пристигнале и останале."]
