id: B1-25-a
tracks: [ar]
protagonist: f
title: ["عمل صغير أم عمل ثانٍ؟"]
situation: ["يارا في الروضة حتى الظهر. تفكّرين في عمل صغير، وزوجكِ في عمل ثانٍ. الجارة لينا تنصحكما."]
learn: [b1-imperative-du]
culture: Second jobs and tax classes
items:
  - [der-minijob, "der Minijob", "عمل صغير (بدخل محدود)"]
  - [vormittags, "vormittags", "قبل الظهر"]
  - [der-stundenlohn, "der Stundenlohn", "الأجر بالساعة"]
  - [ein-zweiter-job, "ein zweiter Job", "عمل ثانٍ"]
  - [die-steuerklasse, "die Steuerklasse", "الفئة الضريبية", {rare: true}]
  - [steuerklasse-sechs, "Steuerklasse sechs", "الفئة الضريبية السادسة", {rare: true}]
  - [lohnt-sich-nicht, "lohnt sich nicht", "لا يستحق العناء"]
  - [rechne-nach, "rechne nach", "احسبي (المبلغ)"]
  - [die-kita-zeiten, "die Kita-Zeiten", "مواعيد الروضة"]
  - [frag-den-chef, "frag deinen Chef", "اسأل مديرك"]
  - [mehr-netto, "mehr netto", "صافٍ أكثر"]
dialogue:
  - [protagonist, "Lena, Yara ist vormittags in der Kita. Ich möchte einen Minijob.", "لينا، يارا في الروضة قبل الظهر. أريد عملًا صغيرًا."]
  - [lena, "Gute Idee! In der Bäckerei suchen sie jemanden. Frag nach dem Stundenlohn.", "فكرة جيدة! المخبز يبحث عن أحد. اسألي عن الأجر بالساعة."]
  - [protagonist, "Und mein Mann will einen zweiten Job, am Wochenende.", "وزوجي يريد عملًا ثانيًا في نهاية الأسبوع."]
  - [lena, "Vorsicht: ein zweiter Job kommt in Steuerklasse sechs. Da bleibt wenig netto.", "انتبهي: العمل الثاني يدخل في الفئة الضريبية السادسة. لا يبقى صافٍ إلا القليل."]
  - [protagonist, "Lohnt sich das dann überhaupt?", "إذن هل يستحق ذلك العناء أصلًا؟"]
  - [lena, "Rechne nach! Vielleicht bringen Überstunden in der Firma mehr netto.", "احسبي! ربما الساعات الإضافية في الشركة تجلب صافيًا أكثر."]
  - [protagonist, "Und die Kita-Zeiten? Die Bäckerei öffnet um sechs.", "ومواعيد الروضة؟ المخبز يفتح في السادسة."]
  - [lena, "Dann sag ihm: frag deinen Chef nach Gleitzeit. Und du nimmst die späten Stunden.", "إذن قولي له: اسأل مديرك عن الدوام المرن. وأنتِ تأخذين الساعات المتأخرة."]
teach:
  - ask: ["قولي: يارا في الروضة قبل الظهر.", "Yara ist vormittags in der Kita.", vormittags]
  - ask: ["قولي: أريد عملًا صغيرًا.", "Ich möchte einen Minijob.", der-minijob]
  - note: ["الأمر للمخاطَب (du) يحذف «-st» والضمير: «du fragst» ← «Frag!»؛ «du rechnest nach» ← «Rechne nach!». والجزء المنفصل يذهب إلى الآخر."]
  - ask: ["قولي لنفسكِ: اسألي عن الأجر بالساعة!", "Frag nach dem Stundenlohn!", der-stundenlohn]
  - ask: ["قولي: زوجي يريد عملًا ثانيًا.", "Mein Mann will einen zweiten Job.", ein-zweiter-job]
  - ask: ["قولي: الفئة الضريبية السادسة.", "Steuerklasse sechs.", steuerklasse-sechs, die-steuerklasse]
  - ask: ["اسألي: هل يستحق ذلك؟ — لا يستحق.", "Das lohnt sich nicht.", lohnt-sich-nicht]
  - ask: ["قولي: احسبي!", "Rechne nach!", rechne-nach]
  - ask: ["قولي: صافٍ أكثر.", "Mehr netto.", mehr-netto]
  - ask: ["قولي: مواعيد الروضة.", "Die Kita-Zeiten.", die-kita-zeiten]
  - ask: ["قولي له: اسأل مديرك!", "Frag deinen Chef!", frag-den-chef]
  - note: ["العمل الصغير (Minijob) معفى من الضريبة حتى حدّ شهري معيّن، لكنه لا يجلب تأمينًا صحيًا خاصًا به — والتأمين العائلي عبر الزوج يغطّي ذلك غالبًا. أما العمل الثاني بعقد عادي فيُحسَب في الفئة الضريبية السادسة، فيبقى منه صافٍ قليل. الحدود تتغيّر — تحقّقي منها."]
