id: A1-23
protagonist: f
title: ["Quiet hours", "ساعات الهدوء", "Време за мир"]
situation:
  - "Ten past ten at night. Friends are visiting. Someone knocks: Frau Becker in her dressing gown."
  - "العاشرة وعشر دقائق ليلًا. عندكِ ضيوف. أحدهم يطرق الباب: السيدة بيكر بثوب النوم."
  - "Десет и десет навечер. Имате гости. Некој чука: госпоѓа Бекер во бањарка."
learn: [de-vm_01]
culture: Late visits
items:
  - [zu-laut, "zu laut", "too loud", "عالٍ جدًا", "премногу бучно"]
  - [nach-zehn-uhr, "nach zehn Uhr", "after ten o'clock", "بعد الساعة العاشرة", "по десет часот"]
  - [die-ruhezeit, "die Ruhezeit", "the quiet hours", "ساعات الهدوء", "времето за мир", {rare: true}]
  - [man-darf, "man darf …", "you're allowed to … (one may)", "يُسمح لـ … (يجوز)", "смее да се …"]
  - [nicht-mehr, "nicht mehr", "no longer, not any more", "لم يعد", "веќе не"]
  - [leise, "leise", "quiet", "بهدوء", "тивко"]
  - [ich-schlafe, "ich schlafe", "I sleep", "أنام", "спијам"]
  - [die-gaeste, "die Gäste", "the guests", "الضيوف", "гостите"]
  - [darf-ich, "Darf ich …?", "May I …?", "هل يُسمح لي …؟", "Смеам ли …?"]
  - [natuerlich, "natürlich", "of course", "طبعًا", "секако"]
  - [gute-nacht, "Gute Nacht!", "Good night!", "تصبحين على خير!", "Добра ноќ!"]
dialogue:
  - [becker, "Entschuldigung, es ist zu laut. Es ist nach zehn Uhr.", "Excuse me, it's too loud. It's after ten o'clock.", "عفوًا، الصوت عالٍ جدًا. الساعة بعد العاشرة.", "Извинете, премногу бучно е. Поминато е десет часот."]
  - [protagonist, "Oh! Entschuldigung. Ist das ein Problem?", "Oh! Sorry. Is that a problem?", "آه! عفوًا. هل هذه مشكلة؟", "О! Извинете. Дали е проблем?"]
  - [becker, "Ab zehn ist Ruhezeit. Dann darf man nicht mehr laut sein.", "From ten it's quiet hours. Then you mustn't be loud any more.", "من العاشرة ساعات الهدوء. حينها لا يجوز رفع الصوت.", "Од десет е време за мир. Тогаш не смее да се биде гласно."]
  - [protagonist, "Die Gäste gehen bald.", "The guests are leaving soon.", "الضيوف سيغادرون قريبًا.", "Гостите наскоро си одат."]
  - [becker, "Gut. Ich schlafe unten, und ich arbeite um sechs.", "Good. I sleep downstairs, and I work at six.", "حسنًا. أنا أنام في الأسفل، وأعمل في السادسة.", "Добро. Јас спијам долу, а работам во шест."]
  - [protagonist, "Natürlich. Wir sind jetzt leise.", "Of course. We'll be quiet now.", "طبعًا. سنكون هادئين الآن.", "Секако. Сега ќе бидеме тивко."]
  - [protagonist, "Darf ich am Samstag Gäste haben? Bis elf?", "May I have guests on Saturday? Until eleven?", "هل يُسمح لي باستقبال ضيوف يوم السبت؟ حتى الحادية عشرة؟", "Смеам ли во сабота да имам гости? До единаесет?"]
  - [becker, "Sagen Sie es vorher. Dann ist es kein Problem. Gute Nacht!", "Tell me beforehand. Then it's no problem. Good night!", "أخبريني مسبقًا. عندها لا مشكلة. تصبحين على خير!", "Кажете ми однапред. Тогаш не е проблем. Добра ноќ!"]
teach:
  - ask: ["She says: it's too loud.", "تقول: الصوت عالٍ جدًا.", "Таа вели: премногу бучно е.", "Es ist zu laut.", zu-laut]
  - ask: ["She says: it's after ten o'clock.", "تقول: الساعة بعد العاشرة.", "Таа вели: поминато е десет часот.", "Es ist nach zehn Uhr.", nach-zehn-uhr]
  - ask: ["Say: the quiet hours.", "قولي: ساعات الهدوء.", "Кажете: времето за мир.", "Die Ruhezeit.", die-ruhezeit]
  - note: ["«dürfen» — be allowed: «man darf» (one may), «Darf ich …?» (may I?). With «nicht» it means 'must not': «man darf nicht laut sein».", "«dürfen» تعني: يُسمح. «man darf» (يجوز)، «Darf ich …?» (هل يُسمح لي؟). ومع «nicht» تعني: لا يجوز: «man darf nicht laut sein».", "«dürfen» — смее: «man darf» (се смее), «Darf ich …?» (смеам ли?). Со «nicht» значи не смее: «man darf nicht laut sein»."]
  - ask: ["Say for her: you mustn't be loud any more.", "قوليها بلسانها: لا يجوز رفع الصوت بعد الآن.", "Кажете наместо неа: веќе не смее да се биде гласно.", "Man darf nicht mehr laut sein.", man-darf, nicht-mehr]
  - ask: ["Say: the guests are leaving soon.", "قولي: الضيوف سيغادرون قريبًا.", "Кажете: гостите наскоро си одат.", "Die Gäste gehen bald.", die-gaeste]
  - ask: ["She says: I sleep downstairs.", "تقول: أنام في الأسفل.", "Таа вели: спијам долу.", "Ich schlafe unten.", ich-schlafe]
  - ask: ["Say: of course. We'll be quiet now.", "قولي: طبعًا. سنكون هادئين الآن.", "Кажете: секако. Сега ќе бидеме тивко.", "Natürlich. Wir sind jetzt leise.", natuerlich, leise]
  - ask: ["Ask: may I have guests on Saturday?", "اسألي: هل يُسمح لي باستقبال ضيوف يوم السبت؟", "Прашајте: смеам ли во сабота да имам гости?", "Darf ich am Samstag Gäste haben?", darf-ich]
  - ask: ["She says: good night!", "تقول: تصبحين على خير!", "Таа вели: добра ноќ!", "Gute Nacht!", gute-nacht]
  - note: ["House rules usually set quiet hours from 10 p.m. to 6 a.m., and all of Sunday. Tell your neighbours before a party — a note on the door is enough — and most will say yes.", "قواعد العمارة تحدد عادةً ساعات الهدوء من العاشرة ليلًا حتى السادسة صباحًا، ويوم الأحد كله. أخبري الجيران قبل أي حفلة — ورقة على الباب تكفي — وأغلبهم سيوافق.", "Куќниот ред обично одредува време за мир од десет навечер до шест наутро, и цела недела. Кажете им на соседите пред забава — доволна е белешка на вратата — и повеќето ќе се согласат."]
  - only: {ar: "في سوريا الزيارات المتأخرة عادية والسهر مع الضيوف جزء من الكرم. هنا، بعد العاشرة، يُنتظر الهدوء — حتى مع الضيوف.", mk: "Кај нас гостите седат до полноќ и никој не се лути. Тука по десет се очекува тишина — и со гости."}
