id: C1-18
protagonist: m
title: ["Philosophy at the VHS", "الفلسفة في الجامعة الشعبية", "Филозофија на народниот универзитет"]
situation:
  - "A VHS evening on Kant. Over coffee afterwards, Professor Hartmann explains the Enlightenment — and duty."
  - "أمسية في الجامعة الشعبية عن كانط. على القهوة بعدها يشرح البروفيسور هارتمان عصر التنوير — والواجب."
  - "Вечер на народниот универзитет за Кант. На кафе потоа професорот Хартман го објаснува просветителството — и должноста."
learn: [c1-extended-attributes]
culture: —
items:
  - [die-aufklaerung, "die Aufklärung", "the Enlightenment", "عصر التنوير", "просветителството"]
  - [die-pflicht, "die Pflicht", "duty", "الواجب", "должноста"]
  - [der-verstand, "der Verstand", "reason, understanding", "العقل", "разумот"]
  - [der-mut, "der Mut", "courage", "الشجاعة", "храброста"]
  - [der-kategorische-imperativ, "der kategorische Imperativ", "the categorical imperative", "الأمر المطلق", "категоричкиот императив", {rare: true}]
  - [die-vernunft, "die Vernunft", "reason", "العقل، المنطق", "умот"]
  - [der-zu-befolgende, "die zu befolgende Regel", "the rule to be followed", "القاعدة الواجب اتّباعها", "правилото што треба да се следи"]
  - [allgemein-gueltig, "allgemein gültig", "universally valid", "صالح للجميع", "општо важечко"]
  - [die-muendigkeit, "die Mündigkeit", "intellectual maturity, autonomy", "الرشد", "полнолетството (на умот)", {rare: true}]
  - [handeln, "handeln", "act", "يتصرّف", "постапува"]
dialogue:
  - [hartmann, "Kant sagt: „Habe Mut, dich deines eigenen Verstandes zu bedienen.“ Das ist Aufklärung.", "Kant says: 'Have the courage to use your own understanding.' That's Enlightenment.", "يقول كانط: «تحلَّ بالشجاعة لتستعمل عقلك.» هذا هو التنوير.", "Кант вели: „Имај храброст да се служиш со сопствениот разум.“ Тоа е просветителство."]
  - [protagonist, "Also selbst denken, statt nur zu gehorchen?", "So think for yourself instead of only obeying?", "أي أن تفكّر بنفسك بدلًا من أن تطيع فقط؟", "Значи, да мислиш сам, наместо само да слушаш?"]
  - [hartmann, "Genau. Er nennt das Mündigkeit. Und der von ihm formulierte kategorische Imperativ sagt, wie wir handeln sollen.", "Exactly. He calls it maturity. And the categorical imperative he formulated says how we should act.", "بالضبط. يسمّي ذلك الرشد. والأمر المطلق الذي صاغه يقول كيف يجب أن نتصرّف.", "Точно. Тој го нарекува тоа полнолетство. А категоричкиот императив што го формулирал вели како треба да постапуваме."]
  - [protagonist, "Und wie?", "And how?", "وكيف؟", "А како?"]
  - [hartmann, "Handle nur nach der Regel, von der du willst, dass sie für alle gilt. Allgemein gültig, verstehen Sie?", "Act only by the rule you would want to hold for everyone. Universally valid, you see?", "تصرّف فقط وفق القاعدة التي تريدها أن تنطبق على الجميع. صالحة للجميع، أتفهم؟", "Постапувај само според правилото за кое сакаш да важи за сите. Општо важечко, разбирате?"]
  - [protagonist, "Dann ist Lügen nie erlaubt — auch nicht aus Höflichkeit?", "Then lying is never allowed — not even out of politeness?", "إذن الكذب غير مسموح أبدًا — ولا حتى من باب الأدب؟", "Тогаш лажењето никогаш не е дозволено — ни од учтивост?"]
  - [hartmann, "Für Kant nicht. Die Pflicht zur Wahrheit ist die zu befolgende Regel. Sehr deutsch, oder?", "Not for Kant. The duty to truth is the rule to be followed. Very German, isn't it?", "ليس عند كانط. واجب الصدق هو القاعدة الواجب اتّباعها. ألماني جدًا، أليس كذلك؟", "Не за Кант. Должноста кон вистината е правилото што треба да се следи. Многу германски, нели?"]
  - [protagonist, "Das erklärt das „Nein heißt nein“ bei Jonas!", "That explains Jonas's 'no means no'!", "هذا يفسّر «لا تعني لا» عند يوناس!", "Тоа го објаснува „не значи не“ кај Јонас!"]
teach:
  - ask: ["Say: the Enlightenment.", "قل: عصر التنوير.", "Кажете: просветителството.", "Die Aufklärung.", die-aufklaerung]
  - ask: ["Say: have the courage to use your own understanding.", "قل: تحلَّ بالشجاعة لتستعمل عقلك.", "Кажете: имај храброст да се служиш со сопствениот разум.", "Habe Mut, dich deines eigenen Verstandes zu bedienen.", der-mut, der-verstand]
  - ask: ["Say: maturity of mind.", "قل: الرشد.", "Кажете: полнолетство на умот.", "Die Mündigkeit.", die-muendigkeit]
  - note: ["Extended attributes in academic German: «der von ihm formulierte kategorische Imperativ» (= the imperative that he formulated), «die zu befolgende Regel» (= the rule that must be followed: zu + present participle).", "الصفات الممتدة في الألمانية الأكاديمية: «der von ihm formulierte kategorische Imperativ» (= الأمر الذي صاغه)، «die zu befolgende Regel» (= القاعدة التي يجب اتّباعها: zu مع اسم الفاعل).", "Проширени атрибути во академскиот германски: «der von ihm formulierte kategorische Imperativ» (= императивот што тој го формулирал), «die zu befolgende Regel» (= правилото што мора да се следи: zu + сегашен партицип)."]
  - ask: ["Say: the categorical imperative he formulated.", "قل: الأمر المطلق الذي صاغه.", "Кажете: категоричкиот императив што го формулирал.", "Der von ihm formulierte kategorische Imperativ.", der-kategorische-imperativ]
  - ask: ["Say: act only by a rule valid for all.", "قل: تصرّف فقط وفق قاعدة صالحة للجميع.", "Кажете: постапувај само по правило важечко за сите.", "Handle nur nach einer allgemein gültigen Regel.", handeln, allgemein-gueltig]
  - ask: ["Say: the rule to be followed.", "قل: القاعدة الواجب اتّباعها.", "Кажете: правилото што треба да се следи.", "Die zu befolgende Regel.", der-zu-befolgende]
  - ask: ["Say: the duty to truth.", "قل: واجب الصدق.", "Кажете: должноста кон вистината.", "Die Pflicht zur Wahrheit.", die-pflicht]
  - ask: ["Say: reason.", "قل: العقل.", "Кажете: умот.", "Die Vernunft.", die-vernunft]
  - note: ["Immanuel Kant (1724–1804) defined Enlightenment as leaving 'self-incurred immaturity' — thinking for yourself. His categorical imperative asks you to act only by rules you could want everyone to follow. Many Germans' strictness about honesty and rules is often traced, half-jokingly, to him.", "عرّف إيمانويل كانط (1724–1804) التنوير بأنه الخروج من «القصور الذي يتحمّل الإنسان مسؤوليته» — أي التفكير بنفسك. وأمره المطلق يطلب منك أن تتصرّف وفق قواعد تريد أن يتّبعها الجميع. وكثيرًا ما يُنسب إليه، نصف مزاحًا، صرامة كثير من الألمان في الصدق والقواعد.", "Имануел Кант (1724–1804) го дефинирал просветителството како излез од „самопредизвиканата незрелост“ — да мислиш сам. Неговиот категорички императив бара да постапуваш само по правила за кои би сакал сите да ги следат. Строгоста на многу Германци за искреноста и правилата често, полу на шега, се припишува нему."]
