id: A2-19
protagonist: f
title: ["The bike", "الدراجة", "Велосипедот"]
situation:
  - "A second-hand bike from an online ad. The seller lives round the corner."
  - "دراجة مستعملة من إعلان على الإنترنت. البائع يسكن قريبًا."
  - "Половен велосипед од оглас на интернет. Продавачот живее зад аголот."
learn: [de-adj_02, de-adj_03]
culture: Locks, lights and bike lanes
items:
  - [das-fahrrad, "das Fahrrad", "the bike", "الدراجة", "велосипедот"]
  - [ein-gebrauchtes, "ein gebrauchtes Fahrrad", "a used bike", "دراجة مستعملة", "половен велосипед"]
  - [die-bremse, "die Bremse", "the brake", "المكبح", "сопирачката"]
  - [funktioniert, "funktioniert", "works", "يعمل", "работи"]
  - [das-licht-rad, "das Licht", "the light", "الضوء", "светлото"]
  - [ein-gutes-schloss, "ein gutes Schloss", "a good lock", "قفل جيد", "добра брава"]
  - [der-korb, "der Korb", "the basket", "السلة", "кошничката"]
  - [eine-probefahrt, "eine Probefahrt", "a test ride", "تجربة قيادة", "пробно возење"]
  - [der-reifen, "der Reifen", "the tyre", "الإطار", "гумата"]
  - [neue-reifen, "neue Reifen", "new tyres", "إطارات جديدة", "нови гуми"]
  - [der-radweg, "der Radweg", "the bike lane", "مسار الدراجات", "велосипедската патека"]
dialogue:
  - [kasse, "Hallo! Das ist das Fahrrad. Ein altes, aber ein gutes.", "Hi! This is the bike. An old one, but a good one.", "مرحبًا! هذه الدراجة. قديمة لكنها جيدة.", "Здраво! Ова е велосипедот. Стар, но добар."]
  - [protagonist, "Funktionieren die Bremsen?", "Do the brakes work?", "هل تعمل المكابح؟", "Работат ли сопирачките?"]
  - [kasse, "Ja. Und es hat neue Reifen.", "Yes. And it has new tyres.", "نعم. وفيها إطارات جديدة.", "Да. И има нови гуми."]
  - [protagonist, "Und das Licht?", "And the light?", "والضوء؟", "А светлото?"]
  - [kasse, "Funktioniert auch. Möchten Sie eine Probefahrt machen?", "Works too. Would you like a test ride?", "يعمل أيضًا. هل تودّين تجربتها؟", "И тоа работи. Сакате ли пробно возење?"]
  - [protagonist, "Gern! ... Der Korb vorne ist praktisch.", "Gladly! ... The basket at the front is handy.", "بكل سرور! ... السلة في الأمام عملية.", "Со задоволство! ... Кошничката напред е практична."]
  - [kasse, "Kaufen Sie unbedingt ein gutes Schloss. In Leipzig klaut man Fahrräder.", "Be sure to buy a good lock. In Leipzig bikes get stolen.", "اشتري قفلًا جيدًا بالتأكيد. في لايبزيغ تُسرق الدراجات.", "Обавезно купете добра брава. Во Лајпциг се крадат велосипеди."]
  - [protagonist, "Und ich fahre auf dem Radweg, nicht auf dem Gehweg?", "And I ride in the bike lane, not on the pavement?", "وأقود على مسار الدراجات، لا على الرصيف؟", "И возам по велосипедската патека, не по тротоарот?"]
  - [kasse, "Genau. Und abends mit Licht!", "Exactly. And with lights in the evening!", "بالضبط. وفي المساء مع الضوء!", "Точно. И навечер со светло!"]
teach:
  - ask: ["Say: a used bike.", "قولي: دراجة مستعملة.", "Кажете: половен велосипед.", "Ein gebrauchtes Fahrrad.", ein-gebrauchtes, das-fahrrad]
  - note: ["Adjective endings follow the article: «ein gutes Schloss», «ein altes Fahrrad», «neue Reifen». Learn them in phrases, not as a table.", "نهايات النعوت تتبع الأداة: «ein gutes Schloss»، «ein altes Fahrrad»، «neue Reifen». احفظيها في عبارات، لا في جدول.", "Наставките на придавките го следат членот: «ein gutes Schloss», «ein altes Fahrrad», «neue Reifen». Учете ги во изрази, не во табела."]
  - ask: ["Ask: do the brakes work?", "اسألي: هل تعمل المكابح؟", "Прашајте: работат ли сопирачките?", "Funktionieren die Bremsen?", die-bremse, funktioniert]
  - ask: ["Say: it has new tyres.", "قولي: فيها إطارات جديدة.", "Кажете: има нови гуми.", "Es hat neue Reifen.", neue-reifen, der-reifen]
  - ask: ["Ask: and the light?", "اسألي: والضوء؟", "Прашајте: а светлото?", "Und das Licht?", das-licht-rad]
  - ask: ["She offers a test ride.", "تعرض تجربة قيادة.", "Таа нуди пробно возење.", "Eine Probefahrt?", eine-probefahrt]
  - ask: ["Say: the basket is handy.", "قولي: السلة عملية.", "Кажете: кошничката е практична.", "Der Korb ist praktisch.", der-korb]
  - ask: ["She says: buy a good lock.", "تقول: اشتري قفلًا جيدًا.", "Таа вели: купете добра брава.", "Kaufen Sie ein gutes Schloss.", ein-gutes-schloss]
  - ask: ["Say: I ride in the bike lane.", "قولي: أقود على مسار الدراجات.", "Кажете: возам по велосипедската патека.", "Ich fahre auf dem Radweg.", der-radweg]
  - note: ["Bikes are everywhere — and so are bike thieves: lock the frame to something fixed. Ride in bike lanes, never on the pavement, and with lights after dark: police do check.", "الدراجات في كل مكان — وكذلك لصوص الدراجات: اربطي الإطار بشيء ثابت. قودي على مسارات الدراجات، لا على الرصيف أبدًا، ومع الأضواء بعد الغروب: الشرطة تفحص فعلًا.", "Велосипеди има насекаде — а и крадци: заклучете ја рамката за нешто цврсто. Возете по велосипедски патеки, никогаш по тротоар, и со светла во темно: полицијата проверува."]
