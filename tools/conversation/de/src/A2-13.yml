id: A2-13
protagonist: f
title: ["I like…", "أحبّ…", "Ми се допаѓа…"]
situation:
  - "A café with Lena. Music, food, and what you like best."
  - "مقهى مع لينا. الموسيقى والطعام وما تحبينه أكثر."
  - "Кафуле со Лена. Музика, храна и што најмногу сакате."
learn: [a2-moegen-lieber]
culture: —
items:
  - [ich-mag, "ich mag", "I like", "أحبّ", "сакам, ми се допаѓа"]
  - [magst-du, "Magst du …?", "Do you like …? (informal)", "هل تحبين …؟", "Ти се допаѓа ли …?"]
  - [lieber, "lieber", "rather, prefer", "أفضّل", "повеќе"]
  - [am-liebsten, "am liebsten", "most of all", "أكثر شيء", "најмногу"]
  - [die-musik, "die Musik", "music", "الموسيقى", "музиката"]
  - [der-kuchen-a, "Kuchen", "cake", "كعك", "колач"]
  - [suess, "süß", "sweet", "حلو", "слатко"]
  - [ich-mag-nicht, "ich mag … nicht", "I don't like", "لا أحبّ", "не ми се допаѓа"]
  - [beides-gern, "beides gern", "like both", "أحب الاثنين", "и двете ги сакам"]
  - [gern-hoeren, "höre gern", "like listening to", "أحب الاستماع إلى", "сакам да слушам"]
dialogue:
  - [lena, "Magst du Kuchen oder lieber etwas Salziges?", "Do you like cake, or would you rather have something savoury?", "هل تحبين الكعك أم تفضّلين شيئًا مالحًا؟", "Сакаш ли колач или повеќе нешто солено?"]
  - [protagonist, "Ich mag beides. Aber am liebsten Kuchen!", "I like both. But cake most of all!", "أحبّ الاثنين. لكن الكعك أكثر شيء!", "Ги сакам и двете. Но најмногу колач!"]
  - [lena, "Der Käsekuchen hier ist super. Nicht so süß.", "The cheesecake here is great. Not too sweet.", "كعكة الجبن هنا رائعة. ليست حلوة جدًا.", "Колачот со сирење тука е супер. Не е многу сладок."]
  - [protagonist, "Gut, ich mag es nicht so süß.", "Good, I don't like it too sweet.", "جيد، لا أحبه حلوًا جدًا.", "Добро, не сакам многу слатко."]
  - [lena, "Und Musik? Was hörst du gern?", "And music? What do you like listening to?", "والموسيقى؟ ماذا تحبين أن تسمعي؟", "А музика? Што сакаш да слушаш?"]
  - [protagonist, "Ich höre gern Musik aus meiner Heimat. Und du?", "I like listening to music from home. And you?", "أحب الاستماع إلى موسيقى من وطني. وأنتِ؟", "Сакам да слушам музика од мојата земја. А ти?"]
  - [lena, "Ich mag Techno — Leipzig ist eine Techno-Stadt!", "I like techno — Leipzig is a techno city!", "أحبّ التكنو — لايبزيغ مدينة التكنو!", "Сакам техно — Лајпциг е техно-град!"]
  - [protagonist, "Techno mag ich nicht so. Lieber etwas Ruhiges.", "I'm not so into techno. I'd rather have something calm.", "لا أحب التكنو كثيرًا. أفضّل شيئًا هادئًا.", "Техното не ми се допаѓа толку. Повеќе нешто мирно."]
teach:
  - ask: ["Lena asks: do you like cake?", "لينا تسأل: هل تحبين الكعك؟", "Лена прашува: сакаш ли колач?", "Magst du Kuchen?", magst-du, der-kuchen-a]
  - note: ["Liking in three steps: «gern» (I like doing it), «lieber» (I prefer), «am liebsten» (most of all). «mögen» for things: «ich mag Kuchen».", "التفضيل في ثلاث درجات: «gern» (أحب)، «lieber» (أفضّل)، «am liebsten» (أكثر شيء). و«mögen» للأشياء: «ich mag Kuchen».", "Допаѓање во три степени: «gern» (сакам), «lieber» (повеќе сакам), «am liebsten» (најмногу). «mögen» за предмети: «ich mag Kuchen»."]
  - ask: ["Say: I like both.", "قولي: أحب الاثنين.", "Кажете: ги сакам и двете.", "Ich mag beides.", ich-mag, beides-gern]
  - ask: ["Say: cake most of all!", "قولي: الكعك أكثر شيء!", "Кажете: најмногу колач!", "Am liebsten Kuchen!", am-liebsten]
  - ask: ["Say: I don't like it too sweet.", "قولي: لا أحبه حلوًا جدًا.", "Кажете: не сакам многу слатко.", "Ich mag es nicht so süß.", ich-mag-nicht, suess]
  - ask: ["She asks what music you like.", "تسأل عن الموسيقى التي تحبينها.", "Таа прашува каква музика сакате.", "Was hörst du gern?", die-musik]
  - ask: ["Say: I like listening to music from home.", "قولي: أحب الاستماع إلى موسيقى من وطني.", "Кажете: сакам да слушам музика од мојата земја.", "Ich höre gern Musik aus meiner Heimat.", gern-hoeren]
  - ask: ["Say: I'd rather have something calm.", "قولي: أفضّل شيئًا هادئًا.", "Кажете: повеќе нешто мирно.", "Lieber etwas Ruhiges.", lieber]
