id: C2-08
protagonist: m
title: ["The reading circle", "حلقة القراءة", "Читачкиот круг"]
situation:
  - "The VHS reading circle is discussing Fontane's 'Effi Briest'. Professor Hartmann asks for your view of the narrator."
  - "حلقة القراءة في الجامعة الشعبية تناقش «إيفي بريست» لفونتانه. البروفيسور هارتمان يسألك عن رأيك في الراوي."
  - "Читачкиот круг на народниот универзитет разговара за „Ефи Брист“ од Фонтане. Професорот Хартман ве прашува за раскажувачот."
learn: [c2-literary-language]
culture: A German classic
items:
  - [der-roman, "der Roman", "the novel", "الرواية", "романот"]
  - [die-figur, "die Figur", "the character", "الشخصية", "ликот"]
  - [der-erzaehler, "der Erzähler", "the narrator", "الراوي", "раскажувачот"]
  - [die-gesellschaft, "die Gesellschaft", "society", "المجتمع", "општеството"]
  - [die-ehre-c2, "der Ehrenkodex", "the code of honour", "قانون الشرف", "кодексот на честа", {rare: true}]
  - [zwischen-den-zeilen-c2, "andeuten", "hint at, imply", "يلمّح", "навестува"]
  - [das-motiv, "das Motiv", "the motif", "الموضوع المتكرّر", "мотивот"]
  - [der-schauplatz, "der Schauplatz", "the setting", "مسرح الأحداث", "местото на дејството"]
  - [das-ist-ein-weites-feld, "Das ist ein weites Feld", "That's a big subject (Fontane)", "هذا موضوع واسع (فونتانه)", "Тоа е широко поле (Фонтане)"]
  - [tragisch, "tragisch", "tragic", "مأساوي", "трагично"]
dialogue:
  - [hartmann, "Wie wirkt der Erzähler auf Sie?", "How does the narrator strike you?", "كيف يبدو لك الراوي؟", "Каков ви се чини раскажувачот?"]
  - [protagonist, "Er urteilt nie direkt. Er deutet nur an — wie ein höflicher Beobachter.", "He never judges directly. He only hints — like a polite observer.", "لا يحكم مباشرة أبدًا. بل يلمّح فقط — كمراقب مهذّب.", "Никогаш не суди директно. Само навестува — како учтив набљудувач."]
  - [lena, "Und Effi? Für mich ist sie die tragischste Figur des Romans.", "And Effi? For me she's the novel's most tragic character.", "وإيفي؟ بالنسبة لي هي أكثر شخصيات الرواية مأساوية.", "А Ефи? За мене таа е најтрагичниот лик во романот."]
  - [protagonist, "Sie ist Opfer einer Gesellschaft, in der der Ehrenkodex wichtiger ist als das Leben.", "She's the victim of a society in which the code of honour matters more than life.", "إنها ضحية مجتمع يكون فيه قانون الشرف أهم من الحياة.", "Таа е жртва на општество во кое кодексот на честа е поважен од животот."]
  - [hartmann, "Ein starker Satz. Kennen Sie solche Gesellschaften?", "A strong sentence. Do you know such societies?", "جملة قوية. هل تعرف مجتمعات كهذه؟", "Силна реченица. Познавате ли такви општества?"]
  - [protagonist, "Leider ja. Deshalb berührt mich das Buch. Und das Motiv der Schaukel — Freiheit, die endet.", "Sadly, yes. That's why the book moves me. And the motif of the swing — freedom that ends.", "للأسف نعم. لذلك يلمسني الكتاب. ودافع الأرجوحة — حرية تنتهي.", "За жал, да. Затоа ме допира книгата. И мотивот на лулашката — слобода што завршува."]
  - [lena, "Und der Schauplatz, das kleine Kessin am Meer — so eng!", "And the setting, little Kessin by the sea — so narrow!", "ومسرح الأحداث، كيسين الصغيرة على البحر — ضيّقة جدًا!", "А местото на дејството, малиот Кесин крај морето — толку тесно!"]
  - [hartmann, "Wie Effis Vater sagt: „Das ist ein weites Feld.“ Bis nächste Woche!", "As Effi's father says: 'That's a big subject.' Until next week!", "كما يقول والد إيفي: «هذا موضوع واسع.» إلى الأسبوع القادم!", "Како што вели таткото на Ефи: „Тоа е широко поле.“ До следната недела!"]
teach:
  - ask: ["He asks about the narrator.", "يسأل عن الراوي.", "Тој прашува за раскажувачот.", "Wie wirkt der Erzähler?", der-erzaehler]
  - ask: ["Say: he only hints.", "قل: يلمّح فقط.", "Кажете: само навестува.", "Er deutet nur an.", zwischen-den-zeilen-c2]
  - ask: ["Say: the most tragic character of the novel.", "قل: أكثر شخصيات الرواية مأساوية.", "Кажете: најтрагичниот лик во романот.", "Die tragischste Figur des Romans.", tragisch, die-figur, der-roman]
  - note: ["Literary talk uses its own vocabulary — «Figur», «Erzähler», «Motiv», «Schauplatz» — and complex sentences: «Opfer einer Gesellschaft, in der der Ehrenkodex wichtiger ist als das Leben».", "الحديث الأدبي له مفرداته — «Figur»، «Erzähler»، «Motiv»، «Schauplatz» — وجمله المركّبة: «Opfer einer Gesellschaft, in der der Ehrenkodex wichtiger ist als das Leben».", "Книжевниот разговор има свој речник — «Figur», «Erzähler», «Motiv», «Schauplatz» — и сложени реченици: «Opfer einer Gesellschaft, in der der Ehrenkodex wichtiger ist als das Leben»."]
  - ask: ["Say: the victim of a society…", "قل: ضحية مجتمع…", "Кажете: жртва на општество…", "Opfer einer Gesellschaft…", die-gesellschaft]
  - ask: ["Say: the code of honour.", "قل: قانون الشرف.", "Кажете: кодексот на честа.", "Der Ehrenkodex.", die-ehre-c2]
  - ask: ["Say: the motif of the swing.", "قل: دافع الأرجوحة.", "Кажете: мотивот на лулашката.", "Das Motiv der Schaukel.", das-motiv]
  - ask: ["Say: the setting.", "قل: مسرح الأحداث.", "Кажете: местото на дејството.", "Der Schauplatz.", der-schauplatz]
  - ask: ["Quote Effi's father.", "اقتبس والد إيفي.", "Цитирајте го таткото на Ефи.", "Das ist ein weites Feld.", das-ist-ein-weites-feld]
  - note: ["Theodor Fontane's 'Effi Briest' (1895) tells of a young woman married off to an older man and destroyed by the honour code of Prussian society. Her father's evasive phrase «Das ist ein weites Feld» became a German saying for avoiding a difficult question.", "رواية «إيفي بريست» (1895) لتيودور فونتانه تحكي عن شابة زُوّجت لرجل أكبر منها ودمّرها قانون الشرف في المجتمع البروسي. وعبارة والدها المراوغة «Das ist ein weites Feld» صارت قولًا ألمانيًا للتهرّب من سؤال صعب.", "„Ефи Брист“ (1895) од Теодор Фонтане раскажува за млада жена омажена за постар човек и уништена од кодексот на честа на пруското општество. Избегнувачката фраза на нејзиниот татко «Das ist ein weites Feld» стана германска изрека за избегнување тешко прашање."]
