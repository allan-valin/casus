id: A2-08-m
tracks: [mk]
protagonist: m
title: ["Фенерите"]
situation: ["Празник на фенерите во градинката на Лука. Петар работи, па одите вие."]
learn: [de-mis_02]
culture: St Martin's lanterns
items:
  - [das-laternenfest, "das Laternenfest", "празникот на фенерите", {rare: true}]
  - [die-laterne, "die Laterne", "фенерот"]
  - [basteln, "basteln", "изработува рачно"]
  - [singen, "singen", "пеат"]
  - [mitbringen, "mitbringen", "носи со себе"]
  - [die-einladung, "die Einladung", "поканата"]
  - [die-ueberraschung, "die Überraschung", "изненадувањето"]
  - [der-umzug, "der Umzug", "поворката"]
  - [kerze, "die Kerze", "свеќата"]
  - [die-vorbereitung, "die Vorbereitung", "подготовката"]
dialogue:
  - [kruger, "Willkommen! Heute ist das Laternenfest.", "Добредојдовте! Денес е празникот на фенерите."]
  - [protagonist, "Danke für die Einladung. Petar arbeitet, ich bin der Opa.", "Благодарам за поканата. Петар работи, јас сум дедото."]
  - [kruger, "Schön! Luka hat seine Laterne selbst gebastelt.", "Убаво! Лука сам си го направи фенерот."]
  - [luka, "Opa, schau! Meine Laterne!", "Дедо, погледни! Мојот фенер!"]
  - [protagonist, "Wunderschön! Ist da eine Kerze drin?", "Прекрасно! Има ли свеќа внатре?"]
  - [kruger, "Nein, ein Licht mit Batterie. Sicherer.", "Не, светло со батерија. Побезбедно."]
  - [protagonist, "Und was machen wir jetzt?", "А што правиме сега?"]
  - [kruger, "Ein Umzug durch den Park. Die Kinder singen.", "Поворка низ паркот. Децата пеат."]
  - [protagonist, "Ich habe Kuchen mitgebracht. Eine Überraschung von Oma.", "Донесов колач. Изненадување од баба."]
teach:
  - ask: ["Кажете: празникот на фенерите.", "Das Laternenfest.", das-laternenfest]
  - ask: ["Заблагодарете за поканата.", "Danke für die Einladung.", die-einladung]
  - ask: ["Кажете: Лука сам го направи фенерот.", "Luka hat die Laterne gebastelt.", basteln, die-laterne]
  - ask: ["Прашајте: има ли свеќа внатре?", "Ist da eine Kerze drin?", kerze]
  - note: ["Многу именки завршуваат на «-ung», секогаш се од женски род («die») и доаѓаат од глаголи: «einladen» → «die Einladung», «überraschen» → «die Überraschung», «vorbereiten» → «die Vorbereitung»."]
  - ask: ["Кажете: поворка низ паркот.", "Ein Umzug durch den Park.", der-umzug]
  - ask: ["Кажете: децата пеат.", "Die Kinder singen.", singen]
  - ask: ["Кажете: донесов колач.", "Ich habe Kuchen mitgebracht.", mitbringen]
  - ask: ["Кажете: изненадување од баба.", "Eine Überraschung von Oma.", die-ueberraschung]
  - ask: ["Кажете: подготовката.", "Die Vorbereitung.", die-vorbereitung]
  - note: ["Свети Мартин, во ноември: децата одат со фенери и пеат. Германските баби и дедовци доаѓаат исто како и вие — тоа е празник и за нив."]
