id: C2-21-m
tracks: [mk]
protagonist: f
title: ["Лука во Битола"]
situation: ["Летото го носите Лука во Битола. Тој ве прашува на германски — неговиот полесен јазик."]
learn: []
learn_missing: [register-shifts]
culture: Reverse culture shock
items:
  - [fremd-geworden, "fremd geworden", "станало туѓо"]
  - [der-umgekehrte-kulturschock, "der umgekehrte Kulturschock", "обратниот културен шок", {rare: true}]
  - [zwischen-den-stuehlen, "zwischen den Stühlen sitzen", "да си меѓу два света"]
  - [die-heimat-c2, "die alte Heimat", "старата татковина"]
  - [sich-veraendert, "sich verändert haben", "да се променило"]
  - [die-sehnsucht, "die Sehnsucht", "копнежот"]
  - [der-hof, "der Hof", "дворот"]
  - [die-nachbarn-c2, "Die Nachbarn kommen einfach vorbei", "Соседите едноставно наминуваат"]
  - [ohne-termin, "ohne Termin", "без договор"]
  - [doppelt-zuhause, "doppelt zu Hause", "двојно дома"]
dialogue:
  - [luka, "Oma, warum kommen hier die Nachbarn einfach vorbei? Ohne Termin?", "Бабо, зошто тука соседите едноставно наминуваат? Без договор?"]
  - [protagonist, "So ist das bei uns. In Leipzig ruft man vorher an.", "Така е кај нас. Во Лајпциг се јавуваш однапред."]
  - [luka, "Mir gefällt das. Und der Hof mit den Feigen!", "Ми се допаѓа тоа. И дворот со смоквите!"]
  - [protagonist, "Weißt du, mir ist manches fremd geworden. Die Stadt hat sich verändert — und ich auch.", "Знаеш, некои работи ми станаа туѓи. Градот се промени — и јас исто."]
  - [luka, "Hast du Sehnsucht nach Leipzig?", "Ти недостига ли Лајпциг?"]
  - [protagonist, "Ein bisschen. Nach dir zu Hause, nach der Ordnung. Das ist der umgekehrte Kulturschock.", "Малку. По тебе дома, по редот. Тоа е обратниот културен шок."]
  - [luka, "Dann sitzt du zwischen den Stühlen, sagt Mama.", "Тогаш си меѓу два стола, вели мама."]
  - [protagonist, "Oder ich bin doppelt zu Hause — wie du.", "Или сум двојно дома — како тебе."]
teach:
  - ask: ["Лука прашува: без договор?", "Ohne Termin?", ohne-termin]
  - ask: ["Кажете: соседите едноставно наминуваат.", "Die Nachbarn kommen einfach vorbei.", die-nachbarn-c2]
  - ask: ["Кажете: дворот.", "Der Hof.", der-hof]
  - note: ["Промената на регистар го означува меѓупросторот: зборувате со внукот на германски за Битола. Изразот «zwischen den Stühlen sitzen» значи да седиш меѓу два стола — меѓу два света."]
  - ask: ["Кажете: некои работи ми станаа туѓи.", "Manches ist mir fremd geworden.", fremd-geworden]
  - ask: ["Кажете: градот се промени.", "Die Stadt hat sich verändert.", sich-veraendert]
  - ask: ["Кажете: копнеж.", "Die Sehnsucht.", die-sehnsucht]
  - ask: ["Кажете: обратниот културен шок.", "Der umgekehrte Kulturschock.", der-umgekehrte-kulturschock]
  - ask: ["Кажете: меѓу два света.", "Zwischen den Stühlen.", zwischen-den-stuehlen]
  - ask: ["Кажете: двојно дома.", "Doppelt zu Hause.", doppelt-zuhause]
  - ask: ["Кажете: старата татковина.", "Die alte Heimat.", die-heimat-c2]
  - note: ["И кај долги престои во странство, враќањето дома може да донесе „обратен културен шок“. Децата што растат во Германија честопати го сакаат топлото, спонтано соседство — и тоа е убав мост меѓу двата света."]
