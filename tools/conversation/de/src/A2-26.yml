id: A2-26
protagonist: m
title: ["The sports club", "النادي الرياضي", "Спортскиот клуб"]
situation:
  - "Three months of training. Petra invites you to become a member — and to the club evening."
  - "ثلاثة أشهر من التمرين. بيترا تدعوك لتصبح عضوًا — وإلى أمسية النادي."
  - "Три месеци тренинг. Петра ве кани да станете член — и на клупската вечер."
learn: [a2-um-zu]
culture: Clubs run by volunteers
items:
  - [der-mitgliedsbeitrag, "der Mitgliedsbeitrag", "the membership fee", "رسوم العضوية", "членарината", {rare: true}]
  - [die-mannschaft, "die Mannschaft", "the team", "الفريق", "екипата"]
  - [um-zu, "um … zu", "in order to", "من أجل أن", "за да"]
  - [das-formular-verein, "das Aufnahmeformular", "the membership form", "استمارة العضوية", "формуларот за зачленување", {rare: true}]
  - [ehrenamtlich, "ehrenamtlich", "voluntary, unpaid", "تطوعي", "доброволно"]
  - [der-vereinsabend, "der Vereinsabend", "the club evening", "أمسية النادي", "клупската вечер", {rare: true}]
  - [mithelfen, "mithelfen", "help out", "يساعد", "помага"]
  - [das-turnier, "das Turnier", "the tournament", "البطولة", "турнирот"]
  - [jaehrlich, "jährlich", "yearly", "سنويًا", "годишно"]
  - [neue-leute, "neue Leute", "new people", "أشخاص جدد", "нови луѓе"]
dialogue:
  - [petra, "Willst du Mitglied werden? Hier ist das Aufnahmeformular.", "Do you want to become a member? Here's the membership form.", "هل تريد أن تصبح عضوًا؟ هذه استمارة العضوية.", "Сакаш ли да станеш член? Еве го формуларот за зачленување."]
  - [protagonist, "Gern! Wie hoch ist der Mitgliedsbeitrag?", "Gladly! How much is the membership fee?", "بكل سرور! كم رسوم العضوية؟", "Со задоволство! Колкава е членарината?"]
  - [petra, "Nicht viel — jährlich. Er steht auf dem Formular.", "Not much — yearly. It's on the form.", "ليست كثيرة — سنويًا. مكتوبة على الاستمارة.", "Не многу — годишно. Пишува на формуларот."]
  - [protagonist, "Ich komme in den Verein, um neue Leute kennenzulernen.", "I'm joining the club to meet new people.", "أنضم إلى النادي لأتعرّف على أشخاص جدد.", "Влегувам во клубот за да запознаам нови луѓе."]
  - [petra, "Dann komm zum Vereinsabend am Freitag! Die ganze Mannschaft ist da.", "Then come to the club evening on Friday! The whole team will be there.", "إذن تعال إلى أمسية النادي يوم الجمعة! الفريق كله سيكون هناك.", "Тогаш дојди на клупската вечер во петок! Цела екипа ќе биде таму."]
  - [protagonist, "Wer organisiert das alles?", "Who organises all of it?", "من ينظّم كل هذا؟", "Кој го организира сето ова?"]
  - [petra, "Wir alle, ehrenamtlich. Hilfst du beim Turnier im Mai mit?", "All of us, voluntarily. Will you help out at the tournament in May?", "كلنا، تطوعًا. هل تساعد في البطولة في مايو؟", "Сите ние, доброволно. Ќе помогнеш на турнирот во мај?"]
  - [protagonist, "Klar! Um zu helfen, bin ich da.", "Sure! That's what I'm here for — to help.", "طبعًا! أنا هنا لأساعد.", "Секако! Тука сум за да помагам."]
teach:
  - ask: ["Ask: how much is the membership fee?", "اسأل: كم رسوم العضوية؟", "Прашајте: колкава е членарината?", "Wie hoch ist der Mitgliedsbeitrag?", der-mitgliedsbeitrag]
  - ask: ["Say: the membership form.", "قل: استمارة العضوية.", "Кажете: формуларот за зачленување.", "Das Aufnahmeformular.", das-formular-verein]
  - ask: ["Say: yearly.", "قل: سنويًا.", "Кажете: годишно.", "Jährlich.", jaehrlich]
  - note: ["«um … zu» gives a purpose, with the verb at the end: «um neue Leute kennenzulernen» — in order to meet new people.", "«um … zu» تعبّر عن الهدف، والفعل في الآخر: «um neue Leute kennenzulernen» — لكي أتعرّف على أشخاص جدد.", "«um … zu» кажува цел, со глаголот на крајот: «um neue Leute kennenzulernen» — за да запознаам нови луѓе."]
  - ask: ["Say: I'm joining to meet new people.", "قل: أنضم لأتعرّف على أشخاص جدد.", "Кажете: влегувам за да запознаам нови луѓе.", "Um neue Leute kennenzulernen.", um-zu, neue-leute]
  - ask: ["Say: the club evening.", "قل: أمسية النادي.", "Кажете: клупската вечер.", "Der Vereinsabend.", der-vereinsabend]
  - ask: ["Say: the whole team.", "قل: الفريق كله.", "Кажете: цела екипа.", "Die ganze Mannschaft.", die-mannschaft]
  - ask: ["Say: voluntarily.", "قل: تطوعًا.", "Кажете: доброволно.", "Ehrenamtlich.", ehrenamtlich]
  - ask: ["Say: the tournament.", "قل: البطولة.", "Кажете: турнирот.", "Das Turnier.", das-turnier]
  - ask: ["Say: I'll help out.", "قل: سأساعد.", "Кажете: ќе помогнам.", "Ich helfe mit.", mithelfen]
  - note: ["Most clubs are run by unpaid volunteers. Helping at a tournament or behind the bar is how newcomers become part of the group — and the fee stays low because of it.", "معظم الأندية يديرها متطوعون بلا أجر. المساعدة في بطولة أو خلف البار هي طريق القادم الجديد ليصبح جزءًا من المجموعة — وبفضل ذلك تبقى الرسوم منخفضة.", "Повеќето клубови ги водат доброволци без плата. Помагањето на турнир или зад шанкот е начинот на кој новите стануваат дел од групата — и затоа членарината е ниска."]
