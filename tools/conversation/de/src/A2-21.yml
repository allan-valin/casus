id: A2-21
protagonist: f
title: ["The turn of 1989", "التحوّل عام 1989", "Пресвртот од 1989"]
situation:
  - "A Monday evening at the Nikolaikirche. Frau Becker tells you what happened here in 1989."
  - "مساء يوم اثنين عند كنيسة نيكولاي. السيدة بيكر تحكي لكِ ما حدث هنا عام 1989."
  - "Понеделник навечер кај црквата Николаи. Госпоѓа Бекер ви раскажува што се случило тука во 1989."
learn: [de-vsp_01]
culture: Leipzig and the peaceful revolution
items:
  - [die-kirche, "die Kirche", "the church", "الكنيسة", "црквата"]
  - [jeden-montag, "jeden Montag", "every Monday", "كل يوم اثنين", "секој понеделник"]
  - [die-demonstration, "die Demonstration", "the demonstration", "المظاهرة", "демонстрацијата"]
  - [friedlich, "friedlich", "peaceful", "سلمي", "мирно"]
  - [die-mauer, "die Mauer", "the Wall", "الجدار", "ѕидот"]
  - [es-gab, "es gab", "there was / there were", "كان هناك", "имаше"]
  - [wir-hatten-angst, "wir hatten Angst", "we were afraid", "كنا خائفين", "се плашевме"]
  - [die-freiheit, "die Freiheit", "freedom", "الحرية", "слободата"]
  - [wir-sind-das-volk, "Wir sind das Volk!", "We are the people!", "نحن الشعب!", "Ние сме народот!"]
  - [fiel, "fiel", "fell", "سقط", "падна"]
  - [ich-war-dabei, "ich war dabei", "I was there", "كنت هناك", "бев таму"]
dialogue:
  - [becker, "In dieser Kirche hat alles angefangen. Jeden Montag gab es ein Gebet für den Frieden.", "It all started in this church. Every Monday there was a prayer for peace.", "في هذه الكنيسة بدأ كل شيء. كل يوم اثنين كانت هناك صلاة من أجل السلام.", "Во оваа црква сè почна. Секој понеделник имаше молитва за мир."]
  - [protagonist, "Und dann?", "And then?", "ثم ماذا؟", "А потоа?"]
  - [becker, "Dann kamen die Demonstrationen. Am 9. Oktober waren wir siebzigtausend.", "Then came the demonstrations. On 9 October we were seventy thousand.", "ثم جاءت المظاهرات. في التاسع من أكتوبر كنا سبعين ألفًا.", "Потоа дојдоа демонстрациите. На 9 октомври бевме седумдесет илјади."]
  - [protagonist, "Hatten Sie Angst?", "Were you afraid?", "هل كنتِ خائفة؟", "Дали се плашевте?"]
  - [becker, "Ja, wir hatten Angst. Es gab viel Polizei. Aber alles blieb friedlich.", "Yes, we were afraid. There were lots of police. But everything stayed peaceful.", "نعم، كنا خائفين. كانت هناك شرطة كثيرة. لكن كل شيء بقي سلميًا.", "Да, се плашевме. Имаше многу полиција. Но сè остана мирно."]
  - [protagonist, "Was haben die Leute gerufen?", "What did people chant?", "ماذا هتف الناس؟", "Што викаа луѓето?"]
  - [becker, "„Wir sind das Volk!“ Wir wollten Freiheit.", "'We are the people!' We wanted freedom.", "«نحن الشعب!» أردنا الحرية.", "„Ние сме народот!“ Сакавме слобода."]
  - [protagonist, "Und einen Monat später fiel die Mauer.", "And a month later the Wall fell.", "وبعد شهر سقط الجدار.", "А еден месец подоцна падна ѕидот."]
  - [becker, "Genau. Ich war dabei. Ich vergesse das nie.", "Exactly. I was there. I'll never forget it.", "بالضبط. كنت هناك. لن أنسى ذلك أبدًا.", "Точно. Бев таму. Никогаш нема да го заборавам."]
teach:
  - note: ["Stories and history use the simple past (Präteritum): «es gab» (there was), «kamen» (came), «blieb» (stayed), «fiel» (fell). In speech the Perfekt is more common, but «war», «hatte», «gab» are everywhere.", "القصص والتاريخ تستعمل الماضي البسيط: «es gab» (كان هناك)، «kamen» (جاؤوا)، «blieb» (بقي)، «fiel» (سقط). في الكلام اليومي الماضي المركب أكثر، لكن «war» و«hatte» و«gab» في كل مكان.", "Приказните и историјата користат просто минато (Präteritum): «es gab» (имаше), «kamen» (дојдоа), «blieb» (остана), «fiel» (падна). Во говор е почест перфектот, но «war», «hatte», «gab» се насекаде."]
  - ask: ["Say: in this church it all started.", "قولي: في هذه الكنيسة بدأ كل شيء.", "Кажете: во оваа црква сè почна.", "In dieser Kirche hat alles angefangen.", die-kirche]
  - ask: ["Say: every Monday there was a prayer.", "قولي: كل يوم اثنين كانت هناك صلاة.", "Кажете: секој понеделник имаше молитва.", "Jeden Montag gab es ein Gebet.", jeden-montag, es-gab]
  - ask: ["Say: then came the demonstrations.", "قولي: ثم جاءت المظاهرات.", "Кажете: потоа дојдоа демонстрациите.", "Dann kamen die Demonstrationen.", die-demonstration]
  - ask: ["Ask: were you afraid? (polite)", "اسألي: هل كنتِ خائفة؟", "Прашајте: дали се плашевте?", "Hatten Sie Angst?", wir-hatten-angst]
  - ask: ["Say: everything stayed peaceful.", "قولي: كل شيء بقي سلميًا.", "Кажете: сè остана мирно.", "Alles blieb friedlich.", friedlich]
  - ask: ["Say what they chanted.", "قولي ما هتفوا به.", "Кажете што викаа.", "Wir sind das Volk!", wir-sind-das-volk]
  - ask: ["Say: we wanted freedom.", "قولي: أردنا الحرية.", "Кажете: сакавме слобода.", "Wir wollten Freiheit.", die-freiheit]
  - ask: ["Say: a month later the Wall fell.", "قولي: بعد شهر سقط الجدار.", "Кажете: еден месец подоцна падна ѕидот.", "Einen Monat später fiel die Mauer.", die-mauer, fiel]
  - ask: ["She says: I was there.", "تقول: كنت هناك.", "Таа вели: бев таму.", "Ich war dabei.", ich-war-dabei]
  - note: ["In autumn 1989 the Monday demonstrations in Leipzig grew week by week; on 9 October about 70,000 marched, and it stayed peaceful. On 9 November the Berlin Wall opened. Leipzig calls itself the 'city of the peaceful revolution'.", "في خريف 1989 كبرت مظاهرات الاثنين في لايبزيغ أسبوعًا بعد أسبوع؛ في التاسع من أكتوبر سار نحو سبعين ألفًا وبقيت سلمية. وفي التاسع من نوفمبر فُتح جدار برلين. تسمّي لايبزيغ نفسها «مدينة الثورة السلمية».", "Есента 1989 понеделнишните демонстрации во Лајпциг растеа од недела во недела; на 9 октомври марширале околу 70 000 и остана мирно. На 9 ноември се отвори Берлинскиот ѕид. Лајпциг се нарекува „град на мирната револуција“."]
