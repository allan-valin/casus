id: B2-21
protagonist: f
title: ["Religion", "الدين", "Религија"]
situation:
  - "Leipzig is one of the least religious cities in Europe. Over tea, Lena and you talk about faith — and that line on the payslip."
  - "لايبزيغ من أقل مدن أوروبا تديّنًا. على الشاي تتحدّثين مع لينا عن الإيمان — وعن ذلك السطر في كشف الراتب."
  - "Лајпциг е еден од најмалку религиозните градови во Европа. На чај разговарате со Лена за верата — и за онаа ставка во платниот лист."
learn: [de-vsub_04]
culture: Faith in a secular city
items:
  - [der-glaube, "der Glaube", "faith", "الإيمان", "верата"]
  - [glaeubig, "gläubig", "religious, believing", "مؤمن، متديّن", "верник"]
  - [konfessionslos, "konfessionslos", "without religious affiliation", "بلا انتماء ديني", "без вероисповед", {rare: true}]
  - [die-moschee, "die Moschee", "the mosque", "المسجد", "џамијата"]
  - [der-kirchenaustritt, "der Kirchenaustritt", "leaving the church (officially)", "الخروج الرسمي من الكنيسة", "излегувањето од црквата", {rare: true}]
  - [das-mitglied-kirche, "Mitglied der Kirche", "church member", "عضو في الكنيسة", "член на црквата"]
  - [die-gemeinde, "die Gemeinde", "the congregation, community", "الجماعة، الرعية", "заедницата"]
  - [sie-seien, "sie seien …", "(reported) they are …", "(منقولًا) إنهم …", "(пренесено) дека се …"]
  - [es-gebe, "es gebe …", "(reported) there is …", "(منقولًا) إنه يوجد …", "(пренесено) дека има …"]
  - [die-religionsfreiheit, "die Religionsfreiheit", "freedom of religion", "حرية الدين", "слободата на вероисповед", {rare: true}]
  - [respektieren, "respektieren", "respect", "يحترم", "почитува"]
dialogue:
  - [lena, "Laut einer Umfrage sei die Mehrheit in Leipzig konfessionslos.", "According to a survey, the majority in Leipzig has no religious affiliation.", "بحسب استطلاع، فإنّ أغلبية سكان لايبزيغ بلا انتماء ديني.", "Според една анкета, мнозинството во Лајпциг било без вероисповед."]
  - [protagonist, "Und du? Bist du gläubig?", "And you? Are you religious?", "وأنتِ؟ هل أنتِ مؤمنة؟", "А ти? Дали си верник?"]
  - [lena, "Nicht wirklich. Ich bin aus der Kirche ausgetreten — wegen der Kirchensteuer.", "Not really. I left the church — because of the church tax.", "ليس تمامًا. خرجتُ من الكنيسة — بسبب ضريبة الكنيسة.", "Не баш. Излегов од црквата — поради црковниот данок."]
  - [protagonist, "Muss man dafür etwas machen?", "Do you have to do anything for that?", "هل يجب فعل شيء لذلك؟", "Дали треба нешто да се направи за тоа?"]
  - [lena, "Ja, der Kirchenaustritt ist ein Termin beim Amt. Wer nicht Mitglied der Kirche ist, zahlt nichts.", "Yes, leaving the church is an appointment at the office. Whoever isn't a church member pays nothing.", "نعم، الخروج من الكنيسة موعد في الدائرة. ومن ليس عضوًا في الكنيسة لا يدفع شيئًا.", "Да, излегувањето од црквата е термин во канцеларијата. Кој не е член на црквата, не плаќа ништо."]
  - [protagonist, "Und Moscheen? Orthodoxe Kirchen?", "And mosques? Orthodox churches?", "والمساجد؟ والكنائس الأرثوذكسية؟", "А џамиите? Православните цркви?"]
  - [lena, "Die nehmen keine Kirchensteuer. Die Gemeinden leben von Spenden.", "They don't take church tax. The communities live on donations.", "لا تأخذ ضريبة كنيسة. الجماعات تعيش من التبرّعات.", "Тие не земаат црковен данок. Заедниците живеат од донации."]
  - [protagonist, "Mein Nachbar sagt, es gebe hier keine Religionsfreiheit.", "My neighbour says there's no freedom of religion here.", "جاري يقول إنه لا توجد هنا حرية دينية.", "Мојот сосед вели дека тука немало слобода на вероисповед."]
  - [lena, "Doch! Jeder darf glauben, was er will — oder nichts. Man respektiert es nur leise.", "There is! Everyone may believe what they want — or nothing. People just respect it quietly.", "بل توجد! يحق لكل أحد أن يؤمن بما يريد — أو بلا شيء. الناس يحترمون ذلك بهدوء فقط.", "Има! Секој смее да верува што сака — или ништо. Луѓето само тивко го почитуваат."]
teach:
  - note: ["Konjunktiv I reports what someone else claims, keeping a distance: «Die Mehrheit sei konfessionslos» (is, they say), «es gebe keine Religionsfreiheit» (there is, he says).", "صيغة Konjunktiv I تنقل ما يدّعيه غيرك مع الاحتفاظ بمسافة: «Die Mehrheit sei konfessionslos» (إنّ الأغلبية…، كما يقولون)، «es gebe keine Religionsfreiheit» (إنه لا يوجد…، كما يقول).", "Konjunktiv I пренесува што тврди некој друг, со дистанца: «Die Mehrheit sei konfessionslos» (била, велат), «es gebe keine Religionsfreiheit» (немало, вели тој)."]
  - ask: ["Report: the majority has no religious affiliation.", "انقلي: الأغلبية بلا انتماء ديني.", "Пренесете: мнозинството било без вероисповед.", "Die Mehrheit sei konfessionslos.", sie-seien, konfessionslos]
  - ask: ["Ask: are you religious?", "اسألي: هل أنتِ مؤمنة؟", "Прашајте: дали си верник?", "Bist du gläubig?", glaeubig]
  - ask: ["Say: faith.", "قولي: الإيمان.", "Кажете: верата.", "Der Glaube.", der-glaube]
  - ask: ["Say: leaving the church is an appointment at the office.", "قولي: الخروج من الكنيسة موعد في الدائرة.", "Кажете: излегувањето од црквата е термин.", "Der Kirchenaustritt ist ein Termin beim Amt.", der-kirchenaustritt]
  - ask: ["Say: whoever isn't a church member pays nothing.", "قولي: من ليس عضوًا في الكنيسة لا يدفع شيئًا.", "Кажете: кој не е член на црквата не плаќа ништо.", "Wer nicht Mitglied der Kirche ist, zahlt nichts.", das-mitglied-kirche, die-kirchensteuer]
  - ask: ["Ask: and mosques?", "اسألي: والمساجد؟", "Прашајте: а џамиите?", "Und Moscheen?", die-moschee]
  - ask: ["Say: the communities live on donations.", "قولي: الجماعات تعيش من التبرّعات.", "Кажете: заедниците живеат од донации.", "Die Gemeinden leben von Spenden.", die-gemeinde]
  - ask: ["Report: he says there's no freedom of religion.", "انقلي: يقول إنه لا توجد حرية دينية.", "Пренесете: вели дека немало слобода на вероисповед.", "Er sagt, es gebe keine Religionsfreiheit.", es-gebe, die-religionsfreiheit]
  - ask: ["Say: people respect it.", "قولي: الناس يحترمون ذلك.", "Кажете: луѓето го почитуваат.", "Man respektiert es.", respektieren]
  - note: ["Church tax is collected with your wages only for members of churches that levy it — Catholic, Protestant and some Jewish communities. Mosques and almost all Orthodox churches don't; they live on donations. If you're registered as a member by mistake or want to leave, it's a formal step at the registry office or court, not a letter to the church. Faith is seen as private: people seldom talk about it, but freedom of religion is in the Basic Law.", "ضريبة الكنيسة تُقتطع من الأجر فقط لأعضاء الكنائس التي تفرضها — الكاثوليكية والبروتستانتية وبعض الجماعات اليهودية. المساجد ومعظم الكنائس الأرثوذكسية لا تفرضها؛ وتعيش من التبرّعات. إذا سُجّلتِ عضوة خطأً أو أردتِ الخروج، فهذه خطوة رسمية في مكتب السجل المدني أو المحكمة، لا رسالة إلى الكنيسة. والإيمان يُعدّ شأنًا خاصًا: نادرًا ما يتحدّث الناس عنه، لكن حرية الدين مكفولة في القانون الأساسي.", "Црковниот данок се наплаќа со платата само на членовите на цркви што го наплаќаат — католичката, протестантската и некои еврејски заедници. Џамиите и речиси сите православни цркви не; живеат од донации. Ако сте погрешно запишани како член или сакате да излезете, тоа е формален чекор во матичното или во судот, не писмо до црквата. Верата се смета за приватна: ретко се зборува за неа, но слободата на вероисповед е во Основниот закон."]
