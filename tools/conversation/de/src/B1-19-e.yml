id: B1-19-e
tracks: [en]
protagonist: f
title: ["A friend from the shelter"]
situation: ["Omid, from your seminar, came from Afghanistan as a refugee. Over coffee he tells you how he arrived."]
learn: [de-vcp_07]
culture: Several paths into the same country
items:
  - [die-unterkunft, "die Unterkunft", "the shelter, accommodation"]
  - [kam-an, "kam an", "arrived"]
  - [ist-angekommen, "ist angekommen", "has arrived"]
  - [das-asylverfahren, "das Asylverfahren", "the asylum procedure", {rare: true}]
  - [die-anerkennung, "die Anerkennung", "recognition (of status)"]
  - [die-schule-nachgeholt, "das Abitur nachgeholt", "caught up on school-leaving exams"]
  - [hat-angefangen, "hat angefangen", "started"]
  - [zog-um, "zog um", "moved (house)"]
  - [allein, "allein", "alone"]
  - [stolz, "stolz", "proud"]
dialogue:
  - [protagonist, "Omid, wie bist du nach Deutschland gekommen?", "Omid, how did you come to Germany?"]
  - [omid, "Mit sechzehn, allein. Ich kam im Winter an.", "At sixteen, alone. I arrived in winter."]
  - [protagonist, "Wo hast du gewohnt?", "Where did you live?"]
  - [omid, "Zuerst in einer Unterkunft mit vielen Leuten. Das Asylverfahren dauerte lange.", "First in a shelter with lots of people. The asylum procedure took a long time."]
  - [protagonist, "Und dann?", "And then?"]
  - [omid, "Nach der Anerkennung zog ich in eine WG um. Ich habe das Abitur nachgeholt.", "After recognition I moved into a flat-share. I caught up on my school-leaving exams."]
  - [protagonist, "Und jetzt studierst du Informatik. Das ist toll!", "And now you're studying computer science. That's great!"]
  - [omid, "Ja. Ich habe ganz unten angefangen. Heute bin ich stolz.", "Yes. I started right at the bottom. Today I'm proud."]
teach:
  - ask: ["Ask: how did you come to Germany?", "Wie bist du nach Deutschland gekommen?", ist-angekommen]
  - ask: ["He says: alone, at sixteen.", "Allein, mit sechzehn.", allein]
  - note: ["Separable verbs split in the simple past too: «ankommen» → «ich kam an»; «umziehen» → «ich zog um». In the perfect they join: «ich bin angekommen»."]
  - ask: ["Say: I arrived in winter.", "Ich kam im Winter an.", kam-an]
  - ask: ["Say: first in a shelter.", "Zuerst in einer Unterkunft.", die-unterkunft]
  - ask: ["Say: the asylum procedure took a long time.", "Das Asylverfahren dauerte lange.", das-asylverfahren]
  - ask: ["Say: after recognition I moved.", "Nach der Anerkennung zog ich um.", die-anerkennung, zog-um]
  - ask: ["Say: I caught up on my school-leaving exams.", "Ich habe das Abitur nachgeholt.", die-schule-nachgeholt]
  - ask: ["Say: I started right at the bottom.", "Ich habe ganz unten angefangen.", hat-angefangen]
  - ask: ["Say: today I'm proud.", "Heute bin ich stolz.", stolz]
  - note: ["People arrive by many routes — study, work, family, EU freedom of movement, asylum — with different rights at each step. Classmates who came as refugees often started from zero. The rules change: check the current ones."]
