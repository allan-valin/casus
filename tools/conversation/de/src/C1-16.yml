id: C1-16
protagonist: m
title: ["Mental health", "الصحة النفسية", "Ментално здравје"]
situation:
  - "For months you've slept badly and felt empty. Dr Wagner listens — and talks about therapy."
  - "منذ أشهر تنام بشكل سيئ وتشعر بالفراغ. الدكتورة فاغنر تستمع — وتتحدّث عن العلاج النفسي."
  - "Со месеци лошо спиете и се чувствувате празно. Д-р Вагнер слуша — и зборува за терапија."
learn: [de-c1-soll-will, de-c1-durfte]
culture: Taboo at home, normal here
items:
  - [die-psychotherapie, "die Psychotherapie", "psychotherapy", "العلاج النفسي", "психотерапијата"]
  - [der-therapieplatz, "der Therapieplatz", "a place in therapy", "مكان للعلاج", "место за терапија", {rare: true}]
  - [das-burnout, "das Burnout", "burnout", "الاحتراق النفسي", "согорувањето"]
  - [die-erschoepfung, "die Erschöpfung", "exhaustion", "الإنهاك", "исцрпеноста"]
  - [schlecht-schlafen, "schlecht schlafen", "sleep badly", "ينام بشكل سيئ", "лошо спие"]
  - [die-sprechstunde-psych, "die psychotherapeutische Sprechstunde", "a first therapy consultation", "استشارة نفسية أولى", "прва психотерапевтска консултација", {rare: true}]
  - [koennte-sein, "es könnte … sein", "it could be …", "قد يكون …", "би можело да е …"]
  - [muss-nicht, "muss nicht …", "doesn't have to (mean) …", "ليس بالضرورة …", "не мора да …"]
  - [die-krankschreibung, "die Krankschreibung", "a sick note", "الإجازة المرضية", "боледувањето"]
  - [schaemen, "sich schämen", "be ashamed", "يخجل", "се срами"]
dialogue:
  - [protagonist, "Ich schlafe schlecht und fühle mich leer. Seit Monaten.", "I sleep badly and feel empty. For months.", "أنام بشكل سيئ وأشعر بالفراغ. منذ أشهر.", "Лошо спијам и се чувствувам празно. Со месеци."]
  - [wagner, "Das könnte eine Erschöpfung sein, vielleicht ein Burnout. Das muss nichts Schlimmes bedeuten, aber wir nehmen es ernst.", "That could be exhaustion, perhaps burnout. It doesn't have to mean anything bad, but we take it seriously.", "قد يكون هذا إنهاكًا، ربما احتراقًا نفسيًا. ليس بالضرورة أن يعني شيئًا سيئًا، لكننا نأخذه بجدية.", "Тоа би можело да е исцрпеност, можеби согорување. Не мора да значи нешто лошо, но го сфаќаме сериозно."]
  - [protagonist, "Bei uns spricht man darüber nicht. Ich schäme mich ein bisschen.", "Where I'm from people don't talk about it. I'm a bit ashamed.", "عندنا لا يتحدّث الناس عن ذلك. أخجل قليلًا.", "Кај нас за тоа не се зборува. Малку се срамам."]
  - [wagner, "Das müssen Sie nicht. Fast jeder Dritte hat einmal im Leben so etwas.", "You don't have to be. Almost one in three has something like this once in their life.", "لا داعي لذلك. ما يقارب واحدًا من كل ثلاثة يمرّ بشيء كهذا مرة في حياته.", "Не мора. Речиси секој трет еднаш во животот има нешто такво."]
  - [protagonist, "Und was kann ich tun?", "And what can I do?", "وماذا يمكنني أن أفعل؟", "А што можам да направам?"]
  - [wagner, "Eine Psychotherapie. Ein Therapieplatz dürfte schwer zu finden sein — aber eine erste Sprechstunde geht schneller, auch über 116117.", "Psychotherapy. A place in therapy is likely to be hard to find — but a first consultation is quicker, also through 116117.", "العلاج النفسي. يُرجَّح أن يكون العثور على مكان للعلاج صعبًا — لكن الاستشارة الأولى أسرع، عبر 116117 أيضًا.", "Психотерапија. Место за терапија веројатно тешко ќе се најде — но првата консултација е побрза, и преку 116117."]
  - [protagonist, "Und die Arbeit?", "And work?", "والعمل؟", "А работата?"]
  - [wagner, "Ich schreibe Sie erst einmal zwei Wochen krank. Ruhe ist jetzt Teil der Behandlung.", "I'll give you a sick note for two weeks first. Rest is now part of the treatment.", "سأمنحك أولًا إجازة مرضية لأسبوعين. الراحة الآن جزء من العلاج.", "Прво ќе ве ставам на боледување две недели. Одморот сега е дел од лекувањето."]
teach:
  - ask: ["Say: I sleep badly and feel empty.", "قل: أنام بشكل سيئ وأشعر بالفراغ.", "Кажете: лошо спијам и се чувствувам празно.", "Ich schlafe schlecht und fühle mich leer.", schlecht-schlafen]
  - note: ["Modals for careful judgements: «Das könnte ein Burnout sein» (could be), «Das muss nichts Schlimmes bedeuten» (doesn't have to mean), «Ein Therapieplatz dürfte schwer zu finden sein» (is likely to be).", "الأفعال المساعدة للأحكام الحذرة: «Das könnte ein Burnout sein» (قد يكون)، «Das muss nichts Schlimmes bedeuten» (ليس بالضرورة)، «Ein Therapieplatz dürfte schwer zu finden sein» (يُرجَّح).", "Модални глаголи за внимателни проценки: «Das könnte ein Burnout sein» (би можело), «Das muss nichts Schlimmes bedeuten» (не мора да значи), «Ein Therapieplatz dürfte schwer zu finden sein» (веројатно)."]
  - ask: ["She says: that could be exhaustion.", "تقول: قد يكون هذا إنهاكًا.", "Таа вели: тоа би можело да е исцрпеност.", "Das könnte eine Erschöpfung sein.", koennte-sein, die-erschoepfung]
  - ask: ["Say: burnout.", "قل: الاحتراق النفسي.", "Кажете: согорување.", "Das Burnout.", das-burnout]
  - ask: ["She says: it doesn't have to mean anything bad.", "تقول: ليس بالضرورة أن يعني شيئًا سيئًا.", "Таа вели: не мора да значи нешто лошо.", "Das muss nichts Schlimmes bedeuten.", muss-nicht]
  - ask: ["Say: I'm a bit ashamed.", "قل: أخجل قليلًا.", "Кажете: малку се срамам.", "Ich schäme mich ein bisschen.", schaemen]
  - ask: ["Say: psychotherapy.", "قل: العلاج النفسي.", "Кажете: психотерапија.", "Eine Psychotherapie.", die-psychotherapie]
  - ask: ["Say: a place in therapy is hard to find.", "قل: مكان للعلاج صعب العثور عليه.", "Кажете: место за терапија тешко се наоѓа.", "Ein Therapieplatz ist schwer zu finden.", der-therapieplatz]
  - ask: ["Say: a first therapy consultation.", "قل: استشارة نفسية أولى.", "Кажете: прва психотерапевтска консултација.", "Eine psychotherapeutische Sprechstunde.", die-sprechstunde-psych]
  - ask: ["Say: a sick note for two weeks.", "قل: إجازة مرضية لأسبوعين.", "Кажете: боледување две недели.", "Eine Krankschreibung für zwei Wochen.", die-krankschreibung]
  - note: ["Psychotherapy is paid by public health insurance. You can book a first consultation (psychotherapeutische Sprechstunde) directly or via 116117; regular therapy places often have waiting lists, so ask several practices. In a crisis: 112, or the Telefonseelsorge (0800 111 0 111, free, day and night). Talking about mental health is increasingly normal here.", "العلاج النفسي يدفعه التأمين الصحي العام. يمكنك حجز استشارة أولى مباشرة أو عبر 116117؛ وأماكن العلاج المنتظم عليها غالبًا قوائم انتظار، فاسأل عدة عيادات. في الأزمة: 112، أو خط المساعدة الهاتفية (0800 111 0 111، مجاني، ليلًا ونهارًا). والحديث عن الصحة النفسية أصبح أمرًا عاديًا هنا أكثر فأكثر.", "Психотерапијата ја плаќа јавното здравствено осигурување. Прва консултација можете да закажете директно или преку 116117; за редовна терапија често има листи на чекање, па прашајте во повеќе ординации. Во криза: 112 или Telefonseelsorge (0800 111 0 111, бесплатно, дење и ноќе). Зборувањето за менталното здравје тука сѐ повеќе е нормално."]
