id: B2-30
protagonist: m
title: ["The future", "المستقبل", "Иднината"]
situation:
  - "A summer evening on Jonas and Svenja's balcony. Will you stay in Germany — or go back one day? A look back at all of B2."
  - "أمسية صيفية على شرفة يوناس وسفينيا. هل ستبقى في ألمانيا — أم تعود يومًا ما؟ نظرة إلى المستوى B2 كله."
  - "Летна вечер на балконот на Јонас и Свења. Дали ќе останете во Германија — или еден ден ќе се вратите? Поглед наназад кон целото B2."
learn: []
culture: Staying or going back
items:
  - [die-zukunft, "die Zukunft", "the future", "المستقبل", "иднината"]
