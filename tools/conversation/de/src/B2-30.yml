  - [hier-bleiben, "hierbleiben", "stay here", "يبقى هنا", "останува тука"]
  - [zwischen-zwei-welten, "zwischen zwei Welten", "between two worlds", "بين عالمين", "меѓу два света"]
  - [der-widerspruch, "der Widerspruch", "the contradiction", "التناقض", "противречноста"]
  - [fuer-immer, "für immer", "for ever", "إلى الأبد", "засекогаш"]
  - [wo-auch-immer, "wo auch immer", "wherever", "أينما كان", "каде и да е"]
  - [das-zuhause, "das Zuhause", "home (where you live)", "البيت، المسكن", "домот"]
  - [ich-bin-angekommen, "ich bin angekommen", "I've arrived (settled in)", "لقد استقررتُ", "пристигнав, се сместив"]
  - [wer-weiss, "Wer weiß?", "Who knows?", "من يدري؟", "Кој знае?"]
dialogue:
  - [svenja, "Und? Bleibst du für immer in Deutschland?", "So? Are you staying in Germany for ever?", "إذن؟ هل ستبقى في ألمانيا إلى الأبد؟", "И? Остануваш ли засекогаш во Германија?"]
  - [protagonist, "Wer weiß? Manchmal denke ich, ich gehe zurück. Manchmal will ich hierbleiben.", "Who knows? Sometimes I think I'll go back. Sometimes I want to stay here.", "من يدري؟ أحيانًا أفكّر أن أعود. وأحيانًا أريد أن أبقى هنا.", "Кој знае? Понекогаш мислам дека ќе се вратам. Понекогаш сакам да останам тука."]
  - [jonas, "Das klingt nach zwei Welten.", "That sounds like two worlds.", "هذا يبدو مثل عالمين.", "Тоа звучи како два света."]
  - [protagonist, "Genau. Meine Heimat ist dort. Aber mein Zuhause ist hier.", "Exactly. My homeland is there. But my home is here.", "بالضبط. وطني هناك. لكن بيتي هنا.", "Точно. Татковината ми е таму. Но домот ми е тука."]
  - [svenja, "Ist das ein Widerspruch?", "Is that a contradiction?", "هل هذا تناقض؟", "Дали е тоа противречност?"]
  - [protagonist, "Nein. Ich glaube, ich bin angekommen — mit beiden.", "No. I think I've arrived — with both.", "لا. أظن أنني استقررتُ — مع الاثنين.", "Не. Мислам дека пристигнав — со двете."]
  - [jonas, "Auf die Zukunft! Wo auch immer.", "To the future! Wherever it is.", "نخب المستقبل! أينما كان.", "За иднината! Каде и да е."]
  - [protagonist, "Auf die Zukunft. Und auf euch.", "To the future. And to you.", "نخب المستقبل. ونخبكما.", "За иднината. И за вас."]
teach:
  - ask: ["She asks: are you staying for ever?", "تسأل: هل ستبقى إلى الأبد؟", "Таа прашува: остануваш ли засекогаш?", "Bleibst du für immer?", hier-bleiben, fuer-immer]
  - ask: ["She asks: is that a contradiction?", "تسأل: هل هذا تناقض؟", "Таа прашува: дали е тоа противречност?", "Ist das ein Widerspruch?", der-widerspruch]
  - ask: ["Jonas: wherever it is.", "يوناس: أينما كان.", "Јонас: каде и да е.", "Wo auch immer.", wo-auch-immer]
  - ask: ["Say: who knows?", "قل: من يدري؟", "Кажете: кој знае?", "Wer weiß?", wer-weiss]
  - ask: ["Say: sometimes I think I'll go back.", "قل: أحيانًا أفكّر أن أعود.", "Кажете: понекогаш мислам дека ќе се вратам.", "Manchmal denke ich, ich gehe zurück.", zurueckgehen]
  - ask: ["Say: between two worlds.", "قل: بين عالمين.", "Кажете: меѓу два света.", "Zwischen zwei Welten.", zwischen-zwei-welten]
  - ask: ["Say: my homeland is there, my home is here.", "قل: وطني هناك، وبيتي هنا.", "Кажете: татковината ми е таму, домот ми е тука.", "Meine Heimat ist dort, mein Zuhause ist hier.", die-heimat, das-zuhause]
  - ask: ["Say: I think I've arrived.", "قل: أظن أنني استقررتُ.", "Кажете: мислам дека пристигнав.", "Ich glaube, ich bin angekommen.", ich-bin-angekommen]
  - ask: ["Toast: to the future!", "اشرب نخبًا: نخب المستقبل!", "Наздравете: за иднината!", "Auf die Zukunft!", die-zukunft]
  - note: ["End of B2. Some more from the whole level.", "نهاية المستوى B2. مزيد من المستوى كله.", "Крај на B2. Уште малку од целото ниво."]
  - ask: ["At the feedback talk: I'll take that on board.", "في حديث التقييم: سآخذ ذلك بعين الاعتبار.", "На разговорот за оценка: ќе го земам предвид.", "Das nehme ich mit.", ich-nehme-das-mit]
  - ask: ["A formal email: I request a reply.", "رسالة رسمية: أرجو الرد.", "Формална порака: ве молам за одговор.", "Ich bitte um Rückmeldung.", die-rueckmeldung]
  - ask: ["Mediating: a fair compromise.", "في التوسّط: حل وسط عادل.", "Посредување: фер компромис.", "Ein fairer Kompromiss.", der-kompromiss]
  - ask: ["At a talk: in summary.", "في عرض: باختصار.", "На говор: накратко.", "Zusammenfassend.", zusammenfassend]
  - ask: ["Small talk: crowded, isn't it?", "دردشة: مزدحم، أليس كذلك؟", "Мал разговор: полно, нели?", "Voll, oder?", oder-tag]
  - note: ["'Heimat' is where you come from and belong; 'Zuhause' is where you live now. Many people who move hold both — and that's not a contradiction. Whatever you decide: you can now talk about work, rights, money and feelings in German.", "«Heimat» هو المكان الذي جئتَ منه وتنتمي إليه؛ و«Zuhause» هو المكان الذي تعيش فيه الآن. كثير ممن ينتقلون يحملون الاثنين — وهذا ليس تناقضًا. أيًّا كان قرارك: يمكنك الآن أن تتحدّث بالألمانية عن العمل والحقوق والمال والمشاعر.", "„Heimat“ е местото од каде доаѓате и каде припаѓате; „Zuhause“ е каде живеете сега. Многумина што се преселуваат ги носат двете — и тоа не е противречност. Што и да одлучите: сега можете на германски да зборувате за работа, права, пари и чувства."]
