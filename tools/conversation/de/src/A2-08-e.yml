id: A2-08-e
tracks: [en]
protagonist: m
title: ["The buddy programme"]
situation: ["The international office pairs you with a German buddy. First meeting in a café."]
learn: [de-mis_02]
culture: Ask for the buddy programme
items:
  - [das-buddy-programm, "das Buddy-Programm", "the buddy programme"]
  - [die-anmeldung, "die Anmeldung", "the registration"]
  - [die-wohnung-suche, "die Wohnungssuche", "the flat hunt", {rare: true}]
  - [das-tutorium, "das Tutorium", "the tutorial", {rare: true}]
  - [die-beratung, "die Beratung", "advice, counselling"]
  - [die-einladung, "die Einladung", "the invitation"]
  - [kennenlernen, "kennenlernen", "get to know"]
  - [fragen-stellen, "Fragen stellen", "ask questions"]
  - [hilfe-brauchen, "Hilfe brauchen", "need help"]
  - [die-erfahrung, "die Erfahrung", "the experience"]
dialogue:
  - [mia, "Hi! Ich bin Mia, dein Buddy. Willkommen!", "Hi! I'm Mia, your buddy. Welcome!"]
  - [protagonist, "Danke! Was macht ein Buddy?", "Thanks! What does a buddy do?"]
  - [mia, "Ich helfe dir: bei der Anmeldung, bei der Wohnungssuche, im Studium.", "I help you: with registration, flat hunting, your studies."]
  - [protagonist, "Super. Ich habe viele Fragen.", "Great. I have lots of questions."]
  - [mia, "Stell sie! Und geh ins Tutorium — da lernst du Leute kennen.", "Ask them! And go to the tutorial — you'll meet people there."]
  - [protagonist, "Und wenn ich Probleme habe?", "And if I have problems?"]
  - [mia, "Dann gibt es die Beratung im International Office.", "Then there's advice at the International Office."]
  - [protagonist, "Gut zu wissen.", "Good to know."]
  - [mia, "Und hier: eine Einladung zum Stammtisch, am Donnerstag.", "And here: an invitation to the regulars' evening, on Thursday."]
teach:
  - ask: ["Say: the buddy programme.", "Das Buddy-Programm.", das-buddy-programm]
  - note: ["Many nouns end in «-ung», are always feminine («die»), and come from verbs: «anmelden» → «die Anmeldung», «beraten» → «die Beratung», «einladen» → «die Einladung»."]
  - ask: ["Say: with registration.", "Bei der Anmeldung.", die-anmeldung]
  - ask: ["Say: the flat hunt.", "Die Wohnungssuche.", die-wohnung-suche]
  - ask: ["Say: I have lots of questions.", "Ich habe viele Fragen.", fragen-stellen]
  - ask: ["Say: the tutorial.", "Das Tutorium.", das-tutorium]
  - ask: ["Say: you get to know people there.", "Da lernst du Leute kennen.", kennenlernen]
  - ask: ["Say: advice at the International Office.", "Die Beratung im International Office.", die-beratung]
  - ask: ["Say: if I need help.", "Wenn ich Hilfe brauche.", hilfe-brauchen]
  - ask: ["Say: an invitation.", "Eine Einladung.", die-einladung]
  - ask: ["Say: the experience.", "Die Erfahrung.", die-erfahrung]
  - note: ["Most universities run a buddy programme; ask for it at the International Office in your first week. Tutorials and regulars' evenings are where friendships start."]
