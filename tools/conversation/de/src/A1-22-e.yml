id: A1-22-e
tracks: [en]
protagonist: m
title: ["What time is it?"]
situation: ["The lecture is at eight. You arrive at eight sharp — and everyone is already seated."]
learn: [de-cas_04]
culture: Five minutes late needs a sorry
items:
  - [wie-spaet-ist-es, "Wie spät ist es?", "What time is it?"]
  - [halb-acht, "halb acht", "half past seven (half to eight)"]
  - [viertel-nach, "Viertel nach", "quarter past"]
  - [viertel-vor, "Viertel vor", "quarter to"]
  - [genau-acht, "genau acht", "exactly eight"]
  - [zu-spaet, "zu spät", "too late"]
  - [die-verspaetung, "die Verspätung", "the delay"]
  - [frueh, "früh", "early"]
  - [schon-da, "schon da", "already there"]
  - [das-naechste-mal, "das nächste Mal", "next time"]
dialogue:
  - [protagonist, "Entschuldigung, bin ich zu spät? Es ist genau acht.", "Sorry, am I late? It's exactly eight."]
  - [jonas, "Fast! Alle sind schon da. Wir kommen um Viertel vor acht.", "Almost! Everyone's already here. We come at quarter to eight."]
  - [protagonist, "Viertel vor acht? So früh?", "Quarter to eight? That early?"]
  - [jonas, "Ja. Und um halb acht ist der Professor da.", "Yes. And at half past seven the professor is here."]
  - [protagonist, "Wie spät ist es jetzt?", "What time is it now?"]
  - [jonas, "Fünf nach acht. Er beginnt.", "Five past eight. He's starting."]
  - [protagonist, "Und die Bahn hatte Verspätung...", "And the train was delayed..."]
  - [jonas, "Das sagen alle! Das nächste Mal früher.", "Everyone says that! Earlier next time."]
teach:
  - ask: ["Ask: am I too late?", "Bin ich zu spät?", zu-spaet]
  - ask: ["Say: it's exactly eight.", "Es ist genau acht.", genau-acht]
  - ask: ["Say: everyone's already here.", "Alle sind schon da.", schon-da]
  - note: ["Half hours count towards the next hour: «halb acht» is half past seven — 'half to eight'. «Viertel nach acht» is 8:15, «Viertel vor acht» 7:45."]
  - ask: ["Say: quarter to eight.", "Viertel vor acht.", viertel-vor]
  - ask: ["Say: half past seven.", "Halb acht.", halb-acht]
  - ask: ["Say: quarter past eight.", "Viertel nach acht.", viertel-nach]
  - ask: ["Say: so early?", "So früh?", frueh]
  - ask: ["Ask what time it is.", "Wie spät ist es?", wie-spaet-ist-es]
  - ask: ["Say: the train was delayed. (the delay)", "Die Verspätung.", die-verspaetung]
  - ask: ["Say: next time, earlier.", "Das nächste Mal früher.", das-naechste-mal]
  - note: ["Being on time means a few minutes early. Five minutes late needs a short apology; more needs a message beforehand. Trains are late surprisingly often — and nobody accepts it as an excuse."]
