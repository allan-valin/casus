id: C1-05
protagonist: f
title: ["The car", "السيارة", "Автомобилот"]
situation:
  - "You want a used car. Paul comes along to the seller: the TÜV, the registration, the insurance."
  - "تريدين سيارة مستعملة. باول يرافقكِ إلى البائع: الفحص الفني، والتسجيل، والتأمين."
  - "Сакате половен автомобил. Паул доаѓа со вас кај продавачот: технички преглед, регистрација, осигурување."
learn: [c1-passive-forms]
culture: TÜV and registration
items:
  - [der-gebrauchtwagen, "der Gebrauchtwagen", "the used car", "السيارة المستعملة", "половниот автомобил"]
  - [der-tuev, "der TÜV", "the vehicle inspection", "الفحص الفني", "техничкиот преглед"]
  - [die-zulassung, "die Zulassung", "the registration", "تسجيل السيارة", "регистрацијата"]
  - [die-kfz-versicherung, "die Kfz-Versicherung", "car insurance", "تأمين السيارة", "автоосигурувањето", {rare: true}]
  - [der-kilometerstand, "der Kilometerstand", "the mileage", "عدد الكيلومترات", "километражата"]
  - [unfallfrei, "unfallfrei", "accident-free", "خالية من الحوادث", "без незгоди"]
  - [muss-gemacht-werden, "muss gemacht werden", "has to be done", "يجب أن يُجرى", "мора да се направи"]
  - [ist-abgelaufen, "ist abgelaufen", "has expired", "انتهت صلاحيته", "е истечен"]
  - [die-probefahrt, "die Probefahrt", "the test drive", "تجربة القيادة", "пробното возење"]
  - [der-kaufvertrag, "der Kaufvertrag", "the purchase contract", "عقد البيع", "договорот за купопродажба"]
dialogue:
  - [fahrer, "Gebrauchtwagen, zehn Jahre alt, unfallfrei. Kilometerstand: neunzigtausend.", "Used car, ten years old, accident-free. Mileage: ninety thousand.", "سيارة مستعملة، عمرها عشر سنوات، خالية من الحوادث. عدد الكيلومترات: تسعون ألفًا.", "Половен автомобил, десет години стар, без незгоди. Километража: деведесет илјади."]
  - [paul, "Und der TÜV? ... Der ist abgelaufen!", "And the TÜV? ... It's expired!", "والفحص الفني؟ ... انتهت صلاحيته!", "А техничкиот? ... Истечен е!"]
  - [fahrer, "Der muss noch gemacht werden. Das wird diese Woche erledigt.", "That still has to be done. It'll be done this week.", "يجب أن يُجرى بعد. سيُنجز هذا الأسبوع.", "Тој уште мора да се направи. Ќе се заврши оваа недела."]
  - [protagonist, "Dann kaufe ich erst danach. Darf ich eine Probefahrt machen?", "Then I'll buy only afterwards. May I take a test drive?", "إذن لن أشتري إلا بعد ذلك. هل يمكنني تجربة القيادة؟", "Тогаш ќе купам дури потоа. Смеам ли пробно возење?"]
  - [fahrer, "Natürlich. Der Wagen wurde regelmäßig gewartet. Alles steht im Serviceheft.", "Of course. The car was serviced regularly. It's all in the service book.", "طبعًا. السيارة صِينت بانتظام. كل شيء مكتوب في دفتر الصيانة.", "Се разбира. Колата редовно се сервисирала. Сè пишува во сервисната книшка."]
  - [paul, "Und dann: Kaufvertrag, Versicherung, Zulassung. Ohne Versicherung wird kein Auto zugelassen.", "And then: purchase contract, insurance, registration. Without insurance no car gets registered.", "ثم: عقد البيع، التأمين، التسجيل. بلا تأمين لا تُسجَّل أي سيارة.", "А потоа: договор за купопродажба, осигурување, регистрација. Без осигурување ниту една кола не се регистрира."]
  - [protagonist, "Und mein Führerschein? Er wurde in meiner Heimat ausgestellt.", "And my driving licence? It was issued in my home country.", "ورخصة قيادتي؟ صدرت في بلدي.", "А мојата возачка? Издадена е во мојата земја."]
  - [paul, "Der muss vielleicht umgeschrieben werden. Frag bei der Führerscheinstelle.", "It may have to be converted. Ask at the licence office.", "ربما يجب تحويلها. اسألي في مكتب رخص القيادة.", "Можеби мора да се замени. Прашај во канцеларијата за возачки."]
teach:
  - ask: ["Say: a used car, accident-free.", "قولي: سيارة مستعملة، خالية من الحوادث.", "Кажете: половен автомобил, без незгоди.", "Ein Gebrauchtwagen, unfallfrei.", der-gebrauchtwagen, unfallfrei]
  - ask: ["Say: the mileage.", "قولي: عدد الكيلومترات.", "Кажете: километражата.", "Der Kilometerstand.", der-kilometerstand]
  - ask: ["Say: the TÜV has expired!", "قولي: الفحص الفني انتهت صلاحيته!", "Кажете: техничкиот е истечен!", "Der TÜV ist abgelaufen!", der-tuev, ist-abgelaufen]
  - note: ["Passive forms at C1: «muss gemacht werden» (must be done), «wird erledigt» (is being done), «wurde gewartet» (was serviced), «ist abgelaufen» (state). Modal + participle + «werden» is common in rules: «Ohne Versicherung wird kein Auto zugelassen».", "صيغ المبني للمجهول في C1: «muss gemacht werden» (يجب أن يُجرى)، «wird erledigt» (يُنجز)، «wurde gewartet» (صِين)، «ist abgelaufen» (حالة). والفعل المساعد مع اسم المفعول و«werden» شائع في القواعد: «Ohne Versicherung wird kein Auto zugelassen».", "Пасивни форми на C1: «muss gemacht werden» (мора да се направи), «wird erledigt» (се завршува), «wurde gewartet» (се сервисирала), «ist abgelaufen» (состојба). Модален + партицип + «werden» е често во правилата: «Ohne Versicherung wird kein Auto zugelassen»."]
  - ask: ["He says: it still has to be done.", "يقول: يجب أن يُجرى بعد.", "Тој вели: уште мора да се направи.", "Der muss noch gemacht werden.", muss-gemacht-werden]
  - ask: ["Ask: may I take a test drive?", "اسألي: هل يمكنني تجربة القيادة؟", "Прашајте: смеам ли пробно возење?", "Darf ich eine Probefahrt machen?", die-probefahrt]
  - ask: ["Say: the purchase contract.", "قولي: عقد البيع.", "Кажете: договорот за купопродажба.", "Der Kaufvertrag.", der-kaufvertrag]
  - ask: ["Say: car insurance.", "قولي: تأمين السيارة.", "Кажете: автоосигурување.", "Die Kfz-Versicherung.", die-kfz-versicherung]
  - ask: ["Say: without insurance no car gets registered.", "قولي: بلا تأمين لا تُسجَّل أي سيارة.", "Кажете: без осигурување ниту една кола не се регистрира.", "Ohne Versicherung wird kein Auto zugelassen.", die-zulassung]
  - note: ["The TÜV inspection is due every two years; buy only with a valid one. Registration (Zulassung) needs proof of insurance first. Licences from outside the EU usually have to be converted within six months of moving here — some need a test. Rules depend on the country: ask the Führerscheinstelle.", "الفحص الفني (TÜV) مستحق كل سنتين؛ لا تشتري إلا بفحص ساري. والتسجيل يحتاج أولًا إثبات تأمين. ورخص القيادة من خارج الاتحاد الأوروبي يجب غالبًا تحويلها خلال ستة أشهر من الانتقال — وبعضها يحتاج اختبارًا. القواعد تتوقّف على البلد: اسألي مكتب رخص القيادة.", "Техничкиот преглед (TÜV) е на секои две години; купувајте само со важечки. За регистрација прво треба доказ за осигурување. Возачките дозволи од надвор од ЕУ обично мора да се заменат во рок од шест месеци по преселувањето — за некои треба испит. Правилата зависат од земјата: прашајте во Führerscheinstelle."]
