id: C2-04
protagonist: m
title: ["Negotiating a raise", "التفاوض على الراتب", "Преговори за плата"]
situation:
  - "Your annual review — and this time you ask for more money. Frau Schröder makes a counter-offer."
  - "حديث التقييم السنوي — وهذه المرة تطلب مالًا أكثر. السيدة شرودر تقدّم عرضًا مضادًا."
  - "Годишниот разговор — и овој пат барате повеќе пари. Госпоѓа Шредер дава контрапонуда."
learn: [de-vsub_02, de-vsub_03]
culture: Negotiating firmly and politely
items:
  - [die-gehaltsverhandlung, "die Gehaltsverhandlung", "the salary negotiation", "التفاوض على الراتب", "преговорите за плата", {rare: true}]
  - [das-gegenangebot, "das Gegenangebot", "the counter-offer", "العرض المضاد", "контрапонудата"]
  - [der-marktwert, "der Marktwert", "the market value", "القيمة السوقية", "пазарната вредност"]
  - [ich-haette-mir-vorgestellt, "Ich hätte mir … vorgestellt", "I had in mind …", "كنتُ أتصوّر …", "Замислував …"]
  - [waere-es-denkbar, "Wäre es denkbar, dass …?", "Would it be conceivable that …?", "هل من الممكن أن …؟", "Дали би било замисливо …?"]
  - [ich-wuerde-vorschlagen, "Ich würde vorschlagen, …", "I would suggest …", "أقترح …", "Би предложил …"]
  - [die-gehaltserhoehung, "die Gehaltserhöhung", "the pay rise", "زيادة الراتب", "покачувањето на платата"]
  - [das-budget-c2, "das Budget ist begrenzt", "the budget is limited", "الميزانية محدودة", "буџетот е ограничен"]
  - [der-zusatzurlaub, "zusätzliche Urlaubstage", "extra holiday days", "أيام إجازة إضافية", "дополнителни денови одмор"]
  - [die-vereinbarung, "die Vereinbarung", "the agreement", "الاتفاق", "договорот"]
dialogue:
  - [protagonist, "Ich habe Verantwortung für zwei Projekte übernommen. Ich hätte mir eine Gehaltserhöhung von zehn Prozent vorgestellt.", "I've taken on responsibility for two projects. I had a ten per cent raise in mind.", "تولّيتُ مسؤولية مشروعين. كنتُ أتصوّر زيادة في الراتب بعشرة بالمئة.", "Презедов одговорност за два проекти. Замислував покачување на платата од десет проценти."]
  - [schroeder, "Zehn Prozent? Das Budget ist dieses Jahr begrenzt.", "Ten per cent? The budget is limited this year.", "عشرة بالمئة؟ الميزانية محدودة هذا العام.", "Десет проценти? Буџетот оваа година е ограничен."]
  - [protagonist, "Das verstehe ich. Aber mein Marktwert ist gestiegen — ich habe mich informiert.", "I understand that. But my market value has gone up — I've done my research.", "أفهم ذلك. لكن قيمتي السوقية ارتفعت — لقد اطّلعتُ على الأمر.", "Тоа го разбирам. Но мојата пазарна вредност порасна — се информирав."]
  - [schroeder, "Mein Gegenangebot: fünf Prozent jetzt.", "My counter-offer: five per cent now.", "عرضي المضاد: خمسة بالمئة الآن.", "Мојата контрапонуда: пет проценти сега."]
  - [protagonist, "Wäre es denkbar, dass wir uns bei sieben treffen — und zwei zusätzliche Urlaubstage?", "Would it be conceivable for us to meet at seven — plus two extra holiday days?", "هل من الممكن أن نلتقي عند سبعة — مع يومي إجازة إضافيين؟", "Дали би било замисливо да се сретнеме на седум — и два дополнителни дена одмор?"]
  - [schroeder, "Sie verhandeln gut. Sechs Prozent und die Urlaubstage.", "You negotiate well. Six per cent and the holiday days.", "تفاوض جيدًا. ستة بالمئة وأيام الإجازة.", "Добро преговарате. Шест проценти и деновите одмор."]
  - [protagonist, "Ich würde vorschlagen, dass wir das schriftlich festhalten.", "I would suggest we put that in writing.", "أقترح أن نثبّت ذلك كتابيًا.", "Би предложил тоа да го запишеме."]
  - [schroeder, "Selbstverständlich. Dann haben wir eine Vereinbarung.", "Of course. Then we have an agreement.", "بالطبع. إذن لدينا اتفاق.", "Се разбира. Тогаш имаме договор."]
teach:
  - ask: ["Say: the salary negotiation.", "قل: التفاوض على الراتب.", "Кажете: преговорите за плата.", "Die Gehaltsverhandlung.", die-gehaltsverhandlung]
  - note: ["Konjunktiv II makes firm demands polite and leaves room to move: «Ich hätte mir … vorgestellt» (I had in mind), «Wäre es denkbar, dass…?» (would it be conceivable), «Ich würde vorschlagen, …» (I'd suggest).", "صيغة التمني تجعل المطالب الحازمة مؤدبة وتترك مجالًا للتحرّك: «Ich hätte mir … vorgestellt» (كنتُ أتصوّر)، «Wäre es denkbar, dass…?» (هل من الممكن)، «Ich würde vorschlagen, …» (أقترح).", "Konjunktiv II ги прави цврстите барања учтиви и остава простор: «Ich hätte mir … vorgestellt» (замислував), «Wäre es denkbar, dass…?» (дали би било замисливо), «Ich würde vorschlagen, …» (би предложил)."]
  - ask: ["Say: I had a ten per cent raise in mind.", "قل: كنتُ أتصوّر زيادة بعشرة بالمئة.", "Кажете: замислував покачување од десет проценти.", "Ich hätte mir eine Gehaltserhöhung von zehn Prozent vorgestellt.", ich-haette-mir-vorgestellt, die-gehaltserhoehung]
  - ask: ["She says: the budget is limited.", "تقول: الميزانية محدودة.", "Таа вели: буџетот е ограничен.", "Das Budget ist begrenzt.", das-budget-c2]
  - ask: ["Say: my market value has gone up.", "قل: قيمتي السوقية ارتفعت.", "Кажете: пазарната вредност ми порасна.", "Mein Marktwert ist gestiegen.", der-marktwert]
  - ask: ["Say: her counter-offer.", "قل: عرضها المضاد.", "Кажете: нејзината контрапонуда.", "Ihr Gegenangebot.", das-gegenangebot]
  - ask: ["Ask: would it be conceivable to meet at seven?", "اسأل: هل من الممكن أن نلتقي عند سبعة؟", "Прашајте: дали би било замисливо да се сретнеме на седум?", "Wäre es denkbar, dass wir uns bei sieben treffen?", waere-es-denkbar]
  - ask: ["Say: two extra holiday days.", "قل: يومي إجازة إضافيين.", "Кажете: два дополнителни дена одмор.", "Zwei zusätzliche Urlaubstage.", der-zusatzurlaub]
  - ask: ["Say: I'd suggest we put it in writing.", "قل: أقترح أن نثبّت ذلك كتابيًا.", "Кажете: би предложил да го запишеме.", "Ich würde vorschlagen, dass wir das schriftlich festhalten.", ich-wuerde-vorschlagen]
  - ask: ["Say: then we have an agreement.", "قل: إذن لدينا اتفاق.", "Кажете: тогаш имаме договор.", "Dann haben wir eine Vereinbarung.", die-vereinbarung]
  - note: ["In Germany you ask for a raise yourself — usually in the annual review — with arguments (new responsibility, market data), not personal needs. Start a little high, accept a counter-offer, trade money for holidays or training, and get the result in writing.", "في ألمانيا تطلب الزيادة بنفسك — عادةً في حديث التقييم السنوي — بحجج (مسؤولية جديدة، بيانات السوق) لا باحتياجات شخصية. ابدأ أعلى قليلًا، واقبل عرضًا مضادًا، وبادل المال بإجازات أو تدريب، واحصل على النتيجة كتابيًا.", "Во Германија сами барате покачување — обично на годишниот разговор — со аргументи (нова одговорност, пазарни податоци), не лични потреби. Почнете малку повисоко, прифатете контрапонуда, заменете пари за одмор или обука и добијте го резултатот писмено."]
