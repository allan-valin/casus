id: B2-13-ea
tracks: [en, ar]
protagonist: m
title: ["Giving notice", "تقديم الاستقالة"]
situation:
  - "You got the new job. Now you have to tell Frau Schröder — in writing, with the right notice period."
  - "حصلتَ على الوظيفة الجديدة. الآن عليك أن تخبر السيدة شرودر — كتابيًا، مع مراعاة مهلة الإنهاء."
learn: [de-vsub_02]
culture: Notice and the reference
items:
  - [kuendigen, "kündigen", "give notice, resign", "يستقيل، يُنهي العقد"]
  - [die-kuendigungsfrist, "die Kündigungsfrist", "the notice period", "مهلة الإنهاء", {rare: true}]
  - [das-arbeitszeugnis, "das Arbeitszeugnis", "the job reference", "شهادة العمل", {rare: true}]
  - [zum-monatsende, "zum Monatsende", "at the end of the month", "في نهاية الشهر"]
  - [ich-moechte-sie-bitten, "Ich möchte Sie bitten, …", "I'd like to ask you to …", "أودّ أن أطلب منكِ …"]
  - [waeren-sie-so-freundlich, "Wären Sie so freundlich, …", "Would you be so kind as to …", "هل تتكرّمين بـ…"]
  - [der-resturlaub, "der Resturlaub", "remaining holiday", "الإجازة المتبقية", {rare: true}]
  - [schade-dass, "schade, dass …", "a pity that …", "مؤسف أنّ …"]
  - [die-uebergabe, "die Übergabe", "the handover", "التسليم"]
  - [unterschrieben, "unterschrieben", "signed", "موقَّع"]
dialogue:
  - [protagonist, "Frau Schröder, ich muss Ihnen etwas sagen. Ich habe eine neue Stelle und möchte kündigen.", "Mrs Schröder, I have to tell you something. I have a new job and would like to give notice.", "سيدة شرودر، يجب أن أخبركِ بشيء. لديّ وظيفة جديدة وأريد أن أستقيل."]
  - [schroeder, "Schade, dass Sie gehen! Aber herzlichen Glückwunsch. Die Kündigungsfrist ist ein Monat zum Monatsende.", "A pity you're going! But congratulations. The notice period is one month to the end of the month.", "مؤسف أنك ستغادر! لكن تهانينا. مهلة الإنهاء شهر حتى نهاية الشهر."]
  - [protagonist, "Hier ist meine Kündigung, schriftlich und unterschrieben.", "Here's my notice, in writing and signed.", "هذه استقالتي، كتابيًا وموقَّعة."]
  - [schroeder, "Danke. Eine E-Mail reicht nicht — gut, dass Sie das wissen.", "Thank you. An email isn't enough — good that you know that.", "شكرًا. البريد الإلكتروني لا يكفي — جيد أنك تعرف ذلك."]
  - [protagonist, "Ich möchte Sie bitten, mir ein Arbeitszeugnis zu schreiben.", "I'd like to ask you to write me a job reference.", "أودّ أن أطلب منكِ أن تكتبي لي شهادة عمل."]
  - [schroeder, "Selbstverständlich. Und Ihr Resturlaub? Noch fünf Tage.", "Of course. And your remaining holiday? Five more days.", "بالطبع. وإجازتك المتبقية؟ ما زالت خمسة أيام."]
  - [protagonist, "Wären Sie so freundlich, sie mir am Ende zu geben? Vorher mache ich die Übergabe an Tim.", "Would you be so kind as to give them to me at the end? Before that I'll do the handover to Tim.", "هل تتكرّمين بمنحها لي في النهاية؟ قبل ذلك سأسلّم العمل لتيم."]
  - [schroeder, "Sehr gern. So macht man das.", "With pleasure. That's how it's done.", "بكل سرور. هكذا يُفعل الأمر."]
teach:
  - ask: ["Say: I'd like to give notice.", "قل: أريد أن أستقيل.", "Ich möchte kündigen.", kuendigen]
  - ask: ["Say: the notice period.", "قل: مهلة الإنهاء.", "Die Kündigungsfrist.", die-kuendigungsfrist]
  - ask: ["Say: at the end of the month.", "قل: في نهاية الشهر.", "Zum Monatsende.", zum-monatsende]
  - ask: ["Say: in writing and signed.", "قل: كتابيًا وموقَّعة.", "Schriftlich und unterschrieben.", unterschrieben]
  - note: ["Formal requests: «Ich möchte Sie bitten, … zu …» (I'd like to ask you to…), «Wären Sie so freundlich, … zu …» (would you be so kind as to…). The verb comes at the end with «zu».", "الطلبات الرسمية: «Ich möchte Sie bitten, … zu …» (أودّ أن أطلب منكِ أن…)، «Wären Sie so freundlich, … zu …» (هل تتكرّمين بـ…). والفعل يأتي في الآخر مع «zu»."]
  - ask: ["Ask formally for a job reference.", "اطلب رسميًا شهادة عمل.", "Ich möchte Sie bitten, mir ein Arbeitszeugnis zu schreiben.", ich-moechte-sie-bitten, das-arbeitszeugnis]
  - ask: ["Say: my remaining holiday.", "قل: إجازتي المتبقية.", "Mein Resturlaub.", der-resturlaub]
  - ask: ["Ask: would you be so kind as to give them at the end?", "اسأل: هل تتكرّمين بمنحها في النهاية؟", "Wären Sie so freundlich, sie mir am Ende zu geben?", waeren-sie-so-freundlich]
  - ask: ["Say: the handover.", "قل: التسليم.", "Die Übergabe.", die-uebergabe]
  - ask: ["She says: a pity you're going.", "تقول: مؤسف أنك ستغادر.", "Schade, dass Sie gehen.", schade-dass]
  - note: ["Notice must be on paper and signed — an email or text message is not valid. Look up the period in your contract. You have a right to a written reference (Arbeitszeugnis); its friendly phrases are coded, so ask someone experienced to read it. Remaining holiday is taken or paid out.", "الاستقالة يجب أن تكون على ورق وموقَّعة — البريد الإلكتروني أو الرسالة النصية غير صالحين. ابحث عن المهلة في عقدك. لك الحق في شهادة عمل مكتوبة (Arbeitszeugnis)؛ وعباراتها اللطيفة مشفّرة، فاطلب من شخص ذي خبرة أن يقرأها. والإجازة المتبقية تُؤخذ أو يُدفع مقابلها."]
