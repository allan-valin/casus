id: B2-24
protagonist: m
title: ["The housing crisis", "أزمة السكن", "Станбената криза"]
situation:
  - "Frau Becker reads the paper aloud: rents up again. Is the rent brake working? You talk it through."
  - "السيدة بيكر تقرأ الصحيفة بصوت عالٍ: الإيجارات ارتفعت مجددًا. هل تنجح «فرملة الإيجار»؟ تناقشان الأمر."
  - "Госпоѓа Бекер чита весник на глас: киријата пак порасна. Дали функционира сопирачката на кириите? Разговарате."
learn: [b2-passive-forms]
culture: Rents and the rent brake
items:
  - [die-mietpreisbremse, "die Mietpreisbremse", "the rent brake", "فرملة الإيجار", "сопирачката на кириите", {rare: true}]
  - [die-sozialwohnung, "die Sozialwohnung", "social housing", "السكن الاجتماعي", "социјалниот стан", {rare: true}]
  - [der-wohnberechtigungsschein, "der Wohnberechtigungsschein", "housing entitlement certificate", "شهادة استحقاق السكن", "потврдата за право на социјален стан", {rare: true}]
  - [wird-gebaut, "wird gebaut", "is being built", "يُبنى", "се гради"]
  - [wurde-erhoeht, "wurde erhöht", "was raised", "رُفع", "беше зголемена"]
  - [ist-begrenzt, "ist begrenzt", "is limited", "محدود", "е ограничено"]
  - [die-vergleichsmiete, "die ortsübliche Vergleichsmiete", "the local reference rent", "الإيجار المرجعي المحلي", "вообичаената локална кирија", {rare: true}]
  - [die-nachfrage, "die Nachfrage", "the demand", "الطلب", "побарувачката"]
  - [das-angebot, "das Angebot", "the supply, offer", "العرض", "понудата"]
  - [der-mieterverein, "der Mieterverein", "the tenants' association", "جمعية المستأجرين", "здружението на станари", {rare: true}]
dialogue:
  - [becker, "Hier steht: Die Mieten wurden wieder erhöht. Zehn Prozent in drei Jahren!", "It says here: rents were raised again. Ten per cent in three years!", "مكتوب هنا: رُفعت الإيجارات مجددًا. عشرة بالمئة في ثلاث سنوات!", "Тука пишува: кириите пак беа зголемени. Десет проценти за три години!"]
  - [protagonist, "Gibt es nicht die Mietpreisbremse?", "Isn't there the rent brake?", "أليست هناك «فرملة الإيجار»؟", "Нели постои сопирачка на кириите?"]
  - [becker, "Doch. Bei neuen Verträgen ist die Miete begrenzt: höchstens etwas über der ortsüblichen Vergleichsmiete.", "Yes. In new contracts the rent is limited: at most a bit above the local reference rent.", "بلى. في العقود الجديدة الإيجار محدود: على الأكثر أعلى قليلًا من الإيجار المرجعي المحلي.", "Да. Кај нови договори киријата е ограничена: најмногу малку над вообичаената локална кирија."]
  - [protagonist, "Und warum steigt sie trotzdem?", "And why does it rise anyway?", "ولماذا ترتفع مع ذلك؟", "А зошто сепак расте?"]
  - [becker, "Die Nachfrage ist größer als das Angebot. Es wird zu wenig gebaut.", "Demand is greater than supply. Too little is being built.", "الطلب أكبر من العرض. يُبنى القليل جدًا.", "Побарувачката е поголема од понудата. Се гради премалку."]
  - [protagonist, "Und Sozialwohnungen?", "And social housing?", "والسكن الاجتماعي؟", "А социјални станови?"]
  - [becker, "Mit einem Wohnberechtigungsschein. Aber die Wartelisten sind lang.", "With a housing entitlement certificate. But the waiting lists are long.", "بشهادة استحقاق السكن. لكن قوائم الانتظار طويلة.", "Со потврда за право на социјален стан. Но листите на чекање се долги."]
  - [protagonist, "Was mache ich, wenn meine Miete zu hoch ist?", "What do I do if my rent is too high?", "ماذا أفعل إذا كان إيجاري مرتفعًا جدًا؟", "Што да правам ако киријата ми е превисока?"]
  - [becker, "Geh zum Mieterverein. Die prüfen das — ich bin ja Vermieterin, ich sage dir das nicht gern!", "Go to the tenants' association. They check it — I'm a landlady, I don't like telling you this!", "اذهب إلى جمعية المستأجرين. هم يتحقّقون من ذلك — أنا مؤجِّرة، ولا يسرّني أن أقول لك هذا!", "Оди во здружението на станари. Тие проверуваат — јас сум станодавка, не ти го кажувам тоа радо!"]
teach:
  - ask: ["Say: rents were raised again.", "قل: رُفعت الإيجارات مجددًا.", "Кажете: кириите пак беа зголемени.", "Die Mieten wurden wieder erhöht.", wurde-erhoeht]
  - ask: ["Ask: isn't there the rent brake?", "اسأل: أليست هناك فرملة الإيجار؟", "Прашајте: нели постои сопирачка на кириите?", "Gibt es nicht die Mietpreisbremse?", die-mietpreisbremse]
  - note: ["Passive forms side by side: «wird gebaut» (is being built — process), «wurde erhöht» (was raised — past), «ist begrenzt» (is limited — state).", "صيغ المبني للمجهول متجاورة: «wird gebaut» (يُبنى — عملية)، «wurde erhöht» (رُفع — ماضٍ)، «ist begrenzt» (محدود — حالة).", "Пасивни форми една до друга: «wird gebaut» (се гради — процес), «wurde erhöht» (беше зголемена — минато), «ist begrenzt» (е ограничено — состојба)."]
  - ask: ["Say: the rent is limited.", "قل: الإيجار محدود.", "Кажете: киријата е ограничена.", "Die Miete ist begrenzt.", ist-begrenzt]
  - ask: ["Say: the local reference rent.", "قل: الإيجار المرجعي المحلي.", "Кажете: вообичаената локална кирија.", "Die ortsübliche Vergleichsmiete.", die-vergleichsmiete]
  - ask: ["Say: demand is greater than supply.", "قل: الطلب أكبر من العرض.", "Кажете: побарувачката е поголема од понудата.", "Die Nachfrage ist größer als das Angebot.", die-nachfrage, das-angebot]
  - ask: ["Say: too little is being built.", "قل: يُبنى القليل جدًا.", "Кажете: се гради премалку.", "Es wird zu wenig gebaut.", wird-gebaut]
  - ask: ["Say: social housing.", "قل: السكن الاجتماعي.", "Кажете: социјални станови.", "Sozialwohnungen.", die-sozialwohnung]
  - ask: ["Say: a housing entitlement certificate.", "قل: شهادة استحقاق السكن.", "Кажете: потврда за право на социјален стан.", "Ein Wohnberechtigungsschein.", der-wohnberechtigungsschein]
  - ask: ["Say: the waiting lists are long.", "قل: قوائم الانتظار طويلة.", "Кажете: листите на чекање се долги.", "Die Wartelisten sind lang.", die-warteliste]
  - ask: ["She says: go to the tenants' association.", "تقول: اذهب إلى جمعية المستأجرين.", "Таа вели: оди во здружението на станари.", "Geh zum Mieterverein.", der-mieterverein]
  - note: ["Where the rent brake applies, a new rent may be only a little above the local reference rent (shown in the Mietspiegel); there are exceptions, e.g. new buildings. Social housing needs a Wohnberechtigungsschein from the city, based on income. A tenants' association checks rent rises and statements for a small yearly fee. Rules differ by city — check yours.", "حيث تُطبَّق فرملة الإيجار، لا يجوز أن يتجاوز الإيجار الجديد الإيجار المرجعي المحلي إلا قليلًا (يظهر في «Mietspiegel»)؛ وهناك استثناءات، كالمباني الجديدة. والسكن الاجتماعي يحتاج شهادة استحقاق من البلدية بحسب الدخل. وجمعية المستأجرين تراجع زيادات الإيجار والكشوف مقابل رسم سنوي صغير. القواعد تختلف بين المدن — تحقّق من مدينتك.", "Каде што важи сопирачката, новата кирија смее да биде само малку над вообичаената локална кирија (во Mietspiegel); има исклучоци, на пр. новоградби. За социјален стан треба Wohnberechtigungsschein од градот, според приходот. Здружението на станари проверува зголемувања и пресметки за мала годишна членарина. Правилата се разликуваат по градови — проверете го вашиот."]
