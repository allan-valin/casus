id: A2-01
protagonist: f
title: ["What did you do?", "ماذا فعلتِ؟", "Што правевте?"]
situation:
  - "Monday morning on the stairs. Jonas asks about your weekend."
  - "صباح الاثنين على الدرج. يوناس يسألكِ عن عطلة نهاية الأسبوع."
  - "Понеделник наутро на скалите. Јонас ве прашува за викендот."
learn: [a2-perfekt]
culture: —
items:
  - [was-hast-du-gemacht, "Was hast du gemacht?", "What did you do? (informal)", "ماذا فعلتِ؟", "Што прави?"]
  - [ich-habe-gemacht, "ich habe … gemacht", "I did …", "فعلتُ …", "направив …"]
  - [ich-bin-gegangen, "ich bin … gegangen", "I went …", "ذهبتُ …", "отидов …"]
  - [am-samstag, "am Samstag", "on Saturday", "يوم السبت", "во сабота"]
  - [am-sonntag, "am Sonntag", "on Sunday", "يوم الأحد", "во недела"]
  - [gesehen, "gesehen", "seen", "رأيتُ", "видов"]
  - [gegessen, "gegessen", "eaten", "أكلتُ", "јадев"]
  - [geschlafen, "geschlafen", "slept", "نمتُ", "спиев"]
  - [lange, "lange", "for a long time", "طويلًا", "долго"]
  - [toll, "toll", "great", "رائع", "супер"]
  - [und-du-was, "Und du? Was hast du gemacht?", "And you? What did you do?", "وأنت؟ ماذا فعلت؟", "А ти? Што прави?"]
  - [nichts, "nichts", "nothing", "لا شيء", "ништо"]
dialogue:
  - [jonas, "Morgen! Was hast du am Wochenende gemacht?", "Morning! What did you do at the weekend?", "صباح الخير! ماذا فعلتِ في عطلة نهاية الأسبوع؟", "Утро! Што прави за викендот?"]
  - [protagonist, "Am Samstag bin ich in den Zoo gegangen.", "On Saturday I went to the zoo.", "يوم السبت ذهبتُ إلى حديقة الحيوان.", "Во сабота отидов во зоолошка."]
  - [jonas, "Toll! Was hast du gesehen?", "Great! What did you see?", "رائع! ماذا رأيتِ؟", "Супер! Што виде?"]
  - [protagonist, "Elefanten und Tiger. Und ich habe ein Eis gegessen.", "Elephants and tigers. And I had an ice cream.", "فيلة ونمورًا. وأكلتُ بوظة.", "Слонови и тигри. И јадев сладолед."]
  - [jonas, "Und am Sonntag?", "And on Sunday?", "ويوم الأحد؟", "А во недела?"]
  - [protagonist, "Am Sonntag habe ich nichts gemacht. Ich habe lange geschlafen.", "On Sunday I did nothing. I slept for a long time.", "يوم الأحد لم أفعل شيئًا. نمتُ طويلًا.", "Во недела не правев ништо. Спиев долго."]
  - [jonas, "Sonntag ist Ruhetag!", "Sunday is a day of rest!", "الأحد يوم راحة!", "Неделата е ден за одмор!"]
  - [protagonist, "Genau. Und du? Was hast du gemacht?", "Exactly. And you? What did you do?", "بالضبط. وأنت؟ ماذا فعلت؟", "Точно. А ти? Што прави?"]
  - [jonas, "Ich habe gelernt. Prüfung am Mittwoch!", "I studied. Exam on Wednesday!", "درستُ. عندي امتحان يوم الأربعاء!", "Учев. Испит во среда!"]
teach:
  - note: ["To talk about the past, German mostly uses «haben» or «sein» plus a past participle at the end: «Ich habe ein Eis gegessen», «Ich bin in den Zoo gegangen». Verbs of movement take «sein».", "للحديث عن الماضي تستعمل الألمانية غالبًا «haben» أو «sein» مع اسم المفعول في آخر الجملة: «Ich habe ein Eis gegessen»، «Ich bin in den Zoo gegangen». أفعال الحركة تأخذ «sein».", "За минатото германскиот најчесто користи «haben» или «sein» и партицип на крајот: «Ich habe ein Eis gegessen», «Ich bin in den Zoo gegangen». Глаголите на движење одат со «sein»."]
  - ask: ["Jonas asks what you did. How?", "يوناس يسألكِ ماذا فعلتِ. كيف؟", "Јонас прашува што правевте. Како?", "Was hast du gemacht?", was-hast-du-gemacht]
  - ask: ["Say: on Saturday I went to the zoo.", "قولي: يوم السبت ذهبتُ إلى حديقة الحيوان.", "Кажете: во сабота отидов во зоолошка.", "Am Samstag bin ich in den Zoo gegangen.", am-samstag, ich-bin-gegangen]
  - ask: ["He says: great! What did you see?", "يقول: رائع! ماذا رأيتِ؟", "Тој вели: супер! Што виде?", "Toll! Was hast du gesehen?", toll, gesehen]
  - ask: ["Say: I had an ice cream.", "قولي: أكلتُ بوظة.", "Кажете: јадев сладолед.", "Ich habe ein Eis gegessen.", gegessen]
  - ask: ["Ask: and on Sunday?", "اسألي: ويوم الأحد؟", "Прашајте: а во недела?", "Und am Sonntag?", am-sonntag]
  - ask: ["Say: I did nothing.", "قولي: لم أفعل شيئًا.", "Кажете: не правев ништо.", "Ich habe nichts gemacht.", nichts, ich-habe-gemacht]
  - ask: ["Say: I slept for a long time.", "قولي: نمتُ طويلًا.", "Кажете: спиев долго.", "Ich habe lange geschlafen.", lange, geschlafen]
  - ask: ["Ask him back: and you? What did you do?", "اسأليه بدوركِ: وأنت؟ ماذا فعلت؟", "Прашајте го: а ти? Што прави?", "Und du? Was hast du gemacht?", und-du-was]
