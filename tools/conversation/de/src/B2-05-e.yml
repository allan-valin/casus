id: B2-05-e
tracks: [en]
protagonist: f
title: ["From studies to work"]
situation: ["Your master's is nearly done. At the Ausländerbehörde, Herr Schulz explains how to stay and look for work."]
learn: [de-vsub_04]
culture: Changing the residence title
items:
  - [die-aufenthaltserlaubnis, "die Aufenthaltserlaubnis", "the residence permit"]
  - [zur-arbeitssuche, "zur Arbeitssuche", "for job-seeking"]
  - [die-blaue-karte, "die Blaue Karte", "the EU Blue Card"]
  - [die-fachkraft, "die Fachkraft", "the skilled worker"]
  - [der-abschluss-uni, "der Studienabschluss", "the degree"]
  - [er-sagt-es-sei, "er sagt, es sei …", "he says it is …"]
  - [ich-muesse, "ich müsse …", "(reported) I must …"]
  - [rechtzeitig, "rechtzeitig", "in good time"]
  - [die-gehaltsgrenze, "die Gehaltsgrenze", "the salary threshold", {rare: true}]
  - [der-antrag-stellen, "einen Antrag stellen", "submit an application"]
dialogue:
  - [protagonist, "Mein Studium endet im März. Darf ich danach bleiben?", "My studies end in March. May I stay afterwards?"]
  - [schulz, "Ja. Nach dem Studienabschluss gibt es eine Aufenthaltserlaubnis zur Arbeitssuche.", "Yes. After graduating there's a residence permit for job-seeking."]
  - [protagonist, "Wie lange gilt die?", "How long is it valid?"]
  - [schulz, "Mehrere Monate. Die genaue Dauer steht auf unserer Webseite. Stellen Sie den Antrag rechtzeitig.", "Several months. The exact length is on our website. Submit the application in good time."]
  - [protagonist, "Und wenn ich eine Stelle finde?", "And if I find a job?"]
  - [schulz, "Dann wechseln Sie: zur Blauen Karte oder zur Erlaubnis als Fachkraft.", "Then you switch: to the Blue Card or to the permit as a skilled worker."]
  - [mia, "Und? Was hat er gesagt?", "So? What did he say?"]
  - [protagonist, "Er sagt, es sei möglich. Ich müsse nur rechtzeitig den Antrag stellen.", "He says it's possible. I only have to apply in good time."]
teach:
  - ask: ["Ask: may I stay afterwards?", "Darf ich danach bleiben?", der-abschluss-uni]
  - ask: ["Say: a residence permit for job-seeking.", "Eine Aufenthaltserlaubnis zur Arbeitssuche.", die-aufenthaltserlaubnis, zur-arbeitssuche]
  - ask: ["He says: submit the application in good time.", "Stellen Sie den Antrag rechtzeitig.", der-antrag-stellen, rechtzeitig]
  - ask: ["Say: the Blue Card.", "Die Blaue Karte.", die-blaue-karte]
  - ask: ["Say: as a skilled worker.", "Als Fachkraft.", die-fachkraft]
  - note: ["Konjunktiv I reports what someone said, mainly in official and written German: «Er sagt, es sei möglich» (he says it is possible), «ich müsse den Antrag stellen» (I must apply). It shows 'that's his statement, not mine'."]
  - ask: ["Report: he says it's possible.", "Er sagt, es sei möglich.", er-sagt-es-sei]
  - ask: ["Report: I only have to apply in good time.", "Ich müsse nur rechtzeitig den Antrag stellen.", ich-muesse]
  - ask: ["Say: extend the permit.", "Die Erlaubnis verlängern.", verlaengern-e]
  - ask: ["Say: the salary threshold.", "Die Gehaltsgrenze.", die-gehaltsgrenze]
  - note: ["After a German degree, graduates get a permit to look for work for a set time and may work in any job meanwhile; with a qualified job they switch to the Blue Card or the skilled-worker permit, which leads faster to permanent residence. Lengths and salary thresholds change — check the Ausländerbehörde's current information."]
