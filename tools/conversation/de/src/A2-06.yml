id: A2-06
protagonist: m
title: ["Water", "الماء", "Водата"]
situation:
  - "February. Jonas takes you to the Cospudener See, a lake south of Leipzig — frozen."
  - "فبراير. يوناس يأخذك إلى بحيرة كوسبودينر، جنوب لايبزيغ — متجمّدة."
  - "Февруари. Јонас ве носи на езерото Коспуденер, јужно од Лајпциг — замрзнато."
learn: [a2-perfekt-sein]
culture: Lakes that were mines
items:
  - [der-see, "der See", "the lake", "البحيرة", "езерото"]
  - [das-eis, "das Eis", "the ice", "الجليد", "мразот"]
  - [gefroren, "gefroren", "frozen", "متجمّد", "замрзнато"]
  - [ist-geschmolzen, "ist geschmolzen", "has melted", "ذاب", "се стопи"]
  - [frueher, "früher", "in the past, earlier", "في الماضي", "порано"]
  - [ein-bergwerk, "ein Bergwerk", "a mine", "منجم", "рудник", {rare: true}]
  - [sind-gelaufen, "sind … gelaufen", "walked", "مشينا", "одевме пеш"]
  - [gefaehrlich, "gefährlich", "dangerous", "خطير", "опасно"]
  - [der-dampf, "der Dampf", "the steam", "البخار", "пареата"]
  - [warm-geworden, "ist … geworden", "has become", "أصبح", "стана"]
  - [im-sommer-baden, "im Sommer baden", "swim in summer", "نسبح في الصيف", "се капеме во лето"]
dialogue:
  - [jonas, "Das ist der Cospudener See. Im Winter ist er gefroren.", "This is the Cospudener See. In winter it's frozen.", "هذه بحيرة كوسبودينر. في الشتاء تتجمّد.", "Ова е езерото Коспуденер. Во зима е замрзнато."]
  - [protagonist, "Ein See so nah an der Stadt?", "A lake so close to the city?", "بحيرة قريبة جدًا من المدينة؟", "Езеро толку близу до градот?"]
  - [jonas, "Früher war hier ein Bergwerk. Dann ist es ein See geworden.", "There used to be a mine here. Then it became a lake.", "في الماضي كان هنا منجم. ثم أصبح بحيرة.", "Порано тука имаше рудник. Потоа стана езеро."]
  - [protagonist, "Können wir auf dem Eis gehen?", "Can we walk on the ice?", "هل يمكننا المشي على الجليد؟", "Може ли да одиме по мразот?"]
  - [jonas, "Nein, das ist gefährlich. Letzte Woche ist es geschmolzen und wieder gefroren.", "No, that's dangerous. Last week it melted and froze again.", "لا، هذا خطير. الأسبوع الماضي ذاب ثم تجمّد من جديد.", "Не, опасно е. Минатата недела се стопи и пак замрзна."]
  - [protagonist, "Wir sind schon lange gelaufen. Mir ist kalt.", "We've walked a long way. I'm cold.", "مشينا طويلًا. أشعر بالبرد.", "Долго одевме. Ладно ми е."]
  - [jonas, "Dort ist ein Café. Siehst du den Dampf? Heißer Tee!", "There's a café over there. See the steam? Hot tea!", "هناك مقهى. هل ترى البخار؟ شاي ساخن!", "Таму има кафуле. Ја гледаш пареата? Топол чај!"]
  - [protagonist, "Und im Sommer?", "And in summer?", "وفي الصيف؟", "А во лето?"]
  - [jonas, "Im Sommer baden alle hier. Das Wasser ist sauber.", "In summer everyone swims here. The water is clean.", "في الصيف يسبح الجميع هنا. الماء نظيف.", "Во лето сите се капат тука. Водата е чиста."]
teach:
  - ask: ["Say: the lake is frozen.", "قل: البحيرة متجمّدة.", "Кажете: езерото е замрзнато.", "Der See ist gefroren.", der-see, gefroren]
  - ask: ["Say: there used to be a mine here.", "قل: في الماضي كان هنا منجم.", "Кажете: порано тука имаше рудник.", "Früher war hier ein Bergwerk.", frueher, ein-bergwerk]
  - note: ["Verbs of change and movement form the Perfekt with «sein»: «Es ist geschmolzen», «Es ist ein See geworden», «Wir sind gelaufen».", "أفعال التغيّر والحركة تصوغ الماضي مع «sein»: «Es ist geschmolzen» (ذاب)، «Es ist ein See geworden» (أصبح بحيرة)، «Wir sind gelaufen» (مشينا).", "Глаголите на промена и движење го градат перфектот со «sein»: «Es ist geschmolzen», «Es ist ein See geworden», «Wir sind gelaufen»."]
  - ask: ["Say: it became a lake.", "قل: أصبح بحيرة.", "Кажете: стана езеро.", "Es ist ein See geworden.", warm-geworden]
  - ask: ["Say: the ice melted.", "قل: الجليد ذاب.", "Кажете: мразот се стопи.", "Das Eis ist geschmolzen.", das-eis, ist-geschmolzen]
  - ask: ["Say: that's dangerous.", "قل: هذا خطير.", "Кажете: тоа е опасно.", "Das ist gefährlich.", gefaehrlich]
  - ask: ["Say: we've walked a long way.", "قل: مشينا طويلًا.", "Кажете: долго одевме.", "Wir sind lange gelaufen.", sind-gelaufen]
  - ask: ["Say: the steam.", "قل: البخار.", "Кажете: пареата.", "Der Dampf.", der-dampf]
  - ask: ["Say: in summer everyone swims here.", "قل: في الصيف يسبح الجميع هنا.", "Кажете: во лето сите се капат тука.", "Im Sommer baden alle hier.", im-sommer-baden]
  - note: ["Around Leipzig, old open-cast coal mines have been flooded into lakes — the 'Neuseenland'. Never walk on ice unless the city declares it safe.", "حول لايبزيغ غُمرت مناجم الفحم المكشوفة القديمة بالماء فأصبحت بحيرات — «أرض البحيرات الجديدة». لا تمشِ على الجليد أبدًا إلا إذا أعلنت المدينة أنه آمن.", "Околу Лајпциг старите површински рудници за јаглен се поплавени и станаа езера — „Ноизенланд“. Никогаш не одете по мраз ако градот не објавил дека е безбедно."]
