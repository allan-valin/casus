id: A1-28
protagonist: m
title: ["My family", "عائلتي", "Моето семејство"]
situation:
  - "A video call home in the stairwell, where the signal is good. Frau Becker passes and is curious."
  - "مكالمة فيديو مع الأهل على الدرج، حيث الإشارة جيدة. السيدة بيكر تمر وتسأل بفضول."
  - "Видеоповик дома на скалите, каде што сигналот е добар. Госпоѓа Бекер поминува и е љубопитна."
learn: [de-det_04]
culture: —
items:
  - [die-familie, "die Familie", "the family", "العائلة", "семејството"]
  - [meine-schwester, "meine Schwester", "my sister", "أختي", "сестра ми"]
  - [ihre-kinder, "ihre Kinder", "her children", "أولادها", "нејзините деца"]
  - [mein-bruder, "mein Bruder", "my brother", "أخي", "брат ми"]
  - [sein-sohn, "sein Sohn", "his son", "ابنه", "неговиот син"]
  - [ist-das-ihre, "Ist das Ihre …?", "Is that your …? (polite)", "هل هذه …؟ (بصيغة الاحترام)", "Дали е ова вашата …?"]
  - [die-eltern-meine, "meine Eltern", "my parents", "والداي", "моите родители"]
  - [vermisse, "ich vermisse", "I miss", "أشتاق إلى", "ми недостига"]
  - [wie-viele, "Wie viele …?", "How many …?", "كم …؟", "Колку …?"]
  - [geschwister, "Geschwister", "brothers and sisters", "إخوة وأخوات", "браќа и сестри"]
  - [gruessen-sie, "Grüßen Sie …", "Say hello to … (polite)", "سلّم على …", "Поздравете …"]
dialogue:
  - [becker, "Ist das Ihre Familie?", "Is that your family?", "هل هذه عائلتك؟", "Дали е ова вашето семејство?"]
  - [protagonist, "Ja! Das ist meine Schwester, und das sind ihre Kinder.", "Yes! That's my sister, and those are her children.", "نعم! هذه أختي، وهؤلاء أولادها.", "Да! Ова е сестра ми, а ова се нејзините деца."]
  - [becker, "Wie süß! Haben Sie viele Geschwister?", "How sweet! Do you have many brothers and sisters?", "ما ألطفهم! هل عندك إخوة كثيرون؟", "Колку слатки! Имате ли многу браќа и сестри?"]
  - [protagonist, "Eine Schwester und einen Bruder.", "One sister and one brother.", "أخت وأخ.", "Една сестра и еден брат."]
  - [becker, "Und Ihre Eltern?", "And your parents?", "ووالداك؟", "А вашите родители?"]
  - [protagonist, "Meine Eltern sind auch da — sehen Sie? Mein Bruder hält das Handy.", "My parents are there too — see? My brother is holding the phone.", "والداي هناك أيضًا — هل ترين؟ أخي يمسك الهاتف.", "И моите родители се тука — гледате? Брат ми го држи телефонот."]
  - [becker, "Und das Baby?", "And the baby?", "والطفل؟", "А бебето?"]
  - [protagonist, "Das ist sein Sohn. Ich vermisse sie alle.", "That's his son. I miss them all.", "هذا ابنه. أشتاق إليهم جميعًا.", "Тоа е неговиот син. Ми недостигаат сите."]
  - [becker, "Das verstehe ich. Grüßen Sie Ihre Familie!", "I understand. Say hello to your family!", "أفهم ذلك. سلّم على عائلتك!", "Ве разбирам. Поздравете го вашето семејство!"]
teach:
  - ask: ["She asks: is that your family?", "تسأل: هل هذه عائلتك؟", "Таа прашува: дали е ова вашето семејство?", "Ist das Ihre Familie?", ist-das-ihre, die-familie]
  - note: ["'My', 'his', 'her' follow the noun's gender: «mein Bruder», «meine Schwester», «meine Eltern»; «sein Sohn» (his), «ihre Kinder» (her children). «Ihre» with a capital is the polite 'your'.", "الضمائر الملكية تتبع جنس الاسم: «mein Bruder»، «meine Schwester»، «meine Eltern»؛ «sein Sohn» (ابنه)، «ihre Kinder» (أولادها). و«Ihre» بحرف كبير تعني «لك» بصيغة الاحترام.", "Присвојните зборови го следат родот на именката: «mein Bruder», «meine Schwester», «meine Eltern»; «sein Sohn» (неговиот), «ihre Kinder» (нејзините). «Ihre» со голема буква е учтивото „ваш“."]
  - ask: ["Say: that's my sister.", "قل: هذه أختي.", "Кажете: ова е сестра ми.", "Das ist meine Schwester.", meine-schwester]
  - ask: ["Say: those are her children.", "قل: هؤلاء أولادها.", "Кажете: ова се нејзините деца.", "Das sind ihre Kinder.", ihre-kinder]
  - ask: ["She asks about brothers and sisters.", "تسأل عن الإخوة والأخوات.", "Таа прашува за браќа и сестри.", "Haben Sie Geschwister?", geschwister]
  - ask: ["Ask: how many?", "اسأل: كم؟", "Прашајте: колку?", "Wie viele?", wie-viele]
  - ask: ["Say: my brother is holding the phone.", "قل: أخي يمسك الهاتف.", "Кажете: брат ми го држи телефонот.", "Mein Bruder hält das Handy.", mein-bruder]
  - ask: ["Say: my parents are there too.", "قل: والداي هناك أيضًا.", "Кажете: и моите родители се тука.", "Meine Eltern sind auch da.", die-eltern-meine]
  - ask: ["Say: that's his son.", "قل: هذا ابنه.", "Кажете: тоа е неговиот син.", "Das ist sein Sohn.", sein-sohn]
  - ask: ["Say: I miss them all.", "قل: أشتاق إليهم جميعًا.", "Кажете: ми недостигаат сите.", "Ich vermisse sie alle.", vermisse]
  - ask: ["She says: say hello to your family!", "تقول: سلّم على عائلتك!", "Таа вели: поздравете го семејството!", "Grüßen Sie Ihre Familie!", gruessen-sie]
