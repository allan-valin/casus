id: A2-24
protagonist: m
title: ["Music", "الموسيقى", "Музика"]
situation:
  - "Friday evening at the Thomaskirche: the boys' choir sings Bach. Afterwards Jonas wants to go to a techno club."
  - "مساء الجمعة في كنيسة توماس: جوقة الأولاد تغني باخ. بعدها يريد يوناس الذهاب إلى نادي تكنو."
  - "Петок навечер во црквата Томас: момчешкиот хор пее Бах. Потоа Јонас сака во техно-клуб."
learn: [a2-dative-verbs]
culture: Bach and techno
items:
  - [der-chor, "der Chor", "the choir", "الجوقة", "хорот"]
  - [das-konzert, "das Konzert", "the concert", "الحفلة الموسيقية", "концертот"]
  - [gefaellt-mir, "gefällt mir", "I like it (it pleases me)", "يعجبني", "ми се допаѓа"]
  - [gehoert, "gehört", "belongs to", "يعود إلى، ملك", "му припаѓа"]
  - [hilft-dir, "hilft dir", "helps you", "يساعدك", "ти помага"]
  - [schmeckt-mir, "schmeckt mir", "I like the taste", "يعجبني طعمه", "ми е вкусно"]
  - [der-komponist, "der Komponist", "the composer", "المؤلف الموسيقي", "композиторот"]
  - [beruehmt, "berühmt", "famous", "مشهور", "познат"]
  - [das-grab, "das Grab", "the grave", "القبر", "гробот"]
  - [klassisch, "klassisch", "classical", "كلاسيكي", "класично"]
dialogue:
  - [jonas, "Das ist der Thomanerchor. Bach war hier Kantor.", "That's the Thomanerchor. Bach was cantor here.", "هذه جوقة توماس. كان باخ قائد الجوقة هنا.", "Ова е хорот Томанер. Бах бил кантор тука."]
  - [protagonist, "Bach? Der berühmte Komponist?", "Bach? The famous composer?", "باخ؟ المؤلف الموسيقي المشهور؟", "Бах? Познатиот композитор?"]
  - [jonas, "Genau. Sein Grab ist hier in der Kirche.", "Exactly. His grave is here in the church.", "بالضبط. قبره هنا في الكنيسة.", "Точно. Неговиот гроб е тука во црквата."]
  - [protagonist, "Das Konzert gefällt mir sehr.", "I like the concert very much.", "الحفلة تعجبني كثيرًا.", "Концертот многу ми се допаѓа."]
  - [jonas, "Mir auch. Aber jetzt: Techno! Leipzig gehört auch den Clubs.", "Me too. But now: techno! Leipzig belongs to the clubs too.", "وأنا أيضًا. لكن الآن: تكنو! لايبزيغ ملك للنوادي أيضًا.", "И мене. Но сега: техно! Лајпциг им припаѓа и на клубовите."]
  - [protagonist, "Klassisch und Techno am selben Abend?", "Classical and techno on the same evening?", "كلاسيكي وتكنو في الأمسية نفسها؟", "Класично и техно во иста вечер?"]
  - [jonas, "Warum nicht? Ein Bier hilft dir.", "Why not? A beer will help.", "لم لا؟ بيرة تساعدك.", "Зошто да не? Едно пиво ќе ти помогне."]
  - [protagonist, "Lieber eine Cola. Bier schmeckt mir nicht.", "I'd rather have a cola. I don't like beer.", "أفضّل كولا. طعم البيرة لا يعجبني.", "Повеќе кола. Пивото не ми е вкусно."]
teach:
  - ask: ["Say: the choir.", "قل: الجوقة.", "Кажете: хорот.", "Der Chor.", der-chor]
  - ask: ["Say: the famous composer.", "قل: المؤلف الموسيقي المشهور.", "Кажете: познатиот композитор.", "Der berühmte Komponist.", beruehmt, der-komponist]
  - ask: ["Say: his grave is in the church.", "قل: قبره في الكنيسة.", "Кажете: неговиот гроб е во црквата.", "Sein Grab ist in der Kirche.", das-grab]
  - note: ["Some verbs take the person in the dative: «gefallen» (please), «gehören» (belong), «helfen» (help), «schmecken» (taste good). «Das Konzert gefällt mir» — the concert pleases me.", "بعض الأفعال تأخذ الشخص في حالة الجر: «gefallen» (يعجب)، «gehören» (يعود إلى)، «helfen» (يساعد)، «schmecken» (يطيب طعمه). «Das Konzert gefällt mir» — الحفلة تعجبني.", "Некои глаголи бараат лице во датив: «gefallen» (се допаѓа), «gehören» (припаѓа), «helfen» (помага), «schmecken» (е вкусно). «Das Konzert gefällt mir» — концертот ми се допаѓа."]
  - ask: ["Say: I like the concert very much.", "قل: الحفلة تعجبني كثيرًا.", "Кажете: концертот многу ми се допаѓа.", "Das Konzert gefällt mir sehr.", das-konzert, gefaellt-mir]
  - ask: ["Say: Leipzig belongs to the clubs too.", "قل: لايبزيغ ملك للنوادي أيضًا.", "Кажете: Лајпциг им припаѓа и на клубовите.", "Leipzig gehört auch den Clubs.", gehoert]
  - ask: ["Say: classical and techno.", "قل: كلاسيكي وتكنو.", "Кажете: класично и техно.", "Klassisch und Techno.", klassisch]
  - ask: ["Say: a beer will help you.", "قل: بيرة تساعدك.", "Кажете: пивото ќе ти помогне.", "Ein Bier hilft dir.", hilft-dir]
  - ask: ["Say: I don't like the taste of beer.", "قل: طعم البيرة لا يعجبني.", "Кажете: пивото не ми е вкусно.", "Bier schmeckt mir nicht.", schmeckt-mir]
  - note: ["Johann Sebastian Bach worked in Leipzig for 27 years as cantor of the Thomaskirche, where his grave is; the boys' choir still sings there most Fridays and Saturdays. The same city has one of Germany's biggest techno scenes.", "عمل يوهان سيباستيان باخ في لايبزيغ 27 عامًا قائدًا لجوقة كنيسة توماس، حيث قبره؛ وما زالت جوقة الأولاد تغني هناك أغلب أيام الجمعة والسبت. والمدينة نفسها فيها من أكبر مشاهد التكنو في ألمانيا.", "Јохан Себастијан Бах работел во Лајпциг 27 години како кантор на црквата Томас, каде што е и неговиот гроб; момчешкиот хор и денес пее таму речиси секој петок и сабота. Истиот град има една од најголемите техно-сцени во Германија."]
