id: A1-01
protagonist: f
title: ["Good day", "نهارك سعيد", "Добар ден"]
situation:
  - "Your first day in Leipzig. A woman opens the door of the ground-floor flat."
  - "يومك الأول في لايبزيغ. امرأة تفتح باب الشقة في الطابق الأرضي."
  - "Вашиот прв ден во Лајпциг. Една жена ја отвора вратата на станот во приземјето."
learn: [a1-sein]
culture: Sie and a handshake
items:
  - [guten-tag, "Guten Tag", "Good day / hello", "نهارك سعيد / مرحبًا", "Добар ден"]
  - [entschuldigung, "Entschuldigung", "Excuse me / sorry", "عفوًا / المعذرة", "Извинете"]
  - [ich-verstehe-nicht, "Ich verstehe nicht", "I don't understand", "لا أفهم", "Не разбирам"]
  - [sie-sind, "Sie sind", "you are (polite)", "أنتِ / أنتَ (بصيغة الاحترام)", "Вие сте"]
  - [neu-hier, "neu hier", "new here", "جديد هنا", "нов тука"]
  - [ja, "Ja", "Yes", "نعم", "Да"]
  - [ich-bin, "ich bin", "I am", "أنا (أكون)", "јас сум"]
  - [sprechen-sie-englisch, "Sprechen Sie Englisch?", "Do you speak English? (polite)", "هل تتكلمين الإنجليزية؟ (بصيغة الاحترام)", "Зборувате ли англиски?"]
  - [ein-bisschen, "ein bisschen", "a little", "قليلًا", "малку"]
  - [ich-wohne, "ich wohne", "I live", "أسكن", "живеам"]
  - [unten, "unten", "downstairs", "في الأسفل", "долу"]
  - [freut-mich, "Freut mich", "Nice to meet you", "تشرفنا", "Мило ми е"]
  - [willkommen, "Willkommen", "Welcome", "أهلًا وسهلًا", "Добредојдовте"]
  - [der-schluessel, "der Schlüssel", "the key", "المفتاح", "клучот"]
  - [danke-schoen, "Danke schön", "Thank you very much", "شكرًا جزيلًا", "Благодарам многу"]
  - [bitte-schoen, "Bitte schön", "You're welcome / here you are", "عفوًا / تفضّلي", "Нема зошто / повелете"]
  - [auf-wiedersehen, "Auf Wiedersehen", "Goodbye", "مع السلامة", "Довидување"]
dialogue:
  - [becker, "Guten Tag! Sie sind neu hier, oder?", "Hello! You're new here, aren't you?", "نهارك سعيد! أنتِ جديدة هنا، أليس كذلك؟", "Добар ден! Вие сте нова тука, нели?"]
  - [protagonist, "Guten Tag. Entschuldigung, ich verstehe nicht.", "Hello. Sorry, I don't understand.", "نهارك سعيد. عفوًا، لا أفهم.", "Добар ден. Извинете, не разбирам."]
  - [becker, "Sie – sind – neu – hier?", "You – are – new – here?", "أنتِ – جديدة – هنا؟", "Вие – сте – нова – тука?"]
  - [protagonist, "Ah! Ja, ich bin neu hier. Sprechen Sie Englisch?", "Ah! Yes, I'm new here. Do you speak English?", "آه! نعم، أنا جديدة هنا. هل تتكلمين الإنجليزية؟", "А! Да, нова сум тука. Зборувате ли англиски?"]
  - [becker, "Ein bisschen. Ich bin Frau Becker. Ich wohne unten.", "A little. I'm Mrs Becker. I live downstairs.", "قليلًا. أنا السيدة بيكر. أسكن في الأسفل.", "Малку. Јас сум госпоѓа Бекер. Живеам долу."]
  - [protagonist, "Freut mich, Frau Becker.", "Nice to meet you, Mrs Becker.", "تشرفنا يا سيدة بيكر.", "Мило ми е, госпоѓо Бекер."]
  - [becker, "Willkommen im Haus! Hier ist der Schlüssel für die Haustür.", "Welcome to the house! Here is the key for the front door.", "أهلًا بك في البيت! هذا مفتاح باب العمارة.", "Добредојдовте во зградата! Еве го клучот за влезната врата."]
  - [protagonist, "Danke schön!", "Thank you very much!", "شكرًا جزيلًا!", "Благодарам многу!"]
  - [becker, "Bitte schön. Auf Wiedersehen!", "You're welcome. Goodbye!", "عفوًا. مع السلامة!", "Нема зошто. Довидување!"]
  - [protagonist, "Auf Wiedersehen!", "Goodbye!", "مع السلامة!", "Довидување!"]
teach:
  - note: ["To greet someone you don't know: «Guten Tag». In the evening: «Guten Abend».", "لتحية شخص لا تعرفينه: «Guten Tag». وفي المساء: «Guten Abend».", "За поздрав со непознат: «Guten Tag». Навечер: «Guten Abend»."]
  - ask: ["Greet the woman at the door.", "حيّي المرأة عند الباب.", "Поздравете ја жената на вратата.", "Guten Tag.", guten-tag]
  - ask: ["Say politely: excuse me, I don't understand.", "قولي بأدب: عفوًا، لا أفهم.", "Кажете учтиво: извинете, не разбирам.", "Entschuldigung, ich verstehe nicht.", entschuldigung, ich-verstehe-nicht]
  - note: ["«Sie» is the polite 'you', written with a capital S — for strangers, officials and older people. Friends say «du».", "«Sie» هي صيغة المخاطبة المؤدبة، وتُكتب بحرف S كبير — مع الغرباء والموظفين وكبار السن. أما الأصدقاء فيقولون «du».", "«Sie» е учтивото „Вие“, со голема буква — за непознати, службеници и постари. Пријателите си велат «du»."]
  - ask: ["She asks if you are new here. How?", "تسألك إن كنتِ جديدة هنا. كيف تقول ذلك؟", "Ве прашува дали сте нова тука. Како?", "Sie sind neu hier?", sie-sind, neu-hier]
  - note: ["«ich bin» — I am; «Sie sind» — you are, polite. The same verb: «sein», to be.", "«ich bin» تعني: أنا أكون؛ و«Sie sind»: أنتِ تكونين، بصيغة الاحترام. الفعل نفسه: «sein»، أي يكون.", "«ich bin» — јас сум; «Sie sind» — Вие сте. Истиот глагол: «sein», сум."]
  - ask: ["Answer: yes, I'm new here.", "أجيبي: نعم، أنا جديدة هنا.", "Одговорете: да, нова сум тука.", "Ja, ich bin neu hier.", ja, ich-bin, neu-hier]
  - ask: ["Ask if she speaks English.", "اسأليها إن كانت تتكلم الإنجليزية.", "Прашајте ја дали зборува англиски.", "Sprechen Sie Englisch?", sprechen-sie-englisch]
  - ask: ["She says: a little.", "تقول: قليلًا.", "Таа вели: малку.", "Ein bisschen.", ein-bisschen]
  - ask: ["Say it for her: I live downstairs.", "قوليها بلسانها: أسكن في الأسفل.", "Кажете наместо неа: живеам долу.", "Ich wohne unten.", ich-wohne, unten]
  - ask: ["Say: nice to meet you, Mrs Becker.", "قولي: تشرفنا يا سيدة بيكر.", "Кажете: мило ми е, госпоѓо Бекер.", "Freut mich, Frau Becker.", freut-mich]
  - note: ["Germans shake hands when they meet: brief and firm, with eye contact. No cheek kisses between strangers.", "يتصافح الألمان عند التعارف: مصافحة قصيرة وثابتة مع النظر في العينين، ولا قُبلات على الخد بين الغرباء.", "Германците се ракуваат при запознавање: кратко и цврсто, со поглед во очи. Бакнежи во образ меѓу непознати нема."]
  - only: {ar: "إن كنتِ لا تصافحين الرجال، فضعي يدك على صدرك وابتسمي وقولي «Freut mich» — هذا مفهوم في ألمانيا ومقبول."}
  - ask: ["She welcomes you. How?", "ترحّب بك. كيف؟", "Ви посакува добредојде. Како?", "Willkommen!", willkommen]
  - ask: ["Say: here is the key.", "قولي: هذا هو المفتاح.", "Кажете: еве го клучот.", "Hier ist der Schlüssel.", der-schluessel]
  - ask: ["Thank her.", "اشكريها.", "Заблагодарете ѝ.", "Danke schön!", danke-schoen]
  - ask: ["She answers: you're welcome.", "تجيب: عفوًا.", "Таа одговара: нема зошто.", "Bitte schön.", bitte-schoen]
  - ask: ["Say goodbye.", "ودّعيها.", "Поздравете се.", "Auf Wiedersehen!", auf-wiedersehen]
