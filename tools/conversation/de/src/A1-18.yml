id: A1-18
protagonist: m
title: ["Food and cooking", "الطعام والطبخ", "Храна и готвење"]
situation:
  - "Jonas and Lena are coming to dinner. You cook a dish from home on the new stove."
  - "يوناس ولينا قادمان للعشاء. تطبخ طبقًا من بلدك على الموقد الجديد."
  - "Јонас и Лена доаѓаат на вечера. Готвите јадење од дома на новиот шпорет."
learn: [de-cas_03, de-det_01]
culture: Guests bring something; dinner is early
items:
  - [ich-koche, "ich koche", "I cook", "أطبخ", "готвам"]
  - [den-reis, "den Reis", "the rice (object)", "الأرز", "оризот"]
  - [das-gemuese, "das Gemüse", "the vegetables", "الخضار", "зеленчукот"]
  - [der-herd, "der Herd", "the stove", "الموقد", "шпоретот"]
  - [heiss, "heiß", "hot", "ساخن", "жешко"]
  - [salzig, "salzig", "salty", "مالح", "солено"]
  - [scharf, "scharf", "spicy", "حار (حرّيف)", "луто"]
  - [probier-mal, "Probier mal!", "Have a taste! (informal)", "ذُق!", "Проба!"]
  - [schmeckt, "schmeckt", "tastes (good)", "طعمه (طيب)", "има вкус, е вкусно"]
  - [das-rezept, "das Rezept", "the recipe", "الوصفة", "рецептот"]
  - [mitgebracht, "mitgebracht", "brought along", "أحضرنا معنا", "донесовме"]
  - [guten-appetit, "Guten Appetit!", "Enjoy your meal!", "بالهناء والشفاء!", "Пријатно!"]
dialogue:
  - [jonas, "Hallo! Wir haben Wein mitgebracht. Was kochst du?", "Hi! We've brought wine. What are you cooking?", "مرحبًا! أحضرنا معنا نبيذًا. ماذا تطبخ؟", "Здраво! Донесовме вино. Што готвиш?"]
  - [protagonist, "Ich koche den Reis mit Gemüse. Ein Rezept von zu Hause.", "I'm cooking the rice with vegetables. A recipe from home.", "أطبخ الأرز مع الخضار. وصفة من بلدي.", "Готвам ориз со зеленчук. Рецепт од дома."]
  - [lena, "Vorsicht, der Herd ist heiß!", "Careful, the stove is hot!", "انتبه، الموقد ساخن!", "Внимавај, шпоретот е жежок!"]
  - [protagonist, "Probier mal! Ist es zu salzig?", "Have a taste! Is it too salty?", "ذوقي! هل هو مالح جدًا؟", "Проба! Дали е пресолено?"]
  - [lena, "Nein, es schmeckt super. Ein bisschen scharf!", "No, it tastes great. A bit spicy!", "لا، طعمه رائع. حار قليلًا!", "Не, супер е. Малку луто!"]
  - [jonas, "Für mich ist es sehr scharf!", "For me it's very spicy!", "بالنسبة لي إنه حار جدًا!", "За мене е многу луто!"]
  - [protagonist, "Hier ist Wasser. Und Brot.", "Here's water. And bread.", "هذا ماء. وخبز.", "Еве вода. И леб."]
  - [lena, "Gibst du mir das Rezept?", "Will you give me the recipe?", "هل تعطيني الوصفة؟", "Ќе ми го дадеш рецептот?"]
  - [protagonist, "Klar! Guten Appetit!", "Sure! Enjoy your meal!", "طبعًا! بالهناء والشفاء!", "Секако! Пријатно!"]
teach:
  - ask: ["Jonas says: we've brought wine.", "يوناس يقول: أحضرنا معنا نبيذًا.", "Јонас вели: донесовме вино.", "Wir haben Wein mitgebracht.", mitgebracht]
  - note: ["After a verb like «kochen» the object takes the accusative — only «der» changes: «der Reis» → «Ich koche den Reis». «das Gemüse» and «die Suppe» stay.", "بعد فعل مثل «kochen» يأتي المفعول به في حالة النصب — فقط «der» تتغير: «der Reis» → «Ich koche den Reis». أما «das Gemüse» و«die Suppe» فتبقيان.", "По глагол како «kochen» предметот е во акузатив — се менува само «der»: «der Reis» → «Ich koche den Reis». «das Gemüse» и «die Suppe» остануваат."]
  - ask: ["Say: I'm cooking the rice with vegetables.", "قل: أطبخ الأرز مع الخضار.", "Кажете: готвам ориз со зеленчук.", "Ich koche den Reis mit Gemüse.", ich-koche, den-reis, das-gemuese]
  - ask: ["Lena warns: the stove is hot!", "لينا تنبّه: الموقد ساخن!", "Лена предупредува: шпоретот е жежок!", "Der Herd ist heiß!", der-herd, heiss]
  - ask: ["Say: have a taste! Is it too salty?", "قل: ذوقي! هل هو مالح جدًا؟", "Кажете: проба! Дали е пресолено?", "Probier mal! Ist es zu salzig?", probier-mal, salzig]
  - ask: ["She says: it tastes great.", "تقول: طعمه رائع.", "Таа вели: супер е.", "Es schmeckt super.", schmeckt]
  - ask: ["She says: a bit spicy!", "تقول: حار قليلًا!", "Таа вели: малку луто!", "Ein bisschen scharf!", scharf]
  - ask: ["She asks for the recipe.", "تطلب الوصفة.", "Таа го бара рецептот.", "Gibst du mir das Rezept?", das-rezept]
  - ask: ["Wish them a good meal.", "تمنَّ لهم الهناء.", "Посакајте им пријатно.", "Guten Appetit!", guten-appetit]
  - note: ["Guests usually bring something small — wine, flowers, chocolate — and come on time. Dinner is early, often at six or seven. Many Germans find food very spicy that you find mild: ask before adding chilli.", "عادة يحضر الضيوف شيئًا صغيرًا — نبيذًا أو أزهارًا أو شوكولاتة — ويأتون في الموعد. العشاء مبكر، غالبًا في السادسة أو السابعة. وكثير من الألمان يجدون حارًّا ما تراه أنت خفيفًا: اسأل قبل أن تضيف الفلفل.", "Гостите обично носат нешто мало — вино, цвеќе, чоколадо — и доаѓаат точно. Вечерата е рано, често во шест или седум. Многу Германци наоѓаат за луто тоа што вам ви е благо: прашајте пред да ставите лута пиперка."]
  - only: {ar: "إن كنت لا تشرب الكحول، قل ببساطة «Danke, ich trinke keinen Alkohol» — هذا عادي تمامًا، ولن يصرّ أحد."}
