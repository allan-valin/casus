id: C2-30
protagonist: m
title: ["Ten years", "عشر سنوات", "Десет години"]
situation:
  - "Late at night after the party, you and Jonas sit on the stairs where you first met. The whole story, looking back."
  - "في وقت متأخر من الليل بعد الحفلة، تجلس أنت ويوناس على الدرج حيث التقيتما أول مرة. القصة كلها، بنظرة إلى الماضي."
  - "Доцна ноќта по забавата, вие и Јонас седите на скалите каде што првпат се запознавте. Целата приказна, гледајќи наназад."
learn: []
culture: The whole story
items:
  - [die-treppe, "auf derselben Treppe", "on the same staircase", "على الدرج نفسه", "на истите скали"]
  - [der-erste-tag, "am ersten Tag", "on the first day", "في اليوم الأول", "првиот ден"]
  - [wer-haette-das-gedacht, "Wer hätte das gedacht?", "Who'd have thought it?", "من كان يظن ذلك؟", "Кој би помислил?"]
  - [die-geschichte-c2, "unsere Geschichte", "our story", "قصتنا", "нашата приказна"]
  - [angekommen-sein, "angekommen sein", "have arrived, belong", "استقرّ وانتمى", "да си пристигнал, да припаѓаш"]
  - [weitergehen, "Es geht weiter", "It goes on", "الحكاية تستمرّ", "Продолжува"]
  - [die-naechsten-zehn, "die nächsten zehn Jahre", "the next ten years", "السنوات العشر القادمة", "следните десет години"]
  - [der-lieblingsonkel, "der Lieblingsonkel", "the favourite uncle", "العمّ المفضّل", "омилениот чичко"]
  - [wen-ich-fragen-kann, "wissen, wen man fragen kann", "know whom to ask", "يعرف من يسأل", "да знаеш кого да прашаш"]
  - [befreundet, "befreundet sein", "be friends", "يكون صديقًا", "да се пријатели"]
dialogue:
  - [jonas, "Weißt du noch? Auf derselben Treppe hast du am ersten Tag gefragt, wo der Müll hinkommt.", "Remember? On this same staircase, on the first day, you asked where the rubbish goes.", "أتذكر؟ على الدرج نفسه سألتَ في اليوم الأول أين توضع القمامة.", "Се сеќаваш? На истите скали, првиот ден, праша каде оди ѓубрето."]
  - [protagonist, "Und du hast mir eine halbe Stunde lang Mülltrennung erklärt.", "And you explained recycling to me for half an hour.", "وأنت شرحتَ لي فرز القمامة نصف ساعة.", "А ти ми ја објаснуваше селекцијата половина час."]
  - [jonas, "Wer hätte das gedacht? Heute bist du Emmas Lieblingsonkel.", "Who'd have thought it? Today you're Emma's favourite uncle.", "من كان يظن ذلك؟ اليوم أنت عمّ إيما المفضّل.", "Кој би помислил? Денес си омилениот чичко на Ема."]
  - [protagonist, "Zehn Jahre. Von „Entschuldigung“ bis zu Rilke. Vom Café bis zum Stadtrat.", "Ten years. From 'Entschuldigung' to Rilke. From the café to the city council.", "عشر سنوات. من «عذرًا» إلى ريلكه. من المقهى إلى مجلس المدينة.", "Десет години. Од „Entschuldigung“ до Рилке. Од кафулето до градскиот совет."]
  - [jonas, "Bist du angekommen?", "Have you arrived?", "هل استقررتَ؟", "Пристигна ли?"]
  - [protagonist, "Ja. Nicht, weil ich alles verstehe. Sondern weil ich weiß, wen ich fragen kann.", "Yes. Not because I understand everything. But because I know whom to ask.", "نعم. لا لأنني أفهم كل شيء. بل لأنني أعرف من أسأل.", "Да. Не затоа што разбирам сè. Туку затоа што знам кого да прашам."]
  - [jonas, "Schön gesagt. Und die nächsten zehn Jahre?", "Nicely put. And the next ten years?", "قلتَها جميلة. والسنوات العشر القادمة؟", "Убаво кажано. А следните десет години?"]
  - [protagonist, "Es geht weiter. Unsere Geschichte ist nicht zu Ende.", "It goes on. Our story isn't over.", "الحكاية تستمرّ. قصتنا لم تنتهِ.", "Продолжува. Нашата приказна не е завршена."]
teach:
  - ask: ["Say: on the same staircase.", "قل: على الدرج نفسه.", "Кажете: на истите скали.", "Auf derselben Treppe.", die-treppe]
  - ask: ["Say: on the first day.", "قل: في اليوم الأول.", "Кажете: првиот ден.", "Am ersten Tag.", der-erste-tag]
  - ask: ["Say: who'd have thought it?", "قل: من كان يظن ذلك؟", "Кажете: кој би помислил?", "Wer hätte das gedacht?", wer-haette-das-gedacht]
  - ask: ["Ask: have you arrived?", "اسأل: هل استقررتَ؟", "Прашајте: пристигна ли?", "Bist du angekommen?", angekommen-sein]
  - ask: ["Say: Emma's favourite uncle.", "قل: عمّ إيما المفضّل.", "Кажете: омилениот чичко на Ема.", "Emmas Lieblingsonkel.", der-lieblingsonkel]
  - ask: ["Say: I know whom to ask.", "قل: أعرف من أسأل.", "Кажете: знам кого да прашам.", "Ich weiß, wen ich fragen kann.", wen-ich-fragen-kann]
  - note: ["The end of the course. Some more from the whole level — and the whole story.", "نهاية الدورة. مزيد من المستوى كله — ومن القصة كلها.", "Крај на курсот. Уште малку од целото ниво — и од целата приказна."]
  - ask: ["At a wedding: raise your glasses.", "في عرس: ارفعوا الكؤوس.", "На свадба: кренете ги чашите.", "Erheben Sie mit mir das Glas!", das-glas-erheben]
  - ask: ["At the office: not bad (= excellent).", "في المكتب: ليس سيئًا (= ممتاز).", "Во канцеларија: не е лошо (= одлично).", "Nicht schlecht.", nicht-schlecht]
  - ask: ["At the council: I ask you very concretely.", "في المجلس: أسألكم بشكل محدّد تمامًا.", "Во советот: ве прашувам сосема конкретно.", "Ich frage Sie ganz konkret.", ich-frage-sie]
  - ask: ["To a friend in crisis: I'm here for you.", "لصديق في أزمة: أنا هنا من أجلك.", "На пријател во криза: тука сум за тебе.", "Ich bin für dich da.", fuer-dich-da-sein]
  - ask: ["Say: our story goes on.", "قل: قصتنا تستمرّ.", "Кажете: нашата приказна продолжува.", "Unsere Geschichte geht weiter.", weitergehen, die-geschichte-c2]
  - ask: ["Say: the next ten years.", "قل: السنوات العشر القادمة.", "Кажете: следните десет години.", "Die nächsten zehn Jahre.", die-naechsten-zehn]
  - note: ["From a first «Entschuldigung» to reading Rilke and speaking at the city council: that is the whole way from A1 to C2. Arriving doesn't mean understanding everything — it means knowing whom to ask. Viel Glück — and keep talking.", "من أول «Entschuldigung» إلى قراءة ريلكه والكلام في مجلس المدينة: هذا هو الطريق كله من A1 إلى C2. والاستقرار لا يعني أن تفهم كل شيء — بل أن تعرف من تسأل. بالتوفيق — وواصل الكلام.", "Од првото „Entschuldigung“ до читање Рилке и говор во градскиот совет: тоа е целиот пат од A1 до C2. Да пристигнеш не значи да разбираш сè — туку да знаеш кого да прашаш. Viel Glück — и продолжете да зборувате."]
