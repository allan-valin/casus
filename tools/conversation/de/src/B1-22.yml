id: B1-22
protagonist: m
title: ["Volunteering", "التطوّع", "Волонтирање"]
situation:
  - "Saturday at the Tafel, the food bank. You help hand out food — and meet Herr Fischer, who goes with newcomers to their appointments."
  - "السبت في «Tafel»، بنك الطعام. تساعد في توزيع الطعام — وتلتقي السيد فيشر الذي يرافق القادمين الجدد إلى مواعيدهم."
  - "Сабота во Tafel, банката за храна. Помагате во делењето храна — и го запознавате господин Фишер, кој ги придружува новодојдените на термини."
learn: [b1-um-zu]
culture: One helpful person
items:
  - [die-tafel, "die Tafel", "the food bank", "بنك الطعام", "банката за храна"]
  - [freiwillig, "freiwillig", "voluntary, voluntarily", "طوعًا", "доброволно"]
  - [begleiten, "begleiten", "accompany", "يرافق", "придружува"]
  - [der-termin-amt, "zum Termin", "to the appointment", "إلى الموعد", "на терминот"]
  - [lebensmittel, "Lebensmittel", "food, groceries", "مواد غذائية", "намирници"]
  - [verteilen, "verteilen", "hand out, distribute", "يوزّع", "дели"]
  - [die-tuer-oeffnen, "Türen öffnen", "open doors", "يفتح الأبواب", "отвора врати"]
  - [ohne-sie, "ohne Sie", "without you", "بدونك", "без вас"]
  - [es-macht-mir-spass, "es macht mir Spaß", "I enjoy it", "أستمتع بذلك", "ми е забавно"]
  - [zurueckgeben, "etwas zurückgeben", "give something back", "يردّ الجميل", "враќа нешто"]
  - [der-rentner, "der Rentner", "the pensioner", "المتقاعد", "пензионерот"]
dialogue:
  - [fischer, "Sie helfen heute zum ersten Mal? Willkommen bei der Tafel!", "You're helping for the first time today? Welcome to the Tafel!", "تساعد اليوم لأول مرة؟ أهلًا بك في بنك الطعام!", "Денес прв пат помагате? Добредојдовте во Tafel!"]
  - [protagonist, "Ja. Ich bin hier, um etwas zurückzugeben.", "Yes. I'm here to give something back.", "نعم. أنا هنا لأردّ الجميل.", "Да. Тука сум за да вратам нешто."]
  - [fischer, "Schön. Wir verteilen Lebensmittel, die Supermärkte nicht mehr verkaufen.", "Lovely. We hand out food the supermarkets no longer sell.", "جميل. نوزّع مواد غذائية لم تعد المتاجر تبيعها.", "Убаво. Делиме намирници што супермаркетите веќе не ги продаваат."]
  - [protagonist, "Und Sie machen das freiwillig?", "And you do it voluntarily?", "وأنت تفعل ذلك طوعًا؟", "А вие тоа го правите доброволно?"]
  - [fischer, "Ja. Ich bin Rentner. Und ich begleite Neue zu Terminen, beim Jobcenter oder beim Amt.", "Yes. I'm a pensioner. And I go with newcomers to appointments, at the Jobcenter or at offices.", "نعم. أنا متقاعد. وأرافق القادمين الجدد إلى المواعيد، في مركز العمل أو في الدوائر.", "Да. Пензионер сум. И ги придружувам новите на термини, во Jobcenter или во канцелариите."]
  - [protagonist, "Warum?", "Why?", "لماذا؟", "Зошто?"]
  - [fischer, "Mit einem Deutschen daneben öffnen sich Türen. Leider ist das so.", "With a German beside them, doors open. Sadly, that's how it is.", "مع ألماني بجانبهم تُفتح الأبواب. للأسف هكذا الأمر.", "Со Германец до нив, вратите се отвораат. За жал, така е."]
  - [protagonist, "Ohne Menschen wie Sie wäre alles schwerer.", "Without people like you everything would be harder.", "بدون أناس مثلك لكان كل شيء أصعب.", "Без луѓе како вас сè би било потешко."]
  - [fischer, "Ach was. Es macht mir Spaß.", "Oh, come on. I enjoy it.", "لا داعي. أستمتع بذلك.", "Ма, ајде. Ми е забавно."]
teach:
  - ask: ["Say: the food bank.", "قل: بنك الطعام.", "Кажете: банката за храна.", "Die Tafel.", die-tafel]
  - ask: ["Say: I'm here to give something back.", "قل: أنا هنا لأردّ الجميل.", "Кажете: тука сум за да вратам нешто.", "Ich bin hier, um etwas zurückzugeben.", zurueckgeben]
  - ask: ["Say: we hand out food.", "قل: نوزّع مواد غذائية.", "Кажете: делиме намирници.", "Wir verteilen Lebensmittel.", verteilen, lebensmittel]
  - ask: ["Ask: you do it voluntarily?", "اسأل: تفعل ذلك طوعًا؟", "Прашајте: тоа го правите доброволно?", "Sie machen das freiwillig?", freiwillig]
  - ask: ["He says: I'm a pensioner.", "يقول: أنا متقاعد.", "Тој вели: пензионер сум.", "Ich bin Rentner.", der-rentner]
  - ask: ["He says: I go with newcomers to appointments.", "يقول: أرافق القادمين الجدد إلى المواعيد.", "Тој вели: ги придружувам новите на термини.", "Ich begleite Neue zu Terminen.", begleiten, der-termin-amt]
  - ask: ["He says: doors open.", "يقول: تُفتح الأبواب.", "Тој вели: вратите се отвораат.", "Türen öffnen sich.", die-tuer-oeffnen]
  - ask: ["Say: without people like you…", "قل: بدون أناس مثلك…", "Кажете: без луѓе како вас…", "Ohne Menschen wie Sie…", ohne-sie]
  - ask: ["He says: I enjoy it.", "يقول: أستمتع بذلك.", "Тој вели: ми е забавно.", "Es macht mir Spaß.", es-macht-mir-spass]
  - note: ["The Tafeln collect food shops can't sell and give it to people with little money; they run on volunteers. Volunteers who go with newcomers to offices are common — one helpful local can change how an appointment goes. Ask at the Tafel, the church or the town's volunteer agency.", "بنوك الطعام (Tafeln) تجمع طعامًا لا تستطيع المتاجر بيعه وتعطيه لذوي الدخل المحدود؛ وتعمل بالمتطوعين. والمتطوعون الذين يرافقون القادمين الجدد إلى الدوائر كثيرون — شخص محلي متعاون واحد قد يغيّر مسار موعد. اسأل في بنك الطعام أو الكنيسة أو مكتب التطوّع في المدينة.", "Tafeln собираат храна што продавниците не можат да ја продадат и ја даваат на луѓе со малку пари; работат со волонтери. Волонтери што ги придружуваат новодојдените во канцелариите се чести — еден услужлив локален човек може да го смени текот на терминот. Прашајте во Tafel, во црквата или во градската агенција за волонтери."]
