id: A2-22-e
tracks: [en]
protagonist: m
title: ["A date"]
situation: ["A first date with someone from your course. At the end comes the bill."]
learn: [a2-sollen]
culture: Splitting the bill
items:
  - [zusammen-oder-getrennt, "Zusammen oder getrennt?", "Together or separately?"]
  - [getrennt-bitte, "Getrennt, bitte", "Separately, please"]
  - [ich-lade-dich-ein, "Ich lade dich ein", "It's on me (I invite you)"]
  - [soll-ich, "Soll ich …?", "Shall I …?"]
  - [das-naechste-mal-du, "Das nächste Mal du", "Next time it's you"]
  - [der-abend, "der Abend", "the evening"]
  - [schoen-war-es, "Es war schön", "It was lovely"]
  - [wiedersehen, "wiedersehen", "see again"]
  - [schreib-mir, "Schreib mir!", "Text me!"]
  - [gerne-wieder, "gerne wieder", "happy to do it again"]
dialogue:
  - [kasse, "Zusammen oder getrennt?", "Together or separately?"]
  - [protagonist, "Soll ich bezahlen?", "Shall I pay?"]
  - [mia, "Getrennt, bitte. Das ist normal.", "Separately, please. That's normal."]
  - [protagonist, "Okay. Aber den Kaffee — ich lade dich ein.", "OK. But the coffee — it's on me."]
  - [mia, "Danke! Dann das nächste Mal ich.", "Thanks! Then next time it's me."]
  - [protagonist, "Es war ein schöner Abend.", "It was a lovely evening."]
  - [mia, "Ja, es war schön. Gerne wieder.", "Yes, it was lovely. Happy to do it again."]
  - [protagonist, "Wann sehen wir uns wieder?", "When will we see each other again?"]
  - [mia, "Schreib mir!", "Text me!"]
teach:
  - ask: ["The waiter asks: together or separately?", "Zusammen oder getrennt?", zusammen-oder-getrennt]
  - note: ["«sollen» asks what someone wants you to do: «Soll ich bezahlen?» — shall I pay? It also reports instructions: «Ich soll anrufen» — I'm supposed to call."]
  - ask: ["Ask: shall I pay?", "Soll ich bezahlen?", soll-ich]
  - ask: ["Say: separately, please.", "Getrennt, bitte.", getrennt-bitte]
  - ask: ["Say: it's on me.", "Ich lade dich ein.", ich-lade-dich-ein]
  - ask: ["Say: next time it's you.", "Das nächste Mal du.", das-naechste-mal-du]
  - ask: ["Say: it was a lovely evening.", "Es war ein schöner Abend.", der-abend, schoen-war-es]
  - ask: ["Say: happy to do it again.", "Gerne wieder.", gerne-wieder]
  - ask: ["Ask: when will we see each other again?", "Wann sehen wir uns wieder?", wiedersehen]
  - ask: ["Say: text me!", "Schreib mir!", schreib-mir]
  - note: ["Splitting the bill is normal even on dates, and waiters ask 'together or separately?'. Inviting is fine too — say «Ich lade dich ein» clearly, before the bill comes."]
