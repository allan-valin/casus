id: C1-17
protagonist: f
title: ["Buy or rent?", "الشراء أم الإيجار؟", "Да се купи или да се изнајмува?"]
situation:
  - "Rents keep rising. Could you buy a flat? Herr Vogel at the bank explains what a purchase really costs."
  - "الإيجارات ترتفع باستمرار. هل يمكنكِ شراء شقة؟ السيد فوغل في البنك يشرح كم يكلّف الشراء فعلًا."
  - "Кириите постојано растат. Дали би можеле да купите стан? Господин Фогел во банката објаснува колку навистина чини купувањето."
learn: [de-c1-nominal-genitive, de-c1-funktionsverbgefuege]
culture: The hidden costs of buying
items:
  - [der-kredit, "der Kredit", "the loan", "القرض", "кредитот"]
  - [die-zinsen, "die Zinsen", "the interest", "الفوائد", "каматата"]
  - [das-eigenkapital, "das Eigenkapital", "own capital, deposit", "رأس المال الخاص", "сопствениот капитал", {rare: true}]
  - [die-grunderwerbsteuer, "die Grunderwerbsteuer", "land transfer tax", "ضريبة نقل ملكية العقار", "данокот на промет на недвижности", {rare: true}]
  - [der-notar, "der Notar", "the notary", "كاتب العدل", "нотарот"]
  - [der-makler, "der Makler", "the estate agent", "السمسار", "агентот за недвижности"]
  - [die-kaufnebenkosten, "die Kaufnebenkosten", "the additional purchase costs", "تكاليف الشراء الإضافية", "дополнителните трошоци за купување", {rare: true}]
  - [die-tilgung, "die Tilgung", "repayment (of the loan)", "سداد أصل القرض", "отплатата", {rare: true}]
  - [die-finanzierung, "die Finanzierung", "the financing", "التمويل", "финансирањето"]
  - [auf-dem-land, "auf dem Land", "in the countryside", "في الريف", "на село"]
dialogue:
  - [bankberater, "Für die Finanzierung einer Wohnung brauchen Sie zuerst Eigenkapital.", "To finance a flat you first need your own capital.", "لتمويل شقة تحتاجين أولًا إلى رأس مال خاص.", "За финансирање на стан прво ви треба сопствен капитал."]
  - [protagonist, "Wie viel?", "How much?", "كم؟", "Колку?"]
  - [bankberater, "Mindestens die Kaufnebenkosten: Grunderwerbsteuer, Notar, Grundbuch und eventuell der Makler. Besser mehr.", "At least the additional purchase costs: land transfer tax, notary, land registry and possibly the agent. More is better.", "على الأقل تكاليف الشراء الإضافية: ضريبة نقل الملكية، كاتب العدل، السجل العقاري، وربما السمسار. والأفضل أكثر.", "Најмалку дополнителните трошоци: данок на промет, нотар, катастар и евентуално агент. Подобро повеќе."]
  - [protagonist, "Und der Rest ist ein Kredit?", "And the rest is a loan?", "والباقي قرض؟", "А остатокот е кредит?"]
  - [bankberater, "Genau. Die monatliche Rate besteht aus Zinsen und Tilgung. Die Höhe der Zinsen ändert sich mit dem Markt.", "Exactly. The monthly instalment is interest plus repayment. The interest level changes with the market.", "بالضبط. القسط الشهري يتكوّن من الفوائد وسداد أصل القرض. مستوى الفوائد يتغيّر مع السوق.", "Точно. Месечната рата се состои од камата и отплата. Висината на каматата се менува со пазарот."]
  - [protagonist, "In Leipzig ist alles teurer geworden.", "Everything has got more expensive in Leipzig.", "كل شيء صار أغلى في لايبزيغ.", "Во Лајпциг сè поскапе."]
  - [bankberater, "Auf dem Land und im Osten ist Eigentum noch deutlich günstiger. Aber prüfen Sie die Verkehrsanbindung.", "In the countryside and in the east, property is still considerably cheaper. But check the transport links.", "في الريف وفي الشرق لا تزال الملكية أرخص بكثير. لكن تحقّقي من المواصلات.", "На село и на исток имотот е сè уште значително поевтин. Но проверете го превозот."]
  - [protagonist, "Danke. Ich rechne erst einmal — und spare weiter.", "Thank you. I'll do the maths first — and keep saving.", "شكرًا. سأحسب أولًا — وأواصل الادّخار.", "Благодарам. Прво ќе пресметам — и ќе продолжам да штедам."]
teach:
  - ask: ["Say: the financing of a flat.", "قولي: تمويل شقة.", "Кажете: финансирањето на стан.", "Die Finanzierung einer Wohnung.", die-finanzierung]
  - ask: ["Say: you first need own capital.", "قولي: تحتاجين أولًا إلى رأس مال خاص.", "Кажете: прво треба сопствен капитал.", "Zuerst braucht man Eigenkapital.", das-eigenkapital]
  - note: ["Money German is nominal: «die Finanzierung einer Wohnung» (= financing a flat), «die Höhe der Zinsen» (= how high the interest is), «die Kaufnebenkosten» (= what you pay on top of the price).", "ألمانية المال اسمية: «die Finanzierung einer Wohnung» (= تمويل شقة)، «die Höhe der Zinsen» (= مقدار الفوائد)، «die Kaufnebenkosten» (= ما تدفعينه فوق السعر).", "Финансискиот германски е номинален: «die Finanzierung einer Wohnung» (= финансирање стан), «die Höhe der Zinsen» (= колку е висока каматата), «die Kaufnebenkosten» (= што плаќате над цената)."]
  - ask: ["Say: the additional purchase costs.", "قولي: تكاليف الشراء الإضافية.", "Кажете: дополнителните трошоци.", "Die Kaufnebenkosten.", die-kaufnebenkosten]
  - ask: ["Say: land transfer tax, notary, agent.", "قولي: ضريبة نقل الملكية، كاتب العدل، السمسار.", "Кажете: данок на промет, нотар, агент.", "Grunderwerbsteuer, Notar, Makler.", die-grunderwerbsteuer, der-notar, der-makler]
  - ask: ["Ask: and the rest is a loan?", "اسألي: والباقي قرض؟", "Прашајте: а остатокот е кредит?", "Und der Rest ist ein Kredit?", der-kredit]
  - ask: ["Say: interest and repayment.", "قولي: الفوائد وسداد أصل القرض.", "Кажете: камата и отплата.", "Zinsen und Tilgung.", die-zinsen, die-tilgung]
  - ask: ["Say: in the countryside it's cheaper.", "قولي: في الريف أرخص.", "Кажете: на село е поевтино.", "Auf dem Land ist es günstiger.", auf-dem-land]
  - note: ["Buying costs more than the price: land transfer tax (rate set by each state), notary and land registry, and often an estate agent. Banks expect you to pay at least these extra costs from your own money, better more. Property is far cheaper in the east and the countryside than in big western cities. Rates change constantly — compare offers from several banks.", "الشراء يكلّف أكثر من السعر: ضريبة نقل الملكية (تحدّد كل ولاية نسبتها)، وكاتب العدل والسجل العقاري، وغالبًا سمسار. والبنوك تتوقّع أن تدفعي على الأقل هذه التكاليف الإضافية من مالكِ، والأفضل أكثر. والعقارات أرخص بكثير في الشرق والريف منها في المدن الغربية الكبيرة. النسب تتغيّر باستمرار — قارني عروض عدة بنوك.", "Купувањето чини повеќе од цената: данок на промет на недвижности (стапката ја одредува секоја покраина), нотар и катастар, и често агент. Банките очекуваат барем овие дополнителни трошоци да ги платите од свои пари, подобро повеќе. Имотот е многу поевтин на исток и на село отколку во големите западни градови. Стапките постојано се менуваат — споредете понуди од повеќе банки."]
