id: C1-07
protagonist: f
title: ["The in-laws", "الأصهار", "Свршените роднини"]
situation:
  - "Svenja invites you along to her parents' for Sunday coffee. Three o'clock sharp, cake on the table."
  - "سفينيا تدعوكِ معها إلى والديها لقهوة الأحد. الساعة الثالثة تمامًا، والكعكة على الطاولة."
  - "Свења ве кани со неа кај нејзините родители на неделно кафе. Точно во три, колачот на масата."
learn: [c1-particles]
culture: German family visits
items:
  - [kaffee-und-kuchen, "Kaffee und Kuchen", "afternoon coffee and cake", "القهوة والكعك (عصرًا)", "кафе и колач"]
  - [die-schwiegereltern, "die Schwiegereltern", "the parents-in-law", "الأصهار", "свекор и свекрва / тест и тешта"]
  - [ja-mal, "ja mal", "(particle) just, for once", "(أداة) مرة، هيا", "(честичка) ајде, еднаш"]
  - [doch-mal-c1, "doch", "(particle) after all, do", "(أداة) ولكن، هيا", "(честичка) сепак, ајде"]
  - [wohl, "wohl", "(particle) probably", "(أداة) على الأرجح", "(честичка) веројатно"]
  - [selbst-gebacken, "selbst gebacken", "home-made (baked)", "من صنع البيت", "домашно печен"]
  - [der-sonntagskuchen, "der Pflaumenkuchen", "plum cake", "كعكة البرقوق", "колачот со сливи"]
  - [puenktlich-um, "pünktlich um drei", "at three sharp", "في الثالثة تمامًا", "точно во три"]
  - [nehmen-sie-doch, "Nehmen Sie doch noch ein Stück!", "Do have another piece!", "خذي قطعة أخرى!", "Земете уште едно парче!"]
  - [sich-verabschieden, "sich verabschieden", "say goodbye, take one's leave", "يستأذن، يودّع", "се поздравува, си заминува"]
dialogue:
  - [svenjamutter, "Kommen Sie doch rein! Sie sind ja pünktlich um drei.", "Do come in! You're right on time at three.", "تفضّلي بالدخول! أنتِ في الثالثة تمامًا.", "Повелете, влезете! Точно сте во три."]
  - [protagonist, "Vielen Dank für die Einladung. Hier sind Blumen.", "Thank you very much for the invitation. Here are some flowers.", "شكرًا جزيلًا على الدعوة. هذه زهور.", "Ви благодарам за поканата. Еве цвеќе."]
  - [svenjavater, "Setzen Sie sich. Es gibt Kaffee und Kuchen — Pflaumenkuchen, selbst gebacken.", "Sit down. There's coffee and cake — plum cake, home-made.", "اجلسي. هناك قهوة وكعك — كعكة برقوق، من صنع البيت.", "Седнете. Има кафе и колач — со сливи, домашен."]
  - [protagonist, "Der ist ja köstlich!", "That's delicious!", "إنها لذيذة جدًا!", "Овој е баш вкусен!"]
  - [svenjamutter, "Nehmen Sie doch noch ein Stück!", "Do have another piece!", "خذي قطعة أخرى!", "Земете уште едно парче!"]
  - [protagonist, "Gern. Bei uns müsste man mich dreimal bitten, aber hier sage ich lieber gleich ja.", "Gladly. With us you'd have to ask me three times, but here I'd rather say yes straight away.", "بكل سرور. عندنا يجب أن يُلحّ عليّ ثلاث مرات، لكن هنا أفضّل أن أقول نعم فورًا.", "Со задоволство. Кај нас би морале три пати да ме молат, но тука подобро веднаш велам да."]
  - [svenjavater, "Sie haben Deutschland wohl schon gut verstanden!", "You've probably understood Germany well already!", "على الأرجح فهمتِ ألمانيا جيدًا بالفعل!", "Веројатно веќе добро ја разбравте Германија!"]
  - [svenja, "Um sechs verabschieden wir uns. Meine Eltern essen um halb sieben.", "We'll take our leave at six. My parents have dinner at half past six.", "في السادسة نستأذن. والداي يتعشّيان في السادسة والنصف.", "Во шест се поздравуваме. Моите родители вечераат во шест и пол."]
teach:
  - ask: ["Say: coffee and cake.", "قولي: القهوة والكعك.", "Кажете: кафе и колач.", "Kaffee und Kuchen.", kaffee-und-kuchen]
  - ask: ["She says: you're right on time at three.", "تقول: أنتِ في الثالثة تمامًا.", "Таа вели: точно сте во три.", "Sie sind ja pünktlich um drei.", puenktlich-um]
  - note: ["Particles carry the tone: «Kommen Sie doch rein!» (do come in — warm), «Der ist ja köstlich!» (that's really delicious — surprise), «wohl» (probably), «schon» (already, surely). They're unstressed and almost untranslatable.", "الأدوات تحمل النبرة: «Kommen Sie doch rein!» (تفضّلي بالدخول — دفء)، «Der ist ja köstlich!» (إنها لذيذة حقًا — مفاجأة)، «wohl» (على الأرجح)، «schon» (بالفعل، بالتأكيد). لا تُشدَّد ويكاد يستحيل ترجمتها.", "Честичките го носат тонот: «Kommen Sie doch rein!» (повелете — топло), «Der ist ja köstlich!» (баш е вкусен — изненадување), «wohl» (веројатно), «schon» (веќе, сигурно). Ненагласени се и речиси непреводливи."]
  - ask: ["She says: do come in!", "تقول: تفضّلي بالدخول!", "Таа вели: повелете, влезете!", "Kommen Sie doch rein!", doch-mal-c1]
  - ask: ["Say: that's really delicious!", "قولي: إنها لذيذة حقًا!", "Кажете: баш е вкусен!", "Der ist ja köstlich!", ja-mal]
  - ask: ["She says: do have another piece!", "تقول: خذي قطعة أخرى!", "Таа вели: земете уште едно парче!", "Nehmen Sie doch noch ein Stück!", nehmen-sie-doch]
  - ask: ["Say: plum cake.", "قولي: كعكة البرقوق.", "Кажете: колач со сливи.", "Pflaumenkuchen.", der-sonntagskuchen]
  - ask: ["He says: you've probably understood Germany.", "يقول: على الأرجح فهمتِ ألمانيا.", "Тој вели: веројатно ја разбравте Германија.", "Sie haben Deutschland wohl verstanden.", wohl]
  - ask: ["He says: already well.", "يقول: جيدًا بالفعل.", "Тој вели: веќе добро.", "Schon gut.", schon]
  - ask: ["Say: home-made.", "قولي: من صنع البيت.", "Кажете: домашно печен.", "Selbst gebacken.", selbst-gebacken]
  - ask: ["Svenja: we'll take our leave at six.", "سفينيا: في السادسة نستأذن.", "Свења: во шест се поздравуваме.", "Um sechs verabschieden wir uns.", sich-verabschieden]
  - ask: ["Say: the parents-in-law.", "قولي: الأصهار.", "Кажете: свекор и свекрва.", "Die Schwiegereltern.", die-schwiegereltern]
  - note: ["A Sunday visit to a German family is often 'Kaffee und Kuchen' at three — punctual, with flowers or chocolates, and over before dinner. Second helpings are offered once; say yes if you want them. Leaving at the agreed time is polite, not cold.", "زيارة الأحد لعائلة ألمانية غالبًا «قهوة وكعك» في الثالثة — في الموعد، مع زهور أو شوكولاتة، وتنتهي قبل العشاء. القطعة الثانية تُعرض مرة واحدة؛ قولي نعم إن أردتِها. والمغادرة في الموعد المتّفق عليه أدب لا برود.", "Неделна посета на германско семејство често е „кафе и колач“ во три — точно, со цвеќе или чоколади, и завршува пред вечера. Второ парче се нуди еднаш; кажете да ако сакате. Заминувањето во договореното време е учтивост, не студенило."]
