id: B2-22-ea
tracks: [en, ar]
protagonist: m
title: ["The new boss", "المدير الجديد"]
situation:
  - "The firm was sold. Months ago you signed a paper 'acknowledging the change'. Now the health insurer sends a bill. Tim reads the papers with you."
  - "بيعت الشركة. قبل أشهر وقّعتَ ورقة «علمًا بالتغيير». الآن يرسل صندوق التأمين الصحي فاتورة. تيم يقرأ الأوراق معك."
learn: [b2-nominal-style]
culture: Never sign what you haven't read
items:
  - [der-betriebsuebergang, "der Betriebsübergang", "transfer of the business", "انتقال ملكية المنشأة", {rare: true}]
  - [die-kenntnisnahme, "zur Kenntnisnahme", "for acknowledgement", "للعلم", {rare: true}]
  - [unterschreiben-ohne, "ohne zu lesen unterschreiben", "sign without reading", "يوقّع دون قراءة"]
  - [die-vertragsaenderung, "die Vertragsänderung", "the change of contract", "تعديل العقد", {rare: true}]
  - [die-nachzahlung, "die Nachzahlung", "the back payment", "المبلغ المستحق المتأخر"]
  - [die-ratenzahlung, "die Ratenzahlung", "payment in instalments", "الدفع بالتقسيط"]
  - [das-arbeitsgericht, "das Arbeitsgericht", "the labour court", "محكمة العمل", {rare: true}]
  - [der-lohnrueckstand, "der Lohnrückstand", "wages in arrears", "الأجور المتأخرة", {rare: true}]
  - [die-pruefung-durch, "die Prüfung durch einen Anwalt", "a check by a lawyer", "مراجعة من محامٍ"]
  - [der-versicherungsstatus, "der Versicherungsstatus", "insurance status", "وضع التأمين", {rare: true}]
dialogue:
  - [protagonist, "Die Krankenkasse will eine Nachzahlung. Für sechs Monate!", "The health insurer wants a back payment. For six months!", "صندوق التأمين يطلب مبلغًا متأخرًا. عن ستة أشهر!"]
  - [tim, "Zeig mal. ... Hier: „Betriebsübergang — zur Kenntnisnahme“. Du hast unterschrieben.", "Show me. ... Here: 'Transfer of the business — for acknowledgement'. You signed.", "أرني. ... هنا: «انتقال ملكية المنشأة — للعلم». لقد وقّعت."]
  - [protagonist, "Der neue Chef sagte, das sei nur eine Formalität.", "The new boss said it was only a formality.", "المدير الجديد قال إنها مجرّد إجراء شكلي."]
  - [tim, "Auf Seite zwei steht eine Vertragsänderung: aus Vollzeit wurde ein Minijob. Damit endete dein Versicherungsstatus.", "Page two has a change of contract: full time became a minijob. That ended your insurance status.", "في الصفحة الثانية تعديل للعقد: تحوّل الدوام الكامل إلى عمل صغير. وبذلك انتهى وضع تأمينك."]
  - [protagonist, "Und der Lohn kam immer zu spät...", "And the wages always came late...", "والأجر كان يتأخّر دائمًا..."]
  - [tim, "Lohnrückstand ist ein Fall für das Arbeitsgericht. Aber zuerst: Prüfung durch einen Anwalt.", "Wages in arrears are a case for the labour court. But first: a check by a lawyer.", "الأجور المتأخرة قضية لمحكمة العمل. لكن أولًا: مراجعة من محامٍ."]
  - [protagonist, "Und die Krankenkasse? So viel Geld habe ich nicht.", "And the health insurer? I don't have that much money.", "وصندوق التأمين؟ ليس لديّ هذا المبلغ."]
  - [tim, "Ruf an und bitte um Ratenzahlung. Das geht fast immer. Und nie wieder ohne zu lesen unterschreiben!", "Call and ask for instalments. That almost always works. And never again sign without reading!", "اتصل واطلب الدفع بالتقسيط. هذا ممكن دائمًا تقريبًا. ولا توقّع أبدًا مرة أخرى دون قراءة!"]
teach:
  - ask: ["Say: the health insurer wants a back payment.", "قل: صندوق التأمين يطلب مبلغًا متأخرًا.", "Die Krankenkasse will eine Nachzahlung.", die-nachzahlung]
  - ask: ["Read: transfer of the business — for acknowledgement.", "اقرأ: انتقال ملكية المنشأة — للعلم.", "Betriebsübergang — zur Kenntnisnahme.", der-betriebsuebergang, die-kenntnisnahme]
  - note: ["Official papers pack actions into nouns: «zur Kenntnisnahme» (= so that you take note), «Vertragsänderung» (= the contract is changed), «Prüfung durch einen Anwalt» (= a lawyer checks it). Unpack them before you sign.", "الأوراق الرسمية تحشر الأفعال في أسماء: «zur Kenntnisnahme» (= لكي تأخذ علمًا)، «Vertragsänderung» (= العقد يتغيّر)، «Prüfung durch einen Anwalt» (= محامٍ يراجعه). فكّكها قبل أن توقّع."]
  - ask: ["Say: a change of contract.", "قل: تعديل العقد.", "Eine Vertragsänderung.", die-vertragsaenderung]
  - ask: ["Say: that ended my insurance status.", "قل: بذلك انتهى وضع تأميني.", "Damit endete mein Versicherungsstatus.", der-versicherungsstatus]
  - ask: ["Say: wages in arrears.", "قل: الأجور المتأخرة.", "Der Lohnrückstand.", der-lohnrueckstand]
  - ask: ["Say: the labour court.", "قل: محكمة العمل.", "Das Arbeitsgericht.", das-arbeitsgericht]
  - ask: ["Say: first a check by a lawyer.", "قل: أولًا مراجعة من محامٍ.", "Zuerst eine Prüfung durch einen Anwalt.", die-pruefung-durch]
  - ask: ["Ask the insurer for instalments.", "اطلب من صندوق التأمين التقسيط.", "Ich bitte um Ratenzahlung.", die-ratenzahlung]
  - ask: ["Never again sign without reading!", "لا توقّع أبدًا دون قراءة!", "Nie wieder ohne zu lesen unterschreiben!", unterschreiben-ohne]
  - note: ["Never sign what you haven't read and understood — 'only a formality' is a warning sign. A new owner takes over existing contracts unchanged; a change to your hours or insurance needs your signature, so ask what you are signing. If an insurer later claims contributions, ask for a payment plan (Ratenzahlung) — it is almost always granted. Unpaid wages can be claimed at the labour court; there are short deadlines, so get advice quickly (unions, lawyers, the Arbeitnehmerkammer in some states).", "لا توقّع أبدًا ما لم تقرأه وتفهمه — «مجرّد إجراء شكلي» علامة تحذير. المالك الجديد يتسلّم العقود القائمة دون تغيير؛ وأي تغيير في ساعاتك أو تأمينك يحتاج توقيعك، فاسأل عمّا توقّع عليه. وإذا طالب صندوق التأمين لاحقًا باشتراكات، فاطلب خطة تقسيط — تُمنح دائمًا تقريبًا. والأجور غير المدفوعة يمكن المطالبة بها في محكمة العمل؛ وهناك مهل قصيرة، فاطلب المشورة بسرعة (النقابات، المحامون)."]
