id: C2-14
protagonist: m
title: ["History, with care", "التاريخ بعناية", "Историјата, со грижа"]
situation:
  - "9 November. With Professor Hartmann you clean the Stolpersteine on your street — small brass plaques for people murdered by the Nazis."
  - "9 نوفمبر. مع البروفيسور هارتمان تنظّف «حجارة العثرة» في شارعك — لوحات نحاسية صغيرة لأناس قتلهم النازيون."
  - "9 ноември. Со професорот Хартман ги чистите Stolpersteine на вашата улица — мали месингани плочки за луѓе убиени од нацистите."
learn: [c2-register]
culture: Remembrance
items:
  - [der-stolperstein, "der Stolperstein", "Stolperstein ('stumbling stone' memorial)", "حجر العثرة (نصب تذكاري)", "Stolperstein (камен-спомен)"]
  - [das-gedenken, "das Gedenken", "remembrance", "إحياء الذكرى", "одбележувањето, сеќавањето"]
  - [die-verantwortung-c2, "die Verantwortung", "responsibility", "المسؤولية", "одговорноста"]
  - [deportiert, "deportiert", "deported", "رُحِّل", "депортиран"]
  - [ermordet, "ermordet", "murdered", "قُتل", "убиен"]
  - [die-pogromnacht, "die Pogromnacht", "the November pogrom (1938)", "ليلة البوغروم", "ноќта на погромот"]
  - [nie-wieder, "Nie wieder", "Never again", "لن يتكرّر أبدًا", "Никогаш повеќе"]
  - [die-erinnerungskultur, "die Erinnerungskultur", "the culture of remembrance", "ثقافة الذاكرة", "културата на сеќавање", {rare: true}]
  - [hier-wohnte, "Hier wohnte …", "Here lived …", "هنا عاش …", "Тука живееше …"]
  - [wuerdevoll, "würdevoll", "with dignity", "بوقار", "достоинствено"]
dialogue:
  - [hartmann, "„Hier wohnte Clara Rosenthal, Jahrgang 1921, deportiert 1942, ermordet in Auschwitz.“", "'Here lived Clara Rosenthal, born 1921, deported 1942, murdered in Auschwitz.'", "«هنا عاشت كلارا روزنتال، مواليد 1921، رُحِّلت 1942، قُتلت في أوشفيتز.»", "„Тука живееше Клара Розентал, родена 1921, депортирана 1942, убиена во Аушвиц.“"]
  - [protagonist, "Sie war jünger als ich, als sie starb.", "She was younger than me when she died.", "كانت أصغر مني حين ماتت.", "Беше помлада од мене кога умре."]
  - [hartmann, "Darum putzen wir heute die Steine. Am 9. November 1938 war die Pogromnacht.", "That's why we clean the stones today. 9 November 1938 was the night of the pogrom.", "لهذا ننظّف الحجارة اليوم. في 9 نوفمبر 1938 كانت ليلة البوغروم.", "Затоа денес ги чистиме каменчињата. На 9 ноември 1938 беше ноќта на погромот."]
  - [protagonist, "Warum liegen sie im Boden, wo man darauf tritt?", "Why do they lie in the ground, where people step on them?", "لماذا هي في الأرض حيث يدوس الناس عليها؟", "Зошто се во земјата, каде што се гази по нив?"]
  - [hartmann, "Wer sie lesen will, muss sich verbeugen. Das ist die Idee.", "Whoever wants to read them has to bow. That's the idea.", "من يريد قراءتها عليه أن ينحني. هذه هي الفكرة.", "Кој сака да ги прочита, мора да се поклони. Тоа е идејата."]
  - [protagonist, "Ist das nicht schwer — für Deutsche, für alle?", "Isn't that hard — for Germans, for everyone?", "أليس هذا صعبًا — على الألمان، على الجميع؟", "Зарем не е тешко — за Германците, за сите?"]
  - [hartmann, "Schuld erben wir nicht. Aber Verantwortung. „Nie wieder“ gilt auch für Sie und Ihre Kinder.", "We don't inherit guilt. But responsibility. 'Never again' applies to you and your children too.", "نحن لا نرث الذنب. لكننا نرث المسؤولية. «لن يتكرّر أبدًا» ينطبق عليك وعلى أطفالك أيضًا.", "Вината не ја наследуваме. Но одговорноста да. „Никогаш повеќе“ важи и за вас и вашите деца."]
  - [protagonist, "Dann komme ich nächstes Jahr wieder — mit einer Rose.", "Then I'll come again next year — with a rose.", "إذن سأعود العام القادم — بوردة.", "Тогаш ќе дојдам пак следната година — со роза."]
teach:
  - ask: ["Read the plaque: here lived…", "اقرأ اللوحة: هنا عاش…", "Прочитајте ја плочката: тука живееше…", "Hier wohnte…", hier-wohnte]
  - ask: ["Say: deported, murdered.", "قل: رُحِّلت، قُتلت.", "Кажете: депортирана, убиена.", "Deportiert, ermordet.", deportiert, ermordet]
  - ask: ["Say: the Stolpersteine.", "قل: حجارة العثرة.", "Кажете: Stolpersteine.", "Die Stolpersteine.", der-stolperstein]
  - ask: ["Say: the November pogrom.", "قل: ليلة البوغروم.", "Кажете: ноќта на погромот.", "Die Pogromnacht.", die-pogromnacht]
  - note: ["Remembrance has its own careful register: plain facts («deportiert 1942, ermordet in Auschwitz»), no jokes, no comparisons, and the distinction «Schuld» (guilt) vs «Verantwortung» (responsibility).", "لإحياء الذكرى أسلوب حذر خاص: وقائع بسيطة («deportiert 1942, ermordet in Auschwitz»)، بلا نكات ولا مقارنات، مع التمييز بين «Schuld» (الذنب) و«Verantwortung» (المسؤولية).", "Сеќавањето има свој внимателен регистар: прости факти («deportiert 1942, ermordet in Auschwitz»), без шеги, без споредби, и разликата «Schuld» (вина) и «Verantwortung» (одговорност)."]
  - ask: ["Say: remembrance.", "قل: إحياء الذكرى.", "Кажете: сеќавањето.", "Das Gedenken.", das-gedenken]
  - ask: ["Say: we inherit responsibility, not guilt.", "قل: نرث المسؤولية لا الذنب.", "Кажете: наследуваме одговорност, не вина.", "Wir erben Verantwortung, nicht Schuld.", die-verantwortung-c2]
  - ask: ["Say: never again.", "قل: لن يتكرّر أبدًا.", "Кажете: никогаш повеќе.", "Nie wieder.", nie-wieder]
  - ask: ["Say: the culture of remembrance.", "قل: ثقافة الذاكرة.", "Кажете: културата на сеќавање.", "Die Erinnerungskultur.", die-erinnerungskultur]
  - ask: ["Say: with dignity.", "قل: بوقار.", "Кажете: достоинствено.", "Würdevoll.", wuerdevoll]
  - note: ["Stolpersteine, set by the artist Gunter Demnig since 1992, mark the last chosen home of people persecuted by the Nazis — Jews above all, also Sinti and Roma, the disabled, political opponents and others. Over 100,000 lie across Europe. On 9 November and 27 January many people clean them and lay flowers or candles.", "حجارة العثرة، التي يضعها الفنان غونتر ديمنيغ منذ 1992، تُعلّم آخر مسكن اختاره أناس اضطهدهم النازيون — اليهود قبل الجميع، وأيضًا السنتي والروما وذوو الإعاقة والمعارضون السياسيون وغيرهم. أكثر من 100,000 منها في أنحاء أوروبا. وفي 9 نوفمبر و27 يناير ينظّفها كثيرون ويضعون الزهور أو الشموع.", "Stolpersteine, што ги поставува уметникот Гунтер Демниг од 1992, го означуваат последниот избран дом на луѓе прогонувани од нацистите — пред сè Евреи, но и Синти и Роми, лица со попреченост, политички противници и други. Над 100 000 има низ Европа. На 9 ноември и 27 јануари многумина ги чистат и оставаат цвеќе или свеќи."]
