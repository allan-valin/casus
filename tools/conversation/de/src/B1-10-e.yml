id: B1-10-e
tracks: [en]
protagonist: m
title: ["No benefits for students"]
situation: ["Your café cuts your hours. Can you get benefits? Mia explains what helps students instead."]
learn: [b1-weil-obwohl]
culture: What helps students
items:
  - [das-buergergeld, "das Bürgergeld", "basic income support", {rare: true}]
  - [studierende, "Studierende", "students"]
  - [obwohl, "obwohl", "although (verb to the end)"]
  - [keinen-anspruch, "keinen Anspruch", "no entitlement"]
  - [das-wohngeld, "das Wohngeld", "housing benefit", {rare: true}]
  - [das-studentenwerk, "das Studentenwerk", "the student services"]
  - [die-sozialberatung, "die Sozialberatung", "social counselling", {rare: true}]
  - [ein-nothilfefonds, "ein Notfonds", "an emergency fund"]
  - [weniger-stunden, "weniger Stunden", "fewer hours"]
  - [die-miete-zahlen, "die Miete zahlen", "pay the rent"]
dialogue:
  - [protagonist, "Das Café gibt mir weniger Stunden. Wie soll ich die Miete zahlen?", "The café's giving me fewer hours. How am I meant to pay the rent?"]
  - [mia, "Oh nein. Bekommst du Bürgergeld?", "Oh no. Do you get basic income support?"]
  - [protagonist, "Ich glaube nicht, obwohl ich hier wohne.", "I don't think so, although I live here."]
  - [mia, "Stimmt. Studierende haben meistens keinen Anspruch darauf.", "Right. Students mostly have no entitlement to it."]
  - [protagonist, "Und Wohngeld?", "And housing benefit?"]
  - [mia, "Auch schwierig. Geh zur Sozialberatung vom Studentenwerk.", "Also difficult. Go to the student services' social counselling."]
  - [protagonist, "Was machen die?", "What do they do?"]
  - [mia, "Sie kennen Notfonds, Stipendien und Jobs. Sie helfen dir, obwohl alles kompliziert ist.", "They know emergency funds, scholarships and jobs. They help you, even though it's all complicated."]
teach:
  - ask: ["Say: they're giving me fewer hours.", "Sie geben mir weniger Stunden.", weniger-stunden]
  - ask: ["Ask: how am I meant to pay the rent?", "Wie soll ich die Miete zahlen?", die-miete-zahlen]
  - ask: ["Say: basic income support.", "Das Bürgergeld.", das-buergergeld]
  - note: ["«obwohl» (although) sends the verb to the end, like «weil»: «obwohl ich hier wohne»."]
  - ask: ["Say: although I live here.", "Obwohl ich hier wohne.", obwohl]
  - ask: ["Say: students have no entitlement.", "Studierende haben keinen Anspruch.", studierende, keinen-anspruch]
  - ask: ["Say: housing benefit.", "Das Wohngeld.", das-wohngeld]
  - ask: ["Say: the student services' social counselling.", "Die Sozialberatung vom Studentenwerk.", die-sozialberatung, das-studentenwerk]
  - ask: ["Say: an emergency fund.", "Ein Notfonds.", ein-nothilfefonds]
  - note: ["Students are generally excluded from basic income support (Bürgergeld) and often from housing benefit, and for non-EU students claiming benefits can affect the residence permit. What helps: the Studentenwerk's social counselling, emergency funds, scholarships and job boards. Check the current rules."]
