id: C1-22
protagonist: m
title: ["Inheritance", "الإرث", "Наследство"]
situation:
  - "Frau Becker has been to the notary to make her will. Over coffee she tells you what the notary explained."
  - "السيدة بيكر ذهبت إلى كاتب العدل لتكتب وصيتها. على القهوة تحكي لك ما شرحه كاتب العدل."
  - "Госпоѓа Бекер била кај нотар за да го состави тестаментот. На кафе ви раскажува што ѝ објаснил нотарот."
learn: [de-c1-konj1-past, de-c1-konj1-substitute]
culture: Wills and the compulsory share
items:
  - [das-testament, "das Testament", "the will", "الوصية", "тестаментот"]
  - [die-erbschaft, "die Erbschaft", "the inheritance", "الإرث", "наследството"]
  - [erben, "erben", "inherit", "يرث", "наследува"]
  - [der-erbe, "der Erbe / die Erbin", "the heir", "الوريث", "наследникот"]
  - [der-pflichtteil, "der Pflichtteil", "the compulsory share", "الحصة الإلزامية", "задолжителниот дел", {rare: true}]
  - [die-gesetzliche-erbfolge, "die gesetzliche Erbfolge", "statutory succession", "الإرث القانوني", "законскиот наследен ред", {rare: true}]
  - [handschriftlich, "handschriftlich", "handwritten", "بخط اليد", "рачно напишан"]
  - [der-nachlass, "der Nachlass", "the estate", "التركة", "оставината", {rare: true}]
  - [er-sagte-es-gebe, "er sagte, es gebe …", "he said there was …", "قال إنه يوجد …", "рече дека има …"]
  - [vererben-c1, "vermachen", "bequeath", "يوصي بـ", "остава во аманет"]
dialogue:
  - [becker, "Ich war beim Notar. Mit sechzig sollte man ein Testament haben.", "I went to the notary. At sixty you should have a will.", "ذهبتُ إلى كاتب العدل. في الستين يجب أن تكون للمرء وصية.", "Бев кај нотар. На шеесет години треба да имаш тестамент."]
  - [protagonist, "Braucht man dafür einen Notar?", "Do you need a notary for that?", "هل يحتاج ذلك إلى كاتب عدل؟", "Дали за тоа треба нотар?"]
  - [becker, "Nein. Er sagte, ein handschriftliches Testament sei auch gültig — ganz mit der Hand geschrieben und unterschrieben.", "No. He said a handwritten will is also valid — written entirely by hand and signed.", "لا. قال إنّ الوصية المكتوبة بخط اليد صالحة أيضًا — مكتوبة كلها باليد وموقَّعة.", "Не. Рече дека и рачно напишан тестамент е важечки — целиот напишан со рака и потпишан."]
  - [protagonist, "Und kann man alles vermachen, wem man will?", "And can you leave everything to whoever you want?", "وهل يمكن أن يوصي المرء بكل شيء لمن يشاء؟", "А може ли да се остави сè на кого сакаш?"]
  - [becker, "Fast. Er sagte, es gebe einen Pflichtteil für die Kinder. Den bekommen sie immer.", "Almost. He said there's a compulsory share for the children. They always get that.", "تقريبًا. قال إنّ هناك حصة إلزامية للأولاد. يحصلون عليها دائمًا.", "Речиси. Рече дека постои задолжителен дел за децата. Тој секогаш го добиваат."]
  - [protagonist, "Und ohne Testament?", "And without a will?", "وبلا وصية؟", "А без тестамент?"]
  - [becker, "Dann gilt die gesetzliche Erbfolge. Ehepartner und Kinder erben zuerst.", "Then statutory succession applies. Spouses and children inherit first.", "عندها يسري الإرث القانوني. الزوج والأولاد يرثون أولًا.", "Тогаш важи законскиот наследен ред. Брачниот другар и децата наследуваат први."]
  - [protagonist, "Bei uns regelt das oft die Familie, ohne Papier.", "With us the family often settles it, without paper.", "عندنا كثيرًا ما تنظّم العائلة ذلك، بلا أوراق.", "Кај нас тоа често го решава семејството, без хартија."]
  - [becker, "Und genau das führt hier oft zu Streit. Mein Fahrrad bekommst übrigens du!", "And that's exactly what often leads to quarrels here. By the way, you're getting my bike!", "وهذا بالضبط ما يؤدّي هنا غالبًا إلى الخلاف. بالمناسبة، دراجتي ستكون لك!", "А токму тоа тука често води до кавги. Патем, мојот велосипед е твој!"]
teach:
  - ask: ["Say: a will.", "قل: وصية.", "Кажете: тестамент.", "Ein Testament.", das-testament]
  - ask: ["Ask: do you need a notary?", "اسأل: هل يحتاج ذلك إلى كاتب عدل؟", "Прашајте: дали треба нотар?", "Braucht man einen Notar?", der-notar]
  - note: ["Reporting what the notary said, Konjunktiv I: «Er sagte, ein handschriftliches Testament sei gültig», «es gebe einen Pflichtteil». Becker keeps the source clear — it's the notary's word.", "نقل ما قاله كاتب العدل بصيغة Konjunktiv I: «Er sagte, ein handschriftliches Testament sei gültig»، «es gebe einen Pflichtteil». بيكر توضّح المصدر — إنه كلام كاتب العدل.", "Пренесување што рекол нотарот, Konjunktiv I: «Er sagte, ein handschriftliches Testament sei gültig», «es gebe einen Pflichtteil». Бекер го држи изворот јасен — тоа е зборот на нотарот."]
  - ask: ["Report: a handwritten will is valid.", "انقل: الوصية بخط اليد صالحة.", "Пренесете: рачно напишан тестамент е важечки.", "Ein handschriftliches Testament sei gültig.", handschriftlich]
  - ask: ["Report: there's a compulsory share.", "انقل: هناك حصة إلزامية.", "Пренесете: постои задолжителен дел.", "Es gebe einen Pflichtteil.", er-sagte-es-gebe, der-pflichtteil]
  - ask: ["Ask: can you leave everything to whoever you want?", "اسأل: هل يمكن الإيصاء بكل شيء لمن يشاء؟", "Прашајте: може ли да се остави сè на кого сакаш?", "Kann man alles vermachen, wem man will?", vererben-c1]
  - ask: ["Say: statutory succession.", "قل: الإرث القانوني.", "Кажете: законскиот наследен ред.", "Die gesetzliche Erbfolge.", die-gesetzliche-erbfolge]
  - ask: ["Say: children inherit first.", "قل: الأولاد يرثون أولًا.", "Кажете: децата наследуваат први.", "Kinder erben zuerst.", erben]
  - ask: ["Say: the heir.", "قل: الوريث.", "Кажете: наследникот.", "Der Erbe.", der-erbe]
  - ask: ["Say: the inheritance and the estate.", "قل: الإرث والتركة.", "Кажете: наследството и оставината.", "Die Erbschaft und der Nachlass.", die-erbschaft, der-nachlass]
  - note: ["A will is valid if handwritten entirely by you and signed, or made at a notary (safer, registered centrally). Children and spouse always keep a compulsory share (Pflichtteil). Without a will, statutory succession applies. Inheritance tax applies only above generous allowances for close family. For property abroad, foreign law may apply — ask a notary.", "الوصية صالحة إذا كتبتها كلها بخط يدك ووقّعتها، أو حرّرتها عند كاتب عدل (أكثر أمانًا، وتُسجَّل مركزيًا). ويحتفظ الأولاد والزوج دائمًا بحصة إلزامية. وبلا وصية يسري الإرث القانوني. ولا تُفرض ضريبة الإرث إلا فوق إعفاءات سخية للعائلة القريبة. وللعقارات في الخارج قد يسري القانون الأجنبي — اسأل كاتب عدل.", "Тестаментот е важечки ако е целиот рачно напишан и потпишан од вас, или составен кај нотар (посигурно, централно регистрирано). Децата и брачниот другар секогаш го задржуваат задолжителниот дел. Без тестамент важи законскиот ред. Данок на наследство има само над големи ослободувања за блиско семејство. За имот во странство може да важи странско право — прашајте нотар."]
