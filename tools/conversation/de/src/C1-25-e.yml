id: C1-25-e
tracks: [en]
protagonist: f
title: ["Self-determination"]
situation: ["Priya tells you about her cousin at home, who was not allowed to choose — and about what she learned here."]
learn: [c1-nominal-style]
culture: Women's rights — where to get help
items:
  - [die-gleichberechtigung, "die Gleichberechtigung", "equal rights"]
  - [die-selbstbestimmung, "die Selbstbestimmung", "self-determination"]
  - [das-opfer, "das Opfer", "the victim"]
  - [die-schuld, "die Schuld", "the blame, guilt"]
  - [die-zwangsheirat, "die Zwangsheirat", "forced marriage", {rare: true}]
  - [das-hilfetelefon, "das Hilfetelefon", "the helpline", {rare: true}]
  - [das-frauenhaus, "das Frauenhaus", "the women's shelter", {rare: true}]
  - [anonym, "anonym", "anonymous"]
  - [die-entscheidung-ueber, "die Entscheidung über das eigene Leben", "the decision about one's own life"]
  - [niemand-darf, "niemand darf …", "no one may …"]
dialogue:
  - [priya, "Meine Cousine durfte nicht studieren. Die Familie hat ihren Mann ausgesucht.", "My cousin wasn't allowed to study. The family chose her husband."]
  - [protagonist, "Das ist schlimm. Wollte sie das?", "That's terrible. Did she want that?"]
  - [priya, "Niemand hat sie gefragt. Und wenn etwas schiefging, gab man ihr die Schuld.", "No one asked her. And when something went wrong, she was blamed."]
  - [protagonist, "Aber sie ist das Opfer, nicht die Schuldige.", "But she's the victim, not the guilty one."]
  - [priya, "Hier habe ich gelernt: Die Entscheidung über das eigene Leben ist ein Recht. Selbstbestimmung.", "Here I learned: the decision about your own life is a right. Self-determination."]
  - [protagonist, "Und Gleichberechtigung steht im Grundgesetz.", "And equal rights are in the Basic Law."]
  - [priya, "Wenn eine Freundin hier Hilfe braucht: Es gibt ein Hilfetelefon, anonym und in vielen Sprachen.", "If a friend here needs help: there's a helpline, anonymous and in many languages."]
  - [protagonist, "Und Frauenhäuser, falls sie nicht nach Hause kann. Niemand darf sie zwingen.", "And women's shelters, if she can't go home. No one may force her."]
teach:
  - ask: ["Say: equal rights.", "Die Gleichberechtigung.", die-gleichberechtigung]
  - ask: ["Say: self-determination.", "Die Selbstbestimmung.", die-selbstbestimmung]
  - note: ["Rights are named with nouns: «die Entscheidung über das eigene Leben» (= deciding about your own life), «die Selbstbestimmung», «die Gleichberechtigung». They're the words used by counselling services and the law."]
  - ask: ["Say: the decision about your own life is a right.", "Die Entscheidung über das eigene Leben ist ein Recht.", die-entscheidung-ueber]
  - ask: ["Say: she's the victim, not the guilty one.", "Sie ist das Opfer, nicht die Schuldige.", das-opfer, die-schuld]
  - ask: ["Say: forced marriage.", "Die Zwangsheirat.", die-zwangsheirat]
  - ask: ["Say: a helpline, anonymous.", "Ein Hilfetelefon, anonym.", das-hilfetelefon, anonym]
  - ask: ["Say: the women's shelter.", "Das Frauenhaus.", das-frauenhaus]
  - ask: ["Say: no one may force her.", "Niemand darf sie zwingen.", niemand-darf]
  - note: ["In Germany forced marriage is a crime, and every adult decides alone about marriage, study, work and religion. The 'Hilfetelefon Gewalt gegen Frauen' (116 016) is free, anonymous and available day and night in many languages; women's shelters take women and their children in at short notice. In an emergency: 110."]
