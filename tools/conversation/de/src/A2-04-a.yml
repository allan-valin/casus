id: A2-04-a
tracks: [ar]
protagonist: m
title: ["المعيشة"]
situation: ["يوناس، جارك، يسأل كيف تعيش العائلة من راتب واحد."]
learn: [a2-weil]
culture: One salary, a family
items:
  - [das-gehalt, "das Gehalt", "الراتب"]
  - [weil, "weil", "لأنّ (الفعل في الآخر)"]
  - [reicht, "reicht", "يكفي"]
  - [die-miete, "die Miete", "الإيجار"]
  - [das-kindergeld, "das Kindergeld", "إعانة الأطفال"]
  - [meine-frau-lernt, "meine Frau lernt", "زوجتي تتعلّم"]
  - [spaeter-arbeiten, "später arbeiten", "تعمل لاحقًا"]
  - [sparen, "sparen", "يوفّر"]
  - [teuer, "teuer", "غالٍ"]
  - [kollege, "der Kollege", "الزميل"]
dialogue:
  - [jonas, "Reicht dein Gehalt für die ganze Familie?", "هل يكفي راتبك للعائلة كلها؟"]
  - [protagonist, "Ja, weil die Blaue Karte gut bezahlt ist.", "نعم، لأن عمل البطاقة الزرقاء أجره جيد."]
  - [jonas, "Und die Miete? Leipzig wird teuer.", "والإيجار؟ لايبزيغ تصبح غالية."]
  - [protagonist, "Die Miete ist hoch. Aber wir bekommen Kindergeld.", "الإيجار مرتفع. لكننا نحصل على إعانة الأطفال."]
  - [jonas, "Arbeitet deine Frau?", "هل تعمل زوجتك؟"]
  - [protagonist, "Noch nicht. Meine Frau lernt Deutsch. Sie will später arbeiten.", "ليس بعد. زوجتي تتعلم الألمانية. تريد أن تعمل لاحقًا."]
  - [jonas, "Und ihr spart?", "وهل توفّرون؟"]
  - [protagonist, "Ein bisschen. Weil wir Familie in Syrien unterstützen.", "قليلًا. لأننا ندعم العائلة في سوريا."]
teach:
  - ask: ["اسأل: هل يكفي الراتب؟", "Reicht das Gehalt?", das-gehalt, reicht]
  - note: ["«weil» (لأنّ) ترسل الفعل إلى آخر الجملة: «weil die Blaue Karte gut bezahlt ist»."]
  - ask: ["قل: لأن الأجر جيد.", "Weil sie gut bezahlt ist.", weil]
  - ask: ["قل: الإيجار مرتفع.", "Die Miete ist hoch.", die-miete]
  - ask: ["قل: لايبزيغ تصبح غالية.", "Leipzig wird teuer.", teuer]
  - ask: ["قل: نحصل على إعانة الأطفال.", "Wir bekommen Kindergeld.", das-kindergeld]
  - ask: ["قل: زوجتي تتعلم الألمانية.", "Meine Frau lernt Deutsch.", meine-frau-lernt]
  - ask: ["قل: تريد أن تعمل لاحقًا.", "Sie will später arbeiten.", spaeter-arbeiten]
  - ask: ["قل: نوفّر قليلًا.", "Wir sparen ein bisschen.", sparen]
  - ask: ["قل: زميلي.", "Mein Kollege.", kollege]
  - note: ["لمّ شمل العائلة يتطلب عادةً دخلًا يكفي العائلة وسكنًا مناسبًا. والإعانات مثل إعانة الأطفال لها شروط — لا أرقام هنا: تحقّق من «Familienkasse» ومن دائرة الأجانب."]
