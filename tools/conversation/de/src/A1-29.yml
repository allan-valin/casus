id: A1-29
protagonist: f
title: ["The heating is broken", "التدفئة معطّلة", "Греењето не работи"]
situation:
  - "Saturday, minus eight, and the radiators are cold. You call the property management."
  - "يوم السبت، ثماني درجات تحت الصفر، والمدافئ باردة. تتصلين بإدارة العقار."
  - "Сабота, минус осум, а радијаторите се ладни. Се јавувате во управата на зградата."
learn: [a1-modal-infinitive]
culture: The landlord's duty
items:
  - [kaputt, "kaputt", "broken", "معطّل", "расипано"]
  - [die-hausverwaltung, "die Hausverwaltung", "the property management", "إدارة العقار", "управата на зградата", {rare: true}]
  - [kalt-in-der-wohnung, "kalt in der Wohnung", "cold in the flat", "بارد في الشقة", "ладно во станот"]
  - [seit-heute-morgen, "seit heute Morgen", "since this morning", "منذ صباح اليوم", "од утрово"]
  - [der-handwerker, "der Handwerker", "the repairman", "الفني، الحرفي", "мајсторот"]
  - [kann-kommen, "kann … kommen", "can come", "يمكنه أن يأتي", "може да дојде"]
  - [das-ist-zu-spaet, "Das ist zu spät", "That's too late", "هذا متأخر جدًا", "Тоа е предоцна"]
  - [der-notdienst, "der Notdienst", "the emergency service", "خدمة الطوارئ", "дежурната служба", {rare: true}]
  - [ich-muss-warten, "ich muss warten", "I have to wait", "يجب أن أنتظر", "морам да чекам"]
  - [die-nummer, "die Nummer", "the number", "الرقم", "бројот"]
dialogue:
  - [verwaltung, "Hausverwaltung Meyer, guten Tag.", "Meyer Property Management, good morning.", "إدارة عقارات ماير، نهارك سعيد.", "Управа Мајер, добар ден."]
  - [protagonist, "Guten Tag. Die Heizung ist kaputt. Es ist sehr kalt in der Wohnung.", "Good morning. The heating is broken. It's very cold in the flat.", "نهارك سعيد. التدفئة معطّلة. الجو بارد جدًا في الشقة.", "Добар ден. Греењето е расипано. Многу е ладно во станот."]
  - [verwaltung, "Seit wann?", "Since when?", "منذ متى؟", "Од кога?"]
  - [protagonist, "Seit heute Morgen.", "Since this morning.", "منذ صباح اليوم.", "Од утрово."]
  - [verwaltung, "Der Handwerker kann am Montag kommen.", "The repairman can come on Monday.", "الفني يمكنه أن يأتي يوم الاثنين.", "Мајсторот може да дојде во понеделник."]
  - [protagonist, "Am Montag? Das ist zu spät! Es sind minus acht Grad.", "On Monday? That's too late! It's minus eight.", "يوم الاثنين؟ هذا متأخر جدًا! الحرارة ثماني درجات تحت الصفر.", "Во понеделник? Тоа е предоцна! Минус осум е."]
  - [verwaltung, "Dann rufen Sie den Notdienst an. Ich gebe Ihnen die Nummer.", "Then call the emergency service. I'll give you the number.", "إذن اتصلي بخدمة الطوارئ. سأعطيك الرقم.", "Тогаш јавете се на дежурната служба. Ќе ви го дадам бројот."]
  - [protagonist, "Muss ich etwas bezahlen?", "Do I have to pay anything?", "هل يجب أن أدفع شيئًا؟", "Морам ли нешто да платам?"]
  - [verwaltung, "Nein, die Heizung ist Sache des Vermieters.", "No, the heating is the landlord's responsibility.", "لا، التدفئة من مسؤولية المؤجِّر.", "Не, греењето е обврска на сопственикот на станот."]
teach:
  - ask: ["Say: the heating is broken.", "قولي: التدفئة معطّلة.", "Кажете: греењето е расипано.", "Die Heizung ist kaputt.", kaputt, die-heizung]
  - ask: ["Say: it's very cold in the flat.", "قولي: الجو بارد جدًا في الشقة.", "Кажете: многу е ладно во станот.", "Es ist sehr kalt in der Wohnung.", kalt-in-der-wohnung]
  - ask: ["Say: since this morning.", "قولي: منذ صباح اليوم.", "Кажете: од утрово.", "Seit heute Morgen.", seit-heute-morgen]
  - ask: ["Say: the property management.", "قولي: إدارة العقار.", "Кажете: управата на зградата.", "Die Hausverwaltung.", die-hausverwaltung]
  - note: ["Modal verbs send the main verb to the end: «Der Handwerker kann am Montag kommen», «Ich muss warten».", "الأفعال المساعدة ترسل الفعل الأساسي إلى آخر الجملة: «Der Handwerker kann am Montag kommen»، «Ich muss warten».", "Модалните глаголи го праќаат главниот глагол на крајот: «Der Handwerker kann am Montag kommen», «Ich muss warten»."]
  - ask: ["He says: the repairman can come on Monday.", "يقول: الفني يمكنه أن يأتي يوم الاثنين.", "Тој вели: мајсторот може да дојде во понеделник.", "Der Handwerker kann am Montag kommen.", der-handwerker, kann-kommen, am-montag]
  - ask: ["Say: that's too late!", "قولي: هذا متأخر جدًا!", "Кажете: тоа е предоцна!", "Das ist zu spät!", das-ist-zu-spaet]
  - ask: ["Say: I can't wait. (I have to wait? No!)", "قولي: يجب أن أنتظر؟ لا!", "Кажете: морам да чекам? Не!", "Ich muss warten? Nein!", ich-muss-warten]
  - ask: ["He says: call the emergency service.", "يقول: اتصلي بخدمة الطوارئ.", "Тој вели: јавете се на дежурната служба.", "Rufen Sie den Notdienst an.", der-notdienst]
  - ask: ["He gives you the number. Say: the number.", "يعطيك الرقم. قولي: الرقم.", "Ви го дава бројот. Кажете: бројот.", "Die Nummer.", die-nummer]
  - note: ["Heating in winter is the landlord's duty; outside office hours property managers name an emergency service. Report defects in writing too, by e-mail — it counts later if the rent is reduced.", "التدفئة في الشتاء من واجب المؤجِّر؛ وخارج ساعات العمل تعطي إدارات العقار رقم خدمة طوارئ. أبلغي عن العطل كتابيًا أيضًا، بالبريد الإلكتروني — فهذا يُعتدّ به لاحقًا إن خُفّض الإيجار.", "Греењето во зима е обврска на сопственикот на станот; надвор од работното време управите даваат дежурна служба. Пријавете го дефектот и писмено, по е-пошта — тоа се смета подоцна ако се намалува киријата."]
