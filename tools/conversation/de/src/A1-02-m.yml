id: A1-02-m
tracks: [mk]
protagonist: m
title: ["Градинката"]
situation: ["Прв пат сами го земате внукот Лука од градинката (Kita). Ве пречекува воспитувачката."]
learn: [a1-article]
culture: The Kita
items:
  - [der-opa, "der Opa", "дедото"]
  - [ich-hole-ab, "ich hole … ab", "доаѓам да го земам (некого)"]
  - [die-kita, "die Kita", "градинката (Kita)"]
  - [die-erzieherin, "die Erzieherin", "воспитувачката"]
  - [ist-da, "… ist da", "… е тука, дојде"]
  - [hallo, "Hallo", "Здраво"]
  - [mein-schatz, "mein Schatz", "душо моја, срце мое"]
  - [der-ausweis, "der Ausweis", "личната карта / документот"]
  - [hier, "hier", "тука, еве"]
  - [die-mama-hat-gesagt, "die Mama hat es gesagt", "мама кажа"]
  - [tschuess, "Tschüss!", "Чао!"]
  - [bis-morgen, "Bis morgen!", "До утре!"]
  - [das-ist, "Das ist …", "Ова е …"]
dialogue:
  - [kruger, "Guten Tag! Kann ich Ihnen helfen?", "Добар ден! Можам ли да ви помогнам?"]
  - [protagonist, "Guten Tag. Ich bin der Opa von Luka. Ich hole Luka ab.", "Добар ден. Јас сум дедото на Лука. Дојдов да го земам Лука."]
  - [kruger, "Ah, der Opa aus Mazedonien! Ich bin Frau Krüger, die Erzieherin.", "А, дедото од Македонија! Јас сум госпоѓа Кригер, воспитувачката."]
  - [kruger, "Luka! Dein Opa ist da!", "Лука! Дедо ти дојде!"]
  - [luka, "Opa!", "Дедо!"]
  - [protagonist, "Hallo, mein Schatz!", "Здраво, душо моја!"]
  - [kruger, "Haben Sie den Ausweis, bitte?", "Ја имате ли личната карта, ве молам?"]
  - [protagonist, "Ja, hier. Das ist der Ausweis.", "Да, еве. Ова е документот."]
  - [kruger, "Danke. Die Mama hat es gesagt. Tschüss, Luka! Bis morgen!", "Благодарам. Мама кажа. Чао, Лука! До утре!"]
  - [protagonist, "Tschüss! Bis morgen!", "Чао! До утре!"]
teach:
  - note: ["Германските именки имаат три рода, а членот го покажува: «der» (машки), «die» (женски), «das» (среден). «der Opa», «die Kita», «das Kind». Секоја именка учете ја со членот."]
  - ask: ["Претставете се: јас сум дедото на Лука.", "Ich bin der Opa von Luka.", ich-bin, der-opa]
  - note: ["«abholen» е одделив глагол: «Ich hole Luka ab» — доаѓам да го земам Лука. Делот «ab» оди на крајот од реченицата."]
  - ask: ["Кажете: дојдов да го земам Лука.", "Ich hole Luka ab.", ich-hole-ab]
  - ask: ["Кажете: воспитувачката.", "Die Erzieherin.", die-erzieherin]
  - ask: ["Таа го вика Лука: дедо ти дојде! Како?", "Dein Opa ist da!", ist-da]
  - ask: ["Поздравете го внукот: здраво, душо моја!", "Hallo, mein Schatz!", hallo, mein-schatz]
  - note: ["Детето смее да го земе само тој што родителите однапред го пријавиле во градинката — затоа бараат документ. Носете го пасошот или личната карта секој пат."]
  - ask: ["Таа го бара документот. Кажете: еве, ова е документот.", "Hier. Das ist der Ausweis.", hier, das-ist, der-ausweis]
  - ask: ["Таа вели: мама кажа.", "Die Mama hat es gesagt.", die-mama-hat-gesagt]
  - ask: ["Кажете: ова е градинката.", "Das ist die Kita.", das-ist, die-kita]
  - ask: ["Поздравете се неформално.", "Tschüss!", tschuess]
  - ask: ["И додадете: до утре!", "Bis morgen!", bis-morgen]
