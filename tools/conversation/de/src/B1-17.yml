id: B1-17
protagonist: f
title: ["Flat hunting", "البحث عن شقة", "Барање стан"]
situation:
  - "A flat viewing. Thirty people on the stairs for one flat. Herr Braun shows you round."
  - "معاينة شقة. ثلاثون شخصًا على الدرج لشقة واحدة. السيد براون يُريكِ المكان."
  - "Разгледување стан. Триесет луѓе на скалите за еден стан. Господин Браун ви го покажува."
learn: [b1-relative-prepositions]
culture: The housing market
items:
  - [die-besichtigung, "die Besichtigung", "the viewing", "المعاينة", "разгледувањето"]
  - [die-kaution, "die Kaution", "the deposit", "التأمين (الكفالة)", "депозитот"]
  - [die-schufa, "die Schufa-Auskunft", "the credit report", "تقرير الجدارة الائتمانية", "кредитниот извештај", {rare: true}]
  - [die-kaltmiete, "die Kaltmiete", "rent without utilities", "الإيجار الصافي", "киријата без режии", {rare: true}]
  - [die-warmmiete, "die Warmmiete", "rent with heating and utilities", "الإيجار شاملًا", "киријата со режии", {rare: true}]
  - [in-der, "in der …", "in which …", "التي … فيها", "во која …"]
  - [mit-dem, "mit dem …", "with whom …", "الذي … معه", "со кого …"]
  - [die-wohnungsnot, "der Wohnungsmangel", "the housing shortage", "نقص المساكن", "недостигот на станови", {rare: true}]
  - [der-gehaltsnachweis, "der Gehaltsnachweis", "proof of income", "إثبات الدخل", "потврдата за плата", {rare: true}]
  - [wir-melden-uns, "Wir melden uns", "We'll be in touch", "سنتواصل معكِ", "Ќе ви се јавиме"]
  - [die-bewerbung-wohnung, "die Mappe", "the application folder", "الملف", "папката"]
dialogue:
  - [braun, "Das ist die Wohnung, in der ich zwanzig Jahre gewohnt habe.", "This is the flat I lived in for twenty years.", "هذه الشقة التي سكنتُ فيها عشرين عامًا.", "Ова е станот во кој живеев дваесет години."]
  - [protagonist, "Sehr schön! Wie hoch ist die Kaltmiete?", "Very nice! What's the rent without utilities?", "جميلة جدًا! كم الإيجار الصافي؟", "Многу убав! Колкава е киријата без режии?"]
  - [braun, "Sie steht in der Anzeige. Mit Nebenkosten ist die Warmmiete etwa ein Drittel höher.", "It's in the ad. With utilities, the full rent is about a third higher.", "مكتوب في الإعلان. مع التكاليف الإضافية يصبح الإيجار الشامل أعلى بنحو الثلث.", "Пишува во огласот. Со режиите киријата е околу третина повисока."]
  - [protagonist, "Und die Kaution?", "And the deposit?", "والتأمين؟", "А депозитот?"]
  - [braun, "Drei Kaltmieten. Haben Sie eine Mappe? Schufa-Auskunft, Gehaltsnachweis?", "Three months' rent. Do you have a folder? Credit report, proof of income?", "ثلاثة أشهر من الإيجار الصافي. هل معكِ ملف؟ تقرير ائتماني، إثبات دخل؟", "Три кирии. Имате ли папка? Кредитен извештај, потврда за плата?"]
  - [protagonist, "Ja, alles hier. Und das ist meine Freundin, mit der ich vielleicht einziehe.", "Yes, all here. And this is my friend, with whom I may move in.", "نعم، كله هنا. وهذه صديقتي التي قد أسكن معها.", "Да, сè е тука. А ова е мојата пријателка, со која можеби ќе се вселам."]
  - [braun, "Danke. Wir melden uns. Es gibt viele Bewerber.", "Thank you. We'll be in touch. There are many applicants.", "شكرًا. سنتواصل معكِ. هناك متقدّمون كثيرون.", "Благодарам. Ќе ви се јавиме. Има многу кандидати."]
  - [protagonist, "Der Wohnungsmangel ist schlimm hier.", "The housing shortage is bad here.", "نقص المساكن سيئ هنا.", "Недостигот на станови е лош тука."]
teach:
  - ask: ["Say: the viewing.", "قولي: المعاينة.", "Кажете: разгледувањето.", "Die Besichtigung.", die-besichtigung]
  - note: ["Relative clauses with a preposition: the preposition comes first. «die Wohnung, in der ich gewohnt habe», «meine Freundin, mit der ich einziehe».", "جمل الصلة مع حرف جر: حرف الجر يأتي أولًا. «die Wohnung, in der ich gewohnt habe»، «meine Freundin, mit der ich einziehe».", "Релативни реченици со предлог: предлогот оди прв. «die Wohnung, in der ich gewohnt habe», «meine Freundin, mit der ich einziehe»."]
  - ask: ["Say: the flat I lived in.", "قولي: الشقة التي سكنتُ فيها.", "Кажете: станот во кој живеев.", "Die Wohnung, in der ich gewohnt habe.", in-der]
  - ask: ["Ask: what's the rent without utilities?", "اسألي: كم الإيجار الصافي؟", "Прашајте: колкава е киријата без режии?", "Wie hoch ist die Kaltmiete?", die-kaltmiete]
  - ask: ["Say: the rent with utilities.", "قولي: الإيجار الشامل.", "Кажете: киријата со режии.", "Die Warmmiete.", die-warmmiete]
  - ask: ["Ask: and the deposit?", "اسألي: والتأمين؟", "Прашајте: а депозитот?", "Und die Kaution?", die-kaution]
  - ask: ["Say: the credit report.", "قولي: تقرير الجدارة الائتمانية.", "Кажете: кредитниот извештај.", "Die Schufa-Auskunft.", die-schufa]
  - ask: ["Say: proof of income.", "قولي: إثبات الدخل.", "Кажете: потврда за плата.", "Der Gehaltsnachweis.", der-gehaltsnachweis]
  - ask: ["Say: my friend, with whom I may move in.", "قولي: صديقتي التي قد أسكن معها.", "Кажете: мојата пријателка, со која можеби ќе се вселам.", "Meine Freundin, mit der ich vielleicht einziehe.", mit-dem]
  - ask: ["He says: we'll be in touch.", "يقول: سنتواصل معكِ.", "Тој вели: ќе ви се јавиме.", "Wir melden uns.", wir-melden-uns]
  - ask: ["Say: the housing shortage is bad.", "قولي: نقص المساكن سيئ.", "Кажете: недостигот на станови е лош.", "Der Wohnungsmangel ist schlimm.", die-wohnungsnot]
  - ask: ["Bring your application folder. How?", "أحضري ملفكِ. كيف تقولين ذلك؟", "Донесете папка. Како?", "Ich habe eine Mappe.", die-bewerbung-wohnung]
  - note: ["Kaltmiete is the bare rent; Nebenkosten add heating, water, rubbish, caretaker; together they make the Warmmiete — compare that. The deposit is at most three months' Kaltmiete. In big cities dozens apply for one flat, and a foreign name can mean fewer replies: that discrimination is illegal, and anti-discrimination offices advise for free. Students are often pointed to the Wohnheim first — it is not always the cheapest; compare a WG too, where you are chosen at a 'WG-Casting'.", "الإيجار الصافي (Kaltmiete) هو الإيجار المجرّد؛ والتكاليف الإضافية تضيف التدفئة والماء والنفايات وحارس العمارة؛ ومعًا تكوّن الإيجار الشامل (Warmmiete) — قارني به. التأمين ثلاثة أشهر من الإيجار الصافي على الأكثر. في المدن الكبيرة يتقدّم العشرات لشقة واحدة، وقد يعني الاسم الأجنبي ردودًا أقل: هذا التمييز ممنوع قانونًا، ومكاتب مكافحة التمييز تقدّم استشارة مجانية.", "Kaltmiete е голата кирија; режиите додаваат греење, вода, ѓубре, домар; заедно ја прават Warmmiete — споредувајте ја неа. Депозитот е најмногу три кирии без режии. Во големите градови десетици се пријавуваат за еден стан, а странско име може да значи помалку одговори: таа дискриминација е незаконска, а канцелариите против дискриминација советуваат бесплатно."]
