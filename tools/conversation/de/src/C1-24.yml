id: C1-24
protagonist: m
title: ["The club's centenary", "مئوية النادي", "Стогодишнината на клубот"]
situation:
  - "The Verein turns one hundred. After Petra's speech, she asks you to say a few words for the newer members."
  - "النادي يبلغ مئة عام. بعد كلمة بيترا تطلب منك أن تقول بضع كلمات باسم الأعضاء الجدد."
  - "Клубот полни сто години. По говорот на Петра, таа ве моли да кажете неколку зборови во име на поновите членови."
learn: [c1-formal-speech]
culture: Club history
items:
  - [das-jubilaeum, "das Jubiläum", "the anniversary", "الذكرى السنوية", "јубилејот"]
  - [die-festrede, "die Festrede", "the ceremonial speech", "الخطاب الاحتفالي", "свечениот говор", {rare: true}]
  - [die-gruendung, "die Gründung", "the founding", "التأسيس", "основањето"]
  - [im-namen, "im Namen der …", "on behalf of the …", "باسم …", "во име на …"]
  - [es-ist-mir-eine-ehre, "Es ist mir eine Ehre", "It is an honour for me", "إنه لشرف لي", "Чест ми е"]
  - [verehrte-gaeste, "Verehrte Gäste", "Honoured guests", "الضيوف الكرام", "Почитувани гости"]
  - [die-generation, "die Generation", "the generation", "الجيل", "генерацијата"]
  - [die-gemeinschaft, "die Gemeinschaft", "the community", "المجتمع، الجماعة", "заедницата"]
  - [das-ehrenmitglied, "das Ehrenmitglied", "the honorary member", "العضو الفخري", "почесниот член", {rare: true}]
  - [ich-erhebe-mein-glas, "Ich erhebe mein Glas", "I raise my glass", "أرفع كأسي", "Ја кревам чашата"]
dialogue:
  - [petra, "Verehrte Gäste, liebe Mitglieder! Seit der Gründung 1925 hat unser Verein Krieg, Teilung und Wende erlebt.", "Honoured guests, dear members! Since its founding in 1925 our club has lived through war, division and reunification.", "الضيوف الكرام، الأعضاء الأعزاء! منذ تأسيسه عام 1925 عاش نادينا الحرب والتقسيم والتحوّل.", "Почитувани гости, драги членови! Од основањето во 1925 нашиот клуб преживеа војна, поделба и пресврт."]
  - [petra, "Und jetzt bitte ich ein neueres Mitglied nach vorn.", "And now I'd like to call one of our newer members to the front.", "والآن أدعو أحد الأعضاء الجدد إلى الأمام.", "А сега повикувам еден понов член напред."]
  - [protagonist, "Verehrte Gäste, es ist mir eine Ehre, im Namen der neuen Mitglieder zu sprechen.", "Honoured guests, it is an honour for me to speak on behalf of the new members.", "الضيوف الكرام، إنه لشرف لي أن أتحدّث باسم الأعضاء الجدد.", "Почитувани гости, чест ми е да зборувам во име на новите членови."]
  - [protagonist, "Als ich kam, kannte ich niemanden. Dieser Verein hat mir eine Gemeinschaft geschenkt.", "When I came, I knew no one. This club gave me a community.", "حين جئتُ لم أكن أعرف أحدًا. هذا النادي منحني مجتمعًا.", "Кога дојдов, не познавав никого. Овој клуб ми подари заедница."]
  - [protagonist, "Hundert Jahre, vier Generationen — und heute Mitglieder aus zwanzig Ländern.", "A hundred years, four generations — and today members from twenty countries.", "مئة عام، أربعة أجيال — واليوم أعضاء من عشرين بلدًا.", "Сто години, четири генерации — и денес членови од дваесет земји."]
  - [protagonist, "Ich erhebe mein Glas: auf die nächsten hundert Jahre!", "I raise my glass: to the next hundred years!", "أرفع كأسي: نخب المئة عام القادمة!", "Ја кревам чашата: за следните сто години!"]
  - [petra, "Danke! Und eine Überraschung: Herr Schulz, unser ältestes Mitglied, wird Ehrenmitglied.", "Thank you! And a surprise: Herr Schulz, our oldest member, becomes an honorary member.", "شكرًا! ومفاجأة: السيد شولتس، أقدم أعضائنا، يصبح عضوًا فخريًا.", "Благодарам! И едно изненадување: господин Шулц, нашиот најстар член, станува почесен член."]
  - [protagonist, "Der Herr vom Bürgeramt? Die Welt ist klein!", "The man from the Bürgeramt? It's a small world!", "الرجل من مكتب المواطنين؟ ما أصغر العالم!", "Господинот од Бирото за граѓани? Светот е мал!"]
teach:
  - ask: ["Say: the anniversary.", "قل: الذكرى السنوية.", "Кажете: јубилејот.", "Das Jubiläum.", das-jubilaeum]
  - ask: ["Say: since its founding.", "قل: منذ تأسيسه.", "Кажете: од основањето.", "Seit der Gründung.", die-gruendung]
  - note: ["A ceremonial speech has fixed openings and closings: «Verehrte Gäste», «Es ist mir eine Ehre, … zu …», «im Namen der …», and the toast «Ich erhebe mein Glas auf …».", "للخطاب الاحتفالي افتتاحيات وخواتيم ثابتة: «Verehrte Gäste»، «Es ist mir eine Ehre, … zu …»، «im Namen der …»، والنخب «Ich erhebe mein Glas auf …».", "Свечениот говор има фиксни почетоци и завршетоци: «Verehrte Gäste», «Es ist mir eine Ehre, … zu …», «im Namen der …», и здравицата «Ich erhebe mein Glas auf …»."]
  - ask: ["Open a ceremonial speech.", "افتتح خطابًا احتفاليًا.", "Почнете свечен говор.", "Verehrte Gäste,", verehrte-gaeste]
  - ask: ["Say: it's an honour to speak on behalf of the new members.", "قل: إنه لشرف لي أن أتحدّث باسم الأعضاء الجدد.", "Кажете: чест ми е да зборувам во име на новите членови.", "Es ist mir eine Ehre, im Namen der neuen Mitglieder zu sprechen.", es-ist-mir-eine-ehre, im-namen]
  - ask: ["Say: this club gave me a community.", "قل: هذا النادي منحني مجتمعًا.", "Кажете: клубот ми подари заедница.", "Dieser Verein hat mir eine Gemeinschaft geschenkt.", die-gemeinschaft]
  - ask: ["Say: four generations.", "قل: أربعة أجيال.", "Кажете: четири генерации.", "Vier Generationen.", die-generation]
  - ask: ["Raise your glass.", "ارفع كأسك.", "Кренете ја чашата.", "Ich erhebe mein Glas.", ich-erhebe-mein-glas]
  - ask: ["Say: an honorary member.", "قل: عضو فخري.", "Кажете: почесен член.", "Ein Ehrenmitglied.", das-ehrenmitglied]
  - ask: ["Say: the ceremonial speech.", "قل: الخطاب الاحتفالي.", "Кажете: свечениот говор.", "Die Festrede.", die-festrede]
  - note: ["Many German clubs are over a hundred years old and survived the war, division and reunification. Anniversaries are celebrated with speeches, honours for long membership and a party — a good moment for newer members to be seen.", "كثير من الأندية الألمانية يتجاوز عمرها مئة عام، ونجت من الحرب والتقسيم والتوحيد. وتُحتفل الذكريات بالخطب وتكريم العضويات الطويلة وحفلة — لحظة جيدة ليظهر فيها الأعضاء الجدد.", "Многу германски клубови се постари од сто години и ги преживеале војната, поделбата и обединувањето. Јубилеите се слават со говори, признанија за долго членство и забава — добар момент новите членови да бидат видени."]
