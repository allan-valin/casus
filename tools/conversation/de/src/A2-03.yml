id: A2-03
protagonist: f
title: ["Heart and health", "القلب والصحة", "Срцето и здравјето"]
situation:
  - "A check-up. Dr Wagner measures your blood pressure and gives you advice."
  - "فحص دوري. الطبيبة فاغنر تقيس ضغط دمكِ وتنصحكِ."
  - "Контролен преглед. Д-р Вагнер ви мери притисок и ви дава совет."
learn: [de-pro_04]
culture: —
items:
  - [der-blutdruck, "der Blutdruck", "blood pressure", "ضغط الدم", "крвниот притисок", {rare: true}]
  - [das-herz, "das Herz", "the heart", "القلب", "срцето"]
  - [gesund, "gesund", "healthy", "صحّي، سليم", "здраво"]
  - [wie-geht-es-ihnen, "Wie geht es Ihnen?", "How are you? (polite)", "كيف حالكِ؟", "Како сте?"]
  - [mir-geht-es-gut, "Mir geht es gut", "I'm well", "أنا بخير", "Добро сум"]
  - [ich-zeige-ihnen, "Ich zeige Ihnen …", "I'll show you …", "سأريكِ …", "Ќе ви покажам …"]
  - [ein-bisschen-hoch, "ein bisschen hoch", "a bit high", "مرتفع قليلًا", "малку висок"]
  - [weniger-salz, "weniger Salz", "less salt", "ملح أقل", "помалку сол"]
  - [mehr-bewegung, "mehr Bewegung", "more exercise", "حركة أكثر", "повеќе движење"]
  - [hilft-mir, "das hilft mir", "that helps me", "هذا يساعدني", "тоа ми помага"]
  - [in-einem-monat, "in einem Monat", "in a month", "بعد شهر", "за еден месец"]
dialogue:
  - [wagner, "Guten Tag! Wie geht es Ihnen?", "Hello! How are you?", "نهارك سعيد! كيف حالكِ؟", "Добар ден! Како сте?"]
  - [protagonist, "Mir geht es gut, danke. Nur ein Check-up.", "I'm well, thanks. Just a check-up.", "أنا بخير، شكرًا. مجرد فحص دوري.", "Добро сум, благодарам. Само контрола."]
  - [wagner, "Ich messe den Blutdruck. Hm, ein bisschen hoch.", "I'll measure your blood pressure. Hm, a bit high.", "سأقيس ضغط الدم. همم، مرتفع قليلًا.", "Ќе ви го измерам притисокот. Хм, малку висок."]
  - [protagonist, "Ist das schlimm? Und das Herz?", "Is that bad? And my heart?", "هل هذا خطير؟ والقلب؟", "Дали е страшно? А срцето?"]
  - [wagner, "Das Herz ist gesund. Ich zeige Ihnen die Werte.", "Your heart is healthy. I'll show you the readings.", "القلب سليم. سأريكِ القيم.", "Срцето е здраво. Ќе ви ги покажам вредностите."]
  - [protagonist, "Was soll ich tun?", "What should I do?", "ماذا أفعل؟", "Што треба да правам?"]
  - [wagner, "Weniger Salz, mehr Bewegung. Gehen Sie jeden Tag spazieren.", "Less salt, more exercise. Go for a walk every day.", "ملح أقل، وحركة أكثر. تمشّي كل يوم.", "Помалку сол, повеќе движење. Шетајте секој ден."]
  - [protagonist, "Das hilft mir. Danke!", "That helps me. Thank you!", "هذا يساعدني. شكرًا!", "Тоа ми помага. Благодарам!"]
  - [wagner, "Kommen Sie in einem Monat wieder.", "Come back in a month.", "عودي بعد شهر.", "Дојдете повторно за еден месец."]
teach:
  - ask: ["She asks how you are. How?", "تسألكِ عن حالكِ. كيف؟", "Ве прашува како сте. Како?", "Wie geht es Ihnen?", wie-geht-es-ihnen]
  - note: ["Some phrases put the person in the dative: «mir» (to me), «Ihnen» (to you, polite). «Mir geht es gut» — it goes well for me. «Ich zeige Ihnen» — I show you.", "بعض العبارات تضع الشخص في حالة الجر: «mir» (لي)، «Ihnen» (لكِ، بصيغة الاحترام). «Mir geht es gut» — حرفيًا: الأمور تسير معي جيدًا. «Ich zeige Ihnen» — أُريكِ.", "Некои изрази го ставаат лицето во датив: «mir» (мене), «Ihnen» (вам, учтиво). «Mir geht es gut» — ми оди добро. «Ich zeige Ihnen» — ви покажувам."]
  - ask: ["Say: I'm well, thanks.", "قولي: أنا بخير، شكرًا.", "Кажете: добро сум, благодарам.", "Mir geht es gut, danke.", mir-geht-es-gut]
  - ask: ["She says: the blood pressure is a bit high.", "تقول: ضغط الدم مرتفع قليلًا.", "Таа вели: притисокот е малку висок.", "Der Blutdruck ist ein bisschen hoch.", der-blutdruck, ein-bisschen-hoch]
  - ask: ["Ask: and the heart?", "اسألي: والقلب؟", "Прашајте: а срцето?", "Und das Herz?", das-herz]
  - ask: ["She says: the heart is healthy.", "تقول: القلب سليم.", "Таа вели: срцето е здраво.", "Das Herz ist gesund.", gesund]
  - ask: ["She says: I'll show you the readings.", "تقول: سأريكِ القيم.", "Таа вели: ќе ви ги покажам вредностите.", "Ich zeige Ihnen die Werte.", ich-zeige-ihnen]
  - ask: ["Say: less salt, more exercise.", "قولي: ملح أقل، وحركة أكثر.", "Кажете: помалку сол, повеќе движење.", "Weniger Salz, mehr Bewegung.", weniger-salz, mehr-bewegung]
  - ask: ["Say: that helps me.", "قولي: هذا يساعدني.", "Кажете: тоа ми помага.", "Das hilft mir.", hilft-mir]
  - ask: ["She says: come back in a month.", "تقول: عودي بعد شهر.", "Таа вели: дојдете за еден месец.", "Kommen Sie in einem Monat wieder.", in-einem-monat]
