id: A2-25
protagonist: f
title: ["Silence", "الصمت", "Тишина"]
situation:
  - "A doctor's waiting room: twenty people, nobody speaks. Later you ask Lena why."
  - "غرفة انتظار عند الطبيب: عشرون شخصًا، ولا أحد يتكلم. لاحقًا تسألين لينا عن السبب."
  - "Чекална кај лекар: дваесет луѓе, никој не зборува. Подоцна ја прашувате Лена зошто."
learn: [de-con_04]
culture: Silence is often listening
items:
  - [das-wartezimmer, "das Wartezimmer", "the waiting room", "غرفة الانتظار", "чекалната"]
  - [niemand, "niemand", "nobody", "لا أحد", "никој"]
  - [schweigen, "schweigen", "be silent", "يصمت", "молчи"]
  - [ich-frage-mich, "ich frage mich", "I wonder", "أتساءل", "се прашувам"]
  - [ob, "ob", "whether, if", "إن كان", "дали"]
  - [warum-alle, "warum alle …", "why everyone …", "لماذا الجميع …", "зошто сите …"]
  - [unhoeflich, "unhöflich", "impolite", "غير مؤدب", "неучтиво"]
  - [die-privatsphaere, "die Privatsphäre", "privacy", "الخصوصية", "приватноста", {rare: true}]
  - [der-smalltalk, "der Smalltalk", "small talk", "الدردشة الخفيفة", "краток разговор"]
  - [zuhoeren, "zuhören", "listen", "يستمع", "слуша"]
  - [weiss-nicht, "Ich weiß nicht, …", "I don't know …", "لا أعرف …", "Не знам …"]
dialogue:
  - [protagonist, "Lena, im Wartezimmer hat niemand gesprochen. Zwanzig Leute!", "Lena, nobody spoke in the waiting room. Twenty people!", "لينا، لم يتكلم أحد في غرفة الانتظار. عشرون شخصًا!", "Лена, во чекалната никој не зборуваше. Дваесет луѓе!"]
  - [lena, "Das ist normal. Wir schweigen gern.", "That's normal. We like silence.", "هذا عادي. نحن نحب الصمت.", "Тоа е нормално. Сакаме да молчиме."]
  - [protagonist, "Ich frage mich, ob das unhöflich ist.", "I wonder whether that's impolite.", "أتساءل إن كان هذا غير مؤدب.", "Се прашувам дали тоа е неучтиво."]
  - [lena, "Nein! Das ist Privatsphäre. Man stört nicht.", "No! It's privacy. You don't disturb people.", "لا! هذه خصوصية. لا يزعج أحد الآخر.", "Не! Тоа е приватност. Не се вознемирува."]
  - [protagonist, "Und im Seminar? Ich weiß nicht, warum alle schweigen.", "And in the seminar? I don't know why everyone is quiet.", "وفي الحلقة الدراسية؟ لا أعرف لماذا يصمت الجميع.", "А на семинарот? Не знам зошто сите молчат."]
  - [lena, "Sie hören zu. Schweigen heißt oft: Ich denke nach.", "They're listening. Silence often means: I'm thinking.", "إنهم يستمعون. الصمت يعني غالبًا: أنا أفكّر.", "Тие слушаат. Молчењето често значи: размислувам."]
  - [protagonist, "Bei uns ist Smalltalk wichtig.", "Where I come from, small talk matters.", "عندنا الدردشة الخفيفة مهمة.", "Кај нас краткиот разговор е важен."]
  - [lena, "Hier auch — aber kurz. Und nicht mit Fremden im Wartezimmer!", "Here too — but short. And not with strangers in a waiting room!", "هنا أيضًا — لكن باختصار. وليس مع الغرباء في غرفة الانتظار!", "И тука — но кратко. И не со непознати во чекална!"]
teach:
  - ask: ["Say: in the waiting room nobody spoke.", "قولي: في غرفة الانتظار لم يتكلم أحد.", "Кажете: во чекалната никој не зборуваше.", "Im Wartezimmer hat niemand gesprochen.", das-wartezimmer, niemand]
  - ask: ["She says: we like silence.", "تقول: نحن نحب الصمت.", "Таа вели: сакаме да молчиме.", "Wir schweigen gern.", schweigen]
  - note: ["Indirect questions put the verb at the end: «Ich frage mich, ob das unhöflich ist» (whether), «Ich weiß nicht, warum alle schweigen».", "الأسئلة غير المباشرة تضع الفعل في الآخر: «Ich frage mich, ob das unhöflich ist» (إن كان)، «Ich weiß nicht, warum alle schweigen».", "Индиректните прашања го ставаат глаголот на крајот: «Ich frage mich, ob das unhöflich ist» (дали), «Ich weiß nicht, warum alle schweigen»."]
  - ask: ["Say: I wonder whether that's impolite.", "قولي: أتساءل إن كان هذا غير مؤدب.", "Кажете: се прашувам дали тоа е неучтиво.", "Ich frage mich, ob das unhöflich ist.", ich-frage-mich, ob, unhoeflich]
  - ask: ["Say: it's privacy.", "قولي: هذه خصوصية.", "Кажете: тоа е приватност.", "Das ist Privatsphäre.", die-privatsphaere]
  - ask: ["Say: I don't know why everyone is quiet.", "قولي: لا أعرف لماذا يصمت الجميع.", "Кажете: не знам зошто сите молчат.", "Ich weiß nicht, warum alle schweigen.", weiss-nicht, warum-alle]
  - ask: ["She says: they're listening.", "تقول: إنهم يستمعون.", "Таа вели: тие слушаат.", "Sie hören zu.", zuhoeren]
  - ask: ["Say: small talk matters.", "قولي: الدردشة الخفيفة مهمة.", "Кажете: краткиот разговор е важен.", "Smalltalk ist wichtig.", der-smalltalk]
  - note: ["Strangers rarely chat in waiting rooms, trams or lifts; silence in a seminar is often attention, not coldness. Friendship takes longer here — but once made, it lasts.", "نادرًا ما يدردش الغرباء في غرف الانتظار أو الترام أو المصاعد؛ والصمت في الحلقة الدراسية غالبًا انتباه، لا برود. الصداقة تحتاج وقتًا أطول هنا — لكنها حين تُعقد تدوم.", "Непознатите ретко разговараат во чекални, трамваи или лифтови; молкот на семинар често е внимание, не студенило. Пријателството тука трае подолго да се создаде — но кога ќе се создаде, трае."]
