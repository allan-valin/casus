id: A2-04-e
tracks: [en]
protagonist: m
title: ["How do you pay for it?"]
situation: ["Jonas asks how foreign students finance their studies. You explain the blocked account."]
learn: [de-con_04]
culture: Proof of funds
items:
  - [das-sperrkonto, "das Sperrkonto", "the blocked account", {rare: true}]
  - [weil, "weil", "because (verb to the end)"]
  - [nachweisen, "nachweisen", "prove, show"]
  - [jeden-monat, "jeden Monat", "every month"]
  - [die-verpflichtungserklaerung, "die Verpflichtungserklärung", "a sponsor's guarantee", {rare: true}]
  - [das-einkommen, "das Einkommen", "income"]
  - [das-stipendium, "das Stipendium", "the scholarship"]
  - [genug-geld, "genug Geld", "enough money"]
  - [die-website, "auf der Website", "on the website"]
  - [jedes-jahr, "jedes Jahr", "every year"]
dialogue:
  - [jonas, "Wie finanzierst du das Studium?", "How do you finance your studies?"]
  - [protagonist, "Mit einem Sperrkonto. Ich muss nachweisen, dass ich genug Geld habe.", "With a blocked account. I have to prove I have enough money."]
  - [jonas, "Ein Sperrkonto? Was ist das?", "A blocked account? What's that?"]
  - [protagonist, "Das Geld liegt auf dem Konto, und ich bekomme jeden Monat einen Teil.", "The money sits in the account, and I get a part every month."]
  - [jonas, "Wie viel?", "How much?"]
  - [protagonist, "Das ändert sich jedes Jahr. Es steht auf der Website der Botschaft.", "That changes every year. It's on the embassy's website."]
  - [jonas, "Und wenn man das Geld nicht hat?", "And if you don't have the money?"]
  - [protagonist, "Dann geht ein Stipendium, eine Verpflichtungserklärung oder ein Einkommen.", "Then a scholarship, a sponsor's guarantee or an income will do."]
  - [jonas, "Kompliziert! Weil alles kontrolliert wird.", "Complicated! Because everything gets checked."]
teach:
  - ask: ["Say: with a blocked account.", "Mit einem Sperrkonto.", das-sperrkonto]
  - ask: ["Say: I have to prove…", "Ich muss nachweisen…", nachweisen]
  - ask: ["Say: enough money.", "Genug Geld.", genug-geld]
  - ask: ["Say: every month a part.", "Jeden Monat einen Teil.", jeden-monat]
  - ask: ["Say: that changes every year.", "Das ändert sich jedes Jahr.", jedes-jahr]
  - ask: ["Say: it's on the website.", "Es steht auf der Website.", die-website]
  - ask: ["Say: a scholarship.", "Ein Stipendium.", das-stipendium]
  - ask: ["Say: a sponsor's guarantee.", "Eine Verpflichtungserklärung.", die-verpflichtungserklaerung]
  - ask: ["Say: or an income.", "Oder ein Einkommen.", das-einkommen]
  - note: ["«weil» (because) sends the verb to the end: «weil alles kontrolliert wird», «weil ich genug Geld habe»."]
  - ask: ["Say: because I have enough money.", "Weil ich genug Geld habe.", weil, genug-geld]
  - note: ["Students from outside the EU prove their living costs before the visa: a blocked account, a scholarship, a guarantor's formal declaration, or income. The required yearly sum is tied to the student grant (BAföG) maximum and changes — the course gives no figure: check the embassy's or the Foreign Office's website."]
