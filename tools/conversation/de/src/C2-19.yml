id: C2-19
protagonist: f
title: ["Sharing a holiday house", "تقاسم بيت العطلة", "Делење куќа за одмор"]
situation:
  - "Jonas, Svenja, Paul and you rent a house on the Baltic. Who pays what? Svenja suggests a fair split."
  - "يوناس وسفينيا وباول وأنتِ تستأجرون بيتًا على بحر البلطيق. من يدفع ماذا؟ سفينيا تقترح تقسيمًا عادلًا."
  - "Јонас, Свења, Паул и вие изнајмувате куќа на Балтикот. Кој што плаќа? Свења предлага праведна поделба."
learn: [c2-konjunktiv-ii]
culture: Splitting costs exactly
items:
  - [das-ferienhaus, "das Ferienhaus", "the holiday house", "بيت العطلة", "куќата за одмор"]
  - [die-kostenaufteilung, "die Kostenaufteilung", "the cost split", "تقسيم التكاليف", "поделбата на трошоците", {rare: true}]
  - [pro-kopf, "pro Kopf", "per head", "للفرد", "по глава"]
  - [die-gemeinsame-kasse, "die gemeinsame Kasse", "the kitty", "الصندوق المشترك", "заедничката каса"]
  - [waere-es-nicht-fairer, "Wäre es nicht fairer, wenn …?", "Wouldn't it be fairer if …?", "أليس من الأعدل أن …؟", "Зарем не би било поправедно ако …?"]
  - [haetten-wir, "Hätten wir …, wäre …", "If we had …, it would be …", "لو كان لدينا …، لكان …", "Да имавме …, ќе беше …"]
  - [die-app, "die Ausgaben-App", "the expense app", "تطبيق المصاريف", "апликацијата за трошоци"]
  - [abrechnen, "abrechnen", "settle up", "يصفّي الحساب", "пресметува"]
  - [die-ostsee, "die Ostsee", "the Baltic Sea", "بحر البلطيق", "Балтичкото Море"]
  - [grosszuegig, "großzügig", "generous", "كريم", "дарежливо"]
dialogue:
  - [svenja, "Das Ferienhaus kostet achthundert Euro. Pro Kopf zweihundert.", "The holiday house costs eight hundred euros. Two hundred per head.", "بيت العطلة يكلّف ثمانمئة يورو. مئتان للفرد.", "Куќата за одмор чини осумстотини евра. По глава двесте."]
  - [paul, "Aber Jonas und Svenja haben das große Zimmer mit Meerblick.", "But Jonas and Svenja have the big room with a sea view.", "لكن يوناس وسفينيا لديهما الغرفة الكبيرة المطلّة على البحر.", "Но Јонас и Свења ја имаат големата соба со поглед на морето."]
  - [protagonist, "Wäre es nicht fairer, wenn das große Zimmer etwas mehr zahlt?", "Wouldn't it be fairer if the big room paid a bit more?", "أليس من الأعدل أن تدفع الغرفة الكبيرة أكثر قليلًا؟", "Зарем не би било поправедно големата соба да плати малку повеќе?"]
  - [svenja, "Einverstanden. Und für Essen machen wir eine gemeinsame Kasse.", "Agreed. And for food we'll have a kitty.", "موافقة. وللطعام نعمل صندوقًا مشتركًا.", "Се согласувам. А за храна правиме заедничка каса."]
  - [protagonist, "Bei uns würde einer einfach alles bezahlen — beim nächsten Mal der andere.", "With us one person would simply pay for everything — next time the other.", "عندنا يدفع واحد كل شيء ببساطة — وفي المرة القادمة الآخر.", "Кај нас еден едноставно би платил сè — следниот пат другиот."]
  - [jonas, "Das ist großzügig! Aber hätten wir das so gemacht, wäre Paul pleite.", "That's generous! But if we'd done it that way, Paul would be broke.", "هذا كرم! لكن لو فعلنا ذلك لأفلس باول.", "Тоа е дарежливо! Но да го направевме така, Паул ќе беше без пара."]
  - [paul, "Danke! Ich trage alles in die Ausgaben-App ein. Am Ende rechnen wir ab.", "Thanks! I'll put everything into the expense app. At the end we settle up.", "شكرًا! سأسجّل كل شيء في تطبيق المصاريف. في النهاية نصفّي الحساب.", "Благодарам! Сè ќе внесам во апликацијата за трошоци. На крајот ќе пресметаме."]
  - [protagonist, "Typisch deutsch — auf den Cent genau. Aber ehrlich gesagt: sehr entspannend.", "Typically German — to the cent. But honestly: very relaxing.", "ألماني نموذجي — بدقة السنت. لكن بصراحة: مريح جدًا.", "Типично германски — до цент. Но искрено: многу опуштачки."]
teach:
  - ask: ["Say: the holiday house on the Baltic.", "قولي: بيت العطلة على بحر البلطيق.", "Кажете: куќата за одмор на Балтикот.", "Das Ferienhaus an der Ostsee.", das-ferienhaus, die-ostsee]
  - ask: ["Say: two hundred per head.", "قولي: مئتان للفرد.", "Кажете: двесте по глава.", "Zweihundert pro Kopf.", pro-kopf]
  - note: ["Konjunktiv II for diplomatic proposals and hypotheses: «Wäre es nicht fairer, wenn…?» (suggestion as a question), «Bei uns würde einer alles bezahlen», «Hätten wir das so gemacht, wäre Paul pleite» (past unreal).", "صيغة التمني للاقتراحات الدبلوماسية والفرضيات: «Wäre es nicht fairer, wenn…?» (اقتراح بصيغة سؤال)، «Bei uns würde einer alles bezahlen»، «Hätten wir das so gemacht, wäre Paul pleite» (فرضية ماضية).", "Konjunktiv II за дипломатски предлози и хипотези: «Wäre es nicht fairer, wenn…?» (предлог како прашање), «Bei uns würde einer alles bezahlen», «Hätten wir das so gemacht, wäre Paul pleite» (минато нереално)."]
  - ask: ["Suggest: wouldn't it be fairer if…?", "اقترحي: أليس من الأعدل أن…؟", "Предложете: зарем не би било поправедно ако…?", "Wäre es nicht fairer, wenn…?", waere-es-nicht-fairer]
  - ask: ["Say: the cost split.", "قولي: تقسيم التكاليف.", "Кажете: поделбата на трошоците.", "Die Kostenaufteilung.", die-kostenaufteilung]
  - ask: ["Say: a kitty for food.", "قولي: صندوق مشترك للطعام.", "Кажете: заедничка каса за храна.", "Eine gemeinsame Kasse fürs Essen.", die-gemeinsame-kasse]
  - ask: ["Say: if we'd done that, Paul would be broke.", "قولي: لو فعلنا ذلك لأفلس باول.", "Кажете: да го направевме тоа, Паул ќе беше без пара.", "Hätten wir das gemacht, wäre Paul pleite.", haetten-wir]
  - ask: ["Say: that's generous.", "قولي: هذا كرم.", "Кажете: тоа е дарежливо.", "Das ist großzügig.", grosszuegig]
  - ask: ["Say: the expense app.", "قولي: تطبيق المصاريف.", "Кажете: апликацијата за трошоци.", "Die Ausgaben-App.", die-app]
  - ask: ["Say: at the end we settle up.", "قولي: في النهاية نصفّي الحساب.", "Кажете: на крајот пресметуваме.", "Am Ende rechnen wir ab.", abrechnen]
  - note: ["Among German friends, splitting exactly — to the cent, often with an app — is normal and not stingy: it keeps friendships free of unspoken debts. Inviting someone ('Ich lade dich ein') is also common, but said clearly.", "بين الأصدقاء الألمان التقسيم الدقيق — حتى السنت، غالبًا بتطبيق — أمر عادي وليس بخلًا: يحفظ الصداقة من الديون غير المعلنة. ودعوة أحد («Ich lade dich ein») شائعة أيضًا، لكنها تُقال بوضوح.", "Меѓу германски пријатели, точната поделба — до цент, често со апликација — е нормална и не е скржавост: ги чува пријателствата од неизговорени долгови. Покана („Ich lade dich ein“) е исто честа, но се кажува јасно."]
