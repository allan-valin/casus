id: C2-16
protagonist: m
title: ["A cultural misunderstanding", "سوء فهم ثقافي", "Културно недоразбирање"]
situation:
  - "Back from holiday, you tell Sabine warmly: 'You've put on weight — you look healthy!' Her face freezes. Tim takes you aside."
  - "عائدًا من الإجازة تقول لزابينه بودّ: «لقد زاد وزنكِ — تبدين بصحة جيدة!» يتجمّد وجهها. تيم يأخذك جانبًا."
  - "Враќајќи се од одмор, топло ѝ велите на Сабине: „Се здебели — изгледаш здраво!“ Лицето ѝ се вкочанува. Тим ве повлекува настрана."
learn: []
learn_missing: [idioms]
culture: Compliments that hurt
items:
  - [das-missverstaendnis, "das Missverständnis", "the misunderstanding", "سوء الفهم", "недоразбирањето"]
  - [das-kam-falsch-rueber, "Das kam falsch rüber", "That came across wrong", "فُهم ذلك خطأً", "Тоа излезе погрешно"]
  - [nicht-boese-gemeint, "Das war nicht böse gemeint", "It wasn't meant badly", "لم أقصد سوءًا", "Не беше мислено лошо"]
  - [schwamm-drueber, "Schwamm drüber!", "Let's forget it!", "لننسَ الأمر!", "Да заборавиме!"]
  - [ein-tabu, "ein Tabu", "a taboo", "محظور، تابو", "табу"]
  - [das-gewicht, "das Gewicht", "the weight", "الوزن", "тежината"]
  - [sich-entschuldigen-c2, "sich aufrichtig entschuldigen", "apologise sincerely", "يعتذر بصدق", "искрено се извинува"]
  - [ein-kompliment, "ein Kompliment", "a compliment", "إطراء", "комплимент"]
  - [beleidigt, "beleidigt", "offended", "مستاء، مُهان", "навредено"]
  - [andere-laender-andere-sitten, "Andere Länder, andere Sitten", "Other countries, other customs", "لكل بلد عاداته", "Друга земја, други обичаи"]
dialogue:
  - [tim, "Sag mal, was hast du zu Sabine gesagt? Sie ist total beleidigt.", "Tell me, what did you say to Sabine? She's really offended.", "قل لي، ماذا قلتَ لزابينه؟ إنها مستاءة جدًا.", "Кажи, што ѝ рече на Сабине? Сосема е навредена."]
  - [protagonist, "Dass sie zugenommen hat und gesund aussieht. Das war ein Kompliment!", "That she'd put on weight and looks healthy. It was a compliment!", "أنّ وزنها زاد وأنها تبدو بصحة جيدة. كان إطراءً!", "Дека се здебелила и изгледа здраво. Тоа беше комплимент!"]
  - [tim, "Bei euch vielleicht. Hier ist Gewicht fast ein Tabu. Das kam völlig falsch rüber.", "Maybe where you're from. Here weight is almost a taboo. That came across completely wrong.", "ربما عندكم. هنا الوزن تقريبًا محظور. فُهم ذلك خطأً تمامًا.", "Можеби кај вас. Тука тежината е речиси табу. Тоа излезе сосема погрешно."]
  - [protagonist, "Oh nein. Da bin ich voll ins Fettnäpfchen getreten.", "Oh no. I really put my foot in it.", "يا للأسف. لقد ارتكبتُ زلّة محرجة تمامًا.", "О не. Баш направив гаф."]
  - [tim, "Geh hin und entschuldige dich. Kurz und ehrlich.", "Go and apologise. Short and honest.", "اذهب واعتذر. باختصار وصدق.", "Оди и извини се. Кратко и искрено."]
  - [protagonist, "Sabine, es tut mir aufrichtig leid. Das war nicht böse gemeint — bei uns ist das ein Kompliment.", "Sabine, I'm sincerely sorry. It wasn't meant badly — where I'm from it's a compliment.", "زابينه، أنا آسف بصدق. لم أقصد سوءًا — عندنا هذا إطراء.", "Сабине, искрено ми е жал. Не беше мислено лошо — кај нас тоа е комплимент."]
  - [sabine, "Ach so! Andere Länder, andere Sitten. Schwamm drüber!", "Oh, I see! Other countries, other customs. Let's forget it!", "آه، فهمت! لكل بلد عاداته. لننسَ الأمر!", "А, така! Друга земја, други обичаи. Да заборавиме!"]
  - [protagonist, "Danke. Ab jetzt lobe ich nur noch deine Schuhe.", "Thank you. From now on I'll only praise your shoes.", "شكرًا. من الآن سأمدح حذاءكِ فقط.", "Благодарам. Отсега ќе ти ги фалам само чевлите."]
teach:
  - ask: ["Say: a misunderstanding.", "قل: سوء فهم.", "Кажете: недоразбирање.", "Ein Missverständnis.", das-missverstaendnis]
  - ask: ["Say: she's offended.", "قل: إنها مستاءة.", "Кажете: навредена е.", "Sie ist beleidigt.", beleidigt]
  - ask: ["Say: it was a compliment.", "قل: كان إطراءً.", "Кажете: тоа беше комплимент.", "Das war ein Kompliment.", ein-kompliment]
  - ask: ["He says: weight is almost a taboo.", "يقول: الوزن تقريبًا محظور.", "Тој вели: тежината е речиси табу.", "Gewicht ist fast ein Tabu.", das-gewicht, ein-tabu]
  - note: ["Idioms for social repair: «Das kam falsch rüber» (came across wrong), «ins Fettnäpfchen treten» (put your foot in it), «Das war nicht böse gemeint», «Schwamm drüber!» (let's wipe it away), «Andere Länder, andere Sitten».", "تعابير لإصلاح العلاقات: «Das kam falsch rüber» (فُهم خطأً)، «ins Fettnäpfchen treten» (ارتكاب زلّة)، «Das war nicht böse gemeint»، «Schwamm drüber!» (لنمسح الأمر)، «Andere Länder, andere Sitten».", "Идиоми за поправање односи: «Das kam falsch rüber» (излезе погрешно), «ins Fettnäpfchen treten» (направи гаф), «Das war nicht böse gemeint», «Schwamm drüber!» (да избришеме), «Andere Länder, andere Sitten»."]
  - ask: ["Say: that came across wrong.", "قل: فُهم ذلك خطأً.", "Кажете: тоа излезе погрешно.", "Das kam falsch rüber.", das-kam-falsch-rueber]
  - ask: ["Say: I put my foot in it.", "قل: ارتكبتُ زلّة محرجة.", "Кажете: направив гаф.", "Ich bin ins Fettnäpfchen getreten.", ins-fettnaepfchen]
  - ask: ["Apologise sincerely.", "اعتذر بصدق.", "Искрено извинете се.", "Es tut mir aufrichtig leid.", sich-entschuldigen-c2]
  - ask: ["Say: it wasn't meant badly.", "قل: لم أقصد سوءًا.", "Кажете: не беше мислено лошо.", "Das war nicht böse gemeint.", nicht-boese-gemeint]
  - ask: ["She says: other countries, other customs.", "تقول: لكل بلد عاداته.", "Таа вели: друга земја, други обичаи.", "Andere Länder, andere Sitten.", andere-laender-andere-sitten]
  - ask: ["She says: let's forget it!", "تقول: لننسَ الأمر!", "Таа вели: да заборавиме!", "Schwamm drüber!", schwamm-drueber]
  - note: ["Comments on weight, age, salary or someone's looks — even kind ones — are taboo with colleagues in Germany. If something comes out wrong, a short, sincere apology plus a word of explanation repairs almost everything; Germans respect directness in apologising too.", "التعليقات على الوزن أو العمر أو الراتب أو المظهر — حتى اللطيفة منها — محظورة مع الزملاء في ألمانيا. وإذا خرج شيء خطأً، فاعتذار قصير صادق مع كلمة تفسير يصلح كل شيء تقريبًا؛ والألمان يقدّرون الصراحة في الاعتذار أيضًا.", "Коментарите за тежина, возраст, плата или изглед — дури и љубезните — се табу со колегите во Германија. Ако нешто излезе погрешно, кратко, искрено извинување со еден збор објаснување поправа речиси сè; Германците ја ценат директноста и во извинувањето."]
