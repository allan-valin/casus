id: A1-06
protagonist: m
title: ["Winter", "الشتاء", "Зима"]
situation:
  - "Four in the afternoon and already dark. You come in from the snow; Frau Becker is in the hallway."
  - "الساعة الرابعة عصرًا والدنيا مظلمة. تدخل من الثلج، والسيدة بيكر في المدخل."
  - "Четири попладне, а веќе е темно. Влегувате од снегот; госпоѓа Бекер е во ходникот."
learn: [de-v_04]
culture: Grey days, warm rooms, no umbrellas
items:
  - [guten-abend, "Guten Abend", "Good evening", "مساء الخير", "Добровечер"]
  - [kalt, "kalt", "cold", "بارد", "ладно"]
  - [draussen, "draußen", "outside", "في الخارج", "надвор"]
  - [schon, "schon", "already", "بالفعل، أصلًا", "веќе"]
  - [dunkel, "dunkel", "dark", "مظلم", "темно"]
  - [im-winter, "im Winter", "in winter", "في الشتاء", "во зима"]
  - [hell, "hell", "light, bright", "مضيء، فاتح", "светло"]
  - [grau, "grau", "grey", "رمادي", "сиво"]
  - [abtreten, "treten … ab", "wipe (your shoes)", "امسح (حذاءك)", "избришете (чевлите)"]
  - [nass, "nass", "wet", "مبلّل", "мокро"]
  - [drinnen, "drinnen", "inside", "في الداخل", "внатре"]
  - [warm, "warm", "warm", "دافئ", "топло"]
  - [ziehe-aus, "ziehe … aus", "take off (clothes)", "أخلع", "соблекувам"]
  - [die-jacke, "die Jacke", "the jacket", "السترة / الجاكيت", "јакната"]
  - [windig, "windig", "windy", "عاصف، فيه رياح", "ветровито"]
dialogue:
  - [becker, "Guten Abend! Ist es kalt draußen?", "Good evening! Is it cold outside?", "مساء الخير! هل الجو بارد في الخارج؟", "Добровечер! Ладно ли е надвор?"]
  - [protagonist, "Ja, sehr kalt. Und es ist schon dunkel — um vier Uhr!", "Yes, very cold. And it's already dark — at four o'clock!", "نعم، بارد جدًا. وقد أظلمت الدنيا — في الساعة الرابعة!", "Да, многу ладно. И веќе е темно — во четири часот!"]
  - [becker, "Im Winter ist es von neun bis drei hell. Dann ist es dunkel.", "In winter it's light from nine to three. Then it's dark.", "في الشتاء يكون النهار من التاسعة إلى الثالثة. ثم يحلّ الظلام.", "Во зима е светло од девет до три. Потоа е темно."]
  - [protagonist, "Und immer grau.", "And always grey.", "ودائمًا رمادي.", "И секогаш сиво."]
  - [becker, "Treten Sie bitte die Schuhe ab. Der Boden ist nass.", "Please wipe your shoes. The floor is wet.", "امسح حذاءك من فضلك. الأرض مبلّلة.", "Избришете ги чевлите, ве молам. Подот е мокар."]
  - [protagonist, "Entschuldigung! Drinnen ist es so warm. Ich ziehe die Jacke aus.", "Sorry! It's so warm inside. I'll take my jacket off.", "عفوًا! الجو دافئ جدًا في الداخل. سأخلع السترة.", "Извинете! Внатре е толку топло. Ќе ја соблечам јакната."]
  - [becker, "Ja, die Heizung ist an. Draußen drei Jacken, drinnen ein T-Shirt!", "Yes, the heating's on. Outside three jackets, inside a T-shirt!", "نعم، التدفئة شغّالة. في الخارج ثلاث سترات، وفي الداخل قميص قصير!", "Да, греењето е вклучено. Надвор три јакни, внатре маичка!"]
  - [protagonist, "Und kein Regenschirm?", "And no umbrella?", "ولا مظلة؟", "А чадор не?"]
  - [becker, "Nein, es ist zu windig. Wir tragen eine Regenjacke.", "No, it's too windy. We wear a rain jacket.", "لا، الرياح شديدة. نلبس سترة للمطر.", "Не, премногу е ветровито. Носиме јакна за дожд."]
teach:
  - ask: ["Greet her in the evening.", "حيِّها في المساء.", "Поздравете ја навечер.", "Guten Abend!", guten-abend]
  - ask: ["Say: it's very cold outside.", "قل: الجو بارد جدًا في الخارج.", "Кажете: многу е ладно надвор.", "Es ist sehr kalt draußen.", kalt, draussen]
  - ask: ["Say: it's already dark.", "قل: أظلمت الدنيا بالفعل.", "Кажете: веќе е темно.", "Es ist schon dunkel.", schon, dunkel]
  - ask: ["Say for her: in winter it's light from nine to three.", "قلها بلسانها: في الشتاء يكون النهار من التاسعة إلى الثالثة.", "Кажете наместо неа: во зима е светло од девет до три.", "Im Winter ist es von neun bis drei hell.", im-winter, hell]
  - ask: ["Say: and always grey.", "قل: ودائمًا رمادي.", "Кажете: и секогаш сиво.", "Und immer grau.", grau]
  - note: ["Some verbs split in two: «abtreten» (wipe the shoes) becomes «Treten Sie die Schuhe ab»; «ausziehen» (take off) becomes «Ich ziehe die Jacke aus». The small part goes to the end.", "بعض الأفعال تنقسم إلى جزأين: «abtreten» (يمسح الحذاء) تصبح «Treten Sie die Schuhe ab»؛ و«ausziehen» (يخلع) تصبح «Ich ziehe die Jacke aus». الجزء الصغير يذهب إلى آخر الجملة.", "Некои глаголи се делат на два дела: «abtreten» (бришење чевли) станува «Treten Sie die Schuhe ab»; «ausziehen» (соблекување) станува «Ich ziehe die Jacke aus». Малиот дел оди на крајот."]
  - ask: ["She asks you to wipe your shoes. How?", "تطلب منك أن تمسح حذاءك. كيف؟", "Ве замолува да ги избришете чевлите. Како?", "Treten Sie bitte die Schuhe ab.", abtreten]
  - ask: ["Say: the floor is wet.", "قل: الأرض مبلّلة.", "Кажете: подот е мокар.", "Der Boden ist nass.", nass]
  - ask: ["Say: it's so warm inside.", "قل: الجو دافئ جدًا في الداخل.", "Кажете: внатре е толку топло.", "Drinnen ist es so warm.", drinnen, warm]
  - ask: ["Say: I'll take my jacket off.", "قل: سأخلع السترة.", "Кажете: ќе ја соблечам јакната.", "Ich ziehe die Jacke aus.", ziehe-aus, die-jacke]
  - ask: ["Say: it's too windy.", "قل: الرياح شديدة جدًا.", "Кажете: премногу е ветровито.", "Es ist zu windig.", windig]
  - note: ["Winter here: grey days, light from about nine to three, then dark; often below zero. Outside you wear layers; inside, rooms are heated warm. Rain is often light but windy, so many people wear a hooded rain jacket instead of carrying an umbrella.", "الشتاء هنا: أيام رمادية، والنهار من التاسعة تقريبًا إلى الثالثة، ثم الظلام؛ وكثيرًا ما تنخفض الحرارة تحت الصفر. في الخارج تلبس طبقات من الثياب، وفي الداخل تُدفّأ الغرف جيدًا. المطر غالبًا خفيف لكن مع رياح، لذلك يلبس كثيرون سترة بقلنسوة بدل حمل المظلة.", "Зимата тука: сиви денови, светло од околу девет до три, потоа темно; често под нулата. Надвор се облекувате во слоеви, а внатре собите се добро загреани. Дождот често е слаб, но со ветер, па многумина носат јакна со качулка наместо чадор."]
