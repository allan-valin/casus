id: B2-27
protagonist: f
title: ["The media", "الإعلام", "Медиумите"]
situation:
  - "A letter from the 'Beitragsservice': you owe the broadcasting fee. You don't even own a TV. Paul explains."
  - "رسالة من «Beitragsservice»: عليكِ رسوم البث. وأنتِ لا تملكين حتى تلفازًا. باول يشرح."
  - "Писмо од „Beitragsservice“: должите радиодифузна такса. А немате ни телевизор. Паул објаснува."
learn: [b2-nominal-style]
culture: Everyone pays it
items:
  - [der-rundfunkbeitrag, "der Rundfunkbeitrag", "the broadcasting fee", "رسوم البث", "радиодифузната такса", {rare: true}]
  - [pro-wohnung, "pro Wohnung", "per household, per flat", "لكل مسكن", "по стан"]
  - [der-oeffentlich-rechtliche, "der öffentlich-rechtliche Rundfunk", "public broadcasting", "البث العام", "јавниот радиодифузен сервис", {rare: true}]
  - [die-nachrichten, "die Nachrichten", "the news", "الأخبار", "вестите"]
  - [die-befreiung, "die Befreiung", "the exemption", "الإعفاء", "ослободувањето"]
  - [die-anmeldung-beitrag, "die Anmeldung", "the registration", "التسجيل", "пријавувањето"]
  - [unabhaengig, "unabhängig", "independent", "مستقل", "независно"]
  - [die-zahlungsaufforderung, "die Zahlungsaufforderung", "the payment demand", "مطالبة بالدفع", "барањето за плаќање", {rare: true}]
  - [ignorieren, "ignorieren", "ignore", "يتجاهل", "игнорира"]
  - [der-mitbewohner-zahlt, "einer zahlt für alle", "one pays for everyone", "واحد يدفع عن الجميع", "еден плаќа за сите"]
dialogue:
  - [protagonist, "Eine Zahlungsaufforderung vom Beitragsservice. Ich habe keinen Fernseher!", "A payment demand from the Beitragsservice. I don't have a TV!", "مطالبة بالدفع من «Beitragsservice». ليس لديّ تلفاز!", "Барање за плаќање од Beitragsservice. Немам телевизор!"]
  - [paul, "Egal. Der Rundfunkbeitrag wird pro Wohnung bezahlt, nicht pro Gerät.", "Doesn't matter. The broadcasting fee is paid per flat, not per device.", "لا يهم. رسوم البث تُدفع لكل مسكن، لا لكل جهاز.", "Небитно. Радиодифузната такса се плаќа по стан, не по уред."]
  - [protagonist, "Und wofür?", "And what for?", "ولأجل ماذا؟", "А за што?"]
  - [paul, "Für den öffentlich-rechtlichen Rundfunk: Nachrichten, Radio, die Mediathek. Unabhängig von Werbung und Regierung.", "For public broadcasting: news, radio, the online library. Independent of advertising and government.", "للبث العام: الأخبار، الراديو، المكتبة الرقمية. مستقل عن الإعلانات والحكومة.", "За јавниот сервис: вести, радио, медијатеката. Независно од реклами и влада."]
  - [protagonist, "In der WG zahlt jeder?", "In a flat-share does everyone pay?", "في السكن المشترك يدفع كل واحد؟", "Во заеднички стан плаќа секој?"]
  - [paul, "Nein, einer zahlt für alle. Die anderen geben ihm ihren Anteil.", "No, one pays for everyone. The others give him their share.", "لا، واحد يدفع عن الجميع. والآخرون يعطونه حصتهم.", "Не, еден плаќа за сите. Другите му го даваат својот дел."]
  - [protagonist, "Kann ich den Brief einfach ignorieren?", "Can I just ignore the letter?", "هل يمكنني ببساطة تجاهل الرسالة؟", "Можам ли едноставно да го игнорирам писмото?"]
  - [paul, "Bloß nicht! Dann kommen Mahngebühren. Mit wenig Einkommen gibt es eine Befreiung — beantrage sie.", "Absolutely not! Then come reminder fees. With low income there's an exemption — apply for it.", "إياكِ! عندها تأتي رسوم التذكير. مع دخل قليل يوجد إعفاء — قدّمي طلبًا.", "Никако! Тогаш доаѓаат казнени такси. Со мал приход има ослободување — побарај го."]
teach:
  - ask: ["Say: a payment demand.", "قولي: مطالبة بالدفع.", "Кажете: барање за плаќање.", "Eine Zahlungsaufforderung.", die-zahlungsaufforderung]
  - ask: ["Say: the broadcasting fee.", "قولي: رسوم البث.", "Кажете: радиодифузната такса.", "Der Rundfunkbeitrag.", der-rundfunkbeitrag]
  - note: ["Official texts prefer nouns and the passive: «Der Beitrag wird pro Wohnung bezahlt», «Zahlungsaufforderung» (= you are asked to pay), «Befreiung» (= you are freed from it).", "النصوص الرسمية تفضّل الأسماء والمبني للمجهول: «Der Beitrag wird pro Wohnung bezahlt»، «Zahlungsaufforderung» (= يُطلب منكِ الدفع)، «Befreiung» (= تُعفَين منه).", "Официјалните текстови претпочитаат именки и пасив: «Der Beitrag wird pro Wohnung bezahlt», «Zahlungsaufforderung» (= се бара да платите), «Befreiung» (= ослободени сте)."]
  - ask: ["He says: it's paid per flat.", "يقول: تُدفع لكل مسكن.", "Тој вели: се плаќа по стан.", "Er wird pro Wohnung bezahlt.", pro-wohnung]
  - ask: ["Say: public broadcasting.", "قولي: البث العام.", "Кажете: јавниот сервис.", "Der öffentlich-rechtliche Rundfunk.", der-oeffentlich-rechtliche]
  - ask: ["Say: the news.", "قولي: الأخبار.", "Кажете: вестите.", "Die Nachrichten.", die-nachrichten]
  - ask: ["Say: independent of advertising.", "قولي: مستقل عن الإعلانات.", "Кажете: независно од реклами.", "Unabhängig von Werbung.", unabhaengig]
  - ask: ["Say: one pays for everyone.", "قولي: واحد يدفع عن الجميع.", "Кажете: еден плаќа за сите.", "Einer zahlt für alle.", der-mitbewohner-zahlt]
  - ask: ["Ask: can I ignore the letter?", "اسألي: هل يمكنني تجاهل الرسالة؟", "Прашајте: можам ли да го игнорирам писмото?", "Kann ich den Brief ignorieren?", ignorieren]
  - ask: ["Say: an exemption.", "قولي: إعفاء.", "Кажете: ослободување.", "Eine Befreiung.", die-befreiung]
  - ask: ["Say: the registration.", "قولي: التسجيل.", "Кажете: пријавувањето.", "Die Anmeldung.", die-anmeldung-beitrag]
  - note: ["Every household pays one broadcasting fee, whether it has a TV or not; registering your address triggers the letter. In a shared flat one person pays. People on certain benefits, students with BAföG and some others can be exempted — on application. Ignoring the letters leads to reminder fees and enforcement.", "كل مسكن يدفع رسم بث واحدًا، سواء كان فيه تلفاز أم لا؛ وتسجيل عنوانكِ يجلب الرسالة. في السكن المشترك يدفع شخص واحد. ويمكن إعفاء مستفيدين من إعانات معيّنة وطلاب بمنحة «BAföG» وآخرين — بناءً على طلب. وتجاهل الرسائل يؤدي إلى رسوم تذكير وتنفيذ إجباري.", "Секое домаќинство плаќа една радиодифузна такса, без разлика дали има телевизор; пријавувањето на адресата го предизвикува писмото. Во заеднички стан плаќа едно лице. Луѓе што примаат одредена социјална помош, студенти со BAföG и некои други можат да бидат ослободени — со барање. Игнорирањето на писмата води до казнени такси и присилна наплата."]
