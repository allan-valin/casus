id: B2-19
protagonist: m
title: ["The presentation", "العرض التقديمي", "Презентацијата"]
situation:
  - "At the VHS everyone gives a five-minute talk. Yours: your home town. Professor Hartmann gives feedback."
  - "في الجامعة الشعبية يقدّم كل واحد عرضًا مدته خمس دقائق. عرضك: مدينتك. البروفيسور هارتمان يعطي ملاحظاته."
  - "На народниот универзитет секој држи говор од пет минути. Вашиот: родниот град. Професорот Хартман дава повратна информација."
learn: [b2-connectors]
culture: Structure first
items:
  - [die-praesentation, "die Präsentation", "the presentation", "العرض التقديمي", "презентацијата"]
  - [zunaechst, "zunächst", "first of all", "أولًا", "најпрвин"]
  - [anschliessend, "anschließend", "afterwards, then", "بعد ذلك", "потоа"]
  - [zusammenfassend, "zusammenfassend", "in summary", "باختصار، إجمالًا", "накратко, сумирано"]
  - [die-gliederung, "die Gliederung", "the outline, structure", "الهيكل", "структурата"]
  - [die-folie, "die Folie", "the slide", "الشريحة", "слајдот"]
  - [die-heimatstadt, "die Heimatstadt", "the home town", "المدينة الأم", "родниот град"]
  - [der-blickkontakt, "der Blickkontakt", "eye contact", "التواصل البصري", "контактот со очите"]
  - [vielen-dank-fuer-ihre, "Vielen Dank für Ihre Aufmerksamkeit", "Thank you for your attention", "شكرًا على حسن استماعكم", "Благодарам за вниманието"]
  - [gibt-es-fragen, "Gibt es Fragen?", "Are there any questions?", "هل هناك أسئلة؟", "Има ли прашања?"]
dialogue:
  - [protagonist, "Mein Thema ist meine Heimatstadt. Zunächst die Geschichte, anschließend das Essen, zum Schluss die Menschen.", "My topic is my home town. First the history, then the food, finally the people.", "موضوعي مدينتي. أولًا التاريخ، بعد ذلك الطعام، وفي الختام الناس.", "Мојата тема е мојот роден град. Најпрвин историјата, потоа храната, на крајот луѓето."]
  - [protagonist, "Auf dieser Folie sehen Sie die Altstadt.", "On this slide you can see the old town.", "في هذه الشريحة ترون المدينة القديمة.", "На овој слајд го гледате стариот град."]
  - [protagonist, "Zusammenfassend: eine alte Stadt mit jungen Menschen. Vielen Dank für Ihre Aufmerksamkeit. Gibt es Fragen?", "In summary: an old city with young people. Thank you for your attention. Are there any questions?", "باختصار: مدينة قديمة بأناس شباب. شكرًا على حسن استماعكم. هل هناك أسئلة؟", "Накратко: стар град со млади луѓе. Благодарам за вниманието. Има ли прашања?"]
  - [hartmann, "Sehr gut! Die Gliederung war klar. Das ist in Deutschland wichtig.", "Very good! The structure was clear. That's important in Germany.", "جيد جدًا! الهيكل كان واضحًا. هذا مهم في ألمانيا.", "Многу добро! Структурата беше јасна. Тоа е важно во Германија."]
  - [protagonist, "Und was kann ich besser machen?", "And what can I do better?", "وماذا يمكنني أن أحسّن؟", "А што можам да направам подобро?"]
  - [hartmann, "Mehr Blickkontakt. Sie haben fast nur auf die Folien geschaut.", "More eye contact. You looked almost only at the slides.", "تواصل بصري أكثر. كنتَ تنظر إلى الشرائح فقط تقريبًا.", "Повеќе контакт со очите. Гледавте речиси само во слајдовите."]
  - [protagonist, "Ich war nervös.", "I was nervous.", "كنتُ متوترًا.", "Бев нервозен."]
  - [hartmann, "Das merkt man nicht. Nur weniger Text auf den Folien — höchstens fünf Zeilen.", "You couldn't tell. Just less text on the slides — five lines at most.", "لم يكن ذلك ظاهرًا. فقط نص أقل على الشرائح — خمسة أسطر على الأكثر.", "Не се забележува. Само помалку текст на слајдовите — најмногу пет реда."]
teach:
  - ask: ["Say: my topic is my home town.", "قل: موضوعي مدينتي.", "Кажете: мојата тема е мојот роден град.", "Mein Thema ist meine Heimatstadt.", die-heimatstadt]
  - note: ["Talks follow signposts: «zunächst» (first), «anschließend» (then), «zum Schluss» (finally), «zusammenfassend» (in summary). The verb comes right after them.", "العروض تتبع إشارات طريق: «zunächst» (أولًا)، «anschließend» (بعد ذلك)، «zum Schluss» (في الختام)، «zusammenfassend» (باختصار). والفعل يأتي بعدها مباشرة.", "Говорите следат патокази: «zunächst» (најпрвин), «anschließend» (потоа), «zum Schluss» (на крајот), «zusammenfassend» (накратко). Глаголот доаѓа веднаш по нив."]
  - ask: ["Say: first the history, then the food.", "قل: أولًا التاريخ، بعد ذلك الطعام.", "Кажете: најпрвин историјата, потоа храната.", "Zunächst die Geschichte, anschließend das Essen.", zunaechst, anschliessend]
  - ask: ["Say: on this slide you see the old town.", "قل: في هذه الشريحة ترون المدينة القديمة.", "Кажете: на овој слајд го гледате стариот град.", "Auf dieser Folie sehen Sie die Altstadt.", die-folie]
  - ask: ["Say: in summary.", "قل: باختصار.", "Кажете: накратко.", "Zusammenfassend.", zusammenfassend]
  - ask: ["End your talk politely.", "اختم عرضك بأدب.", "Завршете го говорот учтиво.", "Vielen Dank für Ihre Aufmerksamkeit.", vielen-dank-fuer-ihre]
  - ask: ["Ask: are there any questions?", "اسأل: هل هناك أسئلة؟", "Прашајте: има ли прашања?", "Gibt es Fragen?", gibt-es-fragen]
  - ask: ["He says: the structure was clear.", "يقول: الهيكل كان واضحًا.", "Тој вели: структурата беше јасна.", "Die Gliederung war klar.", die-gliederung]
  - ask: ["He says: more eye contact.", "يقول: تواصل بصري أكثر.", "Тој вели: повеќе контакт со очите.", "Mehr Blickkontakt.", der-blickkontakt]
  - ask: ["Say: the presentation.", "قل: العرض التقديمي.", "Кажете: презентацијата.", "Die Präsentation.", die-praesentation]
  - note: ["German audiences expect the structure up front ('first…, then…, finally…'), a clear summary and time kept to the minute. Slides support you, they don't replace you: few lines, big pictures, eyes on the audience.", "الجمهور الألماني يتوقّع الهيكل من البداية («أولًا…، ثم…، وأخيرًا…»)، وخلاصة واضحة، والتزامًا بالوقت حتى الدقيقة. الشرائح تدعمك ولا تحلّ محلّك: أسطر قليلة، صور كبيرة، وعيناك على الجمهور.", "Германската публика ја очекува структурата однапред („најпрвин…, потоа…, на крајот…“), јасно сумирање и почитување на времето до минута. Слајдовите ве поддржуваат, не ве заменуваат: малку редови, големи слики, очите кон публиката."]
