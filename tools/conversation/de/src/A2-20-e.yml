id: A2-20-e
tracks: [en]
protagonist: m
title: ["A club night"]
situation: ["Saturday, two in the morning, a techno club. The bouncer looks at you for a long time."]
learn: [de-vrf_01]
culture: The door policy
items:
  - [der-tuersteher, "der Türsteher", "the bouncer", {rare: true}]
  - [wie-viele-seid-ihr, "Wie viele seid ihr?", "How many of you are there?"]
  - [wir-freuen-uns, "wir freuen uns", "we're looking forward"]
  - [ich-ziehe-mich-um, "ich ziehe mich um", "I change (clothes)"]
  - [sich-treffen, "wir treffen uns", "we meet"]
  - [heute-nicht-rein, "heute nicht", "not tonight"]
  - [keine-fotos, "keine Fotos", "no photos"]
  - [die-garderobe, "die Garderobe", "the cloakroom"]
  - [tanzen, "tanzen", "dance"]
  - [bis-morgens, "bis morgens", "until the morning"]
dialogue:
  - [jonas, "Wir treffen uns um eins vor dem Club, okay?", "We meet at one in front of the club, OK?"]
  - [protagonist, "Okay. Ich ziehe mich noch um.", "OK. I'll just change first."]
  - [fahrer, "Wie viele seid ihr?", "How many of you are there?"]
  - [jonas, "Zwei.", "Two."]
  - [fahrer, "Keine Fotos drinnen. Handy-Kamera wird zugeklebt.", "No photos inside. Phone cameras get taped over."]
  - [protagonist, "Klar. Wir freuen uns!", "Sure. We're looking forward to it!"]
  - [fahrer, "Okay, rein. Die Garderobe ist links.", "OK, in you go. The cloakroom's on the left."]
  - [protagonist, "Puh! Und wie lange tanzen die Leute?", "Phew! And how long do people dance?"]
  - [jonas, "Bis morgens. Manche bis Sonntagmittag.", "Until the morning. Some till Sunday lunchtime."]
teach:
  - note: ["Reflexive verbs use «mich», «dich», «uns»: «ich ziehe mich um» (I change), «wir freuen uns» (we look forward), «wir treffen uns» (we meet)."]
  - ask: ["Say: we meet at one.", "Wir treffen uns um eins.", sich-treffen]
  - ask: ["Say: I'll change first.", "Ich ziehe mich um.", ich-ziehe-mich-um]
  - ask: ["The bouncer asks how many you are.", "Wie viele seid ihr?", wie-viele-seid-ihr, der-tuersteher]
  - ask: ["He says: no photos.", "Keine Fotos.", keine-fotos]
  - ask: ["Say: we're looking forward!", "Wir freuen uns!", wir-freuen-uns]
  - ask: ["Say: the cloakroom.", "Die Garderobe.", die-garderobe]
  - ask: ["Ask: how long do people dance?", "Wie lange tanzen die Leute?", tanzen]
  - ask: ["Say: until the morning.", "Bis morgens.", bis-morgens]
  - ask: ["He might say: not tonight.", "Heute nicht.", heute-nicht-rein]
  - note: ["Big-city clubs have strict, unexplained door policies: arrive in small groups, quiet, not drunk, and don't take it personally if you're turned away. Photos are banned inside many clubs."]
