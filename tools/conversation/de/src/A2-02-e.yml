id: A2-02-e
tracks: [en]
protagonist: m
title: ["The residence permit"]
situation: ["The Ausländerbehörde. Herr Schulz checks your student visa before it runs out."]
learn: [a2-perfekt]
culture: Types of residence permits
items:
  - [der-aufenthaltstitel, "der Aufenthaltstitel", "the residence permit", {rare: true}]
  - [das-visum, "das Visum", "the visa"]
  - [laeuft-ab, "läuft … ab", "runs out, expires"]
  - [verlaengern, "verlängern", "extend"]
  - [zum-studieren, "zum Studieren", "for studying"]
  - [die-immatrikulation, "die Immatrikulationsbescheinigung", "the enrolment certificate", {rare: true}]
  - [ich-habe-mitgebracht, "ich habe … mitgebracht", "I've brought …"]
  - [arbeiten-darf, "darf ich arbeiten?", "am I allowed to work?"]
  - [begrenzt, "begrenzt", "limited"]
  - [pruefen, "prüfen", "check"]
dialogue:
  - [schulz, "Ihr Visum läuft im März ab. Sie wollen verlängern?", "Your visa runs out in March. You want to extend it?"]
  - [protagonist, "Ja, bitte. Ich bin zum Studieren hier.", "Yes, please. I'm here to study."]
  - [schulz, "Haben Sie die Immatrikulationsbescheinigung?", "Do you have the enrolment certificate?"]
  - [protagonist, "Ja, ich habe alles mitgebracht.", "Yes, I've brought everything."]
  - [schulz, "Gut. Dann bekommen Sie einen Aufenthaltstitel für das Studium.", "Good. Then you'll get a residence permit for your studies."]
  - [protagonist, "Darf ich auch arbeiten?", "Am I allowed to work too?"]
  - [schulz, "Ja, aber begrenzt. Die Regeln ändern sich — prüfen Sie es auf der Website.", "Yes, but limited. The rules change — check them on the website."]
  - [protagonist, "Und nach dem Studium?", "And after my studies?"]
  - [schulz, "Dann gibt es einen Titel für die Jobsuche. Kommen Sie rechtzeitig vorher.", "Then there's a permit for job hunting. Come in good time beforehand."]
teach:
  - ask: ["He says: your visa runs out in March.", "Ihr Visum läuft im März ab.", das-visum, laeuft-ab]
  - ask: ["Say: I'd like to extend it.", "Ich möchte verlängern.", verlaengern]
  - ask: ["Say: I'm here to study.", "Ich bin zum Studieren hier.", zum-studieren]
  - ask: ["He asks for the enrolment certificate.", "Die Immatrikulationsbescheinigung.", die-immatrikulation]
  - ask: ["Say: I've brought everything.", "Ich habe alles mitgebracht.", ich-habe-mitgebracht]
  - ask: ["Say: the residence permit.", "Der Aufenthaltstitel.", der-aufenthaltstitel]
  - ask: ["Ask: am I allowed to work?", "Darf ich arbeiten?", arbeiten-darf]
  - ask: ["He says: yes, but limited.", "Ja, aber begrenzt.", begrenzt]
  - ask: ["Say: I'll check it on the website.", "Ich prüfe es auf der Website.", pruefen]
  - note: ["Residence permits have a purpose: study, work, family, job hunting, au pair, asylum. Each has its own rules on working — and the number of days or hours students may work changes with the law. Check the current rules, and book the appointment months before the permit expires."]
