id: B2-25-m
tracks: [mk]
protagonist: f
title: ["Одборот на клубот за пензионери"]
situation: ["Во клубот за пензионери (Seniorentreff) се избира нов одбор. Госпоѓа Волф, мајката на Ања, ве предлага вас."]
learn: []
learn_missing: [formal-speech]
culture: Club democracy
items:
  - [der-seniorentreff, "der Seniorentreff", "клубот за пензионери", {rare: true}]
  - [der-vorstand, "der Vorstand", "одборот"]
  - [vorschlagen, "vorschlagen", "предлага"]
  - [die-abstimmung, "die Abstimmung", "гласањето"]
  - [ich-nehme-die-wahl-an, "Ich nehme die Wahl an", "Го прифаќам изборот"]
  - [das-vertrauen, "das Vertrauen", "довербата"]
  - [einstimmig, "einstimmig", "едногласно"]
  - [liebe-mitglieder, "Liebe Mitglieder", "Драги членови"]
  - [die-veranstaltung, "die Veranstaltung", "настанот"]
  - [organisieren, "organisieren", "организира"]
dialogue:
  - [frauwolf, "Für den Vorstand schlage ich Frau... na, Lukas Oma vor! Sie organisiert die besten Abende.", "За одборот ја предлагам госпоѓа... па, бабата на Лука! Таа ги организира најдобрите вечери."]
  - [protagonist, "Ich? Aber mein Deutsch!", "Јас? Но мојот германски!"]
  - [frauwolf, "Ist gut genug. Kommen wir zur Abstimmung. Wer ist dafür? ... Einstimmig!", "Доволно е добар. Да преминеме на гласање. Кој е за? ... Едногласно!"]
  - [protagonist, "Liebe Mitglieder, vielen Dank für Ihr Vertrauen. Ich nehme die Wahl an.", "Драги членови, ви благодарам за довербата. Го прифаќам изборот."]
  - [protagonist, "Ich werde jeden Monat eine Veranstaltung organisieren. Zuerst: ein mazedonischer Abend mit Musik und Essen!", "Секој месец ќе организирам настан. Прво: македонска вечер со музика и храна!"]
  - [frauwolf, "Wunderbar! Und ich bringe den Kuchen.", "Прекрасно! А јас ќе донесам колач."]
  - [protagonist, "Und Sie lernen ein mazedonisches Lied.", "А вие ќе научите една македонска песна."]
  - [frauwolf, "Abgemacht!", "Договорено!"]
teach:
  - ask: ["Кажете: клубот за пензионери.", "Der Seniorentreff.", der-seniorentreff]
  - ask: ["Таа ве предлага. Што вели?", "Ich schlage sie vor.", vorschlagen]
  - ask: ["Кажете: за одборот.", "Für den Vorstand.", der-vorstand]
  - ask: ["Таа вели: да преминеме на гласање.", "Kommen wir zur Abstimmung.", die-abstimmung]
  - ask: ["Кажете: едногласно.", "Einstimmig.", einstimmig]
  - note: ["Формалниот говор има фиксни формули: «Liebe Mitglieder» за почеток, «Vielen Dank für Ihr Vertrauen», «Ich nehme die Wahl an»."]
  - ask: ["Почнете го говорот.", "Liebe Mitglieder,", liebe-mitglieder]
  - ask: ["Заблагодарете за довербата.", "Vielen Dank für Ihr Vertrauen.", das-vertrauen]
  - ask: ["Прифатете го изборот.", "Ich nehme die Wahl an.", ich-nehme-die-wahl-an]
  - ask: ["Кажете: ќе организирам настан секој месец.", "Ich werde jeden Monat eine Veranstaltung organisieren.", organisieren, die-veranstaltung]
  - note: ["Клубовите за пензионери (Seniorentreff), често во општината или црквата, нудат кафе, излети, курсеви и друштво. Добредојдени се и луѓе што не зборуваат совршено германски — а македонска вечер е одличен начин да се запознаат соседите."]
