id: A1-20
protagonist: m
title: ["The week", "الأسبوع", "Неделата"]
situation:
  - "Jonas wants to meet up. Your week is full of appointments."
  - "يوناس يريد أن يلتقي بك. أسبوعك مليء بالمواعيد."
  - "Јонас сака да се видите. Неделата ви е полна со термини."
learn: [a1-time-words]
culture: Calendars for everything
items:
  - [hast-du-zeit, "Hast du Zeit?", "Do you have time? (informal)", "هل عندك وقت؟", "Имаш ли време?"]
  - [am-montag, "am Montag", "on Monday", "يوم الاثنين", "во понеделник"]
  - [keine-zeit, "keine Zeit", "no time", "لا وقت", "немам време"]
  - [am-dienstag, "am Dienstag", "on Tuesday", "يوم الثلاثاء", "во вторник"]
  - [am-mittwoch, "am Mittwoch", "on Wednesday", "يوم الأربعاء", "во среда"]
  - [am-donnerstag, "am Donnerstag", "on Thursday", "يوم الخميس", "во четврток"]
  - [am-freitag, "am Freitag", "on Friday", "يوم الجمعة", "во петок"]
  - [am-wochenende, "am Wochenende", "at the weekend", "في عطلة نهاية الأسبوع", "за викендот"]
  - [heute, "heute", "today", "اليوم", "денес"]
  - [morgen, "morgen", "tomorrow", "غدًا", "утре"]
  - [passt-dir, "Passt dir …?", "Does … suit you? (informal)", "هل يناسبك …؟", "Ти одговара ли …?"]
  - [abgemacht, "Abgemacht!", "Deal!", "اتفقنا!", "Договорено!"]
dialogue:
  - [jonas, "Hast du diese Woche Zeit? Für ein Bier?", "Do you have time this week? For a beer?", "هل عندك وقت هذا الأسبوع؟ لشرب شيء؟", "Имаш ли време оваа недела? За едно пиво?"]
  - [protagonist, "Am Montag habe ich keine Zeit. Da ist der Arzt.", "On Monday I have no time. That's the doctor.", "يوم الاثنين ليس عندي وقت. عندي موعد مع الطبيب.", "Во понеделник немам време. Тогаш е докторот."]
  - [jonas, "Und am Dienstag?", "And on Tuesday?", "ويوم الثلاثاء؟", "А во вторник?"]
  - [protagonist, "Dienstag ist die Bank, Mittwoch das Amt.", "Tuesday is the bank, Wednesday the office.", "الثلاثاء البنك، والأربعاء الدائرة.", "Во вторник банката, во среда службата."]
  - [jonas, "Donnerstag? Freitag?", "Thursday? Friday?", "الخميس؟ الجمعة؟", "Четврток? Петок?"]
  - [protagonist, "Am Donnerstag kann ich. Heute ist Montag, oder?", "On Thursday I can. Today is Monday, right?", "يوم الخميس أستطيع. اليوم الاثنين، أليس كذلك؟", "Во четврток можам. Денес е понеделник, нели?"]
  - [jonas, "Nein, heute ist Dienstag! Morgen ist Mittwoch.", "No, today's Tuesday! Tomorrow is Wednesday.", "لا، اليوم الثلاثاء! وغدًا الأربعاء.", "Не, денес е вторник! Утре е среда."]
  - [protagonist, "Oh nein, die Bank! ... Passt dir Donnerstag um sieben?", "Oh no, the bank! ... Does Thursday at seven suit you?", "يا للأسف، البنك! ... هل يناسبك الخميس في السابعة؟", "О не, банката! ... Ти одговара ли четврток во седум?"]
  - [jonas, "Abgemacht!", "Deal!", "اتفقنا!", "Договорено!"]
teach:
  - ask: ["Jonas asks: do you have time?", "يوناس يسأل: هل عندك وقت؟", "Јонас прашува: имаш ли време?", "Hast du Zeit?", hast-du-zeit]
  - ask: ["Say: on Monday I have no time.", "قل: يوم الاثنين ليس عندي وقت.", "Кажете: во понеделник немам време.", "Am Montag habe ich keine Zeit.", am-montag, keine-zeit]
  - note: ["Days with «am»: «am Montag», «am Freitag»; the weekend: «am Wochenende». Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag.", "الأيام مع «am»: «am Montag»، «am Freitag»؛ وعطلة نهاية الأسبوع: «am Wochenende». Montag، Dienstag، Mittwoch، Donnerstag، Freitag، Samstag، Sonntag.", "Деновите со «am»: «am Montag», «am Freitag»; викендот: «am Wochenende». Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag."]
  - ask: ["Ask: and on Tuesday?", "اسأل: ويوم الثلاثاء؟", "Прашајте: а во вторник?", "Und am Dienstag?", am-dienstag]
  - ask: ["Say: on Wednesday, the office.", "قل: يوم الأربعاء، الدائرة.", "Кажете: во среда, службата.", "Am Mittwoch das Amt.", am-mittwoch]
  - ask: ["Say: on Thursday I can.", "قل: يوم الخميس أستطيع.", "Кажете: во четврток можам.", "Am Donnerstag kann ich.", am-donnerstag]
  - ask: ["Ask: and Friday?", "اسأل: والجمعة؟", "Прашајте: а петок?", "Und am Freitag?", am-freitag]
  - ask: ["Say: at the weekend.", "قل: في عطلة نهاية الأسبوع.", "Кажете: за викендот.", "Am Wochenende.", am-wochenende]
  - ask: ["Say: today is Tuesday, tomorrow is Wednesday.", "قل: اليوم الثلاثاء، وغدًا الأربعاء.", "Кажете: денес е вторник, утре е среда.", "Heute ist Dienstag, morgen ist Mittwoch.", heute, morgen]
  - ask: ["Ask: does Thursday at seven suit you?", "اسأل: هل يناسبك الخميس في السابعة؟", "Прашајте: ти одговара ли четврток во седум?", "Passt dir Donnerstag um sieben?", passt-dir]
  - ask: ["He says: deal!", "يقول: اتفقنا!", "Тој вели: договорено!", "Abgemacht!", abgemacht]
  - note: ["Even friends plan days ahead; a spontaneous visit is rare. Once agreed, a time is kept — cancel early if you can't make it.", "حتى الأصدقاء يخططون قبل أيام؛ والزيارة المفاجئة نادرة. وإذا اتُّفق على موعد فيُحترم — ألغِه مبكرًا إن لم تستطع.", "Дури и пријателите се договараат неколку дена однапред; спонтана посета е ретка. Договореното време се почитува — откажете навреме ако не можете."]
