id: A1-11-e
tracks: [en]
protagonist: f
title: ["The first lecture"]
situation: ["Your first lecture. You find the hall at ten to eight — and Jonas is in your course."]
learn: [a1-modal-muessen]
culture: Seated before the hour
items:
  - [der-hoersaal, "der Hörsaal", "the lecture hall", {rare: true}]
  - [die-vorlesung, "die Vorlesung", "the lecture"]
  - [beginnt, "beginnt", "begins"]
  - [wir-muessen, "wir müssen", "we have to"]
  - [puenktlich, "pünktlich", "on time"]
  - [setz-dich, "Setz dich!", "Sit down! (informal)"]
  - [muss-ich, "Muss ich …?", "Do I have to …?"]
  - [online, "online", "online"]
  - [die-pruefung, "die Prüfung", "the exam"]
  - [die-folien, "die Folien", "the slides", {rare: true}]
  - [viel-lernen, "viel lernen", "study a lot"]
dialogue:
  - [protagonist, "Entschuldigung, ist das der Hörsaal drei?", "Excuse me, is this lecture hall three?"]
  - [jonas, "Ja! Du auch hier? Die Vorlesung beginnt um acht.", "Yes! You're here too? The lecture begins at eight."]
  - [protagonist, "Um acht? Es ist schon zehn vor acht!", "At eight? It's already ten to eight!"]
  - [jonas, "Genau, wir müssen pünktlich sein. Komm, setz dich!", "Exactly, we have to be on time. Come on, sit down!"]
  - [protagonist, "Muss ich mich für den Kurs anmelden?", "Do I have to register for the course?"]
  - [jonas, "Ja, online. Und für die Prüfung auch.", "Yes, online. And for the exam too."]
  - [protagonist, "Und die Folien?", "And the slides?"]
  - [jonas, "Die Folien sind online, im Portal.", "The slides are online, in the portal."]
  - [protagonist, "Okay. Ich muss viel lernen!", "OK. I have to study a lot!"]
teach:
  - ask: ["Ask: is this lecture hall three?", "Ist das der Hörsaal drei?", der-hoersaal]
  - ask: ["Say: the lecture begins at eight.", "Die Vorlesung beginnt um acht.", die-vorlesung, beginnt]
  - note: ["«müssen» — have to: «ich muss», «du musst», «wir müssen». The second verb goes to the end: «Wir müssen pünktlich sein»."]
  - ask: ["Say: we have to be on time.", "Wir müssen pünktlich sein.", wir-muessen, puenktlich]
  - ask: ["Jonas says: sit down!", "Setz dich!", setz-dich]
  - ask: ["Ask: do I have to register?", "Muss ich mich anmelden?", muss-ich, mich-anmelden]
  - ask: ["Say: online.", "Online.", online]
  - ask: ["Say: and for the exam too.", "Und für die Prüfung auch.", die-pruefung, auch]
  - ask: ["Ask: and the slides?", "Und die Folien?", die-folien]
  - ask: ["Say: I have to study a lot!", "Ich muss viel lernen!", viel-lernen]
  - note: ["Students are seated before the hour; walking in late is noticed. You register yourself, online, for courses and for each exam — nobody does it for you, and deadlines are firm. Exam rules are in your programme's regulations (Prüfungsordnung)."]
