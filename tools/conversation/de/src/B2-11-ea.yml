id: B2-11-ea
tracks: [en, ar]
protagonist: m
title: ["The job interview", "مقابلة العمل"]
situation:
  - "Your cover letter worked: an interview with Herr Lange, head of personnel. Afterwards Tim wants every detail."
  - "رسالة التقديم نجحت: مقابلة مع السيد لانغه، رئيس شؤون الموظفين. بعدها يريد تيم كل التفاصيل."
learn: [b2-indirect-speech]
culture: Gaps and motivation
items:
  - [das-vorstellungsgespraech, "das Vorstellungsgespräch", "the job interview", "مقابلة العمل", {rare: true}]
  - [die-luecke, "die Lücke im Lebenslauf", "the gap in the CV", "الفجوة في السيرة الذاتية"]
  - [die-motivation, "die Motivation", "the motivation", "الدافع"]
  - [er-fragte-warum, "er fragte, warum …", "he asked why …", "سألني لماذا …"]
  - [er-wollte-wissen, "er wollte wissen, ob …", "he wanted to know whether …", "أراد أن يعرف إن كان …"]
  - [die-gehaltsvorstellung, "die Gehaltsvorstellung", "salary expectation", "الراتب المتوقَّع", {rare: true}]
  - [die-staerken-schwaechen, "Stärken und Schwächen", "strengths and weaknesses", "نقاط القوة والضعف"]
  - [ich-habe-mich-informiert, "ich habe mich informiert", "I did my research", "اطّلعتُ على المعلومات"]
  - [haben-sie-fragen, "Haben Sie noch Fragen?", "Do you have any questions?", "هل لديك أسئلة؟"]
  - [die-probezeit, "die Probezeit", "the probation period", "فترة التجربة"]
dialogue:
  - [lange, "Warum möchten Sie bei uns arbeiten?", "Why would you like to work for us?", "لماذا تريد العمل لدينا؟"]
  - [protagonist, "Ich habe mich über Ihre Firma informiert. Ihre Projekte passen zu meiner Erfahrung.", "I've researched your company. Your projects fit my experience.", "اطّلعتُ على معلومات عن شركتكم. مشاريعكم تناسب خبرتي."]
  - [lange, "Hier ist eine Lücke im Lebenslauf. Was haben Sie damals gemacht?", "There's a gap in your CV here. What were you doing then?", "هنا فجوة في السيرة الذاتية. ماذا كنت تفعل حينها؟"]
  - [protagonist, "Ich habe Deutsch gelernt und meine Familie unterstützt. Das war meine Motivation.", "I was learning German and supporting my family. That was my motivation.", "كنتُ أتعلّم الألمانية وأدعم عائلتي. كان ذلك دافعي."]
  - [lange, "Und Ihre Gehaltsvorstellung? ... Gut. Haben Sie noch Fragen?", "And your salary expectation? ... Good. Do you have any questions?", "وما الراتب الذي تتوقّعه؟ ... جيد. هل لديك أسئلة؟"]
  - [protagonist, "Wie lange dauert die Probezeit?", "How long is the probation period?", "كم تستغرق فترة التجربة؟"]
  - [tim, "Und? Erzähl! Was hat er gefragt?", "So? Tell me! What did he ask?", "وماذا؟ احكِ لي! ماذا سأل؟"]
  - [protagonist, "Er fragte, warum ich dort arbeiten möchte. Und er wollte wissen, ob ich Fragen habe.", "He asked why I want to work there. And he wanted to know whether I had questions.", "سألني لماذا أريد العمل هناك. وأراد أن يعرف إن كانت لديّ أسئلة."]
  - [tim, "Und die Lücke?", "And the gap?", "والفجوة؟"]
  - [protagonist, "Ich habe sie erklärt. Ehrlich und kurz.", "I explained it. Honestly and briefly.", "شرحتُها. بصدق واختصار."]
teach:
  - ask: ["Say: the job interview.", "قل: مقابلة العمل.", "Das Vorstellungsgespräch.", das-vorstellungsgespraech]
  - ask: ["Say: I've researched your company.", "قل: اطّلعتُ على معلومات عن شركتكم.", "Ich habe mich über Ihre Firma informiert.", ich-habe-mich-informiert]
  - ask: ["He points to a gap in the CV.", "يشير إلى فجوة في السيرة الذاتية.", "Eine Lücke im Lebenslauf.", die-luecke]
  - ask: ["Say: that was my motivation.", "قل: كان ذلك دافعي.", "Das war meine Motivation.", die-motivation]
  - ask: ["He asks your salary expectation.", "يسأل عن الراتب المتوقَّع.", "Ihre Gehaltsvorstellung?", die-gehaltsvorstellung]
  - ask: ["He asks: do you have any questions?", "يسأل: هل لديك أسئلة؟", "Haben Sie noch Fragen?", haben-sie-fragen]
  - ask: ["Ask: how long is the probation period?", "اسأل: كم تستغرق فترة التجربة؟", "Wie lange dauert die Probezeit?", die-probezeit]
  - note: ["Reporting questions: question word or «ob» + verb at the end. «Er fragte, warum ich dort arbeiten möchte», «Er wollte wissen, ob ich Fragen habe».", "نقل الأسئلة: كلمة السؤال أو «ob» ثم الفعل في الآخر. «Er fragte, warum ich dort arbeiten möchte»، «Er wollte wissen, ob ich Fragen habe»."]
  - ask: ["Report: he asked why I want to work there.", "انقل: سألني لماذا أريد العمل هناك.", "Er fragte, warum ich dort arbeiten möchte.", er-fragte-warum]
  - ask: ["Report: he wanted to know whether I had questions.", "انقل: أراد أن يعرف إن كانت لديّ أسئلة.", "Er wollte wissen, ob ich Fragen habe.", er-wollte-wissen]
  - ask: ["Say: strengths and weaknesses.", "قل: نقاط القوة والضعف.", "Stärken und Schwächen.", die-staerken-schwaechen]
  - note: ["German interviewers ask about every gap in the CV — explain it briefly and honestly (language course, family, migration are fine reasons). Always have a question ready at the end; 'none' sounds uninterested. Probation is usually up to six months, with short notice on both sides.", "المحاورون الألمان يسألون عن كل فجوة في السيرة الذاتية — اشرحها باختصار وصدق (دورة لغة، العائلة، الهجرة أسباب مقبولة). جهّز دائمًا سؤالًا للنهاية؛ فعبارة «لا شيء» تبدو عدم اهتمام. فترة التجربة عادةً حتى ستة أشهر، مع مهلة إنهاء قصيرة للطرفين."]
