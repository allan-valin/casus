id: A1-02-a
tracks: [ar]
protagonist: m
title: ["الحضانة"]
situation: ["اليوم الأول لابنتك يارا في الحضانة (الكيتا). ترافقها إلى الباب وتستقبلكما المربية."]
learn: [a1-article]
culture: The Kita
items:
  - [guten-morgen, "Guten Morgen", "صباح الخير"]
  - [der-papa, "der Papa", "الأب، بابا"]
  - [das-ist, "Das ist …", "هذا / هذه …"]
  - [die-kita, "die Kita", "الحضانة (الكيتا)"]
  - [die-erzieherin, "die Erzieherin", "المربية"]
  - [hallo, "Hallo", "مرحبًا (غير رسمي)"]
  - [ich-will, "ich will", "أريد"]
  - [nach-hause, "nach Hause", "إلى البيت"]
  - [keine-angst, "Keine Angst!", "لا تخف! / لا تخافي!"]
  - [wann, "Wann …?", "متى …؟"]
  - [holen-ab, "holen … ab", "تأخذون (أحدًا) من مكان، تأتون لأخذه"]
  - [um-drei-uhr, "um drei Uhr", "في الساعة الثالثة"]
  - [tschuess, "Tschüss!", "إلى اللقاء! (غير رسمي)"]
  - [bis-spaeter, "Bis später!", "أراك لاحقًا!"]
dialogue:
  - [kruger, "Guten Morgen! Sie sind der Papa von Yara?", "صباح الخير! أنت والد يارا؟"]
  - [protagonist, "Ja, guten Morgen. Das ist Yara.", "نعم، صباح الخير. هذه يارا."]
  - [kruger, "Hallo, Yara! Ich bin Frau Krüger, die Erzieherin.", "مرحبًا يا يارا! أنا السيدة كروغر، المربية."]
  - [yara, "Papa, ich will nach Hause!", "بابا، أريد أن أذهب إلى البيت!"]
  - [protagonist, "Yara, das ist die Kita. Das ist gut.", "يارا، هذه هي الحضانة. هذا جيد."]
  - [kruger, "Keine Angst, Yara. Wann holen Sie Yara ab?", "لا تخافي يا يارا. متى تأتي لأخذ يارا؟"]
  - [protagonist, "Um drei Uhr.", "في الساعة الثالثة."]
  - [kruger, "Gut. Tschüss, Papa! Bis später!", "حسنًا. إلى اللقاء يا بابا! أراك لاحقًا!"]
  - [protagonist, "Tschüss, Yara! Bis später!", "إلى اللقاء يا يارا! أراكِ لاحقًا!"]
teach:
  - note: ["في الصباح يقول الناس «Guten Morgen». ومع الأطفال والأصدقاء يكفي «Hallo»."]
  - ask: ["حيِّ المربية في الصباح.", "Guten Morgen.", guten-morgen]
  - ask: ["تسألك إن كنت والد يارا. قل: نعم، أنا الأب.", "Ja, ich bin der Papa.", ja, ich-bin, der-papa]
  - note: ["لكل اسم في الألمانية جنس، وأداة التعريف تُظهره: «der» للمذكر، و«die» للمؤنث، و«das» للمحايد. «der Papa»، «die Kita»، «das Kind». احفظ كل اسم مع أداته."]
  - ask: ["قدّم ابنتك: هذه يارا.", "Das ist Yara.", das-ist]
  - ask: ["قل: هذه هي الحضانة.", "Das ist die Kita.", das-ist, die-kita]
  - ask: ["قل بلسانها: أنا المربية.", "Ich bin die Erzieherin.", die-erzieherin]
  - ask: ["حيِّ يارا كما تحييها المربية.", "Hallo, Yara!", hallo]
  - ask: ["يارا تبكي: أريد أن أذهب إلى البيت! قلها.", "Ich will nach Hause!", ich-will, nach-hause]
  - ask: ["طمئنها: لا تخافي!", "Keine Angst!", keine-angst]
  - note: ["«abholen» فعل منفصل: «Ich hole Yara ab» — آتي لأخذ يارا. الجزء «ab» يذهب إلى آخر الجملة."]
  - ask: ["تسألك المربية: متى تأتي لأخذ يارا؟", "Wann holen Sie Yara ab?", wann, holen-ab]
  - ask: ["أجب: في الساعة الثالثة.", "Um drei Uhr.", um-drei-uhr]
  - ask: ["ودّع يارا بطريقة غير رسمية.", "Tschüss, Yara!", tschuess]
  - ask: ["وأضف: أراكِ لاحقًا!", "Bis später!", bis-spaeter]
  - note: ["الأسابيع الأولى في الحضانة «Eingewöhnung»، أي فترة التعوّد: يبقى أحد الوالدين مع الطفل في البداية ساعة أو ساعتين، ثم وقتًا أقل كل يوم. وتبدأ المواعيد بدقة: من يتأخر في أخذ الطفل يتلقى اتصالًا."]
