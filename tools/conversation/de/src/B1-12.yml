id: B1-12
protagonist: m
title: ["Statistics", "الإحصاء", "Статистика"]
situation:
  - "The evening news shows a poll. Frau Becker and you argue about what the numbers really say."
  - "نشرة الأخبار المسائية تعرض استطلاعًا. أنت والسيدة بيكر تتجادلان حول ما تقوله الأرقام حقًا."
  - "Вечерните вести прикажуваат анкета. Вие и госпоѓа Бекер се расправате што навистина кажуваат бројките."
learn: [de-vsub_02]
culture: Reading a poll
items:
  - [die-umfrage, "die Umfrage", "the poll, the survey", "الاستطلاع", "анкетата"]
  - [der-durchschnitt, "der Durchschnitt", "the average", "المتوسط", "просекот"]
  - [die-mehrheit, "die Mehrheit", "the majority", "الأغلبية", "мнозинството"]
  - [befragt, "befragt", "asked, surveyed", "سُئلوا", "анкетирани"]
  - [die-grafik, "die Grafik", "the chart", "الرسم البياني", "графиконот"]
  - [koennten-sie, "Könnten Sie …?", "Could you …? (polite)", "هل يمكنكِ …؟", "Дали би можеле …?"]
  - [haetten-sie, "Hätten Sie …?", "Would you have …? (polite)", "هل لديكِ …؟", "Дали би имале …?"]
  - [waere-es, "Wäre es möglich …?", "Would it be possible …?", "هل يمكن …؟", "Дали би било можно …?"]
  - [reprasentativ, "repräsentativ", "representative", "تمثيلي", "репрезентативно", {rare: true}]
  - [die-quelle-info, "die Quelle", "the source", "المصدر", "изворот"]
dialogue:
  - [becker, "Sehen Sie! Die Mehrheit ist gegen das neue Gesetz. Sechzig Prozent!", "See! The majority is against the new law. Sixty per cent!", "انظر! الأغلبية ضد القانون الجديد. ستون بالمئة!", "Гледате! Мнозинството е против новиот закон. Шеесет проценти!"]
  - [protagonist, "Wie viele Leute wurden befragt?", "How many people were asked?", "كم شخصًا سُئلوا؟", "Колку луѓе беа анкетирани?"]
  - [becker, "Tausend. Ist das nicht genug?", "A thousand. Isn't that enough?", "ألف. أليس هذا كافيًا؟", "Илјада. Зарем не е доволно?"]
  - [protagonist, "Wenn die Umfrage repräsentativ ist, ja. Was ist die Quelle?", "If the poll is representative, yes. What's the source?", "إذا كان الاستطلاع تمثيليًا، نعم. ما المصدر؟", "Ако анкетата е репрезентативна, да. Кој е изворот?"]
  - [becker, "Das steht klein unter der Grafik.", "It's in small print under the chart.", "مكتوب بخط صغير تحت الرسم البياني.", "Пишува ситно под графиконот."]
  - [protagonist, "Könnten Sie das Bild anhalten? ... Online befragt, nur Menschen über sechzig.", "Could you pause the picture? ... Surveyed online, only people over sixty.", "هل يمكنكِ إيقاف الصورة؟ ... سُئلوا على الإنترنت، فقط من تجاوزوا الستين.", "Дали би можеле да ја запрете сликата? ... Анкетирани на интернет, само луѓе над шеесет."]
  - [becker, "Hm. Dann ist es nicht der Durchschnitt aller Deutschen.", "Hm. Then it isn't the average of all Germans.", "همم. إذن ليس متوسط كل الألمان.", "Хм. Тогаш тоа не е просекот на сите Германци."]
  - [protagonist, "Genau. Hätten Sie Lust auf einen Tee? Dann diskutieren wir weiter.", "Exactly. Would you fancy a tea? Then we'll keep discussing.", "بالضبط. هل لديكِ رغبة في شاي؟ ثم نواصل النقاش.", "Точно. Дали би сакале чај? Па ќе продолжиме да дискутираме."]
teach:
  - ask: ["Say: the majority is against it.", "قل: الأغلبية ضده.", "Кажете: мнозинството е против.", "Die Mehrheit ist dagegen.", die-mehrheit]
  - ask: ["Ask: how many people were asked?", "اسأل: كم شخصًا سُئلوا؟", "Прашајте: колку луѓе беа анкетирани?", "Wie viele Leute wurden befragt?", befragt]
  - ask: ["Say: if the poll is representative.", "قل: إذا كان الاستطلاع تمثيليًا.", "Кажете: ако анкетата е репрезентативна.", "Wenn die Umfrage repräsentativ ist.", die-umfrage, reprasentativ]
  - ask: ["Ask: what's the source?", "اسأل: ما المصدر؟", "Прашајте: кој е изворот?", "Was ist die Quelle?", die-quelle-info]
  - ask: ["Say: under the chart.", "قل: تحت الرسم البياني.", "Кажете: под графиконот.", "Unter der Grafik.", die-grafik]
  - note: ["Konjunktiv II makes requests polite: «Könnten Sie…?» (could you), «Hätten Sie…?» (would you have), «Wäre es möglich…?» (would it be possible).", "صيغة التمني تجعل الطلب مؤدبًا: «Könnten Sie…?» (هل يمكنكِ)، «Hätten Sie…?» (هل لديكِ)، «Wäre es möglich…?» (هل يمكن).", "Konjunktiv II ги прави барањата учтиви: «Könnten Sie…?» (дали би можеле), «Hätten Sie…?» (дали би имале), «Wäre es möglich…?» (дали би било можно)."]
  - ask: ["Ask politely: could you pause the picture?", "اسأل بأدب: هل يمكنكِ إيقاف الصورة؟", "Прашајте учтиво: дали би можеле да ја запрете сликата?", "Könnten Sie das Bild anhalten?", koennten-sie]
  - ask: ["Say: then it isn't the average.", "قل: إذن ليس المتوسط.", "Кажете: тогаш тоа не е просекот.", "Dann ist es nicht der Durchschnitt.", der-durchschnitt]
  - ask: ["Ask politely: would you fancy a tea?", "اسأل بأدب: هل لديكِ رغبة في شاي؟", "Прашајте учтиво: дали би сакале чај?", "Hätten Sie Lust auf einen Tee?", haetten-sie]
  - ask: ["Ask: would it be possible?", "اسأل: هل يمكن ذلك؟", "Прашајте: дали би било можно?", "Wäre es möglich?", waere-es]
  - note: ["Before trusting a poll, ask who was asked, how many, how (online, phone) and by whom. The small print under the chart usually tells you.", "قبل أن تثق باستطلاع، اسأل: من سُئل، وكم عددهم، وكيف (عبر الإنترنت أو الهاتف)، ومن أجراه. الخط الصغير تحت الرسم يخبرك غالبًا.", "Пред да ѝ верувате на анкета, прашајте кој бил анкетиран, колку, како (на интернет, по телефон) и од кого. Ситните букви под графиконот обично кажуваат."]
