id: B2-02
protagonist: m
title: ["That won't do", "هذا لا يصلح", "Така не оди"]
situation:
  - "An order went wrong. Frau Schröder is blunt. Afterwards, a colleague explains it wasn't anger."
  - "طلبية سارت بشكل خاطئ. السيدة شرودر صريحة جدًا. بعدها يشرح لك زميل أنه لم يكن غضبًا."
  - "Една нарачка тргна наопаку. Госпоѓа Шредер е груба. Потоа колега ви објаснува дека тоа не бил гнев."
learn: [de-mis_04]
culture: Directness is not anger
items:
  - [das-geht-so-nicht, "Das geht so nicht", "That won't do", "هذا لا يصلح هكذا", "Така не оди"]
  - [sachlich, "sachlich", "matter-of-fact", "موضوعي", "деловно, објективно"]
  - [nicht-persoenlich, "nicht persönlich", "not personal", "ليس شخصيًا", "не лично"]
  - [doch-mal, "doch mal", "(softening) just, do", "(للتلطيف) هيا، فقط", "(омекнување) ајде, само"]
  - [halt, "halt", "(particle) just, that's how it is", "(أداة) هكذا هو الأمر", "(честичка) едноставно"]
  - [eben, "eben", "(particle) exactly, simply", "(أداة) بالضبط، ببساطة", "(честичка) токму, едноставно"]
  - [ja-particle, "ja", "(particle) as you know", "(أداة) كما تعلم", "(честичка) како што знаете"]
  - [der-fehler, "der Fehler", "the mistake", "الخطأ", "грешката"]
  - [kommt-vor, "kommt vor", "happens", "يحدث", "се случува"]
  - [die-bestellung, "die Bestellung", "the order", "الطلبية", "нарачката"]
  - [beim-naechsten-mal, "beim nächsten Mal", "next time", "في المرة القادمة", "следниот пат"]
dialogue:
  - [schroeder, "Die Bestellung war falsch. Das geht so nicht.", "The order was wrong. That won't do.", "الطلبية كانت خاطئة. هذا لا يصلح هكذا.", "Нарачката беше погрешна. Така не оди."]
  - [protagonist, "Es tut mir leid. Das war mein Fehler.", "I'm sorry. That was my mistake.", "أنا آسف. كان ذلك خطئي.", "Ми е жал. Тоа беше моја грешка."]
  - [schroeder, "Prüfen Sie doch mal die Liste vor dem Senden. Beim nächsten Mal bitte.", "Just check the list before sending. Next time, please.", "راجع القائمة قبل الإرسال فقط. في المرة القادمة من فضلك.", "Ајде проверете ја листата пред да ја пратите. Следниот пат, ве молам."]
  - [protagonist, "Natürlich.", "Of course.", "طبعًا.", "Се разбира."]
  - [tim, "Alles okay? Du siehst blass aus.", "All OK? You look pale.", "هل كل شيء بخير؟ تبدو شاحبًا.", "Сѐ во ред? Изгледаш бледо."]
  - [protagonist, "Sie war so wütend!", "She was so angry!", "كانت غاضبة جدًا!", "Беше толку лута!"]
  - [tim, "Nee, das war nur sachlich. Nicht persönlich. Fehler kommen ja vor.", "Nah, that was just matter-of-fact. Not personal. Mistakes happen, you know.", "لا، كان ذلك موضوعيًا فقط. ليس شخصيًا. الأخطاء تحدث كما تعلم.", "Не, тоа беше само деловно. Не лично. Грешки се случуваат, знаеш."]
  - [protagonist, "Bei uns hätte sie geschrien, wenn sie wütend gewesen wäre.", "Where I'm from she'd have shouted if she'd been angry.", "عندنا لكانت صرخت لو كانت غاضبة.", "Кај нас ќе викаше ако беше лута."]
  - [tim, "Eben. Sie hat nicht geschrien. Sie ist halt so.", "Exactly. She didn't shout. That's just how she is.", "بالضبط. لم تصرخ. هي هكذا فقط.", "Токму. Не викаше. Таква е едноставно."]
teach:
  - ask: ["She says: that won't do.", "تقول: هذا لا يصلح هكذا.", "Таа вели: така не оди.", "Das geht so nicht.", das-geht-so-nicht]
  - ask: ["Say: the order was wrong.", "قل: الطلبية كانت خاطئة.", "Кажете: нарачката беше погрешна.", "Die Bestellung war falsch.", die-bestellung]
  - ask: ["Say: that was my mistake.", "قل: كان ذلك خطئي.", "Кажете: тоа беше моја грешка.", "Das war mein Fehler.", der-fehler]
  - note: ["Small particles change the tone: «doch mal» softens an order («Prüfen Sie doch mal…»), «ja» means 'as we both know', «halt» and «eben» mean 'that's just how it is'.", "الأدوات الصغيرة تغيّر النبرة: «doch mal» تلطّف الأمر («Prüfen Sie doch mal…»)، و«ja» تعني «كما نعلم كلانا»، و«halt» و«eben» تعنيان «هكذا هو الأمر».", "Малите честички го менуваат тонот: «doch mal» ја омекнува наредбата («Prüfen Sie doch mal…»), «ja» значи „како што двајцата знаеме“, «halt» и «eben» значат „така е едноставно“."]
  - ask: ["She says: just check the list.", "تقول: راجع القائمة فقط.", "Таа вели: ајде проверете ја листата.", "Prüfen Sie doch mal die Liste.", doch-mal]
  - ask: ["She says: next time, please.", "تقول: في المرة القادمة من فضلك.", "Таа вели: следниот пат, ве молам.", "Beim nächsten Mal bitte.", beim-naechsten-mal]
  - ask: ["Tim: that was just matter-of-fact.", "تيم: كان ذلك موضوعيًا فقط.", "Тим: тоа беше само деловно.", "Das war nur sachlich.", sachlich]
  - ask: ["Tim: not personal.", "تيم: ليس شخصيًا.", "Тим: не лично.", "Nicht persönlich.", nicht-persoenlich]
  - ask: ["Tim: mistakes happen, you know.", "تيم: الأخطاء تحدث كما تعلم.", "Тим: грешки се случуваат, знаеш.", "Fehler kommen ja vor.", kommt-vor, ja-particle]
  - ask: ["Tim: exactly.", "تيم: بالضبط.", "Тим: токму.", "Eben.", eben]
  - ask: ["Tim: that's just how she is.", "تيم: هي هكذا فقط.", "Тим: таква е едноставно.", "Sie ist halt so.", halt]
  - note: ["A calm, short «Das geht so nicht» is the normal German way to criticise at work — no shouting, no hints. It doesn't mean anger or a threat to your job. Fix the problem and move on.", "عبارة «Das geht so nicht» الهادئة القصيرة هي الطريقة الألمانية المعتادة للانتقاد في العمل — بلا صراخ ولا تلميح. لا تعني غضبًا ولا تهديدًا لوظيفتك. أصلح المشكلة وتابع.", "Мирното, кратко «Das geht so nicht» е нормалниот германски начин на критика на работа — без викање, без навестувања. Не значи гнев ниту закана за работата. Поправете го проблемот и продолжете."]
