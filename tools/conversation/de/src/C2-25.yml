id: C2-25
protagonist: f
title: ["A poem", "قصيدة", "Песна"]
situation:
  - "Autumn at the VHS. Professor Hartmann asks you to read Rilke's 'Herbsttag' aloud — rhythm, rhyme and all."
  - "الخريف في الجامعة الشعبية. البروفيسور هارتمان يطلب منكِ قراءة قصيدة ريلكه «يوم خريفي» بصوت عالٍ — بإيقاعها وقافيتها."
  - "Есен на народниот универзитет. Професорот Хартман ве моли гласно да ја прочитате „Есенски ден“ од Рилке — со ритамот и римата."
learn: [c2-poetic-language]
culture: Reading poetry aloud
items:
  - [der-reim, "der Reim", "the rhyme", "القافية", "римата"]
  - [der-rhythmus, "der Rhythmus", "the rhythm", "الإيقاع", "ритамот"]
  - [die-strophe, "die Strophe", "the stanza", "المقطع الشعري", "строфата"]
  - [der-dichter-c2, "Rainer Maria Rilke", "Rainer Maria Rilke (poet, 1875–1926)", "راينر ماريا ريلكه (شاعر)", "Рајнер Марија Рилке (поет)"]
  - [die-sonnenuhr, "die Sonnenuhr", "the sundial", "المزولة", "сончевиот часовник"]
  - [die-vollendung, "die Vollendung", "completion, perfection", "الاكتمال", "довршувањето"]
  - [die-suesse, "die Süße", "sweetness", "الحلاوة", "сладоста"]
  - [vortragen, "vortragen", "recite, perform", "يُلقي", "рецитира"]
  - [die-betonung, "die Betonung", "the stress, emphasis", "النبر", "нагласокот"]
  - [die-melancholie, "die Melancholie", "melancholy", "الكآبة الشجيّة", "меланхолијата"]
dialogue:
  - [hartmann, "Bitte tragen Sie die erste Strophe vor. Achten Sie auf den Rhythmus.", "Please recite the first stanza. Pay attention to the rhythm.", "من فضلكِ ألقي المقطع الأول. انتبهي للإيقاع.", "Ве молам рецитирајте ја првата строфа. Внимавајте на ритамот."]
  - [protagonist, "„Herr: es ist Zeit. Der Sommer war sehr groß. Leg deinen Schatten auf die Sonnenuhren, und auf den Fluren lass die Winde los.“", "'Lord: it is time. The summer was immense. Lay your shadow on the sundials, and on the meadows let the winds loose.'", "«يا ربّ: لقد حان الوقت. كان الصيف عظيمًا جدًا. ضع ظلّك على المزاول، وأطلق الرياح على المروج.»", "„Господи: време е. Летото беше многу големо. Стави ја сенката своја на сончевите часовници, и по полињата пушти ги ветровите.“"]
  - [hartmann, "Schön. Hören Sie den Reim? „groß“ — „los“, „Sonnenuhren“ — „Fluren“.", "Lovely. Can you hear the rhyme? 'groß' — 'los', 'Sonnenuhren' — 'Fluren'.", "جميل. هل تسمعين القافية؟ «groß» — «los»، «Sonnenuhren» — «Fluren».", "Убаво. Ја слушате ли римата? „groß“ — „los“, „Sonnenuhren“ — „Fluren“."]
  - [protagonist, "Ja. Und die Betonung — fünf Hebungen pro Zeile, wie ein langsamer Schritt.", "Yes. And the stress — five beats per line, like a slow step.", "نعم. والنبر — خمس نبرات في كل سطر، كخطوة بطيئة.", "Да. И нагласокот — пет удари во стих, како бавен чекор."]
  - [hartmann, "Genau. Und die letzte Strophe?", "Exactly. And the last stanza?", "بالضبط. والمقطع الأخير؟", "Точно. А последната строфа?"]
  - [protagonist, "„Wer jetzt kein Haus hat, baut sich keines mehr. Wer jetzt allein ist, wird es lange bleiben.“", "'Whoever has no house now will not build one. Whoever is alone now will long remain so.'", "«من لا بيت له الآن لن يبني بيتًا بعد. ومن هو وحيد الآن سيبقى وحيدًا طويلًا.»", "„Кој сега нема куќа, повеќе нема да гради. Кој сега е сам, долго ќе остане.“"]
  - [hartmann, "Wie klingt das für Sie?", "How does that sound to you?", "كيف يبدو لكِ ذلك؟", "Како ви звучи тоа?"]
  - [protagonist, "Nach Melancholie. Aber ich habe hier ein Haus gefunden — und bin nicht allein. Also lese ich es mit einem Lächeln.", "Like melancholy. But I've found a home here — and I'm not alone. So I read it with a smile.", "كآبة شجيّة. لكنني وجدتُ هنا بيتًا — ولستُ وحيدة. لذلك أقرؤها بابتسامة.", "Како меланхолија. Но јас тука најдов дом — и не сум сама. Затоа ја читам со насмевка."]
teach:
  - ask: ["Say: recite the first stanza.", "قولي: ألقي المقطع الأول.", "Кажете: рецитирај ја првата строфа.", "Die erste Strophe vortragen.", vortragen, die-strophe]
  - ask: ["Say: pay attention to the rhythm.", "قولي: انتبهي للإيقاع.", "Кажете: внимавај на ритамот.", "Auf den Rhythmus achten.", der-rhythmus]
  - ask: ["Recite: Lord, it is time. The summer was immense.", "ألقي: يا ربّ، لقد حان الوقت. كان الصيف عظيمًا.", "Рецитирајте: Господи, време е. Летото беше големо.", "Herr: es ist Zeit. Der Sommer war sehr groß.", der-dichter-c2]
  - note: ["Poetic language bends normal German: imperatives to God («Leg deinen Schatten…»), inverted word order («und auf den Fluren lass die Winde los»), and rare nouns («die Vollendung», «die Süße»). Read it slowly, with the stress on every second syllable.", "اللغة الشعرية تثني الألمانية العادية: أوامر موجّهة إلى الله («Leg deinen Schatten…»)، وترتيب كلمات مقلوب («und auf den Fluren lass die Winde los»)، وأسماء نادرة («die Vollendung»، «die Süße»). اقرئيها ببطء والنبر على كل مقطع ثانٍ.", "Поетскиот јазик го свиткува обичниот германски: императиви кон Бога («Leg deinen Schatten…»), превртен ред на зборовите («und auf den Fluren lass die Winde los»), ретки именки («die Vollendung», «die Süße»). Читајте бавно, со нагласок на секој втор слог."]
  - ask: ["Say: the sundials.", "قولي: المزاول.", "Кажете: сончевите часовници.", "Die Sonnenuhren.", die-sonnenuhr]
  - ask: ["He asks: can you hear the rhyme?", "يسأل: هل تسمعين القافية؟", "Тој прашува: ја слушате ли римата?", "Hören Sie den Reim?", der-reim]
  - ask: ["Say: the stress — five beats per line.", "قولي: النبر — خمس نبرات في السطر.", "Кажете: нагласокот — пет удари во стих.", "Die Betonung — fünf Hebungen pro Zeile.", die-betonung]
  - ask: ["Say: completion and sweetness.", "قولي: الاكتمال والحلاوة.", "Кажете: довршување и сладост.", "Die Vollendung und die Süße.", die-vollendung, die-suesse]
  - ask: ["Say: it sounds like melancholy.", "قولي: يبدو ككآبة شجيّة.", "Кажете: звучи како меланхолија.", "Es klingt nach Melancholie.", die-melancholie]
  - note: ["Rilke's 'Herbsttag' (1902) is one of the most quoted German poems; many Germans know its first and last lines by heart. Reading a poem aloud — slowly, with its rhythm — is a fine test of C2: you hear whether you feel the language, not just understand it.", "قصيدة ريلكه «يوم خريفي» (1902) من أكثر القصائد الألمانية اقتباسًا؛ وكثير من الألمان يحفظون أسطرها الأولى والأخيرة. وقراءة قصيدة بصوت عالٍ — ببطء وبإيقاعها — اختبار جميل لمستوى C2: تسمعين إن كنتِ تشعرين باللغة لا تفهمينها فقط.", "„Есенски ден“ (1902) од Рилке е една од најцитираните германски песни; многу Германци ги знаат напамет првите и последните стихови. Гласното читање песна — бавно, со нејзиниот ритам — е убав тест за C2: слушате дали го чувствувате јазикот, не само дали го разбирате."]
