id: C2-12-a
tracks: [ar]
protagonist: m
title: ["محاضرة ضيف في الجامعة"]
situation: ["دعتك الجامعة لتلقي محاضرة ضيف عن مشروعك الهندسي: جسر بأقل إسمنت. بعدها أسئلة الطلاب."]
learn: []
learn_missing: [academic-register]
culture: The academic register
items:
  - [die-fachsprache, "die Fachsprache", "اللغة التخصّصية"]
  - [die-gastvorlesung, "die Gastvorlesung", "محاضرة الضيف", {rare: true}]
  - [die-tragfaehigkeit, "die Tragfähigkeit", "قدرة التحمّل", {rare: true}]
  - [der-werkstoff, "der Werkstoff", "المادة (الهندسية)", {rare: true}]
  - [die-ergebnisse, "die Ergebnisse", "النتائج"]
  - [es-laesst-sich-zeigen, "es lässt sich zeigen, dass …", "يمكن إثبات أنّ …"]
  - [die-nachhaltigkeit, "die Nachhaltigkeit", "الاستدامة"]
  - [die-einschraenkung, "die Einschränkung", "القيد، الحدّ"]
  - [der-ausblick, "der Ausblick", "الآفاق"]
  - [der-zement, "der Zement", "الإسمنت"]
dialogue:
  - [protagonist, "In dieser Gastvorlesung stelle ich ein Projekt vor: eine Brücke mit dreißig Prozent weniger Zement.", "في محاضرة الضيف هذه أعرض مشروعًا: جسرًا بإسمنت أقل بثلاثين بالمئة."]
  - [protagonist, "Es lässt sich zeigen, dass die Tragfähigkeit dabei gleich bleibt.", "يمكن إثبات أنّ قدرة التحمّل تبقى كما هي."]
  - [hartmann, "Welcher Werkstoff ersetzt den Zement?", "أي مادة تحلّ محلّ الإسمنت؟"]
  - [protagonist, "Ein Gemisch aus Ton und Kalk. Das ist ein Gewinn für die Nachhaltigkeit.", "مزيج من الطين والكلس. هذا مكسب للاستدامة."]
  - [hartmann, "Und wo sehen Sie Einschränkungen?", "وأين ترى القيود؟"]
  - [protagonist, "Bei großen Spannweiten fehlen noch Ergebnisse. Der Ausblick: Tests im Winter.", "في البحور الكبيرة ما زالت النتائج ناقصة. والآفاق: اختبارات في الشتاء."]
  - [hartmann, "Sie sprechen die Fachsprache wie ein Muttersprachler.", "تتكلّم اللغة التخصّصية كأنها لغتك الأم."]
  - [protagonist, "In Aleppo habe ich auf Arabisch studiert — hier lerne ich alles ein zweites Mal.", "درستُ في حلب بالعربية — وهنا أتعلّم كل شيء مرة ثانية."]
teach:
  - ask: ["قل: محاضرة الضيف.", "Die Gastvorlesung.", die-gastvorlesung]
  - ask: ["قل: إسمنت أقل بثلاثين بالمئة.", "Dreißig Prozent weniger Zement.", der-zement]
  - note: ["الأسلوب الأكاديمي يتجنّب «أظن»: «Es lässt sich zeigen, dass…» (يمكن إثبات)، ويذكر القيود («Einschränkung») ويختم بالآفاق («Ausblick»)."]
  - ask: ["قل: يمكن إثبات أنّ…", "Es lässt sich zeigen, dass…", es-laesst-sich-zeigen]
  - ask: ["قل: قدرة التحمّل تبقى كما هي.", "Die Tragfähigkeit bleibt gleich.", die-tragfaehigkeit]
  - ask: ["قل: المادة.", "Der Werkstoff.", der-werkstoff]
  - ask: ["قل: مكسب للاستدامة.", "Ein Gewinn für die Nachhaltigkeit.", die-nachhaltigkeit]
  - ask: ["قل: النتائج ما زالت ناقصة.", "Es fehlen noch Ergebnisse.", die-ergebnisse]
  - ask: ["قل: القيود.", "Die Einschränkungen.", die-einschraenkung]
  - ask: ["قل: الآفاق.", "Der Ausblick.", der-ausblick]
  - ask: ["قل: اللغة التخصّصية.", "Die Fachsprache.", die-fachsprache]
  - note: ["في محاضرة ألمانية يُعدّ ذكر حدود عملك قوة لا ضعفًا. والهيكل: السؤال، الطريقة، النتائج، القيود، الآفاق. والطلاب يسألون بدقة ومباشرة — وهذا اهتمام لا هجوم."]
