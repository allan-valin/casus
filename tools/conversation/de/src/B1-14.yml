id: B1-14
protagonist: m
title: ["Du", "«دو»", "«Ду»"]
situation:
  - "A year on the same staircase. Frau Becker invites you for a glass — and makes an offer."
  - "عام على الدرج نفسه. السيدة بيكر تدعوك إلى كأس — وتقدّم عرضًا."
  - "Една година на истите скали. Госпоѓа Бекер ве кани на чаша — и дава понуда."
learn: [b1-address]
culture: When du is right
items:
  - [wollen-wir-uns-duzen, "Wollen wir uns duzen?", "Shall we say du to each other?", "هل نتخاطب بـ«du»؟", "Ќе си велиме ли «du»?"]
  - [duzen, "duzen", "say du", "يخاطب بـ«du»", "персира со «du»"]
  - [siezen, "siezen", "say Sie", "يخاطب بـ«Sie»", "персира со «Sie»"]
  - [ein-jahr-schon, "schon ein Jahr", "already a year", "عام كامل", "веќе една година"]
  - [ich-heisse, "Ich heiße …", "My name is …", "اسمي …", "Се викам …"]
  - [gern-sehr, "sehr gern", "with great pleasure", "بكل سرور", "со големо задоволство"]
  - [anstossen, "anstoßen", "clink glasses", "يقرع الكؤوس", "наздравува"]
  - [die-ehre, "die Ehre", "the honour", "الشرف", "честа"]
  - [ungewohnt, "ungewohnt", "unfamiliar, strange", "غير معتاد", "невообичаено"]
  - [ab-jetzt, "ab jetzt", "from now on", "من الآن", "од сега"]
dialogue:
  - [becker, "Wir wohnen schon ein Jahr im selben Haus. Wollen wir uns duzen?", "We've lived in the same house for a year. Shall we say du?", "نسكن في البيت نفسه منذ عام. هل نتخاطب بـ«du»؟", "Веќе една година живееме во иста зграда. Ќе си велиме ли «du»?"]
  - [protagonist, "Sehr gern! Das ist eine Ehre.", "With great pleasure! That's an honour.", "بكل سرور! هذا شرف لي.", "Со големо задоволство! Тоа е чест."]
  - [becker, "Ich heiße Monika.", "My name is Monika.", "اسمي مونيكا.", "Јас се викам Моника."]
  - [protagonist, "Monika... das ist ungewohnt!", "Monika... that feels strange!", "مونيكا... هذا غير معتاد!", "Моника... ова е невообичаено!"]
  - [becker, "Dann stoßen wir an. Auf das Du!", "Then let's clink glasses. To du!", "إذن نقرع الكؤوس. نخب الـ«du»!", "Тогаш да наздравиме. За «du»!"]
  - [protagonist, "Auf das Du! Und ab jetzt sage ich nicht mehr „Frau Becker“?", "To du! And from now on I don't say 'Mrs Becker' any more?", "نخب الـ«du»! ومن الآن لا أقول «السيدة بيكر»؟", "За «du»! И од сега веќе не велам „госпоѓо Бекер“?"]
  - [becker, "Nein. Aber den Putzplan gibt es trotzdem!", "No. But the cleaning rota still applies!", "لا. لكن جدول التنظيف يبقى قائمًا!", "Не. Но распоредот за чистење сепак останува!"]
  - [protagonist, "Klar, Monika!", "Of course, Monika!", "طبعًا يا مونيكا!", "Секако, Моника!"]
teach:
  - ask: ["She offers: shall we say du? How?", "تعرض: هل نتخاطب بـ«du»؟ كيف؟", "Таа нуди: ќе си велиме ли «du»? Како?", "Wollen wir uns duzen?", wollen-wir-uns-duzen]
  - ask: ["Say: with great pleasure!", "قل: بكل سرور!", "Кажете: со големо задоволство!", "Sehr gern!", gern-sehr]
  - ask: ["Say: that's an honour.", "قل: هذا شرف لي.", "Кажете: тоа е чест.", "Das ist eine Ehre.", die-ehre]
  - ask: ["Say: we've lived here a year already.", "قل: نسكن هنا منذ عام.", "Кажете: веќе една година живееме тука.", "Wir wohnen schon ein Jahr hier.", ein-jahr-schon]
  - ask: ["She says: my name is Monika.", "تقول: اسمي مونيكا.", "Таа вели: се викам Моника.", "Ich heiße Monika.", ich-heisse]
  - ask: ["Say: that feels strange!", "قل: هذا غير معتاد!", "Кажете: ова е невообичаено!", "Das ist ungewohnt!", ungewohnt]
  - ask: ["Say: let's clink glasses.", "قل: لنقرع الكؤوس.", "Кажете: да наздравиме.", "Wir stoßen an.", anstossen]
  - ask: ["Say: from now on.", "قل: من الآن.", "Кажете: од сега.", "Ab jetzt.", ab-jetzt]
  - note: ["«duzen» and «siezen» name the choice. The older or more senior person offers du — often with a toast. Once offered, it isn't taken back.", "«duzen» و«siezen» تسمّيان الاختيار. الأكبر سنًا أو الأعلى مرتبة يعرض «du» — غالبًا مع نخب. وبعد العرض لا يُسحب.", "«duzen» и «siezen» го именуваат изборот. Постариот или повисокиот нуди «du» — често со наздравување. Еднаш понудено, не се враќа."]
  - ask: ["Say: say Sie / say du.", "قل: يخاطب بـSie / يخاطب بـdu.", "Кажете: персира / не персира.", "Siezen, duzen.", siezen, duzen]
