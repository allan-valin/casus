id: A2-27
protagonist: f
title: ["Sayings", "الأمثال", "Поговорки"]
situation:
  - "Frau Becker has a saying for everything. Today she explains a few."
  - "السيدة بيكر لديها مثل لكل شيء. اليوم تشرح لكِ بعضها."
  - "Госпоѓа Бекер има поговорка за сѐ. Денес ви објаснува неколку."
learn: [de-pro_05]
culture: —
items:
  - [das-sprichwort, "das Sprichwort", "the saying", "المثل", "поговорката"]
  - [ende-gut, "Ende gut, alles gut", "All's well that ends well", "العبرة بالخواتيم", "Сѐ е добро што добро завршува"]
  - [der-fruehe-vogel, "Der frühe Vogel fängt den Wurm", "The early bird catches the worm", "الطائر المبكر يصطاد الدودة", "Раната птица го фаќа црвот"]
  - [was-heisst-das, "Was heißt das?", "What does that mean?", "ماذا يعني ذلك؟", "Што значи тоа?"]
  - [der-mensch-der, "ein Mensch, der …", "a person who …", "إنسان …", "човек што …"]
  - [frueh-aufsteht, "früh aufsteht", "gets up early", "يستيقظ باكرًا", "рано станува"]
  - [ordnung-muss-sein, "Ordnung muss sein", "There must be order", "لا بد من النظام", "Мора да има ред"]
  - [aller-anfang, "Aller Anfang ist schwer", "Every beginning is hard", "كل بداية صعبة", "Секој почеток е тежок"]
  - [das-passt, "Das passt", "That fits", "هذا مناسب", "Тоа одговара"]
  - [bei-uns-sagt-man, "Bei uns sagt man …", "Where I'm from, we say …", "عندنا يقولون …", "Кај нас се вели …"]
dialogue:
  - [becker, "Ende gut, alles gut! Ihre Heizung funktioniert wieder.", "All's well that ends well! Your heating works again.", "العبرة بالخواتيم! تدفئتكِ تعمل من جديد.", "Сѐ е добро што добро завршува! Греењето пак ви работи."]
  - [protagonist, "Was heißt das, „Ende gut, alles gut“?", "What does it mean, 'Ende gut, alles gut'?", "ماذا يعني «Ende gut, alles gut»؟", "Што значи „Ende gut, alles gut“?"]
  - [becker, "Wenn das Ende gut ist, ist alles gut. Das ist ein Sprichwort.", "If the end is good, everything's good. It's a saying.", "إذا كانت النهاية جيدة، فكل شيء جيد. هذا مثل.", "Ако крајот е добар, сѐ е добро. Тоа е поговорка."]
  - [protagonist, "Haben Sie noch eins?", "Do you have another one?", "هل عندكِ مثل آخر؟", "Имате ли уште една?"]
  - [becker, "„Der frühe Vogel fängt den Wurm.“ Ein Mensch, der früh aufsteht, hat Erfolg.", "'The early bird catches the worm.' A person who gets up early succeeds.", "«الطائر المبكر يصطاد الدودة.» الإنسان الذي يستيقظ باكرًا ينجح.", "„Раната птица го фаќа црвот.“ Човек што рано станува успева."]
  - [protagonist, "Bei uns sagt man fast das Gleiche!", "Where I'm from we say almost the same!", "عندنا يقولون الشيء نفسه تقريبًا!", "Кај нас се вели речиси исто!"]
  - [becker, "Und mein Lieblingssprichwort: „Ordnung muss sein.“", "And my favourite saying: 'There must be order.'", "ومثلي المفضّل: «لا بد من النظام.»", "А мојата омилена поговорка: „Мора да има ред.“"]
  - [protagonist, "Das passt zu Ihnen! Und für mich: „Aller Anfang ist schwer.“", "That suits you! And for me: 'Every beginning is hard.'", "هذا يناسبكِ! أما أنا: «كل بداية صعبة.»", "Тоа ви одговара! А за мене: „Секој почеток е тежок.“"]
teach:
  - ask: ["Say: all's well that ends well.", "قولي: العبرة بالخواتيم.", "Кажете: сѐ е добро што добро завршува.", "Ende gut, alles gut.", ende-gut]
  - ask: ["Ask: what does that mean?", "اسألي: ماذا يعني ذلك؟", "Прашајте: што значи тоа?", "Was heißt das?", was-heisst-das]
  - ask: ["Say: a saying.", "قولي: مثل.", "Кажете: поговорка.", "Ein Sprichwort.", das-sprichwort]
  - ask: ["Say: the early bird catches the worm.", "قولي: الطائر المبكر يصطاد الدودة.", "Кажете: раната птица го фаќа црвот.", "Der frühe Vogel fängt den Wurm.", der-fruehe-vogel]
  - note: ["Relative clauses start with «der», «die», «das» and send the verb to the end: «ein Mensch, der früh aufsteht» — a person who gets up early.", "جمل الصلة تبدأ بـ«der» أو «die» أو «das» وترسل الفعل إلى الآخر: «ein Mensch, der früh aufsteht» — إنسان يستيقظ باكرًا.", "Релативните реченици почнуваат со «der», «die», «das» и го праќаат глаголот на крајот: «ein Mensch, der früh aufsteht» — човек што рано станува."]
  - ask: ["Say: a person who gets up early.", "قولي: إنسان يستيقظ باكرًا.", "Кажете: човек што рано станува.", "Ein Mensch, der früh aufsteht.", der-mensch-der, frueh-aufsteht]
  - ask: ["Say: where I'm from we say almost the same.", "قولي: عندنا يقولون الشيء نفسه تقريبًا.", "Кажете: кај нас се вели речиси исто.", "Bei uns sagt man fast das Gleiche.", bei-uns-sagt-man]
  - ask: ["Say her favourite: there must be order.", "قولي مثلها المفضّل: لا بد من النظام.", "Кажете ја нејзината омилена: мора да има ред.", "Ordnung muss sein.", ordnung-muss-sein]
  - ask: ["Say: that suits you!", "قولي: هذا يناسبكِ!", "Кажете: тоа ви одговара!", "Das passt zu Ihnen!", das-passt]
  - ask: ["Say: every beginning is hard.", "قولي: كل بداية صعبة.", "Кажете: секој почеток е тежок.", "Aller Anfang ist schwer.", aller-anfang]
