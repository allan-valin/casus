id: C1-01
protagonist: f
title: ["Debating class", "دورة المناظرة", "Курс по дебата"]
situation:
  - "A new VHS course: debating. Motion of the evening: 'A four-day week for everyone'. You argue against Lena."
  - "دورة جديدة في الجامعة الشعبية: المناظرة. موضوع المساء: «أسبوع عمل من أربعة أيام للجميع». تجادلين ضد لينا."
  - "Нов курс на народниот универзитет: дебата. Темата на вечерта: „Четиридневна работна недела за сите“. Дебатирате против Лена."
learn: [de-c2-extended-participle]
culture: Arguing to the point
items:
  - [die-debatte, "die Debatte", "the debate", "المناظرة", "дебатата"]
  - [das-argument, "das Argument", "the argument", "الحجة", "аргументот"]
  - [das-gegenargument, "das Gegenargument", "the counter-argument", "الحجة المضادة", "контрааргументот"]
  - [die-these, "die These", "the thesis, claim", "الأطروحة", "тезата"]
  - [die-vier-tage-woche, "die Vier-Tage-Woche", "the four-day week", "أسبوع العمل من أربعة أيام", "четиридневната недела"]
  - [die-produktivitaet, "die Produktivität", "productivity", "الإنتاجية", "продуктивноста"]
  - [der-fachkraeftemangel, "der Fachkräftemangel", "the skills shortage", "نقص العمالة الماهرة", "недостигот на стручен кадар", {rare: true}]
  - [die-oft-genannte, "die oft genannte …", "the often-cited …", "… التي يُستشهد بها كثيرًا", "често спомнуваната …"]
  - [die-in-studien-belegte, "die in Studien belegte …", "the … shown in studies", "… المثبتة في الدراسات", "… докажана во студии"]
  - [ueberzeugend, "überzeugend", "convincing", "مقنع", "убедливо"]
  - [ich-widerspreche, "Da widerspreche ich", "I disagree there", "هنا أعترض", "Тука не се согласувам"]
dialogue:
  - [hartmann, "Die These: Die Vier-Tage-Woche für alle. Lena, Ihr Argument.", "The motion: the four-day week for all. Lena, your argument.", "الأطروحة: أسبوع عمل من أربعة أيام للجميع. لينا، حجتكِ.", "Тезата: четиридневна недела за сите. Лена, вашиот аргумент."]
  - [lena, "Die in Studien belegte höhere Produktivität spricht dafür. Ausgeruhte Menschen arbeiten besser.", "The higher productivity shown in studies speaks for it. Rested people work better.", "الإنتاجية الأعلى المثبتة في الدراسات تؤيّد ذلك. الناس المرتاحون يعملون أفضل.", "Повисоката продуктивност докажана во студии зборува за тоа. Одморените луѓе работат подобро."]
  - [protagonist, "Da widerspreche ich. Die oft genannte Produktivität gilt nicht für alle Berufe.", "I disagree there. The often-cited productivity doesn't apply to all jobs.", "هنا أعترض. الإنتاجية التي يُستشهد بها كثيرًا لا تنطبق على كل المهن.", "Тука не се согласувам. Често спомнуваната продуктивност не важи за сите професии."]
  - [protagonist, "Eine Pflegekraft kann nicht in vier Tagen fünf Tage Patienten versorgen.", "A nurse can't care for patients for five days in four.", "الممرّضة لا تستطيع رعاية المرضى خمسة أيام في أربعة.", "Медицинска сестра не може за четири дена да ги згрижи пациентите за пет."]
  - [lena, "Dann stellt man mehr Leute ein.", "Then you hire more people.", "إذن يوظّفون أشخاصًا أكثر.", "Тогаш се вработуваат повеќе луѓе."]
  - [protagonist, "Bei dem seit Jahren bekannten Fachkräftemangel? Woher?", "With the skills shortage known for years? From where?", "مع نقص العمالة الماهرة المعروف منذ سنوات؟ من أين؟", "Со недостигот на стручен кадар познат со години? Од каде?"]
  - [hartmann, "Ein starkes Gegenargument! Wer war überzeugender?", "A strong counter-argument! Who was more convincing?", "حجة مضادة قوية! من كان أكثر إقناعًا؟", "Силен контрааргумент! Кој беше поубедлив?"]
  - [lena, "Leider sie. Nächstes Mal tauschen wir die Seiten!", "Sadly, her. Next time we swap sides!", "للأسف هي. في المرة القادمة نتبادل الجانبين!", "За жал, таа. Следниот пат ги менуваме страните!"]
teach:
  - ask: ["Say: the debate.", "قولي: المناظرة.", "Кажете: дебатата.", "Die Debatte.", die-debatte]
  - ask: ["Say: the motion is the four-day week.", "قولي: الأطروحة هي أسبوع الأيام الأربعة.", "Кажете: тезата е четиридневната недела.", "Die These ist die Vier-Tage-Woche.", die-these, die-vier-tage-woche]
  - note: ["Extended attributes pack a whole clause before the noun: «die in Studien belegte Produktivität» (= the productivity that is shown in studies), «der seit Jahren bekannte Fachkräftemangel». Typical of written and formal German — read from the article to the noun, then back.", "الصفات الممتدة تحشر جملة كاملة قبل الاسم: «die in Studien belegte Produktivität» (= الإنتاجية التي أُثبتت في الدراسات)، «der seit Jahren bekannte Fachkräftemangel». نموذجية في الألمانية المكتوبة والرسمية — اقرئي من أداة التعريف إلى الاسم ثم ارجعي.", "Проширените атрибути пакуваат цела реченица пред именката: «die in Studien belegte Produktivität» (= продуктивноста што е докажана во студии), «der seit Jahren bekannte Fachkräftemangel». Типично за пишан и формален германски — читајте од членот до именката, па назад."]
  - ask: ["Say: the productivity shown in studies.", "قولي: الإنتاجية المثبتة في الدراسات.", "Кажете: продуктивноста докажана во студии.", "Die in Studien belegte Produktivität.", die-in-studien-belegte, die-produktivitaet]
  - ask: ["Disagree.", "اعترضي.", "Не се согласувајте.", "Da widerspreche ich.", ich-widerspreche]
  - ask: ["Say: the often-cited productivity.", "قولي: الإنتاجية التي يُستشهد بها كثيرًا.", "Кажете: често спомнуваната продуктивност.", "Die oft genannte Produktivität.", die-oft-genannte]
  - ask: ["Say: the skills shortage known for years.", "قولي: نقص العمالة الماهرة المعروف منذ سنوات.", "Кажете: недостигот на кадар познат со години.", "Der seit Jahren bekannte Fachkräftemangel.", der-fachkraeftemangel]
  - ask: ["Say: a strong counter-argument.", "قولي: حجة مضادة قوية.", "Кажете: силен контрааргумент.", "Ein starkes Gegenargument.", das-gegenargument, das-argument]
  - ask: ["Ask: who was more convincing?", "اسألي: من كان أكثر إقناعًا؟", "Прашајте: кој беше поубедлив?", "Wer war überzeugender?", ueberzeugend]
  - note: ["German debating values a clear thesis, evidence and a direct reply to the other side's best point — not volume or personal attack. «Da widerspreche ich» is polite and normal.", "المناظرة الألمانية تُقدّر الأطروحة الواضحة والدليل والردّ المباشر على أقوى نقطة لدى الطرف الآخر — لا علوّ الصوت ولا الهجوم الشخصي. وعبارة «Da widerspreche ich» مؤدبة وعادية.", "Германската дебата цени јасна теза, докази и директен одговор на најдобрата поента на другата страна — не гласност или личен напад. «Da widerspreche ich» е учтиво и нормално."]
