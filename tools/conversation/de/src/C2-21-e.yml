id: C2-21-e
tracks: [en]
protagonist: f
title: ["Visiting home"]
situation: ["Two weeks back in your home country after years away. On a video call, Lena asks how it feels."]
learn: [c2-register-shifts]
culture: Reverse culture shock
items:
  - [fremd-geworden, "fremd geworden", "become strange, unfamiliar"]
  - [der-umgekehrte-kulturschock, "der umgekehrte Kulturschock", "reverse culture shock", {rare: true}]
  - [zwischen-den-stuehlen, "zwischen den Stühlen sitzen", "be caught between two worlds"]
  - [die-heimat-c2, "die alte Heimat", "the old homeland"]
  - [sich-veraendert, "sich verändert haben", "have changed"]
  - [die-sehnsucht, "die Sehnsucht", "longing"]
  - [unpuenktlich, "unpünktlich", "unpunctual"]
  - [ertappen, "sich ertappen bei", "catch oneself doing"]
  - [vermissen-c2, "Ich vermisse sogar …", "I even miss …"]
  - [doppelt-zuhause, "doppelt zu Hause", "at home twice over"]
dialogue:
  - [lena, "Und? Wie ist es, wieder zu Hause zu sein?", "So? How is it to be home again?"]
  - [protagonist, "Komisch. Meine alte Heimat ist mir ein bisschen fremd geworden.", "Strange. My old homeland has become a bit unfamiliar to me."]
  - [lena, "Inwiefern?", "In what way?"]
  - [protagonist, "Ich ertappe mich dabei, dass ich mich über Unpünktlichkeit ärgere. Wie eine Deutsche!", "I catch myself getting annoyed about unpunctuality. Like a German!"]
  - [lena, "Das nennt man umgekehrten Kulturschock.", "That's called reverse culture shock."]
  - [protagonist, "Und ich vermisse sogar die Mülltrennung. Aber hier ist meine Familie, meine Sprache, das Essen...", "And I even miss recycling. But here is my family, my language, the food..."]
  - [lena, "Du sitzt zwischen den Stühlen.", "You're caught between two worlds."]
  - [protagonist, "Oder ich bin doppelt zu Hause. Das gefällt mir besser.", "Or I'm at home twice over. I like that better."]
teach:
  - ask: ["Say: my homeland has become unfamiliar.", "Meine Heimat ist mir fremd geworden.", fremd-geworden, die-heimat-c2]
  - ask: ["She asks: in what way?", "Inwiefern?", sich-veraendert]
  - note: ["Register shifts mark the in-between: you talk about your old home with distance («fremd geworden») and about yourself with irony («Wie eine Deutsche!»). Idiom: «zwischen den Stühlen sitzen» — between two chairs."]
  - ask: ["Say: I catch myself being annoyed.", "Ich ertappe mich dabei, dass ich mich ärgere.", ertappen]
  - ask: ["Say: unpunctuality.", "Unpünktlich.", unpuenktlich]
  - ask: ["Say: reverse culture shock.", "Der umgekehrte Kulturschock.", der-umgekehrte-kulturschock]
  - ask: ["Say: I even miss recycling.", "Ich vermisse sogar die Mülltrennung.", vermissen-c2]
  - ask: ["Say: caught between two worlds.", "Zwischen den Stühlen sitzen.", zwischen-den-stuehlen]
  - ask: ["Say: at home twice over.", "Doppelt zu Hause.", doppelt-zuhause]
  - ask: ["Say: longing.", "Die Sehnsucht.", die-sehnsucht]
  - note: ["Many people who return home for a visit feel 'reverse culture shock': home has changed, and so have they. It's normal and fades. Seeing yourself as 'doubly at home' rather than 'nowhere at home' helps."]
