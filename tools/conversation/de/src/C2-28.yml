id: C2-28
protagonist: m
title: ["Farewell to Frau Becker", "وداع السيدة بيكر", "Збогување со госпоѓа Бекер"]
situation:
  - "A farewell party in the courtyard for Frau Becker. The whole house is there. You say goodbye — in the right words."
  - "حفلة وداع في الفناء للسيدة بيكر. البيت كله حاضر. تودّعها — بالكلمات المناسبة."
  - "Прошталната забава во дворот за госпоѓа Бекер. Целата зграда е тука. Се поздравувате — со вистинските зборови."
learn: []
learn_missing: [set-phrases]
culture: Saying goodbye
items:
  - [du-wirst-mir-fehlen, "Du wirst mir fehlen", "I'll miss you", "سأفتقدكِ", "Ќе ми недостигаш"]
  - [der-neue-lebensabschnitt, "der neue Lebensabschnitt", "the new chapter of life", "مرحلة الحياة الجديدة", "новото животно поглавје", {rare: true}]
  - [machs-gut, "Mach's gut!", "Take care!", "اعتنِ بنفسك!", "Чувај се!"]
  - [auf-wiedersehen-nicht-lebewohl, "kein Lebewohl, sondern Auf Wiedersehen", "not farewell, but see you again", "ليس وداعًا بل إلى اللقاء", "не збогум, туку довидување"]
  - [die-dankbarkeit, "die Dankbarkeit", "gratitude", "الامتنان", "благодарноста"]
  - [ohne-dich-waere, "Ohne dich wäre ich nicht …", "Without you I wouldn't be …", "لولاكِ لما كنتُ …", "Без тебе немаше да бидам …"]
  - [die-gute-seele, "die gute Seele des Hauses", "the good soul of the house", "روح البيت الطيّبة", "добрата душа на зградата"]
  - [besuchen-kommen, "Ich komme dich besuchen", "I'll come and visit you", "سآتي لزيارتكِ", "Ќе дојдам да те посетам"]
  - [das-abschiedsgeschenk, "das Abschiedsgeschenk", "the farewell present", "هدية الوداع", "прошталниот подарок"]
  - [die-traene, "die Träne", "the tear", "الدمعة", "солзата"]
dialogue:
  - [protagonist, "Liebe Monika, du warst die gute Seele des Hauses. Streng, aber herzlich.", "Dear Monika, you were the good soul of the house. Strict, but warm.", "عزيزتي مونيكا، كنتِ روح البيت الطيّبة. صارمة لكن دافئة.", "Драга Моника, ти беше добрата душа на зградата. Строга, но срдечна."]
  - [becker, "Streng? Ich? Nur bei der Mülltrennung!", "Strict? Me? Only about recycling!", "صارمة؟ أنا؟ فقط في فرز القمامة!", "Строга? Јас? Само за селекцијата на отпад!"]
  - [protagonist, "Ohne dich wäre ich nicht so gut angekommen. Dafür meine tiefe Dankbarkeit.", "Without you I wouldn't have settled in so well. For that, my deep gratitude.", "لولاكِ لما استقررتُ بهذا الشكل الجيد. لذلك امتناني العميق.", "Без тебе немаше толку добро да се сместам. За тоа, моја длабока благодарност."]
  - [jonas, "Hier, unser Abschiedsgeschenk: ein Foto vom ganzen Haus.", "Here, our farewell present: a photo of the whole house.", "تفضّلي، هدية وداعنا: صورة للبيت كله.", "Еве, нашиот проштален подарок: фотографија од целата зграда."]
  - [becker, "Jetzt kommt mir eine Träne. Ihr werdet mir alle fehlen.", "Now there's a tear coming. I'll miss you all.", "الآن تنزل دمعة. سأفتقدكم جميعًا.", "Сега ми доаѓа солза. Сите ќе ми недостигате."]
  - [protagonist, "Du wirst mir auch fehlen. Alles Gute für den neuen Lebensabschnitt!", "I'll miss you too. All the best for the new chapter!", "وأنتِ أيضًا سأفتقدكِ. كل التوفيق في مرحلة الحياة الجديدة!", "И ти ќе ми недостигаш. Сѐ најдобро во новото животно поглавје!"]
  - [becker, "Das ist kein Lebewohl, sondern Auf Wiedersehen. Das betreute Wohnen ist nur drei Haltestellen weiter.", "This isn't farewell, but see you again. The assisted living is only three stops away.", "هذا ليس وداعًا بل إلى اللقاء. السكن مع الرعاية على بعد ثلاث محطات فقط.", "Ова не е збогум, туку довидување. Домот со нега е само три постојки понатаму."]
  - [protagonist, "Dann komme ich dich jeden Sonntag besuchen. Mit Kuchen. Mach's gut, Monika!", "Then I'll visit you every Sunday. With cake. Take care, Monika!", "إذن سأزوركِ كل أحد. مع كعكة. اعتني بنفسكِ يا مونيكا!", "Тогаш ќе те посетувам секоја недела. Со колач. Чувај се, Моника!"]
teach:
  - ask: ["Say: the good soul of the house.", "قل: روح البيت الطيّبة.", "Кажете: добрата душа на зградата.", "Die gute Seele des Hauses.", die-gute-seele]
  - ask: ["Say: without you I wouldn't have settled in.", "قل: لولاكِ لما استقررتُ.", "Кажете: без тебе немаше да се сместам.", "Ohne dich wäre ich nicht so gut angekommen.", ohne-dich-waere]
  - ask: ["Say: my deep gratitude.", "قل: امتناني العميق.", "Кажете: моја длабока благодарност.", "Meine tiefe Dankbarkeit.", die-dankbarkeit]
  - note: ["Farewells have set phrases: «Du wirst mir fehlen» (literally 'you will be missing to me'), «Alles Gute für den neuen Lebensabschnitt», «Mach's gut!», «kein Lebewohl, sondern Auf Wiedersehen» — 'Lebewohl' sounds final, 'Auf Wiedersehen' hopes to meet again.", "للوداع عبارات ثابتة: «Du wirst mir fehlen» (حرفيًا «ستكونين ناقصة لي»)، «Alles Gute für den neuen Lebensabschnitt»، «Mach's gut!»، «kein Lebewohl, sondern Auf Wiedersehen» — «Lebewohl» تبدو نهائية، و«Auf Wiedersehen» ترجو لقاءً آخر.", "Збогувањата имаат фиксни фрази: «Du wirst mir fehlen» (буквално „ќе ми недостигаш“), «Alles Gute für den neuen Lebensabschnitt», «Mach's gut!», «kein Lebewohl, sondern Auf Wiedersehen» — „Lebewohl“ звучи конечно, „Auf Wiedersehen“ се надева на нова средба."]
  - ask: ["Say: I'll miss you.", "قل: سأفتقدكِ.", "Кажете: ќе ми недостигаш.", "Du wirst mir fehlen.", du-wirst-mir-fehlen]
  - ask: ["Say: all the best for the new chapter.", "قل: كل التوفيق في المرحلة الجديدة.", "Кажете: сѐ најдобро во новото поглавје.", "Alles Gute für den neuen Lebensabschnitt.", der-neue-lebensabschnitt]
  - ask: ["Say: not farewell, but see you again.", "قل: ليس وداعًا بل إلى اللقاء.", "Кажете: не збогум, туку довидување.", "Kein Lebewohl, sondern Auf Wiedersehen.", auf-wiedersehen-nicht-lebewohl]
  - ask: ["Say: our farewell present.", "قل: هدية وداعنا.", "Кажете: нашиот проштален подарок.", "Unser Abschiedsgeschenk.", das-abschiedsgeschenk]
  - ask: ["Say: I'll come and visit you.", "قل: سآتي لزيارتكِ.", "Кажете: ќе дојдам да те посетам.", "Ich komme dich besuchen.", besuchen-kommen]
  - ask: ["Say: take care!", "قل: اعتني بنفسكِ!", "Кажете: чувај се!", "Mach's gut!", machs-gut]
  - ask: ["Say: a tear.", "قل: دمعة.", "Кажете: солза.", "Eine Träne.", die-traene]
  - note: ["The landlady who once scolded you about rubbish bins becomes, years later, the neighbour you visit every Sunday — that's a very common German story. Relationships here start slowly and formally, and then last.", "المؤجِّرة التي وبّختك يومًا بسبب صناديق القمامة تصبح بعد سنوات الجارة التي تزورها كل أحد — هذه قصة ألمانية شائعة جدًا. العلاقات هنا تبدأ ببطء ورسمية، ثم تدوم.", "Станодавката што некогаш ве караше за кантите за ѓубре, години подоцна станува соседката што ја посетувате секоја недела — многу честа германска приказна. Односите тука почнуваат бавно и формално, а потоа траат."]
