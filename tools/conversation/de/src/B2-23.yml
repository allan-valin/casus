id: B2-23
protagonist: f
title: ["Small talk at the fair", "الدردشة في المعرض", "Мал разговор на саемот"]
situation:
  - "The Leipzig Book Fair. In the queue for coffee, a stranger starts talking. Small talk — German style."
  - "معرض لايبزيغ للكتاب. في طابور القهوة يبدأ غريب الحديث. دردشة — على الطريقة الألمانية."
  - "Саемот на книгата во Лајпциг. Во редот за кафе, непознат почнува разговор. Мал разговор — на германски начин."
learn: [b2-question-tags]
culture: Small talk with strangers
items:
  - [die-buchmesse, "die Buchmesse", "the book fair", "معرض الكتاب", "саемот на книгата"]
  - [oder-tag, "…, oder?", "…, isn't it? / right?", "…، أليس كذلك؟", "…, нели?"]
  - [ne-tag, "…, ne?", "…, right? (colloquial)", "…، صح؟ (عاميًا)", "…, а? (разговорно)"]
  - [gell, "…, gell?", "…, right? (southern)", "…، صح؟ (جنوبيًا)", "…, нели? (јужно)", {rare: true}]
  - [voll-heute, "ganz schön voll", "pretty crowded", "مزدحم جدًا", "прилично полно"]
  - [die-schlange, "die Schlange", "the queue", "الطابور", "редицата"]
  - [erwischt, "Erwischt!", "Caught out!", "كشفتِني!", "Ме фативте!"]
  - [beruflich-oder-privat, "beruflich oder privat", "for work or for pleasure", "للعمل أم للمتعة", "службено или приватно"]
  - [die-lesung, "die Lesung", "the reading (by an author)", "القراءة (من الكاتب)", "читањето"]
  - [viel-spass-auf, "Viel Spaß auf der Messe!", "Enjoy the fair!", "استمتع بالمعرض!", "Уживајте на саемот!"]
dialogue:
  - [fahrer, "Ganz schön voll heute, oder?", "Pretty crowded today, isn't it?", "مزدحم جدًا اليوم، أليس كذلك؟", "Прилично полно денес, нели?"]
  - [protagonist, "Ja! Die Schlange ist so lang wie das Buch, das ich kaufen will.", "Yes! The queue is as long as the book I want to buy.", "نعم! الطابور طويل مثل الكتاب الذي أريد شراءه.", "Да! Редицата е долга како книгата што сакам да ја купам."]
  - [fahrer, "Ha! Sind Sie beruflich oder privat hier?", "Ha! Are you here for work or for pleasure?", "ها! هل أنتِ هنا للعمل أم للمتعة؟", "Ха! Тука сте службено или приватно?"]
  - [protagonist, "Privat. Ich will zur Lesung um drei. Die Autorin ist toll, ne?", "For pleasure. I want to go to the reading at three. The author is great, right?", "للمتعة. أريد حضور القراءة في الثالثة. الكاتبة رائعة، صح؟", "Приватно. Сакам да одам на читањето во три. Авторката е одлична, а?"]
  - [fahrer, "Sehr! Sie kommen nicht aus Leipzig, oder?", "Very! You're not from Leipzig, are you?", "جدًا! أنتِ لستِ من لايبزيغ، أليس كذلك؟", "Многу! Вие не сте од Лајпциг, нели?"]
  - [protagonist, "Nein, aber ich wohne hier. Und Sie? Sie klingen wie aus Bayern, gell?", "No, but I live here. And you? You sound like you're from Bavaria, right?", "لا، لكنني أسكن هنا. وأنت؟ تبدو من بافاريا، صح؟", "Не, но живеам тука. А вие? Звучите како од Баварија, нели?"]
  - [fahrer, "Erwischt! ... Oh, ich bin dran. Schönen Tag noch!", "Caught out! ... Oh, it's my turn. Have a nice day!", "كشفتِني! ... آه، جاء دوري. يومًا سعيدًا!", "Ме фативте! ... О, јас сум на ред. Убав ден уште!"]
  - [protagonist, "Ihnen auch! Viel Spaß auf der Messe.", "You too! Enjoy the fair.", "ولك أيضًا! استمتع بالمعرض.", "И вам! Уживајте на саемот."]
teach:
  - ask: ["Say: the book fair.", "قولي: معرض الكتاب.", "Кажете: саемот на книгата.", "Die Buchmesse.", die-buchmesse]
  - ask: ["He says: pretty crowded today.", "يقول: مزدحم جدًا اليوم.", "Тој вели: прилично полно денес.", "Ganz schön voll heute.", voll-heute]
  - note: ["Question tags invite agreement: «…, oder?» (everywhere), «…, ne?» (north and centre, casual), «…, gell?» (south). They make a statement friendly: «Die Autorin ist toll, ne?».", "أدوات التذييل تدعو إلى الموافقة: «…, oder?» (في كل مكان)، «…, ne?» (الشمال والوسط، عاميًا)، «…, gell?» (الجنوب). تجعل الجملة ودّية: «Die Autorin ist toll, ne?».", "Прашалните додатоци бараат согласност: «…, oder?» (насекаде), «…, ne?» (север и центар, разговорно), «…, gell?» (југ). Ја прават изјавата пријателска: «Die Autorin ist toll, ne?»."]
  - ask: ["Say: crowded, isn't it?", "قولي: مزدحم، أليس كذلك؟", "Кажете: полно, нели?", "Voll, oder?", oder-tag]
  - ask: ["Say casually: the author is great, right?", "قولي عاميًا: الكاتبة رائعة، صح؟", "Кажете разговорно: авторката е одлична, а?", "Die Autorin ist toll, ne?", ne-tag]
  - ask: ["Say the southern way: from Bavaria, right?", "قوليها على الطريقة الجنوبية: من بافاريا، صح؟", "Кажете на јужен начин: од Баварија, нели?", "Aus Bayern, gell?", gell]
  - ask: ["Say: the queue is long.", "قولي: الطابور طويل.", "Кажете: редицата е долга.", "Die Schlange ist lang.", die-schlange]
  - ask: ["He asks: work or pleasure?", "يسأل: للعمل أم للمتعة؟", "Тој прашува: службено или приватно?", "Beruflich oder privat?", beruflich-oder-privat]
  - ask: ["Say: the reading at three.", "قولي: القراءة في الثالثة.", "Кажете: читањето во три.", "Die Lesung um drei.", die-lesung]
  - ask: ["Say goodbye: have a nice day!", "ودّعي: يومًا سعيدًا!", "Поздравете: убав ден уште!", "Schönen Tag noch!", schoenen-tag-noch]
  - ask: ["Say: small talk.", "قولي: الدردشة.", "Кажете: мал разговор.", "Der Smalltalk.", der-smalltalk]
  - ask: ["He says: caught out!", "يقول: كشفتِني!", "Тој вели: ме фативте!", "Erwischt!", erwischt]
  - ask: ["Wish him: enjoy the fair!", "تمنّي له: استمتع بالمعرض!", "Посакајте му: уживајте на саемот!", "Viel Spaß auf der Messe!", viel-spass-auf]
  - note: ["Small talk with strangers is short and light: the weather, the queue, the event — not salary, religion or politics. It ends without fuss: «Schönen Tag noch!». At fairs and conferences it's the normal way to start; follow-up comes with a business card.", "الدردشة مع الغرباء قصيرة وخفيفة: الطقس، الطابور، الحدث — لا الراتب ولا الدين ولا السياسة. وتنتهي ببساطة: «Schönen Tag noch!». في المعارض والمؤتمرات هي الطريقة المعتادة للبدء؛ والمتابعة تأتي ببطاقة العمل.", "Малиот разговор со непознати е краток и лесен: времето, редицата, настанот — не плата, религија или политика. Завршува без церемонии: «Schönen Tag noch!». На саеми и конференции тоа е нормалниот почеток; продолжението доаѓа со визит-карта."]
