id: B2-28-m
tracks: [mk]
protagonist: m
title: ["Лука тргнува на училиште"]
situation: ["Денот на тргнување на училиште (Einschulung). Лука со голема Schultüte, вие и сите роднини во салата."]
learn: []
learn_missing: [formal-speech]
culture: Starting school and the Schultüte
items:
  - [der-erste-schultag, "der erste Schultag", "првиот училиштен ден"]
  - [das-mittagessen-feier, "alle zusammen essen", "сите заедно јадат"]
  - [die-klassenlehrerin, "die Klassenlehrerin", "класната наставничка"]
  - [die-aula, "die Aula", "салата", {rare: true}]
  - [aufgeregt, "aufgeregt", "возбуден"]
  - [stolz-m, "stolz", "горд"]
  - [die-feier-m, "die Feier", "прославата"]
  - [liebe-eltern, "Liebe Eltern, liebe Großeltern", "Драги родители, драги баби и дедовци"]
  - [herzlich-willkommen, "herzlich willkommen", "срдечно добредојдовте"]
  - [das-foto, "das Foto", "фотографијата"]
dialogue:
  - [klassenlehrerin, "Liebe Eltern, liebe Großeltern, herzlich willkommen zum ersten Schultag!", "Драги родители, драги баби и дедовци, срдечно добредојдовте на првиот училиштен ден!"]
  - [luka, "Opa, schau! Meine Schultüte ist so groß wie ich!", "Дедо, види! Мојата Schultüte е голема колку мене!"]
  - [protagonist, "Und dein Ranzen auch! Bist du aufgeregt?", "И торбата исто! Возбуден ли си?"]
  - [luka, "Ein bisschen. Wer ist meine Klassenlehrerin?", "Малку. Која е мојата класна?"]
  - [klassenlehrerin, "Das bin ich, Frau Hahn. Kommt, Kinder, wir gehen in die Klasse!", "Тоа сум јас, госпоѓа Хан. Ајде деца, одиме во училницата!"]
  - [petar, "Papa, machst du ein Foto? Für Oma in Bitola.", "Тато, ќе направиш фотографија? За баба во Битола."]
  - [protagonist, "Natürlich. Ich bin so stolz. Bei uns gab es keine Schultüte!", "Се разбира. Толку сум горд. Кај нас немаше Schultüte!"]
  - [anja, "Und nach der Feier gehen wir alle essen.", "А по прославата одиме сите на ручек."]
teach:
  - ask: ["Таа поздравува: драги родители, драги баби и дедовци.", "Liebe Eltern, liebe Großeltern.", liebe-eltern]
  - ask: ["Таа вели: срдечно добредојдовте.", "Herzlich willkommen.", herzlich-willkommen]
  - ask: ["Кажете: првиот училиштен ден.", "Der erste Schultag.", der-erste-schultag]
  - ask: ["Кажете: и торбата исто.", "Der Schulranzen auch.", der-ranzen-m]
  - ask: ["Таа вели: одиме во училницата.", "Wir gehen in die Klasse.", die-klasse-m]
  - ask: ["Ања вели: сите заедно ќе јадеме.", "Wir gehen alle zusammen essen.", das-mittagessen-feier]
  - ask: ["Прашајте: возбуден ли си?", "Bist du aufgeregt?", aufgeregt]
  - ask: ["Лука прашува за класната.", "Wer ist meine Klassenlehrerin?", die-klassenlehrerin]
  - ask: ["Кажете: во салата.", "In der Aula.", die-aula]
  - ask: ["Кажете: ќе направам фотографија.", "Ich mache ein Foto.", das-foto]
  - ask: ["Кажете: толку сум горд.", "Ich bin so stolz.", stolz-m]
  - ask: ["Кажете: по прославата.", "Nach der Feier.", die-feier-m]
  - note: ["Тргнувањето на училиште (Einschulung) е голем семеен празник, обично во сабота: свечен говор во салата, Schultüte полна со слатки и ситници, фотографии и ручек со роднините. Добро е да се дојде облечено малку свечено."]
