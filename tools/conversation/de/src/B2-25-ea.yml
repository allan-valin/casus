id: B2-25-ea
tracks: [en, ar]
protagonist: f
title: ["The club board", "مجلس إدارة النادي"]
situation:
  - "The Verein's annual general meeting. The treasurer is retiring — and Petra proposes you."
  - "الجمعية العمومية السنوية للنادي. أمين الصندوق يتقاعد — وبيترا تقترحكِ."
learn: [b2-formal-speech]
culture: Club democracy
items:
  - [die-mitgliederversammlung, "die Mitgliederversammlung", "the general meeting", "الجمعية العمومية", {rare: true}]
  - [der-vorstand, "der Vorstand", "the board", "مجلس الإدارة"]
  - [die-kassenwartin, "die Kassenwartin", "the treasurer (f)", "أمينة الصندوق", {rare: true}]
  - [vorschlagen, "vorschlagen", "propose, nominate", "يقترح"]
  - [die-abstimmung, "die Abstimmung", "the vote", "التصويت"]
  - [die-enthaltung, "die Enthaltung", "the abstention", "الامتناع عن التصويت", {rare: true}]
  - [ich-nehme-die-wahl-an, "Ich nehme die Wahl an", "I accept the election", "أقبل الانتخاب"]
  - [das-vertrauen, "das Vertrauen", "the trust", "الثقة"]
  - [einstimmig, "einstimmig", "unanimously", "بالإجماع"]
  - [liebe-mitglieder, "Liebe Mitglieder", "Dear members", "أعزائي الأعضاء"]
dialogue:
  - [petra, "Für das Amt der Kassenwartin schlage ich sie vor. Sie ist zuverlässig und kann rechnen.", "For the post of treasurer I propose her. She's reliable and good with numbers.", "لمنصب أمينة الصندوق أقترحها. إنها موثوقة وتجيد الحساب."]
  - [protagonist, "Ich? Ich bin erst zwei Jahre im Verein!", "Me? I've only been in the club two years!", "أنا؟ لم يمضِ عليّ في النادي إلا سنتان!"]
  - [petra, "Gerade deshalb. Wir brauchen neue Leute im Vorstand. Kommen wir zur Abstimmung: Wer ist dafür?", "Exactly why. We need new people on the board. Let's vote: who's in favour?", "لهذا بالذات. نحتاج أشخاصًا جددًا في مجلس الإدارة. لننتقل إلى التصويت: من يؤيّد؟"]
  - [petra, "Gegenstimmen? Keine. Enthaltungen? Keine. Einstimmig gewählt!", "Against? None. Abstentions? None. Elected unanimously!", "معارضون؟ لا أحد. ممتنعون؟ لا أحد. انتُخبت بالإجماع!"]
  - [protagonist, "Liebe Mitglieder, vielen Dank für Ihr Vertrauen. Ich nehme die Wahl an.", "Dear members, thank you very much for your trust. I accept the election.", "أعزائي الأعضاء، شكرًا جزيلًا على ثقتكم. أقبل الانتخاب."]
  - [protagonist, "Ich werde die Kasse sorgfältig führen und jedes Jahr Bericht erstatten.", "I'll keep the accounts carefully and report every year.", "سأدير الصندوق بعناية وأقدّم تقريرًا كل سنة."]
  - [petra, "Herzlichen Glückwunsch! Jetzt bist du offiziell eine von uns.", "Congratulations! Now you're officially one of us.", "تهانينا! الآن أنتِ رسميًا واحدة منّا."]
  - [protagonist, "Und als Erstes: der Mitgliedsbeitrag bleibt gleich!", "And first thing: the membership fee stays the same!", "وأول شيء: رسوم العضوية تبقى كما هي!"]
teach:
  - ask: ["Say: the general meeting.", "قولي: الجمعية العمومية.", "Die Mitgliederversammlung.", die-mitgliederversammlung]
  - ask: ["She proposes you. What does she say?", "تقترحكِ. ماذا تقول؟", "Ich schlage sie vor.", vorschlagen]
  - ask: ["Say: the treasurer.", "قولي: أمينة الصندوق.", "Die Kassenwartin.", die-kassenwartin]
  - ask: ["Say: new people on the board.", "قولي: أشخاص جدد في مجلس الإدارة.", "Neue Leute im Vorstand.", der-vorstand]
  - ask: ["Say: let's vote.", "قولي: لننتقل إلى التصويت.", "Kommen wir zur Abstimmung.", die-abstimmung]
  - ask: ["Ask: abstentions?", "اسألي: ممتنعون؟", "Enthaltungen?", die-enthaltung]
  - ask: ["Say: elected unanimously.", "قولي: انتُخبت بالإجماع.", "Einstimmig gewählt.", einstimmig]
  - note: ["Formal speech has fixed formulas: «Liebe Mitglieder» to open, «Vielen Dank für Ihr Vertrauen», «Ich nehme die Wahl an». Even among friends who say du, a speech to the meeting uses «Sie» or «ihr» for the group.", "للخطاب الرسمي صيغ ثابتة: «Liebe Mitglieder» للافتتاح، «Vielen Dank für Ihr Vertrauen»، «Ich nehme die Wahl an». وحتى بين أصدقاء يتخاطبون بـ«du»، تستعمل الكلمة أمام الجمعية «Sie» أو «ihr» للمجموعة."]
  - ask: ["Open your speech.", "افتتحي كلمتكِ.", "Liebe Mitglieder,", liebe-mitglieder]
  - ask: ["Thank them for their trust.", "اشكريهم على ثقتهم.", "Vielen Dank für Ihr Vertrauen.", das-vertrauen]
  - ask: ["Accept the election.", "اقبلي الانتخاب.", "Ich nehme die Wahl an.", ich-nehme-die-wahl-an]
  - note: ["A registered club (e.V.) is a small democracy: members elect the board at the general meeting, the treasurer reports each year, and auditors check the books. Anyone who has been a member a while can stand — newcomers are welcome, because volunteers are scarce.", "النادي المسجَّل (e.V.) ديمقراطية صغيرة: الأعضاء ينتخبون مجلس الإدارة في الجمعية العمومية، وأمين الصندوق يقدّم تقريرًا كل سنة، ومدقّقون يراجعون الحسابات. ويمكن لأي عضو مضى عليه وقت أن يترشّح — والقادمون الجدد مرحَّب بهم لأن المتطوعين قليلون."]
