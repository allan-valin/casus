id: B1-02
protagonist: m
title: ["Opinions", "الآراء", "Мислења"]
situation:
  - "In the WG kitchen. Paul wants to ban cars from the city centre. Jonas disagrees."
  - "في مطبخ السكن المشترك. باول يريد منع السيارات من وسط المدينة. يوناس لا يوافق."
  - "Во кујната на заедничкиот стан. Паул сака да ги забрани колите од центарот. Јонас не се согласува."
learn: [de-con_04]
culture: Direct disagreement
items:
  - [ich-finde-dass, "Ich finde, dass …", "I think that …", "أرى أنّ …", "Мислам дека …"]
  - [meiner-meinung-nach, "meiner Meinung nach", "in my opinion", "في رأيي", "според мене"]
  - [das-klima, "das Klima", "the climate", "المناخ", "климата"]
  - [verbieten, "verbieten", "ban, forbid", "يمنع", "забранува"]
  - [ich-bin-dagegen, "ich bin dagegen", "I'm against it", "أنا ضد ذلك", "јас сум против"]
  - [ich-bin-dafuer, "ich bin dafür", "I'm for it", "أنا مع ذلك", "јас сум за"]
  - [das-stimmt-zwar, "das stimmt zwar, aber …", "that's true, but …", "صحيح، لكن …", "тоа е точно, но …"]
  - [der-nahverkehr, "der Nahverkehr", "local public transport", "النقل المحلي", "градскиот превоз", {rare: true}]
  - [streiten, "streiten", "argue", "يتجادل", "се расправа"]
  - [wir-sind-uns-einig, "wir sind uns einig", "we agree", "نحن متفقون", "се согласуваме"]
dialogue:
  - [paul, "Ich finde, dass Autos in der Innenstadt verboten werden sollten.", "I think cars should be banned from the city centre.", "أرى أنّ السيارات يجب أن تُمنع في وسط المدينة.", "Мислам дека колите треба да се забранат во центарот."]
  - [jonas, "Ich bin dagegen. Meine Oma kann nicht laufen.", "I'm against it. My grandma can't walk.", "أنا ضد ذلك. جدتي لا تستطيع المشي.", "Јас сум против. Баба ми не може да оди."]
  - [paul, "Das stimmt zwar, aber das Klima!", "That's true, but the climate!", "صحيح، لكن المناخ!", "Тоа е точно, но климата!"]
  - [protagonist, "Und was ist deine Meinung, Jonas?", "And what's your opinion, Jonas?", "وما رأيك يا يوناس؟", "А кое е твоето мислење, Јонас?"]
  - [jonas, "Meiner Meinung nach brauchen wir besseren Nahverkehr. Dann fahren weniger Autos.", "In my opinion we need better public transport. Then fewer cars will drive.", "في رأيي نحتاج نقلًا محليًا أفضل. عندها تقلّ السيارات.", "Според мене ни треба подобар градски превоз. Тогаш ќе има помалку коли."]
  - [protagonist, "Da bin ich dafür.", "I'm for that.", "أنا مع ذلك.", "За тоа сум."]
  - [paul, "Okay. Dann sind wir uns einig.", "OK. Then we agree.", "حسنًا. إذن نحن متفقون.", "Добро. Тогаш се согласуваме."]
  - [protagonist, "Ihr streitet so offen! Ist das normal?", "You argue so openly! Is that normal?", "تتجادلون بصراحة شديدة! هل هذا عادي؟", "Толку отворено се расправате! Дали е тоа нормално?"]
  - [jonas, "Klar. Wir streiten über die Sache, nicht über die Person.", "Sure. We argue about the issue, not the person.", "طبعًا. نتجادل في الموضوع، لا في الشخص.", "Секако. Се расправаме за работата, не за човекот."]
teach:
  - ask: ["Say: I think that cars should be banned.", "قل: أرى أنّ السيارات يجب أن تُمنع.", "Кажете: мислам дека колите треба да се забранат.", "Ich finde, dass Autos verboten werden sollten.", ich-finde-dass, verbieten]
  - ask: ["Say: I'm against it.", "قل: أنا ضد ذلك.", "Кажете: јас сум против.", "Ich bin dagegen.", ich-bin-dagegen]
  - ask: ["Say: that's true, but the climate!", "قل: صحيح، لكن المناخ!", "Кажете: тоа е точно, но климата!", "Das stimmt zwar, aber das Klima!", das-stimmt-zwar, das-klima]
  - ask: ["Say: in my opinion we need better transport.", "قل: في رأيي نحتاج نقلًا أفضل.", "Кажете: според мене ни треба подобар превоз.", "Meiner Meinung nach brauchen wir besseren Nahverkehr.", meiner-meinung-nach, der-nahverkehr]
  - ask: ["Say: I'm for it.", "قل: أنا مع ذلك.", "Кажете: за тоа сум.", "Ich bin dafür.", ich-bin-dafuer]
  - ask: ["Say: then we agree.", "قل: إذن نحن متفقون.", "Кажете: тогаш се согласуваме.", "Dann sind wir uns einig.", wir-sind-uns-einig]
  - ask: ["Say: you argue so openly!", "قل: تتجادلون بصراحة شديدة!", "Кажете: толку отворено се расправате!", "Ihr streitet so offen!", streiten]
  - note: ["Disagreeing openly — «Ich bin dagegen», «Das stimmt nicht» — is normal among friends and colleagues and isn't taken personally: the argument is about the issue.", "الاختلاف الصريح — «Ich bin dagegen»، «Das stimmt nicht» — أمر عادي بين الأصدقاء والزملاء ولا يُؤخذ على محمل شخصي: النقاش حول الموضوع.", "Отвореното несогласување — «Ich bin dagegen», «Das stimmt nicht» — е нормално меѓу пријатели и колеги и не се зема лично: расправата е за работата."]
  - only: {ar: "قد تبدو هذه الصراحة جافة؛ عندنا نلطّف الاعتراض كثيرًا. هنا يُعدّ الوضوح احترامًا.", mk: "Кај нас расправата лесно станува лична; тука се расправа жестоко, па се оди заедно на пиво."}
