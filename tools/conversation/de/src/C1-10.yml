id: C1-10
protagonist: m
title: ["A death", "وفاة", "Смрт"]
situation:
  - "Herr Fischer, the volunteer from the Tafel, has died. At the memorial service you speak to his daughter."
  - "السيد فيشر، المتطوّع من بنك الطعام، توفّي. في مراسم التأبين تتحدّث إلى ابنته."
  - "Господин Фишер, волонтерот од Tafel, почина. На комеморацијата зборувате со неговата ќерка."
learn: [de-c1-funktionsverbgefuege]
culture: Mourning customs
items:
  - [das-beileid, "Mein herzliches Beileid", "My sincere condolences", "أصدق التعازي", "Искрено сочувство"]
  - [die-trauerfeier, "die Trauerfeier", "the memorial service", "مراسم التأبين", "комеморацијата", {rare: true}]
  - [die-beerdigung, "die Beerdigung", "the burial, funeral", "الدفن، الجنازة", "погребот"]
  - [verstorben, "verstorben", "deceased", "متوفّى", "починат"]
  - [die-trauerkarte, "die Trauerkarte", "the condolence card", "بطاقة التعزية", "картичката за сочувство", {rare: true}]
  - [in-gedanken, "in Gedanken bei Ihnen", "my thoughts are with you", "أفكاري معكم", "во мислите сум со вас"]
  - [er-wird-fehlen, "Er wird uns sehr fehlen", "We will miss him very much", "سنفتقده كثيرًا", "Многу ќе ни недостига"]
  - [die-erinnerung, "die Erinnerung", "the memory", "الذكرى", "споменот"]
  - [im-engsten-kreis, "im engsten Kreis", "close family only", "في أضيق نطاق عائلي", "во најтесен круг"]
  - [der-kranz, "der Kranz", "the wreath", "إكليل الزهور", "венецот"]
dialogue:
  - [protagonist, "Frau Fischer, mein herzliches Beileid.", "Mrs Fischer, my sincere condolences.", "سيدة فيشر، أصدق التعازي.", "Госпоѓо Фишер, искрено сочувство."]
  - [tochter, "Danke. Kannten Sie meinen Vater?", "Thank you. Did you know my father?", "شكرًا. هل كنتَ تعرف والدي؟", "Благодарам. Дали го познававте татко ми?"]
  - [protagonist, "Von der Tafel. Er hat mich am Anfang zu jedem Termin begleitet.", "From the Tafel. At the beginning he went with me to every appointment.", "من بنك الطعام. في البداية رافقني إلى كل موعد.", "Од Tafel. На почетокот ме придружуваше на секој термин."]
  - [tochter, "Das sieht ihm ähnlich. Er hat viel von Ihnen erzählt.", "That's just like him. He talked about you a lot.", "هذا يشبهه. لقد حدّثنا عنك كثيرًا.", "Тоа е баш тој. Многу раскажуваше за вас."]
  - [protagonist, "Er wird uns sehr fehlen. Ich bin in Gedanken bei Ihnen und Ihrer Familie.", "We will miss him very much. My thoughts are with you and your family.", "سنفتقده كثيرًا. أفكاري معكِ ومع عائلتكِ.", "Многу ќе ни недостига. Во мислите сум со вас и вашето семејство."]
  - [tochter, "Die Beerdigung ist im engsten Kreis. Aber Sie dürfen gern später ans Grab kommen.", "The burial is for close family only. But you're welcome to visit the grave later.", "الدفن يقتصر على العائلة المقرّبة. لكن مرحَّب بك أن تزور القبر لاحقًا.", "Погребот е во најтесен круг. Но слободно дојдете подоцна на гробот."]
  - [protagonist, "Bei uns kommen alle zur Beerdigung, und man bleibt tagelang bei der Familie.", "With us everyone comes to the burial, and you stay with the family for days.", "عندنا يأتي الجميع إلى الدفن، ويبقى الناس أيامًا مع العائلة.", "Кај нас сите доаѓаат на погребот, и се седи со денови кај семејството."]
  - [tochter, "Hier ist es stiller. Aber eine Karte von Ihnen würde mich freuen.", "Here it's quieter. But a card from you would mean a lot to me.", "هنا الأمر أهدأ. لكن بطاقة منك ستسعدني.", "Тука е потивко. Но картичка од вас би ме израдувала."]
teach:
  - ask: ["Offer condolences.", "قدّم التعازي.", "Изразете сочувство.", "Mein herzliches Beileid.", das-beileid]
  - ask: ["Say: the memorial service.", "قل: مراسم التأبين.", "Кажете: комеморацијата.", "Die Trauerfeier.", die-trauerfeier]
  - ask: ["Say: we will miss him very much.", "قل: سنفتقده كثيرًا.", "Кажете: многу ќе ни недостига.", "Er wird uns sehr fehlen.", er-wird-fehlen]
  - ask: ["Say: my thoughts are with you.", "قل: أفكاري معكِ.", "Кажете: во мислите сум со вас.", "Ich bin in Gedanken bei Ihnen.", in-gedanken]
  - note: ["Mourning has fixed formal phrases — use them as they are: «Mein herzliches Beileid», «Ich bin in Gedanken bei Ihnen», «Er wird uns fehlen». Speak quietly and briefly; nobody expects more.", "للحداد عبارات رسمية ثابتة — استعملها كما هي: «Mein herzliches Beileid»، «Ich bin in Gedanken bei Ihnen»، «Er wird uns fehlen». تكلّم بهدوء وباختصار؛ لا أحد يتوقّع أكثر.", "Жалоста има фиксни формални фрази — користете ги такви какви што се: «Mein herzliches Beileid», «Ich bin in Gedanken bei Ihnen», «Er wird uns fehlen». Зборувајте тивко и кратко; никој не очекува повеќе."]
  - ask: ["Say: the burial.", "قل: الدفن.", "Кажете: погребот.", "Die Beerdigung.", die-beerdigung]
  - ask: ["Say: the grave.", "قل: القبر.", "Кажете: гробот.", "Das Grab.", das-grab]
  - ask: ["She says: close family only.", "تقول: في أضيق نطاق عائلي.", "Таа вели: во најтесен круг.", "Im engsten Kreis.", im-engsten-kreis]
  - ask: ["Say: a condolence card.", "قل: بطاقة تعزية.", "Кажете: картичка за сочувство.", "Eine Trauerkarte.", die-trauerkarte]
  - ask: ["Say: a wreath.", "قل: إكليل زهور.", "Кажете: венец.", "Ein Kranz.", der-kranz]
  - ask: ["Say: a good memory.", "قل: ذكرى طيبة.", "Кажете: убав спомен.", "Eine schöne Erinnerung.", die-erinnerung]
  - ask: ["Say: the deceased.", "قل: المتوفّى.", "Кажете: починатиот.", "Der Verstorbene.", verstorben]
  - note: ["German mourning is quiet and private: the burial is often for close family ('im engsten Kreis'), others attend the memorial service, send a card or flowers, or donate as the family asks. Dark, plain clothes; no long visits to the house. Muslim and Orthodox communities in Germany keep their own customs — ask the family what they wish.", "الحداد الألماني هادئ وخاص: الدفن غالبًا للعائلة المقرّبة («im engsten Kreis»)، والآخرون يحضرون مراسم التأبين، أو يرسلون بطاقة أو زهورًا، أو يتبرّعون كما تطلب العائلة. ملابس داكنة بسيطة؛ ولا زيارات طويلة للبيت. والجماعات المسلمة والأرثوذكسية في ألمانيا تحافظ على عاداتها — اسأل العائلة عمّا تريد.", "Германската жалост е тивка и приватна: погребот често е во најтесен круг („im engsten Kreis“), другите доаѓаат на комеморацијата, праќаат картичка или цвеќе, или донираат како што бара семејството. Темна, едноставна облека; без долги посети дома. Муслиманските и православните заедници во Германија ги чуваат своите обичаи — прашајте го семејството што сака."]
