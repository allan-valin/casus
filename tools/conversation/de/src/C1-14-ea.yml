id: C1-14-ea
tracks: [en, ar]
protagonist: m
title: ["Local elections", "الانتخابات المحلية"]
situation:
  - "Local elections. Svenja votes; you can't — or can you? She tells you what she read about the Migrationsbeirat."
  - "انتخابات محلية. سفينيا تصوّت؛ وأنت لا تستطيع — أم تستطيع؟ تحكي لك ما قرأته عن مجلس الهجرة."
learn: [c1-konjunktiv-i]
culture: Who may vote
items:
  - [das-kommunale-wahlrecht, "das kommunale Wahlrecht", "the right to vote locally", "حق التصويت المحلي", {rare: true}]
  - [der-migrationsbeirat, "der Migrationsbeirat", "the migrants' advisory council", "مجلس الهجرة الاستشاري", {rare: true}]
  - [die-wahlbenachrichtigung, "die Wahlbenachrichtigung", "the polling card", "بطاقة إشعار الانتخاب", {rare: true}]
  - [das-wahllokal, "das Wahllokal", "the polling station", "مركز الاقتراع"]
  - [der-stadtrat, "der Stadtrat", "the city council", "مجلس المدينة"]
  - [kandidieren, "kandidieren", "stand (as a candidate)", "يترشّح"]
  - [es-heisse, "es heiße …", "(reported) it says …", "(منقولًا) يُقال إنّ …"]
  - [er-werde, "er werde …", "(reported) it will be …", "(منقولًا) سيكون …"]
  - [mitbestimmen, "mitbestimmen", "have a say", "يشارك في القرار"]
  - [die-stimme-abgeben, "seine Stimme abgeben", "cast one's vote", "يُدلي بصوته"]
dialogue:
  - [svenja, "Ich gehe heute ins Wahllokal. Kommst du mit?", "I'm going to the polling station today. Coming along?", "سأذهب اليوم إلى مركز الاقتراع. هل تأتي معي؟"]
  - [protagonist, "Ich darf nicht wählen. Ohne EU-Pass gibt es kein kommunales Wahlrecht.", "I'm not allowed to vote. Without an EU passport there's no right to vote locally.", "لا يحق لي التصويت. بلا جواز أوروبي لا يوجد حق تصويت محلي."]
  - [svenja, "Für den Stadtrat nicht. Aber in der Zeitung stand, es gebe einen Migrationsbeirat.", "Not for the city council. But the paper said there's a migrants' advisory council.", "ليس لمجلس المدينة. لكن الصحيفة ذكرت أنّ هناك مجلس هجرة استشاريًا."]
  - [protagonist, "Was macht der?", "What does it do?", "ماذا يفعل؟"]
  - [svenja, "Es heiße, er berate den Stadtrat. Alle Einwohner ohne deutschen Pass dürften ihn wählen.", "It says it advises the city council. All residents without a German passport may elect it.", "يُقال إنه يقدّم المشورة لمجلس المدينة. ويحق لكل السكان بلا جواز ألماني انتخابه."]
  - [protagonist, "Dann kann ich doch mitbestimmen! Und kann man da auch kandidieren?", "Then I can have a say after all! And can you stand for it too?", "إذن يمكنني أن أشارك في القرار! وهل يمكن الترشّح له أيضًا؟"]
  - [svenja, "Ja. Die nächste Wahl werde im Herbst sein, stand da.", "Yes. The next election will be in autumn, it said.", "نعم. الانتخاب القادم سيكون في الخريف، كما ورد."]
  - [protagonist, "Dann gebe ich im Herbst meine Stimme ab. Vielleicht sogar für mich selbst!", "Then I'll cast my vote in autumn. Maybe even for myself!", "إذن سأدلي بصوتي في الخريف. وربما لنفسي!"]
teach:
  - ask: ["Say: the polling station.", "قل: مركز الاقتراع.", "Das Wahllokal.", das-wahllokal]
  - ask: ["Say: without an EU passport there's no local vote.", "قل: بلا جواز أوروبي لا يوجد حق تصويت محلي.", "Ohne EU-Pass gibt es kein kommunales Wahlrecht.", das-kommunale-wahlrecht]
  - ask: ["Say: the city council.", "قل: مجلس المدينة.", "Der Stadtrat.", der-stadtrat]
  - note: ["Reporting what the newspaper says: «Es heiße, er berate den Stadtrat», «Die Wahl werde im Herbst sein». Konjunktiv I marks it as reported, not checked.", "نقل ما تقوله الصحيفة: «Es heiße, er berate den Stadtrat»، «Die Wahl werde im Herbst sein». صيغة Konjunktiv I تدلّ على أنه منقول لا متحقَّق منه."]
  - ask: ["Report: it says it advises the council.", "انقل: يُقال إنه يقدّم المشورة للمجلس.", "Es heiße, er berate den Stadtrat.", es-heisse]
  - ask: ["Say: the migrants' advisory council.", "قل: مجلس الهجرة الاستشاري.", "Der Migrationsbeirat.", der-migrationsbeirat]
  - ask: ["Report: the election will be in autumn.", "انقل: الانتخاب سيكون في الخريف.", "Die Wahl werde im Herbst sein.", er-werde]
  - ask: ["Say: then I can have a say.", "قل: إذن يمكنني أن أشارك في القرار.", "Dann kann ich mitbestimmen.", mitbestimmen]
  - ask: ["Ask: can you stand for it?", "اسأل: هل يمكن الترشّح له؟", "Kann man kandidieren?", kandidieren]
  - ask: ["Say: I'll cast my vote.", "قل: سأدلي بصوتي.", "Ich gebe meine Stimme ab.", die-stimme-abgeben]
  - ask: ["Say: the polling card.", "قل: بطاقة إشعار الانتخاب.", "Die Wahlbenachrichtigung.", die-wahlbenachrichtigung]
  - note: ["Only Germans vote in federal and state elections; EU citizens also vote in local and European elections. Residents from outside the EU have no vote in these — but many cities elect a migrants' or integration council (Migrationsbeirat, Ausländerbeirat) that advises the city council, and every resident without a German passport may vote and stand. Check whether your city has one.", "الألمان وحدهم يصوّتون في الانتخابات الاتحادية وانتخابات الولايات؛ ومواطنو الاتحاد الأوروبي يصوّتون أيضًا في الانتخابات المحلية والأوروبية. أما المقيمون من خارج الاتحاد فلا صوت لهم في هذه — لكن مدنًا كثيرة تنتخب مجلسًا للهجرة أو الاندماج يقدّم المشورة لمجلس المدينة، ويحق لكل مقيم بلا جواز ألماني التصويت فيه والترشّح. تحقّق إن كانت مدينتك تملك مجلسًا كهذا."]
