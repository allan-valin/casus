id: B1-13
protagonist: f
title: ["The Christmas party", "حفلة عيد الميلاد", "Божиќната забава"]
situation:
  - "The evening course's Christmas party. Everyone brought a small present for Secret Santa — and Professor Hartmann gives a speech."
  - "حفلة عيد الميلاد لدورة المساء. كل واحد أحضر هدية صغيرة لتبادل الهدايا السري — والبروفيسور هارتمان يلقي كلمة."
  - "Божиќната забава на вечерниот курс. Секој донесе мал подарок за тајниот Дедо Мраз — а професорот Хартман држи говор."
learn: [de-cas_08]
culture: Wichteln, the secret present
items:
  - [die-weihnachtsfeier, "die Weihnachtsfeier", "the Christmas party", "حفلة عيد الميلاد", "божиќната забава", {rare: true}]
  - [wichteln, "wichteln", "do Secret Santa", "تبادل الهدايا السري", "таен Дедо Мраз", {rare: true}]
  - [das-geschenk, "das Geschenk", "the present", "الهدية", "подарокот"]
  - [die-rede, "die Rede", "the speech", "الكلمة، الخطاب", "говорот"]
  - [des-kurses, "des Kurses", "of the course", "للدورة", "на курсот"]
  - [das-ende-des-jahres, "das Ende des Jahres", "the end of the year", "نهاية العام", "крајот на годината"]
  - [der-teilnehmer, "die Teilnehmer", "the participants", "المشاركون", "учесниците"]
  - [wegen, "wegen", "because of", "بسبب", "поради"]
  - [hoechstens, "höchstens", "at most", "على الأكثر", "најмногу"]
  - [verraten, "verraten", "give away, reveal", "يكشف", "открива"]
dialogue:
  - [hartmann, "Liebe Teilnehmer des Kurses! Am Ende des Jahres möchte ich Danke sagen.", "Dear participants of the course! At the end of the year I'd like to say thank you.", "أعزائي المشاركين في الدورة! في نهاية العام أودّ أن أقول شكرًا.", "Драги учесници на курсот! На крајот на годината сакам да кажам благодарам."]
  - [hartmann, "Wegen Ihrer Arbeit ist Ihr Deutsch so viel besser.", "Because of your work your German is so much better.", "بسبب عملكم أصبحت لغتكم الألمانية أفضل بكثير.", "Поради вашата работа германскиот ви е многу подобар."]
  - [protagonist, "Danke! Und jetzt — das Wichteln?", "Thank you! And now — Secret Santa?", "شكرًا! والآن — تبادل الهدايا السري؟", "Благодарам! А сега — тајниот Дедо Мраз?"]
  - [lena, "Ja! Jeder zieht einen Namen. Das Geschenk kostet höchstens zehn Euro.", "Yes! Everyone draws a name. The present costs ten euros at most.", "نعم! كل واحد يسحب اسمًا. الهدية تكلّف عشرة يورو على الأكثر.", "Да! Секој влече име. Подарокот чини најмногу десет евра."]
  - [protagonist, "Und wer hat mich gezogen?", "And who drew me?", "ومن سحب اسمي؟", "А кој ме извлече мене?"]
  - [lena, "Das verrate ich nicht! Das ist das Geheimnis des Wichtelns.", "I won't give that away! That's the secret of Secret Santa.", "لن أكشف ذلك! هذا سرّ تبادل الهدايا.", "Тоа нема да го откријам! Тоа е тајната на играта."]
  - [protagonist, "Oh, ein Buch! Danke, wer auch immer du bist.", "Oh, a book! Thanks, whoever you are.", "آه، كتاب! شكرًا، أيًّا كنت.", "О, книга! Благодарам, кој и да си."]
  - [hartmann, "Frohe Weihnachten und einen guten Rutsch!", "Merry Christmas and a happy New Year!", "عيد ميلاد مجيد وسنة جديدة سعيدة!", "Среќен Божиќ и среќна Нова година!"]
teach:
  - ask: ["Say: the Christmas party.", "قولي: حفلة عيد الميلاد.", "Кажете: божиќната забава.", "Die Weihnachtsfeier.", die-weihnachtsfeier]
  - note: ["The genitive says 'of' in written and formal German: «die Teilnehmer des Kurses», «das Ende des Jahres». «wegen» (because of) takes it too: «wegen Ihrer Arbeit».", "حالة الإضافة تعني «لـ / من» في الألمانية المكتوبة والرسمية: «die Teilnehmer des Kurses»، «das Ende des Jahres». و«wegen» (بسبب) تأخذها أيضًا: «wegen Ihrer Arbeit».", "Генитивот кажува „на“ во писмениот и формалниот германски: «die Teilnehmer des Kurses», «das Ende des Jahres». И «wegen» (поради) го бара: «wegen Ihrer Arbeit»."]
  - ask: ["Say: the participants of the course.", "قولي: المشاركون في الدورة.", "Кажете: учесниците на курсот.", "Die Teilnehmer des Kurses.", der-teilnehmer, des-kurses]
  - ask: ["Say: at the end of the year.", "قولي: في نهاية العام.", "Кажете: на крајот на годината.", "Am Ende des Jahres.", das-ende-des-jahres]
  - ask: ["Say: because of your work.", "قولي: بسبب عملكم.", "Кажете: поради вашата работа.", "Wegen Ihrer Arbeit.", wegen]
  - ask: ["Say: the speech.", "قولي: الكلمة.", "Кажете: говорот.", "Die Rede.", die-rede]
  - ask: ["Say: Secret Santa.", "قولي: تبادل الهدايا السري.", "Кажете: таен Дедо Мраз.", "Das Wichteln.", wichteln]
  - ask: ["Say: the present costs ten euros at most.", "قولي: الهدية تكلّف عشرة يورو على الأكثر.", "Кажете: подарокот чини најмногу десет евра.", "Das Geschenk kostet höchstens zehn Euro.", das-geschenk, hoechstens]
  - ask: ["Lena: I won't give it away!", "لينا: لن أكشف ذلك!", "Лена: нема да откријам!", "Das verrate ich nicht!", verraten]
  - note: ["Wichteln: everyone draws a name and buys a small, cheap present for that person in secret. Christmas parties at work, clubs and courses are friendly and short; you're welcome whatever your religion.", "«Wichteln»: كل واحد يسحب اسمًا ويشتري لصاحبه هدية صغيرة رخيصة سرًّا. حفلات عيد الميلاد في العمل والنوادي والدورات ودّية وقصيرة؛ وأنتِ مرحَّب بكِ أيًّا كان دينكِ.", "«Wichteln»: секој влече име и тајно купува мал, евтин подарок за тоа лице. Божиќните забави на работа, во клубови и курсеви се пријатни и кратки; добредојдени сте без оглед на верата."]
