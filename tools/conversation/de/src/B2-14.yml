id: B2-14
protagonist: f
title: ["Part time and the Kita", "الدوام الجزئي والروضة", "Скратено работно време и градинка"]
situation:
  - "Lena goes back to work after a year at home with the baby. Over coffee she tells you how she organises it."
  - "لينا تعود إلى العمل بعد سنة في البيت مع الرضيع. على القهوة تحكي لكِ كيف تنظّم الأمر."
  - "Лена се враќа на работа по една година дома со бебето. На кафе ви раскажува како го организира тоа."
learn: [de-vinf_01]
culture: Family and work
items:
  - [die-elternzeit, "die Elternzeit", "parental leave", "إجازة الوالدين", "родителското отсуство", {rare: true}]
  - [das-elterngeld, "das Elterngeld", "parental allowance", "علاوة الوالدين", "родителскиот додаток", {rare: true}]
  - [der-kitaplatz, "der Kitaplatz", "a Kita place", "مكان في الروضة", "место во градинка"]
  - [die-teilzeit, "die Teilzeit", "part time", "الدوام الجزئي", "скратено работно време"]
  - [die-warteliste, "die Warteliste", "the waiting list", "قائمة الانتظار", "листата на чекање"]
  - [statt-zu, "statt … zu", "instead of …ing", "بدلًا من أن …", "наместо да …"]
  - [ohne-zu, "ohne … zu", "without …ing", "دون أن …", "без да …"]
  - [sich-abwechseln, "sich abwechseln", "take turns", "يتناوبان", "се сменуваат"]
  - [die-eingewoehnung, "die Eingewöhnung", "the settling-in period", "فترة التأقلم", "периодот на навикнување", {rare: true}]
  - [das-schlechte-gewissen, "das schlechte Gewissen", "a guilty conscience", "تأنيب الضمير", "грижата на совеста"]
dialogue:
  - [lena, "Nach einem Jahr Elternzeit gehe ich zurück — in Teilzeit, dreißig Stunden.", "After a year of parental leave I'm going back — part time, thirty hours.", "بعد سنة من إجازة الوالدين أعود — بدوام جزئي، ثلاثين ساعة.", "По една година родителско отсуство се враќам — скратено, триесет часа."]
  - [protagonist, "Und wer passt auf die Kleine auf?", "And who looks after the little one?", "ومن يعتني بالصغيرة؟", "А кој ја чува малата?"]
  - [lena, "Wir haben endlich einen Kitaplatz! Wir standen ein Jahr auf der Warteliste.", "We finally have a Kita place! We were on the waiting list for a year.", "أخيرًا حصلنا على مكان في الروضة! بقينا سنة على قائمة الانتظار.", "Конечно имаме место во градинка! Една година бевме на листата на чекање."]
  - [protagonist, "Und dein Mann?", "And your husband?", "وزوجكِ؟", "А мажот ти?"]
  - [lena, "Er hat auch zwei Monate Elternzeit genommen. Jetzt wechseln wir uns ab, statt alles mir zu überlassen.", "He took two months of parental leave too. Now we take turns, instead of leaving everything to me.", "أخذ هو أيضًا شهرين من إجازة الوالدين. الآن نتناوب، بدلًا من أن يُترك كل شيء لي.", "И тој зеде два месеци родителско отсуство. Сега се сменуваме, наместо сѐ да ми го остави мене."]
  - [protagonist, "Bei uns hilft die Oma. Hier sind die Großeltern oft weit weg.", "With us, grandma helps. Here the grandparents are often far away.", "عندنا تساعد الجدة. هنا الأجداد غالبًا بعيدون.", "Кај нас помага бабата. Тука бабите и дедовците често се далеку."]
  - [lena, "Genau. Und die Eingewöhnung in der Kita dauert Wochen. Ohne Geduld zu haben, geht es nicht.", "Exactly. And settling in at the Kita takes weeks. It doesn't work without having patience.", "بالضبط. وفترة التأقلم في الروضة تستغرق أسابيع. لا يمكن ذلك دون أن يكون لديكِ صبر.", "Точно. А навикнувањето во градинката трае со недели. Без да имаш трпение, не оди."]
  - [protagonist, "Hast du ein schlechtes Gewissen?", "Do you feel guilty?", "هل تشعرين بتأنيب الضمير؟", "Те гризе ли совеста?"]
  - [lena, "Manchmal. Aber sie spielt mit anderen Kindern, statt allein zu Hause zu sein.", "Sometimes. But she plays with other children instead of being alone at home.", "أحيانًا. لكنها تلعب مع أطفال آخرين بدلًا من أن تكون وحدها في البيت.", "Понекогаш. Но таа си игра со други деца наместо да биде сама дома."]
teach:
  - ask: ["She says: after a year of parental leave.", "تقول: بعد سنة من إجازة الوالدين.", "Таа вели: по една година родителско отсуство.", "Nach einem Jahr Elternzeit.", die-elternzeit]
  - ask: ["Say: part time.", "قولي: دوام جزئي.", "Кажете: скратено работно време.", "In Teilzeit.", die-teilzeit]
  - ask: ["Say: a Kita place.", "قولي: مكان في الروضة.", "Кажете: место во градинка.", "Ein Kitaplatz.", der-kitaplatz]
  - ask: ["Say: on the waiting list.", "قولي: على قائمة الانتظار.", "Кажете: на листата на чекање.", "Auf der Warteliste.", die-warteliste]
  - note: ["Infinitive groups with «statt … zu» (instead of), «ohne … zu» (without) and «um … zu» (in order to): «statt allein zu Hause zu sein», «ohne Geduld zu haben». The verb with «zu» stands at the end.", "مجموعات المصدر مع «statt … zu» (بدلًا من)، و«ohne … zu» (دون أن)، و«um … zu» (لكي): «statt allein zu Hause zu sein»، «ohne Geduld zu haben». والفعل مع «zu» في الآخر.", "Инфинитивни групи со «statt … zu» (наместо), «ohne … zu» (без да) и «um … zu» (за да): «statt allein zu Hause zu sein», «ohne Geduld zu haben». Глаголот со «zu» стои на крајот."]
  - ask: ["Say: we take turns.", "قولي: نتناوب.", "Кажете: се сменуваме.", "Wir wechseln uns ab.", sich-abwechseln]
  - ask: ["Say: instead of being alone at home.", "قولي: بدلًا من أن تكون وحدها في البيت.", "Кажете: наместо да биде сама дома.", "Statt allein zu Hause zu sein.", statt-zu]
  - ask: ["Say: without having patience.", "قولي: دون أن يكون لديكِ صبر.", "Кажете: без да имаш трпение.", "Ohne Geduld zu haben.", ohne-zu]
  - ask: ["Say: the settling-in period.", "قولي: فترة التأقلم.", "Кажете: периодот на навикнување.", "Die Eingewöhnung.", die-eingewoehnung]
  - ask: ["Ask: do you feel guilty?", "اسألي: هل تشعرين بتأنيب الضمير؟", "Прашајте: те гризе ли совеста?", "Hast du ein schlechtes Gewissen?", das-schlechte-gewissen]
  - ask: ["Say: parental allowance.", "قولي: علاوة الوالدين.", "Кажете: родителски додаток.", "Das Elterngeld.", das-elterngeld]
  - note: ["Parents may take up to three years of Elternzeit with a guaranteed return to their job; Elterngeld pays part of the lost income for about a year, longer if both parents take months. From age one every child has a legal right to a Kita place — in practice there are waiting lists, so register early. The Eingewöhnung lasts weeks with a parent present.", "يحق للوالدين أخذ إجازة والدين حتى ثلاث سنوات مع ضمان العودة إلى العمل؛ وعلاوة الوالدين تعوّض جزءًا من الدخل المفقود لنحو سنة، ومدة أطول إذا أخذ الوالدان كلاهما أشهرًا. ومن عمر سنة لكل طفل حق قانوني في مكان بالروضة — لكن عمليًا هناك قوائم انتظار، فسجّلي مبكرًا. فترة التأقلم تستمر أسابيع بحضور أحد الوالدين.", "Родителите можат да земат до три години Elternzeit со загарантирано враќање на работа; Elterngeld плаќа дел од изгубениот приход околу една година, подолго ако двајцата родители земат месеци. Од една година секое дете има законско право на место во градинка — во пракса има листи на чекање, па пријавете се рано. Навикнувањето трае со недели со присуство на родител."]
