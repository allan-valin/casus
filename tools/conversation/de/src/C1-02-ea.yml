id: C1-02-ea
tracks: [en, ar]
protagonist: f
title: ["Permanent residence", "الإقامة الدائمة"]
situation:
  - "Some years in Germany now. At the Ausländerbehörde, Herr Schulz goes through the conditions for permanent residence."
  - "مضت سنوات في ألمانيا. في دائرة الأجانب يراجع السيد شولتس شروط الإقامة الدائمة."
learn: [de-c1-nominal-genitive, de-c1-funktionsverbgefuege]
culture: Permanent residence
items:
  - [der-daueraufenthalt, "der Daueraufenthalt", "permanent residence", "الإقامة الدائمة", {rare: true}]
  - [die-rentenbeitraege, "die Rentenbeiträge", "pension contributions", "اشتراكات التقاعد", {rare: true}]
  - [die-beitragsmonate, "die Beitragsmonate", "months of contributions", "أشهر الاشتراك", {rare: true}]
  - [der-sprachnachweis, "der Sprachnachweis", "proof of language level", "إثبات المستوى اللغوي", {rare: true}]
  - [leben-in-deutschland, "der Test „Leben in Deutschland“", "the 'Life in Germany' test", "اختبار «الحياة في ألمانيا»", {rare: true}]
  - [die-sicherung-des-lebensunterhalts, "die Sicherung des Lebensunterhalts", "securing one's livelihood", "تأمين المعيشة", {rare: true}]
  - [ausreichender-wohnraum, "ausreichender Wohnraum", "sufficient living space", "مسكن كافٍ"]
  - [die-erfuellung, "die Erfüllung", "the fulfilment (of conditions)", "استيفاء (الشروط)"]
  - [unbefristet, "unbefristet", "permanent, unlimited", "غير محدد المدة"]
  - [die-bearbeitungszeit, "die Bearbeitungszeit", "the processing time", "مدة المعالجة", {rare: true}]
dialogue:
  - [protagonist, "Ich möchte einen unbefristeten Aufenthalt beantragen. Was sind die Voraussetzungen?", "I'd like to apply for permanent residence. What are the conditions?", "أريد التقدّم بطلب إقامة غير محددة المدة. ما الشروط؟"]
  - [schulz, "Erstens die Sicherung des Lebensunterhalts durch eigene Arbeit.", "First, securing your livelihood through your own work.", "أولًا: تأمين المعيشة من عملكِ الخاص."]
  - [schulz, "Zweitens eine bestimmte Zahl von Beitragsmonaten in der Rentenversicherung.", "Second, a certain number of months of pension contributions.", "ثانيًا: عدد معيّن من أشهر الاشتراك في تأمين التقاعد."]
  - [protagonist, "Und die Sprache?", "And the language?", "واللغة؟"]
  - [schulz, "Ein Sprachnachweis, mindestens B1, und der Test „Leben in Deutschland“. Dazu ausreichender Wohnraum.", "Proof of language, at least B1, and the 'Life in Germany' test. Plus sufficient living space.", "إثبات لغوي، B1 على الأقل، واختبار «الحياة في ألمانيا». إضافة إلى مسكن كافٍ."]
  - [protagonist, "Mit der Blauen Karte geht es schneller, oder?", "With the Blue Card it's faster, isn't it?", "مع البطاقة الزرقاء يكون أسرع، أليس كذلك؟"]
  - [schulz, "Ja, bei Erfüllung aller Voraussetzungen deutlich schneller. Die genauen Fristen stehen auf unserer Webseite.", "Yes, if all conditions are met, considerably faster. The exact periods are on our website.", "نعم، عند استيفاء كل الشروط أسرع بكثير. المدد الدقيقة على موقعنا."]
  - [protagonist, "Und die Bearbeitungszeit?", "And the processing time?", "ومدة المعالجة؟"]
  - [schulz, "Mehrere Monate. Stellen Sie den Antrag vor Ablauf Ihres jetzigen Titels.", "Several months. Submit the application before your current permit expires.", "عدة أشهر. قدّمي الطلب قبل انتهاء إقامتكِ الحالية."]
teach:
  - ask: ["Say: I'd like to apply for permanent residence.", "قولي: أريد التقدّم بطلب إقامة دائمة.", "Ich möchte einen unbefristeten Aufenthalt beantragen.", unbefristet, der-daueraufenthalt]
  - note: ["Official German turns conditions into nouns: «die Sicherung des Lebensunterhalts» (= you can pay your own living), «bei Erfüllung aller Voraussetzungen» (= if all conditions are met), «vor Ablauf Ihres Titels» (= before your permit runs out).", "الألمانية الرسمية تحوّل الشروط إلى أسماء: «die Sicherung des Lebensunterhalts» (= أن تستطيعي إعالة نفسكِ)، «bei Erfüllung aller Voraussetzungen» (= إذا استُوفيت كل الشروط)، «vor Ablauf Ihres Titels» (= قبل انتهاء إقامتكِ)."]
  - ask: ["Say: securing one's livelihood.", "قولي: تأمين المعيشة.", "Die Sicherung des Lebensunterhalts.", die-sicherung-des-lebensunterhalts]
  - ask: ["Say: months of pension contributions.", "قولي: أشهر الاشتراك في تأمين التقاعد.", "Beitragsmonate in der Rentenversicherung.", die-beitragsmonate, die-rentenbeitraege]
  - ask: ["Say: proof of language, at least B1.", "قولي: إثبات لغوي، B1 على الأقل.", "Ein Sprachnachweis, mindestens B1.", der-sprachnachweis]
  - ask: ["Say: the 'Life in Germany' test.", "قولي: اختبار «الحياة في ألمانيا».", "Der Test „Leben in Deutschland“.", leben-in-deutschland]
  - ask: ["Say: sufficient living space.", "قولي: مسكن كافٍ.", "Ausreichender Wohnraum.", ausreichender-wohnraum]
  - ask: ["Say: if all conditions are met.", "قولي: عند استيفاء كل الشروط.", "Bei Erfüllung aller Voraussetzungen.", die-erfuellung]
  - ask: ["Ask: and the processing time?", "اسألي: ومدة المعالجة؟", "Und die Bearbeitungszeit?", die-bearbeitungszeit]
  - note: ["Permanent residence (Niederlassungserlaubnis) usually needs: some years of residence, your own income, a set number of months of pension contributions, German at B1, the 'Leben in Deutschland' test, and adequate housing. Blue Card holders and skilled workers can get it sooner. Numbers change — check the current rules and apply before your permit expires.", "الإقامة الدائمة (Niederlassungserlaubnis) تحتاج عادةً: بضع سنوات من الإقامة، ودخلًا خاصًا، وعددًا محددًا من أشهر اشتراك التقاعد، وألمانية بمستوى B1، واختبار «الحياة في ألمانيا»، ومسكنًا مناسبًا. وحاملو البطاقة الزرقاء والعمالة الماهرة يحصلون عليها أسرع. الأرقام تتغيّر — تحقّقي من القواعد الحالية وقدّمي الطلب قبل انتهاء إقامتكِ."]
