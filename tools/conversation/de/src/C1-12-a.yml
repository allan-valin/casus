id: C1-12-a
tracks: [ar]
protagonist: m
title: ["اختيار المدرسة"]
situation: ["يارا في الصف الرابع. مع زوجتك تذهبان إلى حديث الأهل مع المعلّمة: ثانوية أكاديمية أم مدرسة عامة؟"]
learn: [de-c2-extended-participle]
culture: Early school sorting
items:
  - [die-bildungsempfehlung, "die Bildungsempfehlung", "توصية المدرسة", {rare: true}]
  - [das-gymnasium, "das Gymnasium", "الثانوية الأكاديمية"]
  - [die-oberschule, "die Oberschule", "المدرسة الثانوية العامة (ساكسونيا)", {rare: true}]
  - [das-elterngespraech, "das Elterngespräch", "حديث الأهل مع المعلّم", {rare: true}]
  - [der-notendurchschnitt, "der Notendurchschnitt", "معدّل الدرجات"]
  - [die-vierte-klasse, "die vierte Klasse", "الصف الرابع"]
  - [die-durchlaessigkeit, "die Durchlässigkeit", "إمكانية الانتقال بين المدارس", {rare: true}]
  - [die-in-deutsch-erreichte, "die in Deutsch erreichte Note", "الدرجة المحقَّقة في الألمانية"]
  - [die-foerderung, "die Förderung", "الدعم (التعليمي)"]
  - [der-nachhilfeunterricht, "die Nachhilfe", "الدروس الخصوصية"]
dialogue:
  - [klassenlehrerin, "Yara ist eine gute Schülerin. Die in Mathe erreichte Note ist sehr gut.", "يارا تلميذة جيدة. الدرجة المحقَّقة في الرياضيات ممتازة."]
  - [protagonist, "Und in Deutsch?", "وفي الألمانية؟"]
  - [klassenlehrerin, "Die in Deutsch erreichte Note ist eine Drei. Für das Gymnasium braucht sie einen besseren Notendurchschnitt.", "الدرجة المحقَّقة في الألمانية ثلاثة. للثانوية الأكاديمية تحتاج معدّل درجات أفضل."]
  - [protagonist, "Sie spricht zu Hause Arabisch. Ist das ein Nachteil?", "إنها تتكلّم العربية في البيت. هل هذا عائق؟"]
  - [klassenlehrerin, "Nein, Zweisprachigkeit ist ein Vorteil. Mit Förderung in Deutsch schafft sie das.", "لا، ثنائية اللغة ميزة. مع دعم في الألمانية ستنجح."]
  - [protagonist, "Und wenn sie zuerst auf die Oberschule geht?", "وإذا ذهبت أولًا إلى المدرسة العامة؟"]
  - [klassenlehrerin, "Es gibt Durchlässigkeit. Mit guten Noten kann sie später wechseln.", "هناك إمكانية انتقال. بدرجات جيدة يمكنها أن تنتقل لاحقًا."]
  - [protagonist, "Dann organisieren wir Nachhilfe und entscheiden im Frühling.", "إذن ننظّم دروسًا خصوصية ونقرّر في الربيع."]
teach:
  - ask: ["قل: الصف الرابع.", "Die vierte Klasse.", die-vierte-klasse]
  - ask: ["قل: حديث الأهل مع المعلّمة.", "Das Elterngespräch.", das-elterngespraech]
  - note: ["الصفات الممتدة: «die in Mathe erreichte Note» (= الدرجة التي حقّقتها في الرياضيات)، «die von der Schule ausgestellte Empfehlung» (= التوصية التي تصدرها المدرسة)."]
  - ask: ["قل: الدرجة المحقَّقة في الألمانية.", "Die in Deutsch erreichte Note.", die-in-deutsch-erreichte]
  - ask: ["قل: توصية المدرسة.", "Die Bildungsempfehlung.", die-bildungsempfehlung]
  - ask: ["قل: الثانوية الأكاديمية أم المدرسة العامة.", "Gymnasium oder Oberschule.", das-gymnasium, die-oberschule]
  - ask: ["قل: معدّل الدرجات.", "Der Notendurchschnitt.", der-notendurchschnitt]
  - ask: ["قل: دعم في الألمانية.", "Förderung in Deutsch.", die-foerderung]
  - ask: ["قل: يمكنها أن تنتقل لاحقًا.", "Es gibt Durchlässigkeit.", die-durchlaessigkeit]
  - ask: ["قل: ننظّم دروسًا خصوصية.", "Wir organisieren Nachhilfe.", der-nachhilfeunterricht]
  - note: ["في معظم الولايات يُوزَّع الأطفال بعد الصف الرابع (في سن العاشرة): الثانوية الأكاديمية (Gymnasium) تؤدّي إلى البكالوريا، والمدارس الأخرى إلى مسارات مهنية. التوصية تعتمد على الدرجات، ومدى إلزاميتها يختلف بين الولايات. الانتقال لاحقًا ممكن، ويمكن نيل البكالوريا بعد ذلك. والعربية في البيت ميزة لا عائق — والدعم في الألمانية متاح في المدرسة."]
