id: B2-10-m
tracks: [mk]
protagonist: f
title: ["Пријавите во столарницата"]
situation: ["Господин Волф, таткото на Ања, има семејна столарница и бара чирак. Ве моли да му помогнете да ги прочита пријавите."]
learn: [de-mis_02, de-c1-nominal-infinitive]
culture: A family firm
items:
  - [die-tischlerei, "die Tischlerei", "столарницата", {rare: true}]
  - [der-familienbetrieb, "der Familienbetrieb", "семејната фирма", {rare: true}]
  - [der-azubi, "der Azubi", "чиракот"]
  - [die-ausbildung, "die Ausbildung", "стручното образование"]
  - [die-bewerbung-m, "die Bewerbung", "пријавата"]
  - [die-zuverlaessigkeit-m, "Zuverlässigkeit", "доверливост"]
  - [das-handwerk, "das Handwerk", "занаетот"]
  - [die-auswahl, "die Auswahl", "изборот"]
  - [geschickt, "geschickt", "вешт"]
  - [die-nachfolge, "die Nachfolge", "наследникот (во фирмата)", {rare: true}]
dialogue:
  - [herrwolf, "Unsere Tischlerei ist ein Familienbetrieb, seit drei Generationen. Jetzt brauche ich einen Azubi.", "Нашата столарница е семејна фирма веќе три генерации. Сега ми треба чирак."]
  - [protagonist, "Wie viele Bewerbungen haben Sie?", "Колку пријави имате?"]
  - [herrwolf, "Nur vier. Junge Leute wollen kein Handwerk mehr.", "Само четири. Младите веќе не сакаат занает."]
  - [protagonist, "Bei uns war Handwerk immer etwas Gutes. Mein Vater war Tischler.", "Кај нас занаетот секогаш беше нешто добро. Татко ми беше столар."]
  - [herrwolf, "Wirklich? Dann helfen Sie mir bei der Auswahl!", "Навистина? Тогаш помогнете ми во изборот!"]
  - [protagonist, "Dieser hier schreibt: „Zuverlässigkeit und Freude am Handwerk“.", "Овој тука пишува: „Доверливост и радост од занаетот“."]
  - [herrwolf, "Gut. Und geschickt? Die Ausbildung dauert drei Jahre.", "Добро. А вешт? Стручното образование трае три години."]
  - [protagonist, "Laden Sie ihn zum Probetag ein. Vielleicht wird er sogar Ihre Nachfolge.", "Поканете го на пробен ден. Можеби дури ќе стане ваш наследник."]
teach:
  - ask: ["Кажете: столарницата.", "Die Tischlerei.", die-tischlerei]
  - ask: ["Кажете: семејна фирма.", "Ein Familienbetrieb.", der-familienbetrieb]
  - ask: ["Тој вели: ми треба чирак.", "Ich brauche einen Azubi.", der-azubi]
  - ask: ["Прашајте: колку пријави имате?", "Wie viele Bewerbungen haben Sie?", die-bewerbung-m]
  - ask: ["Тој вели: младите не сакаат занает.", "Junge Leute wollen kein Handwerk.", das-handwerk]
  - note: ["Пријавите сакаат именки: «Zuverlässigkeit» (од zuverlässig), «die Auswahl» (од auswählen), «die Nachfolge» (од nachfolgen). Една именка заменува цела реченица."]
  - ask: ["Тој вели: помогнете ми во изборот.", "Helfen Sie mir bei der Auswahl.", die-auswahl]
  - ask: ["Прочитајте: доверливост.", "Zuverlässigkeit.", die-zuverlaessigkeit-m]
  - ask: ["Прашајте: а вешт?", "Und geschickt?", geschickt]
  - ask: ["Тој вели: стручното образование трае три години.", "Die Ausbildung dauert drei Jahre.", die-ausbildung]
  - ask: ["Кажете: можеби ќе стане ваш наследник.", "Vielleicht wird er Ihre Nachfolge.", die-nachfolge]
  - note: ["Во Германија многу семејни занаетчиски фирми бараат чираци и наследници. Стручното образование (Ausbildung) трае две до три години, со работа во фирмата и настава во стручно училиште, и е многу ценето."]
