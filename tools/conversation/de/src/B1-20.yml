id: B1-20
protagonist: m
title: ["Relationships", "العلاقات", "Врски"]
situation:
  - "Jonas wants to move in with his girlfriend Svenja. He asks what you think — and how it works where you're from."
  - "يوناس يريد أن يسكن مع صديقته سفينيا. يسألك عن رأيك — وكيف يجري الأمر عندكم."
  - "Јонас сака да се всели со девојката Свења. Ве прашува што мислите — и како е тоа кај вас."
learn: [de-con_04]
culture: Families and partners
items:
  - [zusammenziehen, "zusammenziehen", "move in together", "يسكنان معًا", "се вселуваат заедно"]
  - [die-freundin, "meine Freundin", "my girlfriend", "صديقتي (حبيبتي)", "мојата девојка"]
  - [den-eltern-vorstellen, "den Eltern vorstellen", "introduce to the parents", "يعرّف على الأهل", "запознава со родителите"]
  - [als-ich, "als ich …", "when I … (once, in the past)", "حين … (مرة في الماضي)", "кога … (еднаш, во минатото)"]
  - [wenn-es, "wenn …", "when(ever), if …", "عندما، كلما …", "кога, секогаш кога …"]
  - [verliebt, "verliebt", "in love", "واقع في الحب", "вљубен"]
  - [die-beziehung, "die Beziehung", "the relationship", "العلاقة", "врската"]
  - [heiraten, "heiraten", "marry", "يتزوّج", "се венчава"]
  - [seit-zwei-jahren, "seit zwei Jahren", "for two years", "منذ سنتين", "веќе две години"]
  - [die-familie-redet-mit, "die Familie redet mit", "the family has a say", "العائلة لها رأي", "семејството има збор"]
  - [ernst, "ernst", "serious", "جدّي", "сериозно"]
dialogue:
  - [jonas, "Svenja und ich wollen zusammenziehen. Wir sind seit zwei Jahren zusammen.", "Svenja and I want to move in together. We've been together for two years.", "أنا وسفينيا نريد أن نسكن معًا. نحن معًا منذ سنتين.", "Свења и јас сакаме да се вселиме заедно. Заедно сме веќе две години."]
  - [protagonist, "Dann ist es ernst! Kennen deine Eltern sie?", "Then it's serious! Do your parents know her?", "إذن الأمر جدّي! هل يعرفها والداك؟", "Тогаш е сериозно! Ја познаваат ли твоите родители?"]
  - [jonas, "Ja. Als ich sie meinen Eltern vorgestellt habe, war meine Mutter sofort verliebt.", "Yes. When I introduced her to my parents, my mother loved her straight away.", "نعم. حين عرّفتُها على والديّ، أحبّتها أمي فورًا.", "Да. Кога ја запознав со родителите, мајка ми веднаш се вљуби во неа."]
  - [protagonist, "Bei uns redet die Familie mehr mit. Zusammenziehen ohne Heirat? Schwierig.", "With us the family has more say. Moving in together without marriage? Difficult.", "عندنا العائلة لها رأي أكبر. السكن معًا بلا زواج؟ صعب.", "Кај нас семејството има повеќе збор. Заедно без венчавка? Тешко."]
  - [jonas, "Und wenn du jemanden liebst?", "And if you love someone?", "وإذا أحببتَ أحدًا؟", "А ако некого сакаш?"]
  - [protagonist, "Wenn es ernst ist, besucht man zuerst die Familien. Dann heiratet man.", "If it's serious, you first visit the families. Then you marry.", "إذا كان الأمر جدّيًا، يزور المرء العائلتين أولًا. ثم يتزوّج.", "Ако е сериозно, прво се посетуваат семејствата. Потоа се венчава."]
  - [jonas, "Bei uns heiraten viele erst nach Jahren. Oder nie!", "With us, many only marry after years. Or never!", "عندنا كثيرون يتزوّجون بعد سنوات فقط. أو أبدًا!", "Кај нас многумина се венчаваат дури по години. Или никогаш!"]
  - [protagonist, "Jede Beziehung ist anders. Viel Glück euch beiden!", "Every relationship is different. Good luck to you both!", "كل علاقة مختلفة. بالتوفيق لكما!", "Секоја врска е различна. Среќно на двајцата!"]
teach:
  - ask: ["He says: we want to move in together.", "يقول: نريد أن نسكن معًا.", "Тој вели: сакаме да се вселиме заедно.", "Wir wollen zusammenziehen.", zusammenziehen]
  - ask: ["He says: for two years.", "يقول: منذ سنتين.", "Тој вели: веќе две години.", "Seit zwei Jahren.", seit-zwei-jahren]
  - ask: ["Say: then it's serious!", "قل: إذن الأمر جدّي!", "Кажете: тогаш е сериозно!", "Dann ist es ernst!", ernst]
  - note: ["«als» is for one moment in the past: «Als ich sie vorgestellt habe…». «wenn» is for repeated, present or future events and for 'if': «Wenn es ernst ist…».", "«als» للحظة واحدة في الماضي: «Als ich sie vorgestellt habe…». و«wenn» للأحداث المتكررة أو الحاضرة أو المستقبلية ولمعنى «إذا»: «Wenn es ernst ist…».", "«als» е за еден момент во минатото: «Als ich sie vorgestellt habe…». «wenn» е за повторувани, сегашни или идни настани и за „ако“: «Wenn es ernst ist…»."]
  - ask: ["He says: when I introduced her to my parents…", "يقول: حين عرّفتُها على والديّ…", "Тој вели: кога ја запознав со родителите…", "Als ich sie meinen Eltern vorgestellt habe…", als-ich, den-eltern-vorstellen]
  - ask: ["Say: my girlfriend.", "قل: صديقتي.", "Кажете: мојата девојка.", "Meine Freundin.", die-freundin]
  - ask: ["Say: in love.", "قل: واقع في الحب.", "Кажете: вљубен.", "Verliebt.", verliebt]
  - ask: ["Say: with us the family has more say.", "قل: عندنا العائلة لها رأي أكبر.", "Кажете: кај нас семејството има повеќе збор.", "Bei uns redet die Familie mehr mit.", die-familie-redet-mit]
  - ask: ["Say: if it's serious…", "قل: إذا كان الأمر جدّيًا…", "Кажете: ако е сериозно…", "Wenn es ernst ist…", wenn-es]
  - ask: ["Say: then you marry.", "قل: ثم يتزوّج المرء.", "Кажете: потоа се венчава.", "Dann heiratet man.", heiraten]
  - ask: ["Say: every relationship is different.", "قل: كل علاقة مختلفة.", "Кажете: секоја врска е различна.", "Jede Beziehung ist anders.", die-beziehung]
  - note: ["Many German couples live together for years before marrying, or never marry; parents are told, not asked. Families elsewhere often have more say — neither is wrong, and German friends are usually curious, not judging.", "كثير من الأزواج الألمان يسكنون معًا سنوات قبل الزواج، أو لا يتزوّجون أبدًا؛ والأهل يُخبَرون ولا يُستأذنون. وفي أماكن أخرى للعائلة رأي أكبر غالبًا — ولا أحد منهما خطأ، والأصدقاء الألمان فضوليون عادةً لا يحكمون.", "Многу германски парови живеат заедно со години пред венчавка, или никогаш не се венчаваат; родителите се известуваат, не се прашуваат. Други семејства често имаат повеќе збор — ниту едното не е погрешно, а германските пријатели обично се љубопитни, не осудуваат."]
