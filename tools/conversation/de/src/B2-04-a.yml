id: B2-04-a
tracks: [ar]
protagonist: m
title: ["الاعتراف بالشهادة"]
situation: ["مساء السبت عند صديقك سامر، الطبيب السوري. يعمل في غرفة المعاطف في نادٍ ليلي ريثما يحصل على ترخيص المزاولة."]
learn: [b2-passive-past]
culture: Overqualified
items:
  - [die-garderobe, "die Garderobe", "غرفة المعاطف"]
  - [die-approbation, "die Approbation", "ترخيص مزاولة الطب", {rare: true}]
  - [die-zeugnisbewertung, "die Zeugnisbewertung", "تقييم الشهادة", {rare: true}]
  - [wurde-anerkannt, "wurde anerkannt", "اعتُرف به"]
  - [wurde-gepruft, "wurde geprüft", "فُحص، دُقّق"]
  - [ueberqualifiziert, "überqualifiziert", "مؤهَّل أكثر من اللازم"]
  - [die-kenntnispruefung, "die Kenntnisprüfung", "امتحان المعرفة", {rare: true}]
  - [die-fachsprachpruefung, "die Fachsprachprüfung", "امتحان اللغة المهنية", {rare: true}]
  - [das-dauert, "das dauert", "هذا يستغرق وقتًا"]
  - [nachts, "nachts", "ليلًا"]
dialogue:
  - [protagonist, "Samer, wie geht es mit der Approbation?", "سامر، كيف تسير أمور ترخيص المزاولة؟"]
  - [samer, "Langsam. Meine Unterlagen wurden geprüft. Jetzt kommt die Fachsprachprüfung, dann die Kenntnisprüfung.", "ببطء. فُحصت أوراقي. الآن يأتي امتحان اللغة المهنية، ثم امتحان المعرفة."]
  - [protagonist, "Und bis dahin?", "وحتى ذلك الحين؟"]
  - [samer, "Nachts arbeite ich in der Garderobe. Ein Arzt hängt Jacken auf!", "أعمل ليلًا في غرفة المعاطف. طبيب يعلّق المعاطف!"]
  - [protagonist, "Bei mir ging es schneller. Mein Diplom wurde für die Blaue Karte anerkannt — durch eine Zeugnisbewertung.", "عندي كان الأمر أسرع. اعتُرف بشهادتي للبطاقة الزرقاء — عبر تقييم الشهادة."]
  - [samer, "Ingenieur ist nicht reglementiert. Arzt schon. Das dauert.", "الهندسة ليست مهنة منظَّمة. الطب منظَّم. هذا يستغرق وقتًا."]
  - [protagonist, "Du bist so überqualifiziert.", "أنت مؤهَّل أكثر من اللازم بكثير."]
  - [samer, "Ja. Aber nächstes Jahr bin ich wieder Arzt. Inschallah.", "نعم. لكن في السنة القادمة سأعود طبيبًا. إن شاء الله."]
teach:
  - ask: ["اسأل: كيف تسير أمور ترخيص المزاولة؟", "Wie geht es mit der Approbation?", die-approbation]
  - note: ["المبني للمجهول في الماضي: «Meine Unterlagen wurden geprüft» (فُحصت أوراقي)، «Mein Diplom wurde anerkannt» (اعتُرف بشهادتي)."]
  - ask: ["يقول: فُحصت أوراقي.", "Meine Unterlagen wurden geprüft.", wurde-gepruft]
  - ask: ["قل: امتحان اللغة المهنية.", "Die Fachsprachprüfung.", die-fachsprachpruefung]
  - ask: ["قل: امتحان المعرفة.", "Die Kenntnisprüfung.", die-kenntnispruefung]
  - ask: ["يقول: أعمل ليلًا في غرفة المعاطف.", "Nachts arbeite ich in der Garderobe.", nachts, die-garderobe]
  - ask: ["قل: اعتُرف بشهادتي.", "Mein Diplom wurde anerkannt.", wurde-anerkannt]
  - ask: ["قل: تقييم الشهادة.", "Die Zeugnisbewertung.", die-zeugnisbewertung]
  - ask: ["يقول: هذا يستغرق وقتًا.", "Das dauert.", das-dauert]
  - ask: ["قل: أنت مؤهَّل أكثر من اللازم.", "Du bist überqualifiziert.", ueberqualifiziert]
  - note: ["المهن المنظَّمة — الطب والتمريض والتعليم والمحاماة — تحتاج اعترافًا رسميًا قبل مزاولتها، وغالبًا امتحان لغة مهنية وامتحان معرفة. أما الهندسة فتكفي غالبًا لتأشيرة العمل مقارنةُ الشهادة (Zeugnisbewertung). وفي الأثناء يعمل كثير من المؤهَّلين في وظائف أدنى بكثير من تدريبهم. بوابة «Anerkennung in Deutschland» تشرح الخطوات لكل مهنة."]
