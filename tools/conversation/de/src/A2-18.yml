id: A2-18
protagonist: m
title: ["Geography", "الجغرافيا", "Географија"]
situation:
  - "On the train back, Jonas shows you the map of Germany on his phone."
  - "في قطار العودة، يوناس يريك خريطة ألمانيا على هاتفه."
  - "Во возот назад, Јонас ви ја покажува картата на Германија на телефонот."
learn: [de-cas_08]
culture: East and West
items:
  - [die-karte-land, "die Landkarte", "the map", "الخريطة", "картата"]
  - [die-elbe, "die Elbe", "the Elbe (river)", "نهر إلبه", "реката Елба"]
  - [der-fluss, "der Fluss", "the river", "النهر", "реката"]
  - [das-gebirge, "das Gebirge", "the mountains", "الجبال", "планините"]
  - [im-norden, "im Norden", "in the north", "في الشمال", "на север"]
  - [im-sueden, "im Süden", "in the south", "في الجنوب", "на југ"]
  - [im-osten, "im Osten", "in the east", "في الشرق", "на исток"]
  - [das-meer, "das Meer", "the sea", "البحر", "морето"]
  - [die-hauptstadt, "die Hauptstadt", "the capital", "العاصمة", "главниот град"]
  - [des-landes, "des Landes", "of the country", "للبلد", "на земјата"]
  - [die-alpen, "die Alpen", "the Alps", "جبال الألب", "Алпите"]
dialogue:
  - [jonas, "Schau, die Landkarte. Hier ist Dresden, an der Elbe.", "Look, the map. Here's Dresden, on the Elbe.", "انظر، الخريطة. هنا دريسدن، على نهر إلبه.", "Погледни, картата. Тука е Дрезден, на Елба."]
  - [protagonist, "Ein großer Fluss! Wohin fließt er?", "A big river! Where does it flow?", "نهر كبير! إلى أين يجري؟", "Голема река! Каде тече?"]
  - [jonas, "Nach Norden, bis Hamburg und ins Meer.", "North, to Hamburg and into the sea.", "نحو الشمال، حتى هامبورغ وإلى البحر.", "На север, до Хамбург и во морето."]
  - [protagonist, "Und die Berge?", "And the mountains?", "والجبال؟", "А планините?"]
  - [jonas, "Im Süden die Alpen. Hier bei uns das Erzgebirge.", "In the south the Alps. Here near us the Ore Mountains.", "في الجنوب جبال الألب. وهنا قربنا جبال الخام.", "На југ Алпите. Тука кај нас Рудните планини."]
  - [protagonist, "Und Berlin ist die Hauptstadt des Landes.", "And Berlin is the capital of the country.", "وبرلين عاصمة البلد.", "А Берлин е главниот град на земјата."]
  - [jonas, "Genau. Leipzig, Dresden, Berlin — alles im Osten.", "Exactly. Leipzig, Dresden, Berlin — all in the east.", "بالضبط. لايبزيغ ودريسدن وبرلين — كلها في الشرق.", "Точно. Лајпциг, Дрезден, Берлин — сè на исток."]
  - [protagonist, "Ist der Osten anders als der Westen?", "Is the east different from the west?", "هل الشرق مختلف عن الغرب؟", "Дали истокот е поинаков од западот?"]
  - [jonas, "Ein bisschen. Das ist eine lange Geschichte — die Mauer.", "A bit. That's a long story — the Wall.", "قليلًا. هذه قصة طويلة — الجدار.", "Малку. Тоа е долга приказна — ѕидот."]
teach:
  - ask: ["Say: the map.", "قل: الخريطة.", "Кажете: картата.", "Die Landkarte.", die-karte-land]
  - ask: ["Say: Dresden is on the Elbe.", "قل: دريسدن على نهر إلبه.", "Кажете: Дрезден е на Елба.", "Dresden liegt an der Elbe.", die-elbe]
  - ask: ["Say: a big river!", "قل: نهر كبير!", "Кажете: голема река!", "Ein großer Fluss!", der-fluss]
  - ask: ["Say: north, into the sea.", "قل: نحو الشمال، إلى البحر.", "Кажете: на север, во морето.", "Nach Norden, ins Meer.", im-norden, das-meer]
  - ask: ["Say: in the south the Alps.", "قل: في الجنوب جبال الألب.", "Кажете: на југ Алпите.", "Im Süden die Alpen.", im-sueden, die-alpen]
  - ask: ["Say: the mountains.", "قل: الجبال.", "Кажете: планините.", "Das Gebirge.", das-gebirge]
  - note: ["The genitive says 'of': «die Hauptstadt des Landes» — the capital of the country. In speech people often use «von» instead: «die Hauptstadt von Deutschland».", "حالة الإضافة تعني «لـ / من»: «die Hauptstadt des Landes» — عاصمة البلد. وفي الكلام يستعمل الناس غالبًا «von» بدلها: «die Hauptstadt von Deutschland».", "Генитивот кажува „на“: «die Hauptstadt des Landes» — главниот град на земјата. Во говорот често се користи «von»: «die Hauptstadt von Deutschland»."]
  - ask: ["Say: Berlin is the capital of the country.", "قل: برلين عاصمة البلد.", "Кажете: Берлин е главниот град на земјата.", "Berlin ist die Hauptstadt des Landes.", die-hauptstadt, des-landes]
  - ask: ["Say: all in the east.", "قل: كلها في الشرق.", "Кажете: сè на исток.", "Alles im Osten.", im-osten]
  - note: ["Until 1990 Germany was two states. The east was the GDR; many differences of income and outlook remain, and Saxony is proud of its own dialect and history.", "حتى عام 1990 كانت ألمانيا دولتين. الشرق كان جمهورية ألمانيا الديمقراطية؛ وما زالت فروق كثيرة في الدخل والنظرة، وساكسونيا تفخر بلهجتها وتاريخها.", "До 1990 Германија беше две држави. Истокот беше ГДР; остануваат многу разлики во приходите и погледите, а Саксонија се гордее со својот дијалект и историја."]
