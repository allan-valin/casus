id: A2-15
protagonist: f
title: ["Money and per cent", "المال والنسبة المئوية", "Пари и проценти"]
situation:
  - "The January sales. A winter jacket, thirty per cent off — or is it?"
  - "تخفيضات يناير. سترة شتوية بخصم ثلاثين بالمئة — أو هكذا يبدو؟"
  - "Јануарски попусти. Зимска јакна, триесет проценти попуст — или не?"
learn: [de-a1-numbers]
culture: —
items:
  - [der-rabatt, "der Rabatt", "the discount", "الخصم", "попустот"]
  - [prozent, "Prozent", "per cent", "بالمئة", "проценти"]
  - [reduziert, "reduziert", "reduced", "مخفّض", "намалено"]
  - [die-haelfte, "die Hälfte", "half", "النصف", "половина"]
  - [der-alte-preis, "der alte Preis", "the old price", "السعر القديم", "старата цена"]
  - [der-neue-preis, "der neue Preis", "the new price", "السعر الجديد", "новата цена"]
  - [an-der-kasse, "an der Kasse", "at the till", "عند الصندوق", "на касата"]
  - [stimmt-das, "Stimmt das?", "Is that right?", "هل هذا صحيح؟", "Дали е точно?"]
  - [umtauschen, "umtauschen", "exchange (an item)", "يستبدل", "заменува"]
  - [der-kassenbon, "den Kassenbon", "the receipt", "الإيصال", "сметката", {rare: true}]
dialogue:
  - [protagonist, "Die Jacke ist reduziert? Dreißig Prozent Rabatt?", "The jacket is reduced? Thirty per cent off?", "السترة مخفّضة؟ خصم ثلاثين بالمئة؟", "Јакната е намалена? Триесет проценти попуст?"]
  - [kasse, "Ja, der alte Preis war hundert Euro.", "Yes, the old price was a hundred euros.", "نعم، السعر القديم كان مئة يورو.", "Да, старата цена беше сто евра."]
  - [protagonist, "Dann ist der neue Preis siebzig Euro.", "Then the new price is seventy euros.", "إذن السعر الجديد سبعون يورو.", "Тогаш новата цена е седумдесет евра."]
  - [kasse, "Genau. An der Kasse bekommen Sie noch zehn Prozent.", "Exactly. At the till you get another ten per cent.", "بالضبط. وعند الصندوق تحصلين على عشرة بالمئة إضافية.", "Точно. На касата добивате уште десет проценти."]
  - [protagonist, "Zehn Prozent von siebzig — dreiundsechzig Euro. Stimmt das?", "Ten per cent of seventy — sixty-three euros. Is that right?", "عشرة بالمئة من سبعين — ثلاثة وستون يورو. هل هذا صحيح؟", "Десет проценти од седумдесет — шеесет и три евра. Точно ли е?"]
  - [kasse, "Stimmt! Fast die Hälfte.", "Right! Almost half price.", "صحيح! تقريبًا النصف.", "Точно! Речиси половина."]
  - [protagonist, "Kann ich die Jacke umtauschen?", "Can I exchange the jacket?", "هل يمكنني استبدال السترة؟", "Може ли да ја заменам јакната?"]
  - [kasse, "Innerhalb von zwei Wochen, mit dem Kassenbon.", "Within two weeks, with the receipt.", "خلال أسبوعين، مع الإيصال.", "Во рок од две недели, со сметката."]
teach:
  - ask: ["Ask: is the jacket reduced?", "اسألي: هل السترة مخفّضة؟", "Прашајте: дали јакната е намалена?", "Ist die Jacke reduziert?", reduziert]
  - ask: ["Say: thirty per cent off.", "قولي: خصم ثلاثين بالمئة.", "Кажете: триесет проценти попуст.", "Dreißig Prozent Rabatt.", prozent, der-rabatt]
  - ask: ["Say: the old price was a hundred euros.", "قولي: السعر القديم كان مئة يورو.", "Кажете: старата цена беше сто евра.", "Der alte Preis war hundert Euro.", der-alte-preis]
  - ask: ["Say: the new price is seventy euros.", "قولي: السعر الجديد سبعون يورو.", "Кажете: новата цена е седумдесет евра.", "Der neue Preis ist siebzig Euro.", der-neue-preis]
  - ask: ["Say: at the till.", "قولي: عند الصندوق.", "Кажете: на касата.", "An der Kasse.", an-der-kasse]
  - ask: ["Ask: is that right?", "اسألي: هل هذا صحيح؟", "Прашајте: дали е точно?", "Stimmt das?", stimmt-das]
  - ask: ["Say: almost half.", "قولي: تقريبًا النصف.", "Кажете: речиси половина.", "Fast die Hälfte.", die-haelfte]
  - ask: ["Ask: can I exchange it?", "اسألي: هل يمكنني استبداله؟", "Прашајте: може ли да ја заменам?", "Kann ich sie umtauschen?", umtauschen]
  - ask: ["She says: with the receipt.", "تقول: مع الإيصال.", "Таа вели: со сметката.", "Mit dem Kassenbon.", der-kassenbon]
  - note: ["Two discounts multiply, they don't add: 30 % and then 10 % is 37 % off, not 40 %. Shops aren't obliged to exchange goods bought in person, but most do with the receipt — ask before you pay.", "الخصمان يُضربان ولا يُجمعان: 30 % ثم 10 % تساوي 37 %، لا 40 %. والمحلات غير ملزمة باستبدال ما يُشترى حضوريًا، لكن أغلبها يستبدل مع الإيصال — اسألي قبل الدفع.", "Два попусти се множат, не се собираат: 30 % па 10 % е 37 %, не 40 %. Продавниците не мора да заменуваат стока купена лично, но повеќето заменуваат со сметка — прашајте пред да платите."]
