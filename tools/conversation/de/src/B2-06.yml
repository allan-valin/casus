id: B2-06
protagonist: f
title: ["Chemistry", "الكيمياء", "Хемија"]
situation:
  - "A VHS evening: chemistry in the kitchen. Professor Hartmann drops lemon juice into red cabbage water."
  - "أمسية في الجامعة الشعبية: الكيمياء في المطبخ. البروفيسور هارتمان يقطّر عصير الليمون في ماء الملفوف الأحمر."
  - "Вечер на народниот универзитет: хемија во кујната. Професорот Хартман капе сок од лимон во вода од црвена зелка."
learn: [de-b2-participle-adjectives]
culture: —
items:
  - [die-saeure, "die Säure", "the acid", "الحمض", "киселината"]
  - [die-base, "die Base", "the base (alkali)", "القاعدة (القلوي)", "базата"]
  - [sauer, "sauer", "sour, acidic", "حامض", "кисело"]
  - [der-rotkohl, "der Rotkohl", "red cabbage", "الملفوف الأحمر", "црвената зелка"]
  - [die-farbe-aendert-sich, "die Farbe ändert sich", "the colour changes", "اللون يتغيّر", "бојата се менува"]
  - [das-kochende-wasser, "das kochende Wasser", "the boiling water", "الماء المغلي", "врелата вода"]
  - [die-geschnittene-zitrone, "die geschnittene Zitrone", "the cut lemon", "الليمونة المقطّعة", "исечениот лимон"]
  - [das-natron, "das Natron", "baking soda", "بيكربونات الصوديوم", "содата бикарбона", {rare: true}]
  - [der-essig, "der Essig", "vinegar", "الخل", "оцетот"]
  - [neutral, "neutral", "neutral", "متعادل", "неутрално"]
  - [der-versuch, "der Versuch", "the experiment", "التجربة", "експериментот"]
dialogue:
  - [hartmann, "Hier ist Rotkohlwasser aus dem kochenden Wasser von vorhin. Es ist lila.", "Here is red cabbage water from the boiling water earlier. It's purple.", "هذا ماء الملفوف الأحمر من الماء المغلي قبل قليل. لونه بنفسجي.", "Ова е вода од црвена зелка од врелата вода од малку порано. Виолетова е."]
  - [protagonist, "Und jetzt kommt die geschnittene Zitrone?", "And now the cut lemon goes in?", "والآن تأتي الليمونة المقطّعة؟", "А сега доаѓа исечениот лимон?"]
  - [hartmann, "Genau. Zitrone ist eine Säure. Sehen Sie? Die Farbe ändert sich — rot!", "Exactly. Lemon is an acid. See? The colour changes — red!", "بالضبط. الليمون حمض. أترين؟ اللون يتغيّر — أحمر!", "Точно. Лимонот е киселина. Гледате? Бојата се менува — црвено!"]
  - [protagonist, "Und mit Natron?", "And with baking soda?", "ومع بيكربونات الصوديوم؟", "А со сода бикарбона?"]
  - [hartmann, "Natron ist eine Base. Das Wasser wird grün oder blau.", "Baking soda is a base. The water turns green or blue.", "البيكربونات قاعدة. يصبح الماء أخضر أو أزرق.", "Содата е база. Водата станува зелена или сина."]
  - [protagonist, "Und reines Wasser ist neutral?", "And pure water is neutral?", "والماء النقي متعادل؟", "А чистата вода е неутрална?"]
  - [hartmann, "Richtig. Essig, Zitrone, Joghurt: alles Saure ist eine Säure.", "Right. Vinegar, lemon, yoghurt: everything sour is an acid.", "صحيح. الخل والليمون واللبن: كل شيء حامض هو حمض.", "Точно. Оцет, лимон, јогурт: сѐ што е кисело е киселина."]
  - [protagonist, "Ein schöner Versuch! Den zeige ich Lenas Kindern.", "A lovely experiment! I'll show it to Lena's children.", "تجربة جميلة! سأُريها لأطفال لينا.", "Убав експеримент! Ќе им го покажам на децата на Лена."]
teach:
  - ask: ["Say: red cabbage.", "قولي: الملفوف الأحمر.", "Кажете: црвена зелка.", "Der Rotkohl.", der-rotkohl]
  - note: ["Participles can work as adjectives: «kochen» → «das kochende Wasser» (boiling water, present participle -end), «schneiden» → «die geschnittene Zitrone» (the cut lemon, past participle).", "اسم الفاعل واسم المفعول يعملان صفةً: «kochen» ← «das kochende Wasser» (الماء المغلي، باللاحقة -end)، «schneiden» ← «die geschnittene Zitrone» (الليمونة المقطّعة).", "Партиципите можат да бидат придавки: «kochen» → «das kochende Wasser» (врелата вода, сегашен партицип -end), «schneiden» → «die geschnittene Zitrone» (исечениот лимон, минат партицип)."]
  - ask: ["Say: the boiling water.", "قولي: الماء المغلي.", "Кажете: врелата вода.", "Das kochende Wasser.", das-kochende-wasser]
  - ask: ["Say: the cut lemon.", "قولي: الليمونة المقطّعة.", "Кажете: исечениот лимон.", "Die geschnittene Zitrone.", die-geschnittene-zitrone]
  - ask: ["Say: lemon is an acid.", "قولي: الليمون حمض.", "Кажете: лимонот е киселина.", "Zitrone ist eine Säure.", die-saeure]
  - ask: ["Say: the colour changes.", "قولي: اللون يتغيّر.", "Кажете: бојата се менува.", "Die Farbe ändert sich.", die-farbe-aendert-sich]
  - ask: ["Say: baking soda is a base.", "قولي: البيكربونات قاعدة.", "Кажете: содата е база.", "Natron ist eine Base.", das-natron, die-base]
  - ask: ["Ask: is pure water neutral?", "اسألي: هل الماء النقي متعادل؟", "Прашајте: дали чистата вода е неутрална?", "Ist reines Wasser neutral?", neutral]
  - ask: ["Say: everything sour is an acid.", "قولي: كل شيء حامض هو حمض.", "Кажете: сѐ што е кисело е киселина.", "Alles Saure ist eine Säure.", sauer]
  - ask: ["Say: vinegar.", "قولي: الخل.", "Кажете: оцет.", "Der Essig.", der-essig]
  - ask: ["Say: a lovely experiment!", "قولي: تجربة جميلة!", "Кажете: убав експеримент!", "Ein schöner Versuch!", der-versuch]
