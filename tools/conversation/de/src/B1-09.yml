id: B1-09
protagonist: f
title: ["Earthquakes and volcanoes", "الزلازل والبراكين", "Земјотреси и вулкани"]
situation:
  - "A geology evening at the VHS: are there volcanoes in Germany? Professor Hartmann says yes."
  - "أمسية جيولوجيا في الجامعة الشعبية: هل في ألمانيا براكين؟ البروفيسور هارتمان يقول نعم."
  - "Вечер по геологија на народниот универзитет: има ли вулкани во Германија? Професорот Хартман вели да."
learn: [b1-praeteritum]
culture: —
items:
  - [der-vulkan, "der Vulkan", "the volcano", "البركان", "вулканот"]
  - [das-erdbeben, "das Erdbeben", "the earthquake", "الزلزال", "земјотресот"]
  - [die-platte, "die Platte", "the (tectonic) plate", "الصفيحة التكتونية", "плочата"]
  - [vor-langer-zeit, "vor langer Zeit", "a long time ago", "منذ زمن بعيد", "одамна"]
  - [brach-aus, "brach aus", "erupted", "ثار", "изригна"]
  - [entstand, "entstand", "came into being, formed", "تكوّن", "настана"]
  - [der-kratersee, "der Kratersee", "the crater lake", "بحيرة الفوهة", "кратерското езеро", {rare: true}]
  - [selten, "selten", "rarely", "نادرًا", "ретко"]
  - [ruhig, "ruhig", "quiet, calm", "هادئ", "мирно"]
  - [bei-uns-oft, "bei uns oft", "often where I'm from", "عندنا كثيرًا", "кај нас често"]
dialogue:
  - [hartmann, "In der Eifel gibt es Vulkane. Sie sind ruhig — im Moment.", "There are volcanoes in the Eifel. They're quiet — for now.", "في منطقة آيفل براكين. إنها هادئة — في الوقت الحالي.", "Во Ајфел има вулкани. Мирни се — засега."]
  - [protagonist, "Wann brach der letzte Vulkan aus?", "When did the last volcano erupt?", "متى ثار آخر بركان؟", "Кога изригна последниот вулкан?"]
  - [hartmann, "Vor langer Zeit, vor etwa elftausend Jahren. Dabei entstand ein Kratersee.", "A long time ago, about eleven thousand years ago. A crater lake formed then.", "منذ زمن بعيد، قبل نحو أحد عشر ألف عام. وتكوّنت حينها بحيرة فوهة.", "Одамна, пред околу единаесет илјади години. Тогаш настана кратерско езеро."]
  - [protagonist, "Und Erdbeben?", "And earthquakes?", "والزلازل؟", "А земјотреси?"]
  - [hartmann, "Selten und klein. Deutschland liegt nicht am Rand einer Platte.", "Rare and small. Germany doesn't lie on the edge of a plate.", "نادرة وصغيرة. ألمانيا لا تقع على حافة صفيحة.", "Ретки и мали. Германија не лежи на работ на плоча."]
  - [protagonist, "Bei uns gibt es oft Erdbeben.", "Where I'm from there are often earthquakes.", "عندنا تحدث الزلازل كثيرًا.", "Кај нас често има земјотреси."]
  - [hartmann, "Ja, dort treffen sich Platten. Hier ist es ruhig.", "Yes, plates meet there. Here it's quiet.", "نعم، هناك تلتقي الصفائح. هنا الوضع هادئ.", "Да, таму се среќаваат плочи. Тука е мирно."]
  - [protagonist, "Dann schlafe ich hier ruhiger!", "Then I'll sleep more peacefully here!", "إذن سأنام هنا براحة أكبر!", "Тогаш тука ќе спијам помирно!"]
teach:
  - ask: ["Say: there are volcanoes in the Eifel.", "قولي: في آيفل براكين.", "Кажете: во Ајфел има вулкани.", "In der Eifel gibt es Vulkane.", der-vulkan]
  - ask: ["Say: they're quiet.", "قولي: إنها هادئة.", "Кажете: мирни се.", "Sie sind ruhig.", ruhig]
  - ask: ["Ask: when did the last volcano erupt?", "اسألي: متى ثار آخر بركان؟", "Прашајте: кога изригна последниот вулкан?", "Wann brach der letzte Vulkan aus?", brach-aus]
  - ask: ["Say: a long time ago.", "قولي: منذ زمن بعيد.", "Кажете: одамна.", "Vor langer Zeit.", vor-langer-zeit]
  - ask: ["Say: a crater lake formed.", "قولي: تكوّنت بحيرة فوهة.", "Кажете: настана кратерско езеро.", "Ein Kratersee entstand.", entstand, der-kratersee]
  - ask: ["Ask: and earthquakes?", "اسألي: والزلازل؟", "Прашајте: а земјотреси?", "Und Erdbeben?", das-erdbeben]
  - ask: ["Say: rare and small.", "قولي: نادرة وصغيرة.", "Кажете: ретки и мали.", "Selten und klein.", selten]
  - ask: ["Say: on the edge of a plate.", "قولي: على حافة صفيحة.", "Кажете: на работ на плоча.", "Am Rand einer Platte.", die-platte]
  - ask: ["Say: where I'm from there are often earthquakes.", "قولي: عندنا تحدث الزلازل كثيرًا.", "Кажете: кај нас често има земјотреси.", "Bei uns gibt es oft Erdbeben.", bei-uns-oft]
  - note: ["Germany lies in the middle of the Eurasian plate, so earthquakes are rare and weak. The Eifel's volcanoes last erupted about 11,000 years ago and left round crater lakes, the Maare. Syria and North Macedonia, by contrast, lie near plate boundaries.", "تقع ألمانيا في وسط الصفيحة الأوراسية، لذا الزلازل فيها نادرة وضعيفة. وآخر ثوران لبراكين آيفل كان قبل نحو 11 ألف عام وترك بحيرات فوهة مستديرة. أما سوريا ومقدونيا الشمالية فتقعان قرب حدود الصفائح.", "Германија лежи во средината на Евроазиската плоча, па земјотресите се ретки и слаби. Вулканите во Ајфел последен пат изригнале пред околу 11 000 години и оставиле тркалезни кратерски езера. Сирија и Северна Македонија, пак, лежат блиску до границите на плочите."]
