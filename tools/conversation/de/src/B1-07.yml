id: B1-07
protagonist: f
title: ["The lawyer's letter", "رسالة المحامي", "Писмото од адвокатот"]
situation:
  - "A letter from a law firm: you shared a film online, they say. They want hundreds of euros. You show it to Jonas."
  - "رسالة من مكتب محاماة: يقولون إنكِ شاركتِ فيلمًا على الإنترنت. يريدون مئات اليوروهات. تُرين الرسالة ليوناس."
  - "Писмо од адвокатска канцеларија: велат дека сте споделиле филм на интернет. Бараат стотици евра. Му го покажувате на Јонас."
learn: [de-vpass_01]
culture: Copyright warning letters
items:
  - [die-abmahnung, "die Abmahnung", "the formal warning letter", "إنذار قانوني", "опомената", {rare: true}]
  - [das-urheberrecht, "das Urheberrecht", "copyright", "حقوق المؤلف", "авторското право", {rare: true}]
  - [wurde-geteilt, "wurde geteilt", "was shared", "تمت مشاركته", "беше споделен"]
  - [die-unterlassungserklaerung, "die Unterlassungserklärung", "a cease-and-desist declaration", "تعهّد بالامتناع", "изјава за прекин", {rare: true}]
  - [nicht-sofort, "nicht sofort", "not straight away", "ليس فورًا", "не веднаш"]
  - [unterschreiben-nicht, "nichts unterschreiben", "sign nothing", "لا توقّعي شيئًا", "не потпишувајте ништо"]
  - [ein-eigener-anwalt, "ein eigener Anwalt", "a lawyer of your own", "محامٍ خاص بكِ", "свој адвокат"]
  - [verhandeln, "verhandeln", "negotiate", "يفاوض", "преговара"]
  - [die-frist, "die Frist", "the deadline", "المهلة", "рокот"]
  - [mein-cousin, "mein Cousin", "my cousin", "ابن عمي / خالي", "братучед ми"]
dialogue:
  - [protagonist, "Jonas, was ist eine Abmahnung? Hier steht, ein Film wurde von mir geteilt.", "Jonas, what's an Abmahnung? It says a film was shared by me.", "يوناس، ما هي «Abmahnung»؟ مكتوب هنا أن فيلمًا شوركَ مني.", "Јонас, што е опомена? Тука пишува дека сум споделила филм."]
  - [jonas, "Oh nein. Hast du Filme über Tauschbörsen geladen?", "Oh no. Did you download films through file-sharing?", "يا للأسف. هل حمّلتِ أفلامًا عبر مواقع المشاركة؟", "О, не. Дали симнуваше филмови преку споделување датотеки?"]
  - [protagonist, "Einmal... Sie wollen achthundert Euro. Und ich soll das hier unterschreiben.", "Once... They want eight hundred euros. And I'm supposed to sign this.", "مرة واحدة... يريدون ثمانمئة يورو. ويجب أن أوقّع هذا.", "Еднаш... Бараат осумстотини евра. И треба да го потпишам ова."]
  - [jonas, "Unterschreib nichts und zahl nicht sofort! Das ist eine Unterlassungserklärung.", "Sign nothing and don't pay straight away! That's a cease-and-desist declaration.", "لا توقّعي شيئًا ولا تدفعي فورًا! هذا تعهّد بالامتناع.", "Не потпишувај ништо и не плаќај веднаш! Тоа е изјава за прекин."]
  - [protagonist, "Und jetzt? Was mache ich jetzt?", "And now? What do I do now?", "والآن؟ ماذا أفعل الآن؟", "А сега? Што правам сега?"]
  - [jonas, "Mein Cousin hatte das auch. Er ging zu einem eigenen Anwalt.", "My cousin had this too. He went to a lawyer of his own.", "ابن عمي حدث له ذلك أيضًا. ذهب إلى محامٍ خاص به.", "И братучед ми го имаше ова. Отиде кај свој адвокат."]
  - [protagonist, "Und?", "And?", "وماذا حدث؟", "И?"]
  - [jonas, "Der Anwalt hat verhandelt. Am Ende war es viel weniger. Aber achte auf die Frist!", "The lawyer negotiated. In the end it was much less. But watch the deadline!", "المحامي فاوض. في النهاية كان المبلغ أقل بكثير. لكن انتبهي للمهلة!", "Адвокатот преговараше. На крајот беше многу помалку. Но внимавај на рокот!"]
teach:
  - ask: ["Say: a formal warning letter.", "قولي: إنذار قانوني.", "Кажете: опомена.", "Eine Abmahnung.", die-abmahnung]
  - note: ["Past passive: «wurde» + participle: «Ein Film wurde geteilt» — a film was shared.", "المبني للمجهول في الماضي: «wurde» مع اسم المفعول: «Ein Film wurde geteilt» — تمت مشاركة فيلم.", "Пасив во минато: «wurde» + партицип: «Ein Film wurde geteilt» — беше споделен филм."]
  - ask: ["Say: a film was shared.", "قولي: تمت مشاركة فيلم.", "Кажете: беше споделен филм.", "Ein Film wurde geteilt.", wurde-geteilt]
  - ask: ["Say: copyright.", "قولي: حقوق المؤلف.", "Кажете: авторско право.", "Das Urheberrecht.", das-urheberrecht]
  - ask: ["Jonas: sign nothing!", "يوناس: لا توقّعي شيئًا!", "Јонас: не потпишувај ништо!", "Unterschreib nichts!", unterschreiben-nicht]
  - ask: ["Say: don't pay straight away.", "قولي: لا تدفعي فورًا.", "Кажете: не плаќај веднаш.", "Zahl nicht sofort.", nicht-sofort]
  - ask: ["Say: a cease-and-desist declaration.", "قولي: تعهّد بالامتناع.", "Кажете: изјава за прекин.", "Eine Unterlassungserklärung.", die-unterlassungserklaerung]
  - ask: ["Say: my cousin went to a lawyer of his own.", "قولي: ابن عمي ذهب إلى محامٍ خاص به.", "Кажете: братучед ми отиде кај свој адвокат.", "Mein Cousin ging zu einem eigenen Anwalt.", mein-cousin, ein-eigener-anwalt]
  - ask: ["Say: the lawyer negotiated.", "قولي: المحامي فاوض.", "Кажете: адвокатот преговараше.", "Der Anwalt hat verhandelt.", verhandeln]
  - ask: ["Say: watch the deadline!", "قولي: انتبهي للمهلة!", "Кажете: внимавај на рокот!", "Achte auf die Frist!", die-frist]
  - note: ["Sharing films or music through file-sharing networks is tracked and brings warning letters from law firms. Don't ignore the deadline — but don't sign their declaration or pay at once either. A lawyer of your own, or a consumer advice centre, often costs less than the demand and negotiates it down. (The course gives no amounts: they vary by case.)", "مشاركة الأفلام أو الموسيقى عبر شبكات تبادل الملفات تُرصد، وتجلب إنذارات من مكاتب المحاماة. لا تتجاهلي المهلة — لكن لا توقّعي تعهّدهم ولا تدفعي فورًا. محامٍ خاص بكِ أو مركز استشارات المستهلك يكلّف غالبًا أقل من المطلوب ويخفّض المبلغ بالتفاوض. (لا نذكر مبالغ: تختلف من حالة لأخرى.)", "Споделувањето филмови или музика преку мрежи за размена се следи и носи опомени од адвокатски канцеларии. Не го игнорирајте рокот — но ниту потпишувајте ја нивната изјава, ниту плаќајте веднаш. Свој адвокат или потрошувачко советувалиште често чини помалку од бараното и го намалува со преговори. (Курсот не дава износи: зависат од случајот.)"]
