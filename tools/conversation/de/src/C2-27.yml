id: C2-27
protagonist: f
title: ["Stay or go", "البقاء أم الرحيل", "Да останам или да заминам"]
situation:
  - "An offer: a good job in Munich. Or stay in Leipzig. Or go back home one day. Over a long evening, Lena helps you weigh it up."
  - "عرض: وظيفة جيدة في ميونخ. أو البقاء في لايبزيغ. أو العودة يومًا إلى الوطن. في سهرة طويلة تساعدكِ لينا على الموازنة."
  - "Понуда: добра работа во Минхен. Или да останете во Лајпциг. Или еден ден да се вратите дома. Во долга вечер Лена ви помага да одмерите."
learn: [de-vsub_02, de-vsub_03]
culture: The big decision
items:
  - [die-abwaegung, "die Abwägung", "the weighing up", "الموازنة", "одмерувањето"]
  - [das-jobangebot, "das Jobangebot", "the job offer", "عرض العمل", "понудата за работа"]
  - [das-fuer-und-wider, "das Für und Wider", "the pros and cons", "الإيجابيات والسلبيات", "за и против"]
  - [wuerde-ich-gehen, "Würde ich gehen, verlöre ich …", "If I went, I'd lose …", "لو ذهبتُ لخسرتُ …", "Да заминам, би изгубила …"]
  - [haette-ich-gewusst, "Hätte mir jemand vor zehn Jahren gesagt, …", "If someone had told me ten years ago …", "لو قال لي أحد قبل عشر سنوات …", "Да ми кажеше некој пред десет години …"]
  - [die-wurzeln, "Wurzeln schlagen", "put down roots", "يضرب جذورًا", "пушта корени"]
  - [das-bauchgefuehl, "das Bauchgefühl", "gut feeling", "الحدس", "чувството во стомакот"]
  - [der-preis, "einen Preis haben", "come at a price", "له ثمن", "има цена"]
  - [die-entscheidung-c2, "eine Entscheidung treffen", "make a decision", "يتّخذ قرارًا", "донесува одлука"]
  - [nichts-ist-endgueltig, "Nichts ist endgültig", "Nothing is final", "لا شيء نهائي", "Ништо не е конечно"]
dialogue:
  - [lena, "Also: das Jobangebot in München. Was spricht dafür?", "So: the job offer in Munich. What speaks for it?", "إذن: عرض العمل في ميونخ. ما الذي يؤيّده؟", "Значи: понудата за работа во Минхен. Што зборува за тоа?"]
  - [protagonist, "Mehr Geld, mehr Verantwortung. Aber würde ich gehen, verlöre ich alles, was ich hier aufgebaut habe.", "More money, more responsibility. But if I went, I'd lose everything I've built here.", "مال أكثر ومسؤولية أكبر. لكن لو ذهبتُ لخسرتُ كل ما بنيته هنا.", "Повеќе пари, повеќе одговорност. Но да заминам, би изгубила сѐ што изградив тука."]
  - [lena, "Und zurück in die Heimat?", "And back home?", "والعودة إلى الوطن؟", "А назад дома?"]
  - [protagonist, "Manchmal denke ich daran. Hätte mir jemand vor zehn Jahren gesagt, dass ich hier Wurzeln schlage — ich hätte gelacht.", "Sometimes I think about it. If someone had told me ten years ago that I'd put down roots here — I'd have laughed.", "أحيانًا أفكّر في ذلك. لو قال لي أحد قبل عشر سنوات إنني سأضرب جذورًا هنا — لضحكتُ.", "Понекогаш размислувам. Да ми кажеше некој пред десет години дека тука ќе пуштам корени — ќе се смеев."]
  - [lena, "Jede Entscheidung hat ihren Preis. Was sagt dein Bauchgefühl?", "Every decision comes at a price. What does your gut say?", "لكل قرار ثمنه. ماذا يقول حدسكِ؟", "Секоја одлука има своја цена. Што ти вели стомакот?"]
  - [protagonist, "Mein Bauch sagt: bleiben. Mein Kopf sagt: das Für und Wider aufschreiben.", "My gut says: stay. My head says: write down the pros and cons.", "حدسي يقول: ابقي. وعقلي يقول: اكتبي الإيجابيات والسلبيات.", "Стомакот ми вели: остани. Главата ми вели: запиши за и против."]
  - [lena, "Typisch deutsch geworden! Aber vergiss nicht: Nichts ist endgültig.", "You've become typically German! But don't forget: nothing is final.", "صرتِ ألمانية نموذجية! لكن لا تنسي: لا شيء نهائي.", "Стана типично германски! Но не заборавај: ништо не е конечно."]
  - [protagonist, "Dann treffe ich heute keine Entscheidung. Heute trinken wir Tee.", "Then I won't make a decision today. Today we drink tea.", "إذن لن أتّخذ قرارًا اليوم. اليوم نشرب الشاي.", "Тогаш денес нема да донесам одлука. Денес пиеме чај."]
teach:
  - ask: ["Say: the job offer.", "قولي: عرض العمل.", "Кажете: понудата за работа.", "Das Jobangebot.", das-jobangebot]
  - note: ["Konjunktiv for weighing a life choice: «Würde ich gehen, verlöre ich…» (if I went, I'd lose — with the old Konjunktiv II «verlöre»), «Hätte mir jemand gesagt…, hätte ich gelacht» (past unreal). The «wenn» can be dropped: the verb moves to the front.", "صيغة التمني لموازنة قرار مصيري: «Würde ich gehen, verlöre ich…» (لو ذهبتُ لخسرتُ — بالصيغة القديمة «verlöre»)، «Hätte mir jemand gesagt…, hätte ich gelacht» (فرضية ماضية). ويمكن حذف «wenn»: فيتقدّم الفعل إلى البداية.", "Konjunktiv за одмерување животен избор: «Würde ich gehen, verlöre ich…» (да заминам, би изгубила — со стариот Konjunktiv II «verlöre»), «Hätte mir jemand gesagt…, hätte ich gelacht» (минато нереално). «wenn» може да се испушти: глаголот оди напред."]
  - ask: ["Say: if I went, I'd lose everything.", "قولي: لو ذهبتُ لخسرتُ كل شيء.", "Кажете: да заминам, би изгубила сѐ.", "Würde ich gehen, verlöre ich alles.", wuerde-ich-gehen]
  - ask: ["Say: if someone had told me ten years ago…", "قولي: لو قال لي أحد قبل عشر سنوات…", "Кажете: да ми кажеше некој пред десет години…", "Hätte mir jemand vor zehn Jahren gesagt, …", haette-ich-gewusst]
  - ask: ["Say: put down roots.", "قولي: أضرب جذورًا.", "Кажете: пуштам корени.", "Wurzeln schlagen.", die-wurzeln]
  - ask: ["Say: every decision comes at a price.", "قولي: لكل قرار ثمنه.", "Кажете: секоја одлука има цена.", "Jede Entscheidung hat ihren Preis.", der-preis]
  - ask: ["Ask: what does your gut say?", "اسألي: ماذا يقول حدسكِ؟", "Прашајте: што ти вели стомакот?", "Was sagt dein Bauchgefühl?", das-bauchgefuehl]
  - ask: ["Say: write down the pros and cons.", "قولي: اكتبي الإيجابيات والسلبيات.", "Кажете: запиши за и против.", "Das Für und Wider aufschreiben.", das-fuer-und-wider, die-abwaegung]
  - ask: ["Say: nothing is final.", "قولي: لا شيء نهائي.", "Кажете: ништо не е конечно.", "Nichts ist endgültig.", nichts-ist-endgueltig]
  - ask: ["Say: I won't make a decision today.", "قولي: لن أتّخذ قرارًا اليوم.", "Кажете: денес нема да донесам одлука.", "Heute treffe ich keine Entscheidung.", die-entscheidung-c2]
  - note: ["Staying, moving within Germany, or going back are all legitimate — and none is final: residence rights, pensions and qualifications can often be kept or transferred. Before deciding, check what a longer absence means for your residence status.", "البقاء أو الانتقال داخل ألمانيا أو العودة كلها خيارات مشروعة — ولا شيء منها نهائي: حقوق الإقامة والتقاعد والمؤهّلات يمكن غالبًا الاحتفاظ بها أو نقلها. وقبل القرار، تحقّقي مما يعنيه الغياب الطويل لوضع إقامتكِ.", "Останувањето, селењето во рамки на Германија или враќањето се сите легитимни — и ниту едно не е конечно: правата на престој, пензиите и квалификациите често може да се задржат или пренесат. Пред да одлучите, проверете што значи подолго отсуство за вашиот статус на престој."]
