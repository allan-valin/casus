id: B2-16
protagonist: f
title: ["Conflict in the team", "خلاف في الفريق", "Конфликт во тимот"]
situation:
  - "Tim and his colleague Sabine are blocking each other: new system or old? Frau Schröder asks you to mediate."
  - "تيم وزميلته زابينه يعرقلان بعضهما: النظام الجديد أم القديم؟ السيدة شرودر تطلب منكِ التوسّط."
  - "Тим и колешката Сабине се блокираат: нов систем или стар? Госпоѓа Шредер ве моли да посредувате."
learn: [b2-concessive]
culture: Finding a compromise
items:
  - [der-konflikt, "der Konflikt", "the conflict", "الخلاف", "конфликтот"]
  - [die-loesung, "die Lösung", "the solution", "الحل", "решението"]
  - [der-kompromiss, "der Kompromiss", "the compromise", "الحل الوسط", "компромисот"]
  - [vermitteln, "vermitteln", "mediate", "يتوسّط", "посредува"]
  - [dennoch, "dennoch", "nonetheless", "ومع ذلك", "сепак"]
  - [obwohl-b2, "obwohl beide recht haben", "although both are right", "مع أنّ الاثنين على حق", "иако и двајцата се во право"]
  - [der-standpunkt, "der Standpunkt", "the point of view", "وجهة النظر", "гледиштето"]
  - [die-probephase, "eine Testphase", "a trial phase", "مرحلة تجريبية", "пробна фаза"]
  - [einverstanden, "einverstanden", "agreed", "موافق", "се согласувам"]
  - [blockieren, "blockieren", "block", "يعرقل", "блокира"]
dialogue:
  - [tim, "Das neue System ist schneller. Wir müssen wechseln!", "The new system is faster. We have to switch!", "النظام الجديد أسرع. يجب أن ننتقل إليه!", "Новиот систем е побрз. Мора да се смениме!"]
  - [sabine, "Und wer lernt es? Das alte funktioniert. Ich blockiere nicht — ich habe nur keine Zeit.", "And who'll learn it? The old one works. I'm not blocking — I just have no time.", "ومن سيتعلّمه؟ القديم يعمل. أنا لا أعرقل — لكن ليس لديّ وقت.", "А кој ќе го учи? Стариот работи. Не блокирам — само немам време."]
  - [protagonist, "Darf ich vermitteln? Ich verstehe beide Standpunkte.", "May I mediate? I understand both points of view.", "هل يمكنني التوسّط؟ أفهم وجهتي النظر.", "Смеам ли да посредувам? Ги разбирам двете гледишта."]
  - [tim, "Bitte.", "Please.", "تفضّلي.", "Повели."]
  - [protagonist, "Obwohl beide recht haben, brauchen wir eine Lösung. Wie wäre eine Testphase von einem Monat?", "Although you're both right, we need a solution. How about a one-month trial phase?", "مع أنّ كليكما على حق، نحتاج إلى حل. ما رأيكما في مرحلة تجريبية لشهر؟", "Иако и двајцата сте во право, ни треба решение. Што велите за пробна фаза од еден месец?"]
  - [sabine, "Und die Schulung?", "And the training?", "والتدريب؟", "А обуката?"]
  - [protagonist, "Tim zeigt es dir — während der Arbeitszeit. Dennoch bleibt das alte System als Reserve.", "Tim shows you — during working hours. Nonetheless the old system stays as a backup.", "تيم يُريكِ — خلال وقت العمل. ومع ذلك يبقى النظام القديم احتياطيًا.", "Тим ќе ти покаже — во работно време. Сепак стариот систем останува како резерва."]
  - [sabine, "Einverstanden. Das ist ein fairer Kompromiss.", "Agreed. That's a fair compromise.", "موافقة. هذا حل وسط عادل.", "Се согласувам. Тоа е фер компромис."]
  - [tim, "Okay. Konflikt gelöst!", "OK. Conflict solved!", "حسنًا. حُلّ الخلاف!", "Добро. Конфликтот е решен!"]
teach:
  - ask: ["Ask: may I mediate?", "اسألي: هل يمكنني التوسّط؟", "Прашајте: смеам ли да посредувам?", "Darf ich vermitteln?", vermitteln]
  - ask: ["Say: I understand both points of view.", "قولي: أفهم وجهتي النظر.", "Кажете: ги разбирам двете гледишта.", "Ich verstehe beide Standpunkte.", der-standpunkt]
  - ask: ["She says: I'm not blocking.", "تقول: أنا لا أعرقل.", "Таа вели: не блокирам.", "Ich blockiere nicht.", blockieren]
  - note: ["Concessive clauses again, more formal: «obwohl» (verb at the end), «dennoch» (= trotzdem, verb right after). «Obwohl beide recht haben, brauchen wir eine Lösung».", "جمل التسليم مرة أخرى، بصيغة أكثر رسمية: «obwohl» (الفعل في الآخر)، و«dennoch» (= trotzdem، والفعل بعدها مباشرة). «Obwohl beide recht haben, brauchen wir eine Lösung».", "Допусни реченици пак, поформално: «obwohl» (глаголот на крајот), «dennoch» (= trotzdem, глаголот веднаш потоа). «Obwohl beide recht haben, brauchen wir eine Lösung»."]
  - ask: ["Say: although both are right, we need a solution.", "قولي: مع أنّ الاثنين على حق، نحتاج إلى حل.", "Кажете: иако и двајцата се во право, ни треба решение.", "Obwohl beide recht haben, brauchen wir eine Lösung.", obwohl-b2, die-loesung]
  - ask: ["Suggest a trial phase.", "اقترحي مرحلة تجريبية.", "Предложете пробна фаза.", "Wie wäre eine Testphase?", die-probephase]
  - ask: ["Say: nonetheless the old system stays.", "قولي: ومع ذلك يبقى النظام القديم.", "Кажете: сепак стариот систем останува.", "Dennoch bleibt das alte System.", dennoch]
  - ask: ["She says: agreed.", "تقول: موافقة.", "Таа вели: се согласувам.", "Einverstanden.", einverstanden]
  - ask: ["Say: a fair compromise.", "قولي: حل وسط عادل.", "Кажете: фер компромис.", "Ein fairer Kompromiss.", der-kompromiss]
  - ask: ["Say: conflict solved!", "قولي: حُلّ الخلاف!", "Кажете: конфликтот е решен!", "Konflikt gelöst!", der-konflikt]
  - note: ["Team conflicts are said openly and solved on the facts: name both positions, propose something concrete and time-limited, and get a clear 'einverstanden'. Talking behind someone's back is considered worse than open disagreement.", "خلافات الفريق تُقال بصراحة وتُحلّ على أساس الوقائع: سمّي الموقفين، واقترحي شيئًا محددًا ومحدودًا بوقت، واحصلي على «einverstanden» واضحة. والكلام من وراء الظهر يُعدّ أسوأ من الاختلاف العلني.", "Тимските конфликти се кажуваат отворено и се решаваат според фактите: именувајте ги двете позиции, предложете нешто конкретно и временски ограничено и добијте јасно „einverstanden“. Зборувањето зад грб се смета за полошо од отвореното несогласување."]
