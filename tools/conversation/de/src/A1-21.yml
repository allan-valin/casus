id: A1-21
protagonist: f
title: ["Plants", "النباتات", "Растенија"]
situation:
  - "The courtyard garden. Frau Becker waters her flowers and gives you a small plant."
  - "حديقة الفناء. السيدة بيكر تسقي أزهارها وتعطيكِ نبتة صغيرة."
  - "Градината во дворот. Госпоѓа Бекер ги полева цвеќињата и ви дава мало растение."
learn: [a1-dative]
culture: —
items:
  - [der-garten, "der Garten", "the garden", "الحديقة", "градината"]
  - [die-blumen, "die Blumen", "the flowers", "الأزهار", "цвеќињата"]
  - [giessen, "gießen", "water (plants)", "يسقي", "полева"]
  - [der-baum, "der Baum", "the tree", "الشجرة", "дрвото"]
  - [im-sommer, "im Sommer", "in summer", "في الصيف", "во лето"]
  - [die-pflanze, "die Pflanze", "the plant", "النبتة", "растението"]
  - [fuer-sie, "für Sie", "for you (polite)", "لكِ (بصيغة الاحترام)", "за вас"]
  - [braucht, "braucht", "needs", "تحتاج", "има потреба од"]
  - [die-sonne, "die Sonne", "the sun", "الشمس", "сонцето"]
  - [dem-fenster, "am Fenster", "at the window", "عند النافذة", "до прозорецот"]
  - [jeden-zweiten-tag, "jeden zweiten Tag", "every other day", "كل يومين", "секој втор ден"]
  - [das-wasser, "das Wasser", "the water", "الماء", "водата"]
dialogue:
  - [becker, "Guten Tag! Gefällt Ihnen der Garten?", "Hello! Do you like the garden?", "نهارك سعيد! هل تعجبكِ الحديقة؟", "Добар ден! Ви се допаѓа градината?"]
  - [protagonist, "Ja, sehr! Die Blumen sind schön.", "Yes, very much! The flowers are lovely.", "نعم، كثيرًا! الأزهار جميلة.", "Да, многу! Цвеќињата се убави."]
  - [becker, "Ich gieße sie jeden Abend. Und der Baum ist alt — achtzig Jahre!", "I water them every evening. And the tree is old — eighty years!", "أسقيها كل مساء. والشجرة قديمة — ثمانون عامًا!", "Ги полевам секоја вечер. А дрвото е старо — осумдесет години!"]
  - [protagonist, "Im Sommer ist es hier bestimmt schön.", "In summer it must be lovely here.", "في الصيف لا بد أن المكان جميل هنا.", "Во лето сигурно е убаво тука."]
  - [becker, "Hier, eine Pflanze für Sie. Ein Basilikum.", "Here, a plant for you. Basil.", "تفضّلي، نبتة لكِ. ريحان.", "Еве, едно растение за вас. Босилек."]
  - [protagonist, "Danke! Was braucht die Pflanze?", "Thank you! What does the plant need?", "شكرًا! ماذا تحتاج النبتة؟", "Благодарам! Што му треба на растението?"]
  - [becker, "Viel Sonne. Stellen Sie sie ans Fenster.", "Lots of sun. Put it at the window.", "شمسًا كثيرة. ضعيها عند النافذة.", "Многу сонце. Ставете го до прозорецот."]
  - [protagonist, "Und Wasser? Jeden Tag?", "And water? Every day?", "والماء؟ كل يوم؟", "А вода? Секој ден?"]
  - [becker, "Jeden zweiten Tag. Nicht zu viel Wasser!", "Every other day. Not too much water!", "كل يومين. لا تكثري الماء!", "Секој втор ден. Не премногу вода!"]
teach:
  - ask: ["She asks if you like the garden. Say: yes, very much!", "تسألك إن كانت الحديقة تعجبكِ. قولي: نعم، كثيرًا!", "Ве прашува дали ви се допаѓа градината. Кажете: да, многу!", "Ja, sehr!", der-garten]
  - ask: ["Say: the flowers are lovely.", "قولي: الأزهار جميلة.", "Кажете: цвеќињата се убави.", "Die Blumen sind schön.", die-blumen]
  - ask: ["She says: I water them every evening.", "تقول: أسقيها كل مساء.", "Таа вели: ги полевам секоја вечер.", "Ich gieße sie jeden Abend.", giessen]
  - ask: ["Say: the tree is old.", "قولي: الشجرة قديمة.", "Кажете: дрвото е старо.", "Der Baum ist alt.", der-baum]
  - ask: ["Say: in summer it's lovely here.", "قولي: في الصيف المكان جميل هنا.", "Кажете: во лето е убаво тука.", "Im Sommer ist es hier schön.", im-sommer]
  - ask: ["She says: a plant for you.", "تقول: نبتة لكِ.", "Таа вели: растение за вас.", "Eine Pflanze für Sie.", die-pflanze, fuer-sie]
  - ask: ["Ask: what does the plant need?", "اسألي: ماذا تحتاج النبتة؟", "Прашајте: што му треба на растението?", "Was braucht die Pflanze?", braucht]
  - note: ["After «an», «in», «mit» and some other words, articles change again — the dative: «das Fenster» → «am Fenster», «der Garten» → «im Garten». For now, learn these as fixed phrases.", "بعد «an» و«in» و«mit» وكلمات أخرى تتغير الأدوات مرة أخرى — حالة الجر: «das Fenster» → «am Fenster»، «der Garten» → «im Garten». احفظيها الآن كعبارات ثابتة.", "По «an», «in», «mit» и некои други зборови членовите пак се менуваат — датив: «das Fenster» → «am Fenster», «der Garten» → «im Garten». Засега учете ги како готови изрази."]
  - ask: ["She says: lots of sun, at the window.", "تقول: شمس كثيرة، عند النافذة.", "Таа вели: многу сонце, до прозорецот.", "Viel Sonne. Am Fenster.", die-sonne, dem-fenster]
  - ask: ["She says: every other day.", "تقول: كل يومين.", "Таа вели: секој втор ден.", "Jeden zweiten Tag.", jeden-zweiten-tag]
  - ask: ["She says: not too much water!", "تقول: لا تكثري الماء!", "Таа вели: не премногу вода!", "Nicht zu viel Wasser!", das-wasser, zu]
