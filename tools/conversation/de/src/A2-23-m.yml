id: A2-23-m
tracks: [mk]
protagonist: f
title: ["Ден на отворени врати"]
situation: ["Лука ќе тргне на училиште за две години. Со Ања одите на денот на отворени врати."]
learn: [de-vcp_03]
culture: Starting school and the Schultüte
items:
  - [die-schule, "die Schule", "училиштето"]
  - [der-tag-der-offenen-tuer, "der Tag der offenen Tür", "денот на отворени врати", {rare: true}]
  - [die-einschulung, "die Einschulung", "поаѓањето на училиште", {rare: true}]
  - [die-schultuete, "die Schultüte", "кесата со слатки за првиот ден", {rare: true}]
  - [die-klasse, "die Klasse", "одделението"]
  - [der-lehrer, "der Lehrer", "учителот"]
  - [ist-gegangen, "bin … gegangen", "одев"]
  - [habe-bekommen, "habe … bekommen", "добив"]
  - [mit-sechs, "mit sechs Jahren", "на шест години"]
  - [der-ranzen, "der Ranzen", "училишната чанта", {rare: true}]
dialogue:
  - [anja, "Hier ist die Schule. Heute ist Tag der offenen Tür.", "Ова е училиштето. Денес е ден на отворени врати."]
  - [protagonist, "Wann kommt Luka in die Schule?", "Кога Лука ќе тргне на училиште?"]
  - [anja, "Mit sechs Jahren. Die Einschulung ist ein großes Fest.", "На шест години. Поаѓањето на училиште е голем празник."]
  - [lehrerin, "Willkommen! Das ist eine erste Klasse.", "Добредојдовте! Ова е прво одделение."]
  - [protagonist, "Ich bin auch mit sechs in die Schule gegangen — in Bitola.", "И јас тргнав на училиште на шест години — во Битола."]
  - [anja, "Und hast du eine Schultüte bekommen?", "И доби ли кеса со слатки?"]
  - [protagonist, "Eine Schultüte? Nein. Was ist das?", "Кеса со слатки? Не. Што е тоа?"]
  - [anja, "Eine große Tüte mit Süßigkeiten, für den ersten Schultag. Und einen Ranzen!", "Голема кеса со слатки, за првиот училишен ден. И училишна чанта!"]
  - [protagonist, "Dann kaufe ich die Schultüte für Luka!", "Тогаш јас ќе ја купам кесата за Лука!"]
teach:
  - ask: ["Кажете: денот на отворени врати.", "Der Tag der offenen Tür.", der-tag-der-offenen-tuer]
  - ask: ["Прашајте: кога Лука оди на училиште?", "Wann kommt Luka in die Schule?", die-schule]
  - ask: ["Кажете: на шест години.", "Mit sechs Jahren.", mit-sechs]
  - ask: ["Кажете: поаѓањето на училиште е голем празник.", "Die Einschulung ist ein großes Fest.", die-einschulung]
  - ask: ["Кажете: прво одделение.", "Eine erste Klasse.", die-klasse]
  - note: ["Многу партиципи се неправилни: «gegangen» (одев), «bekommen» (добив). Учете ги со глаголот."]
  - ask: ["Кажете: и јас тргнав на училиште на шест.", "Ich bin auch mit sechs in die Schule gegangen.", ist-gegangen]
  - ask: ["Ања прашува: доби ли кеса со слатки?", "Hast du eine Schultüte bekommen?", habe-bekommen, die-schultuete]
  - ask: ["Кажете: училишната чанта.", "Der Ranzen.", der-ranzen]
  - ask: ["Кажете: учителот.", "Der Lehrer.", der-lehrer]
  - note: ["Првиот училишен ден е семеен празник: детето добива „Schultüte“, голема кеса со слатки и подароци, а бабите и дедовците доаѓаат. Подарок од баба е многу добредојден."]
