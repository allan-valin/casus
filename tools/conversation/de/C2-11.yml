steps:
- type: narrator
  text:
    en: Herr Yilmaz is retiring after thirty years. His daughter Elif takes over the shop — and changes a few things. Listen to the conversation; you don't need to understand it yet.
    ar: السيد يلماز يتقاعد بعد ثلاثين عامًا. ابنته إليف تتولّى المتجر — وتغيّر بعض الأشياء. استمعي إلى المحادثة؛ لا داعي لأن تفهميها الآن.
    mk: Господин Јилмаз се пензионира по триесет години. Ќерка му Елиф го презема дуќанот — и менува некои работи. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: yilmaz
    text: Nach dreißig Jahren gehe ich in den Ruhestand. Elif übernimmt.
    meaning:
      en: After thirty years I'm retiring. Elif is taking over.
      ar: بعد ثلاثين عامًا أتقاعد. إليف تتولّى الأمر.
      mk: По триесет години одам во пензија. Елиф презема.
  - speaker: protagonist
    text: Ihr Lebenswerk! Fällt Ihnen die Übergabe schwer?
    meaning:
      en: Your life's work! Is the handover hard for you?
      ar: عمل عمرك! هل يصعب عليك التسليم؟
      mk: Вашето животно дело! Дали ви е тешко предавањето?
  - speaker: yilmaz
    text: Ein bisschen. Aber die Nachfolge in der Familie ist ein Glück. Viele Läden schließen.
    meaning:
      en: A little. But succession within the family is lucky. Many shops close.
      ar: قليلًا. لكن الخلافة داخل العائلة نعمة. كثير من المحلات تُغلق.
      mk: Малку. Но наследувањето во семејството е среќа. Многу дуќани се затвораат.
  - speaker: elif
    text: 'Die Weiterführung ist klar — aber mit einer Neuausrichtung: Bio-Gemüse und ein Onlineshop.'
    meaning:
      en: 'Continuing is clear — but with a new direction: organic vegetables and an online shop.'
      ar: 'الاستمرار واضح — لكن بتوجّه جديد: خضروات عضوية ومتجر إلكتروني.'
      mk: 'Продолжувањето е јасно — но со нова насока: органски зеленчук и онлајн продавница.'
  - speaker: protagonist
    text: Und die Stammkundschaft? Frau Becker kauft hier seit zwanzig Jahren.
    meaning:
      en: And the regular customers? Frau Becker has shopped here for twenty years.
      ar: والزبائن الدائمون؟ السيدة بيكر تشتري من هنا منذ عشرين عامًا.
      mk: А редовните муштерии? Госпоѓа Бекер купува тука дваесет години.
  - speaker: elif
    text: 'Die Tradition bleibt: Papa steht samstags weiter auf dem Markt — und erzählt seine Witze.'
    meaning:
      en: 'Tradition stays: Dad will still be at the market on Saturdays — telling his jokes.'
      ar: 'التقليد باقٍ: أبي سيبقى في السوق أيام السبت — ويحكي نكاته.'
      mk: 'Традицијата останува: тато и понатаму сабота е на пазарот — и раскажува шеги.'
  - speaker: yilmaz
    text: Unter neuer Leitung, aber mit altem Humor!
    meaning:
      en: Under new management, but with the old humour!
      ar: بإدارة جديدة، لكن بالفكاهة القديمة!
      mk: Под ново раководство, но со стариот хумор!
  - speaker: protagonist
    text: Dann viel Erfolg — Ihnen beiden!
    meaning:
      en: Then every success — to both of you!
      ar: إذن كل النجاح — لكما أنتما الاثنين!
      mk: Тогаш многу успех — на двајцата!
- type: prompt
  ask:
    en: 'He says: I''m retiring.'
    ar: 'يقول: أتقاعد.'
    mk: 'Тој вели: одам во пензија.'
  answer:
    speaker: protagonist
    text: Ich gehe in den Ruhestand.
  items:
  - der-ruhestand
- type: prompt
  ask:
    en: 'Say: your life''s work.'
    ar: 'قولي: عمل عمرك.'
    mk: 'Кажете: вашето животно дело.'
  answer:
    speaker: protagonist
    text: Ihr Lebenswerk.
  items:
  - das-lebenswerk
- type: narrator
  text:
    en: 'Business German packs plans into nouns: «die Übergabe» (handing over), «die Nachfolge» (succeeding), «die Weiterführung» (carrying on), «die Neuausrichtung» (re-orienting). Elif''s sentence is
      a plan in four nouns.'
    ar: 'ألمانية الأعمال تحشر الخطط في أسماء: «die Übergabe» (التسليم)، «die Nachfolge» (الخلافة)، «die Weiterführung» (الاستمرار)، «die Neuausrichtung» (إعادة التوجيه). جملة إليف خطة في أربعة أسماء.'
    mk: 'Деловниот германски ги пакува плановите во именки: «die Übergabe» (предавање), «die Nachfolge» (наследување), «die Weiterführung» (продолжување), «die Neuausrichtung» (нова насока). Реченицата
      на Елиф е план во четири именки.'
- type: prompt
  ask:
    en: 'Ask: is the handover hard for you?'
    ar: 'اسألي: هل يصعب عليك التسليم؟'
