    text: Unter neuer Leitung.
  items:
  - unter-neuer-leitung
- type: narrator
  text:
    en: Many small family firms in Germany close for lack of a successor. When children take over, they often modernise while keeping the regulars — and the old owner usually stays around for a while to
      hand over relationships, not just keys.
    ar: كثير من المشاريع العائلية الصغيرة في ألمانيا تُغلق لعدم وجود خليفة. وحين يتولّى الأبناء، غالبًا ما يحدّثون المحل مع الحفاظ على الزبائن الدائمين — ويبقى المالك القديم عادةً لفترة ليسلّم العلاقات
      لا المفاتيح فقط.
    mk: Многу мали семејни фирми во Германија се затвораат поради недостиг на наследник. Кога децата преземаат, често модернизираат, а ги задржуваат редовните — а стариот сопственик обично останува некое
      време за да ги предаде врските, не само клучевите.
