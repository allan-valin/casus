steps:
- type: narrator
  text:
    mk: Петар и Ања ве водат на балканска вечер во ресторан — со жива музика. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: petar
    text: Wir treffen uns mit Freunden. Heute gibt es Livemusik!
    meaning:
      mk: Се среќаваме со пријатели. Вечерва има жива музика!
  - speaker: protagonist
    text: Ich freue mich! Balkanmusik in Leipzig?
    meaning:
      mk: Се радувам! Балканска музика во Лајпциг?
  - speaker: anja
    text: Ja, jeden ersten Samstag. Setzen wir uns hier.
    meaning:
      mk: Да, секоја прва сабота. Да седнеме тука.
  - speaker: protagonist
    text: Das ist wie zu Hause! Laut und fröhlich.
    meaning:
      mk: Ова е како дома! Гласно и весело.
  - speaker: anja
    text: Alle tanzen. Machen Sie mit?
    meaning:
      mk: Сите играат. Ќе се приклучите?
  - speaker: protagonist
    text: Natürlich! Ich erinnere mich an dieses Lied.
    meaning:
      mk: Секако! Се сеќавам на оваа песна.
  - speaker: petar
    text: Papa, du tanzt besser als ich.
    meaning:
      mk: Тато, играш подобро од мене.
  - speaker: protagonist
    text: Hier fühle ich mich wohl.
    meaning:
      mk: Тука се чувствувам убаво.
- type: narrator
  text:
    mk: 'Повратните глаголи користат «mich», «dich», «uns»: «ich freue mich» (се радувам), «wir treffen uns» (се среќаваме), «ich erinnere mich» (се сеќавам).'
