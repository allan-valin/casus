steps:
- type: narrator
  text:
    mk: Петар размислува да стане Германец. Ви раскажува што му рекле во канцеларијата. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: petar
    text: Papa, ich will Deutscher werden. Dann habe ich das volle Wahlrecht.
    meaning:
      mk: Тато, сакам да станам Германец. Тогаш имам целосно право на глас.
  - speaker: protagonist
    text: Musst du dann den mazedonischen Pass abgeben?
    meaning:
      mk: Тогаш мора ли да се откажеш од македонскиот пасош?
  - speaker: petar
    text: Nein. Die Beamtin sagte, die doppelte Staatsangehörigkeit sei heute möglich. Ich könne alle behalten.
    meaning:
      mk: Не. Службеничката рече дека двојното државјанство денес е можно. Можам да ги задржам сите.
  - speaker: protagonist
    text: Und was musst du machen?
    meaning:
      mk: А што треба да направиш?
  - speaker: petar
    text: Sie sagte, ich müsse den Test machen — für mich kein Problem.
    meaning:
      mk: Рече дека морам да го положам тестот — за мене не е проблем.
  - speaker: protagonist
    text: Und Luka?
    meaning:
      mk: А Лука?
  - speaker: petar
    text: Luka ist von Geburt an Deutscher, weil Anja Deutsche ist. Und Mazedonier kann er auch sein.
    meaning:
      mk: Лука е Германец од раѓање, затоа што Ања е Германка. А може да биде и Македонец.
  - speaker: protagonist
    text: Dann hängen wir die Urkunde neben das Familienfoto.
    meaning:
      mk: Тогаш исправата ќе ја закачиме до семејната фотографија.
