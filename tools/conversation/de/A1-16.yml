- type: narrator
  text:
    en: Offices and banks do exactly what the form says and rarely work out your case for you. Bring every document you have, in originals and copies; many things — the tax ID, the card, the PIN — arrive
      later by post, in separate letters.
    ar: الدوائر والبنوك تتبع الاستمارة حرفيًا ونادرًا ما تحلّ حالتك عنك. أحضر كل أوراقك، الأصل والنسخة؛ وكثير من الأشياء — الرقم الضريبي، البطاقة، الرقم السري — تصل لاحقًا بالبريد، في رسائل منفصلة.
    mk: Службите и банките работат точно според формуларот и ретко сами ќе го решат вашиот случај. Носете ги сите документи, оригинал и копија; многу работи — даночниот број, картичката, ПИН-от — доаѓаат
      подоцна по пошта, во посебни писма.
