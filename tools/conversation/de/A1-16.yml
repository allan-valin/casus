steps:
- type: narrator
  text:
    en: You want an account. The clerk is in a hurry and asks for papers you don't have. Listen to the conversation; you don't need to understand it yet.
    ar: تريد فتح حساب. الموظف مستعجل ويطلب أوراقًا ليست معك. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Сакате сметка. Службеникот брза и бара документи што ги немате. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Guten Tag. Ich will ein Konto eröffnen.
    meaning:
      en: Hello. I want to open an account.
      ar: نهارك سعيد. أريد أن أفتح حسابًا.
      mk: Добар ден. Сакам да отворам сметка.
  - speaker: kasse
    text: Haben Sie einen Termin?
    meaning:
      en: Do you have an appointment?
      ar: هل عندك موعد؟
      mk: Имате ли термин?
  - speaker: protagonist
    text: Ja, um elf. Welche Unterlagen brauchen Sie?
    meaning:
      en: Yes, at eleven. Which documents do you need?
      ar: نعم، في الحادية عشرة. أيّ أوراق تحتاجون؟
      mk: Да, во единаесет. Кои документи ви требаат?
  - speaker: kasse
    text: Den Pass, die Meldebescheinigung und die Steuer-ID.
    meaning:
      en: The passport, the registration certificate and the tax ID.
      ar: جواز السفر، وشهادة تسجيل السكن، والرقم الضريبي.
      mk: Пасошот, потврдата за пријава и даночниот број.
  - speaker: protagonist
    text: Die Steuer-ID habe ich nicht.
    meaning:
      en: I don't have the tax ID.
      ar: الرقم الضريبي ليس معي.
      mk: Даночниот број го немам.
  - speaker: kasse
    text: Die kommt per Post, nach der Anmeldung. Wollen Sie heute schon unterschreiben?
    meaning:
      en: It comes by post, after registration. Do you want to sign today already?
      ar: يأتي بالبريد بعد تسجيل السكن. هل تريد أن توقّع اليوم؟
      mk: Доаѓа по пошта, по пријавата. Сакате ли денес да потпишете?
  - speaker: protagonist
    text: Ja, bitte.
    meaning:
      en: Yes, please.
      ar: نعم، من فضلك.
      mk: Да, ве молам.
  - speaker: kasse
    text: Hier unterschreiben. Die Karte kommt in einer Woche. Nächster, bitte!
    meaning:
      en: Sign here. The card comes in a week. Next, please!
      ar: وقّع هنا. البطاقة تصل خلال أسبوع. التالي من فضلك!
      mk: Потпишете тука. Картичката доаѓа за една недела. Следен, ве молам!
- type: prompt
  ask:
    en: 'Say: I want to open an account.'
    ar: 'قل: أريد أن أفتح حسابًا.'
    mk: 'Кажете: сакам да отворам сметка.'
  answer:
    speaker: protagonist
    text: Ich will ein Konto eröffnen.
  items:
  - ich-will
  - ein-konto
  - eroeffnen
- type: narrator
  text:
    en: '«wollen» — want: «ich will», «Sie wollen». Softer and politer is «ich möchte». The second verb goes to the end.'
    ar: '«wollen» يعني: يريد. «ich will»، «Sie wollen». والأكثر لطفًا وأدبًا: «ich möchte». والفعل الثاني يذهب إلى آخر الجملة.'
    mk: '«wollen» — сака: «ich will», «Sie wollen». Помеко и поучтиво е «ich möchte». Вториот глагол оди на крајот.'
- type: prompt
  ask:
    en: Ask which documents they need.
    ar: اسأل أيّ أوراق يحتاجون.
    mk: Прашајте кои документи им требаат.
  answer:
    speaker: protagonist
    text: Welche Unterlagen brauchen Sie?
  items:
  - welche-unterlagen
- type: prompt
  ask:
    en: 'Say: the passport.'
    ar: 'قل: جواز السفر.'
