- type: narrator
  text:
    en: Frau Becker shows you the flat. You look for the kitchen. Listen to the conversation; you don't need to understand it yet.
- type: dialogue
  lines:
  - speaker: becker
    text: Hier ist die Wohnung. Das ist das Zimmer.
    meaning:
      en: Here's the flat. This is the room.
  - speaker: protagonist
    text: Schön! Und die Küche?
    meaning:
      en: Nice! And the kitchen?
  - speaker: becker
    text: Es gibt keine Küche. Nur die Anschlüsse.
    meaning:
      en: There's no kitchen. Only the connections.
  - speaker: protagonist
    text: Keine Küche? Auch keine Spüle?
    meaning:
      en: No kitchen? No sink either?
  - speaker: becker
    text: Nein. Die Küche kaufen Sie selbst.
    meaning:
      en: No. You buy the kitchen yourself.
  - speaker: protagonist
    text: Wo kaufe ich eine Küche?
    meaning:
      en: Where do I buy a kitchen?
  - speaker: becker
    text: Im Möbelhaus, oder gebraucht im Internet.
    meaning:
      en: At a furniture store, or second-hand online.
  - speaker: protagonist
    text: Und der Kühlschrank?
    meaning:
      en: And the fridge?
  - speaker: becker
    text: Auch nicht. Viel Glück!
    meaning:
      en: Not that either. Good luck!
