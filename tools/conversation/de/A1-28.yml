steps:
- type: narrator
  text:
    en: A video call home in the stairwell, where the signal is good. Frau Becker passes and is curious. Listen to the conversation; you don't need to understand it yet.
    ar: مكالمة فيديو مع الأهل على الدرج، حيث الإشارة جيدة. السيدة بيكر تمر وتسأل بفضول. استمع إلى المحادثة؛ لا داعي لأن تفهمها الآن.
    mk: Видеоповик дома на скалите, каде што сигналот е добар. Госпоѓа Бекер поминува и е љубопитна. Слушнете го разговорот; уште не мора да го разберете.
- type: dialogue
  lines:
  - speaker: becker
    text: Ist das Ihre Familie?
    meaning:
      en: Is that your family?
      ar: هل هذه عائلتك؟
      mk: Дали е ова вашето семејство?
  - speaker: protagonist
    text: Ja! Das ist meine Schwester, und das sind ihre Kinder.
    meaning:
      en: Yes! That's my sister, and those are her children.
      ar: نعم! هذه أختي، وهؤلاء أولادها.
      mk: Да! Ова е сестра ми, а ова се нејзините деца.
  - speaker: becker
    text: Wie süß! Haben Sie viele Geschwister?
    meaning:
      en: How sweet! Do you have many brothers and sisters?
      ar: ما ألطفهم! هل عندك إخوة كثيرون؟
      mk: Колку слатки! Имате ли многу браќа и сестри?
  - speaker: protagonist
    text: Eine Schwester und einen Bruder.
    meaning:
      en: One sister and one brother.
      ar: أخت وأخ.
      mk: Една сестра и еден брат.
  - speaker: becker
    text: Und Ihre Eltern?
    meaning:
      en: And your parents?
      ar: ووالداك؟
      mk: А вашите родители?
  - speaker: protagonist
    text: Meine Eltern sind auch da — sehen Sie? Mein Bruder hält das Handy.
    meaning:
      en: My parents are there too — see? My brother is holding the phone.
      ar: والداي هناك أيضًا — هل ترين؟ أخي يمسك الهاتف.
      mk: И моите родители се тука — гледате? Брат ми го држи телефонот.
  - speaker: becker
    text: Und das Baby?
    meaning:
      en: And the baby?
      ar: والطفل؟
      mk: А бебето?
  - speaker: protagonist
    text: Das ist sein Sohn. Ich vermisse sie alle.
    meaning:
      en: That's his son. I miss them all.
      ar: هذا ابنه. أشتاق إليهم جميعًا.
      mk: Тоа е неговиот син. Ми недостигаат сите.
  - speaker: becker
    text: Das verstehe ich. Grüßen Sie Ihre Familie!
    meaning:
      en: I understand. Say hello to your family!
      ar: أفهم ذلك. سلّم على عائلتك!
      mk: Ве разбирам. Поздравете го вашето семејство!
- type: prompt
  ask:
    en: 'She asks: is that your family?'
    ar: 'تسأل: هل هذه عائلتك؟'
