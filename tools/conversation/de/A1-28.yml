- type: narrator
  text:
    en: '''My'', ''his'', ''her'' follow the noun''s gender: «mein Bruder», «meine Schwester», «meine Eltern»; «sein Sohn» (his), «ihre Kinder» (her children). «Ihre» with a capital is the polite ''your''.'
    ar: 'الضمائر الملكية تتبع جنس الاسم: «mein Bruder»، «meine Schwester»، «meine Eltern»؛ «sein Sohn» (ابنه)، «ihre Kinder» (أولادها). و«Ihre» بحرف كبير تعني «لك» بصيغة الاحترام.'
    mk: 'Присвојните зборови го следат родот на именката: «mein Bruder», «meine Schwester», «meine Eltern»; «sein Sohn» (неговиот), «ihre Kinder» (нејзините). «Ihre» со голема буква е учтивото „ваш“.'
