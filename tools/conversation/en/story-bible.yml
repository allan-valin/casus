formality:
  summary: >-
    English has one "you"; politeness is in titles and phrasing. Americans move to first names fast — at work
    usually from day one, even with the boss if she says so; an older landlady stays Mrs. Rivera until she offers
    her first name. Polite requests use Can I…? / Could you…? / I'd like…, never the bare imperative.
  rules:
    - Mrs. Rivera and Dr. Chen by title in A1; Dr. Chen says "Call me Linda" in A1-06, the protagonist still hesitates.
    - Jamal, Megan, Tony: first names from the start.
  sources:
    - {title: "Wikipedia: English honorifics", url: "https://en.wikipedia.org/wiki/English_honorifics", licence: CC BY-SA}

culture:
  taught:
    - {topic: small talk, note: "How are you? is a greeting, not a question: answer Good, thanks — and you?"}
    - {topic: tipping, note: "15–20 % in restaurants and bars, a dollar or two per coffee is common; it is part of the wage."}
    - {topic: first names, note: "First names come fast, also at work; Mr./Mrs./Dr. + surname for older people until invited."}
    - {topic: units, note: "Fahrenheit, miles, pounds, and the date written month/day/year."}
    - {topic: false friends, note: "become ≠ bekommen (get), chef = cook, gift ≠ Gift, handy is an adjective — the phone is a cell phone."}
  narrator:
    - {lang: de, topic: small talk, note: "Amerikaner reden mit Fremden — an der Kasse, im Aufzug; kurz freundlich antworten ist höflich, nicht aufdringlich."}
    - {lang: de, topic: how are you, note: "„How are you?“ will keine Auskunft; ehrliche lange Antworten wirken seltsam."}
    - {lang: de, topic: tipping, note: "Trinkgeld 15–20 % ist Pflicht, nicht Lob; in Deutschland rundet man nur auf."}
    - {lang: de, topic: directness, note: "Deutsche Direktheit („Das ist falsch“) wirkt in den USA schroff; man sagt „I'm not sure that works“."}
    - {lang: de, topic: names, note: "Vornamen sofort, auch mit der Chefin; das deutsche Siezen hat keine Entsprechung."}
  clashes:
    - {situation: "Answering „How are you?“ with real news at passport control", unit: A1-01}
    - {situation: "Calling the boss „Dr. Chen“ after she said „Call me Linda“", unit: A1-06}
    - {situation: "Leaving no tip after dinner", unit: A1-15}
    - {situation: "Telling Jamal directly that his method is wrong", unit: A1-25}

