id: A1-03
protagonist: f
title: ["Die Wohnung"]
situation: ["Mrs. Rivera zeigt Ihnen die Wohnung im ersten Stock."]
learn: [en-there-is, en-articles]
culture: Apartment, not flat
items:
  - [there-is, "There is / There's …", "Es gibt … / Da ist … (eins)"]
  - [there-are, "There are …", "Es gibt … / Da sind … (mehrere)"]
  - [a-bedroom, "a bedroom", "ein Schlafzimmer"]
  - [a-kitchen, "a kitchen", "eine Küche"]
  - [an, "an", "ein, eine (vor Vokal)"]
  - [an-oven, "an oven", "ein Backofen"]
  - [two-windows, "two windows", "zwei Fenster"]
  - [big, "big", "groß"]
  - [small, "small", "klein"]
  - [the-bathroom, "the bathroom", "das Bad"]
  - [is-there, "Is there …?", "Gibt es …?"]
  - [apartment, "the apartment", "die Wohnung"]
dialogue:
  - [rivera, "So, this is the apartment.", "So, das ist die Wohnung."]
  - [protagonist, "Oh, it's big!", "Oh, sie ist groß!"]
  - [rivera, "There's a bedroom and a kitchen. The kitchen is small.", "Es gibt ein Schlafzimmer und eine Küche. Die Küche ist klein."]
  - [protagonist, "Is there an oven?", "Gibt es einen Backofen?"]
  - [rivera, "Yes, there is. And there are two windows in the bedroom.", "Ja. Und im Schlafzimmer sind zwei Fenster."]
  - [protagonist, "And the bathroom?", "Und das Bad?"]
  - [rivera, "The bathroom is here, on the left.", "Das Bad ist hier, links."]
  - [protagonist, "It's very nice. Thank you, Mrs. Rivera.", "Sie ist sehr schön. Danke, Mrs. Rivera."]
teach:
  - note: ["„There is“ (kurz „there's“) sagt, was es irgendwo gibt — für eins. Für mehrere: „there are“. Deutsch sagt „es gibt“ für beides."]
  - ask: ["Sagen Sie: Es gibt ein Schlafzimmer.", "There's a bedroom.", there-is, a-bedroom]
  - ask: ["Sagen Sie: Es gibt ein Schlafzimmer und eine Küche.", "There's a bedroom and a kitchen.", there-is, a-bedroom, a-kitchen]
  - ask: ["Sagen Sie: Es gibt zwei Fenster.", "There are two windows.", there-are, two-windows]
  - note: ["„a“ ist ein und eine; vor einem Vokal-Laut wird es „an“: „an oven“, „an apple“. Es zählt der Laut, nicht der Buchstabe: „an hour“, aber „a university“."]
  - build: [an-oven, ["oven", "an oven"]]
  - ask: ["Fragen Sie: Gibt es einen Backofen?", "Is there an oven?", is-there, an, an-oven]
  - ask: ["Antworten Sie kurz: Ja, gibt es.", "Yes, there is.", there-is]
  - note: ["„the“ ist der, die, das — eins für alle. Das Adjektiv bleibt auch immer gleich: „big“, „small“."]
  - ask: ["Sagen Sie: Die Küche ist klein.", "The kitchen is small.", a-kitchen, small]
  - ask: ["Sagen Sie: Die Wohnung ist groß.", "The apartment is big.", apartment, big]
  - ask: ["Fragen Sie nach dem Bad: Und das Bad?", "And the bathroom?", the-bathroom]
  - note: ["Amerikanisch „apartment“, britisch „flat“. „Bathroom“ sagt man in Amerika auch für das WC, selbst wenn keine Wanne darin steht."]
