id: A1-01
protagonist: f
title: ["Am Flughafen"]
situation: ["Sie landen am Flughafen Logan in Boston. Passkontrolle."]
learn: [en-to-be, en-pronouns]
culture: How are you? is a greeting
items:
  - [hello, "Hello.", "Hallo. / Guten Tag."]
  - [passport, "your passport", "Ihr Reisepass"]
  - [please, "please", "bitte"]
  - [here-you-are, "Here you are.", "Bitte schön. (beim Geben)"]
  - [where-from, "Where are you from?", "Woher kommen Sie?"]
  - [im-from, "I'm from Germany.", "Ich komme aus Deutschland."]
  - [i-am, "I am / I'm", "ich bin"]
  - [why-here, "Why are you here?", "Warum sind Sie hier?"]
  - [for-work, "for work", "zum Arbeiten / beruflich"]
  - [welcome, "Welcome to the United States.", "Willkommen in den Vereinigten Staaten."]
  - [thank-you, "Thank you.", "Danke."]
  - [how-are-you, "How are you?", "Wie geht's? (als Gruß)"]
  - [good-thanks, "Good, thanks.", "Gut, danke."]
dialogue:
  - [officer, "Hello. How are you?", "Hallo. Wie geht's?"]
  - [protagonist, "Good, thanks.", "Gut, danke."]
  - [officer, "Your passport, please.", "Ihren Pass, bitte."]
  - [protagonist, "Here you are.", "Bitte schön."]
  - [officer, "Where are you from?", "Woher kommen Sie?"]
  - [protagonist, "I'm from Germany. I'm from Leipzig.", "Ich komme aus Deutschland. Aus Leipzig."]
  - [officer, "Why are you here?", "Warum sind Sie hier?"]
  - [protagonist, "For work. I'm a biologist.", "Beruflich. Ich bin Biologin."]
  - [officer, "OK. Welcome to the United States.", "Gut. Willkommen in den Vereinigten Staaten."]
  - [protagonist, "Thank you.", "Danke."]
teach:
  - note: ["„How are you?“ ist in Amerika ein Gruß, keine echte Frage. Man antwortet kurz: „Good, thanks.“"]
  - ask: ["Der Beamte sagt „Hello. How are you?“ Antworten Sie kurz.", "Good, thanks.", good-thanks]
  - ask: ["Grüßen Sie zurück: „Hallo“.", "Hello.", hello]
  - ask: ["Geben Sie ihm den Pass: „Bitte schön“.", "Here you are.", here-you-are]
  - note: ["„Bitte“ hat im Englischen zwei Wörter: „please“, wenn man um etwas bittet, und „Here you are“, wenn man etwas gibt. Ein englisches „bitte“ beim Geben gibt es nicht."]
  - ask: ["Bitten Sie jemanden um seinen Pass.", "Your passport, please.", passport, please]
  - note: ["„I am“ ist „ich bin“; gesprochen fast immer kurz: „I'm“. Woher man kommt: „I'm from …“ — ohne „come“."]
  - build: [im-from, ["Germany.", "from Germany.", "I'm from Germany."]]
  - ask: ["Sagen Sie, dass Sie aus Deutschland kommen.", "I'm from Germany.", im-from, i-am]
  - ask: ["Fragen Sie den Beamten, woher er kommt.", "Where are you from?", where-from]
  - ask: ["Er fragt, warum Sie hier sind. Sagen Sie: beruflich.", "For work.", for-work]
  - ask: ["Fragen Sie: Warum sind Sie hier?", "Why are you here?", why-here]
  - ask: ["Er heißt Sie willkommen. Bedanken Sie sich.", "Thank you.", thank-you]
  - note: ["Das „th“ in „thank you“: die Zungenspitze zwischen die Zähne, dann Luft — kein „s“, kein „f“."]
  - ask: ["Noch einmal, mit dem „th“: danke.", "Thank you.", thank-you]
