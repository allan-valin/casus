id: A1-05
protagonist: f
title: ["Erster Arbeitstag"]
situation: ["Das Labor, Montagmorgen. Ein Kollege, Jamal, zeigt Ihnen Ihren Platz."]
learn: [en-present-simple, en-pronouns]
culture: First names at work
items:
  - [hi, "Hi.", "Hallo. (locker)"]
  - [im, "I'm …", "ich bin …"]
  - [what-do-you-do, "What do you do?", "Was machen Sie beruflich?"]
  - [i-work, "I work …", "ich arbeite …"]
  - [in-the-lab, "in the lab", "im Labor"]
  - [im-a-biologist, "I'm a biologist.", "Ich bin Biologin / Biologe."]
  - [he-works, "he works", "er arbeitet"]
  - [she-works, "she works", "sie arbeitet"]
  - [we, "we", "wir"]
  - [we-work, "we work together", "wir arbeiten zusammen"]
  - [your-desk, "your desk", "Ihr Schreibtisch / Arbeitsplatz"]
  - [great, "Great.", "Super."]
dialogue:
  - [jamal, "Hi, I'm Jamal. You're the new biologist, right?", "Hallo, ich bin Jamal. Du bist die neue Biologin, oder?"]
  - [protagonist, "Hi, Jamal. Yes, I'm a biologist. I'm from Leipzig.", "Hallo, Jamal. Ja, ich bin Biologin. Ich komme aus Leipzig."]
  - [jamal, "Welcome! What do you do in Leipzig?", "Willkommen! Was machst du in Leipzig?"]
  - [protagonist, "I work in a lab at the university.", "Ich arbeite in einem Labor an der Uni."]
  - [jamal, "Cool. I work in this lab. And Dr. Chen works here too.", "Cool. Ich arbeite in diesem Labor. Und Dr. Chen arbeitet auch hier."]
  - [protagonist, "So we work together!", "Dann arbeiten wir zusammen!"]
  - [jamal, "Yes. This is your desk.", "Ja. Das ist dein Platz."]
  - [protagonist, "Great. Thanks, Jamal.", "Super. Danke, Jamal."]
teach:
  - ask: ["Grüßen Sie Jamal locker: Hallo.", "Hi.", hi]
  - ask: ["Sagen Sie, dass Sie Biologin sind.", "I'm a biologist.", im-a-biologist]
  - note: ["Beim Beruf steht im Englischen „a“: „I'm a biologist“, „She's a doctor“ — im Deutschen nicht."]
  - ask: ["Fragen Sie Jamal, was er beruflich macht.", "What do you do?", what-do-you-do]
  - note: ["Die einfache Gegenwart: I work, you work, we work, they work — aber he, she, it: works, mit -s. Das -s vergisst man als Deutscher leicht."]
  - ask: ["Sagen Sie: Ich arbeite im Labor.", "I work in the lab.", i-work, in-the-lab]
  - build: [he-works, ["works", "he works"]]
  - ask: ["Sagen Sie: Er arbeitet im Labor.", "He works in the lab.", he-works, in-the-lab]
  - ask: ["Und Dr. Chen: Sie arbeitet im Labor.", "She works in the lab.", she-works, in-the-lab]
  - ask: ["Sagen Sie: Wir arbeiten zusammen.", "We work together.", we, we-work]
  - ask: ["Jamal zeigt Ihren Platz. Sagen Sie: Super. Danke.", "Great. Thanks.", great, thanks]
  - note: ["Im amerikanischen Büro sagt man vom ersten Tag an Vornamen — auch Jamal duzt Sie praktisch. Die Chefin bleibt „Dr. Chen“, bis sie es anders sagt."]
