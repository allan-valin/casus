id: A1-02
protagonist: m
title: ["Die Vermieterin"]
situation: ["Sie stehen vor Ihrem neuen Haus in Somerville. Die Vermieterin, Mrs. Rivera, öffnet die Tür."]
learn: [en-possessives, en-to-be]
culture: Titles for older people
items:
  - [are-you, "Are you …?", "Sind Sie …?"]
  - [yes-i-am, "Yes, I am.", "Ja (, bin ich)."]
  - [nice-to-meet-you, "Nice to meet you.", "Freut mich."]
  - [my-name-is, "My name is …", "Ich heiße …"]
  - [this-is, "This is …", "Das ist …"]
  - [your-key, "your key", "Ihr Schlüssel"]
  - [my, "my", "mein, meine"]
  - [your, "your", "dein, Ihr"]
  - [mrs-rivera, "Mrs. Rivera", "Frau Rivera"]
  - [come-in, "Come in.", "Kommen Sie herein."]
  - [thanks, "Thanks.", "Danke. (locker)"]
dialogue:
  - [rivera, "Hello! Are you the new tenant?", "Hallo! Sind Sie der neue Mieter?"]
  - [protagonist, "Yes, I am. My name is Jonas.", "Ja. Ich heiße Jonas."]
  - [rivera, "Nice to meet you, Jonas. I'm Mrs. Rivera.", "Freut mich, Jonas. Ich bin Mrs. Rivera."]
  - [protagonist, "Nice to meet you, Mrs. Rivera.", "Freut mich, Mrs. Rivera."]
  - [rivera, "Come in, come in. This is your key.", "Kommen Sie, kommen Sie herein. Das ist Ihr Schlüssel."]
  - [protagonist, "Thanks. And this is my bag.", "Danke. Und das ist meine Tasche."]
  - [rivera, "Is it heavy?", "Ist sie schwer?"]
  - [protagonist, "No, it's OK. Thank you.", "Nein, es geht. Danke."]
teach:
  - note: ["„Are you …?“ fragt nach „be“: Das Verb kommt nach vorn. „You are the tenant“ → „Are you the tenant?“ Kurz antwortet man mit dem Verb: „Yes, I am.“"]
  - ask: ["Mrs. Rivera fragt, ob Sie der neue Mieter sind. Sagen Sie kurz ja.", "Yes, I am.", yes-i-am]
  - ask: ["Fragen Sie sie: Sind Sie Mrs. Rivera?", "Are you Mrs. Rivera?", are-you, mrs-rivera]
  - ask: ["Sagen Sie Ihren Namen: Ich heiße Jonas.", "My name is Jonas.", my-name-is]
  - ask: ["Sagen Sie: Freut mich, Mrs. Rivera.", "Nice to meet you, Mrs. Rivera.", nice-to-meet-you, mrs-rivera]
  - note: ["„my“ ist mein und meine; „your“ ist dein, deine, Ihr, Ihre — Englisch unterscheidet weder das Geschlecht des Dings noch du und Sie."]
  - build: [your-key, ["key", "your key"]]
  - ask: ["Sie zeigt den Schlüssel. Sagen Sie: Das ist Ihr Schlüssel — zu einem Freund.", "This is your key.", this-is, your-key]
  - ask: ["Zeigen Sie Ihre Tasche: Das ist meine Tasche.", "This is my bag.", this-is, my]
  - ask: ["Bitten Sie jemanden herein.", "Come in.", come-in]
  - ask: ["Bedanken Sie sich locker.", "Thanks.", thanks]
  - note: ["„Mrs.“ spricht man „Missis“. Eine ältere Vermieterin nennt man so, bis sie ihren Vornamen anbietet."]
