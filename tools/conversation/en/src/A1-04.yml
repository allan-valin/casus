id: A1-04
protagonist: m
title: ["Der Coffeeshop"]
situation: ["Tonys Café an der Ecke, am ersten Morgen."]
learn: [en-can, en-articles]
culture: Tipping at the counter
items:
  - [good-morning, "Good morning.", "Guten Morgen."]
  - [what-can-i-get, "What can I get you?", "Was darf's sein?"]
  - [can-i-have, "Can I have …?", "Kann ich … haben? / Ich hätte gern …"]
  - [a-coffee, "a coffee", "einen Kaffee"]
  - [small-medium-large, "small, medium or large", "klein, mittel oder groß"]
  - [medium, "a medium", "einen mittleren"]
  - [for-here, "for here", "zum Hiertrinken"]
  - [to-go, "to go", "zum Mitnehmen"]
  - [how-much, "How much is it?", "Was kostet das?"]
  - [three-fifty, "three fifty", "drei fünfzig"]
  - [keep-the-change, "Keep the change.", "Stimmt so."]
  - [have-a-nice-day, "Have a nice day!", "Schönen Tag noch!"]
  - [you-too, "You too.", "Ihnen auch."]
dialogue:
  - [tony, "Good morning! What can I get you?", "Guten Morgen! Was darf's sein?"]
  - [protagonist, "Good morning. Can I have a coffee, please?", "Guten Morgen. Ich hätte gern einen Kaffee, bitte."]
  - [tony, "Sure. Small, medium or large?", "Klar. Klein, mittel oder groß?"]
  - [protagonist, "A medium, please.", "Einen mittleren, bitte."]
  - [tony, "For here or to go?", "Zum Hiertrinken oder zum Mitnehmen?"]
  - [protagonist, "To go. How much is it?", "Zum Mitnehmen. Was kostet das?"]
  - [tony, "Three fifty.", "Drei fünfzig."]
  - [protagonist, "Here you are. Keep the change.", "Bitte. Stimmt so."]
  - [tony, "Thanks! Have a nice day!", "Danke! Schönen Tag noch!"]
  - [protagonist, "You too.", "Ihnen auch."]
teach:
  - ask: ["Grüßen Sie Tony am Morgen.", "Good morning.", good-morning]
  - note: ["Höflich bestellen: „Can I have …, please?“ — wörtlich „Kann ich … haben?“. Das deutsche „Ich bekomme einen Kaffee“ klingt auf Englisch („I become a coffee“) falsch: „become“ heißt „werden“."]
  - ask: ["Bestellen Sie einen Kaffee — mit „please“.", "Can I have a coffee, please?", can-i-have, a-coffee, please]
  - ask: ["Er fragt nach der Größe. Sagen Sie: einen mittleren, bitte.", "A medium, please.", medium, please]
  - ask: ["Fragen Sie selbst nach den Größen: klein, mittel oder groß?", "Small, medium or large?", small-medium-large]
  - ask: ["Sagen Sie: zum Mitnehmen.", "To go.", to-go]
  - ask: ["Fragen Sie: hier trinken oder mitnehmen?", "For here or to go?", for-here, to-go]
  - ask: ["Fragen Sie, was es kostet.", "How much is it?", how-much]
  - note: ["Preise sagt man ohne „Dollar“ und „Cent“: 3,50 $ ist „three fifty“."]
  - ask: ["Sagen Sie den Preis: drei fünfzig.", "Three fifty.", three-fifty]
  - ask: ["Zahlen Sie und sagen Sie „Stimmt so“.", "Keep the change.", keep-the-change]
  - ask: ["Er wünscht einen schönen Tag. Antworten Sie: Ihnen auch.", "You too.", you-too]
  - ask: ["Wünschen Sie ihm einen schönen Tag.", "Have a nice day!", have-a-nice-day]
