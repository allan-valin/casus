steps:
- type: narrator
  text:
    de: Das Labor, Montagmorgen. Ein Kollege, Jamal, zeigt Ihnen Ihren Platz. Hören Sie sich das Gespräch an; Sie müssen es noch nicht verstehen.
- type: dialogue
  lines:
  - speaker: jamal
    text: Hi, I'm Jamal. You're the new biologist, right?
    meaning:
      de: Hallo, ich bin Jamal. Du bist die neue Biologin, oder?
  - speaker: protagonist
    text: Hi, Jamal. Yes, I'm a biologist. I'm from Leipzig.
    meaning:
      de: Hallo, Jamal. Ja, ich bin Biologin. Ich komme aus Leipzig.
  - speaker: jamal
    text: Welcome! What do you do in Leipzig?
    meaning:
      de: Willkommen! Was machst du in Leipzig?
  - speaker: protagonist
    text: I work in a lab at the university.
    meaning:
      de: Ich arbeite in einem Labor an der Uni.
  - speaker: jamal
    text: Cool. I work in this lab. And Dr. Chen works here too.
    meaning:
      de: Cool. Ich arbeite in diesem Labor. Und Dr. Chen arbeitet auch hier.
  - speaker: protagonist
    text: So we work together!
    meaning:
      de: Dann arbeiten wir zusammen!
  - speaker: jamal
    text: Yes. This is your desk.
    meaning:
      de: Ja. Das ist dein Platz.
  - speaker: protagonist
    text: Great. Thanks, Jamal.
    meaning:
      de: Super. Danke, Jamal.
