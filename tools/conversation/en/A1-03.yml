steps:
- type: narrator
  text:
    de: Mrs. Rivera zeigt Ihnen die Wohnung im ersten Stock. Hören Sie sich das Gespräch an; Sie müssen es noch nicht verstehen.
- type: dialogue
  lines:
  - speaker: rivera
    text: So, this is the apartment.
    meaning:
      de: So, das ist die Wohnung.
  - speaker: protagonist
    text: Oh, it's big!
    meaning:
      de: Oh, sie ist groß!
  - speaker: rivera
    text: There's a bedroom and a kitchen. The kitchen is small.
    meaning:
      de: Es gibt ein Schlafzimmer und eine Küche. Die Küche ist klein.
  - speaker: protagonist
    text: Is there an oven?
    meaning:
      de: Gibt es einen Backofen?
  - speaker: rivera
    text: Yes, there is. And there are two windows in the bedroom.
    meaning:
      de: Ja. Und im Schlafzimmer sind zwei Fenster.
  - speaker: protagonist
    text: And the bathroom?
    meaning:
      de: Und das Bad?
  - speaker: rivera
    text: The bathroom is here, on the left.
    meaning:
      de: Das Bad ist hier, links.
  - speaker: protagonist
    text: It's very nice. Thank you, Mrs. Rivera.
    meaning:
      de: Sie ist sehr schön. Danke, Mrs. Rivera.
- type: narrator
  text:
    de: '„There is“ (kurz „there''s“) sagt, was es irgendwo gibt — für eins. Für mehrere: „there are“. Deutsch sagt „es gibt“ für beides.'
