steps:
- type: narrator
  text:
    de: Dr. Chen, die Leiterin des Labors, kommt an Ihren Platz. Hören Sie sich das Gespräch an; Sie müssen es noch nicht verstehen.
- type: dialogue
  lines:
  - speaker: chen
    text: Good morning. You're Jonas, right? I'm Dr. Chen.
    meaning:
      de: Guten Morgen. Sie sind Jonas, oder? Ich bin Dr. Chen.
  - speaker: protagonist
    text: Good morning, Dr. Chen. Nice to meet you.
    meaning:
      de: Guten Morgen, Dr. Chen. Freut mich.
  - speaker: chen
    text: Please, call me Linda. Do you speak Chinese?
    meaning:
      de: Bitte, nennen Sie mich Linda. Sprechen Sie Chinesisch?
  - speaker: protagonist
    text: No, I don't. I speak German and English. A little Spanish.
    meaning:
      de: Nein. Ich spreche Deutsch und Englisch. Ein bisschen Spanisch.
  - speaker: chen
    text: Great. Do you like Boston?
    meaning:
      de: Super. Gefällt Ihnen Boston?
  - speaker: protagonist
    text: I like it very much. But I don't know the city yet.
    meaning:
      de: Sehr. Aber ich kenne die Stadt noch nicht.
  - speaker: chen
    text: You'll learn. Welcome to the team.
    meaning:
      de: Das kommt noch. Willkommen im Team.
  - speaker: protagonist
    text: Thank you, Dr. … Linda.
    meaning:
      de: Danke, Dr. … Linda.
- type: narrator
  text:
    de: 'Fragen mit „do“: „Do you speak English?“ Das Verb bleibt hinten; „do“ macht die Frage. Kurze Antwort: „Yes, I do.“ / „No, I don''t.“'
