id: A1-10
protagonist: m
title: ["Die U-Bahn"]
situation: ["Die Station Davis, die Rote Linie. Sie wollen zur Park Street."]
learn: [en-prepositions, en-present-simple]
culture: The T
items:
  - [which-line, "Which line …?", "Welche Linie …?"]
  - [the-red-line, "the Red Line", "die Rote Linie"]
  - [to-park-street, "to Park Street", "zur Park Street"]
  - [a-ticket, "a ticket", "eine Fahrkarte"]
  - [get-off, "get off at …", "aussteigen an …"]
  - [how-many-stops, "How many stops?", "Wie viele Haltestellen?"]
  - [on-the-train, "on the train", "im Zug"]
  - [this-train-goes, "Does this train go to …?", "Fährt dieser Zug nach …?"]
  - [yes-it-does, "Yes, it does.", "Ja (, tut er)."]
  - [youre-welcome, "You're welcome.", "Gern geschehen."]
dialogue:
  - [protagonist, "Excuse me. Which line goes to Park Street?", "Entschuldigung. Welche Linie fährt zur Park Street?"]
  - [jamal, "Jonas! Hey! The Red Line. I go there too.", "Jonas! Hey! Die Rote Linie. Da fahre ich auch hin."]
  - [protagonist, "Great! Do I need a ticket?", "Super! Brauche ich eine Fahrkarte?"]
  - [jamal, "You need a CharlieCard. Over there.", "Du brauchst eine CharlieCard. Da drüben."]
  - [protagonist, "Does this train go to Park Street?", "Fährt dieser Zug zur Park Street?"]
  - [jamal, "Yes, it does. Come on!", "Ja. Komm!"]
  - [protagonist, "How many stops?", "Wie viele Haltestellen?"]
  - [jamal, "Six. We get off at Park Street.", "Sechs. Wir steigen an der Park Street aus."]
  - [protagonist, "Thanks, Jamal.", "Danke, Jamal."]
  - [jamal, "You're welcome.", "Gern geschehen."]
teach:
  - ask: ["Fragen Sie: Welche Linie fährt zur Park Street?", "Which line goes to Park Street?", which-line, to-park-street]
  - note: ["„goes“ — wieder das -s bei he, she, it: die Linie, der Zug = it."]
  - ask: ["Antworten Sie: die Rote Linie.", "The Red Line.", the-red-line]
  - ask: ["Fragen Sie: Fährt dieser Zug zur Park Street?", "Does this train go to Park Street?", this-train-goes]
  - note: ["In der Frage trägt „does“ das -s: „Does this train go …?“ — nicht „goes“."]
  - ask: ["Antworten Sie kurz: ja.", "Yes, it does.", yes-it-does]
  - ask: ["Fragen Sie nach der Zahl der Haltestellen.", "How many stops?", how-many-stops]
  - ask: ["Sagen Sie: Wir steigen an der Park Street aus.", "We get off at Park Street.", we, get-off]
  - ask: ["Fragen Sie: Brauche ich eine Fahrkarte?", "Do I need a ticket?", i-need, a-ticket]
  - ask: ["Er bedankt sich. Antworten Sie: Gern geschehen.", "You're welcome.", youre-welcome]
  - note: ["„on the train“, „on the bus“ — in Verkehrsmitteln steht „on“, nicht „in“."]
  - ask: ["Sagen Sie: Ich bin im Zug.", "I'm on the train.", on-the-train]
