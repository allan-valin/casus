id: A1-06
protagonist: m
title: ["Die Chefin"]
situation: ["Dr. Chen, die Leiterin des Labors, kommt an Ihren Platz."]
learn: [en-present-simple, en-to-be]
culture: First names with the boss
items:
  - [do-you-speak, "Do you speak …?", "Sprechen Sie …?"]
  - [a-little, "a little", "ein bisschen"]
  - [i-speak, "I speak German and English.", "Ich spreche Deutsch und Englisch."]
  - [call-me, "Call me Linda.", "Nennen Sie mich Linda."]
  - [ok-linda, "OK, Linda.", "Okay, Linda."]
  - [do-you-like, "Do you like …?", "Mögen Sie …? / Gefällt Ihnen …?"]
  - [i-like-it, "I like it.", "Es gefällt mir."]
  - [i-dont-know, "I don't know.", "Ich weiß nicht."]
  - [no-i-dont, "No, I don't.", "Nein. (kurze Antwort auf eine do-Frage)"]
  - [yet, "yet", "noch (in Fragen und Verneinungen)"]
  - [very-much, "very much", "sehr"]
dialogue:
  - [chen, "Good morning. You're Jonas, right? I'm Dr. Chen.", "Guten Morgen. Sie sind Jonas, oder? Ich bin Dr. Chen."]
  - [protagonist, "Good morning, Dr. Chen. Nice to meet you.", "Guten Morgen, Dr. Chen. Freut mich."]
  - [chen, "Please, call me Linda. Do you speak Chinese?", "Bitte, nennen Sie mich Linda. Sprechen Sie Chinesisch?"]
  - [protagonist, "No, I don't. I speak German and English. A little Spanish.", "Nein. Ich spreche Deutsch und Englisch. Ein bisschen Spanisch."]
  - [chen, "Great. Do you like Boston?", "Super. Gefällt Ihnen Boston?"]
  - [protagonist, "I like it very much. But I don't know the city yet.", "Sehr. Aber ich kenne die Stadt noch nicht."]
  - [chen, "You'll learn. Welcome to the team.", "Das kommt noch. Willkommen im Team."]
  - [protagonist, "Thank you, Dr. … Linda.", "Danke, Dr. … Linda."]
teach:
  - note: ["Fragen mit „do“: „Do you speak English?“ Das Verb bleibt hinten; „do“ macht die Frage. Kurze Antwort: „Yes, I do.“ / „No, I don't.“"]
  - ask: ["Fragen Sie: Sprechen Sie Deutsch?", "Do you speak German?", do-you-speak]
  - ask: ["Antworten Sie kurz mit nein.", "No, I don't.", no-i-dont]
  - ask: ["Sagen Sie, welche Sprachen Sie sprechen: Deutsch und Englisch.", "I speak German and English.", i-speak]
  - ask: ["Und Spanisch: ein bisschen.", "A little Spanish.", a-little]
  - ask: ["Fragen Sie: Gefällt Ihnen Boston?", "Do you like Boston?", do-you-like]
  - ask: ["Antworten Sie: Es gefällt mir sehr.", "I like it very much.", i-like-it, very-much]
  - note: ["Verneinung ebenso mit „do“: „I don't know“ — nie „I know not“. „Yet“ am Satzende heißt hier „noch nicht“."]
  - ask: ["Sagen Sie: Ich weiß nicht.", "I don't know.", i-dont-know]
  - ask: ["Sagen Sie: Ich kenne die Stadt noch nicht.", "I don't know the city yet.", i-dont-know, yet]
  - note: ["„Call me Linda“: Sie bietet den Vornamen an. Danach weiter „Dr. Chen“ zu sagen, wirkt in den USA steif, nicht höflich."]
  - ask: ["Sie sagt „Call me Linda“. Antworten Sie: Okay, Linda.", "OK, Linda.", ok-linda]
  - ask: ["Bieten Sie selbst den Vornamen an: Nennen Sie mich Jonas.", "Call me Jonas.", call-me]
