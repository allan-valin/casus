id: A1-09
protagonist: f
title: ["Im Supermarkt"]
situation: ["Ihr erster Einkauf im großen Supermarkt."]
learn: [en-articles, en-there-is]
culture: Paper or plastic
items:
  - [excuse-me, "Excuse me.", "Entschuldigung. (um anzusprechen)"]
  - [where-is, "Where is …?", "Wo ist …?"]
  - [where-are, "Where are …?", "Wo sind …?"]
  - [the-milk, "the milk", "die Milch"]
  - [some-bread, "some bread", "etwas Brot / Brot"]
  - [eggs, "eggs", "Eier"]
  - [aisle-five, "in aisle five", "in Gang fünf"]
  - [over-there, "over there", "da drüben"]
  - [i-need, "I need …", "ich brauche …"]
  - [bag, "Do you need a bag?", "Brauchen Sie eine Tüte?"]
dialogue:
  - [protagonist, "Excuse me. Where is the milk?", "Entschuldigung. Wo ist die Milch?"]
  - [clerk, "The milk is in aisle five.", "Die Milch ist in Gang fünf."]
  - [protagonist, "Thanks. And where are the eggs?", "Danke. Und wo sind die Eier?"]
  - [clerk, "The eggs are over there, next to the milk.", "Die Eier sind da drüben, neben der Milch."]
  - [protagonist, "I need some bread too.", "Ich brauche auch Brot."]
  - [clerk, "There's bread in aisle two.", "Brot gibt es in Gang zwei."]
  - [clerk, "Do you need a bag?", "Brauchen Sie eine Tüte?"]
  - [protagonist, "No, thanks. I have a bag.", "Nein, danke. Ich habe eine Tasche."]
teach:
  - ask: ["Sprechen Sie einen Mitarbeiter an.", "Excuse me.", excuse-me]
  - ask: ["Fragen Sie: Wo ist die Milch?", "Where is the milk?", where-is, the-milk]
  - note: ["Eins: „Where is …?“, mehrere: „Where are …?“ — „eggs“ ist Plural."]
  - ask: ["Fragen Sie: Wo sind die Eier?", "Where are the eggs?", where-are, eggs]
  - ask: ["Antworten Sie für ihn: in Gang fünf.", "In aisle five.", aisle-five]
  - ask: ["Er zeigt: da drüben. Sagen Sie es nach.", "Over there.", over-there]
  - note: ["„Some“ für eine unbestimmte Menge: „some bread“, „some milk“ — Brot und Milch zählt man nicht, also kein „a“."]
  - ask: ["Sagen Sie: Ich brauche Brot.", "I need some bread.", i-need, some-bread]
  - ask: ["An der Kasse: Brauchen Sie eine Tüte? Fragen Sie selbst.", "Do you need a bag?", bag]
  - ask: ["Antworten Sie: Nein, danke.", "No, thanks.", thanks]
  - note: ["„Excuse me“ spricht jemanden an oder bittet um Platz; „Sorry“ entschuldigt einen Fehler."]
