id: A1-08
protagonist: m
title: ["Zahlen"]
situation: ["Im Handyladen. Sie brauchen eine amerikanische Nummer."]
learn: [en-to-be]
culture: Phone numbers digit by digit
items:
  - [phone-number, "a phone number", "eine Telefonnummer"]
  - [whats-your, "What's your …?", "Was ist Ihr / Ihre …?"]
  - [zip-code, "zip code", "Postleitzahl"]
  - [how-old, "How old are you?", "Wie alt sind Sie?"]
  - [im-thirty, "I'm thirty.", "Ich bin dreißig."]
  - [oh, "oh (0)", "null (in Nummern)"]
  - [twenty, "twenty", "zwanzig"]
  - [thirty, "thirty", "dreißig"]
  - [forty-dollars, "forty dollars a month", "vierzig Dollar im Monat"]
  - [can-you-repeat, "Can you repeat that?", "Können Sie das wiederholen?"]
dialogue:
  - [clerk, "OK, what's your name?", "Okay, wie heißen Sie?"]
  - [protagonist, "Jonas Weber. W-E-B-E-R.", "Jonas Weber. W-E-B-E-R."]
  - [clerk, "And your zip code?", "Und Ihre Postleitzahl?"]
  - [protagonist, "Oh-two-one-four-four.", "Null-zwei-eins-vier-vier."]
  - [clerk, "Great. How old are you? For the contract.", "Gut. Wie alt sind Sie? Für den Vertrag."]
  - [protagonist, "I'm thirty.", "Ich bin dreißig."]
  - [clerk, "Your new number is six-one-seven, five-five-five, oh-one-two-oh.", "Ihre neue Nummer ist 617 555 0120."]
  - [protagonist, "Sorry, can you repeat that?", "Entschuldigung, können Sie das wiederholen?"]
  - [clerk, "Six-one-seven, five-five-five, oh-one-two-oh. It's forty dollars a month.", "617 555 0120. Es kostet vierzig Dollar im Monat."]
  - [protagonist, "OK. Thank you.", "Okay. Danke."]
teach:
  - note: ["Nummern sagt man Ziffer für Ziffer, die Null meist „oh“: 0120 ist „oh-one-two-oh“."]
  - ask: ["Sagen Sie die Postleitzahl 02144.", "Oh-two-one-four-four.", oh]
  - ask: ["Fragen Sie nach der Postleitzahl.", "What's your zip code?", whats-your, zip-code]
  - ask: ["Fragen Sie nach der Telefonnummer.", "What's your phone number?", whats-your, phone-number]
  - note: ["Alter mit „be“, nicht mit „have“: „I'm thirty“ — nie „I have thirty years“."]
  - ask: ["Fragen Sie: Wie alt sind Sie?", "How old are you?", how-old]
  - ask: ["Antworten Sie: Ich bin dreißig.", "I'm thirty.", im-thirty]
  - note: ["Zehner enden auf „-ty“: twenty, thirty, forty — „forty“ ohne u. „Thirteen“ und „thirty“ unterscheidet die Betonung: thir-TEEN, THIR-ty."]
  - ask: ["Zählen Sie: zwanzig, dreißig.", "Twenty, thirty.", twenty, thirty]
  - ask: ["Sagen Sie: vierzig Dollar im Monat.", "Forty dollars a month.", forty-dollars]
  - ask: ["Sie haben die Nummer nicht verstanden. Bitten Sie um Wiederholung.", "Can you repeat that?", can-you-repeat]
