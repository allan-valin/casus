id: A1-07
protagonist: f
title: ["Die Nachbarin"]
situation: ["Im Treppenhaus. Eine junge Frau mit Einkaufstüten: Megan, Ihre Nachbarin."]
learn: [en-to-be, en-prepositions]
culture: Talking to neighbours
items:
  - [are-you-new, "Are you new here?", "Sind Sie neu hier?"]
  - [i-live, "I live …", "ich wohne …"]
  - [on-the-floor, "on the second floor", "im ersten Stock"]
  - [im-lena, "I'm Lena.", "Ich bin Lena."]
  - [she-is, "she's / she is", "sie ist"]
  - [im-a-nurse, "I'm a nurse.", "Ich bin Krankenschwester / Pflegerin."]
  - [at-the-hospital, "at the hospital", "im Krankenhaus"]
  - [can-i-help, "Can I help you?", "Kann ich Ihnen helfen?"]
  - [thats-nice, "That's very nice.", "Das ist sehr nett."]
  - [see-you, "See you!", "Bis dann!"]
dialogue:
  - [megan, "Hi! Are you new here?", "Hallo! Bist du neu hier?"]
  - [protagonist, "Yes, I am. I'm Lena. I live on the second floor.", "Ja. Ich bin Lena. Ich wohne im ersten Stock."]
  - [megan, "I'm Megan. I live on the third floor.", "Ich bin Megan. Ich wohne im zweiten Stock."]
  - [protagonist, "Nice to meet you, Megan. Can I help you?", "Freut mich, Megan. Kann ich dir helfen?"]
  - [megan, "Oh, thanks! That's very nice.", "Oh, danke! Das ist sehr nett."]
  - [protagonist, "What do you do?", "Was machst du beruflich?"]
  - [megan, "I'm a nurse. I work at the hospital.", "Ich bin Pflegerin. Ich arbeite im Krankenhaus."]
  - [protagonist, "Cool. See you, Megan!", "Cool. Bis dann, Megan!"]
teach:
  - ask: ["Fragen Sie: Sind Sie neu hier?", "Are you new here?", are-you-new]
  - ask: ["Antworten Sie: Ja. Ich bin Lena.", "Yes, I am. I'm Lena.", yes-i-am, im-lena]
  - note: ["Achtung, Stockwerke: In Amerika ist das Erdgeschoss der „first floor“. Der deutsche erste Stock ist der „second floor“."]
  - build: [on-the-floor, ["floor", "second floor", "on the second floor"]]
  - ask: ["Sagen Sie, dass Sie im ersten Stock wohnen — auf Amerikanisch.", "I live on the second floor.", i-live, on-the-floor]
  - ask: ["Bieten Sie Hilfe an.", "Can I help you?", can-i-help]
  - ask: ["Jemand hilft Ihnen mit den Tüten. Sagen Sie: Das ist sehr nett.", "That's very nice.", thats-nice]
  - ask: ["Fragen Sie, was sie beruflich macht.", "What do you do?", what-do-you-do]
  - note: ["„at the hospital“, „at work“, „at home“ — „at“ für Orte, an denen man etwas tut."]
  - ask: ["Sagen Sie für Megan: Ich bin Pflegerin. Ich arbeite im Krankenhaus.", "I'm a nurse. I work at the hospital.", im-a-nurse, i-work, at-the-hospital]
  - ask: ["Erzählen Sie von ihr: Sie ist Pflegerin.", "She's a nurse.", she-is, im-a-nurse]
  - ask: ["Verabschieden Sie sich locker.", "See you!", see-you]
