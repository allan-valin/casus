  - speaker: protagonist
    text: Excuse me. Where is the milk?
    meaning:
      de: Entschuldigung. Wo ist die Milch?
  - speaker: clerk
    text: The milk is in aisle five.
    meaning:
      de: Die Milch ist in Gang fünf.
  - speaker: protagonist
    text: Thanks. And where are the eggs?
    meaning:
      de: Danke. Und wo sind die Eier?
  - speaker: clerk
    text: The eggs are over there, next to the milk.
    meaning:
      de: Die Eier sind da drüben, neben der Milch.
  - speaker: protagonist
    text: I need some bread too.
    meaning:
      de: Ich brauche auch Brot.
  - speaker: clerk
    text: There's bread in aisle two.
    meaning:
      de: Brot gibt es in Gang zwei.
  - speaker: clerk
    text: Do you need a bag?
    meaning:
      de: Brauchen Sie eine Tüte?
  - speaker: protagonist
    text: No, thanks. I have a bag.
    meaning:
      de: Nein, danke. Ich habe eine Tasche.
