steps:
- type: narrator
  text:
    de: Im Handyladen. Sie brauchen eine amerikanische Nummer. Hören Sie sich das Gespräch an; Sie müssen es noch nicht verstehen.
- type: dialogue
  lines:
  - speaker: clerk
    text: OK, what's your name?
    meaning:
      de: Okay, wie heißen Sie?
  - speaker: protagonist
    text: Jonas Weber. W-E-B-E-R.
    meaning:
      de: Jonas Weber. W-E-B-E-R.
  - speaker: clerk
    text: And your zip code?
    meaning:
      de: Und Ihre Postleitzahl?
  - speaker: protagonist
    text: Oh-two-one-four-four.
    meaning:
      de: Null-zwei-eins-vier-vier.
  - speaker: clerk
    text: Great. How old are you? For the contract.
    meaning:
      de: Gut. Wie alt sind Sie? Für den Vertrag.
  - speaker: protagonist
    text: I'm thirty.
    meaning:
      de: Ich bin dreißig.
  - speaker: clerk
    text: Your new number is six-one-seven, five-five-five, oh-one-two-oh.
    meaning:
      de: Ihre neue Nummer ist 617 555 0120.
  - speaker: protagonist
    text: Sorry, can you repeat that?
    meaning:
      de: Entschuldigung, können Sie das wiederholen?
  - speaker: clerk
    text: Six-one-seven, five-five-five, oh-one-two-oh. It's forty dollars a month.
    meaning:
      de: 617 555 0120. Es kostet vierzig Dollar im Monat.
  - speaker: protagonist
    text: OK. Thank you.
    meaning:
      de: Okay. Danke.
- type: narrator
  text:
    de: 'Nummern sagt man Ziffer für Ziffer, die Null meist „oh“: 0120 ist „oh-one-two-oh“.'
