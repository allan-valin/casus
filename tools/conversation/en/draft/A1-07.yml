- type: narrator
  text:
    de: 'Im Treppenhaus. Eine junge Frau mit Einkaufstüten: Megan, Ihre Nachbarin. Hören Sie sich das Gespräch an; Sie müssen es noch nicht verstehen.'
- type: dialogue
  lines:
  - speaker: megan
    text: Hi! Are you new here?
    meaning:
      de: Hallo! Bist du neu hier?
  - speaker: protagonist
    text: Yes, I am. I'm Lena. I live on the second floor.
    meaning:
      de: Ja. Ich bin Lena. Ich wohne im ersten Stock.
  - speaker: megan
    text: I'm Megan. I live on the third floor.
    meaning:
      de: Ich bin Megan. Ich wohne im zweiten Stock.
  - speaker: protagonist
    text: Nice to meet you, Megan. Can I help you?
    meaning:
      de: Freut mich, Megan. Kann ich dir helfen?
  - speaker: megan
    text: Oh, thanks! That's very nice.
    meaning:
      de: Oh, danke! Das ist sehr nett.
  - speaker: protagonist
    text: What do you do?
    meaning:
      de: Was machst du beruflich?
  - speaker: megan
    text: I'm a nurse. I work at the hospital.
    meaning:
      de: Ich bin Pflegerin. Ich arbeite im Krankenhaus.
  - speaker: protagonist
    text: Cool. See you, Megan!
    meaning:
      de: Cool. Bis dann, Megan!
