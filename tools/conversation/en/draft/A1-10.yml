steps:
- type: narrator
  text:
    de: Die Station Davis, die Rote Linie. Sie wollen zur Park Street. Hören Sie sich das Gespräch an; Sie müssen es noch nicht verstehen.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Excuse me. Which line goes to Park Street?
    meaning:
      de: Entschuldigung. Welche Linie fährt zur Park Street?
  - speaker: jamal
    text: Jonas! Hey! The Red Line. I go there too.
    meaning:
      de: Jonas! Hey! Die Rote Linie. Da fahre ich auch hin.
  - speaker: protagonist
    text: Great! Do I need a ticket?
    meaning:
      de: Super! Brauche ich eine Fahrkarte?
  - speaker: jamal
    text: You need a CharlieCard. Over there.
    meaning:
      de: Du brauchst eine CharlieCard. Da drüben.
  - speaker: protagonist
    text: Does this train go to Park Street?
    meaning:
      de: Fährt dieser Zug zur Park Street?
  - speaker: jamal
    text: Yes, it does. Come on!
    meaning:
      de: Ja. Komm!
  - speaker: protagonist
    text: How many stops?
    meaning:
      de: Wie viele Haltestellen?
  - speaker: jamal
    text: Six. We get off at Park Street.
    meaning:
      de: Sechs. Wir steigen an der Park Street aus.
  - speaker: protagonist
    text: Thanks, Jamal.
    meaning:
      de: Danke, Jamal.
  - speaker: jamal
    text: You're welcome.
    meaning:
      de: Gern geschehen.
- type: prompt
