steps:
- type: narrator
  text:
    de: Tonys Café an der Ecke, am ersten Morgen. Hören Sie sich das Gespräch an; Sie müssen es noch nicht verstehen.
- type: dialogue
  lines:
  - speaker: tony
    text: Good morning! What can I get you?
    meaning:
      de: Guten Morgen! Was darf's sein?
  - speaker: protagonist
    text: Good morning. Can I have a coffee, please?
    meaning:
      de: Guten Morgen. Ich hätte gern einen Kaffee, bitte.
  - speaker: tony
    text: Sure. Small, medium or large?
    meaning:
      de: Klar. Klein, mittel oder groß?
  - speaker: protagonist
    text: A medium, please.
    meaning:
      de: Einen mittleren, bitte.
  - speaker: tony
    text: For here or to go?
    meaning:
      de: Zum Hiertrinken oder zum Mitnehmen?
  - speaker: protagonist
    text: To go. How much is it?
    meaning:
      de: Zum Mitnehmen. Was kostet das?
  - speaker: tony
    text: Three fifty.
    meaning:
      de: Drei fünfzig.
  - speaker: protagonist
    text: Here you are. Keep the change.
    meaning:
      de: Bitte. Stimmt so.
  - speaker: tony
    text: Thanks! Have a nice day!
    meaning:
      de: Danke! Schönen Tag noch!
  - speaker: protagonist
    text: You too.
    meaning:
      de: Ihnen auch.
