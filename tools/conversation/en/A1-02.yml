steps:
- type: narrator
  text:
    de: Sie stehen vor Ihrem neuen Haus in Somerville. Die Vermieterin, Mrs. Rivera, öffnet die Tür. Hören Sie sich das Gespräch an; Sie müssen es noch nicht verstehen.
- type: dialogue
  lines:
  - speaker: rivera
    text: Hello! Are you the new tenant?
    meaning:
      de: Hallo! Sind Sie der neue Mieter?
  - speaker: protagonist
    text: Yes, I am. My name is Jonas.
    meaning:
      de: Ja. Ich heiße Jonas.
  - speaker: rivera
    text: Nice to meet you, Jonas. I'm Mrs. Rivera.
    meaning:
      de: Freut mich, Jonas. Ich bin Mrs. Rivera.
  - speaker: protagonist
    text: Nice to meet you, Mrs. Rivera.
    meaning:
      de: Freut mich, Mrs. Rivera.
  - speaker: rivera
    text: Come in, come in. This is your key.
    meaning:
      de: Kommen Sie, kommen Sie herein. Das ist Ihr Schlüssel.
  - speaker: protagonist
    text: Thanks. And this is my bag.
    meaning:
      de: Danke. Und das ist meine Tasche.
  - speaker: rivera
    text: Is it heavy?
    meaning:
      de: Ist sie schwer?
  - speaker: protagonist
    text: No, it's OK. Thank you.
    meaning:
      de: Nein, es geht. Danke.
- type: narrator
  text:
    de: '„Are you …?“ fragt nach „be“: Das Verb kommt nach vorn. „You are the tenant“ → „Are you the tenant?“ Kurz antwortet man mit dem Verb: „Yes, I am.“'
