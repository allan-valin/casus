steps:
- type: narrator
  text:
    en: You land in Amman. A passport officer, then Sami, the son of your host family, waiting in the hall. Listen to the conversation; you don't need to understand it yet.
    pt: Você chega a Amã. Um policial no controle de passaportes, depois Sami, o filho da família que vai receber você, esperando no saguão. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: officer
    text: السَّلامُ عَلَيْكُمْ. جَوازُ السَّفَرِ، مِنْ فَضْلِكِ.
    meaning:
      en: Hello. Your passport, please.
      pt: Olá. O passaporte, por favor.
  - speaker: protagonist
    text: وَعَلَيْكُمُ السَّلامُ. تَفَضَّلْ.
    meaning:
      en: Hello. Here you are.
      pt: Olá. Aqui está.
  - speaker: officer
    text: أَنْتِ مِنَ البَرازيلِ؟
    meaning:
      en: You are from Brazil?
      pt: Você é do Brasil?
  - speaker: protagonist
    text: نَعَمْ، أَنا مِنَ البَرازيلْ.
    meaning:
      en: Yes, I am from Brazil.
      pt: Sim, eu sou do Brasil.
  - speaker: officer
    text: أَهْلًا وَسَهْلًا.
    meaning:
      en: Welcome.
      pt: Bem-vinda.
  - speaker: protagonist
    text: شُكْرًا.
    meaning:
      en: Thank you.
      pt: Obrigada.
  - speaker: sami
    text: مَرْحَبًا! هَلْ أَنْتِ مِنَ البَرازيلِ؟ أَنا سامي.
    meaning:
      en: Hi! Are you from Brazil? I'm Sami.
      pt: Oi! Você é do Brasil? Eu sou o Sami.
  - speaker: protagonist
    text: مَرْحَبًا يا سامي! نَعَمْ، أَنا مِنَ البَرازيلْ.
    meaning:
      en: Hi, Sami! Yes, I'm from Brazil.
      pt: Oi, Sami! Sim, sou do Brasil.
- type: narrator
  text:
    en: 'The greeting of the whole Arab world is السَّلامُ عَلَيْكُمْ, ''peace be upon you''. The answer turns it round: وَعَلَيْكُمُ السَّلامْ.'
    pt: 'A saudação de todo o mundo árabe é السَّلامُ عَلَيْكُمْ, ''a paz esteja com vocês''. A resposta inverte: وَعَلَيْكُمُ السَّلامْ.'
- type: prompt
  ask:
    en: The officer greets you. Answer him.
    pt: O policial cumprimenta você. Responda.
  answer:
    speaker: protagonist
    text: وَعَلَيْكُمُ السَّلامْ.
  items:
  - wa-alaykumu-ssalam
- type: prompt
  ask:
    en: Now you greet first.
    pt: Agora cumprimente primeiro.
  answer:
    speaker: protagonist
    text: السَّلامُ عَلَيْكُمْ.
  items:
  - assalamu-alaykum
- type: narrator
  text:
    en: Arabic speaks to a man and to a woman differently. 'Here you are' to a man is تَفَضَّلْ; to a woman you will hear تَفَضَّلي.
    pt: O árabe fala de um jeito com um homem e de outro com uma mulher. 'Aqui está' para um homem é تَفَضَّلْ; para uma mulher você vai ouvir تَفَضَّلي.
- type: prompt
  ask:
    en: 'Hand the officer your passport: ''here you are''.'
    pt: 'Entregue o passaporte ao policial: ''aqui está''.'
  answer:
    speaker: protagonist
    text: تَفَضَّلْ.
  items:
  - tafaddal
- type: narrator
  text:
    en: '''I am from Brazil'' has no verb ''to be'' in Arabic: أَنا مِنَ البَرازيلْ, literally ''I from Brazil''. مِنْ ''from'' becomes مِنَ before البَرازيل, which carries the article ال.'
    pt: '''Eu sou do Brasil'' não tem verbo ''ser'' em árabe: أَنا مِنَ البَرازيلْ, literalmente ''eu do Brasil''. مِنْ ''de'' vira مِنَ antes de البَرازيل, que leva o artigo ال.'
