# STORY BIBLE — Modern Standard Arabic, narrator Brazilian Portuguese (+ neutral English). Written by AI (Claude)
# 2026-10-28 after the guide (docs/conversation/GUIDE.pt-BR.md); plan docs/conversation/PLAN-ar-pt-BR.md.
# UNDER CONSTRUCTION / INCOMPLETE: only the first level (A1) exists.

language: ar
in_development: true   # banner "under construction"; only A1 is written
narrator_languages: [en, pt]
country: Jordan
standard: >-
  Modern Standard Arabic (fuṣḥā), fully vowelled at A1 (Allan 2026-10-28: the standard, not a dialect — it matches
  Learn, the voices and the narrator). The host family speaks Jordanian Arabic among themselves; to the guest they
  speak fuṣḥā, which a culture note explains. No dialect lines in A1.

voices:
  # No open-licence natural Arabic voice yet: Piper ar_JO-kareem trains on a dataset with no licence (checked
  # 2026-10-28) → not used. Characters use the browser's Arabic voice, else espeak-ng, told apart by pitch/speed.
  - {id: nar-en, role: narrator, lang: en, tts: "piper:en_US-lessac-medium"}
  - {id: nar-pt, role: narrator, lang: pt, tts: "piper:pt_BR-cadu-medium"}            # CC0
  - {id: ar-f, role: character, lang: ar, gender: f, tts: "browser:ar, else espeak-ng:ar+f2", pitch: 1.15}
  - {id: ar-m, role: character, lang: ar, gender: m, tts: "browser:ar, else espeak-ng:ar"}
  - {id: ar-f2, role: character, lang: ar, gender: f, tts: "browser:ar, else espeak-ng:ar+f2", pitch: 1.3, speed: 0.95}
  - {id: ar-m2, role: character, lang: ar, gender: m, tts: "browser:ar, else espeak-ng:ar", pitch: 0.85, speed: 0.95}
  - {id: ar-m3, role: character, lang: ar, gender: m, tts: "browser:ar, else espeak-ng:ar", pitch: 0.92, speed: 1.1}
  - {id: ar-f3, role: character, lang: ar, gender: f, tts: "browser:ar, else espeak-ng:ar+f2", pitch: 1.0, speed: 1.08}

protagonist:
  forms: {f: ar-f, m: ar-m}
  name: null
  background: >-
    Brazilian from São Paulo, about 30, grandchild of Lebanese immigrants (the grandfather spoke Arabic at home; the
    protagonist knows a few words: حبيبي، يلّا، الحمد لله). Six months at a university language centre in Amman,
    lodging with the Haddad family.
  alternation: >-
    odd units f, even units m. Arabic marks the listener's sex (أنتَ / أنتِ, تفضّلْ / تفضّلي) and the speaker's in
    nationality words (برازيليّ / برازيليّة) — both sets appear.

cast:
  - {id: officer, name: ضابط الجوازات, role: passport officer, voice: ar-m2, register: formal}
  - {id: sami, name: سامي حدّاد, role: the Haddads' son, 20, engineering student, picks the protagonist up, voice: ar-m3, register: informal}
  - {id: driver, name: سائق التاكسي, role: taxi driver, voice: ar-m2, register: neutral}
  - {id: huda, name: هدى (أمّ سامي), role: host mother, 50s, teacher of Arabic at a school, voice: ar-f2, register: formal}
  - {id: khalid, name: خالد (أبو سامي), role: host father, 55, pharmacist, voice: ar-m2, register: formal}
  - {id: salma, name: الأستاذة سلمى, role: the class teacher, voice: ar-f3, register: formal}
  - {id: marcus, name: ماركوس, role: classmate from Hamburg, voice: ar-m, register: informal}
  - {id: yuki, name: يوكي, role: classmate from Osaka, voice: ar-f, register: informal}
  - {id: elif, name: إليف, role: classmate from Istanbul, voice: ar-f3, register: informal}
  - {id: clerk, name: الموظّفة, role: language-centre office, voice: ar-f2, register: formal}
