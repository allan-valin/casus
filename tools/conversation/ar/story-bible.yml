formality:
  summary: >-
    Fuṣḥā has no T/V pronoun pair: أنتَ / أنتِ for one person of any rank; politeness is in titles (أستاذ/أستاذة,
    دكتور, السيّد/السيّدة), in kunya (أبو سامي، أمّ سامي — normal and warm for parents), and in set phrases
    (تفضّلْ، من فضلك، لو سمحتَ). حضرتُك is a formal "you" heard in speech; not used in A1.
  rules:
    - The teacher is الأستاذة سلمى, never سلمى alone; the host parents are أبو سامي / أمّ سامي after A1-03.
    - Classmates and Sami use first names.
  sources:
    - {title: "Wikipedia: Kunya (Arabic)", url: "https://en.wikipedia.org/wiki/Kunya_(Arabic)", licence: CC BY-SA}
    - {title: "Wikipedia: Modern Standard Arabic", url: "https://en.wikipedia.org/wiki/Modern_Standard_Arabic", licence: CC BY-SA}

culture:
  taught:
    - {topic: greetings, note: "السلام عليكم is answered وعليكم السلام; long greetings and questions about the family come before business."}
    - {topic: fusha vs dialect, note: "Nobody speaks fuṣḥā at home; Jordanians speak Jordanian Arabic and switch to fuṣḥā for foreigners, the news and school."}
    - {topic: hospitality, note: "A guest is offered tea or coffee at once; refusing once is polite, accepting the second offer normal."}
    - {topic: right hand, note: "Eat and pass things with the right hand."}
    - {topic: Friday, note: "The weekend is Friday and Saturday; Friday noon is prayer time."}
    - {topic: Lebanese Brazil, note: "Brazil has one of the largest Lebanese diasporas: kibbeh and esfiha are Brazilian food too."}
  narrator:
    - {lang: en, topic: greetings, note: "Greetings are long: health, family, then business; the answer to السلام عليكم is fixed."}
    - {lang: en, topic: hospitality, note: "Tea or coffee is offered at once; refuse once politely, accept the second offer."}
    - {lang: en, topic: contact, note: "Between men and women who are not family a handshake may be declined; wait for the other's hand."}
    - {lang: pt, topic: contact, note: "Brazilians kiss on the cheek on meeting; in Jordan not between men and women who are not family — wait for the other's hand."}
    - {lang: pt, topic: hospitality, note: "Brazil also offers coffee at once; in Jordan saying no once is part of the ritual, and the host insists."}
    - {lang: pt, topic: weekend, note: "The weekend is Friday and Saturday; Sunday is a working day."}
    - {lang: pt, topic: roots, note: "Many Brazilians have Lebanese or Syrian grandparents; kibbeh and esfiha are known — the Arabic names are كبة and صفيحة."}
  clashes:
    - {situation: "Kissing the host mother on the cheek at the door", unit: A1-03}
    - {situation: "Accepting tea at the first offer, or refusing it every time", unit: A1-09}
    - {situation: "Passing the bread with the left hand", unit: A1-09}
    - {situation: "Planning a class outing for a Friday noon", unit: A1-15}

arc:
  A1: >-
    Arrival in Amman, the Haddads, the language centre, classmates who share only fuṣḥā; shopping, getting around,
    being ill, the first monthly test, the end-of-month party.

