steps:
- type: narrator
  text:
    en: Sami's car broke down; you take a taxi to the Haddads' house on University Street. Listen to the conversation; you don't need to understand it yet.
    pt: O carro do Sami quebrou; você pega um táxi até a casa dos Haddad, na rua da Universidade. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: driver
    text: مَرْحَبًا. إِلى أَيْنَ؟
    meaning:
      en: Hello. Where to?
      pt: Olá. Para onde?
  - speaker: protagonist
    text: إِلى شارِعِ الجامِعَةِ، مِنْ فَضْلِكَ.
    meaning:
      en: To University Street, please.
      pt: Para a rua da Universidade, por favor.
  - speaker: driver
    text: هَلْ أَنْتَ مِنْ أَمْريكا؟
    meaning:
      en: Are you from America?
      pt: Você é dos Estados Unidos?
  - speaker: protagonist
    text: لا، أَنا مِنَ البَرازيلْ.
    meaning:
      en: No, I'm from Brazil.
      pt: Não, sou do Brasil.
  - speaker: driver
    text: البَرازيلُ! أَهْلًا وَسَهْلًا.
    meaning:
      en: Brazil! Welcome.
      pt: Brasil! Bem-vindo.
  - speaker: protagonist
    text: هُنا، مِنْ فَضْلِكَ. كَمْ؟
    meaning:
      en: Here, please. How much?
      pt: Aqui, por favor. Quanto é?
  - speaker: driver
    text: خَمْسَةُ دَنانيرْ.
    meaning:
      en: Five dinars.
      pt: Cinco dinares.
  - speaker: protagonist
    text: تَفَضَّلْ. شُكْرًا.
    meaning:
      en: Here you are. Thank you.
      pt: Aqui está. Obrigado.
  - speaker: driver
    text: عَفْوًا.
    meaning:
      en: You're welcome.
      pt: De nada.
- type: prompt
  ask:
    en: The driver asks 'Where to?'. Ask him the same, to practise.
    pt: O motorista pergunta 'Para onde?'. Pergunte o mesmo, para praticar.
  answer:
    speaker: protagonist
    text: إِلى أَيْنَ؟
  items:
  - ila-ayna
- type: narrator
  text:
    en: 'إِلى means ''to'', towards a place. Say it before the place: إِلى شارِعِ الجامِعَةْ, ''to University Street''.'
    pt: 'إِلى quer dizer ''para'', em direção a um lugar. Vem antes do lugar: إِلى شارِعِ الجامِعَةْ, ''para a rua da Universidade''.'
- type: buildup
