- type: narrator
  text:
    en: '''Please'' to a man is مِنْ فَضْلِكَ, with -ka at the end; to a woman it was مِنْ فَضْلِكِ, with -ki. The same -ka / -ki tells ''your'' for a man or a woman.'
    pt: '''Por favor'' a um homem é مِنْ فَضْلِكَ, com -ka no fim; a uma mulher era مِنْ فَضْلِكِ, com -ki. O mesmo -ka / -ki diz ''seu'' de homem ou de mulher.'
