steps:
- type: narrator
  text:
    en: Huda shows you your room upstairs. Listen to the conversation; you don't need to understand it yet.
    pt: Huda mostra o seu quarto, no andar de cima. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: huda
    text: هٰذِهِ غُرْفَتُكَ.
    meaning:
      en: This is your room.
      pt: Este é o seu quarto.
  - speaker: protagonist
    text: الغُرْفَةُ كَبيرَةٌ!
    meaning:
      en: The room is big!
      pt: O quarto é grande!
  - speaker: huda
    text: وَهٰذا السَّريرُ، وَهٰذِهِ النّافِذَةْ.
    meaning:
      en: And this is the bed, and this is the window.
      pt: E esta é a cama, e esta é a janela.
  - speaker: protagonist
    text: النّافِذَةُ كَبيرَةٌ وَجَميلَةْ.
    meaning:
      en: The window is big and nice.
      pt: A janela é grande e bonita.
  - speaker: huda
    text: وَالسَّريرُ كَبيرٌ أَيْضًا.
    meaning:
      en: And the bed is big too.
      pt: E a cama também é grande.
  - speaker: protagonist
    text: الغُرْفَةُ جَميلَةٌ جِدًّا. شُكْرًا.
    meaning:
      en: The room is very nice. Thank you.
      pt: O quarto é muito bonito. Obrigado.
  - speaker: huda
    text: عَفْوًا. أَهْلًا وَسَهْلًا.
    meaning:
      en: You're welcome. Make yourself at home.
      pt: De nada. Fique à vontade.
  - speaker: protagonist
    text: شُكْرًا يا أُمَّ سامي.
    meaning:
      en: Thank you, Umm Sami.
      pt: Obrigado, Umm Sami.
- type: narrator
  text:
    en: '''Your room'' is one word: غُرْفَةٌ ''a room'' + -ka ''your'' → غُرْفَتُكَ. The -a of the feminine turns into t before the ending.'
    pt: '''O seu quarto'' é uma palavra só: غُرْفَةٌ ''um quarto'' + -ka ''seu'' → غُرْفَتُكَ. O -a do feminino vira t antes da terminação.'
- type: prompt
  ask:
    en: 'Huda shows the room. Repeat: this is your room — as if you showed it to a man.'
    pt: 'Huda mostra o quarto. Repita: este é o seu quarto — como se mostrasse a um homem.'
  answer:
    speaker: protagonist
    text: هٰذِهِ غُرْفَتُكَ.
  items:
  - hadhihi
  - ghurfatuka
- type: narrator
  text:
    en: '''The room is big'' has no verb: الغُرْفَةُ كَبيرَةٌ, ''the room big''. The adjective follows the noun''s gender: غُرْفَةٌ is feminine, so كَبيرَةٌ.'
    pt: '''O quarto é grande'' não tem verbo: الغُرْفَةُ كَبيرَةٌ, ''o quarto grande''. O adjetivo acompanha o gênero do substantivo: غُرْفَةٌ é feminino, então كَبيرَةٌ.'
