id: A1-05
protagonist: f
title: ["Registration", "A matrícula"]
situation: ["The office of the language centre. A clerk fills in your form.", "A secretaria do centro de línguas. Uma funcionária preenche a sua ficha."]
learn: [ar-a1-questions, ar-a1-numbers]
culture: Names in Arabic order
items:
  - [ma-ismuki, "ما اسْمُكِ؟", "What is your name? (to a woman)", "Qual é o seu nome? (a uma mulher)"]
  - [ma-ismuka, "ما اسْمُكَ؟", "What is your name? (to a man)", "Qual é o seu nome? (a um homem)"]
  - [min-ayna, "مِنْ أَيْنَ أَنْتِ؟", "Where are you from? (to a woman)", "De onde você é? (a uma mulher)"]
  - [raqm-alhatif, "رَقْمُ الهاتِفْ", "phone number", "número de telefone"]
  - [sifr, "صِفْرْ", "zero", "zero"]
  - [wahid, "واحِدْ", "one", "um"]
  - [ithnan, "اِثْنانْ", "two", "dois"]
  - [thalatha, "ثَلاثَةْ", "three", "três"]
  - [arbaa, "أَرْبَعَةْ", "four", "quatro"]
  - [khamsa, "خَمْسَةْ", "five", "cinco"]
  - [shukran-jazilan, "شُكْرًا جَزيلًا", "thank you very much", "muito obrigada, muito obrigado"]
  - [min-sao-paulo, "مِنْ ساو باولو", "from São Paulo", "de São Paulo"]
dialogue:
  - [clerk, "مَرْحَبًا. ما اسْمُكِ؟", "Hello. What is your name?", "Olá. Qual é o seu nome?"]
  - [protagonist, "اِسْمي آنا.", "My name is Ana.", "Meu nome é Ana."]
  - [clerk, "مِنْ أَيْنَ أَنْتِ يا آنا؟", "Where are you from, Ana?", "De onde você é, Ana?"]
  - [protagonist, "أَنا مِنَ البَرازيلِ، مِنْ ساو باولو.", "I'm from Brazil, from São Paulo.", "Sou do Brasil, de São Paulo."]
  - [clerk, "ما رَقْمُ الهاتِفْ؟", "What is the phone number?", "Qual é o número de telefone?"]
  - [protagonist, "صِفْرْ، سَبْعَةْ، واحِدْ، اِثْنانْ، ثَلاثَةْ، أَرْبَعَةْ، خَمْسَةْ.", "Zero, seven, one, two, three, four, five.", "Zero, sete, um, dois, três, quatro, cinco."]
  - [clerk, "شُكْرًا. أَهْلًا وَسَهْلًا في المَعْهَدْ.", "Thank you. Welcome to the institute.", "Obrigada. Bem-vinda ao instituto."]
  - [protagonist, "شُكْرًا جَزيلًا.", "Thank you very much.", "Muito obrigada."]
teach:
  - note: ["'What is your name?' — ما 'what' + اسْم 'name' + the ending for 'your': -ki to a woman, -ka to a man. The clerk is a woman, so you ask her: ما اسْمُكِ؟", "'Qual é o seu nome?' — ما 'o quê' + اسْم 'nome' + a terminação de 'seu': -ki para mulher, -ka para homem. A funcionária é mulher: ما اسْمُكِ؟"]
  - ask: ["Ask the clerk her name.", "Pergunte o nome da funcionária.", "ما اسْمُكِ؟", ma-ismuki]
  - ask: ["Ask a man his name.", "Pergunte o nome de um homem.", "ما اسْمُكَ؟", ma-ismuka]
  - ask: ["Answer: my name is Ana.", "Responda: meu nome é Ana.", "اِسْمي آنا.", ismi]
  - note: ["مِنْ أَيْنَ؟ 'from where?' The question word comes first, then the person: مِنْ أَيْنَ أَنْتِ؟", "مِنْ أَيْنَ؟ 'de onde?' A palavra interrogativa vem primeiro, depois a pessoa: مِنْ أَيْنَ أَنْتِ؟"]
  - ask: ["Ask Yuki, a classmate, where she is from.", "Pergunte a Yuki, uma colega, de onde ela é.", "مِنْ أَيْنَ أَنْتِ؟", min-ayna]
  - ask: ["Say you are from Brazil, from São Paulo.", "Diga que é do Brasil, de São Paulo.", "أَنا مِنَ البَرازيلِ، مِنْ ساو باولو.", ana, mina-lbrazil, min-sao-paulo]
  - note: ["Numbers one to five: واحِدْ، اِثْنانْ، ثَلاثَةْ، أَرْبَعَةْ، خَمْسَةْ; zero is صِفْرْ — the word that gave Portuguese 'cifra' and 'zero'. Phone numbers are said digit by digit.", "Os números de um a cinco: واحِدْ، اِثْنانْ، ثَلاثَةْ، أَرْبَعَةْ، خَمْسَةْ; zero é صِفْرْ — a palavra que deu 'cifra' e 'zero' em português. Telefones se dizem algarismo por algarismo."]
  - ask: ["Count from one to three.", "Conte de um a três.", "واحِدْ، اِثْنانْ، ثَلاثَةْ.", wahid, ithnan, thalatha]
  - ask: ["Count from zero to five.", "Conte de zero a cinco.", "صِفْرْ، واحِدْ، اِثْنانْ، ثَلاثَةْ، أَرْبَعَةْ، خَمْسَةْ.", sifr, wahid, ithnan, thalatha, arbaa, khamsa]
  - ask: ["Ask for the phone number.", "Pergunte o número de telefone.", "ما رَقْمُ الهاتِفْ؟", raqm-alhatif]
  - ask: ["Give a number: zero, five, four, two.", "Dê um número: zero, cinco, quatro, dois.", "صِفْرْ، خَمْسَةْ، أَرْبَعَةْ، اِثْنانْ.", sifr, khamsa, arbaa, ithnan]
  - ask: ["Thank her very much.", "Agradeça muito.", "شُكْرًا جَزيلًا.", shukran-jazilan]
  - pt_only: "Os 'algarismos arábicos' que usamos no Brasil vieram dos árabes; na Jordânia, porém, muita placa usa os números do Oriente: ٠ ١ ٢ ٣ ٤ ٥. Os dois sistemas convivem."
