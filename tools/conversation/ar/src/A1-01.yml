id: A1-01
protagonist: f
title: ["At the airport", "No aeroporto"]
situation: ["You land in Amman. A passport officer, then Sami, the son of your host family, waiting in the hall.", "Você chega a Amã. Um policial no controle de passaportes, depois Sami, o filho da família que vai receber você, esperando no saguão."]
learn: [ar-a1-pronouns, ar-a1-nominal]
culture: Peace as a greeting
items:
  - [assalamu-alaykum, "السَّلامُ عَلَيْكُمْ", "hello (literally: peace be upon you)", "olá (literalmente: a paz esteja com vocês)"]
  - [wa-alaykumu-ssalam, "وَعَلَيْكُمُ السَّلامْ", "hello (the answer: and upon you peace)", "olá (a resposta: e com vocês a paz)"]
  - [jawaz, "جَوازُ السَّفَرْ", "passport", "passaporte"]
  - [min-fadlik, "مِنْ فَضْلِكِ", "please (to a woman)", "por favor (a uma mulher)"]
  - [tafaddal, "تَفَضَّلْ", "here you are (to a man)", "aqui está (a um homem)"]
  - [anti, "أَنْتِ", "you (a woman)", "você (mulher)"]
  - [ana, "أَنا", "I", "eu"]
  - [mina-lbrazil, "مِنَ البَرازيلْ", "from Brazil", "do Brasil"]
  - [naam, "نَعَمْ", "yes", "sim"]
  - [ahlan-wa-sahlan, "أَهْلًا وَسَهْلًا", "welcome", "bem-vindo, bem-vinda"]
  - [shukran, "شُكْرًا", "thank you", "obrigado, obrigada"]
  - [marhaban, "مَرْحَبًا", "hi, hello", "oi, olá"]
  - [hal, "هَلْ", "(starts a yes/no question)", "(abre uma pergunta de sim ou não)"]
dialogue:
  - [officer, "السَّلامُ عَلَيْكُمْ. جَوازُ السَّفَرِ، مِنْ فَضْلِكِ.", "Hello. Your passport, please.", "Olá. O passaporte, por favor."]
  - [protagonist, "وَعَلَيْكُمُ السَّلامُ. تَفَضَّلْ.", "Hello. Here you are.", "Olá. Aqui está."]
  - [officer, "أَنْتِ مِنَ البَرازيلِ؟", "You are from Brazil?", "Você é do Brasil?"]
  - [protagonist, "نَعَمْ، أَنا مِنَ البَرازيلْ.", "Yes, I am from Brazil.", "Sim, eu sou do Brasil."]
  - [officer, "أَهْلًا وَسَهْلًا.", "Welcome.", "Bem-vinda."]
  - [protagonist, "شُكْرًا.", "Thank you.", "Obrigada."]
  - [sami, "مَرْحَبًا! هَلْ أَنْتِ مِنَ البَرازيلِ؟ أَنا سامي.", "Hi! Are you from Brazil? I'm Sami.", "Oi! Você é do Brasil? Eu sou o Sami."]
  - [protagonist, "مَرْحَبًا يا سامي! نَعَمْ، أَنا مِنَ البَرازيلْ.", "Hi, Sami! Yes, I'm from Brazil.", "Oi, Sami! Sim, sou do Brasil."]
teach:
  - note: ["The greeting of the whole Arab world is السَّلامُ عَلَيْكُمْ, 'peace be upon you'. The answer turns it round: وَعَلَيْكُمُ السَّلامْ.", "A saudação de todo o mundo árabe é السَّلامُ عَلَيْكُمْ, 'a paz esteja com vocês'. A resposta inverte: وَعَلَيْكُمُ السَّلامْ."]
  - ask: ["The officer greets you. Answer him.", "O policial cumprimenta você. Responda.", "وَعَلَيْكُمُ السَّلامْ.", wa-alaykumu-ssalam]
  - ask: ["Now you greet first.", "Agora cumprimente primeiro.", "السَّلامُ عَلَيْكُمْ.", assalamu-alaykum]
  - note: ["Arabic speaks to a man and to a woman differently. 'Here you are' to a man is تَفَضَّلْ; to a woman you will hear تَفَضَّلي.", "O árabe fala de um jeito com um homem e de outro com uma mulher. 'Aqui está' para um homem é تَفَضَّلْ; para uma mulher você vai ouvir تَفَضَّلي."]
  - ask: ["Hand the officer your passport: 'here you are'.", "Entregue o passaporte ao policial: 'aqui está'.", "تَفَضَّلْ.", tafaddal]
  - note: ["'I am from Brazil' has no verb 'to be' in Arabic: أَنا مِنَ البَرازيلْ, literally 'I from Brazil'. مِنْ 'from' becomes مِنَ before البَرازيل, which carries the article ال.", "'Eu sou do Brasil' não tem verbo 'ser' em árabe: أَنا مِنَ البَرازيلْ, literalmente 'eu do Brasil'. مِنْ 'de' vira مِنَ antes de البَرازيل, que leva o artigo ال."]
  - build: [mina-lbrazil, ["البَرازيلْ", "مِنَ البَرازيلْ"]]
  - ask: ["Say that you are from Brazil.", "Diga que você é do Brasil.", "أَنا مِنَ البَرازيلْ.", ana, mina-lbrazil]
  - ask: ["The officer asks if you are from Brazil. Say yes.", "O policial pergunta se você é do Brasil. Diga que sim.", "نَعَمْ، أَنا مِنَ البَرازيلْ.", naam, ana, mina-lbrazil]
  - ask: ["He welcomes you. Thank him.", "Ele dá as boas-vindas. Agradeça.", "شُكْرًا.", shukran]
  - note: ["A question with yes or no often starts with هَلْ — like a spoken question mark at the front. أَنْتِ is 'you' to a woman; to a man it is أَنْتَ.", "Uma pergunta de sim ou não muitas vezes começa com هَلْ — um ponto de interrogação falado, no começo. أَنْتِ é 'você' para uma mulher; para um homem é أَنْتَ."]
  - ask: ["Ask a woman in the queue if she is from Brazil.", "Pergunte a uma mulher na fila se ela é do Brasil.", "هَلْ أَنْتِ مِنَ البَرازيلْ؟", hal, anti, mina-lbrazil]
  - ask: ["Say hi to Sami.", "Diga oi ao Sami.", "مَرْحَبًا يا سامي!", marhaban]
  - ask: ["Say: welcome!", "Diga: bem-vindo!", "أَهْلًا وَسَهْلًا!", ahlan-wa-sahlan]
  - pt_only: "Talvez você já conheça palavras daqui: a esfiha e o quibe vieram com os libaneses e sírios que chegaram ao Brasil — e 'oxalá' vem de 'in shā' Allāh'."
