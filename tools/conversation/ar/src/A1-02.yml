id: A1-02
protagonist: m
title: ["The taxi", "O táxi"]
situation: ["Sami's car broke down; you take a taxi to the Haddads' house on University Street.", "O carro do Sami quebrou; você pega um táxi até a casa dos Haddad, na rua da Universidade."]
learn: [ar-a1-prepositions, ar-a1-questions]
culture: Fares and small talk in the taxi
items:
  - [ila-ayna, "إِلى أَيْنَ؟", "Where to?", "Para onde?"]
  - [ila, "إِلى", "to (a place)", "para (um lugar)"]
  - [sharii-aljamia, "شارِعِ الجامِعَةْ", "University Street", "a rua da Universidade"]
  - [min-fadlika, "مِنْ فَضْلِكَ", "please (to a man)", "por favor (a um homem)"]
  - [anta, "أَنْتَ", "you (a man)", "você (homem)"]
  - [la, "لا", "no", "não"]
  - [huna, "هُنا", "here", "aqui"]
  - [kam, "كَمْ؟", "How much?", "Quanto é?"]
  - [khamsatu-dananir, "خَمْسَةُ دَنانيرْ", "five dinars", "cinco dinares"]
  - [afwan, "عَفْوًا", "you're welcome", "de nada"]
dialogue:
  - [driver, "مَرْحَبًا. إِلى أَيْنَ؟", "Hello. Where to?", "Olá. Para onde?"]
  - [protagonist, "إِلى شارِعِ الجامِعَةِ، مِنْ فَضْلِكَ.", "To University Street, please.", "Para a rua da Universidade, por favor."]
  - [driver, "هَلْ أَنْتَ مِنْ أَمْريكا؟", "Are you from America?", "Você é dos Estados Unidos?"]
  - [protagonist, "لا، أَنا مِنَ البَرازيلْ.", "No, I'm from Brazil.", "Não, sou do Brasil."]
  - [driver, "البَرازيلُ! أَهْلًا وَسَهْلًا.", "Brazil! Welcome.", "Brasil! Bem-vindo."]
  - [protagonist, "هُنا، مِنْ فَضْلِكَ. كَمْ؟", "Here, please. How much?", "Aqui, por favor. Quanto é?"]
  - [driver, "خَمْسَةُ دَنانيرْ.", "Five dinars.", "Cinco dinares."]
  - [protagonist, "تَفَضَّلْ. شُكْرًا.", "Here you are. Thank you.", "Aqui está. Obrigado."]
  - [driver, "عَفْوًا.", "You're welcome.", "De nada."]
teach:
  - ask: ["The driver asks 'Where to?'. Ask him the same, to practise.", "O motorista pergunta 'Para onde?'. Pergunte o mesmo, para praticar.", "إِلى أَيْنَ؟", ila-ayna]
  - note: ["إِلى means 'to', towards a place. Say it before the place: إِلى شارِعِ الجامِعَةْ, 'to University Street'.", "إِلى quer dizer 'para', em direção a um lugar. Vem antes do lugar: إِلى شارِعِ الجامِعَةْ, 'para a rua da Universidade'."]
  - build: [sharii-aljamia, ["الجامِعَةْ", "شارِعِ الجامِعَةْ"]]
  - ask: ["Tell him where you are going.", "Diga para onde você vai.", "إِلى شارِعِ الجامِعَةْ.", ila, sharii-aljamia]
  - note: ["'Please' to a man is مِنْ فَضْلِكَ, with -ka at the end; to a woman it was مِنْ فَضْلِكِ, with -ki. The same -ka / -ki tells 'your' for a man or a woman.", "'Por favor' a um homem é مِنْ فَضْلِكَ, com -ka no fim; a uma mulher era مِنْ فَضْلِكِ, com -ki. O mesmo -ka / -ki diz 'seu' de homem ou de mulher."]
  - ask: ["Now add 'please'.", "Agora acrescente 'por favor'.", "إِلى شارِعِ الجامِعَةِ، مِنْ فَضْلِكَ.", ila, sharii-aljamia, min-fadlika]
  - ask: ["He asks if you are from America. Say no, you are from Brazil.", "Ele pergunta se você é dos Estados Unidos. Diga que não, que é do Brasil.", "لا، أَنا مِنَ البَرازيلْ.", la, ana, mina-lbrazil]
  - note: ["أَنْتَ is 'you' to a man, أَنْتِ to a woman: only the last vowel changes.", "أَنْتَ é 'você' para um homem, أَنْتِ para uma mulher: só muda a última vogal."]
  - ask: ["Ask the driver if he is from Amman.", "Pergunte ao motorista se ele é de Amã.", "هَلْ أَنْتَ مِنْ عَمّانْ؟", hal, anta]
  - ask: ["You are there. Say: here, please.", "Você chegou. Diga: aqui, por favor.", "هُنا، مِنْ فَضْلِكَ.", huna, min-fadlika]
  - ask: ["Ask how much it is.", "Pergunte quanto é.", "كَمْ؟", kam]
  - ask: ["He says five dinars. Repeat the price.", "Ele diz cinco dinares. Repita o preço.", "خَمْسَةُ دَنانيرْ.", khamsatu-dananir]
  - ask: ["Pay and thank him.", "Pague e agradeça.", "تَفَضَّلْ. شُكْرًا.", tafaddal, shukran]
  - ask: ["He thanks you for the tip. Say: you're welcome.", "Ele agradece a gorjeta. Diga: de nada.", "عَفْوًا.", afwan]
  - pt_only: "Em Amã muitos táxis amarelos têm taxímetro; quando não têm, combine o preço antes de entrar — como em alguns aeroportos do Brasil."
