id: A1-03
protagonist: f
title: ["The family", "A família"]
situation: ["Huda and Khalid Haddad open the door. Sami introduces everyone.", "Huda e Khalid Haddad abrem a porta. Sami apresenta todo mundo."]
learn: [ar-a1-demonstratives, ar-a1-gender]
culture: Greeting the host mother
items:
  - [hadhihi, "هٰذِهِ", "this (a woman, a feminine thing)", "esta (mulher, coisa feminina)"]
  - [hadha, "هٰذا", "this (a man, a masculine thing)", "este (homem, coisa masculina)"]
  - [ummi, "أُمّي", "my mother", "minha mãe"]
  - [abi, "أَبي", "my father", "meu pai"]
  - [ismi, "اِسْمي", "my name is", "meu nome é"]
  - [tasharrafna, "تَشَرَّفْنا", "pleased to meet you", "muito prazer"]
  - [tafaddali, "تَفَضَّلي", "come in / please (to a woman)", "entre / por favor (a uma mulher)"]
  - [taliba, "طالِبَةٌ", "a student (woman)", "uma estudante"]
  - [talib, "طالِبٌ", "a student (man)", "um estudante"]
  - [wa, "وَ", "and", "e"]
dialogue:
  - [sami, "هٰذِهِ أُمّي، هُدى. وَهٰذا أَبي، خالِدْ.", "This is my mother, Huda. And this is my father, Khalid.", "Esta é a minha mãe, Huda. E este é o meu pai, Khalid."]
  - [huda, "أَهْلًا وَسَهْلًا! تَفَضَّلي.", "Welcome! Come in.", "Bem-vinda! Entre."]
  - [protagonist, "شُكْرًا. تَشَرَّفْنا.", "Thank you. Pleased to meet you.", "Obrigada. Muito prazer."]
  - [khalid, "تَشَرَّفْنا. هَلْ أَنْتِ طالِبَةٌ؟", "Pleased to meet you. Are you a student?", "Muito prazer. Você é estudante?"]
  - [protagonist, "نَعَمْ، أَنا طالِبَةٌ.", "Yes, I'm a student.", "Sim, sou estudante."]
  - [huda, "وَسامي طالِبٌ أَيْضًا.", "And Sami is a student too.", "E o Sami também é estudante."]
  - [protagonist, "هٰذا لَكُمْ، مِنَ البَرازيلْ.", "This is for you, from Brazil.", "Isto é para vocês, do Brasil."]
  - [huda, "شُكْرًا يا حَبيبَتي!", "Thank you, my dear!", "Obrigada, querida!"]
teach:
  - note: ["Arabic has two words for 'this': هٰذا for a man or a masculine thing, هٰذِهِ for a woman or a feminine thing. Most feminine words end in -a, written ة.", "O árabe tem duas palavras para 'este, esta': هٰذا para homem ou coisa masculina, هٰذِهِ para mulher ou coisa feminina. A maioria das palavras femininas termina em -a, escrito ة."]
  - ask: ["Sami points at his mother. Say: this is my mother.", "Sami aponta para a mãe. Diga: esta é a minha mãe.", "هٰذِهِ أُمّي.", hadhihi, ummi]
  - ask: ["Now his father: this is my father.", "Agora o pai: este é o meu pai.", "هٰذا أَبي.", hadha, abi]
  - ask: ["Say both, with 'and'.", "Diga os dois, com 'e'.", "هٰذِهِ أُمّي وَهٰذا أَبي.", hadhihi, ummi, wa, hadha, abi]
  - note: ["وَ 'and' is written joined to the next word: وَهٰذا, وَسامي.", "وَ 'e' se escreve junto da palavra seguinte: وَهٰذا, وَسامي."]
  - ask: ["Huda says welcome. Answer: thank you, pleased to meet you.", "Huda dá as boas-vindas. Responda: obrigada, muito prazer.", "شُكْرًا. تَشَرَّفْنا.", shukran, tasharrafna]
  - ask: ["Say your name. Say: my name is Ana.", "Diga o seu nome. Diga: meu nome é Ana.", "اِسْمي آنا.", ismi]
  - note: ["A student: طالِبٌ for a man, طالِبَةٌ for a woman — the feminine adds -a. You are a woman in this unit: أَنا طالِبَةٌ.", "Estudante: طالِبٌ para um homem, طالِبَةٌ para uma mulher — o feminino acrescenta -a. Nesta unidade você é mulher: أَنا طالِبَةٌ."]
  - ask: ["Khalid asks if you are a student. Say yes.", "Khalid pergunta se você é estudante. Diga que sim.", "نَعَمْ، أَنا طالِبَةٌ.", naam, ana, taliba]
  - ask: ["Say that Sami is a student.", "Diga que o Sami é estudante.", "سامي طالِبٌ.", talib]
  - ask: ["Ask Huda: please, come in — you are holding the door for her.", "Diga a Huda: por favor, entre — você segura a porta para ela.", "تَفَضَّلي.", tafaddali]
  - note: ["At home the Haddads speak Jordanian Arabic; to you they speak fuṣḥā, the standard Arabic of school and the news. That is why everyone here understands you.", "Em casa os Haddad falam árabe jordaniano; com você falam fuṣḥā, o árabe padrão da escola e do noticiário. Por isso todos entendem você."]
  - pt_only: "No Brasil se cumprimenta com beijo no rosto; aqui, entre homens e mulheres que não são da família, espere a mão do outro. Com a Huda, um sorriso e a mão no peito bastam."
