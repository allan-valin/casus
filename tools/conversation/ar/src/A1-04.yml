id: A1-04
protagonist: m
title: ["The room", "O quarto"]
situation: ["Huda shows you your room upstairs.", "Huda mostra o seu quarto, no andar de cima."]
learn: [ar-a1-noun-adj, ar-a1-possessive]
culture: The guest's room
items:
  - [ghurfatuka, "غُرْفَتُكَ", "your room (to a man)", "o seu quarto (a um homem)"]
  - [ghurfa, "غُرْفَةٌ", "a room", "um quarto"]
  - [kabira, "كَبيرَةٌ", "big (feminine)", "grande (feminino)"]
  - [kabir, "كَبيرٌ", "big (masculine)", "grande (masculino)"]
  - [jamila, "جَميلَةٌ", "beautiful, nice (feminine)", "bonita (feminino)"]
  - [sarir, "السَّريرْ", "the bed", "a cama"]
  - [nafidha, "النّافِذَةْ", "the window", "a janela"]
  - [wa-hadha, "وَهٰذا", "and this", "e este"]
  - [jiddan, "جِدًّا", "very", "muito"]
  - [aydan, "أَيْضًا", "too, also", "também"]
  - [umm-sami, "أُمَّ سامي", "Umm Sami (Sami's mother: how one calls a mother)", "Umm Sami (mãe do Sami: assim se chama uma mãe)"]
dialogue:
  - [huda, "هٰذِهِ غُرْفَتُكَ.", "This is your room.", "Este é o seu quarto."]
  - [protagonist, "الغُرْفَةُ كَبيرَةٌ!", "The room is big!", "O quarto é grande!"]
  - [huda, "وَهٰذا السَّريرُ، وَهٰذِهِ النّافِذَةْ.", "And this is the bed, and this is the window.", "E esta é a cama, e esta é a janela."]
  - [protagonist, "النّافِذَةُ كَبيرَةٌ وَجَميلَةْ.", "The window is big and nice.", "A janela é grande e bonita."]
  - [huda, "وَالسَّريرُ كَبيرٌ أَيْضًا.", "And the bed is big too.", "E a cama também é grande."]
  - [protagonist, "الغُرْفَةُ جَميلَةٌ جِدًّا. شُكْرًا.", "The room is very nice. Thank you.", "O quarto é muito bonito. Obrigado."]
  - [huda, "عَفْوًا. أَهْلًا وَسَهْلًا.", "You're welcome. Make yourself at home.", "De nada. Fique à vontade."]
  - [protagonist, "شُكْرًا يا أُمَّ سامي.", "Thank you, Umm Sami.", "Obrigado, Umm Sami."]
teach:
  - note: ["'Your room' is one word: غُرْفَةٌ 'a room' + -ka 'your' → غُرْفَتُكَ. The -a of the feminine turns into t before the ending.", "'O seu quarto' é uma palavra só: غُرْفَةٌ 'um quarto' + -ka 'seu' → غُرْفَتُكَ. O -a do feminino vira t antes da terminação."]
  - ask: ["Huda shows the room. Repeat: this is your room — as if you showed it to a man.", "Huda mostra o quarto. Repita: este é o seu quarto — como se mostrasse a um homem.", "هٰذِهِ غُرْفَتُكَ.", hadhihi, ghurfatuka]
  - note: ["'The room is big' has no verb: الغُرْفَةُ كَبيرَةٌ, 'the room big'. The adjective follows the noun's gender: غُرْفَةٌ is feminine, so كَبيرَةٌ.", "'O quarto é grande' não tem verbo: الغُرْفَةُ كَبيرَةٌ, 'o quarto grande'. O adjetivo acompanha o gênero do substantivo: غُرْفَةٌ é feminino, então كَبيرَةٌ."]
  - ask: ["Say: the room is big.", "Diga: o quarto é grande.", "الغُرْفَةُ كَبيرَةٌ.", ghurfa, kabira]
  - ask: ["Say: the bed is big. السَّرير is masculine.", "Diga: a cama é grande. السَّرير é masculino.", "السَّريرُ كَبيرٌ.", sarir, kabir]
  - ask: ["Point at the window: and this is the window.", "Aponte para a janela: e esta é a janela.", "وَهٰذِهِ النّافِذَةْ.", wa, hadhihi, nafidha]
  - ask: ["Say the window is big and nice.", "Diga que a janela é grande e bonita.", "النّافِذَةُ كَبيرَةٌ وَجَميلَةْ.", nafidha, kabira, jamila]
  - note: ["جِدًّا 'very' comes after the adjective: جَميلَةٌ جِدًّا, 'very nice'.", "جِدًّا 'muito' vem depois do adjetivo: جَميلَةٌ جِدًّا, 'muito bonita'."]
  - ask: ["Say the room is very nice, and thank her.", "Diga que o quarto é muito bonito e agradeça.", "الغُرْفَةُ جَميلَةٌ جِدًّا. شُكْرًا.", ghurfa, jamila, jiddan, shukran]
  - note: ["Parents are called after their eldest son: أُمُّ سامي 'Sami's mother', أَبو سامي 'Sami's father'. It is warm and respectful — use it for Huda and Khalid.", "Os pais são chamados pelo nome do filho mais velho: أُمُّ سامي 'mãe do Sami', أَبو سامي 'pai do Sami'. É carinhoso e respeitoso — use com a Huda e o Khalid."]
  - ask: ["Thank Huda, calling her Umm Sami.", "Agradeça à Huda chamando-a de Umm Sami.", "شُكْرًا يا أُمَّ سامي.", shukran, umm-sami]
  - ask: ["Say: the bed is big too.", "Diga: a cama também é grande.", "السَّريرُ كَبيرٌ أَيْضًا.", sarir, kabir, aydan]
  - pt_only: "Em português 'quarto' é masculino; em árabe غُرْفَة é feminino. O gênero muda de língua para língua — vá pelo ة no fim."
