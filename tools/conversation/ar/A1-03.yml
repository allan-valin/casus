steps:
- type: narrator
  text:
    en: Huda and Khalid Haddad open the door. Sami introduces everyone. Listen to the conversation; you don't need to understand it yet.
    pt: Huda e Khalid Haddad abrem a porta. Sami apresenta todo mundo. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sami
    text: هٰذِهِ أُمّي، هُدى. وَهٰذا أَبي، خالِدْ.
    meaning:
      en: This is my mother, Huda. And this is my father, Khalid.
      pt: Esta é a minha mãe, Huda. E este é o meu pai, Khalid.
  - speaker: huda
    text: أَهْلًا وَسَهْلًا! تَفَضَّلي.
    meaning:
      en: Welcome! Come in.
      pt: Bem-vinda! Entre.
  - speaker: protagonist
    text: شُكْرًا. تَشَرَّفْنا.
    meaning:
      en: Thank you. Pleased to meet you.
      pt: Obrigada. Muito prazer.
  - speaker: khalid
    text: تَشَرَّفْنا. هَلْ أَنْتِ طالِبَةٌ؟
    meaning:
      en: Pleased to meet you. Are you a student?
      pt: Muito prazer. Você é estudante?
  - speaker: protagonist
    text: نَعَمْ، أَنا طالِبَةٌ.
    meaning:
      en: Yes, I'm a student.
      pt: Sim, sou estudante.
  - speaker: huda
    text: وَسامي طالِبٌ أَيْضًا.
    meaning:
      en: And Sami is a student too.
      pt: E o Sami também é estudante.
  - speaker: protagonist
    text: هٰذا لَكُمْ، مِنَ البَرازيلْ.
    meaning:
      en: This is for you, from Brazil.
      pt: Isto é para vocês, do Brasil.
  - speaker: huda
    text: شُكْرًا يا حَبيبَتي!
    meaning:
      en: Thank you, my dear!
      pt: Obrigada, querida!
- type: narrator
  text:
    en: 'Arabic has two words for ''this'': هٰذا for a man or a masculine thing, هٰذِهِ for a woman or a feminine thing. Most feminine words end in -a, written ة.'
    pt: 'O árabe tem duas palavras para ''este, esta'': هٰذا para homem ou coisa masculina, هٰذِهِ para mulher ou coisa feminina. A maioria das palavras femininas termina em -a, escrito ة.'
- type: prompt
  ask:
    en: 'Sami points at his mother. Say: this is my mother.'
    pt: 'Sami aponta para a mãe. Diga: esta é a minha mãe.'
  answer:
    speaker: protagonist
    text: هٰذِهِ أُمّي.
  items:
  - hadhihi
  - ummi
- type: prompt
  ask:
