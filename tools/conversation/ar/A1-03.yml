  items:
  - ismi
- type: narrator
  text:
    en: 'A student: طالِبٌ for a man, طالِبَةٌ for a woman — the feminine adds -a. You are a woman in this unit: أَنا طالِبَةٌ.'
    pt: 'Estudante: طالِبٌ para um homem, طالِبَةٌ para uma mulher — o feminino acrescenta -a. Nesta unidade você é mulher: أَنا طالِبَةٌ.'
- type: prompt
