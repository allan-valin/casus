- type: narrator
  text:
    en: At home the Haddads speak Jordanian Arabic; to you they speak fuṣḥā, the standard Arabic of school and the news. That is why everyone here understands you.
    pt: Em casa os Haddad falam árabe jordaniano; com você falam fuṣḥā, o árabe padrão da escola e do noticiário. Por isso todos entendem você.
