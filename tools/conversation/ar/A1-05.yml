steps:
- type: narrator
  text:
    en: The office of the language centre. A clerk fills in your form. Listen to the conversation; you don't need to understand it yet.
    pt: A secretaria do centro de línguas. Uma funcionária preenche a sua ficha. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: clerk
    text: مَرْحَبًا. ما اسْمُكِ؟
    meaning:
      en: Hello. What is your name?
      pt: Olá. Qual é o seu nome?
  - speaker: protagonist
    text: اِسْمي آنا.
    meaning:
      en: My name is Ana.
      pt: Meu nome é Ana.
  - speaker: clerk
    text: مِنْ أَيْنَ أَنْتِ يا آنا؟
    meaning:
      en: Where are you from, Ana?
      pt: De onde você é, Ana?
  - speaker: protagonist
    text: أَنا مِنَ البَرازيلِ، مِنْ ساو باولو.
    meaning:
      en: I'm from Brazil, from São Paulo.
      pt: Sou do Brasil, de São Paulo.
  - speaker: clerk
    text: ما رَقْمُ الهاتِفْ؟
    meaning:
      en: What is the phone number?
      pt: Qual é o número de telefone?
  - speaker: protagonist
    text: صِفْرْ، سَبْعَةْ، واحِدْ، اِثْنانْ، ثَلاثَةْ، أَرْبَعَةْ، خَمْسَةْ.
    meaning:
      en: Zero, seven, one, two, three, four, five.
      pt: Zero, sete, um, dois, três, quatro, cinco.
  - speaker: clerk
    text: شُكْرًا. أَهْلًا وَسَهْلًا في المَعْهَدْ.
    meaning:
      en: Thank you. Welcome to the institute.
      pt: Obrigada. Bem-vinda ao instituto.
  - speaker: protagonist
    text: شُكْرًا جَزيلًا.
    meaning:
      en: Thank you very much.
      pt: Muito obrigada.
- type: narrator
  text:
    en: '''What is your name?'' — ما ''what'' + اسْم ''name'' + the ending for ''your'': -ki to a woman, -ka to a man. The clerk is a woman, so you ask her: ما اسْمُكِ؟'
    pt: '''Qual é o seu nome?'' — ما ''o quê'' + اسْم ''nome'' + a terminação de ''seu'': -ki para mulher, -ka para homem. A funcionária é mulher: ما اسْمُكِ؟'
