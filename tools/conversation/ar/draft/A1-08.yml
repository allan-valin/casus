steps:
- type: narrator
  text:
    en: At dinner, Khalid and Huda ask about you; Sami counts the guests for Friday. Listen to the conversation; you don't need to understand it yet.
    pt: No jantar, Khalid e Huda perguntam sobre você; Sami conta os convidados de sexta. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: khalid
    text: كَمْ عُمْرُكَ يا بُنَيّ؟
    meaning:
      en: How old are you, son?
      pt: Quantos anos você tem, meu filho?
  - speaker: protagonist
    text: عُمْري ثَلاثونَ سَنَةً. وَأَنْتَ يا أَبا سامي؟
    meaning:
      en: I'm thirty. And you, Abu Sami?
      pt: Tenho trinta anos. E o senhor, Abu Sami?
  - speaker: khalid
    text: أَنا؟ خَمْسٌ وَخَمْسونَ!
    meaning:
      en: Me? Fifty-five!
      pt: Eu? Cinquenta e cinco!
  - speaker: huda
    text: يا سامي، كَمْ شَخْصًا يَوْمَ الجُمُعَةِ؟
    meaning:
      en: Sami, how many people on Friday?
      pt: Sami, quantas pessoas na sexta?
  - speaker: sami
    text: سِتَّةْ… سَبْعَةْ… ثَمانِيَةْ.
    meaning:
      en: Six… seven… eight.
      pt: Seis… sete… oito.
  - speaker: huda
    text: وَأَنْتَ تِسْعَةْ!
    meaning:
      en: And you are nine!
      pt: E você é o nove!
  - speaker: protagonist
    text: تِسْعَةْ؟ شُكْرًا جَزيلًا!
    meaning:
      en: Nine? Thank you very much!
      pt: Nove? Muito obrigado!
  - speaker: sami
    text: وَعَمّي يوسُف عَشَرَةْ.
    meaning:
      en: And my uncle Yusuf is ten.
      pt: E o tio Yusuf é o dez.
- type: narrator
  text:
    en: 'Six to ten: سِتَّةْ، سَبْعَةْ، ثَمانِيَةْ، تِسْعَةْ، عَشَرَةْ. With one to five from the office, you can count to ten.'
    pt: 'De seis a dez: سِتَّةْ، سَبْعَةْ، ثَمانِيَةْ، تِسْعَةْ، عَشَرَةْ. Com os de um a cinco da secretaria, você conta até dez.'
- type: prompt
  ask:
    en: Count from six to ten.
    pt: Conte de seis a dez.
  answer:
    speaker: protagonist
    text: سِتَّةْ، سَبْعَةْ، ثَمانِيَةْ، تِسْعَةْ، عَشَرَةْ.
