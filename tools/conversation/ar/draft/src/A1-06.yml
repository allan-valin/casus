id: A1-06
protagonist: m
title: ["The first class", "A primeira aula"]
situation: ["Your first class at the language centre. The teacher, Ustādha Salma, asks about the things on the desk.", "A primeira aula no centro de línguas. A professora, Ustādha Salma, pergunta sobre as coisas na mesa."]
learn: [ar-a1-gender, ar-a1-questions]
culture: Calling the teacher
items:
  - [sabah-alkhayr, "صَباحُ الخَيْرْ", "good morning", "bom dia"]
  - [sabah-annur, "صَباحُ النّورْ", "good morning (the answer)", "bom dia (a resposta)"]
  - [ya-ustadha, "يا أُسْتاذَةْ", "teacher (to a woman teacher)", "professora (ao chamar)"]
  - [kitab, "كِتابٌ", "a book", "um livro"]
  - [qalam, "قَلَمٌ", "a pen", "uma caneta"]
  - [ma-hadha, "ما هٰذا؟", "What is this? (a masculine thing)", "O que é isto? (coisa masculina)"]
  - [ma-hadhihi, "ما هٰذِهِ؟", "What is this? (a feminine thing)", "O que é isto? (coisa feminina)"]
  - [sayyara, "سَيّارَةٌ", "a car", "um carro"]
  - [hadha-kitabi, "هٰذا كِتابي", "this is my book", "este é o meu livro"]
  - [la-afham, "لا أَفْهَمْ", "I don't understand", "não entendo"]
  - [mara-ukhra, "مَرَّةً أُخْرى", "once more", "mais uma vez"]
dialogue:
  - [salma, "صَباحُ الخَيْرْ.", "Good morning.", "Bom dia."]
  - [protagonist, "صَباحُ النّورِ يا أُسْتاذَةْ.", "Good morning, teacher.", "Bom dia, professora."]
  - [salma, "ما هٰذا؟", "What is this?", "O que é isto?"]
  - [protagonist, "هٰذا كِتابٌ.", "This is a book.", "Isto é um livro."]
  - [salma, "وَما هٰذا؟", "And what is this?", "E isto?"]
  - [protagonist, "هٰذا قَلَمٌ.", "This is a pen.", "Isto é uma caneta."]
  - [salma, "وَما هٰذِهِ؟ هَلْ هٰذِهِ سَيّارَةٌ؟", "And what is this? Is this a car?", "E isto? Isto é um carro?"]
  - [protagonist, "لا أَفْهَمْ. مَرَّةً أُخْرى، مِنْ فَضْلِكِ.", "I don't understand. Once more, please.", "Não entendo. Mais uma vez, por favor."]
  - [salma, "هَلْ هٰذِهِ سَيّارَةٌ؟", "Is this a car?", "Isto é um carro?"]
  - [protagonist, "نَعَمْ، هٰذِهِ سَيّارَةٌ صَغيرَةٌ.", "Yes, this is a small car.", "Sim, é um carro pequeno."]
teach:
  - note: ["The morning greeting has a fixed answer too: صَباحُ الخَيْرْ, 'morning of good', is answered صَباحُ النّورْ, 'morning of light'.", "O cumprimento da manhã também tem resposta fixa: صَباحُ الخَيْرْ, 'manhã de bem', responde-se صَباحُ النّورْ, 'manhã de luz'."]
  - ask: ["Answer the teacher's good morning.", "Responda ao bom-dia da professora.", "صَباحُ النّورْ.", sabah-annur]
  - ask: ["Now you say good morning first.", "Agora você dá bom-dia primeiro.", "صَباحُ الخَيْرْ.", sabah-alkhayr]
  - note: ["Students call a woman teacher يا أُسْتاذَةْ — يا is said before the person you call. To a man teacher: يا أُسْتاذْ.", "Os alunos chamam a professora de يا أُسْتاذَةْ — يا vem antes de quem se chama. A um professor: يا أُسْتاذْ."]
  - ask: ["Answer good morning and call her 'teacher'.", "Responda bom-dia chamando-a de 'professora'.", "صَباحُ النّورِ يا أُسْتاذَةْ.", sabah-annur, ya-ustadha]
  - note: ["'What is this?' follows the thing: ما هٰذا؟ for a masculine thing, ما هٰذِهِ؟ for a feminine one. كِتابٌ and قَلَمٌ are masculine; سَيّارَةٌ ends in ة, so it is feminine.", "'O que é isto?' acompanha a coisa: ما هٰذا؟ para coisa masculina, ما هٰذِهِ؟ para feminina. كِتابٌ e قَلَمٌ são masculinos; سَيّارَةٌ termina em ة, então é feminina."]
  - ask: ["Point at a book and ask what it is.", "Aponte para um livro e pergunte o que é.", "ما هٰذا؟", ma-hadha]
  - ask: ["Answer: this is a book.", "Responda: isto é um livro.", "هٰذا كِتابٌ.", hadha, kitab]
  - ask: ["Say: this is a pen.", "Diga: isto é uma caneta.", "هٰذا قَلَمٌ.", hadha, qalam]
  - ask: ["Point at a car and ask what it is.", "Aponte para um carro e pergunte o que é.", "ما هٰذِهِ؟", ma-hadhihi]
  - ask: ["Say: this is a car.", "Diga: isto é um carro.", "هٰذِهِ سَيّارَةٌ.", hadhihi, sayyara]
  - ask: ["Say: this is my book.", "Diga: este é o meu livro.", "هٰذا كِتابي.", hadha-kitabi]
  - ask: ["You did not understand. Say so.", "Você não entendeu. Diga isso.", "لا أَفْهَمْ.", la-afham]
  - ask: ["Ask her to say it once more, please.", "Peça para ela repetir, por favor.", "مَرَّةً أُخْرى، مِنْ فَضْلِكِ.", mara-ukhra, min-fadlik]
  - pt_only: "No Brasil se chama a professora pelo nome; aqui é sempre 'Ustādha' — com o nome dela ou sem, mas nunca só o nome."
