id: A1-07
protagonist: f
title: ["The classmates", "Os colegas"]
situation: ["The break. Three classmates: Marcus from Germany, Yuki from Japan, Elif from Turkey. Arabic is the only language you share.", "O intervalo. Três colegas: Marcus, da Alemanha, Yuki, do Japão, Elif, da Turquia. O árabe é a única língua em comum."]
learn: [ar-a1-gender, ar-a1-pronouns]
culture: Nationality words
items:
  - [huwa, "هُوَ", "he", "ele"]
  - [hiya, "هِيَ", "she", "ela"]
  - [barazili, "بَرازيلِيٌّ", "Brazilian (a man)", "brasileiro"]
  - [barazilia, "بَرازيلِيَّةٌ", "Brazilian (a woman)", "brasileira"]
  - [almani, "أَلْمانِيٌّ", "German (a man)", "alemão"]
  - [yabania, "يابانِيَّةٌ", "Japanese (a woman)", "japonesa"]
  - [turkia, "تُرْكِيَّةٌ", "Turkish (a woman)", "turca"]
  - [min-almania, "مِنْ أَلْمانْيا", "from Germany", "da Alemanha"]
  - [nahnu, "نَحْنُ", "we", "nós"]
  - [tullab, "طُلّابٌ", "students", "estudantes"]
dialogue:
  - [marcus, "مَرْحَبًا! أَنا ماركوس. أَنا أَلْمانِيٌّ.", "Hi! I'm Marcus. I'm German.", "Oi! Sou o Marcus. Sou alemão."]
  - [protagonist, "مَرْحَبًا. أَنا بَرازيلِيَّةٌ، مِنْ ساو باولو.", "Hi. I'm Brazilian, from São Paulo.", "Oi. Sou brasileira, de São Paulo."]
  - [marcus, "هٰذِهِ يوكي. هِيَ يابانِيَّةٌ.", "This is Yuki. She's Japanese.", "Esta é a Yuki. Ela é japonesa."]
  - [yuki, "أَهْلًا! وَهٰذِهِ إِليف. هِيَ تُرْكِيَّةٌ.", "Hello! And this is Elif. She's Turkish.", "Olá! E esta é a Elif. Ela é turca."]
  - [elif, "تَشَرَّفْنا. هَلْ أَنْتِ بَرازيلِيَّةٌ؟", "Nice to meet you. Are you Brazilian?", "Prazer. Você é brasileira?"]
  - [protagonist, "نَعَمْ. وَجَدّي مِنْ لُبْنانْ.", "Yes. And my grandfather is from Lebanon.", "Sim. E meu avô é do Líbano."]
  - [elif, "جَميلٌ! نَحْنُ طُلّابٌ مِنْ كُلِّ العالَمْ.", "Lovely! We are students from all over the world.", "Que legal! Somos estudantes do mundo todo."]
  - [protagonist, "نَعَمْ، وَالعَرَبِيَّةُ لُغَتُنا.", "Yes, and Arabic is our language.", "Sim, e o árabe é a nossa língua."]
teach:
  - note: ["Nationalities end in -iyy for a man and -iyya for a woman: بَرازيلِيٌّ, بَرازيلِيَّةٌ — like brasileiro, brasileira. You are a woman in this unit.", "As nacionalidades terminam em -iyy para homem e -iyya para mulher: بَرازيلِيٌّ, بَرازيلِيَّةٌ — como brasileiro, brasileira. Nesta unidade você é mulher."]
  - ask: ["Say you are Brazilian.", "Diga que você é brasileira.", "أَنا بَرازيلِيَّةٌ.", ana, barazilia]
  - ask: ["Say a Brazilian man's version: I am Brazilian.", "Diga a versão de um homem: sou brasileiro.", "أَنا بَرازيلِيٌّ.", ana, barazili]
  - note: ["'He' is هُوَ, 'she' is هِيَ. Again no verb 'to be': هُوَ أَلْمانِيٌّ, 'he German'.", "'Ele' é هُوَ, 'ela' é هِيَ. De novo sem verbo 'ser': هُوَ أَلْمانِيٌّ, 'ele alemão'."]
  - ask: ["Say Marcus is German: he is German.", "Diga que o Marcus é alemão: ele é alemão.", "هُوَ أَلْمانِيٌّ.", huwa, almani]
  - ask: ["Say Yuki is Japanese: she is Japanese.", "Diga que a Yuki é japonesa: ela é japonesa.", "هِيَ يابانِيَّةٌ.", hiya, yabania]
  - ask: ["Introduce Elif: this is Elif, she is Turkish.", "Apresente a Elif: esta é a Elif, ela é turca.", "هٰذِهِ إِليف. هِيَ تُرْكِيَّةٌ.", hadhihi, hiya, turkia]
  - ask: ["Say Marcus is from Germany.", "Diga que o Marcus é da Alemanha.", "هُوَ مِنْ أَلْمانْيا.", huwa, min-almania]
  - ask: ["Say: we are students.", "Diga: somos estudantes.", "نَحْنُ طُلّابٌ.", nahnu, tullab]
  - pt_only: "Muitos brasileiros têm avós libaneses ou sírios — dizer جَدّي مِنْ لُبْنانْ, 'meu avô é do Líbano', costuma abrir sorrisos em Amã."
