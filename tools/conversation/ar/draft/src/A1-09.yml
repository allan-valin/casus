id: A1-09
protagonist: f
title: ["Breakfast", "O café da manhã"]
situation: ["Breakfast at the Haddads': bread, hummus, olives. Huda offers tea.", "Café da manhã na casa dos Haddad: pão, homus, azeitonas. Huda oferece chá."]
learn: [ar-a1-definite]
culture: Tea is offered twice
items:
  - [shay, "شايْ", "tea", "chá"]
  - [qahwa, "قَهْوَةْ", "coffee", "café"]
  - [khubz, "خُبْزْ", "bread", "pão"]
  - [urid, "أُريدُ", "I want / I'd like", "quero / gostaria de"]
  - [hal-turidin, "هَلْ تُريدينَ…؟", "Would you like…? (to a woman)", "Você quer…? (a uma mulher)"]
  - [ladhidh, "لَذيذٌ", "delicious", "gostoso"]
  - [al-khubz, "الخُبْزُ", "the bread", "o pão"]
  - [la-shukran, "لا، شُكْرًا", "no, thank you", "não, obrigada"]
  - [qalilan, "قَليلًا", "a little", "um pouco"]
  - [bilhana, "بِالهَناءِ وَالشِّفاءْ", "enjoy your meal (with pleasure and health)", "bom apetite (com gosto e saúde)"]
dialogue:
  - [huda, "صَباحُ الخَيْرْ! هَلْ تُريدينَ شايًا؟", "Good morning! Would you like tea?", "Bom dia! Quer chá?"]
  - [protagonist, "لا، شُكْرًا.", "No, thank you.", "Não, obrigada."]
  - [huda, "تَفَضَّلي، تَفَضَّلي! شايٌ بِالنَّعْناعْ.", "Please, please! Mint tea.", "Por favor, por favor! Chá de hortelã."]
  - [protagonist, "إِذَنْ… نَعَمْ، قَليلًا. شُكْرًا.", "Then… yes, a little. Thank you.", "Então… sim, um pouco. Obrigada."]
  - [khalid, "وَالخُبْزُ؟", "And the bread?", "E o pão?"]
  - [protagonist, "أُريدُ خُبْزًا، مِنْ فَضْلِكَ.", "I'd like some bread, please.", "Quero pão, por favor."]
  - [khalid, "بِالهَناءِ وَالشِّفاءْ!", "Enjoy!", "Bom apetite!"]
  - [protagonist, "الخُبْزُ لَذيذٌ جِدًّا!", "The bread is very good!", "O pão é muito gostoso!"]
teach:
  - note: ["A guest says no once out of politeness, and the host insists: تَفَضَّلي، تَفَضَّلي! Accepting the second offer is the normal end.", "O convidado recusa uma vez por educação, e o anfitrião insiste: تَفَضَّلي، تَفَضَّلي! Aceitar a segunda oferta é o final normal."]
  - ask: ["Huda offers tea. Refuse politely the first time.", "Huda oferece chá. Recuse educadamente na primeira vez.", "لا، شُكْرًا.", la-shukran]
  - ask: ["She insists. Accept a little, and thank her.", "Ela insiste. Aceite um pouco e agradeça.", "نَعَمْ، قَليلًا. شُكْرًا.", naam, qalilan, shukran]
  - note: ["أُريدُ means 'I want' and is polite with مِنْ فَضْلِكَ: أُريدُ خُبْزًا، مِنْ فَضْلِكَ.", "أُريدُ quer dizer 'quero' e fica educado com مِنْ فَضْلِكَ: أُريدُ خُبْزًا، مِنْ فَضْلِكَ."]
  - ask: ["Ask for bread, please — Khalid passes it.", "Peça pão, por favor — Khalid passa.", "أُريدُ خُبْزًا، مِنْ فَضْلِكَ.", urid, khubz, min-fadlika]
  - ask: ["Say you would like coffee.", "Diga que gostaria de café.", "أُريدُ قَهْوَةً.", urid, qahwa]
  - ask: ["Offer Yuki tea: would you like tea?", "Ofereça chá à Yuki: quer chá?", "هَلْ تُريدينَ شايًا؟", hal-turidin, shay]
  - note: ["ال is 'the', written joined to the word: خُبْزْ 'bread', الخُبْزُ 'the bread'.", "ال é 'o, a', escrito junto da palavra: خُبْزْ 'pão', الخُبْزُ 'o pão'."]
  - ask: ["Say the bread is very good.", "Diga que o pão é muito gostoso.", "الخُبْزُ لَذيذٌ جِدًّا.", al-khubz, ladhidh, jiddan]
  - ask: ["Wish everyone a good meal.", "Deseje bom apetite a todos.", "بِالهَناءِ وَالشِّفاءْ!", bilhana]
  - note: ["Take bread and pass dishes with the right hand.", "Pegue o pão e passe os pratos com a mão direita."]
  - pt_only: "No Brasil um 'não, obrigada' encerra o assunto; aqui ele abre a dança da insistência — e aceitar na segunda vez não é falta de educação."
