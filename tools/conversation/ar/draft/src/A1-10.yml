id: A1-10
protagonist: m
title: ["At the corner shop", "Na mercearia"]
situation: ["Abu Ali's corner shop. You need water and a few things for your room.", "A mercearia do Abu Ali. Você precisa de água e de algumas coisas para o quarto."]
learn: [ar-a1-numbers, ar-a1-demonstratives]
culture: Prices and bargaining
items:
  - [bikam, "بِكَمْ؟", "How much (does it cost)?", "Quanto custa?"]
  - [bikam-hadha, "بِكَمْ هٰذا؟", "How much is this?", "Quanto custa isto?"]
  - [dinar, "دينارْ", "a dinar", "um dinar"]
  - [dinarayn, "دينارَيْنْ", "two dinars", "dois dinares"]
  - [ghali, "غالٍ", "expensive", "caro"]
  - [rakhis, "رَخيصٌ", "cheap", "barato"]
  - [maa, "ماءْ", "water", "água"]
  - [zujaja, "زُجاجَةُ ماءٍ", "a bottle of water", "uma garrafa de água"]
  - [hadha-ghali, "هٰذا غالٍ", "that's expensive", "isso é caro"]
  - [khudh, "خُذْ", "take (it)", "pegue"]
dialogue:
  - [grocer, "أَهْلًا وَسَهْلًا! تَفَضَّلْ.", "Welcome! Go ahead.", "Bem-vindo! Pode falar."]
  - [protagonist, "أُريدُ زُجاجَةَ ماءٍ، مِنْ فَضْلِكَ.", "I'd like a bottle of water, please.", "Quero uma garrafa de água, por favor."]
  - [grocer, "تَفَضَّلْ.", "Here you are.", "Aqui está."]
  - [protagonist, "بِكَمْ هٰذا؟", "How much is this?", "Quanto custa?"]
  - [grocer, "نِصْفُ دينارْ.", "Half a dinar.", "Meio dinar."]
  - [protagonist, "وَهٰذا الصّابونُ؟ بِكَمْ؟", "And this soap? How much?", "E este sabonete? Quanto custa?"]
  - [grocer, "دينارَيْنْ.", "Two dinars.", "Dois dinares."]
  - [protagonist, "دينارَيْنْ؟ هٰذا غالٍ!", "Two dinars? That's expensive!", "Dois dinares? Isso é caro!"]
  - [grocer, "خُذْهُ بِدينارٍ وَنِصْفْ.", "Take it for one and a half.", "Leve por um e meio."]
  - [protagonist, "شُكْرًا يا أَبا عَلي!", "Thank you, Abu Ali!", "Obrigado, Abu Ali!"]
teach:
  - note: ["بِكَمْ؟ asks a price: 'for how much?'. كَمْ alone asks 'how many'.", "بِكَمْ؟ pergunta o preço: 'por quanto?'. كَمْ sozinho pergunta 'quantos'."]
  - ask: ["Ask how much this is.", "Pergunte quanto custa isto.", "بِكَمْ هٰذا؟", bikam-hadha]
  - ask: ["Ask for a bottle of water, please.", "Peça uma garrafa de água, por favor.", "أُريدُ زُجاجَةَ ماءٍ، مِنْ فَضْلِكَ.", urid, zujaja, min-fadlika]
  - note: ["Two of something has its own ending, -ayn: دينارْ, دينارَيْنْ 'two dinars' — no need for the word 'two'.", "Dois de alguma coisa tem terminação própria, -ayn: دينارْ, دينارَيْنْ 'dois dinares' — sem precisar da palavra 'dois'."]
  - ask: ["Repeat the price: two dinars.", "Repita o preço: dois dinares.", "دينارَيْنْ.", dinarayn]
  - ask: ["Say: that's expensive!", "Diga: isso é caro!", "هٰذا غالٍ!", hadha-ghali]
  - ask: ["Say the water is cheap.", "Diga que a água é barata.", "الماءُ رَخيصٌ.", maa, rakhis]
  - ask: ["Ask: how much?", "Pergunte: quanto custa?", "بِكَمْ؟", bikam]
  - note: ["In small shops a friendly 'that's expensive' often gets a better price; in supermarkets prices are fixed.", "Em lojinhas um 'isso é caro' simpático muitas vezes rende desconto; no supermercado o preço é fixo."]
  - ask: ["Thank Abu Ali.", "Agradeça ao Abu Ali.", "شُكْرًا يا أَبا عَلي!", shukran]
  - pt_only: "Pechinchar com simpatia é parte da conversa, como numa feira no Brasil — mas sem exagero na mercearia do bairro, onde o dono vira conhecido."
