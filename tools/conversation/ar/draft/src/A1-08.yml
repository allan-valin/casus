id: A1-08
protagonist: m
title: ["Numbers and age", "Números e idade"]
situation: ["At dinner, Khalid and Huda ask about you; Sami counts the guests for Friday.", "No jantar, Khalid e Huda perguntam sobre você; Sami conta os convidados de sexta."]
learn: [ar-a1-numbers]
culture: Asking someone's age
items:
  - [sitta, "سِتَّةْ", "six", "seis"]
  - [saba, "سَبْعَةْ", "seven", "sete"]
  - [thamaniya, "ثَمانِيَةْ", "eight", "oito"]
  - [tisa, "تِسْعَةْ", "nine", "nove"]
  - [ashara, "عَشَرَةْ", "ten", "dez"]
  - [kam-umruka, "كَمْ عُمْرُكَ؟", "How old are you? (to a man)", "Quantos anos você tem? (a um homem)"]
  - [umri, "عُمْري", "my age is", "minha idade é"]
  - [thalathun-sana, "ثَلاثونَ سَنَةً", "thirty years", "trinta anos"]
  - [wa-anta, "وَأَنْتَ؟", "And you? (to a man)", "E você? (a um homem)"]
  - [kam-shakhsan, "كَمْ شَخْصًا؟", "How many people?", "Quantas pessoas?"]
dialogue:
  - [khalid, "كَمْ عُمْرُكَ يا بُنَيّ؟", "How old are you, son?", "Quantos anos você tem, meu filho?"]
  - [protagonist, "عُمْري ثَلاثونَ سَنَةً. وَأَنْتَ يا أَبا سامي؟", "I'm thirty. And you, Abu Sami?", "Tenho trinta anos. E o senhor, Abu Sami?"]
  - [khalid, "أَنا؟ خَمْسٌ وَخَمْسونَ!", "Me? Fifty-five!", "Eu? Cinquenta e cinco!"]
  - [huda, "يا سامي، كَمْ شَخْصًا يَوْمَ الجُمُعَةِ؟", "Sami, how many people on Friday?", "Sami, quantas pessoas na sexta?"]
  - [sami, "سِتَّةْ… سَبْعَةْ… ثَمانِيَةْ.", "Six… seven… eight.", "Seis… sete… oito."]
  - [huda, "وَأَنْتَ تِسْعَةْ!", "And you are nine!", "E você é o nove!"]
  - [protagonist, "تِسْعَةْ؟ شُكْرًا جَزيلًا!", "Nine? Thank you very much!", "Nove? Muito obrigado!"]
  - [sami, "وَعَمّي يوسُف عَشَرَةْ.", "And my uncle Yusuf is ten.", "E o tio Yusuf é o dez."]
teach:
  - note: ["Six to ten: سِتَّةْ، سَبْعَةْ، ثَمانِيَةْ، تِسْعَةْ، عَشَرَةْ. With one to five from the office, you can count to ten.", "De seis a dez: سِتَّةْ، سَبْعَةْ، ثَمانِيَةْ، تِسْعَةْ، عَشَرَةْ. Com os de um a cinco da secretaria, você conta até dez."]
  - ask: ["Count from six to ten.", "Conte de seis a dez.", "سِتَّةْ، سَبْعَةْ، ثَمانِيَةْ، تِسْعَةْ، عَشَرَةْ.", sitta, saba, thamaniya, tisa, ashara]
  - ask: ["Count from one to five again.", "Conte de novo de um a cinco.", "واحِدْ، اِثْنانْ، ثَلاثَةْ، أَرْبَعَةْ، خَمْسَةْ.", wahid, ithnan, thalatha, arbaa, khamsa]
  - note: ["'How old are you?' is 'how much your age?': كَمْ عُمْرُكَ؟ to a man; the answer starts with عُمْري, 'my age'.", "'Quantos anos você tem?' é 'quanto a sua idade?': كَمْ عُمْرُكَ؟ a um homem; a resposta começa com عُمْري, 'minha idade'."]
  - ask: ["Ask Sami how old he is.", "Pergunte ao Sami quantos anos ele tem.", "كَمْ عُمْرُكَ؟", kam-umruka]
  - ask: ["Say you are thirty.", "Diga que você tem trinta anos.", "عُمْري ثَلاثونَ سَنَةً.", umri, thalathun-sana]
  - ask: ["Turn the question back to Khalid: and you?", "Devolva a pergunta ao Khalid: e o senhor?", "وَأَنْتَ؟", wa-anta]
  - ask: ["Ask how many people are coming.", "Pergunte quantas pessoas vêm.", "كَمْ شَخْصًا؟", kam-shakhsan]
  - ask: ["Huda says you are number nine. Repeat: nine.", "Huda diz que você é o nove. Repita: nove.", "تِسْعَةْ.", tisa]
  - note: ["Khalid calls you يا بُنَيّ, 'my son' — older people say it warmly to the young; to a young woman, يا بِنْتي.", "Khalid chama você de يا بُنَيّ, 'meu filho' — os mais velhos dizem isso com carinho aos jovens; a uma moça, يا بِنْتي."]
  - pt_only: "No Brasil perguntar a idade pode soar indiscreto; aqui é normal entre conhecidos, e ninguém se ofende."
