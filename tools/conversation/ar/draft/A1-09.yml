steps:
- type: narrator
  text:
    en: 'Breakfast at the Haddads'': bread, hummus, olives. Huda offers tea. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Café da manhã na casa dos Haddad: pão, homus, azeitonas. Huda oferece chá. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: huda
    text: صَباحُ الخَيْرْ! هَلْ تُريدينَ شايًا؟
    meaning:
      en: Good morning! Would you like tea?
      pt: Bom dia! Quer chá?
  - speaker: protagonist
    text: لا، شُكْرًا.
    meaning:
      en: No, thank you.
      pt: Não, obrigada.
  - speaker: huda
    text: تَفَضَّلي، تَفَضَّلي! شايٌ بِالنَّعْناعْ.
    meaning:
      en: Please, please! Mint tea.
      pt: Por favor, por favor! Chá de hortelã.
  - speaker: protagonist
    text: إِذَنْ… نَعَمْ، قَليلًا. شُكْرًا.
    meaning:
      en: Then… yes, a little. Thank you.
      pt: Então… sim, um pouco. Obrigada.
  - speaker: khalid
    text: وَالخُبْزُ؟
    meaning:
      en: And the bread?
      pt: E o pão?
  - speaker: protagonist
    text: أُريدُ خُبْزًا، مِنْ فَضْلِكَ.
    meaning:
      en: I'd like some bread, please.
      pt: Quero pão, por favor.
  - speaker: khalid
    text: بِالهَناءِ وَالشِّفاءْ!
    meaning:
      en: Enjoy!
      pt: Bom apetite!
  - speaker: protagonist
    text: الخُبْزُ لَذيذٌ جِدًّا!
    meaning:
      en: The bread is very good!
      pt: O pão é muito gostoso!
- type: narrator
  text:
    en: 'A guest says no once out of politeness, and the host insists: تَفَضَّلي، تَفَضَّلي! Accepting the second offer is the normal end.'
    pt: 'O convidado recusa uma vez por educação, e o anfitrião insiste: تَفَضَّلي، تَفَضَّلي! Aceitar a segunda oferta é o final normal.'
- type: prompt
