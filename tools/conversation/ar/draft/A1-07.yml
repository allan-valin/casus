steps:
- type: narrator
  text:
    en: 'The break. Three classmates: Marcus from Germany, Yuki from Japan, Elif from Turkey. Arabic is the only language you share. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'O intervalo. Três colegas: Marcus, da Alemanha, Yuki, do Japão, Elif, da Turquia. O árabe é a única língua em comum. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: marcus
    text: مَرْحَبًا! أَنا ماركوس. أَنا أَلْمانِيٌّ.
    meaning:
      en: Hi! I'm Marcus. I'm German.
      pt: Oi! Sou o Marcus. Sou alemão.
  - speaker: protagonist
    text: مَرْحَبًا. أَنا بَرازيلِيَّةٌ، مِنْ ساو باولو.
    meaning:
      en: Hi. I'm Brazilian, from São Paulo.
      pt: Oi. Sou brasileira, de São Paulo.
  - speaker: marcus
    text: هٰذِهِ يوكي. هِيَ يابانِيَّةٌ.
    meaning:
      en: This is Yuki. She's Japanese.
      pt: Esta é a Yuki. Ela é japonesa.
  - speaker: yuki
    text: أَهْلًا! وَهٰذِهِ إِليف. هِيَ تُرْكِيَّةٌ.
    meaning:
      en: Hello! And this is Elif. She's Turkish.
      pt: Olá! E esta é a Elif. Ela é turca.
  - speaker: elif
    text: تَشَرَّفْنا. هَلْ أَنْتِ بَرازيلِيَّةٌ؟
    meaning:
      en: Nice to meet you. Are you Brazilian?
      pt: Prazer. Você é brasileira?
  - speaker: protagonist
    text: نَعَمْ. وَجَدّي مِنْ لُبْنانْ.
    meaning:
      en: Yes. And my grandfather is from Lebanon.
      pt: Sim. E meu avô é do Líbano.
  - speaker: elif
    text: جَميلٌ! نَحْنُ طُلّابٌ مِنْ كُلِّ العالَمْ.
    meaning:
      en: Lovely! We are students from all over the world.
      pt: Que legal! Somos estudantes do mundo todo.
  - speaker: protagonist
    text: نَعَمْ، وَالعَرَبِيَّةُ لُغَتُنا.
    meaning:
      en: Yes, and Arabic is our language.
      pt: Sim, e o árabe é a nossa língua.
- type: narrator
  text:
    en: 'Nationalities end in -iyy for a man and -iyya for a woman: بَرازيلِيٌّ, بَرازيلِيَّةٌ — like brasileiro, brasileira. You are a woman in this unit.'
    pt: 'As nacionalidades terminam em -iyy para homem e -iyya para mulher: بَرازيلِيٌّ, بَرازيلِيَّةٌ — como brasileiro, brasileira. Nesta unidade você é mulher.'
