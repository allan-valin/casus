steps:
- type: narrator
  text:
    en: Abu Ali's corner shop. You need water and a few things for your room. Listen to the conversation; you don't need to understand it yet.
    pt: A mercearia do Abu Ali. Você precisa de água e de algumas coisas para o quarto. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: grocer
    text: أَهْلًا وَسَهْلًا! تَفَضَّلْ.
    meaning:
      en: Welcome! Go ahead.
      pt: Bem-vindo! Pode falar.
  - speaker: protagonist
    text: أُريدُ زُجاجَةَ ماءٍ، مِنْ فَضْلِكَ.
    meaning:
      en: I'd like a bottle of water, please.
      pt: Quero uma garrafa de água, por favor.
  - speaker: grocer
    text: تَفَضَّلْ.
    meaning:
      en: Here you are.
      pt: Aqui está.
  - speaker: protagonist
    text: بِكَمْ هٰذا؟
    meaning:
      en: How much is this?
      pt: Quanto custa?
  - speaker: grocer
    text: نِصْفُ دينارْ.
    meaning:
      en: Half a dinar.
      pt: Meio dinar.
  - speaker: protagonist
    text: وَهٰذا الصّابونُ؟ بِكَمْ؟
    meaning:
      en: And this soap? How much?
      pt: E este sabonete? Quanto custa?
  - speaker: grocer
    text: دينارَيْنْ.
    meaning:
      en: Two dinars.
      pt: Dois dinares.
  - speaker: protagonist
    text: دينارَيْنْ؟ هٰذا غالٍ!
    meaning:
      en: Two dinars? That's expensive!
      pt: Dois dinares? Isso é caro!
  - speaker: grocer
    text: خُذْهُ بِدينارٍ وَنِصْفْ.
    meaning:
      en: Take it for one and a half.
      pt: Leve por um e meio.
  - speaker: protagonist
    text: شُكْرًا يا أَبا عَلي!
    meaning:
      en: Thank you, Abu Ali!
      pt: Obrigado, Abu Ali!
- type: narrator
  text:
    en: 'بِكَمْ؟ asks a price: ''for how much?''. كَمْ alone asks ''how many''.'
    pt: 'بِكَمْ؟ pergunta o preço: ''por quanto?''. كَمْ sozinho pergunta ''quantos''.'
- type: prompt
  ask:
    en: Ask how much this is.
    pt: Pergunte quanto custa isto.
  answer:
    speaker: protagonist
    text: بِكَمْ هٰذا؟
