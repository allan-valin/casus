steps:
- type: narrator
  text:
    en: Your first class at the language centre. The teacher, Ustādha Salma, asks about the things on the desk. Listen to the conversation; you don't need to understand it yet.
    pt: A primeira aula no centro de línguas. A professora, Ustādha Salma, pergunta sobre as coisas na mesa. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: salma
    text: صَباحُ الخَيْرْ.
    meaning:
      en: Good morning.
      pt: Bom dia.
  - speaker: protagonist
    text: صَباحُ النّورِ يا أُسْتاذَةْ.
    meaning:
      en: Good morning, teacher.
      pt: Bom dia, professora.
  - speaker: salma
    text: ما هٰذا؟
    meaning:
      en: What is this?
      pt: O que é isto?
  - speaker: protagonist
    text: هٰذا كِتابٌ.
    meaning:
      en: This is a book.
      pt: Isto é um livro.
  - speaker: salma
    text: وَما هٰذا؟
    meaning:
      en: And what is this?
      pt: E isto?
  - speaker: protagonist
    text: هٰذا قَلَمٌ.
    meaning:
      en: This is a pen.
      pt: Isto é uma caneta.
  - speaker: salma
    text: وَما هٰذِهِ؟ هَلْ هٰذِهِ سَيّارَةٌ؟
    meaning:
      en: And what is this? Is this a car?
      pt: E isto? Isto é um carro?
  - speaker: protagonist
    text: لا أَفْهَمْ. مَرَّةً أُخْرى، مِنْ فَضْلِكِ.
    meaning:
      en: I don't understand. Once more, please.
      pt: Não entendo. Mais uma vez, por favor.
  - speaker: salma
    text: هَلْ هٰذِهِ سَيّارَةٌ؟
    meaning:
      en: Is this a car?
      pt: Isto é um carro?
  - speaker: protagonist
    text: نَعَمْ، هٰذِهِ سَيّارَةٌ صَغيرَةٌ.
    meaning:
      en: Yes, this is a small car.
      pt: Sim, é um carro pequeno.
