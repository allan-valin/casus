steps:
- type: narrator
  text:
    en: Friday. Goran and Marko take you to a club in Debar Maalo. Listen to the conversation; you don't need to understand it yet.
    pt: Sexta. O Goran e o Marko levam você a uma balada no Debar Maalo. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: goran
    text: Ајде во клуб! Сега почнува.
    meaning:
      en: Let's go to a club! It's starting now.
      pt: Bora para a balada! Está começando agora.
  - speaker: protagonist
    text: Сега? Полноќ е!
    meaning:
      en: Now? It's midnight!
      pt: Agora? É meia-noite!
  - speaker: goran
    text: Тука излегуваме доцна. Кафулињата работат до еден.
    meaning:
      en: Here we go out late. The cafés are open until one.
      pt: Aqui a gente sai tarde. Os cafés ficam abertos até uma.
  - speaker: protagonist
    text: Музиката е многу гласна!
    meaning:
      en: The music is very loud!
      pt: A música está muito alta!
  - speaker: goran
    text: Што? Не те слушам!
    meaning:
      en: What? I can't hear you!
      pt: O quê? Não estou te ouvindo!
  - speaker: protagonist
    text: Ајде да танцуваме!
    meaning:
      en: Let's dance!
      pt: Vamos dançar!
  - speaker: marko
    text: Јас не танцувам.
    meaning:
      en: I don't dance.
      pt: Eu não danço.
  - speaker: protagonist
    text: Марко, дали си бил некогаш на бразилска забава?
    meaning:
      en: Marko, have you ever been to a Brazilian party?
      pt: Marko, você já foi a uma festa brasileira?
  - speaker: marko
    text: Не сум бил. Добро, само една песна!
    meaning:
      en: I haven't. All right, just one song!
      pt: Nunca fui. Tá bom, só uma música!
