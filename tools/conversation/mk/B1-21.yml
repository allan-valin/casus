steps:
- type: narrator
  text:
    en: Sunday at the Museum of Contemporary Art, on the hill above the Old Bazaar, with Bojan. Listen to the conversation; you don't need to understand it yet.
    pt: Domingo no Museu de Arte Contemporânea, no morro acima do Velho Bazar, com o Bojan. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: bojan
    text: Музејот е подарок од целиот свет. Уметници подарија дела по земјотресот.
    meaning:
      en: The museum is a gift from the whole world. Artists donated works after the earthquake.
      pt: O museu é um presente do mundo inteiro. Artistas doaram obras depois do terremoto.
  - speaker: protagonist
    text: Дури и Пикасо?
    meaning:
      en: Even Picasso?
      pt: Até o Picasso?
  - speaker: bojan
    text: Да, тука е една негова слика.
    meaning:
      en: Yes, there's one of his paintings here.
      pt: Sim, tem um quadro dele aqui.
  - speaker: protagonist
    text: Оваа слика ме потсетува на морето. Боите се како во Бразил.
    meaning:
      en: This painting reminds me of the sea. The colours are like in Brazil.
      pt: Este quadro me lembra o mar. As cores são como no Brasil.
  - speaker: bojan
    text: Јас ништо не разбирам од модерна уметност.
    meaning:
      en: I don't understand anything about modern art.
      pt: Eu não entendo nada de arte moderna.
  - speaker: protagonist
    text: Не мора да разбираш. Важно е чувството.
    meaning:
      en: You don't have to understand. The feeling is what matters.
      pt: Não precisa entender. O que importa é o sentimento.
  - speaker: bojan
    text: Значи, гледањето е поважно од разбирањето?
    meaning:
      en: So looking matters more than understanding?
      pt: Então olhar é mais importante que entender?
  - speaker: protagonist
    text: Точно!
    meaning:
      en: Exactly!
      pt: Exatamente!
