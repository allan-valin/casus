steps:
- type: narrator
  text:
    en: Marko is filling in the office birthday calendar. Listen to the conversation; you don't need to understand it yet.
    pt: O Marko está preenchendo o calendário de aniversários do escritório. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Кога ти е роденден?
    meaning:
      en: When is your birthday?
      pt: Quando é o seu aniversário?
  - speaker: protagonist
    text: На петнаесетти март.
    meaning:
      en: On the fifteenth of March.
      pt: Dia quinze de março.
  - speaker: marko
    text: Петнаесетти март... веќе помина!
    meaning:
      en: The fifteenth of March... it's already passed!
      pt: Quinze de março... já passou!
  - speaker: protagonist
    text: Да, беше пред два месеци. А твој?
    meaning:
      en: Yes, it was two months ago. And yours?
      pt: É, foi há dois meses. E o seu?
  - speaker: marko
    text: Мојот е на први мај.
    meaning:
      en: Mine is on the first of May.
      pt: O meu é dia primeiro de maio.
  - speaker: protagonist
    text: Први мај, празник! Сите се одмораат.
    meaning:
      en: The first of May, a holiday! Everyone has the day off.
      pt: Primeiro de maio, feriado! Todo mundo de folga.
  - speaker: marko
    text: Да, мојот роденден е секогаш слободен ден.
    meaning:
      en: Yes, my birthday is always a day off.
      pt: É, meu aniversário é sempre folga.
  - speaker: protagonist
    text: Тогаш ќе славиме двајцата — следната година, на мојот, ти ќе работиш!
    meaning:
      en: Then we'll celebrate both — next year, on mine, you'll be working!
      pt: Então vamos comemorar os dois — ano que vem, no meu, você vai trabalhar!
- type: prompt
  ask:
