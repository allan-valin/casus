    text: Кога ти е роденден?
  items:
  - koga-ti-e
  - rodenden
- type: narrator
  text:
    en: 'Dates use ordinal numbers: први (first), втори (second), трети (third), and from five on add -ти: петти, десетти, петнаесетти.'
    pt: 'Datas usam números ordinais: први (primeiro), втори (segundo), трети (terceiro), e a partir do cinco acrescenta-se -ти: петти, десетти, петнаесетти.'
- type: narrator
