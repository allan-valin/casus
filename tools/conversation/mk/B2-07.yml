steps:
- type: narrator
  text:
    en: Vardar Soft. Mr Nikolovski introduces the team; Darko shows you around. Listen to the conversation; you don't need to understand it yet.
    pt: Vardar Soft. O senhor Nikolovski apresenta a equipe; o Darko mostra o lugar. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: nikolovski
    text: Ова е тимот. Дарко е раководител на проектот.
    meaning:
      en: This is the team. Darko is the project lead.
      pt: Esta é a equipe. O Darko é o gerente do projeto.
  - speaker: darko
    text: Добредојде! Проектот го водам јас, но сите одлучуваме заедно.
    meaning:
      en: Welcome! I lead the project, but we all decide together.
      pt: Bem-vinda! O projeto quem coordena sou eu, mas todo mundo decide junto.
  - speaker: protagonist
    text: Мило ми е. Каде ми е местото?
    meaning:
      en: Nice to meet you. Where's my place?
      pt: Prazer. Onde fica o meu lugar?
  - speaker: darko
    text: Тука, во оваа канцеларија. А кујничката е лево.
    meaning:
      en: Here, in this office. And the little kitchen is on the left.
      pt: Aqui, nesta sala. E a copa é à esquerda.
  - speaker: protagonist
    text: Лозинката за компјутерот?
    meaning:
      en: The password for the computer?
      pt: A senha do computador?
  - speaker: darko
    text: Лозинката ти ја пратив на мејл.
    meaning:
      en: I sent you the password by e-mail.
      pt: A senha eu te mandei por e-mail.
  - speaker: protagonist
    text: Ја добив, благодарам.
    meaning:
      en: I got it, thanks.
      pt: Recebi, obrigada.
  - speaker: darko
    text: Ако нешто ти треба, прашај ме било кога.
    meaning:
      en: If you need anything, ask me any time.
      pt: Se precisar de alguma coisa, me pergunta a qualquer hora.
