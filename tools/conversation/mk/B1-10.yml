steps:
- type: narrator
  text:
    en: What do you give at a Macedonian wedding? You ask Mrs Stojanovska. Listen to the conversation; you don't need to understand it yet.
    pt: O que se dá num casamento macedônio? Você pergunta à senhora Stojanovska. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Што да им купам за свадбата?
    meaning:
      en: What should I buy them for the wedding?
      pt: O que eu compro para eles para o casamento?
  - speaker: vera
    text: Ништо не купувајте. Ставете пари во плик.
    meaning:
      en: Don't buy anything. Put money in an envelope.
      pt: Não compre nada. Coloque dinheiro num envelope.
  - speaker: protagonist
    text: Пари? Не е ли непристојно?
    meaning:
      en: Money? Isn't that rude?
      pt: Dinheiro? Não é deselegante?
  - speaker: vera
    text: Не, тоа е обичај. Секој дава плик, со честитка.
    meaning:
      en: No, it's the custom. Everyone gives an envelope, with a card.
      pt: Não, é o costume. Todo mundo dá um envelope, com um cartão.
  - speaker: protagonist
    text: Колку?
    meaning:
      en: How much?
      pt: Quanto?
  - speaker: vera
    text: Колку што можете. Најмалку колку што чини вечерата.
    meaning:
      en: As much as you can. At least what the dinner costs.
      pt: Quanto puder. Pelo menos o que custa o jantar.
  - speaker: protagonist
    text: Добро. Ќе напишам нешто убаво на честитката.
    meaning:
      en: All right. I'll write something nice on the card.
      pt: Está bem. Vou escrever alguma coisa bonita no cartão.
  - speaker: vera
    text: На македонски! Ќе ви помогнам.
    meaning:
      en: In Macedonian! I'll help you.
      pt: Em macedônio! Eu ajudo o senhor.
