steps:
- type: narrator
  text:
    en: The new flat needs a new bathroom. The builder promised two weeks. It's week five. Listen to the conversation; you don't need to understand it yet.
    pt: O apartamento novo precisa de banheiro novo. O pedreiro prometeu duas semanas. Já é a quinta. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Мајсторе, рокот одамна помина. Ветивте две недели.
    meaning:
      en: Master, the deadline passed long ago. You promised two weeks.
      pt: Mestre, o prazo passou faz tempo. O senhor prometeu duas semanas.
  - speaker: majstor
    text: Плочките не стигнаа од Италија. Има да се чека уште малку.
    meaning:
      en: The tiles haven't arrived from Italy. There'll be a bit more waiting.
      pt: Os azulejos não chegaram da Itália. Vai ter que esperar mais um pouco.
  - speaker: protagonist
    text: Колку малку?
    meaning:
      en: How little?
      pt: Quanto é pouco?
  - speaker: majstor
    text: Една недела. Збор на чест.
    meaning:
      en: One week. Word of honour.
      pt: Uma semana. Palavra de honra.
  - speaker: protagonist
    text: Авансот го платив. Остатокот — кога ќе завршите.
    meaning:
      en: I paid the advance. The rest — when you finish.
      pt: O adiantamento eu paguei. O restante — quando terminarem.
  - speaker: majstor
    text: Секако. И фактура ќе ви дадам.
    meaning:
      en: Of course. And I'll give you an invoice.
      pt: Claro. E vou dar nota fiscal.
  - speaker: protagonist
    text: Со фактура, ве молам. За гаранција.
    meaning:
      en: With an invoice, please. For the guarantee.
      pt: Com nota fiscal, por favor. Para a garantia.
  - speaker: majstor
    text: Има да биде најубавата бања во зградата!
    meaning:
      en: It's going to be the most beautiful bathroom in the building!
      pt: Vai ser o banheiro mais bonito do prédio!
