steps:
- type: narrator
  text:
    en: The old landlord kept your deposit. Your lawyer prepares you for court. Listen to the conversation; you don't need to understand it yet.
    pt: O antigo proprietário ficou com a sua caução. Seu advogado te prepara para o tribunal. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: advokat
    text: Тужбата е поднесена. Во четврток сте пред судот.
    meaning:
      en: The lawsuit is filed. On Thursday you're in court.
      pt: A ação foi protocolada. Na quinta a senhora vai ao tribunal.
  - speaker: protagonist
    text: Што да кажам пред судијата?
    meaning:
      en: What should I say before the judge?
      pt: O que eu digo diante do juiz?
  - speaker: advokat
    text: Ќе сведочите само факти, без емоции. Кога, колку, што пишува во договорот.
    meaning:
      en: You'll testify only facts, without emotion. When, how much, what the contract says.
      pt: A senhora vai depor só fatos, sem emoção. Quando, quanto, o que diz o contrato.
  - speaker: protagonist
    text: Доказите — договорот кај нотар и фотографиите од станот.
    meaning:
      en: The evidence — the notarised contract and the photos of the flat.
      pt: As provas — o contrato em cartório e as fotos do apartamento.
  - speaker: advokat
    text: Тоа е многу. Нотарскиот договор е во ваша корист.
    meaning:
      en: That's a lot. The notarised contract is in your favour.
      pt: Isso é muito. O contrato em cartório está a seu favor.
  - speaker: protagonist
    text: Значи, вредеше да се оди кај нотар.
    meaning:
      en: So it was worth going to a notary.
      pt: Então valeu a pena ir ao cartório.
  - speaker: advokat
    text: Секогаш вреди. Пресудата ја очекуваме за еден месец.
    meaning:
      en: It's always worth it. We expect the verdict within a month.
      pt: Sempre vale. A sentença a gente espera para daqui a um mês.
  - speaker: protagonist
    text: Во моја корист, се надевам.
    meaning:
      en: In my favour, I hope.
      pt: A meu favor, espero.
