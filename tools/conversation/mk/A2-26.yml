steps:
- type: narrator
  text:
    en: Elena, from the gym. You finally ask her out. Listen to the conversation; you don't need to understand it yet.
    pt: A Elena, da academia. Você finalmente chama ela para sair. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Елена, излегуваме ли во петок?
    meaning:
      en: Elena, shall we go out on Friday?
      pt: Elena, vamos sair na sexta?
  - speaker: elena
    text: Може. Каде?
    meaning:
      en: Sure. Where?
      pt: Pode ser. Onde?
  - speaker: protagonist
    text: На вечера, во Дебар Маало. Ќе дојдам по тебе во осум.
    meaning:
      en: To dinner, in Debar Maalo. I'll come and get you at eight.
      pt: Para jantar, no Debar Maalo. Passo para te buscar às oito.
  - speaker: elena
    text: Супер.
    meaning:
      en: Great.
      pt: Ótimo.
  - speaker: protagonist
    text: Ми се допаѓаш, Елена.
    meaning:
      en: I like you, Elena.
      pt: Gosto de você, Elena.
  - speaker: elena
    text: И ти мене.
    meaning:
      en: I like you too.
      pt: Eu também gosto de você.
  - speaker: elena
    text: Ајде да делиме сметката.
    meaning:
      en: Let's split the bill.
      pt: Vamos dividir a conta.
  - speaker: protagonist
    text: Не, тебе те поканив, јас плаќам.
    meaning:
      en: No, I invited you, I'm paying.
      pt: Não, eu te convidei, eu pago.
  - speaker: elena
    text: Добро. Следниот пат јас.
    meaning:
      en: All right. Next time it's me.
      pt: Tá bom. Da próxima vez sou eu.
