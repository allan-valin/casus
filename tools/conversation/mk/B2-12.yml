- type: narrator
  text:
    en: 'Big lotteries often have odds of one in several million per ticket — far worse than ''one in a million''. Being struck by lightning in a lifetime is far likelier. A ''70 % chance of rain'' means:
      on days like this, it rained seven times out of ten.'
    pt: 'Loterias grandes costumam ter chance de uma em vários milhões por bilhete — muito pior que ''uma em um milhão''. Ser atingido por raio na vida é bem mais provável. ''70 % de chance de chuva'' quer
      dizer: em dias assim, choveu sete vezes em dez.'
