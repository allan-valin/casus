steps:
- type: narrator
  text:
    en: Darko buys a lottery ticket every week. You do the maths. Listen to the conversation; you don't need to understand it yet.
    pt: O Darko compra bilhete de loteria toda semana. Você faz as contas. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: darko
    text: Купив лото. Да добијам, ќе одам на Малдиви!
    meaning:
      en: I bought a lottery ticket. If only I win, I'm off to the Maldives!
      pt: Comprei loteria. Tomara que eu ganhe, vou para as Maldivas!
  - speaker: protagonist
    text: Знаеш колкава е веројатноста?
    meaning:
      en: Do you know what the probability is?
      pt: Você sabe qual é a probabilidade?
  - speaker: darko
    text: Една во милион?
    meaning:
      en: One in a million?
      pt: Uma em um milhão?
  - speaker: protagonist
    text: Помала! Поголема шанса имаш да те удри гром.
    meaning:
      en: Smaller! You have a bigger chance of being struck by lightning.
      pt: Menor! Você tem mais chance de ser atingido por um raio.
  - speaker: darko
    text: Тогаш да не излегувам кога врне.
    meaning:
      en: Then I'd better not go out when it rains.
      pt: Então é melhor não sair quando chover.
  - speaker: protagonist
    text: Прогнозата вели седумдесет проценти дожд за утре.
    meaning:
      en: The forecast says seventy per cent rain for tomorrow.
      pt: A previsão diz setenta por cento de chuva amanhã.
  - speaker: darko
    text: Да не врне! Утре е викенд.
    meaning:
      en: Hopefully it won't rain! Tomorrow's the weekend.
      pt: Tomara que não chova! Amanhã é fim de semana.
  - speaker: protagonist
    text: Седумдесет проценти — ти би купил чадор или лото?
    meaning:
      en: Seventy per cent — would you buy an umbrella or a lottery ticket?
      pt: Setenta por cento — você compraria guarda-chuva ou loteria?
