steps:
- type: narrator
  text:
    en: No hot water. You tell Mrs Stojanovska; she calls the repairman. Listen to the conversation; you don't need to understand it yet.
    pt: Não tem água quente. Você avisa a senhora Stojanovska; ela chama o técnico. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Госпоѓо Стојановска, бојлерот не работи. Нема топла вода!
    meaning:
      en: Mrs Stojanovska, the water heater isn't working. There's no hot water!
      pt: Senhora Stojanovska, o aquecedor não funciona. Não tem água quente!
  - speaker: vera
    text: Пак? Ќе го викнам мајсторот.
    meaning:
      en: Again? I'll call the repairman.
      pt: De novo? Vou chamar o técnico.
  - speaker: majstor
    text: Добар ден. Каде е бојлерот?
    meaning:
      en: Good afternoon. Where's the water heater?
      pt: Boa tarde. Onde está o aquecedor?
  - speaker: protagonist
    text: Во бањата. Можете ли да го поправите денеска?
    meaning:
      en: In the bathroom. Can you fix it today?
      pt: No banheiro. O senhor pode consertar hoje?
  - speaker: majstor
    text: Можам, но треба нов дел.
    meaning:
      en: I can, but it needs a new part.
      pt: Posso, mas precisa de uma peça nova.
  - speaker: protagonist
    text: Колку време?
    meaning:
      en: How long?
      pt: Quanto tempo?
  - speaker: majstor
    text: Еден час.
    meaning:
      en: One hour.
      pt: Uma hora.
  - speaker: protagonist
    text: Одлично. Сакате ли кафе?
    meaning:
      en: Excellent. Would you like a coffee?
      pt: Ótimo. O senhor quer um café?
  - speaker: majstor
    text: Може, без шеќер.
    meaning:
      en: Sure, no sugar.
      pt: Pode ser, sem açúcar.
- type: narrator
  text:
    en: Most flats heat water in a бојлер, an electric tank in the bathroom. Switch it on some time before your shower.
    pt: A maioria dos apartamentos esquenta a água num бојлер, um tanque elétrico no banheiro. Ligue um tempo antes do banho.
