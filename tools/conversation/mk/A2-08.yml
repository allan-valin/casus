steps:
- type: narrator
  text:
    en: It's Mrs Stojanovska's name day. The door is open and the flat is full. Listen to the conversation; you don't need to understand it yet.
    pt: É o dia do santo da senhora Stojanovska. A porta está aberta e o apartamento está cheio. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Честит именден, госпоѓо Стојановска!
    meaning:
      en: Happy name day, Mrs Stojanovska!
      pt: Feliz dia do santo, senhora Stojanovska!
  - speaker: vera
    text: Благодарам! Влезете, влезете!
    meaning:
      en: Thank you! Come in, come in!
      pt: Obrigada! Entre, entre!
  - speaker: protagonist
    text: Ова е за вас.
    meaning:
      en: This is for you.
      pt: Isto é para a senhora.
  - speaker: vera
    text: Ох, не требаше! Цвеќе — и пет! Браво.
    meaning:
      en: Oh, you shouldn't have! Flowers — and five! Well done.
      pt: Ah, não precisava! Flores — e cinco! Muito bem.
  - speaker: protagonist
    text: Научив.
    meaning:
      en: I learned.
      pt: Aprendi.
  - speaker: vera
    text: Седнете, има торта. Ќерка ми ја направи.
    meaning:
      en: Sit down, there's cake. My daughter made it.
      pt: Sente-se, tem torta. Minha filha que fez.
  - speaker: protagonist
    text: Колку гости!
    meaning:
      en: So many guests!
      pt: Quanta visita!
  - speaker: vera
    text: На именден сите доаѓаат без покана. Ова е внук ми.
    meaning:
      en: On a name day everyone comes without an invitation. This is my grandson.
      pt: No dia do santo todo mundo vem sem convite. Este é o meu neto.
- type: narrator
  text:
    en: A name day is the feast of the saint you're named after. Vera's is the feast of Saints Faith, Hope and Love (Вера, Надежда, Љубов), at the end of September. Older people often celebrate it more
      than their birthday.
    pt: O dia do santo é a festa do santo cujo nome você tem. O da Vera é a festa das santas Fé, Esperança e Amor (Вера, Надежда, Љубов), no fim de setembro. Os mais velhos muitas vezes comemoram mais do
      que o aniversário.
