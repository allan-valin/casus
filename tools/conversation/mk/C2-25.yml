steps:
- type: narrator
  text:
    en: A new young colleague wrote 'Ej, што има?' to a client. You show her the difference. Listen to the conversation; you don't need to understand it yet.
    pt: Uma colega nova escreveu 'Ej, што има?' para um cliente. Você mostra a diferença. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: kolegicka
    text: 'Му пишав на клиентот: „Еј, што има?“ Не одговара.'
    meaning:
      en: 'I wrote to the client: ''Hey, what''s up?'' He''s not answering.'
      pt: 'Escrevi para o cliente: ''E aí, beleza?'' Ele não responde.'
  - speaker: protagonist
    text: Тоа е неформално. Со клиент не доликува.
    meaning:
      en: That's informal. With a client it isn't appropriate.
      pt: Isso é informal. Com cliente não fica bem.
  - speaker: kolegicka
    text: А како?
    meaning:
      en: So how?
      pt: E como?
  - speaker: protagonist
    text: 'Формално: „Почитуван господине…“ И прво „Вие“, додека не понуди „ти“.'
    meaning:
      en: 'Formally: ''Dear Sir…'' And first ''Вие'', until he offers ''ти''.'
      pt: 'Formal: ''Prezado senhor…'' E primeiro ''Вие'', até ele oferecer ''ти''.'
  - speaker: kolegicka
    text: Се срамам...
    meaning:
      en: I'm embarrassed...
      pt: Que vergonha...
  - speaker: protagonist
    text: Не ти се лутам. Сите почнавме така. И јас викав „ти“ на госпоѓа Стојановска.
    meaning:
      en: I'm not angry with you. We all started like that. I too said 'ти' to Mrs Stojanovska.
      pt: Não estou brava com você. Todo mundo começou assim. Eu também chamei a senhora Stojanovska de 'ти'.
  - speaker: kolegicka
    text: Ќе преформулирам.
    meaning:
      en: I'll rephrase it.
      pt: Vou reformular.
  - speaker: protagonist
    text: Преформулирај — ќе звучи подобро. И додај „Со почит“.
    meaning:
      en: Rephrase — it'll sound better. And add 'Со почит'.
      pt: Reformula — vai soar melhor. E acrescenta 'Со почит'.
