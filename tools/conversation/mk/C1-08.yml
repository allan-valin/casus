steps:
- type: narrator
  text:
    en: A used-car market on a Sunday morning. Marko comes as your expert. Listen to the conversation; you don't need to understand it yet.
    pt: Uma feira de carros usados num domingo de manhã. O Marko vai como seu especialista. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: klient
    text: Колата е одлична. Само сто илјади километри.
    meaning:
      en: The car is excellent. Only a hundred thousand kilometres.
      pt: O carro é ótimo. Só cem mil quilômetros.
  - speaker: protagonist
    text: Кој ја возел?
    meaning:
      en: Who drove it?
      pt: Quem dirigia?
  - speaker: klient
    text: Една пензионерка. Возела само до пазар и назад.
    meaning:
      en: A pensioner. She only drove to the market and back.
      pt: Uma aposentada. Só ia até a feira e voltava.
  - speaker: marko
    text: Не верувај. Сите така велат.
    meaning:
      en: Don't believe it. They all say that.
      pt: Não acredita. Todos dizem isso.
  - speaker: protagonist
    text: Може проверка кај механичар?
    meaning:
      en: Can we have it checked at a mechanic's?
      pt: Dá para fazer uma revisão num mecânico?
  - speaker: klient
    text: Може, може. Папирите се во ред.
    meaning:
      en: Sure, sure. The papers are in order.
      pt: Pode, pode. Os documentos estão em ordem.
  - speaker: marko
    text: Механичарот вели дека моторот бил менуван. Значи, повеќе од сто илјади.
    meaning:
      en: The mechanic says the engine was replaced. So, more than a hundred thousand.
      pt: O mecânico diz que o motor foi trocado. Então, mais de cem mil.
  - speaker: protagonist
    text: Пензионерката возела многу на пазар!
    meaning:
      en: The pensioner drove to market a lot, apparently!
      pt: A aposentada foi muito à feira, pelo visto!
