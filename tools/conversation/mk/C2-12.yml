steps:
- type: narrator
  text:
    en: Elena wants to open a bakery with her husband. She asks you to check the business plan. Listen to the conversation; you don't need to understand it yet.
    pt: A Elena quer abrir uma padaria com o marido. Ela pede para você revisar o plano de negócios. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: elena
    text: Ова е бизнис планот за пекарата. Би можел ли да го погледнеш?
    meaning:
      en: This is the business plan for the bakery. Could you look at it?
      pt: Este é o plano de negócios da padaria. Você poderia dar uma olhada?
  - speaker: protagonist
    text: Секако. Трошоците ги имаш — ама приходите се многу оптимистички.
    meaning:
      en: Of course. You have the costs — but the income is very optimistic.
      pt: Claro. Os custos você tem — mas a receita está muito otimista.
  - speaker: elena
    text: Во Карпош нема пекара. Луѓето ќе дојдат.
    meaning:
      en: There's no bakery in Karpoš. People will come.
      pt: Em Karpoš não tem padaria. As pessoas vão vir.
  - speaker: protagonist
    text: Можеби. Но ризикот е голем. Ајде да ги пресметаме трите месеци без ниту една муштерија.
    meaning:
      en: Maybe. But the risk is big. Let's calculate three months without a single customer.
      pt: Talvez. Mas o risco é grande. Vamos calcular três meses sem nenhum cliente.
  - speaker: elena
    text: Тогаш кредитот е проблем.
    meaning:
      en: Then the loan is a problem.
      pt: Aí o empréstimo é um problema.
  - speaker: protagonist
    text: Семејна фирма — и роднините ќе помогнат, нели?
    meaning:
      en: A family firm — and the relatives will help, right?
      pt: Empresa familiar — e os parentes vão ajudar, né?
  - speaker: elena
    text: Мајка ми ќе меси, татко ми ќе продава.
    meaning:
      en: My mother will knead, my father will sell.
      pt: Minha mãe vai sovar, meu pai vai vender.
  - speaker: protagonist
    text: Тогаш ќе се исплати. Само почни мало.
    meaning:
      en: Then it'll pay off. Just start small.
      pt: Então vai compensar. Só começa pequeno.
