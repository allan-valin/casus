steps:
- type: narrator
  text:
    en: Evening news at Vera's. Elections are coming. Listen to the conversation; you don't need to understand it yet.
    pt: Telejornal na casa da Vera. As eleições estão chegando. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Слушај ги вестите. Премиерот ветил повисоки плати.
    meaning:
      en: Listen to the news. The prime minister has promised higher salaries, they say.
      pt: Escuta o noticiário. O primeiro-ministro teria prometido salários mais altos.
  - speaker: protagonist
    text: А опозицијата?
    meaning:
      en: And the opposition?
      pt: E a oposição?
  - speaker: vera
    text: Опозицијата вели дека тоа не е вистина.
    meaning:
      en: The opposition says it isn't true.
      pt: A oposição diz que não é verdade.
  - speaker: protagonist
    text: Пред избори секогаш е така.
    meaning:
      en: Before elections it's always like that.
      pt: Antes das eleições é sempre assim.
  - speaker: vera
    text: Кај вас исто?
    meaning:
      en: The same where you're from?
      pt: Lá com vocês também?
  - speaker: protagonist
    text: Исто! А ти, за кого гласаш?
    meaning:
      en: The same! And you, who do you vote for?
      pt: Igualzinho! E você, em quem vota?
  - speaker: vera
    text: Тоа е тајна. А ти и онака не можеш да гласаш!
    meaning:
      en: That's a secret. And you can't vote anyway!
      pt: Isso é segredo. E você nem pode votar mesmo!
  - speaker: protagonist
    text: Во право си. Само гледам.
    meaning:
      en: You're right. I'm just watching.
      pt: Tem razão. Só estou assistindo.
