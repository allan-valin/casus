steps:
- type: narrator
  text:
    en: Walking across the main square, Ana asks what you honestly think of the centre. Listen to the conversation; you don't need to understand it yet.
    pt: Atravessando a praça principal, a Ana pergunta o que você acha de verdade do centro. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Што мислиш за центарот, искрено?
    meaning:
      en: What do you think of the centre, honestly?
      pt: O que você acha do centro, sinceramente?
  - speaker: protagonist
    text: Според мене, чуден е. Многу статуи!
    meaning:
      en: In my opinion it's strange. So many statues!
      pt: Na minha opinião, é estranho. Muita estátua!
  - speaker: ana
    text: Сите странци го велат тоа. Тоа е „Скопје 2014“.
    meaning:
      en: All foreigners say that. That's 'Skopje 2014'.
      pt: Todo estrangeiro diz isso. É o 'Skopje 2014'.
  - speaker: protagonist
    text: А тебе ти се допаѓа?
    meaning:
      en: And do you like it?
      pt: E você, gosta?
  - speaker: ana
    text: Не баш. Мајка ми вели дека е кич. Татко ми вели дека е убаво.
    meaning:
      en: Not really. My mother says it's kitsch. My father says it's beautiful.
      pt: Não muito. Minha mãe diz que é brega. Meu pai diz que é bonito.
  - speaker: protagonist
    text: А јас мислам дека луѓето се најубавото нешто во Скопје.
    meaning:
      en: And I think the people are the best thing in Skopje.
      pt: E eu acho que as pessoas são a melhor coisa de Skopje.
  - speaker: ana
    text: Убаво кажано!
    meaning:
      en: Nicely put!
      pt: Bem dito!
  - speaker: protagonist
    text: Искрено!
    meaning:
      en: Honestly!
      pt: Sinceramente!
