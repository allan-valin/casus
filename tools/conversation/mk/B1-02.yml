- type: narrator
  text:
    en: Between 2010 and 2014 the government covered the centre with neoclassical façades and statues — 'Skopje 2014'. It still divides people, so ask before you joke. In general, people here tell you their
      opinion directly — about the city, and about your haircut.
    pt: Entre 2010 e 2014 o governo cobriu o centro com fachadas neoclássicas e estátuas — o 'Skopje 2014'. Ainda divide opiniões, então pergunte antes de fazer piada. Em geral, as pessoas daqui dizem o
      que pensam diretamente — sobre a cidade, e sobre o seu corte de cabelo.
