steps:
- type: narrator
  text:
    en: A long weekend in Ohrid with Ana. Three hours by bus, then the hotel. Listen to the conversation; you don't need to understand it yet.
    pt: Um feriadão em Ohrid com a Ana. Três horas de ônibus, depois o hotel. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Стигнавме! Три часа со автобус.
    meaning:
      en: We're here! Three hours by bus.
      pt: Chegamos! Três horas de ônibus.
  - speaker: protagonist
    text: Добар ден. Имаме резервација, соба за двајца.
    meaning:
      en: Good afternoon. We have a reservation, a double room.
      pt: Boa tarde. Temos uma reserva, quarto para dois.
  - speaker: sluzbenicka
    text: На кое име?
    meaning:
      en: In what name?
      pt: Em nome de quem?
  - speaker: ana
    text: Ана Николовска.
    meaning:
      en: Ana Nikolovska.
      pt: Ana Nikolovska.
  - speaker: sluzbenicka
    text: Да. Соба со поглед на езерото.
    meaning:
      en: Yes. A room with a view of the lake.
      pt: Sim. Quarto com vista para o lago.
  - speaker: protagonist
    text: Во колку часот е појадокот?
    meaning:
      en: What time is breakfast?
      pt: A que horas é o café da manhã?
  - speaker: sluzbenicka
    text: Од седум до десет.
    meaning:
      en: From seven to ten.
      pt: Das sete às dez.
  - speaker: ana
    text: Каде можеме да пливаме?
    meaning:
      en: Where can we swim?
      pt: Onde a gente pode nadar?
  - speaker: sluzbenicka
    text: Плажата е на пет минути пешки. Пријатен престој!
    meaning:
      en: The beach is five minutes on foot. Enjoy your stay!
      pt: A praia fica a cinco minutos a pé. Boa estadia!
