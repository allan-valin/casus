steps:
- type: narrator
  text:
    en: Your first meeting in Macedonian. It was meant to take thirty minutes. Listen to the conversation; you don't need to understand it yet.
    pt: Sua primeira reunião em macedônio. Era para durar trinta minutos. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: darko
    text: 'Дневен ред: прва точка — новата апликација.'
    meaning:
      en: 'Agenda: item one — the new app.'
      pt: 'Pauta: primeiro item — o aplicativo novo.'
  - speaker: protagonist
    text: Предлагам прво да ги видиме грешките.
    meaning:
      en: I propose we look at the bugs first.
      pt: Proponho que a gente veja os erros primeiro.
  - speaker: nikolovski
    text: Нека каже Ана што мисли.
    meaning:
      en: Let Ana say what she thinks.
      pt: Que a Ana diga o que acha.
  - speaker: ana
    text: Согласна сум. Нека ги видиме грешките.
    meaning:
      en: I agree. Let's look at the bugs.
      pt: Concordo. Vamos ver os erros.
  - speaker: darko
    text: Јас не се согласувам. Прво дизајнот.
    meaning:
      en: I don't agree. Design first.
      pt: Eu não concordo. Primeiro o design.
  - speaker: protagonist
    text: Можеме и двете, но времето истече.
    meaning:
      en: We can do both, but time is up.
      pt: Dá para fazer os dois, mas o tempo acabou.
  - speaker: nikolovski
    text: 'Добро, заклучок: нека продолжиме утре.'
    meaning:
      en: 'All right, conclusion: let''s continue tomorrow.'
      pt: 'Certo, conclusão: vamos continuar amanhã.'
  - speaker: protagonist
    text: Состанокот траеше два часа...
    meaning:
      en: The meeting lasted two hours...
      pt: A reunião durou duas horas...
