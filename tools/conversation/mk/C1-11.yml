steps:
- type: narrator
  text:
    en: Vera's brother has died. You visit her with Bojan. Listen to the conversation; you don't need to understand it yet.
    pt: O irmão da Vera morreu. Você visita ela com o Bojan. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Вера... искрено сочувство. Бог да го прости.
    meaning:
      en: Vera... my sincere condolences. May God rest his soul.
      pt: Vera... meus sinceros pêsames. Que Deus o tenha.
  - speaker: vera
    text: Благодарам, душо. Да сте живи вие.
    meaning:
      en: Thank you, dear. May you live.
      pt: Obrigada, querida. Que vocês tenham vida.
  - speaker: bojan
    text: Кога почина?
    meaning:
      en: When did he pass away?
      pt: Quando ele faleceu?
  - speaker: vera
    text: Во вторник. Ех, беше постар од мене само две години...
    meaning:
      en: On Tuesday. Ah, he was only two years older than me...
      pt: Na terça. Ai, ele era só dois anos mais velho que eu...
  - speaker: protagonist
    text: Знам колку ве боли.
    meaning:
      en: I know how much it hurts.
      pt: Sei o quanto dói.
  - speaker: vera
    text: На четириесетница ќе има панихида. Ќе дојдете?
    meaning:
      en: At the forty-day memorial there'll be a service. Will you come?
      pt: Na missa de quarenta dias vai ter culto. Vocês vêm?
  - speaker: bojan
    text: Секако. Ќе донесеме нешто.
    meaning:
      en: Of course. We'll bring something.
      pt: Claro. A gente leva alguma coisa.
  - speaker: vera
    text: Жито ќе правам јас. Само дојдете.
    meaning:
      en: I'll make the wheat. Just come.
      pt: O trigo eu faço. Só venham.
  - speaker: protagonist
    text: Ако ви треба нешто — било што — кажете ни.
    meaning:
      en: If you need anything — anything — tell us.
      pt: Se precisar de alguma coisa — qualquer coisa — fale com a gente.
