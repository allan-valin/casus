steps:
- type: narrator
  text:
    en: The church, then the hall. Ana sits next to you and explains. Listen to the conversation; you don't need to understand it yet.
    pt: A igreja, depois o salão. A Ana senta do seu lado e explica. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Погледни ја невестата. Колку е убава!
    meaning:
      en: Look at the bride. How beautiful she is!
      pt: Olha a noiva. Como ela está linda!
  - speaker: protagonist
    text: А младоженецот е нервозен.
    meaning:
      en: And the groom is nervous.
      pt: E o noivo está nervoso.
  - speaker: ana
    text: Венчавката е во црква. Над нивните глави се држат круни.
    meaning:
      en: The ceremony is in church. Crowns are held over their heads.
      pt: A cerimônia é na igreja. Seguram coroas sobre a cabeça deles.
  - speaker: protagonist
    text: Круни? Зошто?
    meaning:
      en: Crowns? Why?
      pt: Coroas? Por quê?
  - speaker: ana
    text: Тие се цар и царица на своето семејство.
    meaning:
      en: They're king and queen of their own family.
      pt: Eles são rei e rainha da própria família.
  - speaker: protagonist
    text: А сега? Одат околу масата.
    meaning:
      en: And now? They're walking around the table.
      pt: E agora? Estão andando em volta da mesa.
  - speaker: ana
    text: Три пати. И кумот оди со нив.
    meaning:
      en: Three times. And the кум goes with them.
      pt: Três vezes. E o кум vai junto.
  - speaker: protagonist
    text: Прстенот е на десната рака!
    meaning:
      en: The ring is on the right hand!
      pt: A aliança está na mão direita!
  - speaker: ana
    text: Да, кај нас на десната.
    meaning:
      en: Yes, with us it's the right.
      pt: É, aqui é na direita.
