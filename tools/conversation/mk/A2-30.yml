steps:
- type: narrator
  text:
    en: Your birthday party, a year after you arrived. Everyone comes — and A2 comes back. Listen to the conversation; you don't need to understand it yet.
    pt: Sua festa de aniversário, um ano depois de chegar. Todo mundo vem — e o A2 volta. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Среќен роденден!
    meaning:
      en: Happy birthday!
      pt: Feliz aniversário!
  - speaker: ana
    text: Честит роденден! Една година во Скопје!
    meaning:
      en: Happy birthday! One year in Skopje!
      pt: Parabéns! Um ano em Skopje!
  - speaker: goran
    text: Слушајте, еден виц за Итар Пејо!
    meaning:
      en: Listen, a joke about Itar Pejo!
      pt: Escutem, uma piada do Itar Pejo!
  - speaker: marko
    text: Пак Итар Пејо...
    meaning:
      en: Itar Pejo again...
      pt: Itar Pejo de novo...
  - speaker: protagonist
    text: Кој е Итар Пејо?
    meaning:
      en: Who's Itar Pejo?
      pt: Quem é Itar Pejo?
  - speaker: goran
    text: Лукав селанец. Секогаш ги лаже богатите.
    meaning:
      en: A cunning villager. He always tricks the rich.
      pt: Um camponês malandro. Sempre engana os ricos.
  - speaker: protagonist
    text: Како нашиот Педро Маласартес!
    meaning:
      en: Like our Pedro Malasartes!
      pt: Como o nosso Pedro Malasartes!
  - speaker: vera
    text: Ајде, торта! Дувај ги свеќичките!
    meaning:
      en: Come on, cake! Blow out the candles!
      pt: Vamos, bolo! Assopra as velinhas!
