steps:
- type: narrator
  text:
    en: Ana shows you a shocking headline that everyone at the office is sharing. Listen to the conversation; you don't need to understand it yet.
    pt: A Ana mostra uma manchete chocante que todo mundo no escritório está compartilhando. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: 'Види го насловот: „Од утре без струја цела зима!“ Сите го споделуваат.'
    meaning:
      en: 'Look at the headline: ''No electricity all winter from tomorrow!'' Everyone''s sharing it.'
      pt: 'Olha a manchete: ''A partir de amanhã sem luz o inverno todo!'' Todo mundo está compartilhando.'
  - speaker: protagonist
    text: Каде пишува тоа? Кој е изворот?
    meaning:
      en: Where does it say that? What's the source?
      pt: Onde está escrito isso? Qual é a fonte?
  - speaker: ana
    text: Некој сајт. Не го знам.
    meaning:
      en: Some website. I don't know it.
      pt: Um site qualquer. Não conheço.
  - speaker: protagonist
    text: Непознат сајт, без автор, со многу извичници?
    meaning:
      en: An unknown site, no author, lots of exclamation marks?
      pt: Site desconhecido, sem autor, cheio de exclamação?
  - speaker: ana
    text: Значи, лажна вест?
    meaning:
      en: So, fake news?
      pt: Então, notícia falsa?
  - speaker: protagonist
    text: Провери на страницата на електродистрибуцијата.
    meaning:
      en: Check the electricity company's website.
      pt: Verifica no site da distribuidora de energia.
  - speaker: ana
    text: Ништо нема таму. Се претерало.
    meaning:
      en: Nothing there. It's been blown out of proportion.
      pt: Não tem nada lá. Exageraram.
  - speaker: protagonist
    text: Вистината е подосадна од насловите.
    meaning:
      en: The truth is more boring than the headlines.
      pt: A verdade é mais chata que as manchetes.
