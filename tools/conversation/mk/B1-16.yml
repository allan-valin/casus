steps:
- type: narrator
  text:
    en: Two years on the same staircase. Mrs Stojanovska has something to say. Listen to the conversation; you don't need to understand it yet.
    pt: Dois anos na mesma escada. A senhora Stojanovska tem uma coisa para dizer. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Слушајте... веќе две години сме соседи.
    meaning:
      en: Listen... we've been neighbours for two years now.
      pt: Escuta... já faz dois anos que somos vizinhos.
  - speaker: protagonist
    text: Да, две години. Брзо помина.
    meaning:
      en: Yes, two years. It went fast.
      pt: Sim, dois anos. Passou rápido.
  - speaker: vera
    text: Вие сте човек што секогаш ми помага. Ајде да си зборуваме на ти.
    meaning:
      en: You're someone who always helps me. Let's say ти to each other.
      pt: O senhor é uma pessoa que sempre me ajuda. Vamos nos tratar por ти.
  - speaker: protagonist
    text: Навистина? Тоа е чест за мене.
    meaning:
      en: Really? That's an honour for me.
      pt: Sério? É uma honra para mim.
  - speaker: vera
    text: Викај ме Вера. Не „госпоѓо Стојановска“.
    meaning:
      en: Call me Vera. Not 'Mrs Stojanovska'.
      pt: Me chama de Vera. Não 'senhora Stojanovska'.
  - speaker: protagonist
    text: Добро... Вера. Ќе ми треба време да се навикнам!
    meaning:
      en: All right... Vera. It'll take me time to get used to it!
      pt: Tá bom... Vera. Vou precisar de tempo para me acostumar!
  - speaker: vera
    text: И мене. Сакаш кафе?
    meaning:
      en: Me too. Do you want a coffee?
      pt: Eu também. Quer um café?
  - speaker: protagonist
    text: Секогаш!
    meaning:
      en: Always!
      pt: Sempre!
