steps:
- type: narrator
  text:
    en: Marko is carrying his bike up the stairs. You talk about what is whose. Listen to the conversation; you don't need to understand it yet.
    pt: O Marko está subindo a escada com a bicicleta. Vocês falam do que é de quem. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Здраво! Како си?
    meaning:
      en: Hi! How are you?
      pt: Oi! Tudo bem?
  - speaker: protagonist
    text: Добро сум. Ова е твојот велосипед?
    meaning:
      en: I'm fine. Is this your bike?
      pt: Tudo. Essa é a sua bicicleta?
  - speaker: marko
    text: Да, мојот велосипед. Ти имаш ли?
    meaning:
      en: Yes, my bike. Do you have one?
      pt: É, a minha bicicleta. Você tem?
  - speaker: protagonist
    text: Не, немам. Во Бразил имам кола.
    meaning:
      en: No, I don't. In Brazil I have a car.
      pt: Não. No Brasil eu tenho carro.
  - speaker: marko
    text: Мојата девојка има кола. Таа е таму.
    meaning:
      en: My girlfriend has a car. It's over there.
      pt: A minha namorada tem carro. Está ali.
  - speaker: protagonist
    text: Црвената? Убава е!
    meaning:
      en: The red one? It's nice!
      pt: O vermelho? É bonito!
  - speaker: marko
    text: Каде е твојот стан? На третиот кат?
    meaning:
      en: Where is your flat? On the third floor?
      pt: Onde é o seu apartamento? No terceiro andar?
  - speaker: protagonist
    text: Да, на третиот кат.
    meaning:
      en: Yes, on the third floor.
      pt: É, no terceiro andar.
  - speaker: marko
    text: Јас сум на вториот. Значи, ние сме соседи!
    meaning:
      en: I'm on the second. So we're neighbours!
      pt: Eu moro no segundo. Então somos vizinhos!
- type: narrator
  text:
    en: '''My'' and ''your'' take the word''s ''the'' ending: ''мојот велосипед'' (masculine, -от), ''мојата кола'' (feminine, -ата). You already met ''мојата маса'' at the office.'
    pt: '''Meu'' e ''seu'' levam a terminação do artigo da palavra: ''мојот велосипед'' (masculino, -от), ''мојата кола'' (feminino, -ата). Você já viu ''мојата маса'' no escritório.'
