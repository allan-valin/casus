steps:
- type: narrator
  text:
    en: Over coffee, Mrs Stojanovska talks about her childhood in a village near Bitola. Listen to the conversation; you don't need to understand it yet.
    pt: No café, a senhora Stojanovska conta da infância numa aldeia perto de Bitola. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Каде живеевте кога бевте мала?
    meaning:
      en: Where did you live when you were little?
      pt: Onde a senhora morava quando era pequena?
  - speaker: vera
    text: Во едно село кај Битола. Живеевме во стара куќа.
    meaning:
      en: In a village near Bitola. We lived in an old house.
      pt: Numa aldeia perto de Bitola. A gente morava numa casa velha.
  - speaker: protagonist
    text: Што правевте секое лето?
    meaning:
      en: What did you do every summer?
      pt: O que vocês faziam todo verão?
  - speaker: vera
    text: Секое лето одевме на Преспа. Пливавме во езерото.
    meaning:
      en: Every summer we went to Prespa. We swam in the lake.
      pt: Todo verão a gente ia para Prespa. Nadava no lago.
  - speaker: protagonist
    text: А зиме?
    meaning:
      en: And in winter?
      pt: E no inverno?
  - speaker: vera
    text: Зиме беше многу ладно. Немавме струја — читавме покрај печката.
    meaning:
      en: In winter it was very cold. We had no electricity — we read by the stove.
      pt: No inverno fazia muito frio. Não tinha luz — a gente lia perto do fogão.
  - speaker: protagonist
    text: Без струја!
    meaning:
      en: No electricity!
      pt: Sem luz!
  - speaker: vera
    text: Да, тогаш беше друго време.
    meaning:
      en: Yes, those were different times.
      pt: Pois é, naquela época era outro tempo.
- type: narrator
  text:
    en: 'A second past tense tells what used to happen, again and again: одевме (we used to go), живеевме (we lived). For one finished event you use the other past: отидовме (we went, once).'
    pt: 'Um segundo passado conta o que acontecia sempre: одевме (a gente ia), живеевме (a gente morava). Para um fato único e terminado usa-se o outro passado: отидовме (fomos, uma vez).'
