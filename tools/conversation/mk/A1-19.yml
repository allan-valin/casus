steps:
- type: narrator
  text:
    en: Saturday at Bit Pazar, the big market, with Marko. Listen to the conversation; you don't need to understand it yet.
    pt: Sábado no Bit Pazar, a grande feira, com o Marko. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Ова е Бит Пазар. Тука сѐ е евтино.
    meaning:
      en: This is Bit Pazar. Everything is cheap here.
      pt: Isto é o Bit Pazar. Aqui tudo é barato.
  - speaker: protagonist
    text: Добар ден. Колку чинат доматите?
    meaning:
      en: Hello. How much are the tomatoes?
      pt: Bom dia. Quanto custam os tomates?
  - speaker: seller
    text: Шеесет денари килото.
    meaning:
      en: Sixty denars a kilo.
      pt: Sessenta dinares o quilo.
  - speaker: protagonist
    text: Скапо е! Педесет?
    meaning:
      en: That's expensive! Fifty?
      pt: Está caro! Cinquenta?
  - speaker: seller
    text: Добро, педесет. Колку кила?
    meaning:
      en: All right, fifty. How many kilos?
      pt: Está bem, cinquenta. Quantos quilos?
  - speaker: protagonist
    text: Две кила домати и едно кило пиперки.
    meaning:
      en: Two kilos of tomatoes and one kilo of peppers.
      pt: Dois quilos de tomate e um quilo de pimentão.
  - speaker: seller
    text: Пиперките се убави, од Струмица.
    meaning:
      en: The peppers are lovely, from Strumica.
      pt: Os pimentões são ótimos, de Strumica.
  - speaker: marko
    text: Браво! Добро се пазариш!
    meaning:
      en: Well done! You bargain well!
      pt: Muito bem! Você sabe pechinchar!
- type: narrator
  text:
    en: 'Plural: most words take -и: домат → домати, пиперка → пиперки. With ''the'': доматите, пиперките.'
    pt: 'Plural: a maioria das palavras leva -и: домат → домати, пиперка → пиперки. Com artigo: доматите (os tomates), пиперките.'
