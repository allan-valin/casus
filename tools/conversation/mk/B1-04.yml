steps:
- type: narrator
  text:
    en: Marko has tickets for Vardar's match tomorrow. Listen to the conversation; you don't need to understand it yet.
    pt: O Marko tem ingressos para o jogo do Vardar amanhã. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Утре е натпревар, Вардар против Шкупи. Доаѓаш?
    meaning:
      en: Tomorrow there's a match, Vardar against Shkupi. Are you coming?
      pt: Amanhã tem jogo, Vardar contra Shkupi. Você vem?
  - speaker: protagonist
    text: Може! За кого навиваш?
    meaning:
      en: Sure! Who do you support?
      pt: Claro! Para quem você torce?
  - speaker: marko
    text: За Вардар, секако. Цело семејство навива за Вардар.
    meaning:
      en: Vardar, of course. The whole family supports Vardar.
      pt: Vardar, claro. A família inteira torce para o Vardar.
  - speaker: protagonist
    text: Ако победат, ќе славиме?
    meaning:
      en: If they win, will we celebrate?
      pt: Se ganharem, a gente comemora?
  - speaker: marko
    text: Ако победат, ќе пиеме до утрото. Ако изгубат, ќе молчиме.
    meaning:
      en: If they win, we'll drink till morning. If they lose, we'll keep quiet.
      pt: Se ganharem, a gente bebe até de manhã. Se perderem, a gente fica quieto.
  - speaker: protagonist
    text: Во Бразил навивам за Коринтијанс.
    meaning:
      en: In Brazil I support Corinthians.
      pt: No Brasil eu torço para o Corinthians.
  - speaker: marko
    text: Е, тоа е вистински фудбал!
    meaning:
      en: Well, that's real football!
      pt: Aí sim é futebol de verdade!
  - speaker: protagonist
    text: Тогаш утре ќе навивам за Вардар.
    meaning:
      en: Then tomorrow I'll support Vardar.
      pt: Então amanhã eu torço para o Vardar.
