steps:
- type: narrator
  text:
    en: Mr Nikolovski calls you in. You fear the worst. Listen to the conversation; you don't need to understand it yet.
    pt: O senhor Nikolovski chama você na sala. Você teme o pior. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: nikolovski
    text: 'Седнете. Имам вест за вас: унапредување.'
    meaning:
      en: 'Sit down. I have news for you: a promotion.'
      pt: 'Sente-se. Tenho uma notícia: uma promoção.'
  - speaker: protagonist
    text: Унапредување? Не очекував.
    meaning:
      en: A promotion? I didn't expect that.
      pt: Promoção? Eu não esperava.
  - speaker: nikolovski
    text: Го заслуживте. Од први ќе бидете водач на тим.
    meaning:
      en: You earned it. From the first you'll be team lead.
      pt: A senhora mereceu. A partir do dia primeiro vai ser líder de equipe.
  - speaker: protagonist
    text: Поголема одговорност...
    meaning:
      en: More responsibility...
      pt: Mais responsabilidade...
  - speaker: nikolovski
    text: И повисока плата. Мислев дека за година дена ќе сте заминале во Германија.
    meaning:
      en: And a higher salary. I thought in a year you'd have left for Germany.
      pt: E salário maior. Achei que daqui a um ano a senhora já teria ido para a Alemanha.
  - speaker: protagonist
    text: Не, останувам. Тука ми е животот.
    meaning:
      en: No, I'm staying. My life is here.
      pt: Não, eu fico. Minha vida é aqui.
  - speaker: nikolovski
    text: Се радувам.
    meaning:
      en: I'm glad.
      pt: Fico feliz.
  - speaker: protagonist
    text: И јас се радувам. Многу ви благодарам.
    meaning:
      en: So am I. Thank you very much.
      pt: Eu também. Muito obrigada.
