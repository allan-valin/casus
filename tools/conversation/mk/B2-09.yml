steps:
- type: narrator
  text:
    en: A public night at the observatory. The guide is Goran's cousin; Bojan came along. Listen to the conversation; you don't need to understand it yet.
    pt: Uma noite aberta no observatório. O guia é primo do Goran; o Bojan foi junto. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: bojan
    text: Онаа светлина таму е друга галаксија — Андромеда.
    meaning:
      en: That light over there is another galaxy — Andromeda.
      pt: Aquela luz ali é outra galáxia — Andrômeda.
  - speaker: protagonist
    text: Колку е далеку?
    meaning:
      en: How far is it?
      pt: Quão longe fica?
  - speaker: bojan
    text: Околу два и пол милиони светлосни години.
    meaning:
      en: About two and a half million light years.
      pt: Uns dois milhões e meio de anos-luz.
  - speaker: protagonist
    text: Значи светлината патува толку долго до нас?
    meaning:
      en: So the light travels that long to reach us?
      pt: Então a luz viaja todo esse tempo até a gente?
  - speaker: bojan
    text: Да. Ја гледаме како била во минатото.
    meaning:
      en: Yes. We see it as it was in the past.
      pt: Sim. A gente vê como ela era no passado.
  - speaker: protagonist
    text: А некоја ѕвезда можеби веќе изгаснала?
    meaning:
      en: And some star might already have gone out?
      pt: E alguma estrela talvez já tenha se apagado?
  - speaker: bojan
    text: Можеби. Вселената е огромна.
    meaning:
      en: Maybe. The universe is huge.
      pt: Talvez. O universo é enorme.
  - speaker: protagonist
    text: Се чувствувам многу мала.
    meaning:
      en: I feel very small.
      pt: Me sinto muito pequena.
