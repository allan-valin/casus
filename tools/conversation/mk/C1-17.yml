steps:
- type: narrator
  text:
    en: 'Professor Ilievska: ''Should Skopje ban cars from the centre?'' You argue both sides. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'A professora Ilievska: ''Skopje deveria proibir carros no centro?'' Você defende os dois lados. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: profesorka
    text: 'Темата: забрана за автомобили во центарот. Повелете.'
    meaning:
      en: 'The topic: banning cars from the centre. Go ahead.'
      pt: 'O tema: proibir carros no centro. Pode começar.'
  - speaker: protagonist
    text: Од една страна, воздухот би бил почист.
    meaning:
      en: On the one hand, the air would be cleaner.
      pt: Por um lado, o ar seria mais limpo.
  - speaker: protagonist
    text: Од друга страна, трговците сметаат дека ќе изгубат купувачи.
    meaning:
      en: On the other hand, shopkeepers think they'd lose customers.
      pt: Por outro lado, os comerciantes acham que vão perder clientes.
  - speaker: profesorka
    text: А вие што сметате?
    meaning:
      en: And what do you think?
      pt: E a senhora, o que acha?
  - speaker: protagonist
    text: Сметам дека забраната е добра. Сепак, треба компромис — подобар јавен превоз.
    meaning:
      en: I consider the ban good. Nevertheless, a compromise is needed — better public transport.
      pt: Considero a proibição boa. No entanto, é preciso um meio-termo — transporte público melhor.
  - speaker: profesorka
    text: Вашиот аргумент е јасен. Заклучок?
    meaning:
      en: Your argument is clear. Conclusion?
      pt: Seu argumento está claro. Conclusão?
  - speaker: protagonist
    text: 'Заклучувам: прво автобуси, потоа забрана.'
    meaning:
      en: 'I conclude: first buses, then the ban.'
      pt: 'Concluo: primeiro ônibus, depois proibição.'
  - speaker: profesorka
    text: Одлично. Тоа е структура на добра дебата.
    meaning:
      en: Excellent. That is the structure of a good debate.
      pt: Excelente. Essa é a estrutura de um bom debate.
