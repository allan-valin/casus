steps:
- type: narrator
  text:
    en: The club's first league game. Coach Zoran is not in a good mood. Listen to the conversation; you don't need to understand it yet.
    pt: O primeiro jogo da liga do clube. O técnico Zoran não está de bom humor. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: zoran
    text: 'Тактиката е проста: силна одбрана, брз напад.'
    meaning:
      en: 'The tactics are simple: strong defence, fast attack.'
      pt: 'A tática é simples: defesa forte, ataque rápido.'
  - speaker: protagonist
    text: Тренерот секогаш вели „проста“, нели?
    meaning:
      en: The coach always says 'simple', right?
      pt: O técnico sempre diz 'simples', né?
  - speaker: marko
    text: Ама баш денеска играме против првите на табелата.
    meaning:
      en: And today of all days we play the league leaders.
      pt: E justo hoje a gente joga contra o primeiro da tabela.
  - speaker: zoran
    text: Ајде бре, момци! Не спиете!
    meaning:
      en: Come on, lads! Don't sleep!
      pt: Vamos, pô, rapazes! Não dormem!
  - speaker: protagonist
    text: Зар губиме со дваесет поени?
    meaning:
      en: Are we really losing by twenty points?
      pt: Será que a gente está perdendo por vinte pontos?
  - speaker: marko
    text: Губиме. Па добро, ова е само првото коло.
    meaning:
      en: We're losing. Well, all right, it's only the first round.
      pt: Estamos. Tá bom, é só a primeira rodada.
  - speaker: zoran
    text: Изгубивме. Но второто полувреме си го заслуживме.
    meaning:
      en: We lost. But the second half we earned.
      pt: Perdemos. Mas o segundo tempo a gente mereceu.
  - speaker: protagonist
    text: Следниот пат — прво одбрана!
    meaning:
      en: Next time — defence first!
      pt: Da próxima vez — primeiro a defesa!
