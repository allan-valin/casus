id: B2-14
protagonist: m
title: ["The conflict", "O conflito"]
situation: ["At the meeting, Darko presents your idea as his.", "Na reunião, o Darko apresenta a sua ideia como dele."]
learn: [b2-topic-doubling]
culture: —
items:
  - [moja-ideja, "моја идеја", "my idea", "minha ideia"]
  - [toa-beshe, "тоа беше", "that was", "aquilo foi"]
  - [ja-pretstavi, "ја претстави", "you presented it", "você apresentou"]
  - [kako-tvoja, "како твоја", "as yours", "como sua"]
  - [ne-sum-mislel, "не сум мислел", "I didn't mean to", "não foi minha intenção"]
  - [zaedno-ja-razvivme, "заедно ја развивме", "we developed it together", "a gente desenvolveu junto"]
  - [prvo-ja-predlozhiv, "прв ја предложив", "I proposed it first", "eu propus primeiro"]
  - [sledniot-pat-kazi, "следниот пат кажи", "next time say", "da próxima vez diga"]
  - [vazi, "Важи", "OK, deal", "Valeu / combinado"]
  - [korektno, "коректно", "fair, correct", "correto / justo"]
dialogue:
  - [protagonist, "Дарко, имаш ли минута? Идејата за менито — тоа беше моја идеја.", "Darko, have you got a minute? The menu idea — that was my idea.", "Darko, tem um minuto? A ideia do menu — aquilo foi minha ideia."]
  - [darko, "Па, заедно ја развивме.", "Well, we developed it together.", "Bom, a gente desenvolveu junto."]
  - [protagonist, "Заедно, да. Но јас прв ја предложив, а ти ја претстави како твоја.", "Together, yes. But I proposed it first, and you presented it as yours.", "Juntos, sim. Mas eu propus primeiro, e você apresentou como sua."]
  - [darko, "Не сум мислел така. Извини.", "I didn't mean it like that. Sorry.", "Não foi minha intenção. Desculpa."]
  - [protagonist, "Не е фер пред шефот.", "It's not fair in front of the boss.", "Não é justo na frente do chefe."]
  - [darko, "Во право си. Ќе му кажам на Николовски.", "You're right. I'll tell Nikolovski.", "Você tem razão. Vou falar com o Nikolovski."]
  - [protagonist, "Тоа е коректно. Следниот пат кажи „нашата идеја“.", "That's fair. Next time say 'our idea'.", "Isso é justo. Da próxima vez diga 'nossa ideia'."]
  - [darko, "Важи.", "Deal.", "Combinado."]
teach:
  - ask: ["Say: that was my idea.", "Diga: aquilo foi minha ideia.", "Тоа беше моја идеја.", toa-beshe, moja-ideja]
  - ask: ["Darko: we developed it together.", "O Darko: a gente desenvolveu junto.", "Заедно ја развивме.", zaedno-ja-razvivme]
  - note: ["Doubling makes clear who did what to the idea: 'јас прв ја предложив, а ти ја претстави' — I proposed it first, and you presented it.", "A duplicação deixa claro quem fez o quê com a ideia: 'јас прв ја предложив, а ти ја претстави' — eu propus primeiro, e você apresentou."]
  - ask: ["Say: I proposed it first.", "Diga: eu propus primeiro.", "Јас прв ја предложив.", prvo-ja-predlozhiv]
  - ask: ["Say: you presented it as yours.", "Diga: você apresentou como sua.", "Ти ја претстави како твоја.", ja-pretstavi, kako-tvoja]
  - ask: ["Darko: I didn't mean it like that.", "O Darko: não foi minha intenção.", "Не сум мислел така.", ne-sum-mislel]
  - ask: ["Say: it's not fair.", "Diga: não é justo.", "Не е фер.", ne-e-fer]
  - ask: ["Say: that's fair.", "Diga: isso é justo.", "Тоа е коректно.", korektno]
  - ask: ["Say: next time say 'our idea'.", "Diga: da próxima vez diga 'nossa ideia'.", "Следниот пат кажи „нашата идеја“.", sledniot-pat-kazi]
  - ask: ["Darko: deal.", "O Darko: combinado.", "Важи.", vazi]
  - note: ["Raise it privately and calmly, with facts; a public scene in front of the boss would cost you more than him.", "Fale em particular e com calma, com fatos; uma cena pública na frente do chefe custaria mais para você do que para ele."]
