id: B1-05
protagonist: f
title: ["Dating", "Namorando"]
situation: ["Ana saw someone waiting for you outside the office.", "A Ana viu alguém esperando você na frente do escritório."]
learn: [b1-time-conj]
culture: Meeting the friends and family early
items:
  - [te-ceka, "те чека", "is waiting for you", "está te esperando"]
  - [pred, "пред", "in front of / before / ago", "na frente de / antes / há"]
  - [mesec, "месец", "month", "mês"]
  - [vrska, "врска", "relationship", "relacionamento / namoro"]
  - [decko, "дечко", "boyfriend", "namorado"]
  - [znak, "знак", "sign", "sinal"]
  - [gi-zapoznavas, "ги запознаваш", "you meet them, get to know them", "você conhece (eles)"]
  - [otkako, "откако", "after (+ clause)", "depois que"]
  - [roditelite, "родителите", "the parents", "os pais"]
  - [seriozno, "сериозно", "serious(ly)", "sério"]
  - [dodeka, "додека", "while", "enquanto"]
dialogue:
  - [ana, "Кој е тој што те чека пред зградата?", "Who's that waiting for you outside the building?", "Quem é aquele que está te esperando na frente do prédio?"]
  - [protagonist, "Бојан. Се гледаме веќе еден месец.", "Bojan. We've been seeing each other for a month.", "O Bojan. A gente está saindo faz um mês."]
  - [ana, "Значи сте во врска!", "So you're together!", "Então vocês estão namorando!"]
  - [protagonist, "Да, тој ми е дечко. Кога излегуваме, секогаш ги носи и пријателите.", "Yes, he's my boyfriend. When we go out he always brings his friends too.", "Sim, ele é meu namorado. Quando a gente sai, ele sempre leva os amigos."]
  - [ana, "Тоа е добар знак. Тука пријателите и семејството ги запознаваш рано.", "That's a good sign. Here you meet the friends and family early.", "É um bom sinal. Aqui você conhece os amigos e a família cedo."]
  - [protagonist, "Во недела, откако ќе ручаме, ме носи кај родителите.", "On Sunday, after we have lunch, he's taking me to his parents.", "No domingo, depois do almoço, ele vai me levar na casa dos pais."]
  - [ana, "Веќе! Сериозно е.", "Already! It's serious.", "Já! É sério."]
  - [bojan, "Чао, Ана! Додека вие зборувате, јас ќе земам кафе.", "Hi, Ana! While you two talk, I'll get a coffee.", "Oi, Ana! Enquanto vocês conversam, vou pegar um café."]
teach:
  - ask: ["Ana asks who's waiting for you. Say: someone is waiting for you.", "A Ana pergunta quem está te esperando. Diga: alguém está te esperando.", "Некој те чека.", te-ceka]
  - ask: ["Say: in front of the building.", "Diga: na frente do prédio.", "Пред зградата.", pred, zgradata]
  - ask: ["Say: we've been seeing each other for a month.", "Diga: a gente está saindo faz um mês.", "Се гледаме веќе еден месец.", se-gledame, mesec]
  - ask: ["Say: so you're together! (in a relationship)", "Diga: então vocês estão namorando!", "Значи сте во врска!", znaci, vrska]
  - ask: ["Say: he's my boyfriend.", "Diga: ele é meu namorado.", "Тој ми е дечко.", decko]
  - ask: ["Say: that's a good sign.", "Diga: é um bom sinal.", "Тоа е добар знак.", znak]
  - ask: ["Say: here you meet the family early.", "Diga: aqui você conhece a família cedo.", "Тука семејството го запознаваш рано.", gi-zapoznavas, rano]
  - note: ["Time words join clauses: кога (when), откако (after), додека (while), пред да (before). For the future: откако ќе ручаме — after we've had lunch.", "Palavras de tempo ligam frases: кога (quando), откако (depois que), додека (enquanto), пред да (antes de). No futuro: откако ќе ручаме — depois que a gente almoçar."]
  - ask: ["Say: after we have lunch.", "Diga: depois que a gente almoçar.", "Откако ќе ручаме.", otkako]
  - ask: ["Say: to his parents.", "Diga: na casa dos pais.", "Кај родителите.", kaj, roditelite]
  - ask: ["Ana: it's serious! How?", "A Ana: é sério! Como?", "Сериозно е!", seriozno]
  - ask: ["Say: while you talk.", "Diga: enquanto vocês conversam.", "Додека зборувате.", dodeka]
  - note: ["A new partner meets the group of friends early, and often the parents within weeks — Sunday lunch is the usual test.", "O namorado novo conhece a turma logo, e muitas vezes os pais em poucas semanas — o almoço de domingo é a prova de sempre."]
