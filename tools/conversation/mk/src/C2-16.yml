id: C2-16
protagonist: m
title: ["The club's anniversary", "O aniversário do clube"]
situation: ["Fifty years of the basketball club. Zoran, retired, sits in the front row. You present the evening.", "Cinquenta anos do clube de basquete. O Zoran, aposentado, está na primeira fila. Você apresenta a noite."]
learn: [c2-set-phrases]
culture: —
items:
  - [jubilej, "јубилеј", "anniversary, jubilee", "jubileu", {rare: true}]
  - [pedeset-godini, "педесет години", "fifty years", "cinquenta anos"]
  - [ni-e-cest, "ни е чест", "it's an honour for us", "é uma honra para nós"]
  - [da-go-pozdravime, "да го поздравиме", "to welcome him", "saudar"]
  - [osnovacite, "основачите", "the founders", "os fundadores", {rare: true}]
  - [ne-se-so-nas, "не се веќе со нас", "are no longer with us", "não estão mais conosco"]
  - [minuta-molk, "минута молк", "a minute's silence", "um minuto de silêncio"]
  - [i-ponatamu, "и понатаму", "onward, and further", "e adiante"]
  - [za-uste-pedeset, "за уште педесет", "to fifty more", "a mais cinquenta"]
  - [so-golema-gordost, "со голема гордост", "with great pride", "com muito orgulho"]
dialogue:
  - [protagonist, "Почитувани гости, денеска славиме јубилеј — педесет години од клубот.", "Honoured guests, today we celebrate an anniversary — fifty years of the club.", "Prezados convidados, hoje celebramos um jubileu — cinquenta anos do clube."]
  - [protagonist, "Ни е чест да го поздравиме тренерот Зоран.", "It is an honour for us to welcome coach Zoran.", "É uma honra para nós saudar o técnico Zoran."]
  - [zoran, "Благодарам, благодарам...", "Thank you, thank you...", "Obrigado, obrigado..."]
  - [protagonist, "Некои од основачите не се веќе со нас. Ве молам, минута молк.", "Some of the founders are no longer with us. Please, a minute's silence.", "Alguns dos fundadores não estão mais conosco. Por favor, um minuto de silêncio."]
  - [protagonist, "Со голема гордост: генерации играчи, тренери, навивачи.", "With great pride: generations of players, coaches, fans.", "Com muito orgulho: gerações de jogadores, técnicos, torcedores."]
  - [marko, "И еден Бразилец!", "And one Brazilian!", "E um brasileiro!"]
  - [protagonist, "И еден Бразилец. Клубот — и понатаму!", "And one Brazilian. The club — onward!", "E um brasileiro. O clube — sempre adiante!"]
  - [zoran, "За уште педесет — наздравје!", "To fifty more — cheers!", "A mais cinquenta — saúde!"]
teach:
  - ask: ["Say: today we celebrate an anniversary.", "Diga: hoje celebramos um jubileu.", "Денеска славиме јубилеј.", jubilej]
  - ask: ["Say: fifty years of the club.", "Diga: cinquenta anos do clube.", "Педесет години од клубот.", pedeset-godini]
  - ask: ["Say: it's an honour for us to welcome…", "Diga: é uma honra para nós saudar…", "Ни е чест да го поздравиме…", ni-e-cest, da-go-pozdravime]
  - ask: ["Say: some of the founders are no longer with us.", "Diga: alguns dos fundadores não estão mais conosco.", "Некои од основачите не се веќе со нас.", osnovacite, ne-se-so-nas]
  - ask: ["Ask for a minute's silence.", "Peça um minuto de silêncio.", "Ве молам, минута молк.", minuta-molk]
  - ask: ["Say: with great pride.", "Diga: com muito orgulho.", "Со голема гордост.", so-golema-gordost]
  - ask: ["Say: the club — onward!", "Diga: o clube — sempre adiante!", "Клубот — и понатаму!", i-ponatamu]
  - ask: ["Toast: to fifty more!", "Brinde: a mais cinquenta!", "За уште педесет!", za-uste-pedeset]
  - note: ["Ceremonies have a fixed shape: welcome (почитувани гости), honour a person (ни е чест), remember the dead (минута молк), pride and the future (и понатаму), a toast.", "Cerimônias têm forma fixa: boas-vindas (почитувани гости), homenagem (ни е чест), lembrança dos mortos (минута молк), orgulho e futuro (и понатаму), brinde."]
