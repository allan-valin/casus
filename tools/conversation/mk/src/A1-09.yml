id: A1-09
protagonist: f
title: [Colours and light, Cores e luz]
situation: ["Winter is coming and you need a jacket. A shop in the centre.", "O inverno está chegando e você precisa de um casaco. Uma loja no centro."]
learn: [a1-adjectives]
culture: Dark colours in winter
items:
  - [baram, "Барам", "I'm looking for", "Estou procurando"]
  - [jakna, "јакна", "jacket", "casaco / jaqueta", {rare: true}]
  - [kakva-boja, "Каква боја?", "What colour?", "Que cor?"]
  - [crna, "црна", "black (feminine)", "preta"]
  - [sina, "сина", "blue (feminine)", "azul"]
  - [crvena, "црвена", "red (feminine)", "vermelha"]
  - [bela, "бела", "white (feminine)", "branca"]
  - [ili, "или", "or", "ou"]
  - [svetla, "светла", "light (colour, feminine)", "clara"]
  - [temna, "темна", "dark (feminine)", "escura"]
  - [ubava, "убава", "beautiful (feminine)", "bonita"]
  - [iljadi, "илјади", "thousand(s)", "mil"]
dialogue:
  - [seller, "Добар ден, повелете!", "Good afternoon, can I help?", "Boa tarde, pois não?"]
  - [protagonist, "Барам јакна за зима.", "I'm looking for a winter jacket.", "Estou procurando um casaco de inverno."]
  - [seller, "Каква боја?", "What colour?", "Que cor?"]
  - [protagonist, "Црна или сина.", "Black or blue.", "Preta ou azul."]
  - [seller, "Имаме сина. Црна немаме.", "We have blue. We don't have black.", "Temos azul. Preta não temos."]
  - [protagonist, "Таа е многу светла. Имате ли темна?", "That one is very light. Do you have a dark one?", "Essa é muito clara. Tem uma escura?"]
  - [seller, "Оваа е темно сина. И црвена имаме.", "This one is dark blue. We also have red.", "Esta é azul-escura. Também temos vermelha."]
  - [protagonist, "Темно сина, убава е! Колку чини?", "Dark blue, it's beautiful! How much is it?", "Azul-escura, é bonita! Quanto custa?"]
  - [seller, "Две илјади денари.", "Two thousand denars.", "Dois mil dinares."]
teach:
  - note: ["'Барам' is 'I'm looking for' — and in a shop it also means 'I'd like'.", "'Барам' é 'estou procurando' — e numa loja também quer dizer 'eu queria'."]
  - ask: ["Say you're looking for a jacket.", "Diga que está procurando um casaco.", "Барам јакна.", baram, jakna]
  - ask: ["She asks what colour. How?", "Ela pergunta que cor. Como?", "Каква боја?", kakva-boja]
  - note: ["Colours agree like other adjectives: 'јакна' is feminine, so 'црна', 'сина', 'бела' end in -а.", "As cores concordam como os outros adjetivos: 'јакна' é feminina, então 'црна', 'сина', 'бела' terminam em -а."]
  - ask: ["Say: black or blue.", "Diga: preta ou azul.", "Црна или сина.", crna, ili, sina]
  - ask: ["Ask if they have a red one.", "Pergunte se têm uma vermelha.", "Имате ли црвена?", imate-li, crvena]
  - ask: ["And a white one.", "E uma branca.", "Имате ли бела?", imate-li, bela]
  - ask: ["Say: it's very light.", "Diga: é muito clara.", "Многу е светла.", svetla]
  - ask: ["Ask for a dark one.", "Peça uma escura.", "Имате ли темна?", imate-li, temna]
  - ask: ["Say: it's beautiful!", "Diga: é bonita!", "Убава е!", ubava]
  - note: ["Thousands: 'илјада' is one thousand, 'две илјади' two thousand.", "Milhares: 'илјада' é mil, 'две илјади' dois mil."]
  - ask: ["Say: two thousand denars.", "Diga: dois mil dinares.", "Две илјади денари.", dve, iljadi, denari]
  - pt_only: "No inverno daqui quase todo mundo usa casaco escuro: preto, azul-marinho, cinza. Um vermelho chama atenção."
