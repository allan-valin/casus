id: A2-25
protagonist: f
title: ["Give it to me", "Me dá, te dou"]
situation: ["Marko knocks: he needs his phone charger back — and your book is missing.", "O Marko bate na porta: precisa do carregador de volta — e o seu livro sumiu."]
learn: [a2-clitic-pairs]
culture: —
items:
  - [daj-mi-go, "Дај ми го", "Give it to me (informal, masculine thing)", "Me dá (ele)"]
  - [polnacot, "полначот", "the charger", "o carregador", {rare: true}]
  - [ti-go-dadov, "ти го дадов", "I gave it to you", "te dei"]
  - [zaboraviv, "заборавив", "I forgot", "esqueci"]
  - [knigata, "книгата", "the book", "o livro"]
  - [ja-imas, "Ја имаш ли…?", "Do you have it…? (feminine thing)", "Está com você…?"]
  - [mu-ja-dadov, "му ја дадов", "I gave it to him", "dei para ele"]
  - [vrati-mi-ja, "врати ми ја", "give it back to me", "me devolve"]
  - [pozajmi-mi, "Позајми ми", "Lend me (informal)", "Me empresta"]
  - [pari, "пари", "money", "dinheiro"]
  - [ke-ti-gi-vratam, "ќе ти ги вратам", "I'll give them back to you", "te devolvo"]
dialogue:
  - [marko, "Здраво! Дај ми го полначот, те молам.", "Hi! Give me the charger, please.", "Oi! Me dá o carregador, por favor."]
  - [protagonist, "Полначот? Ти го дадов вчера!", "The charger? I gave it to you yesterday!", "O carregador? Te dei ontem!"]
  - [marko, "Аха... заборавив. А книгата моја — ја имаш ли?", "Ah... I forgot. And my book — do you have it?", "Ah... esqueci. E o meu livro — está com você?"]
  - [protagonist, "Не. Му ја дадов на Горан.", "No. I gave it to Goran.", "Não. Dei para o Goran."]
  - [marko, "Кажи му да ми ја врати.", "Tell him to give it back to me.", "Fala para ele me devolver."]
  - [protagonist, "Добро. Ти мене позајми ми двесте денари?", "All right. And you — lend me two hundred denars?", "Tá bom. E você — me empresta duzentos dinares?"]
  - [marko, "Еве. Кога ќе ми ги вратиш?", "Here. When will you give them back?", "Toma. Quando você me devolve?"]
  - [protagonist, "Утре ќе ти ги вратам.", "I'll give them back tomorrow.", "Amanhã te devolvo."]
teach:
  - note: ["Two small pronouns can go together, 'to whom' first, then 'what': ми го (it to me), ти го (it to you), му ја (it to him). After a command they follow the verb: дај ми го.", "Dois pronomes pequenos podem ir juntos, 'a quem' primeiro, depois 'o quê': ми го (mo), ти го (to), му ја (lha). Depois de uma ordem vêm depois do verbo: дај ми го (me dá)."]
  - ask: ["Marko asks for the charger. How?", "O Marko pede o carregador. Como?", "Дај ми го полначот.", daj-mi-go, polnacot]
  - ask: ["Say: I gave it to you yesterday!", "Diga: te dei ontem!", "Ти го дадов вчера!", ti-go-dadov, vcera]
  - ask: ["Say for him: I forgot.", "Diga por ele: esqueci.", "Заборавив.", zaboraviv]
  - ask: ["Ask if she has the book. How does he ask?", "Pergunte se o livro está com ela. Como ele pergunta?", "Книгата ја имаш ли?", knigata, ja-imas]
  - ask: ["Say: I gave it to Goran.", "Diga: dei para o Goran.", "Му ја дадов на Горан.", mu-ja-dadov]
  - ask: ["Say: give it back to me.", "Diga: me devolve.", "Врати ми ја.", vrati-mi-ja]
  - ask: ["Ask Marko to lend you money.", "Peça ao Marko para emprestar dinheiro.", "Позајми ми пари.", pozajmi-mi, pari]
  - ask: ["Say: I'll give them back tomorrow.", "Diga: amanhã te devolvo.", "Утре ќе ти ги вратам.", utre, ke-ti-gi-vratam]
  - ask: ["Ask for the bag: give it to me. (torba is feminine: ја)", "Peça a sacola: me dá (торба é feminina: ја).", "Дај ми ја торбата.", torbata]
