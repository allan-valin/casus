id: C2-27
protagonist: f
title: ["The inheritance", "A herança"]
situation: ["Vera, eighty now, is moving in with her daughter. She signs the flat over to her grandson.", "A Vera, agora com oitenta anos, vai morar com a filha. Ela passa o apartamento para o neto."]
learn: [c2-aspect-politeness]
culture: —
items:
  - [nasledstvo, "наследство", "inheritance", "herança"]
  - [ostavina, "оставина", "estate (of a deceased)", "espólio", {rare: true}]
  - [podarok-za-ziv, "подарок за жив", "a gift while alive", "doação em vida"]
  - [go-prepisuvam, "го препишувам", "I'm signing it over", "estou passando (para o nome de)"]
  - [na-vnuk-mi, "на внук ми", "to my grandson", "para o meu neto"]
  - [se-preseluvam, "се преселувам", "I'm moving", "estou me mudando"]
  - [kaj-kerka-mi, "кај ќерка ми", "to my daughter's", "para a casa da minha filha"]
  - [ke-mi-fali-skalata, "ќе ми фали скалата", "I'll miss the staircase", "vou sentir falta da escada"]
  - [da-ti-pomognam-so-kutiite, "да ти помогнам со кутиите", "let me help with the boxes", "deixa eu ajudar com as caixas"]
  - [ostavi-gi-na-mene, "остави ги на мене", "leave them to me", "deixa comigo"]
dialogue:
  - [vera, "Станот го препишувам на внук ми — подарок за жив, не оставина.", "I'm signing the flat over to my grandson — a gift while I'm alive, not an estate.", "Estou passando o apartamento para o meu neto — doação em vida, não herança depois."]
  - [protagonist, "Зошто сега?", "Why now?", "Por que agora?"]
  - [vera, "Се преселувам кај ќерка ми. Нозете не ми дозволуваат скали.", "I'm moving to my daughter's. My legs don't allow stairs any more.", "Vou morar com a minha filha. As pernas não deixam mais escada."]
  - [protagonist, "Ќе ми фали скалата без вас... без тебе.", "I'll miss the staircase without you.", "Vou sentir falta da escada sem você."]
  - [vera, "И мене. Ти беше најдобриот сосед.", "Me too. You were the best neighbour.", "Eu também. Você foi a melhor vizinha."]
  - [protagonist, "Дај да ти помогнам со кутиите.", "Let me help you with the boxes.", "Deixa eu te ajudar com as caixas."]
  - [vera, "Остави ги на мене. Само земи ја оваа — џезвата за кафе.", "Leave them to me. Just take this one — the coffee pot.", "Deixa comigo. Só pega esta — a cafeteira de café turco."]
  - [protagonist, "Џезвата? Од првиот ден?", "The coffee pot? From the first day?", "A cafeteira? Do primeiro dia?"]
  - [vera, "Наследство. За тебе.", "An inheritance. For you.", "Herança. Para você."]
teach:
  - ask: ["Vera: I'm signing the flat over.", "A Vera: estou passando o apartamento.", "Станот го препишувам.", go-prepisuvam]
  - ask: ["Say: to my grandson.", "Diga: para o meu neto.", "На внук ми.", na-vnuk-mi]
  - ask: ["Say: a gift while alive.", "Diga: doação em vida.", "Подарок за жив.", podarok-za-ziv]
  - ask: ["Say: the estate.", "Diga: o espólio.", "Оставина.", ostavina]
  - ask: ["Vera: I'm moving to my daughter's.", "A Vera: vou morar com a minha filha.", "Се преселувам кај ќерка ми.", se-preseluvam, kaj-kerka-mi]
  - ask: ["Say: I'll miss the staircase.", "Diga: vou sentir falta da escada.", "Ќе ми фали скалата.", ke-mi-fali-skalata]
  - ask: ["Offer: let me help with the boxes.", "Ofereça: deixa eu ajudar com as caixas.", "Да ти помогнам со кутиите.", da-ti-pomognam-so-kutiite]
  - ask: ["Vera: leave them to me.", "A Vera: deixa comigo.", "Остави ги на мене.", ostavi-gi-na-mene]
  - ask: ["Say: an inheritance.", "Diga: uma herança.", "Наследство.", nasledstvo]
  - note: ["Passing property to children or grandchildren during one's lifetime is common, to spare them the estate procedure later. Notice the slip: after years of Вие, 'без вас... без тебе' — the ти Vera offered in B1 finally comes naturally.", "Passar imóvel para filhos ou netos em vida é comum, para poupar o inventário depois. Repare no tropeço: depois de anos de Вие, 'без вас... без тебе' — o ти que a Vera ofereceu no B1 finalmente sai natural."]
