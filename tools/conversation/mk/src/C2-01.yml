id: C2-01
protagonist: f
title: ["The speech", "O discurso"]
situation: ["Marko's wedding. As кума, you give the main toast — in front of three hundred guests.", "O casamento do Marko. Como кума, você faz o brinde principal — na frente de trezentos convidados."]
learn: [c2-set-phrases]
culture: —
items:
  - [pocituvani-gosti, "Почитувани гости", "Honoured guests", "Prezados convidados"]
  - [dozvolete-mi, "Дозволете ми", "Allow me", "Permitam-me"]
  - [da-kazam-nekolku-zbora, "да кажам неколку зборови", "to say a few words", "dizer algumas palavras"]
  - [mladencite, "младенците", "the newlyweds", "os noivos", {rare: true}]
  - [da-ziveat-vo-sloga, "да живеат во слога", "may they live in harmony", "que vivam em harmonia", {rare: true}]
  - [vo-dobro-i-vo-zlo, "во добро и во зло", "for better or for worse", "na alegria e na tristeza"]
  - [da-ostarat-zaedno, "да остарат заедно", "may they grow old together", "que envelheçam juntos"]
  - [kumata, "кумата", "the кума (female кум)", "a madrinha (кума)", {rare: true}]
  - [krenete-gi-casite, "кренете ги чашите", "raise your glasses", "levantem os copos"]
  - [ziveale, "Живееле!", "Long live (them)! (toast)", "Vivam!"]
dialogue:
  - [protagonist, "Почитувани гости, дозволете ми да кажам неколку зборови.", "Honoured guests, allow me to say a few words.", "Prezados convidados, permitam-me dizer algumas palavras."]
  - [protagonist, "Марко беше првиот човек што ми рече „здраво“ во Скопје.", "Marko was the first person who said 'hi' to me in Skopje.", "O Marko foi a primeira pessoa que me disse 'oi' em Skopje."]
  - [protagonist, "Денеска, како кума, им посакувам на младенците да живеат во слога,", "Today, as кума, I wish the newlyweds to live in harmony,", "Hoje, como madrinha, desejo aos noivos que vivam em harmonia,"]
  - [protagonist, "во добро и во зло, и да остарат заедно.", "for better or for worse, and to grow old together.", "na alegria e na tristeza, e que envelheçam juntos."]
  - [marko, "Плачам, кумо!", "I'm crying, кума!", "Estou chorando, madrinha!"]
  - [protagonist, "Кренете ги чашите. Живееле!", "Raise your glasses. Long live the couple!", "Levantem os copos. Vivam os noivos!"]
  - [goran, "Живееле!", "Long live!", "Vivam!"]
  - [vera, "Каков говор! Како родена Македонка.", "What a speech! Like a born Macedonian.", "Que discurso! Como uma macedônia nata."]
teach:
  - ask: ["Open formally: honoured guests.", "Abra formalmente: prezados convidados.", "Почитувани гости,", pocituvani-gosti]
  - ask: ["Say: allow me to say a few words.", "Diga: permitam-me dizer algumas palavras.", "Дозволете ми да кажам неколку зборови.", dozvolete-mi, da-kazam-nekolku-zbora]
  - ask: ["Say: the newlyweds.", "Diga: os noivos.", "Младенците.", mladencite]
  - ask: ["Wish: may they live in harmony.", "Deseje: que vivam em harmonia.", "Да живеат во слога.", da-ziveat-vo-sloga]
  - ask: ["Say: for better or for worse.", "Diga: na alegria e na tristeza.", "Во добро и во зло.", vo-dobro-i-vo-zlo]
  - ask: ["Wish: may they grow old together.", "Deseje: que envelheçam juntos.", "Да остарат заедно.", da-ostarat-zaedno]
  - ask: ["Say: as кума.", "Diga: como madrinha.", "Како кума.", kumata]
  - ask: ["Say: raise your glasses.", "Diga: levantem os copos.", "Кренете ги чашите.", krenete-gi-casite]
  - ask: ["The wedding cheer!", "O grito do casamento!", "Живееле!", ziveale]
  - note: ["Wedding toasts run on set phrases: 'Почитувани гости', 'дозволете ми', wishes with 'да' (да живеат во слога, да остарат заедно), and the shout 'Живееле!' — long may they live — that everyone repeats.", "Brindes de casamento usam frases feitas: 'Почитувани гости', 'дозволете ми', desejos com 'да' (да живеат во слога, да остарат заедно), e o grito 'Живееле!' — vida longa a eles — que todos repetem."]
