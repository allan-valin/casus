id: A1-13
protagonist: f
title: ["\"Ajde na ti\"", "\"Ajde na ti\""]
situation: ["The next morning Ana offers to say ти.", "Na manhã seguinte a Ana propõe usar ти."]
learn: [a1-pronouns]
culture: Offering ти is a step, from the more senior person
items:
  - [kako-ste, "Како сте?", "How are you? (formal)", "Como vai a senhora?"]
  - [a-vie, "А вие?", "And you? (formal)", "E a senhora?"]
  - [ajde-na-ti, "Ајде на ти", "Let's say ти (be informal)", "Vamos nos tratar por ти"]
  - [moze, "Може", "Sure / it's possible", "Pode ser"]
  - [sekako, "Секако", "Of course", "Claro"]
  - [kako-si, "Како си?", "How are you? (informal)", "Como você está?"]
  - [a-ti, "А ти?", "And you? (informal)", "E você?"]
  - [odlicno, "Одлично", "Excellent", "Ótimo"]
  - [rucek, "ручек", "lunch", "almoço"]
  - [se-gledame, "Се гледаме", "See you", "A gente se vê"]
  - [cao, "Чао", "Bye (informal)", "Tchau"]
dialogue:
  - [ana, "Добро утро! Како сте?", "Good morning! How are you?", "Bom dia! Como vai?"]
  - [protagonist, "Добро, благодарам. А вие?", "Fine, thanks. And you?", "Bem, obrigada. E você?"]
  - [ana, "Добро. Слушајте, ајде на ти!", "Fine. Listen, let's say ти!", "Bem. Escuta, vamos nos tratar por ти!"]
  - [protagonist, "На ти? Може, секако!", "Ти? Sure, of course!", "Por ти? Pode ser, claro!"]
  - [ana, "Значи: како си?", "So: how are you?", "Então: como você está?"]
  - [protagonist, "Добро сум. А ти?", "I'm fine. And you?", "Estou bem. E você?"]
  - [ana, "Одлично! Се гледаме на ручек?", "Excellent! See you at lunch?", "Ótimo! A gente se vê no almoço?"]
  - [protagonist, "Да, се гледаме. Чао!", "Yes, see you. Bye!", "Sim, até lá. Tchau!"]
teach:
  - note: ["Macedonian has two 'you': 'Вие' (polite) and 'ти' (familiar). Switching to 'ти' is offered — usually by the older or more senior person. 'Ајде на ти' is that offer.", "O macedônio tem dois 'você': 'Вие' (educado) e 'ти' (íntimo). A troca para 'ти' é oferecida — normalmente pela pessoa mais velha ou de cargo mais alto. 'Ајде на ти' é essa oferta."]
  - pt_only: "Em português o 'você' serve para quase todos. Aqui, passar para 'ти' sem convite soa rude — espere a oferta."
  - ask: ["Ask Ana, still formally, how she is.", "Pergunte à Ana, ainda formal, como ela vai.", "Како сте?", kako-ste]
  - ask: ["Answer: fine, thanks. And you?", "Responda: bem, obrigada. E a senhora?", "Добро, благодарам. А вие?", dobro, blagodaram, a-vie]
  - ask: ["She offers ти. How?", "Ela oferece o ти. Como?", "Ајде на ти!", ajde-na-ti]
  - ask: ["Accept: sure, of course!", "Aceite: pode ser, claro!", "Може, секако!", moze, sekako]
  - ask: ["Now ask her informally how she is.", "Agora pergunte de modo informal como ela está.", "Како си?", kako-si]
  - ask: ["Answer: I'm fine. And you?", "Responda: estou bem. E você?", "Добро сум. А ти?", dobro-sum, a-ti]
  - ask: ["She feels excellent. Say it.", "Ela está ótima. Diga.", "Одлично!", odlicno]
  - ask: ["Ask: see you at lunch?", "Pergunte: a gente se vê no almoço?", "Се гледаме на ручек?", se-gledame, rucek]
  - ask: ["Say goodbye informally.", "Despeça-se de modo informal.", "Чао!", cao]
  - ask: ["To Marko on the stairs: hi, how are you?", "Para o Marko na escada: oi, como você está?", "Здраво, како си?", zdravo, kako-si]
