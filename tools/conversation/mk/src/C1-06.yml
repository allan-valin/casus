id: C1-06
protagonist: m
title: ["In class: discussion", "Na aula: discussão"]
situation: ["Professor Ilievska gives the class a news story to retell — without having seen it.", "A professora Ilievska dá à turma uma notícia para recontar — sem ter visto."]
learn: [c1-renarrative-full]
culture: —
items:
  - [diskusija, "дискусија", "discussion", "discussão"]
  - [argument, "аргумент", "argument (reason)", "argumento"]
  - [prepraskajte, "прераскажете", "retell (formal)", "reconte"]
  - [bil-otvoren, "бил отворен", "was opened (reportedly)", "teria sido aberto"]
  - [gradonacalnikot, "градоначалникот", "the mayor", "o prefeito"]
  - [izjavil, "изјавил", "stated (reportedly)", "teria declarado"]
  - [kostal, "чинел", "cost (reportedly)", "teria custado"]
  - [nie-ne-sme-bile, "не сме биле таму", "we weren't there", "não estivemos lá"]
  - [zatoa-l-formata, "затоа л-формата", "that's why the л-form", "por isso a forma em -л"]
  - [tocno-taka, "Точно така", "Exactly", "Exatamente"]
dialogue:
  - [profesorka, "Прераскажете ја веста за новиот мост.", "Retell the news about the new bridge.", "Recontem a notícia sobre a ponte nova."]
  - [protagonist, "Мостот бил отворен во сабота.", "The bridge was opened on Saturday, reportedly.", "A ponte teria sido inaugurada no sábado."]
  - [protagonist, "Градоначалникот изјавил дека е најубавиот во Скопје.", "The mayor stated it is the most beautiful in Skopje.", "O prefeito teria declarado que é a mais bonita de Skopje."]
  - [profesorka, "А колку чинел?", "And how much did it cost?", "E quanto teria custado?"]
  - [protagonist, "Чинел пет милиони евра, според весникот.", "It cost five million euros, according to the paper.", "Teria custado cinco milhões de euros, segundo o jornal."]
  - [profesorka, "Зошто зборувате така, а не „мостот беше отворен“?", "Why do you speak like that, and not 'the bridge was opened'?", "Por que fala assim, e não 'a ponte foi inaugurada'?"]
  - [protagonist, "Затоа што не сме биле таму. Затоа л-формата.", "Because we weren't there. That's why the л-form.", "Porque não estivemos lá. Por isso a forma em -л."]
  - [profesorka, "Точно така. Тоа е добар аргумент за дискусија.", "Exactly. That's a good argument for discussion.", "Exatamente. É um bom argumento para a discussão."]
teach:
  - ask: ["She says: retell the news.", "Ela diz: recontem a notícia.", "Прераскажете ја веста.", prepraskajte]
  - ask: ["Say: the bridge was opened, reportedly.", "Diga: a ponte teria sido inaugurada.", "Мостот бил отворен.", bil-otvoren]
  - ask: ["Say: the mayor stated…", "Diga: o prefeito teria declarado…", "Градоначалникот изјавил…", gradonacalnikot, izjavil]
  - ask: ["Say: it cost five million euros, reportedly.", "Diga: teria custado cinco milhões de euros.", "Чинел пет милиони евра.", kostal]
  - ask: ["Say: because we weren't there.", "Diga: porque não estivemos lá.", "Затоа што не сме биле таму.", zatoa-sto, nie-ne-sme-bile]
  - ask: ["Say: that's why the л-form.", "Diga: por isso a forma em -л.", "Затоа л-формата.", zatoa-l-formata]
  - ask: ["She agrees: exactly.", "Ela concorda: exatamente.", "Точно така.", tocno-taka]
  - ask: ["Say: a good argument for the discussion.", "Diga: um bom argumento para a discussão.", "Добар аргумент за дискусија.", argument, diskusija]
  - note: ["A whole story retold from a source stays in the л-form without 'е': бил отворен, изјавил, чинел. Switching to 'беше' would claim you saw it.", "Uma história inteira recontada de uma fonte fica na forma em -л sem 'е': бил отворен, изјавил, чинел. Mudar para 'беше' diria que você viu."]
