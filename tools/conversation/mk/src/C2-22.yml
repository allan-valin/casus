id: C2-22
protagonist: m
title: ["Reunion in São Paulo", "Reencontro em São Paulo"]
situation: ["Marko and Goran visit you in Brazil for the first time. Avenida Paulista on a Sunday.", "O Marko e o Goran visitam você no Brasil pela primeira vez. Avenida Paulista num domingo."]
learn: [c2-register]
culture: Seeing Brazil with their eyes
items:
  - [nemam-zborovi, "немам зборови", "I'm speechless", "estou sem palavras"]
  - [tolku-lugje, "толку многу луѓе", "so many people", "tanta gente"]
  - [ja-zatvoraat-ulicata, "ја затвораат улицата", "they close the street", "fecham a rua"]
  - [vo-nedela, "во недела", "on Sundays", "no domingo"]
  - [nostalgija, "носталгија", "nostalgia, homesickness", "nostalgia / saudade", {rare: true}]
  - [za-skopje, "за Скопје", "for Skopje", "de Skopje"]
  - [obratno, "обратно", "the other way round", "ao contrário"]
  - [sega-razbiram-zosto, "сега разбирам зошто", "now I understand why", "agora entendo por que"]
  - [kafe-ovde, "кафето овде", "the coffee here", "o café daqui"]
  - [vo-stoeje, "во стоење", "standing up", "em pé"]
dialogue:
  - [marko, "Немам зборови. Толку многу луѓе!", "I'm speechless. So many people!", "Estou sem palavras. Tanta gente!"]
  - [protagonist, "Во недела ја затвораат улицата за коли. Сите шетаат.", "On Sundays they close the street to cars. Everyone walks.", "No domingo fecham a rua para carros. Todo mundo passeia."]
  - [goran, "А кафето? Во стоење, за две минути?", "And the coffee? Standing up, in two minutes?", "E o café? Em pé, em dois minutos?"]
  - [protagonist, "Кафезињо. Тука кафето е брзо — обратно од кај нас.", "Cafezinho. Here coffee is fast — the other way round from back home.", "Cafezinho. Aqui o café é rápido — ao contrário de lá."]
  - [marko, "Сега разбирам зошто беше во шок во Скопје.", "Now I understand why you were in shock in Skopje.", "Agora entendo por que você ficou em choque em Skopje."]
  - [protagonist, "А јас сега имам носталгија — за Скопје.", "And now I'm homesick — for Skopje.", "E agora eu estou com saudade — de Skopje."]
  - [goran, "Обратно! Бразилец со носталгија за Скопје.", "The other way round! A Brazilian homesick for Skopje.", "Ao contrário! Um brasileiro com saudade de Skopje."]
  - [protagonist, "Таков е животот кога имаш два дома.", "That's life when you have two homes.", "É assim a vida quando você tem duas casas."]
teach:
  - ask: ["Marko: I'm speechless.", "O Marko: estou sem palavras.", "Немам зборови.", nemam-zborovi]
  - ask: ["Say: so many people!", "Diga: tanta gente!", "Толку многу луѓе!", tolku-lugje]
  - ask: ["Say: on Sundays they close the street.", "Diga: no domingo fecham a rua.", "Во недела ја затвораат улицата.", vo-nedela, ja-zatvoraat-ulicata]
  - ask: ["Goran: standing up?", "O Goran: em pé?", "Во стоење?", vo-stoeje]
  - ask: ["Say: the coffee here is fast.", "Diga: o café daqui é rápido.", "Кафето овде е брзо.", kafe-ovde]
  - ask: ["Say: the other way round.", "Diga: ao contrário.", "Обратно.", obratno]
  - ask: ["Marko: now I understand why.", "O Marko: agora entendo por que.", "Сега разбирам зошто.", sega-razbiram-zosto]
  - ask: ["Say: now I'm homesick for Skopje.", "Diga: agora estou com saudade de Skopje.", "Сега имам носталгија за Скопје.", nostalgija, za-skopje]
  - note: ["Seeing your own country through your friends' eyes turns every habit into a comparison — and the comparisons run both ways now.", "Ver o próprio país pelos olhos dos amigos transforma todo hábito em comparação — e agora as comparações vão para os dois lados."]
