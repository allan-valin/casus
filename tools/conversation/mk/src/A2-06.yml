id: A2-06
protagonist: m
title: [Water, A água]
situation: ["January. The street outside is icy. Mrs Stojanovska calls you in for tea.", "Janeiro. A rua está congelada. A senhora Stojanovska chama você para um chá."]
learn: [a2-aspect]
culture: —
items:
  - [vnimavajte, "Внимавајте!", "Careful! (formal)", "Cuidado! (formal)"]
  - [mraz, "мраз", "ice, frost", "gelo / geada"]
  - [ke-bide, "ќе биде", "will be", "vai ser / vai estar"]
  - [potoplo, "потопло", "warmer", "mais quente"]
  - [se-topi, "се топи", "is melting", "está derretendo"]
  - [ke-se-stopi, "ќе се стопи", "will melt (completely)", "vai derreter", {rare: true}]
  - [vekje, "веќе", "already", "já"]
  - [pareata, "пареата", "the steam", "o vapor", {rare: true}]
  - [znaete-li, "Знаете ли…?", "Do you know…? (formal)", "O senhor sabe…?"]
  - [ezeroto, "езерото", "the lake", "o lago"]
  - [cista, "чиста", "clean (feminine)", "limpa"]
  - [tolku, "толку", "so (much)", "tão / tanto"]
dialogue:
  - [vera, "Внимавајте, има мраз на улицата!", "Careful, there's ice on the street!", "Cuidado, tem gelo na rua!"]
  - [protagonist, "Мраз! Во Сао Паоло никогаш нема мраз.", "Ice! In São Paulo there's never ice.", "Gelo! Em São Paulo nunca tem gelo."]
  - [vera, "Утре ќе биде потопло. Мразот ќе се стопи.", "Tomorrow will be warmer. The ice will melt.", "Amanhã vai estar mais quente. O gelo vai derreter."]
  - [protagonist, "Сега се топи малку, на сонце.", "It's melting a bit now, in the sun.", "Agora está derretendo um pouco, no sol."]
  - [vera, "Влезете. Водата веќе врие — ја гледате пареата?", "Come in. The water's already boiling — see the steam?", "Entre. A água já está fervendo — está vendo o vapor?"]
  - [protagonist, "Да. Убаво е топло тука.", "Yes. It's nice and warm here.", "Sim. Está quentinho aqui."]
  - [vera, "Знаете ли дека Охридското Езеро е толку чисто?", "Do you know the Ohrid lake is so clean?", "O senhor sabia que o lago de Ohrid é tão limpo?"]
  - [protagonist, "Колку чисто?", "How clean?", "Limpo quanto?"]
  - [vera, "Се гледа дното, дваесет метри!", "You can see the bottom, twenty metres down!", "Dá para ver o fundo, a vinte metros!"]
teach:
  - ask: ["Warn her: careful! (formal)", "Avise: cuidado! (formal)", "Внимавајте!", vnimavajte]
  - ask: ["Say: there's ice on the street.", "Diga: tem gelo na rua.", "Има мраз на улицата.", mraz, ulica]
  - ask: ["Say: tomorrow will be warmer.", "Diga: amanhã vai estar mais quente.", "Утре ќе биде потопло.", ke-bide, potoplo]
  - note: ["Many verbs come in pairs: one for an action going on (се топи — is melting), one for an action completed (ќе се стопи — will melt away). Macedonian chooses every time; Portuguese and English mostly don't.", "Muitos verbos vêm em pares: um para a ação em andamento (се топи — está derretendo), outro para a ação completa (ќе се стопи — vai derreter de vez). O macedônio escolhe sempre; o português quase nunca."]
  - ask: ["Say: it's melting now.", "Diga: agora está derretendo.", "Сега се топи.", sega, se-topi]
  - ask: ["Say: the ice will melt.", "Diga: o gelo vai derreter.", "Мразот ќе се стопи.", mraz, ke-se-stopi]
  - ask: ["Say: the water is already boiling.", "Diga: a água já está fervendo.", "Водата веќе врие.", vekje, vrie]
  - ask: ["Say: the steam.", "Diga: o vapor.", "Пареата.", pareata]
  - ask: ["Ask her: do you know Ohrid?", "Pergunte: a senhora conhece Ohrid?", "Знаете ли Охрид?", znaete-li]
  - ask: ["Say: the lake is so clean.", "Diga: o lago é tão limpo.", "Езерото е толку чисто.", ezeroto, tolku]
  - ask: ["Say: the water is clean.", "Diga: a água é limpa.", "Водата е чиста.", voda, cista]
  - note: ["Lake Ohrid is one of the oldest lakes in the world — over a million years old — and a UNESCO site. On calm days you can see many metres down.", "O lago de Ohrid é um dos mais antigos do mundo — mais de um milhão de anos — e patrimônio da UNESCO. Em dia calmo dá para ver muitos metros de profundidade."]
