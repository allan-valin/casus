id: B1-01
protagonist: f
title: ["Marko's group", "O grupo do Marko"]
situation: ["Friday at a кафана. Marko's friends meet here every week.", "Sexta numa кафана. Os amigos do Marko se encontram aqui toda semana."]
learn: [b1-ima-perfect]
culture: —
items:
  - [druzinata, "дружината", "the group of friends", "a turma"]
  - [sekoj-petok, "секој петок", "every Friday", "toda sexta"]
  - [dobredojde, "Добредојде!", "Welcome! (informal)", "Bem-vinda!"]
  - [imam-slusnato, "имам слушнато", "I have heard", "já ouvi falar"]
  - [dobri-raboti, "добри работи", "good things", "coisas boas"]
  - [se-nadevam, "се надевам", "I hope", "espero"]
  - [imas-li-probano, "Имаш ли пробано…?", "Have you (ever) tried…? (informal)", "Você já provou…?"]
  - [nemam-probano, "немам пробано", "I haven't tried", "nunca provei"]
  - [kajsii, "кајсии", "apricots", "damascos", {rare: true}]
  - [mora-da, "мора да", "must, have to", "tem que"]
  - [pat, "пат", "time (occasion)", "vez"]
dialogue:
  - [marko, "Ова е мојата дружина. Секој петок сме тука.", "This is my group. Every Friday we're here.", "Esta é a minha turma. Toda sexta a gente está aqui."]
  - [goran, "Добредојде! Имам слушнато многу за тебе.", "Welcome! I've heard a lot about you.", "Bem-vinda! Já ouvi falar muito de você."]
  - [protagonist, "Само добри работи, се надевам!", "Only good things, I hope!", "Só coisas boas, espero!"]
  - [goran, "Имаш ли пробано ракија од кајсии?", "Have you ever tried apricot rakija?", "Você já provou rakija de damasco?"]
  - [protagonist, "Немам пробано. Само од сливи.", "I haven't. Only plum.", "Nunca provei. Só de ameixa."]
  - [marko, "Тогаш мора да пробаш. Келнер, три ракии!", "Then you have to try it. Waiter, three rakijas!", "Então tem que provar. Garçom, três rakijas!"]
  - [protagonist, "Само малку! Имам слушнато дека е многу јака.", "Just a little! I've heard it's very strong.", "Só um pouco! Ouvi dizer que é muito forte."]
  - [goran, "Добро си слушнала. На здравје — прв пат!", "You heard right. Cheers — the first time!", "Ouviu certo. Saúde — primeira vez!"]
teach:
  - note: ["Macedonian has a second 'have done': има + a form in -но, for experience — 'имам слушнато' (I have heard), 'немам пробано' (I've never tried). It doesn't change for man or woman.", "O macedônio tem um segundo 'já fiz': има + uma forma em -но, para experiência — 'имам слушнато' (já ouvi), 'немам пробано' (nunca provei). Não muda para homem ou mulher."]
  - ask: ["Say: this is my group.", "Diga: esta é a minha turma.", "Ова е мојата дружина.", druzinata]
  - ask: ["Say: every Friday we're here.", "Diga: toda sexta a gente está aqui.", "Секој петок сме тука.", sekoj-petok]
  - ask: ["Goran welcomes you. How?", "O Goran dá as boas-vindas. Como?", "Добредојде!", dobredojde]
  - ask: ["Say: I've heard a lot about you.", "Diga: já ouvi falar muito de você.", "Имам слушнато многу за тебе.", imam-slusnato, tebe]
  - ask: ["Say: only good things, I hope!", "Diga: só coisas boas, espero!", "Само добри работи, се надевам!", dobri-raboti, se-nadevam]
  - ask: ["Ask: have you ever tried apricot rakija?", "Pergunte: você já provou rakija de damasco?", "Имаш ли пробано ракија од кајсии?", imas-li-probano, kajsii]
  - ask: ["Say: I haven't. Only plum.", "Diga: nunca provei. Só de ameixa.", "Немам пробано. Само од сливи.", nemam-probano, slivi]
  - ask: ["Say: then you have to try it.", "Diga: então tem que provar.", "Тогаш мора да пробаш.", togas, mora-da]
  - ask: ["Say: the first time!", "Diga: primeira vez!", "Прв пат!", pat]
  - pt_only: "A кафана é o boteco com comida e música: mesa comprida, rakija, salada, e ninguém tem pressa de ir embora."
