id: B2-12
protagonist: m
title: ["Probability", "Probabilidade"]
situation: ["Darko buys a lottery ticket every week. You do the maths.", "O Darko compra bilhete de loteria toda semana. Você faz as contas."]
learn: [b2-da-wishes]
culture: —
items:
  - [loto, "лото", "lottery", "loteria", {rare: true}]
  - [da-dobijam, "Да добијам!", "If only I'd win! (wish)", "Tomara que eu ganhe!"]
  - [verojatnost, "веројатност", "probability", "probabilidade", {rare: true}]
  - [sansa, "шанса", "chance", "chance"]
  - [edna-vo-milion, "една во милион", "one in a million", "uma em um milhão"]
  - [pomala, "помала", "smaller (feminine)", "menor"]
  - [grom, "гром", "lightning, thunder", "raio / trovão"]
  - [prognozata, "прогнозата", "the forecast", "a previsão"]
  - [sedumdeset-procenti, "седумдесет проценти", "seventy per cent", "setenta por cento"]
  - [da-ne-vrne, "Да не врне!", "Hopefully it won't rain!", "Tomara que não chova!"]
dialogue:
  - [darko, "Купив лото. Да добијам, ќе одам на Малдиви!", "I bought a lottery ticket. If only I win, I'm off to the Maldives!", "Comprei loteria. Tomara que eu ganhe, vou para as Maldivas!"]
  - [protagonist, "Знаеш колкава е веројатноста?", "Do you know what the probability is?", "Você sabe qual é a probabilidade?"]
  - [darko, "Една во милион?", "One in a million?", "Uma em um milhão?"]
  - [protagonist, "Помала! Поголема шанса имаш да те удри гром.", "Smaller! You have a bigger chance of being struck by lightning.", "Menor! Você tem mais chance de ser atingido por um raio."]
  - [darko, "Тогаш да не излегувам кога врне.", "Then I'd better not go out when it rains.", "Então é melhor não sair quando chover."]
  - [protagonist, "Прогнозата вели седумдесет проценти дожд за утре.", "The forecast says seventy per cent rain for tomorrow.", "A previsão diz setenta por cento de chuva amanhã."]
  - [darko, "Да не врне! Утре е викенд.", "Hopefully it won't rain! Tomorrow's the weekend.", "Tomara que não chova! Amanhã é fim de semana."]
  - [protagonist, "Седумдесет проценти — ти би купил чадор или лото?", "Seventy per cent — would you buy an umbrella or a lottery ticket?", "Setenta por cento — você compraria guarda-chuva ou loteria?"]
teach:
  - ask: ["Darko wishes: if only I win! How?", "O Darko deseja: tomara que eu ganhe! Como?", "Да добијам!", da-dobijam]
  - ask: ["Say: the lottery.", "Diga: a loteria.", "Лото.", loto]
  - ask: ["Ask what the probability is.", "Pergunte qual é a probabilidade.", "Колкава е веројатноста?", verojatnost]
  - ask: ["Say: one in a million.", "Diga: uma em um milhão.", "Една во милион.", edna-vo-milion]
  - ask: ["Say: smaller!", "Diga: menor!", "Помала!", pomala]
  - ask: ["Say: a bigger chance.", "Diga: mais chance.", "Поголема шанса.", sansa]
  - ask: ["Say: lightning.", "Diga: raio.", "Гром.", grom]
  - ask: ["Say: the forecast says seventy per cent.", "Diga: a previsão diz setenta por cento.", "Прогнозата вели седумдесет проценти.", prognozata, sedumdeset-procenti]
  - ask: ["Wish: hopefully it won't rain!", "Deseje: tomara que não chova!", "Да не врне!", da-ne-vrne]
  - note: ["Big lotteries often have odds of one in several million per ticket — far worse than 'one in a million'. Being struck by lightning in a lifetime is far likelier. A '70 % chance of rain' means: on days like this, it rained seven times out of ten.", "Loterias grandes costumam ter chance de uma em vários milhões por bilhete — muito pior que 'uma em um milhão'. Ser atingido por raio na vida é bem mais provável. '70 % de chance de chuva' quer dizer: em dias assim, choveu sete vezes em dez."]
