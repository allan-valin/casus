id: C2-04
protagonist: m
title: ["Negotiating", "Negociar"]
situation: ["Your annual review. You want a real raise, and you are ready to say so.", "Sua avaliação anual. Você quer um aumento de verdade, e está pronto para dizer isso."]
learn: [c2-aspect-politeness]
culture: —
items:
  - [bi-mozele-da, "би можеле да", "could you (formal)", "o senhor poderia"]
  - [razmislite, "размислите", "think it over (formal)", "pensar a respeito"]
  - [pazarna-vrednost, "пазарна вредност", "market value", "valor de mercado", {rare: true}]
  - [ponuda-od-drugade, "понуда од друго место", "an offer from elsewhere", "uma proposta de outro lugar"]
  - [ne-se-zakanuvam, "не се заканувам", "I'm not threatening", "não estou ameaçando"]
  - [pretpocituvam-da-ostanam, "претпочитам да останам", "I prefer to stay", "prefiro ficar"]
  - [uslov, "услов", "condition", "condição"]
  - [kompromisno, "компромисно", "as a compromise", "como meio-termo", {rare: true}]
  - [od-noemvri, "од ноември", "from November", "a partir de novembro"]
  - [se-dogovorivme, "се договоривме", "we agreed, deal", "combinado"]
dialogue:
  - [protagonist, "Господине Николовски, би можеле да размислите за покачување?", "Mr Nikolovski, could you consider a raise?", "Senhor Nikolovski, o senhor poderia pensar num aumento?"]
  - [nikolovski, "Колку?", "How much?", "Quanto?"]
  - [protagonist, "Петнаесет проценти. Тоа е мојата пазарна вредност.", "Fifteen per cent. That's my market value.", "Quinze por cento. É o meu valor de mercado."]
  - [nikolovski, "Петнаесет е многу.", "Fifteen is a lot.", "Quinze é muito."]
  - [protagonist, "Имам понуда од друго место. Не се заканувам — претпочитам да останам.", "I have an offer from elsewhere. I'm not threatening — I prefer to stay.", "Tenho uma proposta de outro lugar. Não estou ameaçando — prefiro ficar."]
  - [nikolovski, "Компромисно: десет сега, пет од ноември, под услов проектот да заврши навреме.", "As a compromise: ten now, five from November, on condition the project finishes on time.", "Meio-termo: dez agora, cinco a partir de novembro, com a condição de o projeto terminar no prazo."]
  - [protagonist, "Тоа е фер. Се договоривме.", "That's fair. Deal.", "É justo. Combinado."]
  - [nikolovski, "Добро преговаравте. Не очекував.", "You negotiated well. I didn't expect it.", "O senhor negociou bem. Não esperava."]
teach:
  - note: ["Polite requests choose the completed verb in the conditional: 'би можеле да размислите' (could you think it over, once and decide). The ongoing form — 'да размислувате' — would sound like 'keep thinking about it'.", "Pedidos educados escolhem o verbo completo no condicional: 'би можеле да размислите' (poderia pensar e decidir). A forma em andamento — 'да размислувате' — soaria como 'fique pensando nisso'."]
  - ask: ["Ask: could you consider a raise?", "Pergunte: o senhor poderia pensar num aumento?", "Би можеле да размислите за покачување?", bi-mozele-da, razmislite]
  - ask: ["Say: that's my market value.", "Diga: é o meu valor de mercado.", "Тоа е мојата пазарна вредност.", pazarna-vrednost]
  - ask: ["Say: I have an offer from elsewhere.", "Diga: tenho uma proposta de outro lugar.", "Имам понуда од друго место.", ponuda-od-drugade]
  - ask: ["Say: I'm not threatening.", "Diga: não estou ameaçando.", "Не се заканувам.", ne-se-zakanuvam]
  - ask: ["Say: I prefer to stay.", "Diga: prefiro ficar.", "Претпочитам да останам.", pretpocituvam-da-ostanam]
  - ask: ["He says: as a compromise.", "Ele diz: como meio-termo.", "Компромисно.", kompromisno]
  - ask: ["Say: from November.", "Diga: a partir de novembro.", "Од ноември.", od-noemvri]
  - ask: ["Say: on one condition.", "Diga: com uma condição.", "Под еден услов.", uslov]
  - ask: ["Say: deal.", "Diga: combinado.", "Се договоривме.", se-dogovorivme]
