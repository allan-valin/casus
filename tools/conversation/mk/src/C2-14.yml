id: C2-14
protagonist: m
title: ["Raising children", "Criar filhos"]
situation: ["Your daughter is four. Grandma gives her sweets before dinner — again.", "Sua filha tem quatro anos. A avó dá doce antes do jantar — de novo."]
learn: [c2-admirative]
culture: Grandparents' authority
items:
  - [vospituvanje, "воспитување", "upbringing", "educação (criação)"]
  - [razgaleno, "разгалено", "spoiled", "mimado", {rare: true}]
  - [pred-vecera, "пред вечера", "before dinner", "antes do jantar"]
  - [babinata-kukja, "кај баба", "at grandma's", "na casa da avó"]
  - [drugi-pravila, "други правила", "different rules", "outras regras"]
  - [ekranot, "екранот", "the screen", "a tela"]
  - [pola-cas, "половина час", "half an hour", "meia hora"]
  - [taa-si-bila, "таа си била", "she is, it turns out", "ela é, pelo jeito"]
  - [poslusna, "послушна", "obedient (feminine)", "obediente", {rare: true}]
  - [ajde-zaedno, "ајде заедно да се договориме", "let's agree together", "vamos combinar juntos"]
dialogue:
  - [protagonist, "Мамо, пак ѝ даде чоколадо пред вечера?", "Mum, you gave her chocolate before dinner again?", "Mãe, de novo você deu chocolate para ela antes do jantar?"]
  - [svekrva-s, "Само едно! Кај баба има други правила.", "Just one! At grandma's there are different rules.", "Só um! Na casa da avó as regras são outras."]
  - [sara, "Детето ќе стане разгалено.", "The child will get spoiled.", "A criança vai ficar mimada."]
  - [svekrva-s, "Јас вас ве воспитав, и добро испадна!", "I raised you, and it turned out fine!", "Eu criei vocês, e deu certo!"]
  - [protagonist, "А екранот? Три часа цртани.", "And the screen? Three hours of cartoons.", "E a tela? Três horas de desenho."]
  - [svekrva-s, "Таа си била многу послушна кога гледа цртани!", "She's so obedient when she watches cartoons, you'd be surprised!", "Ela fica tão obediente quando vê desenho, você nem imagina!"]
  - [protagonist, "Ајде заедно да се договориме: половина час екран и чоколадо по вечера.", "Let's agree together: half an hour of screen and chocolate after dinner.", "Vamos combinar juntos: meia hora de tela e chocolate depois do jantar."]
  - [svekrva-s, "Добро... ама кај баба — еден час.", "All right... but at grandma's — an hour.", "Tá bom... mas na casa da avó — uma hora."]
teach:
  - ask: ["Say: before dinner.", "Diga: antes do jantar.", "Пред вечера.", pred-vecera]
  - ask: ["Grandma: at grandma's there are different rules.", "A avó: na casa da avó as regras são outras.", "Кај баба има други правила.", babinata-kukja, drugi-pravila]
  - ask: ["Say: the child will get spoiled.", "Diga: a criança vai ficar mimada.", "Детето ќе стане разгалено.", razgaleno]
  - ask: ["Say: upbringing.", "Diga: educação.", "Воспитување.", vospituvanje]
  - ask: ["Say: the screen.", "Diga: a tela.", "Екранот.", ekranot]
  - ask: ["Grandma, admiring: she's so obedient!", "A avó, admirada: ela fica tão obediente!", "Таа си била многу послушна!", taa-si-bila, poslusna]
  - ask: ["Say: let's agree together.", "Diga: vamos combinar juntos.", "Ајде заедно да се договориме.", ajde-zaedno]
  - ask: ["Say: half an hour.", "Diga: meia hora.", "Половина час.", pola-cas]
  - note: ["Grandparents who look after children every day expect a say in the rules. A negotiated deal ('ајде заедно да се договориме') works better than a ban — and grandma's house keeps a little extra.", "Avós que cuidam das crianças todo dia esperam opinar nas regras. Um acordo negociado ('ајде заедно да се договориме') funciona melhor que uma proibição — e a casa da avó fica com um pouquinho a mais."]
