id: A1-29
protagonist: f
title: [A problem in the flat, Um problema no apartamento]
situation: ["No hot water. You tell Mrs Stojanovska; she calls the repairman.", "Não tem água quente. Você avisa a senhora Stojanovska; ela chama o técnico."]
learn: [a1-questions]
culture: The мајстор who fixes everything
items:
  - [bojlerot, "бојлерот", "the water heater", "o aquecedor de água", {rare: true}]
  - [ne-raboti, "не работи", "doesn't work", "não funciona"]
  - [topla-voda, "топла вода", "hot water", "água quente"]
  - [pak, "Пак?", "Again?", "De novo?"]
  - [majstorot, "мајсторот", "the repairman", "o técnico / o faz-tudo"]
  - [mozete-li, "Можете ли…?", "Can you…? (formal)", "O senhor pode…?"]
  - [da-go-popravite, "да го поправите", "to fix it (formal)", "consertar (formal)", {rare: true}]
  - [mozam, "можам", "I can", "eu posso"]
  - [treba, "треба", "(it) needs / is needed", "precisa"]
  - [del, "дел", "part", "peça"]
  - [cas, "час", "hour", "hora"]
dialogue:
  - [protagonist, "Госпоѓо Стојановска, бојлерот не работи. Нема топла вода!", "Mrs Stojanovska, the water heater isn't working. There's no hot water!", "Senhora Stojanovska, o aquecedor não funciona. Não tem água quente!"]
  - [vera, "Пак? Ќе го викнам мајсторот.", "Again? I'll call the repairman.", "De novo? Vou chamar o técnico."]
  - [majstor, "Добар ден. Каде е бојлерот?", "Good afternoon. Where's the water heater?", "Boa tarde. Onde está o aquecedor?"]
  - [protagonist, "Во бањата. Можете ли да го поправите денеска?", "In the bathroom. Can you fix it today?", "No banheiro. O senhor pode consertar hoje?"]
  - [majstor, "Можам, но треба нов дел.", "I can, but it needs a new part.", "Posso, mas precisa de uma peça nova."]
  - [protagonist, "Колку време?", "How long?", "Quanto tempo?"]
  - [majstor, "Еден час.", "One hour.", "Uma hora."]
  - [protagonist, "Одлично. Сакате ли кафе?", "Excellent. Would you like a coffee?", "Ótimo. O senhor quer um café?"]
  - [majstor, "Може, без шеќер.", "Sure, no sugar.", "Pode ser, sem açúcar."]
teach:
  - note: ["Most flats heat water in a бојлер, an electric tank in the bathroom. Switch it on some time before your shower.", "A maioria dos apartamentos esquenta a água num бојлер, um tanque elétrico no banheiro. Ligue um tempo antes do banho."]
  - pt_only: "Nada de chuveiro elétrico como no Brasil: aqui a água esquenta no tanque, e quando acaba, acaba."
  - ask: ["Say: the water heater isn't working.", "Diga: o aquecedor não funciona.", "Бојлерот не работи.", bojlerot, ne-raboti]
  - ask: ["Say: there's no hot water!", "Diga: não tem água quente!", "Нема топла вода!", nema, topla-voda]
  - ask: ["Vera sighs: again? Say it.", "A Vera suspira: de novo? Diga.", "Пак?", pak]
  - ask: ["Say for her: I'll call the repairman. (just: the repairman)", "Diga: o técnico.", "Мајсторот.", majstorot]
  - ask: ["Tell him where it is: in the bathroom.", "Diga onde está: no banheiro.", "Во бањата.", vo, banjata]
  - ask: ["Ask him: can you fix it today?", "Pergunte: o senhor pode consertar hoje?", "Можете ли да го поправите денеска?", mozete-li, da-go-popravite, denes]
  - ask: ["Answer for him: I can.", "Responda por ele: posso.", "Можам.", mozam]
  - ask: ["Say: it needs a new part.", "Diga: precisa de uma peça nova.", "Треба нов дел.", treba, del]
  - ask: ["Ask how long.", "Pergunte quanto tempo.", "Колку време?", vreme]
  - ask: ["He says one hour.", "Ele diz uma hora.", "Еден час.", eden, cas]
  - ask: ["Offer him a coffee.", "Ofereça um café.", "Сакате ли кафе?", sakate-li, kafe]
