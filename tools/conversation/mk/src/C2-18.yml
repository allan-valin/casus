id: C2-18
protagonist: m
title: ["The journalist", "O jornalista"]
situation: ["A newspaper is writing about foreigners in Skopje. The journalist interviews you.", "Um jornal está escrevendo sobre estrangeiros em Skopje. O jornalista entrevista você."]
learn: [c2-register]
culture: —
items:
  - [integracija, "интеграција", "integration", "integração"]
  - [zosto-ostanavte, "Зошто останавте?", "Why did you stay?", "Por que o senhor ficou?"]
  - [najgolem-predizvik, "најголем предизвик", "the biggest challenge", "o maior desafio"]
  - [birokratijata, "бирократијата", "bureaucracy", "a burocracia"]
  - [toplinata-na-lugjeto, "топлината на луѓето", "the warmth of the people", "o calor humano"]
  - [kako-domasni, "како домашни", "like locals", "como locais"]
  - [poraka-do-stranci, "порака до другите странци", "a message to other foreigners", "um recado para outros estrangeiros"]
  - [naucete-go-jazikot, "научете го јазикот", "learn the language", "aprendam a língua"]
  - [klucot-za-se, "клучот за сè", "the key to everything", "a chave de tudo"]
  - [smeam-li-da-ve-citiram, "смеам ли да ве цитирам", "may I quote you", "posso citar o senhor"]
dialogue:
  - [novinar, "Зошто останавте во Скопје?", "Why did you stay in Skopje?", "Por que o senhor ficou em Skopje?"]
  - [protagonist, "Поради топлината на луѓето. Ме прифатија како домашен.", "Because of the warmth of the people. They accepted me like a local.", "Pelo calor humano. Me acolheram como se eu fosse daqui."]
  - [novinar, "Најголемиот предизвик?", "The biggest challenge?", "O maior desafio?"]
  - [protagonist, "Бирократијата — и падежите што ги немате, ама ги имате во заменките!", "Bureaucracy — and the cases you don't have, but do have in the pronouns!", "A burocracia — e os casos que vocês não têm, mas têm nos pronomes!"]
  - [novinar, "А интеграцијата?", "And integration?", "E a integração?"]
  - [protagonist, "Интеграцијата почнува со јазикот. Тој е клучот за сè.", "Integration starts with the language. It's the key to everything.", "A integração começa pela língua. Ela é a chave de tudo."]
  - [novinar, "Порака до другите странци?", "A message to other foreigners?", "Um recado para outros estrangeiros?"]
  - [protagonist, "Научете го јазикот, и пијте кафе со соседите.", "Learn the language, and drink coffee with your neighbours.", "Aprendam a língua, e tomem café com os vizinhos."]
  - [novinar, "Смеам ли да ве цитирам?", "May I quote you?", "Posso citar o senhor?"]
teach:
  - ask: ["He asks: why did you stay?", "Ele pergunta: por que o senhor ficou?", "Зошто останавте?", zosto-ostanavte]
  - ask: ["Say: because of the warmth of the people.", "Diga: pelo calor humano.", "Поради топлината на луѓето.", toplinata-na-lugjeto]
  - ask: ["Say: they accepted me like a local.", "Diga: me acolheram como um local.", "Ме прифатија како домашен.", kako-domasni]
  - ask: ["Say: the biggest challenge — bureaucracy.", "Diga: o maior desafio — a burocracia.", "Најголемиот предизвик — бирократијата.", najgolem-predizvik, birokratijata]
  - ask: ["Say: integration starts with the language.", "Diga: a integração começa pela língua.", "Интеграцијата почнува со јазикот.", integracija]
  - ask: ["Say: it's the key to everything.", "Diga: é a chave de tudo.", "Тој е клучот за сè.", klucot-za-se]
  - ask: ["Say: a message to other foreigners.", "Diga: um recado para outros estrangeiros.", "Порака до другите странци.", poraka-do-stranci]
  - ask: ["Say: learn the language!", "Diga: aprendam a língua!", "Научете го јазикот!", naucete-go-jazikot]
  - ask: ["He asks: may I quote you?", "Ele pergunta: posso citar o senhor?", "Смеам ли да ве цитирам?", smeam-li-da-ve-citiram]
  - note: ["For print you speak in quotable lines: short, concrete, warm. Macedonian lost its noun cases but kept them in pronouns (него, му, го) — a fair complaint for the newspaper.", "Para o jornal, fale em frases citáveis: curtas, concretas, calorosas. O macedônio perdeu os casos nos substantivos mas manteve nos pronomes (него, му, го) — reclamação justa para o jornal."]
