id: C1-11
protagonist: f
title: ["A funeral", "Um funeral"]
situation: ["Vera's brother has died. You visit her with Bojan.", "O irmão da Vera morreu. Você visita ela com o Bojan."]
learn: [c1-particles]
culture: The 40-day memorial
items:
  - [iskreno-socuvstvo, "Искрено сочувство", "My sincere condolences", "Meus sinceros pêsames"]
  - [bog-da-go-prosti, "Бог да го прости", "May God rest his soul", "Que Deus o tenha"]
  - [pocina, "почина", "passed away", "faleceu"]
  - [ve-boli, "ве боли", "it hurts you, you're grieving", "dói na senhora"]
  - [eh, "ех", "ah, oh (sigh)", "ai / ah"]
  - [cetirieseti-den, "четириесетница", "forty-day memorial", "missa de quarenta dias", {rare: true}]
  - [panihida, "панихида", "memorial service", "missa / culto fúnebre", {rare: true}]
  - [zito, "жито", "boiled wheat (memorial food)", "trigo cozido (comida do luto)", {rare: true}]
  - [da-ste-zivi-vie, "да сте живи вие", "may you live (condolence)", "que a senhora tenha vida"]
  - [ako-vi-treba-nesto, "ако ви треба нешто", "if you need anything", "se precisar de alguma coisa"]
dialogue:
  - [protagonist, "Вера... искрено сочувство. Бог да го прости.", "Vera... my sincere condolences. May God rest his soul.", "Vera... meus sinceros pêsames. Que Deus o tenha."]
  - [vera, "Благодарам, душо. Да сте живи вие.", "Thank you, dear. May you live.", "Obrigada, querida. Que vocês tenham vida."]
  - [bojan, "Кога почина?", "When did he pass away?", "Quando ele faleceu?"]
  - [vera, "Во вторник. Ех, беше постар од мене само две години...", "On Tuesday. Ah, he was only two years older than me...", "Na terça. Ai, ele era só dois anos mais velho que eu..."]
  - [protagonist, "Знам колку ве боли.", "I know how much it hurts.", "Sei o quanto dói."]
  - [vera, "На четириесетница ќе има панихида. Ќе дојдете?", "At the forty-day memorial there'll be a service. Will you come?", "Na missa de quarenta dias vai ter culto. Vocês vêm?"]
  - [bojan, "Секако. Ќе донесеме нешто.", "Of course. We'll bring something.", "Claro. A gente leva alguma coisa."]
  - [vera, "Жито ќе правам јас. Само дојдете.", "I'll make the wheat. Just come.", "O trigo eu faço. Só venham."]
  - [protagonist, "Ако ви треба нешто — било што — кажете ни.", "If you need anything — anything — tell us.", "Se precisar de alguma coisa — qualquer coisa — fale com a gente."]
teach:
  - ask: ["Offer condolences.", "Dê os pêsames.", "Искрено сочувство.", iskreno-socuvstvo]
  - ask: ["Add: may God rest his soul.", "Acrescente: que Deus o tenha.", "Бог да го прости.", bog-da-go-prosti]
  - ask: ["Vera's answer: may you live.", "A resposta da Vera: que vocês tenham vida.", "Да сте живи вие.", da-ste-zivi-vie]
  - ask: ["Ask when he passed away.", "Pergunte quando ele faleceu.", "Кога почина?", pocina]
  - ask: ["Vera sighs: ah…", "A Vera suspira: ai…", "Ех…", eh]
  - ask: ["Say: I know how much it hurts.", "Diga: sei o quanto dói.", "Знам колку ве боли.", ve-boli]
  - ask: ["Say: the forty-day memorial.", "Diga: a missa de quarenta dias.", "Четириесетница.", cetirieseti-den]
  - ask: ["Say: a memorial service.", "Diga: um culto fúnebre.", "Панихида.", panihida]
  - ask: ["Say: the boiled wheat.", "Diga: o trigo cozido.", "Жито.", zito]
  - ask: ["Say: if you need anything, tell us.", "Diga: se precisar de alguma coisa, fale com a gente.", "Ако ви треба нешто, кажете ни.", ako-vi-treba-nesto]
  - note: ["Set phrases do the work at a death: 'Искрено сочувство', 'Бог да го прости'; the family answers 'Да сте живи'. Memorials follow at 40 days, six months and a year, with boiled wheat (жито) shared by everyone.", "Frases feitas fazem o trabalho num luto: 'Искрено сочувство', 'Бог да го прости'; a família responde 'Да сте живи'. Há memórias aos 40 dias, seis meses e um ano, com trigo cozido (жито) para todos."]
