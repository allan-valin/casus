id: B1-22
protagonist: m
title: ["It had already gone", "Tinha terminado"]
situation: ["You missed the bus to Sara's parents. You tell her what happened, in order.", "Você perdeu o ônibus para a casa dos pais da Sara. Conta para ela o que aconteceu, na ordem."]
learn: [b1-pluperfect]
culture: —
items:
  - [sto-se-sluci, "Што се случи?", "What happened?", "O que aconteceu?"]
  - [prvo, "прво", "first", "primeiro"]
  - [bev-zavrsil, "бев завршил", "I had finished (a man)", "eu tinha terminado"]
  - [bese-zaminal, "беше заминал", "had left (masculine)", "tinha saído / partido"]
  - [koga-stignav, "кога стигнав", "when I arrived", "quando cheguei"]
  - [potoa-zemav, "потоа зедов", "then I took", "depois peguei"]
  - [taksi, "такси", "taxi", "táxi"]
  - [na-krajot, "на крајот", "in the end", "no fim"]
  - [sepak, "сепак", "still, nevertheless", "mesmo assim"]
  - [na-vreme, "на време", "on time", "na hora / a tempo"]
dialogue:
  - [sara, "Што се случи? Те чекавме цел час!", "What happened? We waited for you a whole hour!", "O que aconteceu? A gente te esperou uma hora inteira!"]
  - [protagonist, "Прво, работата. Ана ме задржа.", "First, work. Ana kept me.", "Primeiro, o trabalho. A Ana me segurou."]
  - [protagonist, "Кога бев завршил, веќе беше шест.", "By the time I'd finished, it was already six.", "Quando terminei, já eram seis."]
  - [protagonist, "Кога стигнав на станицата, автобусот веќе беше заминал.", "When I got to the stop, the bus had already left.", "Quando cheguei no ponto, o ônibus já tinha saído."]
  - [sara, "И што направи?", "And what did you do?", "E o que você fez?"]
  - [protagonist, "Потоа зедов такси, но имаше гужва.", "Then I took a taxi, but there was traffic.", "Depois peguei um táxi, mas tinha trânsito."]
  - [sara, "А на крајот?", "And in the end?", "E no fim?"]
  - [protagonist, "На крајот сепак стигнав — за десерт!", "In the end I still made it — for dessert!", "No fim cheguei mesmo assim — para a sobremesa!"]
  - [sara, "Следниот пат, тргни на време.", "Next time, leave on time.", "Da próxima vez, sai na hora."]
teach:
  - ask: ["Sara asks what happened.", "A Sara pergunta o que aconteceu.", "Што се случи?", sto-se-sluci]
  - ask: ["Say: first, work.", "Diga: primeiro, o trabalho.", "Прво, работата.", prvo, rabota]
  - note: ["To put one past before another: бев / беше + the л-form. 'Автобусот веќе беше заминал' — the bus had already left (before I arrived).", "Para pôr um passado antes de outro: бев / беше + a forma em -л. 'Автобусот веќе беше заминал' — o ônibus já tinha saído (antes de eu chegar)."]
  - ask: ["Say: by the time I had finished…", "Diga: quando eu tinha terminado…", "Кога бев завршил…", bev-zavrsil]
  - ask: ["Say: when I got to the stop…", "Diga: quando cheguei no ponto…", "Кога стигнав на станицата…", koga-stignav, stanicata]
  - ask: ["Say: the bus had already left.", "Diga: o ônibus já tinha saído.", "Автобусот веќе беше заминал.", avtobusot, bese-zaminal]
  - ask: ["Say: then I took a taxi.", "Diga: depois peguei um táxi.", "Потоа зедов такси.", potoa-zemav, taksi]
  - ask: ["Say: but there was traffic.", "Diga: mas tinha trânsito.", "Но имаше гужва.", guzva]
  - ask: ["Say: in the end I still made it.", "Diga: no fim cheguei mesmo assim.", "На крајот сепак стигнав.", na-krajot, sepak]
  - ask: ["Sara: leave on time next time.", "A Sara: da próxima vez, sai na hora.", "Следниот пат, тргни на време.", sledniot-pat, na-vreme]
