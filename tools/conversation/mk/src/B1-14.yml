id: B1-14
protagonist: m
title: ["If I had known…", "Se eu tivesse…"]
situation: ["The morning after the wedding. Your head hurts; Sara laughs.", "A manhã depois do casamento. Sua cabeça dói; a Sara ri."]
learn: [b1-if-unreal]
culture: —
items:
  - [da-znaev, "да знаев", "if I had known", "se eu soubesse / tivesse sabido"]
  - [ne-ke-pievme, "немаше да пиев", "I wouldn't have drunk", "não teria bebido"]
  - [ke-dojdev, "ќе дојдев", "I would have come", "eu teria vindo"]
  - [da-ne-bese, "да не беше", "if it hadn't been for", "se não fosse"]
  - [glavobolka, "главоболка", "headache", "dor de cabeça", {rare: true}]
  - [vodata, "водата", "the water", "a água"]
  - [poranesno, "порано", "earlier", "mais cedo"]
  - [si-legnav, "си легнав", "I went to bed", "fui dormir"]
  - [ti-velev, "ти велев", "I told you (so)", "eu te disse"]
  - [nikogas-veke, "никогаш повеќе", "never again", "nunca mais"]
dialogue:
  - [sara, "Добро утро! Како е главата?", "Good morning! How's the head?", "Bom dia! Como está a cabeça?"]
  - [protagonist, "Ужас. Имам главоболка.", "Terrible. I have a headache.", "Horrível. Estou com dor de cabeça."]
  - [sara, "Ти велев: не мешај вино и ракија!", "I told you: don't mix wine and rakija!", "Eu te disse: não mistura vinho e rakija!"]
  - [protagonist, "Да знаев, немаше да пиев толку.", "If I'd known, I wouldn't have drunk so much.", "Se eu soubesse, não teria bebido tanto."]
  - [sara, "Да си легнеше порано, ќе беше подобро.", "If you'd gone to bed earlier, it would have been better.", "Se você tivesse ido dormir mais cedo, teria sido melhor."]
  - [protagonist, "Да не беше орото, ќе си легнев во полноќ!", "If it hadn't been for the oro, I'd have gone to bed at midnight!", "Se não fosse o oro, eu teria ido dormir à meia-noite!"]
  - [sara, "Пиј вода. Многу вода.", "Drink water. Lots of water.", "Bebe água. Muita água."]
  - [protagonist, "Никогаш повеќе... до следната свадба.", "Never again... until the next wedding.", "Nunca mais... até o próximo casamento."]
teach:
  - note: ["Unreal past: да + the imperfect, then ќе + the imperfect. 'Да знаев, ќе дојдев' — if I had known, I would have come. Negative: 'немаше да' — немаше да пиев, I wouldn't have drunk.", "Passado irreal: да + imperfeito, depois ќе + imperfeito. 'Да знаев, ќе дојдев' — se eu soubesse, teria vindo. Negativo: 'немаше да' — немаше да пиев, não teria bebido."]
  - ask: ["Say: I have a headache.", "Diga: estou com dor de cabeça.", "Имам главоболка.", glavobolka]
  - ask: ["Sara: I told you! How?", "A Sara: eu te disse! Como?", "Ти велев!", ti-velev]
  - ask: ["Say: if I'd known…", "Diga: se eu soubesse…", "Да знаев…", da-znaev]
  - ask: ["Say: I wouldn't have drunk so much.", "Diga: não teria bebido tanto.", "Немаше да пиев толку.", ne-ke-pievme, tolku]
  - ask: ["Say: if I'd known, I would have come.", "Diga: se eu soubesse, teria vindo.", "Да знаев, ќе дојдев.", da-znaev, ke-dojdev]
  - ask: ["Say: if it hadn't been for the oro…", "Diga: se não fosse o oro…", "Да не беше орото…", da-ne-bese, oro]
  - ask: ["Say: I went to bed at midnight.", "Diga: fui dormir à meia-noite.", "Си легнав во полноќ.", si-legnav, polnokj]
  - ask: ["Say: earlier.", "Diga: mais cedo.", "Порано.", poranesno]
  - ask: ["Sara: drink water!", "A Sara: bebe água!", "Пиј вода!", vodata]
  - ask: ["Say: never again!", "Diga: nunca mais!", "Никогаш повеќе!", nikogas-veke]
