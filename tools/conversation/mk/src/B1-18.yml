id: B1-18
protagonist: m
title: ["Freedom", "Liberdade"]
situation: ["Late at the кафана, Goran gets philosophical.", "Tarde da noite na кафана, o Goran fica filosófico."]
learn: [b1-cause-conj]
culture: One party then, elections now
items:
  - [najvazno, "најважно", "most important", "o mais importante"]
  - [zivotot, "животот", "life", "a vida"]
  - [slobodata, "слободата", "freedom", "a liberdade"]
  - [da-izbiram, "да избирам", "to choose", "escolher"]
  - [slobodno-vreme, "слободно време", "free time", "tempo livre"]
  - [pravo-right, "право", "right (a right)", "direito"]
  - [sto-misli, "што мисли", "what (he/she) thinks", "o que pensa"]
  - [partija, "партија", "party (political)", "partido", {rare: true}]
  - [izbori, "избори", "elections", "eleições"]
  - [iako, "иако", "although", "embora"]
  - [diktatura, "диктатура", "dictatorship", "ditadura", {rare: true}]
dialogue:
  - [goran, "Што ти е најважно во животот?", "What's most important to you in life?", "O que é mais importante para você na vida?"]
  - [protagonist, "Слободата. Да можам да избирам.", "Freedom. Being able to choose.", "A liberdade. Poder escolher."]
  - [goran, "Слободно време или слобода на говор?", "Free time or free speech?", "Tempo livre ou liberdade de expressão?"]
  - [protagonist, "И двете! Секој има право да каже што мисли.", "Both! Everyone has the right to say what they think.", "Os dois! Todo mundo tem o direito de dizer o que pensa."]
  - [goran, "Порано тоа не беше лесно. Во Југославија имаше една партија.", "In the past that wasn't easy. In Yugoslavia there was one party.", "Antigamente não era fácil. Na Iugoslávia tinha um partido só."]
  - [protagonist, "А сега?", "And now?", "E agora?"]
  - [goran, "Сега има избори, иако не сме секогаш задоволни од нив.", "Now there are elections, although we're not always happy with them.", "Agora tem eleições, embora a gente nem sempre fique satisfeito."]
  - [protagonist, "Кај нас исто — имавме диктатура до 1985.", "Same where I come from — we had a dictatorship until 1985.", "Lá no Brasil também — tivemos ditadura até 1985."]
teach:
  - ask: ["Ask what's most important to him in life.", "Pergunte o que é mais importante para ele na vida.", "Што ти е најважно во животот?", najvazno, zivotot]
  - ask: ["Say: freedom. Being able to choose.", "Diga: a liberdade. Poder escolher.", "Слободата. Да можам да избирам.", slobodata, da-izbiram]
  - ask: ["Say: free time.", "Diga: tempo livre.", "Слободно време.", slobodno-vreme]
  - ask: ["Say: everyone has the right to say what they think.", "Diga: todo mundo tem o direito de dizer o que pensa.", "Секој има право да каже што мисли.", sekoj, pravo-right, sto-misli]
  - ask: ["Say: there was one party.", "Diga: tinha um partido só.", "Имаше една партија.", partija]
  - note: ["'Иако' — although — joins two ideas that pull against each other: 'има избори, иако не сме секогаш задоволни'.", "'Иако' — embora — liga duas ideias que se contrariam: 'има избори, иако не сме секогаш задоволни'."]
  - ask: ["Say: now there are elections.", "Diga: agora tem eleições.", "Сега има избори.", izbori]
  - ask: ["Say: although we're not always happy.", "Diga: embora nem sempre a gente fique satisfeito.", "Иако не сме секогаш задоволни.", iako, sekogas]
  - ask: ["Say: we had a dictatorship until 1985.", "Diga: tivemos ditadura até 1985.", "Имавме диктатура до 1985.", diktatura]
  - note: ["Yugoslavia was a one-party socialist state until 1990; North Macedonia has held multi-party elections since then. Politics is a frequent topic — listen first, and keep your own verdicts for close friends.", "A Iugoslávia foi um Estado socialista de partido único até 1990; a Macedônia do Norte tem eleições multipartidárias desde então. Política é assunto frequente — escute primeiro, e guarde suas opiniões para os amigos próximos."]
