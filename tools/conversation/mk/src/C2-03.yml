id: C2-03
protagonist: f
title: ["A TV interview", "Uma entrevista na TV"]
situation: ["Local TV wants a foreigner's view of the club's success. Camera, microphone, live.", "A TV local quer a visão de uma estrangeira sobre o sucesso do clube. Câmera, microfone, ao vivo."]
learn: [c2-register]
culture: —
items:
  - [gledacite, "гледачите", "the viewers", "os telespectadores"]
  - [izjava, "изјава", "statement", "declaração"]
  - [vo-zivo, "во живо", "live", "ao vivo"]
  - [bi-sakala-da-istaknam, "би сакала да истакнам", "I'd like to emphasise", "gostaria de destacar", {rare: true}]
  - [zaednicata, "заедницата", "the community", "a comunidade"]
  - [uspehot, "успехот", "the success", "o sucesso"]
  - [ne-e-slucaen, "не е случаен", "is no accident", "não é por acaso"]
  - [poraka-do-mladite, "порака до младите", "a message to young people", "um recado para os jovens"]
  - [ne-se-otkazuvajte, "не се откажувајте", "don't give up (formal/plural)", "não desistam"]
  - [blagodaram-na-pokanata, "благодарам на поканата", "thank you for the invitation", "obrigada pelo convite"]
dialogue:
  - [novinar, "Добровечер, драги гледачи, во живо од спортската сала.", "Good evening, dear viewers, live from the sports hall.", "Boa noite, queridos telespectadores, ao vivo do ginásio."]
  - [novinar, "Изјава за успехот на клубот?", "A statement on the club's success?", "Uma declaração sobre o sucesso do clube?"]
  - [protagonist, "Би сакала да истакнам дека успехот не е случаен.", "I'd like to emphasise that the success is no accident.", "Gostaria de destacar que o sucesso não é por acaso."]
  - [protagonist, "Тој е резултат на заедницата — играчи, тренери, родители.", "It is the result of the community — players, coaches, parents.", "É resultado da comunidade — jogadores, técnicos, pais."]
  - [novinar, "Порака до младите?", "A message to young people?", "Um recado para os jovens?"]
  - [protagonist, "Не се откажувајте. И јас дојдов без збор македонски.", "Don't give up. I too came without a word of Macedonian.", "Não desistam. Eu também cheguei sem uma palavra de macedônio."]
  - [novinar, "Благодарам.", "Thank you.", "Obrigado."]
  - [protagonist, "Благодарам на поканата.", "Thank you for the invitation.", "Obrigada pelo convite."]
  - [marko, "На телевизија зборуваш како министерка!", "On TV you talk like a minister!", "Na TV você fala como ministra!"]
teach:
  - ask: ["Say: dear viewers.", "Diga: queridos telespectadores.", "Драги гледачи.", gledacite]
  - ask: ["Say: live.", "Diga: ao vivo.", "Во живо.", vo-zivo]
  - ask: ["Say: a statement.", "Diga: uma declaração.", "Изјава.", izjava]
  - ask: ["Say: I'd like to emphasise…", "Diga: gostaria de destacar…", "Би сакала да истакнам…", bi-sakala-da-istaknam]
  - ask: ["Say: the success is no accident.", "Diga: o sucesso não é por acaso.", "Успехот не е случаен.", uspehot, ne-e-slucaen]
  - ask: ["Say: the result of the community.", "Diga: resultado da comunidade.", "Резултат на заедницата.", zaednicata]
  - ask: ["Say: a message to young people.", "Diga: um recado para os jovens.", "Порака до младите.", poraka-do-mladite]
  - ask: ["Say: don't give up.", "Diga: não desistam.", "Не се откажувајте.", ne-se-otkazuvajte]
  - ask: ["Say: thank you for the invitation.", "Diga: obrigada pelo convite.", "Благодарам на поканата.", blagodaram-na-pokanata]
  - note: ["Public register raises the words: 'истакнам' instead of 'кажам', 'резултат на заедницата' instead of 'сите работевме'. Marko notices — friends hear the switch at once.", "O registro público eleva as palavras: 'истакнам' em vez de 'кажам', 'резултат на заедницата' em vez de 'сите работевме'. O Marko percebe — amigos ouvem a troca na hora."]
