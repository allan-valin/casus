id: B2-07
protagonist: f
title: ["First day", "Primeiro dia"]
situation: ["Vardar Soft. Mr Nikolovski introduces the team; Darko shows you around.", "Vardar Soft. O senhor Nikolovski apresenta a equipe; o Darko mostra o lugar."]
learn: [b2-topic-doubling]
culture: —
items:
  - [timot, "тимот", "the team", "a equipe"]
  - [rakovoditel, "раководител", "manager, head", "gerente / chefe"]
  - [proektot, "проектот", "the project", "o projeto"]
  - [go-vodi, "го води", "leads it, runs it", "comanda / coordena"]
  - [kancelarijata, "канцеларијата", "the office (room)", "a sala"]
  - [kujnicka, "кујничката", "the little kitchen", "a copa"]
  - [lozinka, "лозинка", "password", "senha", {rare: true}]
  - [ja-dobiv, "ја добив", "I got it", "recebi"]
  - [prasaj-me, "Прашај ме", "Ask me (informal)", "Me pergunta"]
  - [bilo-koga, "било кога", "any time", "a qualquer hora"]
dialogue:
  - [nikolovski, "Ова е тимот. Дарко е раководител на проектот.", "This is the team. Darko is the project lead.", "Esta é a equipe. O Darko é o gerente do projeto."]
  - [darko, "Добредојде! Проектот го водам јас, но сите одлучуваме заедно.", "Welcome! I lead the project, but we all decide together.", "Bem-vinda! O projeto quem coordena sou eu, mas todo mundo decide junto."]
  - [protagonist, "Мило ми е. Каде ми е местото?", "Nice to meet you. Where's my place?", "Prazer. Onde fica o meu lugar?"]
  - [darko, "Тука, во оваа канцеларија. А кујничката е лево.", "Here, in this office. And the little kitchen is on the left.", "Aqui, nesta sala. E a copa é à esquerda."]
  - [protagonist, "Лозинката за компјутерот?", "The password for the computer?", "A senha do computador?"]
  - [darko, "Лозинката ти ја пратив на мејл.", "I sent you the password by e-mail.", "A senha eu te mandei por e-mail."]
  - [protagonist, "Ја добив, благодарам.", "I got it, thanks.", "Recebi, obrigada."]
  - [darko, "Ако нешто ти треба, прашај ме било кога.", "If you need anything, ask me any time.", "Se precisar de alguma coisa, me pergunta a qualquer hora."]
teach:
  - ask: ["Say: this is the team.", "Diga: esta é a equipe.", "Ова е тимот.", timot]
  - ask: ["Say: Darko is the manager.", "Diga: o Darko é o gerente.", "Дарко е раководител.", rakovoditel]
  - note: ["When a known object comes first, the short pronoun repeats it: 'Проектот го водам јас' — the project, I lead it. 'Лозинката ти ја пратив' — the password, I sent it to you. Leaving it out sounds foreign.", "Quando o objeto conhecido vem primeiro, o pronome curto o repete: 'Проектот го водам јас' — o projeto, quem coordena sou eu. 'Лозинката ти ја пратив' — a senha, eu te mandei. Sem ele soa estrangeiro."]
  - ask: ["Say: I lead the project.", "Diga: o projeto quem coordena sou eu.", "Проектот го водам јас.", proektot, go-vodi]
  - ask: ["Say: in this office.", "Diga: nesta sala.", "Во оваа канцеларија.", kancelarijata]
  - ask: ["Say: the little kitchen is on the left.", "Diga: a copa é à esquerda.", "Кујничката е лево.", kujnicka, levo]
  - ask: ["Ask: the password?", "Pergunte: a senha?", "Лозинката?", lozinka]
  - ask: ["Say: I got it.", "Diga: recebi.", "Ја добив.", ja-dobiv]
  - ask: ["Darko: ask me any time.", "O Darko: me pergunta a qualquer hora.", "Прашај ме било кога.", prasaj-me, bilo-koga]
