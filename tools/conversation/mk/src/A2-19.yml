id: A2-19
protagonist: f
title: ["Ohrid (2)", "Ohrid (2)"]
situation: ["A boat on the lake, then up to Samuel's Fortress.", "Um passeio de barco no lago, depois a subida até a fortaleza de Samuel."]
learn: [a2-l-form]
culture: Tsar Samuel's capital
items:
  - [dali-si-bila, "Дали си била…?", "Have you (ever) been…? (to a woman, informal)", "Você já esteve…? (para mulher)"]
  - [nekogas, "некогаш", "ever / once", "alguma vez / uma vez"]
  - [brod, "брод", "boat, ship", "barco"]
  - [sum-bila, "сум била", "I have been (a woman)", "já estive (mulher)"]
  - [tvrdinata, "тврдината", "the fortress", "a fortaleza", {rare: true}]
  - [kolku-e-stara, "Колку е стара?", "How old is it? (feminine)", "Quantos anos ela tem?"]
  - [glavniot-grad, "главниот град", "the capital", "a capital"]
  - [slikaj-me, "Сликај ме!", "Take my picture! (informal)", "Tira uma foto minha!"]
  - [nasmevni-se, "Насмевни се!", "Smile! (informal)", "Sorria!", {rare: true}]
  - [ocite, "очите", "the eyes", "os olhos"]
  - [uste-edna, "Уште една!", "One more!", "Mais uma!"]
dialogue:
  - [ana, "Дали си била некогаш на брод?", "Have you ever been on a boat?", "Você já andou de barco?"]
  - [protagonist, "Да, сум била, во Рио. Но ова е поубаво.", "Yes, I have, in Rio. But this is nicer.", "Já, no Rio. Mas este é mais bonito."]
  - [ana, "Погледни горе — тврдината на Самоил.", "Look up — Samuel's Fortress.", "Olha lá em cima — a fortaleza de Samuel."]
  - [protagonist, "Колку е стара?", "How old is it?", "Quantos anos ela tem?"]
  - [ana, "Околу илјада години. Охрид беше главниот град на цар Самоил.", "About a thousand years. Ohrid was Tsar Samuel's capital.", "Uns mil anos. Ohrid era a capital do tsar Samuel."]
  - [protagonist, "Сликај ме, те молам!", "Take my picture, please!", "Tira uma foto minha, por favor!"]
  - [ana, "Насмевни се! ... Еве.", "Smile! ... There.", "Sorria! ... Pronto."]
  - [protagonist, "Не, затворени ми се очите! Уште една!", "No, my eyes are closed! One more!", "Não, saí de olho fechado! Mais uma!"]
teach:
  - note: ["To say what you have done in your life, Macedonian uses сум with an -л form that agrees with you: сум била (a woman), сум бил (a man). 'Те молам' is the informal 'please'.", "Para dizer o que você já fez na vida, o macedônio usa сум com uma forma em -л que concorda com você: сум била (mulher), сум бил (homem). 'Те молам' é o 'por favor' informal."]
  - ask: ["Ana asks if you've ever been on a boat. How?", "A Ana pergunta se você já andou de barco. Como?", "Дали си била некогаш на брод?", dali-si-bila, nekogas, brod]
  - ask: ["Answer: yes, I have, in Rio.", "Responda: já, no Rio.", "Да, сум била, во Рио.", sum-bila]
  - ask: ["Say: but this is nicer.", "Diga: mas este é mais bonito.", "Но ова е поубаво.", no-but, poubavo]
  - ask: ["Say: Samuel's Fortress.", "Diga: a fortaleza de Samuel.", "Тврдината на Самоил.", tvrdinata]
  - ask: ["Ask how old it is.", "Pergunte quantos anos ela tem.", "Колку е стара?", kolku-e-stara]
  - ask: ["Say: Ohrid was the capital.", "Diga: Ohrid era a capital.", "Охрид беше главниот град.", bese, glavniot-grad]
  - ask: ["Ask her to take your picture.", "Peça para ela tirar uma foto sua.", "Сликај ме, те молам!", slikaj-me]
  - ask: ["Say for her: smile!", "Diga por ela: sorria!", "Насмевни се!", nasmevni-se]
  - ask: ["Say: my eyes are closed!", "Diga: saí de olho fechado!", "Затворени ми се очите!", ocite]
  - ask: ["Ask for one more.", "Peça mais uma.", "Уште една!", uste-edna]
  - note: ["Around the year 1000 Ohrid was the capital of Tsar Samuel's empire, and long before that a centre of Slavic writing: Saint Clement taught there in the 9th century.", "Por volta do ano 1000, Ohrid era a capital do império do tsar Samuel, e muito antes disso um centro da escrita eslava: São Clemente ensinou ali no século IX."]
