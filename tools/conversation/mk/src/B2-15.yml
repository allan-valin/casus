id: B2-15
protagonist: f
title: ["Truth", "Verdade"]
situation: ["Ana shows you a shocking headline that everyone at the office is sharing.", "A Ana mostra uma manchete chocante que todo mundo no escritório está compartilhando."]
learn: [b2-impersonal]
culture: Checking a source
items:
  - [naslovot, "насловот", "the headline", "a manchete"]
  - [se-spodeluva, "се споделува", "is being shared", "está sendo compartilhado"]
  - [lazna-vest, "лажна вест", "fake news", "notícia falsa"]
  - [izvor, "извор", "source", "fonte"]
  - [kade-pisuva, "Каде пишува?", "Where is it written?", "Onde está escrito?"]
  - [sajt, "сајт", "website", "site"]
  - [nepoznat, "непознат", "unknown (masculine)", "desconhecido"]
  - [proveri, "провери", "check (informal)", "verifica"]
  - [vistina, "вистина", "truth, true", "verdade"]
  - [se-pretera, "се претера", "it's exaggerated", "é exagerado", {rare: true}]
dialogue:
  - [ana, "Види го насловот: „Од утре без струја цела зима!“ Сите го споделуваат.", "Look at the headline: 'No electricity all winter from tomorrow!' Everyone's sharing it.", "Olha a manchete: 'A partir de amanhã sem luz o inverno todo!' Todo mundo está compartilhando."]
  - [protagonist, "Каде пишува тоа? Кој е изворот?", "Where does it say that? What's the source?", "Onde está escrito isso? Qual é a fonte?"]
  - [ana, "Некој сајт. Не го знам.", "Some website. I don't know it.", "Um site qualquer. Não conheço."]
  - [protagonist, "Непознат сајт, без автор, со многу извичници?", "An unknown site, no author, lots of exclamation marks?", "Site desconhecido, sem autor, cheio de exclamação?"]
  - [ana, "Значи, лажна вест?", "So, fake news?", "Então, notícia falsa?"]
  - [protagonist, "Провери на страницата на електродистрибуцијата.", "Check the electricity company's website.", "Verifica no site da distribuidora de energia."]
  - [ana, "Ништо нема таму. Се претерало.", "Nothing there. It's been blown out of proportion.", "Não tem nada lá. Exageraram."]
  - [protagonist, "Вистината е подосадна од насловите.", "The truth is more boring than the headlines.", "A verdade é mais chata que as manchetes."]
teach:
  - ask: ["Say: look at the headline.", "Diga: olha a manchete.", "Види го насловот.", naslovot]
  - ask: ["Say: everyone's sharing it.", "Diga: todo mundo está compartilhando.", "Се споделува насекаде.", se-spodeluva]
  - ask: ["Ask: where is it written?", "Pergunte: onde está escrito?", "Каде пишува?", kade-pisuva]
  - ask: ["Ask: what's the source?", "Pergunte: qual é a fonte?", "Кој е изворот?", izvor]
  - ask: ["Say: some website.", "Diga: um site qualquer.", "Некој сајт.", sajt, nekoj]
  - ask: ["Say: an unknown site.", "Diga: um site desconhecido.", "Непознат сајт.", nepoznat]
  - ask: ["Say: fake news.", "Diga: notícia falsa.", "Лажна вест.", lazna-vest]
  - ask: ["Say: check on the official site.", "Diga: verifica no site oficial.", "Провери на официјалната страница.", proveri]
  - ask: ["Say: it's been exaggerated.", "Diga: exageraram.", "Се претерало.", se-pretera]
  - ask: ["Say: the truth is more boring.", "Diga: a verdade é mais chata.", "Вистината е подосадна.", vistina]
  - note: ["Three quick checks: who wrote it (a named author?), where else it appears (official sites, several outlets?), and when (old news re-shared?). Shouting headlines are a warning sign.", "Três checagens rápidas: quem escreveu (autor com nome?), onde mais aparece (sites oficiais, vários veículos?), e quando (notícia velha recompartilhada?). Manchete gritando é sinal de alerta."]
