id: C1-26
protagonist: m
title: ["The coach retires", "O treinador se aposenta"]
situation: ["Coach Zoran is retiring after thirty years. The team asks you to give the speech.", "O técnico Zoran se aposenta depois de trinta anos. A equipe pede para você fazer o discurso."]
learn: [c1-renarrative-full]
culture: —
items:
  - [se-penzionira, "се пензионира", "is retiring", "se aposenta"]
  - [blagodarnost, "благодарност", "gratitude", "gratidão"]
  - [naslednik, "наследник", "successor", "sucessor", {rare: true}]
  - [velat-deka-pocnal, "велат дека почнал", "they say he started", "dizem que ele começou"]
  - [trieset-godini, "триесет години", "thirty years", "trinta anos"]
  - [generacii, "генерации", "generations", "gerações"]
  - [ne-ni-dozvoli, "не ни дозволи", "didn't let us", "não deixou a gente"]
  - [da-se-otkazeme, "да се откажеме", "to give up", "desistir"]
  - [ostanuva-vo-srceto, "останува во срцето", "stays in the heart", "fica no coração"]
  - [za-treneru, "за тренерот", "to the coach", "ao técnico"]
dialogue:
  - [protagonist, "Драги пријатели, денеска нашиот тренер се пензионира.", "Dear friends, today our coach retires.", "Queridos amigos, hoje o nosso técnico se aposenta."]
  - [protagonist, "Велат дека почнал во клубот пред триесет години, како играч.", "They say he started at the club thirty years ago, as a player.", "Dizem que ele começou no clube há trinta anos, como jogador."]
  - [protagonist, "Тренирал генерации. Јас сум само еден од нив — и најлошиот.", "He trained generations. I'm just one of them — and the worst.", "Treinou gerações. Eu sou só um deles — e o pior."]
  - [zoran, "Не е вистина!", "That's not true!", "Não é verdade!"]
  - [protagonist, "Тој никогаш не ни дозволи да се откажеме.", "He never let us give up.", "Ele nunca deixou a gente desistir."]
  - [protagonist, "Неговиот наследник има големи патики да ги наполни.", "His successor has big shoes to fill.", "O sucessor dele tem um tênis grande para calçar."]
  - [protagonist, "Зоране — со голема благодарност. Останувате во срцето на клубот.", "Zoran — with great gratitude. You stay in the heart of the club.", "Zoran — com muita gratidão. O senhor fica no coração do clube."]
  - [marko, "За тренерот — наздравје!", "To the coach — cheers!", "Ao técnico — saúde!"]
teach:
  - ask: ["Say: today our coach retires.", "Diga: hoje o nosso técnico se aposenta.", "Денеска нашиот тренер се пензионира.", se-penzionira, trener]
  - ask: ["Say: they say he started thirty years ago.", "Diga: dizem que ele começou há trinta anos.", "Велат дека почнал пред триесет години.", velat-deka-pocnal, trieset-godini]
  - ask: ["Say: he trained generations.", "Diga: treinou gerações.", "Тренирал генерации.", generacii]
  - ask: ["Say: he never let us give up.", "Diga: ele nunca deixou a gente desistir.", "Никогаш не ни дозволи да се откажеме.", ne-ni-dozvoli, da-se-otkazeme]
  - ask: ["Say: his successor.", "Diga: o sucessor dele.", "Неговиот наследник.", naslednik]
  - ask: ["Say: with great gratitude.", "Diga: com muita gratidão.", "Со голема благодарност.", blagodarnost]
  - ask: ["Say: you stay in the heart of the club.", "Diga: o senhor fica no coração do clube.", "Останувате во срцето на клубот.", ostanuva-vo-srceto]
  - ask: ["Marko: to the coach — cheers!", "O Marko: ao técnico — saúde!", "За тренерот — наздравје!", za-treneru, nazdravje]
  - note: ["In a speech, what you know only from stories goes in the л-form ('почнал', 'тренирал'); what you lived yourself goes in the plain past ('не ни дозволи'). The mix tells listeners which parts you witnessed.", "Num discurso, o que você só sabe de ouvir vai na forma em -л ('почнал', 'тренирал'); o que você viveu vai no passado comum ('не ни дозволи'). A mistura mostra o que você presenciou."]
