id: A2-03
protagonist: f
title: [The heart and health, O coração e a saúde]
situation: ["A check-up for work with Dr Petrovska, your family doctor.", "Um check-up do trabalho com a doutora Petrovska, sua médica de família."]
learn: [a2-future]
culture: —
items:
  - [pritisokot, "притисокот", "the blood pressure", "a pressão", {rare: true}]
  - [dali, "Дали…?", "(question word: is it…? does…?)", "(palavra de pergunta: será que…?)"]
  - [vo-red, "во ред", "all right, in order", "em ordem / tudo certo"]
  - [normalen, "нормален", "normal (masculine)", "normal"]
  - [srceto, "срцето", "the heart", "o coração"]
  - [krvta, "крвта", "the blood", "o sangue", {rare: true}]
  - [rezultatite, "резултатите", "the results", "os resultados", {rare: true}]
  - [ke-bidat, "ќе бидат", "will be (plural)", "vão estar / serão"]
  - [gotovi, "готови", "ready (plural)", "prontos"]
  - [treba-da, "треба да", "should / have to", "deve / tem que"]
  - [jadete-zdravo, "Јадете здраво", "Eat healthily (formal)", "Coma de forma saudável"]
  - [setajte, "шетајте", "walk (formal)", "caminhe"]
  - [sekoj-den, "секој ден", "every day", "todo dia"]
dialogue:
  - [doktorka, "Седнете. Прво притисокот.", "Sit down. First, the blood pressure.", "Sente-se. Primeiro, a pressão."]
  - [protagonist, "Дали е сѐ во ред?", "Is everything all right?", "Está tudo certo?"]
  - [doktorka, "Притисокот е нормален. И срцето е добро.", "Your blood pressure is normal. And your heart is fine.", "A pressão está normal. E o coração está bem."]
  - [protagonist, "А крвта?", "And the blood test?", "E o exame de sangue?"]
  - [doktorka, "Резултатите ќе бидат готови утре.", "The results will be ready tomorrow.", "Os resultados ficam prontos amanhã."]
  - [protagonist, "Што треба да правам?", "What should I do?", "O que eu devo fazer?"]
  - [doktorka, "Јадете здраво и шетајте секој ден.", "Eat healthily and walk every day.", "Coma de forma saudável e caminhe todo dia."]
  - [protagonist, "Секој ден? Добро, ќе шетам до работа.", "Every day? All right, I'll walk to work.", "Todo dia? Está bem, vou a pé para o trabalho."]
teach:
  - note: ["'Дали' starts a yes-no question, like 'ли' after the verb: 'Дали е сѐ во ред?' — is everything all right?", "'Дали' abre uma pergunta de sim ou não, como o 'ли' depois do verbo: 'Дали е сѐ во ред?' — está tudo certo?"]
  - ask: ["Ask: is everything all right?", "Pergunte: está tudo certo?", "Дали е сѐ во ред?", dali, sve, vo-red]
  - ask: ["Say for her: the blood pressure is normal.", "Diga por ela: a pressão está normal.", "Притисокот е нормален.", pritisokot, normalen]
  - ask: ["Say: the heart is fine.", "Diga: o coração está bem.", "Срцето е добро.", srceto]
  - ask: ["Ask about the blood test: and the blood?", "Pergunte do exame: e o sangue?", "А крвта?", krvta]
  - ask: ["Say: the results will be ready tomorrow.", "Diga: os resultados ficam prontos amanhã.", "Резултатите ќе бидат готови утре.", rezultatite, ke-bidat, gotovi]
  - ask: ["Ask: what should I do?", "Pergunte: o que eu devo fazer?", "Што треба да правам?", treba-da]
  - ask: ["Her advice: eat healthily.", "O conselho dela: coma de forma saudável.", "Јадете здраво.", jadete-zdravo]
  - ask: ["And walk every day.", "E caminhe todo dia.", "Шетајте секој ден.", setajte, sekoj-den]
  - ask: ["Say: I'll walk to work. (future of шетам)", "Diga: vou caminhar até o trabalho.", "Ќе шетам до работа.", do, rabota]
  - note: ["Everyone registers with a family doctor (матичен лекар), who refers you to specialists. Book visits through the national system, Мој термин.", "Todo mundo se registra com um médico de família (матичен лекар), que encaminha aos especialistas. As consultas se marcam pelo sistema nacional, Мој термин."]
