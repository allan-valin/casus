id: C1-12
protagonist: m
title: ["The village", "A vila"]
situation: ["A weekend at Marko's grandparents' village near Kičevo.", "Um fim de semana na aldeia dos avós do Marko, perto de Kičevo."]
learn: [c1-clitic-clusters]
culture: Village life
items:
  - [bavca, "бавча", "vegetable garden", "horta", {rare: true}]
  - [kokoski, "кокошки", "hens", "galinhas", {rare: true}]
  - [jajca-svezi, "свежи јајца", "fresh eggs", "ovos frescos"]
  - [daj-mu-gi, "дај му ги", "give them to him", "dá para ele"]
  - [ke-ti-gi-spakuvam, "ќе ти ги спакувам", "I'll pack them for you", "vou embalar para você"]
  - [prazni-kukji, "празни куќи", "empty houses", "casas vazias"]
  - [samo-starci, "само старци", "only old people", "só velhos"]
  - [tisina, "тишина", "silence, quiet", "silêncio"]
  - [ne-moze-da-se-kupi, "не може да се купи", "can't be bought", "não se compra"]
  - [ke-dojdete-pak, "ќе дојдете пак", "you'll come again", "vocês voltam"]
dialogue:
  - [dedo-c, "Ова е бавчата. Домати, пиперки, сѐ домашно.", "This is the garden. Tomatoes, peppers, everything home-grown.", "Esta é a horta. Tomate, pimentão, tudo caseiro."]
  - [protagonist, "А кокошките?", "And the hens?", "E as galinhas?"]
  - [dedo-c, "Свежи јајца секое утро. Марко, дај му ги јајцата на гостинот!", "Fresh eggs every morning. Marko, give the eggs to our guest!", "Ovos frescos toda manhã. Marko, dá os ovos para a visita!"]
  - [marko, "Дедо, ќе му ги спакувам за Скопје.", "Grandpa, I'll pack them for him for Skopje.", "Vô, vou embalar para ele levar para Skopje."]
  - [protagonist, "Колку луѓе живеат во селото?", "How many people live in the village?", "Quantas pessoas moram na aldeia?"]
  - [dedo-c, "Дваесетина. Само старци. Многу празни куќи.", "About twenty. Only old people. Lots of empty houses.", "Umas vinte. Só velhos. Muita casa vazia."]
  - [protagonist, "Но каква тишина! Тоа не може да се купи.", "But what silence! That can't be bought.", "Mas que silêncio! Isso não se compra."]
  - [dedo-c, "Ќе дојдете пак? Ракијата ќе ве чека.", "You'll come again? The rakija will be waiting.", "Vocês voltam? A rakija vai estar esperando."]
teach:
  - ask: ["Say: the vegetable garden.", "Diga: a horta.", "Бавчата.", bavca]
  - ask: ["Ask: and the hens?", "Pergunte: e as galinhas?", "А кокошките?", kokoski]
  - ask: ["Say: fresh eggs every morning.", "Diga: ovos frescos toda manhã.", "Свежи јајца секое утро.", jajca-svezi]
  - ask: ["Grandpa: give them to him!", "O avô: dá para ele!", "Дај му ги!", daj-mu-gi]
  - ask: ["Marko: I'll pack them for you.", "O Marko: vou embalar para você.", "Ќе ти ги спакувам.", ke-ti-gi-spakuvam]
  - ask: ["Say: only old people.", "Diga: só velhos.", "Само старци.", samo-starci]
  - ask: ["Say: lots of empty houses.", "Diga: muita casa vazia.", "Многу празни куќи.", prazni-kukji]
  - ask: ["Say: what silence!", "Diga: que silêncio!", "Каква тишина!", tisina]
  - ask: ["Say: that can't be bought.", "Diga: isso não se compra.", "Тоа не може да се купи.", ne-moze-da-se-kupi]
  - ask: ["Grandpa: you'll come again?", "O avô: vocês voltam?", "Ќе дојдете пак?", ke-dojdete-pak]
  - note: ["Many villages are emptying: the young moved to Skopje or abroad, the old stay with the garden, the hens and the still for rakija. Visitors leave with eggs, ajvar and jars — refusing is not an option.", "Muitas aldeias estão se esvaziando: os jovens foram para Skopje ou para fora, os velhos ficam com a horta, as galinhas e o alambique. A visita sai com ovos, ajvar e potes — recusar não é opção."]
