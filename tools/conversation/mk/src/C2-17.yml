id: C2-17
protagonist: f
title: ["A cultural misunderstanding", "Mal-entendido cultural"]
situation: ["At lunch you joke that Bojan's grandmother 'feeds people to death'. Silence.", "No almoço você brinca que a avó do Bojan 'mata as pessoas de tanto dar comida'. Silêncio."]
learn: [c2-admirative]
culture: Humour across cultures
items:
  - [navreda, "навреда", "insult, offence", "ofensa"]
  - [ne-mislev-taka, "не мислев така", "I didn't mean it like that", "não quis dizer isso"]
  - [se-navredila, "се навредила", "got offended (reportedly)", "teria se ofendido"]
  - [kaj-nas-toa-e-pofalba, "кај нас тоа е пофалба", "back home that's a compliment", "lá em casa isso é elogio"]
  - [zbor-po-zbor, "збор по збор", "word for word", "ao pé da letra"]
  - [ne-se-preveduva, "не се преведува", "doesn't translate", "não se traduz"]
  - [ve-molam-prostete, "ве молам, простете", "please forgive me", "por favor, me perdoe"]
  - [nema-vrska, "нема врска", "never mind, no matter", "não tem problema"]
  - [smesno-bilo, "смешно било", "it was funny, after all", "até que foi engraçado"]
  - [nauciv-lekcija, "научив лекција", "I learned a lesson", "aprendi a lição"]
dialogue:
  - [protagonist, "Бабо, вие луѓето ги убивате со храна!", "Grandma, you kill people with food!", "Vó, a senhora mata as pessoas de tanta comida!"]
  - [baba, "...Убивам?", "...I kill?", "...Eu mato?"]
  - [bojan, "Тишина... Мислам дека се навредила.", "Silence... I think she got offended.", "Silêncio... Acho que ela se ofendeu."]
  - [protagonist, "Не мислев така! Кај нас тоа е пофалба — дека храната е премногу и вкусна.", "I didn't mean it like that! Back home that's a compliment — that the food is too much and delicious.", "Não quis dizer isso! Lá em casa isso é elogio — que a comida é muita e gostosa."]
  - [bojan, "Збор по збор не се преведува.", "Word for word, it doesn't translate.", "Ao pé da letra, não se traduz."]
  - [protagonist, "Ве молам, простете, бабо.", "Please forgive me, grandma.", "Por favor, me perdoe, vó."]
  - [baba, "Нема врска, душо. Сега кога ми објасни — смешно било!", "Never mind, dear. Now that you've explained — it was funny after all!", "Não tem problema, querida. Agora que você explicou — até que foi engraçado!"]
  - [protagonist, "Научив лекција: шегите не патуваат.", "I learned a lesson: jokes don't travel.", "Aprendi a lição: piada não viaja."]
teach:
  - ask: ["Say: I didn't mean it like that!", "Diga: não quis dizer isso!", "Не мислев така!", ne-mislev-taka]
  - ask: ["Bojan: I think she got offended.", "O Bojan: acho que ela se ofendeu.", "Мислам дека се навредила.", se-navredila]
  - ask: ["Say: back home that's a compliment.", "Diga: lá em casa isso é elogio.", "Кај нас тоа е пофалба.", kaj-nas-toa-e-pofalba]
  - ask: ["Say: word for word, it doesn't translate.", "Diga: ao pé da letra, não se traduz.", "Збор по збор не се преведува.", zbor-po-zbor, ne-se-preveduva]
  - ask: ["Say: please forgive me. (formal)", "Diga: por favor, me perdoe.", "Ве молам, простете.", ve-molam-prostete]
  - ask: ["Grandma: never mind.", "A avó: não tem problema.", "Нема врска.", nema-vrska]
  - ask: ["Grandma, surprised: it was funny after all!", "A avó, surpresa: até que foi engraçado!", "Смешно било!", smesno-bilo]
  - ask: ["Say: I learned a lesson.", "Diga: aprendi a lição.", "Научив лекција.", nauciv-lekcija]
  - ask: ["Say: an insult.", "Diga: uma ofensa.", "Навреда.", navreda]
  - note: ["Exaggeration that is affectionate in Brazilian Portuguese can sound literal and harsh translated word for word. Explain at once, apologise formally to older people (простете), and the moment usually turns into a story they will retell.", "O exagero carinhoso do português brasileiro pode soar literal e duro traduzido ao pé da letra. Explique na hora, peça desculpas formais aos mais velhos (простете), e o momento costuma virar história que eles vão recontar."]
