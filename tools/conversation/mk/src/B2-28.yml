id: B2-28
protagonist: m
title: ["The office party", "A festa da empresa"]
situation: ["The New Year party at Vardar Soft. Mr Nikolovski raises his glass and looks at you.", "A festa de Ano-Novo da Vardar Soft. O senhor Nikolovski levanta o copo e olha para você."]
learn: [b2-vocative]
culture: Toasts
items:
  - [novogodisna-zabava, "новогодишна забава", "New Year party", "festa de Ano-Novo"]
  - [zdravica, "здравица", "toast (speech)", "brinde (discurso)", {rare: true}]
  - [kolegi, "колеги", "colleagues (vocative/plural)", "colegas"]
  - [dragi, "драги", "dear (plural)", "queridos"]
  - [vi-posakuvam, "ви посакувам", "I wish you", "desejo a vocês"]
  - [zdravje-i-srekja, "здравје и среќа", "health and happiness", "saúde e felicidade"]
  - [uspesna, "успешна", "successful (feminine)", "bem-sucedido"]
  - [srekna-nova-godina, "Среќна Нова година!", "Happy New Year!", "Feliz Ano-Novo!"]
  - [za-nas, "за нас", "to us", "a nós"]
  - [nazdravje, "Наздравје!", "Cheers!", "Saúde!"]
dialogue:
  - [nikolovski, "Колеги, сега една здравица од нашиот бразилски колега!", "Colleagues, now a toast from our Brazilian colleague!", "Colegas, agora um brinde do nosso colega brasileiro!"]
  - [protagonist, "Драги колеги... пред три години не знаев ниту „Добар ден“.", "Dear colleagues... three years ago I didn't even know 'Добар ден'.", "Queridos colegas... três anos atrás eu não sabia nem 'Добар ден'."]
  - [darko, "А сега држи говори!", "And now he gives speeches!", "E agora faz discurso!"]
  - [protagonist, "Ви посакувам здравје и среќа, и успешна нова година.", "I wish you health and happiness, and a successful new year.", "Desejo a vocês saúde e felicidade, e um ano novo de sucesso."]
  - [protagonist, "И на Дарко — помалку состаноци!", "And to Darko — fewer meetings!", "E ao Darko — menos reuniões!"]
  - [nikolovski, "Браво! За нас — наздравје!", "Bravo! To us — cheers!", "Bravo! A nós — saúde!"]
  - [ana, "Среќна Нова година!", "Happy New Year!", "Feliz Ano-Novo!"]
  - [protagonist, "Среќна Нова година на сите!", "Happy New Year, everyone!", "Feliz Ano-Novo a todos!"]
teach:
  - ask: ["Say: New Year party.", "Diga: festa de Ano-Novo.", "Новогодишна забава.", novogodisna-zabava]
  - ask: ["Say: a toast.", "Diga: um brinde.", "Здравица.", zdravica]
  - ask: ["Start your toast: dear colleagues…", "Comece o brinde: queridos colegas…", "Драги колеги…", dragi, kolegi]
  - ask: ["Say: I wish you health and happiness.", "Diga: desejo a vocês saúde e felicidade.", "Ви посакувам здравје и среќа.", vi-posakuvam, zdravje-i-srekja]
  - ask: ["Say: a successful new year.", "Diga: um ano novo de sucesso.", "Успешна нова година.", uspesna]
  - ask: ["Say: to us — cheers!", "Diga: a nós — saúde!", "За нас — наздравје!", za-nas, nazdravje]
  - ask: ["Say: happy New Year, everyone!", "Diga: feliz Ano-Novo a todos!", "Среќна Нова година на сите!", srekna-nova-godina]
  - note: ["A здравица is short: address people (драги колеги), wish health and happiness, add one personal line, raise the glass. Then eye contact with everyone — you remember why.", "A здравица é curta: chame as pessoas (драги колеги), deseje saúde e felicidade, uma frase pessoal, e levante o copo. Depois, olho no olho com todo mundo — você lembra por quê."]
