id: B1-29
protagonist: f
title: ["Moving in together?", "Morar junto?"]
situation: ["A year with Bojan. He asks the big question — and mentions his parents.", "Um ano com o Bojan. Ele faz a grande pergunta — e fala dos pais."]
learn: [b1-conditional]
culture: The parents' opinion matters
items:
  - [da-ziveeme, "да живееме заедно", "to live together", "morar junto"]
  - [bi-sakala, "би сакала", "I'd like (a woman)", "eu gostaria"]
  - [sto-bi-rekle, "што би рекле", "what would (they) say", "o que (eles) diriam"]
  - [pred-svadba, "пред свадба", "before the wedding", "antes do casamento"]
  - [staromodni, "старомодни", "old-fashioned (plural)", "antiquados", {rare: true}]
  - [ke-se-naviknat, "ќе се навикнат", "they'll get used to it", "vão se acostumar"]
  - [poevtino, "поевтино", "cheaper", "mais barato"]
  - [kirija, "кирија", "rent", "aluguel"]
  - [da-gi-prasame, "да ги прашаме", "to ask them", "perguntar a eles"]
  - [zaedno-stan, "заеднички стан", "a shared flat", "um apartamento juntos", {rare: true}]
dialogue:
  - [bojan, "Би сакала ли да живееме заедно?", "Would you like us to live together?", "Você gostaria de morar junto?"]
  - [protagonist, "Би сакала! Но што би рекле твоите?", "I'd love to! But what would your parents say?", "Gostaria! Mas o que os seus pais diriam?"]
  - [bojan, "Мајка ми ќе каже: „Пред свадба?!“", "My mother will say: 'Before the wedding?!'", "Minha mãe vai dizer: 'Antes do casamento?!'"]
  - [protagonist, "Старомодни се?", "Are they old-fashioned?", "Eles são antiquados?"]
  - [bojan, "Малку. Но ќе се навикнат.", "A bit. But they'll get used to it.", "Um pouco. Mas vão se acostumar."]
  - [protagonist, "И би било поевтино — една кирија наместо две.", "And it would be cheaper — one rent instead of two.", "E seria mais barato — um aluguel em vez de dois."]
  - [bojan, "Тоа ќе им го кажам прво!", "That's what I'll tell them first!", "Isso eu vou falar primeiro!"]
  - [protagonist, "Можеби треба прво да ги прашаме на ручек.", "Maybe we should ask them first, at lunch.", "Talvez a gente deva perguntar primeiro, no almoço."]
teach:
  - ask: ["Bojan asks if you'd like to live together. How?", "O Bojan pergunta se você gostaria de morar junto. Como?", "Би сакала ли да живееме заедно?", da-ziveeme]
  - ask: ["Say: I'd love to! (a woman)", "Diga: gostaria!", "Би сакала!", bi-sakala]
  - ask: ["Ask: what would your parents say?", "Pergunte: o que os seus pais diriam?", "Што би рекле твоите?", sto-bi-rekle]
  - ask: ["Say for his mother: before the wedding?!", "Diga pela mãe dele: antes do casamento?!", "Пред свадба?!", pred-svadba]
  - ask: ["Ask: are they old-fashioned?", "Pergunte: eles são antiquados?", "Старомодни се?", staromodni]
  - ask: ["Say: they'll get used to it.", "Diga: vão se acostumar.", "Ќе се навикнат.", ke-se-naviknat]
  - ask: ["Say: it would be cheaper.", "Diga: seria mais barato.", "Би било поевтино.", poevtino]
  - ask: ["Say: one rent instead of two.", "Diga: um aluguel em vez de dois.", "Една кирија наместо две.", kirija]
  - ask: ["Say: we should ask them first.", "Diga: a gente deve perguntar primeiro.", "Треба прво да ги прашаме.", prvo, da-gi-prasame]
  - ask: ["Say: a shared flat.", "Diga: um apartamento juntos.", "Заеднички стан.", zaedno-stan]
  - note: ["Many young people live with their parents until they marry, partly for money, partly for custom. Moving in together first is more common in Skopje than in the villages — and parents expect to hear it before the neighbours do.", "Muitos jovens moram com os pais até casar, em parte por dinheiro, em parte por costume. Morar junto antes é mais comum em Skopje que nas aldeias — e os pais esperam saber antes dos vizinhos."]
