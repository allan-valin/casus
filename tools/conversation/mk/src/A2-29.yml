id: A2-29
protagonist: f
title: ["A night out", "Uma noite fora"]
situation: ["Friday. Goran and Marko take you to a club in Debar Maalo.", "Sexta. O Goran e o Marko levam você a uma balada no Debar Maalo."]
learn: [a2-l-form]
culture: Going out late; cafés open till one
items:
  - [klub, "клуб", "club", "balada / boate"]
  - [pocnuva, "почнува", "starts", "começa"]
  - [polnokj, "полноќ", "midnight", "meia-noite", {rare: true}]
  - [docna, "доцна", "late", "tarde"]
  - [kafulinjata, "кафулињата", "the cafés", "os cafés", {rare: true}]
  - [glasna, "гласна", "loud (feminine)", "alta"]
  - [ne-te-slusam, "Не те слушам!", "I can't hear you!", "Não estou te ouvindo!"]
  - [da-tancuvame, "Ајде да танцуваме!", "Let's dance!", "Vamos dançar!"]
  - [ne-tancuvam, "не танцувам", "I don't dance", "eu não danço", {rare: true}]
  - [dali-si-bil, "Дали си бил…?", "Have you been…? (to a man, informal)", "Você já esteve…? (para homem)"]
  - [sum-bil, "сум бил", "I have been (a man)", "já estive (homem)"]
dialogue:
  - [goran, "Ајде во клуб! Сега почнува.", "Let's go to a club! It's starting now.", "Bora para a balada! Está começando agora."]
  - [protagonist, "Сега? Полноќ е!", "Now? It's midnight!", "Agora? É meia-noite!"]
  - [goran, "Тука излегуваме доцна. Кафулињата работат до еден.", "Here we go out late. The cafés are open until one.", "Aqui a gente sai tarde. Os cafés ficam abertos até uma."]
  - [protagonist, "Музиката е многу гласна!", "The music is very loud!", "A música está muito alta!"]
  - [goran, "Што? Не те слушам!", "What? I can't hear you!", "O quê? Não estou te ouvindo!"]
  - [protagonist, "Ајде да танцуваме!", "Let's dance!", "Vamos dançar!"]
  - [marko, "Јас не танцувам.", "I don't dance.", "Eu não danço."]
  - [protagonist, "Марко, дали си бил некогаш на бразилска забава?", "Marko, have you ever been to a Brazilian party?", "Marko, você já foi a uma festa brasileira?"]
  - [marko, "Не сум бил. Добро, само една песна!", "I haven't. All right, just one song!", "Nunca fui. Tá bom, só uma música!"]
teach:
  - ask: ["Say: let's go to a club!", "Diga: bora para a balada!", "Ајде во клуб!", ajde, klub]
  - ask: ["Say: it's starting now.", "Diga: está começando agora.", "Сега почнува.", sega, pocnuva]
  - ask: ["Say: it's midnight!", "Diga: é meia-noite!", "Полноќ е!", polnokj]
  - ask: ["Say: here we go out late.", "Diga: aqui a gente sai tarde.", "Тука излегуваме доцна.", izleguvame, docna]
  - ask: ["Say: the cafés are open until one.", "Diga: os cafés ficam abertos até uma.", "Кафулињата работат до еден.", kafulinjata]
  - ask: ["Say: the music is very loud!", "Diga: a música está muito alta!", "Музиката е многу гласна!", muzika, glasna]
  - ask: ["Goran can't hear you. How does he say it?", "O Goran não escuta. Como ele diz?", "Не те слушам!", ne-te-slusam]
  - ask: ["Say: let's dance!", "Diga: vamos dançar!", "Ајде да танцуваме!", da-tancuvame]
  - ask: ["Marko says he doesn't dance.", "O Marko diz que não dança.", "Јас не танцувам.", ne-tancuvam]
  - note: ["To a man: дали си бил? — to a woman: дали си била? He answers 'не сум бил', I haven't been.", "Para homem: дали си бил? — para mulher: дали си била? Ele responde 'не сум бил', nunca fui."]
  - ask: ["Ask Marko if he's ever been to a Brazilian party.", "Pergunte ao Marko se ele já foi a uma festa brasileira.", "Дали си бил некогаш на бразилска забава?", dali-si-bil, nekogas]
  - ask: ["Answer for him: I haven't.", "Responda por ele: nunca fui.", "Не сум бил.", sum-bil]
  - note: ["Nights start late: dinner at nine, cafés until about one, clubs after midnight. Debar Maalo, the old quarter of small streets near the centre, is full of restaurants and bars.", "A noite começa tarde: jantar às nove, cafés até uma, baladas depois da meia-noite. O Debar Maalo, bairro antigo de ruazinhas perto do centro, é cheio de restaurantes e bares."]
