id: A1-27
protagonist: f
title: [The house and its materials, A casa e os materiais]
situation: ["Mrs Stojanovska shows you a photo of her house in the village.", "A senhora Stojanovska mostra uma foto da casa dela na aldeia."]
learn: [a1-adj-article]
culture: —
items:
  - [kukjata, "куќата", "the house", "a casa"]
  - [selo, "село", "village", "aldeia / interior"]
  - [kamen, "камен", "stone", "pedra"]
  - [kamenata, "камената", "the stone (one, feminine)", "a de pedra"]
  - [tesko, "тешко", "hard, difficult / heavy", "difícil / pesado"]
  - [lesno, "лесно", "easy / light", "fácil / leve"]
  - [lete, "лете", "in summer", "no verão"]
  - [zime, "зиме", "in winter", "no inverno"]
  - [zgradata, "зградата", "the building", "o prédio"]
  - [beton, "бетон", "concrete", "concreto", {rare: true}]
  - [steklo, "стакло", "glass", "vidro", {rare: true}]
  - [zelezo, "железо", "iron", "ferro", {rare: true}]
dialogue:
  - [vera, "Ова е мојата куќа во селото.", "This is my house in the village.", "Esta é a minha casa na aldeia."]
  - [protagonist, "Убава е! Од камен?", "It's beautiful! Made of stone?", "É linda! De pedra?"]
  - [vera, "Да, од камен и дрво. Камената куќа е ладна лете, топла зиме.", "Yes, of stone and wood. A stone house is cool in summer, warm in winter.", "Sim, de pedra e madeira. Casa de pedra é fresca no verão e quente no inverno."]
  - [protagonist, "А оваа зграда?", "And this building?", "E este prédio?"]
  - [vera, "Зградата е од бетон. Лесно се гради, но е грда.", "The building is concrete. Easy to build, but ugly.", "O prédio é de concreto. Fácil de construir, mas feio."]
  - [protagonist, "Во Бразил куќите се од тули.", "In Brazil houses are made of brick.", "No Brasil as casas são de tijolo."]
  - [vera, "А мојата порта е од железо — тешка е!", "And my gate is iron — it's heavy!", "E o meu portão é de ferro — é pesado!"]
  - [protagonist, "А прозорците се од стакло.", "And the windows are glass.", "E as janelas são de vidro."]
  - [vera, "Секако! (се смее)", "Of course! (laughs)", "Claro! (ri)"]
teach:
  - ask: ["Say: this is my house in the village.", "Diga: esta é a minha casa na aldeia.", "Ова е мојата куќа во селото.", mojata, kukjata, selo]
  - note: ["What something is made of: 'од' — 'од камен', made of stone.", "Do que algo é feito: 'од' — 'од камен', de pedra."]
  - ask: ["Ask: made of stone?", "Pergunte: de pedra?", "Од камен?", od, kamen]
  - ask: ["Say: of stone and wood.", "Diga: de pedra e madeira.", "Од камен и дрво.", kamen, drvo]
  - ask: ["Say: the stone house is cool in summer.", "Diga: a casa de pedra é fresca no verão.", "Камената куќа е ладна лете.", kamenata, lete]
  - ask: ["And warm in winter.", "E quente no inverno.", "Топла зиме.", zime]
  - ask: ["Say: the building is concrete.", "Diga: o prédio é de concreto.", "Зградата е од бетон.", zgradata, beton]
  - ask: ["Say: it's easy.", "Diga: é fácil.", "Лесно е.", lesno]
  - ask: ["Say: it's hard.", "Diga: é difícil.", "Тешко е.", tesko]
  - ask: ["Say: the gate is iron.", "Diga: o portão é de ferro.", "Портата е од железо.", zelezo]
  - ask: ["Say: the windows are glass.", "Diga: as janelas são de vidro.", "Прозорците се од стакло.", se, steklo]
  - note: ["'Тешко' means both heavy and difficult — like 'pesado' for a hard week.", "'Тешко' quer dizer pesado e difícil — como 'pesado' para uma semana difícil."]
  - pt_only: "Muitas famílias de Skopje ainda têm a casa da aldeia, como a casa do interior no Brasil: fim de semana, horta, avós."
