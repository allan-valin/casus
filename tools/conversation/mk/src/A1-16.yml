id: A1-16
protagonist: m
title: [The neighbour, O vizinho]
situation: ["Marko is carrying his bike up the stairs. You talk about what is whose.", "O Marko está subindo a escada com a bicicleta. Vocês falam do que é de quem."]
learn: [a1-possessives]
culture: Neighbours on the same staircase know each other
items:
  - [tvojot, "твојот", "your (informal, with a masculine word)", "o seu / o teu (informal, palavra masculina)"]
  - [mojot, "мојот", "my (with a masculine word)", "o meu"]
  - [velosiped, "велосипед", "bicycle", "bicicleta", {rare: true}]
  - [kola, "кола", "car", "carro"]
  - [devojka, "девојка", "girlfriend / girl", "namorada / moça"]
  - [taa, "таа", "she", "ela"]
  - [kat, "кат", "floor (storey)", "andar"]
  - [na, "на", "on / at", "em / no"]
  - [tretiot, "третиот", "the third", "o terceiro"]
  - [vtoriot, "вториот", "the second", "o segundo"]
  - [nie-sme, "ние сме", "we are", "nós somos"]
  - [znaci, "значи", "so / that means", "então / quer dizer"]
  - [tvojata, "твојата", "your (informal, with a feminine word)", "a sua / a tua (informal, palavra feminina)"]
dialogue:
  - [marko, "Здраво! Како си?", "Hi! How are you?", "Oi! Tudo bem?"]
  - [protagonist, "Добро сум. Ова е твојот велосипед?", "I'm fine. Is this your bike?", "Tudo. Essa é a sua bicicleta?"]
  - [marko, "Да, мојот велосипед. Ти имаш ли?", "Yes, my bike. Do you have one?", "É, a minha bicicleta. Você tem?"]
  - [protagonist, "Не, немам. Во Бразил имам кола.", "No, I don't. In Brazil I have a car.", "Não. No Brasil eu tenho carro."]
  - [marko, "Мојата девојка има кола. Таа е таму.", "My girlfriend has a car. It's over there.", "A minha namorada tem carro. Está ali."]
  - [protagonist, "Црвената? Убава е!", "The red one? It's nice!", "O vermelho? É bonito!"]
  - [marko, "Каде е твојот стан? На третиот кат?", "Where is your flat? On the third floor?", "Onde é o seu apartamento? No terceiro andar?"]
  - [protagonist, "Да, на третиот кат.", "Yes, on the third floor.", "É, no terceiro andar."]
  - [marko, "Јас сум на вториот. Значи, ние сме соседи!", "I'm on the second. So we're neighbours!", "Eu moro no segundo. Então somos vizinhos!"]
teach:
  - note: ["'My' and 'your' take the word's 'the' ending: 'мојот велосипед' (masculine, -от), 'мојата кола' (feminine, -ата). You already met 'мојата маса' at the office.", "'Meu' e 'seu' levam a terminação do artigo da palavra: 'мојот велосипед' (masculino, -от), 'мојата кола' (feminino, -ата). Você já viu 'мојата маса' no escritório."]
  - ask: ["Ask Marko: is this your bike?", "Pergunte ao Marko: essa é a sua bicicleta?", "Ова е твојот велосипед?", ova-e, tvojot, velosiped]
  - ask: ["Answer for him: yes, my bike.", "Responda por ele: sim, a minha bicicleta.", "Да, мојот велосипед.", da, mojot, velosiped]
  - ask: ["Say: in Brazil I have a car.", "Diga: no Brasil eu tenho carro.", "Во Бразил имам кола.", vo, imam, kola]
  - ask: ["Say: my girlfriend has a car.", "Diga: a minha namorada tem carro.", "Мојата девојка има кола.", mojata, devojka, kola]
  - ask: ["Say: she is over there.", "Diga: ela está ali.", "Таа е таму.", taa, tamu]
  - ask: ["Ask him: is this your car? (the car is feminine)", "Pergunte: esse é o seu carro? (кола é feminina)", "Ова е твојата кола?", tvojata, kola]
  - note: ["Floors: 'на третиот кат' — on the third floor. 'На' is on or at.", "Andares: 'на третиот кат' — no terceiro andar. 'На' é 'em', 'no', 'sobre'."]
  - ask: ["Ask: where is your flat?", "Pergunte: onde é o seu apartamento?", "Каде е твојот стан?", kade-e, tvojot, stanot]
  - ask: ["Say: on the third floor.", "Diga: no terceiro andar.", "На третиот кат.", na, tretiot, kat]
  - ask: ["Marko lives on the second. Say it for him: I'm on the second.", "O Marko mora no segundo. Diga por ele: eu moro no segundo.", "Јас сум на вториот.", na, vtoriot]
  - ask: ["Say: so we're neighbours!", "Diga: então somos vizinhos!", "Значи, ние сме соседи!", znaci, nie-sme, sosed]
