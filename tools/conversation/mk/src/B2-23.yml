id: B2-23
protagonist: f
title: ["The promotion", "A promoção"]
situation: ["Mr Nikolovski calls you in. You fear the worst.", "O senhor Nikolovski chama você na sala. Você teme o pior."]
learn: [b2-future-perfect]
culture: —
items:
  - [unapreduvanje, "унапредување", "promotion", "promoção", {rare: true}]
  - [zasluzivte, "заслуживте", "you earned it (formal)", "a senhora mereceu"]
  - [nov-raboten-oddel, "водач на тим", "team lead", "líder de equipe"]
  - [pogolema-odgovornost, "поголема одговорност", "more responsibility", "mais responsabilidade"]
  - [povisoka-plata, "повисока плата", "a higher salary", "um salário maior"]
  - [ne-ocekuvav, "не очекував", "I didn't expect", "eu não esperava"]
  - [ke-ste-zaminale, "ќе сте заминале", "you'll have left (I assume)", "a senhora deve ter ido"]
  - [za-godina-dena, "за година дена", "in a year's time", "daqui a um ano"]
  - [ostanuvam, "останувам", "I'm staying", "eu fico"]
  - [se-raduvam, "се радувам", "I'm glad", "fico feliz"]
dialogue:
  - [nikolovski, "Седнете. Имам вест за вас: унапредување.", "Sit down. I have news for you: a promotion.", "Sente-se. Tenho uma notícia: uma promoção."]
  - [protagonist, "Унапредување? Не очекував.", "A promotion? I didn't expect that.", "Promoção? Eu não esperava."]
  - [nikolovski, "Го заслуживте. Од први ќе бидете водач на тим.", "You earned it. From the first you'll be team lead.", "A senhora mereceu. A partir do dia primeiro vai ser líder de equipe."]
  - [protagonist, "Поголема одговорност...", "More responsibility...", "Mais responsabilidade..."]
  - [nikolovski, "И повисока плата. Мислев дека за година дена ќе сте заминале во Германија.", "And a higher salary. I thought in a year you'd have left for Germany.", "E salário maior. Achei que daqui a um ano a senhora já teria ido para a Alemanha."]
  - [protagonist, "Не, останувам. Тука ми е животот.", "No, I'm staying. My life is here.", "Não, eu fico. Minha vida é aqui."]
  - [nikolovski, "Се радувам.", "I'm glad.", "Fico feliz."]
  - [protagonist, "И јас се радувам. Многу ви благодарам.", "So am I. Thank you very much.", "Eu também. Muito obrigada."]
teach:
  - ask: ["Say: a promotion.", "Diga: uma promoção.", "Унапредување.", unapreduvanje]
  - ask: ["Say: I didn't expect that.", "Diga: eu não esperava.", "Не очекував.", ne-ocekuvav]
  - ask: ["He says: you earned it. How?", "Ele diz: a senhora mereceu. Como?", "Го заслуживте.", zasluzivte]
  - ask: ["Say: team lead.", "Diga: líder de equipe.", "Водач на тим.", nov-raboten-oddel]
  - ask: ["Say: more responsibility.", "Diga: mais responsabilidade.", "Поголема одговорност.", pogolema-odgovornost]
  - ask: ["Say: a higher salary.", "Diga: um salário maior.", "Повисока плата.", povisoka-plata]
  - note: ["The future perfect can also guess: 'ќе сте заминале' — you'll (probably) have left by then. Like Portuguese 'já terá ido'.", "O futuro perfeito também serve para supor: 'ќе сте заминале' — a senhora (provavelmente) já terá ido. Como 'já terá ido'."]
  - ask: ["Say: I thought you'd have left.", "Diga: achei que a senhora já teria ido.", "Мислев дека ќе сте заминале.", mislev-deka, ke-ste-zaminale]
  - ask: ["Say: in a year's time.", "Diga: daqui a um ano.", "За година дена.", za-godina-dena]
  - ask: ["Say: no, I'm staying.", "Diga: não, eu fico.", "Не, останувам.", ostanuvam]
  - ask: ["Say: I'm glad.", "Diga: fico feliz.", "Се радувам.", se-raduvam]
