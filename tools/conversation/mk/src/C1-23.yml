id: C1-23
protagonist: f
title: ["Bilingualism", "Bilinguismo"]
situation: ["Marko's son mixes Macedonian and Portuguese, the words you taught him. You and Bojan discuss your own future children.", "O filho do Marko mistura macedônio e português, as palavras que você ensinou. Você e o Bojan conversam sobre os filhos que vocês vão ter."]
learn: [c1-clitic-clusters]
culture: —
items:
  - [dvojazicen, "двојазичен", "bilingual (masculine)", "bilíngue"]
  - [mesa, "меша", "mixes", "mistura"]
  - [doma-portugalski, "дома португалски", "Portuguese at home", "português em casa"]
  - [nadvor-makedonski, "надвор македонски", "Macedonian outside", "macedônio na rua"]
  - [ke-mu-go-naucis, "ќе му го научиш", "you'll teach it to him", "você vai ensinar para ele"]
  - [ednata-roditel, "еден родител — еден јазик", "one parent, one language", "um pai, uma língua"]
  - [ke-se-zbuni, "ќе се збуни", "will get confused", "vai se confundir"]
  - [naprotiv, "напротив", "on the contrary", "pelo contrário"]
  - [prednost, "предност", "advantage", "vantagem"]
  - [baba-od-brazil, "баба од Бразил", "grandma from Brazil", "a avó do Brasil"]
dialogue:
  - [bojan, "Слушна? Синот на Марко рече „мама, água!“ Меша.", "Did you hear? Marko's son said 'mama, água!' He mixes.", "Ouviu? O filho do Marko disse 'mama, água!' Ele mistura."]
  - [protagonist, "Тоа е нормално. Двојазичните деца мешаат.", "That's normal. Bilingual children mix.", "É normal. Criança bilíngue mistura."]
  - [bojan, "А нашите? Нема да се збунат?", "And ours? Won't they get confused?", "E os nossos? Não vão se confundir?"]
  - [protagonist, "Напротив. Тоа е предност. Еден родител — еден јазик.", "On the contrary. It's an advantage. One parent, one language.", "Pelo contrário. É uma vantagem. Um pai, uma língua."]
  - [bojan, "Значи ти португалски, јас македонски.", "So you Portuguese, me Macedonian.", "Então você português, eu macedônio."]
  - [protagonist, "Дома португалски, надвор македонски. И баба од Бразил ќе им го научи остатокот.", "Portuguese at home, Macedonian outside. And grandma from Brazil will teach them the rest.", "Em casa português, na rua macedônio. E a avó do Brasil ensina o resto."]
  - [bojan, "А мене кој ќе ми го научи португалскиот?", "And who'll teach me Portuguese?", "E quem vai me ensinar português?"]
  - [protagonist, "Јас ќе ти го научам. Почнуваме денеска: „Bom dia“!", "I'll teach it to you. We start today: 'Bom dia'!", "Eu te ensino. A gente começa hoje: 'Bom dia'!"]
teach:
  - ask: ["Say: he mixes.", "Diga: ele mistura.", "Меша.", mesa]
  - ask: ["Say: bilingual children mix.", "Diga: criança bilíngue mistura.", "Двојазичните деца мешаат.", dvojazicen]
  - ask: ["Bojan: won't they get confused?", "O Bojan: não vão se confundir?", "Нема да се збунат?", ke-se-zbuni]
  - ask: ["Say: on the contrary, it's an advantage.", "Diga: pelo contrário, é uma vantagem.", "Напротив, тоа е предност.", naprotiv, prednost]
  - ask: ["Say: one parent, one language.", "Diga: um pai, uma língua.", "Еден родител — еден јазик.", ednata-roditel]
  - ask: ["Say: Portuguese at home, Macedonian outside.", "Diga: em casa português, na rua macedônio.", "Дома португалски, надвор македонски.", doma-portugalski, nadvor-makedonski]
  - ask: ["Say: grandma from Brazil.", "Diga: a avó do Brasil.", "Баба од Бразил.", baba-od-brazil]
  - ask: ["Bojan: who'll teach me Portuguese?", "O Bojan: quem vai me ensinar português?", "Кој ќе ми го научи португалскиот?", ke-mu-go-naucis]
  - note: ["Children growing up with two languages often mix words for a while; it is a normal stage, not confusion. Steady exposure to each language — like 'one parent, one language' — helps.", "Crianças que crescem com duas línguas muitas vezes misturam palavras por um tempo; é uma fase normal, não confusão. Contato constante com cada língua — como 'um pai, uma língua' — ajuda."]
