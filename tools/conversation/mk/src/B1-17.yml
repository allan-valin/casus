id: B1-17
protagonist: f
title: ["A misunderstanding", "Um mal-entendido"]
situation: ["You wait outside the cinema. Ana doesn't come. You call her.", "Você espera na frente do cinema. A Ana não aparece. Você liga."]
learn: [b1-reported-speech]
culture: —
items:
  - [te-cekam, "те чекам", "I'm waiting for you", "estou te esperando"]
  - [kino, "кино", "cinema", "cinema"]
  - [mislev-deka, "мислев дека", "I thought that", "eu achei que"]
  - [ti-mi-rece, "ти ми рече", "you told me", "você me disse"]
  - [ti-rekov, "ти реков", "I told you", "eu te disse"]
  - [sigurna, "сигурна", "sure (a woman)", "certa / segura"]
  - [mi-napisa, "ми напиша", "you wrote to me", "você me escreveu"]
  - [cekaj-da-vidam, "Чекај да видам", "Wait, let me look", "Peraí, deixa eu ver"]
  - [vo-pravo-si, "во право си", "you're right", "você tem razão"]
  - [greska, "грешка", "mistake", "erro"]
  - [biletite, "билетите", "the tickets", "os ingressos"]
dialogue:
  - [protagonist, "Ана, каде си? Те чекам пред кино!", "Ana, where are you? I'm waiting for you outside the cinema!", "Ana, cadê você? Estou te esperando na frente do cinema!"]
  - [ana, "Пред кино? Мислев дека е утре.", "Outside the cinema? I thought it was tomorrow.", "Na frente do cinema? Achei que era amanhã."]
  - [protagonist, "Не, ти ми рече дека е во среда. Денеска е среда.", "No, you told me it was on Wednesday. Today is Wednesday.", "Não, você me disse que era na quarta. Hoje é quarta."]
  - [ana, "Јас ти реков во четврток!", "I told you Thursday!", "Eu te disse quinta!"]
  - [protagonist, "Сигурна си? Ми напиша „среда“ во пораката.", "Are you sure? You wrote 'Wednesday' in the message.", "Tem certeza? Você escreveu 'quarta' na mensagem."]
  - [ana, "Чекај да видам... Ах, во право си. Грешка моја. Извини!", "Wait, let me look... Ah, you're right. My mistake. Sorry!", "Peraí, deixa eu ver... Ah, você tem razão. Erro meu. Desculpa!"]
  - [protagonist, "Нема проблем. Утре тогаш?", "No problem. Tomorrow then?", "Sem problema. Amanhã então?"]
  - [ana, "Утре. И јас ги плаќам билетите.", "Tomorrow. And I'm paying for the tickets.", "Amanhã. E eu pago os ingressos."]
teach:
  - ask: ["Say: I'm waiting for you outside the cinema.", "Diga: estou te esperando na frente do cinema.", "Те чекам пред кино.", te-cekam, pred, kino]
  - ask: ["Ana: I thought it was tomorrow. How?", "A Ana: achei que era amanhã. Como?", "Мислев дека е утре.", mislev-deka, utre]
  - note: ["Reporting: 'ти ми рече дека е во среда' — you told me (that) it's on Wednesday. The tense of the reported part usually stays as it was said.", "Discurso indireto: 'ти ми рече дека е во среда' — você me disse que é na quarta. O tempo da parte contada costuma ficar como foi dito."]
  - ask: ["Say: you told me it was on Wednesday.", "Diga: você me disse que era na quarta.", "Ти ми рече дека е во среда.", ti-mi-rece, sreda]
  - ask: ["Ana: I told you Thursday!", "A Ana: eu te disse quinta!", "Јас ти реков во четврток!", ti-rekov, cetvrtok]
  - ask: ["Ask: are you sure?", "Pergunte: tem certeza?", "Сигурна си?", sigurna]
  - ask: ["Say: you wrote it in the message.", "Diga: você escreveu na mensagem.", "Ми напиша во пораката.", mi-napisa, poraka]
  - ask: ["Ana: wait, let me look.", "A Ana: peraí, deixa eu ver.", "Чекај да видам.", cekaj-da-vidam]
  - ask: ["Say: you're right.", "Diga: você tem razão.", "Во право си.", vo-pravo-si]
  - ask: ["Say: my mistake.", "Diga: erro meu.", "Грешка моја.", greska]
  - ask: ["Ana: I'm paying for the tickets.", "A Ana: eu pago os ingressos.", "Јас ги плаќам билетите.", plakjam, biletite]
