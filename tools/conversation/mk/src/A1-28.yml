id: A1-28
protagonist: m
title: [My family, Minha família]
situation: ["Mrs Stojanovska shows you family photos and asks about yours.", "A senhora Stojanovska mostra fotos da família e pergunta da sua."]
learn: [a1-imam]
culture: A relative abroad in almost every family
items:
  - [familija, "фамилија", "family", "família"]
  - [sin, "син", "son", "filho"]
  - [zivee, "живее", "lives", "mora"]
  - [kerka, "ќерка", "daughter", "filha"]
  - [brat, "брат", "brother", "irmão"]
  - [sestra, "сестра", "sister", "irmã"]
  - [kolku-godini, "Колку години…?", "How old…? (how many years)", "Quantos anos…?"]
  - [godini, "години", "years", "anos"]
  - [trieset, "триесет", "thirty", "trinta"]
  - [dvaeset-i-pet, "дваесет и пет", "twenty-five", "vinte e cinco"]
  - [majka, "мајка", "mother", "mãe"]
  - [tatko, "татко", "father", "pai"]
  - [tie, "тие", "they", "eles"]
dialogue:
  - [vera, "Ова е мојата фамилија. Ова е синот, тој живее во Германија.", "This is my family. This is my son, he lives in Germany.", "Esta é a minha família. Este é o meu filho, ele mora na Alemanha."]
  - [protagonist, "А ова е вашата ќерка?", "And is this your daughter?", "E esta é a sua filha?"]
  - [vera, "Да, ќерка ми, Марија. Таа живее тука, во Скопје.", "Yes, my daughter, Marija. She lives here, in Skopje.", "Sim, a minha filha, Marija. Ela mora aqui, em Skopje."]
  - [protagonist, "Јас имам брат и сестра.", "I have a brother and a sister.", "Eu tenho um irmão e uma irmã."]
  - [vera, "Колку години имаат?", "How old are they?", "Quantos anos eles têm?"]
  - [protagonist, "Брат ми има триесет, сестра ми дваесет и пет.", "My brother is thirty, my sister twenty-five.", "Meu irmão tem trinta, minha irmã vinte e cinco."]
  - [vera, "А мајка ви и татко ви?", "And your mother and father?", "E a sua mãe e o seu pai?"]
  - [protagonist, "Тие се во Сао Паоло.", "They're in São Paulo.", "Eles estão em São Paulo."]
teach:
  - ask: ["Say: this is my family.", "Diga: esta é a minha família.", "Ова е мојата фамилија.", mojata, familija]
  - ask: ["Say for her: my son lives in Germany.", "Diga por ela: meu filho mora na Alemanha.", "Синот живее во Германија.", sin, zivee]
  - note: ["Almost every family has someone abroad — in Germany, Switzerland, Australia, the US. Many young people have left since the 1990s.", "Quase toda família tem alguém fora — na Alemanha, na Suíça, na Austrália, nos Estados Unidos. Muitos jovens saíram do país desde os anos noventa."]
  - ask: ["Ask: is this your daughter?", "Pergunte: esta é a sua filha?", "Ова е вашата ќерка?", kerka]
  - note: ["With close family you say 'брат ми', 'мајка ми' — the word, then a short 'my' — not 'мојот брат'. To someone formal: 'мајка ви', your mother.", "Com a família próxima diz-se 'брат ми', 'мајка ми' — a palavra e depois um 'meu' curto — e não 'мојот брат'. Formal: 'мајка ви', a sua mãe."]
  - ask: ["Say: I have a brother and a sister.", "Diga: tenho um irmão e uma irmã.", "Имам брат и сестра.", imam, brat, sestra]
  - note: ["Age is 'having years': 'има триесет години' — like Portuguese 'tem trinta anos'.", "Idade é 'ter anos': 'има триесет години' — igual ao português 'tem trinta anos'."]
  - ask: ["Ask how old they are.", "Pergunte quantos anos eles têm.", "Колку години имаат?", kolku-godini]
  - ask: ["Say: my brother is thirty.", "Diga: meu irmão tem trinta.", "Брат ми има триесет години.", brat, trieset, godini]
  - ask: ["Say: my sister is twenty-five.", "Diga: minha irmã tem vinte e cinco.", "Сестра ми има дваесет и пет.", sestra, dvaeset-i-pet]
  - ask: ["Say: my mother and my father.", "Diga: minha mãe e meu pai.", "Мајка ми и татко ми.", majka, tatko]
  - ask: ["Say: they're in São Paulo.", "Diga: eles estão em São Paulo.", "Тие се во Сао Паоло.", tie]
