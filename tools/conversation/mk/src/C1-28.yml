id: C1-28
protagonist: m
title: ["Visitors from Brazil", "Visitas do Brasil"]
situation: ["Your parents visit Skopje. Lunch at Vera's — you translate both ways.", "Seus pais visitam Skopje. Almoço na casa da Vera — você traduz para os dois lados."]
learn: [c1-clitic-clusters]
culture: Two cultures at one table
items:
  - [vodic, "водич", "guide", "guia"]
  - [prevod, "превод", "translation", "tradução"]
  - [mu-go-preveduvam, "му го преведувам", "I translate it for him", "traduzo para ele"]
  - [i-go-kazi, "кажи ѝ го", "tell it to her (informal)", "fala para ela"]
  - [sporedba, "споредба", "comparison", "comparação"]
  - [slicno, "слично", "similar", "parecido"]
  - [isto-kako-kaj-nas, "исто како кај нас", "just like with us", "igual ao nosso"]
  - [gostoprimstvo, "гостопримство", "hospitality", "hospitalidade", {rare: true}]
  - [vi-blagodarat, "ви благодарат", "they thank you", "eles agradecem"]
  - [dojdete-vo-brazil, "дојдете во Бразил", "come to Brazil", "venha ao Brasil"]
dialogue:
  - [vera, "Кажи им на твоите: добредојдовте во Скопје!", "Tell your parents: welcome to Skopje!", "Fala para os seus pais: bem-vindos a Skopje!"]
  - [protagonist, "Им го преведувам... Мајка ми вели: „Многу е убаво.“", "I'm translating it for them... My mother says: 'It's very beautiful.'", "Estou traduzindo para eles... Minha mãe diz: 'É muito bonito.'"]
  - [vera, "Кажи ѝ го ова: јадете, јадете, има уште!", "Tell her this: eat, eat, there's more!", "Fala isso para ela: come, come, tem mais!"]
  - [protagonist, "Таа вели: „Исто како кај нас — баба ми така правеше.“", "She says: 'Just like with us — my grandmother did the same.'", "Ela diz: 'Igual ao nosso — minha avó fazia assim.'"]
  - [vera, "Значи сме слични! А татко ти?", "So we're similar! And your father?", "Então somos parecidos! E o seu pai?"]
  - [protagonist, "Тој прави споредба: ракијата е како кашаса, но појака.", "He's making a comparison: rakija is like cachaça, but stronger.", "Ele faz uma comparação: a rakija é como cachaça, só que mais forte."]
  - [vera, "Нека пие полека! И кажи им — ви благодарат за гостопримството?", "Let him drink slowly! And tell them — are they thanking me for the hospitality?", "Que ele beba devagar! E fala para eles — estão agradecendo a hospitalidade?"]
  - [protagonist, "Ви благодарат. И велат: дојдете во Бразил, вие сте нивни гости.", "They thank you. And they say: come to Brazil, you'll be their guest.", "Agradecem. E dizem: venha ao Brasil, a senhora é convidada deles."]
teach:
  - ask: ["Vera: tell your parents welcome!", "A Vera: fala para os seus pais: bem-vindos!", "Кажи им: добредојдовте!", dobredojdovte]
  - ask: ["Say: I'm translating it for him.", "Diga: estou traduzindo para ele.", "Му го преведувам.", mu-go-preveduvam]
  - ask: ["Vera: tell her this!", "A Vera: fala isso para ela!", "Кажи ѝ го ова!", i-go-kazi]
  - ask: ["Say: just like with us.", "Diga: igual ao nosso.", "Исто како кај нас.", isto-kako-kaj-nas]
  - ask: ["Say: so we're similar!", "Diga: então somos parecidos!", "Значи сме слични!", slicno]
  - ask: ["Say: he's making a comparison.", "Diga: ele faz uma comparação.", "Тој прави споредба.", sporedba]
  - ask: ["Say: the hospitality.", "Diga: a hospitalidade.", "Гостопримството.", gostoprimstvo]
  - ask: ["Say: they thank you.", "Diga: eles agradecem.", "Ви благодарат.", vi-blagodarat]
  - ask: ["Say: come to Brazil!", "Diga: venha ao Brasil!", "Дојдете во Бразил!", dojdete-vo-brazil]
  - ask: ["Say: the translation.", "Diga: a tradução.", "Преводот.", prevod]
  - ask: ["Say: I'm their guide.", "Diga: sou o guia deles.", "Јас сум им водич.", vodic]
  - note: ["Translating at the table is a clitic workout: им го преведувам (I translate it for them), кажи ѝ го (tell it to her). And the two cultures meet in the same place: a grandmother who keeps saying 'eat, there's more'.", "Traduzir à mesa é treino de pronomes: им го преведувам (traduzo para eles), кажи ѝ го (fala para ela). E as duas culturas se encontram no mesmo ponto: a avó que diz 'come, tem mais'."]
