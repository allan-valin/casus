id: B1-19
protagonist: f
title: ["Apologies", "Desculpas"]
situation: ["You missed Sunday lunch at Bojan's parents'. He is not pleased.", "Você faltou ao almoço de domingo na casa dos pais do Bojan. Ele não gostou."]
learn: [b1-cause-conj]
culture: —
items:
  - [kade-bese, "Каде беше?", "Where were you? (informal)", "Onde você estava?"]
  - [te-cekase, "те чекаше", "was waiting for you", "estava te esperando"]
  - [ne-bese-namerno, "не беше намерно", "it wasn't on purpose", "não foi de propósito"]
  - [zgotvi, "зготви", "cooked", "cozinhou"]
  - [ke-i-se-javam, "ќе ѝ се јавам", "I'll call her", "vou ligar para ela"]
  - [ke-i-se-izvinam, "ќе ѝ се извинам", "I'll apologise to her", "vou pedir desculpas a ela"]
  - [ne-se-luti, "Не се лути", "Don't be angry (informal)", "Não fica bravo"]
  - [ne-se-lutam, "не се лутам", "I'm not angry", "não estou bravo"]
  - [vetuvam, "ветувам", "I promise", "prometo"]
  - [orevi, "ореви", "walnuts", "nozes", {rare: true}]
dialogue:
  - [bojan, "Каде беше? Мајка ми те чекаше на ручек!", "Where were you? My mother was waiting for you at lunch!", "Onde você estava? Minha mãe estava te esperando no almoço!"]
  - [protagonist, "Извини, не беше намерно. Заборавив дека е денеска.", "Sorry, it wasn't on purpose. I forgot it was today.", "Desculpa, não foi de propósito. Esqueci que era hoje."]
  - [bojan, "Таа готвеше цело утро.", "She was cooking all morning.", "Ela cozinhou a manhã inteira."]
  - [protagonist, "Ќе ѝ се јавам и ќе ѝ се извинам. Не се лути.", "I'll call her and apologise. Don't be angry.", "Vou ligar para ela e pedir desculpas. Não fica bravo."]
  - [bojan, "Не се лутам... само малку.", "I'm not angry... only a little.", "Não estou bravo... só um pouco."]
  - [protagonist, "Следната недела јас носам колач, ветувам.", "Next Sunday I'm bringing a cake, I promise.", "Domingo que vem eu levo um bolo, prometo."]
  - [bojan, "Добро. Таа сака колач со ореви.", "All right. She likes walnut cake.", "Tá bom. Ela gosta de bolo de nozes."]
  - [protagonist, "Тогаш со ореви!", "Walnut, then!", "Então de nozes!"]
teach:
  - ask: ["Bojan asks where you were. How?", "O Bojan pergunta onde você estava. Como?", "Каде беше?", kade-bese]
  - ask: ["Say: my mother was waiting for you. (for him)", "Diga por ele: minha mãe estava te esperando.", "Мајка ми те чекаше.", majka, te-cekase]
  - ask: ["Say: sorry, it wasn't on purpose.", "Diga: desculpa, não foi de propósito.", "Извини, не беше намерно.", izvini, ne-bese-namerno]
  - ask: ["Say: I forgot it was today.", "Diga: esqueci que era hoje.", "Заборавив дека е денеска.", zaboraviv, denes]
  - ask: ["Say: she cooked.", "Diga: ela cozinhou.", "Таа зготви.", zgotvi]
  - ask: ["Say: I'll call her.", "Diga: vou ligar para ela.", "Ќе ѝ се јавам.", ke-i-se-javam]
  - ask: ["Say: and I'll apologise to her.", "Diga: e vou pedir desculpas a ela.", "И ќе ѝ се извинам.", ke-i-se-izvinam]
  - ask: ["Say: don't be angry.", "Diga: não fica bravo.", "Не се лути.", ne-se-luti]
  - ask: ["Bojan: I'm not angry. How?", "O Bojan: não estou bravo. Como?", "Не се лутам.", ne-se-lutam]
  - ask: ["Say: I promise.", "Diga: prometo.", "Ветувам.", vetuvam]
  - ask: ["Say: walnut cake.", "Diga: bolo de nozes.", "Колач со ореви.", kolac, orevi]
  - note: ["An apology goes to the person you let down — here, his mother — by phone, and is made good with something you bring next time.", "O pedido de desculpas vai para quem você deixou na mão — aqui, a mãe dele — por telefone, e se repara com algo que você leva na próxima vez."]
