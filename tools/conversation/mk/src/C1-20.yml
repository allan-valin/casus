id: C1-20
protagonist: m
title: ["A child", "Uma criança"]
situation: ["Sara has news. A week later, everybody has advice.", "A Sara tem uma notícia. Uma semana depois, todo mundo tem conselho."]
learn: [c1-ima-da]
culture: Everyone gives advice
items:
  - [bremena, "бремена", "pregnant", "grávida"]
  - [ke-imame-bebe, "ќе имаме бебе", "we're having a baby", "vamos ter um bebê"]
  - [terminot, "терминот", "the due date / appointment", "a data prevista / a consulta"]
  - [ginekolog, "гинеколог", "gynaecologist", "ginecologista", {rare: true}]
  - [ima-da-jades, "има да јадеш за двајца", "you'll have to eat for two", "vai ter que comer por dois"]
  - [ne-krevaj, "не кревај тешко", "don't lift anything heavy", "não levanta peso"]
  - [sovet, "совет", "piece of advice", "conselho"]
  - [sekoj-ima-sovet, "секој има совет", "everyone has advice", "todo mundo tem conselho"]
  - [cestitam, "Честитам!", "Congratulations!", "Parabéns!"]
  - [da-vi-e-zivo-i-zdravo, "Да ви е живо и здраво!", "May it be alive and healthy!", "Que venha com saúde!"]
dialogue:
  - [sara, "Седни. Имам вест... бремена сум!", "Sit down. I have news... I'm pregnant!", "Senta. Tenho uma notícia... estou grávida!"]
  - [protagonist, "Што? Ќе имаме бебе?!", "What? We're having a baby?!", "O quê? Vamos ter um bebê?!"]
  - [sara, "Да! Терминот е во мај. Бев кај гинеколог.", "Yes! The due date is in May. I went to the gynaecologist.", "Sim! A data prevista é em maio. Fui na ginecologista."]
  - [vera, "Честитам! Да ви е живо и здраво! Сега има да јадеш за двајца.", "Congratulations! May it be alive and healthy! Now you'll have to eat for two.", "Parabéns! Que venha com saúde! Agora vai ter que comer por dois."]
  - [svekrva-s, "И не кревај тешко! И без промаја!", "And don't lift anything heavy! And no drafts!", "E não levanta peso! E nada de corrente de ar!"]
  - [sara, "Секој има совет...", "Everyone has advice...", "Todo mundo tem conselho..."]
  - [protagonist, "Мојата мајка од Бразил вели: само одмор и бразилски грав.", "My mother in Brazil says: just rest and Brazilian beans.", "Minha mãe do Brasil diz: só descanso e feijão."]
  - [sara, "Добро. Ќе ги слушам сите — и ништо нема да правам!", "Fine. I'll listen to all of them — and do nothing!", "Tá bom. Vou ouvir todo mundo — e não vou fazer nada!"]
teach:
  - ask: ["Sara: I'm pregnant!", "A Sara: estou grávida!", "Бремена сум!", bremena]
  - ask: ["Say: we're having a baby?!", "Diga: vamos ter um bebê?!", "Ќе имаме бебе?!", ke-imame-bebe]
  - ask: ["Say: the due date is in May.", "Diga: a data prevista é em maio.", "Терминот е во мај.", terminot]
  - ask: ["Say: at the gynaecologist's.", "Diga: na ginecologista.", "Кај гинеколог.", ginekolog]
  - ask: ["Congratulate.", "Dê parabéns.", "Честитам!", cestitam]
  - ask: ["Add the blessing: may it be alive and healthy!", "Acrescente a bênção: que venha com saúde!", "Да ви е живо и здраво!", da-vi-e-zivo-i-zdravo]
  - ask: ["Vera: you'll have to eat for two.", "A Vera: vai ter que comer por dois.", "Има да јадеш за двајца.", ima-da-jades]
  - ask: ["Mother-in-law: don't lift anything heavy!", "A sogra: não levanta peso!", "Не кревај тешко!", ne-krevaj]
  - ask: ["Say: everyone has advice.", "Diga: todo mundo tem conselho.", "Секој има совет.", sekoj-ima-sovet, sovet]
  - note: ["Pregnancy news brings blessings ('Да ви е живо и здраво!') and endless advice from every older woman — the draft rule comes back too. Nod, thank, and decide with your doctor.", "A notícia de gravidez traz bênçãos ('Да ви е живо и здраво!') e conselho sem fim de toda mulher mais velha — a regra da corrente de ar volta também. Concorde, agradeça, e decida com a médica."]
