id: B2-04
protagonist: m
title: ["The interview (1)", "A entrevista (1)"]
situation: ["Monday, Vardar Soft. Mr Nikolovski asks the questions.", "Segunda, Vardar Soft. O senhor Nikolovski faz as perguntas."]
learn: [b2-perfective-imperfect]
culture: Modesty versus self-praise
items:
  - [kazete-mi, "Кажете ми нешто за себе", "Tell me something about yourself", "Fale um pouco sobre o senhor"]
  - [silni-strani, "силни страни", "strengths", "pontos fortes"]
  - [slabi-strani, "слаби страни", "weaknesses", "pontos fracos"]
  - [odgovoren, "одговорен", "responsible (masculine)", "responsável"]
  - [rabotam-vo-tim, "работам во тим", "I work in a team", "trabalho em equipe"]
  - [ponekogas, "понекогаш", "sometimes", "às vezes"]
  - [premnogu-detali, "премногу детали", "too many details", "detalhes demais"]
  - [zosto-bas-nas, "Зошто баш нас?", "Why us in particular?", "Por que justamente nós?"]
  - [da-rastam, "да растам", "to grow (professionally)", "crescer"]
  - [ostanam, "да останам", "to stay", "ficar"]
dialogue:
  - [nikolovski, "Кажете ми нешто за себе.", "Tell me something about yourself.", "Fale um pouco sobre o senhor."]
  - [protagonist, "Програмер сум, осум години. Три години веќе работам во Скопје.", "I'm a programmer, eight years. I've been working in Skopje three years.", "Sou programador há oito anos. Já trabalho em Skopje há três."]
  - [nikolovski, "Кои се вашите силни страни?", "What are your strengths?", "Quais são os seus pontos fortes?"]
  - [protagonist, "Одговорен сум и добро работам во тим.", "I'm responsible and I work well in a team.", "Sou responsável e trabalho bem em equipe."]
  - [nikolovski, "А слаби страни?", "And weaknesses?", "E pontos fracos?"]
  - [protagonist, "Понекогаш гледам премногу детали.", "Sometimes I look at too many details.", "Às vezes presto atenção em detalhes demais."]
  - [nikolovski, "Зошто баш нас?", "Why us in particular?", "Por que justamente nós?"]
  - [protagonist, "Сакам да останам во Македонија и да растам со една домашна фирма.", "I want to stay in Macedonia and grow with a local company.", "Quero ficar na Macedônia e crescer com uma empresa daqui."]
teach:
  - ask: ["He says: tell me about yourself.", "Ele diz: fale sobre o senhor.", "Кажете ми нешто за себе.", kazete-mi]
  - ask: ["Ask him: what are your strengths? (formal)", "Pergunte: quais são os seus pontos fortes?", "Кои се вашите силни страни?", silni-strani]
  - ask: ["Say: I'm responsible.", "Diga: sou responsável.", "Одговорен сум.", odgovoren]
  - ask: ["Say: I work well in a team.", "Diga: trabalho bem em equipe.", "Добро работам во тим.", rabotam-vo-tim]
  - ask: ["Ask: and weaknesses?", "Pergunte: e pontos fracos?", "А слаби страни?", slabi-strani]
  - ask: ["Say: sometimes I look at too many details.", "Diga: às vezes presto atenção em detalhes demais.", "Понекогаш гледам премногу детали.", ponekogas, premnogu-detali]
  - ask: ["He asks: why us in particular?", "Ele pergunta: por que justamente nós?", "Зошто баш нас?", zosto-bas-nas]
  - ask: ["Say: I want to stay in Macedonia.", "Diga: quero ficar na Macedônia.", "Сакам да останам во Македонија.", ostanam]
  - ask: ["Say: and grow with a local company.", "Diga: e crescer com uma empresa daqui.", "И да растам со домашна фирма.", da-rastam]
  - note: ["Interviews reward quiet confidence: state facts, avoid big self-praise, and show you plan to stay — employers worry that good people leave for abroad.", "As entrevistas premiam confiança tranquila: diga os fatos, evite muito autoelogio, e mostre que pretende ficar — os patrões temem que gente boa vá para fora."]
