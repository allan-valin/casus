id: B2-02
protagonist: m
title: ["The CV", "O currículo"]
situation: ["Your first CV in Macedonian. Sara reads it over your shoulder.", "Seu primeiro currículo em macedônio. A Sara lê por cima do seu ombro."]
learn: [b2-prefixes]
culture: —
items:
  - [biografija, "биографија", "CV", "currículo"]
  - [vestini, "вештини", "skills", "habilidades"]
  - [rabotev, "работев", "I worked (for a while)", "trabalhei"]
  - [zavrsiv, "завршив", "I finished, graduated", "terminei / me formei"]
  - [fakultet, "факултет", "university faculty", "faculdade"]
  - [prepisi, "препиши", "rewrite, copy out (informal)", "reescreve"]
  - [dopisi, "допиши", "add (in writing, informal)", "acrescenta"]
  - [potpisi, "потпиши", "sign (informal)", "assina"]
  - [jazici, "јазици", "languages", "línguas"]
  - [tecno, "течно", "fluently", "fluentemente"]
  - [osnovno, "основно", "basic", "básico"]
dialogue:
  - [sara, "Ова е твојата биографија? Многу е кратка.", "Is this your CV? It's very short.", "Esse é o seu currículo? Está muito curto."]
  - [protagonist, "Пет години работев во Сао Паоло. Тоа е сѐ.", "I worked in São Paulo for five years. That's all.", "Trabalhei cinco anos em São Paulo. É só isso."]
  - [sara, "Допиши кој факултет го заврши.", "Add which faculty you graduated from.", "Acrescenta de que faculdade você se formou."]
  - [protagonist, "Завршив информатика, во 2016.", "I graduated in computer science, in 2016.", "Me formei em computação, em 2016."]
  - [sara, "А вештини? Јазици?", "And skills? Languages?", "E habilidades? Línguas?"]
  - [protagonist, "Португалски, англиски течно. Македонски — основно.", "Portuguese, English fluently. Macedonian — basic.", "Português e inglês fluente. Macedônio — básico."]
  - [sara, "Основно? Ти зборуваш подобро! Препиши го тоа.", "Basic? You speak better than that! Rewrite that.", "Básico? Você fala melhor que isso! Reescreve isso."]
  - [protagonist, "Добро: „добро“. И потоа го потпишувам?", "All right: 'good'. And then I sign it?", "Tá bom: 'bom'. E depois eu assino?"]
  - [sara, "Потпиши и прати!", "Sign and send!", "Assina e manda!"]
teach:
  - ask: ["Say: this is my CV.", "Diga: este é o meu currículo.", "Ова е мојата биографија.", biografija]
  - ask: ["Say: I worked in São Paulo for five years.", "Diga: trabalhei cinco anos em São Paulo.", "Пет години работев во Сао Паоло.", rabotev]
  - note: ["Prefixes change a verb's meaning and usually make it 'completed': пише (writes) → препише (rewrites), допише (adds), потпише (signs), напише (writes, finished).", "Prefixos mudam o sentido do verbo e normalmente o tornam 'completo': пише (escreve) → препише (reescreve), допише (acrescenta), потпише (assina), напише (escreve, até o fim)."]
  - ask: ["Sara: add which faculty you finished.", "A Sara: acrescenta de que faculdade você se formou.", "Допиши кој факултет го заврши.", dopisi, fakultet]
  - ask: ["Say: I graduated in 2016.", "Diga: me formei em 2016.", "Завршив во 2016.", zavrsiv]
  - ask: ["Ask: and skills?", "Pergunte: e habilidades?", "А вештини?", vestini]
  - ask: ["Say: languages — English fluently.", "Diga: línguas — inglês fluente.", "Јазици — англиски течно.", jazici, tecno]
  - ask: ["Say: Macedonian, basic.", "Diga: macedônio, básico.", "Македонски, основно.", osnovno]
  - ask: ["Sara: rewrite that!", "A Sara: reescreve isso!", "Препиши го тоа!", prepisi]
  - ask: ["Sara: sign and send!", "A Sara: assina e manda!", "Потпиши и прати!", potpisi]
