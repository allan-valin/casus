id: B1-30
protagonist: m
title: ["Irony", "Ironia"]
situation: ["Friday at the кафана, the whole group. Marko is in a sarcastic mood — and B1 comes back.", "Sexta na кафана, a turma toda. O Marko está irônico — e o B1 volta."]
learn: []
culture: Deadpan humour
items:
  - [bas-ubavo, "Баш убаво!", "Just great! (often ironic)", "Que maravilha! (muitas vezes irônico)"]
  - [pa-da, "Па да", "Oh sure (ironic)", "Ah, claro (irônico)"]
  - [se-sega, "се шегуваш", "you're joking", "você está brincando"]
  - [ozbilno, "озбилно", "seriously", "sério"]
  - [kako-da-ne, "Како да не!", "Yeah, right!", "Até parece!"]
  - [ironija, "иронија", "irony", "ironia", {rare: true}]
  - [smesno, "смешно", "funny", "engraçado"]
  - [humor, "хумор", "humour", "humor", {rare: true}]
  - [shega, "шега", "joke, banter", "brincadeira"]
  - [ne-sfakjaj, "не сфаќај сериозно", "don't take it seriously (informal)", "não leva a sério"]
  - [sega-razbiram, "сега разбирам", "now I understand", "agora entendo"]
dialogue:
  - [marko, "Пак врне. Баш убаво!", "Raining again. Just great!", "Chovendo de novo. Que maravilha!"]
  - [protagonist, "Ти се допаѓа дождот?", "You like the rain?", "Você gosta da chuva?"]
  - [marko, "Па да. Најмногу на свој роденден.", "Oh sure. Most of all on my birthday.", "Ah, claro. Principalmente no meu aniversário."]
  - [protagonist, "Се шегуваш?", "Are you joking?", "Está brincando?"]
  - [goran, "Тоа е иронија. Марко никогаш не зборува озбилно.", "That's irony. Marko never speaks seriously.", "Isso é ironia. O Marko nunca fala sério."]
  - [marko, "Како да не! Јас сум најсериозниот човек тука.", "Yeah, right! I'm the most serious person here.", "Até parece! Eu sou a pessoa mais séria aqui."]
  - [protagonist, "Многу смешно. Ми треба време за овој хумор.", "Very funny. I need time for this humour.", "Muito engraçado. Preciso de tempo para esse humor."]
  - [goran, "Три години си тука. Уште ти треба?", "You've been here three years. You still need it?", "Três anos aqui. Ainda precisa?"]
teach:
  - note: ["Irony is everywhere in everyday talk: 'Баш убаво!' (just great!) and 'Па да' (oh sure) often mean the opposite. 'Како да не!' — yeah, right!", "Ironia está em toda conversa: 'Баш убаво!' (que maravilha!) e 'Па да' (ah, claro) muitas vezes querem dizer o contrário. 'Како да не!' — até parece!"]
  - ask: ["Say, ironically: just great!", "Diga, irônico: que maravilha!", "Баш убаво!", bas-ubavo]
  - ask: ["Say, ironically: oh sure.", "Diga, irônico: ah, claro.", "Па да.", pa-da]
  - ask: ["Ask: are you joking?", "Pergunte: está brincando?", "Се шегуваш?", se-sega]
  - ask: ["Say: Marko never speaks seriously.", "Diga: o Marko nunca fala sério.", "Марко никогаш не зборува озбилно.", nikogas, ozbilno]
  - ask: ["Say: yeah, right!", "Diga: até parece!", "Како да не!", kako-da-ne]
  - ask: ["Say: very funny.", "Diga: muito engraçado.", "Многу смешно.", smesno]
  - ask: ["Say: that's irony.", "Diga: isso é ironia.", "Тоа е иронија.", ironija]
  - ask: ["Say: I need time for this humour.", "Diga: preciso de tempo para esse humor.", "Ми треба време за овој хумор.", mi-treba, humor]
  - ask: ["Goran: it's a joke, don't take it seriously.", "O Goran: é brincadeira, não leva a sério.", "Тоа е шега, не сфаќај сериозно.", shega, ne-sfakjaj]
  - ask: ["Say: now I understand!", "Diga: agora entendo!", "Сега разбирам!", sega-razbiram]
  - note: ["End of B1. Some more from the whole level.", "Fim do B1. Mais um pouco de todo o nível."]
  - ask: ["Tell Goran: I've heard a lot about you.", "Diga ao Goran: já ouvi falar muito de você.", "Имам слушнато многу за тебе.", imam-slusnato]
  - ask: ["Gossip: Elena got engaged, apparently.", "Fofoca: a Elena ficou noiva, parece.", "Елена се свршила.", se-svrsila]
  - ask: ["If I'd known, I would have come.", "Se eu soubesse, teria vindo.", "Да знаев, ќе дојдев.", da-znaev, ke-dojdev]
  - ask: ["Say: I was going to go, but it was raining.", "Diga: eu ia, mas estava chovendo.", "Ќе одев, ама врнеше.", ke-odev, ama, vrnese]
