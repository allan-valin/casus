id: A2-04
protagonist: m
title: [The bank, O banco]
situation: ["Your salary needs a Macedonian bank account.", "O salário precisa de uma conta num banco macedônio."]
learn: [a2-indirect-clitics]
culture: —
items:
  - [mi-treba, "Ми треба", "I need", "Eu preciso de"]
  - [smetka, "сметка", "account / bill", "conta"]
  - [banka, "банка", "bank", "banco"]
  - [potpisete, "Потпишете", "Sign (formal)", "Assine (formal)"]
  - [kartickata, "картичката", "the (bank) card", "o cartão"]
  - [ke-ja-dobijam, "ќе ја добијам", "I'll get it", "vou receber"]
  - [za-edna-nedela, "за една недела", "in a week", "em uma semana"]
  - [poraka, "порака", "message", "mensagem"]
  - [aplikacijata, "апликацијата", "the app", "o aplicativo", {rare: true}]
  - [besplatna, "бесплатна", "free (of charge, feminine)", "gratuita"]
  - [mu-treba, "му треба", "he needs", "ele precisa"]
dialogue:
  - [protagonist, "Добар ден. Ми треба сметка во банка.", "Good morning. I need a bank account.", "Bom dia. Preciso de uma conta no banco."]
  - [sluzbenicka, "Ви треба пасош и договор за работа.", "You need your passport and work contract.", "O senhor precisa do passaporte e do contrato de trabalho."]
  - [protagonist, "Еве ги.", "Here they are.", "Aqui estão."]
  - [sluzbenicka, "Потпишете тука. И тука.", "Sign here. And here.", "Assine aqui. E aqui."]
  - [protagonist, "Кога ќе ја добијам картичката?", "When will I get the card?", "Quando vou receber o cartão?"]
  - [sluzbenicka, "За една недела. Ќе ви пратиме порака.", "In a week. We'll send you a message.", "Em uma semana. Vamos mandar uma mensagem."]
  - [protagonist, "А апликацијата?", "And the app?", "E o aplicativo?"]
  - [sluzbenicka, "Апликацијата е бесплатна.", "The app is free.", "O aplicativo é gratuito."]
teach:
  - note: ["'I need' is 'ми треба' — word for word 'to me is needed'. You: 'ви треба' (formal), 'ти треба'. He: 'му треба'. She: 'ѝ треба'.", "'Eu preciso' é 'ми треба' — palavra por palavra 'a mim é preciso'. Você: 'ви треба' (formal), 'ти треба'. Ele: 'му треба'. Ela: 'ѝ треба'."]
  - ask: ["Say: I need a bank account.", "Diga: preciso de uma conta no banco.", "Ми треба сметка во банка.", mi-treba, smetka, banka]
  - ask: ["She says you need your passport. How?", "Ela diz que o senhor precisa do passaporte. Como?", "Ви треба пасош.", vi-treba, pasos]
  - ask: ["Hand them over.", "Entregue.", "Еве ги.", eve]
  - ask: ["She says: sign here.", "Ela diz: assine aqui.", "Потпишете тука.", potpisete, tuka]
  - ask: ["Ask when you'll get the card.", "Pergunte quando vai receber o cartão.", "Кога ќе ја добијам картичката?", koga, ke-ja-dobijam, kartickata]
  - note: ["'Недела' is Sunday and also 'week' — 'за една недела' is 'in a week'.", "'Недела' é domingo e também 'semana' — 'за една недела' é 'em uma semana'."]
  - ask: ["Say: in a week.", "Diga: em uma semana.", "За една недела.", za-edna-nedela]
  - ask: ["Say: we'll send you a message. (just: a message)", "Diga: uma mensagem.", "Порака.", poraka]
  - ask: ["Say: the app is free.", "Diga: o aplicativo é gratuito.", "Апликацијата е бесплатна.", aplikacijata, besplatna]
  - ask: ["Marko needs a card too. Say: he needs a card.", "O Marko também precisa de um cartão. Diga: ele precisa de um cartão.", "Му треба картичка.", mu-treba]
  - pt_only: "Nada de Pix por aqui: transferência leva um dia, e muita coisa ainda se paga em dinheiro vivo."
