id: B1-20
protagonist: m
title: ["A couple's quarrel", "Brigas de casal"]
situation: ["You are late again. Sara has had enough.", "Você se atrasou de novo. A Sara cansou."]
learn: [b1-time-conj]
culture: —
items:
  - [pak-docnis, "Пак доцниш!", "You're late again!", "Atrasado de novo!"]
  - [ti-sekogas, "ти секогаш", "you always", "você sempre"]
  - [ne-e-fer, "Не е фер", "That's not fair", "Não é justo"]
  - [guzva, "гужва", "traffic jam, crowd", "trânsito / aglomeração", {rare: true}]
  - [telefonot, "телефонот", "the phone", "o celular"]
  - [da-razgovarame, "Ајде да разговараме", "Let's talk", "Vamos conversar"]
  - [mirno, "мирно", "calmly", "com calma"]
  - [izvini-sto, "Извини што…", "Sorry that…", "Desculpa por…"]
  - [vikav, "викав", "I shouted", "eu gritei"]
  - [dogovoreno, "Договорено", "Agreed", "Combinado"]
dialogue:
  - [sara, "Пак доцниш! Ти секогаш доцниш.", "You're late again! You're always late.", "Atrasado de novo! Você sempre se atrasa."]
  - [protagonist, "Не е фер. Само кога има гужва.", "That's not fair. Only when there's traffic.", "Não é justo. Só quando tem trânsito."]
  - [sara, "Секогаш има гужва кога ти доаѓаш!", "There's always traffic when you're coming!", "Sempre tem trânsito quando é você que vem!"]
  - [protagonist, "А ти секогаш гледаш во телефонот додека зборувам.", "And you always look at your phone while I'm talking.", "E você sempre fica olhando o celular enquanto eu falo."]
  - [sara, "...Добро. Ајде да разговараме мирно.", "...All right. Let's talk calmly.", "...Tá bom. Vamos conversar com calma."]
  - [protagonist, "Во право си. Извини што викав.", "You're right. Sorry I shouted.", "Você tem razão. Desculpa por ter gritado."]
  - [sara, "И ти извини. Откако ќе јадеме, ќе ми раскажеш за денот?", "Sorry too. After we eat, will you tell me about your day?", "Desculpa também. Depois que a gente comer, você me conta do seu dia?"]
  - [protagonist, "Договорено.", "Agreed.", "Combinado."]
teach:
  - ask: ["Sara: you're late again! How?", "A Sara: atrasado de novo! Como?", "Пак доцниш!", pak-docnis]
  - ask: ["Say: you always…", "Diga: você sempre…", "Ти секогаш…", ti-sekogas]
  - ask: ["Say: that's not fair.", "Diga: não é justo.", "Не е фер.", ne-e-fer]
  - ask: ["Say: only when there's traffic.", "Diga: só quando tem trânsito.", "Само кога има гужва.", koga, guzva]
  - ask: ["Say: you look at your phone while I'm talking.", "Diga: você fica olhando o celular enquanto eu falo.", "Гледаш во телефонот додека зборувам.", telefonot, dodeka]
  - ask: ["Say: let's talk calmly.", "Diga: vamos conversar com calma.", "Ајде да разговараме мирно.", da-razgovarame, mirno]
  - ask: ["Say: you're right.", "Diga: você tem razão.", "Во право си.", vo-pravo-si]
  - ask: ["Say: sorry I shouted.", "Diga: desculpa por ter gritado.", "Извини што викав.", izvini-sto, vikav]
  - ask: ["Say: after we eat.", "Diga: depois que a gente comer.", "Откако ќе јадеме.", otkako]
  - ask: ["Say: agreed.", "Diga: combinado.", "Договорено.", dogovoreno]
  - note: ["'Ти секогаш…' (you always…) starts most quarrels in every language. 'Ајде да разговараме мирно' ends many of them.", "'Ти секогаш…' (você sempre…) começa a maioria das brigas em qualquer língua. 'Ајде да разговараме мирно' termina muitas delas."]
