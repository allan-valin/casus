id: B2-29
protagonist: f
title: ["A proposal", "Uma proposta"]
situation: ["Ohrid again, at sunset. Bojan is strangely nervous.", "Ohrid de novo, ao pôr do sol. O Bojan está estranhamente nervoso."]
learn: [b2-da-wishes]
culture: Asking the parents
items:
  - [nervozen, "нервозен", "nervous (masculine)", "nervoso"]
  - [ke-se-zememe, "Ќе се земеме?", "Will you marry me? (shall we marry?)", "Casa comigo?"]
  - [zasekogas, "засекогаш", "forever", "para sempre"]
  - [prstenot, "прстенот", "the ring", "o anel"]
  - [na-baba-mi, "на баба ми", "my grandmother's", "da minha avó"]
  - [gi-prasav, "ги прашав", "I asked them", "eu perguntei a eles"]
  - [tvoite-roditeli, "твоите родители", "your parents", "os seus pais"]
  - [preku-video, "преку видео", "by video", "por vídeo"]
  - [da-ni-e-srekno, "Да ни е среќно!", "May it bring us luck!", "Que nos traga felicidade!"]
  - [svrsuvanje, "свршување", "engagement", "noivado", {rare: true}]
dialogue:
  - [protagonist, "Што ти е? Многу си нервозен.", "What's wrong? You're very nervous.", "O que você tem? Está muito nervoso."]
  - [bojan, "Те сакам. Ќе се земеме?", "I love you. Will you marry me?", "Eu te amo. Casa comigo?"]
  - [protagonist, "Да! Да, да!", "Yes! Yes, yes!", "Sim! Sim, sim!"]
  - [bojan, "Прстенот беше на баба ми.", "The ring was my grandmother's.", "O anel era da minha avó."]
  - [protagonist, "Прекрасен е. А моите родители?", "It's wonderful. And my parents?", "É lindo. E os meus pais?"]
  - [bojan, "Ги прашав твоите родители, минатата недела, преку видео.", "I asked your parents last week, by video.", "Eu perguntei aos seus pais semana passada, por vídeo."]
  - [protagonist, "Ги праша? На португалски?", "You asked them? In Portuguese?", "Você perguntou? Em português?"]
  - [bojan, "Со Гугл преведувач. Татко ти рече „sim“. Да ни е среќно!", "With Google Translate. Your father said 'sim'. May it bring us luck!", "Com o Google Tradutor. Seu pai disse 'sim'. Que nos traga felicidade!"]
teach:
  - ask: ["Say: you're very nervous.", "Diga: você está muito nervoso.", "Многу си нервозен.", nervozen]
  - ask: ["Bojan asks. How?", "O Bojan pede. Como?", "Ќе се земеме?", ke-se-zememe]
  - ask: ["Answer!", "Responda!", "Да!", da]
  - ask: ["Say: forever.", "Diga: para sempre.", "Засекогаш.", zasekogas]
  - ask: ["Say: the ring was my grandmother's.", "Diga: o anel era da minha avó.", "Прстенот беше на баба ми.", prstenot, na-baba-mi]
  - ask: ["Say: I asked your parents.", "Diga: perguntei aos seus pais.", "Ги прашав твоите родители.", gi-prasav, tvoite-roditeli]
  - ask: ["Say: by video.", "Diga: por vídeo.", "Преку видео.", preku-video]
  - ask: ["Wish: may it bring us luck!", "Deseje: que nos traga felicidade!", "Да ни е среќно!", da-ni-e-srekno]
  - ask: ["Say: the engagement.", "Diga: o noivado.", "Свршувањето.", svrsuvanje]
  - note: ["Asking the parents first is still common and valued — even across an ocean. 'Да ни е среќно!' (may it be lucky for us) is what everyone will say to you for weeks.", "Pedir primeiro aos pais ainda é comum e valorizado — mesmo do outro lado do oceano. 'Да ни е среќно!' (que nos traga sorte) é o que todo mundo vai te dizer por semanas."]
