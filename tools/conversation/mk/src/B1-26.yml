id: B1-26
protagonist: m
title: ["The news", "As notícias"]
situation: ["Evening news at Vera's. Elections are coming.", "Telejornal na casa da Vera. As eleições estão chegando."]
learn: [b1-renarrative]
culture: Politics, carefully
items:
  - [vestite, "вестите", "the news", "o noticiário"]
  - [vladata, "владата", "the government", "o governo"]
  - [premierot, "премиерот", "the prime minister", "o primeiro-ministro", {rare: true}]
  - [vetil, "ветил", "promised (reportedly)", "teria prometido"]
  - [povisoki, "повисоки", "higher (plural)", "mais altos"]
  - [plati-salaries, "плати", "salaries", "salários"]
  - [opozicijata, "опозицијата", "the opposition", "a oposição", {rare: true}]
  - [ne-e-vistina, "не е вистина", "it's not true", "não é verdade"]
  - [za-kogo-glasas, "За кого гласаш?", "Who do you vote for?", "Em quem você vota?"]
  - [toa-e-tajna, "Тоа е тајна", "That's a secret", "Isso é segredo"]
  - [ne-moze-da-glasa, "не можеш да гласаш", "you can't vote", "você não pode votar"]
dialogue:
  - [vera, "Слушај ги вестите. Премиерот ветил повисоки плати.", "Listen to the news. The prime minister has promised higher salaries, they say.", "Escuta o noticiário. O primeiro-ministro teria prometido salários mais altos."]
  - [protagonist, "А опозицијата?", "And the opposition?", "E a oposição?"]
  - [vera, "Опозицијата вели дека тоа не е вистина.", "The opposition says it isn't true.", "A oposição diz que não é verdade."]
  - [protagonist, "Пред избори секогаш е така.", "Before elections it's always like that.", "Antes das eleições é sempre assim."]
  - [vera, "Кај вас исто?", "The same where you're from?", "Lá com vocês também?"]
  - [protagonist, "Исто! А ти, за кого гласаш?", "The same! And you, who do you vote for?", "Igualzinho! E você, em quem vota?"]
  - [vera, "Тоа е тајна. А ти и онака не можеш да гласаш!", "That's a secret. And you can't vote anyway!", "Isso é segredo. E você nem pode votar mesmo!"]
  - [protagonist, "Во право си. Само гледам.", "You're right. I'm just watching.", "Tem razão. Só estou assistindo."]
teach:
  - ask: ["Say: listen to the news.", "Diga: escuta o noticiário.", "Слушај ги вестите.", vestite]
  - ask: ["Say: the government.", "Diga: o governo.", "Владата.", vladata]
  - ask: ["Say: the prime minister promised, reportedly.", "Diga: o primeiro-ministro teria prometido.", "Премиерот ветил.", premierot, vetil]
  - ask: ["Say: higher salaries.", "Diga: salários mais altos.", "Повисоки плати.", povisoki, plati-salaries]
  - ask: ["Ask: and the opposition?", "Pergunte: e a oposição?", "А опозицијата?", opozicijata]
  - ask: ["Say: it's not true.", "Diga: não é verdade.", "Тоа не е вистина.", ne-e-vistina]
  - ask: ["Say: before elections it's always like that.", "Diga: antes das eleições é sempre assim.", "Пред избори секогаш е така.", pred, izbori]
  - ask: ["Ask Vera who she votes for.", "Pergunte à Vera em quem ela vota.", "За кого гласаш?", za-kogo-glasas]
  - ask: ["Vera: that's a secret.", "A Vera: isso é segredo.", "Тоа е тајна.", toa-e-tajna]
  - ask: ["Vera: you can't vote anyway!", "A Vera: você nem pode votar!", "Не можеш да гласаш!", ne-moze-da-glasa]
  - note: ["The news anchor uses the reported form for promises ('ветил') to keep distance from them. Politics is lively here; ask questions, but don't take sides with people you don't know well.", "O jornal usa a forma de 'ouvi dizer' para promessas ('ветил') e mantém distância delas. A política aqui é animada; faça perguntas, mas não tome partido com quem você não conhece bem."]
