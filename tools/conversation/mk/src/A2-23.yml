id: A2-23
protagonist: f
title: ["This one or that one?", "Este ou aquele?"]
situation: ["Shoes, at last. Two pairs, two prices.", "Sapatos, finalmente. Dois pares, dois preços."]
learn: [a2-prox-dist]
culture: —
items:
  - [ovie, "овие", "these", "estes"]
  - [onie, "оние", "those", "aqueles"]
  - [koj-broj, "Кој број носите?", "What size do you wear? (formal)", "Que número a senhora calça?"]
  - [nosam, "носам", "I wear / I carry", "eu calço / eu uso"]
  - [probam, "Може да ги пробам?", "May I try them on?", "Posso experimentar?"]
  - [tesni, "тесни", "tight (plural)", "apertados"]
  - [pogolem-broj, "поголем број", "a bigger size", "um número maior"]
  - [ovoj, "овој", "this (masculine)", "este"]
  - [onoj, "оној", "that (masculine)", "aquele"]
  - [ovaa, "оваа", "this (feminine)", "esta"]
  - [onaa, "онаа", "that (feminine)", "aquela"]
  - [udobni, "удобни", "comfortable (plural)", "confortáveis", {rare: true}]
dialogue:
  - [protagonist, "Колку чинат овие?", "How much are these?", "Quanto custam estes?"]
  - [seller, "Тие се три илјади. Оние се две.", "Those are three thousand. Those over there are two.", "Esses são três mil. Aqueles são dois."]
  - [protagonist, "Може да ги пробам оние?", "May I try those on?", "Posso experimentar aqueles?"]
  - [seller, "Секако. Кој број носите?", "Of course. What size do you wear?", "Claro. Que número a senhora calça?"]
  - [protagonist, "Триесет и осум.", "Thirty-eight.", "Trinta e oito."]
  - [protagonist, "Тесни се. Имате ли поголем број?", "They're tight. Do you have a bigger size?", "Estão apertados. Tem um número maior?"]
  - [seller, "Овој модел нема. Но онаа боја, сината, има.", "Not in this model. But in that colour, the blue, yes.", "Neste modelo não. Mas naquela cor, a azul, tem."]
  - [protagonist, "Сините... да, удобни се. Ги земам!", "The blue ones... yes, they're comfortable. I'll take them!", "Os azuis... sim, são confortáveis. Vou levar!"]
teach:
  - note: ["'This' and 'that' agree like adjectives: овој / оној (masculine), оваа / онаа (feminine), ова / она (neuter), овие / оние (plural). Тој, таа, тоа, тие are the 'that' close to the person you're talking to.", "'Este' e 'aquele' concordam como adjetivos: овој / оној (masculino), оваа / онаа (feminino), ова / она (neutro), овие / оние (plural). Тој, таа, тоа, тие são o 'esse', perto de quem ouve."]
  - ask: ["Ask how much these are.", "Pergunte quanto custam estes.", "Колку чинат овие?", kolku-cinat, ovie]
  - ask: ["Say: those are two thousand.", "Diga: aqueles são dois mil.", "Оние се две илјади.", onie, iljadi]
  - ask: ["Ask if you may try those on.", "Pergunte se pode experimentar aqueles.", "Може да ги пробам оние?", probam, onie]
  - ask: ["She asks your size. How?", "Ela pergunta o seu número. Como?", "Кој број носите?", koj-broj]
  - ask: ["Say: I wear thirty-eight.", "Diga: calço trinta e oito.", "Носам триесет и осум.", nosam, trieset, osum]
  - ask: ["Say: they're tight.", "Diga: estão apertados.", "Тесни се.", tesni]
  - ask: ["Ask for a bigger size.", "Peça um número maior.", "Имате ли поголем број?", imate-li, pogolem-broj]
  - ask: ["Say: this model, that model.", "Diga: este modelo, aquele modelo.", "Овој модел, оној модел.", ovoj, onoj]
  - ask: ["Say: this colour, that colour.", "Diga: esta cor, aquela cor.", "Оваа боја, онаа боја.", ovaa, onaa]
  - ask: ["Say: they're comfortable. I'll take them!", "Diga: são confortáveis. Vou levar!", "Удобни се. Ги земам!", udobni]
  - pt_only: "O número do sapato é o europeu: o 36 brasileiro é mais ou menos 37 aqui. Sempre experimente."
