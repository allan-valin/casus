id: B1-10
protagonist: m
title: ["The present", "O presente"]
situation: ["What do you give at a Macedonian wedding? You ask Mrs Stojanovska.", "O que se dá num casamento macedônio? Você pergunta à senhora Stojanovska."]
learn: [b1-indefinite]
culture: Money as the wedding gift
items:
  - [sto-da-im-kupam, "Што да им купам?", "What should I buy them?", "O que eu compro para eles?"]
  - [nisto, "ништо", "nothing", "nada"]
  - [ne-kupuvajte, "не купувајте", "don't buy (formal)", "não compre"]
  - [plik, "плик", "envelope", "envelope", {rare: true}]
  - [obicaj, "обичај", "custom", "costume / tradição"]
  - [sekoj, "секој", "everyone, each", "cada um / todo mundo"]
  - [dava, "дава", "gives", "dá"]
  - [cestitka, "честитка", "greeting card", "cartão", {rare: true}]
  - [kolku-sto-mozete, "колку што можете", "as much as you can", "quanto puder"]
  - [najmalku, "најмалку", "at least", "pelo menos"]
  - [ke-napisam, "ќе напишам", "I'll write", "vou escrever"]
dialogue:
  - [protagonist, "Што да им купам за свадбата?", "What should I buy them for the wedding?", "O que eu compro para eles para o casamento?"]
  - [vera, "Ништо не купувајте. Ставете пари во плик.", "Don't buy anything. Put money in an envelope.", "Não compre nada. Coloque dinheiro num envelope."]
  - [protagonist, "Пари? Не е ли непристојно?", "Money? Isn't that rude?", "Dinheiro? Não é deselegante?"]
  - [vera, "Не, тоа е обичај. Секој дава плик, со честитка.", "No, it's the custom. Everyone gives an envelope, with a card.", "Não, é o costume. Todo mundo dá um envelope, com um cartão."]
  - [protagonist, "Колку?", "How much?", "Quanto?"]
  - [vera, "Колку што можете. Најмалку колку што чини вечерата.", "As much as you can. At least what the dinner costs.", "Quanto puder. Pelo menos o que custa o jantar."]
  - [protagonist, "Добро. Ќе напишам нешто убаво на честитката.", "All right. I'll write something nice on the card.", "Está bem. Vou escrever alguma coisa bonita no cartão."]
  - [vera, "На македонски! Ќе ви помогнам.", "In Macedonian! I'll help you.", "Em macedônio! Eu ajudo o senhor."]
teach:
  - ask: ["Ask what you should buy them.", "Pergunte o que comprar para eles.", "Што да им купам?", sto-da-im-kupam]
  - note: ["Negative words come with не: ништо не купувајте — don't buy anything; никој не дојде — nobody came. Like Portuguese 'não compre nada'.", "Palavras negativas vêm com не: ништо не купувајте — não compre nada; никој не дојде — ninguém veio. Como no português: 'não compre nada'."]
  - ask: ["Vera says: don't buy anything.", "A Vera diz: não compre nada.", "Ништо не купувајте.", nisto, ne-kupuvajte]
  - ask: ["Say: put money in an envelope.", "Diga: coloque dinheiro num envelope.", "Ставете пари во плик.", stavete, pari, plik]
  - ask: ["Say: it's the custom.", "Diga: é o costume.", "Тоа е обичај.", obicaj]
  - ask: ["Say: everyone gives an envelope.", "Diga: todo mundo dá um envelope.", "Секој дава плик.", sekoj, dava]
  - ask: ["Say: with a card.", "Diga: com um cartão.", "Со честитка.", cestitka]
  - ask: ["Say: as much as you can.", "Diga: quanto puder.", "Колку што можете.", kolku-sto-mozete]
  - ask: ["Say: at least what the dinner costs.", "Diga: pelo menos o que custa o jantar.", "Најмалку колку што чини вечерата.", najmalku, vecera]
  - ask: ["Say: I'll write something nice.", "Diga: vou escrever alguma coisa bonita.", "Ќе напишам нешто убаво.", ke-napisam, nesto]
  - note: ["Wedding guests give money in an envelope, handed to the couple or put in a box at the hall. A common rule: at least cover your own seat at the dinner.", "Os convidados dão dinheiro num envelope, entregue aos noivos ou colocado numa caixa no salão. Regra comum: pelo menos cobrir o seu lugar no jantar."]
  - pt_only: "No Brasil seria a lista de presentes; aqui, lista nem existe — é envelope."
