id: A2-15
protagonist: f
title: ["Money and per cent", "Dinheiro e porcentagem"]
situation: ["The sales have started. You go back to the jacket shop.", "Começaram as liquidações. Você volta à loja de casacos."]
learn: [a2-count-plural]
culture: —
items:
  - [popust, "попуст", "discount", "desconto", {rare: true}]
  - [na-popust, "на попуст", "on sale", "em promoção", {rare: true}]
  - [procenti, "проценти", "per cent", "por cento"]
  - [polovina-cena, "половина цена", "half price", "metade do preço"]
  - [bese, "беше", "was", "era / estava"]
  - [cevlite, "чевлите", "the shoes", "os sapatos"]
  - [ke-razmislam, "ќе размислам", "I'll think about it", "vou pensar"]
  - [kolku-casa, "Колку часа…?", "How many hours…?", "Quantas horas…?"]
  - [otvoreni, "отворени", "open (plural)", "abertos"]
  - [devet, "девет", "nine", "nove"]
  - [trae, "трае", "lasts", "dura", {rare: true}]
  - [tri-dena, "три дена", "three days", "três dias"]
dialogue:
  - [protagonist, "Добар ден. Има ли попуст?", "Hello. Is there a discount?", "Boa tarde. Tem desconto?"]
  - [seller, "Да, сѐ е на попуст — дваесет проценти.", "Yes, everything is on sale — twenty per cent.", "Sim, tudo em promoção — vinte por cento."]
  - [protagonist, "А оваа јакна?", "And this jacket?", "E este casaco?"]
  - [seller, "Таа е на половина цена. Беше четири илјади, сега две.", "That one is half price. It was four thousand, now two.", "Esse está pela metade do preço. Era quatro mil, agora dois."]
  - [protagonist, "Супер! А чевлите?", "Great! And the shoes?", "Ótimo! E os sapatos?"]
  - [seller, "Чевлите — само десет проценти.", "The shoes — only ten per cent.", "Os sapatos — só dez por cento."]
  - [protagonist, "Ќе размислам. Колку часа сте отворени?", "I'll think about it. How long are you open?", "Vou pensar. Até que horas vocês ficam abertos?"]
  - [seller, "До девет. Попустот трае три дена.", "Until nine. The sale lasts three days.", "Até as nove. A promoção dura três dias."]
teach:
  - ask: ["Ask if there's a discount.", "Pergunte se tem desconto.", "Има ли попуст?", popust]
  - ask: ["Say: everything is on sale.", "Diga: tudo em promoção.", "Сѐ е на попуст.", sve, na-popust]
  - ask: ["Say: twenty per cent.", "Diga: vinte por cento.", "Дваесет проценти.", procenti]
  - ask: ["Say: it's half price.", "Diga: está pela metade do preço.", "На половина цена е.", polovina-cena]
  - ask: ["Say: it was four thousand.", "Diga: era quatro mil.", "Беше четири илјади.", bese, cetiri, iljadi]
  - ask: ["Ask: and the shoes?", "Pergunte: e os sapatos?", "А чевлите?", cevlite]
  - ask: ["Say: I'll think about it.", "Diga: vou pensar.", "Ќе размислам.", ke-razmislam]
  - note: ["After a number, masculine words take -а instead of -и: ден → два дена, три дена; час → три часа. You heard 'два дена' at the doctor's.", "Depois de um número, palavras masculinas levam -а em vez de -и: ден → два дена, три дена; час → три часа. Você ouviu 'два дена' na médica."]
  - ask: ["Ask how many hours they're open.", "Pergunte quantas horas ficam abertos.", "Колку часа сте отворени?", kolku-casa, otvoreni]
  - ask: ["Say: until nine.", "Diga: até as nove.", "До девет.", do, devet]
  - ask: ["Say: the sale lasts three days.", "Diga: a promoção dura três dias.", "Попустот трае три дена.", trae, tri-dena]
