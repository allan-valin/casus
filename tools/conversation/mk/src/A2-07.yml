id: A2-07
protagonist: f
title: ["Are the Balkans dangerous?", "Os Bálcãs são perigosos?"]
situation: ["Marko asks what people at home think of Skopje.", "O Marko pergunta o que o pessoal no Brasil pensa de Skopje."]
learn: [a2-comparison]
culture: The myth of the dangerous Balkans
items:
  - [sto-mislat, "Што мислат…?", "What do (they) think…?", "O que (eles) acham…?"]
  - [mislese, "мислеше", "(she) thought", "(ela) achava"]
  - [opasen, "опасен", "dangerous (masculine)", "perigoso"]
  - [pobezbedno, "побезбедно", "safer", "mais seguro"]
  - [bezbedno, "безбедно", "safe", "seguro"]
  - [vsusnost, "всушност", "actually", "na verdade"]
  - [se-cuvstvuvam, "се чувствувам", "I feel", "me sinto"]
  - [nokje, "ноќе", "at night", "à noite"]
  - [setam, "шетам", "I walk (around)", "eu ando / passeio"]
  - [sama, "сама", "alone (a woman)", "sozinha"]
  - [kako-sekade, "како секаде", "like everywhere", "como em todo lugar"]
  - [predrasuda, "предрасуда", "prejudice", "preconceito", {rare: true}]
dialogue:
  - [marko, "Што мислат твоите во Бразил за Скопје?", "What do your folks in Brazil think of Skopje?", "O que o seu pessoal no Brasil acha de Skopje?"]
  - [protagonist, "Мајка ми мислеше дека Балканот е опасен.", "My mother thought the Balkans were dangerous.", "Minha mãe achava que os Bálcãs eram perigosos."]
  - [marko, "Опасен? Скопје е побезбедно од многу градови.", "Dangerous? Skopje is safer than many cities.", "Perigoso? Skopje é mais seguro que muitas cidades."]
  - [protagonist, "Да, всушност тука се чувствувам безбедно.", "Yes, actually I feel safe here.", "É, na verdade aqui eu me sinto segura."]
  - [protagonist, "Ноќе шетам сама, со телефон в рака.", "At night I walk alone, phone in hand.", "À noite ando sozinha, com o celular na mão."]
  - [marko, "Има и криминал, како секаде, но малку.", "There is crime, like everywhere, but not much.", "Tem crime, como em todo lugar, mas pouco."]
  - [protagonist, "Во Сао Паоло ноќе не шетам така.", "In São Paulo I don't walk like that at night.", "Em São Paulo não ando assim à noite."]
  - [marko, "Тоа е стара предрасуда, од деведесеттите.", "That's an old prejudice, from the nineties.", "Isso é preconceito antigo, dos anos noventa."]
teach:
  - note: ["Comparisons add по-: безбедно → побезбедно (safer), убаво → поубаво. 'Than' is 'од': побезбедно од многу градови.", "Comparações levam по-: безбедно → побезбедно (mais seguro), убаво → поубаво. 'Do que' é 'од': побезбедно од многу градови."]
  - ask: ["Marko asks what your folks think. How?", "O Marko pergunta o que o seu pessoal acha. Como?", "Што мислат твоите?", sto-mislat]
  - ask: ["Say: my mother thought the Balkans were dangerous.", "Diga: minha mãe achava que os Bálcãs eram perigosos.", "Мајка ми мислеше дека Балканот е опасен.", majka, mislese, opasen]
  - ask: ["Say: Skopje is safer.", "Diga: Skopje é mais seguro.", "Скопје е побезбедно.", pobezbedno]
  - ask: ["Say: actually I feel safe.", "Diga: na verdade me sinto segura.", "Всушност се чувствувам безбедно.", vsusnost, se-cuvstvuvam, bezbedno]
  - ask: ["Say: at night I walk alone.", "Diga: à noite ando sozinha.", "Ноќе шетам сама.", nokje, setam, sama]
  - ask: ["Say for him: like everywhere.", "Diga por ele: como em todo lugar.", "Како секаде.", kako-sekade]
  - ask: ["Say: that's a prejudice.", "Diga: isso é preconceito.", "Тоа е предрасуда.", predrasuda]
  - note: ["The fear comes from the wars of the 1990s in the former Yugoslavia. North Macedonia left Yugoslavia peacefully in 1991; a short armed conflict in 2001 ended with the Ohrid Agreement. Today violent crime is low; the real danger is the traffic.", "O medo vem das guerras dos anos noventa na antiga Iugoslávia. A Macedônia do Norte saiu da Iugoslávia em paz, em 1991; um conflito armado curto em 2001 terminou com o Acordo de Ohrid. Hoje a criminalidade violenta é baixa; o perigo de verdade é o trânsito."]
  - ask: ["Say: Skopje is safer than São Paulo.", "Diga: Skopje é mais seguro que São Paulo.", "Скопје е побезбедно од Сао Паоло.", pobezbedno, od]
  - pt_only: "Andar com o celular na mão à noite é a primeira coisa que o brasileiro estranha — e a primeira de que sente falta na volta."
