id: C2-13
protagonist: f
title: ["A talk", "Uma palestra"]
situation: ["Your first talk at Skopje's IT meetup — in Macedonian. Questions from the floor.", "Sua primeira palestra no meetup de TI de Skopje — em macedônio. Perguntas da plateia."]
learn: [c2-register]
culture: —
items:
  - [predavanje, "предавање", "lecture, talk", "palestra"]
  - [slajdovite, "слајдовите", "the slides", "os slides", {rare: true}]
  - [prasanja-od-publikata, "прашања од публиката", "questions from the audience", "perguntas da plateia"]
  - [dobro-prasanje, "добро прашање", "good question", "boa pergunta"]
  - [ke-se-vratam-na-toa, "ќе се вратам на тоа", "I'll come back to that", "volto nisso"]
  - [nakratko, "накратко", "briefly", "resumindo"]
  - [vo-praksa, "во пракса", "in practice", "na prática"]
  - [ne-znam-odgovor, "не знам, ќе проверам", "I don't know, I'll check", "não sei, vou verificar"]
  - [vi-blagodaram-na-vnimanieto, "ви благодарам на вниманието", "thank you for your attention", "obrigada pela atenção"]
  - [publikata-aplauz, "аплаузот", "the applause", "os aplausos"]
dialogue:
  - [protagonist, "Добровечер. Накратко: ќе зборувам за брзи апликации во пракса.", "Good evening. Briefly: I'll talk about fast apps in practice.", "Boa noite. Resumindo: vou falar de aplicativos rápidos na prática."]
  - [protagonist, "На слајдовите: три грешки што ги направивме.", "On the slides: three mistakes we made.", "Nos slides: três erros que a gente cometeu."]
  - [protagonist, "Прашања од публиката?", "Questions from the audience?", "Perguntas da plateia?"]
  - [darko, "Зошто не користевте кеш?", "Why didn't you use a cache?", "Por que vocês não usaram cache?"]
  - [protagonist, "Добро прашање — ќе се вратам на тоа на крајот.", "Good question — I'll come back to that at the end.", "Boa pergunta — volto nisso no final."]
  - [klient, "Колку чини серверот месечно?", "How much does the server cost a month?", "Quanto custa o servidor por mês?"]
  - [protagonist, "Искрено, не знам точно. Ќе проверам и ќе ви пишам.", "Honestly, I don't know exactly. I'll check and write to you.", "Sinceramente, não sei exatamente. Vou verificar e te escrevo."]
  - [protagonist, "Ви благодарам на вниманието.", "Thank you for your attention.", "Obrigada pela atenção."]
teach:
  - ask: ["Open: briefly, I'll talk about…", "Abra: resumindo, vou falar de…", "Накратко, ќе зборувам за…", nakratko]
  - ask: ["Say: in practice.", "Diga: na prática.", "Во пракса.", vo-praksa]
  - ask: ["Say: on the slides.", "Diga: nos slides.", "На слајдовите.", slajdovite]
  - ask: ["Invite questions from the audience.", "Convide perguntas da plateia.", "Прашања од публиката?", prasanja-od-publikata]
  - ask: ["Say: good question.", "Diga: boa pergunta.", "Добро прашање.", dobro-prasanje]
  - ask: ["Say: I'll come back to that.", "Diga: volto nisso.", "Ќе се вратам на тоа.", ke-se-vratam-na-toa]
  - ask: ["Say: I don't know, I'll check.", "Diga: não sei, vou verificar.", "Не знам, ќе проверам.", ne-znam-odgovor]
  - ask: ["Close: thank you for your attention.", "Encerre: obrigada pela atenção.", "Ви благодарам на вниманието.", vi-blagodaram-na-vnimanieto]
  - ask: ["Say: the talk.", "Diga: a palestra.", "Предавањето.", predavanje]
  - ask: ["Say: the applause.", "Diga: os aplausos.", "Аплаузот.", publikata-aplauz]
  - note: ["Admitting 'не знам, ќе проверам' in public earns more trust than a vague answer — and keeps the talk in your control.", "Admitir 'не знам, ќе проверам' em público ganha mais confiança que uma resposta vaga — e mantém a palestra sob controle."]
