id: C1-07
protagonist: f
title: ["The partner's parents", "Os pais do parceiro"]
situation: ["First big dinner as Bojan's fiancée. His mother watches every move.", "Primeiro grande jantar como noiva do Bojan. A mãe dele observa cada movimento."]
learn: [c1-clitic-clusters]
culture: The in-laws' table
items:
  - [svekrva, "свекрва", "mother-in-law (husband's mother)", "sogra"]
  - [svekor, "свекор", "father-in-law (husband's father)", "sogro"]
  - [daj-mi-ja, "дај ми ја", "give it to me (feminine thing)", "me dá ela"]
  - [ke-ti-ja-dadam, "ќе ти ја дадам", "I'll give it to you", "vou te dar"]
  - [receptot, "рецептот", "the recipe", "a receita"]
  - [ne-mu-go-davaj, "не му го давај", "don't give it to him", "não dá para ele"]
  - [test, "тест", "test", "teste"]
  - [go-pomina, "го помина", "you passed it", "você passou"]
  - [ostanatoto, "останатото", "the rest", "o resto"]
  - [da-vi-pomognam-so-sadovite, "да ви помогнам со садовите", "let me help with the dishes", "deixa eu ajudar com a louça"]
dialogue:
  - [svekrva-c, "Пробај ја пита. Ја правам по рецептот на мајка ми.", "Try the pie. I make it from my mother's recipe.", "Prova a torta. Eu faço com a receita da minha mãe."]
  - [protagonist, "Прекрасна е! Ќе ми го дадете ли рецептот?", "It's wonderful! Will you give me the recipe?", "Está maravilhosa! A senhora me dá a receita?"]
  - [svekrva-c, "Ќе ти го дадам, но не му го давај на никого.", "I'll give it to you, but don't give it to anyone.", "Vou te dar, mas não dá para ninguém."]
  - [svekor-c, "Ниту на мене не ми го даде, триесет години!", "She hasn't given it even to me, in thirty years!", "Nem para mim ela deu, em trinta anos!"]
  - [protagonist, "Да ви помогнам со садовите?", "Can I help with the dishes?", "Deixa eu ajudar com a louça?"]
  - [svekrva-c, "Не, не, седи. Гостинката не мие.", "No, no, sit. A guest doesn't wash up.", "Não, não, senta. Visita não lava louça."]
  - [bojan, "Тоа беше тест. Го помина!", "That was a test. You passed it!", "Isso foi um teste. Você passou!"]
  - [protagonist, "А останатото?", "And the rest?", "E o resto?"]
  - [bojan, "Останатото ќе го видиме на свадбата.", "The rest we'll see at the wedding.", "O resto a gente vê no casamento."]
teach:
  - note: ["Clitic clusters: 'to whom' then 'what', always before the verb (or after a command): ќе ти го дадам (I'll give it to you), не му го давај (don't give it to him), дај ми ја (give it to me).", "Grupos de pronomes: 'a quem' depois 'o quê', sempre antes do verbo (ou depois de uma ordem): ќе ти го дадам (vou te dar), не му го давај (não dá para ele), дај ми ја (me dá)."]
  - ask: ["Ask: will you give me the recipe? (formal)", "Pergunte: a senhora me dá a receita?", "Ќе ми го дадете ли рецептот?", receptot]
  - ask: ["Say for her: I'll give it to you.", "Diga por ela: vou te dar.", "Ќе ти го дадам.", ke-ti-ja-dadam]
  - ask: ["Say: but don't give it to him.", "Diga: mas não dá para ele.", "Но не му го давај.", ne-mu-go-davaj]
  - ask: ["To Bojan: give it to me! (the pie, feminine)", "Para o Bojan: me dá! (a torta)", "Дај ми ја!", daj-mi-ja]
  - ask: ["Offer to help with the dishes.", "Ofereça ajudar com a louça.", "Да ви помогнам со садовите?", da-vi-pomognam-so-sadovite]
  - ask: ["Bojan: that was a test.", "O Bojan: isso foi um teste.", "Тоа беше тест.", test]
  - ask: ["Bojan: you passed it!", "O Bojan: você passou!", "Го помина!", go-pomina]
  - ask: ["Ask: and the rest?", "Pergunte: e o resto?", "А останатото?", ostanatoto]
  - ask: ["Say: my mother-in-law and father-in-law.", "Diga: minha sogra e meu sogro.", "Свекрва ми и свекор ми.", svekrva, svekor]
  - note: ["The future mother-in-law (свекрва) has a big role. Praise the food, ask for the recipe, offer to help — and accept being told to sit.", "A futura sogra (свекрва) tem papel grande. Elogie a comida, peça a receita, ofereça ajuda — e aceite quando mandarem sentar."]
