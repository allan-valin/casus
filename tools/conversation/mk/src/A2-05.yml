id: A2-05
protagonist: f
title: [At the doctor's, Na médica]
situation: ["You caught a cold. Back to Dr Petrovska.", "Você pegou um resfriado. De volta à doutora Petrovska."]
learn: [a2-imperative]
culture: Mountain tea and home remedies
items:
  - [sto-ve-boli, "Што ве боли?", "What hurts? (formal)", "O que está doendo?"]
  - [grloto, "грлото", "the throat", "a garganta"]
  - [temperatura, "температура", "a temperature, fever", "febre"]
  - [od-koga, "Од кога?", "Since when?", "Desde quando?"]
  - [mislam-deka, "мислам дека", "I think (that)", "acho que"]
  - [pijte, "Пијте", "Drink (formal)", "Beba (formal)"]
  - [med, "мед", "honey", "mel", {rare: true}]
  - [lekovi, "лекови", "medicine", "remédios"]
  - [recept, "рецепт", "prescription / recipe", "receita", {rare: true}]
  - [pati-na-den, "три пати на ден", "three times a day", "três vezes ao dia"]
  - [ne-odete, "не одете", "don't go (formal)", "não vá"]
  - [dva-dena, "два дена", "two days", "dois dias"]
dialogue:
  - [doktorka, "Што ве боли?", "What hurts?", "O que está doendo?"]
  - [protagonist, "Ме боли грлото и имам температура.", "My throat hurts and I have a temperature.", "Minha garganta dói e estou com febre."]
  - [doktorka, "Од кога?", "Since when?", "Desde quando?"]
  - [protagonist, "Од вчера. Мислам дека е од промајата!", "Since yesterday. I think it's from the draft!", "Desde ontem. Acho que foi a corrente de ar!"]
  - [doktorka, "Можеби. Пијте многу чај, со мед и лимон.", "Maybe. Drink lots of tea, with honey and lemon.", "Talvez. Beba bastante chá, com mel e limão."]
  - [protagonist, "А лекови?", "And medicine?", "E remédio?"]
  - [doktorka, "Еве рецепт. Една таблета три пати на ден.", "Here's a prescription. One tablet three times a day.", "Aqui a receita. Um comprimido três vezes ao dia."]
  - [protagonist, "Благодарам.", "Thank you.", "Obrigada."]
  - [doktorka, "И не одете на работа два дена.", "And don't go to work for two days.", "E não vá trabalhar por dois dias."]
teach:
  - ask: ["The doctor asks what hurts. How?", "A médica pergunta o que dói. Como?", "Што ве боли?", sto-ve-boli]
  - ask: ["Say: my throat hurts.", "Diga: minha garganta dói.", "Ме боли грлото.", me-boli, grloto]
  - ask: ["Say: I have a temperature.", "Diga: estou com febre.", "Имам температура.", imam, temperatura]
  - ask: ["She asks since when.", "Ela pergunta desde quando.", "Од кога?", od-koga]
  - ask: ["Say: since yesterday.", "Diga: desde ontem.", "Од вчера.", od, vcera]
  - ask: ["Say: I think it's from the draft!", "Diga: acho que foi a corrente de ar!", "Мислам дека е од промајата!", mislam-deka, promaja]
  - note: ["Telling people what to do: пиј, пијте (drink), јади, јадете (eat), оди, одете (go). The -те form is for Вие and for several people.", "Para dizer o que fazer: пиј, пијте (beba), јади, јадете (coma), оди, одете (vá). A forma com -те é para Вие e para várias pessoas."]
  - ask: ["Her advice: drink lots of tea.", "O conselho dela: beba bastante chá.", "Пијте многу чај.", pijte, caj]
  - ask: ["With honey and lemon.", "Com mel e limão.", "Со мед и лимон.", so, med, limon]
  - ask: ["Ask: and medicine?", "Pergunte: e remédio?", "А лекови?", lekovi]
  - ask: ["Say: one tablet three times a day.", "Diga: um comprimido três vezes ao dia.", "Една таблета три пати на ден.", pati-na-den]
  - ask: ["She says: don't go to work for two days.", "Ela diz: não vá trabalhar por dois dias.", "Не одете на работа два дена.", ne-odete, rabota, dva-dena]
  - note: ["Before the pharmacy, many people reach for tea: mountain tea (планински чај), camomile, or 'tea' with a little rakija for a cold.", "Antes da farmácia, muita gente recorre ao chá: chá da montanha (планински чај), camomila, ou 'chá' com um pouco de rakija para o resfriado."]
  - pt_only: "Como o chá da avó no Brasil — só que aqui o chá da montanha cresce no Šar e no Galičica."
  - ask: ["Get a prescription: ask for one. (just: a prescription)", "Peça uma receita. (só: receita)", "Рецепт.", recept]
