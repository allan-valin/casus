id: B1-23
protagonist: f
title: ["I was going to", "Ia fazer"]
situation: ["Monday. Ana's weekend plans fell apart, and so did yours.", "Segunda. Os planos de fim de semana da Ana deram errado, e os seus também."]
learn: [b1-future-past]
culture: —
items:
  - [ke-odev, "ќе одев", "I was going to go", "eu ia"]
  - [ama, "ама", "but (colloquial)", "mas"]
  - [vrnese, "врнеше", "it was raining", "estava chovendo"]
  - [planot, "планот", "the plan", "o plano"]
  - [propadna, "пропадна", "fell through", "furou / deu errado"]
  - [ke-gledavme, "ќе гледавме", "we were going to watch", "a gente ia assistir"]
  - [se-razbolea, "се разболе", "got ill", "ficou doente"]
  - [namesto-toa, "наместо тоа", "instead", "em vez disso"]
  - [spiev, "спиев", "I slept", "dormi"]
  - [sledniot-vikend, "следниот викенд", "next weekend", "no próximo fim de semana"]
dialogue:
  - [ana, "Ќе одев во Струга за викендот, ама врнеше цело време.", "I was going to go to Struga for the weekend, but it rained the whole time.", "Eu ia para Struga no fim de semana, mas choveu o tempo todo."]
  - [protagonist, "И мојот план пропадна.", "My plan fell through too.", "O meu plano também furou."]
  - [ana, "Што ќе правеше?", "What were you going to do?", "O que você ia fazer?"]
  - [protagonist, "Со Бојан ќе гледавме натпревар, ама тој се разболе.", "Bojan and I were going to watch a match, but he got ill.", "Eu e o Bojan íamos ver um jogo, mas ele ficou doente."]
  - [ana, "И што направи наместо тоа?", "And what did you do instead?", "E o que você fez em vez disso?"]
  - [protagonist, "Спиев. Дванаесет часа!", "I slept. Twelve hours!", "Dormi. Doze horas!"]
  - [ana, "Не е лош план. Следниот викенд — Струга, заедно?", "Not a bad plan. Next weekend — Struga, together?", "Não é um plano ruim. No próximo fim de semana — Struga, juntas?"]
  - [protagonist, "Ако не врне!", "If it doesn't rain!", "Se não chover!"]
teach:
  - note: ["'Was going to': ќе + the imperfect — ќе одев (I was going to go), ќе гледавме (we were going to watch). The same form says 'would have' in unreal conditions.", "'Ia fazer': ќе + o imperfeito — ќе одев (eu ia), ќе гледавме (a gente ia assistir). A mesma forma diz 'teria' nas condições irreais."]
  - ask: ["Say: I was going to go to Struga.", "Diga: eu ia para Struga.", "Ќе одев во Струга.", ke-odev]
  - ask: ["Say: but it was raining.", "Diga: mas estava chovendo.", "Ама врнеше.", ama, vrnese]
  - ask: ["Say: my plan fell through too.", "Diga: o meu plano também furou.", "И мојот план пропадна.", planot, propadna]
  - ask: ["Say: we were going to watch a match.", "Diga: a gente ia assistir a um jogo.", "Ќе гледавме натпревар.", ke-gledavme, natprevar]
  - ask: ["Say: but he got ill.", "Diga: mas ele ficou doente.", "Ама тој се разболе.", se-razbolea]
  - ask: ["Ask what she did instead.", "Pergunte o que ela fez em vez disso.", "Што направи наместо тоа?", namesto-toa]
  - ask: ["Say: I slept. Twelve hours!", "Diga: dormi. Doze horas!", "Спиев. Дванаесет часа!", spiev]
  - ask: ["Say: next weekend, together?", "Diga: no próximo fim de semana, juntas?", "Следниот викенд, заедно?", sledniot-vikend, zaedno]
  - ask: ["Say: if it doesn't rain!", "Diga: se não chover!", "Ако не врне!", ako, vrne]
