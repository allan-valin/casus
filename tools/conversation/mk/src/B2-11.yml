id: B2-11
protagonist: f
title: ["On the phone", "Ao telefone"]
situation: ["A client calls the office. You pick up.", "Um cliente liga para o escritório. Você atende."]
learn: [b2-da-wishes]
culture: —
items:
  - [ve-slusam, "Ве слушам", "I'm listening (formal phone answer)", "Pois não / Estou ouvindo"]
  - [so-kogo-zboruvam, "Со кого зборувам?", "Who am I speaking to?", "Com quem eu falo?"]
  - [ke-ve-povrzam, "ќе ве поврзам", "I'll put you through", "vou transferir"]
  - [moment, "Момент", "One moment", "Um momento"]
  - [zafaten, "зафатен", "busy (masculine)", "ocupado"]
  - [da-mu-prenesam, "Да му пренесам порака?", "Shall I give him a message?", "Quer deixar recado?"]
  - [da-ve-povika, "да ве повика", "to call you back", "retornar a ligação"]
  - [broj-na-telefon, "број на телефон", "phone number", "número de telefone"]
  - [da-ste-ziv-i-zdrav, "Да сте живи и здрави", "Be well (may you be alive and healthy)", "Fique com Deus / tudo de bom"]
  - [prijaten-den, "Пријатен ден", "Have a nice day", "Tenha um bom dia"]
dialogue:
  - [protagonist, "„Вардар Софт“, ве слушам.", "Vardar Soft, how can I help?", "Vardar Soft, pois não."]
  - [klient, "Добар ден, го барам г. Николовски.", "Good morning, I'm looking for Mr Nikolovski.", "Bom dia, procuro o senhor Nikolovski."]
  - [protagonist, "Со кого зборувам?", "Who am I speaking to?", "Com quem eu falo?"]
  - [klient, "Трајковски, од банката.", "Trajkovski, from the bank.", "Trajkovski, do banco."]
  - [protagonist, "Момент, ќе ве поврзам... Жал ми е, зафатен е.", "One moment, I'll put you through... I'm sorry, he's busy.", "Um momento, vou transferir... Sinto muito, ele está ocupado."]
  - [protagonist, "Да му пренесам порака?", "Shall I give him a message?", "Quer deixar recado?"]
  - [klient, "Да ме повика денеска. Бројот го има.", "For him to call me back today. He has the number.", "Que ele me retorne hoje. Ele tem o número."]
  - [protagonist, "Ќе му кажам. Пријатен ден!", "I'll tell him. Have a nice day!", "Vou avisar. Tenha um bom dia!"]
  - [klient, "Да сте живи и здрави!", "Be well!", "Tudo de bom!"]
teach:
  - ask: ["Answer the office phone.", "Atenda o telefone do escritório.", "„Вардар Софт“, ве слушам.", ve-slusam]
  - ask: ["Ask who you're speaking to.", "Pergunte com quem fala.", "Со кого зборувам?", so-kogo-zboruvam]
  - ask: ["Say: one moment, I'll put you through.", "Diga: um momento, vou transferir.", "Момент, ќе ве поврзам.", moment, ke-ve-povrzam]
  - ask: ["Say: I'm sorry, he's busy.", "Diga: sinto muito, ele está ocupado.", "Жал ми е, зафатен е.", zafaten]
  - ask: ["Offer to take a message.", "Ofereça anotar recado.", "Да му пренесам порака?", da-mu-prenesam]
  - note: ["Да + a verb on its own makes a wish or a polite request: 'да ме повика' — (I'd like) him to call me; 'да сте живи и здрави' — may you be alive and well, a warm goodbye.", "Да + verbo sozinho faz um desejo ou pedido educado: 'да ме повика' — (quero) que ele me ligue; 'да сте живи и здрави' — que o senhor tenha vida e saúde, uma despedida calorosa."]
  - ask: ["Say: for him to call you back.", "Diga: que ele retorne a ligação.", "Да ве повика.", da-ve-povika]
  - ask: ["Say: the phone number.", "Diga: o número de telefone.", "Бројот на телефон.", broj-na-telefon]
  - ask: ["End the call: have a nice day!", "Encerre: tenha um bom dia!", "Пријатен ден!", prijaten-den]
  - ask: ["His warm goodbye. How?", "A despedida calorosa dele. Como?", "Да сте живи и здрави!", da-ste-ziv-i-zdrav]
