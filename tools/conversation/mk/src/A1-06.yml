id: A1-06
protagonist: m
title: [Weather and seasons, O tempo e as estações]
situation: ["It is raining at the bus stop. Dragan is waiting too.", "Está chovendo no ponto de ônibus. O Dragan também está esperando."]
learn: [a1-adjectives]
culture: The seasons are the other way round
items:
  - [vrne, "Врне", "It's raining", "Está chovendo"]
  - [ladno, "ладно", "cold", "frio", {rare: true}]
  - [toplo, "топло", "warm", "quente", {rare: true}]
  - [denes, "денеска", "today", "hoje"]
  - [neli, "нели?", "isn't it? / right?", "né?"]
  - [leto, "лето", "summer", "verão", {rare: true}]
  - [zima, "зима", "winter", "inverno", {rare: true}]
  - [sega, "сега", "now", "agora"]
  - [vo, "во", "in", "em"]
  - [dekemvri, "декември", "December", "dezembro", {rare: true}]
  - [nemam, "немам", "I don't have", "eu não tenho"]
  - [cador, "чадор", "umbrella", "guarda-chuva", {rare: true}]
  - [imam, "имам", "I have", "eu tenho"]
  - [ubavo-vreme, "убаво време", "nice weather", "tempo bom"]
dialogue:
  - [dragan, "Добар ден! Врне, а?", "Hello! It's raining, eh?", "Bom dia! Está chovendo, hein?"]
  - [protagonist, "Да, врне. Многу е ладно денеска.", "Yes, it's raining. It's very cold today.", "Sim, está chovendo. Está muito frio hoje."]
  - [dragan, "Во Бразил е топло, нели?", "In Brazil it's warm, isn't it?", "No Brasil é quente, né?"]
  - [protagonist, "Да, таму е лето сега. Тука е зима.", "Yes, it's summer there now. Here it's winter.", "Sim, lá é verão agora. Aqui é inverno."]
  - [dragan, "Лето во декември? Убаво!", "Summer in December? Lovely!", "Verão em dezembro? Que bom!"]
  - [protagonist, "Немам чадор.", "I don't have an umbrella.", "Não tenho guarda-chuva."]
  - [dragan, "Повелете, имам два.", "Here you are, I have two.", "Tome, eu tenho dois."]
  - [protagonist, "Благодарам многу! Утре е убаво време?", "Thank you very much! Is tomorrow nice weather?", "Muito obrigado! Amanhã faz tempo bom?"]
  - [dragan, "Не знам. Можеби.", "I don't know. Maybe.", "Não sei. Talvez."]
teach:
  - note: ["'Врне' is 'it's raining' — one word, no 'it'.", "'Врне' é 'está chovendo' — uma palavra só."]
  - ask: ["Say that it's raining.", "Diga que está chovendo.", "Врне.", vrne]
  - note: ["For weather you say 'е' and a word in -о: 'ладно е' (it's cold), 'топло е' (it's warm).", "Para o tempo diz-se 'е' e uma palavra em -о: 'ладно е' (está frio), 'топло е' (está quente)."]
  - ask: ["Say: it's very cold today.", "Diga: está muito frio hoje.", "Многу е ладно денеска.", mnogu, ladno, denes]
  - ask: ["Say: in Brazil it's warm, isn't it?", "Diga: no Brasil é quente, né?", "Во Бразил е топло, нели?", vo, toplo, neli]
  - note: ["South of the equator the seasons are the other way round: December is summer in Brazil, winter here.", "Ao sul do equador as estações são invertidas: dezembro é verão no Brasil e inverno aqui."]
  - ask: ["Say: it's summer there now.", "Diga: lá é verão agora.", "Таму е лето сега.", tamu, leto, sega]
  - ask: ["Say: here it's winter.", "Diga: aqui é inverno.", "Тука е зима.", tuka, zima]
  - ask: ["Dragan is surprised: summer in December? Say it.", "O Dragan se espanta: verão em dezembro? Diga.", "Лето во декември?", leto, vo, dekemvri]
  - ask: ["Say that you don't have an umbrella.", "Diga que não tem guarda-chuva.", "Немам чадор.", nemam, cador]
  - ask: ["Dragan has two. Say it for him: I have two.", "O Dragan tem dois. Diga por ele: eu tenho dois.", "Имам два.", imam]
  - ask: ["Say it's nice weather today.", "Diga que hoje faz tempo bom.", "Денеска е убаво време.", denes, ubavo-vreme]
  - ask: ["Say: it's warm now.", "Diga: agora está quente.", "Сега е топло.", sega, toplo]
  - pt_only: "Em Skopje o inverno é de verdade: neve, e a fumaça do aquecimento no ar. O verão chega a quarenta graus."
