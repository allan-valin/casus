id: B2-22
protagonist: m
title: ["The holiday", "Feriado"]
situation: ["2 August is a Wednesday. The office plans a bridge.", "O dia 2 de agosto cai numa quarta. O escritório planeja uma ponte."]
learn: [b2-personal-numerals]
culture: Ilinden
items:
  - [ilinden, "Илинден", "Ilinden (2 August)", "Ilinden (2 de agosto)", {rare: true}]
  - [drzaven-praznik, "државен празник", "public holiday", "feriado nacional"]
  - [vostanie, "востание", "uprising", "levante / revolta", {rare: true}]
  - [prodolzen-vikend, "продолжен викенд", "long weekend", "feriadão"]
  - [dvajca, "двајца", "two (people)", "dois (pessoas)"]
  - [trojca, "тројца", "three (people)", "três (pessoas)"]
  - [neka-zemat, "нека земат", "let them take", "que eles tirem"]
  - [slobodni-denovi, "слободни денови", "days off", "dias de folga"]
  - [dezuren, "дежурен", "on duty (masculine)", "de plantão", {rare: true}]
  - [na-more, "на море", "to the seaside", "para a praia"]
dialogue:
  - [darko, "Илинден е во среда. Државен празник!", "Ilinden is on Wednesday. A public holiday!", "O Ilinden é na quarta. Feriado nacional!"]
  - [protagonist, "Што се слави на Илинден?", "What's celebrated on Ilinden?", "O que se comemora no Ilinden?"]
  - [darko, "Илинденското востание од 1903 и АСНОМ од 1944.", "The Ilinden Uprising of 1903 and ASNOM of 1944.", "O Levante de Ilinden de 1903 e a ASNOM de 1944."]
  - [nikolovski, "Ако земете четврток и петок, имате продолжен викенд.", "If you take Thursday and Friday, you have a long weekend.", "Se vocês tirarem quinta e sexta, ficam com um feriadão."]
  - [darko, "Ние двајца одиме на море!", "The two of us are going to the seaside!", "Nós dois vamos para a praia!"]
  - [nikolovski, "Добро, нека земат слободни денови. Но тројца остануваат.", "Fine, let them take days off. But three people stay.", "Tudo bem, que tirem folga. Mas três ficam."]
  - [protagonist, "Јас ќе бидам дежурен. Морето е далеку за мене.", "I'll be on duty. The sea is far for me.", "Eu fico de plantão. O mar é longe para mim."]
  - [darko, "Како далеку? Грција е три часа!", "Far? Greece is three hours!", "Como longe? A Grécia é a três horas!"]
teach:
  - ask: ["Say: Ilinden is on Wednesday.", "Diga: o Ilinden é na quarta.", "Илинден е во среда.", ilinden]
  - ask: ["Say: a public holiday.", "Diga: feriado nacional.", "Државен празник.", drzaven-praznik]
  - ask: ["Say: the Ilinden Uprising.", "Diga: o Levante de Ilinden.", "Илинденското востание.", vostanie]
  - ask: ["Say: a long weekend.", "Diga: um feriadão.", "Продолжен викенд.", prodolzen-vikend]
  - note: ["Counting men or mixed groups uses special numbers: двајца (two people), тројца (three), четворица. Women alone: две, три.", "Para contar homens ou grupos mistos há números próprios: двајца (dois), тројца (três), четворица. Só mulheres: две, три."]
  - ask: ["Say: the two of us are going to the seaside.", "Diga: nós dois vamos para a praia.", "Ние двајца одиме на море.", dvajca, na-more]
  - ask: ["Say: three people stay.", "Diga: três ficam.", "Тројца остануваат.", trojca]
  - ask: ["Say: let them take days off.", "Diga: que tirem folga.", "Нека земат слободни денови.", neka-zemat, slobodni-denovi]
  - ask: ["Say: I'll be on duty.", "Diga: eu fico de plantão.", "Ќе бидам дежурен.", dezuren]
  - note: ["2 August, Ilinden (St Elijah's day), marks the 1903 uprising against Ottoman rule and the 1944 founding assembly of the Macedonian state (ASNOM). It is the main national holiday.", "O 2 de agosto, Ilinden (dia de Santo Elias), marca o levante de 1903 contra o domínio otomano e a assembleia fundadora do Estado macedônio em 1944 (ASNOM). É o principal feriado nacional."]
