id: A2-17
protagonist: f
title: ["Ohrid (1)", "Ohrid (1)"]
situation: ["A long weekend in Ohrid with Ana. Three hours by bus, then the hotel.", "Um feriadão em Ohrid com a Ana. Três horas de ônibus, depois o hotel."]
learn: [a2-time]
culture: —
items:
  - [stignavme, "Стигнавме!", "We've arrived!", "Chegamos!"]
  - [rezervacija, "резервација", "reservation", "reserva", {rare: true}]
  - [soba-za-dvajca, "соба за двајца", "double room / room for two", "quarto para dois"]
  - [na-koe-ime, "На кое име?", "In what name?", "Em nome de quem?"]
  - [pogled, "поглед", "view", "vista"]
  - [pojadokot, "појадокот", "the breakfast", "o café da manhã"]
  - [od-sedum, "од седум", "from seven", "das sete"]
  - [plazata, "плажата", "the beach", "a praia"]
  - [kade-mozeme, "Каде можеме…?", "Where can we…?", "Onde a gente pode…?"]
  - [prijaten-prestoj, "Пријатен престој!", "Enjoy your stay!", "Boa estadia!", {rare: true}]
dialogue:
  - [protagonist, "Стигнавме! Три часа со автобус.", "We're here! Three hours by bus.", "Chegamos! Três horas de ônibus."]
  - [protagonist, "Добар ден. Имаме резервација, соба за двајца.", "Good afternoon. We have a reservation, a double room.", "Boa tarde. Temos uma reserva, quarto para dois."]
  - [sluzbenicka, "На кое име?", "In what name?", "Em nome de quem?"]
  - [ana, "Ана Николовска.", "Ana Nikolovska.", "Ana Nikolovska."]
  - [sluzbenicka, "Да. Соба со поглед на езерото.", "Yes. A room with a view of the lake.", "Sim. Quarto com vista para o lago."]
  - [protagonist, "Во колку часот е појадокот?", "What time is breakfast?", "A que horas é o café da manhã?"]
  - [sluzbenicka, "Од седум до десет.", "From seven to ten.", "Das sete às dez."]
  - [ana, "Каде можеме да пливаме?", "Where can we swim?", "Onde a gente pode nadar?"]
  - [sluzbenicka, "Плажата е на пет минути пешки. Пријатен престој!", "The beach is five minutes on foot. Enjoy your stay!", "A praia fica a cinco minutos a pé. Boa estadia!"]
teach:
  - ask: ["You get off the bus. Say: we're here!", "Você desce do ônibus. Diga: chegamos!", "Стигнавме!", stignavme]
  - ask: ["Say: three hours by bus.", "Diga: três horas de ônibus.", "Три часа со автобус.", tri, so]
  - ask: ["At the desk: we have a reservation.", "Na recepção: temos uma reserva.", "Имаме резервација.", imame, rezervacija]
  - ask: ["Say: a double room.", "Diga: quarto para dois.", "Соба за двајца.", soba-za-dvajca, za-dvajca]
  - ask: ["She asks in what name. How?", "Ela pergunta em nome de quem. Como?", "На кое име?", na-koe-ime]
  - ask: ["Say: a room with a view of the lake.", "Diga: quarto com vista para o lago.", "Соба со поглед на езерото.", pogled, ezeroto]
  - ask: ["Ask what time breakfast is.", "Pergunte a que horas é o café da manhã.", "Во колку часот е појадокот?", vo-kolku-casot, pojadokot]
  - ask: ["Say: from seven to ten.", "Diga: das sete às dez.", "Од седум до десет.", od-sedum, deset]
  - ask: ["Ask where you can swim.", "Pergunte onde vocês podem nadar.", "Каде можеме да пливаме?", kade-mozeme]
  - ask: ["Say: the beach is five minutes on foot.", "Diga: a praia fica a cinco minutos a pé.", "Плажата е на пет минути пешки.", plazata, peski]
  - ask: ["Wish someone a nice stay.", "Deseje boa estadia.", "Пријатен престој!", prijaten-prestoj]
  - pt_only: "'Praia' de lago, sim: em Ohrid a 'плажа' é de pedrinha e água doce, e no verão lota como Ubatuba."
