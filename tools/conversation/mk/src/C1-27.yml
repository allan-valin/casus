id: C1-27
protagonist: f
title: ["Mental health", "Saúde mental"]
situation: ["Months of overtime. You can't sleep. Ana suggests a psychologist.", "Meses de hora extra. Você não consegue dormir. A Ana sugere uma psicóloga."]
learn: [c1-particles]
culture: A taboo slowly lifting
items:
  - [stres, "стрес", "stress", "estresse"]
  - [ne-spijam, "не спијам", "I'm not sleeping", "não estou dormindo"]
  - [izgoruvanje, "изгорување", "burnout", "esgotamento (burnout)", {rare: true}]
  - [psiholog, "психолог", "psychologist", "psicólogo"]
  - [pa-sto, "па што", "so what", "e daí"]
  - [ne-si-luda, "не си луда", "you're not crazy", "você não é louca"]
  - [se-sramam, "се срамам", "I'm ashamed, embarrassed", "tenho vergonha"]
  - [nema-za-sto, "нема за што", "there's nothing to (be ashamed of)", "não tem por quê"]
  - [granici, "граници", "limits, boundaries", "limites"]
  - [odmor-vistinski, "вистински одмор", "a real holiday", "férias de verdade"]
dialogue:
  - [ana, "Изгледаш уморно. Што ти е?", "You look tired. What's wrong?", "Você está com cara de cansada. O que você tem?"]
  - [protagonist, "Стрес. Не спијам веќе месец дена.", "Stress. I haven't been sleeping for a month.", "Estresse. Faz um mês que não durmo."]
  - [ana, "Тоа е изгорување. Оди кај психолог.", "That's burnout. Go to a psychologist.", "Isso é burnout. Vai numa psicóloga."]
  - [protagonist, "Психолог? Се срамам. Што ќе речат луѓето?", "A psychologist? I'm embarrassed. What will people say?", "Psicóloga? Tenho vergonha. O que as pessoas vão dizer?"]
  - [ana, "Па што? Нема за што да се срамиш. Не си луда.", "So what? There's nothing to be ashamed of. You're not crazy.", "E daí? Não tem por que ter vergonha. Você não é louca."]
  - [ana, "И јас одев минатата година.", "I went too, last year.", "Eu também fui, no ano passado."]
  - [protagonist, "Ти? Не знаев.", "You? I didn't know.", "Você? Eu não sabia."]
  - [ana, "Научив да поставувам граници. И земи вистински одмор.", "I learned to set limits. And take a real holiday.", "Aprendi a colocar limites. E tira férias de verdade."]
teach:
  - ask: ["Say: stress.", "Diga: estresse.", "Стрес.", stres]
  - ask: ["Say: I haven't been sleeping for a month.", "Diga: faz um mês que não durmo.", "Не спијам веќе месец дена.", ne-spijam]
  - ask: ["Ana: that's burnout.", "A Ana: isso é burnout.", "Тоа е изгорување.", izgoruvanje]
  - ask: ["Ana: go to a psychologist.", "A Ana: vai numa psicóloga.", "Оди кај психолог.", psiholog]
  - ask: ["Say: I'm embarrassed.", "Diga: tenho vergonha.", "Се срамам.", se-sramam]
  - ask: ["Ana: so what?", "A Ana: e daí?", "Па што?", pa-sto]
  - ask: ["Ana: there's nothing to be ashamed of.", "A Ana: não tem por que ter vergonha.", "Нема за што да се срамиш.", nema-za-sto]
  - ask: ["Ana: you're not crazy.", "A Ana: você não é louca.", "Не си луда.", ne-si-luda]
  - ask: ["Say: set limits.", "Diga: colocar limites.", "Поставувај граници.", granici]
  - ask: ["Say: a real holiday.", "Diga: férias de verdade.", "Вистински одмор.", odmor-vistinski]
  - note: ["Seeing a psychologist is still stigmatised for many older people ('what will people say?'), but younger people talk about it more openly. Your family doctor can refer you, and private practices exist.", "Ir ao psicólogo ainda é estigma para muitos mais velhos ('o que as pessoas vão dizer?'), mas os mais jovens falam disso com mais abertura. O médico de família pode encaminhar, e há consultórios particulares."]
