id: B2-25
protagonist: f
title: ["Remote work", "Trabalho remoto"]
situation: ["Your Fridays at home. Bojan is home too.", "Suas sextas em casa. O Bojan também está em casa."]
learn: [b2-perfective-imperfect]
culture: —
items:
  - [rasporedot, "распоредот", "the schedule", "a agenda / o horário"]
  - [video-povik, "видео-повик", "video call", "videochamada", {rare: true}]
  - [ne-me-prekinuvaj, "не ме прекинувај", "don't interrupt me", "não me interrompe"]
  - [mikrofonot, "микрофонот", "the microphone", "o microfone"]
  - [isklucen, "исклучен", "switched off (masculine)", "desligado"]
  - [pauza, "пауза", "break", "pausa / intervalo"]
  - [ke-napravam, "ќе направам", "I'll make, I'll do", "vou fazer"]
  - [rucek-za-dvajca, "ручек за двајца", "lunch for two", "almoço para dois"]
  - [koncentriram, "се концентрирам", "I concentrate", "me concentro", {rare: true}]
  - [vo-kancelarija, "во канцеларија", "at the office", "no escritório"]
dialogue:
  - [protagonist, "Бојан, во десет имам видео-повик. Не ме прекинувај.", "Bojan, I have a video call at ten. Don't interrupt me.", "Bojan, às dez tenho videochamada. Não me interrompe."]
  - [bojan, "Добро. А распоредот за денеска?", "OK. And today's schedule?", "Tá bom. E a agenda de hoje?"]
  - [protagonist, "Повик, па код, па пауза во еден.", "A call, then code, then a break at one.", "Chamada, depois código, depois pausa à uma."]
  - [bojan, "Во паузата ќе направам ручек за двајца.", "In the break I'll make lunch for two.", "Na pausa eu faço almoço para dois."]
  - [protagonist, "Ах — микрофонот ми беше исклучен цело време!", "Ah — my microphone was off the whole time!", "Ah — meu microfone estava desligado o tempo todo!"]
  - [bojan, "Значи, никој не те слушнал?", "So nobody heard you?", "Então ninguém te ouviu?"]
  - [protagonist, "Дома тешко се концентрирам. Следниот петок — во канцеларија.", "At home I find it hard to concentrate. Next Friday — at the office.", "Em casa é difícil me concentrar. Na próxima sexta — no escritório."]
  - [bojan, "А ручекот?", "And lunch?", "E o almoço?"]
teach:
  - ask: ["Say: I have a video call at ten.", "Diga: às dez tenho videochamada.", "Во десет имам видео-повик.", video-povik]
  - ask: ["Say: don't interrupt me.", "Diga: não me interrompe.", "Не ме прекинувај.", ne-me-prekinuvaj]
  - ask: ["Ask: and today's schedule?", "Pergunte: e a agenda de hoje?", "А распоредот за денеска?", rasporedot]
  - ask: ["Say: a break at one.", "Diga: pausa à uma.", "Пауза во еден.", pauza]
  - ask: ["Bojan: I'll make lunch for two.", "O Bojan: eu faço almoço para dois.", "Ќе направам ручек за двајца.", ke-napravam, rucek-za-dvajca]
  - ask: ["Say: my microphone was off!", "Diga: meu microfone estava desligado!", "Микрофонот ми беше исклучен!", mikrofonot, isklucen]
  - ask: ["Say: at home I find it hard to concentrate.", "Diga: em casa é difícil me concentrar.", "Дома тешко се концентрирам.", koncentriram]
  - ask: ["Say: next Friday, at the office.", "Diga: na próxima sexta, no escritório.", "Следниот петок, во канцеларија.", vo-kancelarija]
  - note: ["'Не ме прекинувај' uses the ongoing verb: don't keep interrupting. A single, finished interruption would be 'прекине'.", "'Не ме прекинувај' usa o verbo em andamento: não fica me interrompendo. Uma interrupção única seria 'прекине'."]
