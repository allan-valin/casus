id: B2-01
protagonist: f
title: ["An offer", "Uma oferta"]
situation: ["Your contract with the foreign company ends this year. A Macedonian company calls.", "Seu contrato com a empresa estrangeira acaba este ano. Uma empresa macedônia liga."]
learn: [b2-impersonal]
culture: —
items:
  - [ponuda, "понуда", "offer", "oferta / proposta"]
  - [rabotno-mesto, "работно место", "job, position", "vaga / posto de trabalho"]
  - [se-bara, "се бара", "is wanted, is required", "procura-se / exige-se"]
  - [uslovi, "услови", "conditions, terms", "condições"]
  - [iskustvo, "искуство", "experience", "experiência"]
  - [zainteresirana, "заинтересирана", "interested (a woman)", "interessada"]
  - [razgovor, "разговор", "interview, conversation", "entrevista / conversa"]
  - [vi-odgovara, "Ви одговара ли…?", "Does … suit you? (formal)", "Para a senhora serve…?"]
  - [mi-odgovara, "ми одговара", "suits me", "me serve"]
  - [se-raboti, "се работи", "one works, people work", "trabalha-se"]
  - [od-devet-do-pet, "од девет до пет", "from nine to five", "das nove às cinco"]
dialogue:
  - [nikolovski, "Добар ден, Николовски од „Вардар Софт“. Имаме понуда за вас.", "Good afternoon, Nikolovski from Vardar Soft. We have an offer for you.", "Boa tarde, Nikolovski, da Vardar Soft. Temos uma proposta para a senhora."]
  - [protagonist, "Добар ден. Каква понуда?", "Good afternoon. What kind of offer?", "Boa tarde. Que tipo de proposta?"]
  - [nikolovski, "Работно место за програмер. Се бара искуство и македонски.", "A programmer position. Experience and Macedonian are required.", "Uma vaga de programadora. Exige-se experiência e macedônio."]
  - [protagonist, "Искуство имам. Македонски — учам!", "Experience I have. Macedonian — I'm learning!", "Experiência eu tenho. Macedônio — estou aprendendo!"]
  - [nikolovski, "Одлично ви оди. Какви се условите што ги барате?", "You're doing very well. What terms are you looking for?", "A senhora vai muito bem. Que condições a senhora procura?"]
  - [protagonist, "Заинтересирана сум, но прво сакам да ги видам условите.", "I'm interested, but first I'd like to see the terms.", "Estou interessada, mas primeiro quero ver as condições."]
  - [nikolovski, "Секако. Кај нас се работи од девет до пет. Ви одговара ли разговор во понеделник?", "Of course. With us people work nine to five. Does an interview on Monday suit you?", "Claro. Aqui se trabalha das nove às cinco. Uma entrevista na segunda serve para a senhora?"]
  - [protagonist, "Ми одговара. Благодарам!", "That suits me. Thank you!", "Serve. Obrigada!"]
teach:
  - ask: ["Say: we have an offer for you.", "Diga: temos uma proposta para a senhora.", "Имаме понуда за вас.", ponuda, za-vas]
  - ask: ["Say: a programmer position.", "Diga: uma vaga de programadora.", "Работно место за програмер.", rabotno-mesto]
  - note: ["'Се' with a verb and no subject makes general statements: се бара (is required, they want), се работи (people work), се зборува (it's said).", "'Се' com verbo e sem sujeito faz frases gerais: се бара (procura-se), се работи (trabalha-se), се зборува (fala-se)."]
  - ask: ["Say: experience is required.", "Diga: exige-se experiência.", "Се бара искуство.", se-bara, iskustvo]
  - ask: ["Say: I'm interested. (a woman)", "Diga: estou interessada.", "Заинтересирана сум.", zainteresirana]
  - ask: ["Say: first I'd like to see the terms.", "Diga: primeiro quero ver as condições.", "Прво сакам да ги видам условите.", prvo, uslovi]
  - ask: ["Say: people work nine to five here.", "Diga: aqui se trabalha das nove às cinco.", "Тука се работи од девет до пет.", se-raboti, od-devet-do-pet]
  - ask: ["He asks if an interview on Monday suits you. How?", "Ele pergunta se uma entrevista na segunda serve. Como?", "Ви одговара ли разговор во понеделник?", vi-odgovara, razgovor]
  - ask: ["Say: that suits me.", "Diga: serve.", "Ми одговара.", mi-odgovara]
