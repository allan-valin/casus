id: B1-13
protagonist: f
title: ["The wedding (2)", "O casamento (2)"]
situation: ["The hall. The music starts and nobody stays seated.", "O salão. A música começa e ninguém fica sentado."]
learn: [b1-verbal-adverb]
culture: Everyone dances
items:
  - [fati-me, "Фати ме за рака!", "Take my hand!", "Pega na minha mão!"]
  - [igrajkji, "играјќи", "dancing (while dancing)", "dançando"]
  - [peejkji, "пеејќи", "singing (while singing)", "cantando"]
  - [stani, "Стани!", "Get up! (informal)", "Levanta!"]
  - [nikoj, "никој", "nobody", "ninguém"]
  - [ne-sedi, "не седи", "doesn't sit", "não fica sentado"]
  - [zad-mene, "зад мене", "behind me", "atrás de mim"]
  - [cekor, "чекор", "step", "passo"]
  - [se-izmoriv, "се изморив", "I got tired", "cansei"]
  - [do-zori, "до зори", "until dawn", "até o amanhecer", {rare: true}]
dialogue:
  - [marko, "Ајде, стани! Фати ме за рака!", "Come on, get up! Take my hand!", "Vamos, levanta! Pega na minha mão!"]
  - [protagonist, "Не знам да играм оро!", "I don't know how to dance the oro!", "Não sei dançar o oro!"]
  - [marko, "Тука никој не седи кога свири оро.", "Here nobody sits when the oro plays.", "Aqui ninguém fica sentado quando toca o oro."]
  - [protagonist, "Добро... оди полека.", "All right... go slowly.", "Tá bom... vai devagar."]
  - [marko, "Следи ме. Чекор десно, чекор лево.", "Follow me. Step right, step left.", "Me segue. Passo para a direita, passo para a esquerda."]
  - [protagonist, "Гледај ги — играат и пеат истовремено!", "Look at them — they dance and sing at the same time!", "Olha eles — dançam e cantam ao mesmo tempo!"]
  - [marko, "Играјќи и пеејќи — така се слави.", "Dancing and singing — that's how you celebrate.", "Dançando e cantando — é assim que se comemora."]
  - [protagonist, "Се изморив! Колку трае свадбата?", "I'm tired! How long does the wedding go on?", "Cansei! Quanto tempo dura o casamento?"]
  - [marko, "До зори!", "Until dawn!", "Até o amanhecer!"]
teach:
  - ask: ["Marko pulls you up: take my hand! How?", "O Marko te puxa: pega na minha mão! Como?", "Фати ме за рака!", fati-me]
  - ask: ["Say: nobody sits when the oro plays.", "Diga: ninguém fica sentado quando toca o oro.", "Никој не седи кога свири оро.", nikoj, ne-sedi]
  - ask: ["Say: step right, step left.", "Diga: passo para a direita, passo para a esquerda.", "Чекор десно, чекор лево.", cekor, desno, levo]
  - note: ["The -јќи form says 'while doing': играјќи (dancing), пеејќи (singing). Like Portuguese -ndo, but mostly in writing and set phrases.", "A forma em -јќи diz 'fazendo': играјќи (dançando), пеејќи (cantando). Como o gerúndio, mas mais na escrita e em frases feitas."]
  - ask: ["Say: dancing and singing.", "Diga: dançando e cantando.", "Играјќи и пеејќи.", igrajkji, peejkji]
  - ask: ["Marko: come on, get up! How?", "O Marko: vamos, levanta! Como?", "Ајде, стани!", ajde, stani]
  - ask: ["Say: behind me.", "Diga: atrás de mim.", "Зад мене.", zad-mene]
  - ask: ["Say: I'm tired!", "Diga: cansei!", "Се изморив!", se-izmoriv]
  - ask: ["Marko: until dawn!", "O Marko: até o amanhecer!", "До зори!", do-zori]
  - note: ["At weddings the oro line winds round the hall again and again; grandparents and children dance too. Taking the hand at the end of the line is always welcome.", "Nos casamentos a fila do oro dá voltas e voltas no salão; avós e crianças dançam junto. Pegar a mão no fim da fila é sempre bem-vindo."]
