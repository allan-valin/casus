id: A2-22
protagonist: m
title: ["Dates", "Datas"]
situation: ["Marko is filling in the office birthday calendar.", "O Marko está preenchendo o calendário de aniversários do escritório."]
learn: [a2-ordinals]
culture: —
items:
  - [rodenden, "роденден", "birthday", "aniversário"]
  - [koga-ti-e, "Кога ти е…?", "When is your…? (informal)", "Quando é o seu…?"]
  - [prvi, "први", "first", "primeiro"]
  - [vtori, "втори", "second", "segundo"]
  - [treti, "трети", "third", "terceiro"]
  - [petnaesetti, "петнаесетти", "fifteenth", "quinze (dia quinze)", {rare: true}]
  - [mart, "март", "March", "março"]
  - [maj, "мај", "May", "maio"]
  - [veke-pominal, "веќе помина", "has already passed", "já passou"]
  - [ke-slavime, "ќе славиме", "we'll celebrate", "a gente vai comemorar"]
  - [zaedno-dvajca, "двајцата", "both of us", "nós dois"]
dialogue:
  - [marko, "Кога ти е роденден?", "When is your birthday?", "Quando é o seu aniversário?"]
  - [protagonist, "На петнаесетти март.", "On the fifteenth of March.", "Dia quinze de março."]
  - [marko, "Петнаесетти март... веќе помина!", "The fifteenth of March... it's already passed!", "Quinze de março... já passou!"]
  - [protagonist, "Да, беше пред два месеци. А твој?", "Yes, it was two months ago. And yours?", "É, foi há dois meses. E o seu?"]
  - [marko, "Мојот е на први мај.", "Mine is on the first of May.", "O meu é dia primeiro de maio."]
  - [protagonist, "Први мај, празник! Сите се одмораат.", "The first of May, a holiday! Everyone has the day off.", "Primeiro de maio, feriado! Todo mundo de folga."]
  - [marko, "Да, мојот роденден е секогаш слободен ден.", "Yes, my birthday is always a day off.", "É, meu aniversário é sempre folga."]
  - [protagonist, "Тогаш ќе славиме двајцата — следната година, на мојот, ти ќе работиш!", "Then we'll celebrate both — next year, on mine, you'll be working!", "Então vamos comemorar os dois — ano que vem, no meu, você vai trabalhar!"]
teach:
  - ask: ["Ask Marko when his birthday is.", "Pergunte ao Marko quando é o aniversário dele.", "Кога ти е роденден?", koga-ti-e, rodenden]
  - note: ["Dates use ordinal numbers: први (first), втори (second), трети (third), and from five on add -ти: петти, десетти, петнаесетти.", "Datas usam números ordinais: први (primeiro), втори (segundo), трети (terceiro), e a partir do cinco acrescenta-se -ти: петти, десетти, петнаесетти."]
  - pt_only: "Diferente do português, que só diz 'primeiro' no dia 1: aqui todos os dias são ordinais — 'o décimo quinto de março'."
  - ask: ["Say: on the fifteenth of March.", "Diga: dia quinze de março.", "На петнаесетти март.", petnaesetti, mart]
  - ask: ["Say: it has already passed.", "Diga: já passou.", "Веќе помина.", veke-pominal]
  - ask: ["Say: mine is on the first of May.", "Diga: o meu é dia primeiro de maio.", "Мојот е на први мај.", prvi, maj]
  - ask: ["Say: the second of May.", "Diga: dois de maio.", "Втори мај.", vtori, maj]
  - ask: ["Say: the third of March.", "Diga: três de março.", "Трети март.", treti, mart]
  - ask: ["Say: we'll celebrate.", "Diga: a gente vai comemorar.", "Ќе славиме.", ke-slavime]
  - ask: ["Say: both of us.", "Diga: nós dois.", "Двајцата.", zaedno-dvajca]
  - ask: ["Ask Ana when her birthday is — informally.", "Pergunte à Ana quando é o aniversário dela — informal.", "Кога ти е роденден?", koga-ti-e]
