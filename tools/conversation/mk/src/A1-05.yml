id: A1-05
protagonist: f
title: [New letters, Letras novas]
situation: ["In the street every sign is a puzzle. Dragan, at his shop door, reads them with you.", "Na rua, cada placa é um enigma. O Dragan, na porta da loja, lê com você."]
learn: [a1-alphabet]
culture: "Cyrillic, and Latin letters beside it; how it came to be"
items:
  - [sto-pisuva, "Што пишува?", "What does it say?", "O que está escrito?"]
  - [pisuva, "пишува", "it says (written)", "está escrito"]
  - [zatvoreno, "затворено", "closed", "fechado"]
  - [otvoreno, "отворено", "open", "aberto"]
  - [apteka, "аптека", "pharmacy", "farmácia", {rare: true}]
  - [ruski, "руски", "Russian", "russo"]
  - [makedonski, "македонски", "Macedonian", "macedônio"]
  - [kirilica, "кирилица", "Cyrillic", "cirílico", {rare: true}]
  - [citam, "читам", "I read", "eu leio"]
  - [bavno, "бавно", "slowly", "devagar"]
  - [nema-problem, "Нема проблем", "No problem", "Sem problema"]
  - [poleka, "полека", "slowly, take it easy", "com calma, devagar"]
  - [vlez, "влез", "entrance", "entrada", {rare: true}]
  - [izlez, "излез", "exit", "saída", {rare: true}]
dialogue:
  - [protagonist, "Извинете, што пишува тука?", "Excuse me, what does it say here?", "Com licença, o que está escrito aqui?"]
  - [dragan, "Пишува „затворено“.", "It says 'closed'.", "Está escrito 'fechado'."]
  - [protagonist, "А таму?", "And there?", "E ali?"]
  - [dragan, "Таму пишува „аптека“.", "There it says 'pharmacy'.", "Ali está escrito 'farmácia'."]
  - [protagonist, "Ова е руски?", "Is this Russian?", "Isto é russo?"]
  - [dragan, "Не, ова е македонски! Кирилица.", "No, this is Macedonian! Cyrillic.", "Não, isto é macedônio! Cirílico."]
  - [protagonist, "Читам многу бавно.", "I read very slowly.", "Eu leio muito devagar."]
  - [dragan, "Нема проблем. Полека.", "No problem. Take it easy.", "Sem problema. Com calma."]
  - [protagonist, "А влез и излез?", "And entrance and exit?", "E entrada e saída?"]
  - [dragan, "Влезот е тука, излезот е таму.", "The entrance is here, the exit is there.", "A entrada é aqui, a saída é ali."]
teach:
  - note: ["Macedonian is written in Cyrillic — but you will also see Latin letters: Albanian, an official language too, uses them, shops write in English, and people often type Macedonian in Latin letters on their phones.", "O macedônio se escreve em cirílico — mas você também vai ver letras latinas: o albanês, também língua oficial, usa o alfabeto latino, as lojas escrevem em inglês, e muita gente digita macedônio com letras latinas no celular."]
  - ask: ["Ask Dragan what it says here.", "Pergunte ao Dragan o que está escrito aqui.", "Што пишува тука?", sto-pisuva, tuka]
  - line: [dragan, zatvoreno]
  - ask: ["The door says 'closed'. Say it.", "A porta diz 'fechado'. Diga.", "Затворено.", zatvoreno]
  - ask: ["Another door: open.", "Outra porta: aberto.", "Отворено.", otvoreno]
  - ask: ["Say: there it says 'pharmacy'.", "Diga: ali está escrito 'farmácia'.", "Таму пишува „аптека“.", tamu, pisuva, apteka]
  - note: ["Many visitors think it is Russian. It is not: Macedonian is its own language, close to Bulgarian. The alphabet was fixed in 1945, when North Macedonia was a republic of Yugoslavia; the country became independent in 1991.", "Muitos visitantes acham que é russo. Não é: o macedônio é uma língua própria, parecida com o búlgaro. O alfabeto foi fixado em 1945, quando a Macedônia do Norte era uma república da Iugoslávia; o país ficou independente em 1991."]
  - ask: ["Ask: is this Russian?", "Pergunte: isto é russo?", "Ова е руски?", ruski]
  - ask: ["Answer for Dragan: no, this is Macedonian.", "Responda pelo Dragan: não, isto é macedônio.", "Не, ова е македонски.", makedonski]
  - build: [kirilica, ["-лица", "кирилица"]]
  - ask: ["Say: Cyrillic.", "Diga: cirílico.", "Кирилица.", kirilica]
  - note: ["Its name has a history too: Greece objected to 'Macedonia' for decades, and in 2018–19 the Prespa Agreement made it 'North Macedonia'. Bulgaria still argues about the language's history — a reason EU talks have been slow.", "O nome também tem história: a Grécia contestou 'Macedônia' por décadas, e em 2018–19 o Acordo de Prespa fez dele 'Macedônia do Norte'. A Bulgária ainda discute a história da língua — um motivo de as negociações com a UE andarem devagar."]
  - ask: ["Say: I read very slowly.", "Diga: eu leio muito devagar.", "Читам многу бавно.", citam, bavno]
  - ask: ["He reassures you. How?", "Ele tranquiliza você. Como?", "Нема проблем. Полека.", nema-problem, poleka]
  - ask: ["Read the sign: entrance.", "Leia a placa: entrada.", "Влез.", vlez]
  - ask: ["And the other one: exit.", "E a outra: saída.", "Излез.", izlez]
  - ask: ["A friend reads too fast. Tell him: slowly, no problem.", "Um amigo lê rápido demais. Diga: devagar, sem problema.", "Полека, нема проблем.", poleka, nema-problem]
