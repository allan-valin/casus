id: C2-09
protagonist: f
title: ["Polite orders", "Ordens educadas"]
situation: ["You run your own team now. Asking, not ordering — in Macedonian.", "Agora você comanda sua própria equipe. Pedir, não mandar — em macedônio."]
learn: [c2-aspect-politeness]
culture: —
items:
  - [povelete-sednete, "повелете, седнете", "please, take a seat", "por favor, sente-se"]
  - [dojdete-za-moment, "дојдете за момент", "come for a moment", "venha um momento"]
  - [ke-mozes-li, "Ќе можеш ли…?", "Would you be able to…?", "Você conseguiria…?"]
  - [ako-ne-ti-e-tesko, "ако не ти е тешко", "if it's no trouble", "se não for incômodo"]
  - [bi-bilo-dobro, "би било добро", "it would be good", "seria bom"]
  - [pogledni-go, "погледни го", "have a look at it", "dá uma olhada"]
  - [ne-gledaj-go-cel-den, "не гледај го цел ден", "don't keep looking at it all day", "não fica olhando o dia todo"]
  - [blagodaram-odnapred, "благодарам однапред", "thanks in advance", "obrigada desde já"]
  - [nemoj, "немој", "don't (softer)", "não (mais suave)"]
  - [nemoj-da-se-sekiras, "немој да се секираш", "don't worry", "não se preocupa"]
dialogue:
  - [protagonist, "Дарко, дојди за момент, те молам.", "Darko, come here a moment, please.", "Darko, vem aqui um momento, por favor."]
  - [darko, "Повели?", "Yes?", "Pois não?"]
  - [protagonist, "Ќе можеш ли да го погледнеш кодот на Ана, ако не ти е тешко?", "Would you be able to look at Ana's code, if it's no trouble?", "Você conseguiria dar uma olhada no código da Ana, se não for incômodo?"]
  - [darko, "Секако. До кога?", "Of course. By when?", "Claro. Até quando?"]
  - [protagonist, "Би било добро до петок. Погледни го еднаш — немој да го гледаш цел ден.", "By Friday would be good. Look at it once — don't sit on it all day.", "Até sexta seria bom. Dá uma olhada — não fica olhando o dia todo."]
  - [darko, "Разбрано, шефице.", "Understood, boss.", "Entendido, chefe."]
  - [protagonist, "Немој „шефице“! Благодарам однапред.", "Don't call me 'boss'! Thanks in advance.", "Nada de 'chefe'! Obrigada desde já."]
  - [ana, "А ако не стигнам?", "And if I don't make it?", "E se eu não der conta?"]
  - [protagonist, "Немој да се секираш. Ќе најдеме решение.", "Don't worry. We'll find a solution.", "Não se preocupa. A gente encontra uma solução."]
teach:
  - ask: ["Say: come for a moment, please. (formal)", "Diga: venha um momento, por favor.", "Дојдете за момент, ве молам.", dojdete-za-moment]
  - ask: ["Ask: would you be able to look at it?", "Pergunte: você conseguiria dar uma olhada?", "Ќе можеш ли да го погледнеш?", ke-mozes-li]
  - ask: ["Add: if it's no trouble.", "Acrescente: se não for incômodo.", "Ако не ти е тешко.", ako-ne-ti-e-tesko]
  - ask: ["Say: by Friday would be good.", "Diga: até sexta seria bom.", "Би било добро до петок.", bi-bilo-dobro]
  - note: ["A request for one action uses the completed verb: погледни го (have a look). A negative uses the ongoing one: немој да го гледаш цел ден (don't keep looking). 'Немој' is the soft 'don't'.", "Pedido de uma ação usa o verbo completo: погледни го (dá uma olhada). O negativo usa o verbo em andamento: немој да го гледаш цел ден (não fica olhando). 'Немој' é o 'não' suave."]
  - ask: ["Say: have a look at it once.", "Diga: dá uma olhada.", "Погледни го еднаш.", pogledni-go]
  - ask: ["Say: don't keep looking at it all day.", "Diga: não fica olhando o dia todo.", "Немој да го гледаш цел ден.", ne-gledaj-go-cel-den, nemoj]
  - ask: ["Say: thanks in advance.", "Diga: obrigada desde já.", "Благодарам однапред.", blagodaram-odnapred]
  - ask: ["Say: don't worry.", "Diga: não se preocupa.", "Немој да се секираш.", nemoj-da-se-sekiras]
  - ask: ["Say to a visitor: please, take a seat.", "Diga a uma visita: por favor, sente-se.", "Повелете, седнете.", povelete-sednete]
