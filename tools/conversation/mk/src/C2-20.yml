id: C2-20
protagonist: m
title: ["The house by the lake", "A casa na praia"]
situation: ["Three families rent a summer house at Ohrid together. Who pays what?", "Três famílias alugam juntas uma casa de verão em Ohrid. Quem paga o quê?"]
learn: [c2-set-phrases]
culture: —
items:
  - [vikendica, "викендица", "holiday cottage", "casa de veraneio", {rare: true}]
  - [podelba-na-trosocite, "поделба на трошоците", "splitting the costs", "divisão das despesas"]
  - [na-tri-dela, "на три дела", "into three parts", "em três partes"]
  - [po-glava, "по глава", "per head", "por pessoa"]
  - [kasata, "касата", "the kitty, the common fund", "a caixinha", {rare: true}]
  - [sekoj-dava-po, "секој дава по", "everyone gives (each)", "cada um dá"]
  - [smetkite-cisti, "чисти сметки, долга љубов", "clear accounts, long friendship", "amigos, amigos, negócios à parte"]
  - [deca-ne-se-brojat, "децата не се бројат", "children don't count", "criança não conta"]
  - [pravedno, "праведно", "fair(ly)", "justo"]
  - [se-soglasivme, "се согласивме", "we agreed", "concordamos"]
dialogue:
  - [goran, "Викендицата чини илјада евра за една недела.", "The cottage costs a thousand euros for a week.", "A casa custa mil euros por uma semana."]
  - [marko, "Поделба на три дела, по семејство?", "Split into three parts, per family?", "Divide em três, por família?"]
  - [protagonist, "Или по глава? Ние сме четворица, Горан е сам.", "Or per head? We're four, Goran is alone.", "Ou por pessoa? A gente é em quatro, o Goran está sozinho."]
  - [goran, "Децата не се бројат!", "Children don't count!", "Criança não conta!"]
  - [marko, "За храната — каса. Секој дава по сто евра.", "For food — a kitty. Everyone gives a hundred euros.", "Para a comida — uma caixinha. Cada um dá cem euros."]
  - [protagonist, "Праведно. Чисти сметки, долга љубов.", "Fair. Clear accounts, long friendship.", "Justo. Amigos, amigos, negócios à parte."]
  - [goran, "Се согласивме! А ракијата?", "Agreed! And the rakija?", "Combinado! E a rakija?"]
  - [marko, "Ракијата е од дедо — бесплатна!", "The rakija's from grandpa — free!", "A rakija é do vô — de graça!"]
teach:
  - ask: ["Say: the cottage costs a thousand euros.", "Diga: a casa custa mil euros.", "Викендицата чини илјада евра.", vikendica]
  - ask: ["Say: splitting the costs.", "Diga: divisão das despesas.", "Поделба на трошоците.", podelba-na-trosocite]
  - ask: ["Say: into three parts.", "Diga: em três partes.", "На три дела.", na-tri-dela]
  - ask: ["Say: or per head?", "Diga: ou por pessoa?", "Или по глава?", po-glava]
  - ask: ["Goran: children don't count!", "O Goran: criança não conta!", "Децата не се бројат!", deca-ne-se-brojat]
  - ask: ["Say: a kitty for food.", "Diga: uma caixinha para a comida.", "Каса за храната.", kasata]
  - ask: ["Say: everyone gives a hundred euros.", "Diga: cada um dá cem euros.", "Секој дава по сто евра.", sekoj-dava-po]
  - ask: ["Say: fair.", "Diga: justo.", "Праведно.", pravedno]
  - ask: ["Say: clear accounts, long friendship.", "Diga: amigos, amigos, negócios à parte.", "Чисти сметки, долга љубов.", smetkite-cisti]
  - ask: ["Say: we agreed!", "Diga: combinado!", "Се согласивме!", se-soglasivme]
  - note: ["'Чисти сметки, долга љубов' — clear accounts, long love — is the saying for splitting money between friends. 'По' with a number means 'each': секој дава по сто.", "'Чисти сметки, долга љубов' — contas claras, amor longo — é o ditado para dividir dinheiro entre amigos. 'По' com número quer dizer 'cada': секој дава по сто."]
