id: A2-02
protagonist: m
title: [The residence permit, A autorização de residência]
situation: ["At the Ministry of the Interior (МВР), for your residence permit. One paper is missing.", "No Ministério do Interior (МВР), para a autorização de residência. Falta um papel."]
learn: [a2-future]
culture: Papers, copies, and 'knowing someone'
items:
  - [dojdov, "дојдов", "I came", "eu vim"]
  - [dozvola, "дозвола за престој", "residence permit", "autorização de residência", {rare: true}]
  - [pasos, "пасош", "passport", "passaporte"]
  - [slika, "слика", "photo / picture", "foto / quadro"]
  - [eve, "еве", "here is / here are", "aqui está / eis"]
  - [nedostasuva, "недостасува", "is missing", "está faltando", {rare: true}]
  - [dokument, "документ", "document", "documento"]
  - [dogovorot, "договорот за работа", "the work contract", "o contrato de trabalho", {rare: true}]
  - [ke-dojdam, "ќе дојдам", "I'll come", "eu venho / virei"]
  - [ne-rabotime, "не работиме", "we're closed (we don't work)", "não abrimos (não trabalhamos)"]
  - [vo-kolku-casot, "Во колку часот?", "At what time?", "A que horas?"]
  - [osum, "осум", "eight", "oito"]
  - [kopija, "копија", "copy", "cópia", {rare: true}]
dialogue:
  - [protagonist, "Добар ден. Дојдов за дозвола за престој.", "Good morning. I've come for a residence permit.", "Bom dia. Vim pela autorização de residência."]
  - [sluzbenicka, "Пасош, ве молам. Имате ли слика?", "Passport, please. Do you have a photo?", "Passaporte, por favor. O senhor tem foto?"]
  - [protagonist, "Да, еве ги.", "Yes, here they are.", "Sim, aqui estão."]
  - [sluzbenicka, "Недостасува еден документ — договорот за работа.", "One document is missing — the work contract.", "Falta um documento — o contrato de trabalho."]
  - [protagonist, "Договорот е дома. Утре ќе дојдам.", "The contract is at home. I'll come tomorrow.", "O contrato está em casa. Venho amanhã."]
  - [sluzbenicka, "Утре не работиме. Во понеделник.", "We're closed tomorrow. On Monday.", "Amanhã não abrimos. Na segunda."]
  - [protagonist, "Добро, ќе дојдам во понеделник. Во колку часот?", "All right, I'll come on Monday. At what time?", "Está bem, venho na segunda. A que horas?"]
  - [sluzbenicka, "Од осум. И донесете копија.", "From eight. And bring a copy.", "A partir das oito. E traga uma cópia."]
teach:
  - note: ["The future is easy: 'ќе' before the present. дојдам → ќе дојдам (I'll come), работам → ќе работам.", "O futuro é fácil: 'ќе' antes do presente. дојдам → ќе дојдам (virei), работам → ќе работам (vou trabalhar)."]
  - ask: ["Say why you came: for a residence permit.", "Diga por que veio: pela autorização de residência.", "Дојдов за дозвола за престој.", dojdov, dozvola]
  - ask: ["She asks for your passport. How?", "Ela pede o passaporte. Como?", "Пасош, ве молам.", pasos, ve-molam]
  - ask: ["Ask: do you have a photo? (as she did)", "Pergunte: tem foto? (como ela)", "Имате ли слика?", imate-li, slika]
  - ask: ["Hand them over: here they are.", "Entregue: aqui estão.", "Еве ги.", eve]
  - ask: ["She says a document is missing. How?", "Ela diz que falta um documento. Como?", "Недостасува еден документ.", nedostasuva, dokument]
  - ask: ["Say: the work contract is at home.", "Diga: o contrato de trabalho está em casa.", "Договорот за работа е дома.", dogovorot, doma]
  - ask: ["Say: I'll come tomorrow.", "Diga: venho amanhã.", "Утре ќе дојдам.", utre, ke-dojdam]
  - ask: ["She says they're closed tomorrow.", "Ela diz que amanhã não abrem.", "Утре не работиме.", ne-rabotime]
  - ask: ["Ask: at what time?", "Pergunte: a que horas?", "Во колку часот?", vo-kolku-casot]
  - ask: ["Say for her: from eight.", "Diga por ela: a partir das oito.", "Од осум.", od, osum]
  - ask: ["Say: I'll bring a copy. (just: a copy)", "Diga: uma cópia.", "Копија.", kopija]
  - note: ["Offices want originals and copies of everything — bring both. You will hear that things go faster 'if you know someone' (врски, connections). Don't try it; bring a Macedonian colleague to translate instead.", "As repartições querem original e cópia de tudo — leve os dois. Você vai ouvir que as coisas andam mais rápido 'se você conhece alguém' (врски, conhecidos). Não tente; leve um colega macedônio para traduzir."]
  - pt_only: "Para quem conhece o cartório brasileiro, nada de novo: fila, carimbo e 'falta um papel'."
