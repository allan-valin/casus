id: C2-28
protagonist: m
title: ["Stay or go", "Ficar ou ir"]
situation: ["A job offer in São Paulo, near your parents. Sara and you weigh it at the kitchen table.", "Uma proposta de emprego em São Paulo, perto dos seus pais. Você e a Sara pesam tudo na mesa da cozinha."]
learn: [c2-admirative]
culture: —
items:
  - [odluka, "одлука", "decision", "decisão"]
  - [prednosti, "предности", "advantages", "vantagens"]
  - [nedostatoci, "недостатоци", "disadvantages", "desvantagens"]
  - [od-edna-strana-pobliska, "поблиску до моите", "closer to my family", "mais perto dos meus"]
  - [tuka-ni-e-zivotot, "тука ни е животот", "our life is here", "nossa vida é aqui"]
  - [decata-ke-izgubat, "децата ќе ги изгубат", "the children would lose them", "as crianças perderiam"]
  - [sme-se-vkorenile, "сме се вкорениле", "we've put down roots, it turns out", "a gente criou raízes, pelo jeito", {rare: true}]
  - [ne-mora-sega, "не мора сега", "not necessarily now", "não precisa ser agora"]
  - [mozebi-podocna, "можеби подоцна", "maybe later", "talvez mais tarde"]
  - [ostanuvame, "остануваме", "we're staying", "a gente fica"]
dialogue:
  - [sara, "Ајде: предности и недостатоци.", "Come on: advantages and disadvantages.", "Vamos lá: vantagens e desvantagens."]
  - [protagonist, "Предност: поблиску до моите. Мајка ми старее.", "Advantage: closer to my family. My mother is getting older.", "Vantagem: mais perto dos meus. Minha mãe está envelhecendo."]
  - [sara, "Недостаток: тука ни е животот. Децата ќе ги изгубат баба и дедо.", "Disadvantage: our life is here. The children would lose grandma and grandpa.", "Desvantagem: nossa vida é aqui. As crianças perderiam o vô e a vó."]
  - [protagonist, "И кошарката, и кафаната, и Вера...", "And basketball, and the кафана, and Vera...", "E o basquete, e a кафана, e a Vera..."]
  - [sara, "Ние сме се вкорениле тука!", "We've put down roots here, it turns out!", "A gente criou raízes aqui, pelo jeito!"]
  - [protagonist, "Изгледа дека одлуката е веќе донесена.", "It looks like the decision is already made.", "Parece que a decisão já está tomada."]
  - [sara, "Бразил не мора сега. Можеби подоцна, за подолго лето.", "Brazil doesn't have to be now. Maybe later, for a longer summer.", "O Brasil não precisa ser agora. Talvez mais tarde, para um verão mais longo."]
  - [protagonist, "Остануваме. Секое лето — Бразил.", "We're staying. Every summer — Brazil.", "A gente fica. Todo verão — Brasil."]
teach:
  - ask: ["Say: advantages and disadvantages.", "Diga: vantagens e desvantagens.", "Предности и недостатоци.", prednosti, nedostatoci]
  - ask: ["Say: closer to my family.", "Diga: mais perto dos meus.", "Поблиску до моите.", od-edna-strana-pobliska]
  - ask: ["Sara: our life is here.", "A Sara: nossa vida é aqui.", "Тука ни е животот.", tuka-ni-e-zivotot]
  - ask: ["Say: the children would lose them.", "Diga: as crianças perderiam.", "Децата ќе ги изгубат.", decata-ke-izgubat]
  - ask: ["Sara, surprised at herself: we've put down roots!", "A Sara, surpresa: a gente criou raízes!", "Ние сме се вкорениле!", sme-se-vkorenile]
  - ask: ["Say: the decision is already made.", "Diga: a decisão já está tomada.", "Одлуката е веќе донесена.", odluka]
  - ask: ["Say: not necessarily now.", "Diga: não precisa ser agora.", "Не мора сега.", ne-mora-sega]
  - ask: ["Say: maybe later.", "Diga: talvez mais tarde.", "Можеби подоцна.", mozebi-podocna]
  - ask: ["Say: we're staying.", "Diga: a gente fica.", "Остануваме.", ostanuvame]
  - note: ["The admirative 'сме се вкорениле' — we've put down roots, I just realised — says what the list of pros and cons already showed.", "O admirativo 'сме се вкорениле' — criamos raízes, acabei de perceber — diz o que a lista de prós e contras já mostrava."]
