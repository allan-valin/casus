id: A2-26
protagonist: m
title: ["A date", "Um encontro"]
situation: ["Elena, from the gym. You finally ask her out.", "A Elena, da academia. Você finalmente chama ela para sair."]
learn: [a2-doubling]
culture: Who asks, who pays
items:
  - [izleguvame, "Излегуваме ли…?", "Shall we go out…?", "Vamos sair…?"]
  - [vecera, "вечера", "dinner", "jantar"]
  - [po-tebe, "ќе дојдам по тебе", "I'll come and get you", "passo para te buscar"]
  - [mi-se-dopagjas, "Ми се допаѓаш", "I like you", "Gosto de você"]
  - [i-ti-mene, "И ти мене", "I like you too (and you me)", "Eu também (de você)"]
  - [da-delime, "Ајде да делиме", "Let's split it", "Vamos dividir"]
  - [te-pokaniv, "те поканив", "I invited you", "eu te convidei"]
  - [plakjam, "плаќам", "I pay", "eu pago"]
  - [tebe, "тебе", "you (stressed)", "você / a ti"]
  - [sledniot-pat-jas, "Следниот пат јас", "Next time it's me", "Da próxima vez sou eu"]
dialogue:
  - [protagonist, "Елена, излегуваме ли во петок?", "Elena, shall we go out on Friday?", "Elena, vamos sair na sexta?"]
  - [elena, "Може. Каде?", "Sure. Where?", "Pode ser. Onde?"]
  - [protagonist, "На вечера, во Дебар Маало. Ќе дојдам по тебе во осум.", "To dinner, in Debar Maalo. I'll come and get you at eight.", "Para jantar, no Debar Maalo. Passo para te buscar às oito."]
  - [elena, "Супер.", "Great.", "Ótimo."]
  - [protagonist, "Ми се допаѓаш, Елена.", "I like you, Elena.", "Gosto de você, Elena."]
  - [elena, "И ти мене.", "I like you too.", "Eu também gosto de você."]
  - [elena, "Ајде да делиме сметката.", "Let's split the bill.", "Vamos dividir a conta."]
  - [protagonist, "Не, тебе те поканив, јас плаќам.", "No, I invited you, I'm paying.", "Não, eu te convidei, eu pago."]
  - [elena, "Добро. Следниот пат јас.", "All right. Next time it's me.", "Tá bom. Da próxima vez sou eu."]
teach:
  - ask: ["Ask Elena if you'll go out on Friday.", "Pergunte à Elena se vão sair na sexta.", "Излегуваме ли во петок?", izleguvame, petok]
  - ask: ["Say: to dinner.", "Diga: para jantar.", "На вечера.", vecera]
  - ask: ["Say: I'll come and get you at eight.", "Diga: passo para te buscar às oito.", "Ќе дојдам по тебе во осум.", po-tebe, osum]
  - note: ["'Ми се допаѓаш' — I like you, word for word 'you please me'. Her answer, 'И ти мене', is 'and you, me'.", "'Ми се допаѓаш' — gosto de você, palavra por palavra 'você me agrada'. A resposta dela, 'И ти мене', é 'e você a mim'."]
  - ask: ["Tell her you like her.", "Diga que gosta dela.", "Ми се допаѓаш.", mi-se-dopagjas]
  - ask: ["Her answer: I like you too.", "A resposta dela: eu também.", "И ти мене.", i-ti-mene]
  - ask: ["She offers to split. How?", "Ela propõe dividir. Como?", "Ајде да делиме.", da-delime]
  - note: ["Stressed 'you' (тебе) still brings the short one (те): 'тебе те поканив' — it was you I invited. The doubling is required, not optional.", "O 'você' enfático (тебе) ainda leva o curto (те): 'тебе те поканив' — foi você que eu convidei. A duplicação é obrigatória."]
  - ask: ["Say: I invited you, I'm paying.", "Diga: eu te convidei, eu pago.", "Тебе те поканив, јас плаќам.", tebe, te-pokaniv, plakjam]
  - ask: ["She says: next time it's me.", "Ela diz: da próxima vez sou eu.", "Следниот пат јас.", sledniot-pat-jas]
  - note: ["On a first date it's still common for the man to ask and to pay; younger people split more often. Whoever invites usually pays — and the other pays next time.", "No primeiro encontro ainda é comum o homem convidar e pagar; os mais jovens dividem com mais frequência. Quem convida costuma pagar — e o outro paga na próxima."]
