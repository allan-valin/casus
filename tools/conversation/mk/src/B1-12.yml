id: B1-12
protagonist: m
title: ["Statistics in the news", "Estatística nas notícias"]
situation: ["A chart on the office screen: a new survey about young people leaving.", "Um gráfico na tela do escritório: uma pesquisa nova sobre jovens que vão embora."]
learn: [b1-reported-speech]
culture: Emigration in numbers, read carefully
items:
  - [anketa, "анкета", "survey, poll", "pesquisa"]
  - [pokazuva, "покажува", "shows", "mostra"]
  - [mladite, "младите", "young people", "os jovens"]
  - [sakaat-da-zaminat, "сакаат да заминат", "want to leave", "querem ir embora"]
  - [prosek, "просек", "average", "média", {rare: true}]
  - [plata, "плата", "salary", "salário"]
  - [grafikon, "графикон", "chart", "gráfico", {rare: true}]
  - [od-sto-hundred, "од сто", "out of a hundred", "de cada cem"]
  - [ne-znaci, "не значи", "doesn't mean", "não quer dizer"]
  - [kje-zaminat, "ќе заминат", "will leave", "vão embora"]
dialogue:
  - [ana, "Види ја анкетата. Покажува дека половина од младите сакаат да заминат.", "Look at the survey. It shows half of young people want to leave.", "Olha a pesquisa. Mostra que metade dos jovens quer ir embora."]
  - [protagonist, "Половина? Зошто?", "Half? Why?", "Metade? Por quê?"]
  - [ana, "Велат дека платите се мали. Просекот е многу понизок од Германија.", "They say salaries are low. The average is much lower than in Germany.", "Dizem que os salários são baixos. A média é muito menor que na Alemanha."]
  - [protagonist, "А графиконот?", "And the chart?", "E o gráfico?"]
  - [ana, "Од сто млади, педесет сакаат да заминат.", "Out of a hundred young people, fifty want to leave.", "De cada cem jovens, cinquenta querem ir embora."]
  - [protagonist, "Но тоа што сакаат не значи дека ќе заминат.", "But wanting to doesn't mean they will leave.", "Mas querer não quer dizer que vão embora."]
  - [ana, "Точно. А ти дојде тука — обратно од сите!", "Right. And you came here — the opposite of everyone!", "Isso. E você veio para cá — o contrário de todo mundo!"]
  - [protagonist, "Јас сум статистичка грешка.", "I'm a statistical error.", "Eu sou um erro estatístico."]
teach:
  - ask: ["Say: look at the survey.", "Diga: olha a pesquisa.", "Види ја анкетата.", anketa]
  - ask: ["Say: it shows that…", "Diga: mostra que…", "Покажува дека…", pokazuva]
  - ask: ["Say: young people want to leave.", "Diga: os jovens querem ir embora.", "Младите сакаат да заминат.", mladite, sakaat-da-zaminat]
  - ask: ["Say: they say salaries are low.", "Diga: dizem que os salários são baixos.", "Велат дека платите се мали.", velat, plata]
  - ask: ["Say: the average is lower.", "Diga: a média é menor.", "Просекот е понизок.", prosek]
  - ask: ["Ask: and the chart?", "Pergunte: e o gráfico?", "А графиконот?", grafikon]
  - ask: ["Say: out of a hundred, fifty.", "Diga: de cada cem, cinquenta.", "Од сто, педесет.", od-sto-hundred, pedeset]
  - ask: ["Say: wanting doesn't mean they'll leave.", "Diga: querer não quer dizer que vão embora.", "Тоа што сакаат не значи дека ќе заминат.", ne-znaci, kje-zaminat]
  - note: ["A survey tells you what people say, not what they do: 'they want to leave' is not 'they left'. Ask who was asked, how many, and when.", "Pesquisa diz o que as pessoas falam, não o que fazem: 'querem ir embora' não é 'foram embora'. Pergunte quem foi ouvido, quantos, e quando."]
  - note: ["Emigration is real: the 2021 census counted about 1.8 million residents, fewer than in 2002. Exact survey numbers change every year, so read the source, not the headline.", "A emigração é real: o censo de 2021 contou cerca de 1,8 milhão de residentes, menos que em 2002. Os números de pesquisa mudam todo ano, então leia a fonte, não a manchete."]
