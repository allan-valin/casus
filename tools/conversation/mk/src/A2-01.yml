id: A2-01
protagonist: f
title: ["What did you do yesterday?", "O que você fez ontem?"]
situation: ["Monday at the office. Ana asks about your weekend.", "Segunda no escritório. A Ana pergunta do seu fim de semana."]
learn: [a2-sum-past, a2-aorist]
culture: Honeyland, the Macedonian film nominated for two Oscars
items:
  - [sto-praves, "Што правеше…?", "What were you doing…? / What did you do…? (informal)", "O que você fez…?"]
  - [vikendot, "викендот", "the weekend", "o fim de semana"]
  - [otidov, "отидов", "I went", "eu fui"]
  - [bev, "бев", "I was", "eu estava / eu fui"]
  - [vcera, "вчера", "yesterday", "ontem"]
  - [vidov, "видов", "I saw", "eu vi"]
  - [film, "филм", "film", "filme"]
  - [koj, "Кој…?", "Which…? / Who…?", "Qual…? / Quem…?"]
  - [ne-razbrav, "не разбрав", "I didn't understand", "eu não entendi"]
  - [normalno, "Нормално", "Naturally / of course", "Normal / claro"]
  - [i-jas, "и јас", "me too", "eu também"]
dialogue:
  - [ana, "Здраво! Што правеше за викендот?", "Hi! What did you do at the weekend?", "Oi! O que você fez no fim de semana?"]
  - [protagonist, "Во сабота отидов на Водно со Марко.", "On Saturday I went up Vodno with Marko.", "No sábado fui ao Vodno com o Marko."]
  - [ana, "Убаво! А во недела?", "Nice! And on Sunday?", "Que bom! E no domingo?"]
  - [protagonist, "Во недела бев дома. А вчера видов филм.", "On Sunday I was at home. And yesterday I saw a film.", "No domingo fiquei em casa. E ontem vi um filme."]
  - [ana, "Кој филм?", "Which film?", "Que filme?"]
  - [protagonist, "„Медена земја“. Македонски филм.", "'Honeyland'. A Macedonian film.", "'Honeyland'. Um filme macedônio."]
  - [ana, "Го видов и јас! Убав е, нели?", "I saw it too! It's good, isn't it?", "Eu também vi! É lindo, né?"]
  - [protagonist, "Многу! Но не разбрав сѐ.", "Very! But I didn't understand everything.", "Muito! Mas não entendi tudo."]
  - [ana, "Нормално. Таа зборува стар дијалект.", "Naturally. She speaks an old dialect.", "Normal. Ela fala um dialeto antigo."]
teach:
  - note: ["To tell what you did, Macedonian has a past tense for finished actions. For 'I', it ends in -ов, -ав or -ив: отидов (I went), видов (I saw), разбрав (I understood). 'I was' is 'бев'.", "Para contar o que você fez, o macedônio tem um passado para ações terminadas. Com 'eu', termina em -ов, -ав ou -ив: отидов (fui), видов (vi), разбрав (entendi). 'Eu estava' é 'бев'."]
  - ask: ["Ana asks what you did at the weekend. How?", "A Ana pergunta o que você fez no fim de semana. Como?", "Што правеше за викендот?", sto-praves, vikendot]
  - ask: ["Say: on Saturday I went up Vodno.", "Diga: no sábado fui ao Vodno.", "Во сабота отидов на Водно.", sabota, otidov]
  - ask: ["Say: on Sunday I was at home.", "Diga: no domingo fiquei em casa.", "Во недела бев дома.", nedela, bev, doma]
  - ask: ["Say: yesterday I saw a film.", "Diga: ontem vi um filme.", "Вчера видов филм.", vcera, vidov, film]
  - ask: ["Ask: which film?", "Pergunte: que filme?", "Кој филм?", koj, film]
  - ask: ["Ana saw it too. Say: me too.", "A Ana também viu. Diga: eu também.", "И јас.", i-jas]
  - ask: ["Say: but I didn't understand everything.", "Diga: mas não entendi tudo.", "Но не разбрав сѐ.", no-but, ne-razbrav, sve]
  - ask: ["Ana says that's natural. How?", "A Ana diz que é normal. Como?", "Нормално.", normalno]
  - note: ["'Honeyland' (Медена земја, 2019) follows a woman who keeps wild bees in an abandoned village. It was the first film nominated for the Oscars both as a documentary and as an international feature.", "'Honeyland' (Медена земја, 2019) acompanha uma mulher que cria abelhas selvagens numa aldeia abandonada. Foi o primeiro filme indicado ao Oscar ao mesmo tempo como documentário e como filme internacional."]
  - ask: ["Ask Marko what he did yesterday.", "Pergunte ao Marko o que ele fez ontem.", "Што правеше вчера?", sto-praves, vcera]
  - ask: ["Say: yesterday I went to the market.", "Diga: ontem fui à feira.", "Вчера отидов на пазар.", vcera, otidov, pazar]
