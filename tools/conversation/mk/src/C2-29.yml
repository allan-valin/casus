id: C2-29
protagonist: f
title: ["Vera's farewell", "A despedida de Vera"]
situation: ["Vera's last Sunday lunch in the old building. The whole staircase comes.", "O último almoço de domingo da Vera no prédio antigo. A escada inteira vem."]
learn: [c2-set-phrases]
culture: —
items:
  - [zbogum, "збогум", "farewell", "adeus"]
  - [ne-zbogum, "не збогум — довидување", "not farewell — see you again", "não adeus — até logo"]
  - [ke-mi-nedostigas, "ќе ми недостигаш", "I'll miss you", "vou sentir sua falta"]
  - [bese-cest, "беше чест", "it was an honour", "foi uma honra"]
  - [od-prviot-den, "од првиот ден", "from the first day", "desde o primeiro dia"]
  - [me-nauci, "ме научи", "you taught me", "você me ensinou"]
  - [da-si-ziva-i-zdrava, "да си жива и здрава", "stay alive and well", "fica com saúde"]
  - [vrati-se-cesto, "врати се често", "come back often", "volta sempre"]
  - [vratata-e-otvorena, "вратата е отворена", "the door is open", "a porta está aberta"]
  - [poslednoto-kafe, "последното кафе", "the last coffee", "o último café"]
dialogue:
  - [vera, "Ова е последното кафе во овој стан.", "This is the last coffee in this flat.", "Este é o último café neste apartamento."]
  - [protagonist, "Не збогум, Вера — довидување.", "Not farewell, Vera — see you again.", "Não é adeus, Vera — é até logo."]
  - [vera, "Довидување тогаш. Ќе ми недостигаш.", "See you again, then. I'll miss you.", "Até logo, então. Vou sentir sua falta."]
  - [protagonist, "Од првиот ден ме научи сè — Повелете, Пријатно, промаја...", "From the first day you taught me everything — Повелете, Пријатно, the draft...", "Desde o primeiro dia você me ensinou tudo — Повелете, Пријатно, a corrente de ar..."]
  - [vera, "Ти ме научи да пијам кафе без шеќер!", "You taught me to drink coffee without sugar!", "Você me ensinou a tomar café sem açúcar!"]
  - [marko, "Беше чест да бидеме ваши соседи.", "It was an honour to be your neighbours.", "Foi uma honra ser seus vizinhos."]
  - [vera, "Врати се често. Вратата е отворена — кај ќерка ми.", "Come back often. The door is open — at my daughter's.", "Volte sempre. A porta está aberta — na casa da minha filha."]
  - [protagonist, "Да си жива и здрава, Вера.", "Stay alive and well, Vera.", "Fica com saúde, Vera."]
teach:
  - ask: ["Vera: this is the last coffee.", "A Vera: este é o último café.", "Ова е последното кафе.", poslednoto-kafe]
  - ask: ["Say: not farewell — see you again.", "Diga: não é adeus — é até logo.", "Не збогум — довидување.", ne-zbogum, zbogum]
  - ask: ["Say: I'll miss you.", "Diga: vou sentir sua falta.", "Ќе ми недостигаш.", ke-mi-nedostigas]
  - ask: ["Say: from the first day.", "Diga: desde o primeiro dia.", "Од првиот ден.", od-prviot-den]
  - ask: ["Say: you taught me everything.", "Diga: você me ensinou tudo.", "Ме научи сè.", me-nauci]
  - ask: ["Marko: it was an honour.", "O Marko: foi uma honra.", "Беше чест.", bese-cest]
  - ask: ["Vera: come back often.", "A Vera: volte sempre.", "Врати се често.", vrati-se-cesto]
  - ask: ["Vera: the door is open.", "A Vera: a porta está aberta.", "Вратата е отворена.", vratata-e-otvorena]
  - ask: ["Bless her: stay alive and well.", "Abençoe: fica com saúde.", "Да си жива и здрава.", da-si-ziva-i-zdrava]
  - note: ["'Збогум' is a final farewell; 'довидување' — until we see each other — keeps the door open, which is why you correct it. 'Да си жива и здрава' is the warmest goodbye to an older woman.", "'Збогум' é adeus definitivo; 'довидување' — até nos vermos — deixa a porta aberta, por isso você corrige. 'Да си жива и здрава' é a despedida mais calorosa para uma senhora."]
