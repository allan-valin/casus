id: A2-09
protagonist: f
title: [Electricity at home, Eletricidade em casa]
situation: ["The heater, the water heater and the washing machine at once. The lights go out.", "O aquecedor, o boiler e a máquina de lavar ao mesmo tempo. A luz cai."]
learn: [a2-imperative]
culture: —
items:
  - [struja, "струја", "electricity / power", "luz / energia elétrica"]
  - [grealkata, "греалката", "the heater", "o aquecedor", {rare: true}]
  - [zaedno, "заедно", "together", "junto"]
  - [masinata, "машината за перење", "the washing machine", "a máquina de lavar", {rare: true}]
  - [premnogu, "премногу", "too much", "demais"]
  - [osiguruvacot, "осигурувачот", "the fuse", "o disjuntor", {rare: true}]
  - [padna, "падна", "fell, went down", "caiu"]
  - [isklucete, "Исклучете", "Switch off (formal)", "Desligue (formal)"]
  - [kreneete, "кренете", "lift / put up (formal)", "levante (formal)", {rare: true}]
  - [vkluci, "вклучи", "switch on", "ligar"]
  - [ne-vklucuvajte, "не вклучувајте", "don't switch on (formal)", "não ligue", {rare: true}]
  - [odednas, "одеднаш", "all at once", "de uma vez", {rare: true}]
dialogue:
  - [protagonist, "Госпоѓо Стојановска, нема струја во станот!", "Mrs Stojanovska, there's no power in the flat!", "Senhora Stojanovska, acabou a luz no apartamento!"]
  - [vera, "Дали ги вклучивте греалката и бојлерот заедно?", "Did you switch on the heater and the water heater together?", "A senhora ligou o aquecedor e o boiler juntos?"]
  - [protagonist, "Да... и машината за перење.", "Yes... and the washing machine.", "Sim... e a máquina de lavar."]
  - [vera, "Е, тоа е премногу. Осигурувачот падна.", "Well, that's too much. The fuse went.", "Pois é, é demais. O disjuntor caiu."]
  - [protagonist, "Каде е осигурувачот?", "Where's the fuse box?", "Onde fica o disjuntor?"]
  - [vera, "Во ходникот. Исклучете ја машината, па кренете го осигурувачот.", "In the hall. Switch off the machine, then put the fuse back up.", "No corredor. Desligue a máquina, depois levante o disjuntor."]
  - [protagonist, "Сега има струја!", "Now there's power!", "Agora voltou a luz!"]
  - [vera, "Не вклучувајте сѐ одеднаш.", "Don't switch everything on at once.", "Não ligue tudo de uma vez."]
teach:
  - ask: ["Say: there's no power in the flat!", "Diga: acabou a luz no apartamento!", "Нема струја во станот!", nema, struja, stanot]
  - ask: ["Say: the heater and the water heater together.", "Diga: o aquecedor e o boiler juntos.", "Греалката и бојлерот заедно.", grealkata, bojlerot, zaedno]
  - ask: ["And the washing machine.", "E a máquina de lavar.", "И машината за перење.", masinata]
  - ask: ["Say: that's too much.", "Diga: é demais.", "Тоа е премногу.", premnogu]
  - ask: ["Say: the fuse went.", "Diga: o disjuntor caiu.", "Осигурувачот падна.", osiguruvacot, padna]
  - ask: ["Ask where the fuse is.", "Pergunte onde fica o disjuntor.", "Каде е осигурувачот?", kade-e, osiguruvacot]
  - ask: ["She says: switch off the machine.", "Ela diz: desligue a máquina.", "Исклучете ја машината.", isklucete, masinata]
  - ask: ["Then: put the fuse back up.", "Depois: levante o disjuntor.", "Кренете го осигурувачот.", kreneete, osiguruvacot]
  - note: ["Telling someone not to do something uses the 'ongoing' verb: вклучи (switch on, once) but не вклучувај / не вклучувајте (don't be switching on).", "Para dizer 'não faça', usa-se o verbo 'em andamento': вклучи (ligue, uma vez), mas не вклучувај / не вклучувајте (não fique ligando)."]
  - ask: ["Say: switch on the heater. (to Marko, informal)", "Diga: liga o aquecedor. (para o Marko, informal)", "Вклучи ја греалката.", vkluci, grealkata]
  - ask: ["Vera: don't switch everything on at once.", "A Vera: não ligue tudo de uma vez.", "Не вклучувајте сѐ одеднаш.", ne-vklucuvajte, sve, odednas]
  - pt_only: "Em prédio antigo daqui o disjuntor é fraco: aquecedor, boiler e máquina juntos derrubam tudo — o equivalente do chuveiro elétrico no Brasil."
