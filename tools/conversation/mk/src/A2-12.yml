id: A2-12
protagonist: m
title: ["Air and smoke", "Ar e fumaça"]
situation: ["A winter morning at the office. From the window, Vodno has disappeared.", "Uma manhã de inverno no escritório. Da janela, o Vodno sumiu."]
learn: [a2-future-neg]
culture: —
items:
  - [niz, "низ", "through", "através de / pela"]
  - [magla, "магла", "fog", "neblina"]
  - [zagaduvanje, "загадување", "pollution", "poluição", {rare: true}]
  - [sekoja-zima, "секоја зима", "every winter", "todo inverno"]
  - [od-sto, "Од што?", "From what?", "Do quê?"]
  - [drva, "дрва", "firewood", "lenha"]
  - [kolite, "колите", "the cars", "os carros"]
  - [maska, "маска", "mask", "máscara", {rare: true}]
  - [vozduhot, "воздухот", "the air", "o ar"]
  - [los, "лош", "bad (masculine)", "ruim"]
  - [nema-da, "нема да", "won't (future negative)", "não vou / não vai"]
  - [ni-jas, "ни јас", "me neither", "nem eu"]
dialogue:
  - [ana, "Погледни низ прозорецот. Не се гледа Водно.", "Look out of the window. You can't see Vodno.", "Olha pela janela. Não dá para ver o Vodno."]
  - [protagonist, "Магла?", "Fog?", "Neblina?"]
  - [ana, "Не е магла. Тоа е загадување. Секоја зима е така.", "It's not fog. It's pollution. Every winter it's like this.", "Não é neblina. É poluição. Todo inverno é assim."]
  - [protagonist, "Од што?", "From what?", "Do quê?"]
  - [ana, "Од дрвата во печките, од колите, од фабриките.", "From the firewood in the stoves, from the cars, from the factories.", "Da lenha nos fogões, dos carros, das fábricas."]
  - [protagonist, "Треба ли маска?", "Do I need a mask?", "Precisa de máscara?"]
  - [ana, "Кога воздухот е лош, да.", "When the air is bad, yes.", "Quando o ar está ruim, sim."]
  - [protagonist, "Денеска нема да шетам до работа.", "Today I won't walk to work.", "Hoje não vou a pé para o trabalho."]
  - [ana, "Ни јас. Ќе одам со автобус.", "Me neither. I'll take the bus.", "Nem eu. Vou de ônibus."]
teach:
  - ask: ["Say: look out of the window.", "Diga: olha pela janela.", "Погледни низ прозорецот.", pogledni, niz, prozorecot]
  - ask: ["Ask: fog?", "Pergunte: neblina?", "Магла?", magla]
  - ask: ["Say: it's pollution.", "Diga: é poluição.", "Тоа е загадување.", zagaduvanje]
  - ask: ["Say: every winter it's like this.", "Diga: todo inverno é assim.", "Секоја зима е така.", sekoja-zima]
  - ask: ["Ask: from what?", "Pergunte: do quê?", "Од што?", od-sto]
  - ask: ["Say: from firewood and the cars.", "Diga: da lenha e dos carros.", "Од дрвата и од колите.", drva, kolite]
  - note: ["Skopje sits in a valley between mountains. In winter, smoke from wood and coal stoves and from traffic stays trapped, and the city has some of the worst winter air in Europe. Check the air-quality app before going out.", "Skopje fica num vale entre montanhas. No inverno, a fumaça dos fogões a lenha e carvão e do trânsito fica presa, e a cidade tem um dos piores ares de inverno da Europa. Veja o aplicativo de qualidade do ar antes de sair."]
  - ask: ["Ask: do I need a mask?", "Pergunte: precisa de máscara?", "Треба ли маска?", treba, maska]
  - ask: ["Say: the air is bad.", "Diga: o ar está ruim.", "Воздухот е лош.", vozduhot, los]
  - note: ["'Won't' is 'нема да': нема да шетам — I won't walk. Not 'не ќе'.", "'Não vou' no futuro é 'нема да': нема да шетам — não vou caminhar. Não 'не ќе'."]
  - ask: ["Say: today I won't walk to work.", "Diga: hoje não vou a pé para o trabalho.", "Денеска нема да шетам до работа.", nema-da, setam]
  - ask: ["Ana agrees: me neither.", "A Ana concorda: nem eu.", "Ни јас.", ni-jas]
  - pt_only: "Quem vem de São Paulo conhece poluição — mas aqui ela vem com o frio e some no verão."
