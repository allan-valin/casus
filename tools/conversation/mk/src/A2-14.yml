id: A2-14
protagonist: m
title: ["Bigger, better", "Maior, melhor"]
situation: ["Marko wants to know how Skopje compares with São Paulo.", "O Marko quer saber como Skopje se compara com São Paulo."]
learn: [a2-comparison]
culture: —
items:
  - [pogolem, "поголем", "bigger (masculine)", "maior"]
  - [milioni, "милиони", "millions", "milhões"]
  - [lugje, "луѓе", "people", "pessoas"]
  - [ziveat, "живеат", "(they) live", "moram / vivem"]
  - [cela, "цела", "whole, all of (feminine)", "inteira / toda"]
  - [pomirno, "помирно", "calmer, quieter", "mais tranquilo", {rare: true}]
  - [hranata, "храната", "the food", "a comida"]
  - [najdobra, "најдобра", "the best (feminine)", "a melhor"]
  - [na-svetot, "на светот", "in the world", "do mundo"]
  - [podobar, "подобар", "better (masculine)", "melhor"]
  - [ajvar, "ајвар", "ajvar (pepper spread)", "ajvar (pasta de pimentão)", {rare: true}]
dialogue:
  - [marko, "Кој град е поголем, Скопје или Сао Паоло?", "Which city is bigger, Skopje or São Paulo?", "Qual cidade é maior, Skopje ou São Paulo?"]
  - [protagonist, "Сао Паоло, многу поголем. Таму живеат дваесет милиони луѓе.", "São Paulo, much bigger. Twenty million people live there.", "São Paulo, muito maior. Lá moram vinte milhões de pessoas."]
  - [marko, "Дваесет милиони! Цела Македонија има два милиони.", "Twenty million! All of Macedonia has two million.", "Vinte milhões! A Macedônia inteira tem dois milhões."]
  - [protagonist, "Но Скопје е помирно.", "But Skopje is calmer.", "Mas Skopje é mais tranquila."]
  - [marko, "А храната? Која е најдобра?", "And the food? Which is the best?", "E a comida? Qual é a melhor?"]
  - [protagonist, "Бразилската скара е најдобра на светот!", "Brazilian barbecue is the best in the world!", "O churrasco brasileiro é o melhor do mundo!"]
  - [marko, "Не, македонската! А ајварот?", "No, Macedonian! And ajvar?", "Não, o macedônio! E o ajvar?"]
  - [protagonist, "Добро, ајварот е подобар од сè.", "All right, ajvar is better than anything.", "Tá bom, o ajvar é melhor que tudo."]
teach:
  - note: ["Comparative: по- (поголем, bigger). Superlative: нај- (најголем, the biggest). 'Better' and 'best' are regular: подобар, најдобар.", "Comparativo: по- (поголем, maior). Superlativo: нај- (најголем, o maior). 'Melhor' e 'o melhor' são regulares: подобар, најдобар."]
  - ask: ["Ask which city is bigger.", "Pergunte qual cidade é maior.", "Кој град е поголем?", koj, grad, pogolem]
  - ask: ["Say: twenty million people live there.", "Diga: lá moram vinte milhões de pessoas.", "Таму живеат дваесет милиони луѓе.", ziveat, milioni, lugje]
  - ask: ["Say for Marko: all of Macedonia has two million.", "Diga pelo Marko: a Macedônia inteira tem dois milhões.", "Цела Македонија има два милиони.", cela, milioni]
  - ask: ["Say: but Skopje is calmer.", "Diga: mas Skopje é mais tranquila.", "Но Скопје е помирно.", no-but, pomirno]
  - ask: ["Ask which food is the best.", "Pergunte qual comida é a melhor.", "Која храна е најдобра?", hranata, najdobra]
  - ask: ["Say: the best in the world!", "Diga: a melhor do mundo!", "Најдобра на светот!", najdobra, na-svetot]
  - ask: ["Say: ajvar is better than anything.", "Diga: o ajvar é melhor que tudo.", "Ајварот е подобар од сè.", ajvar, podobar, sve]
  - note: ["Ajvar is roasted red pepper spread. In autumn whole families roast peppers in the yards for a winter's worth of jars.", "Ajvar é uma pasta de pimentão vermelho assado. No outono famílias inteiras assam pimentão no quintal para encher potes para o inverno."]
  - pt_only: "O cheiro de pimentão assado em setembro é como o cheiro de churrasco no domingo: está em todo bairro."
