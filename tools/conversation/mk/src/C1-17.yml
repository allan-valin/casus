id: C1-17
protagonist: f
title: ["The debate class", "A aula de debate"]
situation: ["Professor Ilievska: 'Should Skopje ban cars from the centre?' You argue both sides.", "A professora Ilievska: 'Skopje deveria proibir carros no centro?' Você defende os dois lados."]
learn: [c1-formal]
culture: —
items:
  - [od-edna-strana, "од една страна", "on the one hand", "por um lado"]
  - [od-druga-strana, "од друга страна", "on the other hand", "por outro lado"]
  - [smetam-deka, "сметам дека", "I consider that", "considero que"]
  - [sepak-mislam, "сепак", "nevertheless", "no entanto"]
  - [zabrana, "забрана", "ban", "proibição"]
  - [trgovcite, "трговците", "shopkeepers", "os comerciantes"]
  - [ke-izgubat, "ќе изгубат", "will lose", "vão perder"]
  - [kompromis, "компромис", "compromise", "meio-termo / acordo"]
  - [zaklucuvam, "заклучувам", "I conclude", "concluo"]
  - [argumentot-vi, "вашиот аргумент", "your argument", "o seu argumento"]
dialogue:
  - [profesorka, "Темата: забрана за автомобили во центарот. Повелете.", "The topic: banning cars from the centre. Go ahead.", "O tema: proibir carros no centro. Pode começar."]
  - [protagonist, "Од една страна, воздухот би бил почист.", "On the one hand, the air would be cleaner.", "Por um lado, o ar seria mais limpo."]
  - [protagonist, "Од друга страна, трговците сметаат дека ќе изгубат купувачи.", "On the other hand, shopkeepers think they'd lose customers.", "Por outro lado, os comerciantes acham que vão perder clientes."]
  - [profesorka, "А вие што сметате?", "And what do you think?", "E a senhora, o que acha?"]
  - [protagonist, "Сметам дека забраната е добра. Сепак, треба компромис — подобар јавен превоз.", "I consider the ban good. Nevertheless, a compromise is needed — better public transport.", "Considero a proibição boa. No entanto, é preciso um meio-termo — transporte público melhor."]
  - [profesorka, "Вашиот аргумент е јасен. Заклучок?", "Your argument is clear. Conclusion?", "Seu argumento está claro. Conclusão?"]
  - [protagonist, "Заклучувам: прво автобуси, потоа забрана.", "I conclude: first buses, then the ban.", "Concluo: primeiro ônibus, depois proibição."]
  - [profesorka, "Одлично. Тоа е структура на добра дебата.", "Excellent. That is the structure of a good debate.", "Excelente. Essa é a estrutura de um bom debate."]
teach:
  - ask: ["Say: on the one hand, the air would be cleaner.", "Diga: por um lado, o ar seria mais limpo.", "Од една страна, воздухот би бил почист.", od-edna-strana]
  - ask: ["Say: on the other hand, shopkeepers would lose.", "Diga: por outro lado, os comerciantes perderiam.", "Од друга страна, трговците ќе изгубат.", od-druga-strana, trgovcite, ke-izgubat]
  - ask: ["Say: I consider the ban good.", "Diga: considero a proibição boa.", "Сметам дека забраната е добра.", smetam-deka, zabrana]
  - ask: ["Say: nevertheless, a compromise is needed.", "Diga: no entanto, é preciso um meio-termo.", "Сепак, треба компромис.", sepak-mislam, kompromis]
  - ask: ["She says: your argument is clear.", "Ela diz: seu argumento está claro.", "Вашиот аргумент е јасен.", argumentot-vi]
  - ask: ["Say: I conclude: first buses, then the ban.", "Diga: concluo: primeiro ônibus, depois proibição.", "Заклучувам: прво автобуси, потоа забрана.", zaklucuvam]
  - note: ["A formal argument in four steps: од една страна…, од друга страна…, сметам дека…, заклучувам…. 'Сметам' is the formal 'мислам'.", "Um argumento formal em quatro passos: од една страна…, од друга страна…, сметам дека…, заклучувам…. 'Сметам' é o 'мислам' formal."]
