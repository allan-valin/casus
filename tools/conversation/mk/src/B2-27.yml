id: B2-27
protagonist: f
title: ["Media", "Mídia"]
situation: ["Sunday morning, Vera still buys a paper newspaper. She reads you a column.", "Domingo de manhã, a Vera ainda compra jornal de papel. Ela lê uma coluna para você."]
learn: [b2-topic-doubling]
culture: —
items:
  - [vesnik, "весник", "newspaper", "jornal"]
  - [kolumna, "колумна", "column (opinion)", "coluna", {rare: true}]
  - [avtorot, "авторот", "the author", "o autor"]
  - [go-citam, "го читам", "I read it", "eu leio"]
  - [na-internet, "на интернет", "online", "na internet"]
  - [portali, "портали", "news websites", "portais", {rare: true}]
  - [premnogu-reklami, "премногу реклами", "too many ads", "anúncio demais"]
  - [pretplata, "претплата", "subscription", "assinatura", {rare: true}]
  - [ja-sakam-hartijata, "ја сакам хартијата", "I love the paper (itself)", "eu gosto do papel"]
  - [krstozbor, "крстозбор", "crossword", "palavras cruzadas", {rare: true}]
dialogue:
  - [vera, "Весникот го купувам секоја недела. Слушај ја оваа колумна.", "I buy the newspaper every Sunday. Listen to this column.", "O jornal eu compro todo domingo. Escuta esta coluna."]
  - [protagonist, "Кој е авторот?", "Who's the author?", "Quem é o autor?"]
  - [vera, "Еден стар новинар. Него го читам веќе триесет години.", "An old journalist. Him I've been reading for thirty years.", "Um jornalista velho. Ele eu leio há trinta anos."]
  - [protagonist, "Јас вестите ги читам на интернет, на портали.", "I read the news online, on news sites.", "Eu leio as notícias na internet, em portais."]
  - [vera, "Порталите ги мразам — премногу реклами.", "News sites I hate — too many ads.", "Os portais eu detesto — anúncio demais."]
  - [protagonist, "Има и претплата, без реклами.", "There's a subscription too, without ads.", "Também tem assinatura, sem anúncio."]
  - [vera, "Не. Ја сакам хартијата. И крстозборот!", "No. I love the paper. And the crossword!", "Não. Eu gosto do papel. E das palavras cruzadas!"]
  - [protagonist, "Крстозборот ќе го решиме заедно.", "We'll do the crossword together.", "As palavras cruzadas a gente resolve junto."]
teach:
  - ask: ["Say: I buy the newspaper every Sunday.", "Diga: o jornal eu compro todo domingo.", "Весникот го купувам секоја недела.", vesnik]
  - ask: ["Say: listen to this column.", "Diga: escuta esta coluna.", "Слушај ја оваа колумна.", kolumna]
  - ask: ["Ask who the author is.", "Pergunte quem é o autor.", "Кој е авторот?", avtorot]
  - ask: ["Say: him I've been reading for thirty years.", "Diga: ele eu leio há trinta anos.", "Него го читам веќе триесет години.", nego, go-citam]
  - ask: ["Say: I read the news online.", "Diga: eu leio as notícias na internet.", "Вестите ги читам на интернет.", vestite, na-internet]
  - ask: ["Say: news sites — too many ads.", "Diga: portais — anúncio demais.", "Порталите — премногу реклами.", portali, premnogu-reklami]
  - ask: ["Say: there's a subscription.", "Diga: tem assinatura.", "Има претплата.", pretplata]
  - ask: ["Vera: I love the paper.", "A Vera: eu gosto do papel.", "Ја сакам хартијата.", ja-sakam-hartijata]
  - ask: ["Say: we'll do the crossword together.", "Diga: as palavras cruzadas a gente resolve junto.", "Крстозборот ќе го решиме заедно.", krstozbor, zaedno]
  - note: ["Putting the object first, with its pronoun, is how you set a topic: 'Порталите ги мразам' — news sites, I hate them. It sounds natural and a little emphatic.", "Pôr o objeto primeiro, com o pronome, é como se define o assunto: 'Порталите ги мразам' — os portais, eu detesto. Soa natural e um pouco enfático."]
