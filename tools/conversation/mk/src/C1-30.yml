id: C1-30
protagonist: m
title: ["Three years", "Três anos"]
situation: ["Marko's birthday at the old кафана. Everyone from C1 is there — and it all comes back.", "Aniversário do Marko na velha кафана. Todo mundo do C1 está lá — e tudo volta."]
learn: []
culture: —
items:
  - [se-sekavas, "Се сеќаваш ли…?", "Do you remember…? (informal)", "Você lembra…?"]
  - [prviot-den, "првиот ден", "the first day", "o primeiro dia"]
  - [ne-znaese-nisto, "не знаеше ништо", "you didn't know anything", "você não sabia nada"]
  - [sega-zboruvas, "сега зборуваш", "now you speak", "agora você fala"]
  - [kako-domasen, "како домашен", "like a local", "como um daqui"]
  - [vreme-leta, "времето лета", "time flies", "o tempo voa"]
  - [za-uste-mnogu, "за уште многу", "to many more", "a muitos mais"]
  - [blagodaram-za-se, "благодарам за сѐ", "thank you for everything", "obrigado por tudo"]
  - [od-srce, "од срце", "from the heart", "de coração"]
  - [srekjen-rodenden-brate, "Среќен роденден, брате!", "Happy birthday, bro!", "Feliz aniversário, mano!"]
dialogue:
  - [marko, "Се сеќаваш ли на првиот ден? Мојот пес те исплаши.", "Do you remember the first day? My dog scared you.", "Lembra do primeiro dia? Meu cachorro te assustou."]
  - [protagonist, "Бруно! Не знаев ништо — само „Здраво“.", "Bruno! I didn't know anything — only 'Здраво'.", "O Bruno! Eu não sabia nada — só 'Здраво'."]
  - [goran, "А сега зборуваш како домашен.", "And now you speak like a local.", "E agora fala como um daqui."]
  - [vera, "И пиеш кафе како домашен — два часа!", "And you drink coffee like a local — two hours!", "E toma café como um daqui — duas horas!"]
  - [protagonist, "Времето лета. Кум, татко, сопруг...", "Time flies. A кум, a father, a husband...", "O tempo voa. Padrinho, pai, marido..."]
  - [sara, "И на крајот — одличен на испит!", "And finally — top marks in the exam!", "E no fim — nota máxima na prova!"]
  - [protagonist, "Среќен роденден, брате! За уште многу!", "Happy birthday, bro! To many more!", "Feliz aniversário, mano! A muitos mais!"]
  - [marko, "На здравје — погледни ме во очи!", "Cheers — look me in the eyes!", "Saúde — olha nos meus olhos!"]
teach:
  - ask: ["Ask Marko if he remembers the first day.", "Pergunte ao Marko se ele lembra do primeiro dia.", "Се сеќаваш ли на првиот ден?", se-sekavas, prviot-den]
  - ask: ["Say: I didn't know anything.", "Diga: eu não sabia nada.", "Не знаев ништо.", ne-znaese-nisto]
  - ask: ["Goran: now you speak like a local.", "O Goran: agora você fala como um daqui.", "Сега зборуваш како домашен.", sega-zboruvas, kako-domasen]
  - ask: ["Say: time flies.", "Diga: o tempo voa.", "Времето лета.", vreme-leta]
  - ask: ["Toast Marko: happy birthday, bro!", "Brinde ao Marko: feliz aniversário, mano!", "Среќен роденден, брате!", srekjen-rodenden-brate]
  - ask: ["Add: to many more!", "Acrescente: a muitos mais!", "За уште многу!", za-uste-mnogu]
  - ask: ["Thank them all: thank you for everything, from the heart.", "Agradeça a todos: obrigado por tudo, de coração.", "Благодарам за сѐ, од срце.", blagodaram-za-se, od-srce]
  - note: ["End of C1. Some more from the whole level.", "Fim do C1. Mais um pouco de todo o nível."]
  - ask: ["Condolences: my sincere condolences.", "Pêsames: meus sinceros pêsames.", "Искрено сочувство.", iskreno-socuvstvo]
  - ask: ["At the office: you'll have to pay a fine.", "Na repartição: vai ter que pagar multa.", "Има да платите казна.", ima-da-platite]
  - ask: ["In a debate: on the one hand… on the other…", "No debate: por um lado… por outro…", "Од една страна… од друга страна…", od-edna-strana, od-druga-strana]
  - ask: ["Tell Vera: I'm translating it for them.", "Para a Vera: estou traduzindo para eles.", "Им го преведувам.", mu-go-preveduvam]
