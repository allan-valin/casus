id: B1-16
protagonist: m
title: ["Vera says ти", "Vera diz \"ti\""]
situation: ["Two years on the same staircase. Mrs Stojanovska has something to say.", "Dois anos na mesma escada. A senhora Stojanovska tem uma coisa para dizer."]
learn: [b1-relative]
culture: The ти offer from an elder
items:
  - [dve-godini, "две години", "two years", "dois anos"]
  - [brzo, "брзо", "quickly, fast", "rápido"]
  - [covek-sto, "човек што", "a person who", "uma pessoa que"]
  - [ajde-da-si, "Ајде да си зборуваме на ти", "Let's say ти to each other", "Vamos nos tratar por ти", {rare: true}]
  - [cest, "чест", "honour", "honra", {rare: true}]
  - [vikaj-me, "Викај ме", "Call me (informal)", "Me chama de"]
  - [ke-mi-treba-vreme, "ќе ми треба време", "it will take me time", "vou precisar de tempo"]
  - [da-se-naviknam, "да се навикнам", "to get used to it", "me acostumar", {rare: true}]
  - [sakas, "Сакаш…?", "Do you want…? (informal)", "Você quer…?"]
  - [sekogas, "секогаш", "always", "sempre"]
dialogue:
  - [vera, "Слушајте... веќе две години сме соседи.", "Listen... we've been neighbours for two years now.", "Escuta... já faz dois anos que somos vizinhos."]
  - [protagonist, "Да, две години. Брзо помина.", "Yes, two years. It went fast.", "Sim, dois anos. Passou rápido."]
  - [vera, "Вие сте човек што секогаш ми помага. Ајде да си зборуваме на ти.", "You're someone who always helps me. Let's say ти to each other.", "O senhor é uma pessoa que sempre me ajuda. Vamos nos tratar por ти."]
  - [protagonist, "Навистина? Тоа е чест за мене.", "Really? That's an honour for me.", "Sério? É uma honra para mim."]
  - [vera, "Викај ме Вера. Не „госпоѓо Стојановска“.", "Call me Vera. Not 'Mrs Stojanovska'.", "Me chama de Vera. Não 'senhora Stojanovska'."]
  - [protagonist, "Добро... Вера. Ќе ми треба време да се навикнам!", "All right... Vera. It'll take me time to get used to it!", "Tá bom... Vera. Vou precisar de tempo para me acostumar!"]
  - [vera, "И мене. Сакаш кафе?", "Me too. Do you want a coffee?", "Eu também. Quer um café?"]
  - [protagonist, "Секогаш!", "Always!", "Sempre!"]
teach:
  - ask: ["Say: we've been neighbours for two years.", "Diga: faz dois anos que somos vizinhos.", "Веќе две години сме соседи.", dve-godini, sosed]
  - ask: ["Say: it went fast.", "Diga: passou rápido.", "Брзо помина.", brzo]
  - ask: ["Say: someone who always helps.", "Diga: uma pessoa que sempre ajuda.", "Човек што секогаш помага.", covek-sto, sekogas]
  - ask: ["Vera makes the offer. How?", "A Vera faz a oferta. Como?", "Ајде да си зборуваме на ти.", ajde-da-si]
  - ask: ["Say: it's an honour for me.", "Diga: é uma honra para mim.", "Тоа е чест за мене.", cest, mene]
  - ask: ["Vera: call me Vera. How?", "A Vera: me chama de Vera. Como?", "Викај ме Вера.", vikaj-me]
  - ask: ["Say: it'll take me time to get used to it.", "Diga: vou precisar de tempo para me acostumar.", "Ќе ми треба време да се навикнам.", ke-mi-treba-vreme, da-se-naviknam]
  - ask: ["Now ask her, informally, if she wants coffee.", "Agora pergunte, informal, se ela quer café.", "Сакаш кафе?", sakas, kafe]
  - note: ["Two years of Вие, and then the older person offers ти — exactly as at the start, it is hers to offer. From now on you say 'ти', 'Вера', and 'сакаш'.", "Dois anos de Вие, e então a pessoa mais velha oferece o ти — como no começo, quem oferece é ela. De agora em diante é 'ти', 'Вера' e 'сакаш'."]
