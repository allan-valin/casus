id: A1-12
protagonist: m
title: [Animals, Animais]
situation: ["On the stairs a young man with a big dog. It's Marko, your neighbour.", "Na escada, um rapaz com um cachorro grande. É o Marko, seu vizinho."]
learn: [a1-imam]
culture: Young people say ти from the first word
items:
  - [zdravo, "Здраво", "Hi / hello (informal)", "Oi"]
  - [ti-si, "Ти си…?", "Are you…? (informal)", "Você é…?"]
  - [sosed, "сосед", "neighbour (a man)", "vizinho"]
  - [kuce, "куче", "dog", "cachorro"]
  - [ne-se-plasi, "Не се плаши", "Don't be afraid (informal)", "Não tenha medo"]
  - [ne-kasa, "не каса", "doesn't bite", "não morde", {rare: true}]
  - [kako-se-vika, "Како се вика?", "What's its / his name?", "Como se chama?"]
  - [se-vika, "се вика", "is called", "se chama"]
  - [imas-li, "Имаш ли…?", "Do you have…? (informal)", "Você tem…?"]
  - [macka, "мачка", "cat", "gato", {rare: true}]
  - [super, "Супер", "Great", "Legal / ótimo"]
dialogue:
  - [marko, "Здраво! Ти си новиот сосед?", "Hi! Are you the new neighbour?", "Oi! Você é o vizinho novo?"]
  - [protagonist, "Здраво, да. Ох, куче!", "Hi, yes. Oh, a dog!", "Oi, sou. Nossa, um cachorro!"]
  - [marko, "Не се плаши, не каса.", "Don't be afraid, he doesn't bite.", "Não tenha medo, ele não morde."]
  - [protagonist, "Како се вика?", "What's his name?", "Como ele se chama?"]
  - [marko, "Се вика Бруно. Имаш ли куче?", "He's called Bruno. Do you have a dog?", "Se chama Bruno. Você tem cachorro?"]
  - [protagonist, "Не, немам. Во Бразил имам мачка.", "No, I don't. In Brazil I have a cat.", "Não, não tenho. No Brasil tenho um gato."]
  - [marko, "Мачка? Супер. Јас сум Марко.", "A cat? Great. I'm Marko.", "Um gato? Legal. Eu sou o Marko."]
  - [protagonist, "Мило ми е, Марко!", "Nice to meet you, Marko!", "Prazer, Marko!"]
teach:
  - note: ["Marko is young, so he uses 'ти' at once and says 'Здраво', not 'Добар ден'. With him you do the same.", "O Marko é jovem, então usa 'ти' na hora e diz 'Здраво', não 'Добар ден'. Com ele você faz o mesmo."]
  - ask: ["Greet Marko the young way.", "Cumprimente o Marko do jeito jovem.", "Здраво!", zdravo]
  - ask: ["He asks if you're the new neighbour. Answer: yes, I'm the new neighbour.", "Ele pergunta se você é o vizinho novo. Responda: sim, sou o vizinho novo.", "Да, јас сум новиот сосед.", da, jas-sum, sosed]
  - ask: ["Ask a young man: are you the neighbour?", "Pergunte a um rapaz: você é o vizinho?", "Ти си соседот?", ti-si, sosed]
  - ask: ["Say: oh, a dog!", "Diga: nossa, um cachorro!", "Ох, куче!", kuce]
  - line: [marko, ne-se-plasi]
  - ask: ["He says: don't be afraid, he doesn't bite.", "Ele diz: não tenha medo, ele não morde.", "Не се плаши, не каса.", ne-se-plasi, ne-kasa]
  - ask: ["Ask the dog's name.", "Pergunte o nome do cachorro.", "Како се вика?", kako-se-vika]
  - ask: ["Say: he's called Bruno.", "Diga: ele se chama Bruno.", "Се вика Бруно.", se-vika]
  - ask: ["Ask Marko if he has a cat — informally.", "Pergunte ao Marko se ele tem gato — informal.", "Имаш ли мачка?", imas-li, macka]
  - ask: ["Say: in Brazil I have a cat.", "Diga: no Brasil tenho um gato.", "Во Бразил имам мачка.", vo, imam, macka]
  - ask: ["Say: great!", "Diga: legal!", "Супер!", super]
  - ask: ["Say you don't have a dog.", "Diga que não tem cachorro.", "Немам куче.", nemam, kuce]
