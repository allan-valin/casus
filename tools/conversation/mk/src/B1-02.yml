id: B1-02
protagonist: m
title: ["What do you think?", "O que você acha?"]
situation: ["Walking across the main square, Ana asks what you honestly think of the centre.", "Atravessando a praça principal, a Ana pergunta o que você acha de verdade do centro."]
learn: [b1-reported-speech]
culture: Direct opinions; the 'Skopje 2014' statues
items:
  - [iskreno, "искрено", "honestly", "sinceramente"]
  - [spored-mene, "според мене", "in my opinion", "na minha opinião"]
  - [cuden, "чуден", "strange (masculine)", "estranho"]
  - [statui, "статуи", "statues", "estátuas", {rare: true}]
  - [stranci, "странци", "foreigners", "estrangeiros"]
  - [ne-bas, "не баш", "not really", "não muito"]
  - [veli-deka, "вели дека", "says that", "diz que"]
  - [kic, "кич", "kitsch", "brega / kitsch", {rare: true}]
  - [najubavoto, "најубавото", "the best thing, the nicest", "o mais bonito / a melhor coisa"]
  - [nesto, "нешто", "something", "algo / alguma coisa"]
  - [ubavo-kazano, "Убаво кажано!", "Nicely put!", "Bem dito!"]
dialogue:
  - [ana, "Што мислиш за центарот, искрено?", "What do you think of the centre, honestly?", "O que você acha do centro, sinceramente?"]
  - [protagonist, "Според мене, чуден е. Многу статуи!", "In my opinion it's strange. So many statues!", "Na minha opinião, é estranho. Muita estátua!"]
  - [ana, "Сите странци го велат тоа. Тоа е „Скопје 2014“.", "All foreigners say that. That's 'Skopje 2014'.", "Todo estrangeiro diz isso. É o 'Skopje 2014'."]
  - [protagonist, "А тебе ти се допаѓа?", "And do you like it?", "E você, gosta?"]
  - [ana, "Не баш. Мајка ми вели дека е кич. Татко ми вели дека е убаво.", "Not really. My mother says it's kitsch. My father says it's beautiful.", "Não muito. Minha mãe diz que é brega. Meu pai diz que é bonito."]
  - [protagonist, "А јас мислам дека луѓето се најубавото нешто во Скопје.", "And I think the people are the best thing in Skopje.", "E eu acho que as pessoas são a melhor coisa de Skopje."]
  - [ana, "Убаво кажано!", "Nicely put!", "Bem dito!"]
  - [protagonist, "Искрено!", "Honestly!", "Sinceramente!"]
teach:
  - ask: ["Ask Ana what she thinks, honestly.", "Pergunte à Ana o que ela acha, sinceramente.", "Што мислиш, искрено?", iskreno]
  - ask: ["Say: in my opinion it's strange.", "Diga: na minha opinião, é estranho.", "Според мене, чуден е.", spored-mene, cuden]
  - ask: ["Say: so many statues!", "Diga: muita estátua!", "Многу статуи!", statui]
  - ask: ["Say: all foreigners say that.", "Diga: todo estrangeiro diz isso.", "Сите странци го велат тоа.", stranci, velat]
  - ask: ["Say: not really.", "Diga: não muito.", "Не баш.", ne-bas]
  - note: ["To report what someone says: вели дека … — 'my mother says that it's kitsch'. Дека is 'that'.", "Para contar o que alguém diz: вели дека … — 'minha mãe diz que é brega'. Дека é 'que'."]
  - ask: ["Say: my mother says it's kitsch.", "Diga: minha mãe diz que é brega.", "Мајка ми вели дека е кич.", veli-deka, kic]
  - ask: ["Say: I think the people are the best thing.", "Diga: acho que as pessoas são a melhor coisa.", "Мислам дека луѓето се најубавото нешто.", mislam-deka, najubavoto, nesto]
  - ask: ["Ana likes it: nicely put! How?", "A Ana gosta: bem dito! Como?", "Убаво кажано!", ubavo-kazano]
  - note: ["Between 2010 and 2014 the government covered the centre with neoclassical façades and statues — 'Skopje 2014'. It still divides people, so ask before you joke. In general, people here tell you their opinion directly — about the city, and about your haircut.", "Entre 2010 e 2014 o governo cobriu o centro com fachadas neoclássicas e estátuas — o 'Skopje 2014'. Ainda divide opiniões, então pergunte antes de fazer piada. Em geral, as pessoas daqui dizem o que pensam diretamente — sobre a cidade, e sobre o seu corte de cabelo."]
