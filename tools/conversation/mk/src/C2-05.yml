id: C2-05
protagonist: f
title: ["The Bitola accent", "O sotaque de Bitola"]
situation: ["Bojan's cousin from Bitola visits. You understand only half.", "O primo do Bojan de Bitola vem visitar. Você entende só metade."]
learn: [c2-register]
culture: Dialects and the standard
items:
  - [dijalektot, "дијалектот", "the dialect", "o dialeto"]
  - [izgovor, "изговор", "pronunciation", "pronúncia"]
  - [razlicno-zboruvaat, "различно зборуваат", "speak differently", "falam diferente"]
  - [standardniot-jazik, "стандардниот јазик", "the standard language", "a língua padrão"]
  - [osnovata, "основата", "the basis", "a base"]
  - [zapadnite-dijalekti, "западните дијалекти", "the western dialects", "os dialetos do oeste", {rare: true}]
  - [istocno, "источно", "in the east", "no leste"]
  - [ne-te-razbrav-dobro, "не те разбрав добро", "I didn't understand you well", "não te entendi direito"]
  - [povtori-poleka, "повтори полека", "repeat slowly", "repete devagar"]
  - [sekoj-kraj, "секој крај", "every region", "cada região"]
dialogue:
  - [bratucedot, "Ајде, што се врткаш? Седни да береме муабет!", "Come on, why are you fidgeting? Sit down and let's chat!", "Vamos, por que está se mexendo? Senta para a gente bater papo!"]
  - [protagonist, "Извини, не те разбрав добро. Повтори полека?", "Sorry, I didn't understand you well. Repeat slowly?", "Desculpa, não te entendi direito. Repete devagar?"]
  - [bojan, "Тој е од Битола. Таму различно зборуваат.", "He's from Bitola. They speak differently there.", "Ele é de Bitola. Lá falam diferente."]
  - [protagonist, "Изговорот е многу поинаков.", "The pronunciation is very different.", "A pronúncia é bem diferente."]
  - [bratucedot, "А, ама нашиот дијалект е основата на стандардниот јазик!", "Ah, but our dialect is the basis of the standard language!", "Ah, mas o nosso dialeto é a base da língua padrão!"]
  - [bojan, "Точно. Западните дијалекти — Прилеп, Битола, Велес.", "True. The western dialects — Prilep, Bitola, Veles.", "Verdade. Os dialetos do oeste — Prilep, Bitola, Veles."]
  - [protagonist, "А источно, кај Струмица?", "And in the east, around Strumica?", "E no leste, perto de Strumica?"]
  - [bratucedot, "Таму — друга приказна! Секој крај си има свое.", "There — another story! Every region has its own.", "Lá — outra história! Cada região tem o seu."]
teach:
  - ask: ["Say: I didn't understand you well.", "Diga: não te entendi direito.", "Не те разбрав добро.", ne-te-razbrav-dobro]
  - ask: ["Ask him to repeat slowly.", "Peça para repetir devagar.", "Повтори полека.", povtori-poleka]
  - ask: ["Say: they speak differently there.", "Diga: lá falam diferente.", "Таму различно зборуваат.", razlicno-zboruvaat]
  - ask: ["Say: the pronunciation.", "Diga: a pronúncia.", "Изговорот.", izgovor]
  - ask: ["Say: the dialect.", "Diga: o dialeto.", "Дијалектот.", dijalektot]
  - ask: ["Say: the basis of the standard language.", "Diga: a base da língua padrão.", "Основата на стандардниот јазик.", osnovata, standardniot-jazik]
  - ask: ["Say: the western dialects.", "Diga: os dialetos do oeste.", "Западните дијалекти.", zapadnite-dijalekti]
  - ask: ["Ask: and in the east?", "Pergunte: e no leste?", "А источно?", istocno]
  - ask: ["Say: every region has its own.", "Diga: cada região tem o seu.", "Секој крај си има свое.", sekoj-kraj]
  - note: ["Standard Macedonian was built in 1945 on the west-central dialects (Prilep, Bitola, Kičevo, Veles) — which is why its stress falls on the third syllable from the end. Eastern and northern dialects differ more, in sounds and in words.", "O macedônio padrão foi construído em 1945 sobre os dialetos do centro-oeste (Prilep, Bitola, Kičevo, Veles) — por isso o acento cai na antepenúltima. Os dialetos do leste e do norte diferem mais, nos sons e nas palavras."]
