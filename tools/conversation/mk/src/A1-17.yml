id: A1-17
protagonist: f
title: [Heat, Calor]
situation: ["A hot summer day. You open the window and the door. Mrs Stojanovska is horrified.", "Um dia quente de verão. Você abre a janela e a porta. A senhora Stojanovska fica horrorizada."]
learn: [a1-adjectives]
culture: The draft (промаја) that makes you ill
items:
  - [zesko, "жешко", "hot", "quente (calor)"]
  - [otvoren, "отворен", "open (masculine)", "aberto"]
  - [vratata, "вратата", "the door", "a porta"]
  - [promaja, "промаја", "a draft (air flowing through)", "corrente de ar", {rare: true}]
  - [sto-e-toa, "Што е тоа?", "What is that?", "O que é isso?"]
  - [veter, "ветер", "wind", "vento"]
  - [ke-nastinete, "Ќе настинете!", "You'll catch a cold! (formal)", "A senhora vai se resfriar!", {rare: true}]
  - [nema, "нема", "there isn't / there's no", "não tem / não há"]
  - [klima, "клима", "air conditioning", "ar-condicionado", {rare: true}]
  - [zatvorete, "Затворете", "Close (formal)", "Feche (formal)"]
  - [vednas, "веднаш", "right away", "já / agora mesmo"]
  - [poloso, "Уште полошо!", "Even worse!", "Pior ainda!"]
dialogue:
  - [vera, "Добро утро! Ох, отворен е прозорецот!", "Good morning! Oh, the window is open!", "Bom dia! Ai, a janela está aberta!"]
  - [protagonist, "Да, многу е жешко денеска.", "Yes, it's very hot today.", "Sim, está muito quente hoje."]
  - [vera, "Но и вратата е отворена. Има промаја!", "But the door is open too. There's a draft!", "Mas a porta também está aberta. Tem corrente de ar!"]
  - [protagonist, "Промаја? Што е тоа?", "A draft? What is that?", "Corrente de ar? O que é isso?"]
  - [vera, "Ветер од прозорецот до вратата. Ќе настинете!", "Wind from the window to the door. You'll catch a cold!", "Vento da janela até a porta. A senhora vai se resfriar!"]
  - [protagonist, "Во Бразил нема промаја. Имаме клима.", "In Brazil there's no draft. We have air conditioning.", "No Brasil não tem isso. A gente tem ar-condicionado."]
  - [vera, "Клима? Уште полошо! Затворете ја вратата, ве молам.", "Air conditioning? Even worse! Close the door, please.", "Ar-condicionado? Pior ainda! Feche a porta, por favor."]
  - [protagonist, "Добро, веднаш.", "All right, right away.", "Está bem, agora mesmo."]
teach:
  - note: ["Many Macedonians believe a draft — air moving between two open windows or a window and a door — gives you a cold, a stiff neck, even worse. Air conditioning is suspect too. Close one of them when an older person asks.", "Muitos macedônios acreditam que a corrente de ar — o ar passando entre duas janelas, ou janela e porta — dá resfriado, torcicolo e coisa pior. Ar-condicionado também é suspeito. Feche uma delas quando uma pessoa mais velha pedir."]
  - pt_only: "É o nosso 'vento encanado' — só que levado muito mais a sério."
  - ask: ["Say it's very hot today.", "Diga que está muito quente hoje.", "Многу е жешко денеска.", zesko, denes]
  - ask: ["Vera sees the window. Say: the window is open.", "A Vera vê a janela. Diga: a janela está aberta.", "Прозорецот е отворен.", prozorecot, otvoren]
  - ask: ["Say: the door is open too.", "Diga: a porta também está aberta.", "И вратата е отворена.", i, vratata]
  - ask: ["She warns you. How?", "Ela avisa. Como?", "Има промаја!", promaja]
  - ask: ["Ask her what that is.", "Pergunte o que é isso.", "Што е тоа?", sto-e-toa]
  - ask: ["Say: wind from the window to the door.", "Diga: vento da janela até a porta.", "Ветер од прозорецот до вратата.", veter, od, do]
  - ask: ["She says you'll catch a cold. How?", "Ela diz que você vai se resfriar. Como?", "Ќе настинете!", ke-nastinete]
  - ask: ["Say: in Brazil there's no draft.", "Diga: no Brasil não tem corrente de ar.", "Во Бразил нема промаја.", nema, promaja]
  - ask: ["Say: we have air conditioning.", "Diga: a gente tem ar-condicionado.", "Имаме клима.", imame, klima]
  - ask: ["Her answer: even worse!", "A resposta dela: pior ainda!", "Уште полошо!", poloso]
  - ask: ["She asks you to close the door. Say it for her: close, please.", "Ela pede para fechar a porta. Diga por ela: feche, por favor.", "Затворете, ве молам.", zatvorete, ve-molam]
  - ask: ["Promise: all right, right away.", "Prometa: está bem, agora mesmo.", "Добро, веднаш.", dobro, vednas]
