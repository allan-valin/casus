id: C2-30
protagonist: m
title: ["Five years", "Cinco anos"]
situation: ["Five years since the key and the landlady. On the old staircase, the whole story comes back.", "Cinco anos desde a chave e a dona do apartamento. Na velha escada, a história inteira volta."]
learn: []
culture: —
items:
  - [pet-godini, "пет години", "five years", "cinco anos"]
  - [prviot-kluc, "првиот клуч", "the first key", "a primeira chave"]
  - [kako-vcera, "како вчера", "like yesterday", "como se fosse ontem"]
  - [ne-ni-zbor, "ни збор", "not a word", "nem uma palavra"]
  - [sega-sonuvam, "сега сонувам на македонски", "now I dream in Macedonian", "agora sonho em macedônio"]
  - [doma-sum, "дома сум", "I'm home", "estou em casa"]
  - [na-dva-jazika, "на два јазика", "in two languages", "em duas línguas"]
  - [krajot-ili-pocetokot, "крајот или почетокот", "the end, or the beginning", "o fim, ou o começo"]
  - [nov-pocetok, "нов почеток", "a new beginning", "um novo começo"]
  - [blagodaram-na-site, "благодарам на сите", "thank you, everyone", "obrigado a todos"]
dialogue:
  - [marko, "Пет години! Се сеќаваш на првиот клуч?", "Five years! Do you remember the first key?", "Cinco anos! Lembra da primeira chave?"]
  - [protagonist, "Како вчера. „Ова е клучот.“ Не знаев ни збор.", "Like yesterday. 'This is the key.' I didn't know a word.", "Como se fosse ontem. 'Ова е клучот.' Eu não sabia nem uma palavra."]
  - [ana, "А сега?", "And now?", "E agora?"]
  - [protagonist, "Сега сонувам на македонски.", "Now I dream in Macedonian.", "Agora sonho em macedônio."]
  - [sara, "И им пееш на децата на два јазика.", "And you sing to the children in two languages.", "E canta para as crianças em duas línguas."]
  - [goran, "Брате, ти си бил поголем Македонец од нас!", "Bro, you turn out to be more Macedonian than us!", "Mano, você é mais macedônio que a gente, pelo jeito!"]
  - [protagonist, "Не. Само дома сум — тука и таму.", "No. I'm just at home — here and there.", "Não. Só estou em casa — aqui e lá."]
  - [protagonist, "Благодарам на сите. Ајде — кафе!", "Thank you, everyone. Come on — coffee!", "Obrigado a todos. Bora — café!"]
teach:
  - ask: ["Say: five years!", "Diga: cinco anos!", "Пет години!", pet-godini]
  - ask: ["Ask: do you remember the first key?", "Pergunte: lembra da primeira chave?", "Се сеќаваш на првиот клуч?", se-sekavas, prviot-kluc]
  - ask: ["Say: like yesterday.", "Diga: como se fosse ontem.", "Како вчера.", kako-vcera]
  - ask: ["Say: I didn't know a word.", "Diga: eu não sabia nem uma palavra.", "Не знаев ни збор.", ne-ni-zbor]
  - ask: ["Say: now I dream in Macedonian.", "Diga: agora sonho em macedônio.", "Сега сонувам на македонски.", sega-sonuvam]
  - ask: ["Say: in two languages.", "Diga: em duas línguas.", "На два јазика.", na-dva-jazika]
  - ask: ["Say: I'm home.", "Diga: estou em casa.", "Дома сум.", doma-sum]
  - ask: ["Say: thank you, everyone.", "Diga: obrigado a todos.", "Благодарам на сите.", blagodaram-na-site]
  - ask: ["Ask: is this the end, or the beginning?", "Pergunte: é o fim, ou o começo?", "Ова е крајот или почетокот?", krajot-ili-pocetokot]
  - ask: ["Answer: a new beginning.", "Responda: um novo começo.", "Нов почеток.", nov-pocetok]
  - note: ["End of the course. From 'Ова е клучот' to dreaming in Macedonian — the last questions bring back the first ones.", "Fim do curso. De 'Ова е клучот' a sonhar em macedônio — as últimas perguntas trazem de volta as primeiras."]
  - ask: ["The very first words: good day.", "As primeiras palavras: bom dia.", "Добар ден.", dobar-den]
  - ask: ["And: thank you.", "E: obrigado.", "Благодарам.", blagodaram]
  - ask: ["And Vera's word: here you are.", "E a palavra da Vera: pois não.", "Повелете.", povelete]
  - ask: ["And the toast: cheers — look me in the eyes!", "E o brinde: saúde — olha nos meus olhos!", "На здравје — погледни ме во очи!", na-zdravje, pogledni-me]
