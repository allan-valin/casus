id: B1-07
protagonist: f
title: ["So they say", "Teriam dito"]
situation: ["Goran has news — second-hand.", "O Goran tem novidade — de segunda mão."]
learn: [b1-renarrative]
culture: —
items:
  - [slusna-li, "Слушна ли?", "Did you hear? (informal)", "Ficou sabendo?"]
  - [se-svrsila, "се свршила", "(she) got engaged, reportedly", "(ela) teria ficado noiva", {rare: true}]
  - [so-kogo, "Со кого?", "With whom?", "Com quem?"]
  - [navodno, "наводно", "supposedly, reportedly", "supostamente"]
  - [se-zapoznale, "се запознале", "(they) met, reportedly", "teriam se conhecido"]
  - [letuvanje, "летување", "summer holiday", "férias de verão"]
  - [svadbata, "свадбата", "the wedding", "o casamento"]
  - [koj-ti-kaza, "Кој ти кажа?", "Who told you?", "Quem te contou?"]
  - [nemu, "нему", "to him (stressed)", "a ele"]
  - [kazala, "кажала", "(she) told, reportedly", "teria contado"]
  - [ne-veruvam, "Не верувам!", "I don't believe it!", "Não acredito!"]
dialogue:
  - [goran, "Слушна ли? Елена се свршила!", "Did you hear? Elena got engaged, apparently!", "Ficou sabendo? A Elena ficou noiva, parece!"]
  - [protagonist, "Не верувам! Со кого?", "I don't believe it! With whom?", "Não acredito! Com quem?"]
  - [goran, "Наводно со некој од Охрид. Се запознале на летување.", "Supposedly with someone from Ohrid. They met on holiday, they say.", "Supostamente com alguém de Ohrid. Teriam se conhecido nas férias."]
  - [protagonist, "А свадбата кога е?", "And when's the wedding?", "E o casamento é quando?"]
  - [goran, "Велат дека ќе била во јуни.", "They say it's to be in June.", "Dizem que seria em junho."]
  - [protagonist, "Кој ти кажа?", "Who told you?", "Quem te contou?"]
  - [goran, "Марко. А нему му кажала сестра ѝ.", "Marko. And her sister told him, apparently.", "O Marko. E a ele teria contado a irmã dela."]
  - [protagonist, "Значи, ништо не е сигурно!", "So nothing is certain!", "Então nada é certo!"]
teach:
  - note: ["Macedonian marks news you didn't witness: the л-form without 'е'. 'Елена се свршила' — Elena got engaged (so I hear). 'Се свршила е' would never be said. Portuguese uses 'teria', 'parece que', 'dizem que'.", "O macedônio marca a notícia que você não presenciou: a forma em -л sem o verbo 'ser'. 'Елена се свршила' — a Elena ficou noiva (pelo que ouvi). O português usa 'teria', 'parece que', 'dizem que'."]
  - ask: ["Ask if she heard.", "Pergunte se ela ficou sabendo.", "Слушна ли?", slusna-li]
  - ask: ["Say: Elena got engaged, apparently.", "Diga: a Elena ficou noiva, parece.", "Елена се свршила.", se-svrsila]
  - ask: ["Say: I don't believe it! With whom?", "Diga: não acredito! Com quem?", "Не верувам! Со кого?", ne-veruvam, so-kogo]
  - ask: ["Say: supposedly with someone from Ohrid.", "Diga: supostamente com alguém de Ohrid.", "Наводно со некој од Охрид.", navodno]
  - ask: ["Say: they met on holiday, they say.", "Diga: teriam se conhecido nas férias.", "Се запознале на летување.", se-zapoznale, letuvanje]
  - ask: ["Ask when the wedding is.", "Pergunte quando é o casamento.", "Кога е свадбата?", svadbata]
  - ask: ["Ask who told him.", "Pergunte quem contou.", "Кој ти кажа?", koj-ti-kaza]
  - ask: ["Say: her sister told him, apparently.", "Diga: a irmã dela teria contado a ele.", "Нему му кажала сестра ѝ.", nemu, kazala]
  - ask: ["Say: so nothing is certain!", "Diga: então nada é certo!", "Значи, ништо не е сигурно!", znaci]
