id: B2-17
protagonist: f
title: ["Coffee at work", "Café no trabalho"]
situation: ["Ten o'clock. Ana appears at your desk: coffee time.", "Dez horas. A Ana aparece na sua mesa: hora do café."]
learn: [b2-diminutives]
culture: The long coffee and the муабет
items:
  - [ajde-na-kafe, "Ајде на кафе!", "Let's go for coffee!", "Bora tomar um café!"]
  - [kafence, "кафенце", "a little coffee", "um cafezinho"]
  - [muabet, "муабет", "chat, good conversation", "papo / conversa", {rare: true}]
  - [samo-pet-minuti, "само пет минути", "just five minutes", "só cinco minutos"]
  - [casa, "чаша", "glass / cup", "copo / xícara"]
  - [casicka, "чашка", "a little cup", "xicrinha"]
  - [malku-vodicka, "малку водичка", "a little water", "uma aguinha"]
  - [ke-se-vratime, "ќе се вратиме", "we'll come back", "a gente volta"]
  - [pominaa, "поминаа", "(they) passed, went by", "passaram"]
  - [ne-se-broi, "не се брои", "doesn't count", "não conta"]
dialogue:
  - [ana, "Ајде на кафе!", "Let's go for coffee!", "Bora tomar um café!"]
  - [protagonist, "Имам многу работа. Само пет минути.", "I've got lots of work. Just five minutes.", "Tenho muito trabalho. Só cinco minutos."]
  - [ana, "Пет минути, едно кафенце. Ќе се вратиме веднаш.", "Five minutes, one little coffee. We'll be right back.", "Cinco minutos, um cafezinho. A gente volta já."]
  - [protagonist, "Една чашка, и малку водичка.", "A little cup, and a bit of water.", "Uma xicrinha, e uma aguinha."]
  - [ana, "А каков муабет имав вчера со Горан...", "And what a chat I had with Goran yesterday...", "E que papo eu tive ontem com o Goran..."]
  - [protagonist, "Ана! Поминаа четириесет минути!", "Ana! Forty minutes have gone by!", "Ana! Passaram quarenta minutos!"]
  - [ana, "Кафето не се брои. Тоа е муабет.", "Coffee doesn't count. That's conversation.", "Café não conta. Isso é papo."]
  - [protagonist, "Кажи му тоа на Николовски!", "Tell that to Nikolovski!", "Fala isso para o Nikolovski!"]
teach:
  - ask: ["Ana: let's go for coffee! How?", "A Ana: bora tomar um café! Como?", "Ајде на кафе!", ajde-na-kafe]
  - ask: ["Say: just five minutes.", "Diga: só cinco minutos.", "Само пет минути.", samo-pet-minuti]
  - note: ["Diminutives make things small and friendly: кафе → кафенце, чаша → чашка, вода → водичка. Like Portuguese -inho: cafezinho, aguinha.", "Diminutivos deixam as coisas pequenas e simpáticas: кафе → кафенце, чаша → чашка, вода → водичка. Como o -inho: cafezinho, aguinha."]
  - ask: ["Say: a little coffee.", "Diga: um cafezinho.", "Едно кафенце.", kafence]
  - ask: ["Say: we'll be right back.", "Diga: a gente volta já.", "Ќе се вратиме веднаш.", ke-se-vratime, vednas]
  - ask: ["Say: a little cup, and a bit of water.", "Diga: uma xicrinha, e uma aguinha.", "Една чашка, и малку водичка.", casicka, malku-vodicka]
  - ask: ["Say: a glass.", "Diga: um copo.", "Чаша.", casa]
  - ask: ["Say: what a chat!", "Diga: que papo!", "Каков муабет!", muabet]
  - ask: ["Say: forty minutes have gone by!", "Diga: passaram quarenta minutos!", "Поминаа четириесет минути!", pominaa, cetirieset]
  - ask: ["Ana: coffee doesn't count.", "A Ana: café não conta.", "Кафето не се брои.", ne-se-broi]
  - note: ["Coffee is a social event, not a drink: an 'espresso break' can last an hour, and муабет — good, unhurried talk — is the point.", "Café é evento social, não bebida: uma 'pausa para o expresso' pode durar uma hora, e o муабет — conversa boa, sem pressa — é o objetivo."]
