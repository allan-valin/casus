id: C2-12
protagonist: m
title: ["The family business", "O negócio da família"]
situation: ["Elena wants to open a bakery with her husband. She asks you to check the business plan.", "A Elena quer abrir uma padaria com o marido. Ela pede para você revisar o plano de negócios."]
learn: [c2-aspect-politeness]
culture: Family business
items:
  - [biznis-plan, "бизнис план", "business plan", "plano de negócios"]
  - [pekara, "пекара", "bakery", "padaria"]
  - [rizik, "ризик", "risk", "risco"]
  - [trosocite, "трошоците", "the costs", "os custos"]
  - [prihodite, "приходите", "the income", "a receita"]
  - [bi-mozela-li, "би можела ли", "could you perhaps", "você poderia"]
  - [da-gi-presmetame, "да ги пресметаме", "to calculate them", "calcular"]
  - [na-sopstvena-odgovornost, "на своја одговорност", "at one's own risk", "por conta e risco"]
  - [semejna-firma, "семејна фирма", "family firm", "empresa familiar"]
  - [ke-se-isplati, "ќе се исплати", "will pay off", "vai compensar"]
dialogue:
  - [elena, "Ова е бизнис планот за пекарата. Би можел ли да го погледнеш?", "This is the business plan for the bakery. Could you look at it?", "Este é o plano de negócios da padaria. Você poderia dar uma olhada?"]
  - [protagonist, "Секако. Трошоците ги имаш — ама приходите се многу оптимистички.", "Of course. You have the costs — but the income is very optimistic.", "Claro. Os custos você tem — mas a receita está muito otimista."]
  - [elena, "Во Карпош нема пекара. Луѓето ќе дојдат.", "There's no bakery in Karpoš. People will come.", "Em Karpoš não tem padaria. As pessoas vão vir."]
  - [protagonist, "Можеби. Но ризикот е голем. Ајде да ги пресметаме трите месеци без ниту една муштерија.", "Maybe. But the risk is big. Let's calculate three months without a single customer.", "Talvez. Mas o risco é grande. Vamos calcular três meses sem nenhum cliente."]
  - [elena, "Тогаш кредитот е проблем.", "Then the loan is a problem.", "Aí o empréstimo é um problema."]
  - [protagonist, "Семејна фирма — и роднините ќе помогнат, нели?", "A family firm — and the relatives will help, right?", "Empresa familiar — e os parentes vão ajudar, né?"]
  - [elena, "Мајка ми ќе меси, татко ми ќе продава.", "My mother will knead, my father will sell.", "Minha mãe vai sovar, meu pai vai vender."]
  - [protagonist, "Тогаш ќе се исплати. Само почни мало.", "Then it'll pay off. Just start small.", "Então vai compensar. Só começa pequeno."]
teach:
  - ask: ["Say: the business plan for the bakery.", "Diga: o plano de negócios da padaria.", "Бизнис планот за пекарата.", biznis-plan, pekara]
  - ask: ["Ask Elena: could you perhaps send it?", "Pergunte à Elena: você poderia mandar?", "Би можела ли да го пратиш?", bi-mozela-li]
  - ask: ["Say: the costs and the income.", "Diga: os custos e a receita.", "Трошоците и приходите.", trosocite, prihodite]
  - ask: ["Say: the risk is big.", "Diga: o risco é grande.", "Ризикот е голем.", rizik]
  - ask: ["Say: let's calculate them.", "Diga: vamos calcular.", "Ајде да ги пресметаме.", da-gi-presmetame]
  - ask: ["Say: a family firm.", "Diga: uma empresa familiar.", "Семејна фирма.", semejna-firma]
  - ask: ["Say: it'll pay off.", "Diga: vai compensar.", "Ќе се исплати.", ke-se-isplati]
  - ask: ["Say: at one's own risk.", "Diga: por conta e risco.", "На своја одговорност.", na-sopstvena-odgovornost]
  - note: ["Criticism among friends goes softly: agree first ('секако'), then 'ама…', and suggest with 'ајде да…' instead of 'треба да'. Family businesses lean on relatives for work and money.", "Crítica entre amigos vai com jeito: concorde primeiro ('секако'), depois 'ама…', e sugira com 'ајде да…' em vez de 'треба да'. Negócios de família contam com os parentes para trabalho e dinheiro."]
