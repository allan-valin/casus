id: A2-21
protagonist: f
title: ["The 1963 earthquake", "O terremoto de 1963"]
situation: ["Ana shows you the old railway station, now the City Museum. Its clock has shown 5:17 for sixty years.", "A Ana mostra a antiga estação de trem, hoje o Museu da Cidade. O relógio marca 5:17 há sessenta anos."]
learn: [a2-aorist]
culture: Skopje rebuilt with help from the whole world
items:
  - [casovnikot, "часовникот", "the clock", "o relógio"]
  - [zastana, "застана", "stopped", "parou"]
  - [zemjotres, "земјотрес", "earthquake", "terremoto", {rare: true}]
  - [utroto, "утрото", "in the morning", "de manhã"]
  - [urnat, "урнат", "destroyed, collapsed (masculine)", "destruído / desabado", {rare: true}]
  - [zaginaa, "загинаа", "(they) died, were killed", "morreram"]
  - [pomogna, "помогна", "helped", "ajudou"]
  - [svetot, "светот", "the world", "o mundo"]
  - [obnova, "обнова", "rebuilding", "reconstrução", {rare: true}]
  - [ostana, "остана", "remained, was left", "ficou / restou"]
  - [za-spomen, "за спомен", "as a memorial", "como lembrança"]
dialogue:
  - [ana, "Погледни го часовникот. Застана во пет и седумнаесет.", "Look at the clock. It stopped at five-seventeen.", "Olha o relógio. Parou às cinco e dezessete."]
  - [protagonist, "Зошто?", "Why?", "Por quê?"]
  - [ana, "Земјотрес. На 26 јули 1963, утрото.", "An earthquake. On 26 July 1963, in the morning.", "Um terremoto. Em 26 de julho de 1963, de manhã."]
  - [protagonist, "Многу беше урнато?", "Was much destroyed?", "Muita coisa desabou?"]
  - [ana, "Скоро цел град. Загинаа повеќе од илјада луѓе.", "Almost the whole city. More than a thousand people died.", "Quase a cidade inteira. Morreram mais de mil pessoas."]
  - [protagonist, "Ужасно. А потоа?", "Terrible. And then?", "Que horror. E depois?"]
  - [ana, "Цел свет помогна во обновата. Затоа Скопје е град на солидарноста.", "The whole world helped with the rebuilding. That's why Skopje is the city of solidarity.", "O mundo inteiro ajudou na reconstrução. Por isso Skopje é a cidade da solidariedade."]
  - [protagonist, "А станицата?", "And the station?", "E a estação?"]
  - [ana, "Остана вака, за спомен.", "It was left like this, as a memorial.", "Ficou assim, como lembrança."]
teach:
  - ask: ["Say: look at the clock.", "Diga: olha o relógio.", "Погледни го часовникот.", pogledni, casovnikot]
  - ask: ["Say: it stopped at five-seventeen.", "Diga: parou às cinco e dezessete.", "Застана во пет и седумнаесет.", zastana]
  - ask: ["Say: an earthquake, in the morning.", "Diga: um terremoto, de manhã.", "Земјотрес, утрото.", zemjotres, utroto]
  - ask: ["Say: almost the whole city was destroyed.", "Diga: quase a cidade inteira foi destruída.", "Скоро цел град беше урнат.", urnat, grad]
  - note: ["The past for 'they' often ends in -а: загинаа (they died), отидоа (they went). For he/she: застана, помогна.", "O passado de 'eles' muitas vezes termina em -а: загинаа (morreram), отидоа (foram). De ele/ela: застана (parou), помогна (ajudou)."]
  - ask: ["Say: more than a thousand people died.", "Diga: morreram mais de mil pessoas.", "Загинаа повеќе од илјада луѓе.", zaginaa, povekje, lugje]
  - ask: ["Say: the whole world helped.", "Diga: o mundo inteiro ajudou.", "Цел свет помогна.", pomogna, svetot]
  - ask: ["Say: with the rebuilding. (just: the rebuilding)", "Diga: a reconstrução.", "Обновата.", obnova]
  - ask: ["Say: it was left like this.", "Diga: ficou assim.", "Остана вака.", ostana]
  - ask: ["Say: as a memorial.", "Diga: como lembrança.", "За спомен.", za-spomen]
  - note: ["The earthquake of 26 July 1963 destroyed about four fifths of Skopje and killed over a thousand people. Help came from East and West in the middle of the Cold War, and the Japanese architect Kenzo Tange drew the new city plan.", "O terremoto de 26 de julho de 1963 destruiu uns quatro quintos de Skopje e matou mais de mil pessoas. A ajuda veio do Leste e do Oeste em plena Guerra Fria, e o arquiteto japonês Kenzo Tange desenhou o novo plano da cidade."]
