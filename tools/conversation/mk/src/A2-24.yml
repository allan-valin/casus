id: A2-24
protagonist: m
title: ["Music", "Música"]
situation: ["A wedding in Marko's family. Goran explains the music.", "Um casamento na família do Marko. O Goran explica a música."]
learn: [a2-imperfect]
culture: Old-town songs, the drum and zurla, the oro
items:
  - [tapan, "тапан", "big drum (tapan)", "tambor (tapan)", {rare: true}]
  - [zurla, "зурла", "zurla (folk oboe)", "zurla (oboé popular)", {rare: true}]
  - [glasno, "гласно", "loud", "alto (som)"]
  - [na-svadbi, "на свадби", "at weddings", "em casamentos", {rare: true}]
  - [oro, "оро", "circle dance (oro)", "dança de roda (oro)", {rare: true}]
  - [fati-se, "Фати се!", "Join in! (take hands, informal)", "Entra na roda!"]
  - [ritam, "ритам", "rhythm", "ritmo"]
  - [porano, "порано", "in the past, earlier", "antigamente"]
  - [peeja, "пееја", "(they) used to sing", "cantavam"]
  - [kafeani, "кафеани", "taverns", "tavernas / botecos", {rare: true}]
  - [starogradski, "староградски песни", "old-town songs", "canções da cidade antiga", {rare: true}]
dialogue:
  - [goran, "Слушаш? Тоа е тапан, а ова — зурла.", "Hear that? That's the tapan, and this — the zurla.", "Está ouvindo? Aquilo é o tapan, e isto — a zurla."]
  - [protagonist, "Многу гласно!", "Very loud!", "Muito alto!"]
  - [goran, "Така е на свадби. Ајде, фати се во орото!", "That's how it is at weddings. Come on, join the oro!", "Casamento é assim. Vem, entra na roda!"]
  - [protagonist, "Не го знам ритамот!", "I don't know the rhythm!", "Não sei o ritmo!"]
  - [goran, "Гледај ги нозете. Десно, десно, лево.", "Watch the feet. Right, right, left.", "Olha os pés. Direita, direita, esquerda."]
  - [protagonist, "А кога е потивко?", "And when it's quieter?", "E quando é mais calmo?"]
  - [goran, "Староградски песни. Порано луѓето ги пееја по кафеани.", "Old-town songs. In the past people sang them in the taverns.", "Canções da cidade antiga. Antigamente o pessoal cantava nas tavernas."]
  - [protagonist, "Како самба во бар!", "Like samba in a bar!", "Como samba no boteco!"]
teach:
  - ask: ["Say: that's the tapan.", "Diga: aquilo é o tapan.", "Тоа е тапан.", tapan]
  - ask: ["And this is the zurla.", "E isto é a zurla.", "А ова е зурла.", zurla]
  - ask: ["Say: very loud!", "Diga: muito alto!", "Многу гласно!", glasno]
  - ask: ["Say: that's how it is at weddings.", "Diga: casamento é assim.", "Така е на свадби.", na-svadbi]
  - ask: ["Goran says: join the oro! How?", "O Goran diz: entra na roda! Como?", "Фати се во орото!", fati-se, oro]
  - ask: ["Say: I don't know the rhythm.", "Diga: não sei o ritmo.", "Не го знам ритамот.", ritam]
  - ask: ["Say for Goran: right, right, left.", "Diga pelo Goran: direita, direita, esquerda.", "Десно, десно, лево.", desno, levo]
  - ask: ["Say: in the past people sang.", "Diga: antigamente o pessoal cantava.", "Порано луѓето пееја.", porano, peeja]
  - ask: ["Say: in the taverns.", "Diga: nas tavernas.", "По кафеани.", kafeani]
  - ask: ["Say: old-town songs.", "Diga: canções da cidade antiga.", "Староградски песни.", starogradski]
  - note: ["At weddings the tapan drum and the zurla play the oro, a line or circle dance; anyone can join by taking hands at the end of the line. Староградска музика, the old-town songs, are slower, sung in taverns with an accordion or guitar.", "Nos casamentos o tapan e a zurla tocam o oro, uma dança em fila ou roda; qualquer um entra dando a mão no fim da fila. A староградска музика, as canções da cidade antiga, é mais lenta, cantada nas tavernas com acordeão ou violão."]
