id: A1-14
protagonist: m
title: [Lunch at work, O almoço do trabalho]
situation: ["Lunch break with Ana at a place near the office.", "Hora do almoço com a Ana num lugar perto do escritório."]
learn: [a1-adjectives]
culture: Lunch is the main meal
items:
  - [gladen-li, "Гладен ли си?", "Are you hungry? (to a man, informal)", "Você está com fome?"]
  - [gladen, "гладен", "hungry (a man)", "com fome (homem)"]
  - [sto-jades, "Што јадеш?", "What are you eating? / What will you have?", "O que você vai comer?"]
  - [jadam, "јадам", "I eat", "eu como"]
  - [salata, "салата", "salad", "salada"]
  - [meso, "месо", "meat", "carne"]
  - [supa, "супа", "soup", "sopa", {rare: true}]
  - [ne-jadam, "не јадам", "I don't eat", "eu não como"]
  - [vegetarijanka, "вегетаријанка", "vegetarian (a woman)", "vegetariana", {rare: true}]
  - [sto-pies, "Што пиеш?", "What are you drinking? (informal)", "O que você vai beber?"]
  - [sok, "сок", "juice", "suco", {rare: true}]
  - [od, "од", "of / from", "de"]
dialogue:
  - [ana, "Гладен ли си?", "Are you hungry?", "Está com fome?"]
  - [protagonist, "Да, многу сум гладен!", "Yes, I'm very hungry!", "Sim, estou com muita fome!"]
  - [ana, "Што јадеш? Јас јадам салата.", "What are you having? I'm having a salad.", "O que você vai comer? Eu vou de salada."]
  - [protagonist, "Јас јадам месо и супа.", "I'll have meat and soup.", "Eu vou de carne e sopa."]
  - [ana, "Јас не јадам месо.", "I don't eat meat.", "Eu não como carne."]
  - [protagonist, "Вегетаријанка си?", "Are you vegetarian?", "Você é vegetariana?"]
  - [ana, "Да. Што пиеш?", "Yes. What are you drinking?", "Sou. O que você vai beber?"]
  - [protagonist, "Сок од портокал.", "Orange juice.", "Suco de laranja."]
  - [ana, "Пријатно!", "Enjoy your meal!", "Bom apetite!"]
teach:
  - note: ["'Гладен' agrees with the person: a man is 'гладен', a woman 'гладна'.", "'Гладен' concorda com a pessoa: um homem está 'гладен', uma mulher 'гладна'."]
  - ask: ["Ask a man if he's hungry.", "Pergunte a um homem se ele está com fome.", "Гладен ли си?", gladen-li]
  - ask: ["Say you're very hungry.", "Diga que está com muita fome.", "Многу сум гладен.", gladen]
  - ask: ["Ask her what she's having.", "Pergunte o que ela vai comer.", "Што јадеш?", sto-jades]
  - ask: ["Say: I'm having a salad.", "Diga: eu vou de salada.", "Јадам салата.", jadam, salata]
  - ask: ["Say: meat and soup.", "Diga: carne e sopa.", "Месо и супа.", meso, supa]
  - ask: ["Say she doesn't eat meat — for her: I don't eat meat.", "Diga por ela: eu não como carne.", "Не јадам месо.", ne-jadam, meso]
  - ask: ["Ask: are you vegetarian?", "Pergunte: você é vegetariana?", "Вегетаријанка си?", vegetarijanka]
  - ask: ["Ask what she's drinking.", "Pergunte o que ela vai beber.", "Што пиеш?", sto-pies]
  - note: ["Juice 'of' a fruit: 'сок од портокал' — orange juice.", "Suco 'de' uma fruta: 'сок од портокал' — suco de laranja."]
  - ask: ["Order orange juice.", "Peça suco de laranja.", "Сок од портокал, ве молам.", sok, od]
  - ask: ["Wish her a good meal.", "Deseje bom apetite.", "Пријатно!", prijatno]
  - pt_only: "O almoço aqui é a refeição principal, como no Brasil — mas em casa costuma ser mais tarde, lá pelas duas."
