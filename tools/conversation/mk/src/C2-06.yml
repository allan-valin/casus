id: C2-06
protagonist: m
title: ["Stand-up", "Stand-up"]
situation: ["A comedy night in a basement bar. The comedian picks on the foreigner in the front row.", "Uma noite de comédia num bar de porão. O comediante pega no pé do estrangeiro da primeira fila."]
learn: [c2-admirative]
culture: Humour that laughs at itself
items:
  - [komicar, "комичар", "comedian", "comediante", {rare: true}]
  - [prv-red, "прв ред", "front row", "primeira fila"]
  - [sme-bile, "сме биле", "we are, it turns out (surprise)", "a gente é, pelo jeito"]
  - [poznati-po, "познати по", "famous for", "famosos por"]
  - [smeata, "се смее", "laughs", "ri"]
  - [se-navredi, "се навреди", "got offended", "se ofendeu"]
  - [na-svoja-smetka, "на своја сметка", "at one's own expense", "às próprias custas"]
  - [pogodi, "погоди", "hit the mark", "acertou"]
  - [samoironija, "самоиронија", "self-irony", "autoironia", {rare: true}]
  - [aplauz, "аплауз", "applause", "aplauso"]
dialogue:
  - [komicar, "Имаме странец во првиот ред! Од каде си?", "We have a foreigner in the front row! Where are you from?", "Temos um estrangeiro na primeira fila! De onde você é?"]
  - [protagonist, "Од Бразил.", "From Brazil.", "Do Brasil."]
  - [komicar, "Од Бразил — и дошол во Скопје! Доброволно!", "From Brazil — and he came to Skopje! Voluntarily!", "Do Brasil — e veio para Skopje! Por vontade própria!"]
  - [komicar, "Ние сме биле толку интересни? Ние сме познати само по промаја и кафе!", "Are we really that interesting? We're famous only for drafts and coffee!", "A gente é tão interessante assim? A gente só é famoso por corrente de ar e café!"]
  - [protagonist, "И по ракија!", "And rakija!", "E pela rakija!"]
  - [komicar, "Ете, тој веќе е наш! Аплауз!", "There, he's already one of us! Applause!", "Pronto, ele já é dos nossos! Aplausos!"]
  - [goran, "Не се навреди?", "You didn't get offended?", "Não se ofendeu?"]
  - [protagonist, "Не. Тој се смее на своја сметка — тоа е самоиронија. И погоди.", "No. He laughs at his own expense — that's self-irony. And he hit the mark.", "Não. Ele ri às próprias custas — é autoironia. E acertou."]
teach:
  - ask: ["Say: the front row.", "Diga: a primeira fila.", "Првиот ред.", prv-red]
  - ask: ["Say: a comedian.", "Diga: um comediante.", "Комичар.", komicar]
  - ask: ["The comedian, surprised: are we really that interesting?", "O comediante, surpreso: a gente é tão interessante assim?", "Ние сме биле толку интересни?", sme-bile]
  - ask: ["Say: famous only for drafts and coffee.", "Diga: famosos só por corrente de ar e café.", "Познати само по промаја и кафе.", poznati-po, promaja]
  - ask: ["Say: applause!", "Diga: aplausos!", "Аплауз!", aplauz]
  - ask: ["Goran: you didn't get offended?", "O Goran: não se ofendeu?", "Не се навреди?", se-navredi]
  - ask: ["Say: he laughs at his own expense.", "Diga: ele ri às próprias custas.", "Се смее на своја сметка.", smeata, na-svoja-smetka]
  - ask: ["Say: that's self-irony.", "Diga: é autoironia.", "Тоа е самоиронија.", samoironija]
  - ask: ["Say: he hit the mark.", "Diga: ele acertou.", "Погоди.", pogodi]
  - note: ["The admirative 'сме биле' — surprise at what someone says about you — fits comedy perfectly. Local humour laughs at itself first; a foreigner who joins in on the joke (rakija!) is in.", "O admirativo 'сме биле' — surpresa com o que dizem de você — cai bem na comédia. O humor local ri primeiro de si mesmo; o estrangeiro que entra na piada (rakija!) está dentro."]
