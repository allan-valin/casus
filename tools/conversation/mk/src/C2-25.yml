id: C2-25
protagonist: f
title: ["Language at work", "A língua no trabalho"]
situation: ["A new young colleague wrote 'Ej, што има?' to a client. You show her the difference.", "Uma colega nova escreveu 'Ej, што има?' para um cliente. Você mostra a diferença."]
learn: [c2-register]
culture: —
items:
  - [formalno, "формално", "formal(ly)", "formal"]
  - [neformalno, "неформално", "informal(ly)", "informal"]
  - [sto-ima, "Што има?", "What's up?", "E aí?"]
  - [ne-dolikuva, "не доликува", "isn't appropriate", "não fica bem", {rare: true}]
  - [prvo-vie, "прво „Вие“", "first 'Вие'", "primeiro 'Вие'"]
  - [dodeka-ne-ponudi, "додека не понуди", "until he offers", "até ele oferecer"]
  - [ne-se-lutam-na-tebe, "не ти се лутам", "I'm not angry with you", "não estou brava com você"]
  - [site-pocnavme-taka, "сите почнавме така", "we all started like that", "todo mundo começou assim"]
  - [preformuliraj, "преформулирај", "rephrase (informal)", "reformula", {rare: true}]
  - [ke-zvuci-podobro, "ќе звучи подобро", "will sound better", "vai soar melhor"]
dialogue:
  - [kolegicka, "Му пишав на клиентот: „Еј, што има?“ Не одговара.", "I wrote to the client: 'Hey, what's up?' He's not answering.", "Escrevi para o cliente: 'E aí, beleza?' Ele não responde."]
  - [protagonist, "Тоа е неформално. Со клиент не доликува.", "That's informal. With a client it isn't appropriate.", "Isso é informal. Com cliente não fica bem."]
  - [kolegicka, "А како?", "So how?", "E como?"]
  - [protagonist, "Формално: „Почитуван господине…“ И прво „Вие“, додека не понуди „ти“.", "Formally: 'Dear Sir…' And first 'Вие', until he offers 'ти'.", "Formal: 'Prezado senhor…' E primeiro 'Вие', até ele oferecer 'ти'."]
  - [kolegicka, "Се срамам...", "I'm embarrassed...", "Que vergonha..."]
  - [protagonist, "Не ти се лутам. Сите почнавме така. И јас викав „ти“ на госпоѓа Стојановска.", "I'm not angry with you. We all started like that. I too said 'ти' to Mrs Stojanovska.", "Não estou brava com você. Todo mundo começou assim. Eu também chamei a senhora Stojanovska de 'ти'."]
  - [kolegicka, "Ќе преформулирам.", "I'll rephrase it.", "Vou reformular."]
  - [protagonist, "Преформулирај — ќе звучи подобро. И додај „Со почит“.", "Rephrase — it'll sound better. And add 'Со почит'.", "Reformula — vai soar melhor. E acrescenta 'Со почит'."]
teach:
  - ask: ["Say: what's up? (very informal)", "Diga: e aí? (bem informal)", "Што има?", sto-ima]
  - ask: ["Say: that's informal.", "Diga: isso é informal.", "Тоа е неформално.", neformalno]
  - ask: ["Say: with a client it isn't appropriate.", "Diga: com cliente não fica bem.", "Со клиент не доликува.", ne-dolikuva]
  - ask: ["Say: formally.", "Diga: formal.", "Формално.", formalno]
  - ask: ["Say: first 'Вие', until he offers 'ти'.", "Diga: primeiro 'Вие', até ele oferecer 'ти'.", "Прво „Вие“, додека не понуди „ти“.", prvo-vie, dodeka-ne-ponudi]
  - ask: ["Say: I'm not angry with you.", "Diga: não estou brava com você.", "Не ти се лутам.", ne-se-lutam-na-tebe]
  - ask: ["Say: we all started like that.", "Diga: todo mundo começou assim.", "Сите почнавме така.", site-pocnavme-taka]
  - ask: ["Say: rephrase it.", "Diga: reformula.", "Преформулирај.", preformuliraj]
  - ask: ["Say: it'll sound better.", "Diga: vai soar melhor.", "Ќе звучи подобро.", ke-zvuci-podobro]
  - note: ["The whole course in one rule: 'Вие' first, and wait for the offer of 'ти' — from the older person, the client, the boss. Now you're the one who teaches it.", "O curso inteiro numa regra: primeiro 'Вие', e espere a oferta do 'ти' — do mais velho, do cliente, do chefe. Agora é você quem ensina."]
