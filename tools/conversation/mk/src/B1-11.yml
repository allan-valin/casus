id: B1-11
protagonist: f
title: ["The wedding (1)", "O casamento (1)"]
situation: ["The church, then the hall. Ana sits next to you and explains.", "A igreja, depois o salão. A Ana senta do seu lado e explica."]
learn: [b1-passive]
culture: —
items:
  - [nevestata, "невестата", "the bride", "a noiva"]
  - [mladozenecot, "младоженецот", "the groom", "o noivo", {rare: true}]
  - [vencavkata, "венчавката", "the wedding ceremony", "a cerimônia", {rare: true}]
  - [crkva, "црква", "church", "igreja"]
  - [se-drzat, "се држат", "are held", "são segurados / se seguram"]
  - [kruni, "круни", "crowns", "coroas", {rare: true}]
  - [okolu, "околу", "around", "em volta de"]
  - [pati, "пати", "times", "vezes"]
  - [prsten, "прстен", "ring", "anel / aliança"]
  - [desnata-raka, "десната рака", "the right hand", "a mão direita"]
  - [ubava-e, "Колку е убава!", "How beautiful she is!", "Como ela está linda!"]
dialogue:
  - [ana, "Погледни ја невестата. Колку е убава!", "Look at the bride. How beautiful she is!", "Olha a noiva. Como ela está linda!"]
  - [protagonist, "А младоженецот е нервозен.", "And the groom is nervous.", "E o noivo está nervoso."]
  - [ana, "Венчавката е во црква. Над нивните глави се држат круни.", "The ceremony is in church. Crowns are held over their heads.", "A cerimônia é na igreja. Seguram coroas sobre a cabeça deles."]
  - [protagonist, "Круни? Зошто?", "Crowns? Why?", "Coroas? Por quê?"]
  - [ana, "Тие се цар и царица на своето семејство.", "They're king and queen of their own family.", "Eles são rei e rainha da própria família."]
  - [protagonist, "А сега? Одат околу масата.", "And now? They're walking around the table.", "E agora? Estão andando em volta da mesa."]
  - [ana, "Три пати. И кумот оди со нив.", "Three times. And the кум goes with them.", "Três vezes. E o кум vai junto."]
  - [protagonist, "Прстенот е на десната рака!", "The ring is on the right hand!", "A aliança está na mão direita!"]
  - [ana, "Да, кај нас на десната.", "Yes, with us it's the right.", "É, aqui é na direita."]
teach:
  - ask: ["Say: look at the bride.", "Diga: olha a noiva.", "Погледни ја невестата.", pogledni, nevestata]
  - ask: ["Say: how beautiful she is!", "Diga: como ela está linda!", "Колку е убава!", ubava-e]
  - ask: ["Say: the groom.", "Diga: o noivo.", "Младоженецот.", mladozenecot]
  - ask: ["Say: the ceremony is in church.", "Diga: a cerimônia é na igreja.", "Венчавката е во црква.", vencavkata, crkva]
  - ask: ["Say: crowns are held over them.", "Diga: seguram coroas sobre eles.", "Над нив се држат круни.", se-drzat, kruni, nad]
  - ask: ["Say: they walk around the table.", "Diga: andam em volta da mesa.", "Одат околу масата.", okolu, masa]
  - ask: ["Say: three times.", "Diga: três vezes.", "Три пати.", tri, pati]
  - ask: ["Say: the ring is on the right hand.", "Diga: a aliança está na mão direita.", "Прстенот е на десната рака.", prsten, desnata-raka]
  - note: ["In the Orthodox wedding crowns are held over the couple, the кум stands beside them, and they walk three times around the table. The wedding ring goes on the right hand.", "No casamento ortodoxo seguram coroas sobre o casal, o кум fica ao lado, e eles dão três voltas em torno da mesa. A aliança vai na mão direita."]
  - pt_only: "Aliança na direita: aqui é sinal de casado, não de noivo como no Brasil."
