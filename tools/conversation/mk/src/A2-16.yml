id: A2-16
protagonist: m
title: ["When she was a child", "Quando ela era criança"]
situation: ["Over coffee, Mrs Stojanovska talks about her childhood in a village near Bitola.", "No café, a senhora Stojanovska conta da infância numa aldeia perto de Bitola."]
learn: [a2-imperfect]
culture: Summers at Lake Prespa; villages without electricity
items:
  - [ziveevte, "живеевте", "you lived / used to live (formal)", "a senhora morava"]
  - [koga-bevte-mala, "кога бевте мала", "when you were little (formal, to a woman)", "quando a senhora era pequena"]
  - [kaj, "кај", "near / at", "perto de / em"]
  - [ziveevme, "живеевме", "we lived / used to live", "a gente morava"]
  - [sekoe-leto, "секое лето", "every summer", "todo verão"]
  - [odevme, "одевме", "we used to go", "a gente ia"]
  - [plivavme, "пливавме", "we used to swim", "a gente nadava", {rare: true}]
  - [nemavme, "немавме", "we didn't have", "a gente não tinha"]
  - [citavme, "читавме", "we used to read", "a gente lia"]
  - [pecka, "печката", "the stove", "o fogão a lenha", {rare: true}]
  - [togas, "тогаш", "then, back then", "naquela época / então"]
  - [drugo, "друго", "different / other (neuter)", "outro / diferente"]
dialogue:
  - [protagonist, "Каде живеевте кога бевте мала?", "Where did you live when you were little?", "Onde a senhora morava quando era pequena?"]
  - [vera, "Во едно село кај Битола. Живеевме во стара куќа.", "In a village near Bitola. We lived in an old house.", "Numa aldeia perto de Bitola. A gente morava numa casa velha."]
  - [protagonist, "Што правевте секое лето?", "What did you do every summer?", "O que vocês faziam todo verão?"]
  - [vera, "Секое лето одевме на Преспа. Пливавме во езерото.", "Every summer we went to Prespa. We swam in the lake.", "Todo verão a gente ia para Prespa. Nadava no lago."]
  - [protagonist, "А зиме?", "And in winter?", "E no inverno?"]
  - [vera, "Зиме беше многу ладно. Немавме струја — читавме покрај печката.", "In winter it was very cold. We had no electricity — we read by the stove.", "No inverno fazia muito frio. Não tinha luz — a gente lia perto do fogão."]
  - [protagonist, "Без струја!", "No electricity!", "Sem luz!"]
  - [vera, "Да, тогаш беше друго време.", "Yes, those were different times.", "Pois é, naquela época era outro tempo."]
teach:
  - note: ["A second past tense tells what used to happen, again and again: одевме (we used to go), живеевме (we lived). For one finished event you use the other past: отидовме (we went, once).", "Um segundo passado conta o que acontecia sempre: одевме (a gente ia), живеевме (a gente morava). Para um fato único e terminado usa-se o outro passado: отидовме (fomos, uma vez)."]
  - ask: ["Ask her where she lived when she was little.", "Pergunte onde ela morava quando era pequena.", "Каде живеевте кога бевте мала?", ziveevte, koga-bevte-mala]
  - ask: ["Say for her: in a village near Bitola.", "Diga por ela: numa aldeia perto de Bitola.", "Во едно село кај Битола.", selo, kaj]
  - ask: ["Say: we lived in an old house.", "Diga: a gente morava numa casa velha.", "Живеевме во стара куќа.", ziveevme, stara]
  - ask: ["Say: every summer we went to Prespa.", "Diga: todo verão a gente ia para Prespa.", "Секое лето одевме на Преспа.", sekoe-leto, odevme]
  - ask: ["Say: we swam in the lake.", "Diga: a gente nadava no lago.", "Пливавме во езерото.", plivavme, ezeroto]
  - ask: ["Say: we had no electricity.", "Diga: a gente não tinha luz.", "Немавме струја.", nemavme, struja]
  - ask: ["Say: we read by the stove.", "Diga: a gente lia perto do fogão.", "Читавме покрај печката.", citavme, pecka]
  - ask: ["Say: those were different times.", "Diga: naquela época era outro tempo.", "Тогаш беше друго време.", togas, bese, drugo]
  - note: ["In the 1950s many villages still had no electricity. Since then villages have emptied: young people moved to Skopje or abroad, and many houses are open only in summer.", "Nos anos cinquenta muitas aldeias ainda não tinham luz. Desde então as aldeias se esvaziaram: os jovens foram para Skopje ou para fora, e muitas casas só abrem no verão."]
