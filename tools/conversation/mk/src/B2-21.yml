id: B2-21
protagonist: f
title: ["Religion and festivals", "Religião e festas"]
situation: ["Darko brings baklava to the office: his Albanian neighbour's family celebrated Bajram.", "O Darko traz baklava para o escritório: a família do vizinho albanês dele comemorou o Bajram."]
learn: [b2-diminutives]
culture: Two faiths, one city
items:
  - [bajram, "Бајрам", "Bayram (Eid)", "Bairão (Eid)", {rare: true}]
  - [baklava, "баклава", "baklava", "baklava", {rare: true}]
  - [komsija, "комшија", "neighbour (colloquial)", "vizinho"]
  - [muslimani, "муслимани", "Muslims", "muçulmanos"]
  - [pravoslavni, "православни", "Orthodox (Christians)", "ortodoxos", {rare: true}]
  - [obicai, "обичаи", "customs", "costumes"]
  - [vera-faith, "вера", "faith, religion", "fé / religião"]
  - [pocit, "почит", "respect", "respeito"]
  - [si-cestitame, "си честитаме", "we congratulate each other", "a gente se cumprimenta"]
  - [parcence, "парченце", "a little piece", "um pedacinho"]
dialogue:
  - [darko, "Повелете баклава! Комшијата ми ја донесе — славеа Бајрам.", "Have some baklava! My neighbour brought it — they celebrated Bayram.", "Peguem baklava! O vizinho que me trouxe — eles comemoraram o Bajram."]
  - [protagonist, "Тие се муслимани?", "They're Muslims?", "Eles são muçulmanos?"]
  - [darko, "Да. Ние сме православни. На Велигден ние им носиме јајца.", "Yes. We're Orthodox. At Easter we bring them eggs.", "Sim. A gente é ortodoxa. Na Páscoa a gente leva ovos para eles."]
  - [protagonist, "Значи си честитате празници.", "So you wish each other happy holidays.", "Então vocês se cumprimentam nas festas."]
  - [darko, "Секако. Различна вера, исти обичаи — кафе, слатко, почит.", "Of course. Different faith, same customs — coffee, sweets, respect.", "Claro. Fé diferente, mesmos costumes — café, doce, respeito."]
  - [protagonist, "Може едно парченце?", "May I have a little piece?", "Posso um pedacinho?"]
  - [darko, "Едно? Земи две!", "One? Take two!", "Um? Pega dois!"]
  - [protagonist, "Убав обичај.", "A lovely custom.", "Que costume bonito."]
teach:
  - ask: ["Say: have some baklava!", "Diga: peguem baklava!", "Повелете баклава!", baklava]
  - ask: ["Say: my neighbour brought it.", "Diga: o vizinho me trouxe.", "Комшијата ми ја донесе.", komsija]
  - ask: ["Say: they celebrated Bayram.", "Diga: eles comemoraram o Bajram.", "Славеа Бајрам.", bajram]
  - ask: ["Ask: are they Muslims?", "Pergunte: eles são muçulmanos?", "Тие се муслимани?", muslimani]
  - ask: ["Say: we're Orthodox.", "Diga: a gente é ortodoxa.", "Ние сме православни.", pravoslavni]
  - ask: ["Say: we wish each other happy holidays.", "Diga: a gente se cumprimenta nas festas.", "Си честитаме празници.", si-cestitame]
  - ask: ["Say: different faith, same customs.", "Diga: fé diferente, mesmos costumes.", "Различна вера, исти обичаи.", vera-faith, obicai]
  - ask: ["Say: respect.", "Diga: respeito.", "Почит.", pocit]
  - ask: ["Ask for a little piece.", "Peça um pedacinho.", "Може едно парченце?", parcence]
  - note: ["About two thirds of the country is Orthodox Christian and about a third Muslim, mostly Albanians and Turks. Neighbours often exchange food and greetings on each other's holidays: Easter eggs one way, Bayram baklava the other.", "Cerca de dois terços do país é cristão ortodoxo e cerca de um terço muçulmano, na maioria albaneses e turcos. Vizinhos muitas vezes trocam comida e cumprimentos nas festas uns dos outros: ovos de Páscoa para um lado, baklava de Bajram para o outro."]
