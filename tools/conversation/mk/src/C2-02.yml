id: C2-02
protagonist: m
title: ["Fine irony", "Ironia fina"]
situation: ["Darko locked the office keys inside the office. Again.", "O Darko trancou as chaves do escritório dentro do escritório. De novo."]
learn: [c2-admirative]
culture: —
items:
  - [si-bil, "си бил", "you are, it turns out (surprise)", "você é, pelo jeito (surpresa)"]
  - [pameten, "паметен", "clever (masculine)", "esperto"]
  - [bas-pametno, "Баш паметно!", "Real clever! (ironic)", "Muito inteligente! (irônico)"]
  - [ne-sum-znael, "не сум знаел", "I had no idea (surprise)", "eu não fazia ideia"]
  - [deka-imalo, "дека имало", "that there was (surprise)", "que havia (surpresa)"]
  - [rezervni-klucevi, "резервни клучеви", "spare keys", "chaves reserva"]
  - [ti-si-bil-genije, "ти си бил гениј", "you're a genius, apparently", "você é um gênio, pelo jeito"]
  - [ja-izmisliv, "јас го измислив", "I came up with it", "eu inventei"]
  - [ne-se-pravi-pameten, "не прави се паметен", "don't act clever", "não se faz de esperto"]
  - [eve-ti-gi, "еве ти ги", "here they are for you", "toma aqui"]
dialogue:
  - [darko, "Клучевите ги оставив внатре... пак.", "I left the keys inside... again.", "Deixei as chaves lá dentro... de novo."]
  - [protagonist, "Баш паметно!", "Real clever!", "Muito inteligente!"]
  - [darko, "Ништо, ќе чекаме мајстор.", "Never mind, we'll wait for a locksmith.", "Tudo bem, a gente espera um chaveiro."]
  - [protagonist, "Не треба. Еве ти ги — резервни клучеви. Ги чувам во бирото.", "No need. Here — spare keys. I keep them in my desk.", "Não precisa. Toma — chaves reserva. Guardo na minha mesa."]
  - [darko, "Ти си бил гениј!", "You're a genius, it turns out!", "Você é um gênio, pelo jeito!"]
  - [protagonist, "Не сум гениј, само те познавам.", "I'm not a genius, I just know you.", "Não sou gênio, só te conheço."]
  - [darko, "Не сум знаел дека имало резервни клучеви!", "I had no idea there were spare keys!", "Eu não fazia ideia que tinha chave reserva!"]
  - [protagonist, "Имало, имало. Две години.", "There were, there were. For two years.", "Tinha, tinha. Faz dois anos."]
teach:
  - note: ["The admirative: the л-form with сум for surprise at something you just found out — 'ти си бил гениј!' (you're a genius, who knew!), 'не сум знаел дека имало…' (I had no idea there were…). Said with a flat voice, it turns ironic.", "O admirativo: a forma em -л com сум para surpresa diante do que você acabou de descobrir — 'ти си бил гениј!' (você é um gênio, quem diria!), 'не сум знаел дека имало…' (eu não fazia ideia que havia…). Dito em tom seco, vira ironia."]
  - ask: ["Say, ironically: real clever!", "Diga, irônico: muito inteligente!", "Баш паметно!", bas-pametno]
  - ask: ["Say: here they are for you — spare keys.", "Diga: toma — chaves reserva.", "Еве ти ги — резервни клучеви.", eve-ti-gi, rezervni-klucevi]
  - ask: ["Darko, surprised: you're a genius!", "O Darko, surpreso: você é um gênio, pelo jeito!", "Ти си бил гениј!", ti-si-bil-genije, si-bil]
  - ask: ["Darko: I had no idea there were spare keys!", "O Darko: eu não fazia ideia que tinha chave reserva!", "Не сум знаел дека имало резервни клучеви!", ne-sum-znael, deka-imalo]
  - ask: ["Say: he's clever.", "Diga: ele é esperto.", "Паметен е.", pameten]
  - ask: ["Say: don't act clever.", "Diga: não se faz de esperto.", "Не прави се паметен.", ne-se-pravi-pameten]
  - ask: ["Say: I came up with it.", "Diga: eu inventei.", "Јас го измислив.", ja-izmisliv]
