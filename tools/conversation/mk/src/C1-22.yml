id: C1-22
protagonist: m
title: ["The kindergarten", "A creche"]
situation: ["The baby is one. The public kindergarten has a waiting list; Sara's parents have a plan.", "O bebê fez um ano. A creche pública tem fila de espera; os pais da Sara têm um plano."]
learn: [c1-particles]
culture: Grandparents raise kids
items:
  - [gradinka, "градинка", "kindergarten, nursery", "creche"]
  - [nema-mesto, "нема место", "there's no place", "não tem vaga"]
  - [listata, "листата", "the list", "a lista"]
  - [stoite, "сте на листа", "you're on the list", "vocês estão na lista"]
  - [ama-zarem, "ама зарем", "but surely, really?", "mas será que"]
  - [baba-i-dedo, "баба и дедо", "grandma and grandpa", "vô e vó"]
  - [ke-go-cuvame, "ќе го чуваме", "we'll look after him", "a gente cuida dele"]
  - [ni-trgaat, "не ни треба", "we don't need it", "não precisamos"]
  - [pa-ete, "па ете", "well, there you go", "pois é / aí está"]
  - [besplatno-cuvanje, "бесплатно чување", "free childcare", "cuidado de graça"]
dialogue:
  - [sluzbenicka, "Во градинката нема место. Сте на листата, деветнаесетти.", "There's no place in the kindergarten. You're on the list, nineteenth.", "Não tem vaga na creche. Vocês estão na lista, em décimo nono."]
  - [protagonist, "Деветнаесетти? Ама зарем толку многу деца?", "Nineteenth? But surely there aren't that many children?", "Décimo nono? Mas será que tem tanta criança assim?"]
  - [sluzbenicka, "Има. Градот расте, градинките не.", "There are. The city grows, the kindergartens don't.", "Tem. A cidade cresce, as creches não."]
  - [svekrva-s, "Не ни треба градинка! Баба и дедо ќе го чуваме.", "We don't need a kindergarten! Grandma and grandpa will look after him.", "Não precisamos de creche! O vô e a vó cuidam dele."]
  - [protagonist, "Секој ден?", "Every day?", "Todo dia?"]
  - [svekrva-s, "Секој ден. Бесплатно чување, домашна храна.", "Every day. Free childcare, home-cooked food.", "Todo dia. Cuidado de graça, comida caseira."]
  - [sara, "Па ете, решено.", "Well, there you go, sorted.", "Pois é, resolvido."]
  - [protagonist, "И без промаја, нели?", "And no drafts, right?", "E sem corrente de ar, né?"]
teach:
  - ask: ["Say: the kindergarten.", "Diga: a creche.", "Градинката.", gradinka]
  - ask: ["Say: there's no place.", "Diga: não tem vaga.", "Нема место.", nema-mesto]
  - ask: ["Say: you're on the list.", "Diga: vocês estão na lista.", "Сте на листата.", stoite, listata]
  - ask: ["Say: but surely there aren't that many children?", "Diga: mas será que tem tanta criança assim?", "Ама зарем толку многу деца?", ama-zarem]
  - ask: ["Sara's mother: we don't need a kindergarten!", "A mãe da Sara: não precisamos de creche!", "Не ни треба градинка!", ni-trgaat]
  - ask: ["Say: grandma and grandpa will look after him.", "Diga: o vô e a vó cuidam dele.", "Баба и дедо ќе го чуваме.", baba-i-dedo, ke-go-cuvame]
  - ask: ["Say: free childcare.", "Diga: cuidado de graça.", "Бесплатно чување.", besplatno-cuvanje]
  - ask: ["Sara: well, there you go.", "A Sara: pois é.", "Па ете.", pa-ete]
  - note: ["Public kindergartens in Skopje often have waiting lists, and grandparents commonly look after small children every day — a help, and a strong say in how they're raised.", "As creches públicas de Skopje muitas vezes têm fila, e é comum os avós cuidarem das crianças pequenas todo dia — uma ajuda, e uma opinião forte sobre a criação."]
