id: C2-23
protagonist: f
title: ["Saudade", "Saudade"]
situation: ["Vera asks what the Portuguese word on your mug means.", "A Vera pergunta o que significa a palavra em português na sua caneca."]
learn: [c2-admirative]
culture: —
items:
  - [mi-nedostiga, "ми недостига", "I miss (it/him/her)", "sinto falta de"]
  - [mi-nedostigaat, "ми недостигаат", "I miss (them)", "sinto falta deles"]
  - [kopnez, "копнеж", "longing", "anseio", {rare: true}]
  - [ne-postoi-zbor, "не постои збор", "there's no word", "não existe palavra"]
  - [taga-i-radost, "тага и радост", "sadness and joy", "tristeza e alegria"]
  - [zaedno-vo-eden-zbor, "заедно во еден збор", "together in one word", "juntas numa palavra"]
  - [nie-sme-imale, "ние сме имале", "we have, it turns out", "a gente tem, pelo jeito"]
  - [zal, "жал", "sorrowful longing (old word)", "pesar / saudade (palavra antiga)", {rare: true}]
  - [za-nekoj-sto-go-nema, "за некој што го нема", "for someone who is gone", "por alguém que não está"]
  - [ubav-zbor, "убав збор", "a beautiful word", "uma palavra bonita"]
dialogue:
  - [vera, "Што пишува на шолјата? „Саудаде“?", "What does it say on the mug? 'Saudade'?", "O que está escrito na caneca? 'Saudade'?"]
  - [protagonist, "Тоа е кога некој или нешто многу ти недостига. Но не е само тага.", "It's when you miss someone or something very much. But it isn't just sadness.", "É quando você sente muita falta de alguém ou de alguma coisa. Mas não é só tristeza."]
  - [vera, "Тага и радост, заедно во еден збор?", "Sadness and joy, together in one word?", "Tristeza e alegria, juntas numa palavra?"]
  - [protagonist, "Точно. Копнеж, со убаво сеќавање.", "Exactly. Longing, with a beautiful memory.", "Isso. Anseio, com uma lembrança bonita."]
  - [vera, "Кај нас велат „жал“ — за некој што го нема.", "Here we say 'жал' — for someone who is gone.", "Aqui a gente diz 'жал' — por alguém que não está."]
  - [protagonist, "Значи и вие сте имале таков збор!", "So you have a word like that too!", "Então vocês também têm uma palavra assim!"]
  - [vera, "Имаме. Ми недостига брат ми — тоа е жал.", "We do. I miss my brother — that's жал.", "Temos. Sinto falta do meu irmão — isso é жал."]
  - [protagonist, "А мене ми недостигаат моите. Убав збор — и тежок.", "And I miss my family. A beautiful word — and a heavy one.", "E eu sinto falta dos meus. Palavra bonita — e pesada."]
teach:
  - ask: ["Say: I miss him very much.", "Diga: sinto muita falta dele.", "Многу ми недостига.", mi-nedostiga]
  - ask: ["Say: I miss my family.", "Diga: sinto falta dos meus.", "Ми недостигаат моите.", mi-nedostigaat]
  - ask: ["Say: sadness and joy.", "Diga: tristeza e alegria.", "Тага и радост.", taga-i-radost]
  - ask: ["Say: together in one word.", "Diga: juntas numa palavra.", "Заедно во еден збор.", zaedno-vo-eden-zbor]
  - ask: ["Say: longing.", "Diga: anseio.", "Копнеж.", kopnez]
  - ask: ["Vera: for someone who is gone.", "A Vera: por alguém que não está.", "За некој што го нема.", za-nekoj-sto-go-nema, zal]
  - ask: ["Surprised: so you have a word like that too!", "Surpresa: então vocês também têm uma palavra assim!", "И вие сте имале таков збор!", nie-sme-imale]
  - ask: ["Say: there's no single word.", "Diga: não existe uma palavra só.", "Не постои еден збор.", ne-postoi-zbor]
  - ask: ["Say: a beautiful word.", "Diga: uma palavra bonita.", "Убав збор.", ubav-zbor]
  - note: ["'Ми недостига' works like 'it is lacking to me': the thing missed is the subject. For several: 'ми недостигаат'. 'Жал' is an older, poetic word for sorrowful longing — the closest Macedonian comes to saudade.", "'Ми недостига' funciona como 'me falta': o que falta é o sujeito. Para vários: 'ми недостигаат'. 'Жал' é uma palavra mais antiga e poética para o pesar com anseio — o mais perto que o macedônio chega da saudade."]
