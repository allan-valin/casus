id: A1-22
protagonist: m
title: ["What time is it?", "Que horas são?"]
situation: ["You are late for coffee with Marko and call him.", "Você está atrasado para o café com o Marko e liga para ele."]
learn: [a1-numbers]
culture: Relaxed punctuality among friends
items:
  - [izvini, "Извини", "Sorry (informal)", "Desculpa"]
  - [docnam, "доцнам", "I'm late", "estou atrasado"]
  - [kolku-e-casot, "Колку е часот?", "What time is it?", "Que horas são?"]
  - [deset, "десет", "ten", "dez"]
  - [polovina, "половина", "half", "meia"]
  - [stignuvam, "стигнувам", "I arrive / I'm getting there", "eu chego / estou chegando"]
  - [opusteno, "Опуштено", "Relax / no stress", "Relaxa / tranquilo"]
  - [kade-si, "Каде си?", "Where are you? (informal)", "Onde você está?"]
  - [doma, "дома", "at home", "em casa"]
  - [uste, "уште", "still", "ainda"]
  - [vo-tri, "во три", "at three (o'clock)", "às três"]
dialogue:
  - [protagonist, "Здраво, Марко! Извини, доцнам.", "Hi, Marko! Sorry, I'm late.", "Oi, Marko! Desculpa, estou atrasado."]
  - [marko, "Нема проблем. Колку е часот сега?", "No problem. What time is it now?", "Sem problema. Que horas são agora?"]
  - [protagonist, "Три и десет. Кафето е во три!", "Ten past three. The coffee was at three!", "Três e dez. O café era às três!"]
  - [marko, "Опуштено.", "Relax.", "Relaxa."]
  - [protagonist, "Стигнувам во три и половина.", "I'll get there at half past three.", "Chego às três e meia."]
  - [marko, "Супер, полека.", "Great, take your time.", "Ótimo, com calma."]
  - [protagonist, "А ти? Каде си?", "And you? Where are you?", "E você? Onde você está?"]
  - [marko, "Јас? Уште сум дома.", "Me? I'm still at home.", "Eu? Ainda estou em casa."]
teach:
  - note: ["With friends, 'Извини' — with strangers and older people, 'Извинете'.", "Com amigos, 'Извини' — com desconhecidos e pessoas mais velhas, 'Извинете'."]
  - ask: ["Say sorry to Marko: sorry, I'm late.", "Peça desculpa ao Marko: desculpa, estou atrasado.", "Извини, доцнам.", izvini, docnam]
  - ask: ["Ask what time it is.", "Pergunte que horas são.", "Колку е часот?", kolku-e-casot]
  - note: ["Time: 'три и десет' — three and ten, ten past three. 'Три и половина' — half past three. 'At' is 'во': 'во три'.", "Horas: 'три и десет' — três e dez. 'Три и половина' — três e meia. 'Às' é 'во': 'во три' (às três)."]
  - ask: ["Say: ten past three.", "Diga: três e dez.", "Три и десет.", tri, deset]
  - ask: ["Say: the coffee is at three.", "Diga: o café é às três.", "Кафето е во три.", kafe, vo-tri]
  - ask: ["Say: I'll get there at half past three.", "Diga: chego às três e meia.", "Стигнувам во три и половина.", stignuvam, polovina]
  - ask: ["Marko isn't worried. How does he say it?", "O Marko não se preocupa. Como ele diz?", "Опуштено.", opusteno]
  - ask: ["Ask him where he is.", "Pergunte onde ele está.", "Каде си?", kade-si]
  - ask: ["He's still at home. Say it for him.", "Ele ainda está em casa. Diga por ele.", "Уште сум дома.", uste, doma]
  - note: ["Among friends, half an hour late is normal, and nobody is offended. At work and the doctor's, be on time.", "Entre amigos, meia hora de atraso é normal e ninguém se ofende. No trabalho e no médico, chegue na hora."]
  - pt_only: "Nisso Skopje parece o Brasil: o 'chego já' de um amigo pode ser meia hora."
