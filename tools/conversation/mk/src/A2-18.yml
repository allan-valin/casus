id: A2-18
protagonist: m
title: ["Geography", "Geografia"]
situation: ["On the shore at Ohrid, Ana points at the mountain across the water.", "Na margem, em Ohrid, a Ana aponta para a montanha do outro lado da água."]
learn: [a2-comparison]
culture: A country without a sea
items:
  - [planinata, "планината", "the mountain", "a montanha"]
  - [megju, "меѓу", "between", "entre"]
  - [dvete, "двете", "the two (feminine/neuter)", "os dois / as duas"]
  - [povisoko, "повисоко", "higher", "mais alto"]
  - [najvisokata, "највисоката", "the highest (feminine)", "a mais alta"]
  - [granicata, "границата", "the border", "a fronteira"]
  - [nad, "над", "over, above", "acima de / mais de"]
  - [reka, "река", "river", "rio"]
  - [najgolemata, "најголемата", "the biggest (feminine)", "a maior"]
  - [tece, "тече", "flows", "corre / passa"]
  - [more, "море", "sea", "mar"]
  - [zatoa, "затоа", "that's why", "por isso"]
dialogue:
  - [ana, "Ова е Галичица, планината меѓу двете езера.", "This is Galičica, the mountain between the two lakes.", "Esta é a Galičica, a montanha entre os dois lagos."]
  - [protagonist, "Две езера?", "Two lakes?", "Dois lagos?"]
  - [ana, "Охридското и Преспанското. Преспа е повисоко.", "Ohrid and Prespa. Prespa is higher.", "O de Ohrid e o de Prespa. Prespa é mais alto."]
  - [protagonist, "Која е највисоката планина во Македонија?", "Which is the highest mountain in Macedonia?", "Qual é a montanha mais alta da Macedônia?"]
  - [ana, "Кораб, на границата со Албанија. Над две илјади и седумстотини метри.", "Korab, on the border with Albania. Over two thousand seven hundred metres.", "O Korab, na fronteira com a Albânia. Mais de dois mil e setecentos metros."]
  - [protagonist, "А најголемата река?", "And the biggest river?", "E o maior rio?"]
  - [ana, "Вардар. Тече низ Скопје, па во Грција, до морето.", "The Vardar. It flows through Skopje, then into Greece, to the sea.", "O Vardar. Passa por Skopje, depois pela Grécia, até o mar."]
  - [protagonist, "Македонија нема море?", "Macedonia has no sea?", "A Macedônia não tem mar?"]
  - [ana, "Немаме. Затоа летото сите одат во Грција!", "We don't. That's why in summer everyone goes to Greece!", "Não. Por isso no verão todo mundo vai para a Grécia!"]
teach:
  - ask: ["Say: the mountain between the two lakes.", "Diga: a montanha entre os dois lagos.", "Планината меѓу двете езера.", planinata, megju, dvete]
  - ask: ["Say: Prespa is higher.", "Diga: Prespa é mais alto.", "Преспа е повисоко.", povisoko]
  - ask: ["Ask which is the highest mountain.", "Pergunte qual é a montanha mais alta.", "Која е највисоката планина?", najvisokata, planinata]
  - ask: ["Say: on the border with Albania.", "Diga: na fronteira com a Albânia.", "На границата со Албанија.", na, granicata]
  - ask: ["Say: over two thousand metres.", "Diga: mais de dois mil metros.", "Над две илјади метри.", nad, iljadi, metri]
  - ask: ["Ask: and the biggest river?", "Pergunte: e o maior rio?", "А најголемата река?", najgolemata, reka]
  - ask: ["Say: it flows through Skopje.", "Diga: passa por Skopje.", "Тече низ Скопје.", tece, niz]
  - ask: ["Ask: Macedonia has no sea?", "Pergunte: a Macedônia não tem mar?", "Македонија нема море?", nema, more]
  - ask: ["Say: that's why everyone goes to Greece.", "Diga: por isso todo mundo vai para a Grécia.", "Затоа сите одат во Грција.", zatoa, site]
  - note: ["North Macedonia is landlocked. Its 'sea' is the lakes — Ohrid, Prespa, Dojran — and in August half of Skopje drives to the Greek beaches, a few hours south.", "A Macedônia do Norte não tem mar. O 'mar' dela são os lagos — Ohrid, Prespa, Dojran — e em agosto meia Skopje desce de carro para as praias gregas, a poucas horas ao sul."]
