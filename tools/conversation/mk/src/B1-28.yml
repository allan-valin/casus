id: B1-28
protagonist: m
title: ["Moving house", "Mudança"]
situation: ["Goran is moving to a new flat. Everyone carries boxes.", "O Goran está se mudando para um apartamento novo. Todo mundo carrega caixa."]
learn: [b1-verbal-adverb]
culture: Friends, not movers
items:
  - [se-selam, "се селам", "I'm moving (house)", "estou me mudando"]
  - [kutii, "кутии", "boxes", "caixas"]
  - [nosi, "носи", "carry (informal)", "carrega"]
  - [teska-kutija, "тешка кутија", "a heavy box", "uma caixa pesada"]
  - [lift, "лифт", "lift, elevator", "elevador"]
  - [ne-raboti-lift, "лифтот не работи", "the lift isn't working", "o elevador não funciona"]
  - [po-skalite, "по скалите", "up/down the stairs", "pela escada"]
  - [zboruvajkji, "зборувајќи", "while talking", "conversando"]
  - [vnimavaj, "Внимавај!", "Careful! (informal)", "Cuidado!"]
  - [pica, "пица", "pizza", "pizza"]
dialogue:
  - [goran, "Благодарам што дојдовте! Се селам на петти кат.", "Thanks for coming! I'm moving to the fifth floor.", "Valeu por virem! Estou me mudando para o quinto andar."]
  - [protagonist, "Петти? А лифтот?", "Fifth? And the lift?", "Quinto? E o elevador?"]
  - [goran, "Лифтот не работи. По скалите!", "The lift isn't working. Up the stairs!", "O elevador não funciona. Pela escada!"]
  - [marko, "Носи ја оваа кутија. Внимавај, тешка е!", "Carry this box. Careful, it's heavy!", "Carrega essa caixa. Cuidado, é pesada!"]
  - [protagonist, "Што има внатре? Камења?", "What's inside? Stones?", "O que tem dentro? Pedras?"]
  - [goran, "Книги. Сите мои книги.", "Books. All my books.", "Livros. Todos os meus livros."]
  - [marko, "Качувајќи се, зборувајќи — ќе стигнеме до вечер!", "Climbing and talking — we'll be done by evening!", "Subindo e conversando — a gente termina até a noite!"]
  - [goran, "Потоа пица за сите, јас частам!", "Then pizza for everyone, it's on me!", "Depois pizza para todo mundo, eu pago!"]
teach:
  - ask: ["Goran: I'm moving. How?", "O Goran: estou me mudando. Como?", "Се селам.", se-selam]
  - ask: ["Say: to the fifth floor.", "Diga: para o quinto andar.", "На петти кат.", kat]
  - ask: ["Ask: and the lift?", "Pergunte: e o elevador?", "А лифтот?", lift]
  - ask: ["Say: the lift isn't working.", "Diga: o elevador não funciona.", "Лифтот не работи.", ne-raboti-lift]
  - ask: ["Say: up the stairs!", "Diga: pela escada!", "По скалите!", po-skalite]
  - ask: ["Marko: carry this box.", "O Marko: carrega essa caixa.", "Носи ја оваа кутија.", nosi, kutii]
  - ask: ["Say: careful, it's heavy!", "Diga: cuidado, é pesada!", "Внимавај, тешка е!", vnimavaj, teska-kutija]
  - ask: ["Say: climbing and talking.", "Diga: subindo e conversando.", "Качувајќи се, зборувајќи.", zboruvajkji]
  - ask: ["Goran: pizza for everyone!", "O Goran: pizza para todo mundo!", "Пица за сите!", pica, site]
  - note: ["Moving day is a friends' job: you carry boxes, the one moving pays with food and drink — and will carry yours next time.", "Dia de mudança é tarefa dos amigos: você carrega caixa, quem se muda paga com comida e bebida — e carrega as suas na próxima vez."]
