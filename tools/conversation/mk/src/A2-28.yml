id: A2-28
protagonist: m
title: ["By myself", "Eu mesmo"]
situation: ["You bought a second-hand bike. The tyre is flat. Marko comes down.", "Você comprou uma bicicleta usada. O pneu está furado. O Marko desce."]
learn: [a2-reflexive]
culture: —
items:
  - [si-kupiv, "си купив", "I bought (myself)", "comprei (para mim)"]
  - [poloven, "половен", "second-hand (masculine)", "usado"]
  - [gumata, "гумата", "the tyre", "o pneu", {rare: true}]
  - [dupnata, "дупната", "punctured (feminine)", "furado", {rare: true}]
  - [sam, "сам", "by myself (a man)", "sozinho"]
  - [ke-ti-pomognam, "ќе ти помогнам", "I'll help you (informal)", "eu te ajudo"]
  - [alat, "алат", "tool(s)", "ferramenta", {rare: true}]
  - [valkan, "валкан", "dirty (masculine)", "sujo"]
  - [izmij-se, "Измиј се!", "Wash yourself! (informal)", "Vai se lavar!"]
  - [mora, "мора", "must, have to", "tem que"]
  - [racete, "рацете", "the hands", "as mãos"]
dialogue:
  - [marko, "Нов велосипед?", "New bike?", "Bicicleta nova?"]
  - [protagonist, "Си купив половен. Но гумата е дупната.", "I bought a second-hand one. But the tyre is flat.", "Comprei uma usada. Mas o pneu está furado."]
  - [marko, "Ќе ја поправиш сам?", "Will you fix it yourself?", "Vai consertar sozinho?"]
  - [protagonist, "Сам, со видео од интернет.", "By myself, with a video from the internet.", "Sozinho, com um vídeo da internet."]
  - [marko, "Ајде, ќе ти помогнам. Имам алат.", "Come on, I'll help you. I have tools.", "Vem, eu te ajudo. Tenho ferramenta."]
  - [protagonist, "Готово! Вози!", "Done! It rides!", "Pronto! Está andando!"]
  - [marko, "Браво. Но ти си многу валкан. Измиј се!", "Well done. But you're very dirty. Go and wash!", "Muito bem. Mas você está imundo. Vai se lavar!"]
  - [protagonist, "Да, мора. Рацете ми се црни.", "Yes, I must. My hands are black.", "É, tenho que ir. Minhas mãos estão pretas."]
teach:
  - note: ["'Си' says 'for myself': си купив велосипед — I bought myself a bike. 'Се' says the action goes back to you: се мијам — I wash (myself).", "'Си' diz 'para mim': си купив велосипед — comprei uma bicicleta (para mim). 'Се' diz que a ação volta para você: се мијам — me lavo."]
  - ask: ["Say: I bought a bike.", "Diga: comprei uma bicicleta.", "Си купив велосипед.", si-kupiv, velosiped]
  - ask: ["Say: second-hand.", "Diga: usada.", "Половен.", poloven]
  - ask: ["Say: the tyre is flat.", "Diga: o pneu está furado.", "Гумата е дупната.", gumata, dupnata]
  - ask: ["Say: by myself.", "Diga: sozinho.", "Сам.", sam]
  - ask: ["Marko offers help. How?", "O Marko oferece ajuda. Como?", "Ќе ти помогнам.", ke-ti-pomognam]
  - ask: ["Say for him: I have tools.", "Diga por ele: tenho ferramenta.", "Имам алат.", imam, alat]
  - ask: ["Say: done!", "Diga: pronto!", "Готово!", gotovo]
  - ask: ["Say: you're very dirty.", "Diga: você está muito sujo.", "Многу си валкан.", valkan]
  - ask: ["Marko: go and wash! How?", "O Marko: vai se lavar! Como?", "Измиј се!", izmij-se]
  - ask: ["Say: yes, I must.", "Diga: é, tenho que ir.", "Да, мора.", mora]
  - ask: ["Say: my hands are black.", "Diga: minhas mãos estão pretas.", "Рацете ми се црни.", racete]
