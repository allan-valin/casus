id: B2-13
protagonist: f
title: ["Deadlines", "Prazos"]
situation: ["The release was due Friday. It is Monday.", "A entrega era sexta. Hoje é segunda."]
learn: [b2-perfective-imperfect]
culture: Relaxed deadlines, strict bosses
items:
  - [rokot, "рокот", "the deadline", "o prazo"]
  - [ni-pomina, "ни помина", "passed us by, we missed", "passou / perdemos"]
  - [docnime, "доцниме", "we're late", "estamos atrasados"]
  - [zavrsuvame, "завршуваме", "we're finishing", "estamos terminando"]
  - [ke-zavrsime, "ќе завршиме", "we'll finish (completely)", "vamos terminar"]
  - [najdocna, "најдоцна", "at the latest", "no máximo"]
  - [vetuvaj, "Ветувај!", "Promise! (informal)", "Promete!"]
  - [klientot-ceka, "клиентот чека", "the client is waiting", "o cliente está esperando"]
  - [polno-raboti, "полно работи", "loads of things", "um monte de coisas"]
  - [se-slucija, "се случија", "happened (plural)", "aconteceram"]
dialogue:
  - [nikolovski, "Рокот беше во петок. Сега е понеделник.", "The deadline was Friday. It's now Monday.", "O prazo era sexta. Agora é segunda."]
  - [protagonist, "Знам, доцниме. Се случија полно работи.", "I know, we're late. Loads of things happened.", "Eu sei, estamos atrasados. Aconteceu um monte de coisas."]
  - [nikolovski, "Клиентот чека. Кога ќе завршите?", "The client is waiting. When will you finish?", "O cliente está esperando. Quando vocês terminam?"]
  - [protagonist, "Завршуваме. Ќе завршиме најдоцна во среда.", "We're finishing. We'll be done by Wednesday at the latest.", "Estamos terminando. Terminamos no máximo na quarta."]
  - [nikolovski, "Во среда. Ветувате?", "Wednesday. Do you promise?", "Na quarta. Promete?"]
  - [protagonist, "Ветувам.", "I promise.", "Prometo."]
  - [darko, "Тој вели „среда“, ама мисли „вторник“.", "He says 'Wednesday', but he means 'Tuesday'.", "Ele diz 'quarta', mas quer dizer 'terça'."]
  - [protagonist, "Тогаш завршуваме во вторник!", "Then we finish on Tuesday!", "Então terminamos na terça!"]
teach:
  - ask: ["Say: the deadline was Friday.", "Diga: o prazo era sexta.", "Рокот беше во петок.", rokot]
  - ask: ["Say: we're late.", "Diga: estamos atrasados.", "Доцниме.", docnime]
  - ask: ["Say: loads of things happened.", "Diga: aconteceu um monte de coisas.", "Се случија полно работи.", se-slucija, polno-raboti]
  - ask: ["Say: the client is waiting.", "Diga: o cliente está esperando.", "Клиентот чека.", klientot-ceka]
  - note: ["Aspect at work: 'завршуваме' — we're finishing (in progress, no promise); 'ќе завршиме' — we'll finish (a promise of the result). Bosses listen for the second one.", "Aspecto no trabalho: 'завршуваме' — estamos terminando (em andamento, sem promessa); 'ќе завршиме' — vamos terminar (promessa do resultado). O chefe quer ouvir o segundo."]
  - ask: ["Say: we're finishing.", "Diga: estamos terminando.", "Завршуваме.", zavrsuvame]
  - ask: ["Say: we'll finish by Wednesday at the latest.", "Diga: terminamos no máximo na quarta.", "Ќе завршиме најдоцна во среда.", ke-zavrsime, najdocna]
  - ask: ["Say: I promise.", "Diga: prometo.", "Ветувам.", vetuvam]
  - ask: ["To a colleague: promise!", "Para um colega: promete!", "Ветувај!", vetuvaj]
  - ask: ["Say: we missed the deadline.", "Diga: perdemos o prazo.", "Рокот ни помина.", ni-pomina]
