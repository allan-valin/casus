id: A1-24
protagonist: m
title: [The sky, O céu]
situation: ["Night on Vodno, the mountain above Skopje, with Marko.", "Noite no Vodno, a montanha sobre Skopje, com o Marko."]
learn: [a1-adjectives]
culture: The Southern Cross and the time difference
items:
  - [pogledni, "Погледни!", "Look! (informal)", "Olha!"]
  - [se-gleda, "се гледа", "can be seen", "dá para ver"]
  - [nok, "ноќ", "night", "noite"]
  - [dzvezdi, "ѕвезди", "stars", "estrelas"]
  - [dzvezda, "ѕвезда", "star", "estrela"]
  - [planeta, "планета", "planet", "planeta", {rare: true}]
  - [mesecinata, "месечината", "the moon", "a lua"]
  - [ista, "иста", "the same (feminine)", "a mesma"]
  - [drugi, "други", "other / different (plural)", "outras / diferentes"]
  - [popladne, "попладне", "afternoon", "tarde"]
  - [sonce, "сонце", "sun", "sol"]
  - [navistina, "Навистина?", "Really?", "Sério?"]
dialogue:
  - [marko, "Погледни! Од Водно се гледа цело Скопје.", "Look! From Vodno you can see all of Skopje.", "Olha! Do Vodno dá para ver Skopje inteira."]
  - [protagonist, "Убава ноќ. Колку ѕвезди!", "A beautiful night. So many stars!", "Que noite bonita. Quantas estrelas!"]
  - [marko, "А таму, онаа светла ѕвезда?", "And there, that bright star?", "E ali, aquela estrela brilhante?"]
  - [protagonist, "Тоа не е ѕвезда, тоа е планета.", "That's not a star, that's a planet.", "Aquilo não é estrela, é um planeta."]
  - [marko, "Месечината е голема денеска.", "The moon is big tonight.", "A lua está grande hoje."]
  - [protagonist, "Во Бразил месечината е иста, но ѕвездите се други.", "In Brazil the moon is the same, but the stars are different.", "No Brasil a lua é a mesma, mas as estrelas são outras."]
  - [marko, "Навистина?", "Really?", "Sério?"]
  - [protagonist, "Да. И сега таму е попладне. Има сонце.", "Yes. And now it's afternoon there. The sun is out.", "Sim. E agora lá é de tarde. Está de sol."]
teach:
  - ask: ["Tell Marko to look!", "Diga ao Marko para olhar!", "Погледни!", pogledni]
  - ask: ["Say: from here you can see all of Skopje.", "Diga: daqui dá para ver Skopje inteira.", "Од тука се гледа цело Скопје.", od, se-gleda]
  - ask: ["Say: a beautiful night.", "Diga: que noite bonita.", "Убава ноќ.", ubava, nok]
  - ask: ["Say: so many stars!", "Diga: quantas estrelas!", "Колку ѕвезди!", dzvezdi]
  - note: ["'ѕ' sounds like 'dz': ѕвезда. One of the letters only Macedonian has.", "'ѕ' soa como 'dz': ѕвезда. Uma das letras que só o macedônio tem."]
  - ask: ["Say: that's not a star, it's a planet.", "Diga: aquilo não é estrela, é um planeta.", "Тоа не е ѕвезда, тоа е планета.", dzvezda, planeta]
  - ask: ["Say: the moon is big.", "Diga: a lua está grande.", "Месечината е голема.", mesecinata, golema]
  - ask: ["Say: the moon is the same.", "Diga: a lua é a mesma.", "Месечината е иста.", mesecinata, ista]
  - ask: ["Say: but the stars are different.", "Diga: mas as estrelas são outras.", "Но ѕвездите се други.", no-but, drugi]
  - ask: ["Marko is surprised. How?", "O Marko se surpreende. Como?", "Навистина?", navistina]
  - note: ["Skopje is four or five hours ahead of Brasília, so a late evening call home finds Brazil in the afternoon. And south of the equator the sky shows other stars, such as the Southern Cross.", "Skopje está quatro ou cinco horas à frente de Brasília: uma ligação à noite encontra o Brasil à tarde. E ao sul do equador o céu mostra outras estrelas, como o Cruzeiro do Sul."]
  - ask: ["Say: now it's afternoon there.", "Diga: agora lá é de tarde.", "Сега таму е попладне.", sega, popladne]
  - ask: ["Say: the sun is out. (there is sun)", "Diga: está de sol.", "Има сонце.", sonce]
