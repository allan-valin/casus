id: C2-26
protagonist: m
title: ["A poem", "Um poema"]
situation: ["The evening course's last-year reunion: everyone reads a poem aloud. You chose Koneski.", "Reencontro do curso noturno: cada um lê um poema em voz alta. Você escolheu Koneski."]
learn: [c2-set-phrases]
culture: —
items:
  - [na-glas, "на глас", "aloud", "em voz alta"]
  - [rima, "рима", "rhyme", "rima"]
  - [stihovite, "стиховите", "the lines (of verse)", "os versos"]
  - [me-pogodi, "ме погоди", "struck me", "me atingiu"]
  - [na-moj-nacin, "на мој начин", "in my way", "do meu jeito"]
  - [akcentot-ti-e, "акцентот ти е", "your stress is", "seu acento está"]
  - [vo-red-e, "во ред е", "it's all right", "está bom"]
  - [poezijata-ne-se-preveduva, "поезијата не се преведува", "poetry can't be translated", "poesia não se traduz"]
  - [se-pretskazuva, "се препева", "is recreated (in translation)", "se recria (na tradução)", {rare: true}]
  - [mojot-omilen, "мојот омилен", "my favourite", "o meu favorito"]
dialogue:
  - [profesorka, "Повелете, прочитајте на глас.", "Please, read aloud.", "Por favor, leia em voz alta."]
  - [protagonist, "Избрав Конески. Овие стихови ме погодија најмногу.", "I chose Koneski. These lines struck me the most.", "Escolhi Koneski. Estes versos me atingiram mais."]
  - [profesorka, "Зошто?", "Why?", "Por quê?"]
  - [protagonist, "Зборува за јазикот како за дом. Тоа и јас го чувствувам, на мој начин.", "He speaks of the language as a home. I feel that too, in my way.", "Ele fala da língua como de uma casa. Eu sinto isso também, do meu jeito."]
  - [profesorka, "Акцентот ти е убав. Само римата — внимавај на крајот на стихот.", "Your stress is lovely. Only the rhyme — watch the end of the line.", "Seu acento está bonito. Só a rima — cuidado com o fim do verso."]
  - [protagonist, "Би сакал да го преведам на португалски.", "I'd like to translate it into Portuguese.", "Gostaria de traduzir para o português."]
  - [profesorka, "Поезијата не се преведува — се препева.", "Poetry isn't translated — it's re-sung.", "Poesia não se traduz — se recria."]
  - [protagonist, "Тогаш ќе го препеам. Тоа е мојот омилен.", "Then I'll re-sing it. It's my favourite.", "Então vou recriar. É o meu favorito."]
teach:
  - ask: ["She says: please, read aloud.", "Ela diz: por favor, leia em voz alta.", "Прочитајте на глас.", na-glas]
  - ask: ["Say: these lines struck me the most.", "Diga: estes versos me atingiram mais.", "Овие стихови ме погодија најмногу.", stihovite, me-pogodi]
  - ask: ["Say: in my way.", "Diga: do meu jeito.", "На мој начин.", na-moj-nacin]
  - ask: ["She says: your stress is lovely.", "Ela diz: seu acento está bonito.", "Акцентот ти е убав.", akcentot-ti-e]
  - ask: ["Say: the rhyme.", "Diga: a rima.", "Римата.", rima]
  - ask: ["Say: poetry can't be translated.", "Diga: poesia não se traduz.", "Поезијата не се преведува.", poezijata-ne-se-preveduva]
  - ask: ["Say: it's re-sung (recreated).", "Diga: se recria.", "Се препева.", se-pretskazuva]
  - ask: ["Say: it's my favourite.", "Diga: é o meu favorito.", "Тоа е мојот омилен.", mojot-omilen]
  - ask: ["Say: it's all right.", "Diga: está bom.", "Во ред е.", vo-red-e]
  - note: ["Macedonian has a word for translating poetry: препева — to 're-sing' it, recreating rhythm and rhyme rather than words. Koneski himself re-sang Shakespeare and Heine into Macedonian.", "O macedônio tem uma palavra para traduzir poesia: препева — 'recantar', recriando ritmo e rima em vez das palavras. O próprio Koneski recriou Shakespeare e Heine em macedônio."]
