id: A2-27
protagonist: f
title: ["Proverbs", "Provérbios"]
situation: ["You leave for work at seven. Mrs Stojanovska is already sweeping the stairs.", "Você sai para o trabalho às sete. A senhora Stojanovska já está varrendo a escada."]
learn: [a2-long-pronouns]
culture: Proverbs that Portuguese also has
items:
  - [rano, "рано", "early", "cedo"]
  - [velese, "велеше", "(she) used to say", "dizia"]
  - [mene, "мене", "me (stressed)", "mim / eu"]
  - [sto-znaci, "Што значи…?", "What does … mean?", "O que significa…?"]
  - [stanes, "станеш", "(you) get up", "(você) levanta"]
  - [srekja, "среќа", "luck, happiness", "sorte / felicidade"]
  - [kaj-nas, "кај нас", "where we come from, at our place", "lá na nossa terra / com a gente"]
  - [velat, "велат", "(they) say", "dizem"]
  - [isto, "исто", "the same", "igual / o mesmo"]
  - [tivka, "тивка", "quiet (feminine)", "quieta / mansa"]
  - [nego, "него", "him (stressed)", "ele"]
dialogue:
  - [vera, "Добро утро! Рано станувате.", "Good morning! You get up early.", "Bom dia! A senhora acorda cedo."]
  - [protagonist, "Добро утро. И вие!", "Good morning. So do you!", "Bom dia. A senhora também!"]
  - [vera, "Мене мајка ми ми велеше: „Кој рано рани, две среќи граби.“", "My mother used to tell me: 'Who rises early grabs two lucks.'", "Minha mãe me dizia: 'Quem cedo madruga agarra duas sortes.'"]
  - [protagonist, "Што значи тоа?", "What does that mean?", "O que significa isso?"]
  - [vera, "Ако станеш рано, имаш повеќе среќа.", "If you get up early, you have more luck.", "Se você acorda cedo, tem mais sorte."]
  - [protagonist, "Кај нас велат: „Бог му помага на тој што рано станува.“", "Where I come from they say: 'God helps the one who gets up early.'", "Lá na minha terra dizem: 'Deus ajuda quem cedo madruga.'"]
  - [vera, "Исто! А „Тивка вода брег рони“?", "The same! And 'Quiet water wears away the bank'?", "Igual! E 'Água mansa rói a margem'?"]
  - [protagonist, "Тоа и кај нас: „Од тивка вода, чувај се.“", "We have that too: 'Beware of quiet water.'", "Esse a gente também tem: 'Cuidado com água parada.'"]
  - [vera, "Како Марко — тивок е, ама него ништо не му бега!", "Like Marko — he's quiet, but nothing gets past him!", "Que nem o Marko — é quieto, mas nada escapa dele!"]
teach:
  - ask: ["Say: you get up early. (formal)", "Diga: a senhora acorda cedo.", "Рано станувате.", rano]
  - note: ["Stressed pronouns — мене, тебе, него, неа, нас, вас, нив — come with the short ones for emphasis: 'Мене мајка ми ми велеше' — to ME my mother used to say.", "Os pronomes enfáticos — мене, тебе, него, неа, нас, вас, нив — vêm junto com os curtos para dar ênfase: 'Мене мајка ми ми велеше' — a MIM minha mãe dizia."]
  - ask: ["Say: my mother used to tell me.", "Diga: minha mãe me dizia.", "Мене мајка ми ми велеше.", mene, velese]
  - ask: ["Ask what that means.", "Pergunte o que significa isso.", "Што значи тоа?", sto-znaci]
  - ask: ["Say: if you get up early.", "Diga: se você acorda cedo.", "Ако станеш рано.", stanes, rano]
  - ask: ["Say: you have more luck.", "Diga: você tem mais sorte.", "Имаш повеќе среќа.", povekje, srekja]
  - ask: ["Say: where I come from they say…", "Diga: lá na minha terra dizem…", "Кај нас велат…", kaj-nas, velat]
  - ask: ["Say: the same!", "Diga: igual!", "Исто!", isto]
  - ask: ["Say: quiet water.", "Diga: água mansa.", "Тивка вода.", tivka, voda]
  - ask: ["Say: nothing gets past him. (just: him)", "Diga: ele (enfático).", "Него.", nego]
  - note: ["'Кој рано рани, две среќи граби' — who rises early grabs two lucks. 'Тивка вода брег рони' — quiet water wears the bank away: beware of quiet people.", "'Кој рано рани, две среќи граби' — quem cedo madruga agarra duas sortes. 'Тивка вода брег рони' — água mansa rói a margem: cuidado com gente quieta."]
