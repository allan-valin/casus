id: A1-07
protagonist: f
title: [Coffee at her place, Um café na casa dela]
situation: ["Mrs Stojanovska invites you down for coffee. You are in a hurry.", "A senhora Stojanovska convida você para um café. Você está com pressa."]
learn: [a1-pres-a]
culture: Refusing coffee seems cold
items:
  - [sednete, "Седнете", "Sit down (formal)", "Sente-se (formal)"]
  - [kafe, "кафе", "coffee", "café"]
  - [caj, "чај", "tea", "chá", {rare: true}]
  - [sakate-li, "Сакате ли…?", "Would you like…? (formal)", "A senhora quer…? (formal)"]
  - [sakam, "сакам", "I want / I like", "eu quero / eu gosto"]
  - [ne-sakam, "не сакам", "I don't want", "eu não quero"]
  - [so, "со", "with", "com"]
  - [bez, "без", "without", "sem"]
  - [secer, "шеќер", "sugar", "açúcar", {rare: true}]
  - [turski, "турско кафе", "Turkish coffee", "café turco", {rare: true}]
  - [vkusno, "вкусно", "tasty", "gostoso", {rare: true}]
  - [brzam, "Брзам", "I'm in a hurry", "Estou com pressa", {rare: true}]
  - [samo-edno, "само едно", "just one", "só um"]
  - [vreme, "време", "time", "tempo"]
dialogue:
  - [vera, "Повелете, влезете. Седнете!", "Please, come in. Sit down!", "Por favor, entre. Sente-se!"]
  - [protagonist, "Благодарам многу, госпоѓо.", "Thank you very much.", "Muito obrigada, senhora."]
  - [vera, "Сакате ли кафе или чај?", "Would you like coffee or tea?", "A senhora quer café ou chá?"]
  - [protagonist, "Извинете, брзам.", "Sorry, I'm in a hurry.", "Desculpe, estou com pressa."]
  - [vera, "Само едно кафе! Турско кафе.", "Just one coffee! Turkish coffee.", "Só um café! Café turco."]
  - [protagonist, "Добро, само едно. Без шеќер, ве молам.", "All right, just one. Without sugar, please.", "Está bem, só um. Sem açúcar, por favor."]
  - [vera, "Без шеќер? Јас сакам со шеќер.", "Without sugar? I like it with sugar.", "Sem açúcar? Eu gosto com açúcar."]
  - [protagonist, "Мммм, многу е вкусно!", "Mmm, it's very tasty!", "Hum, está muito gostoso!"]
  - [vera, "Седнете, имаме време.", "Sit down, we have time.", "Sente-se, temos tempo."]
teach:
  - note: ["A visit means coffee, and coffee means time. Saying no because you are in a hurry seems cold — accept one, even a small one.", "Visita é café, e café é tempo. Recusar porque está com pressa parece frio — aceite um, nem que seja pequeno."]
  - pt_only: "No Brasil o cafezinho é rápido, em pé. Aqui um café em casa dura uma ou duas horas."
  - ask: ["She invites you to sit. How did she say it?", "Ela convida você a sentar. Como ela disse?", "Седнете!", sednete]
  - ask: ["Ask her, politely: would you like coffee?", "Pergunte com educação: a senhora quer café?", "Сакате ли кафе?", sakate-li, kafe]
  - ask: ["Now: would you like tea?", "Agora: a senhora quer chá?", "Сакате ли чај?", sakate-li, caj]
  - ask: ["Say you're in a hurry, sorry.", "Diga que está com pressa, desculpe.", "Извинете, брзам.", izvinete, brzam]
  - ask: ["She insists: just one coffee. Accept: all right, just one.", "Ela insiste: só um café. Aceite: está bem, só um.", "Добро, само едно.", dobro, samo-edno]
  - note: ["'Со' is with, 'без' is without: 'со шеќер', 'без шеќер'.", "'Со' é com, 'без' é sem: 'со шеќер' (com açúcar), 'без шеќер' (sem açúcar)."]
  - ask: ["Ask for it without sugar, please.", "Peça sem açúcar, por favor.", "Без шеќер, ве молам.", bez, secer, ve-molam]
  - ask: ["Say: I like it with sugar.", "Diga: eu gosto com açúcar.", "Сакам со шеќер.", sakam, so, secer]
  - ask: ["Say: I don't want sugar.", "Diga: não quero açúcar.", "Не сакам шеќер.", ne-sakam, secer]
  - ask: ["Taste it and say it's very tasty.", "Prove e diga que está muito gostoso.", "Многу е вкусно!", vkusno]
  - ask: ["Ask for a Turkish coffee.", "Peça um café turco.", "Турско кафе, ве молам.", turski]
  - ask: ["She says: sit down, we have time. Say it.", "Ela diz: sente-se, temos tempo. Diga.", "Седнете, имаме време.", sednete, imame, vreme]
