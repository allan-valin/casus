id: B2-24
protagonist: m
title: ["Why the young leave", "Por que os jovens saem"]
situation: ["Goran has a job offer in Munich. A long night at the кафана.", "O Goran recebeu uma oferta de emprego em Munique. Uma noite longa na кафана."]
learn: [b2-personal-numerals]
culture: Brain drain
items:
  - [iseluvanje, "иселување", "emigration", "emigração", {rare: true}]
  - [perspektiva, "перспектива", "prospects", "perspectiva"]
  - [tri-pati-pogolema, "три пати поголема", "three times bigger", "três vezes maior"]
  - [od-moeto-drustvo, "од моето друштво", "from my group of friends", "da minha turma"]
  - [cetvorica, "четворица", "four (men / people)", "quatro (pessoas)"]
  - [veke-zaminaa, "веќе заминаа", "have already left", "já foram embora"]
  - [nema-koj, "нема кој да", "there's nobody to", "não tem quem"]
  - [korupcija, "корупција", "corruption", "corrupção", {rare: true}]
  - [sistemot, "системот", "the system", "o sistema"]
  - [ke-se-vratam, "ќе се вратам", "I'll come back", "vou voltar"]
dialogue:
  - [goran, "Ми понудија работа во Минхен. Платата е три пати поголема.", "They offered me a job in Munich. The salary is three times bigger.", "Me ofereceram um emprego em Munique. O salário é três vezes maior."]
  - [protagonist, "Ќе заминеш?", "Will you go?", "Você vai?"]
  - [goran, "Од моето друштво, четворица веќе заминаа.", "From my group of friends, four have already left.", "Da minha turma, quatro já foram embora."]
  - [protagonist, "Само за парите?", "Just for the money?", "Só pelo dinheiro?"]
  - [goran, "Не само. Перспектива, системот, корупцијата... Тука нема кој да те слуша.", "Not only. Prospects, the system, corruption... Here there's nobody to listen to you.", "Não só. Perspectiva, o sistema, a corrupção... Aqui não tem quem te ouça."]
  - [protagonist, "А јас дојдов тука од Бразил. Иселувањето оди во двата правци.", "And I came here from Brazil. Emigration goes both ways.", "E eu vim do Brasil para cá. A emigração vai nos dois sentidos."]
  - [goran, "Ти си исклучок! Можеби ќе се вратам за пет години.", "You're the exception! Maybe I'll come back in five years.", "Você é a exceção! Talvez eu volte daqui a cinco anos."]
  - [protagonist, "Сите велат така.", "Everyone says that.", "Todo mundo diz isso."]
teach:
  - ask: ["Say: the salary is three times bigger.", "Diga: o salário é três vezes maior.", "Платата е три пати поголема.", tri-pati-pogolema]
  - ask: ["Ask: will you go?", "Pergunte: você vai?", "Ќе заминеш?", kje-zaminat]
  - ask: ["Say: from my group of friends…", "Diga: da minha turma…", "Од моето друштво…", od-moeto-drustvo]
  - ask: ["Say: four have already left.", "Diga: quatro já foram embora.", "Четворица веќе заминаа.", cetvorica, veke-zaminaa]
  - ask: ["Say: prospects.", "Diga: perspectiva.", "Перспектива.", perspektiva]
  - ask: ["Say: the system, corruption.", "Diga: o sistema, a corrupção.", "Системот, корупцијата.", sistemot, korupcija]
  - ask: ["Say: there's nobody to listen to you.", "Diga: não tem quem te ouça.", "Нема кој да те слуша.", nema-koj]
  - ask: ["Say: emigration goes both ways.", "Diga: a emigração vai nos dois sentidos.", "Иселувањето оди во двата правци.", iseluvanje]
  - ask: ["Goran: maybe I'll come back.", "O Goran: talvez eu volte.", "Можеби ќе се вратам.", ke-se-vratam]
  - note: ["Hundreds of thousands of Macedonians live abroad, and the population fell between the 2002 and 2021 censuses. People name salaries, but also trust in institutions. Many say they will return; fewer do.", "Centenas de milhares de macedônios vivem fora, e a população caiu entre os censos de 2002 e 2021. As pessoas citam os salários, mas também a confiança nas instituições. Muitos dizem que vão voltar; menos voltam."]
