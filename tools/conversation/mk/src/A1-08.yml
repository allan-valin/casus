id: A1-08
protagonist: m
title: [The way, O caminho]
situation: ["Your first day at work. You ask a woman in the street the way to Macedonia Street.", "Seu primeiro dia de trabalho. Você pergunta a uma mulher na rua o caminho para a rua Macedônia."]
learn: [a1-prepositions]
culture: Directions given with landmarks
items:
  - [ulica, "улица", "street", "rua"]
  - [odete, "Одете", "Go (formal)", "Vá (formal)"]
  - [pravo, "право", "straight on", "em frente"]
  - [pa, "па", "then", "depois / e então"]
  - [levo, "лево", "(to the) left", "à esquerda"]
  - [desno, "десно", "(to the) right", "à direita"]
  - [daleku, "далеку", "far", "longe"]
  - [blizu, "близу", "near", "perto"]
  - [pet, "пет", "five", "cinco"]
  - [minuti, "минути", "minutes", "minutos"]
  - [peski, "пешки", "on foot", "a pé", {rare: true}]
  - [stanicata, "станицата", "the (bus) stop", "o ponto (de ônibus)"]
  - [do, "до", "next to / to", "ao lado de / até"]
dialogue:
  - [protagonist, "Извинете, каде е улица Македонија?", "Excuse me, where is Macedonia Street?", "Com licença, onde fica a rua Macedônia?"]
  - [passerby, "Одете право, па лево.", "Go straight on, then left.", "Vá em frente, depois à esquerda."]
  - [protagonist, "Далеку е?", "Is it far?", "É longe?"]
  - [passerby, "Не, близу е. Пет минути пешки.", "No, it's near. Five minutes on foot.", "Não, é perto. Cinco minutos a pé."]
  - [protagonist, "А автобуската станица?", "And the bus stop?", "E o ponto de ônibus?"]
  - [passerby, "Станицата е десно, до аптеката.", "The stop is on the right, next to the pharmacy.", "O ponto fica à direita, ao lado da farmácia."]
  - [protagonist, "Право, па лево. Благодарам!", "Straight on, then left. Thank you!", "Em frente, depois à esquerda. Obrigado!"]
  - [passerby, "Нема зошто. Добар ден!", "You're welcome. Good day!", "De nada. Bom dia!"]
teach:
  - note: ["To ask the way: 'Каде е …?' and the place. Streets are named: 'улица Македонија'.", "Para perguntar o caminho: 'Каде е …?' e o lugar. As ruas têm nome: 'улица Македонија' (rua Macedônia)."]
  - ask: ["Ask where Macedonia Street is.", "Pergunte onde fica a rua Macedônia.", "Каде е улица Македонија?", kade-e, ulica]
  - line: [passerby, odete]
  - ask: ["She says: go straight on. How?", "Ela diz: vá em frente. Como?", "Одете право.", odete, pravo]
  - ask: ["Now: straight on, then left.", "Agora: em frente, depois à esquerda.", "Право, па лево.", pravo, pa, levo]
  - ask: ["Say: to the right.", "Diga: à direita.", "Десно.", desno]
  - ask: ["Ask: is it far?", "Pergunte: é longe?", "Далеку е?", daleku]
  - ask: ["Answer for her: no, it's near.", "Responda por ela: não, é perto.", "Не, близу е.", blizu]
  - build: [minuti, ["-нути", "минути"]]
  - ask: ["Say: five minutes on foot.", "Diga: cinco minutos a pé.", "Пет минути пешки.", pet, minuti, peski]
  - note: ["'До' is 'next to': 'до аптеката', next to the pharmacy.", "'До' é 'ao lado de': 'до аптеката', ao lado da farmácia."]
  - ask: ["Say: the stop is next to the pharmacy.", "Diga: o ponto fica ao lado da farmácia.", "Станицата е до аптеката.", stanicata, do, apteka]
  - ask: ["Ask where the bus stop is.", "Pergunte onde fica o ponto.", "Каде е станицата?", kade-e, stanicata]
  - ask: ["Repeat the way to yourself: straight on, then right.", "Repita o caminho: em frente, depois à direita.", "Право, па десно.", pravo, pa, desno]
