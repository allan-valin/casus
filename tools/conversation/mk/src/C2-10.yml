id: C2-10
protagonist: m
title: ["Proverbs at work", "Provérbios no trabalho"]
situation: ["A bad week at Vardar Soft. Everyone has a proverb ready.", "Uma semana ruim na Vardar Soft. Todo mundo tem um provérbio pronto."]
learn: [c2-set-phrases]
culture: —
items:
  - [brzata-kucka, "Брзата кучка слепи ги раѓа", "Haste makes waste (the hasty bitch has blind pups)", "A pressa é inimiga da perfeição", {rare: true}]
  - [koj-ne-raboti, "Кој не работи, не треба да јаде", "Who doesn't work shouldn't eat", "Quem não trabalha não come"]
  - [utroto-e-pomudro, "Утрото е помудро од вечерта", "Sleep on it (morning is wiser than evening)", "A noite é boa conselheira"]
  - [tivka-voda, "Тивка вода брег рони", "Still waters run deep", "Água mole em pedra dura..."]
  - [poleka-se-stiga, "Полека се стига далеку", "Slow and steady goes far", "Devagar se vai ao longe"]
  - [bez-maka, "Без мака нема наука", "No pain, no gain (no toil, no learning)", "Sem esforço não se aprende"]
  - [se-ispravija, "се исправија", "were put right", "foram corrigidos"]
  - [na-vreme-recen, "навреме речено", "said at the right time", "dito na hora certa"]
  - [ima-pogovorka, "има поговорка", "there's a saying", "tem um ditado"]
  - [za-sekoja-situacija, "за секоја ситуација", "for every situation", "para cada situação"]
dialogue:
  - [darko, "Го пуштивме апдејтот за еден ден. Сѐ се скрши!", "We pushed the update out in one day. Everything broke!", "Soltamos a atualização em um dia. Quebrou tudo!"]
  - [nikolovski, "Брзата кучка слепи ги раѓа.", "Haste makes waste.", "A pressa é inimiga da perfeição."]
  - [protagonist, "Има поговорка за секоја ситуација!", "There's a saying for every situation!", "Tem um ditado para cada situação!"]
  - [ana, "Ајде да го поправиме вечерва?", "Shall we fix it tonight?", "Vamos consertar hoje à noite?"]
  - [protagonist, "Не. Утрото е помудро од вечерта. Утре, одморни.", "No. Sleep on it. Tomorrow, rested.", "Não. A noite é boa conselheira. Amanhã, descansados."]
  - [nikolovski, "Навреме речено.", "Well said, and at the right time.", "Dito na hora certa."]
  - [ana, "А Дарко, кој цела ноќ не спиеше?", "And Darko, who didn't sleep all night?", "E o Darko, que não dormiu a noite toda?"]
  - [protagonist, "Тивка вода брег рони — тој најмногу работеше. Утре сѐ се исправи.", "Still waters run deep — he worked the most. Tomorrow everything got fixed.", "Quem fica quieto trabalha — ele foi quem mais trabalhou. No dia seguinte tudo foi corrigido."]
teach:
  - ask: ["Mr Nikolovski: haste makes waste.", "O sr. Nikolovski: a pressa é inimiga da perfeição.", "Брзата кучка слепи ги раѓа.", brzata-kucka]
  - ask: ["Say: there's a saying for every situation.", "Diga: tem um ditado para cada situação.", "Има поговорка за секоја ситуација.", ima-pogovorka, za-sekoja-situacija]
  - ask: ["Say: sleep on it.", "Diga: a noite é boa conselheira.", "Утрото е помудро од вечерта.", utroto-e-pomudro]
  - ask: ["Say: said at the right time.", "Diga: dito na hora certa.", "Навреме речено.", na-vreme-recen]
  - ask: ["Say: still waters run deep.", "Diga: quem fica quieto trabalha.", "Тивка вода брег рони.", tivka-voda]
  - ask: ["Say: who doesn't work shouldn't eat.", "Diga: quem não trabalha não come.", "Кој не работи, не треба да јаде.", koj-ne-raboti]
  - ask: ["Say: everything was put right.", "Diga: tudo foi corrigido.", "Сѐ се исправи.", se-ispravija]
  - ask: ["Encourage Ana: slow and steady goes far.", "Anime a Ana: devagar se vai ao longe.", "Полека се стига далеку.", poleka-se-stiga]
  - ask: ["And: no pain, no gain.", "E: sem esforço não se aprende.", "Без мака нема наука.", bez-maka]
  - note: ["A proverb said at the right moment ('навреме речено') carries more weight than a long argument — older colleagues especially use them to close a discussion.", "Um provérbio dito na hora certa ('навреме речено') pesa mais que um argumento longo — colegas mais velhos usam para encerrar uma discussão."]
  - pt_only: "Muitos têm par em português: 'A pressa é inimiga da perfeição', 'A noite é boa conselheira'. Os bichos mudam, a sabedoria é a mesma."
