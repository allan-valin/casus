id: A1-30
protagonist: m
title: [Sport and the body, Esporte e o corpo]
situation: ["Marko invites you to basketball, then a beer. Everything from A1 comes back.", "O Marko chama você para jogar basquete, e depois uma cerveja. Tudo do A1 volta."]
learn: []
culture: Basketball, the other national sport
items:
  - [igras-li, "Играш ли…?", "Do you play…? (informal)", "Você joga…?"]
  - [kosarka, "кошарка", "basketball", "basquete", {rare: true}]
  - [igram, "играм", "I play", "eu jogo"]
  - [fudbal, "фудбал", "football (soccer)", "futebol"]
  - [ajde, "Ајде!", "Come on! / Let's go!", "Vamos! / Bora!"]
  - [trcaj, "Трчај!", "Run! (informal)", "Corre!"]
  - [skokni, "Скокни!", "Jump! (informal)", "Pula!", {rare: true}]
  - [visok, "висок", "tall (masculine)", "alto"]
  - [brz, "брз", "fast (masculine)", "rápido"]
  - [silen, "силен", "strong (masculine)", "forte"]
  - [pivo, "пиво", "beer", "cerveja"]
dialogue:
  - [marko, "Играш ли кошарка?", "Do you play basketball?", "Você joga basquete?"]
  - [protagonist, "Малку. Во Бразил играм фудбал.", "A little. In Brazil I play football.", "Um pouco. No Brasil eu jogo futebol."]
  - [marko, "Фудбал, секако! Ајде, играме!", "Football, of course! Come on, let's play!", "Futebol, claro! Bora, vamos jogar!"]
  - [marko, "Трчај! Скокни!", "Run! Jump!", "Corre! Pula!"]
  - [protagonist, "Не можам, ти си многу висок!", "I can't, you're very tall!", "Não dá, você é muito alto!"]
  - [marko, "А ти си брз и силен.", "And you're fast and strong.", "E você é rápido e forte."]
  - [protagonist, "Уф, ме боли ногата.", "Ugh, my leg hurts.", "Ai, minha perna dói."]
  - [marko, "Доста е. Пиво?", "That's enough. A beer?", "Chega. Uma cerveja?"]
  - [protagonist, "Може! Ајде!", "Sure! Let's go!", "Pode ser! Bora!"]
teach:
  - note: ["Basketball is huge here — every school yard has a hoop, and the national team is a source of pride.", "O basquete é enorme aqui — todo pátio de escola tem cesta, e a seleção é motivo de orgulho."]
  - ask: ["Ask Marko if he plays basketball.", "Pergunte ao Marko se ele joga basquete.", "Играш ли кошарка?", igras-li, kosarka]
  - ask: ["Say: a little. I play football.", "Diga: um pouco. Eu jogo futebol.", "Малку. Играм фудбал.", malku, igram, fudbal]
  - ask: ["Say: come on, let's play!", "Diga: bora, vamos jogar!", "Ајде, играме!", ajde]
  - ask: ["Shout: run!", "Grite: corre!", "Трчај!", trcaj]
  - ask: ["Shout: jump!", "Grite: pula!", "Скокни!", skokni]
  - note: ["Adjectives for a man end in a consonant: висок, брз, силен. For a woman they add -а: висока, брза, силна.", "Adjetivos para homem terminam em consoante: висок, брз, силен. Para mulher ganham -а: висока, брза, силна."]
  - ask: ["Say: you're very tall!", "Diga: você é muito alto!", "Ти си многу висок!", ti-si, visok]
  - ask: ["Say for him: you're fast and strong.", "Diga por ele: você é rápido e forte.", "Ти си брз и силен.", brz, silen]
  - ask: ["Your leg hurts. Say it.", "Sua perna dói. Diga.", "Ме боли ногата.", me-boli, nogata]
  - ask: ["Say you can't.", "Diga que não dá.", "Не можам.", ne-mozam]
  - ask: ["Marko offers a beer. Accept: sure!", "O Marko oferece uma cerveja. Aceite: pode ser!", "Пиво? Може!", pivo, moze]
  - note: ["End of A1. Some more from the whole level.", "Fim do A1. Mais um pouco de todo o nível."]
  - ask: ["At Dragan's: one bread and two milks, please.", "No Dragan: um pão e dois leites, por favor.", "Еден леб и две млека, ве молам.", eden, leb, dve, mleko, ve-molam]
  - ask: ["Ask a passer-by where the stop is.", "Pergunte a um passante onde fica o ponto.", "Извинете, каде е станицата?", izvinete, kade-e, stanicata]
  - ask: ["Tell Ana: see you on Monday!", "Diga à Ana: até segunda!", "Се гледаме во понеделник!", se-gledame, ponedelnik]
