id: B2-19
protagonist: f
title: ["The presentation", "A apresentação"]
situation: ["You present the project to the whole company — in Macedonian.", "Você apresenta o projeto para a empresa inteira — em macedônio."]
learn: [b2-prefixes]
culture: —
items:
  - [da-pocnam-so, "да почнам со", "let me start with", "começo com"]
  - [celta, "целта", "the goal", "o objetivo"]
  - [rezultati, "резултати", "results", "resultados"]
  - [podobrivme, "подобривме", "we improved", "melhoramos"]
  - [namalivme, "намаливме", "we reduced", "reduzimos"]
  - [zgolemivme, "зголемивме", "we increased", "aumentamos"]
  - [za-dvaeset-procenti, "за дваесет проценти", "by twenty per cent", "em vinte por cento"]
  - [na-krajot-sakam, "на крајот сакам", "finally I'd like", "por fim quero"]
  - [da-mu-se-zablagodaram, "да му се заблагодарам", "to thank him", "agradecer a ele"]
  - [prasanja, "прашања", "questions", "perguntas"]
dialogue:
  - [protagonist, "Добар ден на сите. Да почнам со целта на проектот.", "Good afternoon, everyone. Let me start with the project's goal.", "Boa tarde a todos. Começo com o objetivo do projeto."]
  - [protagonist, "Целта беше побрза апликација.", "The goal was a faster app.", "O objetivo era um aplicativo mais rápido."]
  - [protagonist, "Резултати: ја подобривме брзината и ги намаливме грешките.", "Results: we improved the speed and reduced the bugs.", "Resultados: melhoramos a velocidade e reduzimos os erros."]
  - [protagonist, "Корисниците ги зголемивме за дваесет проценти.", "We increased the users by twenty per cent.", "Aumentamos os usuários em vinte por cento."]
  - [protagonist, "На крајот сакам да му се заблагодарам на тимот — и на Дарко.", "Finally I'd like to thank the team — and Darko.", "Por fim quero agradecer à equipe — e ao Darko."]
  - [nikolovski, "Браво. Прашања?", "Well done. Questions?", "Muito bem. Perguntas?"]
  - [darko, "Само една: кога следниот проект?", "Just one: when's the next project?", "Só uma: quando é o próximo projeto?"]
  - [protagonist, "Прво — кафенце!", "First — a little coffee!", "Primeiro — um cafezinho!"]
teach:
  - ask: ["Open: good afternoon, everyone.", "Abra: boa tarde a todos.", "Добар ден на сите.", site]
  - ask: ["Say: let me start with the goal.", "Diga: começo com o objetivo.", "Да почнам со целта.", da-pocnam-so, celta]
  - ask: ["Say: results.", "Diga: resultados.", "Резултати.", rezultati]
  - note: ["Prefixes from adjectives: подобар (better) → подобри (improve), мал → намали (reduce), голем → зголеми (increase). Past for 'we': подобривме, намаливме, зголемивме.", "Prefixos a partir de adjetivos: подобар (melhor) → подобри (melhorar), мал → намали (reduzir), голем → зголеми (aumentar). Passado de 'nós': подобривме, намаливме, зголемивме."]
  - ask: ["Say: we improved the speed.", "Diga: melhoramos a velocidade.", "Ја подобривме брзината.", podobrivme]
  - ask: ["Say: we reduced the bugs.", "Diga: reduzimos os erros.", "Ги намаливме грешките.", namalivme]
  - ask: ["Say: we increased the users by twenty per cent.", "Diga: aumentamos os usuários em vinte por cento.", "Ги зголемивме корисниците за дваесет проценти.", zgolemivme, za-dvaeset-procenti]
  - ask: ["Say: finally I'd like to thank the team.", "Diga: por fim quero agradecer à equipe.", "На крајот сакам да му се заблагодарам на тимот.", na-krajot-sakam, da-mu-se-zablagodaram]
  - ask: ["Ask: questions?", "Pergunte: perguntas?", "Прашања?", prasanja]
  - note: ["Thanking the colleague who once took your credit, in public, closes the story well — and everyone notices.", "Agradecer em público ao colega que um dia levou o seu crédito fecha bem a história — e todo mundo repara."]
