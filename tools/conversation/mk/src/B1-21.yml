id: B1-21
protagonist: f
title: ["Art", "Arte"]
situation: ["Sunday at the Museum of Contemporary Art, on the hill above the Old Bazaar, with Bojan.", "Domingo no Museu de Arte Contemporânea, no morro acima do Velho Bazar, com o Bojan."]
learn: [b1-verbal-noun]
culture: A museum given by the world's artists
items:
  - [muzejot, "музејот", "the museum", "o museu"]
  - [umetnik, "уметник", "artist", "artista"]
  - [podarija, "подарија", "(they) gave, donated", "doaram"]
  - [me-potsetuva, "ме потсетува на", "reminds me of", "me lembra"]
  - [boite, "боите", "the colours", "as cores"]
  - [cuvstvo, "чувство", "feeling", "sentimento"]
  - [razbiranje, "разбирање", "understanding", "entendimento / compreensão"]
  - [gledanje, "гледање", "looking, watching", "olhar / ver"]
  - [moderna, "модерна", "modern (feminine)", "moderna"]
  - [ne-mora, "не мора", "you don't have to", "não precisa"]
dialogue:
  - [bojan, "Музејот е подарок од целиот свет. Уметници подарија дела по земјотресот.", "The museum is a gift from the whole world. Artists donated works after the earthquake.", "O museu é um presente do mundo inteiro. Artistas doaram obras depois do terremoto."]
  - [protagonist, "Дури и Пикасо?", "Even Picasso?", "Até o Picasso?"]
  - [bojan, "Да, тука е една негова слика.", "Yes, there's one of his paintings here.", "Sim, tem um quadro dele aqui."]
  - [protagonist, "Оваа слика ме потсетува на морето. Боите се како во Бразил.", "This painting reminds me of the sea. The colours are like in Brazil.", "Este quadro me lembra o mar. As cores são como no Brasil."]
  - [bojan, "Јас ништо не разбирам од модерна уметност.", "I don't understand anything about modern art.", "Eu não entendo nada de arte moderna."]
  - [protagonist, "Не мора да разбираш. Важно е чувството.", "You don't have to understand. The feeling is what matters.", "Não precisa entender. O que importa é o sentimento."]
  - [bojan, "Значи, гледањето е поважно од разбирањето?", "So looking matters more than understanding?", "Então olhar é mais importante que entender?"]
  - [protagonist, "Точно!", "Exactly!", "Exatamente!"]
teach:
  - ask: ["Say: the museum is a gift.", "Diga: o museu é um presente.", "Музејот е подарок.", muzejot, podarok]
  - ask: ["Say: artists donated works.", "Diga: artistas doaram obras.", "Уметници подарија дела.", umetnik, podarija]
  - ask: ["Say: this painting reminds me of the sea.", "Diga: este quadro me lembra o mar.", "Оваа слика ме потсетува на морето.", me-potsetuva, more]
  - ask: ["Say: the colours are like in Brazil.", "Diga: as cores são como no Brasil.", "Боите се како во Бразил.", boite]
  - ask: ["Say: modern art.", "Diga: arte moderna.", "Модерна уметност.", moderna]
  - ask: ["Say: you don't have to understand.", "Diga: não precisa entender.", "Не мора да разбираш.", ne-mora]
  - ask: ["Say: the feeling is what matters.", "Diga: o que importa é o sentimento.", "Важно е чувството.", cuvstvo]
  - note: ["Many verbs make a noun with -ње: гледа → гледање (looking), разбира → разбирање (understanding), учи → учење (learning).", "Muitos verbos formam um substantivo com -ње: гледа → гледање (o olhar), разбира → разбирање (o entender), учи → учење (o aprender)."]
  - ask: ["Say: looking matters more than understanding.", "Diga: olhar importa mais que entender.", "Гледањето е поважно од разбирањето.", gledanje, razbiranje]
  - note: ["After 1963 artists from East and West donated works to rebuild Skopje's culture; the Museum of Contemporary Art opened in 1970 with them — Picasso among the donors.", "Depois de 1963, artistas do Leste e do Oeste doaram obras para reconstruir a cultura de Skopje; o Museu de Arte Contemporânea abriu em 1970 com elas — Picasso entre os doadores."]
