id: C1-08
protagonist: m
title: ["Buying a car", "Comprar um carro"]
situation: ["A used-car market on a Sunday morning. Marko comes as your expert.", "Uma feira de carros usados num domingo de manhã. O Marko vai como seu especialista."]
learn: [c1-renarrative-full]
culture: —
items:
  - [poloven-avtomobil, "половен автомобил", "used car", "carro usado"]
  - [kilometri, "километри", "kilometres", "quilômetros"]
  - [vozel-samo, "возел само", "drove only (reportedly)", "teria dirigido só"]
  - [penzionerka, "пензионерка", "pensioner (a woman)", "aposentada", {rare: true}]
  - [proverka, "проверка", "check, inspection", "verificação / revisão"]
  - [kaj-mehanicar, "кај механичар", "at a mechanic's", "num mecânico", {rare: true}]
  - [ne-veruvaj, "не верувај", "don't believe (informal)", "não acredita"]
  - [site-taka-velat, "сите така велат", "they all say that", "todos dizem isso"]
  - [papirite, "папирите", "the papers", "os documentos"]
  - [vo-red-se, "во ред се", "they're in order", "estão em ordem"]
dialogue:
  - [klient, "Колата е одлична. Само сто илјади километри.", "The car is excellent. Only a hundred thousand kilometres.", "O carro é ótimo. Só cem mil quilômetros."]
  - [protagonist, "Кој ја возел?", "Who drove it?", "Quem dirigia?"]
  - [klient, "Една пензионерка. Возела само до пазар и назад.", "A pensioner. She only drove to the market and back.", "Uma aposentada. Só ia até a feira e voltava."]
  - [marko, "Не верувај. Сите така велат.", "Don't believe it. They all say that.", "Não acredita. Todos dizem isso."]
  - [protagonist, "Може проверка кај механичар?", "Can we have it checked at a mechanic's?", "Dá para fazer uma revisão num mecânico?"]
  - [klient, "Може, може. Папирите се во ред.", "Sure, sure. The papers are in order.", "Pode, pode. Os documentos estão em ordem."]
  - [marko, "Механичарот вели дека моторот бил менуван. Значи, повеќе од сто илјади.", "The mechanic says the engine was replaced. So, more than a hundred thousand.", "O mecânico diz que o motor foi trocado. Então, mais de cem mil."]
  - [protagonist, "Пензионерката возела многу на пазар!", "The pensioner drove to market a lot, apparently!", "A aposentada foi muito à feira, pelo visto!"]
teach:
  - ask: ["Say: a used car.", "Diga: um carro usado.", "Половен автомобил.", poloven-avtomobil]
  - ask: ["Say: only a hundred thousand kilometres.", "Diga: só cem mil quilômetros.", "Само сто илјади километри.", kilometri]
  - ask: ["Ask: who drove it? (reported)", "Pergunte: quem dirigia?", "Кој ја возел?", vozel-samo]
  - ask: ["Say: a pensioner.", "Diga: uma aposentada.", "Една пензионерка.", penzionerka]
  - ask: ["Marko: don't believe it.", "O Marko: não acredita.", "Не верувај.", ne-veruvaj]
  - ask: ["Marko: they all say that.", "O Marko: todos dizem isso.", "Сите така велат.", site-taka-velat]
  - ask: ["Ask for a check at a mechanic's.", "Peça uma revisão num mecânico.", "Може проверка кај механичар?", proverka, kaj-mehanicar]
  - ask: ["Say: the papers are in order.", "Diga: os documentos estão em ordem.", "Папирите се во ред.", papirite, vo-red-se]
  - note: ["Irony through the л-form: 'Пензионерката возела многу на пазар!' — repeating the seller's own story in the reported form shows you don't believe it.", "Ironia pela forma em -л: 'Пензионерката возела многу на пазар!' — repetir a história do vendedor na forma de 'ouvi dizer' mostra que você não acredita."]
