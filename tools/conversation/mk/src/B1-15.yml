id: B1-15
protagonist: f
title: ["Happiness", "Felicidade"]
situation: ["A long walk along the Vardar with Bojan. What makes people happy?", "Uma caminhada longa pelo Vardar com o Bojan. O que deixa as pessoas felizes?"]
learn: [b1-relative]
culture: —
items:
  - [srekjen, "среќен", "happy (masculine)", "feliz"]
  - [srekjna, "среќна", "happy (feminine)", "feliz"]
  - [sto-te-pravi, "Што те прави…?", "What makes you…?", "O que te deixa…?"]
  - [lugje-koi, "луѓе кои", "people who", "pessoas que"]
  - [gi-sakam, "ги сакам", "I love them", "eu amo / gosto deles"]
  - [zadovolstvo, "задоволство", "satisfaction, pleasure", "satisfação / prazer", {rare: true}]
  - [smisla, "смисла", "meaning, sense", "sentido"]
  - [rabotata-sto, "работата што", "the work that", "o trabalho que"]
  - [ima-smisla, "има смисла", "makes sense, has meaning", "faz sentido"]
  - [dovolno, "доволно", "enough", "suficiente"]
  - [pari-ne-se, "парите не се сѐ", "money isn't everything", "dinheiro não é tudo"]
dialogue:
  - [bojan, "Што те прави среќна?", "What makes you happy?", "O que te deixa feliz?"]
  - [protagonist, "Луѓе кои ги сакам. И работа што има смисла.", "People I love. And work that has meaning.", "Pessoas que eu amo. E um trabalho que tenha sentido."]
  - [bojan, "А парите?", "And money?", "E o dinheiro?"]
  - [protagonist, "Парите не се сѐ. Доволно е да имаш доволно.", "Money isn't everything. It's enough to have enough.", "Dinheiro não é tudo. Basta ter o suficiente."]
  - [bojan, "Мојот дедо велеше: среќен е тој што е задоволен.", "My grandfather used to say: happy is the one who is content.", "Meu avô dizia: feliz é quem está satisfeito."]
  - [protagonist, "А ти? Што те прави среќен?", "And you? What makes you happy?", "E você? O que te deixa feliz?"]
  - [bojan, "Ова. Прошетка покрај реката, со тебе.", "This. A walk by the river, with you.", "Isto. Uma caminhada à beira do rio, com você."]
  - [protagonist, "Тоа е задоволство и за мене.", "That's a pleasure for me too.", "É um prazer para mim também."]
teach:
  - ask: ["Ask him what makes him happy.", "Pergunte o que o deixa feliz.", "Што те прави среќен?", sto-te-pravi, srekjen]
  - ask: ["Say: I'm happy. (a woman)", "Diga: estou feliz.", "Среќна сум.", srekjna]
  - note: ["'Who', 'which', 'that' join clauses: кој / која / кое / кои agree with the noun; што works for anything. Луѓе кои ги сакам — people (whom) I love.", "'Que' liga frases: кој / која / кое / кои concordam com o substantivo; што serve para tudo. Луѓе кои ги сакам — pessoas que eu amo."]
  - ask: ["Say: people I love.", "Diga: pessoas que eu amo.", "Луѓе кои ги сакам.", lugje-koi, gi-sakam]
  - ask: ["Say: work that has meaning.", "Diga: um trabalho que tenha sentido.", "Работа што има смисла.", rabotata-sto, ima-smisla]
  - ask: ["Say: meaning.", "Diga: sentido.", "Смисла.", smisla]
  - ask: ["Say: money isn't everything.", "Diga: dinheiro não é tudo.", "Парите не се сѐ.", pari-ne-se]
  - ask: ["Say: it's enough.", "Diga: é suficiente.", "Доволно е.", dovolno]
  - ask: ["Say: happy is the one who is content.", "Diga: feliz é quem está satisfeito.", "Среќен е тој што е задоволен.", srekjen]
  - ask: ["Say: that's a pleasure for me too.", "Diga: é um prazer para mim também.", "Тоа е задоволство и за мене.", zadovolstvo, mene]
