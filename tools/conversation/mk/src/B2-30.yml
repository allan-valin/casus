id: B2-30
protagonist: m
title: ["The future", "O futuro"]
situation: ["December, Vera's kitchen. Where will you live, and what comes next? B2 comes back.", "Dezembro, na cozinha da Vera. Onde você vai morar, e o que vem agora? O B2 volta."]
learn: []
culture: —
items:
  - [idninata, "иднината", "the future", "o futuro"]
  - [kade-ke-ziveete, "Каде ќе живеете?", "Where will you (two) live?", "Onde vocês vão morar?"]
  - [kupivme, "купивме", "we bought", "compramos"]
  - [kredit, "кредит", "loan, mortgage", "financiamento", {rare: true}]
  - [dvaeset-godini, "дваесет години", "twenty years", "vinte anos"]
  - [vo-istata-zgrada, "во истата зграда", "in the same building", "no mesmo prédio"]
  - [plani, "планови", "plans", "planos"]
  - [deca, "деца", "children", "filhos / crianças"]
  - [poleka-poleka, "полека-полека", "little by little", "devagarinho"]
  - [ke-ti-bidam-baba, "ќе им бидам баба", "I'll be a grandmother to them", "vou ser avó deles"]
dialogue:
  - [vera, "Значи, свадба наесен. Каде ќе живеете?", "So, a wedding in autumn. Where will you live?", "Então, casamento no outono. Onde vocês vão morar?"]
  - [protagonist, "Купивме стан — со кредит, на дваесет години.", "We bought a flat — with a mortgage, over twenty years.", "Compramos um apartamento — financiado, em vinte anos."]
  - [vera, "Каде?", "Where?", "Onde?"]
  - [protagonist, "Тука, во истата зграда. На четвртиот кат.", "Here, in the same building. On the fourth floor.", "Aqui, no mesmo prédio. No quarto andar."]
  - [vera, "Не! Навистина? Ќе плачам.", "No! Really? I'm going to cry.", "Não! Sério? Vou chorar."]
  - [protagonist, "А плановите за иднината — полека-полека. Можеби деца.", "And plans for the future — little by little. Maybe children.", "E os planos para o futuro — devagarinho. Talvez filhos."]
  - [vera, "Ќе им бидам баба! Секој ден кафе, како порано.", "I'll be their grandmother! Coffee every day, like before.", "Vou ser avó deles! Café todo dia, como antes."]
  - [protagonist, "Како во A1 — само сега разбирам сѐ.", "Like in A1 — only now I understand everything.", "Como no A1 — só que agora entendo tudo."]
teach:
  - ask: ["Vera asks where you'll live.", "A Vera pergunta onde vocês vão morar.", "Каде ќе живеете?", kade-ke-ziveete]
  - ask: ["Say: we bought a flat.", "Diga: compramos um apartamento.", "Купивме стан.", kupivme, stanot]
  - ask: ["Say: with a mortgage, over twenty years.", "Diga: financiado, em vinte anos.", "Со кредит, на дваесет години.", kredit, dvaeset-godini]
  - ask: ["Say: in the same building.", "Diga: no mesmo prédio.", "Во истата зграда.", vo-istata-zgrada]
  - ask: ["Say: plans for the future.", "Diga: planos para o futuro.", "Планови за иднината.", plani, idninata]
  - ask: ["Say: little by little. Maybe children.", "Diga: devagarinho. Talvez filhos.", "Полека-полека. Можеби деца.", poleka-poleka, deca]
  - ask: ["Vera: I'll be their grandmother!", "A Vera: vou ser avó deles!", "Ќе им бидам баба!", ke-ti-bidam-baba]
  - note: ["End of B2. Some more from the whole level.", "Fim do B2. Mais um pouco de todo o nível."]
  - ask: ["To the boss: I'd like us to talk.", "Para o chefe: gostaria de conversar.", "Би сакал да разговараме.", bi-sakal-da-razgovarame]
  - ask: ["To a client: I completely understand you.", "Para um cliente: entendo perfeitamente.", "Потполно ве разбирам.", ve-razbiram-potpolno]
  - ask: ["Toast: to us — cheers!", "Brinde: a nós — saúde!", "За нас — наздравје!", za-nas, nazdravje]
  - ask: ["Ana: let's go for coffee!", "A Ana: bora tomar um café!", "Ајде на кафе!", ajde-na-kafe]
