id: B1-06
protagonist: m
title: ["Energy", "Energia"]
situation: ["Mrs Stojanovska waves the electricity bill at you on the stairs.", "A senhora Stojanovska balança a conta de luz na sua frente, na escada."]
learn: [b1-cause-conj]
culture: —
items:
  - [poskapa, "поскапа", "more expensive (feminine)", "mais cara"]
  - [dvojno, "двојно", "double, twice as", "o dobro"]
  - [zatoa-sto, "затоа што", "because", "porque"]
  - [cenata, "цената", "the price", "o preço"]
  - [energijata, "енергијата", "the energy", "a energia"]
  - [porasna, "порасна", "went up, grew", "subiu"]
  - [bidejkji, "бидејќи", "since, because", "como / já que"]
  - [da-stedime, "да штедиме", "to save (money, energy)", "economizar"]
  - [navecer, "навечер", "in the evening", "à noite"]
  - [soncevi-paneli, "сончеви панели", "solar panels", "painéis solares", {rare: true}]
  - [skapi, "скапи", "expensive (plural)", "caros"]
dialogue:
  - [vera, "Ја видовте ли сметката за струја? Двојно поскапа!", "Did you see the electricity bill? Twice as expensive!", "O senhor viu a conta de luz? O dobro do preço!"]
  - [protagonist, "Зошто толку многу?", "Why so much?", "Por que tanto?"]
  - [vera, "Затоа што цената на енергијата порасна.", "Because the price of energy went up.", "Porque o preço da energia subiu."]
  - [vera, "И бидејќи е зима, сите грееме на струја.", "And since it's winter, everyone heats with electricity.", "E como é inverno, todo mundo esquenta a casa com luz."]
  - [protagonist, "Треба да штедиме. Бојлерот ќе го палам само навечер.", "We need to save. I'll only turn the water heater on in the evening.", "A gente precisa economizar. Vou ligar o boiler só à noite."]
  - [vera, "Синот во Германија има сончеви панели.", "My son in Germany has solar panels.", "Meu filho na Alemanha tem painéis solares."]
  - [protagonist, "Тука има уште повеќе сонце!", "There's even more sun here!", "Aqui tem ainda mais sol!"]
  - [vera, "Да, ама панелите се скапи.", "Yes, but the panels are expensive.", "Sim, mas os painéis são caros."]
teach:
  - ask: ["Say: twice as expensive!", "Diga: o dobro do preço!", "Двојно поскапа!", dvojno, poskapa]
  - ask: ["Ask why so much.", "Pergunte por que tanto.", "Зошто толку многу?", zosto, tolku]
  - note: ["Reasons: затоа што (because), бидејќи (since — often at the start). 'Затоа' alone means 'that's why'.", "Causas: затоа што (porque), бидејќи (como / já que — muitas vezes no começo). 'Затоа' sozinho quer dizer 'por isso'."]
  - ask: ["Say: because the price went up.", "Diga: porque o preço subiu.", "Затоа што цената порасна.", zatoa-sto, cenata, porasna]
  - ask: ["Say: the price of energy.", "Diga: o preço da energia.", "Цената на енергијата.", energijata]
  - ask: ["Say: since it's winter…", "Diga: como é inverno…", "Бидејќи е зима…", bidejkji, zima]
  - ask: ["Say: we need to save.", "Diga: a gente precisa economizar.", "Треба да штедиме.", treba, da-stedime]
  - ask: ["Say: only in the evening.", "Diga: só à noite.", "Само навечер.", navecer]
  - ask: ["Say: solar panels.", "Diga: painéis solares.", "Сончеви панели.", soncevi-paneli]
  - ask: ["Say: but the panels are expensive.", "Diga: mas os painéis são caros.", "Но панелите се скапи.", skapi]
  - pt_only: "No Brasil a conta sobe no verão, com o ar-condicionado; aqui sobe no inverno, com o aquecimento."
