id: A1-03
protagonist: f
title: [The body, O corpo]
situation: ["You meet Mrs Stojanovska on the stairs with a heavy bag. Her arm hurts.", "Você encontra a senhora Stojanovska na escada com uma sacola pesada. O braço dela dói."]
learn: [a1-article]
culture: Asking an older neighbour if she needs help
items:
  - [sto-vi-e, "Што ви е?", "What's wrong? (formal)", "O que a senhora tem? (formal)"]
  - [me-boli, "Ме боли", "… hurts (me)", "Me dói…"]
  - [rakata, "раката", "the arm / the hand", "o braço / a mão"]
  - [glavata, "главата", "the head", "a cabeça"]
  - [nogata, "ногата", "the leg / the foot", "a perna / o pé"]
  - [okoto, "окото", "the eye", "o olho"]
  - [torbata, "торбата", "the bag", "a sacola"]
  - [teska, "тешка", "heavy (with a feminine word)", "pesada (com palavra feminina)"]
  - [da-vi-pomognam, "Да ви помогнам?", "Can I help you? (formal)", "Posso ajudar a senhora? (formal)"]
  - [i, "и", "and / also", "e / também"]
  - [lekar, "лекар", "doctor", "médico"]
  - [ne-e-strasno, "Не е страшно", "It's nothing serious", "Não é nada grave"]
  - [odmorete-se, "Одморете се", "Rest (formal)", "Descanse (formal)"]
  - [dobro-sum, "Добро сум", "I'm fine", "Estou bem"]
dialogue:
  - [protagonist, "Добар ден, госпоѓо Стојановска! Што ви е?", "Good afternoon, Mrs Stojanovska! What's wrong?", "Boa tarde, senhora Stojanovska! O que a senhora tem?"]
  - [vera, "Ме боли раката. Торбата е многу тешка.", "My arm hurts. The bag is very heavy.", "Meu braço dói. A sacola é muito pesada."]
  - [protagonist, "Да ви помогнам?", "Can I help you?", "Posso ajudar?"]
  - [vera, "Да, благодарам. И главата ме боли малку.", "Yes, thank you. My head hurts a little too.", "Sim, obrigada. A cabeça também dói um pouco."]
  - [protagonist, "Главата? Лекар?", "Your head? A doctor?", "A cabeça? Médico?"]
  - [vera, "Не, не е страшно.", "No, it's nothing serious.", "Não, não é nada grave."]
  - [protagonist, "Одморете се, госпоѓо Стојановска.", "Rest, Mrs Stojanovska.", "Descanse, senhora Stojanovska."]
  - [vera, "Благодарам. Сега добро сум.", "Thank you. Now I'm fine.", "Obrigada. Agora estou bem."]
teach:
  - note: ["To ask an older person what is wrong, politely: 'Што ви е?'", "Para perguntar a uma pessoa mais velha o que ela tem, com educação: 'Што ви е?'"]
  - ask: ["Ask her what's wrong.", "Pergunte o que ela tem.", "Што ви е?", sto-vi-e]
  - note: ["She says 'Ме боли раката' — word for word 'me hurts the arm'. The thing that hurts comes after.", "Ela diz 'Ме боли раката' — palavra por palavra 'me dói o braço', como em português. O que dói vem depois."]
  - line: [vera, me-boli]
  - note: ["'The' is at the end of the word: рака → раката, глава → главата, нога → ногата. Words in -о take -то: око → окото.", "O artigo vem no fim da palavra: рака → раката (o braço), глава → главата, нога → ногата. Palavras em -о levam -то: око → окото."]
  - build: [rakata, ["-ката", "раката"]]
  - ask: ["Say that your arm hurts.", "Diga que o braço dói.", "Ме боли раката.", me-boli, rakata]
  - ask: ["Say that your head hurts.", "Diga que a cabeça dói.", "Ме боли главата.", me-boli, glavata]
  - ask: ["Now the leg.", "Agora a perna.", "Ме боли ногата.", me-boli, nogata]
  - ask: ["And the eye.", "E o olho.", "Ме боли окото.", me-boli, okoto]
  - note: ["'Торбата е тешка': the bag is heavy. 'Тешка' ends in -а because 'торба' is feminine.", "'Торбата е тешка': a sacola é pesada. 'Тешка' termina em -а porque 'торба' é feminina."]
  - ask: ["Say: the bag is heavy.", "Diga: a sacola é pesada.", "Торбата е тешка.", torbata, teska]
  - ask: ["Offer to help her, politely.", "Ofereça ajuda, com educação.", "Да ви помогнам?", da-vi-pomognam]
  - ask: ["Say: my head hurts, and my arm too.", "Diga: a cabeça dói, e o braço também.", "Ме боли главата и раката.", me-boli, glavata, i, rakata]
  - ask: ["Ask: a doctor?", "Pergunte: médico?", "Лекар?", lekar]
  - ask: ["She says it's nothing serious. How?", "Ela diz que não é nada grave. Como?", "Не е страшно.", ne-e-strasno]
  - ask: ["Tell her to rest.", "Diga para ela descansar.", "Одморете се.", odmorete-se]
  - ask: ["Someone asks how you are. Say you're fine.", "Alguém pergunta como você está. Diga que está bem.", "Добро сум.", dobro-sum]
  - pt_only: "Repare: 'Ме боли' funciona como 'me dói' em português. Uma das poucas vezes em que a ordem é igual!"
