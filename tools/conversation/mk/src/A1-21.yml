id: A1-21
protagonist: f
title: [Plants, Plantas]
situation: ["Mrs Stojanovska shows you her balcony full of plants.", "A senhora Stojanovska mostra a varanda dela, cheia de plantas."]
learn: [a1-pres-e]
culture: An odd number of flowers
items:
  - [balkon, "балкон", "balcony", "varanda / sacada", {rare: true}]
  - [rastat, "растат", "(they) grow", "crescem", {rare: true}]
  - [cvekja, "цвеќиња", "flowers", "flores", {rare: true}]
  - [cvekje, "цвеќе", "flowers (a bunch)", "flores (um buquê)", {rare: true}]
  - [bosilok, "босилок", "basil", "manjericão", {rare: true}]
  - [drvo, "дрво", "tree / wood", "árvore / madeira"]
  - [limon, "лимон", "lemon (tree)", "limão / limoeiro", {rare: true}]
  - [raste, "расте", "(it) grows", "cresce"]
  - [pie, "пие", "drinks", "bebe"]
  - [kupuvam, "купувам", "I buy", "eu compro"]
  - [sest, "шест", "six", "seis"]
  - [nikogas, "никогаш", "never", "nunca"]
  - [listovite, "листовите", "the leaves", "as folhas", {rare: true}]
dialogue:
  - [vera, "Ова е мојот балкон. Тука растат цвеќиња.", "This is my balcony. Flowers grow here.", "Esta é a minha varanda. Aqui crescem flores."]
  - [protagonist, "Многу убави цвеќиња! А ова?", "Very pretty flowers! And this?", "Que flores bonitas! E isto?"]
  - [vera, "Ова е босилок, за салата.", "This is basil, for salad.", "Isto é manjericão, para salada."]
  - [protagonist, "А ова дрво?", "And this tree?", "E esta árvore?"]
  - [vera, "Тоа е лимон. Расте бавно и пие многу вода.", "That's a lemon tree. It grows slowly and drinks a lot of water.", "É um limoeiro. Cresce devagar e bebe muita água."]
  - [protagonist, "Листовите се големи! Утре купувам цвеќе за Ана. Пет или шест?", "The leaves are big! Tomorrow I'm buying flowers for Ana. Five or six?", "As folhas são grandes! Amanhã vou comprar flores para a Ana. Cinco ou seis?"]
  - [vera, "Пет! Никогаш шест.", "Five! Never six.", "Cinco! Nunca seis."]
  - [protagonist, "Зошто?", "Why?", "Por quê?"]
  - [vera, "Парен број е за мртвите.", "An even number is for the dead.", "Número par é para os mortos."]
teach:
  - ask: ["Say: this is my balcony.", "Diga: esta é a minha varanda.", "Ова е мојот балкон.", mojot, balkon]
  - note: ["'Расте' is 'it grows', 'растат' 'they grow'. Most verbs make 'they' with -ат.", "'Расте' é 'cresce', 'растат' é 'crescem'. A maioria dos verbos faz 'eles' com -ат."]
  - ask: ["Say: flowers grow here.", "Diga: aqui crescem flores.", "Тука растат цвеќиња.", tuka, rastat, cvekja]
  - ask: ["Say: very pretty flowers!", "Diga: que flores bonitas!", "Многу убави цвеќиња!", mnogu, cvekja]
  - ask: ["Say: this is basil.", "Diga: isto é manjericão.", "Ова е босилок.", bosilok]
  - ask: ["Ask about the tree: and this tree?", "Pergunte da árvore: e esta árvore?", "А ова дрво?", drvo]
  - ask: ["Say: it's a lemon tree.", "Diga: é um limoeiro.", "Тоа е лимон.", limon]
  - ask: ["Say: it grows slowly.", "Diga: cresce devagar.", "Расте бавно.", raste, bavno]
  - ask: ["Say: it drinks a lot of water.", "Diga: bebe muita água.", "Пие многу вода.", pie, voda]
  - ask: ["Say: the leaves are big.", "Diga: as folhas são grandes.", "Листовите се големи.", listovite, se]
  - ask: ["Say: tomorrow I'm buying flowers.", "Diga: amanhã vou comprar flores.", "Утре купувам цвеќе.", utre, kupuvam, cvekje]
  - note: ["Flowers as a gift: always an odd number — 3, 5, 7. Even numbers are for funerals and graves.", "Flores de presente: sempre em número ímpar — 3, 5, 7. Número par é para enterro e túmulo."]
  - ask: ["Ask: five or six?", "Pergunte: cinco ou seis?", "Пет или шест?", pet, ili, sest]
  - ask: ["Her answer: five, never six!", "A resposta dela: cinco, nunca seis!", "Пет! Никогаш шест.", sest, nikogas]
