id: C2-21
protagonist: f
title: ["A friend in crisis", "Um amigo em crise"]
situation: ["Goran came back from Munich. His job is gone and so is his girlfriend. He calls at midnight.", "O Goran voltou de Munique. Perdeu o emprego e a namorada. Ele liga à meia-noite."]
learn: [c2-aspect-politeness]
culture: —
items:
  - [tuka-sum-za-tebe, "тука сум за тебе", "I'm here for you", "estou aqui para você"]
  - [poddrska, "поддршка", "support", "apoio"]
  - [ne-mora-da-zboruvas, "не мора да зборуваш", "you don't have to talk", "não precisa falar"]
  - [samo-te-slusam, "само те слушам", "I'm just listening", "só estou ouvindo"]
  - [se-cuvstvuvam-prazno, "се чувствувам празно", "I feel empty", "me sinto vazio"]
  - [razbirlivo-e, "разбирливо е", "it's understandable", "é compreensível"]
  - [ke-pomine, "ќе помине", "it will pass", "vai passar"]
  - [ne-si-sam, "не си сам", "you're not alone", "você não está sozinho"]
  - [dojdi-utre-na-rucek, "дојди утре на ручек", "come for lunch tomorrow", "vem almoçar amanhã"]
  - [cekor-po-cekor, "чекор по чекор", "step by step", "passo a passo"]
dialogue:
  - [goran, "Извини што се јавувам вака доцна...", "Sorry for calling so late...", "Desculpa ligar tão tarde..."]
  - [protagonist, "Нема проблем. Тука сум за тебе. Што се случи?", "No problem. I'm here for you. What happened?", "Sem problema. Estou aqui para você. O que aconteceu?"]
  - [goran, "Ја изгубив работата. И Ема замина. Се чувствувам празно.", "I lost my job. And Ema left. I feel empty.", "Perdi o emprego. E a Ema foi embora. Me sinto vazio."]
  - [protagonist, "Разбирливо е. Не мора да зборуваш — само те слушам.", "It's understandable. You don't have to talk — I'm just listening.", "É compreensível. Não precisa falar — só estou ouvindo."]
  - [goran, "Мислев дека во Минхен ќе ми биде подобро.", "I thought I'd be better off in Munich.", "Achei que em Munique eu ia ficar melhor."]
  - [protagonist, "Не си сам. Ќе помине — чекор по чекор.", "You're not alone. It will pass — step by step.", "Você não está sozinho. Vai passar — passo a passo."]
  - [protagonist, "Дојди утре на ручек. Бојан прави гравче.", "Come for lunch tomorrow. Bojan's making beans.", "Vem almoçar amanhã. O Bojan vai fazer feijão."]
  - [goran, "Благодарам. За поддршката.", "Thank you. For the support.", "Obrigado. Pelo apoio."]
teach:
  - ask: ["Say: I'm here for you.", "Diga: estou aqui para você.", "Тука сум за тебе.", tuka-sum-za-tebe]
  - ask: ["Goran: I feel empty.", "O Goran: me sinto vazio.", "Се чувствувам празно.", se-cuvstvuvam-prazno]
  - ask: ["Say: it's understandable.", "Diga: é compreensível.", "Разбирливо е.", razbirlivo-e]
  - ask: ["Say: you don't have to talk.", "Diga: não precisa falar.", "Не мора да зборуваш.", ne-mora-da-zboruvas]
  - ask: ["Say: I'm just listening.", "Diga: só estou ouvindo.", "Само те слушам.", samo-te-slusam]
  - ask: ["Say: you're not alone.", "Diga: você não está sozinho.", "Не си сам.", ne-si-sam]
  - ask: ["Say: it will pass.", "Diga: vai passar.", "Ќе помине.", ke-pomine]
  - ask: ["Say: step by step.", "Diga: passo a passo.", "Чекор по чекор.", cekor-po-cekor]
  - ask: ["Say: come for lunch tomorrow.", "Diga: vem almoçar amanhã.", "Дојди утре на ручек.", dojdi-utre-na-rucek]
  - ask: ["Goran: thank you for the support.", "O Goran: obrigado pelo apoio.", "Благодарам за поддршката.", poddrska]
  - note: ["Comfort works by presence more than advice: тука сум (I'm here), само те слушам (I'm just listening), and an invitation to eat — help often comes as a meal.", "O consolo funciona mais pela presença que pelo conselho: тука сум (estou aqui), само те слушам (só estou ouvindo), e um convite para comer — a ajuda muitas vezes vem em forma de comida."]
