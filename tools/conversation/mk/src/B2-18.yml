id: B2-18
protagonist: m
title: ["Politics without a fight", "Política sem briga"]
situation: ["Dinner at Sara's parents, the week before elections. Her father and uncle disagree.", "Jantar na casa dos pais da Sara, na semana antes da eleição. O pai e o tio dela discordam."]
learn: [b2-da-wishes]
culture: Politics with care at the table
items:
  - [glasanje, "гласање", "voting", "votação"]
  - [mislenje, "мислење", "opinion", "opinião"]
  - [sekoj-ima-svoe, "секој има свое", "everyone has their own", "cada um tem a sua"]
  - [ne-se-karajte, "Не се карајте!", "Don't argue! (to several)", "Não briguem!"]
  - [da-ne-se-karame, "да не се караме", "let's not argue", "não vamos brigar"]
  - [kaj-nas-vo-brazil, "кај нас во Бразил", "back home in Brazil", "lá no Brasil"]
  - [ista-rabota, "иста работа", "same thing", "a mesma coisa"]
  - [da-nazdravime, "Ајде да наздравиме", "Let's drink a toast", "Vamos brindar"]
  - [za-mir, "за мир", "to peace", "à paz"]
  - [vo-kukjata, "во куќата", "in the house", "na casa"]
dialogue:
  - [tatko, "Во недела е гласањето. Сите знаеме за кого.", "Voting's on Sunday. We all know who for.", "Domingo é a votação. Todo mundo sabe em quem."]
  - [cicko, "Ти знаеш. Јас имам друго мислење.", "You know. I have a different opinion.", "Você sabe. Eu tenho outra opinião."]
  - [sara, "Тато, чичко — не се карајте!", "Dad, uncle — don't argue!", "Pai, tio — não briguem!"]
  - [protagonist, "Кај нас во Бразил — иста работа. Секоја недела ручек со дебата.", "Back home in Brazil — same thing. Every Sunday lunch with a debate.", "Lá no Brasil — a mesma coisa. Todo almoço de domingo com debate."]
  - [tatko, "И како завршува?", "And how does it end?", "E como termina?"]
  - [protagonist, "Со десерт. Секој има свое мислење, но торта има за сите.", "With dessert. Everyone has their own opinion, but there's cake for all.", "Com a sobremesa. Cada um tem a sua opinião, mas bolo tem para todos."]
  - [cicko, "Мудар зет! Ајде да наздравиме — за мир во куќата.", "A wise son-in-law! Let's drink a toast — to peace in the house.", "Genro sábio! Vamos brindar — à paz na casa."]
  - [sara, "Да не се караме барем до изборите.", "Let's not argue at least until the elections.", "Vamos não brigar pelo menos até a eleição."]
teach:
  - ask: ["Say: voting is on Sunday.", "Diga: domingo é a votação.", "Во недела е гласањето.", glasanje]
  - ask: ["Say: I have a different opinion.", "Diga: eu tenho outra opinião.", "Имам друго мислење.", mislenje]
  - ask: ["Sara: don't argue! (to both)", "A Sara: não briguem!", "Не се карајте!", ne-se-karajte]
  - ask: ["Say: back home in Brazil, same thing.", "Diga: lá no Brasil, a mesma coisa.", "Кај нас во Бразил — иста работа.", kaj-nas-vo-brazil, ista-rabota]
  - ask: ["Say: everyone has their own opinion.", "Diga: cada um tem a sua opinião.", "Секој има свое мислење.", sekoj-ima-svoe]
  - ask: ["The uncle: let's drink a toast!", "O tio: vamos brindar!", "Ајде да наздравиме!", da-nazdravime]
  - ask: ["Say: to peace in the house.", "Diga: à paz na casa.", "За мир во куќата.", za-mir, vo-kukjata]
  - ask: ["Sara: let's not argue.", "A Sara: vamos não brigar.", "Да не се караме.", da-ne-se-karame]
  - note: ["At a family table you may hear strong views from both sides. A guest — and a foreigner — does best by comparing with home, not choosing a side, and offering a toast.", "Na mesa da família você pode ouvir opiniões fortes dos dois lados. O convidado — e estrangeiro — se sai melhor comparando com o próprio país, sem tomar partido, e propondo um brinde."]
