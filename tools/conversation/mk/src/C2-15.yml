id: C2-15
protagonist: f
title: ["History, with care", "A história, com cuidado"]
situation: ["A museum guide tells the story of a medieval tsar. A visitor from abroad objects. You listen.", "Um guia de museu conta a história de um tsar medieval. Um visitante estrangeiro discorda. Você ouve."]
learn: [c2-register]
culture: History handled with care
items:
  - [tolkuvanje, "толкување", "interpretation", "interpretação"]
  - [glediste, "гледиште", "point of view", "ponto de vista"]
  - [istoricarite, "историчарите", "historians", "os historiadores"]
  - [ne-se-soglasuvaat, "не се согласуваат", "don't agree", "não concordam"]
  - [izvorite, "изворите", "the sources", "as fontes"]
  - [od-dve-strani, "од двете страни", "from both sides", "dos dois lados"]
  - [cuvstvitelno, "чувствително", "sensitive", "delicado"]
  - [so-pocit-kon, "со почит кон", "with respect for", "com respeito a"]
  - [ne-sum-istoricarka, "не сум историчарка", "I'm not a historian (a woman)", "não sou historiadora"]
  - [slusam-i-ucam, "слушам и учам", "I listen and learn", "ouço e aprendo"]
dialogue:
  - [vodic-m, "Цар Самоил владееше од Охрид во десеттиот век.", "Tsar Samuel ruled from Ohrid in the tenth century.", "O tsar Samuel reinou a partir de Ohrid no século dez."]
  - [klient, "Но кај нас тоа се учи поинаку!", "But where I'm from, that's taught differently!", "Mas no meu país isso é ensinado diferente!"]
  - [vodic-m, "Тоа е прашање на толкување. Историчарите не се согласуваат.", "It's a question of interpretation. Historians don't agree.", "É questão de interpretação. Os historiadores não concordam."]
  - [protagonist, "Што велат изворите?", "What do the sources say?", "O que dizem as fontes?"]
  - [vodic-m, "Изворите се византиски, а секоја страна ги чита од свое гледиште.", "The sources are Byzantine, and each side reads them from its own point of view.", "As fontes são bizantinas, e cada lado lê do seu ponto de vista."]
  - [klient, "Темата е чувствителна.", "The topic is sensitive.", "O tema é delicado."]
  - [vodic-m, "Да. Затоа зборуваме со почит кон двете страни.", "Yes. That's why we speak with respect for both sides.", "Sim. Por isso falamos com respeito aos dois lados."]
  - [protagonist, "Јас не сум историчарка. Слушам и учам.", "I'm not a historian. I listen and learn.", "Não sou historiadora. Ouço e aprendo."]
teach:
  - ask: ["Say: it's a question of interpretation.", "Diga: é questão de interpretação.", "Тоа е прашање на толкување.", tolkuvanje]
  - ask: ["Say: historians don't agree.", "Diga: os historiadores não concordam.", "Историчарите не се согласуваат.", istoricarite, ne-se-soglasuvaat]
  - ask: ["Ask: what do the sources say?", "Pergunte: o que dizem as fontes?", "Што велат изворите?", izvorite]
  - ask: ["Say: from its own point of view.", "Diga: do seu ponto de vista.", "Од свое гледиште.", glediste]
  - ask: ["Say: the topic is sensitive.", "Diga: o tema é delicado.", "Темата е чувствителна.", cuvstvitelno]
  - ask: ["Say: with respect for both sides.", "Diga: com respeito aos dois lados.", "Со почит кон двете страни.", so-pocit-kon, od-dve-strani]
  - ask: ["Say: I'm not a historian.", "Diga: não sou historiadora.", "Не сум историчарка.", ne-sum-istoricarka]
  - ask: ["Say: I listen and learn.", "Diga: ouço e aprendo.", "Слушам и учам.", slusam-i-ucam]
  - note: ["Medieval history is claimed by several Balkan nations, and a guide's story can differ from what neighbours learn at school. As a guest, ask about sources, listen to both sides, and keep your own verdict.", "A história medieval é reivindicada por várias nações dos Bálcãs, e a versão do guia pode diferir do que os vizinhos aprendem na escola. Como visitante, pergunte das fontes, ouça os dois lados, e guarde a sua conclusão."]
