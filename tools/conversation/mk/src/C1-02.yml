id: C1-02
protagonist: m
title: ["A real game", "O primeiro treino de verdade"]
situation: ["The club's first league game. Coach Zoran is not in a good mood.", "O primeiro jogo da liga do clube. O técnico Zoran não está de bom humor."]
learn: [c1-particles]
culture: —
items:
  - [taktika, "тактика", "tactics", "tática"]
  - [ama-bas, "ама баш", "but really, of all things", "logo / justo"]
  - [pa-dobro, "па добро", "well, all right then", "tá bom, então"]
  - [ne-li, "нели", "right? isn't it?", "né?"]
  - [bre, "бре", "come on! hey! (particle)", "pô! ô!"]
  - [ajde-bre, "Ајде бре!", "Come on!", "Vamos, pô!"]
  - [zar, "зар", "really? surely not?", "será que? não me diga"]
  - [odbrana, "одбрана", "defence", "defesa"]
  - [napad, "напад", "attack", "ataque"]
  - [si-go-zasluzivme, "си го заслуживме", "we deserved it", "a gente mereceu"]
dialogue:
  - [zoran, "Тактиката е проста: силна одбрана, брз напад.", "The tactics are simple: strong defence, fast attack.", "A tática é simples: defesa forte, ataque rápido."]
  - [protagonist, "Тренерот секогаш вели „проста“, нели?", "The coach always says 'simple', right?", "O técnico sempre diz 'simples', né?"]
  - [marko, "Ама баш денеска играме против првите на табелата.", "And today of all days we play the league leaders.", "E justo hoje a gente joga contra o primeiro da tabela."]
  - [zoran, "Ајде бре, момци! Не спиете!", "Come on, lads! Don't sleep!", "Vamos, pô, rapazes! Não dormem!"]
  - [protagonist, "Зар губиме со дваесет поени?", "Are we really losing by twenty points?", "Será que a gente está perdendo por vinte pontos?"]
  - [marko, "Губиме. Па добро, ова е само првото коло.", "We're losing. Well, all right, it's only the first round.", "Estamos. Tá bom, é só a primeira rodada."]
  - [zoran, "Изгубивме. Но второто полувреме си го заслуживме.", "We lost. But the second half we earned.", "Perdemos. Mas o segundo tempo a gente mereceu."]
  - [protagonist, "Следниот пат — прво одбрана!", "Next time — defence first!", "Da próxima vez — primeiro a defesa!"]
teach:
  - ask: ["Say: the tactics are simple.", "Diga: a tática é simples.", "Тактиката е проста.", taktika]
  - ask: ["Say: strong defence, fast attack.", "Diga: defesa forte, ataque rápido.", "Силна одбрана, брз напад.", odbrana, napad]
  - note: ["Small particles carry the feeling: нели (right?), бре (come on!), зар (surely not?), ама баш (and of all things), па добро (well, all right). They are spoken, not written.", "Partículas pequenas carregam o sentimento: нели (né?), бре (pô!), зар (será que?), ама баш (logo, justo), па добро (tá bom, então). São faladas, não escritas."]
  - ask: ["Say: he always says 'simple', right?", "Diga: ele sempre diz 'simples', né?", "Секогаш вели „проста“, нели?", ne-li]
  - ask: ["Say: and today of all days.", "Diga: e justo hoje.", "Ама баш денеска.", ama-bas]
  - ask: ["Zoran: come on, lads!", "O Zoran: vamos, pô, rapazes!", "Ајде бре, момци!", ajde-bre, bre]
  - ask: ["Ask: are we really losing?", "Pergunte: será que a gente está perdendo?", "Зар губиме?", zar]
  - ask: ["Say: well, all right, it's only the first round.", "Diga: tá bom, é só a primeira rodada.", "Па добро, ова е само првото коло.", pa-dobro]
  - ask: ["Say: we deserved the second half.", "Diga: o segundo tempo a gente mereceu.", "Второто полувреме си го заслуживме.", si-go-zasluzivme]
