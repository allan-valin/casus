id: B2-06
protagonist: m
title: ["Chemical reactions", "Reações químicas"]
situation: ["Cleaning day with Sara. You are about to mix two bottles.", "Dia de faxina com a Sara. Você está prestes a misturar dois frascos."]
learn: [b2-impersonal]
culture: —
items:
  - [stoj, "Стој!", "Stop! (informal)", "Para!"]
  - [ne-se-mesa, "не се меша", "isn't mixed, mustn't be mixed", "não se mistura"]
  - [varikina, "варикина", "bleach", "água sanitária", {rare: true}]
  - [kiselina, "киселина", "acid", "ácido"]
  - [reakcija, "реакција", "reaction", "reação"]
  - [otroven-gas, "отровен гас", "poisonous gas", "gás tóxico", {rare: true}]
  - [se-pravi, "се прави", "is made, is formed", "se forma / se faz"]
  - [ocet, "оцет", "vinegar", "vinagre", {rare: true}]
  - [soda-bikarbona, "сода бикарбона", "baking soda", "bicarbonato", {rare: true}]
  - [penuva, "пенува", "foams", "espuma"]
  - [bezopasno, "безопасно", "harmless", "inofensivo"]
dialogue:
  - [sara, "Стој! Што правиш?", "Stop! What are you doing?", "Para! O que você está fazendo?"]
  - [protagonist, "Мешам варикина и средство за бања.", "I'm mixing bleach and the bathroom cleaner.", "Estou misturando água sanitária com o produto de banheiro."]
  - [sara, "Тоа не се меша! Во средството има киселина.", "You don't mix those! The cleaner has acid in it.", "Isso não se mistura! No produto tem ácido."]
  - [protagonist, "И што се случува?", "And what happens?", "E o que acontece?"]
  - [sara, "Реакција. Се прави отровен гас — хлор.", "A reaction. A poisonous gas forms — chlorine.", "Uma reação. Se forma um gás tóxico — cloro."]
  - [protagonist, "Ужас. А оцет и сода бикарбона?", "Terrible. And vinegar and baking soda?", "Que perigo. E vinagre com bicarbonato?"]
  - [sara, "Тоа пенува, но е безопасно. Со тоа чистиме.", "That foams, but it's harmless. We clean with that.", "Isso espuma, mas é inofensivo. A gente limpa com isso."]
  - [protagonist, "Од денеска — само оцет!", "From today — only vinegar!", "De hoje em diante — só vinagre!"]
teach:
  - ask: ["Sara shouts: stop!", "A Sara grita: para!", "Стој!", stoj]
  - ask: ["Say: I'm mixing bleach.", "Diga: estou misturando água sanitária.", "Мешам варикина.", varikina]
  - ask: ["Say: you don't mix those!", "Diga: isso não se mistura!", "Тоа не се меша!", ne-se-mesa]
  - ask: ["Say: there's acid in it.", "Diga: tem ácido nele.", "Има киселина.", kiselina]
  - ask: ["Say: a reaction.", "Diga: uma reação.", "Реакција.", reakcija]
  - ask: ["Say: a poisonous gas forms.", "Diga: se forma um gás tóxico.", "Се прави отровен гас.", se-pravi, otroven-gas]
  - ask: ["Ask: and vinegar and baking soda?", "Pergunte: e vinagre com bicarbonato?", "А оцет и сода бикарбона?", ocet, soda-bikarbona]
  - ask: ["Say: it foams, but it's harmless.", "Diga: espuma, mas é inofensivo.", "Пенува, но е безопасно.", penuva, bezopasno]
  - note: ["Bleach plus an acid cleaner releases chlorine gas; bleach plus ammonia releases chloramine. Never mix cleaning products. Vinegar and baking soda only make carbon dioxide — harmless foam.", "Água sanitária com produto ácido libera gás cloro; com amônia, cloramina. Nunca misture produtos de limpeza. Vinagre com bicarbonato só faz gás carbônico — espuma inofensiva."]
