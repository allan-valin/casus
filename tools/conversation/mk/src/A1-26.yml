id: A1-26
protagonist: m
title: [The Čaršija, A Čaršija]
situation: ["Ana takes you to the Old Bazaar, the Stara čaršija. You want a present.", "A Ana leva você ao Velho Bazar, a Stara čaršija. Você quer um presente."]
learn: [a1-demonstratives, a1-adj-article, a2-da]
culture: The Old Bazaar, from Ottoman times
items:
  - [starata, "старата", "the old (feminine)", "a velha / antiga"]
  - [stara, "стара", "old (feminine)", "velha / antiga"]
  - [sakam-da-kupam, "Сакам да купам…", "I'd like to buy…", "Quero comprar…"]
  - [podarok, "подарок", "present, gift", "presente"]
  - [ova-ili-ona, "Ова или она?", "This or that?", "Isto ou aquilo?"]
  - [ona, "она", "that (one)", "aquilo / aquele"]
  - [maloto, "малото", "the small one", "o pequeno"]
  - [poubavo, "поубаво", "nicer, prettier", "mais bonito"]
  - [srebro, "сребро", "silver", "prata", {rare: true}]
  - [go-zemam, "Го земам", "I'll take it", "Vou levar"]
  - [petstotini, "петстотини", "five hundred", "quinhentos", {rare: true}]
dialogue:
  - [ana, "Ова е Старата чаршија. Многу е стара, од турско време.", "This is the Old Bazaar. It's very old, from Ottoman times.", "Esta é a Stara čaršija. É muito antiga, do tempo dos turcos."]
  - [protagonist, "Сакам да купам подарок.", "I'd like to buy a present.", "Quero comprar um presente."]
  - [ana, "Тука има накит од сребро.", "Here there's silver jewellery.", "Aqui tem joias de prata."]
  - [protagonist, "Ова или она?", "This or that?", "Isto ou aquilo?"]
  - [ana, "Она, малото. Поубаво е.", "That one, the small one. It's nicer.", "Aquele, o pequeno. É mais bonito."]
  - [protagonist, "Колку чини малото?", "How much is the small one?", "Quanto custa o pequeno?"]
  - [seller, "Илјада и петстотини денари.", "One thousand five hundred denars.", "Mil e quinhentos dinares."]
  - [protagonist, "Скапо е... но убаво. Го земам!", "It's expensive... but nice. I'll take it!", "É caro... mas é bonito. Vou levar!"]
teach:
  - note: ["The Old Bazaar was the Ottoman market: stone streets, mosques, an old inn, craftsmen. North Macedonia was part of the Ottoman Empire for five hundred years, until 1912.", "O Velho Bazar era o mercado otomano: ruas de pedra, mesquitas, uma antiga hospedaria, artesãos. A Macedônia do Norte fez parte do Império Otomano por quinhentos anos, até 1912."]
  - note: ["With an adjective, 'the' goes on the adjective, not on the noun: стара чаршија → старата чаршија.", "Com adjetivo, o artigo vai no adjetivo, não no substantivo: стара чаршија → старата чаршија (a velha čaršija)."]
  - ask: ["Say: the old bazaar.", "Diga: o velho bazar.", "Старата чаршија.", starata]
  - ask: ["Say: it's very old.", "Diga: é muito antiga.", "Многу е стара.", stara]
  - ask: ["Say you'd like to buy a present.", "Diga que quer comprar um presente.", "Сакам да купам подарок.", sakam-da-kupam, podarok]
  - ask: ["Ask: this or that?", "Pergunte: isto ou aquilo?", "Ова или она?", ova-ili-ona]
  - ask: ["Ana chooses: that one, the small one.", "A Ana escolhe: aquele, o pequeno.", "Она, малото.", ona, maloto]
  - ask: ["Say: it's nicer.", "Diga: é mais bonito.", "Поубаво е.", poubavo]
  - ask: ["Ask how much the small one is.", "Pergunte quanto custa o pequeno.", "Колку чини малото?", kolku-cini, maloto]
  - ask: ["Say: one thousand five hundred.", "Diga: mil e quinhentos.", "Илјада и петстотини.", petstotini]
  - ask: ["Say: silver.", "Diga: prata.", "Сребро.", srebro]
  - ask: ["Decide: it's expensive, but I'll take it!", "Decida: é caro, mas vou levar!", "Скапо е, но го земам!", skapo, no-but, go-zemam]
  - pt_only: "Prata trabalhada em filigrana é a lembrança clássica da Čaršija — como a pedra-sabão em Ouro Preto."
