id: A2-08
protagonist: m
title: [The saint's day, O dia do santo]
situation: ["It's Mrs Stojanovska's name day. The door is open and the flat is full.", "É o dia do santo da senhora Stojanovska. A porta está aberta e o apartamento está cheio."]
learn: [a2-possessive-clitics]
culture: Name days over birthdays
items:
  - [cestit-imenden, "Честит именден!", "Happy name day!", "Feliz dia do santo!", {rare: true}]
  - [za-vas, "за вас", "for you (formal)", "para a senhora"]
  - [ne-trebase, "Не требаше!", "You shouldn't have!", "Não precisava!"]
  - [naucuv, "Научив", "I learned", "Aprendi"]
  - [torta, "торта", "cake (layered)", "torta / bolo", {rare: true}]
  - [ja-napravi, "ја направи", "made it", "fez"]
  - [gosti, "гости", "guests", "convidados / visitas"]
  - [site, "сите", "everyone, all", "todos"]
  - [doagjaat, "доаѓаат", "(they) come", "vêm"]
  - [bez-pokana, "без покана", "without an invitation", "sem convite", {rare: true}]
  - [vnuk, "внук", "grandson / nephew", "neto / sobrinho"]
dialogue:
  - [protagonist, "Честит именден, госпоѓо Стојановска!", "Happy name day, Mrs Stojanovska!", "Feliz dia do santo, senhora Stojanovska!"]
  - [vera, "Благодарам! Влезете, влезете!", "Thank you! Come in, come in!", "Obrigada! Entre, entre!"]
  - [protagonist, "Ова е за вас.", "This is for you.", "Isto é para a senhora."]
  - [vera, "Ох, не требаше! Цвеќе — и пет! Браво.", "Oh, you shouldn't have! Flowers — and five! Well done.", "Ah, não precisava! Flores — e cinco! Muito bem."]
  - [protagonist, "Научив.", "I learned.", "Aprendi."]
  - [vera, "Седнете, има торта. Ќерка ми ја направи.", "Sit down, there's cake. My daughter made it.", "Sente-se, tem torta. Minha filha que fez."]
  - [protagonist, "Колку гости!", "So many guests!", "Quanta visita!"]
  - [vera, "На именден сите доаѓаат без покана. Ова е внук ми.", "On a name day everyone comes without an invitation. This is my grandson.", "No dia do santo todo mundo vem sem convite. Este é o meu neto."]
teach:
  - note: ["A name day is the feast of the saint you're named after. Vera's is the feast of Saints Faith, Hope and Love (Вера, Надежда, Љубов), at the end of September. Older people often celebrate it more than their birthday.", "O dia do santo é a festa do santo cujo nome você tem. O da Vera é a festa das santas Fé, Esperança e Amor (Вера, Надежда, Љубов), no fim de setembro. Os mais velhos muitas vezes comemoram mais do que o aniversário."]
  - ask: ["Wish her a happy name day.", "Deseje um feliz dia do santo.", "Честит именден!", cestit-imenden]
  - ask: ["Give the present: this is for you.", "Entregue o presente: isto é para a senhora.", "Ова е за вас.", ova-e, za-vas]
  - ask: ["She says you shouldn't have. How?", "Ela diz que não precisava. Como?", "Не требаше!", ne-trebase]
  - ask: ["Say: I learned.", "Diga: aprendi.", "Научив.", naucuv]
  - ask: ["Say: there's cake.", "Diga: tem torta.", "Има торта.", torta]
  - note: ["With family, 'my' comes after the word, short: ќерка ми (my daughter), внук ми (my grandson). You met мајка ми and брат ми.", "Com a família, o 'meu' vem depois da palavra, curto: ќерка ми (minha filha), внук ми (meu neto). Você já viu мајка ми e брат ми."]
  - ask: ["Say for her: my daughter made it.", "Diga por ela: minha filha que fez.", "Ќерка ми ја направи.", kerka, ja-napravi]
  - ask: ["Say: so many guests!", "Diga: quanta visita!", "Колку гости!", gosti]
  - ask: ["Say: everyone comes.", "Diga: todo mundo vem.", "Сите доаѓаат.", site, doagjaat]
  - ask: ["Say: without an invitation.", "Diga: sem convite.", "Без покана.", bez, bez-pokana]
  - ask: ["Say for her: this is my grandson.", "Diga por ela: este é o meu neto.", "Ова е внук ми.", vnuk]
  - pt_only: "No Brasil quase ninguém comemora o dia do santo; aqui ele pode ser mais importante que o aniversário. E a porta fica aberta o dia todo."
