id: B1-09
protagonist: f
title: ["Earthquakes", "Terremotos"]
situation: ["A small tremor woke you at night. At work, Ana explains why Skopje shakes.", "Um tremor pequeno te acordou à noite. No trabalho, a Ana explica por que Skopje treme."]
learn: [b1-passive]
culture: —
items:
  - [pocustvuva, "Го почувствува ли…?", "Did you feel…? (informal)", "Você sentiu…?"]
  - [nokjeska, "ноќеска", "last night", "esta noite / ontem à noite"]
  - [krevetot, "креветот", "the bed", "a cama"]
  - [se-treseshe, "се тресеше", "was shaking", "tremia"]
  - [se-isplasiv, "се исплашив", "I got scared", "fiquei com medo"]
  - [cesto, "често", "often", "frequentemente / muitas vezes"]
  - [ploci, "плочи", "plates (tectonic)", "placas", {rare: true}]
  - [se-dvizat, "се движат", "(they) move", "se movem"]
  - [se-gradat, "се градат", "are built", "são construídos"]
  - [pravila, "правила", "rules", "regras"]
  - [bezbedna, "безбедна", "safe (feminine)", "segura"]
dialogue:
  - [ana, "Го почувствува ли земјотресот ноќеска?", "Did you feel the earthquake last night?", "Você sentiu o terremoto ontem à noite?"]
  - [protagonist, "Да! Креветот се тресеше. Се исплашив.", "Yes! The bed was shaking. I got scared.", "Senti! A cama tremia. Fiquei com medo."]
  - [ana, "Беше мал. Тука често се тресе.", "It was a small one. It shakes here often.", "Foi pequeno. Aqui treme com frequência."]
  - [protagonist, "Зошто?", "Why?", "Por quê?"]
  - [ana, "Балканот е меѓу плочи што се движат.", "The Balkans sit between plates that move.", "Os Bálcãs ficam entre placas que se movem."]
  - [protagonist, "А нашата зграда безбедна ли е?", "And is our building safe?", "E o nosso prédio é seguro?"]
  - [ana, "После 1963 зградите се градат според строги правила.", "Since 1963 buildings are built to strict rules.", "Depois de 1963 os prédios são construídos com regras rígidas."]
  - [protagonist, "Тоа ме смирува.", "That calms me down.", "Isso me acalma."]
teach:
  - ask: ["Ask if she felt the earthquake last night.", "Pergunte se ela sentiu o terremoto ontem à noite.", "Го почувствува ли земјотресот ноќеска?", pocustvuva, zemjotres, nokjeska]
  - ask: ["Say: the bed was shaking.", "Diga: a cama tremia.", "Креветот се тресеше.", krevetot, se-treseshe]
  - ask: ["Say: I got scared.", "Diga: fiquei com medo.", "Се исплашив.", se-isplasiv]
  - ask: ["Say: it shakes here often.", "Diga: aqui treme com frequência.", "Тука често се тресе.", cesto]
  - ask: ["Say: plates that move.", "Diga: placas que se movem.", "Плочи што се движат.", ploci, se-dvizat]
  - note: ["'Се' makes the passive: се градат — are built; се продава — is sold. The doer is left out.", "'Се' faz a voz passiva: се градат — são construídos; се продава — vende-se. Quem faz fica de fora."]
  - ask: ["Say: buildings are built to rules.", "Diga: os prédios são construídos com regras.", "Зградите се градат според правила.", se-gradat, pravila]
  - ask: ["Ask: is our building safe?", "Pergunte: o nosso prédio é seguro?", "Нашата зграда безбедна ли е?", bezbedna]
  - note: ["Small tremors are common in North Macedonia. If one is strong: get under a sturdy table, away from windows, and don't take the lift.", "Tremores pequenos são comuns na Macedônia do Norte. Se for forte: debaixo de uma mesa firme, longe das janelas, e nada de elevador."]
  - pt_only: "Para quem nunca sentiu terremoto no Brasil, o primeiro susto é garantido — e depois vira assunto de café."
