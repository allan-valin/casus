id: A1-04
protagonist: m
title: [The corner shop, O mercadinho]
situation: ["Downstairs there is a small shop, the маркет. Dragan, the owner, greets everyone.", "Embaixo do prédio há uma lojinha, o маркет. Dragan, o dono, cumprimenta todo mundo."]
learn: [a1-numbers, a1-imam]
culture: Shopkeepers say Повелете to everyone
items:
  - [leb, "леб", "bread", "pão", {rare: true}]
  - [mleko, "млеко", "milk", "leite", {rare: true}]
  - [voda, "вода", "water", "água"]
  - [imate-li, "Имате ли…?", "Do you have…? (formal)", "O senhor tem…? (formal)"]
  - [imame, "Имаме", "We have", "Temos"]
  - [eden, "еден", "one (with a masculine word)", "um"]
  - [dve, "две", "two (with feminine and neuter words)", "duas / dois"]
  - [ve-molam, "ве молам", "please (formal)", "por favor (formal)"]
  - [uste-nesto, "Уште нешто?", "Anything else?", "Mais alguma coisa?"]
  - [toa-e-se, "Тоа е сѐ", "That's all", "É só isso"]
  - [kolku-cini, "Колку чини?", "How much is it?", "Quanto custa?"]
  - [denari, "денари", "denars (the money)", "dinares (a moeda)", {rare: true}]
  - [sto, "сто", "a hundred", "cem"]
  - [kese, "кесе", "a (plastic) bag", "uma sacolinha", {rare: true}]
  - [prijatno, "Пријатно!", "Have a nice day! / Enjoy!", "Bom dia! / Bom proveito!", {rare: true}]
dialogue:
  - [dragan, "Повелете! Добар ден!", "Welcome! Good day!", "Pois não! Bom dia!"]
  - [protagonist, "Добар ден. Имате ли леб?", "Good day. Do you have bread?", "Bom dia. O senhor tem pão?"]
  - [dragan, "Имаме. Еден леб?", "We have. One loaf?", "Temos. Um pão?"]
  - [protagonist, "Да, еден леб и две млека, ве молам.", "Yes, one loaf and two milks, please.", "Sim, um pão e dois leites, por favor."]
  - [dragan, "Уште нешто?", "Anything else?", "Mais alguma coisa?"]
  - [protagonist, "Вода. Тоа е сѐ. Колку чини?", "Water. That's all. How much is it?", "Água. É só isso. Quanto custa?"]
  - [dragan, "Сто и дваесет денари. Кесе?", "A hundred and twenty denars. A bag?", "Cento e vinte dinares. Sacolinha?"]
  - [protagonist, "Не, благодарам.", "No, thank you.", "Não, obrigado."]
  - [dragan, "Нема зошто. Пријатно!", "You're welcome. Have a nice day!", "De nada. Tenha um bom dia!"]
teach:
  - note: ["Shopkeepers greet you with 'Повелете!' — 'please, come in, how can I help'. You already know it from Mrs Stojanovska.", "Os vendedores recebem você com 'Повелете!' — 'pois não, entre'. Você já conhece da senhora Stojanovska."]
  - ask: ["Ask Dragan if he has bread.", "Pergunte ao Dragan se ele tem pão.", "Имате ли леб?", imate-li, leb]
  - line: [dragan, imame]
  - ask: ["He says 'we have'. How?", "Ele diz 'temos'. Como?", "Имаме.", imame]
  - note: ["Numbers agree: 'еден леб' (one bread), but 'две млека' (two milks) — 'две' with feminine and neuter words.", "Os números concordam: 'еден леб' (um pão), mas 'две млека' (dois leites) — 'две' com palavras femininas e neutras."]
  - ask: ["Ask for one loaf of bread, please.", "Peça um pão, por favor.", "Еден леб, ве молам.", eden, leb, ve-molam]
  - ask: ["Ask for two milks.", "Peça dois leites.", "Две млека, ве молам.", dve, mleko, ve-molam]
  - ask: ["And water.", "E água.", "И вода.", i, voda]
  - line: [dragan, uste-nesto]
  - ask: ["Say that's all.", "Diga que é só isso.", "Тоа е сѐ.", toa-e-se]
  - build: [kolku-cini, ["чини?", "Колку чини?"]]
  - ask: ["Ask how much it is.", "Pergunte quanto custa.", "Колку чини?", kolku-cini]
  - note: ["The money is the denar. 'Сто' is a hundred: 'сто денари'.", "A moeda é o dinar. 'Сто' é cem: 'сто денари'."]
  - ask: ["Say: a hundred denars.", "Diga: cem dinares.", "Сто денари.", sto, denari]
  - ask: ["He offers a bag. Say no, thank you.", "Ele oferece uma sacolinha. Diga não, obrigado.", "Не, благодарам.", blagodaram]
  - ask: ["Ask him for a bag, please.", "Peça uma sacolinha, por favor.", "Кесе, ве молам.", kese, ve-molam]
  - note: ["'Пријатно!' wishes a good day when you leave — and 'enjoy your meal' at the table.", "'Пријатно!' deseja bom dia na despedida — e 'bom proveito' à mesa."]
  - ask: ["Wish him a nice day as you leave.", "Deseje um bom dia ao sair.", "Пријатно!", prijatno]
  - pt_only: "Nada de CPF na nota: aqui ninguém pergunta. E a sacolinha às vezes é cobrada."
