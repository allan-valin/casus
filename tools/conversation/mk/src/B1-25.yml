id: B1-25
protagonist: f
title: ["Somebody, nobody", "Alguém, ninguém"]
situation: ["Your keys are gone. Bojan helps you search the flat.", "Suas chaves sumiram. O Bojan ajuda a procurar no apartamento."]
learn: [b1-indefinite]
culture: —
items:
  - [klucevite, "клучевите", "the keys", "as chaves"]
  - [nikade, "никаде", "nowhere", "em lugar nenhum"]
  - [nekade, "некаде", "somewhere", "em algum lugar"]
  - [nekoj, "некој", "someone", "alguém"]
  - [nikoj-ne, "никој не", "nobody", "ninguém"]
  - [pobaraj, "Побарај", "Look for (informal)", "Procura"]
  - [vo-dzebot, "во џебот", "in the pocket", "no bolso", {rare: true}]
  - [jaknata, "јакната", "the jacket", "o casaco"]
  - [gi-najdov, "Ги најдов!", "I found them!", "Achei!"]
  - [bilo-sto, "било што", "anything", "qualquer coisa"]
dialogue:
  - [protagonist, "Ги нема клучевите! Ги барам насекаде.", "The keys are gone! I'm looking everywhere.", "As chaves sumiram! Estou procurando em todo lugar."]
  - [bojan, "Можеби некој ги зел?", "Maybe someone took them?", "Será que alguém pegou?"]
  - [protagonist, "Никој не беше тука.", "Nobody was here.", "Ninguém esteve aqui."]
  - [bojan, "Тогаш се некаде во станот.", "Then they're somewhere in the flat.", "Então estão em algum lugar no apartamento."]
  - [protagonist, "Ги нема никаде!", "They're nowhere!", "Não estão em lugar nenhum!"]
  - [bojan, "Побарај во џебот на јакната.", "Look in the jacket pocket.", "Procura no bolso do casaco."]
  - [protagonist, "...Ги најдов! Срам ме е.", "...Found them! I'm embarrassed.", "...Achei! Que vergonha."]
  - [bojan, "Секому му се случува. Било што, само не паника!", "It happens to everyone. Anything, just no panic!", "Acontece com todo mundo. Qualquer coisa, só não entra em pânico!"]
teach:
  - note: ["Pairs: некој / никој (someone / nobody), нешто / ништо, некаде / никаде (somewhere / nowhere). The никој-words need 'не' with the verb: 'никој не беше тука'.", "Pares: некој / никој (alguém / ninguém), нешто / ништо, некаде / никаде (em algum lugar / em lugar nenhum). As palavras com ни- pedem 'не' no verbo: 'никој не беше тука'."]
  - ask: ["Say: the keys are gone!", "Diga: as chaves sumiram!", "Ги нема клучевите!", klucevite]
  - ask: ["Bojan: maybe someone took them?", "O Bojan: será que alguém pegou?", "Можеби некој ги зел?", nekoj]
  - ask: ["Say: nobody was here.", "Diga: ninguém esteve aqui.", "Никој не беше тука.", nikoj-ne]
  - ask: ["Say: they're somewhere in the flat.", "Diga: estão em algum lugar no apartamento.", "Се некаде во станот.", nekade]
  - ask: ["Say: they're nowhere!", "Diga: não estão em lugar nenhum!", "Ги нема никаде!", nikade]
  - ask: ["Bojan: look in the jacket pocket.", "O Bojan: procura no bolso do casaco.", "Побарај во џебот на јакната.", pobaraj, vo-dzebot, jaknata]
  - ask: ["Say: I found them!", "Diga: achei!", "Ги најдов!", gi-najdov]
  - ask: ["Say: anything, just no panic!", "Diga: qualquer coisa, só não entra em pânico!", "Било што, само не паника!", bilo-sto]
  - ask: ["Say: I don't have anything.", "Diga: não tenho nada.", "Немам ништо.", nemam, nisto]
