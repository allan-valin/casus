id: B2-09
protagonist: f
title: ["The universe", "O universo"]
situation: ["A public night at the observatory. The guide is Goran's cousin; Bojan came along.", "Uma noite aberta no observatório. O guia é primo do Goran; o Bojan foi junto."]
learn: [b2-prefixes]
culture: —
items:
  - [galaksija, "галаксија", "galaxy", "galáxia", {rare: true}]
  - [svetlosna-godina, "светлосна година", "light year", "ano-luz", {rare: true}]
  - [patuva, "патува", "travels", "viaja"]
  - [doagja, "доаѓа", "comes, arrives", "chega"]
  - [izgasnala, "изгаснала", "gone out, died (feminine, reportedly)", "apagada / extinta", {rare: true}]
  - [mozebi-vekje, "можеби веќе", "maybe already", "talvez já"]
  - [ja-gledame, "ја гледаме", "we see it", "a gente vê"]
  - [vo-minatoto, "во минатото", "in the past", "no passado"]
  - [ogromen, "огромен", "huge (masculine)", "enorme"]
  - [se-cuvstvuvam-mala, "се чувствувам мала", "I feel small (a woman)", "me sinto pequena"]
dialogue:
  - [bojan, "Онаа светлина таму е друга галаксија — Андромеда.", "That light over there is another galaxy — Andromeda.", "Aquela luz ali é outra galáxia — Andrômeda."]
  - [protagonist, "Колку е далеку?", "How far is it?", "Quão longe fica?"]
  - [bojan, "Околу два и пол милиони светлосни години.", "About two and a half million light years.", "Uns dois milhões e meio de anos-luz."]
  - [protagonist, "Значи светлината патува толку долго до нас?", "So the light travels that long to reach us?", "Então a luz viaja todo esse tempo até a gente?"]
  - [bojan, "Да. Ја гледаме како била во минатото.", "Yes. We see it as it was in the past.", "Sim. A gente vê como ela era no passado."]
  - [protagonist, "А некоја ѕвезда можеби веќе изгаснала?", "And some star might already have gone out?", "E alguma estrela talvez já tenha se apagado?"]
  - [bojan, "Можеби. Вселената е огромна.", "Maybe. The universe is huge.", "Talvez. O universo é enorme."]
  - [protagonist, "Се чувствувам многу мала.", "I feel very small.", "Me sinto muito pequena."]
teach:
  - ask: ["Say: another galaxy.", "Diga: outra galáxia.", "Друга галаксија.", galaksija]
  - ask: ["Ask: how far is it?", "Pergunte: quão longe fica?", "Колку е далеку?", daleku]
  - ask: ["Say: millions of light years.", "Diga: milhões de anos-luz.", "Милиони светлосни години.", milioni, svetlosna-godina]
  - note: ["Prefixes again: оди (goes) → доаѓа (comes), заминува (leaves), изгаснува (goes out); патува (travels) → допатува (arrives after travelling).", "Prefixos de novo: оди (vai) → доаѓа (vem), заминува (parte), изгаснува (apaga); патува (viaja) → допатува (chega depois de viajar)."]
  - ask: ["Say: the light travels to us.", "Diga: a luz viaja até a gente.", "Светлината патува до нас.", patuva]
  - ask: ["Say: we see it as it was in the past.", "Diga: a gente vê como era no passado.", "Ја гледаме како била во минатото.", ja-gledame, vo-minatoto]
  - ask: ["Ask: maybe it has already gone out?", "Pergunte: talvez já tenha se apagado?", "Можеби веќе изгаснала?", mozebi-vekje, izgasnala]
  - ask: ["Say: the universe is huge.", "Diga: o universo é enorme.", "Вселената е огромна.", ogromen]
  - ask: ["Say: I feel very small.", "Diga: me sinto muito pequena.", "Се чувствувам многу мала.", se-cuvstvuvam-mala]
  - ask: ["Say: the light comes from far away.", "Diga: a luz vem de longe.", "Светлината доаѓа од далеку.", doagja]
  - note: ["Andromeda is the nearest large galaxy, about 2.5 million light years away: its light left before there were humans. Bojan's 'била' is the reported form — he knows it from science, not from seeing it.", "Andrômeda é a grande galáxia mais próxima, a cerca de 2,5 milhões de anos-luz: a luz dela saiu antes de existirem humanos. O 'била' do Bojan é a forma de 'ouvi dizer' — ele sabe pela ciência, não porque viu."]
