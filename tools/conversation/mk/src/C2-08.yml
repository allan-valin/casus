id: C2-08
protagonist: m
title: ["The book club", "Clube de leitura"]
situation: ["Ana's book club reads a Macedonian novel. Your turn to speak.", "O clube de leitura da Ana lê um romance macedônio. Sua vez de falar."]
learn: [c2-set-phrases]
culture: —
items:
  - [romanot, "романот", "the novel", "o romance"]
  - [glavniot-lik, "главниот лик", "the main character", "o protagonista"]
  - [krajot, "крајот", "the ending", "o final"]
  - [me-dopre, "ме допре", "touched me", "me tocou"]
  - [na-prv-pogled, "на прв поглед", "at first sight", "à primeira vista"]
  - [megju-redovite, "меѓу редовите", "between the lines", "nas entrelinhas"]
  - [simbolizira, "симболизира", "symbolises", "simboliza", {rare: true}]
  - [otvoren-kraj, "отворен крај", "open ending", "final aberto"]
  - [sekoj-si-go-cita, "секој си го чита на свој начин", "everyone reads it their own way", "cada um lê do seu jeito"]
  - [preporacuvam, "препорачувам", "I recommend", "recomendo"]
dialogue:
  - [ana, "Што мислиш за романот?", "What do you think of the novel?", "O que você achou do romance?"]
  - [protagonist, "На прв поглед — едноставна приказна. Но меѓу редовите има многу.", "At first sight — a simple story. But there's a lot between the lines.", "À primeira vista — uma história simples. Mas nas entrelinhas tem muita coisa."]
  - [ana, "А главниот лик?", "And the main character?", "E o protagonista?"]
  - [protagonist, "Ме допре. Тој заминува и се враќа — како многу луѓе тука.", "He touched me. He leaves and comes back — like many people here.", "Me tocou. Ele vai embora e volta — como muita gente aqui."]
  - [goran, "Мене крајот не ми се допадна. Отворен крај!", "I didn't like the ending. An open ending!", "Eu não gostei do final. Final aberto!"]
  - [protagonist, "Отворениот крај симболизира избор. Секој си го чита на свој начин.", "The open ending symbolises choice. Everyone reads it their own way.", "O final aberto simboliza escolha. Cada um lê do seu jeito."]
  - [ana, "Убаво кажано. Би го препорачал?", "Nicely said. Would you recommend it?", "Bem dito. Você recomendaria?"]
  - [protagonist, "Препорачувам — особено на странци што сакаат да ја разберат земјата.", "I recommend it — especially to foreigners who want to understand the country.", "Recomendo — principalmente para estrangeiros que querem entender o país."]
teach:
  - ask: ["Say: the novel.", "Diga: o romance.", "Романот.", romanot]
  - ask: ["Say: at first sight.", "Diga: à primeira vista.", "На прв поглед.", na-prv-pogled]
  - ask: ["Say: between the lines.", "Diga: nas entrelinhas.", "Меѓу редовите.", megju-redovite]
  - ask: ["Say: the main character touched me.", "Diga: o protagonista me tocou.", "Главниот лик ме допре.", glavniot-lik, me-dopre]
  - ask: ["Say: an open ending.", "Diga: um final aberto.", "Отворен крај.", otvoren-kraj]
  - ask: ["Say: the ending.", "Diga: o final.", "Крајот.", krajot]
  - ask: ["Say: it symbolises choice.", "Diga: simboliza escolha.", "Симболизира избор.", simbolizira]
  - ask: ["Say: everyone reads it their own way.", "Diga: cada um lê do seu jeito.", "Секој си го чита на свој начин.", sekoj-si-go-cita]
  - ask: ["Say: I recommend it.", "Diga: recomendo.", "Препорачувам.", preporacuvam]
  - note: ["Talking about books uses fixed expressions that also work in Portuguese: на прв поглед (à primeira vista), меѓу редовите (nas entrelinhas), отворен крај (final aberto).", "Falar de livros usa expressões fixas que existem também em português: на прв поглед (à primeira vista), меѓу редовите (nas entrelinhas), отворен крај (final aberto)."]
