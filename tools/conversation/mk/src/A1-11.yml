id: A1-11
protagonist: f
title: [The office, O escritório]
situation: ["First day at the software company. Ana, the project manager, welcomes you.", "Primeiro dia na empresa de software. Ana, a gerente de projeto, recebe você."]
learn: [a1-pres-a, a1-pronouns]
culture: A handshake, not a kiss, at the first meeting
items:
  - [dobro-utro, "Добро утро", "Good morning", "Bom dia"]
  - [koleska, "колешка", "colleague (a woman)", "colega (mulher)"]
  - [programerka, "програмерка", "programmer (a woman)", "programadora", {rare: true}]
  - [milo-mi-e, "Мило ми е", "Nice to meet you", "Muito prazer"]
  - [od-kade-ste, "Од каде сте?", "Where are you from? (formal)", "De onde a senhora é?"]
  - [grad, "град", "city", "cidade"]
  - [golem, "голем", "big (masculine)", "grande"]
  - [masa, "маса", "desk, table", "mesa"]
  - [mojata, "мојата", "my (with a feminine word)", "a minha"]
  - [vasiot, "вашиот", "your (formal, with a masculine word)", "o seu"]
  - [kompjuter, "компјутер", "computer", "computador", {rare: true}]
  - [rabotam, "работам", "I work", "eu trabalho"]
dialogue:
  - [ana, "Добро утро! Вие сте новата колешка?", "Good morning! Are you the new colleague?", "Bom dia! Você é a nova colega?"]
  - [protagonist, "Да, добро утро. Јас сум програмерка.", "Yes, good morning. I'm a programmer.", "Sim, bom dia. Sou programadora."]
  - [ana, "Мило ми е. Јас сум Ана.", "Nice to meet you. I'm Ana.", "Muito prazer. Eu sou a Ana."]
  - [protagonist, "Мило ми е, Ана.", "Nice to meet you, Ana.", "Muito prazer, Ana."]
  - [ana, "Од каде сте?", "Where are you from?", "De onde você é?"]
  - [protagonist, "Од Бразил, од Сао Паоло.", "From Brazil, from São Paulo.", "Do Brasil, de São Paulo."]
  - [ana, "Сао Паоло е многу голем град!", "São Paulo is a very big city!", "São Paulo é uma cidade muito grande!"]
  - [protagonist, "Да. Ова е мојата маса?", "Yes. Is this my desk?", "Sim. Esta é a minha mesa?"]
  - [ana, "Да, тука работите. Ова е вашиот компјутер.", "Yes, you work here. This is your computer.", "Sim, você trabalha aqui. Este é o seu computador."]
teach:
  - note: ["At work you meet people with a handshake and 'Мило ми е' — nice to meet you.", "No trabalho as pessoas se apresentam com um aperto de mão e 'Мило ми е' — muito prazer."]
  - pt_only: "Nada de beijinho no primeiro encontro de trabalho: aperto de mão. O beijo fica para os amigos."
  - ask: ["Greet her in the morning.", "Cumprimente-a de manhã.", "Добро утро!", dobro-utro]
  - ask: ["Say you're a programmer.", "Diga que é programadora.", "Јас сум програмерка.", jas-sum, programerka]
  - ask: ["Say nice to meet you.", "Diga muito prazer.", "Мило ми е.", milo-mi-e]
  - ask: ["Ask her, politely, where she is from.", "Pergunte com educação de onde ela é.", "Од каде сте?", od-kade-ste]
  - ask: ["Answer: from Brazil, from São Paulo.", "Responda: do Brasil, de São Paulo.", "Од Бразил, од Сао Паоло.", od-brazil]
  - ask: ["Say: São Paulo is a very big city.", "Diga: São Paulo é uma cidade muito grande.", "Сао Паоло е многу голем град.", golem, grad]
  - note: ["'My' agrees with the thing: 'мојата маса' (my desk), 'вашиот компјутер' (your computer).", "'Meu' concorda com a coisa: 'мојата маса' (a minha mesa), 'вашиот компјутер' (o seu computador)."]
  - ask: ["Ask: is this my desk?", "Pergunte: esta é a minha mesa?", "Ова е мојата маса?", mojata, masa]
  - ask: ["Say for her: this is your computer.", "Diga por ela: este é o seu computador.", "Ова е вашиот компјутер.", vasiot, kompjuter]
  - ask: ["Say: I work here.", "Diga: eu trabalho aqui.", "Работам тука.", rabotam, tuka]
  - ask: ["Introduce yourself to another colleague: I'm the new colleague.", "Apresente-se a outra colega: eu sou a nova colega.", "Јас сум новата колешка.", koleska]
