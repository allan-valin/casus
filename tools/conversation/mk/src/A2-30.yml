id: A2-30
protagonist: m
title: ["Jokes", "Piadas"]
situation: ["Your birthday party, a year after you arrived. Everyone comes — and A2 comes back.", "Sua festa de aniversário, um ano depois de chegar. Todo mundo vem — e o A2 volta."]
learn: []
culture: Itar Pejo, the trickster
items:
  - [srekjen-rodenden, "Среќен роденден!", "Happy birthday!", "Feliz aniversário!"]
  - [vic, "виц", "joke", "piada"]
  - [slusajte, "Слушајте!", "Listen! (to several people)", "Escutem!"]
  - [lukav, "лукав", "cunning (masculine)", "esperto / malandro", {rare: true}]
  - [selanec, "селанец", "villager, peasant", "camponês", {rare: true}]
  - [laze, "лаже", "lies, tricks", "engana / mente"]
  - [bogatite, "богатите", "the rich", "os ricos"]
  - [kako-nasiot, "како нашиот", "like our (masculine)", "como o nosso"]
  - [duvaj, "Дувај!", "Blow! (informal)", "Assopra!"]
  - [svekjickite, "свеќичките", "the candles", "as velinhas", {rare: true}]
  - [edna-godina, "една година", "one year", "um ano"]
dialogue:
  - [vera, "Среќен роденден!", "Happy birthday!", "Feliz aniversário!"]
  - [ana, "Честит роденден! Една година во Скопје!", "Happy birthday! One year in Skopje!", "Parabéns! Um ano em Skopje!"]
  - [goran, "Слушајте, еден виц за Итар Пејо!", "Listen, a joke about Itar Pejo!", "Escutem, uma piada do Itar Pejo!"]
  - [marko, "Пак Итар Пејо...", "Itar Pejo again...", "Itar Pejo de novo..."]
  - [protagonist, "Кој е Итар Пејо?", "Who's Itar Pejo?", "Quem é Itar Pejo?"]
  - [goran, "Лукав селанец. Секогаш ги лаже богатите.", "A cunning villager. He always tricks the rich.", "Um camponês malandro. Sempre engana os ricos."]
  - [protagonist, "Како нашиот Педро Маласартес!", "Like our Pedro Malasartes!", "Como o nosso Pedro Malasartes!"]
  - [vera, "Ајде, торта! Дувај ги свеќичките!", "Come on, cake! Blow out the candles!", "Vamos, bolo! Assopra as velinhas!"]
teach:
  - ask: ["Wish someone a happy birthday.", "Deseje feliz aniversário.", "Среќен роденден!", srekjen-rodenden]
  - ask: ["Say: one year in Skopje!", "Diga: um ano em Skopje!", "Една година во Скопје!", edna-godina]
  - ask: ["Goran calls everyone: listen, a joke!", "O Goran chama todos: escutem, uma piada!", "Слушајте, еден виц!", slusajte, vic]
  - ask: ["Ask who Itar Pejo is.", "Pergunte quem é Itar Pejo.", "Кој е Итар Пејо?", koj-e-toj]
  - ask: ["Say: a cunning villager.", "Diga: um camponês malandro.", "Лукав селанец.", lukav, selanec]
  - ask: ["Say: he always tricks the rich.", "Diga: sempre engana os ricos.", "Секогаш ги лаже богатите.", laze, bogatite]
  - ask: ["Say: like our Pedro Malasartes!", "Diga: como o nosso Pedro Malasartes!", "Како нашиот Педро Маласартес!", kako-nasiot]
  - ask: ["Vera: blow out the candles!", "A Vera: assopra as velinhas!", "Дувај ги свеќичките!", duvaj, svekjickite]
  - note: ["Itar Pejo ('Clever Pejo') is the folk trickster of Macedonian stories: a poor villager who outwits the rich, the judge, the Ottoman bey. Brazil has the same figure in Pedro Malasartes.", "Itar Pejo ('Pejo Esperto') é o malandro das histórias populares macedônias: um camponês pobre que passa a perna no rico, no juiz, no bei otomano. O Brasil tem a mesma figura no Pedro Malasartes."]
  - note: ["End of A2. Some more from the whole level.", "Fim do A2. Mais um pouco de todo o nível."]
  - ask: ["Tell Ana what you did yesterday: I went to the market.", "Conte à Ana o que fez ontem: fui à feira.", "Вчера отидов на пазар.", vcera, otidov, pazar]
  - ask: ["At the bank: I need an account.", "No banco: preciso de uma conta.", "Ми треба сметка.", mi-treba, smetka]
  - ask: ["At the restaurant: I'll pay!", "No restaurante: eu pago!", "Јас ќе платам!", ke-platam]
  - ask: ["To Marko: give it to me!", "Para o Marko: me dá!", "Дај ми го!", daj-mi-go]
