id: B2-03
protagonist: f
title: ["DNA", "DNA"]
situation: ["Photos at Bojan's grandmother's. Everyone says you look like someone.", "Fotos na casa da avó do Bojan. Todo mundo diz que alguém parece com alguém."]
learn: [b2-perfective-imperfect]
culture: —
items:
  - [lici-na, "личи на", "looks like", "parece com"]
  - [gen, "ген", "gene", "gene", {rare: true}]
  - [gi-nasledil, "ги наследил", "inherited them", "herdou"]
  - [ocite-od, "очите од", "the eyes from", "os olhos de"]
  - [kosa, "коса", "hair", "cabelo"]
  - [kudrava, "кадрава", "curly (feminine)", "cacheado", {rare: true}]
  - [baba, "баба", "grandmother", "avó"]
  - [dedo, "дедо", "grandfather", "avô"]
  - [pomalku, "помалку", "less", "menos"]
  - [karakter, "карактер", "character, personality", "temperamento"]
dialogue:
  - [baba, "Види, Бојан личи на дедо му!", "Look, Bojan looks like his grandfather!", "Olha, o Bojan parece com o avô!"]
  - [protagonist, "Навистина! Истите очи.", "Really! The same eyes.", "É verdade! Os mesmos olhos."]
  - [bojan, "Очите ги наследив од дедо, а косата од баба.", "I got the eyes from grandpa, and the hair from grandma.", "Os olhos eu herdei do avô, e o cabelo da avó."]
  - [protagonist, "Кадравата коса? Тоа е ген.", "The curly hair? That's a gene.", "O cabelo cacheado? Isso é gene."]
  - [baba, "А карактерот — од мене, за жал!", "And the character — from me, unfortunately!", "E o temperamento — de mim, infelizmente!"]
  - [protagonist, "Јас личам на татко ми, но помалку тврдоглава.", "I look like my father, but less stubborn.", "Eu pareço com meu pai, mas menos teimosa."]
  - [bojan, "Помалку? Не би рекол!", "Less? I wouldn't say so!", "Menos? Não diria!"]
  - [protagonist, "Тоа е друг ген!", "That's a different gene!", "Isso é outro gene!"]
teach:
  - ask: ["Say: Bojan looks like his grandfather.", "Diga: o Bojan parece com o avô.", "Бојан личи на дедо му.", lici-na, dedo]
  - ask: ["Say: the same eyes.", "Diga: os mesmos olhos.", "Истите очи.", ocite]
  - note: ["Aspect again: наследуваше (was inheriting, over time) vs наследи (inherited, done). Telling a family's story you mix both: 'од баба ја наследив косата' — I got the hair from grandma.", "Aspecto de novo: наследуваше (ia herdando) vs наследи (herdou, de vez). Contando história de família você mistura os dois: 'од баба ја наследив косата' — herdei o cabelo da avó."]
  - ask: ["Say: I got the eyes from grandpa.", "Diga: os olhos eu herdei do avô.", "Очите ги наследив од дедо.", ocite-od, gi-nasledil]
  - ask: ["Say: and the hair from grandma.", "Diga: e o cabelo da avó.", "А косата од баба.", kosa, baba]
  - ask: ["Say: curly hair.", "Diga: cabelo cacheado.", "Кадрава коса.", kudrava]
  - ask: ["Say: that's a gene.", "Diga: isso é gene.", "Тоа е ген.", gen]
  - ask: ["Say: the character, from me!", "Diga: o temperamento, de mim!", "Карактерот, од мене!", karakter]
  - ask: ["Say: I look like my father, but less stubborn.", "Diga: pareço com meu pai, mas menos teimosa.", "Личам на татко ми, но помалку тврдоглава.", tatko, pomalku]
  - note: ["Genes are passed from both parents; some traits — like curly hair — often skip a generation in what we notice, which is why grandparents see themselves in grandchildren.", "Os genes vêm dos dois pais; alguns traços — como cabelo cacheado — muitas vezes parecem pular uma geração, por isso os avós se veem nos netos."]
