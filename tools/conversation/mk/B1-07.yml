steps:
- type: narrator
  text:
    en: Goran has news — second-hand. Listen to the conversation; you don't need to understand it yet.
    pt: O Goran tem novidade — de segunda mão. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: goran
    text: Слушна ли? Елена се свршила!
    meaning:
      en: Did you hear? Elena got engaged, apparently!
      pt: Ficou sabendo? A Elena ficou noiva, parece!
  - speaker: protagonist
    text: Не верувам! Со кого?
    meaning:
      en: I don't believe it! With whom?
      pt: Não acredito! Com quem?
  - speaker: goran
    text: Наводно со некој од Охрид. Се запознале на летување.
    meaning:
      en: Supposedly with someone from Ohrid. They met on holiday, they say.
      pt: Supostamente com alguém de Ohrid. Teriam se conhecido nas férias.
  - speaker: protagonist
    text: А свадбата кога е?
    meaning:
      en: And when's the wedding?
      pt: E o casamento é quando?
  - speaker: goran
    text: Велат дека ќе била во јуни.
    meaning:
      en: They say it's to be in June.
      pt: Dizem que seria em junho.
  - speaker: protagonist
    text: Кој ти кажа?
    meaning:
      en: Who told you?
      pt: Quem te contou?
  - speaker: goran
    text: Марко. А нему му кажала сестра ѝ.
    meaning:
      en: Marko. And her sister told him, apparently.
      pt: O Marko. E a ele teria contado a irmã dela.
  - speaker: protagonist
    text: Значи, ништо не е сигурно!
    meaning:
      en: So nothing is certain!
      pt: Então nada é certo!
- type: narrator
  text:
    en: 'Macedonian marks news you didn''t witness: the л-form without ''е''. ''Елена се свршила'' — Elena got engaged (so I hear). ''Се свршила е'' would never be said. Portuguese uses ''teria'', ''parece
      que'', ''dizem que''.'
    pt: 'O macedônio marca a notícia que você não presenciou: a forma em -л sem o verbo ''ser''. ''Елена се свршила'' — a Elena ficou noiva (pelo que ouvi). O português usa ''teria'', ''parece que'', ''dizem
      que''.'
