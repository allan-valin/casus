steps:
- type: narrator
  text:
    en: Vera, eighty now, is moving in with her daughter. She signs the flat over to her grandson. Listen to the conversation; you don't need to understand it yet.
    pt: A Vera, agora com oitenta anos, vai morar com a filha. Ela passa o apartamento para o neto. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Станот го препишувам на внук ми — подарок за жив, не оставина.
    meaning:
      en: I'm signing the flat over to my grandson — a gift while I'm alive, not an estate.
      pt: Estou passando o apartamento para o meu neto — doação em vida, não herança depois.
  - speaker: protagonist
    text: Зошто сега?
    meaning:
      en: Why now?
      pt: Por que agora?
  - speaker: vera
    text: Се преселувам кај ќерка ми. Нозете не ми дозволуваат скали.
    meaning:
      en: I'm moving to my daughter's. My legs don't allow stairs any more.
      pt: Vou morar com a minha filha. As pernas não deixam mais escada.
  - speaker: protagonist
    text: Ќе ми фали скалата без вас... без тебе.
    meaning:
      en: I'll miss the staircase without you.
      pt: Vou sentir falta da escada sem você.
  - speaker: vera
    text: И мене. Ти беше најдобриот сосед.
    meaning:
      en: Me too. You were the best neighbour.
      pt: Eu também. Você foi a melhor vizinha.
  - speaker: protagonist
    text: Дај да ти помогнам со кутиите.
    meaning:
      en: Let me help you with the boxes.
      pt: Deixa eu te ajudar com as caixas.
  - speaker: vera
    text: Остави ги на мене. Само земи ја оваа — џезвата за кафе.
    meaning:
      en: Leave them to me. Just take this one — the coffee pot.
      pt: Deixa comigo. Só pega esta — a cafeteira de café turco.
  - speaker: protagonist
    text: Џезвата? Од првиот ден?
    meaning:
      en: The coffee pot? From the first day?
      pt: A cafeteira? Do primeiro dia?
  - speaker: vera
    text: Наследство. За тебе.
    meaning:
      en: An inheritance. For you.
      pt: Herança. Para você.
