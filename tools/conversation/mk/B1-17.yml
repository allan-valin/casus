steps:
- type: narrator
  text:
    en: You wait outside the cinema. Ana doesn't come. You call her. Listen to the conversation; you don't need to understand it yet.
    pt: Você espera na frente do cinema. A Ana não aparece. Você liga. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Ана, каде си? Те чекам пред кино!
    meaning:
      en: Ana, where are you? I'm waiting for you outside the cinema!
      pt: Ana, cadê você? Estou te esperando na frente do cinema!
  - speaker: ana
    text: Пред кино? Мислев дека е утре.
    meaning:
      en: Outside the cinema? I thought it was tomorrow.
      pt: Na frente do cinema? Achei que era amanhã.
  - speaker: protagonist
    text: Не, ти ми рече дека е во среда. Денеска е среда.
    meaning:
      en: No, you told me it was on Wednesday. Today is Wednesday.
      pt: Não, você me disse que era na quarta. Hoje é quarta.
  - speaker: ana
    text: Јас ти реков во четврток!
    meaning:
      en: I told you Thursday!
      pt: Eu te disse quinta!
  - speaker: protagonist
    text: Сигурна си? Ми напиша „среда“ во пораката.
    meaning:
      en: Are you sure? You wrote 'Wednesday' in the message.
      pt: Tem certeza? Você escreveu 'quarta' na mensagem.
  - speaker: ana
    text: Чекај да видам... Ах, во право си. Грешка моја. Извини!
    meaning:
      en: Wait, let me look... Ah, you're right. My mistake. Sorry!
      pt: Peraí, deixa eu ver... Ah, você tem razão. Erro meu. Desculpa!
  - speaker: protagonist
    text: Нема проблем. Утре тогаш?
    meaning:
      en: No problem. Tomorrow then?
      pt: Sem problema. Amanhã então?
  - speaker: ana
    text: Утре. И јас ги плаќам билетите.
    meaning:
      en: Tomorrow. And I'm paying for the tickets.
      pt: Amanhã. E eu pago os ingressos.
