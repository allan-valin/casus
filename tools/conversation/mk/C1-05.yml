steps:
- type: narrator
  text:
    en: Your first tax return in Macedonia. The Public Revenue Office. Listen to the conversation; you don't need to understand it yet.
    pt: Sua primeira declaração de imposto na Macedônia. A Receita Pública. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sluzbenicka
    text: Дали имавте дополнителни приходи минатата година?
    meaning:
      en: Did you have any additional income last year?
      pt: A senhora teve renda extra no ano passado?
  - speaker: protagonist
    text: Да, мал проект за една фирма од Бразил.
    meaning:
      en: Yes, a small project for a company from Brazil.
      pt: Sim, um projeto pequeno para uma empresa do Brasil.
  - speaker: sluzbenicka
    text: Тогаш поднесувате годишна пријава. Може електронски.
    meaning:
      en: Then you file an annual return. It can be done electronically.
      pt: Então a senhora entrega a declaração anual. Pode ser eletrônica.
  - speaker: protagonist
    text: Кога истекува рокот?
    meaning:
      en: When does the deadline expire?
      pt: Quando vence o prazo?
  - speaker: sluzbenicka
    text: Проверете го на страницата — секоја година е објавен. Ако задоцните, има да платите казна.
    meaning:
      en: Check it on the website — it's published every year. If you're late, you'll have to pay a fine.
      pt: Confira no site — é publicado todo ano. Se atrasar, vai ter que pagar multa.
  - speaker: protagonist
    text: А ако одам лично?
    meaning:
      en: And if I go in person?
      pt: E se eu for pessoalmente?
  - speaker: sluzbenicka
    text: Има да чекате цел ден. Електронски е побрзо.
    meaning:
      en: You'll be waiting all day. Online is faster.
      pt: Vai ficar esperando o dia inteiro. Pela internet é mais rápido.
  - speaker: protagonist
    text: Ќе ја поднесам електронски и ќе ја зачувам потврдата.
    meaning:
      en: I'll file it online and keep the confirmation.
      pt: Vou entregar pela internet e guardar o comprovante.
