steps:
- type: narrator
  text:
    en: Dinner with Marko. The bill comes, and so does the fight over who pays. Listen to the conversation; you don't need to understand it yet.
    pt: Jantar com o Marko. Chega a conta, e com ela a briga para ver quem paga. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: konobar
    text: Повелете. Што ќе нарачате?
    meaning:
      en: Good evening. What will you have?
      pt: Boa noite. O que vão pedir?
  - speaker: marko
    text: Две шопски салати и скара за двајца.
    meaning:
      en: Two shopska salads and a grill for two.
      pt: Duas saladas shopska e um grelhado para dois.
  - speaker: protagonist
    text: Келнер, сметката, ве молам!
    meaning:
      en: Waiter, the bill, please!
      pt: Garçom, a conta, por favor!
  - speaker: marko
    text: Јас ќе платам.
    meaning:
      en: I'll pay.
      pt: Eu pago.
  - speaker: protagonist
    text: Не, јас ќе платам! Ти плати минатиот пат.
    meaning:
      en: No, I'll pay! You paid last time.
      pt: Não, eu pago! Você pagou da última vez.
  - speaker: marko
    text: Добро, следниот пат ти.
    meaning:
      en: Fine, next time it's you.
      pt: Tá bom, da próxima vez é você.
  - speaker: protagonist
    text: Колку бакшиш?
    meaning:
      en: How much of a tip?
      pt: Quanto de gorjeta?
  - speaker: marko
    text: Заокружи. Или десет проценти, ако ти се допадна.
    meaning:
      en: Round it up. Or ten per cent, if you liked it.
      pt: Arredonda. Ou dez por cento, se você gostou.
