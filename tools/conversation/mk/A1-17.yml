steps:
- type: narrator
  text:
    en: A hot summer day. You open the window and the door. Mrs Stojanovska is horrified. Listen to the conversation; you don't need to understand it yet.
    pt: Um dia quente de verão. Você abre a janela e a porta. A senhora Stojanovska fica horrorizada. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Добро утро! Ох, отворен е прозорецот!
    meaning:
      en: Good morning! Oh, the window is open!
      pt: Bom dia! Ai, a janela está aberta!
  - speaker: protagonist
    text: Да, многу е жешко денеска.
    meaning:
      en: Yes, it's very hot today.
      pt: Sim, está muito quente hoje.
  - speaker: vera
    text: Но и вратата е отворена. Има промаја!
    meaning:
      en: But the door is open too. There's a draft!
      pt: Mas a porta também está aberta. Tem corrente de ar!
  - speaker: protagonist
    text: Промаја? Што е тоа?
    meaning:
      en: A draft? What is that?
      pt: Corrente de ar? O que é isso?
  - speaker: vera
    text: Ветер од прозорецот до вратата. Ќе настинете!
    meaning:
      en: Wind from the window to the door. You'll catch a cold!
      pt: Vento da janela até a porta. A senhora vai se resfriar!
  - speaker: protagonist
    text: Во Бразил нема промаја. Имаме клима.
    meaning:
      en: In Brazil there's no draft. We have air conditioning.
      pt: No Brasil não tem isso. A gente tem ar-condicionado.
  - speaker: vera
    text: Клима? Уште полошо! Затворете ја вратата, ве молам.
    meaning:
      en: Air conditioning? Even worse! Close the door, please.
      pt: Ar-condicionado? Pior ainda! Feche a porta, por favor.
  - speaker: protagonist
    text: Добро, веднаш.
    meaning:
      en: All right, right away.
      pt: Está bem, agora mesmo.
- type: narrator
  text:
    en: Many Macedonians believe a draft — air moving between two open windows or a window and a door — gives you a cold, a stiff neck, even worse. Air conditioning is suspect too. Close one of them when
      an older person asks.
    pt: Muitos macedônios acreditam que a corrente de ar — o ar passando entre duas janelas, ou janela e porta — dá resfriado, torcicolo e coisa pior. Ar-condicionado também é suspeito. Feche uma delas
      quando uma pessoa mais velha pedir.
