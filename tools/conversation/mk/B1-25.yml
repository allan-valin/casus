steps:
- type: narrator
  text:
    en: Your keys are gone. Bojan helps you search the flat. Listen to the conversation; you don't need to understand it yet.
    pt: Suas chaves sumiram. O Bojan ajuda a procurar no apartamento. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Ги нема клучевите! Ги барам насекаде.
    meaning:
      en: The keys are gone! I'm looking everywhere.
      pt: As chaves sumiram! Estou procurando em todo lugar.
  - speaker: bojan
    text: Можеби некој ги зел?
    meaning:
      en: Maybe someone took them?
      pt: Será que alguém pegou?
  - speaker: protagonist
    text: Никој не беше тука.
    meaning:
      en: Nobody was here.
      pt: Ninguém esteve aqui.
  - speaker: bojan
    text: Тогаш се некаде во станот.
    meaning:
      en: Then they're somewhere in the flat.
      pt: Então estão em algum lugar no apartamento.
  - speaker: protagonist
    text: Ги нема никаде!
    meaning:
      en: They're nowhere!
      pt: Não estão em lugar nenhum!
  - speaker: bojan
    text: Побарај во џебот на јакната.
    meaning:
      en: Look in the jacket pocket.
      pt: Procura no bolso do casaco.
  - speaker: protagonist
    text: '...Ги најдов! Срам ме е.'
    meaning:
      en: '...Found them! I''m embarrassed.'
      pt: '...Achei! Que vergonha.'
  - speaker: bojan
    text: Секому му се случува. Било што, само не паника!
    meaning:
      en: It happens to everyone. Anything, just no panic!
      pt: Acontece com todo mundo. Qualquer coisa, só não entra em pânico!
- type: narrator
  text:
    en: 'Pairs: некој / никој (someone / nobody), нешто / ништо, некаде / никаде (somewhere / nowhere). The никој-words need ''не'' with the verb: ''никој не беше тука''.'
    pt: 'Pares: некој / никој (alguém / ninguém), нешто / ништо, некаде / никаде (em algum lugar / em lugar nenhum). As palavras com ни- pedem ''не'' no verbo: ''никој не беше тука''.'
