steps:
- type: narrator
  text:
    en: Marko's father, Metodija, offers you his home-made rakija. Listen to the conversation; you don't need to understand it yet.
    pt: O pai do Marko, Metodija, oferece a rakija que ele mesmo faz. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: metodija
    text: Ова е домашна ракија. Повели!
    meaning:
      en: This is home-made rakija. Here you go!
      pt: Esta é rakija caseira. Toma!
  - speaker: protagonist
    text: Благодарам. Само малку.
    meaning:
      en: Thank you. Just a little.
      pt: Obrigada. Só um pouco.
  - speaker: metodija
    text: На здравје!
    meaning:
      en: Cheers!
      pt: Saúde!
  - speaker: protagonist
    text: На здравје!
    meaning:
      en: Cheers!
      pt: Saúde!
  - speaker: metodija
    text: Не, не — погледни ме во очи!
    meaning:
      en: No, no — look me in the eyes!
      pt: Não, não — olhe nos meus olhos!
  - speaker: protagonist
    text: Извинете! На здравје!
    meaning:
      en: Sorry! Cheers!
      pt: Desculpe! Saúde!
  - speaker: metodija
    text: Е, сега може. Уште малку?
    meaning:
      en: There, now it's right. A little more?
      pt: Pronto, agora sim. Mais um pouquinho?
  - speaker: protagonist
    text: Не, благодарам, јака е!
    meaning:
      en: No, thank you, it's strong!
      pt: Não, obrigada, é forte!
  - speaker: metodija
    text: Од сливи е. Сам ја правам.
    meaning:
      en: It's from plums. I make it myself.
      pt: É de ameixa. Eu mesmo faço.
- type: narrator
  text:
    en: Metodija is older, so he says ти to you at once; you answer with Вие. That is normal — the older person decides.
    pt: O Metodija é mais velho, então já usa ти com você; você responde com Вие. É normal — quem decide é o mais velho.
