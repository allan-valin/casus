steps:
- type: narrator
  text:
    en: Vera asks what the Portuguese word on your mug means. Listen to the conversation; you don't need to understand it yet.
    pt: A Vera pergunta o que significa a palavra em português na sua caneca. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Што пишува на шолјата? „Саудаде“?
    meaning:
      en: What does it say on the mug? 'Saudade'?
      pt: O que está escrito na caneca? 'Saudade'?
  - speaker: protagonist
    text: Тоа е кога некој или нешто многу ти недостига. Но не е само тага.
    meaning:
      en: It's when you miss someone or something very much. But it isn't just sadness.
      pt: É quando você sente muita falta de alguém ou de alguma coisa. Mas não é só tristeza.
  - speaker: vera
    text: Тага и радост, заедно во еден збор?
    meaning:
      en: Sadness and joy, together in one word?
      pt: Tristeza e alegria, juntas numa palavra?
  - speaker: protagonist
    text: Точно. Копнеж, со убаво сеќавање.
    meaning:
      en: Exactly. Longing, with a beautiful memory.
      pt: Isso. Anseio, com uma lembrança bonita.
  - speaker: vera
    text: Кај нас велат „жал“ — за некој што го нема.
    meaning:
      en: Here we say 'жал' — for someone who is gone.
      pt: Aqui a gente diz 'жал' — por alguém que não está.
  - speaker: protagonist
    text: Значи и вие сте имале таков збор!
    meaning:
      en: So you have a word like that too!
      pt: Então vocês também têm uma palavra assim!
  - speaker: vera
    text: Имаме. Ми недостига брат ми — тоа е жал.
    meaning:
      en: We do. I miss my brother — that's жал.
      pt: Temos. Sinto falta do meu irmão — isso é жал.
  - speaker: protagonist
    text: А мене ми недостигаат моите. Убав збор — и тежок.
    meaning:
      en: And I miss my family. A beautiful word — and a heavy one.
      pt: E eu sinto falta dos meus. Palavra bonita — e pesada.
