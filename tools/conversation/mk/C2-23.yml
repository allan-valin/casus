- type: narrator
  text:
    en: '''Ми недостига'' works like ''it is lacking to me'': the thing missed is the subject. For several: ''ми недостигаат''. ''Жал'' is an older, poetic word for sorrowful longing — the closest Macedonian
      comes to saudade.'
    pt: '''Ми недостига'' funciona como ''me falta'': o que falta é o sujeito. Para vários: ''ми недостигаат''. ''Жал'' é uma palavra mais antiga e poética para o pesar com anseio — o mais perto que o macedônio
      chega da saudade.'
