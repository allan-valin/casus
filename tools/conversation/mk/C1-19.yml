steps:
- type: narrator
  text:
    en: The registry office. The registrar checks your documents before the date can be set. Listen to the conversation; you don't need to understand it yet.
    pt: O cartório de registro civil. A oficial confere os seus documentos antes de marcar a data. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sluzbenicka
    text: Дајте ми ги документите, ве молам.
    meaning:
      en: Give me the documents, please.
      pt: Me entregue os documentos, por favor.
  - speaker: protagonist
    text: 'Еве: пасош, извод од матична книга, со апостил.'
    meaning:
      en: 'Here: passport, birth certificate, with an apostille.'
      pt: 'Aqui: passaporte, certidão de nascimento, com apostila.'
  - speaker: sluzbenicka
    text: Изводот е на португалски. Мора да биде преведен од овластен преведувач.
    meaning:
      en: The certificate is in Portuguese. It must be translated by a sworn translator.
      pt: A certidão está em português. Precisa ser traduzida por tradutor juramentado.
  - speaker: protagonist
    text: Преводот е тука. Го направи преведувачот од списокот.
    meaning:
      en: The translation is here. The translator from the list did it.
      pt: A tradução está aqui. Foi o tradutor da lista que fez.
  - speaker: sluzbenicka
    text: Добро. А сведоците?
    meaning:
      en: Good. And the witnesses?
      pt: Bom. E as testemunhas?
  - speaker: bojan
    text: Кумовите — Марко и неговата сопруга. Ги имаат личните карти.
    meaning:
      en: Our кумови — Marko and his wife. They have their ID cards.
      pt: Os padrinhos — o Marko e a esposa. Eles têm as identidades.
  - speaker: sluzbenicka
    text: Тогаш ќе ви ја закажам датата. Сабота, петнаесетти?
    meaning:
      en: Then I'll book the date for you. Saturday the fifteenth?
      pt: Então vou marcar a data para vocês. Sábado, dia quinze?
  - speaker: protagonist
    text: Совршено!
    meaning:
      en: Perfect!
      pt: Perfeito!
