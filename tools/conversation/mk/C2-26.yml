steps:
- type: narrator
  text:
    en: 'The evening course''s last-year reunion: everyone reads a poem aloud. You chose Koneski. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Reencontro do curso noturno: cada um lê um poema em voz alta. Você escolheu Koneski. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: profesorka
    text: Повелете, прочитајте на глас.
    meaning:
      en: Please, read aloud.
      pt: Por favor, leia em voz alta.
  - speaker: protagonist
    text: Избрав Конески. Овие стихови ме погодија најмногу.
    meaning:
      en: I chose Koneski. These lines struck me the most.
      pt: Escolhi Koneski. Estes versos me atingiram mais.
  - speaker: profesorka
    text: Зошто?
    meaning:
      en: Why?
      pt: Por quê?
  - speaker: protagonist
    text: Зборува за јазикот како за дом. Тоа и јас го чувствувам, на мој начин.
    meaning:
      en: He speaks of the language as a home. I feel that too, in my way.
      pt: Ele fala da língua como de uma casa. Eu sinto isso também, do meu jeito.
  - speaker: profesorka
    text: Акцентот ти е убав. Само римата — внимавај на крајот на стихот.
    meaning:
      en: Your stress is lovely. Only the rhyme — watch the end of the line.
      pt: Seu acento está bonito. Só a rima — cuidado com o fim do verso.
  - speaker: protagonist
    text: Би сакал да го преведам на португалски.
    meaning:
      en: I'd like to translate it into Portuguese.
      pt: Gostaria de traduzir para o português.
  - speaker: profesorka
    text: Поезијата не се преведува — се препева.
    meaning:
      en: Poetry isn't translated — it's re-sung.
      pt: Poesia não se traduz — se recria.
  - speaker: protagonist
    text: Тогаш ќе го препеам. Тоа е мојот омилен.
    meaning:
      en: Then I'll re-sing it. It's my favourite.
      pt: Então vou recriar. É o meu favorito.
