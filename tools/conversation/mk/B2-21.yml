steps:
- type: narrator
  text:
    en: 'Darko brings baklava to the office: his Albanian neighbour''s family celebrated Bajram. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'O Darko traz baklava para o escritório: a família do vizinho albanês dele comemorou o Bajram. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: darko
    text: Повелете баклава! Комшијата ми ја донесе — славеа Бајрам.
    meaning:
      en: Have some baklava! My neighbour brought it — they celebrated Bayram.
      pt: Peguem baklava! O vizinho que me trouxe — eles comemoraram o Bajram.
  - speaker: protagonist
    text: Тие се муслимани?
    meaning:
      en: They're Muslims?
      pt: Eles são muçulmanos?
  - speaker: darko
    text: Да. Ние сме православни. На Велигден ние им носиме јајца.
    meaning:
      en: Yes. We're Orthodox. At Easter we bring them eggs.
      pt: Sim. A gente é ortodoxa. Na Páscoa a gente leva ovos para eles.
  - speaker: protagonist
    text: Значи си честитате празници.
    meaning:
      en: So you wish each other happy holidays.
      pt: Então vocês se cumprimentam nas festas.
  - speaker: darko
    text: Секако. Различна вера, исти обичаи — кафе, слатко, почит.
    meaning:
      en: Of course. Different faith, same customs — coffee, sweets, respect.
      pt: Claro. Fé diferente, mesmos costumes — café, doce, respeito.
  - speaker: protagonist
    text: Може едно парченце?
    meaning:
      en: May I have a little piece?
      pt: Posso um pedacinho?
  - speaker: darko
    text: Едно? Земи две!
    meaning:
      en: One? Take two!
      pt: Um? Pega dois!
  - speaker: protagonist
    text: Убав обичај.
    meaning:
      en: A lovely custom.
      pt: Que costume bonito.
