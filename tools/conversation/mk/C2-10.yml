steps:
- type: narrator
  text:
    en: A bad week at Vardar Soft. Everyone has a proverb ready. Listen to the conversation; you don't need to understand it yet.
    pt: Uma semana ruim na Vardar Soft. Todo mundo tem um provérbio pronto. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: darko
    text: Го пуштивме апдејтот за еден ден. Сѐ се скрши!
    meaning:
      en: We pushed the update out in one day. Everything broke!
      pt: Soltamos a atualização em um dia. Quebrou tudo!
  - speaker: nikolovski
    text: Брзата кучка слепи ги раѓа.
    meaning:
      en: Haste makes waste.
      pt: A pressa é inimiga da perfeição.
  - speaker: protagonist
    text: Има поговорка за секоја ситуација!
    meaning:
      en: There's a saying for every situation!
      pt: Tem um ditado para cada situação!
  - speaker: ana
    text: Ајде да го поправиме вечерва?
    meaning:
      en: Shall we fix it tonight?
      pt: Vamos consertar hoje à noite?
  - speaker: protagonist
    text: Не. Утрото е помудро од вечерта. Утре, одморни.
    meaning:
      en: No. Sleep on it. Tomorrow, rested.
      pt: Não. A noite é boa conselheira. Amanhã, descansados.
  - speaker: nikolovski
    text: Навреме речено.
    meaning:
      en: Well said, and at the right time.
      pt: Dito na hora certa.
  - speaker: ana
    text: А Дарко, кој цела ноќ не спиеше?
    meaning:
      en: And Darko, who didn't sleep all night?
      pt: E o Darko, que não dormiu a noite toda?
  - speaker: protagonist
    text: Тивка вода брег рони — тој најмногу работеше. Утре сѐ се исправи.
    meaning:
      en: Still waters run deep — he worked the most. Tomorrow everything got fixed.
      pt: Quem fica quieto trabalha — ele foi quem mais trabalhou. No dia seguinte tudo foi corrigido.
