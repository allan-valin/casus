- type: narrator
  text:
    en: Exaggeration that is affectionate in Brazilian Portuguese can sound literal and harsh translated word for word. Explain at once, apologise formally to older people (простете), and the moment usually
      turns into a story they will retell.
    pt: O exagero carinhoso do português brasileiro pode soar literal e duro traduzido ao pé da letra. Explique na hora, peça desculpas formais aos mais velhos (простете), e o momento costuma virar história
      que eles vão recontar.
