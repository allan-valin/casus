steps:
- type: narrator
  text:
    en: At lunch you joke that Bojan's grandmother 'feeds people to death'. Silence. Listen to the conversation; you don't need to understand it yet.
    pt: No almoço você brinca que a avó do Bojan 'mata as pessoas de tanto dar comida'. Silêncio. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Бабо, вие луѓето ги убивате со храна!
    meaning:
      en: Grandma, you kill people with food!
      pt: Vó, a senhora mata as pessoas de tanta comida!
  - speaker: baba
    text: '...Убивам?'
    meaning:
      en: '...I kill?'
      pt: '...Eu mato?'
  - speaker: bojan
    text: Тишина... Мислам дека се навредила.
    meaning:
      en: Silence... I think she got offended.
      pt: Silêncio... Acho que ela se ofendeu.
  - speaker: protagonist
    text: Не мислев така! Кај нас тоа е пофалба — дека храната е премногу и вкусна.
    meaning:
      en: I didn't mean it like that! Back home that's a compliment — that the food is too much and delicious.
      pt: Não quis dizer isso! Lá em casa isso é elogio — que a comida é muita e gostosa.
  - speaker: bojan
    text: Збор по збор не се преведува.
    meaning:
      en: Word for word, it doesn't translate.
      pt: Ao pé da letra, não se traduz.
  - speaker: protagonist
    text: Ве молам, простете, бабо.
    meaning:
      en: Please forgive me, grandma.
      pt: Por favor, me perdoe, vó.
  - speaker: baba
    text: Нема врска, душо. Сега кога ми објасни — смешно било!
    meaning:
      en: Never mind, dear. Now that you've explained — it was funny after all!
      pt: Não tem problema, querida. Agora que você explicou — até que foi engraçado!
  - speaker: protagonist
    text: 'Научив лекција: шегите не патуваат.'
    meaning:
      en: 'I learned a lesson: jokes don''t travel.'
      pt: 'Aprendi a lição: piada não viaja.'
