steps:
- type: narrator
  text:
    en: Sara has news. A week later, everybody has advice. Listen to the conversation; you don't need to understand it yet.
    pt: A Sara tem uma notícia. Uma semana depois, todo mundo tem conselho. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sara
    text: Седни. Имам вест... бремена сум!
    meaning:
      en: Sit down. I have news... I'm pregnant!
      pt: Senta. Tenho uma notícia... estou grávida!
  - speaker: protagonist
    text: Што? Ќе имаме бебе?!
    meaning:
      en: What? We're having a baby?!
      pt: O quê? Vamos ter um bebê?!
  - speaker: sara
    text: Да! Терминот е во мај. Бев кај гинеколог.
    meaning:
      en: Yes! The due date is in May. I went to the gynaecologist.
      pt: Sim! A data prevista é em maio. Fui na ginecologista.
  - speaker: vera
    text: Честитам! Да ви е живо и здраво! Сега има да јадеш за двајца.
    meaning:
      en: Congratulations! May it be alive and healthy! Now you'll have to eat for two.
      pt: Parabéns! Que venha com saúde! Agora vai ter que comer por dois.
  - speaker: svekrva-s
    text: И не кревај тешко! И без промаја!
    meaning:
      en: And don't lift anything heavy! And no drafts!
      pt: E não levanta peso! E nada de corrente de ar!
  - speaker: sara
    text: Секој има совет...
    meaning:
      en: Everyone has advice...
      pt: Todo mundo tem conselho...
  - speaker: protagonist
    text: 'Мојата мајка од Бразил вели: само одмор и бразилски грав.'
    meaning:
      en: 'My mother in Brazil says: just rest and Brazilian beans.'
      pt: 'Minha mãe do Brasil diz: só descanso e feijão.'
  - speaker: sara
    text: Добро. Ќе ги слушам сите — и ништо нема да правам!
    meaning:
      en: Fine. I'll listen to all of them — and do nothing!
      pt: Tá bom. Vou ouvir todo mundo — e não vou fazer nada!
