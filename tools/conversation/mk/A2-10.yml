steps:
- type: narrator
  text:
    en: Easter Sunday. Mrs Stojanovska meets you on the stairs with red eggs. Listen to the conversation; you don't need to understand it yet.
    pt: Domingo de Páscoa. A senhora Stojanovska encontra você na escada com ovos vermelhos. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Христос воскресе!
    meaning:
      en: Christ is risen!
      pt: Cristo ressuscitou!
  - speaker: protagonist
    text: Воистина воскресе!
    meaning:
      en: Truly he is risen!
      pt: Verdadeiramente ressuscitou!
  - speaker: vera
    text: Браво, научивте! Повелете, црвено јајце.
    meaning:
      en: Well done, you learned! Here, a red egg.
      pt: Muito bem, aprendeu! Tome, um ovo vermelho.
  - speaker: protagonist
    text: Зошто се црвени јајцата?
    meaning:
      en: Why are the eggs red?
      pt: Por que os ovos são vermelhos?
  - speaker: vera
    text: Првото јајце секогаш се бои црвено. На Велики четврток.
    meaning:
      en: The first egg is always dyed red. On Holy Thursday.
      pt: O primeiro ovo sempre se pinta de vermelho. Na Quinta-Feira Santa.
  - speaker: vera
    text: Ајде да се чукнеме!
    meaning:
      en: Let's crack eggs!
      pt: Vamos bater os ovos!
  - speaker: protagonist
    text: Моето е цело... вашето се скрши!
    meaning:
      en: Mine is whole... yours broke!
      pt: O meu está inteiro... o seu quebrou!
  - speaker: vera
    text: Ха! Вие сте победникот оваа година.
    meaning:
      en: Ha! You're the winner this year.
      pt: Ha! O senhor é o vencedor deste ano.
- type: narrator
  text:
    en: 'At Easter the greeting changes: one says ''Христос воскресе!'' and the other answers ''Воистина воскресе!'' People use it instead of hello until Ascension Day. Orthodox Easter follows the old calendar
      and often falls a week or more after Catholic Easter.'
    pt: 'Na Páscoa o cumprimento muda: um diz ''Христос воскресе!'' e o outro responde ''Воистина воскресе!'' Usa-se no lugar de ''oi'' até a Ascensão. A Páscoa ortodoxa segue o calendário antigo e muitas
      vezes cai uma semana ou mais depois da católica.'
