- type: narrator
  text:
    en: A Red Cross blood drive in the square. Ana signs you up. Listen to the conversation; you don't need to understand it yet.
    pt: Uma campanha de doação de sangue da Cruz Vermelha na praça. A Ana inscreve você. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Црвен крст собира крв. Ајде, ќе дадеме и ние!
    meaning:
      en: The Red Cross is collecting blood. Come on, we'll give too!
      pt: A Cruz Vermelha está coletando sangue. Vamos, a gente doa também!
  - speaker: protagonist
    text: Боли ли?
    meaning:
      en: Does it hurt?
      pt: Dói?
  - speaker: ana
    text: Ма какво боли! Само убод.
    meaning:
      en: Hurt, come on! Just a prick.
      pt: Que nada! Só uma picada.
  - speaker: protagonist
    text: Која е мојата крвна група? Не знам.
    meaning:
      en: What's my blood type? I don't know.
      pt: Qual é o meu tipo sanguíneo? Não sei.
  - speaker: volonter-c
    text: Ќе ја провериме. Седнете тука.
    meaning:
      en: We'll check it. Sit here.
      pt: A gente verifica. Sente aqui.
  - speaker: volonter-c
    text: Готово. Ви се врти ли?
    meaning:
      en: Done. Do you feel dizzy?
      pt: Pronto. Está tonto?
  - speaker: protagonist
    text: Малку... но добро сум.
    meaning:
      en: A little... but I'm fine.
      pt: Um pouco... mas estou bem.
  - speaker: volonter-c
    text: Еднаш годишно е доволно. Спасивте живот!
    meaning:
      en: Once a year is enough. You've saved a life!
      pt: Uma vez por ano basta. O senhor salvou uma vida!
  - speaker: ana
    text: Сега си вистински волонтер!
    meaning:
      en: Now you're a real volunteer!
      pt: Agora você é um voluntário de verdade!
