steps:
- type: narrator
  text:
    en: The heater, the water heater and the washing machine at once. The lights go out. Listen to the conversation; you don't need to understand it yet.
    pt: O aquecedor, o boiler e a máquina de lavar ao mesmo tempo. A luz cai. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Госпоѓо Стојановска, нема струја во станот!
    meaning:
      en: Mrs Stojanovska, there's no power in the flat!
      pt: Senhora Stojanovska, acabou a luz no apartamento!
  - speaker: vera
    text: Дали ги вклучивте греалката и бојлерот заедно?
    meaning:
      en: Did you switch on the heater and the water heater together?
      pt: A senhora ligou o aquecedor e o boiler juntos?
  - speaker: protagonist
    text: Да... и машината за перење.
    meaning:
      en: Yes... and the washing machine.
      pt: Sim... e a máquina de lavar.
  - speaker: vera
    text: Е, тоа е премногу. Осигурувачот падна.
    meaning:
      en: Well, that's too much. The fuse went.
      pt: Pois é, é demais. O disjuntor caiu.
  - speaker: protagonist
    text: Каде е осигурувачот?
    meaning:
      en: Where's the fuse box?
      pt: Onde fica o disjuntor?
  - speaker: vera
    text: Во ходникот. Исклучете ја машината, па кренете го осигурувачот.
    meaning:
      en: In the hall. Switch off the machine, then put the fuse back up.
      pt: No corredor. Desligue a máquina, depois levante o disjuntor.
  - speaker: protagonist
    text: Сега има струја!
    meaning:
      en: Now there's power!
      pt: Agora voltou a luz!
  - speaker: vera
    text: Не вклучувајте сѐ одеднаш.
    meaning:
      en: Don't switch everything on at once.
      pt: Não ligue tudo de uma vez.
