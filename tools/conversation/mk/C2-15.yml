steps:
- type: narrator
  text:
    en: A museum guide tells the story of a medieval tsar. A visitor from abroad objects. You listen. Listen to the conversation; you don't need to understand it yet.
    pt: Um guia de museu conta a história de um tsar medieval. Um visitante estrangeiro discorda. Você ouve. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vodic-m
    text: Цар Самоил владееше од Охрид во десеттиот век.
    meaning:
      en: Tsar Samuel ruled from Ohrid in the tenth century.
      pt: O tsar Samuel reinou a partir de Ohrid no século dez.
  - speaker: klient
    text: Но кај нас тоа се учи поинаку!
    meaning:
      en: But where I'm from, that's taught differently!
      pt: Mas no meu país isso é ensinado diferente!
  - speaker: vodic-m
    text: Тоа е прашање на толкување. Историчарите не се согласуваат.
    meaning:
      en: It's a question of interpretation. Historians don't agree.
      pt: É questão de interpretação. Os historiadores não concordam.
  - speaker: protagonist
    text: Што велат изворите?
    meaning:
      en: What do the sources say?
      pt: O que dizem as fontes?
  - speaker: vodic-m
    text: Изворите се византиски, а секоја страна ги чита од свое гледиште.
    meaning:
      en: The sources are Byzantine, and each side reads them from its own point of view.
      pt: As fontes são bizantinas, e cada lado lê do seu ponto de vista.
  - speaker: klient
    text: Темата е чувствителна.
    meaning:
      en: The topic is sensitive.
      pt: O tema é delicado.
  - speaker: vodic-m
    text: Да. Затоа зборуваме со почит кон двете страни.
    meaning:
      en: Yes. That's why we speak with respect for both sides.
      pt: Sim. Por isso falamos com respeito aos dois lados.
  - speaker: protagonist
    text: Јас не сум историчарка. Слушам и учам.
    meaning:
      en: I'm not a historian. I listen and learn.
      pt: Não sou historiadora. Ouço e aprendo.
