- type: narrator
  text:
    en: Medieval history is claimed by several Balkan nations, and a guide's story can differ from what neighbours learn at school. As a guest, ask about sources, listen to both sides, and keep your own
      verdict.
    pt: A história medieval é reivindicada por várias nações dos Bálcãs, e a versão do guia pode diferir do que os vizinhos aprendem na escola. Como visitante, pergunte das fontes, ouça os dois lados, e
      guarde a sua conclusão.
