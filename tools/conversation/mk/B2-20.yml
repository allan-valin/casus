steps:
- type: narrator
  text:
    en: 'An angry client calls: the app crashed in front of his own boss. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Um cliente bravo liga: o aplicativo travou na frente do chefe dele. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: klient
    text: Имам жалба! Апликацијата падна пред мојот директор!
    meaning:
      en: I have a complaint! The app crashed in front of my director!
      pt: Tenho uma reclamação! O aplicativo caiu na frente do meu diretor!
  - speaker: protagonist
    text: Потполно ве разбирам. Ми е жал. Кога се случило?
    meaning:
      en: I completely understand. I'm sorry. When did it happen?
      pt: Entendo perfeitamente. Sinto muito. Quando aconteceu?
  - speaker: klient
    text: Утрово, во девет!
    meaning:
      en: This morning, at nine!
      pt: Hoje de manhã, às nove!
  - speaker: protagonist
    text: Проблемот веќе се проверува. Веднаш ќе ве известам.
    meaning:
      en: The problem is already being checked. I'll let you know right away.
      pt: O problema já está sendo verificado. Já vou informar o senhor.
  - speaker: klient
    text: Ова не смее да се случи пак.
    meaning:
      en: This must not happen again.
      pt: Isso não pode acontecer de novo.
  - speaker: protagonist
    text: Се согласувам. Ќе разговарам со г. Николовски за надомест.
    meaning:
      en: I agree. I'll speak with Mr Nikolovski about compensation.
      pt: Concordo. Vou conversar com o senhor Nikolovski sobre uma compensação.
  - speaker: klient
    text: '...Добро. Чекам одговор до пладне.'
    meaning:
      en: '...All right. I expect an answer by noon.'
      pt: '...Tá bom. Espero resposta até meio-dia.'
  - speaker: protagonist
    text: До пладне. Ви благодарам за трпението.
    meaning:
      en: By noon. Thank you for your patience.
      pt: Até meio-dia. Obrigado pela paciência.
