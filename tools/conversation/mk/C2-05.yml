steps:
- type: narrator
  text:
    en: Bojan's cousin from Bitola visits. You understand only half. Listen to the conversation; you don't need to understand it yet.
    pt: O primo do Bojan de Bitola vem visitar. Você entende só metade. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: bratucedot
    text: Ајде, што се врткаш? Седни да береме муабет!
    meaning:
      en: Come on, why are you fidgeting? Sit down and let's chat!
      pt: Vamos, por que está se mexendo? Senta para a gente bater papo!
  - speaker: protagonist
    text: Извини, не те разбрав добро. Повтори полека?
    meaning:
      en: Sorry, I didn't understand you well. Repeat slowly?
      pt: Desculpa, não te entendi direito. Repete devagar?
  - speaker: bojan
    text: Тој е од Битола. Таму различно зборуваат.
    meaning:
      en: He's from Bitola. They speak differently there.
      pt: Ele é de Bitola. Lá falam diferente.
  - speaker: protagonist
    text: Изговорот е многу поинаков.
    meaning:
      en: The pronunciation is very different.
      pt: A pronúncia é bem diferente.
  - speaker: bratucedot
    text: А, ама нашиот дијалект е основата на стандардниот јазик!
    meaning:
      en: Ah, but our dialect is the basis of the standard language!
      pt: Ah, mas o nosso dialeto é a base da língua padrão!
  - speaker: bojan
    text: Точно. Западните дијалекти — Прилеп, Битола, Велес.
    meaning:
      en: True. The western dialects — Prilep, Bitola, Veles.
      pt: Verdade. Os dialetos do oeste — Prilep, Bitola, Veles.
  - speaker: protagonist
    text: А источно, кај Струмица?
    meaning:
      en: And in the east, around Strumica?
      pt: E no leste, perto de Strumica?
  - speaker: bratucedot
    text: Таму — друга приказна! Секој крај си има свое.
    meaning:
      en: There — another story! Every region has its own.
      pt: Lá — outra história! Cada região tem o seu.
