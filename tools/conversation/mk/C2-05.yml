- type: narrator
  text:
    en: Standard Macedonian was built in 1945 on the west-central dialects (Prilep, Bitola, Kičevo, Veles) — which is why its stress falls on the third syllable from the end. Eastern and northern dialects
      differ more, in sounds and in words.
    pt: O macedônio padrão foi construído em 1945 sobre os dialetos do centro-oeste (Prilep, Bitola, Kičevo, Veles) — por isso o acento cai na antepenúltima. Os dialetos do leste e do norte diferem mais,
      nos sons e nas palavras.
