steps:
- type: narrator
  text:
    en: The sales have started. You go back to the jacket shop. Listen to the conversation; you don't need to understand it yet.
    pt: Começaram as liquidações. Você volta à loja de casacos. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Добар ден. Има ли попуст?
    meaning:
      en: Hello. Is there a discount?
      pt: Boa tarde. Tem desconto?
  - speaker: seller
    text: Да, сѐ е на попуст — дваесет проценти.
    meaning:
      en: Yes, everything is on sale — twenty per cent.
      pt: Sim, tudo em promoção — vinte por cento.
  - speaker: protagonist
    text: А оваа јакна?
    meaning:
      en: And this jacket?
      pt: E este casaco?
  - speaker: seller
    text: Таа е на половина цена. Беше четири илјади, сега две.
    meaning:
      en: That one is half price. It was four thousand, now two.
      pt: Esse está pela metade do preço. Era quatro mil, agora dois.
  - speaker: protagonist
    text: Супер! А чевлите?
    meaning:
      en: Great! And the shoes?
      pt: Ótimo! E os sapatos?
  - speaker: seller
    text: Чевлите — само десет проценти.
    meaning:
      en: The shoes — only ten per cent.
      pt: Os sapatos — só dez por cento.
  - speaker: protagonist
    text: Ќе размислам. Колку часа сте отворени?
    meaning:
      en: I'll think about it. How long are you open?
      pt: Vou pensar. Até que horas vocês ficam abertos?
  - speaker: seller
    text: До девет. Попустот трае три дена.
    meaning:
      en: Until nine. The sale lasts three days.
      pt: Até as nove. A promoção dura três dias.
