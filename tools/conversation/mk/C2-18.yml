steps:
- type: narrator
  text:
    en: A newspaper is writing about foreigners in Skopje. The journalist interviews you. Listen to the conversation; you don't need to understand it yet.
    pt: Um jornal está escrevendo sobre estrangeiros em Skopje. O jornalista entrevista você. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: novinar
    text: Зошто останавте во Скопје?
    meaning:
      en: Why did you stay in Skopje?
      pt: Por que o senhor ficou em Skopje?
  - speaker: protagonist
    text: Поради топлината на луѓето. Ме прифатија како домашен.
    meaning:
      en: Because of the warmth of the people. They accepted me like a local.
      pt: Pelo calor humano. Me acolheram como se eu fosse daqui.
  - speaker: novinar
    text: Најголемиот предизвик?
    meaning:
      en: The biggest challenge?
      pt: O maior desafio?
  - speaker: protagonist
    text: Бирократијата — и падежите што ги немате, ама ги имате во заменките!
    meaning:
      en: Bureaucracy — and the cases you don't have, but do have in the pronouns!
      pt: A burocracia — e os casos que vocês não têm, mas têm nos pronomes!
  - speaker: novinar
    text: А интеграцијата?
    meaning:
      en: And integration?
      pt: E a integração?
  - speaker: protagonist
    text: Интеграцијата почнува со јазикот. Тој е клучот за сѐ.
    meaning:
      en: Integration starts with the language. It's the key to everything.
      pt: A integração começa pela língua. Ela é a chave de tudo.
  - speaker: novinar
    text: Порака до другите странци?
    meaning:
      en: A message to other foreigners?
      pt: Um recado para outros estrangeiros?
  - speaker: protagonist
    text: Научете го јазикот, и пијте кафе со соседите.
    meaning:
      en: Learn the language, and drink coffee with your neighbours.
      pt: Aprendam a língua, e tomem café com os vizinhos.
  - speaker: novinar
    text: Смеам ли да ве цитирам?
    meaning:
      en: May I quote you?
      pt: Posso citar o senhor?
