steps:
- type: narrator
  text:
    en: A winter morning at the office. From the window, Vodno has disappeared. Listen to the conversation; you don't need to understand it yet.
    pt: Uma manhã de inverno no escritório. Da janela, o Vodno sumiu. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Погледни низ прозорецот. Не се гледа Водно.
    meaning:
      en: Look out of the window. You can't see Vodno.
      pt: Olha pela janela. Não dá para ver o Vodno.
  - speaker: protagonist
    text: Магла?
    meaning:
      en: Fog?
      pt: Neblina?
  - speaker: ana
    text: Не е магла. Тоа е загадување. Секоја зима е така.
    meaning:
      en: It's not fog. It's pollution. Every winter it's like this.
      pt: Não é neblina. É poluição. Todo inverno é assim.
  - speaker: protagonist
    text: Од што?
    meaning:
      en: From what?
      pt: Do quê?
  - speaker: ana
    text: Од дрвата во печките, од колите, од фабриките.
    meaning:
      en: From the firewood in the stoves, from the cars, from the factories.
      pt: Da lenha nos fogões, dos carros, das fábricas.
  - speaker: protagonist
    text: Треба ли маска?
    meaning:
      en: Do I need a mask?
      pt: Precisa de máscara?
  - speaker: ana
    text: Кога воздухот е лош, да.
    meaning:
      en: When the air is bad, yes.
      pt: Quando o ar está ruim, sim.
  - speaker: protagonist
    text: Денеска нема да шетам до работа.
    meaning:
      en: Today I won't walk to work.
      pt: Hoje não vou a pé para o trabalho.
  - speaker: ana
    text: Ни јас. Ќе одам со автобус.
    meaning:
      en: Me neither. I'll take the bus.
      pt: Nem eu. Vou de ônibus.
