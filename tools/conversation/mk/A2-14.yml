steps:
- type: narrator
  text:
    en: Marko wants to know how Skopje compares with São Paulo. Listen to the conversation; you don't need to understand it yet.
    pt: O Marko quer saber como Skopje se compara com São Paulo. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Кој град е поголем, Скопје или Сао Паоло?
    meaning:
      en: Which city is bigger, Skopje or São Paulo?
      pt: Qual cidade é maior, Skopje ou São Paulo?
  - speaker: protagonist
    text: Сао Паоло, многу поголем. Таму живеат дваесет милиони луѓе.
    meaning:
      en: São Paulo, much bigger. Twenty million people live there.
      pt: São Paulo, muito maior. Lá moram vinte milhões de pessoas.
  - speaker: marko
    text: Дваесет милиони! Цела Македонија има два милиони.
    meaning:
      en: Twenty million! All of Macedonia has two million.
      pt: Vinte milhões! A Macedônia inteira tem dois milhões.
  - speaker: protagonist
    text: Но Скопје е помирно.
    meaning:
      en: But Skopje is calmer.
      pt: Mas Skopje é mais tranquila.
  - speaker: marko
    text: А храната? Која е најдобра?
    meaning:
      en: And the food? Which is the best?
      pt: E a comida? Qual é a melhor?
  - speaker: protagonist
    text: Бразилската скара е најдобра на светот!
    meaning:
      en: Brazilian barbecue is the best in the world!
      pt: O churrasco brasileiro é o melhor do mundo!
  - speaker: marko
    text: Не, македонската! А ајварот?
    meaning:
      en: No, Macedonian! And ajvar?
      pt: Não, o macedônio! E o ajvar?
  - speaker: protagonist
    text: Добро, ајварот е подобар од сè.
    meaning:
      en: All right, ajvar is better than anything.
      pt: Tá bom, o ajvar é melhor que tudo.
- type: narrator
  text:
    en: 'Comparative: по- (поголем, bigger). Superlative: нај- (најголем, the biggest). ''Better'' and ''best'' are regular: подобар, најдобар.'
    pt: 'Comparativo: по- (поголем, maior). Superlativo: нај- (најголем, o maior). ''Melhor'' e ''o melhor'' são regulares: подобар, најдобар.'
