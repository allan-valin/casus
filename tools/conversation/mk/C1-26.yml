steps:
- type: narrator
  text:
    en: Coach Zoran is retiring after thirty years. The team asks you to give the speech. Listen to the conversation; you don't need to understand it yet.
    pt: O técnico Zoran se aposenta depois de trinta anos. A equipe pede para você fazer o discurso. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Драги пријатели, денеска нашиот тренер се пензионира.
    meaning:
      en: Dear friends, today our coach retires.
      pt: Queridos amigos, hoje o nosso técnico se aposenta.
  - speaker: protagonist
    text: Велат дека почнал во клубот пред триесет години, како играч.
    meaning:
      en: They say he started at the club thirty years ago, as a player.
      pt: Dizem que ele começou no clube há trinta anos, como jogador.
  - speaker: protagonist
    text: Тренирал генерации. Јас сум само еден од нив — и најлошиот.
    meaning:
      en: He trained generations. I'm just one of them — and the worst.
      pt: Treinou gerações. Eu sou só um deles — e o pior.
  - speaker: zoran
    text: Не е вистина!
    meaning:
      en: That's not true!
      pt: Não é verdade!
  - speaker: protagonist
    text: Тој никогаш не ни дозволи да се откажеме.
    meaning:
      en: He never let us give up.
      pt: Ele nunca deixou a gente desistir.
  - speaker: protagonist
    text: Неговиот наследник има големи патики да ги наполни.
    meaning:
      en: His successor has big shoes to fill.
      pt: O sucessor dele tem um tênis grande para calçar.
  - speaker: protagonist
    text: Зоране — со голема благодарност. Останувате во срцето на клубот.
    meaning:
      en: Zoran — with great gratitude. You stay in the heart of the club.
      pt: Zoran — com muita gratidão. O senhor fica no coração do clube.
  - speaker: marko
    text: За тренерот — наздравје!
    meaning:
      en: To the coach — cheers!
      pt: Ao técnico — saúde!
