steps:
- type: narrator
  text:
    en: Shoes, at last. Two pairs, two prices. Listen to the conversation; you don't need to understand it yet.
    pt: Sapatos, finalmente. Dois pares, dois preços. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Колку чинат овие?
    meaning:
      en: How much are these?
      pt: Quanto custam estes?
  - speaker: seller
    text: Тие се три илјади. Оние се две.
    meaning:
      en: Those are three thousand. Those over there are two.
      pt: Esses são três mil. Aqueles são dois.
  - speaker: protagonist
    text: Може да ги пробам оние?
    meaning:
      en: May I try those on?
      pt: Posso experimentar aqueles?
  - speaker: seller
    text: Секако. Кој број носите?
    meaning:
      en: Of course. What size do you wear?
      pt: Claro. Que número a senhora calça?
  - speaker: protagonist
    text: Триесет и осум.
    meaning:
      en: Thirty-eight.
      pt: Trinta e oito.
  - speaker: protagonist
    text: Тесни се. Имате ли поголем број?
    meaning:
      en: They're tight. Do you have a bigger size?
      pt: Estão apertados. Tem um número maior?
  - speaker: seller
    text: Овој модел нема. Но онаа боја, сината, има.
    meaning:
      en: Not in this model. But in that colour, the blue, yes.
      pt: Neste modelo não. Mas naquela cor, a azul, tem.
  - speaker: protagonist
    text: Сините... да, удобни се. Ги земам!
    meaning:
      en: The blue ones... yes, they're comfortable. I'll take them!
      pt: Os azuis... sim, são confortáveis. Vou levar!
- type: narrator
  text:
    en: '''This'' and ''that'' agree like adjectives: овој / оној (masculine), оваа / онаа (feminine), ова / она (neuter), овие / оние (plural). Тој, таа, тоа, тие are the ''that'' close to the person you''re
      talking to.'
    pt: '''Este'' e ''aquele'' concordam como adjetivos: овој / оној (masculino), оваа / онаа (feminino), ова / она (neutro), овие / оние (plural). Тој, таа, тоа, тие são o ''esse'', perto de quem ouve.'
