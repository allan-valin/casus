steps:
- type: narrator
  text:
    en: Sunday. Mrs Stojanovska invites you to lunch, at two o'clock. Listen to the conversation; you don't need to understand it yet.
    pt: Domingo. A senhora Stojanovska convida você para almoçar, às duas. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Повелете, седнете! Ова е тавче гравче, а ова сарма.
    meaning:
      en: Here, sit down! This is baked beans, and this is sarma.
      pt: Pode sentar! Isto é feijão no forno, e isto é sarma.
  - speaker: protagonist
    text: Мирише многу убаво!
    meaning:
      en: It smells very good!
      pt: Está cheirando muito bem!
  - speaker: vera
    text: Јадете, јадете!
    meaning:
      en: Eat, eat!
      pt: Coma, coma!
  - speaker: protagonist
    text: Многу е вкусно.
    meaning:
      en: It's very tasty.
      pt: Está muito gostoso.
  - speaker: vera
    text: Уште малку сарма?
    meaning:
      en: A little more sarma?
      pt: Mais um pouquinho de sarma?
  - speaker: protagonist
    text: Не, благодарам, доста ми е. Сита сум.
    meaning:
      en: No, thank you, I've had enough. I'm full.
      pt: Não, obrigada, para mim chega. Estou satisfeita.
  - speaker: vera
    text: Само една!
    meaning:
      en: Just one!
      pt: Só uma!
  - speaker: protagonist
    text: Добро, но само една!
    meaning:
      en: All right, but just one!
      pt: Está bem, mas só uma!
  - speaker: vera
    text: А потоа колач!
    meaning:
      en: And then cake!
      pt: E depois tem doce!
- type: narrator
  text:
    en: Sunday lunch at home is late — around two — and long. The host keeps offering; saying no once is just politeness.
    pt: O almoço de domingo em casa é tarde — lá pelas duas — e demorado. A anfitriã oferece de novo e de novo; recusar uma vez é só educação.
- type: narrator
