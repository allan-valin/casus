steps:
- type: narrator
  text:
    en: Friday at the кафана, the whole group. Marko is in a sarcastic mood — and B1 comes back. Listen to the conversation; you don't need to understand it yet.
    pt: Sexta na кафана, a turma toda. O Marko está irônico — e o B1 volta. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Пак врне. Баш убаво!
    meaning:
      en: Raining again. Just great!
      pt: Chovendo de novo. Que maravilha!
  - speaker: protagonist
    text: Ти се допаѓа дождот?
    meaning:
      en: You like the rain?
      pt: Você gosta da chuva?
  - speaker: marko
    text: Па да. Најмногу на свој роденден.
    meaning:
      en: Oh sure. Most of all on my birthday.
      pt: Ah, claro. Principalmente no meu aniversário.
  - speaker: protagonist
    text: Се шегуваш?
    meaning:
      en: Are you joking?
      pt: Está brincando?
  - speaker: goran
    text: Тоа е иронија. Марко никогаш не зборува озбилно.
    meaning:
      en: That's irony. Marko never speaks seriously.
      pt: Isso é ironia. O Marko nunca fala sério.
  - speaker: marko
    text: Како да не! Јас сум најсериозниот човек тука.
    meaning:
      en: Yeah, right! I'm the most serious person here.
      pt: Até parece! Eu sou a pessoa mais séria aqui.
  - speaker: protagonist
    text: Многу смешно. Ми треба време за овој хумор.
    meaning:
      en: Very funny. I need time for this humour.
      pt: Muito engraçado. Preciso de tempo para esse humor.
  - speaker: goran
    text: Три години си тука. Уште ти треба?
    meaning:
      en: You've been here three years. You still need it?
      pt: Três anos aqui. Ainda precisa?
- type: narrator
  text:
    en: 'Irony is everywhere in everyday talk: ''Баш убаво!'' (just great!) and ''Па да'' (oh sure) often mean the opposite. ''Како да не!'' — yeah, right!'
    pt: 'Ironia está em toda conversa: ''Баш убаво!'' (que maravilha!) e ''Па да'' (ah, claro) muitas vezes querem dizer o contrário. ''Како да не!'' — até parece!'
