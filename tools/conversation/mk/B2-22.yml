steps:
- type: narrator
  text:
    en: 2 August is a Wednesday. The office plans a bridge. Listen to the conversation; you don't need to understand it yet.
    pt: O dia 2 de agosto cai numa quarta. O escritório planeja uma ponte. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: darko
    text: Илинден е во среда. Државен празник!
    meaning:
      en: Ilinden is on Wednesday. A public holiday!
      pt: O Ilinden é na quarta. Feriado nacional!
  - speaker: protagonist
    text: Што се слави на Илинден?
    meaning:
      en: What's celebrated on Ilinden?
      pt: O que se comemora no Ilinden?
  - speaker: darko
    text: Илинденското востание од 1903 и АСНОМ од 1944.
    meaning:
      en: The Ilinden Uprising of 1903 and ASNOM of 1944.
      pt: O Levante de Ilinden de 1903 e a ASNOM de 1944.
  - speaker: nikolovski
    text: Ако земете четврток и петок, имате продолжен викенд.
    meaning:
      en: If you take Thursday and Friday, you have a long weekend.
      pt: Se vocês tirarem quinta e sexta, ficam com um feriadão.
  - speaker: darko
    text: Ние двајца одиме на море!
    meaning:
      en: The two of us are going to the seaside!
      pt: Nós dois vamos para a praia!
  - speaker: nikolovski
    text: Добро, нека земат слободни денови. Но тројца остануваат.
    meaning:
      en: Fine, let them take days off. But three people stay.
      pt: Tudo bem, que tirem folga. Mas três ficam.
  - speaker: protagonist
    text: Јас ќе бидам дежурен. Морето е далеку за мене.
    meaning:
      en: I'll be on duty. The sea is far for me.
      pt: Eu fico de plantão. O mar é longe para mim.
  - speaker: darko
    text: Како далеку? Грција е три часа!
    meaning:
      en: Far? Greece is three hours!
      pt: Como longe? A Grécia é a três horas!
