- type: narrator
  text:
    en: The earthquake of 26 July 1963 destroyed about four fifths of Skopje and killed over a thousand people. Help came from East and West in the middle of the Cold War, and the Japanese architect Kenzo
      Tange drew the new city plan.
    pt: O terremoto de 26 de julho de 1963 destruiu uns quatro quintos de Skopje e matou mais de mil pessoas. A ajuda veio do Leste e do Oeste em plena Guerra Fria, e o arquiteto japonês Kenzo Tange desenhou
      o novo plano da cidade.
