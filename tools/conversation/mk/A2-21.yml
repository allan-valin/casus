steps:
- type: narrator
  text:
    en: Ana shows you the old railway station, now the City Museum. Its clock has shown 5:17 for sixty years. Listen to the conversation; you don't need to understand it yet.
    pt: A Ana mostra a antiga estação de trem, hoje o Museu da Cidade. O relógio marca 5:17 há sessenta anos. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Погледни го часовникот. Застана во пет и седумнаесет.
    meaning:
      en: Look at the clock. It stopped at five-seventeen.
      pt: Olha o relógio. Parou às cinco e dezessete.
  - speaker: protagonist
    text: Зошто?
    meaning:
      en: Why?
      pt: Por quê?
  - speaker: ana
    text: Земјотрес. На 26 јули 1963, утрото.
    meaning:
      en: An earthquake. On 26 July 1963, in the morning.
      pt: Um terremoto. Em 26 de julho de 1963, de manhã.
  - speaker: protagonist
    text: Многу беше урнато?
    meaning:
      en: Was much destroyed?
      pt: Muita coisa desabou?
  - speaker: ana
    text: Скоро цел град. Загинаа повеќе од илјада луѓе.
    meaning:
      en: Almost the whole city. More than a thousand people died.
      pt: Quase a cidade inteira. Morreram mais de mil pessoas.
  - speaker: protagonist
    text: Ужасно. А потоа?
    meaning:
      en: Terrible. And then?
      pt: Que horror. E depois?
  - speaker: ana
    text: Цел свет помогна во обновата. Затоа Скопје е град на солидарноста.
    meaning:
      en: The whole world helped with the rebuilding. That's why Skopje is the city of solidarity.
      pt: O mundo inteiro ajudou na reconstrução. Por isso Skopje é a cidade da solidariedade.
  - speaker: protagonist
    text: А станицата?
    meaning:
      en: And the station?
      pt: E a estação?
  - speaker: ana
    text: Остана вака, за спомен.
    meaning:
      en: It was left like this, as a memorial.
      pt: Ficou assim, como lembrança.
