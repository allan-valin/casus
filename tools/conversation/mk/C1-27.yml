steps:
- type: narrator
  text:
    en: Months of overtime. You can't sleep. Ana suggests a psychologist. Listen to the conversation; you don't need to understand it yet.
    pt: Meses de hora extra. Você não consegue dormir. A Ana sugere uma psicóloga. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Изгледаш уморно. Што ти е?
    meaning:
      en: You look tired. What's wrong?
      pt: Você está com cara de cansada. O que você tem?
  - speaker: protagonist
    text: Стрес. Не спијам веќе месец дена.
    meaning:
      en: Stress. I haven't been sleeping for a month.
      pt: Estresse. Faz um mês que não durmo.
  - speaker: ana
    text: Тоа е изгорување. Оди кај психолог.
    meaning:
      en: That's burnout. Go to a psychologist.
      pt: Isso é burnout. Vai numa psicóloga.
  - speaker: protagonist
    text: Психолог? Се срамам. Што ќе речат луѓето?
    meaning:
      en: A psychologist? I'm embarrassed. What will people say?
      pt: Psicóloga? Tenho vergonha. O que as pessoas vão dizer?
  - speaker: ana
    text: Па што? Нема за што да се срамиш. Не си луда.
    meaning:
      en: So what? There's nothing to be ashamed of. You're not crazy.
      pt: E daí? Não tem por que ter vergonha. Você não é louca.
  - speaker: ana
    text: И јас одев минатата година.
    meaning:
      en: I went too, last year.
      pt: Eu também fui, no ano passado.
  - speaker: protagonist
    text: Ти? Не знаев.
    meaning:
      en: You? I didn't know.
      pt: Você? Eu não sabia.
  - speaker: ana
    text: Научив да поставувам граници. И земи вистински одмор.
    meaning:
      en: I learned to set limits. And take a real holiday.
      pt: Aprendi a colocar limites. E tira férias de verdade.
