steps:
- type: narrator
  text:
    en: You bought a second-hand bike. The tyre is flat. Marko comes down. Listen to the conversation; you don't need to understand it yet.
    pt: Você comprou uma bicicleta usada. O pneu está furado. O Marko desce. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Нов велосипед?
    meaning:
      en: New bike?
      pt: Bicicleta nova?
  - speaker: protagonist
    text: Си купив половен. Но гумата е дупната.
    meaning:
      en: I bought a second-hand one. But the tyre is flat.
      pt: Comprei uma usada. Mas o pneu está furado.
  - speaker: marko
    text: Ќе ја поправиш сам?
    meaning:
      en: Will you fix it yourself?
      pt: Vai consertar sozinho?
  - speaker: protagonist
    text: Сам, со видео од интернет.
    meaning:
      en: By myself, with a video from the internet.
      pt: Sozinho, com um vídeo da internet.
  - speaker: marko
    text: Ајде, ќе ти помогнам. Имам алат.
    meaning:
      en: Come on, I'll help you. I have tools.
      pt: Vem, eu te ajudo. Tenho ferramenta.
  - speaker: protagonist
    text: Готово! Вози!
    meaning:
      en: Done! It rides!
      pt: Pronto! Está andando!
  - speaker: marko
    text: Браво. Но ти си многу валкан. Измиј се!
    meaning:
      en: Well done. But you're very dirty. Go and wash!
      pt: Muito bem. Mas você está imundo. Vai se lavar!
  - speaker: protagonist
    text: Да, мора. Рацете ми се црни.
    meaning:
      en: Yes, I must. My hands are black.
      pt: É, tenho que ir. Minhas mãos estão pretas.
- type: narrator
