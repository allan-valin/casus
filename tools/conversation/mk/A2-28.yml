    en: '''Си'' says ''for myself'': си купив велосипед — I bought myself a bike. ''Се'' says the action goes back to you: се мијам — I wash (myself).'
    pt: '''Си'' diz ''para mim'': си купив велосипед — comprei uma bicicleta (para mim). ''Се'' diz que a ação volta para você: се мијам — me lavo.'
