- type: narrator
  text:
    en: Mrs Stojanovska shows you family photos and asks about yours. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Stojanovska mostra fotos da família e pergunta da sua. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Ова е мојата фамилија. Ова е синот, тој живее во Германија.
    meaning:
      en: This is my family. This is my son, he lives in Germany.
      pt: Esta é a minha família. Este é o meu filho, ele mora na Alemanha.
  - speaker: protagonist
    text: А ова е вашата ќерка?
    meaning:
      en: And is this your daughter?
      pt: E esta é a sua filha?
  - speaker: vera
    text: Да, ќерка ми, Марија. Таа живее тука, во Скопје.
    meaning:
      en: Yes, my daughter, Marija. She lives here, in Skopje.
      pt: Sim, a minha filha, Marija. Ela mora aqui, em Skopje.
  - speaker: protagonist
    text: Јас имам брат и сестра.
    meaning:
      en: I have a brother and a sister.
      pt: Eu tenho um irmão e uma irmã.
  - speaker: vera
    text: Колку години имаат?
    meaning:
      en: How old are they?
      pt: Quantos anos eles têm?
  - speaker: protagonist
    text: Брат ми има триесет, сестра ми дваесет и пет.
    meaning:
      en: My brother is thirty, my sister twenty-five.
      pt: Meu irmão tem trinta, minha irmã vinte e cinco.
  - speaker: vera
    text: А мајка ви и татко ви?
    meaning:
      en: And your mother and father?
      pt: E a sua mãe e o seu pai?
  - speaker: protagonist
    text: Тие се во Сао Паоло.
    meaning:
      en: They're in São Paulo.
      pt: Eles estão em São Paulo.
