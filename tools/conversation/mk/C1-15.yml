steps:
- type: narrator
  text:
    en: Your knee hurts after basketball. Dr Petrovska writes a referral. Listen to the conversation; you don't need to understand it yet.
    pt: Seu joelho dói depois do basquete. A doutora Petrovska faz um encaminhamento. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: doktorka
    text: Коленото треба да го види специјалист. Ќе ви дадам упат за ортопед.
    meaning:
      en: A specialist should see the knee. I'll give you a referral to an orthopaedist.
      pt: Um especialista precisa ver o joelho. Vou dar um encaminhamento para ortopedista.
  - speaker: protagonist
    text: Колку се чека?
    meaning:
      en: How long is the wait?
      pt: Quanto tempo de espera?
  - speaker: doktorka
    text: Листата на чекање е долга. Има да чекате два месеци.
    meaning:
      en: The waiting list is long. You'll have to wait two months.
      pt: A fila de espera é longa. Vai ter que esperar dois meses.
  - speaker: protagonist
    text: Два месеци! А ако е итно?
    meaning:
      en: Two months! And if it's urgent?
      pt: Dois meses! E se for urgente?
  - speaker: doktorka
    text: Не е итно. Но може приватно — за неколку дена.
    meaning:
      en: It isn't urgent. But you can go privately — in a few days.
      pt: Não é urgente. Mas pode ir no particular — em poucos dias.
  - speaker: protagonist
    text: Приватно значи од свој џеб.
    meaning:
      en: Privately means out of my own pocket.
      pt: Particular quer dizer do próprio bolso.
  - speaker: doktorka
    text: Да. Државното е бесплатно, но бавно.
    meaning:
      en: Yes. The public system is free, but slow.
      pt: Sim. O público é gratuito, mas lento.
  - speaker: protagonist
    text: 'Како во Бразил: СУС или приватно.'
    meaning:
      en: 'Like in Brazil: SUS or private.'
      pt: 'Como no Brasil: SUS ou particular.'
