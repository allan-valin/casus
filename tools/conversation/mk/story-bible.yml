# STORY BIBLE — Macedonian, narrator Brazilian Portuguese. ACCEPTED by Allan 2026-10-21 (voice: bg Piper + mk
# phonemes, pitched for women); units follow in this folder. Guide: docs/conversation/GUIDE.en.md.

language: mk
narrator_languages: [en, pt]          # en: neutral (Allan 2026-10-21, for international offices); pt: with Brazil comparisons
country: North Macedonia
standard: >-
  Standard Macedonian (the Skopje-based literary norm of the grammars: Lunt, Friedman, Конески). Fixed
  antepenultimate stress; no dialect forms (no Ohrid/Struga or eastern variants) in the units.

voices:
  # No open-licence Macedonian Piper voice exists (MMS-TTS mkd and the Serbian Piper voice are NC). Proposal: the
  # Bulgarian Piper voice (CC0), fed Macedonian phonemes from espeak-ng's mk rules — a sister-language voice, as
  # decided. Samples to judge: spikes/mk-voice-2026-10-21/*.wav. The female voices are the same model shifted up;
  # if Allan finds them unusable, female characters fall back to espeak-ng mk (GPL-3, robotic) or stay male-only.
  - {id: nar-en, role: narrator, lang: en, tts: "piper:en_US-lessac-medium"}         # neutral narrator (international offices)
  - {id: nar-pt, role: narrator, lang: pt, tts: "piper:pt_BR-cadu-medium"}            # CC0
  # one Piper voice for everyone, told apart by pitch and speed (Allan, 2026-10-21: the landlady and "you" sounded like
  # one person): the older characters speak lower and slower
  - {id: mk-p-f, role: character, lang: mk, gender: f, tts: "piper:bg_BG-dimitar-medium+mk-phonemes", pitch: 1.32}
  - {id: mk-p-m, role: character, lang: mk, gender: m, tts: "piper:bg_BG-dimitar-medium+mk-phonemes", pitch: 1.0}
  - {id: mk-m, role: character, lang: mk, gender: m, tts: "piper:bg_BG-dimitar-medium+mk-phonemes", pitch: 0.88}
  - {id: mk-m2, role: character, lang: mk, gender: m, tts: "piper:bg_BG-dimitar-medium+mk-phonemes", pitch: 0.8, speed: 1.1}
  - {id: mk-f, role: character, lang: mk, gender: f, tts: "piper:bg_BG-dimitar-medium+mk-phonemes", pitch: 1.42}
  - {id: mk-f2, role: character, lang: mk, gender: f, tts: "piper:bg_BG-dimitar-medium+mk-phonemes", pitch: 1.12, speed: 1.12}
  - {id: mk-x-m, role: character, lang: mk, gender: m, tts: "piper:bg_BG-dimitar-medium+mk-phonemes", pitch: 0.94, speed: 0.95}
  - {id: mk-o-m, role: character, lang: mk, gender: m, tts: "piper:bg_BG-dimitar-medium+mk-phonemes", pitch: 0.72, speed: 0.9}
  - {id: mk-x-f, role: character, lang: mk, gender: f, tts: "piper:bg_BG-dimitar-medium+mk-phonemes", pitch: 1.22, speed: 0.95}

protagonist:
  forms: {f: mk-p-f, m: mk-p-m}
  name: null                    # addressed as "você" by the narrator
  background: >-
    Brazilian from São Paulo, about 30, moves to Skopje for a one-year job at a software company whose working
    language is English. Knows no Macedonian, no Cyrillic. Rents a flat in Карпош.
  alternation: odd units f, even units m (l-forms and adjectives agree with the speaker — била/бил,
    уморна/уморен — so both sets appear)

cast:
  - id: vera
    name: Вера Стојановска (госпоѓа Стојановска)
    role: landlady, about 65, retired teacher, lives in the flat below
    voice: mk-f2
    register: formal
    arc: Вие throughout A; fusses, feeds the protagonist, offers coffee every visit; in B1 offers "Ајде да си зборуваме на ти"
  - id: marko
    name: Марко
    role: neighbour, about 28, works in IT, plays basketball
    voice: mk-m
    register: informal
    arc: ти from the first meeting (young people); takes the protagonist to cafés, a name-day party, Охрид in B1
  - id: ana
    name: Ана
    role: colleague, about 32, project manager; Macedonian, speaks English at work
    voice: mk-f
    register: formal
    arc: Вие at the first meeting in the office, ти from the next day when she offers it (unit A1-08); a friend in B
  - id: dragan
    name: Драган
    role: owner of the corner shop (маркет) and kiosk, about 50
    voice: mk-m2
    register: formal
    arc: says "Повелете!" to everyone; becomes the protagonist's informal teacher of everyday words; never switches to ти

  - id: passerby
    name: Минувачка
    role: a woman in the street, asked the way
    voice: mk-x-f
    register: formal
    arc: one scene at a time
  - id: seller
    name: Продавачка
    role: shop assistant in clothes shops and at the market
    voice: mk-x-f
    register: formal
    arc: one scene at a time
  - id: driver
    name: Возач
    role: bus driver
    voice: mk-x-m
    register: formal
    arc: one scene at a time

  - id: metodija
    name: Методија
    role: Marko's father; makes his own rakija
    voice: mk-o-m
    register: informal
    arc: says ти to the young neighbour, who answers with Вие
  - id: majstor
    name: Мајстор
    role: the repairman Vera calls
    voice: mk-x-m
    register: formal
    arc: one scene at a time

formality:
  summary: >-
    Вие (plural verb forms; capitalised in writing when it addresses one person) with strangers, older people,
    officials, shop staff and in professional first meetings; ти with friends, family, children and among young
    people from the start. Switching from Вие to ти without being offered it is felt as rude; the older or senior
    person offers it. Formal greeting Добар ден / Добро утро / Добровечер; Здраво among friends. Titles: господине /
    госпоѓо + surname (vocative), or професоре / професорке at the university.
  rules:
    - Вие + plural verb with Vera, Dragan, officials, and with Ana until she offers ти.
    - ти with Marko from the first line.
    - Participles/adjectives with Вие addressing one person agree with the person's sex in the singular in everyday
      speech ("Вие сте уморна?") — NATIVE CHECK, grammars differ; the units avoid the construction in A1.
    - Offering ti is a scene (A1-08 with Ana; B1 with Vera).
  sources:
    - {title: "Wikipedia: Macedonian pronouns (Вие, capitalisation)", url: "https://en.wikipedia.org/wiki/Macedonian_pronouns", licence: CC BY-SA}
    - {title: "Cultural Atlas: Macedonian culture — greetings, etiquette", url: "https://theculturalatlas.org/macedonian-culture/macedonian-culture-etiquette", licence: "read only, facts cited"}
    - {title: "Friedman, Macedonian (grammar) — on the drive; to read for Вие agreement", url: null, licence: "reference"}

culture:
  taught:
    - {topic: coffee, note: "A visit means coffee (Turkish coffee, турско кафе, or espresso); refusing without a reason seems cold — accept even if you don't finish. Don't drink before the host.", source: Cultural Atlas}
    - {topic: shoes, note: "Shoes come off at the door; hosts offer slippers (влечки).", source: Cultural Atlas}
    - {topic: draught, note: "Промаја: a cross-draught (two windows open) is believed to cause illness; people close windows, keep children's necks covered, avoid air conditioning blowing on them.", source: Cultural Atlas}
    - {topic: meals, note: "Lunch (ручек) is the main meal, around 14:00; dinner late; meals last two hours; hosts serve too much and insist; leave the plate empty.", source: Cultural Atlas}
    - {topic: toasts, note: "На здравје! with eye contact; rakija (ракија) before or with salad (шопска салата).", source: Cultural Atlas}
    - {topic: time, note: "Relaxed punctuality; meetings run over.", source: Cultural Atlas}
    - {topic: visits, note: "Family and friends visit unannounced; guests do not bring food — the host provides everything.", source: Cultural Atlas}
    - {topic: tipping, note: "No obligatory tip and no service charge on the bill; rounding up is common.", source: Cultural Atlas}
    - {topic: flowers, note: "Odd number of flowers; even numbers are for funerals.", source: Cultural Atlas}
    - {topic: name days, note: "Имендени — the saint's day of one's name is celebrated like a birthday (Св. Никола, Св. Ѓорѓи…); colleagues bring sweets.", source: "general knowledge — VERIFY"}
    - {topic: Easter, note: "Велигден on the Orthodox date; red eggs, egg-tapping; greeting Христос воскресе! — Вистина воскресе!", source: "general knowledge — VERIFY"}
    - {topic: alphabet, note: "Macedonian is written in Cyrillic (standardised 1945); Albanian, an official language since 2019, in Latin letters; menus and shop signs often in English; people often type Macedonian in Latin letters. Visitors ask whether it is Russian.", source: "Allan; Wikipedia: Macedonian alphabet, Languages of North Macedonia"}
    - {topic: history, note: "Part of Yugoslavia until independence in 1991; the name dispute with Greece ended with the Prespa Agreement (2018, in force 2019); Bulgaria contests the language and history, which has slowed EU talks. Told plainly, with care.", source: "Wikipedia (CC BY-SA)"}
  narrator:
    # neutral English (Allan, 2026-10-21): the curious note without "back home"
    - {lang: en, topic: greetings, note: "Strangers and older people get Вие and a handshake; kisses on the cheek are for friends and family."}
    - {lang: en, topic: coffee, note: "A visit means coffee, and coffee means an hour or two of talk; refusing it seems cold."}
    - {lang: en, topic: draught, note: "Промаја, the draught between two open windows, is believed to make you ill."}
    - {lang: en, topic: meals, note: "Lunch is the main meal, around two; hosts serve too much and insist."}
    - {lang: pt, topic: greetings, note: "Brazilians greet acquaintances with one kiss (São Paulo) or two (Rio); men shake hands and hug. Strangers are addressed with você; o senhor / a senhora only with the elderly or in very formal service."}
    - {lang: pt, topic: meals, note: "Lunch around 12:00–13:00 is the main meal; rice and beans; dinner around 20:00."}
    - {lang: pt, topic: shoes, note: "Many Brazilian homes keep shoes on indoors; asking guests to take them off is less usual."}
    - {lang: pt, topic: air, note: "Fans and air conditioning blowing directly are normal; open windows mean fresh air, not illness."}
    - {lang: pt, topic: tipping, note: "Restaurants add 10 % service (taxa de serviço) to the bill."}
    - {lang: pt, topic: documents, note: "The CPF number is asked for in every shop and office."}
    - {lang: pt, topic: safety, note: "In big Brazilian cities nobody uses a phone openly in the street; in Skopje people do — a relief to talk about, and a habit to unlearn slowly.", source: "Allan, deutschweh 2019"}
    - {lang: pt, topic: instalments, note: "Brazilians pay almost anything in instalments without interest (parcelado em 12x); in North Macedonia and most of Europe that is rare.", source: "Allan, deutschweh 2019"}
    - {lang: pt, topic: friends, note: "In Brazil a regular bar makes friends within weeks; abroad friendships take longer, and the first friends are often other foreigners.", source: "Allan, deutschweh 2019"}
    - {lang: pt, topic: coffee, note: "Cafezinho is quick, small, sweet, drunk standing; a coffee visit of an hour is not the default."}
  clashes:
    - {situation: "Calling the landlady 'você'-style (ти) and by her first name", unit: A1-01}
    - {situation: "Entering the landlady's flat with shoes on; she brings slippers", unit: A1-03}
    - {situation: "Refusing the coffee because of being in a hurry; Vera is hurt", unit: A1-03}
    - {situation: "Opening both windows on a hot day; Vera warns about промаја", unit: A1-11}
    - {situation: "Arriving hungry at 12:00 for lunch at 14:00; then too much food", unit: A1-15}
    - {situation: "Looking for the 10 % service on the bill; leaving the plate half-full", unit: A2}
    - {situation: "Not knowing about Marko's name day; no sweets at the office", unit: A2}
    - {situation: "Greeting a colleague with one kiss at the first meeting", unit: A1-08}

arc:
  - {level: A1, units: 30, summary: "Arrival in Skopje: landlady, keys, the corner shop, Cyrillic signs, coffee at Vera's, the office, Ana offers ти, the bus, the bazaar (Стара чаршија), a café with Marko, промаја, lunch at 14:00."}
  - {level: A2, units: 30, summary: "Settling in: residence permit (МВР), bank, doctor, heating in winter and the smog, a name day, Easter, the bill and the tip, a weekend in Ohrid."}
  - {level: B1, units: 30, summary: "Friends: Marko's group, opinions, football and basketball, a wedding, Vera says ти, a misunderstanding over plans."}
  - {level: B2, units: 30, summary: "Work: a local job offer, CV, interview, meetings in Macedonian, e-mail register, a conflict."}
  - {level: C1, units: 30, summary: "University evening courses: talk about biology, chemistry, physics, maths at school level."}
  - {level: C2, units: 30, summary: "Ideas: philosophy, history debates handled with care, humour, register shifts."}

native_check:
  - "Вие + singular adjective/participle agreement (rule 3 under formality)"
  - "Every mk line of every unit until a native speaker has read it"
