steps:
- type: narrator
  text:
    en: A public hearing on the Karpoš budget. You ask about the park that was promised in C1. Listen to the conversation; you don't need to understand it yet.
    pt: Uma audiência pública sobre o orçamento de Karpoš. Você pergunta pelo parque prometido no C1. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Дозволете едно прашање. Паркот беше предвиден во буџетот пред две години.
    meaning:
      en: Allow me one question. The park was planned in the budget two years ago.
      pt: Permitam uma pergunta. O parque estava previsto no orçamento há dois anos.
  - speaker: sovetnik-c
    text: Точно. Но средствата беа пренасочени.
    meaning:
      en: Correct. But the funds were redirected.
      pt: Correto. Mas os recursos foram remanejados.
  - speaker: protagonist
    text: Каде?
    meaning:
      en: Where?
      pt: Para onde?
  - speaker: sovetnik-c
    text: За поправка на улици. Паркот е одложен.
    meaning:
      en: To repairing streets. The park is postponed.
      pt: Para conserto de ruas. O parque foi adiado.
  - speaker: protagonist
    text: Граѓаните заслужуваат да знаат транспарентно — колку и каде.
    meaning:
      en: Citizens deserve to know transparently — how much and where.
      pt: Os cidadãos merecem saber com transparência — quanto e onde.
  - speaker: sovetnik-c
    text: Ќе добиете писмен одговор.
    meaning:
      en: You'll receive a written answer.
      pt: O senhor vai receber uma resposta por escrito.
  - speaker: protagonist
    text: Благодарам. Ќе го чекам — и ќе го објавам.
    meaning:
      en: Thank you. I'll wait for it — and publish it.
      pt: Obrigado. Vou esperar — e vou publicar.
  - speaker: ana
    text: Од странец стана граѓанин!
    meaning:
      en: From a foreigner you became a citizen!
      pt: De estrangeiro você virou cidadão!
