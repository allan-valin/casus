steps:
- type: narrator
  text:
    en: Late at the кафана, Goran gets philosophical. Listen to the conversation; you don't need to understand it yet.
    pt: Tarde da noite na кафана, o Goran fica filosófico. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: goran
    text: Што ти е најважно во животот?
    meaning:
      en: What's most important to you in life?
      pt: O que é mais importante para você na vida?
  - speaker: protagonist
    text: Слободата. Да можам да избирам.
    meaning:
      en: Freedom. Being able to choose.
      pt: A liberdade. Poder escolher.
  - speaker: goran
    text: Слободно време или слобода на говор?
    meaning:
      en: Free time or free speech?
      pt: Tempo livre ou liberdade de expressão?
  - speaker: protagonist
    text: И двете! Секој има право да каже што мисли.
    meaning:
      en: Both! Everyone has the right to say what they think.
      pt: Os dois! Todo mundo tem o direito de dizer o que pensa.
  - speaker: goran
    text: Порано тоа не беше лесно. Во Југославија имаше една партија.
    meaning:
      en: In the past that wasn't easy. In Yugoslavia there was one party.
      pt: Antigamente não era fácil. Na Iugoslávia tinha um partido só.
  - speaker: protagonist
    text: А сега?
    meaning:
      en: And now?
      pt: E agora?
  - speaker: goran
    text: Сега има избори, иако не сме секогаш задоволни од нив.
    meaning:
      en: Now there are elections, although we're not always happy with them.
      pt: Agora tem eleições, embora a gente nem sempre fique satisfeito.
  - speaker: protagonist
    text: Кај нас исто — имавме диктатура до 1985.
    meaning:
      en: Same where I come from — we had a dictatorship until 1985.
      pt: Lá no Brasil também — tivemos ditadura até 1985.
