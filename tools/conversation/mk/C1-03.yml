steps:
- type: narrator
  text:
    en: Before buying, a bigger rented flat. The landlord brings the contract. Listen to the conversation; you don't need to understand it yet.
    pt: Antes de comprar, um apartamento alugado maior. O proprietário traz o contrato. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sosed2
    text: Еве го договорот. Депозит во висина на една кирија.
    meaning:
      en: Here's the contract. A deposit of one month's rent.
      pt: Aqui o contrato. Caução no valor de um aluguel.
  - speaker: protagonist
    text: Кој ги плаќа комуналиите?
    meaning:
      en: Who pays the utilities?
      pt: Quem paga as contas?
  - speaker: sosed2
    text: Закупецот се обврзува да ги плаќа. Тоа сте вие.
    meaning:
      en: The tenant undertakes to pay them. That's you.
      pt: O locatário se compromete a pagar. É a senhora.
  - speaker: protagonist
    text: А отказниот рок?
    meaning:
      en: And the notice period?
      pt: E o aviso prévio?
  - speaker: sosed2
    text: Еден месец, во писмена форма.
    meaning:
      en: One month, in writing.
      pt: Um mês, por escrito.
  - speaker: protagonist
    text: Дали договорот ќе се завери кај нотар?
    meaning:
      en: Will the contract be notarised?
      pt: O contrato vai ser reconhecido em cartório?
  - speaker: sosed2
    text: Нотар? Повеќето се договараат со ракување!
    meaning:
      en: A notary? Most people agree with a handshake!
      pt: Cartório? A maioria combina com um aperto de mão!
  - speaker: protagonist
    text: Јас би сакала сепак со нотар. За секој случај.
    meaning:
      en: I'd still like a notary. Just in case.
      pt: Eu preferiria cartório mesmo assim. Por via das dúvidas.
