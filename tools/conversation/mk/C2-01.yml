steps:
- type: narrator
  text:
    en: Marko's wedding. As кума, you give the main toast — in front of three hundred guests. Listen to the conversation; you don't need to understand it yet.
    pt: O casamento do Marko. Como кума, você faz o brinde principal — na frente de trezentos convidados. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Почитувани гости, дозволете ми да кажам неколку зборови.
    meaning:
      en: Honoured guests, allow me to say a few words.
      pt: Prezados convidados, permitam-me dizer algumas palavras.
  - speaker: protagonist
    text: Марко беше првиот човек што ми рече „здраво“ во Скопје.
    meaning:
      en: Marko was the first person who said 'hi' to me in Skopje.
      pt: O Marko foi a primeira pessoa que me disse 'oi' em Skopje.
  - speaker: protagonist
    text: Денеска, како кума, им посакувам на младенците да живеат во слога,
    meaning:
      en: Today, as кума, I wish the newlyweds to live in harmony,
      pt: Hoje, como madrinha, desejo aos noivos que vivam em harmonia,
  - speaker: protagonist
    text: во добро и во зло, и да остарат заедно.
    meaning:
      en: for better or for worse, and to grow old together.
      pt: na alegria e na tristeza, e que envelheçam juntos.
  - speaker: marko
    text: Плачам, кумо!
    meaning:
      en: I'm crying, кума!
      pt: Estou chorando, madrinha!
  - speaker: protagonist
    text: Кренете ги чашите. Живееле!
    meaning:
      en: Raise your glasses. Long live the couple!
      pt: Levantem os copos. Vivam os noivos!
  - speaker: goran
    text: Живееле!
    meaning:
      en: Long live!
      pt: Vivam!
  - speaker: vera
    text: Каков говор! Како родена Македонка.
    meaning:
      en: What a speech! Like a born Macedonian.
      pt: Que discurso! Como uma macedônia nata.
