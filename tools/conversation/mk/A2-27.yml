steps:
- type: narrator
  text:
    en: You leave for work at seven. Mrs Stojanovska is already sweeping the stairs. Listen to the conversation; you don't need to understand it yet.
    pt: Você sai para o trabalho às sete. A senhora Stojanovska já está varrendo a escada. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Добро утро! Рано станувате.
    meaning:
      en: Good morning! You get up early.
      pt: Bom dia! A senhora acorda cedo.
  - speaker: protagonist
    text: Добро утро. И вие!
    meaning:
      en: Good morning. So do you!
      pt: Bom dia. A senhora também!
  - speaker: vera
    text: 'Мене мајка ми ми велеше: „Кој рано рани, две среќи граби.“'
    meaning:
      en: 'My mother used to tell me: ''Who rises early grabs two lucks.'''
      pt: 'Minha mãe me dizia: ''Quem cedo madruga agarra duas sortes.'''
  - speaker: protagonist
    text: Што значи тоа?
    meaning:
      en: What does that mean?
      pt: O que significa isso?
  - speaker: vera
    text: Ако станеш рано, имаш повеќе среќа.
    meaning:
      en: If you get up early, you have more luck.
      pt: Se você acorda cedo, tem mais sorte.
  - speaker: protagonist
    text: 'Кај нас велат: „Бог му помага на тој што рано станува.“'
    meaning:
      en: 'Where I come from they say: ''God helps the one who gets up early.'''
      pt: 'Lá na minha terra dizem: ''Deus ajuda quem cedo madruga.'''
  - speaker: vera
    text: Исто! А „Тивка вода брег рони“?
    meaning:
      en: The same! And 'Quiet water wears away the bank'?
      pt: Igual! E 'Água mansa rói a margem'?
  - speaker: protagonist
    text: 'Тоа и кај нас: „Од тивка вода, чувај се.“'
    meaning:
      en: 'We have that too: ''Beware of quiet water.'''
      pt: 'Esse a gente também tem: ''Cuidado com água parada.'''
  - speaker: vera
    text: Како Марко — тивок е, ама него ништо не му бега!
    meaning:
      en: Like Marko — he's quiet, but nothing gets past him!
      pt: Que nem o Marko — é quieto, mas nada escapa dele!
