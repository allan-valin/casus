steps:
- type: narrator
  text:
    en: First big dinner as Bojan's fiancée. His mother watches every move. Listen to the conversation; you don't need to understand it yet.
    pt: Primeiro grande jantar como noiva do Bojan. A mãe dele observa cada movimento. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: svekrva-c
    text: Пробај ја пита. Ја правам по рецептот на мајка ми.
    meaning:
      en: Try the pie. I make it from my mother's recipe.
      pt: Prova a torta. Eu faço com a receita da minha mãe.
  - speaker: protagonist
    text: Прекрасна е! Ќе ми го дадете ли рецептот?
    meaning:
      en: It's wonderful! Will you give me the recipe?
      pt: Está maravilhosa! A senhora me dá a receita?
  - speaker: svekrva-c
    text: Ќе ти го дадам, но не му го давај на никого.
    meaning:
      en: I'll give it to you, but don't give it to anyone.
      pt: Vou te dar, mas não dá para ninguém.
  - speaker: svekor-c
    text: Ниту на мене не ми го даде, триесет години!
    meaning:
      en: She hasn't given it even to me, in thirty years!
      pt: Nem para mim ela deu, em trinta anos!
  - speaker: protagonist
    text: Да ви помогнам со садовите?
    meaning:
      en: Can I help with the dishes?
      pt: Deixa eu ajudar com a louça?
  - speaker: svekrva-c
    text: Не, не, седи. Гостинката не мие.
    meaning:
      en: No, no, sit. A guest doesn't wash up.
      pt: Não, não, senta. Visita não lava louça.
  - speaker: bojan
    text: Тоа беше тест. Го помина!
    meaning:
      en: That was a test. You passed it!
      pt: Isso foi um teste. Você passou!
  - speaker: protagonist
    text: А останатото?
    meaning:
      en: And the rest?
      pt: E o resto?
  - speaker: bojan
    text: Останатото ќе го видиме на свадбата.
    meaning:
      en: The rest we'll see at the wedding.
      pt: O resto a gente vê no casamento.
- type: narrator
  text:
    en: 'Clitic clusters: ''to whom'' then ''what'', always before the verb (or after a command): ќе ти го дадам (I''ll give it to you), не му го давај (don''t give it to him), дај ми ја (give it to me).'
    pt: 'Grupos de pronomes: ''a quem'' depois ''o quê'', sempre antes do verbo (ou depois de uma ordem): ќе ти го дадам (vou te dar), не му го давај (não dá para ele), дај ми ја (me dá).'
