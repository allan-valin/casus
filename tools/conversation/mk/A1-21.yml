steps:
- type: narrator
  text:
    en: Mrs Stojanovska shows you her balcony full of plants. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Stojanovska mostra a varanda dela, cheia de plantas. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Ова е мојот балкон. Тука растат цвеќиња.
    meaning:
      en: This is my balcony. Flowers grow here.
      pt: Esta é a minha varanda. Aqui crescem flores.
  - speaker: protagonist
    text: Многу убави цвеќиња! А ова?
    meaning:
      en: Very pretty flowers! And this?
      pt: Que flores bonitas! E isto?
  - speaker: vera
    text: Ова е босилок, за салата.
    meaning:
      en: This is basil, for salad.
      pt: Isto é manjericão, para salada.
  - speaker: protagonist
    text: А ова дрво?
    meaning:
      en: And this tree?
      pt: E esta árvore?
  - speaker: vera
    text: Тоа е лимон. Расте бавно и пие многу вода.
    meaning:
      en: That's a lemon tree. It grows slowly and drinks a lot of water.
      pt: É um limoeiro. Cresce devagar e bebe muita água.
  - speaker: protagonist
    text: Листовите се големи! Утре купувам цвеќе за Ана. Пет или шест?
    meaning:
      en: The leaves are big! Tomorrow I'm buying flowers for Ana. Five or six?
      pt: As folhas são grandes! Amanhã vou comprar flores para a Ana. Cinco ou seis?
  - speaker: vera
    text: Пет! Никогаш шест.
    meaning:
      en: Five! Never six.
      pt: Cinco! Nunca seis.
  - speaker: protagonist
    text: Зошто?
    meaning:
      en: Why?
      pt: Por quê?
  - speaker: vera
    text: Парен број е за мртвите.
    meaning:
      en: An even number is for the dead.
      pt: Número par é para os mortos.
