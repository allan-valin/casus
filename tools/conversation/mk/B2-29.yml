- type: narrator
  text:
    en: Ohrid again, at sunset. Bojan is strangely nervous. Listen to the conversation; you don't need to understand it yet.
    pt: Ohrid de novo, ao pôr do sol. O Bojan está estranhamente nervoso. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Што ти е? Многу си нервозен.
    meaning:
      en: What's wrong? You're very nervous.
      pt: O que você tem? Está muito nervoso.
  - speaker: bojan
    text: Те сакам. Ќе се земеме?
    meaning:
      en: I love you. Will you marry me?
      pt: Eu te amo. Casa comigo?
  - speaker: protagonist
    text: Да! Да, да!
    meaning:
      en: Yes! Yes, yes!
      pt: Sim! Sim, sim!
  - speaker: bojan
    text: Прстенот беше на баба ми.
    meaning:
      en: The ring was my grandmother's.
      pt: O anel era da minha avó.
  - speaker: protagonist
    text: Прекрасен е. А моите родители?
    meaning:
      en: It's wonderful. And my parents?
      pt: É lindo. E os meus pais?
  - speaker: bojan
    text: Ги прашав твоите родители, минатата недела, преку видео.
    meaning:
      en: I asked your parents last week, by video.
      pt: Eu perguntei aos seus pais semana passada, por vídeo.
  - speaker: protagonist
    text: Ги праша? На португалски?
    meaning:
      en: You asked them? In Portuguese?
      pt: Você perguntou? Em português?
  - speaker: bojan
    text: Со Гугл преведувач. Татко ти рече „sim“. Да ни е среќно!
    meaning:
      en: With Google Translate. Your father said 'sim'. May it bring us luck!
      pt: Com o Google Tradutor. Seu pai disse 'sim'. Que nos traga felicidade!
