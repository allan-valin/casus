steps:
- type: narrator
  text:
    en: The last lunch by the lake, then the bus back. Listen to the conversation; you don't need to understand it yet.
    pt: O último almoço à beira do lago, depois o ônibus de volta. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: konobar
    text: Што ќе нарачате?
    meaning:
      en: What will you have?
      pt: O que vão pedir?
  - speaker: protagonist
    text: Охридска пастрмка, ве молам.
    meaning:
      en: Ohrid trout, please.
      pt: Truta de Ohrid, por favor.
  - speaker: konobar
    text: Охридската е заштитена, не смееме да ја продаваме. Имаме друга пастрмка.
    meaning:
      en: The Ohrid one is protected, we're not allowed to sell it. We have another trout.
      pt: A de Ohrid é protegida, não podemos vender. Temos outra truta.
  - speaker: protagonist
    text: Добро, друга тогаш.
    meaning:
      en: All right, another one then.
      pt: Tá bom, outra então.
  - speaker: protagonist
    text: Сметката ја платив. Ајде, автобусот е во пет.
    meaning:
      en: I paid the bill. Come on, the bus is at five.
      pt: Paguei a conta. Vamos, o ônibus é às cinco.
  - speaker: ana
    text: Ја зеде ли картата?
    meaning:
      en: Did you take the ticket?
      pt: Você pegou a passagem?
  - speaker: protagonist
    text: Да, ја имам. И сликите ги имам — сто слики!
    meaning:
      en: Yes, I have it. And I have the photos — a hundred photos!
      pt: Sim, está comigo. E as fotos também — cem fotos!
  - speaker: ana
    text: Охрид многу ми се допадна. Следниот пат — Преспа!
    meaning:
      en: I really liked Ohrid. Next time — Prespa!
      pt: Gostei muito de Ohrid. Da próxima vez — Prespa!
- type: narrator
  text:
    en: The Ohrid trout lives only in this lake and was overfished. Since 2004 catching and selling it has been banned, so honest restaurants serve another trout.
    pt: A truta de Ohrid só vive neste lago e foi pescada demais. Desde 2004 é proibido pescar e vender, então restaurante honesto serve outra truta.
