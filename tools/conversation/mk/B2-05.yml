steps:
- type: narrator
  text:
    en: 'Second round: money and the contract. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Segunda rodada: dinheiro e contrato. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: nikolovski
    text: Платата е шеесет илјади денари нето месечно.
    meaning:
      en: The salary is sixty thousand denars net a month.
      pt: O salário é sessenta mil dinares líquidos por mês.
  - speaker: protagonist
    text: Нето, не бруто?
    meaning:
      en: Net, not gross?
      pt: Líquido, não bruto?
  - speaker: nikolovski
    text: Нето. Прво три месеци пробна работа, потоа договор на неопределено време.
    meaning:
      en: Net. First three months' probation, then a permanent contract.
      pt: Líquido. Primeiro três meses de experiência, depois contrato por tempo indeterminado.
  - speaker: protagonist
    text: Кога би почнала?
    meaning:
      en: When would I start?
      pt: Quando eu começaria?
  - speaker: nikolovski
    text: Од први март, ако ви одговара.
    meaning:
      en: From the first of March, if it suits you.
      pt: A partir de primeiro de março, se for bom para a senhora.
  - speaker: protagonist
    text: Дотогаш ќе бидам завршила со сегашната фирма. Отказниот рок е еден месец.
    meaning:
      en: By then I'll have finished with my current company. The notice period is one month.
      pt: Até lá terei terminado com a empresa atual. O aviso prévio é de um mês.
  - speaker: nikolovski
    text: Совршено. Имаме договор?
    meaning:
      en: Perfect. Do we have a deal?
      pt: Perfeito. Fechado?
  - speaker: protagonist
    text: Имаме договор!
    meaning:
      en: We have a deal!
      pt: Fechado!
