# UNIT mk·pt-BR A1-01 — written by AI (Claude) for Casus, 2026-10-21, after the accepted plan
# (docs/conversation/PLAN-mk-pt-BR.md) and story bible. Checked with tools/conversation_check.py and the proofreader.

id: A1-01
level: A1
number: 1
protagonist: f
title: {en: "The landlady", pt: "A dona do apartamento"}
situation:
  en: "You have just arrived at the building in Skopje, in the Karpoš district. The landlady, Mrs Stojanovska, opens the door."
  pt: "Você acabou de chegar ao prédio em Skopje, no bairro de Karpoš. A dona do apartamento, a senhora Stojanovska, abre a porta."
learn_lessons: [a1-sum, a1-pronouns]
culture: Calling the landlady by her first name

new_items:
  - {id: dobar-den, text: "Добар ден", meaning: {en: "Good day / hello", pt: "Bom dia / boa tarde"}, register: formal}
  - {id: izvinete, text: "Извинете", meaning: {en: "Excuse me / sorry (formal)", pt: "Com licença / desculpe (formal)"}, register: formal, rare: true}
  - {id: ne-razbiram, text: "Не разбирам", meaning: {en: "I don't understand", pt: "Não entendo"}}
  - {id: zboruvate-angliski, text: "Зборувате ли англиски?", meaning: {en: "Do you speak English? (formal)", pt: "A senhora fala inglês?"}, register: formal, rare: true}
  - {id: da, text: "Да", meaning: {en: "Yes", pt: "Sim"}}
  - {id: od-brazil, text: "Од Бразил сум", meaning: {en: "I'm from Brazil", pt: "Sou do Brasil"}, rare: true}
  - {id: malku, text: "Малку", meaning: {en: "A little", pt: "Um pouco"}}
  - {id: jas-sum, text: "Јас сум", meaning: {en: "I am", pt: "Eu sou"}}
  - {id: novata-stanarka, text: "новата станарка", meaning: {en: "the new tenant (a woman)", pt: "a nova inquilina"}, rare: true}
  - {id: povelete, text: "Повелете", meaning: {en: "Here you are / come in / help yourself (formal)", pt: "Aqui está / pode entrar / sirva-se (formal)"}, register: formal, rare: true}
  - {id: ova-e, text: "Ова е", meaning: {en: "This is", pt: "Este é / isto é"}}
  - {id: klucot, text: "клучот", meaning: {en: "the key", pt: "a chave"}}
  - {id: blagodaram, text: "Благодарам", meaning: {en: "Thank you", pt: "Obrigada / obrigado"}}
  - {id: gospogjo, text: "госпоѓо Стојановска", meaning: {en: "Mrs Stojanovska (calling her)", pt: "senhora Stojanovska (chamando-a)"}, register: formal}
  - {id: nema-zosto, text: "Нема зошто", meaning: {en: "You're welcome", pt: "De nada"}}
  - {id: dobredojdovte, text: "Добредојдовте", meaning: {en: "Welcome (formal)", pt: "Bem-vinda / bem-vindos (formal)"}, register: formal, rare: true}

reviews: []

steps:
  - type: narrator
    text:
      en: "You have just arrived in North Macedonia. Listen to the conversation with the landlady. You don't need to understand it yet."
      pt: "Você acabou de chegar à Macedônia do Norte. Escute a conversa com a dona do apartamento. Ainda não precisa entender."
  - type: dialogue
    lines:
      - {speaker: protagonist, text: "Добар ден!", meaning: {en: "Good afternoon!", pt: "Boa tarde!"}}
      - {speaker: vera, text: "Добар ден. Вие сте новата станарка?", meaning: {en: "Good afternoon. You are the new tenant?", pt: "Boa tarde. A senhora é a nova inquilina?"}}
      - {speaker: protagonist, text: "Извинете, не разбирам.", meaning: {en: "Sorry, I don't understand.", pt: "Desculpe, não entendo."}}
      - {speaker: vera, text: "Новата станарка? Од Бразил?", meaning: {en: "The new tenant? From Brazil?", pt: "A nova inquilina? Do Brasil?"}}
      - {speaker: protagonist, text: "Да, од Бразил сум. Зборувате ли англиски?", meaning: {en: "Yes, I'm from Brazil. Do you speak English?", pt: "Sim, sou do Brasil. A senhora fala inglês?"}}
      - {speaker: vera, text: "Малку. Јас сум Вера Стојановска.", meaning: {en: "A little. I am Vera Stojanovska.", pt: "Um pouco. Eu sou Vera Stojanovska."}}
      - {speaker: vera, text: "Повелете, ова е клучот.", meaning: {en: "Here you are, this is the key.", pt: "Aqui está, esta é a chave."}}
      - {speaker: protagonist, text: "Благодарам, госпоѓо Стојановска!", meaning: {en: "Thank you, Mrs Stojanovska!", pt: "Obrigada, senhora Stojanovska!"}}
      - {speaker: vera, text: "Нема зошто. Добредојдовте во Скопје!", meaning: {en: "You're welcome. Welcome to Skopje!", pt: "De nada. Bem-vinda a Skopje!"}}
  - type: narrator
    text:
      en: "To greet someone you don't know, say 'Добар ден'. Listen."
      pt: "Para cumprimentar alguém que você não conhece, diga 'Добар ден'. Escute."
  - {type: line, speaker: vera, item: dobar-den}
  - type: prompt
    ask: {en: "Greet the landlady.", pt: "Cumprimente a dona do apartamento."}
    answer: {speaker: protagonist, text: "Добар ден!"}
    items: [dobar-den]
  - type: narrator
    text:
      en: "'Извинете' is 'sorry' or 'excuse me', in the polite form. Notice the stress on 'ВИ'."
      pt: "'Извинете' é 'desculpe' ou 'com licença', na forma educada. Repare: a força cai em 'ВИ'."
  - type: buildup
    item: izvinete
    parts: ["-нете", "-винете", "Извинете"]
  - type: prompt
    ask: {en: "Say 'excuse me' to get her attention.", pt: "Peça licença para falar com ela."}
    answer: {speaker: protagonist, text: "Извинете!"}
    items: [izvinete]
  - {type: line, speaker: vera, item: ne-razbiram}
  - type: prompt
    ask: {en: "Say that you don't understand.", pt: "Diga que você não entende."}
    answer: {speaker: protagonist, text: "Не разбирам."}
    items: [ne-razbiram]
  - type: prompt
    ask: {en: "Apologise and say that you don't understand.", pt: "Peça desculpas e diga que não entende."}
    answer: {speaker: protagonist, text: "Извинете, не разбирам."}
    items: [izvinete, ne-razbiram]
  - type: narrator
    text:
      en: "She asks whether you are from Brazil. 'Сум' is 'I am'; it comes after: 'од Бразил сум', 'from Brazil I am'."
      pt: "Ela pergunta se você é do Brasil. 'Сум' é 'sou'; ele vem depois: 'од Бразил сум', 'do Brasil sou'."
  - type: prompt
    ask: {en: "Say that you are from Brazil.", pt: "Diga que é do Brasil."}
    answer: {speaker: protagonist, text: "Од Бразил сум."}
    items: [od-brazil]
  - type: prompt
    ask: {en: "Answer 'yes, I'm from Brazil'.", pt: "Responda 'sim, sou do Brasil'."}
    answer: {speaker: protagonist, text: "Да, од Бразил сум."}
    items: [da, od-brazil]
  - type: narrator
    text:
      en: "With an older lady you don't know, use 'Вие', the polite form. Ask whether she speaks English."
      pt: "Com uma senhora mais velha que você não conhece, use 'Вие', o tratamento educado. Pergunte se ela fala inglês."
  - type: buildup
    item: zboruvate-angliski
    parts: ["англиски?", "ли англиски?", "Зборувате ли англиски?"]
  - type: prompt
    ask: {en: "Ask: do you speak English?", pt: "Pergunte: a senhora fala inglês?"}
    answer: {speaker: protagonist, text: "Зборувате ли англиски?"}
    items: [zboruvate-angliski]
  - {type: line, speaker: vera, item: malku}
  - type: prompt
    ask: {en: "She speaks only a little English. How did she say 'a little'?", pt: "Ela fala inglês só um pouco. Como ela disse 'um pouco'?"}
    answer: {speaker: protagonist, text: "Малку."}
    items: [malku]
  - type: narrator
    text:
      en: "To introduce yourself: 'Јас сум' and your name. She says: 'Јас сум Вера Стојановска'."
      pt: "Para se apresentar: 'Јас сум' e o seu nome. Ela diz: 'Јас сум Вера Стојановска'."
  - type: prompt
    ask: {en: "Say 'I am from Brazil', starting with 'I am'.", pt: "Diga 'eu sou do Brasil', começando por 'eu sou'."}
    answer: {speaker: protagonist, text: "Јас сум од Бразил."}
    items: [jas-sum]
  - type: prompt
    ask: {en: "Say that you are the new tenant.", pt: "Diga que você é a nova inquilina."}
    answer: {speaker: protagonist, text: "Јас сум новата станарка."}
    items: [jas-sum, novata-stanarka]
  - type: narrator
    text:
      en: "She hands over the key: 'Повелете, ова е клучот'. 'Повелете' is for offering anything, and for asking someone in."
      pt: "Ela entrega a chave: 'Повелете, ова е клучот'. 'Повелете' serve para oferecer qualquer coisa, e para convidar a entrar."
  - {type: line, speaker: vera, item: povelete}
  - type: prompt
    ask: {en: "Show the key: 'this is the key'.", pt: "Mostre a chave: 'esta é a chave'."}
    answer: {speaker: protagonist, text: "Ова е клучот."}
    items: [ova-e, klucot]
  - type: prompt
    ask: {en: "Thank her.", pt: "Agradeça."}
    answer: {speaker: protagonist, text: "Благодарам!"}
    items: [blagodaram]
  - type: narrator
    text:
      en: "Don't call her Vera: use 'госпоѓо' and her surname. When you call someone, 'госпоѓа' becomes 'госпоѓо'."
      pt: "Não a chame de Vera: use 'госпоѓо' e o sobrenome. Ao chamar alguém, 'госпоѓа' vira 'госпоѓо'."
  - type: buildup
    item: gospogjo
    parts: ["-новска", "Стојановска", "госпоѓо Стојановска"]
  - type: prompt
    ask: {en: "Thank her, using her surname.", pt: "Agradeça, chamando-a pelo sobrenome."}
    answer: {speaker: protagonist, text: "Благодарам, госпоѓо Стојановска!"}
    items: [blagodaram, gospogjo]
  - {type: line, speaker: vera, item: nema-zosto}
  - type: prompt
    ask: {en: "Someone thanks you. Say 'you're welcome'.", pt: "Alguém lhe agradece. Responda 'de nada'."}
    answer: {speaker: protagonist, text: "Нема зошто."}
    items: [nema-zosto]
  - {type: line, speaker: vera, item: dobredojdovte}
  - type: prompt
    ask: {en: "How did she say 'welcome'?", pt: "Como ela disse 'bem-vinda'?"}
    answer: {speaker: protagonist, text: "Добредојдовте!"}
    items: [dobredojdovte]
  - type: prompt
    ask: {en: "She offered the key with one word. Which?", pt: "Ela ofereceu a chave com uma palavra. Qual?"}
    answer: {speaker: protagonist, text: "Повелете."}
    items: [povelete]
  - type: prompt
    ask: {en: "Greet her again and ask whether she speaks English.", pt: "Cumprimente de novo e pergunte se ela fala inglês."}
    answer: {speaker: protagonist, text: "Добар ден! Зборувате ли англиски?"}
    items: [dobar-den, zboruvate-angliski]
  - type: prompt
    ask: {en: "Say: sorry, I don't understand, I'm from Brazil.", pt: "Diga: desculpe, não entendo, eu sou do Brasil."}
    answer: {speaker: protagonist, text: "Извинете, не разбирам. Јас сум од Бразил."}
    items: [izvinete, ne-razbiram, jas-sum]
  - type: prompt
    ask: {en: "She says 'welcome'. Thank her, using her surname.", pt: "Ela diz 'bem-vinda'. Agradeça, chamando-a pelo sobrenome."}
    answer: {speaker: protagonist, text: "Благодарам, госпоѓо Стојановска!"}
    items: [blagodaram, gospogjo]
  - type: prompt
    ask: {en: "Does she speak English? Answer for her: 'yes, a little'.", pt: "Ela fala inglês? Responda por ela: 'sim, um pouco'."}
    answer: {speaker: protagonist, text: "Да, малку."}
    items: [da, malku]
  - type: prompt
    ask: {en: "Offer the key to a neighbour, politely: 'here you are, this is the key'.", pt: "Ofereça a chave a um vizinho, com educação: 'aqui está, esta é a chave'."}
    answer: {speaker: protagonist, text: "Повелете, ова е клучот."}
    items: [povelete, ova-e, klucot]
  - type: prompt
    ask: {en: "She asks again whether you are the new tenant. Answer 'yes, I am the new tenant'.", pt: "Ela pergunta de novo se você é a nova inquilina. Responda 'sim, eu sou a nova inquilina'."}
    answer: {speaker: protagonist, text: "Да, јас сум новата станарка."}
    items: [da, jas-sum, novata-stanarka]
  - type: prompt
    ask: {en: "A friend arrives from Brazil. Welcome him and his parents, in the polite form.", pt: "Um amigo chega do Brasil. Dê as boas-vindas a ele e aos pais dele, na forma educada."}
    answer: {speaker: protagonist, text: "Добредојдовте!"}
    items: [dobredojdovte]
  - type: prompt
    ask: {en: "They thank you. Say 'you're welcome'.", pt: "Eles agradecem. Responda 'de nada'."}
    answer: {speaker: protagonist, text: "Нема зошто."}
    items: [nema-zosto]
  - type: narrator
    text:
      en: "Listen to the conversation again. Now you understand it."
      pt: "Escute a conversa outra vez. Agora você entende."
  - {type: dialogue, again: true}
  - type: selfcheck
