steps:
- type: narrator
  text:
    en: The hall. The music starts and nobody stays seated. Listen to the conversation; you don't need to understand it yet.
    pt: O salão. A música começa e ninguém fica sentado. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Ајде, стани! Фати ме за рака!
    meaning:
      en: Come on, get up! Take my hand!
      pt: Vamos, levanta! Pega na minha mão!
  - speaker: protagonist
    text: Не знам да играм оро!
    meaning:
      en: I don't know how to dance the oro!
      pt: Não sei dançar o oro!
  - speaker: marko
    text: Тука никој не седи кога свири оро.
    meaning:
      en: Here nobody sits when the oro plays.
      pt: Aqui ninguém fica sentado quando toca o oro.
  - speaker: protagonist
    text: Добро... оди полека.
    meaning:
      en: All right... go slowly.
      pt: Tá bom... vai devagar.
  - speaker: marko
    text: Следи ме. Чекор десно, чекор лево.
    meaning:
      en: Follow me. Step right, step left.
      pt: Me segue. Passo para a direita, passo para a esquerda.
  - speaker: protagonist
    text: Гледај ги — играат и пеат истовремено!
    meaning:
      en: Look at them — they dance and sing at the same time!
      pt: Olha eles — dançam e cantam ao mesmo tempo!
  - speaker: marko
    text: Играјќи и пеејќи — така се слави.
    meaning:
      en: Dancing and singing — that's how you celebrate.
      pt: Dançando e cantando — é assim que se comemora.
  - speaker: protagonist
    text: Се изморив! Колку трае свадбата?
    meaning:
      en: I'm tired! How long does the wedding go on?
      pt: Cansei! Quanto tempo dura o casamento?
  - speaker: marko
    text: До зори!
    meaning:
      en: Until dawn!
      pt: Até o amanhecer!
