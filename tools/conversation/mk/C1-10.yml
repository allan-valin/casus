steps:
- type: narrator
  text:
    en: Marko and his fiancée ask you to be their кум. Listen to the conversation; you don't need to understand it yet.
    pt: O Marko e a noiva pedem para você ser o кум deles. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Брате, имаме едно прашање. Сакаме да ни бидеш кум.
    meaning:
      en: Bro, we have a question. We want you to be our кум.
      pt: Mano, temos uma pergunta. Queremos que você seja nosso кум.
  - speaker: protagonist
    text: Јас? Странец?
    meaning:
      en: Me? A foreigner?
      pt: Eu? Um estrangeiro?
  - speaker: marko
    text: Ти си ни најдобар пријател. Кумство не се одбива!
    meaning:
      en: You're our best friend. You can't refuse being кум!
      pt: Você é nosso melhor amigo. Compadrio não se recusa!
  - speaker: protagonist
    text: Тоа е голема чест за мене. Но и обврска.
    meaning:
      en: It's a great honour for me. But also a duty.
      pt: É uma grande honra para mim. Mas também um compromisso.
  - speaker: marko
    text: Да. Има да ги крстиш и нашите деца.
    meaning:
      en: Yes. You'll have to christen our children too.
      pt: É. Você vai ter que batizar nossos filhos também.
  - speaker: protagonist
    text: На крштевка ќе бидам и на македонски и на португалски!
    meaning:
      en: At the christening I'll be there in Macedonian and in Portuguese!
      pt: No batizado vou estar em macedônio e em português!
  - speaker: marko
    text: Значи — да?
    meaning:
      en: So — yes?
      pt: Então — sim?
  - speaker: protagonist
    text: Примам. Ќе се трудам да бидам добар кум.
    meaning:
      en: I accept. I'll do my best to be a good кум.
      pt: Aceito. Vou me esforçar para ser um bom кум.
