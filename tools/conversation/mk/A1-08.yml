steps:
- type: narrator
  text:
    en: Your first day at work. You ask a woman in the street the way to Macedonia Street. Listen to the conversation; you don't need to understand it yet.
    pt: Seu primeiro dia de trabalho. Você pergunta a uma mulher na rua o caminho para a rua Macedônia. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Извинете, каде е улица Македонија?
    meaning:
      en: Excuse me, where is Macedonia Street?
      pt: Com licença, onde fica a rua Macedônia?
  - speaker: passerby
    text: Одете право, па лево.
    meaning:
      en: Go straight on, then left.
      pt: Vá em frente, depois à esquerda.
  - speaker: protagonist
    text: Далеку е?
    meaning:
      en: Is it far?
      pt: É longe?
  - speaker: passerby
    text: Не, близу е. Пет минути пешки.
    meaning:
      en: No, it's near. Five minutes on foot.
      pt: Não, é perto. Cinco minutos a pé.
  - speaker: protagonist
    text: А автобуската станица?
    meaning:
      en: And the bus stop?
      pt: E o ponto de ônibus?
  - speaker: passerby
    text: Станицата е десно, до аптеката.
    meaning:
      en: The stop is on the right, next to the pharmacy.
      pt: O ponto fica à direita, ao lado da farmácia.
  - speaker: protagonist
    text: Право, па лево. Благодарам!
    meaning:
      en: Straight on, then left. Thank you!
      pt: Em frente, depois à esquerda. Obrigado!
  - speaker: passerby
    text: Нема зошто. Добар ден!
    meaning:
      en: You're welcome. Good day!
      pt: De nada. Bom dia!
- type: narrator
  text:
    en: 'To ask the way: ''Каде е …?'' and the place. Streets are named: ''улица Македонија''.'
    pt: 'Para perguntar o caminho: ''Каде е …?'' e o lugar. As ruas têm nome: ''улица Македонија'' (rua Macedônia).'
