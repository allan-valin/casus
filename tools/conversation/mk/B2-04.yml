steps:
- type: narrator
  text:
    en: Monday, Vardar Soft. Mr Nikolovski asks the questions. Listen to the conversation; you don't need to understand it yet.
    pt: Segunda, Vardar Soft. O senhor Nikolovski faz as perguntas. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: nikolovski
    text: Кажете ми нешто за себе.
    meaning:
      en: Tell me something about yourself.
      pt: Fale um pouco sobre o senhor.
  - speaker: protagonist
    text: Програмер сум, осум години. Три години веќе работам во Скопје.
    meaning:
      en: I'm a programmer, eight years. I've been working in Skopje three years.
      pt: Sou programador há oito anos. Já trabalho em Skopje há três.
  - speaker: nikolovski
    text: Кои се вашите силни страни?
    meaning:
      en: What are your strengths?
      pt: Quais são os seus pontos fortes?
  - speaker: protagonist
    text: Одговорен сум и добро работам во тим.
    meaning:
      en: I'm responsible and I work well in a team.
      pt: Sou responsável e trabalho bem em equipe.
  - speaker: nikolovski
    text: А слаби страни?
    meaning:
      en: And weaknesses?
      pt: E pontos fracos?
  - speaker: protagonist
    text: Понекогаш гледам премногу детали.
    meaning:
      en: Sometimes I look at too many details.
      pt: Às vezes presto atenção em detalhes demais.
  - speaker: nikolovski
    text: Зошто баш нас?
    meaning:
      en: Why us in particular?
      pt: Por que justamente nós?
  - speaker: protagonist
    text: Сакам да останам во Македонија и да растам со една домашна фирма.
    meaning:
      en: I want to stay in Macedonia and grow with a local company.
      pt: Quero ficar na Macedônia e crescer com uma empresa daqui.
