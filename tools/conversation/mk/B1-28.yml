steps:
- type: narrator
  text:
    en: Goran is moving to a new flat. Everyone carries boxes. Listen to the conversation; you don't need to understand it yet.
    pt: O Goran está se mudando para um apartamento novo. Todo mundo carrega caixa. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: goran
    text: Благодарам што дојдовте! Се селам на петти кат.
    meaning:
      en: Thanks for coming! I'm moving to the fifth floor.
      pt: Valeu por virem! Estou me mudando para o quinto andar.
  - speaker: protagonist
    text: Петти? А лифтот?
    meaning:
      en: Fifth? And the lift?
      pt: Quinto? E o elevador?
  - speaker: goran
    text: Лифтот не работи. По скалите!
    meaning:
      en: The lift isn't working. Up the stairs!
      pt: O elevador não funciona. Pela escada!
  - speaker: marko
    text: Носи ја оваа кутија. Внимавај, тешка е!
    meaning:
      en: Carry this box. Careful, it's heavy!
      pt: Carrega essa caixa. Cuidado, é pesada!
  - speaker: protagonist
    text: Што има внатре? Камења?
    meaning:
      en: What's inside? Stones?
      pt: O que tem dentro? Pedras?
  - speaker: goran
    text: Книги. Сите мои книги.
    meaning:
      en: Books. All my books.
      pt: Livros. Todos os meus livros.
  - speaker: marko
    text: Качувајќи се, зборувајќи — ќе стигнеме до вечер!
    meaning:
      en: Climbing and talking — we'll be done by evening!
      pt: Subindo e conversando — a gente termina até a noite!
  - speaker: goran
    text: Потоа пица за сите, јас частам!
    meaning:
      en: Then pizza for everyone, it's on me!
      pt: Depois pizza para todo mundo, eu pago!
