steps:
- type: narrator
  text:
    en: A comedy night in a basement bar. The comedian picks on the foreigner in the front row. Listen to the conversation; you don't need to understand it yet.
    pt: Uma noite de comédia num bar de porão. O comediante pega no pé do estrangeiro da primeira fila. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: komicar
    text: Имаме странец во првиот ред! Од каде си?
    meaning:
      en: We have a foreigner in the front row! Where are you from?
      pt: Temos um estrangeiro na primeira fila! De onde você é?
  - speaker: protagonist
    text: Од Бразил.
    meaning:
      en: From Brazil.
      pt: Do Brasil.
  - speaker: komicar
    text: Од Бразил — и дошол во Скопје! Доброволно!
    meaning:
      en: From Brazil — and he came to Skopje! Voluntarily!
      pt: Do Brasil — e veio para Skopje! Por vontade própria!
  - speaker: komicar
    text: Ние сме биле толку интересни? Ние сме познати само по промаја и кафе!
    meaning:
      en: Are we really that interesting? We're famous only for drafts and coffee!
      pt: A gente é tão interessante assim? A gente só é famoso por corrente de ar e café!
  - speaker: protagonist
    text: И по ракија!
    meaning:
      en: And rakija!
      pt: E pela rakija!
  - speaker: komicar
    text: Ете, тој веќе е наш! Аплауз!
    meaning:
      en: There, he's already one of us! Applause!
      pt: Pronto, ele já é dos nossos! Aplausos!
  - speaker: goran
    text: Не се навреди?
    meaning:
      en: You didn't get offended?
      pt: Não se ofendeu?
  - speaker: protagonist
    text: Не. Тој се смее на своја сметка — тоа е самоиронија. И погоди.
    meaning:
      en: No. He laughs at his own expense — that's self-irony. And he hit the mark.
      pt: Não. Ele ri às próprias custas — é autoironia. E acertou.
