steps:
- type: narrator
  text:
    en: 'A chart on the office screen: a new survey about young people leaving. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Um gráfico na tela do escritório: uma pesquisa nova sobre jovens que vão embora. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: ana
    text: Види ја анкетата. Покажува дека половина од младите сакаат да заминат.
    meaning:
      en: Look at the survey. It shows half of young people want to leave.
      pt: Olha a pesquisa. Mostra que metade dos jovens quer ir embora.
  - speaker: protagonist
    text: Половина? Зошто?
    meaning:
      en: Half? Why?
      pt: Metade? Por quê?
  - speaker: ana
    text: Велат дека платите се мали. Просекот е многу понизок од Германија.
    meaning:
      en: They say salaries are low. The average is much lower than in Germany.
      pt: Dizem que os salários são baixos. A média é muito menor que na Alemanha.
  - speaker: protagonist
    text: А графиконот?
    meaning:
      en: And the chart?
      pt: E o gráfico?
  - speaker: ana
    text: Од сто млади, педесет сакаат да заминат.
    meaning:
      en: Out of a hundred young people, fifty want to leave.
      pt: De cada cem jovens, cinquenta querem ir embora.
  - speaker: protagonist
    text: Но тоа што сакаат не значи дека ќе заминат.
    meaning:
      en: But wanting to doesn't mean they will leave.
      pt: Mas querer não quer dizer que vão embora.
  - speaker: ana
    text: Точно. А ти дојде тука — обратно од сите!
    meaning:
      en: Right. And you came here — the opposite of everyone!
      pt: Isso. E você veio para cá — o contrário de todo mundo!
  - speaker: protagonist
    text: Јас сум статистичка грешка.
    meaning:
      en: I'm a statistical error.
      pt: Eu sou um erro estatístico.
