- type: narrator
  text:
    en: 'A survey tells you what people say, not what they do: ''they want to leave'' is not ''they left''. Ask who was asked, how many, and when.'
    pt: 'Pesquisa diz o que as pessoas falam, não o que fazem: ''querem ir embora'' não é ''foram embora''. Pergunte quem foi ouvido, quantos, e quando.'
- type: narrator
  text:
    en: 'Emigration is real: the 2021 census counted about 1.8 million residents, fewer than in 2002. Exact survey numbers change every year, so read the source, not the headline.'
    pt: 'A emigração é real: o censo de 2021 contou cerca de 1,8 milhão de residentes, menos que em 2002. Os números de pesquisa mudam todo ano, então leia a fonte, não a manchete.'
