steps:
- type: narrator
  text:
    en: You are cooking pasta. Mrs Stojanovska looks in to check. Listen to the conversation; you don't need to understand it yet.
    pt: Você está cozinhando macarrão. A senhora Stojanovska passa para conferir. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Добар ден! Што готвите?
    meaning:
      en: Hello! What are you cooking?
      pt: Boa tarde! O que o senhor está cozinhando?
  - speaker: protagonist
    text: Тестенини. Водата е на шпоретот.
    meaning:
      en: Pasta. The water is on the stove.
      pt: Macarrão. A água está no fogão.
  - speaker: vera
    text: Врие ли водата?
    meaning:
      en: Is the water boiling?
      pt: A água está fervendo?
  - speaker: protagonist
    text: Не, уште не врие.
    meaning:
      en: No, it isn't boiling yet.
      pt: Não, ainda não ferveu.
  - speaker: vera
    text: Кога врие, ставете сол. Малку сол, не многу.
    meaning:
      en: When it boils, put in salt. A little salt, not much.
      pt: Quando ferver, coloque sal. Um pouco, não muito.
  - speaker: protagonist
    text: А шеќер?
    meaning:
      en: And sugar?
      pt: E açúcar?
  - speaker: vera
    text: Шеќер во тестенини? Не!
    meaning:
      en: Sugar in pasta? No!
      pt: Açúcar no macarrão? Não!
  - speaker: protagonist
    text: Сега врие! Сол... готово. Пробајте!
    meaning:
      en: Now it's boiling! Salt... done. Try it!
      pt: Agora ferveu! Sal... pronto. Prove!
  - speaker: vera
    text: Мммм. Браво!
    meaning:
      en: Mmm. Well done!
      pt: Hum. Muito bem!
