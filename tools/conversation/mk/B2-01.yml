steps:
- type: narrator
  text:
    en: Your contract with the foreign company ends this year. A Macedonian company calls. Listen to the conversation; you don't need to understand it yet.
    pt: Seu contrato com a empresa estrangeira acaba este ano. Uma empresa macedônia liga. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: nikolovski
    text: Добар ден, Николовски од „Вардар Софт“. Имаме понуда за вас.
    meaning:
      en: Good afternoon, Nikolovski from Vardar Soft. We have an offer for you.
      pt: Boa tarde, Nikolovski, da Vardar Soft. Temos uma proposta para a senhora.
  - speaker: protagonist
    text: Добар ден. Каква понуда?
    meaning:
      en: Good afternoon. What kind of offer?
      pt: Boa tarde. Que tipo de proposta?
  - speaker: nikolovski
    text: Работно место за програмер. Се бара искуство и македонски.
    meaning:
      en: A programmer position. Experience and Macedonian are required.
      pt: Uma vaga de programadora. Exige-se experiência e macedônio.
  - speaker: protagonist
    text: Искуство имам. Македонски — учам!
    meaning:
      en: Experience I have. Macedonian — I'm learning!
      pt: Experiência eu tenho. Macedônio — estou aprendendo!
  - speaker: nikolovski
    text: Одлично ви оди. Какви се условите што ги барате?
    meaning:
      en: You're doing very well. What terms are you looking for?
      pt: A senhora vai muito bem. Que condições a senhora procura?
  - speaker: protagonist
    text: Заинтересирана сум, но прво сакам да ги видам условите.
    meaning:
      en: I'm interested, but first I'd like to see the terms.
      pt: Estou interessada, mas primeiro quero ver as condições.
  - speaker: nikolovski
    text: Секако. Кај нас се работи од девет до пет. Ви одговара ли разговор во понеделник?
    meaning:
      en: Of course. With us people work nine to five. Does an interview on Monday suit you?
      pt: Claro. Aqui se trabalha das nove às cinco. Uma entrevista na segunda serve para a senhora?
  - speaker: protagonist
    text: Ми одговара. Благодарам!
    meaning:
      en: That suits me. Thank you!
      pt: Serve. Obrigada!
