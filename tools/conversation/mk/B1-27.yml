steps:
- type: narrator
  text:
    en: Bojan's Bulgarian cousin is visiting, and they understand each other. You ask how. Listen to the conversation; you don't need to understand it yet.
    pt: O primo búlgaro do Bojan está de visita, e eles se entendem. Você pergunta como. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Како се разбирате со братучед ти?
    meaning:
      en: How do you understand your cousin?
      pt: Como você entende o seu primo?
  - speaker: bojan
    text: Бугарскиот е многу сличен. Се разбираме добро.
    meaning:
      en: Bulgarian is very similar. We understand each other well.
      pt: O búlgaro é muito parecido. A gente se entende bem.
  - speaker: protagonist
    text: А српски?
    meaning:
      en: And Serbian?
      pt: E o sérvio?
  - speaker: bojan
    text: И српски разбирам, од Југославија.
    meaning:
      en: I understand Serbian too, from the Yugoslav days.
      pt: Sérvio também entendo, do tempo da Iugoslávia.
  - speaker: protagonist
    text: А албански?
    meaning:
      en: And Albanian?
      pt: E o albanês?
  - speaker: bojan
    text: Албанскиот е сосема различен — не е словенски јазик.
    meaning:
      en: Albanian is completely different — it's not a Slavic language.
      pt: O albanês é completamente diferente — não é língua eslava.
  - speaker: protagonist
    text: Значи, македонскиот е дијалект на бугарскиот?
    meaning:
      en: So Macedonian is a dialect of Bulgarian?
      pt: Então o macedônio é um dialeto do búlgaro?
  - speaker: bojan
    text: Не! Тоа е чувствителна тема. Секој народ има свој јазик.
    meaning:
      en: No! That's a sensitive topic. Every people has its own language.
      pt: Não! Isso é tema delicado. Cada povo tem sua própria língua.
  - speaker: protagonist
    text: Разбрав. Нема повеќе такви прашања!
    meaning:
      en: Understood. No more questions like that!
      pt: Entendi. Chega desse tipo de pergunta!
