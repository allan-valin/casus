- type: narrator
  text:
    en: Macedonian and Bulgarian are close, and Bulgaria disputes the separate history of Macedonian — the question you just asked is exactly the one that hurts. Linguists treat Macedonian as a standard
      language of its own since 1945; Albanian, the second big language of the country, is not Slavic at all.
    pt: Macedônio e búlgaro são próximos, e a Bulgária contesta a história própria do macedônio — a pergunta que você fez é justamente a que dói. Os linguistas tratam o macedônio como língua padrão própria
      desde 1945; o albanês, a segunda grande língua do país, nem é eslavo.
