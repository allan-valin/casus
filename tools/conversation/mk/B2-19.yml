steps:
- type: narrator
  text:
    en: You present the project to the whole company — in Macedonian. Listen to the conversation; you don't need to understand it yet.
    pt: Você apresenta o projeto para a empresa inteira — em macedônio. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Добар ден на сите. Да почнам со целта на проектот.
    meaning:
      en: Good afternoon, everyone. Let me start with the project's goal.
      pt: Boa tarde a todos. Começo com o objetivo do projeto.
  - speaker: protagonist
    text: Целта беше побрза апликација.
    meaning:
      en: The goal was a faster app.
      pt: O objetivo era um aplicativo mais rápido.
  - speaker: protagonist
    text: 'Резултати: ја подобривме брзината и ги намаливме грешките.'
    meaning:
      en: 'Results: we improved the speed and reduced the bugs.'
      pt: 'Resultados: melhoramos a velocidade e reduzimos os erros.'
  - speaker: protagonist
    text: Корисниците ги зголемивме за дваесет проценти.
    meaning:
      en: We increased the users by twenty per cent.
      pt: Aumentamos os usuários em vinte por cento.
  - speaker: protagonist
    text: На крајот сакам да му се заблагодарам на тимот — и на Дарко.
    meaning:
      en: Finally I'd like to thank the team — and Darko.
      pt: Por fim quero agradecer à equipe — e ao Darko.
  - speaker: nikolovski
    text: Браво. Прашања?
    meaning:
      en: Well done. Questions?
      pt: Muito bem. Perguntas?
  - speaker: darko
    text: 'Само една: кога следниот проект?'
    meaning:
      en: 'Just one: when''s the next project?'
      pt: 'Só uma: quando é o próximo projeto?'
  - speaker: protagonist
    text: Прво — кафенце!
    meaning:
      en: First — a little coffee!
      pt: Primeiro — um cafezinho!
