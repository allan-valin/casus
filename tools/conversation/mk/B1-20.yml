steps:
- type: narrator
  text:
    en: You are late again. Sara has had enough. Listen to the conversation; you don't need to understand it yet.
    pt: Você se atrasou de novo. A Sara cansou. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sara
    text: Пак доцниш! Ти секогаш доцниш.
    meaning:
      en: You're late again! You're always late.
      pt: Atrasado de novo! Você sempre se atrasa.
  - speaker: protagonist
    text: Не е фер. Само кога има гужва.
    meaning:
      en: That's not fair. Only when there's traffic.
      pt: Não é justo. Só quando tem trânsito.
  - speaker: sara
    text: Секогаш има гужва кога ти доаѓаш!
    meaning:
      en: There's always traffic when you're coming!
      pt: Sempre tem trânsito quando é você que vem!
  - speaker: protagonist
    text: А ти секогаш гледаш во телефонот додека зборувам.
    meaning:
      en: And you always look at your phone while I'm talking.
      pt: E você sempre fica olhando o celular enquanto eu falo.
  - speaker: sara
    text: '...Добро. Ајде да разговараме мирно.'
    meaning:
      en: '...All right. Let''s talk calmly.'
      pt: '...Tá bom. Vamos conversar com calma.'
  - speaker: protagonist
    text: Во право си. Извини што викав.
    meaning:
      en: You're right. Sorry I shouted.
      pt: Você tem razão. Desculpa por ter gritado.
  - speaker: sara
    text: И ти извини. Откако ќе јадеме, ќе ми раскажеш за денот?
    meaning:
      en: Sorry too. After we eat, will you tell me about your day?
      pt: Desculpa também. Depois que a gente comer, você me conta do seu dia?
  - speaker: protagonist
    text: Договорено.
    meaning:
      en: Agreed.
      pt: Combinado.
