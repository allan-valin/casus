steps:
- type: narrator
  text:
    en: The New Year party at Vardar Soft. Mr Nikolovski raises his glass and looks at you. Listen to the conversation; you don't need to understand it yet.
    pt: A festa de Ano-Novo da Vardar Soft. O senhor Nikolovski levanta o copo e olha para você. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: nikolovski
    text: Колеги, сега една здравица од нашиот бразилски колега!
    meaning:
      en: Colleagues, now a toast from our Brazilian colleague!
      pt: Colegas, agora um brinde do nosso colega brasileiro!
  - speaker: protagonist
    text: Драги колеги... пред три години не знаев ниту „Добар ден“.
    meaning:
      en: Dear colleagues... three years ago I didn't even know 'Добар ден'.
      pt: Queridos colegas... três anos atrás eu não sabia nem 'Добар ден'.
  - speaker: darko
    text: А сега држи говори!
    meaning:
      en: And now he gives speeches!
      pt: E agora faz discurso!
  - speaker: protagonist
    text: Ви посакувам здравје и среќа, и успешна нова година.
    meaning:
      en: I wish you health and happiness, and a successful new year.
      pt: Desejo a vocês saúde e felicidade, e um ano novo de sucesso.
  - speaker: protagonist
    text: И на Дарко — помалку состаноци!
    meaning:
      en: And to Darko — fewer meetings!
      pt: E ao Darko — menos reuniões!
  - speaker: nikolovski
    text: Браво! За нас — наздравје!
    meaning:
      en: Bravo! To us — cheers!
      pt: Bravo! A nós — saúde!
  - speaker: ana
    text: Среќна Нова година!
    meaning:
      en: Happy New Year!
      pt: Feliz Ano-Novo!
  - speaker: protagonist
    text: Среќна Нова година на сите!
    meaning:
      en: Happy New Year, everyone!
      pt: Feliz Ano-Novo a todos!
