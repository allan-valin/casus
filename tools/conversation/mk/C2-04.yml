steps:
- type: narrator
  text:
    en: Your annual review. You want a real raise, and you are ready to say so. Listen to the conversation; you don't need to understand it yet.
    pt: Sua avaliação anual. Você quer um aumento de verdade, e está pronto para dizer isso. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Господине Николовски, би можеле да размислите за покачување?
    meaning:
      en: Mr Nikolovski, could you consider a raise?
      pt: Senhor Nikolovski, o senhor poderia pensar num aumento?
  - speaker: nikolovski
    text: Колку?
    meaning:
      en: How much?
      pt: Quanto?
  - speaker: protagonist
    text: Петнаесет проценти. Тоа е мојата пазарна вредност.
    meaning:
      en: Fifteen per cent. That's my market value.
      pt: Quinze por cento. É o meu valor de mercado.
  - speaker: nikolovski
    text: Петнаесет е многу.
    meaning:
      en: Fifteen is a lot.
      pt: Quinze é muito.
  - speaker: protagonist
    text: Имам понуда од друго место. Не се заканувам — претпочитам да останам.
    meaning:
      en: I have an offer from elsewhere. I'm not threatening — I prefer to stay.
      pt: Tenho uma proposta de outro lugar. Não estou ameaçando — prefiro ficar.
  - speaker: nikolovski
    text: 'Компромисно: десет сега, пет од ноември, под услов проектот да заврши навреме.'
    meaning:
      en: 'As a compromise: ten now, five from November, on condition the project finishes on time.'
      pt: 'Meio-termo: dez agora, cinco a partir de novembro, com a condição de o projeto terminar no prazo.'
  - speaker: protagonist
    text: Тоа е фер. Се договоривме.
    meaning:
      en: That's fair. Deal.
      pt: É justo. Combinado.
  - speaker: nikolovski
    text: Добро преговаравте. Не очекував.
    meaning:
      en: You negotiated well. I didn't expect it.
      pt: O senhor negociou bem. Não esperava.
- type: narrator
  text:
    en: 'Polite requests choose the completed verb in the conditional: ''би можеле да размислите'' (could you think it over, once and decide). The ongoing form — ''да размислувате'' — would sound like ''keep
      thinking about it''.'
    pt: 'Pedidos educados escolhem o verbo completo no condicional: ''би можеле да размислите'' (poderia pensar e decidir). A forma em andamento — ''да размислувате'' — soaria como ''fique pensando nisso''.'
