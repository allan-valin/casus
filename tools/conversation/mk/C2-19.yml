steps:
- type: narrator
  text:
    en: Test results are back. Dr Petrovska explains a diagnosis in detail. Listen to the conversation; you don't need to understand it yet.
    pt: Os resultados dos exames chegaram. A doutora Petrovska explica um diagnóstico em detalhes. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: doktorka
    text: Резултатите покажуваат проблем со штитната жлезда.
    meaning:
      en: The results show a problem with the thyroid.
      pt: Os resultados mostram um problema na tireoide.
  - speaker: protagonist
    text: Ве молам, објаснете ми ја дијагнозата.
    meaning:
      en: Please explain the diagnosis to me.
      pt: Por favor, me explique o diagnóstico.
  - speaker: doktorka
    text: Хронично е, но се контролира со таблета секое утро.
    meaning:
      en: It's chronic, but it can be controlled with a tablet every morning.
      pt: É crônico, mas se controla com um comprimido toda manhã.
  - speaker: protagonist
    text: Доживотно?
    meaning:
      en: For life?
      pt: Pelo resto da vida?
  - speaker: doktorka
    text: Најверојатно. Третманот е едноставен.
    meaning:
      en: Most likely. The treatment is simple.
      pt: Provavelmente. O tratamento é simples.
  - speaker: protagonist
    text: Би сакала да побарам и второ мислење, ако не ве навредувам.
    meaning:
      en: I'd also like to ask for a second opinion, if that doesn't offend you.
      pt: Gostaria de pedir também uma segunda opinião, se não ofender a senhora.
  - speaker: doktorka
    text: Секако, имате право. Ќе ви дадам упат и копија од резултатите.
    meaning:
      en: Of course, you have the right. I'll give you a referral and a copy of the results.
      pt: Claro, a senhora tem direito. Vou dar um encaminhamento e uma cópia dos resultados.
  - speaker: protagonist
    text: Ви благодарам за трпението.
    meaning:
      en: Thank you for your patience.
      pt: Obrigada pela paciência.
