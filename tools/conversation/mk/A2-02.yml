steps:
- type: narrator
  text:
    en: At the Ministry of the Interior (МВР), for your residence permit. One paper is missing. Listen to the conversation; you don't need to understand it yet.
    pt: No Ministério do Interior (МВР), para a autorização de residência. Falta um papel. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Добар ден. Дојдов за дозвола за престој.
    meaning:
      en: Good morning. I've come for a residence permit.
      pt: Bom dia. Vim pela autorização de residência.
  - speaker: sluzbenicka
    text: Пасош, ве молам. Имате ли слика?
    meaning:
      en: Passport, please. Do you have a photo?
      pt: Passaporte, por favor. O senhor tem foto?
  - speaker: protagonist
    text: Да, еве ги.
    meaning:
      en: Yes, here they are.
      pt: Sim, aqui estão.
  - speaker: sluzbenicka
    text: Недостасува еден документ — договорот за работа.
    meaning:
      en: One document is missing — the work contract.
      pt: Falta um documento — o contrato de trabalho.
  - speaker: protagonist
    text: Договорот е дома. Утре ќе дојдам.
    meaning:
      en: The contract is at home. I'll come tomorrow.
      pt: O contrato está em casa. Venho amanhã.
  - speaker: sluzbenicka
    text: Утре не работиме. Во понеделник.
    meaning:
      en: We're closed tomorrow. On Monday.
      pt: Amanhã não abrimos. Na segunda.
  - speaker: protagonist
    text: Добро, ќе дојдам во понеделник. Во колку часот?
    meaning:
      en: All right, I'll come on Monday. At what time?
      pt: Está bem, venho na segunda. A que horas?
  - speaker: sluzbenicka
    text: Од осум. И донесете копија.
    meaning:
      en: From eight. And bring a copy.
      pt: A partir das oito. E traga uma cópia.
- type: narrator
  text:
    en: 'The future is easy: ''ќе'' before the present. дојдам → ќе дојдам (I''ll come), работам → ќе работам.'
    pt: 'O futuro é fácil: ''ќе'' antes do presente. дојдам → ќе дојдам (virei), работам → ќе работам (vou trabalhar).'
