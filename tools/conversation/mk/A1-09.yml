steps:
- type: narrator
  text:
    en: Winter is coming and you need a jacket. A shop in the centre. Listen to the conversation; you don't need to understand it yet.
    pt: O inverno está chegando e você precisa de um casaco. Uma loja no centro. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: seller
    text: Добар ден, повелете!
    meaning:
      en: Good afternoon, can I help?
      pt: Boa tarde, pois não?
  - speaker: protagonist
    text: Барам јакна за зима.
    meaning:
      en: I'm looking for a winter jacket.
      pt: Estou procurando um casaco de inverno.
  - speaker: seller
    text: Каква боја?
    meaning:
      en: What colour?
      pt: Que cor?
  - speaker: protagonist
    text: Црна или сина.
    meaning:
      en: Black or blue.
      pt: Preta ou azul.
  - speaker: seller
    text: Имаме сина. Црна немаме.
    meaning:
      en: We have blue. We don't have black.
      pt: Temos azul. Preta não temos.
  - speaker: protagonist
    text: Таа е многу светла. Имате ли темна?
    meaning:
      en: That one is very light. Do you have a dark one?
      pt: Essa é muito clara. Tem uma escura?
  - speaker: seller
    text: Оваа е темно сина. И црвена имаме.
    meaning:
      en: This one is dark blue. We also have red.
      pt: Esta é azul-escura. Também temos vermelha.
  - speaker: protagonist
    text: Темно сина, убава е! Колку чини?
    meaning:
      en: Dark blue, it's beautiful! How much is it?
      pt: Azul-escura, é bonita! Quanto custa?
  - speaker: seller
    text: Две илјади денари.
    meaning:
      en: Two thousand denars.
      pt: Dois mil dinares.
- type: narrator
  text:
    en: '''Барам'' is ''I''m looking for'' — and in a shop it also means ''I''d like''.'
    pt: '''Барам'' é ''estou procurando'' — e numa loja também quer dizer ''eu queria''.'
- type: prompt
