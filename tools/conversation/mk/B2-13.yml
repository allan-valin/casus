steps:
- type: narrator
  text:
    en: The release was due Friday. It is Monday. Listen to the conversation; you don't need to understand it yet.
    pt: A entrega era sexta. Hoje é segunda. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: nikolovski
    text: Рокот беше во петок. Сега е понеделник.
    meaning:
      en: The deadline was Friday. It's now Monday.
      pt: O prazo era sexta. Agora é segunda.
  - speaker: protagonist
    text: Знам, доцниме. Се случија полно работи.
    meaning:
      en: I know, we're late. Loads of things happened.
      pt: Eu sei, estamos atrasados. Aconteceu um monte de coisas.
  - speaker: nikolovski
    text: Клиентот чека. Кога ќе завршите?
    meaning:
      en: The client is waiting. When will you finish?
      pt: O cliente está esperando. Quando vocês terminam?
  - speaker: protagonist
    text: Завршуваме. Ќе завршиме најдоцна во среда.
    meaning:
      en: We're finishing. We'll be done by Wednesday at the latest.
      pt: Estamos terminando. Terminamos no máximo na quarta.
  - speaker: nikolovski
    text: Во среда. Ветувате?
    meaning:
      en: Wednesday. Do you promise?
      pt: Na quarta. Promete?
  - speaker: protagonist
    text: Ветувам.
    meaning:
      en: I promise.
      pt: Prometo.
  - speaker: darko
    text: Тој вели „среда“, ама мисли „вторник“.
    meaning:
      en: He says 'Wednesday', but he means 'Tuesday'.
      pt: Ele diz 'quarta', mas quer dizer 'terça'.
  - speaker: protagonist
    text: Тогаш завршуваме во вторник!
    meaning:
      en: Then we finish on Tuesday!
      pt: Então terminamos na terça!
