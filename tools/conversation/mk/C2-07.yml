- type: narrator
  text:
    en: 'Official letters follow a fixed order: address with the calling form (министре), who writes (во име на), the problem, the request (ве молиме да…), the closing (во очекување на ваш одговор). Signatures
      give weight.'
    pt: 'Cartas oficiais seguem ordem fixa: tratamento no vocativo (министре), quem escreve (во име на), o problema, o pedido (ве молиме да…), o fecho (во очекување на ваш одговор). Assinaturas dão peso.'
