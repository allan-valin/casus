steps:
- type: narrator
  text:
    en: The bus line to your neighbourhood was cut. You write to the minister on behalf of the residents. Listen to the conversation; you don't need to understand it yet.
    pt: A linha de ônibus do seu bairro foi cortada. Você escreve ao ministro em nome dos moradores. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: profesorka
    text: Како ќе почнете?
    meaning:
      en: How will you begin?
      pt: Como a senhora vai começar?
  - speaker: protagonist
    text: „Почитуван министре, во име на жителите на Карпош ви се обраќаме…“
    meaning:
      en: '''Dear Minister, on behalf of the residents of Karpoš we are writing to you…'''
      pt: '''Prezado Senhor Ministro, em nome dos moradores de Karpoš nos dirigimos ao senhor…'''
  - speaker: profesorka
    text: Одлично. Понатаму?
    meaning:
      en: Excellent. Next?
      pt: Excelente. E depois?
  - speaker: protagonist
    text: „…поради укинувањето на линијата 7. Последиците се сериозни за постарите жители.“
    meaning:
      en: '''…regarding the cutting of line 7. The consequences are serious for older residents.'''
      pt: '''…em razão da extinção da linha 7. As consequências são graves para os moradores idosos.'''
  - speaker: profesorka
    text: А барањето?
    meaning:
      en: And the request?
      pt: E o pedido?
  - speaker: protagonist
    text: „Ве молиме да преземете мерки линијата да се врати.“
    meaning:
      en: '''We ask you to take measures to restore the line.'''
      pt: '''Pedimos que tome providências para que a linha volte.'''
  - speaker: profesorka
    text: Завршеток?
    meaning:
      en: Closing?
      pt: Encerramento?
  - speaker: protagonist
    text: „Во очекување на ваш одговор, со почит.“ И сто потписи.
    meaning:
      en: '''Awaiting your reply, respectfully.'' And a hundred signatures.'
      pt: '''No aguardo de sua resposta, respeitosamente.'' E cem assinaturas.'
