steps:
  - type: narrator
    text:
      pt: "No dia seguinte, a senhora Stojanovska mostra o apartamento. Escute; ainda não precisa entender."
  - type: dialogue
    lines:
      - {speaker: vera, text: "Повелете, влезете. Ова е станот.", meaning: {pt: "Por favor, entre. Este é o apartamento."}}
      - {speaker: protagonist, text: "Убав е! Каде е кујната?", meaning: {pt: "É bonito! Onde fica a cozinha?"}}
      - {speaker: vera, text: "Кујната е тука.", meaning: {pt: "A cozinha é aqui."}}
      - {speaker: protagonist, text: "А бањата?", meaning: {pt: "E o banheiro?"}}
      - {speaker: vera, text: "Бањата е таму. Собата е многу голема.", meaning: {pt: "O banheiro é ali. O quarto é muito grande."}}
      - {speaker: protagonist, text: "Да, голема е. А прозорецот?", meaning: {pt: "Sim, é grande. E a janela?"}}
      - {speaker: vera, text: "Прозорецот е мал, но убав.", meaning: {pt: "A janela é pequena, mas bonita."}}
      - {speaker: vera, text: "Повелете, влечки.", meaning: {pt: "Aqui estão uns chinelos."}}
      - {speaker: protagonist, text: "Добро. Благодарам многу, госпоѓо Стојановска!", meaning: {pt: "Está bem. Muito obrigado, senhora Stojanovska!"}}
      - {speaker: vera, text: "Нема зошто. Јас сум долу.", meaning: {pt: "De nada. Eu fico lá embaixo."}}
  - type: narrator
    text:
      pt: "Na Macedônia, em casa, as pessoas tiram os sapatos na porta e usam chinelos. Ela vai oferecer um par."
  - {type: line, speaker: vera, item: vlezete}
  - type: prompt
    ask: {pt: "Ela diz 'entre'. Como ela disse?"}
    answer: {speaker: protagonist, text: "Влезете."}
    items: [vlezete]
  - type: prompt
    review: true
    ask: {pt: "Cumprimente-a primeiro, com educação."}
    answer: {speaker: protagonist, text: "Добар ден, госпоѓо Стојановска!"}
    items: [dobar-den, gospogjo]
  - type: prompt
    ask: {pt: "Ela mostra o apartamento. Diga: este é o apartamento."}
    answer: {speaker: protagonist, text: "Ова е станот."}
    items: [ova-e, stanot]
  - type: prompt
    ask: {pt: "Diga que é bonito."}
    answer: {speaker: protagonist, text: "Убав е!"}
    items: [ubav-e]
  - type: narrator
    text:
      pt: "Para perguntar onde fica algo: 'Каде е' e a coisa. 'Кујната' é 'a cozinha': o 'a' do português vem no fim, '-та'."
  - type: buildup
    item: kujnata
    parts: ["-та", "-јната", "кујната"]
  - type: prompt
    ask: {pt: "Pergunte onde fica a cozinha."}
    answer: {speaker: protagonist, text: "Каде е кујната?"}
    items: [kade-e, kujnata]
  - {type: line, speaker: vera, item: tuka}
  - type: prompt
    ask: {pt: "A cozinha é aqui. Diga isso."}
    answer: {speaker: protagonist, text: "Кујната е тука."}
    items: [kujnata, tuka]
  - type: narrator
    text:
      pt: "Para perguntar 'e o …?', basta 'А' e a coisa: 'А бањата?'"
  - type: prompt
    ask: {pt: "Pergunte: e o banheiro?"}
    answer: {speaker: protagonist, text: "А бањата?"}
    items: [a-sto, banjata]
  - {type: line, speaker: vera, item: tamu}
  - type: prompt
    ask: {pt: "O banheiro é ali. Diga isso."}
    answer: {speaker: protagonist, text: "Бањата е таму."}
    items: [banjata, tamu]
  - type: prompt
    ask: {pt: "Pergunte onde fica o banheiro."}
    answer: {speaker: protagonist, text: "Каде е бањата?"}
    items: [kade-e, banjata]
  - type: narrator
    text:
      pt: "'Собата' é 'o quarto'; a palavra é feminina, então 'grande' é 'голема'. 'Многу' é 'muito'."
  - type: prompt
    ask: {pt: "Diga: o quarto é grande."}
    answer: {speaker: protagonist, text: "Собата е голема."}
    items: [sobata, golema]
  - type: prompt
    ask: {pt: "Agora: o quarto é muito grande."}
    answer: {speaker: protagonist, text: "Собата е многу голема."}
    items: [sobata, mnogu, golema]
  - type: narrator
    text:
      pt: "'Прозорецот' é 'a janela'; em macedônio a palavra é masculina, e 'pequeno' é 'мал'."
  - type: buildup
    item: prozorecot
    parts: ["-цот", "-зорецот", "прозорецот"]
  - type: prompt
    ask: {pt: "Pergunte: e a janela?"}
    answer: {speaker: protagonist, text: "А прозорецот?"}
    items: [a-sto, prozorecot]
  - type: prompt
    ask: {pt: "Diga: a janela é pequena."}
    answer: {speaker: protagonist, text: "Прозорецот е мал."}
    items: [prozorecot, mal]
  - {type: line, speaker: vera, item: papuci}
  - type: prompt
    ask: {pt: "Ela oferece chinelos. Agradeça muito."}
    answer: {speaker: protagonist, text: "Благодарам многу!"}
    items: [blagodaram, mnogu]
  - type: prompt
    ask: {pt: "Ofereça os chinelos a um amigo que chega, com 'aqui está'."}
