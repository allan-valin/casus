  - type: prompt
    review: true
    ask: {pt: "Ele pergunta pela nova inquilina de cima, sua amiga. Diga: a nova inquilina é do Brasil."}
    answer: {speaker: protagonist, text: "Новата станарка е од Бразил."}
    items: [novata-stanarka, od-brazil]
  - type: prompt
    review: true
    ask: {pt: "Mostre onde está a chave: aqui está a chave."}
    answer: {speaker: protagonist, text: "Клучот е тука."}
    items: [klucot, tuka]
  - type: prompt
    review: true
    ask: {pt: "Ele agradece. Responda 'de nada'."}
