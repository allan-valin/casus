    items: [povelete, papuci]
  - type: prompt
    ask: {pt: "Ela pergunta se está tudo bem. Diga 'está bem'."}
    answer: {speaker: protagonist, text: "Добро."}
    items: [dobro]
  - {type: line, speaker: vera, item: dolu}
  - type: prompt
    ask: {pt: "Ela mora lá embaixo. Diga por ela: eu fico lá embaixo."}
    answer: {speaker: protagonist, text: "Јас сум долу."}
    items: [jas-sum, dolu]
  - type: narrator
    text:
      pt: "Agora, revisão em situação nova: um técnico da internet chega ao apartamento."
  - type: prompt
    review: true
    ask: {pt: "Ele fala depressa. Peça desculpas e diga que não entende."}
    answer: {speaker: protagonist, text: "Извинете, не разбирам."}
    items: [izvinete, ne-razbiram]
  - type: prompt
    review: true
    ask: {pt: "Pergunte se ele fala inglês."}
