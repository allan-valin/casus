    items: [nema-zosto]
  - type: prompt
    review: true
    ask: {pt: "Chega outro amigo brasileiro com a família. Dê as boas-vindas e convide a entrar."}
    answer: {speaker: protagonist, text: "Добредојдовте! Влезете."}
    items: [dobredojdovte, vlezete]
  - type: prompt
    review: true
    ask: {pt: "Mostre o apartamento a eles: este é o apartamento, a cozinha é aqui."}
    answer: {speaker: protagonist, text: "Ова е станот. Кујната е тука."}
    items: [ova-e, stanot, kujnata, tuka]
  - type: prompt
    ask: {pt: "Os amigos olham a janela. Diga: a janela é pequena, mas é bonita."}
    answer: {speaker: protagonist, text: "Прозорецот е мал, но убав е."}
    items: [prozorecot, mal, ubav-e]
  - type: prompt
    ask: {pt: "Eles perguntam pelo banheiro. Diga: o banheiro é ali."}
    answer: {speaker: protagonist, text: "Бањата е таму."}
    items: [banjata, tamu]
  - type: prompt
    ask: {pt: "Ofereça chinelos a eles."}
    answer: {speaker: protagonist, text: "Повелете, влечки."}
    items: [povelete, papuci]
  - type: prompt
    ask: {pt: "Eles perguntam onde mora a senhoria. Diga: lá embaixo."}
    answer: {speaker: protagonist, text: "Долу."}
    items: [dolu]
  - type: prompt
    ask: {pt: "Eles gostaram. Diga 'está bem, muito bem'."}
    answer: {speaker: protagonist, text: "Добро, многу добро."}
    items: [dobro, mnogu]
  - type: narrator
    text:
      pt: "Escute a conversa com a senhoria outra vez. Agora você entende."
  - {type: dialogue, again: true}
  - type: selfcheck
