steps:
- type: narrator
  text:
    en: Mrs Stojanovska invites you down for coffee. You are in a hurry. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Stojanovska convida você para um café. Você está com pressa. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Повелете, влезете. Седнете!
    meaning:
      en: Please, come in. Sit down!
      pt: Por favor, entre. Sente-se!
  - speaker: protagonist
    text: Благодарам многу, госпоѓо.
    meaning:
      en: Thank you very much.
      pt: Muito obrigada, senhora.
  - speaker: vera
    text: Сакате ли кафе или чај?
    meaning:
      en: Would you like coffee or tea?
      pt: A senhora quer café ou chá?
  - speaker: protagonist
    text: Извинете, брзам.
    meaning:
      en: Sorry, I'm in a hurry.
      pt: Desculpe, estou com pressa.
  - speaker: vera
    text: Само едно кафе! Турско кафе.
    meaning:
      en: Just one coffee! Turkish coffee.
      pt: Só um café! Café turco.
  - speaker: protagonist
    text: Добро, само едно. Без шеќер, ве молам.
    meaning:
      en: All right, just one. Without sugar, please.
      pt: Está bem, só um. Sem açúcar, por favor.
  - speaker: vera
    text: Без шеќер? Јас сакам со шеќер.
    meaning:
      en: Without sugar? I like it with sugar.
      pt: Sem açúcar? Eu gosto com açúcar.
  - speaker: protagonist
    text: Мммм, многу е вкусно!
    meaning:
      en: Mmm, it's very tasty!
      pt: Hum, está muito gostoso!
  - speaker: vera
    text: Седнете, имаме време.
    meaning:
      en: Sit down, we have time.
      pt: Sente-se, temos tempo.
- type: narrator
  text:
    en: A visit means coffee, and coffee means time. Saying no because you are in a hurry seems cold — accept one, even a small one.
    pt: Visita é café, e café é tempo. Recusar porque está com pressa parece frio — aceite um, nem que seja pequeno.
