steps:
- type: narrator
  text:
    en: On the stairs a young man with a big dog. It's Marko, your neighbour. Listen to the conversation; you don't need to understand it yet.
    pt: Na escada, um rapaz com um cachorro grande. É o Marko, seu vizinho. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Здраво! Ти си новиот сосед?
    meaning:
      en: Hi! Are you the new neighbour?
      pt: Oi! Você é o vizinho novo?
  - speaker: protagonist
    text: Здраво, да. Ох, куче!
    meaning:
      en: Hi, yes. Oh, a dog!
      pt: Oi, sou. Nossa, um cachorro!
  - speaker: marko
    text: Не се плаши, не каса.
    meaning:
      en: Don't be afraid, he doesn't bite.
      pt: Não tenha medo, ele não morde.
  - speaker: protagonist
    text: Како се вика?
    meaning:
      en: What's his name?
      pt: Como ele se chama?
  - speaker: marko
    text: Се вика Бруно. Имаш ли куче?
    meaning:
      en: He's called Bruno. Do you have a dog?
      pt: Se chama Bruno. Você tem cachorro?
  - speaker: protagonist
    text: Не, немам. Во Бразил имам мачка.
    meaning:
      en: No, I don't. In Brazil I have a cat.
      pt: Não, não tenho. No Brasil tenho um gato.
  - speaker: marko
    text: Мачка? Супер. Јас сум Марко.
    meaning:
      en: A cat? Great. I'm Marko.
      pt: Um gato? Legal. Eu sou o Marko.
  - speaker: protagonist
    text: Мило ми е, Марко!
    meaning:
      en: Nice to meet you, Marko!
      pt: Prazer, Marko!
- type: narrator
  text:
    en: Marko is young, so he uses 'ти' at once and says 'Здраво', not 'Добар ден'. With him you do the same.
    pt: O Marko é jovem, então usa 'ти' na hora e diz 'Здраво', não 'Добар ден'. Com ele você faz o mesmo.
