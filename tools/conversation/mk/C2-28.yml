steps:
- type: narrator
  text:
    en: A job offer in São Paulo, near your parents. Sara and you weigh it at the kitchen table. Listen to the conversation; you don't need to understand it yet.
    pt: Uma proposta de emprego em São Paulo, perto dos seus pais. Você e a Sara pesam tudo na mesa da cozinha. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sara
    text: 'Ајде: предности и недостатоци.'
    meaning:
      en: 'Come on: advantages and disadvantages.'
      pt: 'Vamos lá: vantagens e desvantagens.'
  - speaker: protagonist
    text: 'Предност: поблиску до моите. Мајка ми старее.'
    meaning:
      en: 'Advantage: closer to my family. My mother is getting older.'
      pt: 'Vantagem: mais perto dos meus. Minha mãe está envelhecendo.'
  - speaker: sara
    text: 'Недостаток: тука ни е животот. Децата ќе ги изгубат баба и дедо.'
    meaning:
      en: 'Disadvantage: our life is here. The children would lose grandma and grandpa.'
      pt: 'Desvantagem: nossa vida é aqui. As crianças perderiam o vô e a vó.'
  - speaker: protagonist
    text: И кошарката, и кафаната, и Вера...
    meaning:
      en: And basketball, and the кафана, and Vera...
      pt: E o basquete, e a кафана, e a Vera...
  - speaker: sara
    text: Ние сме се вкорениле тука!
    meaning:
      en: We've put down roots here, it turns out!
      pt: A gente criou raízes aqui, pelo jeito!
  - speaker: protagonist
    text: Изгледа дека одлуката е веќе донесена.
    meaning:
      en: It looks like the decision is already made.
      pt: Parece que a decisão já está tomada.
  - speaker: sara
    text: Бразил не мора сега. Можеби подоцна, за подолго лето.
    meaning:
      en: Brazil doesn't have to be now. Maybe later, for a longer summer.
      pt: O Brasil não precisa ser agora. Talvez mais tarde, para um verão mais longo.
  - speaker: protagonist
    text: Остануваме. Секое лето — Бразил.
    meaning:
      en: We're staying. Every summer — Brazil.
      pt: A gente fica. Todo verão — Brasil.
