steps:
- type: narrator
  text:
    en: A year with Bojan. He asks the big question — and mentions his parents. Listen to the conversation; you don't need to understand it yet.
    pt: Um ano com o Bojan. Ele faz a grande pergunta — e fala dos pais. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: bojan
    text: Би сакала ли да живееме заедно?
    meaning:
      en: Would you like us to live together?
      pt: Você gostaria de morar junto?
  - speaker: protagonist
    text: Би сакала! Но што би рекле твоите?
    meaning:
      en: I'd love to! But what would your parents say?
      pt: Gostaria! Mas o que os seus pais diriam?
  - speaker: bojan
    text: 'Мајка ми ќе каже: „Пред свадба?!“'
    meaning:
      en: 'My mother will say: ''Before the wedding?!'''
      pt: 'Minha mãe vai dizer: ''Antes do casamento?!'''
  - speaker: protagonist
    text: Старомодни се?
    meaning:
      en: Are they old-fashioned?
      pt: Eles são antiquados?
  - speaker: bojan
    text: Малку. Но ќе се навикнат.
    meaning:
      en: A bit. But they'll get used to it.
      pt: Um pouco. Mas vão se acostumar.
  - speaker: protagonist
    text: И би било поевтино — една кирија наместо две.
    meaning:
      en: And it would be cheaper — one rent instead of two.
      pt: E seria mais barato — um aluguel em vez de dois.
  - speaker: bojan
    text: Тоа ќе им го кажам прво!
    meaning:
      en: That's what I'll tell them first!
      pt: Isso eu vou falar primeiro!
  - speaker: protagonist
    text: Можеби треба прво да ги прашаме на ручек.
    meaning:
      en: Maybe we should ask them first, at lunch.
      pt: Talvez a gente deva perguntar primeiro, no almoço.
