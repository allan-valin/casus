steps:
- type: narrator
  text:
    en: First day at the software company. Ana, the project manager, welcomes you. Listen to the conversation; you don't need to understand it yet.
    pt: Primeiro dia na empresa de software. Ana, a gerente de projeto, recebe você. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Добро утро! Вие сте новата колешка?
    meaning:
      en: Good morning! Are you the new colleague?
      pt: Bom dia! Você é a nova colega?
  - speaker: protagonist
    text: Да, добро утро. Јас сум програмерка.
    meaning:
      en: Yes, good morning. I'm a programmer.
      pt: Sim, bom dia. Sou programadora.
  - speaker: ana
    text: Мило ми е. Јас сум Ана.
    meaning:
      en: Nice to meet you. I'm Ana.
      pt: Muito prazer. Eu sou a Ana.
  - speaker: protagonist
    text: Мило ми е, Ана.
    meaning:
      en: Nice to meet you, Ana.
      pt: Muito prazer, Ana.
  - speaker: ana
    text: Од каде сте?
    meaning:
      en: Where are you from?
      pt: De onde você é?
  - speaker: protagonist
    text: Од Бразил, од Сао Паоло.
    meaning:
      en: From Brazil, from São Paulo.
      pt: Do Brasil, de São Paulo.
  - speaker: ana
    text: Сао Паоло е многу голем град!
    meaning:
      en: São Paulo is a very big city!
      pt: São Paulo é uma cidade muito grande!
  - speaker: protagonist
    text: Да. Ова е мојата маса?
    meaning:
      en: Yes. Is this my desk?
      pt: Sim. Esta é a minha mesa?
  - speaker: ana
    text: Да, тука работите. Ова е вашиот компјутер.
    meaning:
      en: Yes, you work here. This is your computer.
      pt: Sim, você trabalha aqui. Este é o seu computador.
- type: narrator
  text:
