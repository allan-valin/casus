steps:
- type: narrator
  text:
    en: A client calls the office. You pick up. Listen to the conversation; you don't need to understand it yet.
    pt: Um cliente liga para o escritório. Você atende. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: „Вардар Софт“, ве слушам.
    meaning:
      en: Vardar Soft, how can I help?
      pt: Vardar Soft, pois não.
  - speaker: klient
    text: Добар ден, го барам г. Николовски.
    meaning:
      en: Good morning, I'm looking for Mr Nikolovski.
      pt: Bom dia, procuro o senhor Nikolovski.
  - speaker: protagonist
    text: Со кого зборувам?
    meaning:
      en: Who am I speaking to?
      pt: Com quem eu falo?
  - speaker: klient
    text: Трајковски, од банката.
    meaning:
      en: Trajkovski, from the bank.
      pt: Trajkovski, do banco.
  - speaker: protagonist
    text: Момент, ќе ве поврзам... Жал ми е, зафатен е.
    meaning:
      en: One moment, I'll put you through... I'm sorry, he's busy.
      pt: Um momento, vou transferir... Sinto muito, ele está ocupado.
  - speaker: protagonist
    text: Да му пренесам порака?
    meaning:
      en: Shall I give him a message?
      pt: Quer deixar recado?
  - speaker: klient
    text: Да ме повика денеска. Бројот го има.
    meaning:
      en: For him to call me back today. He has the number.
      pt: Que ele me retorne hoje. Ele tem o número.
  - speaker: protagonist
    text: Ќе му кажам. Пријатен ден!
    meaning:
      en: I'll tell him. Have a nice day!
      pt: Vou avisar. Tenha um bom dia!
  - speaker: klient
    text: Да сте живи и здрави!
    meaning:
      en: Be well!
      pt: Tudo de bom!
