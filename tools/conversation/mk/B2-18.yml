steps:
- type: narrator
  text:
    en: Dinner at Sara's parents, the week before elections. Her father and uncle disagree. Listen to the conversation; you don't need to understand it yet.
    pt: Jantar na casa dos pais da Sara, na semana antes da eleição. O pai e o tio dela discordam. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: tatko
    text: Во недела е гласањето. Сите знаеме за кого.
    meaning:
      en: Voting's on Sunday. We all know who for.
      pt: Domingo é a votação. Todo mundo sabe em quem.
  - speaker: cicko
    text: Ти знаеш. Јас имам друго мислење.
    meaning:
      en: You know. I have a different opinion.
      pt: Você sabe. Eu tenho outra opinião.
  - speaker: sara
    text: Тато, чичко — не се карајте!
    meaning:
      en: Dad, uncle — don't argue!
      pt: Pai, tio — não briguem!
  - speaker: protagonist
    text: Кај нас во Бразил — иста работа. Секоја недела ручек со дебата.
    meaning:
      en: Back home in Brazil — same thing. Every Sunday lunch with a debate.
      pt: Lá no Brasil — a mesma coisa. Todo almoço de domingo com debate.
  - speaker: tatko
    text: И како завршува?
    meaning:
      en: And how does it end?
      pt: E como termina?
  - speaker: protagonist
    text: Со десерт. Секој има свое мислење, но торта има за сите.
    meaning:
      en: With dessert. Everyone has their own opinion, but there's cake for all.
      pt: Com a sobremesa. Cada um tem a sua opinião, mas bolo tem para todos.
  - speaker: cicko
    text: Мудар зет! Ајде да наздравиме — за мир во куќата.
    meaning:
      en: A wise son-in-law! Let's drink a toast — to peace in the house.
      pt: Genro sábio! Vamos brindar — à paz na casa.
  - speaker: sara
    text: Да не се караме барем до изборите.
    meaning:
      en: Let's not argue at least until the elections.
      pt: Vamos não brigar pelo menos até a eleição.
