steps:
- type: narrator
  text:
    en: A candidate for the municipal council rings your doorbell. Listen to the conversation; you don't need to understand it yet.
    pt: Um candidato à câmara municipal toca a sua campainha. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sosed2
    text: Добар ден! Јас сум кандидат за советник во општината.
    meaning:
      en: Good afternoon! I'm a candidate for the municipal council.
      pt: Boa tarde! Sou candidato a vereador no município.
  - speaker: protagonist
    text: Добар ден. Што ветувате?
    meaning:
      en: Good afternoon. What do you promise?
      pt: Boa tarde. O que o senhor promete?
  - speaker: sosed2
    text: Ќе изградиме нов парк и нова градинка.
    meaning:
      en: We'll build a new park and a new kindergarten.
      pt: Vamos construir um parque novo e uma creche nova.
  - speaker: protagonist
    text: Претходниот кандидат ветил сто паркови.
    meaning:
      en: The previous candidate promised a hundred parks, I hear.
      pt: O candidato anterior teria prometido cem parques.
  - speaker: sosed2
    text: Тој не е од нашата партија!
    meaning:
      en: He's not from our party!
      pt: Ele não é do nosso partido!
  - speaker: protagonist
    text: Впрочем, јас сум странски државјанин. Не можам да гласам.
    meaning:
      en: Besides, I'm a foreign national. I can't vote.
      pt: Aliás, sou estrangeira. Não posso votar.
  - speaker: sosed2
    text: Тогаш кажете им на соседите!
    meaning:
      en: Then tell the neighbours!
      pt: Então fale para os vizinhos!
  - speaker: protagonist
    text: Ќе видиме што ќе изградите.
    meaning:
      en: We'll see what you build.
      pt: Veremos o que vocês vão construir.
