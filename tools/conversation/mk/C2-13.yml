steps:
- type: narrator
  text:
    en: Your first talk at Skopje's IT meetup — in Macedonian. Questions from the floor. Listen to the conversation; you don't need to understand it yet.
    pt: Sua primeira palestra no meetup de TI de Skopje — em macedônio. Perguntas da plateia. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: 'Добровечер. Накратко: ќе зборувам за брзи апликации во пракса.'
    meaning:
      en: 'Good evening. Briefly: I''ll talk about fast apps in practice.'
      pt: 'Boa noite. Resumindo: vou falar de aplicativos rápidos na prática.'
  - speaker: protagonist
    text: 'На слајдовите: три грешки што ги направивме.'
    meaning:
      en: 'On the slides: three mistakes we made.'
      pt: 'Nos slides: três erros que a gente cometeu.'
  - speaker: protagonist
    text: Прашања од публиката?
    meaning:
      en: Questions from the audience?
      pt: Perguntas da plateia?
  - speaker: darko
    text: Зошто не користевте кеш?
    meaning:
      en: Why didn't you use a cache?
      pt: Por que vocês não usaram cache?
  - speaker: protagonist
    text: Добро прашање — ќе се вратам на тоа на крајот.
    meaning:
      en: Good question — I'll come back to that at the end.
      pt: Boa pergunta — volto nisso no final.
  - speaker: klient
    text: Колку чини серверот месечно?
    meaning:
      en: How much does the server cost a month?
      pt: Quanto custa o servidor por mês?
  - speaker: protagonist
    text: Искрено, не знам точно. Ќе проверам и ќе ви пишам.
    meaning:
      en: Honestly, I don't know exactly. I'll check and write to you.
      pt: Sinceramente, não sei exatamente. Vou verificar e te escrevo.
  - speaker: protagonist
    text: Ви благодарам на вниманието.
    meaning:
      en: Thank you for your attention.
      pt: Obrigada pela atenção.
