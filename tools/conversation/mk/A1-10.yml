- type: narrator
  text:
    en: At the stop. Which bus goes to the centre? Listen to the conversation; you don't need to understand it yet.
    pt: No ponto. Qual ônibus vai para o centro? Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Добар ден. Оди ли до центар?
    meaning:
      en: Hello. Does it go to the centre?
      pt: Bom dia. Vai até o centro?
  - speaker: driver
    text: Не, ова е бројот пет. Ви треба седум.
    meaning:
      en: No, this is number five. You need seven.
      pt: Não, este é o cinco. O senhor precisa do sete.
  - speaker: protagonist
    text: Седум? Каде е седум?
    meaning:
      en: Seven? Where is seven?
      pt: Sete? Onde está o sete?
  - speaker: driver
    text: Чекајте тука. Доаѓа после пет минути.
    meaning:
      en: Wait here. It comes in five minutes.
      pt: Espere aqui. Chega daqui a cinco minutos.
  - speaker: protagonist
    text: Една карта до центар, ве молам.
    meaning:
      en: One ticket to the centre, please.
      pt: Uma passagem até o centro, por favor.
  - speaker: driver
    text: Четириесет денари.
    meaning:
      en: Forty denars.
      pt: Quarenta dinares.
  - speaker: protagonist
    text: Каде да слезам?
    meaning:
      en: Where should I get off?
      pt: Onde devo descer?
  - speaker: driver
    text: Следната станица. Центар.
    meaning:
      en: The next stop. The centre.
      pt: Na próxima parada. Centro.
