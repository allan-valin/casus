steps:
- type: narrator
  text:
    en: Your daughter is four. Grandma gives her sweets before dinner — again. Listen to the conversation; you don't need to understand it yet.
    pt: Sua filha tem quatro anos. A avó dá doce antes do jantar — de novo. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Мамо, пак ѝ даде чоколадо пред вечера?
    meaning:
      en: Mum, you gave her chocolate before dinner again?
      pt: Mãe, de novo você deu chocolate para ela antes do jantar?
  - speaker: svekrva-s
    text: Само едно! Кај баба има други правила.
    meaning:
      en: Just one! At grandma's there are different rules.
      pt: Só um! Na casa da avó as regras são outras.
  - speaker: sara
    text: Детето ќе стане разгалено.
    meaning:
      en: The child will get spoiled.
      pt: A criança vai ficar mimada.
  - speaker: svekrva-s
    text: Јас вас ве воспитав, и добро испадна!
    meaning:
      en: I raised you, and it turned out fine!
      pt: Eu criei vocês, e deu certo!
  - speaker: protagonist
    text: А екранот? Три часа цртани.
    meaning:
      en: And the screen? Three hours of cartoons.
      pt: E a tela? Três horas de desenho.
  - speaker: svekrva-s
    text: Таа си била многу послушна кога гледа цртани!
    meaning:
      en: She's so obedient when she watches cartoons, you'd be surprised!
      pt: Ela fica tão obediente quando vê desenho, você nem imagina!
  - speaker: protagonist
    text: 'Ајде заедно да се договориме: половина час екран и чоколадо по вечера.'
    meaning:
      en: 'Let''s agree together: half an hour of screen and chocolate after dinner.'
      pt: 'Vamos combinar juntos: meia hora de tela e chocolate depois do jantar.'
  - speaker: svekrva-s
    text: Добро... ама кај баба — еден час.
    meaning:
      en: All right... but at grandma's — an hour.
      pt: Tá bom... mas na casa da avó — uma hora.
