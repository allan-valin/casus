steps:
- type: narrator
  text:
    en: The next morning Ana offers to say ти. Listen to the conversation; you don't need to understand it yet.
    pt: Na manhã seguinte a Ana propõe usar ти. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Добро утро! Како сте?
    meaning:
      en: Good morning! How are you?
      pt: Bom dia! Como vai?
  - speaker: protagonist
    text: Добро, благодарам. А вие?
    meaning:
      en: Fine, thanks. And you?
      pt: Bem, obrigada. E você?
  - speaker: ana
    text: Добро. Слушајте, ајде на ти!
    meaning:
      en: Fine. Listen, let's say ти!
      pt: Bem. Escuta, vamos nos tratar por ти!
  - speaker: protagonist
    text: На ти? Може, секако!
    meaning:
      en: Ти? Sure, of course!
      pt: Por ти? Pode ser, claro!
  - speaker: ana
    text: 'Значи: како си?'
    meaning:
      en: 'So: how are you?'
      pt: 'Então: como você está?'
  - speaker: protagonist
    text: Добро сум. А ти?
    meaning:
      en: I'm fine. And you?
      pt: Estou bem. E você?
  - speaker: ana
    text: Одлично! Се гледаме на ручек?
    meaning:
      en: Excellent! See you at lunch?
      pt: Ótimo! A gente se vê no almoço?
  - speaker: protagonist
    text: Да, се гледаме. Чао!
    meaning:
      en: Yes, see you. Bye!
      pt: Sim, até lá. Tchau!
- type: narrator
  text:
    en: 'Macedonian has two ''you'': ''Вие'' (polite) and ''ти'' (familiar). Switching to ''ти'' is offered — usually by the older or more senior person. ''Ајде на ти'' is that offer.'
    pt: 'O macedônio tem dois ''você'': ''Вие'' (educado) e ''ти'' (íntimo). A troca para ''ти'' é oferecida — normalmente pela pessoa mais velha ou de cargo mais alto. ''Ајде на ти'' é essa oferta.'
- type: narrator
  for:
  - pt
  text:
    pt: Em português o 'você' serve para quase todos. Aqui, passar para 'ти' sem convite soa rude — espere a oferta.
