steps:
- type: narrator
  text:
    en: You missed the bus to Sara's parents. You tell her what happened, in order. Listen to the conversation; you don't need to understand it yet.
    pt: Você perdeu o ônibus para a casa dos pais da Sara. Conta para ela o que aconteceu, na ordem. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sara
    text: Што се случи? Те чекавме цел час!
    meaning:
      en: What happened? We waited for you a whole hour!
      pt: O que aconteceu? A gente te esperou uma hora inteira!
  - speaker: protagonist
    text: Прво, работата. Ана ме задржа.
    meaning:
      en: First, work. Ana kept me.
      pt: Primeiro, o trabalho. A Ana me segurou.
  - speaker: protagonist
    text: Кога бев завршил, веќе беше шест.
    meaning:
      en: By the time I'd finished, it was already six.
      pt: Quando terminei, já eram seis.
  - speaker: protagonist
    text: Кога стигнав на станицата, автобусот веќе беше заминал.
    meaning:
      en: When I got to the stop, the bus had already left.
      pt: Quando cheguei no ponto, o ônibus já tinha saído.
  - speaker: sara
    text: И што направи?
    meaning:
      en: And what did you do?
      pt: E o que você fez?
  - speaker: protagonist
    text: Потоа зедов такси, но имаше гужва.
    meaning:
      en: Then I took a taxi, but there was traffic.
      pt: Depois peguei um táxi, mas tinha trânsito.
  - speaker: sara
    text: А на крајот?
    meaning:
      en: And in the end?
      pt: E no fim?
  - speaker: protagonist
    text: На крајот сепак стигнав — за десерт!
    meaning:
      en: In the end I still made it — for dessert!
      pt: No fim cheguei mesmo assim — para a sobremesa!
  - speaker: sara
    text: Следниот пат, тргни на време.
    meaning:
      en: Next time, leave on time.
      pt: Da próxima vez, sai na hora.
