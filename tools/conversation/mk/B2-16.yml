steps:
- type: narrator
  text:
    en: You want to work from home on Fridays. Mr Nikolovski's door is half open. Listen to the conversation; you don't need to understand it yet.
    pt: Você quer trabalhar de casa às sextas. A porta do senhor Nikolovski está entreaberta. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Господине Николовски, имате ли една минута?
    meaning:
      en: Mr Nikolovski, do you have a minute?
      pt: Senhor Nikolovski, o senhor tem um minuto?
  - speaker: nikolovski
    text: Повелете, седнете.
    meaning:
      en: Please, sit down.
      pt: Pois não, sente-se.
  - speaker: protagonist
    text: Би сакал да разговараме за петоците. Дали може да работам од дома?
    meaning:
      en: I'd like to talk about Fridays. Could I work from home?
      pt: Gostaria de conversar sobre as sextas. Posso trabalhar de casa?
  - speaker: nikolovski
    text: Зошто?
    meaning:
      en: Why?
      pt: Por quê?
  - speaker: protagonist
    text: Дома сум попродуктивен — нема прекини.
    meaning:
      en: At home I'm more productive — no interruptions.
      pt: Em casa sou mais produtivo — sem interrupções.
  - speaker: nikolovski
    text: Ве разбирам. Нека пробаме еден месец, па ќе видиме.
    meaning:
      en: I understand. Let's try it for a month, and then we'll see.
      pt: Entendo. Vamos experimentar um mês, e depois a gente vê.
  - speaker: protagonist
    text: Ви благодарам многу.
    meaning:
      en: Thank you very much.
      pt: Agradeço muito.
  - speaker: nikolovski
    text: Но во понеделник — сите во канцеларија.
    meaning:
      en: But on Monday — everyone in the office.
      pt: Mas na segunda — todo mundo no escritório.
