steps:
- type: narrator
  text:
    en: At Marko's, his friend Goran has a guitar. Listen to the conversation; you don't need to understand it yet.
    pt: Na casa do Marko, o amigo dele, Goran, está com o violão. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: goran
    text: Ти се допаѓа македонска музика?
    meaning:
      en: Do you like Macedonian music?
      pt: Você gosta de música macedônia?
  - speaker: protagonist
    text: Да, ми се допаѓа. Но повеќе сакам бразилска.
    meaning:
      en: Yes, I like it. But I prefer Brazilian.
      pt: Gosto. Mas prefiro a brasileira.
  - speaker: goran
    text: Боса нова! Свирам една песна на гитара.
    meaning:
      en: Bossa nova! I play one song on the guitar.
      pt: Bossa nova! Eu toco uma música no violão.
  - speaker: protagonist
    text: Навистина? Ајде, свири!
    meaning:
      en: Really? Go on, play!
      pt: Sério? Vai, toca!
  - speaker: goran
    text: Ти се допадна?
    meaning:
      en: Did you like it?
      pt: Gostou?
  - speaker: protagonist
    text: Многу! А која македонска песна да слушам?
    meaning:
      en: A lot! And which Macedonian song should I listen to?
      pt: Muito! E que música macedônia eu devo ouvir?
  - speaker: goran
    text: Тоше Проески. Сите го сакаат.
    meaning:
      en: Toše Proeski. Everyone loves him.
      pt: Toše Proeski. Todo mundo gosta dele.
  - speaker: protagonist
    text: Кој е тој?
    meaning:
      en: Who is he?
      pt: Quem é ele?
  - speaker: goran
    text: Најпознатиот пејач. Почина млад.
    meaning:
      en: The most famous singer. He died young.
      pt: O cantor mais famoso. Morreu jovem.
