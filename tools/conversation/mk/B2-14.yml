steps:
- type: narrator
  text:
    en: At the meeting, Darko presents your idea as his. Listen to the conversation; you don't need to understand it yet.
    pt: Na reunião, o Darko apresenta a sua ideia como dele. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Дарко, имаш ли минута? Идејата за менито — тоа беше моја идеја.
    meaning:
      en: Darko, have you got a minute? The menu idea — that was my idea.
      pt: Darko, tem um minuto? A ideia do menu — aquilo foi minha ideia.
  - speaker: darko
    text: Па, заедно ја развивме.
    meaning:
      en: Well, we developed it together.
      pt: Bom, a gente desenvolveu junto.
  - speaker: protagonist
    text: Заедно, да. Но јас прв ја предложив, а ти ја претстави како твоја.
    meaning:
      en: Together, yes. But I proposed it first, and you presented it as yours.
      pt: Juntos, sim. Mas eu propus primeiro, e você apresentou como sua.
  - speaker: darko
    text: Не сум мислел така. Извини.
    meaning:
      en: I didn't mean it like that. Sorry.
      pt: Não foi minha intenção. Desculpa.
  - speaker: protagonist
    text: Не е фер пред шефот.
    meaning:
      en: It's not fair in front of the boss.
      pt: Não é justo na frente do chefe.
  - speaker: darko
    text: Во право си. Ќе му кажам на Николовски.
    meaning:
      en: You're right. I'll tell Nikolovski.
      pt: Você tem razão. Vou falar com o Nikolovski.
  - speaker: protagonist
    text: Тоа е коректно. Следниот пат кажи „нашата идеја“.
    meaning:
      en: That's fair. Next time say 'our idea'.
      pt: Isso é justo. Da próxima vez diga 'nossa ideia'.
  - speaker: darko
    text: Важи.
    meaning:
      en: Deal.
      pt: Combinado.
