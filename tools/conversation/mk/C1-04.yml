steps:
- type: narrator
  text:
    en: Midnight. Music from upstairs, again. You go up. Listen to the conversation; you don't need to understand it yet.
    pt: Meia-noite. Música no andar de cima, de novo. Você sobe. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Добровечер. Извинете што ве вознемирувам.
    meaning:
      en: Good evening. Sorry to disturb you.
      pt: Boa noite. Desculpe incomodar.
  - speaker: sosed2
    text: Повелете?
    meaning:
      en: Yes?
      pt: Pois não?
  - speaker: protagonist
    text: Музиката многу се слуша долу. Утре рано работам.
    meaning:
      en: The music can really be heard downstairs. I work early tomorrow.
      pt: A música dá para ouvir muito lá embaixo. Amanhã trabalho cedo.
  - speaker: sosed2
    text: Се слуша? Не знаев.
    meaning:
      en: It can be heard? I didn't know.
      pt: Dá para ouvir? Eu não sabia.
  - speaker: protagonist
    text: Имајте разбирање — само малку потивко, ве молам.
    meaning:
      en: Please be understanding — just a bit quieter, please.
      pt: Tenha compreensão — só um pouco mais baixo, por favor.
  - speaker: sosed2
    text: Ама сега имам гости, роденден е...
    meaning:
      en: But right now I have guests, it's a birthday...
      pt: Mas agora tenho visita, é aniversário...
  - speaker: protagonist
    text: Честит роденден! Според куќниот ред, тишина е по десет.
    meaning:
      en: Happy birthday! By the house rules, it's quiet after ten.
      pt: Feliz aniversário! Pelas regras do prédio, silêncio depois das dez.
  - speaker: sosed2
    text: Важи тогаш. Ќе го намалам.
    meaning:
      en: OK then. I'll turn it down.
      pt: Tá certo então. Vou abaixar.
