steps:
- type: narrator
  text:
    en: Professor Ilievska gives the class a news story to retell — without having seen it. Listen to the conversation; you don't need to understand it yet.
    pt: A professora Ilievska dá à turma uma notícia para recontar — sem ter visto. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: profesorka
    text: Прераскажете ја веста за новиот мост.
    meaning:
      en: Retell the news about the new bridge.
      pt: Recontem a notícia sobre a ponte nova.
  - speaker: protagonist
    text: Мостот бил отворен во сабота.
    meaning:
      en: The bridge was opened on Saturday, reportedly.
      pt: A ponte teria sido inaugurada no sábado.
  - speaker: protagonist
    text: Градоначалникот изјавил дека е најубавиот во Скопје.
    meaning:
      en: The mayor stated it is the most beautiful in Skopje.
      pt: O prefeito teria declarado que é a mais bonita de Skopje.
  - speaker: profesorka
    text: А колку чинел?
    meaning:
      en: And how much did it cost?
      pt: E quanto teria custado?
  - speaker: protagonist
    text: Чинел пет милиони евра, според весникот.
    meaning:
      en: It cost five million euros, according to the paper.
      pt: Teria custado cinco milhões de euros, segundo o jornal.
  - speaker: profesorka
    text: Зошто зборувате така, а не „мостот беше отворен“?
    meaning:
      en: Why do you speak like that, and not 'the bridge was opened'?
      pt: Por que fala assim, e não 'a ponte foi inaugurada'?
  - speaker: protagonist
    text: Затоа што не сме биле таму. Затоа л-формата.
    meaning:
      en: Because we weren't there. That's why the л-form.
      pt: Porque não estivemos lá. Por isso a forma em -л.
  - speaker: profesorka
    text: Точно така. Тоа е добар аргумент за дискусија.
    meaning:
      en: Exactly. That's a good argument for discussion.
      pt: Exatamente. É um bom argumento para a discussão.
