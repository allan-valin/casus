- type: narrator
  text:
    en: 'For weather you say ''е'' and a word in -о: ''ладно е'' (it''s cold), ''топло е'' (it''s warm).'
    pt: 'Para o tempo diz-se ''е'' e uma palavra em -о: ''ладно е'' (está frio), ''топло е'' (está quente).'
- type: prompt
  ask:
    en: 'Say: it''s very cold today.'
    pt: 'Diga: está muito frio hoje.'
  answer:
