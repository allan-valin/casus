steps:
- type: narrator
  text:
    en: It is raining at the bus stop. Dragan is waiting too. Listen to the conversation; you don't need to understand it yet.
    pt: Está chovendo no ponto de ônibus. O Dragan também está esperando. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: dragan
    text: Добар ден! Врне, а?
    meaning:
      en: Hello! It's raining, eh?
      pt: Bom dia! Está chovendo, hein?
  - speaker: protagonist
    text: Да, врне. Многу е ладно денеска.
    meaning:
      en: Yes, it's raining. It's very cold today.
      pt: Sim, está chovendo. Está muito frio hoje.
  - speaker: dragan
    text: Во Бразил е топло, нели?
    meaning:
      en: In Brazil it's warm, isn't it?
      pt: No Brasil é quente, né?
  - speaker: protagonist
    text: Да, таму е лето сега. Тука е зима.
    meaning:
      en: Yes, it's summer there now. Here it's winter.
      pt: Sim, lá é verão agora. Aqui é inverno.
  - speaker: dragan
    text: Лето во декември? Убаво!
    meaning:
      en: Summer in December? Lovely!
      pt: Verão em dezembro? Que bom!
  - speaker: protagonist
    text: Немам чадор.
    meaning:
      en: I don't have an umbrella.
      pt: Não tenho guarda-chuva.
  - speaker: dragan
    text: Повелете, имам два.
    meaning:
      en: Here you are, I have two.
      pt: Tome, eu tenho dois.
  - speaker: protagonist
    text: Благодарам многу! Утре е убаво време?
    meaning:
      en: Thank you very much! Is tomorrow nice weather?
      pt: Muito obrigado! Amanhã faz tempo bom?
  - speaker: dragan
    text: Не знам. Можеби.
    meaning:
      en: I don't know. Maybe.
      pt: Não sei. Talvez.
- type: narrator
  text:
    en: '''Врне'' is ''it''s raining'' — one word, no ''it''.'
    pt: '''Врне'' é ''está chovendo'' — uma palavra só.'
- type: prompt
  ask:
    en: Say that it's raining.
    pt: Diga que está chovendo.
  answer:
    speaker: protagonist
    text: Врне.
  items:
