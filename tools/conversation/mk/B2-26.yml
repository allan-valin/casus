steps:
- type: narrator
  text:
    en: Marko takes you to his amateur club. Coach Zoran looks you over. Listen to the conversation; you don't need to understand it yet.
    pt: O Marko leva você ao clube amador dele. O técnico Zoran te avalia. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Зоране, ова е мојот сосед. Сака да игра.
    meaning:
      en: Zoran, this is my neighbour. He wants to play.
      pt: Zoran, esse é o meu vizinho. Ele quer jogar.
  - speaker: zoran
    text: Добредојде. Тренинзи имаме двапати неделно, вторник и четврток.
    meaning:
      en: Welcome. We train twice a week, Tuesday and Thursday.
      pt: Bem-vindo. Treino duas vezes por semana, terça e quinta.
  - speaker: protagonist
    text: Колку е членарината?
    meaning:
      en: How much is the membership fee?
      pt: Quanto é a mensalidade?
  - speaker: zoran
    text: Илјада денари месечно. Прво загревање, па фрли на кош.
    meaning:
      en: A thousand denars a month. First warm up, then shoot.
      pt: Mil dinares por mês. Primeiro aquecimento, depois arremessa.
  - speaker: protagonist
    text: '...Влезе!'
    meaning:
      en: '...It went in!'
      pt: '...Entrou!'
  - speaker: zoran
    text: Убаво фрли. Кој те научи?
    meaning:
      en: Nice shot. Who taught you?
      pt: Belo arremesso. Quem te ensinou?
  - speaker: protagonist
    text: Никој. Бразилец сум — играм со нозе!
    meaning:
      en: Nobody. I'm Brazilian — I play with my feet!
      pt: Ninguém. Sou brasileiro — jogo com os pés!
  - speaker: marko
    text: Брате, сега си член.
    meaning:
      en: Bro, now you're a member.
      pt: Mano, agora você é sócio.
