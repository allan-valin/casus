steps:
- type: narrator
  text:
    en: The evening course ends with a written exam. Professor Ilievska announces the results. Listen to the conversation; you don't need to understand it yet.
    pt: O curso noturno termina com uma prova escrita. A professora Ilievska anuncia os resultados. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: profesorka
    text: 'Резултатите. Писмениот дел: сите положивте.'
    meaning:
      en: 'The results. The written part: you all passed.'
      pt: 'Os resultados. A parte escrita: todos passaram.'
  - speaker: protagonist
    text: И јас? Положив?
    meaning:
      en: Me too? I passed?
      pt: Eu também? Passei?
  - speaker: profesorka
    text: Положивте — со оценка одличен.
    meaning:
      en: You passed — with the top grade, excellent.
      pt: Passou — com nota excelente.
  - speaker: protagonist
    text: Не верувам! А усниот дел?
    meaning:
      en: I can't believe it! And the oral part?
      pt: Não acredito! E a parte oral?
  - speaker: profesorka
    text: Усниот — многу добар. Мали грешки во акцентот, ништо страшно.
    meaning:
      en: The oral — very good. Small stress mistakes, nothing serious.
      pt: A oral — muito bom. Pequenos erros de acento, nada grave.
  - speaker: protagonist
    text: Акцентот... на третиот слог од крајот!
    meaning:
      en: The stress... on the third syllable from the end!
      pt: O acento... na antepenúltima sílaba!
  - speaker: profesorka
    text: Точно. Еве го сертификатот. Ви честитам.
    meaning:
      en: Exactly. Here's the certificate. Congratulations.
      pt: Exato. Aqui está o certificado. Parabéns.
  - speaker: protagonist
    text: Благодарам, професорке. Пет години труд.
    meaning:
      en: Thank you, professor. Five years of work.
      pt: Obrigada, professora. Cinco anos de esforço.
  - speaker: profesorka
    text: Заслужена оценка.
    meaning:
      en: A deserved grade.
      pt: Nota merecida.
