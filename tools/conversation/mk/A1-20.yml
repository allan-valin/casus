steps:
- type: narrator
  text:
    en: Ana needs a day for a meeting with a client. Listen to the conversation; you don't need to understand it yet.
    pt: A Ana precisa marcar um dia para uma reunião com um cliente. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Имаме состанок со клиентот. Кога имаш време?
    meaning:
      en: We have a meeting with the client. When do you have time?
      pt: Temos reunião com o cliente. Quando você tem tempo?
  - speaker: protagonist
    text: Денеска немам време. Утре?
    meaning:
      en: Today I don't have time. Tomorrow?
      pt: Hoje não tenho tempo. Amanhã?
  - speaker: ana
    text: Утре е среда. Во среда не можам.
    meaning:
      en: Tomorrow is Wednesday. On Wednesday I can't.
      pt: Amanhã é quarta. Na quarta não posso.
  - speaker: protagonist
    text: Во четврток?
    meaning:
      en: On Thursday?
      pt: Na quinta?
  - speaker: ana
    text: Четврток може. Или петок.
    meaning:
      en: Thursday works. Or Friday.
      pt: Quinta pode. Ou sexta.
  - speaker: protagonist
    text: Петок е подобро.
    meaning:
      en: Friday is better.
      pt: Sexta é melhor.
  - speaker: ana
    text: Добро, во петок. Понеделник и вторник се тешки денови.
    meaning:
      en: Fine, on Friday. Monday and Tuesday are hard days.
      pt: Combinado, na sexta. Segunda e terça são dias pesados.
  - speaker: protagonist
    text: А сабота и недела — викенд, нема работа!
    meaning:
      en: And Saturday and Sunday — weekend, no work!
      pt: E sábado e domingo — fim de semana, sem trabalho!
- type: narrator
  text:
    en: 'The days, from Monday: понеделник, вторник, среда, четврток, петок, сабота, недела. ''On Friday'' is ''во петок''.'
    pt: 'Os dias, a partir de segunda: понеделник, вторник, среда, четврток, петок, сабота, недела. ''Na sexta'' é ''во петок''.'
- type: narrator
