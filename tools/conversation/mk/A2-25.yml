steps:
- type: narrator
  text:
    en: 'Marko knocks: he needs his phone charger back — and your book is missing. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'O Marko bate na porta: precisa do carregador de volta — e o seu livro sumiu. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: marko
    text: Здраво! Дај ми го полначот, те молам.
    meaning:
      en: Hi! Give me the charger, please.
      pt: Oi! Me dá o carregador, por favor.
  - speaker: protagonist
    text: Полначот? Ти го дадов вчера!
    meaning:
      en: The charger? I gave it to you yesterday!
      pt: O carregador? Te dei ontem!
  - speaker: marko
    text: Аха... заборавив. А книгата моја — ја имаш ли?
    meaning:
      en: Ah... I forgot. And my book — do you have it?
      pt: Ah... esqueci. E o meu livro — está com você?
  - speaker: protagonist
    text: Не. Му ја дадов на Горан.
    meaning:
      en: No. I gave it to Goran.
      pt: Não. Dei para o Goran.
  - speaker: marko
    text: Кажи му да ми ја врати.
    meaning:
      en: Tell him to give it back to me.
      pt: Fala para ele me devolver.
  - speaker: protagonist
    text: Добро. Ти мене позајми ми двесте денари?
    meaning:
      en: All right. And you — lend me two hundred denars?
      pt: Tá bom. E você — me empresta duzentos dinares?
  - speaker: marko
    text: Еве. Кога ќе ми ги вратиш?
    meaning:
      en: Here. When will you give them back?
      pt: Toma. Quando você me devolve?
  - speaker: protagonist
    text: Утре ќе ти ги вратам.
    meaning:
      en: I'll give them back tomorrow.
      pt: Amanhã te devolvo.
- type: narrator
  text:
    en: 'Two small pronouns can go together, ''to whom'' first, then ''what'': ми го (it to me), ти го (it to you), му ја (it to him). After a command they follow the verb: дај ми го.'
    pt: 'Dois pronomes pequenos podem ir juntos, ''a quem'' primeiro, depois ''o quê'': ми го (mo), ти го (to), му ја (lha). Depois de uma ordem vêm depois do verbo: дај ми го (me dá).'
