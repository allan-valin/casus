steps:
- type: narrator
  text:
    en: The club reached the amateur final. You were on the bench; Vera only heard about it. Listen to the conversation; you don't need to understand it yet.
    pt: O clube chegou à final amadora. Você ficou no banco; a Vera só ouviu falar. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Ми кажаа дека сте победиле во финалето! Во последната секунда?
    meaning:
      en: They told me you won the final! In the last second?
      pt: Me contaram que vocês ganharam a final! No último segundo?
  - speaker: protagonist
    text: Да! Марко дал кош од средина... не, не дал — јас го видов!
    meaning:
      en: Yes! Marko scored from mid-court... no, not 'reportedly' — I saw it!
      pt: Sim! O Marko fez uma cesta do meio... não, não 'teria' — eu vi!
  - speaker: vera
    text: Значи вие сте биле на терен?
    meaning:
      en: So you were on the court?
      pt: Então o senhor estava em quadra?
  - speaker: protagonist
    text: Не, бев на клупа. Но гледав сѐ.
    meaning:
      en: No, I was on the bench. But I saw everything.
      pt: Não, fiquei no banco. Mas vi tudo.
  - speaker: vera
    text: А публиката?
    meaning:
      en: And the crowd?
      pt: E a torcida?
  - speaker: protagonist
    text: Илјада луѓе! По минатогодишниот пораз, оваа победа е слатка.
    meaning:
      en: A thousand people! After last year's defeat, this victory is sweet.
      pt: Mil pessoas! Depois da derrota do ano passado, essa vitória é doce.
  - speaker: vera
    text: Не поверував кога ми кажаа.
    meaning:
      en: I couldn't believe it when they told me.
      pt: Não acreditei quando me contaram.
  - speaker: protagonist
    text: Ни јас — а бев таму!
    meaning:
      en: Neither could I — and I was there!
      pt: Nem eu — e eu estava lá!
