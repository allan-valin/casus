steps:
- type: narrator
  text:
    en: A Saturday march for clean air in front of the government building. Ana carries a banner. Listen to the conversation; you don't need to understand it yet.
    pt: Uma marcha de sábado por ar limpo em frente ao prédio do governo. A Ana carrega uma faixa. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: 'Држи го транспарентот: „Чист воздух за сите!“'
    meaning:
      en: 'Hold the banner: ''Clean air for everyone!'''
      pt: 'Segura a faixa: ''Ar limpo para todos!'''
  - speaker: protagonist
    text: Кои се барањата?
    meaning:
      en: What are the demands?
      pt: Quais são as reivindicações?
  - speaker: ana
    text: 'Бараме од Владата итни мерки: јавен превоз, филтри во фабриките.'
    meaning:
      en: 'We demand urgent measures from the government: public transport, filters in factories.'
      pt: 'Exigimos medidas urgentes do governo: transporte público, filtros nas fábricas.'
  - speaker: protagonist
    text: Протестот е мирен?
    meaning:
      en: Is the protest peaceful?
      pt: O protesto é pacífico?
  - speaker: ana
    text: Секогаш. Граѓаните имаат право да бараат.
    meaning:
      en: Always. Citizens have the right to demand.
      pt: Sempre. Os cidadãos têm direito de exigir.
  - speaker: protagonist
    text: Јас не сум граѓанин, но дишам ист воздух.
    meaning:
      en: I'm not a citizen, but I breathe the same air.
      pt: Eu não sou cidadão, mas respiro o mesmo ar.
  - speaker: ana
    text: Тогаш потпиши ја петицијата. Собираме потписи.
    meaning:
      en: Then sign the petition. We're collecting signatures.
      pt: Então assina o abaixo-assinado. A gente está coletando assinaturas.
  - speaker: protagonist
    text: Со задоволство.
    meaning:
      en: With pleasure.
      pt: Com prazer.
