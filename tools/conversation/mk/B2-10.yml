steps:
- type: narrator
  text:
    en: 'Two e-mails to write: one to a client, one to Marko. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Dois e-mails para escrever: um para um cliente, um para o Marko. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: darko
    text: Пишуваш до клиентот? Почни со „Почитувани“.
    meaning:
      en: Writing to the client? Start with 'Почитувани'.
      pt: Vai escrever para o cliente? Começa com 'Почитувани'.
  - speaker: protagonist
    text: „Почитувани, во прилог ви ја праќаме понудата.“
    meaning:
      en: '''Dear Sirs, attached please find our offer.'''
      pt: '''Prezados, em anexo enviamos a proposta.'''
  - speaker: darko
    text: 'Добро. Потоа: „Ве молиме за одговор до петок.“'
    meaning:
      en: 'Good. Then: ''We kindly ask for a reply by Friday.'''
      pt: 'Bom. Depois: ''Pedimos a gentileza de responder até sexta.'''
  - speaker: protagonist
    text: 'И на крајот: „Со почит“.'
    meaning:
      en: 'And at the end: ''Yours sincerely''.'
      pt: 'E no fim: ''Atenciosamente''.'
  - speaker: darko
    text: Совршено. А до Марко?
    meaning:
      en: Perfect. And to Marko?
      pt: Perfeito. E para o Marko?
  - speaker: protagonist
    text: „Друже, вечерва кафана? Поздрав.“
    meaning:
      en: '''Mate, кафана tonight? Cheers.'''
      pt: '''Mano, кафана hoje à noite? Abraço.'''
  - speaker: darko
    text: Ха! Само не мешај ги двата мејла.
    meaning:
      en: Ha! Just don't mix up the two e-mails.
      pt: Ha! Só não troca os dois e-mails.
  - speaker: protagonist
    text: Тоа би било интересно за клиентот.
    meaning:
      en: That would be interesting for the client.
      pt: Isso seria interessante para o cliente.
