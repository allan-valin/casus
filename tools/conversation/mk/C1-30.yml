steps:
- type: narrator
  text:
    en: Marko's birthday at the old кафана. Everyone from C1 is there — and it all comes back. Listen to the conversation; you don't need to understand it yet.
    pt: Aniversário do Marko na velha кафана. Todo mundo do C1 está lá — e tudo volta. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Се сеќаваш ли на првиот ден? Мојот пес те исплаши.
    meaning:
      en: Do you remember the first day? My dog scared you.
      pt: Lembra do primeiro dia? Meu cachorro te assustou.
  - speaker: protagonist
    text: Бруно! Не знаев ништо — само „Здраво“.
    meaning:
      en: Bruno! I didn't know anything — only 'Здраво'.
      pt: O Bruno! Eu não sabia nada — só 'Здраво'.
  - speaker: goran
    text: А сега зборуваш како домашен.
    meaning:
      en: And now you speak like a local.
      pt: E agora fala como um daqui.
  - speaker: vera
    text: И пиеш кафе како домашен — два часа!
    meaning:
      en: And you drink coffee like a local — two hours!
      pt: E toma café como um daqui — duas horas!
  - speaker: protagonist
    text: Времето лета. Кум, татко, сопруг...
    meaning:
      en: Time flies. A кум, a father, a husband...
      pt: O tempo voa. Padrinho, pai, marido...
  - speaker: sara
    text: И на крајот — одличен на испит!
    meaning:
      en: And finally — top marks in the exam!
      pt: E no fim — nota máxima na prova!
  - speaker: protagonist
    text: Среќен роденден, брате! За уште многу!
    meaning:
      en: Happy birthday, bro! To many more!
      pt: Feliz aniversário, mano! A muitos mais!
  - speaker: marko
    text: На здравје — погледни ме во очи!
    meaning:
      en: Cheers — look me in the eyes!
      pt: Saúde — olha nos meus olhos!
