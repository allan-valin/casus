steps:
- type: narrator
  text:
    en: Five years in Skopje. At the Ministry, you ask about permanent residence. Listen to the conversation; you don't need to understand it yet.
    pt: Cinco anos em Skopje. No Ministério, você pergunta sobre residência permanente. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Добар ден. Пет години живеам тука. Може ли постојан престој?
    meaning:
      en: Good morning. I've lived here five years. Can I get permanent residence?
      pt: Bom dia. Moro aqui há cinco anos. Posso pedir residência permanente?
  - speaker: sluzbenicka
    text: 'Условите се: непрекинат престој, доказ за работа и средства за живот.'
    meaning:
      en: 'The conditions are: continuous residence, proof of work and means of support.'
      pt: 'As condições são: residência ininterrupta, comprovante de trabalho e meios de subsistência.'
  - speaker: protagonist
    text: А државјанство?
    meaning:
      en: And citizenship?
      pt: E cidadania?
  - speaker: sluzbenicka
    text: Тоа е посебна постапка, со подолг рок и испит по јазик.
    meaning:
      en: That's a separate procedure, with a longer period and a language exam.
      pt: Isso é outro processo, com prazo maior e prova de língua.
  - speaker: protagonist
    text: Колку години точно?
    meaning:
      en: How many years exactly?
      pt: Quantos anos exatamente?
  - speaker: sluzbenicka
    text: Условите се менуваат. Проверете ги актуелните на официјалната страница.
    meaning:
      en: The conditions change. Check the current ones on the official website.
      pt: As condições mudam. Confira as atuais no site oficial.
  - speaker: protagonist
    text: Тогаш денеска поднесувам барање за постојан престој.
    meaning:
      en: Then today I'm submitting an application for permanent residence.
      pt: Então hoje faço o requerimento de residência permanente.
  - speaker: sluzbenicka
    text: Пополнете го образецот. Следен!
    meaning:
      en: Fill in the form. Next!
      pt: Preencha o formulário. Próximo!
