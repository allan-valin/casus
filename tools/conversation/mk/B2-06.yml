steps:
- type: narrator
  text:
    en: Cleaning day with Sara. You are about to mix two bottles. Listen to the conversation; you don't need to understand it yet.
    pt: Dia de faxina com a Sara. Você está prestes a misturar dois frascos. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sara
    text: Стој! Што правиш?
    meaning:
      en: Stop! What are you doing?
      pt: Para! O que você está fazendo?
  - speaker: protagonist
    text: Мешам варикина и средство за бања.
    meaning:
      en: I'm mixing bleach and the bathroom cleaner.
      pt: Estou misturando água sanitária com o produto de banheiro.
  - speaker: sara
    text: Тоа не се меша! Во средството има киселина.
    meaning:
      en: You don't mix those! The cleaner has acid in it.
      pt: Isso não se mistura! No produto tem ácido.
  - speaker: protagonist
    text: И што се случува?
    meaning:
      en: And what happens?
      pt: E o que acontece?
  - speaker: sara
    text: Реакција. Се прави отровен гас — хлор.
    meaning:
      en: A reaction. A poisonous gas forms — chlorine.
      pt: Uma reação. Se forma um gás tóxico — cloro.
  - speaker: protagonist
    text: Ужас. А оцет и сода бикарбона?
    meaning:
      en: Terrible. And vinegar and baking soda?
      pt: Que perigo. E vinagre com bicarbonato?
  - speaker: sara
    text: Тоа пенува, но е безопасно. Со тоа чистиме.
    meaning:
      en: That foams, but it's harmless. We clean with that.
      pt: Isso espuma, mas é inofensivo. A gente limpa com isso.
  - speaker: protagonist
    text: Од денеска — само оцет!
    meaning:
      en: From today — only vinegar!
      pt: De hoje em diante — só vinagre!
