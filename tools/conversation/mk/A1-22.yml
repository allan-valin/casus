steps:
- type: narrator
  text:
    en: You are late for coffee with Marko and call him. Listen to the conversation; you don't need to understand it yet.
    pt: Você está atrasado para o café com o Marko e liga para ele. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Здраво, Марко! Извини, доцнам.
    meaning:
      en: Hi, Marko! Sorry, I'm late.
      pt: Oi, Marko! Desculpa, estou atrasado.
  - speaker: marko
    text: Нема проблем. Колку е часот сега?
    meaning:
      en: No problem. What time is it now?
      pt: Sem problema. Que horas são agora?
  - speaker: protagonist
    text: Три и десет. Кафето е во три!
    meaning:
      en: Ten past three. The coffee was at three!
      pt: Três e dez. O café era às três!
  - speaker: marko
    text: Опуштено.
    meaning:
      en: Relax.
      pt: Relaxa.
  - speaker: protagonist
    text: Стигнувам во три и половина.
    meaning:
      en: I'll get there at half past three.
      pt: Chego às três e meia.
  - speaker: marko
    text: Супер, полека.
    meaning:
      en: Great, take your time.
      pt: Ótimo, com calma.
  - speaker: protagonist
    text: А ти? Каде си?
    meaning:
      en: And you? Where are you?
      pt: E você? Onde você está?
  - speaker: marko
    text: Јас? Уште сум дома.
    meaning:
      en: Me? I'm still at home.
      pt: Eu? Ainda estou em casa.
- type: narrator
  text:
    en: With friends, 'Извини' — with strangers and older people, 'Извинете'.
    pt: Com amigos, 'Извини' — com desconhecidos e pessoas mais velhas, 'Извинете'.
