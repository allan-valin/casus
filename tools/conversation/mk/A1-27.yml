steps:
- type: narrator
  text:
    en: Mrs Stojanovska shows you a photo of her house in the village. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Stojanovska mostra uma foto da casa dela na aldeia. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Ова е мојата куќа во селото.
    meaning:
      en: This is my house in the village.
      pt: Esta é a minha casa na aldeia.
  - speaker: protagonist
    text: Убава е! Од камен?
    meaning:
      en: It's beautiful! Made of stone?
      pt: É linda! De pedra?
  - speaker: vera
    text: Да, од камен и дрво. Камената куќа е ладна лете, топла зиме.
    meaning:
      en: Yes, of stone and wood. A stone house is cool in summer, warm in winter.
      pt: Sim, de pedra e madeira. Casa de pedra é fresca no verão e quente no inverno.
  - speaker: protagonist
    text: А оваа зграда?
    meaning:
      en: And this building?
      pt: E este prédio?
  - speaker: vera
    text: Зградата е од бетон. Лесно се гради, но е грда.
    meaning:
      en: The building is concrete. Easy to build, but ugly.
      pt: O prédio é de concreto. Fácil de construir, mas feio.
  - speaker: protagonist
    text: Во Бразил куќите се од тули.
    meaning:
      en: In Brazil houses are made of brick.
      pt: No Brasil as casas são de tijolo.
  - speaker: vera
    text: А мојата порта е од железо — тешка е!
    meaning:
      en: And my gate is iron — it's heavy!
      pt: E o meu portão é de ferro — é pesado!
  - speaker: protagonist
    text: А прозорците се од стакло.
    meaning:
      en: And the windows are glass.
      pt: E as janelas são de vidro.
  - speaker: vera
    text: Секако! (се смее)
    meaning:
      en: Of course! (laughs)
      pt: Claro! (ri)
