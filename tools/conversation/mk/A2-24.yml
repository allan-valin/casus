- type: narrator
  text:
    en: At weddings the tapan drum and the zurla play the oro, a line or circle dance; anyone can join by taking hands at the end of the line. Староградска музика, the old-town songs, are slower, sung in
      taverns with an accordion or guitar.
    pt: Nos casamentos o tapan e a zurla tocam o oro, uma dança em fila ou roda; qualquer um entra dando a mão no fim da fila. A староградска музика, as canções da cidade antiga, é mais lenta, cantada nas
      tavernas com acordeão ou violão.
