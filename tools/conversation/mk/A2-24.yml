steps:
- type: narrator
  text:
    en: A wedding in Marko's family. Goran explains the music. Listen to the conversation; you don't need to understand it yet.
    pt: Um casamento na família do Marko. O Goran explica a música. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: goran
    text: Слушаш? Тоа е тапан, а ова — зурла.
    meaning:
      en: Hear that? That's the tapan, and this — the zurla.
      pt: Está ouvindo? Aquilo é o tapan, e isto — a zurla.
  - speaker: protagonist
    text: Многу гласно!
    meaning:
      en: Very loud!
      pt: Muito alto!
  - speaker: goran
    text: Така е на свадби. Ајде, фати се во орото!
    meaning:
      en: That's how it is at weddings. Come on, join the oro!
      pt: Casamento é assim. Vem, entra na roda!
  - speaker: protagonist
    text: Не го знам ритамот!
    meaning:
      en: I don't know the rhythm!
      pt: Não sei o ritmo!
  - speaker: goran
    text: Гледај ги нозете. Десно, десно, лево.
    meaning:
      en: Watch the feet. Right, right, left.
      pt: Olha os pés. Direita, direita, esquerda.
  - speaker: protagonist
    text: А кога е потивко?
    meaning:
      en: And when it's quieter?
      pt: E quando é mais calmo?
  - speaker: goran
    text: Староградски песни. Порано луѓето ги пееја по кафеани.
    meaning:
      en: Old-town songs. In the past people sang them in the taverns.
      pt: Canções da cidade antiga. Antigamente o pessoal cantava nas tavernas.
  - speaker: protagonist
    text: Како самба во бар!
    meaning:
      en: Like samba in a bar!
      pt: Como samba no boteco!
