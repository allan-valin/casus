steps:
- type: narrator
  text:
    en: Goran came back from Munich. His job is gone and so is his girlfriend. He calls at midnight. Listen to the conversation; you don't need to understand it yet.
    pt: O Goran voltou de Munique. Perdeu o emprego e a namorada. Ele liga à meia-noite. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: goran
    text: Извини што се јавувам вака доцна...
    meaning:
      en: Sorry for calling so late...
      pt: Desculpa ligar tão tarde...
  - speaker: protagonist
    text: Нема проблем. Тука сум за тебе. Што се случи?
    meaning:
      en: No problem. I'm here for you. What happened?
      pt: Sem problema. Estou aqui para você. O que aconteceu?
  - speaker: goran
    text: Ја изгубив работата. И Ема замина. Се чувствувам празно.
    meaning:
      en: I lost my job. And Ema left. I feel empty.
      pt: Perdi o emprego. E a Ema foi embora. Me sinto vazio.
  - speaker: protagonist
    text: Разбирливо е. Не мора да зборуваш — само те слушам.
    meaning:
      en: It's understandable. You don't have to talk — I'm just listening.
      pt: É compreensível. Não precisa falar — só estou ouvindo.
  - speaker: goran
    text: Мислев дека во Минхен ќе ми биде подобро.
    meaning:
      en: I thought I'd be better off in Munich.
      pt: Achei que em Munique eu ia ficar melhor.
  - speaker: protagonist
    text: Не си сам. Ќе помине — чекор по чекор.
    meaning:
      en: You're not alone. It will pass — step by step.
      pt: Você não está sozinho. Vai passar — passo a passo.
  - speaker: protagonist
    text: Дојди утре на ручек. Бојан прави гравче.
    meaning:
      en: Come for lunch tomorrow. Bojan's making beans.
      pt: Vem almoçar amanhã. O Bojan vai fazer feijão.
  - speaker: goran
    text: Благодарам. За поддршката.
    meaning:
      en: Thank you. For the support.
      pt: Obrigado. Pelo apoio.
