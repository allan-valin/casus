steps:
- type: narrator
  text:
    en: Fifty years of the basketball club. Zoran, retired, sits in the front row. You present the evening. Listen to the conversation; you don't need to understand it yet.
    pt: Cinquenta anos do clube de basquete. O Zoran, aposentado, está na primeira fila. Você apresenta a noite. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Почитувани гости, денеска славиме јубилеј — педесет години од клубот.
    meaning:
      en: Honoured guests, today we celebrate an anniversary — fifty years of the club.
      pt: Prezados convidados, hoje celebramos um jubileu — cinquenta anos do clube.
  - speaker: protagonist
    text: Ни е чест да го поздравиме тренерот Зоран.
    meaning:
      en: It is an honour for us to welcome coach Zoran.
      pt: É uma honra para nós saudar o técnico Zoran.
  - speaker: zoran
    text: Благодарам, благодарам...
    meaning:
      en: Thank you, thank you...
      pt: Obrigado, obrigado...
  - speaker: protagonist
    text: Некои од основачите не се веќе со нас. Ве молам, минута молк.
    meaning:
      en: Some of the founders are no longer with us. Please, a minute's silence.
      pt: Alguns dos fundadores não estão mais conosco. Por favor, um minuto de silêncio.
  - speaker: protagonist
    text: 'Со голема гордост: генерации играчи, тренери, навивачи.'
    meaning:
      en: 'With great pride: generations of players, coaches, fans.'
      pt: 'Com muito orgulho: gerações de jogadores, técnicos, torcedores.'
  - speaker: marko
    text: И еден Бразилец!
    meaning:
      en: And one Brazilian!
      pt: E um brasileiro!
  - speaker: protagonist
    text: И еден Бразилец. Клубот — и понатаму!
    meaning:
      en: And one Brazilian. The club — onward!
      pt: E um brasileiro. O clube — sempre adiante!
  - speaker: zoran
    text: За уште педесет — наздравје!
    meaning:
      en: To fifty more — cheers!
      pt: A mais cinquenta — saúde!
