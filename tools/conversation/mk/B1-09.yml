steps:
- type: narrator
  text:
    en: A small tremor woke you at night. At work, Ana explains why Skopje shakes. Listen to the conversation; you don't need to understand it yet.
    pt: Um tremor pequeno te acordou à noite. No trabalho, a Ana explica por que Skopje treme. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Го почувствува ли земјотресот ноќеска?
    meaning:
      en: Did you feel the earthquake last night?
      pt: Você sentiu o terremoto ontem à noite?
  - speaker: protagonist
    text: Да! Креветот се тресеше. Се исплашив.
    meaning:
      en: Yes! The bed was shaking. I got scared.
      pt: Senti! A cama tremia. Fiquei com medo.
  - speaker: ana
    text: Беше мал. Тука често се тресе.
    meaning:
      en: It was a small one. It shakes here often.
      pt: Foi pequeno. Aqui treme com frequência.
  - speaker: protagonist
    text: Зошто?
    meaning:
      en: Why?
      pt: Por quê?
  - speaker: ana
    text: Балканот е меѓу плочи што се движат.
    meaning:
      en: The Balkans sit between plates that move.
      pt: Os Bálcãs ficam entre placas que se movem.
  - speaker: protagonist
    text: А нашата зграда безбедна ли е?
    meaning:
      en: And is our building safe?
      pt: E o nosso prédio é seguro?
  - speaker: ana
    text: После 1963 зградите се градат според строги правила.
    meaning:
      en: Since 1963 buildings are built to strict rules.
      pt: Depois de 1963 os prédios são construídos com regras rígidas.
  - speaker: protagonist
    text: Тоа ме смирува.
    meaning:
      en: That calms me down.
      pt: Isso me acalma.
