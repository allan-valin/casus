steps:
- type: narrator
  text:
    en: Marko and Goran visit you in Brazil for the first time. Avenida Paulista on a Sunday. Listen to the conversation; you don't need to understand it yet.
    pt: O Marko e o Goran visitam você no Brasil pela primeira vez. Avenida Paulista num domingo. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Немам зборови. Толку многу луѓе!
    meaning:
      en: I'm speechless. So many people!
      pt: Estou sem palavras. Tanta gente!
  - speaker: protagonist
    text: Во недела ја затвораат улицата за коли. Сите шетаат.
    meaning:
      en: On Sundays they close the street to cars. Everyone walks.
      pt: No domingo fecham a rua para carros. Todo mundo passeia.
  - speaker: goran
    text: А кафето? Во стоење, за две минути?
    meaning:
      en: And the coffee? Standing up, in two minutes?
      pt: E o café? Em pé, em dois minutos?
  - speaker: protagonist
    text: Кафезињо. Тука кафето е брзо — обратно од кај нас.
    meaning:
      en: Cafezinho. Here coffee is fast — the other way round from back home.
      pt: Cafezinho. Aqui o café é rápido — ao contrário de lá.
  - speaker: marko
    text: Сега разбирам зошто беше во шок во Скопје.
    meaning:
      en: Now I understand why you were in shock in Skopje.
      pt: Agora entendo por que você ficou em choque em Skopje.
  - speaker: protagonist
    text: А јас сега имам носталгија — за Скопје.
    meaning:
      en: And now I'm homesick — for Skopje.
      pt: E agora eu estou com saudade — de Skopje.
  - speaker: goran
    text: Обратно! Бразилец со носталгија за Скопје.
    meaning:
      en: The other way round! A Brazilian homesick for Skopje.
      pt: Ao contrário! Um brasileiro com saudade de Skopje.
  - speaker: protagonist
    text: Таков е животот кога имаш два дома.
    meaning:
      en: That's life when you have two homes.
      pt: É assim a vida quando você tem duas casas.
