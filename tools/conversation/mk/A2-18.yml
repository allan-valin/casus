steps:
- type: narrator
  text:
    en: On the shore at Ohrid, Ana points at the mountain across the water. Listen to the conversation; you don't need to understand it yet.
    pt: Na margem, em Ohrid, a Ana aponta para a montanha do outro lado da água. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Ова е Галичица, планината меѓу двете езера.
    meaning:
      en: This is Galičica, the mountain between the two lakes.
      pt: Esta é a Galičica, a montanha entre os dois lagos.
  - speaker: protagonist
    text: Две езера?
    meaning:
      en: Two lakes?
      pt: Dois lagos?
  - speaker: ana
    text: Охридското и Преспанското. Преспа е повисоко.
    meaning:
      en: Ohrid and Prespa. Prespa is higher.
      pt: O de Ohrid e o de Prespa. Prespa é mais alto.
  - speaker: protagonist
    text: Која е највисоката планина во Македонија?
    meaning:
      en: Which is the highest mountain in Macedonia?
      pt: Qual é a montanha mais alta da Macedônia?
  - speaker: ana
    text: Кораб, на границата со Албанија. Над две илјади и седумстотини метри.
    meaning:
      en: Korab, on the border with Albania. Over two thousand seven hundred metres.
      pt: O Korab, na fronteira com a Albânia. Mais de dois mil e setecentos metros.
  - speaker: protagonist
    text: А најголемата река?
    meaning:
      en: And the biggest river?
      pt: E o maior rio?
  - speaker: ana
    text: Вардар. Тече низ Скопје, па во Грција, до морето.
    meaning:
      en: The Vardar. It flows through Skopje, then into Greece, to the sea.
      pt: O Vardar. Passa por Skopje, depois pela Grécia, até o mar.
  - speaker: protagonist
    text: Македонија нема море?
    meaning:
      en: Macedonia has no sea?
      pt: A Macedônia não tem mar?
  - speaker: ana
    text: Немаме. Затоа летото сите одат во Грција!
    meaning:
      en: We don't. That's why in summer everyone goes to Greece!
      pt: Não. Por isso no verão todo mundo vai para a Grécia!
