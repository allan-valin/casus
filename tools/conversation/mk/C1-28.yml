steps:
- type: narrator
  text:
    en: Your parents visit Skopje. Lunch at Vera's — you translate both ways. Listen to the conversation; you don't need to understand it yet.
    pt: Seus pais visitam Skopje. Almoço na casa da Vera — você traduz para os dois lados. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: 'Кажи им на твоите: добредојдовте во Скопје!'
    meaning:
      en: 'Tell your parents: welcome to Skopje!'
      pt: 'Fala para os seus pais: bem-vindos a Skopje!'
  - speaker: protagonist
    text: 'Им го преведувам... Мајка ми вели: „Многу е убаво.“'
    meaning:
      en: 'I''m translating it for them... My mother says: ''It''s very beautiful.'''
      pt: 'Estou traduzindo para eles... Minha mãe diz: ''É muito bonito.'''
  - speaker: vera
    text: 'Кажи ѝ го ова: јадете, јадете, има уште!'
    meaning:
      en: 'Tell her this: eat, eat, there''s more!'
      pt: 'Fala isso para ela: come, come, tem mais!'
  - speaker: protagonist
    text: 'Таа вели: „Исто како кај нас — баба ми така правеше.“'
    meaning:
      en: 'She says: ''Just like with us — my grandmother did the same.'''
      pt: 'Ela diz: ''Igual ao nosso — minha avó fazia assim.'''
  - speaker: vera
    text: Значи сме слични! А татко ти?
    meaning:
      en: So we're similar! And your father?
      pt: Então somos parecidos! E o seu pai?
  - speaker: protagonist
    text: 'Тој прави споредба: ракијата е како кашаса, но појака.'
    meaning:
      en: 'He''s making a comparison: rakija is like cachaça, but stronger.'
      pt: 'Ele faz uma comparação: a rakija é como cachaça, só que mais forte.'
  - speaker: vera
    text: Нека пие полека! И кажи им — ви благодарат за гостопримството?
    meaning:
      en: Let him drink slowly! And tell them — are they thanking me for the hospitality?
      pt: Que ele beba devagar! E fala para eles — estão agradecendo a hospitalidade?
  - speaker: protagonist
    text: 'Ви благодарат. И велат: дојдете во Бразил, вие сте нивни гости.'
    meaning:
      en: 'They thank you. And they say: come to Brazil, you''ll be their guest.'
      pt: 'Agradecem. E dizem: venha ao Brasil, a senhora é convidada deles.'
