steps:
- type: narrator
  text:
    en: A boat on the lake, then up to Samuel's Fortress. Listen to the conversation; you don't need to understand it yet.
    pt: Um passeio de barco no lago, depois a subida até a fortaleza de Samuel. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Дали си била некогаш на брод?
    meaning:
      en: Have you ever been on a boat?
      pt: Você já andou de barco?
  - speaker: protagonist
    text: Да, сум била, во Рио. Но ова е поубаво.
    meaning:
      en: Yes, I have, in Rio. But this is nicer.
      pt: Já, no Rio. Mas este é mais bonito.
  - speaker: ana
    text: Погледни горе — тврдината на Самоил.
    meaning:
      en: Look up — Samuel's Fortress.
      pt: Olha lá em cima — a fortaleza de Samuel.
  - speaker: protagonist
    text: Колку е стара?
    meaning:
      en: How old is it?
      pt: Quantos anos ela tem?
  - speaker: ana
    text: Околу илјада години. Охрид беше главниот град на цар Самоил.
    meaning:
      en: About a thousand years. Ohrid was Tsar Samuel's capital.
      pt: Uns mil anos. Ohrid era a capital do tsar Samuel.
  - speaker: protagonist
    text: Сликај ме, те молам!
    meaning:
      en: Take my picture, please!
      pt: Tira uma foto minha, por favor!
  - speaker: ana
    text: Насмевни се! ... Еве.
    meaning:
      en: Smile! ... There.
      pt: Sorria! ... Pronto.
  - speaker: protagonist
    text: Не, затворени ми се очите! Уште една!
    meaning:
      en: No, my eyes are closed! One more!
      pt: Não, saí de olho fechado! Mais uma!
- type: narrator
  text:
    en: 'To say what you have done in your life, Macedonian uses сум with an -л form that agrees with you: сум била (a woman), сум бил (a man). ''Те молам'' is the informal ''please''.'
    pt: 'Para dizer o que você já fez na vida, o macedônio usa сум com uma forma em -л que concorda com você: сум била (mulher), сум бил (homem). ''Те молам'' é o ''por favor'' informal.'
