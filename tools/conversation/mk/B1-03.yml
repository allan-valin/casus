steps:
- type: narrator
  text:
    en: Ana's sister has a biology exam tomorrow and phoned with a question Ana can't answer. Listen to the conversation; you don't need to understand it yet.
    pt: A irmã da Ana tem prova de biologia amanhã e ligou com uma pergunta que a Ana não sabe responder. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Сестра ми има испит по биологија. Ме праша нешто, а не знам.
    meaning:
      en: My sister has a biology exam. She asked me something and I don't know.
      pt: Minha irmã tem prova de biologia. Me perguntou uma coisa e eu não sei.
  - speaker: protagonist
    text: Што те праша?
    meaning:
      en: What did she ask you?
      pt: O que ela perguntou?
  - speaker: ana
    text: Од што е составена клетката?
    meaning:
      en: What is the cell made of?
      pt: Do que a célula é composta?
  - speaker: protagonist
    text: Клетката има јадро, а јадрото ја чува ДНК.
    meaning:
      en: The cell has a nucleus, and the nucleus keeps the DNA.
      pt: A célula tem núcleo, e o núcleo guarda o DNA.
  - speaker: ana
    text: И клетката се дели?
    meaning:
      en: And the cell divides?
      pt: E a célula se divide?
  - speaker: protagonist
    text: Да, се дели на две. Така расте телото.
    meaning:
      en: Yes, it divides in two. That's how the body grows.
      pt: Sim, se divide em duas. É assim que o corpo cresce.
  - speaker: ana
    text: Ти знаеш биологија!
    meaning:
      en: You know biology!
      pt: Você entende de biologia!
  - speaker: protagonist
    text: Малку. Мајка ми е медицинска сестра.
    meaning:
      en: A little. My mother is a nurse.
      pt: Um pouco. Minha mãe é enfermeira.
