steps:
- type: narrator
  text:
    en: Downstairs there is a small shop, the маркет. Dragan, the owner, greets everyone. Listen to the conversation; you don't need to understand it yet.
    pt: Embaixo do prédio há uma lojinha, o маркет. Dragan, o dono, cumprimenta todo mundo. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: dragan
    text: Повелете! Добар ден!
    meaning:
      en: Welcome! Good day!
      pt: Pois não! Bom dia!
  - speaker: protagonist
    text: Добар ден. Имате ли леб?
    meaning:
      en: Good day. Do you have bread?
      pt: Bom dia. O senhor tem pão?
  - speaker: dragan
    text: Имаме. Еден леб?
    meaning:
      en: We have. One loaf?
      pt: Temos. Um pão?
  - speaker: protagonist
    text: Да, еден леб и две млека, ве молам.
    meaning:
      en: Yes, one loaf and two milks, please.
      pt: Sim, um pão e dois leites, por favor.
  - speaker: dragan
    text: Уште нешто?
    meaning:
      en: Anything else?
      pt: Mais alguma coisa?
  - speaker: protagonist
    text: Вода. Тоа е сѐ. Колку чини?
    meaning:
      en: Water. That's all. How much is it?
      pt: Água. É só isso. Quanto custa?
  - speaker: dragan
    text: Сто и дваесет денари. Кесе?
    meaning:
      en: A hundred and twenty denars. A bag?
      pt: Cento e vinte dinares. Sacolinha?
  - speaker: protagonist
    text: Не, благодарам.
    meaning:
      en: No, thank you.
      pt: Não, obrigado.
  - speaker: dragan
    text: Нема зошто. Пријатно!
    meaning:
      en: You're welcome. Have a nice day!
      pt: De nada. Tenha um bom dia!
