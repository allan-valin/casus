steps:
- type: narrator
  text:
    en: Vera's bookshelf. She takes down two books she has known since school. Listen to the conversation; you don't need to understand it yet.
    pt: A estante da Vera. Ela tira dois livros que conhece desde a escola. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Ова е Кочо Рацин, „Бели мугри“. Првата книга поезија на македонски.
    meaning:
      en: This is Kočo Racin, 'White Dawns'. The first book of poetry in Macedonian.
      pt: Este é Kočo Racin, 'Auroras Brancas'. O primeiro livro de poesia em macedônio.
  - speaker: protagonist
    text: Кога ја напишал?
    meaning:
      en: When did he write it?
      pt: Quando ele escreveu?
  - speaker: vera
    text: Во 1939. Песни за работниците.
    meaning:
      en: In 1939. Poems about the workers.
      pt: Em 1939. Poemas sobre os trabalhadores.
  - speaker: protagonist
    text: А оваа книга?
    meaning:
      en: And this book?
      pt: E este livro?
  - speaker: vera
    text: Блаже Конески. Поет, но и тој што го уредил јазикот и правописот.
    meaning:
      en: Blaže Koneski. A poet, and also the one who shaped the language and its spelling.
      pt: Blaže Koneski. Poeta, e também quem organizou a língua e a ortografia.
  - speaker: protagonist
    text: Ги знаеш напамет?
    meaning:
      en: Do you know them by heart?
      pt: Você sabe de cor?
  - speaker: vera
    text: Некои стихови. Учењето напамет беше важно во училиште.
    meaning:
      en: Some lines. Learning by heart was important at school.
      pt: Alguns versos. Decorar era importante na escola.
  - speaker: protagonist
    text: Прочитај ми еден!
    meaning:
      en: Read me one!
      pt: Lê um para mim!
