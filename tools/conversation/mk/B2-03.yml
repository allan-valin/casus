steps:
- type: narrator
  text:
    en: Photos at Bojan's grandmother's. Everyone says you look like someone. Listen to the conversation; you don't need to understand it yet.
    pt: Fotos na casa da avó do Bojan. Todo mundo diz que alguém parece com alguém. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: baba
    text: Види, Бојан личи на дедо му!
    meaning:
      en: Look, Bojan looks like his grandfather!
      pt: Olha, o Bojan parece com o avô!
  - speaker: protagonist
    text: Навистина! Истите очи.
    meaning:
      en: Really! The same eyes.
      pt: É verdade! Os mesmos olhos.
  - speaker: bojan
    text: Очите ги наследив од дедо, а косата од баба.
    meaning:
      en: I got the eyes from grandpa, and the hair from grandma.
      pt: Os olhos eu herdei do avô, e o cabelo da avó.
  - speaker: protagonist
    text: Кадравата коса? Тоа е ген.
    meaning:
      en: The curly hair? That's a gene.
      pt: O cabelo cacheado? Isso é gene.
  - speaker: baba
    text: А карактерот — од мене, за жал!
    meaning:
      en: And the character — from me, unfortunately!
      pt: E o temperamento — de mim, infelizmente!
  - speaker: protagonist
    text: Јас личам на татко ми, но помалку тврдоглава.
    meaning:
      en: I look like my father, but less stubborn.
      pt: Eu pareço com meu pai, mas menos teimosa.
  - speaker: bojan
    text: Помалку? Не би рекол!
    meaning:
      en: Less? I wouldn't say so!
      pt: Menos? Não diria!
  - speaker: protagonist
    text: Тоа е друг ген!
    meaning:
      en: That's a different gene!
      pt: Isso é outro gene!
