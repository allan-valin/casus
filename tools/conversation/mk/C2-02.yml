steps:
- type: narrator
  text:
    en: Darko locked the office keys inside the office. Again. Listen to the conversation; you don't need to understand it yet.
    pt: O Darko trancou as chaves do escritório dentro do escritório. De novo. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: darko
    text: Клучевите ги оставив внатре... пак.
    meaning:
      en: I left the keys inside... again.
      pt: Deixei as chaves lá dentro... de novo.
  - speaker: protagonist
    text: Баш паметно!
    meaning:
      en: Real clever!
      pt: Muito inteligente!
  - speaker: darko
    text: Ништо, ќе чекаме мајстор.
    meaning:
      en: Never mind, we'll wait for a locksmith.
      pt: Tudo bem, a gente espera um chaveiro.
  - speaker: protagonist
    text: Не треба. Еве ти ги — резервни клучеви. Ги чувам во бирото.
    meaning:
      en: No need. Here — spare keys. I keep them in my desk.
      pt: Não precisa. Toma — chaves reserva. Guardo na minha mesa.
  - speaker: darko
    text: Ти си бил гениј!
    meaning:
      en: You're a genius, it turns out!
      pt: Você é um gênio, pelo jeito!
  - speaker: protagonist
    text: Не сум гениј, само те познавам.
    meaning:
      en: I'm not a genius, I just know you.
      pt: Não sou gênio, só te conheço.
  - speaker: darko
    text: Не сум знаел дека имало резервни клучеви!
    meaning:
      en: I had no idea there were spare keys!
      pt: Eu não fazia ideia que tinha chave reserva!
  - speaker: protagonist
    text: Имало, имало. Две години.
    meaning:
      en: There were, there were. For two years.
      pt: Tinha, tinha. Faz dois anos.
- type: narrator
  text:
    en: 'The admirative: the л-form with сум for surprise at something you just found out — ''ти си бил гениј!'' (you''re a genius, who knew!), ''не сум знаел дека имало…'' (I had no idea there were…).
      Said with a flat voice, it turns ironic.'
    pt: 'O admirativo: a forma em -л com сум para surpresa diante do que você acabou de descobrir — ''ти си бил гениј!'' (você é um gênio, quem diria!), ''не сум знаел дека имало…'' (eu não fazia ideia
      que havia…). Dito em tom seco, vira ironia.'
