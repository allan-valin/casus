steps:
- type: narrator
  text:
    en: Friday at a кафана. Marko's friends meet here every week. Listen to the conversation; you don't need to understand it yet.
    pt: Sexta numa кафана. Os amigos do Marko se encontram aqui toda semana. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Ова е мојата дружина. Секој петок сме тука.
    meaning:
      en: This is my group. Every Friday we're here.
      pt: Esta é a minha turma. Toda sexta a gente está aqui.
  - speaker: goran
    text: Добредојде! Имам слушнато многу за тебе.
    meaning:
      en: Welcome! I've heard a lot about you.
      pt: Bem-vinda! Já ouvi falar muito de você.
  - speaker: protagonist
    text: Само добри работи, се надевам!
    meaning:
      en: Only good things, I hope!
      pt: Só coisas boas, espero!
  - speaker: goran
    text: Имаш ли пробано ракија од кајсии?
    meaning:
      en: Have you ever tried apricot rakija?
      pt: Você já provou rakija de damasco?
  - speaker: protagonist
    text: Немам пробано. Само од сливи.
    meaning:
      en: I haven't. Only plum.
      pt: Nunca provei. Só de ameixa.
  - speaker: marko
    text: Тогаш мора да пробаш. Келнер, три ракии!
    meaning:
      en: Then you have to try it. Waiter, three rakijas!
      pt: Então tem que provar. Garçom, três rakijas!
  - speaker: protagonist
    text: Само малку! Имам слушнато дека е многу јака.
    meaning:
      en: Just a little! I've heard it's very strong.
      pt: Só um pouco! Ouvi dizer que é muito forte.
  - speaker: goran
    text: Добро си слушнала. На здравје — прв пат!
    meaning:
      en: You heard right. Cheers — the first time!
      pt: Ouviu certo. Saúde — primeira vez!
- type: narrator
  text:
    en: 'Macedonian has a second ''have done'': има + a form in -но, for experience — ''имам слушнато'' (I have heard), ''немам пробано'' (I''ve never tried). It doesn''t change for man or woman.'
    pt: 'O macedônio tem um segundo ''já fiz'': има + uma forma em -но, para experiência — ''имам слушнато'' (já ouvi), ''немам пробано'' (nunca provei). Não muda para homem ou mulher.'
