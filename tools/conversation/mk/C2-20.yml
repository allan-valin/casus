steps:
- type: narrator
  text:
    en: Three families rent a summer house at Ohrid together. Who pays what? Listen to the conversation; you don't need to understand it yet.
    pt: Três famílias alugam juntas uma casa de verão em Ohrid. Quem paga o quê? Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: goran
    text: Викендицата чини илјада евра за една недела.
    meaning:
      en: The cottage costs a thousand euros for a week.
      pt: A casa custa mil euros por uma semana.
  - speaker: marko
    text: Поделба на три дела, по семејство?
    meaning:
      en: Split into three parts, per family?
      pt: Divide em três, por família?
  - speaker: protagonist
    text: Или по глава? Ние сме четворица, Горан е сам.
    meaning:
      en: Or per head? We're four, Goran is alone.
      pt: Ou por pessoa? A gente é em quatro, o Goran está sozinho.
  - speaker: goran
    text: Децата не се бројат!
    meaning:
      en: Children don't count!
      pt: Criança não conta!
  - speaker: marko
    text: За храната — каса. Секој дава по сто евра.
    meaning:
      en: For food — a kitty. Everyone gives a hundred euros.
      pt: Para a comida — uma caixinha. Cada um dá cem euros.
  - speaker: protagonist
    text: Праведно. Чисти сметки, долга љубов.
    meaning:
      en: Fair. Clear accounts, long friendship.
      pt: Justo. Amigos, amigos, negócios à parte.
  - speaker: goran
    text: Се согласивме! А ракијата?
    meaning:
      en: Agreed! And the rakija?
      pt: Combinado! E a rakija?
  - speaker: marko
    text: Ракијата е од дедо — бесплатна!
    meaning:
      en: The rakija's from grandpa — free!
      pt: A rakija é do vô — de graça!
