steps:
- type: narrator
  text:
    en: Local TV wants a foreigner's view of the club's success. Camera, microphone, live. Listen to the conversation; you don't need to understand it yet.
    pt: A TV local quer a visão de uma estrangeira sobre o sucesso do clube. Câmera, microfone, ao vivo. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: novinar
    text: Добровечер, драги гледачи, во живо од спортската сала.
    meaning:
      en: Good evening, dear viewers, live from the sports hall.
      pt: Boa noite, queridos telespectadores, ao vivo do ginásio.
  - speaker: novinar
    text: Изјава за успехот на клубот?
    meaning:
      en: A statement on the club's success?
      pt: Uma declaração sobre o sucesso do clube?
  - speaker: protagonist
    text: Би сакала да истакнам дека успехот не е случаен.
    meaning:
      en: I'd like to emphasise that the success is no accident.
      pt: Gostaria de destacar que o sucesso não é por acaso.
  - speaker: protagonist
    text: Тој е резултат на заедницата — играчи, тренери, родители.
    meaning:
      en: It is the result of the community — players, coaches, parents.
      pt: É resultado da comunidade — jogadores, técnicos, pais.
  - speaker: novinar
    text: Порака до младите?
    meaning:
      en: A message to young people?
      pt: Um recado para os jovens?
  - speaker: protagonist
    text: Не се откажувајте. И јас дојдов без збор македонски.
    meaning:
      en: Don't give up. I too came without a word of Macedonian.
      pt: Não desistam. Eu também cheguei sem uma palavra de macedônio.
  - speaker: novinar
    text: Благодарам.
    meaning:
      en: Thank you.
      pt: Obrigado.
  - speaker: protagonist
    text: Благодарам на поканата.
    meaning:
      en: Thank you for the invitation.
      pt: Obrigada pelo convite.
  - speaker: marko
    text: На телевизија зборуваш како министерка!
    meaning:
      en: On TV you talk like a minister!
      pt: Na TV você fala como ministra!
