steps:
- type: narrator
  text:
    en: A long walk along the Vardar with Bojan. What makes people happy? Listen to the conversation; you don't need to understand it yet.
    pt: Uma caminhada longa pelo Vardar com o Bojan. O que deixa as pessoas felizes? Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: bojan
    text: Што те прави среќна?
    meaning:
      en: What makes you happy?
      pt: O que te deixa feliz?
  - speaker: protagonist
    text: Луѓе кои ги сакам. И работа што има смисла.
    meaning:
      en: People I love. And work that has meaning.
      pt: Pessoas que eu amo. E um trabalho que tenha sentido.
  - speaker: bojan
    text: А парите?
    meaning:
      en: And money?
      pt: E o dinheiro?
  - speaker: protagonist
    text: Парите не се сѐ. Доволно е да имаш доволно.
    meaning:
      en: Money isn't everything. It's enough to have enough.
      pt: Dinheiro não é tudo. Basta ter o suficiente.
  - speaker: bojan
    text: 'Мојот дедо велеше: среќен е тој што е задоволен.'
    meaning:
      en: 'My grandfather used to say: happy is the one who is content.'
      pt: 'Meu avô dizia: feliz é quem está satisfeito.'
  - speaker: protagonist
    text: А ти? Што те прави среќен?
    meaning:
      en: And you? What makes you happy?
      pt: E você? O que te deixa feliz?
  - speaker: bojan
    text: Ова. Прошетка покрај реката, со тебе.
    meaning:
      en: This. A walk by the river, with you.
      pt: Isto. Uma caminhada à beira do rio, com você.
  - speaker: protagonist
    text: Тоа е задоволство и за мене.
    meaning:
      en: That's a pleasure for me too.
      pt: É um prazer para mim também.
