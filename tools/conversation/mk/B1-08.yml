steps:
- type: narrator
  text:
    en: 'Marko hands you an envelope: his sister is getting married, and he will be the кум. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'O Marko entrega um envelope: a irmã dele vai casar, e ele vai ser o кум. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: marko
    text: Ова е покана. Сестра ми се мажи во мај!
    meaning:
      en: This is an invitation. My sister's getting married in May!
      pt: Isto é um convite. Minha irmã vai casar em maio!
  - speaker: protagonist
    text: Честитки! Би сакал да дојдам.
    meaning:
      en: Congratulations! I'd love to come.
      pt: Parabéns! Eu gostaria de ir.
  - speaker: marko
    text: Мора да дојдеш. А јас сум кум!
    meaning:
      en: You have to come. And I'm the кум!
      pt: Tem que vir. E eu sou o кум!
  - speaker: protagonist
    text: Што прави кумот?
    meaning:
      en: What does the кум do?
      pt: O que o кум faz?
  - speaker: marko
    text: Тој е сведок на венчавката. Подоцна ги крштева децата.
    meaning:
      en: He's the witness at the wedding. Later he baptises the children.
      pt: Ele é a testemunha do casamento. Depois batiza os filhos.
  - speaker: protagonist
    text: Значи, врска за цел живот.
    meaning:
      en: So a bond for life.
      pt: Então, um laço para a vida toda.
  - speaker: marko
    text: Точно. Би можел да ми помогнеш со говорот?
    meaning:
      en: Exactly. Could you help me with the speech?
      pt: Isso. Você poderia me ajudar com o discurso?
  - speaker: protagonist
    text: Би сакал, но на македонски?!
    meaning:
      en: I'd like to, but in Macedonian?!
      pt: Gostaria, mas em macedônio?!
