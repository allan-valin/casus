steps:
- type: narrator
  text:
    en: Your Fridays at home. Bojan is home too. Listen to the conversation; you don't need to understand it yet.
    pt: Suas sextas em casa. O Bojan também está em casa. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Бојан, во десет имам видео-повик. Не ме прекинувај.
    meaning:
      en: Bojan, I have a video call at ten. Don't interrupt me.
      pt: Bojan, às dez tenho videochamada. Não me interrompe.
  - speaker: bojan
    text: Добро. А распоредот за денеска?
    meaning:
      en: OK. And today's schedule?
      pt: Tá bom. E a agenda de hoje?
  - speaker: protagonist
    text: Повик, па код, па пауза во еден.
    meaning:
      en: A call, then code, then a break at one.
      pt: Chamada, depois código, depois pausa à uma.
  - speaker: bojan
    text: Во паузата ќе направам ручек за двајца.
    meaning:
      en: In the break I'll make lunch for two.
      pt: Na pausa eu faço almoço para dois.
  - speaker: protagonist
    text: Ах — микрофонот ми беше исклучен цело време!
    meaning:
      en: Ah — my microphone was off the whole time!
      pt: Ah — meu microfone estava desligado o tempo todo!
  - speaker: bojan
    text: Значи, никој не те слушнал?
    meaning:
      en: So nobody heard you?
      pt: Então ninguém te ouviu?
  - speaker: protagonist
    text: Дома тешко се концентрирам. Следниот петок — во канцеларија.
    meaning:
      en: At home I find it hard to concentrate. Next Friday — at the office.
      pt: Em casa é difícil me concentrar. Na próxima sexta — no escritório.
  - speaker: bojan
    text: А ручекот?
    meaning:
      en: And lunch?
      pt: E o almoço?
