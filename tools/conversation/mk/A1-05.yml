- type: prompt
  ask:
    en: 'Say: there it says ''pharmacy''.'
    pt: 'Diga: ali está escrito ''farmácia''.'
  answer:
    speaker: protagonist
    text: Таму пишува „аптека“.
  items:
  - tamu
  - pisuva
  - apteka
- type: narrator
  text:
    en: 'Many visitors think it is Russian. It is not: Macedonian is its own language, close to Bulgarian. The alphabet was fixed in 1945, when North Macedonia was a republic of Yugoslavia; the country
      became independent in 1991.'
    pt: 'Muitos visitantes acham que é russo. Não é: o macedônio é uma língua própria, parecida com o búlgaro. O alfabeto foi fixado em 1945, quando a Macedônia do Norte era uma república da Iugoslávia;
      o país ficou independente em 1991.'
- type: prompt
  ask:
    en: 'Ask: is this Russian?'
    pt: 'Pergunte: isto é russo?'
  answer:
    speaker: protagonist
    text: Ова е руски?
  items:
  - ruski
- type: prompt
  ask:
    en: 'Answer for Dragan: no, this is Macedonian.'
    pt: 'Responda pelo Dragan: não, isto é macedônio.'
  answer:
    speaker: protagonist
    text: Не, ова е македонски.
  items:
  - makedonski
- type: buildup
  item: kirilica
  parts:
  - -лица
  - кирилица
- type: prompt
  ask:
    en: 'Say: Cyrillic.'
    pt: 'Diga: cirílico.'
  answer:
    speaker: protagonist
    text: Кирилица.
  items:
  - kirilica
- type: narrator
  text:
    en: 'Its name has a history too: Greece objected to ''Macedonia'' for decades, and in 2018–19 the Prespa Agreement made it ''North Macedonia''. Bulgaria still argues about the language''s history —
      a reason EU talks have been slow.'
    pt: 'O nome também tem história: a Grécia contestou ''Macedônia'' por décadas, e em 2018–19 o Acordo de Prespa fez dele ''Macedônia do Norte''. A Bulgária ainda discute a história da língua — um motivo
      de as negociações com a UE andarem devagar.'
- type: prompt
  ask:
