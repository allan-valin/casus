steps:
- type: narrator
  text:
    en: In the street every sign is a puzzle. Dragan, at his shop door, reads them with you. Listen to the conversation; you don't need to understand it yet.
    pt: Na rua, cada placa é um enigma. O Dragan, na porta da loja, lê com você. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Извинете, што пишува тука?
    meaning:
      en: Excuse me, what does it say here?
      pt: Com licença, o que está escrito aqui?
  - speaker: dragan
    text: Пишува „затворено“.
    meaning:
      en: It says 'closed'.
      pt: Está escrito 'fechado'.
  - speaker: protagonist
    text: А таму?
    meaning:
      en: And there?
      pt: E ali?
  - speaker: dragan
    text: Таму пишува „аптека“.
    meaning:
      en: There it says 'pharmacy'.
      pt: Ali está escrito 'farmácia'.
  - speaker: protagonist
    text: Ова е руски?
    meaning:
      en: Is this Russian?
      pt: Isto é russo?
  - speaker: dragan
    text: Не, ова е македонски! Кирилица.
    meaning:
      en: No, this is Macedonian! Cyrillic.
      pt: Não, isto é macedônio! Cirílico.
  - speaker: protagonist
    text: Читам многу бавно.
    meaning:
      en: I read very slowly.
      pt: Eu leio muito devagar.
  - speaker: dragan
    text: Нема проблем. Полека.
    meaning:
      en: No problem. Take it easy.
      pt: Sem problema. Com calma.
  - speaker: protagonist
    text: А влез и излез?
    meaning:
      en: And entrance and exit?
      pt: E entrada e saída?
  - speaker: dragan
    text: Влезот е тука, излезот е таму.
    meaning:
      en: The entrance is here, the exit is there.
      pt: A entrada é aqui, a saída é ali.
- type: narrator
  text:
    en: 'Macedonian is written in Cyrillic — but you will also see Latin letters: Albanian, an official language too, uses them, shops write in English, and people often type Macedonian in Latin letters
      on their phones.'
    pt: 'O macedônio se escreve em cirílico — mas você também vai ver letras latinas: o albanês, também língua oficial, usa o alfabeto latino, as lojas escrevem em inglês, e muita gente digita macedônio
      com letras latinas no celular.'
- type: prompt
  ask:
    en: Ask Dragan what it says here.
    pt: Pergunte ao Dragan o que está escrito aqui.
  answer:
    speaker: protagonist
    text: Што пишува тука?
