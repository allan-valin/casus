steps:
- type: narrator
  text:
    en: Ana takes you to the Old Bazaar, the Stara čaršija. You want a present. Listen to the conversation; you don't need to understand it yet.
    pt: A Ana leva você ao Velho Bazar, a Stara čaršija. Você quer um presente. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Ова е Старата чаршија. Многу е стара, од турско време.
    meaning:
      en: This is the Old Bazaar. It's very old, from Ottoman times.
      pt: Esta é a Stara čaršija. É muito antiga, do tempo dos turcos.
  - speaker: protagonist
    text: Сакам да купам подарок.
    meaning:
      en: I'd like to buy a present.
      pt: Quero comprar um presente.
  - speaker: ana
    text: Тука има накит од сребро.
    meaning:
      en: Here there's silver jewellery.
      pt: Aqui tem joias de prata.
  - speaker: protagonist
    text: Ова или она?
    meaning:
      en: This or that?
      pt: Isto ou aquilo?
  - speaker: ana
    text: Она, малото. Поубаво е.
    meaning:
      en: That one, the small one. It's nicer.
      pt: Aquele, o pequeno. É mais bonito.
  - speaker: protagonist
    text: Колку чини малото?
    meaning:
      en: How much is the small one?
      pt: Quanto custa o pequeno?
  - speaker: seller
    text: Илјада и петстотини денари.
    meaning:
      en: One thousand five hundred denars.
      pt: Mil e quinhentos dinares.
  - speaker: protagonist
    text: Скапо е... но убаво. Го земам!
    meaning:
      en: It's expensive... but nice. I'll take it!
      pt: É caro... mas é bonito. Vou levar!
- type: narrator
  text:
    en: 'The Old Bazaar was the Ottoman market: stone streets, mosques, an old inn, craftsmen. North Macedonia was part of the Ottoman Empire for five hundred years, until 1912.'
    pt: 'O Velho Bazar era o mercado otomano: ruas de pedra, mesquitas, uma antiga hospedaria, artesãos. A Macedônia do Norte fez parte do Império Otomano por quinhentos anos, até 1912.'
- type: narrator
  text:
    en: 'With an adjective, ''the'' goes on the adjective, not on the noun: стара чаршија → старата чаршија.'
    pt: 'Com adjetivo, o artigo vai no adjetivo, não no substantivo: стара чаршија → старата чаршија (a velha čaršija).'
