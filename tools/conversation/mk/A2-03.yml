steps:
- type: narrator
  text:
    en: A check-up for work with Dr Petrovska, your family doctor. Listen to the conversation; you don't need to understand it yet.
    pt: Um check-up do trabalho com a doutora Petrovska, sua médica de família. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: doktorka
    text: Седнете. Прво притисокот.
    meaning:
      en: Sit down. First, the blood pressure.
      pt: Sente-se. Primeiro, a pressão.
  - speaker: protagonist
    text: Дали е сè во ред?
    meaning:
      en: Is everything all right?
      pt: Está tudo certo?
  - speaker: doktorka
    text: Притисокот е нормален. И срцето е добро.
    meaning:
      en: Your blood pressure is normal. And your heart is fine.
      pt: A pressão está normal. E o coração está bem.
  - speaker: protagonist
    text: А крвта?
    meaning:
      en: And the blood test?
      pt: E o exame de sangue?
  - speaker: doktorka
    text: Резултатите ќе бидат готови утре.
    meaning:
      en: The results will be ready tomorrow.
      pt: Os resultados ficam prontos amanhã.
  - speaker: protagonist
    text: Што треба да правам?
    meaning:
      en: What should I do?
      pt: O que eu devo fazer?
  - speaker: doktorka
    text: Јадете здраво и шетајте секој ден.
    meaning:
      en: Eat healthily and walk every day.
      pt: Coma de forma saudável e caminhe todo dia.
  - speaker: protagonist
    text: Секој ден? Добро, ќе шетам до работа.
    meaning:
      en: Every day? All right, I'll walk to work.
      pt: Todo dia? Está bem, vou a pé para o trabalho.
- type: narrator
  text:
