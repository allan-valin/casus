steps:
- type: narrator
  text:
    en: You want a table for the flat. Mrs Stojanovska helps you measure the room. Listen to the conversation; you don't need to understand it yet.
    pt: Você quer uma mesa para o apartamento. A senhora Stojanovska ajuda a medir o quarto. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Сакате нова маса?
    meaning:
      en: You want a new table?
      pt: A senhora quer uma mesa nova?
  - speaker: protagonist
    text: Да. Колку е широка собата?
    meaning:
      en: Yes. How wide is the room?
      pt: Sim. Qual é a largura do quarto?
  - speaker: vera
    text: Три метри.
    meaning:
      en: Three metres.
      pt: Três metros.
  - speaker: protagonist
    text: А колку е долга?
    meaning:
      en: And how long is it?
      pt: E o comprimento?
  - speaker: vera
    text: Четири метри и пол.
    meaning:
      en: Four and a half metres.
      pt: Quatro metros e meio.
  - speaker: protagonist
    text: Тркалезна маса или квадратна?
    meaning:
      en: A round table or a square one?
      pt: Mesa redonda ou quadrada?
  - speaker: vera
    text: Тркалезна. Има повеќе место.
    meaning:
      en: Round. There's more space.
      pt: Redonda. Sobra mais espaço.
  - speaker: protagonist
    text: Добро, тркалезна!
    meaning:
      en: All right, round!
      pt: Está bem, redonda!
- type: narrator
  text:
    en: '''Колку е …?'' asks how wide, how long, how much: ''Колку е широка собата?'''
    pt: '''Колку е …?'' pergunta a largura, o comprimento, o preço: ''Колку е широка собата?'' (qual a largura do quarto?)'
