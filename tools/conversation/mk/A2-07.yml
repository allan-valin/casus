- type: narrator
  text:
    en: The fear comes from the wars of the 1990s in the former Yugoslavia. North Macedonia left Yugoslavia peacefully in 1991; a short armed conflict in 2001 ended with the Ohrid Agreement. Today violent
      crime is low; the real danger is the traffic.
    pt: O medo vem das guerras dos anos noventa na antiga Iugoslávia. A Macedônia do Norte saiu da Iugoslávia em paz, em 1991; um conflito armado curto em 2001 terminou com o Acordo de Ohrid. Hoje a criminalidade
      violenta é baixa; o perigo de verdade é o trânsito.
