steps:
- type: narrator
  text:
    en: Marko asks what people at home think of Skopje. Listen to the conversation; you don't need to understand it yet.
    pt: O Marko pergunta o que o pessoal no Brasil pensa de Skopje. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Што мислат твоите во Бразил за Скопје?
    meaning:
      en: What do your folks in Brazil think of Skopje?
      pt: O que o seu pessoal no Brasil acha de Skopje?
  - speaker: protagonist
    text: Мајка ми мислеше дека Балканот е опасен.
    meaning:
      en: My mother thought the Balkans were dangerous.
      pt: Minha mãe achava que os Bálcãs eram perigosos.
  - speaker: marko
    text: Опасен? Скопје е побезбедно од многу градови.
    meaning:
      en: Dangerous? Skopje is safer than many cities.
      pt: Perigoso? Skopje é mais seguro que muitas cidades.
  - speaker: protagonist
    text: Да, всушност тука се чувствувам безбедно.
    meaning:
      en: Yes, actually I feel safe here.
      pt: É, na verdade aqui eu me sinto segura.
  - speaker: protagonist
    text: Ноќе шетам сама, со телефон в рака.
    meaning:
      en: At night I walk alone, phone in hand.
      pt: À noite ando sozinha, com o celular na mão.
  - speaker: marko
    text: Има и криминал, како секаде, но малку.
    meaning:
      en: There is crime, like everywhere, but not much.
      pt: Tem crime, como em todo lugar, mas pouco.
  - speaker: protagonist
    text: Во Сао Паоло ноќе не шетам така.
    meaning:
      en: In São Paulo I don't walk like that at night.
      pt: Em São Paulo não ando assim à noite.
  - speaker: marko
    text: Тоа е стара предрасуда, од деведесеттите.
    meaning:
      en: That's an old prejudice, from the nineties.
      pt: Isso é preconceito antigo, dos anos noventa.
- type: narrator
  text:
    en: 'Comparisons add по-: безбедно → побезбедно (safer), убаво → поубаво. ''Than'' is ''од'': побезбедно од многу градови.'
    pt: 'Comparações levam по-: безбедно → побезбедно (mais seguro), убаво → поубаво. ''Do que'' é ''од'': побезбедно од многу градови.'
