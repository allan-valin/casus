- type: narrator
  text:
    en: 'Prefixes change a verb''s meaning and usually make it ''completed'': пише (writes) → препише (rewrites), допише (adds), потпише (signs), напише (writes, finished).'
    pt: 'Prefixos mudam o sentido do verbo e normalmente o tornam ''completo'': пише (escreve) → препише (reescreve), допише (acrescenta), потпише (assina), напише (escreve, até o fim).'
