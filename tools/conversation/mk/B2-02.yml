steps:
- type: narrator
  text:
    en: Your first CV in Macedonian. Sara reads it over your shoulder. Listen to the conversation; you don't need to understand it yet.
    pt: Seu primeiro currículo em macedônio. A Sara lê por cima do seu ombro. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sara
    text: Ова е твојата биографија? Многу е кратка.
    meaning:
      en: Is this your CV? It's very short.
      pt: Esse é o seu currículo? Está muito curto.
  - speaker: protagonist
    text: Пет години работев во Сао Паоло. Тоа е сѐ.
    meaning:
      en: I worked in São Paulo for five years. That's all.
      pt: Trabalhei cinco anos em São Paulo. É só isso.
  - speaker: sara
    text: Допиши кој факултет го заврши.
    meaning:
      en: Add which faculty you graduated from.
      pt: Acrescenta de que faculdade você se formou.
  - speaker: protagonist
    text: Завршив информатика, во 2016.
    meaning:
      en: I graduated in computer science, in 2016.
      pt: Me formei em computação, em 2016.
  - speaker: sara
    text: А вештини? Јазици?
    meaning:
      en: And skills? Languages?
      pt: E habilidades? Línguas?
  - speaker: protagonist
    text: Португалски, англиски течно. Македонски — основно.
    meaning:
      en: Portuguese, English fluently. Macedonian — basic.
      pt: Português e inglês fluente. Macedônio — básico.
  - speaker: sara
    text: Основно? Ти зборуваш подобро! Препиши го тоа.
    meaning:
      en: Basic? You speak better than that! Rewrite that.
      pt: Básico? Você fala melhor que isso! Reescreve isso.
  - speaker: protagonist
    text: 'Добро: „добро“. И потоа го потпишувам?'
    meaning:
      en: 'All right: ''good''. And then I sign it?'
      pt: 'Tá bom: ''bom''. E depois eu assino?'
  - speaker: sara
    text: Потпиши и прати!
    meaning:
      en: Sign and send!
      pt: Assina e manda!
- type: prompt
