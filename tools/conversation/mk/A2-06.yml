steps:
- type: narrator
  text:
    en: January. The street outside is icy. Mrs Stojanovska calls you in for tea. Listen to the conversation; you don't need to understand it yet.
    pt: Janeiro. A rua está congelada. A senhora Stojanovska chama você para um chá. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Внимавајте, има мраз на улицата!
    meaning:
      en: Careful, there's ice on the street!
      pt: Cuidado, tem gelo na rua!
  - speaker: protagonist
    text: Мраз! Во Сао Паоло никогаш нема мраз.
    meaning:
      en: Ice! In São Paulo there's never ice.
      pt: Gelo! Em São Paulo nunca tem gelo.
  - speaker: vera
    text: Утре ќе биде потопло. Мразот ќе се стопи.
    meaning:
      en: Tomorrow will be warmer. The ice will melt.
      pt: Amanhã vai estar mais quente. O gelo vai derreter.
  - speaker: protagonist
    text: Сега се топи малку, на сонце.
    meaning:
      en: It's melting a bit now, in the sun.
      pt: Agora está derretendo um pouco, no sol.
  - speaker: vera
    text: Влезете. Водата веќе врие — ја гледате пареата?
    meaning:
      en: Come in. The water's already boiling — see the steam?
      pt: Entre. A água já está fervendo — está vendo o vapor?
  - speaker: protagonist
    text: Да. Убаво е топло тука.
    meaning:
      en: Yes. It's nice and warm here.
      pt: Sim. Está quentinho aqui.
  - speaker: vera
    text: Знаете ли дека Охридското Езеро е толку чисто?
    meaning:
      en: Do you know the Ohrid lake is so clean?
      pt: O senhor sabia que o lago de Ohrid é tão limpo?
  - speaker: protagonist
    text: Колку чисто?
    meaning:
      en: How clean?
      pt: Limpo quanto?
  - speaker: vera
    text: Се гледа дното, дваесет метри!
    meaning:
      en: You can see the bottom, twenty metres down!
      pt: Dá para ver o fundo, a vinte metros!
