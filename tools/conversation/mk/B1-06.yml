steps:
- type: narrator
  text:
    en: Mrs Stojanovska waves the electricity bill at you on the stairs. Listen to the conversation; you don't need to understand it yet.
    pt: A senhora Stojanovska balança a conta de luz na sua frente, na escada. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Ја видовте ли сметката за струја? Двојно поскапа!
    meaning:
      en: Did you see the electricity bill? Twice as expensive!
      pt: O senhor viu a conta de luz? O dobro do preço!
  - speaker: protagonist
    text: Зошто толку многу?
    meaning:
      en: Why so much?
      pt: Por que tanto?
  - speaker: vera
    text: Затоа што цената на енергијата порасна.
    meaning:
      en: Because the price of energy went up.
      pt: Porque o preço da energia subiu.
  - speaker: vera
    text: И бидејќи е зима, сите грееме на струја.
    meaning:
      en: And since it's winter, everyone heats with electricity.
      pt: E como é inverno, todo mundo esquenta a casa com luz.
  - speaker: protagonist
    text: Треба да штедиме. Бојлерот ќе го палам само навечер.
    meaning:
      en: We need to save. I'll only turn the water heater on in the evening.
      pt: A gente precisa economizar. Vou ligar o boiler só à noite.
  - speaker: vera
    text: Синот во Германија има сончеви панели.
    meaning:
      en: My son in Germany has solar panels.
      pt: Meu filho na Alemanha tem painéis solares.
  - speaker: protagonist
    text: Тука има уште повеќе сонце!
    meaning:
      en: There's even more sun here!
      pt: Aqui tem ainda mais sol!
  - speaker: vera
    text: Да, ама панелите се скапи.
    meaning:
      en: Yes, but the panels are expensive.
      pt: Sim, mas os painéis são caros.
