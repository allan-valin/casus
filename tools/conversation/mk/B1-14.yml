steps:
- type: narrator
  text:
    en: The morning after the wedding. Your head hurts; Sara laughs. Listen to the conversation; you don't need to understand it yet.
    pt: A manhã depois do casamento. Sua cabeça dói; a Sara ri. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sara
    text: Добро утро! Како е главата?
    meaning:
      en: Good morning! How's the head?
      pt: Bom dia! Como está a cabeça?
  - speaker: protagonist
    text: Ужас. Имам главоболка.
    meaning:
      en: Terrible. I have a headache.
      pt: Horrível. Estou com dor de cabeça.
  - speaker: sara
    text: 'Ти велев: не мешај вино и ракија!'
    meaning:
      en: 'I told you: don''t mix wine and rakija!'
      pt: 'Eu te disse: não mistura vinho e rakija!'
  - speaker: protagonist
    text: Да знаев, немаше да пиев толку.
    meaning:
      en: If I'd known, I wouldn't have drunk so much.
      pt: Se eu soubesse, não teria bebido tanto.
  - speaker: sara
    text: Да си легнеше порано, ќе беше подобро.
    meaning:
      en: If you'd gone to bed earlier, it would have been better.
      pt: Se você tivesse ido dormir mais cedo, teria sido melhor.
  - speaker: protagonist
    text: Да не беше орото, ќе си легнев во полноќ!
    meaning:
      en: If it hadn't been for the oro, I'd have gone to bed at midnight!
      pt: Se não fosse o oro, eu teria ido dormir à meia-noite!
  - speaker: sara
    text: Пиј вода. Многу вода.
    meaning:
      en: Drink water. Lots of water.
      pt: Bebe água. Muita água.
  - speaker: protagonist
    text: Никогаш повеќе... до следната свадба.
    meaning:
      en: Never again... until the next wedding.
      pt: Nunca mais... até o próximo casamento.
- type: narrator
  text:
    en: 'Unreal past: да + the imperfect, then ќе + the imperfect. ''Да знаев, ќе дојдев'' — if I had known, I would have come. Negative: ''немаше да'' — немаше да пиев, I wouldn''t have drunk.'
    pt: 'Passado irreal: да + imperfeito, depois ќе + imperfeito. ''Да знаев, ќе дојдев'' — se eu soubesse, teria vindo. Negativo: ''немаше да'' — немаше да пиев, não teria bebido.'
