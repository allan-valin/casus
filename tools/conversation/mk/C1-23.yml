steps:
- type: narrator
  text:
    en: Marko's son mixes Macedonian and Portuguese, the words you taught him. You and Bojan discuss your own future children. Listen to the conversation; you don't need to understand it yet.
    pt: O filho do Marko mistura macedônio e português, as palavras que você ensinou. Você e o Bojan conversam sobre os filhos que vocês vão ter. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: bojan
    text: Слушна? Синот на Марко рече „мама, água!“ Меша.
    meaning:
      en: Did you hear? Marko's son said 'mama, água!' He mixes.
      pt: Ouviu? O filho do Marko disse 'mama, água!' Ele mistura.
  - speaker: protagonist
    text: Тоа е нормално. Двојазичните деца мешаат.
    meaning:
      en: That's normal. Bilingual children mix.
      pt: É normal. Criança bilíngue mistura.
  - speaker: bojan
    text: А нашите? Нема да се збунат?
    meaning:
      en: And ours? Won't they get confused?
      pt: E os nossos? Não vão se confundir?
  - speaker: protagonist
    text: Напротив. Тоа е предност. Еден родител — еден јазик.
    meaning:
      en: On the contrary. It's an advantage. One parent, one language.
      pt: Pelo contrário. É uma vantagem. Um pai, uma língua.
  - speaker: bojan
    text: Значи ти португалски, јас македонски.
    meaning:
      en: So you Portuguese, me Macedonian.
      pt: Então você português, eu macedônio.
  - speaker: protagonist
    text: Дома португалски, надвор македонски. И баба од Бразил ќе им го научи остатокот.
    meaning:
      en: Portuguese at home, Macedonian outside. And grandma from Brazil will teach them the rest.
      pt: Em casa português, na rua macedônio. E a avó do Brasil ensina o resto.
  - speaker: bojan
    text: А мене кој ќе ми го научи португалскиот?
    meaning:
      en: And who'll teach me Portuguese?
      pt: E quem vai me ensinar português?
  - speaker: protagonist
    text: 'Јас ќе ти го научам. Почнуваме денеска: „Bom dia“!'
    meaning:
      en: 'I''ll teach it to you. We start today: ''Bom dia''!'
      pt: 'Eu te ensino. A gente começa hoje: ''Bom dia''!'
