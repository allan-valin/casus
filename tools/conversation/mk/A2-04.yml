steps:
- type: narrator
  text:
    en: Your salary needs a Macedonian bank account. Listen to the conversation; you don't need to understand it yet.
    pt: O salário precisa de uma conta num banco macedônio. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Добар ден. Ми треба сметка во банка.
    meaning:
      en: Good morning. I need a bank account.
      pt: Bom dia. Preciso de uma conta no banco.
  - speaker: sluzbenicka
    text: Ви треба пасош и договор за работа.
    meaning:
      en: You need your passport and work contract.
      pt: O senhor precisa do passaporte e do contrato de trabalho.
  - speaker: protagonist
    text: Еве ги.
    meaning:
      en: Here they are.
      pt: Aqui estão.
  - speaker: sluzbenicka
    text: Потпишете тука. И тука.
    meaning:
      en: Sign here. And here.
      pt: Assine aqui. E aqui.
  - speaker: protagonist
    text: Кога ќе ја добијам картичката?
    meaning:
      en: When will I get the card?
      pt: Quando vou receber o cartão?
  - speaker: sluzbenicka
    text: За една недела. Ќе ви пратиме порака.
    meaning:
      en: In a week. We'll send you a message.
      pt: Em uma semana. Vamos mandar uma mensagem.
  - speaker: protagonist
    text: А апликацијата?
    meaning:
      en: And the app?
      pt: E o aplicativo?
  - speaker: sluzbenicka
    text: Апликацијата е бесплатна.
    meaning:
      en: The app is free.
      pt: O aplicativo é gratuito.
