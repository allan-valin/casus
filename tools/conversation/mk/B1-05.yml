steps:
- type: narrator
  text:
    en: Ana saw someone waiting for you outside the office. Listen to the conversation; you don't need to understand it yet.
    pt: A Ana viu alguém esperando você na frente do escritório. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Кој е тој што те чека пред зградата?
    meaning:
      en: Who's that waiting for you outside the building?
      pt: Quem é aquele que está te esperando na frente do prédio?
  - speaker: protagonist
    text: Бојан. Се гледаме веќе еден месец.
    meaning:
      en: Bojan. We've been seeing each other for a month.
      pt: O Bojan. A gente está saindo faz um mês.
  - speaker: ana
    text: Значи сте во врска!
    meaning:
      en: So you're together!
      pt: Então vocês estão namorando!
  - speaker: protagonist
    text: Да, тој ми е дечко. Кога излегуваме, секогаш ги носи и пријателите.
    meaning:
      en: Yes, he's my boyfriend. When we go out he always brings his friends too.
      pt: Sim, ele é meu namorado. Quando a gente sai, ele sempre leva os amigos.
  - speaker: ana
    text: Тоа е добар знак. Тука пријателите и семејството ги запознаваш рано.
    meaning:
      en: That's a good sign. Here you meet the friends and family early.
      pt: É um bom sinal. Aqui você conhece os amigos e a família cedo.
  - speaker: protagonist
    text: Во недела, откако ќе ручаме, ме носи кај родителите.
    meaning:
      en: On Sunday, after we have lunch, he's taking me to his parents.
      pt: No domingo, depois do almoço, ele vai me levar na casa dos pais.
  - speaker: ana
    text: Веќе! Сериозно е.
    meaning:
      en: Already! It's serious.
      pt: Já! É sério.
  - speaker: bojan
    text: Чао, Ана! Додека вие зборувате, јас ќе земам кафе.
    meaning:
      en: Hi, Ana! While you two talk, I'll get a coffee.
      pt: Oi, Ana! Enquanto vocês conversam, vou pegar um café.
