steps:
- type: narrator
  text:
    en: A weekend at Marko's grandparents' village near Kičevo. Listen to the conversation; you don't need to understand it yet.
    pt: Um fim de semana na aldeia dos avós do Marko, perto de Kičevo. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: dedo-c
    text: Ова е бавчата. Домати, пиперки, сè домашно.
    meaning:
      en: This is the garden. Tomatoes, peppers, everything home-grown.
      pt: Esta é a horta. Tomate, pimentão, tudo caseiro.
  - speaker: protagonist
    text: А кокошките?
    meaning:
      en: And the hens?
      pt: E as galinhas?
  - speaker: dedo-c
    text: Свежи јајца секое утро. Марко, дај му ги јајцата на гостинот!
    meaning:
      en: Fresh eggs every morning. Marko, give the eggs to our guest!
      pt: Ovos frescos toda manhã. Marko, dá os ovos para a visita!
  - speaker: marko
    text: Дедо, ќе му ги спакувам за Скопје.
    meaning:
      en: Grandpa, I'll pack them for him for Skopje.
      pt: Vô, vou embalar para ele levar para Skopje.
  - speaker: protagonist
    text: Колку луѓе живеат во селото?
    meaning:
      en: How many people live in the village?
      pt: Quantas pessoas moram na aldeia?
  - speaker: dedo-c
    text: Дваесетина. Само старци. Многу празни куќи.
    meaning:
      en: About twenty. Only old people. Lots of empty houses.
      pt: Umas vinte. Só velhos. Muita casa vazia.
  - speaker: protagonist
    text: Но каква тишина! Тоа не може да се купи.
    meaning:
      en: But what silence! That can't be bought.
      pt: Mas que silêncio! Isso não se compra.
  - speaker: dedo-c
    text: Ќе дојдете пак? Ракијата ќе ве чека.
    meaning:
      en: You'll come again? The rakija will be waiting.
      pt: Vocês voltam? A rakija vai estar esperando.
