steps:
- type: narrator
  text:
    en: Monday. Ana's weekend plans fell apart, and so did yours. Listen to the conversation; you don't need to understand it yet.
    pt: Segunda. Os planos de fim de semana da Ana deram errado, e os seus também. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Ќе одев во Струга за викендот, ама врнеше цело време.
    meaning:
      en: I was going to go to Struga for the weekend, but it rained the whole time.
      pt: Eu ia para Struga no fim de semana, mas choveu o tempo todo.
  - speaker: protagonist
    text: И мојот план пропадна.
    meaning:
      en: My plan fell through too.
      pt: O meu plano também furou.
  - speaker: ana
    text: Што ќе правеше?
    meaning:
      en: What were you going to do?
      pt: O que você ia fazer?
  - speaker: protagonist
    text: Со Бојан ќе гледавме натпревар, ама тој се разболе.
    meaning:
      en: Bojan and I were going to watch a match, but he got ill.
      pt: Eu e o Bojan íamos ver um jogo, mas ele ficou doente.
  - speaker: ana
    text: И што направи наместо тоа?
    meaning:
      en: And what did you do instead?
      pt: E o que você fez em vez disso?
  - speaker: protagonist
    text: Спиев. Дванаесет часа!
    meaning:
      en: I slept. Twelve hours!
      pt: Dormi. Doze horas!
  - speaker: ana
    text: Не е лош план. Следниот викенд — Струга, заедно?
    meaning:
      en: Not a bad plan. Next weekend — Struga, together?
      pt: Não é um plano ruim. No próximo fim de semana — Struga, juntas?
  - speaker: protagonist
    text: Ако не врне!
    meaning:
      en: If it doesn't rain!
      pt: Se não chover!
- type: narrator
  text:
    en: '''Was going to'': ќе + the imperfect — ќе одев (I was going to go), ќе гледавме (we were going to watch). The same form says ''would have'' in unreal conditions.'
    pt: '''Ia fazer'': ќе + o imperfeito — ќе одев (eu ia), ќе гледавме (a gente ia assistir). A mesma forma diz ''teria'' nas condições irreais.'
