steps:
- type: narrator
  text:
    en: Monday at the office. Ana asks about your weekend. Listen to the conversation; you don't need to understand it yet.
    pt: Segunda no escritório. A Ana pergunta do seu fim de semana. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Здраво! Што правеше за викендот?
    meaning:
      en: Hi! What did you do at the weekend?
      pt: Oi! O que você fez no fim de semana?
  - speaker: protagonist
    text: Во сабота отидов на Водно со Марко.
    meaning:
      en: On Saturday I went up Vodno with Marko.
      pt: No sábado fui ao Vodno com o Marko.
  - speaker: ana
    text: Убаво! А во недела?
    meaning:
      en: Nice! And on Sunday?
      pt: Que bom! E no domingo?
  - speaker: protagonist
    text: Во недела бев дома. А вчера видов филм.
    meaning:
      en: On Sunday I was at home. And yesterday I saw a film.
      pt: No domingo fiquei em casa. E ontem vi um filme.
  - speaker: ana
    text: Кој филм?
    meaning:
      en: Which film?
      pt: Que filme?
  - speaker: protagonist
    text: „Медена земја“. Македонски филм.
    meaning:
      en: '''Honeyland''. A Macedonian film.'
      pt: '''Honeyland''. Um filme macedônio.'
  - speaker: ana
    text: Го видов и јас! Убав е, нели?
    meaning:
      en: I saw it too! It's good, isn't it?
      pt: Eu também vi! É lindo, né?
  - speaker: protagonist
    text: Многу! Но не разбрав сè.
    meaning:
      en: Very! But I didn't understand everything.
      pt: Muito! Mas não entendi tudo.
  - speaker: ana
    text: Нормално. Таа зборува стар дијалект.
    meaning:
      en: Naturally. She speaks an old dialect.
      pt: Normal. Ela fala um dialeto antigo.
- type: narrator
  text:
    en: 'To tell what you did, Macedonian has a past tense for finished actions. For ''I'', it ends in -ов, -ав or -ив: отидов (I went), видов (I saw), разбрав (I understood). ''I was'' is ''бев''.'
    pt: 'Para contar o que você fez, o macedônio tem um passado para ações terminadas. Com ''eu'', termina em -ов, -ав ou -ив: отидов (fui), видов (vi), разбрав (entendi). ''Eu estava'' é ''бев''.'
