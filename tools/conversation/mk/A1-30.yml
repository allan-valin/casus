steps:
- type: narrator
  text:
    en: Marko invites you to basketball, then a beer. Everything from A1 comes back. Listen to the conversation; you don't need to understand it yet.
    pt: O Marko chama você para jogar basquete, e depois uma cerveja. Tudo do A1 volta. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Играш ли кошарка?
    meaning:
      en: Do you play basketball?
      pt: Você joga basquete?
  - speaker: protagonist
    text: Малку. Во Бразил играм фудбал.
    meaning:
      en: A little. In Brazil I play football.
      pt: Um pouco. No Brasil eu jogo futebol.
  - speaker: marko
    text: Фудбал, секако! Ајде, играме!
    meaning:
      en: Football, of course! Come on, let's play!
      pt: Futebol, claro! Bora, vamos jogar!
  - speaker: marko
    text: Трчај! Скокни!
    meaning:
      en: Run! Jump!
      pt: Corre! Pula!
  - speaker: protagonist
    text: Не можам, ти си многу висок!
    meaning:
      en: I can't, you're very tall!
      pt: Não dá, você é muito alto!
  - speaker: marko
    text: А ти си брз и силен.
    meaning:
      en: And you're fast and strong.
      pt: E você é rápido e forte.
  - speaker: protagonist
    text: Уф, ме боли ногата.
    meaning:
      en: Ugh, my leg hurts.
      pt: Ai, minha perna dói.
  - speaker: marko
    text: Доста е. Пиво?
    meaning:
      en: That's enough. A beer?
      pt: Chega. Uma cerveja?
  - speaker: protagonist
    text: Може! Ајде!
    meaning:
      en: Sure! Let's go!
      pt: Pode ser! Bora!
- type: narrator
  text:
