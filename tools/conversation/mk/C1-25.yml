steps:
- type: narrator
  text:
    en: Your application was rejected for a missing stamp. You write an appeal with Professor Ilievska's help. Listen to the conversation; you don't need to understand it yet.
    pt: Seu pedido foi negado por falta de um carimbo. Você escreve um recurso com a ajuda da professora Ilievska. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Барањето ми е одбиено. Недостасувал печат.
    meaning:
      en: My application was rejected. A stamp was missing, they say.
      pt: Meu pedido foi indeferido. Faltava um carimbo, dizem.
  - speaker: profesorka
    text: Тогаш пишуваме жалба против решението, во законски рок.
    meaning:
      en: Then we write an appeal against the decision, within the legal deadline.
      pt: Então escrevemos um recurso contra a decisão, dentro do prazo legal.
  - speaker: protagonist
    text: Како почнува?
    meaning:
      en: How does it start?
      pt: Como começa?
  - speaker: profesorka
    text: „Против решението бр. ... поднесувам жалба.“
    meaning:
      en: '''Against decision no. ... I lodge an appeal.'''
      pt: '''Contra a decisão nº ... apresento recurso.'''
  - speaker: protagonist
    text: „Во прилог доставувам документ со печат.“
    meaning:
      en: '''I enclose the document with the stamp.'''
      pt: '''Segue em anexo o documento com carimbo.'''
  - speaker: profesorka
    text: 'Добро. И: „Ве молам решението да го преиспитате.“'
    meaning:
      en: 'Good. And: ''I ask you to reconsider the decision.'''
      pt: 'Bom. E: ''Peço que reconsiderem a decisão.'''
  - speaker: protagonist
    text: Потоа — своерачен потпис?
    meaning:
      en: Then — a handwritten signature?
      pt: Depois — assinatura de próprio punho?
  - speaker: profesorka
    text: Да, и испратете ја препорачано. Секогаш препорачано.
    meaning:
      en: Yes, and send it by registered mail. Always registered.
      pt: Sim, e mande registrado. Sempre registrado.
