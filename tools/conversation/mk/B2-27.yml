steps:
- type: narrator
  text:
    en: Sunday morning, Vera still buys a paper newspaper. She reads you a column. Listen to the conversation; you don't need to understand it yet.
    pt: Domingo de manhã, a Vera ainda compra jornal de papel. Ela lê uma coluna para você. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Весникот го купувам секоја недела. Слушај ја оваа колумна.
    meaning:
      en: I buy the newspaper every Sunday. Listen to this column.
      pt: O jornal eu compro todo domingo. Escuta esta coluna.
  - speaker: protagonist
    text: Кој е авторот?
    meaning:
      en: Who's the author?
      pt: Quem é o autor?
  - speaker: vera
    text: Еден стар новинар. Него го читам веќе триесет години.
    meaning:
      en: An old journalist. Him I've been reading for thirty years.
      pt: Um jornalista velho. Ele eu leio há trinta anos.
  - speaker: protagonist
    text: Јас вестите ги читам на интернет, на портали.
    meaning:
      en: I read the news online, on news sites.
      pt: Eu leio as notícias na internet, em portais.
  - speaker: vera
    text: Порталите ги мразам — премногу реклами.
    meaning:
      en: News sites I hate — too many ads.
      pt: Os portais eu detesto — anúncio demais.
  - speaker: protagonist
    text: Има и претплата, без реклами.
    meaning:
      en: There's a subscription too, without ads.
      pt: Também tem assinatura, sem anúncio.
  - speaker: vera
    text: Не. Ја сакам хартијата. И крстозборот!
    meaning:
      en: No. I love the paper. And the crossword!
      pt: Não. Eu gosto do papel. E das palavras cruzadas!
  - speaker: protagonist
    text: Крстозборот ќе го решиме заедно.
    meaning:
      en: We'll do the crossword together.
      pt: As palavras cruzadas a gente resolve junto.
