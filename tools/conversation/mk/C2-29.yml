- type: narrator
  text:
    en: Vera's last Sunday lunch in the old building. The whole staircase comes. Listen to the conversation; you don't need to understand it yet.
    pt: O último almoço de domingo da Vera no prédio antigo. A escada inteira vem. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Ова е последното кафе во овој стан.
    meaning:
      en: This is the last coffee in this flat.
      pt: Este é o último café neste apartamento.
  - speaker: protagonist
    text: Не збогум, Вера — довидување.
    meaning:
      en: Not farewell, Vera — see you again.
      pt: Não é adeus, Vera — é até logo.
  - speaker: vera
    text: Довидување тогаш. Ќе ми недостигаш.
    meaning:
      en: See you again, then. I'll miss you.
      pt: Até logo, então. Vou sentir sua falta.
  - speaker: protagonist
    text: Од првиот ден ме научи сѐ — Повелете, Пријатно, промаја...
    meaning:
      en: From the first day you taught me everything — Повелете, Пријатно, the draft...
      pt: Desde o primeiro dia você me ensinou tudo — Повелете, Пријатно, a corrente de ar...
  - speaker: vera
    text: Ти ме научи да пијам кафе без шеќер!
    meaning:
      en: You taught me to drink coffee without sugar!
      pt: Você me ensinou a tomar café sem açúcar!
  - speaker: marko
    text: Беше чест да бидеме ваши соседи.
    meaning:
      en: It was an honour to be your neighbours.
      pt: Foi uma honra ser seus vizinhos.
  - speaker: vera
    text: Врати се често. Вратата е отворена — кај ќерка ми.
    meaning:
      en: Come back often. The door is open — at my daughter's.
      pt: Volte sempre. A porta está aberta — na casa da minha filha.
  - speaker: protagonist
    text: Да си жива и здрава, Вера.
    meaning:
      en: Stay alive and well, Vera.
      pt: Fica com saúde, Vera.
