steps:
- type: narrator
  text:
    en: You run your own team now. Asking, not ordering — in Macedonian. Listen to the conversation; you don't need to understand it yet.
    pt: Agora você comanda sua própria equipe. Pedir, não mandar — em macedônio. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Дарко, дојди за момент, те молам.
    meaning:
      en: Darko, come here a moment, please.
      pt: Darko, vem aqui um momento, por favor.
  - speaker: darko
    text: Повели?
    meaning:
      en: Yes?
      pt: Pois não?
  - speaker: protagonist
    text: Ќе можеш ли да го погледнеш кодот на Ана, ако не ти е тешко?
    meaning:
      en: Would you be able to look at Ana's code, if it's no trouble?
      pt: Você conseguiria dar uma olhada no código da Ana, se não for incômodo?
  - speaker: darko
    text: Секако. До кога?
    meaning:
      en: Of course. By when?
      pt: Claro. Até quando?
  - speaker: protagonist
    text: Би било добро до петок. Погледни го еднаш — немој да го гледаш цел ден.
    meaning:
      en: By Friday would be good. Look at it once — don't sit on it all day.
      pt: Até sexta seria bom. Dá uma olhada — não fica olhando o dia todo.
  - speaker: darko
    text: Разбрано, шефице.
    meaning:
      en: Understood, boss.
      pt: Entendido, chefe.
  - speaker: protagonist
    text: Немој „шефице“! Благодарам однапред.
    meaning:
      en: Don't call me 'boss'! Thanks in advance.
      pt: Nada de 'chefe'! Obrigada desde já.
  - speaker: ana
    text: А ако не стигнам?
    meaning:
      en: And if I don't make it?
      pt: E se eu não der conta?
  - speaker: protagonist
    text: Немој да се секираш. Ќе најдеме решение.
    meaning:
      en: Don't worry. We'll find a solution.
      pt: Não se preocupa. A gente encontra uma solução.
