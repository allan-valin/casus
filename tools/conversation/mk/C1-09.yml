    en: For a small accident with no injuries, both drivers fill in the European accident report (европски записник) and sign it; call the police if someone is hurt or you disagree. Check your own insurer's
      rules.
    pt: Num acidente pequeno sem feridos, os dois motoristas preenchem a declaração amigável europeia (европски записник) e assinam; chame a polícia se alguém se machucou ou se vocês não concordam. Confira
      as regras da sua seguradora.
