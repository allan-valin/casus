steps:
- type: narrator
  text:
    en: A car taps your bumper at a traffic light. Nobody is hurt. Listen to the conversation; you don't need to understand it yet.
    pt: Um carro bate no seu para-choque no semáforo. Ninguém se machuca. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sosed2
    text: Извинете! Дали сте повредени?
    meaning:
      en: Sorry! Are you hurt?
      pt: Desculpe! A senhora se machucou?
  - speaker: protagonist
    text: Не, добро сум. Но браникот...
    meaning:
      en: No, I'm fine. But the bumper...
      pt: Não, estou bem. Mas o para-choque...
  - speaker: sosed2
    text: Признавам, јас не закочив навреме.
    meaning:
      en: I admit it, I didn't brake in time.
      pt: Admito, não freei a tempo.
  - speaker: protagonist
    text: Тогаш да го пополниме европскиот записник.
    meaning:
      en: Then let's fill in the European accident report.
      pt: Então vamos preencher a declaração amigável.
  - speaker: sosed2
    text: Еве ја мојата полиса и регистрацијата.
    meaning:
      en: Here's my policy and registration.
      pt: Aqui está minha apólice e a placa.
  - speaker: protagonist
    text: Вие сте виновник, значи вашето осигурување ќе ја надомести штетата.
    meaning:
      en: You're at fault, so your insurance will cover the damage.
      pt: O senhor é o culpado, então o seu seguro cobre o prejuízo.
  - speaker: sosed2
    text: Точно. Потпишете тука.
    meaning:
      en: Right. Sign here.
      pt: Certo. Assine aqui.
  - speaker: protagonist
    text: Без полиција?
    meaning:
      en: Without the police?
      pt: Sem polícia?
  - speaker: sosed2
    text: Ако нема повредени и се согласуваме — без полиција.
    meaning:
      en: If nobody's hurt and we agree — no police.
      pt: Se ninguém se machucou e estamos de acordo — sem polícia.
