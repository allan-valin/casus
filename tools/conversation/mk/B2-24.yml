steps:
- type: narrator
  text:
    en: Goran has a job offer in Munich. A long night at the кафана. Listen to the conversation; you don't need to understand it yet.
    pt: O Goran recebeu uma oferta de emprego em Munique. Uma noite longa na кафана. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: goran
    text: Ми понудија работа во Минхен. Платата е три пати поголема.
    meaning:
      en: They offered me a job in Munich. The salary is three times bigger.
      pt: Me ofereceram um emprego em Munique. O salário é três vezes maior.
  - speaker: protagonist
    text: Ќе заминеш?
    meaning:
      en: Will you go?
      pt: Você vai?
  - speaker: goran
    text: Од моето друштво, четворица веќе заминаа.
    meaning:
      en: From my group of friends, four have already left.
      pt: Da minha turma, quatro já foram embora.
  - speaker: protagonist
    text: Само за парите?
    meaning:
      en: Just for the money?
      pt: Só pelo dinheiro?
  - speaker: goran
    text: Не само. Перспектива, системот, корупцијата... Тука нема кој да те слуша.
    meaning:
      en: Not only. Prospects, the system, corruption... Here there's nobody to listen to you.
      pt: Não só. Perspectiva, o sistema, a corrupção... Aqui não tem quem te ouça.
  - speaker: protagonist
    text: А јас дојдов тука од Бразил. Иселувањето оди во двата правци.
    meaning:
      en: And I came here from Brazil. Emigration goes both ways.
      pt: E eu vim do Brasil para cá. A emigração vai nos dois sentidos.
  - speaker: goran
    text: Ти си исклучок! Можеби ќе се вратам за пет години.
    meaning:
      en: You're the exception! Maybe I'll come back in five years.
      pt: Você é a exceção! Talvez eu volte daqui a cinco anos.
  - speaker: protagonist
    text: Сите велат така.
    meaning:
      en: Everyone says that.
      pt: Todo mundo diz isso.
