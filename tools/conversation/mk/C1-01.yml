steps:
- type: narrator
  text:
    en: You want proper Macedonian, written and formal. You enrol in an evening course. Listen to the conversation; you don't need to understand it yet.
    pt: Você quer um macedônio de verdade, escrito e formal. Você se matricula num curso noturno. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Добровечер. Би сакала да се запишам на курсот по македонски.
    meaning:
      en: Good evening. I'd like to enrol in the Macedonian course.
      pt: Boa noite. Gostaria de me matricular no curso de macedônio.
  - speaker: profesorka
    text: Кое ниво?
    meaning:
      en: Which level?
      pt: Qual nível?
  - speaker: protagonist
    text: Напредно. Зборувам добро, но пишувам слабо, особено службен јазик.
    meaning:
      en: Advanced. I speak well, but I write poorly, especially formal language.
      pt: Avançado. Falo bem, mas escrevo mal, principalmente a linguagem formal.
  - speaker: profesorka
    text: Тогаш сте на вистинското место. Ве молам, пополнете го образецот.
    meaning:
      en: Then you're in the right place. Please fill in the form.
      pt: Então está no lugar certo. Por favor, preencha o formulário.
  - speaker: protagonist
    text: Кога се одржуваат часовите?
    meaning:
      en: When are the classes held?
      pt: Quando acontecem as aulas?
  - speaker: profesorka
    text: Вторник и четврток, од шест до осум.
    meaning:
      en: Tuesday and Thursday, six to eight.
      pt: Terça e quinta, das seis às oito.
  - speaker: protagonist
    text: Вторник имам кошарка... но курсот е поважен.
    meaning:
      en: On Tuesdays I have basketball... but the course is more important.
      pt: Terça eu tenho basquete... mas o curso é mais importante.
  - speaker: profesorka
    text: Никогаш не е доцна за учење. Добредојдовте.
    meaning:
      en: It's never too late to learn. Welcome.
      pt: Nunca é tarde para aprender. Seja bem-vinda.
