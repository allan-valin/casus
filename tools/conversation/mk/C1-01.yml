- type: narrator
  text:
    en: 'Formal Macedonian prefers set phrases and full forms: ''ве молам, пополнете'' instead of ''пополни'', ''се одржуваат'' instead of ''имаме''. Offices and letters expect it.'
    pt: 'O macedônio formal prefere frases feitas e formas completas: ''ве молам, пополнете'' em vez de ''пополни'', ''се одржуваат'' em vez de ''имаме''. Repartições e cartas esperam isso.'
