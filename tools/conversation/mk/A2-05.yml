steps:
- type: narrator
  text:
    en: You caught a cold. Back to Dr Petrovska. Listen to the conversation; you don't need to understand it yet.
    pt: Você pegou um resfriado. De volta à doutora Petrovska. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: doktorka
    text: Што ве боли?
    meaning:
      en: What hurts?
      pt: O que está doendo?
  - speaker: protagonist
    text: Ме боли грлото и имам температура.
    meaning:
      en: My throat hurts and I have a temperature.
      pt: Minha garganta dói e estou com febre.
  - speaker: doktorka
    text: Од кога?
    meaning:
      en: Since when?
      pt: Desde quando?
  - speaker: protagonist
    text: Од вчера. Мислам дека е од промајата!
    meaning:
      en: Since yesterday. I think it's from the draft!
      pt: Desde ontem. Acho que foi a corrente de ar!
  - speaker: doktorka
    text: Можеби. Пијте многу чај, со мед и лимон.
    meaning:
      en: Maybe. Drink lots of tea, with honey and lemon.
      pt: Talvez. Beba bastante chá, com mel e limão.
  - speaker: protagonist
    text: А лекови?
    meaning:
      en: And medicine?
      pt: E remédio?
  - speaker: doktorka
    text: Еве рецепт. Една таблета три пати на ден.
    meaning:
      en: Here's a prescription. One tablet three times a day.
      pt: Aqui a receita. Um comprimido três vezes ao dia.
  - speaker: protagonist
    text: Благодарам.
    meaning:
      en: Thank you.
      pt: Obrigada.
  - speaker: doktorka
    text: И не одете на работа два дена.
    meaning:
      en: And don't go to work for two days.
      pt: E não vá trabalhar por dois dias.
