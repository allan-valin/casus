steps:
- type: narrator
  text:
    en: Ana's book club reads a Macedonian novel. Your turn to speak. Listen to the conversation; you don't need to understand it yet.
    pt: O clube de leitura da Ana lê um romance macedônio. Sua vez de falar. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: ana
    text: Што мислиш за романот?
    meaning:
      en: What do you think of the novel?
      pt: O que você achou do romance?
  - speaker: protagonist
    text: На прв поглед — едноставна приказна. Но меѓу редовите има многу.
    meaning:
      en: At first sight — a simple story. But there's a lot between the lines.
      pt: À primeira vista — uma história simples. Mas nas entrelinhas tem muita coisa.
  - speaker: ana
    text: А главниот лик?
    meaning:
      en: And the main character?
      pt: E o protagonista?
  - speaker: protagonist
    text: Ме допре. Тој заминува и се враќа — како многу луѓе тука.
    meaning:
      en: He touched me. He leaves and comes back — like many people here.
      pt: Me tocou. Ele vai embora e volta — como muita gente aqui.
  - speaker: goran
    text: Мене крајот не ми се допадна. Отворен крај!
    meaning:
      en: I didn't like the ending. An open ending!
      pt: Eu não gostei do final. Final aberto!
  - speaker: protagonist
    text: Отворениот крај симболизира избор. Секој си го чита на свој начин.
    meaning:
      en: The open ending symbolises choice. Everyone reads it their own way.
      pt: O final aberto simboliza escolha. Cada um lê do seu jeito.
  - speaker: ana
    text: Убаво кажано. Би го препорачал?
    meaning:
      en: Nicely said. Would you recommend it?
      pt: Bem dito. Você recomendaria?
  - speaker: protagonist
    text: Препорачувам — особено на странци што сакаат да ја разберат земјата.
    meaning:
      en: I recommend it — especially to foreigners who want to understand the country.
      pt: Recomendo — principalmente para estrangeiros que querem entender o país.
