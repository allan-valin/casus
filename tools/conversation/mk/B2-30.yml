- type: narrator
  text:
    en: December, Vera's kitchen. Where will you live, and what comes next? B2 comes back. Listen to the conversation; you don't need to understand it yet.
    pt: Dezembro, na cozinha da Vera. Onde você vai morar, e o que vem agora? O B2 volta. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: vera
    text: Значи, свадба наесен. Каде ќе живеете?
    meaning:
      en: So, a wedding in autumn. Where will you live?
      pt: Então, casamento no outono. Onde vocês vão morar?
  - speaker: protagonist
    text: Купивме стан — со кредит, на дваесет години.
    meaning:
      en: We bought a flat — with a mortgage, over twenty years.
      pt: Compramos um apartamento — financiado, em vinte anos.
  - speaker: vera
    text: Каде?
    meaning:
      en: Where?
      pt: Onde?
  - speaker: protagonist
    text: Тука, во истата зграда. На четвртиот кат.
    meaning:
      en: Here, in the same building. On the fourth floor.
      pt: Aqui, no mesmo prédio. No quarto andar.
  - speaker: vera
    text: Не! Навистина? Ќе плачам.
    meaning:
      en: No! Really? I'm going to cry.
      pt: Não! Sério? Vou chorar.
  - speaker: protagonist
    text: А плановите за иднината — полека-полека. Можеби деца.
    meaning:
      en: And plans for the future — little by little. Maybe children.
      pt: E os planos para o futuro — devagarinho. Talvez filhos.
  - speaker: vera
    text: Ќе им бидам баба! Секој ден кафе, како порано.
    meaning:
      en: I'll be their grandmother! Coffee every day, like before.
      pt: Vou ser avó deles! Café todo dia, como antes.
  - speaker: protagonist
    text: Како во A1 — само сега разбирам сè.
    meaning:
      en: Like in A1 — only now I understand everything.
      pt: Como no A1 — só que agora entendo tudo.
