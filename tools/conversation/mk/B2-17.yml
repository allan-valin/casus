steps:
- type: narrator
  text:
    en: 'Ten o''clock. Ana appears at your desk: coffee time. Listen to the conversation; you don''t need to understand it yet.'
    pt: 'Dez horas. A Ana aparece na sua mesa: hora do café. Escute a conversa; ainda não precisa entender.'
- type: dialogue
  lines:
  - speaker: ana
    text: Ајде на кафе!
    meaning:
      en: Let's go for coffee!
      pt: Bora tomar um café!
  - speaker: protagonist
    text: Имам многу работа. Само пет минути.
    meaning:
      en: I've got lots of work. Just five minutes.
      pt: Tenho muito trabalho. Só cinco minutos.
  - speaker: ana
    text: Пет минути, едно кафенце. Ќе се вратиме веднаш.
    meaning:
      en: Five minutes, one little coffee. We'll be right back.
      pt: Cinco minutos, um cafezinho. A gente volta já.
  - speaker: protagonist
    text: Една чашка, и малку водичка.
    meaning:
      en: A little cup, and a bit of water.
      pt: Uma xicrinha, e uma aguinha.
  - speaker: ana
    text: А каков муабет имав вчера со Горан...
    meaning:
      en: And what a chat I had with Goran yesterday...
      pt: E que papo eu tive ontem com o Goran...
  - speaker: protagonist
    text: Ана! Поминаа четириесет минути!
    meaning:
      en: Ana! Forty minutes have gone by!
      pt: Ana! Passaram quarenta minutos!
  - speaker: ana
    text: Кафето не се брои. Тоа е муабет.
    meaning:
      en: Coffee doesn't count. That's conversation.
      pt: Café não conta. Isso é papo.
  - speaker: protagonist
    text: Кажи му тоа на Николовски!
    meaning:
      en: Tell that to Nikolovski!
      pt: Fala isso para o Nikolovski!
