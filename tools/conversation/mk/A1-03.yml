steps:
- type: narrator
  text:
    en: You meet Mrs Stojanovska on the stairs with a heavy bag. Her arm hurts. Listen to the conversation; you don't need to understand it yet.
    pt: Você encontra a senhora Stojanovska na escada com uma sacola pesada. O braço dela dói. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: protagonist
    text: Добар ден, госпоѓо Стојановска! Што ви е?
    meaning:
      en: Good afternoon, Mrs Stojanovska! What's wrong?
      pt: Boa tarde, senhora Stojanovska! O que a senhora tem?
  - speaker: vera
    text: Ме боли раката. Торбата е многу тешка.
    meaning:
      en: My arm hurts. The bag is very heavy.
      pt: Meu braço dói. A sacola é muito pesada.
  - speaker: protagonist
    text: Да ви помогнам?
    meaning:
      en: Can I help you?
      pt: Posso ajudar?
  - speaker: vera
    text: Да, благодарам. И главата ме боли малку.
    meaning:
      en: Yes, thank you. My head hurts a little too.
      pt: Sim, obrigada. A cabeça também dói um pouco.
  - speaker: protagonist
    text: Главата? Лекар?
    meaning:
      en: Your head? A doctor?
      pt: A cabeça? Médico?
  - speaker: vera
    text: Не, не е страшно.
    meaning:
      en: No, it's nothing serious.
      pt: Não, não é nada grave.
  - speaker: protagonist
    text: Одморете се, госпоѓо Стојановска.
    meaning:
      en: Rest, Mrs Stojanovska.
      pt: Descanse, senhora Stojanovska.
  - speaker: vera
    text: Благодарам. Сега добро сум.
    meaning:
      en: Thank you. Now I'm fine.
      pt: Obrigada. Agora estou bem.
- type: narrator
  text:
    en: 'To ask an older person what is wrong, politely: ''Што ви е?'''
    pt: 'Para perguntar a uma pessoa mais velha o que ela tem, com educação: ''Што ви е?'''
- type: prompt
