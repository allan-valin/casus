- type: narrator
  text:
    en: '''The'' is at the end of the word: рака → раката, глава → главата, нога → ногата. Words in -о take -то: око → окото.'
    pt: 'O artigo vem no fim da palavra: рака → раката (o braço), глава → главата, нога → ногата. Palavras em -о levam -то: око → окото.'
