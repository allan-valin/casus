- type: narrator
  text:
    en: She says 'Ме боли раката' — word for word 'me hurts the arm'. The thing that hurts comes after.
    pt: Ela diz 'Ме боли раката' — palavra por palavra 'me dói o braço', como em português. O que dói vem depois.
- type: line
