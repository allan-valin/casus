steps:
- type: narrator
  text:
    en: Five years since the key and the landlady. On the old staircase, the whole story comes back. Listen to the conversation; you don't need to understand it yet.
    pt: Cinco anos desde a chave e a dona do apartamento. Na velha escada, a história inteira volta. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Пет години! Се сеќаваш на првиот клуч?
    meaning:
      en: Five years! Do you remember the first key?
      pt: Cinco anos! Lembra da primeira chave?
  - speaker: protagonist
    text: Како вчера. „Ова е клучот.“ Не знаев ни збор.
    meaning:
      en: Like yesterday. 'This is the key.' I didn't know a word.
      pt: Como se fosse ontem. 'Ова е клучот.' Eu não sabia nem uma palavra.
  - speaker: ana
    text: А сега?
    meaning:
      en: And now?
      pt: E agora?
  - speaker: protagonist
    text: Сега сонувам на македонски.
    meaning:
      en: Now I dream in Macedonian.
      pt: Agora sonho em macedônio.
  - speaker: sara
    text: И им пееш на децата на два јазика.
    meaning:
      en: And you sing to the children in two languages.
      pt: E canta para as crianças em duas línguas.
  - speaker: goran
    text: Брате, ти си бил поголем Македонец од нас!
    meaning:
      en: Bro, you turn out to be more Macedonian than us!
      pt: Mano, você é mais macedônio que a gente, pelo jeito!
  - speaker: protagonist
    text: Не. Само дома сум — тука и таму.
    meaning:
      en: No. I'm just at home — here and there.
      pt: Não. Só estou em casa — aqui e lá.
  - speaker: protagonist
    text: Благодарам на сите. Ајде — кафе!
    meaning:
      en: Thank you, everyone. Come on — coffee!
      pt: Obrigado a todos. Bora — café!
