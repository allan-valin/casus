steps:
- type: narrator
  text:
    en: The baby is one. The public kindergarten has a waiting list; Sara's parents have a plan. Listen to the conversation; you don't need to understand it yet.
    pt: O bebê fez um ano. A creche pública tem fila de espera; os pais da Sara têm um plano. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: sluzbenicka
    text: Во градинката нема место. Сте на листата, деветнаесетти.
    meaning:
      en: There's no place in the kindergarten. You're on the list, nineteenth.
      pt: Não tem vaga na creche. Vocês estão na lista, em décimo nono.
  - speaker: protagonist
    text: Деветнаесетти? Ама зарем толку многу деца?
    meaning:
      en: Nineteenth? But surely there aren't that many children?
      pt: Décimo nono? Mas será que tem tanta criança assim?
  - speaker: sluzbenicka
    text: Има. Градот расте, градинките не.
    meaning:
      en: There are. The city grows, the kindergartens don't.
      pt: Tem. A cidade cresce, as creches não.
  - speaker: svekrva-s
    text: Не ни треба градинка! Баба и дедо ќе го чуваме.
    meaning:
      en: We don't need a kindergarten! Grandma and grandpa will look after him.
      pt: Não precisamos de creche! O vô e a vó cuidam dele.
  - speaker: protagonist
    text: Секој ден?
    meaning:
      en: Every day?
      pt: Todo dia?
  - speaker: svekrva-s
    text: Секој ден. Бесплатно чување, домашна храна.
    meaning:
      en: Every day. Free childcare, home-cooked food.
      pt: Todo dia. Cuidado de graça, comida caseira.
  - speaker: sara
    text: Па ете, решено.
    meaning:
      en: Well, there you go, sorted.
      pt: Pois é, resolvido.
  - speaker: protagonist
    text: И без промаја, нели?
    meaning:
      en: And no drafts, right?
      pt: E sem corrente de ar, né?
