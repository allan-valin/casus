steps:
- type: narrator
  text:
    en: You missed Sunday lunch at Bojan's parents'. He is not pleased. Listen to the conversation; you don't need to understand it yet.
    pt: Você faltou ao almoço de domingo na casa dos pais do Bojan. Ele não gostou. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: bojan
    text: Каде беше? Мајка ми те чекаше на ручек!
    meaning:
      en: Where were you? My mother was waiting for you at lunch!
      pt: Onde você estava? Minha mãe estava te esperando no almoço!
  - speaker: protagonist
    text: Извини, не беше намерно. Заборавив дека е денеска.
    meaning:
      en: Sorry, it wasn't on purpose. I forgot it was today.
      pt: Desculpa, não foi de propósito. Esqueci que era hoje.
  - speaker: bojan
    text: Таа готвеше цело утро.
    meaning:
      en: She was cooking all morning.
      pt: Ela cozinhou a manhã inteira.
  - speaker: protagonist
    text: Ќе ѝ се јавам и ќе ѝ се извинам. Не се лути.
    meaning:
      en: I'll call her and apologise. Don't be angry.
      pt: Vou ligar para ela e pedir desculpas. Não fica bravo.
  - speaker: bojan
    text: Не се лутам... само малку.
    meaning:
      en: I'm not angry... only a little.
      pt: Não estou bravo... só um pouco.
  - speaker: protagonist
    text: Следната недела јас носам колач, ветувам.
    meaning:
      en: Next Sunday I'm bringing a cake, I promise.
      pt: Domingo que vem eu levo um bolo, prometo.
  - speaker: bojan
    text: Добро. Таа сака колач со ореви.
    meaning:
      en: All right. She likes walnut cake.
      pt: Tá bom. Ela gosta de bolo de nozes.
  - speaker: protagonist
    text: Тогаш со ореви!
    meaning:
      en: Walnut, then!
      pt: Então de nozes!
