steps:
- type: narrator
  text:
    en: Night on Vodno, the mountain above Skopje, with Marko. Listen to the conversation; you don't need to understand it yet.
    pt: Noite no Vodno, a montanha sobre Skopje, com o Marko. Escute a conversa; ainda não precisa entender.
- type: dialogue
  lines:
  - speaker: marko
    text: Погледни! Од Водно се гледа цело Скопје.
    meaning:
      en: Look! From Vodno you can see all of Skopje.
      pt: Olha! Do Vodno dá para ver Skopje inteira.
  - speaker: protagonist
    text: Убава ноќ. Колку ѕвезди!
    meaning:
      en: A beautiful night. So many stars!
      pt: Que noite bonita. Quantas estrelas!
  - speaker: marko
    text: А таму, онаа светла ѕвезда?
    meaning:
      en: And there, that bright star?
      pt: E ali, aquela estrela brilhante?
  - speaker: protagonist
    text: Тоа не е ѕвезда, тоа е планета.
    meaning:
      en: That's not a star, that's a planet.
      pt: Aquilo não é estrela, é um planeta.
  - speaker: marko
    text: Месечината е голема денеска.
    meaning:
      en: The moon is big tonight.
      pt: A lua está grande hoje.
  - speaker: protagonist
    text: Во Бразил месечината е иста, но ѕвездите се други.
    meaning:
      en: In Brazil the moon is the same, but the stars are different.
      pt: No Brasil a lua é a mesma, mas as estrelas são outras.
  - speaker: marko
    text: Навистина?
    meaning:
      en: Really?
      pt: Sério?
  - speaker: protagonist
    text: Да. И сега таму е попладне. Има сонце.
    meaning:
      en: Yes. And now it's afternoon there. The sun is out.
      pt: Sim. E agora lá é de tarde. Está de sol.
- type: prompt
  ask:
