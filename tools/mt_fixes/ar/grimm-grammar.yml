In a rare bow to logic, German noun genders actually make sense when they match the biological gender of the noun.: في انحناءة نادرة أمام المنطق، يكون جنس الأسماء الألمانية منطقيًا فعلًا حين يتطابق مع الجنس البيولوجي.
