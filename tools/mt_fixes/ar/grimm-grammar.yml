Nouns overview: نظرة عامة على الأسماء
Nouns describe people, animals, things, concepts and ideas.: تصف الأسماء الناس والحيوانات والأشياء والمفاهيم والأفكار.
Just as in English, German nouns can be common or proper, count or mass, singular or plural.: كما في العربية، يمكن أن تكون الأسماء الألمانية أسماء جنس أو أسماء علم، معدودة أو غير معدودة، مفردة أو جمعًا.
? 'German nouns, however, have two additional characteristics:  they are always capitalized and they can be masculine, feminine or neuter:'
: 'لكن للأسماء الألمانية خاصيتين إضافيتين: تُكتب دائمًا بحرف كبير، ويمكن أن تكون مذكرة أو مؤنثة أو محايدة:'
Common nouns refer to a general person, animal, object or concept.: أسماء الجنس تدل على شخص أو حيوان أو شيء أو مفهوم بوجه عام.
the basket: السلة
the little girl: الفتاة الصغيرة
the mother: الأم
Proper nouns represent specific individuals or places.: أسماء العلم تدل على أفراد أو أماكن بعينها.
Nouns can also be categorized according to whether they can be counted or not.: ويمكن أيضًا تصنيف الأسماء بحسب إمكان عدّها.
Nouns that can be broken down into individuals are count nouns.: الأسماء التي يمكن تقسيمها إلى أفراد هي الأسماء المعدودة.
the flower/the flowers: الزهرة/الزهور
Nouns that denote items that cannot be broken down into individual units are mass nouns.: الأسماء التي تدل على أشياء لا يمكن تقسيمها إلى وحدات فردية هي الأسماء غير المعدودة.
Little Red Riding Hood's grandmother likes to drink [1]wine[2].: تحب جدة ذات الرداء الأحمر أن تشرب [1]النبيذ[2].
The wolf likes to eat [1]meat[2].: يحب الذئب أن يأكل [1]اللحم[2].
? 'German nouns also all have a grammatical gender that sometimes overlaps with the biological gender (masculine or feminine), as in the following examples:'
: 'لكل الأسماء الألمانية أيضًا جنس نحوي يتطابق أحيانًا مع الجنس البيولوجي (مذكر أو مؤنث)، كما في الأمثلة التالية:'
'[1]the hunter[2]': '[1]الصياد[2]'
'[1]the grandmother[2]': '[1]الجدة[2]'
? But most often the grammatical gender is independent of biological gender, and the only thing to do with them is to learn them when you learn your vocabulary.
: لكن الجنس النحوي في الغالب مستقل عن الجنس البيولوجي، والحل الوحيد هو حفظه عند تعلم المفردات.
'[1]the forest[2]': '[1]الغابة[2]'
