? 'Typically, in English there is some kind of ending that marks the plural, for example an -s: stone => stones; tree => trees.'
: 'في العربية تدل على الجمع نهايات مثل -ون/-ين و-ات: معلم => معلمون؛ سيارة => سيارات.'
There can be other kinds of plural markers, such as a different word form as in child => children.: 'وقد توجد علامات جمع أخرى، مثل تغيّر صيغة الكلمة كلها كما في جموع التكسير: ولد => أولاد، كتاب => كتب.'
? 'In German the situation is the same, there is typically some kind of ending that indicates whether we are talking about one item or more:'
: 'وفي الألمانية الوضع مشابه، فهناك عادةً نهاية ما تدل على أننا نتحدث عن شيء واحد أو أكثر:'
