Most prepositions can be made into separable prefixes, and most separable prefixes are originally prepositions.: معظم حروف الجر يمكن أن تصبح سوابق منفصلة، ومعظم السوابق المنفصلة في الأصل حروف جر.
These prefixes change the new verb's meaning in a way that is often related to the original meaning of the preposition.: تغيّر هذه السوابق معنى الفعل الجديد تغييرًا يرتبط غالبًا بالمعنى الأصلي لحرف الجر.
