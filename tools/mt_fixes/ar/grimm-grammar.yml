Adjectives: الصفات
Adjectives overview, adjective endings: نظرة عامة على الصفات، نهايات الصفات
? Adjectives describe nouns, and can either precede or follow the noun in German without affecting the meaning of the article.
: تصف الصفات الأسماء، ويمكن في الألمانية أن تأتي قبل الاسم أو بعده دون أن يتغير معنى أداة التعريف.
? In German, just like English, adjectives can be graded to express comparisons between two (comparative) or more (comparative and superlative) things, places, people or thoughts.
: في الألمانية، كما في العربية، يمكن تدريج الصفات للمقارنة بين شيئين (صيغة المقارنة) أو أكثر (صيغة المقارنة وصيغة التفضيل العليا) من الأشياء أو الأماكن أو الأشخاص أو الأفكار.
? Unlike in English, however, adjectives that precede nouns take endings depending on the case, gender and number of that noun.
: لكن الصفات التي تسبق الأسماء في الألمانية تأخذ نهايات بحسب حالة ذلك الاسم الإعرابية وجنسه وعدده.
'[1]I.': '[1]أولًا.'
