? 'Only one thing is for sure: every German noun has a grammatical gender, which you should learn just like you learn the plural form (because there is no real logic to either one!).'
: 'شيء واحد مؤكد: لكل اسم ألماني جنس نحوي، عليك أن تتعلمه كما تتعلم صيغة الجمع (فلا منطق حقيقي في أي منهما!).'
