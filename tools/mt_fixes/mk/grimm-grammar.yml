Nouns overview: Преглед на именките
Nouns describe people, animals, things, concepts and ideas.: Именките означуваат луѓе, животни, предмети, поими и идеи.
Just as in English, German nouns can be common or proper, count or mass, singular or plural.: Исто како на македонски, германските именки можат да бидат заеднички или сопствени, бројливи или збирни, во еднина или множина.
? 'German nouns, however, have two additional characteristics:  they are always capitalized and they can be masculine, feminine or neuter:'
: 'Но германските именки имаат уште две особини: секогаш се пишуваат со голема буква и можат да бидат од машки, женски или среден род:'
Common nouns refer to a general person, animal, object or concept.: Заедничките именки означуваат лице, животно, предмет или поим воопшто.
the basket: кошницата
the little girl: девојчето
the mother: мајката
Proper nouns represent specific individuals or places.: Сопствените именки означуваат конкретни лица или места.
Nouns can also be categorized according to whether they can be counted or not.: Именките можат да се поделат и според тоа дали можат да се бројат или не.
Nouns that can be broken down into individuals are count nouns.: Именките што можат да се поделат на поединечни единки се бројливи.
the flower/the flowers: цветот/цвеќињата
Nouns that denote items that cannot be broken down into individual units are mass nouns.: Именките што означуваат нешто што не може да се подели на поединечни единки се збирни (небројливи).
Little Red Riding Hood's grandmother likes to drink [1].: Бабата на Црвенкапа сака да пие [1].
The wolf likes to eat [1].: Волкот сака да јаде [1].
? 'German nouns also all have a grammatical gender that sometimes overlaps with the biological gender (masculine or feminine), as in the following examples:'
: 'Сите германски именки имаат и граматички род, кој понекогаш се поклопува со биолошкиот (машки или женски), како во следниве примери:'
? But most often the grammatical gender is independent of biological gender, and the only thing to do with them is to learn them when you learn your vocabulary.
: Но најчесто граматичкиот род не зависи од биолошкиот, и единственото што може да се направи е да се учи заедно со зборовите.
'All nouns in German and English are marked for number: singular (one) or plural (more than one).': 'Сите именки на германски и македонски имаат број: еднина (едно) или множина (повеќе од едно).'
? 'Typically, in English there is some kind of ending that marks the plural, for example an -s: stone => stones; tree => trees.'
: 'На македонски множината обично се означува со наставка, на пример -и: камен => камења; дрво => дрвја; град => градови.'
There can be other kinds of plural markers, such as a different word form as in child => children.: 'Може да има и други знаци на множина, како сосема различен збор: човек => луѓе.'
? 'In German the situation is the same, there is typically some kind of ending that indicates whether we are talking about one item or more:'
: 'На германски е исто, обично има некаква наставка што покажува дали зборуваме за едно или повеќе нешта:'
