Adjectives: Придавки
Adjectives overview, adjective endings: Преглед на придавките, наставки на придавките
? Adjectives describe nouns, and can either precede or follow the noun in German without affecting the meaning of the article.
: Придавките ги опишуваат именките и во германскиот можат да стојат пред или по именката без тоа да го смени значењето на членот.
? In German, just like English, adjectives can be graded to express comparisons between two (comparative) or more (comparative and superlative) things, places, people or thoughts.
: Во германскиот, исто како во македонскиот, придавките можат да се степенуваат за да се споредат две (компаратив) или повеќе (компаратив и суперлатив) работи, места, луѓе или мисли.
? Unlike in English, however, adjectives that precede nouns take endings depending on the case, gender and number of that noun.
: Но, за разлика од македонскиот, придавките пред именката добиваат наставки според падежот, родот и бројот на таа именка.
'[1]I.': '[1]I.'
Before and after[2]: Пред и по именката[2]
Adjectives that precede nouns (and most often come between an article and a noun) are called [1].: Придавките што стојат пред именката (најчесто меѓу членот и именката) се викаат [1].
Once upon a time, there was a [1] man.: Си бил еднаш еден [1] човек.
His wife called her [1] daughter to her bed.: Неговата жена ја повика својата [1] ќерка до креветот.
Adjectives that follow nouns are usually separated by a verb such as sein, werden, heißen and are called [1].: Придавките што стојат по именката обично се одделени со глагол како sein, werden, heißen и се викаат [1].
Unfortunately, the woman [1] very [2].: За жал, жената [1] многу [2].
'She said to her daughter: Dear child, [1] [2] and [3]!': 'Таа ѝ рече на ќерката: Мило дете, [1] [2] и [3]!'
'[1]Comparative and superlative[2]': '[1]Компаратив и суперлатив[2]'
Adjectives can be graded to express comparative and superlative qualities.: Придавките можат да се степенуваат за да изразат компаратив и суперлатив.
Cinderella's life became much [1] when her father married the other woman.: Животот на Пепелашка стана многу [1] кога татко ѝ се ожени со другата жена.
The poor girl was [1] every day.: Кутрото девојче секој ден беше [1].
When the father returned from a trip, he brought the [1] clothes, pearls and gems for the two stepsisters.: Кога таткото се врати од пат, им донесе на двете полусестри [1] облеки, бисери и скапоцени камења.
? 'Attributive adjectives (the ones preceding the noun they describe) can take three different types of endings, depending on what precedes them:'
: 'Атрибутивните придавки (оние што стојат пред именката што ја опишуваат) можат да добијат три различни видови наставки, зависно од тоа што стои пред нив:'
adjectives preceded by definite articles or der-words take weak adjective endings: придавките по определен член или der-збор добиваат слаби наставки
adjectives preceded by indefinite articles or ein-words take strong adjective endings: придавките по неопределен член или ein-збор добиваат силни наставки
unpreceded adjectives take a different set of strong adjective endings: придавките без збор пред себе добиваат друга серија силни наставки
