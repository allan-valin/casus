? Adjectives that are preceded by an indefinite article (ein, eine, keine) or other ein-words (meine, deine, seine) receive strong endings because the article does not give enough grammatical information to signal the noun's gender, case and number.
: Придавките по неопределен член (ein, eine, keine) или други ein-зборови (meine, deine, seine) добиваат силни наставки, бидејќи членот не дава доволно граматичка информација за родот, падежот и бројот на именката.
A [1] bird came to the tree every day.: Една [1] птица секој ден доаѓаше на дрвото.
In the realm there was an [1] King.: Во царството имаше еден [1] крал.
He arranged a [1] feast for his son, in order to find him a wife.: Тој приреди [1] гозба за својот син, за да му најде невеста.
? Then there are some adjectives that are either not preceded by any determiners or are preceded by quantifiers such as many ([1]), some ([2]) or few ([3]).
: Има и придавки пред кои не стои никаков определувач или пред кои стојат квантификатори како многу ([1]), некои ([2]) или малку ([3]).
? These adjectives take a different set of strong endings to compensate for the lacking grammatical information about the noun's gender, case and number.
: Тие придавки добиваат друга серија силни наставки за да ја надоместат граматичката информација за родот, падежот и бројот на именката што недостасува.
Many [1] women in the kingdom were invited.: Беа поканети многу [1] жени од царството.
Cinderella is not allowed to go to the feast; she only has [1], [2] clothes.: Пепелашка не смее да оди на гозбата; има само [1], [2] облеки.
But two [1] turtle doves came to Cinderella and brought her [2] and [3] clothes, and Cinderella went to the feast.: Но две [1] гугутки дојдоа кај Пепелашка и ѝ донесоа [2] и [3] облеки, и Пепелашка отиде на гозбата.
The prince fell in love with Cinderella, and covered the stairs with [1] tar, to keep the girl with him.: Принцот се заљуби во Пепелашка и ги намачка скалите со [1] катран, за да го задржи девојчето кај себе.
Cinderella ran away, but lost her shoe.: Пепелашка избега, но го изгуби чевелот.
After a few [1] attempts, the prince finds his bride and they marry.: По неколку [1] обиди, принцот ја наоѓа својата невеста и тие се венчаат.
There are a numbers of adjectives, mostly colors and foreign loan words, that do not take adjective endings.: Има низа придавки, главно бои и туѓи зборови, што не добиваат придавски наставки.
Interestingly, they also do not exist in comparative and superlative forms.: Интересно, тие немаат ни компаратив ни суперлатив.
