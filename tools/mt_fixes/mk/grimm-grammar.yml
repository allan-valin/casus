Nouns plural: Множина на именките
In German, a noun is either singular or plural.: На германски именката е или во еднина или во множина.
It is usually introduced by a determiner that helps identify whether the noun is singular or plural.: Обично ја воведува определувач што помага да се препознае дали е во еднина или множина.
Singular nouns [when they are the subjects of a sentence] are preceded by [1] (masc), [2] (fem) or [3] (neuter).: Пред именките во еднина [кога се подмет во реченицата] стои [1] (маш.), [2] (жен.) или [3] (сред.).
