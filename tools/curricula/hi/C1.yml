id: C1
topics:

- title: {en: Talking about ideas, pt: Falando de ideias}
  lessons:
  - id: hi-abstract
    title: स्वतंत्रता, समानता, विकास
    meaning: {en: "abstract and learned words", pt: "palavras abstratas e eruditas"}
    intro:
      en: |
        Learned Hindi builds abstracts from Sanskrit: **-ता** (**स्वतंत्रता** freedom, **समानता** equality), **-त्व** (**महत्व** importance), **-इक** adjectives (**सामाजिक** social, **वैज्ञानिक** scientific), and **विकास** (development), **शिक्षा** (education). Many have a Perso-Arabic twin: **आज़ादी** for **स्वतंत्रता**.
      pt: |
        O hindi culto forma abstratos a partir do sânscrito: **-ता** (**स्वतंत्रता** liberdade, **समानता** igualdade), **-त्व** (**महत्व** importância), adjetivos em **-इक** (**सामाजिक** social, **वैज्ञानिक** científico), e **विकास** (desenvolvimento), **शिक्षा** (educação). Muitos têm um gêmeo perso-árabe: **आज़ादी** por **स्वतंत्रता**.
    examples:
    - ["स्वतंत्रता और समानता महत्वपूर्ण हैं।", "Freedom and equality are important.", "Liberdade e igualdade são importantes.", "स्वतंत्रता"]
    match: {seq: [{pos: noun, re: "(ता|त्व|ना)$"}]}
