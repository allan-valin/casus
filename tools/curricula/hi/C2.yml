id: C2
topics:

- title: {en: Literature and variety, pt: Literatura e variedade}
  lessons:
  - id: hi-literature
    title: प्रेमचंद, कबीर, तुलसीदास
    meaning: {en: "reading the classics", pt: "lendo os clássicos"}
    intro:
      en: |
        Premchand (1880–1936) wrote the short stories every Hindi reader knows (*Idgah*, *Kafan*) in plain Hindustani; Kabir's couplets (15th c.) and Tulsidas's *Ramcharitmanas* (16th c.) are in older Hindi (Braj, Awadhi) with forms the reader may not know. Bollywood songs mix Hindi and Urdu freely.
      pt: |
        Premchand (1880–1936) escreveu os contos que todo leitor de hindi conhece (*Idgah*, *Kafan*) num hindustâni simples; os dísticos de Kabir (séc. XV) e o *Ramcharitmanas* de Tulsidas (séc. XVI) estão em hindi antigo (braj, awadhi), com formas que o leitor pode não conhecer. As canções de Bollywood misturam hindi e urdu livremente.
    examples:
    - ["रमज़ान के पूरे तीस रोज़ों के बाद ईद आयी है।", "After thirty full days of Ramadan, Eid has come.", "Depois de trinta dias inteiros de Ramadã, chegou o Eid.", "ईद"]
    match: {seq: [{word: [कहानी, कविता, उपन्यास, लेखक, ईद, दोहा]}]}
    pool: [कहानी, कविता, उपन्यास, लेखक]
  - id: hi-urdu
    title: हिंदी और उर्दू
    meaning: {en: "Hindi and Urdu: one speech, two standards", pt: "hindi e urdu: uma fala, dois padrões"}
    intro:
      en: |
        Everyday Hindi and Urdu are one spoken language (Hindustani); the standards differ in script (Devanagari / Perso-Arabic) and in learned words (Sanskrit / Persian-Arabic). A speaker of one understands the other's conversation, less so its newspapers.
      pt: |
        O hindi e o urdu do dia a dia são uma só língua falada (hindustâni); os padrões diferem na escrita (devanágari / perso-árabe) e nas palavras cultas (sânscrito / persa-árabe). Quem fala uma entende a conversa da outra, menos os jornais.
    examples:
    - ["हिंदी और उर्दू बहुत मिलती-जुलती हैं।", "Hindi and Urdu are very alike.", "O hindi e o urdu são muito parecidos.", "उर्दू"]
    match: {seq: [{word: [हिंदी, हिन्दी, उर्दू, भाषा, लिपि]}]}
    pool: [हिंदी, उर्दू, भाषा, लिपि]
