# Arabic text of the Hindi course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "الأصوات والحروف"
  Nouns and gender: "الأسماء والجنس"
  Pronouns and being: "الضمائر والكون"
  Postpositions: "الأدوات اللاحقة"
  The present: "المضارع"
  Questions and negation: "الأسئلة والنفي"
  Past and future: "الماضي والمستقبل"
  Pronouns and postpositions: "الضمائر والأدوات اللاحقة"
  Moods and compound verbs: "الصيغ والأفعال المركّبة"
  Clauses: "الجمل"
  Register: "مستوى اللغة"
  Talking about ideas: "الحديث عن الأفكار"
  Literature and variety: "الأدب والتنوّع"
lessons:
  hi-devanagari:
    meaning: "الديفاناغاري: الحروف وعلامات الحركات"
    intro: |
      تُكتب الديفاناغاري من اليسار إلى اليمين تحت خط علوي. كل حرف صامت يحمل *a*: **क** *ka*؛ والحركات الأخرى علامات حوله: **का** *kā*، **कि** *ki*، **की** *kī*، **कु** *ku*، **के** *ke*، **को** *ko*. وفي أول الكلمة للحركات حروف خاصة (**अ आ इ ई उ ऊ ए ओ**). والأزواج المهموسة (**क / ख، ग / घ، त / थ**) والارتدادية (**ट ड** مقابل **त द**) أصوات مختلفة. والنقطة تحت الحرف (**ड़، ढ़، ज़، फ़**) تصنع أصواتًا جديدة.
  hi-gender:
    meaning: "جنسان"
    intro: |
      كل اسم مذكّر أو مؤنّث. المذكّرات المنتهية بـ**-ā** (**लड़का** ولد، **कमरा** غرفة) والمؤنّثات المنتهية بـ**-ī** (**लड़की** بنت، **नदी** نهر) تُظهر ذلك؛ وغيرها يُحفظ: **घर** (بيت، مذكّر)، **किताब** (كتاب، مؤنّث — من العربية)، **पानी** (ماء، مذكّر). والصفات والأفعال تطابق الجنس.
  hi-plural:
    meaning: "الجمع المباشر"
    intro: |
      المذكّر **-ā → -e** (**लड़का → लड़के**)، وبقية المذكّرات لا تتغيّر (**घर → घर**)؛ والمؤنّث **-ī → -iyā̃** (**लड़की → लड़कियाँ**)، وبقية المؤنّثات **-ẽ** (**किताब → किताबें**).
  hi-pronouns:
    meaning: "الضمائر الشخصية؛ ثلاث صيغ للمخاطَب"
    intro: |
      **मैं** (أنا)، **तू** (أنت، حميمية شديدة)، **तुम** (أنت، مألوفة)، **आप** (حضرتك، مهذّبة — الاختيار الآمن)، **यह / वह** (هو، هي: هذا / ذاك)، **हम** (نحن)، **ये / वे** (هم). والأفعال تتبعها: **आप कैसे हैं?** (كيف حالك؟).
  hi-hona:
    meaning: "होना، الكون"
    intro: |
      الحاضر: **मैं हूँ, तू है, तुम हो, आप हैं, वह है, हम हैं, वे हैं**. والماضي بحسب الجنس والعدد: **था, थी, थे, थीं**: **वह घर पर था / थी** (كان / كانت في البيت). والفعل في آخر الجملة: **यह किताब है** (هذا كتاب).
  hi-postpositions:
    meaning: "الأدوات اللاحقة والحالة المائلة"
    intro: |
      تضع الهندية *في، على، من، إلى* بعد الاسم: **घर में** (في البيت)، **मेज़ पर** (على الطاولة)، **दिल्ली से** (من دلهي)، **बच्चे को** (للطفل)، **शाम तक** (حتى المساء). والاسم قبلها في الحالة المائلة: **कमरा → कमरे में**، **लड़कियाँ → लड़कियों को**.
  hi-ka:
    meaning: "الملكية: का تطابق المملوك"
    intro: |
      **X का Y** = Y الخاص بـX، و**का / की / के** تطابق Y: **राम का घर** (بيت رام)، **राम की किताब** (كتاب رام)، **राम के बच्चे** (أولاد رام). وكذلك ضمائر الملكية: **मेरा / मेरी / मेरे** (لي)، **तुम्हारा، आपका، उसका، हमारा، उनका**.
  hi-present:
    meaning: "المضارع الاعتيادي: -tā + होना"
    intro: |
      الجذر + **-tā / -tī / -te** (مطابقًا للفاعل) + مضارع **होना**: **मैं पढ़ता हूँ** (أقرأ، مذكّر)، **मैं पढ़ती हूँ** (مؤنّث)، **वे पढ़ते हैं**. يقول ما يُفعل بانتظام: **हम बस से शहर जाते हैं** (نذهب إلى المدينة بالحافلة).
  hi-progressive:
    meaning: "المستمر: الجذر + रहा + होना"
    intro: |
      الجذر + **रहा / रही / रहे** + **होना**: **मैं किताब पढ़ रही हूँ** (أقرأ كتابًا الآن، مؤنّث)، **बच्चे खेल रहे हैं** (الأطفال يلعبون). وفي الماضي: **पढ़ रहा था** (كان يقرأ).
  hi-questions:
    meaning: "أدوات الاستفهام؛ क्या لأسئلة نعم/لا"
    intro: |
      **क्या** (ماذا؛ وفي أول الجملة لسؤال نعم/لا: **क्या आप अंग्रेज़ी बोलते हैं?** هل تتكلّم الإنجليزية؟)، **कौन** (من)، **कहाँ** (أين)، **कब** (متى)، **क्यों** (لماذا)، **कैसे** (كيف)، **कितना / कितनी** (كم). وأداة الاستفهام في موضع الجواب: **आप कहाँ रहते हैं?**
  hi-nahin:
    meaning: "النفي"
    intro: |
      **नहीं** قبل الفعل، وكثيرًا ما يُحذف المساعد: **मैं नहीं समझता** (لا أفهم). و**मत** مع الأمر: **मत जाओ** (لا تذهب)؛ و**न** في عبارات ثابتة وفي الصيغة الشرطية.
  hi-past:
    meaning: "الماضي التام"
    intro: |
      الجذر + **-ā / -ī / -e / -ī̃** مطابقًا في الجنس والعدد: **वह घर गया** (ذهب إلى البيت)، **वह घर गई** (ذهبت إلى البيت)، **वे आए**. والشاذ: **जाना → गया**، **करना → किया**، **देना → दिया**، **लेना → लिया**، **होना → हुआ**.
  hi-ne:
    meaning: "ने: الحالة الإرغاتية مع الأفعال المتعدّية في الماضي"
    intro: |
      مع الفعل المتعدّي في التام يأخذ الفاعل **ने** ويطابق الفعل *المفعول*: **लड़के ने किताब पढ़ी** (قرأ الولد الكتاب — **पढ़ी** مؤنّث لأجل **किताब**)، **मैंने खाना खाया** (أكلت). والضمائر تندمج: **मैंने، तुमने، उसने، हमने**. ومع **को** على المفعول يبقى الفعل مذكّرًا مفردًا: **मैंने लड़की को देखा** (رأيت البنت).
  hi-future:
    meaning: "المستقبل"
    intro: |
      الصيغة الشرطية + **-gā / -gī / -ge**: **मैं जाऊँगा / जाऊँगी** (سأذهب)، **वह आएगा**، **हम चलेंगे**. و**होना → होगा** تعني أيضًا *لا بدّ أنه*: **वह घर पर होगा** (لا بدّ أنه في البيت).
  hi-mujhe:
    meaning: "حالة القابل: يعجبني، يجب عليّ، أعرف"
    intro: |
      **मुझे، तुम्हें، उसे، हमें، उन्हें** (= **मुझको…**) تدلّ على من يشعر: **मुझे चाय पसंद है** (يعجبني الشاي)، **मुझे जाना है** (عليّ أن أذهب)، **मुझे पता है** (أعرف)، **मुझे भूख लगी है** (أنا جائع).
  hi-compound-postp:
    meaning: "الأدوات اللاحقة المركّبة"
    intro: |
      **के** + كلمة اسمية: **के लिए** (لأجل)، **के साथ** (مع)، **के बाद** (بعد)، **के पहले / से पहले** (قبل)، **के पास** (عند، قرب)، **के बारे में** (عن)، **की तरफ़** (نحو): **मेरे लिए** (لأجلي)، **दोस्तों के साथ** (مع الأصدقاء).
  hi-subjunctive:
    meaning: "الصيغة الشرطية و चाहिए"
    intro: |
      الجذر + **-ū̃, -e, -o, -ẽ**: **मैं जाऊँ?** (أأذهب؟)، **शायद वह आए** (ربما يأتي)، وبعد **ताकि** (لكي) وفي التمنّي. و*ينبغي* هي **चाहिए** مع حالة القابل: **आपको आराम करना चाहिए** (ينبغي أن ترتاح).
  hi-compound-verbs:
    meaning: "الأفعال المركّبة: الإتمام والظلال"
    intro: |
      الجذر + فعل خفيف (**लेना، देना، जाना، डालना، पड़ना**) يضيف الإتمام أو ظلًّا من المعنى: **खा लो** (كُله كلّه)، **बता दो** (أخبرني)، **वह गिर गया** (وقع)، **मुझे जाना पड़ा** (اضطررت إلى الذهاب).
  hi-ki:
    meaning: "أنّ، الذي، إذا"
    intro: |
      **कि** (أنّ): **मुझे पता है कि वह आएगा** (أعرف أنه سيأتي). وجمل الصلة تقرن **जो** (الذي) بـ**वह** (ذاك): **जो लड़का वहाँ खड़ा है, वह मेरा भाई है** (الولد الواقف هناك أخي). والشرط: **अगर … तो …**: **अगर बारिश हुई तो हम घर पर रहेंगे** (إن أمطرت بقينا في البيت). **क्योंकि** (لأنّ)، **लेकिन** (لكن).
  hi-register:
    meaning: "الأدب والمعجمان"
    intro: |
      **आप** مع أفعال الجمع، و**जी** بعد الأسماء والأجوبة (**हाँ जी**، **शर्मा जी**)، و**कृपया** (من فضلك) كتابةً. الهندية الرسمية تقترض من السنسكريتية (**धन्यवाद** شكرًا، **प्रश्न** سؤال)، والهندوستانية اليومية من الفارسية والعربية (**शुक्रिया** شكرًا، **सवाल** سؤال) — وهو المعجم الذي تشترك فيه مع الأردية.
  hi-passive:
    meaning: "المجهول بـ जाना"
    intro: |
      اسم المفعول التام + **जाना**: **यह किताब हिंदी में लिखी गई** (كُتب هذا الكتاب بالهندية)، **यहाँ हिंदी बोली जाती है** (تُتكلّم الهندية هنا). والفاعل كتابةً بـ**द्वारा**: **प्रेमचंद द्वारा लिखी गई कहानी** (قصة كتبها بريمتشاند).
  hi-abstract:
    meaning: "الكلمات المجرّدة والمثقّفة"
    intro: |
      تصوغ الهندية المثقّفة المجرّدات من السنسكريتية: **-ता** (**स्वतंत्रता** حرّية، **समानता** مساواة)، **-त्व** (**महत्व** أهمية)، وصفات بـ**-इक** (**सामाजिक** اجتماعي، **वैज्ञानिक** علمي)، و**विकास** (تنمية)، **शिक्षा** (تعليم). ولكثير منها توأم فارسي عربي: **आज़ादी** (آزادي) بدل **स्वतंत्रता**.
  hi-literature:
    meaning: "قراءة الكلاسيكيات"
    intro: |
      كتب بريمتشاند (1880–1936) القصص التي يعرفها كل قارئ للهندية (*عيدگاه*، *كفن*) بهندوستانية بسيطة؛ وأبيات كبير (القرن الخامس عشر) و*رامتشاريتماناس* لتولسيداس (القرن السادس عشر) بهندية قديمة (براج، أوادهي) فيها صيغ قد لا يعرفها القارئ. وأغاني بوليوود تمزج الهندية والأردية بحرّية.
  hi-urdu:
    meaning: "الهندية والأردية: كلام واحد ومعياران"
    intro: |
      الهندية والأردية اليوميتان لغة محكية واحدة (الهندوستانية)؛ ويختلف المعياران في الخط (الديفاناغاري / الفارسي العربي) وفي الكلمات المثقّفة (السنسكريتية / الفارسية العربية). من يتكلّم إحداهما يفهم حديث الأخرى، وصحفَها أقلّ.
