# German text of the Hindi course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "Laute und Buchstaben"
  Nouns and gender: "Nomen und Genus"
  Pronouns and being: "Pronomen und das Sein"
  Postpositions: "Postpositionen"
  The present: "Das Präsens"
  Questions and negation: "Fragen und Verneinung"
  Past and future: "Vergangenheit und Zukunft"
  Pronouns and postpositions: "Pronomen und Postpositionen"
  Moods and compound verbs: "Modi und zusammengesetzte Verben"
  Clauses: "Nebensätze"
  Register: "Register"
  Talking about ideas: "Über Ideen sprechen"
  Literature and variety: "Literatur und Vielfalt"
lessons:
  hi-devanagari:
    meaning: "Devanagari: Buchstaben und Vokalzeichen"
    intro: |
      Devanagari wird von links nach rechts unter einer Kopflinie geschrieben. Jeder Konsonant trägt ein *a*: **क** *ka*; andere Vokale sind Zeichen um ihn herum: **का** *kā*, **कि** *ki*, **की** *kī*, **कु** *ku*, **के** *ke*, **को** *ko*. Am Wortanfang haben Vokale eigene Buchstaben (**अ आ इ ई उ ऊ ए ओ**). Behauchte Paare (**क / ख, ग / घ, त / थ**) und retroflexe Laute (**ट ड** gegenüber **त द**) sind verschiedene Laute. Der Punkt darunter (**ड़, ढ़, ज़, फ़**) bildet neue Laute.
  hi-gender:
    meaning: "zwei Genera"
    intro: |
      Jedes Nomen ist maskulin oder feminin. Maskulina auf **-ā** (**लड़का** Junge, **कमरा** Zimmer) und Feminina auf **-ī** (**लड़की** Mädchen, **नदी** Fluss) zeigen es; andere muss man lernen: **घर** (Haus, m.), **किताब** (Buch, f.), **पानी** (Wasser, m.). Adjektive und Verben richten sich nach dem Genus.
  hi-plural:
    meaning: "der direkte Plural"
    intro: |
      Maskulin **-ā → -e** (**लड़का → लड़के**), andere Maskulina unverändert (**घर → घर**); feminin **-ī → -iyā̃** (**लड़की → लड़कियाँ**), andere Feminina **-ẽ** (**किताब → किताबें**).
  hi-pronouns:
    meaning: "Personalpronomen; drei Formen für du/Sie"
    intro: |
      **मैं** (ich), **तू** (du, sehr vertraut), **तुम** (du, vertraut), **आप** (Sie, höflich — die sichere Wahl), **यह / वह** (er, sie, es: dieser / jener), **हम** (wir), **ये / वे** (sie). Die Verben folgen: **आप कैसे हैं?** (wie geht es Ihnen?).
  hi-hona:
    meaning: "होना, sein"
    intro: |
      Präsens: **मैं हूँ, तू है, तुम हो, आप हैं, वह है, हम हैं, वे हैं**. Vergangenheit nach Genus und Numerus: **था, थी, थे, थीं**: **वह घर पर था / थी** (er / sie war zu Hause). Das Verb steht am Ende: **यह किताब है** (das ist ein Buch).
  hi-postpositions:
    meaning: "Postpositionen und der Obliquus"
    intro: |
      Hindi stellt *in, auf, von, zu* hinter das Nomen: **घर में** (im Haus), **मेज़ पर** (auf dem Tisch), **दिल्ली से** (aus Delhi), **बच्चे को** (dem Kind), **शाम तक** (bis zum Abend). Das Nomen davor steht im Obliquus: **कमरा → कमरे में**, **लड़कियाँ → लड़कियों को**.
  hi-ka:
    meaning: "Besitz: का richtet sich nach dem Besessenen"
    intro: |
      **X का Y** = Xs Y, und **का / की / के** richten sich nach Y: **राम का घर** (Rams Haus), **राम की किताब** (Rams Buch), **राम के बच्चे** (Rams Kinder). Ebenso die Possessiva: **मेरा / मेरी / मेरे** (mein), **तुम्हारा, आपका, उसका, हमारा, उनका**.
  hi-present:
    meaning: "das gewohnheitsmäßige Präsens: -tā + होना"
    intro: |
      Stamm + **-tā / -tī / -te** (nach dem Subjekt) + Präsens von **होना**: **मैं पढ़ता हूँ** (ich lese, m.), **मैं पढ़ती हूँ** (f.), **वे पढ़ते हैं**. Es sagt, was man regelmäßig tut: **हम बस से शहर जाते हैं** (wir fahren mit dem Bus in die Stadt).
  hi-progressive:
    meaning: "die Verlaufsform: Stamm + रहा + होना"
    intro: |
      Stamm + **रहा / रही / रहे** + **होना**: **मैं किताब पढ़ रही हूँ** (ich lese gerade ein Buch, f.), **बच्चे खेल रहे हैं** (die Kinder spielen). In der Vergangenheit: **पढ़ रहा था**.
  hi-questions:
    meaning: "Fragewörter; क्या für Ja/Nein"
    intro: |
      **क्या** (was; und am Satzanfang eine Ja/Nein-Frage: **क्या आप अंग्रेज़ी बोलते हैं?** sprechen Sie Englisch?), **कौन** (wer), **कहाँ** (wo), **कब** (wann), **क्यों** (warum), **कैसे** (wie), **कितना / कितनी** (wie viel). Das Fragewort steht dort, wo die Antwort stünde: **आप कहाँ रहते हैं?**
  hi-nahin:
    meaning: "Verneinung"
    intro: |
      **नहीं** vor dem Verb, das Hilfsverb fällt oft weg: **मैं नहीं समझता** (ich verstehe nicht). **मत** bei Befehlen: **मत जाओ** (geh nicht); **न** in festen Wendungen und im Konjunktiv.
  hi-past:
    meaning: "die perfektive Vergangenheit"
    intro: |
      Stamm + **-ā / -ī / -e / -ī̃** nach Genus und Numerus: **वह घर गया** (er ging nach Hause), **वह घर गई** (sie ging nach Hause), **वे आए**. Unregelmäßig: **जाना → गया**, **करना → किया**, **देना → दिया**, **लेना → लिया**, **होना → हुआ**.
  hi-ne:
    meaning: "ने: der Ergativ bei transitiven Verben in der Vergangenheit"
    intro: |
      Bei einem transitiven Verb im Perfektiv nimmt das Subjekt **ने**, und das Verb richtet sich nach dem *Objekt*: **लड़के ने किताब पढ़ी** (der Junge las das Buch — **पढ़ी** ist feminin wegen **किताब**), **मैंने खाना खाया** (ich aß). Pronomen verschmelzen: **मैंने, तुमने, उसने, हमने**. Mit **को** am Objekt bleibt das Verb maskulin Singular: **मैंने लड़की को देखा** (ich sah das Mädchen).
  hi-future:
    meaning: "das Futur"
    intro: |
      Konjunktiv + **-gā / -gī / -ge**: **मैं जाऊँगा / जाऊँगी** (ich werde gehen), **वह आएगा**, **हम चलेंगे**. **होना → होगा** heißt auch *muss sein*: **वह घर पर होगा** (er wird wohl zu Hause sein).
  hi-mujhe:
    meaning: "der Dativ: mir gefällt, ich muss, ich weiß"
    intro: |
      **मुझे, तुम्हें, उसे, हमें, उन्हें** (= **मुझको…**) bezeichnen den Erlebenden: **मुझे चाय पसंद है** (ich mag Tee), **मुझे जाना है** (ich muss gehen), **मुझे पता है** (ich weiß), **मुझे भूख लगी है** (ich habe Hunger).
  hi-compound-postp:
    meaning: "zusammengesetzte Postpositionen"
    intro: |
      **के** + ein nominales Wort: **के लिए** (für), **के साथ** (mit), **के बाद** (nach), **के पहले / से पहले** (vor), **के पास** (bei, nahe), **के बारे में** (über), **की तरफ़** (in Richtung): **मेरे लिए** (für mich), **दोस्तों के साथ** (mit Freunden).
  hi-subjunctive:
    meaning: "der Konjunktiv und चाहिए"
    intro: |
      Stamm + **-ū̃, -e, -o, -ẽ**: **मैं जाऊँ?** (soll ich gehen?), **शायद वह आए** (vielleicht kommt er), nach **ताकि** (damit) und in Wünschen. *Sollte* ist **चाहिए** mit dem Dativ: **आपको आराम करना चाहिए** (Sie sollten sich ausruhen).
  hi-compound-verbs:
    meaning: "zusammengesetzte Verben: Abschluss und Färbung"
    intro: |
      Ein Stamm + ein leichtes Verb (**लेना, देना, जाना, डालना, पड़ना**) fügt Abschluss oder Nuance hinzu: **खा लो** (iss es auf, für dich), **बता दो** (sag es mir), **वह गिर गया** (er fiel hin), **मुझे जाना पड़ा** (ich musste gehen).
  hi-ki:
    meaning: "dass, wer, wenn"
    intro: |
      **कि** (dass): **मुझे पता है कि वह आएगा** (ich weiß, dass er kommt). Relativsätze paaren **जो** (der, welcher) mit **वह** (jener): **जो लड़का वहाँ खड़ा है, वह मेरा भाई है** (der Junge, der dort steht, ist mein Bruder). Bedingungen: **अगर … तो …**: **अगर बारिश हुई तो हम घर पर रहेंगे** (wenn es regnet, bleiben wir zu Hause). **क्योंकि** (weil), **लेकिन** (aber).
  hi-register:
    meaning: "Höflichkeit und die zwei Wortschätze"
    intro: |
      **आप** mit Pluralverben, **जी** nach Namen und Antworten (**हाँ जी**, **शर्मा जी**), **कृपया** (bitte) schriftlich. Förmliches Hindi entlehnt aus dem Sanskrit (**धन्यवाद** danke, **प्रश्न** Frage), das alltägliche Hindustani aus dem Persischen und Arabischen (**शुक्रिया**, **सवाल**) — der Wortschatz, den es mit dem Urdu teilt.
  hi-passive:
    meaning: "das Passiv mit जाना"
    intro: |
      Perfektives Partizip + **जाना**: **यह किताब हिंदी में लिखी गई** (dieses Buch wurde auf Hindi geschrieben), **यहाँ हिंदी बोली जाती है** (hier wird Hindi gesprochen). Der Urheber schriftlich mit **द्वारा**: **प्रेमचंद द्वारा लिखी गई कहानी** (eine von Premchand geschriebene Geschichte).
  hi-abstract:
    meaning: "abstrakte und gelehrte Wörter"
    intro: |
      Gelehrtes Hindi bildet Abstrakta aus dem Sanskrit: **-ता** (**स्वतंत्रता** Freiheit, **समानता** Gleichheit), **-त्व** (**महत्व** Bedeutung), Adjektive auf **-इक** (**सामाजिक** sozial, **वैज्ञानिक** wissenschaftlich), dazu **विकास** (Entwicklung), **शिक्षा** (Bildung). Viele haben einen persisch-arabischen Zwilling: **आज़ादी** für **स्वतंत्रता**.
  hi-literature:
    meaning: "die Klassiker lesen"
    intro: |
      Premchand (1880–1936) schrieb die Erzählungen, die jeder Hindi-Leser kennt (*Idgah*, *Kafan*), in schlichtem Hindustani; Kabirs Zweizeiler (15. Jh.) und Tulsidas' *Ramcharitmanas* (16. Jh.) sind in älterem Hindi (Braj, Awadhi) mit Formen, die der Leser vielleicht nicht kennt. Bollywood-Lieder mischen Hindi und Urdu frei.
  hi-urdu:
    meaning: "Hindi und Urdu: eine Rede, zwei Standards"
    intro: |
      Alltägliches Hindi und Urdu sind eine gesprochene Sprache (Hindustani); die Standards unterscheiden sich in der Schrift (Devanagari / persisch-arabisch) und in den gelehrten Wörtern (Sanskrit / Persisch-Arabisch). Wer die eine spricht, versteht die Unterhaltung der anderen, ihre Zeitungen weniger.
