# Macedonian text of the Hindi course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "Гласови и букви"
  Nouns and gender: "Именки и род"
  Pronouns and being: "Заменки и глаголот сум"
  Postpositions: "Постпозиции"
  The present: "Сегашно време"
  Questions and negation: "Прашања и негација"
  Past and future: "Минато и идно време"
  Pronouns and postpositions: "Заменки и постпозиции"
  Moods and compound verbs: "Начини и сложени глаголи"
  Clauses: "Реченици"
  Register: "Регистар"
  Talking about ideas: "Разговор за идеи"
  Literature and variety: "Литература и разновидност"
lessons:
  hi-devanagari:
    meaning: "деванагари: букви и вокални знаци"
    intro: |
      Деванагари се пишува одлево надесно под горна линија. Секоја согласка носи *а*: **क** *ка*; другите самогласки се знаци околу неа: **का** *ка̄*, **कि** *ки*, **की** *кӣ*, **कु** *ку*, **के** *ке*, **को** *ко*. На почеток на зборот самогласките имаат свои букви (**अ आ इ ई उ ऊ ए ओ**). Придишните парови (**क / ख, ग / घ, त / थ**) и ретрофлексните (**ट ड** наспроти **त द**) се различни гласови. Точката одоздола (**ड़, ढ़, ज़, फ़**) прави нови гласови.
  hi-gender:
    meaning: "два рода"
    intro: |
      Секоја именка е од машки или женски род. Машките на **-ā** (**लड़का** момче, **कमरा** соба) и женските на **-ī** (**लड़की** девојче, **नदी** река) го покажуваат; другите се учат: **घर** (куќа, м.), **किताब** (книга, ж.), **पानी** (вода, м.). Придавките и глаголите се согласуваат со родот.
  hi-plural:
    meaning: "директна множина"
    intro: |
      Машки **-ā → -e** (**लड़का → लड़के**), другите машки не се менуваат (**घर → घर**); женски **-ī → -iyā̃** (**लड़की → लड़कियाँ**), другите женски **-ẽ** (**किताब → किताबें**).
  hi-pronouns:
    meaning: "лични заменки; три форми за ти/Вие"
    intro: |
      **मैं** (јас), **तू** (ти, многу блиско), **तुम** (ти, блиско), **आप** (Вие, учтиво — безбедниот избор), **यह / वह** (тој, таа: овој / оној), **हम** (ние), **ये / वे** (тие). Глаголите следат: **आप कैसे हैं?** (како сте?).
  hi-hona:
    meaning: "होना, сум"
    intro: |
      Сегашно: **मैं हूँ, तू है, तुम हो, आप हैं, वह है, हम हैं, वे हैं**. Минато по род и број: **था, थी, थे, थीं**: **वह घर पर था / थी** (тој / таа беше дома). Глаголот е на крајот: **यह किताब है** (ова е книга).
  hi-postpositions:
    meaning: "постпозиции и обликот"
    intro: |
      Хинди ги става *во, на, од, на (кому)* по именката: **घर में** (во куќата), **मेज़ पर** (на масата), **दिल्ली से** (од Делхи), **बच्चे को** (на детето), **शाम तक** (до вечерта). Именката пред нив е во облик: **कमरा → कमरे में**, **लड़कियाँ → लड़कियों को**.
  hi-ka:
    meaning: "припадност: का се согласува со поседуваното"
    intro: |
      **X का Y** = Y на X, а **का / की / के** се согласуваат со Y: **राम का घर** (куќата на Рам), **राम की किताब** (книгата на Рам), **राम के बच्चे** (децата на Рам). И присвојните заменки: **मेरा / मेरी / मेरे** (мој), **तुम्हारा, आपका, उसका, हमारा, उनका**.
  hi-present:
    meaning: "сегашно време за навика: -tā + होना"
    intro: |
      Основа + **-tā / -tī / -te** (според подметот) + сегашното на **होना**: **मैं पढ़ता हूँ** (читам, м.), **मैं पढ़ती हूँ** (ж.), **वे पढ़ते हैं**. Кажува што се прави редовно: **हम बस से शहर जाते हैं** (одиме во градот со автобус).
  hi-progressive:
    meaning: "трајна форма: основа + रहा + होना"
    intro: |
      Основа + **रहा / रही / रहे** + **होना**: **मैं किताब पढ़ रही हूँ** (читам книга, ж.), **बच्चे खेल रहे हैं** (децата си играат). Во минато: **पढ़ रहा था** (читаше).
  hi-questions:
    meaning: "прашални зборови; क्या за да/не"
    intro: |
      **क्या** (што; а на почеток прашање да/не: **क्या आप अंग्रेज़ी बोलते हैं?** зборувате ли англиски?), **कौन** (кој), **कहाँ** (каде), **कब** (кога), **क्यों** (зошто), **कैसे** (како), **कितना / कितनी** (колку). Прашалниот збор стои таму каде што би стоел одговорот: **आप कहाँ रहते हैं?**
  hi-nahin:
    meaning: "негација"
    intro: |
      **नहीं** пред глаголот, помошниот често се изостава: **मैं नहीं समझता** (не разбирам). **मत** со заповеди: **मत जाओ** (не оди); **न** во некои изрази и во субјунктивот.
  hi-past:
    meaning: "свршено минато"
    intro: |
      Основа + **-ā / -ī / -e / -ī̃** според род и број: **वह घर गया** (тој отиде дома), **वह घर गई** (таа отиде дома), **वे आए**. Неправилни: **जाना → गया**, **करना → किया**, **देना → दिया**, **लेना → लिया**, **होना → हुआ**.
  hi-ne:
    meaning: "ने: ергативот кај преодни глаголи во минато"
    intro: |
      Кај преоден глагол во свршено време подметот зема **ने**, а глаголот се согласува со *објектот*: **लड़के ने किताब पढ़ी** (момчето ја прочита книгата — **पढ़ी** е во женски род поради **किताब**), **मैंने खाना खाया** (јадев). Заменките се спојуваат: **मैंने, तुमने, उसने, हमने**. Со **को** на објектот глаголот останува во машки род еднина: **मैंने लड़की को देखा** (го видов девојчето).
  hi-future:
    meaning: "идно време"
    intro: |
      Субјунктив + **-gā / -gī / -ge**: **मैं जाऊँगा / जाऊँगी** (ќе одам), **वह आएगा**, **हम चलेंगे**. **होना → होगा** значи и *мора да е*: **वह घर पर होगा** (сигурно е дома).
  hi-mujhe:
    meaning: "датив: ми се допаѓа, морам, знам"
    intro: |
      **मुझे, तुम्हें, उसे, हमें, उन्हें** (= **मुझको…**) го означуваат доживувачот: **मुझे चाय पसंद है** (ми се допаѓа чај), **मुझे जाना है** (морам да одам), **मुझे पता है** (знам), **मुझे भूख लगी है** (гладен сум).
  hi-compound-postp:
    meaning: "сложени постпозиции"
    intro: |
      **के** + именски збор: **के लिए** (за), **के साथ** (со), **के बाद** (по), **के पहले / से पहले** (пред), **के पास** (кај, близу), **के बारे में** (за, во врска со), **की तरफ़** (кон): **मेरे लिए** (за мене), **दोस्तों के साथ** (со пријателите).
  hi-subjunctive:
    meaning: "субјунктив и चाहिए"
    intro: |
      Основа + **-ū̃, -e, -o, -ẽ**: **मैं जाऊँ?** (да одам ли?), **शायद वह आए** (можеби ќе дојде), по **ताकि** (за да) и во желби. *Би требало* е **चाहिए** со датив: **आपको आराम करना चाहिए** (треба да се одморите).
  hi-compound-verbs:
    meaning: "сложени глаголи: завршеност и нијанса"
    intro: |
      Основа + лесен глагол (**लेना, देना, जाना, डालना, पड़ना**) додава завршеност или нијанса: **खा लो** (изеди го, за себе), **बता दो** (кажи ми), **वह गिर गया** (тој падна), **मुझे जाना पड़ा** (морав да одам).
  hi-ki:
    meaning: "дека, кој, ако"
    intro: |
      **कि** (дека): **मुझे पता है कि वह आएगा** (знам дека ќе дојде). Релативните реченици ги спаруваат **जो** (кој, што) и **वह** (оној): **जो लड़का वहाँ खड़ा है, वह मेरा भाई है** (момчето што стои таму е брат ми). Услови: **अगर … तो …**: **अगर बारिश हुई तो हम घर पर रहेंगे** (ако врне, ќе останеме дома). **क्योंकि** (зашто), **लेकिन** (но).
  hi-register:
    meaning: "учтивост и двата речника"
    intro: |
      **आप** со глагол во множина, **जी** по имиња и одговори (**हाँ जी**, **शर्मा जी**), **कृपया** (молам) во писмото. Официјалниот хинди позајмува од санскрит (**धन्यवाद** благодарам, **प्रश्न** прашање), секојдневниот хиндустани од персиски и арапски (**शुक्रिया**, **सवाल**) — речникот што го дели со урду.
  hi-passive:
    meaning: "пасив со जाना"
    intro: |
      Свршен партицип + **जाना**: **यह किताब हिंदी में लिखी गई** (оваа книга е напишана на хинди), **यहाँ हिंदी बोली जाती है** (тука се зборува хинди). Вршителот во писмото со **द्वारा**: **प्रेमचंद द्वारा लिखी गई कहानी** (раскажување напишано од Премчанд).
  hi-abstract:
    meaning: "апстрактни и учени зборови"
    intro: |
      Учениот хинди гради апстрактни именки од санскрит: **-ता** (**स्वतंत्रता** слобода, **समानता** еднаквост), **-त्व** (**महत्व** важност), придавки на **-इक** (**सामाजिक** општествен, **वैज्ञानिक** научен), и **विकास** (развој), **शिक्षा** (образование). Многу имаат персиско-арапски близнак: **आज़ादी** за **स्वतंत्रता**.
  hi-literature:
    meaning: "читање на класиците"
    intro: |
      Премчанд (1880–1936) ги напишал расказите што ги знае секој читател на хинди (*Idgah*, *Kafan*), на едноставен хиндустани; двостиховите на Кабир (15 век) и *Ramcharitmanas* на Тулсидас (16 век) се на постар хинди (брај, авадхи), со форми што читачот можеби не ги знае. Песните од Боливуд слободно мешаат хинди и урду.
  hi-urdu:
    meaning: "хинди и урду: еден говор, два стандарди"
    intro: |
      Секојдневниот хинди и урду се еден говорен јазик (хиндустани); стандардите се разликуваат по писмото (деванагари / персиско-арапско) и по учените зборови (санскрит / персиски-арапски). Кој зборува едниот, го разбира разговорот на другиот, помалку весниците.
