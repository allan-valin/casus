# Macedonian text of the Serbo-Croatian course, A1–A2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "Гласови и букви"
  Nouns and gender: "Именки и род"
  Pronouns and the present: "Заменки и сегашно време"
  Questions and negation: "Прашања и негација"
  The cases (1): "Падежите (1)"
  Numbers and time: "Броеви и време"
  The cases (2): "Падежите (2)"
  Past and future: "Минато и идно време"
  Adjectives and little words: "Придавки и мали зборови"
lessons:
  sh-alphabet:
    meaning: "две азбуки, еден глас за секоја буква"
    intro: |
      Српскохрватскиот се пишува како што се зборува, на латиница или кирилица, буква по буква — кирилицата е речиси иста како македонската: **č / ч**, **ć / ћ** (меко *ќ*), **dž / џ**, **đ / ђ** (меко *ѓ*), **š / ш**, **ž / ж**, **lj / љ, nj / њ**, **c / ц**, **j / ј**. Хрватска и Босна пишуваат главно латиница; Србија и Црна Гора и двете. Читачот ги чита двете.
  sh-ije:
    meaning: "ијекавски и екавски"
    intro: |
      Еден стар глас (*јат*) излегува на два начина: **ije / je** во Хрватска, Босна и Црна Гора (*ијекавски*: **mlijeko, dijete, rijeka, lijep**), **e** во поголемиот дел од Србија (*екавски*: **mleko, dete, reka, lep** — како во македонскиот). И двата се стандардни. Лекциите пишуваат ијекавски и ја наведуваат екавската форма.
  sh-gender:
    meaning: "три рода, познати по наставката"
    intro: |
      Машки: согласка (**grad** град, **stol / sto** маса, **prijatelj** пријател); женски: **-a** (**žena** жена, **kuća** куќа) и некои на согласка (**stvar** нешто, **noć** ноќ, **ljubav** љубов); среден: **-o, -e** (**selo** село, **more** море). Нема член — за разлика од македонскиот.
  sh-plural:
    meaning: "номинатив множина"
    intro: |
      Машки **-i**, често со **-ovi / -evi** кај кратките именки (**grad → gradovi**, **prijatelj → prijatelji**, **muž → muževi**); женски **-e** (**žene, kuće**), женски на согласка **-i** (**stvari**); среден **-a** (**sela, mora**). Неправилни: **čovjek → ljudi** (луѓе), **dijete → djeca** (деца), **oko → oči** (очи).
  sh-pronouns:
    meaning: "лични заменки"
    intro: |
      **ja** (јас), **ti** (ти), **on / ona / ono** (тој / таа / тоа), **mi** (ние), **vi** (вие, и учтивото *Вие*, во писма често **Vi**), **oni / one / ona** (тие, м. / ж. / ср.). Наставката на глаголот го покажува лицето, па заменката обично се изостава: **Radim** = работам.
  sh-present:
    meaning: "сегашно време: -am, -im, -em"
    intro: |
      Три типа според првото лице: **-am** (**čitati → čitam, čitaš, čita, čitamo, čitate, čitaju**), **-im** (**govoriti → govorim, govoriš, govori, govorimo, govorite, govore**), **-em** (**pisati → pišem, pišeš, piše, pišemo, pišete, pišu**). Учете го секој глагол со неговото прво лице.
  sh-biti:
    meaning: "biti, сум: кратки, долги и одречни форми"
    intro: |
      Кратки форми, никогаш на почеток на реченицата: **sam, si, je, smo, ste, su** (**Ja sam student. Student sam.**); долги форми за нагласување и прашања: **jesam, jesi, jest(e)…** (**Jesi li umoran?** уморен ли си?); одречни: **nisam, nisi, nije, nismo, niste, nisu**.
  sh-imati:
    meaning: "има; има (ima), нема (nema)"
    intro: |
      **imati**: **imam, imaš, ima, imamo, imate, imaju**; одречно **nemam, nemaš, nema…** **Ima** значи и *има* (постои), **nema** *нема*, со генитив: **Nema kruha / hleba** (нема леб). **Nemam vremena** (немам време).
  sh-questions:
    meaning: "прашални зборови; li и da li"
    intro: |
      **što / šta** (што), **tko / ko** (кој), **gdje / gde** (каде), **kamo / kuda** (накаде), **kada** (кога), **zašto** (зошто), **kako** (како), **koliko** (колку). Прашања да/не: глагол + **li** (**Govoriš li…?**) или **da li** + глагол (**Da li govoriš…?**, често во Србија) — како македонското *дали*.
  sh-ne:
    meaning: "негација и двојна негација"
    intro: |
      **ne** пред глаголот: **Ne razumijem** (не разбирам); со *сум*, *имам* и *сакам* се спојува: **nisam, nemam, neću**. Двојната негација е правило: **Nitko / niko ništa ne zna** (никој ништо не знае), **Nikad nisam bio tamo** (никогаш не сум бил таму).
  sh-acc:
    meaning: "акузатив: директен објект; накаде"
    intro: |
      Женски **-a → -u** (**knjiga → knjigu**); машките предмети остануваат (**vidim grad**), машките лица и животни земаат **-a** (**vidim prijatelja**); средниот не се менува. Исто така *накаде* по **u, na** (**idem u školu** одам на училиште, **na posao** на работа) и време (**svaki dan** секој ден).
  sh-gen:
    meaning: "генитив: на, од, малку, по броеви"
    intro: |
      Машки/среден **-a** (**grada, sela**), женски **-e** (**kuće**), множина **-a** (со долга самогласка) или **-i**. *На* (**kuća moga oca** куќата на татко ми), *од* по **iz, od** (**iz Zagreba** од Загреб), по **bez, do, kod, blizu, zbog**, *малку* (**daj mi vode** дај ми вода) и по броевите од пет (**pet godina** пет години) и **mnogo, malo, koliko**.
  sh-loc:
    meaning: "локатив: во, на, за"
    intro: |
      Секогаш по предлог: **u** (во), **na** (на), **o** (за), **po** (по), **pri**. Машки/среден **-u** (**u gradu** во градот, **na moru** на море), женски **-i** (**u kući** дома, **na ulici** на улица), множина **-ima / -ama**. **Živim u Zagrebu** (живеам во Загреб). **Pričamo o filmu** (зборуваме за филмот).
  sh-numbers:
    meaning: "броеви и именката по нив"
    intro: |
      **jedan (jedna, jedno), dva (dvije / dve), tri, četiri, pet, šest, sedam, osam, devet, deset**, **jedanaest… dvadeset, sto, tisuća / hiljada**. По **2, 3, 4** посебна форма (стар двоен број, = генитив еднина): **dva grada, tri kuće**; од **5** генитив множина: **pet gradova, deset kuća**.
  sh-days:
    meaning: "денови и зборови за време"
    intro: |
      **ponedjeljak / ponedeljak** (понеделник), **utorak, srijeda / sreda, četvrtak, petak, subota, nedjelja / nedelja**. *Во понеделник* = **u ponedjeljak**. **danas** (денеска), **sutra** (утре), **jučer / juče** (вчера), **sada** (сега), **ujutro, navečer / uveče** (наутро, навечер).
  sh-dat:
    meaning: "датив: на кого; ми се допаѓа"
    intro: |
      Машки/среден **-u** (**prijatelju**), женски **-i** (**mami, ženi**), множина **-ima / -ama**. Индиректен објект (**Dajem prijatelju poklon** му давам подарок на пријателот), *се допаѓа* (**Sviđa mi se** ми се допаѓа), чувства (**Hladno mi je** ладно ми е) и по **k / ka, prema**.
  sh-ins:
    meaning: "инструментал: со, преку"
    intro: |
      Машки/среден **-om / -em** (**autobusom, prijateljem**), женски **-om** (**sestrom, olovkom**), множина **-ima / -ama**. Средство (**pišem olovkom** пишувам со молив, **idem autobusom** одам со автобус), друштво со **s / sa** (**sa sestrom** со сестрата) и по **pod, nad, pred, među, za** за место.
  sh-voc:
    meaning: "вокатив: обраќање"
    intro: |
      Се користи секогаш кога му се обраќате некому — како во македонскиот: **Ivan → Ivane!**, **prijatelj → prijatelju!**, **gospodin → gospodine!**, **Ana → Ana! / Ano!**, **mama → mama!**, **sestra → sestro!**. Често во поздрави и писма: **Dragi Marko!** (Драги Марко!)
  sh-past:
    meaning: "минато време: biti + л-партиципот"
    intro: |
      Секојдневното минато (*перфект*) е кратката форма на **biti** + партицип што се согласува по род и број — како македонското *сум работел*: **radio / radila / radilo, radili / radile / radila**. **Ja sam radio** (м.), **ja sam radila** (ж.); **Bio sam u Beogradu** (бев во Белград). Без заменката, помошниот глагол е втор: **Radila sam cijeli dan** (работев цел ден).
  sh-future:
    meaning: "идно време: ću + инфинитив"
    intro: |
      **ću, ćeš, će, ćemo, ćete, će** + инфинитив: **Ja ću raditi** или, без заменката, **Radit ću** (хрватски правопис) / **Radiću** (српски, во еден збор). Одречно: **neću, nećeš…** (**Neću doći** нема да дојдам). Во Србија и **ću da** + сегашно: **Ja ću da radim** — блиску до македонското *ќе работам*.
  sh-aspect:
    meaning: "вид: несвршен и свршен"
    intro: |
      Повеќето глаголи доаѓаат во парови, како во македонскиот: *несвршен* за дејство што трае или се повторува, *свршен* за завршено. **Pisao sam pismo** (пишував писмо) наспроти **Napisao sam pismo** (го напишав). Свршените се прават со префикси (**pisati → napisati**, **čitati → pročitati**) или со друга основа (**kupovati → kupiti**, **davati → dati**).
  sh-adj:
    meaning: "придавките се согласуваат; споредување"
    intro: |
      Придавките се согласуваат по род, број и падеж: **dobar čovjek, dobra žena, dobro dijete; s dobrim prijateljem.** Компаратив **-iji / -ji** (**star → stariji**, **lijep → ljepši**), неправилни **dobar → bolji, loš → gori, velik → veći**; суперлатив **naj-** (**najbolji**). *Од* = **od** + генитив или **nego**.
  sh-se:
    meaning: "se: повратни глаголи"
    intro: |
      **se** (и **sebe**) го прави глаголот повратен или заемен: **prati → prati se** (се мие), **igrati se** (си игра), **smijati se** (се смее), **zvati se** (се вика: **Kako se zoveš?** како се викаш? **Zovem se Ana.**). Како кратките форми на *biti*, **se** стои второ во реченицата.
