# German text of the Serbo-Croatian course, A1–A2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "Laute und Buchstaben"
  Nouns and gender: "Nomen und Genus"
  Pronouns and the present: "Pronomen und das Präsens"
  Questions and negation: "Fragen und Verneinung"
  The cases (1): "Die Fälle (1)"
  Numbers and time: "Zahlen und Zeit"
  The cases (2): "Die Fälle (2)"
  Past and future: "Vergangenheit und Zukunft"
  Adjectives and little words: "Adjektive und kleine Wörter"
lessons:
  sh-alphabet:
    meaning: "zwei Alphabete, ein Laut pro Buchstabe"
    intro: |
      Serbokroatisch wird geschrieben, wie es gesprochen wird, lateinisch oder kyrillisch, Buchstabe für Buchstabe: **č / ч** (hartes *tsch*), **ć / ћ** (weiches *tsch*), **dž / џ** (hartes *dsch*), **đ / ђ** (weiches *dsch*), **š / ш** (*sch*), **ž / ж** (stimmhaftes *sch* wie in *Journal*), **lj / љ, nj / њ** (*lj, nj*), **c / ц** (*z*), **j / ј** (*j*). Kroatien und Bosnien schreiben meist lateinisch, Serbien und Montenegro beides. Der Leser liest beides.
  sh-ije:
    meaning: "ijekavisch und ekavisch"
    intro: |
      Ein alter Vokal (*Jat*) erscheint auf zwei Arten: **ije / je** in Kroatien, Bosnien und Montenegro (*ijekavisch*: **mlijeko, dijete, rijeka, lijep**), **e** im größten Teil Serbiens (*ekavisch*: **mleko, dete, reka, lep**). Beides ist Standard. Die Lektionen schreiben ijekavisch und nennen die ekavische Form.
  sh-gender:
    meaning: "drei Genera, an der Endung erkennbar"
    intro: |
      Maskulin: ein Konsonant (**grad** Stadt, **stol / sto** Tisch, **prijatelj** Freund); feminin: **-a** (**žena** Frau, **kuća** Haus) und einige auf Konsonant (**stvar** Ding, **noć** Nacht, **ljubav** Liebe); neutral: **-o, -e** (**selo** Dorf, **more** Meer). Keine Artikel.
  sh-plural:
    meaning: "der Nominativ Plural"
    intro: |
      Maskulin **-i**, bei kurzen Nomen oft **-ovi / -evi** (**grad → gradovi**, **prijatelj → prijatelji**, **muž → muževi**); feminin **-e** (**žene, kuće**), feminin auf Konsonant **-i** (**stvari**); neutral **-a** (**sela, mora**). Unregelmäßig: **čovjek → ljudi** (Leute), **dijete → djeca** (Kinder), **oko → oči** (Augen).
  sh-pronouns:
    meaning: "Personalpronomen"
    intro: |
      **ja** (ich), **ti** (du), **on / ona / ono** (er / sie / es), **mi** (wir), **vi** (ihr, und das höfliche *Sie*, in Briefen oft **Vi**), **oni / one / ona** (sie, m. / f. / n.). Die Verbendung zeigt die Person, darum fällt das Pronomen meist weg: **Radim** = ich arbeite.
  sh-present:
    meaning: "das Präsens: -am, -im, -em"
    intro: |
      Drei Typen nach der 1. Person: **-am** (**čitati → čitam, čitaš, čita, čitamo, čitate, čitaju**), **-im** (**govoriti → govorim, govoriš, govori, govorimo, govorite, govore**), **-em** (**pisati → pišem, pišeš, piše, pišemo, pišete, pišu**). Lernen Sie jedes Verb mit seiner 1. Person.
  sh-biti:
    meaning: "biti, sein: kurze, lange und verneinte Formen"
    intro: |
      Kurzformen, nie am Satzanfang: **sam, si, je, smo, ste, su** (**Ja sam student. Student sam.**); Langformen für Betonung und Fragen: **jesam, jesi, jest(e)…** (**Jesi li umoran?** bist du müde?); verneint: **nisam, nisi, nije, nismo, niste, nisu**.
  sh-imati:
    meaning: "haben; es gibt (ima), es gibt nicht (nema)"
    intro: |
      **imati**: **imam, imaš, ima, imamo, imate, imaju**; verneint **nemam, nemaš, nema…** **Ima** heißt auch *es gibt*, **nema** *es gibt nicht*, mit Genitiv: **Nema kruha / hleba** (es gibt kein Brot). **Nemam vremena** (ich habe keine Zeit).
  sh-questions:
    meaning: "Fragewörter; li und da li"
    intro: |
      **što / šta** (was), **tko / ko** (wer), **gdje / gde** (wo), **kamo / kuda** (wohin), **kada** (wann), **zašto** (warum), **kako** (wie), **koliko** (wie viel). Ja/Nein-Fragen: Verb + **li** (**Govoriš li…?**) oder **da li** + Verb (**Da li govoriš…?**, in Serbien üblich).
  sh-ne:
    meaning: "Verneinung und doppelte Verneinung"
    intro: |
      **ne** vor dem Verb: **Ne razumijem** (ich verstehe nicht); mit *sein*, *haben* und *wollen* verschmilzt es: **nisam, nemam, neću**. Doppelte Verneinung ist die Regel: **Nitko / niko ništa ne zna** (niemand weiß etwas), **Nikad nisam bio tamo** (ich war nie dort).
  sh-acc:
    meaning: "Akkusativ: das direkte Objekt; wohin"
    intro: |
      Feminin **-a → -u** (**knjiga → knjigu**); maskuline Dinge bleiben (**vidim grad**), maskuline Personen und Tiere nehmen **-a** (**vidim prijatelja**); Neutra bleiben. Auch *wohin* nach **u, na** (**idem u školu** ich gehe in die Schule, **na posao** zur Arbeit) und Zeit (**svaki dan** jeden Tag).
  sh-gen:
    meaning: "Genitiv: von, aus, etwas, nach Zahlen"
    intro: |
      Maskulin/neutral **-a** (**grada, sela**), feminin **-e** (**kuće**), Plural **-a** (mit langem Vokal) oder **-i**. *Von* (**kuća moga oca** das Haus meines Vaters), *aus* nach **iz, od** (**iz Zagreba**), nach **bez, do, kod, blizu, zbog**, *etwas* (**daj mi vode** gib mir Wasser) und nach Zahlen ab fünf (**pet godina** fünf Jahre) sowie **mnogo, malo, koliko**.
  sh-loc:
    meaning: "Lokativ: in, auf, über"
    intro: |
      Immer nach einer Präposition: **u** (in), **na** (auf, an), **o** (über), **po** (umher, entlang), **pri**. Maskulin/neutral **-u** (**u gradu** in der Stadt, **na moru** am Meer), feminin **-i** (**u kući** im Haus, **na ulici** auf der Straße), Plural **-ima / -ama**. **Živim u Zagrebu** (ich wohne in Zagreb). **Pričamo o filmu** (wir sprechen über den Film).
  sh-numbers:
    meaning: "Zahlen und das Nomen danach"
    intro: |
      **jedan (jedna, jedno), dva (dvije / dve), tri, četiri, pet, šest, sedam, osam, devet, deset**, **jedanaest… dvadeset, sto, tisuća / hiljada**. Nach **2, 3, 4** eine besondere Form (alter Dual, = Genitiv Singular): **dva grada, tri kuće**; ab **5** der Genitiv Plural: **pet gradova, deset kuća**.
  sh-days:
    meaning: "Tage und Zeitwörter"
    intro: |
      **ponedjeljak / ponedeljak** (Montag), **utorak, srijeda / sreda, četvrtak, petak, subota, nedjelja / nedelja**. *Am Montag* = **u ponedjeljak**. **danas** (heute), **sutra** (morgen), **jučer / juče** (gestern), **sada** (jetzt), **ujutro, navečer / uveče** (am Morgen, am Abend).
  sh-dat:
    meaning: "Dativ: wem; es gefällt mir"
    intro: |
      Maskulin/neutral **-u** (**prijatelju**), feminin **-i** (**mami, ženi**), Plural **-ima / -ama**. Indirektes Objekt (**Dajem prijatelju poklon** ich gebe dem Freund ein Geschenk), *gefallen* (**Sviđa mi se** es gefällt mir), Empfindungen (**Hladno mi je** mir ist kalt) und nach **k / ka, prema**.
  sh-ins:
    meaning: "Instrumental: mit, durch"
    intro: |
      Maskulin/neutral **-om / -em** (**autobusom, prijateljem**), feminin **-om** (**sestrom, olovkom**), Plural **-ima / -ama**. Mittel (**pišem olovkom** ich schreibe mit dem Bleistift, **idem autobusom** ich fahre mit dem Bus), Begleitung mit **s / sa** (**sa sestrom** mit der Schwester) und nach **pod, nad, pred, među, za** für den Ort.
  sh-voc:
    meaning: "Vokativ: jemanden rufen"
    intro: |
      Gebraucht, wann immer man jemanden anspricht: **Ivan → Ivane!**, **prijatelj → prijatelju!**, **gospodin → gospodine!**, **Ana → Ana! / Ano!**, **mama → mama!**, **sestra → sestro!**. Häufig in Grüßen und Briefen: **Dragi Marko!** (Lieber Marko!)
  sh-past:
    meaning: "die Vergangenheit: biti + das l-Partizip"
    intro: |
      Die Alltagsvergangenheit (*Perfekt*) ist die Kurzform von **biti** + ein Partizip, das in Genus und Numerus kongruiert: **radio / radila / radilo, radili / radile / radila**. **Ja sam radio** (m.), **ja sam radila** (f.); **Bio sam u Beogradu** (ich war in Belgrad). Ohne Pronomen steht das Hilfsverb an zweiter Stelle: **Radila sam cijeli dan** (ich habe den ganzen Tag gearbeitet).
  sh-future:
    meaning: "das Futur: ću + Infinitiv"
    intro: |
      **ću, ćeš, će, ćemo, ćete, će** + Infinitiv: **Ja ću raditi** oder ohne Pronomen **Radit ću** (kroatische Schreibung) / **Radiću** (serbisch, in einem Wort). Verneint: **neću, nećeš…** (**Neću doći** ich werde nicht kommen). In Serbien auch **ću da** + Präsens: **Ja ću da radim.**
  sh-aspect:
    meaning: "Aspekt: unvollendet und vollendet"
    intro: |
      Die meisten Verben kommen paarweise: *imperfektiv* für eine laufende oder wiederholte Handlung, *perfektiv* für eine abgeschlossene. **Pisao sam pismo** (ich schrieb an einem Brief) gegenüber **Napisao sam pismo** (ich habe ihn geschrieben, fertig). Perfektive entstehen mit Präfixen (**pisati → napisati**, **čitati → pročitati**) oder einem anderen Stamm (**kupovati → kupiti**, **davati → dati**).
  sh-adj:
    meaning: "Adjektive kongruieren; Steigerung"
    intro: |
      Adjektive kongruieren in Genus, Numerus und Kasus: **dobar čovjek, dobra žena, dobro dijete; s dobrim prijateljem.** Komparativ **-iji / -ji** (**star → stariji**, **lijep → ljepši**), unregelmäßig **dobar → bolji, loš → gori, velik → veći**; Superlativ **naj-** (**najbolji**). *Als* = **od** + Genitiv oder **nego**.
  sh-se:
    meaning: "se: reflexive Verben"
    intro: |
      **se** (und **sebe**) macht ein Verb reflexiv oder reziprok: **prati → prati se** (sich waschen), **igrati se** (spielen), **smijati se** (lachen), **zvati se** (heißen: **Kako se zoveš?** wie heißt du? **Zovem se Ana.**). Wie die Kurzformen von *biti* steht **se** an zweiter Stelle im Satz.
