# German text of the Serbo-Croatian course, B1–C2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Moods: "Modi"
  Clauses: "Nebensätze"
  Literary tenses and participles: "Literarische Tempora und Partizipien"
  Talking about ideas: "Über Ideen sprechen"
  Dialects and literature: "Dialekte und Literatur"
lessons:
  sh-conditional:
    meaning: "der Konditional: würde"
    intro: |
      **bih, bi, bi, bismo, biste, bi** + l-Partizip: **Ja bih htio / htjela kavu** (ich hätte gern einen Kaffee), **Bilo bi lijepo** (das wäre schön). Irreale Bedingungen mit **kad / kada** oder **da**: **Kad bih imao vremena, došao bih** (wenn ich Zeit hätte, käme ich).
  sh-imperative:
    meaning: "der Imperativ"
    intro: |
      Vom Präsensstamm: **čitaj, čitajte** (lies!, lest!), **govori, govorite** (sprich!), **piši, pišite** (schreib!); *lasst uns* ist **-mo** (**čitajmo**) oder einfach **idemo!** (gehen wir!). Verneinte Befehle mit **nemoj** + Infinitiv: **Nemoj brinuti** (keine Sorge).
  sh-koji:
    meaning: "welcher, der: Relativsätze"
    intro: |
      **koji / koja / koje** nimmt Genus und Numerus vom Nomen, den Kasus aus dem eigenen Satz: **Čovjek koji tamo stoji je moj otac** (der Mann, der dort steht, ist mein Vater). **Knjiga koju čitam je zanimljiva** (das Buch, das ich lese, ist interessant). **što / šta** nach *sve, ono*: **Sve što kažeš** (alles, was du sagst).
  sh-conjunctions:
    meaning: "Sätze verbinden"
    intro: |
      **da** (dass; um zu: **Želim da dođeš** ich möchte, dass du kommst), **jer** (weil), **ako** (wenn, falls), **kad / kada** (als, wenn), **iako** (obwohl), **dok** (während), **ali / no** (aber), **pa** (und so), **zato što** (weil). **Idem kući jer sam umoran** (ich gehe nach Hause, weil ich müde bin).
  sh-clitics:
    meaning: "die Reihenfolge der kleinen Wörter"
    intro: |
      Kurze Pronomen und Hilfsverben stehen gebündelt an zweiter Stelle, in fester Reihenfolge: **li** – Hilfsverb (**sam, ću, bih**) – Dativ – Akkusativ – **se** – **je**: **Dao sam mu ga** (ich habe es ihm gegeben), **Hoćeš li mi ga dati?**, **Sviđa mi se.** Nur **je** steht nach **se**: **Smijao se je** → meist **Smijao se.**
  sh-aorist:
    meaning: "Aorist und Imperfekt"
    intro: |
      Schrift und lebhaftes Erzählen bewahren zwei einfache Vergangenheiten. Der *Aorist*, meist von Perfektiven, für eine eben abgeschlossene Handlung: **rekoh, reče, rekosmo, rekoše** (ich sagte, er sagte…), **Dođe i ode** (er kam und ging). Das *Imperfekt*, seltener, für einen vergangenen Zustand: **bijaše** (war), **govoraše**. Die Alltagsvergangenheit ist das Perfekt.
  sh-passive:
    meaning: "das Passivpartizip"
    intro: |
      **-n / -en / -t** (**napisan, prodan / prodat, otvoren, uzet**), kongruierend wie Adjektive: **Pismo je napisano** (der Brief ist geschrieben). **Kuća je prodana** (das Haus ist verkauft). Die Rede nimmt oft **se**: **Ovdje se govori engleski** (hier wird Englisch gesprochen), **Kuća se prodaje** (Haus zu verkaufen).
  sh-gerund:
    meaning: "Adverbialpartizipien: tuend, getan habend"
    intro: |
      **-ći** (Präsens, Imperfektive): **Čitajući knjigu, zaspao je** (beim Lesen eines Buches schlief er ein). **-vši** (Vergangenheit, Perfektive): **Pročitavši pismo, otišla je** (nachdem sie den Brief gelesen hatte, ging sie). Meist Schriftsprache.
  sh-abstract:
    meaning: "abstrakte Nomen und Wortbildung"
    intro: |
      **-ost** (**jednakost** Gleichheit, **mladost** Jugend), **-stvo** (**prijateljstvo** Freundschaft, **djetinjstvo** Kindheit), **-nje / -enje** von Verben (**čitanje** Lesen, **razumijevanje** Verständnis), **-ba** (**borba** Kampf). Das Kroatische bevorzugt eigene Wörter, wo das Serbische internationale behält: **zrakoplov / avion** (Flugzeug), **znanost / nauka** (Wissenschaft), **glazba / muzika** (Musik).
  sh-variants:
    meaning: "die vier Standards: Kroatisch, Serbisch, Bosnisch, Montenegrinisch"
    intro: |
      Eine Sprache, vier Standards, einige hundert verschiedene Wörter: **kruh / hljeb / hleb** (Brot), **tisuća / hiljada** (tausend), **vlak / voz** (Zug), **tjedan / sedmica / nedelja** (Woche), **kava / kafa** (Kaffee) und kroatisch **tko, što** gegenüber **ko, šta**. Die Grammatik ist dieselbe; die Sprecher verstehen einander vollständig.
  sh-dialects:
    meaning: "Štokavisch, Kajkavisch, Čakavisch"
    intro: |
      Die Dialekte sind nach ihrem Wort für *was* benannt: **što / šta** (Štokavisch, Grundlage aller vier Standards), **kaj** (Kajkavisch, um Zagreb), **ča** (Čakavisch, Istrien und die Inseln). In allen dreien gibt es Literatur: Krleža schrieb kajkavische Verse, Marulić (1501) čakavisch.
  sh-literature:
    meaning: "die Klassiker lesen"
    intro: |
      Am Anfang stehen die von Vuk Karadžić gesammelten Volksepen (ab 1814) und die Ballade *Hasanaginica*; Njegošs *Gorski vijenac* (1847) in altem Montenegrinisch; im 20. Jahrhundert Ivo Andrić (Nobelpreis 1961, *Na Drini ćuprija*), Miroslav Krleža und Meša Selimović (*Derviš i smrt*). Volks- und alte Texte gebrauchen Aorist, Imperfekt und archaische Formen, die der Leser vielleicht nicht kennt.
