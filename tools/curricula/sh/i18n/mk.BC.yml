# Macedonian text of the Serbo-Croatian course, B1–C2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Moods: "Начини"
  Clauses: "Реченици"
  Literary tenses and participles: "Книжевни времиња и партиципи"
  Talking about ideas: "Разговор за идеи"
  Dialects and literature: "Дијалекти и литература"
lessons:
  sh-conditional:
    meaning: "кондиционал: би"
    intro: |
      **bih, bi, bi, bismo, biste, bi** + л-партиципот: **Ja bih htio / htjela kavu** (би сакал кафе), **Bilo bi lijepo** (би било убаво). Нереални услови со **kad / kada** или **da**: **Kad bih imao vremena, došao bih** (да имам време, би дошол).
  sh-imperative:
    meaning: "императив"
    intro: |
      Од основата на сегашното: **čitaj, čitajte** (читај!, читајте!), **govori, govorite** (зборувај!), **piši, pišite** (пиши!); *ајде да* е **-mo** (**čitajmo**) или просто **idemo!** (одиме!). Одречни заповеди со **nemoj** + инфинитив: **Nemoj brinuti** (не грижи се).
  sh-koji:
    meaning: "кој, што: релативни реченици"
    intro: |
      **koji / koja / koje** зема род и број од именката, а падеж од својата реченица: **Čovjek koji tamo stoji je moj otac** (човекот што стои таму е татко ми). **Knjiga koju čitam je zanimljiva** (книгата што ја читам е интересна). **što / šta** по *sve, ono*: **Sve što kažeš** (сè што ќе кажеш).
  sh-conjunctions:
    meaning: "поврзување реченици"
    intro: |
      **da** (дека; да: **Želim da dođeš** сакам да дојдеш), **jer** (зашто), **ako** (ако), **kad / kada** (кога), **iako** (иако), **dok** (додека), **ali / no** (но), **pa** (па), **zato što** (затоа што). **Idem kući jer sam umoran** (одам дома зашто сум уморен).
  sh-clitics:
    meaning: "редот на кратките зборови"
    intro: |
      Кратките заменки и помошни глаголи се групираат на второ место, по утврден ред: **li** – помошен глагол (**sam, ću, bih**) – датив – акузатив – **se** – **je**: **Dao sam mu ga** (му го дадов), **Hoćeš li mi ga dati?**, **Sviđa mi se.** Само **je** доаѓа по **se**: **Smijao se je** → обично **Smijao se.**
  sh-aorist:
    meaning: "аорист и имперфект"
    intro: |
      Писмото и живото раскажување чуваат две прости минати времиња — како македонските: *аорист*, главно од свршени, за штотуку завршено дејство: **rekoh, reče, rekosmo, rekoše** (реков, рече…), **Dođe i ode** (дојде и отиде). *Имперфект*, поредок, за минато состојба: **bijaše** (беше), **govoraše**. Секојдневното минато е перфектот.
  sh-passive:
    meaning: "пасивен партицип"
    intro: |
      **-n / -en / -t** (**napisan, prodan / prodat, otvoren, uzet**), се согласува како придавка: **Pismo je napisano** (писмото е напишано). **Kuća je prodana** (куќата е продадена). Говорот често користи **se**: **Ovdje se govori engleski** (тука се зборува англиски), **Kuća se prodaje** (се продава куќа).
  sh-gerund:
    meaning: "глаголски прилози: правејќи, откако направил"
    intro: |
      **-ći** (сегашен, несвршени): **Čitajući knjigu, zaspao je** (читајќи книга, заспа). **-vši** (минат, свршени): **Pročitavši pismo, otišla je** (откако го прочита писмото, отиде). Главно во писмото.
  sh-abstract:
    meaning: "апстрактни именки и зборообразување"
    intro: |
      **-ost** (**jednakost** еднаквост, **mladost** младост), **-stvo** (**prijateljstvo** пријателство, **djetinjstvo** детство), **-nje / -enje** од глаголи (**čitanje** читање, **razumijevanje** разбирање), **-ba** (**borba** борба). Хрватскиот претпочита домашни зборови таму каде што српскиот ги задржува меѓународните: **zrakoplov / avion** (авион), **znanost / nauka** (наука), **glazba / muzika** (музика).
  sh-variants:
    meaning: "четирите стандарди: хрватски, српски, босански, црногорски"
    intro: |
      Еден јазик, четири стандарди, неколку стотини различни зборови: **kruh / hljeb / hleb** (леб), **tisuća / hiljada** (илјада), **vlak / voz** (воз), **tjedan / sedmica / nedelja** (недела), **kava / kafa** (кафе), и хрватското **tko, što** наспроти **ko, šta**. Граматиката е иста; говорителите потполно се разбираат.
  sh-dialects:
    meaning: "штокавски, кајкавски, чакавски"
    intro: |
      Дијалектите се именувани по зборот за *што*: **što / šta** (штокавски, основа на четирите стандарди), **kaj** (кајкавски, околу Загреб), **ča** (чакавски, Истра и островите). Литература има на сите три: Крлежа пишувал кајкавски стихови, Марулиќ (1501) на чакавски.
  sh-literature:
    meaning: "читање на класиците"
    intro: |
      На почетокот стојат народните епови што ги собрал Вук Караџиќ (од 1814) и баладата *Хасанагиница*; *Горски вијенац* (1847) на Његош на стар црногорски; во 20 век Иво Андриќ (Нобелова награда 1961, *На Дрина ќуприја*), Мирослав Крлежа и Меша Селимовиќ (*Дервишот и смртта*). Народните и старите текстови го користат аористот, имперфектот и архаични форми што читачот можеби не ги знае.
