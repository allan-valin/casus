# Arabic text of the Serbo-Croatian course, A1–A2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "الأصوات والحروف"
  Nouns and gender: "الأسماء والجنس"
  Pronouns and the present: "الضمائر والمضارع"
  Questions and negation: "الأسئلة والنفي"
  The cases (1): "الحالات الإعرابية (1)"
  Numbers and time: "الأعداد والزمن"
  The cases (2): "الحالات الإعرابية (2)"
  Past and future: "الماضي والمستقبل"
  Adjectives and little words: "الصفات والكلمات الصغيرة"
lessons:
  sh-alphabet:
    meaning: "أبجديتان، صوت واحد لكل حرف"
    intro: |
      تُكتب الصربية الكرواتية كما تُنطق، بالحروف اللاتينية أو السيريلية، حرفًا بحرف: **č / ч** (تش صلبة)، **ć / ћ** (تش ليّنة)، **dž / џ** (ج صلبة)، **đ / ђ** (ج ليّنة)، **š / ш** (ش)، **ž / ж** (ج شامية)، **lj / љ، nj / њ** (لي، ني)، **c / ц** (تس)، **j / ј** (ي). تكتب كرواتيا والبوسنة باللاتينية غالبًا، وصربيا والجبل الأسود بالاثنتين. والقارئ يقرأ الاثنتين.
  sh-ije:
    meaning: "اللفظ الإييكافي والإيكافي"
    intro: |
      صوت قديم (*يات*) يظهر بطريقتين: **ije / je** في كرواتيا والبوسنة والجبل الأسود (*الإييكافي*: **mlijeko, dijete, rijeka, lijep**)، و**e** في معظم صربيا (*الإيكافي*: **mleko, dete, reka, lep**). كلاهما فصيح. تكتب الدروس بالإييكافي وتذكر الصيغة الإيكافية.
  sh-gender:
    meaning: "ثلاثة أجناس تُعرف من النهاية"
    intro: |
      المذكّر: حرف ساكن (**grad** مدينة، **stol / sto** طاولة، **prijatelj** صديق)؛ المؤنّث: **-a** (**žena** امرأة، **kuća** بيت) وبعضه بحرف ساكن (**stvar** شيء، **noć** ليل، **ljubav** حب)؛ المحايد: **-o, -e** (**selo** قرية، **more** بحر). لا أداة تعريف.
  sh-plural:
    meaning: "الجمع في حالة الرفع"
    intro: |
      المذكّر **-i**، وكثيرًا **-ovi / -evi** في الأسماء القصيرة (**grad → gradovi**، **prijatelj → prijatelji**، **muž → muževi**)؛ المؤنّث **-e** (**žene, kuće**)، والمؤنّث المنتهي بساكن **-i** (**stvari**)؛ المحايد **-a** (**sela, mora**). الشاذ: **čovjek → ljudi** (ناس)، **dijete → djeca** (أطفال)، **oko → oči** (عيون).
  sh-pronouns:
    meaning: "الضمائر الشخصية"
    intro: |
      **ja** (أنا)، **ti** (أنت)، **on / ona / ono** (هو / هي / للمحايد)، **mi** (نحن)، **vi** (أنتم، وصيغة الاحترام، وفي الرسائل **Vi**)، **oni / one / ona** (هم، مذكّر / مؤنّث / محايد). نهاية الفعل تدلّ على الشخص فيُحذف الضمير عادة: **Radim** = أعمل.
  sh-present:
    meaning: "المضارع: -am، -im، -em"
    intro: |
      ثلاثة أنواع بحسب المتكلّم: **-am** (**čitati → čitam, čitaš, čita, čitamo, čitate, čitaju**)، **-im** (**govoriti → govorim, govoriš, govori, govorimo, govorite, govore**)، **-em** (**pisati → pišem, pišeš, piše, pišemo, pišete, pišu**). احفظ كل فعل مع صيغة المتكلّم.
  sh-biti:
    meaning: "biti، الكون: الصيغ القصيرة والطويلة والمنفية"
    intro: |
      الصيغ القصيرة، ولا تأتي أبدًا أول الجملة: **sam, si, je, smo, ste, su** (**Ja sam student. Student sam.**)؛ والطويلة للتوكيد والسؤال: **jesam, jesi, jest(e)…** (**Jesi li umoran?** هل أنت متعب؟)؛ والمنفية: **nisam, nisi, nije, nismo, niste, nisu**.
  sh-imati:
    meaning: "الملكية؛ يوجد (ima)، لا يوجد (nema)"
    intro: |
      **imati**: **imam, imaš, ima, imamo, imate, imaju**؛ والنفي **nemam, nemaš, nema…** و**ima** تعني أيضًا *يوجد*، و**nema** *لا يوجد*، مع حالة الإضافة: **Nema kruha / hleba** (لا يوجد خبز). **Nemam vremena** (ليس عندي وقت).
  sh-questions:
    meaning: "أدوات الاستفهام؛ li و da li"
    intro: |
      **što / šta** (ماذا)، **tko / ko** (من)، **gdje / gde** (أين)، **kamo / kuda** (إلى أين)، **kada** (متى)، **zašto** (لماذا)، **kako** (كيف)، **koliko** (كم). أسئلة نعم/لا: الفعل + **li** (**Govoriš li…?**) أو **da li** + الفعل (**Da li govoriš…?**، شائعة في صربيا).
  sh-ne:
    meaning: "النفي والنفي المزدوج"
    intro: |
      **ne** قبل الفعل: **Ne razumijem** (لا أفهم)؛ ومع *الكون* و*الملك* و*الإرادة* يندمج: **nisam, nemam, neću**. النفي المزدوج قاعدة: **Nitko / niko ništa ne zna** (لا أحد يعرف شيئًا)، **Nikad nisam bio tamo** (لم أكن هناك قط).
  sh-acc:
    meaning: "حالة النصب: المفعول به؛ إلى أين"
    intro: |
      المؤنّث **-a → -u** (**knjiga → knjigu**)؛ الأشياء المذكّرة لا تتغيّر (**vidim grad**)، والأشخاص والحيوانات المذكّرة تأخذ **-a** (**vidim prijatelja**)؛ المحايد لا يتغيّر. وتدلّ أيضًا على *إلى أين* بعد **u, na** (**idem u školu** أذهب إلى المدرسة، **na posao** إلى العمل) وعلى الزمن (**svaki dan** كل يوم).
  sh-gen:
    meaning: "حالة الإضافة: لـ، من، بعضُ، بعد الأعداد"
    intro: |
      المذكّر والمحايد **-a** (**grada, sela**)، المؤنّث **-e** (**kuće**)، والجمع **-a** (بحركة طويلة) أو **-i**. للإضافة (**kuća moga oca** بيت أبي)، و*من* بعد **iz, od** (**iz Zagreba** من زغرب)، وبعد **bez, do, kod, blizu, zbog**، ولمعنى *بعض* (**daj mi vode** أعطني ماءً)، وبعد الأعداد من خمسة (**pet godina** خمس سنوات) وبعد **mnogo, malo, koliko**.
  sh-loc:
    meaning: "حالة الظرفية: في، على، عن"
    intro: |
      دائمًا بعد حرف جر: **u** (في)، **na** (على)، **o** (عن)، **po** (في أنحاء، على طول)، **pri**. المذكّر والمحايد **-u** (**u gradu** في المدينة، **na moru** على البحر)، والمؤنّث **-i** (**u kući** في البيت، **na ulici** في الشارع)، والجمع **-ima / -ama**. **Živim u Zagrebu** (أسكن في زغرب). **Pričamo o filmu** (نتحدّث عن الفيلم).
  sh-numbers:
    meaning: "الأعداد والاسم بعدها"
    intro: |
      **jedan (jedna, jedno), dva (dvije / dve), tri, četiri, pet, šest, sedam, osam, devet, deset**، **jedanaest… dvadeset, sto, tisuća / hiljada**. بعد **2 و3 و4** صيغة خاصة (المثنّى القديم = إضافة المفرد): **dva grada, tri kuće**؛ ومن **5** جمع الإضافة: **pet gradova, deset kuća**.
  sh-days:
    meaning: "الأيام وكلمات الزمن"
    intro: |
      **ponedjeljak / ponedeljak** (الاثنين)، **utorak, srijeda / sreda, četvrtak, petak, subota, nedjelja / nedelja**. *يوم الاثنين* = **u ponedjeljak**. **danas** (اليوم)، **sutra** (غدًا)، **jučer / juče** (أمس)، **sada** (الآن)، **ujutro, navečer / uveče** (صباحًا، مساءً).
  sh-dat:
    meaning: "حالة القابل: لمن؛ يعجبني"
    intro: |
      المذكّر والمحايد **-u** (**prijatelju**)، المؤنّث **-i** (**mami, ženi**)، والجمع **-ima / -ama**. المفعول غير المباشر (**Dajem prijatelju poklon** أعطي الصديق هدية)، و*الإعجاب* (**Sviđa mi se** يعجبني)، والمشاعر (**Hladno mi je** أشعر بالبرد)، وبعد **k / ka, prema**.
  sh-ins:
    meaning: "حالة الآلة: مع، بـ"
    intro: |
      المذكّر والمحايد **-om / -em** (**autobusom, prijateljem**)، المؤنّث **-om** (**sestrom, olovkom**)، والجمع **-ima / -ama**. الوسيلة (**pišem olovkom** أكتب بالقلم، **idem autobusom** أذهب بالحافلة)، والمصاحبة مع **s / sa** (**sa sestrom** مع الأخت)، وبعد **pod, nad, pred, među, za** للمكان.
  sh-voc:
    meaning: "حالة النداء"
    intro: |
      تُستعمل كلما خاطبت أحدًا: **Ivan → Ivane!**، **prijatelj → prijatelju!**، **gospodin → gospodine!**، **Ana → Ana! / Ano!**، **mama → mama!**، **sestra → sestro!**. وتكثر في التحيات والرسائل: **Dragi Marko!** (عزيزي ماركو!)
  sh-past:
    meaning: "الماضي: biti + اسم الفاعل المنتهي بـ-l"
    intro: |
      الماضي اليومي (*البرفكت*) هو الصيغة القصيرة لـ**biti** + اسم فاعل يطابق في الجنس والعدد: **radio / radila / radilo, radili / radile / radila**. **Ja sam radio** (مذكّر)، **ja sam radila** (مؤنّث)؛ **Bio sam u Beogradu** (كنت في بلغراد). وإذا حُذف الضمير جاء الفعل المساعد ثانيًا: **Radila sam cijeli dan** (عملت طوال اليوم).
  sh-future:
    meaning: "المستقبل: ću + المصدر"
    intro: |
      **ću, ćeš, će, ćemo, ćete, će** + المصدر: **Ja ću raditi** أو بلا ضمير **Radit ću** (الإملاء الكرواتي) / **Radiću** (الصربي، كلمة واحدة). والنفي: **neću, nećeš…** (**Neću doći** لن آتي). وفي صربيا أيضًا **ću da** + المضارع: **Ja ću da radim.**
  sh-aspect:
    meaning: "الجهة: الناقص والتام"
    intro: |
      معظم الأفعال أزواج: *ناقص* للفعل المستمر أو المتكرّر، و*تام* للفعل المنجز. **Pisao sam pismo** (كنت أكتب رسالة) مقابل **Napisao sam pismo** (كتبتها وأنهيتها). يُصاغ التام بالسوابق (**pisati → napisati**، **čitati → pročitati**) أو بجذر آخر (**kupovati → kupiti**، **davati → dati**).
  sh-adj:
    meaning: "الصفات تطابق؛ التفضيل"
    intro: |
      الصفة تطابق في الجنس والعدد والحالة: **dobar čovjek, dobra žena, dobro dijete; s dobrim prijateljem.** والتفضيل **-iji / -ji** (**star → stariji**، **lijep → ljepši**)، والشاذ **dobar → bolji، loš → gori، velik → veći**؛ والأفعل **naj-** (**najbolji**). *من* = **od** + الإضافة أو **nego**.
  sh-se:
    meaning: "se: الأفعال الانعكاسية"
    intro: |
      **se** (و**sebe**) تجعل الفعل انعكاسيًا أو تبادليًا: **prati → prati se** (يغتسل)، **igrati se** (يلعب)، **smijati se** (يضحك)، **zvati se** (يُسمّى: **Kako se zoveš?** ما اسمك؟ **Zovem se Ana.**). وكالصيغ القصيرة لـ*biti* تأتي **se** في المرتبة الثانية من الجملة.
