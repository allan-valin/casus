# Arabic text of the Serbo-Croatian course, B1–C2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Moods: "الصيغ"
  Clauses: "الجمل"
  Literary tenses and participles: "الأزمنة الأدبية وأسماء الفاعل والمفعول"
  Talking about ideas: "الحديث عن الأفكار"
  Dialects and literature: "اللهجات والأدب"
lessons:
  sh-conditional:
    meaning: "الشرطي: لَـ…"
    intro: |
      **bih, bi, bi, bismo, biste, bi** + اسم الفاعل بـ-l: **Ja bih htio / htjela kavu** (أودّ قهوة)، **Bilo bi lijepo** (سيكون جميلًا). والشرط غير الواقع بـ**kad / kada** أو **da**: **Kad bih imao vremena, došao bih** (لو كان عندي وقت لأتيت).
  sh-imperative:
    meaning: "الأمر"
    intro: |
      من جذر المضارع: **čitaj, čitajte** (اقرأ، اقرؤوا)، **govori, govorite** (تكلّم)، **piši, pišite** (اكتب)؛ و*هيا بنا* **-mo** (**čitajmo**) أو ببساطة **idemo!** (هيا نذهب). والنهي بـ**nemoj** + المصدر: **Nemoj brinuti** (لا تقلق).
  sh-koji:
    meaning: "الذي: جمل الصلة"
    intro: |
      **koji / koja / koje** يأخذ الجنس والعدد من الاسم والحالة من جملته: **Čovjek koji tamo stoji je moj otac** (الرجل الواقف هناك أبي). **Knjiga koju čitam je zanimljiva** (الكتاب الذي أقرؤه ممتع). و**što / šta** بعد *sve, ono*: **Sve što kažeš** (كل ما تقوله).
  sh-conjunctions:
    meaning: "ربط الجمل"
    intro: |
      **da** (أنّ؛ لكي: **Želim da dođeš** أريد أن تأتي)، **jer** (لأنّ)، **ako** (إذا)، **kad / kada** (عندما)، **iako** (مع أنّ)، **dok** (بينما)، **ali / no** (لكن)، **pa** (فـ)، **zato što** (لأنّ). **Idem kući jer sam umoran** (أذهب إلى البيت لأنني متعب).
  sh-clitics:
    meaning: "ترتيب الكلمات القصيرة"
    intro: |
      الضمائر القصيرة والأفعال المساعدة تتجمّع في المرتبة الثانية بترتيب ثابت: **li** – المساعد (**sam, ću, bih**) – القابل – المفعول – **se** – **je**: **Dao sam mu ga** (أعطيته إياه)، **Hoćeš li mi ga dati?**، **Sviđa mi se.** ولا يأتي بعد **se** إلا **je**: **Smijao se je** ← غالبًا **Smijao se.**
  sh-aorist:
    meaning: "الأوريست والماضي الناقص"
    intro: |
      تحفظ الكتابة والسرد الحيّ ماضيين بسيطين. *الأوريست*، غالبًا من التامّ، لفعل انتهى للتوّ: **rekoh, reče, rekosmo, rekoše** (قلتُ، قال…)، **Dođe i ode** (جاء وذهب). و*الماضي الناقص*، أندر، لحالة ماضية: **bijaše** (كان)، **govoraše**. والماضي اليومي هو البرفكت.
  sh-passive:
    meaning: "اسم المفعول"
    intro: |
      **-n / -en / -t** (**napisan, prodan / prodat, otvoren, uzet**)، يطابق كالصفات: **Pismo je napisano** (الرسالة مكتوبة). **Kuća je prodana** (بيع البيت). والكلام يستعمل **se** كثيرًا: **Ovdje se govori engleski** (تُتكلّم الإنجليزية هنا)، **Kuća se prodaje** (البيت للبيع).
  sh-gerund:
    meaning: "الأحوال الفعلية: فاعلًا، وقد فعل"
    intro: |
      **-ći** (الحاضر، من الناقص): **Čitajući knjigu, zaspao je** (وهو يقرأ كتابًا نام). **-vši** (الماضي، من التام): **Pročitavši pismo, otišla je** (بعد أن قرأت الرسالة ذهبت). غالبًا في الكتابة.
  sh-abstract:
    meaning: "الأسماء المجرّدة وبناء الكلمات"
    intro: |
      **-ost** (**jednakost** مساواة، **mladost** شباب)، **-stvo** (**prijateljstvo** صداقة، **djetinjstvo** طفولة)، **-nje / -enje** من الأفعال (**čitanje** قراءة، **razumijevanje** فهم)، **-ba** (**borba** نضال). تفضّل الكرواتية الكلمات المحلّية حيث تحتفظ الصربية بالدولية: **zrakoplov / avion** (طائرة)، **znanost / nauka** (علم)، **glazba / muzika** (موسيقى).
  sh-variants:
    meaning: "المعايير الأربعة: الكرواتية والصربية والبوسنية والجبلية"
    intro: |
      لغة واحدة، أربعة معايير، وبضع مئات من الكلمات المختلفة: **kruh / hljeb / hleb** (خبز)، **tisuća / hiljada** (ألف)، **vlak / voz** (قطار)، **tjedan / sedmica / nedelja** (أسبوع)، **kava / kafa** (قهوة)، والكرواتية **tko, što** مقابل **ko, šta**. القواعد واحدة، والمتكلّمون يتفاهمون تمامًا.
  sh-dialects:
    meaning: "الشتوكافية والكايكافية والتشاكافية"
    intro: |
      سُمّيت اللهجات بكلمتها لـ*ماذا*: **što / šta** (الشتوكافية، أساس المعايير الأربعة)، **kaj** (الكايكافية، حول زغرب)، **ča** (التشاكافية، في إستريا والجزر). وللثلاث أدب: كتب كرليجا شعرًا كايكافيًا، وماروليتش (1501) بالتشاكافية.
  sh-literature:
    meaning: "قراءة الكلاسيكيات"
    intro: |
      في البداية الملاحم الشعبية التي جمعها فوك كاراجيتش (منذ 1814) وأغنية *حسن آغينيتسا*؛ ثم *إكليل الجبل* (1847) لنيغوش بلغة الجبل الأسود القديمة؛ وفي القرن العشرين إيفو أندريتش (نوبل 1961، *جسر على نهر درينا*) وميروسلاف كرليجا وميشا سليموفيتش (*الدرويش والموت*). النصوص الشعبية والقديمة تستعمل الأوريست والماضي الناقص وصيغًا قديمة قد لا يعرفها القارئ.
