# German text of the Turkish course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Narration and hearsay: "Erzählung und Hörensagen"
  Advanced subordination: "Fortgeschrittene Unterordnung"
  Formal register: "Formelles Register"
  Clause linking in depth: "Satzverknüpfung im Detail"
  Necessity and comparison of actions: "Notwendigkeit und Vergleich von Handlungen"
  Word-level nuance: "Nuancen auf Wortebene"
lessons:
  tr-pluperfect:
    meaning: "das Plusquamperfekt -mIştI: hatte getan"
    intro: |
      **-mış + -tı** (**-mişti, -muştu, -müştü**) stellt eine Handlung vor eine andere vergangene: **Ben vardığımda tren kalkmıştı.** „Als ich ankam, war der Zug schon abgefahren.“ Es setzt auch den Hintergrund einer Erzählung: **O gün çok yorulmuştum.** „An jenem Tag war ich sehr müde (geworden).“ Anders als bloßes **-mış** trägt es keinen Sinn von Hörensagen.
  tr-imis:
    meaning: "-(y)mIş an anderen Tempora und Nomen: angeblich"
    intro: |
      **-(y)mış** kann jedem Tempus oder einem Nomen folgen, um Hörensagen oder eine Entdeckung zu markieren:

      - **Geliyormuş.** „Er kommt angeblich.“ **Gelecekmiş.** „Er soll kommen.“ **Gelirmiş.** „Er käme, sagt man.“
      - **Hastaymış.** „Er ist krank, höre ich.“ **Evdeymiş.** „Sie ist anscheinend zu Hause.“

      Vergleiche **-(y)dı** (einfache Vergangenheit derselben Formen): **Geliyordu.** „Er kam gerade.“ **Hastaydı.** „Er war krank.“
  tr-dir:
    meaning: "-DIr: Gewissheit, Vermutung und förmliche Aussagen"
    intro: |
      **-dır / -dir / -dur / -dür** (**-tır …** nach stimmlosem Konsonanten) nach einem Nomen oder einer Verbform:

      - Definitionen und förmliche Aussagen: **Ankara Türkiye'nin başkentidir.** „Ankara ist die Hauptstadt der Türkei.“ **Sigara içmek yasaktır.** „Rauchen ist verboten.“
      - Vermutung: **Yorgundur.** „Er ist wohl müde.“ **Şimdiye kadar gelmiştir.** „Er ist inzwischen wohl angekommen.“

      Die Alltagssprache lässt es weg: **Yorgun.** „Er ist müde.“
  tr-casina:
    meaning: "-cAsInA: wie, als ob"
    intro: |
      **-casına / -cesine** (**-çasına** nach stimmlosem Konsonanten) heißt *wie, nach Art von*: **delicesine** „wie verrückt“, **çılgıncasına** „wild“. An **-mış** heißt es *als ob*: **Hiçbir şey olmamışçasına konuştu.** „Er sprach, als wäre nichts geschehen.“ **Beni tanımıyormuşçasına baktı.** „Sie sah mich an, als kenne sie mich nicht.“ Gesprochen nimmt man lieber **… gibi**.
  tr-ki:
    meaning: "die Konjunktion ki (aus dem Persischen)"
    intro: |
      **ki** leitet einen Satz in europäischer Stellung ein, nach dem Hauptverb:

      - *dass*: **Biliyorum ki haklısın.** „Ich weiß, dass du recht hast.“ **Umarım ki gelir.** „Ich hoffe, er kommt.“
      - Folge nach **öyle / o kadar … ki**: **O kadar yorgundum ki hemen uyudum.** „Ich war so müde, dass ich sofort einschlief.“
      - Zweck und Nachdruck: **Söyle ki bilsinler.** „Sag es, damit sie es wissen.“

      Getrennt geschrieben; das Suffix **-ki** (**evdeki**) ist etwas anderes.
  tr-diye:
    meaning: "diye: Zitieren, Benennen und Zweck"
    intro: |
      **diye** (wörtlich *sagend*) schließt ein Zitat oder einen Gedanken ab und verbindet ihn mit dem Verb:

      - Zitat: **"Geliyorum" diye bağırdı.** „Er rief: ‚Ich komme.‘“
      - Gedanke oder Grund: **Geç kalırım diye koştum.** „Ich rannte, weil ich dachte, ich käme zu spät.“
      - Zweck mit Optativ/Imperativ: **Uyanmasın diye sessiz konuştuk.** „Wir sprachen leise, damit er nicht aufwacht.“
      - Benennen: **Ali diye biri** „jemand namens Ali“
  tr-mekte:
    meaning: "-mAktA(dIr): die förmliche Verlaufsform"
    intro: |
      Nachrichten, Berichte und Amtstexte setzen eine laufende Handlung in **-makta / -mekte**, meist mit **-dır**: **Şirket yeni projeler üzerinde çalışmaktadır.** „Die Firma arbeitet an neuen Projekten.“ **Fiyatlar artmaktadır.** „Die Preise steigen.“ Gesprochen ist dasselbe **-yor**: **çalışıyor, artıyor**.
  tr-formal-connectors:
    meaning: "Konnektoren des geschriebenen Türkisch"
    intro: |
      Geschriebenes Türkisch verbindet Sätze mit:

      - Gegensatz: **ancak, fakat** (aber), **oysa, halbuki** (wohingegen, dabei), **buna rağmen** (trotzdem)
      - Ergänzung: **ayrıca** (außerdem), **üstelik** (zudem), **bunun yanı sıra** (daneben)
      - Folge: **dolayısıyla, bu nedenle, bu yüzden** (deshalb)
      - Erklärung: **çünkü** (weil), **zira** (denn, förmlich), **nitekim** (in der Tat), **mademki** (da ja)
  tr-loan-adverbs:
    meaning: "Adverbien aus dem Arabischen, oft auf -en"
    intro: |
      Viele häufige Adverbien stammen aus dem Arabischen, die meisten mit dessen Adverbendung **-en / -an**: **tamamen** (völlig), **kısmen** (teilweise), **umumiyetle** (im Allgemeinen; türkisch **genellikle**), **maalesef** (leider), **şahsen** (persönlich), **resmen** (offiziell, regelrecht), **aslen** (ursprünglich), **hakikaten** (wahrhaftig), **tesadüfen** (zufällig), **mecburen** (notgedrungen). Sie folgen nicht der Vokalharmonie.
  tr-politeness:
    meaning: "Höflichkeitsformeln"
    intro: |
      - **Buyurun** „bitte, nur zu, hier bitte, was kann ich für Sie tun?“
      - **Rica ederim** „gern geschehen“, auch „bitte (ich bitte Sie)“
      - **Efendim?** „Wie bitte?“ / „Ja?“ (am Telefon); **efendim** auch „mein Herr, meine Dame“
      - **Zahmet olmazsa** „wenn es keine Mühe macht“; **Kolay gelsin** „möge es leicht fallen“ (zu jemandem bei der Arbeit); **Geçmiş olsun** „gute Besserung“; **Ellerinize sağlık** „danke fürs Essen (Gesundheit Ihren Händen)“; **Afiyet olsun** „guten Appetit“
      - **siz** + 2. Plural für eine Person; **-(y)AbilIr misiniz?** „könnten Sie …?“
  tr-uzere:
    meaning: "-mAk üzere: im Begriff; um zu; unter der Bedingung"
    intro: |
      **-mak / -mek üzere** hat drei Verwendungen:

      - *im Begriff*: **Tren kalkmak üzere.** „Der Zug fährt gleich ab.“
      - *um zu* (förmlich): **Okumak üzere Ankara'ya gitti.** „Er ging nach Ankara, um zu studieren.“
      - *unter der Bedingung*: **Yarın geri vermek üzere aldım.** „Ich habe es unter der Bedingung genommen, es morgen zurückzugeben.“

      Verwandt: **-mak yerine** „anstatt“, **-mak için** „um zu“ (alltäglich).
  tr-digi-halde:
    meaning: "-DIğI + halde, takdirde, sürece, kadar, için"
    intro: |
      **-dik** + Possessiv + ein Nomen oder eine Postposition ergibt eine ganze Familie von Konjunktionen:

      - **-diği halde** „obwohl“: **Bildiği halde söylemedi.** „Obwohl er es wusste, sagte er es nicht.“
      - **-diği takdirde** „falls“ (förmlich): **Ödeme yapılmadığı takdirde …** „Falls keine Zahlung erfolgt …“
      - **-diği sürece** „solange“: **İstediğin sürece kalabilirsin.** „Du kannst bleiben, solange du willst.“
      - **-diği kadar** „soweit“: **Bildiğim kadarıyla** „soweit ich weiß“
      - **-diği için** „weil“: **Geç kaldığım için özür dilerim.** „Entschuldige, dass ich zu spät bin.“
      - **-diği zaman** „wenn“, **-diği gibi** „wie, genau wie“
  tr-ir-irmez:
    meaning: "-(A)r -mAz: sobald"
    intro: |
      Der Aorist und seine Verneinung nebeneinander heißen *sobald*: **Eve girer girmez telefon çaldı.** „Kaum war ich zu Hause, klingelte das Telefon.“ **Beni görür görmez gülümsedi.** „Sobald sie mich sah, lächelte sie.“ Ähnlich: **-(y)IncA** „wenn, sobald“ (B1).
  tr-inceye-kadar:
    meaning: "-(y)IncAyA kadar: bis"
    intro: |
      **-(y)ıncaya / -(y)inceye kadar** (oder **dek**) heißt *bis*: **Sen gelinceye kadar bekledim.** „Ich wartete, bis du kamst.“ Gesprochen oft **-(y)AnA kadar**: **Sen gelene kadar bekledim.** Beide stehen am Verbstamm ohne Personalendung.
  tr-correlatives:
    meaning: "paarige Konjunktionen"
    intro: |
      - **hem … hem (de)** „sowohl … als auch“: **Hem akıllı hem çalışkan.** „Sowohl klug als auch fleißig.“
      - **ne … ne (de)** „weder … noch“, mit *bejahtem* Verb: **Ne telefon etti ne de yazdı.** „Er hat weder angerufen noch geschrieben.“
      - **ya … ya (da)** „entweder … oder“: **Ya bugün ya yarın.**
      - **ister … ister** „ob … oder“: **İster inan ister inanma.** „Ob du es glaubst oder nicht.“
      - **gerek … gerek(se)** „sowohl … als auch“ (förmlich)
    mistakes: ["ne … ne verneint schon: die Verben bleiben bejaht."]
  tr-masi-gerek:
    meaning: "-mAsI gerek / lazım: jemand muss"
    intro: |
      **gerek, lazım, şart** (nötig) nehmen einen Satz auf **-mA** + Possessiv für die Person: **Gitmem gerek.** „Ich muss gehen.“ **Onun dinlenmesi lazım.** „Er muss sich ausruhen.“ **Bunu bilmeniz şart.** „Das müssen Sie unbedingt wissen.“ Ohne Person: **Gitmek lazım.** „Man muss gehen.“ Vergleiche **-mAlI** (A2), eine Verbendung: **gitmeliyim**.
  tr-maktansa:
    meaning: "lieber als, anstatt: -mAktAnsA, -mAk yerine"
    intro: |
      - **-maktansa / -mektense** „lieber als“: **Burada beklemektense eve gidelim.** „Statt hier zu warten, gehen wir lieber nach Hause.“
      - **-mak yerine** „anstatt“: **Ders çalışmak yerine televizyon izledi.** „Statt zu lernen, sah er fern.“
      - **-mAktAn** + Vergleich: **Okumaktan daha çok yazmayı severim.** „Ich schreibe lieber, als ich lese.“
  tr-maliydi:
    meaning: "hätte sollen: -mAlIydI"
    intro: |
      **-meli / -malı** + **-ydı** blickt auf eine nicht erfüllte Pflicht zurück: **Daha erken gitmeliydim.** „Ich hätte früher gehen sollen.“ **Bana söylemeliydin.** „Du hättest es mir sagen sollen.“ Verneint: **Bunu yapmamalıydın.** „Das hättest du nicht tun sollen.“
  tr-ki-suffix:
    meaning: "das Suffix -ki: der/die/das in / von"
    intro: |
      **-ki** macht aus einem Ort oder einer Zeit ein Adjektiv oder Pronomen:

      - nach dem Lokativ: **evdeki kitaplar** „die Bücher (, die) zu Hause (sind)“, **masadaki bardak** „das Glas auf dem Tisch“
      - nach Zeitwörtern: **yarınki toplantı** „das morgige Treffen“, **bugünkü gazete** „die heutige Zeitung“
      - nach dem Genitiv, *der von*: **Benim arabam eski, seninki yeni.** „Mein Auto ist alt, deins ist neu.“

      Es bleibt meist **-ki**, egal welche Vokale (**bugünkü** ist eine Ausnahme).
  tr-sana:
    meaning: "-sAnA: drängende, ungeduldige Aufforderungen"
    intro: |
      **-sana / -sene** (Plural **-sanıza / -senize**) ist ein vertrauter, nachdrücklicher Imperativ: *komm schon, warum nicht*: **Gelsene!** „Nun komm doch!“ **Otursanıza!** „Setzen Sie sich doch!“ **Bir şey söylesene!** „Sag doch was!“ Es kann ungeduldig klingen; schlichtes **gel, gelin** ist neutral.
  tr-mis-adjective:
    meaning: "-mIş als Adjektiv: getan, fertig"
    intro: |
      Neben dem Tempusgebrauch bildet **-mış** Adjektive für einen abgeschlossenen Zustand: **pişmiş tavuk** „gekochtes Huhn“, **evlenmiş çift** „das verheiratete Paar“, **kurutulmuş meyve** „getrocknetes Obst“, **çok okumuş biri** „ein belesener Mensch“. Vergleiche **-An** (der tut / tat): **pişen yemek** „das (gerade) kochende Essen“.
