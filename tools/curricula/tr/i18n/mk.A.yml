# Macedonian text of the Turkish course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and vowel harmony: "Гласови и вокална хармонија"
  Nouns and their endings: "Именките и нивните наставки"
  The present and questions: "Сегашното и прашањата"
  Past and future: "Минато и идно"
  Other cases and modality: "Други падежи и модалност"
lessons:
  tr-harmony:
    meaning: "вокална хармонија: двојни (a/e) и четворни (ı/i/u/ü) наставки"
    intro: |
      Турскиот се пишува како што се зборува: **c** = **џ**, **ç** = **ч**, **ş** = **ш**, **ğ** ја издолжува самогласката пред неа, **ı** (без точка) е задно *и*, **ö, ü** како во германскиот.

      Секоја наставка ја копира **последната самогласка** на зборот:

      - **двојни** (e/a): по **e i ö ü** → **e**, по **a ı o u** → **a**: **ev-de** (дома), **okul-da** (во училиште), **ev-ler**, **kitap-lar**
      - **четворни** (i/ı/ü/u): по **e i → i**, **a ı → ı**, **ö ü → ü**, **o u → u**: **ev-im** (мојата куќа), **kız-ım**, **göz-üm**, **okul-um**

      И согласките се усогласуваат: **d → t** по безвучна согласка (**kitap-ta**, **uçak-ta**).
    mistakes: ["Последната самогласка во okul е u (задна): -da."]
  tr-plural:
    meaning: "множината -ler / -lar"
    intro: |
      **-ler / -lar** (двојна хармонија): **ev → evler, kitap → kitaplar**. По број именката останува во еднина: **iki kitap** „две книги“, исто и по **çok** (многу): **çok insan** „многу луѓе“.
    mistakes: ["По број: еднина."]
  tr-locative:
    meaning: "локативот -de/-da: во, на, кај"
    intro: |
      **-de / -da / -te / -ta**: место и време: **evde** (дома), **İstanbul'da** (сопствените имиња земаат апостроф), **saat üçte** (во три часот). Со **var / yok**: **Masada bir kitap var.** „На масата има книга.“
  tr-dative:
    meaning: "дативот -e/-a: кон, на"
    intro: |
      **-e / -a** (со **-y-** по самогласка: **araba-ya**): насока и лицето на кое нешто му се дава: **eve gidiyorum** „одам дома“, **okula** „на училиште“, **Ali'ye verdim** „му дадов на Али“. Многу глаголи го земаат: **bakmak** (гледа во), **başlamak** (почнува), **inanmak** (верува), **yardım etmek** (помага).
  tr-ablative:
    meaning: "аблативот -den/-dan: од, надвор од, од (споредба)"
    intro: |
      **-den / -dan / -ten / -tan**: **Türkiye'den geliyorum** „доаѓам од Турција“, **evden** „од дома“; и со **korkmak** (се плаши од), **hoşlanmak** (му се допаѓа), и при споредба: **benden büyük** „поголем од мене“.
  tr-accusative:
    meaning: "акузативот -(y)ı: определен објект"
    intro: |
      **Определен** објект зема **-ı / -i / -u / -ü** (со **-y-** по самогласка) — улога што во македонскиот ја вршат членот и удвојувањето: **Kitabı okudum.** „Ја прочитав книгата.“ Неопределениот не зема ништо: **Kitap okudum.** „Читав книга / книги.“ Внимавај: **p, ç, t, k → b, c, d, ğ** пред самогласка: **kitap → kitabı, ağaç → ağacı, köpek → köpeği**.
  tr-possessive:
    meaning: "присвојни наставки: мој, твој, негов…"
    intro: |
      Припадноста е наставка на именката (четворна хармонија): **ev-im** мојата куќа, **ev-in** твојата, **ev-i** неговата/нејзината, **ev-imiz** нашата, **ev-iniz** вашата, **ev-leri** нивната. По самогласка: **araba-m, araba-n, araba-sı, araba-mız, araba-nız**. Заменката (**benim, senin…**) се додава за нагласување: **benim evim**.
  tr-genitive:
    meaning: "генитивот -(n)in со присвојното: куќата на Али"
    intro: |
      **Сопственик + -in, нешто што се поседува + присвојното**: **Ali'nin evi** „куќата на Али“, **kapının rengi** „бојата на вратата“, **benim kitabım** „мојата книга“. По самогласка **-nin**: **annenin**. Сложенка од две именки ја зема само втората наставка: **Türk kahvesi** „турско кафе“.
  tr-var-yok:
    meaning: "има / нема; поседување"
    intro: |
      **var** има, **yok** нема — исто како **има / нема** во македонскиот: **Burada bir banka var mı?** „Има ли тука банка?“ *Има (поседува)* е присвојно + var: **Arabam var** „Имам кола“ (мојата кола постои), **Zamanım yok** „Немам време“.
  tr-present:
    meaning: "сегашното време -iyor"
    intro: |
      Основа + **-(i)yor** (четворна самогласка, **-yor** никогаш не се менува) + лична наставка: **gel-iyor-um** доаѓам, **gel-iyor-sun**, **gel-iyor**, **gel-iyor-uz**, **gel-iyor-sunuz**, **gel-iyor-lar**. Крајното **a/e** на основата станува **ı/i/u/ü**: **bekle → bekliyorum, anla → anlıyorum**. Одречно: **-m-** пред: **gelmiyorum**.
  tr-questions:
    meaning: "прашања да/не со mi, и прашални зборови"
    intro: |
      **mı / mi / mu / mü** (четворна хармонија, пишувано одделно) по зборот за кој се прашува — слично на македонското **ли**: **Geliyor musun?** „Доаѓаш ли?“, **Bu senin mi?** „Твое ли е ова?“ Прашални зборови: **ne** што, **kim** кој, **nerede** каде, **nereye** накаде, **nereden** од каде, **ne zaman** кога, **neden / niçin** зошто, **nasıl** како, **kaç** колку, **hangi** кој (од нив).
    mistakes: ["Прашалната честичка ја следи хармонијата: по o, mu."]
  tr-imperative:
    meaning: "заповедниот начин"
    intro: |
      Голата основа е заповед кон едно лице: **Gel!** „Дојди!“, **Otur!** „Седни!“ Множина или учтиво **-(y)in**: **Gelin, oturun.** Многу учтиво **-(y)iniz**: **Lütfen oturunuz.** Одречно **-me / -ma**: **Gelme!** „Немој да доаѓаш!“
  tr-past:
    meaning: "минатото -di"
    intro: |
      **-dı / -di / -du / -dü** (**-t-** по безвучна согласка) + кратки наставки: **geldim, geldin, geldi, geldik, geldiniz, geldiler**; **yaptım, yaptın, yaptı**. Тоа е минатото што си го видел или во кое си сигурен — како македонскиот аорист наспроти л-формата. Одречно: **gelmedim**.
  tr-future:
    meaning: "идното -ecek / -acak"
    intro: |
      **-(y)ecek / -(y)acak** + наставки, со **k → ğ** пред самогласка: **geleceğim, geleceksin, gelecek, geleceğiz, geleceksiniz, gelecekler**; **yapacağım**. Одречно: **gelmeyeceğim**.
  tr-aorist:
    meaning: "аористот (geniş zaman): навики, општи вистини, понуди"
    intro: |
      **-r / -ir / -ar**: што вообичаено се случува или општо важи, и понуди или ветувања: **Her gün kahve içerim.** „Секој ден пијам кафе.“ **Sana yardım ederim.** „Ќе ти помогнам.“ Одречно: **-mez / -maz** (**gelmem, gelmezsin, gelmez**). Учтиви барања: **Bir çay alır mısınız?** „Би сакале ли чај?“ (Внимавај: турскиот „аорист“ не е македонскиот аорист.)
  tr-negation:
    meaning: "негација: -me- кај глаголите, değil кај именките"
    intro: |
      Глаголите земаат **-me- / -ma-** веднаш по основата: **gelmiyorum, gelmedim, gelmeyeceğim** (аорист **gelmem, gelmez**). Именките и придавките земаат **değil**: **Öğretmen değilim.** „Не сум учител.“ **Bu benim değil.** „Ова не е мое.“
  tr-instrumental:
    meaning: "-(y)le / -(y)la: со, преку"
    intro: |
      **ile**, обично наставка **-(y)le / -(y)la**: друштво и средство: **arkadaşımla** „со мојот пријател“, **otobüsle** „со автобус“, **kalemle** „со пенкало“. Меѓу именки значи *и*: **Ali ile Ayşe**.
  tr-ability:
    meaning: "може: -ebil-; не може: -eme-"
    intro: |
      **-(y)ebil- / -(y)abil-** = *може, смее*: **Yüzebilirim.** „Можам да пливам.“ **Gelebilir.** „Може да дојде.“ *Не може* е **-(y)eme- / -(y)ama-**: **Gelemem.** „Не можам да дојдам.“ **Uyuyamadım.** „Не можев да заспијам.“
  tr-necessity:
    meaning: "мора: -meli; принуден е: -mek zorunda"
    intro: |
      **-meli / -malı** + наставки: **Gitmeliyim.** „Морам да одам.“ **Daha çok çalışmalısın.** „Треба повеќе да учиш.“ Посилно: **-mek zorundayım** „принуден сум“; безлично: **gitmem lazım / gerek** „треба да одам“.
