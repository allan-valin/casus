# Arabic text of the Turkish course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and vowel harmony: "الأصوات والتوافق الصائتي"
  Nouns and their endings: "الأسماء ولواحقها"
  The present and questions: "المضارع والأسئلة"
  Past and future: "الماضي والمستقبل"
  Other cases and modality: "حالات أخرى والصيغ"
lessons:
  tr-harmony:
    meaning: "التوافق الصائتي: لواحق ثنائية (a/e) ورباعية (ı/i/u/ü)"
    intro: |
      تُكتب التركية كما تُنطق: **c** = ج، **ç** = تش، **ş** = ش، **ğ** تطيل الصائت قبلها، **ı** (بلا نقطة) كسرة خلفية، و**ö، ü** كالألمانية.

      كل لاحقة تنسخ **آخر صائت** في الكلمة:

      - **ثنائية** (e/a): بعد **e i ö ü** ← **e**، وبعد **a ı o u** ← **a**: **ev-de** (في البيت)، **okul-da** (في المدرسة)، **ev-ler**، **kitap-lar**
      - **رباعية** (i/ı/ü/u): بعد **e i ← i**، **a ı ← ı**، **ö ü ← ü**، **o u ← u**: **ev-im** (بيتي)، **kız-ım**، **göz-üm**، **okul-um**

      والصوامت تتوافق أيضًا: **d → t** بعد صامت مهموس (**kitap-ta**، **uçak-ta**).
    mistakes: ["آخر صائت في okul هو u (خلفي): -da."]
  tr-plural:
    meaning: "الجمع -ler / -lar"
    intro: |
      **-ler / -lar** (توافق ثنائي): **ev → evler، kitap → kitaplar**. وبعد العدد يبقى الاسم مفردًا: **iki kitap** «كتابان»، وكذلك بعد **çok** (كثير): **çok insan** «ناس كثيرون».
    mistakes: ["بعد العدد: مفرد."]
  tr-locative:
    meaning: "الظرفية -de/-da: في، عند، على"
    intro: |
      **-de / -da / -te / -ta**: المكان والزمان: **evde** (في البيت)، **İstanbul'da** (أسماء العلم تأخذ فاصلة عليا)، **saat üçte** (في الساعة الثالثة). ومع **var / yok**: **Masada bir kitap var.** «على الطاولة كتاب».
  tr-dative:
    meaning: "حالة الاتجاه -e/-a: إلى، نحو"
    intro: |
      **-e / -a** (مع **-y-** بعد الصائت: **araba-ya**): الاتجاه ومن يُعطى الشيء: **eve gidiyorum** «أذهب إلى البيت»، **okula** «إلى المدرسة»، **Ali'ye verdim** «أعطيته لعلي». وأفعال كثيرة تأخذها: **bakmak** (نظر إلى)، **başlamak** (بدأ)، **inanmak** (آمن بـ)، **yardım etmek** (ساعد).
  tr-ablative:
    meaning: "حالة الابتداء -den/-dan: من، من (المقارنة)"
    intro: |
      **-den / -dan / -ten / -tan**: **Türkiye'den geliyorum** «أنا من تركيا (آتٍ منها)»، **evden** «من البيت»؛ وأيضًا مع **korkmak** (خاف من)، **hoşlanmak** (أعجبه)، والمقارنة: **benden büyük** «أكبر مني».
  tr-accusative:
    meaning: "حالة المفعولية -(y)ı: مفعول معرفة"
    intro: |
      المفعول **المعرفة** يأخذ **-ı / -i / -u / -ü** (مع **-y-** بعد الصائت): **Kitabı okudum.** «قرأت الكتاب». والنكرة لا تأخذ شيئًا: **Kitap okudum.** «قرأت (كتابًا / كتبًا)». ولاحظ **p، ç، t، k → b، c، d، ğ** قبل الصائت: **kitap → kitabı، ağaç → ağacı، köpek → köpeği**.
  tr-possessive:
    meaning: "لواحق الملكية: ـي، ـك، ـه…"
    intro: |
      الملكية لاحقة على الاسم (توافق رباعي)، كالضمائر المتصلة في العربية: **ev-im** بيتي، **ev-in** بيتك، **ev-i** بيته/بيتها، **ev-imiz** بيتنا، **ev-iniz** بيتكم، **ev-leri** بيتهم. وبعد الصائت: **araba-m، araba-n، araba-sı، araba-mız، araba-nız**. ويُضاف الضمير (**benim، senin…**) للتوكيد: **benim evim**.
  tr-genitive:
    meaning: "الإضافة -(n)in مع لاحقة الملكية: بيت علي"
    intro: |
      **المالك + -in، والمملوك + لاحقة ملكيته**: **Ali'nin evi** «بيت علي»، **kapının rengi** «لون الباب»، **benim kitabım** «كتابي». وبعد الصائت **-nin**: **annenin**. والمركب من اسمين لا يأخذ إلا اللاحقة الثانية: **Türk kahvesi** «قهوة تركية».
  tr-var-yok:
    meaning: "يوجد / لا يوجد؛ الملكية"
    intro: |
      **var** يوجد، **yok** لا يوجد: **Burada bir banka var mı?** «هل يوجد مصرف هنا؟» و*عندي* هي لاحقة الملكية + var: **Arabam var** «عندي سيارة» (سيارتي موجودة)، **Zamanım yok** «ليس عندي وقت».
  tr-present:
    meaning: "المضارع المستمر -iyor"
    intro: |
      الجذر + **-(i)yor** (صائت رباعي، و**-yor** لا تتغير أبدًا) + لاحقة الشخص: **gel-iyor-um** أنا آتٍ، **gel-iyor-sun**، **gel-iyor**، **gel-iyor-uz**، **gel-iyor-sunuz**، **gel-iyor-lar**. وتصير **a/e** في آخر الجذر **ı/i/u/ü**: **bekle → bekliyorum، anla → anlıyorum**. والنفي: **-m-** قبلها: **gelmiyorum**.
  tr-questions:
    meaning: "أسئلة نعم/لا بـ mi، وأدوات الاستفهام"
    intro: |
      **mı / mi / mu / mü** (توافق رباعي، تُكتب منفصلة) بعد الكلمة المسؤول عنها: **Geliyor musun?** «هل أنت آتٍ؟»، **Bu senin mi?** «هل هذا لك؟» أدوات الاستفهام: **ne** ماذا، **kim** من، **nerede** أين، **nereye** إلى أين، **nereden** من أين، **ne zaman** متى، **neden / niçin** لماذا، **nasıl** كيف، **kaç** كم، **hangi** أيّ.
    mistakes: ["أداة الاستفهام تتبع التوافق: بعد o تكون mu."]
  tr-imperative:
    meaning: "الأمر"
    intro: |
      الجذر المجرد أمر لشخص واحد: **Gel!** «تعالَ!»، **Otur!** «اجلس!» وللجمع أو الاحترام **-(y)in**: **Gelin, oturun.** وبتأدّب شديد **-(y)iniz**: **Lütfen oturunuz.** والنهي **-me / -ma**: **Gelme!** «لا تأتِ!»
  tr-past:
    meaning: "الماضي -di"
    intro: |
      **-dı / -di / -du / -dü** (**-t-** بعد صامت مهموس) + لواحق قصيرة: **geldim، geldin، geldi، geldik، geldiniz، geldiler**؛ **yaptım، yaptın، yaptı**. وهو الماضي الذي شهدته أو أنت متيقن منه. والنفي: **gelmedim**.
  tr-future:
    meaning: "المستقبل -ecek / -acak"
    intro: |
      **-(y)ecek / -(y)acak** + اللواحق، مع **k → ğ** قبل الصائت: **geleceğim، geleceksin، gelecek، geleceğiz، geleceksiniz، gelecekler**؛ **yapacağım**. والنفي: **gelmeyeceğim**.
  tr-aorist:
    meaning: "الزمن الواسع (geniş zaman): العادات والحقائق العامة والعروض"
    intro: |
      **-r / -ir / -ar**: ما يحدث عادةً أو يصدق عمومًا، والعروض والوعود: **Her gün kahve içerim.** «أشرب القهوة كل يوم». **Sana yardım ederim.** «سأساعدك». والنفي: **-mez / -maz** (**gelmem، gelmezsin، gelmez**). والطلب المهذب: **Bir çay alır mısınız?** «هل تتناول شايًا؟»
  tr-negation:
    meaning: "النفي: -me- في الأفعال، وdeğil مع الأسماء"
    intro: |
      تأخذ الأفعال **-me- / -ma-** بعد الجذر مباشرة: **gelmiyorum، gelmedim، gelmeyeceğim** (والواسع **gelmem، gelmez**). والأسماء والصفات تأخذ **değil** (مثل «ليس»): **Öğretmen değilim.** «لست معلمًا». **Bu benim değil.** «هذا ليس لي».
  tr-instrumental:
    meaning: "-(y)le / -(y)la: مع، بـ"
    intro: |
      **ile**، وغالبًا لاحقة **-(y)le / -(y)la**: المصاحبة والوسيلة: **arkadaşımla** «مع صديقي»، **otobüsle** «بالحافلة»، **kalemle** «بالقلم». وبين اسمين تعني *و*: **Ali ile Ayşe**.
  tr-ability:
    meaning: "يستطيع: -ebil-؛ لا يستطيع: -eme-"
    intro: |
      **-(y)ebil- / -(y)abil-** = *يستطيع، قد*: **Yüzebilirim.** «أستطيع السباحة». **Gelebilir.** «قد يأتي». و*لا يستطيع* هي **-(y)eme- / -(y)ama-**: **Gelemem.** «لا أستطيع المجيء». **Uyuyamadım.** «لم أستطع النوم».
  tr-necessity:
    meaning: "يجب: -meli؛ مضطر: -mek zorunda"
    intro: |
      **-meli / -malı** + اللواحق: **Gitmeliyim.** «يجب أن أذهب». **Daha çok çalışmalısın.** «ينبغي أن تدرس أكثر». وأقوى: **-mek zorundayım** «أنا مضطر»؛ وغير شخصي: **gitmem lazım / gerek** «يلزمني أن أذهب» (و**lazım** من العربية «لازم»).
