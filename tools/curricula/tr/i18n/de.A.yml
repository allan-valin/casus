# German text of the Turkish course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and vowel harmony: "Laute und Vokalharmonie"
  Nouns and their endings: "Nomen und ihre Endungen"
  The present and questions: "Das Präsens und Fragen"
  Past and future: "Vergangenheit und Zukunft"
  Other cases and modality: "Weitere Kasus und Modalität"
lessons:
  tr-harmony:
    meaning: "Vokalharmonie: zweifache (a/e) und vierfache (ı/i/u/ü) Suffixe"
    intro: |
      Türkisch schreibt, wie es spricht: **c** = *dsch*, **ç** = *tsch*, **ş** = *sch*, **ğ** dehnt den Vokal davor, **ı** (ohne Punkt) ist ein hinteres *i*, **ö, ü** wie im Deutschen.

      Jedes Suffix kopiert den **letzten Vokal** des Wortes:

      - **zweifach** (e/a): nach **e i ö ü** → **e**, nach **a ı o u** → **a**: **ev-de** (zu Hause), **okul-da** (in der Schule), **ev-ler**, **kitap-lar**
      - **vierfach** (i/ı/ü/u): nach **e i → i**, **a ı → ı**, **ö ü → ü**, **o u → u**: **ev-im** (mein Haus), **kız-ım**, **göz-üm**, **okul-um**

      Auch Konsonanten passen sich an: **d → t** nach stimmlosem Konsonanten (**kitap-ta**, **uçak-ta**).
    mistakes: ["Der letzte Vokal von okul ist u (hinten): -da."]
  tr-plural:
    meaning: "der Plural -ler / -lar"
    intro: |
      **-ler / -lar** (zweifache Harmonie): **ev → evler, kitap → kitaplar**. Nach einer Zahl bleibt das Nomen im Singular: **iki kitap** „zwei Bücher“, ebenso nach **çok** (viele): **çok insan** „viele Menschen“.
    mistakes: ["Nach einer Zahl: Singular."]
  tr-locative:
    meaning: "der Lokativ -de/-da: in, an, auf"
    intro: |
      **-de / -da / -te / -ta**: Ort und Zeit: **evde** (zu Hause), **İstanbul'da** (Eigennamen bekommen einen Apostroph), **saat üçte** (um drei Uhr). Mit **var / yok**: **Masada bir kitap var.** „Auf dem Tisch liegt ein Buch.“
  tr-dative:
    meaning: "der Dativ -e/-a: zu, nach"
    intro: |
      **-e / -a** (mit **-y-** nach Vokal: **araba-ya**): Richtung und die Person, der etwas gegeben wird: **eve gidiyorum** „ich gehe nach Hause“, **okula** „zur Schule“, **Ali'ye verdim** „ich habe es Ali gegeben“. Viele Verben nehmen ihn: **bakmak** (anschauen), **başlamak** (anfangen), **inanmak** (glauben), **yardım etmek** (helfen).
  tr-ablative:
    meaning: "der Ablativ -den/-dan: von, aus, als"
    intro: |
      **-den / -dan / -ten / -tan**: **Türkiye'den geliyorum** „ich komme aus der Türkei“, **evden** „von zu Hause“; auch bei **korkmak** (Angst haben vor), **hoşlanmak** (mögen) und beim Vergleich: **benden büyük** „größer als ich“.
  tr-accusative:
    meaning: "der Akkusativ -(y)ı: ein bestimmtes Objekt"
    intro: |
      Ein **bestimmtes** Objekt nimmt **-ı / -i / -u / -ü** (mit **-y-** nach Vokal): **Kitabı okudum.** „Ich habe das Buch gelesen.“ Ein unbestimmtes nimmt nichts: **Kitap okudum.** „Ich habe (ein Buch / Bücher) gelesen.“ Beachte **p, ç, t, k → b, c, d, ğ** vor Vokal: **kitap → kitabı, ağaç → ağacı, köpek → köpeği**.
  tr-possessive:
    meaning: "Possessivsuffixe: mein, dein, sein …"
    intro: |
      Besitz ist ein Suffix am Nomen (vierfache Harmonie): **ev-im** mein Haus, **ev-in** dein, **ev-i** sein/ihr, **ev-imiz** unser, **ev-iniz** euer, **ev-leri** ihr (Pl.). Nach Vokal: **araba-m, araba-n, araba-sı, araba-mız, araba-nız**. Das Pronomen (**benim, senin …**) kommt zur Betonung hinzu: **benim evim**.
  tr-genitive:
    meaning: "der Genitiv -(n)in mit dem Possessiv: Alis Haus"
    intro: |
      **Besitzer + -in, Besitz + sein Possessiv**: **Ali'nin evi** „Alis Haus“, **kapının rengi** „die Farbe der Tür“, **benim kitabım** „mein Buch“. Nach Vokal **-nin**: **annenin**. Ein Kompositum aus zwei Nomen nimmt nur das zweite Suffix: **Türk kahvesi** „türkischer Kaffee“.
  tr-var-yok:
    meaning: "es gibt / es gibt nicht; haben"
    intro: |
      **var** es gibt, **yok** es gibt nicht: **Burada bir banka var mı?** „Gibt es hier eine Bank?“ *Haben* ist Possessiv + var: **Arabam var** „ich habe ein Auto“ (mein Auto existiert), **Zamanım yok** „ich habe keine Zeit“.
  tr-present:
    meaning: "das Präsens -iyor"
    intro: |
      Stamm + **-(i)yor** (vierfacher Vokal, **-yor** ändert sich nie) + Personalendung: **gel-iyor-um** ich komme gerade, **gel-iyor-sun**, **gel-iyor**, **gel-iyor-uz**, **gel-iyor-sunuz**, **gel-iyor-lar**. Ein auslautendes **a/e** des Stamms wird zu **ı/i/u/ü**: **bekle → bekliyorum, anla → anlıyorum**. Verneint: **-m-** davor: **gelmiyorum**.
  tr-questions:
    meaning: "Ja/Nein-Fragen mit mi und Fragewörter"
    intro: |
      **mı / mi / mu / mü** (vierfache Harmonie, getrennt geschrieben) nach dem erfragten Wort: **Geliyor musun?** „Kommst du?“, **Bu senin mi?** „Ist das deins?“ Fragewörter: **ne** was, **kim** wer, **nerede** wo, **nereye** wohin, **nereden** woher, **ne zaman** wann, **neden / niçin** warum, **nasıl** wie, **kaç** wie viele, **hangi** welcher.
    mistakes: ["Die Fragepartikel folgt der Harmonie: nach o mu."]
  tr-imperative:
    meaning: "der Imperativ"
    intro: |
      Der bloße Stamm ist ein Befehl an eine Person: **Gel!** „Komm!“, **Otur!** „Setz dich!“ Plural oder höflich **-(y)in**: **Gelin, oturun.** Sehr höflich **-(y)iniz**: **Lütfen oturunuz.** Verneint **-me / -ma**: **Gelme!** „Komm nicht!“
  tr-past:
    meaning: "die Vergangenheit -di"
    intro: |
      **-dı / -di / -du / -dü** (**-t-** nach stimmlosem Konsonanten) + kurze Endungen: **geldim, geldin, geldi, geldik, geldiniz, geldiler**; **yaptım, yaptın, yaptı**. Es ist die selbst erlebte oder sichere Vergangenheit. Verneint: **gelmedim**.
  tr-future:
    meaning: "das Futur -ecek / -acak"
    intro: |
      **-(y)ecek / -(y)acak** + Endungen, mit **k → ğ** vor Vokal: **geleceğim, geleceksin, gelecek, geleceğiz, geleceksiniz, gelecekler**; **yapacağım**. Verneint: **gelmeyeceğim**.
  tr-aorist:
    meaning: "der Aorist (geniş zaman): Gewohnheiten, allgemeine Wahrheiten, Angebote"
    intro: |
      **-r / -ir / -ar**: was gewöhnlich geschieht oder allgemein gilt, sowie Angebote und Versprechen: **Her gün kahve içerim.** „Ich trinke jeden Tag Kaffee.“ **Sana yardım ederim.** „Ich helfe dir.“ Verneint: **-mez / -maz** (**gelmem, gelmezsin, gelmez**). Höfliche Bitten: **Bir çay alır mısınız?** „Möchten Sie einen Tee?“
  tr-negation:
    meaning: "Verneinung: -me- bei Verben, değil bei Nomen"
    intro: |
      Verben nehmen **-me- / -ma-** direkt nach dem Stamm: **gelmiyorum, gelmedim, gelmeyeceğim** (Aorist **gelmem, gelmez**). Nomen und Adjektive nehmen **değil**: **Öğretmen değilim.** „Ich bin kein Lehrer.“ **Bu benim değil.** „Das ist nicht meins.“
  tr-instrumental:
    meaning: "-(y)le / -(y)la: mit, durch"
    intro: |
      **ile**, meist als Suffix **-(y)le / -(y)la**: Begleitung und Mittel: **arkadaşımla** „mit meinem Freund“, **otobüsle** „mit dem Bus“, **kalemle** „mit einem Stift“. Zwischen Nomen heißt es *und*: **Ali ile Ayşe**.
  tr-ability:
    meaning: "können: -ebil-; nicht können: -eme-"
    intro: |
      **-(y)ebil- / -(y)abil-** = *können, dürfen*: **Yüzebilirim.** „Ich kann schwimmen.“ **Gelebilir.** „Er kommt vielleicht.“ *Nicht können* ist **-(y)eme- / -(y)ama-**: **Gelemem.** „Ich kann nicht kommen.“ **Uyuyamadım.** „Ich konnte nicht schlafen.“
  tr-necessity:
    meaning: "müssen: -meli; gezwungen sein: -mek zorunda"
    intro: |
      **-meli / -malı** + Endungen: **Gitmeliyim.** „Ich muss gehen.“ **Daha çok çalışmalısın.** „Du solltest mehr lernen.“ Stärker: **-mek zorundayım** „ich bin gezwungen“; unpersönlich: **gitmem lazım / gerek** „ich muss gehen“.
