# Macedonian text of the Turkish course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Narration and hearsay: "Раскажување и прекажување"
  Advanced subordination: "Напредна зависност"
  Formal register: "Официјален регистар"
  Clause linking in depth: "Сврзување реченици во длабочина"
  Necessity and comparison of actions: "Нужност и споредување дејства"
  Word-level nuance: "Нијанси на ниво на збор"
lessons:
  tr-pluperfect:
    meaning: "плусквамперфектот -mIştI: беше направил"
    intro: |
      **-mış + -tı** (**-mişti, -muştu, -müştü**) става дејство пред друго минато — како македонското **беше заминал**: **Ben vardığımda tren kalkmıştı.** „Кога стигнав, возот веќе беше заминал.“ Ја поставува и позадината на приказната: **O gün çok yorulmuştum.** „Тој ден бев многу уморен.“ За разлика од простото **-mış**, нема значење на прекажување.
  tr-imis:
    meaning: "-(y)mIş на други времиња и именки: наводно"
    intro: |
      **-(y)mış** може да следи секое време или именка за прекажување или откритие — како македонското **бил, ќе дојдел**:

      - **Geliyormuş.** „Доаѓал, велат.“ **Gelecekmiş.** „Ќе дојдел.“ **Gelirmiş.** „Би дошол, велат.“
      - **Hastaymış.** „Болен бил, слушам.“ **Evdeymiş.** „Дома била, изгледа.“

      Спореди **-(y)dı** (просто минато на истите форми): **Geliyordu.** „Доаѓаше.“ **Hastaydı.** „Беше болен.“
  tr-dir:
    meaning: "-DIr: сигурност, претпоставка и официјални искази"
    intro: |
      **-dır / -dir / -dur / -dür** (**-tır…** по безвучна согласка) по именка или глаголска форма:

      - дефиниции и официјални искази: **Ankara Türkiye'nin başkentidir.** „Анкара е главниот град на Турција.“ **Sigara içmek yasaktır.** „Пушењето е забрането.“
      - претпоставка: **Yorgundur.** „Сигурно е уморен.“ **Şimdiye kadar gelmiştir.** „Досега веројатно стигнал.“

      Секојдневниот говор го испушта: **Yorgun.** „Уморен е.“
  tr-casina:
    meaning: "-cAsInA: како, како да"
    intro: |
      **-casına / -cesine** (**-çasına** по безвучна согласка) значи *како, на начин на*: **delicesine** „лудо“, **çılgıncasına** „бесно“. На **-mış** значи *како да*: **Hiçbir şey olmamışçasına konuştu.** „Зборуваше како ништо да не се случило.“ **Beni tanımıyormuşçasına baktı.** „Ме гледаше како да не ме познава.“ Говорот претпочита **… gibi**.
  tr-ki:
    meaning: "сврзникот ki (од персискиот)"
    intro: |
      **ki** воведува реченица во европски ред, по главниот глагол:

      - *дека*: **Biliyorum ki haklısın.** „Знам дека си во право.“ **Umarım ki gelir.** „Се надевам дека ќе дојде.“
      - последица по **öyle / o kadar … ki**: **O kadar yorgundum ki hemen uyudum.** „Бев толку уморен што веднаш заспав.“
      - цел и нагласок: **Söyle ki bilsinler.** „Кажи за да знаат.“

      Се пишува одделно; наставката **-ki** (**evdeki**) е нешто друго.
  tr-diye:
    meaning: "diye: цитирање, именување и цел"
    intro: |
      **diye** (буквално *велејќи*) затвора цитат или мисла и ги поврзува со глаголот:

      - цитат: **"Geliyorum" diye bağırdı.** „Викна: ‚Доаѓам!‘“
      - мисла или причина: **Geç kalırım diye koştum.** „Трчав, мислејќи дека ќе задоцнам.“
      - цел со оптатив/заповеден: **Uyanmasın diye sessiz konuştuk.** „Зборувавме тивко за да не се разбуди.“
      - именување: **Ali diye biri** „некој по име Али“
  tr-mekte:
    meaning: "-mAktA(dIr): официјалниот прогресив"
    intro: |
      Вестите, извештаите и официјалните текстови го ставаат дејството во тек во **-makta / -mekte**, обично со **-dır**: **Şirket yeni projeler üzerinde çalışmaktadır.** „Фирмата работи на нови проекти.“ **Fiyatlar artmaktadır.** „Цените растат.“ Во говорот истото е **-yor**: **çalışıyor, artıyor**.
  tr-formal-connectors:
    meaning: "сврзници на пишаниот турски"
    intro: |
      Пишаниот турски ги поврзува речениците со:

      - спротивност: **ancak, fakat** (но), **oysa, halbuki** (а пак, а всушност), **buna rağmen** (и покрај тоа)
      - додавање: **ayrıca** (исто така), **üstelik** (згора на тоа), **bunun yanı sıra** (покрај тоа)
      - последица: **dolayısıyla, bu nedenle, bu yüzden** (затоа)
      - објаснување: **çünkü** (бидејќи), **zira** (зашто, официјално), **nitekim** (навистина, всушност), **mademki** (штом веќе)
  tr-loan-adverbs:
    meaning: "прилози од арапскиот, често на -en"
    intro: |
      Многу чести прилози доаѓаат од арапскиот, повеќето со неговата прилошка наставка **-en / -an**: **tamamen** (целосно), **kısmen** (делумно), **umumiyetle** (воопшто; турски **genellikle**), **maalesef** (за жал), **şahsen** (лично), **resmen** (официјално, буквално), **aslen** (по потекло), **hakikaten** (навистина), **tesadüfen** (случајно), **mecburen** (од нужда). Не ја следат вокалната хармонија.
  tr-politeness:
    meaning: "учтиви формули"
    intro: |
      - **Buyurun** „повелете“
      - **Rica ederim** „нема зошто“, и „ве молам“
      - **Efendim?** „Молам?“ / „Да?“ (на телефон); **efendim** и „господине, госпоѓо“
      - **Zahmet olmazsa** „ако не е тешко“; **Kolay gelsin** „нека ви е лесно“ (на некој што работи); **Geçmiş olsun** „брзо оздравување“; **Ellerinize sağlık** „благодарам за јадењето (здравје на рацете)“; **Afiyet olsun** „пријатно“
      - **siz** + 2 лице множина за едно лице; **-(y)AbilIr misiniz?** „би можеле ли…?“
  tr-uzere:
    meaning: "-mAk üzere: само што не; за да; под услов"
    intro: |
      **-mak / -mek üzere** има три употреби:

      - *само што не*: **Tren kalkmak üzere.** „Возот само што не тргнал.“
      - *за да* (официјално): **Okumak üzere Ankara'ya gitti.** „Отиде во Анкара за да студира.“
      - *под услов*: **Yarın geri vermek üzere aldım.** „Го зедов под услов да го вратам утре.“

      Сродно: **-mak yerine** „наместо“, **-mak için** „за да“ (секојдневно).
  tr-digi-halde:
    meaning: "-DIğI + halde, takdirde, sürece, kadar, için"
    intro: |
      **-dik** + присвојно + именка или постпозиција дава цело семејство сврзници:

      - **-diği halde** „иако“: **Bildiği halde söylemedi.** „Иако знаеше, не кажа.“
      - **-diği takdirde** „во случај да“ (официјално): **Ödeme yapılmadığı takdirde …** „Во случај да не се плати …“
      - **-diği sürece** „сѐ додека“: **İstediğin sürece kalabilirsin.** „Можеш да останеш колку сакаш.“
      - **-diği kadar** „колку што“: **Bildiğim kadarıyla** „колку што знам“
      - **-diği için** „бидејќи“: **Geç kaldığım için özür dilerim.** „Се извинувам што задоцнив.“
      - **-diği zaman** „кога“, **-diği gibi** „како што“
  tr-ir-irmez:
    meaning: "-(A)r -mAz: штом"
    intro: |
      Аористот и неговата одречна форма една до друга значат *штом*: **Eve girer girmez telefon çaldı.** „Штом влегов дома, заѕвони телефонот.“ **Beni görür görmez gülümsedi.** „Штом ме виде, се насмевна.“ Слично: **-(y)IncA** „кога, штом“ (B1).
  tr-inceye-kadar:
    meaning: "-(y)IncAyA kadar: додека не"
    intro: |
      **-(y)ıncaya / -(y)inceye kadar** (или **dek**) значи *додека не*: **Sen gelinceye kadar bekledim.** „Чекав додека не дојде.“ Во говорот често **-(y)AnA kadar**: **Sen gelene kadar bekledim.** И двете стојат на глаголската основа, без лична наставка.
  tr-correlatives:
    meaning: "парни сврзници"
    intro: |
      - **hem … hem (de)** „и … и“: **Hem akıllı hem çalışkan.** „И паметен и вреден.“
      - **ne … ne (de)** „ниту … ниту“, со *потврден* глагол: **Ne telefon etti ne de yazdı.** „Ниту се јави, ниту пиша.“
      - **ya … ya (da)** „или … или“: **Ya bugün ya yarın.**
      - **ister … ister** „сакал… или не“: **İster inan ister inanma.** „Веруваш или не.“
      - **gerek … gerek(se)** „и … и“ (официјално)
    mistakes: ["ne … ne веќе негира: глаголите остануваат потврдни (за разлика од македонското ниту … ниту не)."]
  tr-masi-gerek:
    meaning: "-mAsI gerek / lazım: некој треба да"
    intro: |
      **gerek, lazım, şart** (потребно) земаат реченица на **-mA** + присвојно за лицето: **Gitmem gerek.** „Треба да одам.“ **Onun dinlenmesi lazım.** „Треба да се одмори.“ **Bunu bilmeniz şart.** „Ова задолжително треба да го знаете.“ Без лице: **Gitmek lazım.** „Треба да се оди.“ Спореди **-mAlI** (A2), што е глаголска наставка: **gitmeliyim**.
  tr-maktansa:
    meaning: "наместо да, отколку да: -mAktAnsA, -mAk yerine"
    intro: |
      - **-maktansa / -mektense** „отколку да“: **Burada beklemektense eve gidelim.** „Наместо да чекаме тука, ајде да одиме дома.“
      - **-mak yerine** „наместо да“: **Ders çalışmak yerine televizyon izledi.** „Наместо да учи, гледаше телевизија.“
      - **-mAktAn** + споредба: **Okumaktan daha çok yazmayı severim.** „Повеќе сакам да пишувам отколку да читам.“
  tr-maliydi:
    meaning: "требаше да: -mAlIydI"
    intro: |
      **-meli / -malı** + **-ydı** гледа наназад кон неисполнета обврска: **Daha erken gitmeliydim.** „Требаше да заминам порано.“ **Bana söylemeliydin.** „Требаше да ми кажеш.“ Одречно: **Bunu yapmamalıydın.** „Не требаше да го правиш тоа.“
  tr-ki-suffix:
    meaning: "наставката -ki: оној во / од"
    intro: |
      **-ki** прави место или време во придавка или заменка:

      - по локативот: **evdeki kitaplar** „книгите (што се) дома“, **masadaki bardak** „чашата на масата“
      - по зборови за време: **yarınki toplantı** „утрешниот состанок“, **bugünkü gazete** „денешниот весник“
      - по генитивот, *оној на*: **Benim arabam eski, seninki yeni.** „Мојата кола е стара, твојата е нова.“

      Главно останува **-ki** без оглед на самогласките (**bugünkü** е исклучок).
  tr-sana:
    meaning: "-sAnA: поттикнувачки, нетрпеливи заповеди"
    intro: |
      **-sana / -sene** (множина **-sanıza / -senize**) е фамилијарен, настојчив заповеден начин: *ајде, што не*: **Gelsene!** „Ајде дојди!“ **Otursanıza!** „Седнете, бе!“ **Bir şey söylesene!** „Кажи нешто, бре!“ Може да звучи нетрпеливо; простото **gel, gelin** е неутрално.
  tr-mis-adjective:
    meaning: "-mIş како придавка: направен, завршен"
    intro: |
      Покрај употребата како време, **-mış** гради придавки што опишуваат завршена состојба — како македонските **-н, -т**: **pişmiş tavuk** „сварено пиле“, **evlenmiş çift** „венчаниот пар“, **kurutulmuş meyve** „сушено овошје“, **çok okumuş biri** „начитан човек“. Спореди **-An** (што прави / правел): **pişen yemek** „јадењето што се готви“.
