# Arabic text of the Turkish course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Narration and hearsay: "السرد والنقل"
  Advanced subordination: "التبعية المتقدمة"
  Formal register: "الأسلوب الرسمي"
  Clause linking in depth: "ربط الجمل بتعمق"
  Necessity and comparison of actions: "الوجوب والمفاضلة بين الأفعال"
  Word-level nuance: "دقائق على مستوى الكلمة"
lessons:
  tr-pluperfect:
    meaning: "الماضي البعيد -mIştI: كان قد فعل"
    intro: |
      **-mış + -tı** (**-mişti، -muştu، -müştü**) تضع فعلًا قبل فعل ماضٍ آخر، مثل «كان قد»: **Ben vardığımda tren kalkmıştı.** «حين وصلت كان القطار قد غادر». وتضع أيضًا خلفية القصة: **O gün çok yorulmuştum.** «كنت في ذلك اليوم متعبًا جدًا». وبخلاف **-mış** وحدها لا تحمل معنى النقل.
  tr-imis:
    meaning: "-(y)mIş على الأزمنة الأخرى والأسماء: يُقال"
    intro: |
      يمكن أن تتبع **-(y)mış** أي زمن أو اسم لتعليم النقل أو الاكتشاف:

      - **Geliyormuş.** «يبدو أنه آتٍ». **Gelecekmiş.** «يُقال إنه سيأتي». **Gelirmiş.** «كان يأتي، كما يقولون».
      - **Hastaymış.** «سمعت أنه مريض». **Evdeymiş.** «يبدو أنها في البيت».

      قارن **-(y)dı** (الماضي العادي للصيغ نفسها): **Geliyordu.** «كان آتيًا». **Hastaydı.** «كان مريضًا».
  tr-dir:
    meaning: "-DIr: اليقين والترجيح والعبارات الرسمية"
    intro: |
      **-dır / -dir / -dur / -dür** (**-tır…** بعد صامت مهموس) بعد اسم أو صيغة فعلية:

      - التعريفات والعبارات الرسمية: **Ankara Türkiye'nin başkentidir.** «أنقرة عاصمة تركيا». **Sigara içmek yasaktır.** «التدخين ممنوع».
      - الترجيح: **Yorgundur.** «لا بد أنه متعب». **Şimdiye kadar gelmiştir.** «لعله وصل الآن».

      ويحذفها الكلام اليومي: **Yorgun.** «هو متعب».
  tr-casina:
    meaning: "-cAsInA: كـ، كأنّ"
    intro: |
      **-casına / -cesine** (**-çasına** بعد صامت مهموس) تعني *على طريقة*: **delicesine** «بجنون»، **çılgıncasına** «بهياج». وعلى **-mış** تعني *كأنّ*: **Hiçbir şey olmamışçasına konuştu.** «تكلم كأن شيئًا لم يحدث». **Beni tanımıyormuşçasına baktı.** «نظرت إليّ كأنها لا تعرفني». والكلام يفضّل **… gibi**.
  tr-ki:
    meaning: "أداة الربط ki (من الفارسية)"
    intro: |
      تُدخل **ki** جملة على الترتيب الأوروبي، بعد الفعل الرئيسي:

      - *أنّ*: **Biliyorum ki haklısın.** «أعرف أنك محق». **Umarım ki gelir.** «آمل أن يأتي».
      - النتيجة بعد **öyle / o kadar … ki**: **O kadar yorgundum ki hemen uyudum.** «كنت متعبًا إلى حدّ أنني نمت فورًا».
      - الغاية والتوكيد: **Söyle ki bilsinler.** «قلها لكي يعرفوا».

      تُكتب منفصلة؛ واللاحقة **-ki** (**evdeki**) شيء آخر.
  tr-diye:
    meaning: "diye: الاقتباس والتسمية والغاية"
    intro: |
      **diye** (حرفيًا *قائلًا*) تختم اقتباسًا أو فكرة وتربطها بالفعل:

      - الاقتباس: **"Geliyorum" diye bağırdı.** «صاح: أنا آتٍ».
      - الفكرة أو السبب: **Geç kalırım diye koştum.** «ركضت ظنًّا أني سأتأخر».
      - الغاية مع التمني/الأمر: **Uyanmasın diye sessiz konuştuk.** «تكلمنا بصوت خافت كي لا يستيقظ».
      - التسمية: **Ali diye biri** «شخص يُدعى علي»
  tr-mekte:
    meaning: "-mAktA(dIr): الاستمرار الرسمي"
    intro: |
      تضع الأخبار والتقارير والكتابة الرسمية الفعل الجاري في **-makta / -mekte**، غالبًا مع **-dır**: **Şirket yeni projeler üzerinde çalışmaktadır.** «تعمل الشركة على مشاريع جديدة». **Fiyatlar artmaktadır.** «الأسعار ترتفع». وفي الكلام الشيء نفسه بـ **-yor**: **çalışıyor، artıyor**.
  tr-formal-connectors:
    meaning: "أدوات الربط في التركية المكتوبة"
    intro: |
      تربط التركية المكتوبة الجمل بـ:

      - الاستدراك: **ancak، fakat** (لكن)، **oysa، halbuki** (في حين، والحال أنّ)، **buna rağmen** (رغم ذلك)
      - الإضافة: **ayrıca** (كذلك)، **üstelik** (فضلًا عن ذلك)، **bunun yanı sıra** (إلى جانب ذلك)
      - النتيجة: **dolayısıyla، bu nedenle، bu yüzden** (لذلك)
      - التعليل: **çünkü** (لأنّ)، **zira** (إذ، رسمية)، **nitekim** (وفعلًا)، **mademki** (ما دام)
  tr-loan-adverbs:
    meaning: "ظروف من العربية، غالبًا بـ -en"
    intro: |
      كثير من الظروف الشائعة عربية الأصل، وأغلبها بلاحقة التنوين المنصوب **-en / -an**: **tamamen** (تمامًا)، **kısmen** (قسمًا، جزئيًا)، **umumiyetle** (عمومًا؛ والتركية **genellikle**)، **maalesef** (مع الأسف)، **şahsen** (شخصيًا)، **resmen** (رسميًا، حرفيًا)، **aslen** (أصلًا)، **hakikaten** (حقيقةً)، **tesadüfen** (مصادفةً)، **mecburen** (مجبرًا، اضطرارًا). ولا تتبع التوافق الصائتي — وسيعرفها القارئ العربي فورًا.
  tr-politeness:
    meaning: "عبارات المجاملة"
    intro: |
      - **Buyurun** «تفضّل، تفضّل خذ، كيف أخدمك؟»
      - **Rica ederim** «العفو»، وأيضًا «أرجوك»
      - **Efendim?** «عفوًا؟» / «نعم؟» (في الهاتف)؛ و**efendim** أيضًا «سيدي، سيدتي»
      - **Zahmet olmazsa** «إن لم يكن في ذلك إزعاج»؛ **Kolay gelsin** «الله يسهّل» (لمن يعمل)؛ **Geçmiş olsun** «سلامتك»؛ **Ellerinize sağlık** «تسلم يداك» (شكرًا على الطعام)؛ **Afiyet olsun** «بالعافية»
      - **siz** + المخاطب الجمع لشخص واحد؛ **-(y)AbilIr misiniz?** «هل يمكنك…؟»
  tr-uzere:
    meaning: "-mAk üzere: على وشك؛ لكي؛ على أن"
    intro: |
      لـ **-mak / -mek üzere** ثلاثة استعمالات:

      - *على وشك*: **Tren kalkmak üzere.** «القطار على وشك المغادرة».
      - *لكي* (رسمي): **Okumak üzere Ankara'ya gitti.** «ذهب إلى أنقرة ليدرس».
      - *على أن*: **Yarın geri vermek üzere aldım.** «أخذته على أن أعيده غدًا».

      ومنها: **-mak yerine** «بدلًا من»، **-mak için** «لكي» (يومية).
  tr-digi-halde:
    meaning: "-DIğI + halde، takdirde، sürece، kadar، için"
    intro: |
      **-dik** + الملكية + اسم أو أداة لاحقة تعطي عائلة كاملة من أدوات الربط:

      - **-diği halde** «مع أنّ»: **Bildiği halde söylemedi.** «مع أنه كان يعرف لم يقل».
      - **-diği takdirde** «في حال» (رسمي): **Ödeme yapılmadığı takdirde …** «في حال عدم الدفع …»
      - **-diği sürece** «ما دام»: **İstediğin sürece kalabilirsin.** «يمكنك البقاء ما دمت تريد».
      - **-diği kadar** «بقدر ما»: **Bildiğim kadarıyla** «على حدّ علمي»
      - **-diği için** «لأنّ»: **Geç kaldığım için özür dilerim.** «أعتذر عن تأخري».
      - **-diği zaman** «عندما»، **-diği gibi** «كما»
  tr-ir-irmez:
    meaning: "-(A)r -mAz: ما إن"
    intro: |
      الزمن الواسع ونفيه متجاورين يعنيان *ما إن*: **Eve girer girmez telefon çaldı.** «ما إن دخلت البيت حتى رنّ الهاتف». **Beni görür görmez gülümsedi.** «ما إن رأتني حتى ابتسمت». ومثلها: **-(y)IncA** «عندما، حالما» (B1).
  tr-inceye-kadar:
    meaning: "-(y)IncAyA kadar: حتى"
    intro: |
      **-(y)ıncaya / -(y)inceye kadar** (أو **dek**) تعني *حتى*: **Sen gelinceye kadar bekledim.** «انتظرت حتى جئت». وكثيرًا ما يقول الكلام **-(y)AnA kadar**: **Sen gelene kadar bekledim.** وكلتاهما على جذر الفعل بلا لاحقة شخص.
  tr-correlatives:
    meaning: "أدوات الربط المزدوجة"
    intro: |
      - **hem … hem (de)** «… و … معًا»: **Hem akıllı hem çalışkan.** «ذكي ومجتهد معًا».
      - **ne … ne (de)** «لا … ولا»، مع فعل *مثبت*: **Ne telefon etti ne de yazdı.** «لا اتصل ولا كتب».
      - **ya … ya (da)** «إما … أو»: **Ya bugün ya yarın.**
      - **ister … ister** «سواء … أم»: **İster inan ister inanma.** «صدّق أو لا تصدّق».
      - **gerek … gerek(se)** «… و …» (رسمي)
    mistakes: ["ne … ne تنفي وحدها: تبقى الأفعال مثبتة."]
  tr-masi-gerek:
    meaning: "-mAsI gerek / lazım: يلزم فلانًا أن"
    intro: |
      **gerek، lazım، şart** (لازم، شرط) تأخذ جملة بـ **-mA** + الملكية للشخص: **Gitmem gerek.** «يلزمني أن أذهب». **Onun dinlenmesi lazım.** «يلزمه أن يرتاح». **Bunu bilmeniz şart.** «يجب عليك أن تعرف هذا حتمًا». وبلا شخص: **Gitmek lazım.** «لا بد من الذهاب». قارن **-mAlI** (A2)، وهي لاحقة فعلية: **gitmeliyim**.
  tr-maktansa:
    meaning: "بدلًا من، أفضل من: -mAktAnsA، -mAk yerine"
    intro: |
      - **-maktansa / -mektense** «بدلًا من أن»: **Burada beklemektense eve gidelim.** «بدلًا من الانتظار هنا لنذهب إلى البيت».
      - **-mak yerine** «بدلًا من»: **Ders çalışmak yerine televizyon izledi.** «بدلًا من أن يدرس شاهد التلفاز».
      - **-mAktAn** + المقارنة: **Okumaktan daha çok yazmayı severim.** «أحب الكتابة أكثر من القراءة».
  tr-maliydi:
    meaning: "كان ينبغي: -mAlIydI"
    intro: |
      **-meli / -malı** + **-ydı** تنظر إلى واجب لم يُؤدَّ: **Daha erken gitmeliydim.** «كان ينبغي أن أغادر أبكر». **Bana söylemeliydin.** «كان ينبغي أن تخبرني». والنفي: **Bunu yapmamalıydın.** «ما كان ينبغي أن تفعل ذلك».
  tr-ki-suffix:
    meaning: "اللاحقة -ki: الذي في / الذي لـ"
    intro: |
      تحوّل **-ki** المكان أو الزمان إلى صفة أو ضمير:

      - بعد الظرفية: **evdeki kitaplar** «الكتب التي في البيت»، **masadaki bardak** «الكأس التي على الطاولة»
      - بعد كلمات الزمن: **yarınki toplantı** «اجتماع الغد»، **bugünkü gazete** «جريدة اليوم»
      - بعد الإضافة، *الذي لـ*: **Benim arabam eski, seninki yeni.** «سيارتي قديمة، وسيارتك جديدة».

      وتبقى غالبًا **-ki** مهما كانت الصوائت (و**bugünkü** استثناء).
  tr-sana:
    meaning: "-sAnA: الأمر الملحّ نافد الصبر"
    intro: |
      **-sana / -sene** (والجمع **-sanıza / -senize**) أمر أليف ملحّ: *هيا، لماذا لا*: **Gelsene!** «هيا تعالَ!» **Otursanıza!** «تفضّلوا اجلسوا!» **Bir şey söylesene!** «قل شيئًا!» وقد يبدو نافد الصبر؛ أما **gel، gelin** البسيطة فمحايدة.
  tr-mis-adjective:
    meaning: "-mIş صفةً: مفعول، منجز"
    intro: |
      إلى جانب استعمالها زمنًا، تصوغ **-mış** صفات تصف حالة منجزة، كاسم المفعول: **pişmiş tavuk** «دجاج مطبوخ»، **evlenmiş çift** «الزوجان المتزوجان»، **kurutulmuş meyve** «فاكهة مجففة»، **çok okumuş biri** «شخص واسع الاطلاع». قارن **-An** (الذي يفعل / فعل): **pişen yemek** «الطعام الذي يُطبخ».
