# Macedonian text of the Turkish course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  More tenses and moods: "Уште времиња и начини"
  Subordinate forms: "Зависни форми"
  Clauses as nouns: "Реченици како именки"
  Converbs: "Глаголски прилози"
  Voice: "Залог"
  Conditions and wishes: "Услови и желби"
lessons:
  tr-evidential:
    meaning: "прекажаното минато -miş: наводно, велат"
    intro: |
      **-mış / -miş / -muş / -müş** пренесува минато што не си го видел — чуено, заклучено или откриено — точно како македонската **л-форма** (**дошол, врнело**): **Ali gelmiş.** „Али дошол (гледам / велат).“ **Yağmur yağmış.** „Врнело (улицата е мокра).“ Спореди **Ali geldi** „Али дојде“ (го видов). И во приказните: **Bir varmış, bir yokmuş…** „Си имало едно време…“
  tr-conditional:
    meaning: "услови: -se / -sa"
    intro: |
      **-se / -sa** значи *ако*: реални услови на аористот (**Gelirsen, görüşürüz.** „Ако дојдеш, ќе се видиме.“), желби и нереални услови на голата основа (**Keşke gelsen!** „Барем да дојдеш!“, **Param olsa, alırdım.** „Да имам пари, би го купил.“). **eğer** (ако) може да ја почне реченицата.
  tr-participles:
    meaning: "релативни партиципи: -en (кој…) и -dik (што јас…)"
    intro: |
      Турскиот нема релативна заменка; глаголот станува придавка пред именката:

      - **-(y)en / -(y)an** кога именката е **подмет**: **gelen adam** „човекот што доаѓа / дојде“, **çalışan kadın** „жената што работи“
      - **-dik / -dık** + присвојно кога именката е **објект** или има друга улога: **okuduğum kitap** „книгата што ја прочитав“, **oturduğumuz ev** „куќата во која живееме“; идно **-(y)eceğ-**: **okuyacağım kitap** „книгата што ќе ја читам“
  tr-converbs:
    meaning: "глаголски прилози: -ip (и), -ince (кога), -erek (правејќи)"
    intro: |
      Турскиот поврзува реченици со глаголски наставки наместо сврзници:

      - **-(y)ip**: *и (потоа)*: **Eve gelip yemek yedim.** „Дојдов дома и јадев.“
      - **-(y)ince**: *кога, штом*: **Eve gelince ara.** „Јави се кога ќе стигнеш дома.“
      - **-(y)erek**: *правејќи*: **Koşarak geldi.** „Дојде трчајќи.“
      - **-ken**: *додека*: **Yürürken düştüm.** „Паднав додека одев.“
      - **-meden**: *без да, пред да*: **Söylemeden gitti.** „Отиде без да каже.“
  tr-passive:
    meaning: "пасивот -il- / -in-"
    intro: |
      **-ıl / -il / -ul / -ül** по согласка, **-n** по самогласка, **-ın** по l: **yazmak → yazılmak** (се пишува), **okumak → okunmak** (се чита), **bilmek → bilinmek**. **Bu kitap 1950'de yazıldı.** „Оваа книга е напишана во 1950.“ **Burada sigara içilmez.** „Тука не се пуши.“
  tr-dik-complement:
    meaning: "реченици со „дека“ преку -DIK + присвојно"
    intro: |
      Турскиот нема збор за *дека* по глаголи на знаење, кажување и гледање: глаголот на зависната реченица зема **-dik / -dık / -duk / -dük** (**-tik…** по безвучна согласка), присвојно за својот подмет и падежот што го бара главниот глагол:

      - **Ali'nin geldiğini biliyorum.** „Знам дека Али дошол.“ (gel-diğ-i-ni)
      - **Ne dediğini anlamadım.** „Не разбрав што рече.“
      - **Hasta olduğumu söyledim.** „Реков дека сум болен.“

      За иднина е **-(y)AcAK**: **Geleceğini söyledi.** „Рече дека ќе дојде.“
  tr-acak-participle:
    meaning: "идниот партицип -(y)AcAK + присвојно"
    intro: |
      **-(y)acak / -(y)ecek** работи како **-dik**, за она што ќе се случи: пред именка (**okuyacağım kitap** „книгата што ќе ја читам“, **gideceğimiz yer** „местото каде што ќе одиме“) или како реченица (**Ne zaman geleceğini bilmiyorum.** „Не знам кога ќе дојде.“). Без присвојно ја опишува самата именка: **yarın gelecek misafirler** „гостите што ќе дојдат утре“. **k** станува **ğ** пред самогласка.
  tr-ma-nominal:
    meaning: "-mA + присвојно: да сака, бара, му е драго некој да направи"
    intro: |
      Глаголите на сакање, барање, советување и чувство земаат реченица на **-me / -ma** + присвојно (не **-dik**, кој е за факти) — улога што во македонскиот ја врши **да**: **Gelmeni istiyorum.** „Сакам да дојдеш.“ **Annem erken yatmamı söyledi.** „Мајка ми ми рече да легнам рано.“ **Onun gitmesine üzüldüm.** „Ми беше жал што си отиде.“ Спореди **Geldiğini biliyorum** (факт: знам дека дојде).
  tr-dikca:
    meaning: "-DIkçA: колку повеќе…, секогаш кога"
    intro: |
      **-dikçe / -dıkça / -dukça / -dükçe** (**-tikçe…** по безвучна согласка) значи *колку повеќе, сѐ додека, секогаш кога*: **Okudukça öğreniyorum.** „Колку повеќе читам, толку повеќе учам.“ **Zaman geçtikçe her şey düzeliyor.** „Како што минува времето, сѐ се средува.“ **Fırsat buldukça yüzerim.** „Пливам секогаш кога ќе најдам прилика.“
  tr-time-converbs:
    meaning: "откако, пред да, откога: -DIktAn sonra, -mAdAn önce, -DIğIndAn beri"
    intro: |
      Временските реченици се глаголски форми + постпозиција:

      - **-dikten sonra** „откако“: **Yemek yedikten sonra uyudum.** „Откако јадев, спиев.“
      - **-meden önce** „пред да“: **Yatmadan önce dişlerini fırçala.** „Измиј ги забите пред да легнеш.“
      - **-diğinden beri** „откако, од кога“: **Buraya geldiğimden beri yağmur yağıyor.** „Откако дојдов тука, врне.“
      - **-(y)alı** „откако (толку време)“: **Geleli iki yıl oldu.** „Има две години откако дојде.“
  tr-causative:
    meaning: "каузативот: натера / даде некој да направи"
    intro: |
      Каузативни наставки, избрани според основата:

      - **-t** по самогласка и кај повеќето повеќесложни основи на **-l, -r**: **okumak → okutmak** (натера да чита, учи), **beklemek → bekletmek** (остави да чека), **oturmak → oturtmak**
      - **-DIr** кај повеќето други: **yapmak → yaptırmak** (даде да се направи), **yazmak → yazdırmak**, **gülmek → güldürmek** (насмее)
      - **-Ir / -Ar** кај неколку: **bitmek → bitirmek** (заврши нешто), **düşmek → düşürmek** (испушти), **çıkmak → çıkarmak** (извади)

      **Saçımı kestirdim.** „Се потстрижав (дадов да ме потстрижат).“ **Arabayı yıkattım.** „Дадов да ми ја измијат колата.“
  tr-causative-passive:
    meaning: "наредени залози: каузатив + пасив"
    intro: |
      Наставките за залог се редат во цврст ред, каузатив пред пасив: **yap-tır-ıl-dı** „беше дадено да се направи“, **öl-dür-ül-dü** „беше убиен“, **kaldır-ıl-dı** „беше отстранет“, **bitir-il-di** „беше завршен“. Дури и два каузатива може да се наредат: **yap-tır-t-mak** „да даде некој да даде да се направи“.
  tr-reciprocal-reflexive:
    meaning: "заемно -(I)ş и повратно -(I)n"
    intro: |
      - **-(I)ş** „еден со друг, заедно“: **görmek → görüşmek** (се сретнуваат, се гледаат), **tanımak → tanışmak** (се запознаваат), **bulmak → buluşmak** (се наоѓаат), **anlamak → anlaşmak** (се договараат, се разбираат)
      - **-(I)n** „себеси“: **yıkamak → yıkanmak** (се мие), **giymek → giyinmek** (се облекува), **hazırlamak → hazırlanmak** (се подготвува)

      **Yarın görüşürüz!** „Се гледаме утре!“ **Memnun oldum, tanıştığımıza.** „Мило ми е што се запознавме.“
  tr-past-conditional:
    meaning: "нереално минато: -sAydI"
    intro: |
      **-sa / -se** + **-ydı / -ydi** е нереален услов за минатото, обично со **-ırdı** (ќе бев) во главната: **Bilseydim gelirdim.** „Да знаев, ќе дојдев.“ **Erken kalksaydın treni kaçırmazdın.** „Да станеше рано, немаше да го испуштиш возот.“ Со **keşke**: **Keşke gitmeseydim.** „Барем да не бев отишол.“
  tr-keske:
    meaning: "желби: keşke + -sA"
    intro: |
      **keşke** „барем, да даде господ“ + формата **-sA** (желба за сега) или **-sAydI** (за минатото): **Keşke burada olsan!** „Барем да си тука!“ **Keşke daha çok zamanım olsa.** „Барем да имам повеќе време.“ **Keşke söyleseydin.** „Барем да ми беше кажал.“
  tr-sa-da:
    meaning: "дури и ако: -sA dA; што и да е: -sA … заповедно"
    intro: |
      - **-sa da / -se de** „дури и ако, иако“: **Yağmur yağsa da gideceğim.** „Дури и да врне, ќе одам.“ **Zengin olsa da mutlu değil.** „Иако е богат, не е среќен.“
      - прашален збор + **-sA** + истиот глагол во заповеден: *што и да, каде и да*: **Ne yaparsan yap.** „Прави што сакаш.“ **Nereye gidersen git.** „Оди каде сакаш.“
