# Arabic text of the Turkish course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  More tenses and moods: "أزمنة وصيغ أخرى"
  Subordinate forms: "الصيغ التابعة"
  Clauses as nouns: "الجمل بمنزلة الأسماء"
  Converbs: "الصيغ الظرفية"
  Voice: "البناء"
  Conditions and wishes: "الشرط والتمني"
lessons:
  tr-evidential:
    meaning: "الماضي النقلي -miş: على ما يبدو، يقولون"
    intro: |
      **-mış / -miş / -muş / -müş** تنقل ماضيًا لم تشهده — سمعته أو استنتجته أو اكتشفته: **Ali gelmiş.** «يبدو أن علي جاء». **Yağmur yağmış.** «يبدو أنها أمطرت (الشارع مبلول)». قارن **Ali geldi** «جاء علي» (رأيته). وفي الحكايات: **Bir varmış, bir yokmuş…** «كان يا ما كان…»
  tr-conditional:
    meaning: "الشرط: -se / -sa"
    intro: |
      **-se / -sa** تعني *إذا*: الشرط الواقعي على الزمن الواسع (**Gelirsen, görüşürüz.** «إذا جئت نلتقي»)، والتمني والشرط غير الواقع على الجذر المجرد (**Keşke gelsen!** «ليتك تأتي!»، **Param olsa, alırdım.** «لو كان عندي مال لاشتريته»). وقد تبدأ الجملة بـ **eğer** (إن).
  tr-participles:
    meaning: "صيغ الصلة: -en (الذي…) و-dik (الذي … أنا)"
    intro: |
      لا اسم موصول في التركية؛ يصير الفعل صفة قبل الاسم:

      - **-(y)en / -(y)an** إذا كان الاسم **فاعلًا**: **gelen adam** «الرجل الذي يأتي / أتى»، **çalışan kadın** «المرأة العاملة»
      - **-dik / -dık** + الملكية إذا كان الاسم **مفعولًا** أو له دور آخر: **okuduğum kitap** «الكتاب الذي قرأته»، **oturduğumuz ev** «البيت الذي نسكنه»؛ والمستقبل **-(y)eceğ-**: **okuyacağım kitap** «الكتاب الذي سأقرؤه»
  tr-converbs:
    meaning: "الصيغ الظرفية: -ip (و)، -ince (عندما)، -erek (بـ …)"
    intro: |
      تربط التركية الجمل بلواحق فعلية بدل أدوات الربط:

      - **-(y)ip**: *ثم*: **Eve gelip yemek yedim.** «جئت إلى البيت وأكلت».
      - **-(y)ince**: *عندما، حالما*: **Eve gelince ara.** «اتصل حين تصل البيت».
      - **-(y)erek**: *بـ…، وهو يفعل*: **Koşarak geldi.** «جاء راكضًا».
      - **-ken**: *بينما*: **Yürürken düştüm.** «سقطت وأنا أمشي».
      - **-meden**: *دون أن، قبل أن*: **Söylemeden gitti.** «ذهب دون أن يقول».
  tr-passive:
    meaning: "المبني للمجهول -il- / -in-"
    intro: |
      **-ıl / -il / -ul / -ül** بعد الصامت، و**-n** بعد الصائت، و**-ın** بعد l: **yazmak → yazılmak** (كُتب)، **okumak → okunmak** (قُرئ)، **bilmek → bilinmek**. **Bu kitap 1950'de yazıldı.** «كُتب هذا الكتاب سنة 1950». **Burada sigara içilmez.** «لا يُدخَّن هنا».
  tr-dik-complement:
    meaning: "جمل «أنّ» بـ -DIK + الملكية"
    intro: |
      ليس في التركية كلمة لـ *أنّ* بعد أفعال المعرفة والقول والرؤية: يأخذ فعل الجملة التابعة **-dik / -dık / -duk / -dük** (**-tik…** بعد صامت مهموس)، ولاحقة ملكية لفاعله، والحالة التي يطلبها الفعل الرئيسي — كالمصدر المؤوّل في العربية:

      - **Ali'nin geldiğini biliyorum.** «أعرف أن عليًّا جاء». (gel-diğ-i-ni)
      - **Ne dediğini anlamadım.** «لم أفهم ما قلت».
      - **Hasta olduğumu söyledim.** «قلت إنني مريض».

      وللمستقبل **-(y)AcAK**: **Geleceğini söyledi.** «قال إنه سيأتي».
  tr-acak-participle:
    meaning: "صيغة المستقبل -(y)AcAK + الملكية"
    intro: |
      تعمل **-(y)acak / -(y)ecek** عمل **-dik** لما سيحدث: قبل اسم (**okuyacağım kitap** «الكتاب الذي سأقرؤه»، **gideceğimiz yer** «المكان الذي سنذهب إليه») أو جملةً (**Ne zaman geleceğini bilmiyorum.** «لا أعرف متى سيأتي»). وبلا ملكية تصف الاسم نفسه: **yarın gelecek misafirler** «الضيوف الذين سيأتون غدًا». وتصير **k** إلى **ğ** قبل الصائت.
  tr-ma-nominal:
    meaning: "-mA + الملكية: أن يريد أو يطلب أو يحب أن يفعل أحد"
    intro: |
      أفعال الإرادة والطلب والنصح والشعور تأخذ جملة بـ **-me / -ma** + الملكية (لا **-dik** التي للوقائع): **Gelmeni istiyorum.** «أريدك أن تأتي». **Annem erken yatmamı söyledi.** «قالت أمي أن أنام مبكرًا». **Onun gitmesine üzüldüm.** «حزنت لذهابه». قارن **Geldiğini biliyorum** (واقعة: أعرف أنك جئت).
  tr-dikca:
    meaning: "-DIkçA: كلما…"
    intro: |
      **-dikçe / -dıkça / -dukça / -dükçe** (**-tikçe…** بعد صامت مهموس) تعني *كلما*: **Okudukça öğreniyorum.** «كلما قرأت تعلّمت». **Zaman geçtikçe her şey düzeliyor.** «كلما مرّ الوقت تحسّن كل شيء». **Fırsat buldukça yüzerim.** «أسبح كلما وجدت فرصة».
  tr-time-converbs:
    meaning: "بعد أن، قبل أن، منذ: -DIktAn sonra، -mAdAn önce، -DIğIndAn beri"
    intro: |
      جمل الزمن صيغ فعلية + أداة لاحقة:

      - **-dikten sonra** «بعد أن»: **Yemek yedikten sonra uyudum.** «بعد أن أكلت نمت».
      - **-meden önce** «قبل أن»: **Yatmadan önce dişlerini fırçala.** «نظّف أسنانك قبل أن تنام».
      - **-diğinden beri** «منذ»: **Buraya geldiğimden beri yağmur yağıyor.** «إنها تمطر منذ جئت هنا».
      - **-(y)alı** «منذ (كذا من الوقت)»: **Geleli iki yıl oldu.** «مضت سنتان منذ جاء».
  tr-causative:
    meaning: "التعدية: جعله يفعل، كلّف غيره"
    intro: |
      لواحق التعدية تُختار بحسب الجذر:

      - **-t** بعد الصائت ومعظم الجذور متعددة المقاطع المنتهية بـ **-l، -r**: **okumak → okutmak** (جعله يقرأ، درّس)، **beklemek → bekletmek** (جعله ينتظر)، **oturmak → oturtmak**
      - **-DIr** لمعظم الجذور الأخرى: **yapmak → yaptırmak** (جعل غيره يعمل)، **yazmak → yazdırmak**، **gülmek → güldürmek** (أضحك)
      - **-Ir / -Ar** لبعضها: **bitmek → bitirmek** (أنهى شيئًا)، **düşmek → düşürmek** (أسقط)، **çıkmak → çıkarmak** (أخرج)

      **Saçımı kestirdim.** «قصصت شعري (عند حلاق)». **Arabayı yıkattım.** «غسّلت السيارة (عند غيري)».
  tr-causative-passive:
    meaning: "تراكب البناء: التعدية + المجهول"
    intro: |
      تتراكب لواحق البناء بترتيب ثابت، التعدية قبل المجهول: **yap-tır-ıl-dı** «جُعل يُعمل»، **öl-dür-ül-dü** «قُتل»، **kaldır-ıl-dı** «أُزيل»، **bitir-il-di** «أُنهي». وقد تتراكب تعديتان: **yap-tır-t-mak** «جعل أحدًا يجعل غيره يعمل».
  tr-reciprocal-reflexive:
    meaning: "المشاركة -(I)ş والانعكاس -(I)n"
    intro: |
      - **-(I)ş** «بعضهم بعضًا، معًا»، كوزن «تفاعل»: **görmek → görüşmek** (تقابلا)، **tanımak → tanışmak** (تعارفا)، **bulmak → buluşmak** (التقيا)، **anlamak → anlaşmak** (اتفقا، تفاهما)
      - **-(I)n** «نفسه»، كوزن «افتعل»: **yıkamak → yıkanmak** (اغتسل)، **giymek → giyinmek** (لبس ثيابه)، **hazırlamak → hazırlanmak** (استعدّ)

      **Yarın görüşürüz!** «نلتقي غدًا!» **Memnun oldum, tanıştığımıza.** «تشرفت بمعرفتك».
  tr-past-conditional:
    meaning: "الماضي غير الواقع: -sAydI"
    intro: |
      **-sa / -se** + **-ydı / -ydi** شرط غير واقع في الماضي، وغالبًا مع **-ırdı** في الجملة الرئيسية: **Bilseydim gelirdim.** «لو عرفت لجئت». **Erken kalksaydın treni kaçırmazdın.** «لو نهضت مبكرًا لما فاتك القطار». ومع **keşke**: **Keşke gitmeseydim.** «ليتني لم أذهب».
  tr-keske:
    meaning: "التمني: keşke + -sA"
    intro: |
      **keşke** «ليت» + صيغة **-sA** (تمنٍّ للحاضر) أو **-sAydI** (للماضي): **Keşke burada olsan!** «ليتك هنا!» **Keşke daha çok zamanım olsa.** «ليت عندي وقتًا أكثر». **Keşke söyleseydin.** «ليتك أخبرتني».
  tr-sa-da:
    meaning: "حتى لو: -sA dA؛ مهما: -sA … الأمر"
    intro: |
      - **-sa da / -se de** «حتى لو، مع أنّ»: **Yağmur yağsa da gideceğim.** «سأذهب حتى لو أمطرت». **Zengin olsa da mutlu değil.** «مع أنه غني فليس سعيدًا».
      - أداة استفهام + **-sA** + الفعل نفسه في الأمر: *مهما، أينما*: **Ne yaparsan yap.** «افعل ما شئت». **Nereye gidersen git.** «اذهب أينما شئت».
