# German text of the Turkish course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  More tenses and moods: "Weitere Tempora und Modi"
  Subordinate forms: "Untergeordnete Formen"
  Clauses as nouns: "Sätze als Nomen"
  Converbs: "Konverben"
  Voice: "Diathese"
  Conditions and wishes: "Bedingungen und Wünsche"
lessons:
  tr-evidential:
    meaning: "die Evidentialvergangenheit -miş: anscheinend, man sagt"
    intro: |
      **-mış / -miş / -muş / -müş** berichtet eine nicht selbst erlebte Vergangenheit — gehört, erschlossen oder entdeckt: **Ali gelmiş.** „Ali ist (anscheinend / wie ich sehe) gekommen.“ **Yağmur yağmış.** „Es hat geregnet (die Straße ist nass).“ Vergleiche **Ali geldi** (ich sah ihn kommen). Auch in Märchen: **Bir varmış, bir yokmuş…** „Es war einmal …“
  tr-conditional:
    meaning: "Bedingungen: -se / -sa"
    intro: |
      **-se / -sa** markiert *wenn*: reale Bedingungen auf dem Aorist (**Gelirsen, görüşürüz.** „Wenn du kommst, sehen wir uns.“), Wünsche und irreale Bedingungen am bloßen Stamm (**Keşke gelsen!** „Wenn du doch kämest!“, **Param olsa, alırdım.** „Hätte ich Geld, würde ich es kaufen.“). **eğer** (wenn) kann den Satz einleiten.
  tr-participles:
    meaning: "Relativpartizipien: -en (der …) und -dik (den ich …)"
    intro: |
      Türkisch hat kein Relativpronomen; das Verb wird zum Adjektiv vor dem Nomen:

      - **-(y)en / -(y)an**, wenn das Nomen **Subjekt** ist: **gelen adam** „der Mann, der kommt / kam“, **çalışan kadın** „die arbeitende Frau“
      - **-dik / -dık** + Possessiv, wenn das Nomen **Objekt** ist oder eine andere Rolle hat: **okuduğum kitap** „das Buch, das ich gelesen habe“, **oturduğumuz ev** „das Haus, in dem wir wohnen“; Futur **-(y)eceğ-**: **okuyacağım kitap** „das Buch, das ich lesen werde“
  tr-converbs:
    meaning: "Konverben: -ip (und), -ince (wenn), -erek (indem)"
    intro: |
      Türkisch verbindet Sätze mit Verbendungen statt Konjunktionen:

      - **-(y)ip**: *und (dann)*: **Eve gelip yemek yedim.** „Ich kam nach Hause und aß.“
      - **-(y)ince**: *als, sobald*: **Eve gelince ara.** „Ruf an, wenn du zu Hause bist.“
      - **-(y)erek**: *indem, während*: **Koşarak geldi.** „Er kam angerannt.“
      - **-ken**: *während*: **Yürürken düştüm.** „Ich fiel beim Gehen hin.“
      - **-meden**: *ohne, bevor*: **Söylemeden gitti.** „Er ging, ohne etwas zu sagen.“
  tr-passive:
    meaning: "das Passiv -il- / -in-"
    intro: |
      **-ıl / -il / -ul / -ül** nach Konsonant, **-n** nach Vokal, **-ın** nach l: **yazmak → yazılmak** (geschrieben werden), **okumak → okunmak** (gelesen werden), **bilmek → bilinmek**. **Bu kitap 1950'de yazıldı.** „Dieses Buch wurde 1950 geschrieben.“ **Burada sigara içilmez.** „Hier wird nicht geraucht.“
  tr-dik-complement:
    meaning: "dass-Sätze mit -DIK + Possessiv"
    intro: |
      Türkisch hat kein Wort für *dass* nach Verben des Wissens, Sagens und Sehens: das Verb des Nebensatzes nimmt **-dik / -dık / -duk / -dük** (**-tik …** nach stimmlosem Konsonanten), ein Possessiv für sein Subjekt und den Kasus, den das Hauptverb verlangt:

      - **Ali'nin geldiğini biliyorum.** „Ich weiß, dass Ali gekommen ist.“ (gel-diğ-i-ni)
      - **Ne dediğini anlamadım.** „Ich habe nicht verstanden, was du gesagt hast.“
      - **Hasta olduğumu söyledim.** „Ich sagte, dass ich krank sei.“

      Für die Zukunft steht **-(y)AcAK**: **Geleceğini söyledi.** „Er sagte, er werde kommen.“
  tr-acak-participle:
    meaning: "das Futurpartizip -(y)AcAK + Possessiv"
    intro: |
      **-(y)acak / -(y)ecek** funktioniert wie **-dik**, für Künftiges: vor einem Nomen (**okuyacağım kitap** „das Buch, das ich lesen werde“, **gideceğimiz yer** „der Ort, an den wir gehen werden“) oder als Nebensatz (**Ne zaman geleceğini bilmiyorum.** „Ich weiß nicht, wann er kommt.“). Ohne Possessiv beschreibt es das Nomen selbst: **yarın gelecek misafirler** „die Gäste, die morgen kommen“. **k** wird vor Vokal zu **ğ**.
  tr-ma-nominal:
    meaning: "-mA + Possessiv: wollen, bitten, mögen, dass jemand etwas tut"
    intro: |
      Verben des Wollens, Bittens, Ratens und Fühlens nehmen einen Satz auf **-me / -ma** + Possessiv (nicht **-dik**, das für Tatsachen steht): **Gelmeni istiyorum.** „Ich will, dass du kommst.“ **Annem erken yatmamı söyledi.** „Meine Mutter sagte mir, ich solle früh ins Bett gehen.“ **Onun gitmesine üzüldüm.** „Ich war traurig, dass er ging.“ Vergleiche **Geldiğini biliyorum** (eine Tatsache: ich weiß, dass du gekommen bist).
  tr-dikca:
    meaning: "-DIkçA: je mehr …, immer wenn"
    intro: |
      **-dikçe / -dıkça / -dukça / -dükçe** (**-tikçe …** nach stimmlosem Konsonanten) heißt *je mehr, solange, immer wenn*: **Okudukça öğreniyorum.** „Je mehr ich lese, desto mehr lerne ich.“ **Zaman geçtikçe her şey düzeliyor.** „Mit der Zeit wird alles besser.“ **Fırsat buldukça yüzerim.** „Immer wenn ich Gelegenheit habe, schwimme ich.“
  tr-time-converbs:
    meaning: "nachdem, bevor, seit: -DIktAn sonra, -mAdAn önce, -DIğIndAn beri"
    intro: |
      Temporalsätze sind Verbformen + eine Postposition:

      - **-dikten sonra** „nachdem“: **Yemek yedikten sonra uyudum.** „Nach dem Essen schlief ich.“
      - **-meden önce** „bevor“: **Yatmadan önce dişlerini fırçala.** „Putz dir vor dem Schlafengehen die Zähne.“
      - **-diğinden beri** „seit“: **Buraya geldiğimden beri yağmur yağıyor.** „Seit ich hier bin, regnet es.“
      - **-(y)alı** „seit (so lange)“: **Geleli iki yıl oldu.** „Er ist schon zwei Jahre hier.“
  tr-causative:
    meaning: "das Kausativ: jemanden etwas tun lassen"
    intro: |
      Kausativsuffixe, nach dem Stamm gewählt:

      - **-t** nach Vokal und bei den meisten mehrsilbigen Stämmen auf **-l, -r**: **okumak → okutmak** (lesen lassen, unterrichten), **beklemek → bekletmek** (warten lassen), **oturmak → oturtmak**
      - **-DIr** bei den meisten anderen Stämmen: **yapmak → yaptırmak** (machen lassen), **yazmak → yazdırmak**, **gülmek → güldürmek** (zum Lachen bringen)
      - **-Ir / -Ar** bei einigen: **bitmek → bitirmek** (etwas beenden), **düşmek → düşürmek** (fallen lassen), **çıkmak → çıkarmak** (herausnehmen)

      **Saçımı kestirdim.** „Ich habe mir die Haare schneiden lassen.“ **Arabayı yıkattım.** „Ich habe das Auto waschen lassen.“
  tr-causative-passive:
    meaning: "gestapelte Diathese: Kausativ + Passiv"
    intro: |
      Diathesensuffixe stapeln sich in fester Reihenfolge, Kausativ vor Passiv: **yap-tır-ıl-dı** „wurde machen gelassen“, **öl-dür-ül-dü** „wurde getötet“, **kaldır-ıl-dı** „wurde entfernt“, **bitir-il-di** „wurde beendet“. Sogar zwei Kausative können sich stapeln: **yap-tır-t-mak** „jemanden etwas machen lassen lassen“.
  tr-reciprocal-reflexive:
    meaning: "Reziprok -(I)ş und Reflexiv -(I)n"
    intro: |
      - **-(I)ş** „einander, miteinander“: **görmek → görüşmek** (sich treffen, sich sehen), **tanımak → tanışmak** (sich kennenlernen), **bulmak → buluşmak** (sich treffen), **anlamak → anlaşmak** (sich einigen, sich verstehen)
      - **-(I)n** „sich selbst“: **yıkamak → yıkanmak** (sich waschen), **giymek → giyinmek** (sich anziehen), **hazırlamak → hazırlanmak** (sich fertig machen)

      **Yarın görüşürüz!** „Bis morgen!“ **Memnun oldum, tanıştığımıza.** „Freut mich, Sie kennenzulernen.“
  tr-past-conditional:
    meaning: "irreale Vergangenheit: -sAydI"
    intro: |
      **-sa / -se** + **-ydı / -ydi** ist eine irreale Bedingung der Vergangenheit, meist mit **-ırdı** (hätte) im Hauptsatz: **Bilseydim gelirdim.** „Hätte ich es gewusst, wäre ich gekommen.“ **Erken kalksaydın treni kaçırmazdın.** „Wärst du früh aufgestanden, hättest du den Zug nicht verpasst.“ Mit **keşke**: **Keşke gitmeseydim.** „Wäre ich doch nicht gegangen.“
  tr-keske:
    meaning: "Wünsche: keşke + -sA"
    intro: |
      **keşke** „wenn doch, ich wünschte“ + die **-sA**-Form (Wunsch für jetzt) oder **-sAydI** (für die Vergangenheit): **Keşke burada olsan!** „Wärst du doch hier!“ **Keşke daha çok zamanım olsa.** „Hätte ich doch mehr Zeit.“ **Keşke söyleseydin.** „Hättest du es mir doch gesagt.“
  tr-sa-da:
    meaning: "selbst wenn: -sA dA; was auch immer: -sA … Imperativ"
    intro: |
      - **-sa da / -se de** „selbst wenn, obwohl“: **Yağmur yağsa da gideceğim.** „Selbst wenn es regnet, gehe ich.“ **Zengin olsa da mutlu değil.** „Obwohl er reich ist, ist er nicht glücklich.“
      - Fragewort + **-sA** + dasselbe Verb im Imperativ: *was / wo auch immer*: **Ne yaparsan yap.** „Mach, was du willst.“ **Nereye gidersen git.** „Geh, wohin du willst.“
