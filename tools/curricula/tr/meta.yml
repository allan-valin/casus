# Turkish Learn lessons, written for Casus (2026-10-20). Open courses were searched: Yedi İklim, İstanbul Yabancılar
# İçin Türkçe and Hitit are all-rights-reserved; Wikibooks' Turkish is a few pages. So the lessons follow the order of
# the usual courses and of the CEFR-based Yunus Emre Enstitüsü syllabus (A1–B1), and the facts follow Göksel & Kerslake's
# description as summarised in Wikipedia's Turkish grammar (CC BY-SA). Exercises: Tatoeba's Turkish sentences.
system: CEFR
credit:
  en: "Lessons written for Casus; forms from Wiktionary (CC BY-SA). Exercise sentences: Tatoeba (CC BY 2.0 FR)."
  pt: "Lições escritas para o Casus; formas do Wikcionário (CC BY-SA). Frases dos exercícios: Tatoeba (CC BY 2.0 FR)."
level_files: [A1, A2, B1]
name_stems: [Tom, Mari, Mary, John, Ken, Jack, Bob, Alice, Ahmet, Mehmet, Ayşe, Ali, Fatma]
# a gap is a whole written word (the reader splits Ankara'da, depresyondadır); wrong answers only forms real text
# has (Turkish paradigms run to thousands of derived forms: inanabiliyordunuz)
whole_words: true
strict_attested: true
