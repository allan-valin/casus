  - id: ar-b1-become
    title: أصبح، صار، ما زال
    meaning: {en: "become, still: كان's sisters", pt: "tornar-se, ainda: as irmãs de كان"}
    intro:
      en: |
        Like **كَانَ**, these verbs take a nominative subject and an **accusative** predicate: **أَصْبَحَ / صَارَ** "became", **مَا زَالَ / لَا يَزَالُ** "is still", **ظَلَّ** "kept on", **لَيْسَ** "is not". **أَصْبَحَ الْجَوُّ بَارِدًا.** "The weather became cold." **مَا زِلْتُ أَنْتَظِرُ.** "I'm still waiting."
      pt: |
        Como **كَانَ**, esses verbos pedem sujeito no nominativo e predicado no **acusativo**: **أَصْبَحَ / صَارَ** "tornou-se", **مَا زَالَ / لَا يَزَالُ** "ainda está", **ظَلَّ** "continuou", **لَيْسَ** "não é". **أَصْبَحَ الْجَوُّ بَارِدًا.** "O tempo ficou frio." **مَا زِلْتُ أَنْتَظِرُ.** "Ainda estou esperando."
    examples:
    - [أصبح الجو بارداً., The weather became cold., O tempo ficou frio., أصبح]
    - [ما زلت أنتظر., I'm still waiting., Ainda estou esperando., زلت]
    - [صار طبيباً., He became a doctor., Ele virou médico., صار]
