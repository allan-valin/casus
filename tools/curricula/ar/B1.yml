  - id: ar-b1-number-agreement
    title: ثلاثة كتب، ثلاث بنات
    meaning: {en: "numbers 3–10: reversed gender", pt: "números 3–10: gênero invertido"}
    intro:
      en: |
        From three to ten the number takes the **opposite gender** of the noun's singular: a masculine noun gets the number **with ة**, a feminine one **without**: **ثَلَاثَةُ كُتُبٍ** "three books" (كتاب m.), **ثَلَاثُ بَنَاتٍ** "three girls" (بنت f.). The noun is **plural genitive**.

        From 11 to 99 the noun is **singular accusative**: **عِشْرُونَ طَالِبًا** "twenty students".
      pt: |
        Do três ao dez o número fica no **gênero oposto** ao singular do substantivo: substantivo masculino leva o número **com ة**, feminino **sem**: **ثَلَاثَةُ كُتُبٍ** "três livros" (كتاب m.), **ثَلَاثُ بَنَاتٍ** "três meninas" (بنت f.). O substantivo vai no **plural genitivo**.

        De 11 a 99 o substantivo fica no **singular acusativo**: **عِشْرُونَ طَالِبًا** "vinte estudantes".
    table:
      head: {en: [Masculine noun, Feminine noun], pt: [Substantivo masculino, Substantivo feminino]}
      rows:
      - [ثَلَاثَةُ كُتُبٍ, ثَلَاثُ بَنَاتٍ]
      - [خَمْسَةُ رِجَالٍ, خَمْسُ نِسَاءٍ]
      - [سَبْعَةُ أَيَّامٍ, سَبْعُ سَاعَاتٍ]
    mistakes:
    - wrong: ثَلَاثُ كُتُبٍ
      right: ثَلَاثَةُ كُتُبٍ
      why: {en: "Masculine noun, number with ة.", pt: "Substantivo masculino, número com ة."}
    examples:
    - [عندي ثلاثة إخوة., I have three brothers., Tenho três irmãos., ثلاثة]
    - [انتظرت خمس ساعات., I waited five hours., Esperei cinco horas., خمس]
