  - id: ar-c2-lam-emphasis
    title: إنّه لَصادق
    meaning: {en: "the emphatic lām after إنّ", pt: "o lām enfático depois de إنّ"}
    intro:
      en: |
        After **إِنَّ** the predicate (or a postponed subject) can take the emphatic **لَـ** (اللام المزحلقة "the slid lām"): **إِنَّهُ لَصَادِقٌ** "he is truly honest", **إِنَّ هٰذَا لَأَمْرٌ عَجِيبٌ** "this is indeed a strange matter", **إِنَّ فِي ذٰلِكَ لَعِبْرَةً** "in that there is surely a lesson". It is a feature of rhetoric, the Qur'an and formal speeches; the lām never comes right after **إِنَّ**, but "slides" to the predicate. The lightened **إِنْ** keeps the lām obligatorily, to tell it from negative **إِنْ**: **إِنْ كَانَ لَصَادِقًا** "he was truly honest".
      pt: |
        Depois de **إِنَّ** o predicado (ou um sujeito posposto) pode levar o **لَـ** enfático (اللام المزحلقة "o lām deslizado"): **إِنَّهُ لَصَادِقٌ** "ele é realmente sincero", **إِنَّ هٰذَا لَأَمْرٌ عَجِيبٌ** "isto é de fato uma coisa estranha", **إِنَّ فِي ذٰلِكَ لَعِبْرَةً** "nisso há certamente uma lição". É um traço da retórica, do Alcorão e dos discursos formais; o lām nunca vem logo depois de **إِنَّ**, mas "desliza" para o predicado. O **إِنْ** atenuado conserva o lām obrigatoriamente, para se distinguir do **إِنْ** negativo: **إِنْ كَانَ لَصَادِقًا** "ele era realmente sincero".
    examples:
    - ["إنه لصادق.", "He is truly honest.", "Ele é realmente sincero.", "لصادق"]
    - ["إن هذا لأمر عجيب.", "This is indeed a strange matter.", "Isto é de fato uma coisa estranha.", "لأمر"]
    - ["إنها لفكرة رائعة.", "That's truly a wonderful idea.", "É realmente uma ideia maravilhosa.", "لفكرة"]
    match: {seq: [{word: [انه, انها, انك, انني, انهم, انكم, ان]}, {re: "^(?!(?:لماذا|لديك|ليست|لديه|لهم|لقد|لما|لكي|لها|لكم|ليس|لدي|لان|لنا|لكن|لن|لو|لي|لم|لك|لا|له)$)[\\s\\S]*?(?:^ل(ا|ي|م|ف|ص|ع|ج|ك|ح|س|ر|ط|ب|ق|ش|خ|د|ت|ن|غ|ز|ه|ث|ذ|ض|ظ))"}], near: 2, gap: 1}

- title: {en: Literary connectors, pt: Conectores literários}
  lessons:
  - id: ar-c2-conditional-nouns
    title: مهما، أينما، كلّما، من
    meaning: {en: "conditional nouns: whatever, wherever, whenever", pt: "nomes condicionais: o que quer que, onde quer que, sempre que"}
    intro:
      en: |
        Beside **إِنْ، إِذَا، لَوْ**, a set of **conditional nouns** introduce general conditions, classically with the **jussive** (or the past) in both clauses: **مَنْ** "whoever" (**مَنْ يَجْتَهِدْ يَنْجَحْ** "whoever works hard succeeds"), **مَا / مَهْمَا** "whatever" (**مَهْمَا تَفْعَلْ…**), **أَيْنَمَا / حَيْثُمَا** "wherever", **مَتَى** "whenever", **كَيْفَمَا** "however". **كُلَّمَا** "every time that" takes the past in both clauses: **كُلَّمَا رَأَيْتُهُ تَذَكَّرْتُ أَبِي** "every time I see him I remember my father".
      pt: |
        Ao lado de **إِنْ، إِذَا، لَوْ**, um grupo de **nomes condicionais** introduz condições gerais, no clássico com o **jussivo** (ou o passado) nas duas orações: **مَنْ** "quem" (**مَنْ يَجْتَهِدْ يَنْجَحْ** "quem se esforça tem sucesso"), **مَا / مَهْمَا** "o que quer que" (**مَهْمَا تَفْعَلْ…**), **أَيْنَمَا / حَيْثُمَا** "onde quer que", **مَتَى** "sempre que", **كَيْفَمَا** "como quer que". **كُلَّمَا** "toda vez que" pede o passado nas duas orações: **كُلَّمَا رَأَيْتُهُ تَذَكَّرْتُ أَبِي** "toda vez que o vejo, lembro do meu pai".
    examples:
    - ["مهما حدث فلن أتركك.", "Whatever happens, I won't leave you.", "Aconteça o que acontecer, não vou te deixar.", "مهما"]
    - ["سأتبعك أينما ذهبت.", "I'll follow you wherever you go.", "Vou te seguir aonde você for.", "أينما"]
    - ["كلما رأيته تذكرت أبي.", "Every time I see him I remember my father.", "Toda vez que o vejo lembro do meu pai.", "كلما"]
    match: {seq: [{word: [مهما, اينما, حيثما, كيفما, كلما, اذما]}], gap: 0}
    pool: [مهما, أينما, حيثما, كيفما, كلما, إذا, عندما]

  - id: ar-c2-lamma-idh
    title: لمّا، إذ، ما إن… حتى
    meaning: {en: "literary time connectors", pt: "conectores temporais literários"}
    intro:
      en: |
        Literary narrative links events with:

        - **لَمَّا** + past "when, after": **لَمَّا وَصَلَ اسْتَقْبَلُوهُ** "when he arrived they welcomed him"; + jussive it means "not yet": **لَمَّا يَصِلْ** "he hasn't arrived yet"
        - **إِذْ** "when, since, as": **إِذْ كُنْتُ صَغِيرًا** "when I was little"; **إِذْ** also gives a cause
        - **إِذَا** of surprise (إذا الفجائية) + noun: **خَرَجْتُ فَإِذَا الْمَطَرُ يَنْهَمِرُ** "I went out, and lo, the rain was pouring"
        - **مَا إِنْ … حَتَّى** "no sooner … than": **مَا إِنْ وَصَلَ حَتَّى نَامَ** "no sooner had he arrived than he fell asleep"
        - **رَيْثَمَا** "until, while (waiting)", **حَالَمَا** "as soon as"
      pt: |
        A narrativa literária liga os fatos com:

        - **لَمَّا** + passado "quando, depois que": **لَمَّا وَصَلَ اسْتَقْبَلُوهُ** "quando ele chegou, o receberam"; + jussivo quer dizer "ainda não": **لَمَّا يَصِلْ** "ele ainda não chegou"
        - **إِذْ** "quando, já que": **إِذْ كُنْتُ صَغِيرًا** "quando eu era pequeno"; **إِذْ** também dá uma causa
        - **إِذَا** de surpresa (إذا الفجائية) + substantivo: **خَرَجْتُ فَإِذَا الْمَطَرُ يَنْهَمِرُ** "saí, e eis que chovia a cântaros"
        - **مَا إِنْ … حَتَّى** "mal … e já": **مَا إِنْ وَصَلَ حَتَّى نَامَ** "mal chegou, dormiu"
        - **رَيْثَمَا** "até que, enquanto (se espera)", **حَالَمَا** "assim que"
    examples:
    - ["لما وصل استقبلوه بحرارة.", "When he arrived, they welcomed him warmly.", "Quando ele chegou, o receberam calorosamente.", "لما"]
    - ["ما إن وصل حتى نام.", "No sooner had he arrived than he fell asleep.", "Mal chegou e já dormiu.", "حتى"]
    - ["سأتصل بك حالما أصل.", "I'll call you as soon as I arrive.", "Ligo para você assim que chegar.", "حالما"]
    match:
    - {seq: [{word: [لما], start: true}], gap: 0}
    - {seq: [{word: [اذ, ريثما, حالما]}], gap: 0}
    - {seq: [{word: [ما]}, {word: [ان]}, {word: [حتى]}], near: 4, gap: 2}
    pool: [لما, إذ, ريثما, حالما, عندما, حتى, بينما]
