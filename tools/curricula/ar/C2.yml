  - id: ar-c2-tamyiz
    title: كم كتاباً؟ عشرون طالباً
    meaning: {en: "tamyīz: the accusative of specification", pt: "tamyīz: o acusativo de especificação"}
    intro:
      en: |
        **التمييز** is an indefinite **accusative** that says *in what respect* something is meant:

        - after numbers **11–99**: **أَحَدَ عَشَرَ كِتَابًا**, **عِشْرُونَ طَالِبًا**, **خَمْسُونَ سَنَةً** (singular accusative)
        - after interrogative **كَمْ** "how many": **كَمْ كِتَابًا قَرَأْتَ؟** "how many books have you read?" (after exclamatory **كَمْ** "how many…!" the noun is genitive: **كَمْ كِتَابٍ قَرَأْتُ!**)
        - after an elative or a verb of fullness: **هُوَ أَكْثَرُ عِلْمًا** "he is more learned" (literally "more in knowledge"), **اِمْتَلَأَ الْكَأْسُ مَاءً** "the glass filled with water"
        - after measures: **لِتْرٌ حَلِيبًا** (also iḍāfa: **لِتْرُ حَلِيبٍ**)
      pt: |
        O **التمييز** é um **acusativo** indefinido que diz *em que aspecto* algo é entendido:

        - depois dos números **11–99**: **أَحَدَ عَشَرَ كِتَابًا**, **عِشْرُونَ طَالِبًا**, **خَمْسُونَ سَنَةً** (acusativo singular)
        - depois do interrogativo **كَمْ** "quantos": **كَمْ كِتَابًا قَرَأْتَ؟** "quantos livros você leu?" (depois do **كَمْ** exclamativo "quantos…!" o substantivo vai no genitivo: **كَمْ كِتَابٍ قَرَأْتُ!**)
        - depois de um elativo ou de um verbo de enchimento: **هُوَ أَكْثَرُ عِلْمًا** "ele é mais sábio" (literalmente "mais em saber"), **اِمْتَلَأَ الْكَأْسُ مَاءً** "o copo se encheu de água"
        - depois de medidas: **لِتْرٌ حَلِيبًا** (também iḍāfa: **لِتْرُ حَلِيبٍ**)
    table:
      head: {en: [Number, Example], pt: [Número, Exemplo]}
      rows:
      - [11, أَحَدَ عَشَرَ كِتَابًا]
      - [20, عِشْرُونَ طَالِبًا]
      - [kam, كَمْ كِتَابًا؟]
    examples:
    - ["كم كتابا قرأت؟", "How many books have you read?", "Quantos livros você leu?", "كتابا"]
    - ["في الفصل عشرون طالبا.", "There are twenty students in the class.", "Há vinte alunos na sala.", "طالبا"]
    - ["هو أكثر علما منه.", "He is more learned than him.", "Ele é mais sábio do que ele.", "علما"]
    match:
    - {seq: [{word: [كم]}, {pos: noun, re: "^(?!(?:لديكما|عندنا|معنا|لنا|هذا|انا|هنا)$)[\\s\\S]*?(?:ا$)"}], gap: 1}
