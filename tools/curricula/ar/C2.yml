id: C2
topics:

- title: {en: Classical formulas, pt: Fórmulas clássicas}
  lessons:
  - id: ar-c2-oath
    title: والله، أقسم بـ
    meaning: {en: "oaths and their answer", pt: "juramentos e sua resposta"}
    intro:
      en: |
        An oath is sworn with the particles **وَ**, **بِـ** or **تَـ** + genitive (**وَاللّٰهِ، بِاللّٰهِ، تَاللّٰهِ** "by God") or with the verb **أُقْسِمُ بِـ / أَحْلِفُ بِـ** "I swear by". The statement sworn to (جَوَاب الْقَسَم) is marked: an affirmative past with **لَقَدْ** (**وَاللّٰهِ لَقَدْ رَأَيْتُهُ** "by God, I did see him"), a future with **لَـ … ـَنَّ** (the energetic: **وَاللّٰهِ لَأَفْعَلَنَّ** "I swear I'll do it"), a negative with **مَا** or **لَا**. **لَعَمْرِي** "by my life" is literary.

        In speech **وَاللّٰهِ** is often just "really, honestly": **وَاللّٰهِ لَا أَعْرِفُ** "honestly, I don't know".
      pt: |
        O juramento se faz com as partículas **وَ**, **بِـ** ou **تَـ** + genitivo (**وَاللّٰهِ، بِاللّٰهِ، تَاللّٰهِ** "por Deus") ou com o verbo **أُقْسِمُ بِـ / أَحْلِفُ بِـ** "juro por". A afirmação jurada (جَوَاب الْقَسَم) vem marcada: passado afirmativo com **لَقَدْ** (**وَاللّٰهِ لَقَدْ رَأَيْتُهُ** "por Deus, eu o vi mesmo"), futuro com **لَـ … ـَنَّ** (o enérgico: **وَاللّٰهِ لَأَفْعَلَنَّ** "juro que vou fazer"), negativa com **مَا** ou **لَا**. **لَعَمْرِي** "pela minha vida" é literário.

        Na fala **وَاللّٰهِ** muitas vezes é só "sério, juro": **وَاللّٰهِ لَا أَعْرِفُ** "juro que não sei".
    examples:
    - ["أقسم بالله إنني لا أعرف.", "I swear by God I don't know.", "Juro por Deus que não sei.", "أقسم"]
    - ["والله لا أعرف.", "Honestly, I don't know.", "Juro que não sei.", "والله"]
    - ["أقسم لك أنني سأعود.", "I swear to you I'll come back.", "Juro a você que vou voltar.", "أقسم"]
    match: {seq: [{word: [والله, تالله, بالله, اقسم, اقسمت, نقسم, يقسم, احلف, حلفت, لعمري]}], gap: 0}
    pool: [أقسم, والله, بالله, أحلف, أعدك, أظن]

  - id: ar-c2-praise-blame
    title: نِعْمَ، بِئْسَ
    meaning: {en: "verbs of praise and blame", pt: "verbos de louvor e censura"}
    intro:
      en: |
        **نِعْمَ** "how excellent is…" and **بِئْسَ** "how bad is…" are frozen verbs followed by a definite noun in the nominative (and often the specified person after it): **نِعْمَ الصَّدِيقُ أَنْتَ** "what an excellent friend you are", **بِئْسَ الْمَصِيرُ** "what an evil fate". **حَبَّذَا** "how good is" and **لَا حَبَّذَا** "how bad" work the same way: **حَبَّذَا الصَّبْرُ**. Don't confuse **نِعْمَ** with **نَعَمْ** "yes" — in unvowelled text the definite noun after it shows which it is.

        The second exclamative pattern, **أَفْعِلْ بِـ**, is literary: **أَكْرِمْ بِهِ!** "how generous he is!"
      pt: |
        **نِعْمَ** "que excelente é…" e **بِئْسَ** "que ruim é…" são verbos fixos seguidos de substantivo definido no nominativo (e muitas vezes da pessoa especificada): **نِعْمَ الصَّدِيقُ أَنْتَ** "que amigo excelente você é", **بِئْسَ الْمَصِيرُ** "que destino terrível". **حَبَّذَا** "que bom é" e **لَا حَبَّذَا** "que ruim" funcionam igual: **حَبَّذَا الصَّبْرُ**. Não confunda **نِعْمَ** com **نَعَمْ** "sim" — no texto sem vogais é o substantivo definido depois que mostra qual é.

        O segundo padrão exclamativo, **أَفْعِلْ بِـ**, é literário: **أَكْرِمْ بِهِ!** "como ele é generoso!"
    examples:
    - ["نعم الصديق أنت.", "What an excellent friend you are.", "Que amigo excelente você é.", "نعم"]
    - ["بئس المصير.", "What an evil fate.", "Que destino terrível.", "بئس"]
    - ["نعم الرجل أبوك.", "Your father is a fine man.", "Seu pai é um homem excelente.", "نعم"]
    match:
    - {seq: [{word: [نعم], noTrail: true}, {re: "^ال"}], gap: 0}
    - {seq: [{word: [بئس, حبذا]}], gap: 0}
    pool: [نعم, بئس, حبذا, ما, كم]

  - id: ar-c2-exceptives
    title: عدا، خلا، حاشا، لا سيّما
    meaning: {en: "the rarer exceptives and لا سيما", pt: "os exceptivos raros e لا سيما"}
    intro:
      en: |
        Beside **إِلَّا، غَيْر، سِوَى** (B2), classical and formal Arabic uses **عَدَا، خَلَا، حَاشَا** "except". Alone they are prepositions and take the **genitive**, or verbs with an **accusative**: **جَاءَ الْقَوْمُ عَدَا زَيْدٍ / زَيْدًا**. With **مَا** they are only verbs, so the accusative: **مَا عَدَا زَيْدًا, مَا خَلَا زَيْدًا**. **حَاشَا لِلّٰهِ / حَاشَ لِلّٰهِ** "God forbid".

        **لَا سِيَّمَا / وَلَا سِيَّمَا** "especially, above all" singles out the best case: **أُحِبُّ الْفَوَاكِهَ لَا سِيَّمَا التُّفَّاحَ** "I love fruit, especially apples".
      pt: |
        Ao lado de **إِلَّا، غَيْر، سِوَى** (B2), o árabe clássico e formal usa **عَدَا، خَلَا، حَاشَا** "exceto". Sozinhos são preposições e pedem o **genitivo**, ou verbos com **acusativo**: **جَاءَ الْقَوْمُ عَدَا زَيْدٍ / زَيْدًا**. Com **مَا** são só verbos, portanto acusativo: **مَا عَدَا زَيْدًا, مَا خَلَا زَيْدًا**. **حَاشَا لِلّٰهِ / حَاشَ لِلّٰهِ** "Deus me livre".

        **لَا سِيَّمَا / وَلَا سِيَّمَا** "sobretudo, principalmente" destaca o melhor caso: **أُحِبُّ الْفَوَاكِهَ لَا سِيَّمَا التُّفَّاحَ** "adoro frutas, principalmente maçã".
    table:
      head: {en: [Exceptive, After it], pt: [Exceptivo, Depois dele]}
      rows:
      - [إِلَّا, "acc. (positive sentence) / ac. (frase afirmativa)"]
      - ["غَيْر، سِوَى", "gen. / gen."]
      - ["عَدَا، خَلَا، حَاشَا", "gen. or acc. / gen. ou ac."]
      - ["مَا عَدَا، مَا خَلَا", "acc. / ac."]
    examples:
    - ["حضر الجميع ما عدا أخي.", "Everyone came except my brother.", "Todos vieram menos meu irmão.", "عدا"]
    - ["أحب الفواكه لا سيما التفاح.", "I love fruit, especially apples.", "Adoro frutas, principalmente maçã.", "سيما"]
    - ["لا أعرف أحدا سوى توم.", "I don't know anyone but Tom.", "Não conheço ninguém além do Tom.", "سوى"]
    match: {seq: [{word: [عدا, خلا, حاشا, حاش, سيما, سوى]}], gap: 0}
    pool: [عدا, خلا, حاشا, سيما, سوى, إلا, غير]

  - id: ar-c2-kada
    title: كاد، أوشك، عسى، شرع
    meaning: {en: "verbs of approach, hope and beginning", pt: "verbos de aproximação, esperança e início"}
    intro:
      en: |
        Like **كَانَ**, these verbs have a subject and a predicate, but the predicate is a **verb in the imperfect**:

        - approach: **كَادَ، أَوْشَكَ** "almost, was about to": **كَادَ يَسْقُطُ** "he almost fell"; **مَا كَادَ … حَتَّى** "hardly … when"
        - hope: **عَسَى** (+ **أَنْ**): **عَسَى أَنْ يَأْتِيَ** "perhaps he'll come"
        - beginning: **شَرَعَ، أَخَذَ، بَدَأَ، جَعَلَ** "began to": **أَخَذَ يَبْكِي** "he began to cry"

        **كَادَ** is never followed by **أَنْ** in good style; **أَوْشَكَ** may be.
      pt: |
        Como **كَانَ**, estes verbos têm sujeito e predicado, mas o predicado é um **verbo no imperfeito**:

        - aproximação: **كَادَ، أَوْشَكَ** "quase, estava a ponto de": **كَادَ يَسْقُطُ** "ele quase caiu"; **مَا كَادَ … حَتَّى** "mal … quando"
        - esperança: **عَسَى** (+ **أَنْ**): **عَسَى أَنْ يَأْتِيَ** "quem sabe ele venha"
        - início: **شَرَعَ، أَخَذَ، بَدَأَ، جَعَلَ** "começou a": **أَخَذَ يَبْكِي** "ele começou a chorar"

        **كَادَ** não é seguido de **أَنْ** no bom estilo; **أَوْشَكَ** pode ser.
    examples:
    - ["كاد يسقط.", "He almost fell.", "Ele quase caiu.", "كاد"]
    - ["كادت تبكي.", "She was on the verge of tears.", "Ela estava quase chorando.", "كادت"]
    - ["عسى أن يأتي غدا.", "Perhaps he'll come tomorrow.", "Quem sabe ele venha amanhã.", "عسى"]
    match:
    - {seq: [{word: [كاد, كادت, كدت, كادوا, يكاد, تكاد, اكاد, اوشك, اوشكت, يوشك, شرع, شرعت]}, {pos: verb, tense: npast}], near: 1, gap: 0}
    - {seq: [{word: [عسى]}], gap: 0}
    pool: [كاد, كادت, أوشك, عسى, شرع, كان, صار]

- title: {en: Verb forms in depth, pt: Formas verbais a fundo}
  lessons:
  - id: ar-c2-internal-passive
    title: قِيلَ، يُقَالُ، تُوُفِّيَ
    meaning: {en: "the internal passive: فُعِلَ، يُفْعَلُ", pt: "a passiva interna: فُعِلَ، يُفْعَلُ"}
    intro:
      en: |
        Arabic forms the passive by changing the **vowels**: past **فُعِلَ** (**كُتِبَ** "was written"), present **يُفْعَلُ** (**يُكْتَبُ** "is written"); derived forms follow suit (**اُسْتُخْدِمَ** "was used", **يُسْتَخْدَمُ**). The doer is normally not named. Unvowelled text hides it, so context decides — except in common forms that are always passive:

        - hollow verbs: **قِيلَ** "it was said", **يُقَالُ** "it is said", **بِيعَ** "was sold"
        - **تُوُفِّيَ** "passed away" (literally "was taken in full")
        - **وُلِدَ** "was born", **يُرْجَى** "it is requested" (in notices)

        **يُقَالُ إِنَّ…** "it is said that…" opens many reports.
      pt: |
        O árabe forma a passiva mudando as **vogais**: passado **فُعِلَ** (**كُتِبَ** "foi escrito"), presente **يُفْعَلُ** (**يُكْتَبُ** "é escrito"); as formas derivadas seguem o mesmo (**اُسْتُخْدِمَ** "foi usado", **يُسْتَخْدَمُ**). O agente normalmente não aparece. O texto sem vogais esconde a passiva, e o contexto decide — menos nas formas comuns que são sempre passivas:

        - verbos ocos: **قِيلَ** "foi dito", **يُقَالُ** "diz-se", **بِيعَ** "foi vendido"
        - **تُوُفِّيَ** "faleceu" (literalmente "foi levado por inteiro")
        - **وُلِدَ** "nasceu", **يُرْجَى** "solicita-se" (em avisos)

        **يُقَالُ إِنَّ…** "diz-se que…" abre muitas notícias.
    table:
      head: {en: [Active, Passive], pt: [Ativa, Passiva]}
      rows:
      - [كَتَبَ – يَكْتُبُ, كُتِبَ – يُكْتَبُ]
      - [قَالَ – يَقُولُ, قِيلَ – يُقَالُ]
      - [اِسْتَخْدَمَ – يَسْتَخْدِمُ, اُسْتُخْدِمَ – يُسْتَخْدَمُ]
    examples:
    - ["يقال إنه غني جدا.", "They say he's very rich.", "Dizem que ele é muito rico.", "يقال"]
    - ["قيل لي إن الاجتماع ألغي.", "I was told the meeting was cancelled.", "Disseram-me que a reunião foi cancelada.", "قيل"]
    - ["توفي جده العام الماضي.", "His grandfather died last year.", "O avô dele faleceu no ano passado.", "توفي"]
    match:
    - {seq: [{word: [قيل, يقال, توفي, توفيت, بيع, بيعت, يرجى]}], gap: 0}
    - {seq: [{pos: verb, voice: pass}], same: [person, number]}
    pool: [قيل, يقال, توفي, قال, يقول, مات]

  - id: ar-c2-form-ix
    title: احمرّ، اصفرّ، ابيضّ
    meaning: {en: "form IX (colours and defects) and forms XI–XV", pt: "a forma IX (cores e defeitos) e as formas XI–XV"}
    intro:
      en: |
        **Form IX اِفْعَلَّ / يَفْعَلُّ** is made almost only from the roots of **colours and physical defects** and means "become, turn": **اِحْمَرَّ** "turned red, blushed", **اِصْفَرَّ** "turned yellow / pale", **اِبْيَضَّ** "turned white", **اِسْوَدَّ** "turned black", **اِخْضَرَّ** "turned green", **اِعْوَجَّ** "became crooked". The masdar is **اِفْعِلَال**: **اِحْمِرَار** "redness, blushing". Unvowelled, **احمر** may be the verb or the adjective **أَحْمَرُ** "red".

        Forms **XI–XV** are rare and literary: **XI اِفْعَالَّ** (**اِحْمَارَّ** "turned deep red"), **XII اِفْعَوْعَلَ** (**اِخْشَوْشَنَ** "became very rough"), **XIII اِفْعَوَّلَ**, **XIV اِفْعَنْلَلَ**, **XV اِفْعَنْلَى**. You only need to recognise them in dictionaries and poetry.
      pt: |
        A **forma IX اِفْعَلَّ / يَفْعَلُّ** se faz quase só com raízes de **cores e defeitos físicos** e quer dizer "ficar, tornar-se": **اِحْمَرَّ** "ficou vermelho, corou", **اِصْفَرَّ** "ficou amarelo / pálido", **اِبْيَضَّ** "ficou branco", **اِسْوَدَّ** "ficou preto", **اِخْضَرَّ** "ficou verde", **اِعْوَجَّ** "entortou". O masdar é **اِفْعِلَال**: **اِحْمِرَار** "vermelhidão, rubor". Sem vogais, **احمر** pode ser o verbo ou o adjetivo **أَحْمَرُ** "vermelho".

        As formas **XI–XV** são raras e literárias: **XI اِفْعَالَّ** (**اِحْمَارَّ** "ficou vermelho-escuro"), **XII اِفْعَوْعَلَ** (**اِخْشَوْشَنَ** "ficou muito áspero"), **XIII اِفْعَوَّلَ**, **XIV اِفْعَنْلَلَ**, **XV اِفْعَنْلَى**. Basta reconhecê-las nos dicionários e na poesia.
    table:
      head: {en: [Root, Past, Present, Masdar], pt: [Raiz, Passado, Presente, Masdar]}
      rows:
      - [ح م ر, اِحْمَرَّ, يَحْمَرُّ, اِحْمِرَار]
      - [ص ف ر, اِصْفَرَّ, يَصْفَرُّ, اِصْفِرَار]
      - [ب ي ض, اِبْيَضَّ, يَبْيَضُّ, اِبْيِضَاض]
      - [س و د, اِسْوَدَّ, يَسْوَدُّ, اِسْوِدَاد]
    examples:
    - ["احمر وجهها خجلا.", "Her face turned red with embarrassment.", "O rosto dela ficou vermelho de vergonha.", "احمر"]
    - ["اصفر وجهه من الخوف.", "His face went pale with fear.", "O rosto dele empalideceu de medo.", "اصفر"]
    - ["تحمر أوراق الشجر في الخريف.", "The leaves turn red in autumn.", "As folhas das árvores ficam vermelhas no outono.", "تحمر"]
    match:
    - {seq: [{word: [احمر, احمرت, اصفر, اصفرت, ابيض, ابيضت, اسود, اسودت, اخضر, اخضرت, ازرق, ازرقت], pos: verb}], gap: 0}
    - {seq: [{word: [يحمر, تحمر, يصفر, تصفر, يخضر, تخضر, احمرار, اصفرار, اسوداد, اخضرار]}], gap: 0}
    pool: [احمرّ, اصفرّ, ابيضّ, اسودّ, اخضرّ, أحمر]

  - id: ar-c2-kana-qad
    title: كان قد ذهب، سيكون قد
    meaning: {en: "compound tenses with كان and قد", pt: "tempos compostos com كان e قد"}
    intro:
      en: |
        **كَانَ** combines with the other tenses to place events in time precisely:

        - **كَانَ قَدْ** + past = pluperfect: **كَانَ قَدْ خَرَجَ عِنْدَمَا وَصَلْتُ** "he had gone out when I arrived"
        - **كَانَ** + imperfect = past habit or progress: **كَانَ يَقْرَأُ** "he used to read / was reading" (A2)
        - **سَيَكُونُ قَدْ** + past = future perfect: **سَيَكُونُ قَدْ وَصَلَ** "he will have arrived"
        - **كَانَ سَـ** + imperfect = future in the past: **كَانَ سَيُسَافِرُ** "he was going to travel"

        **كَانَ** agrees with the subject, and so does the following verb: **كَانَتْ قَدْ نَامَتْ**.
      pt: |
        **كَانَ** se combina com os outros tempos para situar os fatos com precisão:

        - **كَانَ قَدْ** + passado = mais-que-perfeito: **كَانَ قَدْ خَرَجَ عِنْدَمَا وَصَلْتُ** "ele tinha saído quando cheguei"
        - **كَانَ** + imperfeito = hábito ou progresso no passado: **كَانَ يَقْرَأُ** "ele lia / estava lendo" (A2)
        - **سَيَكُونُ قَدْ** + passado = futuro perfeito: **سَيَكُونُ قَدْ وَصَلَ** "ele terá chegado"
        - **كَانَ سَـ** + imperfeito = futuro do pretérito: **كَانَ سَيُسَافِرُ** "ele ia viajar"

        **كَانَ** concorda com o sujeito, e o verbo seguinte também: **كَانَتْ قَدْ نَامَتْ**.
    examples:
    - ["كان قد خرج عندما وصلت.", "He had gone out when I arrived.", "Ele tinha saído quando cheguei.", "قد"]
    - ["كانت قد نامت.", "She had fallen asleep.", "Ela tinha adormecido.", "قد"]
    - ["سيكون قد وصل قبل المساء.", "He will have arrived before evening.", "Ele terá chegado antes do anoitecer.", "قد"]
    match: {seq: [{word: [كان, كانت, كنت, كانوا, كنا, كنتم, يكون, سيكون, تكون, ستكون]}, {word: [قد]}, {pos: verb, tense: past}], near: 1, gap: 1}
    pool: [قد, لقد, لم, سوف, لن]

- title: {en: Fine points of iʿrāb, pt: Detalhes do iʿrāb}
  lessons:
  - id: ar-c2-fossil-accusatives
    title: شكراً، أيضاً، احتراماً
    meaning: {en: "accusatives behind everyday words", pt: "acusativos por trás de palavras do dia a dia"}
    intro:
      en: |
        Many everyday words are **frozen accusatives** with tanwin **-an** (written ـًا):

        - **المفعول المطلق** (cognate / absolute object), a masdar standing for its own verb: **شُكْرًا** "thanks" (= أَشْكُرُكَ شُكْرًا), **عَفْوًا**, **حَقًّا** "truly", **أَيْضًا** "also", **جِدًّا** "very", **طَبْعًا** "of course". In full sentences it intensifies or describes: **ضَرَبَهُ ضَرْبًا شَدِيدًا** "he beat him hard".
        - **المفعول لأجله** (object of purpose), a masdar giving the reason: **وَقَفُوا احْتِرَامًا لَهُ** "they stood out of respect for him", **خَوْفًا مِنْ** "for fear of".
        - **الظرف** (adverbial of time and place): **صَبَاحًا** "in the morning", **أَبَدًا** "ever, never", **دَائِمًا**, **فَوْرًا** "at once".
      pt: |
        Muitas palavras do dia a dia são **acusativos fossilizados** com tanwin **-an** (escrito ـًا):

        - **المفعول المطلق** (objeto absoluto), um masdar no lugar do próprio verbo: **شُكْرًا** "obrigado" (= أَشْكُرُكَ شُكْرًا), **عَفْوًا**, **حَقًّا** "realmente", **أَيْضًا** "também", **جِدًّا** "muito", **طَبْعًا** "claro". Em frases completas intensifica ou descreve: **ضَرَبَهُ ضَرْبًا شَدِيدًا** "bateu nele com força".
        - **المفعول لأجله** (objeto de finalidade), um masdar que dá o motivo: **وَقَفُوا احْتِرَامًا لَهُ** "levantaram-se em respeito a ele", **خَوْفًا مِنْ** "por medo de".
        - **الظرف** (adjunto de tempo e lugar): **صَبَاحًا** "de manhã", **أَبَدًا** "jamais", **دَائِمًا**, **فَوْرًا** "imediatamente".
    examples:
    - ["شكرا جزيلا.", "Thank you very much.", "Muito obrigado.", "شكرا"]
    - ["وقفوا احتراما له.", "They stood out of respect for him.", "Levantaram-se em respeito a ele.", "احتراما"]
    - ["هذا صعب جدا.", "This is very difficult.", "Isto é muito difícil.", "جدا"]
    match: {seq: [{word: [شكرا, عفوا, حقا, طبعا, جدا, ايضا, ابدا, تماما, فورا, احتراما, خوفا, حبا, صباحا, مساء, دائما, غدا]}], gap: 0}
