- title: {en: Place and possession, pt: Lugar e posse}
  lessons:
  - id: ar-a1-prepositions
    title: في، على، من، إلى
    meaning: {en: "prepositions (and the genitive after them)", pt: "preposições (e o genitivo depois delas)"}
    intro:
      en: |
        **فِي** in · **عَلَى** on · **مِنْ** from · **إِلَى** to · **مَعَ** with (someone) · **عِنْدَ** at, at the home of · **عَنْ** about · and two written joined to the next word: **بِـ** with, by, in · **لِـ** for, to.

        The noun after a preposition is in the **genitive** (-i): **فِي الْبَيْتِ** "in the house", **مِنْ مِصْرَ** "from Egypt".
      pt: |
        **فِي** em · **عَلَى** sobre · **مِنْ** de (origem) · **إِلَى** para · **مَعَ** com (alguém) · **عِنْدَ** junto de, na casa de · **عَنْ** sobre (assunto) · e duas que se escrevem junto à palavra seguinte: **بِـ** com, por, em · **لِـ** para, a.

        O substantivo depois de preposição fica no **genitivo** (-i): **فِي الْبَيْتِ** "na casa", **مِنْ مِصْرَ** "do Egito".
    mistakes:
    - wrong: فِي الْبَيْتُ
      right: فِي الْبَيْتِ
      why: {en: "Genitive after a preposition.", pt: "Genitivo depois de preposição."}
    examples:
    - [الكتاب على الطاولة., The book is on the table., O livro está na mesa., على]
    - [أنا من البرازيل., I'm from Brazil., Sou do Brasil., من]
    - [ذهبت إلى السوق., I went to the market., Fui ao mercado., إلى]
    - [أسكن في القاهرة., I live in Cairo., Moro no Cairo., في]
    # من or ما opening a sentence is "who / what", not the preposition
    match: {seq: [{word: [في, على, من, الى, مع, عند, عن], pos: prep, notStart: true}, {pos: noun}], gap: 0}
    pool: [في, على, من, إلى, مع, عند, عن]

  - id: ar-a1-possessive
    title: كتابي، كتابك
    meaning: {en: "my, your, his: possessive suffixes", pt: "meu, teu, dele: sufixos possessivos"}
    intro:
      en: |
        *My, your, his…* are **suffixes** on the noun, which then takes no al-: **كِتَابِي** "my book", **كِتَابُكَ** "your (m.) book", **كِتَابُهَا** "her book". Before a suffix, **ة** becomes **ت**: `سَيَّارَة` → **سَيَّارَتِي** "my car".
      pt: |
        *Meu, teu, dele…* são **sufixos** no substantivo, que então não leva al-: **كِتَابِي** "meu livro", **كِتَابُكَ** "teu (m.) livro", **كِتَابُهَا** "o livro dela". Antes de sufixo, **ة** vira **ت**: `سَيَّارَة` → **سَيَّارَتِي** "meu carro".
    table:
      head: {en: [Owner, Suffix, Example], pt: [Dono, Sufixo, Exemplo]}
      rows:
      - [{en: my, pt: meu}, ـِي, كِتَابِي]
      - [{en: your (m.), pt: teu (m.)}, ـكَ, كِتَابُكَ]
      - [{en: your (f.), pt: teu (f.)}, ـكِ, كِتَابُكِ]
      - [{en: his, pt: dele}, ـهُ, كِتَابُهُ]
      - [{en: her, pt: dela}, ـهَا, كِتَابُهَا]
      - [{en: our, pt: nosso}, ـنَا, كِتَابُنَا]
      - [{en: your (pl.), pt: de vocês}, ـكُمْ, كِتَابُكُمْ]
      - [{en: their, pt: deles}, ـهُمْ, كِتَابُهُمْ]
    mistakes:
    - wrong: الْكِتَابِي
      right: كِتَابِي
      why: {en: "A noun with a suffix is already definite: no al-.", pt: "Substantivo com sufixo já é definido: sem al-."}
    - wrong: سَيَّارَةِي
      right: سَيَّارَتِي
      why: {en: "ة → ت before a suffix.", pt: "ة → ت antes de sufixo."}
    examples:
    - [هذا بيتي., This is my house., Esta é a minha casa., بيتي]
    - ["ما اسمك؟", "What's your name?", "Qual é o seu nome?", "اسمك"]
    - [أخوها طبيب., Her brother is a doctor., O irmão dela é médico., أخوها]
    # not a word that only happens to end in ه (الله)
    match: {seq: [{pos: noun, state: cons, re: "^(?!ال)(?!(ماري|سامي|توني|جوني|نانسي|كاثي|جودي|راندي|هاري)$).+(ي|ك|ه|ها|نا|كم|هم)$"}]}
    suffixes: [ي, ك, ه, ها, نا, كم, هم]

- title: {en: Numbers, pt: Números}
  lessons:
  - id: ar-a1-numbers
    title: واحد، اثنان، ثلاثة
    meaning: {en: "numbers 1–10", pt: "números de 1 a 10"}
    intro:
      en: |
        Arabic numerals (the ones Europe borrowed came from here; Arabic now writes ٠١٢٣٤٥٦٧٨٩) and words: **وَاحِد ١، اِثْنَان ٢، ثَلَاثَة ٣، أَرْبَعَة ٤، خَمْسَة ٥، سِتَّة ٦، سَبْعَة ٧، ثَمَانِيَة ٨، تِسْعَة ٩، عَشَرَة ١٠**. Numbers are written left to right even inside Arabic text.

        One and two follow the noun as adjectives (**كِتَابٌ وَاحِدٌ**) or are shown by the dual (**كِتَابَانِ** "two books"); from three on there is a gender twist (B1).
      pt: |
        Os algarismos (os que a Europa adotou vieram daqui; o árabe hoje escreve ٠١٢٣٤٥٦٧٨٩) e as palavras: **وَاحِد ١، اِثْنَان ٢، ثَلَاثَة ٣، أَرْبَعَة ٤، خَمْسَة ٥، سِتَّة ٦، سَبْعَة ٧، ثَمَانِيَة ٨، تِسْعَة ٩، عَشَرَة ١٠**. Os números se escrevem da esquerda para a direita mesmo no meio do texto árabe.

        Um e dois vêm depois do substantivo como adjetivos (**كِتَابٌ وَاحِدٌ**) ou pelo dual (**كِتَابَانِ** "dois livros"); do três em diante há uma inversão de gênero (B1).
    table:
      head: {en: [Digit, Word, Digit, Word], pt: [Algarismo, Palavra, Algarismo, Palavra]}
      rows:
      - [١, وَاحِد, ٦, سِتَّة]
      - [٢, اِثْنَان, ٧, سَبْعَة]
      - [٣, ثَلَاثَة, ٨, ثَمَانِيَة]
      - [٤, أَرْبَعَة, ٩, تِسْعَة]
      - [٥, خَمْسَة, ١٠, عَشَرَة]
    examples:
    - [عندي ثلاثة أطفال., I have three children., Tenho três filhos., ثلاثة]
    - [انتظرت خمس دقائق., I waited five minutes., Esperei cinco minutos., خمس]
    match: {seq: [{word: [واحد, واحدة, اثنان, اثنين, ثلاثة, ثلاث, اربعة, اربع, خمسة, خمس, ستة, ست, سبعة, سبع, ثمانية, ثماني, تسعة, تسع, عشرة, عشر]}]}
    pool: [واحد, اثنان, ثلاثة, أربعة, خمسة, ستة, سبعة, ثمانية, تسعة, عشرة]
