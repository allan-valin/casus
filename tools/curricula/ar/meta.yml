# Modern Standard Arabic Learn lessons, written for Casus (2026-10-19). Open graded Arabic courses were searched: the
# Michigan State open books (Elementary Arabic I–II, Intermediate Arabic I) are CC BY-NC, the reference grammars on OER
# Commons BY-NC-ND, so none can be used (open licences only, no NC). The order of topics follows the usual university
# course order (as in those books and Al-Kitaab); the facts follow Wikipedia's Arabic grammar articles (CC BY-SA) and
# the public-domain grammars of Wright (1896) and Thatcher (1910). Levels are Casus's judgement on the CEFR scale.
# Tables are fully vowelled; match rules are written without vowels (they compare bare letters).
# written by AI (Claude) for Casus: marked as such on every lesson (Allan, 2026-10-20)
ai_written: true
system: CEFR
credit:
  en: "Lessons written for Casus by AI (Claude) (explanations and examples). Facts after Wikipedia's Arabic grammar articles (CC BY-SA) and the public-domain grammars of Wright and Thatcher. More examples and the exercises: Tatoeba (CC BY 2.0 FR), vowelled by Casus's reader where the reading is sure."
  pt: "Lições escritas por IA (Claude) para o Casus (explicações e exemplos). Os fatos seguem os artigos de gramática árabe da Wikipédia (CC BY-SA) e as gramáticas de domínio público de Wright e Thatcher. Mais exemplos e os exercícios: Tatoeba (CC BY 2.0 FR), vocalizados pelo leitor do Casus onde a leitura é segura."
level_files: [A1, A2, B1, B2, C1, C2]
