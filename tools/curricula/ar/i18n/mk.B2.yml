# Macedonian text of the Arabic course, level B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Weak verbs: "Слаби глаголи"
  Nuance: "Нијанси"
  Word order: "Ред на зборовите"
lessons:
  ar-b2-hollow:
    meaning: "шупливи глаголи (و или ي во средината)"
    intro: |
      Кога средната буква од коренот е **و** или **ي**, таа станува долга самогласка што се скратува пред согласска наставка: **قَالَ** „рече“, но **قُلْتُ** „реков“; сегашно **يَقُولُ**, јусив **لَمْ يَقُلْ**. Самогласката во сегашното ја покажува скриената буква: **يَقُولُ** (و), **يَبِيعُ** (ي), **يَنَامُ** (ا).
    mistakes: ["Долгото ā се скратува пред -tu."]
  ar-b2-defective:
    meaning: "дефективни глаголи (و или ي на крајот)"
    intro: |
      Со **و / ي** како последна буква од коренот, глаголот завршува на самогласка: **مَشَى / يَمْشِي** „оди“, **دَعَا / يَدْعُو** „вика, поканува“, **نَسِيَ / يَنْسَى** „заборава“. Наставките се среќаваат со таа самогласка: **مَشَيْتُ** „одев“, **مَشَوْا** „одеа“; јусивот ја отфрла: **لَمْ يَمْشِ**.
  ar-b2-assimilated-doubled:
    meaning: "асимилирани (و- на почетокот) и удвоени глаголи"
    intro: |
      - **Асимилирани**: првата буква **و** паѓа во сегашното: **وَصَلَ / يَصِلُ** „пристигнува“, **وَجَدَ / يَجِدُ** „наоѓа“, **وَضَعَ / يَضَعُ** „става“.
      - **Удвоени**: втората и третата буква се исти, пишувани со шада кога се допираат: **ظَنَّ / يَظُنُّ** „мисли“, **مَرَّ / يَمُرُّ** „минува“; пред согласска наставка се раздвојуваат: **ظَنَنْتُ** „мислев“.
  ar-b2-qad:
    meaning: "قد: веќе, навистина; можеби"
    intro: |
      **قَدْ** + минато нагласува дека нешто **се случило** (често *веќе*): **قَدْ وَصَلَ الْقِطَارُ** „возот пристигна“; **لَقَدْ** е уште посилно. **قَدْ** + сегашно значи **можеби, понекогаш**: **قَدْ يَتَأَخَّرُ** „можеби ќе доцни“.
  ar-b2-exception:
    meaning: "освен, само: إلا, غير, سوى"
    intro: |
      **إِلَّا** „освен“ (+ акузатив по потврдна реченица): **جَاءَ الطُّلَّابُ إِلَّا خَالِدًا.** По одречна значи **само**: **مَا عِنْدِي إِلَّا عَشَرَةُ دَنَانِيرَ** „имам само десет динари“. **غَيْر** и **سِوَى** „освен, друг од“ земаат генитив: **لَا أَحَدَ غَيْرُكَ** „никој освен тебе“. **غير** ги негира и придавките: **غَيْرُ مُمْكِنٍ** „невозможно“.
  ar-b2-vso:
    meaning: "глагол пред подмет во множина останува во еднина"
    intro: |
      Во **глаголската реченица** (глаголот прв, класичниот ред) глаголот се согласува со подметот само **по род**, останувајќи во **еднина** и пред множина: **ذَهَبَ الطُّلَّابُ** „студентите отидоа“, **ذَهَبَتِ الطَّالِبَاتُ**. Кога подметот е **прв**, полно согласување: **الطُّلَّابُ ذَهَبُوا**.
    mistakes: ["Глагол прв: еднина."]
  ar-b2-hal:
    meaning: "хал: како некој направил нешто"
    intro: |
      **Неопределена придавка или партицип во акузатив** по глагол ја кажува состојбата на подметот или објектот во тој миг: **جَاءَ مُسْرِعًا** „дојде брзајќи“, **رَجَعَ سَعِيدًا** „се врати среќен“. Реченица со **وَ** го прави истото: **خَرَجَ وَهُوَ يَضْحَكُ** „излезе смеејќи се“.
