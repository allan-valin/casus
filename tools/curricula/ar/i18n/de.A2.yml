# German text of the Arabic course, level A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The verb: "Das Verb"
  Nouns together: "Nomen zusammen"
  Having and comparing: "Haben und Vergleichen"
  Commands and relative clauses: "Befehle und Relativsätze"
lessons:
  ar-a2-present:
    meaning: "das Präsens (Imperfekt)"
    intro: |
      Arabische Verben beruhen auf einer **Wurzel** aus (meist) drei Konsonanten — **ك ت ب** „schreiben“ — und Wörterbücher führen sie in der Vergangenheit, 3. Person maskulin: **كَتَبَ** „er schrieb“.

      Das Präsens (Nicht-Vergangenheit) fügt **Präfixe** für die Person und **Suffixe** für Genus und Numerus hinzu: **أَكْتُبُ** ich schreibe, **يَكْتُبُ** er schreibt, **تَكْتُبُ** sie schreibt / du schreibst. Es deckt *ich schreibe*, *ich schreibe gerade* und oft *ich werde schreiben* ab.
    mistakes: ["„Sie“ (fem. Sg.) nimmt das Präfix ت-.", "*du* (f.) fügt -ينَ an."]
  ar-a2-past:
    meaning: "die Vergangenheit (Perfekt)"
    intro: |
      Die Vergangenheit verwendet **nur Suffixe**: **كَتَبْتُ** ich schrieb, **كَتَبْتَ** du (m.) schriebst, **كَتَبَ** er schrieb, **كَتَبَتْ** sie schrieb, **كَتَبْنَا** wir schrieben, **كَتَبُوا** sie (Pl.) schrieben. Die bloße Form **كَتَبَ** ist die Wörterbuchform.

      In unvokalisiertem Text kann **كتبت** *ich / du (m.) / du (f.) / sie schrieb* heißen — Kontext und Subjekt entscheiden.
    mistakes: ["Sie (Pl.): -وا (das Alif ist stumm)."]
  ar-a2-negation:
    meaning: "Verneinung: vier Wörter für nicht"
    intro: |
      Welches *nicht*, hängt von der Zeit ab:

      - **لَا** + Präsens: **لَا أَعْرِفُ.** „Ich weiß nicht.“
      - **لَمْ** + Jussiv (eine Präsensform mit kurzer Endung) für die **Vergangenheit**: **لَمْ أَذْهَبْ.** „Ich ging nicht.“
      - **لَنْ** + Subjunktiv für die **Zukunft**: **لَنْ أَذْهَبَ.** „Ich werde nicht gehen.“
      - **لَيْسَ** „ist nicht“, konjugiert, für Sätze ohne Verb: **لَسْتُ مُتْعَبًا.** „Ich bin nicht müde.“ (Prädikat im Akkusativ)

      **مَا** + Vergangenheit (**مَا ذَهَبْتُ**) ist ebenfalls korrekt und gesprochen häufig.
    mistakes: ["Vergangenheit: لم + Jussiv (oder ما + Vergangenheit).", "Ohne Verb: ليس, konjugiert."]
  ar-a2-future:
    meaning: "das Futur: sa- und sawfa"
    intro: |
      **سَـ** (angehängt) oder **سَوْفَ** (eigenes Wort) vor dem Präsens bilden das Futur: **سَأَذْهَبُ / سَوْفَ أَذْهَبُ** „ich werde gehen“. سَـ ist in der Schrift häufiger; سوف kann ferner oder nachdrücklicher klingen. Die Verneinung ist **لَنْ** + Subjunktiv (nicht لا سوف).
    mistakes: ["Verneintes Futur: لن."]
  ar-a2-kana:
    meaning: "war, waren: كان"
    intro: |
      **كَانَ** ist *sein* in der Vergangenheit (und im Futur **يَكُونُ**). Es wird wie ein Vergangenheitsverb konjugiert, mit langem ā, das vor konsonantischen Endungen kurz wird: **كُنْتُ** ich war, **كَانَ** er war, **كَانَتْ** sie war, **كُنَّا** wir waren, **كَانُوا** sie waren.

      Sein Prädikat steht im **Akkusativ**: **كَانَ الْجَوُّ جَمِيلًا.** „Das Wetter war schön.“ Mit einem Präsensverb bildet es die andauernde / gewohnheitsmäßige Vergangenheit: **كُنْتُ أَعْمَلُ** „ich arbeitete gerade / ich pflegte zu arbeiten“.
    mistakes: ["Das Prädikat von كان steht im Akkusativ."]
  ar-a2-idafa:
    meaning: "die Iḍāfa: X von Y"
    intro: |
      *Das Buch des Studenten* sind zwei Nomen nebeneinander, die **Iḍāfa**: **كِتَابُ الطَّالِبِ** „Buch (des) Studenten“. Das erste Nomen hat **keinen Artikel und kein Tanwin** — es wird durch das Folgende bestimmt — und das zweite steht im **Genitiv**. Ketten sind möglich: **مِفْتَاحُ بَابِ الْبَيْتِ** „der Schlüssel der Tür des Hauses“.

      Ein Adjektiv zum ersten Nomen steht **nach** der ganzen Iḍāfa: **كِتَابُ الطَّالِبِ الْجَدِيدُ** „das neue Buch des Studenten“.
    mistakes: ["Das erste Glied nimmt nie al-."]
  ar-a2-plural:
    meaning: "Plurale: gesund und gebrochen"
    intro: |
      Zwei Arten von Plural:

      - **gesund**: maskulin **-ُونَ** (Genitiv/Akkusativ **-ِينَ**) für Männer — **مُعَلِّمُونَ**; feminin **-َات** — **مُعَلِّمَات**, **سَيَّارَات**.
      - **gebrochen**: Die Vokale innerhalb der Wurzel ändern sich — **كِتَاب → كُتُب**, **بَيْت → بُيُوت**, **وَلَد → أَوْلَاد**, **رَجُل → رِجَال**. Die meisten gängigen Nomen haben einen; lerne ihn mit dem Nomen.

      Plurale von **Dingen** kongruieren feminin Singular: **الْكُتُبُ جَدِيدَةٌ** „die Bücher sind neu“.
    mistakes: ["Dinge im Plural: feminin Singular."]
  ar-a2-dual:
    meaning: "der Dual: zwei von etwas"
    intro: |
      Zwei von etwas ist eine eigene Form, der **Dual**: **-َانِ** (Nominativ), **-َيْنِ** (Genitiv/Akkusativ): **كِتَابَانِ** „zwei Bücher“, **فِي يَوْمَيْنِ** „in zwei Tagen“. Vor ة wird das t gesprochen: **طَالِبَتَانِ**. In einer Iḍāfa fällt das End-ن weg: **يَدَا الطِّفْلِ** „die beiden Hände des Kindes“.
  ar-a2-have:
    meaning: "haben: عند und لـ"
    intro: |
      Arabisch hat kein Verb *haben*. Man sagt „bei mir ist …“ mit **عِنْدَ** + Suffix oder „mir ist …“ mit **لِـ**: **عِنْدِي سَيَّارَةٌ** „ich habe ein Auto“, **لِي أَخٌ** „ich habe einen Bruder“. **لَدَى** (+ Suffix: **لَدَيَّ**) ist die formelle Entsprechung. Verneint: **لَيْسَ عِنْدِي**; Vergangenheit: **كَانَ عِنْدِي**.
    mistakes: ["Das Suffix ist der Besitzer."]
  ar-a2-comparative:
    meaning: "größer als, der größte"
    intro: |
      Der Komparativ hat das Muster **أَفْعَلُ**, für beide Genera gleich: `كَبِير` → **أَكْبَرُ** „größer“, `صَغِير` → **أَصْغَرُ**, `جَمِيل` → **أَجْمَلُ**. *Als* ist **مِنْ**: **أَخِي أَكْبَرُ مِنِّي.** „Mein Bruder ist älter als ich.“

      Der Superlativ ist dasselbe Wort, bestimmt oder in Iḍāfa: **الْأَكْبَرُ** „der größte“, **أَكْبَرُ مَدِينَةٍ** „die größte Stadt“. Bei langen Adjektiven **أَكْثَرُ** „mehr“ + Nomen: **أَكْثَرُ أَهَمِّيَّةً** „wichtiger“.
    mistakes: ["Mit مِن bleibt der Komparativ für beide Genera أفعل."]
  ar-a2-imperative:
    meaning: "der Imperativ"
    intro: |
      Nimm den Jussiv von *du* (**تَكْتُبْ**), lass das Präfix **تَـ** weg, und wenn das Wort nun mit zwei Konsonanten beginnt, füge einen Hilfsvokal mit Alif hinzu: **اُكْتُبْ** „schreib!“ (u nach u-Stamm, sonst i: **اِذْهَبْ** „geh!“, **اِجْلِسْ** „setz dich!“). Feminin **-ِي**, Plural **-ُوا**: **اُكْتُبِي، اُكْتُبُوا**.

      *Nicht* (Verbot) ist **لَا** + Jussiv: **لَا تَذْهَبْ!** „Geh nicht!“
    mistakes: ["Verbot: لا + Jussiv, nicht der Imperativ."]
  ar-a2-relative:
    meaning: "Relativpronomen: der, welcher"
    intro: |
      Nach einem **bestimmten** Nomen richtet sich das Relativpronomen danach: **الَّذِي** (m.), **الَّتِي** (f., und Dinge im Plural), **الَّذِينَ** (m. Personen Pl.), **اللَّوَاتِي** (f. Pl.). Nach einem **unbestimmten** Nomen steht gar kein Relativwort: **رَأَيْتُ رَجُلًا يَقْرَأُ** „ich sah einen Mann, der las“.

      Ein Objekt-Relativ behält ein Rückverweis-Pronomen: **الْكِتَابُ الَّذِي قَرَأْتُهُ** „das Buch, das ich (es) gelesen habe“.
    mistakes: ["Kein Relativwort nach einem unbestimmten Nomen."]
