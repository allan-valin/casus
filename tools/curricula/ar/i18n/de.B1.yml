# German text of the Arabic course, level B1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The moods of the verb: "Die Modi des Verbs"
  Cases: "Kasus"
  Verb patterns: "Verbstämme"
  Conditions and numbers: "Bedingungen und Zahlen"
lessons:
  ar-b1-subjunctive:
    meaning: "der Subjunktiv nach أن، لن، كي، حتى"
    intro: |
      Nach **أَنْ** „dass, zu“, **لَنْ** „wird nicht“, **كَيْ / لِكَيْ / لِـ** „um zu“ und **حَتَّى** „damit, bis“ steht das Präsens im **Subjunktiv**: Das End-**-ُ** wird zu **-َ** (**يَذْهَبُ → أَنْ يَذْهَبَ**), und die Endungen auf **-ونَ / -ينَ / -انِ** verlieren ihr **ن** (**يَذْهَبُونَ → أَنْ يَذْهَبُوا**).

      **أُرِيدُ أَنْ أَذْهَبَ** ist *ich will gehen* — ohne Infinitiv, mit zwei konjugierten Verben.
    mistakes: ["Das -ن des Plurals fällt im Subjunktiv weg."]
  ar-b1-jussive:
    meaning: "der Jussiv nach لم und das verbietende لا"
    intro: |
      Der **Jussiv** endet auf **Sukun**, wo der Indikativ **-ُ** hat (**يَذْهَبُ → يَذْهَبْ**), und verliert wie der Subjunktiv das **ن** von **-ونَ / -ينَ / -انِ**. Er folgt auf **لَمْ** (verneinte Vergangenheit: **لَمْ يَذْهَبْ** „er ging nicht“), **لَا** in Verboten (**لَا تَقْلَقْ** „mach dir keine Sorgen“), **لِـ** „lass …“ (**لِنَذْهَبْ** „lass uns gehen“) und konditionales **إِنْ**. Hohle Verben kürzen ihren Vokal: **يَقُولُ → لَمْ يَقُلْ**.
    mistakes: ["Hohle Verben verlieren den Langvokal vor Sukun."]
  ar-b1-irab:
    meaning: "Iʿrāb: Nominativ, Akkusativ, Genitiv"
    intro: |
      Nomen und Adjektive haben drei Kasus, angezeigt durch den **letzten Vokal** (nur in vokalisierten Texten geschrieben, im formellen Arabisch aber gesprochen):

      - **Nominativ -ُ / -ٌ**: das Subjekt, das Prädikat eines verblosen Satzes
      - **Akkusativ -َ / -ً**: das Objekt, nach **إِنَّ**, das Prädikat von **كَانَ**, Adverbien (**يَوْمًا** „eines Tages“)
      - **Genitiv -ِ / -ٍ**: nach Präpositionen, das zweite Nomen einer Iḍāfa

      Der unbestimmte Akkusativ fügt ein Alif an: **كِتَابًا**. Der gesunde maskuline Plural hat **-ُونَ** / **-ِينَ**, der Dual **-َانِ** / **-َيْنِ**.
    mistakes: ["Genitiv nach في.", "Das Objekt steht im Akkusativ."]
  ar-b1-inna:
    meaning: "إنّ und ihre Schwestern: das Subjekt im Akkusativ"
    intro: |
      **إِنَّ** „wahrlich“, **أَنَّ** „dass“, **لَكِنَّ** „aber“, **لِأَنَّ** „weil“, **كَأَنَّ** „als ob“, **لَيْتَ** „wenn doch“, **لَعَلَّ** „vielleicht“ leiten einen Nominalsatz ein und setzen sein Subjekt in den **Akkusativ**; das Prädikat bleibt im Nominativ: **إِنَّ الْجَوَّ جَمِيلٌ.** „Das Wetter ist wirklich schön.“ Ein Pronomen als Subjekt wird angehängt: **إِنَّهُ**, **لِأَنَّنِي** (oder **لِأَنِّي**).

      Verwechsle nicht **أَنَّ** (+ Nomen) mit **أَنْ** (+ Verb).
    mistakes: ["Das Subjekt nach إنّ steht im Akkusativ."]
  ar-b1-forms-2-4:
    meaning: "abgeleitete Verben: Stämme II, III, IV"
    intro: |
      Aus einer Wurzel bilden **Muster** verwandte Verben. Wörterbücher nummerieren sie mit römischen Ziffern:

      - **II فَعَّلَ** (verdoppelter Mittelkonsonant): veranlasst oder verstärkt — **دَرَسَ** lernen → **دَرَّسَ** unterrichten; **عَلِمَ** wissen → **عَلَّمَ** lehren
      - **III فَاعَلَ** (langes ā): an / mit jemandem tun — **سَاعَدَ** helfen, **شَاهَدَ** zuschauen, **كَاتَبَ** korrespondieren
      - **IV أَفْعَلَ** (Präfix a-): veranlasst — **أَرْسَلَ** schicken, **أَخْبَرَ** informieren, **أَحَبَّ** lieben

      Ihr Präsens beginnt mit **يُـ** (yu-): **يُدَرِّسُ، يُسَاعِدُ، يُرْسِلُ**.
  ar-b1-forms-5-10:
    meaning: "abgeleitete Verben: Stämme V–X"
    intro: |
      - **V تَفَعَّلَ**: Reflexiv von II — **تَعَلَّمَ** lernen (sich lehren), **تَكَلَّمَ** sprechen
      - **VI تَفَاعَلَ**: reziprok — **تَعَاوَنَ** zusammenarbeiten, **تَقَابَلَ** einander treffen
      - **VII اِنْفَعَلَ**: passivähnlich — **اِنْكَسَرَ** zerbrechen (zerbrochen werden), **اِنْقَطَعَ** abgeschnitten werden
      - **VIII اِفْتَعَلَ**: — **اِجْتَمَعَ** sich versammeln, **اِنْتَظَرَ** warten, **اِسْتَمَعَ** zuhören
      - **X اِسْتَفْعَلَ**: suchen, halten für — **اِسْتَخْدَمَ** benutzen, **اِسْتَقْبَلَ** empfangen, **اِسْتَطَاعَ** können

      Wer das Muster kennt, kann die Bedeutung eines neuen Wortes aus seiner Wurzel erraten.
  ar-b1-participles:
    meaning: "aktive und passive Partizipien"
    intro: |
      Jedes Verb hat ein **aktives Partizip** (der Handelnde, oder *-end*) und ein **passives Partizip** (das Getane): Stamm I **فَاعِل / مَفْعُول** — **كَاتِب** Schreiber, schreibend / **مَكْتُوب** geschrieben, ein Brief. Die abgeleiteten Stämme nehmen **مُـ**: **مُدَرِّس** Lehrer (II), **مُسَاعِد** Assistent (III), **مُسْتَخْدَم** benutzt (X).

      Partizipien dienen als Nomen und Adjektive und ersetzen oft ein Verb: **أَنَا ذَاهِبٌ** „ich gehe gerade“.
  ar-b1-conditional:
    meaning: "wenn: إذا (wahrscheinlich) und لو (irreal)"
    intro: |
      - **إِذَا** + Vergangenheit für eine reale oder wahrscheinliche Bedingung (die Vergangenheitsform heißt hier *wenn … je*): **إِذَا جَاءَ أَخْبِرْنِي.** „Wenn er kommt, sag mir Bescheid.“
      - **لَوْ** + Vergangenheit für eine **irreale**, mit **لَـ** an der Folge: **لَوْ كُنْتُ غَنِيًّا لَاشْتَرَيْتُ بَيْتًا.** „Wäre ich reich, würde ich ein Haus kaufen.“
      - **إِنْ** + Jussiv oder Vergangenheit, formeller: **إِنْ تَدْرُسْ تَنْجَحْ.** „Wenn du lernst, bestehst du.“
    mistakes: ["إذا nimmt auch für die Zukunft die Vergangenheit."]
  ar-b1-number-agreement:
    meaning: "Zahlen 3–10: umgekehrtes Genus"
    intro: |
      Von drei bis zehn nimmt die Zahl das **entgegengesetzte Genus** des Nomens im Singular: Ein maskulines Nomen bekommt die Zahl **mit ة**, ein feminines **ohne**: **ثَلَاثَةُ كُتُبٍ** „drei Bücher“ (كتاب m.), **ثَلَاثُ بَنَاتٍ** „drei Mädchen“ (بنت f.). Das Nomen steht im **Genitiv Plural**.

      Von 11 bis 99 steht das Nomen im **Akkusativ Singular**: **عِشْرُونَ طَالِبًا** „zwanzig Studenten“.
    mistakes: ["Maskulines Nomen, Zahl mit ة."]
  ar-b1-become:
    meaning: "werden, noch immer: die Schwestern von كان"
    intro: |
      Wie **كَانَ** nehmen diese Verben ein Subjekt im Nominativ und ein Prädikat im **Akkusativ**: **أَصْبَحَ / صَارَ** „wurde“, **مَا زَالَ / لَا يَزَالُ** „ist noch immer“, **ظَلَّ** „blieb dabei“, **لَيْسَ** „ist nicht“. **أَصْبَحَ الْجَوُّ بَارِدًا.** „Das Wetter wurde kalt.“ **مَا زِلْتُ أَنْتَظِرُ.** „Ich warte noch immer.“
