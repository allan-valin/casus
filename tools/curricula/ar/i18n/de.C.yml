# German text of the Arabic course, levels C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Classical constructions: "Klassische Konstruktionen"
  Classical formulas: "Klassische Formeln"
  Verb forms in depth: "Verbformen vertieft"
  Fine points of iʿrāb: "Feinheiten des Iʿrāb"
  Literary connectors: "Literarische Konnektoren"
lessons:
  ar-c1-la-nafiya:
    meaning: "absolute Verneinung: es gibt kein …"
    intro: |
      **لَا** + ein unbestimmtes Nomen im **Akkusativ ohne Tanwin** verneint eine ganze Kategorie: **لَا شَكَّ** „es gibt keinen Zweifel“, **لَا بُدَّ** „es ist unvermeidlich“ (+ مِنْ / أَنْ: **لَا بُدَّ أَنْ نَذْهَبَ** „wir müssen gehen“), **لَا مَانِعَ** „kein Einwand“, **لَا رَيْبَ**.
  ar-c1-amma:
    meaning: "was … betrifft"
    intro: |
      **أَمَّا** „was … betrifft“ wählt ein Thema, und die folgende Aussage beginnt mit **فَـ**: **أَمَّا أَنَا فَلَا أَعْرِفُ.** „Was mich betrifft, ich weiß es nicht.“ Oft in Gegenüberstellungen: **…أَمَّا أَخُوهُ فَطَبِيبٌ** „… sein Bruder dagegen ist Arzt“. Nicht verwechseln mit **إِمَّا… وَإِمَّا** „entweder … oder“.
  ar-c1-diptotes:
    meaning: "Diptota: Nomen ohne Tanwin"
    intro: |
      Manche Nomen und Adjektive nehmen nie **Tanwin** und verwenden unbestimmt **-َ** für den Genitiv: viele gebrochene Plurale der Muster **مَفَاعِل / مَفَاعِيل** (**مَسَاجِدُ، مَدَارِسُ**), der Elativ **أَفْعَلُ** (**أَكْبَرُ**), viele Namen (**أَحْمَدُ، فَاطِمَةُ، مَكَّةُ**) und Farben wie **أَحْمَرُ**. **فِي مَدَارِسَ كَثِيرَةٍ** „in vielen Schulen“. Mit al- oder in Iḍāfa werden sie normal dekliniert: **فِي الْمَدَارِسِ**.
  ar-c1-exclamation:
    meaning: "Ausrufe: wie schön …!"
    intro: |
      **مَا + أَفْعَلَ + Akkusativ** drückt Staunen aus: **مَا أَجْمَلَ السَّمَاءَ!** „Wie schön der Himmel ist!“ **مَا أَطْيَبَ هٰذَا الطَّعَامَ!** „Wie köstlich dieses Essen ist!“
  ar-c1-quantifiers:
    meaning: "alle, einige, selbst"
    intro: |
      Diese Nomen stehen an der Spitze einer Iḍāfa: **كُلُّ** + unbestimmter Singular „jeder“ (**كُلُّ يَوْمٍ** „jeden Tag“), + bestimmt „alle“ (**كُلُّ الطُّلَّابِ**); **بَعْضُ** „einige“ (**بَعْضُ النَّاسِ**); **نَفْسُ** „derselbe“ oder „selbst“ (**نَفْسُ الْكِتَابِ** „dasselbe Buch“, **بِنَفْسِي** „selbst, allein“); **جَمِيعُ** „alle“; **كِلَا / كِلْتَا** „beide“.
  ar-c2-oath:
    meaning: "Schwüre und ihre Antwort"
    intro: |
      Man schwört mit den Partikeln **وَ**, **بِـ** oder **تَـ** + Genitiv (**وَاللّٰهِ، بِاللّٰهِ، تَاللّٰهِ** „bei Gott“) oder mit dem Verb **أُقْسِمُ بِـ / أَحْلِفُ بِـ** „ich schwöre bei“. Die beschworene Aussage (جَوَاب الْقَسَم) ist markiert: eine bejahte Vergangenheit mit **لَقَدْ** (**وَاللّٰهِ لَقَدْ رَأَيْتُهُ** „bei Gott, ich habe ihn wirklich gesehen“), ein Futur mit **لَـ … ـَنَّ** (der Energicus: **وَاللّٰهِ لَأَفْعَلَنَّ** „ich schwöre, ich tue es“), eine Verneinung mit **مَا** oder **لَا**. **لَعَمْرِي** „bei meinem Leben“ ist literarisch.

      Gesprochen heißt **وَاللّٰهِ** oft nur „wirklich, ehrlich“: **وَاللّٰهِ لَا أَعْرِفُ** „ehrlich, ich weiß es nicht“.
  ar-c2-praise-blame:
    meaning: "Verben des Lobes und Tadels"
    intro: |
      **نِعْمَ** „wie vortrefflich ist …“ und **بِئْسَ** „wie schlecht ist …“ sind erstarrte Verben, gefolgt von einem bestimmten Nomen im Nominativ (oft mit der gemeinten Person danach): **نِعْمَ الصَّدِيقُ أَنْتَ** „was für ein vortrefflicher Freund du bist“, **بِئْسَ الْمَصِيرُ** „welch übles Schicksal“. **حَبَّذَا** „wie gut ist“ und **لَا حَبَّذَا** „wie schlecht“ funktionieren ebenso: **حَبَّذَا الصَّبْرُ**. Verwechsle **نِعْمَ** nicht mit **نَعَمْ** „ja“ — im unvokalisierten Text zeigt das bestimmte Nomen danach, welches gemeint ist.

      Das zweite Ausrufmuster, **أَفْعِلْ بِـ**, ist literarisch: **أَكْرِمْ بِهِ!** „wie großzügig er ist!“
  ar-c2-exceptives:
    meaning: "die selteneren Ausnahmewörter und لا سيما"
    intro: |
      Neben **إِلَّا، غَيْر، سِوَى** (B2) verwendet klassisches und formelles Arabisch **عَدَا، خَلَا، حَاشَا** „außer“. Allein sind sie Präpositionen mit **Genitiv** oder Verben mit **Akkusativ**: **جَاءَ الْقَوْمُ عَدَا زَيْدٍ / زَيْدًا**. Mit **مَا** sind sie nur Verben, also Akkusativ: **مَا عَدَا زَيْدًا، مَا خَلَا زَيْدًا**. **حَاشَا لِلّٰهِ / حَاشَ لِلّٰهِ** „Gott bewahre“.

      **لَا سِيَّمَا / وَلَا سِيَّمَا** „besonders, vor allem“ hebt den wichtigsten Fall hervor: **أُحِبُّ الْفَوَاكِهَ لَا سِيَّمَا التُّفَّاحَ** „ich liebe Obst, besonders Äpfel“.
  ar-c2-kada:
    meaning: "Verben der Annäherung, der Hoffnung und des Beginns"
    intro: |
      Wie **كَانَ** haben diese Verben ein Subjekt und ein Prädikat, doch das Prädikat ist ein **Verb im Imperfekt**:

      - Annäherung: **كَادَ، أَوْشَكَ** „beinahe, war im Begriff“: **كَادَ يَسْقُطُ** „er wäre fast gefallen“; **مَا كَادَ … حَتَّى** „kaum … als“
      - Hoffnung: **عَسَى** (+ **أَنْ**): **عَسَى أَنْ يَأْتِيَ** „vielleicht kommt er“
      - Beginn: **شَرَعَ، أَخَذَ، بَدَأَ، جَعَلَ** „begann zu“: **أَخَذَ يَبْكِي** „er fing an zu weinen“

      Auf **كَادَ** folgt im guten Stil nie **أَنْ**; auf **أَوْشَكَ** kann es folgen.
  ar-c2-internal-passive:
    meaning: "das innere Passiv: فُعِلَ، يُفْعَلُ"
    intro: |
      Arabisch bildet das Passiv durch Änderung der **Vokale**: Vergangenheit **فُعِلَ** (**كُتِبَ** „wurde geschrieben“), Präsens **يُفْعَلُ** (**يُكْتَبُ** „wird geschrieben“); die abgeleiteten Stämme folgen (**اُسْتُخْدِمَ** „wurde benutzt“, **يُسْتَخْدَمُ**). Der Handelnde wird normalerweise nicht genannt. Unvokalisierter Text verbirgt es, also entscheidet der Kontext — außer bei häufigen Formen, die immer passiv sind:

      - hohle Verben: **قِيلَ** „es wurde gesagt“, **يُقَالُ** „man sagt“, **بِيعَ** „wurde verkauft“
      - **تُوُفِّيَ** „verstarb“ (wörtlich „wurde vollständig genommen“)
      - **وُلِدَ** „wurde geboren“, **يُرْجَى** „es wird gebeten“ (auf Hinweisen)

      **يُقَالُ إِنَّ…** „man sagt, dass …“ eröffnet viele Berichte.
  ar-c2-form-ix:
    meaning: "Stamm IX (Farben und Gebrechen) und Stämme XI–XV"
    intro: |
      **Stamm IX اِفْعَلَّ / يَفْعَلُّ** wird fast nur von Wurzeln für **Farben und körperliche Gebrechen** gebildet und heißt „werden, sich verfärben“: **اِحْمَرَّ** „wurde rot, errötete“, **اِصْفَرَّ** „wurde gelb / blass“, **اِبْيَضَّ** „wurde weiß“, **اِسْوَدَّ** „wurde schwarz“, **اِخْضَرَّ** „wurde grün“, **اِعْوَجَّ** „wurde krumm“. Das Masdar ist **اِفْعِلَال**: **اِحْمِرَار** „Röte, Erröten“. Unvokalisiert kann **احمر** das Verb oder das Adjektiv **أَحْمَرُ** „rot“ sein.

      Die Stämme **XI–XV** sind selten und literarisch: **XI اِفْعَالَّ** (**اِحْمَارَّ** „wurde tiefrot“), **XII اِفْعَوْعَلَ** (**اِخْشَوْشَنَ** „wurde sehr rau“), **XIII اِفْعَوَّلَ**, **XIV اِفْعَنْلَلَ**, **XV اِفْعَنْلَى**. Man muss sie nur in Wörterbüchern und Dichtung erkennen.
  ar-c2-kana-qad:
    meaning: "zusammengesetzte Zeiten mit كان und قد"
    intro: |
      **كَانَ** verbindet sich mit den anderen Zeiten, um Ereignisse genau in der Zeit zu verorten:

      - **كَانَ قَدْ** + Vergangenheit = Plusquamperfekt: **كَانَ قَدْ خَرَجَ عِنْدَمَا وَصَلْتُ** „er war hinausgegangen, als ich ankam“
      - **كَانَ** + Imperfekt = vergangene Gewohnheit oder Verlauf: **كَانَ يَقْرَأُ** „er pflegte zu lesen / las gerade“ (A2)
      - **سَيَكُونُ قَدْ** + Vergangenheit = Futur II: **سَيَكُونُ قَدْ وَصَلَ** „er wird angekommen sein“
      - **كَانَ سَـ** + Imperfekt = Zukunft in der Vergangenheit: **كَانَ سَيُسَافِرُ** „er wollte gerade verreisen“

      **كَانَ** richtet sich nach dem Subjekt, ebenso das folgende Verb: **كَانَتْ قَدْ نَامَتْ**.
  ar-c2-fossil-accusatives:
    meaning: "Akkusative hinter Alltagswörtern"
    intro: |
      Viele Alltagswörter sind **erstarrte Akkusative** mit Tanwin **-an** (geschrieben ـًا):

      - **المفعول المطلق** (absolutes Objekt), ein Masdar anstelle seines eigenen Verbs: **شُكْرًا** „danke“ (= أَشْكُرُكَ شُكْرًا), **عَفْوًا**, **حَقًّا** „wahrlich“, **أَيْضًا** „auch“, **جِدًّا** „sehr“, **طَبْعًا** „natürlich“. Im vollen Satz verstärkt oder beschreibt es: **ضَرَبَهُ ضَرْبًا شَدِيدًا** „er schlug ihn heftig“.
      - **المفعول لأجله** (Objekt des Zwecks), ein Masdar, das den Grund nennt: **وَقَفُوا احْتِرَامًا لَهُ** „sie standen aus Respekt vor ihm auf“, **خَوْفًا مِنْ** „aus Angst vor“.
      - **الظرف** (Umstandsangabe der Zeit und des Ortes): **صَبَاحًا** „morgens“, **أَبَدًا** „je, nie“, **دَائِمًا**, **فَوْرًا** „sofort“.
  ar-c2-tamyiz:
    meaning: "Tamyīz: der Akkusativ der Spezifizierung"
    intro: |
      **التمييز** ist ein unbestimmter **Akkusativ**, der sagt, *in welcher Hinsicht* etwas gemeint ist:

      - nach den Zahlen **11–99**: **أَحَدَ عَشَرَ كِتَابًا**, **عِشْرُونَ طَالِبًا**, **خَمْسُونَ سَنَةً** (Akkusativ Singular)
      - nach fragendem **كَمْ** „wie viele“: **كَمْ كِتَابًا قَرَأْتَ؟** „wie viele Bücher hast du gelesen?“ (nach ausrufendem **كَمْ** „wie viele …!“ steht das Nomen im Genitiv: **كَمْ كِتَابٍ قَرَأْتُ!**)
      - nach einem Elativ oder einem Verb des Füllens: **هُوَ أَكْثَرُ عِلْمًا** „er ist gelehrter“ (wörtlich „mehr an Wissen“), **اِمْتَلَأَ الْكَأْسُ مَاءً** „das Glas füllte sich mit Wasser“
      - nach Maßangaben: **لِتْرٌ حَلِيبًا** (auch Iḍāfa: **لِتْرُ حَلِيبٍ**)
  ar-c2-lam-emphasis:
    meaning: "das betonende lām nach إنّ"
    intro: |
      Nach **إِنَّ** kann das Prädikat (oder ein nachgestelltes Subjekt) das betonende **لَـ** nehmen (اللام المزحلقة, „das verrutschte lām“): **إِنَّهُ لَصَادِقٌ** „er ist wahrhaftig ehrlich“, **إِنَّ هٰذَا لَأَمْرٌ عَجِيبٌ** „dies ist wahrlich eine seltsame Sache“, **إِنَّ فِي ذٰلِكَ لَعِبْرَةً** „darin liegt gewiss eine Lehre“. Es gehört zur Rhetorik, zum Koran und zu formellen Reden; das lām steht nie direkt nach **إِنَّ**, sondern „rutscht“ zum Prädikat. Das erleichterte **إِنْ** behält das lām zwingend, um es vom verneinenden **إِنْ** zu unterscheiden: **إِنْ كَانَ لَصَادِقًا** „er war wahrhaftig ehrlich“.
  ar-c2-conditional-nouns:
    meaning: "Konditionalnomen: was auch immer, wo auch immer, wann immer"
    intro: |
      Neben **إِنْ، إِذَا، لَوْ** leitet eine Reihe von **Konditionalnomen** allgemeine Bedingungen ein, klassisch mit dem **Jussiv** (oder der Vergangenheit) in beiden Teilen: **مَنْ** „wer auch immer“ (**مَنْ يَجْتَهِدْ يَنْجَحْ** „wer sich anstrengt, hat Erfolg“), **مَا / مَهْمَا** „was auch immer“ (**مَهْمَا تَفْعَلْ…**), **أَيْنَمَا / حَيْثُمَا** „wo auch immer“, **مَتَى** „wann immer“, **كَيْفَمَا** „wie auch immer“. **كُلَّمَا** „jedes Mal, wenn“ nimmt in beiden Teilen die Vergangenheit: **كُلَّمَا رَأَيْتُهُ تَذَكَّرْتُ أَبِي** „jedes Mal, wenn ich ihn sehe, denke ich an meinen Vater“.
  ar-c2-lamma-idh:
    meaning: "literarische Zeitkonnektoren"
    intro: |
      Die literarische Erzählung verknüpft Ereignisse mit:

      - **لَمَّا** + Vergangenheit „als, nachdem“: **لَمَّا وَصَلَ اسْتَقْبَلُوهُ** „als er ankam, empfingen sie ihn“; + Jussiv heißt es „noch nicht“: **لَمَّا يَصِلْ** „er ist noch nicht angekommen“
      - **إِذْ** „als, da, weil“: **إِذْ كُنْتُ صَغِيرًا** „als ich klein war“; **إِذْ** gibt auch einen Grund an
      - **إِذَا** der Überraschung (إذا الفجائية) + Nomen: **خَرَجْتُ فَإِذَا الْمَطَرُ يَنْهَمِرُ** „ich ging hinaus, und siehe, es goss in Strömen“
      - **مَا إِنْ … حَتَّى** „kaum … als“: **مَا إِنْ وَصَلَ حَتَّى نَامَ** „kaum war er angekommen, schlief er ein“
      - **رَيْثَمَا** „bis, solange (wartend)“, **حَالَمَا** „sobald“
