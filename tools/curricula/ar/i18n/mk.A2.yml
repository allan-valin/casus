# Macedonian text of the Arabic course, level A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The verb: "Глаголот"
  Nouns together: "Именки заедно"
  Having and comparing: "Имање и споредување"
  Commands and relative clauses: "Наредби и релативни реченици"
lessons:
  ar-a2-present:
    meaning: "сегашното (несвршено) време"
    intro: |
      Арапските глаголи се градат на **корен** од (обично) три согласки — **ك ت ب** „пишување“ — а речниците ги даваат во минато време, 3 лице машки род: **كَتَبَ** „тој напиша“.

      Сегашното време додава **префикси** за лицето и **суфикси** за род и број: **أَكْتُبُ** пишувам, **يَكْتُبُ** тој пишува, **تَكْتُبُ** таа пишува / ти пишуваш. Тоа значи *пишувам*, *сега пишувам* и често *ќе пишувам*.
    mistakes: ["„Таа“ го зема префиксот ت-.", "*ти* (ж.) додава -ينَ."]
  ar-a2-past:
    meaning: "минатото (свршено) време"
    intro: |
      Минатото користи **само суфикси**: **كَتَبْتُ** напишав, **كَتَبْتَ** ти (м.) напиша, **كَتَبَ** тој напиша, **كَتَبَتْ** таа напиша, **كَتَبْنَا** напишавме, **كَتَبُوا** тие напишаа. Голата форма **كَتَبَ** е речничката форма.

      Во текст без самогласки **كتبت** може да значи *јас / ти (м.) / ти (ж.) / таа напиша* — контекстот и подметот одлучуваат.
    mistakes: ["Тие: -وا (алифот не се изговара)."]
  ar-a2-negation:
    meaning: "негација: четири збора за „не“"
    intro: |
      Кое *не*, зависи од времето:

      - **لَا** + сегашно: **لَا أَعْرِفُ.** „Не знам.“
      - **لَمْ** + јусив (сегашна форма со кратка наставка) за **минатото**: **لَمْ أَذْهَبْ.** „Не отидов.“
      - **لَنْ** + субјунктив за **иднината**: **لَنْ أَذْهَبَ.** „Нема да одам.“
      - **لَيْسَ** „не е“, менлив, за реченици без глагол: **لَسْتُ مُتْعَبًا.** „Не сум уморен.“ (прирок во акузатив)

      **مَا** + минато (**مَا ذَهَبْتُ**) исто така е правилно и често во говорот.
    mistakes: ["Минато: لم + јусив (или ما + минато).", "Без глагол: ليس, менлив."]
  ar-a2-future:
    meaning: "идното време: sa- и sawfa"
    intro: |
      **سَـ** (споено) или **سَوْفَ** (посебен збор) пред сегашното го градат идното време, како **ќе**: **سَأَذْهَبُ / سَوْفَ أَذْهَبُ** „ќе одам“. سَـ е почесто во пишувањето; سوف може да звучи подалечно или поизразено. Одречно е **لَنْ** + субјунктив (не لا سوف).
    mistakes: ["Одречно идно: لن."]
  ar-a2-kana:
    meaning: "бев, беше: كان"
    intro: |
      **كَانَ** е *сум* во минато (а во иднина **يَكُونُ**). Се менува како минат глагол, со долго ā што се скратува пред согласски наставки: **كُنْتُ** бев, **كَانَ** беше (тој), **كَانَتْ** беше (таа), **كُنَّا** бевме, **كَانُوا** беа.

      Неговиот прирок е во **акузатив**: **كَانَ الْجَوُّ جَمِيلًا.** „Времето беше убаво.“ Со сегашен глагол го гради минатото траење / навика, како македонското минато несвршено: **كُنْتُ أَعْمَلُ** „работев“.
    mistakes: ["Прирокот на كان е во акузатив."]
  ar-a2-idafa:
    meaning: "идафа: X на Y"
    intro: |
      *Книгата на студентот* се две именки една до друга, **идафа**: **كِتَابُ الطَّالِبِ** „книга (на) студентот“. Првата именка нема **член ни танвин** — ја определува она што следи — а втората е во **генитив**. Може и низи: **مِفْتَاحُ بَابِ الْبَيْتِ** „клучот од вратата на куќата“.

      Придавка за првата именка доаѓа **по** целата идафа: **كِتَابُ الطَّالِبِ الْجَدِيدُ** „новата книга на студентот“.
    mistakes: ["Првиот член никогаш не зема al-."]
  ar-a2-plural:
    meaning: "множина: правилна и скршена"
    intro: |
      Два вида множина:

      - **правилна**: машка **-ُونَ** (генитив/акузатив **-ِينَ**) за мажи — **مُعَلِّمُونَ**; женска **-َات** — **مُعَلِّمَات**, **سَيَّارَات**.
      - **скршена**: се менуваат самогласките во коренот — **كِتَاب → كُتُب**, **بَيْت → بُيُوت**, **وَلَد → أَوْلَاد**, **رَجُل → رِجَال**. Повеќето чести именки имаат таква; учи ја со именката.

      Множините на **предмети** се согласуваат во женски род еднина: **الْكُتُبُ جَدِيدَةٌ** „книгите се нови“.
    mistakes: ["Предмети во множина: женски род еднина."]
  ar-a2-dual:
    meaning: "двојина: два од нешто"
    intro: |
      Две од нешто е посебна форма, **двојина**: **-َانِ** (номинатив), **-َيْنِ** (генитив/акузатив): **كِتَابَانِ** „две книги“, **فِي يَوْمَيْنِ** „за два дена“. Пред ة се изговара t: **طَالِبَتَانِ**. Во идафа крајното ن паѓа: **يَدَا الطِّفْلِ** „двете раце на детето“.
  ar-a2-have:
    meaning: "имање: عند и لـ"
    intro: |
      Арапскиот нема глагол *има*. Се вели „кај мене е…“ со **عِنْدَ** + суфикс или „мене ми е…“ со **لِـ**: **عِنْدِي سَيَّارَةٌ** „имам кола“, **لِي أَخٌ** „имам брат“. **لَدَى** (+ суфикс: **لَدَيَّ**) е формалниот еквивалент. Одречно: **لَيْسَ عِنْدِي**; минато: **كَانَ عِنْدِي**.
    mistakes: ["Суфиксот е сопственикот."]
  ar-a2-comparative:
    meaning: "поголем од, најголем"
    intro: |
      Компаративот има образец **أَفْعَلُ**, ист за двата рода: `كَبِير` → **أَكْبَرُ** „поголем“, `صَغِير` → **أَصْغَرُ**, `جَمِيل` → **أَجْمَلُ**. *Од* (во споредба) е **مِنْ**: **أَخِي أَكْبَرُ مِنِّي.** „Брат ми е постар од мене.“

      Суперлативот е истиот збор, определен или во идафа: **الْأَكْبَرُ** „најголемиот“, **أَكْبَرُ مَدِينَةٍ** „најголемиот град“. За долги придавки **أَكْثَرُ** „повеќе“ + именка: **أَكْثَرُ أَهَمِّيَّةً** „поважен“.
    mistakes: ["Со مِن компаративот останува أفعل за двата рода."]
  ar-a2-imperative:
    meaning: "заповедниот начин"
    intro: |
      Земи го јусивот за *ти* (**تَكْتُبْ**), отстрани го префиксот **تَـ**, и ако зборот сега почнува со две согласки, додај помошна самогласка со алиф: **اُكْتُبْ** „пиши!“ (u по u-основа, инаку i: **اِذْهَبْ** „оди!“, **اِجْلِسْ** „седни!“). Женски **-ِي**, множина **-ُوا**: **اُكْتُبِي، اُكْتُبُوا**.

      Забрана е **لَا** + јусив: **لَا تَذْهَبْ!** „Немој да одиш!“
    mistakes: ["Забрана: لا + јусив, не заповеден начин."]
  ar-a2-relative:
    meaning: "релативни заменки: кој, што"
    intro: |
      По **определена** именка, релативната заменка се согласува со неа: **الَّذِي** (м.), **الَّتِي** (ж., и предмети во множина), **الَّذِينَ** (м. луѓе мн.), **اللَّوَاتِي** (ж. мн.). По **неопределена** именка нема никаков релативен збор: **رَأَيْتُ رَجُلًا يَقْرَأُ** „видов човек (што) читаше“.

      Како во македонскиот, релативот-објект задржува заменка: **الْكِتَابُ الَّذِي قَرَأْتُهُ** „книгата што ја прочитав“.
    mistakes: ["Нема релативен збор по неопределена именка."]
