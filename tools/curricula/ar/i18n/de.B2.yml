# German text of the Arabic course, level B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Weak verbs: "Schwache Verben"
  Nuance: "Nuancen"
  Word order: "Wortstellung"
lessons:
  ar-b2-hollow:
    meaning: "hohle Verben (و oder ي in der Mitte)"
    intro: |
      Ist der mittlere Wurzelbuchstabe **و** oder **ي**, wird er zum Langvokal, der vor konsonantischer Endung kurz wird: **قَالَ** „er sagte“, aber **قُلْتُ** „ich sagte“; Präsens **يَقُولُ**, Jussiv **لَمْ يَقُلْ**. Der Präsensvokal zeigt den verborgenen Buchstaben: **يَقُولُ** (و), **يَبِيعُ** (ي), **يَنَامُ** (ا).
    mistakes: ["Das lange ā wird vor -tu kurz."]
  ar-b2-defective:
    meaning: "defektive Verben (و oder ي am Ende)"
    intro: |
      Mit **و / ي** als letztem Wurzelbuchstaben endet das Verb auf einen Vokal: **مَشَى / يَمْشِي** „gehen“, **دَعَا / يَدْعُو** „rufen, einladen“, **نَسِيَ / يَنْسَى** „vergessen“. Endungen treffen auf diesen Vokal: **مَشَيْتُ** „ich ging“, **مَشَوْا** „sie gingen“; der Jussiv lässt ihn weg: **لَمْ يَمْشِ**.
  ar-b2-assimilated-doubled:
    meaning: "assimilierte (و- am Anfang) und verdoppelte Verben"
    intro: |
      - **Assimiliert**: Der erste Wurzelbuchstabe **و** fällt im Präsens weg: **وَصَلَ / يَصِلُ** „ankommen“, **وَجَدَ / يَجِدُ** „finden“, **وَضَعَ / يَضَعُ** „legen“.
      - **Verdoppelt**: zweiter und dritter Buchstabe gleich, mit Schadda geschrieben, wo sie zusammentreffen: **ظَنَّ / يَظُنُّ** „meinen“, **مَرَّ / يَمُرُّ** „vorbeigehen“; vor konsonantischer Endung trennen sie sich: **ظَنَنْتُ** „ich meinte“.
  ar-b2-qad:
    meaning: "قد: schon, wirklich; kann"
    intro: |
      **قَدْ** + Vergangenheit betont, dass etwas **geschehen ist** (oft *schon*): **قَدْ وَصَلَ الْقِطَارُ** „der Zug ist angekommen“; **لَقَدْ** ist noch stärker. **قَدْ** + Präsens heißt **kann, manchmal**: **قَدْ يَتَأَخَّرُ** „er kommt vielleicht zu spät“.
  ar-b2-exception:
    meaning: "außer, nur: إلا, غير, سوى"
    intro: |
      **إِلَّا** „außer“ (+ Akkusativ nach einem bejahten Satz): **جَاءَ الطُّلَّابُ إِلَّا خَالِدًا.** Nach einer Verneinung heißt es **nur**: **مَا عِنْدِي إِلَّا عَشَرَةُ دَنَانِيرَ** „ich habe nur zehn Dinar“. **غَيْر** und **سِوَى** „außer, anders als“ nehmen den Genitiv: **لَا أَحَدَ غَيْرُكَ** „niemand außer dir“. **غير** verneint auch Adjektive: **غَيْرُ مُمْكِنٍ** „unmöglich“.
  ar-b2-vso:
    meaning: "ein Verb vor einem Pluralsubjekt bleibt im Singular"
    intro: |
      Im **Verbalsatz** (Verb zuerst, die klassische Ordnung) richtet sich das Verb nur im **Genus** nach dem Subjekt und bleibt auch vor einem Plural im **Singular**: **ذَهَبَ الطُّلَّابُ** „die Studenten gingen“, **ذَهَبَتِ الطَّالِبَاتُ**. Steht das Subjekt **zuerst**, volle Kongruenz: **الطُّلَّابُ ذَهَبُوا**.
    mistakes: ["Verb zuerst: Singular."]
  ar-b2-hal:
    meaning: "der Ḥāl: wie jemand etwas tat"
    intro: |
      Ein **unbestimmtes Adjektiv oder Partizip im Akkusativ** nach einem Verb nennt den Zustand des Subjekts oder Objekts in diesem Moment: **جَاءَ مُسْرِعًا** „er kam eilig“, **رَجَعَ سَعِيدًا** „er kam glücklich zurück“. Ein Satz mit **وَ** leistet dasselbe: **خَرَجَ وَهُوَ يَضْحَكُ** „er ging lachend hinaus“.
