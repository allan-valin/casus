# Macedonian text of the Arabic course, levels C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Classical constructions: "Класични конструкции"
  Classical formulas: "Класични формули"
  Verb forms in depth: "Глаголски форми подлабоко"
  Fine points of iʿrāb: "Тенкости на иʿработ"
  Literary connectors: "Книжевни сврзувачи"
lessons:
  ar-c1-la-nafiya:
    meaning: "апсолутна негација: нема никаков…"
    intro: |
      **لَا** + неопределена именка во **акузатив без танвин** негира цела категорија: **لَا شَكَّ** „нема сомнение“, **لَا بُدَّ** „неизбежно е“ (+ مِنْ / أَنْ: **لَا بُدَّ أَنْ نَذْهَبَ** „мораме да одиме“), **لَا مَانِعَ** „нема пречка“, **لَا رَيْبَ**.
  ar-c1-amma:
    meaning: "што се однесува до…"
    intro: |
      **أَمَّا** „што се однесува до“ избира тема, а исказот што следи почнува со **فَـ**: **أَمَّا أَنَا فَلَا أَعْرِفُ.** „Што се однесува до мене, не знам.“ Често во спротивставувања: **…أَمَّا أَخُوهُ فَطَبِيبٌ** „…а брат му е лекар“. Не мешај со **إِمَّا… وَإِمَّا** „или… или“.
  ar-c1-diptotes:
    meaning: "диптоти: именки без танвин"
    intro: |
      Некои именки и придавки никогаш не земаат **танвин** и кога се неопределени користат **-َ** за генитив: многу скршени множини по образецот **مَفَاعِل / مَفَاعِيل** (**مَسَاجِدُ، مَدَارِسُ**), елативот **أَفْعَلُ** (**أَكْبَرُ**), многу имиња (**أَحْمَدُ، فَاطِمَةُ، مَكَّةُ**) и боите **أَحْمَرُ**. **فِي مَدَارِسَ كَثِيرَةٍ** „во многу училишта“. Со al- или во идафа се менуваат нормално: **فِي الْمَدَارِسِ**.
  ar-c1-exclamation:
    meaning: "извици: колку убаво…!"
    intro: |
      **مَا + أَفْعَلَ + акузатив** изразува восхит: **مَا أَجْمَلَ السَّمَاءَ!** „Колку е убаво небото!“ **مَا أَطْيَبَ هٰذَا الطَّعَامَ!** „Колку е вкусна оваа храна!“
  ar-c1-quantifiers:
    meaning: "сите, некои, сам"
    intro: |
      Овие именки стојат на чело на идафа: **كُلُّ** + неопределена еднина „секој“ (**كُلُّ يَوْمٍ** „секој ден“), + определена „сите“ (**كُلُّ الطُّلَّابِ**); **بَعْضُ** „некои“ (**بَعْضُ النَّاسِ**); **نَفْسُ** „истиот“ или „сам“ (**نَفْسُ الْكِتَابِ** „истата книга“, **بِنَفْسِي** „самиот јас“); **جَمِيعُ** „сите“; **كِلَا / كِلْتَا** „двата / двете“.
  ar-c2-oath:
    meaning: "заклетви и нивниот одговор"
    intro: |
      Се колне со честичките **وَ**, **بِـ** или **تَـ** + генитив (**وَاللّٰهِ، بِاللّٰهِ، تَاللّٰهِ** „богами“) или со глаголот **أُقْسِمُ بِـ / أَحْلِفُ بِـ** „се колнам во“. Исказот на кој се колне (جَوَاب الْقَسَم) е означен: потврдно минато со **لَقَدْ** (**وَاللّٰهِ لَقَدْ رَأَيْتُهُ** „богами, навистина го видов“), иднина со **لَـ … ـَنَّ** (енергичната форма: **وَاللّٰهِ لَأَفْعَلَنَّ** „се колнам дека ќе го направам“), одречно со **مَا** или **لَا**. **لَعَمْرِي** „живота ми“ е книжевно.

      Во говорот **وَاللّٰهِ** често значи само „навистина, искрено“: **وَاللّٰهِ لَا أَعْرِفُ** „искрено, не знам“.
  ar-c2-praise-blame:
    meaning: "глаголи на пофалба и прекор"
    intro: |
      **نِعْمَ** „колку е одличен…“ и **بِئْسَ** „колку е лош…“ се вкочанети глаголи проследени со определена именка во номинатив (често со лицето за кое станува збор): **نِعْمَ الصَّدِيقُ أَنْتَ** „каков одличен пријател си“, **بِئْسَ الْمَصِيرُ** „каква лоша судбина“. **حَبَّذَا** „колку е добро“ и **لَا حَبَّذَا** „колку е лошо“ работат исто: **حَبَّذَا الصَّبْرُ**. Не мешај **نِعْمَ** со **نَعَمْ** „да“ — во текст без самогласки определената именка по него покажува кое е.

      Вториот извичен образец, **أَفْعِلْ بِـ**, е книжевен: **أَكْرِمْ بِهِ!** „колку е великодушен!“
  ar-c2-exceptives:
    meaning: "поретките изземачки зборови и لا سيما"
    intro: |
      Покрај **إِلَّا، غَيْر، سِوَى** (B2), класичниот и формалниот арапски користат **عَدَا، خَلَا، حَاشَا** „освен“. Сами се предлози со **генитив** или глаголи со **акузатив**: **جَاءَ الْقَوْمُ عَدَا زَيْدٍ / زَيْدًا**. Со **مَا** се само глаголи, значи акузатив: **مَا عَدَا زَيْدًا، مَا خَلَا زَيْدًا**. **حَاشَا لِلّٰهِ / حَاشَ لِلّٰهِ** „Боже сочувај“.

      **لَا سِيَّمَا / وَلَا سِيَّمَا** „особено, пред сè“ го издвојува најважниот случај: **أُحِبُّ الْفَوَاكِهَ لَا سِيَّمَا التُّفَّاحَ** „сакам овошје, особено јаболка“.
  ar-c2-kada:
    meaning: "глаголи на приближување, надеж и почеток"
    intro: |
      Како **كَانَ**, овие глаголи имаат подмет и прирок, но прирокот е **глагол во несвршено време**:

      - приближување: **كَادَ، أَوْشَكَ** „малку недостигаше, беше на прагот“: **كَادَ يَسْقُطُ** „за малку ќе паднеше“; **مَا كَادَ … حَتَّى** „штом… и“
      - надеж: **عَسَى** (+ **أَنْ**): **عَسَى أَنْ يَأْتِيَ** „можеби ќе дојде“
      - почеток: **شَرَعَ، أَخَذَ، بَدَأَ، جَعَلَ** „почна да“: **أَخَذَ يَبْكِي** „почна да плаче“

      По **كَادَ** во добриот стил никогаш не доаѓа **أَنْ**; по **أَوْشَكَ** може.
  ar-c2-internal-passive:
    meaning: "внатрешниот пасив: فُعِلَ، يُفْعَلُ"
    intro: |
      Арапскиот го гради пасивот со менување на **самогласките**: минато **فُعِلَ** (**كُتِبَ** „беше напишано“), сегашно **يُفْعَلُ** (**يُكْتَبُ** „се пишува“); изведените форми го следат истото (**اُسْتُخْدِمَ** „беше користено“, **يُسْتَخْدَمُ**). Вршителот обично не се спомнува. Текстот без самогласки го крие, па одлучува контекстот — освен кај честите форми што се секогаш пасивни:

      - шупливи глаголи: **قِيلَ** „беше речено“, **يُقَالُ** „се вели“, **بِيعَ** „беше продадено“
      - **تُوُفِّيَ** „почина“ (буквално „беше земен во целост“)
      - **وُلِدَ** „се роди“, **يُرْجَى** „се моли“ (на известувања)

      **يُقَالُ إِنَّ…** „се вели дека…“ отвора многу извештаи.
  ar-c2-form-ix:
    meaning: "форма IX (бои и недостатоци) и формите XI–XV"
    intro: |
      **Формата IX اِفْعَلَّ / يَفْعَلُّ** се гради речиси само од корени за **бои и телесни недостатоци** и значи „станува, се обојува“: **اِحْمَرَّ** „поцрвене“, **اِصْفَرَّ** „пожолте / побледе“, **اِبْيَضَّ** „побеле“, **اِسْوَدَّ** „поцрне“, **اِخْضَرَّ** „позелене“, **اِعْوَجَّ** „се искриви“. Масдарот е **اِفْعِلَال**: **اِحْمِرَار** „црвенило“. Без самогласки, **احمر** може да е глаголот или придавката **أَحْمَرُ** „црвен“.

      Формите **XI–XV** се ретки и книжевни: **XI اِفْعَالَّ** (**اِحْمَارَّ** „стана темноцрвен“), **XII اِفْعَوْعَلَ** (**اِخْشَوْشَنَ** „стана многу груб“), **XIII اِفْعَوَّلَ**, **XIV اِفْعَنْلَلَ**, **XV اِفْعَنْلَى**. Треба само да ги препознаеш во речници и поезија.
  ar-c2-kana-qad:
    meaning: "сложени времиња со كان и قد"
    intro: |
      **كَانَ** се комбинира со другите времиња за прецизно да ги смести настаните во времето:

      - **كَانَ قَدْ** + минато = минато предвремено: **كَانَ قَدْ خَرَجَ عِنْدَمَا وَصَلْتُ** „беше излегол кога пристигнав“
      - **كَانَ** + несвршено = минато навика или траење: **كَانَ يَقْرَأُ** „читаше“ (A2)
      - **سَيَكُونُ قَدْ** + минато = идно предвремено: **سَيَكُونُ قَدْ وَصَلَ** „ќе има пристигнато“
      - **كَانَ سَـ** + несвршено = идно во минатото: **كَانَ سَيُسَافِرُ** „требаше да патува“

      **كَانَ** се согласува со подметот, како и глаголот што следи: **كَانَتْ قَدْ نَامَتْ**.
  ar-c2-fossil-accusatives:
    meaning: "акузативи зад секојдневни зборови"
    intro: |
      Многу секојдневни зборови се **вкочанети акузативи** со танвин **-an** (пишуван ـًا):

      - **المفعول المطلق** (апсолутен објект), масдар наместо сопствениот глагол: **شُكْرًا** „благодарам“ (= أَشْكُرُكَ شُكْرًا), **عَفْوًا**, **حَقًّا** „навистина“, **أَيْضًا** „исто така“, **جِدًّا** „многу“, **طَبْعًا** „се разбира“. Во цела реченица засилува или опишува: **ضَرَبَهُ ضَرْبًا شَدِيدًا** „жестоко го удри“.
      - **المفعول لأجله** (објект на целта), масдар што ја кажува причината: **وَقَفُوا احْتِرَامًا لَهُ** „станаа од почит кон него“, **خَوْفًا مِنْ** „од страв од“.
      - **الظرف** (прилошка определба за време и место): **صَبَاحًا** „наутро“, **أَبَدًا** „никогаш“, **دَائِمًا**, **فَوْرًا** „веднаш“.
  ar-c2-tamyiz:
    meaning: "тамјиз: акузатив на одредување"
    intro: |
      **التمييز** е неопределен **акузатив** што кажува *во поглед на што* нешто се мисли:

      - по броевите **11–99**: **أَحَدَ عَشَرَ كِتَابًا**, **عِشْرُونَ طَالِبًا**, **خَمْسُونَ سَنَةً** (акузатив еднина)
      - по прашалното **كَمْ** „колку“: **كَمْ كِتَابًا قَرَأْتَ؟** „колку книги прочита?“ (по извичното **كَمْ** „колку…!“ именката е во генитив: **كَمْ كِتَابٍ قَرَأْتُ!**)
      - по елатив или глагол на полнење: **هُوَ أَكْثَرُ عِلْمًا** „тој е поучен“ (буквално „повеќе по знаење“), **اِمْتَلَأَ الْكَأْسُ مَاءً** „чашата се наполни со вода“
      - по мерки: **لِتْرٌ حَلِيبًا** (и идафа: **لِتْرُ حَلِيبٍ**)
  ar-c2-lam-emphasis:
    meaning: "нагласното lām по إنّ"
    intro: |
      По **إِنَّ** прирокот (или одложениот подмет) може да го земе нагласното **لَـ** (اللام المزحلقة, „лизнатото lām“): **إِنَّهُ لَصَادِقٌ** „тој е навистина искрен“, **إِنَّ هٰذَا لَأَمْرٌ عَجِيبٌ** „ова е навистина чудна работа“, **إِنَّ فِي ذٰلِكَ لَعِبْرَةً** „во тоа секако има поука“. Тоа е одлика на реториката, Куранот и свечените говори; lām никогаш не стои веднаш по **إِنَّ**, туку „се лизга“ до прирокот. Олесненото **إِنْ** задолжително го задржува lām, за да се разликува од одречното **إِنْ**: **إِنْ كَانَ لَصَادِقًا** „навистина беше искрен“.
  ar-c2-conditional-nouns:
    meaning: "условни именки: што и да, каде и да, кога и да"
    intro: |
      Покрај **إِنْ، إِذَا، لَوْ**, група **условни именки** воведуваат општи услови, класично со **јусив** (или минато) во двата дела: **مَنْ** „кој и да“ (**مَنْ يَجْتَهِدْ يَنْجَحْ** „кој се труди, успева“), **مَا / مَهْمَا** „што и да“ (**مَهْمَا تَفْعَلْ…**), **أَيْنَمَا / حَيْثُمَا** „каде и да“, **مَتَى** „кога и да“, **كَيْفَمَا** „како и да“. **كُلَّمَا** „секогаш кога“ зема минато во двата дела: **كُلَّمَا رَأَيْتُهُ تَذَكَّرْتُ أَبِي** „секогаш кога ќе го видам, се сеќавам на татко ми“.
  ar-c2-lamma-idh:
    meaning: "книжевни временски сврзувачи"
    intro: |
      Книжевното раскажување ги поврзува настаните со:

      - **لَمَّا** + минато „кога, откако“: **لَمَّا وَصَلَ اسْتَقْبَلُوهُ** „кога пристигна, го пречекаа“; + јусив значи „сè уште не“: **لَمَّا يَصِلْ** „сè уште не пристигнал“
      - **إِذْ** „кога, бидејќи“: **إِذْ كُنْتُ صَغِيرًا** „кога бев мал“; **إِذْ** кажува и причина
      - **إِذَا** на изненадување (إذا الفجائية) + именка: **خَرَجْتُ فَإِذَا الْمَطَرُ يَنْهَمِرُ** „излегов, и гле — дождот лееше“
      - **مَا إِنْ … حَتَّى** „штом … и“: **مَا إِنْ وَصَلَ حَتَّى نَامَ** „штом пристигна, заспа“
      - **رَيْثَمَا** „додека (се чека)“, **حَالَمَا** „штом“
