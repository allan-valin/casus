# German text of the Arabic course, level A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Letters and sounds: "Buchstaben und Laute"
  Sentences without a verb: "Sätze ohne Verb"
  Asking: "Fragen"
  Place and possession: "Ort und Besitz"
  Numbers: "Zahlen"
lessons:
  ar-a1-alphabet:
    meaning: "das Alphabet, Vokalzeichen und ähnliche Buchstaben"
    intro: |
      Arabisch wird **von rechts nach links** mit 28 Buchstaben geschrieben; die meisten verbinden sich mit dem nächsten und haben daher bis zu vier Formen. Geschrieben werden nur die **Konsonanten und Langvokale** (ا و ي); die **Kurzvokale** sind kleine Zeichen — `ـَ` *a*, `ـِ` *i*, `ـُ` *u* —, die gewöhnliche Texte weglassen und Lernertexte, der Koran und Kinderbücher setzen. `ـْ` (Sukun) bedeutet: kein Vokal, `ـّ` (Schadda) verdoppelt den Konsonanten, und `ـٌ ـٍ ـً` (Tanwin) fügen einem unbestimmten Nomen *-n* an.

      Casus zeigt die Vokale überall dort, wo sein Leser sich ihrer sicher ist.
    sections:
      notes: |
        | Zeichen | Name | Laut | Beispiel |
        |---|---|---|---|
        | ـَ | Fatha | a | كَتَبَ *kataba* |
        | ـِ | Kasra | i | بِنْت *bint* |
        | ـُ | Damma | u | كُتُب *kutub* |
        | ـْ | Sukun | kein Vokal | قَلْب *qalb* |
        | ـّ | Schadda | Doppelkonsonant | مُدَرِّس *mudarris* |
        | ـٌ ـٍ ـً | Tanwin | -un -in -an | كِتَابٌ *kitābun* |
    mistakes: ["ق ist ein tieferes k, hinten im Rachen gebildet; كلب heißt *Hund*."]
  ar-a1-definite:
    meaning: "der Artikel al- und die Sonnenbuchstaben"
    intro: |
      **ال** (*al-*) ist der einzige Artikel und wird mit dem Nomen zusammengeschrieben: `بَيْت` „ein Haus“ → `الْبَيْت` „das Haus“. Ein unbestimmtes Nomen trägt **Tanwin**: `بَيْتٌ` *baytun*; ein bestimmtes nie.

      Vor den 14 **Sonnenbuchstaben** (ت ث د ذ ر ز س ش ص ض ط ظ ل ن — die mit der Zungenspitze gebildeten) wird das *l* nicht gesprochen und der Buchstabe verdoppelt: `الشَّمْس` *asch-schams* „die Sonne“. Vor den **Mondbuchstaben** bleibt es: `الْقَمَر` *al-qamar* „der Mond“.
    mistakes: ["ش ist ein Sonnenbuchstabe: das l gleicht sich an.", "Kein Tanwin mit al-."]
  ar-a1-pronouns:
    meaning: "Personalpronomen"
    intro: |
      Arabisch unterscheidet **maskulin und feminin** auch bei *du* und *sie* (Plural) und hat **Dualformen** für zwei Personen. In Verbalsätzen fällt das Pronomen meist weg, weil das Verb die Person zeigt; in Sätzen ohne Verb wird es gebraucht: **أَنَا طَالِبٌ.** „Ich bin Student.“
    mistakes: ["*du* zu einer Frau ist anti, mit Kasra."]
  ar-a1-nominal:
    meaning: "der Nominalsatz: kein „sein“ im Präsens"
    intro: |
      Im Präsens wird *sein* nicht ausgedrückt: Subjekt + Prädikat ist ein vollständiger Satz. **الْبَيْتُ كَبِيرٌ.** „Das Haus (ist) groß.“ **أَنَا مُتْعَبٌ.** „Ich (bin) müde.“ Das Subjekt ist meist bestimmt und das Prädikat **unbestimmt** — dieser Unterschied macht es zu einem Satz und nicht zu einer Wortgruppe: **الْبَيْتُ الْكَبِيرُ** ist nur „das große Haus“.

      Das Prädikat richtet sich in Genus und Numerus nach dem Subjekt: **هُوَ طَالِبٌ / هِيَ طَالِبَةٌ**.
    mistakes: ["Mit al- auf beiden ist es eine Wortgruppe, kein Satz.", "Das Prädikat kongruiert: feminines ة."]
  ar-a1-gender:
    meaning: "maskulin und feminin"
    intro: |
      Die meisten femininen Nomen und Adjektive enden auf **ة** (*tā' marbūṭa*, gesprochen *-a*, oder *-at* vor einem weiteren Wort): `طَالِب` / `طَالِبَة` (Student/in), `كَبِير` / `كَبِيرَة` (groß). Einige Feminina haben kein ة: `شَمْس` (Sonne), `أُمّ` (Mutter), `أَرْض` (Erde), `يَد` (Hand), `دَار` (Haus) und die meisten Namen von Städten und Ländern.

      Adjektive und Verben richten sich nach dem Genus.
    mistakes: ["شمس ist feminin ohne ة."]
  ar-a1-demonstratives:
    meaning: "dieser und jener"
    intro: |
      **هٰذَا** (m.) / **هٰذِهِ** (f.) „dieser“, **ذٰلِكَ** (m.) / **تِلْكَ** (f.) „jener“, **هٰؤُلَاءِ** / **أُولٰئِكَ** „diese / jene“ (Personen). Mit einem unbestimmten Nomen bilden sie einen Satz — **هٰذَا كِتَابٌ.** „Das ist ein Buch.“ —, mit einem bestimmten eine Wortgruppe: **هٰذَا الْكِتَابُ** „dieses Buch“.

      Plurale von **Dingen** gelten als feminin Singular: **هٰذِهِ الْكُتُبُ** „diese Bücher“.
    mistakes: ["Plurale von Dingen nehmen den femininen Singular."]
  ar-a1-noun-adj:
    meaning: "Nomen + Adjektiv: volle Kongruenz"
    intro: |
      Das Adjektiv steht **nach** dem Nomen und übernimmt alles: Genus, Numerus, Kasus — und **Bestimmtheit**. **بَيْتٌ كَبِيرٌ** „ein großes Haus“, **الْبَيْتُ الْكَبِيرُ** „das große Haus“. Hat nur das Nomen al-, ist es ein Satz (**الْبَيْتُ كَبِيرٌ** „das Haus ist groß“).
    mistakes: ["Bestimmtes Nomen, bestimmtes Adjektiv."]
  ar-a1-questions:
    meaning: "Fragewörter"
    intro: |
      **هَلْ** macht aus einer Aussage eine Ja/Nein-Frage: **هَلْ أَنْتَ طَالِبٌ؟** Weitere Fragewörter: **مَا** was (vor einem Nomen), **مَاذَا** was (vor einem Verb), **مَنْ** wer, **أَيْنَ** wo, **مَتَى** wann, **كَيْفَ** wie, **لِمَاذَا** warum, **كَمْ** wie viele (+ Akkusativ Singular: **كَمْ كِتَابًا؟**).
    mistakes: ["Vor einem Verb ist *was* ماذا."]
  ar-a1-prepositions:
    meaning: "Präpositionen (und der Genitiv danach)"
    intro: |
      **فِي** in · **عَلَى** auf · **مِنْ** von, aus · **إِلَى** zu, nach · **مَعَ** mit (jemandem) · **عِنْدَ** bei · **عَنْ** über · und zwei, die mit dem nächsten Wort zusammengeschrieben werden: **بِـ** mit, durch, in · **لِـ** für, zu.

      Das Nomen nach einer Präposition steht im **Genitiv** (-i): **فِي الْبَيْتِ** „im Haus“, **مِنْ مِصْرَ** „aus Ägypten“.
    mistakes: ["Genitiv nach einer Präposition."]
  ar-a1-possessive:
    meaning: "mein, dein, sein: Possessivsuffixe"
    intro: |
      *Mein, dein, sein …* sind **Suffixe** am Nomen, das dann kein al- bekommt: **كِتَابِي** „mein Buch“, **كِتَابُكَ** „dein (m.) Buch“, **كِتَابُهَا** „ihr Buch“. Vor einem Suffix wird **ة** zu **ت**: `سَيَّارَة` → **سَيَّارَتِي** „mein Auto“.
    mistakes: ["Ein Nomen mit Suffix ist schon bestimmt: kein al-.", "ة → ت vor einem Suffix."]
  ar-a1-numbers:
    meaning: "Zahlen 1–10"
    intro: |
      Arabische Ziffern (die Europa von hier übernommen hat; heute schreibt man im Arabischen ٠١٢٣٤٥٦٧٨٩) und Wörter: **وَاحِد ١، اِثْنَان ٢، ثَلَاثَة ٣، أَرْبَعَة ٤، خَمْسَة ٥، سِتَّة ٦، سَبْعَة ٧، ثَمَانِيَة ٨، تِسْعَة ٩، عَشَرَة ١٠**. Zahlen werden auch im arabischen Text von links nach rechts geschrieben.

      Eins und zwei folgen dem Nomen als Adjektive (**كِتَابٌ وَاحِدٌ**) oder werden durch den Dual ausgedrückt (**كِتَابَانِ** „zwei Bücher“); ab drei gibt es eine Genus-Umkehrung (B1).
