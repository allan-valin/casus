# Macedonian text of the Arabic course, level A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Letters and sounds: "Букви и гласови"
  Sentences without a verb: "Реченици без глагол"
  Asking: "Прашување"
  Place and possession: "Место и припадност"
  Numbers: "Броеви"
lessons:
  ar-a1-alphabet:
    meaning: "азбуката, знаците за самогласки и слични букви"
    intro: |
      Арапскиот се пишува **од десно кон лево** со 28 букви, од кои повеќето се спојуваат со следната и затоа имаат до четири облици. Се пишуваат само **согласките и долгите самогласки** (ا و ي); **кратките самогласки** се мали знаци — `ـَ` *a*, `ـِ` *i*, `ـُ` *u* — што обичните текстови ги изоставаат, а текстовите за учење, Куранот и детските книги ги ставаат. `ـْ` (сукун) значи без самогласка, `ـّ` (шада) ја удвојува согласката, а `ـٌ ـٍ ـً` (танвин) додаваат *-n* на неопределена именка.

      Casus ги покажува самогласките секаде каде што читачот е сигурен во нив.
    sections:
      notes: |
        | знак | име | глас | пример |
        |---|---|---|---|
        | ـَ | фатха | a | كَتَبَ *kataba* |
        | ـِ | касра | i | بِنْت *bint* |
        | ـُ | дама | u | كُتُب *kutub* |
        | ـْ | сукун | без самогласка | قَلْب *qalb* |
        | ـّ | шада | двојна согласка | مُدَرِّس *mudarris* |
        | ـٌ ـٍ ـً | танвин | -un -in -an | كِتَابٌ *kitābun* |
    mistakes: ["ق е подлабоко к, изговорено во задниот дел на грлото; كلب е *куче*."]
  ar-a1-definite:
    meaning: "членот al- и сончевите букви"
    intro: |
      **ال** (*al-*) е единствениот член и се пишува споено со именката: `بَيْت` „куќа“ → `الْبَيْت` „куќата“. Неопределената именка носи **танвин**: `بَيْتٌ` *baytun*; определената никогаш.

      Пред 14-те **сончеви букви** (ت ث د ذ ر ز س ش ص ض ط ظ ل ن — оние што се изговараат со врвот на јазикот) *l* не се изговара, а буквата се удвојува: `الشَّمْس` *aš-šams* „сонцето“. Пред **месечевите букви** останува: `الْقَمَر` *al-qamar* „месечината“.
    mistakes: ["ش е сончева буква: l се изедначува.", "Нема танвин со al-."]
  ar-a1-pronouns:
    meaning: "лични заменки"
    intro: |
      Арапскиот разликува **машки и женски** род и кај *ти* и *тие*, и има форми за **двојина** за две лица. Во глаголските реченици заменката обично се изостава, бидејќи глаголот го покажува лицето — како во македонскиот; во реченици без глагол е потребна: **أَنَا طَالِبٌ.** „Јас сум студент.“
    mistakes: ["*ти* на жена е anti, со касра."]
  ar-a1-nominal:
    meaning: "именската реченица: нема „сум“ во сегашно време"
    intro: |
      Во сегашно време *сум* не се кажува: подмет + прирок е цела реченица. **الْبَيْتُ كَبِيرٌ.** „Куќата (е) голема.“ **أَنَا مُتْعَبٌ.** „Јас (сум) уморен.“ Подметот обично е определен, а прирокот **неопределен** — таа разлика ја прави реченица, а не израз: **الْبَيْتُ الْكَبِيرُ** е само „големата куќа“.

      Прирокот се согласува со подметот по род и број: **هُوَ طَالِبٌ / هِيَ طَالِبَةٌ**.
    mistakes: ["Со al- на двата збора е израз, не реченица.", "Прирокот се согласува: женско ة."]
  ar-a1-gender:
    meaning: "машки и женски род"
    intro: |
      Повеќето именки и придавки од женски род завршуваат на **ة** (*tā' marbūṭa*, се изговара *-a*, или *-at* пред друг збор): `طَالِب` / `طَالِبَة` (студент/ка), `كَبِير` / `كَبِيرَة` (голем/а). Неколку именки од женски род немаат ة: `شَمْس` (сонце), `أُمّ` (мајка), `أَرْض` (земја), `يَد` (рака), `دَار` (дом) и повеќето имиња на градови и земји.

      Придавките и глаголите се согласуваат по род.
    mistakes: ["شمس е од женски род без ة."]
  ar-a1-demonstratives:
    meaning: "овој и оној"
    intro: |
      **هٰذَا** (м.) / **هٰذِهِ** (ж.) „овој / оваа“, **ذٰلِكَ** (м.) / **تِلْكَ** (ж.) „оној / онаа“, **هٰؤُلَاءِ** / **أُولٰئِكَ** „овие / оние“ (за луѓе). Со неопределена именка прават реченица — **هٰذَا كِتَابٌ.** „Ова е книга.“ — со определена, израз: **هٰذَا الْكِتَابُ** „оваа книга“.

      Множините на **предмети** се сметаат за еднина од женски род: **هٰذِهِ الْكُتُبُ** „овие книги“.
    mistakes: ["Множините на предмети земаат женски род еднина."]
  ar-a1-noun-adj:
    meaning: "именка + придавка: целосно согласување"
    intro: |
      Придавката доаѓа **по** именката и копира сè: род, број, падеж — и **определеност**. **بَيْتٌ كَبِيرٌ** „голема куќа“, **الْبَيْتُ الْكَبِيرُ** „големата куќа“. Ако само именката има al-, тоа е реченица (**الْبَيْتُ كَبِيرٌ** „куќата е голема“).
    mistakes: ["Определена именка, определена придавка."]
  ar-a1-questions:
    meaning: "прашални зборови"
    intro: |
      **هَلْ** ја претвора изјавата во прашање со да/не (како **дали**): **هَلْ أَنْتَ طَالِبٌ؟** Други прашални зборови: **مَا** што (пред именка), **مَاذَا** што (пред глагол), **مَنْ** кој, **أَيْنَ** каде, **مَتَى** кога, **كَيْفَ** како, **لِمَاذَا** зошто, **كَمْ** колку (+ именка во еднина, акузатив: **كَمْ كِتَابًا؟**).
    mistakes: ["Пред глагол, *што* е ماذا."]
  ar-a1-prepositions:
    meaning: "предлози (и генитивот по нив)"
    intro: |
      **فِي** во · **عَلَى** на · **مِنْ** од · **إِلَى** кон, до · **مَعَ** со (некого) · **عِنْدَ** кај · **عَنْ** за (тема) · и два што се пишуваат споено со следниот збор: **بِـ** со, преку, во · **لِـ** за, на.

      Именката по предлог е во **генитив** (-i): **فِي الْبَيْتِ** „во куќата“, **مِنْ مِصْرَ** „од Египет“.
    mistakes: ["Генитив по предлог."]
  ar-a1-possessive:
    meaning: "мој, твој, негов: присвојни наставки"
    intro: |
      *Мој, твој, негов…* се **наставки** на именката, која тогаш нема al- — малку како **мајка ми**: **كِتَابِي** „мојата книга“, **كِتَابُكَ** „твојата (м.) книга“, **كِتَابُهَا** „нејзината книга“. Пред наставка, **ة** станува **ت**: `سَيَّارَة` → **سَيَّارَتِي** „мојата кола“.
    mistakes: ["Именка со наставка е веќе определена: без al-.", "ة → ت пред наставка."]
  ar-a1-numbers:
    meaning: "броеви 1–10"
    intro: |
      Арапски цифри (оние што Европа ги презела потекнуваат оттука; арапскиот денес пишува ٠١٢٣٤٥٦٧٨٩) и зборови: **وَاحِد ١، اِثْنَان ٢، ثَلَاثَة ٣، أَرْبَعَة ٤، خَمْسَة ٥، سِتَّة ٦، سَبْعَة ٧، ثَمَانِيَة ٨، تِسْعَة ٩، عَشَرَة ١٠**. Броевите се пишуваат од лево кон десно и во арапски текст.

      Еден и два стојат по именката како придавки (**كِتَابٌ وَاحِدٌ**) или се изразуваат со двојина (**كِتَابَانِ** „две книги“); од три натаму има обратно согласување по род (B1).
