# Macedonian text of the Arabic course, level B1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The moods of the verb: "Начините на глаголот"
  Cases: "Падежи"
  Verb patterns: "Глаголски обрасци"
  Conditions and numbers: "Услови и броеви"
lessons:
  ar-b1-subjunctive:
    meaning: "субјунктивот по أن، لن، كي، حتى"
    intro: |
      По **أَنْ** „да“, **لَنْ** „нема да“, **كَيْ / لِكَيْ / لِـ** „за да“ и **حَتَّى** „за да, додека“ сегашното време е во **субјунктив**: крајното **-ُ** станува **-َ** (**يَذْهَبُ → أَنْ يَذْهَبَ**), а наставките **-ونَ / -ينَ / -انِ** го губат **ن** (**يَذْهَبُونَ → أَنْ يَذْهَبُوا**).

      **أُرِيدُ أَنْ أَذْهَبَ** е *сакам да одам* — без инфинитив, исто како во македонскиот.
    mistakes: ["-ن од множината паѓа во субјунктивот."]
  ar-b1-jussive:
    meaning: "јусивот по لم и забранското لا"
    intro: |
      **Јусивот** завршува на **сукун** таму каде што индикативот има **-ُ** (**يَذْهَبُ → يَذْهَبْ**) и, како субјунктивот, го губи **ن** од **-ونَ / -ينَ / -انِ**. Доаѓа по **لَمْ** (одречно минато: **لَمْ يَذْهَبْ** „не отиде“), **لَا** во забрани (**لَا تَقْلَقْ** „не грижи се“), **لِـ** „нека…“ (**لِنَذْهَبْ** „ајде да одиме“) и условното **إِنْ**. Шупливите глаголи ја скратуваат самогласката: **يَقُولُ → لَمْ يَقُلْ**.
    mistakes: ["Шупливите глаголи ја губат долгата самогласка пред сукун."]
  ar-b1-irab:
    meaning: "иʿраб: номинатив, акузатив, генитив"
    intro: |
      Именките и придавките имаат три падежа, што ги покажува **последната самогласка** (се пишува само во текстови со самогласки, но се чита на глас во формалниот арапски):

      - **номинатив -ُ / -ٌ**: подметот, прирокот на реченица без глагол
      - **акузатив -َ / -ً**: објектот, по **إِنَّ**, прирокот на **كَانَ**, прилози (**يَوْمًا** „еден ден“)
      - **генитив -ِ / -ٍ**: по предлози, втората именка во идафа

      Неопределениот акузатив додава алиф: **كِتَابًا**. Правилната машка множина има **-ُونَ** / **-ِينَ**, двојината **-َانِ** / **-َيْنِ**.
    mistakes: ["Генитив по في.", "Објектот е во акузатив."]
  ar-b1-inna:
    meaning: "إنّ и нејзините сестри: подметот во акузатив"
    intro: |
      **إِنَّ** „навистина“, **أَنَّ** „дека“, **لَكِنَّ** „но“, **لِأَنَّ** „бидејќи“, **كَأَنَّ** „како да“, **لَيْتَ** „да беше“, **لَعَلَّ** „можеби“ воведуваат именска реченица и нејзиниот подмет го ставаат во **акузатив**; прирокот останува во номинатив: **إِنَّ الْجَوَّ جَمِيلٌ.** „Времето навистина е убаво.“ Заменка-подмет се прикачува: **إِنَّهُ**, **لِأَنَّنِي** (или **لِأَنِّي**).

      Не мешај **أَنَّ** (+ именка) со **أَنْ** (+ глагол).
    mistakes: ["Подметот по إنّ е во акузатив."]
  ar-b1-forms-2-4:
    meaning: "изведени глаголи: форми II, III, IV"
    intro: |
      Од еден корен, **обрасци** градат сродни глаголи. Речниците ги нумерираат со римски броеви:

      - **II فَعَّلَ** (удвоена средна согласка): предизвикува или засилува — **دَرَسَ** учи → **دَرَّسَ** предава; **عَلِمَ** знае → **عَلَّمَ** учи (некого)
      - **III فَاعَلَ** (долго ā): правење некому / со некого — **سَاعَدَ** помага, **شَاهَدَ** гледа, **كَاتَبَ** се допишува
      - **IV أَفْعَلَ** (префикс a-): предизвикува — **أَرْسَلَ** праќа, **أَخْبَرَ** известува, **أَحَبَّ** сака

      Нивното сегашно време почнува со **يُـ** (yu-): **يُدَرِّسُ، يُسَاعِدُ، يُرْسِلُ**.
  ar-b1-forms-5-10:
    meaning: "изведени глаголи: форми V–X"
    intro: |
      - **V تَفَعَّلَ**: повратна од II — **تَعَلَّمَ** учи (се учи), **تَكَلَّمَ** зборува
      - **VI تَفَاعَلَ**: взаемна — **تَعَاوَنَ** соработува, **تَقَابَلَ** се среќаваат
      - **VII اِنْفَعَلَ**: слична на пасив — **اِنْكَسَرَ** се крши, **اِنْقَطَعَ** се прекинува
      - **VIII اِفْتَعَلَ**: — **اِجْتَمَعَ** се состанува, **اِنْتَظَرَ** чека, **اِسْتَمَعَ** слуша
      - **X اِسْتَفْعَلَ**: барање, сметање — **اِسْتَخْدَمَ** користи, **اِسْتَقْبَلَ** прима, **اِسْتَطَاعَ** може

      Кога го знаеш обрасецот, можеш да го погодиш значењето на нов збор од коренот.
  ar-b1-participles:
    meaning: "активни и пасивни партиципи"
    intro: |
      Секој глагол има **активен партицип** (вршителот, или *-јќи*) и **пасивен партицип** (она што е направено): форма I **فَاعِل / مَفْعُول** — **كَاتِب** писател, пишувајќи / **مَكْتُوب** напишан, писмо. Изведените форми користат **مُـ**: **مُدَرِّس** наставник (II), **مُسَاعِد** помошник (III), **مُسْتَخْدَم** користен (X).

      Партиципите служат како именки и придавки и често заменуваат глагол: **أَنَا ذَاهِبٌ** „заминувам“.
  ar-b1-conditional:
    meaning: "ако: إذا (веројатно) и لو (нереално)"
    intro: |
      - **إِذَا** + минато за реален или веројатен услов (минатата форма тука значи *ако некогаш*): **إِذَا جَاءَ أَخْبِرْنِي.** „Ако дојде, кажи ми.“
      - **لَوْ** + минато за **нереален**, со **لَـ** на последицата: **لَوْ كُنْتُ غَنِيًّا لَاشْتَرَيْتُ بَيْتًا.** „Да бев богат, ќе купев куќа.“
      - **إِنْ** + јусив или минато, поформално: **إِنْ تَدْرُسْ تَنْجَحْ.** „Ако учиш, ќе положиш.“
    mistakes: ["إذا зема минато дури и за иднината."]
  ar-b1-number-agreement:
    meaning: "броеви 3–10: обратен род"
    intro: |
      Од три до десет бројот го зема **спротивниот род** на именката во еднина: машка именка добива број **со ة**, женска **без**: **ثَلَاثَةُ كُتُبٍ** „три книги“ (كتاب м.), **ثَلَاثُ بَنَاتٍ** „три девојки“ (بنت ж.). Именката е во **генитив множина**.

      Од 11 до 99 именката е во **акузатив еднина**: **عِشْرُونَ طَالِبًا** „дваесет студенти“.
    mistakes: ["Машка именка, број со ة."]
  ar-b1-become:
    meaning: "стана, сѐ уште: сестрите на كان"
    intro: |
      Како **كَانَ**, овие глаголи земаат подмет во номинатив и прирок во **акузатив**: **أَصْبَحَ / صَارَ** „стана“, **مَا زَالَ / لَا يَزَالُ** „сѐ уште е“, **ظَلَّ** „продолжи да“, **لَيْسَ** „не е“. **أَصْبَحَ الْجَوُّ بَارِدًا.** „Времето стана студено.“ **مَا زِلْتُ أَنْتَظِرُ.** „Сѐ уште чекам.“
