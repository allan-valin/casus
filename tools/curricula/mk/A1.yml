- title: {en: Place, pt: Lugar}
  lessons:
  - id: a1-prepositions
    title: во, на, кај, од, со…
    meaning: {en: "prepositions of place and company", pt: "preposições de lugar e companhia"}
    intro:
      en: |
        Nouns don't change after prepositions (there are no cases), so only the preposition carries the meaning:

        - `во` in, into — **во градот** "in the city"
        - `на` on, at, to (also *of*, and the indirect object) — **на масата** "on the table", **на море** "at the seaside"
        - `кај` at someone's, near — **кај мене** "at my place", **кај Ана** "at Ana's"
        - `од` from, of — **од Скопје** "from Skopje"
        - `до` to, as far as, next to — **до центарот** "to the centre"
        - `со` with — **со пријател** "with a friend"
        - `за` for, about — **за тебе** "for you"
        - `без` without; `под` under; `над` above; `пред` in front of; `зад` behind; `меѓу` between
      pt: |
        O substantivo não muda depois de preposição (não há casos), então só a preposição carrega o sentido:

        - `во` em, dentro — **во градот** "na cidade"
        - `на` sobre, em, a (também *de*, e o objeto indireto) — **на масата** "na mesa", **на море** "na praia"
        - `кај` na casa de, perto — **кај мене** "na minha casa", **кај Ана** "na casa da Ana"
        - `од` de (origem) — **од Скопје** "de Skopje"
        - `до` até, ao lado de — **до центарот** "até o centro"
        - `со` com — **со пријател** "com um amigo"
        - `за` para, sobre — **за тебе** "para você"
        - `без` sem; `под` debaixo; `над` acima; `пред` na frente; `зад` atrás; `меѓу` entre
    sections:
    - id: contrast
      body:
        en: "**во** is *inside* (во училиште, во Скопје), **на** is *at an event or open place* (на работа, на пазар, на концерт). With countries and cities use **во**; with islands, mountains and the sea, **на**."
        pt: "**во** é *dentro* (во училиште, во Скопје), **на** é *num evento ou lugar aberto* (на работа, на пазар, на концерт). Com países e cidades use **во**; com ilhas, montanhas e o mar, **на**."
    mistakes:
    - wrong: Живеам на Скопје.
      right: Живеам во Скопје.
      why: {en: "Cities take во.", pt: "Cidades levam во."}
    - wrong: Одам во работа.
      right: Одам на работа.
      why: {en: "Work, school lessons, the market: на.", pt: "Trabalho, aula, feira: на."}
    examples:
    - [Живеам во Скопје., I live in Skopje., Moro em Skopje., во]
    - [Клучот е на масата., The key is on the table., A chave está na mesa., на]
    - [Вечерва сум кај Ана., Tonight I'm at Ana's., Hoje à noite estou na casa da Ana., кај]
    - [Тој е од Охрид., He is from Ohrid., Ele é de Ohrid., од]
    - [Одам со брат ми., I'm going with my brother., Vou com meu irmão., со]
    match: {seq: [{word: [во, кај, од, до, со, за, без, под, над, пред, зад, меѓу]}, {pos: noun}], near: 1, gap: 0}
    pool: [во, на, кај, од, до, со, за, без, под, над, пред, зад, меѓу]
