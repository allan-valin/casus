    pool: [ми, ти, му, ѝ, ни, ви, им, ме, го]

  - id: a2-possessive-clitics
    title: мајка ми, брат ти
    meaning: {en: "my mother, your brother: short possessives", pt: "minha mãe, teu irmão: possessivos curtos"}
    intro:
      en: |
        With close **family words**, the short indirect pronoun **after** the noun means *my, your, his…*, and the noun takes **no article**: **мајка ми** "my mother", **татко ти** "your father", **сестра му** "his sister", **баба ѝ** "her grandmother". It is the natural way to say it; **мојата мајка** sounds emphatic.

        With other nouns the full possessive is used (**мојата куќа**), though speech also has **куќата ми**.
      pt: |
        Com **palavras de família** próximas, o pronome indireto curto **depois** do substantivo significa *meu, teu, dele…*, e o substantivo fica **sem artigo**: **мајка ми** "minha mãe", **татко ти** "teu pai", **сестра му** "a irmã dele", **баба ѝ** "a avó dela". É o jeito natural; **мојата мајка** soa enfático.

        Com outros substantivos se usa o possessivo completo (**мојата куќа**), embora a fala também tenha **куќата ми**.
    table:
      head: {en: [Short, Meaning], pt: [Curto, Significado]}
      rows:
      - [мајка ми, my mother / minha mãe]
      - [татко ти, your father / teu pai]
      - [брат му, his brother / o irmão dele]
      - [сестра ѝ, her sister / a irmã dela]
      - [баба ни, our grandmother / nossa avó]
      - [дедо им, their grandfather / o avô deles]
    mistakes:
    - wrong: мајката ми
      right: мајка ми
      why: {en: "No article with the short possessive on family words.", pt: "Sem artigo com o possessivo curto em palavras de família."}
    examples:
    - [Мајка ми е учителка., My mother is a teacher., Minha mãe é professora., ми]
    - ["Каде работи татко ти?", "Where does your father work?", "Onde o seu pai trabalha?", "ти"]
    - [Брат му живее во Германија., His brother lives in Germany., O irmão dele mora na Alemanha., му]
    match: {seq: [{word: [мајка, татко, брат, сестра, баба, дедо, син, ќерка, сопруга, сопруг, маж, жена, тетка, чичко, вујко, внук, внука, братучед, братучетка]}, {word: [ми, ти, му, ѝ, ни, ви, им]}], gap: 1}
    pool: [ми, ти, му, ѝ, ни, ви, им]

- title: {en: Reflexive verbs, pt: Verbos reflexivos}
  lessons:
  - id: a2-reflexive
    title: се, си
    meaning: {en: "oneself: се and си", pt: "se: се e си"}
    intro:
      en: |
        `се` is the reflexive *oneself* (direct): **Се мијам.** "I wash (myself)." Many verbs simply always have it: **се вика** "is called" (**Како се викаш?** "What's your name?"), **се смее** "laughs", **се плаши** "is afraid", **се враќа** "returns".

        `си` is the reflexive *for oneself* (indirect): **Си ги мијам рацете.** "I wash my hands." It also makes "go off": **Си одам.** "I'm off (home)." Both stand where other short pronouns stand.
      pt: |
        `се` é o reflexivo direto *se*: **Се мијам.** "Eu me lavo." Muitos verbos sempre o têm: **се вика** "chama-se" (**Како се викаш?** "Como você se chama?"), **се смее** "ri", **се плаши** "tem medo", **се враќа** "volta".

        `си` é o reflexivo indireto *para si*: **Си ги мијам рацете.** "Lavo as minhas mãos." Também dá o sentido de "ir-se": **Си одам.** "Vou embora (para casa)." Os dois ficam onde ficam os outros pronomes curtos.
    table:
      head: {en: [Verb, Example, Meaning], pt: [Verbo, Exemplo, Significado]}
      rows:
      - [се вика, Се викам Ана., My name is Ana / Me chamo Ana]
      - ["се смее", "Зошто се смееш?", "Why are you laughing? / Por que você está rindo?"]
      - [се плаши, Се плашам од кучиња., I'm afraid of dogs / Tenho medo de cachorro]
      - ["се враќа", "Кога се враќаш?", "When are you coming back? / Quando você volta?"]
      - [си мие, Си ги мијам рацете., I wash my hands / Lavo as mãos]
    mistakes:
    - wrong: Викам Ана.
      right: Се викам Ана.
      why: {en: "Without се it means *I shout Ana*.", pt: "Sem се significa *grito Ana*."}
    examples:
    - [Се викам Марија., My name is Marija., Me chamo Marija., Се]
    - [Се плашам од темнина., I'm afraid of the dark., Tenho medo do escuro., Се]
    - ["Кога се враќаш дома?", "When are you coming home?", "Quando você volta para casa?", "се"]
    - [Си ги мијам рацете., I'm washing my hands., Estou lavando as mãos., Си]
    match: {seq: [{word: [се, си]}, {pos: verb, number: sg, person: ["1", "2"]}], near: 1, gap: 0}
    pool: [се, си, ме, ми, го]

- title: {en: Comparing, pt: Comparando}
  lessons:
  - id: a2-comparison
    title: по-голем, најголем
    meaning: {en: "comparative and superlative", pt: "comparativo e superlativo"}
    intro:
      en: |
        Comparison is regular: **по-** for *more* and **нај-** for *most*, on adjectives and adverbs alike — `голем` → **по-голем** "bigger" → **најголем** "biggest"; `добро` → **по-добро** → **најдобро**. *Than* is **од**: **Таа е по-висока од мене.**

        Spelling: **по-** with a hyphen, **нај-** joined to the word.
      pt: |
        A comparação é regular: **по-** para *mais* e **нај-** para *o mais*, em adjetivos e advérbios — `голем` → **по-голем** "maior" → **најголем** "o maior"; `добро` → **по-добро** → **најдобро**. *Do que* é **од**: **Таа е по-висока од мене.**

        Ortografia: **по-** com hífen, **нај-** junto à palavra.
    table:
      head: {en: [Base, More, Most], pt: [Base, Mais, O mais]}
      rows:
      - [голем, по-голем, најголем]
      - [мал, по-мал, најмал]
      - [добар, по-добар, најдобар]
      - [убаво, по-убаво, најубаво]
      - [многу, повеќе, најмногу]
    mistakes:
    - wrong: Тој е повисок како мене.
      right: Тој е по-висок од мене.
      why: {en: "*than* is од; по- with a hyphen.", pt: "*do que* é од; по- com hífen."}
    - wrong: по-многу
      right: повеќе
      why: {en: "*more* of многу is irregular.", pt: "*mais* de многу é irregular."}
    examples:
    - [Таа е по-висока од мене., She is taller than me., Ela é mais alta que eu., по-висока]
    - [Ова е најдобриот ресторан во градот., This is the best restaurant in town., Este é o melhor restaurante da cidade., најдобриот]
    - [Денес е по-топло., It's warmer today., Hoje está mais quente., по-топло]
    - ["Кој е најстар?", "Who is the oldest?", "Quem é o mais velho?", "најстар"]
    # нај- only on adjectives and adverbs (најдов "I found" is not a superlative)
    match: [{seq: [{re: "^по-[а-шѓќѕљњџј]{3,}"}]}, {seq: [{re: "^нај", pos: [adj, adv]}]}]
    prefixes: ["", по-, нај]

- title: {en: The past, pt: O passado}
  lessons:
  - id: a2-sum-past
    title: бев, беше
    meaning: {en: "was, were: the past of сум", pt: "era, estava: o passado de сум"}
    intro:
      en: |
        The past of `сум` is **бев, беше, беше, бевме, бевте, беа**: **Бев дома.** "I was at home." **Каде беше?** "Where were you?" Like `сум`, it does not start the sentence in neutral speech: **Болен бев.** or **Јас бев болен.**
      pt: |
        O passado de `сум` é **бев, беше, беше, бевме, бевте, беа**: **Бев дома.** "Eu estava em casa." **Каде беше?** "Onde você estava?" Serve para *era* e *estava*.
    table:
      head: {en: [Person, Present, Past], pt: [Pessoa, Presente, Passado]}
      rows:
      - [јас, сум, бев]
      - [ти, си, беше]
      - [тој / таа / тоа, е, беше]
      - [ние, сме, бевме]
      - [вие, сте, бевте]
      - [тие, се, беа]
    mistakes:
    - wrong: Ние беше таму.
      right: Ние бевме таму.
      why: {en: "We takes бевме.", pt: "Nós leva бевме."}
    examples:
    - [Вчера бев болен., I was ill yesterday., Ontem eu estava doente., бев]
    - ["Каде беше синоќа?", "Where were you last night?", "Onde você estava ontem à noite?", "беше"]
    - [Бевме во Струга., We were in Struga., Estávamos em Struga., Бевме]
    - [Тие беа многу среќни., They were very happy., Eles estavam muito felizes., беа]
    match: {seq: [{word: [бев, беше, бевме, бевте, беа]}]}
