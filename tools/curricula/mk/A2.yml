id: A2
topics:

- title: {en: The future and wanting, pt: O futuro e o querer}
  lessons:
  - id: a2-future
    title: ќе + present
    meaning: {en: "the future: I will…", pt: "o futuro: eu vou…"}
    intro:
      en: |
        The future is the particle `ќе` + the **present tense** forms: **Ќе одам.** "I'll go." `ќе` never changes; the verb shows the person.

        Short object pronouns go **between** `ќе` and the verb: **Ќе го видам.** "I'll see him."
      pt: |
        O futuro é a partícula `ќе` + as formas do **presente**: **Ќе одам.** "Vou (irei)." `ќе` não muda; o verbo mostra a pessoa.

        Os pronomes objeto curtos ficam **entre** `ќе` e o verbo: **Ќе го видам.** "Vou vê-lo."
    table:
      head: {en: [Person, Future, Meaning], pt: [Pessoa, Futuro, Significado]}
      rows:
      - [јас, ќе одам, I'll go / vou]
      - [ти, ќе одиш, you'll go / você vai]
      - [тој / таа, ќе оди, he / she will go]
      - [ние, ќе одиме, we'll go / vamos]
      - [вие, ќе одите, you'll go / vocês vão]
      - [тие, ќе одат, they'll go / eles vão]
    sections:
    - id: usage
      body:
        en: |
          - After `ќе` a **perfective** verb is normal for one completed action (**Ќе ти кажам.** "I'll tell you."), an imperfective one for an ongoing or repeated action (**Ќе ти пишувам секој ден.** "I'll write to you every day.").
          - `ќе` also gives a guess about the present: **Ќе е дома.** "He must be at home."
        pt: |
          - Depois de `ќе`, um verbo **perfectivo** é o normal para uma ação concluída (**Ќе ти кажам.** "Vou te contar."), um imperfectivo para uma ação em curso ou repetida (**Ќе ти пишувам секој ден.** "Vou te escrever todo dia.").
          - `ќе` também faz uma suposição sobre o presente: **Ќе е дома.** "Deve estar em casa."
    mistakes:
    - wrong: Го ќе видам.
      right: Ќе го видам.
      why: {en: "ќе comes first, then the short pronoun, then the verb.", pt: "Primeiro ќе, depois o pronome curto, depois o verbo."}
    - wrong: Ќе одеше утре.
      right: Ќе оди утре.
      why: {en: "ќе + present for the future (ќе + imperfect means *would*, B1).", pt: "ќе + presente para o futuro (ќе + imperfeito é *iria*, B1)."}
    examples:
    - [Утре ќе одам во Охрид., Tomorrow I'll go to Ohrid., Amanhã vou a Ohrid., одам]
    - [Ќе ти се јавам вечерва., I'll call you tonight., Vou te ligar hoje à noite., јавам]
    - ["Што ќе правиш викендов?", "What will you do this weekend?", "O que você vai fazer neste fim de semana?", "правиш"]
    - [Ќе врне дожд., It's going to rain., Vai chover., врне]
    match: {seq: [{word: [ќе]}, {pos: verb, tense: pres}], near: 2, gap: 1, same: [tense]}

  - id: a2-future-neg
    title: нема да
    meaning: {en: "the negative future: I won't…", pt: "o futuro negativo: não vou…"}
    intro:
      en: |
        The negative of `ќе` is **нема да** + present: **Нема да одам.** "I won't go." (Also heard: **Не ќе одам**, which is older and more literary.)
      pt: |
        A negação de `ќе` é **нема да** + presente: **Нема да одам.** "Não vou." (Também existe **Не ќе одам**, mais antigo e literário.)
    table:
      head: {en: [Positive, Negative], pt: [Afirmativa, Negativa]}
      rows:
      - [Ќе дојдам., Нема да дојдам.]
      - [Ќе го купам., Нема да го купам.]
      - [Ќе врне., Нема да врне.]
    mistakes:
    - wrong: Не ќе да дојдам.
      right: Нема да дојдам.
      why: {en: "Either нема да or не ќе — never both.", pt: "Ou нема да ou не ќе — nunca os dois."}
    examples:
    - [Нема да те заборавам., I won't forget you., Não vou te esquecer., Нема]
    - [Таа нема да дојде., She won't come., Ela não vai vir., нема]
    - [Нема да кажам никому., I won't tell anyone., Não vou contar para ninguém., Нема]
    match: {seq: [{word: [нема]}, {word: [да]}, {pos: verb, tense: pres}], near: 2, gap: 0}
    pool: [нема, не, ќе, ни]

  - id: a2-da
    title: сакам да, можам да, треба да
    meaning: {en: "want to, can, must: да + present", pt: "querer, poder, dever: да + presente"}
    intro:
      en: |
        With no infinitive, Macedonian says *I want to go* as "I want **that I go**": **Сакам да одам.** Both verbs take the person: **Сакаш да одиш.** "You want to go."

        The same pattern follows `може` (can), `мора` (must), `треба` (should, needs to), `почнува` (begins), `знае` (knows how). `треба` and often `мора` stay in the 3rd person: **Треба да учам.** "I need to study."
      pt: |
        Sem infinitivo, o macedônio diz *quero ir* como "quero **que eu vá**": **Сакам да одам.** Os dois verbos levam a pessoa: **Сакаш да одиш.** "Você quer ir."

        O mesmo vale para `може` (poder), `мора` (ter que), `треба` (dever, precisar), `почнува` (começar), `знае` (saber fazer). `треба` e muitas vezes `мора` ficam na 3ª pessoa: **Треба да учам.** "Preciso estudar."
    table:
      head: {en: [Verb, + да + present, Meaning], pt: [Verbo, + да + presente, Significado]}
      rows:
      - [сакам, сакам да спијам, I want to sleep / quero dormir]
      - [можам, можам да пливам, I can swim / sei nadar]
      - [треба, треба да одам, I need to go / preciso ir]
      - [мора, мора да работиш, you must work / você tem que trabalhar]
      - [знам, знам да возам, I can drive / sei dirigir]
    mistakes:
    - wrong: Сакам да одиш.
      right: Сакам да одам.
      why: {en: "*I want to go*: both verbs in the 1st person. (Сакам да одиш is *I want you to go*.)", pt: "*Quero ir*: os dois verbos na 1ª pessoa. (Сакам да одиш é *quero que você vá*.)"}
    - wrong: Можам одам.
      right: Можам да одам.
      why: {en: "да is required between the two verbs.", pt: "да é obrigatório entre os dois verbos."}
    examples:
    - [Сакам да спијам., I want to sleep., Quero dormir., спијам]
    - [Треба да учиш повеќе., You need to study more., Você precisa estudar mais., учиш]
    - ["Можеш ли да ми помогнеш?", "Can you help me?", "Você pode me ajudar?", "помогнеш"]
    - [Мора да заминам., I have to leave., Tenho que ir embora., заминам]
    match: {seq: [{word: [сакам, сакаш, сака, сакаме, сакате, сакаат, можам, можеш, може, можеме, можете, можат, треба, мора, морам, мораш, мораме, морате, морат]}, {word: [да]}, {pos: verb, tense: pres}], near: 2, gap: 2, same: [tense]}

  - id: a2-aspect
    title: прочита / чита
    meaning: {en: "aspect: perfective and imperfective", pt: "aspecto: perfectivo e imperfectivo"}
    intro:
      en: |
        Almost every verb comes in a **pair**: an **imperfective** verb for an action seen as ongoing, repeated or in general, and a **perfective** one for a single action seen as a whole, completed.

        - `чита` / `прочита` read · `пишува` / `напише` write · `купува` / `купи` buy · `кажува` / `каже` tell · `доаѓа` / `дојде` come · `враќа` / `врати` return

        The key rule: a **perfective verb cannot be used alone in the present**, because the present is ongoing. It appears after **ќе, да, ако, кога** (future, wishes, conditions) — **Ќе ја прочитам.** "I'll read it (through)." — but for *now* only the imperfective: **Ја читам.** "I'm reading it."
      pt: |
        Quase todo verbo vem em **par**: um **imperfectivo**, para a ação vista em curso, repetida ou em geral, e um **perfectivo**, para uma ação única vista como um todo, concluída.

        - `чита` / `прочита` ler · `пишува` / `напише` escrever · `купува` / `купи` comprar · `кажува` / `каже` dizer · `доаѓа` / `дојде` vir · `враќа` / `врати` devolver, voltar

        A regra-chave: um **verbo perfectivo não pode ficar sozinho no presente**, porque o presente está em curso. Ele aparece depois de **ќе, да, ако, кога** (futuro, desejo, condição) — **Ќе ја прочитам.** "Vou lê-lo (até o fim)." — mas para *agora* só o imperfectivo: **Ја читам.** "Estou lendo."
    table:
      head: {en: [Imperfective, Perfective, How the pair is made], pt: [Imperfectivo, Perfectivo, Como o par se forma]}
      rows:
      - [чита, прочита, "prefix / prefixo"]
      - [пишува, напише, "-ува / prefix"]
      - [кажува, каже, "-ува"]
      - [купува, купи, "-ува"]
      - [враќа, врати, "vowel/consonant / vogal e consoante"]
      - [слуша, слушне, "-не"]
      - [зема, земе, "а → е"]
    mistakes:
    - wrong: Сега ја прочитам книгата.
      right: Сега ја читам книгата.
      why: {en: "Right now = imperfective.", pt: "Agora mesmo = imperfectivo."}
    - wrong: Ќе ти пишувам писмо утре (for one letter, done).
      right: Ќе ти напишам писмо утре.
      why: {en: "One whole action in the future = perfective.", pt: "Uma ação inteira no futuro = perfectivo."}
    examples:
    - [Сега читам весник., I'm reading a newspaper now., Estou lendo o jornal agora., читам]
    - [Ќе го прочитам утре., I'll read it tomorrow., Vou ler amanhã., прочитам]
    - [Сакам да ти кажам нешто., I want to tell you something., Quero te dizer uma coisa., кажам]
    - [Секој ден купувам леб., I buy bread every day., Compro pão todo dia., купувам]
    match: {seq: [{word: [ќе, да, ако]}, {pos: verb, tense: pres, aspect: pf}], near: 2, gap: 1, same: [tense]}

- title: {en: Commands, pt: Ordens e pedidos}
  lessons:
  - id: a2-imperative
    title: читај! одете!
    meaning: {en: "the imperative", pt: "o imperativo"}
    intro:
      en: |
        The imperative is made from the present stem:

        - after a **vowel** (а-verbs, and е/и-verbs whose stem ends in a vowel): **-ј** / **-јте** — `чита` → **читај, читајте**; `пие` → **пиј, пијте**
        - after a **consonant**: **-и** / **-ете** — `оди` → **оди, одете**; `јаде` → **јади, јадете**; `дојде` → **дојди, дојдете**

        Short pronouns come **after** the imperative: **Дај ми го!** "Give it to me!" A polite request often uses the plural or **Ве молам** "please". For *don't*: **не** + imperfective imperative (**Не пушете!**), or **немој / немојте да** + present (**Немој да плачеш.** "Don't cry.").
      pt: |
        O imperativo se forma a partir do radical do presente:

        - depois de **vogal** (verbos em -а, e verbos em -е/-и com radical em vogal): **-ј** / **-јте** — `чита` → **читај, читајте**; `пие` → **пиј, пијте**
        - depois de **consoante**: **-и** / **-ете** — `оди` → **оди, одете**; `јаде` → **јади, јадете**; `дојде` → **дојди, дојдете**

        Os pronomes curtos vêm **depois** do imperativo: **Дај ми го!** "Me dá isso!" Um pedido educado usa o plural ou **Ве молам** "por favor". Para *não*: **не** + imperativo imperfectivo (**Не пушете!**), ou **немој / немојте да** + presente (**Немој да плачеш.** "Não chore.").
    table:
      head: {en: [Verb, ти, вие], pt: [Verbo, ти, вие]}
      rows:
      - [чита, читај, читајте]
      - [гледа, гледај, гледајте]
      - [пие, пиј, пијте]
      - [оди, оди, одете]
      - [јаде, јади, јадете]
      - [дојде, дојди, дојдете]
      - [седне, седни, седнете]
      - ["даде (irregular)", дај, дајте]
    mistakes:
    - wrong: Ми дај го!
      right: Дај ми го!
      why: {en: "After an imperative the pronouns follow it.", pt: "Com imperativo, os pronomes vêm depois."}
    - wrong: Не дојди!
      right: Немој да доаѓаш! / Не доаѓај!
      why: {en: "Negative commands use the imperfective.", pt: "Ordem negativa usa o imperfectivo."}
    examples:
    - [Седни тука., Sit here., Sente aqui., Седни]
    - [Дојдете утре., Come tomorrow., Venham amanhã., Дојдете]
    - [Читај гласно!, Read aloud!, Leia em voz alta!, Читај]
    - [Немој да плачеш., Don't cry., Não chore.]
    # wrong answers: the same verb's present forms (читаш, читате for читај, читајте)
    match: {seq: [{pos: verb, tense: imp}]}

- title: {en: Short pronouns, pt: Pronomes curtos}
  lessons:
  - id: a2-direct-clitics
    title: ме, те, го, ја…
    meaning: {en: "object pronouns: me, you, him, her…", pt: "pronomes objeto: me, te, o, a…"}
    intro:
      en: |
        Direct object pronouns are short words that stand **right before the verb** (after `не`, `ќе`, `да`): **Те сакам.** "I love you." **Не го знам.** "I don't know him/it."

        `го` is *him* and *it* (masc. and neuter), `ја` is *her* and *it* (fem.), `ги` is *them*.
      pt: |
        Os pronomes objeto direto são palavras curtas que ficam **logo antes do verbo** (depois de `не`, `ќе`, `да`): **Те сакам.** "Te amo." **Не го знам.** "Não o conheço / não sei."

        `го` é *o* (masc. e neutro), `ја` é *a* (fem.), `ги` é *os, as*.
    table:
      head: {en: [Person, Short form, Example], pt: [Pessoa, Forma curta, Exemplo]}
      rows:
      - ["јас", "ме", "Ме гледаш?"]
      - [ти, те, Те сакам.]
      - [тој / тоа, го, Го знам.]
      - [таа, ја, Ја видов.]
      - [ние, не, Не чекаат.]
      - [вие, ве, Ве молам.]
      - [тие, ги, Ги купив.]
    sections:
    - id: notes
      body:
        en: "`не` is both *us* and *not*: **Не не гледаат.** \"They don't see us.\" The first is *not*."
        pt: "`не` é ao mesmo tempo *nos* e *não*: **Не не гледаат.** \"Eles não nos veem.\" O primeiro é *não*."
    mistakes:
    - wrong: Сакам те.
      right: Те сакам.
      why: {en: "The short pronoun goes before a finite verb.", pt: "O pronome curto vai antes do verbo conjugado."}
    examples:
    - [Те сакам., I love you., Te amo., Те]
    - [Не го знам., I don't know him., Não o conheço., го]
    - [Ја видов вчера., I saw her yesterday., Eu a vi ontem., Ја]
    - [Ги купив сите., I bought them all., Comprei todos., Ги]
    match: {seq: [{word: [ме, те, го, ја, ве, ги], pos: pron}, {pos: verb}], near: 1, gap: 0}
    pool: [ме, те, го, ја, не, ве, ги, ми, му, ѝ]

  - id: a2-indirect-clitics
    title: ми, ти, му, ѝ…
    meaning: {en: "indirect object pronouns: to me, to him…", pt: "objeto indireto: me, lhe…"}
    intro:
      en: |
        The indirect object (*to me, for him*) has its own short forms, also before the verb: **Ми рече.** "He told me." **Му дадов книга.** "I gave him a book."

        Note `ѝ` (*to her*) with its accent mark, which tells it apart from `и` "and".
      pt: |
        O objeto indireto (*a mim, para ele*) tem suas próprias formas curtas, também antes do verbo: **Ми рече.** "Ele me disse." **Му дадов книга.** "Dei-lhe um livro."

        Repare em `ѝ` (*a ela*) com o acento, que o distingue de `и` "e".
    table:
      head: {en: [Person, Direct, Indirect], pt: [Pessoa, Direto, Indireto]}
      rows:
      - [јас, ме, ми]
      - [ти, те, ти]
      - [тој / тоа, го, му]
      - [таа, ја, ѝ]
      - [ние, не, ни]
      - [вие, ве, ви]
      - [тие, ги, им]
    mistakes:
    - wrong: Го реков.
      right: Му реков.
      why: {en: "*I told him*: telling is *to* someone, indirect.", pt: "*Eu lhe disse*: dizer é *a* alguém, indireto."}
    - wrong: Дадов и книга.
      right: Ѝ дадов книга.
      why: {en: "*to her* is ѝ, with the mark, before the verb.", pt: "*a ela* é ѝ, com o acento, antes do verbo."}
    examples:
    - [Ми рече да чекам., He told me to wait., Ele me disse para esperar., Ми]
    - [Му пишав писмо., I wrote him a letter., Escrevi-lhe uma carta., Му]
    - ["Што ти кажа?", "What did she tell you?", "O que ela te disse?", "ти"]
    - [Им се јавив., I called them., Liguei para eles., Им]
    match: {seq: [{word: [ми, му, ѝ, ни, ви, им]}, {pos: verb}], near: 1, gap: 0}
    pool: [ми, ти, му, ѝ, ни, ви, им, ме, го, ја]

  - id: a2-clitic-pairs
    title: ми го, му ја
    meaning: {en: "two short pronouns together", pt: "dois pronomes curtos juntos"}
    intro:
      en: |
        When both objects are short pronouns, the order is fixed: **indirect + direct + verb** — **Ми го даде.** "He gave it to me." With `не` and `ќе` in front: **Не ми го даде.** · **Ќе ти ја донесам.**

        After an imperative the whole group follows the verb: **Дај ми го!** · **Кажи ми ја вистината!**
      pt: |
        Quando os dois objetos são pronomes curtos, a ordem é fixa: **indireto + direto + verbo** — **Ми го даде.** "Ele me deu (isso)." Com `не` e `ќе` na frente: **Не ми го даде.** · **Ќе ти ја донесам.**

        Depois do imperativo, o grupo inteiro vem atrás do verbo: **Дај ми го!** · **Кажи ми ја вистината!**
    table:
      head: {en: ["", го, ја, ги], pt: ["", го, ја, ги]}
      rows:
      - [ми, ми го, ми ја, ми ги]
      - [ти, ти го, ти ја, ти ги]
      - [му, му го, му ја, му ги]
      - [ѝ, ѝ го, ѝ ја, ѝ ги]
      - [им, им го, им ја, им ги]
    mistakes:
    - wrong: Го ми даде.
      right: Ми го даде.
      why: {en: "Indirect first.", pt: "Indireto primeiro."}
    examples:
    - [Ми го даде клучот., He gave me the key., Ele me deu a chave., го]
    - [Ќе ти ја донесам утре., I'll bring it to you tomorrow., Vou te trazer amanhã., ја]
    - [Дај ми го!, Give it to me!, Me dá isso!, го]
    - ["Кој ти ги кажа тие работи?", "Who told you those things?", "Quem te disse essas coisas?", "ги"]
    match: {seq: [{word: [ми, ти, му, ѝ, ни, ви, им]}, {word: [го, ја, ги]}], gap: 1}
    pool: [го, ја, ги, ме, те, ве]

  - id: a2-doubling
    title: Го видов Марко.
    meaning: {en: "object doubling", pt: "duplicação do objeto"}
    intro:
      en: |
        A striking feature: a **definite direct object** is announced by a short pronoun as well — **Го видов Марко.** literally "I saw *him* Marko". **Ја прочитав книгата.** "I read the book." Without the article (*a book*) there is no doubling: **Прочитав книга.**

        An **indirect object** with `на` is always doubled: **Му реков на Марко.** "I told Marko." **Им дадов на децата.** "I gave (it) to the children."
      pt: |
        Uma característica marcante: um **objeto direto definido** é anunciado também por um pronome curto — **Го видов Марко.** literalmente "o vi o Marko". **Ја прочитав книгата.** "Li o livro." Sem artigo (*um livro*) não há duplicação: **Прочитав книга.**

        Um **objeto indireto** com `на` é sempre duplicado: **Му реков на Марко.** "Disse ao Marko." **Им дадов на децата.** "Dei às crianças." (Parecido com o espanhol *le dije a Marco*.)
    table:
      head: {en: [Object, Doubled, Meaning], pt: [Objeto, Duplicado, Significado]}
      rows:
      - [{"en": "Марко (name)", "pt": "Марко (nome)"}, "Го видов Марко.", {"en": "I saw Marko", "pt": "vi o Marko"}]
      - [{"en": "книгата (the book)", "pt": "книгата (o livro)"}, "Ја читам книгата.", {"en": "I'm reading the book", "pt": "estou lendo o livro"}]
      - [{"en": "книга (a book)", "pt": "книга (um livro)"}, {"en": "Читам книга. (no doubling)", "pt": "Читам книга. (sem duplicação)"}, {"en": "I'm reading a book", "pt": "estou lendo um livro"}]
      - ["на Ана", "Ѝ реков на Ана.", {"en": "I told Ana", "pt": "eu disse à Ana"}]
      - ["на децата", "Им купив на децата.", {"en": "I bought (it) for the children", "pt": "comprei para as crianças"}]
    mistakes:
    - wrong: Видов Марко.
      right: Го видов Марко.
      why: {en: "Names and nouns with the article are definite: double them.", pt: "Nomes e substantivos com artigo são definidos: duplique."}
    - wrong: Реков на Ана.
      right: Ѝ реков на Ана.
      why: {en: "на + person always comes with its short pronoun.", pt: "на + pessoa sempre vem com o pronome curto."}
    examples:
    - [Го видов Марко во градот., I saw Marko in town., Vi o Marko na cidade., Го]
    - [Ја изгубив торбата., I lost the bag., Perdi a bolsa., Ја]
    - [Му реков на Том., I told Tom., Eu disse ao Tom., Му]
    - [Ги чекам децата., I'm waiting for the children., Estou esperando as crianças., Ги]
