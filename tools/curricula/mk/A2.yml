  - id: a2-long-pronouns
    title: мене, тебе, него, неа…
    meaning: {en: "the long (stressed) pronouns", pt: "os pronomes longos (tônicos)"}
    intro:
      en: |
        Each short pronoun has a **long form** used after prepositions — **со мене** "with me", **за неа** "for her", **кај нив** "at their place" — and for emphasis. When used as an object for emphasis, the short one stays too: **Мене ме бараат, не тебе.** "It's *me* they're looking for, not you."
      pt: |
        Cada pronome curto tem uma **forma longa**, usada depois de preposições — **со мене** "comigo", **за неа** "para ela", **кај нив** "na casa deles" — e para dar ênfase. Como objeto enfático, o curto continua: **Мене ме бараат, не тебе.** "É a *mim* que procuram, não a você."
    table:
      head: {en: [Person, Long, After a preposition], pt: [Pessoa, Longa, Depois de preposição]}
      rows:
      - [јас, мене, со мене]
      - [ти, тебе, за тебе]
      - [тој / тоа, него, од него]
      - [таа, неа, со неа]
      - [ние, нас, кај нас]
      - [вие, вас, за вас]
      - [тие, нив, без нив]
    mistakes:
    - wrong: со ме
      right: со мене
      why: {en: "After a preposition only the long form.", pt: "Depois de preposição só a forma longa."}
    - wrong: со јас
      right: со мене
      why: {en: "јас is only the subject.", pt: "јас é só sujeito."}
    examples:
    - [Дојди со мене., Come with me., Venha comigo., мене]
    - [Ова е за тебе., This is for you., Isto é para você., тебе]
    - [Не можам без неа., I can't do without her., Não consigo sem ela., неа]
    - ["Вечерва сте кај нас?", "Are you at our place tonight?", "Hoje à noite vocês vêm à nossa casa?", "нас"]
    match: {seq: [{word: [со, за, од, кај, без, до, на, пред, зад, меѓу, околу, кон, преку]}, {word: [мене, тебе, него, неа, нас, вас, нив]}], gap: 1}
    pool: [мене, тебе, него, неа, нас, вас, нив, ме, јас]

  - id: a2-dopagja
    title: ми се допаѓа
    meaning: {en: "I like (it pleases me)", pt: "eu gosto (me agrada)"}
    intro:
      en: |
        *I like* is said the other way round, like Portuguese *agrada-me*: **Ми се допаѓа Охрид.** "Ohrid pleases me." The thing liked is the subject, so the verb agrees with it: **Ми се допаѓаат цвеќињата.** "I like the flowers."

        The same frame: **ми треба** "I need" (it is necessary to me), **ми е студено** "I'm cold", **ми е жал** "I'm sorry", **ми се спие** "I'm sleepy".
      pt: |
        *Gostar* se diz ao contrário, como *agrada-me* ou o espanhol *me gusta*: **Ми се допаѓа Охрид.** "Ohrid me agrada." A coisa é o sujeito, e o verbo concorda com ela: **Ми се допаѓаат цвеќињата.** "Gosto das flores."

        A mesma construção: **ми треба** "preciso de", **ми е студено** "estou com frio", **ми е жал** "sinto muito", **ми се спие** "estou com sono".
    table:
      head: {en: [Person, I like it, I like them], pt: [Pessoa, gosto disso, gosto deles]}
      rows:
      - [јас, ми се допаѓа, ми се допаѓаат]
      - [ти, ти се допаѓа, ти се допаѓаат]
      - [тој, му се допаѓа, му се допаѓаат]
      - [таа, ѝ се допаѓа, ѝ се допаѓаат]
      - [тие, им се допаѓа, им се допаѓаат]
    mistakes:
    - wrong: Јас допаѓам Охрид.
      right: Ми се допаѓа Охрид.
      why: {en: "The liker is the indirect object.", pt: "Quem gosta é o objeto indireto."}
    - wrong: Ми се допаѓа цвеќињата.
      right: Ми се допаѓаат цвеќињата.
      why: {en: "Plural subject, plural verb.", pt: "Sujeito plural, verbo plural."}
    examples:
    - [Ми се допаѓа оваа песна., I like this song., Gosto desta música., Ми]
    - ["Дали ти се допаѓа?", "Do you like it?", "Você gosta?", "ти"]
    - [Ми треба помош., I need help., Preciso de ajuda., Ми]
    - [Ми е студено., I'm cold., Estou com frio., Ми]
