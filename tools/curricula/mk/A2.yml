  - id: a2-aorist
    title: дојдов, купив, прочитав
    meaning: {en: "the aorist: what happened (once, done)", pt: "o aoristo: o que aconteceu (uma vez, concluído)"}
    intro:
      en: |
        The **aorist** tells what happened at a moment the speaker witnessed or vouches for — the usual tense for completed events: **Вчера купив кола.** "Yesterday I bought a car." It is made mostly from **perfective** verbs.

        Endings: **-в, —, —, -вме, -вте, -а** after the stem vowel — а-verbs keep **а** (прочитав), и-verbs keep **и** (купив), е-verbs mostly change to **о** in the 1st person and plural (дојдов, дојде, дојдовме, дојдоа).
      pt: |
        O **aoristo** conta o que aconteceu num momento que quem fala testemunhou ou garante — o tempo normal para fatos concluídos: **Вчера купив кола.** "Ontem comprei um carro." Forma-se sobretudo com verbos **perfectivos**. É o nosso pretérito perfeito: *comprei, vim, li*.

        Terminações: **-в, —, —, -вме, -вте, -а** depois da vogal do radical — verbos em -а mantêm **а** (прочитав), em -и mantêm **и** (купив), em -е em geral mudam para **о** na 1ª pessoa e no plural (дојдов, дојде, дојдовме, дојдоа).
    table:
      head: {en: [Person, "прочита (read)", "купи (buy)", "дојде (come)"], pt: [Pessoa, "прочита (ler)", "купи (comprar)", "дојде (vir)"]}
      rows:
      - [јас, прочитав, купив, дојдов]
      - [ти, прочита, купи, дојде]
      - [тој / таа, прочита, купи, дојде]
      - [ние, прочитавме, купивме, дојдовме]
      - [вие, прочитавте, купивте, дојдовте]
      - [тие, прочитаа, купија, дојдоа]
    mistakes:
    - wrong: Вчера купувам кола.
      right: Вчера купив кола.
      why: {en: "Finished past event: aorist.", pt: "Fato passado concluído: aoristo."}
    examples:
    - [Вчера купив кола., Yesterday I bought a car., Ontem comprei um carro., купив]
    - ["Кога дојде?", "When did you come?", "Quando você chegou?", "дојде"]
    - [Ја прочитавме книгата., We read the book., Lemos o livro., прочитавме]
    - [Тие заминаа рано., They left early., Eles foram embora cedo., заминаа]
    match: {seq: [{pos: verb, tense: aor}], same: [tense]}

  - id: a2-imperfect
    title: читав, одев
    meaning: {en: "the imperfect: what was going on, what used to be", pt: "o imperfeito: o que estava acontecendo, o que se fazia"}
    intro:
      en: |
        The **imperfect** describes the past as ongoing or repeated — background, habits, descriptions: **Кога бев мал, играв фудбал секој ден.** "When I was little I played football every day." It is made mostly from **imperfective** verbs, just like the Portuguese *imperfeito*.

        Endings: **-в, -ше, -ше, -вме, -вте, -а**; е- and и-verbs take **е**: `оди` → **одев, одеше, одевме, одеа**.
      pt: |
        O **imperfeito** descreve o passado em curso ou repetido — pano de fundo, hábitos, descrições: **Кога бев мал, играв фудбал секој ден.** "Quando eu era pequeno jogava futebol todo dia." Forma-se sobretudo com verbos **imperfectivos**, exatamente como o nosso *imperfeito*: *jogava, ia, lia*.

        Terminações: **-в, -ше, -ше, -вме, -вте, -а**; verbos em -е e -и levam **е**: `оди` → **одев, одеше, одевме, одеа**.
    table:
      head: {en: [Person, "чита (read)", "оди (go)", "пие (drink)"], pt: [Pessoa, "чита (ler)", "оди (ir)", "пие (beber)"]}
      rows:
      - [јас, читав, одев, пиев]
      - [ти, читаше, одеше, пиеше]
      - [тој / таа, читаше, одеше, пиеше]
      - [ние, читавме, одевме, пиевме]
      - [вие, читавте, одевте, пиевте]
      - [тие, читаа, одеа, пиеја]
    sections:
    - id: contrast
      body:
        en: "**Читав** книга кога **ѕвонеше** телефонот. \"I *was reading* a book when the phone *was ringing*.\" — **Ја прочитав** книгата. \"I *read* (finished) the book.\" Imperfect = the scene; aorist = the event."
        pt: "**Читав** книга кога **ѕвонеше** телефонот. \"Eu *lia* um livro quando o telefone *tocava*.\" — **Ја прочитав** книгата. \"*Li* (terminei) o livro.\" Imperfeito = o cenário; aoristo = o fato."
    mistakes:
    - wrong: Секој ден купив леб.
      right: Секој ден купував леб.
      why: {en: "Repeated past = imperfective verb, imperfect tense.", pt: "Passado repetido = verbo imperfectivo, imperfeito."}
    examples:
    - [Кога бев дете живеевме во Битола., When I was a child we lived in Bitola., Quando eu era criança morávamos em Bitola., живеевме]
    - ["Што правеше вчера во пет?", "What were you doing yesterday at five?", "O que você estava fazendo ontem às cinco?", "правеше"]
    - [Секое лето одевме на море., Every summer we went to the seaside., Todo verão íamos à praia., одевме]
    - [Врнеше цел ден., It rained all day., Choveu o dia inteiro., Врнеше]
    match: {seq: [{pos: verb, tense: impf}], same: [tense]}

  - id: a2-l-form
    title: сум бил, си видел
    meaning: {en: "the past with сум + l-form: have done, have been", pt: "o passado com сум + forma em -л: já fiz, já estive"}
    intro:
      en: |
        The **l-form** of a verb (`бил`, `видел`, `дошол`) agrees in gender and number — **-л, -ла, -ло, -ле** — and with the present of `сум` makes the **indefinite past**: **Сум бил во Охрид.** "I have been to Ohrid." In the **3rd person there is no сум**: **Тој бил во Охрид.**

        It is used for experiences without a fixed time (*have you ever…?*) and for things the speaker did **not witness** — the 3rd person in particular often means "reportedly" (B1).
      pt: |
        A **forma em -л** do verbo (`бил`, `видел`, `дошол`) concorda em gênero e número — **-л, -ла, -ло, -ле** — e com o presente de `сум` forma o **passado indefinido**: **Сум бил во Охрид.** "Já estive em Ohrid." Na **3ª pessoa não há сум**: **Тој бил во Охрид.**

        Usa-se para experiências sem data (*você já…?*) e para o que quem fala **não testemunhou** — a 3ª pessoa muitas vezes quer dizer "dizem que" (B1).
    table:
      head: {en: [Person, "бил (been)", "видел (seen)"], pt: [Pessoa, "бил (estado)", "видел (visto)"]}
      rows:
      - [јас, сум бил / била, сум видел / видела]
      - [ти, си бил / била, си видел / видела]
      - [тој / таа, бил / била, видел / видела]
      - [ние, сме биле, сме виделе]
      - [вие, сте биле, сте виделе]
      - [тие, биле, виделе]
    sections:
    - id: notes
      body:
        en: "l-forms: а-verbs **-ал** (читал), и-verbs **-ел** (одел, видел), many е-verbs **-ел** (пиел, јадел); irregular: **дошол, дошла** (дојде), **рекол, рекла** (рече), **можел** (може)."
        pt: "Formas em -л: verbos em -а **-ал** (читал), em -и **-ел** (одел, видел), muitos em -е **-ел** (пиел, јадел); irregulares: **дошол, дошла** (дојде), **рекол, рекла** (рече), **можел** (може)."
    mistakes:
    - wrong: Тој е бил во Охрид.
      right: Тој бил во Охрид.
      why: {en: "No auxiliary in the 3rd person.", pt: "Sem auxiliar na 3ª pessoa."}
    - wrong: (Ана) Сум бил.
      right: (Ана) Сум била.
      why: {en: "The l-form agrees with the speaker's gender.", pt: "A forma em -л concorda com o gênero de quem fala."}
    examples:
    - ["Дали си бил во Скопје?", "Have you been to Skopje?", "Você já esteve em Skopje?", "бил"]
    - [Никогаш не сум јадел тавче гравче., I've never eaten tavče gravče., Nunca comi tavče gravče., јадел]
    - [Сме слушале за тоа., We've heard about that., Já ouvimos falar disso., слушале]
    # the l-form proper: the reader also files the -н/-т participle (замрзнато) under it
    match: {seq: [{pos: verb, tense: lpart, re: "(л|ла|ло|ле)$"}], same: [tense]}

- title: {en: Counting and time, pt: Contagem e horas}
  lessons:
  - id: a2-count-plural
    title: два стола, пет дена
    meaning: {en: "the count plural", pt: "o plural de contagem"}
    intro:
      en: |
        After a number (and after `колку` "how many", `неколку` "a few"), masculine nouns for **things** take a special plural in **-а**: **два стола** (not *столови*), **пет дена**, **неколку часа**. Feminine and neuter nouns use their normal plural: **две книги**.

        Masculine nouns for **people** don't: **три студенти**, or with the personal numerals **тројца студенти** (B2).
      pt: |
        Depois de um número (e de `колку` "quantos", `неколку` "alguns"), substantivos masculinos de **coisas** levam um plural especial em **-а**: **два стола** (não *столови*), **пет дена**, **неколку часа**. Femininos e neutros usam o plural normal: **две книги**.

        Masculinos de **pessoas** não: **три студенти**, ou com os numerais pessoais **тројца студенти** (B2).
    table:
      head: {en: [Noun, Plural, After a number], pt: [Substantivo, Plural, Depois de número]}
      rows:
      - [стол, столови, два стола]
      - [ден, денови, пет дена]
      - [час, часови, три часа]
      - [молив, моливи, два молива]
      - [книга, книги, "две книги (f.: normal)"]
    mistakes:
    - wrong: два столови
      right: два стола
      why: {en: "Masculine thing after a number: -а.", pt: "Masculino de coisa depois de número: -а."}
    examples:
    - [Чекав два часа., I waited two hours., Esperei duas horas., часа]
    - [Остануваме пет дена., We're staying five days., Ficamos cinco dias., дена]
    - ["Колку молива имаш?", "How many pencils do you have?", "Quantos lápis você tem?", "молива"]
    match: {seq: [{word: [два, три, четири, пет, шест, седум, осум, девет, десет, неколку, колку, дваесет, сто]}, {pos: noun, gender: m}], gap: 1}

  - id: a2-ordinals
    title: прв, втор, трет
    meaning: {en: "ordinal numbers and dates", pt: "ordinais e datas"}
    intro:
      en: |
        Ordinals are adjectives (**прв, прва, прво, први**) and usually take the article: **првиот ден** "the first day". From five on they end in **-ти**: `петти`, `шести`, `седми`, `осми`, `деветти`, `десетти`.

        Dates use the masculine ordinal and the month: **први мај** "1 May", **на петти март** "on 5 March"; **Денес е дваесет и први.** "Today is the twenty-first."
      pt: |
        Os ordinais são adjetivos (**прв, прва, прво, први**) e em geral levam artigo: **првиот ден** "o primeiro dia". Do quinto em diante terminam em **-ти**: `петти`, `шести`, `седми`, `осми`, `деветти`, `десетти`.

        Datas: o ordinal masculino com o mês: **први мај** "1º de maio", **на петти март** "em 5 de março".
    table:
      head: {en: [Number, Ordinal, With the article], pt: [Número, Ordinal, Com artigo]}
      rows:
      - [1, прв / прва / прво, првиот / првата]
      - [2, втор, вториот]
      - [3, трет, третиот]
      - [4, четврт, четвртиот]
      - [5, петти, петтиот]
      - [10, десетти, десеттиот]
    mistakes:
    - wrong: петиот ден
      right: петтиот ден
      why: {en: "Ordinals from five have -ти: петти.", pt: "Ordinais do quinto em diante têm -ти: петти."}
    examples:
    - [Ова е мојот прв пат во Македонија., This is my first time in Macedonia., É a minha primeira vez na Macedônia., прв]
    - [Живеам на третиот кат., I live on the third floor., Moro no terceiro andar., третиот]
    - [Роден сум на петти март., I was born on the fifth of March., Nasci no dia cinco de março., петти]
    match: {seq: [{word: [прв, прва, прво, први, првиот, првата, првото, првите, втор, втора, второ, втори, вториот, втората, второто, трет, трета, трето, трети, третиот, третата, четврт, четвртиот, петти, петтиот, шести, шестиот, седми, осми, деветти, десетти]}]}
    pool: [прв, првиот, втор, вториот, трет, третиот, четврт, петти, петтиот, шести]

  - id: a2-time
    title: Колку е часот?
    meaning: {en: "telling the time", pt: "dizer as horas"}
    intro:
      en: |
        **Колку е часот?** "What time is it?" — **Часот е пет.** "It's five." *At five* is **во пет (часот)**. Minutes after the hour join with **и** (*and*), before the hour with **без** (*without*): **пет и десет** 5:10, **пет и половина** 5:30, **шест без петнаесет** 5:45 ("six without fifteen").
      pt: |
        **Колку е часот?** "Que horas são?" — **Часот е пет.** "São cinco." *Às cinco* é **во пет (часот)**. Minutos depois da hora se ligam com **и** (*e*), antes da hora com **без** (*sem*, como em "quinze para as seis"): **пет и десет** 5:10, **пет и половина** 5:30, **шест без петнаесет** 5:45.
    table:
      head: {en: [Time, Macedonian], pt: [Hora, Macedônio]}
      rows:
      - ["1:00", еден часот]
      - ["5:10", пет и десет]
      - ["5:30", пет и половина]
      - ["5:45", шест без петнаесет]
      - [{"en": "at 8", "pt": "às 8"}, "во осум часот"]
    examples:
    - ["Колку е часот?", "What time is it?", "Que horas são?", "часот"]
    - [Се гледаме во осум часот., See you at eight o'clock., Nos vemos às oito horas., часот]
    - [Возот тргнува во пет и половина., The train leaves at half past five., O trem sai às cinco e meia., половина]
    match: {seq: [{word: [часот, половина, часа]}]}
    pool: [часот, половина, часа, час, минути, без]

- title: {en: This one and that one, pt: Este aqui e aquele lá}
  lessons:
  - id: a2-prox-dist
    title: книгава, книгана
    meaning: {en: "the near and far articles", pt: "os artigos de perto e de longe"}
    intro:
      en: |
        Besides **-от / -та / -то** (*the*), Macedonian has two more articles found in no other standard Balkan language: **-ов / -ва / -во / -ве** for something **near me** ("this … here") and **-он / -на / -но / -не** for something **far away** ("that … there"). **Книгава е моја.** "This book is mine." **Куќана е стара.** "That house there is old." They are frequent in speech.
      pt: |
        Além de **-от / -та / -то** (*o, a*), o macedônio tem mais dois artigos, que nenhuma outra língua balcânica padrão tem: **-ов / -ва / -во / -ве** para algo **perto de mim** ("este … aqui") e **-он / -на / -но / -не** para algo **longe** ("aquele … lá"). **Книгава е моја.** "Este livro aqui é meu." **Куќана е стара.** "Aquela casa lá é velha." São frequentes na fala.
    table:
      head: {en: ["", m., f., n., "pl. (m./f.)", "pl. (n.)"], pt: ["", m., f., n., "pl. (m./f.)", "pl. (n.)"]}
      rows:
      - ["the / o, a", столот, жената, селото, жените, селата]
      - ["this here / este aqui", столов, женава, селово, жениве, селава]
      - ["that there / aquele lá", столон, женана, селоно, женине, селана]
    examples:
    - [Книгава е многу интересна., This book is very interesting., Este livro aqui é muito interessante., Книгава]
    - ["Кој е човекон?", "Who is that man over there?", "Quem é aquele homem lá?", "човекон"]
    - [Летово беше топло., This summer was hot., Este verão foi quente., Летово]
    match: {seq: [{pos: noun, case: [prox, dist]}], same: [number]}
