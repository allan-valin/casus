# Arabic text of the Macedonian course, level A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Letters and sounds: "الحروف والأصوات"
  Being and having: "الكينونة والملكية"
  The present tense: "الزمن المضارع"
  Nouns and the article: "الأسماء وأداة التعريف"
  Describing things: "وصف الأشياء"
  People: "الأشخاص"
  Numbers and time: "الأعداد والوقت"
  Place: "المكان"
lessons:
  a1-alphabet:
    meaning: "الأبجدية والإملاء والنبر"
    intro: |
      تُكتب المقدونية بأبجدية سيريلية خاصة بها من **31 حرفًا**، وتُكتب **كما تُنطق**: حرف واحد لصوت واحد، وكل حرف يُنطق. من يعرف الحروف يستطيع قراءة أي كلمة بصوت عالٍ.

      معظم الحروف مثل السيريلية الروسية أو الصربية. سبعة منها تحتاج انتباهًا: `ѓ` و`ќ` (*g* و*k* مُليَّنتان، قريبتان من «گي» و«كي»)، و`ѕ` (*دز*)، و`ј` (الياء في «يد»)، و`љ` و`њ` (لام ونون مُليَّنتان)، و`џ` (الجيم المركّبة «دج» كما في «جَمَل» بالنطق الفصيح).
    sections:
      usage: |
        النبر **ثابت**: في الكلمة ذات ثلاثة مقاطع أو أكثر يقع على **المقطع الثالث من الآخر**؛ وفي الكلمات الأقصر على المقطع الأول. ولا يُكتب أبدًا.

        | الكلمة | النبر |
        |---|---|
        | вода (ماء) | **во**да |
        | македонски | ма**ке**донски |
        | водата (الماء) | во**да**та |

        لأن أداة التعريف جزء من الكلمة، فإضافتها تنقل النبر: **во**да → во**да**та، **чо**век → чо**ве**кот. بعض الكلمات الدخيلة تحتفظ بنبرها (مثل литера**ту**ра).
    mistakes: ["هما صوتان مُليَّنان (غاريّان): ќе تُنطق *كيِه* لا *كِه*.", "عُدّ ثلاثة مقاطع من آخر الكلمة."]
  a1-sum:
    meaning: "الكينونة (أنا، أنت…)"
    intro: |
      `сум` هو فعل *الكينونة* (يكون). وضمير الفاعل يُحذف عادة لأن صيغة الفعل تدل على الشخص: **Студент сум.** «أنا طالب».
    sections:
      usage: |
        - الصيغ قصيرة و**لا تبدأ بها الجملة أبدًا** في الكلام العادي: قل **Студент сум** أو **Јас сум студент**، لا *Сум студент*.
        - `Вие сте` هي أيضًا صيغة الاحترام لمخاطَب واحد (حضرتك).
        - صيغة الغائب `е` وصيغة الجمع `се` تشبهان كلمات أخرى؛ والجملة تُوضّح المعنى.
    mistakes: ["لكل شخص صيغته؛ е للغائب وحده.", "الصيغة القصيرة تستند إلى كلمة قبلها."]
  a1-negation:
    meaning: "النفي؛ لا يوجد"
    intro: |
      `не` تأتي **مباشرة قبل الفعل** (وقبل الضمائر القصيرة المتصلة به): **Не знам.** «لا أعرف». وتحتفظ المقدونية بالنفي المزدوج: **Никој не дојде.** «لم يأتِ أحد» (حرفيًا: «لا أحد لم يأتِ»).

      `нема` نفي `има` «يوجد»: **Нема леб.** «لا يوجد خبز». ومع `да` يكوّن أيضًا المستقبل المنفي (درس A2).
    mistakes: ["не تأتي قبل الضمائر القصيرة أيضًا.", "не + има تُكتب دائمًا нема."]
  a1-imam:
    meaning: "الملكية؛ يوجد"
    intro: |
      `имам` «عندي» فعل من مجموعة а (الدرس التالي) وله نفي خاص: `немам` «ليس عندي». وصيغة الغائب `има` / `нема` تعني أيضًا *يوجد / لا يوجد*: **Има кафе?** «هل توجد قهوة؟»
  a1-pres-a:
    meaning: "مضارع أفعال а"
    intro: |
      تذكر القواميس الفعل المقدوني بصيغة **الغائب المفرد** في المضارع («هو يقرأ»)، لأنه لا يوجد مصدر. والحرف الصائت في آخره يضع الفعل في إحدى ثلاث مجموعات: **а** أو **е** أو **и**.

      مجموعة а هي الأكبر والأكثر انتظامًا: خذ `чита` «يقرأ» وأضف اللواحق. كل صيغة للمتكلم المفرد في المضارع تنتهي بـ **-м**.
    sections:
      notes: |
        كثير من الأفعال المنتهية بـ **-ува** من هذه المجموعة: `зборува` (يتكلم)، `пишува` (يكتب)، `купува` (يشتري)، `патува` (يسافر). وكذلك `гледа` (يشاهد)، `чека` (ينتظر)، `сака` (يريد، يحب)، `игра` (يلعب).
    mistakes: ["هم: -аат."]
  a1-pres-e:
    meaning: "مضارع أفعال е"
    intro: |
      الأفعال التي تنتهي صيغتها في القاموس بـ **-е** تأخذ **-е-** في الأشخاص الوسطى و**-ам / -ат** في الطرفين. وبعد حرف صائت تظهر `ј` حيث يلتقي صائتان: `пие` → `пијам`، `пијат`.
    sections:
      notes: |
        وأيضًا: `живее` (يعيش: живеам، живееш…)، `пере` (يغسل)، `плете` (يحيك)، `тресе` (يهزّ)، `може` (يستطيع: можам، можеш… можат)، `дојде` (يأتي، تام).
    mistakes: ["المتكلم ينتهي دائمًا بـ -ам/-м في المضارع، حتى في أفعال е."]
  a1-pres-i:
    meaning: "مضارع أفعال и"
    intro: |
      الأفعال المنتهية بـ **-и** تحتفظ بـ **-и-** في الأشخاص الوسطى؛ والمتكلم المفرد يبقى **-ам**، و*هم* **-ат**.
    sections:
      contrast: |
        | | أفعال а | أفعال е | أفعال и |
        |---|---|---|---|
        | أنا | -ам | -ам | -ам |
        | أنت | -аш | -еш | -иш |
        | هو/هي | -а | -е | -и |
        | نحن | -аме | -еме | -име |
        | أنتم | -ате | -ете | -ите |
        | هم | -аат | -ат | -ат |
  a1-questions:
    meaning: "أسئلة نعم/لا"
    intro: |
      يُصاغ سؤال نعم/لا بطريقتين:

      - `ли` **بعد الكلمة الأولى** المسؤول عنها، وهي عادة الفعل: **Зборуваш ли македонски?**
      - `Дали` **في البداية** مع ترتيب الجملة العادي: **Дали зборуваш македонски?**

      وفي الكلام يكفي تنغيم صاعد: **Зборуваш македонски?**
    mistakes: ["ли لا تبدأ الجملة أبدًا؛ تأتي بعد الكلمة المسؤول عنها.", "استعمل إحداهما فقط."]
  a1-question-words:
    meaning: "أدوات الاستفهام"
    intro: |
      أداة الاستفهام تأتي أولًا، كما في العربية. `кој` «من، أيّ» تطابق ما تسأل عنه: `кој` (مذكر)، `која` (مؤنث)، `кое` (محايد)، `кои` (جمع).
  a1-gender:
    meaning: "الجنس: المذكر والمؤنث والمحايد"
    intro: |
      كل اسم مذكر أو مؤنث أو محايد، وغالبًا ما تدل النهاية على ذلك:

      - **المذكر**: ينتهي بحرف ساكن — `стол` (كرسي)، `град` (مدينة)؛ وبعض أسماء الرجال بـ -о/-а: `татко` (أب)، `колега` (زميل)
      - **المؤنث**: **-а** — `жена` (امرأة)، `книга` (كتاب)؛ وبعضها بحرف ساكن، معظمها أسماء معنى بـ **-ост/-ест** و`ноќ` (ليل)، `крв` (دم)، `сол` (ملح)
      - **المحايد**: **-о** أو **-е** — `село` (قرية)، `дете` (طفل)، `море` (بحر)

      الصفات وأداة التعريف وأسماء الإشارة تتبع الجنس: `нов стол`، `нова книга`، `ново село`.
    mistakes: ["книга تنتهي بـ -а: مؤنث.", "الرجال مذكرون أيًّا كانت النهاية."]
  a1-plural:
    meaning: "جمع الأسماء"
    intro: |
      الجمع يتوقف على الجنس:

      - **المذكر** أحادي المقطع: **-ови** (وبعد الساكن المُليَّن **-еви**) — `град` → `градови`، `нож` → `ножеви`؛ والأطول: **-и** — `студент` → `студенти`. وقبل -и تتغير к/г/х: `ученик` → `ученици`، `бубрег` → `бубрези`.
      - **المؤنث**: **-а → -и** — `жена` → `жени`، `книга` → `книги`؛ والمنتهي بساكن يضيف -и: `ноќ` → `ноќи`.
      - **المحايد**: **-о → -а** — `село` → `села`؛ **-е → -иња** — `море` → `мориња`، `кафе` → `кафиња`؛ **-це → -ца**: `јајце` → `јајца`.

      بعضها شاذ وكثير الاستعمال: `човек` → `луѓе` (ناس)، `дете` → `деца` (أطفال)، `брат` → `браќа`، `око` → `очи`، `уво` → `уши`.
    mistakes: ["جمع човек كلمة أخرى.", "к تصبح ц قبل -и الجمع."]
  a1-article:
    meaning: "أداة التعريف"
    intro: |
      ليس في المقدونية كلمة مستقلة لـ«الـ»: أداة التعريف **لاحقة** تُضاف إلى الاسم، مثل «ـه» بعكس موقع «الـ» العربية. واللاحقة تتوقف على **شكل الاسم** لا على جنسه فقط:

      - المذكر المنتهي بساكن: **-от** — `стол` → `столот`
      - المؤنث، والمذكر المنتهي بـ -а: **-та** — `жена` → `жената`، `колега` → `колегата`
      - المحايد، والمذكر المنتهي بـ -о: **-то** — `село` → `селото`، `татко` → `таткото`
      - الجمع المنتهي بـ -и: **-те** — `столови` → `столовите`، `жени` → `жените`
      - الجمع المنتهي بـ -а: **-та** — `села` → `селата`، `деца` → `децата`

      لا توجد أداة تنكير؛ و`еден / една / едно` «واحد» تُستعمل حين يُقصد *واحد بعينه*.
    sections:
      usage: |
        تُستعمل أداة التعريف لما هو معروف أو مذكور سابقًا (**Каде е клучот?** «أين المفتاح؟»)، لكن **لا** مع أسماء العَلَم، و**لا** بعد حروف الجر حين يكون المعنى عامًا (**во град** «في مدينة»، **во градот** «في المدينة»).

        كلمات القرابة مع ضمير الملكية القصير لا تأخذ أداة التعريف: **мајка ми** «أمي» (درس A2).
    mistakes: ["المذكر المنتهي بـ -о يأخذ -то.", "الجمع المنتهي بـ -а يأخذ -та."]
  a1-adjectives:
    meaning: "الصفات والمطابقة"
    intro: |
      تأتي الصفة **قبل** موصوفها وتطابقه: المذكر بلا لاحقة، والمؤنث **-а**، والمحايد **-о**، والجمع **-и** (لكل الأجناس).

      الصفات المذكرة كثيرًا ما فيها صائت متحرك يسقط في الصيغ الأخرى: `добар` → `добра، добро، добри`؛ و`мал` بسيطة: `мала، мало، мали`. وكثير من الصفات المنتهية بـ **-ски** تحتفظ بـ -и دائمًا: `македонски، македонска، македонско، македонски`.
    mistakes: ["الـ -а- المتحركة في добар تسقط في الصيغ الأخرى.", "الجمع -и لكل الأجناس."]
  a1-adj-article:
    meaning: "أداة التعريف على الكلمة الأولى"
    intro: |
      حين تسبق الصفةُ الاسمَ، تنتقل أداة التعريف إلى **الصفة** — أول كلمة في العبارة — ويبقى الاسم مجرّدًا: `стол` → `столот`، لكن `нов стол` → **новиот стол**.

      الصفات المذكرة تأخذ **-иот** (`новиот`، `добриот`)؛ والصيغ الأخرى تأخذ أداة الأسماء نفسها: `новата`، `новото`، `новите`.
    mistakes: ["الكلمة الأولى وحدها تأخذ أداة التعريف.", "الصفات المذكرة تأخذ -иот."]
  a1-demonstratives:
    meaning: "هذا، ذلك، ذاك البعيد"
    intro: |
      ثلاث درجات للبعد:

      - `овој` — **هذا**، قريب مني
      - `тој` — **ذلك**، الذي نتحدث عنه (وأيضًا *هو / هي*)
      - `оној` — **ذاك** البعيد هناك

      تطابق الاسم، والاسم بعدها بلا أداة تعريف: **овој стол** «هذا الكرسي».
    sections:
      notes: |
        `ова` و`тоа` وحدهما تعنيان *هذا* و*ذلك* للأشياء: **Што е ова?** «ما هذا؟» — **Тоа е мојот брат.** «ذلك أخي».
    mistakes: ["لا أداة تعريف بعد اسم الإشارة."]
  a1-possessives:
    meaning: "ملكي، ملكك، ملكه، ملكها…"
    intro: |
      أسماء الملكية تطابق **الشيء المملوك**، مثل الصفات، وتأخذ عادة أداة التعريف: **мојот брат** «أخي»، **мојата сестра** «أختي»، **моето дете**، **моите пријатели**.

      *له* و*لها* كلمتان مختلفتان: `негов` (له) و`нејзин` (لها).
    mistakes: ["طابِق الشيء المملوك وأضف أداة التعريف.", "المالكة امرأة: нејзин."]
  a1-pronouns:
    meaning: "ضمائر الفاعل"
    intro: |
      ضمائر الفاعل **تُحذف** غالبًا لأن لاحقة الفعل تدل على الشخص: **Одам дома.** «أذهب إلى البيت». وتُستعمل للتوكيد أو المقابلة: **Јас одам, ти остануваш.** «*أنا* أذهب و*أنت* تبقى».

      `вие` تعني *أنتم* وأيضًا صيغة الاحترام لمخاطَب واحد.
  a1-numbers:
    meaning: "الأعداد من 1 إلى 100"
    intro: |
      *واحد* يطابق الاسم: `еден` (مذكر)، `една` (مؤنث)، `едно` (محايد). و*اثنان* `два` للمذكر و`две` للمؤنث والمحايد. ومن ثلاثة فصاعدًا لا تتغير الأعداد.

      الأعداد من 11 إلى 19 تُضاف إليها **-наесет** (`единаесет` 11، `дванаесет` 12)، والعشرات **-есет / -десет** (`дваесет` 20، `триесет` 30، `педесет` 50)، والمركّبة تُربط بـ **и**: `дваесет и пет` 25.

      بعد العدد تأخذ الأسماء المذكرة **جمع عدّ** خاصًا بـ **-а**: `два стола` «كرسيان» (المزيد في A2).
    mistakes: ["две للمؤنث والمحايد.", "الواحد يطابق الجنس."]
  a1-days:
    meaning: "الأيام وكلمات الزمن"
    intro: |
      *يوم الاثنين* هو **во понеделник**؛ و*كل اثنين* **секој понеделник** أو **понеделниците**. *اليوم، غدًا، أمس*: `денес`، `утре`، `вчера`؛ و*الآن* `сега`. ولا تُكتب أسماء الأيام بحرف كبير.
  a1-prepositions:
    meaning: "حروف الجر للمكان والمصاحبة"
    intro: |
      الأسماء لا تتغير بعد حروف الجر (لا إعراب بالحالات)، فحرف الجر وحده يحمل المعنى:

      - `во` في، إلى داخل — **во градот** «في المدينة»
      - `на` على، عند، إلى (وأيضًا *لـ / من* والمفعول غير المباشر) — **на масата** «على الطاولة»، **на море** «على البحر»
      - `кај` عند (شخص)، قرب — **кај мене** «عندي»، **кај Ана** «عند آنا»
      - `од` من — **од Скопје** «من سكوبيه»
      - `до` إلى، حتى، بجانب — **до центарот** «إلى المركز»
      - `со` مع — **со пријател** «مع صديق»
      - `за` لـ، عن — **за тебе** «لك»
      - `без` بدون؛ `под` تحت؛ `над` فوق؛ `пред` أمام؛ `зад` خلف؛ `меѓу` بين
    sections:
      contrast: |
        **во** *داخل* (во училиште، во Скопје)، و**на** *في حدث أو مكان مفتوح* (на работа، на пазар، на концерт). مع البلدان والمدن **во**؛ ومع الجزر والجبال والبحر **на**.
    mistakes: ["المدن تأخذ во.", "العمل والدروس والسوق: на."]
