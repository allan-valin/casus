# German text of the Macedonian course, level B1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Perfect and pluperfect: "Perfekt und Plusquamperfekt"
  Would and if: "Würde und wenn"
  Reported events: "Berichtete Ereignisse"
  Joining sentences: "Sätze verbinden"
  Verb-based forms: "Formen vom Verb"
  Someone and no one: "Jemand und niemand"
lessons:
  b1-ima-perfect:
    meaning: "das има-Perfekt: ich habe gesehen"
    intro: |
      Mazedonisch hat ein echtes *haben*-Perfekt, einzigartig unter den slawischen Sprachen: **има** + das **neutrale Verbaladjektiv** auf **-но / -то**, das sich nie ändert: **Имам видено.** „Ich habe (es) gesehen.“ **Немам јадено.** „Ich habe nicht gegessen.“ **Имаш ли бидено во Струга?** „Warst du schon einmal in Struga?“

      Es betont das **Ergebnis** oder die **Erfahrung** jetzt, ähnlich wie das deutsche Perfekt. `има` richtet sich nach dem Subjekt; das Partizip bleibt neutral.
    mistakes: ["Das Partizip ist hier immer neutral.", "Das Perfekt der Handlungsverben bildet man mit има."]
  b1-pluperfect:
    meaning: "das Plusquamperfekt: hatte getan"
    intro: |
      Für etwas, das schon vor einem anderen vergangenen Ereignis geschehen war, nimmt man die **Vergangenheit von сум + l-Form** oder die **Vergangenheit von има + Verbaladjektiv**:

      - **Кога дојдов, тој веќе беше заминал.** „Als ich kam, war er schon gegangen.“
      - **Имав купено билети.** „Ich hatte Karten gekauft.“
    mistakes: ["*War gegangen* vor meiner Ankunft: Plusquamperfekt."]
  b1-future-past:
    meaning: "ќе + Imperfekt: würde, wollte gerade"
    intro: |
      `ќе` mit dem **Imperfekt** verlegt das Futur in die Vergangenheit: **Ќе одев, но врнеше.** „Ich wollte gehen, aber es regnete.“ Es ist auch das *würde* irrealer Bedingungen: **Да знаев, ќе ти кажев.** „Hätte ich es gewusst, hätte ich es dir gesagt.“

      Und es beschreibt vergangene Gewohnheiten: **Секое лето ќе одевме на село.** „Jeden Sommer fuhren wir immer aufs Dorf.“
    mistakes: ["Irreale Vergangenheit: Imperfekt auf beiden Seiten."]
  b1-conditional:
    meaning: "би + l-Form: würde (höflich, möglich)"
    intro: |
      **би** (unveränderlich) + die **l-Form** bildet den Konditional: **Би сакал кафе.** „Ich hätte gern einen Kaffee.“ **Би дошла, ако можам.** „Ich würde kommen, wenn ich könnte.“ Die l-Form richtet sich nach dem Subjekt: `сакал` (m.), `сакала` (f.), `сакале` (Pl.).

      So bittet man höflich: **Би можеле ли да ми помогнете?** „Könnten Sie mir helfen?“
    mistakes: ["би verlangt die l-Form, nicht das Präsens.", "Die l-Form richtet sich nach dem Sprecher."]
  b1-if-real:
    meaning: "reale Bedingungen: wenn …"
    intro: |
      **ако** + Präsens für eine reale Bedingung; die Folge steht meist im Futur: **Ако врне, ќе останам дома.** „Wenn es regnet, bleibe ich zu Hause.“ Nach `ако` steht **kein ќе**, und ein perfektives Verb ist im Präsens möglich: **Ако дојдеш, јави се.** „Wenn du kommst, melde dich.“
    mistakes: ["Kein ќе nach ако."]
  b1-if-unreal:
    meaning: "irreale Bedingungen: wenn ich hätte …, würde ich …"
    intro: |
      Eine irreale Bedingung ist **да + Imperfekt**, ihre Folge **ќе + Imperfekt**: **Да имав пари, ќе купев кола.** „Hätte ich Geld, würde ich ein Auto kaufen.“ Dieselbe Form gilt für Gegenwart und Vergangenheit: **Да знаев, ќе дојдев.** „Hätte ich es gewusst, wäre ich gekommen.“

      Die verneinte Folge ist **немаше да** + Präsens: **Да знаев, немаше да дојдам.** „Hätte ich es gewusst, wäre ich nicht gekommen.“ Mit **би** + l-Form klingt die Folge weicher: **Да имам време, би дошол.**
    mistakes: ["Irreal: да + Imperfekt, dann ќе + Imperfekt."]
  b1-renarrative:
    meaning: "berichtete Vergangenheit: anscheinend, sagt man"
    intro: |
      Das Mazedonische markiert, ob der Sprecher ein vergangenes Ereignis **selbst erlebt** hat. Aorist und Imperfekt verbürgen es; die **l-Form ohne сум** gibt es als Hörensagen oder Schluss wieder: **Тој беше болен.** „Er war krank (ich weiß es).“ gegenüber **Тој бил болен.** „Er war angeblich krank.“

      Nachrichten, Erzählungen und Klatsch verwenden es ständig: **Синоќа имало земјотрес.** „Letzte Nacht soll es ein Erdbeben gegeben haben.“ Bei Überraschung über etwas gerade Entdecktes ist es der *Admirativ*: **Ти си бил паметен!** „Na so was, du bist ja klug!“
    mistakes: ["Nicht selbst erlebt: l-Form."]
  b1-relative:
    meaning: "Relativsätze: der, die, das, welcher"
    intro: |
      Zwei Relativwörter: **што** (*das/was*), unveränderlich und in der Rede am häufigsten, und **кој / која / кое / кои** (*welcher*), die sich nach dem Nomen richten: **човекот кој / што живее тука** „der Mann, der hier wohnt“, **жената која ја видов** „die Frau, die ich sah“.

      Ist das Relativwort **Objekt**, wiederholt es ein kurzes Pronomen im Satz: **книгата што ја купив** „das Buch, das ich (es) gekauft habe“. Nach Präpositionen die кој-Formen: **со кого** „mit wem“, **за која** „über die“, **во кој** „in dem“.
    mistakes: ["Objekt-Relativ: mit einem kurzen Pronomen wiederholen.", "кој richtet sich nach dem Nomen."]
  b1-time-conj:
    meaning: "Temporalsätze: als, während, sobald, nachdem"
    intro: |
      - **кога** wenn/als · **додека** während (auch *bis*, mit не: **додека не дојдеш** „bis du kommst“) · **штом** sobald · **откако** nachdem · **пред да** bevor (+ Präsens: **пред да заминеш**) · **откога** seit

      Für die Zukunft nimmt **кога** **ќе** (anders als **ако**, das es nie nimmt): **Кога ќе стигнеш, јави се.** „Wenn du ankommst, ruf an.“ Die anderen nehmen das Präsens, perfektiv für ein einzelnes Ereignis: **Штом дојде, ќе почнеме.**
    mistakes: ["*bevor* + Verb heißt пред да."]
  b1-cause-conj:
    meaning: "weil, obwohl, damit"
    intro: |
      - **бидејќи / зашто / затоа што** weil · **затоа** deshalb · **па** also, und dann · **иако** obwohl · **но / ама** aber · **туку** sondern (nach einer Verneinung) · **за да** damit, um zu (+ Präsens)

      **За да** ist *um zu*: **Учам за да положам.** „Ich lerne, um zu bestehen.“
    mistakes: ["*nicht X, sondern Y* ist туку.", "Beides gibt es; за да nennt den Zweck deutlich."]
  b1-reported-speech:
    meaning: "indirekte Rede: dass, ob"
    intro: |
      Nach Verben des Sagens und Denkens: **дека** (umgangssprachlich **оти**) „dass“ für Aussagen, **дали** „ob“ für Ja/Nein-Fragen und **да** für Befehle und Wünsche:

      - **Рече дека ќе дојде.** „Er sagte, er werde kommen.“ (Zeit wie im Original: *wird kommen*)
      - **Ме праша дали сум гладен.** „Sie fragte mich, ob ich Hunger habe.“
      - **Ми рече да чекам.** „Er sagte mir, ich solle warten.“
    mistakes: ["*ob* ist дали; ако ist nur konditional."]
  b1-verbal-adverb:
    meaning: "das Adverbialpartizip: beim Tun"
    intro: |
      Von **imperfektiven** Verben ergibt **-јќи** am Präsensstammvokal eine unveränderliche Form mit der Bedeutung *während / indem*: `оди` → **одејќи** „gehend“, `чита` → **читајќи**, `зборува` → **зборувајќи**. Sie ist buchsprachlich; gesprochen sagt man oft **додека** + Verb.
    mistakes: ["Nur imperfektive Verben bilden es."]
  b1-verbal-noun:
    meaning: "das Verbalnomen: das Lesen, das Schreiben"
    intro: |
      **-ње** am Stamm eines **imperfektiven** Verbs bildet ein neutrales Nomen für die Tätigkeit: `чита` → **читање** „das Lesen“, `пишува` → **пишување**, `оди` → **одење**, `пие` → **пиење**. Es nimmt den Artikel wie jedes Neutrum: **читањето**, und ist das übliche Wort auf Schildern und in Regeln: **Пушењето е забрането.** „Rauchen ist verboten.“
  b1-passive:
    meaning: "Passiv und Zustände"
    intro: |
      Zwei Passive:

      - **сум + Verbaladjektiv** (-н / -т, kongruierend): ein Zustand oder Ergebnis — **Вратата е затворена.** „Die Tür ist geschlossen.“ **Роден сум во Скопје.** „Ich bin in Skopje geboren.“ **Книгата е напишана во 1990.**
      - **се + Verb**: ein allgemeines oder unpersönliches Passiv — **Куќата се продава.** „Das Haus steht zum Verkauf.“ **Тука се зборува англиски.** „Hier spricht man Englisch.“
    mistakes: ["Das Partizip richtet sich nach dem Subjekt."]
  b1-indefinite:
    meaning: "jemand, niemand, jeder …"
    intro: |
      Fragewörter bilden ganze Familien mit **не-** (irgend-), **ни-** (nie-/kein-), **се-** (jeder-) und **било** (beliebig):

      | | wer | was | wo | wann |
      |---|---|---|---|---|
      | irgend- | некој | нешто | некаде | некогаш |
      | nie- | никој | ништо | никаде | никогаш |
      | jeder- | секој | сѐ | секаде | секогаш |
      | beliebig | кој било | што било | каде било | кога било |

      Die **ни-**Wörter verlangen **не** am Verb (doppelte Verneinung): **Никој не дојде.** „Niemand kam.“ **Ништо не знам.** „Ich weiß nichts.“
    mistakes: ["ни-Wörter brauchen не am Verb.", "*alles* schreibt man сѐ, mit dem Zeichen; се ist *sich*."]
