# Arabic text of the Macedonian course, level B1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Perfect and pluperfect: "التام والماضي الأسبق"
  Would and if: "الشرط وما كان سيحدث"
  Reported events: "الأحداث المنقولة"
  Joining sentences: "ربط الجمل"
  Verb-based forms: "صيغ مشتقة من الفعل"
  Someone and no one: "أحدٌ ولا أحد"
lessons:
  b1-ima-perfect:
    meaning: "التام بـ има: قد رأيتُ"
    intro: |
      للمقدونية تام حقيقي بفعل *الملكية*، فريد بين اللغات السلافية: **има** + **الصفة الفعلية المحايدة** المنتهية بـ **-но / -то**، التي لا تتغير أبدًا: **Имам видено.** «قد رأيت (ـه)». **Немам јадено.** «لم آكل بعد». **Имаш ли бидено во Струга?** «هل سبق أن زرت ستروغا؟»

      يبرز **النتيجة** أو **التجربة** في الحاضر، مثل «قد فعلتُ». `има` تطابق الفاعل؛ والصفة الفعلية تبقى محايدة.
    mistakes: ["الصفة الفعلية محايدة دائمًا هنا.", "تام أفعال الحدث يكون بـ има."]
  b1-pluperfect:
    meaning: "الماضي الأسبق: كان قد فعل"
    intro: |
      لما حدث قبل حدث ماضٍ آخر، استعمل **ماضي сум + صيغة -л** أو **ماضي има + الصفة الفعلية**:

      - **Кога дојдов, тој веќе беше заминал.** «حين وصلتُ كان قد غادر».
      - **Имав купено билети.** «كنت قد اشتريت التذاكر».
    mistakes: ["*كان قد غادر* قبل وصولي: الماضي الأسبق."]
  b1-future-past:
    meaning: "ќе + الماضي الناقص: كان سيفعل"
    intro: |
      `ќе` مع **الماضي الناقص** تنقل المستقبل إلى الماضي: **Ќе одев, но врнеше.** «كنت سأذهب، لكنها كانت تمطر». وهي أيضًا جواب الشرط غير الواقع: **Да знаев, ќе ти кажев.** «لو عرفتُ لأخبرتك».

      وتصف العادات الماضية: **Секое лето ќе одевме на село.** «كنا كل صيف نذهب إلى القرية».
    mistakes: ["الماضي غير الواقع: الماضي الناقص في الطرفين."]
  b1-conditional:
    meaning: "би + صيغة -л: الطلب المهذّب والاحتمال"
    intro: |
      **би** (لا تتغير) + **صيغة -л** تكوّن صيغة الشرط: **Би сакал кафе.** «أودّ قهوة». **Би дошла, ако можам.** «كنت سآتي لو استطعت». وصيغة -л تطابق الفاعل: `сакал` (مذكر)، `сакала` (مؤنث)، `сакале` (جمع).

      وهي طريقة الطلب المهذّب: **Би можеле ли да ми помогнете?** «هل يمكنك مساعدتي؟»
    mistakes: ["би تأخذ صيغة -л لا المضارع.", "صيغة -л تطابق المتكلم."]
  b1-if-real:
    meaning: "الشرط الممكن: إذا…"
    intro: |
      **ако** + المضارع للشرط الممكن؛ والجواب غالبًا في المستقبل: **Ако врне, ќе останам дома.** «إذا أمطرت بقيت في البيت». وبعد `ако` **لا ќе**، والفعل التام جائز في المضارع: **Ако дојдеш, јави се.** «إن جئت فاتصل».
    mistakes: ["لا ќе بعد ако."]
  b1-if-unreal:
    meaning: "الشرط غير الواقع: لو كان عندي…، لـ…"
    intro: |
      الشرط غير الواقع أو المخالف للواقع هو **да + الماضي الناقص**، وجوابه **ќе + الماضي الناقص**: **Да имав пари, ќе купев кола.** «لو كان عندي مال لاشتريت سيارة». والصيغة نفسها للحاضر والماضي: **Да знаев, ќе дојдев.** «لو عرفتُ لجئت».

      الجواب المنفي **немаше да** + المضارع: **Да знаев, немаше да дојдам.** «لو عرفتُ لما جئت». ومع **би** + صيغة -л يكون الجواب ألطف: **Да имам време, би дошол.**
    mistakes: ["غير الواقع: да + الماضي الناقص، ثم ќе + الماضي الناقص."]
  b1-renarrative:
    meaning: "الماضي المنقول: على ما يبدو، يقولون"
    intro: |
      تميّز المقدونية هل **شهد** المتكلم الحدث الماضي. الأوريست والماضي الناقص يضمنانه؛ و**صيغة -л بدون сум** تنقله سماعًا أو استنتاجًا: **Тој беше болен.** «كان مريضًا (أعرف ذلك)» مقابل **Тој бил болен.** «كان مريضًا، على ما يبدو».

      الأخبار والحكايات والأقاويل تستعملها باستمرار: **Синоќа имало земјотрес.** «وقع زلزال الليلة الماضية (كما سمعتُ)». ومع الدهشة من أمر اكتُشف للتو هي صيغة *التعجب*: **Ти си бил паметен!** «ما أذكاك!»
    mistakes: ["لم يُشهد: صيغة -л."]
  b1-relative:
    meaning: "الجمل الموصولة: الذي، التي"
    intro: |
      اسمان موصولان: **што** (*الذي*)، ثابت وهو الأكثر في الكلام، و**кој / која / кое / кои** (*الذي، التي*)، تطابق الاسم: **човекот кој / што живее тука** «الرجل الذي يسكن هنا»، **жената која ја видов** «المرأة التي رأيتها».

      إذا كان الموصول **مفعولًا** يكرّره ضمير قصير داخل الجملة — كالضمير العائد في العربية: **книгата што ја купив** «الكتاب الذي اشتريتُه». وبعد حروف الجر تُستعمل صيغ кој: **со кого** «مع من»، **за која** «عن التي»، **во кој** «الذي فيه».
    mistakes: ["الموصول المفعول: كرّره بضمير قصير.", "кој تطابق الاسم."]
  b1-time-conj:
    meaning: "جمل الزمن: حين، بينما، ما إن، بعد أن"
    intro: |
      - **кога** حين · **додека** بينما (وأيضًا *حتى*، مع не: **додека не дојдеш** «حتى تأتي») · **штом** ما إن · **откако** بعد أن · **пред да** قبل أن (+ المضارع: **пред да заминеш**) · **откога** منذ أن

      للمستقبل تأخذ **кога** الأداة **ќе** (بخلاف **ако** التي لا تأخذها أبدًا): **Кога ќе стигнеш, јави се.** «حين تصل اتصل». والبقية تأخذ المضارع، تامًّا لحدث واحد: **Штом дојде, ќе почнеме.**
    mistakes: ["*قبل أن* + فعل هي пред да."]
  b1-cause-conj:
    meaning: "لأن، مع أن، لكي"
    intro: |
      - **бидејќи / зашто / затоа што** لأن · **затоа** لذلك · **па** فـ، ثم · **иако** مع أن · **но / ама** لكن · **туку** بل (بعد النفي) · **за да** لكي (+ المضارع)

      **За да** هي *لكي*: **Учам за да положам.** «أدرس لكي أنجح».
    mistakes: ["*ليس كذا بل كذا* هي туку.", "كلتاهما موجودة؛ за да تصرّح بالغاية."]
  b1-reported-speech:
    meaning: "الكلام المنقول: أنّ، هل"
    intro: |
      بعد أفعال القول والتفكير: **дека** (وفي العامية **оти**) «أنّ» للخبر، و**дали** «هل» لأسئلة نعم/لا، و**да** للأمر والرغبة:

      - **Рече дека ќе дојде.** «قال إنه سيأتي». (الزمن كما في الأصل: *سيأتي*)
      - **Ме праша дали сум гладен.** «سألتني هل أنا جائع».
      - **Ми рече да чекам.** «قال لي أن أنتظر».
    mistakes: ["*هل* في الكلام المنقول هي дали؛ ако للشرط فقط."]
  b1-verbal-adverb:
    meaning: "الظرف الفعلي: أثناء الفعل"
    intro: |
      من الأفعال **الناقصة**، تُضاف **-јќи** إلى صائت جذر المضارع فتعطي صيغة ثابتة بمعنى *وهو يفعل / بفعله*: `оди` → **одејќи** «ماشيًا»، `чита` → **читајќи**، `зборува` → **зборувајќи**. وهي أدبية أكثر؛ والكلام يقول غالبًا **додека** + فعل.
    mistakes: ["الأفعال الناقصة وحدها تصوغها."]
  b1-verbal-noun:
    meaning: "المصدر: القراءة، الكتابة"
    intro: |
      **-ње** على جذر فعل **ناقص** تكوّن اسمًا محايدًا للنشاط، كالمصدر: `чита` → **читање** «القراءة»، `пишува` → **пишување**، `оди` → **одење**، `пие` → **пиење**. ويأخذ أداة التعريف كأي اسم محايد: **читањето**، وهو المعتاد في اللافتات والقواعد: **Пушењето е забрането.** «التدخين ممنوع».
  b1-passive:
    meaning: "المبني للمجهول والحالات"
    intro: |
      نوعان من المبني للمجهول:

      - **сум + الصفة الفعلية** (-н / -т، مطابِقة): حالة أو نتيجة — **Вратата е затворена.** «الباب مغلق». **Роден сум во Скопје.** «وُلدت في سكوبيه». **Книгата е напишана во 1990.**
      - **се + الفعل**: مجهول عام أو غير شخصي — **Куќата се продава.** «البيت للبيع». **Тука се зборува англиски.** «هنا يُتكلَّم بالإنجليزية».
    mistakes: ["الصفة الفعلية تطابق الفاعل."]
  b1-indefinite:
    meaning: "أحد، لا أحد، كل أحد…"
    intro: |
      أدوات الاستفهام تكوّن عائلات كاملة بـ **не-** (ما، أحد)، و**ни-** (لا أحد)، و**се-** (كل)، و**било** (أيّ):

      | | من | ماذا | أين | متى |
      |---|---|---|---|---|
      | بعض | некој | нешто | некаде | некогаш |
      | لا | никој | ништо | никаде | никогаш |
      | كل | секој | сѐ | секаде | секогаш |
      | أيّ | кој било | што било | каде било | кога било |

      كلمات **ни-** تأتي مع **не** على الفعل (نفي مزدوج): **Никој не дојде.** «لم يأتِ أحد». **Ништо не знам.** «لا أعرف شيئًا».
    mistakes: ["كلمات ни- تحتاج не على الفعل.", "*كل شيء* تُكتب сѐ بالعلامة؛ و се = *نفسه*."]
