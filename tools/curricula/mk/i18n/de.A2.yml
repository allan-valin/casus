# German text of the Macedonian course, level A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The future and wanting: "Futur und Wollen"
  Commands: "Befehle"
  Short pronouns: "Kurze Pronomen"
  Reflexive verbs: "Reflexive Verben"
  Comparing: "Vergleichen"
  The past: "Die Vergangenheit"
  Counting and time: "Zählen und Zeit"
  This one and that one: "Dieser hier und jener dort"
lessons:
  a2-future:
    meaning: "das Futur: ich werde …"
    intro: |
      Das Futur ist die Partikel `ќе` + die **Präsensformen**: **Ќе одам.** „Ich werde gehen.“ `ќе` ändert sich nie; das Verb zeigt die Person.

      Kurze Objektpronomen stehen **zwischen** `ќе` und dem Verb: **Ќе го видам.** „Ich werde ihn sehen.“
    sections:
      usage: |
        - Nach `ќе` ist ein **perfektives** Verb normal für eine abgeschlossene Handlung (**Ќе ти кажам.** „Ich sag’s dir.“), ein imperfektives für eine andauernde oder wiederholte (**Ќе ти пишувам секој ден.** „Ich werde dir jeden Tag schreiben.“).
        - `ќе` drückt auch eine Vermutung über die Gegenwart aus: **Ќе е дома.** „Er wird wohl zu Hause sein.“
    mistakes: ["Erst ќе, dann das kurze Pronomen, dann das Verb.", "ќе + Präsens für das Futur (ќе + Imperfekt heißt *würde*, B1)."]
  a2-future-neg:
    meaning: "das verneinte Futur: ich werde nicht …"
    intro: |
      Die Verneinung von `ќе` ist **нема да** + Präsens: **Нема да одам.** „Ich werde nicht gehen.“ (Man hört auch **Не ќе одам**, älter und literarischer.)
    mistakes: ["Entweder нема да oder не ќе — nie beides."]
  a2-da:
    meaning: "wollen, können, müssen: да + Präsens"
    intro: |
      Ohne Infinitiv sagt man *ich will gehen* als „ich will, **dass ich gehe**“: **Сакам да одам.** Beide Verben tragen die Person: **Сакаш да одиш.** „Du willst gehen.“

      Dasselbe Muster gilt nach `може` (können), `мора` (müssen), `треба` (sollen, brauchen), `почнува` (anfangen), `знае` (können, wissen wie). `треба` und oft `мора` bleiben in der 3. Person: **Треба да учам.** „Ich muss lernen.“
    mistakes: ["*Ich will gehen*: beide Verben in der 1. Person. (Сакам да одиш heißt *ich will, dass du gehst*.)", "да ist zwischen den beiden Verben nötig."]
  a2-aspect:
    meaning: "Aspekt: perfektiv und imperfektiv"
    intro: |
      Fast jedes Verb kommt als **Paar**: ein **imperfektives** Verb für eine Handlung als andauernd, wiederholt oder allgemein, und ein **perfektives** für eine einzelne Handlung als Ganzes, abgeschlossen.

      - `чита` / `прочита` lesen · `пишува` / `напише` schreiben · `купува` / `купи` kaufen · `кажува` / `каже` sagen · `доаѓа` / `дојде` kommen · `враќа` / `врати` zurückgeben

      Die Hauptregel: Ein **perfektives Verb steht nie allein im Präsens**, denn das Präsens ist andauernd. Es erscheint nach **ќе, да, ако, кога** (Futur, Wünsche, Bedingungen) — **Ќе ја прочитам.** „Ich werde es (zu Ende) lesen.“ —, für *jetzt* aber nur das Imperfektiv: **Ја читам.** „Ich lese es gerade.“
    mistakes: ["Gerade jetzt = imperfektiv.", "Eine ganze Handlung in der Zukunft = perfektiv."]
  a2-imperative:
    meaning: "der Imperativ"
    intro: |
      Der Imperativ wird vom Präsensstamm gebildet:

      - nach **Vokal** (а-Verben und е/и-Verben mit vokalischem Stamm): **-ј** / **-јте** — `чита` → **читај, читајте**; `пие` → **пиј, пијте**
      - nach **Konsonant**: **-и** / **-ете** — `оди` → **оди, одете**; `јаде` → **јади, јадете**; `дојде` → **дојди, дојдете**

      Kurze Pronomen stehen **nach** dem Imperativ: **Дај ми го!** „Gib es mir!“ Eine höfliche Bitte nimmt oft den Plural oder **Ве молам** „bitte“. Für *nicht*: **не** + imperfektiver Imperativ (**Не пушете!**) oder **немој / немојте да** + Präsens (**Немој да плачеш.** „Wein nicht.“).
    mistakes: ["Nach dem Imperativ folgen die Pronomen.", "Verneinte Befehle nehmen das Imperfektiv."]
  a2-direct-clitics:
    meaning: "Objektpronomen: mich, dich, ihn, sie …"
    intro: |
      Direkte Objektpronomen sind kurze Wörter **direkt vor dem Verb** (nach `не`, `ќе`, `да`): **Те сакам.** „Ich liebe dich.“ **Не го знам.** „Ich kenne ihn/es nicht.“

      `го` ist *ihn* und *es* (mask. und neutr.), `ја` ist *sie* und *es* (fem.), `ги` ist *sie* (Plural).
    sections:
      notes: |
        `не` ist sowohl *uns* als auch *nicht*: **Не не гледаат.** „Sie sehen uns nicht.“ Das erste ist *nicht*.
    mistakes: ["Das kurze Pronomen steht vor einem finiten Verb."]
  a2-indirect-clitics:
    meaning: "indirekte Objektpronomen: mir, ihm …"
    intro: |
      Das indirekte Objekt (*mir, für ihn*) hat eigene Kurzformen, ebenfalls vor dem Verb: **Ми рече.** „Er sagte mir.“ **Му дадов книга.** „Ich gab ihm ein Buch.“

      Beachte `ѝ` (*ihr*) mit Akzentzeichen, das es von `и` „und“ unterscheidet.
    mistakes: ["*Ich sagte ihm*: Sagen geht *an* jemanden, also indirekt.", "*ihr* ist ѝ, mit dem Zeichen, vor dem Verb."]
  a2-clitic-pairs:
    meaning: "zwei kurze Pronomen zusammen"
    intro: |
      Sind beide Objekte kurze Pronomen, ist die Reihenfolge fest: **indirekt + direkt + Verb** — **Ми го даде.** „Er gab es mir.“ Mit `не` und `ќе` davor: **Не ми го даде.** · **Ќе ти ја донесам.**

      Nach einem Imperativ folgt die ganze Gruppe dem Verb: **Дај ми го!** · **Кажи ми ја вистината!**
    mistakes: ["Das indirekte zuerst."]
  a2-doubling:
    meaning: "Objektverdopplung"
    intro: |
      Eine auffällige Eigenheit: Ein **bestimmtes direktes Objekt** wird zusätzlich durch ein kurzes Pronomen angekündigt — **Го видов Марко.** wörtlich „Ich sah *ihn* Marko“. **Ја прочитав книгата.** „Ich habe das Buch gelesen.“ Ohne Artikel (*ein Buch*) keine Verdopplung: **Прочитав книга.**

      Ein **indirektes Objekt** mit `на` wird immer verdoppelt: **Му реков на Марко.** „Ich sagte es Marko.“ **Им дадов на децата.** „Ich gab (es) den Kindern.“
    mistakes: ["Namen und Nomen mit Artikel sind bestimmt: verdoppeln.", "на + Person kommt immer mit seinem kurzen Pronomen."]
  a2-long-pronouns:
    meaning: "die langen (betonten) Pronomen"
    intro: |
      Jedes kurze Pronomen hat eine **Langform** nach Präpositionen — **со мене** „mit mir“, **за неа** „für sie“, **кај нив** „bei ihnen“ — und zur Betonung. Als betontes Objekt bleibt die Kurzform trotzdem: **Мене ме бараат, не тебе.** „*Mich* suchen sie, nicht dich.“
    mistakes: ["Nach einer Präposition nur die Langform.", "јас ist nur Subjekt."]
  a2-dopagja:
    meaning: "ich mag (es gefällt mir)"
    intro: |
      *Ich mag* wird umgekehrt gesagt, wie *es gefällt mir*: **Ми се допаѓа Охрид.** „Ohrid gefällt mir.“ Das Gemochte ist das Subjekt, das Verb richtet sich danach: **Ми се допаѓаат цвеќињата.** „Mir gefallen die Blumen.“

      Derselbe Rahmen: **ми треба** „ich brauche“ (es ist mir nötig), **ми е студено** „mir ist kalt“, **ми е жал** „es tut mir leid“, **ми се спие** „ich bin müde“.
    mistakes: ["Wer mag, ist das indirekte Objekt.", "Pluralsubjekt, Pluralverb."]
  a2-possessive-clitics:
    meaning: "meine Mutter, dein Bruder: kurze Possessive"
    intro: |
      Bei engen **Verwandtschaftswörtern** bedeutet das kurze indirekte Pronomen **nach** dem Nomen *mein, dein, sein …*, und das Nomen hat **keinen Artikel**: **мајка ми** „meine Mutter“, **татко ти** „dein Vater“, **сестра му** „seine Schwester“, **баба ѝ** „ihre Großmutter“. So sagt man es natürlich; **мојата мајка** klingt betont.

      Bei anderen Nomen steht das volle Possessiv (**мојата куќа**), gesprochen auch **куќата ми**.
    mistakes: ["Kein Artikel beim kurzen Possessiv an Verwandtschaftswörtern."]
  a2-reflexive:
    meaning: "sich: се und си"
    intro: |
      `се` ist das reflexive *sich* (direkt): **Се мијам.** „Ich wasche mich.“ Viele Verben haben es einfach immer: **се вика** „heißt“ (**Како се викаш?** „Wie heißt du?“), **се смее** „lacht“, **се плаши** „hat Angst“, **се враќа** „kehrt zurück“.

      `си` ist das reflexive *sich* (indirekt, für sich): **Си ги мијам рацете.** „Ich wasche mir die Hände.“ Es bildet auch „losgehen“: **Си одам.** „Ich geh dann (nach Hause).“ Beide stehen, wo andere kurze Pronomen stehen.
    mistakes: ["Ohne се heißt es *ich rufe Ana*."]
  a2-comparison:
    meaning: "Komparativ und Superlativ"
    intro: |
      Die Steigerung ist regelmäßig: **по-** für *mehr* und **нај-** für *am meisten*, bei Adjektiven wie Adverbien — `голем` → **по-голем** „größer“ → **најголем** „der größte“; `добро` → **по-добро** → **најдобро**. *Als* heißt **од**: **Таа е по-висока од мене.**

      Schreibung: **по-** mit Bindestrich, **нај-** zusammen.
    mistakes: ["*als* ist од; по- mit Bindestrich.", "*mehr* von многу ist unregelmäßig."]
  a2-sum-past:
    meaning: "war, waren: die Vergangenheit von сум"
    intro: |
      Die Vergangenheit von `сум` lautet **бев, беше, беше, бевме, бевте, беа**: **Бев дома.** „Ich war zu Hause.“ **Каде беше?** „Wo warst du?“ Wie `сум` steht sie in neutraler Rede nicht am Satzanfang: **Болен бев.** oder **Јас бев болен.**
    mistakes: ["„Wir“ hat бевме."]
  a2-aorist:
    meaning: "der Aorist: was (einmal, abgeschlossen) geschah"
    intro: |
      Der **Aorist** erzählt, was in einem Moment geschah, den der Sprecher erlebt hat oder verbürgt — die übliche Zeit für abgeschlossene Ereignisse: **Вчера купив кола.** „Gestern habe ich ein Auto gekauft.“ Er wird meist von **perfektiven** Verben gebildet.

      Endungen: **-в, —, —, -вме, -вте, -а** nach dem Stammvokal — а-Verben behalten **а** (прочитав), и-Verben **и** (купив), е-Verben wechseln meist zu **о** in der 1. Person und im Plural (дојдов, дојде, дојдовме, дојдоа).
    mistakes: ["Abgeschlossenes vergangenes Ereignis: Aorist."]
  a2-imperfect:
    meaning: "das Imperfekt: was im Gange war, was früher war"
    intro: |
      Das **Imperfekt** beschreibt die Vergangenheit als andauernd oder wiederholt — Hintergrund, Gewohnheiten, Beschreibungen: **Кога бев мал, играв фудбал секој ден.** „Als ich klein war, spielte ich jeden Tag Fußball.“ Es wird meist von **imperfektiven** Verben gebildet.

      Endungen: **-в, -ше, -ше, -вме, -вте, -а**; е- und и-Verben nehmen **е**: `оди` → **одев, одеше, одевме, одеа**.
    sections:
      contrast: |
        **Читав** книга кога **ѕвонеше** телефонот. „Ich *las* gerade ein Buch, als das Telefon *klingelte*.“ — **Ја прочитав** книгата. „Ich habe das Buch *gelesen* (zu Ende).“ Imperfekt = die Szene; Aorist = das Ereignis.
    mistakes: ["Wiederholte Vergangenheit = imperfektives Verb, Imperfekt."]
  a2-l-form:
    meaning: "die Vergangenheit mit сум + l-Form: habe getan, bin gewesen"
    intro: |
      Die **l-Form** eines Verbs (`бил`, `видел`, `дошол`) richtet sich nach Genus und Numerus — **-л, -ла, -ло, -ле** — und bildet mit dem Präsens von `сум` die **unbestimmte Vergangenheit**: **Сум бил во Охрид.** „Ich war schon in Ohrid.“ In der **3. Person fehlt сум**: **Тој бил во Охрид.**

      Sie steht für Erfahrungen ohne feste Zeit (*warst du je …?*) und für Dinge, die der Sprecher **nicht selbst erlebt** hat — besonders die 3. Person heißt oft „angeblich“ (B1).
    sections:
      notes: |
        l-Formen: а-Verben **-ал** (читал), и-Verben **-ел** (одел, видел), viele е-Verben **-ел** (пиел, јадел); unregelmäßig: **дошол, дошла** (дојде), **рекол, рекла** (рече), **можел** (може).
    mistakes: ["Kein Hilfsverb in der 3. Person.", "Die l-Form richtet sich nach dem Geschlecht des Sprechers."]
  a2-count-plural:
    meaning: "der Zählplural"
    intro: |
      Nach einer Zahl (und nach `колку` „wie viele“, `неколку` „einige“) nehmen maskuline Nomen für **Dinge** einen besonderen Plural auf **-а**: **два стола** (nicht *столови*), **пет дена**, **неколку часа**. Feminine und neutrale Nomen nehmen ihren normalen Plural: **две книги**.

      Maskuline Nomen für **Personen** nicht: **три студенти**, oder mit den Personenzahlwörtern **тројца студенти** (B2).
    mistakes: ["Maskulines Ding nach einer Zahl: -а."]
  a2-ordinals:
    meaning: "Ordnungszahlen und Datum"
    intro: |
      Ordnungszahlen sind Adjektive (**прв, прва, прво, први**) und haben meist den Artikel: **првиот ден** „der erste Tag“. Ab fünf enden sie auf **-ти**: `петти`, `шести`, `седми`, `осми`, `деветти`, `десетти`.

      Daten nehmen die maskuline Ordnungszahl und den Monat: **први мај** „1. Mai“, **на петти март** „am 5. März“; **Денес е дваесет и први.** „Heute ist der Einundzwanzigste.“
    mistakes: ["Ordnungszahlen ab fünf haben -ти: петти."]
  a2-time:
    meaning: "die Uhrzeit"
    intro: |
      **Колку е часот?** „Wie spät ist es?“ — **Часот е пет.** „Es ist fünf.“ *Um fünf* heißt **во пет (часот)**. Minuten nach der vollen Stunde mit **и** (*und*), davor mit **без** (*ohne*): **пет и десет** 5:10, **пет и половина** 5:30, **шест без петнаесет** 5:45 („sechs ohne fünfzehn“).
  a2-prox-dist:
    meaning: "die Artikel für nah und fern"
    intro: |
      Neben **-от / -та / -то** (*der/die/das*) hat das Mazedonische zwei weitere Artikel, die keine andere Balkan-Standardsprache kennt: **-ов / -ва / -во / -ве** für etwas **bei mir** („dieser … hier“) und **-он / -на / -но / -не** für etwas **weit weg** („jener … dort“). **Книгава е моја.** „Dieses Buch hier gehört mir.“ **Куќана е стара.** „Das Haus dort ist alt.“ In der gesprochenen Sprache sind sie häufig.
