# German text of the Macedonian lessons added 2026-10-27 — translated by AI (Claude) from the English
topics:
  Linking and quantity: "Verbinden und Mengen"
  Saying how, and whose: "Wie, und wessen"
lessons:
  a1-conjunctions:
    meaning: "und, aber, oder: и, а, но, или — und der Unterschied zwischen а und но"
    intro: |
      **и** „und“ fügt hinzu: **Марко и Ана**. **или** „oder“: **чај или кафе?**

      Das Mazedonische hat zwei Wörter, wo das Deutsche *und* oder *aber* sagt:

      - **а** stellt zwei Dinge nebeneinander, oft im Gegensatz, ohne dass eines das andere aufhebt: **Јас сум од Скопје, а таа е од Битола.** „Ich bin aus Skopje, und sie ist aus Bitola.“
      - **но** sagt, dass das Folgende der Erwartung widerspricht: **Сакам да дојдам, но немам време.** „Ich würde gern kommen, aber ich habe keine Zeit.“

      **туку** „sondern“ berichtigt eine Verneinung: **Не е чај, туку кафе.** „Es ist kein Tee, sondern Kaffee.“ — wie deutsch *sondern*.
    mistakes: ["Zwei Tatsachen nebeneinander: а; но steht für das Unerwartete.", "Nach einer Verneinung heißt die Berichtigung туку (sondern)."]
  a1-quantity:
    meaning: "wie viel: колку, многу, малку, доста, неколку, по"
    intro: |
      **колку** fragt „wie viel / wie viele“: **Колку чини?** „Wie viel kostet das?“ **Колку години имаш?** „Wie alt bist du?“

      Mengenwörter stehen direkt vor dem Nomen: **многу луѓе** „viele Leute“, **малку вода** „ein wenig Wasser“, **доста време** „genug Zeit“, **неколку денови** „ein paar Tage“.

      Bei zählbaren Maskulina nach Zahlen und **неколку** steht der Zählplural: **неколку стола**.

      **по** verteilt: **Земи по две јаболка.** „Nimm je zwei Äpfel.“ — wie deutsch *je*.

      **многу** heißt auch „sehr“: **многу убаво**.
    mistakes: ["Kein Wort für „von“ nach einem Mengenwort."]
  a2-adverbs:
    meaning: "Adverbien: aus Adjektiven auf -о, und des Ortes und der Zeit"
    intro: |
      Die meisten Adverbien der Art und Weise sind die **neutrale Form des Adjektivs** auf **-о**: **брз → брзо**, **добар → добро**, **убав → убаво**, **тивок → тивко**. **Зборува брзо.** „Er spricht schnell.“

      Dieselbe Form antwortet auf „wie ist es?“: **Убаво е.** „Es ist schön.“ **Студено ми е.** „Mir ist kalt.“

      Adjektive auf **-ски** ergeben Adverbien auf **-ски**: **Зборуваш ли македонски?**

      Ort: **тука / овде**, **таму**, **горе**, **долу**, **внатре**, **надвор**. Zeit: **сега**, **денес**, **утре**, **вчера**, **веќе** „schon“, **уште** „noch“, **секогаш**, **никогаш**.

      Steigerung wie beim Adjektiv: **побрзо**, **најбрзо**.
    mistakes: ["Wie jemand etwas tut, sagt die Form auf -о."]
  a2-svoj:
    meaning: "das Eigene: свој, своја, свое, свои — das reflexive Possessivum"
    intro: |
      **свој** heißt „sein eigener“ und verweist auf das **Subjekt** des Satzes:

      **Марко ја сака својата сестра.** „Marko liebt seine (eigene) Schwester.“

      **Марко ја сака неговата сестра** kann die Schwester eines anderen sein — **свој** beseitigt den Zweifel, den deutsch *seine* offen lässt.

      Es richtet sich nach dem Besitz und nimmt den Artikel wie ein Adjektiv: **својот брат**, **својата куќа**, **своето дете**, **своите пријатели**. Es gilt für jede Person: **Ги земав своите работи.** „Ich habe meine Sachen genommen.“

      Im Subjekt selbst steht es nicht: **Неговата сестра живее во Охрид.**
    mistakes: ["свој verweist auf ein Subjekt; es kann nicht selbst Teil davon sein."]
