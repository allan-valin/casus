# Arabic text of the Macedonian course, level A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The future and wanting: "المستقبل والإرادة"
  Commands: "الأمر"
  Short pronouns: "الضمائر القصيرة"
  Reflexive verbs: "الأفعال الانعكاسية"
  Comparing: "المقارنة"
  The past: "الماضي"
  Counting and time: "العدّ والوقت"
  This one and that one: "هذا وذاك"
lessons:
  a2-future:
    meaning: "المستقبل: سأفعل…"
    intro: |
      المستقبل هو الأداة `ќе` + **صيغ المضارع**: **Ќе одам.** «سأذهب». `ќе` لا تتغير؛ والفعل يدل على الشخص.

      الضمائر القصيرة للمفعول تأتي **بين** `ќе` والفعل: **Ќе го видам.** «سأراه».
    sections:
      usage: |
        - بعد `ќе` يُستعمل الفعل **التام** عادة لفعل واحد منجز (**Ќе ти кажам.** «سأخبرك»)، والفعل الناقص لفعل مستمر أو متكرر (**Ќе ти пишувам секој ден.** «سأكتب لك كل يوم»).
        - `ќе` تعبّر أيضًا عن ظنّ في الحاضر: **Ќе е дома.** «لا بد أنه في البيت».
    mistakes: ["ќе أولًا، ثم الضمير القصير، ثم الفعل.", "ќе + المضارع للمستقبل (ќе + الماضي الناقص تعني *كان سيفعل*، B1)."]
  a2-future-neg:
    meaning: "المستقبل المنفي: لن أفعل…"
    intro: |
      نفي `ќе` هو **нема да** + المضارع: **Нема да одам.** «لن أذهب». (ويُسمع أيضًا **Не ќе одам**، وهي أقدم وأدبية أكثر.)
    mistakes: ["إما нема да وإما не ќе — لا الاثنتان معًا."]
  a2-da:
    meaning: "أريد، أستطيع، يجب: да + المضارع"
    intro: |
      لا مصدر في المقدونية، فتُقال *أريد أن أذهب* حرفيًا «أريد **أن أذهب**» بفعلين مصرّفين، تمامًا كالعربية: **Сакам да одам.** وكلا الفعلين يحمل الشخص: **Сакаш да одиш.** «تريد أن تذهب».

      النمط نفسه بعد `може` (يستطيع)، و`мора` (يجب)، و`треба` (ينبغي، يحتاج)، و`почнува` (يبدأ)، و`знае` (يعرف كيف). و`треба` وغالبًا `мора` تبقيان بصيغة الغائب: **Треба да учам.** «عليّ أن أدرس».
    mistakes: ["*أريد أن أذهب*: الفعلان بصيغة المتكلم. (Сакам да одиш تعني *أريدك أن تذهب*.)", "да لازمة بين الفعلين."]
  a2-aspect:
    meaning: "الجهة: التام والناقص"
    intro: |
      كل فعل تقريبًا له **زوج**: فعل **ناقص** للحدث المستمر أو المتكرر أو العام، وفعل **تام** للحدث الواحد المنظور إليه كاملًا منجزًا.

      - `чита` / `прочита` يقرأ · `пишува` / `напише` يكتب · `купува` / `купи` يشتري · `кажува` / `каже` يقول · `доаѓа` / `дојде` يأتي · `враќа` / `врати` يُرجع

      القاعدة الأساسية: **الفعل التام لا يُستعمل وحده في المضارع**، لأن المضارع حدث مستمر. يأتي بعد **ќе، да، ако، кога** (المستقبل، الرغبات، الشرط) — **Ќе ја прочитам.** «سأقرؤه (إلى آخره)» — أما *الآن* فالناقص وحده: **Ја читам.** «أنا أقرؤه الآن».
    mistakes: ["الآن = ناقص.", "حدث واحد كامل في المستقبل = تام."]
  a2-imperative:
    meaning: "الأمر"
    intro: |
      يُصاغ الأمر من جذر المضارع:

      - بعد **صائت** (أفعال а، وأفعال е/и التي ينتهي جذرها بصائت): **-ј** / **-јте** — `чита` → **читај، читајте**؛ `пие` → **пиј، пијте**
      - بعد **ساكن**: **-и** / **-ете** — `оди` → **оди، одете**؛ `јаде` → **јади، јадете**؛ `дојде` → **дојди، дојдете**

      الضمائر القصيرة تأتي **بعد** فعل الأمر: **Дај ми го!** «أعطني إياه!» والطلب المهذب يستعمل الجمع غالبًا أو **Ве молам** «من فضلك». وللنهي: **не** + أمر الفعل الناقص (**Не пушете!**)، أو **немој / немојте да** + المضارع (**Немој да плачеш.** «لا تبكِ»).
    mistakes: ["بعد فعل الأمر تأتي الضمائر.", "النهي يستعمل الفعل الناقص."]
  a2-direct-clitics:
    meaning: "ضمائر المفعول: ـني، ـك، ـه، ـها…"
    intro: |
      ضمائر المفعول المباشر كلمات قصيرة تأتي **مباشرة قبل الفعل** (بعد `не`، `ќе`، `да`): **Те сакам.** «أحبك». **Не го знам.** «لا أعرفه».

      `го` = *ـه* (للمذكر والمحايد)، `ја` = *ـها*، `ги` = *ـهم*.
    sections:
      notes: |
        `не` تعني *ـنا* وتعني *لا*: **Не не гледаат.** «لا يروننا». الأولى هي النفي.
    mistakes: ["الضمير القصير يأتي قبل الفعل المصرّف."]
  a2-indirect-clitics:
    meaning: "ضمائر المفعول غير المباشر: لي، له…"
    intro: |
      للمفعول غير المباشر (*لي، له*) صيغ قصيرة خاصة، قبل الفعل أيضًا: **Ми рече.** «قال لي». **Му дадов книга.** «أعطيته كتابًا».

      لاحظ `ѝ` (*لها*) بعلامتها التي تميزها عن `и` «و».
    mistakes: ["*قلت له*: القول موجّه *إلى* شخص، فهو غير مباشر.", "*لها* هي ѝ، بالعلامة، قبل الفعل."]
  a2-clitic-pairs:
    meaning: "ضميران قصيران معًا"
    intro: |
      حين يكون المفعولان ضميرين قصيرين فالترتيب ثابت: **غير المباشر + المباشر + الفعل** — **Ми го даде.** «أعطاني إياه». ومع `не` و`ќе` قبلهما: **Не ми го даде.** · **Ќе ти ја донесам.**

      بعد فعل الأمر تتبعه المجموعة كلها: **Дај ми го!** · **Кажи ми ја вистината!**
    mistakes: ["غير المباشر أولًا."]
  a2-doubling:
    meaning: "تكرار المفعول"
    intro: |
      سمة لافتة: **المفعول المباشر المعرَّف** يُعلَن عنه أيضًا بضمير قصير — **Го видов Марко.** حرفيًا «رأيته ماركو». **Ја прочитав книгата.** «قرأت الكتاب». وبدون أداة تعريف (*كتابًا*) لا تكرار: **Прочитав книга.**

      و**المفعول غير المباشر** مع `на` يُكرَّر دائمًا: **Му реков на Марко.** «قلت لماركو». **Им дадов на децата.** «أعطيتُ (ـه) للأطفال».
    mistakes: ["الأسماء العَلَم والأسماء المعرّفة معرفة: كرِّرها.", "на + شخص يأتي دائمًا مع ضميره القصير."]
  a2-long-pronouns:
    meaning: "الضمائر الطويلة (المنبورة)"
    intro: |
      لكل ضمير قصير **صيغة طويلة** تُستعمل بعد حروف الجر — **со мене** «معي»، **за неа** «لها»، **кај нив** «عندهم» — وللتوكيد. وحين تُستعمل مفعولًا للتوكيد يبقى القصير أيضًا: **Мене ме бараат, не тебе.** «*أنا* من يبحثون عنه، لا أنت».
    mistakes: ["بعد حرف الجر الصيغة الطويلة وحدها.", "јас للفاعل فقط."]
  a2-dopagja:
    meaning: "يعجبني"
    intro: |
      *أحبّ / يعجبني* تُقال بالعكس، كما في العربية «يعجبني»: **Ми се допаѓа Охрид.** «تعجبني أوهريد». الشيء المُعجِب هو الفاعل، فيطابقه الفعل: **Ми се допаѓаат цвеќињата.** «تعجبني الزهور».

      الإطار نفسه: **ми треба** «أحتاج» (يلزمني)، **ми е студено** «أشعر بالبرد»، **ми е жал** «أنا آسف»، **ми се спие** «أشعر بالنعاس».
    mistakes: ["المُعجَب هو المفعول غير المباشر.", "فاعل جمع، فعل جمع."]
  a2-possessive-clitics:
    meaning: "أمي، أخوك: الملكية القصيرة"
    intro: |
      مع **كلمات القرابة** القريبة، يعني الضمير غير المباشر القصير **بعد** الاسم *ـي، ـك، ـه…*، ويكون الاسم **بلا أداة تعريف** — كالضمائر المتصلة في العربية: **мајка ми** «أمي»، **татко ти** «أبوك»، **сестра му** «أخته»، **баба ѝ** «جدتها». هذه هي الطريقة الطبيعية؛ و**мојата мајка** فيها توكيد.

      مع الأسماء الأخرى تُستعمل صيغة الملكية الكاملة (**мојата куќа**)، ويُسمع في الكلام أيضًا **куќата ми**.
    mistakes: ["لا أداة تعريف مع الملكية القصيرة على كلمات القرابة."]
  a2-reflexive:
    meaning: "النفس: се و си"
    intro: |
      `се` هو الضمير الانعكاسي *نفسه* (مباشر): **Се мијам.** «أغتسل». وكثير من الأفعال تلازمه دائمًا: **се вика** «يُسمّى» (**Како се викаш?** «ما اسمك؟»)، **се смее** «يضحك»، **се плаши** «يخاف»، **се враќа** «يعود».

      `си` هو الانعكاسي *لنفسه* (غير مباشر): **Си ги мијам рацете.** «أغسل يديّ». ويفيد أيضًا «الانصراف»: **Си одам.** «سأنصرف (إلى البيت)». وكلاهما يقف حيث تقف الضمائر القصيرة الأخرى.
    mistakes: ["بدون се تعني *أنادي آنا*."]
  a2-comparison:
    meaning: "التفضيل والتفضيل المطلق"
    intro: |
      المقارنة منتظمة: **по-** لـ*أكثر* و**нај-** لـ*الأكثر*، في الصفات والظروف معًا — `голем` → **по-голем** «أكبر» → **најголем** «الأكبر»؛ `добро` → **по-добро** → **најдобро**. و*من* (في المقارنة) هي **од**: **Таа е по-висока од мене.**

      الإملاء: **по-** بشرطة، و**нај-** متصلة بالكلمة.
    mistakes: ["*من* هي од؛ و по- بشرطة.", "*أكثر* من многу شاذة."]
  a2-sum-past:
    meaning: "كان، كانوا: ماضي сум"
    intro: |
      ماضي `сум`: **бев، беше، беше، бевме، бевте، беа**: **Бев дома.** «كنت في البيت». **Каде беше?** «أين كنت؟» ومثل `сум` لا تبدأ به الجملة في الكلام المحايد: **Болен бев.** أو **Јас бев болен.**
    mistakes: ["«نحن» تأخذ бевме."]
  a2-aorist:
    meaning: "الماضي البسيط (الأوريست): ما حدث مرة وانتهى"
    intro: |
      **الأوريست** يروي ما حدث في لحظة شهدها المتكلم أو يضمنها — وهو الزمن المعتاد للأحداث المنجزة: **Вчера купив кола.** «أمس اشتريت سيارة». ويُصاغ غالبًا من الأفعال **التامة**.

      اللواحق: **-в، —، —، -вме، -вте، -а** بعد صائت الجذر — أفعال а تحتفظ بـ **а** (прочитав)، وأفعال и بـ **и** (купив)، وأفعال е تتحول غالبًا إلى **о** في المتكلم والجمع (дојдов، дојде، дојдовме، дојдоа).
    mistakes: ["حدث ماضٍ منجز: الأوريست."]
  a2-imperfect:
    meaning: "الماضي الناقص: ما كان جاريًا، ما كان معتادًا"
    intro: |
      **الماضي الناقص** يصف الماضي مستمرًا أو متكررًا — الخلفية والعادات والأوصاف: **Кога бев мал, играв фудбал секој ден.** «حين كنت صغيرًا كنت ألعب كرة القدم كل يوم». ويُصاغ غالبًا من الأفعال **الناقصة**، مثل «كان يفعل» في العربية.

      اللواحق: **-в، -ше، -ше، -вме، -вте، -а**؛ وأفعال е وи تأخذ **е**: `оди` → **одев، одеше، одевме، одеа**.
    sections:
      contrast: |
        **Читав** книга кога **ѕвонеше** телефонот. «*كنت أقرأ* كتابًا حين *كان يرنّ* الهاتف». — **Ја прочитав** книгата. «*قرأتُ* الكتاب (أنهيته)». الناقص = المشهد؛ الأوريست = الحدث.
    mistakes: ["الماضي المتكرر = فعل ناقص في الماضي الناقص."]
  a2-l-form:
    meaning: "الماضي بـ сум + صيغة -л: قد فعلت، قد كنت"
    intro: |
      **صيغة -л** للفعل (`бил`، `видел`، `дошол`) تطابق في الجنس والعدد — **-л، -ла، -ло، -ле** — ومع مضارع `сум` تكوّن **الماضي غير المحدد**: **Сум бил во Охрид.** «قد زرتُ أوهريد». وفي **الغائب لا توجد сум**: **Тој бил во Охрид.**

      تُستعمل للتجارب بلا زمن محدد (*هل سبق أن…؟*) ولما **لم يشهده** المتكلم — وصيغة الغائب خاصة تعني كثيرًا «على ما يُقال» (B1).
    sections:
      notes: |
        صيغ -л: أفعال а **-ал** (читал)، أفعال и **-ел** (одел، видел)، وكثير من أفعال е **-ел** (пиел، јадел)؛ والشاذة: **дошол، дошла** (дојде)، **рекол، рекла** (рече)، **можел** (може).
    mistakes: ["لا فعل مساعد مع الغائب.", "صيغة -л تطابق جنس المتكلم."]
  a2-count-plural:
    meaning: "جمع العدّ"
    intro: |
      بعد العدد (وبعد `колку` «كم»، و`неколку` «بضعة») تأخذ الأسماء المذكرة الدالة على **أشياء** جمعًا خاصًا بـ **-а**: **два стола** (لا *столови*)، **пет дена**، **неколку часа**. والمؤنث والمحايد يأخذان جمعهما العادي: **две книги**.

      الأسماء المذكرة الدالة على **أشخاص** لا تأخذه: **три студенти**، أو مع أعداد الأشخاص **тројца студенти** (B2).
    mistakes: ["شيء مذكر بعد عدد: -а."]
  a2-ordinals:
    meaning: "الأعداد الترتيبية والتواريخ"
    intro: |
      الأعداد الترتيبية صفات (**прв، прва، прво، први**) وتأخذ عادة أداة التعريف: **првиот ден** «اليوم الأول». ومن الخامس فصاعدًا تنتهي بـ **-ти**: `петти`، `шести`، `седми`، `осми`، `деветти`، `десетти`.

      التواريخ تستعمل الترتيبي المذكر والشهر: **први мај** «الأول من مايو»، **на петти март** «في الخامس من مارس»؛ **Денес е дваесет и први.** «اليوم الحادي والعشرون».
    mistakes: ["الترتيبي من الخامس يأخذ -ти: петти."]
  a2-time:
    meaning: "الساعة"
    intro: |
      **Колку е часот?** «كم الساعة؟» — **Часот е пет.** «الساعة الخامسة». *في الخامسة* هي **во пет (часот)**. الدقائق بعد الساعة تُربط بـ **и** (*و*)، وقبلها بـ **без** (*إلا*): **пет и десет** 5:10، **пет и половина** 5:30، **шест без петнаесет** 5:45 («السادسة إلا ربعًا»).
  a2-prox-dist:
    meaning: "أداتا التعريف للقريب والبعيد"
    intro: |
      إلى جانب **-от / -та / -то** (*الـ*)، للمقدونية أداتان أخريان لا توجدان في أي لغة بلقانية معيارية أخرى: **-ов / -ва / -во / -ве** لشيء **قريب مني** («هذا… هنا») و**-он / -на / -но / -не** لشيء **بعيد** («ذاك… هناك»). **Книгава е моја.** «هذا الكتاب لي». **Куќана е стара.** «ذلك البيت هناك قديم». وهما شائعتان في الكلام.
