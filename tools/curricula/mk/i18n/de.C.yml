# German text of the Macedonian course, levels C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Reporting and doubting: "Berichten und Zweifeln"
  Clitic clusters: "Klitika-Ketten"
  Particles: "Partikeln"
  Formal style: "Formeller Stil"
  Shades of meaning: "Bedeutungsnuancen"
  Register and set phrases: "Register und feste Wendungen"
lessons:
  c1-renarrative-full:
    meaning: "der vollständige berichtende Modus"
    intro: |
      Der berichtende (renarrative) Modus hat für jede Zeit eine Form:

      - berichteter Aorist/Imperfekt: **дошол**, **одел** (B1)
      - berichtetes Perfekt / Plusquamperfekt: **бил дошол** „sei angeblich gekommen“, **имал направено**
      - berichtetes Futur: **ќе дојдел** „er werde kommen, heißt es“
      - berichteter Konditional: **ќе одел** „er würde angeblich gehen“

      In der Presse markiert er Abstand zu einer Behauptung: **Министерот бил запознаен.** „Der Minister sei informiert gewesen.“
  c1-ima-da:
    meaning: "има да: du wirst müssen, es wird ganz sicher"
    intro: |
      **има да** + Präsens drückt eine starke Pflicht oder Gewissheit aus, oft eine Drohung oder ein Versprechen: **Има да ми платиш!** „Das wirst du mir bezahlen!“ **Има да видиш.** „Du wirst schon sehen.“ Die Verneinung **нема да** ist das gewöhnliche verneinte Futur (A2).
  c1-clitic-clusters:
    meaning: "lange Klitika-Ketten und ihre Reihenfolge"
    intro: |
      Kurze Wörter reihen sich vor dem Verb in fester Ordnung:

      **не → би / ќе / да → си (reflexiv) → indirekt → direkt → сум-Form → Verb**

      **Не би ми го дал.** „Er würde es mir nicht geben.“ **Да не си ми го изгубил?** „Du hast es mir doch nicht etwa verloren?“ **Ќе ти ги донесам.** Nach einem Imperativ folgt alles: **Донеси ми ги!**
    mistakes: ["не immer zuerst.", "Indirekt vor direkt."]
  c1-particles:
    meaning: "Partikeln, die einen Satz färben"
    intro: |
      Kleine Wörter, die Haltung tragen:

      - **баш** genau, wirklich · **барем** wenigstens · **дури** sogar · **само** nur · **уште** noch, mehr · **веќе** schon · **пак** wieder · **сепак** dennoch · **сѐ уште** immer noch · **токму** genau · **речиси** fast · **нели** nicht wahr? · **ајде** komm schon
  c1-formal:
    meaning: "Verbalnomen und Partizipien im formellen Stil"
    intro: |
      Amtliches und journalistisches Mazedonisch packt Handlungen in **Verbalnomen** nach Präpositionen: **по потпишувањето на договорот** „nach der Unterzeichnung des Abkommens“, **при влегувањето** „beim Eintreten“, **за подобрување на условите** „zur Verbesserung der Bedingungen“, **со цел** „mit dem Ziel“. In der Alltagssprache sagt man dasselbe mit einem Nebensatz: **откако го потпишаа договорот**.
  c2-admirative:
    meaning: "Überraschung und Ironie mit der l-Form"
    intro: |
      Die l-Form mit **сум** im Präsens, über etwas **gerade Entdecktes**, drückt Überraschung aus (der *Admirativ*): **Ти си бил паметен!** „Na so was, du bist ja klug!“ **Ова било вкусно!** „Das ist ja lecker (hätte ich nicht gedacht)!“ Über eine angezweifelte Behauptung wird sie ironisch (*Dubitativ*): **Тој бил чесен, бил!** „Der und ehrlich? Na klar!“
  c2-aspect-politeness:
    meaning: "Aspekt in Befehlen: höflich oder drängend"
    intro: |
      In Befehlen ist das **Perfektiv** die neutrale Bitte um eine Handlung (**Седнете.** „Setzen Sie sich.“), während das **Imperfektiv** wärmer und einladend klingen kann — „nur zu“ (**Седнувајте, повелете!** „Setzen Sie sich doch, bitte!“) — oder ungeduldig, zum Anfangen drängend (**Јадете!** „Esst, los!“). Verneinte Befehle nehmen das Imperfektiv (**Не седнувајте тука.**).
  c2-register:
    meaning: "formelle und informelle Anrede"
    intro: |
      **Вие** (in Briefen groß geschrieben) ist das höfliche *Sie*, mit Pluralverben: **Како сте?** — aber Adjektive und l-Formen richten sich nach der Person: **Вие сте уморна?** (zu einer Frau). **Повелете** „bitte schön / bitte, nur zu / was darf es sein?“, **Ве молам** „bitte“, **господине / госпоѓо / госпоѓице** „mein Herr / gnädige Frau / Fräulein“. **Ти** gilt für Freunde, Familie, Kinder und zunehmend Kollegen.
  c2-set-phrases:
    meaning: "feste Wendungen des Alltags"
    intro: |
      Wendungen, die jeder benutzt: **Добар ден** (guten Tag), **Пријатно** (guten Appetit / auf Wiedersehen), **На здравје!** (Prost / Gesundheit), **Со среќа!** (viel Glück), **Нека ти е со среќа!** (Glückwunsch zu etwas Neuem), **Честит роденден!**, **Среќен пат!** (gute Reise), **Ајде** (komm / los / tschüss), **Нема врска** (macht nichts), **Се гледаме** (bis bald).
