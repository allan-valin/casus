# Arabic text of the Macedonian course, level B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Aspect in depth: "الجهة بتعمّق"
  People and addressing: "الأشخاص والنداء"
  Wishes and commands: "التمنّي والأمر"
  Word order and emphasis: "ترتيب الكلمات والتوكيد"
  Small words: "التصغير"
  The future perfect: "المستقبل التام"
lessons:
  b2-perfective-imperfect:
    meaning: "الأحداث المتكررة: الماضي الناقص من الفعل التام، وќе للعادة"
    intro: |
      يمكن أن يأتي الفعل التام في **الماضي الناقص** في موضع واحد: في جمل الأحداث الماضية **المتكررة**، غالبًا بعد **кога ќе / штом ќе / ако**: **Штом ќе седнеше, заспиваше.** «كلما جلس نام». كل جلوس حدث كامل (تام)، والسلسلة عادة (ماضٍ ناقص).

      وللحاضر النمط نفسه في العادات: **Кога ќе дојде, секогаш носи цвеќе.** «كلما جاءت أحضرت زهورًا».
    mistakes: ["المتكرر: ќе + الماضي الناقص من التام."]
  b2-prefixes:
    meaning: "سوابق تغيّر المعنى"
    intro: |
      السابقة تجعل الفعل تامًّا وكثيرًا ما تضيف معنى. من `пишува` «يكتب»: **напише** يكتب (حتى النهاية)، **препише** ينسخ، **потпише** يوقّع، **опише** يصف، **запише** يدوّن، يسجّل، **испише** ينسخ كاملًا، ينسحب. والسوابق نفسها تعمل في أفعال كثيرة: **пре-** إعادة/تجاوز، **по-** قليلًا / مدة، **за-** البدء، **из-** إخراج، **до-** حتى، **од-** ابتعاد.

      شركاؤها الناقصة تضيف **-ува**: препише → **препишува**، потпише → **потпишува**.
    mistakes: ["*يوقّع* هي потпише."]
  b2-personal-numerals:
    meaning: "أعداد لجماعات الأشخاص"
    intro: |
      لجماعات **الرجال أو الجماعات المختلطة** أعداد خاصة: **двајца** (اثنان)، **тројца** (ثلاثة)، **четворица** (أربعة)، **петмина**، **шестмина** … و**неколкумина** «بضعة أشخاص». والاسم بالجمع العادي: **двајца браќа**، **тројца студенти**. ومع أداة التعريف: **двајцата** «كلاهما».

      لـ*كلا*: **двата / двете** (للأشياء)، **обата / обете**، وللأشخاص **двајцата**.
    mistakes: ["الرجال: عدد الأشخاص."]
  b2-vocative:
    meaning: "حالة النداء: مناداة شخص"
    intro: |
      احتفظت الأسماء بلاحقة حالة واحدة: **النداء**. المذكر يأخذ **-е** (**брате**، **господине**، **Петре**) أو **-у** (**човеку**، **другару**)؛ والمؤنث المنتهي بـ -а يأخذ **-о** (**мајко**، **сестро**، **бабо**)، والأسماء المنتهية بـ -ка غالبًا **-е** (**Ленке**). والمحايد وكثير من الأسماء لا تتغير. شائع في الكلام، وفيه مودّة أو صراحة أكثر من الصيغة العادية.
  b2-neka:
    meaning: "ليفعلْ…، عسى…"
    intro: |
      **нека** + المضارع يعطي أمرًا أو تمنيًا **للغائب** (أو استسلامًا: *فليكن*): **Нека влезе.** «ليدخلْ». **Нека е со среќа!** «بالتوفيق!» **Нека биде така.** «فليكن كذلك».
  b2-da-wishes:
    meaning: "да + المضارع للتمنّي أو الأمر اللطيف"
    intro: |
      في أول الجملة، **да** + المضارع تمنٍّ أو أمر مخفّف: **Да живее Македонија!** «عاشت مقدونيا!» **Да не заборавиш!** «لا تنسَ!» **Да одиме.** «لنذهب». وفي السؤال تطلب النصيحة: **Да дојдам ли?** «هل آتي؟»
  b2-topic-doubling:
    meaning: "المفعول المقدَّم يحتفظ بضميره"
    intro: |
      ترتيب الكلمات حرّ، والمفعول المقدَّم للتوكيد أو موضوعًا يحتفظ بضميره القصير: **Книгата ја прочитав, филмот не го гледав.** «الكتابُ قرأتُه، والفيلمُ لم أشاهده». والمفعول المكمَّم يُكرَّر أيضًا: **Ги видов сите.** «رأيتهم جميعًا». **Секого го познава.** «يعرف الجميع».
    mistakes: ["المفعول المعرَّف قبل الفعل يُكرَّر دائمًا."]
  b2-impersonal:
    meaning: "се غير الشخصية: يُقال، لا يُعرف"
    intro: |
      **се** + الغائب المفرد تصوغ عبارة غير شخصية، كالمبني للمجهول: **Се зборува дека…** «يُقال إنّ…» **Не се знае.** «لا يُعرف». **Како се оди до центарот?** «كيف يُذهب إلى المركز؟» ومع ضمير غير مباشر تعبّر عن شعور لا إرادي: **Ми се спие.** «أشعر بالنعاس». **Не ми се работи.** «لا رغبة لي في العمل».
  b2-diminutives:
    meaning: "التصغير"
    intro: |
      صيغ التصغير (للصغر أو التحبّب) شائعة جدًا: **-че** (محايد) — `стол` → **столче**، `град` → **градче**؛ **-енце** — `дете` → **детенце**، `куче` → **кученце**؛ **-ичка / -шка** — `куќа` → **куќичка**، `рака` → **рачка**، `книга` → **книшка**. وبعضها صار كلمات عادية: **девојче** «فتاة»، **момче** «فتى».
  b2-future-perfect:
    meaning: "سيكون قد فعل"
    intro: |
      **ќе + има + الصفة الفعلية** أو **ќе + сум + صيغة -л**: **Додека дојдеш, ќе имам завршено.** «حين تأتي سأكون قد انتهيت». وأيضًا للظنّ في الماضي: **Ќе има заминато веќе.** «لا بد أنه قد غادر».
