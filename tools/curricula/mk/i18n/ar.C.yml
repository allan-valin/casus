# Arabic text of the Macedonian course, levels C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Reporting and doubting: "النقل والتشكيك"
  Clitic clusters: "سلاسل الضمائر القصيرة"
  Particles: "الأدوات"
  Formal style: "الأسلوب الرسمي"
  Shades of meaning: "ظلال المعنى"
  Register and set phrases: "مستوى الخطاب والعبارات الثابتة"
lessons:
  c1-renarrative-full:
    meaning: "صيغة النقل كاملة"
    intro: |
      لصيغة النقل (الرواية عن الغير) صيغة لكل زمن:

      - الأوريست/الناقص المنقول: **дошол**، **одел** (B1)
      - التام / الأسبق المنقول: **бил дошол** «كان قد جاء، على ما يُقال»، **имал направено**
      - المستقبل المنقول: **ќе дојдел** «سيأتي، كما يقولون»
      - الشرط المنقول: **ќе одел** «كان سيذهب، على ما يبدو»

      في الصحافة تدل على التحفّظ من الادعاء: **Министерот бил запознаен.** «كان الوزير، على ما يُقال، على علم».
  c1-ima-da:
    meaning: "има да: ستضطر، سيحدث حتمًا"
    intro: |
      **има да** + المضارع تعبّر عن إلزام قوي أو يقين، غالبًا تهديدًا أو وعدًا: **Има да ми платиш!** «ستدفع لي الثمن!» **Има да видиш.** «سترى». والنفي **нема да** هو المستقبل المنفي العادي (A2).
  c1-clitic-clusters:
    meaning: "سلاسل الضمائر القصيرة وترتيبها"
    intro: |
      الكلمات القصيرة تصطف قبل الفعل بترتيب ثابت:

      **не ← би / ќе / да ← си (انعكاسي) ← غير مباشر ← مباشر ← صيغة сум ← الفعل**

      **Не би ми го дал.** «ما كان ليعطيني إياه». **Да не си ми го изгубил?** «لا تقل إنك أضعته عليّ!» **Ќе ти ги донесам.** وبعد فعل الأمر يتبعه الكل: **Донеси ми ги!**
    mistakes: ["не أولًا دائمًا.", "غير المباشر قبل المباشر."]
  c1-particles:
    meaning: "أدوات تلوّن الجملة"
    intro: |
      كلمات صغيرة تحمل الموقف:

      - **баш** تمامًا، حقًا · **барем** على الأقل · **дури** حتى · **само** فقط · **уште** بعدُ، أيضًا · **веќе** قد، سابقًا · **пак** ثانيةً · **сепак** ومع ذلك · **сѐ уште** ما زال · **токму** بالضبط · **речиси** تقريبًا · **нели** أليس كذلك؟ · **ајде** هيّا
  c1-formal:
    meaning: "المصادر والصفات الفعلية في الأسلوب الرسمي"
    intro: |
      المقدونية الرسمية والصحفية تضع الأفعال في **مصادر** بعد حروف الجر: **по потпишувањето на договорот** «بعد توقيع الاتفاقية»، **при влегувањето** «عند الدخول»، **за подобрување на условите** «لتحسين الظروف»، **со цел** «بهدف». وفي الكلام اليومي يُقال الشيء نفسه بجملة: **откако го потпишаа договорот**.
  c2-admirative:
    meaning: "الدهشة والتهكّم بصيغة -л"
    intro: |
      صيغة -л مع **сум** في المضارع، عن أمر **اكتُشف للتو**، تعبّر عن الدهشة (*صيغة التعجب*): **Ти си бил паметен!** «ما أذكاك (لم أكن أعرف)!» **Ова било вкусно!** «هذا لذيذ (لم أتوقع)!» وعن ادعاء مشكوك فيه تصبح تهكّمًا (*صيغة التشكيك*): **Тој бил чесен, бил!** «هو أمين؟ طبعًا!»
  c2-aspect-politeness:
    meaning: "الجهة في الأمر: مهذّب أو مستعجل"
    intro: |
      في الأمر، **التام** هو الطلب المحايد لفعل واحد (**Седнете.** «اجلسوا»)، أما **الناقص** فقد يبدو أدفأ ودعوة — «تفضّلوا» (**Седнувајте, повелете!** «تفضّلوا بالجلوس!») — أو استعجالًا للبدء (**Јадете!** «كلوا، هيّا!»). والنهي يستعمل الناقص (**Не седнувајте тука.**).
  c2-register:
    meaning: "الخطاب الرسمي وغير الرسمي"
    intro: |
      **Вие** (بحرف كبير في الرسائل) هي صيغة الاحترام، مع الفعل بالجمع: **Како сте?** — لكن الصفات وصيغ -л تطابق الشخص: **Вие сте уморна?** (لامرأة). **Повелете** «تفضّل / تفضّلوا / بماذا أخدمك؟»، **Ве молам** «من فضلك»، **господине / госпоѓо / госпоѓице** «سيدي / سيدتي / آنستي». و**Ти** للأصدقاء والعائلة والأطفال، وبشكل متزايد للزملاء.
  c2-set-phrases:
    meaning: "عبارات يومية ثابتة"
    intro: |
      عبارات يستعملها كل متكلم: **Добар ден** (نهارك سعيد)، **Пријатно** (بالهناء / مع السلامة)، **На здравје!** (في صحتك / يرحمك الله)، **Со среќа!** (بالتوفيق)، **Нека ти е со среќа!** (مبروك على الجديد)، **Честит роденден!**، **Среќен пат!** (رحلة سعيدة)، **Ајде** (هيّا / لنذهب / إلى اللقاء)، **Нема врска** (لا بأس)، **Се гледаме** (نراك لاحقًا).
