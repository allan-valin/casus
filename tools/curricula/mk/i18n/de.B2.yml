# German text of the Macedonian course, level B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Aspect in depth: "Aspekt vertieft"
  People and addressing: "Personen und Anrede"
  Wishes and commands: "Wünsche und Aufforderungen"
  Word order and emphasis: "Wortstellung und Betonung"
  Small words: "Verkleinerungen"
  The future perfect: "Das Futur II"
lessons:
  b2-perfective-imperfect:
    meaning: "wiederholte Ereignisse: perfektives Imperfekt, gewohnheitsmäßiges ќе"
    intro: |
      Ein perfektives Verb kann an einer Stelle im **Imperfekt** stehen: in Sätzen über **wiederholte** vergangene Ereignisse, meist nach **кога ќе / штом ќе / ако**: **Штом ќе седнеше, заспиваше.** „Immer wenn er sich hinsetzte, schlief er ein.“ Jedes Hinsetzen ist ein ganzes Ereignis (perfektiv), die Reihe eine Gewohnheit (Imperfekt).

      Im Präsens gilt dasselbe Muster für Gewohnheiten: **Кога ќе дојде, секогаш носи цвеќе.** „Immer wenn sie kommt, bringt sie Blumen.“
    mistakes: ["Wiederholt: ќе + perfektives Imperfekt."]
  b2-prefixes:
    meaning: "Präfixe, die die Bedeutung ändern"
    intro: |
      Ein Präfix macht ein Verb perfektiv und fügt oft Bedeutung hinzu. Von `пишува` „schreiben“: **напише** (fertig) schreiben, **препише** abschreiben, **потпише** unterschreiben, **опише** beschreiben, **запише** notieren, einschreiben, **испише** ausschreiben, abmelden. Dieselben Präfixe wirken bei vielen Verben: **пре-** um-/über-, **по-** ein wenig / eine Weile, **за-** anfangen, **из-** aus-, **до-** bis zu, **од-** weg-.

      Ihre imperfektiven Partner nehmen **-ува**: препише → **препишува**, потпише → **потпишува**.
    mistakes: ["*unterschreiben* ist потпише."]
  b2-personal-numerals:
    meaning: "Zahlwörter für Personengruppen"
    intro: |
      Für Gruppen von **Männern oder gemischte Gruppen** hat das Mazedonische besondere Zahlwörter: **двајца** (zwei), **тројца** (drei), **четворица** (vier), **петмина**, **шестмина** … und **неколкумина** „einige Leute“. Das Nomen steht im normalen Plural: **двајца браќа**, **тројца студенти**. Mit Artikel: **двајцата** „die beiden“.

      Für *beide*: **двата / двете** (Dinge), **обата / обете**, und für Personen **двајцата**.
    mistakes: ["Männer: das Personenzahlwort."]
  b2-vocative:
    meaning: "der Vokativ: jemanden rufen"
    intro: |
      Nomen haben eine Kasusendung bewahrt: den **Vokativ**, zum Rufen und Anreden. Maskulina nehmen **-е** (**брате**, **господине**, **Петре**) oder **-у** (**човеку**, **другару**); Feminina auf -а nehmen **-о** (**мајко**, **сестро**, **бабо**), Namen auf -ка oft **-е** (**Ленке**). Neutra und viele Namen ändern sich nicht. In der Rede häufig, liebevoller oder direkter als die Grundform.
  b2-neka:
    meaning: "er soll …, möge …"
    intro: |
      **нека** + Präsens gibt eine Aufforderung oder einen Wunsch für eine **dritte Person** (oder ein ergebenes *soll es so sein*): **Нека влезе.** „Er soll hereinkommen.“ **Нека е со среќа!** „Viel Glück damit!“ **Нека биде така.** „So sei es.“
  b2-da-wishes:
    meaning: "да + Präsens als Wunsch oder milde Aufforderung"
    intro: |
      Am Satzanfang ist **да** + Präsens ein Wunsch oder eine abgeschwächte Aufforderung: **Да живее Македонија!** „Es lebe Mazedonien!“ **Да не заборавиш!** „Vergiss es nicht!“ **Да одиме.** „Gehen wir.“ In Fragen bittet es um Rat: **Да дојдам ли?** „Soll ich kommen?“
  b2-topic-doubling:
    meaning: "ein vorangestelltes Objekt behält sein Pronomen"
    intro: |
      Die Wortstellung ist frei, und ein Objekt, das zur Betonung oder als Thema **vorne** steht, behält sein kurzes Pronomen: **Книгата ја прочитав, филмот не го гледав.** „Das Buch habe ich gelesen, den Film nicht gesehen.“ Quantifizierte Objekte werden ebenfalls verdoppelt: **Ги видов сите.** „Ich habe sie alle gesehen.“ **Секого го познава.** „Er kennt jeden.“
    mistakes: ["Ein bestimmtes Objekt vor dem Verb wird immer verdoppelt."]
  b2-impersonal:
    meaning: "unpersönliches се: man sagt, man weiß nicht"
    intro: |
      **се** + 3. Person Singular macht eine unpersönliche Aussage, wie deutsches *man*: **Се зборува дека…** „Man sagt, dass …“ **Не се знае.** „Man weiß es nicht.“ **Како се оди до центарот?** „Wie kommt man ins Zentrum?“ Mit einem Dativpronomen drückt es ein unwillkürliches Gefühl aus: **Ми се спие.** „Ich bin müde.“ **Не ми се работи.** „Mir ist nicht nach Arbeiten.“
  b2-diminutives:
    meaning: "Verkleinerungsformen"
    intro: |
      Verkleinerungsformen (klein, lieb) sind sehr häufig: **-че** (neutral) — `стол` → **столче**, `град` → **градче**; **-енце** — `дете` → **детенце**, `куче` → **кученце**; **-ичка / -шка** — `куќа` → **куќичка**, `рака` → **рачка**, `книга` → **книшка**. Manche sind zu gewöhnlichen Wörtern geworden: **девојче** „Mädchen“, **момче** „Junge“.
  b2-future-perfect:
    meaning: "wird getan haben"
    intro: |
      **ќе + има + Verbaladjektiv** oder **ќе + сум + l-Form**: **Додека дојдеш, ќе имам завршено.** „Bis du kommst, werde ich fertig sein.“ Auch für Vermutungen über die Vergangenheit: **Ќе има заминато веќе.** „Er wird schon gegangen sein.“
