# Arabic text of the Macedonian lessons added 2026-10-27 — translated by AI (Claude) from the English
topics:
  Linking and quantity: "الربط والكمية"
  Saying how, and whose: "كيف، ولمن"
lessons:
  a1-conjunctions:
    meaning: "و، لكن، أو: и، а، но، или — والفرق بين а وно"
    intro: |
      **и** «و» تضيف: **Марко и Ана**. **или** «أو»: **чај или кафе?**

      للمقدونية كلمتان حيث تقول العربية «و» أو «لكن»:

      - **а** تضع أمرين جنبًا إلى جنب، غالبًا على سبيل المقابلة، دون أن يلغي أحدهما الآخر: **Јас сум од Скопје, а таа е од Битола.** «أنا من سكوبيه، وهي من بيتولا.»
      - **но** تقول إن ما يلي يخالف المتوقَّع: **Сакам да дојдам, но немам време.** «أودّ أن آتي، لكن ليس لديّ وقت.»

      **туку** «بل» تصحّح نفيًا: **Не е чај, туку кафе.** «ليس شايًا بل قهوة.»
    mistakes: ["أمران جنبًا إلى جنب: а؛ وно لما يخالف المتوقَّع.", "بعد النفي يكون التصحيح بـтуку (بل)."]
  a1-quantity:
    meaning: "كم: колку، многу، малку، доста، неколку، по"
    intro: |
      **колку** تسأل «كم»: **Колку чини?** «بكم هذا؟» **Колку години имаш?** «كم عمرك؟»

      كلمات الكمية تأتي قبل الاسم مباشرة: **многу луѓе** «ناس كثيرون»، **малку вода** «قليل من الماء»، **доста време** «وقت كافٍ»، **неколку денови** «بضعة أيام».

      مع المذكّر المعدود بعد الأعداد و**неколку** يُستعمل جمع العدّ: **неколку стола**.

      **по** للتوزيع: **Земи по две јаболка.** «خذ تفاحتين لكلّ واحد.»

      و**многу** تعني أيضًا «جدًّا»: **многу убаво**.
    mistakes: ["لا كلمة بمعنى «من» بعد كلمة الكمية."]
  a2-adverbs:
    meaning: "الظروف: المأخوذة من الصفات بـ-о، وظروف المكان والزمان"
    intro: |
      أغلب ظروف الحال هي **صيغة المحايد من الصفة** المنتهية بـ**-о**: **брз → брзо** «سريع ← بسرعة»، **добар → добро**، **убав → убаво**، **тивок → тивко**. **Зборува брзо.** «يتكلّم بسرعة.»

      والصيغة نفسها تجيب عن «كيف الحال؟»: **Убаво е.** «جميل.» **Студено ми е.** «أشعر بالبرد.»

      الصفات المنتهية بـ**-ски** تعطي ظروفًا بـ**-ски**: **Зборуваш ли македонски?** «هل تتكلّم المقدونية؟»

      المكان: **тука / овде** «هنا»، **таму** «هناك»، **горе**، **долу**، **внатре**، **надвор**. الزمان: **сега**، **денес**، **утре**، **вчера**، **веќе** «قد / سبق»، **уште** «لا يزال»، **секогаш**، **никогаш**.

      والتفضيل كما في الصفات: **побрзо**، **најбрзо**.
    mistakes: ["لوصف كيف يفعل أحد شيئًا تُستعمل صيغة -о."]
  a2-svoj:
    meaning: "الخاصّ بالمرء: свој، своја، свое، свои — ضمير الملكية العائد"
    intro: |
      **свој** تعني «الخاصّ به» وتعود إلى **فاعل** الجملة أيًّا كان:

      **Марко ја сака својата сестра.** «ماركو يحبّ أخته (هو).»

      أمّا **Марко ја сака неговата сестра** فقد تعني أخت شخص آخر — و**свој** تزيل اللبس.

      تطابق المملوك وتأخذ أداة التعريف كالصفة: **својот брат**، **својата куќа**، **своето дете**، **своите пријатели**. وتصلح لكل الضمائر: **Ги земав своите работи.** «أخذت أغراضي.»

      ولا تُستعمل في الفاعل نفسه: **Неговата сестра живее во Охрид.**
    mistakes: ["свој تعود إلى فاعل؛ ولا تكون جزءًا منه."]
