# German text of the Macedonian course, level A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Letters and sounds: "Buchstaben und Laute"
  Being and having: "Sein und Haben"
  The present tense: "Das Präsens"
  Nouns and the article: "Nomen und Artikel"
  Describing things: "Dinge beschreiben"
  People: "Personen"
  Numbers and time: "Zahlen und Zeit"
  Place: "Ort"
lessons:
  a1-alphabet:
    meaning: "das Alphabet, Rechtschreibung und Betonung"
    intro: |
      Mazedonisch wird mit einem eigenen kyrillischen Alphabet aus **31 Buchstaben** geschrieben, und zwar **so, wie es gesprochen wird**: ein Buchstabe, ein Laut, und jeder Buchstabe wird ausgesprochen. Wer die Buchstaben kennt, kann jedes Wort laut lesen.

      Die meisten Buchstaben entsprechen dem russischen oder serbischen Kyrillisch. Sieben verdienen Aufmerksamkeit: `ѓ` und `ќ` (weiches *g* und *k*, etwa wie *gj* und *kj*), `ѕ` (*ds*), `ј` (das *j* in „ja“), `љ` und `њ` (weiches *l* und *n*, wie in „Brillant“ und „Kognak“) und `џ` (*dsch* wie in „Dschungel“).
    sections:
      usage: |
        Die Betonung ist **fest**: In Wörtern mit drei oder mehr Silben liegt sie auf der **drittletzten Silbe**, in kürzeren Wörtern auf der ersten. Sie wird nie geschrieben.

        | Wort | Betonung |
        |---|---|
        | вода (Wasser) | **во**да |
        | македонски | ма**ке**донски |
        | водата (das Wasser) | во**да**та |

        Da der Artikel Teil des Wortes ist, verschiebt er die Betonung: **во**да → во**да**та, **чо**век → чо**ве**кот. Einige Lehnwörter behalten ihre eigene Betonung (z. B. литера**ту**ра).
    mistakes: ["Es sind weiche, palatale Laute: ќе ist *kje*, nicht *ke*.", "Zähle drei Silben vom Wortende."]
  a1-sum:
    meaning: "sein (ich bin, du bist …)"
    intro: |
      `сум` heißt *sein*. Das Subjektpronomen wird meist weggelassen, weil die Verbform schon sagt, wer gemeint ist: **Студент сум.** „Ich bin Student.“
    sections:
      usage: |
        - Die Formen sind kurz und **stehen** in normaler Rede **nie am Satzanfang**: Sag **Студент сум** oder **Јас сум студент**, nicht *Сум студент*.
        - `Вие сте` ist auch das höfliche *Sie* für eine Person.
        - Die 3. Person `е` und der Plural `се` sehen aus wie andere Wörter (`е` „äh“, `се` „sich“); der Satz macht es klar.
    mistakes: ["Jede Person hat ihre eigene Form; е gilt nur für er/sie/es.", "Die Kurzform lehnt sich an ein Wort davor an."]
  a1-negation:
    meaning: "nicht; es gibt nicht"
    intro: |
      `не` steht **direkt vor dem Verb** (und vor den kurzen Pronomen, die daran hängen): **Не знам.** „Ich weiß nicht.“ Mazedonisch behält die doppelte Verneinung: **Никој не дојде.** „Niemand kam“ (wörtlich „niemand kam nicht“).

      `нема` ist die Verneinung von `има` „es gibt“: **Нема леб.** „Es gibt kein Brot.“ Mit `да` bildet es auch das verneinte Futur (Lektion A2).
    mistakes: ["не steht auch vor den kurzen Pronomen.", "не + има wird immer нема geschrieben."]
  a1-imam:
    meaning: "haben; es gibt"
    intro: |
      `имам` „ich habe“ ist ein а-Verb (nächste Lektion) mit einer eigenen Verneinung: `немам` „ich habe nicht“. Die 3. Person `има` / `нема` bedeutet auch *es gibt / es gibt nicht*: **Има кафе?** „Gibt es Kaffee?“
  a1-pres-a:
    meaning: "Präsens der а-Verben"
    intro: |
      Wörterbücher führen ein mazedonisches Verb in der **3. Person Singular** des Präsens („er liest“), weil es keinen Infinitiv gibt. Der Vokal am Ende ordnet das Verb einer von drei Gruppen zu: **а**, **е** oder **и**.

      Die а-Gruppe ist die größte und regelmäßigste: Nimm `чита` „liest“ und füge die Endungen an. Jede 1. Person Singular im Präsens endet auf **-м**.
    sections:
      notes: |
        Viele Verben auf **-ува** gehören hierher: `зборува` (sprechen), `пишува` (schreiben), `купува` (kaufen), `патува` (reisen). Außerdem `гледа` (schauen), `чека` (warten), `сака` (wollen, lieben), `игра` (spielen).
    mistakes: ["Sie (Plural) haben -аат."]
  a1-pres-e:
    meaning: "Präsens der е-Verben"
    intro: |
      Verben, deren Wörterbuchform auf **-е** endet, haben **-е-** in den mittleren Personen und **-ам / -ат** an den Rändern. Nach einem Vokal erscheint `ј`, wo zwei Vokale zusammenträfen: `пие` → `пијам`, `пијат`.
    sections:
      notes: |
        Ebenso: `живее` (lebt: живеам, живееш …), `пере` (wäscht), `плете` (strickt), `тресе` (schüttelt), `може` (kann: можам, можеш … можат), `дојде` (kommt, perfektiv).
    mistakes: ["„Ich“ endet im Präsens immer auf -ам/-м, auch bei е-Verben."]
  a1-pres-i:
    meaning: "Präsens der и-Verben"
    intro: |
      Verben auf **-и** behalten **-и-** in den mittleren Personen; die 1. Person Singular ist trotzdem **-ам** und *sie* (Plural) ist **-ат**.
    sections:
      contrast: |
        | | а-Verben | е-Verben | и-Verben |
        |---|---|---|---|
        | ich | -ам | -ам | -ам |
        | du | -аш | -еш | -иш |
        | er/sie | -а | -е | -и |
        | wir | -аме | -еме | -име |
        | ihr | -ате | -ете | -ите |
        | sie | -аат | -ат | -ат |
  a1-questions:
    meaning: "Ja/Nein-Fragen"
    intro: |
      Eine Ja/Nein-Frage wird auf zwei Arten gebildet:

      - `ли` **nach dem ersten Wort**, nach dem man fragt, meist dem Verb: **Зборуваш ли македонски?**
      - `Дали` **am Anfang**, mit normaler Wortstellung: **Дали зборуваш македонски?**

      Gesprochen genügt auch steigende Intonation: **Зборуваш македонски?**
    mistakes: ["ли steht nie am Satzanfang; es folgt dem erfragten Wort.", "Nimm das eine oder das andere."]
  a1-question-words:
    meaning: "Fragewörter"
    intro: |
      Das Fragewort steht zuerst, wie im Deutschen. `кој` „wer, welcher“ richtet sich nach dem Erfragten: `кој` (m.), `која` (f.), `кое` (n.), `кои` (Pl.).
  a1-gender:
    meaning: "Genus: maskulin, feminin, neutral"
    intro: |
      Jedes Nomen ist maskulin, feminin oder neutral, und meist verrät die Endung, welches:

      - **maskulin**: ein Konsonant — `стол` (Stuhl), `град` (Stadt); einige Männer auf -о/-а: `татко` (Vater), `колега` (Kollege)
      - **feminin**: **-а** — `жена` (Frau), `книга` (Buch); dazu einige auf Konsonant, meist Abstrakta auf **-ост/-ест** sowie `ноќ` (Nacht), `крв` (Blut), `сол` (Salz)
      - **neutral**: **-о** oder **-е** — `село` (Dorf), `дете` (Kind), `море` (Meer)

      Adjektive, Artikel und *dieser/jener* folgen dem Genus: `нов стол`, `нова книга`, `ново село`.
    mistakes: ["книга endet auf -а: feminin.", "Männer sind maskulin, egal welche Endung."]
  a1-plural:
    meaning: "Plural der Nomen"
    intro: |
      Der Plural hängt vom Genus ab:

      - **maskulin**, einsilbig: **-ови** (nach weichem Konsonanten **-еви**) — `град` → `градови`, `нож` → `ножеви`; mehrsilbig: **-и** — `студент` → `студенти`. Vor -и wechseln к/г/х: `ученик` → `ученици`, `бубрег` → `бубрези`.
      - **feminin**: **-а → -и** — `жена` → `жени`, `книга` → `книги`; Konsonantennomen hängen -и an: `ноќ` → `ноќи`.
      - **neutral**: **-о → -а** — `село` → `села`; **-е → -иња** — `море` → `мориња`, `кафе` → `кафиња`; **-це → -ца**: `јајце` → `јајца`.

      Einige sind unregelmäßig und sehr häufig: `човек` → `луѓе` (Leute), `дете` → `деца` (Kinder), `брат` → `браќа`, `око` → `очи`, `уво` → `уши`.
    mistakes: ["Der Plural von човек ist ein anderes Wort.", "к wird vor dem Plural-и zu ц."]
  a1-article:
    meaning: "der bestimmte Artikel"
    intro: |
      Mazedonisch hat kein eigenes Wort für *der/die/das*: Der Artikel ist eine **Endung** am Nomen. Welche, hängt von der **Form des Nomens** ab, nicht nur vom Genus:

      - maskulin auf Konsonant: **-от** — `стол` → `столот`
      - feminin, und maskulin auf -а: **-та** — `жена` → `жената`, `колега` → `колегата`
      - neutral, und maskulin auf -о: **-то** — `село` → `селото`, `татко` → `таткото`
      - Plural auf -и: **-те** — `столови` → `столовите`, `жени` → `жените`
      - Plural auf -а: **-та** — `села` → `селата`, `деца` → `децата`

      Einen unbestimmten Artikel gibt es nicht; `еден / една / едно` „ein(s)“ steht, wenn *ein bestimmter* gemeint ist.
    sections:
      usage: |
        Der Artikel wird ähnlich wie im Deutschen gebraucht — für Bekanntes oder schon Erwähntes (**Каде е клучот?** „Wo ist der Schlüssel?“) —, aber **nicht** bei Eigennamen und **nicht** nach Präpositionen, wenn die Bedeutung allgemein ist (**во град** „in einer Stadt“, **во градот** „in der Stadt“).

        Verwandtschaftswörter mit kurzem Possessiv haben keinen Artikel: **мајка ми** „meine Mutter“ (Lektion A2).
    mistakes: ["Maskulina auf -о bekommen -то.", "Plurale auf -а bekommen -та."]
  a1-adjectives:
    meaning: "Adjektive und Kongruenz"
    intro: |
      Ein Adjektiv steht **vor** seinem Nomen und richtet sich danach: maskulin ohne Endung, feminin **-а**, neutral **-о**, Plural **-и** (für alle Genera).

      Maskuline Adjektive haben oft einen flüchtigen Vokal, der in den anderen Formen ausfällt: `добар` → `добра, добро, добри`; `мал` bleibt einfach: `мала, мало, мали`. Viele Adjektive auf **-ски** behalten durchweg -и: `македонски, македонска, македонско, македонски`.
    mistakes: ["Das flüchtige -а- von добар fällt in den anderen Formen aus.", "Der Plural ist -и für jedes Genus."]
  a1-adj-article:
    meaning: "der Artikel steht am ersten Wort"
    intro: |
      Steht ein Adjektiv vor dem Nomen, wandert der Artikel ans **Adjektiv** — das erste Wort der Gruppe — und das Nomen bleibt ohne: `стол` → `столот`, aber `нов стол` → **новиот стол**.

      Maskuline Adjektive nehmen **-иот** (`новиот`, `добриот`); die anderen Formen nehmen denselben Artikel wie Nomen: `новата`, `новото`, `новите`.
    mistakes: ["Nur das erste Wort bekommt den Artikel.", "Maskuline Adjektive bekommen -иот."]
  a1-demonstratives:
    meaning: "dieser, jener, der dort drüben"
    intro: |
      Drei Entfernungen:

      - `овој` — **dieser**, bei mir
      - `тој` — **der/jener**, über den wir sprechen (auch *er / sie / es*)
      - `оној` — **der dort drüben**, weit weg

      Sie richten sich nach dem Nomen, und das Nomen danach hat keinen Artikel: **овој стол** „dieser Stuhl“.
    sections:
      notes: |
        `ова` und `тоа` allein bedeuten *das hier* und *das*: **Што е ова?** „Was ist das?“ — **Тоа е мојот брат.** „Das ist mein Bruder.“
    mistakes: ["Kein Artikel nach einem Demonstrativ."]
  a1-possessives:
    meaning: "mein, dein, sein, ihr …"
    intro: |
      Possessive richten sich nach dem **Besessenen**, wie Adjektive, und bekommen meist den Artikel: **мојот брат** „mein Bruder“, **мојата сестра** „meine Schwester“, **моето дете**, **моите пријатели**.

      *Sein* und *ihr* sind verschiedene Wörter: `негов` (sein) und `нејзин` (ihr).
    mistakes: ["Nach dem Besessenen richten und den Artikel anfügen.", "Die Besitzerin ist eine Frau: нејзин."]
  a1-pronouns:
    meaning: "Subjektpronomen"
    intro: |
      Die Subjektpronomen werden meist **weggelassen**, weil die Verbendung die Person zeigt: **Одам дома.** „Ich gehe nach Hause.“ Man verwendet sie zur Betonung oder für Kontrast: **Јас одам, ти остануваш.** „*Ich* gehe, *du* bleibst.“

      `вие` ist sowohl *ihr* als auch das höfliche *Sie* für eine Person.
  a1-numbers:
    meaning: "Zahlen 1–100"
    intro: |
      *Eins* richtet sich nach dem Nomen: `еден` (m.), `една` (f.), `едно` (n.). *Zwei* lautet `два` bei maskulinen Nomen und `две` bei femininen und neutralen. Ab drei ändern sich die Zahlen nicht.

      Die Zehner-Zahlen bis 19 enden auf **-наесет** (`единаесет` 11, `дванаесет` 12), die Zehner auf **-есет / -десет** (`дваесет` 20, `триесет` 30, `педесет` 50), und Zusammensetzungen werden mit **и** verbunden: `дваесет и пет` 25.

      Nach einer Zahl bekommen maskuline Dinge einen besonderen **Zählplural** auf **-а**: `два стола` „zwei Stühle“ (mehr in A2).
    mistakes: ["две für feminin und neutral.", "Eins richtet sich nach dem Genus."]
  a1-days:
    meaning: "Tage und Zeitwörter"
    intro: |
      *Am Montag* heißt **во понеделник**; *jeden Montag* **секој понеделник** oder **понеделниците**. *Heute, morgen, gestern* sind `денес`, `утре`, `вчера`; *jetzt* ist `сега`. Die Tage werden kleingeschrieben.
  a1-prepositions:
    meaning: "Präpositionen des Ortes und der Begleitung"
    intro: |
      Nomen ändern sich nach Präpositionen nicht (es gibt keine Kasus), also trägt allein die Präposition die Bedeutung:

      - `во` in — **во градот** „in der Stadt“
      - `на` auf, an, zu (auch *von*, und das indirekte Objekt) — **на масата** „auf dem Tisch“, **на море** „am Meer“
      - `кај` bei jemandem, nahe — **кај мене** „bei mir“, **кај Ана** „bei Ana“
      - `од` von, aus — **од Скопје** „aus Skopje“
      - `до` bis, nach, neben — **до центарот** „bis ins Zentrum“
      - `со` mit — **со пријател** „mit einem Freund“
      - `за` für, über — **за тебе** „für dich“
      - `без` ohne; `под` unter; `над` über; `пред` vor; `зад` hinter; `меѓу` zwischen
    sections:
      contrast: |
        **во** ist *drinnen* (во училиште, во Скопје), **на** ist *bei einem Ereignis oder an einem offenen Ort* (на работа, на пазар, на концерт). Bei Ländern und Städten **во**; bei Inseln, Bergen und dem Meer **на**.
    mistakes: ["Städte nehmen во.", "Arbeit, Unterricht, Markt: на."]
