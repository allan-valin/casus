id: B2
topics:

- title: {en: Taglish and Spanish, pt: Taglish e espanhol}
  lessons:
  - id: tl-loans
    title: mesa, kotse, Taglish
    meaning: {en: "Spanish loans and code-switching", pt: "empréstimos do espanhol e alternância de línguas"}
    intro:
      en: |
        Three centuries of Spanish left thousands of words (**mesa** table, **kotse** car, **bintana** window, numbers in prices and time: **alas tres** three o'clock); English is everywhere in **Taglish**, mixed within one sentence: **Mag-review tayo para sa exam.**
      pt: |
        Três séculos de espanhol deixaram milhares de palavras (**mesa** mesa, **kotse** carro, **bintana** janela, os números nos preços e nas horas: **alas tres** três horas); o inglês está em toda parte no **Taglish**, misturado na mesma frase: **Mag-review tayo para sa exam** (vamos revisar para a prova).
    examples:
    - ["Nasa mesa ang aklat.", "The book is on the table.", "O livro está na mesa.", "mesa"]
    match: {seq: [{word: [mesa, kotse, bintana, silya, kutsara, tinidor]}]}
    pool: [mesa, kotse, bintana]
