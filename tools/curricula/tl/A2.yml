id: A2
topics:

- title: {en: Modifiers, pt: Modificadores}
  lessons:
  - id: tl-linker
    title: bahay na malaki, malaking bahay
    meaning: {en: "the linker na / -ng", pt: "o ligador na / -ng"}
    intro:
      en: |
        A modifier is tied to its noun with **na**, or **-ng** after a vowel or n: **bahay na malaki** or **malaking bahay** (a big house), **wikang Tagalog** (the Tagalog language), **ang aking kapatid** (my sibling). The order is free; the linker always stands between.
      pt: |
        Um modificador se liga ao nome com **na**, ou **-ng** depois de vogal ou n: **bahay na malaki** ou **malaking bahay** (uma casa grande), **wikang Tagalog** (a língua tagalo), **ang aking kapatid** (meu irmão). A ordem é livre; o ligador sempre fica no meio.
    examples:
    - ["Maganda ang malaking bahay.", "The big house is beautiful.", "A casa grande é bonita.", "malaking"]
    match: {seq: [{word: [na, "-ng"]}]}
    pool: [na]
