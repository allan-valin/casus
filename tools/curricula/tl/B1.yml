id: B1
topics:

- title: {en: Clauses, pt: Orações}
  lessons:
  - id: tl-clauses
    title: na, kung, dahil, pero, kapag
    meaning: {en: "that, if, because, but, when", pt: "que, se, porque, mas, quando"}
    intro:
      en: |
        **na** also joins clauses: **Alam ko na darating siya** (I know that he'll come), **ang taong nakatira doon** (the person who lives there). **kung** (if, whether), **dahil / kasi** (because), **pero / ngunit** (but), **kapag / pag** (when), **para** (so that).
      pt: |
        **na** também liga orações: **Alam ko na darating siya** (sei que ele vem), **ang taong nakatira doon** (a pessoa que mora lá). **kung** (se), **dahil / kasi** (porque), **pero / ngunit** (mas), **kapag / pag** (quando), **para** (para que).
    examples:
    - ["Alam ko na darating siya.", "I know he will come.", "Sei que ele vem.", "na"]
    match: {seq: [{word: [kung, dahil, kasi, pero, ngunit, kapag, para]}]}
    pool: [kung, dahil, pero, kapag, para]
