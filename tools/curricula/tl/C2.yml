id: C2
topics:

- title: {en: History, pt: História}
  lessons:
  - id: tl-history
    title: Baybayin, Rizal, Filipino
    meaning: {en: "the old script, Rizal, Tagalog and Filipino", pt: "a escrita antiga, Rizal, tagalo e filipino"}
    intro:
      en: |
        Before the Spanish, Tagalog was written in **Baybayin** (ᜊᜌ᜔ᜊᜌᜒᜈ᜔), a syllabary now revived on signs and tattoos. José Rizal wrote his novels in Spanish; Francisco Balagtas's *Florante at Laura* (1838) is the Tagalog classic. **Filipino**, the national language since 1987, is standardised Tagalog.
      pt: |
        Antes dos espanhóis, o tagalo se escrevia em **Baybayin** (ᜊᜌ᜔ᜊᜌᜒᜈ᜔), um silabário hoje revivido em placas e tatuagens. José Rizal escreveu seus romances em espanhol; *Florante at Laura* (1838), de Francisco Balagtas, é o clássico tagalo. O **filipino**, língua nacional desde 1987, é o tagalo padronizado.
    examples:
    - ["Ang wikang Filipino ay batay sa Tagalog.", "The Filipino language is based on Tagalog.", "A língua filipina se baseia no tagalo.", "wikang"]
    match: {seq: [{word: [wika, wikang, tula, nobela, panitikan]}]}
    pool: [wika, tula, panitikan]
