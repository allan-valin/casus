# German text of the Tagalog course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Markers and pronouns: "Marker und Pronomen"
  Verbs: "Verben"
  Questions and negation: "Fragen und Verneinung"
  Modifiers: "Bestimmungen"
  Clauses: "Nebensätze"
  Taglish and Spanish: "Taglish und Spanisch"
  Word building: "Wortbildung"
  History: "Geschichte"
lessons:
  tl-ang-ng-sa:
    meaning: "jede Nominalphrase hat einen Marker"
    intro: |
      Tagalog markiert jede Nominalphrase: **ang** (das Topik, worum es im Satz geht), **ng** (*nang*: der andere Handelnde oder das Objekt), **sa** (Ort, Ziel, *zu*). Bei Namen: **si**, **ni**, **kay**. **Bumasa ang bata ng aklat** (das Kind las ein Buch), **Kumain si Maria sa bahay** (Maria aß zu Hause). Plural mit **mga**: **ang mga bata** (die Kinder).
  tl-pronouns:
    meaning: "drei Reihen von Pronomen"
    intro: |
      Pronomen gibt es in denselben drei Reihen: Topik **ako, ikaw / ka, siya, kami, tayo, kayo, sila**; ng-Reihe **ko, mo, niya, namin, natin, ninyo, nila** (auch *mein, dein*: **bahay ko** mein Haus); sa-Reihe **akin, iyo, kaniya…** (**sa akin** mir). **kami** = wir ohne dich, **tayo** = wir mit dir.
  tl-ay:
    meaning: "kein Verb „sein“; ay; po und opo"
    intro: |
      Das Prädikat zuerst, ohne *sein*: **Guro siya** (er ist Lehrer), **Maganda ang panahon** (das Wetter ist schön). **ay** dreht die Reihenfolge um: **Ang pangalan ko ay Maria** (mein Name ist Maria). Respekt: **po** / **opo** (ja) gegenüber Älteren: **Salamat po** (danke).
  tl-um:
    meaning: "-um-Verben und die drei Aspekte"
    intro: |
      Verben zeigen Aspekt, nicht Tempus: abgeschlossen **bumasa** (las), andauernd **bumabasa** (liest gerade), nicht begonnen **babasa** (wird lesen). Mit **-um-** (Fokus auf dem Handelnden) steht das Infix nach dem ersten Konsonanten: **basa → bumasa**, **kain → kumain**; die andauernde Form verdoppelt die erste Silbe.
  tl-mag:
    meaning: "mag-Verben"
    intro: |
      **mag-**-Verben: **magluto** (kochen) → **nagluto** (kochte), **nagluluto** (kocht gerade), **magluluto** (wird kochen). **Nagluluto ang nanay sa kusina** (die Mutter kocht in der Küche). Viele Verben aus dem Spanischen und Englischen nehmen mag-: **mag-aral** (lernen), **mag-text**.
  tl-focus:
    meaning: "Fokus: das Verb zeigt auf die ang-Phrase"
    intro: |
      Das Affix sagt, welche Phrase das Topik ist: Handelnder **-um- / mag-** (**Bumasa ang bata ng aklat** — das Kind las ein Buch), Objekt **-in** (**Binasa ng bata ang aklat** — das Buch wurde vom Kind gelesen, *das* Buch), Gegebenes **i-** (**Ibinigay ko ang regalo kay Juan** — ich gab Juan das Geschenk), Ort **-an** (**Pinuntahan namin ang parke** — wir gingen in den Park).
  tl-questions:
    meaning: "Fragewörter; ba"
    intro: |
      **ano** (was), **sino** (wer), **saan** (wo), **kailan** (wann), **bakit** (warum), **paano** (wie), **ilan** (wie viele), **magkano** (wie viel kostet). **ba** markiert die Frage: **Nagsasalita ka ba ng Ingles?** (sprichst du Englisch?)
  tl-hindi:
    meaning: "nicht, es gibt kein, tu nicht"
    intro: |
      **hindi** (nicht): **Hindi ko naiintindihan** (ich verstehe nicht); **wala** (es gibt kein, ich habe kein) gegenüber **may / mayroon** (es gibt): **Wala akong pera** (ich habe kein Geld); **huwag** (tu nicht): **Huwag kang umalis!** (geh nicht weg!). Pronomen rücken danach nach vorn: **hindi *ko*…**
  tl-linker:
    meaning: "der Verbinder na / -ng"
    intro: |
      Eine Bestimmung wird mit **na** an ihr Nomen gebunden, nach Vokal oder n mit **-ng**: **bahay na malaki** oder **malaking bahay** (ein großes Haus), **wikang Tagalog** (die Tagalog-Sprache), **ang aking kapatid** (mein Geschwister). Die Reihenfolge ist frei; der Verbinder steht immer dazwischen.
  tl-clauses:
    meaning: "dass, wenn, weil, aber, als"
    intro: |
      **na** verbindet auch Sätze: **Alam ko na darating siya** (ich weiß, dass er kommt), **ang taong nakatira doon** (die Person, die dort wohnt). **kung** (wenn, ob), **dahil / kasi** (weil), **pero / ngunit** (aber), **kapag / pag** (wenn, sobald), **para** (damit).
  tl-loans:
    meaning: "spanische Lehnwörter und Sprachmischung"
    intro: |
      Drei Jahrhunderte Spanisch hinterließen Tausende Wörter (**mesa** Tisch, **kotse** Auto, **bintana** Fenster, Zahlen bei Preisen und Uhrzeit: **alas tres** drei Uhr); Englisch ist überall im **Taglish**, im selben Satz gemischt: **Mag-review tayo para sa exam** (lass uns für die Prüfung wiederholen).
  tl-affixes:
    meaning: "Superlative, Abstrakta, Zweck"
    intro: |
      **pinaka-** am meisten (**pinakamaganda** der schönste), **ka-…-an** Abstrakta und Gruppen (**kalayaan** Freiheit, **kaibigan** Freund), **pang-** für (**pambansa** national, **pangkalahatan** allgemein), **ma-** Adjektive (**maganda** schön, **masaya** froh).
  tl-history:
    meaning: "die alte Schrift, Rizal, Tagalog und Filipino"
    intro: |
      Vor den Spaniern schrieb man Tagalog in **Baybayin** (ᜊᜌ᜔ᜊᜌᜒᜈ᜔), einer Silbenschrift, die heute auf Schildern und Tätowierungen wiederauflebt. José Rizal schrieb seine Romane auf Spanisch; Francisco Balagtas' *Florante at Laura* (1838) ist der Tagalog-Klassiker. **Filipino**, seit 1987 Nationalsprache, ist standardisiertes Tagalog.
