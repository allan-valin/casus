# Macedonian text of the Tagalog course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Markers and pronouns: "Маркери и заменки"
  Verbs: "Глаголи"
  Questions and negation: "Прашања и негација"
  Modifiers: "Определби"
  Clauses: "Реченици"
  Taglish and Spanish: "Таглиш и шпански"
  Word building: "Зборообразување"
  History: "Историја"
lessons:
  tl-ang-ng-sa:
    meaning: "секоја именска синтагма има маркер"
    intro: |
      Тагалог ја означува секоја именска синтагма: **ang** (темата, за што зборува реченицата), **ng** (*nang*: другиот вршител или објект), **sa** (место, цел, *кон*). Со имиња: **si**, **ni**, **kay**. **Bumasa ang bata ng aklat** (детето прочита книга), **Kumain si Maria sa bahay** (Марија јаде дома). Множина со **mga**: **ang mga bata** (децата).
  tl-pronouns:
    meaning: "три низи заменки"
    intro: |
      Заменките доаѓаат во истите три низи: тема **ako, ikaw / ka, siya, kami, tayo, kayo, sila**; ng-низа **ko, mo, niya, namin, natin, ninyo, nila** (и *мој, твој*: **bahay ko** мојата куќа); sa-низа **akin, iyo, kaniya…** (**sa akin** мене). **kami** = ние без тебе, **tayo** = ние со тебе.
  tl-ay:
    meaning: "нема глагол „сум“; ay; po и opo"
    intro: |
      Прирокот прв, без *сум*: **Guro siya** (тој е наставник), **Maganda ang panahon** (времето е убаво). **ay** го превртува редот: **Ang pangalan ko ay Maria** (моето име е Марија). Почит: **po** / **opo** (да) кон постарите: **Salamat po** (благодарам).
  tl-um:
    meaning: "глаголи со -um- и трите вида"
    intro: |
      Глаголите покажуваат вид, не време: завршено **bumasa** (прочита), во тек **bumabasa** (чита), непочнато **babasa** (ќе чита). Со **-um-** (фокус на вршителот) инфиксот оди по првата согласка: **basa → bumasa**, **kain → kumain**; формата во тек го удвојува првиот слог.
  tl-mag:
    meaning: "глаголи со mag-"
    intro: |
      Глаголи со **mag-**: **magluto** (готви) → **nagluto** (зготви), **nagluluto** (готви сега), **magluluto** (ќе готви). **Nagluluto ang nanay sa kusina** (мајката готви во кујната). Многу глаголи од шпански и англиски земаат mag-: **mag-aral** (учи), **mag-text**.
  tl-focus:
    meaning: "фокус: глаголот покажува кон синтагмата со ang"
    intro: |
      Афиксот кажува која синтагма е темата: вршител **-um- / mag-** (**Bumasa ang bata ng aklat** — детето прочита книга), објект **-in** (**Binasa ng bata ang aklat** — книгата ја прочита детето, *таа* книга), даденото **i-** (**Ibinigay ko ang regalo kay Juan** — му го дадов подарокот на Хуан), место **-an** (**Pinuntahan namin ang parke** — отидовме во паркот).
  tl-questions:
    meaning: "прашални зборови; ba"
    intro: |
      **ano** (што), **sino** (кој), **saan** (каде), **kailan** (кога), **bakit** (зошто), **paano** (како), **ilan** (колку), **magkano** (колку чини). **ba** го означува прашањето: **Nagsasalita ka ba ng Ingles?** (зборуваш ли англиски?)
  tl-hindi:
    meaning: "не, нема, немој"
    intro: |
      **hindi** (не): **Hindi ko naiintindihan** (не разбирам); **wala** (нема, немам) наспроти **may / mayroon** (има): **Wala akong pera** (немам пари); **huwag** (немој): **Huwag kang umalis!** (немој да заминеш!). Заменките скокаат напред по нив: **hindi *ko*…**
  tl-linker:
    meaning: "сврзувачот na / -ng"
    intro: |
      Определбата се врзува за именката со **na**, или со **-ng** по самогласка или n: **bahay na malaki** или **malaking bahay** (голема куќа), **wikang Tagalog** (тагалошкиот јазик), **ang aking kapatid** (мојот брат/сестра). Редот е слободен; сврзувачот секогаш стои меѓу нив.
  tl-clauses:
    meaning: "дека, ако, зашто, но, кога"
    intro: |
      **na** поврзува и реченици: **Alam ko na darating siya** (знам дека ќе дојде), **ang taong nakatira doon** (човекот што живее таму). **kung** (ако, дали), **dahil / kasi** (зашто), **pero / ngunit** (но), **kapag / pag** (кога), **para** (за да).
  tl-loans:
    meaning: "шпански заемки и мешање јазици"
    intro: |
      Три века шпански оставиле илјадници зборови (**mesa** маса, **kotse** кола, **bintana** прозорец, броевите во цените и часовите: **alas tres** три часот); англискиот е насекаде во **Таглиш**, измешан во иста реченица: **Mag-review tayo para sa exam** (ајде да повториме за испитот).
  tl-affixes:
    meaning: "суперлативи, апстрактни, намена"
    intro: |
      **pinaka-** нај- (**pinakamaganda** најубав), **ka-…-an** апстрактни и групи (**kalayaan** слобода, **kaibigan** пријател), **pang-** за (**pambansa** национален, **pangkalahatan** општ), **ma-** придавки (**maganda** убав, **masaya** среќен).
  tl-history:
    meaning: "старото писмо, Ризал, тагалог и филипински"
    intro: |
      Пред Шпанците, тагалог се пишувал со **Baybayin** (ᜊᜌ᜔ᜊᜌᜒᜈ᜔), слоговно писмо што денес оживува на натписи и тетоважи. Хозе Ризал ги пишувал романите на шпански; *Florante at Laura* (1838) од Франсиско Балагтас е тагалошкиот класик. **Филипинскиот**, национален јазик од 1987, е стандардизиран тагалог.
