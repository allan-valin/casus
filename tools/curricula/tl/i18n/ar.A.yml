# Arabic text of the Tagalog course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Markers and pronouns: "العلامات والضمائر"
  Verbs: "الأفعال"
  Questions and negation: "الأسئلة والنفي"
  Modifiers: "المحدِّدات"
  Clauses: "الجمل"
  Taglish and Spanish: "التاغلش والإسبانية"
  Word building: "بناء الكلمات"
  History: "التاريخ"
lessons:
  tl-ang-ng-sa:
    meaning: "لكل مركّب اسمي علامة"
    intro: |
      تضع التاغالوغية علامة لكل مركّب اسمي: **ang** (المحور، ما تتحدّث عنه الجملة)، **ng** (*nang*: الفاعل أو المفعول الآخر)، **sa** (المكان، الغاية، *إلى*). ومع الأعلام: **si**، **ni**، **kay**. **Bumasa ang bata ng aklat** (قرأ الطفل كتابًا)، **Kumain si Maria sa bahay** (أكلت ماريا في البيت). والجمع بـ**mga**: **ang mga bata** (الأطفال).
  tl-pronouns:
    meaning: "ثلاث مجموعات من الضمائر"
    intro: |
      الضمائر في المجموعات الثلاث نفسها: المحور **ako, ikaw / ka, siya, kami, tayo, kayo, sila**؛ مجموعة ng **ko, mo, niya, namin, natin, ninyo, nila** (وتعني أيضًا *ـي، ـك*: **bahay ko** بيتي)؛ مجموعة sa **akin, iyo, kaniya…** (**sa akin** لي). **kami** = نحن بدونك، **tayo** = نحن معك.
  tl-ay:
    meaning: "لا فعل للكون؛ ay؛ po وopo"
    intro: |
      الخبر أولًا بلا فعل كون: **Guro siya** (هو معلّم)، **Maganda ang panahon** (الجو جميل). و**ay** تعكس الترتيب: **Ang pangalan ko ay Maria** (اسمي ماريا). وللاحترام **po** / **opo** (نعم) مع الكبار: **Salamat po** (شكرًا).
  tl-um:
    meaning: "أفعال -um- والجهات الثلاث"
    intro: |
      الفعل يبيّن الجهة لا الزمن: المنتهي **bumasa** (قرأ)، والجاري **bumabasa** (يقرأ)، وما لم يبدأ **babasa** (سيقرأ). ومع **-um-** (التركيز على الفاعل) يدخل الحشو بعد الصامت الأول: **basa → bumasa**، **kain → kumain**؛ والصيغة الجارية تكرّر المقطع الأول.
  tl-mag:
    meaning: "أفعال mag-"
    intro: |
      أفعال **mag-**: **magluto** (طبخ) ← **nagluto** (طبخ، انتهى)، **nagluluto** (يطبخ)، **magluluto** (سيطبخ). **Nagluluto ang nanay sa kusina** (الأم تطبخ في المطبخ). وكثير من الأفعال المأخوذة من الإسبانية والإنجليزية تأخذ mag-: **mag-aral** (درس)، **mag-text**.
  tl-focus:
    meaning: "التركيز: الفعل يشير إلى مركّب ang"
    intro: |
      الزائدة تبيّن أيّ مركّب هو المحور: الفاعل **-um- / mag-** (**Bumasa ang bata ng aklat** — قرأ الطفل كتابًا)، المفعول **-in** (**Binasa ng bata ang aklat** — قرأ الطفل الكتاب، *ذلك* الكتاب)، المُعطى **i-** (**Ibinigay ko ang regalo kay Juan** — أعطيت الهدية لخوان)، المكان **-an** (**Pinuntahan namin ang parke** — ذهبنا إلى الحديقة).
  tl-questions:
    meaning: "أدوات الاستفهام؛ ba"
    intro: |
      **ano** (ماذا)، **sino** (من)، **saan** (أين)، **kailan** (متى)، **bakit** (لماذا)، **paano** (كيف)، **ilan** (كم)، **magkano** (بكم). و**ba** علامة السؤال: **Nagsasalita ka ba ng Ingles?** (هل تتكلّم الإنجليزية؟)
  tl-hindi:
    meaning: "لا، لا يوجد، لا تفعل"
    intro: |
      **hindi** (لا): **Hindi ko naiintindihan** (لا أفهم)؛ **wala** (لا يوجد، ليس عندي) مقابل **may / mayroon** (يوجد): **Wala akong pera** (ليس معي مال)؛ **huwag** (لا تفعل): **Huwag kang umalis!** (لا تذهب!). والضمائر تتقدّم بعدها: **hindi *ko*…**
  tl-linker:
    meaning: "الرابط na / -ng"
    intro: |
      يُربط المحدِّد باسمه بـ**na**، أو بـ**-ng** بعد حركة أو n: **bahay na malaki** أو **malaking bahay** (بيت كبير)، **wikang Tagalog** (اللغة التاغالوغية)، **ang aking kapatid** (أخي). والترتيب حرّ؛ والرابط دائمًا بينهما.
  tl-clauses:
    meaning: "أنّ، إذا، لأنّ، لكن، عندما"
    intro: |
      **na** تربط الجمل أيضًا: **Alam ko na darating siya** (أعرف أنه سيأتي)، **ang taong nakatira doon** (الشخص الذي يسكن هناك). **kung** (إذا، هل)، **dahil / kasi** (لأنّ)، **pero / ngunit** (لكن)، **kapag / pag** (عندما)، **para** (لكي).
  tl-loans:
    meaning: "الدخيل الإسباني وخلط اللغات"
    intro: |
      ثلاثة قرون من الإسبانية تركت آلاف الكلمات (**mesa** طاولة، **kotse** سيارة، **bintana** نافذة، والأعداد في الأسعار والساعات: **alas tres** الساعة الثالثة)؛ والإنجليزية حاضرة في كل مكان في **التاغلش**، مخلوطة في الجملة الواحدة: **Mag-review tayo para sa exam** (لنراجع للامتحان).
  tl-affixes:
    meaning: "التفضيل، المجرّدات، الغاية"
    intro: |
      **pinaka-** الأكثر (**pinakamaganda** الأجمل)، **ka-…-an** المجرّدات والجماعات (**kalayaan** الحرّية، **kaibigan** صديق)، **pang-** لأجل (**pambansa** وطني، **pangkalahatan** عام)، **ma-** للصفات (**maganda** جميل، **masaya** سعيد).
  tl-history:
    meaning: "الخط القديم، ريزال، التاغالوغية والفلبينية"
    intro: |
      قبل الإسبان كانت التاغالوغية تُكتب بـ**Baybayin** (ᜊᜌ᜔ᜊᜌᜒᜈ᜔)، وهو خط مقطعي يُحيا اليوم على اللافتات والوشوم. وكتب خوسيه ريزال رواياته بالإسبانية؛ و*Florante at Laura* (1838) لفرانسيسكو بالاغتاس هي الكلاسيكية التاغالوغية. و**الفلبينية**، اللغة الوطنية منذ 1987، تاغالوغية موحّدة.
