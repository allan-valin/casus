# Sanskrit Learn lessons, written for Casus (2026-10-20) in the order of the classic primers (Perry's Sanskrit Primer,
# 1885, after Bühler; Macdonell; Max Müller), with the facts from Whitney's Sanskrit Grammar (1889) — all public
# domain. Open modern courses were searched: none is openly licensed. Sentences: the Digital Corpus of Sanskrit (Oliver
# Hellwig, CC BY 4.0) — Hitopadeśa, Śukasaptati, Vetālapañcaviṃśati, Kathāsaritsāgara, Rāmāyaṇa — in its padapāṭha
# form (the words before sandhi, as beginners' readers print them), compound-free sentences only
# (tools/build_dcs.py); and Tatoeba's few Sanskrit sentences.
# written by AI (Claude) for Casus: marked as such on every lesson (Allan, 2026-10-20)
ai_written: true
system: Primer
credit:
  en: "Lessons written for Casus by AI (Claude) after Whitney's Sanskrit Grammar and Perry's Sanskrit Primer (public domain); tables from Wiktionary (CC BY-SA). Sentences: Digital Corpus of Sanskrit (O. Hellwig, CC BY 4.0), Tatoeba (CC BY 2.0 FR)."
  pt: "Lições escritas por IA (Claude) para o Casus com base na Sanskrit Grammar de Whitney e no Sanskrit Primer de Perry (domínio público); tabelas do Wikcionário (CC BY-SA). Frases: Digital Corpus of Sanskrit (O. Hellwig, CC BY 4.0), Tatoeba (CC BY 2.0 FR)."
level_files: [Beginner, Intermediate]
# a gap is always a whole written word (the reader splits sandhi and compounds into pieces)
whole_words: true
