# Arabic text of the Sanskrit course, Beginner — translated by AI (Claude) from the English (2026-10-20)
topics:
  Script and sounds: "الخط والأصوات"
  The present tense: "المضارع"
  "Nouns in -a: the cases": "الأسماء المنتهية بـ -a: الحالات"
  Other nouns and pronouns: "أسماء وضمائر أخرى"
lessons:
  sa-script:
    meaning: "الديفاناغاري: الصوائت والصوامت والحروف المركبة"
    intro: |
      تكتب الديفاناغاري **مقاطع**. يحمل حرف الصامت **a** كامنة: **क** = *ka*. والصوائت الأخرى علامات حوله: **का** *kā*، **कि** *ki*، **की** *kī*، **कु** *ku*، **कू** *kū*، **कृ** *kṛ*، **के** *ke*، **कै** *kai*، **को** *ko*، **कौ** *kau*. وفي أول الكلمة للصوائت حروف كاملة: **अ आ इ ई उ ऊ ऋ ए ऐ ओ औ**. و**الفيراما** ् تُسكّن الحرف (كالسكون): **क्** *k*. وصامتان بلا صائت بينهما يندمجان في **حرف مركب**: **क्ष** *kṣa*، **ज्ञ** *jña*، **त्र** *tra*، **श्र** *śra*.

      انتبه إلى **طول الصوائت** (**ि** الـ *i* القصيرة تُكتب قبل الصامت؛ **ी** طويلة) وإلى **الأصوات الصفيرية** الثلاثة: **श** *ś* (غاري، كالشين)، **ष** *ṣ* (ارتدادي)، **स** *s*. و**ं** (أنوسفارا) صوت أنفي، و**ः** (فيسارغا) نفَس *ḥ*. و**।** تنهي الجملة أو نصف البيت.
    mistakes: ["e و ī الطويلة علامتان مختلفتان: े و ी."]
  sa-present:
    meaning: "مضارع الأفعال الموضوعية: -ति، -न्ति، -मि"
    intro: |
      تضيف معظم الأفعال صائتًا **-a-** إلى جذر المضارع (**गच्छ** *gaccha* من √गम्، **वद** *vada* من √वद्، **भव** *bhava* من √भू) ثم اللواحق — المفرد و**المثنى** (كالعربية!) والجمع:

      | | مفرد | مثنى | جمع |
      |---|---|---|---|
      | الغائب | गच्छ**ति** | गच्छ**तः** | गच्छ**न्ति** |
      | المخاطب | गच्छ**सि** | गच्छ**थः** | गच्छ**थ** |
      | المتكلم | गच्छ**ामि** | गच्छ**ावः** | गच्छ**ामः** |

      ترتيب الكلمات حرّ؛ ويميل الفعل إلى آخر الجملة: **रामः वनम् गच्छति** «يذهب راما إلى الغابة».
  sa-cases:
    meaning: "الحالات الثماني: نظرة عامة (देव إله)"
    intro: |
      للسنسكريتية **ثماني حالات** و**ثلاثة أعداد** (المفرد والمثنى والجمع، كالعربية). وأكثر الأسماء تنتهي بـ **-a** (المذكر **देव** إله، والمحايد **वन** غابة):

      - **الرفع** (prathamā) الفاعل: देवः
      - **المفعولية** (dvitīyā) المفعول والغاية: देवम्
      - **الآلة** (tṛtīyā) *بـ، بواسطة*: देवेन
      - **القابل** (caturthī) *لـ، إلى*: देवाय
      - **المصدر** (pañcamī) *من، بسبب*: देवात्
      - **الإضافة** (ṣaṣṭhī) *ملكية*: देवस्य
      - **الظرفية** (saptamī) *في، على، عند*: देवे
      - **النداء** (sambodhana) *يا إله!*: देव

      تتناولها الدروس التالية واحدة واحدة؛ وقارئ Casus يلوّنها في أي نص.
  sa-accusative:
    meaning: "المفعولية: المفعول والغاية"
    intro: |
      **-म्** (المفرد)، **-ौ** (المثنى)، **-ान्** (جمع المذكر)، **-ानि** (جمع المحايد). المفعول به وغاية الحركة: **ग्रामम् गच्छति** «يذهب إلى القرية». وللمحايد صيغة واحدة في الرفع والمفعولية: **वनम्**.
  sa-instrumental:
    meaning: "حالة الآلة: بـ، بواسطة"
    intro: |
      **-एन** (مفرد)، **-ाभ्याम्** (مثنى)، **-ैः** (جمع): الوسيلة (**हस्तेन** «باليد»)، والفاعل في المبني للمجهول (**रामेण उक्तम्** «قاله راما»)، والمصاحبة مع **सह** (**पुत्रेण सह** «مع الابن»). وبعد **र्، ष्، ऋ** تصير n ण: **रामेण**.
  sa-dative:
    meaning: "حالة القابل: لـ، إلى"
    intro: |
      **-ाय** (مفرد)، **-ाभ्याम्** (مثنى)، **-ेभ्यः** (جمع): من يُعطى أو يُقال له شيء، والغرض: **ब्राह्मणाय धनम् ददाति** «يعطي البراهمن مالًا»، **युद्धाय** «للقتال».
  sa-ablative:
    meaning: "حالة المصدر: من، بسبب"
    intro: |
      **-ात्** (مفرد)، **-ाभ्याम्** (مثنى)، **-ेभ्यः** (جمع، كالقابل): الحركة بعيدًا (**वनात् आगच्छति** «يأتي من الغابة»)، والسبب (**भयात्** «من الخوف»)، والمقارنة (**धनात् विद्या श्रेयसी** «العلم خير من المال»).
  sa-genitive:
    meaning: "حالة الإضافة: الملكية"
    intro: |
      **-स्य** (مفرد)، **-योः** (مثنى)، **-ानाम्** (جمع): الملكية والنسبة: **रामस्य पुत्रः** «ابن راما»، **नृपाणाम् श्रेष्ठः** «خير الملوك». وقد تقوم مقام القابل مع أفعال الإعطاء والقول.
  sa-locative:
    meaning: "الحالة الظرفية: في، على، عند"
    intro: |
      **-े** (مفرد)، **-योः** (مثنى)، **-ेषु** (جمع): المكان والزمان: **वने वसति** «يسكن في الغابة»، **प्रभाते** «عند الفجر». و**الظرفية المطلقة** (B: اسم فاعل أو مفعول واسم في الظرفية) تعني *عندما، بينما*: **सूर्ये उदिते** «لما طلعت الشمس».
  sa-vocative:
    meaning: "النداء"
    intro: |
      يستعمل النداء **الجذر المجرد** في مفرد الأسماء المنتهية بـ -a (**राम!**، **देव!**)، كثيرًا مع **हे** أو **भोः** (كـ«يا»)؛ والمثنى والجمع كالرفع: **हे देवाः!**
  sa-feminine:
    meaning: "المؤنث المنتهي بـ -ā و -ī"
    intro: |
      **-ā** (सेना جيش): सेना، सेनाम्، सेनया، सेनायै، सेनायाः، सेनायाः، सेनायाम्؛ والجمع सेनाः، सेनाभिः، सेनानाम्، सेनासु. **-ī** (नदी نهر): नदी، नदीम्، नद्या، नद्यै، नद्याः، नद्याः، नद्याम्؛ والجمع नद्यः، नदीभिः، नदीनाम्، नदीषु.
  sa-tad:
    meaning: "الضمير tad: هو، هي، ذلك"
    intro: |
      **तद्** تعني *هو، هي* و*ذلك* (وأيضًا أداة تعريف): المذكر **सः، तम्، तेन، तस्मै، तस्मात्، तस्य، तस्मिन्**؛ والجمع **ते، तान्، तैः، तेभ्यः، तेषाम्، तेषु**. والمؤنث **सा، ताम्، तया، तस्यै، तस्याः، तस्याम्**. والمحايد **तत्**. لاحظ **-स्मै، -स्मात्، -स्मिन्**: هنا تختلف الضمائر عن الأسماء.
  sa-personal:
    meaning: "أنا وأنت"
    intro: |
      **अहम्** أنا: **माम्، मया، मह्यम्، मत्، मम، मयि**؛ **वयम्** نحن: **अस्मान्، अस्माभिः، अस्माकम्**. **त्वम्** أنت: **त्वाम्، त्वया، तुभ्यम्، त्वत्، तव، त्वयि**؛ **यूयम्** أنتم: **युष्मान्، युष्माकम्**. والصيغ القصيرة **मा، मे، नः، त्वा، ते، वः** لا تبدأ بها الجملة أبدًا، كالضمائر المتصلة.
  sa-particles:
    meaning: "الأدوات: و، أيضًا، مثل، فقط"
    intro: |
      **च** *و* — بعد الكلمة التي تعطفها (**रामः लक्ष्मणः च** «راما ولاكشمانا»)؛ **अपि** *أيضًا، حتى*؛ **इव** *مثل، كأنّ*؛ **एव** *فقط، بالذات، حقًا*؛ **तु** *لكن*؛ **हि** *إذ، حقًا*؛ **वा** *أو* (بعد الكلمة)؛ **न** *لا*؛ **इति** تختم الاقتباس أو الفكرة (كعلامة التنصيص).
