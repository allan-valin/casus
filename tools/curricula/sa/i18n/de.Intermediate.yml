# German text of the Sanskrit course, Intermediate — translated by AI (Claude) from the English (2026-10-20)
topics:
  Past and future: "Vergangenheit und Zukunft"
  Moods: "Modi"
  Verbal nouns and participles: "Verbalnomen und Partizipien"
  Joining clauses: "Sätze verbinden"
lessons:
  sa-imperfect:
    meaning: "das Imperfekt: Augment अ- + Sekundärendungen"
    intro: |
      Die Alltagsvergangenheit der Erzählung: das **Augment अ-** vor dem Präsensstamm und die **Sekundärendungen**: **अगच्छम्, अगच्छः, अगच्छत्; अगच्छाव, अगच्छतम्, अगच्छताम्; अगच्छाम, अगच्छत, अगच्छन्**. Ein vokalisch anlautender Stamm dehnt den Vokal: **इच्छति → ऐच्छत्**. Mit **मा** + augmentlosen Formen ist es ein Verbot.
  sa-future:
    meaning: "das Futur auf -ष्य-"
    intro: |
      **-स्य- / -ष्य-** (oft **-इष्य-**) + die Präsensendungen: **भविष्यति** „wird sein“, **गमिष्यति** „wird gehen“, **करिष्यामि** „ich werde tun“, **दास्यति** „wird geben“.
  sa-imperative:
    meaning: "der Imperativ: er soll gehen, geh!"
    intro: |
      **गच्छतु** er soll gehen, **गच्छन्तु** sie sollen gehen; **गच्छ** geh! (der bloße Stamm), **गच्छत** geht! (Pl.); **गच्छानि** ich will gehen. Verneint mit **मा**.
  sa-optative:
    meaning: "der Optativ: sollte, würde, möge"
    intro: |
      **-ेत्** (3. Sg.), **-ेयुः** (3. Pl.), **-ेयम्** (1. Sg.), **-ेः** (2. Sg.): Regeln und Ratschläge (**धर्मम् आचरेत्** „man soll den Dharma üben“), Wünsche und Bedingungen (**यदि … गच्छेत्** „wenn er ginge“).
  sa-gerund:
    meaning: "das Absolutiv: gegangen seiend (-त्वा, -य)"
    intro: |
      **-त्वा** (einfache Verben) und **-य** (mit Präfix) bedeuten *nachdem er … hat*, mit dem Subjekt des Hauptverbs: **गृहम् गत्वा भुङ्क्ते** „nach Hause gegangen, isst er“; **आगम्य** „gekommen“, **दृष्ट्वा** „gesehen habend“. Sanskrit-Erzählungen reihen sie: **स्नात्वा भुक्त्वा शेते** „nachdem er gebadet und gegessen hat, schläft er“.
  sa-infinitive:
    meaning: "der Infinitiv -तुम्: zu tun"
    intro: |
      **-तुम्**: Zweck und Ergänzung von *können, wollen*: **द्रष्टुम् इच्छामि** „ich will sehen“, **गन्तुम् अर्हसि** „du solltest gehen“, **कर्तुम् शक्नोति** „er kann es tun“.
  sa-participle:
    meaning: "das Partizip Perfekt -त / -न"
    intro: |
      **-त** (oder **-न**): *gegangen, gesagt, getan* — die häufigste Vergangenheit im späteren Sanskrit, dekliniert wie ein Adjektiv auf -a: **रामः वनम् गतः** „Rāma ging (ist gegangen) in den Wald“; bei transitiven Verben ist es passiv und der Täter steht im Instrumental: **रामेण उक्तम्** „es wurde von Rāma gesagt“.
  sa-passive:
    meaning: "das Passiv auf -य-: es wird gesagt"
    intro: |
      **-य-** + die Medialendungen: **उच्यते** „wird gesagt“, **दृश्यते** „wird gesehen, erscheint“, **क्रियते** „wird getan“, **श्रूयते** „wird gehört“. Der Täter steht im Instrumental: **रामेण ग्रामः दृश्यते**.
  sa-relative:
    meaning: "Relativsätze: yad … tad"
    intro: |
      Das Sanskrit verbindet ein **Relativum** mit einem **Demonstrativum** — wie deutsch *wer … der*: **यः … सः** wer … der; **यदा … तदा** wenn … dann; **यत्र … तत्र** wo … dort; **यथा … तथा** wie … so; **यदि … तर्हि** falls … dann: **यः धर्मम् आचरति सः सुखी भवति** „wer den Dharma übt, der ist glücklich“.
  sa-dual:
    meaning: "der Dual: genau zwei"
    intro: |
      Für zwei von etwas nimmt das Sanskrit den **Dual**: Nominativ/Akkusativ **-ौ** (mask.) / **-े** (fem., neutr.), Instrumental-Dativ-Ablativ **-ाभ्याम्**, Genitiv-Lokativ **-योः**. Auch Verben: **गच्छतः** „die beiden gehen“. **रामलक्ष्मणौ** „Rāma und Lakṣmaṇa“.
