# Arabic text of the Sanskrit course, Intermediate — translated by AI (Claude) from the English (2026-10-20)
topics:
  Past and future: "الماضي والمستقبل"
  Moods: "الصيغ"
  Verbal nouns and participles: "المصادر وأسماء الفاعل والمفعول"
  Joining clauses: "ربط الجمل"
lessons:
  sa-imperfect:
    meaning: "الماضي الناقص: الزيادة अ- + اللواحق الثانوية"
    intro: |
      ماضي السرد اليومي: **الزيادة अ-** قبل جذر المضارع و**اللواحق الثانوية**: **अगच्छम्، अगच्छः، अगच्छत्؛ अगच्छाव، अगच्छतम्، अगच्छताम्؛ अगच्छाम، अगच्छत، अगच्छन्**. والجذر المبدوء بصائت يُطيله: **इच्छति → ऐच्छत्**. ومع **मा** + صيغ بلا زيادة يفيد النهي.
  sa-future:
    meaning: "المستقبل بـ -ष्य-"
    intro: |
      **-स्य- / -ष्य-** (وكثيرًا **-इष्य-**) + لواحق المضارع: **भविष्यति** «سيكون»، **गमिष्यति** «سيذهب»، **करिष्यामि** «سأفعل»، **दास्यति** «سيعطي».
  sa-imperative:
    meaning: "الأمر: ليذهب، اذهب!"
    intro: |
      **गच्छतु** ليذهب، **गच्छन्तु** ليذهبوا؛ **गच्छ** اذهب! (الجذر المجرد)، **गच्छत** اذهبوا!؛ **गच्छानि** دعني أذهب. والنهي بـ **मा**.
  sa-optative:
    meaning: "صيغة التمني: ينبغي، لو، عسى"
    intro: |
      **-ेत्** (الغائب المفرد)، **-ेयुः** (الغائب الجمع)، **-ेयम्** (المتكلم المفرد)، **-ेः** (المخاطب المفرد): القواعد والنصائح (**धर्मम् आचरेत्** «ينبغي أن يُعمل بالدارما»)، والتمني، والشرط (**यदि … गच्छेत्** «لو ذهب»).
  sa-gerund:
    meaning: "المطلق: بعد أن ذهب (-त्वा، -य)"
    intro: |
      **-त्वा** (للأفعال البسيطة) و**-य** (مع سابقة) تعنيان *بعد أن فعل*، وفاعلها فاعل الفعل الرئيسي: **गृहम् गत्वा भुङ्क्ते** «بعد أن ذهب إلى البيت يأكل»؛ **आगम्य** «بعد أن جاء»، **दृष्ट्वा** «بعد أن رأى». والسرد السنسكريتي يتابعها: **स्नात्वा भुक्त्वा शेते** «بعد أن يغتسل ويأكل ينام».
  sa-infinitive:
    meaning: "المصدر -तुम्: أن يفعل"
    intro: |
      **-तुम्**: الغرض ومتمم *يستطيع، يريد*: **द्रष्टुम् इच्छामि** «أريد أن أرى»، **गन्तुम् अर्हसि** «ينبغي أن تذهب»، **कर्तुम् शक्नोति** «يستطيع أن يفعل».
  sa-participle:
    meaning: "اسم المفعول الماضي -त / -न"
    intro: |
      **-त** (أو **-न**): *ذاهب، مقول، مفعول* — أكثر صيغ الماضي شيوعًا في السنسكريتية المتأخرة، يُصرَّف كصفة منتهية بـ -a: **रामः वनम् गतः** «ذهب راما إلى الغابة»؛ ومع الفعل المتعدي يكون مجهولًا والفاعل في حالة الآلة: **रामेण उक्तम्** «قاله راما».
  sa-passive:
    meaning: "المبني للمجهول بـ -य-: يُقال"
    intro: |
      **-य-** + لواحق الصيغة الوسطى: **उच्यते** «يُقال»، **दृश्यते** «يُرى، يبدو»، **क्रियते** «يُفعل»، **श्रूयते** «يُسمع». والفاعل في حالة الآلة: **रामेण ग्रामः दृश्यते** «يرى راما القرية».
  sa-relative:
    meaning: "الجمل الموصولة: yad … tad"
    intro: |
      تقرن السنسكريتية **الموصول** بـ**اسم إشارة**: **यः … सः** من … فهو؛ **यदा … तदा** حين … حينئذ؛ **यत्र … तत्र** حيث … هناك؛ **यथा … तथा** كما … كذلك؛ **यदि … तर्हि** إن … فـ: **यः धर्मम् आचरति सः सुखी भवति** «من عمل بالدارما فهو سعيد».
  sa-dual:
    meaning: "المثنى: اثنان بالضبط"
    intro: |
      للاثنين تستعمل السنسكريتية **المثنى**، كالعربية: الرفع/المفعولية **-ौ** (مذكر) / **-े** (مؤنث، محايد)، الآلة-القابل-المصدر **-ाभ्याम्**، الإضافة-الظرفية **-योः**. والأفعال كذلك: **गच्छतः** «يذهبان». **रामलक्ष्मणौ** «راما ولاكشمانا».
