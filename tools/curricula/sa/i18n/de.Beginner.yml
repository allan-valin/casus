# German text of the Sanskrit course, Beginner — translated by AI (Claude) from the English (2026-10-20)
topics:
  Script and sounds: "Schrift und Laute"
  The present tense: "Das Präsens"
  "Nouns in -a: the cases": "Nomen auf -a: die Kasus"
  Other nouns and pronouns: "Weitere Nomen und Pronomen"
lessons:
  sa-script:
    meaning: "Devanagari: Vokale, Konsonanten, Ligaturen"
    intro: |
      Devanagari schreibt **Silben**. Ein Konsonantenbuchstabe trägt ein inhärentes **a**: **क** = *ka*. Andere Vokale sind Zeichen um ihn herum: **का** *kā*, **कि** *ki*, **की** *kī*, **कु** *ku*, **कू** *kū*, **कृ** *kṛ*, **के** *ke*, **कै** *kai*, **को** *ko*, **कौ** *kau*. Am Wortanfang haben Vokale volle Buchstaben: **अ आ इ ई उ ऊ ऋ ए ऐ ओ औ**. Der **Virāma** ् tilgt den Vokal: **क्** *k*. Zwei Konsonanten ohne Vokal dazwischen verbinden sich zu einer **Ligatur**: **क्ष** *kṣa*, **ज्ञ** *jña*, **त्र** *tra*, **श्र** *śra*.

      Achte auf die **Vokallänge** (**ि** kurzes *i* steht vor dem Konsonanten; **ी** lang) und die drei **Zischlaute**: **श** *ś* (palatal), **ष** *ṣ* (retroflex), **स** *s*. **ं** (Anusvāra) ist ein Nasal, **ः** (Visarga) ein Hauch *ḥ*. **।** beendet einen Satz oder Halbvers.
    mistakes: ["e und langes ī sind verschiedene Zeichen: े und ी."]
  sa-present:
    meaning: "das Präsens der thematischen Verben: -ति, -न्ति, -मि"
    intro: |
      Die meisten Verben fügen ihrem Präsensstamm einen Vokal **-a-** hinzu (**गच्छ** *gaccha* von √गम्, **वद** *vada* von √वद्, **भव** *bhava* von √भू) und dann die Endungen — Singular, **Dual** (zwei Personen) und Plural:

      | | Sg. | Du. | Pl. |
      |---|---|---|---|
      | 3. | गच्छ**ति** | गच्छ**तः** | गच्छ**न्ति** |
      | 2. | गच्छ**सि** | गच्छ**थः** | गच्छ**थ** |
      | 1. | गच्छ**ामि** | गच्छ**ावः** | गच्छ**ामः** |

      Die Wortstellung ist frei; das Verb steht gern am Ende: **रामः वनम् गच्छति** „Rāma geht in den Wald“.
  sa-cases:
    meaning: "die acht Kasus: ein Überblick (देव Gott)"
    intro: |
      Das Sanskrit hat **acht Kasus** und **drei Numeri**. Die häufigsten Nomen enden auf **-a** (maskulin **देव** Gott, neutral **वन** Wald):

      - **Nominativ** (prathamā) Subjekt: देवः
      - **Akkusativ** (dvitīyā) Objekt, Ziel: देवम्
      - **Instrumental** (tṛtīyā) *mit, durch*: देवेन
      - **Dativ** (caturthī) *zu, für*: देवाय
      - **Ablativ** (pañcamī) *von, wegen*: देवात्
      - **Genitiv** (ṣaṣṭhī) *von, des*: देवस्य
      - **Lokativ** (saptamī) *in, auf, bei*: देवे
      - **Vokativ** (sambodhana) *o Gott!*: देव

      Die nächsten Lektionen nehmen sie einzeln durch; der Leser von Casus färbt sie in jedem Text.
  sa-accusative:
    meaning: "der Akkusativ: Objekt und Ziel"
    intro: |
      **-म्** (Singular), **-ौ** (Dual), **-ान्** (Maskulinum Plural), **-ानि** (Neutrum Plural). Das direkte Objekt und das Ziel einer Bewegung: **ग्रामम् गच्छति** „geht ins Dorf“. Neutra haben im Nominativ und Akkusativ dieselbe Form: **वनम्**.
  sa-instrumental:
    meaning: "der Instrumental: mit, durch"
    intro: |
      **-एन** (Sg.), **-ाभ्याम्** (Du.), **-ैः** (Pl.): das Mittel (**हस्तेन** „mit der Hand“), der Urheber beim Passiv (**रामेण उक्तम्** „von Rāma gesagt“), Begleitung mit **सह** (**पुत्रेण सह** „mit dem Sohn“). Nach **र्, ष्, ऋ** wird n zu ण: **रामेण**.
  sa-dative:
    meaning: "der Dativ: zu, für"
    intro: |
      **-ाय** (Sg.), **-ाभ्याम्** (Du.), **-ेभ्यः** (Pl.): die Person, der etwas gegeben oder gesagt wird, und der Zweck: **ब्राह्मणाय धनम् ददाति** „gibt dem Brahmanen Geld“, **युद्धाय** „zum Kampf“.
  sa-ablative:
    meaning: "der Ablativ: von, wegen"
    intro: |
      **-ात्** (Sg.), **-ाभ्याम्** (Du.), **-ेभ्यः** (Pl., wie der Dativ): Bewegung weg (**वनात् आगच्छति** „kommt aus dem Wald“), Ursache (**भयात्** „aus Furcht“) und Vergleich (**धनात् विद्या श्रेयसी** „Wissen ist besser als Reichtum“).
  sa-genitive:
    meaning: "der Genitiv: von, des"
    intro: |
      **-स्य** (Sg.), **-योः** (Du.), **-ानाम्** (Pl.): Besitz und Beziehung: **रामस्य पुत्रः** „Rāmas Sohn“, **नृपाणाम् श्रेष्ठः** „der beste der Könige“. Er kann bei Verben des Gebens und Sagens auch für den Dativ stehen.
  sa-locative:
    meaning: "der Lokativ: in, auf, bei"
    intro: |
      **-े** (Sg.), **-योः** (Du.), **-ेषु** (Pl.): Ort und Zeit: **वने वसति** „wohnt im Wald“, **प्रभाते** „bei Tagesanbruch“. Der **absolute Lokativ** (B: ein Partizip und ein Nomen im Lokativ) bedeutet *als, während*: **सूर्ये उदिते** „als die Sonne aufgegangen war“.
  sa-vocative:
    meaning: "der Vokativ: jemanden rufen"
    intro: |
      Die Anrede nimmt bei Nomen auf -a im Singular den **bloßen Stamm** (**राम!**, **देव!**), oft mit **हे** oder **भोः**; Dual und Plural sind wie der Nominativ: **हे देवाः!**
  sa-feminine:
    meaning: "Feminina auf -ā und -ī"
    intro: |
      **-ā** (सेना Heer): सेना, सेनाम्, सेनया, सेनायै, सेनायाः, सेनायाः, सेनायाम्; Pl. सेनाः, सेनाभिः, सेनानाम्, सेनासु. **-ī** (नदी Fluss): नदी, नदीम्, नद्या, नद्यै, नद्याः, नद्याः, नद्याम्; Pl. नद्यः, नदीभिः, नदीनाम्, नदीषु.
  sa-tad:
    meaning: "das Pronomen tad: er, sie, es, jener"
    intro: |
      **तद्** ist *er, sie, es* und *jener* (auch *der*): maskulin **सः, तम्, तेन, तस्मै, तस्मात्, तस्य, तस्मिन्**; Plural **ते, तान्, तैः, तेभ्यः, तेषाम्, तेषु**. Feminin **सा, ताम्, तया, तस्यै, तस्याः, तस्याम्**. Neutrum **तत्**. Beachte **-स्मै, -स्मात्, -स्मिन्**: hier weichen Pronomen von Nomen ab.
  sa-personal:
    meaning: "ich und du"
    intro: |
      **अहम्** ich: **माम्, मया, मह्यम्, मत्, मम, मयि**; **वयम्** wir: **अस्मान्, अस्माभिः, अस्माकम्**. **त्वम्** du: **त्वाम्, त्वया, तुभ्यम्, त्वत्, तव, त्वयि**; **यूयम्** ihr: **युष्मान्, युष्माकम्**. Die Kurzformen **मा, मे, नः, त्वा, ते, वः** stehen nie am Satzanfang.
  sa-particles:
    meaning: "Partikeln: und, auch, wie, nur"
    intro: |
      **च** *und* — nach dem Wort, das es anschließt (**रामः लक्ष्मणः च** „Rāma und Lakṣmaṇa“); **अपि** *auch, sogar*; **इव** *wie, gleichsam*; **एव** *nur, gerade, wirklich*; **तु** *aber*; **हि** *denn, ja*; **वा** *oder* (nach dem Wort); **न** *nicht*; **इति** schließt ein Zitat oder einen Gedanken ab.
