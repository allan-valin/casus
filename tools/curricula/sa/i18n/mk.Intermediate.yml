# Macedonian text of the Sanskrit course, Intermediate — translated by AI (Claude) from the English (2026-10-20)
topics:
  Past and future: "Минато и идно"
  Moods: "Начини"
  Verbal nouns and participles: "Глаголски именки и партиципи"
  Joining clauses: "Сврзување реченици"
lessons:
  sa-imperfect:
    meaning: "имперфектот: аугмент अ- + секундарни наставки"
    intro: |
      Секојдневното минато на раскажувањето: **аугментот अ-** пред сегашната основа и **секундарните наставки** (истиот аугмент го има и грчкиот): **अगच्छम्, अगच्छः, अगच्छत्; अगच्छाव, अगच्छतम्, अगच्छताम्; अगच्छाम, अगच्छत, अगच्छन्**. Основа што почнува на самогласка ја издолжува: **इच्छति → ऐच्छत्**. Со **मा** + форми без аугмент значи забрана.
  sa-future:
    meaning: "идното време на -ष्य-"
    intro: |
      **-स्य- / -ष्य-** (често **-इष्य-**) + сегашните наставки: **भविष्यति** „ќе биде“, **गमिष्यति** „ќе оди“, **करिष्यामि** „ќе направам“, **दास्यति** „ќе даде“.
  sa-imperative:
    meaning: "заповедниот начин: нека оди, оди!"
    intro: |
      **गच्छतु** нека оди, **गच्छन्तु** нека одат; **गच्छ** оди! (голата основа), **गच्छत** одете!; **गच्छानि** да одам. Одречно со **मा**.
  sa-optative:
    meaning: "оптативот: треба, би, нека"
    intro: |
      **-ेत्** (3 едн.), **-ेयुः** (3 мн.), **-ेयम्** (1 едн.), **-ेः** (2 едн.): правила и совети (**धर्मम् आचरेत्** „човек треба да ја практикува дхармата“), желби и услови (**यदि … गच्छेत्** „ако би отишол“).
  sa-gerund:
    meaning: "апсолутивот: откако отишол (-त्वा, -य)"
    intro: |
      **-त्वा** (прости глаголи) и **-य** (со представка) значат *откако направил* — како старото **отишавши** — со подметот на главниот глагол: **गृहम् गत्वा भुङ्क्ते** „откако отиде дома, јаде“; **आगम्य** „дојдејќи“, **दृष्ट्वा** „откако виде“. Санскритското раскажување ги низа: **स्नात्वा भुक्त्वा शेते** „откако се искапе и јадеше, спие“.
  sa-infinitive:
    meaning: "инфинитивот -तुम्: да направи"
    intro: |
      **-तुम्** (сроден со старословенскиот супин на *-тъ*): цел и дополнение на *може, сака*: **द्रष्टुम् इच्छामि** „сакам да видам“, **गन्तुम् अर्हसि** „треба да одиш“, **कर्तुम् शक्नोति** „може да направи“.
  sa-participle:
    meaning: "минатиот партицип -त / -न"
    intro: |
      **-त** (или **-न**): *отиден, кажан, направен* — најчестото минато во подоцнежниот санскрит, менуван како придавка на -a: **रामः वनम् गतः** „Рама отиде во шумата“; со преоден глагол е пасивен, а вршителот е во инструментал: **रामेण उक्तम्** „кажано е од Рама“. (Спореди го македонското *има направено* / *е направено*.)
  sa-passive:
    meaning: "пасивот на -य-: се кажува"
    intro: |
      **-य-** + медијалните наставки: **उच्यते** „се кажува“, **दृश्यते** „се гледа, се појавува“, **क्रियते** „се прави“, **श्रूयते** „се слуша“. Вршителот е во инструментал: **रामेण ग्रामः दृश्यते** „Рама го гледа селото“ (букв. „од Рама селото се гледа“).
  sa-relative:
    meaning: "релативни реченици: yad … tad"
    intro: |
      Санскритот спарува **релативно** со **показно** — како македонското *кој … тој*: **यः … सः** кој … тој; **यदा … तदा** кога … тогаш; **यत्र … तत्र** каде … таму; **यथा … तथा** како … така; **यदि … तर्हि** ако … тогаш: **यः धर्मम् आचरति सः सुखी भवति** „кој ја практикува дхармата, тој е среќен“.
  sa-dual:
    meaning: "двоината: точно двајца"
    intro: |
      За две од нешто санскритот ја користи **двоината** (ја имал и старословенскиот, а во македонскиот остатоци се *две раце*): номинатив/акузатив **-ौ** (маш.) / **-े** (жен., сред.), инструментал-датив-аблатив **-ाभ्याम्**, генитив-локатив **-योः**. И глаголите: **गच्छतः** „двајцата одат“. **रामलक्ष्मणौ** „Рама и Лакшмана“.
