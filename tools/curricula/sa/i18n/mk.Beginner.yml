# Macedonian text of the Sanskrit course, Beginner — translated by AI (Claude) from the English (2026-10-20)
topics:
  Script and sounds: "Писмо и гласови"
  The present tense: "Сегашно време"
  "Nouns in -a: the cases": "Именки на -a: падежите"
  Other nouns and pronouns: "Други именки и заменки"
lessons:
  sa-script:
    meaning: "деванагари: самогласки, согласки, лигатури"
    intro: |
      Деванагари пишува **слогови**. Согласната буква носи вградено **a**: **क** = *ka*. Другите самогласки се знаци околу неа: **का** *kā*, **कि** *ki*, **की** *kī*, **कु** *ku*, **कू** *kū*, **कृ** *kṛ*, **के** *ke*, **कै** *kai*, **को** *ko*, **कौ** *kau*. На почеток на збор самогласките имаат цели букви: **अ आ इ ई उ ऊ ऋ ए ऐ ओ औ**. **Вирама** ् ја брише самогласката: **क्** *k*. Две согласки без самогласка меѓу нив се спојуваат во **лигатура**: **क्ष** *kṣa*, **ज्ञ** *jña*, **त्र** *tra*, **श्र** *śra*.

      Внимавај на **должината на самогласките** (**ि** краткото *i* се пишува пред согласката; **ी** долго) и на трите **шушкави**: **श** *ś* (палатално, речиси ш), **ष** *ṣ* (ретрофлексно), **स** *s*. **ं** (анусвара) е назал, **ः** (висарга) издишка *ḥ*. **।** завршува реченица или половина стих.
    mistakes: ["e и долгото ī се различни знаци: े и ी."]
  sa-present:
    meaning: "сегашно време на тематските глаголи: -ति, -न्ति, -मि"
    intro: |
      Повеќето глаголи додаваат самогласка **-a-** на сегашната основа (**गच्छ** *gaccha* од √गम्, **वद** *vada* од √वद्, **भव** *bhava* од √भू), па наставките — еднина, **двоина** (две лица) и множина:

      | | едн. | двоина | мн. |
      |---|---|---|---|
      | 3 л. | गच्छ**ति** | गच्छ**तः** | गच्छ**न्ति** |
      | 2 л. | गच्छ**सि** | गच्छ**थः** | गच्छ**थ** |
      | 1 л. | गच्छ**ामि** | गच्छ**ावः** | गच्छ**ामः** |

      Редот на зборовите е слободен; глаголот често е на крајот: **रामः वनम् गच्छति** „Рама оди во шумата“. (Спореди: *-ti* е сродно со старословенското *-тъ*.)
  sa-cases:
    meaning: "осумте падежи: преглед (देव бог)"
    intro: |
      Санскритот има **осум падежи** и **три броја** — македонскиот ги изгубил падежите, но ќе ги препознаеш од старословенскиот и рускиот. Најчестите именки завршуваат на **-a** (машко **देव** бог, средно **वन** шума):

      - **номинатив** (prathamā) подмет: देवः
      - **акузатив** (dvitīyā) објект, цел: देवम्
      - **инструментал** (tṛtīyā) *со, преку*: देवेन
      - **датив** (caturthī) *на, за*: देवाय
      - **аблатив** (pañcamī) *од, поради*: देवात्
      - **генитив** (ṣaṣṭhī) *на (припадност)*: देवस्य
      - **локатив** (saptamī) *во, на, кај*: देवे
      - **вокатив** (sambodhana) *о боже!*: देव

      Следните лекции ги земаат еден по еден; читачот на Casus ги бојадисува во секој текст.
  sa-accusative:
    meaning: "акузативот: објект и цел"
    intro: |
      **-म्** (еднина), **-ौ** (двоина), **-ान्** (машки множина), **-ानि** (среден множина). Директниот објект и целта на движењето: **ग्रामम् गच्छति** „оди во селото“. Средните имаат иста форма во номинатив и акузатив: **वनम्**.
  sa-instrumental:
    meaning: "инструменталот: со, преку"
    intro: |
      **-एन** (едн.), **-ाभ्याम्** (дв.), **-ैः** (мн.): средството (**हस्तेन** „со раката“), вршителот кај пасивот (**रामेण उक्तम्** „кажано од Рама“), друштво со **सह** (**पुत्रेण सह** „со синот“). По **र्, ष्, ऋ** n станува ण: **रामेण**.
  sa-dative:
    meaning: "дативот: на, за"
    intro: |
      **-ाय** (едн.), **-ाभ्याम्** (дв.), **-ेभ्यः** (мн.): лицето на кое нешто му се дава или кажува, и целта: **ब्राह्मणाय धनम् ददाति** „му дава пари на брахманот“, **युद्धाय** „за битка“.
  sa-ablative:
    meaning: "аблативот: од, поради"
    intro: |
      **-ात्** (едн.), **-ाभ्याम्** (дв.), **-ेभ्यः** (мн., како дативот): движење од (**वनात् आगच्छति** „доаѓа од шумата“), причина (**भयात्** „од страв“) и споредба (**धनात् विद्या श्रेयसी** „знаењето е подобро од богатството“).
  sa-genitive:
    meaning: "генитивот: на (припадност)"
    intro: |
      **-स्य** (едн.), **-योः** (дв.), **-ानाम्** (мн.): припадност и однос: **रामस्य पुत्रः** „синот на Рама“, **नृपाणाम् श्रेष्ठः** „најдобриот од кралевите“. Може да стои и наместо датив по глаголи на давање и зборување.
  sa-locative:
    meaning: "локативот: во, на, кај"
    intro: |
      **-े** (едн.), **-योः** (дв.), **-ेषु** (мн.): место и време: **वने वसति** „живее во шумата“, **प्रभाते** „во зори“. **Апсолутниот локатив** (B: партицип и именка во локатив) значи *кога, додека*: **सूर्ये उदिते** „кога изгреа сонцето“.
  sa-vocative:
    meaning: "вокативот: повикување"
    intro: |
      Повикувањето ја користи **голата основа** во еднина кај именките на -a (**राम!**, **देव!**), често со **हे** или **भोः**; двоината и множината се како номинативот: **हे देवाः!** — вокативот е жив и во македонскиот (*боже!, Марко!*).
  sa-feminine:
    meaning: "женски на -ā и -ī"
    intro: |
      **-ā** (सेना војска): सेना, सेनाम्, सेनया, सेनायै, सेनायाः, सेनायाः, सेनायाम्; мн. सेनाः, सेनाभिः, सेनानाम्, सेनासु. **-ī** (नदी река): नदी, नदीम्, नद्या, नद्यै, नद्याः, नद्याः, नद्याम्; мн. नद्यः, नदीभिः, नदीनाम्, नदीषु.
  sa-tad:
    meaning: "заменката tad: тој, таа, тоа, оној"
    intro: |
      **तद्** е *тој, таа, тоа* и *оној* (и член *-от*): машки **सः, तम्, तेन, तस्मै, तस्मात्, तस्य, तस्मिन्**; множина **ते, तान्, तैः, तेभ्यः, तेषाम्, तेषु**. Женски **सा, ताम्, तया, तस्यै, तस्याः, तस्याम्**. Среден **तत्**. Забележи **-स्मै, -स्मात्, -स्मिन्**: тука заменките се разликуваат од именките. (Сродно со македонското **тој, та, то**.)
  sa-personal:
    meaning: "јас и ти"
    intro: |
      **अहम्** јас: **माम्, मया, मह्यम्, मत्, मम, मयि**; **वयम्** ние: **अस्मान्, अस्माभिः, अस्माकम्**. **त्वम्** ти: **त्वाम्, त्वया, तुभ्यम्, त्वत्, तव, त्वयि**; **यूयम्** вие: **युष्मान्, युष्माकम्**. Кратките форми **मा, मे, नः, त्वा, ते, वः** никогаш не почнуваат реченица — како **ме, ми, те, ти**.
  sa-particles:
    meaning: "честички: и, исто така, како, само"
    intro: |
      **च** *и* — по зборот што го поврзува (**रामः लक्ष्मणः च** „Рама и Лакшмана“); **अपि** *исто така, дури*; **इव** *како, како да*; **एव** *само, токму, навистина*; **तु** *но*; **हि** *бидејќи, навистина*; **वा** *или* (по зборот); **न** *не*; **इति** затвора цитат или мисла.
