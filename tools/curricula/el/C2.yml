id: C2
topics:

- title: {en: Katharevousa in today's Greek, pt: A katharevousa no grego de hoje}
  lessons:
  - id: el-c2-learned-aorists
    title: "συνελήφθη, εξελέγη, κατέστη"
    meaning: {en: "learned aorists of the news and officialdom", pt: "aoristos eruditos do noticiário e da administração"}
    intro:
      en: |
        News reports and official texts keep aorists from the old learned language (katharevousa), with the augment and the ancient endings:

        - passive in **-η / -ησαν**: **συνελήφθη** "was arrested" (everyday **συλλήφθηκε**), **εξελέγη** "was elected" (**εκλέχτηκε**), **ελήφθη** "was taken", **εστάλη** "was sent", **διεξήχθη** "was held", **ετέθη** "was put"
        - active: **κατέστη** "became, was rendered", **απέβη** "turned out", **προέβη σε** "proceeded to", **απεβίωσε** "passed away"

        **Ο ύποπτος συνελήφθη χθες.** "The suspect was arrested yesterday."
      pt: |
        As notícias e os textos oficiais conservam aoristos da antiga língua erudita (katharevousa), com o aumento e as terminações antigas:

        - passivos em **-η / -ησαν**: **συνελήφθη** "foi preso" (corrente **συλλήφθηκε**), **εξελέγη** "foi eleito" (**εκλέχτηκε**), **ελήφθη** "foi tomado", **εστάλη** "foi enviado", **διεξήχθη** "foi realizado", **ετέθη** "foi posto"
        - ativos: **κατέστη** "tornou-se", **απέβη** "resultou", **προέβη σε** "procedeu a", **απεβίωσε** "faleceu"

        **Ο ύποπτος συνελήφθη χθες.** "O suspeito foi preso ontem."
    table:
      head: {en: [Learned, Everyday, Meaning], pt: [Erudito, Corrente, Sentido]}
      rows:
      - [συνελήφθη, συλλήφθηκε, "was arrested / foi preso"]
      - [εξελέγη, εκλέχτηκε, "was elected / foi eleito"]
      - [εστάλη, στάλθηκε, "was sent / foi enviado"]
      - [απεβίωσε, πέθανε, "died / faleceu"]
    examples:
    - ["Ο ύποπτος συνελήφθη χθες.", "The suspect was arrested yesterday.", "O suspeito foi preso ontem.", "συνελήφθη"]
    - ["Εξελέγη πρόεδρος το 2010.", "He was elected president in 2010.", "Ele foi eleito presidente em 2010.", "Εξελέγη"]
    - ["Ο ποιητής απεβίωσε σε ηλικία 80 ετών.", "The poet passed away aged 80.", "O poeta faleceu aos 80 anos.", "απεβίωσε"]
    match: {seq: [{word: [συνελήφθη, συνελήφθησαν, εξελέγη, εξελέγησαν, ελήφθη, ελήφθησαν, εστάλη, εστάλησαν, διεξήχθη, ετέθη, εκλήθη, εγράφη, εδόθη, ευρέθη, κατέστη, απέβη, προέβη, απεβίωσε, διετέλεσε, ανέλαβε, κατέλαβε]}], gap: 0}
    pool: [συνελήφθη, εξελέγη, εστάλη, κατέστη, απεβίωσε, συλλήφθηκε, εκλέχτηκε, πέθανε]

  - id: el-c2-learned-phrases
    title: "εκ των υστέρων, επί τη ευκαιρία, υπό τον όρο"
    meaning: {en: "fixed phrases with ancient prepositions", pt: "expressões fixas com preposições antigas"}
    intro:
      en: |
        Ancient prepositions live on in fixed phrases, each with its old case:

        - **εκ / εξ** + gen.: **εκ των υστέρων** "with hindsight", **εξ αρχής** "from the start", **εξ ορισμού** "by definition", **εκ μέρους** "on behalf of"
        - **επί** + gen. / dat. / acc.: **επί της ουσίας** "on the substance", **επί τη ευκαιρία** "on the occasion", **επί δέκα χρόνια** "for ten years"
        - **υπό** + acc. / gen.: **υπό τον όρο** "on condition", **υπό κατασκευή** "under construction"
        - **ανά** + acc. "per": **ανά ώρα** "per hour", **ανά τον κόσμο** "around the world"
        - **προ** + gen.: **προ ημερών** "a few days ago"
      pt: |
        As preposições antigas vivem em expressões fixas, cada uma com seu caso antigo:

        - **εκ / εξ** + gen.: **εκ των υστέρων** "em retrospecto", **εξ αρχής** "desde o início", **εξ ορισμού** "por definição", **εκ μέρους** "da parte de"
        - **επί** + gen. / dat. / ac.: **επί της ουσίας** "quanto ao mérito", **επί τη ευκαιρία** "aproveitando a ocasião", **επί δέκα χρόνια** "durante dez anos"
        - **υπό** + ac. / gen.: **υπό τον όρο** "com a condição", **υπό κατασκευή** "em construção"
        - **ανά** + ac. "por": **ανά ώρα** "por hora", **ανά τον κόσμο** "pelo mundo afora"
        - **προ** + gen.: **προ ημερών** "há poucos dias"
    examples:
    - ["Εκ των υστέρων όλα φαίνονται εύκολα.", "In hindsight everything looks easy.", "Em retrospecto tudo parece fácil.", "Εκ"]
    - ["Το κτίριο είναι υπό κατασκευή.", "The building is under construction.", "O prédio está em construção.", "υπό"]
    - ["Το λεωφορείο περνάει δύο φορές ανά ώρα.", "The bus comes twice an hour.", "O ônibus passa duas vezes por hora.", "ανά"]
    match: {seq: [{word: [εκ, εξ, επί, υπό, ανά, προ]}], gap: 0}
    pool: [εκ, εξ, επί, υπό, ανά, προ, από, για]

  - id: el-c2-active-participles
    title: "ο παρών, η ενδιαφέρουσα, τα ισχύοντα"
    meaning: {en: "learned active participles in -ων, -ούσα, -ον", pt: "particípios ativos eruditos em -ων, -ούσα, -ον"}
    intro:
      en: |
        Formal Greek keeps the ancient **active participle** in **-ων, -ουσα, -ον** (gen. **-οντος, -ουσας**), declined like a third-declension adjective: **ο παρών, η παρούσα, το παρόν** "present" (**οι παρόντες** "those present"), **απών** "absent", **ενδιαφέρων, ενδιαφέρουσα, ενδιαφέρον** "interesting", **ο ισχύων νόμος** "the law in force", **τα υπάρχοντα** "belongings", **ο μέλλων** "future". Many have become nouns: **η πρωτεύουσα** "capital city", **το ενδιαφέρον** "interest", **το μέλλον** "the future".
      pt: |
        O grego formal conserva o antigo **particípio ativo** em **-ων, -ουσα, -ον** (gen. **-οντος, -ουσας**), declinado como adjetivo da terceira declinação: **ο παρών, η παρούσα, το παρόν** "presente" (**οι παρόντες** "os presentes"), **απών** "ausente", **ενδιαφέρων, ενδιαφέρουσα, ενδιαφέρον** "interessante", **ο ισχύων νόμος** "a lei em vigor", **τα υπάρχοντα** "os pertences", **ο μέλλων** "futuro". Muitos viraram substantivos: **η πρωτεύουσα** "a capital", **το ενδιαφέρον** "o interesse", **το μέλλον** "o futuro".
    table:
      head: {en: [Case, Masc., Fem., Neut.], pt: [Caso, Masc., Fem., Neutro]}
      rows:
      - [nom., ενδιαφέρων, ενδιαφέρουσα, ενδιαφέρον]
      - [gen., ενδιαφέροντος, ενδιαφέρουσας, ενδιαφέροντος]
      - [nom. pl., ενδιαφέροντες, ενδιαφέρουσες, ενδιαφέροντα]
    examples:
    - ["Αυτή είναι μια ενδιαφέρουσα ιδέα.", "That's an interesting idea.", "Essa é uma ideia interessante.", "ενδιαφέρουσα"]
    - ["Όλοι οι παρόντες ψήφισαν.", "Everyone present voted.", "Todos os presentes votaram.", "παρόντες"]
    - ["Η Αθήνα είναι η πρωτεύουσα της Ελλάδας.", "Athens is the capital of Greece.", "Atenas é a capital da Grécia.", "πρωτεύουσα"]
    match: {seq: [{word: [παρών, παρούσα, παρόντες, παρόντος, παρούσας, παρόντων, απών, απούσα, απόντες, ενδιαφέρων, ενδιαφέρουσα, ενδιαφέροντα, ενδιαφέρουσες, ενδιαφέροντος, ενδιαφέρουσας, ενδιαφέροντες, ισχύων, ισχύουσα, ισχύοντα, ισχύουσες, υπάρχοντα, μέλλων, μέλλοντα, πρωτεύουσα, πρωτεύουσες, πρωτεύουσας, παρελθόντος]}], gap: 0}
    pool: [ενδιαφέρουσα, ενδιαφέρον, παρόντες, παρών, πρωτεύουσα, ενδιαφέρουσες, ισχύων]

  - id: el-c2-adverbs-os
    title: "απλώς, προφανώς, ιδιαιτέρως"
    meaning: {en: "learned adverbs in -ως beside everyday -α", pt: "advérbios eruditos em -ως ao lado dos correntes em -α"}
    intro:
      en: |
        Many adjectives make two adverbs: everyday **-α** and learned **-ως**: **βέβαια / βεβαίως** "certainly", **τελικά / τελικώς**, **ιδιαίτερα / ιδιαιτέρως** "especially", **απλά / απλώς** "simply, just". The **-ως** form sounds formal or emphatic and is the only one for some words: **προφανώς** "obviously", **εντελώς** "completely", **συνεχώς** "continually", **πιθανώς** "probably", **ευτυχώς / δυστυχώς** "fortunately / unfortunately". Some pairs differ in meaning: **απλά** "plainly" vs **απλώς** "merely", **καλά** "well" vs **καλώς ήρθατε** "welcome".
      pt: |
        Muitos adjetivos formam dois advérbios: o corrente em **-α** e o erudito em **-ως**: **βέβαια / βεβαίως** "certamente", **τελικά / τελικώς**, **ιδιαίτερα / ιδιαιτέρως** "especialmente", **απλά / απλώς** "simplesmente, só". A forma em **-ως** soa formal ou enfática e é a única em algumas palavras: **προφανώς** "obviamente", **εντελώς** "completamente", **συνεχώς** "continuamente", **πιθανώς** "provavelmente", **ευτυχώς / δυστυχώς** "felizmente / infelizmente". Alguns pares diferem no sentido: **απλά** "de modo simples" vs **απλώς** "apenas", **καλά** "bem" vs **καλώς ήρθατε** "bem-vindos".
    examples:
    - ["Απλώς ήθελα να σε δω.", "I just wanted to see you.", "Só queria te ver.", "Απλώς"]
    - ["Προφανώς δεν το ήξερε.", "Obviously he didn't know.", "Obviamente ele não sabia.", "Προφανώς"]
    - ["Δυστυχώς δεν μπορώ να έρθω.", "Unfortunately I can't come.", "Infelizmente não posso ir.", "Δυστυχώς"]
    match: {seq: [{word: [απλώς, προφανώς, εντελώς, συνεχώς, πιθανώς, ολοσχερώς, λεπτομερώς, διαρκώς, παντελώς, ελαφρώς, επαρκώς, σαφώς, βεβαίως, ιδιαιτέρως, τελείως, τελικώς, ευτυχώς, δυστυχώς, καλώς, ενδεχομένως]}], gap: 0}
    pool: [απλώς, απλά, προφανώς, εντελώς, βεβαίως, βέβαια, ιδιαιτέρως, ιδιαίτερα]

- title: {en: Fine points of syntax, pt: Pontos finos da sintaxe}
  lessons:
  - id: el-c2-prohibition-aspect
    title: "Μη φεύγεις! – Μη φύγεις!"
    meaning: {en: "aspect after μη(ν)", pt: "o aspecto depois de μη(ν)"}
    intro:
      en: |
        Prohibitions are made with **μη(ν)** + subjunctive, and the aspect matters: the **imperfective** stops an action in progress or forbids it in general (**Μη φεύγεις!** "Don't go (stay)!", **Μην καπνίζεις.** "Don't smoke."), the **perfective** forbids a single action, often as a warning (**Μη φύγεις χωρίς εμένα!** "Don't leave without me!", **Μην το ξεχάσεις!** "Don't forget it!"). The same choice runs through **να μην**: **Προσπάθησε να μην αργήσεις.** "Try not to be late."
      pt: |
        As proibições se fazem com **μη(ν)** + subjuntivo, e o aspecto importa: o **imperfectivo** interrompe uma ação em curso ou a proíbe em geral (**Μη φεύγεις!** "Não vá embora (fique)!", **Μην καπνίζεις.** "Não fume."), o **perfectivo** proíbe uma ação única, muitas vezes como aviso (**Μη φύγεις χωρίς εμένα!** "Não vá sem mim!", **Μην το ξεχάσεις!** "Não esqueça!"). A mesma escolha vale para **να μην**: **Προσπάθησε να μην αργήσεις.** "Tente não se atrasar."
    examples:
    - ["Μη φεύγεις!", "Don't go!", "Não vá embora!", "φεύγεις"]
    - ["Μην το ξεχάσεις!", "Don't forget it!", "Não esqueça!", "ξεχάσεις"]
    - ["Μην καπνίζεις εδώ.", "Don't smoke here.", "Não fume aqui.", "καπνίζεις"]
    match: {seq: [{word: [μη, μην]}, {pos: verb, person: "2"}], near: 1, gap: 1, same: [person, number]}

  - id: el-c2-resumptive
    title: "ο φίλος που του μίλησα"
    meaning: {en: "a pronoun inside a που clause", pt: "um pronome dentro da oração com που"}
    intro:
      en: |
        **που** is invariable, so when the relative is an indirect object or a possessor, a weak pronoun inside the clause shows its role: **ο φίλος που του μίλησα** "the friend I spoke to", **η γυναίκα που της έδωσα το κλειδί** "the woman I gave the key to", **ο άνθρωπος που του έκλεψαν το αυτοκίνητο** "the man whose car was stolen". Formal Greek says the same with **ο οποίος**: **ο φίλος στον οποίο μίλησα**, **του οποίου το αυτοκίνητο**.
      pt: |
        **που** é invariável, então quando o relativo é objeto indireto ou possuidor, um pronome átono dentro da oração mostra sua função: **ο φίλος που του μίλησα** "o amigo com quem falei", **η γυναίκα που της έδωσα το κλειδί** "a mulher a quem dei a chave", **ο άνθρωπος που του έκλεψαν το αυτοκίνητο** "o homem cujo carro foi roubado". O grego formal diz o mesmo com **ο οποίος**: **ο φίλος στον οποίο μίλησα**, **του οποίου το αυτοκίνητο**.
    examples:
    - ["Αυτός είναι ο φίλος που του μίλησα.", "This is the friend I spoke to.", "Este é o amigo com quem falei.", "του"]
    - ["Η γυναίκα που της έδωσα το κλειδί έφυγε.", "The woman I gave the key to has left.", "A mulher a quem dei a chave foi embora.", "της"]
    match: {seq: [{pos: noun}, {word: [που]}, {word: [του, της, τους]}, {pos: verb}], gap: 2}
    pool: [του, της, τους, τον, την, το]

  - id: el-c2-verb-first
    title: "Ήρθε ο Γιάννης."
    meaning: {en: "verb-first order and focus", pt: "verbo em primeiro lugar e foco"}
    intro:
      en: |
        Greek word order is free, and verb–subject is the neutral order for news that comes out of the blue: **Ήρθε ο Γιάννης.** "Giannis has come." **Χτύπησε το τηλέφωνο.** "The phone rang." **Έφυγε το τρένο.** "The train has gone." Putting a word first with stress makes it the **focus**: **Τον ΓΙΑΝΝΗ είδα, όχι τη Μαρία.** "It was Giannis I saw, not Maria." (no doubling pronoun with a focused object, unlike a topic).
      pt: |
        A ordem das palavras do grego é livre, e verbo–sujeito é a ordem neutra para uma novidade que surge do nada: **Ήρθε ο Γιάννης.** "Chegou o Giannis." **Χτύπησε το τηλέφωνο.** "O telefone tocou." **Έφυγε το τρένο.** "O trem já foi." Pôr uma palavra em primeiro lugar com acento forte a torna o **foco**: **Τον ΓΙΑΝΝΗ είδα, όχι τη Μαρία.** "Foi o Giannis que eu vi, não a Maria." (sem pronome duplicando o objeto em foco, ao contrário do tópico).
    examples:
    - ["Ήρθε ο Γιάννης.", "Giannis has come.", "Chegou o Giannis.", "Ήρθε"]
    - ["Χτύπησε το τηλέφωνο.", "The phone rang.", "O telefone tocou.", "Χτύπησε"]
    - ["Έφυγε το τρένο.", "The train has gone.", "O trem já foi.", "Έφυγε"]
    match: {seq: [{pos: verb, tense: past, person: "3", start: true}, {word: [ο, η, το, οι, τα]}, {pos: noun, case: nom}], gap: 0, same: [person, number]}

  - id: el-c2-future-perfect
    title: "θα έχει φύγει, θα είναι σπίτι"
    meaning: {en: "θα for probability and the future perfect", pt: "θα para probabilidade e o futuro perfeito"}
    intro:
      en: |
        **θα έχω + -ει** is the future perfect: **Ως αύριο θα έχω τελειώσει.** "By tomorrow I'll have finished." Very often it expresses a **guess** about the past: **Θα έχει φύγει ήδη.** "He must have left already." In the same way **θα** + present guesses about now: **Θα είναι στο σπίτι τώρα.** "He'll be at home now (I suppose)." **Ποιος θα είναι;** "Who can that be?"
      pt: |
        **θα έχω + -ει** é o futuro perfeito: **Ως αύριο θα έχω τελειώσει.** "Até amanhã terei terminado." Muitas vezes exprime uma **suposição** sobre o passado: **Θα έχει φύγει ήδη.** "Ele já deve ter ido embora." Do mesmo modo **θα** + presente supõe algo sobre agora: **Θα είναι στο σπίτι τώρα.** "Ele deve estar em casa agora." **Ποιος θα είναι;** "Quem será?"
    examples:
    - ["Θα έχει φύγει ήδη.", "He must have left already.", "Ele já deve ter ido embora.", "έχει"]
    - ["Ως αύριο θα έχω τελειώσει.", "By tomorrow I'll have finished.", "Até amanhã terei terminado.", "έχω"]
    - ["Θα είναι στο σπίτι τώρα.", "He'll be at home now.", "Ele deve estar em casa agora.", "είναι"]
    match:
    - {seq: [{word: [θα]}, {word: [έχω, έχεις, έχει, έχουμε, έχετε, έχουν]}, {re: "ει$"}], near: 1, gap: 1}
    - {seq: [{word: [θα]}, {word: [είναι, είσαι, είμαι, είστε]}], gap: 1}
    pool: [έχει, είχε, έχω, είναι, ήταν, θα]

- title: {en: Spoken and expressive Greek, pt: Grego falado e expressivo}
  lessons:
  - id: el-c2-diminutives
    title: "λιγάκι, σπιτάκι, γατούλα"
    meaning: {en: "diminutives: -άκι, -ίτσα, -ούλα, -ούλης", pt: "diminutivos: -άκι, -ίτσα, -ούλα, -ούλης"}
    intro:
      en: |
        Greek speech is full of diminutives, for smallness and above all for affection: neuter **-άκι** (**σπίτι → σπιτάκι**, **γάτα → γατάκι**, **λίγο → λιγάκι** "a little bit"), feminine **-ίτσα, -ούλα** (**σκυλίτσα, γατούλα**), masculine **-άκης, -ούλης** (**μικρούλης** "little one"). Many have lost their diminutive sense: **κορίτσι** "girl", **παγκάκι** "bench", **σακάκι** "jacket". Augmentatives in **-άρα, -αράς** are emphatic: **φωνάρα** "a great voice", **παιδαράς** "a strapping lad".
      pt: |
        A fala grega está cheia de diminutivos, para pequenez e sobretudo para carinho: neutro **-άκι** (**σπίτι → σπιτάκι**, **γάτα → γατάκι**, **λίγο → λιγάκι** "um pouquinho"), feminino **-ίτσα, -ούλα** (**σκυλίτσα, γατούλα**), masculino **-άκης, -ούλης** (**μικρούλης** "pequenininho"). Muitos perderam o sentido diminutivo: **κορίτσι** "menina", **παγκάκι** "banco de praça", **σακάκι** "paletó". Os aumentativos em **-άρα, -αράς** são enfáticos: **φωνάρα** "um vozeirão", **παιδαράς** "um rapagão".
    examples:
    - ["Περίμενε λιγάκι.", "Wait a little bit.", "Espere um pouquinho.", "λιγάκι"]
    - ["Μένουν σε ένα σπιτάκι στο χωριό.", "They live in a little house in the village.", "Eles moram numa casinha na aldeia.", "σπιτάκι"]
    - ["Τι ωραίο γατάκι!", "What a lovely kitten!", "Que gatinho lindo!", "γατάκι"]
    match: {seq: [{word: [λιγάκι, σπιτάκι, γατάκι, γατάκια, σκυλάκι, σκυλάκια, κοριτσάκι, πουλάκι, αρνάκι, λεπτάκι, σκυλίτσα, αρκουδάκι, δαχτυλάκι, μπλουζάκι, μικρούλης, μικρούλα, μικρούλι, γατούλα, μανούλα, παιδάκι, παιδάκια, ψωμάκι, καφεδάκι, βαρκούλα]}], gap: 0}
    pool: [λιγάκι, σπιτάκι, γατάκι, σκυλάκι, παιδάκι, λίγο, σπίτι, γάτα]

  - id: el-c2-colloquial-particles
    title: "ρε, μωρέ, άντε, κιόλας"
    meaning: {en: "particles of colloquial speech", pt: "partículas da fala coloquial"}
    intro:
      en: |
        Spoken Greek colours almost every sentence with particles:

        - **ρε, μωρέ, βρε** for addressing someone, from friendly to rude: **Έλα ρε!** "Come on, man!" **Τι λες μωρέ!** "What are you saying!"
        - **άντε** "come on, go on" (also impatience: **Άντε πια!** "Come on, already!")
        - **κιόλας** "already, even, too": **Ήρθες κιόλας;** "You're here already?"
        - **ντε** urging: **Έλα ντε!** "Come on then!"
        - **μπας και** "maybe, in case": **μπας και βρέξει** "in case it rains"
      pt: |
        O grego falado colore quase toda frase com partículas:

        - **ρε, μωρέ, βρε** para se dirigir a alguém, do amistoso ao grosseiro: **Έλα ρε!** "Qual é, cara!" **Τι λες μωρέ!** "Que é isso!"
        - **άντε** "vamos, anda" (também impaciência: **Άντε πια!** "Anda logo!")
        - **κιόλας** "já, até, ainda por cima": **Ήρθες κιόλας;** "Você já chegou?"
