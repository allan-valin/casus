# Macedonian text of the Modern Greek course, A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Letters and sounds: "Букви и гласови"
  Articles and gender: "Членови и род"
  Verbs in the present: "Глаголи во сегашно време"
  Nouns and adjectives: "Именки и придавки"
lessons:
  el-alphabet:
    meaning: "азбуката, акцентот и петте начини да се напише и"
    intro: |
      Грчкиот има 24 букви и пет самогласни **гласа**: *а, е, и, о, у*. Неколку букви и парови го пишуваат истиот глас, па правописот се учи со зборот:

      - *и*: **ι, η, υ, ει, οι** (**σπίτι** куќа, **μητέρα** мајка, **ύπνος** сон, **είμαι** сум, **οικογένεια** семејство)
      - *о*: **ο, ω** (**σπίτι του** неговата куќа, **ώρα** час)
      - *е*: **ε, αι** (**έχω**, **και** и)
      - *у*: **ου** (**ουρανός** небо)

      Согласни парови: **μπ** = б (**μπαμπάς**), **ντ** = д (**ντομάτα**), **γκ / γγ** = г (**γκαράζ**), **τσ** = ц, **τζ** = ѕ. **γ** пред *е, и* звучи како **ј** (**γεια**). Секој збор од два или повеќе слога носи напишан **акцент** (**´**) на нагласената самогласка: **μήλο** (јаболко) наспроти **μηλό** (јаболчница, ретко). **;** е прашалник.
    mistakes: ["Ист глас, еден правопис: учи го зборот како што е напишан."]
  el-articles:
    meaning: "членот и трите рода"
    intro: |
      Секоја именка е од **машки, женски или среден** род, а членот го покажува тоа — но како посебен збор пред именката, не како наставка: **ο** άντρας (мажот), **η** γυναίκα (жената), **το** παιδί (детето). Наставката обично кажува:

      - машки: **-ος, -ας, -ης** (ο δρόμος, ο πατέρας, ο μαθητής)
      - женски: **-α, -η** (η μητέρα, η αδελφή), некои **-ος** (η οδός)
      - среден: **-ο, -ι, -μα** (το βιβλίο, το σπίτι, το γράμμα)

      Множина: **οι** (машки и женски), **τα** (среден). Неопределениот член е **ένας, μία (μια), ένα**. Грчкиот го користи членот и со имиња: **ο Γιάννης**, и со општи именки: **Μου αρέσει ο καφές** „Ми се допаѓа кафето“.
    mistakes: ["γυναίκα завршува на -α: женски род."]
  el-eimai:
    meaning: "είμαι „сум“ и личните заменки"
    intro: |
      **εγώ** јас, **εσύ** ти, **αυτός / αυτή / αυτό** тој / таа / тоа, **εμείς** ние, **εσείς** вие (и учтиво), **αυτοί / αυτές / αυτά** тие. Наставката на глаголот веќе кажува кој, па заменките се користат само за нагласување.

      **είμαι, είσαι, είναι, είμαστε, είστε (είσαστε), είναι** — 3 лице еднина и множина се исти. Минато: **ήμουν, ήσουν, ήταν, ήμασταν, ήσασταν, ήταν**.
  el-verbs-a:
    meaning: "сегашно време на глаголите на -ω (прва конјугација)"
    intro: |
      Глаголи нагласени на основата, на **-ω**: **γράφω** (пишува), **μένω** (живее), **διαβάζω** (чита), **δουλεύω** (работи), **πίνω** (пие).

      | | |
      |---|---|
      | γράφ**ω** | γράφ**ουμε** |
      | γράφ**εις** | γράφ**ετε** |
      | γράφ**ει** | γράφ**ουν(ε)** |

      Грчкото сегашно значи и *пишувам* и *сега пишувам*.
    mistakes: ["2 лице еднина: -εις."]
  el-verbs-b:
    meaning: "глаголи нагласени на наставката: -άω и -ώ (втора конјугација)"
    intro: |
      Глаголите нагласени на последниот слог се во две групи:

      | -άω (μιλάω зборува) | -ώ (μπορώ може) |
      |---|---|
      | μιλ**άω** / μιλ**ώ** | μπορ**ώ** |
      | μιλ**άς** | μπορ**είς** |
      | μιλ**άει** / μιλ**ά** | μπορ**εί** |
      | μιλ**άμε** / μιλ**ούμε** | μπορ**ούμε** |
      | μιλ**άτε** | μπορ**είτε** |
      | μιλ**άνε** / μιλ**ούν** | μπορ**ούν(ε)** |

      **-άω**: αγαπάω (сака), ρωτάω (прашува), ξεχνάω (заборава), πεινάω (е гладен). **-ώ**: μπορώ, ζω (живее), οδηγώ (вози), τηλεφωνώ (телефонира), προσπαθώ (се обидува).
  el-negation:
    meaning: "негација: δεν, μην, όχι"
    intro: |
      **δεν (δε)** пред глаголот во изјави и прашања: **Δεν ξέρω.** „Не знам.“ **μην (μη)** по **να**, во заповеди и желби — како **немој**: **Μην ανησυχείς!** „Не грижи се!“, **Θέλω να μην έρθει.** „Сакам да не дојде.“ **όχι** е *не* (одговор) и негира други зборови: **Όχι, ευχαριστώ.** „Не, благодарам.“ **ναι** е *да*. **-ν** останува пред самогласки и κ π τ ξ ψ μπ ντ γκ τσ τζ.
  el-questions:
    meaning: "прашални зборови"
    intro: |
      **τι** што, **ποιος / ποια / ποιο** кој (се менува), **πού** каде (со акцент; **που** без акцент е *што, кој* — релативно), **από πού** од каде, **πότε** кога, **πώς** како, **γιατί** зошто (и *бидејќи*), **πόσο / πόσα / πόσοι** колку. Прашањата со да/не го задржуваат редот на зборовите и ја менуваат само интонацијата: **Είσαι Έλληνας;**
  el-accusative:
    meaning: "акузативот: објект и по предлози"
    intro: |
      Грчкиот има четири падежа: **номинатив** (подмет), **акузатив** (објект и по секој предлог: **σε, από, με, για, χωρίς**), **генитив** (*на*, A2) и **вокатив** (обраќање — како во македонскиот). Во акузатив машките го губат **-ς**: **ο φίλος → τον φίλο**, **ο πατέρας → τον πατέρα**, **ο μαθητής → τον μαθητή**; женските и средните изгледаат како номинатив еднина, а се менува само членот: **η μητέρα → τη(ν) μητέρα**, **το σπίτι → το σπίτι**.
  el-plural:
    meaning: "множина на именките"
    intro: |
      | еднина | множина |
      |---|---|
      | ο φίλ**ος** | οι φίλ**οι** |
      | ο πατέρ**ας**, ο μαθητ**ής** | οι πατέρ**ες**, οι μαθητ**ές** |
      | η μητέρ**α**, η αδελφ**ή** | οι μητέρ**ες**, οι αδελφ**ές** |
      | το βιβλί**ο** | τα βιβλί**α** |
      | το σπίτ**ι** | τα σπίτ**ια** |
      | το γράμ**μα** | τα γράμ**ματα** |

      Акузатив множина: машките на **-ος → -ους** (τους φίλους); другите како номинативот, со **τους / τις / τα**.
  el-adjectives:
    meaning: "придавките се согласуваат по род, број и падеж"
    intro: |
      Повеќето придавки завршуваат на **-ος, -η, -ο** (или **-ος, -α, -ο** по самогласка: **ωραίος, ωραία, ωραίο**) и ги земаат родот, бројот и падежот на именката: **ο μεγάλος σκύλος, η μεγάλη πόλη, το μεγάλο σπίτι, τα μεγάλα σπίτια**. Стојат пред именката. Други: **-ύς, -ιά, -ύ** (**βαθύς** длабок), **-ής, -ής, -ές** (**ακριβής** точен).
  el-possessive:
    meaning: "присвојни: μου, σου, του, της, μας, σας, τους"
    intro: |
      Припадноста е кратка заменка **по** именката, со членот пред неа — многу слично на македонското **мајка ми**: **το σπίτι μου** мојата куќа, **η μητέρα σου** мајка ти, **ο φίλος του / της** неговиот / нејзиниот пријател, **τα παιδιά μας** нашите деца, **ο δάσκαλός σας** вашиот учител, **το αυτοκίνητό τους** нивната кола. Именка нагласена на третиот слог од крајот зема втор акцент: **ο δάσκαλός μου**.
  el-se-article:
    meaning: "σε + член: στο, στη(ν), στον, στα, στις, στους"
    intro: |
      **σε** (во, на, кон) се спојува со членот: **σε + το = στο**, **σε + τη(ν) = στη(ν)**, **σε + τον = στον**, **στα, στις, στους**: **Μένω στην Αθήνα.** „Живеам во Атина.“ **Πάω στο σχολείο.** „Одам на училиште.“ Членот мора да се согласува со именката по него.
  el-numbers:
    meaning: "броеви 1–100"
    intro: |
      **1 ένα** (ένας, μία), **2 δύο**, **3 τρία** (τρεις), **4 τέσσερα** (τέσσερις), **5 πέντε**, **6 έξι**, **7 επτά / εφτά**, **8 οκτώ / οχτώ**, **9 εννέα / εννιά**, **10 δέκα**, **11 έντεκα**, **12 δώδεκα**, **13 δεκατρία**, **20 είκοσι**, **30 τριάντα**, **40 σαράντα**, **50 πενήντα**, **100 εκατό**. **1, 3, 4** се согласуваат по род со именката: **ένας φίλος, μία φίλη; τρεις φίλοι, τρία παιδιά**.
