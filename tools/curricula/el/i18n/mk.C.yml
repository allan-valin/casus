# Macedonian text of the Modern Greek course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Learned verb forms: "Книжевни глаголски форми"
  Learned nouns and adjectives: "Книжевни именки и придавки"
  Formal connectors and prepositions: "Официјални сврзници и предлози"
  Clauses in depth: "Зависни реченици во длабочина"
  Katharevousa in today's Greek: "Катаревуса во денешниот грчки"
  Fine points of syntax: "Финеси на синтаксата"
  Spoken and expressive Greek: "Говорен и експресивен грчки"
lessons:
  el-c1-present-passive-participle:
    meaning: "сегашниот пасивен партицип -όμενος, -ούμενος"
    intro: |
      Наследен од книжевниот јазик, партиципот на **-όμενος / -ούμενος / -άμενος** (од глаголи на -ομαι, -ούμαι, -άμαι) значи „кој се прави, кој е …“: **ο ενδιαφερόμενος** „заинтересираниот“, **ο εργαζόμενος** „вработениот“, **τα λεγόμενα** „кажаното“, **ο λεγόμενος** „таканаречениот“, **τα περιεχόμενα** „содржината“. Многу станале секојдневни придавки: **επόμενος** „следен“, **προηγούμενος** „претходен“, **ερχόμενος** „иден“, **χαρούμενος** „радосен“. Се менуваат како **καλός**.
  el-c1-internal-augment:
    meaning: "внатрешниот аугмент во книжевни сложени глаголи"
    intro: |
      Глаголите од книжевно потекло со предлошка представка го ставаат аугментот **меѓу** представката и основата, и тој останува и ненагласен: **συμβαίνει → συνέβη** „се случи“, **υπογράφω → υπέγραψα** „потпишав“, **επιστρέφω → επέστρεψα** „се вратив“, **υπάρχω → υπήρχε** „имаше“, **μεταφράζω → μετέφρασα**, **περιέχω → περιείχε**, **εκδίδω → εξέδωσα**. Представките се менуваат пред самогласка: **εκ- → εξ-**, **συμ- → συν-**. Во множина многу глаголи го испуштаат во говорот: **υπογράψαμε**, но **υπήρχαν**.
  el-c1-perfect-gerund:
    meaning: "перфектниот глаголски прилог: откако направил"
    intro: |
      **έχοντας** + формата на **-ει** гради перфектен глаголски прилог, „откако направил“ — како старото **направивши** — главно во писмото: **Έχοντας τελειώσει τη δουλειά, πήγε σπίτι.** „Откако ја заврши работата, отиде дома.“ **Έχοντας ζήσει χρόνια στο εξωτερικό, μιλάει τρεις γλώσσες.** „Живеејќи години во странство, зборува три јазици.“ Како секој глаголски прилог, го дели подметот со главниот глагол.
  el-c1-neuter-os:
    meaning: "книжевни средни именки на -ος и нивниот генитив -ους"
    intro: |
      Група средни именки на **-ος** доаѓаат од старата трета деклинација: **το μέρος** „дел, место“, **το έτος** „година“, **το είδος** „вид“, **το βάρος** „тежина“, **το λάθος** „грешка“, **το μέγεθος** „големина“, **το κράτος** „држава“, **το ύψος** „висина“. Генитив **-ους**, множина **-η**, генитив множина **-ών**: **του έτους, τα έτη, των ετών**. Не мешај ги со машкото **ο δρόμος**. **εκ μέρους** + ген. „во име на“, **κάθε είδους** „од секаков вид“.
  el-c1-learned-superlatives:
    meaning: "апсолутни суперлативи на -τατος и неправилни книжевни"
    intro: |
      Покрај **ο πιο μεγάλος / ο μεγαλύτερος**, грчкиот има **апсолутен суперлатив** „многу, крајно“ на **-ότατος / -ύτατος**: **σπουδαιότατος** „крајно важен“, **ταχύτατος** „крајно брз“, **ελαφρότατος**; и книжевни неправилни форми: **μέγιστος** „максимален“, **ελάχιστος** „минимален, многу малку“, **άριστος** „одличен“ (**άριστα** „одлично“, највисоката училишна оценка), **βέλτιστος** „оптимален“, **χείριστος** „најлош“, **πλείστος** „најмногу“ (**ως επί το πλείστον** „претежно“). **Το ελάχιστο που μπορώ να κάνω.** „Најмалку што можам да направам.“
  el-c1-formal-connectors:
    meaning: "сврзници на официјалниот стил"
    intro: |
      Официјалниот грчки има свои сврзници:

      - причина: **διότι, καθότι** „бидејќи“ (= γιατί), **καθώς** „бидејќи“; временски и „додека“
      - услов: **εάν** (= αν), **εφόσον** „под услов, штом“
      - последица: **επομένως, συνεπώς, άρα** „според тоа“
      - објаснување: **δηλαδή** „т.е., односно“, **ήτοι** „имено“ (многу книжевно)
      - алтернатива: **ειδάλλως / αλλιώς** „инаку“
  el-c1-learned-prepositions:
    meaning: "книжевни предлози со генитив"
    intro: |
      Секојдневните предлози земаат акузатив, но група книжевни земаат **генитив**: **μέσω** „преку“ (**μέσω Αθήνας**), **λόγω** „поради“ (**λόγω καιρού**), **υπέρ** „за, во полза на“, **εναντίον** „против“, **περί** „за, во врска со“, **άνευ** „без“ (**άνευ όρων** „безусловно“), **εκτός** „освен“, **κατά τη διάρκεια** „за време на“, **χάρη σε** „благодарение на“ (со σε + акуз.). **ως** „како, до“ зема акузатив или номинатив: **ως πρόεδρος** „како претседател“.
  el-c1-dative-fossils:
    meaning: "вкочанети старогрчки дативи"
    intro: |
      Старогрчкиот датив исчезнал, но живее во цврсти изрази на секојдневниот грчки: **εν τω μεταξύ** „во меѓувреме“, **τοις εκατό** „процент“, **εν λόγω** „споменатиот“, **εν ολίγοις** „накратко“, **εν πάση περιπτώσει** „во секој случај“, **εν μέρει** „делумно“, **εν γένει** „воопшто“, **δόξα τω Θεώ** „фала му на Бога“, **εν τάξει** (денес **εντάξει**) „во ред“. Сметај го секој како еден збор.
  el-c1-pou-emotion:
    meaning: "που по глаголи на чувство"
    intro: |
      По глаголи и придавки на **чувство** дополнителната реченица се воведува со **που**, не со **ότι**: **Χαίρομαι που ήρθες.** „Мило ми е што дојде.“ **Λυπάμαι που δεν μπορώ να βοηθήσω.** „Жал ми е што не можам да помогнам.“ **Μετανιώνω που το είπα.** „Се каам што го кажав.“ **Ευχαριστώ που με βοήθησες.** „Благодарам што ми помогна.“ — точно како македонското **што** по чувства. По глаголи на кажување и мислење е **ότι / πως** („дека“).
  el-c1-to-na:
    meaning: "το να: реченица со να како именка"
    intro: |
      Грчкиот нема инфинитив, па за да употреби дејство како именка, става член **το** пред реченица со **να**: **Το να καπνίζεις βλάπτει την υγεία.** „Пушењето му штети на здравјето.“ **Το να μάθεις μια γλώσσα θέλει χρόνο.** „Да научиш јазик бара време.“ По предлози членот го покажува падежот: **Αντί του να…** (официјално) „наместо да…“. Слично **το ότι** прави факт во именка: **Το ότι δεν ήρθε με ανησυχεί.** „Тоа што не дојде ме загрижува.“
  el-c2-learned-aorists:
    meaning: "книжевни аористи од вестите и администрацијата"
    intro: |
      Вестите и официјалните текстови чуваат аористи од стариот книжевен јазик (катаревуса), со аугмент и старите наставки:

      - пасив на **-η / -ησαν**: **συνελήφθη** „беше уапсен“ (секојдневно **συλλήφθηκε**), **εξελέγη** „беше избран“ (**εκλέχτηκε**), **ελήφθη** „беше земен“, **εστάλη** „беше испратен“, **διεξήχθη** „се одржа“, **ετέθη** „беше поставен“
      - актив: **κατέστη** „стана“, **απέβη** „се покажа“, **προέβη σε** „пристапи кон“, **απεβίωσε** „почина“

      **Ο ύποπτος συνελήφθη χθες.** „Осомничениот беше уапсен вчера.“
  el-c2-learned-phrases:
    meaning: "цврсти изрази со старогрчки предлози"
    intro: |
      Старите предлози живеат во цврсти изрази, секој со својот стар падеж:

      - **εκ / εξ** + ген.: **εκ των υστέρων** „дополнително, накнадно“, **εξ αρχής** „од почеток“, **εξ ορισμού** „по дефиниција“, **εκ μέρους** „во име на“
      - **επί** + ген. / дат. / акуз.: **επί της ουσίας** „во суштина“, **επί τη ευκαιρία** „по повод“, **επί δέκα χρόνια** „десет години“
      - **υπό** + акуз. / ген.: **υπό τον όρο** „под услов“, **υπό κατασκευή** „во изградба“
      - **ανά** + акуз. „по“: **ανά ώρα** „на час“, **ανά τον κόσμο** „низ светот“
      - **προ** + ген.: **προ ημερών** „пред неколку дена“
  el-c2-active-participles:
    meaning: "книжевни активни партиципи на -ων, -ούσα, -ον"
    intro: |
      Официјалниот грчки го чува старогрчкиот **активен партицип** на **-ων, -ουσα, -ον** (ген. **-οντος, -ουσας**), менуван како придавка од третата деклинација: **ο παρών, η παρούσα, το παρόν** „присутен, сегашен“ (**οι παρόντες** „присутните“), **απών** „отсутен“, **ενδιαφέρων, ενδιαφέρουσα, ενδιαφέρον** „интересен“, **ο ισχύων νόμος** „важечкиот закон“, **τα υπάρχοντα** „имотот, работите“, **ο μέλλων** „иден“. Многу станале именки: **η πρωτεύουσα** „главен град“, **το ενδιαφέρον** „интерес“, **το μέλλον** „иднината“.
  el-c2-adverbs-os:
    meaning: "книжевни прилози на -ως покрај секојдневните -α"
    intro: |
      Многу придавки градат два прилога: секојдневен на **-α** и книжевен на **-ως**: **βέβαια / βεβαίως** „секако“, **τελικά / τελικώς**, **ιδιαίτερα / ιδιαιτέρως** „особено“, **απλά / απλώς** „едноставно, само“. Формата на **-ως** звучи официјално или нагласено и за некои зборови е единствена: **προφανώς** „очигледно“, **εντελώς** „целосно“, **συνεχώς** „постојано“, **πιθανώς** „веројатно“, **ευτυχώς / δυστυχώς** „за среќа / за жал“. Некои парови се разликуваат по значење: **απλά** „едноставно“ наспроти **απλώς** „само“, **καλά** „добро“ наспроти **καλώς ήρθατε** „добредојдовте“.
  el-c2-prohibition-aspect:
    meaning: "видот по μη(ν)"
    intro: |
      Забраните се градат со **μη(ν)** + конјунктив, и видот е важен — како **немој да пишуваш** наспроти **немој да напишеш**: **несвршениот** запира дејство во тек или забранува воопшто (**Μη φεύγεις!** „Немој да си одиш (остани)!“, **Μην καπνίζεις.** „Немој да пушиш.“), **свршениот** забранува едно дејство, често како предупредување (**Μη φύγεις χωρίς εμένα!** „Немој да заминеш без мене!“, **Μην το ξεχάσεις!** „Немој да заборавиш!“). Истиот избор важи за **να μην**: **Προσπάθησε να μην αργήσεις.** „Обиди се да не задоцниш.“
  el-c2-resumptive:
    meaning: "заменка во реченица со που"
    intro: |
      **που** е непроменливо, па кога релативното е индиректен објект или сопственик, кратка заменка во реченицата ја покажува улогата — исто како македонското **што му**: **ο φίλος που του μίλησα** „пријателот што му зборував“, **η γυναίκα που της έδωσα το κλειδί** „жената што ѝ го дадов клучот“, **ο άνθρωπος που του έκλεψαν το αυτοκίνητο** „човекот што му ја украдоа колата“. Официјалниот грчки го кажува истото со **ο οποίος**: **ο φίλος στον οποίο μίλησα**, **του οποίου το αυτοκίνητο**.
  el-c2-verb-first:
    meaning: "глагол на прво место и фокус"
    intro: |
      Грчкиот ред на зборови е слободен, а глагол–подмет е неутралниот ред за вест што доаѓа одненадеж: **Ήρθε ο Γιάννης.** „Дојде Јанис.“ **Χτύπησε το τηλέφωνο.** „Заѕвони телефонот.“ **Έφυγε το τρένο.** „Замина возот.“ Збор ставен прв со нагласок станува **фокус**: **Τον ΓΙΑΝΝΗ είδα, όχι τη Μαρία.** „ЈАНИС го видов, не Марија.“ (без удвојување кај фокусиран објект, за разлика од темата).
  el-c2-future-perfect:
    meaning: "θα за веројатност и идно минато"
    intro: |
      **θα έχω + -ει** е идното минато: **Ως αύριο θα έχω τελειώσει.** „До утре ќе имам завршено.“ Многу често изразува **претпоставка** за минатото: **Θα έχει φύγει ήδη.** „Веќе ќе има заминато.“ Исто така **θα** + сегашно претпоставува за сега: **Θα είναι στο σπίτι τώρα.** „Сега ќе е дома (веројатно).“ **Ποιος θα είναι;** „Кој ли може да е?“
  el-c2-diminutives:
    meaning: "деминутиви: -άκι, -ίτσα, -ούλα, -ούλης"
    intro: |
      Говорниот грчки е полн со деминутиви, за малечкост и пред сѐ за милост: среден **-άκι** (**σπίτι → σπιτάκι**, **γάτα → γατάκι**, **λίγο → λιγάκι** „малку“), женски **-ίτσα, -ούλα** (**σκυλίτσα, γατούλα**), машки **-άκης, -ούλης** (**μικρούλης** „малечко“). Многу го изгубиле деминутивното значење: **κορίτσι** „девојче“, **παγκάκι** „клупа“, **σακάκι** „сако“. Аугментативите на **-άρα, -αράς** се нагласени: **φωνάρα** „одличен глас“, **παιδαράς** „крупен момок“.
  el-c2-colloquial-particles:
    meaning: "честички на разговорниот јазик"
    intro: |
      Говорниот грчки ја обојува речиси секоја реченица со честички, многу познати и во македонскиот:

      - **ρε, μωρέ, βρε** за обраќање, од пријателски до груби — исто како **бре, море**: **Έλα ρε!** „Ајде бе!“ **Τι λες μωρέ!** „Што зборуваш море!“
      - **άντε** „ајде“ (и нетрпение: **Άντε πια!** „Ајде веќе!“)
      - **κιόλας** „веќе, дури, исто така“: **Ήρθες κιόλας;** „Веќе дојде?“
      - **ντε** за поттикнување: **Έλα ντε!** „Ајде де!“
      - **μπας και** „можеби, ако случајно“: **μπας και βρέξει** „ако случајно заврне“
