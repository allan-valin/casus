# Arabic text of the Modern Greek course, A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The past: "الماضي"
  Future and subjunctive: "المستقبل والالتماسي"
  Pronouns and cases: "الضمائر والحالات"
  Commands and comparison: "الأمر والتفضيل"
lessons:
  el-aorist:
    meaning: "الماضي البسيط (الأوريست)"
    intro: |
      **الأوريست** هو ماضي الحدث المنجز: *كتبتُ، قرأتُ (مرة)*. له **جذر** خاص، غالبًا بـ **-σ-** (أو **-ψ-، -ξ-**): **γράφω → έγραψα، διαβάζω → διάβασα، ανοίγω → άνοιξα، μιλάω → μίλησα، αγοράζω → αγόρασα**. اللواحق: **-α، -ες، -ε، -αμε، -ατε، -αν**.

      النبرة دائمًا على **المقطع الثالث من الآخر**؛ والصيغة ثنائية المقطع تأخذ **زيادة ε-** لتحملها: **γράψα → έγραψα**، لكن **γράψαμε** (لا حاجة للزيادة). وكثير من الأفعال الشائعة شاذ: **έρχομαι → ήρθα، πάω → πήγα، βλέπω → είδα، λέω → είπα، τρώω → έφαγα، πίνω → ήπια، βρίσκω → βρήκα**.
    mistakes: ["يجب أن تقع النبرة على المقطع الثالث من الآخر: الزيادة ε- تحملها."]
  el-imperfect:
    meaning: "الماضي الناقص: كان يفعل، اعتاد أن يفعل"
    intro: |
      **الماضي الناقص** يستعمل **جذر المضارع** مع لواحق الماضي وقاعدة النبرة نفسها: **γράφω → έγραφα، διαβάζω → διάβαζα، μιλάω → μιλούσα** (الأفعال المنبورة على اللاحقة تأخذ **-ούσα**). يُستعمل لما كان جاريًا أو متكررًا أو معتادًا، مثل «كان يفعل»: **Όταν ήμουν παιδί, έπαιζα ποδόσφαιρο.** «حين كنت طفلًا كنت ألعب كرة القدم». **Διάβαζα όταν χτύπησε το τηλέφωνο.** «كنت أقرأ حين رنّ الهاتف».
  el-future:
    meaning: "المستقبل: θα + الفعل"
    intro: |
      **θα** + الفعل يصوغ المستقبل، مثل السين و«سوف». مع **جذر الأوريست** (التام) يكون حدثًا واحدًا: **Θα σου γράψω αύριο.** «سأكتب لك غدًا». ومع **جذر المضارع** يكون مستمرًا أو متكررًا: **Θα σου γράφω κάθε μέρα.** «سأكتب لك كل يوم». واللواحق لواحق المضارع: **θα γράψω، θα γράψεις، θα γράψει…**

      و**θα** + الماضي الناقص تعني *كان سـ…*: **Θα ερχόμουν, αλλά…** «كنت سآتي، لكن…»
    mistakes: ["θα تأخذ جذر الأوريست بلا زيادة، مع لواحق المضارع."]
  el-na:
    meaning: "να + الفعل: «أن» اليونانية والالتماسي"
    intro: |
      **لا مصدر** في اليونانية. حيث تقول العربية *أريد أن أذهب* — والتركيب نفسه تقريبًا — تقول اليونانية **Θέλω να πάω**. والفعل الثاني يأخذ شخصه الخاص: **Θέλω να πας.** «أريدك أن تذهب». ومثل θα تأخذ **να** **جذر الأوريست** للفعل الواحد (**να γράψω** «أن أكتب») وجذر المضارع للمستمر (**να γράφω** «أن أكون أكتب»). شائعة بعد: **θέλω، μπορώ، πρέπει، ξέρω، αρχίζω، σταματάω، μου αρέσει να…**؛ والنفي **να μην** «ألّا».
  el-object-pronouns:
    meaning: "ضمائر المفعول الضعيفة قبل الفعل"
    intro: |
      ضمائر المفعول قصيرة وتأتي **قبل** الفعل: **με** ـني، **σε** ـك، **τον / την / το** ـه / ـها / ـه، **μας** ـنا، **σας** ـكم، **τους / τις / τα** ـهم: **Σε αγαπάω.** «أحبك». **Τον ξέρω.** «أعرفه». والمفعول غير المباشر يستعمل صيغ الإضافة: **μου، σου، του، της، μας، σας، τους**: **Μου δίνεις το βιβλίο;** «هل تعطيني الكتاب؟» ومع الأمر تأتي بعد الفعل: **Δώσε μου το!** «أعطني إياه!»
  el-genitive:
    meaning: "حالة الإضافة: الملكية"
    intro: |
      تأتي الإضافة بعد الاسم الذي تنتمي إليه، كالإضافة العربية: **το σπίτι του φίλου μου** «بيت صديقي»، **η πόρτα της κουζίνας** «باب المطبخ». اللواحق: المذكر **-ου / -α / -η** (**του φίλου، του πατέρα، του μαθητή**)، والمؤنث **+ς** (**της μητέρας، της αδελφής**)، والمحايد **-ου / -ιού / -ματος** (**του βιβλίου، του παιδιού، του γράμματος**). والجمع للجميع: **-ων** (**των φίλων**).
  el-imperative:
    meaning: "الأمر"
    intro: |
      من **جذر الأوريست** (لفعل واحد): **γράψε!** (للمفرد)، **γράψτε!** (للجمع أو للاحترام)؛ ومن جذر المضارع (للمستمر): **γράφε!، γράφετε!**. أفعال -άω/-ώ: **μίλησε، μιλήστε**. وشاذة شائعة جدًا: **έλα / ελάτε** (تعالَ)، **πάρε** (خذ)، **φέρε** (هاتِ)، **δες** (انظر)، **πες** (قل)، **φάε** (كُل). والنهي: **μη(ν)** + الالتماسي: **Μη γράψεις!** «لا تكتب!»
  el-comparison:
    meaning: "التفضيل: πιο، -τερος، από"
    intro: |
      **πιο** + الصفة (**πιο μεγάλος**) أو اللاحقة **-τερος** (**μεγαλύτερος**)؛ و*من* هي **από** + المفعولية أو **παρά**: **Ο Νίκος είναι πιο ψηλός από τον Γιάννη.** «نيكوس أطول من يانيس». والتفضيل المطلق: الأداة + صيغة التفضيل: **ο πιο μεγάλος، ο μεγαλύτερος** «الأكبر». والشاذ: **καλός → καλύτερος**، **κακός → χειρότερος**، **πολύς → περισσότερος**.
  el-passive-present:
    meaning: "الأفعال المنتهية بـ -ομαι (المجهول والأفعال اللازمة الصيغة)"
    intro: |
      الأفعال المنتهية بـ **-ομαι** إما مجهولة (**γράφομαι** «يُكتب») أو لها هذه الصيغة فحسب (**έρχομαι** يأتي، **κάθομαι** يجلس، **σκέφτομαι** يفكر، **χρειάζομαι** يحتاج، **θυμάμαι** يتذكر):

      | | |
      |---|---|
      | έρχ**ομαι** | ερχ**όμαστε** |
      | έρχ**εσαι** | έρχ**εστε** |
      | έρχ**εται** | έρχ**ονται** |

      في المتكلمين والمخاطبين تتقدّم النبرة.
