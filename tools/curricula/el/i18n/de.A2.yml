# German text of the Modern Greek course, A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The past: "Die Vergangenheit"
  Future and subjunctive: "Futur und Konjunktiv"
  Pronouns and cases: "Pronomen und Kasus"
  Commands and comparison: "Imperativ und Steigerung"
lessons:
  el-aorist:
    meaning: "die einfache Vergangenheit (Aorist)"
    intro: |
      Der **Aorist** ist die Vergangenheit einer abgeschlossenen Handlung: *ich schrieb, ich las (einmal)*. Er hat einen eigenen **Stamm**, meist mit **-σ-** (oder **-ψ-, -ξ-**): **γράφω → έγραψα, διαβάζω → διάβασα, ανοίγω → άνοιξα, μιλάω → μίλησα, αγοράζω → αγόρασα**. Endungen: **-α, -ες, -ε, -αμε, -ατε, -αν**.

      Der Akzent liegt immer auf der **drittletzten Silbe**; eine zweisilbige Form bekommt ein **Augment ε-**, um ihn zu tragen: **γράψα → έγραψα**, aber **γράψαμε** (kein Augment nötig). Viele häufige Verben sind unregelmäßig: **έρχομαι → ήρθα, πάω → πήγα, βλέπω → είδα, λέω → είπα, τρώω → έφαγα, πίνω → ήπια, βρίσκω → βρήκα**.
    mistakes: ["Der Akzent muss auf die drittletzte Silbe fallen: das Augment ε- trägt ihn."]
  el-imperfect:
    meaning: "das Imperfekt: tat gerade, pflegte zu tun"
    intro: |
      Das **Imperfekt** nimmt den **Präsensstamm** mit den Vergangenheitsendungen und derselben Akzentregel: **γράφω → έγραφα, διαβάζω → διάβαζα, μιλάω → μιλούσα** (endbetonte Verben nehmen **-ούσα**). Gebrauch für Andauerndes, Wiederholtes oder Gewohnheitsmäßiges: **Όταν ήμουν παιδί, έπαιζα ποδόσφαιρο.** „Als Kind spielte ich Fußball.“ **Διάβαζα όταν χτύπησε το τηλέφωνο.** „Ich las gerade, als das Telefon klingelte.“
  el-future:
    meaning: "das Futur: θα + Verb"
    intro: |
      **θα** + Verb bildet das Futur. Mit dem **Aoriststamm** (perfektiv) ist es ein Einzelereignis: **Θα σου γράψω αύριο.** „Ich schreibe dir morgen.“ Mit dem **Präsensstamm** ist es andauernd oder wiederholt: **Θα σου γράφω κάθε μέρα.** „Ich werde dir jeden Tag schreiben.“ Die Endungen sind die des Präsens: **θα γράψω, θα γράψεις, θα γράψει…**

      **θα** + Imperfekt heißt *würde*: **Θα ερχόμουν, αλλά…** „Ich würde kommen, aber …“
    mistakes: ["θα nimmt den Aoriststamm ohne Augment, mit Präsensendungen."]
  el-na:
    meaning: "να + Verb: das griechische „zu“ und der Konjunktiv"
    intro: |
      Das Griechische hat **keinen Infinitiv**. Wo das Deutsche *ich will gehen* sagt, sagt es *ich will, dass ich gehe*: **Θέλω να πάω.** Das zweite Verb hat seine eigene Person: **Θέλω να πας.** „Ich will, dass du gehst.“ Wie θα nimmt **να** den **Aoriststamm** für eine Einzelhandlung (**να γράψω**) und den Präsensstamm für eine andauernde (**να γράφω**). Häufig: **θέλω, μπορώ, πρέπει, ξέρω, αρχίζω, σταματάω, μου αρέσει να…**; Verneinung **να μην**.
  el-object-pronouns:
    meaning: "schwache Objektpronomen vor dem Verb"
    intro: |
      Objektpronomen sind kurz und stehen **vor** dem Verb: **με** mich, **σε** dich, **τον / την / το** ihn / sie / es, **μας** uns, **σας** euch, **τους / τις / τα** sie: **Σε αγαπάω.** „Ich liebe dich.“ **Τον ξέρω.** „Ich kenne ihn.“ Indirekte Objekte nehmen die Genitivformen: **μου, σου, του, της, μας, σας, τους**: **Μου δίνεις το βιβλίο;** „Gibst du mir das Buch?“ Beim Imperativ stehen sie nach dem Verb: **Δώσε μου το!** „Gib es mir!“
  el-genitive:
    meaning: "der Genitiv: von, Besitz"
    intro: |
      Der Genitiv folgt dem Nomen, zu dem er gehört: **το σπίτι του φίλου μου** „das Haus meines Freundes“, **η πόρτα της κουζίνας** „die Küchentür“. Endungen: maskulin **-ου / -α / -η** (**του φίλου, του πατέρα, του μαθητή**), feminin **+ς** (**της μητέρας, της αδελφής**), neutral **-ου / -ιού / -ματος** (**του βιβλίου, του παιδιού, του γράμματος**). Plural für alle: **-ων** (**των φίλων**).
  el-imperative:
    meaning: "der Imperativ"
    intro: |
      Vom **Aoriststamm** (eine Handlung): **γράψε!** (an eine Person), **γράψτε!** (an mehrere oder höflich); vom Präsensstamm (andauernd): **γράφε!, γράφετε!**. Verben auf -άω/-ώ: **μίλησε, μιλήστε**. Unregelmäßig und sehr häufig: **έλα / ελάτε** (komm), **πάρε** (nimm), **φέρε** (bring), **δες** (schau), **πες** (sag), **φάε** (iss). Verneint: **μη(ν)** + Konjunktiv: **Μη γράψεις!**
  el-comparison:
    meaning: "Steigerung: πιο, -τερος, από"
    intro: |
      **πιο** + Adjektiv (**πιο μεγάλος**) oder das Suffix **-τερος** (**μεγαλύτερος**); *als* ist **από** + Akkusativ oder **παρά**: **Ο Νίκος είναι πιο ψηλός από τον Γιάννη.** Superlativ: Artikel + Komparativ: **ο πιο μεγάλος, ο μεγαλύτερος**. Unregelmäßig: **καλός → καλύτερος**, **κακός → χειρότερος**, **πολύς → περισσότερος**.
  el-passive-present:
    meaning: "Verben auf -ομαι (Passiv und Deponentien)"
    intro: |
      Verben auf **-ομαι** sind passiv (**γράφομαι** „wird geschrieben“) oder haben einfach diese Form (**έρχομαι** kommen, **κάθομαι** sitzen, **σκέφτομαι** denken, **χρειάζομαι** brauchen, **θυμάμαι** sich erinnern):

      | | |
      |---|---|
      | έρχ**ομαι** | ερχ**όμαστε** |
      | έρχ**εσαι** | έρχ**εστε** |
      | έρχ**εται** | έρχ**ονται** |

      In der 1. und 2. Person Plural rückt der Akzent nach vorn.
