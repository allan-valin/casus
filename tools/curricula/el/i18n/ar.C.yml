# Arabic text of the Modern Greek course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Learned verb forms: "صيغ أفعال فصيحة"
  Learned nouns and adjectives: "أسماء وصفات فصيحة"
  Formal connectors and prepositions: "أدوات الربط وحروف الجر الرسمية"
  Clauses in depth: "الجمل التابعة بتعمق"
  Katharevousa in today's Greek: "الكاثاريفوسا في يونانية اليوم"
  Fine points of syntax: "دقائق النحو"
  Spoken and expressive Greek: "اليونانية المحكية والتعبيرية"
lessons:
  el-c1-present-passive-participle:
    meaning: "اسم المفعول الحاضر -όμενος، -ούμενος"
    intro: |
      موروث من اللغة الفصيحة، واسم المفعول المنتهي بـ **-όμενος / -ούμενος / -άμενος** (من أفعال -ομαι، -ούμαι، -άμαι) يعني «الذي يُفعَل، الذي هو…»: **ο ενδιαφερόμενος** «المعنيّ، المهتم»، **ο εργαζόμενος** «الموظف»، **τα λεγόμενα** «ما يُقال»، **ο λεγόμενος** «المسمّى»، **τα περιεχόμενα** «المحتويات». وكثير منها صار صفات يومية: **επόμενος** «التالي»، **προηγούμενος** «السابق»، **ερχόμενος** «القادم»، **χαρούμενος** «فرِح». وتُصرَّف مثل **καλός**.
  el-c1-internal-augment:
    meaning: "الزيادة الداخلية في الأفعال المركبة الفصيحة"
    intro: |
      الأفعال الفصيحة الأصل ذات السابقة الحرفية تضع زيادة الماضي **بين** السابقة والجذر، وتبقى حتى وهي غير منبورة: **συμβαίνει → συνέβη** «حدث»، **υπογράφω → υπέγραψα** «وقّعت»، **επιστρέφω → επέστρεψα** «عدت»، **υπάρχω → υπήρχε** «كان يوجد»، **μεταφράζω → μετέφρασα**، **περιέχω → περιείχε**، **εκδίδω → εξέδωσα**. وتتغير السوابق قبل الصائت: **εκ- → εξ-**، **συμ- → συν-**. وفي الجمع تحذفها أفعال كثيرة في الكلام: **υπογράψαμε**، لكن **υπήρχαν**.
  el-c1-perfect-gerund:
    meaning: "صيغة الحال التامة: بعد أن فعل"
    intro: |
      **έχοντας** + صيغة **-ει** تصوغ حالًا تامة، «بعد أن فعل»، وتُستعمل في الكتابة غالبًا: **Έχοντας τελειώσει τη δουλειά, πήγε σπίτι.** «بعد أن أنهى العمل ذهب إلى البيت». **Έχοντας ζήσει χρόνια στο εξωτερικό, μιλάει τρεις γλώσσες.** «وقد عاشت سنوات في الخارج، فهي تتكلم ثلاث لغات». وككل صيغة حال تشارك الفعل الرئيسي فاعله.
  el-c1-neuter-os:
    meaning: "الأسماء المحايدة الفصيحة بـ -ος وإضافتها -ους"
    intro: |
      مجموعة من الأسماء المحايدة المنتهية بـ **-ος** جاءت من التصريف الثالث القديم: **το μέρος** «جزء، مكان»، **το έτος** «سنة»، **το είδος** «نوع»، **το βάρος** «وزن»، **το λάθος** «خطأ»، **το μέγεθος** «حجم»، **το κράτος** «دولة»، **το ύψος** «ارتفاع». الإضافة **-ους**، والجمع **-η**، وإضافة الجمع **-ών**: **του έτους، τα έτη، των ετών**. لا تخلط بينها وبين المذكر **ο δρόμος**. **εκ μέρους** + الإضافة «نيابةً عن»، **κάθε είδους** «من كل نوع».
  el-c1-learned-superlatives:
    meaning: "التفضيل المطلق بـ -τατος والصيغ الفصيحة الشاذة"
    intro: |
      بجانب **ο πιο μεγάλος / ο μεγαλύτερος** لليونانية **تفضيل مطلق** «جدًا، للغاية» بـ **-ότατος / -ύτατος**: **σπουδαιότατος** «بالغ الأهمية»، **ταχύτατος** «سريع للغاية»، **ελαφρότατος**؛ وصيغ فصيحة شاذة: **μέγιστος** «أقصى»، **ελάχιστος** «أدنى، قليل جدًا»، **άριστος** «ممتاز» (**άριστα** «بامتياز»، أعلى درجة مدرسية)، **βέλτιστος** «الأمثل»، **χείριστος** «الأسوأ»، **πλείστος** «الأكثر» (**ως επί το πλείστον** «في الغالب»). **Το ελάχιστο που μπορώ να κάνω.** «أقل ما يمكنني فعله».
  el-c1-formal-connectors:
    meaning: "أدوات الربط في الأسلوب الرسمي"
    intro: |
      لليونانية الرسمية أدوات ربط خاصة:

      - السبب: **διότι، καθότι** «لأنّ» (= γιατί)، **καθώς** «إذ»؛ وزمنيًا «بينما»
      - الشرط: **εάν** (= αν)، **εφόσον** «ما دام، شريطة أن»
      - النتيجة: **επομένως، συνεπώς، άρα** «لذلك»
      - التفسير: **δηλαδή** «أي»، **ήτοι** «أعني» (كتابية جدًا)
      - البديل: **ειδάλλως / αλλιώς** «وإلا»
  el-c1-learned-prepositions:
    meaning: "حروف الجر الفصيحة مع الإضافة"
    intro: |
      حروف الجر اليومية في اليونانية الحديثة تأخذ المفعولية، لكن مجموعة فصيحة تأخذ **الإضافة**: **μέσω** «عبر» (**μέσω Αθήνας**)، **λόγω** «بسبب» (**λόγω καιρού**)، **υπέρ** «لصالح»، **εναντίον** «ضد»، **περί** «حول، بشأن»، **άνευ** «بدون» (**άνευ όρων** «بلا شروط»)، **εκτός** «إلا، باستثناء»، **κατά τη διάρκεια** «خلال»، **χάρη σε** «بفضل» (مع σε + المفعولية). و**ως** «بصفته، حتى» تأخذ المفعولية أو الرفع: **ως πρόεδρος** «بصفته رئيسًا».
  el-c1-dative-fossils:
    meaning: "حالات القابل القديمة المتحجرة"
    intro: |
      زالت حالة القابل القديمة، لكنها تعيش في عبارات ثابتة من اليونانية اليومية: **εν τω μεταξύ** «في الأثناء»، **τοις εκατό** «بالمئة»، **εν λόγω** «المذكور»، **εν ολίγοις** «باختصار»، **εν πάση περιπτώσει** «على أي حال»، **εν μέρει** «جزئيًا»، **εν γένει** «عمومًا»، **δόξα τω Θεώ** «الحمد لله»، **εν τάξει** (تُكتب اليوم **εντάξει**) «حسنًا». عامل كلًا منها ككلمة واحدة.
  el-c1-pou-emotion:
    meaning: "που بعد أفعال الشعور"
    intro: |
      بعد أفعال **الشعور** وصفاته تُفتتح الجملة المتممة بـ **που** لا بـ **ότι**: **Χαίρομαι που ήρθες.** «يسرّني أنك جئت». **Λυπάμαι που δεν μπορώ να βοηθήσω.** «يؤسفني أنني لا أستطيع المساعدة». **Μετανιώνω που το είπα.** «أندم على أنني قلته». **Ευχαριστώ που με βοήθησες.** «شكرًا لأنك ساعدتني». ومع أفعال القول والظن تكون **ότι / πως**؛ وللواقعة التي يُشكر عليها أو يُؤسف لها **που**.
  el-c1-to-na:
    meaning: "το να: جملة να بمنزلة اسم"
    intro: |
      لا مصدر في اليونانية، فلاستعمال الفعل اسمًا تضع الأداة **το** قبل جملة **να**، كالمصدر المؤول «أنْ + الفعل» في العربية: **Το να καπνίζεις βλάπτει την υγεία.** «التدخين يضر بالصحة». **Το να μάθεις μια γλώσσα θέλει χρόνο.** «أن تتعلم لغة يحتاج وقتًا». وبعد حروف الجر تبيّن الأداة الحالة: **Αντί του να…** (رسمي) «بدلًا من أن…». وكذلك **το ότι** تجعل الواقعة اسمًا: **Το ότι δεν ήρθε με ανησυχεί.** «كونه لم يأتِ يقلقني».
  el-c2-learned-aorists:
    meaning: "أوريست فصيح في الأخبار والدواوين"
    intro: |
      تحتفظ نشرات الأخبار والنصوص الرسمية بأوريست من اللغة الفصيحة القديمة (الكاثاريفوسا)، بالزيادة واللواحق القديمة:

      - المجهول بـ **-η / -ησαν**: **συνελήφθη** «اعتُقل» (يوميًا **συλλήφθηκε**)، **εξελέγη** «انتُخب» (**εκλέχτηκε**)، **ελήφθη** «أُخذ»، **εστάλη** «أُرسل»، **διεξήχθη** «أُقيم»، **ετέθη** «وُضع»
      - المعلوم: **κατέστη** «أصبح»، **απέβη** «تبيّن أنه»، **προέβη σε** «أقدم على»، **απεβίωσε** «توفي»

      **Ο ύποπτος συνελήφθη χθες.** «اعتُقل المشتبه به أمس».
  el-c2-learned-phrases:
    meaning: "عبارات ثابتة بحروف جر قديمة"
    intro: |
      تعيش حروف الجر القديمة في عبارات ثابتة، كلٌّ بحالته القديمة:

      - **εκ / εξ** + الإضافة: **εκ των υστέρων** «بأثر رجعي»، **εξ αρχής** «من البداية»، **εξ ορισμού** «بحكم التعريف»، **εκ μέρους** «نيابةً عن»
      - **επί** + الإضافة / القابل / المفعولية: **επί της ουσίας** «في الجوهر»، **επί τη ευκαιρία** «بمناسبة»، **επί δέκα χρόνια** «لعشر سنين»
      - **υπό** + المفعولية / الإضافة: **υπό τον όρο** «بشرط»، **υπό κατασκευή** «قيد الإنشاء»
      - **ανά** + المفعولية «لكل»: **ανά ώρα** «في الساعة»، **ανά τον κόσμο** «حول العالم»
      - **προ** + الإضافة: **προ ημερών** «قبل أيام»
  el-c2-active-participles:
    meaning: "أسماء الفاعل الفصيحة بـ -ων، -ούσα، -ον"
    intro: |
      تحتفظ اليونانية الرسمية بـ **اسم الفاعل** القديم بـ **-ων، -ουσα، -ον** (الإضافة **-οντος، -ουσας**)، يُصرَّف كصفة التصريف الثالث: **ο παρών، η παρούσα، το παρόν** «حاضر» (**οι παρόντες** «الحاضرون»)، **απών** «غائب»، **ενδιαφέρων، ενδιαφέρουσα، ενδιαφέρον** «مثير للاهتمام»، **ο ισχύων νόμος** «القانون الساري»، **τα υπάρχοντα** «المقتنيات»، **ο μέλλων** «المستقبلي». وكثير منها صار أسماء: **η πρωτεύουσα** «العاصمة»، **το ενδιαφέρον** «الاهتمام»، **το μέλλον** «المستقبل».
  el-c2-adverbs-os:
    meaning: "الظروف الفصيحة بـ -ως بجانب -α اليومية"
    intro: |
      كثير من الصفات تصوغ ظرفين: يوميًا بـ **-α** وفصيحًا بـ **-ως**: **βέβαια / βεβαίως** «بالتأكيد»، **τελικά / τελικώς**، **ιδιαίτερα / ιδιαιτέρως** «خصوصًا»، **απλά / απλώς** «ببساطة، فقط». وصيغة **-ως** رسمية أو مؤكِّدة، وهي الوحيدة لبعض الكلمات: **προφανώς** «من الواضح»، **εντελώς** «تمامًا»، **συνεχώς** «باستمرار»، **πιθανώς** «على الأرجح»، **ευτυχώς / δυστυχώς** «لحسن الحظ / للأسف». وبعض الأزواج يختلف معناه: **απλά** «ببساطة» مقابل **απλώς** «مجرد»، **καλά** «جيدًا» مقابل **καλώς ήρθατε** «أهلًا وسهلًا».
  el-c2-prohibition-aspect:
    meaning: "الجهة بعد μη(ν)"
    intro: |
      يُصاغ النهي بـ **μη(ν)** + الالتماسي، والجهة مهمة: **غير التامة** توقف فعلًا جاريًا أو تنهى عمومًا (**Μη φεύγεις!** «لا تذهب (ابقَ)!»، **Μην καπνίζεις.** «لا تدخّن»)، و**التامة** تنهى عن فعل واحد، تحذيرًا غالبًا (**Μη φύγεις χωρίς εμένα!** «لا تغادر بدوني!»، **Μην το ξεχάσεις!** «لا تنسَه!»). والاختيار نفسه مع **να μην**: **Προσπάθησε να μην αργήσεις.** «حاول ألّا تتأخر».
  el-c2-resumptive:
    meaning: "ضمير داخل جملة που"
    intro: |
      **που** لا تتغير، فإذا كان الموصول مفعولًا غير مباشر أو مالكًا بيّن ضمير ضعيف داخل الجملة دوره — تمامًا كالضمير العائد في العربية: **ο φίλος που του μίλησα** «الصديق الذي كلّمته»، **η γυναίκα που της έδωσα το κλειδί** «المرأة التي أعطيتها المفتاح»، **ο άνθρωπος που του έκλεψαν το αυτοκίνητο** «الرجل الذي سُرقت سيارته». والرسمية تقول ذلك بـ **ο οποίος**: **ο φίλος στον οποίο μίλησα**، **του οποίου το αυτοκίνητο**.
  el-c2-verb-first:
    meaning: "تقديم الفعل والتبئير"
    intro: |
      ترتيب الكلمات في اليونانية حرّ، والفعل ثم الفاعل هو الترتيب المحايد للخبر المفاجئ، كالجملة الفعلية في العربية: **Ήρθε ο Γιάννης.** «جاء يانيس». **Χτύπησε το τηλέφωνο.** «رنّ الهاتف». **Έφυγε το τρένο.** «فات القطار». وتقديم كلمة مع النبر يجعلها **بؤرة**: **Τον ΓΙΑΝΝΗ είδα, όχι τη Μαρία.** «يانيسَ رأيت، لا ماريا». (بلا ضمير مكرر مع المفعول المبأَّر، بخلاف الموضوع).
  el-c2-future-perfect:
    meaning: "θα للترجيح والمستقبل التام"
    intro: |
      **θα έχω + -ει** هو المستقبل التام: **Ως αύριο θα έχω τελειώσει.** «بحلول الغد سأكون قد أنهيت». وكثيرًا ما يعبّر عن **ترجيح** في الماضي: **Θα έχει φύγει ήδη.** «لا بد أنه غادر الآن». وكذلك **θα** + المضارع ترجّح عن الحاضر: **Θα είναι στο σπίτι τώρα.** «لعله في البيت الآن». **Ποιος θα είναι;** «من عساه يكون؟»
  el-c2-diminutives:
    meaning: "التصغير: -άκι، -ίτσα، -ούλα، -ούλης"
    intro: |
      الكلام اليوناني مليء بالتصغير، للصغر وللتحبب خاصة: المحايد **-άκι** (**σπίτι → σπιτάκι**، **γάτα → γατάκι**، **λίγο → λιγάκι** «قليلًا»)، والمؤنث **-ίτσα، -ούλα** (**σκυλίτσα، γατούλα**)، والمذكر **-άκης، -ούλης** (**μικρούλης** «الصغير»). وكثير منها فقد معنى التصغير: **κορίτσι** «بنت»، **παγκάκι** «مقعد»، **σακάκι** «سترة». وصيغ التكبير بـ **-άρα، -αράς** مؤكِّدة: **φωνάρα** «صوت رائع»، **παιδαράς** «شاب ضخم».
  el-c2-colloquial-particles:
    meaning: "أدوات الكلام العامي"
    intro: |
      تلوّن اليونانية المحكية كل جملة تقريبًا بأدوات صغيرة:

      - **ρε، μωρέ، βρε** للنداء، من الودّي إلى الفظ: **Έλα ρε!** «هيا يا رجل!» **Τι λες μωρέ!** «ماذا تقول!»
      - **άντε** «هيا، يلّا» (ونفاد صبر أيضًا: **Άντε πια!** «هيا بقى!»)
      - **κιόλας** «بالفعل، حتى، أيضًا»: **Ήρθες κιόλας;** «وصلت بالفعل؟»
      - **ντε** للحثّ: **Έλα ντε!** «هيا إذن!»
      - **μπας και** «لعلّ، تحسّبًا»: **μπας και βρέξει** «تحسّبًا للمطر»
