# German text of the Modern Greek course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Perfect tenses and the passive past: "Perfekt und Passiv der Vergangenheit"
  Complex sentences: "Komplexe Sätze"
  Non-finite forms: "Infinite Formen"
  Conditions and wishes: "Bedingungen und Wünsche"
  Passive tenses: "Passivtempora"
  Complex clauses: "Komplexe Nebensätze"
  Pronouns and emphasis: "Pronomen und Betonung"
lessons:
  el-perfect:
    meaning: "das Perfekt: έχω + -ει"
    intro: |
      **έχω** + der **Aoriststamm auf -ει** (die erstarrte Form von θα γράψει): **Έχω γράψει.** „Ich habe geschrieben.“ **Έχεις πάει στην Ελλάδα;** „Warst du schon in Griechenland?“ Plusquamperfekt mit **είχα**: **Είχα φύγει.** „Ich war gegangen.“ Das Griechische verwendet das Perfekt seltener als das Deutsche: ein abgeschlossenes Ereignis mit Zeitangabe steht im Aorist: **Έφαγα πριν μια ώρα.**
  el-passive-past:
    meaning: "der passive Aorist: -θηκα, -τηκα"
    intro: |
      Passive (und -ομαι-)Verben bilden ihren Aorist mit **-θηκα / -τηκα / -στηκα**: **γράφομαι → γράφτηκα**, **κάθομαι → κάθισα** (unregelmäßig), **σκέφτομαι → σκέφτηκα**, **χάνομαι → χάθηκα**, **γεννιέμαι → γεννήθηκα**. Endungen **-α, -ες, -ε, -αμε, -ατε, -αν**, Akzentregel wie im Aktiv: **γεννήθηκα, γεννηθήκαμε**. **Γεννήθηκα στο Βερολίνο.** „Ich bin in Berlin geboren.“
  el-relative:
    meaning: "Relativsätze: που"
    intro: |
      **που** (ohne Akzent) ist das Allzweck-Relativ *der, die, das*: **ο άνθρωπος που ήρθε** „der Mann, der kam“, **το βιβλίο που διαβάζω** „das Buch, das ich lese“. Ist das Relativ Objekt oder steht es nach einer Präposition, nimmt formelles Griechisch **ο οποίος, η οποία, το οποίο** (dekliniert): **η πόλη στην οποία μένω** „die Stadt, in der ich wohne“. Nicht verwechseln mit **πού** „wo?“.
  el-conjunctions:
    meaning: "dass, weil, wenn, falls"
    intro: |
      **ότι / πως** dass (nach *sagen, denken, wissen*), **επειδή / γιατί** weil, **όταν** wenn/als, **αν** falls (mit θα im Hauptsatz: **Αν βρέξει, θα μείνω σπίτι.**), **ενώ** während, **αλλά** aber, **ή** oder, **και** und, **μόλις** sobald, **ώστε** sodass, **πριν (να)** bevor, **αφού** da / nachdem.
  el-gerund:
    meaning: "das Gerundium -οντας / -ώντας"
    intro: |
      **-οντας** (stammbetonte Verben) und **-ώντας** (endbetonte): *während, indem*: **Έμαθα ελληνικά διαβάζοντας.** „Ich habe Griechisch durch Lesen gelernt.“ **Μιλώντας στο τηλέφωνο, οδηγούσε.** „Er fuhr, während er telefonierte.“ Es ist unveränderlich.
  el-participle:
    meaning: "das Partizip Perfekt -μένος"
    intro: |
      **-μένος, -μένη, -μένο** ist ein passives Adjektiv und kongruiert wie eins: **Το μαγαζί είναι κλειστό / κλεισμένο.** „Der Laden ist geschlossen.“ **Η πόρτα είναι ανοιγμένη.** **Είμαι κουρασμένος.** „Ich bin müde.“ **Το γράμμα είναι γραμμένο στα ελληνικά.** Einige Verben: **γράφω → γραμμένος, δένω → δεμένος, κουράζω → κουρασμένος, ντύνω → ντυμένος**.
  el-b2-conditional:
    meaning: "der Konditional: θα + Imperfekt, θα είχα + -ει"
    intro: |
      **θα + Imperfekt** ist der Konditional „würde“: **Θα ήθελα έναν καφέ.** „Ich hätte gern einen Kaffee.“ Er bildet irreale Bedingungen mit **αν + Imperfekt**: **Αν είχα χρόνο, θα ερχόμουν.** „Hätte ich Zeit, würde ich kommen.“ Für die Vergangenheit **θα είχα + -ει** (der Perfektstamm): **Αν το ήξερα, θα είχα έρθει.** „Hätte ich es gewusst, wäre ich gekommen.“ **θα + Imperfekt** kann auch „muss wohl gewesen sein“ heißen: **Θα ήταν δέκα η ώρα.** „Es muss zehn Uhr gewesen sein.“
  el-b2-wishes:
    meaning: "Wünsche und Vorschläge: μακάρι να, ας"
    intro: |
      **μακάρι να** + Konjunktiv wünscht etwas Mögliches (**Μακάρι να έρθει!** „Hoffentlich kommt er!“), + Imperfekt etwas jetzt Irreales (**Μακάρι να ήξερα!** „Wenn ich es doch wüsste!“), + **είχα … -ει** für die Vergangenheit (**Μακάρι να είχα πάει.** „Wäre ich doch hingegangen.“).

      **ας** + Konjunktiv macht Vorschläge und Zugeständnisse: **Ας πάμε!** „Gehen wir!“ **Ας έρθει αν θέλει.** „Soll er kommen, wenn er will.“ Mit dem Imperfekt ist es ein Bedauern: **Ας ερχόσουν νωρίτερα!** „Wärst du doch früher gekommen!“
  el-b2-na-past:
    meaning: "να mit Vergangenheitstempora: muss / kann … haben"
    intro: |
      **να** steht normalerweise mit dem Konjunktiv, mit einer **Vergangenheitsform** beschreibt es aber eine vergangene Möglichkeit: **Πρέπει να έφυγε.** „Er muss gegangen sein.“ **Μπορεί να το ξέχασε.** „Er kann es vergessen haben.“ **Ίσως να ήταν κουρασμένος.** „Vielleicht war er müde.“ Vergleiche **Πρέπει να φύγει.** „Er muss gehen.“ Mit **έχει + -ει** wird das Ergebnis betont: **Πρέπει να έχει φύγει.** „Er muss (schon) weg sein.“
  el-b2-passive-imperfect:
    meaning: "das passive Imperfekt: -όμουν, -όταν"
    intro: |
      Verben auf **-ομαι** (und das Passiv) bilden ihr Imperfekt mit **-όμουν, -όσουν, -όταν, -όμασταν, -όσασταν, -όντουσαν / -ονταν**, immer auf dem ersten Vokal der Endung betont: **έρχομαι → ερχόμουν** „ich kam gerade“, **φαίνεται → φαινόταν** „es schien“, **χρειάζομαι → χρειαζόμουν**, **κοιμάμαι → κοιμόμουν**. **Τον έβλεπα ενώ ερχόμουν.** „Ich sah ihn, als ich kam.“ Gesprochen auch **-όμουνα, -όσουνα, -ότανε**.
  el-b2-passive-perfect:
    meaning: "das passive Perfekt: έχω + -θεί"
    intro: |
      Das passive Perfekt nimmt **έχω** + die erstarrte Form auf **-θεί / -τεί** (Konjunktiv Aorist Passiv, 3. Sg.): **Το γράμμα έχει γραφτεί.** „Der Brief ist geschrieben worden.“ **Το σπίτι είχε χτιστεί το 1900.** „Das Haus war 1900 gebaut worden.“ **Έχει ειπωθεί πολλές φορές.** „Es ist oft gesagt worden.“ **Δεν έχει αποφασιστεί ακόμα.** „Es ist noch nicht entschieden.“ Ein Zustand geht auch mit **είναι** + Partizip: **Το γράμμα είναι γραμμένο.**
  el-b2-na-clauses:
    meaning: "Konjunktionen mit να: Zweck, Art, Zeit"
    intro: |
      Viele Nebensätze werden mit **να** + Konjunktiv gebildet: **για να** „um zu“ (**Ήρθα για να σε δω.** „Ich bin gekommen, um dich zu sehen.“), **χωρίς να** „ohne zu“ (**Έφυγε χωρίς να πει τίποτα.** „Er ging, ohne etwas zu sagen.“), **πριν (να)** / **προτού** „bevor“, **αντί να** „anstatt zu“, **μέχρι να / ώσπου να** „bis“. Da das Griechische keinen Infinitiv hat, übernehmen diese Sätze die Arbeit von deutschen *zu*-Infinitiven.
  el-b2-concessive:
    meaning: "obwohl, auch wenn, jedoch"
    intro: |
      Einräumung drücken **αν και** und **παρόλο που** „obwohl“ (Indikativ) aus: **Αν και έβρεχε, βγήκαμε.** „Obwohl es regnete, gingen wir aus.“ **μολονότι** ist buchsprachlich; **έστω κι αν / ακόμα κι αν** „selbst wenn“. Satzübergreifend: **ωστόσο, εντούτοις** „jedoch“, **παρ' όλα αυτά** „trotzdem“.
  el-b2-indirect-questions:
    meaning: "indirekte Fragen"
    intro: |
      Indirekte Ja/Nein-Fragen nehmen **αν** „ob“, W-Fragen behalten ihr Fragewort mit Akzent: **Με ρώτησε αν θέλω καφέ.** „Er fragte mich, ob ich Kaffee wolle.“ **Δεν ξέρω πού μένει.** „Ich weiß nicht, wo er wohnt.“ **Θυμάσαι τι είπε;** „Weißt du noch, was er gesagt hat?“ Das Tempus bleibt wie in der direkten Frage: **Ρώτησε πού είναι** „Er fragte, wo es sei.“
  el-b2-clitic-doubling:
    meaning: "ein vorangestelltes Objekt wird durch ein Pronomen wiederholt"
    intro: |
      Wird ein bestimmtes Objekt als Thema nach vorn gestellt, wiederholt es ein schwaches Pronomen vor dem Verb: **Τον Γιάννη τον ξέρω.** „Giannis — den kenne ich.“ **Το βιβλίο το διάβασα.** „Das Buch habe ich gelesen.“ **Τις φωτογραφίες τις είδες;** „Die Fotos — hast du sie gesehen?“ Die Verdopplung gibt es gesprochen auch beim Objekt nach dem Verb, um es als bekannt zu markieren: **Τον ξέρω τον Γιάννη.**
  el-b2-free-relatives:
    meaning: "wer auch immer, was auch immer, so viel wie"
    intro: |
      **όποιος, -α, -ο** „wer auch immer“, **ό,τι** (mit Komma, zur Unterscheidung von **ότι** „dass“) „was auch immer“, **όπου** „wo auch immer“, **όσος, -η, -ο** „so viel / viele wie“, und die **-δήποτε**-Reihe „irgendein … überhaupt“: **οποιοσδήποτε** „irgendwer“, **οτιδήποτε** „irgendwas“, **οπουδήποτε** „irgendwo“, **οποτεδήποτε** „jederzeit“. **Όποιος θέλει, ας έρθει.** „Wer will, soll kommen.“ **Κάνε ό,τι θέλεις.** „Mach, was du willst.“ **Φάε όσο θέλεις.** „Iss, so viel du willst.“
  el-b2-emphatic-pronouns:
    meaning: "selbst, derselbe, allein"
    intro: |
      Das Griechische hat kein Reflexivpronomen wie *mich selbst*; es nimmt **ο εαυτός μου** „mein Selbst“ (dekliniert, mit Possessiv): **Κοιτάζω τον εαυτό μου.** „Ich betrachte mich.“ **Πρόσεχε τον εαυτό σου.** „Pass auf dich auf.“ **ο ίδιος** heißt „derselbe“ oder, nach Nomen oder Pronomen, „selbst (persönlich)“: **το ίδιο βιβλίο** „dasselbe Buch“, **Ο ίδιος μου το είπε.** „Er hat es mir selbst gesagt.“ **μόνος μου, μόνη σου…** „allein“: **Το έκανα μόνος μου.** „Ich habe es allein gemacht.“
