# Macedonian text of the Modern Greek course, A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The past: "Минатото"
  Future and subjunctive: "Идно време и конјунктив"
  Pronouns and cases: "Заменки и падежи"
  Commands and comparison: "Заповеди и споредување"
lessons:
  el-aorist:
    meaning: "простото минато (аорист)"
    intro: |
      **Аористот** е минатото на завршено дејство: *напишав, прочитав (еднаш)* — исто како македонскиот аорист. Има своја **основа**, обично со **-σ-** (или **-ψ-, -ξ-**): **γράφω → έγραψα, διαβάζω → διάβασα, ανοίγω → άνοιξα, μιλάω → μίλησα, αγοράζω → αγόρασα**. Наставки: **-α, -ες, -ε, -αμε, -ατε, -αν**.

      Акцентот секогаш оди на **третиот слог од крајот** — како во македонскиот! — а двосложна форма добива **аугмент ε-** за да го носи: **γράψα → έγραψα**, но **γράψαμε** (без аугмент). Многу чести глаголи се неправилни: **έρχομαι → ήρθα, πάω → πήγα, βλέπω → είδα, λέω → είπα, τρώω → έφαγα, πίνω → ήπια, βρίσκω → βρήκα**.
    mistakes: ["Акцентот мора да падне на третиот слог од крајот: го носи аугментот ε-."]
  el-imperfect:
    meaning: "минато несвршено: правев, имав обичај"
    intro: |
      **Имперфектот** ја користи **сегашната основа** со минатите наставки и истото правило за акцент: **γράφω → έγραφα, διαβάζω → διάβαζα, μιλάω → μιλούσα** (глаголите нагласени на наставката земаат **-ούσα**). Се користи за нешто во тек, повторено или вообичаено: **Όταν ήμουν παιδί, έπαιζα ποδόσφαιρο.** „Кога бев дете, играв фудбал.“ **Διάβαζα όταν χτύπησε το τηλέφωνο.** „Читав кога заѕвони телефонот.“
  el-future:
    meaning: "идното време: θα + глагол"
    intro: |
      **θα** + глаголот го гради идното време — точно како **ќе**. Со **аористната основа** (свршен вид) е еднократен настан: **Θα σου γράψω αύριο.** „Ќе ти напишам утре.“ Со **сегашната основа** е траење или повторување: **Θα σου γράφω κάθε μέρα.** „Ќе ти пишувам секој ден.“ Наставките се од сегашното: **θα γράψω, θα γράψεις, θα γράψει…**

      **θα** + имперфект значи *ќе (во минато), би*: **Θα ερχόμουν, αλλά…** „Ќе дојдев, ама…“
    mistakes: ["θα зема аористна основа без аугмент, со сегашни наставки."]
  el-na:
    meaning: "να + глагол: грчкото „да“ и конјунктивот"
    intro: |
      Грчкиот **нема инфинитив** — исто како македонскиот. *Сакам да одам* е **Θέλω να πάω**, со **να** точно како **да**. Вториот глагол има свое лице: **Θέλω να πας.** „Сакам да одиш.“ Како θα, **να** зема **аористна основа** за еднократно дејство (**να γράψω** „да напишам“) и сегашна за траење (**να γράφω** „да пишувам“). Чести: **θέλω, μπορώ, πρέπει, ξέρω, αρχίζω, σταματάω, μου αρέσει να…**; негација **να μην** („да не“).
  el-object-pronouns:
    meaning: "кратките објектни заменки пред глаголот"
    intro: |
      Објектните заменки се кратки и стојат **пред** глаголот — како **ме, те, го**: **με** ме, **σε** те, **τον / την / το** го / ја / го, **μας** нѐ, **σας** ве, **τους / τις / τα** ги: **Σε αγαπάω.** „Те сакам.“ **Τον ξέρω.** „Го знам.“ Индиректните објекти ги користат генитивните форми: **μου, σου, του, της, μας, σας, τους**: **Μου δίνεις το βιβλίο;** „Ќе ми ја дадеш книгата?“ Со заповедниот начин доаѓаат по глаголот: **Δώσε μου το!** „Дај ми го!“
  el-genitive:
    meaning: "генитивот: на, припадност"
    intro: |
      Генитивот доаѓа по именката на која ѝ припаѓа: **το σπίτι του φίλου μου** „куќата на мојот пријател“, **η πόρτα της κουζίνας** „вратата на кујната“. Наставки: машки **-ου / -α / -η** (**του φίλου, του πατέρα, του μαθητή**), женски **+ς** (**της μητέρας, της αδελφής**), среден **-ου / -ιού / -ματος** (**του βιβλίου, του παιδιού, του γράμματος**). Множина за сите: **-ων** (**των φίλων**).
  el-imperative:
    meaning: "заповедниот начин"
    intro: |
      Од **аористната основа** (едно дејство): **γράψε!** (на едно лице), **γράψτε!** (на повеќе или учтиво); од сегашната (траење): **γράφε!, γράφετε!**. Глаголи на -άω/-ώ: **μίλησε, μιλήστε**. Неправилни и многу чести: **έλα / ελάτε** (дојди), **πάρε** (земи), **φέρε** (донеси), **δες** (види), **πες** (кажи), **φάε** (јади). Одречно: **μη(ν)** + конјунктив: **Μη γράψεις!** „Немој да пишуваш!“
  el-comparison:
    meaning: "споредување: πιο, -τερος, από"
    intro: |
      **πιο** + придавка (**πιο μεγάλος** — како **по-голем**) или суфиксот **-τερος** (**μεγαλύτερος**); *од* е **από** + акузатив или **παρά**: **Ο Νίκος είναι πιο ψηλός από τον Γιάννη.** „Никос е повисок од Јанис.“ Суперлатив: член + компаратив: **ο πιο μεγάλος, ο μεγαλύτερος** „најголемиот“. Неправилни: **καλός → καλύτερος**, **κακός → χειρότερος**, **πολύς → περισσότερος**.
  el-passive-present:
    meaning: "глаголи на -ομαι (пасив и депоненси)"
    intro: |
      Глаголите на **-ομαι** се пасивни (**γράφομαι** „се пишува“) или просто ја имаат таа форма (**έρχομαι** доаѓа, **κάθομαι** седи, **σκέφτομαι** мисли, **χρειάζομαι** има потреба, **θυμάμαι** се сеќава) — слично на повратните глаголи со **се**:

      | | |
      |---|---|
      | έρχ**ομαι** | ερχ**όμαστε** |
      | έρχ**εσαι** | έρχ**εστε** |
      | έρχ**εται** | έρχ**ονται** |

      Во 1 и 2 лице множина акцентот се поместува напред.
