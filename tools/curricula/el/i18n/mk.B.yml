# Macedonian text of the Modern Greek course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Perfect tenses and the passive past: "Перфект и минато во пасив"
  Complex sentences: "Сложени реченици"
  Non-finite forms: "Нелични форми"
  Conditions and wishes: "Услови и желби"
  Passive tenses: "Пасивни времиња"
  Complex clauses: "Сложени зависни реченици"
  Pronouns and emphasis: "Заменки и нагласување"
lessons:
  el-perfect:
    meaning: "перфектот: έχω + -ει"
    intro: |
      **έχω** + **аористната основа на -ει** (вкочанетата форма од θα γράψει) — како македонското **имам напишано**: **Έχω γράψει.** „Имам напишано.“ **Έχεις πάει στην Ελλάδα;** „Си бил во Грција?“ Плусквамперфект со **είχα**: **Είχα φύγει.** „Бев заминал.“ Завршен настан со означено време оди во аорист: **Έφαγα πριν μια ώρα.** „Јадев пред еден час.“
  el-passive-past:
    meaning: "пасивниот аорист: -θηκα, -τηκα"
    intro: |
      Пасивните (и -ομαι) глаголи го градат аористот со **-θηκα / -τηκα / -στηκα**: **γράφομαι → γράφτηκα**, **κάθομαι → κάθισα** (неправилно), **σκέφτομαι → σκέφτηκα**, **χάνομαι → χάθηκα**, **γεννιέμαι → γεννήθηκα**. Наставки **-α, -ες, -ε, -αμε, -ατε, -αν**, правило за акцент како во активот: **γεννήθηκα, γεννηθήκαμε**. **Γεννήθηκα στα Σκόπια.** „Се родив во Скопје.“
  el-relative:
    meaning: "релативни реченици: που"
    intro: |
      **που** (без акцент) е општото релативно *што, кој* — точно како македонското **што**: **ο άνθρωπος που ήρθε** „човекот што дојде“, **το βιβλίο που διαβάζω** „книгата што ја читам“. Кога релативното е објект или е по предлог, официјалниот грчки користи **ο οποίος, η οποία, το οποίο** (се менува, како **кој, која, кое**): **η πόλη στην οποία μένω** „градот во кој живеам“. Не мешај со **πού** „каде?“.
  el-conjunctions:
    meaning: "дека, бидејќи, кога, ако"
    intro: |
      **ότι / πως** дека (по *кажува, мисли, знае*), **επειδή / γιατί** бидејќи, **όταν** кога, **αν** ако (со θα во главната: **Αν βρέξει, θα μείνω σπίτι.** „Ако врне, ќе останам дома.“), **ενώ** додека, **αλλά** но, **ή** или, **και** и, **μόλις** штом, **ώστε** така што, **πριν (να)** пред да, **αφού** бидејќи / откако.
  el-gerund:
    meaning: "глаголскиот прилог -οντας / -ώντας"
    intro: |
      **-οντας** (глаголи нагласени на основата) и **-ώντας** (нагласени на крајот) — како македонското **-јќи**: **Έμαθα ελληνικά διαβάζοντας.** „Научив грчки читајќи.“ **Μιλώντας στο τηλέφωνο, οδηγούσε.** „Возеше зборувајќи на телефон.“ Никогаш не се менува.
  el-participle:
    meaning: "минатиот партицип -μένος"
    intro: |
      **-μένος, -μένη, -μένο** е пасивна придавка и се согласува како придавка — како **-н, -т**: **Το μαγαζί είναι κλειστό / κλεισμένο.** „Продавницата е затворена.“ **Η πόρτα είναι ανοιγμένη.** **Είμαι κουρασμένος.** „Уморен сум.“ **Το γράμμα είναι γραμμένο στα ελληνικά.** „Писмото е напишано на грчки.“ Некои глаголи: **γράφω → γραμμένος, δένω → δεμένος, κουράζω → κουρασμένος, ντύνω → ντυμένος**.
  el-b2-conditional:
    meaning: "условниот начин: θα + имперфект, θα είχα + -ει"
    intro: |
      **θα + имперфект** е условниот „би“ — како македонското **ќе + минато несвршено**: **Θα ήθελα έναν καφέ.** „Би сакал едно кафе.“ Нереалните услови се со **αν + имперфект**: **Αν είχα χρόνο, θα ερχόμουν.** „Да имав време, ќе дојдев.“ За минатото, **θα είχα + -ει**: **Αν το ήξερα, θα είχα έρθει.** „Да знаев, ќе бев дошол.“ **θα + имперфект** значи и „веројатно беше“: **Θα ήταν δέκα η ώρα.** „Ќе беше десет часот.“
  el-b2-wishes:
    meaning: "желби и предлози: μακάρι να, ας"
    intro: |
      **μακάρι να** (од истиот корен како **макар**) + конјунктив посакува нешто можно (**Μακάρι να έρθει!** „Да даде Господ да дојде!“), + имперфект нешто сега нереално (**Μακάρι να ήξερα!** „Да знаев барем!“), + **είχα … -ει** за минатото (**Μακάρι να είχα πάει.** „Да бев отишол барем.“).

      **ας** + конјунктив дава предлози и отстапки — точно како македонското **ајде** и **нека**: **Ας πάμε!** „Ајде да одиме!“ **Ας έρθει αν θέλει.** „Нека дојде ако сака.“ Со имперфект е жалење: **Ας ερχόσουν νωρίτερα!** „Да беше дошол порано!“
  el-b2-na-past:
    meaning: "να со минати времиња: мора да, можеби"
    intro: |
      **να** вообичаено зема конјунктив, но со **минато** време опишува минато можно: **Πρέπει να έφυγε.** „Мора да заминал.“ **Μπορεί να το ξέχασε.** „Можеби го заборавил.“ **Ίσως να ήταν κουρασμένος.** „Можеби беше уморен.“ Спореди **Πρέπει να φύγει.** „Мора да замине.“ Со **έχει + -ει** се нагласува резултатот: **Πρέπει να έχει φύγει.** „Мора да има заминато (веќе).“
  el-b2-passive-imperfect:
    meaning: "пасивниот имперфект: -όμουν, -όταν"
    intro: |
      Глаголите на **-ομαι** (и пасивот) го градат имперфектот со **-όμουν, -όσουν, -όταν, -όμασταν, -όσασταν, -όντουσαν / -ονταν**, секогаш нагласен на првата самогласка од наставката: **έρχομαι → ερχόμουν** „доаѓав“, **φαίνεται → φαινόταν** „изгледаше“, **χρειάζομαι → χρειαζόμουν**, **κοιμάμαι → κοιμόμουν**. **Τον έβλεπα ενώ ερχόμουν.** „Го гледав додека доаѓав.“ Во говорот и **-όμουνα, -όσουνα, -ότανε**.
  el-b2-passive-perfect:
    meaning: "пасивниот перфект: έχω + -θεί"
    intro: |
      Пасивниот перфект користи **έχω** + вкочанетата форма на **-θεί / -τεί** (пасивен аорист конјунктив, 3 л. едн.): **Το γράμμα έχει γραφτεί.** „Писмото е напишано.“ **Το σπίτι είχε χτιστεί το 1900.** „Куќата беше изградена во 1900.“ **Έχει ειπωθεί πολλές φορές.** „Кажано е многу пати.“ **Δεν έχει αποφασιστεί ακόμα.** „Уште не е одлучено.“ Состојба се изразува и со **είναι** + партицип: **Το γράμμα είναι γραμμένο.**
  el-b2-na-clauses:
    meaning: "сврзници со να: цел, начин, време"
    intro: |
      Многу зависни реченици се градат со **να** + конјунктив, како македонските со **да**: **για να** „за да“ (**Ήρθα για να σε δω.** „Дојдов за да те видам.“), **χωρίς να** „без да“ (**Έφυγε χωρίς να πει τίποτα.** „Си отиде без да каже ништо.“), **πριν (να)** / **προτού** „пред да“, **αντί να** „наместо да“, **μέχρι να / ώσπου να** „додека не“.
  el-b2-concessive:
    meaning: "иако, дури и ако, сепак"
    intro: |
      Отстапката се изразува со **αν και** и **παρόλο που** „иако“ (индикатив): **Αν και έβρεχε, βγήκαμε.** „Иако врнеше, излеговме.“ **μολονότι** е книжевно; **έστω κι αν / ακόμα κι αν** „дури и ако“. Меѓу реченици: **ωστόσο, εντούτοις** „сепак“, **παρ' όλα αυτά** „и покрај тоа“.
  el-b2-indirect-questions:
    meaning: "индиректни прашања"
    intro: |
      Индиректните да/не прашања користат **αν** „дали“, а прашањата со прашален збор го задржуваат зборот со акцентот: **Με ρώτησε αν θέλω καφέ.** „Ме праша дали сакам кафе.“ **Δεν ξέρω πού μένει.** „Не знам каде живее.“ **Θυμάσαι τι είπε;** „Се сеќаваш што рече?“ Времето останува како во директното прашање: **Ρώτησε πού είναι** „Праша каде е.“
  el-b2-clitic-doubling:
    meaning: "истакнат објект повторен со заменка"
    intro: |
      Кога определен објект се истакнува напред како тема, кратка заменка го повторува пред глаголот — исто како македонското удвојување на објектот: **Τον Γιάννη τον ξέρω.** „Јанис го знам.“ **Το βιβλίο το διάβασα.** „Книгата ја прочитав.“ **Τις φωτογραφίες τις είδες;** „Фотографиите ги виде?“ Во говорот удвојувањето се јавува и со објект по глаголот: **Τον ξέρω τον Γιάννη.** „Го знам Јанис.“ (Но во македонскиот тоа е задолжително, а во грчкиот само за нагласување.)
  el-b2-free-relatives:
    meaning: "кој и да е, што и да е, колку што"
    intro: |
      **όποιος, -α, -ο** „кој и да е“, **ό,τι** (со запирка, за да се разликува од **ότι** „дека“) „што и да е“, **όπου** „каде и да е“, **όσος, -η, -ο** „колку што“, и редот на **-δήποτε** „било кој“: **οποιοσδήποτε** „било кој“, **οτιδήποτε** „било што“, **οπουδήποτε** „било каде“, **οποτεδήποτε** „било кога“. **Όποιος θέλει, ας έρθει.** „Кој сака, нека дојде.“ **Κάνε ό,τι θέλεις.** „Прави што сакаш.“ **Φάε όσο θέλεις.** „Јади колку сакаш.“
  el-b2-emphatic-pronouns:
    meaning: "себе, ист, сам"
    intro: |
      Грчкиот нема повратна заменка како **себе**; користи **ο εαυτός μου** „моето јас“ (се менува, со присвојна): **Κοιτάζω τον εαυτό μου.** „Се гледам себеси.“ **Πρόσεχε τον εαυτό σου.** „Чувај се.“ **ο ίδιος** значи „ист“ или, по именка или заменка, „лично“: **το ίδιο βιβλίο** „истата книга“, **Ο ίδιος μου το είπε.** „Тој лично ми кажа.“ **μόνος μου, μόνη σου…** „сам, сама“: **Το έκανα μόνος μου.** „Го направив сам.“
