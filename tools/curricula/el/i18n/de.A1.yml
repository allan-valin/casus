# German text of the Modern Greek course, A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Letters and sounds: "Buchstaben und Laute"
  Articles and gender: "Artikel und Genus"
  Verbs in the present: "Verben im Präsens"
  Nouns and adjectives: "Nomen und Adjektive"
lessons:
  el-alphabet:
    meaning: "das Alphabet, der Akzent und die fünf Schreibungen des i"
    intro: |
      Das Griechische hat 24 Buchstaben und fünf Vokal**laute**: *a, e, i, o, u*. Mehrere Buchstaben und Paare schreiben denselben Laut, und die Schreibung muss mit dem Wort gelernt werden:

      - *i*: **ι, η, υ, ει, οι** (**σπίτι** Haus, **μητέρα** Mutter, **ύπνος** Schlaf, **είμαι** ich bin, **οικογένεια** Familie)
      - *o*: **ο, ω** (**σπίτι του** sein Haus, **ώρα** Stunde)
      - *e*: **ε, αι** (**έχω**, **και** und)
      - *u*: **ου** (**ουρανός** Himmel)

      Konsonantenpaare: **μπ** = b (**μπαμπάς**), **ντ** = d (**ντομάτα**), **γκ / γγ** = g (**γκαράζ**), **τσ** = ts, **τζ** = ds. **γ** vor *e, i* klingt wie *j* (**γεια**). Jedes Wort mit zwei oder mehr Silben trägt einen geschriebenen **Akzent** (**´**) auf dem betonten Vokal: **μήλο** (Apfel) gegenüber **μηλό** (Wangenknochen, selten). **;** ist das Fragezeichen.
    mistakes: ["Gleicher Laut, eine Schreibung: lerne das Wort, wie es geschrieben wird."]
  el-articles:
    meaning: "der Artikel und die drei Genera"
    intro: |
      Jedes Nomen ist **maskulin, feminin oder neutral**, und der Artikel zeigt es: **ο** άντρας (der Mann), **η** γυναίκα (die Frau), **το** παιδί (das Kind). Die Endung verrät es meist:

      - maskulin: **-ος, -ας, -ης** (ο δρόμος, ο πατέρας, ο μαθητής)
      - feminin: **-α, -η** (η μητέρα, η αδελφή), einige **-ος** (η οδός)
      - neutral: **-ο, -ι, -μα** (το βιβλίο, το σπίτι, το γράμμα)

      Plural: **οι** (maskulin und feminin), **τα** (neutral). Der unbestimmte Artikel ist **ένας, μία (μια), ένα**. Das Griechische setzt den Artikel öfter als das Deutsche, auch bei Namen: **ο Γιάννης**, und bei allgemeinen Nomen: **Μου αρέσει ο καφές** „Ich mag Kaffee“.
    mistakes: ["γυναίκα endet auf -α: feminin."]
  el-eimai:
    meaning: "είμαι „sein“ und die Personalpronomen"
    intro: |
      **εγώ** ich, **εσύ** du, **αυτός / αυτή / αυτό** er / sie / es, **εμείς** wir, **εσείς** ihr / Sie, **αυτοί / αυτές / αυτά** sie. Die Verbendung sagt schon, wer gemeint ist, daher stehen Pronomen nur zur Betonung.

      **είμαι, είσαι, είναι, είμαστε, είστε (είσαστε), είναι** — 3. Person Singular und Plural sind gleich. Vergangenheit: **ήμουν, ήσουν, ήταν, ήμασταν, ήσασταν, ήταν**.
  el-verbs-a:
    meaning: "das Präsens der Verben auf -ω (erste Konjugation)"
    intro: |
      Stammbetonte Verben auf **-ω**: **γράφω** (schreiben), **μένω** (wohnen), **διαβάζω** (lesen), **δουλεύω** (arbeiten), **πίνω** (trinken).

      | | |
      |---|---|
      | γράφ**ω** | γράφ**ουμε** |
      | γράφ**εις** | γράφ**ετε** |
      | γράφ**ει** | γράφ**ουν(ε)** |

      Das griechische Präsens deckt *ich schreibe* und *ich schreibe gerade* ab.
    mistakes: ["2. Person Singular: -εις."]
  el-verbs-b:
    meaning: "endbetonte Verben: -άω und -ώ (zweite Konjugation)"
    intro: |
      Verben mit Betonung auf der letzten Silbe bilden zwei Gruppen:

      | -άω (μιλάω sprechen) | -ώ (μπορώ können) |
      |---|---|
      | μιλ**άω** / μιλ**ώ** | μπορ**ώ** |
      | μιλ**άς** | μπορ**είς** |
      | μιλ**άει** / μιλ**ά** | μπορ**εί** |
      | μιλ**άμε** / μιλ**ούμε** | μπορ**ούμε** |
      | μιλ**άτε** | μπορ**είτε** |
      | μιλ**άνε** / μιλ**ούν** | μπορ**ούν(ε)** |

      **-άω**: αγαπάω (lieben), ρωτάω (fragen), ξεχνάω (vergessen), πεινάω (Hunger haben). **-ώ**: μπορώ, ζω (leben), οδηγώ (fahren), τηλεφωνώ (anrufen), προσπαθώ (versuchen).
  el-negation:
    meaning: "Verneinung: δεν, μην, όχι"
    intro: |
      **δεν (δε)** vor dem Verb in Aussagen und Fragen: **Δεν ξέρω.** „Ich weiß nicht.“ **μην (μη)** nach **να**, in Befehlen und Wünschen: **Μην ανησυχείς!** „Mach dir keine Sorgen!“, **Θέλω να μην έρθει.** „Ich will, dass er nicht kommt.“ **όχι** ist *nein* und verneint andere Wörter: **Όχι, ευχαριστώ.** „Nein, danke.“ **ναι** ist *ja*. Das **-ν** bleibt vor Vokalen und κ π τ ξ ψ μπ ντ γκ τσ τζ.
  el-questions:
    meaning: "Fragewörter"
    intro: |
      **τι** was, **ποιος / ποια / ποιο** wer, welcher (dekliniert), **πού** wo (mit Akzent; **που** ohne ist *der, die, das* als Relativ), **από πού** woher, **πότε** wann, **πώς** wie, **γιατί** warum (auch *weil*), **πόσο / πόσα / πόσοι** wie viel, wie viele. Ja/Nein-Fragen behalten die Wortstellung und ändern nur die Intonation: **Είσαι Έλληνας;**
  el-accusative:
    meaning: "der Akkusativ: Objekt und nach Präpositionen"
    intro: |
      Das Griechische hat vier Kasus: **Nominativ** (Subjekt), **Akkusativ** (Objekt und nach jeder Präposition: **σε, από, με, για, χωρίς**), **Genitiv** (*von*, A2) und **Vokativ** (Anrede). Im Akkusativ verlieren Maskulina das **-ς**: **ο φίλος → τον φίλο**, **ο πατέρας → τον πατέρα**, **ο μαθητής → τον μαθητή**; Feminina und Neutra sehen wie der Nominativ Singular aus, nur der Artikel ändert sich: **η μητέρα → τη(ν) μητέρα**, **το σπίτι → το σπίτι**.
  el-plural:
    meaning: "der Plural der Nomen"
    intro: |
      | Singular | Plural |
      |---|---|
      | ο φίλ**ος** | οι φίλ**οι** |
      | ο πατέρ**ας**, ο μαθητ**ής** | οι πατέρ**ες**, οι μαθητ**ές** |
      | η μητέρ**α**, η αδελφ**ή** | οι μητέρ**ες**, οι αδελφ**ές** |
      | το βιβλί**ο** | τα βιβλί**α** |
      | το σπίτ**ι** | τα σπίτ**ια** |
      | το γράμ**μα** | τα γράμ**ματα** |

      Akkusativ Plural: Maskulina auf **-ος → -ους** (τους φίλους); die übrigen wie der Nominativ, mit **τους / τις / τα**.
  el-adjectives:
    meaning: "Adjektive kongruieren in Genus, Numerus und Kasus"
    intro: |
      Die meisten Adjektive enden auf **-ος, -η, -ο** (oder **-ος, -α, -ο** nach Vokal: **ωραίος, ωραία, ωραίο**) und übernehmen Genus, Numerus und Kasus des Nomens: **ο μεγάλος σκύλος, η μεγάλη πόλη, το μεγάλο σπίτι, τα μεγάλα σπίτια**. Sie stehen vor dem Nomen. Andere: **-ύς, -ιά, -ύ** (**βαθύς** tief), **-ής, -ής, -ές** (**ακριβής** genau).
  el-possessive:
    meaning: "Possessive: μου, σου, του, της, μας, σας, τους"
    intro: |
      Besitz ist ein kurzes Pronomen **nach** dem Nomen, mit dem Artikel davor: **το σπίτι μου** mein Haus, **η μητέρα σου** deine Mutter, **ο φίλος του / της** sein / ihr Freund, **τα παιδιά μας** unsere Kinder, **ο δάσκαλός σας** euer Lehrer, **το αυτοκίνητό τους** ihr Auto. Ein auf der drittletzten Silbe betontes Nomen bekommt einen zweiten Akzent: **ο δάσκαλός μου**.
  el-se-article:
    meaning: "σε + Artikel: στο, στη(ν), στον, στα, στις, στους"
    intro: |
      **σε** (in, an, nach) verschmilzt mit dem Artikel: **σε + το = στο**, **σε + τη(ν) = στη(ν)**, **σε + τον = στον**, **στα, στις, στους**: **Μένω στην Αθήνα.** „Ich wohne in Athen.“ **Πάω στο σχολείο.** „Ich gehe zur Schule.“ Der Artikel muss zum folgenden Nomen passen.
  el-numbers:
    meaning: "Zahlen 1–100"
    intro: |
      **1 ένα** (ένας, μία), **2 δύο**, **3 τρία** (τρεις), **4 τέσσερα** (τέσσερις), **5 πέντε**, **6 έξι**, **7 επτά / εφτά**, **8 οκτώ / οχτώ**, **9 εννέα / εννιά**, **10 δέκα**, **11 έντεκα**, **12 δώδεκα**, **13 δεκατρία**, **20 είκοσι**, **30 τριάντα**, **40 σαράντα**, **50 πενήντα**, **100 εκατό**. **1, 3, 4** richten sich nach dem Genus des Nomens: **ένας φίλος, μία φίλη; τρεις φίλοι, τρία παιδιά**.
