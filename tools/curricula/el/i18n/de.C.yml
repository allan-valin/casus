# German text of the Modern Greek course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Learned verb forms: "Gelehrte Verbformen"
  Learned nouns and adjectives: "Gelehrte Nomen und Adjektive"
  Formal connectors and prepositions: "Formelle Konnektoren und Präpositionen"
  Clauses in depth: "Nebensätze im Detail"
  Katharevousa in today's Greek: "Katharevousa im heutigen Griechisch"
  Fine points of syntax: "Feinheiten der Syntax"
  Spoken and expressive Greek: "Gesprochenes und expressives Griechisch"
lessons:
  el-c1-present-passive-participle:
    meaning: "das Partizip Präsens Passiv -όμενος, -ούμενος"
    intro: |
      Aus der Gelehrtensprache geerbt, bedeutet das Partizip auf **-όμενος / -ούμενος / -άμενος** (von Verben auf -ομαι, -ούμαι, -άμαι) „werdend, das … wird“: **ο ενδιαφερόμενος** „der Betroffene, Interessent“, **ο εργαζόμενος** „der Arbeitnehmer“, **τα λεγόμενα** „das Gesagte“, **ο λεγόμενος** „der sogenannte“, **τα περιεχόμενα** „der Inhalt“. Viele sind Alltagsadjektive geworden: **επόμενος** „nächster“, **προηγούμενος** „vorheriger“, **ερχόμενος** „kommender“, **χαρούμενος** „fröhlich“. Sie werden wie **καλός** dekliniert.
  el-c1-internal-augment:
    meaning: "das innere Augment in gelehrten zusammengesetzten Verben"
    intro: |
      Verben gelehrter Herkunft mit Präpositionspräfix setzen das Augment der Vergangenheit **zwischen** Präfix und Stamm, und es bleibt auch unbetont: **συμβαίνει → συνέβη** „es geschah“, **υπογράφω → υπέγραψα** „ich unterschrieb“, **επιστρέφω → επέστρεψα** „ich kehrte zurück“, **υπάρχω → υπήρχε** „es gab“, **μεταφράζω → μετέφρασα**, **περιέχω → περιείχε**, **εκδίδω → εξέδωσα**. Präfixe ändern sich vor Vokal: **εκ- → εξ-**, **συμ- → συν-**. Im Plural lassen es viele Verben gesprochen weg: **υπογράψαμε**, aber **υπήρχαν**.
  el-c1-perfect-gerund:
    meaning: "das Perfektgerundium: getan habend"
    intro: |
      **έχοντας** + die **-ει**-Form bildet ein Perfektgerundium, „nachdem … hatte“, meist schriftlich: **Έχοντας τελειώσει τη δουλειά, πήγε σπίτι.** „Nachdem er die Arbeit beendet hatte, ging er nach Hause.“ **Έχοντας ζήσει χρόνια στο εξωτερικό, μιλάει τρεις γλώσσες.** „Da sie jahrelang im Ausland gelebt hat, spricht sie drei Sprachen.“ Wie jedes Gerundium teilt es das Subjekt des Hauptverbs.
  el-c1-neuter-os:
    meaning: "gelehrte Neutra auf -ος und ihr Genitiv -ους"
    intro: |
      Eine Gruppe neutraler Nomen auf **-ος** stammt aus der alten dritten Deklination: **το μέρος** „Teil, Ort“, **το έτος** „Jahr“, **το είδος** „Art“, **το βάρος** „Gewicht“, **το λάθος** „Fehler“, **το μέγεθος** „Größe“, **το κράτος** „Staat“, **το ύψος** „Höhe“. Genitiv **-ους**, Plural **-η**, Genitiv Plural **-ών**: **του έτους, τα έτη, των ετών**. Nicht mit dem Maskulinum **ο δρόμος** verwechseln. **εκ μέρους** + Gen. „im Namen von“, **κάθε είδους** „jeder Art“.
  el-c1-learned-superlatives:
    meaning: "absolute Superlative auf -τατος und unregelmäßige gelehrte Formen"
    intro: |
      Neben **ο πιο μεγάλος / ο μεγαλύτερος** hat das Griechische einen **absoluten Superlativ** „sehr, äußerst“ auf **-ότατος / -ύτατος**: **σπουδαιότατος** „höchst wichtig“, **ταχύτατος** „äußerst schnell“, **ελαφρότατος**; und gelehrte unregelmäßige Formen: **μέγιστος** „maximal“, **ελάχιστος** „minimal, sehr wenig“, **άριστος** „ausgezeichnet“ (**άριστα** „ausgezeichnet“, die beste Schulnote), **βέλτιστος** „optimal“, **χείριστος** „schlechtester“, **πλείστος** „meister“ (**ως επί το πλείστον** „größtenteils“). **Το ελάχιστο που μπορώ να κάνω.** „Das Mindeste, was ich tun kann.“
  el-c1-formal-connectors:
    meaning: "Konnektoren des formellen Stils"
    intro: |
      Formelles Griechisch hat eigene Konnektoren:

      - Grund: **διότι, καθότι** „weil“ (= γιατί), **καθώς** „da“; zeitlich auch „während, als“
      - Bedingung: **εάν** (= αν), **εφόσον** „sofern, da“
      - Folge: **επομένως, συνεπώς, άρα** „folglich“
      - Erklärung: **δηλαδή** „das heißt“, **ήτοι** „nämlich“ (sehr buchsprachlich)
      - Alternative: **ειδάλλως / αλλιώς** „sonst“
  el-c1-learned-prepositions:
    meaning: "gelehrte Präpositionen mit Genitiv"
    intro: |
      Die Alltagspräpositionen des Neugriechischen nehmen den Akkusativ, eine Reihe gelehrter aber den **Genitiv** — wie deutsch *wegen, mittels*: **μέσω** „über, mittels“ (**μέσω Αθήνας**), **λόγω** „wegen“ (**λόγω καιρού**), **υπέρ** „zugunsten“, **εναντίον** „gegen“, **περί** „über, betreffend“, **άνευ** „ohne“ (**άνευ όρων** „bedingungslos“), **εκτός** „außer“, **κατά τη διάρκεια** „während“, **χάρη σε** „dank“ (mit σε + Akk.). **ως** „als, bis“ nimmt Akkusativ oder Nominativ: **ως πρόεδρος** „als Präsident“.
  el-c1-dative-fossils:
    meaning: "erstarrte antike Dative"
    intro: |
      Der antike Dativ ist verschwunden, lebt aber in festen Wendungen des Alltagsgriechischen fort: **εν τω μεταξύ** „inzwischen“, **τοις εκατό** „Prozent“, **εν λόγω** „betreffend, fraglich“, **εν ολίγοις** „kurz gesagt“, **εν πάση περιπτώσει** „jedenfalls“, **εν μέρει** „teilweise“, **εν γένει** „im Allgemeinen“, **δόξα τω Θεώ** „Gott sei Dank“, **εν τάξει** (heute **εντάξει**) „okay“. Behandle jede als ein Wort.
  el-c1-pou-emotion:
    meaning: "που nach Gefühlsverben"
    intro: |
      Nach Verben und Adjektiven des **Gefühls** wird der Ergänzungssatz mit **που** eingeleitet, nicht mit **ότι**: **Χαίρομαι που ήρθες.** „Ich freue mich, dass du gekommen bist.“ **Λυπάμαι που δεν μπορώ να βοηθήσω.** „Es tut mir leid, dass ich nicht helfen kann.“ **Μετανιώνω που το είπα.** „Ich bereue, es gesagt zu haben.“ **Ευχαριστώ που με βοήθησες.** „Danke, dass du mir geholfen hast.“ Nach Verben des Sagens und Denkens steht **ότι / πως**; für eine Tatsache, für die man dankbar ist oder die man bedauert, **που**.
  el-c1-to-na:
    meaning: "το να: ein να-Satz als Nomen"
    intro: |
      Ohne Infinitiv setzt das Griechische, um eine Handlung als Nomen zu verwenden, den Artikel **το** vor einen **να**-Satz — wie das deutsche substantivierte *das Rauchen*: **Το να καπνίζεις βλάπτει την υγεία.** „Rauchen schadet der Gesundheit.“ **Το να μάθεις μια γλώσσα θέλει χρόνο.** „Eine Sprache zu lernen braucht Zeit.“ Nach Präpositionen zeigt der Artikel den Kasus: **Αντί του να…** (formell) „anstatt zu …“. Ebenso macht **το ότι** eine Tatsache zum Nomen: **Το ότι δεν ήρθε με ανησυχεί.** „Dass er nicht kam, beunruhigt mich.“
  el-c2-learned-aorists:
    meaning: "gelehrte Aoriste der Nachrichten und Amtssprache"
    intro: |
      Nachrichten und Amtstexte bewahren Aoriste aus der alten Gelehrtensprache (Katharevousa), mit Augment und antiken Endungen:

      - Passiv auf **-η / -ησαν**: **συνελήφθη** „wurde festgenommen“ (alltäglich **συλλήφθηκε**), **εξελέγη** „wurde gewählt“ (**εκλέχτηκε**), **ελήφθη** „wurde genommen“, **εστάλη** „wurde gesandt“, **διεξήχθη** „fand statt“, **ετέθη** „wurde gestellt“
      - Aktiv: **κατέστη** „wurde, erwies sich als“, **απέβη** „stellte sich heraus“, **προέβη σε** „schritt zu“, **απεβίωσε** „verschied“

      **Ο ύποπτος συνελήφθη χθες.** „Der Verdächtige wurde gestern festgenommen.“
  el-c2-learned-phrases:
    meaning: "feste Wendungen mit antiken Präpositionen"
    intro: |
      Antike Präpositionen leben in festen Wendungen fort, jede mit ihrem alten Kasus:

      - **εκ / εξ** + Gen.: **εκ των υστέρων** „im Nachhinein“, **εξ αρχής** „von Anfang an“, **εξ ορισμού** „per Definition“, **εκ μέρους** „im Namen von“
      - **επί** + Gen. / Dat. / Akk.: **επί της ουσίας** „in der Sache“, **επί τη ευκαιρία** „aus Anlass“, **επί δέκα χρόνια** „zehn Jahre lang“
      - **υπό** + Akk. / Gen.: **υπό τον όρο** „unter der Bedingung“, **υπό κατασκευή** „im Bau“
      - **ανά** + Akk. „pro“: **ανά ώρα** „pro Stunde“, **ανά τον κόσμο** „rund um die Welt“
      - **προ** + Gen.: **προ ημερών** „vor einigen Tagen“
  el-c2-active-participles:
    meaning: "gelehrte aktive Partizipien auf -ων, -ούσα, -ον"
    intro: |
      Formelles Griechisch bewahrt das antike **aktive Partizip** auf **-ων, -ουσα, -ον** (Gen. **-οντος, -ουσας**), dekliniert wie ein Adjektiv der dritten Deklination: **ο παρών, η παρούσα, το παρόν** „anwesend, gegenwärtig“ (**οι παρόντες** „die Anwesenden“), **απών** „abwesend“, **ενδιαφέρων, ενδιαφέρουσα, ενδιαφέρον** „interessant“, **ο ισχύων νόμος** „das geltende Gesetz“, **τα υπάρχοντα** „Habseligkeiten“, **ο μέλλων** „künftig“. Viele sind Nomen geworden: **η πρωτεύουσα** „Hauptstadt“, **το ενδιαφέρον** „Interesse“, **το μέλλον** „die Zukunft“.
  el-c2-adverbs-os:
    meaning: "gelehrte Adverbien auf -ως neben alltäglichem -α"
    intro: |
      Viele Adjektive bilden zwei Adverbien: alltägliches **-α** und gelehrtes **-ως**: **βέβαια / βεβαίως** „gewiss“, **τελικά / τελικώς**, **ιδιαίτερα / ιδιαιτέρως** „besonders“, **απλά / απλώς** „einfach, bloß“. Die **-ως**-Form klingt formell oder nachdrücklich und ist bei manchen Wörtern die einzige: **προφανώς** „offensichtlich“, **εντελώς** „völlig“, **συνεχώς** „ständig“, **πιθανώς** „wahrscheinlich“, **ευτυχώς / δυστυχώς** „glücklicherweise / leider“. Manche Paare unterscheiden sich in der Bedeutung: **απλά** „schlicht“ gegenüber **απλώς** „bloß“, **καλά** „gut“ gegenüber **καλώς ήρθατε** „willkommen“.
  el-c2-prohibition-aspect:
    meaning: "der Aspekt nach μη(ν)"
    intro: |
      Verbote werden mit **μη(ν)** + Konjunktiv gebildet, und der Aspekt zählt: der **imperfektive** stoppt eine laufende Handlung oder verbietet allgemein (**Μη φεύγεις!** „Geh nicht (bleib)!“, **Μην καπνίζεις.** „Rauch nicht.“), der **perfektive** verbietet eine einzelne Handlung, oft als Warnung (**Μη φύγεις χωρίς εμένα!** „Geh nicht ohne mich!“, **Μην το ξεχάσεις!** „Vergiss es nicht!“). Dieselbe Wahl gilt bei **να μην**: **Προσπάθησε να μην αργήσεις.** „Versuch, nicht zu spät zu kommen.“
  el-c2-resumptive:
    meaning: "ein Pronomen im που-Satz"
    intro: |
      **που** ist unveränderlich; ist das Relativ indirektes Objekt oder Besitzer, zeigt ein schwaches Pronomen im Satz seine Rolle: **ο φίλος που του μίλησα** „der Freund, mit dem ich sprach“, **η γυναίκα που της έδωσα το κλειδί** „die Frau, der ich den Schlüssel gab“, **ο άνθρωπος που του έκλεψαν το αυτοκίνητο** „der Mann, dessen Auto gestohlen wurde“. Formelles Griechisch sagt dasselbe mit **ο οποίος**: **ο φίλος στον οποίο μίλησα**, **του οποίου το αυτοκίνητο**.
  el-c2-verb-first:
    meaning: "Verberststellung und Fokus"
    intro: |
      Die griechische Wortstellung ist frei, und Verb–Subjekt ist die neutrale Stellung für Neuigkeiten aus heiterem Himmel: **Ήρθε ο Γιάννης.** „Giannis ist gekommen.“ **Χτύπησε το τηλέφωνο.** „Das Telefon hat geklingelt.“ **Έφυγε το τρένο.** „Der Zug ist weg.“ Ein betont vorangestelltes Wort wird zum **Fokus**: **Τον ΓΙΑΝΝΗ είδα, όχι τη Μαρία.** „Giannis habe ich gesehen, nicht Maria.“ (kein Verdopplungspronomen beim fokussierten Objekt, anders als beim Thema).
  el-c2-future-perfect:
    meaning: "θα für Vermutung und das Futur II"
    intro: |
      **θα έχω + -ει** ist das Futur II: **Ως αύριο θα έχω τελειώσει.** „Bis morgen werde ich fertig sein.“ Sehr oft drückt es eine **Vermutung** über die Vergangenheit aus — wie deutsch *wird … haben*: **Θα έχει φύγει ήδη.** „Er wird schon gegangen sein.“ Ebenso vermutet **θα** + Präsens über die Gegenwart: **Θα είναι στο σπίτι τώρα.** „Er wird jetzt zu Hause sein.“ **Ποιος θα είναι;** „Wer kann das sein?“
  el-c2-diminutives:
    meaning: "Diminutive: -άκι, -ίτσα, -ούλα, -ούλης"
    intro: |
      Gesprochenes Griechisch ist voller Diminutive, für Kleinheit und vor allem für Zuneigung: neutral **-άκι** (**σπίτι → σπιτάκι**, **γάτα → γατάκι**, **λίγο → λιγάκι** „ein bisschen“), feminin **-ίτσα, -ούλα** (**σκυλίτσα, γατούλα**), maskulin **-άκης, -ούλης** (**μικρούλης** „Kleiner“). Viele haben den Diminutivsinn verloren: **κορίτσι** „Mädchen“, **παγκάκι** „Bank“, **σακάκι** „Sakko“. Augmentative auf **-άρα, -αράς** sind nachdrücklich: **φωνάρα** „eine tolle Stimme“, **παιδαράς** „ein stattlicher Bursche“.
  el-c2-colloquial-particles:
    meaning: "Partikeln der Umgangssprache"
    intro: |
      Gesprochenes Griechisch färbt fast jeden Satz mit Partikeln:

      - **ρε, μωρέ, βρε** für die Anrede, von freundlich bis grob: **Έλα ρε!** „Komm schon, Mann!“ **Τι λες μωρέ!** „Was sagst du da!“
      - **άντε** „los, mach schon“ (auch Ungeduld: **Άντε πια!** „Jetzt aber los!“)
      - **κιόλας** „schon, sogar, auch“: **Ήρθες κιόλας;** „Du bist schon da?“
      - **ντε** drängend: **Έλα ντε!** „Na komm schon!“
      - **μπας και** „vielleicht, falls“: **μπας και βρέξει** „falls es regnet“
