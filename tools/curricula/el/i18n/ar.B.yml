# Arabic text of the Modern Greek course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Perfect tenses and the passive past: "أزمنة التام والماضي المجهول"
  Complex sentences: "الجمل المركبة"
  Non-finite forms: "الصيغ غير المتصرفة"
  Conditions and wishes: "الشرط والتمني"
  Passive tenses: "أزمنة المجهول"
  Complex clauses: "الجمل التابعة المركبة"
  Pronouns and emphasis: "الضمائر والتوكيد"
lessons:
  el-perfect:
    meaning: "التام: έχω + -ει"
    intro: |
      **έχω** + **جذر الأوريست المنتهي بـ -ει** (الصيغة المتجمدة من θα γράψει): **Έχω γράψει.** «لقد كتبت». **Έχεις πάει στην Ελλάδα;** «هل سبق أن ذهبت إلى اليونان؟» والماضي التام بـ **είχα**: **Είχα φύγει.** «كنت قد غادرت». واليونانية تستعمل التام أقل من الإنجليزية: الحدث المنتهي مع زمن محدد يكون أوريست: **Έφαγα πριν μια ώρα.** «أكلت قبل ساعة».
  el-passive-past:
    meaning: "الأوريست المجهول: -θηκα، -τηκα"
    intro: |
      الأفعال المجهولة (وأفعال -ομαι) تصوغ الأوريست بـ **-θηκα / -τηκα / -στηκα**: **γράφομαι → γράφτηκα**، **κάθομαι → κάθισα** (شاذ)، **σκέφτομαι → σκέφτηκα**، **χάνομαι → χάθηκα**، **γεννιέμαι → γεννήθηκα**. اللواحق **-α، -ες، -ε، -αμε، -ατε، -αν**، وقاعدة النبرة كالمعلوم: **γεννήθηκα، γεννηθήκαμε**. **Γεννήθηκα στο Κάιρο.** «وُلدت في القاهرة».
  el-relative:
    meaning: "الجمل الموصولة: που"
    intro: |
      **που** (بلا نبرة) اسم موصول عام *الذي، التي*: **ο άνθρωπος που ήρθε** «الرجل الذي جاء»، **το βιβλίο που διαβάζω** «الكتاب الذي أقرؤه». وإذا كان الموصول مفعولًا أو بعد حرف جر استعملت اليونانية الرسمية **ο οποίος، η οποία، το οποίο** (تُصرَّف): **η πόλη στην οποία μένω** «المدينة التي أسكن فيها». لا تخلط بينها وبين **πού** «أين؟».
  el-conjunctions:
    meaning: "أنّ، لأنّ، عندما، إذا"
    intro: |
      **ότι / πως** أنّ (بعد *قال، ظن، عرف*)، **επειδή / γιατί** لأنّ، **όταν** عندما، **αν** إذا (مع θα في الجملة الرئيسية: **Αν βρέξει, θα μείνω σπίτι.** «إذا أمطرت سأبقى في البيت»)، **ενώ** بينما، **αλλά** لكن، **ή** أو، **και** و، **μόλις** حالما، **ώστε** بحيث، **πριν (να)** قبل أن، **αφού** بما أنّ / بعد أن.
  el-gerund:
    meaning: "صيغة الحال -οντας / -ώντας"
    intro: |
      **-οντας** (للأفعال المنبورة على الجذر) و**-ώντας** (للمنبورة على الآخر): *وهو يفعل، بفعل كذا*: **Έμαθα ελληνικά διαβάζοντας.** «تعلمت اليونانية بالقراءة». **Μιλώντας στο τηλέφωνο, οδηγούσε.** «كان يقود وهو يتكلم في الهاتف». ولا تتغير أبدًا.
  el-participle:
    meaning: "اسم المفعول -μένος"
    intro: |
      **-μένος، -μένη، -μένο** صفة مجهولة وتطابق كالصفة، مثل اسم المفعول العربي: **Το μαγαζί είναι κλειστό / κλεισμένο.** «المحل مغلق». **Η πόρτα είναι ανοιγμένη.** «الباب مفتوح». **Είμαι κουρασμένος.** «أنا متعب». **Το γράμμα είναι γραμμένο στα ελληνικά.** «الرسالة مكتوبة باليونانية». ومن الأفعال: **γράφω → γραμμένος، δένω → δεμένος، κουράζω → κουρασμένος، ντύνω → ντυμένος**.
  el-b2-conditional:
    meaning: "الشرطي: θα + الماضي الناقص، θα είχα + -ει"
    intro: |
      **θα + الماضي الناقص** هو الشرطي «كان سـ…»: **Θα ήθελα έναν καφέ.** «أودّ قهوة». ويصوغ الشرط غير الواقع مع **αν + الماضي الناقص**، مثل «لو»: **Αν είχα χρόνο, θα ερχόμουν.** «لو كان عندي وقت لجئت». وللماضي **θα είχα + -ει**: **Αν το ήξερα, θα είχα έρθει.** «لو عرفت لكنت جئت». وقد تعني **θα + الماضي الناقص** أيضًا «لا بد أنه كان»: **Θα ήταν δέκα η ώρα.** «لا بد أن الساعة كانت العاشرة».
  el-b2-wishes:
    meaning: "التمني والاقتراح: μακάρι να، ας"
    intro: |
      **μακάρι να** + الالتماسي تتمنى أمرًا ممكنًا (**Μακάρι να έρθει!** «عسى أن يأتي!»)، و+ الماضي الناقص أمرًا غير واقع الآن (**Μακάρι να ήξερα!** «ليتني أعرف!»)، و+ **είχα … -ει** للماضي (**Μακάρι να είχα πάει.** «ليتني ذهبت»).

      و**ας** + الالتماسي للاقتراح والتسليم، مثل لام الأمر «فليـ»: **Ας πάμε!** «هيا بنا!» **Ας έρθει αν θέλει.** «فليأتِ إن شاء». ومع الماضي الناقص تكون ندمًا: **Ας ερχόσουν νωρίτερα!** «ليتك جئت أبكر!»
  el-b2-na-past:
    meaning: "να مع أزمنة الماضي: لا بد أنه، ربما"
    intro: |
      تأخذ **να** عادةً الالتماسي، لكن مع زمن **ماضٍ** تصف احتمالًا في الماضي: **Πρέπει να έφυγε.** «لا بد أنه غادر». **Μπορεί να το ξέχασε.** «ربما نسيه». **Ίσως να ήταν κουρασμένος.** «لعله كان متعبًا». قارن **Πρέπει να φύγει.** «يجب أن يغادر». ومع **έχει + -ει** تُبرَز النتيجة: **Πρέπει να έχει φύγει.** «لا بد أنه قد غادر (فعلًا)».
  el-b2-passive-imperfect:
    meaning: "الماضي الناقص المجهول: -όμουν، -όταν"
    intro: |
      أفعال **-ομαι** (والمجهول) تصوغ الماضي الناقص بـ **-όμουν، -όσουν، -όταν، -όμασταν، -όσασταν، -όντουσαν / -ονταν**، منبورة دائمًا على أول صائت في اللاحقة: **έρχομαι → ερχόμουν** «كنت آتيًا»، **φαίνεται → φαινόταν** «كان يبدو»، **χρειάζομαι → χρειαζόμουν**، **κοιμάμαι → κοιμόμουν**. **Τον έβλεπα ενώ ερχόμουν.** «رأيته وأنا قادم». وفي الكلام أيضًا **-όμουνα، -όσουνα، -ότανε**.
  el-b2-passive-perfect:
    meaning: "التام المجهول: έχω + -θεί"
    intro: |
      التام المجهول يستعمل **έχω** + الصيغة المتجمدة المنتهية بـ **-θεί / -τεί** (التماسي الأوريست المجهول، الغائب المفرد): **Το γράμμα έχει γραφτεί.** «لقد كُتبت الرسالة». **Το σπίτι είχε χτιστεί το 1900.** «كان البيت قد بُني سنة 1900». **Έχει ειπωθεί πολλές φορές.** «قيل ذلك مرارًا». **Δεν έχει αποφασιστεί ακόμα.** «لم يُقرَّر بعد». ويمكن التعبير عن الحالة بـ **είναι** + اسم المفعول: **Το γράμμα είναι γραμμένο.**
  el-b2-na-clauses:
    meaning: "أدوات الربط مع να: الغاية والكيفية والزمن"
    intro: |
      كثير من الجمل التابعة تُبنى بـ **να** + الالتماسي: **για να** «لكي» (**Ήρθα για να σε δω.** «جئت لأراك»)، **χωρίς να** «دون أن» (**Έφυγε χωρίς να πει τίποτα.** «غادر دون أن يقول شيئًا»)، **πριν (να)** / **προτού** «قبل أن»، **αντί να** «بدلًا من أن»، **μέχρι να / ώσπου να** «حتى». ولأن اليونانية بلا مصدر تؤدي هذه الجمل عمل «أن + الفعل» في العربية.
  el-b2-concessive:
    meaning: "مع أنّ، حتى لو، ومع ذلك"
    intro: |
      يُعبَّر عن التسليم بـ **αν και** و**παρόλο που** «مع أنّ» (مع الإخباري): **Αν και έβρεχε, βγήκαμε.** «مع أنها كانت تمطر خرجنا». و**μολονότι** مقابلها الكتابي؛ و**έστω κι αν / ακόμα κι αν** «حتى لو». وبين الجمل: **ωστόσο، εντούτοις** «ومع ذلك»، **παρ' όλα αυτά** «رغم ذلك كله».
  el-b2-indirect-questions:
    meaning: "الأسئلة غير المباشرة"
    intro: |
      أسئلة نعم/لا غير المباشرة تستعمل **αν** «هل / إن كان»، وأسئلة أدوات الاستفهام تحتفظ بأداتها ونبرتها: **Με ρώτησε αν θέλω καφέ.** «سألني هل أريد قهوة». **Δεν ξέρω πού μένει.** «لا أعرف أين يسكن». **Θυμάσαι τι είπε;** «هل تتذكر ماذا قال؟» ويبقى الزمن كما في السؤال المباشر: **Ρώτησε πού είναι** «سأل أين هو».
  el-b2-clitic-doubling:
    meaning: "مفعول مقدَّم يُكرَّر بضمير"
    intro: |
      إذا قُدِّم مفعول معرفة موضوعًا للكلام كرّره ضمير ضعيف قبل الفعل، مثل الاشتغال في العربية: **Τον Γιάννη τον ξέρω.** «يانيس أعرفه». **Το βιβλίο το διάβασα.** «الكتاب قرأته». **Τις φωτογραφίες τις είδες;** «الصور، هل رأيتها؟» ويحدث التكرار في الكلام أيضًا مع المفعول بعد الفعل، لتعليمه بأنه معروف: **Τον ξέρω τον Γιάννη.**
  el-b2-free-relatives:
    meaning: "مَن، ما، بقدر ما"
    intro: |
      **όποιος، -α، -ο** «مَن (كان)»، **ό,τι** (بفاصلة، لتمييزها من **ότι** «أنّ») «ما، كلّ ما»، **όπου** «أينما»، **όσος، -η، -ο** «بقدر ما»، وسلسلة **-δήποτε** «أيّ… كان»: **οποιοσδήποτε** «أيّ أحد»، **οτιδήποτε** «أيّ شيء»، **οπουδήποτε** «في أي مكان»، **οποτεδήποτε** «في أي وقت». **Όποιος θέλει, ας έρθει.** «من شاء فليأتِ». **Κάνε ό,τι θέλεις.** «افعل ما تشاء». **Φάε όσο θέλεις.** «كُل قدر ما تشاء».
  el-b2-emphatic-pronouns:
    meaning: "النفس، نفسه، وحده"
    intro: |
      ليس في اليونانية ضمير انعكاسي؛ تستعمل **ο εαυτός μου** «نفسي» (تُصرَّف، مع ضمير الملكية)، كالعربية تمامًا: **Κοιτάζω τον εαυτό μου.** «أنظر إلى نفسي». **Πρόσεχε τον εαυτό σου.** «اعتنِ بنفسك». و**ο ίδιος** تعني «نفسه، ذاته» أو، بعد اسم أو ضمير، «بنفسه»: **το ίδιο βιβλίο** «الكتاب نفسه»، **Ο ίδιος μου το είπε.** «قاله لي بنفسه». و**μόνος μου، μόνη σου…** «وحدي، وحدكِ»: **Το έκανα μόνος μου.** «فعلته وحدي».
