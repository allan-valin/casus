# Arabic text of the Modern Greek course, A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Letters and sounds: "الحروف والأصوات"
  Articles and gender: "أدوات التعريف والجنس"
  Verbs in the present: "الأفعال في المضارع"
  Nouns and adjectives: "الأسماء والصفات"
lessons:
  el-alphabet:
    meaning: "الأبجدية والنبرة وكتابات الـ i الخمس"
    intro: |
      لليونانية 24 حرفًا وخمسة **أصوات** صائتة: *a، e، i، o، u*. عدة حروف وأزواج تكتب الصوت نفسه، فيجب حفظ الإملاء مع الكلمة:

      - *i*: **ι، η، υ، ει، οι** (**σπίτι** بيت، **μητέρα** أم، **ύπνος** نوم، **είμαι** أكون، **οικογένεια** عائلة)
      - *o*: **ο، ω** (**σπίτι του** بيته، **ώρα** ساعة)
      - *e*: **ε، αι** (**έχω**، **και** و)
      - *u*: **ου** (**ουρανός** سماء)

      أزواج السواكن: **μπ** = ب (**μπαμπάς**)، **ντ** = د (**ντομάτα**)، **γκ / γγ** = گ (**γκαράζ**)، **τσ** = تس، **τζ** = دز. و**γ** قبل *e، i* تُنطق ياءً (**γεια**). وكل كلمة من مقطعين فأكثر تحمل **نبرة** مكتوبة (**´**) على الصائت المنبور: **μήλο** (تفاحة) مقابل **μηλό** (عظمة الوجنة، نادرة). وعلامة **;** هي علامة الاستفهام.
    mistakes: ["الصوت واحد والإملاء واحد: احفظ الكلمة كما تُكتب."]
  el-articles:
    meaning: "أداة التعريف والأجناس الثلاثة"
    intro: |
      كل اسم **مذكر أو مؤنث أو محايد**، والأداة تبيّن ذلك: **ο** άντρας (الرجل)، **η** γυναίκα (المرأة)، **το** παιδί (الطفل). والنهاية تدل عليه غالبًا:

      - المذكر: **-ος، -ας، -ης** (ο δρόμος، ο πατέρας، ο μαθητής)
      - المؤنث: **-α، -η** (η μητέρα، η αδελφή)، وبعضه **-ος** (η οδός)
      - المحايد: **-ο، -ι، -μα** (το βιβλίο، το σπίτι، το γράμμα)

      الجمع: **οι** (للمذكر والمؤنث)، **τα** (للمحايد). وأداة التنكير **ένας، μία (μια)، ένα**. وتستعمل اليونانية الأداة أكثر من الإنجليزية، حتى مع الأعلام: **ο Γιάννης**، ومع الأسماء العامة، كالعربية: **Μου αρέσει ο καφές** «تعجبني القهوة».
    mistakes: ["γυναίκα تنتهي بـ -α: مؤنث."]
  el-eimai:
    meaning: "είμαι «يكون» والضمائر الشخصية"
    intro: |
      **εγώ** أنا، **εσύ** أنت، **αυτός / αυτή / αυτό** هو / هي / هو (للمحايد)، **εμείς** نحن، **εσείς** أنتم (وللاحترام)، **αυτοί / αυτές / αυτά** هم / هنّ. ولاحقة الفعل تدل على الفاعل، فلا تُستعمل الضمائر إلا للتوكيد.

      **είμαι، είσαι، είναι، είμαστε، είστε (είσαστε)، είναι** — الغائب المفرد والجمع واحد. الماضي: **ήμουν، ήσουν، ήταν، ήμασταν، ήσασταν، ήταν**.
  el-verbs-a:
    meaning: "مضارع الأفعال المنتهية بـ -ω (التصريف الأول)"
    intro: |
      أفعال منبورة على الجذر تنتهي بـ **-ω**: **γράφω** (يكتب)، **μένω** (يسكن)، **διαβάζω** (يقرأ)، **δουλεύω** (يعمل)، **πίνω** (يشرب).

      | | |
      |---|---|
      | γράφ**ω** | γράφ**ουμε** |
      | γράφ**εις** | γράφ**ετε** |
      | γράφ**ει** | γράφ**ουν(ε)** |

      والمضارع اليوناني يشمل *أكتب* و*أنا أكتب الآن*.
    mistakes: ["المخاطب المفرد: -εις."]
  el-verbs-b:
    meaning: "الأفعال المنبورة على اللاحقة: -άω و-ώ (التصريف الثاني)"
    intro: |
      الأفعال المنبورة على المقطع الأخير مجموعتان:

      | -άω (μιλάω يتكلم) | -ώ (μπορώ يستطيع) |
      |---|---|
      | μιλ**άω** / μιλ**ώ** | μπορ**ώ** |
      | μιλ**άς** | μπορ**είς** |
      | μιλ**άει** / μιλ**ά** | μπορ**εί** |
      | μιλ**άμε** / μιλ**ούμε** | μπορ**ούμε** |
      | μιλ**άτε** | μπορ**είτε** |
      | μιλ**άνε** / μιλ**ούν** | μπορ**ούν(ε)** |

      **-άω**: αγαπάω (يحب)، ρωτάω (يسأل)، ξεχνάω (ينسى)، πεινάω (يجوع). **-ώ**: μπορώ، ζω (يعيش)، οδηγώ (يقود)، τηλεφωνώ (يتصل)، προσπαθώ (يحاول).
  el-negation:
    meaning: "النفي: δεν، μην، όχι"
    intro: |
      **δεν (δε)** قبل الفعل في الخبر والسؤال: **Δεν ξέρω.** «لا أعرف». و**μην (μη)** بعد **να** وفي النهي والتمني: **Μην ανησυχείς!** «لا تقلق!»، **Θέλω να μην έρθει.** «أريده ألّا يأتي». و**όχι** هي *لا* (جوابًا) وتنفي الكلمات الأخرى: **Όχι, ευχαριστώ.** «لا، شكرًا». و**ναι** هي *نعم*. والـ **-ν** تبقى قبل الصوائت وقبل κ π τ ξ ψ μπ ντ γκ τσ τζ.
  el-questions:
    meaning: "أدوات الاستفهام"
    intro: |
      **τι** ماذا، **ποιος / ποια / ποιο** من، أيّ (تُصرَّف)، **πού** أين (بالنبرة؛ و**που** بلا نبرة هي *الذي* الموصولة)، **από πού** من أين، **πότε** متى، **πώς** كيف، **γιατί** لماذا (وأيضًا *لأن*)، **πόσο / πόσα / πόσοι** كم. وأسئلة نعم/لا تحتفظ بترتيب الكلمات وتغيّر النغمة فقط: **Είσαι Έλληνας;**
  el-accusative:
    meaning: "حالة المفعولية: المفعول وما بعد حروف الجر"
    intro: |
      لليونانية أربع حالات: **الرفع** (الفاعل)، و**المفعولية** (المفعول، وبعد كل حروف الجر: **σε، από، με، για، χωρίς**)، و**الإضافة** (*لـ / من*، A2)، و**النداء**. وفي المفعولية يحذف المذكر **-ς**: **ο φίλος → τον φίλο**، **ο πατέρας → τον πατέρα**، **ο μαθητής → τον μαθητή**؛ والمؤنث والمحايد يشبهان الرفع المفرد، ولا تتغير إلا الأداة: **η μητέρα → τη(ν) μητέρα**، **το σπίτι → το σπίτι**.
  el-plural:
    meaning: "جمع الأسماء"
    intro: |
      | المفرد | الجمع |
      |---|---|
      | ο φίλ**ος** | οι φίλ**οι** |
      | ο πατέρ**ας**، ο μαθητ**ής** | οι πατέρ**ες**، οι μαθητ**ές** |
      | η μητέρ**α**، η αδελφ**ή** | οι μητέρ**ες**، οι αδελφ**ές** |
      | το βιβλί**ο** | τα βιβλί**α** |
      | το σπίτ**ι** | τα σπίτ**ια** |
      | το γράμ**μα** | τα γράμ**ματα** |

      المفعولية في الجمع: المذكر **-ος → -ους** (τους φίλους)؛ والبقية كالرفع، مع **τους / τις / τα**.
  el-adjectives:
    meaning: "الصفات تطابق في الجنس والعدد والحالة"
    intro: |
      معظم الصفات تنتهي بـ **-ος، -η، -ο** (أو **-ος، -α، -ο** بعد صائت: **ωραίος، ωραία، ωραίο**) وتأخذ جنس الاسم وعدده وحالته: **ο μεγάλος σκύλος، η μεγάλη πόλη، το μεγάλο σπίτι، τα μεγάλα σπίτια**. وتأتي قبل الاسم. وأخرى: **-ύς، -ιά، -ύ** (**βαθύς** عميق)، **-ής، -ής، -ές** (**ακριβής** دقيق).
  el-possessive:
    meaning: "الملكية: μου، σου، του، της، μας، σας، τους"
    intro: |
      الملكية ضمير قصير **بعد** الاسم، والأداة قبله — كالضمائر المتصلة في العربية: **το σπίτι μου** بيتي، **η μητέρα σου** أمك، **ο φίλος του / της** صديقه / صديقها، **τα παιδιά μας** أطفالنا، **ο δάσκαλός σας** معلمكم، **το αυτοκίνητό τους** سيارتهم. والاسم المنبور على المقطع الثالث من الآخر يأخذ نبرة ثانية: **ο δάσκαλός μου**.
  el-se-article:
    meaning: "σε + الأداة: στο، στη(ν)، στον، στα، στις، στους"
    intro: |
      **σε** (في، عند، إلى) تندمج مع الأداة: **σε + το = στο**، **σε + τη(ν) = στη(ν)**، **σε + τον = στον**، **στα، στις، στους**: **Μένω στην Αθήνα.** «أسكن في أثينا». **Πάω στο σχολείο.** «أذهب إلى المدرسة». ويجب أن تطابق الأداة الاسم الذي بعدها.
  el-numbers:
    meaning: "الأعداد من 1 إلى 100"
    intro: |
      **1 ένα** (ένας، μία)، **2 δύο**، **3 τρία** (τρεις)، **4 τέσσερα** (τέσσερις)، **5 πέντε**، **6 έξι**، **7 επτά / εφτά**، **8 οκτώ / οχτώ**، **9 εννέα / εννιά**، **10 δέκα**، **11 έντεκα**، **12 δώδεκα**، **13 δεκατρία**، **20 είκοσι**، **30 τριάντα**، **40 σαράντα**، **50 πενήντα**، **100 εκατό**. و**1، 3، 4** تطابق جنس الاسم: **ένας φίλος، μία φίλη؛ τρεις φίλοι، τρία παιδιά**.
