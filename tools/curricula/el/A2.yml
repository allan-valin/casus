id: A2
topics:

- title: {en: The past, pt: O passado}
  lessons:
  - id: el-aorist
    title: έγραψα, διάβασα
    meaning: {en: "the simple past (aorist)", pt: "o passado simples (aoristo)"}
    intro:
      en: |
        The **aorist** is the past of a completed action: *I wrote, I read (once)*. It has its own **stem**, usually with **-σ-** (or **-ψ-, -ξ-**): **γράφω → έγραψα, διαβάζω → διάβασα, ανοίγω → άνοιξα, μιλάω → μίλησα, αγοράζω → αγόρασα**. The endings: **-α, -ες, -ε, -αμε, -ατε, -αν**.

        The accent always goes on the **third syllable from the end**; a two-syllable form gets an **augment ε-** to carry it: **γράψα → έγραψα**, but **γράψαμε** (no augment needed). Many common verbs are irregular: **έρχομαι → ήρθα, πάω → πήγα, βλέπω → είδα, λέω → είπα, τρώω → έφαγα, πίνω → ήπια, βρίσκω → βρήκα**.
      pt: |
        O **aoristo** é o passado de uma ação concluída: *escrevi, li (uma vez)*. Tem **radical** próprio, em geral com **-σ-** (ou **-ψ-, -ξ-**): **γράφω → έγραψα, διαβάζω → διάβασα, ανοίγω → άνοιξα, μιλάω → μίλησα, αγοράζω → αγόρασα**. As terminações: **-α, -ες, -ε, -αμε, -ατε, -αν**.

        O acento vai sempre na **antepenúltima sílaba**; uma forma de duas sílabas ganha um **aumento ε-** para levá-lo: **γράψα → έγραψα**, mas **γράψαμε** (sem aumento). Muitos verbos comuns são irregulares: **έρχομαι → ήρθα, πάω → πήγα, βλέπω → είδα, λέω → είπα, τρώω → έφαγα, πίνω → ήπια, βρίσκω → βρήκα**.
    paradigms:
    - {word: γράφω, pos: verb, tense: past, mood: ind, label: {en: "γράφω (aorist)", pt: "γράφω (aoristo)"}}
    mistakes:
    - wrong: γράψα
      right: έγραψα
      why: {en: "The accent must fall three syllables from the end: the augment ε- carries it.", pt: "O acento cai na antepenúltima: o aumento ε- o carrega."}
    examples:
    - [Χθες διάβασα ένα βιβλίο., Yesterday I read a book., Ontem li um livro., διάβασα]
    - [Πήγαμε στη θάλασσα., We went to the sea., Fomos à praia., Πήγαμε]
    - ["Τι είπες;", "What did you say?", "O que você disse?", "είπες"]
    match: {seq: [{pos: verb, mood: ind, tense: past}], same: [person, number]}

  - id: el-imperfect
    title: έγραφα, διάβαζα
    meaning: {en: "the imperfect: was doing, used to do", pt: "o imperfeito: fazia, estava fazendo"}
    intro:
      en: |
        The **imperfect** uses the **present stem** with the past endings and the same accent rule: **γράφω → έγραφα, διαβάζω → διάβαζα, μιλάω → μιλούσα** (verbs stressed on the ending take **-ούσα**). Use it for something going on, repeated or habitual: **Όταν ήμουν παιδί, έπαιζα ποδόσφαιρο.** "When I was a child I used to play football." **Διάβαζα όταν χτύπησε το τηλέφωνο.** "I was reading when the phone rang."
      pt: |
        O **imperfeito** usa o **radical do presente** com as terminações do passado e a mesma regra de acento: **γράφω → έγραφα, διαβάζω → διάβαζα, μιλάω → μιλούσα** (verbos com acento na terminação levam **-ούσα**). Usa-se para algo em andamento, repetido ou habitual: **Όταν ήμουν παιδί, έπαιζα ποδόσφαιρο.** "Quando eu era criança, jogava futebol." **Διάβαζα όταν χτύπησε το τηλέφωνο.** "Eu estava lendo quando o telefone tocou."
    paradigms:
    - {word: γράφω, pos: verb, tense: impf, mood: ind, label: {en: "γράφω (imperfect)", pt: "γράφω (imperfeito)"}}
    examples:
    - [Όταν ήμουν παιδί έπαιζα ποδόσφαιρο., When I was a child I used to play football., Quando eu era criança jogava futebol., έπαιζα]
    - ["Τι έκανες εκεί;", "What were you doing there?", "O que você estava fazendo lá?", "έκανες"]
    match: {seq: [{pos: verb, mood: ind, tense: impf}], same: [person, number]}

- title: {en: Future and subjunctive, pt: Futuro e subjuntivo}
  lessons:
  - id: el-future
    title: θα γράψω
    meaning: {en: "the future: θα + verb", pt: "o futuro: θα + verbo"}
    intro:
      en: |
        **θα** + the verb makes the future. With the **aorist stem** (perfective) it is a single event: **Θα σου γράψω αύριο.** "I'll write to you tomorrow." With the **present stem** it is ongoing or repeated: **Θα σου γράφω κάθε μέρα.** "I'll write to you every day." The endings are those of the present: **θα γράψω, θα γράψεις, θα γράψει…**

        **θα** + imperfect is *would*: **Θα ερχόμουν, αλλά…** "I would come, but…"
      pt: |
        **θα** + o verbo forma o futuro. Com o **radical do aoristo** (perfectivo) é um evento único: **Θα σου γράψω αύριο.** "Vou te escrever amanhã." Com o **radical do presente** é contínuo ou repetido: **Θα σου γράφω κάθε μέρα.** "Vou te escrever todo dia." As terminações são as do presente: **θα γράψω, θα γράψεις, θα γράψει…**

        **θα** + imperfeito é o condicional: **Θα ερχόμουν, αλλά…** "Eu viria, mas…"
    mistakes:
    - wrong: θα έγραψα
      right: θα γράψω
      why: {en: "θα takes the aorist stem without augment, with present endings.", pt: "θα leva o radical do aoristo sem aumento, com terminações do presente."}
    examples:
    - [Θα σου γράψω αύριο., I'll write to you tomorrow., Vou te escrever amanhã., γράψω]
    - [Θα έρθω στις οκτώ., I'll come at eight., Venho às oito., έρθω]
    match: {seq: [{word: [θα]}, {pos: verb}], near: 2, gap: 1, same: [person, number]}

  - id: el-na
    title: θέλω να πάω
    meaning: {en: "να + verb: the Greek 'to' and subjunctive", pt: "να + verbo: o 'infinitivo' e o subjuntivo gregos"}
    intro:
      en: |
        Greek has **no infinitive**. Where English says *I want to go*, Greek says *I want that I go*: **Θέλω να πάω.** The second verb takes its own person: **Θέλω να πας.** "I want you to go." Like θα, **να** takes the **aorist stem** for a single act (**να γράψω**) and the present stem for an ongoing one (**να γράφω**). Common: **θέλω, μπορώ, πρέπει, ξέρω, αρχίζω, σταματάω, μου αρέσει να…**; negation **να μην**.
      pt: |
        O grego **não tem infinitivo**. Onde o português diz *quero ir*, o grego diz *quero que eu vá*: **Θέλω να πάω.** O segundo verbo tem sua própria pessoa: **Θέλω να πας.** "Quero que você vá." Como θα, **να** leva o **radical do aoristo** para um ato único (**να γράψω**) e o do presente para um ato contínuo (**να γράφω**). Comuns: **θέλω, μπορώ, πρέπει, ξέρω, αρχίζω, σταματάω, μου αρέσει να…**; negação **να μην**.
    examples:
    - [Θέλω να πάω σπίτι., I want to go home., Quero ir para casa., πάω]
    - [Πρέπει να φύγουμε., We have to leave., Temos de ir embora., φύγουμε]
    - ["Μπορείς να με βοηθήσεις;", "Can you help me?", "Você pode me ajudar?", "βοηθήσεις"]
    match: {seq: [{word: [να]}, {pos: verb}], near: 2, gap: 1, same: [person, number]}

- title: {en: Pronouns and cases, pt: Pronomes e casos}
  lessons:
  - id: el-object-pronouns
    title: με, σε, τον, την
    meaning: {en: "weak object pronouns before the verb", pt: "pronomes oblíquos átonos antes do verbo"}
    intro:
      en: |
        Object pronouns are short and go **before** the verb: **με** me, **σε** you, **τον / την / το** him / her / it, **μας** us, **σας** you, **τους / τις / τα** them: **Σε αγαπάω.** "I love you." **Τον ξέρω.** "I know him." Indirect objects use the genitive forms: **μου, σου, του, της, μας, σας, τους**: **Μου δίνεις το βιβλίο;** "Will you give me the book?" With the imperative they follow the verb: **Δώσε μου το!** "Give it to me!"
      pt: |
        Os pronomes objeto são curtos e vêm **antes** do verbo: **με** me, **σε** te, **τον / την / το** o / a / isso, **μας** nos, **σας** vos, **τους / τις / τα** os / as: **Σε αγαπάω.** "Te amo." **Τον ξέρω.** "Eu o conheço." Objetos indiretos usam as formas do genitivo: **μου, σου, του, της, μας, σας, τους**: **Μου δίνεις το βιβλίο;** "Você me dá o livro?" Com o imperativo vêm depois do verbo: **Δώσε μου το!** "Me dá isso!"
    examples:
    - [Σε αγαπάω., I love you., Te amo., Σε]
    - [Τον ξέρω καλά., I know him well., Eu o conheço bem., Τον]
    - [Μου αρέσει η μουσική., I like music., Gosto de música., Μου]
    match: {seq: [{word: [με, σε, τον, την, μας, σας, τους, τις, μου, σου, της]}, {pos: verb}], gap: 0}
    pool: [με, σε, τον, την, μας, σας, τους, μου, σου]

  - id: el-genitive
    title: του φίλου, της μητέρας
    meaning: {en: "the genitive: of, possession", pt: "o genitivo: de, posse"}
    intro:
      en: |
        The genitive follows the noun it belongs to: **το σπίτι του φίλου μου** "my friend's house", **η πόρτα της κουζίνας** "the kitchen door". Endings: masculine **-ου / -α / -η** (**του φίλου, του πατέρα, του μαθητή**), feminine **+ς** (**της μητέρας, της αδελφής**), neuter **-ου / -ιού / -ματος** (**του βιβλίου, του παιδιού, του γράμματος**). Plural for all: **-ων** (**των φίλων**).
      pt: |
        O genitivo vem depois do substantivo a que pertence: **το σπίτι του φίλου μου** "a casa do meu amigo", **η πόρτα της κουζίνας** "a porta da cozinha". Terminações: masculino **-ου / -α / -η** (**του φίλου, του πατέρα, του μαθητή**), feminino **+ς** (**της μητέρας, της αδελφής**), neutro **-ου / -ιού / -ματος** (**του βιβλίου, του παιδιού, του γράμματος**). Plural de todos: **-ων** (**των φίλων**).
    paradigms:
    - {word: μητέρα, pos: noun, label: {en: "μητέρα (f.) mother", pt: "μητέρα (f.) mãe"}}
    - {word: παιδί, pos: noun, label: {en: "παιδί (n.) child", pt: "παιδί (n.) criança"}}
    examples:
    - [Αυτό είναι το σπίτι του πατέρα μου., This is my father's house., Esta é a casa do meu pai., πατέρα]
    - [Το όνομα της πόλης είναι Αθήνα., The name of the city is Athens., O nome da cidade é Atenas., πόλης]
    match: {seq: [{pos: det, lemma: "^ο$", case: gen}, {pos: noun, case: gen}], gap: 1, same: [number]}

- title: {en: Commands and comparison, pt: Ordens e comparação}
  lessons:
  - id: el-imperative
    title: γράψε, γράψτε
    meaning: {en: "the imperative", pt: "o imperativo"}
    intro:
      en: |
        From the **aorist stem** (a single action): **γράψε!** (to one), **γράψτε!** (to several or polite); from the present stem (ongoing): **γράφε!, γράφετε!**. Verbs in -άω/-ώ: **μίλησε, μιλήστε**. Irregular and very common: **έλα / ελάτε** (come), **πάρε** (take), **φέρε** (bring), **δες** (look), **πες** (say), **φάε** (eat). Negative: **μη(ν)** + the subjunctive: **Μη γράψεις!**
      pt: |
        Do **radical do aoristo** (ação única): **γράψε!** (a uma pessoa), **γράψτε!** (a várias ou formal); do radical do presente (contínuo): **γράφε!, γράφετε!**. Verbos em -άω/-ώ: **μίλησε, μιλήστε**. Irregulares e muito comuns: **έλα / ελάτε** (vem), **πάρε** (pega), **φέρε** (traz), **δες** (olha), **πες** (diz), **φάε** (come). Negativa: **μη(ν)** + o subjuntivo: **Μη γράψεις!**
    examples:
    - [Έλα εδώ!, Come here!, Vem cá!, Έλα]
    - [Κλείσε την πόρτα., Close the door., Feche a porta., Κλείσε]
    match: {seq: [{pos: verb, mood: imp, start: true}], same: [mood]}

  - id: el-comparison
    title: πιο μεγάλος, μεγαλύτερος
    meaning: {en: "comparison: πιο, -τερος, από", pt: "comparação: πιο, -τερος, από"}
    intro:
      en: |
        **πιο** + adjective (**πιο μεγάλος**) or the suffix **-τερος** (**μεγαλύτερος**); *than* is **από** + accusative or **παρά**: **Ο Νίκος είναι πιο ψηλός από τον Γιάννη.** Superlative: the article + comparative: **ο πιο μεγάλος, ο μεγαλύτερος**. Irregular: **καλός → καλύτερος**, **κακός → χειρότερος**, **πολύς → περισσότερος**.
      pt: |
        **πιο** + adjetivo (**πιο μεγάλος**) ou o sufixo **-τερος** (**μεγαλύτερος**); o *que* da comparação é **από** + acusativo ou **παρά**: **Ο Νίκος είναι πιο ψηλός από τον Γιάννη.** Superlativo: artigo + comparativo: **ο πιο μεγάλος, ο μεγαλύτερος**. Irregulares: **καλός → καλύτερος**, **κακός → χειρότερος**, **πολύς → περισσότερος**.
    examples:
    - [Είναι πιο ψηλός από μένα., He's taller than me., Ele é mais alto que eu., πιο]
    - [Αυτό είναι καλύτερο., This is better., Isto é melhor., καλύτερο]
    match:
    - {seq: [{word: [πιο]}, {pos: [adj, adv]}], gap: 0, pool: [πιο, πολύ, τόσο, πάρα, λίγο]}
    - {seq: [{pos: adj, re: "τερ(ος|η|ο|οι|ες|α|ου|ης|ων|ους)$"}], same: [number]}

  - id: el-passive-present
    title: έρχομαι, κάθεσαι
    meaning: {en: "verbs in -ομαι (passive and deponent)", pt: "verbos em -ομαι (passivos e depoentes)"}
    intro:
      en: |
        Verbs in **-ομαι** are passive (**γράφομαι** "is written") or simply have this form (**έρχομαι** come, **κάθομαι** sit, **σκέφτομαι** think, **χρειάζομαι** need, **θυμάμαι** remember):

        | | |
        |---|---|
        | έρχ**ομαι** | ερχ**όμαστε** |
        | έρχ**εσαι** | έρχ**εστε** |
        | έρχ**εται** | έρχ**ονται** |

        In the 1st and 2nd plural the accent moves forward.
      pt: |
        Os verbos em **-ομαι** são passivos (**γράφομαι** "é escrito") ou simplesmente têm essa forma (**έρχομαι** vir, **κάθομαι** sentar-se, **σκέφτομαι** pensar, **χρειάζομαι** precisar, **θυμάμαι** lembrar):

        | | |
        |---|---|
        | έρχ**ομαι** | ερχ**όμαστε** |
        | έρχ**εσαι** | έρχ**εστε** |
        | έρχ**εται** | έρχ**ονται** |

        Na 1ª e 2ª do plural o acento avança.
    examples:
    - [Έρχομαι αμέσως., I'm coming right away., Já estou indo., Έρχομαι]
    - ["Χρειάζεσαι βοήθεια;", "Do you need help?", "Você precisa de ajuda?", "Χρειάζεσαι"]
    match: {seq: [{pos: verb, mood: ind, re: "(ομαι|εσαι|εται|ονται)$"}], suffixes: [ομαι, εσαι, εται, ονται], attested: true}
