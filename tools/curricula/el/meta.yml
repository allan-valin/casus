# Modern Greek Learn lessons, written for Casus (2026-10-20). Open courses were searched: the Centre for the Greek
# Language's Πύλη για την ελληνική γλώσσα material and the Kallimachos/Ellinika tora books are all-rights-reserved;
# Wikibooks' Modern Greek is a handful of pages. So the lessons follow the order of the usual courses and of the
# Certificate of Attainment in Greek (A1–B1), and the facts follow Holton, Mackridge & Philippaki-Warburton's
# description as summarised in Wikipedia's Modern Greek grammar (CC BY-SA). Tables are generated from Casus's
# Wiktionary paradigms (tools/learn_tables.py). Exercises: Tatoeba's Greek sentences.
