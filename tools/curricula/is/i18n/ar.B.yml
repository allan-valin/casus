# Arabic text of the Icelandic course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Mood and voice: "الصيغة والبناء"
  Subjects in other cases: "فاعل في حالات أخرى"
  Verbs: "الأفعال"
  Adjectives and pronouns: "الصفات والضمائر"
  Clauses: "الجمل التابعة"
lessons:
  is-subjunctive:
    meaning: "الالتماسي"
    intro: |
      الكلام المنقول وكثير من الجمل التابعة تأخذ الالتماسي: **Hann segir að hún sé veik** (يقول إنها مريضة)، **Ég vona að þú komir** (آمل أن تأتي). والالتماسي الحاضر ينتهي بـ **-i** (**komi، tali، sé**)؛ والماضي فيه غالبًا تغيير صائتي (**kæmi، færi، væri**): **Ef ég væri ríkur…** (لو كنت غنيًا).
  is-passive:
    meaning: "المبني للمجهول: vera / verða + اسم المفعول"
    intro: |
      **vera** (للحالة) أو **verða** (للحدث) + اسم مفعول يطابق الفاعل: **Bókin var skrifuð árið 1900** (كُتب الكتاب سنة 1900)، **Húsið verður selt** (سيُباع البيت). ويُصرَّف اسم المفعول كالصفة: **skrifaður / skrifuð / skrifað**.
  is-oblique-subjects:
    meaning: "فاعل في القابل والمفعولية"
    intro: |
      بعض الأفعال تضع من يشعر في القابل أو المفعولية، ويبقى الفعل غائبًا مفردًا — كقولنا «أشعر بالبرد / يعجبني»: **Mér er kalt** (أشعر بالبرد)، **Mér líkar þetta** (يعجبني هذا)، **Mig langar í kaffi** (أشتهي قهوة)، **Mig vantar pening** (ينقصني المال)، **Henni finnst gaman** (تستمتع).
    mistakes: ["langa تأخذ فاعلًا في المفعولية."]
  is-numbers:
    meaning: "الأعداد 1–4 تُصرَّف"
    intro: |
      **1–4** تطابق الاسم جنسًا وحالة: **einn maður، ein kona، eitt barn**؛ **tveir menn، tvær konur، tvö börn**؛ **þrír / þrjár / þrjú**؛ **fjórir / fjórar / fjögur**. ومن 5 فما فوق لا تُصرَّف: **fimm، sex، sjö، átta، níu، tíu**. وعند العدّ يُستعمل المذكر: **einn، tveir، þrír**.
  is-strong-classes:
    meaning: "طبقات الأفعال القوية: سلاسل الصوائت"
    intro: |
      تغيّر الأفعال القوية صائتها بدل إضافة **-ði**، كالتغيّر الداخلي في الفعل العربي. وتقع التغييرات في سبع سلاسل؛ احفظ كل فعل بصيغه الأربع (المصدر – الماضي مفرد – الماضي جمع – صيغة التام):

      | الطبقة | المصدر | ماضٍ مفرد | ماضٍ جمع | صيغة التام |
      |---|---|---|---|---|
      | 1 | bíta (عضّ) | beit | bitum | bitið |
      | 2 | bjóða (عرض) | bauð | buðum | boðið |
      | 3 | drekka (شرب) | drakk | drukkum | drukkið |
      | 4 | bera (حمل) | bar | bárum | borið |
      | 5 | gefa (أعطى) | gaf | gáfum | gefið |
      | 6 | fara (ذهب) | fór | fórum | farið |
      | 7 | gráta (بكى) | grét | grétum | grátið |
  is-preterite-present:
    meaning: "أفعال حاضرها كالماضي: vita، kunna، mega، þurfa، eiga، munu، skulu"
    intro: |
      مجموعة صغيرة من الأفعال الشائعة حاضرها يشبه ماضيًا قويًا: بلا **-r** في الغائب المفرد، وبتغيير صائتي بين المفرد والجمع:

      | | vita (يعرف) | kunna (يُحسن) | mega (يجوز له) | þurfa (يحتاج) | eiga (يملك) |
      |---|---|---|---|---|---|
      | ég | veit | kann | má | þarf | á |
      | hann | veit | kann | má | þarf | á |
      | við | vitum | kunnum | megum | þurfum | eigum |

      و**munu** (سـ) و**skulu** (ينبغي) منها أيضًا: **ég mun، ég skal**.
  is-perfect:
    meaning: "التام: hafa + صيغة التام"
    intro: |
      **hafa** + **صيغة التام** (لا تتغير أبدًا) تصوغ التام: **Ég hef lesið bókina.** «لقد قرأت الكتاب». **Hefur þú komið til Íslands?** «هل زرت آيسلندا؟» **Við höfðum borðað.** «كنّا قد أكلنا». وصيغة التام في الأفعال القوية تنتهي بـ **-ið** (**lesið، farið**)، وفي الضعيفة بـ **-að، -t، -ð** (**talað، keypt، heyrt**).
  is-buinn:
    meaning: "vera búinn að: فرغ من فعل الشيء"
    intro: |
      **vera búinn að** + المصدر هي الطريقة اليومية لقول إن الفعل انتهى؛ و**búinn** تطابق الفاعل: **Ég er búinn að borða.** «فرغت من الأكل». (رجل) **Hún er búin að lesa bókina.** «فرغت من قراءة الكتاب». **Við erum búin að ákveða.** «قرّرنا». (جماعة مختلطة: محايد جمع **búin**)
  is-progressive:
    meaning: "vera að: الاستمرار"
    intro: |
      **vera að** + المصدر تقول إن الفعل جارٍ: **Ég er að lesa.** «أنا أقرأ الآن». **Hvað ertu að gera?** «ماذا تفعل؟» **Hún var að elda þegar ég kom.** «كانت تطبخ حين جئت». وأفعال الحالة لا تأخذها: **Ég veit það** (لا ~~ég er að vita~~).
  is-weak-adjectives:
    meaning: "الصفات الضعيفة بعد أداة التعريف"
    intro: |
      بعد الاسم المعرّف (أو **þessi** أو ضمير ملكية أو **hinn**) تأخذ الصفة اللواحق **الضعيفة**، وهي أبسط بكثير من القوية: **gamli maðurinn** «الرجل العجوز»، **gamla konan**، **gamla húsið**. وفي المفرد المذكر **-i** (رفع) / **-a** (باقي الحالات)، والمؤنث **-a / -u**، والمحايد **-a**؛ وفي الجمع **-u** في كل مكان. قارن القوية: **gamall maður، gömul kona، gamalt hús**.
  is-comparison:
    meaning: "التفضيل والتفضيل المطلق"
    intro: |
      تضيف أغلب الصفات **-ari** (تفضيل) و**-astur** (مطلق): **ríkur → ríkari → ríkastur**، **fallegur → fallegri → fallegastur**. وبعضها **-ri / -stur** مع تغيير صائتي: **stór → stærri → stærstur**، **ungur → yngri → yngstur**. والشاذ: **góður → betri → bestur**، **mikill → meiri → mestur**، **lítill → minni → minnstur**. و*من* هي **en**: **Hún er hærri en ég.** «هي أطول مني».
  is-reflexive:
    meaning: "ضمائر الانعكاس وضمير الملكية الانعكاسي sinn"
    intro: |
      الانعكاسي للغائب لا رفع له: **sig** (مفعولية)، **sér** (قابل)، **sín** (إضافة): **Hann þvær sér.** «يغتسل». **Hún klæddi sig.** «لبست ثيابها».

      **sinn / sín / sitt** «الخاص به» يعود على الفاعل؛ و**hans، hennar، þeirra** على غيره: **Jón tók bókina sína.** «أخذ يون كتابه (هو)». **Jón tók bókina hans.** «أخذ يون كتابه (كتاب رجل آخر)».
  is-relative:
    meaning: "الجمل الموصولة بـ sem"
    intro: |
      **sem** تُدخل جملة الصلة ولا تتغير أبدًا؛ ويُعرف الدور في الجملة بترتيب الكلمات وبحروف الجر المتروكة في آخرها: **Maðurinn sem ég sá er kennari.** «الرجل الذي رأيته معلم». **Húsið sem ég bý í** «البيت الذي أسكن فيه». والنصوص الرسمية تستعمل أيضًا **er**: **sá er** «من».
  is-subj-conjunctions:
    meaning: "أدوات تطلب الالتماسي: þótt، nema، svo að"
    intro: |
      بعض أدوات الربط تأخذ الالتماسي دائمًا:

      - **þótt / þó að** «مع أنّ»: **Þótt hann sé ríkur er hann ekki hamingjusamur.** «مع أنه غني فليس سعيدًا».
      - **nema** «إلا إذا»: **Ég kem, nema það rigni.** «سآتي إلا إذا أمطرت».
      - **svo að / til þess að** «لكي»: **Talaðu hærra svo að allir heyri.** «تكلم بصوت أعلى ليسمع الجميع».

      و**ef** «إذا» تأخذ الإخباري للشرط الواقعي (**ef það rignir**)، والالتماسي الماضي لغير الواقع.
  is-hvort:
    meaning: "hvort: هل (لا ef)"
    intro: |
      يبدأ سؤال نعم/لا غير المباشر بـ **hvort** «هل، إن كان»، لا بـ **ef** (التي للشرط فقط): **Ég veit ekki hvort hann kemur.** «لا أعرف هل سيأتي». **Hún spurði hvort ég vildi kaffi.** «سألت هل أريد قهوة». **hvort … eða** «أ … أم».
    mistakes: ["السؤال غير المباشر يأخذ hvort؛ وef للشرط فقط."]
