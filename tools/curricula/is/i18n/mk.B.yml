# Macedonian text of the Icelandic course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Mood and voice: "Начин и залог"
  Subjects in other cases: "Подмети во други падежи"
  Verbs: "Глаголи"
  Adjectives and pronouns: "Придавки и заменки"
  Clauses: "Зависни реченици"
lessons:
  is-subjunctive:
    meaning: "конјунктивот"
    intro: |
      Прекажаниот говор и многу зависни реченици земаат конјунктив: **Hann segir að hún sé veik** (вели дека таа е болна), **Ég vona að þú komir** (се надевам дека ќе дојдеш). Сегашниот конјунктив завршува на **-i** (**komi, tali, sé**); минатиот често има умлаут (**kæmi, færi, væri**): **Ef ég væri ríkur…** (да бев богат).
  is-passive:
    meaning: "пасивот: vera / verða + партицип"
    intro: |
      **vera** (состојба) или **verða** (настан) + минат партицип што се согласува со подметот: **Bókin var skrifuð árið 1900** (книгата е напишана во 1900), **Húsið verður selt** (куќата ќе биде продадена). Партиципот се менува како придавка: **skrifaður / skrifuð / skrifað**.
  is-oblique-subjects:
    meaning: "дативни и акузативни подмети"
    intro: |
      Некои глаголи го ставаат доживувачот во датив или акузатив, а глаголот останува во 3 лице еднина — точно како македонското **ми е студено**: **Mér er kalt** (ми е студено), **Mér líkar þetta** (ми се допаѓа ова), **Mig langar í kaffi** (ми се пие кафе), **Mig vantar pening** (ми требаат пари), **Henni finnst gaman** (ѝ е забавно).
    mistakes: ["langa зема акузативен подмет."]
  is-numbers:
    meaning: "броевите 1–4 се менуваат"
    intro: |
      **1–4** се согласуваат со именката по род и падеж: **einn maður, ein kona, eitt barn**; **tveir menn, tvær konur, tvö börn**; **þrír / þrjár / þrjú**; **fjórir / fjórar / fjögur**. Од 5 нагоре не се менуваат: **fimm, sex, sjö, átta, níu, tíu**. При броење се користи машкиот род: **einn, tveir, þrír**.
  is-strong-classes:
    meaning: "класите силни глаголи: низи на самогласки"
    intro: |
      Силните глаголи ја менуваат самогласката наместо да додадат **-ði**. Промените се во седум низи; учи го секој глагол со четирите главни форми (инфинитив – минато едн. – минато мн. – супин):

      | класа | инфинитив | мин. едн. | мин. мн. | супин |
      |---|---|---|---|---|
      | 1 | bíta (гризе) | beit | bitum | bitið |
      | 2 | bjóða (нуди) | bauð | buðum | boðið |
      | 3 | drekka (пие) | drakk | drukkum | drukkið |
      | 4 | bera (носи) | bar | bárum | borið |
      | 5 | gefa (дава) | gaf | gáfum | gefið |
      | 6 | fara (оди) | fór | fórum | farið |
      | 7 | gráta (плаче) | grét | grétum | grátið |
  is-preterite-present:
    meaning: "претерито-презентни глаголи: vita, kunna, mega, þurfa, eiga, munu, skulu"
    intro: |
      Мала група чести глаголи има сегашно што изгледа како силно минато: без **-r** во 3 еднина и со промена на самогласката меѓу еднина и множина:

      | | vita (знае) | kunna (умее) | mega (смее) | þurfa (треба) | eiga (поседува) |
      |---|---|---|---|---|---|
      | ég | veit | kann | má | þarf | á |
      | hann | veit | kann | má | þarf | á |
      | við | vitum | kunnum | megum | þurfum | eigum |

      Тука спаѓаат и **munu** (ќе) и **skulu** (треба да): **ég mun, ég skal**.
  is-perfect:
    meaning: "перфектот: hafa + супин"
    intro: |
      **hafa** + **супинот** (форма што никогаш не се менува) го гради перфектот — како македонското **имам прочитано**: **Ég hef lesið bókina.** „Ја имам прочитано книгата.“ **Hefur þú komið til Íslands?** „Си бил ли во Исланд?“ **Við höfðum borðað.** „Бевме јаделе.“ Супинот на силните глаголи завршува на **-ið** (**lesið, farið**), на слабите на **-að, -t, -ð** (**talað, keypt, heyrt**).
  is-buinn:
    meaning: "vera búinn að: да заврши со правење"
    intro: |
      **vera búinn að** + инфинитив е секојдневниот начин да се каже дека дејството е готово; **búinn** се согласува со подметот: **Ég er búinn að borða.** „Јадев (готов сум со јадење).“ (маж) **Hún er búin að lesa bókina.** „Ја прочита книгата.“ **Við erum búin að ákveða.** „Одлучивме.“ (мешана група: среден род множина **búin**)
  is-progressive:
    meaning: "vera að: прогресивот"
    intro: |
      **vera að** + инфинитив кажува дека дејството е во тек: **Ég er að lesa.** „Читам (во моментов).“ **Hvað ertu að gera?** „Што правиш?“ **Hún var að elda þegar ég kom.** „Готвеше кога дојдов.“ Глаголите на состојба не го земаат: **Ég veit það** (не ~~ég er að vita~~).
  is-weak-adjectives:
    meaning: "слаби придавки по определениот член"
    intro: |
      По определена именка (или **þessi**, присвојна заменка, **hinn**) придавката ги зема **слабите** наставки, многу поедноставни од силните: **gamli maðurinn** „стариот човек“, **gamla konan**, **gamla húsið**. Во еднина машки **-i** (ном.) / **-a** (другите падежи), женски **-a / -u**, среден **-a**; во множина насекаде **-u**. Спореди силни: **gamall maður, gömul kona, gamalt hús**.
  is-comparison:
    meaning: "компаратив и суперлатив"
    intro: |
      Повеќето придавки додаваат **-ari** (компаратив) и **-astur** (суперлатив): **ríkur → ríkari → ríkastur**, **fallegur → fallegri → fallegastur**. Некои додаваат **-ri / -stur** со умлаут: **stór → stærri → stærstur**, **ungur → yngri → yngstur**. Неправилни: **góður → betri → bestur**, **mikill → meiri → mestur**, **lítill → minni → minnstur**. *Од* (споредба) е **en**: **Hún er hærri en ég.** „Таа е повисока од мене.“
  is-reflexive:
    meaning: "повратни заменки и повратното присвојно sinn"
    intro: |
      Повратната заменка за 3 лице нема номинатив: **sig** (акуз.), **sér** (дат.), **sín** (ген.): **Hann þvær sér.** „Се мие.“ **Hún klæddi sig.** „Се облече.“

      **sinn / sín / sitt** „свој“ се однесува на подметот; **hans, hennar, þeirra** на некој друг — точно како македонските **својот** наспроти **неговиот**: **Jón tók bókina sína.** „Јон ја зеде својата книга.“ **Jón tók bókina hans.** „Јон ја зеде неговата (на друг) книга.“
  is-relative:
    meaning: "релативни реченици со sem"
    intro: |
      **sem** воведува релативна реченица и никогаш не се менува — како македонското **што**; улогата во реченицата се покажува со редот на зборовите и со предлози оставени на крајот: **Maðurinn sem ég sá er kennari.** „Човекот што го видов е учител.“ **Húsið sem ég bý í** „куќата во која живеам“. Официјалните текстови користат и **er**: **sá er** „оној што“.
  is-subj-conjunctions:
    meaning: "сврзници што бараат конјунктив: þótt, nema, svo að"
    intro: |
      Некои сврзници секогаш земаат конјунктив:

      - **þótt / þó að** „иако“: **Þótt hann sé ríkur er hann ekki hamingjusamur.** „Иако е богат, не е среќен.“
      - **nema** „освен ако“: **Ég kem, nema það rigni.** „Ќе дојдам, освен ако не врне.“
      - **svo að / til þess að** „за да“: **Talaðu hærra svo að allir heyri.** „Зборувај погласно за да слушнат сите.“

      **ef** „ако“ зема индикатив за реални услови (**ef það rignir**), а минат конјунктив за нереални.
  is-hvort:
    meaning: "hvort: дали (не ef)"
    intro: |
      Индиректно прашање да/не почнува со **hvort** „дали“, никогаш со **ef** (кое е само условно *ако*): **Ég veit ekki hvort hann kemur.** „Не знам дали доаѓа.“ **Hún spurði hvort ég vildi kaffi.** „Праша дали сакам кафе.“ **hvort … eða** „дали … или“.
    mistakes: ["Индиректните прашања земаат hvort; ef е само за услови."]
