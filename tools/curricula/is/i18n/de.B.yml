# German text of the Icelandic course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Mood and voice: "Modus und Diathese"
  Subjects in other cases: "Subjekte in anderen Kasus"
  Verbs: "Verben"
  Adjectives and pronouns: "Adjektive und Pronomen"
  Clauses: "Nebensätze"
lessons:
  is-subjunctive:
    meaning: "der Konjunktiv"
    intro: |
      Indirekte Rede und viele Nebensätze stehen im Konjunktiv — wie im Deutschen: **Hann segir að hún sé veik** (er sagt, sie sei krank), **Ég vona að þú komir** (ich hoffe, dass du kommst). Der Konjunktiv Präsens endet auf **-i** (**komi, tali, sé**); der Konjunktiv der Vergangenheit hat oft Umlaut (**kæmi, færi, væri**): **Ef ég væri ríkur…** (wenn ich reich wäre).
  is-passive:
    meaning: "das Passiv: vera / verða + Partizip"
    intro: |
      **vera** (Zustand) oder **verða** (Vorgang) + ein Partizip Perfekt, das mit dem Subjekt kongruiert — wie deutsch *sein / werden*: **Bókin var skrifuð árið 1900** (das Buch wurde 1900 geschrieben), **Húsið verður selt** (das Haus wird verkauft). Das Partizip wird wie ein Adjektiv dekliniert: **skrifaður / skrifuð / skrifað**.
  is-oblique-subjects:
    meaning: "Dativ- und Akkusativsubjekte"
    intro: |
      Manche Verben setzen den Erlebenden in den Dativ oder Akkusativ, und das Verb bleibt in der 3. Person Singular — wie deutsch *mir ist kalt*: **Mér er kalt** (mir ist kalt), **Mér líkar þetta** (mir gefällt das), **Mig langar í kaffi** (mich verlangt nach Kaffee), **Mig vantar pening** (mir fehlt Geld), **Henni finnst gaman** (ihr macht es Spaß).
    mistakes: ["langa nimmt ein Akkusativsubjekt."]
  is-numbers:
    meaning: "die Zahlen 1–4 werden dekliniert"
    intro: |
      **1–4** kongruieren mit dem Nomen in Genus und Kasus: **einn maður, ein kona, eitt barn**; **tveir menn, tvær konur, tvö börn**; **þrír / þrjár / þrjú**; **fjórir / fjórar / fjögur**. Ab 5 werden sie nicht dekliniert: **fimm, sex, sjö, átta, níu, tíu**. Beim Zählen nimmt man das Maskulinum: **einn, tveir, þrír**.
  is-strong-classes:
    meaning: "die starken Verbklassen: Ablautreihen"
    intro: |
      Starke Verben wechseln ihren Vokal, statt **-ði** anzufügen — der germanische Ablaut wie in *beißen – biss – gebissen*. Die Wechsel fallen in sieben Reihen; lerne jedes Verb mit seinen vier Stammformen (Infinitiv – Prät. Sg. – Prät. Pl. – Supinum):

      | Klasse | Infinitiv | Prät. Sg. | Prät. Pl. | Supinum |
      |---|---|---|---|---|
      | 1 | bíta (beißen) | beit | bitum | bitið |
      | 2 | bjóða (bieten) | bauð | buðum | boðið |
      | 3 | drekka (trinken) | drakk | drukkum | drukkið |
      | 4 | bera (tragen) | bar | bárum | borið |
      | 5 | gefa (geben) | gaf | gáfum | gefið |
      | 6 | fara (fahren) | fór | fórum | farið |
      | 7 | gráta (weinen) | grét | grétum | grátið |
  is-preterite-present:
    meaning: "Präteritopräsentien: vita, kunna, mega, þurfa, eiga, munu, skulu"
    intro: |
      Eine kleine Gruppe häufiger Verben hat ein Präsens, das wie eine starke Vergangenheit aussieht: kein **-r** in der 3. Singular und ein Vokalwechsel zwischen Singular und Plural — wie deutsch *wissen: ich weiß, wir wissen*:

      | | vita (wissen) | kunna (können) | mega (dürfen) | þurfa (brauchen) | eiga (besitzen) |
      |---|---|---|---|---|---|
      | ég | veit | kann | má | þarf | á |
      | hann | veit | kann | má | þarf | á |
      | við | vitum | kunnum | megum | þurfum | eigum |

      **munu** (werden) und **skulu** (sollen) gehören auch dazu: **ég mun, ég skal**.
  is-perfect:
    meaning: "das Perfekt: hafa + Supinum"
    intro: |
      **hafa** + das **Supinum** (eine Form, die sich nie ändert) bildet das Perfekt: **Ég hef lesið bókina.** „Ich habe das Buch gelesen.“ **Hefur þú komið til Íslands?** „Warst du schon in Island?“ **Við höfðum borðað.** „Wir hatten gegessen.“ Das Supinum starker Verben endet auf **-ið** (**lesið, farið**), schwacher auf **-að, -t, -ð** (**talað, keypt, heyrt**).
  is-buinn:
    meaning: "vera búinn að: mit etwas fertig sein"
    intro: |
      **vera búinn að** + Infinitiv ist die alltägliche Art zu sagen, dass eine Handlung erledigt ist; **búinn** kongruiert mit dem Subjekt: **Ég er búinn að borða.** „Ich habe gegessen (bin fertig).“ (ein Mann) **Hún er búin að lesa bókina.** „Sie hat das Buch gelesen.“ **Við erum búin að ákveða.** „Wir haben uns entschieden.“ (gemischte Gruppe: Neutrum Plural **búin**)
  is-progressive:
    meaning: "vera að: die Verlaufsform"
    intro: |
      **vera að** + Infinitiv sagt, dass eine Handlung im Gang ist — wie rheinisch *am Lesen sein*: **Ég er að lesa.** „Ich lese gerade.“ **Hvað ertu að gera?** „Was machst du gerade?“ **Hún var að elda þegar ég kom.** „Sie kochte gerade, als ich kam.“ Zustandsverben nehmen es nicht: **Ég veit það** (nicht ~~ég er að vita~~).
  is-weak-adjectives:
    meaning: "schwache Adjektive nach dem bestimmten Artikel"
    intro: |
      Nach einem bestimmten Nomen (oder **þessi**, einem Possessiv, **hinn**) nimmt das Adjektiv die **schwachen** Endungen, viel einfacher als die starken — wie deutsch *der alte Mann* gegenüber *ein alter Mann*: **gamli maðurinn** „der alte Mann“, **gamla konan**, **gamla húsið**. Im Singular mask. **-i** (Nom.) / **-a** (andere Kasus), fem. **-a / -u**, neutr. **-a**; Plural überall **-u**. Vergleiche stark: **gamall maður, gömul kona, gamalt hús**.
  is-comparison:
    meaning: "Komparativ und Superlativ"
    intro: |
      Die meisten Adjektive fügen **-ari** (Komparativ) und **-astur** (Superlativ) an: **ríkur → ríkari → ríkastur**, **fallegur → fallegri → fallegastur**. Manche nehmen **-ri / -stur** mit Umlaut: **stór → stærri → stærstur**, **ungur → yngri → yngstur**. Unregelmäßig: **góður → betri → bestur**, **mikill → meiri → mestur**, **lítill → minni → minnstur**. *Als* ist **en**: **Hún er hærri en ég.**
  is-reflexive:
    meaning: "Reflexivpronomen und das reflexive Possessiv sinn"
    intro: |
      Das Reflexiv der 3. Person hat keinen Nominativ: **sig** (Akk.), **sér** (Dat.), **sín** (Gen.): **Hann þvær sér.** „Er wäscht sich.“ **Hún klæddi sig.** „Sie zog sich an.“

      **sinn / sín / sitt** „sein / ihr eigener“ bezieht sich auf das Subjekt; **hans, hennar, þeirra** auf jemand anderen: **Jón tók bókina sína.** „Jón nahm sein (eigenes) Buch.“ **Jón tók bókina hans.** „Jón nahm sein (eines anderen) Buch.“
  is-relative:
    meaning: "Relativsätze mit sem"
    intro: |
      **sem** leitet einen Relativsatz ein und ändert sich nie; die Rolle im Satz zeigen Wortstellung und Präpositionen am Ende: **Maðurinn sem ég sá er kennari.** „Der Mann, den ich sah, ist Lehrer.“ **Húsið sem ég bý í** „das Haus, in dem ich wohne“. Förmliche Texte nehmen auch **er**: **sá er** „derjenige, der“.
  is-subj-conjunctions:
    meaning: "Konjunktionen mit Konjunktiv: þótt, nema, svo að"
    intro: |
      Einige Konjunktionen nehmen immer den Konjunktiv:

      - **þótt / þó að** „obwohl“: **Þótt hann sé ríkur er hann ekki hamingjusamur.** „Obwohl er reich ist, ist er nicht glücklich.“
      - **nema** „außer wenn“: **Ég kem, nema það rigni.** „Ich komme, außer es regnet.“
      - **svo að / til þess að** „damit“: **Talaðu hærra svo að allir heyri.** „Sprich lauter, damit alle es hören.“

      **ef** „wenn“ nimmt bei realen Bedingungen den Indikativ (**ef það rignir**), bei irrealen den Konjunktiv der Vergangenheit.
  is-hvort:
    meaning: "hvort: ob (nicht ef)"
    intro: |
      Eine indirekte Ja/Nein-Frage beginnt mit **hvort** „ob“, nie mit **ef** (das nur bedingendes *wenn* ist): **Ég veit ekki hvort hann kemur.** „Ich weiß nicht, ob er kommt.“ **Hún spurði hvort ég vildi kaffi.** „Sie fragte, ob ich Kaffee wolle.“ **hvort … eða** „ob … oder“.
    mistakes: ["Indirekte Fragen nehmen hvort; ef steht nur bei Bedingungen."]
