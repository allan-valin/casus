# Macedonian text of the Icelandic course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Subjunctive in depth: "Конјунктивот во длабочина"
  Voice and impersonal sentences: "Залог и безлични реченици"
  Case government in depth: "Рекција во длабочина"
  Formal and old style: "Официјален и стар стил"
  Sentence structure: "Градба на реченицата"
  Forms and clauses: "Форми и зависни реченици"
lessons:
  is-reported-past:
    meaning: "прекажан говор во минато: минатиот конјунктив"
    intro: |
      Прекажаниот говор е во конјунктив, а неговото време го следи глаголот на кажување: по сегашно (**segir**) сегашен конјунктив, по минато (**sagði**) минат конјунктив, без оглед на времето што го користел говорникот:

      - „Hann er veikur.“ → **Hún segir að hann sé veikur.** → **Hún sagði að hann væri veikur.**
      - „Við komum á morgun.“ → **Þeir sögðu að þeir kæmu á morgun.**

      Фактите за кои говорникот гарантира може да останат во индикатив по **vita** (знае): **Ég vissi að hann var heima.**
  is-unreal:
    meaning: "нереални услови: ef + минат конјунктив, myndi"
    intro: |
      Нереален услов зема минат конјунктив по **ef**, а главната реченица има или минат конјунктив или **myndi** + инфинитив — како македонското **би**: **Ef ég væri ríkur myndi ég ferðast.** „Да бев богат, би патувал.“ **Ef ég hefði tíma kæmi ég.** „Да имав време, ќе дојдев.“ **myndi** е минат конјунктив од **munu**: **ég myndi, þú myndir, hann myndi, við myndum, þið mynduð, þeir myndu**.
  is-hefdi:
    meaning: "ќе бев, ќе можев: hefði + супин"
    intro: |
      **hefði** (минат конјунктив од **hafa**) + супин гледа наназад кон она што не се случило: **Það hefði verið betra.** „Тоа ќе беше подобро.“ **Ég hefði getað hjálpað þér.** „Ќе можев да ти помогнам.“ **Þú hefðir átt að segja mér það.** „Требаше да ми кажеш.“ (**eiga að** „треба да“)
  is-mun-skal:
    meaning: "munu (ќе, веројатно) и skulu (треба, ветувам)"
    intro: |
      Исландскиот обично користи сегашно за иднина, но два глагола ја прават изречна:

      - **munu**: неутрална иднина или веројатност: **Hann mun koma á morgun.** „Ќе дојде утре.“ **Það mun vera rétt.** „Веројатно е точно.“
      - **skulu**: ветување, намера, предлог: **Ég skal hjálpa þér.** „Ќе ти помогнам (ветувам).“ **Eigum við að …? / Við skulum fara.** „Ајде да одиме.“
  is-middle-meanings:
    meaning: "што значи -st: еден со друг, како пасив, само на -st"
    intro: |
      Медијалниот залог на **-st** има повеќе значења — многу слично на македонското **се**:

      - заемно: **Við hittumst á morgun.** „Се гледаме утре.“ **Þau kysstust.** „Се бакнаа.“
      - како пасив, без вршител: **Bókin seldist vel.** „Книгата добро се продаваше.“ **Það heyrðist ekkert.** „Ништо не се слушаше.“
      - повратно: **Hann klæddist.** „Се облече.“
      - глаголи што постојат само на **-st** (*депоненси*): **óttast** (се плаши), **ferðast** (патува), **eldast** (старее), **nálgast** (се приближува)
  is-weather:
    meaning: "глаголи за времето и природата без подмет"
    intro: |
      Глаголите за времето немаат подмет — како македонското **врне**; **það** само го пополнува првото место и исчезнува кога таму стои нешто друго: **Það rignir.** „Врне.“ **Í gær rigndi.** „Вчера врнеше.“ **Það snjóaði í nótt.** „Ноќта падна снег.“ Други: **hvessa** (дува), **frysta** (мрзне), **dimma** (се стемнува), **birta** (се раздени), **kólna / hlýna** (се лади / се затоплува).
  is-impersonal-passive:
    meaning: "безличниот пасив: það var + супин"
    intro: |
      Непреодните глаголи и глаголите со дативен или генитивен објект градат пасив без подмет; партиципот останува во среден род: **Það var dansað alla nóttina.** „Се играше цела ноќ.“ **Það er talað um þetta.** „За ова се зборува.“ **Það var hringt í mig.** „Ми се јавија.“ Помладите говорници велат и **Það var barið mig** „ме претепаа“ (*новиот пасив*), што стандардниот исландски го отфрла: **Ég var barinn**.
  is-oblique-subjects-2:
    meaning: "уште глаголи со дативен и акузативен подмет"
    intro: |
      Покрај **mér er kalt, mig langar**: акузатив **mig dreymdi** (ми се сонуваше), **mig minnir** (ми се чини дека се сеќавам), **mig grunar** (се сомневам), **mig svimar** (ми се врти); датив **mér leiðist** (ми е досадно), **honum batnaði** (му се подобри), **mér tókst það** (ми успеа), **mér gengur vel** (ми оди добро), **mér sýnist** (ми се чини), **mér varð kalt** (ми стана студено). Многу говорници се наклонуваат кон дативот (**mér langar**, *дативна болест*), но стандардот го чува акузативот.
  is-genitive-verbs:
    meaning: "глаголи со генитивен објект"
    intro: |
      Група глаголи зема генитивен објект: **sakna** (му недостасува), **óska** (посакува), **krefjast** (бара), **njóta** (ужива), **leita** (бара, пребарува), **gæta** (чува), **bíða** (чека), **vænta** (очекува), **neyta** (троши), **iðrast** (се кае): **Ég sakna þín.** „Ми недостигаш.“ **Hún nýtur lífsins.** „Таа ужива во животот.“ **Við óskum þér góðrar ferðar.** „Ти посакуваме убав пат.“
  is-present-participle:
    meaning: "сегашниот партицип -andi"
    intro: |
      **-andi** (непроменлив) опишува дејство во тек: **Hann kom hlaupandi.** „Дојде трчајќи.“ **Barnið er sofandi.** „Детето спие.“ **á komandi árum** „во годините што доаѓаат“, **lifandi** „жив“. Не е општа форма на *-ing*: прогресивот е **vera að** + инфинитив.
  is-correlatives:
    meaning: "парни сврзници"
    intro: |
      - **hvorki … né** „ниту … ниту“: **Hann talar hvorki ensku né dönsku.** „Не зборува ниту англиски ниту дански.“
      - **annaðhvort … eða** „или … или“: **Annaðhvort kemur þú með eða þú verður heima.**
      - **bæði … og** „и … и“: **Bæði ég og hún vorum þar.**
      - **hvort sem … eða** „дали … или“: **hvort sem þér líkar betur eða verr** „сакал или не сакал“
  is-subj-formulas:
    meaning: "сегашниот конјунктив во желби и благослови"
    intro: |
      Желбите во главна реченица го чуваат сегашниот конјунктив во цврсти изрази — како македонското **Бог да те благослови!**: **Guð blessi þig!** „Бог да те благослови!“ **Lifi lýðveldið!** „Да живее републиката!“ **Guð hjálpi mér.** „Бог да ми помогне.“ **Veri hann velkominn.** „Добредојден да е.“ **Fari það og veri.** „Нека биде.“ Спореди индикатив **blessar, lifir, hjálpar**.
  is-ver-oss:
    meaning: "официјалното и старото „ние“: vér, oss, vor"
    intro: |
      Говорите, Библијата, старите закони и химната ја користат старата заменка **vér** (ние): акузатив и датив **oss**, генитив и присвојно **vor**: **Faðir vor, þú sem ert á himnum** „Оче наш, кој си на небесата“, **Gef oss í dag vort daglegt brauð** „Лебот наш насушен дај ни го денес“, **Vér Íslendingar** „Ние Исланѓаните“. **þér** со глагол во множина е соодветното старо учтиво *Вие*.
  is-stylistic-fronting:
    meaning: "стилско предвремување: партицип на прво место"
    intro: |
      Во реченица без подмет официјалниот исландски го пополнува првото место со партицип (или друг збор) пред глаголот наместо со **það**: **Sagt er að hann sé ríkur.** „Се вели дека е богат.“ **Talið er að fimm hafi látist.** „Се смета дека загинале пет лица.“ **Búist er við rigningu.** „Се очекува дожд.“ Истото со **það**: **Það er sagt að …**
  is-lata:
    meaning: "láta: дава да се направи, пушта, тера"
    intro: |
      **láta** + инфинитив е исландскиот каузатив — како македонското **даде да**: **Ég lét gera við bílinn.** „Дадов да ми ја поправат колата.“ **Hún lét mig bíða.** „Ме остави да чекам.“ **Láttu mig vita!** „Јави ми!“ Неговиот партицип во пасив значи *натеран, отпуштен*: **Hann var látinn fara.** „Го отпуштија.“ Партиципот се согласува: **látinn, látin, látið**.
  is-long-distance-reflexive:
    meaning: "sig што досега во конјунктивна реченица"
    intro: |
      Во конјунктивна реченица (прекажан говор, желби) **sig, sér, sín, sinn** можат да се однесуваат на подметот на **главната** реченица, лицето чии зборови или мисли се пренесуваат: **Jón segir að María elski sig.** „Јон вели дека Марија го сака (Јон).“ **Hún vonar að allir muni eftir sér.** „Се надева дека сите ќе се сетат на неа.“ Со индикатив се користи **hann / hana**: **Jón veit að María elskar hann.**
  is-past-subj-forms:
    meaning: "образување на минатиот конјунктив кај силните глаголи"
    intro: |
      Минатиот конјунктив на силниот глагол доаѓа од **минатото во множина** со умлаут, плус **-i**: **komum → kæmi**, **fórum → færi**, **tókum → tæki**, **gáfum → gæfi**, **urðum → yrði**, **fundum → fyndi**, **buðum → byði**, **vorum → væri**. Слабите глаголи едноставно ја користат минатата основа со **-i**: **talaði**, но некои со умлаут: **vissi**, **hefði** (од **hafði**), **mundi / myndi**.
  is-relative-subj:
    meaning: "конјунктивот во релативни реченици за некој чие постоење не е сигурно"
    intro: |
      Релативна реченица зема конјунктив кога опишува некого или нешто што можеби не постои, обично по барање, прашање или негација: **Ég leita að manni sem tali íslensku.** „Барам човек што зборува исландски (кој било таков).“ **Er einhver hér sem geti hjálpað mér?** „Има ли некој тука што може да ми помогне?“ **Það er enginn sem viti það.** „Нема никој што го знае тоа.“ Познато лице зема индикатив: **Ég þekki mann sem talar íslensku.**
  is-sa-sem:
    meaning: "sá sem, það sem: оној што, она што"
    intro: |
      **sá / sú / það** + **sem** стојат за неименувано лице или нешто — како **оној што, она што**: **Sá sem hlær síðast hlær best.** „Кој последен се смее, најслатко се смее.“ **Þeir sem vilja koma eru velkomnir.** „Тие што сакаат да дојдат се добредојдени.“ **Það sem ég sagði var satt.** „Тоа што го реков беше вистина.“ Заменката го зема падежот на својата улога во главната реченица: **Ég treysti þeim sem segja satt.** „Им верувам на оние што ја кажуваат вистината.“
  is-dative-adjectives:
    meaning: "придавки со датив: líkur, þakklátur, reiður"
    intro: |
      Некои придавки бараат датив, кој често стои пред нив — како македонското **му е сличен, ти сум благодарен**: **Hann er líkur föður sínum.** „Личи на татко си.“ **Ég er þér þakklátur.** „Ти сум благодарен.“ **Hún er honum reið.** „Лута е на него.“ Исто **trúr** (верен на), **kær** (мил на), **nauðsynlegur** (неопходен за), **ljóst** (јасно на): **Mér er ljóst að …** „Ми е јасно дека …“
