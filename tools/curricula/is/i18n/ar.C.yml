# Arabic text of the Icelandic course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Subjunctive in depth: "الالتماسي بتعمق"
  Voice and impersonal sentences: "البناء والجمل غير الشخصية"
  Case government in depth: "العمل الإعرابي بتعمق"
  Formal and old style: "الأسلوب الرسمي والقديم"
  Sentence structure: "بناء الجملة"
  Forms and clauses: "الصيغ والجمل التابعة"
lessons:
  is-reported-past:
    meaning: "الكلام المنقول في الماضي: الالتماسي الماضي"
    intro: |
      الكلام المنقول في الالتماسي، وزمنه يتبع فعل القول: بعد المضارع (**segir**) الالتماسي الحاضر، وبعد الماضي (**sagði**) الالتماسي الماضي، أيًّا كان الزمن الذي استعمله المتكلم:

      - «Hann er veikur.» → **Hún segir að hann sé veikur.** → **Hún sagði að hann væri veikur.**
      - «Við komum á morgun.» → **Þeir sögðu að þeir kæmu á morgun.**

      والوقائع التي يضمنها المتكلم قد تبقى في الإخباري بعد **vita** (يعرف): **Ég vissi að hann var heima.**
  is-unreal:
    meaning: "الشرط غير الواقع: ef + الالتماسي الماضي، myndi"
    intro: |
      يأخذ الشرط غير الواقع الالتماسيَّ الماضي بعد **ef** (لو)، والجملة الرئيسية إما الالتماسي الماضي أيضًا أو **myndi** + المصدر: **Ef ég væri ríkur myndi ég ferðast.** «لو كنت غنيًا لسافرت». **Ef ég hefði tíma kæmi ég.** «لو كان عندي وقت لجئت». و**myndi** هي الالتماسي الماضي من **munu**: **ég myndi، þú myndir، hann myndi، við myndum، þið mynduð، þeir myndu**.
  is-hefdi:
    meaning: "كان سيـ، كان يمكن: hefði + صيغة التام"
    intro: |
      **hefði** (الالتماسي الماضي من **hafa**) + صيغة التام تنظر إلى ما لم يحدث: **Það hefði verið betra.** «كان ذلك سيكون أفضل». **Ég hefði getað hjálpað þér.** «كان بإمكاني مساعدتك». **Þú hefðir átt að segja mér það.** «كان ينبغي أن تخبرني». (**eiga að** «ينبغي»)
  is-mun-skal:
    meaning: "munu (سـ، على الأرجح) وskulu (ينبغي، أعدك)"
    intro: |
      تستعمل الآيسلندية عادةً المضارع للمستقبل، لكن فعلين يصرّحان به:

      - **munu**: مستقبل محايد أو ترجيح: **Hann mun koma á morgun.** «سيأتي غدًا». **Það mun vera rétt.** «لعل ذلك صحيح».
      - **skulu**: وعد ونيّة واقتراح: **Ég skal hjálpa þér.** «سأساعدك (أعدك)». **Eigum við að …? / Við skulum fara.** «هيا بنا».
  is-middle-meanings:
    meaning: "معاني -st: بعضهم بعضًا، شبه المجهول، أفعال لا تكون إلا بـ -st"
    intro: |
      للصيغة الوسطى بـ **-st** معانٍ عدة:

      - المشاركة: **Við hittumst á morgun.** «نلتقي غدًا». **Þau kysstust.** «تبادلا القبل».
      - شبه المجهول، بلا فاعل: **Bókin seldist vel.** «بيع الكتاب جيدًا». **Það heyrðist ekkert.** «لم يُسمع شيء».
      - الانعكاس: **Hann klæddist.** «لبس ثيابه».
      - أفعال لا توجد إلا بـ **-st**: **óttast** (خاف)، **ferðast** (سافر)، **eldast** (شاخ)، **nálgast** (اقترب)
  is-weather:
    meaning: "أفعال الطقس والطبيعة بلا فاعل"
    intro: |
      أفعال الطقس بلا فاعل أصلًا؛ و**það** تملأ الموضع الأول فقط وتختفي إذا وقف فيه شيء آخر: **Það rignir.** «إنها تمطر». **Í gær rigndi.** «أمطرت أمس». **Það snjóaði í nótt.** «تساقط الثلج ليلًا». وغيرها: **hvessa** (اشتدت الريح)، **frysta** (تجمّد)، **dimma** (أظلم)، **birta** (أشرق)، **kólna / hlýna** (برد / دفئ).
  is-impersonal-passive:
    meaning: "المجهول غير الشخصي: það var + صيغة التام"
    intro: |
      الأفعال اللازمة والأفعال ذات المفعول في القابل أو الإضافة تصوغ مجهولًا بلا فاعل؛ ويبقى اسم المفعول محايدًا: **Það var dansað alla nóttina.** «رُقص الليل كله». **Það er talað um þetta.** «يُتكلَّم عن هذا». **Það var hringt í mig.** «اتُّصل بي». ويقول الشباب أيضًا **Það var barið mig** «ضُربت» (*المجهول الجديد*)، وترفضه الآيسلندية المعيارية: **Ég var barinn**.
  is-oblique-subjects-2:
    meaning: "أفعال أخرى بفاعل في القابل والمفعولية"
    intro: |
      فوق **mér er kalt، mig langar**: بالمفعولية **mig dreymdi** (حلمت)، **mig minnir** (يخيّل إليّ أني أتذكر)، **mig grunar** (أشكّ)، **mig svimar** (أشعر بالدوار)؛ وبالقابل **mér leiðist** (أشعر بالملل)، **honum batnaði** (تحسّن)، **mér tókst það** (نجحت فيه)، **mér gengur vel** (أموري جيدة)، **mér sýnist** (يبدو لي)، **mér varð kalt** (شعرت بالبرد). ويميل كثير من المتكلمين إلى القابل (**mér langar**، *مرض القابل*)، لكن المعيار يحتفظ بالمفعولية.
  is-genitive-verbs:
    meaning: "أفعال مفعولها في الإضافة"
    intro: |
      مجموعة من الأفعال تأخذ مفعولًا في الإضافة: **sakna** (افتقد)، **óska** (تمنّى)، **krefjast** (طالب بـ)، **njóta** (استمتع بـ)، **leita** (بحث عن)، **gæta** (رعى)، **bíða** (انتظر)، **vænta** (توقّع)، **neyta** (استهلك)، **iðrast** (ندم على): **Ég sakna þín.** «أفتقدك». **Hún nýtur lífsins.** «تستمتع بالحياة». **Við óskum þér góðrar ferðar.** «نتمنى لك رحلة سعيدة».
  is-present-participle:
    meaning: "اسم الفاعل -andi"
    intro: |
      **-andi** (لا يُصرَّف) يصف فعلًا جاريًا، كالحال في العربية: **Hann kom hlaupandi.** «جاء راكضًا». **Barnið er sofandi.** «الطفل نائم». **á komandi árum** «في الأعوام المقبلة»، **lifandi** «حيّ». وليس صيغة استمرار عامة: الاستمرار هو **vera að** + المصدر.
  is-correlatives:
    meaning: "أدوات الربط المزدوجة"
    intro: |
      - **hvorki … né** «لا … ولا»: **Hann talar hvorki ensku né dönsku.** «لا يتكلم الإنجليزية ولا الدنماركية».
      - **annaðhvort … eða** «إما … أو»: **Annaðhvort kemur þú með eða þú verður heima.**
      - **bæði … og** «… و … كلاهما»: **Bæði ég og hún vorum þar.**
      - **hvort sem … eða** «سواء … أم»: **hvort sem þér líkar betur eða verr** «شئت أم أبيت»
  is-subj-formulas:
    meaning: "الالتماسي الحاضر في التمني والدعاء"
    intro: |
      يحتفظ التمني في الجملة الرئيسية بالالتماسي الحاضر في عبارات ثابتة، كالدعاء بالماضي في العربية: **Guð blessi þig!** «بارك الله فيك!» **Lifi lýðveldið!** «عاشت الجمهورية!» **Guð hjálpi mér.** «الله يعينني». **Veri hann velkominn.** «أهلًا به». **Fari það og veri.** «فليكن». قارن الإخباري **blessar، lifir، hjálpar**.
  is-ver-oss:
    meaning: "«نحن» الرسمية والقديمة: vér، oss، vor"
    intro: |
      الخطب والكتاب المقدس والقوانين القديمة والنشيد الوطني تستعمل الضمير القديم **vér** (نحن): المفعولية والقابل **oss**، والإضافة والملكية **vor**: **Faðir vor, þú sem ert á himnum** «أبانا الذي في السماوات»، **Gef oss í dag vort daglegt brauð** «خبزنا كفافنا أعطنا اليوم»، **Vér Íslendingar** «نحن الآيسلنديين». و**þér** مع فعل جمع هي *أنتم* القديمة المهذبة الموافقة.
  is-stylistic-fronting:
    meaning: "التقديم الأسلوبي: اسم مفعول في الموضع الأول"
    intro: |
      في جملة بلا فاعل تملأ الآيسلندية الرسمية الموضع الأول بتقديم اسم مفعول (أو كلمة أخرى) قبل الفعل بدل **það**: **Sagt er að hann sé ríkur.** «يُقال إنه غني». **Talið er að fimm hafi látist.** «يُعتقد أن خمسة لقوا حتفهم». **Búist er við rigningu.** «يُتوقع المطر». والشيء نفسه مع **það**: **Það er sagt að …**
  is-lata:
    meaning: "láta: جعل غيره يفعل، ترك، أجبر"
    intro: |
      **láta** + المصدر هي صيغة التعدية الآيسلندية: **Ég lét gera við bílinn.** «أصلحت السيارة (عند غيري)». **Hún lét mig bíða.** «جعلتني أنتظر». **Láttu mig vita!** «أعلمني!» واسم مفعولها في المجهول يعني *أُجبر، فُصل*: **Hann var látinn fara.** «فُصل من عمله». ويطابق اسم المفعول: **látinn، látin، látið**.
  is-long-distance-reflexive:
    meaning: "sig يمتد إلى جملة التماسية"
    intro: |
      داخل جملة التماسية (كلام منقول، تمنٍّ) يمكن أن تعود **sig، sér، sín، sinn** على فاعل الجملة **الرئيسية**، أي من تُنقل كلماته أو أفكاره: **Jón segir að María elski sig.** «يقول يون إن ماريا تحبه (يون)». **Hún vonar að allir muni eftir sér.** «تأمل أن يتذكرها الجميع». ومع الإخباري يُستعمل **hann / hana**: **Jón veit að María elskar hann.**
  is-past-subj-forms:
    meaning: "صياغة الالتماسي الماضي للأفعال القوية"
    intro: |
      يأتي الالتماسي الماضي للفعل القوي من **الماضي الجمع** مع تغيير صائتي، و**-i**: **komum → kæmi**، **fórum → færi**، **tókum → tæki**، **gáfum → gæfi**، **urðum → yrði**، **fundum → fyndi**، **buðum → byði**، **vorum → væri**. والأفعال الضعيفة تستعمل جذر الماضي مع **-i** ببساطة: **talaði**، وبعضها بتغيير صائتي: **vissi**، **hefði** (من **hafði**)، **mundi / myndi**.
  is-relative-subj:
    meaning: "الالتماسي في جمل الصلة عن من لا يُعرف وجوده"
    intro: |
      تأخذ جملة الصلة الالتماسي إذا وصفت أحدًا أو شيئًا قد لا يوجد، عادةً بعد بحث أو سؤال أو نفي: **Ég leita að manni sem tali íslensku.** «أبحث عن رجل يتكلم الآيسلندية (أيًّا كان)». **Er einhver hér sem geti hjálpað mér?** «هل هنا أحد يستطيع مساعدتي؟» **Það er enginn sem viti það.** «لا أحد يعرف ذلك». والشخص المعروف يأخذ الإخباري: **Ég þekki mann sem talar íslensku.**
  is-sa-sem:
    meaning: "sá sem، það sem: من، ما"
    intro: |
      **sá / sú / það** + **sem** تقوم مقام شخص أو شيء غير مسمّى، كـ«من» و«ما» الموصولتين: **Sá sem hlær síðast hlær best.** «من يضحك أخيرًا يضحك كثيرًا». **Þeir sem vilja koma eru velkomnir.** «من أراد المجيء فمرحّب به». **Það sem ég sagði var satt.** «ما قلته كان صحيحًا». ويأخذ الضمير حالة دوره في الجملة الرئيسية: **Ég treysti þeim sem segja satt.** «أثق بمن يقولون الحق».
  is-dative-adjectives:
    meaning: "صفات تأخذ القابل: líkur، þakklátur، reiður"
    intro: |
      بعض الصفات تعمل في القابل، وكثيرًا ما يتقدّم عليها: **Hann er líkur föður sínum.** «يشبه أباه». **Ég er þér þakklátur.** «أنا ممتن لك». **Hún er honum reið.** «هي غاضبة منه». وأيضًا **trúr** (وفيّ لـ)، **kær** (عزيز على)، **nauðsynlegur** (ضروري لـ)، **ljóst** (واضح لـ): **Mér er ljóst að …** «واضح لي أنّ …»
