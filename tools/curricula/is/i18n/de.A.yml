# German text of the Icelandic course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and spelling: "Laute und Schreibung"
  Pronouns and 'vera': "Pronomen und „vera“"
  Nouns: "Nomen"
  Verbs: "Verben"
  The other cases: "Die anderen Kasus"
  The past: "Die Vergangenheit"
  Adjectives: "Adjektive"
lessons:
  is-sounds:
    meaning: "die Buchstaben, die das Isländische hinzufügt"
    intro: |
      - **þ** = stimmloses engl. *th* in *thin* (nur am Wortanfang): **þú** (du), **þakka** (danken)
      - **ð** = stimmhaftes engl. *th* in *this* (nie am Wortanfang): **góður** (gut), **við** (wir)
      - **æ** = *ai*; **au** = etwa *öi*; **ei / ey** = *ei* wie in engl. *day*
      - ein Akut verändert den Vokal, er ist keine Betonung: **á** = *au*, **ó** = *ou*, **ú** = *u*, **é** = *je*, **í / ý** = *i*
      - **ll** = *tl*: **fjall** (Berg), **Halló**; **hv** = *kw*: **hvað** (was)

      Die Betonung liegt immer auf der **ersten Silbe**.
  is-vera:
    meaning: "vera: sein"
    intro: |
      **ég er** (ich bin), **þú ert**, **hann / hún / það er** (er / sie / es), **við erum**, **þið eruð**, **þeir / þær / þau eru**. Die 3. Person hat auch im Plural drei Genera: **þeir** (Männer), **þær** (Frauen), **þau** (gemischt oder neutral). Vergangenheit: **var, varst, var, vorum, voruð, voru**.
  is-pronouns:
    meaning: "Personalpronomen in vier Kasus"
    intro: |
      Pronomen werden dekliniert — mit denselben vier Kasus wie im Deutschen: **ég – mig – mér – mín** (ich, mich, mir, meiner), **þú – þig – þér – þín**, **hann – hann – honum – hans**, **hún – hana – henni – hennar**, **við – okkur – okkur – okkar**. Verb oder Präposition wählt den Kasus: **Hann sér mig** (Akkusativ), **Hún gaf mér bók** (Dativ).
  is-gender:
    meaning: "drei Genera, Nominativendungen"
    intro: |
      Jedes Nomen ist maskulin, feminin oder neutral. Typische Nominative: maskulin **-ur** (**hestur** Pferd, **dagur** Tag), **-i** (**tími** Zeit); feminin **-a** (**kona** Frau, **saga** Geschichte) oder bloßer Stamm (**bók** Buch); neutral bloßer Stamm (**barn** Kind, **hús** Haus) oder **-a** (**auga** Auge). Adjektive und Artikel kongruieren in Genus, Numerus und Kasus.
  is-definite:
    meaning: "der bestimmte Artikel ist ein Suffix"
    intro: |
      Es gibt kein Wort für *ein*; *der/die/das* wird angehängt und mit dem Nomen dekliniert: **hestur → hesturinn**, **kona → konan**, **barn → barnið**; Plural **hestarnir, konurnar, börnin**. In anderen Kasus ändern sich beide Teile: **hestinn** (Akk.), **hestinum** (Dat.), **hestsins** (Gen.).
    mistakes: ["Der Artikel steht nach der Kasusendung."]
  is-accusative:
    meaning: "der Akkusativ: direktes Objekt"
    intro: |
      Die meisten Verben nehmen ihr Objekt im Akkusativ: **Ég sé hestinn** (ich sehe das Pferd), **Hún á bíl** (sie hat ein Auto). Maskulines **-ur** fällt weg: **hestur → hest**; feminines **-a → -u**: **kona → konu**; Neutra ändern sich nicht. Nach **um, í gegnum, kringum** immer Akkusativ; nach **í, á** Akkusativ bei Bewegung (**í bæinn** in die Stadt) — wie deutsch *in die / in der*.
  is-present:
    meaning: "das Präsens"
    intro: |
      Schwache Verben auf **-a**: **tala** (sprechen) → **ég tala, þú talar, hann talar, við tölum, þið talið, þeir tala** (beachte **a → ö** vor **-um**). Starke Verben wechseln im Singular den Vokal: **taka** (nehmen) → **ég tek, þú tekur, hann tekur, við tökum**.
  is-questions:
    meaning: "Fragen und Verneinung"
    intro: |
      Ja/Nein-Fragen stellen das Verb nach vorn: **Talar þú ensku?** Fragewörter: **hvað** (was), **hver** (wer), **hvar** (wo), **hvenær** (wann), **hvernig** (wie), **af hverju** (warum). Verneinung: **ekki** nach dem Verb: **Ég tala ekki þýsku.** „Ich spreche kein Deutsch.“
  is-dative:
    meaning: "der Dativ"
    intro: |
      Der Dativ folgt **frá** (von), **hjá** (bei jemandem), **af** (von, ab), **úr** (aus), **að** (zu), **móti** (gegen) und **í, á** für den Ort (**í bænum** in der Stadt); **með** nimmt den Dativ für Begleitung (**með honum**). Viele Verben nehmen ein Dativobjekt: **hjálpa** (helfen), **þakka**, **gefa** (indirektes Objekt): **Hún gaf mér bók.** Endungen: mask./neutr. **-i** (**hesti, barni**), fem. oft **-u** (**konu**), Plural immer **-um**.
  is-genitive:
    meaning: "der Genitiv"
    intro: |
      Der Genitiv markiert Besitz, meist nach dem Nomen: **bók Jóns** (Jóns Buch), **hús mannsins** (das Haus des Mannes). Er folgt **til** (zu, nach), **án** (ohne), **vegna** (wegen), **meðal** (unter): **til Reykjavíkur**. Endungen: mask. **-s / -ar** (**hests, dags / dagar** wechselt), fem. **-ar / -u** (**bókar, konu**), Plural immer **-a**.
  is-past-weak:
    meaning: "die Vergangenheit schwacher Verben: -aði, -ði, -di, -ti"
    intro: |
      Schwache Verben fügen einen Dental hinzu — wie deutsch *-te*: **tala → talaði**, **heyra → heyrði**, **læra → lærði**, **keyra → keyrði**, **kaupa → keypti**. Endungen: **ég talaði, þú talaðir, hann talaði, við töluðum, þið töluðuð, þeir töluðu**.
  is-past-strong:
    meaning: "die Vergangenheit starker Verben"
    intro: |
      Starke Verben wechseln den Vokal und fügen keinen Dental hinzu — wie deutsch *nehmen → nahm*: **taka → tók**, **fara → fór**, **koma → kom**, **sjá → sá**, **gefa → gaf**, **drekka → drakk**, **finna → fann**. Der Plural hat oft einen anderen Vokal: **við fórum, við komum, við fundum**.
  is-adjectives:
    meaning: "Adjektivkongruenz (starke Formen)"
    intro: |
      Adjektive kongruieren in Genus, Numerus und Kasus: **góður maður** (guter Mann), **góð kona**, **gott barn**; Plural **góðir menn, góðar konur, góð börn**. Nach dem bestimmten Artikel oder einem Demonstrativum nehmen sie die schwachen Formen — wie deutsch *ein guter / der gute*: **góði maðurinn, góða konan, góða barnið**.
  is-middle:
    meaning: "-st-Verben: reziprok, reflexiv, Deponentien"
    intro: |
      **-st** bildet das Medium: **hitta** (jemanden treffen) → **hittast** (sich treffen): **Við hittumst á morgun.** „Wir treffen uns morgen.“ Manche gibt es nur auf -st: **óttast** (fürchten), **ferðast** (reisen), **eignast** (erwerben). Andere sind reflexiv: **klæða sig / klæðast** (sich anziehen).
