# Macedonian text of the Icelandic course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and spelling: "Гласови и правопис"
  Pronouns and 'vera': "Заменки и „vera“"
  Nouns: "Именки"
  Verbs: "Глаголи"
  The other cases: "Другите падежи"
  The past: "Минатото"
  Adjectives: "Придавки"
lessons:
  is-sounds:
    meaning: "буквите што ги додава исландскиот"
    intro: |
      - **þ** = безвучното англиско *th* во *thin* (само на почеток на збор): **þú** (ти), **þakka** (благодари)
      - **ð** = звучното англиско *th* во *this* (никогаш на почеток): **góður** (добар), **við** (ние)
      - **æ** = **ај**; **au** = приближно *ӧј*; **ei / ey** = **еј**
      - акутот ја менува самогласката, не е нагласок: **á** = **ау**, **ó** = **оу**, **ú** = **у**, **é** = **је**, **í / ý** = **и**
      - **ll** = **тл**: **fjall** (планина), **Halló**; **hv** = **кв**: **hvað** (што)

      Нагласокот е секогаш на **првиот слог**.
  is-vera:
    meaning: "vera: биде, сум"
    intro: |
      **ég er** (јас сум), **þú ert**, **hann / hún / það er** (тој / таа / тоа), **við erum**, **þið eruð**, **þeir / þær / þau eru**. 3 лице има три рода и во множина: **þeir** (мажи), **þær** (жени), **þau** (мешано или среден). Минато: **var, varst, var, vorum, voruð, voru**.
  is-pronouns:
    meaning: "личните заменки во четири падежи"
    intro: |
      Заменките се менуваат: **ég – mig – mér – mín** (јас, мене, мене/ми, мој), **þú – þig – þér – þín**, **hann – hann – honum – hans**, **hún – hana – henni – hennar**, **við – okkur – okkur – okkar**. Глаголот или предлогот го избира падежот: **Hann sér mig** (акузатив — „ме гледа“), **Hún gaf mér bók** (датив — „ми даде книга“).
  is-gender:
    meaning: "три рода, номинативни наставки"
    intro: |
      Секоја именка е од машки, женски или среден род. Типични номинативи: машки **-ur** (**hestur** коњ, **dagur** ден), **-i** (**tími** време); женски **-a** (**kona** жена, **saga** приказна) или гола основа (**bók** книга); среден гола основа (**barn** дете, **hús** куќа) или **-a** (**auga** око). Придавките и членот се согласуваат по род, број и падеж.
  is-definite:
    meaning: "определениот член е наставка"
    intro: |
      Нема збор за *еден* (неопределен член); определениот член се додава на крајот — точно како македонскиот (**коњот, жената, детето**) — и се менува со именката: **hestur → hesturinn**, **kona → konan**, **barn → barnið**; множина **hestarnir, konurnar, börnin**. Во другите падежи се менуваат двата дела: **hestinn** (акуз.), **hestinum** (дат.), **hestsins** (ген.).
    mistakes: ["Членот доаѓа по падежната наставка."]
  is-accusative:
    meaning: "акузативот: директен објект"
    intro: |
      Повеќето глаголи го земаат објектот во акузатив: **Ég sé hestinn** (го гледам коњот), **Hún á bíl** (таа има кола). Машкото **-ur** отпаѓа: **hestur → hest**; женското **-a → -u**: **kona → konu**; средните не се менуваат. По **um, í gegnum, kringum** секогаш акузатив; по **í, á** акузатив за движење (**í bæinn** во градот — одејќи).
  is-present:
    meaning: "сегашното време"
    intro: |
      Слаби глаголи на **-a**: **tala** (зборува) → **ég tala, þú talar, hann talar, við tölum, þið talið, þeir tala** (забележи **a → ö** пред **-um**). Силните глаголи ја менуваат самогласката во еднина: **taka** (зема) → **ég tek, þú tekur, hann tekur, við tökum**.
  is-questions:
    meaning: "прашања и негација"
    intro: |
      Прашањата да/не го ставаат глаголот прв: **Talar þú ensku?** „Зборуваш ли англиски?“ Прашални зборови: **hvað** (што), **hver** (кој), **hvar** (каде), **hvenær** (кога), **hvernig** (како), **af hverju** (зошто). Негација: **ekki** по глаголот: **Ég tala ekki þýsku.** „Не зборувам германски.“
  is-dative:
    meaning: "дативот"
    intro: |
      Дативот доаѓа по **frá** (од), **hjá** (кај некого), **af** (од, од горе), **úr** (од внатре), **að** (кон), **móti** (против), и по **í, á** за место (**í bænum** во градот); **með** зема датив за друштво (**með honum** со него). Многу глаголи земаат дативен објект: **hjálpa** (помага), **þakka**, **gefa** (индиректен објект): **Hún gaf mér bók.** Наставки: маш./сред. **-i** (**hesti, barni**), жен. често **-u** (**konu**), множина секогаш **-um**.
  is-genitive:
    meaning: "генитивот"
    intro: |
      Генитивот означува припадност, обично по именката: **bók Jóns** (книгата на Јон), **hús mannsins** (куќата на човекот). Доаѓа по **til** (до, кон), **án** (без), **vegna** (поради), **meðal** (меѓу): **til Reykjavíkur**. Наставки: маш. **-s / -ar** (**hests, dags / dagar** варира), жен. **-ar / -u** (**bókar, konu**), множина секогаш **-a**.
  is-past-weak:
    meaning: "минатото на слабите глаголи: -aði, -ði, -di, -ti"
    intro: |
      Слабите глаголи додаваат дентал: **tala → talaði**, **heyra → heyrði**, **læra → lærði**, **keyra → keyrði**, **kaupa → keypti**. Наставки: **ég talaði, þú talaðir, hann talaði, við töluðum, þið töluðuð, þeir töluðu**.
  is-past-strong:
    meaning: "минатото на силните глаголи"
    intro: |
      Силните глаголи ја менуваат самогласката и не додаваат дентал: **taka → tók**, **fara → fór**, **koma → kom**, **sjá → sá**, **gefa → gaf**, **drekka → drakk**, **finna → fann**. Множината често има друга самогласка: **við fórum, við komum, við fundum**.
  is-adjectives:
    meaning: "согласување на придавките (силни форми)"
    intro: |
      Придавките се согласуваат по род, број и падеж: **góður maður** (добар човек), **góð kona**, **gott barn**; множина **góðir menn, góðar konur, góð börn**. По определениот член или показна заменка земаат слаби форми: **góði maðurinn, góða konan, góða barnið**.
  is-middle:
    meaning: "-st глаголи: заемни, повратни, депоненси"
    intro: |
      **-st** го гради медијалниот залог — честопати како македонското **се**: **hitta** (сретнува некого) → **hittast** (се сретнуваат): **Við hittumst á morgun.** „Се гледаме утре.“ Некои постојат само на -st: **óttast** (се плаши), **ferðast** (патува), **eignast** (се здобива). Други се повратни: **klæða sig / klæðast** (се облекува).
