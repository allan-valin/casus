# Arabic text of the Icelandic course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and spelling: "الأصوات والإملاء"
  Pronouns and 'vera': "الضمائر و«vera»"
  Nouns: "الأسماء"
  Verbs: "الأفعال"
  The other cases: "الحالات الأخرى"
  The past: "الماضي"
  Adjectives: "الصفات"
lessons:
  is-sounds:
    meaning: "الحروف التي تضيفها الآيسلندية"
    intro: |
      - **þ** = ث (في أول الكلمة فقط): **þú** (أنت)، **þakka** (شكر)
      - **ð** = ذ (لا تأتي أول الكلمة): **góður** (جيد)، **við** (نحن)
      - **æ** = آي؛ **au** = نحو *أوي* مدوّرة؛ **ei / ey** = إي
      - علامة النبر الحادة تغيّر الصائت ولا تعني النبر: **á** = آو، **ó** = أو، **ú** = أُو، **é** = يِه، **í / ý** = إي
      - **ll** = تْل: **fjall** (جبل)، **Halló**؛ **hv** = كْڤ: **hvað** (ماذا)

      النبر دائمًا على **المقطع الأول**.
  is-vera:
    meaning: "vera: يكون"
    intro: |
      **ég er** (أنا أكون)، **þú ert**، **hann / hún / það er** (هو / هي / هو للمحايد)، **við erum**، **þið eruð**، **þeir / þær / þau eru**. وللغائب ثلاثة أجناس في الجمع أيضًا: **þeir** (رجال)، **þær** (نساء)، **þau** (مختلط أو محايد). الماضي: **var، varst، var، vorum، voruð، voru**.
  is-pronouns:
    meaning: "الضمائر الشخصية في أربع حالات"
    intro: |
      الضمائر تُصرَّف: **ég – mig – mér – mín** (أنا، إياي، لي، مِنّي/لي)، **þú – þig – þér – þín**، **hann – hann – honum – hans**، **hún – hana – henni – hennar**، **við – okkur – okkur – okkar**. والفعل أو حرف الجر يختار الحالة: **Hann sér mig** (مفعولية — «يراني»)، **Hún gaf mér bók** (قابل — «أعطتني كتابًا»).
  is-gender:
    meaning: "ثلاثة أجناس ولواحق الرفع"
    intro: |
      كل اسم مذكر أو مؤنث أو محايد. لواحق الرفع النموذجية: المذكر **-ur** (**hestur** حصان، **dagur** يوم)، **-i** (**tími** وقت)؛ المؤنث **-a** (**kona** امرأة، **saga** قصة) أو جذر مجرد (**bók** كتاب)؛ المحايد جذر مجرد (**barn** طفل، **hús** بيت) أو **-a** (**auga** عين). والصفات والأداة تطابق جنسًا وعددًا وحالة.
  is-definite:
    meaning: "أداة التعريف لاحقة"
    intro: |
      لا كلمة لأداة التنكير؛ وأداة التعريف تُلحق بالآخر وتُصرَّف مع الاسم: **hestur → hesturinn**، **kona → konan**، **barn → barnið**؛ والجمع **hestarnir، konurnar، börnin**. وفي الحالات الأخرى يتغير الجزآن: **hestinn** (مفعولية)، **hestinum** (قابل)، **hestsins** (إضافة).
    mistakes: ["تأتي الأداة بعد لاحقة الحالة."]
  is-accusative:
    meaning: "المفعولية: المفعول المباشر"
    intro: |
      تأخذ معظم الأفعال مفعولها في المفعولية: **Ég sé hestinn** (أرى الحصان)، **Hún á bíl** (عندها سيارة). ويسقط **-ur** المذكر: **hestur → hest**؛ والمؤنث **-a → -u**: **kona → konu**؛ والمحايد لا يتغير. وبعد **um، í gegnum، kringum** مفعولية دائمًا؛ وبعد **í، á** مفعولية للحركة (**í bæinn** إلى المدينة).
  is-present:
    meaning: "المضارع"
    intro: |
      الأفعال الضعيفة بـ **-a**: **tala** (يتكلم) → **ég tala، þú talar، hann talar، við tölum، þið talið، þeir tala** (لاحظ **a → ö** قبل **-um**). والأفعال القوية تغيّر صائتها في المفرد: **taka** (يأخذ) → **ég tek، þú tekur، hann tekur، við tökum**.
  is-questions:
    meaning: "الأسئلة والنفي"
    intro: |
      أسئلة نعم/لا تقدّم الفعل: **Talar þú ensku?** «هل تتكلم الإنجليزية؟» أدوات الاستفهام: **hvað** (ماذا)، **hver** (من)، **hvar** (أين)، **hvenær** (متى)، **hvernig** (كيف)، **af hverju** (لماذا). والنفي: **ekki** بعد الفعل: **Ég tala ekki þýsku.** «لا أتكلم الألمانية».
  is-dative:
    meaning: "القابل"
    intro: |
      يأتي القابل بعد **frá** (من)، **hjá** (عند فلان)، **af** (عن، من)، **úr** (من داخل)، **að** (نحو)، **móti** (ضد)، وبعد **í، á** للمكان (**í bænum** في المدينة)؛ و**með** تأخذ القابل للمصاحبة (**með honum** معه). وأفعال كثيرة تأخذ مفعولًا في القابل: **hjálpa** (ساعد)، **þakka**، **gefa** (المفعول غير المباشر): **Hún gaf mér bók.** اللواحق: المذكر/المحايد **-i** (**hesti، barni**)، المؤنث غالبًا **-u** (**konu**)، والجمع دائمًا **-um**.
  is-genitive:
    meaning: "الإضافة"
    intro: |
      تعلّم الإضافة الملكية، وغالبًا بعد الاسم كالعربية: **bók Jóns** (كتاب يون)، **hús mannsins** (بيت الرجل). وتأتي بعد **til** (إلى)، **án** (بدون)، **vegna** (بسبب)، **meðal** (بين): **til Reykjavíkur**. اللواحق: المذكر **-s / -ar** (**hests، dags / dagar** تختلف)، المؤنث **-ar / -u** (**bókar، konu**)، والجمع دائمًا **-a**.
  is-past-weak:
    meaning: "ماضي الأفعال الضعيفة: -aði، -ði، -di، -ti"
    intro: |
      تضيف الأفعال الضعيفة صوتًا سنّيًا: **tala → talaði**، **heyra → heyrði**، **læra → lærði**، **keyra → keyrði**، **kaupa → keypti**. اللواحق: **ég talaði، þú talaðir، hann talaði، við töluðum، þið töluðuð، þeir töluðu**.
  is-past-strong:
    meaning: "ماضي الأفعال القوية"
    intro: |
      تغيّر الأفعال القوية صائتها ولا تضيف صوتًا سنّيًا: **taka → tók**، **fara → fór**، **koma → kom**، **sjá → sá**، **gefa → gaf**، **drekka → drakk**، **finna → fann**. وللجمع غالبًا صائت آخر: **við fórum، við komum، við fundum**.
  is-adjectives:
    meaning: "مطابقة الصفات (الصيغ القوية)"
    intro: |
      تطابق الصفات جنسًا وعددًا وحالة: **góður maður** (رجل طيب)، **góð kona**، **gott barn**؛ والجمع **góðir menn، góðar konur، góð börn**. وبعد أداة التعريف أو اسم الإشارة تأخذ الصيغ الضعيفة: **góði maðurinn، góða konan، góða barnið**.
  is-middle:
    meaning: "أفعال -st: المشاركة والانعكاس والملازمة"
    intro: |
      **-st** تصوغ الصيغة الوسطى، كوزن «تفاعل/افتعل»: **hitta** (قابل أحدًا) → **hittast** (تقابلا): **Við hittumst á morgun.** «نلتقي غدًا». وبعضها لا يوجد إلا بـ -st: **óttast** (خاف)، **ferðast** (سافر)، **eignast** (اقتنى). وأخرى انعكاسية: **klæða sig / klæðast** (لبس ثيابه).
