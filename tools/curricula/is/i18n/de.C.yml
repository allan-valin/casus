# German text of the Icelandic course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Subjunctive in depth: "Der Konjunktiv im Detail"
  Voice and impersonal sentences: "Diathese und unpersönliche Sätze"
  Case government in depth: "Rektion im Detail"
  Formal and old style: "Förmlicher und alter Stil"
  Sentence structure: "Satzbau"
  Forms and clauses: "Formen und Nebensätze"
lessons:
  is-reported-past:
    meaning: "indirekte Rede in der Vergangenheit: der Konjunktiv Präteritum"
    intro: |
      Die indirekte Rede steht im Konjunktiv, und ihr Tempus folgt dem Redeverb: nach Präsens (**segir**) der Konjunktiv Präsens, nach Vergangenheit (**sagði**) der Konjunktiv Präteritum, egal welches Tempus der Sprecher selbst verwendete:

      - „Hann er veikur.“ → **Hún segir að hann sé veikur.** → **Hún sagði að hann væri veikur.**
      - „Við komum á morgun.“ → **Þeir sögðu að þeir kæmu á morgun.**

      Tatsachen, für die der Sprecher einsteht, können nach **vita** (wissen) im Indikativ bleiben: **Ég vissi að hann var heima.**
  is-unreal:
    meaning: "irreale Bedingungen: ef + Konjunktiv Präteritum, myndi"
    intro: |
      Eine irreale Bedingung nimmt nach **ef** den Konjunktiv Präteritum, und der Hauptsatz hat ebenfalls den Konjunktiv Präteritum oder **myndi** + Infinitiv — wie deutsch *würde*: **Ef ég væri ríkur myndi ég ferðast.** „Wäre ich reich, würde ich reisen.“ **Ef ég hefði tíma kæmi ég.** „Hätte ich Zeit, käme ich.“ **myndi** ist der Konjunktiv Präteritum von **munu**: **ég myndi, þú myndir, hann myndi, við myndum, þið mynduð, þeir myndu**.
  is-hefdi:
    meaning: "hätte, hätte können: hefði + Supinum"
    intro: |
      **hefði** (Konjunktiv Präteritum von **hafa**) + Supinum blickt auf Ungeschehenes zurück: **Það hefði verið betra.** „Das wäre besser gewesen.“ **Ég hefði getað hjálpað þér.** „Ich hätte dir helfen können.“ **Þú hefðir átt að segja mér það.** „Du hättest es mir sagen sollen.“ (**eiga að** „sollen“)
  is-mun-skal:
    meaning: "munu (werden, wohl) und skulu (sollen, ich verspreche)"
    intro: |
      Isländisch nimmt meist das Präsens für die Zukunft, aber zwei Verben machen sie ausdrücklich:

      - **munu**: neutrales Futur oder Wahrscheinlichkeit: **Hann mun koma á morgun.** „Er wird morgen kommen.“ **Það mun vera rétt.** „Das dürfte stimmen.“
      - **skulu**: Versprechen, Absicht, Vorschlag: **Ég skal hjálpa þér.** „Ich helfe dir (versprochen).“ **Eigum við að …? / Við skulum fara.** „Gehen wir.“
  is-middle-meanings:
    meaning: "was -st bedeutet: einander, passivähnlich, nur auf -st"
    intro: |
      Das Medium auf **-st** hat mehrere Bedeutungen:

      - reziprok: **Við hittumst á morgun.** „Wir treffen uns morgen.“ **Þau kysstust.** „Sie küssten sich.“
      - passivähnlich, ohne Urheber: **Bókin seldist vel.** „Das Buch verkaufte sich gut.“ **Það heyrðist ekkert.** „Es war nichts zu hören.“
      - reflexiv: **Hann klæddist.** „Er zog sich an.“
      - Verben, die es nur auf **-st** gibt (*Deponentien*): **óttast** (fürchten), **ferðast** (reisen), **eldast** (altern), **nálgast** (sich nähern)
  is-weather:
    meaning: "Wetter- und Naturverben ohne Subjekt"
    intro: |
      Wetterverben haben gar kein Subjekt; **það** füllt nur die erste Stelle und verschwindet, wenn dort etwas anderes steht — wie deutsch *es* in *Gestern regnete es*: **Það rignir.** „Es regnet.“ **Í gær rigndi.** „Gestern regnete es.“ **Það snjóaði í nótt.** „Es hat heute Nacht geschneit.“ Weitere: **hvessa** (windig werden), **frysta** (frieren), **dimma** (dunkel werden), **birta** (hell werden), **kólna / hlýna** (kälter / wärmer werden).
  is-impersonal-passive:
    meaning: "das unpersönliche Passiv: það var + Supinum"
    intro: |
      Intransitive Verben und Verben mit Dativ- oder Genitivobjekt bilden ein Passiv ohne Subjekt; das Partizip bleibt im Neutrum — wie deutsch *es wurde getanzt*: **Það var dansað alla nóttina.** „Es wurde die ganze Nacht getanzt.“ **Það er talað um þetta.** „Darüber wird geredet.“ **Það var hringt í mig.** „Ich wurde angerufen.“ Jüngere Sprecher sagen auch **Það var barið mig** „ich wurde geschlagen“ (das *neue Passiv*), das die Standardsprache ablehnt: **Ég var barinn**.
  is-oblique-subjects-2:
    meaning: "weitere Verben mit Dativ- und Akkusativsubjekt"
    intro: |
      Über **mér er kalt, mig langar** hinaus: Akkusativ **mig dreymdi** (mir träumte), **mig minnir** (ich glaube mich zu erinnern), **mig grunar** (ich vermute), **mig svimar** (mir ist schwindlig); Dativ **mér leiðist** (mir ist langweilig), **honum batnaði** (es ging ihm besser), **mér tókst það** (es gelang mir), **mér gengur vel** (es läuft gut bei mir), **mér sýnist** (mir scheint), **mér varð kalt** (mir wurde kalt). Viele Sprecher neigen zum Dativ (**mér langar**, die *Dativkrankheit*), der Standard hält aber am Akkusativ fest.
  is-genitive-verbs:
    meaning: "Verben mit Genitivobjekt"
    intro: |
      Eine Reihe von Verben nimmt ein Genitivobjekt — wie deutsch *gedenken, bedürfen*: **sakna** (vermissen), **óska** (wünschen), **krefjast** (fordern), **njóta** (genießen), **leita** (suchen), **gæta** (hüten), **bíða** (warten auf), **vænta** (erwarten), **neyta** (verzehren), **iðrast** (bereuen): **Ég sakna þín.** „Ich vermisse dich.“ **Hún nýtur lífsins.** „Sie genießt das Leben.“ **Við óskum þér góðrar ferðar.** „Wir wünschen dir eine gute Reise.“
  is-present-participle:
    meaning: "das Partizip Präsens -andi"
    intro: |
      **-andi** (undeklinierbar) beschreibt eine laufende Handlung — wie deutsch *-end*: **Hann kom hlaupandi.** „Er kam angerannt.“ **Barnið er sofandi.** „Das Kind schläft.“ **á komandi árum** „in den kommenden Jahren“, **lifandi** „lebendig“. Es ist keine allgemeine Verlaufsform: die heißt **vera að** + Infinitiv.
  is-correlatives:
    meaning: "paarige Konjunktionen"
    intro: |
      - **hvorki … né** „weder … noch“: **Hann talar hvorki ensku né dönsku.** „Er spricht weder Englisch noch Dänisch.“
      - **annaðhvort … eða** „entweder … oder“: **Annaðhvort kemur þú með eða þú verður heima.**
      - **bæði … og** „sowohl … als auch“: **Bæði ég og hún vorum þar.**
      - **hvort sem … eða** „ob … oder“: **hvort sem þér líkar betur eða verr** „ob es dir passt oder nicht“
  is-subj-formulas:
    meaning: "der Konjunktiv Präsens in Wünschen und Segenssprüchen"
    intro: |
      Wünsche im Hauptsatz bewahren den Konjunktiv Präsens in festen Wendungen — wie deutsch *Gott segne dich!*: **Guð blessi þig!** „Gott segne dich!“ **Lifi lýðveldið!** „Es lebe die Republik!“ **Guð hjálpi mér.** „Gott helfe mir.“ **Veri hann velkominn.** „Er sei willkommen.“ **Fari það og veri.** „Sei’s drum.“ Vergleiche den Indikativ **blessar, lifir, hjálpar**.
  is-ver-oss:
    meaning: "das förmliche und alte „wir“: vér, oss, vor"
    intro: |
      Reden, die Bibel, alte Gesetze und die Nationalhymne nehmen das alte Pronomen **vér** (wir): Akkusativ und Dativ **oss**, Genitiv und Possessiv **vor**: **Faðir vor, þú sem ert á himnum** „Vater unser im Himmel“, **Gef oss í dag vort daglegt brauð** „Unser tägliches Brot gib uns heute“, **Vér Íslendingar** „Wir Isländer“. **þér** mit Pluralverb ist das passende alte höfliche *Ihr*.
  is-stylistic-fronting:
    meaning: "stilistische Voranstellung: ein Partizip an erster Stelle"
    intro: |
      In einem Satz ohne Subjekt füllt förmliches Isländisch die erste Stelle, indem es ein Partizip (oder ein anderes Wort) vor das Verb rückt, statt **það** zu nehmen: **Sagt er að hann sé ríkur.** „Man sagt, er sei reich.“ **Talið er að fimm hafi látist.** „Man nimmt an, dass fünf gestorben sind.“ **Búist er við rigningu.** „Es wird Regen erwartet.“ Dasselbe mit **það**: **Það er sagt að …**
  is-lata:
    meaning: "láta: machen lassen, lassen"
    intro: |
      **láta** + Infinitiv ist das isländische Kausativ — genau wie deutsch *lassen*: **Ég lét gera við bílinn.** „Ich ließ das Auto reparieren.“ **Hún lét mig bíða.** „Sie ließ mich warten.“ **Láttu mig vita!** „Lass es mich wissen!“ Sein Partizip im Passiv heißt *veranlasst, entlassen*: **Hann var látinn fara.** „Er wurde entlassen.“ Das Partizip kongruiert: **látinn, látin, látið**.
  is-long-distance-reflexive:
    meaning: "sig reicht in einen Konjunktivsatz hinein"
    intro: |
      In einem Konjunktivsatz (indirekte Rede, Wünsche) können **sig, sér, sín, sinn** auf das Subjekt des **Haupt**satzes zurückverweisen, die Person, deren Worte oder Gedanken berichtet werden: **Jón segir að María elski sig.** „Jón sagt, dass María ihn (Jón) liebt.“ **Hún vonar að allir muni eftir sér.** „Sie hofft, dass alle sich an sie erinnern.“ Mit dem Indikativ steht stattdessen **hann / hana**: **Jón veit að María elskar hann.**
  is-past-subj-forms:
    meaning: "die Bildung des Konjunktivs Präteritum starker Verben"
    intro: |
      Der Konjunktiv Präteritum eines starken Verbs kommt aus dem **Präteritum Plural** mit Umlaut plus **-i** — wie deutsch *kamen → käme*: **komum → kæmi**, **fórum → færi**, **tókum → tæki**, **gáfum → gæfi**, **urðum → yrði**, **fundum → fyndi**, **buðum → byði**, **vorum → væri**. Schwache Verben nehmen einfach den Präteritumstamm mit **-i**: **talaði**, manche mit Umlaut: **vissi**, **hefði** (von **hafði**), **mundi / myndi**.
  is-relative-subj:
    meaning: "der Konjunktiv in Relativsätzen über jemanden, dessen Existenz offen ist"
    intro: |
      Ein Relativsatz steht im Konjunktiv, wenn er jemanden oder etwas beschreibt, das es vielleicht nicht gibt, typisch nach einer Suche, einer Frage oder einer Verneinung: **Ég leita að manni sem tali íslensku.** „Ich suche einen Mann, der Isländisch spricht (irgendeinen).“ **Er einhver hér sem geti hjálpað mér?** „Gibt es hier jemanden, der mir helfen kann?“ **Það er enginn sem viti það.** „Es gibt niemanden, der es weiß.“ Eine bekannte Person nimmt den Indikativ: **Ég þekki mann sem talar íslensku.**
  is-sa-sem:
    meaning: "sá sem, það sem: wer, was"
    intro: |
      **sá / sú / það** + **sem** stehen für eine ungenannte Person oder Sache: **Sá sem hlær síðast hlær best.** „Wer zuletzt lacht, lacht am besten.“ **Þeir sem vilja koma eru velkomnir.** „Wer kommen will, ist willkommen.“ **Það sem ég sagði var satt.** „Was ich sagte, war wahr.“ Das Pronomen nimmt den Kasus seiner Rolle im Hauptsatz: **Ég treysti þeim sem segja satt.** „Ich vertraue denen, die die Wahrheit sagen.“
  is-dative-adjectives:
    meaning: "Adjektive mit Dativ: líkur, þakklátur, reiður"
    intro: |
      Manche Adjektive regieren einen Dativ, der oft vor ihnen steht — wie deutsch *ähnlich, dankbar*: **Hann er líkur föður sínum.** „Er ist seinem Vater ähnlich.“ **Ég er þér þakklátur.** „Ich bin dir dankbar.“ **Hún er honum reið.** „Sie ist ihm böse.“ Auch **trúr** (treu), **kær** (lieb), **nauðsynlegur** (notwendig für), **ljóst** (klar): **Mér er ljóst að …** „Mir ist klar, dass …“
