# German text of the Italian course, A1–A2 — translated by AI (Claude) from the English (2026-10-20); comparisons with Portuguese are replaced by German ones
topics:
  Articles and nouns: "Artikel und Nomen"
  Essere, avere and the present: "Essere, avere und das Präsens"
  Questions and negation: "Fragen und Verneinung"
  Prepositions and possession: "Präpositionen und Besitz"
  Everyday basics: "Alltagsgrundlagen"
  The past: "Die Vergangenheit"
  Pronouns: "Pronomen"
  Comparing and the future: "Vergleichen und das Futur"
  Modal verbs and time: "Modalverben und Zeit"
lessons:
  it-articles:
    meaning: "der bestimmte Artikel"
    intro: |
      Maskulin **il** (il libro), **lo** vor s + Konsonant, z, gn, ps, x, y (lo studente, lo zio), **l'** vor Vokal (l'amico); Plural **i** / **gli** (i libri, gli studenti, gli amici). Feminin **la**, **l'** vor Vokal (la casa, l'amica), Plural **le** (le case). Kein Neutrum.
  it-indef:
    meaning: "der unbestimmte Artikel"
    intro: |
      **un** (un libro, un amico), **uno** wo *lo* stünde (uno studente, uno zaino), **una** (una casa), **un'** vor Vokal im Femininum (un'amica). Kein Apostroph im Maskulinum: **un amico**.
  it-plural:
    meaning: "der Plural der Nomen"
    intro: |
      **-o → -i** (libro, libri), **-a → -e** (casa, case), **-e → -i** (fiore, fiori). Maskulina auf **-a** → **-i** (problema, problemi). Unverändert: betonter Endvokal (città), Wörter auf Konsonant (film, bar). **-co/-go** fügen oft *h* ein (amica → amiche, lago → laghi), aber amico → amici.
  it-essere:
    meaning: "essere, sein"
    intro: |
      **sono, sei, è, siamo, siete, sono**. Italienisch nimmt **essere** für fast alle Bedeutungen von „sein“ (mit **stare** nur in festen Wendungen: *Come stai?* „Wie geht's?“). **C'è / ci sono** = *es gibt*.
  it-avere:
    meaning: "avere, haben"
    intro: |
      **ho, hai, ha, abbiamo, avete, hanno** (das *h* ist stumm). Auch für Alter und Empfindungen: **Ho vent'anni** (ich bin zwanzig), **ho fame / sete / freddo / paura** (ich habe Hunger / Durst / mir ist kalt / ich habe Angst).
  it-present:
    meaning: "das Präsens: -are, -ere, -ire"
    intro: |
      **-are** (parlare): parlo, parli, parla, parliamo, parlate, parlano. **-ere** (credere): credo, credi, crede, crediamo, credete, credono. **-ire** (dormire): dormo, dormi, dorme, dormiamo, dormite, dormono; viele -ire-Verben fügen **-isc-** ein (finire: finisco, finisci, finisce, finiamo, finite, finiscono). Betonung: **pàrlano**, auf dem Stamm.
  it-non:
    meaning: "Verneinung"
    intro: |
      **non** vor dem Verb (und seinen Klitika): **Non parlo inglese. Non lo so.** Doppelte Verneinung ist normal: **Non vedo niente / nessuno.** „Ich sehe nichts / niemanden.“ **Non vado mai.**
  it-questions:
    meaning: "Fragewörter"
    intro: |
      **chi** (wer), **che / cosa / che cosa** (was), **dove** (wo), **quando** (wann), **come** (wie), **perché** (warum — auch *weil*), **quanto/-a/-i/-e** (wie viel / viele), **quale / quali** (welcher). Ja/Nein-Fragen behalten die Aussagestellung; nur die Intonation steigt.
  it-prep-art:
    meaning: "Präposition + Artikel"
    intro: |
      **di, a, da, in, su** verschmelzen mit dem Artikel — wie deutsch *im, zum, vom*, aber systematisch: **del, dello, della, dei, degli, delle**; **al, allo, alla, ai, agli, alle**; **dal…**; **nel…**; **sul…**. **con** und **per** bleiben getrennt (con il).
  it-possessive:
    meaning: "Possessive mit Artikel"
    intro: |
      **il mio, la mia, i miei, le mie; il tuo…; il suo** (sein / ihr / Ihr förmlich); **il nostro, il vostro, il loro** (unveränderlich). Der Artikel bleibt — **la mia casa** —, aber nicht bei einem einzelnen Familienmitglied: **mia madre, mio fratello** (doch **la mia mamma, i miei fratelli, il loro padre**).
  it-numbers:
    meaning: "Zahlen"
    intro: |
      uno, due, tre, quattro, cinque, sei, sette, otto, nove, dieci; undici, dodici… venti, ventuno, ventotto (Vokal fällt vor *uno/otto* weg), trenta… cento, mille, **duemila**. Anders als im Deutschen: Zehner zuerst (ventuno = einundzwanzig).
  it-piacere:
    meaning: "Mögen: mi piace / mi piacciono"
    intro: |
      „Ich mag“ heißt „es gefällt mir“ — wie deutsch *gefallen*: **Mi piace la pizza. Mi piacciono i gatti.** Das Verb kongruiert mit dem Gemochten; die Person steht im Dativ: **mi, ti, gli** (ihm), **le** (ihr), **ci, vi, gli** (ihnen). **A Marco piace il calcio.**
  it-passato-prossimo:
    meaning: "das Passato prossimo"
    intro: |
      Die alltägliche Vergangenheit: **avere / essere** + Partizip Perfekt (**-ato, -uto, -ito**): **Ho mangiato. Abbiamo visto un film.** Verben der Bewegung und Veränderung sowie reflexive Verben nehmen **essere**, und das Partizip kongruiert — ähnlich wie deutsch *ich bin gegangen*: **Sono andata a Roma. Siamo arrivati. Mi sono svegliato.** (Reflexive nehmen im Deutschen *haben*, im Italienischen *essere*.)
  it-participles:
    meaning: "unregelmäßige Partizipien"
    intro: |
      **fare → fatto, dire → detto, vedere → visto, prendere → preso, mettere → messo, scrivere → scritto, leggere → letto, aprire → aperto, venire → venuto, essere → stato, nascere → nato, morire → morto, rimanere → rimasto, scegliere → scelto, chiedere → chiesto, rispondere → risposto.**
  it-imperfetto:
    meaning: "das Imperfetto"
    intro: |
      Hintergrund, Gewohnheiten, Beschreibungen in der Vergangenheit: **-avo, -avi, -ava, -avamo, -avate, -avano** (parlavo), **-evo** (credevo), **-ivo** (dormivo). **essere: ero, eri, era, eravamo, eravate, erano.** **Quando ero piccolo, giocavo sempre.** „Als ich klein war, spielte ich immer.“ Das Deutsche unterscheidet diese Form nicht vom Passato prossimo; Faustregel: Rahmen und Gewohnheit = Imperfetto, Ereignis = Passato prossimo.
  it-direct-pron:
    meaning: "direkte Objektpronomen"
    intro: |
      **mi, ti, lo, la, ci, vi, li, le** vor dem konjugierten Verb: **Lo conosco. La vedo domani.** Im Passato prossimo kongruiert das Partizip mit lo/la/li/le: **L'ho vista. Li ho comprati.** An Infinitive und Imperative angehängt: **Voglio vederlo. Mangialo!**
  it-indirect-pron:
    meaning: "indirekte Objektpronomen"
    intro: |
      **mi, ti, gli** (ihm; umgangssprachlich auch ihnen), **le** (ihr; **Le** Ihnen, förmlich), **ci, vi, gli / loro**. **Gli scrivo una lettera. Le telefono domani.** Mit lo/la kombiniert: **me lo, te la, glielo** (ihm/ihr es: **Glielo do.**).
  it-ci-ne:
    meaning: "die Partikeln ci (dort) und ne (davon)"
    intro: |
      **ci** = dort(hin) / daran: **Ci vado domani. Ci penso io.** „Ich kümmere mich darum.“ **ne** = davon / welche / von dort: **Quanti ne vuoi? Ne voglio due. Non ne so niente. Me ne vado.** Vergleichbar mit deutsch *dahin, daran, davon, welche*.
  it-reflexive:
    meaning: "reflexive Verben"
    intro: |
      **mi, ti, si, ci, vi, si** + Verb: **mi chiamo, ti alzi, si lava, ci vediamo**. Viele Alltagsverben: alzarsi, svegliarsi, vestirsi, divertirsi, sentirsi, ricordarsi. Vergangenheit mit essere: **Mi sono divertita.**
  it-comparison:
    meaning: "Komparativ und Superlativ"
    intro: |
      **più / meno … di** vor Nomen oder Pronomen: **Marco è più alto di Luca.** **che** vor Adjektiven, Verben, Präpositionen: **più bello che utile**. Superlativ: **il più alto**; absolut **-issimo** (bellissimo „sehr schön“). Unregelmäßig: **migliore, peggiore, maggiore, minore; meglio, peggio**.
  it-futuro:
    meaning: "das einfache Futur"
    intro: |
      **-erò, -erai, -erà, -eremo, -erete, -eranno** (parlare → parlerò; credere → crederò; dormire → dormirò). Unregelmäßige Stämme: **sarò, avrò, andrò, farò, potrò, vorrò, dovrò, verrò, vedrò, berrò**. Auch für Vermutungen — wie deutsch *wird wohl*: **Saranno le tre** (es wird wohl drei sein).
  it-stare-gerund:
    meaning: "stare + Gerundium; stare per"
    intro: |
      **stare + Gerundium** (-ando, -endo) für eine laufende Handlung: **Sto mangiando.** „Ich esse gerade.“ **Che cosa stai facendo?** **stare per** + Infinitiv = im Begriff sein: **Sto per uscire.** Oft sagt man einfach **mangio**, wie im Deutschen.
  it-modals:
    meaning: "potere, volere, dovere"
    intro: |
      **potere**: posso, puoi, può, possiamo, potete, possono. **volere**: voglio, vuoi, vuole, vogliamo, volete, vogliono. **dovere**: devo, devi, deve, dobbiamo, dovete, devono. **sapere** (können, gelernt haben): so, sai, sa… **So nuotare.** Plus reiner Infinitiv: **Posso entrare?**
  it-time-prep:
    meaning: "seit, vor, in (Zeit)"
    intro: |
      **da** + Präsens = seit (dauert noch an) — wie im Deutschen: **Studio l'italiano da due anni.** „Ich lerne seit zwei Jahren Italienisch.“ **fa** = vor (nachgestellt): **due anni fa.** **fra / tra** = in (Zukunft): **fra una settimana.**
