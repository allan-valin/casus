# Macedonian text of the Italian course, B1–B2 — translated by AI (Claude) from the English (2026-10-20); comparisons with Portuguese are replaced by Macedonian ones
topics:
  The subjunctive: "Конјунктивот"
  Conditional and hypothesis: "Условен начин и хипотеза"
  Relatives and the passive: "Релативи и пасив"
  Past narrative: "Раскажување во минато"
  Commands and connectors: "Заповеди и сврзници"
  Compound tenses and the subjunctive: "Сложени времиња и конјунктивот"
  Implicit clauses: "Имплицитни реченици"
  Causatives and verbs with particles: "Каузативи и глаголи со честички"
  Register: "Регистар"
lessons:
  it-cong-pres:
    meaning: "сегашен конјунктив"
    intro: |
      По глаголи на мислење, желба, сомнеж и чувство, и по многу сврзници: **Penso che sia vero. Voglio che tu venga.** „Сакам да дојдеш.“ **Spero che vada bene.** Форми: **-are → -i** (che io/tu/lui parli, parliamo, parliate, parlino); **-ere/-ire → -a** (creda, dorma, finisca). Неправилни: **sia, abbia, vada, faccia, possa, voglia, debba, venga, dica, sappia, stia, dia.** Италијанскиот го користи и по *penso che*, каде македонскиот има индикатив (*мислам дека е*).
  it-cong-conj:
    meaning: "сврзници што бараат конјунктив"
    intro: |
      **benché, sebbene, nonostante** (иако), **affinché, perché** (за да), **prima che** (пред да), **a meno che (non)** (освен ако), **purché, a condizione che** (под услов да), **senza che** (без да): **Benché piova, esco. Te lo dico perché tu lo sappia.**
  it-cong-imp:
    meaning: "имперфектен конјунктив"
    intro: |
      **-assi, -assi, -asse, -assimo, -aste, -assero** (parlassi), **-essi** (credessi), **-issi** (dormissi). Неправилни: **fossi, dessi, stessi, facessi, dicessi, bevessi**. По минат главен глагол (**Pensavo che fosse vero**) и во реченици со *se* за нереални услови (**Se avessi tempo…** „Да имав време…“).
  it-condizionale:
    meaning: "сегашен условен начин"
    intro: |
      Основа на идното + **-ei, -esti, -ebbe, -emmo, -este, -ebbero**: parlerei, sarei, avrei, vorrei, potrei, dovrei, andrei, verrei. Учтиви барања (**Vorrei un caffè** „Би сакал кафе“), совети (**Dovresti riposare**), нереални последици (**…comprerei una casa**), пренесени вести (**Il ministro sarebbe malato** — „наводно е болен“).
  it-periodo-ipotetico:
    meaning: "условни реченици со se"
    intro: |
      Реален: **se** + сегашно, сегашно/идно (**Se piove, resto a casa**). Можен: **se** + имперфектен конјунктив, условен (**Se piovesse, resterei a casa**). Нереален минат: **se** + плусквамперфектен конјунктив, минат условен (**Se avessi saputo, sarei venuto** „Да знаев, ќе дојдев“). Никогаш условен по *se*.
  it-relatives:
    meaning: "релативни заменки"
    intro: |
      **che** = кој / што, подмет или директен предмет: **il libro che leggo**. По предлог **cui**: **la ragazza con cui esco, la città in cui vivo**; **il cui** = чиј (**l'autore il cui libro…**). **il quale / la quale / i quali / le quali** е официјална алтернатива. **chi** = оној што (**Chi dorme non piglia pesci** „Кој спие, риби не фаќа“).
  it-passive:
    meaning: "пасивот"
    intro: |
      **essere** + партицип (согласуван): **Il libro è stato scritto nel 1900.** **venire** наместо *essere* во простите времиња за дејство: **La porta viene chiusa alle otto.** **andare** + партицип = мора да се: **Il modulo va compilato.** Вршител со **da**: **scritto da Dante**.
  it-si-impersonale:
    meaning: "безлично и пасивно si"
    intro: |
      **si** + 3 лице = се / луѓето: **In Italia si mangia bene. Qui si parla italiano. Si vendono case** (глагол во множина со именка во множина) — исто како македонското **се јаде добро, се продаваат куќи**.
  it-trapassato:
    meaning: "плусквамперфектот"
    intro: |
      Имперфект од **avere / essere** + партицип: **avevo mangiato, ero partito.** Дејство пред друго минато — како македонското **беше заминал**: **Quando sono arrivato, il treno era già partito.**
  it-passato-remoto:
    meaning: "passato remoto (препознавање)"
    intro: |
      Минатото на историјата, романите и јужниот говор — слично на македонскиот аорист: **parlai, parlasti, parlò, parlammo, parlaste, parlarono**; **credetti / credei, dormii**. Неправилни: **fui, ebbi, feci, dissi, vidi, venni, presi, misi, scrissi, nacque, morì.** **Dante nacque a Firenze nel 1265.** На север во говорот го заменува passato prossimo.
  it-imperativo:
    meaning: "заповедниот начин"
    intro: |
      tu: **parla, credi, dormi**; voi: **parlate**; noi: **parliamo**. Одречно tu = **non** + инфинитив: **Non parlare!** Официјалното Lei го користи конјунктивот: **Parli piano, per favore. Venga!** Кратките форми **va', da', fa', sta', di'** ја удвојуваат согласката на заменката: **dimmi, fammi, vacci.**
  it-connectors:
    meaning: "сврзувачки зборови"
    intro: |
      **perciò, quindi, dunque** (затоа, значи), **però, ma, tuttavia** (но, меѓутоа), **invece** (наместо тоа, пак), **anzi** (напротив, всушност), **infatti** (навистина, имено — не спротивност!), **mentre** (додека), **siccome** (бидејќи).
  it-cong-passato:
    meaning: "минат конјунктив"
    intro: |
      **abbia / sia** + партицип, за претходно дејство под главен глагол во сегашно: **Penso che abbia già mangiato. Mi dispiace che tu non sia venuto.** „Жал ми е што не дојде.“
  it-cong-trapassato:
    meaning: "плусквамперфектен конјунктив"
    intro: |
      **avessi / fossi** + партицип: нереални минати услови (**Se l'avessi saputo…** „Да знаев…“) и претходни дејства под минат главен глагол (**Pensavo che fosse già arrivato**).
  it-cond-passato:
    meaning: "минат условен; идното во минатото"
    intro: |
      **avrei / sarei** + партицип: **Sarei venuto, ma ero malato.** Италијанскиот го користи и за иднината гледана од минатото, каде македонскиот има **ќе**: **Ha detto che sarebbe venuto** (рече дека ќе дојде).
  it-concordanza:
    meaning: "слагање на времињата"
    intro: |
      Главен глагол во сегашно → конјунктив сегашен / минат (**Penso che venga / sia venuto**); главен глагол во минато → имперфектен / плусквамперфектен конјунктив (**Pensavo che venisse / fosse venuto**), или минат условен за подоцнежно (**Pensavo che sarebbe venuto**).
  it-gerundio:
    meaning: "герундот наместо реченица"
    intro: |
      Герундот (-ando / -endo) заменува реченица за време, причина, средство или услов — како македонското **-јќи**: **Tornando a casa, ho visto Marco** (враќајќи се дома). **Studiando, impari** (учејќи). Минат герунд: **Avendo finito, sono uscito.** Неговиот подмет е обично тој на главниот глагол.
  it-infinito-passato:
    meaning: "минат инфинитив"
    intro: |
      **aver(e) / esser(e)** + партицип, по **dopo** и глаголи како *ricordare, pensare*: **Dopo aver mangiato, siamo usciti.** „Откако јадевме, излеговме.“ **Dopo essere arrivata, mi ha chiamato.** **Mi ricordo di averlo visto.**
  it-participio-presente:
    meaning: "минат и сегашен партицип како придавки"
    intro: |
      Минатите партиципи ги скратуваат реченците (**Finita la lezione, siamo andati al bar** — по часот…) и делуваат како придавки (**un libro scritto bene**). Сегашните партиципи на **-ante / -ente** се придавки или именки: **interessante, cantante, studente, presidente**.
  it-fare-infinito:
    meaning: "fare / lasciare + инфинитив"
    intro: |
      **fare + инфинитив** = да дадеш нешто да се направи или да натераш некого: **Faccio riparare la macchina. Mi hai fatto ridere.** „Ме насмеа.“ **farsi + инфинитив**: **Mi sono fatto tagliare i capelli.** **lasciare + инфинитив** = пушти: **Lasciami parlare!** „Пушти ме да зборувам!“
  it-pronominal-verbs:
    meaning: "глаголи со ci и ne"
    intro: |
      Фиксни глаголи со честички, многу чести во говорот: **andarsene** (да си оди: *me ne vado*), **farcela** (да успее: *ce la faccio*), **prendersela** (да се навреди: *non te la prendere*), **cavarsela** (да се снајде), **volerci** (да треба време: *ci vuole un'ora*), **metterci** (да потроши време: *ci metto dieci minuti*), **fregarsene** (да не му е гајле).
  it-lei:
    meaning: "официјалното обраќање"
    intro: |
      Официјалното *Вие* е **Lei** со глагол во 3 лице еднина (не 2 лице множина како во македонскиот), а неговите заменки во пишувањето често се со голема буква: **Come sta? La ringrazio. Le posso offrire un caffè?** Во множина официјално денес е **voi** (**Loro** е многу официјално). Придавките се согласуваат со вистинската личност: **Lei è stanco, signor Rossi?**
