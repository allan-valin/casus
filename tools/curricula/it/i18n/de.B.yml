# German text of the Italian course, B1–B2 — translated by AI (Claude) from the English (2026-10-20); comparisons with Portuguese are replaced by German ones
topics:
  The subjunctive: "Der Congiuntivo"
  Conditional and hypothesis: "Konditional und Hypothese"
  Relatives and the passive: "Relativa und Passiv"
  Past narrative: "Erzählen in der Vergangenheit"
  Commands and connectors: "Imperativ und Konnektoren"
  Compound tenses and the subjunctive: "Zusammengesetzte Tempora und der Congiuntivo"
  Implicit clauses: "Implizite Nebensätze"
  Causatives and verbs with particles: "Kausativa und Verben mit Partikeln"
  Register: "Register"
lessons:
  it-cong-pres:
    meaning: "Congiuntivo Präsens"
    intro: |
      Nach Verben der Meinung, des Wunsches, des Zweifels und des Gefühls sowie nach vielen Konjunktionen: **Penso che sia vero. Voglio che tu venga. Spero che vada bene.** Formen: **-are → -i** (che io/tu/lui parli, parliamo, parliate, parlino); **-ere/-ire → -a** (creda, dorma, finisca). Unregelmäßig: **sia, abbia, vada, faccia, possa, voglia, debba, venga, dica, sappia, stia, dia.** Italienisch nimmt ihn schon nach *penso che*, wo das Deutsche den Indikativ setzt (*ich glaube, dass es stimmt*).
  it-cong-conj:
    meaning: "Konjunktionen mit Congiuntivo"
    intro: |
      **benché, sebbene, nonostante** (obwohl), **affinché, perché** (damit), **prima che** (bevor), **a meno che (non)** (es sei denn), **purché, a condizione che** (vorausgesetzt), **senza che** (ohne dass): **Benché piova, esco. Te lo dico perché tu lo sappia.**
  it-cong-imp:
    meaning: "Congiuntivo Imperfekt"
    intro: |
      **-assi, -assi, -asse, -assimo, -aste, -assero** (parlassi), **-essi** (credessi), **-issi** (dormissi). Unregelmäßig: **fossi, dessi, stessi, facessi, dicessi, bevessi**. Nach einem Hauptverb in der Vergangenheit (**Pensavo che fosse vero**) und in *se*-Sätzen irrealer Bedingungen (**Se avessi tempo…** „Wenn ich Zeit hätte…“) — entspricht dort dem deutschen Konjunktiv II.
  it-condizionale:
    meaning: "der Konditional Präsens"
    intro: |
      Futurstamm + **-ei, -esti, -ebbe, -emmo, -este, -ebbero**: parlerei, sarei, avrei, vorrei, potrei, dovrei, andrei, verrei. Höfliche Bitten (**Vorrei un caffè**), Ratschläge (**Dovresti riposare**), irreale Folgen (**…comprerei una casa**), berichtete Nachrichten (**Il ministro sarebbe malato** — „soll krank sein“).
  it-periodo-ipotetico:
    meaning: "if-Sätze (Periodo ipotetico)"
    intro: |
      Real: **se** + Präsens, Präsens/Futur (**Se piove, resto a casa**). Möglich: **se** + Congiuntivo Imperfekt, Konditional (**Se piovesse, resterei a casa**). Irreal in der Vergangenheit: **se** + Congiuntivo Plusquamperfekt, Konditional II (**Se avessi saputo, sarei venuto**). Nie Konditional nach *se*.
  it-relatives:
    meaning: "Relativpronomen"
    intro: |
      **che** = der / die / das, als Subjekt oder direktes Objekt: **il libro che leggo**. Nach Präposition **cui**: **la ragazza con cui esco, la città in cui vivo**; **il cui** = dessen (**l'autore il cui libro…**). **il quale / la quale / i quali / le quali** ist eine förmliche Alternative. **chi** = wer (**Chi dorme non piglia pesci** „Wer schläft, fängt keine Fische“).
  it-passive:
    meaning: "das Passiv"
    intro: |
      **essere** + Partizip (kongruierend): **Il libro è stato scritto nel 1900.** **venire** statt *essere* in einfachen Tempora für eine Handlung — wie deutsch *werden* gegenüber *sein*: **La porta viene chiusa alle otto.** **andare** + Partizip = muss: **Il modulo va compilato.** Urheber mit **da**: **scritto da Dante**.
  it-si-impersonale:
    meaning: "unpersönliches und passives si"
    intro: |
      **si** + 3. Person = man / es wird getan: **In Italia si mangia bene. Qui si parla italiano. Si vendono case** (Verb im Plural bei Nomen im Plural) — wie deutsch *man isst gut, hier spricht man Italienisch*.
  it-trapassato:
    meaning: "das Plusquamperfekt"
    intro: |
      Imperfetto von **avere / essere** + Partizip: **avevo mangiato, ero partito.** Eine Handlung vor einer anderen vergangenen: **Quando sono arrivato, il treno era già partito.**
  it-passato-remoto:
    meaning: "das Passato remoto (Erkennen)"
    intro: |
      Die Vergangenheit der Geschichte, der Romane und der süditalienischen Rede: **parlai, parlasti, parlò, parlammo, parlaste, parlarono**; **credetti / credei, dormii**. Unregelmäßig: **fui, ebbi, feci, dissi, vidi, venni, presi, misi, scrissi, nacque, morì.** **Dante nacque a Firenze nel 1265.** Im Norden ersetzt es gesprochen das Passato prossimo — ähnlich wie im Süddeutschen das Perfekt das Präteritum ersetzt.
  it-imperativo:
    meaning: "der Imperativ"
    intro: |
      tu: **parla, credi, dormi**; voi: **parlate**; noi: **parliamo**. Verneintes tu = **non** + Infinitiv: **Non parlare!** Förmliches Lei nimmt den Congiuntivo: **Parli piano, per favore. Venga!** Kurzformen **va', da', fa', sta', di'** verdoppeln den Konsonanten des Pronomens: **dimmi, fammi, vacci.**
  it-connectors:
    meaning: "Bindewörter"
    intro: |
      **perciò, quindi, dunque** (also), **però, ma, tuttavia** (aber, jedoch), **invece** (stattdessen, hingegen), **anzi** (im Gegenteil, vielmehr), **infatti** (tatsächlich, nämlich — kein Gegensatz!), **mentre** (während), **siccome** (da).
  it-cong-passato:
    meaning: "Congiuntivo Perfekt"
    intro: |
      **abbia / sia** + Partizip, für eine frühere Handlung unter einem Hauptverb im Präsens: **Penso che abbia già mangiato. Mi dispiace che tu non sia venuto.**
  it-cong-trapassato:
    meaning: "Congiuntivo Plusquamperfekt"
    intro: |
      **avessi / fossi** + Partizip: irreale Bedingungen der Vergangenheit (**Se l'avessi saputo…** „Hätte ich es gewusst…“) und frühere Handlungen unter einem Hauptverb in der Vergangenheit (**Pensavo che fosse già arrivato**).
  it-cond-passato:
    meaning: "Konditional II; Futur in der Vergangenheit"
    intro: |
      **avrei / sarei** + Partizip: **Sarei venuto, ma ero malato.** Italienisch nimmt ihn auch für die Zukunft aus Sicht der Vergangenheit, wo Deutsch *würde* + Infinitiv sagt: **Ha detto che sarebbe venuto** (er sagte, er würde kommen).
  it-concordanza:
    meaning: "Zeitenfolge"
    intro: |
      Hauptverb Präsens → Congiuntivo Präsens / Perfekt (**Penso che venga / sia venuto**); Hauptverb Vergangenheit → Congiuntivo Imperfekt / Plusquamperfekt (**Pensavo che venisse / fosse venuto**) oder Konditional II für Späteres (**Pensavo che sarebbe venuto**).
  it-gerundio:
    meaning: "das Gerundium statt eines Nebensatzes"
    intro: |
      Das Gerundium (-ando / -endo) ersetzt einen Satz der Zeit, des Grundes, des Mittels oder der Bedingung: **Tornando a casa, ho visto Marco** (auf dem Heimweg). **Studiando, impari** (indem du lernst). Gerundium der Vergangenheit: **Avendo finito, sono uscito.** Sein Subjekt ist normalerweise das des Hauptverbs.
  it-infinito-passato:
    meaning: "Infinitiv Perfekt"
    intro: |
      **aver(e) / esser(e)** + Partizip, nach **dopo** und Verben wie *ricordare, pensare*: **Dopo aver mangiato, siamo usciti.** „Nachdem wir gegessen hatten, gingen wir aus.“ **Dopo essere arrivata, mi ha chiamato.** **Mi ricordo di averlo visto.**
  it-participio-presente:
    meaning: "Partizip Perfekt und Präsens als Adjektive"
    intro: |
      Partizipien Perfekt verkürzen Sätze (**Finita la lezione, siamo andati al bar** — nach dem Unterricht…) und wirken als Adjektive (**un libro scritto bene**). Partizipien Präsens auf **-ante / -ente** sind Adjektive oder Nomen: **interessante, cantante, studente, presidente**.
  it-fare-infinito:
    meaning: "fare / lasciare + Infinitiv"
    intro: |
      **fare + Infinitiv** = etwas machen lassen oder jemanden etwas tun lassen: **Faccio riparare la macchina.** „Ich lasse das Auto reparieren.“ **Mi hai fatto ridere.** **farsi + Infinitiv**: **Mi sono fatto tagliare i capelli.** **lasciare + Infinitiv** = (zu)lassen: **Lasciami parlare!**
  it-pronominal-verbs:
    meaning: "Verben mit ci und ne"
    intro: |
      Feste Verben mit Partikeln, gesprochen sehr häufig: **andarsene** (weggehen: *me ne vado*), **farcela** (es schaffen: *ce la faccio*), **prendersela** (übelnehmen: *non te la prendere*), **cavarsela** (zurechtkommen), **volerci** (Zeit brauchen: *ci vuole un'ora*), **metterci** (Zeit aufwenden: *ci metto dieci minuti*), **fregarsene** (egal sein).
  it-lei:
    meaning: "die höfliche Anrede"
    intro: |
      Das förmliche *Sie* ist **Lei** mit Verben in der 3. Person (Singular, anders als das deutsche *Sie*), seine Pronomen schriftlich oft großgeschrieben: **Come sta? La ringrazio. Le posso offrire un caffè?** Im Plural förmlich heute **voi** (**Loro** ist sehr förmlich). Adjektive kongruieren mit der wirklichen Person: **Lei è stanco, signor Rossi?**
