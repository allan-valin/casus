# Arabic text of the Italian course, C1–C2 — translated by AI (Claude) from the English (2026-10-20); the false-friends lesson lists general traps instead of Portuguese ones
topics:
  Fine points of the subjunctive: "دقائق الالتماسي"
  Text and style: "النص والأسلوب"
  Word formation: "بناء الكلمات"
  Literary and formal Italian: "الإيطالية الأدبية والرسمية"
  Variety: "التنوع"
lessons:
  it-c1-relative-subj:
    meaning: "الالتماسي في جمل الصلة وبعد التفضيل"
    intro: |
      جملة الصلة عن شيء مطلوب أو غير مؤكد أو فريد تأخذ الالتماسي: **Cerco una casa che abbia un giardino.** «أبحث عن بيت فيه حديقة». **È il libro più bello che abbia mai letto. Non c'è nessuno che lo sappia.**
  it-c1-indefinite:
    meaning: "كلمات -unque مع الالتماسي"
    intro: |
      **chiunque** (أيًّا كان)، **qualunque / qualsiasi** (أيّ، مهما)، **dovunque / ovunque** (أينما)، **comunque** (مهما؛ وأيضًا *على أي حال*): **Chiunque venga, digli di aspettare. Qualunque cosa tu faccia, fallo bene.**
  it-c1-come-se:
    meaning: "كأنّ"
    intro: |
      **come se** + الالتماسي الناقص أو البعيد: **Parla come se sapesse tutto.** «يتكلم كأنه يعرف كل شيء». **Mi guardava come se non mi avesse mai visto.** و**quasi** تعمل مثلها في الأسلوب الرسمي.
  it-c1-mica:
    meaning: "أدوات الكلام المحكي"
    intro: |
      **mica** تقوّي النفي (**Non è mica facile!** — ليس سهلًا أبدًا)؛ و**pure** = أيضًا / تفضّل (**Entri pure!** «تفضّل بالدخول!»)؛ و**magari** = ربما، أو «يا ليت!» (**Magari!**)؛ و**mica** وحدها في سؤال = بالصدفة (**Hai mica visto Luca?**)؛ و**proprio** = حقًا؛ و**ormai** = الآن وقد.
  it-c1-dislocation:
    meaning: "التقديم: الموضوع أولًا والضمير يعيده"
    intro: |
      تقدّم الإيطالية المحكية الموضوع وتعيده بضمير — كالاشتغال في العربية: **Il caffè lo prendo amaro.** «القهوةُ أشربها مُرّة». **Di questo ne parliamo dopo. A Maria le ho detto tutto.** وعلى اليمين أيضًا: **Lo conosci, Marco?** والجملة المشطورة للحصر: **È lui che ha vinto. Sono io che pago.**
  it-c1-nominal:
    meaning: "الأسلوب الاسمي"
    intro: |
      الكتابة الرسمية تحوّل الأفعال إلى أسماء — كالمصادر في العربية: **realizzare → la realizzazione؛ decidere → la decisione؛ aumentare → l'aumento؛ chiudere → la chiusura**: **In seguito alla chiusura della fabbrica…** واللواحق **-zione، -mento، -tura، -enza**.
  it-c1-connectors:
    meaning: "أدوات الربط الرسمية"
    intro: |
      **pertanto، dunque، di conseguenza** (لذلك)؛ **tuttavia، nondimeno، ciononostante** (ومع ذلك)؛ **inoltre، per di più** (علاوة على ذلك)؛ **in effetti** (بالفعل)؛ **d'altronde / del resto** (ثم إنّ)؛ **ossia، ovvero** (أي)؛ **qualora** + الالتماسي (في حال)؛ **in quanto** (بما أنّ).
  it-c1-alterati:
    meaning: "التصغير والتكبير والتحقير"
    intro: |
      **-ino، -etto، -ello** (صغير، عزيز: gattino، casetta، alberello — كالتصغير «قُطَيط»)، **-one** (كبير: librone، ragazzone)، **-accio** (سيئ: tempaccio، parolaccia)، **-uccio** (صغير، لطيف أو رثّ). وبعضها كلمات مستقلة: **cavalletto** (حامل الرسم)، **lampone** (توت العليق).
  it-c2-remoto-letterario:
    meaning: "الماضي البعيد السردي في كل الضمائر"
    intro: |
      تكتب الروايات والتاريخ الماضي البعيد في كل موضع: **-ai، -asti، -ò، -ammo، -aste، -arono؛ -ei/-etti، -esti، -é/-ette، -emmo، -este، -erono/-ettero؛ -ii، -isti، -ì، -immo، -iste، -irono.** والشاذ يتبع نمط 1-3-3 (**presi، prendesti، prese، prendemmo، prendeste، presero**). ومركّبه، الماضي الأبعد (**ebbe finito**)، لا يأتي إلا بعد *quando، appena، dopo che*.
  it-c2-bureaucratic:
    meaning: "الإيطالية الإدارية"
    intro: |
      الأسلوب الرسمي: **si prega di** + المصدر (يُرجى…)، **è fatto divieto di** (يُمنع)، **il sottoscritto** (الموقّع أدناه)، **in allegato** (مرفق)، **previa autorizzazione** (بعد إذن مسبق)، **ai sensi dell'articolo 3** (بموجب المادة 3)، **entro e non oltre** (في موعد أقصاه)، **in merito a** (بخصوص).
  it-c2-participle-absolute:
    meaning: "اسم المفعول وصيغة الحال المطلقان"
    intro: |
      تضغط الإيطالية الرسمية جملة كاملة في اسم مفعول أو صيغة حال لها فاعلها الخاص: **Detto questo, se ne andò.** «وبعد أن قال ذلك انصرف». **Partiti gli ospiti, si mise a dormire. Essendo il treno in ritardo, prendemmo un taxi.**
  it-c2-regional:
    meaning: "الإيطالية المحكية والإقليمية"
    intro: |
      حشو الكلام: **cioè** (أعني)، **tipo** (مثل)، **boh** (لا أدري)، **dai** (هيا)، **mah** (حسنًا…)، **figurati** (لا شكر على واجب / وكأنّ!)، **magari**. وإقليميًا: في الشمال *passato prossimo* فقط، وفي الجنوب *passato remoto* حتى لليوم؛ و**tenere** بدل *avere* في الجنوب (*tengo fame*)، و**'sto / 'sta** بدل *questo / questa* في روما.
  it-c2-false-friends:
    meaning: "الأصدقاء المزيفون"
    intro: |
      كلمات توهم بمعنى مألوف من لغات أخرى: **caldo** = حار (لا «بارد»: *freddo*)، **camera** = غرفة (لا «كاميرا»)، **morbido** = ناعم طريّ، **magazzino** = مستودع (لا «متجر»: *negozio*)، **parenti** = أقارب (لا «والدان»: *genitori*)، **salire** = صعد، **fermare** = أوقف، **stanza** = غرفة، **burro** = زبدة، **pronto** = ألو! على الهاتف. وفي الأصل الإنجليزي تقف هنا فخاخ الناطقين بالبرتغالية.
