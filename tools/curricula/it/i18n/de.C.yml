# German text of the Italian course, C1–C2 — translated by AI (Claude) from the English (2026-10-20); the false-friends lesson lists German traps instead of Portuguese ones
topics:
  Fine points of the subjunctive: "Feinheiten des Congiuntivo"
  Text and style: "Text und Stil"
  Word formation: "Wortbildung"
  Literary and formal Italian: "Literarisches und förmliches Italienisch"
  Variety: "Varietäten"
lessons:
  it-c1-relative-subj:
    meaning: "Congiuntivo in Relativsätzen und nach Superlativen"
    intro: |
      Ein Relativsatz über etwas Gesuchtes, Ungewisses oder Einmaliges nimmt den Congiuntivo: **Cerco una casa che abbia un giardino. È il libro più bello che abbia mai letto. Non c'è nessuno che lo sappia.**
  it-c1-indefinite:
    meaning: "-unque-Wörter mit Congiuntivo"
    intro: |
      **chiunque** (wer auch immer), **qualunque / qualsiasi** (was auch immer, jeder beliebige), **dovunque / ovunque** (wo auch immer), **comunque** (wie auch immer; auch *jedenfalls*): **Chiunque venga, digli di aspettare. Qualunque cosa tu faccia, fallo bene.**
  it-c1-come-se:
    meaning: "als ob"
    intro: |
      **come se** + Congiuntivo Imperfekt oder Plusquamperfekt: **Parla come se sapesse tutto.** „Er redet, als wüsste er alles.“ **Mi guardava come se non mi avesse mai visto.** **quasi** funktioniert im gehobenen Stil genauso.
  it-c1-mica:
    meaning: "Partikeln der gesprochenen Sprache"
    intro: |
      **mica** verstärkt eine Verneinung (**Non è mica facile!** — das ist gar nicht leicht); **pure** = auch / ruhig (**Entri pure!** „Kommen Sie ruhig herein!“); **magari** = vielleicht oder „schön wär's!“ (**Magari!**); **mica** allein in einer Frage = zufällig (**Hai mica visto Luca?**); **proprio** = wirklich; **ormai** = inzwischen, nun schon.
  it-c1-dislocation:
    meaning: "Dislokation: Thema vorn, Pronomen wiederholt es"
    intro: |
      Gesprochenes Italienisch stellt das Thema voran und nimmt es mit einem Pronomen wieder auf: **Il caffè lo prendo amaro. Di questo ne parliamo dopo. A Maria le ho detto tutto.** Auch rechts: **Lo conosci, Marco?** Spaltsatz zur Hervorhebung: **È lui che ha vinto. Sono io che pago.**
  it-c1-nominal:
    meaning: "Nominalstil"
    intro: |
      Förmliches Schreiben macht aus Verben Nomen — wie im deutschen Amtsstil: **realizzare → la realizzazione; decidere → la decisione; aumentare → l'aumento; chiudere → la chiusura**: **In seguito alla chiusura della fabbrica…** Suffixe **-zione, -mento, -tura, -enza**.
  it-c1-connectors:
    meaning: "förmliche Konnektoren"
    intro: |
      **pertanto, dunque, di conseguenza** (daher); **tuttavia, nondimeno, ciononostante** (dennoch); **inoltre, per di più** (außerdem); **in effetti** (in der Tat); **d'altronde / del resto** (schließlich, übrigens); **ossia, ovvero** (das heißt); **qualora** + Congiuntivo (falls); **in quanto** (da, insofern).
  it-c1-alterati:
    meaning: "Diminutive, Augmentative, Pejorative"
    intro: |
      **-ino, -etto, -ello** (klein, lieb: gattino, casetta, alberello — wie deutsch *-chen, -lein*), **-one** (groß: librone, ragazzone), **-accio** (schlecht: tempaccio, parolaccia), **-uccio** (klein, süß oder ärmlich). Manche sind eigene Wörter: **cavalletto** (Staffelei), **lampone** (Himbeere).
  it-c2-remoto-letterario:
    meaning: "das Passato remoto in der Erzählung, alle Personen"
    intro: |
      Romane und Geschichtsschreibung schreiben durchgehend Passato remoto: **-ai, -asti, -ò, -ammo, -aste, -arono; -ei/-etti, -esti, -é/-ette, -emmo, -este, -erono/-ettero; -ii, -isti, -ì, -immo, -iste, -irono.** Unregelmäßige folgen dem Muster 1-3-3 (**presi, prendesti, prese, prendemmo, prendeste, presero**). Seine zusammengesetzte Form, das Trapassato remoto (**ebbe finito**), nur nach *quando, appena, dopo che*.
  it-c2-bureaucratic:
    meaning: "Bürokratenitalienisch"
    intro: |
      Amtsstil: **si prega di** + Infinitiv (bitte…), **è fatto divieto di** (es ist verboten), **il sottoscritto** (der Unterzeichnete), **in allegato** (anbei), **previa autorizzazione** (nach vorheriger Genehmigung), **ai sensi dell'articolo 3** (gemäß Artikel 3), **entro e non oltre** (spätestens bis), **in merito a** (bezüglich).
  it-c2-participle-absolute:
    meaning: "absolutes Partizip und Gerundium"
    intro: |
      Förmliches Italienisch packt einen ganzen Satz in ein Partizip oder Gerundium mit eigenem Subjekt: **Detto questo, se ne andò.** „Nachdem er das gesagt hatte, ging er.“ **Partiti gli ospiti, si mise a dormire. Essendo il treno in ritardo, prendemmo un taxi.**
  it-c2-regional:
    meaning: "gesprochenes und regionales Italienisch"
    intro: |
      Füllwörter: **cioè** (ich meine), **tipo** (so wie), **boh** (keine Ahnung), **dai** (komm schon), **mah** (na ja…), **figurati** (keine Ursache / von wegen!), **magari**. Regional: im Norden nur *passato prossimo*, im Süden *passato remoto* sogar für heute; **tenere** für *avere* im Süden (*tengo fame*), **'sto / 'sta** für *questo / questa* in Rom.
  it-c2-false-friends:
    meaning: "falsche Freunde für Deutschsprachige"
    intro: |
      **caldo** = heiß (nicht kalt: *freddo*), **camera** = Zimmer (nicht Kamera), **morbido** = weich (nicht morbid), **cantina** = Keller (nicht Kantine: *mensa*), **parenti** = Verwandte (nicht Eltern: *genitori*), **salire** = hinaufgehen, **fermare** = anhalten, **stanza** = Raum, **burro** = Butter (nicht Büro: *ufficio*), **pronto** = hallo! am Telefon, **lampone** = Himbeere (nicht Lampe). Im englischen Original stehen hier die Fallen für Portugiesischsprechende.
