# Macedonian text of the Italian course, C1–C2 — translated by AI (Claude) from the English (2026-10-20); the false-friends lesson lists general traps instead of Portuguese ones
topics:
  Fine points of the subjunctive: "Финеси на конјунктивот"
  Text and style: "Текст и стил"
  Word formation: "Зборообразување"
  Literary and formal Italian: "Книжевен и официјален италијански"
  Variety: "Варијации"
lessons:
  it-c1-relative-subj:
    meaning: "конјунктив во релативни реченици и по суперлативи"
    intro: |
      Релативна реченица за нешто барано, несигурно или единствено зема конјунктив: **Cerco una casa che abbia un giardino.** „Барам куќа што да има градина.“ **È il libro più bello che abbia mai letto. Non c'è nessuno che lo sappia.**
  it-c1-indefinite:
    meaning: "зборови на -unque со конјунктив"
    intro: |
      **chiunque** (кој и да), **qualunque / qualsiasi** (што и да, кој било), **dovunque / ovunque** (каде и да), **comunque** (како и да; и *во секој случај*): **Chiunque venga, digli di aspettare. Qualunque cosa tu faccia, fallo bene.**
  it-c1-come-se:
    meaning: "како да"
    intro: |
      **come se** + имперфектен или плусквамперфектен конјунктив: **Parla come se sapesse tutto.** „Зборува како да знае сѐ.“ **Mi guardava come se non mi avesse mai visto.** **quasi** работи исто во официјален стил.
  it-c1-mica:
    meaning: "честички на говорот"
    intro: |
      **mica** ја засилува негацијата (**Non è mica facile!** — воопшто не е лесно); **pure** = исто / слободно (**Entri pure!** „Слободно влезете!“); **magari** = можеби, или „барем!“ (**Magari!**); **mica** само во прашање = случајно (**Hai mica visto Luca?**); **proprio** = навистина; **ormai** = веќе.
  it-c1-dislocation:
    meaning: "дислокација: темата напред, заменката ја повторува"
    intro: |
      Говорниот италијански ја става темата напред и ја повторува со заменка — исто како македонското удвојување (**кафето го пијам горко**): **Il caffè lo prendo amaro. Di questo ne parliamo dopo. A Maria le ho detto tutto.** И десно: **Lo conosci, Marco?** Расцепена реченица за фокус: **È lui che ha vinto. Sono io che pago.**
  it-c1-nominal:
    meaning: "номинален стил"
    intro: |
      Официјалното пишување ги претвора глаголите во именки: **realizzare → la realizzazione; decidere → la decisione; aumentare → l'aumento; chiudere → la chiusura**: **In seguito alla chiusura della fabbrica…** Наставки **-zione, -mento, -tura, -enza** — како македонските **-ње, -ција**.
  it-c1-connectors:
    meaning: "официјални сврзници"
    intro: |
      **pertanto, dunque, di conseguenza** (затоа); **tuttavia, nondimeno, ciononostante** (сепак); **inoltre, per di più** (освен тоа); **in effetti** (навистина); **d'altronde / del resto** (впрочем); **ossia, ovvero** (односно); **qualora** + конјунктив (доколку); **in quanto** (бидејќи, како).
  it-c1-alterati:
    meaning: "деминутиви, аугментативи, пејоративи"
    intro: |
      **-ino, -etto, -ello** (мало, мило: gattino, casetta, alberello — како **-че, -ичка**), **-one** (големо: librone, ragazzone), **-accio** (лошо: tempaccio, parolaccia), **-uccio** (мало, слатко или бедно). Некои се посебни зборови: **cavalletto** (статив), **lampone** (малина).
  it-c2-remoto-letterario:
    meaning: "passato remoto во раскажувањето, сите лица"
    intro: |
      Романите и историјата пишуваат passato remoto насекаде: **-ai, -asti, -ò, -ammo, -aste, -arono; -ei/-etti, -esti, -é/-ette, -emmo, -este, -erono/-ettero; -ii, -isti, -ì, -immo, -iste, -irono.** Неправилните следат 1-3-3 (**presi, prendesti, prese, prendemmo, prendeste, presero**). Неговото сложено, trapassato remoto (**ebbe finito**), само по *quando, appena, dopo che*.
  it-c2-bureaucratic:
    meaning: "бирократски италијански"
    intro: |
      Службен стил: **si prega di** + инфинитив (ве молиме…), **è fatto divieto di** (забрането е), **il sottoscritto** (долупотпишаниот), **in allegato** (во прилог), **previa autorizzazione** (по претходно одобрение), **ai sensi dell'articolo 3** (согласно член 3), **entro e non oltre** (најдоцна до), **in merito a** (во врска со).
  it-c2-participle-absolute:
    meaning: "апсолутен партицип и герунд"
    intro: |
      Официјалниот италијански пакува цела реченица во партицип или герунд со свој подмет: **Detto questo, se ne andò.** „Откако го рече тоа, си замина.“ **Partiti gli ospiti, si mise a dormire. Essendo il treno in ritardo, prendemmo un taxi.**
  it-c2-regional:
    meaning: "говорен и регионален италијански"
    intro: |
      Поштапалки: **cioè** (мислам), **tipo** (како), **boh** (немам поим), **dai** (ајде), **mah** (па…), **figurati** (нема зошто / ма какво!), **magari**. Регионално: на север само *passato prossimo*, на југ *passato remoto* дури и за денес; **tenere** за *avere* на југ (*tengo fame*), **'sto / 'sta** за *questo / questa* во Рим.
  it-c2-false-friends:
    meaning: "лажни пријатели"
    intro: |
      **caldo** = топло (не „студено“: *freddo*), **camera** = соба (не камера), **morbido** = мек (не морбиден), **magazzino** = магацин, склад (не продавница: *negozio*), **cantina** = визба (не кантина: *mensa*), **parenti** = роднини (не родители: *genitori*), **salire** = качува, **fermare** = запира, **stanza** = соба, **burro** = путер, **pronto** = ало! на телефон. Во англискиот оригинал тука стојат стапиците за говорителите на португалски.
