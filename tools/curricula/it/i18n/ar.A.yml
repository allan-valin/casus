# Arabic text of the Italian course, A1–A2 — translated by AI (Claude) from the English (2026-10-20); comparisons with Portuguese are replaced by Arabic ones or dropped
topics:
  Articles and nouns: "الأدوات والأسماء"
  Essere, avere and the present: "essere وavere والمضارع"
  Questions and negation: "الأسئلة والنفي"
  Prepositions and possession: "حروف الجر والملكية"
  Everyday basics: "أساسيات يومية"
  The past: "الماضي"
  Pronouns: "الضمائر"
  Comparing and the future: "المقارنة والمستقبل"
  Modal verbs and time: "الأفعال المساعدة والزمن"
lessons:
  it-articles:
    meaning: "أداة التعريف"
    intro: |
      المذكر **il** (il libro)، و**lo** قبل s + صامت وz وgn وps وx وy (lo studente، lo zio)، و**l'** قبل الصائت (l'amico)؛ والجمع **i** / **gli** (i libri، gli studenti، gli amici). والمؤنث **la**، و**l'** قبل الصائت (la casa، l'amica)، والجمع **le** (le case).
  it-indef:
    meaning: "أداة التنكير"
    intro: |
      **un** (un libro، un amico)، و**uno** حيث تُستعمل *lo* (uno studente، uno zaino)، و**una** (una casa)، و**un'** قبل الصائت في المؤنث (un'amica). ولا فاصلة علوية في المذكر: **un amico**.
  it-plural:
    meaning: "جمع الأسماء"
    intro: |
      **-o → -i** (libro، libri)، **-a → -e** (casa، case)، **-e → -i** (fiore، fiori). والمذكر المنتهي بـ **-a** → **-i** (problema، problemi). ولا يتغير: الصائت الأخير المنبور (città)، والكلمات المنتهية بصامت (film، bar). و**-co/-go** كثيرًا ما تضيف *h* (amica → amiche، lago → laghi)، لكن amico → amici.
  it-essere:
    meaning: "essere، يكون"
    intro: |
      **sono، sei، è، siamo، siete، sono**. وتستعمل الإيطالية **essere** لأغلب معاني «يكون» (و**stare** في عبارات ثابتة فقط: *Come stai?* «كيف حالك؟»). و**C'è / ci sono** = *يوجد*.
  it-avere:
    meaning: "avere، يملك"
    intro: |
      **ho، hai، ha، abbiamo، avete، hanno** (الـ *h* صامتة). وتُستعمل للعمر والمشاعر: **Ho vent'anni** (عمري عشرون)، **ho fame / sete / freddo / paura** (أنا جائع / عطشان / بردان / خائف).
  it-present:
    meaning: "المضارع: -are، -ere، -ire"
    intro: |
      **-are** (parlare): parlo، parli، parla، parliamo، parlate، parlano. **-ere** (credere): credo، credi، crede، crediamo، credete، credono. **-ire** (dormire): dormo، dormi، dorme، dormiamo، dormite، dormono؛ وكثير من أفعال -ire تضيف **-isc-** (finire: finisco، finisci، finisce، finiamo، finite، finiscono). والنبر: **pàrlano**، على الجذر.
  it-non:
    meaning: "النفي"
    intro: |
      **non** قبل الفعل (وضمائره المتصلة): **Non parlo inglese. Non lo so.** والنفي المزدوج عادي: **Non vedo niente / nessuno.** «لا أرى شيئًا / أحدًا». **Non vado mai.**
  it-questions:
    meaning: "أدوات الاستفهام"
    intro: |
      **chi** (من)، **che / cosa / che cosa** (ماذا)، **dove** (أين)، **quando** (متى)، **come** (كيف)، **perché** (لماذا — وأيضًا *لأنّ*)، **quanto/-a/-i/-e** (كم)، **quale / quali** (أيّ). وأسئلة نعم/لا تحتفظ بترتيب الخبر؛ والنغمة وحدها ترتفع.
  it-prep-art:
    meaning: "حرف الجر + أداة التعريف"
    intro: |
      **di، a، da، in، su** تندمج مع الأداة: **del، dello، della، dei، degli، delle**؛ **al، allo، alla، ai، agli، alle**؛ **dal…**؛ **nel…**؛ **sul…** — كاندماج «بِ + الـ» في العربية. و**con** و**per** تبقيان منفصلتين (con il).
  it-possessive:
    meaning: "الملكية مع الأداة"
    intro: |
      **il mio، la mia، i miei، le mie؛ il tuo…؛ il suo** (له / لها / لحضرتك)؛ **il nostro، il vostro، il loro** (لا يتغير). وتبقى الأداة — **la mia casa** — إلا مع فرد واحد من الأسرة: **mia madre، mio fratello** (لكن **la mia mamma، i miei fratelli، il loro padre**).
  it-numbers:
    meaning: "الأعداد"
    intro: |
      uno، due، tre، quattro، cinque، sei، sette، otto، nove، dieci؛ undici، dodici… venti، ventuno، ventotto (يسقط الصائت قبل *uno/otto*)، trenta… cento، mille، **duemila**. والعشرات أولًا، بخلاف العربية (ventuno = واحد وعشرون).
  it-piacere:
    meaning: "الإعجاب: mi piace / mi piacciono"
    intro: |
      «أحب» تُقال «يعجبني» — كالعربية: **Mi piace la pizza. Mi piacciono i gatti.** ويطابق الفعل الشيء المحبوب؛ والشخص مفعول غير مباشر: **mi، ti، gli** (له)، **le** (لها)، **ci، vi، gli** (لهم). **A Marco piace il calcio.**
  it-passato-prossimo:
    meaning: "الماضي القريب (passato prossimo)"
    intro: |
      الماضي اليومي: **avere / essere** + اسم المفعول (**-ato، -uto، -ito**): **Ho mangiato.** «أكلت». **Abbiamo visto un film.** وأفعال الحركة والتحوّل والأفعال الانعكاسية تأخذ **essere**، ويطابق اسم المفعول: **Sono andata a Roma. Siamo arrivati. Mi sono svegliato.**
  it-participles:
    meaning: "أسماء المفعول الشاذة"
    intro: |
      **fare → fatto، dire → detto، vedere → visto، prendere → preso، mettere → messo، scrivere → scritto، leggere → letto، aprire → aperto، venire → venuto، essere → stato، nascere → nato، morire → morto، rimanere → rimasto، scegliere → scelto، chiedere → chiesto، rispondere → risposto.**
  it-imperfetto:
    meaning: "الماضي الناقص (imperfetto)"
    intro: |
      للخلفية والعادات والوصف في الماضي، كـ«كان يفعل»: **-avo، -avi، -ava، -avamo، -avate، -avano** (parlavo)، **-evo** (credevo)، **-ivo** (dormivo). **essere: ero، eri، era، eravamo، eravate، erano.** **Quando ero piccolo, giocavo sempre.** «حين كنت صغيرًا كنت ألعب دائمًا».
  it-direct-pron:
    meaning: "ضمائر المفعول المباشر"
    intro: |
      **mi، ti، lo، la، ci، vi، li، le** قبل الفعل المصرّف: **Lo conosco. La vedo domani.** ومع الماضي القريب يطابق اسم المفعول lo/la/li/le: **L'ho vista. Li ho comprati.** وتتصل بالمصدر والأمر — كالضمائر المتصلة في العربية: **Voglio vederlo. Mangialo!**
  it-indirect-pron:
    meaning: "ضمائر المفعول غير المباشر"
    intro: |
      **mi، ti، gli** (له؛ وعاميًا لهم أيضًا)، **le** (لها؛ و**Le** لحضرتك)، **ci، vi، gli / loro**. **Gli scrivo una lettera. Le telefono domani.** ومع lo/la: **me lo، te la، glielo** (له/لها إياه: **Glielo do.**).
  it-ci-ne:
    meaning: "الأداتان ci (هناك) وne (منه)"
    intro: |
      **ci** = هناك / فيه: **Ci vado domani. Ci penso io.** «أنا أتولى الأمر». و**ne** = منه / بعضه / من هناك: **Quanti ne vuoi? Ne voglio due. Non ne so niente. Me ne vado.** فكّر في «هناك، فيه، منه».
  it-reflexive:
    meaning: "الأفعال الانعكاسية"
    intro: |
      **mi، ti، si، ci، vi، si** + الفعل: **mi chiamo، ti alzi، si lava، ci vediamo**. وأفعال يومية كثيرة: alzarsi، svegliarsi، vestirsi، divertirsi، sentirsi، ricordarsi. والماضي مع essere: **Mi sono divertita.**
  it-comparison:
    meaning: "المقارنة والتفضيل"
    intro: |
      **più / meno … di** قبل الاسم أو الضمير: **Marco è più alto di Luca.** و**che** قبل الصفات والأفعال وحروف الجر: **più bello che utile**. والتفضيل: **il più alto**؛ والمطلق **-issimo** (bellissimo «جميل جدًا»). والشاذ: **migliore، peggiore، maggiore، minore؛ meglio، peggio**.
  it-futuro:
    meaning: "المستقبل البسيط"
    intro: |
      **-erò، -erai، -erà، -eremo، -erete، -eranno** (parlare → parlerò؛ credere → crederò؛ dormire → dormirò). والجذور الشاذة: **sarò، avrò، andrò، farò، potrò، vorrò، dovrò، verrò، vedrò، berrò**. وللتخمين أيضًا: **Saranno le tre** (لعلها الثالثة).
  it-stare-gerund:
    meaning: "stare + صيغة الحال؛ stare per"
    intro: |
      **stare + صيغة الحال** (-ando، -endo) لفعل جارٍ: **Sto mangiando.** «أنا آكل الآن». **Che cosa stai facendo?** و**stare per** + المصدر = أوشك: **Sto per uscire.** وكثيرًا ما يُقال ببساطة **mangio**.
  it-modals:
    meaning: "potere وvolere وdovere"
    intro: |
      **potere**: posso، puoi، può، possiamo، potete، possono. **volere**: voglio، vuoi، vuole، vogliamo، volete، vogliono. **dovere**: devo، devi، deve، dobbiamo، dovete، devono. **sapere** (يعرف كيف): so، sai، sa… **So nuotare.** «أعرف السباحة». مع المصدر المجرد: **Posso entrare?**
  it-time-prep:
    meaning: "منذ، قبل، بعد (الزمن)"
    intro: |
      **da** + المضارع = منذ (ما زال مستمرًا): **Studio l'italiano da due anni.** «أدرس الإيطالية منذ سنتين». **fa** = قبل (بعد العدد): **due anni fa.** **fra / tra** = بعد (المستقبل): **fra una settimana.**
