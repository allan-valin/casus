# Macedonian text of the Italian course, A1–A2 — translated by AI (Claude) from the English (2026-10-20); comparisons with Portuguese are replaced by Macedonian ones
topics:
  Articles and nouns: "Членови и именки"
  Essere, avere and the present: "Essere, avere и сегашното"
  Questions and negation: "Прашања и негација"
  Prepositions and possession: "Предлози и присвојност"
  Everyday basics: "Секојдневни основи"
  The past: "Минатото"
  Pronouns: "Заменки"
  Comparing and the future: "Споредување и идното"
  Modal verbs and time: "Модални глаголи и време"
lessons:
  it-articles:
    meaning: "определениот член"
    intro: |
      Членот стои пред именката, не на крајот како во македонскиот. Машки **il** (il libro), **lo** пред s + согласка, z, gn, ps, x, y (lo studente, lo zio), **l'** пред самогласка (l'amico); множина **i** / **gli** (i libri, gli studenti, gli amici). Женски **la**, **l'** пред самогласка (la casa, l'amica), множина **le** (le case). Нема среден род.
  it-indef:
    meaning: "неопределениот член"
    intro: |
      **un** (un libro, un amico), **uno** каде што би стоело *lo* (uno studente, uno zaino), **una** (una casa), **un'** пред самогласка во женски род (un'amica). Без апостроф во машки: **un amico**.
  it-plural:
    meaning: "множината на именките"
    intro: |
      **-o → -i** (libro, libri), **-a → -e** (casa, case), **-e → -i** (fiore, fiori). Машки на **-a** → **-i** (problema, problemi). Непроменливи: нагласена крајна самогласка (città), зборови на согласка (film, bar). **-co/-go** често додаваат *h* (amica → amiche, lago → laghi), но amico → amici.
  it-essere:
    meaning: "essere, е / сум"
    intro: |
      **sono, sei, è, siamo, siete, sono**. Италијанскиот користи **essere** за речиси сите значења на „сум“ (со **stare** само во цврсти изрази: *Come stai?* „Како си?“). **C'è / ci sono** = *има*.
  it-avere:
    meaning: "avere, има"
    intro: |
      **ho, hai, ha, abbiamo, avete, hanno** (*h* е немо). И за возраст и чувства: **Ho vent'anni** (имам дваесет години), **ho fame / sete / freddo / paura** (гладен сум / жеден сум / ми е студено / се плашам).
  it-present:
    meaning: "сегашното: -are, -ere, -ire"
    intro: |
      **-are** (parlare): parlo, parli, parla, parliamo, parlate, parlano. **-ere** (credere): credo, credi, crede, crediamo, credete, credono. **-ire** (dormire): dormo, dormi, dorme, dormiamo, dormite, dormono; многу глаголи на -ire додаваат **-isc-** (finire: finisco, finisci, finisce, finiamo, finite, finiscono). Нагласок: **pàrlano**, на основата.
  it-non:
    meaning: "негација"
    intro: |
      **non** пред глаголот (и неговите клитики): **Non parlo inglese. Non lo so.** Двојната негација е нормална — како во македонскиот: **Non vedo niente / nessuno.** „Не гледам ништо / никого.“ **Non vado mai.**
  it-questions:
    meaning: "прашални зборови"
    intro: |
      **chi** (кој), **che / cosa / che cosa** (што), **dove** (каде), **quando** (кога), **come** (како), **perché** (зошто — и *затоа што*), **quanto/-a/-i/-e** (колку), **quale / quali** (кој од). Прашањата да/не го задржуваат редот на изјавата; само интонацијата се крева.
  it-prep-art:
    meaning: "предлог + член"
    intro: |
      **di, a, da, in, su** се спојуваат со членот: **del, dello, della, dei, degli, delle**; **al, allo, alla, ai, agli, alle**; **dal…**; **nel…**; **sul…**. **con** и **per** остануваат одделно (con il).
  it-possessive:
    meaning: "присвојни со членот"
    intro: |
      **il mio, la mia, i miei, le mie; il tuo…; il suo** (негов / нејзин / ваш официјално); **il nostro, il vostro, il loro** (непроменливо). Членот останува — **la mia casa** — но не со еден член од семејството: **mia madre, mio fratello** (но **la mia mamma, i miei fratelli, il loro padre**).
  it-numbers:
    meaning: "броеви"
    intro: |
      uno, due, tre, quattro, cinque, sei, sette, otto, nove, dieci; undici, dodici… venti, ventuno, ventotto (самогласката отпаѓа пред *uno/otto*), trenta… cento, mille, **duemila**.
  it-piacere:
    meaning: "допаѓање: mi piace / mi piacciono"
    intro: |
      „Ми се допаѓа“ — исто како во македонскиот: **Mi piace la pizza. Mi piacciono i gatti.** Глаголот се согласува со допаѓаното; личноста е индиректна: **mi, ti, gli** (нему), **le** (нејзе), **ci, vi, gli** (ним). **A Marco piace il calcio.**
  it-passato-prossimo:
    meaning: "passato prossimo"
    intro: |
      Секојдневното минато: **avere / essere** + минат партицип (**-ato, -uto, -ito**) — слично на македонското **имам јадено**: **Ho mangiato. Abbiamo visto un film.** Глаголите на движење и промена и повратните земаат **essere**, а партиципот се согласува: **Sono andata a Roma. Siamo arrivati. Mi sono svegliato.** Каде македонскиот вели *јадов*, италијанскиот обично вели **ho mangiato**.
  it-participles:
    meaning: "неправилни минати партиципи"
    intro: |
      **fare → fatto, dire → detto, vedere → visto, prendere → preso, mettere → messo, scrivere → scritto, leggere → letto, aprire → aperto, venire → venuto, essere → stato, nascere → nato, morire → morto, rimanere → rimasto, scegliere → scelto, chiedere → chiesto, rispondere → risposto.**
  it-imperfetto:
    meaning: "imperfetto"
    intro: |
      Позадина, навики, описи во минатото: **-avo, -avi, -ava, -avamo, -avate, -avano** (parlavo), **-evo** (credevo), **-ivo** (dormivo). **essere: ero, eri, era, eravamo, eravate, erano.** **Quando ero piccolo, giocavo sempre.** „Кога бев мал, секогаш играв.“ Се користи како македонското минато несвршено.
  it-direct-pron:
    meaning: "директни предметни заменки"
    intro: |
      **mi, ti, lo, la, ci, vi, li, le** пред менливиот глагол — како македонските **ме, те, го, ја**: **Lo conosco. La vedo domani.** Во passato prossimo партиципот се согласува со lo/la/li/le: **L'ho vista. Li ho comprati.** Се прилепуваат на инфинитиви и заповеди: **Voglio vederlo. Mangialo!**
  it-indirect-pron:
    meaning: "индиректни предметни заменки"
    intro: |
      **mi, ti, gli** (нему; разговорно и ним), **le** (нејзе; **Le** вам, официјално), **ci, vi, gli / loro**. **Gli scrivo una lettera. Le telefono domani.** Комбинирани со lo/la: **me lo, te la, glielo** (му/ѝ го: **Glielo do.**) — како македонското **му го давам**.
  it-ci-ne:
    meaning: "честичките ci (таму) и ne (од тоа)"
    intro: |
      **ci** = таму / за тоа: **Ci vado domani. Ci penso io.** „Јас ќе се погрижам.“ **ne** = од тоа / малку / оттаму: **Quanti ne vuoi? Ne voglio due. Non ne so niente. Me ne vado.** Мисли на македонското *таму, за тоа, од тоа*.
  it-reflexive:
    meaning: "повратни глаголи"
    intro: |
      **mi, ti, si, ci, vi, si** + глагол: **mi chiamo, ti alzi, si lava, ci vediamo**. Многу секојдневни глаголи: alzarsi, svegliarsi, vestirsi, divertirsi, sentirsi, ricordarsi. Минато со essere: **Mi sono divertita.**
  it-comparison:
    meaning: "компаратив и суперлатив"
    intro: |
      **più / meno … di** пред именка или заменка: **Marco è più alto di Luca.** **che** пред придавки, глаголи, предлози: **più bello che utile**. Суперлатив: **il più alto**; апсолутен **-issimo** (bellissimo „многу убав“). Неправилни: **migliore, peggiore, maggiore, minore; meglio, peggio**.
  it-futuro:
    meaning: "простото идно"
    intro: |
      **-erò, -erai, -erà, -eremo, -erete, -eranno** (parlare → parlerò; credere → crederò; dormire → dormirò). Неправилни основи: **sarò, avrò, andrò, farò, potrò, vorrò, dovrò, verrò, vedrò, berrò**. И за претпоставки: **Saranno le tre** (ќе да е околу три).
  it-stare-gerund:
    meaning: "stare + герунд; stare per"
    intro: |
      **stare + герунд** (-ando, -endo) за дејство во тек: **Sto mangiando.** „Јадам (токму сега).“ **Che cosa stai facendo?** **stare per** + инфинитив = само што не: **Sto per uscire.** Често се вели само **mangio**.
  it-modals:
    meaning: "potere, volere, dovere"
    intro: |
      **potere**: posso, puoi, può, possiamo, potete, possono. **volere**: voglio, vuoi, vuole, vogliamo, volete, vogliono. **dovere**: devo, devi, deve, dobbiamo, dovete, devono. **sapere** (знае да): so, sai, sa… **So nuotare.** „Знам да пливам.“ Плус гол инфинитив: **Posso entrare?**
  it-time-prep:
    meaning: "од, пред, за (време)"
    intro: |
      **da** + сегашно = од / веќе (сè уште трае): **Studio l'italiano da due anni.** „Учам италијански веќе две години.“ **fa** = пред (по бројот): **due anni fa.** **fra / tra** = за (иднина): **fra una settimana.**
