# Arabic text of the Italian course, B1–B2 — translated by AI (Claude) from the English (2026-10-20); comparisons with Portuguese are replaced by Arabic ones or dropped
topics:
  The subjunctive: "الالتماسي"
  Conditional and hypothesis: "الشرطي والافتراض"
  Relatives and the passive: "الموصول والمجهول"
  Past narrative: "السرد في الماضي"
  Commands and connectors: "الأمر وأدوات الربط"
  Compound tenses and the subjunctive: "الأزمنة المركبة والالتماسي"
  Implicit clauses: "الجمل الضمنية"
  Causatives and verbs with particles: "السببية والأفعال ذات الأدوات"
  Register: "مستوى الخطاب"
lessons:
  it-cong-pres:
    meaning: "الالتماسي الحاضر"
    intro: |
      بعد أفعال الرأي والرغبة والشك والشعور، وبعد أدوات كثيرة: **Penso che sia vero. Voglio che tu venga.** «أريد أن تأتي». **Spero che vada bene.** الصيغ: **-are → -i** (che io/tu/lui parli، parliamo، parliate، parlino)؛ **-ere/-ire → -a** (creda، dorma، finisca). والشاذ: **sia، abbia، vada، faccia، possa، voglia، debba، venga، dica، sappia، stia، dia.** وتستعمله الإيطالية حتى بعد *penso che* «أظن أنّ».
  it-cong-conj:
    meaning: "أدوات تتطلب الالتماسي"
    intro: |
      **benché، sebbene، nonostante** (مع أنّ)، **affinché، perché** (لكي)، **prima che** (قبل أن)، **a meno che (non)** (إلا إذا)، **purché، a condizione che** (شريطة أن)، **senza che** (دون أن): **Benché piova, esco. Te lo dico perché tu lo sappia.**
  it-cong-imp:
    meaning: "الالتماسي الناقص"
    intro: |
      **-assi، -assi، -asse، -assimo، -aste، -assero** (parlassi)، **-essi** (credessi)، **-issi** (dormissi). والشاذ: **fossi، dessi، stessi، facessi، dicessi، bevessi**. بعد فعل رئيسي ماضٍ (**Pensavo che fosse vero**) وفي جمل *se* للشرط غير الواقع (**Se avessi tempo…** «لو كان عندي وقت…»).
  it-condizionale:
    meaning: "الشرطي الحاضر"
    intro: |
      جذر المستقبل + **-ei، -esti، -ebbe، -emmo، -este، -ebbero**: parlerei، sarei، avrei، vorrei، potrei، dovrei، andrei، verrei. للطلب المهذب (**Vorrei un caffè** «أودّ قهوة»)، والنصيحة (**Dovresti riposare**)، والنتيجة غير الواقعة (**…comprerei una casa**)، والأخبار المنقولة (**Il ministro sarebbe malato** — «يُقال إنه مريض»).
  it-periodo-ipotetico:
    meaning: "جمل الشرط"
    intro: |
      الممكن: **se** + المضارع، المضارع/المستقبل (**Se piove, resto a casa**). والمحتمل: **se** + الالتماسي الناقص، الشرطي (**Se piovesse, resterei a casa**). والماضي غير الواقع: **se** + الالتماسي البعيد، الشرطي الماضي (**Se avessi saputo, sarei venuto** «لو عرفت لجئت»). ولا شرطي بعد *se* أبدًا.
  it-relatives:
    meaning: "أسماء الموصول"
    intro: |
      **che** = الذي / التي، فاعلًا أو مفعولًا مباشرًا: **il libro che leggo**. وبعد حرف الجر **cui**: **la ragazza con cui esco، la città in cui vivo**؛ و**il cui** = الذي … ـه (**l'autore il cui libro…**). و**il quale / la quale / i quali / le quali** بديل رسمي. و**chi** = من (**Chi dorme non piglia pesci** «من ينم لا يصطد سمكًا»).
  it-passive:
    meaning: "المبني للمجهول"
    intro: |
      **essere** + اسم المفعول (مطابقًا): **Il libro è stato scritto nel 1900.** و**venire** بدل *essere* في الأزمنة البسيطة للحدث: **La porta viene chiusa alle otto.** و**andare** + اسم المفعول = يجب أن يُ…: **Il modulo va compilato.** والفاعل بـ **da**: **scritto da Dante**.
  it-si-impersonale:
    meaning: "si غير الشخصية والمجهولة"
    intro: |
      **si** + الغائب = الناس / يُفعل: **In Italia si mangia bene.** «في إيطاليا يُؤكل جيدًا». **Qui si parla italiano. Si vendono case** (فعل جمع مع اسم جمع).
  it-trapassato:
    meaning: "الماضي البعيد"
    intro: |
      الماضي الناقص من **avere / essere** + اسم المفعول: **avevo mangiato، ero partito.** فعل سابق لفعل ماضٍ آخر، كـ«كان قد»: **Quando sono arrivato, il treno era già partito.**
  it-passato-remoto:
    meaning: "الماضي البعيد السردي (للتعرّف)"
    intro: |
      ماضي التاريخ والروايات وكلام الجنوب: **parlai، parlasti، parlò، parlammo، parlaste، parlarono**؛ **credetti / credei، dormii**. والشاذ: **fui، ebbi، feci، dissi، vidi، venni، presi، misi، scrissi، nacque، morì.** **Dante nacque a Firenze nel 1265.** «وُلد دانتي في فلورنسا سنة 1265». وفي الشمال يحلّ محلّه الماضي القريب في الكلام.
  it-imperativo:
    meaning: "الأمر"
    intro: |
      tu: **parla، credi، dormi**؛ voi: **parlate**؛ noi: **parliamo**. والنهي مع tu = **non** + المصدر: **Non parlare!** وLei الرسمية تستعمل الالتماسي: **Parli piano, per favore. Venga!** والصيغ القصيرة **va'، da'، fa'، sta'، di'** تضاعف صامت الضمير: **dimmi، fammi، vacci.**
  it-connectors:
    meaning: "أدوات الربط"
    intro: |
      **perciò، quindi، dunque** (لذلك)، **però، ma، tuttavia** (لكن، غير أنّ)، **invece** (بدلًا من ذلك، أما)، **anzi** (بل على العكس)، **infatti** (فعلًا، إذ — ليست للاستدراك!)، **mentre** (بينما)، **siccome** (بما أنّ).
  it-cong-passato:
    meaning: "الالتماسي الماضي"
    intro: |
      **abbia / sia** + اسم المفعول، لفعل سابق تحت فعل رئيسي حاضر: **Penso che abbia già mangiato. Mi dispiace che tu non sia venuto.** «يؤسفني أنك لم تأتِ».
  it-cong-trapassato:
    meaning: "الالتماسي البعيد"
    intro: |
      **avessi / fossi** + اسم المفعول: للشرط الماضي غير الواقع (**Se l'avessi saputo…** «لو كنت عرفت…») وللأفعال السابقة تحت فعل رئيسي ماضٍ (**Pensavo che fosse già arrivato**).
  it-cond-passato:
    meaning: "الشرطي الماضي؛ المستقبل في الماضي"
    intro: |
      **avrei / sarei** + اسم المفعول: **Sarei venuto, ma ero malato.** وتستعمله الإيطالية أيضًا للمستقبل منظورًا من الماضي: **Ha detto che sarebbe venuto** (قال إنه سيأتي).
  it-concordanza:
    meaning: "توافق الأزمنة"
    intro: |
      فعل رئيسي حاضر → التماسي حاضر / ماضٍ (**Penso che venga / sia venuto**)؛ وفعل رئيسي ماضٍ → التماسي ناقص / بعيد (**Pensavo che venisse / fosse venuto**)، أو شرطي ماضٍ لما يأتي بعدُ (**Pensavo che sarebbe venuto**).
  it-gerundio:
    meaning: "صيغة الحال بدل جملة"
    intro: |
      صيغة الحال (-ando / -endo) تنوب عن جملة زمان أو سبب أو وسيلة أو شرط: **Tornando a casa, ho visto Marco** (وأنا عائد إلى البيت). **Studiando, impari** (بالدراسة تتعلم). وصيغة الحال الماضية: **Avendo finito, sono uscito.** وفاعلها عادة فاعل الفعل الرئيسي.
  it-infinito-passato:
    meaning: "المصدر الماضي"
    intro: |
      **aver(e) / esser(e)** + اسم المفعول، بعد **dopo** وأفعال مثل *ricordare، pensare*: **Dopo aver mangiato, siamo usciti.** «بعد أن أكلنا خرجنا». **Dopo essere arrivata, mi ha chiamato.** **Mi ricordo di averlo visto.**
  it-participio-presente:
    meaning: "اسما الفاعل والمفعول صفتين"
    intro: |
      اسم المفعول يختصر الجمل (**Finita la lezione, siamo andati al bar** — بعد انتهاء الدرس…) ويعمل صفة (**un libro scritto bene**). واسم الفاعل بـ **-ante / -ente** صفة أو اسم: **interessante، cantante، studente، presidente**.
  it-fare-infinito:
    meaning: "fare / lasciare + المصدر"
    intro: |
      **fare + المصدر** = جعل شيئًا يُفعل أو جعل أحدًا يفعل: **Faccio riparare la macchina. Mi hai fatto ridere.** «أضحكتني». و**farsi + المصدر**: **Mi sono fatto tagliare i capelli.** و**lasciare + المصدر** = دع: **Lasciami parlare!** «دعني أتكلم!»
  it-pronominal-verbs:
    meaning: "أفعال مع ci وne"
    intro: |
      أفعال ثابتة مع أدوات، شائعة جدًا في الكلام: **andarsene** (ذهب: *me ne vado*)، **farcela** (تمكّن: *ce la faccio*)، **prendersela** (استاء: *non te la prendere*)، **cavarsela** (تدبّر أمره)، **volerci** (استغرق وقتًا: *ci vuole un'ora*)، **metterci** (أمضى وقتًا: *ci metto dieci minuti*)، **fregarsene** (لم يبالِ).
  it-lei:
    meaning: "الخطاب الرسمي"
    intro: |
      *أنت* الرسمية هي **Lei** مع فعل الغائب، وضمائرها كثيرًا ما تُكتب بحرف كبير: **Come sta? La ringrazio. Le posso offrire un caffè?** والجمع الرسمي اليوم **voi** (و**Loro** رسمية جدًا). والصفات تطابق الشخص الحقيقي: **Lei è stanco, signor Rossi?**
