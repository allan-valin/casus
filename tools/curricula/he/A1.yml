id: A1
topics:

- title: {en: Letters and sounds, pt: Letras e sons}
  lessons:
  - id: he-alefbet
    title: א ב ג … ך ם ן ף ץ
    meaning: {en: "the alphabet, right to left; final letters", pt: "o alfabeto, da direita para a esquerda; letras finais"}
    intro:
      en: |
        Hebrew is written right to left in 22 consonant letters. Five have a final form at the end of a word: **כ → ך, מ → ם, נ → ן, פ → ף, צ → ץ** (**מלך** king, **שלום** peace). **ב כ פ** are *b k p* or *v kh f* (a dot inside, the *dagesh*, makes them hard). **ש** is *sh* or *s*; **ח** and **כ** without dagesh are a throaty *kh*; **ע** and **א** are mostly silent today.
      pt: |
        O hebraico se escreve da direita para a esquerda, com 22 letras consoantes. Cinco têm forma final no fim da palavra: **כ → ך, מ → ם, נ → ן, פ → ף, צ → ץ** (**מלך** rei, **שלום** paz). **ב כ פ** soam *b k p* ou *v kh f* (um ponto dentro, o *dagesh*, as endurece). **ש** é *ch* ou *s*; **ח** e **כ** sem dagesh são um *kh* gutural (como o *j* espanhol); **ע** e **א** hoje quase não soam.
    examples:
    - ["שלום, מה שלומך?", "Hello, how are you?", "Olá, como vai?", "שלום"]
    match: {seq: [{re: "[ךםןףץ]$", pos: [noun, verb, adj]}]}
  - id: he-vowels
    title: ניקוד, כתיב מלא
    meaning: {en: "vowel points and full spelling", pt: "sinais vocálicos e escrita plena"}
    intro:
      en: |
        Vowels are dots and dashes under and over the letters (*niqqud*): **שָׁלוֹם**. They appear in children's books, poetry and the Bible; ordinary texts leave them out and write some vowels with **ו** (*o, u*) and **י** (*i*) instead — the full spelling: **שלום, דיבר, כתוב**. You learn to read words whole. The reader takes both.
      pt: |
        As vogais são pontos e traços sob e sobre as letras (*niqqud*): **שָׁלוֹם**. Aparecem em livros infantis, poesia e na Bíblia; os textos comuns as omitem e escrevem algumas vogais com **ו** (*o, u*) e **י** (*i*) — a escrita plena: **שלום, דיבר, כתוב**. Aprende-se a ler as palavras inteiras. O leitor aceita as duas formas.
    examples:
    - ["אני כותב מכתב.", "I'm writing a letter.", "Estou escrevendo uma carta.", "כותב"]
    match: {seq: [{re: "[וי]", pos: verb}]}

- title: {en: Nouns and gender, pt: Substantivos e gênero}
  lessons:
  - id: he-gender
    title: ילד, ילדה; בית, עיר
    meaning: {en: "two genders", pt: "dois gêneros"}
    intro:
      en: |
        Nouns are masculine or feminine. Feminine usually ends in **-ה** or **-ת** (**ילדה** girl, **מכונית** car, **בת** daughter); masculine is the rest (**ילד** boy, **בית** house). Some feminines have no ending: **עיר** (city), **ארץ** (land), body parts in pairs (**יד** hand, **רגל** leg).
      pt: |
        Os substantivos são masculinos ou femininos. O feminino em geral termina em **-ה** ou **-ת** (**ילדה** menina, **מכונית** carro, **בת** filha); o masculino é o resto (**ילד** menino, **בית** casa). Alguns femininos não têm terminação: **עיר** (cidade), **ארץ** (terra), partes do corpo que vêm em pares (**יד** mão, **רגל** perna).
    examples:
    - ["הילדה קוראת ספר.", "The girl is reading a book.", "A menina está lendo um livro.", "ילדה"]
    match: {seq: [{pos: noun, number: sg}]}
  - id: he-plural
    title: ילדים, ילדות
    meaning: {en: "the plural: -ים and -ות", pt: "o plural: -ים e -ות"}
    intro:
      en: |
        Masculine **-ים** (**ילד → ילדים**), feminine **-ות** (**ילדה → ילדות**, **מכונית → מכוניות**). Vowels inside often change (**ספר → ספרים** *sefer → sfarim*, **בית → בתים**) and some nouns take the "other" ending (**שולחן → שולחנות**, **אישה → נשים**). Pairs: **-יים** (**ידיים** hands, **שבועיים** two weeks).
      pt: |
        Masculino **-ים** (**ילד → ילדים**), feminino **-ות** (**ילדה → ילדות**, **מכונית → מכוניות**). As vogais internas muitas vezes mudam (**ספר → ספרים** *sefer → sfarim*, **בית → בתים**) e alguns nomes levam a terminação "do outro gênero" (**שולחן → שולחנות**, **אישה → נשים**). Pares: **-יים** (**ידיים** mãos, **שבועיים** duas semanas).
    examples:
    - ["הילדים משחקים בגן.", "The children are playing in the park.", "As crianças estão brincando no parque.", "ילדים"]
    match: {seq: [{pos: noun, number: pl}]}

- title: {en: Pronouns and the present, pt: Pronomes e presente}
  lessons:
  - id: he-pronouns
    title: אני, אתה, את, הוא, היא, אנחנו
    meaning: {en: "personal pronouns", pt: "pronomes pessoais"}
    intro:
      en: |
        **אני** (I), **אתה / את** (you, to a man / a woman), **הוא / היא** (he / she), **אנחנו** (we), **אתם / אתן** (you plural, masc. / fem.), **הם / הן** (they). *You* has a gender: speaking to a woman you say **את** and the verb is feminine.
      pt: |
        **אני** (eu), **אתה / את** (você, falando a um homem / a uma mulher), **הוא / היא** (ele / ela), **אנחנו** (nós), **אתם / אתן** (vocês, masc. / fem.), **הם / הן** (eles / elas). *Você* tem gênero: falando a uma mulher diz-se **את** e o verbo vai para o feminino.
    examples:
    - ["אנחנו סטודנטים.", "We are students.", "Somos estudantes.", "אנחנו"]
    match: {seq: [{word: [אני, אתה, את, הוא, היא, אנחנו, אתם, אתן, הם, הן], start: true}]}
    pool: [אני, אתה, את, הוא, היא, אנחנו, אתם, הם]
  - id: he-present
    title: לומד, לומדת, לומדים, לומדות
    meaning: {en: "the present tense: four forms", pt: "o presente: quatro formas"}
    intro:
      en: |
        The present has no persons, only gender and number: **לומד** (m. sg), **לומדת** (f. sg), **לומדים** (m. pl), **לומדות** (f. pl) — **אני / אתה / הוא לומד**, **אני / את / היא לומדת**. The pronoun is needed. Verbs are built on a root of three letters (**ל-מ-ד** learn, **כ-ת-ב** write), poured into patterns.
      pt: |
        O presente não tem pessoas, só gênero e número: **לומד** (m. sg.), **לומדת** (f. sg.), **לומדים** (m. pl.), **לומדות** (f. pl.) — **אני / אתה / הוא לומד**, **אני / את / היא לומדת**. O pronome é necessário. Os verbos se constroem sobre uma raiz de três letras (**ל-מ-ד** aprender, **כ-ת-ב** escrever), moldada em padrões.
    examples:
    - ["אני לומד עברית.", "I'm learning Hebrew.", "Estou aprendendo hebraico.", "לומד"]
    - ["היא גרה בירושלים.", "She lives in Jerusalem.", "Ela mora em Jerusalém.", "גרה"]
    match: {seq: [{pos: verb, tense: pres}]}
  - id: he-yesh
    title: יש, אין, יש לי
    meaning: {en: "there is, there isn't; I have", pt: "há, não há; eu tenho"}
    intro:
      en: |
        There is no *to be* in the present: **אני סטודנט** (I am a student), **הספר על השולחן**. **יש** = there is, **אין** = there isn't. *To have* is **יש ל-**: **יש לי אח** (I have a brother), **אין לי זמן** (I have no time).
      pt: |
        Não há *ser/estar* no presente: **אני סטודנט** (sou estudante), **הספר על השולחן** (o livro está sobre a mesa). **יש** = há, **אין** = não há. *Ter* é **יש ל-**: **יש לי אח** (tenho um irmão), **אין לי זמן** (não tenho tempo).
    examples:
    - ["יש לי אח ואחות.", "I have a brother and a sister.", "Tenho um irmão e uma irmã.", "יש"]
    - ["אין לי זמן.", "I have no time.", "Não tenho tempo.", "אין"]
    match: {seq: [{word: [יש, אין]}]}
    pool: [יש, אין, לי, לך, לו, לה, לנו]

- title: {en: Questions and negation, pt: Perguntas e negação}
  lessons:
  - id: he-questions
    title: מה, מי, איפה, מתי, למה, איך, כמה
    meaning: {en: "question words", pt: "palavras interrogativas"}
    intro:
      en: |
        **מה** (what), **מי** (who), **איפה** (where), **לאן** (where to), **מאיפה** (from where), **מתי** (when), **למה** (why), **איך** (how), **כמה** (how many, how much). Yes/no questions only change the voice, or start with **האם** in writing: **האם אתה בא?**
      pt: |
        **מה** (o que), **מי** (quem), **איפה** (onde), **לאן** (para onde), **מאיפה** (de onde), **מתי** (quando), **למה** (por quê), **איך** (como), **כמה** (quantos, quanto). Perguntas de sim/não só mudam a entonação, ou começam com **האם** na escrita: **האם אתה בא?**
    examples:
    - ["איפה אתה גר?", "Where do you live?", "Onde você mora?", "איפה"]
    match: {seq: [{word: [מה, מי, איפה, לאן, מאיפה, מתי, למה, איך, כמה, האם], start: true}]}
    pool: [מה, מי, איפה, מתי, למה, איך, כמה]
  - id: he-lo
    title: לא, אין, אף אחד
    meaning: {en: "negation", pt: "negação"}
    intro:
      en: |
        **לא** before the verb or adjective: **אני לא מבין** (I don't understand), **זה לא טוב**. **אין** negates *there is* and, formally, the present: **אינני יודע**. Double negation is normal: **אף אחד לא בא** (nobody came), **שום דבר** (nothing).
      pt: |
        **לא** antes do verbo ou do adjetivo: **אני לא מבין** (não entendo), **זה לא טוב** (isso não é bom). **אין** nega *há* e, no registro formal, o presente: **אינני יודע**. A dupla negação é normal: **אף אחד לא בא** (ninguém veio), **שום דבר** (nada).
    examples:
    - ["אני לא מבין.", "I don't understand.", "Não entendo.", "לא"]
    match: {seq: [{word: [לא]}, {pos: [verb, adj]}], gap: 0}
    pool: [לא, אין, אף, שום]

- title: {en: Prefixes and the article, pt: Prefixos e o artigo}
  lessons:
  - id: he-ha
    title: ה־, הילד, הספר הגדול
    meaning: {en: "the article ה and definite phrases", pt: "o artigo ה e expressões definidas"}
    intro:
      en: |
        **ה** (*the*) is written onto the word: **ילד** a boy → **הילד** the boy. There is no *a*. An adjective after a definite noun takes **ה** too: **הספר הגדול** (the big book); without it, it is a sentence: **הספר גדול** (the book is big).
      pt: |
        **ה** (*o, a*) se escreve junto à palavra: **ילד** um menino → **הילד** o menino. Não existe *um/uma*. O adjetivo depois de um nome definido também leva **ה**: **הספר הגדול** (o livro grande); sem ele, é uma frase: **הספר גדול** (o livro é grande).
    examples:
    - ["הספר הגדול על השולחן.", "The big book is on the table.", "O livro grande está sobre a mesa.", "הגדול"]
    match: {seq: [{word: [ה]}, {pos: noun}], gap: 0}
  - id: he-prefixes
    title: ו, ב, ל, מ, כ, ש
    meaning: {en: "one-letter words written onto the next", pt: "palavras de uma letra escritas junto à seguinte"}
    intro:
      en: |
        **ו** (and), **ב** (in, at), **ל** (to, for), **מ** (from), **כ** (as, like), **ש** (that, who) are written onto the next word: **ובית** (and a house), **בבית** (in the house), **לירושלים** (to Jerusalem), **מתל אביב** (from Tel Aviv). After **ב, ל, כ** the article melts in: **ב + הבית → בבית**. Several can stack: **וכשהגעתי** = and + when + I arrived.
      pt: |
        **ו** (e), **ב** (em), **ל** (para), **מ** (de), **כ** (como), **ש** (que) se escrevem junto à palavra seguinte: **ובית** (e uma casa), **בבית** (na casa), **לירושלים** (para Jerusalém), **מתל אביב** (de Tel Aviv). Depois de **ב, ל, כ** o artigo se funde: **ב + הבית → בבית**. Vários podem se empilhar: **וכשהגעתי** = e + quando + cheguei.
    examples:
    - ["אבא נוסע לעבודה באוטובוס.", "Dad goes to work by bus.", "O papai vai para o trabalho de ônibus.", "לעבודה"]
    match: {seq: [{word: [ו, ב, ל, מ, כ, ש]}, {pos: [noun, verb, pron]}], gap: 0}
    pool: [ו, ב, ל, מ, כ, ש]
  - id: he-et
    title: את הספר
    meaning: {en: "את: the definite direct object", pt: "את: o objeto direto definido"}
    intro:
      en: |
        Before a *definite* direct object Hebrew puts **את**: **אני קורא את הספר** (I'm reading the book) — but **אני קורא ספר** (a book). Names are definite: **ראיתי את דוד**. With pronouns it fuses: **אותי, אותך, אותו, אותה** (me, you, him, her).
      pt: |
        Antes de um objeto direto *definido* o hebraico põe **את**: **אני קורא את הספר** (estou lendo o livro) — mas **אני קורא ספר** (um livro). Nomes próprios são definidos: **ראיתי את דוד** (vi o Davi). Com pronomes se funde: **אותי, אותך, אותו, אותה** (me, te, o, a).
    examples:
    - ["אני קורא את הספר.", "I'm reading the book.", "Estou lendo o livro.", "את"]
    match: {seq: [{word: [את]}, {word: [ה]}], gap: 0}
    pool: [את, אותי, אותך, אותו, אותה]
  - id: he-shel
    title: של, שלי, שלך
    meaning: {en: "possession: of, my, your", pt: "posse: de, meu, seu"}
    intro:
      en: |
        **של** (of) after the thing owned, with the article: **הספר של דוד** (David's book). With a pronoun: **שלי, שלך (m.), שלך (f.), שלו, שלה, שלנו, שלכם, שלהם**: **הבית שלי** (my house). Literary Hebrew adds the ending to the noun instead: **ביתי** (my house).
      pt: |
        **של** (de) depois da coisa possuída, com artigo: **הספר של דוד** (o livro do Davi). Com pronome: **שלי, שלך (m.), שלך (f.), שלו, שלה, שלנו, שלכם, שלהם**: **הבית שלי** (minha casa). O hebraico literário põe a terminação no próprio nome: **ביתי** (minha casa).
    examples:
    - ["זה הבית שלי.", "This is my house.", "Esta é a minha casa.", "שלי"]
    match: {seq: [{word: [של, שלי, שלך, שלו, שלה, שלנו, שלכם, שלהם]}]}
    pool: [של, שלי, שלך, שלו, שלה, שלנו]

- title: {en: Numbers and time, pt: Números e tempo}
  lessons:
  - id: he-numbers
    title: אחת, שתיים, שלוש … עשר
    meaning: {en: "numbers have gender", pt: "os números têm gênero"}
    intro:
      en: |
        Counting and with feminine nouns: **אחת, שתיים (שתי), שלוש, ארבע, חמש, שש, שבע, שמונה, תשע, עשר**; with masculine nouns: **אחד, שניים (שני), שלושה, ארבעה … עשרה**. **שלוש בנות, שלושה בנים.** **אחד** follows the noun (**ילד אחד**), the others precede it.
      pt: |
        Para contar e com nomes femininos: **אחת, שתיים (שתי), שלוש, ארבע, חמש, שש, שבע, שמונה, תשע, עשר**; com masculinos: **אחד, שניים (שני), שלושה, ארבעה … עשרה**. **שלוש בנות** (três filhas), **שלושה בנים** (três filhos). **אחד** vem depois do nome (**ילד אחד**), os outros antes.
    examples:
    - ["יש לי שני אחים.", "I have two brothers.", "Tenho dois irmãos.", "שני"]
    match: {seq: [{word: [אחד, אחת, שניים, שתיים, שני, שתי, שלוש, שלושה, ארבע, ארבעה, חמש, חמישה, שש, שישה, שבע, שבעה, שמונה, תשע, תשעה, עשר, עשרה]}]}
    pool: [אחד, אחת, שני, שתי, שלוש, שלושה, עשר]
  - id: he-days
    title: יום ראשון, היום, מחר
    meaning: {en: "days and time words", pt: "dias e palavras de tempo"}
    intro:
      en: |
        The week starts on Sunday and the days are counted: **יום ראשון** (Sunday, "first day"), **שני, שלישי, רביעי, חמישי, שישי**, and **שבת**. **היום** (today), **מחר** (tomorrow), **אתמול** (yesterday), **עכשיו** (now), **בבוקר, בערב** (in the morning, in the evening).
      pt: |
        A semana começa no domingo e os dias são contados: **יום ראשון** (domingo, "primeiro dia"), **שני, שלישי, רביעי, חמישי, שישי**, e **שבת** (sábado). **היום** (hoje), **מחר** (amanhã), **אתמול** (ontem), **עכשיו** (agora), **בבוקר, בערב** (de manhã, à noite).
    examples:
    - ["היום יום ראשון.", "Today is Sunday.", "Hoje é domingo.", "ראשון"]
    match: {seq: [{word: [היום, מחר, אתמול, עכשיו, שבת, ראשון, שלישי, רביעי, חמישי, שישי, בוקר, ערב]}]}
    pool: [היום, מחר, אתמול, עכשיו, שבת]
