# Macedonian text of the Hebrew course, A1–A2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Letters and sounds: "Букви и гласови"
  Nouns and gender: "Именки и род"
  Pronouns and the present: "Заменки и сегашно време"
  Questions and negation: "Прашања и негација"
  Prefixes and the article: "Префикси и членот"
  Numbers and time: "Броеви и време"
  Past and future: "Минато и идно време"
  Adjectives and the construct: "Придавки и конструктна состојба"
  Prepositions with endings: "Предлози со наставки"
  Verb patterns: "Глаголски обрасци"
lessons:
  he-alefbet:
    meaning: "азбуката, оддесно налево; крајни букви"
    intro: |
      Хебрејскиот се пишува оддесно налево со 22 букви за согласки. Пет имаат крајна форма на крајот од зборот: **כ → ך, מ → ם, נ → ן, פ → ף, צ → ץ** (**מלך** цар, **שלום** мир). **ב כ פ** се *б к п* или *в х ф* (точка внатре, *дагеш*, ги прави тврди). **ש** е *ш* или *с*; **ח** и **כ** без дагеш се грлено *х*; **ע** и **א** денес главно не се изговараат.
  he-vowels:
    meaning: "вокални знаци и полно пишување"
    intro: |
      Самогласките се точки и цртички под и над буквите (*никуд*): **שָׁלוֹם**. Ги има во детски книги, поезија и во Библијата; обичните текстови ги изоставаат и некои самогласки ги пишуваат со **ו** (*о, у*) и **י** (*и*) — полното пишување: **שלום, דיבר, כתוב**. Зборовите се учат да се читаат цели. Читачот ги прима двата начина.
  he-gender:
    meaning: "два рода"
    intro: |
      Именките се од машки или женски род. Женскиот обично завршува на **-ה** или **-ת** (**ילדה** девојче, **מכונית** автомобил, **בת** ќерка); машкиот е останатото (**ילד** момче, **בית** куќа). Некои женски немаат наставка: **עיר** (град), **ארץ** (земја), парни делови од телото (**יד** рака, **רגל** нога).
  he-plural:
    meaning: "множина: -ים и -ות"
    intro: |
      Машки **-ים** (**ילד → ילדים**), женски **-ות** (**ילדה → ילדות**, **מכונית → מכוניות**). Самогласките внатре често се менуваат (**ספר → ספרים** *сефер → сфарим*, **בית → בתים**), а некои именки земаат „другата“ наставка (**שולחן → שולחנות**, **אישה → נשים**). Парови: **-יים** (**ידיים** раце, **שבועיים** две недели).
  he-pronouns:
    meaning: "лични заменки"
    intro: |
      **אני** (јас), **אתה / את** (ти, на маж / на жена), **הוא / היא** (тој / таа), **אנחנו** (ние), **אתם / אתן** (вие, м. / ж.), **הם / הן** (тие). *Ти* има род: на жена ѝ се вели **את** и глаголот е во женски род.
  he-present:
    meaning: "сегашно време: четири форми"
    intro: |
      Сегашното време нема лица, само род и број: **לומד** (м. ед.), **לומדת** (ж. ед.), **לומדים** (м. мн.), **לומדות** (ж. мн.) — **אני / אתה / הוא לומד**, **אני / את / היא לומדת**. Заменката е потребна. Глаголите се градат на корен од три букви (**ל-מ-ד** учи, **כ-ת-ב** пишува), вметнат во обрасци.
  he-yesh:
    meaning: "има, нема; јас имам"
    intro: |
      Во сегашно време нема *сум*: **אני סטודנט** (јас сум студент), **הספר על השולחן** (книгата е на масата). **יש** = има, **אין** = нема. *Имам* е **יש ל-**: **יש לי אח** (имам брат), **אין לי זמן** (немам време).
  he-questions:
    meaning: "прашални зборови"
    intro: |
      **מה** (што), **מי** (кој), **איפה** (каде), **לאן** (накаде), **מאיפה** (од каде), **מתי** (кога), **למה** (зошто), **איך** (како), **כמה** (колку). Прашањата да/не само ја менуваат интонацијата или, во писмото, почнуваат со **האם**: **האם אתה בא?**
  he-lo:
    meaning: "негација"
    intro: |
      **לא** пред глаголот или придавката: **אני לא מבין** (не разбирам), **זה לא טוב**. **אין** го негира *има* и, во официјален стил, сегашното време: **אינני יודע**. Двојната негација е нормална: **אף אחד לא בא** (никој не дојде), **שום דבר** (ништо).
  he-ha:
    meaning: "членот ה и определени изрази"
    intro: |
      **ה** (членот) се пишува на зборот — напред, не назад како во македонскиот: **ילד** момче → **הילד** момчето. Неопределен член нема. Придавка по определена именка исто зема **ה**: **הספר הגדול** (големата книга); без него е реченица: **הספר גדול** (книгата е голема).
  he-prefixes:
    meaning: "еднобуквени зборови споени со следниот"
    intro: |
      **ו** (и), **ב** (во), **ל** (на, за), **מ** (од), **כ** (како), **ש** (што, дека) се пишуваат на следниот збор: **ובית** (и куќа), **בבית** (во куќата), **לירושלים** (во Ерусалим), **מתל אביב** (од Тел Авив). По **ב, ל, כ** членот се слева: **ב + הבית → בבית**. Повеќе можат да се натрупаат: **וכשהגעתי** = и + кога + стигнав.
  he-et:
    meaning: "את: определен директен објект"
    intro: |
      Пред *определен* директен објект хебрејскиот става **את**: **אני קורא את הספר** (ја читам книгата) — но **אני קורא ספר** (читам книга). Имињата се определени: **ראיתי את דוד** (го видов Давид). Со заменки се спојува: **אותי, אותך, אותו, אותה** (ме, те, го, ја).
  he-shel:
    meaning: "припадност: на, мој, твој"
    intro: |
      **של** (на) по поседуваното, со член: **הספר של דוד** (книгата на Давид). Со заменка: **שלי, שלך (м.), שלך (ж.), שלו, שלה, שלנו, שלכם, שלהם**: **הבית שלי** (мојата куќа). Литературниот хебрејски ја става наставката на самата именка: **ביתי** (мојата куќа).
  he-numbers:
    meaning: "броевите имаат род"
    intro: |
      За броење и со именки од женски род: **אחת, שתיים (שתי), שלוש, ארבע, חמש, שש, שבע, שמונה, תשע, עשר**; со машки: **אחד, שניים (שני), שלושה, ארבעה … עשרה**. **שלוש בנות** (три ќерки), **שלושה בנים** (три сина). **אחד** стои по именката (**ילד אחד**), другите пред неа.
  he-days:
    meaning: "денови и зборови за време"
    intro: |
      Неделата почнува во недела, а деновите се бројат: **יום ראשון** (недела, „прв ден“), **שני, שלישי, רביעי, חמישי, שישי** и **שבת** (сабота). **היום** (денеска), **מחר** (утре), **אתמול** (вчера), **עכשיו** (сега), **בבוקר, בערב** (наутро, навечер).
  he-past:
    meaning: "минато време: наставки"
    intro: |
      Минатото додава наставки за лице, број и род: **כתבתי** (напишав), **כתבת** (ти, м.), **כתבת** (ти, ж.), **כתב** (тој), **כתבה** (таа), **כתבנו** (ние), **כתבתם / כתבתן** (вие), **כתבו** (тие). Заменката често се изостава: **כתבתי מכתב** (напишав писмо). *Бев* е **הייתי, היית, היה, הייתה…**.
  he-future:
    meaning: "идно време: префикси"
    intro: |
      Идното време додава префикси (и некои наставки): **אכתוב** (ќе напишам), **תכתוב** (ти, м. / таа), **תכתבי** (ти, ж.), **יכתוב** (тој), **נכתוב** (ние), **תכתבו** (вие), **יכתבו** (тие). Служи и како учтива заповед: **תכתוב לי** (пиши ми). Блиска иднина: **אני הולך לכתוב**.
  he-imperative:
    meaning: "императив"
    intro: |
      Од идното време без префиксот: **תכתוב → כתוב!**, **תשבי → שבי!** (седни, на жена), **תבואו → בואו!** (дојдете). Одречните заповеди со **אל** + идно: **אל תדאג** (не грижи се). Во говорот обичното идно е помеко: **תשב, בבקשה** (седни, те молам).
  he-adj:
    meaning: "придавките стојат по именката и се согласуваат"
    intro: |
      Придавките стојат по именката и се согласуваат по род, број и определеност: **ילד טוב, ילדה טובה, ילדים טובים, ילדות טובות; הילד הטוב.** Споредба: **יותר / פחות … מ-** (**גדול יותר מ…** поголем од), суперлатив **הכי** (**הכי טוב** најдобар) или **ביותר** во писмото.
  he-smikhut:
    meaning: "конструктна состојба: именка + именка"
    intro: |
      Две именки една по друга прават една: првата, во *конструктна* форма, значи *X на*: **בית ספר** (училиште, „куќа на книга“), **עוגת שוקולד** (чоколадна торта; **עוגה → עוגת**), **ילדי השכונה** (децата од маалото; **ילדים → ילדי**). Членот оди само на втората именка: **בית הספר** (училиштето).
  he-prep-suffix:
    meaning: "предлозите земаат заменски наставки"
    intro: |
      Предлогот не стои пред заменка; зема наставка: **ל → לי, לך, לו, לה, לנו, לכם, להם** (ми, ти…), **עם → איתי, איתך, איתו** (со мене…), **אצל → אצלי** (кај мене), **על → עליי, עליו**, **של → שלי**. **תן לי** (дај ми), **בוא איתי** (дојди со мене).
  he-binyanim:
    meaning: "седумте бињаним"
    intro: |
      Истиот корен влегува во седум обрасци (*бињаним*), секој со своја конјугација и типично значење: **פעל** (обично: **כתב** напиша), **פיעל** (интензивно: **דיבר** зборуваше), **הפעיל** (каузативно: **הסביר** објасни), **התפעל** (повратно: **התלבש** се облече), **נפעל** (пасив од паал: **נכתב** беше напишан) и пасивите **פועל, הופעל**. Учете го секој глагол со неговиот бињан.
