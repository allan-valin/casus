# Arabic text of the Hebrew course, A1–A2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Letters and sounds: "الحروف والأصوات"
  Nouns and gender: "الأسماء والجنس"
  Pronouns and the present: "الضمائر والمضارع"
  Questions and negation: "الأسئلة والنفي"
  Prefixes and the article: "السوابق وأداة التعريف"
  Numbers and time: "الأعداد والزمن"
  Past and future: "الماضي والمستقبل"
  Adjectives and the construct: "الصفات والإضافة"
  Prepositions with endings: "حروف الجر مع الضمائر المتصلة"
  Verb patterns: "أوزان الفعل"
lessons:
  he-alefbet:
    meaning: "الأبجدية من اليمين إلى اليسار؛ الحروف الأخيرة"
    intro: |
      تُكتب العبرية من اليمين إلى اليسار باثنين وعشرين حرفًا صامتًا — أبجدية أخت للعربية. لخمسة منها شكل خاص في آخر الكلمة: **כ → ך، מ → ם، נ → ן، פ → ף، צ → ץ** (**מלך** مَلِك، **שלום** سلام). **ב כ פ** تُنطق *b k p* أو *v kh f* (النقطة داخلها، *الداغيش*، تجعلها شديدة). **ש** شين أو سين؛ **ח** و**כ** بلا داغيش خاء؛ و**ע** و**א** صامتتان في الغالب اليوم.
  he-vowels:
    meaning: "علامات الحركات والكتابة التامة"
    intro: |
      الحركات نقاط وخطوط تحت الحروف وفوقها (*النيقود*) كالتشكيل العربي: **שָׁלוֹם**. تظهر في كتب الأطفال والشعر والتوراة؛ والنصوص العادية تحذفها وتكتب بعض الحركات بـ**ו** (*o, u*) و**י** (*i*) — الكتابة التامة: **שלום, דיבר, כתוב**. يتعلّم المرء قراءة الكلمة كاملة. والقارئ يقبل الطريقتين.
  he-gender:
    meaning: "جنسان"
    intro: |
      الأسماء مذكّرة أو مؤنّثة. المؤنّث ينتهي غالبًا بـ**-ה** أو **-ת** (**ילדה** بنت، **מכונית** سيارة، **בת** ابنة)، والمذكّر ما سواه (**ילד** ولد، **בית** بيت). وبعض المؤنّثات بلا علامة: **עיר** (مدينة)، **ארץ** (أرض)، وأعضاء الجسم المزدوجة (**יד** يد، **רגל** رِجل).
  he-plural:
    meaning: "الجمع: -ים و-ות"
    intro: |
      المذكّر **-ים** (**ילד → ילדים**)، والمؤنّث **-ות** (**ילדה → ילדות**، **מכונית → מכוניות**). تتغيّر الحركات الداخلية كثيرًا (**ספר → ספרים** *sefer → sfarim*، **בית → בתים**)، وبعض الأسماء تأخذ نهاية «الجنس الآخر» (**שולחן → שולחנות**، **אישה → נשים**). والمثنّى **-יים** (**ידיים** يدان، **שבועיים** أسبوعان).
  he-pronouns:
    meaning: "الضمائر الشخصية"
    intro: |
      **אני** (أنا)، **אתה / את** (أنتَ / أنتِ)، **הוא / היא** (هو / هي)، **אנחנו** (نحن)، **אתם / אתן** (أنتم / أنتنّ)، **הם / הן** (هم / هنّ). كما في العربية، للمخاطَب جنس: تقول للمرأة **את** ويكون الفعل مؤنّثًا.
  he-present:
    meaning: "المضارع: أربع صيغ"
    intro: |
      المضارع بلا أشخاص، فيه الجنس والعدد فقط (هو في الأصل اسم فاعل): **לומד** (مفرد مذكّر)، **לומדת** (مفرد مؤنّث)، **לומדים** (جمع مذكّر)، **לומדות** (جمع مؤنّث) — **אני / אתה / הוא לומד**، **אני / את / היא לומדת**. والضمير لازم. والأفعال مبنية على جذر ثلاثي (**ל-מ-ד** تعلّم، **כ-ת-ב** كتب) يُصبّ في أوزان، كما في العربية.
  he-yesh:
    meaning: "يوجد، لا يوجد؛ عندي"
    intro: |
      لا فعل *كان* في الحاضر، كالجملة الاسمية في العربية: **אני סטודנט** (أنا طالب)، **הספר על השולחן** (الكتاب على الطاولة). **יש** = يوجد، **אין** = لا يوجد. و*الملكية* **יש ל-**: **יש לי אח** (لي أخ)، **אין לי זמן** (ليس لي وقت).
  he-questions:
    meaning: "أدوات الاستفهام"
    intro: |
      **מה** (ماذا)، **מי** (مَن)، **איפה** (أين)، **לאן** (إلى أين)، **מאיפה** (من أين)، **מתי** (متى)، **למה** (لماذا)، **איך** (كيف)، **כמה** (كم). أسئلة نعم/لا تكتفي بالنبرة، أو تبدأ كتابةً بـ**האם** (هل): **האם אתה בא?**
  he-lo:
    meaning: "النفي"
    intro: |
      **לא** قبل الفعل أو الصفة: **אני לא מבין** (لا أفهم)، **זה לא טוב**. و**אין** تنفي *يوجد* وتنفي الحاضر في الأسلوب الرسمي: **אינני יודע**. والنفي المزدوج طبيعي: **אף אחד לא בא** (لم يأتِ أحد)، **שום דבר** (لا شيء).
  he-ha:
    meaning: "أداة التعريف ה والتعريف"
    intro: |
      **ה** (أل التعريف) تُكتب متصلة بالكلمة: **ילד** ولد → **הילד** الولد. ولا أداة للتنكير. والصفة بعد اسم معرّف تأخذ **ה** أيضًا، كالعربية: **הספר הגדול** (الكتاب الكبير)؛ وبدونها تكون جملة: **הספר גדול** (الكتاب كبير).
  he-prefixes:
    meaning: "كلمات من حرف واحد تتصل بما بعدها"
    intro: |
      **ו** (و)، **ב** (في، بـ)، **ל** (لـ، إلى)، **מ** (من)، **כ** (كـ)، **ש** (الذي، أنّ) تُكتب متصلة بالكلمة التالية، كحروف العربية المتصلة: **ובית** (وبيت)، **בבית** (في البيت)، **לירושלים** (إلى القدس)، **מתל אביב** (من تل أبيب). وبعد **ב، ל، כ** تذوب أداة التعريف: **ב + הבית → בבית**. وقد تتراكم: **וכשהגעתי** = و + عندما + وصلت.
  he-et:
    meaning: "את: المفعول به المعرّف"
    intro: |
      قبل المفعول به *المعرّف* تضع العبرية **את**: **אני קורא את הספר** (أقرأ الكتاب) — لكن **אני קורא ספר** (أقرأ كتابًا). وأسماء العلم معرّفة: **ראיתי את דוד** (رأيت داود). ومع الضمائر تندمج: **אותי، אותך، אותו، אותה** (إيّاي، إيّاك، إيّاه، إيّاها).
  he-shel:
    meaning: "الملكية: لـ، لي، لك"
    intro: |
      **של** (لـ) بعد الشيء المملوك، مع أداة التعريف: **הספר של דוד** (كتاب داود). ومع الضمير: **שלי، שלך (م)، שלך (ؤ)، שלו، שלה، שלנו، שלכם، שלהם**: **הבית שלי** (بيتي). والعبرية الأدبية تضع الضمير على الاسم نفسه كالعربية: **ביתי** (بيتي).
  he-numbers:
    meaning: "للأعداد جنس"
    intro: |
      للعدّ ومع الأسماء المؤنّثة: **אחת، שתיים (שתי)، שלוש، ארבע، חמש، שש، שבע، שמונה، תשע، עשר**؛ ومع المذكّرة: **אחד، שניים (שני)، שלושה، ארבעה … עשרה** — المذكّر بالتاء كما في العربية. **שלוש בנות** (ثلاث بنات)، **שלושה בנים** (ثلاثة أبناء). **אחד** يأتي بعد الاسم (**ילד אחד**)، والبقية قبله.
  he-days:
    meaning: "الأيام وكلمات الزمن"
    intro: |
      يبدأ الأسبوع يوم الأحد والأيام معدودة: **יום ראשון** (الأحد، «اليوم الأول»)، **שני، שלישי، רביעי، חמישי، שישי**، و**שבת** (السبت). **היום** (اليوم)، **מחר** (غدًا)، **אתמול** (أمس)، **עכשיו** (الآن)، **בבוקר، בערב** (صباحًا، مساءً).
  he-past:
    meaning: "الماضي: لواحق"
    intro: |
      يضيف الماضي لواحق للشخص والعدد والجنس، كالعربية: **כתבתי** (كتبتُ)، **כתבת** (كتبتَ)، **כתבת** (كتبتِ)، **כתב** (كتب)، **כתבה** (كتبت)، **כתבנו** (كتبنا)، **כתבתם / כתבתן** (كتبتم / كتبتنّ)، **כתבו** (كتبوا). والضمير يُحذف غالبًا: **כתבתי מכתב**. و*كان* **הייתי، היית، היה، הייתה…**.
  he-future:
    meaning: "المستقبل: سوابق"
    intro: |
      يضيف المستقبل سوابق (وبعض اللواحق)، كالمضارع العربي: **אכתוב** (سأكتب)، **תכתוב** (ستكتب / ستكتب هي)، **תכתבי** (ستكتبين)، **יכתוב** (سيكتب)، **נכתוב** (سنكتب)، **תכתבו** (ستكتبون)، **יכתבו** (سيكتبون). ويُستعمل أمرًا مهذّبًا: **תכתוב לי** (اكتب لي). والمستقبل القريب: **אני הולך לכתוב**.
  he-imperative:
    meaning: "الأمر"
    intro: |
      من المستقبل بلا سابقة: **תכתוב → כתוב!**، **תשבי → שבי!** (اجلسي)، **תבואו → בואו!** (تعالوا). والنهي **אל** + المستقبل: **אל תדאג** (لا تقلق). وفي الكلام المستقبل البسيط ألطف: **תשב, בבקשה** (اجلس من فضلك).
  he-adj:
    meaning: "الصفة تتبع الموصوف وتطابقه"
    intro: |
      الصفة بعد الاسم وتطابقه في الجنس والعدد والتعريف، كالعربية: **ילד טוב، ילדה טובה، ילדים טובים، ילדות טובות؛ הילד הטוב.** والتفضيل **יותר / פחות … מ-** (**גדול יותר מ…** أكبر من)، والأفعل **הכי** (**הכי טוב** الأفضل) أو **ביותר** كتابةً.
  he-smikhut:
    meaning: "الإضافة: اسم + اسم"
    intro: |
      اسمان متتاليان يصيران واحدًا، كالإضافة العربية: الأول في *صيغة الإضافة* يعني *X الـ…*: **בית ספר** (مدرسة، «بيت كتاب»)، **עוגת שוקולד** (كعكة شوكولاتة؛ **עוגה → עוגת**)، **ילדי השכונה** (أولاد الحيّ؛ **ילדים → ילדי**). وأداة التعريف على المضاف إليه فقط: **בית הספר** (المدرسة).
  he-prep-suffix:
    meaning: "حروف الجر تأخذ الضمائر المتصلة"
    intro: |
      حرف الجر لا يسبق ضميرًا منفصلًا بل يأخذ ضميرًا متصلًا، كالعربية: **ל → לי، לך، לו، לה، לנו، לכם، להם** (لي، لك…)، **עם → איתי، איתך، איתו** (معي…)، **אצל → אצלי** (عندي)، **על → עליי، עליו**، **של → שלי**. **תן לי** (أعطني)، **בוא איתי** (تعال معي).
  he-binyanim:
    meaning: "الأوزان السبعة"
    intro: |
      الجذر نفسه يدخل في سبعة أوزان (*بنيانيم*)، كأوزان الفعل العربي، لكلّ منها تصريف ومعنى غالب: **פעל** (المجرّد: **כתב** كتب)، **פיעל** (التضعيف: **דיבר** تكلّم)، **הפעיל** (السببي: **הסביר** شرح)، **התפעל** (الانعكاسي: **התלבש** لبس)، **נפעל** (مطاوع الأول: **נכתב** كُتب)، والمجهولان **פועל، הופעל**. احفظ كل فعل مع وزنه.
