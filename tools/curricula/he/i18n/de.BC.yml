# German text of the Hebrew course, B1–C2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Infinitive and modal verbs: "Infinitiv und Modalverben"
  Clauses: "Nebensätze"
  The passive: "Das Passiv"
  Endings on nouns: "Endungen am Nomen"
  Roots and patterns: "Wurzeln und Muster"
  Register: "Register"
  Talking about ideas: "Über Ideen sprechen"
  Older layers and style: "Ältere Schichten und Stil"
lessons:
  he-infinitive:
    meaning: "der Infinitiv mit ל"
    intro: |
      Der Infinitiv beginnt mit **ל**: **לכתוב, לדבר, להסביר, להתלבש**. Nach **רוצה** (wollen), **יכול** (können), **צריך** (müssen), **אוהב** (mögen), **מתחיל** (anfangen): **אני רוצה ללמוד**. Unpersönlich **צריך, אפשר, אסור, מותר** + Infinitiv: **אסור לעשן** (Rauchen verboten).
  he-she:
    meaning: "dass, der, die: ש"
    intro: |
      **ש** (ans nächste Wort geschrieben) ist *dass, der, die, das*: **הספר שקראתי** (das Buch, das ich gelesen habe), **אני יודע שהוא בא** (ich weiß, dass er kommt). **אשר** ist die förmliche Form. Ein Pronomen kann im Satz bleiben: **הבית שגרתי בו** (das Haus, in dem ich wohnte, „in ihm“).
  he-conjunctions:
    meaning: "Sätze verbinden"
    intro: |
      **כי** (weil; dass), **אם** (wenn; ob), **כש-** (als, wenn), **לפני ש- / אחרי ש-** (bevor / nachdem), **למרות ש-** (obwohl), **בגלל ש-** (weil), **לכן** (deshalb), **אבל** (aber), **או** (oder). **אני הולך הביתה כי אני עייף** (ich gehe nach Hause, weil ich müde bin).
  he-conditional:
    meaning: "Bedingungen: real und irreal"
    intro: |
      Real: **אם** + Futur oder Präsens: **אם ירד גשם, נישאר בבית** (wenn es regnet, bleiben wir zu Hause). Irreal: **אילו / לו** + **היה** + Partizip und **היה** + Partizip in der Folge: **אילו היה לי זמן, הייתי בא** (wenn ich Zeit hätte, käme ich). **הייתי רוצה** = ich möchte.
  he-passive:
    meaning: "passive Binjanim"
    intro: |
      Jeder aktive Binjan hat ein Passiv: **פעל → נפעל** (**נכתב** wurde geschrieben), **פיעל → פועל** (**סופר** wurde erzählt), **הפעיל → הופעל** (**הוסבר** wurde erklärt). Der Urheber mit **על ידי**: **הספר נכתב על ידי עגנון** (das Buch wurde von Agnon geschrieben). In der Rede ist ein unpersönlicher Plural häufig: **אומרים ש…** (man sagt, dass…).
  he-noun-suffix:
    meaning: "Possessivendungen am Nomen"
    intro: |
      Geschriebenes und förmliches Hebräisch hängt *mein, dein…* ans Nomen selbst (an seine Konstruktform): **בית → ביתי** (mein Haus), **ביתך, ביתו, ביתה, ביתנו**; Nomen im Plural **ספריי, ספריו** (meine Bücher, seine Bücher). Die Rede bevorzugt **הבית שלי**, aber Familienwörter behalten die Endungen: **אחי** (mein Bruder), **אבי** (mein Vater), **בעלי** (mein Mann).
  he-mishkalim:
    meaning: "eine Wurzel, viele Wörter"
    intro: |
      Auch Nomen folgen Mustern (*Mischkalim*) um die Wurzel: **כ-ת-ב** → **מכתב** (Brief), **כתיבה** (Schreiben), **כתובת** (Adresse), **כתב** (Reporter). **מ-** bildet oft Orte und Werkzeuge (**מטבח** Küche, **מפתח** Schlüssel), **-ה** nach **i** Handlungen (**קריאה** Lesen), **-ות** Abstrakta (**ילדות** Kindheit). Wer die Wurzel kennt, errät das Wort.
  he-gerund:
    meaning: "Verbalnomen"
    intro: |
      Jeder Binjan hat sein Verbalnomen (*Schem Pe'ula*): **פעל → כתיבה** (Schreiben), **פיעל → דיבור** (Rede), **הפעיל → הסבר** (Erklärung), **התפעל → התלבשות** (Sich-Anziehen). Sie ermöglichen den förmlichen Stil: **אחרי כתיבת המכתב** (nach dem Schreiben des Briefes).
  he-formal:
    meaning: "förmliches und geschriebenes Hebräisch"
    intro: |
      Schrift und förmliche Rede verneinen das Präsens mit **אין** + Endung: **אינני / איני יודע** (ich weiß nicht), **אינו** (er ist nicht). **הנני** (hier bin ich, hiermit), **ברצוני** (ich möchte), **לפיכך** (folglich), **אולם** (jedoch), **כמו כן** (ebenso). Briefe beginnen mit **לכבוד…** (an…) und enden mit **בברכה** (mit freundlichen Grüßen).
  he-abstract:
    meaning: "abstrakte Nomen und akademisches Hebräisch"
    intro: |
      **-ות** bildet Abstrakta (**חירות** Freiheit, **אחריות** Verantwortung, **מציאות** Wirklichkeit); **-יות** von Adjektiven (**אנושיות** Menschlichkeit); internationale Wörter nehmen hebräische Endungen (**דמוקרטיה, טכנולוגיה, ביולוגיה**). Akademische Prosa liebt Status constructus und Verbalnomen: **שמירת הסביבה** (der Schutz der Umwelt).
  he-numbers-formal:
    meaning: "große Zahlen, Daten und Ordinalzahlen"
    intro: |
      **מאה** (100), **מאתיים** (200), **אלף** (1000), **אלפיים** (2000), **מיליון**. Ordinalzahlen bis zehn: **ראשון, שני, שלישי… עשירי**; darüber die Grundzahl: **הקומה העשרים** (der zwanzigste Stock). Jahre: **בשנת 1948** (im Jahr 1948); der hebräische Kalender schreibt sie in Buchstaben: **תשפ"ז**.
  he-biblical:
    meaning: "biblisches Hebräisch: das umkehrende Waw"
    intro: |
      Die biblische Erzählung erzählt die Vergangenheit mit **ו** + Futurform (*Waw consecutivum*): **ויאמר** (und er sprach), **ויהי** (und es geschah), **וירא** (und er sah). Das Verb steht vorn; die Schreibung ist kürzer (**היתה, בקר, חשך** für *הייתה, בוקר, חושך*). Der Leser liest sie als Futurformen mit **ו** — der erzählte Sinn ist Vergangenheit.
  he-literature:
    meaning: "moderne hebräische Literatur lesen"
    intro: |
      Chaim Nachman Bialik (1873–1934) schrieb die Gedichte, die jeder Israeli kennt (*El ha-tsipor*, 1891), in einem Hebräisch voller biblischer und rabbinischer Wörter; S. J. Agnon (Nobelpreis 1966) mischt rabbinischen Stil in moderne Prosa; Jehuda Amichai (1924–2000) schreibt in schlichtem gesprochenem Hebräisch. Lyrik ist oft punktiert, Prosa nicht.
  he-slang:
    meaning: "Alltagssprache und Lehnwörter"
    intro: |
      Das gesprochene israelische Hebräisch borgt frei: aus dem Arabischen **יאללה** (los!), **אחלה** (super), **סבבה** (okay, cool), **וואלה** (echt?); aus dem Jiddischen **שלומיאל** (Pechvogel); aus dem Englischen **אוקיי, ביי**. **אחי** (Bruder, Kumpel) und **נשמה** (Liebes, „Seele“) sind freundliche Anreden. Der Leser kennt die, die das Wiktionary verzeichnet.
