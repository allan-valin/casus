# Macedonian text of the Hebrew course, B1–C2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Infinitive and modal verbs: "Инфинитив и модални глаголи"
  Clauses: "Реченици"
  The passive: "Пасивот"
  Endings on nouns: "Наставки на именките"
  Roots and patterns: "Корени и обрасци"
  Register: "Регистар"
  Talking about ideas: "Разговор за идеи"
  Older layers and style: "Постари слоеви и стил"
lessons:
  he-infinitive:
    meaning: "инфинитивот со ל"
    intro: |
      Инфинитивот почнува со **ל**: **לכתוב, לדבר, להסביר, להתלבש**. По **רוצה** (сака), **יכול** (може), **צריך** (мора), **אוהב** (сака, ужива), **מתחיל** (почнува): **אני רוצה ללמוד** (сакам да учам). Безлично **צריך, אפשר, אסור, מותר** + инфинитив: **אסור לעשן** (забрането пушење).
  he-she:
    meaning: "што, кој, дека: ש"
    intro: |
      **ש** (споено со следниот збор) е *што, кој, дека*: **הספר שקראתי** (книгата што ја прочитав), **אני יודע שהוא בא** (знам дека доаѓа). **אשר** е официјалната форма. Заменката може да остане во реченицата: **הבית שגרתי בו** (куќата во која живеев, „во неа“).
  he-conjunctions:
    meaning: "поврзување реченици"
    intro: |
      **כי** (зашто; дека), **אם** (ако; дали), **כש-** (кога), **לפני ש- / אחרי ש-** (пред да / откако), **למרות ש-** (иако), **בגלל ש-** (бидејќи), **לכן** (затоа), **אבל** (но), **או** (или). **אני הולך הביתה כי אני עייף** (одам дома зашто сум уморен).
  he-conditional:
    meaning: "услови: реални и нереални"
    intro: |
      Реален: **אם** + идно или сегашно: **אם ירד גשם, נישאר בבית** (ако врне, ќе останеме дома). Нереален: **אילו / לו** + **היה** + партицип, и **היה** + партицип во последицата: **אילו היה לי זמן, הייתי בא** (да имав време, ќе дојдев). **הייתי רוצה** = би сакал.
  he-passive:
    meaning: "пасивни бињаним"
    intro: |
      Секој активен бињан има пасив: **פעל → נפעל** (**נכתב** беше напишан), **פיעל → פועל** (**סופר** беше раскажан), **הפעיל → הופעל** (**הוסבר** беше објаснет). Вршителот со **על ידי**: **הספר נכתב על ידי עגנון** (книгата ја напиша Агнон). Во говорот е честа безлична множина: **אומרים ש…** (велат дека…).
  he-noun-suffix:
    meaning: "присвојни наставки на именката"
    intro: |
      Пишаниот и официјалниот хебрејски го става *мој, твој…* на самата именка (од конструктната форма): **בית → ביתי** (мојата куќа), **ביתך, ביתו, ביתה, ביתנו**; именки во множина **ספריי, ספריו** (моите книги, неговите книги). Говорот претпочита **הבית שלי**, но зборовите за семејство ги задржуваат наставките: **אחי** (брат ми), **אבי** (татко ми), **בעלי** (мажот ми).
  he-mishkalim:
    meaning: "еден корен, многу зборови"
    intro: |
      И именките следат обрасци (*мишкалим*) околу коренот: **כ-ת-ב** → **מכתב** (писмо), **כתיבה** (пишување), **כתובת** (адреса), **כתב** (репортер). **מ-** често прави места и алатки (**מטבח** кујна, **מפתח** клуч), **-ה** по **и** дејства (**קריאה** читање), **-ות** апстрактни поими (**ילדות** детство). Кога го знаете коренот, го погодувате зборот.
  he-gerund:
    meaning: "глаголски именки"
    intro: |
      Секој бињан има своја глаголска именка (*шем пеула*): **פעל → כתיבה** (пишување), **פיעל → דיבור** (говор), **הפעיל → הסבר** (објаснување), **התפעל → התלבשות** (облекување). Тие овозможуваат официјален стил: **אחרי כתיבת המכתב** (по пишувањето на писмото).
  he-formal:
    meaning: "официјален и пишан хебрејски"
    intro: |
      Писмото и официјалниот говор го негираат сегашното со **אין** + наставка: **אינני / איני יודע** (не знам), **אינו** (тој не е). **הנני** (еве ме, со ова), **ברצוני** (сакам да), **לפיכך** (затоа), **אולם** (сепак), **כמו כן** (исто така). Писмата почнуваат со **לכבוד…** (до…) и завршуваат со **בברכה** (со почит).
  he-abstract:
    meaning: "апстрактни именки и академски хебрејски"
    intro: |
      **-ות** прави апстрактни именки (**חירות** слобода, **אחריות** одговорност, **מציאות** стварност); **-יות** од придавки (**אנושיות** човечност); меѓународните зборови земаат хебрејски наставки (**דמוקרטיה, טכנולוגיה, ביולוגיה**). Академската проза сака конструкти и глаголски именки: **שמירת הסביבה** (заштита на животната средина).
  he-numbers-formal:
    meaning: "големи броеви, датуми и редни броеви"
    intro: |
      **מאה** (100), **מאתיים** (200), **אלף** (1.000), **אלפיים** (2.000), **מיליון**. Редни броеви до десет: **ראשון, שני, שלישי… עשירי**; понатаму, основниот: **הקומה העשרים** (дваесеттиот кат). Години: **בשנת 1948** (во 1948 година); хебрејскиот календар ги пишува со букви: **תשפ"ז**.
  he-biblical:
    meaning: "библиски хебрејски: вавот што го превртува времето"
    intro: |
      Библискиот расказ го кажува минатото со **ו** + форма на идно (*вав-конзекутивум*): **ויאמר** (и рече), **ויהי** (и беше), **וירא** (и виде). Глаголот стои напред; правописот е пократок (**היתה, בקר, חשך** наместо *הייתה, בוקר, חושך*). Читачот ги чита како идни форми со **ו** — расказното значење е минато.
  he-literature:
    meaning: "читање модерна хебрејска литература"
    intro: |
      Хаим Нахман Бјалик (1873–1934) ги напиша песните што ги знае секој Израелец (*Ел ха-ципор*, 1891), на хебрејски богат со библиски и рабински зборови; Ш. Ј. Агнон (Нобелова награда 1966) меша рабински стил во модерната проза; Јехуда Амихај (1924–2000) пишува на едноставен говорен хебрејски. Поезијата често е со никуд, прозата не.
  he-slang:
    meaning: "секојдневен говор и позајменици"
    intro: |
      Говорниот израелски хебрејски позајмува слободно: од арапски **יאללה** (ајде!), **אחלה** (супер), **סבבה** (во ред, кул), **וואלה** (навистина?); од јидиш **שלומיאל** (неспретко); од англиски **אוקיי, ביי**. **אחי** (брат) и **נשמה** (душо) се пријателски обраќања. Читачот ги знае оние што ги наведува Викиречникот.
