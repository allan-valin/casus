# Arabic text of the Hebrew course, B1–C2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Infinitive and modal verbs: "المصدر والأفعال الناقصة"
  Clauses: "الجمل"
  The passive: "المبني للمجهول"
  Endings on nouns: "الضمائر المتصلة بالأسماء"
  Roots and patterns: "الجذور والأوزان"
  Register: "مستوى اللغة"
  Talking about ideas: "الحديث عن الأفكار"
  Older layers and style: "الطبقات القديمة والأسلوب"
lessons:
  he-infinitive:
    meaning: "المصدر مع ל"
    intro: |
      يبدأ المصدر بـ**ל**: **לכתוב، לדבר، להסביר، להתלבש**. بعد **רוצה** (يريد)، **יכול** (يستطيع)، **צריך** (يجب عليه)، **אוהב** (يحبّ)، **מתחיל** (يبدأ): **אני רוצה ללמוד** (أريد أن أتعلّم). وغير الشخصي **צריך، אפשר، אסור، מותר** + المصدر: **אסור לעשן** (ممنوع التدخين).
  he-she:
    meaning: "الذي، أنّ: ש"
    intro: |
      **ש** (متصلة بما بعدها) تعني *الذي، أنّ*: **הספר שקראתי** (الكتاب الذي قرأته)، **אני יודע שהוא בא** (أعرف أنه آتٍ). و**אשר** هي الصيغة الرسمية. وقد يبقى ضمير عائد في الصلة كالعربية: **הבית שגרתי בו** (البيت الذي سكنت فيه).
  he-conjunctions:
    meaning: "ربط الجمل"
    intro: |
      **כי** (لأنّ؛ أنّ)، **אם** (إذا؛ هل)، **כש-** (عندما)، **לפני ש- / אחרי ש-** (قبل أن / بعد أن)، **למרות ש-** (مع أنّ)، **בגלל ש-** (بسبب أنّ)، **לכן** (لذلك)، **אבל** (لكن)، **או** (أو). **אני הולך הביתה כי אני עייף** (أذهب إلى البيت لأنني متعب).
  he-conditional:
    meaning: "الشرط: الممكن وغير الممكن"
    intro: |
      الممكن: **אם** + المستقبل أو الحاضر: **אם ירד גשם, נישאר בבית** (إذا أمطرت بقينا في البيت). وغير الممكن: **אילו / לו** + **היה** + اسم الفاعل، و**היה** + اسم الفاعل في الجواب: **אילו היה לי זמן, הייתי בא** (لو كان عندي وقت لأتيت). **הייתי רוצה** = أودّ.
  he-passive:
    meaning: "أوزان المجهول"
    intro: |
      لكل وزن معلوم مجهول: **פעל → נפעל** (**נכתב** كُتب)، **פיעל → פועל** (**סופר** رُوي)، **הפעיל → הופעל** (**הוסבר** شُرح). والفاعل مع **על ידי**: **הספר נכתב על ידי עגנון** (كتب الكتابَ عغنون). وفي الكلام يشيع الجمع غير الشخصي: **אומרים ש…** (يقولون إنّ…).
  he-noun-suffix:
    meaning: "الضمائر المتصلة بالاسم"
    intro: |
      العبرية المكتوبة والرسمية تضع *ـي، ـك…* على الاسم نفسه (من صيغة الإضافة)، كالعربية: **בית → ביתי** (بيتي)، **ביתך، ביתו، ביתה، ביתנו**؛ والجمع **ספריי، ספריו** (كتبي، كتبه). والكلام يفضّل **הבית שלי**، لكن ألفاظ القرابة تحتفظ باللاحقة: **אחי** (أخي)، **אבי** (أبي)، **בעלי** (زوجي).
  he-mishkalim:
    meaning: "جذر واحد، كلمات كثيرة"
    intro: |
      للأسماء أيضًا أوزان (*مشقاليم*) حول الجذر، كأوزان الأسماء في العربية: **כ-ת-ב** → **מכתב** (مكتوب، رسالة)، **כתיבה** (كتابة)، **כתובת** (عنوان)، **כתב** (مراسل). **מ-** تصنع كثيرًا أسماء المكان والآلة (**מטבח** مطبخ، **מפתח** مفتاح)، و**-ה** بعد **i** المصادر (**קריאה** قراءة)، و**-ות** المجرّدات (**ילדות** طفولة). من عرف الجذر خمّن الكلمة.
  he-gerund:
    meaning: "المصادر"
    intro: |
      لكل وزن مصدره (*شِم بعولا*): **פעל → כתיבה** (كتابة)، **פיעל → דיבור** (كلام)، **הפעיל → הסבר** (شرح)، **התפעל → התלבשות** (ارتداء الثياب). وبها يتأتّى الأسلوب الرسمي: **אחרי כתיבת המכתב** (بعد كتابة الرسالة).
  he-formal:
    meaning: "العبرية الرسمية والمكتوبة"
    intro: |
      الكتابة والكلام الرسمي ينفيان الحاضر بـ**אין** + ضمير متصل، كـ«لستُ»: **אינני / איני יודע** (لا أعرف)، **אינו** (ليس هو). **הנני** (ها أنا ذا)، **ברצוני** (أودّ)، **לפיכך** (لذلك)، **אולם** (غير أنّ)، **כמו כן** (وكذلك). تبدأ الرسائل بـ**לכבוד…** (إلى حضرة…) وتنتهي بـ**בברכה** (مع التحية).
  he-abstract:
    meaning: "الأسماء المجرّدة والعبرية الأكاديمية"
    intro: |
      **-ות** تصنع المجرّدات (**חירות** حرّية، **אחריות** مسؤولية، **מציאות** واقع)؛ و**-יות** من الصفات (**אנושיות** إنسانية)؛ والكلمات الدولية تأخذ لواحق عبرية (**דמוקרטיה، טכנולוגיה، ביולוגיה**). والنثر الأكاديمي يحبّ الإضافة والمصادر: **שמירת הסביבה** (حماية البيئة).
  he-numbers-formal:
    meaning: "الأعداد الكبيرة والتواريخ والأعداد الترتيبية"
    intro: |
      **מאה** (100)، **מאתיים** (200)، **אלף** (1000)، **אלפיים** (2000)، **מיליון**. الترتيبية حتى العاشر: **ראשון، שני، שלישי… עשירי**؛ وبعدها العدد الأصلي: **הקומה העשרים** (الطابق العشرون). والسنوات: **בשנת 1948** (في سنة 1948)؛ والتقويم العبري يكتبها بالحروف كحساب الجُمَّل: **תשפ"ז**.
  he-biblical:
    meaning: "عبرية التوراة: واو القلب"
    intro: |
      تروي التوراة الماضي بـ**ו** + صيغة المستقبل (*واو القلب*): **ויאמר** (وقال)، **ויהי** (وكان)، **וירא** (ورأى). ويتقدّم الفعل؛ والإملاء أقصر (**היתה، בקר، חשך** بدل *הייתה، בוקר، חושך*). يقرؤها القارئ صيغ مستقبل مع **ו** — والمعنى السردي ماضٍ.
  he-literature:
    meaning: "قراءة الأدب العبري الحديث"
    intro: |
      كتب حاييم نحمان بياليك (1873–1934) القصائد التي يعرفها كل إسرائيلي (*إلى العصفور*، 1891) بعبرية غنية بالألفاظ التوراتية والحاخامية؛ ويمزج ش. ي. عغنون (نوبل 1966) الأسلوب الحاخامي بالنثر الحديث؛ ويكتب يهودا عميحاي (1924–2000) بعبرية محكية بسيطة. الشعر غالبًا مشكول، والنثر لا.
  he-slang:
    meaning: "الكلام اليومي والكلمات الدخيلة"
    intro: |
      تستعير العبرية الإسرائيلية المحكية بحرّية: من العربية **יאללה** (يلّا)، **אחלה** (أحلى، رائع)، **סבבה** (صبابة: تمام)، **וואלה** (والله؟)؛ ومن اليديشية **שלומיאל** (أخرق)؛ ومن الإنجليزية **אוקיי، ביי**. و**אחי** (أخي) و**נשמה** (يا روحي) تحيّتان وديّتان. والقارئ يعرف ما يسجّله الويكاموس منها.
