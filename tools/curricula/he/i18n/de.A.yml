# German text of the Hebrew course, A1–A2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Letters and sounds: "Buchstaben und Laute"
  Nouns and gender: "Nomen und Genus"
  Pronouns and the present: "Pronomen und das Präsens"
  Questions and negation: "Fragen und Verneinung"
  Prefixes and the article: "Präfixe und der Artikel"
  Numbers and time: "Zahlen und Zeit"
  Past and future: "Vergangenheit und Zukunft"
  Adjectives and the construct: "Adjektive und Status constructus"
  Prepositions with endings: "Präpositionen mit Endungen"
  Verb patterns: "Verbmuster"
lessons:
  he-alefbet:
    meaning: "das Alphabet, von rechts nach links; Endbuchstaben"
    intro: |
      Hebräisch wird von rechts nach links mit 22 Konsonantenbuchstaben geschrieben. Fünf haben am Wortende eine Endform: **כ → ך, מ → ם, נ → ן, פ → ף, צ → ץ** (**מלך** König, **שלום** Frieden). **ב כ פ** sind *b k p* oder *w ch f* (ein Punkt darin, das *Dagesch*, macht sie hart). **ש** ist *sch* oder *s*; **ח** und **כ** ohne Dagesch sind ein kehliges *ch* wie in *Bach*; **ע** und **א** sind heute meist stumm.
  he-vowels:
    meaning: "Vokalzeichen und volle Schreibung"
    intro: |
      Die Vokale sind Punkte und Striche unter und über den Buchstaben (*Nikkud*): **שָׁלוֹם**. Sie stehen in Kinderbüchern, Gedichten und der Bibel; gewöhnliche Texte lassen sie weg und schreiben manche Vokale stattdessen mit **ו** (*o, u*) und **י** (*i*) — die volle Schreibung: **שלום, דיבר, כתוב**. Man lernt, Wörter als Ganzes zu lesen. Der Leser nimmt beides.
  he-gender:
    meaning: "zwei Genera"
    intro: |
      Nomen sind maskulin oder feminin. Feminina enden meist auf **-ה** oder **-ת** (**ילדה** Mädchen, **מכונית** Auto, **בת** Tochter); maskulin ist der Rest (**ילד** Junge, **בית** Haus). Manche Feminina haben keine Endung: **עיר** (Stadt), **ארץ** (Land), paarige Körperteile (**יד** Hand, **רגל** Bein).
  he-plural:
    meaning: "der Plural: -ים und -ות"
    intro: |
      Maskulin **-ים** (**ילד → ילדים**), feminin **-ות** (**ילדה → ילדות**, **מכונית → מכוניות**). Die Vokale im Wort ändern sich oft (**ספר → ספרים** *sefer → sfarim*, **בית → בתים**), und manche Nomen nehmen die „andere“ Endung (**שולחן → שולחנות**, **אישה → נשים**). Paare: **-יים** (**ידיים** Hände, **שבועיים** zwei Wochen).
  he-pronouns:
    meaning: "Personalpronomen"
    intro: |
      **אני** (ich), **אתה / את** (du, zu einem Mann / einer Frau), **הוא / היא** (er / sie), **אנחנו** (wir), **אתם / אתן** (ihr, mask. / fem.), **הם / הן** (sie). *Du* hat ein Genus: Zu einer Frau sagt man **את**, und das Verb ist feminin.
  he-present:
    meaning: "das Präsens: vier Formen"
    intro: |
      Das Präsens hat keine Personen, nur Genus und Numerus: **לומד** (m. Sg.), **לומדת** (f. Sg.), **לומדים** (m. Pl.), **לומדות** (f. Pl.) — **אני / אתה / הוא לומד**, **אני / את / היא לומדת**. Das Pronomen ist nötig. Verben bauen auf einer Wurzel aus drei Buchstaben (**ל-מ-ד** lernen, **כ-ת-ב** schreiben), in Muster gegossen.
  he-yesh:
    meaning: "es gibt, es gibt nicht; ich habe"
    intro: |
      Im Präsens gibt es kein *sein*: **אני סטודנט** (ich bin Student), **הספר על השולחן** (das Buch ist auf dem Tisch). **יש** = es gibt, **אין** = es gibt nicht. *Haben* ist **יש ל-**: **יש לי אח** (ich habe einen Bruder), **אין לי זמן** (ich habe keine Zeit).
  he-questions:
    meaning: "Fragewörter"
    intro: |
      **מה** (was), **מי** (wer), **איפה** (wo), **לאן** (wohin), **מאיפה** (woher), **מתי** (wann), **למה** (warum), **איך** (wie), **כמה** (wie viel). Ja/Nein-Fragen ändern nur die Stimme oder beginnen schriftlich mit **האם**: **האם אתה בא?**
  he-lo:
    meaning: "Verneinung"
    intro: |
      **לא** vor Verb oder Adjektiv: **אני לא מבין** (ich verstehe nicht), **זה לא טוב**. **אין** verneint *es gibt* und, förmlich, das Präsens: **אינני יודע**. Doppelte Verneinung ist normal: **אף אחד לא בא** (niemand kam), **שום דבר** (nichts).
  he-ha:
    meaning: "der Artikel ה und bestimmte Phrasen"
    intro: |
      **ה** (*der, die, das*) wird ans Wort geschrieben: **ילד** ein Junge → **הילד** der Junge. Einen unbestimmten Artikel gibt es nicht. Ein Adjektiv nach einem bestimmten Nomen bekommt ebenfalls **ה**: **הספר הגדול** (das große Buch); ohne ist es ein Satz: **הספר גדול** (das Buch ist groß).
  he-prefixes:
    meaning: "Ein-Buchstaben-Wörter, ans nächste Wort geschrieben"
    intro: |
      **ו** (und), **ב** (in, an), **ל** (zu, für), **מ** (von, aus), **כ** (wie), **ש** (dass, der) werden ans nächste Wort geschrieben: **ובית** (und ein Haus), **בבית** (im Haus), **לירושלים** (nach Jerusalem), **מתל אביב** (aus Tel Aviv). Nach **ב, ל, כ** verschmilzt der Artikel: **ב + הבית → בבית**. Mehrere können sich stapeln: **וכשהגעתי** = und + als + ich ankam.
  he-et:
    meaning: "את: das bestimmte direkte Objekt"
    intro: |
      Vor ein *bestimmtes* direktes Objekt setzt das Hebräische **את**: **אני קורא את הספר** (ich lese das Buch) — aber **אני קורא ספר** (ein Buch). Namen sind bestimmt: **ראיתי את דוד**. Mit Pronomen verschmilzt es: **אותי, אותך, אותו, אותה** (mich, dich, ihn, sie).
  he-shel:
    meaning: "Besitz: von, mein, dein"
    intro: |
      **של** (von) nach dem Besessenen, mit Artikel: **הספר של דוד** (Davids Buch). Mit Pronomen: **שלי, שלך (m.), שלך (f.), שלו, שלה, שלנו, שלכם, שלהם**: **הבית שלי** (mein Haus). Das literarische Hebräisch hängt die Endung stattdessen ans Nomen: **ביתי** (mein Haus).
  he-numbers:
    meaning: "Zahlen haben ein Genus"
    intro: |
      Zum Zählen und mit femininen Nomen: **אחת, שתיים (שתי), שלוש, ארבע, חמש, שש, שבע, שמונה, תשע, עשר**; mit maskulinen: **אחד, שניים (שני), שלושה, ארבעה … עשרה**. **שלוש בנות** (drei Töchter), **שלושה בנים** (drei Söhne). **אחד** steht nach dem Nomen (**ילד אחד**), die anderen davor.
  he-days:
    meaning: "Tage und Zeitwörter"
    intro: |
      Die Woche beginnt am Sonntag, und die Tage werden gezählt: **יום ראשון** (Sonntag, „erster Tag“), **שני, שלישי, רביעי, חמישי, שישי** und **שבת**. **היום** (heute), **מחר** (morgen), **אתמול** (gestern), **עכשיו** (jetzt), **בבוקר, בערב** (am Morgen, am Abend).
  he-past:
    meaning: "die Vergangenheit: Endungen"
    intro: |
      Die Vergangenheit hängt Endungen für Person, Numerus und Genus an: **כתבתי** (ich schrieb), **כתבת** (du, m.), **כתבת** (du, f.), **כתב** (er), **כתבה** (sie), **כתבנו** (wir), **כתבתם / כתבתן** (ihr), **כתבו** (sie). Das Pronomen fällt oft weg: **כתבתי מכתב**. *War* ist **הייתי, היית, היה, הייתה…**.
  he-future:
    meaning: "das Futur: Präfixe"
    intro: |
      Das Futur fügt Präfixe (und manche Endungen) hinzu: **אכתוב** (ich werde schreiben), **תכתוב** (du, m. / sie), **תכתבי** (du, f.), **יכתוב** (er), **נכתוב** (wir), **תכתבו** (ihr), **יכתבו** (sie). Es dient auch als höfliche Aufforderung: **תכתוב לי** (schreib mir). Nahe Zukunft: **אני הולך לכתוב**.
  he-imperative:
    meaning: "der Imperativ"
    intro: |
      Aus dem Futur ohne Präfix: **תכתוב → כתוב!**, **תשבי → שבי!** (setz dich, zu einer Frau), **תבואו → בואו!** (kommt). Verneinte Befehle mit **אל** + Futur: **אל תדאג** (keine Sorge). In der Rede ist das einfache Futur weicher: **תשב, בבקשה**.
  he-adj:
    meaning: "Adjektive folgen und kongruieren"
    intro: |
      Adjektive stehen nach dem Nomen und kongruieren in Genus, Numerus und Bestimmtheit: **ילד טוב, ילדה טובה, ילדים טובים, ילדות טובות; הילד הטוב.** Vergleich: **יותר / פחות … מ-** (**גדול יותר מ…** größer als), Superlativ **הכי** (**הכי טוב** am besten) oder schriftlich **ביותר**.
  he-smikhut:
    meaning: "der Status constructus: Nomen + Nomen"
    intro: |
      Zwei Nomen hintereinander bilden eines: das erste, in der *Konstruktform*, bedeutet *X von*: **בית ספר** (Schule, „Haus des Buches“), **עוגת שוקולד** (Schokoladenkuchen; **עוגה → עוגת**), **ילדי השכונה** (die Kinder des Viertels; **ילדים → ילדי**). Der Artikel steht nur beim zweiten Nomen: **בית הספר** (die Schule).
  he-prep-suffix:
    meaning: "Präpositionen nehmen Pronomenendungen"
    intro: |
      Eine Präposition steht nicht vor einem Pronomen; sie nimmt eine Endung: **ל → לי, לך, לו, לה, לנו, לכם, להם** (mir, dir…), **עם → איתי, איתך, איתו** (mit mir…), **אצל → אצלי** (bei mir), **על → עליי, עליו**, **של → שלי**. **תן לי** (gib mir), **בוא איתי** (komm mit mir).
  he-binyanim:
    meaning: "die sieben Binjanim"
    intro: |
      Dieselbe Wurzel geht in sieben Muster (*Binjanim*), jedes mit eigener Konjugation und typischer Bedeutung: **פעל** (einfach: **כתב** schrieb), **פיעל** (intensiv: **דיבר** sprach), **הפעיל** (kausativ: **הסביר** erklärte), **התפעל** (reflexiv: **התלבש** zog sich an), **נפעל** (Passiv des Pa'al: **נכתב** wurde geschrieben) und die Passive **פועל, הופעל**. Lernen Sie jedes Verb mit seinem Binjan.
