id: B1
topics:

- title: {en: Infinitive and modal verbs, pt: Infinitivo e verbos modais}
  lessons:
  - id: he-infinitive
    title: לכתוב, לדבר, צריך ל-
    meaning: {en: "the infinitive with ל", pt: "o infinitivo com ל"}
    intro:
      en: |
        The infinitive starts with **ל**: **לכתוב, לדבר, להסביר, להתלבש**. After **רוצה** (want), **יכול** (can), **צריך** (must), **אוהב** (like), **מתחיל** (begin): **אני רוצה ללמוד**. Impersonal **צריך, אפשר, אסור, מותר** + infinitive: **אסור לעשן** (no smoking).
      pt: |
        O infinitivo começa com **ל**: **לכתוב, לדבר, להסביר, להתלבש**. Depois de **רוצה** (querer), **יכול** (poder), **צריך** (precisar), **אוהב** (gostar), **מתחיל** (começar): **אני רוצה ללמוד** (quero estudar). Impessoal **צריך, אפשר, אסור, מותר** + infinitivo: **אסור לעשן** (proibido fumar).
    examples:
    - ["אני רוצה ללמוד עברית.", "I want to learn Hebrew.", "Quero aprender hebraico.", "ללמוד"]
    - ["אפשר לשבת כאן?", "May I sit here?", "Posso sentar aqui?", "אפשר"]
    match: {seq: [{word: [רוצה, רוצים, רוצות, יכול, יכולה, יכולים, צריך, צריכה, צריכים, אפשר, אסור, מותר, אוהב, אוהבת]}, {re: "^ל", pos: verb}], gap: 0}
    pool: [רוצה, יכול, צריך, אפשר, אסור, מותר]

- title: {en: Clauses, pt: Orações}
  lessons:
  - id: he-she
    title: ש־, אשר, הספר שקראתי
    meaning: {en: "that, which, who: ש", pt: "que: ש"}
    intro:
      en: |
        **ש** (written onto the next word) is *that, which, who*: **הספר שקראתי** (the book that I read), **אני יודע שהוא בא** (I know that he's coming). **אשר** is the formal form. A pronoun can stay in the clause: **הבית שגרתי בו** (the house I lived in, "in it").
      pt: |
        **ש** (escrito junto à palavra seguinte) é *que*: **הספר שקראתי** (o livro que eu li), **אני יודע שהוא בא** (sei que ele vem). **אשר** é a forma formal. Um pronome pode ficar na oração: **הבית שגרתי בו** (a casa em que morei, "nela").
    examples:
    - ["זה הספר שקראתי.", "This is the book I read.", "Este é o livro que eu li.", "ש"]
    match: {seq: [{word: [ש, אשר]}], gap: 0}
    pool: [ש, אשר, כי]
  - id: he-conjunctions
    title: כי, אם, כש, למרות ש, בגלל
    meaning: {en: "joining clauses", pt: "ligando orações"}
    intro:
      en: |
        **כי** (because; that), **אם** (if; whether), **כש-** (when), **לפני ש- / אחרי ש-** (before / after), **למרות ש-** (although), **בגלל ש-** (because), **לכן** (therefore), **אבל** (but), **או** (or). **אני הולך הביתה כי אני עייף.**
      pt: |
        **כי** (porque; que), **אם** (se), **כש-** (quando), **לפני ש- / אחרי ש-** (antes que / depois que), **למרות ש-** (embora), **בגלל ש-** (porque), **לכן** (por isso), **אבל** (mas), **או** (ou). **אני הולך הביתה כי אני עייף** (vou para casa porque estou cansado).
    examples:
    - ["אני הולך הביתה כי אני עייף.", "I'm going home because I'm tired.", "Vou para casa porque estou cansado.", "כי"]
    match: {seq: [{word: [כי, אם, כש, למרות, בגלל, לכן, אבל, או]}]}
    pool: [כי, אם, כש, למרות, בגלל, לכן, אבל]
  - id: he-conditional
    title: אם, אילו, הייתי
    meaning: {en: "conditions: real and unreal", pt: "condições: reais e irreais"}
    intro:
      en: |
        Real: **אם** + future or present: **אם ירד גשם, נישאר בבית.** Unreal: **אילו / לו** + **היה** + participle, and **היה** + participle in the result: **אילו היה לי זמן, הייתי בא** (if I had time, I would come). **הייתי רוצה** = I would like.
      pt: |
        Real: **אם** + futuro ou presente: **אם ירד גשם, נישאר בבית** (se chover, ficamos em casa). Irreal: **אילו / לו** + **היה** + particípio, e **היה** + particípio na consequência: **אילו היה לי זמן, הייתי בא** (se eu tivesse tempo, viria). **הייתי רוצה** = eu gostaria.
    examples:
    - ["הייתי רוצה כוס קפה.", "I'd like a cup of coffee.", "Eu gostaria de um café.", "הייתי"]
    match: {seq: [{word: [הייתי, היית, היה, הייתה, היינו, הייתם, היו]}, {pos: verb, tense: pres}], gap: 0}
    pool: [אם, אילו, לו, הייתי]

- title: {en: The passive, pt: A voz passiva}
  lessons:
  - id: he-passive
    title: נכתב, סופר, הוסבר
    meaning: {en: "passive binyanim", pt: "os binyanim passivos"}
    intro:
      en: |
        Each active binyan has a passive: **פעל → נפעל** (**נכתב** was written), **פיעל → פועל** (**סופר** was told), **הפעיל → הופעל** (**הוסבר** was explained). The agent with **על ידי**: **הספר נכתב על ידי עגנון.** In speech an impersonal plural is common: **אומרים ש…** (they say that…).
      pt: |
        Cada binyan ativo tem um passivo: **פעל → נפעל** (**נכתב** foi escrito), **פיעל → פועל** (**סופר** foi contado), **הפעיל → הופעל** (**הוסבר** foi explicado). O agente com **על ידי**: **הספר נכתב על ידי עגנון** (o livro foi escrito por Agnon). Na fala é comum o plural impessoal: **אומרים ש…** (dizem que…).
    examples:
    - ["הספר נכתב לפני מאה שנה.", "The book was written a hundred years ago.", "O livro foi escrito há cem anos.", "נכתב"]
    match: {seq: [{pos: verb, voice: pass}]}
