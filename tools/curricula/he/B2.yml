id: B2
topics:

- title: {en: Endings on nouns, pt: Terminações nos nomes}
  lessons:
  - id: he-noun-suffix
    title: ביתי, ספרך, ארצנו
    meaning: {en: "possessive endings on the noun", pt: "terminações possessivas no nome"}
    intro:
      en: |
        Written and formal Hebrew puts *my, your…* on the noun itself (from its construct form): **בית → ביתי** (my house), **ביתך, ביתו, ביתה, ביתנו**; plural nouns **ספריי, ספריו** (my books, his books). Speech prefers **הבית שלי**, but family words keep the endings: **אחי** (my brother), **אבי** (my father), **בעלי** (my husband).
      pt: |
        O hebraico escrito e formal põe *meu, seu…* no próprio nome (a partir da forma construta): **בית → ביתי** (minha casa), **ביתך, ביתו, ביתה, ביתנו**; nomes no plural **ספריי, ספריו** (meus livros, os livros dele). A fala prefere **הבית שלי**, mas as palavras de família guardam as terminações: **אחי** (meu irmão), **אבי** (meu pai), **בעלי** (meu marido).
    examples:
    - ["אחי גר בחיפה.", "My brother lives in Haifa.", "Meu irmão mora em Haifa.", "אחי"]
    match: {seq: [{word: [אחי, אבי, אמי, בעלי, אשתי, ביתי, ארצנו, עמנו]}]}
    pool: [אחי, אבי, אמי, בעלי, אשתי]

- title: {en: Roots and patterns, pt: Raízes e padrões}
  lessons:
  - id: he-mishkalim
    title: כתב, מכתב, כתיבה, כתובת
    meaning: {en: "one root, many words", pt: "uma raiz, muitas palavras"}
    intro:
      en: |
        Nouns too come in patterns (*mishkalim*) around the root: **כ-ת-ב** → **מכתב** (letter), **כתיבה** (writing), **כתובת** (address), **כתב** (reporter), **מכתבה** (desk). **מ-** often makes places and tools (**מטבח** kitchen, **מפתח** key), **-ה** after **i** actions (**קריאה** reading), **-ות** abstracts (**ילדות** childhood). Knowing the root, you guess the word.
      pt: |
        Os nomes também seguem padrões (*mishkalim*) em torno da raiz: **כ-ת-ב** → **מכתב** (carta), **כתיבה** (escrita), **כתובת** (endereço), **כתב** (repórter). **מ-** muitas vezes faz lugares e instrumentos (**מטבח** cozinha, **מפתח** chave), **-ה** depois de **i** ações (**קריאה** leitura), **-ות** abstratos (**ילדות** infância). Conhecendo a raiz, adivinha-se a palavra.
    examples:
    - ["שלחתי לו מכתב.", "I sent him a letter.", "Mandei uma carta para ele.", "מכתב"]
    match: {seq: [{pos: noun, re: "^מ"}]}
  - id: he-gerund
    title: כתיבה, דיבור, הסבר
    meaning: {en: "verbal nouns", pt: "nomes verbais"}
    intro:
      en: |
        Each binyan has its verbal noun (*shem pe'ula*): **פעל → כתיבה** (writing), **פיעל → דיבור** (speech), **הפעיל → הסבר** (explanation), **התפעל → התלבשות** (getting dressed). They make formal style possible: **אחרי כתיבת המכתב** (after writing the letter).
      pt: |
        Cada binyan tem seu nome verbal (*shem pe'ula*): **פעל → כתיבה** (escrita), **פיעל → דיבור** (fala), **הפעיל → הסבר** (explicação), **התפעל → התלבשות** (vestir-se). Eles tornam possível o estilo formal: **אחרי כתיבת המכתב** (depois de escrever a carta).
    examples:
    - ["הקריאה חשובה לילדים.", "Reading is important for children.", "A leitura é importante para as crianças.", "הקריאה"]
    match: {seq: [{pos: noun, re: "(יה|ות|ור)$"}]}

- title: {en: Register, pt: Registro}
  lessons:
  - id: he-formal
    title: אינני, הנני, ברצוני
    meaning: {en: "formal and written Hebrew", pt: "hebraico formal e escrito"}
    intro:
      en: |
        Writing and formal speech negate the present with **אין** + ending: **אינני / איני יודע** (I don't know), **אינו** (he isn't). **הנני** (here I am, I hereby), **ברצוני** (I wish to), **לפיכך** (therefore), **אולם** (however), **כמו כן** (likewise). Letters open **לכבוד…** (to…) and close **בברכה** (best regards).
      pt: |
        A escrita e a fala formal negam o presente com **אין** + terminação: **אינני / איני יודע** (não sei), **אינו** (ele não é). **הנני** (eis-me, pela presente), **ברצוני** (desejo), **לפיכך** (portanto), **אולם** (contudo), **כמו כן** (igualmente). Cartas começam com **לכבוד…** (ao Sr./à Sra.…) e terminam com **בברכה** (atenciosamente).
    examples:
    - ["אינני יודע מה לומר.", "I don't know what to say.", "Não sei o que dizer.", "אינני"]
    match: {seq: [{word: [אינני, איני, אינו, אינה, אינם, הנני, ברצוני, לפיכך, אולם, בברכה]}]}
    pool: [אינני, אינו, הנני, אולם, לפיכך]
