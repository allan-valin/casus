# Arabic text of the Hungarian course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and vowel harmony: "الأصوات والتوافق الصائتي"
  Pronouns and 'van': "الضمائر و«van»"
  Verbs: "الأفعال"
  Nouns and their cases: "الأسماء وحالاتها"
  Possession: "الملكية"
  Past and future: "الماضي والمستقبل"
  Verbal prefixes: "السوابق الفعلية"
lessons:
  hu-harmony:
    meaning: "التوافق الصائتي: خلفي -ban، أمامي -ben"
    intro: |
      الإملاء المجري: **sz** = س، **s** = ش، **zs** = ج الشامية، **cs** = تش، **gy** = دْي، **ny** = نْي، **ty** = تْي، **ly** = ي؛ والعلامة فوق الصائت تدل على **الطول**: **a / á، e / é، o / ó، ö / ő، u / ú، ü / ű**. والنبر دائمًا على المقطع الأول.

      اللواحق **شكلان** (خلفي/أمامي): الكلمة ذات **a، á، o، ó، u، ú** تأخذ **-ban، -ba، -nak، -ból**؛ وذات **e، é، i، í، ö، ő، ü، ű** تأخذ **-ben، -be، -nek، -ből**: **ház → házban** (في البيت)، **kert → kertben** (في الحديقة). وبعضها **ثلاثة** (مع ö): **-hoz / -hez / -höz**: **házhoz، kerthez، öröm → örömhöz**.
  hu-van:
    meaning: "الضمائر الشخصية وlenni «يكون»"
    intro: |
      **én** أنا، **te** أنت، **ő** هو/هي (كلمة واحدة)، **mi** نحن، **ti** أنتم، **ők** هم؛ وللاحترام **ön / maga** (جمعها **önök / maguk**) مع الغائب. **lenni**: **vagyok، vagy، van، vagyunk، vagytok، vannak**. وفي الغائب تُحذف **van/vannak** قبل الاسم أو الصفة، كالجملة الاسمية العربية: **Péter orvos.** «بيتر طبيب»، وتبقى للمكان: **Péter otthon van.** «بيتر في البيت». والنفي: **nem vagyok**، وللغائب **nincs / nincsenek**.
  hu-present-indef:
    meaning: "المضارع: التصريف غير المحدد"
    intro: |
      للأفعال المجرية **تصريفان**. **غير المحدد** يُستعمل بلا مفعول أو مع مفعول نكرة (**egy könyvet**، *كتابًا*):

      | | خلفي (olvas يقرأ) | أمامي (beszél يتكلم) |
      |---|---|---|
      | én | olvas**ok** | beszél**ek** |
      | te | olvas**ol** | beszél**sz** |
      | ő | olvas | beszél |
      | mi | olvas**unk** | beszél**ünk** |
      | ti | olvas**tok** | beszél**tek** |
      | ők | olvas**nak** | beszél**nek** |

      وبعد **s، sz، z** تكون صيغة te **-ol / -el / -öl**: **olvasol، főzöl**. وصيغة المعجم هي صيغة ő (**olvas**)؛ والمصدر يضيف **-ni** (**olvasni**).
  hu-present-def:
    meaning: "التصريف المحدد: مفعول معرفة"
    intro: |
      مع مفعول **معرفة** — **a/az** + اسم، أو علم، أو **ezt، azt**، أو اسم مضاف إلى ضمير — يأخذ الفعل اللواحق **المحددة**: **olvasom، olvasod، olvassa، olvassuk، olvassátok، olvassák** (أمامي: **nézem، nézed، nézi، nézzük، nézitek، nézik**). **Olvasok egy könyvet** (كتابًا) لكن **Olvasom a könyvet** (الكتاب). و*أنا … إياك* لها لاحقة خاصة **-lak / -lek**: **Szeretlek.** «أحبك».
  hu-negation:
    meaning: "النفي: nem، nincs، ne"
    intro: |
      **nem** قبل الفعل أو الكلمة المنفية: **Nem tudom.** «لا أعرف». ولغائب *يكون* نفي خاص: **nincs / nincsenek** «لا يوجد»، **Nincs időm.** «ليس عندي وقت». و**ne** للنهي والتمني: **Ne félj!** «لا تخف!» والنفي المزدوج عادي: **Senki sem tudja.** «لا أحد يعرف».
  hu-questions:
    meaning: "أدوات الاستفهام وأداة السؤال -e"
    intro: |
      **ki** من، **mi** ماذا، **hol** أين، **hová** إلى أين، **honnan** من أين، **mikor** متى، **miért** لماذا، **hogyan / hogy** كيف، **mennyi** كم (كمية)، **hány** كم (عدد)، **melyik** أيّ، **milyen** أيّ نوع. وأسئلة نعم/لا ترتفع نغمتها؛ وفي السؤال غير المباشر يأخذ الفعل **-e**، مثل «هل»: **Nem tudom, jön-e.** «لا أعرف هل سيأتي».
  hu-plural:
    meaning: "الجمع -k"
    intro: |
      **-k**، مع صائت وصل بعد الصامت: **ház → házak، kert → kertek، gyerek → gyerekek، ló → lovak**؛ والـ **a / e** الأخيرة تطول: **alma → almák، kefe → kefék**. وبعد العدد أو كلمة الكمية يبقى الاسم مفردًا: **két ház، sok ember**.
  hu-accusative:
    meaning: "المفعولية -t: المفعول به"
    intro: |
      كل مفعول مباشر يأخذ **-t**، غالبًا مع صائت وصل: **könyv → könyvet، ház → házat، alma → almát، bor → bort**. ومع المفعول المعرفة يكون الفعل محددًا (الدرس السابق): **Látom a házat.** / **Látok egy házat.**
  hu-inner-local:
    meaning: "الداخل: -ban (في)، -ba (إلى داخل)، -ból (من داخل)"
    intro: |
      **-ban / -ben** في، **-ba / -be** إلى داخل، **-ból / -ből** من داخل: **a házban** (في البيت)، **a házba** (إلى داخل البيت)، **a házból** (من البيت). ومعظم البلدان والمدن تأخذها: **Budapesten** استثناء (الحالات الخارجية)، و**Brazíliában** قياسية.
  hu-outer-local:
    meaning: "السطح: -on (على)، -ra (إلى سطح)، -ról (عن)"
    intro: |
      **-n / -on / -en / -ön** على، **-ra / -re** إلى (على)، **-ról / -ről** من على، عن: **az asztalon** (على الطاولة)، **az asztalra** (إلى الطاولة)، **a filmről beszélünk** (نتكلم عن الفيلم). والمدن المجرية وأماكن كثيرة تأخذها: **Budapesten، Magyarországon، a postán** (في البريد).
  hu-near-local:
    meaning: "عند، إلى، من (شخص أو مكان): -nál، -hoz، -tól"
    intro: |
      **-nál / -nél** عند، **-hoz / -hez / -höz** إلى، **-tól / -től** من عند: **az orvosnál** (عند الطبيب)، **az orvoshoz** (إلى الطبيب)، **az orvostól** (من عند الطبيب). والأشخاص يأخذونها دائمًا لـ *إلى، من، عند*: **Anyámhoz megyek.** «أذهب إلى أمي».
  hu-dative:
    meaning: "القابل -nak / -nek: لـ؛ والملكية"
    intro: |
      **-nak / -nek**: من يُعطى الشيء أو يُفعل له (**Adok egy könyvet Péternek.** «أعطي بيتر كتابًا»)، والمالك في جمل *عنده*: **Péternek van egy autója.** «لبيتر سيارة».
  hu-instrumental:
    meaning: "الآلة -val / -vel: مع، بـ"
    intro: |
      **-val / -vel**، وتتماثل **v** مع الصامت الأخير: **busszal** (بالحافلة)، **tollal** (بالقلم)، **a barátommal** (مع صديقي)، **Annával**. وبعد الصائت تبقى **v**: **autóval**.
  hu-possessive:
    meaning: "لواحق الملكية"
    intro: |
      الملكية لاحقة على المملوك، كالضمائر المتصلة العربية: **ház-am** بيتي، **ház-ad** بيتك، **ház-a** بيته/بيتها، **ház-unk** بيتنا، **ház-atok** بيتكم، **ház-uk** بيتهم (أمامي: **kert-em، kert-ed، kert-je، kert-ünk، kert-etek، kert-jük**). والمالك يسبقه كالإضافة: **Péter háza** «بيت بيتر». و*عندي* هي **van** + الاسم المملوك: **Van egy kutyám.** «عندي كلب».
  hu-past:
    meaning: "الماضي -t- / -tt-"
    intro: |
      **-t-** أو **-tt-** + اللواحق، في التصريفين: غير المحدد **olvastam، olvastál، olvasott، olvastunk، olvastatok، olvastak**؛ والمحدد **olvastam، olvastad، olvasta، olvastuk، olvastátok، olvasták**. وللمجرية زمن ماضٍ واحد فقط.
  hu-future:
    meaning: "المستقبل: fog + المصدر"
    intro: |
      **fogok، fogsz، fog، fogunk، fogtok، fognak** + المصدر: **Holnap dolgozni fogok.** «سأعمل غدًا». وكثيرًا ما يكفي المضارع مع كلمة زمن: **Holnap jövök.** «آتي غدًا».
  hu-prefixes:
    meaning: "السوابق الفعلية: be-، ki-، el-، meg-، fel-، le-"
    intro: |
      **be-** إلى الداخل، **ki-** إلى الخارج، **fel- / föl-** إلى أعلى، **le-** إلى أسفل، **el-** بعيدًا، **vissza-** رجوعًا، **át-** عبورًا، **meg-** (الإتمام): **bemegy** يدخل، **kimegy** يخرج، **elmegy** يذهب بعيدًا، **megír** يكتب حتى يتمّ. وتنتقل السابقة بعد الفعل عند التركيز على شيء أو في النفي: **Nem megyek be.** «لن أدخل».
  hu-imperative:
    meaning: "الأمر -j"
    intro: |
      **-j** + اللواحق (مع التماثل بعد s وsz وz وt): **várj!** (انتظر)، **olvass!** (اقرأ)، **nézz!** (انظر)؛ والمحدد **olvasd el!** والشاذ: **menj** (اذهب)، **gyere** (تعالَ)، **legyél / légy** (كن). ويعبّر أيضًا عن التمني والغاية بعد **hogy**: **Mondd meg neki, hogy jöjjön!** «قل له أن يأتي!» والنهي بـ **ne**: **Ne menj!**
