# Macedonian text of the Hungarian course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Conditional and clauses: "Условен начин и зависни реченици"
  Verbal prefixes in the sentence: "Глаголските представки во реченицата"
  Derived verbs: "Изведени глаголи"
  Participles: "Партиципи"
  More cases: "Уште падежи"
lessons:
  hu-conditional:
    meaning: "условниот начин -na / -ne"
    intro: |
      **-na- / -ne-** + наставки: **olvasnék, olvasnál, olvasna** (неопр.), **olvasnám, olvasnád, olvasná** (опр.). Желби и учтиви барања (**Szeretnék egy kávét.** „Би сакал едно кафе.“) и нереални услови со **ha**: **Ha lenne időm, eljönnék.** „Да имав време, ќе дојдев.“
  hu-conjunctions:
    meaning: "дека, бидејќи, ако, но"
    intro: |
      **hogy** дека, **mert** бидејќи, **ha** ако, **amikor** кога, **de** но, **vagy** или, **és** и, **tehát** значи, **mivel** бидејќи, **bár** иако, **mielőtt** пред да, **miután** откако. Пред зависна реченица секогаш има запирка; главната често има показен збор: **Azt mondta, hogy jön.** „Тоа го рече, дека доаѓа.“
  hu-relative:
    meaning: "релативни заменки: aki, ami, amely"
    intro: |
      **aki** (луѓе), **ami / amely** (работи), менувани како именки: **a férfi, aki itt lakik** „човекот што живее тука“, **a könyv, amit olvasok** „книгата што ја читам“, **a ház, amelyben lakom** „куќата во која живеам“. Исто **ahol** каде што, **amikor** кога.
  hu-prefix-separation:
    meaning: "представката по глаголот: негација и прашања"
    intro: |
      Во неутрален исказ представката останува на глаголот (**Bemegyek.** „Влегувам.“), но оди **по** глаголот кога нешто друго го зазема местото веднаш пред него:

      - негација: **Nem megyek be.** „Не влегувам.“ **Ne nyisd ki!** „Немој да го отвораш!“
      - прашален збор: **Mikor jössz haza?** „Кога доаѓаш дома?“
      - збор во фокус: **Péter hívott fel, nem Anna.** „Петер се јави, не Ана.“
  hu-prefix-aspect:
    meaning: "meg- и други представки за завршено дејство"
    intro: |
      Без представка глаголот често опишува активност; со неа — дејство доведено до крај, многу слично на македонскиот свршен вид. **meg-** главно ја додава само таа завршеност:

      - **Írtam egy levelet.** „Пишував писмо.“ – **Megírtam a levelet.** „Го напишав писмото.“
      - **Ettem.** „Јадев.“ – **Megettem a levest.** „Ја изедов супата.“
      - **Olvastam a könyvet.** „Ја читав книгата.“ – **Elolvastam a könyvet.** „Ја прочитав книгата.“

      Некои глаголи се спаруваат со **el-** (**olvas → elolvas**), **meg-** е стандардната (**csinál → megcsinál, néz → megnéz**).
  hu-prefix-auxiliary:
    meaning: "представката пред akar, tud, fog, kell"
    intro: |
      Со помошен глагол (**akar, tud, fog, kell, szeret, kezd, szokott, lehet**) представката го напушта инфинитивот и оди пред помошниот: **El akarok menni.** „Сакам да заминам.“ **Meg tudod csinálni?** „Можеш ли да го направиш?“ **Haza fogok menni.** „Ќе одам дома.“

      При негација или фокус се враќа на инфинитивот: **Nem akarok elmenni.** „Не сакам да заминам.“
  hu-potential:
    meaning: "-hat / -het: може, смее"
    intro: |
      **-hat / -het** пред личната наставка значи *смее, може*: **Bejöhetek?** „Смеам ли да влезам?“ **Itt dohányozhatsz.** „Тука смееш да пушиш.“ **Ez igaz lehet.** „Ова може да е вистина.“ (**lehet** од **van**). Спореди **tud** (*знае да*): **Tudok úszni.** „Знам да пливам.“
  hu-causative:
    meaning: "-tat / -tet: дава нешто да се направи"
    intro: |
      **-tat / -tet** (по самогласка или двосложни основи) и **-at / -et** (по многу едносложни) го прават глаголот каузативен: *натера / даде некој да направи*:

      - **javít → javíttat**: **Megjavíttattam az autót.** „Дадов да ми ја поправат колата.“
      - **ír → írat**, **vár → várat**: **Ne várass!** „Не оставај ме да чекам!“
      - **nevet → nevettet** (насмее), **dolgozik → dolgoztat** (натера да работи)

      Оној што треба да дејствува е во акузатив или со **-val / -vel**: **Megcsináltatom a szerelővel.** „Ќе дадам механичарот да го направи.“
  hu-frequentative:
    meaning: "-gat / -get: одвреме-навреме, малку"
    intro: |
      **-gat / -get** (и **-ogat, -eget**) го прави дејството повторено, лежерно или распослано: **olvas → olvasgat** „почитува“, **néz → nézeget** „разгледува“, **kérdez → kérdezget** „распрашува“, **ír → írogat** „пишува понекогаш“. **-kál / -kél** е слично: **jár → járkál** „шета нагоре-надолу“.
  hu-participles:
    meaning: "партиципи: -ó (што прави), -t (направен), -andó (што треба да се направи)"
    intro: |
      Три партиципа стојат пред именката како придавки:

      - **-ó / -ő** (што прави): **az olvasó fiú** „момчето што чита“, **a következő megálló** „следната постојка“
      - **-t / -tt** (направен): **a megírt levél** „напишаното писмо“, **a tegnap vett kenyér** „лебот купен вчера“
      - **-andó / -endő** (што треба да се направи): **a megoldandó feladat** „задачата што треба да се реши“, **fizetendő összeg** „износ за плаќање“

      Тие заменуваат релативни реченици: **a fiú, aki olvas = az olvasó fiú**.
  hu-adverbial-participle:
    meaning: "-va / -ve: во состојба, додека"
    intro: |
      **-va / -ve** опишува состојба што произлегува од дејство, или начинот на кој нешто се прави:

      - со **van**: **Az ajtó nyitva van.** „Вратата е отворена.“ **A bolt zárva van.** „Продавницата е затворена.“ **Meg van írva.** „Напишано е.“
      - начин: **Ülve olvasott.** „Читаше седејќи.“ **Sietve távozott.** „Замина набрзина.“
  hu-translative-essive:
    meaning: "-vá / -vé (станува), -ként (како), -ul / -ül (на јазик, како)"
    intro: |
      - **-vá / -vé** (транслатив): претворање, со **válik, lesz**: **Orvossá vált.** „Стана лекар.“ **A víz jéggé fagyott.** „Водата замрзна во мраз.“ **v** се изедначува по согласка: **jég → jéggé**.
      - **-ként** (официјално): во улога на: **Tanárként dolgozik.** „Работи како наставничка.“
      - **-ul / -ül** (есив-модал): јазици и начин: **magyarul** „на унгарски“, **jól** „добро“, **barátul** „како пријател“.
  hu-causal-terminative:
    meaning: "-ért (за, во замена за) и -ig (до)"
    intro: |
      - **-ért** (каузал-финал): *за* цел, цена или лице: **Elmegyek kenyérért.** „Одам по леб.“ **Mennyiért vetted?** „Колку го плати?“ **Köszönöm a segítségért.** „Благодарам за помошта.“ **Miért?** „Зошто?“ е истата наставка.
      - **-ig** (терминатив): *до*: **ötig** „до пет“, **a sarokig** „до аголот“, **holnapig** „до утре“.
  hu-time-suffixes:
    meaning: "-kor (во, на), -nta / -nként (секој)"
    intro: |
      - **-kor** дава точка во времето, без вокална хармонија: **hétkor** „во седум“, **éjfélkor** „на полноќ“, **karácsonykor** „за Божиќ“, **Hány órakor?** „Во колку часот?“
      - **-nta / -nte** и **-nként** даваат зачестеност или распределба: **naponta** „дневно“, **hetente** „неделно“, **havonta** „месечно“, **évente** „годишно“, **óránként** „на час“, **egyenként** „еден по еден“.
