# Macedonian text of the Hungarian course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and vowel harmony: "Гласови и вокална хармонија"
  Pronouns and 'van': "Заменки и „van“"
  Verbs: "Глаголи"
  Nouns and their cases: "Именките и нивните падежи"
  Possession: "Припадност"
  Past and future: "Минато и идно"
  Verbal prefixes: "Глаголски представки"
lessons:
  hu-harmony:
    meaning: "вокална хармонија: задно -ban, предно -ben"
    intro: |
      Унгарски правопис: **sz** = **с**, **s** = **ш**, **zs** = **ж**, **cs** = **ч**, **gy** = **ѓ**, **ny** = **њ**, **ty** = **ќ**, **ly** = **ј**; акцентот ја означува **должината**: **a / á, e / é, o / ó, ö / ő, u / ú, ü / ű**. Нагласокот е секогаш на првиот слог.

      Наставките имаат **два облика** (заден/преден): збор со **a, á, o, ó, u, ú** зема **-ban, -ba, -nak, -ból**; збор со **e, é, i, í, ö, ő, ü, ű** зема **-ben, -be, -nek, -ből**: **ház → házban** (во куќата), **kert → kertben** (во градината). Некои имаат **три** (со ö): **-hoz / -hez / -höz**: **házhoz, kerthez, öröm → örömhöz**.
  hu-van:
    meaning: "личните заменки и lenni „биде“"
    intro: |
      **én** јас, **te** ти, **ő** тој/таа (еден збор), **mi** ние, **ti** вие, **ők** тие; учтиво **ön / maga** (мн. **önök / maguk**) со 3 лице. **lenni**: **vagyok, vagy, van, vagyunk, vagytok, vannak**. Во 3 лице **van/vannak** се испушта пред именка или придавка: **Péter orvos.** „Петер е лекар.“, но останува за место: **Péter otthon van.** „Петер е дома.“ Одречно: **nem vagyok**, 3 лице **nincs / nincsenek**.
  hu-present-indef:
    meaning: "сегашното: неопределена конјугација"
    intro: |
      Унгарските глаголи имаат **две конјугации**. **Неопределената** се користи без објект или со неопределен објект (**egy könyvet**, *една книга*):

      | | заден (olvas чита) | преден (beszél зборува) |
      |---|---|---|
      | én | olvas**ok** | beszél**ek** |
      | te | olvas**ol** | beszél**sz** |
      | ő | olvas | beszél |
      | mi | olvas**unk** | beszél**ünk** |
      | ti | olvas**tok** | beszél**tek** |
      | ők | olvas**nak** | beszél**nek** |

      По **s, sz, z** te-формата е **-ol / -el / -öl**: **olvasol, főzöl**. Речничката форма е ő-формата (**olvas**); инфинитивот додава **-ni** (**olvasni**).
  hu-present-def:
    meaning: "определената конјугација: определен објект"
    intro: |
      Со **определен** објект — **a/az** + именка, име, **ezt, azt**, именка со присвојно — глаголот ги зема **определените** наставки — нешто како македонското удвојување на објектот (**ја читам книгата**): **olvasom, olvasod, olvassa, olvassuk, olvassátok, olvassák** (преден: **nézem, nézed, nézi, nézzük, nézitek, nézik**). **Olvasok egy könyvet** (една книга), но **Olvasom a könyvet** (книгата). *Јас … тебе* има посебна наставка **-lak / -lek**: **Szeretlek.** „Те сакам.“
  hu-negation:
    meaning: "негација: nem, nincs, ne"
    intro: |
      **nem** пред глаголот или зборот што се негира: **Nem tudom.** „Не знам.“ 3 лице од *биде* има своја негација: **nincs / nincsenek** „нема“, **Nincs időm.** „Немам време.“ **ne** е за заповеди и желби, како **немој**: **Ne félj!** „Не плаши се!“ Двојната негација е нормална: **Senki sem tudja.** „Никој не знае.“
  hu-questions:
    meaning: "прашални зборови и прашалната честичка -e"
    intro: |
      **ki** кој, **mi** што, **hol** каде, **hová** накаде, **honnan** од каде, **mikor** кога, **miért** зошто, **hogyan / hogy** како, **mennyi** колку, **hány** колку (броиво), **melyik** кој (од нив), **milyen** каков. Прашањата да/не се кренуваат во тонот; во индиректни прашања глаголот зема **-e**, како **дали**: **Nem tudom, jön-e.** „Не знам дали доаѓа.“
  hu-plural:
    meaning: "множината -k"
    intro: |
      **-k**, со сврзна самогласка по согласка: **ház → házak, kert → kertek, gyerek → gyerekek, ló → lovak**; крајното **a / e** се издолжува: **alma → almák, kefe → kefék**. По број или збор за количество именката останува во еднина: **két ház, sok ember**.
  hu-accusative:
    meaning: "акузативот -t: објектот"
    intro: |
      Секој директен објект зема **-t**, често со сврзна самогласка: **könyv → könyvet, ház → házat, alma → almát, bor → bort**. Со определен објект глаголот е определен (претходната лекција): **Látom a házat.** / **Látok egy házat.**
  hu-inner-local:
    meaning: "внатре: инесив -ban, илатив -ba, елатив -ból"
    intro: |
      **-ban / -ben** во, **-ba / -be** во (накај), **-ból / -ből** од внатре: **a házban** (во куќата), **a házba** (во куќата — влегувајќи), **a házból** (од куќата). Повеќето земји и градови ги земаат овие: **Budapesten** е исклучок (надворешни падежи), **Brazíliában** е правилно.
  hu-outer-local:
    meaning: "на: суперсив -on, сублатив -ra, делатив -ról"
    intro: |
      **-n / -on / -en / -ön** на, **-ra / -re** на (накај), **-ról / -ről** од (горе), за: **az asztalon** (на масата), **az asztalra** (на масата — ставајќи), **a filmről beszélünk** (зборуваме за филмот). Унгарските градови и многу места ги земаат овие: **Budapesten, Magyarországon, a postán** (на пошта).
  hu-near-local:
    meaning: "кај, кон, од (лице или место): -nál, -hoz, -tól"
    intro: |
      **-nál / -nél** кај, **-hoz / -hez / -höz** кон, **-tól / -től** од: **az orvosnál** (кај лекарот), **az orvoshoz** (кон лекарот), **az orvostól** (од лекарот). Луѓето секогаш ги земаат овие за *кон, од, кај*: **Anyámhoz megyek.** „Одам кај мајка ми.“
  hu-dative:
    meaning: "дативот -nak / -nek: на, за; поседување"
    intro: |
      **-nak / -nek**: лицето на кое или за кое нешто се дава (**Adok egy könyvet Péternek.** „Му давам книга на Петер.“), и сопственикот во реченици со *има*: **Péternek van egy autója.** „Петер има кола.“
  hu-instrumental:
    meaning: "инструменталот -val / -vel: со"
    intro: |
      **-val / -vel**, при што **v** се изедначува со крајната согласка: **busszal** (со автобус), **tollal** (со пенкало), **a barátommal** (со мојот пријател), **Annával**. По самогласка **v** останува: **autóval**.
  hu-possessive:
    meaning: "присвојни наставки"
    intro: |
      Припадноста е наставка на она што се поседува: **ház-am** мојата куќа, **ház-ad** твојата, **ház-a** неговата/нејзината, **ház-unk** нашата, **ház-atok** вашата, **ház-uk** нивната (преден: **kert-em, kert-ed, kert-je, kert-ünk, kert-etek, kert-jük**). Именката-сопственик стои пред: **Péter háza** „куќата на Петер“. *Има* е **van** + поседуваната именка: **Van egy kutyám.** „Имам куче.“
  hu-past:
    meaning: "минатото -t- / -tt-"
    intro: |
      **-t-** или **-tt-** + наставките, во двете конјугации: неопределена **olvastam, olvastál, olvasott, olvastunk, olvastatok, olvastak**; определена **olvastam, olvastad, olvasta, olvastuk, olvastátok, olvasták**. Унгарскиот има само едно минато време.
  hu-future:
    meaning: "идното: fog + инфинитив"
    intro: |
      **fogok, fogsz, fog, fogunk, fogtok, fognak** + инфинитив: **Holnap dolgozni fogok.** „Утре ќе работам.“ Често е доволно сегашното со збор за време: **Holnap jövök.** „Доаѓам утре.“
  hu-prefixes:
    meaning: "глаголски представки: be-, ki-, el-, meg-, fel-, le-"
    intro: |
      **be-** внатре, **ki-** надвор, **fel- / föl-** горе, **le-** долу, **el-** настрана, **vissza-** назад, **át-** преку, **meg-** (завршено, како свршен вид): **bemegy** влегува, **kimegy** излегува, **elmegy** заминува, **megír** напишува. Представката оди по глаголот кога нешто е во фокус или при негација: **Nem megyek be.** „Не влегувам.“
  hu-imperative:
    meaning: "заповедниот начин -j"
    intro: |
      **-j** + наставки (изедначено по s, sz, z, t): **várj!** (чекај), **olvass!** (читај), **nézz!** (гледај); определено **olvasd el!** Неправилни: **menj** (оди), **gyere** (дојди), **legyél / légy** (биди). Изразува и желби и цел по **hogy**, како **да**: **Mondd meg neki, hogy jöjjön!** „Кажи му да дојде!“ Одречно со **ne**: **Ne menj!** „Немој да одиш!“
