# German text of the Hungarian course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Conditional and clauses: "Konditional und Nebensätze"
  Verbal prefixes in the sentence: "Verbalpräfixe im Satz"
  Derived verbs: "Abgeleitete Verben"
  Participles: "Partizipien"
  More cases: "Weitere Kasus"
lessons:
  hu-conditional:
    meaning: "der Konditional -na / -ne"
    intro: |
      **-na- / -ne-** + Endungen: **olvasnék, olvasnál, olvasna** (unbest.), **olvasnám, olvasnád, olvasná** (best.). Wünsche und höfliche Bitten (**Szeretnék egy kávét.** „Ich hätte gern einen Kaffee.“) und irreale Bedingungen mit **ha**: **Ha lenne időm, eljönnék.** „Hätte ich Zeit, käme ich.“
  hu-conjunctions:
    meaning: "dass, weil, wenn, aber"
    intro: |
      **hogy** dass, **mert** weil, **ha** wenn/falls, **amikor** als/wenn, **de** aber, **vagy** oder, **és** und, **tehát** also, **mivel** da, **bár** obwohl, **mielőtt** bevor, **miután** nachdem. Vor einem Nebensatz steht immer ein Komma; der Hauptsatz hat oft ein Verweiswort: **Azt mondta, hogy jön.** „Er sagte, dass er kommt.“
  hu-relative:
    meaning: "Relativpronomen: aki, ami, amely"
    intro: |
      **aki** (Personen), **ami / amely** (Dinge), dekliniert wie Nomen: **a férfi, aki itt lakik** „der Mann, der hier wohnt“, **a könyv, amit olvasok** „das Buch, das ich lese“, **a ház, amelyben lakom** „das Haus, in dem ich wohne“. Auch **ahol** wo, **amikor** wann.
  hu-prefix-separation:
    meaning: "das Präfix nach dem Verb: Verneinung und Fragen"
    intro: |
      Im neutralen Aussagesatz bleibt das Präfix am Verb (**Bemegyek.** „Ich gehe hinein.“), tritt aber **hinter** das Verb, wenn etwas anderes den Platz direkt davor einnimmt:

      - Verneinung: **Nem megyek be.** „Ich gehe nicht hinein.“ **Ne nyisd ki!** „Mach es nicht auf!“
      - ein Fragewort: **Mikor jössz haza?** „Wann kommst du nach Hause?“
      - ein fokussiertes Wort: **Péter hívott fel, nem Anna.** „Péter hat angerufen, nicht Anna.“
  hu-prefix-aspect:
    meaning: "meg- und andere Präfixe für eine abgeschlossene Handlung"
    intro: |
      Ohne Präfix beschreibt ein Verb oft eine Tätigkeit, mit Präfix eine zu Ende geführte Handlung. **meg-** fügt meist nur diese Abgeschlossenheit hinzu:

      - **Írtam egy levelet.** „Ich schrieb (an) einem Brief.“ – **Megírtam a levelet.** „Ich habe den Brief fertig geschrieben.“
      - **Ettem.** „Ich habe (etwas) gegessen.“ – **Megettem a levest.** „Ich habe die Suppe aufgegessen.“
      - **Olvastam a könyvet.** „Ich las in dem Buch.“ – **Elolvastam a könyvet.** „Ich habe das Buch durchgelesen.“

      Manche Verben paaren sich mit **el-** (**olvas → elolvas**), **meg-** ist der Normalfall (**csinál → megcsinál, néz → megnéz**).
  hu-prefix-auxiliary:
    meaning: "das Präfix vor akar, tud, fog, kell"
    intro: |
      Mit einem Hilfsverb (**akar, tud, fog, kell, szeret, kezd, szokott, lehet**) verlässt das Präfix den Infinitiv und steht vor dem Hilfsverb: **El akarok menni.** „Ich will weggehen.“ **Meg tudod csinálni?** „Kannst du es machen?“ **Haza fogok menni.** „Ich werde nach Hause gehen.“

      Bei Verneinung oder Fokus kehrt es zum Infinitiv zurück: **Nem akarok elmenni.** „Ich will nicht weggehen.“
  hu-potential:
    meaning: "-hat / -het: können, dürfen"
    intro: |
      **-hat / -het** vor der Personalendung heißt *dürfen, können*: **Bejöhetek?** „Darf ich hereinkommen?“ **Itt dohányozhatsz.** „Hier darfst du rauchen.“ **Ez igaz lehet.** „Das kann wahr sein.“ (**lehet** von **van**). Vergleiche **tud** (*können, gelernt*): **Tudok úszni.** „Ich kann schwimmen.“
  hu-causative:
    meaning: "-tat / -tet: etwas machen lassen"
    intro: |
      **-tat / -tet** (nach Vokal oder zweisilbigen Stämmen) und **-at / -et** (nach vielen einsilbigen) machen ein Verb kausativ: *jemanden etwas tun lassen*:

      - **javít → javíttat**: **Megjavíttattam az autót.** „Ich habe das Auto reparieren lassen.“
      - **ír → írat**, **vár → várat**: **Ne várass!** „Lass mich nicht warten!“
      - **nevet → nevettet** (zum Lachen bringen), **dolgozik → dolgoztat** (arbeiten lassen)

      Wer handeln soll, steht im Akkusativ oder mit **-val / -vel**: **Megcsináltatom a szerelővel.** „Ich lasse es vom Mechaniker machen.“
  hu-frequentative:
    meaning: "-gat / -get: ab und zu, ein bisschen"
    intro: |
      **-gat / -get** (auch **-ogat, -eget**) macht eine Handlung wiederholt, beiläufig oder verteilt: **olvas → olvasgat** „hier und da lesen“, **néz → nézeget** „sich anschauen, stöbern“, **kérdez → kérdezget** „immer wieder fragen“, **ír → írogat** „ab und zu schreiben“. **-kál / -kél** ist ähnlich: **jár → járkál** „auf und ab gehen“.
  hu-participles:
    meaning: "Partizipien: -ó (der tut), -t (getan), -andó (zu tun)"
    intro: |
      Drei Partizipien stehen wie Adjektive vor dem Nomen:

      - **-ó / -ő** (tuend): **az olvasó fiú** „der lesende Junge“, **a következő megálló** „die nächste Haltestelle“
      - **-t / -tt** (getan): **a megírt levél** „der geschriebene Brief“, **a tegnap vett kenyér** „das gestern gekaufte Brot“
      - **-andó / -endő** (zu tun): **a megoldandó feladat** „die zu lösende Aufgabe“, **fizetendő összeg** „zu zahlender Betrag“

      Sie ersetzen Relativsätze: **a fiú, aki olvas = az olvasó fiú**.
  hu-adverbial-participle:
    meaning: "-va / -ve: in einem Zustand, während"
    intro: |
      **-va / -ve** beschreibt einen Zustand als Ergebnis einer Handlung oder die Art, wie etwas getan wird:

      - mit **van**: **Az ajtó nyitva van.** „Die Tür ist offen.“ **A bolt zárva van.** „Der Laden ist geschlossen.“ **Meg van írva.** „Es ist geschrieben.“
      - Art und Weise: **Ülve olvasott.** „Er las im Sitzen.“ **Sietve távozott.** „Sie ging eilig weg.“
  hu-translative-essive:
    meaning: "-vá / -vé (werden zu), -ként (als), -ul / -ül (auf einer Sprache, als)"
    intro: |
      - **-vá / -vé** (Translativ): Verwandlung, mit **válik, lesz**: **Orvossá vált.** „Er wurde Arzt.“ **A víz jéggé fagyott.** „Das Wasser gefror zu Eis.“ Das **v** gleicht sich nach Konsonant an: **jég → jéggé**.
      - **-ként** (förmlich): in der Rolle von: **Tanárként dolgozik.** „Sie arbeitet als Lehrerin.“
      - **-ul / -ül** (Essiv-Modal): Sprachen und Art: **magyarul** „auf Ungarisch“, **jól** „gut“, **barátul** „als Freund“.
  hu-causal-terminative:
    meaning: "-ért (für, im Tausch gegen) und -ig (bis)"
    intro: |
      - **-ért** (Kausal-Final): *für* einen Zweck, einen Preis oder eine Person: **Elmegyek kenyérért.** „Ich gehe Brot holen.“ **Mennyiért vetted?** „Für wie viel hast du es gekauft?“ **Köszönöm a segítségért.** „Danke für die Hilfe.“ **Miért?** „Warum?“ ist dieselbe Endung.
      - **-ig** (Terminativ): *bis*: **ötig** „bis fünf“, **a sarokig** „bis zur Ecke“, **holnapig** „bis morgen“.
  hu-time-suffixes:
    meaning: "-kor (um), -nta / -nként (jeden)"
    intro: |
      - **-kor** gibt einen Zeitpunkt an, ohne Vokalharmonie: **hétkor** „um sieben“, **éjfélkor** „um Mitternacht“, **karácsonykor** „zu Weihnachten“, **Hány órakor?** „Um wie viel Uhr?“
      - **-nta / -nte** und **-nként** geben Häufigkeit oder Verteilung an: **naponta** „täglich“, **hetente** „wöchentlich“, **havonta** „monatlich“, **évente** „jährlich“, **óránként** „stündlich, pro Stunde“, **egyenként** „einzeln“.
