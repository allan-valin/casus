# Macedonian text of the Hungarian course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Word order and focus: "Ред на зборовите и фокус"
  Subjunctive and conditional: "Конјунктив и условен начин"
  Formal style: "Официјален стил"
  Verbs in depth: "Глаголите во длабочина"
  Word formation: "Зборообразување"
  Discourse: "Дискурс"
lessons:
  hu-focus:
    meaning: "фокусот: нагласениот збор веднаш пред глаголот"
    intro: |
      Унгарскиот ред на зборовите ја следи информацијата, не граматичките улоги. Местото **веднаш пред глаголот** е *фокусот*: новиот или спротивставениот елемент, изговорен со нагласок. Што стои таму, ја турка глаголската представка зад глаголот:

      - неутрално: **Péter felhívta Annát.** „Петер ѝ се јави на Ана.“
      - фокус на Петер: **Péter hívta fel Annát.** „ПЕТЕР ѝ се јави на Ана.“
      - фокус на Ана: **Annát hívta fel Péter.** „На АНА ѝ се јави Петер.“
      - и **csak** (само) означува фокус: **Csak én jöttem el.** „Само јас дојдов.“

      Прашалните зборови секогаш се во фокусот: **Ki hívta fel Annát?**
  hu-is-sem:
    meaning: "is (и) и sem (ни) по зборот на кој се однесуваат"
    intro: |
      **is** „и, дури“ и **sem / se** „ни, дури ни“ доаѓаат по зборот што го определуваат, а местото го менува значењето: **Én is jövök.** „И јас доаѓам.“ **Jövök is.** „И ќе дојдам, навистина.“ **Én sem tudom.** „Ни јас не знам.“ **Egy szót sem szólt.** „Ни збор не кажа.“ Со **sem** по одречен збор не треба **nem**: **Senki sem jött.** „Никој не дојде.“
  hu-pointer-words:
    meaning: "показни зборови: azt, arról, abban … пред реченица со hogy"
    intro: |
      Реченицата со **hogy** не може сама да земе падежна наставка, па главната реченица носи форма од **az** со падежот што го бара глаголот и покажува напред — како македонското **за тоа дека**:

      - **Azt mondta, hogy …** (mond + акузатив)
      - **Arról beszéltünk, hogy …** (beszél valamiről)
      - **Abban reménykedem, hogy …** (reménykedik valamiben)
      - **Annak örülök, hogy …** (örül valaminek)
      - **Arra gondoltam, hogy …** (gondol valamire)
      - **Attól félek, hogy …** (fél valamitől)
  hu-subjunctive-hogy:
    meaning: "конјунктивот по akar, kér, kell, fontos + hogy"
    intro: |
      Заповедните форми служат и како конјунктив по глаголи на сакање, барање и наредување и по изрази за нужност — каде македонскиот има **да**: **Azt akarom, hogy eljöjj.** „Сакам да дојдеш.“ **Kérlek, hogy segíts.** „Те молам да помогнеш.“ **Fontos, hogy pontosan érkezz.** „Важно е да стигнеш на време.“ **Mondd meg neki, hogy hívjon fel.** „Кажи му да ми се јави.“
  hu-purpose:
    meaning: "цел: azért, hogy + конјунктив"
    intro: |
      *За да* е **(azért,) hogy** + конјунктив: **Azért jöttem, hogy beszéljünk.** „Дојдов за да зборуваме.“ **Korán keltem, hogy ne késsek el.** „Станав рано за да не задоцнам.“ Спореди **azért, mert** „затоа што“: **Azért jöttem, mert hívtál.**
  hu-past-conditional:
    meaning: "минатиот условен: минато + volna"
    intro: |
      Нереално минато = минато време + **volna**: **Ha tudtam volna, eljöttem volna.** „Да знаев, ќе дојдев.“ **Szívesen segítettem volna.** „Со задоволство ќе помогнев.“ Желби: **Bárcsak ott lettem volna!** „Барем да бев таму!“
  hu-van-converb:
    meaning: "-ván / -vén: откако направил, бидејќи (книжевно)"
    intro: |
      **-ván / -vén** е официјалната, книжевна форма на **-va / -ve**: дејство што се случува пред главното или го објаснува: **Látván, hogy senki sincs otthon, elment.** „Гледајќи дека никој не е дома, си отиде.“ **Belépvén a terembe, köszönt.** „Влегувајќи во салата, поздрави.“ Говорот претпочита реченици со **amikor, mivel**.
  hu-personal-infinitive:
    meaning: "личниот инфинитив: mennem, menned, mennie"
    intro: |
      По **kell, lehet, szabad, muszáj, sikerül, érdemes** инфинитивот зема лични наставки, а лицето може да се додаде во датив: **Mennem kell.** „Морам да одам.“ **Neked kell eldöntened.** „Ти треба да одлучиш.“ **Nem szabad dohányoznia.** „Не смее да пуши.“ **Sikerült megoldanunk.** „Успеавме да го решиме.“

      | | заден | преден |
      |---|---|---|
      | 1 едн. | -nom | -nem |
      | 2 едн. | -nod | -ned |
      | 3 едн. | -nia | -nie |
      | 1 мн. | -nunk | -nünk |
      | 2 мн. | -notok | -netek |
      | 3 мн. | -niuk | -niük |
  hu-nominalization:
    meaning: "-ás / -és: дејството како именка"
    intro: |
      **-ás / -és** прави од глагол именка за дејство — како македонското **-ње**: **olvas → olvasás** (читање), **dönt → döntés** (одлука), **fejleszt → fejlesztés** (развој). Официјалниот унгарски ги низа со присвојни: **a döntés meghozatala** „донесувањето на одлуката“, **a lakás felújítása** „реновирањето на станот“.
  hu-formal-address:
    meaning: "учтивото „Вие“: ön, maga, tetszik + инфинитив"
    intro: |
      Учтивото *Вие* зема глагол во 3 лице: **Ön honnan jön?** „Од каде сте?“ **ön** е учтиво и официјално; **maga** е често во говорот, но може да звучи ладно; децата и помладите им се обраќаат на постарите со **tetszik** + инфинитив: **Hova tetszik menni?** „Каде одите (госпоѓо/господине)?“ Множина **önök, maguk**.
  hu-possessive-e:
    meaning: "-é (чиј: на Петер) и -ék (семејството, групата)"
    intro: |
      **-é** стои за сопственик без поседуваното: **Kié ez a könyv? – Péteré.** „Чија е книгава? – На Петер.“ **Az enyém, a tiéd, az övé** „моја, твоја, негова/нејзина“. **-ék** значи некој и неговото семејство или група: **Kovácsék** „Ковачеви“, **Péterék** „Петер и неговите“, **Péteréknél** „кај Петерови“.
  hu-causee:
    meaning: "кој е натеран да дејствува: -val / -vel или акузатив"
    intro: |
      Кај каузативен глагол лицето што е натерано да дејствува се означува различно според видот на глаголот:

      - преодна основа (глаголот веќе има објект): лицето зема **-val / -vel**: **Megjavíttattam az autót a szerelővel.** „Му дадов на механичарот да ја поправи колата.“ **Leveleket íratott a titkárnőjével.** „Ја натера секретарката да пишува писма.“
      - непреодна основа: лицето е објект, во акузатив: **A tanár dolgoztatja a diákokat.** „Наставникот ги тера учениците да работат.“ **Megnevettette a gyerekeket.** „Ги насмеа децата.“
  hu-ik-verbs:
    meaning: "-ik глаголи: грижливото 1 лице на -m"
    intro: |
      Глаголите запишани со **-ik** (**eszik, iszik, lakik, dolgozik, alszik**) имаат свои форми во неопределеното сегашно: 3 едн. на **-ik**, а во грижлив, пишан и стандарден говор 1 едн. на **-m**: **eszem, iszom, lakom, dolgozom**. Секојдневниот говор често користи **-k** како кај другите (**lakok, dolgozok**); пуристите не го одобруваат. Условниот ја следи истата поделба: **ennék / enném**.
  hu-progressive:
    meaning: "прогресив: представката по глаголот кај дејство во позадина"
    intro: |
      Унгарскиот нема прогресивно време, но редот на зборовите може да покаже дејство во тек: представката оди зад глаголот и без фокус, обично со **éppen / épp** и реченица со **amikor**: **Éppen mentem át az úton, amikor megláttam.** „Токму ја преминував улицата кога го видов.“ Спореди завршеното **Átmentem az úton.** „Ја преминав улицата.“
  hu-stative-converb:
    meaning: "представка + van + -va: резултатната состојба"
    intro: |
      **van** + формата **-va / -ve**, со представката пред **van**, опишува завршена состојба — како македонското **е напишано**: **A levél meg van írva.** „Писмото е напишано.“ **Az ajtó be van zárva.** „Вратата е заклучена.“ **Minden el van intézve.** „Сè е средено.“ Одречно: **nincs megírva**.
  hu-narrative-past:
    meaning: "стари минати форми во книжевноста и Библијата"
    intro: |
      Постарата книжевност има времиња што модерниот унгарски ги изгубил: раскажувачкото минато **-á / -é** (**monda** „рече“, **kezde** „почна“, **láta** „виде“), **vala** „беше“ (минато од **van**, и како помошен: **írt vala** „беше напишал“), **lőn** „стана, биде“, **vagyon** „е“, **lészen** „ќе биде“. Доволно е да ги препознаваш: **Monda pedig Isten: Legyen világosság! És lőn világosság.** „И рече Бог: Да биде светлина! И биде светлина.“
  hu-hatatlan:
    meaning: "-hatatlan / -hetetlen: не-…-лив, невозможно е"
    intro: |
      **-hat / -het** (може) + **-atlan / -etlen** (без) дава *не-…-лив*: **hisz → hihetetlen** „неверојатен“, **elképzel → elképzelhetetlen** „незамислив“, **kibír → kibírhatatlan** „неподнослив“, **elkerül → elkerülhetetlen** „неизбежен“. Неговиот позитивен пар е **-ható / -hető**: **hihető** „веројатен“, **elkerülhető** „избеглив“. Со **-ul / -ül** станува прилог: **hihetetlenül** „неверојатно“.
  hu-reciprocal:
    meaning: "еден со друг: egymás и неговите падежи"
    intro: |
      **egymás** „еден друг“ се менува како именка и го зема падежот што го бара глаголот: **Szeretik egymást.** „Се сакаат еден со друг.“ **Beszélnek egymással.** „Зборуваат еден со друг.“ **Gondolnak egymásra.** „Мислат еден на друг.“ **Egymás mellett ültek.** „Седеа еден до друг.“
  hu-concessive:
    meaning: "иако, сепак: официјална допусност"
    intro: |
      Покрај **bár** и **habár**: **noha, jóllehet, ámbár** (иако, официјално), **holott** (а пак, иако всушност), а во главната **mégis, mégsem** (сепак, сепак не), **ennek ellenére** (и покрај тоа), **mindazonáltal** (и покрај сè): **Noha fáradt volt, mégis eljött.** „Иако беше уморен, сепак дојде.“
  hu-indefinite-series:
    meaning: "низите заменки: vala-, bár- / akár-, mind-, se-"
    intro: |
      Прашалните зборови градат четири низи со представки — многу слично на македонските **не-, било-, се-, ни-**:

      | | кој | што | каде | кога |
      |---|---|---|---|---|
      | не- **vala-** | valaki | valami | valahol | valamikor |
      | било- **bár- / akár-** | bárki | bármi | bárhol | bármikor |
      | се- **mind-** | mindenki | minden | mindenhol | mindig |
      | ни- **se-** | senki | semmi | sehol | soha |

      **bár- / akár-** значи *било кој*: **Bárki megcsinálhatja.** „Било кој може да го направи.“ Низата **se-** бара **nem / sem** кај глаголот: **Senki sem jött.**
  hu-particles:
    meaning: "дискурсни честички"
    intro: |
      Мали зборови што го задаваат тонот на реченицата:

      - **ugye** бара согласување: **Jössz, ugye?** „Доаѓаш, нели?“
      - **hiszen** „па, бидејќи“: **Hiszen tudod!** „Па ти знаеш!“
      - **ugyan** се сомнева или одмавнува: **Ugyan, hagyd!** „Ма, остави!“ **Ugyan ki tudná?** „Кој ли би знаел?“
      - **hát** „па“: **Hát, nem tudom.** „Па, не знам.“
      - **csak** омекнува барање или значи *само*: **Gyere csak!** „Ајде дојди!“
      - **persze** „секако“, **bezzeg** „а пак (прекорно)“
