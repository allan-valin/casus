# German text of the Hungarian course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Word order and focus: "Wortstellung und Fokus"
  Subjunctive and conditional: "Konjunktiv und Konditional"
  Formal style: "Formeller Stil"
  Verbs in depth: "Verben im Detail"
  Word formation: "Wortbildung"
  Discourse: "Diskurs"
lessons:
  hu-focus:
    meaning: "der Fokus: das betonte Wort direkt vor dem Verb"
    intro: |
      Die ungarische Wortstellung folgt der Information, nicht den grammatischen Rollen. Der Platz **direkt vor dem Verb** ist der *Fokus*: das neue oder kontrastierte Element, betont gesprochen. Was dort steht, schiebt das Verbalpräfix hinter das Verb:

      - neutral: **Péter felhívta Annát.** „Péter rief Anna an.“
      - Fokus auf Péter: **Péter hívta fel Annát.** „Péter war es, der Anna anrief.“
      - Fokus auf Anna: **Annát hívta fel Péter.** „Anna war es, die Péter anrief.“
      - auch **csak** (nur) markiert einen Fokus: **Csak én jöttem el.** „Nur ich bin gekommen.“

      Fragewörter stehen immer im Fokus: **Ki hívta fel Annát?**
  hu-is-sem:
    meaning: "is (auch) und sem (auch nicht) nach ihrem Bezugswort"
    intro: |
      **is** „auch, sogar“ und **sem / se** „auch nicht, nicht einmal“ folgen dem Wort, auf das sie sich beziehen, und ihre Stellung ändert die Bedeutung: **Én is jövök.** „Ich komme auch.“ **Jövök is.** „Und ich komme auch (tatsächlich).“ **Én sem tudom.** „Ich weiß es auch nicht.“ **Egy szót sem szólt.** „Er sagte kein einziges Wort.“ Mit **sem** nach einem verneinenden Wort braucht es kein **nem**: **Senki sem jött.** „Niemand kam.“
  hu-pointer-words:
    meaning: "Verweiswörter: azt, arról, abban … vor einem hogy-Satz"
    intro: |
      Ein **hogy**-Satz kann selbst keine Kasusendung tragen, darum trägt der Hauptsatz eine Form von **az** im Kasus, den das Verb verlangt, und verweist voraus — wie deutsch *darüber, dass*:

      - **Azt mondta, hogy …** (mond + Akkusativ)
      - **Arról beszéltünk, hogy …** (beszél valamiről)
      - **Abban reménykedem, hogy …** (reménykedik valamiben)
      - **Annak örülök, hogy …** (örül valaminek)
      - **Arra gondoltam, hogy …** (gondol valamire)
      - **Attól félek, hogy …** (fél valamitől)
  hu-subjunctive-hogy:
    meaning: "der Konjunktiv nach akar, kér, kell, fontos + hogy"
    intro: |
      Die Imperativformen dienen zugleich als Konjunktiv nach Verben des Wollens, Bittens und Befehlens sowie nach Ausdrücken der Notwendigkeit: **Azt akarom, hogy eljöjj.** „Ich will, dass du kommst.“ **Kérlek, hogy segíts.** „Bitte hilf.“ **Fontos, hogy pontosan érkezz.** „Es ist wichtig, dass du pünktlich kommst.“ **Mondd meg neki, hogy hívjon fel.** „Sag ihm, er soll mich anrufen.“
  hu-purpose:
    meaning: "Zweck: azért, hogy + Konjunktiv"
    intro: |
      *Um zu / damit* ist **(azért,) hogy** + Konjunktiv: **Azért jöttem, hogy beszéljünk.** „Ich bin gekommen, damit wir reden.“ **Korán keltem, hogy ne késsek el.** „Ich bin früh aufgestanden, um nicht zu spät zu kommen.“ Vergleiche **azért, mert** „weil“: **Azért jöttem, mert hívtál.**
  hu-past-conditional:
    meaning: "der Konditional der Vergangenheit: Vergangenheit + volna"
    intro: |
      Irreale Vergangenheit = Vergangenheitsform + **volna**: **Ha tudtam volna, eljöttem volna.** „Hätte ich es gewusst, wäre ich gekommen.“ **Szívesen segítettem volna.** „Ich hätte gern geholfen.“ Wünsche: **Bárcsak ott lettem volna!** „Wäre ich doch dort gewesen!“
  hu-van-converb:
    meaning: "-ván / -vén: getan habend, da (literarisch)"
    intro: |
      **-ván / -vén** ist die förmliche, literarische Form von **-va / -ve**: eine Handlung, die vor der Haupthandlung geschieht oder sie begründet: **Látván, hogy senki sincs otthon, elment.** „Da er sah, dass niemand zu Hause war, ging er.“ **Belépvén a terembe, köszönt.** „Beim Betreten des Saals grüßte er.“ Gesprochen nimmt man **amikor, mivel**-Sätze.
  hu-personal-infinitive:
    meaning: "der persönliche Infinitiv: mennem, menned, mennie"
    intro: |
      Nach **kell, lehet, szabad, muszáj, sikerül, érdemes** nimmt der Infinitiv Personalendungen, und die Person kann im Dativ hinzukommen: **Mennem kell.** „Ich muss gehen.“ **Neked kell eldöntened.** „Du musst entscheiden.“ **Nem szabad dohányoznia.** „Er darf nicht rauchen.“ **Sikerült megoldanunk.** „Es ist uns gelungen, es zu lösen.“

      | | hinten | vorn |
      |---|---|---|
      | 1. Sg. | -nom | -nem |
      | 2. Sg. | -nod | -ned |
      | 3. Sg. | -nia | -nie |
      | 1. Pl. | -nunk | -nünk |
      | 2. Pl. | -notok | -netek |
      | 3. Pl. | -niuk | -niük |
  hu-nominalization:
    meaning: "-ás / -és: die Handlung als Nomen"
    intro: |
      **-ás / -és** macht aus einem Verb ein Handlungsnomen — wie deutsch *-ung*: **olvas → olvasás** (Lesen), **dönt → döntés** (Entscheidung), **fejleszt → fejlesztés** (Entwicklung). Förmliches Ungarisch reiht sie mit Possessiven: **a döntés meghozatala** „das Treffen der Entscheidung“, **a lakás felújítása** „die Renovierung der Wohnung“.
  hu-formal-address:
    meaning: "das förmliche „Sie“: ön, maga, tetszik + Infinitiv"
    intro: |
      Das förmliche *Sie* nimmt das Verb in der 3. Person: **Ön honnan jön?** „Woher kommen Sie?“ **ön** ist höflich und amtlich; **maga** ist gesprochen häufig, kann aber kühl klingen; Kinder und Jüngere sprechen Ältere mit **tetszik** + Infinitiv an: **Hova tetszik menni?** „Wohin gehen Sie (gnädige Frau / mein Herr)?“ Plural **önök, maguk**.
  hu-possessive-e:
    meaning: "-é (wessen: Péters) und -ék (die Familie, die Gruppe)"
    intro: |
      **-é** steht für einen Besitzer ohne das Besitztum: **Kié ez a könyv? – Péteré.** „Wessen Buch ist das? – Péters.“ **Az enyém, a tiéd, az övé** „meins, deins, seins/ihrs“. **-ék** heißt jemand mit seiner Familie oder Gruppe: **Kovácsék** „die Familie Kovács“, **Péterék** „Péter und seine Familie / Freunde“, **Péteréknél** „bei Péter zu Hause“.
  hu-causee:
    meaning: "wer handeln soll: -val / -vel oder der Akkusativ"
    intro: |
      Beim Kausativ wird die Person, die handeln soll, je nach Verbart unterschiedlich markiert:

      - transitive Basis (das Verb hat schon ein Objekt): die veranlasste Person nimmt **-val / -vel**: **Megjavíttattam az autót a szerelővel.** „Ich ließ den Mechaniker das Auto reparieren.“ **Leveleket íratott a titkárnőjével.** „Er ließ seine Sekretärin Briefe schreiben.“
      - intransitive Basis: die Person ist Objekt, im Akkusativ: **A tanár dolgoztatja a diákokat.** „Der Lehrer lässt die Schüler arbeiten.“ **Megnevettette a gyerekeket.** „Er brachte die Kinder zum Lachen.“
  hu-ik-verbs:
    meaning: "-ik-Verben: die sorgfältige 1. Person auf -m"
    intro: |
      Verben, die mit **-ik** verzeichnet sind (**eszik, iszik, lakik, dolgozik, alszik**), haben im unbestimmten Präsens eigene Formen: 3. Singular auf **-ik** und in sorgfältiger, schriftlicher und Standardsprache 1. Singular auf **-m**: **eszem, iszom, lakom, dolgozom**. Die Alltagssprache nimmt oft **-k** wie andere Verben (**lakok, dolgozok**); Sprachpuristen rümpfen die Nase. Der Konditional folgt derselben Spaltung: **ennék / enném**.
  hu-progressive:
    meaning: "die Verlaufsform: Präfix nach dem Verb bei einer Hintergrundhandlung"
    intro: |
      Ungarisch hat kein Verlaufstempus, aber die Wortstellung kann eine laufende Handlung zeigen: das Präfix tritt auch ohne Fokus hinter das Verb, typisch mit **éppen / épp** und einem **amikor**-Satz: **Éppen mentem át az úton, amikor megláttam.** „Ich überquerte gerade die Straße, als ich ihn sah.“ Vergleiche das abgeschlossene **Átmentem az úton.** „Ich überquerte die Straße.“
  hu-stative-converb:
    meaning: "Präfix + van + -va: der Ergebniszustand"
    intro: |
      **van** + die **-va / -ve**-Form, mit dem Präfix vor **van**, beschreibt einen fertigen Zustand, nahe am deutschen Zustandspassiv: **A levél meg van írva.** „Der Brief ist geschrieben.“ **Az ajtó be van zárva.** „Die Tür ist abgeschlossen.“ **Minden el van intézve.** „Alles ist erledigt.“ Verneint: **nincs megírva**.
  hu-narrative-past:
    meaning: "alte Vergangenheitsformen in Literatur und Bibel"
    intro: |
      Ältere Literatur hat Tempora, die das moderne Ungarisch verloren hat: die Erzählvergangenheit **-á / -é** (**monda** „er sprach“, **kezde** „er begann“, **láta** „er sah“), **vala** „war“ (Vergangenheit von **van**, auch als Hilfsverb: **írt vala** „er hatte geschrieben“), **lőn** „wurde, ward“, **vagyon** „ist“, **lészen** „wird sein“. Sie zu erkennen genügt: **Monda pedig Isten: Legyen világosság! És lőn világosság.** „Und Gott sprach: Es werde Licht! Und es ward Licht.“
  hu-hatatlan:
    meaning: "-hatatlan / -hetetlen: un-…-bar"
    intro: |
      **-hat / -het** (können) + **-atlan / -etlen** (ohne) ergibt *un-…-bar*: **hisz → hihetetlen** „unglaublich“, **elképzel → elképzelhetetlen** „unvorstellbar“, **kibír → kibírhatatlan** „unerträglich“, **elkerül → elkerülhetetlen** „unvermeidlich“. Sein positives Gegenstück ist **-ható / -hető**: **hihető** „glaubhaft“, **elkerülhető** „vermeidbar“. Mit **-ul / -ül** wird es zum Adverb: **hihetetlenül** „unglaublich (Adv.)“.
  hu-reciprocal:
    meaning: "einander: egymás und seine Kasus"
    intro: |
      **egymás** „einander“ wird wie ein Nomen dekliniert und nimmt den Kasus, den das Verb verlangt: **Szeretik egymást.** „Sie lieben einander.“ **Beszélnek egymással.** „Sie reden miteinander.“ **Gondolnak egymásra.** „Sie denken aneinander.“ **Egymás mellett ültek.** „Sie saßen nebeneinander.“
  hu-concessive:
    meaning: "obwohl, dennoch: förmliche Einräumung"
    intro: |
      Neben **bár** und **habár**: **noha, jóllehet, ámbár** (obwohl, förmlich), **holott** (wohingegen, obwohl doch), und im Hauptsatz **mégis, mégsem** (dennoch, dennoch nicht), **ennek ellenére** (trotzdem), **mindazonáltal** (nichtsdestoweniger): **Noha fáradt volt, mégis eljött.** „Obwohl er müde war, kam er dennoch.“
  hu-indefinite-series:
    meaning: "die Pronomenreihen: vala-, bár- / akár-, mind-, se-"
    intro: |
      Fragewörter bilden mit Präfixen vier Reihen:

      | | wer | was | wo | wann |
      |---|---|---|---|---|
      | irgend- **vala-** | valaki | valami | valahol | valamikor |
      | beliebig **bár- / akár-** | bárki | bármi | bárhol | bármikor |
      | jeder **mind-** | mindenki | minden | mindenhol | mindig |
      | kein **se-** | senki | semmi | sehol | soha |

      **bár- / akár-** heißt *irgendein beliebiger, wer auch immer*: **Bárki megcsinálhatja.** „Jeder kann es machen.“ Die **se-**-Reihe verlangt **nem / sem** beim Verb: **Senki sem jött.**
  hu-particles:
    meaning: "Diskurspartikeln"
    intro: |
      Kleine Wörter, die den Ton eines Satzes bestimmen:

      - **ugye** bittet um Zustimmung: **Jössz, ugye?** „Du kommst doch, oder?“
      - **hiszen** „ja doch, da ja“: **Hiszen tudod!** „Du weißt es doch!“
      - **ugyan** zweifelt oder wehrt ab: **Ugyan, hagyd!** „Ach, lass doch!“ **Ugyan ki tudná?** „Wer könnte das schon wissen?“
      - **hát** „na ja, also“: **Hát, nem tudom.** „Na ja, ich weiß nicht.“
      - **csak** mildert eine Bitte oder heißt *nur*: **Gyere csak!** „Komm nur!“
      - **persze** „natürlich“, **bezzeg** „dagegen (vorwurfsvoll)“
