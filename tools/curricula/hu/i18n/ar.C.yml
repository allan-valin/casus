# Arabic text of the Hungarian course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Word order and focus: "ترتيب الكلمات والتبئير"
  Subjunctive and conditional: "الالتماسي والشرطي"
  Formal style: "الأسلوب الرسمي"
  Verbs in depth: "الأفعال بتعمق"
  Word formation: "بناء الكلمات"
  Discourse: "الخطاب"
lessons:
  hu-focus:
    meaning: "البؤرة: الكلمة المنبورة قبل الفعل مباشرة"
    intro: |
      يتبع ترتيب الكلمات المجري المعلومة لا الأدوار النحوية. والموضع **الذي قبل الفعل مباشرة** هو *البؤرة*: العنصر الجديد أو المقابَل، يُنطق منبورًا. وما يقف هناك يدفع السابقة الفعلية إلى ما بعد الفعل:

      - محايد: **Péter felhívta Annát.** «اتصل بيتر بآنا».
      - البؤرة على بيتر: **Péter hívta fel Annát.** «بيتر هو من اتصل بآنا».
      - البؤرة على آنا: **Annát hívta fel Péter.** «بآنا اتصل بيتر (لا بغيرها)».
      - و**csak** (فقط) تعلّم البؤرة أيضًا: **Csak én jöttem el.** «أنا وحدي جئت».

      وأدوات الاستفهام دائمًا في البؤرة: **Ki hívta fel Annát?**
  hu-is-sem:
    meaning: "is (أيضًا) وsem (ولا) بعد الكلمة التي تخصّها"
    intro: |
      **is** «أيضًا، حتى» و**sem / se** «ولا، ولا حتى» تأتيان بعد الكلمة التي تعدّلانها، وموضعهما يغيّر المعنى: **Én is jövök.** «أنا أيضًا آتٍ». **Jövök is.** «وسآتي فعلًا». **Én sem tudom.** «ولا أنا أعرف». **Egy szót sem szólt.** «لم يقل كلمة واحدة». ومع **sem** بعد كلمة نافية لا حاجة إلى **nem**: **Senki sem jött.** «لم يأتِ أحد».
  hu-pointer-words:
    meaning: "كلمات الإحالة: azt، arról، abban … قبل جملة hogy"
    intro: |
      لا تستطيع جملة **hogy** أن تأخذ لاحقة حالة بنفسها، فتحمل الجملة الرئيسية صيغة من **az** بالحالة التي يطلبها الفعل، محيلةً إلى ما بعدها:

      - **Azt mondta, hogy …** (mond + المفعولية)
      - **Arról beszéltünk, hogy …** (beszél valamiről)
      - **Abban reménykedem, hogy …** (reménykedik valamiben)
      - **Annak örülök, hogy …** (örül valaminek)
      - **Arra gondoltam, hogy …** (gondol valamire)
      - **Attól félek, hogy …** (fél valamitől)
  hu-subjunctive-hogy:
    meaning: "الالتماسي بعد akar وkér وkell وfontos + hogy"
    intro: |
      صيغ الأمر تعمل أيضًا عمل الالتماسي بعد أفعال الإرادة والطلب والأمر وبعد عبارات الوجوب، كـ«أن + المضارع المنصوب»: **Azt akarom, hogy eljöjj.** «أريد أن تأتي». **Kérlek, hogy segíts.** «أرجوك أن تساعد». **Fontos, hogy pontosan érkezz.** «من المهم أن تصل في الموعد». **Mondd meg neki, hogy hívjon fel.** «قل له أن يتصل بي».
  hu-purpose:
    meaning: "الغاية: azért, hogy + الالتماسي"
    intro: |
      *لكي* هي **(azért,) hogy** + الالتماسي: **Azért jöttem, hogy beszéljünk.** «جئت لكي نتكلم». **Korán keltem, hogy ne késsek el.** «نهضت مبكرًا لكي لا أتأخر». قارن **azért, mert** «لأنّ»: **Azért jöttem, mert hívtál.**
  hu-past-conditional:
    meaning: "الشرطي الماضي: الماضي + volna"
    intro: |
      الماضي غير الواقع = زمن الماضي + **volna**: **Ha tudtam volna, eljöttem volna.** «لو عرفت لجئت». **Szívesen segítettem volna.** «كنت سأساعد بكل سرور». والتمني: **Bárcsak ott lettem volna!** «ليتني كنت هناك!»
  hu-van-converb:
    meaning: "-ván / -vén: بعد أن فعل، إذ (أدبية)"
    intro: |
      **-ván / -vén** الصيغة الرسمية الأدبية لـ **-va / -ve**: فعل يسبق الفعل الرئيسي أو يعلّله: **Látván, hogy senki sincs otthon, elment.** «إذ رأى أن لا أحد في البيت، ذهب». **Belépvén a terembe, köszönt.** «حين دخل القاعة، سلّم». والكلام يفضّل جمل **amikor، mivel**.
  hu-personal-infinitive:
    meaning: "المصدر الشخصي: mennem، menned، mennie"
    intro: |
      بعد **kell، lehet، szabad، muszáj، sikerül، érdemes** يأخذ المصدر لواحق شخصية، ويمكن ذكر الشخص في القابل: **Mennem kell.** «يجب أن أذهب». **Neked kell eldöntened.** «أنت من عليه أن يقرّر». **Nem szabad dohányoznia.** «لا يجوز له التدخين». **Sikerült megoldanunk.** «استطعنا حلّه».

      | | خلفي | أمامي |
      |---|---|---|
      | المتكلم المفرد | -nom | -nem |
      | المخاطب المفرد | -nod | -ned |
      | الغائب المفرد | -nia | -nie |
      | المتكلمون | -nunk | -nünk |
      | المخاطبون | -notok | -netek |
      | الغائبون | -niuk | -niük |
  hu-nominalization:
    meaning: "-ás / -és: الفعل اسمًا"
    intro: |
      **-ás / -és** تحوّل الفعل إلى مصدر: **olvas → olvasás** (القراءة)، **dönt → döntés** (القرار)، **fejleszt → fejlesztés** (التطوير). والمجرية الرسمية تتابعها مع ضمائر الملكية: **a döntés meghozatala** «اتخاذ القرار»، **a lakás felújítása** «تجديد الشقة».
  hu-formal-address:
    meaning: "«حضرتك»: ön، maga، tetszik + المصدر"
    intro: |
      *أنت* المهذبة تأخذ فعل الغائب: **Ön honnan jön?** «من أين حضرتك؟» و**ön** مهذبة ورسمية؛ و**maga** شائعة في الكلام لكنها قد تبدو باردة؛ والأطفال والأصغر سنًا يخاطبون الكبار بـ **tetszik** + المصدر: **Hova tetszik menni?** «إلى أين حضرتك ذاهب/ة؟» والجمع **önök، maguk**.
  hu-possessive-e:
    meaning: "-é (لمن: لبيتر) و-ék (العائلة، الجماعة)"
    intro: |
      **-é** تقوم مقام المالك دون المملوك: **Kié ez a könyv? – Péteré.** «لمن هذا الكتاب؟ – لبيتر». **Az enyém، a tiéd، az övé** «لي، لك، له/لها». و**-ék** تعني فلانًا وعائلته أو جماعته: **Kovácsék** «آل كوفاتش»، **Péterék** «بيتر وأهله / أصحابه»، **Péteréknél** «عند بيت بيتر».
  hu-causee:
    meaning: "من يُجعل يفعل: -val / -vel أو المفعولية"
    intro: |
      مع الفعل السببي يُعلَّم الشخص المجعول يفعل بحسب نوع الفعل:

      - الأصل متعدٍّ (للفعل مفعول أصلًا): يأخذ الشخص **-val / -vel**: **Megjavíttattam az autót a szerelővel.** «جعلت الميكانيكي يصلح السيارة». **Leveleket íratott a titkárnőjével.** «جعل سكرتيرته تكتب رسائل».
      - الأصل لازم: يكون الشخص مفعولًا في المفعولية: **A tanár dolgoztatja a diákokat.** «يشغّل المعلم الطلاب». **Megnevettette a gyerekeket.** «أضحك الأطفال».
  hu-ik-verbs:
    meaning: "أفعال -ik: المتكلم المتأني بـ -m"
    intro: |
      الأفعال المدرجة بـ **-ik** (**eszik، iszik، lakik، dolgozik، alszik**) لها صيغ خاصة في المضارع غير المحدد: الغائب المفرد بـ **-ik**، والمتكلم المفرد بـ **-m** في الكلام المتأني والمكتوب والمعياري: **eszem، iszom، lakom، dolgozom**. والكلام اليومي يستعمل كثيرًا **-k** كسائر الأفعال (**lakok، dolgozok**)، ولا يرضى عنه المتشددون. والشرطي يتبع الانقسام نفسه: **ennék / enném**.
  hu-progressive:
    meaning: "الاستمرار: السابقة بعد الفعل في فعل خلفي"
    intro: |
      ليس في المجرية زمن مستمر، لكن ترتيب الكلمات يمكن أن يبيّن فعلًا جاريًا: تنتقل السابقة إلى ما بعد الفعل حتى بلا بؤرة، عادةً مع **éppen / épp** وجملة **amikor**: **Éppen mentem át az úton, amikor megláttam.** «كنت أعبر الطريق حين رأيته». قارن المنجز **Átmentem az úton.** «عبرت الطريق».
  hu-stative-converb:
    meaning: "السابقة + van + -va: الحالة الناتجة"
    intro: |
      **van** + صيغة **-va / -ve**، والسابقة قبل **van**، تصف حالة منجزة، قريبة من اسم المفعول: **A levél meg van írva.** «الرسالة مكتوبة». **Az ajtó be van zárva.** «الباب مقفل». **Minden el van intézve.** «كل شيء مرتّب». والنفي: **nincs megírva**.
  hu-narrative-past:
    meaning: "صيغ ماضٍ قديمة في الأدب والكتاب المقدس"
    intro: |
      للأدب القديم أزمنة فقدتها المجرية الحديثة: ماضي السرد **-á / -é** (**monda** «قال»، **kezde** «بدأ»، **láta** «رأى»)، و**vala** «كان» (ماضي **van**، وفعلًا مساعدًا: **írt vala** «كان قد كتب»)، و**lőn** «صار، كان»، و**vagyon** «هو كائن»، و**lészen** «سيكون». ويكفي أن تتعرّفها: **Monda pedig Isten: Legyen világosság! És lőn világosság.** «وقال الله: ليكن نور! فكان نور».
  hu-hatatlan:
    meaning: "-hatatlan / -hetetlen: لا يمكن …"
    intro: |
      **-hat / -het** (يمكن) + **-atlan / -etlen** (بلا) تعطي *لا يُـ…*: **hisz → hihetetlen** «لا يُصدَّق»، **elképzel → elképzelhetetlen** «لا يُتصوَّر»، **kibír → kibírhatatlan** «لا يُطاق»، **elkerül → elkerülhetetlen** «لا مفرّ منه». ونظيرها الإيجابي **-ható / -hető**: **hihető** «يُصدَّق»، **elkerülhető** «يمكن تجنّبه». ومع **-ul / -ül** تصير ظرفًا: **hihetetlenül** «بشكل لا يُصدَّق».
  hu-reciprocal:
    meaning: "بعضهم بعضًا: egymás وحالاتها"
    intro: |
      **egymás** «بعضهم بعضًا» تُصرَّف كاسم وتأخذ الحالة التي يطلبها الفعل: **Szeretik egymást.** «يحب بعضهم بعضًا». **Beszélnek egymással.** «يتحدثون مع بعضهم». **Gondolnak egymásra.** «يفكر أحدهما في الآخر». **Egymás mellett ültek.** «جلسوا متجاورين».
  hu-concessive:
    meaning: "مع أنّ، ومع ذلك: التسليم الرسمي"
    intro: |
      بجانب **bár** و**habár**: **noha، jóllehet، ámbár** (مع أنّ، رسمية)، **holott** (في حين، والحال أنّ)، وفي الجملة الرئيسية **mégis، mégsem** (ومع ذلك، ومع ذلك لا)، **ennek ellenére** (رغم ذلك)، **mindazonáltal** (ومع ذلك كله): **Noha fáradt volt, mégis eljött.** «مع أنه كان متعبًا فقد جاء».
  hu-indefinite-series:
    meaning: "سلاسل الضمائر: vala-، bár- / akár-، mind-، se-"
    intro: |
      تبني أدوات الاستفهام أربع سلاسل بالسوابق:

      | | من | ما | أين | متى |
      |---|---|---|---|---|
      | ما **vala-** | valaki | valami | valahol | valamikor |
      | أيّ كان **bár- / akár-** | bárki | bármi | bárhol | bármikor |
      | كل **mind-** | mindenki | minden | mindenhol | mindig |
      | لا **se-** | senki | semmi | sehol | soha |

      **bár- / akár-** تعني *أيًّا كان*: **Bárki megcsinálhatja.** «يستطيع أي أحد أن يفعله». وسلسلة **se-** تحتاج **nem / sem** مع الفعل: **Senki sem jött.**
  hu-particles:
    meaning: "أدوات الخطاب"
    intro: |
      كلمات صغيرة تحدد نبرة الجملة:

      - **ugye** تطلب الموافقة: **Jössz, ugye?** «ستأتي، أليس كذلك؟»
      - **hiszen** «ولكن، إذ»: **Hiszen tudod!** «لكنك تعرف!»
      - **ugyan** للشك أو الاستبعاد: **Ugyan, hagyd!** «دعك من هذا!» **Ugyan ki tudná?** «ومن عساه يعرف؟»
      - **hát** «حسنًا، طيب»: **Hát, nem tudom.** «حسنًا، لا أعرف».
      - **csak** تليّن الطلب أو تعني *فقط*: **Gyere csak!** «تعالَ هيا!»
      - **persze** «طبعًا»، **bezzeg** «بينما (بلوم)»
