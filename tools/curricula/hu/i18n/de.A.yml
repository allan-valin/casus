# German text of the Hungarian course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and vowel harmony: "Laute und Vokalharmonie"
  Pronouns and 'van': "Pronomen und „van“"
  Verbs: "Verben"
  Nouns and their cases: "Nomen und ihre Kasus"
  Possession: "Besitz"
  Past and future: "Vergangenheit und Zukunft"
  Verbal prefixes: "Verbalpräfixe"
lessons:
  hu-harmony:
    meaning: "Vokalharmonie: hinten -ban, vorn -ben"
    intro: |
      Ungarische Schreibung: **sz** = *s* (scharf), **s** = *sch*, **zs** = stimmhaftes *sch* (*Garage*), **cs** = *tsch*, **gy** = *dj*, **ny** = *nj*, **ty** = *tj*, **ly** = *j*; der Akzent markiert **Länge**: **a / á, e / é, o / ó, ö / ő, u / ú, ü / ű**. Betont wird immer die erste Silbe.

      Suffixe haben **zwei Formen** (hinten/vorn): ein Wort mit **a, á, o, ó, u, ú** nimmt **-ban, -ba, -nak, -ból**; ein Wort mit **e, é, i, í, ö, ő, ü, ű** nimmt **-ben, -be, -nek, -ből**: **ház → házban** (im Haus), **kert → kertben** (im Garten). Manche haben **drei** (mit ö): **-hoz / -hez / -höz**: **házhoz, kerthez, öröm → örömhöz**.
  hu-van:
    meaning: "Personalpronomen und lenni „sein“"
    intro: |
      **én** ich, **te** du, **ő** er/sie (ein Wort), **mi** wir, **ti** ihr, **ők** sie; höflich **ön / maga** (Pl. **önök / maguk**) mit der 3. Person. **lenni**: **vagyok, vagy, van, vagyunk, vagytok, vannak**. In der 3. Person fällt **van/vannak** vor Nomen oder Adjektiv weg: **Péter orvos.** „Péter ist Arzt.“, bleibt aber bei Ortsangaben: **Péter otthon van.** „Péter ist zu Hause.“ Verneint: **nem vagyok**, 3. Person **nincs / nincsenek**.
  hu-present-indef:
    meaning: "das Präsens: unbestimmte Konjugation"
    intro: |
      Ungarische Verben haben **zwei Konjugationen**. Die **unbestimmte** steht ohne Objekt oder mit unbestimmtem Objekt (**egy könyvet**, *ein Buch*):

      | | hinten (olvas lesen) | vorn (beszél sprechen) |
      |---|---|---|
      | én | olvas**ok** | beszél**ek** |
      | te | olvas**ol** | beszél**sz** |
      | ő | olvas | beszél |
      | mi | olvas**unk** | beszél**ünk** |
      | ti | olvas**tok** | beszél**tek** |
      | ők | olvas**nak** | beszél**nek** |

      Nach **s, sz, z** lautet die te-Form **-ol / -el / -öl**: **olvasol, főzöl**. Die Wörterbuchform ist die ő-Form (**olvas**); der Infinitiv fügt **-ni** an (**olvasni**).
  hu-present-def:
    meaning: "die bestimmte Konjugation: ein bestimmtes Objekt"
    intro: |
      Bei einem **bestimmten** Objekt — **a/az** + Nomen, ein Name, **ezt, azt**, ein Nomen mit Possessiv — nimmt das Verb die **bestimmten** Endungen: **olvasom, olvasod, olvassa, olvassuk, olvassátok, olvassák** (vorn: **nézem, nézed, nézi, nézzük, nézitek, nézik**). **Olvasok egy könyvet** (ein Buch), aber **Olvasom a könyvet** (das Buch). *Ich … dich* hat eine eigene Endung **-lak / -lek**: **Szeretlek.** „Ich liebe dich.“
  hu-negation:
    meaning: "Verneinung: nem, nincs, ne"
    intro: |
      **nem** vor dem verneinten Verb oder Wort: **Nem tudom.** „Ich weiß es nicht.“ Die 3. Person von *sein* hat eine eigene Verneinung: **nincs / nincsenek** „es gibt nicht“, **Nincs időm.** „Ich habe keine Zeit.“ **ne** steht bei Befehlen und Wünschen: **Ne félj!** „Hab keine Angst!“ Doppelte Verneinung ist normal: **Senki sem tudja.** „Niemand weiß es.“
  hu-questions:
    meaning: "Fragewörter und die Fragepartikel -e"
    intro: |
      **ki** wer, **mi** was, **hol** wo, **hová** wohin, **honnan** woher, **mikor** wann, **miért** warum, **hogyan / hogy** wie, **mennyi** wie viel, **hány** wie viele, **melyik** welcher, **milyen** was für ein. Ja/Nein-Fragen steigen im Ton; in indirekten Fragen nimmt das Verb **-e**: **Nem tudom, jön-e.** „Ich weiß nicht, ob er kommt.“
  hu-plural:
    meaning: "der Plural -k"
    intro: |
      **-k**, nach Konsonant mit Bindevokal: **ház → házak, kert → kertek, gyerek → gyerekek, ló → lovak**; auslautendes **a / e** wird lang: **alma → almák, kefe → kefék**. Nach einer Zahl oder einem Mengenwort bleibt das Nomen im Singular: **két ház, sok ember**.
  hu-accusative:
    meaning: "der Akkusativ -t: das Objekt"
    intro: |
      Jedes direkte Objekt nimmt **-t**, oft mit Bindevokal: **könyv → könyvet, ház → házat, alma → almát, bor → bort**. Bei bestimmtem Objekt ist das Verb bestimmt (vorige Lektion): **Látom a házat.** / **Látok egy házat.**
  hu-inner-local:
    meaning: "innen: Inessiv -ban, Illativ -ba, Elativ -ból"
    intro: |
      **-ban / -ben** in, **-ba / -be** hinein, **-ból / -ből** heraus: **a házban** (im Haus), **a házba** (ins Haus), **a házból** (aus dem Haus). Die meisten Länder und Städte nehmen diese: **Budapesten** ist eine Ausnahme (äußere Kasus), **Brazíliában** ist regelmäßig.
  hu-outer-local:
    meaning: "auf: Superessiv -on, Sublativ -ra, Delativ -ról"
    intro: |
      **-n / -on / -en / -ön** auf, **-ra / -re** auf … hin, **-ról / -ről** von … herab, über: **az asztalon** (auf dem Tisch), **az asztalra** (auf den Tisch), **a filmről beszélünk** (wir sprechen über den Film). Ungarische Städte und viele Orte nehmen diese: **Budapesten, Magyarországon, a postán** (auf der Post).
  hu-near-local:
    meaning: "bei, zu, von (einer Person oder einem Ort): -nál, -hoz, -tól"
    intro: |
      **-nál / -nél** bei, **-hoz / -hez / -höz** zu, **-tól / -től** von: **az orvosnál** (beim Arzt), **az orvoshoz** (zum Arzt), **az orvostól** (vom Arzt). Personen nehmen für *zu, von, bei* immer diese: **Anyámhoz megyek.** „Ich gehe zu meiner Mutter.“
  hu-dative:
    meaning: "der Dativ -nak / -nek: zu, für; Besitz"
    intro: |
      **-nak / -nek**: die Person, der oder für die etwas gegeben wird (**Adok egy könyvet Péternek.** „Ich gebe Péter ein Buch.“), und der Besitzer in *haben*-Sätzen: **Péternek van egy autója.** „Péter hat ein Auto.“
  hu-instrumental:
    meaning: "der Instrumental -val / -vel: mit"
    intro: |
      **-val / -vel**, das **v** gleicht sich einem auslautenden Konsonanten an: **busszal** (mit dem Bus), **tollal** (mit einem Stift), **a barátommal** (mit meinem Freund), **Annával**. Nach Vokal bleibt **v**: **autóval**.
  hu-possessive:
    meaning: "Possessivsuffixe"
    intro: |
      Besitz ist ein Suffix am Besitztum: **ház-am** mein Haus, **ház-ad** dein, **ház-a** sein/ihr, **ház-unk** unser, **ház-atok** euer, **ház-uk** ihr (vorn: **kert-em, kert-ed, kert-je, kert-ünk, kert-etek, kert-jük**). Das Besitzernomen steht davor: **Péter háza** „Péters Haus“. *Haben* ist **van** + das besessene Nomen: **Van egy kutyám.** „Ich habe einen Hund.“
  hu-past:
    meaning: "die Vergangenheit -t- / -tt-"
    intro: |
      **-t-** oder **-tt-** + die Endungen, in beiden Konjugationen: unbestimmt **olvastam, olvastál, olvasott, olvastunk, olvastatok, olvastak**; bestimmt **olvastam, olvastad, olvasta, olvastuk, olvastátok, olvasták**. Ungarisch hat nur eine Vergangenheit.
  hu-future:
    meaning: "das Futur: fog + Infinitiv"
    intro: |
      **fogok, fogsz, fog, fogunk, fogtok, fognak** + Infinitiv: **Holnap dolgozni fogok.** „Morgen werde ich arbeiten.“ Oft genügt das Präsens mit Zeitangabe: **Holnap jövök.** „Ich komme morgen.“
  hu-prefixes:
    meaning: "Verbalpräfixe: be-, ki-, el-, meg-, fel-, le-"
    intro: |
      **be-** hinein, **ki-** hinaus, **fel- / föl-** hinauf, **le-** hinunter, **el-** weg, **vissza-** zurück, **át-** hinüber, **meg-** (vollendet): **bemegy** hineingehen, **kimegy** hinausgehen, **elmegy** weggehen, **megír** fertig schreiben. Das Präfix tritt hinter das Verb, wenn etwas fokussiert oder verneint wird: **Nem megyek be.** „Ich gehe nicht hinein.“ — wie ein deutsches trennbares Verb.
  hu-imperative:
    meaning: "der Imperativ -j"
    intro: |
      **-j** + Endungen (angeglichen nach s, sz, z, t): **várj!** (warte), **olvass!** (lies), **nézz!** (schau); bestimmt **olvasd el!** Unregelmäßig: **menj** (geh), **gyere** (komm), **legyél / légy** (sei). Er drückt auch Wünsche und Zweck nach **hogy** aus: **Mondd meg neki, hogy jöjjön!** „Sag ihm, er soll kommen!“ Verneint mit **ne**: **Ne menj!**
