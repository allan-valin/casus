# Arabic text of the Hungarian course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Conditional and clauses: "الشرطي والجمل التابعة"
  Verbal prefixes in the sentence: "السوابق الفعلية في الجملة"
  Derived verbs: "الأفعال المشتقة"
  Participles: "أسماء الفاعل والمفعول"
  More cases: "حالات أخرى"
lessons:
  hu-conditional:
    meaning: "الشرطي -na / -ne"
    intro: |
      **-na- / -ne-** + اللواحق: **olvasnék، olvasnál، olvasna** (غير محدد)، **olvasnám، olvasnád، olvasná** (محدد). للتمني والطلب المهذب (**Szeretnék egy kávét.** «أودّ قهوة») والشرط غير الواقع مع **ha**: **Ha lenne időm, eljönnék.** «لو كان عندي وقت لجئت».
  hu-conjunctions:
    meaning: "أنّ، لأنّ، إذا، لكن"
    intro: |
      **hogy** أنّ، **mert** لأنّ، **ha** إذا، **amikor** عندما، **de** لكن، **vagy** أو، **és** و، **tehát** إذن، **mivel** بما أنّ، **bár** مع أنّ، **mielőtt** قبل أن، **miután** بعد أن. وقبل الجملة التابعة فاصلة دائمًا؛ وكثيرًا ما تحمل الجملة الرئيسية كلمة إشارة: **Azt mondta, hogy jön.** «قال ذلك: إنه آتٍ».
  hu-relative:
    meaning: "أسماء الموصول: aki، ami، amely"
    intro: |
      **aki** (للعاقل)، **ami / amely** (لغير العاقل) — كـ«من» و«ما» — وتُصرَّف كالأسماء: **a férfi, aki itt lakik** «الرجل الذي يسكن هنا»، **a könyv, amit olvasok** «الكتاب الذي أقرؤه»، **a ház, amelyben lakom** «البيت الذي أسكن فيه». وأيضًا **ahol** حيث، **amikor** حين.
  hu-prefix-separation:
    meaning: "السابقة بعد الفعل: النفي والأسئلة"
    intro: |
      تبقى السابقة على الفعل في الجملة الخبرية المحايدة (**Bemegyek.** «سأدخل»)، لكنها تنتقل **بعد** الفعل حين يحتل شيء آخر الموضع الذي قبله مباشرة:

      - النفي: **Nem megyek be.** «لن أدخل». **Ne nyisd ki!** «لا تفتحه!»
      - أداة استفهام: **Mikor jössz haza?** «متى تعود إلى البيت؟»
      - كلمة مركّز عليها: **Péter hívott fel, nem Anna.** «بيتر هو من اتصل، لا آنا».
  hu-prefix-aspect:
    meaning: "meg- وسوابق أخرى للفعل المنجز"
    intro: |
      بلا سابقة يصف الفعل غالبًا نشاطًا؛ ومعها فعلًا بلغ نهايته. و**meg-** تضيف غالبًا هذا الإتمام فقط:

      - **Írtam egy levelet.** «كنت أكتب رسالة». – **Megírtam a levelet.** «أتممت كتابة الرسالة».
      - **Ettem.** «أكلت (شيئًا)». – **Megettem a levest.** «أكلت الحساء كله».
      - **Olvastam a könyvet.** «كنت أقرأ الكتاب». – **Elolvastam a könyvet.** «قرأت الكتاب كاملًا».

      بعض الأفعال تقترن بـ **el-** (**olvas → elolvas**)، و**meg-** هي المعتادة (**csinál → megcsinál، néz → megnéz**).
  hu-prefix-auxiliary:
    meaning: "السابقة قبل akar وtud وfog وkell"
    intro: |
      مع فعل مساعد (**akar، tud، fog، kell، szeret، kezd، szokott، lehet**) تترك السابقة المصدر وتأتي قبل المساعد: **El akarok menni.** «أريد أن أغادر». **Meg tudod csinálni?** «هل تستطيع فعله؟» **Haza fogok menni.** «سأعود إلى البيت».

      ومع النفي أو التركيز تعود إلى المصدر: **Nem akarok elmenni.** «لا أريد أن أغادر».
  hu-potential:
    meaning: "-hat / -het: يمكن، يجوز"
    intro: |
      **-hat / -het** قبل لاحقة الشخص تعني *يجوز، يمكن*: **Bejöhetek?** «هل يمكنني الدخول؟» **Itt dohányozhatsz.** «يمكنك التدخين هنا». **Ez igaz lehet.** «قد يكون هذا صحيحًا». (**lehet** من **van**). قارن **tud** (*يُحسن*): **Tudok úszni.** «أُحسن السباحة».
  hu-causative:
    meaning: "-tat / -tet: جعل غيره يفعل"
    intro: |
      **-tat / -tet** (بعد الصائت أو الجذور ثنائية المقطع) و**-at / -et** (بعد كثير من الجذور أحادية المقطع) تجعل الفعل متعديًا سببيًا: *جعل فلانًا يفعل*، كوزن «فعّل/أفعل»:

      - **javít → javíttat**: **Megjavíttattam az autót.** «أصلحت السيارة (عند غيري)».
      - **ír → írat**، **vár → várat**: **Ne várass!** «لا تجعلني أنتظر!»
      - **nevet → nevettet** (أضحك)، **dolgozik → dolgoztat** (شغّل)

      ومن يُجعل يفعل يكون في المفعولية أو مع **-val / -vel**: **Megcsináltatom a szerelővel.** «سأجعل الميكانيكي يصلحه».
  hu-frequentative:
    meaning: "-gat / -get: يفعل الشيء بين حين وآخر، قليلًا"
    intro: |
      **-gat / -get** (وأيضًا **-ogat، -eget**) تجعل الفعل متكررًا أو عابرًا أو متفرقًا: **olvas → olvasgat** «يقرأ هنا وهناك»، **néz → nézeget** «يتصفّح»، **kérdez → kérdezget** «يظل يسأل»، **ír → írogat** «يكتب أحيانًا». و**-kál / -kél** مثلها: **jár → járkál** «يذرع المكان جيئةً وذهابًا».
  hu-participles:
    meaning: "الصيغ الوصفية: -ó (الفاعل)، -t (المفعول)، -andó (ما ينبغي فعله)"
    intro: |
      ثلاث صيغ تقف قبل الاسم كالصفات:

      - **-ó / -ő** (اسم الفاعل): **az olvasó fiú** «الولد القارئ»، **a következő megálló** «المحطة التالية»
      - **-t / -tt** (اسم المفعول): **a megírt levél** «الرسالة المكتوبة»، **a tegnap vett kenyér** «الخبز المشترى أمس»
      - **-andó / -endő** (ما ينبغي فعله): **a megoldandó feladat** «المسألة المطلوب حلّها»، **fizetendő összeg** «المبلغ المستحق»

      وتحلّ محلّ جمل الصلة: **a fiú, aki olvas = az olvasó fiú**.
  hu-adverbial-participle:
    meaning: "-va / -ve: في حالة، وهو يفعل"
    intro: |
      **-va / -ve** تصف حالة ناتجة عن فعل، أو طريقة فعل الشيء:

      - مع **van**: **Az ajtó nyitva van.** «الباب مفتوح». **A bolt zárva van.** «المتجر مغلق». **Meg van írva.** «إنه مكتوب».
      - الكيفية: **Ülve olvasott.** «قرأ جالسًا». **Sietve távozott.** «غادرت مسرعة».
  hu-translative-essive:
    meaning: "-vá / -vé (صار)، -ként (بصفته)، -ul / -ül (بلغة، كـ)"
    intro: |
      - **-vá / -vé** (التحويل): التحوّل إلى، مع **válik، lesz**: **Orvossá vált.** «صار طبيبًا». **A víz jéggé fagyott.** «تجمّد الماء جليدًا». وتتماثل **v** بعد الصامت: **jég → jéggé**.
      - **-ként** (رسمية): بصفته: **Tanárként dolgozik.** «تعمل معلّمةً».
      - **-ul / -ül**: اللغات والكيفية: **magyarul** «بالمجرية»، **jól** «جيدًا»، **barátul** «صديقًا».
  hu-causal-terminative:
    meaning: "-ért (لأجل، مقابل) و-ig (حتى)"
    intro: |
      - **-ért** (السبب والغاية): *لأجل* غاية أو ثمن أو شخص: **Elmegyek kenyérért.** «سأذهب لأجلب الخبز». **Mennyiért vetted?** «بكم اشتريته؟» **Köszönöm a segítségért.** «شكرًا على المساعدة». و**Miért?** «لماذا؟» هي اللاحقة نفسها.
      - **-ig** (الانتهاء): *حتى، إلى*: **ötig** «حتى الخامسة»، **a sarokig** «حتى الناصية»، **holnapig** «حتى الغد».
  hu-time-suffixes:
    meaning: "-kor (في الساعة)، -nta / -nként (كل)"
    intro: |
      - **-kor** تعطي نقطة زمنية بلا توافق صائتي: **hétkor** «في السابعة»، **éjfélkor** «عند منتصف الليل»، **karácsonykor** «في عيد الميلاد»، **Hány órakor?** «في أي ساعة؟»
      - **-nta / -nte** و**-nként** تعطيان التكرار أو التوزيع: **naponta** «يوميًا»، **hetente** «أسبوعيًا»، **havonta** «شهريًا»، **évente** «سنويًا»، **óránként** «كل ساعة، في الساعة»، **egyenként** «واحدًا واحدًا».
