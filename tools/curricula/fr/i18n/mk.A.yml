# Macedonian text of the French course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Articles and nouns: "Членови и именки"
  Être, avoir and the present: "Être, avoir и сегашното"
  Negation and questions: "Негација и прашања"
  Adjectives and possessives: "Придавки и присвојни"
  The past: "Минатото"
  Pronouns: "Заменки"
lessons:
  fr-articles:
    meaning: "членовите и родот"
    intro: |
      Секоја именка е од **машки** или **женски** род (нема среден): **le livre** (книгата), **la table** (масата); пред самогласка или немо h **l'**: **l'homme, l'école**. Множина **les** за двата. Неопределен: **un** livre, **une** table, **des** livres. Членот стои пред именката, не на крајот како во македонскиот. Францускиот го користи почесто: **J'aime le café** „Го сакам кафето“. По негација **un / une / des** стануваат **de**: **Je n'ai pas de voiture.**
  fr-etre-avoir:
    meaning: "être „е, сум“ и avoir „има“"
    intro: |
      **être**: je **suis**, tu **es**, il **est**, nous **sommes**, vous **êtes**, ils **sont**. **avoir**: j'**ai**, tu **as**, il **a**, nous **avons**, vous **avez**, ils **ont**. Францускиот вели *има* за возраст, глад и студ: **J'ai vingt ans** „Имам дваесет години“, **J'ai faim**, **J'ai froid**.
  fr-er-verbs:
    meaning: "сегашното на глаголите на -er"
    intro: |
      Девет од десет француски глаголи завршуваат на **-er** (**parler**, **aimer**, **habiter**). Се отстранува **-er** и се додава **-e, -es, -e, -ons, -ez, -ent**: je parl**e**, tu parl**es**, il parl**e**, nous parl**ons**, vous parl**ez**, ils parl**ent**. Формите **-e, -es, -ent** звучат исто.
  fr-irregular-present:
    meaning: "чести неправилни глаголи во сегашно"
    intro: |
      **aller** (оди): vais, vas, va, allons, allez, vont. **faire** (прави): fais, fais, fait, faisons, faites, font. **pouvoir** (може): peux, peux, peut, pouvons, pouvez, peuvent. **vouloir** (сака): veux, veux, veut, voulons, voulez, veulent. **venir** (доаѓа): viens, viens, vient, venons, venez, viennent. **prendre** (зема): prends, prends, prend, prenons, prenez, prennent.
  fr-negation:
    meaning: "негација: ne … pas, jamais, rien, plus"
    intro: |
      **ne** (n' пред самогласка) пред глаголот и **pas** по него: **Je ne sais pas.** „Не знам.“ Наместо pas: **jamais** (никогаш), **rien** (ништо), **plus** (веќе не), **personne** (никој). Во говорот **ne** често се испушта: **Je sais pas.**
  fr-questions:
    meaning: "прашални зборови"
    intro: |
      **qui** кој, **que / quoi** што, **où** каде, **quand** кога, **comment** како, **pourquoi** зошто, **combien** колку, **quel / quelle** кој (од нив). Три начини за прашување: интонација (**Tu viens ?**), **est-ce que** (**Est-ce que tu viens ?** — како **дали**), инверзија (**Viens-tu ?**, официјално).
  fr-adjectives:
    meaning: "придавките се согласуваат: -e, -s"
    intro: |
      Женски **+e**, множина **+s**: **un petit garçon, une petite fille, des petits garçons, des petites filles**. Некои се менуваат повеќе: **beau / belle, nouveau / nouvelle, blanc / blanche, heureux / heureuse**. Повеќето стојат по именката (**une voiture rouge**); кратките чести пред неа (**grand, petit, bon, beau, jeune, vieux**).
  fr-possessives:
    meaning: "присвојни: mon, ton, son, notre, votre, leur"
    intro: |
      Се согласуваат со **поседуваното**, не со сопственикот: **mon livre, ma maison, mes amis**; **ton / ta / tes**; **son / sa / ses** (негов *или* нејзин: **sa maison** = неговата или нејзината куќа); **notre / nos, votre / vos, leur / leurs**. Пред самогласка женскиот користи **mon / ton / son**: **mon amie**.
  fr-prepositions:
    meaning: "à и de со членот: au, aux, du, des"
    intro: |
      **à + le = au**, **à + les = aux**, **de + le = du**, **de + les = des**; **à la, à l', de la, de l'** остануваат одделно: **Je vais au cinéma, à la plage, aux États-Unis.** **Il vient du Brésil.** Партитивно *малку*: **du pain, de la confiture, des fruits**.
  fr-futur-proche:
    meaning: "блиското идно: aller + инфинитив"
    intro: |
      **aller** во сегашно + инфинитив: **Je vais manger.** „Ќе јадам (сега).“ **On va voir.** „Ќе видиме.“ Секојдневното идно на говорот.
  fr-passe-compose:
    meaning: "passé composé: avoir / être + партицип"
    intro: |
      **avoir** + минат партицип кај повеќето глаголи — како македонското **имам јадено**: **J'ai mangé.** „Јадев / Имам јадено.“ Партиципи: **-er → -é** (parlé), **-ir → -i** (fini), другите варираат (**fait, pris, vu, eu, été, dit, mis**). Глаголите на движење и промена и сите повратни земаат **être**, а партиципот се согласува: **Elle est partie. Nous sommes allés. Je me suis levé.**
  fr-imparfait:
    meaning: "имперфектот: правеше, имаше обичај"
    intro: |
      Основата на **nous** во сегашно без **-ons**, плус **-ais, -ais, -ait, -ions, -iez, -aient**: nous parl-ons → **je parlais**; nous fais-ons → **je faisais**; само **être** е неправилно: **j'étais**. Позадина, навики и описи во минатото — како македонското минато несвршено: **Quand j'étais petit, je jouais au foot.** „Кога бев мал, играв фудбал.“
  fr-futur:
    meaning: "простото идно"
    intro: |
      Инфинитив (без крајно -e) + **-ai, -as, -a, -ons, -ez, -ont**: **je parlerai, tu finiras, il prendra**. Неправилни основи: **être → ser-, avoir → aur-, aller → ir-, faire → fer-, pouvoir → pourr-, venir → viendr-, voir → verr-, vouloir → voudr-**.
  fr-object-pronouns:
    meaning: "објектни заменки пред глаголот"
    intro: |
      Директни: **me, te, le, la, nous, vous, les**; индиректни: **me, te, lui, nous, vous, leur**. Стојат **пред** глаголот (пред помошниот во сложените времиња) — како македонските **ме, го, му**: **Je le vois. Je lui parle. Je l'ai vu.** Во потврдни заповеди по него: **Donne-le-moi !**
  fr-reflexive:
    meaning: "повратни глаголи: se lever, s'appeler"
    intro: |
      **me, te, se, nous, vous, se** пред глаголот: **Je m'appelle Ana.** „Се викам Ана.“ **Il se lève à sept heures. Nous nous amusons.** Во passé composé со **être**: **Je me suis levé(e).**
  fr-comparison:
    meaning: "споредување: plus, moins, aussi … que"
    intro: |
      **plus … que** повеќе од, **moins … que** помалку од, **aussi … que** исто толку како: **Il est plus grand que moi.** Суперлатив **le plus / le moins**: **la plus belle ville**. Неправилни: **bon → meilleur**, **bien → mieux**.
