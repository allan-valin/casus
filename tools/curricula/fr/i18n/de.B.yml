# German text of the French course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Moods: "Modi"
  Complex sentences: "Komplexe Sätze"
  The subjunctive in depth: "Der Subjonctif im Detail"
  Compound tenses: "Zusammengesetzte Tempora"
  Voice and verb forms: "Diathese und Verbformen"
  Emphasis and linking: "Hervorhebung und Verknüpfung"
lessons:
  fr-conditionnel:
    meaning: "der Konditional: würde"
    intro: |
      Futurstamm + Imparfait-Endungen: **je parlerais, je voudrais, j'aimerais, ce serait**. Höfliche Bitten (**Je voudrais un café.** „Ich hätte gern einen Kaffee.“) und irreale Bedingungen mit **si** + Imparfait: **Si j'avais de l'argent, je voyagerais.** „Wenn ich Geld hätte, würde ich reisen.“
  fr-subjonctif:
    meaning: "der Subjonctif nach que"
    intro: |
      Nach Ausdrücken von Notwendigkeit, Wunsch, Gefühl und Zweifel + **que**: **Il faut que tu viennes. Je veux qu'il parte. Je suis content que vous soyez là.** Bildung: Stamm von **ils** im Präsens + **-e, -es, -e, -ions, -iez, -ent**: ils parl-ent → **que je parle**; unregelmäßig **être → sois, avoir → aie, aller → aille, faire → fasse, pouvoir → puisse**.
  fr-relatives:
    meaning: "Relativpronomen"
    intro: |
      **qui** Subjekt (**l'homme qui parle**), **que** Objekt (**le livre que je lis**), **dont** = *wovon, dessen* (**le livre dont je parle**), **où** Ort und Zeit (**la ville où j'habite, le jour où il est venu**).
  fr-y-en:
    meaning: "die Pronomen y (dort, daran) und en (davon, welche)"
    intro: |
      **y** ersetzt **à** + Sache oder einen Ort: **Je vais à Paris → J'y vais.** **en** ersetzt **de** + Sache oder eine Menge: **Je mange du pain → J'en mange. J'en ai deux.** Feste Wendungen: **il y a** (es gibt), **on y va** (los geht's), **je m'en vais** (ich gehe).
  fr-gerondif:
    meaning: "das Gérondif en + -ant"
    intro: |
      **en** + Partizip Präsens (**-ant**, vom nous-Stamm): *während / indem*: **Il chante en travaillant.** „Er singt bei der Arbeit.“ **C'est en forgeant qu'on devient forgeron.** „Übung macht den Meister.“
  fr-b2-subj-passe:
    meaning: "der Subjonctif passé"
    intro: |
      **avoir / être** im Subjonctif + Partizip: **que j'aie fini, qu'il soit parti**. Er bezeichnet eine Handlung, die vor dem Hauptverb oder vor einem Zeitpunkt abgeschlossen ist: **Je suis content que tu sois venu. Il faut que tu aies fini avant midi.** Die Kongruenzregeln sind die des Passé composé.
  fr-b2-conjonctions-subj:
    meaning: "Konjunktionen mit Subjonctif"
    intro: |
      **bien que / quoique** „obwohl“, **pour que / afin que** „damit“, **avant que** „bevor“, **jusqu'à ce que** „bis“, **à condition que** „vorausgesetzt, dass“, **à moins que** „es sei denn“, **sans que** „ohne dass“ — immer + Subjonctif: **Bien qu'il soit tard, je reste. Parle fort pour qu'on t'entende.** Aber **après que** nimmt (im gepflegten Französisch) den Indikativ: **après qu'il est parti**.
  fr-b2-subj-doute:
    meaning: "Subjonctif nach Zweifel und verneinter Meinung"
    intro: |
      **penser, croire, trouver, être sûr** + Indikativ, wenn bejaht: **Je pense qu'il vient.** Verneint oder mit Inversion gefragt nehmen sie den Subjonctif: **Je ne pense pas qu'il vienne. Crois-tu qu'il puisse ?** **douter que** nimmt immer den Subjonctif; **il semble que** meist, **il me semble que** den Indikativ.
  fr-b2-subj-superlatif:
    meaning: "Subjonctif nach Superlativ, seul, premier, dernier"
    intro: |
      Ein Relativsatz nach **le seul, l'unique, le premier, le dernier** oder einem Superlativ nimmt meist den Subjonctif, der das Urteil als persönlich darstellt: **C'est le meilleur film que j'aie vu. Tu es la seule qui puisse m'aider.** Auch nach unbestimmtem oder verneintem Bezugswort: **Je cherche quelqu'un qui sache coder.**
  fr-b2-plus-que-parfait:
    meaning: "das Plusquamperfekt"
    intro: |
      Imparfait von **avoir / être** + Partizip: **j'avais fini, elle était partie**. Eine Handlung vor einer anderen vergangenen: **Quand je suis arrivé, le film avait commencé.** Es ist auch das Tempus vergangenen Bedauerns mit **si**: **Si seulement j'avais su !** „Hätte ich das bloß gewusst!“
  fr-b2-conditionnel-passe:
    meaning: "der Konditional II"
    intro: |
      Konditional von **avoir / être** + Partizip: **j'aurais aimé, il serait venu**. Was geschehen wäre: **Si j'avais su, je serais venu.** Bedauern und Vorwürfe: **J'aurais dû partir plus tôt. Tu aurais pu me le dire !** In der Presse eine unbestätigte vergangene Tatsache: **L'accident aurait fait trois victimes.** „Der Unfall soll drei Opfer gefordert haben.“
  fr-b2-si-passe:
    meaning: "irreale Bedingungen in der Vergangenheit"
    intro: |
      **si** + Plusquamperfekt, dann Konditional II: **Si tu m'avais appelé, je serais venu.** Nie Konditional nach **si**: ~~si j'aurais su~~ (gesprochen sehr häufig, gilt aber weiter als falsch). Gemischt: **Si j'avais pris le train, je serais déjà là.**
    mistakes: ["kein Konditional nach si: Plusquamperfekt."]
  fr-b2-futur-anterieur:
    meaning: "das Futur II"
    intro: |
      Futur von **avoir / être** + Partizip: eine Handlung, die vor einem zukünftigen Zeitpunkt abgeschlossen ist: **J'aurai fini à six heures. Quand tu auras lu ce livre, prête-le-moi.** Beachte: nach **quand, dès que, lorsque** steht im Französischen ein Futur, wo das Deutsche oft Präsens oder Perfekt nimmt. Es kann auch eine Vermutung sein: **Il aura oublié** „Er wird es vergessen haben“.
  fr-b2-discours-indirect:
    meaning: "indirekte Rede und Zeitenfolge"
    intro: |
      Nach einem Redeverb in der Vergangenheit: Präsens → Imparfait, Passé composé → Plusquamperfekt, Futur → Konditional: **« Je viendrai »** → **Il a dit qu'il viendrait.** **« J'ai fini »** → **Elle a dit qu'elle avait fini.** Fragen: **Il m'a demandé si je venais, ce que je voulais, où j'allais.**
  fr-b2-passif:
    meaning: "das Passiv"
    intro: |
      **être** in jedem Tempus + Partizip, kongruierend mit dem Subjekt, **par** für den Urheber (**de** bei Verben des Gefühls oder Zustands: **aimé de tous**): **La lettre a été écrite par Marie. Le pont sera construit en 2030.** Französisch bevorzugt oft **on** oder ein pronominales Verb: **On parle français ici. Ça se mange froid.**
  fr-b2-participe-present:
    meaning: "das Partizip Präsens ohne en"
    intro: |
      Ohne **en** wirkt die **-ant**-Form wie ein Relativsatz oder ein Grund, meist schriftlich: **les étudiants ayant réussi** (= qui ont réussi), **Ne sachant pas quoi faire, il est parti** (= comme il ne savait pas). Es kongruiert nicht. Unregelmäßig: **ayant, étant, sachant**. Vergleiche das Gérondif (B1), das dasselbe Subjekt wie das Hauptverb braucht.
  fr-b2-faire-causatif:
    meaning: "kausatives faire + Infinitiv"
    intro: |
      **faire** + Infinitiv: etwas machen lassen: **Je fais réparer ma voiture** „Ich lasse mein Auto reparieren“. **se faire** + Infinitiv: an sich machen lassen: **Je me suis fait couper les cheveux.** **laisser** + Infinitiv: lassen (erlauben): **Laisse-moi parler.** Das Partizip **fait** kongruiert hier nicht.
  fr-b2-mise-en-relief:
    meaning: "Hervorhebung: c'est … qui / que, ce que … c'est"
    intro: |
      **c'est … qui** hebt das Subjekt hervor, **c'est … que** alles andere: **C'est Marie qui a gagné. C'est demain que je pars.** **ce qui / ce que … c'est** stellt das Thema voran: **Ce que je veux, c'est dormir. Ce qui m'étonne, c'est son calme.** Nach **c'est moi qui** kongruiert das Verb mit moi: **C'est moi qui suis…**
  fr-b2-connecteurs:
    meaning: "Konnektoren des Gegensatzes und der Ergänzung"
    intro: |
      Gegensatz: **pourtant** „dennoch“, **cependant / toutefois / néanmoins** „jedoch“ (förmlicher), **en revanche / par contre** „hingegen“ (par contre ist umgangssprachlich). Ergänzung und Argument: **d'ailleurs** „übrigens“, **de plus / en outre** „außerdem“, **ainsi** „so, somit“, **en effet** „tatsächlich (wie die Fakten zeigen)“.
  fr-b2-doubles-pronoms:
    meaning: "zwei Objektpronomen zusammen"
    intro: |
      Reihenfolge vor dem Verb: **me / te / se / nous / vous** → **le / la / les** → **lui / leur** → **y** → **en**: **Il me le donne. Je le lui ai dit. Je leur en parle.** Im bejahten Imperativ nach dem Verb mit Bindestrichen: **Donne-le-moi. Dites-le-lui.**
