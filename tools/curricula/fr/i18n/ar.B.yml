# Arabic text of the French course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Moods: "الصيغ"
  Complex sentences: "الجمل المركبة"
  The subjunctive in depth: "الالتماسي بتعمق"
  Compound tenses: "الأزمنة المركبة"
  Voice and verb forms: "البناء وصيغ الفعل"
  Emphasis and linking: "التوكيد والربط"
lessons:
  fr-conditionnel:
    meaning: "الشرطي: كان سـ"
    intro: |
      جذر المستقبل + لواحق الماضي الناقص: **je parlerais، je voudrais، j'aimerais، ce serait**. للطلب المهذب (**Je voudrais un café.** «أودّ قهوة») وللشرط غير الواقع مع **si** + الماضي الناقص: **Si j'avais de l'argent, je voyagerais.** «لو كان عندي مال لسافرت».
  fr-subjonctif:
    meaning: "الالتماسي بعد que"
    intro: |
      بعد عبارات الضرورة والرغبة والشعور والشك + **que**، كـ«أن + المضارع المنصوب»: **Il faut que tu viennes.** «يجب أن تأتي». **Je veux qu'il parte. Je suis content que vous soyez là.** الصياغة: جذر **ils** في المضارع + **-e، -es، -e، -ions، -iez، -ent**: ils parl-ent → **que je parle**؛ والشاذ **être → sois، avoir → aie، aller → aille، faire → fasse، pouvoir → puisse**.
  fr-relatives:
    meaning: "أسماء الموصول"
    intro: |
      **qui** فاعل (**l'homme qui parle**)، **que** مفعول (**le livre que je lis**)، **dont** = *الذي عنه، الذي … ـه* (**le livre dont je parle** «الكتاب الذي أتحدث عنه»)، **où** للمكان والزمان (**la ville où j'habite، le jour où il est venu**).
  fr-y-en:
    meaning: "الضميران y (هناك، إليه) وen (منه، بعضه)"
    intro: |
      **y** تنوب عن **à** + شيء أو مكان: **Je vais à Paris → J'y vais.** و**en** تنوب عن **de** + شيء أو كمية: **Je mange du pain → J'en mange. J'en ai deux.** وعبارات ثابتة: **il y a** (يوجد)، **on y va** (هيا بنا)، **je m'en vais** (أنا ذاهب).
  fr-gerondif:
    meaning: "صيغة الحال en + -ant"
    intro: |
      **en** + اسم الفاعل (**-ant**، من جذر nous): *بينما / بـ*: **Il chante en travaillant.** «يغني وهو يعمل». **C'est en forgeant qu'on devient forgeron.** «بالممارسة يصير المرء حدادًا».
  fr-b2-subj-passe:
    meaning: "الالتماسي الماضي"
    intro: |
      **avoir / être** في الالتماسي + اسم المفعول: **que j'aie fini، qu'il soit parti**. يدل على فعل انتهى قبل الفعل الرئيسي أو قبل لحظة ما: **Je suis content que tu sois venu. Il faut que tu aies fini avant midi.** وقواعد المطابقة هي قواعد الماضي المركب.
  fr-b2-conjonctions-subj:
    meaning: "أدوات تتطلب الالتماسي"
    intro: |
      **bien que / quoique** «مع أنّ»، **pour que / afin que** «لكي»، **avant que** «قبل أن»، **jusqu'à ce que** «حتى»، **à condition que** «شريطة أن»، **à moins que** «إلا إذا»، **sans que** «دون أن» — دائمًا + الالتماسي: **Bien qu'il soit tard, je reste. Parle fort pour qu'on t'entende.** لكن **après que** تأخذ الإخباري (في الفرنسية المتأنية): **après qu'il est parti**.
  fr-b2-subj-doute:
    meaning: "الالتماسي بعد الشك والرأي المنفي"
    intro: |
      **penser، croire، trouver، être sûr** + الإخباري عند الإثبات: **Je pense qu'il vient.** ومنفية أو مسؤولًا عنها بالقلب تأخذ الالتماسي: **Je ne pense pas qu'il vienne. Crois-tu qu'il puisse ?** و**douter que** تأخذ الالتماسي دائمًا؛ و**il semble que** غالبًا، و**il me semble que** تأخذ الإخباري.
  fr-b2-subj-superlatif:
    meaning: "الالتماسي بعد التفضيل وseul وpremier وdernier"
    intro: |
      جملة الصلة بعد **le seul، l'unique، le premier، le dernier** أو التفضيل تأخذ غالبًا الالتماسي، فتعرض الحكم شخصيًا: **C'est le meilleur film que j'aie vu. Tu es la seule qui puisse m'aider.** وكذلك بعد سابق نكرة أو منفي: **Je cherche quelqu'un qui sache coder.**
  fr-b2-plus-que-parfait:
    meaning: "الماضي البعيد"
    intro: |
      الماضي الناقص من **avoir / être** + اسم المفعول: **j'avais fini، elle était partie**، كـ«كان قد». فعل سابق لفعل ماضٍ آخر: **Quand je suis arrivé, le film avait commencé.** وهو أيضًا زمن الندم على الماضي مع **si**: **Si seulement j'avais su !** «ليتني عرفت!»
  fr-b2-conditionnel-passe:
    meaning: "الشرطي الماضي"
    intro: |
      الشرطي من **avoir / être** + اسم المفعول: **j'aurais aimé، il serait venu**. ما كان سيحدث: **Si j'avais su, je serais venu.** «لو عرفت لجئت». والندم واللوم: **J'aurais dû partir plus tôt. Tu aurais pu me le dire !** وفي الصحافة، واقعة ماضية غير مؤكدة: **L'accident aurait fait trois victimes.** «يُقال إن الحادث خلّف ثلاثة ضحايا».
  fr-b2-si-passe:
    meaning: "الشرط غير الواقع في الماضي"
    intro: |
      **si** + الماضي البعيد، ثم الشرطي الماضي: **Si tu m'avais appelé, je serais venu.** ولا شرطي بعد **si** أبدًا: ~~si j'aurais su~~ (زلة شائعة جدًا في الكلام، وما زالت تُعدّ خطأ). والمختلط: **Si j'avais pris le train, je serais déjà là.**
    mistakes: ["لا شرطي بعد si: الماضي البعيد."]
  fr-b2-futur-anterieur:
    meaning: "المستقبل التام"
    intro: |
      مستقبل **avoir / être** + اسم المفعول: فعل ينتهي قبل لحظة مستقبلية، كـ«سأكون قد»: **J'aurai fini à six heures. Quand tu auras lu ce livre, prête-le-moi.** ولاحظ: بعد **quand، dès que، lorsque** تستعمل الفرنسية المستقبل. ويكون أيضًا تخمينًا: **Il aura oublié** «لا بد أنه نسي».
  fr-b2-discours-indirect:
    meaning: "الكلام المنقول وتوافق الأزمنة"
    intro: |
      بعد فعل قول ماضٍ: المضارع → الماضي الناقص، والماضي المركب → البعيد، والمستقبل → الشرطي: **« Je viendrai »** → **Il a dit qu'il viendrait.** **« J'ai fini »** → **Elle a dit qu'elle avait fini.** والأسئلة: **Il m'a demandé si je venais, ce que je voulais, où j'allais.**
  fr-b2-passif:
    meaning: "المبني للمجهول"
    intro: |
      **être** في أي زمن + اسم المفعول مطابقًا للفاعل، و**par** للفاعل الحقيقي (و**de** مع أفعال الشعور أو الحال: **aimé de tous**): **La lettre a été écrite par Marie. Le pont sera construit en 2030.** وكثيرًا ما تفضّل الفرنسية **on** أو فعلًا ضميريًا: **On parle français ici. Ça se mange froid.**
  fr-b2-participe-present:
    meaning: "اسم الفاعل بلا en"
    intro: |
      بلا **en** تعمل صيغة **-ant** عمل جملة صلة أو سبب، غالبًا في الكتابة: **les étudiants ayant réussi** (= qui ont réussi)، **Ne sachant pas quoi faire, il est parti** (= comme il ne savait pas). ولا تطابق. والشاذ: **ayant، étant، sachant**. وقارنها بصيغة الحال (B1) التي تتطلب فاعل الفعل الرئيسي نفسه.
  fr-b2-faire-causatif:
    meaning: "faire السببية + المصدر"
    intro: |
      **faire** + المصدر: جعل شيئًا يُفعل: **Je fais réparer ma voiture** «أُصلح سيارتي (عند غيري)». و**se faire** + المصدر: أن يُفعل بك: **Je me suis fait couper les cheveux.** «قصصت شعري (عند الحلاق)». و**laisser** + المصدر: ترك، سمح: **Laisse-moi parler.** واسم المفعول **fait** لا يطابق هنا.
  fr-b2-mise-en-relief:
    meaning: "التوكيد: c'est … qui / que، ce que … c'est"
    intro: |
      **c'est … qui** تؤكد الفاعل، و**c'est … que** ما سواه: **C'est Marie qui a gagné.** «ماري هي التي فازت». **C'est demain que je pars.** و**ce qui / ce que … c'est** تقدّم الموضوع: **Ce que je veux, c'est dormir. Ce qui m'étonne, c'est son calme.** وبعد **c'est moi qui** يطابق الفعل moi: **C'est moi qui suis…**
  fr-b2-connecteurs:
    meaning: "أدوات الاستدراك والإضافة"
    intro: |
      الاستدراك: **pourtant** «ومع ذلك»، **cependant / toutefois / néanmoins** «غير أنّ» (أرسم)، **en revanche / par contre** «في المقابل» (par contre عامية). والإضافة والحجة: **d'ailleurs** «فضلًا عن ذلك»، **de plus / en outre** «علاوة على ذلك»، **ainsi** «وهكذا»، **en effet** «بالفعل (كما تبيّن الوقائع)».
  fr-b2-doubles-pronoms:
    meaning: "ضميرا مفعول معًا"
    intro: |
      الترتيب قبل الفعل: **me / te / se / nous / vous** → **le / la / les** → **lui / leur** → **y** → **en**: **Il me le donne. Je le lui ai dit. Je leur en parle.** وفي الأمر المثبت بعد الفعل مع الشرطات: **Donne-le-moi. Dites-le-lui.**
