# Macedonian text of the French course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Literary tenses: "Книжевни времиња"
  Syntax of careful French: "Синтакса на грижливиот француски"
  Mood and nuance: "Начин и нијанса"
  Literary style: "Книжевен стил"
  Fine points of syntax: "Финеси на синтаксата"
  Register: "Регистар"
lessons:
  fr-c1-passe-simple:
    meaning: "passé simple (препознавање)"
    intro: |
      Времето на пишаното раскажување — романи, приказни, историја — каде говорот користи passé composé; слично на македонскиот аорист во раскажувањето. Главно 3 лице: глаголи на **-er** **il parla, ils parlèrent**; **-ir / -re** **il finit, ils finirent**; **-oir** и други **il put, ils purent**. Неправилни: **être → il fut**, **avoir → il eut**, **faire → il fit**, **venir → il vint**, **naître → il naquit**.
  fr-c1-subj-imparfait:
    meaning: "имперфектниот субјунктив (препознавање)"
    intro: |
      Класичната книжевност го чува слагањето на времињата: по минат главен глагол, имперфектниот субјунктив: **Il fallait qu'il partît. Je voulais qu'elle vînt.** Образување: од passé simple, **-sse, -sses, -^t, -ssions, -ssiez, -ssent**: **parla → qu'il parlât**, **fut → qu'il fût**, **vint → qu'il vînt**. Денес опстојува речиси само во 3 лице еднина; говорот користи сегашен субјунктив.
  fr-c1-passe-anterieur:
    meaning: "passé antérieur"
    intro: |
      Passé simple од **avoir / être** + партицип, по **quand, lorsque, dès que, aussitôt que, après que, à peine**: дејство непосредно пред друго во passé simple. **Dès qu'il eut fini, il sortit. Quand elle fut partie, il pleura.** Само во пишано раскажување; во говорот: **dès qu'il a eu fini** или просто **après avoir fini**.
  fr-c1-inversion:
    meaning: "инверзија на подмет и глагол и еуфонското -t-"
    intro: |
      Официјалните прашања го превртуваат заменскиот подмет со цртичка: **Viendra-t-il ? Que veut-elle ? Puis-je entrer ?** Меѓу две самогласки се вметнува **-t-**: **a-t-il, parle-t-on, va-t-elle** (не по -d / -t: **prend-il, est-il**). Пишаниот француски превртува и по **peut-être, sans doute, aussi** „затоа“, **à peine, ainsi, du moins**: **Peut-être viendra-t-il. Aussi a-t-il refusé.**
  fr-c1-ne-expletif:
    meaning: "експлетивното ne"
    intro: |
      Во грижлив француски **ne** без **pas** се јавува по **avant que, à moins que, de peur que, craindre que, empêcher que** и во споредби на нееднаквост: **Pars avant qu'il ne pleuve. Je crains qu'il ne soit trop tard. C'est plus difficile que je ne pensais.** Не е негација: значењето е потврдно — слично на македонското **пред да не**. Не е задолжително; говорот обично го испушта.
  fr-c1-ne-que:
    meaning: "ограничување: ne … que (само)"
    intro: |
      **ne … que** значи „само“, со **que** веднаш пред ограниченото: **Je n'ai qu'un frère.** „Имам само еден брат.“ **Il ne pense qu'à l'argent. On ne vit qu'une fois.** Не е негација: **de** не го заменува членот (**Je ne bois que de l'eau**). **ne … pas que** = „не само“.
  fr-c1-lequel:
    meaning: "lequel и неговите спојувања по предлози"
    intro: |
      По предлог, релативната заменка за работи е **lequel, laquelle, lesquels, lesquelles**, споена со **à** (**auquel, auxquels, auxquelles**) и **de** (**duquel, desquels, desquelles**): **la raison pour laquelle, le projet auquel je pense, le parc près duquel j'habite.** За луѓе е вообичаено **qui**: **l'ami à qui je parle**. Со само **de** подобро е **dont**.
  fr-c1-accord-participe:
    meaning: "согласување на миналиот партицип со avoir"
    intro: |
      Со **avoir** партиципот се согласува со директниот предмет само кога тој стои пред него: **J'ai écrit la lettre**, но **la lettre que j'ai écrite**, **Je les ai vus**, **Quelles robes as-tu achetées ?** Никогаш со **en** или индиректен предмет: **Je leur ai parlé.** Се слуша само кај партиципи што завршуваат на согласка: **écrite, prise, faite**.
  fr-c1-esperer-souhaiter:
    meaning: "индикатив или субјунктив: espérer, souhaiter, après que, le fait que"
    intro: |
      Некои парови личат, но се разликуваат: **espérer que** + индикатив (**J'espère qu'il viendra**), **souhaiter que** + субјунктив (**Je souhaite qu'il vienne**). **après que** + индикатив, **avant que** + субјунктив. **le fait que** обично зема субјунктив. **se douter que** „се сомнева дека (претпоставува)“ зема индикатив, за разлика од **douter que**.
    mistakes: ["espérer зема индикатив."]
  fr-c1-avoir-beau:
    meaning: "допусност: avoir beau, quand bien même, si … que"
    intro: |
      **avoir beau** + инфинитив „колку и да…, залудно“: **J'ai beau essayer, je n'y arrive pas.** „Колку и да се обидувам, не успевам.“ **quand bien même** + условен „дури и да“: **Quand bien même il viendrait, je ne lui parlerais pas.** **si / aussi** + придавка + **que** + субјунктив: **Si riche qu'il soit, il n'est pas heureux.** Исто така **où que, quoi que, qui que** (C2).
  fr-c1-on-nous:
    meaning: "on наместо nous и други одлики на говорниот француски"
    intro: |
      Во говорот **on** речиси секогаш го заменува **nous**, со глагол во 3 лице еднина, но согласување во множина: **On est partis à huit heures. On y va ?** Говорниот француски го испушта и **ne** (**Je sais pas**), користи **ça** за **cela** и **il y a** скратено во **y a**. Во пишување задржи ги **nous** и **ne**.
  fr-c1-adverbes-ment:
    meaning: "прилози на -amment и -emment"
    intro: |
      Придавките на **-ant** даваат **-amment** (**courant → couramment, constant → constamment**); придавките на **-ent** даваат **-emment** (**évident → évidemment, récent → récemment**). Двете се изговараат **[amɑ̃]**. Исклучоци: **lent → lentement, présent → présentement**.
  fr-c2-eut-ete:
    meaning: "плусквамперфектниот субјунктив како книжевен условен"
    intro: |
      **eût / fût** + партицип е плусквамперфектниот субјунктив. Покрај нормалната употреба (**Bien qu'il eût fini…**), книжевноста го користи за минат условен, т.н. *conditionnel passé deuxième forme*: **On eût dit un enfant** „Би рекол дете“. **Qui l'eût cru ?** „Кој би помислил?“ **S'il fût venu, je l'eusse vu** = s'il était venu, je l'aurais vu.
  fr-c2-incise:
    meaning: "инверзија во реченици на пренесување (incises)"
    intro: |
      По или внатре во наведениот говор глаголот на кажување оди прв, подметот по него: **« Je viens », dit-il. « Pourquoi ? » demanda-t-elle. « Non », répondit Marie.** Со заменски подмет, цртички и еуфонско **-t-** по самогласка: **ajouta-t-il, s'écria-t-elle**. Обичниот ред (~~il dit~~) тука е погрешен.
  fr-c2-ne-seul:
    meaning: "ne без pas во книжевниот француски"
    intro: |
      Со **savoir, pouvoir, oser, cesser** книжевниот француски може да негира само со **ne**: **Je ne saurais vous dire** „Не би можел да ви кажам“, **Je n'ose le croire**, **Il ne cesse de pleuvoir** „Не престанува да врне“, **Je ne puis** (стара форма за je ne peux). Исто така **si je ne me trompe** „ако не се лажам“ и **n'importe**.
  fr-c2-quel-que:
    meaning: "допусни релативи: quel que, quoi que, qui que, où que"
    intro: |
      **quel que** + **être** во субјунктив, со **quel** согласувано со подметот: **quel que soit le prix, quelle que soit la raison, quels que soient les risques.** **quoi que** „што и да“ (во два збора; **quoique** = иако), **qui que** „кој и да“, **où que** „каде и да“: **Quoi que tu fasses, je t'aime.** „Што и да правиш, те сакам.“ **Où que tu ailles…**
  fr-c2-tout-adverbe:
    meaning: "tout како прилог: кога се согласува"
    intro: |
      Пред придавка **tout** значи „сосема, наполно“ и е прилог: непроменлив (**ils sont tout contents, elle est tout heureuse**) — освен пред придавка од женски род што почнува со согласка или аспирирано h, каде се согласува заради звукот: **elle est toute contente, elles sont toutes honteuses.**
  fr-c2-accord-pronominal:
    meaning: "согласување на партиципот кај повратните глаголи"
    intro: |
      Повратните глаголи земаат **être**, но партиципот се согласува само со претходен директен предмет: **Elle s'est lavée** (se = директен предмет), но **Elle s'est lavé les mains** (предметот les mains следи) и **Ils se sont parlé** (se = индиректен: parler à). Глаголите што се само повратни се согласуваат со подметот: **Elle s'est souvenue.**
  fr-c2-negation-litteraire:
    meaning: "книжевна негација: ni … ni, nul, aucun, guère, nullement"
    intro: |
      **ne … ni … ni** „ни … ни“: **Il ne boit ni vin ni bière** (без член). **nul / nulle** „никој, ниеден“ (официјално): **Nul n'est censé ignorer la loi.** „Непознавањето на законот не оправдува.“ **ne … guère** „едвај“: **Je ne le vois guère.** **ne … nullement** „воопшто не“. **aucun** како заменка: **Aucun n'est venu.**
  fr-c2-que-initial:
    meaning: "que + субјунктив на почеток на реченицата"
    intro: |
      **que** + субјунктив сам дава наредба или желба за 3 лице — како македонското **нека**: **Qu'il entre !** „Нека влезе!“ **Que le meilleur gagne ! Qu'elle se taise.** Реченица со **que** може и да ја отвори реченицата како подмет или тема, пак во субјунктив: **Qu'il soit en retard ne m'étonne pas.** **Que tu le veuilles ou non** „сакал или не“.
  fr-c2-ce-dont:
    meaning: "ce dont, ce à quoi, ce sur quoi"
    intro: |
      **ce** + релатив се однесува на идеја: **ce qui, ce que** (B2), **ce dont** за глаголи со **de** (**avoir besoin de, parler de**): **Ce dont j'ai besoin, c'est de repos.** „Она што ми треба е одмор.“ Со други предлози **ce à quoi, ce sur quoi, ce contre quoi**: **C'est ce à quoi je pensais.**
  fr-c2-participe-compose:
    meaning: "минатиот партицип и апсолутни конструкции"
    intro: |
      **ayant / étant** + партицип означува завршено претходно дејство: **Ayant terminé son travail, il est sorti.** „Откако ја заврши работата, излезе.“ **Étant arrivée en retard, elle s'est excusée.** Пишаниот француски гради и апсолутни реченици со голиот партицип: **Le repas terminé, on a dansé. Une fois arrivés, appelez-moi.**
  fr-c2-familier:
    meaning: "неформален речник (français familier)"
    intro: |
      Секојдневниот говорен француски има втор речник: **bosser** = travailler, **le boulot** = le travail, **une bagnole** = une voiture, **le fric** = l'argent, **un mec / une meuf** = un homme / une femme, **un flic** = un policier, **un truc** = une chose, **un bouquin** = un livre, **piger** = comprendre, **bouffer** = manger. Во ред со пријатели, не на место во пишувањето.
