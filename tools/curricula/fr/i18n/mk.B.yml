# Macedonian text of the French course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Moods: "Начини"
  Complex sentences: "Сложени реченици"
  The subjunctive in depth: "Субјунктивот подлабоко"
  Compound tenses: "Сложени времиња"
  Voice and verb forms: "Залог и глаголски форми"
  Emphasis and linking: "Нагласување и сврзување"
lessons:
  fr-conditionnel:
    meaning: "условниот начин: би"
    intro: |
      Основа на идното + наставки на имперфектот: **je parlerais, je voudrais, j'aimerais, ce serait**. Учтиви барања (**Je voudrais un café.** „Би сакал кафе.“) и нереални услови со **si** + имперфект: **Si j'avais de l'argent, je voyagerais.** „Да имав пари, би патувал.“
  fr-subjonctif:
    meaning: "субјунктивот по que"
    intro: |
      По изрази на потреба, желба, чувство и сомнеж + **que** — каде македонскиот има **да**: **Il faut que tu viennes.** „Треба да дојдеш.“ **Je veux qu'il parte. Je suis content que vous soyez là.** Образување: основата на **ils** во сегашно + **-e, -es, -e, -ions, -iez, -ent**: ils parl-ent → **que je parle**; неправилни **être → sois, avoir → aie, aller → aille, faire → fasse, pouvoir → puisse**.
  fr-relatives:
    meaning: "релативни заменки"
    intro: |
      **qui** подмет (**l'homme qui parle**), **que** предмет (**le livre que je lis**), **dont** = *за кој, чиј* (**le livre dont je parle** „книгата за која зборувам“), **où** место и време (**la ville où j'habite, le jour où il est venu**).
  fr-y-en:
    meaning: "заменките y (таму, на тоа) и en (од тоа, малку)"
    intro: |
      **y** заменува **à** + нешто или место: **Je vais à Paris → J'y vais.** **en** заменува **de** + нешто или количина: **Je mange du pain → J'en mange. J'en ai deux.** Цврсти изрази: **il y a** (има), **on y va** (ајде), **je m'en vais** (си одам).
  fr-gerondif:
    meaning: "герундот en + -ant"
    intro: |
      **en** + сегашен партицип (**-ant**, од основата на nous): *додека / со тоа што* — како македонското **-јќи**: **Il chante en travaillant.** „Пее работејќи.“ **C'est en forgeant qu'on devient forgeron.** „Со вежбање се станува мајстор.“
  fr-b2-subj-passe:
    meaning: "минатиот субјунктив"
    intro: |
      **avoir / être** во субјунктив + партицип: **que j'aie fini, qu'il soit parti**. Означува дејство завршено пред главниот глагол или пред некој момент: **Je suis content que tu sois venu. Il faut que tu aies fini avant midi.** Правилата за согласување се тие на passé composé.
  fr-b2-conjonctions-subj:
    meaning: "сврзници што бараат субјунктив"
    intro: |
      **bien que / quoique** „иако“, **pour que / afin que** „за да“, **avant que** „пред да“, **jusqu'à ce que** „додека не“, **à condition que** „под услов да“, **à moins que** „освен ако“, **sans que** „без да“ — секогаш + субјунктив: **Bien qu'il soit tard, je reste. Parle fort pour qu'on t'entende.** Но **après que** зема индикатив (во грижлив француски): **après qu'il est parti**.
  fr-b2-subj-doute:
    meaning: "субјунктив по сомнеж и одречено мислење"
    intro: |
      **penser, croire, trouver, être sûr** + индикатив кога се потврдни: **Je pense qu'il vient.** Одречени или прашани со инверзија земаат субјунктив: **Je ne pense pas qu'il vienne. Crois-tu qu'il puisse ?** **douter que** секогаш зема субјунктив; **il semble que** обично, **il me semble que** зема индикатив.
  fr-b2-subj-superlatif:
    meaning: "субјунктив по суперлатив, seul, premier, dernier"
    intro: |
      Релативна реченица по **le seul, l'unique, le premier, le dernier** или суперлатив обично зема субјунктив, што судот го претставува како личен: **C'est le meilleur film que j'aie vu. Tu es la seule qui puisse m'aider.** И по неопределен или одречен антецедент: **Je cherche quelqu'un qui sache coder.**
  fr-b2-plus-que-parfait:
    meaning: "плусквамперфектот"
    intro: |
      Имперфект од **avoir / être** + партицип: **j'avais fini, elle était partie** — како македонското **бев завршил**. Дејство пред друго минато: **Quand je suis arrivé, le film avait commencé.** Тоа е и времето на минато жалење со **si**: **Si seulement j'avais su !** „Да знаев!“
  fr-b2-conditionnel-passe:
    meaning: "минатиот условен"
    intro: |
      Условен од **avoir / être** + партицип: **j'aurais aimé, il serait venu**. Што ќе се случело: **Si j'avais su, je serais venu.** „Да знаев, ќе дојдев.“ Жалење и прекори: **J'aurais dû partir plus tôt. Tu aurais pu me le dire !** Во печатот, непотврден минат факт: **L'accident aurait fait trois victimes.** „Несреќата наводно однела три жртви.“
  fr-b2-si-passe:
    meaning: "нереални услови во минатото"
    intro: |
      **si** + плусквамперфект, па минат условен: **Si tu m'avais appelé, je serais venu.** Никогаш условен по **si**: ~~si j'aurais su~~ (многу честа грешка во говорот, сѐ уште се смета за неправилна). Мешано: **Si j'avais pris le train, je serais déjà là.**
    mistakes: ["нема условен по si: плусквамперфект."]
  fr-b2-futur-anterieur:
    meaning: "идното минато време"
    intro: |
      Идно од **avoir / être** + партицип: дејство завршено пред иден момент — како македонското **ќе имам завршено**: **J'aurai fini à six heures. Quand tu auras lu ce livre, prête-le-moi.** Забележи: по **quand, dès que, lorsque** францускиот користи идно. Може да биде и претпоставка: **Il aura oublié** „Мора да заборавил“.
  fr-b2-discours-indirect:
    meaning: "пренесен говор и слагање на времињата"
    intro: |
      По минат глагол на кажување: сегашно → имперфект, passé composé → плусквамперфект, идно → условен: **« Je viendrai »** → **Il a dit qu'il viendrait.** **« J'ai fini »** → **Elle a dit qu'elle avait fini.** Прашања: **Il m'a demandé si je venais, ce que je voulais, où j'allais.**
  fr-b2-passif:
    meaning: "пасивот"
    intro: |
      **être** во кое било време + партицип согласуван со подметот, **par** за вршителот (**de** со глаголи на чувство или состојба: **aimé de tous**): **La lettre a été écrite par Marie. Le pont sera construit en 2030.** Францускиот често претпочита **on** или повратен глагол: **On parle français ici. Ça se mange froid.**
  fr-b2-participe-present:
    meaning: "сегашниот партицип без en"
    intro: |
      Без **en**, формата **-ant** делува како релативна реченица или причина, главно во пишувањето: **les étudiants ayant réussi** (= qui ont réussi), **Ne sachant pas quoi faire, il est parti** (= comme il ne savait pas). Не се согласува. Неправилни: **ayant, étant, sachant**. Спореди го герундот (B1), кој бара ист подмет како главниот глагол.
  fr-b2-faire-causatif:
    meaning: "каузативно faire + инфинитив"
    intro: |
      **faire** + инфинитив: да дадеш нешто да се направи: **Je fais réparer ma voiture** „Си ја поправам колата (кај мајстор)“. **se faire** + инфинитив: да ти се направи нешто: **Je me suis fait couper les cheveux.** „Се потшишав.“ **laisser** + инфинитив: да пуштиш: **Laisse-moi parler.** Партиципот **fait** тука не се согласува.
  fr-b2-mise-en-relief:
    meaning: "нагласување: c'est … qui / que, ce que … c'est"
    intro: |
      **c'est … qui** го нагласува подметот, **c'est … que** сѐ друго: **C'est Marie qui a gagné.** „Марија е таа што победи.“ **C'est demain que je pars.** **ce qui / ce que … c'est** ја става темата напред: **Ce que je veux, c'est dormir. Ce qui m'étonne, c'est son calme.** По **c'est moi qui** глаголот се согласува со moi: **C'est moi qui suis…**
  fr-b2-connecteurs:
    meaning: "сврзници за спротивност и додавање"
    intro: |
      Спротивност: **pourtant** „сепак“, **cependant / toutefois / néanmoins** „меѓутоа“ (поформално), **en revanche / par contre** „од друга страна“ (par contre е разговорно). Додавање и аргумент: **d'ailleurs** „впрочем“, **de plus / en outre** „освен тоа“, **ainsi** „така“, **en effet** „навистина (како што покажуваат фактите)“.
  fr-b2-doubles-pronoms:
    meaning: "две објектни заменки заедно"
    intro: |
      Редослед пред глаголот: **me / te / se / nous / vous** → **le / la / les** → **lui / leur** → **y** → **en**: **Il me le donne. Je le lui ai dit. Je leur en parle.** Во потврдниот заповеден, по глаголот со цртички: **Donne-le-moi. Dites-le-lui.**
