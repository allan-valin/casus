# Arabic text of the French course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Articles and nouns: "الأدوات والأسماء"
  Être, avoir and the present: "être وavoir والمضارع"
  Negation and questions: "النفي والأسئلة"
  Adjectives and possessives: "الصفات وضمائر الملكية"
  The past: "الماضي"
  Pronouns: "الضمائر"
lessons:
  fr-articles:
    meaning: "أدوات التعريف والجنس"
    intro: |
      كل اسم **مذكر** أو **مؤنث** (كالعربية): **le livre** (الكتاب)، **la table** (الطاولة)؛ وقبل الصائت أو h الصامتة **l'**: **l'homme، l'école**. والجمع **les** للجنسين. والتنكير: **un** livre، **une** table، **des** livres. وتستعمل الفرنسية أداة التعريف أكثر، كالعربية: **J'aime le café** «أحب القهوة». وبعد النفي تصير **un / une / des** إلى **de**: **Je n'ai pas de voiture.**
  fr-etre-avoir:
    meaning: "être «يكون» وavoir «يملك»"
    intro: |
      **être**: je **suis**، tu **es**، il **est**، nous **sommes**، vous **êtes**، ils **sont**. **avoir**: j'**ai**، tu **as**، il **a**، nous **avons**، vous **avez**، ils **ont**. وتقول الفرنسية *عندي* للعمر والجوع والبرد: **J'ai vingt ans** «عمري عشرون»، **J'ai faim**، **J'ai froid**.
  fr-er-verbs:
    meaning: "مضارع أفعال -er"
    intro: |
      تسعة أفعال فرنسية من كل عشرة تنتهي بـ **-er** (**parler**، **aimer**، **habiter**). احذف **-er** وأضف **-e، -es، -e، -ons، -ez، -ent**: je parl**e**، tu parl**es**، il parl**e**، nous parl**ons**، vous parl**ez**، ils parl**ent**. وصيغ **-e، -es، -ent** تُنطق واحدة.
  fr-irregular-present:
    meaning: "أفعال شاذة شائعة في المضارع"
    intro: |
      **aller** (ذهب): vais، vas، va، allons، allez، vont. **faire** (فعل، صنع): fais، fais، fait، faisons، faites، font. **pouvoir** (استطاع): peux، peux، peut، pouvons، pouvez، peuvent. **vouloir** (أراد): veux، veux، veut، voulons، voulez، veulent. **venir** (جاء): viens، viens، vient، venons، venez، viennent. **prendre** (أخذ): prends، prends، prend، prenons، prenez، prennent.
  fr-negation:
    meaning: "النفي: ne … pas، jamais، rien، plus"
    intro: |
      **ne** (و n' قبل الصائت) قبل الفعل و**pas** بعده: **Je ne sais pas.** «لا أعرف». وبدل pas: **jamais** (أبدًا)، **rien** (لا شيء)، **plus** (لم يعد)، **personne** (لا أحد). وفي الكلام تُحذف **ne** كثيرًا: **Je sais pas.**
  fr-questions:
    meaning: "أدوات الاستفهام"
    intro: |
      **qui** من، **que / quoi** ماذا، **où** أين، **quand** متى، **comment** كيف، **pourquoi** لماذا، **combien** كم، **quel / quelle** أيّ. وثلاث طرق للسؤال: بالنغمة (**Tu viens ?**)، و**est-ce que** (**Est-ce que tu viens ?** — كـ«هل»)، وبالقلب (**Viens-tu ?**، رسمي).
  fr-adjectives:
    meaning: "الصفات تطابق: -e، -s"
    intro: |
      المؤنث **+e**، والجمع **+s**: **un petit garçon، une petite fille، des petits garçons، des petites filles**. وبعضها يتغير أكثر: **beau / belle، nouveau / nouvelle، blanc / blanche، heureux / heureuse**. وأكثرها بعد الاسم كالعربية (**une voiture rouge**)؛ والقصيرة الشائعة قبله (**grand، petit، bon، beau، jeune، vieux**).
  fr-possessives:
    meaning: "ضمائر الملكية: mon، ton، son، notre، votre، leur"
    intro: |
      تطابق **المملوك** لا المالك: **mon livre، ma maison، mes amis**؛ **ton / ta / tes**؛ **son / sa / ses** (له *أو* لها: **sa maison** = بيته أو بيتها)؛ **notre / nos، votre / vos، leur / leurs**. وقبل الصائت يأخذ المؤنث **mon / ton / son**: **mon amie**.
  fr-prepositions:
    meaning: "à وde مع أداة التعريف: au، aux، du، des"
    intro: |
      **à + le = au**، **à + les = aux**، **de + le = du**، **de + les = des**؛ و**à la، à l'، de la، de l'** تبقى منفصلة: **Je vais au cinéma, à la plage, aux États-Unis.** **Il vient du Brésil.** وأداة التبعيض *بعض*: **du pain، de la confiture، des fruits**.
  fr-futur-proche:
    meaning: "المستقبل القريب: aller + المصدر"
    intro: |
      **aller** في المضارع + المصدر: **Je vais manger.** «سآكل الآن». **On va voir.** «سنرى». وهو المستقبل اليومي في الكلام.
  fr-passe-compose:
    meaning: "الماضي المركب: avoir / être + اسم المفعول"
    intro: |
      **avoir** + اسم المفعول لأكثر الأفعال: **J'ai mangé.** «أكلت». أسماء المفعول: **-er → -é** (parlé)، **-ir → -i** (fini)، وغيرها يختلف (**fait، pris، vu، eu، été، dit، mis**). وأفعال الحركة والتحوّل وكل الأفعال الانعكاسية تأخذ **être**، ويطابق اسم المفعول: **Elle est partie. Nous sommes allés. Je me suis levé.**
  fr-imparfait:
    meaning: "الماضي الناقص: كان يفعل، اعتاد"
    intro: |
      جذر **nous** في المضارع بلا **-ons**، مع **-ais، -ais، -ait، -ions، -iez، -aient**: nous parl-ons → **je parlais**؛ nous fais-ons → **je faisais**؛ و**être** وحدها شاذة: **j'étais**. للخلفية والعادات والوصف في الماضي، كـ«كان يفعل»: **Quand j'étais petit, je jouais au foot.** «حين كنت صغيرًا كنت ألعب الكرة».
  fr-futur:
    meaning: "المستقبل البسيط"
    intro: |
      المصدر (بلا e الأخيرة) + **-ai، -as، -a، -ons، -ez، -ont**: **je parlerai، tu finiras، il prendra**. والجذور الشاذة: **être → ser-، avoir → aur-، aller → ir-، faire → fer-، pouvoir → pourr-، venir → viendr-، voir → verr-، vouloir → voudr-**.
  fr-object-pronouns:
    meaning: "ضمائر المفعول قبل الفعل"
    intro: |
      المباشرة: **me، te، le، la، nous، vous، les**؛ وغير المباشرة: **me، te، lui، nous، vous، leur**. وتأتي **قبل** الفعل (وقبل المساعد في الأزمنة المركبة): **Je le vois. Je lui parle. Je l'ai vu.** وفي الأمر المثبت بعده: **Donne-le-moi !**
  fr-reflexive:
    meaning: "الأفعال الانعكاسية: se lever، s'appeler"
    intro: |
      **me، te، se، nous، vous، se** قبل الفعل: **Je m'appelle Ana.** «اسمي آنا». **Il se lève à sept heures. Nous nous amusons.** وفي الماضي المركب مع **être**: **Je me suis levé(e).**
  fr-comparison:
    meaning: "المقارنة: plus، moins، aussi … que"
    intro: |
      **plus … que** أكثر من، **moins … que** أقل من، **aussi … que** بقدر: **Il est plus grand que moi.** «هو أطول مني». والتفضيل المطلق **le plus / le moins**: **la plus belle ville**. والشاذ: **bon → meilleur**، **bien → mieux**.
