# German text of the French course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Articles and nouns: "Artikel und Nomen"
  Être, avoir and the present: "Être, avoir und das Präsens"
  Negation and questions: "Verneinung und Fragen"
  Adjectives and possessives: "Adjektive und Possessive"
  The past: "Die Vergangenheit"
  Pronouns: "Pronomen"
lessons:
  fr-articles:
    meaning: "die Artikel und das Genus"
    intro: |
      Jedes Nomen ist **maskulin** oder **feminin** (kein Neutrum): **le livre** (das Buch), **la table** (der Tisch); vor Vokal oder stummem h **l'**: **l'homme, l'école**. Plural **les** für beide. Unbestimmt: **un** livre, **une** table, **des** livres. Französisch setzt den Artikel öfter: **J'aime le café** „Ich mag Kaffee“. Nach Verneinung werden **un / une / des** zu **de**: **Je n'ai pas de voiture.**
  fr-etre-avoir:
    meaning: "être „sein“ und avoir „haben“"
    intro: |
      **être**: je **suis**, tu **es**, il **est**, nous **sommes**, vous **êtes**, ils **sont**. **avoir**: j'**ai**, tu **as**, il **a**, nous **avons**, vous **avez**, ils **ont**. Französisch sagt *haben* bei Alter, Hunger und Kälte: **J'ai vingt ans**, **J'ai faim**, **J'ai froid**.
  fr-er-verbs:
    meaning: "das Präsens der Verben auf -er"
    intro: |
      Neun von zehn französischen Verben enden auf **-er** (**parler**, **aimer**, **habiter**). **-er** weg und **-e, -es, -e, -ons, -ez, -ent** anhängen: je parl**e**, tu parl**es**, il parl**e**, nous parl**ons**, vous parl**ez**, ils parl**ent**. Die Formen auf **-e, -es, -ent** klingen gleich.
  fr-irregular-present:
    meaning: "häufige unregelmäßige Verben im Präsens"
    intro: |
      **aller** (gehen): vais, vas, va, allons, allez, vont. **faire** (machen): fais, fais, fait, faisons, faites, font. **pouvoir** (können): peux, peux, peut, pouvons, pouvez, peuvent. **vouloir** (wollen): veux, veux, veut, voulons, voulez, veulent. **venir** (kommen): viens, viens, vient, venons, venez, viennent. **prendre** (nehmen): prends, prends, prend, prenons, prenez, prennent.
  fr-negation:
    meaning: "Verneinung: ne … pas, jamais, rien, plus"
    intro: |
      **ne** (n' vor Vokal) vor dem Verb und **pas** danach: **Je ne sais pas.** „Ich weiß nicht.“ Statt pas: **jamais** (nie), **rien** (nichts), **plus** (nicht mehr), **personne** (niemand). Gesprochen fällt **ne** oft weg: **Je sais pas.**
  fr-questions:
    meaning: "Fragewörter"
    intro: |
      **qui** wer, **que / quoi** was, **où** wo, **quand** wann, **comment** wie, **pourquoi** warum, **combien** wie viel, **quel / quelle** welcher. Drei Arten zu fragen: Intonation (**Tu viens ?**), **est-ce que** (**Est-ce que tu viens ?**), Inversion (**Viens-tu ?**, förmlich).
  fr-adjectives:
    meaning: "Adjektive kongruieren: -e, -s"
    intro: |
      Feminin **+e**, Plural **+s**: **un petit garçon, une petite fille, des petits garçons, des petites filles**. Manche ändern sich mehr: **beau / belle, nouveau / nouvelle, blanc / blanche, heureux / heureuse**. Die meisten stehen nach dem Nomen (**une voiture rouge**); kurze häufige davor (**grand, petit, bon, beau, jeune, vieux**).
  fr-possessives:
    meaning: "Possessive: mon, ton, son, notre, votre, leur"
    intro: |
      Sie richten sich nach dem **Besitztum**, nicht nach dem Besitzer: **mon livre, ma maison, mes amis**; **ton / ta / tes**; **son / sa / ses** (sein *oder* ihr: **sa maison** = sein oder ihr Haus); **notre / nos, votre / vos, leur / leurs**. Vor Vokal nimmt das Femininum **mon / ton / son**: **mon amie**.
  fr-prepositions:
    meaning: "à und de mit dem Artikel: au, aux, du, des"
    intro: |
      **à + le = au**, **à + les = aux**, **de + le = du**, **de + les = des** — wie deutsch *zum, vom*; **à la, à l', de la, de l'** bleiben getrennt: **Je vais au cinéma, à la plage, aux États-Unis.** **Il vient du Brésil.** Teilungsartikel *etwas*: **du pain, de la confiture, des fruits**.
  fr-futur-proche:
    meaning: "das nahe Futur: aller + Infinitiv"
    intro: |
      **aller** im Präsens + Infinitiv: **Je vais manger.** „Ich werde (gleich) essen.“ **On va voir.** „Mal sehen.“ Das alltägliche Futur der gesprochenen Sprache.
  fr-passe-compose:
    meaning: "das Passé composé: avoir / être + Partizip"
    intro: |
      **avoir** + Partizip Perfekt bei den meisten Verben: **J'ai mangé.** „Ich habe gegessen.“ Partizipien: **-er → -é** (parlé), **-ir → -i** (fini), andere variieren (**fait, pris, vu, eu, été, dit, mis**). Verben der Bewegung und Veränderung und alle reflexiven nehmen **être**, und das Partizip kongruiert — ähnlich wie deutsch *ich bin gegangen*: **Elle est partie. Nous sommes allés. Je me suis levé.**
  fr-imparfait:
    meaning: "das Imparfait: tat gerade, pflegte zu"
    intro: |
      Stamm von **nous** im Präsens minus **-ons**, plus **-ais, -ais, -ait, -ions, -iez, -aient**: nous parl-ons → **je parlais**; nous fais-ons → **je faisais**; nur **être** ist unregelmäßig: **j'étais**. Hintergrund, Gewohnheiten und Beschreibungen in der Vergangenheit: **Quand j'étais petit, je jouais au foot.**
  fr-futur:
    meaning: "das einfache Futur"
    intro: |
      Infinitiv (ohne End-e) + **-ai, -as, -a, -ons, -ez, -ont**: **je parlerai, tu finiras, il prendra**. Unregelmäßige Stämme: **être → ser-, avoir → aur-, aller → ir-, faire → fer-, pouvoir → pourr-, venir → viendr-, voir → verr-, vouloir → voudr-**.
  fr-object-pronouns:
    meaning: "Objektpronomen vor dem Verb"
    intro: |
      Direkt: **me, te, le, la, nous, vous, les**; indirekt: **me, te, lui, nous, vous, leur**. Sie stehen **vor** dem Verb (in zusammengesetzten Tempora vor dem Hilfsverb): **Je le vois. Je lui parle. Je l'ai vu.** Im bejahten Imperativ danach: **Donne-le-moi !**
  fr-reflexive:
    meaning: "reflexive Verben: se lever, s'appeler"
    intro: |
      **me, te, se, nous, vous, se** vor dem Verb: **Je m'appelle Ana. Il se lève à sept heures. Nous nous amusons.** Im Passé composé mit **être**: **Je me suis levé(e).**
  fr-comparison:
    meaning: "Steigerung: plus, moins, aussi … que"
    intro: |
      **plus … que** mehr als, **moins … que** weniger als, **aussi … que** so … wie: **Il est plus grand que moi.** Superlativ **le plus / le moins**: **la plus belle ville**. Unregelmäßig: **bon → meilleur**, **bien → mieux**.
