# German text of the French course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Literary tenses: "Literarische Tempora"
  Syntax of careful French: "Syntax des gepflegten Französisch"
  Mood and nuance: "Modus und Nuance"
  Literary style: "Literarischer Stil"
  Fine points of syntax: "Feinheiten der Syntax"
  Register: "Register"
lessons:
  fr-c1-passe-simple:
    meaning: "das Passé simple (Erkennen)"
    intro: |
      Das Tempus der schriftlichen Erzählung — Romane, Märchen, Geschichte —, wo gesprochen das Passé composé steht; vergleichbar dem deutschen Präteritum in Erzählungen. Meist 3. Person: **-er**-Verben **il parla, ils parlèrent**; **-ir / -re** **il finit, ils finirent**; **-oir** und andere **il put, ils purent**. Unregelmäßig: **être → il fut**, **avoir → il eut**, **faire → il fit**, **venir → il vint**, **naître → il naquit**.
  fr-c1-subj-imparfait:
    meaning: "der Subjonctif imparfait (Erkennen)"
    intro: |
      Die klassische Literatur wahrt die Zeitenfolge: nach einem Hauptverb in der Vergangenheit der Subjonctif imparfait: **Il fallait qu'il partît. Je voulais qu'elle vînt.** Bildung: vom Passé simple, **-sse, -sses, -^t, -ssions, -ssiez, -ssent**: **parla → qu'il parlât**, **fut → qu'il fût**, **vint → qu'il vînt**. Heute lebt er fast nur in der 3. Singular; gesprochen nimmt man den Subjonctif présent.
  fr-c1-passe-anterieur:
    meaning: "das Passé antérieur"
    intro: |
      Passé simple von **avoir / être** + Partizip, nach **quand, lorsque, dès que, aussitôt que, après que, à peine**: eine Handlung unmittelbar vor einer anderen im Passé simple. **Dès qu'il eut fini, il sortit. Quand elle fut partie, il pleura.** Nur in schriftlicher Erzählung; gesprochen: **dès qu'il a eu fini** oder einfach **après avoir fini**.
  fr-c1-inversion:
    meaning: "Inversion von Subjekt und Verb und das euphonische -t-"
    intro: |
      Förmliche Fragen invertieren ein Pronomen-Subjekt mit Bindestrich: **Viendra-t-il ? Que veut-elle ? Puis-je entrer ?** Zwischen zwei Vokalen wird ein **-t-** eingeschoben: **a-t-il, parle-t-on, va-t-elle** (nicht nach -d / -t: **prend-il, est-il**). Geschriebenes Französisch invertiert auch nach **peut-être, sans doute, aussi** „daher“, **à peine, ainsi, du moins**: **Peut-être viendra-t-il. Aussi a-t-il refusé.**
  fr-c1-ne-expletif:
    meaning: "das expletive ne"
    intro: |
      Im gepflegten Französisch steht ein **ne** ohne **pas** nach **avant que, à moins que, de peur que, craindre que, empêcher que** und in Ungleichheitsvergleichen: **Pars avant qu'il ne pleuve. Je crains qu'il ne soit trop tard. C'est plus difficile que je ne pensais.** Es ist keine Verneinung: die Bedeutung ist positiv. Es ist fakultativ; gesprochen fällt es meist weg.
  fr-c1-ne-que:
    meaning: "Einschränkung: ne … que (nur)"
    intro: |
      **ne … que** heißt „nur“, mit **que** direkt vor dem Eingeschränkten: **Je n'ai qu'un frère. Il ne pense qu'à l'argent. On ne vit qu'une fois.** Es ist keine Verneinung: **de** ersetzt den Artikel nicht (**Je ne bois que de l'eau**). **ne … pas que** = „nicht nur“.
  fr-c1-lequel:
    meaning: "lequel und seine Verschmelzungen nach Präpositionen"
    intro: |
      Nach einer Präposition ist das Relativum für Sachen **lequel, laquelle, lesquels, lesquelles**, verschmolzen mit **à** (**auquel, auxquels, auxquelles**) und **de** (**duquel, desquels, desquelles**): **la raison pour laquelle, le projet auquel je pense, le parc près duquel j'habite.** Für Personen ist **qui** üblich: **l'ami à qui je parle**. Mit bloßem **de** nimmt man lieber **dont**.
  fr-c1-accord-participe:
    meaning: "Kongruenz des Partizips mit avoir"
    intro: |
      Mit **avoir** kongruiert das Partizip mit dem direkten Objekt nur, wenn dieses davor steht: **J'ai écrit la lettre**, aber **la lettre que j'ai écrite**, **Je les ai vus**, **Quelles robes as-tu achetées ?** Nie mit **en** oder einem indirekten Objekt: **Je leur ai parlé.** Hörbar nur bei Partizipien auf Konsonant: **écrite, prise, faite**.
  fr-c1-esperer-souhaiter:
    meaning: "Indikativ oder Subjonctif: espérer, souhaiter, après que, le fait que"
    intro: |
      Manche Paare sehen ähnlich aus, unterscheiden sich aber: **espérer que** + Indikativ (**J'espère qu'il viendra**), **souhaiter que** + Subjonctif (**Je souhaite qu'il vienne**). **après que** + Indikativ, **avant que** + Subjonctif. **le fait que** nimmt meist den Subjonctif. **se douter que** „ahnen“ nimmt den Indikativ, anders als **douter que**.
    mistakes: ["espérer nimmt den Indikativ."]
  fr-c1-avoir-beau:
    meaning: "Einräumung: avoir beau, quand bien même, si … que"
    intro: |
      **avoir beau** + Infinitiv „so sehr … auch, vergeblich“: **J'ai beau essayer, je n'y arrive pas.** „So sehr ich es auch versuche, ich schaffe es nicht.“ **quand bien même** + Konditional „selbst wenn“: **Quand bien même il viendrait, je ne lui parlerais pas.** **si / aussi** + Adjektiv + **que** + Subjonctif: **Si riche qu'il soit, il n'est pas heureux.** Außerdem **où que, quoi que, qui que** (C2).
  fr-c1-on-nous:
    meaning: "on für nous und andere Züge des gesprochenen Französisch"
    intro: |
      Gesprochen ersetzt **on** fast immer **nous**, mit Verb in der 3. Person Singular, aber Pluralkongruenz: **On est partis à huit heures. On y va ?** Gesprochenes Französisch lässt auch **ne** weg (**Je sais pas**), nimmt **ça** für **cela** und verkürzt **il y a** zu **y a**. Schriftlich bleiben **nous** und **ne**.
  fr-c1-adverbes-ment:
    meaning: "Adverbien auf -amment und -emment"
    intro: |
      Adjektive auf **-ant** ergeben **-amment** (**courant → couramment, constant → constamment**); Adjektive auf **-ent** ergeben **-emment** (**évident → évidemment, récent → récemment**). Beide werden **[amɑ̃]** ausgesprochen. Ausnahmen: **lent → lentement, présent → présentement**.
  fr-c2-eut-ete:
    meaning: "der Subjonctif plus-que-parfait als literarischer Konditional"
    intro: |
      **eût / fût** + Partizip ist der Subjonctif plus-que-parfait. Neben seinem normalen Gebrauch (**Bien qu'il eût fini…**) nimmt ihn die Literatur für den Konditional II, die sogenannte *conditionnel passé deuxième forme*: **On eût dit un enfant** „Man hätte ein Kind vermutet“. **Qui l'eût cru ?** „Wer hätte das gedacht?“ **S'il fût venu, je l'eusse vu** = s'il était venu, je l'aurais vu.
  fr-c2-incise:
    meaning: "Inversion in Redebegleitsätzen (Incises)"
    intro: |
      Nach oder in wörtlicher Rede steht das Redeverb zuerst, das Subjekt danach — wie im Deutschen *sagte er*: **« Je viens », dit-il. « Pourquoi ? » demanda-t-elle. « Non », répondit Marie.** Bei Pronomen-Subjekt Bindestriche und nach Vokal das euphonische **-t-**: **ajouta-t-il, s'écria-t-elle**. Die gerade Wortfolge (~~il dit~~) ist hier falsch.
  fr-c2-ne-seul:
    meaning: "ne ohne pas im literarischen Französisch"
    intro: |
      Bei **savoir, pouvoir, oser, cesser** kann literarisches Französisch mit **ne** allein verneinen: **Je ne saurais vous dire** „Ich könnte es Ihnen nicht sagen“, **Je n'ose le croire**, **Il ne cesse de pleuvoir** „Es hört nicht auf zu regnen“, **Je ne puis** (alte Form von je ne peux). Auch **si je ne me trompe** „wenn ich mich nicht irre“ und **n'importe**.
  fr-c2-quel-que:
    meaning: "konzessive Relativa: quel que, quoi que, qui que, où que"
    intro: |
      **quel que** + **être** im Subjonctif, wobei **quel** mit dem Subjekt kongruiert: **quel que soit le prix, quelle que soit la raison, quels que soient les risques.** **quoi que** „was auch immer“ (in zwei Wörtern; **quoique** = obwohl), **qui que** „wer auch immer“, **où que** „wo auch immer“: **Quoi que tu fasses, je t'aime. Où que tu ailles…**
  fr-c2-tout-adverbe:
    meaning: "tout als Adverb: wann es kongruiert"
    intro: |
      Vor einem Adjektiv heißt **tout** „ganz, völlig“ und ist Adverb: unveränderlich (**ils sont tout contents, elle est tout heureuse**) — außer vor einem femininen Adjektiv, das mit Konsonant oder h aspiré beginnt; dort kongruiert es des Klangs wegen: **elle est toute contente, elles sont toutes honteuses.**
  fr-c2-accord-pronominal:
    meaning: "Kongruenz des Partizips reflexiver Verben"
    intro: |
      Reflexive Verben nehmen **être**, aber das Partizip kongruiert nur mit einem vorangehenden direkten Objekt: **Elle s'est lavée** (se = direktes Objekt), aber **Elle s'est lavé les mains** (das Objekt les mains folgt) und **Ils se sont parlé** (se = indirekt: parler à). Nur reflexiv gebrauchte Verben kongruieren mit dem Subjekt: **Elle s'est souvenue.**
  fr-c2-negation-litteraire:
    meaning: "literarische Verneinung: ni … ni, nul, aucun, guère, nullement"
    intro: |
      **ne … ni … ni** „weder … noch“: **Il ne boit ni vin ni bière** (ohne Artikel). **nul / nulle** „kein, niemand“ (förmlich): **Nul n'est censé ignorer la loi.** „Unkenntnis schützt vor Strafe nicht.“ **ne … guère** „kaum“: **Je ne le vois guère.** **ne … nullement** „keineswegs“. **aucun** als Pronomen: **Aucun n'est venu.**
  fr-c2-que-initial:
    meaning: "que + Subjonctif am Satzanfang"
    intro: |
      **que** + Subjonctif allein gibt einen Befehl oder Wunsch für die 3. Person: **Qu'il entre ! Que le meilleur gagne ! Qu'elle se taise.** Ein **que**-Satz kann auch als Subjekt oder Thema den Satz eröffnen, weiter im Subjonctif: **Qu'il soit en retard ne m'étonne pas.** **Que tu le veuilles ou non** „ob du willst oder nicht“.
  fr-c2-ce-dont:
    meaning: "ce dont, ce à quoi, ce sur quoi"
    intro: |
      **ce** + Relativum bezieht sich auf eine Idee: **ce qui, ce que** (B2), **ce dont** bei Verben mit **de** (**avoir besoin de, parler de**): **Ce dont j'ai besoin, c'est de repos.** Mit anderen Präpositionen **ce à quoi, ce sur quoi, ce contre quoi**: **C'est ce à quoi je pensais.** „Genau daran habe ich gedacht.“
  fr-c2-participe-compose:
    meaning: "das Partizip Perfekt und absolute Konstruktionen"
    intro: |
      **ayant / étant** + Partizip bezeichnet eine abgeschlossene frühere Handlung: **Ayant terminé son travail, il est sorti. Étant arrivée en retard, elle s'est excusée.** Geschriebenes Französisch bildet auch absolute Sätze mit bloßem Partizip: **Le repas terminé, on a dansé. Une fois arrivés, appelez-moi.**
  fr-c2-familier:
    meaning: "umgangssprachlicher Wortschatz (français familier)"
    intro: |
      Das alltägliche gesprochene Französisch hat einen zweiten Wortschatz: **bosser** = travailler, **le boulot** = le travail, **une bagnole** = une voiture, **le fric** = l'argent, **un mec / une meuf** = un homme / une femme, **un flic** = un policier, **un truc** = une chose, **un bouquin** = un livre, **piger** = comprendre, **bouffer** = manger. Unter Freunden in Ordnung, schriftlich fehl am Platz.
