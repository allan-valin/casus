# Arabic text of the French course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Literary tenses: "الأزمنة الأدبية"
  Syntax of careful French: "نحو الفرنسية المتأنية"
  Mood and nuance: "الصيغة والفروق الدقيقة"
  Literary style: "الأسلوب الأدبي"
  Fine points of syntax: "دقائق النحو"
  Register: "مستوى اللغة"
lessons:
  fr-c1-passe-simple:
    meaning: "الماضي البسيط (للتعرّف)"
    intro: |
      زمن السرد المكتوب — الروايات والحكايات والتاريخ — حيث يستعمل الكلام الماضي المركب. وأكثره للغائب: أفعال **-er** **il parla، ils parlèrent**؛ و**-ir / -re** **il finit، ils finirent**؛ و**-oir** وغيرها **il put، ils purent**. والشاذ: **être → il fut**، **avoir → il eut**، **faire → il fit**، **venir → il vint**، **naître → il naquit**.
  fr-c1-subj-imparfait:
    meaning: "الالتماسي الناقص (للتعرّف)"
    intro: |
      يحفظ الأدب الكلاسيكي توافق الأزمنة: بعد فعل رئيسي ماضٍ يأتي الالتماسي الناقص: **Il fallait qu'il partît. Je voulais qu'elle vînt.** الصياغة: من الماضي البسيط، **-sse، -sses، -^t، -ssions، -ssiez، -ssent**: **parla → qu'il parlât**، **fut → qu'il fût**، **vint → qu'il vînt**. واليوم لا يبقى تقريبًا إلا في الغائب المفرد؛ والكلام يستعمل الالتماسي الحاضر.
  fr-c1-passe-anterieur:
    meaning: "الماضي السابق"
    intro: |
      الماضي البسيط من **avoir / être** + اسم المفعول، بعد **quand، lorsque، dès que، aussitôt que، après que، à peine**: فعل يسبق مباشرة فعلًا آخر في الماضي البسيط. **Dès qu'il eut fini, il sortit. Quand elle fut partie, il pleura.** في السرد المكتوب فقط؛ وفي الكلام: **dès qu'il a eu fini** أو ببساطة **après avoir fini**.
  fr-c1-inversion:
    meaning: "قلب الفاعل والفعل وحرف -t- الصوتي"
    intro: |
      الأسئلة الرسمية تقلب الفاعل الضمير مع شرطة: **Viendra-t-il ? Que veut-elle ? Puis-je entrer ?** وبين صائتين يُقحم **-t-**: **a-t-il، parle-t-on، va-t-elle** (لا بعد -d / -t: **prend-il، est-il**). والفرنسية المكتوبة تقلب أيضًا بعد **peut-être، sans doute، aussi** «لذلك»، **à peine، ainsi، du moins**: **Peut-être viendra-t-il. Aussi a-t-il refusé.**
  fr-c1-ne-expletif:
    meaning: "ne الزائدة"
    intro: |
      في الفرنسية المتأنية تظهر **ne** بلا **pas** بعد **avant que، à moins que، de peur que، craindre que، empêcher que** وفي مقارنات التفاوت: **Pars avant qu'il ne pleuve. Je crains qu'il ne soit trop tard. C'est plus difficile que je ne pensais.** وليست نفيًا: المعنى مثبت. وهي اختيارية؛ والكلام يحذفها عادة.
  fr-c1-ne-que:
    meaning: "القصر: ne … que (فقط)"
    intro: |
      **ne … que** تعني «فقط»، كـ«ما … إلا»، و**que** توضع مباشرة قبل المقصور: **Je n'ai qu'un frère.** «ليس لي إلا أخ واحد». **Il ne pense qu'à l'argent. On ne vit qu'une fois.** وليست نفيًا: فلا تحلّ **de** محلّ الأداة (**Je ne bois que de l'eau**). و**ne … pas que** = «ليس فقط».
  fr-c1-lequel:
    meaning: "lequel ودمجها بعد حروف الجر"
    intro: |
      بعد حرف الجر يكون الموصول لغير العاقل **lequel، laquelle، lesquels، lesquelles**، مدموجًا مع **à** (**auquel، auxquels، auxquelles**) و**de** (**duquel، desquels، desquelles**): **la raison pour laquelle، le projet auquel je pense، le parc près duquel j'habite.** وللعاقل الشائع **qui**: **l'ami à qui je parle**. ومع **de** وحدها فضّل **dont**.
  fr-c1-accord-participe:
    meaning: "مطابقة اسم المفعول مع avoir"
    intro: |
      مع **avoir** يطابق اسم المفعول المفعولَ المباشر فقط إذا تقدّمه: **J'ai écrit la lettre** لكن **la lettre que j'ai écrite**، **Je les ai vus**، **Quelles robes as-tu achetées ?** ولا يطابق أبدًا مع **en** أو المفعول غير المباشر: **Je leur ai parlé.** ولا تُسمع المطابقة إلا في أسماء المفعول المنتهية بصامت: **écrite، prise، faite**.
  fr-c1-esperer-souhaiter:
    meaning: "الإخباري أم الالتماسي: espérer، souhaiter، après que، le fait que"
    intro: |
      بعض الأزواج متشابهة لكنها مختلفة: **espérer que** + الإخباري (**J'espère qu'il viendra**)، و**souhaiter que** + الالتماسي (**Je souhaite qu'il vienne**). **après que** + الإخباري، **avant que** + الالتماسي. و**le fait que** تأخذ غالبًا الالتماسي. و**se douter que** «ارتاب أنّ / توقّع» تأخذ الإخباري، بخلاف **douter que**.
    mistakes: ["espérer تأخذ الإخباري."]
  fr-c1-avoir-beau:
    meaning: "التسليم: avoir beau، quand bien même، si … que"
    intro: |
      **avoir beau** + المصدر «مهما … عبثًا»: **J'ai beau essayer, je n'y arrive pas.** «مهما حاولت لا أنجح». و**quand bien même** + الشرطي «حتى لو»: **Quand bien même il viendrait, je ne lui parlerais pas.** و**si / aussi** + صفة + **que** + الالتماسي: **Si riche qu'il soit, il n'est pas heureux.** «مهما كان غنيًا فليس سعيدًا». وكذلك **où que، quoi que، qui que** (C2).
  fr-c1-on-nous:
    meaning: "on بدل nous وسمات أخرى للفرنسية المحكية"
    intro: |
      في الكلام تحلّ **on** محلّ **nous** دائمًا تقريبًا، مع فعل الغائب المفرد لكن بمطابقة الجمع: **On est partis à huit heures. On y va ?** والفرنسية المحكية تحذف **ne** أيضًا (**Je sais pas**)، وتستعمل **ça** بدل **cela**، وتختصر **il y a** إلى **y a**. وفي الكتابة احتفظ بـ **nous** و**ne**.
  fr-c1-adverbes-ment:
    meaning: "الظروف المنتهية بـ -amment و-emment"
    intro: |
      الصفات المنتهية بـ **-ant** تعطي **-amment** (**courant → couramment، constant → constamment**)؛ والمنتهية بـ **-ent** تعطي **-emment** (**évident → évidemment، récent → récemment**). وكلتاهما تُنطق **[amɑ̃]**. والاستثناءات: **lent → lentement، présent → présentement**.
  fr-c2-eut-ete:
    meaning: "الالتماسي البعيد شرطيًا أدبيًا"
    intro: |
      **eût / fût** + اسم المفعول هو الالتماسي البعيد. وبجانب استعماله العادي (**Bien qu'il eût fini…**) يستعمله الأدب للشرطي الماضي، المسمى *conditionnel passé deuxième forme*: **On eût dit un enfant** «لكأنه طفل». **Qui l'eût cru ?** «من كان يظن ذلك؟» **S'il fût venu, je l'eusse vu** = s'il était venu, je l'aurais vu.
  fr-c2-incise:
    meaning: "القلب في جمل الإسناد (incises)"
    intro: |
      بعد الكلام المنقول حرفيًا أو داخله يتقدّم فعل القول ويتأخر الفاعل — كـ«قال فلان» في العربية: **« Je viens », dit-il. « Pourquoi ? » demanda-t-elle. « Non », répondit Marie.** ومع الفاعل الضمير شرطات و**-t-** الصوتية بعد الصائت: **ajouta-t-il، s'écria-t-elle**. والترتيب العادي (~~il dit~~) خطأ هنا.
  fr-c2-ne-seul:
    meaning: "ne بلا pas في الفرنسية الأدبية"
    intro: |
      مع **savoir، pouvoir، oser، cesser** قد تنفي الفرنسية الأدبية بـ **ne** وحدها: **Je ne saurais vous dire** «ما كنت لأستطيع أن أقول لك»، **Je n'ose le croire**، **Il ne cesse de pleuvoir** «لا يكفّ المطر»، **Je ne puis** (صيغة قديمة لـ je ne peux). وكذلك **si je ne me trompe** «إن لم أكن مخطئًا» و**n'importe**.
  fr-c2-quel-que:
    meaning: "موصولات التسليم: quel que، quoi que، qui que، où que"
    intro: |
      **quel que** + **être** في الالتماسي، و**quel** تطابق الفاعل: **quel que soit le prix، quelle que soit la raison، quels que soient les risques.** و**quoi que** «مهما» (كلمتان؛ و**quoique** = مع أنّ)، **qui que** «أيًّا كان»، **où que** «أينما»: **Quoi que tu fasses, je t'aime.** «مهما فعلت فأنا أحبك». **Où que tu ailles…**
  fr-c2-tout-adverbe:
    meaning: "tout ظرفًا: متى تطابق"
    intro: |
      قبل الصفة تعني **tout** «تمامًا، كليًا» وتكون ظرفًا: لا تتغير (**ils sont tout contents، elle est tout heureuse**) — إلا قبل صفة مؤنثة تبدأ بصامت أو h مهموسة، فتطابق لأجل الصوت: **elle est toute contente، elles sont toutes honteuses.**
  fr-c2-accord-pronominal:
    meaning: "مطابقة اسم المفعول في الأفعال الانعكاسية"
    intro: |
      الأفعال الانعكاسية تأخذ **être**، لكن اسم المفعول يطابق فقط مفعولًا مباشرًا متقدّمًا: **Elle s'est lavée** (se = مفعول مباشر) لكن **Elle s'est lavé les mains** (المفعول les mains متأخر) و**Ils se sont parlé** (se = غير مباشر: parler à). والأفعال التي لا تُستعمل إلا انعكاسية تطابق الفاعل: **Elle s'est souvenue.**
  fr-c2-negation-litteraire:
    meaning: "النفي الأدبي: ni … ni، nul، aucun، guère، nullement"
    intro: |
      **ne … ni … ni** «لا … ولا»: **Il ne boit ni vin ni bière** (بلا أداة). **nul / nulle** «لا أحد، لا … أيّ» (رسمي): **Nul n'est censé ignorer la loi.** «لا يُعذر أحد بجهل القانون». **ne … guère** «بالكاد»: **Je ne le vois guère.** **ne … nullement** «إطلاقًا». و**aucun** ضميرًا: **Aucun n'est venu.**
  fr-c2-que-initial:
    meaning: "que + الالتماسي في أول الجملة"
    intro: |
      **que** + الالتماسي وحدها تفيد أمرًا أو تمنيًا للغائب، كلام الأمر «لـ»: **Qu'il entre !** «ليدخل!» **Que le meilleur gagne ! Qu'elle se taise.** ويمكن لجملة **que** أن تفتتح الجملة فاعلًا أو موضوعًا، وتبقى في الالتماسي: **Qu'il soit en retard ne m'étonne pas.** **Que tu le veuilles ou non** «شئت أم أبيت».
  fr-c2-ce-dont:
    meaning: "ce dont، ce à quoi، ce sur quoi"
    intro: |
      **ce** + الموصول يعود على فكرة: **ce qui، ce que** (B2)، و**ce dont** للأفعال مع **de** (**avoir besoin de، parler de**): **Ce dont j'ai besoin, c'est de repos.** «ما أحتاجه هو الراحة». ومع حروف جر أخرى **ce à quoi، ce sur quoi، ce contre quoi**: **C'est ce à quoi je pensais.**
  fr-c2-participe-compose:
    meaning: "اسم الفاعل التام والتراكيب المطلقة"
    intro: |
      **ayant / étant** + اسم المفعول يدل على فعل سابق منتهٍ: **Ayant terminé son travail, il est sorti.** «وقد أنهى عمله خرج». **Étant arrivée en retard, elle s'est excusée.** والفرنسية المكتوبة تبني أيضًا جملًا مطلقة باسم مفعول مجرد: **Le repas terminé, on a dansé. Une fois arrivés, appelez-moi.**
  fr-c2-familier:
    meaning: "المفردات العامية (français familier)"
    intro: |
      للفرنسية المحكية اليومية معجم ثانٍ: **bosser** = travailler، **le boulot** = le travail، **une bagnole** = une voiture، **le fric** = l'argent، **un mec / une meuf** = un homme / une femme، **un flic** = un policier، **un truc** = une chose، **un bouquin** = un livre، **piger** = comprendre، **bouffer** = manger. مقبولة مع الأصدقاء، وغير لائقة في الكتابة.
