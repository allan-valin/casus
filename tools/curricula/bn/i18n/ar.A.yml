# Arabic text of the Bengali course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "الأصوات والحروف"
  Nouns and classifiers: "الأسماء والمصنِّفات"
  Pronouns and the present: "الضمائر والمضارع"
  The cases: "الحالات"
  Questions and negation: "الأسئلة والنفي"
  Past, future and continuous: "الماضي والمستقبل والمستمر"
  Postpositions and compound verbs: "الأدوات اللاحقة والأفعال المركّبة"
  Clauses and moods: "الجمل والصيغ"
  Register: "مستوى اللغة"
  Talking about ideas: "الحديث عن الأفكار"
  Literature: "الأدب"
lessons:
  bn-script:
    meaning: "الخط البنغالي"
    intro: |
      تُكتب البنغالية من اليسار إلى اليمين تحت خط علوي، كالديفاناغاري التي تشبهها. كل حرف صامت يحمل *o* مفتوحة: **ক** *ko*؛ وعلامات الحركات تغيّرها: **কা** *ka*، **কি** *ki*، **কু** *ku*، **কে** *ke*، **কো** *ko*. والحركات المستقلّة تبدأ بها الكلمات (**অ আ ই উ এ ও**)، والحروف المركّبة تجمع الصوامت (**ক্ষ, ন্ত, স্ত**).
  bn-classifier:
    meaning: "لا جنس؛ المصنِّفان -টা / -টি"
    intro: |
      ليس في البنغالية جنس نحوي ولا أداة تعريف. والتعريف مصنِّف يلحق بالاسم: **বই** (كتاب، كتب) → **বইটা / বইটি** (الكتاب؛ و**-টি** أكثر رسمية أو رقّة). ومع الأعداد أيضًا: **একটা বই** (كتاب واحد)، **দুটো বই** (كتابان).
  bn-plural:
    meaning: "الجمع: -রা للناس، -গুলো للأشياء"
    intro: |
      **-রা / -এরা** للناس (**ছেলেরা** الأولاد، **মানুষেরা**)، و**-গুলো / -গুলি** للأشياء والحيوانات (**বইগুলো** الكتب). وبعد الأعداد وكلمات مثل **অনেক** (كثير) لا لاحقة جمع: **অনেক বই**.
  bn-pronouns:
    meaning: "الضمائر الشخصية وثلاث درجات للمخاطَب"
    intro: |
      **আমি** (أنا)، **তুই** (أنت، حميمية)، **তুমি** (أنت)، **আপনি** (حضرتك)، **সে / তিনি** (هو أو هي؛ **তিনি** للاحترام)، **আমরা** (نحن)، **তোমরা / আপনারা** (أنتم)، **তারা / তাঁরা** (هم). والفعل يتبع درجة الاحترام لا العدد.
  bn-present:
    meaning: "المضارع البسيط بحسب الشخص"
    intro: |
      **আমি পড়ি** (أقرأ)، **তুই পড়িস**، **তুমি পড়ো**، **আপনি পড়েন**، **সে পড়ে**، **তিনি পড়েন**؛ والفاعل الجمع يأخذ الصيغ نفسها: **আমরা পড়ি**، **তারা পড়ে**. والفعل في آخر الجملة: **আমি বই পড়ি**.
  bn-ache:
    meaning: "يوجد، الملكية"
    intro: |
      **আছে** (يوجد؛ في مكان ما): **বইটা টেবিলে আছে** (الكتاب على الطاولة). والنفي **নেই**: **বাড়িতে কেউ নেই** (لا أحد في البيت). والملكية = الإضافة + **আছে**: **আমার একটা ভাই আছে** (لي أخ). والكون (الهوية) كثيرًا ما لا يُقال: **আমি ছাত্র** (أنا طالب).
  bn-ke:
    meaning: "حالة المفعول -কে: من، لمن"
    intro: |
      **-কে** تَسِم الشخص (أو الشيء المعرّف) مفعولًا أو مستقبِلًا: **আমি তোমাকে দেখি** (أراك)، **ছেলেটাকে বইটা দাও** (أعطِ الولد الكتاب). والضمائر: **আমাকে, তোমাকে, আপনাকে, তাকে, আমাদের**.
  bn-er:
    meaning: "الإضافة -এর / -র: لـ، لي"
    intro: |
      **-এর** بعد الصامت، و**-র** بعد الحركة (**বাড়ির**، **ছেলের**، **রিনার**): **রিনার বই** (كتاب رينا). والضمائر: **আমার** (لي)، **তোমার, আপনার, তার, আমাদের**. وكثير من الأدوات اللاحقة تأتي بعد الإضافة: **টেবিলের উপর** (على الطاولة)، **বাড়ির পাশে** (بجانب البيت).
  bn-loc:
    meaning: "حالة الظرفية -এ / -তে: في"
    intro: |
      **-এ** بعد الصامت (**শহরে** في المدينة)، و**-তে** أو **-য়** بعد الحركة (**বাড়িতে** في البيت، **ঢাকায়** في دكا). وتدلّ أيضًا على الوسيلة والزمن: **বাসে** (بالحافلة)، **সকালে** (صباحًا).
  bn-questions:
    meaning: "أدوات الاستفهام؛ কি لسؤال نعم/لا"
    intro: |
      **কী** (ماذا)، **কে** (من)، **কোথায়** (أين)، **কখন** (متى)، **কেন** (لماذا)، **কেমন** (كيف)، **কত** (كم). وأسئلة نعم/لا تضيف **কি** بعد الفاعل: **আপনি কি ইংরেজি বলেন?** **কেমন আছেন?** (كيف حالك؟).
  bn-na:
    meaning: "النفي بعد الفعل"
    intro: |
      **না** تأتي بعد الفعل: **আমি বুঝি না** (لا أفهم). والماضي يُنفى بالمضارع + **নি**: **আমি যাইনি** (لم أذهب). و**নেই** تعني *لا يوجد*.
  bn-past:
    meaning: "الماضي البسيط -ল-"
    intro: |
      الجذر + **-লাম** (أنا)، **-লি** (أنت، حميمية)، **-লে** (أنت)، **-লেন** (حضرتك، هو للاحترام)، **-ল** (هو، هي): **আমি বইটা পড়লাম** (قرأت الكتاب)، **সে এল** (جاء). والشاذ: **যাওয়া → গেলাম**، **দেওয়া → দিলাম**.
  bn-future:
    meaning: "المستقبل -ব-"
    intro: |
      الجذر + **-ব** (أنا)، **-বি** (أنت، حميمية)، **-বে** (أنت؛ هو)، **-বেন** (للاحترام): **আমি কাল যাব** (سأذهب غدًا)، **সে আসবে** (سيأتي).
  bn-continuous:
    meaning: "المضارع المستمر -ছ-"
    intro: |
      الجذر + **-ছি** (أنا)، **-ছিস**، **-ছ**، **-ছেন**، **-ছে**: **আমি একটা বই পড়ছি** (أقرأ كتابًا الآن)، **শিশুরা খেলছে** (الأطفال يلعبون)، **মা রান্না করছেন** (الأم تطبخ، للاحترام).
  bn-postpositions:
    meaning: "الأدوات اللاحقة بعد الإضافة"
    intro: |
      **টেবিলের উপর** (على الطاولة)، **খাটের নিচে** (تحت السرير)، **বন্ধুর সঙ্গে / সাথে** (مع صديق)، **তোমার জন্য** (لأجلك)، **বাড়ি থেকে** (من البيت)، **স্কুল পর্যন্ত** (حتى المدرسة). وأكثرها يطلب الإضافة؛ و**থেকে** تأتي بعد الصيغة البسيطة.
  bn-kora:
    meaning: "اسم + করা: أفعال كثيرة"
    intro: |
      تصنع البنغالية أفعالًا لا تُحصى باسم + **করা** (فعل): **কাজ করা** (عمل)، **রান্না করা** (طبخ)، **পছন্দ করা** (أحبّ)، **চেষ্টা করা** (حاول)، **ফোন করা** (اتّصل). و**করা** وحدها تُصرَّف: **আমি কাজ করি, সে রান্না করছে**.
  bn-je:
    meaning: "أنّ، إذا، لأنّ"
    intro: |
      **যে** (أنّ؛ الذي): **আমি জানি যে সে আসবে** (أعرف أنه سيأتي)؛ وأزواج الصلة **যে … সে**: **যে ছেলেটা ওখানে দাঁড়িয়ে আছে, সে আমার ভাই** (الولد الواقف هناك أخي). والشرط **যদি … তাহলে**: **যদি বৃষ্টি হয়, তাহলে আমরা বাড়িতে থাকব** (إن أمطرت بقينا في البيت). **কারণ** (لأنّ)، **কিন্তু** (لكن).
  bn-imperative:
    meaning: "الأمر بحسب درجة الاحترام"
    intro: |
      **পড়্** (حميمية)، **পড়ো** (أنت)، **পড়ুন** (حضرتك): **বসুন** (تفضّل بالجلوس)، **এসো** (تعال). والنهي بـ**না**: **যেও না** (لا تذهب). و**দয়া করে** (من فضلك) تلطّف الطلب.
  bn-sadhu:
    meaning: "اللغة الأدبية القديمة والمعيار المحكي"
    intro: |
      حتى القرن العشرين كُتب النثر البنغالي بـ**সাধু ভাষা** (اللغة «الأنيقة»: **করিতেছি, গিয়াছিল**)؛ والمعيار اليوم **চলিত ভাষা** المبنيّ على كلام كلكتا (**করছি, গিয়েছিল**). والكتب القديمة وبعض الصحف تحتفظ بالصيغ الطويلة.
  bn-abstract:
    meaning: "الكلمات المثقّفة"
    intro: |
      تستقي البنغالية المثقّفة من السنسكريتية (كلمات *تاتساما*): **-তা** (**স্বাধীনতা** حرّية، **সমতা** مساواة)، **-ত্ব** (**গুরুত্ব** أهمية)، **উন্নয়ন** (تنمية)، **শিক্ষা** (تعليم)، **বিজ্ঞান** (علم). والفارسية والإنجليزية تعطيان الكلمات اليومية (**আইন** قانون، **স্কুল** مدرسة).
  bn-tagore:
    meaning: "قراءة طاغور ونذر الإسلام"
    intro: |
      كتب رابندرانات طاغور (نوبل 1913، *جيتانجالي*) نشيدَي بنغلاديش (*Amar Sonar Bangla*) والهند؛ وقاضي نذر الإسلام، «الشاعر الثائر»، شاعر بنغلاديش الوطني. ويستعمل شعرهما صيغًا شعرية (**তোমায়** بدل *তোমাকে*، **প্রাণে** في الروح) والصيغ السادهو القديمة.
