# Macedonian text of the Bengali course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "Гласови и букви"
  Nouns and classifiers: "Именки и класификатори"
  Pronouns and the present: "Заменки и сегашно време"
  The cases: "Падежите"
  Questions and negation: "Прашања и негација"
  Past, future and continuous: "Минато, идно и трајно"
  Postpositions and compound verbs: "Постпозиции и сложени глаголи"
  Clauses and moods: "Реченици и начини"
  Register: "Регистар"
  Talking about ideas: "Разговор за идеи"
  Literature: "Литература"
lessons:
  bn-script:
    meaning: "бенгалското писмо"
    intro: |
      Бенгалскиот се пишува одлево надесно под горна линија, како сличното деванагари. Секоја согласка носи отворено *о*: **ক** *ко*; вокалните знаци го менуваат: **কা** *ка*, **কি** *ки*, **কু** *ку*, **কে** *ке*, **কো** *ко*. Самостојните самогласки ги почнуваат зборовите (**অ আ ই উ এ ও**). Лигатурите ги спојуваат согласките (**ক্ষ, ন্ত, স্ত**).
  bn-classifier:
    meaning: "нема род; класификаторите -টা / -টি"
    intro: |
      Бенгалскиот нема граматички род ни член. Членот е класификатор на именката: **বই** (книга, книги) → **বইটা / বইটি** (книгата; **-টি** е поформално или понежно). И со броеви: **একটা বই** (една книга), **দুটো বই** (две книги).
  bn-plural:
    meaning: "множина: -রা за луѓе, -গুলো за предмети"
    intro: |
      **-রা / -এরা** за луѓе (**ছেলেরা** момчињата, **মানুষেরা**), **-গুলো / -গুলি** за предмети и животни (**বইগুলো** книгите). По броеви и зборови како **অনেক** (многу) нема наставка за множина: **অনেক বই**.
  bn-pronouns:
    meaning: "лични заменки и три нивоа на ти/Вие"
    intro: |
      **আমি** (јас), **তুই** (ти, блиско), **তুমি** (ти), **আপনি** (Вие), **সে / তিনি** (тој или таа; **তিনি** учтиво), **আমরা** (ние), **তোমরা / আপনারা** (вие), **তারা / তাঁরা** (тие). Глаголот го следи нивото на учтивост, не бројот.
  bn-present:
    meaning: "просто сегашно по лице"
    intro: |
      **আমি পড়ি** (читам), **তুই পড়িস**, **তুমি পড়ো**, **আপনি পড়েন**, **সে পড়ে**, **তিনি পড়েন**; подметите во множина ги земаат истите форми: **আমরা পড়ি**, **তারা পড়ে**. Глаголот е на крајот: **আমি বই পড়ি**.
  bn-ache:
    meaning: "има, имам"
    intro: |
      **আছে** (има; се наоѓа): **বইটা টেবিলে আছে** (книгата е на масата). Одречно **নেই**: **বাড়িতে কেউ নেই** (никој не е дома). *Имам* е генитив + **আছে**: **আমার একটা ভাই আছে** (имам брат). *Сум* (идентитет) често не се кажува: **আমি ছাত্র** (студент сум).
  bn-ke:
    meaning: "објективот -কে: кого, кому"
    intro: |
      **-কে** означува лице (или определена работа) како објект или примач: **আমি তোমাকে দেখি** (те гледам), **ছেলেটাকে বইটা দাও** (дај му ја книгата на момчето). Заменки: **আমাকে, তোমাকে, আপনাকে, তাকে, আমাদের**.
  bn-er:
    meaning: "генитив -এর / -র: на, мој"
    intro: |
      **-এর** по согласка, **-র** по самогласка (**বাড়ির**, **ছেলের**, **রিনার**): **রিনার বই** (книгата на Рина). Заменки: **আমার** (мој), **তোমার, আপনার, তার, আমাদের**. Многу постпозиции доаѓаат по генитив: **টেবিলের উপর** (на масата), **বাড়ির পাশে** (покрај куќата).
  bn-loc:
    meaning: "локатив -এ / -তে: во, на"
    intro: |
      **-এ** по согласка (**শহরে** во градот), **-তে** или **-য়** по самогласка (**বাড়িতে** дома, **ঢাকায়** во Дака). Кажува и *со* (средство) и *кога*: **বাসে** (со автобус), **সকালে** (наутро).
  bn-questions:
    meaning: "прашални зборови; কি за да/не"
    intro: |
      **কী** (што), **কে** (кој), **কোথায়** (каде), **কখন** (кога), **কেন** (зошто), **কেমন** (како), **কত** (колку). Прашањата да/не додаваат **কি** по подметот: **আপনি কি ইংরেজি বলেন?** **কেমন আছেন?** (како сте?).
  bn-na:
    meaning: "негација по глаголот"
    intro: |
      **না** доаѓа по глаголот: **আমি বুঝি না** (не разбирам). Минатото се негира со сегашното + **নি**: **আমি যাইনি** (не отидов). **নেই** значи *нема*.
  bn-past:
    meaning: "просто минато -ল-"
    intro: |
      Основа + **-লাম** (јас), **-লি** (ти, блиско), **-লে** (ти), **-লেন** (Вие, тој учтиво), **-ল** (тој, таа): **আমি বইটা পড়লাম** (ја прочитав книгата), **সে এল** (дојде). Неправилни: **যাওয়া → গেলাম**, **দেওয়া → দিলাম**.
  bn-future:
    meaning: "идно време -ব-"
    intro: |
      Основа + **-ব** (јас), **-বি** (ти, блиско), **-বে** (ти; тој), **-বেন** (учтиво): **আমি কাল যাব** (утре ќе одам), **সে আসবে** (ќе дојде).
  bn-continuous:
    meaning: "трајно сегашно -ছ-"
    intro: |
      Основа + **-ছি** (јас), **-ছিস**, **-ছ**, **-ছেন**, **-ছে**: **আমি একটা বই পড়ছি** (читам книга сега), **শিশুরা খেলছে** (децата си играат), **মা রান্না করছেন** (мајката готви, учтиво).
  bn-postpositions:
    meaning: "постпозиции по генитивот"
    intro: |
      **টেবিলের উপর** (на масата), **খাটের নিচে** (под креветот), **বন্ধুর সঙ্গে / সাথে** (со пријател), **তোমার জন্য** (за тебе), **বাড়ি থেকে** (од дома), **স্কুল পর্যন্ত** (до училиштето). Повеќето бараат генитив; **থেকে** доаѓа по простата форма.
  bn-kora:
    meaning: "именка + করা: многу глаголи"
    intro: |
      Бенгалскиот прави безброј глаголи со именка + **করা** (прави): **কাজ করা** (работи), **রান্না করা** (готви), **পছন্দ করা** (сака), **চেষ্টা করা** (се обидува), **ফোন করা** (телефонира). Само **করা** се менува: **আমি কাজ করি, সে রান্না করছে**.
  bn-je:
    meaning: "дека, ако, зашто"
    intro: |
      **যে** (дека; кој): **আমি জানি যে সে আসবে** (знам дека ќе дојде); релативни парови **যে … সে**: **যে ছেলেটা ওখানে দাঁড়িয়ে আছে, সে আমার ভাই** (момчето што стои таму е брат ми). Услови **যদি … তাহলে**: **যদি বৃষ্টি হয়, তাহলে আমরা বাড়িতে থাকব** (ако врне, ќе останеме дома). **কারণ** (зашто), **কিন্তু** (но).
  bn-imperative:
    meaning: "императив по учтивост"
    intro: |
      **পড়্** (блиско), **পড়ো** (ти), **পড়ুন** (Вие): **বসুন** (седнете, ве молам), **এসো** (дојди). Одречно со **না**: **যেও না** (не оди). **দয়া করে** (ве молам) го омекнува барањето.
  bn-sadhu:
    meaning: "старата книжевна и разговорната норма"
    intro: |
      До 20 век бенгалската проза се пишувала на **সাধু ভাষা** („отмениот“ јазик: **করিতেছি, গিয়াছিল**); денешната норма е **চলিত ভাষা**, според говорот на Калкута (**করছি, গিয়েছিল**). Старите книги и некои весници ги задржуваат долгите форми.
  bn-abstract:
    meaning: "учени зборови"
    intro: |
      Учениот бенгалски црпи од санскрит (зборови *татсама*): **-তা** (**স্বাধীনতা** слобода, **সমতা** еднаквост), **-ত্ব** (**গুরুত্ব** важност), **উন্নয়ন** (развој), **শিক্ষা** (образование), **বিজ্ঞান** (наука). Персискиот и англискиот ги даваат секојдневните (**আইন** закон, **স্কুল** училиште).
  bn-tagore:
    meaning: "читање на Тагоре и Назрул"
    intro: |
      Рабиндранат Тагоре (Нобелова награда 1913, *Гитанџали*) ги напишал химните на Бангладеш (*Amar Sonar Bangla*) и Индија; Кази Назрул Ислам, „поетот бунтовник“, е националниот поет на Бангладеш. Нивната поезија користи поетски форми (**তোমায়** наместо *তোমাকে*, **প্রাণে** во душата) и постарите садху форми.
