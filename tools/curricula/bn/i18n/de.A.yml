# German text of the Bengali course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "Laute und Buchstaben"
  Nouns and classifiers: "Nomen und Klassifikatoren"
  Pronouns and the present: "Pronomen und das Präsens"
  The cases: "Die Fälle"
  Questions and negation: "Fragen und Verneinung"
  Past, future and continuous: "Vergangenheit, Futur und Verlaufsform"
  Postpositions and compound verbs: "Postpositionen und zusammengesetzte Verben"
  Clauses and moods: "Nebensätze und Modi"
  Register: "Register"
  Talking about ideas: "Über Ideen sprechen"
  Literature: "Literatur"
lessons:
  bn-script:
    meaning: "die bengalische Schrift"
    intro: |
      Bengalisch wird von links nach rechts unter einer Kopflinie geschrieben, wie das ähnliche Devanagari. Jeder Konsonant trägt ein offenes *o*: **ক** *ko*; Vokalzeichen ändern es: **কা** *ka*, **কি** *ki*, **কু** *ku*, **কে** *ke*, **কো** *ko*. Selbstständige Vokale stehen am Wortanfang (**অ আ ই উ এ ও**). Ligaturen verbinden Konsonanten (**ক্ষ, ন্ত, স্ত**).
  bn-classifier:
    meaning: "kein Genus; die Klassifikatoren -টা / -টি"
    intro: |
      Bengalisch hat weder Genus noch Artikel. *Der, die, das* ist ein Klassifikator am Nomen: **বই** (ein Buch, Bücher) → **বইটা / বইটি** (das Buch; **-টি** förmlicher oder zärtlicher). Auch bei Zahlen: **একটা বই** (ein Buch), **দুটো বই** (zwei Bücher).
  bn-plural:
    meaning: "Plurale: -রা für Personen, -গুলো für Dinge"
    intro: |
      **-রা / -এরা** für Personen (**ছেলেরা** die Jungen, **মানুষেরা**), **-গুলো / -গুলি** für Dinge und Tiere (**বইগুলো** die Bücher). Nach Zahlen und Wörtern wie **অনেক** (viele) keine Pluralendung: **অনেক বই**.
  bn-pronouns:
    meaning: "Personalpronomen und drei Stufen von du/Sie"
    intro: |
      **আমি** (ich), **তুই** (du, vertraut), **তুমি** (du), **আপনি** (Sie), **সে / তিনি** (er oder sie; **তিনি** höflich), **আমরা** (wir), **তোমরা / আপনারা** (ihr), **তারা / তাঁরা** (sie). Das Verb richtet sich nach der Höflichkeitsstufe, nicht nach dem Numerus.
  bn-present:
    meaning: "das einfache Präsens nach Person"
    intro: |
      **আমি পড়ি** (ich lese), **তুই পড়িস**, **তুমি পড়ো**, **আপনি পড়েন**, **সে পড়ে**, **তিনি পড়েন**; Subjekte im Plural nehmen dieselben Formen: **আমরা পড়ি**, **তারা পড়ে**. Das Verb steht am Ende: **আমি বই পড়ি**.
  bn-ache:
    meaning: "es gibt, haben"
    intro: |
      **আছে** (es gibt; ist irgendwo): **বইটা টেবিলে আছে** (das Buch liegt auf dem Tisch). Verneint **নেই**: **বাড়িতে কেউ নেই** (niemand ist zu Hause). *Haben* ist Genitiv + **আছে**: **আমার একটা ভাই আছে** (ich habe einen Bruder). *Sein* (Identität) bleibt oft ungesagt: **আমি ছাত্র** (ich bin Student).
  bn-ke:
    meaning: "der Objektiv -কে: wen, wem"
    intro: |
      **-কে** bezeichnet eine Person (oder bestimmte Sache) als Objekt oder Empfänger: **আমি তোমাকে দেখি** (ich sehe dich), **ছেলেটাকে বইটা দাও** (gib dem Jungen das Buch). Pronomen: **আমাকে, তোমাকে, আপনাকে, তাকে, আমাদের**.
  bn-er:
    meaning: "der Genitiv -এর / -র: von, mein"
    intro: |
      **-এর** nach Konsonant, **-র** nach Vokal (**বাড়ির**, **ছেলের**, **রিনার**): **রিনার বই** (Rinas Buch). Pronomen: **আমার** (mein), **তোমার, আপনার, তার, আমাদের**. Viele Postpositionen folgen einem Genitiv: **টেবিলের উপর** (auf dem Tisch), **বাড়ির পাশে** (neben dem Haus).
  bn-loc:
    meaning: "der Lokativ -এ / -তে: in, an"
    intro: |
      **-এ** nach Konsonant (**শহরে** in der Stadt), **-তে** oder **-য়** nach Vokal (**বাড়িতে** zu Hause, **ঢাকায়** in Dhaka). Er sagt auch *mit* (Mittel) und *wann*: **বাসে** (mit dem Bus), **সকালে** (am Morgen).
  bn-questions:
    meaning: "Fragewörter; কি für Ja/Nein"
    intro: |
      **কী** (was), **কে** (wer), **কোথায়** (wo), **কখন** (wann), **কেন** (warum), **কেমন** (wie), **কত** (wie viel). Ja/Nein-Fragen fügen **কি** nach dem Subjekt ein: **আপনি কি ইংরেজি বলেন?** **কেমন আছেন?** (wie geht es Ihnen?).
  bn-na:
    meaning: "Verneinung nach dem Verb"
    intro: |
      **না** folgt dem Verb: **আমি বুঝি না** (ich verstehe nicht). Die Vergangenheit wird mit dem Präsens + **নি** verneint: **আমি যাইনি** (ich bin nicht gegangen). **নেই** heißt *es gibt nicht*.
  bn-past:
    meaning: "die einfache Vergangenheit -ল-"
    intro: |
      Stamm + **-লাম** (ich), **-লি** (du, vertraut), **-লে** (du), **-লেন** (Sie, er höflich), **-ল** (er, sie): **আমি বইটা পড়লাম** (ich las das Buch), **সে এল** (er kam). Unregelmäßig: **যাওয়া → গেলাম**, **দেওয়া → দিলাম**.
  bn-future:
    meaning: "das Futur -ব-"
    intro: |
      Stamm + **-ব** (ich), **-বি** (du, vertraut), **-বে** (du; er), **-বেন** (höflich): **আমি কাল যাব** (ich gehe morgen), **সে আসবে** (er wird kommen).
  bn-continuous:
    meaning: "die Verlaufsform des Präsens -ছ-"
    intro: |
      Stamm + **-ছি** (ich), **-ছিস**, **-ছ**, **-ছেন**, **-ছে**: **আমি একটা বই পড়ছি** (ich lese gerade ein Buch), **শিশুরা খেলছে** (die Kinder spielen), **মা রান্না করছেন** (die Mutter kocht, höflich).
  bn-postpositions:
    meaning: "Postpositionen nach dem Genitiv"
    intro: |
      **টেবিলের উপর** (auf dem Tisch), **খাটের নিচে** (unter dem Bett), **বন্ধুর সঙ্গে / সাথে** (mit einem Freund), **তোমার জন্য** (für dich), **বাড়ি থেকে** (von zu Hause), **স্কুল পর্যন্ত** (bis zur Schule). Die meisten verlangen den Genitiv; **থেকে** folgt der einfachen Form.
  bn-kora:
    meaning: "Nomen + করা: viele Verben"
    intro: |
      Bengalisch bildet unzählige Verben mit einem Nomen + **করা** (tun): **কাজ করা** (arbeiten), **রান্না করা** (kochen), **পছন্দ করা** (mögen), **চেষ্টা করা** (versuchen), **ফোন করা** (anrufen). Nur **করা** wird konjugiert: **আমি কাজ করি, সে রান্না করছে**.
  bn-je:
    meaning: "dass, wenn, weil"
    intro: |
      **যে** (dass; wer): **আমি জানি যে সে আসবে** (ich weiß, dass er kommt); Relativpaare **যে … সে**: **যে ছেলেটা ওখানে দাঁড়িয়ে আছে, সে আমার ভাই** (der Junge, der dort steht, ist mein Bruder). Bedingungen **যদি … তাহলে**: **যদি বৃষ্টি হয়, তাহলে আমরা বাড়িতে থাকব** (wenn es regnet, bleiben wir zu Hause). **কারণ** (weil), **কিন্তু** (aber).
  bn-imperative:
    meaning: "der Imperativ nach Höflichkeit"
    intro: |
      **পড়্** (vertraut), **পড়ো** (du), **পড়ুন** (Sie): **বসুন** (setzen Sie sich bitte), **এসো** (komm). Verneint mit **না**: **যেও না** (geh nicht). **দয়া করে** (bitte) mildert eine Bitte.
  bn-sadhu:
    meaning: "die alte Literatursprache und der umgangssprachliche Standard"
    intro: |
      Bis ins 20. Jahrhundert wurde bengalische Prosa in **সাধু ভাষা** geschrieben (der „feinen“ Sprache: **করিতেছি, গিয়াছিল**); der heutige Standard ist **চলিত ভাষা**, nach der Rede Kolkatas (**করছি, গিয়েছিল**). Alte Bücher und manche Zeitungen behalten die langen Formen.
  bn-abstract:
    meaning: "gelehrte Wörter"
    intro: |
      Gelehrtes Bengalisch schöpft aus dem Sanskrit (*Tatsama*-Wörter): **-তা** (**স্বাধীনতা** Freiheit, **সমতা** Gleichheit), **-ত্ব** (**গুরুত্ব** Bedeutung), **উন্নয়ন** (Entwicklung), **শিক্ষা** (Bildung), **বিজ্ঞান** (Wissenschaft). Persisch und Englisch liefern die alltäglichen (**আইন** Gesetz, **স্কুল** Schule).
  bn-tagore:
    meaning: "Tagore und Nazrul lesen"
    intro: |
      Rabindranath Tagore (Nobelpreis 1913, *Gitanjali*) schrieb die Hymnen von Bangladesch (*Amar Sonar Bangla*) und Indien; Kazi Nazrul Islam, der „Rebellendichter“, ist Bangladeschs Nationaldichter. Ihre Dichtung gebraucht poetische Formen (**তোমায়** für *তোমাকে*, **প্রাণে** in der Seele) und die älteren Sadhu-Formen.
