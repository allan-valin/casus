id: C2
topics:

- title: {en: Literature, pt: Literatura}
  lessons:
  - id: bn-tagore
    title: রবীন্দ্রনাথ, নজরুল
    meaning: {en: "reading Tagore and Nazrul", pt: "lendo Tagore e Nazrul"}
    intro:
      en: |
        Rabindranath Tagore (Nobel 1913, *Gitanjali*) wrote the anthems of both Bangladesh (*Amar Sonar Bangla*) and India; Kazi Nazrul Islam, the "rebel poet", is Bangladesh's national poet. Their poetry uses forms of verse (**তোমায়** for *তোমাকে*, **প্রাণে** in the soul) and the older sadhu forms.
      pt: |
        Rabindranath Tagore (Nobel de 1913, *Gitanjali*) escreveu os hinos de Bangladesh (*Amar Sonar Bangla*) e da Índia; Kazi Nazrul Islam, o "poeta rebelde", é o poeta nacional de Bangladesh. Sua poesia usa formas poéticas (**তোমায়** por *তোমাকে*, **প্রাণে** na alma) e as formas sadhu antigas.
    examples:
    - ["আমার সোনার বাংলা, আমি তোমায় ভালোবাসি।", "My golden Bengal, I love you.", "Minha Bengala dourada, eu te amo.", "ভালোবাসি"]
    match: {seq: [{word: [তোমায়, ভালোবাসি, সোনার, বাংলা, প্রাণে]}]}
    pool: [তোমায়, ভালোবাসি, বাংলা]
