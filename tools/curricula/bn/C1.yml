id: C1
topics:

- title: {en: Talking about ideas, pt: Falando de ideias}
  lessons:
  - id: bn-abstract
    title: স্বাধীনতা, সমতা, উন্নয়ন
    meaning: {en: "learned words", pt: "palavras eruditas"}
    intro:
      en: |
        Learned Bengali draws on Sanskrit (*tatsama* words): **-তা** (**স্বাধীনতা** freedom, **সমতা** equality), **-ত্ব** (**গুরুত্ব** importance), **উন্নয়ন** (development), **শিক্ষা** (education), **বিজ্ঞান** (science). Persian and English give the everyday ones (**আইন** law, **স্কুল**).
      pt: |
        O bengali culto bebe no sânscrito (palavras *tatsama*): **-তা** (**স্বাধীনতা** liberdade, **সমতা** igualdade), **-ত্ব** (**গুরুত্ব** importância), **উন্নয়ন** (desenvolvimento), **শিক্ষা** (educação), **বিজ্ঞান** (ciência). O persa e o inglês dão as do dia a dia (**আইন** lei, **স্কুল** escola).
    examples:
    - ["স্বাধীনতা আমাদের অধিকার।", "Freedom is our right.", "A liberdade é nosso direito.", "স্বাধীনতা"]
    match: {seq: [{pos: noun, re: "(তা|ত্ব|ন)$"}]}
