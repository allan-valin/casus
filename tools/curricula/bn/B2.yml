id: B2
topics:

- title: {en: Register, pt: Registro}
  lessons:
  - id: bn-sadhu
    title: সাধু ভাষা, চলিত ভাষা
    meaning: {en: "the old literary and the colloquial standard", pt: "a língua literária antiga e o padrão coloquial"}
    intro:
      en: |
        Until the 20th century Bengali prose was written in **সাধু ভাষা** (the "elegant" language: **করিতেছি, গিয়াছিল**); today's standard is **চলিত ভাষা**, based on the speech of Kolkata (**করছি, গিয়েছিল**). Old books and some newspapers keep the long forms.
      pt: |
        Até o século XX a prosa bengali se escrevia em **সাধু ভাষা** (a língua "elegante": **করিতেছি, গিয়াছিল**); o padrão de hoje é a **চলিত ভাষা**, baseada na fala de Calcutá (**করছি, গিয়েছিল**). Livros antigos e alguns jornais mantêm as formas longas.
    examples:
    - ["তিনি বাড়িতে গিয়েছিলেন।", "He had gone home.", "Ele tinha ido para casa.", "গিয়েছিলেন"]
    match: {seq: [{re: "(িতেছ|িয়াছ|ইয়া)"}]}
