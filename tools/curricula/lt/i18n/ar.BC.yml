# Arabic text of the Lithuanian course, B1–C2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Moods: "الصيغ"
  Participles: "أسماء الفاعل والمفعول"
  Clauses: "الجمل"
  Definite adjectives: "الصفات المعرّفة"
  Aspect and prefixes: "الجهة والسوابق"
  Reported speech: "الكلام المنقول"
  Numbers and words: "الأعداد والكلمات"
  Writing and register: "الكتابة ومستوى اللغة"
  Rarer verb forms: "صيغ فعلية أندر"
  Impersonal and passive: "المبني للمجهول وغير الشخصي"
  Talking about ideas: "الحديث عن الأفكار"
  Style and variety: "الأسلوب والتنوّع"
lessons:
  lt-conditional:
    meaning: "الشرطي: لَـ…"
    intro: |
      جذر المصدر + **-čiau, -tum, -tų, -tume, -tumėte**: **norėti → norėčiau** (أودّ)، **dirbtum, būtų**. للطلبات المهذّبة (**Norėčiau kavos** أودّ قهوة)، والأماني والشروط غير الواقعة: **Jei turėčiau laiko, ateičiau** (لو كان عندي وقت لأتيت).
  lt-imperative:
    meaning: "الأمر"
    intro: |
      جذر المصدر + **-k** (أنت)، **-kime** (هيّا بنا)، **-kite** (أنتم، وللاحترام): **dirbti → dirbk, dirbkime, dirbkite**؛ **eiti → eik**؛ **bėgti → bėk** (g + k = k). وللغائب **tegul / tegu** + المضارع: **Tegul jis ateina** (ليأتِ). وبلطف أكثر: **Prašom atsisėsti** (تفضّل بالجلوس).
  lt-participle-active:
    meaning: "اسم الفاعل: الذي يقرأ، الذي قرأ"
    intro: |
      تستعمل الليتوانية اسم الفاعل أكثر بكثير من العربية. المضارع **-ąs / -antis، -ąs / -iantis** (**skaitantis vaikas** طفل يقرأ)، والماضي **-ęs / -usi** (**perskaitęs** وقد قرأ؛ المؤنّث **perskaičiusi**)، والمستقبل **-siantis**. تُصرَّف كالصفات: **skaitančio vaiko, su skaitančiu vaiku**. وتُستعمل أيضًا لنقل ما سمعه المرء (B2).
  lt-participle-passive:
    meaning: "اسم المفعول: الذي يُقرأ، المقروء"
    intro: |
      المضارع **-mas / -ma** (**skaitomas** الذي يُقرأ)، والماضي **-tas / -ta** (**parašytas** مكتوب): **Knyga parašyta lietuviškai** (الكتاب مكتوب بالليتوانية). ومع **būti** تكوّن المبني للمجهول: **Namas buvo pastatytas 1900 metais** (بُني البيت سنة 1900). والفاعل الحقيقي في حالة الإضافة: **Jono parašytas laiškas** (رسالة كتبها يوناس).
  lt-gerund:
    meaning: "في أثناء الفعل: شبه اسم الفاعل والحال"
    intro: |
      **-damas / -dama** (*pusdalyvis*) = في أثناء فعل شيء، والفاعل واحد: **Grįždamas namo sutikau draugą** (وأنا عائد إلى البيت لقيت صديقًا). **-ant / -us** (*padalyvis*) = في أثناء فعل *شخص آخر*، وكثيرًا مع حالة القابل: **Saulei tekant išėjome** (عند شروق الشمس انطلقنا).
  lt-relative:
    meaning: "الذي، التي: جمل الصلة"
    intro: |
      **kuris / kuri / kurie / kurios** يأخذ الجنس والعدد من الاسم، والحالة من جملته: **Žmogus, kuris čia gyvena, yra gydytojas** (الرجل الذي يسكن هنا طبيب). **Knyga, kurią skaitau, įdomi.** و**kas** بعد *viskas, tas*: **Tai, ką sakai, tiesa** (ما تقوله صحيح). وتفتتح الفاصلة الجملة دائمًا.
  lt-conjunctions:
    meaning: "ربط الجمل"
    intro: |
      **kad** (أنّ؛ لكي)، **nes** (لأنّ)، **kai** (عندما)، **jei / jeigu** (إذا)، **nors** (مع أنّ)، **todėl** (لذلك)، **o** (و، بينما)، **bet** (لكن)، **ar** (هل — في السؤال غير المباشر). **Nežinau, ar jis ateis** (لا أعرف هل سيأتي). **Einu namo, nes pavargau** (أذهب إلى البيت لأنني تعبت).
  lt-definite:
    meaning: "الصفات الضميرية (المعرّفة): الجيّد"
    intro: |
      لا أداة تعريف في الليتوانية، لكن الصفة يمكن أن تصير *معرّفة* بإلحاق ضمير بها: **geras → gerasis** (الجيّد)، **gera → geroji**، **didelis → didysis**. تُسمّي الأنواع والألقاب: **baltasis gandras** (اللقلق الأبيض)، **Vytautas Didysis** (الكبير)، وتعني *الذي*: **Imk raudonąjį** (خذ الأحمر).
  lt-prefixes:
    meaning: "السوابق: الأفعال التامّة والاتجاهات"
    intro: |
      السابقة تجعل الفعل تامًّا في الغالب: **rašiau laišką** (كنت أكتب رسالة) مقابل **parašiau laišką** (كتبتها وانتهيت). وسوابق الحركة تحدّد الاتجاه: **at-** (نحو: **ateiti** جاء)، **iš-** (إلى الخارج: **išeiti** خرج)، **į-** (إلى الداخل: **įeiti** دخل)، **nu-** (بعيدًا، إلى أسفل: **nueiti**)، **per-** (عبر، مرة أخرى: **pereiti, perskaityti**)، **pri-** (إلى قرب: **prieiti**)، **su-** (معًا: **sueiti**).
  lt-reported:
    meaning: "صيغة النقل: ما يقوله الآخرون"
    intro: |
      بدل الفعل المتصرّف يدلّ اسم الفاعل على أنك سمعت الخبر فقط (*netiesioginė nuosaka*): **Jis esąs ligonis** (يُقال إنه مريض)، **Kaimynas išvažiavęs** (يبدو أن الجار سافر). وهكذا تُروى الحكايات: **Gyveno kartą senelis** → **Gyvenęs kartą senelis** (كان يا ما كان شيخ). والأخبار غير الشخصية تستعمل المبني للمجهول المحايد: **Sakoma, kad…** (يُقال إنّ…).
  lt-collective:
    meaning: "الأعداد مع الأسماء الملازمة للجمع"
    intro: |
      الأسماء التي لا توجد إلا جمعًا (**marškiniai** قميص، **durys** باب، **metai** سنة، **vestuvės** عرس) تُعدّ بـ**vieneri, dveji, treji, ketveri…**: **dveji marškiniai** (قميصان)، **treji metai** (ثلاث سنوات). وتُصرَّف: **Turiu dvejus marškinius** (عندي قميصان).
  lt-diminutives:
    meaning: "صيغ التصغير"
    intro: |
      شائعة جدًا وفيها مودّة: **-elis / -ėlis** (**namelis** بُيَيت، **paukštelis** عُصفور صغير)، **-ukas / -iukas** (**broliukas, šuniukas** جرو)، **-utis / -ytis** (**sūnutis**)، **-aitė / -ytė / -utė** (**mergaitė** بنت، **sesutė** أُخيّة). وكثير منها فقد معنى الصِّغَر: **mergaitė** تعني *بنتًا* فقط.
  lt-formal:
    meaning: "اللغة المهذّبة والرسمية"
    intro: |
      **Jūs** (بحرف كبير في الرسائل) لشخص واحد لا تعرفه جيدًا، والفعل في الجمع: **Ar Jūs kalbate angliškai?** (هل تتكلّم الإنجليزية يا سيدي؟). والمخاطبة: **Gerbiamas pone / Gerbiamoji ponia** (حضرة السيد / حضرة السيدة)، **ponas Jonaitis, ponia Jonaitienė.** **Prašom** (من فضلك؛ تفضّل)، **Atsiprašau** (عذرًا)، **Ačiū, labai ačiū** (شكرًا، شكرًا جزيلًا).
  lt-budinys:
    meaning: "الـbūdinys: الفعل بشدّة"
    intro: |
      **-te** (*būdinys*) مع الفعل نفسه يقوّيه، كالمفعول المطلق في العربية: **bėgte bėgo** (ركض ركضًا)، **tylute tylėjo** (سكت سكوتًا تامًّا). يكثر في الحكايات الشعبية والكلام الحيّ، ولا تتغيّر صيغته.
  lt-necessity:
    meaning: "-tinas: ما يجب فعله"
    intro: |
      **-tinas / -tina** = *ما ينبغي أن يُفعل*: **skaitytina knyga** (كتاب تجب قراءته)، **Tai darytina iš karto** (يجب فعل ذلك فورًا). وفي الكلام الشائع **reikia** + المصدر: **Reikia skaityti** (يجب أن نقرأ).
  lt-impersonal:
    meaning: "المجهول المحايد: كان يُتحدَّث"
    intro: |
      اسم المفعول المحايد بلا فاعل يقول إن *الناس* يفعلون شيئًا: **Čia nerūkoma** (ممنوع التدخين هنا)، **Apie tai buvo daug kalbama** (كثر الكلام عن ذلك)، **Vakare buvo šokama** (كان هناك رقص في المساء). ومع فاعل في حالة الإضافة يمكنه أن ينقل خبرًا: **Čia būta vilko** (يبدو أن ذئبًا مرّ من هنا).
  lt-abstract:
    meaning: "الأسماء المجرّدة"
    intro: |
      من الأفعال **-imas** (**skaitymas** القراءة، **mokymasis** التعلّم)، ومن الصفات **-umas** (**gerumas** الطيبة، **gražumas** الجمال)، و**-ybė** (**lygybė** المساواة)، و**-ystė** (**draugystė** الصداقة، **vaikystė** الطفولة). هي كلمات العلم والجدل: **Lygybė prieš įstatymą** (المساواة أمام القانون).
  lt-c2-short-loc:
    meaning: "الصيغ المختصرة في الشعر والكلام"
    intro: |
      الشعر والكلام يختصران النهايات: الظرفية في الجمع **-uose → -uos** (**kapuos** في القبور، **namuos** في البيت)، **-ose → -os**؛ والمصدر **-ti → -t** (**dirbt**)؛ والمتكلّم والمخاطَب في الجمع **-ame → -am, -ate → -at** (**dirbam, dirbat**)؛ والانعكاسي **-asi → -as** (**mokos** بدل *mokosi*). مايرونيس: *Šalis, kur miega kapuos didvyriai* (البلاد التي ينام الأبطال في قبورها).
  lt-c2-dialects:
    meaning: "مجموعتا اللهجات"
    intro: |
      **Aukštaičiai** (أهل المرتفعات، الشرق والجنوب) و**žemaičiai** (الساموجيتيون، الشمال الغربي) يختلفون في الأصوات والنبر والمفردات؛ والساموجيتية مختلفة إلى حدّ أن لها تقليدًا كتابيًا خاصًا (**Labas rītos!** بدل *Labas rytas*). وتقوم اللغة الفصحى على لهجة المرتفعات الغربية في منطقة كاوناس. والقارئ لا يعرف إلا الفصحى.
  lt-c2-literary:
    meaning: "قراءة الأدب الكلاسيكي"
    intro: |
      *Metai* (*الفصول*، ستينيات القرن الثامن عشر، طُبعت 1818) لكريستيوناس دونيلايتيس هي أول قصيدة ليتوانية كبرى، بلهجة ليتوانيا الصغرى وبإملاء قديم (**w** بدل *v*، **sz** بدل *š*). ومايرونيس (*Pavasario balsai*، 1895) صاغ اللغة الشعرية الحديثة؛ ونثر يوناس بيليوناس القصير (العقد الأول من القرن العشرين) يُقرأ تقريبًا كنثر اليوم. وقد يترك القارئ الإملاءات والصيغ القديمة دون تحليل.
