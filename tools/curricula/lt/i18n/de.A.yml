# German text of the Lithuanian course, A1–A2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "Laute und Buchstaben"
  Nouns and gender: "Nomen und Genus"
  Pronouns and the present: "Pronomen und das Präsens"
  Questions and negation: "Fragen und Verneinung"
  The cases (1): "Die Fälle (1)"
  Numbers and time: "Zahlen und Zeit"
  The cases (2): "Die Fälle (2)"
  Past and future: "Vergangenheit und Zukunft"
  Adjectives and comparison: "Adjektive und Steigerung"
  Prepositions and reflexive verbs: "Präpositionen und reflexive Verben"
lessons:
  lt-alphabet:
    meaning: "die litauischen Buchstaben"
    intro: |
      Die „Nasal“-Buchstaben **ą ę į ų** sind heute einfach langes **a e i u** (**ąžuolas** Eiche). **ė** ist ein langes geschlossenes *e*, **y** = langes *i*, **ū** = langes *u*. **č š ž** sind *tsch, sch, sch* (stimmhaft wie in *Journal*); **c** ist *z*; **j** ist *j*. Die Betonung ist frei und wandert innerhalb der Formen eines Wortes; Wörterbücher markieren sie (**nãmas**, **namaĩ**), normale Texte nicht — und der Leser auch nicht.
  lt-gender:
    meaning: "zwei Genera, an der Endung erkennbar"
    intro: |
      Litauische Nomen sind maskulin oder feminin (das Neutrum lebt nur in einigen Adjektiven und Pronomen fort). Maskulin: **-as, -is, -ys, -us** (**namas** Haus, **brolis** Bruder, **arklys** Pferd, **sūnus** Sohn); feminin: **-a, -ė** (**knyga** Buch, **upė** Fluss) und einige auf **-is** (**naktis** Nacht). Keine Artikel: **namas** ist *ein Haus* oder *das Haus*.
  lt-plural:
    meaning: "der Nominativ Plural"
    intro: |
      **-as → -ai** (**namai**), **-is, -ys → -iai** (**broliai, arkliai**), **-us → -ūs** (**sūnūs**), **-a → -os** (**knygos**), **-ė → -ės** (**upės**), feminin **-is → -ys** (**naktys**). Manche Nomen gibt es nur im Plural: **marškiniai** (Hemd), **durys** (Tür).
  lt-pronouns:
    meaning: "Personalpronomen"
    intro: |
      **aš** (ich), **tu** (du), **jis / ji** (er / sie), **mes** (wir), **jūs** (ihr, und das höfliche *Sie*), **jie / jos** (sie, maskulin / feminin). Das Verb zeigt die Person, darum fällt das Pronomen oft weg: **Dirbu** = ich arbeite.
  lt-present:
    meaning: "das Präsens: drei Konjugationen"
    intro: |
      Lernen Sie jedes Verb mit drei Formen: Infinitiv, 3. Person Präsens, 3. Person Präteritum (**dirbti – dirba – dirbo**). Die 3. Person zeigt die Konjugation. **-a:** dirbu, dirbi, dirba, dirbame, dirbate. **-i:** myliu, myli, myli, mylime, mylite. **-o:** skaitau, skaitai, skaito, skaitome, skaitote. Die 3. Person ist im Singular und Plural gleich: **jis dirba, jie dirba**.
  lt-buti:
    meaning: "būti, sein"
    intro: |
      **esu, esi, yra, esame, esate, yra**. Anders als im Russischen wird das Verb gebraucht: **Aš esu mokytojas** (ich bin Lehrer). **yra** heißt auch *es gibt*: **Čia yra parduotuvė.** Verneint: **nesu, nesi, nėra** — und *es gibt kein* verlangt den Genitiv: **Čia nėra parduotuvės.**
  lt-tureti:
    meaning: "haben"
    intro: |
      **turėti** (haben): **turiu, turi, turi, turime, turite**. **Turiu brolį** (Akkusativ). Bei Verneinung steht das Objekt im Genitiv: **Neturiu brolio. Neturiu laiko** (ich habe keine Zeit).
  lt-questions:
    meaning: "Fragewörter; ar"
    intro: |
      Ja/Nein-Fragen beginnen mit **ar**: **Ar tu esi namie?** (bist du zu Hause?). Fragewörter: **kas** (wer, was), **kur** (wo), **kada** (wann), **kodėl** (warum), **kaip** (wie), **kiek** (wie viel), **koks / kokia** (was für ein), **kuris / kuri** (welcher).
  lt-ne:
    meaning: "Verneinung: ne- am Verb"
    intro: |
      **ne** wird mit dem Verb zusammengeschrieben: **žinau → nežinau** (ich weiß nicht), **buvo → nebuvo**. Doppelte Verneinung ist normal: **Niekas nieko nežino** (niemand weiß etwas). **Niekada ten nebuvau** (ich war nie dort). Ein verneintes Verb setzt sein Objekt in den **Genitiv**: **Nematau namo** (ich sehe das Haus nicht).
  lt-acc:
    meaning: "Akkusativ: das direkte Objekt"
    intro: |
      Die Endungen im Singular sind Nasalvokale: **-ą, -į, -ų, -ę** (**namą, brolį, sūnų, upę, knygą**); Plural **-us, -as, -es, -is** (**namus, knygas, upes**). Direktes Objekt (**Skaitau knygą**), Zeit (**visą dieną** den ganzen Tag, **kiekvieną rytą** jeden Morgen) und nach **į, per, pro, prieš, apie, pas**.
  lt-gen:
    meaning: "Genitiv: von, etwas, kein"
    intro: |
      **-o, -io, -aus, -os, -ės, -ies**; Plural **-ų, -ių**. Der Besitzer steht voran: **Jono knyga** (Jonas' Buch), **Lietuvos sostinė** (die Hauptstadt Litauens). Auch *etwas* (**Duok vandens** — gib mir Wasser), nach Verneinung (**Neturiu laiko**), nach Zahlen ab zehn (**dešimt knygų**) und nach **iš, be, nuo, prie, ant, iki, dėl, po**.
  lt-loc:
    meaning: "Lokativ: in, an"
    intro: |
      Litauisch sagt *in* mit einem Fall, ohne Präposition: **-e** (**mieste** in der Stadt), **-yje** (**kelyje** auf dem Weg), **-oje** (**mokykloje** in der Schule), **-ėje** (**gatvėje** auf der Straße), **-uje** (**sūnuje**); Plural **-uose, -ose, -ėse** (**namuose** zu Hause, **mokyklose**). **Gyvenu Vilniuje** (ich wohne in Vilnius). **Dirbu banke** (ich arbeite in einer Bank).
  lt-numbers:
    meaning: "Zahlen und das Nomen danach"
    intro: |
      **vienas (viena), du (dvi), trys, keturi, penki, šeši, septyni, aštuoni, devyni, dešimt**; 11–19 auf **-olika** (**vienuolika, dvylika**); **dvidešimt, šimtas, tūkstantis**. 1–9 kongruieren wie Adjektive (**du broliai, dvi seserys**); **dešimt, -olika, -dešimt, šimtas** verlangen den Genitiv Plural: **dešimt knygų** (zehn Bücher), **dvylika metų** (zwölf Jahre).
  lt-days:
    meaning: "Tage und Zeitwörter"
    intro: |
      Die Tage sind nummeriert: **pirmadienis** (Montag, „erster Tag“), **antradienis, trečiadienis, ketvirtadienis, penktadienis, šeštadienis, sekmadienis**. *Am Montag* = **pirmadienį** (Akkusativ). **šiandien** (heute), **rytoj** (morgen), **vakar** (gestern), **dabar** (jetzt), **ryte, vakare** (am Morgen, am Abend).
  lt-dat:
    meaning: "Dativ: wem, für wen"
    intro: |
      **-ui, -iui, -ai, -ei, -iai**; Plural **-ams, -iams, -oms, -ėms, -ims**. Indirektes Objekt (**Duodu draugui knygą** — ich gebe dem Freund das Buch), Gefühle und Alter (**Man šalta** — mir ist kalt. **Man dvidešimt metų** — ich bin zwanzig), *gefallen* (**Man patinka muzika** — Musik gefällt mir) und *brauchen* (**Man reikia laiko**).
  lt-ins:
    meaning: "Instrumental: mit, durch"
    intro: |
      **-u, -iu, -umi, -a, -e, -imi**; Plural **-ais, -iais, -omis, -ėmis, -imis**. Werkzeug und Mittel (**rašau pieštuku** — ich schreibe mit dem Bleistift, **važiuoju autobusu** — ich fahre mit dem Bus), Begleitung mit **su** (**su draugu** — mit dem Freund), was man ist oder als was man arbeitet (**Jis dirba gydytoju** — er arbeitet als Arzt) und der Weg (**eiti mišku** — durch den Wald gehen).
  lt-voc:
    meaning: "Vokativ: jemanden rufen"
    intro: |
      Gebraucht, wann immer man jemanden anspricht: **Jonas → Jonai!**, **Tomas → Tomai!**, **brolis → broli!**, **Ona → Ona!**, **draugas → drauge!**, **mama → mama!**. Höflich: **Gerbiamas profesoriau!** (Sehr geehrter Herr Professor!). Namen auf **-is, -ys** werden kürzer: **Kęstutis → Kęstuti!**
  lt-past:
    meaning: "das Präteritum"
    intro: |
      Aus der dritten Stammform: **-o:** dirbau, dirbai, dirbo, dirbome, dirbote (**dirbti – dirba – dirbo**); **-ė:** skaičiau, skaitei, skaitė, skaitėme, skaitėte (**t → č, d → dž** vor *-iau*: **vedžiau**). Der Präteritumstamm muss gelernt werden: **eiti → ėjo** (gehen), **būti → buvo**, **gerti → gėrė** (trinken).
  lt-future:
    meaning: "das Futur"
    intro: |
      Infinitivstamm + **-siu, -si, -s, -sime, -site**: **dirbti → dirbsiu, dirbsi, dirbs**. Nach **s, š, z, ž** verschmilzt das *s*: **nešti → nešiu, neš** (tragen); **vežti → vešiu**. **būti → būsiu, bus**.
  lt-frequentative:
    meaning: "die Vergangenheit der Gewohnheit: pflegte zu"
    intro: |
      Infinitivstamm + **-davau, -davai, -davo, -davome, -davote** = *pflegte zu*: **Vaikystėje dažnai žaisdavau kieme** (als Kind spielte ich oft im Hof). **Būdavo** eröffnet Geschichten: *es war einmal…*. (Casus führt es als Imperfekt.)
  lt-adj:
    meaning: "Adjektive kongruieren in Genus, Numerus und Kasus"
    intro: |
      Drei Typen: **geras / gera** (gut), **žalias / žalia** (grün), **gražus / graži** (schön). Sie kongruieren mit dem Nomen: **geras draugas, gera knyga, geri draugai, geros knygos, su geru draugu.** Für *es* oder *das* steht das Neutrum **gera, gražu**: **Čia gražu** (hier ist es schön).
  lt-comparison:
    meaning: "Komparativ und Superlativ"
    intro: |
      **-esnis / -esnė** (größer), **-iausias / -iausia** (am größten): **didelis → didesnis → didžiausias**, **geras → geresnis → geriausias**. *Als* = **nei** oder **už** + Akkusativ: **Šis namas didesnis nei tas / už tą** (dieses Haus ist größer als jenes).
  lt-prepositions:
    meaning: "Präpositionen und ihre Fälle"
    intro: |
      **+ Genitiv:** iš (aus, von), be (ohne), nuo (von, seit), prie (bei, an), ant (auf), iki (bis), dėl (wegen), po (nach), virš, tarp. **+ Akkusativ:** į (in, nach), per (durch, während), pro (vorbei an), prieš (vor, gegen), apie (über), pas (zu jemandem), pagal. **+ Instrumental:** su (mit), ties, po (unter: **po stalu**).
  lt-reflexive:
    meaning: "reflexive Verben: -si, -s"
    intro: |
      Die reflexive Endung **-si / -s** steht am Ende: **prausti** (waschen) → **praustis** (sich waschen): **prausiuosi, prausiesi, prausiasi, prausiamės, prausiatės.** Mit Präfix (oder **ne-**) rückt sie nach innen: **nusiprausti, nusiprausiu; nesiprausiu.** Viele häufige Verben sind reflexiv: **mokytis** (lernen), **juoktis** (lachen), **vadintis** (heißen — **Kaip tu vadiniesi?** wie heißt du?).
