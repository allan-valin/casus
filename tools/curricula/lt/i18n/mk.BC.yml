# Macedonian text of the Lithuanian course, B1–C2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Moods: "Начини"
  Participles: "Партиципи"
  Clauses: "Реченици"
  Definite adjectives: "Определени придавки"
  Aspect and prefixes: "Вид и префикси"
  Reported speech: "Прераскажување"
  Numbers and words: "Броеви и зборови"
  Writing and register: "Пишување и регистар"
  Rarer verb forms: "Поретки глаголски форми"
  Impersonal and passive: "Безлично и пасив"
  Talking about ideas: "Разговор за идеи"
  Style and variety: "Стил и разновидност"
lessons:
  lt-conditional:
    meaning: "кондиционал: би"
    intro: |
      Основа на инфинитивот + **-čiau, -tum, -tų, -tume, -tumėte**: **norėti → norėčiau** (би сакал), **dirbtum, būtų**. Учтиви барања (**Norėčiau kavos** — би сакал кафе), желби и нереални услови: **Jei turėčiau laiko, ateičiau** (ако имав време, ќе дојдев).
  lt-imperative:
    meaning: "императив"
    intro: |
      Основа на инфинитивот + **-k** (ти), **-kime** (ајде да), **-kite** (вие): **dirbti → dirbk, dirbkime, dirbkite**; **eiti → eik**; **bėgti → bėk** (g + k = k). Трето лице со **tegul / tegu** + сегашно: **Tegul jis ateina** (нека дојде). Помеко: **Prašom atsisėsti** (повелете, седнете).
  lt-participle-active:
    meaning: "активни партиципи: што чита, што прочитал"
    intro: |
      Литванскиот користи партиципи многу почесто од македонскиот. Сегашен **-ąs / -antis, -ąs / -iantis** (**skaitantis vaikas** дете што чита), минат **-ęs / -usi** (**perskaitęs** откако прочитал; ж. **perskaičiusi**), иден **-siantis**. Се менуваат како придавки: **skaitančio vaiko, su skaitančiu vaiku**. Служат и за прераскажување (B2) — како македонското *л*-минато.
  lt-participle-passive:
    meaning: "пасивни партиципи: што се чита, прочитан"
    intro: |
      Сегашен **-mas / -ma** (**skaitomas** што се чита), минат **-tas / -ta** (**parašytas** напишан): **Knyga parašyta lietuviškai** (книгата е напишана на литвански). Со **būti** го прават пасивот: **Namas buvo pastatytas 1900 metais** (куќата е изградена во 1900 година). Вршителот е во генитив: **Jono parašytas laiškas** (писмо напишано од Јонас).
  lt-gerund:
    meaning: "додека прави нешто: полупартицип и глаголски прилог"
    intro: |
      **-damas / -dama** (*pusdalyvis*) = додека прави нешто, ист подмет: **Grįždamas namo sutikau draugą** (враќајќи се дома, сретнав другар). **-ant / -us** (*padalyvis*) = додека *некој друг* прави нешто, често со датив: **Saulei tekant išėjome** (кога изгреа сонцето, тргнавме).
  lt-relative:
    meaning: "кој, што: релативни реченици"
    intro: |
      **kuris / kuri / kurie / kurios** зема род и број од именката, а падеж од својата реченица: **Žmogus, kuris čia gyvena, yra gydytojas** (човекот што живее тука е лекар). **Knyga, kurią skaitau, įdomi.** **kas** по *viskas, tas*: **Tai, ką sakai, tiesa** (тоа што го кажуваш е вистина). Запирката секогаш ја отвора реченицата.
  lt-conjunctions:
    meaning: "поврзување реченици"
    intro: |
      **kad** (дека; за да), **nes** (зашто), **kai** (кога), **jei / jeigu** (ако), **nors** (иако), **todėl** (затоа), **o** (а), **bet** (но), **ar** (дали). **Nežinau, ar jis ateis** (не знам дали ќе дојде). **Einu namo, nes pavargau** (одам дома, зашто сум уморен).
  lt-definite:
    meaning: "заменски (определени) придавки: добриот"
    intro: |
      Литванскиот нема член, но придавката може да стане *определена* кога ќе ѝ се спои заменка: **geras → gerasis** (добриот), **gera → geroji**, **didelis → didysis**. Именуваат видови и титули: **baltasis gandras** (белиот штрк), **Vytautas Didysis** (Великиот), и значат *оној што*: **Imk raudonąjį** (земи го црвениот).
  lt-prefixes:
    meaning: "префикси: завршени дејства и насоки"
    intro: |
      Префиксот обично го прави дејството завршено — како свршениот вид во македонскиот: **rašiau laišką** (пишував писмо) наспроти **parašiau laišką** (напишав писмо). Префиксите за движење даваат насока: **at-** (кон: **ateiti** дојде), **iš-** (надвор: **išeiti** излезе), **į-** (внатре: **įeiti** влезе), **nu-** (настрана, долу: **nueiti**), **per-** (преку, повторно: **pereiti, perskaityti**), **pri-** (до: **prieiti**), **su-** (заедно: **sueiti**).
  lt-reported:
    meaning: "прераскажан начин: што велат другите"
    intro: |
      Наместо личен глагол, партиципот покажува дека само сте слушнале (*netiesioginė nuosaka*) — како македонското прераскажување: **Jis esąs ligonis** (наводно е болен), **Kaimynas išvažiavęs** (соседот заминал, велат). Така се раскажуваат приказните: **Gyveno kartą senelis** → **Gyvenęs kartą senelis** (си живеел еднаш еден старец). Безличните известувања го користат средниот пасив: **Sakoma, kad…** (се вели дека…).
  lt-collective:
    meaning: "броеви со именки само во множина"
    intro: |
      Именките што постојат само во множина (**marškiniai** кошула, **durys** врата, **metai** година, **vestuvės** свадба) се бројат со **vieneri, dveji, treji, ketveri…**: **dveji marškiniai** (две кошули), **treji metai** (три години). Се менуваат: **Turiu dvejus marškinius** (имам две кошули).
  lt-diminutives:
    meaning: "деминутиви"
    intro: |
      Многу чести и нежни: **-elis / -ėlis** (**namelis** куќичка, **paukštelis** птиче), **-ukas / -iukas** (**broliukas, šuniukas** кутре), **-utis / -ytis** (**sūnutis**), **-aitė / -ytė / -utė** (**mergaitė** девојче, **sesutė** сестричка). Многу го изгубиле значењето „мал“: **mergaitė** е просто *девојче*.
  lt-formal:
    meaning: "учтив и официјален јазик"
    intro: |
      **Jūs** (со голема буква во писма) за една личност што не ја познавате добро, со глагол во множина: **Ar Jūs kalbate angliškai?** (зборувате ли англиски?). Обраќање: **Gerbiamas pone / Gerbiamoji ponia** (Почитуван господине / Почитувана госпоѓо), **ponas Jonaitis, ponia Jonaitienė.** **Prašom** (молам; повелете), **Atsiprašau** (извинете), **Ačiū, labai ačiū** (благодарам, многу благодарам).
  lt-budinys:
    meaning: "būdinys: нешто со голем замав"
    intro: |
      **-te** (*būdinys*) со истиот глагол го засилува: **bėgte bėgo** (трчаше ли трчаше), **tylute tylėjo** (молчеше потполно). Во народни приказни и во жив говор; формата никогаш не се менува.
  lt-necessity:
    meaning: "-tinas: што мора да се направи"
    intro: |
      **-tinas / -tina** = *што треба да се направи*: **skaitytina knyga** (книга што мора да се прочита), **Tai darytina iš karto** (тоа треба веднаш да се направи). Во говорот е обично **reikia** + инфинитив: **Reikia skaityti** (треба да се чита).
  lt-impersonal:
    meaning: "среден пасив: се зборуваше"
    intro: |
      Пасивен партицип во среден род, без подмет, кажува дека *луѓето* прават нешто: **Čia nerūkoma** (тука не се пуши), **Apie tai buvo daug kalbama** (многу се зборуваше за тоа), **Vakare buvo šokama** (навечер се играше). Со вршител во генитив може и да прераскажува: **Čia būta vilko** (тука, изгледа, бил волк).
  lt-abstract:
    meaning: "апстрактни именки"
    intro: |
      Од глаголи **-imas** (**skaitymas** читање, **mokymasis** учење), од придавки **-umas** (**gerumas** добрина, **gražumas** убавина), **-ybė** (**lygybė** еднаквост), **-ystė** (**draugystė** пријателство, **vaikystė** детство). Тоа се зборовите на науката и на расправата: **Lygybė prieš įstatymą** (еднаквост пред законот).
  lt-c2-short-loc:
    meaning: "кратки форми во поезијата и говорот"
    intro: |
      Стихот и говорот ги скратуваат наставките: локатив множина **-uose → -uos** (**kapuos** во гробовите, **namuos** дома), **-ose → -os**; инфинитиви **-ti → -t** (**dirbt**); 1 и 2 лице множина **-ame → -am, -ate → -at** (**dirbam, dirbat**); повратно **-asi → -as** (**mokos** за *mokosi*). Мајронис: *Šalis, kur miega kapuos didvyriai* (земјата каде што во гробовите спијат јунаците).
  lt-c2-dialects:
    meaning: "двете групи дијалекти"
    intro: |
      **Aukštaičiai** (горнолитвански, исток и југ) и **žemaičiai** (жемајтиски, северозапад) се разликуваат по гласови, нагласок и зборови; жемајтискиот е толку различен што има своја писмена традиција (**Labas rītos!** наместо *Labas rytas*). Стандардниот јазик се темели на западниот горнолитвански говор од околината на Каунас. Читачот го познава само стандардот.
  lt-c2-literary:
    meaning: "читање класична литература"
    intro: |
      *Metai* (*Годишните времиња*, 1760-тите, отпечатено 1818) од Кристијонас Донелаитис е првата голема литванска поема, на дијалектот на Мала Литванија и со постар правопис (**w** за *v*, **sz** за *š*). Мајронис (*Pavasario balsai*, 1895) го обликувал модерниот поетски јазик; кратката проза на Јонас Билиунас (1900-тите) се чита речиси како денешната. Постарите правописи и форми читачот може да не ги препознае.
