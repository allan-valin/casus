# Arabic text of the Lithuanian course, A1–A2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "الأصوات والحروف"
  Nouns and gender: "الأسماء والجنس"
  Pronouns and the present: "الضمائر والمضارع"
  Questions and negation: "الأسئلة والنفي"
  The cases (1): "الحالات الإعرابية (1)"
  Numbers and time: "الأعداد والزمن"
  The cases (2): "الحالات الإعرابية (2)"
  Past and future: "الماضي والمستقبل"
  Adjectives and comparison: "الصفات والمقارنة"
  Prepositions and reflexive verbs: "حروف الجر والأفعال الانعكاسية"
lessons:
  lt-alphabet:
    meaning: "الحروف الليتوانية"
    intro: |
      الحروف «الأنفية» **ą ę į ų** هي اليوم مجرد **a e i u** طويلة (**ąžuolas** بلّوط). **ė** فتحة ممالة طويلة مغلقة، و**y** = كسرة طويلة، و**ū** = ضمة طويلة. **č š ž** تُنطق *تش، ش، ج* (كالجيم الشامية)؛ و**c** = *تس*؛ و**j** = *ي*. النبر حرّ ويتنقّل بين صيغ الكلمة؛ تضعه المعاجم (**nãmas**, **namaĩ**) ولا تضعه النصوص العادية — ولا القارئ.
  lt-gender:
    meaning: "جنسان، يُعرفان من النهاية"
    intro: |
      الأسماء الليتوانية مذكّرة أو مؤنّثة (المحايد باقٍ في بعض الصفات والضمائر فقط). المذكّر: **-as, -is, -ys, -us** (**namas** بيت، **brolis** أخ، **arklys** حصان، **sūnus** ابن)؛ المؤنّث: **-a, -ė** (**knyga** كتاب، **upė** نهر) وبعض ما ينتهي بـ**-is** (**naktis** ليل). لا أداة تعريف: **namas** = *بيت* أو *البيت*.
  lt-plural:
    meaning: "الجمع في حالة الرفع"
    intro: |
      **-as → -ai** (**namai**)، **-is, -ys → -iai** (**broliai, arkliai**)، **-us → -ūs** (**sūnūs**)، **-a → -os** (**knygos**)، **-ė → -ės** (**upės**)، والمؤنّث **-is → -ys** (**naktys**). بعض الأسماء لا يوجد إلا في الجمع: **marškiniai** (قميص)، **durys** (باب).
  lt-pronouns:
    meaning: "الضمائر الشخصية"
    intro: |
      **aš** (أنا)، **tu** (أنتَ/أنتِ)، **jis / ji** (هو / هي)، **mes** (نحن)، **jūs** (أنتم، وصيغة الاحترام)، **jie / jos** (هم / هنّ). الفعل يُظهر الشخص، فكثيرًا ما يُحذف الضمير: **Dirbu** = أعمل.
  lt-present:
    meaning: "المضارع: ثلاثة تصريفات"
    intro: |
      احفظ كل فعل بثلاث صيغ: المصدر، والغائب في المضارع، والغائب في الماضي (**dirbti – dirba – dirbo**). صيغة الغائب تدلّ على التصريف. **-a:** dirbu, dirbi, dirba, dirbame, dirbate. **-i:** myliu, myli, myli, mylime, mylite. **-o:** skaitau, skaitai, skaito, skaitome, skaitote. الغائب واحد في المفرد والجمع: **jis dirba, jie dirba**.
  lt-buti:
    meaning: "būti، الكون"
    intro: |
      **esu, esi, yra, esame, esate, yra**. خلافًا للروسية يُستعمل الفعل: **Aš esu mokytojas** (أنا معلّم). و**yra** تعني أيضًا *يوجد*: **Čia yra parduotuvė** (هنا متجر). والنفي: **nesu, nesi, nėra** — و*لا يوجد* يأخذ حالة الجر (الإضافة): **Čia nėra parduotuvės.**
  lt-tureti:
    meaning: "الملكية: عندي"
    intro: |
      **turėti** (يملك): **turiu, turi, turi, turime, turite**. **Turiu brolį** (عندي أخ؛ حالة النصب). ومع النفي ينتقل المفعول إلى حالة الإضافة: **Neturiu brolio. Neturiu laiko** (ليس عندي وقت).
  lt-questions:
    meaning: "أدوات الاستفهام؛ ar"
    intro: |
      أسئلة نعم/لا تبدأ بـ**ar** (مثل «هل»): **Ar tu esi namie?** (هل أنت في البيت؟). أدوات الاستفهام: **kas** (من، ماذا)، **kur** (أين)، **kada** (متى)، **kodėl** (لماذا)، **kaip** (كيف)، **kiek** (كم)، **koks / kokia** (أيّ نوع)، **kuris / kuri** (أيّ).
  lt-ne:
    meaning: "النفي: ne- متصلة بالفعل"
    intro: |
      تُكتب **ne** متصلة بالفعل: **žinau → nežinau** (لا أعرف)، **buvo → nebuvo**. النفي المزدوج طبيعي: **Niekas nieko nežino** (لا أحد يعرف شيئًا). **Niekada ten nebuvau** (لم أكن هناك قط). والفعل المنفي يضع مفعوله في **حالة الإضافة**: **Nematau namo** (لا أرى البيت).
  lt-acc:
    meaning: "حالة النصب: المفعول به"
    intro: |
      نهايات المفرد حروف «أنفية»: **-ą, -į, -ų, -ę** (**namą, brolį, sūnų, upę, knygą**)؛ والجمع **-us, -as, -es, -is** (**namus, knygas, upes**). المفعول به (**Skaitau knygą** أقرأ كتابًا)، والزمن (**visą dieną** طوال اليوم، **kiekvieną rytą** كل صباح)، وبعد **į, per, pro, prieš, apie, pas**.
  lt-gen:
    meaning: "حالة الإضافة: لـ، بعضُ، لا"
    intro: |
      **-o, -io, -aus, -os, -ės, -ies**؛ والجمع **-ų, -ių**. المالك يتقدّم: **Jono knyga** (كتاب يوناس)، **Lietuvos sostinė** (عاصمة ليتوانيا). وتعني أيضًا *بعضًا من* (**Duok vandens** أعطني ماءً)، وتأتي بعد النفي (**Neturiu laiko**)، وبعد الأعداد من العشرة (**dešimt knygų**)، وبعد **iš, be, nuo, prie, ant, iki, dėl, po**.
  lt-loc:
    meaning: "حالة الظرفية: في"
    intro: |
      تقول الليتوانية *في* بحالة إعرابية، بلا حرف جر: **-e** (**mieste** في المدينة)، **-yje** (**kelyje** في الطريق)، **-oje** (**mokykloje** في المدرسة)، **-ėje** (**gatvėje** في الشارع)، **-uje** (**sūnuje**)؛ والجمع **-uose, -ose, -ėse** (**namuose** في البيت، **mokyklose**). **Gyvenu Vilniuje** (أسكن في فيلنيوس). **Dirbu banke** (أعمل في مصرف).
  lt-numbers:
    meaning: "الأعداد والاسم بعدها"
    intro: |
      **vienas (viena), du (dvi), trys, keturi, penki, šeši, septyni, aštuoni, devyni, dešimt**؛ ومن 11 إلى 19 بـ**-olika** (**vienuolika, dvylika**)؛ **dvidešimt, šimtas, tūkstantis**. الأعداد من 1 إلى 9 تطابق كالصفات (**du broliai, dvi seserys**)؛ و**dešimt, -olika, -dešimt, šimtas** تأخذ جمع الإضافة: **dešimt knygų** (عشرة كتب)، **dvylika metų** (اثنتا عشرة سنة).
  lt-days:
    meaning: "الأيام وكلمات الزمن"
    intro: |
      الأيام مرقّمة: **pirmadienis** (الاثنين، «اليوم الأول»)، **antradienis, trečiadienis, ketvirtadienis, penktadienis, šeštadienis, sekmadienis**. *يوم الاثنين* = **pirmadienį** (حالة النصب). **šiandien** (اليوم)، **rytoj** (غدًا)، **vakar** (أمس)، **dabar** (الآن)، **ryte, vakare** (صباحًا، مساءً).
  lt-dat:
    meaning: "حالة القابل: لمن، من أجل من"
    intro: |
      **-ui, -iui, -ai, -ei, -iai**؛ والجمع **-ams, -iams, -oms, -ėms, -ims**. المفعول غير المباشر (**Duodu draugui knygą** أعطي الصديقَ الكتاب)، والمشاعر والعمر (**Man šalta** أشعر بالبرد. **Man dvidešimt metų** عمري عشرون سنة)، و*الإعجاب* (**Man patinka muzika** تعجبني الموسيقى)، و*الحاجة* (**Man reikia laiko** أحتاج إلى وقت).
  lt-ins:
    meaning: "حالة الآلة: بـ، مع"
    intro: |
      **-u, -iu, -umi, -a, -e, -imi**؛ والجمع **-ais, -iais, -omis, -ėmis, -imis**. الأداة والوسيلة (**rašau pieštuku** أكتب بالقلم، **važiuoju autobusu** أسافر بالحافلة)، والمصاحبة مع **su** (**su draugu** مع الصديق)، وما يكون عليه المرء أو يعمل به (**Jis dirba gydytoju** يعمل طبيبًا)، والطريق (**eiti mišku** المشي عبر الغابة).
  lt-voc:
    meaning: "حالة النداء"
    intro: |
      تُستعمل كلما خاطبت أحدًا: **Jonas → Jonai!**، **Tomas → Tomai!**، **brolis → broli!**، **Ona → Ona!**، **draugas → drauge!**، **mama → mama!**. وبأدب: **Gerbiamas profesoriau!** (حضرة الأستاذ المحترم!). والأسماء المنتهية بـ**-is, -ys** تُقصّر: **Kęstutis → Kęstuti!**
  lt-past:
    meaning: "الماضي"
    intro: |
      من الصيغة الأساسية الثالثة: **-o:** dirbau, dirbai, dirbo, dirbome, dirbote (**dirbti – dirba – dirbo**)؛ **-ė:** skaičiau, skaitei, skaitė, skaitėme, skaitėte (**t → č و d → dž** قبل *-iau*: **vedžiau**). جذر الماضي يجب حفظه: **eiti → ėjo** (ذهب)، **būti → buvo**، **gerti → gėrė** (شرب).
  lt-future:
    meaning: "المستقبل"
    intro: |
      جذر المصدر + **-siu, -si, -s, -sime, -site**: **dirbti → dirbsiu, dirbsi, dirbs**. وبعد **s, š, z, ž** يندمج حرف *s*: **nešti → nešiu, neš** (يحمل)؛ **vežti → vešiu**. **būti → būsiu, bus**.
  lt-frequentative:
    meaning: "ماضي العادة: كان يفعل"
    intro: |
      جذر المصدر + **-davau, -davai, -davo, -davome, -davote** = *كنت أفعل عادةً*: **Vaikystėje dažnai žaisdavau kieme** (في طفولتي كنت ألعب كثيرًا في الفناء). وبـ**Būdavo** تبدأ الحكايات: *كان يا ما كان…*. (يصنّفه Casus ماضيًا ناقصًا.)
  lt-adj:
    meaning: "الصفات تطابق في الجنس والعدد والحالة"
    intro: |
      ثلاثة أنواع: **geras / gera** (جيّد)، **žalias / žalia** (أخضر)، **gražus / graži** (جميل). تطابق الاسم: **geras draugas, gera knyga, geri draugai, geros knygos, su geru draugu.** ومع *ذلك/هذا* يُستعمل المحايد **gera, gražu**: **Čia gražu** (المكان جميل هنا).
  lt-comparison:
    meaning: "التفضيل"
    intro: |
      **-esnis / -esnė** (أكبر)، **-iausias / -iausia** (الأكبر): **didelis → didesnis → didžiausias**، **geras → geresnis → geriausias**. *مِن* = **nei** أو **už** + حالة النصب: **Šis namas didesnis nei tas / už tą** (هذا البيت أكبر من ذاك).
  lt-prepositions:
    meaning: "حروف الجر وحالاتها"
    intro: |
      **+ الإضافة:** iš (من داخل، من)، be (بدون)، nuo (من، منذ)، prie (عند، بجانب)، ant (على)، iki (حتى)، dėl (بسبب)، po (بعد)، virš، tarp. **+ النصب:** į (إلى داخل، إلى)، per (عبر، خلال)، pro (مرورًا بـ)، prieš (قبل، ضد)، apie (عن)، pas (إلى عند أحد)، pagal. **+ الآلة:** su (مع)، ties، po (تحت: **po stalu**).
  lt-reflexive:
    meaning: "الأفعال الانعكاسية: -si, -s"
    intro: |
      النهاية الانعكاسية **-si / -s** تأتي في الآخر: **prausti** (يغسل) → **praustis** (يغتسل): **prausiuosi, prausiesi, prausiasi, prausiamės, prausiatės.** ومع سابقة (أو **ne-**) تدخل في الوسط: **nusiprausti, nusiprausiu; nesiprausiu.** كثير من الأفعال الشائعة انعكاسي: **mokytis** (يتعلّم)، **juoktis** (يضحك)، **vadintis** (يُسمّى — **Kaip tu vadiniesi?** ما اسمك؟).
