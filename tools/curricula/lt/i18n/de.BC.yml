# German text of the Lithuanian course, B1–C2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Moods: "Modi"
  Participles: "Partizipien"
  Clauses: "Nebensätze"
  Definite adjectives: "Bestimmte Adjektive"
  Aspect and prefixes: "Aspekt und Präfixe"
  Reported speech: "Berichtete Rede"
  Numbers and words: "Zahlen und Wörter"
  Writing and register: "Schreiben und Register"
  Rarer verb forms: "Seltenere Verbformen"
  Impersonal and passive: "Unpersönliches und Passiv"
  Talking about ideas: "Über Ideen sprechen"
  Style and variety: "Stil und Vielfalt"
lessons:
  lt-conditional:
    meaning: "der Konditional: würde"
    intro: |
      Infinitivstamm + **-čiau, -tum, -tų, -tume, -tumėte**: **norėti → norėčiau** (ich möchte), **dirbtum, būtų**. Höfliche Bitten (**Norėčiau kavos** — ich hätte gern einen Kaffee), Wünsche und irreale Bedingungen: **Jei turėčiau laiko, ateičiau** (wenn ich Zeit hätte, käme ich).
  lt-imperative:
    meaning: "der Imperativ"
    intro: |
      Infinitivstamm + **-k** (du), **-kime** (lasst uns), **-kite** (ihr, Sie): **dirbti → dirbk, dirbkime, dirbkite**; **eiti → eik**; **bėgti → bėk** (g + k = k). Dritte Person mit **tegul / tegu** + Präsens: **Tegul jis ateina** (er soll kommen). Weicher: **Prašom atsisėsti** (bitte setzen Sie sich).
  lt-participle-active:
    meaning: "aktive Partizipien: der liest, der gelesen hat"
    intro: |
      Litauisch gebraucht Partizipien viel häufiger als das Deutsche. Präsens **-ąs / -antis, -ąs / -iantis** (**skaitantis vaikas** ein lesendes Kind), Präteritum **-ęs / -usi** (**perskaitęs** nachdem er gelesen hat; fem. **perskaičiusi**), Futur **-siantis**. Sie werden wie Adjektive dekliniert: **skaitančio vaiko, su skaitančiu vaiku**. Sie geben auch wieder, was man gehört hat (B2).
  lt-participle-passive:
    meaning: "passive Partizipien: gelesen werdend, gelesen"
    intro: |
      Präsens **-mas / -ma** (**skaitomas** das gelesen wird), Präteritum **-tas / -ta** (**parašytas** geschrieben): **Knyga parašyta lietuviškai** (das Buch ist auf Litauisch geschrieben). Mit **būti** bilden sie das Passiv: **Namas buvo pastatytas 1900 metais** (das Haus wurde 1900 gebaut). Der Urheber steht im Genitiv: **Jono parašytas laiškas** (ein von Jonas geschriebener Brief).
  lt-gerund:
    meaning: "während man etwas tut: Halbpartizip und Gerundium"
    intro: |
      **-damas / -dama** (*pusdalyvis*) = während man etwas tut, gleiches Subjekt: **Grįždamas namo sutikau draugą** (auf dem Heimweg traf ich einen Freund). **-ant / -us** (*padalyvis*) = während *jemand anderes* etwas tut, oft mit Dativ: **Saulei tekant išėjome** (als die Sonne aufging, brachen wir auf).
  lt-relative:
    meaning: "welcher, der: Relativsätze"
    intro: |
      **kuris / kuri / kurie / kurios** nimmt Genus und Numerus vom Nomen, den Kasus aus dem eigenen Satz: **Žmogus, kuris čia gyvena, yra gydytojas** (der Mann, der hier wohnt, ist Arzt). **Knyga, kurią skaitau, įdomi.** **kas** nach *viskas, tas*: **Tai, ką sakai, tiesa** (was du sagst, ist wahr). Ein Komma eröffnet den Satz immer.
  lt-conjunctions:
    meaning: "Sätze verbinden"
    intro: |
      **kad** (dass; damit), **nes** (weil), **kai** (wenn, als), **jei / jeigu** (falls), **nors** (obwohl), **todėl** (deshalb), **o** (und, während), **bet** (aber), **ar** (ob). **Nežinau, ar jis ateis** (ich weiß nicht, ob er kommt). **Einu namo, nes pavargau** (ich gehe nach Hause, weil ich müde bin).
  lt-definite:
    meaning: "pronominale (bestimmte) Adjektive: der Gute"
    intro: |
      Litauisch hat keinen Artikel, aber ein Adjektiv kann *bestimmt* werden, indem ein Pronomen angefügt wird: **geras → gerasis** (der Gute), **gera → geroji**, **didelis → didysis**. Sie benennen Arten und Titel: **baltasis gandras** (der Weißstorch), **Vytautas Didysis** (der Große), und stehen für *der, welcher*: **Imk raudonąjį** (nimm den roten).
  lt-prefixes:
    meaning: "Präfixe: abgeschlossene Handlungen und Richtungen"
    intro: |
      Ein Präfix macht die Handlung meist abgeschlossen: **rašiau laišką** (ich schrieb an einem Brief) gegenüber **parašiau laišką** (ich habe ihn geschrieben, fertig). Präfixe der Bewegung geben die Richtung: **at-** (her: **ateiti** kommen), **iš-** (hinaus: **išeiti**), **į-** (hinein: **įeiti**), **nu-** (weg, hinunter: **nueiti**), **per-** (hinüber, noch einmal: **pereiti, perskaityti**), **pri-** (heran: **prieiti**), **su-** (zusammen: **sueiti**).
  lt-reported:
    meaning: "der Modus der Wiedergabe: was andere sagen"
    intro: |
      Statt eines finiten Verbs zeigt ein Partizip, dass man es nur gehört hat (*netiesioginė nuosaka*): **Jis esąs ligonis** (er soll krank sein), **Kaimynas išvažiavęs** (der Nachbar ist anscheinend weggefahren). So werden Märchen erzählt: **Gyveno kartą senelis** → **Gyvenęs kartą senelis** (es war einmal ein alter Mann). Unpersönliche Berichte gebrauchen das neutrale Passiv: **Sakoma, kad…** (man sagt, dass…).
  lt-collective:
    meaning: "Zahlen mit Pluraliatantum"
    intro: |
      Nomen, die es nur im Plural gibt (**marškiniai** Hemd, **durys** Tür, **metai** Jahr, **vestuvės** Hochzeit), werden mit **vieneri, dveji, treji, ketveri…** gezählt: **dveji marškiniai** (zwei Hemden), **treji metai** (drei Jahre). Sie werden dekliniert: **Turiu dvejus marškinius** (ich habe zwei Hemden).
  lt-diminutives:
    meaning: "Verkleinerungsformen"
    intro: |
      Sehr häufig und zärtlich: **-elis / -ėlis** (**namelis** Häuschen, **paukštelis** Vögelchen), **-ukas / -iukas** (**broliukas, šuniukas** Hündchen), **-utis / -ytis** (**sūnutis**), **-aitė / -ytė / -utė** (**mergaitė** Mädchen, **sesutė** Schwesterchen). Viele haben die Bedeutung „klein“ verloren: **mergaitė** ist einfach *Mädchen* — wie im Deutschen.
  lt-formal:
    meaning: "höfliche und förmliche Sprache"
    intro: |
      **Jūs** (in Briefen großgeschrieben) für eine Person, die man nicht gut kennt, mit dem Verb im Plural: **Ar Jūs kalbate angliškai?** (sprechen Sie Englisch?). Anrede: **Gerbiamas pone / Gerbiamoji ponia** (Sehr geehrter Herr / Sehr geehrte Frau), **ponas Jonaitis, ponia Jonaitienė.** **Prašom** (bitte; hier, bitte), **Atsiprašau** (Entschuldigung), **Ačiū, labai ačiū** (danke, vielen Dank).
  lt-budinys:
    meaning: "der Būdinys: etwas mit Nachdruck tun"
    intro: |
      **-te** (*būdinys*) mit demselben Verb verstärkt es: **bėgte bėgo** (rannte und rannte), **tylute tylėjo** (schwieg vollkommen). In Märchen und lebhafter Rede; die Form ändert sich nie.
  lt-necessity:
    meaning: "-tinas: was getan werden muss"
    intro: |
      **-tinas / -tina** = *was getan werden muss*: **skaitytina knyga** (ein Buch, das man lesen muss), **Tai darytina iš karto** (das ist sofort zu tun). In der Rede ist **reikia** + Infinitiv üblich: **Reikia skaityti** (man muss lesen).
  lt-impersonal:
    meaning: "das neutrale Passiv: es wurde darüber gesprochen"
    intro: |
      Ein neutrales Passivpartizip ohne Subjekt sagt, dass *man* etwas tut: **Čia nerūkoma** (hier wird nicht geraucht), **Apie tai buvo daug kalbama** (darüber wurde viel geredet), **Vakare buvo šokama** (am Abend wurde getanzt). Mit einem Urheber im Genitiv kann es sogar berichten: **Čia būta vilko** (hier ist ein Wolf gewesen).
  lt-abstract:
    meaning: "abstrakte Nomen"
    intro: |
      Von Verben **-imas** (**skaitymas** Lesen, **mokymasis** Lernen), von Adjektiven **-umas** (**gerumas** Güte, **gražumas** Schönheit), **-ybė** (**lygybė** Gleichheit), **-ystė** (**draugystė** Freundschaft, **vaikystė** Kindheit). Es sind die Wörter der Wissenschaft und der Argumentation: **Lygybė prieš įstatymą** (Gleichheit vor dem Gesetz).
  lt-c2-short-loc:
    meaning: "Kurzformen in Dichtung und Rede"
    intro: |
      Vers und Rede kürzen Endungen: der Lokativ Plural **-uose → -uos** (**kapuos** in den Gräbern, **namuos** zu Hause), **-ose → -os**; Infinitive **-ti → -t** (**dirbt**); die 1. und 2. Person Plural **-ame → -am, -ate → -at** (**dirbam, dirbat**); reflexiv **-asi → -as** (**mokos** für *mokosi*). Maironis: *Šalis, kur miega kapuos didvyriai* (das Land, wo die Helden in den Gräbern schlafen).
  lt-c2-dialects:
    meaning: "die zwei Dialektgruppen"
    intro: |
      **Aukštaičiai** (Hochlitauer, Osten und Süden) und **žemaičiai** (Niederlitauer/Samogiten, Nordwesten) unterscheiden sich in Lauten, Betonung und Wortschatz; das Samogitische ist so verschieden, dass es eine eigene Schrifttradition hat (**Labas rītos!** für *Labas rytas*). Die Standardsprache beruht auf der westlichen Hochlitauer Mundart der Gegend um Kaunas. Der Leser kennt nur den Standard.
  lt-c2-literary:
    meaning: "klassische Literatur lesen"
    intro: |
      Kristijonas Donelaitis' *Metai* (*Die Jahreszeiten*, 1760er Jahre, gedruckt 1818) ist das erste große litauische Gedicht, im Dialekt Kleinlitauens und in älterer Schreibung (**w** für *v*, **sz** für *š*). Maironis (*Pavasario balsai*, 1895) prägte die moderne Dichtersprache; die kurze Prosa von Jonas Biliūnas (1900er Jahre) liest sich fast wie heutige. Ältere Schreibungen und Formen kann der Leser unerkannt lassen.
