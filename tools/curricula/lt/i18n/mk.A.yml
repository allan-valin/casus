# Macedonian text of the Lithuanian course, A1–A2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "Гласови и букви"
  Nouns and gender: "Именки и род"
  Pronouns and the present: "Заменки и сегашно време"
  Questions and negation: "Прашања и негација"
  The cases (1): "Падежите (1)"
  Numbers and time: "Броеви и време"
  The cases (2): "Падежите (2)"
  Past and future: "Минато и идно време"
  Adjectives and comparison: "Придавки и споредување"
  Prepositions and reflexive verbs: "Предлози и повратни глаголи"
lessons:
  lt-alphabet:
    meaning: "литванските букви"
    intro: |
      „Назалните“ букви **ą ę į ų** денес се едноставно долги **a e i u** (**ąžuolas** даб). **ė** е долго затворено *е*, **y** = долго *и*, **ū** = долго *у*. **č š ž** се *ч, ш, ж*; **c** е *ц*; **j** е *ј*. Нагласокот е слободен и се менува меѓу формите на зборот; речниците го означуваат (**nãmas**, **namaĩ**), обичните текстови не — а ни читачот.
  lt-gender:
    meaning: "два рода, познати по наставката"
    intro: |
      Литванските именки се од машки или женски род (средниот род опстојува само кај некои придавки и заменки). Машки: **-as, -is, -ys, -us** (**namas** куќа, **brolis** брат, **arklys** коњ, **sūnus** син); женски: **-a, -ė** (**knyga** книга, **upė** река) и некои на **-is** (**naktis** ноќ). Нема член: **namas** е *куќа* или *куќата*.
  lt-plural:
    meaning: "номинатив множина"
    intro: |
      **-as → -ai** (**namai**), **-is, -ys → -iai** (**broliai, arkliai**), **-us → -ūs** (**sūnūs**), **-a → -os** (**knygos**), **-ė → -ės** (**upės**), женски **-is → -ys** (**naktys**). Некои именки постојат само во множина: **marškiniai** (кошула), **durys** (врата).
  lt-pronouns:
    meaning: "лични заменки"
    intro: |
      **aš** (јас), **tu** (ти), **jis / ji** (тој / таа), **mes** (ние), **jūs** (вие, и учтивото *Вие*), **jie / jos** (тие, машки / женски). Глаголот го покажува лицето, па заменката често се изостава: **Dirbu** = работам.
  lt-present:
    meaning: "сегашно време: три конјугации"
    intro: |
      Учете го секој глагол со три форми: инфинитив, 3 лице сегашно, 3 лице минато (**dirbti – dirba – dirbo**). Третото лице ја покажува конјугацијата. **-a:** dirbu, dirbi, dirba, dirbame, dirbate. **-i:** myliu, myli, myli, mylime, mylite. **-o:** skaitau, skaitai, skaito, skaitome, skaitote. Третото лице е исто во еднина и множина: **jis dirba, jie dirba**.
  lt-buti:
    meaning: "būti, сум"
    intro: |
      **esu, esi, yra, esame, esate, yra**. За разлика од рускиот, глаголот се користи: **Aš esu mokytojas** (јас сум наставник). **yra** значи и *има*: **Čia yra parduotuvė** (тука има продавница). Одречно: **nesu, nesi, nėra** — а *нема* бара генитив: **Čia nėra parduotuvės.**
  lt-tureti:
    meaning: "има"
    intro: |
      **turėti** (има): **turiu, turi, turi, turime, turite**. **Turiu brolį** (имам брат; акузатив). Со негација објектот оди во генитив: **Neturiu brolio. Neturiu laiko** (немам време).
  lt-questions:
    meaning: "прашални зборови; ar"
    intro: |
      Прашањата да/не почнуваат со **ar**: **Ar tu esi namie?** (дали си дома?). Прашални зборови: **kas** (кој, што), **kur** (каде), **kada** (кога), **kodėl** (зошто), **kaip** (како), **kiek** (колку), **koks / kokia** (каков), **kuris / kuri** (кој од).
  lt-ne:
    meaning: "негација: ne- споено со глаголот"
    intro: |
      **ne** се пишува заедно со глаголот: **žinau → nežinau** (не знам), **buvo → nebuvo**. Двојната негација е нормална: **Niekas nieko nežino** (никој ништо не знае). **Niekada ten nebuvau** (никогаш не сум бил таму). Одречниот глагол го става објектот во **генитив**: **Nematau namo** (не ја гледам куќата).
  lt-acc:
    meaning: "акузатив: директен објект"
    intro: |
      Наставките во еднина се „назални“ самогласки: **-ą, -į, -ų, -ę** (**namą, brolį, sūnų, upę, knygą**); множина **-us, -as, -es, -is** (**namus, knygas, upes**). Директен објект (**Skaitau knygą** — читам книга), време (**visą dieną** цел ден, **kiekvieną rytą** секое утро) и по **į, per, pro, prieš, apie, pas**.
  lt-gen:
    meaning: "генитив: на, малку, нема"
    intro: |
      **-o, -io, -aus, -os, -ės, -ies**; множина **-ų, -ių**. Сопственикот стои напред: **Jono knyga** (книгата на Јонас), **Lietuvos sostinė** (главниот град на Литванија). Исто така *малку од* (**Duok vandens** — дај ми вода), по негација (**Neturiu laiko**), по броевите од десет нагоре (**dešimt knygų**) и по **iš, be, nuo, prie, ant, iki, dėl, po**.
  lt-loc:
    meaning: "локатив: во, на"
    intro: |
      Литванскиот кажува *во* со падеж, без предлог: **-e** (**mieste** во градот), **-yje** (**kelyje** на патот), **-oje** (**mokykloje** во училиштето), **-ėje** (**gatvėje** на улицата), **-uje** (**sūnuje**); множина **-uose, -ose, -ėse** (**namuose** дома, **mokyklose**). **Gyvenu Vilniuje** (живеам во Вилнус). **Dirbu banke** (работам во банка).
  lt-numbers:
    meaning: "броеви и именката по нив"
    intro: |
      **vienas (viena), du (dvi), trys, keturi, penki, šeši, septyni, aštuoni, devyni, dešimt**; 11–19 на **-olika** (**vienuolika, dvylika**); **dvidešimt, šimtas, tūkstantis**. Од 1 до 9 се согласуваат како придавки (**du broliai, dvi seserys**); **dešimt, -olika, -dešimt, šimtas** бараат генитив множина: **dešimt knygų** (десет книги), **dvylika metų** (дванаесет години).
  lt-days:
    meaning: "денови и зборови за време"
    intro: |
      Деновите се нумерирани: **pirmadienis** (понеделник, „прв ден“), **antradienis, trečiadienis, ketvirtadienis, penktadienis, šeštadienis, sekmadienis**. *Во понеделник* = **pirmadienį** (акузатив). **šiandien** (денеска), **rytoj** (утре), **vakar** (вчера), **dabar** (сега), **ryte, vakare** (наутро, навечер).
  lt-dat:
    meaning: "датив: на кого, за кого"
    intro: |
      **-ui, -iui, -ai, -ei, -iai**; множина **-ams, -iams, -oms, -ėms, -ims**. Индиректен објект (**Duodu draugui knygą** — му ја давам книгата на другарот), чувства и возраст (**Man šalta** — ладно ми е. **Man dvidešimt metų** — имам дваесет години), *се допаѓа* (**Man patinka muzika** — ми се допаѓа музиката) и *ми треба* (**Man reikia laiko**).
  lt-ins:
    meaning: "инструментал: со, преку"
    intro: |
      **-u, -iu, -umi, -a, -e, -imi**; множина **-ais, -iais, -omis, -ėmis, -imis**. Средство (**rašau pieštuku** — пишувам со молив, **važiuoju autobusu** — патувам со автобус), друштво со **su** (**su draugu** — со другарот), што е некој или како што работи (**Jis dirba gydytoju** — работи како лекар) и патот (**eiti mišku** — оди низ шумата).
  lt-voc:
    meaning: "вокатив: обраќање"
    intro: |
      Се користи секогаш кога му се обраќате некому — како и во македонскиот: **Jonas → Jonai!**, **Tomas → Tomai!**, **brolis → broli!**, **Ona → Ona!**, **draugas → drauge!**, **mama → mama!**. Учтиво: **Gerbiamas profesoriau!** (Почитуван професоре!). Имињата на **-is, -ys** се скратуваат: **Kęstutis → Kęstuti!**
  lt-past:
    meaning: "минато време"
    intro: |
      Од третата основна форма: **-o:** dirbau, dirbai, dirbo, dirbome, dirbote (**dirbti – dirba – dirbo**); **-ė:** skaičiau, skaitei, skaitė, skaitėme, skaitėte (**t → č, d → dž** пред *-iau*: **vedžiau**). Основата за минато мора да се научи: **eiti → ėjo** (оди), **būti → buvo**, **gerti → gėrė** (пие).
  lt-future:
    meaning: "идно време"
    intro: |
      Основа на инфинитивот + **-siu, -si, -s, -sime, -site**: **dirbti → dirbsiu, dirbsi, dirbs**. По **s, š, z, ž** *s* се слева: **nešti → nešiu, neš** (носи); **vežti → vešiu**. **būti → būsiu, bus**.
  lt-frequentative:
    meaning: "минато на навика: имаше обичај да"
    intro: |
      Основа на инфинитивот + **-davau, -davai, -davo, -davome, -davote** = *имав обичај да*: **Vaikystėje dažnai žaisdavau kieme** (како дете често си играв во дворот). **Būdavo** ги почнува приказните: *си беше еднаш…*. (Casus го води како имперфект.)
  lt-adj:
    meaning: "придавките се согласуваат по род, број и падеж"
    intro: |
      Три типа: **geras / gera** (добар), **žalias / žalia** (зелен), **gražus / graži** (убав). Се согласуваат со именката: **geras draugas, gera knyga, geri draugai, geros knygos, su geru draugu.** За *тоа* се користи средниот род **gera, gražu**: **Čia gražu** (тука е убаво).
  lt-comparison:
    meaning: "компаратив и суперлатив"
    intro: |
      **-esnis / -esnė** (поголем), **-iausias / -iausia** (најголем): **didelis → didesnis → didžiausias**, **geras → geresnis → geriausias**. *Од* = **nei** или **už** + акузатив: **Šis namas didesnis nei tas / už tą** (оваа куќа е поголема од онаа).
  lt-prepositions:
    meaning: "предлози и нивните падежи"
    intro: |
      **+ генитив:** iš (од, од внатре), be (без), nuo (од, откако), prie (кај, покрај), ant (на), iki (до), dėl (поради), po (по), virš, tarp. **+ акузатив:** į (во, кон), per (низ, за време на), pro (покрај), prieš (пред, против), apie (за), pas (кај некого), pagal. **+ инструментал:** su (со), ties, po (под: **po stalu**).
  lt-reflexive:
    meaning: "повратни глаголи: -si, -s"
    intro: |
      Повратната наставка **-si / -s** оди на крајот: **prausti** (мие) → **praustis** (се мие): **prausiuosi, prausiesi, prausiasi, prausiamės, prausiatės.** Со префикс (или **ne-**) таа влегува внатре: **nusiprausti, nusiprausiu; nesiprausiu.** Многу чести глаголи се повратни: **mokytis** (учи), **juoktis** (се смее), **vadintis** (се вика — **Kaip tu vadiniesi?** како се викаш?).
