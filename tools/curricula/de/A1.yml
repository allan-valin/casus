# German A1, topics Grimm Grammar has no page for (written by AI (Claude) for Casus, 2026-10-27; marked as such on
# every lesson). Found by checking Learn against the usual A1 inventories (Goethe-Zertifikat A1, Profile Deutsch):
# Grimm is a grammar reference ordered by part of speech, so the course basics below were missing from the main path
# (numbers only existed in the French Wikiversity quizzes and an English Wikibooks appendix filed under B1).
id: A1
topics:

- title: {en: First things, pt: Primeiros passos}
  lessons:
  - id: de-a1-alphabet
    title: Das Alphabet
    meaning: {en: "the alphabet, spelling aloud, ä ö ü ß", pt: "o alfabeto, soletrar, ä ö ü ß"}
    intro:
      en: |
        German uses the Latin alphabet plus **ä, ö, ü** and **ß**. Spelling names aloud is everyday German: at a reception desk, on the phone, at an office.

        | letter | said | letter | said | letter | said |
        |---|---|---|---|---|---|
        | A | a | J | jott | S | es |
        | B | be | K | ka | T | te |
        | C | tse | L | el | U | u |
        | D | de | M | em | V | fau |
        | E | e | N | en | W | we |
        | F | ef | O | o | X | iks |
        | G | ge | P | pe | Y | üpsilon |
        | H | ha | Q | ku | Z | tset |
        | I | i | R | er | ß | eszett |

        **Ä, Ö, Ü** are said as their sound (a-Umlaut, o-Umlaut, u-Umlaut). Double letters are spelled **Doppel-**: **Doppel-L**.

        Sounds that surprise: **w** = English v (**Wasser**), **v** = f (**Vater**), **z** = ts (**Zeit**), **ei** = "eye" (**mein**), **ie** = "ee" (**Bier**), **eu/äu** = "oy" (**heute**), **sch** = sh, **ch** after a, o, u is the throat sound (**Buch**), after other vowels it is soft (**ich**).
      pt: |
        O alemão usa o alfabeto latino mais **ä, ö, ü** e **ß**. Soletrar nomes é coisa do dia a dia: na recepção, ao telefone, numa repartição.

        | letra | diz-se | letra | diz-se | letra | diz-se |
        |---|---|---|---|---|---|
        | A | a | J | iót | S | és |
        | B | bê | K | ká | T | tê |
        | C | tsê | L | él | U | u |
        | D | dê | M | ém | V | fau |
        | E | ê | N | én | W | vê |
        | F | éf | O | ô | X | iks |
        | G | guê | P | pê | Y | üpsilon |
        | H | rá (h aspirado) | Q | ku | Z | tsét |
        | I | i | R | ér | ß | és-tsét |

        **Ä, Ö, Ü** dizem-se pelo som (a-Umlaut, o-Umlaut, u-Umlaut). Letras dobradas: **Doppel-**: **Doppel-L**.

        Sons que surpreendem: **w** = v (**Wasser**), **v** = f (**Vater**), **z** = ts (**Zeit**), **ei** = "ai" (**mein**), **ie** = "i" longo (**Bier**), **eu/äu** = "ói" (**heute**), **sch** = ch de "chá", **ch** depois de a, o, u é o som da garganta (**Buch**), depois das outras vogais é suave (**ich**). O **h** no começo da palavra é aspirado, como o h do inglês *house*.
    mistakes:
    - wrong: "Wie schreibt man das? — Vau, a, es, e."
      right: "Wie schreibt man das? — Fau, a, es, e. (Vase)"
      why: {en: "V is said fau, and as a sound it is usually f; W is said we and sounds like English v.", pt: "V se diz fau e soa geralmente como f; W se diz vê e soa como v."}
    examples:
    - ["Wie schreibt man das?", "How do you spell that?", "Como se escreve isso?", "schreibt"]
    - ["Können Sie das bitte buchstabieren?", "Could you spell that, please?", "Pode soletrar, por favor?", "buchstabieren"]
    - ["Mein Name ist Weber: W, E, B, E, R.", "My name is Weber: W, E, B, E, R.", "Meu nome é Weber: W, E, B, E, R.", "Name"]
    match: {seq: [{word: [buchstabieren, schreibt, Buchstabe, Buchstaben, Alphabet]}]}
    pool: [buchstabieren, schreibt, heißt, sagt, liest, spricht]

  - id: de-a1-numbers
    title: Die Zahlen
    meaning: {en: "numbers: counting, prices, age, phone numbers", pt: "números: contar, preços, idade, telefone"}
    intro:
      en: |
        **0–12** are single words: null, eins, zwei, drei, vier, fünf, sechs, sieben, acht, neun, zehn, elf, zwölf.

        **13–19**: number + **-zehn**: dreizehn, vierzehn, fünfzehn, **sechzehn** (no s), **siebzehn** (no en), achtzehn, neunzehn.

        **Tens**: zwanzig, **dreißig** (ß, not z), vierzig, fünfzig, **sechzig**, **siebzig**, achtzig, neunzig, hundert.

        **21–99 are said backwards**, ones first, joined by **und**, written as one word: **einundzwanzig** (one-and-twenty), **siebenundvierzig** (47), **neunundneunzig** (99).

        Bigger numbers keep that order inside: **hundertdreiundzwanzig** (123), **zweitausendfünfhundert** (2 500), **eine Million**.

        **eins** is the number alone; before a noun it is the article **ein / eine**: **eins, zwei, drei** — **ein Kaffee, eine Cola**. In 21, 31… it is **ein-**: **einundzwanzig**.

        In use:
        - age: **Ich bin dreißig (Jahre alt).**
        - prices: **Das kostet 3,50 €** — **drei Euro fünfzig**. The comma is the decimal mark; the point groups thousands: **1.000**.
        - phone numbers go digit by digit or in pairs; **zwo** replaces **zwei** on the phone, so it is not confused with **drei**.
      pt: |
        **0–12** são palavras simples: null, eins, zwei, drei, vier, fünf, sechs, sieben, acht, neun, zehn, elf, zwölf.

        **13–19**: número + **-zehn**: dreizehn, vierzehn, fünfzehn, **sechzehn** (sem s), **siebzehn** (sem en), achtzehn, neunzehn.

        **Dezenas**: zwanzig, **dreißig** (com ß, não z), vierzig, fünfzig, **sechzig**, **siebzig**, achtzig, neunzig, hundert.

        **21–99 se dizem ao contrário**, a unidade primeiro, ligada por **und**, tudo numa palavra: **einundzwanzig** (um-e-vinte), **siebenundvierzig** (47), **neunundneunzig** (99).

        Números maiores mantêm essa ordem por dentro: **hundertdreiundzwanzig** (123), **zweitausendfünfhundert** (2.500), **eine Million**.

        **eins** é o número sozinho; antes de substantivo é o artigo **ein / eine**: **eins, zwei, drei** — **ein Kaffee, eine Cola**. Em 21, 31… fica **ein-**: **einundzwanzig**.

        No uso:
        - idade: **Ich bin dreißig (Jahre alt).**
        - preços: **Das kostet 3,50 €** — **drei Euro fünfzig**. A vírgula separa os decimais e o ponto os milhares, como no Brasil: **1.000**.
        - telefone: dígito por dígito ou em pares; ao telefone se diz **zwo** em vez de **zwei**, para não confundir com **drei**.
    mistakes:
    - wrong: "zwanzigeins"
      right: "einundzwanzig"
      why: {en: "From 21 to 99 the ones come first, then und, then the tens.", pt: "De 21 a 99 a unidade vem primeiro, depois und, depois a dezena."}
    - wrong: "Ich habe eins Bruder."
      right: "Ich habe einen Bruder."
      why: {en: "Before a noun 'one' is the article ein/eine/einen, which takes the case ending.", pt: "Antes de substantivo, 'um' é o artigo ein/eine/einen, que leva a terminação do caso."}
    examples:
    - ["Ich bin einundzwanzig Jahre alt.", "I am twenty-one years old.", "Tenho vinte e um anos.", "einundzwanzig"]
    - ["Das kostet drei Euro fünfzig.", "That costs three euros fifty.", "Custa três euros e cinquenta.", "drei"]
    - ["Wir haben vierzig Stühle.", "We have forty chairs.", "Temos quarenta cadeiras.", "vierzig"]
    - ["Meine Nummer ist null, eins, sieben, zwo, drei.", "My number is zero one seven two three.", "Meu número é zero, um, sete, dois, três.", "zwo"]
    match: {seq: [{word: [eins, zwei, drei, vier, fünf, sechs, sieben, acht, neun, zehn, elf, zwölf, zwanzig, dreißig, vierzig, fünfzig, sechzig, siebzig, achtzig, neunzig, hundert, tausend]}]}
    pool: [zwei, drei, vier, zehn, zwanzig, dreißig, hundert, elf, zwölf]

- title: {en: Saying what there is and what you like, pt: Dizer o que há e do que você gosta}
  lessons:
  - id: de-a1-es-gibt
    title: es gibt
    meaning: {en: "there is / there are: es gibt + accusative", pt: "há / tem: es gibt + acusativo"}
    intro:
      en: |
        **es gibt** says that something exists or is available. It is always singular (**gibt**), and what exists is in the **accusative**:

        **Es gibt einen Bahnhof.** "There is a station." — **einen**, accusative.

        **Gibt es hier ein Café?** "Is there a café here?"

        **Es gibt keine Milch mehr.** "There is no milk left."

        In the past: **es gab**. The **es** moves after the verb when something else comes first: **Hier gibt es viele Parks.**

        For something in a precise place, German often uses a position verb instead: **Auf dem Tisch liegt ein Buch.** (see position verbs, A2).
      pt: |
        **es gibt** diz que algo existe ou está disponível — o nosso "tem" ou "há". É sempre singular (**gibt**), e o que existe vai no **acusativo**:

        **Es gibt einen Bahnhof.** "Tem uma estação." — **einen**, acusativo.

        **Gibt es hier ein Café?** "Tem um café aqui?"

        **Es gibt keine Milch mehr.** "Não tem mais leite."

        No passado: **es gab**. O **es** vai para depois do verbo quando outra coisa vem antes: **Hier gibt es viele Parks.**

        Para algo num lugar preciso, o alemão costuma usar um verbo de posição: **Auf dem Tisch liegt ein Buch.** (ver verbos de posição, A2).
    mistakes:
    - wrong: "Es gibt ein Bahnhof."
      right: "Es gibt einen Bahnhof."
      why: {en: "What es gibt introduces is an accusative object: masculine ein → einen.", pt: "O que vem depois de es gibt é objeto no acusativo: masculino ein → einen."}
    - wrong: "Es geben viele Parks."
      right: "Es gibt viele Parks."
      why: {en: "gibt stays singular even with a plural object.", pt: "gibt fica no singular mesmo com objeto no plural."}
    examples:
    - ["Gibt es hier eine Apotheke?", "Is there a pharmacy here?", "Tem uma farmácia aqui?", "Gibt"]
    - ["In der Stadt gibt es viele Parks.", "There are many parks in the town.", "Na cidade há muitos parques.", "gibt"]
    - ["Heute gibt es Fisch.", "Today there is fish.", "Hoje tem peixe.", "gibt"]
    match: {seq: [{word: [gibt, gab]}, {word: [es]}], near: 2}
    pool: [gibt, gab, ist, hat, sind, geben]

  - id: de-a1-gern
    title: gern, lieber, am liebsten
    meaning: {en: "liking to do something: gern + verb, lieber, am liebsten; mögen", pt: "gostar de fazer algo: gern + verbo, lieber, am liebsten; mögen"}
    intro:
      en: |
        German says "I like doing X" with the verb + **gern**: **Ich schwimme gern.** "I like swimming." **gern** goes after the verb and its object, before a final infinitive or particle: **Ich spiele gern Fußball.**

        Not liking: **nicht gern**: **Ich koche nicht gern.**

        Comparing: **gern → lieber → am liebsten**: **Ich trinke gern Tee, lieber Kaffee und am liebsten Kakao.**

        For things and people, **mögen**: **Ich mag Katzen.** "I like cats." — **Ich mag schwimmen** is heard but **Ich schwimme gern** is the usual way for activities.

        Wishes are **möchte** (would like): **Ich möchte einen Tee.** — what you want now, not what you like in general.
      pt: |
        O alemão diz "gosto de fazer X" com o verbo + **gern**: **Ich schwimme gern.** "Gosto de nadar." **gern** vem depois do verbo e do objeto: **Ich spiele gern Fußball.**

        Não gostar: **nicht gern**: **Ich koche nicht gern.**

        Comparar: **gern → lieber → am liebsten**: **Ich trinke gern Tee, lieber Kaffee und am liebsten Kakao.** "Gosto de chá, prefiro café e o que mais gosto é chocolate quente."

        Para coisas e pessoas, **mögen**: **Ich mag Katzen.** "Gosto de gatos." — **Ich mag schwimmen** se ouve, mas **Ich schwimme gern** é o normal para atividades.

        Desejos são **möchte** (gostaria): **Ich möchte einen Tee.** — o que você quer agora, não do que gosta em geral.
    mistakes:
    - wrong: "Ich gern spiele Fußball."
      right: "Ich spiele gern Fußball."
      why: {en: "The verb stays in second place; gern comes after it.", pt: "O verbo fica na segunda posição; gern vem depois dele."}
    - wrong: "Ich mag Tee lieber als Kaffee am liebsten."
      right: "Ich trinke lieber Tee als Kaffee."
      why: {en: "lieber goes with a verb of the activity; als introduces what you like less.", pt: "lieber acompanha o verbo da atividade; als introduz o que você gosta menos."}
    examples:
    - ["Ich lese gern.", "I like reading.", "Gosto de ler.", "gern"]
    - ["Wir fahren lieber mit dem Zug.", "We prefer to go by train.", "Preferimos ir de trem.", "lieber"]
    - ["Was isst du am liebsten?", "What do you like eating most?", "O que você mais gosta de comer?", "liebsten"]
    - ["Sie tanzt nicht gern.", "She doesn't like dancing.", "Ela não gosta de dançar.", "gern"]
    match: {seq: [{word: [gern, gerne, lieber, liebsten]}]}
    pool: [gern, lieber, liebsten, sehr, viel, oft]
