- title: {en: More modal particles, pt: Mais partículas modais}
  lessons:
  - id: de-c1-particles
    title: ruhig, etwa, schon, auch
    meaning: {en: "particles that reassure, doubt, insist", pt: "partículas que tranquilizam, duvidam, insistem"}
    intro:
      en: |
        Beside **doch, mal, ja, denn**, these particles colour a sentence:

        - **ruhig** in a command: go ahead, don't worry: **Komm ruhig rein!** "Do come in!"
        - **etwa** in a question: surprise, a hoped-for *no*: **Bist du etwa krank?** "You're not ill, are you?"
        - **schon** reassures: **Das wird schon klappen.** "It'll work out, you'll see."
        - **auch** in a question: checking: **Hast du auch die Tür abgeschlossen?** "Did you lock the door, I hope?"
        - **eigentlich** in a question: changing the subject: **Wie alt bist du eigentlich?** "By the way, how old are you?"
      pt: |
        Além de **doch, mal, ja, denn**, estas partículas dão cor à frase:

        - **ruhig** numa ordem: à vontade, sem problema: **Komm ruhig rein!** "Pode entrar!"
        - **etwa** numa pergunta: surpresa, espera-se um *não*: **Bist du etwa krank?** "Não vai me dizer que está doente?"
        - **schon** tranquiliza: **Das wird schon klappen.** "Vai dar certo, você vai ver."
        - **auch** numa pergunta: conferir: **Hast du auch die Tür abgeschlossen?** "Você trancou a porta, né?"
        - **eigentlich** numa pergunta: mudar de assunto: **Wie alt bist du eigentlich?** "Aliás, quantos anos você tem?"
    examples:
    - ["Komm ruhig rein!", "Do come in!", "Pode entrar!", "ruhig"]
    - ["Bist du etwa krank?", "You're not ill, are you?", "Não vai me dizer que está doente?", "etwa"]
    - ["Das wird schon klappen.", "It'll work out.", "Vai dar certo.", "schon"]
    match:
    - {seq: [{pos: verb, mood: imp}, {word: [ruhig]}], near: 3, gap: 1}
    - {seq: [{word: [etwa]}, {re: ".", trail: "?"}], near: 6, gap: 0}
    - {seq: [{word: [wird, werden]}, {word: [schon]}], near: 2, gap: 1}
    pool: [ruhig, etwa, schon, doch, ja, mal, denn, eben]
