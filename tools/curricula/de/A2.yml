id: A2
topics:

- title: {en: Dates and choosing, pt: Datas e escolhas}
  lessons:
  - id: de-a2-dates
    title: Ordinalzahlen und Datum
    meaning: {en: "ordinal numbers and dates: am ersten Mai, der 3. Oktober", pt: "ordinais e datas: am ersten Mai, der 3. Oktober"}
    intro:
      en: |
        **Ordinals** add **-t-** up to 19 and **-st-** from 20, then an adjective ending: **der zweite**, **der zwanzigste**. Irregular: **erste**, **dritte**, **siebte**, **achte**.

        Written with a point: **der 3. Oktober** = der dritte Oktober.

        **Which day?** — nominative: **Heute ist der vierte Mai.** "Today is the fourth of May."

        **When?** — **am** + dative, ending **-en**: **Ich komme am vierten Mai.** "I'm coming on the fourth of May." **Am 1. Januar** = am ersten Januar.

        Letters and forms write the date **4.5.2026** or **4. Mai 2026**: day, month, year. Years are said in hundreds up to 1999 (**neunzehnhundertneunzig**), then as thousands (**zweitausendsechsundzwanzig**), with no **in**: **Ich bin 1990 geboren.**
      pt: |
        Os **ordinais** acrescentam **-t-** até 19 e **-st-** a partir de 20, mais a terminação de adjetivo: **der zweite**, **der zwanzigste**. Irregulares: **erste**, **dritte**, **siebte**, **achte**.

        Escritos com ponto: **der 3. Oktober** = der dritte Oktober.

        **Que dia é?** — nominativo: **Heute ist der vierte Mai.** "Hoje é quatro de maio."

        **Quando?** — **am** + dativo, terminação **-en**: **Ich komme am vierten Mai.** "Venho no dia quatro de maio." **Am 1. Januar** = am ersten Januar.

        A data escreve-se **4.5.2026** ou **4. Mai 2026**: dia, mês, ano, como no Brasil. Os anos até 1999 se dizem em centenas (**neunzehnhundertneunzig**), depois em milhares (**zweitausendsechsundzwanzig**), sem preposição: **Ich bin 1990 geboren.** "Nasci em 1990."
    mistakes:
    - wrong: "Ich komme am vierte Mai."
      right: "Ich komme am vierten Mai."
      why: {en: "am is an + dem: the ordinal takes the dative ending -en.", pt: "am é an + dem: o ordinal leva a terminação de dativo -en."}
    - wrong: "Ich bin in 1990 geboren."
      right: "Ich bin 1990 geboren."
      why: {en: "A bare year takes no preposition (or im Jahr 1990).", pt: "Ano sozinho não leva preposição (ou im Jahr 1990)."}
    examples:
    - ["Heute ist der erste Juni.", "Today is the first of June.", "Hoje é primeiro de junho.", "erste"]
    - ["Mein Geburtstag ist am dritten März.", "My birthday is on the third of March.", "Meu aniversário é no dia três de março.", "dritten"]
    - ["Wir fahren am zwanzigsten August.", "We leave on the twentieth of August.", "Viajamos no dia vinte de agosto.", "zwanzigsten"]
    match: {seq: [{word: [ersten, zweiten, dritten, vierten, fünften, sechsten, siebten, achten, neunten, zehnten, zwanzigsten, dreißigsten, erste, zweite, dritte]}]}
    pool: [ersten, zweiten, dritten, erste, zweite, dritte, vierten, zehnten]

  - id: de-a2-welcher
    title: welcher und was für ein
    meaning: {en: "which? and what kind of?: welcher, was für ein", pt: "qual? e que tipo de?: welcher, was für ein"}
    intro:
      en: |
        **welcher / welche / welches** asks to choose among things already known — "which one?". It ends like **der / die / das**: **Welchen Zug nimmst du?** (accusative), **Mit welcher Linie?** (dative).

        **was für ein** asks what kind: **Was für ein Auto hast du?** — "What kind of car?" Answer: **ein kleines**. Only **ein** changes; **für** does not govern its case here: **In was für einem Haus wohnst du?** (dative, from **in**). Plural: **was für** with no ein: **Was für Bücher liest du?**

        **Welche Farbe?** — one of the colours in front of you; **Was für eine Farbe?** — what sort of colour in general.
      pt: |
        **welcher / welche / welches** pede que se escolha entre coisas conhecidas — "qual?". Termina como **der / die / das**: **Welchen Zug nimmst du?** "Qual trem você pega?" (acusativo), **Mit welcher Linie?** (dativo).

        **was für ein** pergunta o tipo: **Was für ein Auto hast du?** — "Que tipo de carro?" Resposta: **ein kleines**. Só o **ein** muda; o **für** aqui não rege o caso: **In was für einem Haus wohnst du?** (dativo, por causa do **in**). No plural, **was für** sem ein: **Was für Bücher liest du?**

        **Welche Farbe?** — uma das cores à sua frente; **Was für eine Farbe?** — que tipo de cor, em geral.
    mistakes:
    - wrong: "Was für einen Haus wohnst du in?"
      right: "In was für einem Haus wohnst du?"
      why: {en: "The preposition stands in front and decides the case of ein; für does not.", pt: "A preposição vai na frente e decide o caso de ein; o für não decide."}
    examples:
    - ["Welcher Bus fährt zum Bahnhof?", "Which bus goes to the station?", "Qual ônibus vai para a estação?", "Welcher"]
    - ["Welche Jacke nimmst du?", "Which jacket are you taking?", "Qual jaqueta você vai levar?", "Welche"]
    - ["Was für ein Hund ist das?", "What kind of dog is that?", "Que tipo de cachorro é esse?", "für"]
    match: {seq: [{word: [welcher, welche, welches, welchen, welchem, Welcher, Welche, Welches, Welchen, Welchem]}]}
    pool: [welcher, welche, welches, welchen, welchem]

- title: {en: Putting things somewhere, pt: Colocar as coisas no lugar}
  lessons:
  - id: de-a2-position-verbs
    title: stellen – stehen, legen – liegen
    meaning: {en: "putting and being somewhere: stellen/stehen, legen/liegen, setzen/sitzen, hängen", pt: "pôr e estar num lugar: stellen/stehen, legen/liegen, setzen/sitzen, hängen"}
    intro:
      en: |
        German says how a thing is placed. Each pair has a verb of **putting** (movement, **wohin?** → **accusative**, regular verb) and a verb of **being there** (**wo?** → **dative**, irregular verb):

        | putting (wohin? + Akk.) | being (wo? + Dat.) | for |
        |---|---|---|
        | **stellen**, hat gestellt | **stehen**, hat gestanden | upright: bottles, furniture |
        | **legen**, hat gelegt | **liegen**, hat gelegen | lying flat: books, phones, people |
        | **setzen**, hat gesetzt | **sitzen**, hat gesessen | sitting: people, a cat |
        | **hängen**, hat gehängt | **hängen**, hat gehangen | hanging: pictures, coats |

        **Ich stelle die Flasche auf den Tisch.** → **Die Flasche steht auf dem Tisch.**

        **Ich lege das Handy auf das Bett.** → **Das Handy liegt auf dem Bett.**

        These go with the two-way prepositions (an, auf, hinter, in, neben, über, unter, vor, zwischen): accusative after the putting verb, dative after the being verb.
      pt: |
        O alemão diz como a coisa está posta. Cada par tem um verbo de **pôr** (movimento, **wohin?** → **acusativo**, verbo regular) e um de **estar lá** (**wo?** → **dativo**, verbo irregular):

        | pôr (wohin? + Akk.) | estar (wo? + Dat.) | para |
        |---|---|---|
        | **stellen**, hat gestellt | **stehen**, hat gestanden | em pé: garrafas, móveis |
        | **legen**, hat gelegt | **liegen**, hat gelegen | deitado: livros, celulares, pessoas |
        | **setzen**, hat gesetzt | **sitzen**, hat gesessen | sentado: pessoas, um gato |
        | **hängen**, hat gehängt | **hängen**, hat gehangen | pendurado: quadros, casacos |

        **Ich stelle die Flasche auf den Tisch.** "Ponho a garrafa (em pé) na mesa." → **Die Flasche steht auf dem Tisch.** "A garrafa está na mesa."

        **Ich lege das Handy auf das Bett.** → **Das Handy liegt auf dem Bett.**

        Onde o português diz só "pôr" e "estar", o alemão escolhe o verbo pela posição. Vão com as preposições de dois casos (an, auf, hinter, in, neben, über, unter, vor, zwischen): acusativo depois do verbo de pôr, dativo depois do verbo de estar.
    mistakes:
    - wrong: "Das Buch steht auf dem Tisch."
      right: "Das Buch liegt auf dem Tisch."
      why: {en: "A book lying flat liegt; stehen is for things upright.", pt: "Um livro deitado liegt; stehen é para coisas em pé."}
    - wrong: "Ich lege das Handy auf dem Tisch."
      right: "Ich lege das Handy auf den Tisch."
      why: {en: "legen is movement (wohin?): accusative.", pt: "legen é movimento (wohin?): acusativo."}
    examples:
    - ["Stell die Milch in den Kühlschrank!", "Put the milk in the fridge!", "Põe o leite na geladeira!", "Stell"]
    - ["Die Schlüssel liegen auf dem Tisch.", "The keys are on the table.", "As chaves estão na mesa.", "liegen"]
    - ["Das Bild hängt an der Wand.", "The picture is hanging on the wall.", "O quadro está pendurado na parede.", "hängt"]
    - ["Er setzt das Kind auf den Stuhl.", "He sits the child on the chair.", "Ele senta a criança na cadeira.", "setzt"]
    match: {seq: [{lemma: "^(stellen|stehen|legen|liegen|setzen|sitzen|hängen)$"}, {word: [an, auf, hinter, in, neben, über, unter, vor, zwischen, im, am, ins, ans]}], near: 6}
    pool: [stellen, stehen, legen, liegen, setzen, sitzen, hängt, liegt, steht, stellt, legt, sitzt]

- title: {en: People and things in general; linking sentences, pt: Pessoas e coisas em geral; ligar frases}
  lessons:
  - id: de-a2-indefinite-pronouns
    title: jemand, niemand, etwas, nichts
    meaning: {en: "indefinite pronouns: jemand, niemand, etwas, nichts, alle, man, einer, keiner", pt: "pronomes indefinidos: jemand, niemand, etwas, nichts, alle, man, einer, keiner"}
    intro:
      en: |
        | someone | no one | something | nothing | everyone | everything |
        |---|---|---|---|---|---|
        | **jemand** | **niemand** | **etwas** (spoken **was**) | **nichts** | **alle** (plural) | **alles** |

        **jemand / niemand** can take case endings (**jemanden**, **niemandem**) but are often left bare: **Ich habe niemand(en) gesehen.**

        **etwas / nichts + adjective as a noun**, with **-es** and a capital: **etwas Neues** "something new", **nichts Besonderes** "nothing special".

        **einer / eine / eins** and **keiner / keine / keins** stand for a noun just mentioned: **Hast du einen Stift? — Ja, ich habe einen. / Nein, ich habe keinen.**

        **man** is the general "you / people": **Hier darf man nicht rauchen.** It takes the verb of **er**, and in the accusative and dative becomes **einen / einem**.
      pt: |
        | alguém | ninguém | algo | nada | todos | tudo |
        |---|---|---|---|---|---|
        | **jemand** | **niemand** | **etwas** (falado **was**) | **nichts** | **alle** (plural) | **alles** |

        **jemand / niemand** podem levar terminação de caso (**jemanden**, **niemandem**), mas muitas vezes ficam sem: **Ich habe niemand(en) gesehen.** "Não vi ninguém."

        **etwas / nichts + adjetivo substantivado**, com **-es** e maiúscula: **etwas Neues** "algo novo", **nichts Besonderes** "nada de especial".

        **einer / eine / eins** e **keiner / keine / keins** substituem um substantivo já citado: **Hast du einen Stift? — Ja, ich habe einen. / Nein, ich habe keinen.** "Tem uma caneta? — Tenho. / Não tenho."

        **man** é o "a gente / se" geral: **Hier darf man nicht rauchen.** "Aqui não se pode fumar." Usa o verbo de **er**; no acusativo e dativo vira **einen / einem**.
    mistakes:
    - wrong: "Ich habe nicht nichts gesagt."
      right: "Ich habe nichts gesagt."
      why: {en: "nichts and niemand already negate: no second nicht (unlike Portuguese 'não disse nada').", pt: "nichts e niemand já negam: sem outro nicht (diferente do português 'não disse nada')."}
    - wrong: "etwas neu"
      right: "etwas Neues"
      why: {en: "After etwas / nichts the adjective becomes a neuter noun: capital and -es.", pt: "Depois de etwas / nichts o adjetivo vira substantivo neutro: maiúscula e -es."}
    examples:
    - ["Ist hier jemand?", "Is anyone here?", "Tem alguém aqui?", "jemand"]
    - ["Niemand hat angerufen.", "Nobody called.", "Ninguém ligou.", "Niemand"]
    - ["Möchtest du etwas trinken?", "Would you like something to drink?", "Quer beber alguma coisa?", "etwas"]
    - ["Ich habe heute nichts gemacht.", "I did nothing today.", "Não fiz nada hoje.", "nichts"]
    match: {seq: [{word: [jemand, jemanden, jemandem, niemand, niemanden, niemandem, etwas, nichts, alles, Niemand, Jemand]}]}
    pool: [jemand, niemand, etwas, nichts, alles, alle, man]

  - id: de-a2-connector-adverbs
    title: deshalb, trotzdem, dann
    meaning: {en: "linking adverbs: deshalb, deswegen, trotzdem, dann, danach, sonst — the verb comes right after", pt: "advérbios de ligação: deshalb, deswegen, trotzdem, dann, danach, sonst — o verbo vem logo depois"}
    intro:
      en: |
        These words link two main clauses. They are adverbs, not conjunctions: they take the **first place** themselves, so the **verb comes right after them**:

        - **deshalb / deswegen / darum** "that's why": **Ich bin krank, deshalb bleibe ich zu Hause.**
        - **trotzdem** "even so": **Es regnet, trotzdem gehen wir spazieren.**
        - **dann / danach** "then / after that": **Zuerst esse ich, dann gehe ich.**
        - **sonst** "otherwise": **Beeil dich, sonst verpassen wir den Zug.**
        - **also** "so, therefore" (not English "also" — that is **auch**).

        Compare the conjunctions: **weil** sends the verb to the end (**…, weil ich krank bin**), **denn / aber / und** leave the order alone (**…, denn ich bin krank**).
      pt: |
        Estas palavras ligam duas orações principais. São advérbios, não conjunções: ocupam elas mesmas a **primeira posição**, então o **verbo vem logo depois**:

        - **deshalb / deswegen / darum** "por isso": **Ich bin krank, deshalb bleibe ich zu Hause.**
        - **trotzdem** "mesmo assim": **Es regnet, trotzdem gehen wir spazieren.**
        - **dann / danach** "então / depois": **Zuerst esse ich, dann gehe ich.**
        - **sonst** "senão": **Beeil dich, sonst verpassen wir den Zug.**
        - **also** "então, portanto" (não é o "also" inglês, que é **auch**).

        Compare com as conjunções: **weil** manda o verbo para o fim (**…, weil ich krank bin**), **denn / aber / und** não mexem na ordem (**…, denn ich bin krank**).
    mistakes:
    - wrong: "Ich bin müde, deshalb ich gehe ins Bett."
      right: "Ich bin müde, deshalb gehe ich ins Bett."
      why: {en: "deshalb fills the first place; the verb comes second, then the subject.", pt: "deshalb ocupa a primeira posição; o verbo vem em segundo, depois o sujeito."}
    examples:
    - ["Der Bus kommt nicht, deshalb nehmen wir ein Taxi.", "The bus isn't coming, so we're taking a taxi.", "O ônibus não vem, por isso vamos de táxi.", "deshalb"]
    - ["Ich habe keine Zeit, trotzdem helfe ich dir.", "I have no time; even so, I'll help you.", "Não tenho tempo; mesmo assim, te ajudo.", "trotzdem"]
    - ["Zieh eine Jacke an, sonst frierst du.", "Put a jacket on, otherwise you'll be cold.", "Põe um casaco, senão você vai passar frio.", "sonst"]
    match: {seq: [{word: [deshalb, deswegen, darum, trotzdem, sonst, danach]}, {pos: verb}], gap: 0}
    pool: [deshalb, trotzdem, sonst, dann, weil, denn, aber]
