# Macedonian text of the German written B2 level — translated by AI (Claude) from the English (2026-10-20)
topics:
  Two-part connectors: "Дводелни сврзници"
  The passive and its alternatives: "Пасивот и неговите замени"
  Time and supposition: "Време и претпоставка"
  Prepositions and participles: "Предлози и партиципи"
lessons:
  de-b2-je-desto:
    meaning: "колку повеќе …, толку повеќе …: je … desto / umso"
    intro: |
      **je** + компаратив отвора зависна реченица (глаголот на крај); **desto** или **umso** + компаратив ја отвора главната (глаголот веднаш по нив):

      **Je älter er wird, desto ruhiger wird er.** „Колку е постар, толку е помирен.“

      **Je mehr du übst, umso besser spielst du.** „Колку повеќе вежбаш, толку подобро свириш.“

      Кратка форма без глаголи: **je früher, desto besser** „колку побрзо, толку подобро“.
    mistakes: ["desto + компаратив го зафаќаат првото место; глаголот доаѓа веднаш по нив."]
  de-b2-weder-noch:
    meaning: "ни … ни, или … или, и … и"
    intro: |
      Три пара што сврзуваат два збора или израза од ист вид:

      - **weder … noch** „ни … ни“: **Ich trinke weder Kaffee noch Tee.**
      - **entweder … oder** „или … или“: **Entweder du kommst mit, oder du bleibst hier.**
      - **sowohl … als auch** „и … и“: **Sie spricht sowohl Deutsch als auch Englisch.**

      **weder … noch** веќе негира: без **nicht** или **kein** покрај него — за разлика од македонското *не пијам ни кафе ни чај*.
  de-b2-nicht-nur:
    meaning: "не само … туку и; навистина … но"
    intro: |
      **nicht nur … sondern auch** додава втора, посилна точка: **Er ist nicht nur klug, sondern auch fleißig.** „Тој не е само паметен, туку и вреден.“

      **zwar … aber** признава нешто, па го ограничува: **Das Hotel ist zwar teuer, aber sehr schön.** „Хотелот е навистина скап, но многу убав.“

      **sondern** следи по негација; **aber** по признавање: никогаш **nicht nur … aber auch**.
  de-b2-correlates:
    meaning: "da-зборови што најавуваат реченица: Ich freue mich darauf, dass …"
    intro: |
      Глагол со фиксен предлог (**sich freuen auf, denken an, sprechen über**) го задржува предлогот кога предметот е цела реченица: предлогот се спојува со **da(r)-** и ја најавува реченицата со **dass** или инфинитивот со **zu**:

      - **Ich freue mich darauf, dich zu sehen.** „Се радувам што ќе те видам.“
      - **Denk daran, dass morgen Feiertag ist.** „Сети се дека утре е празник.“
      - **Es kommt darauf an, ob es regnet.** „Зависи од тоа дали ќе врне.“

      Предлогот ја одредува формата: **auf → darauf, an → daran, über → darüber, von → davon, für → dafür, mit → damit, um → darum**.
  de-b2-zustandspassiv:
    meaning: "пасив на состојба: sein + партицип"
    intro: |
      **werden** + партицип е процесот (*нешто се прави*); **sein** + партицип е резултатната состојба (*направено е*):

      - **Die Tür wird geschlossen.** „Вратата се затвора.“
      - **Die Tür ist geschlossen.** „Вратата е затворена.“

      **Das Geschäft ist sonntags geschlossen. Der Tisch ist reserviert. Rauchen ist hier verboten.** Минатото е **war**: **Das Fenster war geöffnet.**
  de-b2-sein-zu:
    meaning: "sein + zu + инфинитив: може / мора да се направи"
    intro: |
      **sein + zu + инфинитив** е пасив со модално значење, *може* или *мора* да се направи, според контекстот:

      - **Das ist nicht zu ändern.** „Тоа не може да се промени.“
      - **Die Rechnung ist sofort zu bezahlen.** „Сметката треба веднаш да се плати.“
      - **Das Problem ist leicht zu lösen.** „Проблемот лесно се решава.“

      Неговиот активен пар е **haben + zu**, *треба да*: **Ich habe noch viel zu tun.** „Имам уште многу да правам.“
  de-b2-bar:
    meaning: "придавки на -bar: може да се направи"
    intro: |
      **-bar** на глаголска основа прави придавка со значење *може да се …*, краток пасив — како македонското **-лив**: **machbar** (изводлив), **essbar** (јадлив), **lesbar** (читлив), **erreichbar** (достапен), **vergleichbar** (споредлив). **un-** негира: **unlesbar, unvorstellbar** (незамислив), **unbezahlbar** (неплатежлив, бесценет).

      **Ist das machbar?** = **Kann das gemacht werden?** Некои зборови на -bar се стари и не се пасивни: **dankbar, wunderbar, furchtbar**.
  de-b2-modal-passive:
    meaning: "пасивот со модален глагол"
    intro: |
      Модален + партицип + **werden** (пасивен инфинитив): **Das Auto muss repariert werden.** „Колата мора да се поправи.“ **Hier darf nicht geraucht werden.** „Тука не смее да се пуши.“ **Das kann nicht bewiesen werden.** „Тоа не може да се докаже.“

      Во зависна реченица модалниот оди сосема на крајот: **…, weil das Auto repariert werden muss.**
  de-b2-futur2:
    meaning: "Futur II: ќе има направено; мора да направил"
    intro: |
      **werden + партицип + haben / sein**:

      - нешто завршено до момент во иднината: **Bis Montag werde ich das Buch gelesen haben.** „До понеделник ќе ја имам прочитано книгата.“
      - многу почесто, претпоставка за минатото: **Er wird den Zug verpasst haben.** „Ќе да го пропуштил возот.“ **Sie wird schon nach Hause gegangen sein.** „Веројатно веќе си отишла дома.“

      **haben** или **sein** како во перфектот.
  de-b2-werden-guess:
    meaning: "werden + инфинитив за претпоставка за сега"
    intro: |
      **werden** + инфинитив често не е идно, туку претпоставка за сегашноста, обично со **wohl, schon, sicher, bestimmt, wahrscheinlich**:

      **Er wird wohl krank sein.** „Ќе да е болен.“ **Das wird schon stimmen.** „Веројатно е точно.“ **Sie wird jetzt im Büro sein.** „Сега ќе да е во канцеларија.“
  de-b2-genitive-prepositions:
    meaning: "уште предлози со генитив"
    intro: |
      Покрај **wegen, trotz, während**, пишаниот германски има многу предлози со генитив:

      - причина: **aufgrund** (поради), **infolge** (како последица на), **dank** (благодарение на)
      - место и време: **innerhalb** (внатре, во рок од), **außerhalb** (надвор од), **oberhalb / unterhalb** (над / под)
      - други: **anstatt / statt** (наместо), **angesichts** (со оглед на), **bezüglich / hinsichtlich** (во врска со), **mithilfe** (со помош на), **laut** (според)

      **Aufgrund des Wetters fällt das Spiel aus. Innerhalb einer Woche.** Во говорот многу земаат датив: **wegen dem Wetter**.
  de-b2-participle-adjectives:
    meaning: "партиципите како придавки"
    intro: |
      Двата партиципа можат да стојат пред именка и да земат придавски наставки:

      - **Partizip I** (инфинитив + **-d**): нешто што се случува, активно — како македонското **-чки**: **das schlafende Kind** „заспаното (спиечкото) дете“, **kochendes Wasser** „врела вода“, **in der kommenden Woche** „во следната недела“
      - **Partizip II**: нешто направено, пасивно (или завршено): **die gestohlene Tasche** „украдената чанта“, **ein gebrauchtes Auto** „половна кола“, **das gekochte Ei** „свареното јајце“

      Наставките се обичните придавски наставки: **mit dem schlafenden Kind, eines gebrauchten Autos**.
