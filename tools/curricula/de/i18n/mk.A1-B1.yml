# Macedonian text of the German written A1–B1 lessons — translated by AI (Claude) from the English (2026-10-27)
topics:
  First things: "Први чекори"
  Saying what there is and what you like: "Што има и што сакате"
  Dates and choosing: "Датуми и избор"
  Putting things somewhere: "Ставање работи на место"
  People and things in general; linking sentences: "Луѓе и работи воопшто; поврзување реченици"
  Verbs with a twist: "Глаголи со особености"
  Words built from other words: "Зборови направени од други зборови"
lessons:
  de-a1-alphabet:
    meaning: "азбуката, спелување, ä ö ü ß"
    intro: |
      Германскиот ја користи латиницата плус **ä, ö, ü** и **ß**. Спелувањето имиња на глас е секојдневие: на рецепција, на телефон, во канцеларија.

      Буквите се изговараат: A а, B бе, C це, D де, E е, F еф, G ге, H ха, I и, J јот, K ка, L ел, M ем, N ен, O о, P пе, Q ку, R ер, S ес, T те, U у, V фау, W ве, X икс, Y ипсилон, Z цет, ß есцет.

      **Ä, Ö, Ü** се кажуваат според гласот (a-Umlaut, o-Umlaut, u-Umlaut). Двојните букви: **Doppel-**: **Doppel-L**.

      Гласови што изненадуваат: **w** = в (**Wasser**), **v** = ф (**Vater**), **z** = ц (**Zeit**), **ei** = „ај“ (**mein**), **ie** = долго „и“ (**Bier**), **eu/äu** = „ој“ (**heute**), **sch** = ш, **ch** по a, o, u е грлено х (**Buch**), по другите самогласки е меко (**ich**).
    mistakes: ["V се кажува фау и обично звучи како ф; W се кажува ве и звучи како в."]
  de-a1-numbers:
    meaning: "броеви: броење, цени, возраст, телефонски броеви"
    intro: |
      **0–12** се посебни зборови: null, eins, zwei, drei, vier, fünf, sechs, sieben, acht, neun, zehn, elf, zwölf.

      **13–19**: број + **-zehn**: dreizehn, vierzehn, fünfzehn, **sechzehn** (без s), **siebzehn** (без en), achtzehn, neunzehn.

      **Десетки**: zwanzig, **dreißig** (со ß, не z), vierzig, fünfzig, **sechzig**, **siebzig**, achtzig, neunzig, hundert.

      **21–99 се кажуваат наопаку**, прво единиците, со **und**, сè во еден збор: **einundzwanzig** (еден-и-дваесет), **siebenundvierzig** (47), **neunundneunzig** (99).

      Поголемите броеви го чуваат тој ред внатре: **hundertdreiundzwanzig** (123), **zweitausendfünfhundert** (2.500), **eine Million**.

      **eins** е бројот сам; пред именка е членот **ein / eine**: **eins, zwei, drei** — **ein Kaffee, eine Cola**. Во 21, 31… е **ein-**: **einundzwanzig**.

      Во употреба:
      - возраст: **Ich bin dreißig (Jahre alt).**
      - цени: **Das kostet 3,50 €** — **drei Euro fünfzig**. Запирката ги одвојува децималите, точката илјадниците: **1.000**.
      - телефон: цифра по цифра или во парови; на телефон се вели **zwo** наместо **zwei**, за да не се меша со **drei**.
    mistakes: ["Од 21 до 99 прво доаѓаат единиците, потоа und, потоа десетките.", "Пред именка „еден“ е членот ein/eine/einen, кој добива падежна наставка."]
  de-a1-es-gibt:
    meaning: "има: es gibt + акузатив"
    intro: |
      **es gibt** кажува дека нешто постои или го има — македонското „има“. Секогаш е еднина (**gibt**), а она што го има е во **акузатив**:

      **Es gibt einen Bahnhof.** „Има железничка станица.“ — **einen**, акузатив.

      **Gibt es hier ein Café?** „Има ли тука кафуле?“

      **Es gibt keine Milch mehr.** „Нема веќе млеко.“

      Во минато: **es gab**. **es** оди по глаголот кога нешто друго е на почеток: **Hier gibt es viele Parks.**

      За нешто на точно место германскиот често користи глагол за положба: **Auf dem Tisch liegt ein Buch.** (види глаголи за положба, A2).
    mistakes: ["Она што го воведува es gibt е објект во акузатив: машки род ein → einen.", "gibt останува во еднина и со објект во множина."]
  de-a1-gern:
    meaning: "сакам да правам нешто: gern + глагол, lieber, am liebsten; mögen"
    intro: |
      Германскиот кажува „сакам да правам X“ со глаголот + **gern**: **Ich schwimme gern.** „Сакам да пливам.“ **gern** оди по глаголот и објектот: **Ich spiele gern Fußball.**

      Не сакам: **nicht gern**: **Ich koche nicht gern.**

      Споредба: **gern → lieber → am liebsten**: **Ich trinke gern Tee, lieber Kaffee und am liebsten Kakao.**

      За работи и луѓе — **mögen**: **Ich mag Katzen.** „Ги сакам мачките.“ За активности вообичаено е **Ich schwimme gern**.

      Желбите се **möchte** (би сакал): **Ich möchte einen Tee.** — што сакате сега, а не што ви се допаѓа воопшто.
    mistakes: ["Глаголот останува на второ место; gern доаѓа по него.", "lieber оди со глаголот на активноста; als го воведува она што помалку го сакате."]
  de-a2-dates:
    meaning: "редни броеви и датуми: am ersten Mai, der 3. Oktober"
    intro: |
      **Редните броеви** добиваат **-t-** до 19 и **-st-** од 20, потоа придавска наставка: **der zweite**, **der zwanzigste**. Неправилни: **erste**, **dritte**, **siebte**, **achte**.

      Се пишуваат со точка: **der 3. Oktober** = der dritte Oktober.

      **Кој ден е?** — номинатив: **Heute ist der vierte Mai.** „Денес е четврти мај.“

      **Кога?** — **am** + датив, наставка **-en**: **Ich komme am vierten Mai.** „Доаѓам на четврти мај.“

      Датумот се пишува **4.5.2026** или **4. Mai 2026**: ден, месец, година. Годините до 1999 се кажуваат во стотки (**neunzehnhundertneunzig**), потоа во илјадници (**zweitausendsechsundzwanzig**), без предлог: **Ich bin 1990 geboren.**
    mistakes: ["am е an + dem: редниот број добива дативна наставка -en.", "Година сама не зема предлог (или im Jahr 1990)."]
  de-a2-welcher:
    meaning: "кој? и каков?: welcher, was für ein"
    intro: |
      **welcher / welche / welches** бара избор меѓу познати работи — „кој?“. Завршува како **der / die / das**: **Welchen Zug nimmst du?** (акузатив), **Mit welcher Linie?** (датив).

      **was für ein** прашува за видот: **Was für ein Auto hast du?** — „Каков автомобил?“ Одговор: **ein kleines**. Се менува само **ein**; **für** тука не го одредува падежот: **In was für einem Haus wohnst du?** (датив, поради **in**). Во множина **was für** без ein: **Was für Bücher liest du?**

      **Welche Farbe?** — една од боите пред вас; **Was für eine Farbe?** — каков вид боја воопшто.
    mistakes: ["Предлогот стои напред и го одредува падежот на ein; für не."]
  de-a2-position-verbs:
    meaning: "ставање и стоење: stellen/stehen, legen/liegen, setzen/sitzen, hängen"
    intro: |
      Германскиот кажува како е поставена работата. Секој пар има глагол за **ставање** (движење, **wohin?** → **акузатив**, правилен глагол) и глагол за **стоење таму** (**wo?** → **датив**, неправилен глагол):

      - **stellen** / **stehen** — исправено: шишиња, мебел
      - **legen** / **liegen** — легнато: книги, телефони, луѓе
      - **setzen** / **sitzen** — седнато: луѓе, мачка
      - **hängen** (hat gehängt) / **hängen** (hat gehangen) — обесено: слики, палта

      **Ich stelle die Flasche auf den Tisch.** → **Die Flasche steht auf dem Tisch.**

      **Ich lege das Handy auf das Bett.** → **Das Handy liegt auf dem Bett.**

      Каде македонскиот вели „става“ и „е“, германскиот го бира глаголот според положбата. Одат со предлозите за два падежа (an, auf, hinter, in, neben, über, unter, vor, zwischen): акузатив по глаголот за ставање, датив по глаголот за стоење.
    mistakes: ["Книга што лежи — liegt; stehen е за исправени работи.", "legen е движење (wohin?): акузатив."]
  de-a2-indefinite-pronouns:
    meaning: "неопределени заменки: jemand, niemand, etwas, nichts, alle, man, einer, keiner"
    intro: |
      **jemand** „некој“, **niemand** „никој“, **etwas** (говорно **was**) „нешто“, **nichts** „ништо“, **alle** „сите“, **alles** „сè“.

      **jemand / niemand** можат да добијат падежна наставка (**jemanden**, **niemandem**), но често остануваат без неа: **Ich habe niemand(en) gesehen.**

      **etwas / nichts + придавка како именка**, со **-es** и голема буква: **etwas Neues** „нешто ново“, **nichts Besonderes** „ништо посебно“.

      **einer / eine / eins** и **keiner / keine / keins** заменуваат штотуку спомената именка: **Hast du einen Stift? — Ja, ich habe einen. / Nein, ich habe keinen.**

      **man** е општото „се / човек“: **Hier darf man nicht rauchen.** „Тука не се пуши.“ Зема глагол како **er**.
    mistakes: ["nichts и niemand веќе негираат: без уште едно nicht (за разлика од „не реков ништо“).", "По etwas / nichts придавката станува именка од среден род: голема буква и -es."]
  de-a2-connector-adverbs:
    meaning: "прилози за поврзување: deshalb, deswegen, trotzdem, dann, danach, sonst — глаголот доаѓа веднаш по нив"
    intro: |
      Овие зборови поврзуваат две главни реченици. Тие се прилози, а не сврзници: самите го зафаќаат **првото место**, па **глаголот доаѓа веднаш по нив**:

      - **deshalb / deswegen / darum** „затоа“: **Ich bin krank, deshalb bleibe ich zu Hause.**
      - **trotzdem** „сепак“: **Es regnet, trotzdem gehen wir spazieren.**
      - **dann / danach** „потоа“: **Zuerst esse ich, dann gehe ich.**
      - **sonst** „инаку“: **Beeil dich, sonst verpassen wir den Zug.**
      - **also** „значи, затоа“ (не е англиското „also“ — тоа е **auch**).

      Споредете со сврзниците: **weil** го праќа глаголот на крај (**…, weil ich krank bin**), **denn / aber / und** не го менуваат редот (**…, denn ich bin krank**).
    mistakes: ["deshalb го зафаќа првото место; глаголот е втор, па подметот."]
  de-b1-lassen:
    meaning: "lassen: остава, дозволува и дава нешто да се направи (Ich lasse das Auto reparieren)"
    intro: |
      **lassen** (lässt, ließ, hat gelassen) има три употреби:

      1. **остава** нешто некаде: **Ich lasse den Schirm im Auto.**
      2. **дозволува**, + инфинитив без zu: **Lass mich das machen!** „Пушти ме јас да го направам.“ **Sie lassen die Kinder spielen.**
      3. **дава нешто да се направи** од друг, + инфинитив: **Ich lasse das Auto reparieren.** „Ќе го дадам автомобилот на поправка.“ **Er lässt sich die Haare schneiden.** „Се шиша (кај фризер).“

      Со друг глагол, перфектот го користи инфинитивот **lassen**, а не gelassen: **Ich habe das Auto reparieren lassen.** Во зависна реченица **haben** оди пред двата инфинитива: **…, weil ich das Auto habe reparieren lassen.**

      **Lass uns gehen!** „Ајде да одиме!“
    mistakes: ["Со втор инфинитив перфектот на lassen е инфинитив (двоен инфинитив).", "Друг го прави тоа: lassen + инфинитив, каде македонскиот вели само „се шишав“."]
  de-b1-brauchen-zu:
    meaning: "нема потреба: nicht / nur brauchen + zu, и nicht müssen"
    intro: |
      **Du musst nicht kommen** значи „не мораш да дојдеш“ — не „не смееш“ (тоа е **du darfst nicht**).

      Германскиот често го кажува истото со **nicht brauchen + zu**: **Du brauchst nicht zu kommen.** И со **nur**: **Du brauchst nur anzurufen.** „Само јави се.“

      Без nicht/nur, **brauchen** е обичен глагол со објект: **Ich brauche Hilfe.** „Ми треба помош.“

      Во разговор за минатото: **Er musste nicht kommen.**
    mistakes: ["Забрането е nicht dürfen; nicht müssen само ја отстранува обврската.", "Пишаниот германски го задржува zu со brauchen (во говор често отпаѓа)."]
  de-b1-adjectival-nouns:
    meaning: "придавки како именки: der Bekannte, ein Bekannter, die Deutschen"
    intro: |
      Многу зборови за луѓе се придавки претворени во именки: добиваат голема буква, но **ги задржуваат придавските наставки**:

      - маж: **der Bekannte** / **ein Bekannter**
      - жена: **die Bekannte** / **eine Bekannte**
      - множина: **die Bekannten** / **Bekannte**

      Чести: **der/die Deutsche**, **Erwachsene**, **Verwandte**, **Jugendliche**, **Angestellte**, **Kranke**, **Reisende**, **Vorsitzende**. Датив: **mit meinem Bekannten**, **mit meiner Bekannten**.

      Оние од среден род именуваат поими: **das Gute**, **das Neue**, **etwas Schönes**.

      Не сите националности се такви: **der Deutsche** е придавка-именка, а **der Franzose**, **der Mazedonier** се обични именки.
    mistakes: ["По ein машката придавска наставка е -er."]
  de-b1-einander:
    meaning: "еден со друг: sich, einander, miteinander, voneinander"
    intro: |
      „Еден со друг“ во множина е **sich**: **Wir kennen uns.** „Се познаваме.“ **Sie treffen sich um acht.**

      **einander** го кажува истото без двосмисленост и малку посвечено: **Sie helfen einander.** **Sie lieben sich** може да значи „се сакаат (меѓусебно)“ или „се сакаат самите себе“; **Sie lieben einander** значи само меѓусебно.

      Со предлог германскиот секогаш користи **einander**, напишано заедно: **miteinander** „еден со друг“, **voneinander**, **aufeinander**, **nebeneinander**, **zueinander**: **Wir sprechen miteinander.** **Sie wohnen nebeneinander.**
    mistakes: ["По предлог „еден со друг“ е -einander споено со него."]
