# Arabic text of the German written C2 level — translated by AI (Claude) from the English (2026-10-20)
topics:
  Extended attributes: "النعوت الموسّعة"
  Modality and concession: "الجهة والتسليم"
  Formal register: "الأسلوب الرسمي"
lessons:
  de-c2-extended-participle:
    meaning: "النعت الموسّع باسم الفاعل أو المفعول"
    intro: |
      تضغط الألمانية المكتوبة جملة صلة كاملة بين الأداة والاسم: يأتي اسم الفاعل أو المفعول أخيرًا قبل الاسم مباشرة، وكل ما يتعلق به يسبقه:

      - **die Lehrerin, die von allen geliebt wird → die von allen geliebte Lehrerin** («المعلمة المحبوبة من الجميع»)
      - **der Laden, der seit Jahren leer steht → der seit Jahren leer stehende Laden**
      - **das Haus, das 1900 in Berlin gebaut wurde → das 1900 in Berlin gebaute Haus**

      ولقراءته: جد الأداة، واقفز إلى الاسم الذي تطابقه، ثم اقرأ الكلمات بينهما رجوعًا من اسم الفاعل أو المفعول.
  de-c2-gerundive:
    meaning: "zu + Partizip I: ما يجب / يمكن أن يُفعل"
    intro: |
      **zu** + اسم الفاعل قبل الاسم هي الصيغة النعتية لـ **sein + zu**: *الذي ينبغي أن يُ…*:

      - **die Aufgabe ist zu lösen → die zu lösende Aufgabe** «المهمة الواجب حلّها»
      - **ein nicht zu unterschätzendes Problem** «مشكلة لا يُستهان بها»
      - **die zu erwartenden Kosten** «التكاليف المتوقعة»
  de-c2-participle-phrases:
    meaning: "عبارات ثابتة باسم المفعول"
    intro: |
      بعض أسماء المفعول تتصدّر عبارات قصيرة تعلّق على الجملة كلها:

      - **kurz gesagt** (باختصار)، **genau / streng genommen** (بدقة)، **im Grunde genommen** (في الأساس)، **offen gestanden** (بصراحة)، **ehrlich gesagt** (صدقًا)، **grob gesagt** (تقريبًا)
      - **abgesehen von / davon** (بصرف النظر عن)، **vorausgesetzt, dass** (بشرط أن)، **angenommen, dass** (بافتراض أنّ)
  de-c2-modal-perfect:
    meaning: "الأفعال المساعدة الذاتية عن الماضي: muss gewusst haben، soll gewesen sein"
    intro: |
      التخمين أو النقل عن الماضي يضع المساعد في المضارع والفعل الرئيسي في المصدر التام (اسم المفعول + **haben / sein**):

      - **Er muss es gewusst haben.** «لا بد أنه كان يعرف».
      - **Sie soll sehr reich gewesen sein.** «يُقال إنها كانت غنية جدًا».
      - **Er will nichts gesehen haben.** «يزعم أنه لم يرَ شيئًا».
      - **Das kann nicht gestimmt haben.** «لا يمكن أن يكون ذلك صحيحًا». **Sie dürfte schon angekommen sein.** «لعلها وصلت».

      وقارنه بالماضي الموضوعي **Er musste es wissen** (كان عليه أن يعرف).
  de-c2-concessive:
    meaning: "التسليم في الأسلوب الرسمي"
    intro: |
      إلى جانب **obwohl** و**trotzdem**:

      - أدوات تابعة (الفعل في الآخر): **obgleich، obschon، wenngleich** (مع أنّ)، **selbst wenn / auch wenn** (حتى لو)
      - ظروف (الفعل بعدها مباشرة): **dennoch، gleichwohl، nichtsdestotrotz** (ومع ذلك)
      - **so … auch / wie … auch (immer)** + الفعل في الآخر: **So sehr er sich auch bemühte, es gelang ihm nicht.** «مهما اجتهد لم ينجح».
  de-c2-geschweige:
    meaning: "فضلًا عن، إلا إذا، دون"
    intro: |
      - **geschweige denn** «فضلًا عن»، بعد النفي: **Er kann kaum laufen, geschweige denn rennen.** «بالكاد يمشي، فضلًا عن أن يركض».
      - **es sei denn** «إلا إذا» (Konjunktiv I متجمّد): **Ich komme, es sei denn, es regnet.**
      - **ohne dass / ohne … zu** «دون أن»: **Er ging, ohne dass jemand es merkte.**
      - **(an)statt dass / (an)statt … zu** «بدلًا من أن»: **Statt zu arbeiten, schläft er.**
      - **zu …, als dass** + Konjunktiv II «أكثر … من أن»: **Es ist zu schön, als dass es wahr sein könnte.** «أجمل من أن يكون حقيقيًا».
  de-c2-konj1-formulas:
    meaning: "Konjunktiv I في الأدعية والوصفات والصيغ"
    intro: |
      يبقى Konjunktiv I خارج الكلام المنقول في استعمالات ثابتة:

      - الأدعية والشعارات: **Es lebe die Freiheit!** «تحيا الحرية!» **Gott sei Dank!** «الحمد لله!» **Möge er in Frieden ruhen.** «رحمه الله / فليرقد بسلام».
      - الوصفات والتعليمات القديمة: **Man nehme drei Eier.** «تُؤخذ ثلاث بيضات».
      - الفرضيات في الرياضيات: **Gegeben sei ein Dreieck ABC.** «ليكن ABC مثلثًا».
      - **sei es … sei es** «سواء … أو»: **sei es heute, sei es morgen**
  de-c2-impersonal-passive:
    meaning: "المجهول غير الشخصي: بلا فاعل إطلاقًا"
    intro: |
      الأفعال اللازمة تُبنى للمجهول أيضًا بلا فاعل: المهم هو النشاط وحده. و**es** تملأ الموضع الأول إن لم يكن فيه شيء، وتختفي في غير ذلك:

      - **Es wurde viel gelacht.** = **Gestern wurde viel gelacht.** «ضُحك كثيرًا».
      - **Hier wird nicht geraucht.** «لا يُدخَّن هنا».
      - **Jetzt wird geschlafen!** «والآن إلى النوم!» (أمر حازم)
  de-c2-genitive-verbs:
    meaning: "أفعال وصفات مفعولها في حالة الإضافة"
    intro: |
      قليل من الأفعال، رسمية أو قانونية غالبًا، يأخذ مفعولًا في حالة الإضافة: **gedenken** (أحيا ذكرى)، **bedürfen** (احتاج إلى)، **sich bedienen** (استعان بـ)، **sich enthalten** (امتنع عن)، **sich vergewissern** (تثبّت من)، **sich schämen** (خجل من، قديم)، **jemanden beschuldigen / anklagen** (اتهم أحدًا بـ).

      وكذلك صفات: **sich einer Sache bewusst sein** (واعٍ بـ)، **würdig، schuldig، fähig، sicher، wert** + الإضافة.
  de-c2-formal-prepositions:
    meaning: "حروف جر الأسلوب الإداري"
    intro: |
      تستعمل الألمانية الإدارية والقانونية والأكاديمية حروف جر لا تكاد تُسمع في الكلام:

      - **zwecks** (بغرض) + الإضافة: **zwecks Prüfung**
      - **mittels** (بواسطة) + الإضافة: **mittels eines Schlüssels**
      - **seitens / vonseiten** (من جانب) + الإضافة: **seitens der Regierung**
      - **kraft** (بحكم) + الإضافة: **kraft seines Amtes**
      - **anlässlich** (بمناسبة) + الإضافة، **zugunsten** (لصالح) + الإضافة، **ungeachtet** (بغض النظر عن) + الإضافة
      - **gemäß، entsprechend، zufolge** (وفقًا لـ) + حالة القابل، وكثيرًا بعد الاسم: **dem Gesetz gemäß، dem Bericht zufolge**
