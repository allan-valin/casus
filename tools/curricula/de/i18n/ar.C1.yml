# Arabic text of the German written C1 level — translated by AI (Claude) from the English (2026-10-20)
topics:
  Reported speech in depth: "الكلام المنقول بتعمق"
  Konjunktiv II beyond conditions: "Konjunktiv II خارج الشرط"
  Nominal style: "الأسلوب الاسمي"
  Modal verbs for guesses and claims: "الأفعال المساعدة للتخمين والادعاء"
  More modal particles: "مزيد من الأدوات الكلامية"
lessons:
  de-c1-konj1-past:
    meaning: "Konjunktiv I في الماضي: habe gemacht، sei gegangen"
    intro: |
      للكلام المنقول صيغة ماضية واحدة أيًّا كان الزمن الذي استعمله المتكلم: **habe** أو **sei** + اسم المفعول.

      - «Ich wusste es.» / «Ich habe es gewusst.» → **Er sagte, er habe es gewusst.**
      - «Ich ging nach Hause.» → **Sie sagte, sie sei nach Hause gegangen.**

      وتستعمله الصحف لتنأى بنفسها عن الادعاء: **Der Minister erklärte, er habe davon nichts gewusst.** «صرّح الوزير بأنه لم يكن يعلم شيئًا عن ذلك».
  de-c1-konj1-substitute:
    meaning: "Konjunktiv II حين يشبه Konjunktiv I الإخباري"
    intro: |
      لا يظهر Konjunktiv I بوضوح إلا مع الغائب المفرد (**er habe، er komme**) ومع **sein**. وحيث يطابق الإخباري (**sie haben، wir kommen**) يحلّ محلّه Konjunktiv II:

      - «Wir haben keine Zeit.» → ~~Sie sagten, sie haben keine Zeit~~ → **Sie sagten, sie hätten keine Zeit.**
      - «Wir kommen später.» → **Sie sagten, sie kämen später** (أو **würden später kommen**).
  de-c1-konj1-requests:
    meaning: "الأمر والتمني المنقولان: solle، möge"
    intro: |
      الأمر المنقول يستعمل **sollen** في Konjunktiv I؛ والطلب المهذب أو التمني **mögen**:

      - «Warte!» → **Er sagte, ich solle warten.** «قال لي أن أنتظر».
      - «Kommen Sie bitte herein!» → **Sie bat ihn, er möge hereinkommen.** «طلبت منه أن يدخل».

      والأسئلة المنقولة تحتفظ بأداة الاستفهام أو تأخذ **ob** (هل): **Er fragte, ob ich Zeit habe.**
  de-c1-als-ob:
    meaning: "كأنّ: als ob / als + Konjunktiv II"
    intro: |
      *كأنّ* تأخذ Konjunktiv II، بترتيبين:

      - **als ob / als wenn** + الفعل في الآخر: **Er tut so, als ob er nichts wüsste.**
      - **als** + الفعل بعدها مباشرة: **Er tut so, als wüsste er nichts.** «يتظاهر كأنه لا يعرف شيئًا».

      والماضي: **Sie sah aus, als hätte sie nicht geschlafen.** «بدت كأنها لم تنم».
  de-c1-double-infinitive:
    meaning: "كان ينبغي، كان يمكن: hätte + المصدر + المساعد"
    intro: |
      الفعل المساعد في Konjunktiv II الماضي يأخذ **hätte** ومصدره بدل اسم المفعول (*المصدر المزدوج*):

      - **Du hättest anrufen sollen.** «كان ينبغي أن تتصل».
      - **Wir hätten früher gehen können.** «كان بإمكاننا أن نغادر أبكر».
      - **Das hättest du nicht sagen dürfen.** «ما كان ينبغي أن تقول ذلك».

      وفي الجملة التابعة تأتي **hätte** قبل المصدرين كليهما: **…, dass du hättest anrufen sollen.**
  de-c1-wishes:
    meaning: "التمني غير الواقع: wenn … doch nur، hätte ich bloß"
    intro: |
      التمني المخالف للواقع يأخذ Konjunktiv II والأدوات **doch، nur، bloß**:

      - **Wenn ich doch nur mehr Zeit hätte!** «ليت عندي وقتًا أكثر!»
      - وبلا **wenn** يتقدّم الفعل: **Hätte ich bloß nichts gesagt!** «ليتني لم أقل شيئًا!» **Wäre er doch hier!** «ليته كان هنا!»
  de-c1-inverted-conditions:
    meaning: "الشرط بلا wenn: الفعل أولًا"
    intro: |
      يمكن حذف **wenn**: فيفتتح الفعل الجملة، وكثيرًا ما تبدأ الرئيسية بـ **dann** أو **so**:

      - **Hätte ich das gewusst, wäre ich gekommen.** «لو كنت عرفت ذلك لجئت».
      - **Sollte es regnen, bleiben wir zu Hause.** «إن صادف أن أمطرت بقينا في البيت». (**sollte** = *إن صادف*)
      - **Kommt er heute nicht, (dann) kommt er morgen.**
  de-c1-nominal-genitive:
    meaning: "الأسلوب الاسمي: فعل → اسم + إضافة"
    intro: |
      الألمانية الرسمية (الأخبار والعلم والإدارات) تحوّل الأفعال إلى أسماء والمفعول إلى مضاف إليه — كالمصدر المضاف في العربية:

      - **das Problem lösen → die Lösung des Problems** («حلّ المشكلة»)
      - **Die Stadt baut eine Brücke → der Bau einer Brücke durch die Stadt** (الفاعل يأخذ **durch**)
      - **weil die Preise steigen → wegen des Anstiegs der Preise**

      وسلاسل الإضافة نموذجية: **die Verbesserung der Qualität der Produkte**.
  de-c1-nominal-infinitive:
    meaning: "المصادر أسماءً: beim، zum، vom"
    intro: |
      أي مصدر يمكن أن يكون اسمًا محايدًا (بحرف كبير): **das Lesen، das Rauchen**. ومع حروف الجر المدموجة ينوب عن جملة:

      - **beim** «أثناء»: **Beim Lesen schlafe ich ein.** «أنام أثناء القراءة».
      - **zum** «لـ»: **Das Wasser ist zum Kochen.** «الماء للطبخ». **Das ist zum Lachen.** «هذا مضحك».
      - **vom** «من»: **Ich bin müde vom Laufen.** «أنا متعب من الجري».
      - **ins** مع **kommen / geraten**: **ins Schwitzen kommen** «أخذ يتعرّق»
  de-c1-funktionsverbgefuege:
    meaning: "اسم + فعل خفيف: Funktionsverbgefüge"
    intro: |
      كثيرًا ما تقول الألمانية الرسمية باسم وفعل شبه فارغ ما يقوله فعل بسيط. والاسم يحمل المعنى، فيجب أن يكون الاسم الصحيح:

      | العبارة | الفعل البسيط |
      |---|---|
      | **eine Entscheidung treffen** | entscheiden (قرّر) |
      | **zur Verfügung stellen** | geben، bereitstellen (وفّر) |
      | **in Frage kommen** | möglich sein (كان واردًا) |
      | **Rücksicht nehmen auf** | berücksichtigen (راعى) |
      | **zum Ausdruck bringen** | ausdrücken (عبّر) |
      | **in Kauf nehmen** | akzeptieren (تحمّل) |
      | **eine Rolle spielen** | wichtig sein (أدّى دورًا) |
      | **in Betracht ziehen** | erwägen (أخذ في الحسبان) |
      | **Bescheid sagen / geben** | informieren (أعلم) |
  de-c1-soll-will:
    meaning: "sollen = يُقال؛ wollen = يدّعي"
    intro: |
      يمكن للأفعال المساعدة أن تعبّر عن موقف المتكلم من الخبر بدل الإلزام أو الإرادة (استعمال *ذاتي*):

      - **sollen**: نقلًا عن الغير، *يُقال*: **Er soll sehr reich sein.** «يُقال إنه غني جدًا». **Morgen soll es regnen.** «يُتوقع أن تمطر غدًا».
      - **wollen**: ادعاء الفاعل نفسه، والمتكلم يشكّ فيه: **Sie will ihn gestern gesehen haben.** «تزعم أنها رأته أمس».
  de-c1-durfte:
    meaning: "dürfte، müsste: على الأرجح، يُفترض"
    intro: |
      Konjunktiv II للأفعال المساعدة يدرّج يقين التخمين:

      - **muss**: شبه يقين: **Er muss zu Hause sein, das Licht ist an.**
      - **müsste**: يُفترض أن يكون كذلك: **Der Zug müsste gleich kommen.** «يُفترض أن يصل القطار بعد لحظات».
      - **dürfte**: على الأرجح: **Das dürfte schwierig sein.** «سيكون هذا صعبًا على الأرجح». **Sie dürfte etwa vierzig sein.** «لعلها في الأربعين تقريبًا».
      - **könnte**: ربما: **Das könnte stimmen.**
  de-c1-particles:
    meaning: "أدوات تطمئن وتشكّ وتلحّ"
    intro: |
      إلى جانب **doch، mal، ja، denn** تلوّن هذه الأدوات الجملة:

      - **ruhig** في الأمر: تفضّل، لا تقلق: **Komm ruhig rein!** «تفضّل بالدخول!»
      - **etwa** في السؤال: دهشة، ورجاء أن يكون الجواب *لا*: **Bist du etwa krank?** «لستَ مريضًا، أليس كذلك؟»
      - **schon** تطمئن: **Das wird schon klappen.** «سينجح الأمر، سترى».
      - **auch** في السؤال: للتحقق: **Hast du auch die Tür abgeschlossen?** «أقفلت الباب، أرجو ذلك؟»
      - **eigentlich** في السؤال: لتغيير الموضوع: **Wie alt bist du eigentlich?** «بالمناسبة، كم عمرك؟»
