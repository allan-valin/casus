# Macedonian text of the German written C2 level — translated by AI (Claude) from the English (2026-10-20)
topics:
  Extended attributes: "Проширени атрибути"
  Modality and concession: "Модалност и допусност"
  Formal register: "Официјален регистар"
lessons:
  de-c2-extended-participle:
    meaning: "проширениот партиципски атрибут"
    intro: |
      Пишаниот германски пакува цела релативна реченица меѓу членот и именката: партиципот оди последен, веднаш пред именката, а сѐ што му припаѓа доаѓа пред него:

      - **die Lehrerin, die von allen geliebt wird → die von allen geliebte Lehrerin** („од сите сакана наставничка“)
      - **der Laden, der seit Jahren leer steht → der seit Jahren leer stehende Laden**
      - **das Haus, das 1900 in Berlin gebaut wurde → das 1900 in Berlin gebaute Haus**

      За да го прочиташ: најди го членот, скокни до именката со која се согласува, па читај ги зборовите меѓу нив наназад од партиципот.
  de-c2-gerundive:
    meaning: "zu + Partizip I: што треба / може да се направи"
    intro: |
      **zu** + сегашен партицип пред именка е атрибутивната форма на **sein + zu**: *што треба да се …*:

      - **die Aufgabe ist zu lösen → die zu lösende Aufgabe** „задачата што треба да се реши“
      - **ein nicht zu unterschätzendes Problem** „проблем што не смее да се потцени“
      - **die zu erwartenden Kosten** „очекуваните трошоци“
  de-c2-participle-phrases:
    meaning: "цврсти партиципски изрази"
    intro: |
      Некои партиципи водат кратки изрази што ја коментираат целата реченица:

      - **kurz gesagt** (накратко), **genau / streng genommen** (строго земено), **im Grunde genommen** (во суштина), **offen gestanden** (искрено признавам), **ehrlich gesagt** (искрено кажано), **grob gesagt** (грубо кажано)
      - **abgesehen von / davon** (освен), **vorausgesetzt, dass** (под услов да), **angenommen, dass** (претпоставувајќи дека)
  de-c2-modal-perfect:
    meaning: "субјективни модални за минатото: muss gewusst haben, soll gewesen sein"
    intro: |
      Претпоставка или известување за минатото го става модалниот во сегашно, а главниот глагол во перфектен инфинитив (партицип + **haben / sein**):

      - **Er muss es gewusst haben.** „Мора да знаел.“
      - **Sie soll sehr reich gewesen sein.** „Велат дека била многу богата.“
      - **Er will nichts gesehen haben.** „Тврди дека ништо не видел.“
      - **Das kann nicht gestimmt haben.** „Тоа не можело да е точно.“ **Sie dürfte schon angekommen sein.** „Веројатно веќе стигнала.“

      Спореди го објективното минато **Er musste es wissen** (моравше да знае).
  de-c2-concessive:
    meaning: "допусност во официјален стил"
    intro: |
      Покрај **obwohl** и **trotzdem**:

      - зависни (глагол на крај): **obgleich, obschon, wenngleich** (иако), **selbst wenn / auch wenn** (дури и ако)
      - прилози (глагол веднаш по нив): **dennoch, gleichwohl, nichtsdestotrotz** (сепак)
      - **so … auch / wie … auch (immer)** + глагол на крај: **So sehr er sich auch bemühte, es gelang ihm nicht.** „Колку и да се трудеше, не му успеа.“
  de-c2-geschweige:
    meaning: "а камоли, освен ако, без"
    intro: |
      - **geschweige denn** „а камоли“, по негација: **Er kann kaum laufen, geschweige denn rennen.** „Едвај оди, а камоли да трча.“
      - **es sei denn** „освен ако“ (скаменет Konjunktiv I): **Ich komme, es sei denn, es regnet.**
      - **ohne dass / ohne … zu** „без да“: **Er ging, ohne dass jemand es merkte.**
      - **(an)statt dass / (an)statt … zu** „наместо да“: **Statt zu arbeiten, schläft er.**
      - **zu …, als dass** + Konjunktiv II „премногу … за да“: **Es ist zu schön, als dass es wahr sein könnte.**
  de-c2-konj1-formulas:
    meaning: "Konjunktiv I во желби, рецепти и формули"
    intro: |
      Konjunktiv I опстојува надвор од пренесениот говор во цврсти употреби:

      - желби и пароли — како македонското **да живее**: **Es lebe die Freiheit!** „Да живее слободата!“ **Gott sei Dank!** „Фала му на Бога!“ **Möge er in Frieden ruhen.** „Нека почива во мир.“
      - стари рецепти и упатства: **Man nehme drei Eier.** „Се земаат три јајца.“
      - претпоставки во математиката: **Gegeben sei ein Dreieck ABC.** „Нека е даден триаголник ABC.“
      - **sei es … sei es** „било … било“: **sei es heute, sei es morgen**
  de-c2-impersonal-passive:
    meaning: "безличниот пасив: воопшто без подмет"
    intro: |
      И непреодните глаголи прават пасив, без подмет: важи само дејноста — како македонското **се смееше многу**. **es** го пополнува првото место кога ништо друго не е таму, а инаку исчезнува:

      - **Es wurde viel gelacht.** = **Gestern wurde viel gelacht.** „Многу се смеевме.“
      - **Hier wird nicht geraucht.** „Тука не се пуши.“
      - **Jetzt wird geschlafen!** „Сега се спие!“ (строга наредба)
  de-c2-genitive-verbs:
    meaning: "глаголи и придавки со генитивен предмет"
    intro: |
      Неколку глаголи, главно официјални или правни, земаат генитивен предмет: **gedenken** (оддава почит на), **bedürfen** (има потреба од), **sich bedienen** (се служи со), **sich enthalten** (се воздржува од), **sich vergewissern** (се уверува во), **sich schämen** (се срами од, старо), **jemanden beschuldigen / anklagen** (обвинува некого за).

      И придавки: **sich einer Sache bewusst sein** (свесен за), **würdig, schuldig, fähig, sicher, wert** + генитив.
  de-c2-formal-prepositions:
    meaning: "предлози на службениот стил"
    intro: |
      Канцелариски, правен и академски германски користи предлози што речиси не се слушаат во говорот:

      - **zwecks** (заради) + ген.: **zwecks Prüfung**
      - **mittels** (со помош на) + ген.: **mittels eines Schlüssels**
      - **seitens / vonseiten** (од страна на) + ген.: **seitens der Regierung**
      - **kraft** (по сила на) + ген.: **kraft seines Amtes**
      - **anlässlich** (по повод) + ген., **zugunsten** (во корист на) + ген., **ungeachtet** (без оглед на) + ген.
      - **gemäß, entsprechend, zufolge** (според) + дат., често по именката: **dem Gesetz gemäß, dem Bericht zufolge**
