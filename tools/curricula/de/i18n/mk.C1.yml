# Macedonian text of the German written C1 level — translated by AI (Claude) from the English (2026-10-20)
topics:
  Reported speech in depth: "Пренесен говор подлабоко"
  Konjunktiv II beyond conditions: "Konjunktiv II надвор од условите"
  Nominal style: "Номинален стил"
  Modal verbs for guesses and claims: "Модални глаголи за претпоставки и тврдења"
  More modal particles: "Уште модални честички"
lessons:
  de-c1-konj1-past:
    meaning: "Konjunktiv I во минато: habe gemacht, sei gegangen"
    intro: |
      Пренесениот говор има една мината форма, без оглед на времето што го користел говорителот: **habe** или **sei** + партицип.

      - „Ich wusste es.“ / „Ich habe es gewusst.“ → **Er sagte, er habe es gewusst.**
      - „Ich ging nach Hause.“ → **Sie sagte, sie sei nach Hause gegangen.**

      Весниците го користат за да се оградат од тврдењето — слично на македонското прекажано **знаел**: **Der Minister erklärte, er habe davon nichts gewusst.** „Министерот изјави дека ништо не знаел за тоа.“
  de-c1-konj1-substitute:
    meaning: "Konjunktiv II кога Konjunktiv I личи на индикатив"
    intro: |
      Konjunktiv I јасно се гледа само во 3 лице еднина (**er habe, er komme**) и кај **sein**. Каде личи на индикативот (**sie haben, wir kommen**), го заменува Konjunktiv II:

      - „Wir haben keine Zeit.“ → ~~Sie sagten, sie haben keine Zeit~~ → **Sie sagten, sie hätten keine Zeit.**
      - „Wir kommen später.“ → **Sie sagten, sie kämen später** (или **würden später kommen**).
  de-c1-konj1-requests:
    meaning: "пренесени наредби и желби: solle, möge"
    intro: |
      Пренесена наредба користи **sollen** во Konjunktiv I; учтиво барање или желба, **mögen**:

      - „Warte!“ → **Er sagte, ich solle warten.** „Ми рече да почекам.“
      - „Kommen Sie bitte herein!“ → **Sie bat ihn, er möge hereinkommen.** „Го замоли да влезе.“

      Пренесените прашања го задржуваат прашалниот збор или земаат **ob** (дали): **Er fragte, ob ich Zeit habe.**
  de-c1-als-ob:
    meaning: "како да: als ob / als + Konjunktiv II"
    intro: |
      *Како да* зема Konjunktiv II, со два реда на зборовите:

      - **als ob / als wenn** + глагол на крајот: **Er tut so, als ob er nichts wüsste.**
      - **als** + глагол веднаш по него: **Er tut so, als wüsste er nichts.** „Се прави како да не знае ништо.“

      Минато: **Sie sah aus, als hätte sie nicht geschlafen.** „Изгледаше како да не спиела.“
  de-c1-double-infinitive:
    meaning: "требаше, можеше: hätte + инфинитив + модален"
    intro: |
      Модален глагол во минат Konjunktiv II зема **hätte** и свој инфинитив наместо партицип (*двоен инфинитив*):

      - **Du hättest anrufen sollen.** „Требаше да се јавиш.“
      - **Wir hätten früher gehen können.** „Можевме порано да тргнеме.“
      - **Das hättest du nicht sagen dürfen.** „Не смееше тоа да го кажеш.“

      Во зависна реченица **hätte** доаѓа пред двата инфинитива: **…, dass du hättest anrufen sollen.**
  de-c1-wishes:
    meaning: "нереални желби: wenn … doch nur, hätte ich bloß"
    intro: |
      Желба спротивна на фактите зема Konjunktiv II и честичките **doch, nur, bloß**:

      - **Wenn ich doch nur mehr Zeit hätte!** „Барем да имав повеќе време!“
      - без **wenn**, глаголот оди прв: **Hätte ich bloß nichts gesagt!** „Барем да не кажев ништо!“ **Wäre er doch hier!** „Да беше тој тука!“
  de-c1-inverted-conditions:
    meaning: "услови без wenn: глаголот прв"
    intro: |
      **wenn** може да се испушти: тогаш глаголот ја отвора реченицата, а главната често почнува со **dann** или **so**:

      - **Hätte ich das gewusst, wäre ich gekommen.** „Да го знаев тоа, ќе дојдев.“
      - **Sollte es regnen, bleiben wir zu Hause.** „Ако случајно врне, ќе останеме дома.“ (**sollte** = *ако случајно*)
      - **Kommt er heute nicht, (dann) kommt er morgen.**
  de-c1-nominal-genitive:
    meaning: "номинален стил: глагол → именка + генитив"
    intro: |
      Официјалниот германски (вести, наука, канцеларии) ги претвора глаголите во именки, а предметот во генитив:

      - **das Problem lösen → die Lösung des Problems** („решавањето на проблемот“)
      - **Die Stadt baut eine Brücke → der Bau einer Brücke durch die Stadt** (вршителот зема **durch**)
      - **weil die Preise steigen → wegen des Anstiegs der Preise**

      Типични се низи од генитиви: **die Verbesserung der Qualität der Produkte**.
  de-c1-nominal-infinitive:
    meaning: "инфинитиви како именки: beim, zum, vom"
    intro: |
      Секој инфинитив може да биде именка од среден род (со голема буква): **das Lesen, das Rauchen** — како македонското **читањето, пушењето**. Со споени предлози заменува реченица:

      - **beim** „додека“: **Beim Lesen schlafe ich ein.** „Заспивам додека читам.“
      - **zum** „за“: **Das Wasser ist zum Kochen.** „Водата е за готвење.“ **Das ist zum Lachen.** „Тоа е за смеење.“
      - **vom** „од“: **Ich bin müde vom Laufen.** „Уморен сум од трчање.“
      - **ins** со **kommen / geraten**: **ins Schwitzen kommen** „да почнеш да се потиш“
  de-c1-funktionsverbgefuege:
    meaning: "именка + лесен глагол: Funktionsverbgefüge"
    intro: |
      Официјалниот германски често кажува со именка и речиси празен глагол она што би го кажал прост глагол. Именката го носи значењето, па мора да биде вистинската:

      | израз | прост глагол |
      |---|---|
      | **eine Entscheidung treffen** | entscheiden (одлучува) |
      | **zur Verfügung stellen** | geben, bereitstellen (обезбедува) |
      | **in Frage kommen** | möglich sein (доаѓа предвид) |
      | **Rücksicht nehmen auf** | berücksichtigen (води сметка) |
      | **zum Ausdruck bringen** | ausdrücken (изразува) |
      | **in Kauf nehmen** | akzeptieren (се помирува со) |
      | **eine Rolle spielen** | wichtig sein (игра улога) |
      | **in Betracht ziehen** | erwägen (зема предвид) |
      | **Bescheid sagen / geben** | informieren (известува) |
  de-c1-soll-will:
    meaning: "sollen = велат; wollen = тој тврди"
    intro: |
      Модалните глаголи можат да го изразат ставот на говорителот кон изјавата наместо обврска или волја (*субјективна* употреба):

      - **sollen**: од слушање, *наводно* — како македонското прекажано: **Er soll sehr reich sein.** „Велат дека е многу богат.“ **Morgen soll es regnen.** „Утре наводно ќе врне.“
      - **wollen**: тврдење на самиот подмет, во кое говорителот се сомнева: **Sie will ihn gestern gesehen haben.** „Таа тврди дека го видела вчера.“
  de-c1-durfte:
    meaning: "dürfte, müsste: веројатно, би требало"
    intro: |
      Konjunktiv II на модалните ја степенува сигурноста на претпоставката:

      - **muss**: речиси сигурно: **Er muss zu Hause sein, das Licht ist an.**
      - **müsste**: би требало да е така: **Der Zug müsste gleich kommen.** „Возот би требало да дојде секој момент.“
      - **dürfte**: веројатно: **Das dürfte schwierig sein.** „Тоа веројатно ќе биде тешко.“ **Sie dürfte etwa vierzig sein.** „Веројатно има околу четириесет.“
      - **könnte**: можеби: **Das könnte stimmen.**
  de-c1-particles:
    meaning: "честички што смируваат, се сомневаат, инсистираат"
    intro: |
      Покрај **doch, mal, ja, denn**, овие честички ја обојуваат реченицата:

      - **ruhig** во наредба: слободно, не грижи се: **Komm ruhig rein!** „Слободно влези!“
      - **etwa** во прашање: изненадување, се надеваш на *не*: **Bist du etwa krank?** „Да не си болен?“
      - **schon** смирува: **Das wird schon klappen.** „Ќе успее, ќе видиш.“
      - **auch** во прашање: проверка: **Hast du auch die Tür abgeschlossen?** „Ја заклучи ли вратата, се надевам?“
      - **eigentlich** во прашање: менување тема: **Wie alt bist du eigentlich?** „Впрочем, колку години имаш?“
