# Arabic text of the German written A1–B1 lessons — translated by AI (Claude) from the English (2026-10-27)
topics:
  First things: "الخطوات الأولى"
  Saying what there is and what you like: "ما يوجد وما تحبّ"
  Dates and choosing: "التواريخ والاختيار"
  Putting things somewhere: "وضع الأشياء في مكانها"
  People and things in general; linking sentences: "الناس والأشياء عمومًا؛ ربط الجمل"
  Verbs with a twist: "أفعال لها خصوصيات"
  Words built from other words: "كلمات مبنية من كلمات أخرى"
lessons:
  de-a1-alphabet:
    meaning: "الأبجدية، التهجئة بصوت عالٍ، ä ö ü ß"
    intro: |
      تستعمل الألمانية الأبجدية اللاتينية مع **ä وö وü** و**ß**. تهجئة الأسماء بصوت عالٍ أمر يومي: في الاستقبال، على الهاتف، في الدوائر الرسمية.

      أسماء الحروف: A آ، B بيه، C تسيه، D ديه، E إيه، F إف، G غيه، H ها، I إي، J يوت، K كا، L إل، M إم، N إن، O أو، P بيه، Q كو، R إر، S إس، T تيه، U أو، V فاو، W فيه، X إكس، Y إبسيلون، Z تسِت، ß إستسِت.

      **Ä وÖ وÜ** تُنطق بصوتها (a-Umlaut، o-Umlaut، u-Umlaut). الحرف المضاعف: **Doppel-**: **Doppel-L**.

      أصوات مفاجئة: **w** = ف/v (**Wasser**)، **v** = ف (**Vater**)، **z** = تس (**Zeit**)، **ei** = «آي» (**mein**)، **ie** = ياء طويلة (**Bier**)، **eu/äu** = «أوي» (**heute**)، **sch** = ش، **ch** بعد a وo وu صوت حلقي قريب من الخاء (**Buch**)، وبعد غيرها رقيق (**ich**).
    mistakes: ["V يُسمّى فاو ويُنطق غالبًا فاءً؛ W يُسمّى فيه ويُنطق v."]
  de-a1-numbers:
    meaning: "الأعداد: العدّ والأسعار والعمر وأرقام الهاتف"
    intro: |
      **0–12** كلمات مفردة: null, eins, zwei, drei, vier, fünf, sechs, sieben, acht, neun, zehn, elf, zwölf.

      **13–19**: العدد + **-zehn**: dreizehn, vierzehn, fünfzehn, **sechzehn** (بلا s)، **siebzehn** (بلا en)، achtzehn, neunzehn.

      **العقود**: zwanzig, **dreißig** (بـß لا z)، vierzig, fünfzig, **sechzig**, **siebzig**, achtzig, neunzig, hundert.

      **من 21 إلى 99 تُقال الآحاد أولًا** ثم **und** ثم العشرات، كلها كلمة واحدة — كما في العربية «واحد وعشرون»: **einundzwanzig**، **siebenundvierzig** (47)، **neunundneunzig** (99).

      الأعداد الأكبر تحفظ هذا الترتيب داخلها: **hundertdreiundzwanzig** (123)، **zweitausendfünfhundert** (2500)، **eine Million**.

      **eins** هو العدد وحده؛ وقبل الاسم يصير أداة التنكير **ein / eine**: **eins, zwei, drei** — **ein Kaffee, eine Cola**.

      في الاستعمال:
      - العمر: **Ich bin dreißig (Jahre alt).**
      - الأسعار: **Das kostet 3,50 €** — **drei Euro fünfzig**. الفاصلة للكسور العشرية والنقطة للآلاف: **1.000**.
      - الهاتف: رقمًا رقمًا أو زوجًا زوجًا؛ ويُقال على الهاتف **zwo** بدل **zwei** كي لا يلتبس بـ**drei**.
    mistakes: ["من 21 إلى 99 تأتي الآحاد أولًا ثم und ثم العشرات.", "قبل الاسم يكون «واحد» أداة التنكير ein/eine/einen التي تأخذ علامة الحالة."]
  de-a1-es-gibt:
    meaning: "يوجد: es gibt + حالة النصب (Akkusativ)"
    intro: |
      **es gibt** تقول إن شيئًا موجود أو متوفّر — «يوجد / هناك». هي مفرد دائمًا (**gibt**)، والموجود يأتي في **حالة النصب**:

      **Es gibt einen Bahnhof.** «توجد محطة قطار.» — **einen** في حالة النصب.

      **Gibt es hier ein Café?** «هل يوجد مقهى هنا؟»

      **Es gibt keine Milch mehr.** «لم يعد هناك حليب.»

      في الماضي: **es gab**. وتنتقل **es** بعد الفعل إذا جاء شيء آخر في البداية: **Hier gibt es viele Parks.**
    mistakes: ["ما يأتي بعد es gibt مفعول به في حالة النصب: المذكّر ein → einen.", "تبقى gibt مفردة حتى مع مفعول جمع."]
  de-a1-gern:
    meaning: "تحبّ أن تفعل شيئًا: gern + فعل، lieber، am liebsten؛ mögen"
    intro: |
      تقول الألمانية «أحبّ أن أفعل كذا» بالفعل + **gern**: **Ich schwimme gern.** «أحبّ السباحة.» وتأتي **gern** بعد الفعل ومفعوله: **Ich spiele gern Fußball.**

      عدم الحب: **nicht gern**: **Ich koche nicht gern.**

      المقارنة: **gern → lieber → am liebsten**: **Ich trinke gern Tee, lieber Kaffee und am liebsten Kakao.**

      للأشياء والأشخاص **mögen**: **Ich mag Katzen.** «أحبّ القطط.» وللأنشطة الشائع **Ich schwimme gern**.

      الرغبة الآن **möchte**: **Ich möchte einen Tee.** — ما تريده الآن، لا ما تحبّه عمومًا.
    mistakes: ["يبقى الفعل في المكان الثاني وتأتي gern بعده.", "lieber تأتي مع فعل النشاط، وals تقدّم ما تحبّه أقل."]
  de-a2-dates:
    meaning: "الأعداد الترتيبية والتواريخ: am ersten Mai، der 3. Oktober"
    intro: |
      **الأعداد الترتيبية** تضيف **-t-** حتى 19 و**-st-** من 20، ثم نهاية الصفة: **der zweite**، **der zwanzigste**. الشاذّة: **erste**، **dritte**، **siebte**، **achte**.

      تُكتب بنقطة: **der 3. Oktober** = der dritte Oktober.

      **أيّ يوم؟** — حالة الرفع: **Heute ist der vierte Mai.** «اليوم هو الرابع من مايو.»

      **متى؟** — **am** + حالة الجرّ، بنهاية **-en**: **Ich komme am vierten Mai.** «آتي في الرابع من مايو.»

      يُكتب التاريخ **4.5.2026** أو **4. Mai 2026**: اليوم ثم الشهر ثم السنة. تُقال السنوات حتى 1999 بالمئات (**neunzehnhundertneunzig**) ثم بالآلاف (**zweitausendsechsundzwanzig**)، بلا حرف جرّ: **Ich bin 1990 geboren.**
    mistakes: ["am هي an + dem: يأخذ العدد الترتيبي نهاية الجرّ -en.", "السنة وحدها لا تأخذ حرف جرّ (أو im Jahr 1990)."]
  de-a2-welcher:
    meaning: "أيّ؟ وأيّ نوع؟: welcher، was für ein"
    intro: |
      **welcher / welche / welches** تطلب الاختيار بين أشياء معروفة — «أيّ؟». وتنتهي مثل **der / die / das**: **Welchen Zug nimmst du?** (نصب)، **Mit welcher Linie?** (جرّ).

      **was für ein** تسأل عن النوع: **Was für ein Auto hast du?** — «أيّ نوع من السيارات؟» والجواب: **ein kleines**. يتغيّر **ein** وحده، ولا يحكم **für** هنا حالته: **In was für einem Haus wohnst du?** (جرّ بسبب **in**). وفي الجمع **was für** بلا ein: **Was für Bücher liest du?**
    mistakes: ["حرف الجرّ يأتي في الأول ويحدّد حالة ein، لا für."]
  de-a2-position-verbs:
    meaning: "الوضع والكون في مكان: stellen/stehen، legen/liegen، setzen/sitzen، hängen"
    intro: |
      تقول الألمانية كيف وُضع الشيء. لكل زوج فعل **للوضع** (حركة، **wohin?** ← **نصب**، فعل قياسي) وفعل **للكون هناك** (**wo?** ← **جرّ**، فعل شاذّ):

      - **stellen** / **stehen** — قائمًا: الزجاجات، الأثاث
      - **legen** / **liegen** — مستلقيًا: الكتب، الهواتف، الناس
      - **setzen** / **sitzen** — جالسًا: الناس، قطّة
      - **hängen** (hat gehängt) / **hängen** (hat gehangen) — معلّقًا: الصور، المعاطف

      **Ich stelle die Flasche auf den Tisch.** ← **Die Flasche steht auf dem Tisch.**

      **Ich lege das Handy auf das Bett.** ← **Das Handy liegt auf dem Bett.**

      حيث تقول العربية «وضع» و«كان»، تختار الألمانية الفعل حسب الوضعية. وتأتي مع حروف الجرّ ذات الحالتين (an, auf, hinter, in, neben, über, unter, vor, zwischen): نصب بعد فعل الوضع، وجرّ بعد فعل الكون.
    mistakes: ["الكتاب المستلقي liegt؛ أمّا stehen فللأشياء القائمة.", "legen حركة (wohin?): حالة النصب."]
  de-a2-indefinite-pronouns:
    meaning: "الضمائر المبهمة: jemand، niemand، etwas، nichts، alle، man، einer، keiner"
    intro: |
      **jemand** «أحد»، **niemand** «لا أحد»، **etwas** (في الكلام **was**) «شيء»، **nichts** «لا شيء»، **alle** «الجميع»، **alles** «كل شيء».

      قد تأخذ **jemand / niemand** علامات الحالة (**jemanden**، **niemandem**) لكنها تُترك غالبًا بدونها: **Ich habe niemand(en) gesehen.**

      **etwas / nichts + صفة صارت اسمًا** بـ**-es** وحرف كبير: **etwas Neues** «شيء جديد»، **nichts Besonderes** «لا شيء خاص».

      **einer / eine / eins** و**keiner / keine / keins** تنوب عن اسم ذُكر للتوّ: **Hast du einen Stift? — Ja, ich habe einen. / Nein, ich habe keinen.**

      **man** هي «المرء / الناس» العامة: **Hier darf man nicht rauchen.** «لا يُسمح بالتدخين هنا.» وتأخذ فعل **er**.
    mistakes: ["nichts وniemand نافيتان بذاتهما: لا nicht ثانية.", "بعد etwas / nichts تصير الصفة اسمًا محايدًا: حرف كبير و-es."]
  de-a2-connector-adverbs:
    meaning: "ظروف الربط: deshalb، deswegen، trotzdem، dann، danach، sonst — الفعل بعدها مباشرة"
    intro: |
      تربط هذه الكلمات جملتين رئيسيتين. هي ظروف لا أدوات عطف: تحتلّ هي **المكان الأول**، فيأتي **الفعل بعدها مباشرة**:

      - **deshalb / deswegen / darum** «لذلك»: **Ich bin krank, deshalb bleibe ich zu Hause.**
      - **trotzdem** «ومع ذلك»: **Es regnet, trotzdem gehen wir spazieren.**
      - **dann / danach** «ثم / بعد ذلك»: **Zuerst esse ich, dann gehe ich.**
      - **sonst** «وإلّا»: **Beeil dich, sonst verpassen wir den Zug.**
      - **also** «إذن» (ليست also الإنجليزية، فتلك **auch**).

      قارن بأدوات العطف: **weil** ترسل الفعل إلى الآخر (**…, weil ich krank bin**)، و**denn / aber / und** لا تغيّر الترتيب (**…, denn ich bin krank**).
    mistakes: ["deshalb تحتلّ المكان الأول؛ الفعل ثانيًا ثم الفاعل."]
  de-b1-lassen:
    meaning: "lassen: يترك، يسمح، ويجعل غيره يفعل (Ich lasse das Auto reparieren)"
    intro: |
      لـ**lassen** (lässt, ließ, hat gelassen) ثلاثة استعمالات:

      1. **يترك** شيئًا في مكان: **Ich lasse den Schirm im Auto.**
      2. **يسمح**، + مصدر بلا zu: **Lass mich das machen!** «دعني أفعل ذلك!» **Sie lassen die Kinder spielen.**
      3. **يجعل غيره يفعل** شيئًا، + مصدر: **Ich lasse das Auto reparieren.** «سأُصلح السيارة (عند الميكانيكي).» **Er lässt sich die Haare schneiden.** «يقصّ شعره (عند الحلّاق).»

      مع فعل آخر يستعمل التامّ المصدر **lassen** لا gelassen: **Ich habe das Auto reparieren lassen.** وفي الجملة التابعة تأتي **haben** قبل المصدرين: **…, weil ich das Auto habe reparieren lassen.**

      **Lass uns gehen!** «هيّا بنا!»
    mistakes: ["مع مصدر ثانٍ يكون تامّ lassen مصدرًا (المصدر المزدوج).", "غيرك يفعل ذلك: lassen + مصدر، حيث تقول العربية ببساطة «قصصت شعري»."]
  de-b1-brauchen-zu:
    meaning: "لا داعي: nicht / nur brauchen + zu، وnicht müssen"
    intro: |
      **Du musst nicht kommen** تعني «لستَ مضطرًّا للمجيء» — لا «ممنوع أن تأتي» (تلك **du darfst nicht**).

      كثيرًا ما تقول الألمانية الشيء نفسه بـ**nicht brauchen + zu**: **Du brauchst nicht zu kommen.** ومع **nur**: **Du brauchst nur anzurufen.** «يكفي أن تتصل.»

      بلا nicht/nur تكون **brauchen** فعلًا عاديًّا له مفعول: **Ich brauche Hilfe.** «أحتاج إلى مساعدة.»

      وفي الحديث عن الماضي: **Er musste nicht kommen.**
    mistakes: ["الممنوع nicht dürfen؛ أمّا nicht müssen فيرفع الإلزام فقط.", "الألمانية المكتوبة تُبقي zu مع brauchen (وفي الكلام تسقط كثيرًا)."]
  de-b1-adjectival-nouns:
    meaning: "صفات تُستعمل أسماءً: der Bekannte، ein Bekannter، die Deutschen"
    intro: |
      كثير من الكلمات الدالّة على الناس صفات صارت أسماء: تأخذ حرفًا كبيرًا لكنها **تحتفظ بنهايات الصفة**:

      - رجل: **der Bekannte** / **ein Bekannter**
      - امرأة: **die Bekannte** / **eine Bekannte**
      - جمع: **die Bekannten** / **Bekannte**

      من الشائع: **der/die Deutsche**، **Erwachsene**، **Verwandte**، **Jugendliche**، **Angestellte**، **Kranke**، **Reisende**، **Vorsitzende**. الجرّ: **mit meinem Bekannten**، **mit meiner Bekannten**.

      والمحايدة منها تسمّي المعاني: **das Gute**، **das Neue**، **etwas Schönes**.

      ليست كل الجنسيات كذلك: **der Deutsche** صفة صارت اسمًا، أمّا **der Franzose** و**der Ägypter** فأسماء عادية.
    mistakes: ["بعد ein تكون نهاية الصفة المذكّرة -er."]
  de-b1-einander:
    meaning: "بعضهم بعضًا: sich، einander، miteinander، voneinander"
    intro: |
      «بعضنا بعضًا» في الجمع هي **sich**: **Wir kennen uns.** «نعرف بعضنا.» **Sie treffen sich um acht.**

      **einander** تقول الشيء نفسه بلا لبس وبشيء من الرسمية: **Sie helfen einander.** وقد تعني **Sie lieben sich** «يحبّون بعضهم» أو «يحبّون أنفسهم»؛ أمّا **Sie lieben einander** فلا تعني إلا بعضهم بعضًا.

      مع حرف الجرّ تستعمل الألمانية دائمًا **einander** موصولة به: **miteinander** «مع بعضهم»، **voneinander**، **aufeinander**، **nebeneinander**، **zueinander**: **Wir sprechen miteinander.** **Sie wohnen nebeneinander.**
    mistakes: ["بعد حرف الجرّ تكون «بعضهم بعضًا» -einander موصولة به."]
