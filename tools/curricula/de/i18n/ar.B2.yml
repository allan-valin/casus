# Arabic text of the German written B2 level — translated by AI (Claude) from the English (2026-10-20)
topics:
  Two-part connectors: "أدوات ربط ثنائية"
  The passive and its alternatives: "المبني للمجهول وبدائله"
  Time and supposition: "الزمن والتخمين"
  Prepositions and participles: "حروف الجر وأسماء الفاعل والمفعول"
lessons:
  de-b2-je-desto:
    meaning: "كلما … ازداد …: je … desto / umso"
    intro: |
      **je** + صيغة المقارنة تفتتح جملة تابعة (الفعل في الآخر)؛ و**desto** أو **umso** + صيغة المقارنة تفتتح الرئيسية (الفعل بعدها مباشرة):

      **Je älter er wird, desto ruhiger wird er.** «كلما كبر ازداد هدوءًا».

      **Je mehr du übst, umso besser spielst du.** «كلما تدرّبت أكثر عزفت أفضل».

      والصيغة القصيرة بلا أفعال: **je früher, desto besser** «كلما كان أبكر كان أفضل».
    mistakes: ["desto + صيغة المقارنة تشغلان الموضع الأول؛ والفعل يأتي بعدهما مباشرة."]
  de-b2-weder-noch:
    meaning: "لا … ولا، إمّا … أو، كلٌّ من … و"
    intro: |
      ثلاثة أزواج تربط كلمتين أو عبارتين من نوع واحد:

      - **weder … noch** «لا … ولا»: **Ich trinke weder Kaffee noch Tee.**
      - **entweder … oder** «إمّا … أو»: **Entweder du kommst mit, oder du bleibst hier.**
      - **sowohl … als auch** «كلٌّ من … و»: **Sie spricht sowohl Deutsch als auch Englisch.**

      **weder … noch** نافية بذاتها: فلا **nicht** ولا **kein** بجانبها.
  de-b2-nicht-nur:
    meaning: "ليس فقط … بل أيضًا؛ صحيح أنّ … لكن"
    intro: |
      **nicht nur … sondern auch** تضيف نقطة ثانية أقوى: **Er ist nicht nur klug, sondern auch fleißig.** «ليس ذكيًا فحسب، بل مجتهد أيضًا».

      و**zwar … aber** تُسلّم بنقطة ثم تقيّدها: **Das Hotel ist zwar teuer, aber sehr schön.** «صحيح أن الفندق غالٍ، لكنه جميل جدًا».

      **sondern** تأتي بعد النفي؛ و**aber** بعد التسليم: فلا **nicht nur … aber auch** أبدًا.
  de-b2-correlates:
    meaning: "كلمات da التي تمهّد لجملة: Ich freue mich darauf, dass …"
    intro: |
      الفعل ذو حرف الجر الثابت (**sich freuen auf، denken an، sprechen über**) يحتفظ بحرفه حين يكون مفعوله جملة كاملة: فيتصل الحرف بـ **da(r)-** ويمهّد لجملة **dass** أو للمصدر مع **zu**:

      - **Ich freue mich darauf, dich zu sehen.** «أتطلّع إلى رؤيتك».
      - **Denk daran, dass morgen Feiertag ist.** «تذكّر أن الغد عطلة».
      - **Es kommt darauf an, ob es regnet.** «الأمر يتوقف على ما إذا أمطرت».

      والحرف يحدد الصيغة: **auf → darauf، an → daran، über → darüber، von → davon، für → dafür، mit → damit، um → darum**.
  de-b2-zustandspassiv:
    meaning: "مجهول الحال: sein + اسم المفعول"
    intro: |
      **werden** + اسم المفعول هو العملية (*يُفعل شيء*)؛ و**sein** + اسم المفعول هو الحال الناتجة (*هو مفعول*):

      - **Die Tür wird geschlossen.** «الباب يُغلق».
      - **Die Tür ist geschlossen.** «الباب مغلق».

      **Das Geschäft ist sonntags geschlossen. Der Tisch ist reserviert. Rauchen ist hier verboten.** وماضيه **war**: **Das Fenster war geöffnet.**
  de-b2-sein-zu:
    meaning: "sein + zu + المصدر: يمكن / يجب أن يُفعل"
    intro: |
      **sein + zu + المصدر** مجهول بمعنى الإمكان أو الوجوب بحسب السياق:

      - **Das ist nicht zu ändern.** «هذا لا يمكن تغييره».
      - **Die Rechnung ist sofort zu bezahlen.** «يجب دفع الفاتورة فورًا».
      - **Das Problem ist leicht zu lösen.** «المشكلة سهلة الحل».

      وقرينه المعلوم **haben + zu**، *عليه أن*: **Ich habe noch viel zu tun.** «ما زال عليّ الكثير لأفعله».
  de-b2-bar:
    meaning: "صفات -bar: قابل لأن يُفعل"
    intro: |
      **-bar** على جذر فعل تصنع صفة بمعنى *قابل لـ…*، مجهولًا مختصرًا: **machbar** (ممكن التنفيذ)، **essbar** (صالح للأكل)، **lesbar** (مقروء)، **erreichbar** (يمكن بلوغه)، **vergleichbar** (قابل للمقارنة). و**un-** تنفي: **unlesbar، unvorstellbar** (لا يُتصوَّر)، **unbezahlbar** (باهظ، لا يُقدَّر بثمن).

      **Ist das machbar?** = **Kann das gemacht werden?** وبعض كلمات -bar قديمة وليست مجهولة: **dankbar، wunderbar، furchtbar**.
  de-b2-modal-passive:
    meaning: "المجهول مع الفعل المساعد"
    intro: |
      الفعل المساعد + اسم المفعول + **werden** (المصدر المجهول): **Das Auto muss repariert werden.** «يجب إصلاح السيارة». **Hier darf nicht geraucht werden.** «يُمنع التدخين هنا». **Das kann nicht bewiesen werden.** «هذا لا يمكن إثباته».

      وفي الجملة التابعة يذهب المساعد إلى آخرها تمامًا: **…, weil das Auto repariert werden muss.**
  de-b2-futur2:
    meaning: "المستقبل التام: سيكون قد فعل؛ لا بد أنه فعل"
    intro: |
      **werden + اسم المفعول + haben / sein**:

      - شيء ينتهي قبل لحظة مستقبلية: **Bis Montag werde ich das Buch gelesen haben.** «بحلول الاثنين سأكون قد قرأت الكتاب».
      - والأكثر بكثير: تخمين عن الماضي: **Er wird den Zug verpasst haben.** «لعله فاته القطار». **Sie wird schon nach Hause gegangen sein.** «لعلها عادت إلى البيت».

      **haben** أو **sein** كما في التام.
  de-b2-werden-guess:
    meaning: "werden + المصدر للتخمين عن الحاضر"
    intro: |
      **werden** + المصدر كثيرًا ما لا تكون مستقبلًا بل تخمينًا عن الحاضر، وغالبًا مع **wohl، schon، sicher، bestimmt، wahrscheinlich**:

      **Er wird wohl krank sein.** «لعله مريض». **Das wird schon stimmen.** «لعل هذا صحيح». **Sie wird jetzt im Büro sein.** «لعلها في المكتب الآن».
  de-b2-genitive-prepositions:
    meaning: "مزيد من حروف الجر مع حالة الإضافة"
    intro: |
      إلى جانب **wegen، trotz، während** للألمانية المكتوبة حروف جر كثيرة مع حالة الإضافة:

      - للسبب: **aufgrund** (بسبب)، **infolge** (نتيجةً لـ)، **dank** (بفضل)
      - للمكان والزمان: **innerhalb** (داخل، في غضون)، **außerhalb** (خارج)، **oberhalb / unterhalb** (فوق / تحت)
      - وغيرها: **anstatt / statt** (بدلًا من)، **angesichts** (في ضوء)، **bezüglich / hinsichtlich** (بخصوص)، **mithilfe** (بمساعدة)، **laut** (وفقًا لـ)

      **Aufgrund des Wetters fällt das Spiel aus. Innerhalb einer Woche.** وفي الكلام يأخذ كثير منها حالة القابل: **wegen dem Wetter**.
  de-b2-participle-adjectives:
    meaning: "اسما الفاعل والمفعول صفتين"
    intro: |
      يمكن لكليهما أن يسبق الاسم ويأخذ لواحق الصفة:

      - **Partizip I** (المصدر + **-d**): شيء يحدث، معلوم — كاسم الفاعل: **das schlafende Kind** «الطفل النائم»، **kochendes Wasser** «ماء يغلي»، **in der kommenden Woche** «في الأسبوع القادم»
      - **Partizip II**: شيء فُعل، مجهول (أو منتهٍ) — كاسم المفعول: **die gestohlene Tasche** «الحقيبة المسروقة»، **ein gebrauchtes Auto** «سيارة مستعملة»، **das gekochte Ei** «البيضة المسلوقة»

      واللواحق هي لواحق الصفة العادية: **mit dem schlafenden Kind، eines gebrauchten Autos**.
