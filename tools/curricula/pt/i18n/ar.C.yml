# Arabic text of the Portuguese course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The subjunctive in use: "الالتماسي في الاستعمال"
  Pronouns and placement: "الضمائر ومواضعها"
  Connectors and government: "أدوات الربط والتعدية"
  Literary and formal forms: "الصيغ الأدبية والرسمية"
  Fine points of the norm: "دقائق القاعدة"
  Spoken Brazilian Portuguese: "البرتغالية البرازيلية المحكية"
lessons:
  pt-c1-futuro-subj:
    meaning: "الالتماسي المستقبل"
    intro: |
      تحتفظ البرتغالية بزمن فقدته الإسبانية والفرنسية: الالتماسي المستقبل، بعد **se، quando، assim que، enquanto، onde، quem، o que، como** عن المستقبل: **Se você quiser, eu vou.** «إن شئت ذهبت». **Quando eu puder, te ligo. Faça como achar melhor.** الصياغة: الغائب الجمع في الماضي التام بلا **-am**: **quiseram → quiser، puderam → puder، fizeram → fizer، foram → for، tiveram → tiver**. والأفعال القياسية تشبه المصدر: **falar، comer**.
    mistakes: ["ver → viram → vir."]
  pt-c1-imperfeito-subj:
    meaning: "الالتماسي الناقص"
    intro: |
      من الغائب الجمع في الماضي التام: **tiveram → tivesse، fizeram → fizesse، foram → fosse**. يُستعمل في الشرط غير الواقع (**Se eu tivesse dinheiro, viajaria** «لو كان عندي مال لسافرت»)، وبعد فعل رئيسي ماضٍ (**Ele pediu que eu esperasse**)، وبعد **como se، embora، caso، talvez** في الماضي: **Falava como se fosse o dono.** «كان يتكلم كأنه المالك».
  pt-c1-compostos-subj:
    meaning: "أزمنة الالتماسي المركبة"
    intro: |
      **ter** في الالتماسي + اسم المفعول: **tenha feito** (التام: *Espero que ele tenha chegado*)، **tivesse feito** (البعيد: *Se eu tivesse sabido, teria vindo*)، **tiver feito** (المستقبل التام: *Quando você tiver terminado, me avise*). وفي الكتابة الرسمية قد تحلّ **haver** محلّ **ter**: **houvesse feito**.
  pt-c1-infinitivo-pessoal:
    meaning: "المصدر الشخصي (المتصرّف)"
    intro: |
      خاص بالبرتغالية والغاليسية: يأخذ المصدر لواحق الشخص حين يكون له فاعل خاص: **para eu falar، para nós falarmos، para eles falarem**. وهو شائع بعد حروف الجر والعبارات غير الشخصية: **Antes de vocês saírem, fechem a janela. É melhor irmos embora. Ele trouxe o livro para lermos.** وإذا اتحد فاعله بفاعل الفعل الرئيسي بقي غالبًا بلا تصريف: **Viemos para ajudar.**
  pt-c1-colocacao:
    meaning: "موضع الضمير المتصل: الكلام البرازيلي والقاعدة المكتوبة"
    intro: |
      يضع البرازيليون الضمير قبل الفعل (**próclise**) في الكلام تقريبًا في كل موضع: **Me dá uma água. Ele se levantou.** والقاعدة المكتوبة تمنع بدء الجملة بضمير وتفضّله هناك بعد الفعل (**ênclise**): **Dê-me uma água. Levantou-se cedo.** وكلمات مثل **não، nunca، que، quem، já، também، onde، quando** «تجذب» الضمير إلى ما قبل الفعل في كل المستويات: **Não se preocupe. Quem te disse?**
  pt-c1-lo-la:
    meaning: "ضميرا المفعول o وa بعد الفعل: -lo، -la، -no، -na"
    intro: |
      في الكتابة تتغير ضمائر المفعول **o، a، os، as** بعد لواحق معينة: بعد **-r، -s، -z** تسقط اللاحقة وتصير **-lo، -la**: **comprar + o → comprá-lo**، **fiz + a → fi-la**؛ وبعد الصوت الأنفي تصير **-no، -na**: **dão + o → dão-no**. والكلام يستبدلها بـ **ele / ela** (**Vou comprar ele**) أو يحذفها (**Vou comprar**)، وهذا مقبول في الأسلوب غير الرسمي.
  pt-c1-passiva-sintetica:
    meaning: "المجهول بـ se والمطابقة"
    intro: |
      **الفعل + se** مع شيء فاعلًا: **Vende-se esta casa.** «يُباع هذا البيت». **Alugam-se apartamentos.** والقاعدة المكتوبة تطابق الفعل مع الشيء (**alugam-se apartamentos**)؛ والكلام وكثير من اللافتات يستعمل المفرد (**aluga-se apartamentos**) فيُقرأ غير شخصي. ومع حرف الجر يبقى الفعل مفردًا: **Precisa-se de vendedores.**
  pt-c1-crase:
    meaning: "الدمج (crase): à، às"
    intro: |
      **à** = حرف الجر **a** + أداة التعريف **a**: يظهر قبل الأسماء المؤنثة بعد كلمات تتطلب **a**: **Vou à praia** (ir a + a praia)، **Entreguei o livro à professora**، وفي العبارات الثابتة: **às três horas، à noite، à vontade، à direita، às vezes**. ولا دمج قبل المذكر (**a pé**)، ولا قبل الأفعال (**a partir de**)، ولا قبل **casa** بلا وصف (**Voltei a casa**، في الأسلوب المتأني).
  pt-c1-concessivas:
    meaning: "التسليم: embora، ainda que، mesmo que، se bem que"
    intro: |
      **embora، ainda que، mesmo que، conquanto، posto que** + الالتماسي: **Embora esteja cansado, vou sair.** «مع أني متعب سأخرج». **Mesmo que chova, a festa continua.** و**se bem que** (عامية) تأخذ الإخباري: **É caro, se bem que vale a pena.** و**apesar de** + اسم أو مصدر: **Apesar da chuva, saímos.** ولاحظ: **posto que** في الأسلوب الجيد للتسليم لا للتعليل.
  pt-c1-conectores:
    meaning: "أدوات الربط الرسمية: portanto، contudo، todavia، entretanto"
    intro: |
      الاستدراك: **mas** (محايدة)، **porém، contudo، todavia، entretanto، no entanto** (أرسم، ويمكن أن تتوسط الجملة: *Ele, contudo, não veio*). الاستنتاج: **portanto، logo، por isso، por conseguinte**. التعليل: **pois** (قبل الفعل: *Saia, pois está tarde*)، **porquanto** (أدبية). انتبه: **entretanto** في البرازيل تعني «غير أنّ» لا «في الأثناء».
  pt-c1-regencia:
    meaning: "تعدية الأفعال: assistir a، obedecer a، preferir … a، chegar a"
    intro: |
      بعض الأفعال تتطلب في القاعدة المكتوبة حرف جر يغيّره الكلام أو يحذفه: **assistir a** «شاهد» (**assistir ao filme**؛ عاميًا *assistir o filme*)، **obedecer a**، **preferir X a Y** (لا *mais do que*)، **chegar a** (عاميًا *chegar em*)، **ir a / para**، **visar a** «هدف إلى»، **responder a**، **simpatizar com**، **lembrar-se de / esquecer-se de**، **namorar alguém** (بلا *com* في القاعدة).
  pt-c2-mesoclise:
    meaning: "التوسيط: الضمير داخل المستقبل والشرطي"
    intro: |
      في القاعدة المكتوبة لا يجوز أن يتبع الضمير فعلًا في المستقبل أو الشرطي، ويُتجنّب بدء الجملة به، فيدخل في وسطه بين المصدر واللاحقة: **dir-lhe-ei** «سأقول له»، **far-se-á** «سيُفعل»، **encontrá-lo-ia** «كنت سأجده». ويعيش اليوم في القوانين والخطب والأدب؛ وفي الكلام يقول البرازيليون **vou te dizer، eu te diria**.
  pt-c2-mais-que-perfeito:
    meaning: "الماضي البعيد البسيط (أدبي)"
    intro: |
      بجانب **tinha feito** للبرتغالية الأدبية ماضٍ بعيد بكلمة واحدة: الغائب الجمع في الماضي التام بلا **-am** مع **-a**: **disseram → dissera، fizeram → fizera، tiveram → tivera، chegaram → chegara**. **Quando cheguei, ele já partira** = já tinha partido. ويعيش أيضًا في عبارات ثابتة: **Quem me dera!** «يا ليت!»، **Pudera!** «لا عجب!»، **Quisera eu!**
  pt-c2-tu-vos:
    meaning: "tu وvós: التصريف الكامل، إقليميًا وأدبيًا"
    intro: |
      يستعمل معظم البرازيليين **você** مع فعل الغائب. و**tu** حيّة في الجنوب والشمال وأجزاء من الشمال الشرقي، وغالبًا مع فعل الغائب في الكلام (**tu vai**)، لكن بصيغها الخاصة في الكتابة وفي البرتغال: **tu és، tu tens، tu fizeste، tu foste**. و**vós** (المخاطبون: **vós sois، vós fizestes**) لا تبقى إلا في الصلوات والكتاب المقدس والأدب القديم والخطب المهيبة.
  pt-c2-cujo:
    meaning: "cujo: الذي له، يطابق المملوك"
    intro: |
      **cujo، cuja، cujos، cujas** = «الذي … ـه»، يطابق الاسم الذي يليه، بلا أداة تعريف بعده: **o autor cujo livro li** «المؤلف الذي قرأت كتابه»، **a casa cujas janelas estão quebradas**. وحرف الجر الذي يطلبه الفعل يأتي قبله: **o amigo em cuja casa fiquei**. والكلام يتجنبه بـ **que … dele**، وترفضه القاعدة.
    mistakes: ["لا أداة تعريف بعد cujo."]
  pt-c2-o-qual:
    meaning: "o qual وa qual بعد حروف الجر"
    intro: |
      بعد حرف الجر، ولا سيما ذي المقطعين فأكثر، تستعمل البرتغالية المتأنية **o qual، a qual، os quais، as quais** مدموجة مع الحرف: **a razão pela qual vim**، **o prédio no qual trabalho**، **as pessoas com as quais falei**، **a empresa para a qual trabalho**. وبعد الحروف القصيرة تصح **que** أيضًا: **a casa em que moro**.
  pt-c2-onde-aonde:
    meaning: "onde وaonde وdonde"
    intro: |
      تفرّق القاعدة المكتوبة بين **onde** «أين» مع أفعال الوضع (**Onde você mora?**)، و**aonde** «إلى أين» مع أفعال الحركة التي تأخذ **a** (**Aonde você vai?**)، و**donde / de onde** «من أين» (**De onde você é?**). وفي الكلام تغطي **onde** كل شيء (**Onde você vai?**). وينبغي ألا تعود **onde** إلا على الأماكن، لا على الأزمنة أو المواقف.
  pt-c2-haver-fazer:
    meaning: "haver وfazer غير الشخصيين"
    intro: |
      **haver** بمعنى «يوجد» و**fazer** للزمن المنقضي غير شخصيين: الغائب المفرد دائمًا. **Havia muitas pessoas** (لا ~~haviam~~)، **Houve problemas**، **Faz dois anos que moro aqui** (لا ~~fazem~~). وللزمن الماضي «منذ» تُكتب **há** لا **a**: **Moro aqui há dois anos**؛ و**a** للمستقبل: **daqui a dois anos**. والكلام يستعمل **ter**: **Tinha muita gente.**
    mistakes: ["haver الوجودية غير شخصية: مفرد.", "fazer للزمن المنقضي غير شخصية."]
  pt-c2-participios-duplos:
    meaning: "اسما مفعول: pagado / pago، aceitado / aceito"
    intro: |
      لبعض الأفعال اسما مفعول. والقاعدة التقليدية: القياسي (**-ado / -ido**) مع **ter / haver**، والقصير مع **ser / estar**: **Ele tinha aceitado o convite / O convite foi aceito.** وفي البرازيل انتشرت الصيغ القصيرة مع **ter** أيضًا: **tinha pago، tinha ganho، tinha gasto** عادية؛ **pegado / pego**، **entregado / entregue**، **morrido / morto**، **imprimido / impresso**، **salvado / salvo**، **acendido / aceso**.
  pt-c2-a-gente:
    meaning: "a gente بدل nós"
    intro: |
      في الكلام البرازيلي تحلّ **a gente** «نحن» محلّ **nós** إلى حد كبير، مع فعل الغائب المفرد: **A gente vai ao cinema. A gente se vê amanhã.** وخلطها بفعل **nós** (**a gente vamos**) مستهجن. والملكية: **nosso** أو **da gente**. وفي الكتابة الرسمية استعمل **nós**.
    mistakes: ["a gente تأخذ فعل الغائب المفرد."]
  pt-c2-fala:
    meaning: "الصيغ المختصرة في الكلام: tá، tô، pra، pro"
    intro: |
      تختصر البرتغالية البرازيلية المحكية الكلمات الشائعة جدًا: **estar → tô، tá، tava** (**Tô cansado. Tá bom. Tava chovendo**)، **para → pra، pro (para o)، pras، pros**، **você → cê**، **não é? → né?**. وتظهر في المحادثات والأغاني والحوار في الروايات؛ وفي الكتابة الرسمية تُستعمل الصيغ الكاملة.
