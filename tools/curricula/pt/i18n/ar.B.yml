# Arabic text of the Portuguese course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Past tenses: "أزمنة الماضي"
  Future and commands: "المستقبل والأمر"
  Pronouns in Brazil: "الضمائر في البرازيل"
  The subjunctive begins: "بداية الالتماسي"
  Conditional and hypotheses: "الشرطي والافتراض"
  Voice and periphrases: "البناء والتراكيب الفعلية"
  Linking clauses: "ربط الجمل"
lessons:
  pt-b1-perfeito:
    meaning: "الماضي التام (pretérito perfeito)"
    intro: |
      للأفعال الماضية المنجزة: **-ar**: falei، falou، falamos، falaram؛ **-er**: comi، comeu، comemos، comeram؛ **-ir**: abri، abriu، abrimos، abriram. والشاذ الشائع جدًا: **fui / foi** (يشترك فيه ser وir!)، **tive / teve، fiz / fez، disse، pude، quis، vim / veio، estive، dei، trouxe، soube**. ويستعمله البرازيليون حيث تستعمل الإنجليزية الحاضر التام: **Você já comeu?** (هل أكلت؟).
  pt-b1-imperfeito:
    meaning: "الماضي الناقص"
    intro: |
      للخلفية والعادات والوصف، كـ«كان يفعل»: **-ava** (falava)، **-ia** (comia، abria)؛ والشاذ **era** (ser)، **tinha، vinha، punha**. **Quando eu era criança, morava no Rio.** «حين كنت طفلًا كنت أسكن في ريو». وللطلب المهذب: **Eu queria um café.** «كنت أريد قهوة». والمقابلة: **Eu lia quando ele chegou** (خلفية مقابل حدث).
  pt-b1-tinha-feito:
    meaning: "الماضي البعيد (mais-que-perfeito composto)"
    intro: |
      **tinha** + اسم المفعول لفعل سبق فعلًا ماضيًا آخر، كـ«كان قد»: **Quando cheguei, o filme já tinha começado.** «حين وصلت كان الفيلم قد بدأ». وفي الكلام يحلّ محلّ الصيغة القديمة المفردة (*começara*، C2).
  pt-b1-futuro:
    meaning: "المستقبل"
    intro: |
      في الكلام: **ir + المصدر** (**Vou viajar amanhã** «سأسافر غدًا»). وفي الكتابة والكلام الرسمي: المستقبل البسيط **falarei، falará، falaremos، falarão**؛ والشاذ **farei، direi، trarei**. وكثيرًا ما يكفي المضارع: **Amanhã eu te ligo.** «غدًا أتصل بك».
  pt-b1-imperativo:
    meaning: "الأمر في البرازيل"
    intro: |
      رسميًا (você / o senhor) الأمر هو الالتماسي الحاضر: **Fale mais devagar. Venha cá. Não se preocupe.** وفي الكلام البرازيلي اليومي تُستعمل صيغة *tu* مع *você*: **Fala!، Vem cá!، Olha!** والنهي كذلك في الكلام: **Não fala isso!**
  pt-b1-object-pronouns:
    meaning: "ضمائر المفعول: في الكلام والكتابة"
    intro: |
      الكلام يستعمل صيغة الفاعل أو لا شيء: **Eu vi ele. Você conhece ela? — Conheço.** والكتابة تستعمل **o، a، os، as** (**Eu o vi**)، و**lhe** لـ *لك / له*. و**me، te، nos** تأتي قبل الفعل في البرازيل: **Me ajuda! Ele te ligou.**
  pt-b1-por-para:
    meaning: "por وpara"
    intro: |
      **para** (وغالبًا **pra**): الغاية والوجهة والمستلم والموعد (**Vou pra casa. É para você. Para amanhã.**). و**por**: السبب والوسيلة والعبور والمقابل والفاعل (**por causa de، por telefone، pela janela، por dez reais، escrito por**). **por + o = pelo، pela**.
  pt-b1-pres-subj:
    meaning: "الالتماسي الحاضر"
    intro: |
      بعد التمني والشعور والشك والعبارات غير الشخصية + **que**، كـ«أن + المضارع المنصوب»: **Espero que você venha.** «آمل أن تأتي». **É importante que todos saibam. Talvez chova.** ويُصاغ من المتكلم في المضارع: **falo → fale، faço → faça، tenho → tenha**؛ والشاذ **seja، esteja، vá، dê، saiba، queira، haja**.
  pt-b1-relative:
    meaning: "أسماء الموصول"
    intro: |
      **que** للعاقل وغيره (**o livro que li، a moça que conheci**)، و**quem** بعد حرف الجر للعاقل (**a pessoa com quem falei**)، و**onde** للأماكن (**a cidade onde moro**). وكثيرًا ما يحذف الكلام حرف الجر: *a pessoa que eu falei* (والقاعدة: *com quem*).
  pt-b2-futuro-preterito:
    meaning: "الشرطي (futuro do pretérito)"
    intro: |
      **-ria**: falaria، comeria، abriria؛ والشاذ **faria، diria، traria**. للطلب المهذب (**Você poderia me ajudar?**)، والنتيجة غير الواقعة (**Se eu pudesse, viajaria** «لو استطعت لسافرت»)، والمستقبل منظورًا إليه من الماضي (**Ele disse que viria** «قال إنه سيأتي»). والكلام يستعمل الماضي الناقص بدله كثيرًا: **Se eu pudesse, eu viajava.**
  pt-b2-indirect:
    meaning: "الكلام المنقول"
    intro: |
      بعد فعل قول ماضٍ تتراجع الأزمنة: المضارع → الماضي الناقص (**«Estou cansado» → Ele disse que estava cansado**)، والماضي التام → البعيد (**…que tinha saído**)، والمستقبل → الشرطي (**…que viria**)، والأمر → الالتماسي الناقص (**Ele pediu que eu esperasse**).
  pt-b2-passive:
    meaning: "المبني للمجهول بـ ser"
    intro: |
      **ser** + اسم المفعول (مطابقًا) + **por**: **A casa foi construída em 1900. O livro foi escrito por Machado de Assis.** و**estar** + اسم المفعول هي الحالة الناتجة: **A porta está fechada.** و**ficar** + اسم المفعول = صار: **Fiquei impressionado.**
  pt-b2-periphrases:
    meaning: "التراكيب الفعلية"
    intro: |
      **acabar de** + المصدر (فعل للتو: *Acabei de chegar*)، **voltar a** (عاد إلى: *Voltou a chover*)، **deixar de** (كفّ عن: *Deixei de fumar*)، **começar a** (بدأ)، **continuar** + صيغة الحال (استمر)، **andar** + صيغة الحال (في الآونة الأخيرة: *Ando trabalhando muito*)، **ficar** + صيغة الحال (ظلّ يفعل: *Fiquei esperando*)، **vir** + صيغة الحال (شيئًا فشيئًا).
  pt-b2-conj-subj:
    meaning: "أدوات تطلب الالتماسي"
    intro: |
      **para que** (لكي)، **antes que** (قبل أن)، **sem que** (دون أن)، **caso** (في حال)، **a não ser que / a menos que** (إلا إذا)، **desde que** (شريطة أن): **Fale baixo para que ninguém ouça. Leve o guarda-chuva caso chova.**
  pt-b2-gerund-clauses:
    meaning: "جمل صيغة الحال"
    intro: |
      تحلّ صيغة الحال محلّ جملة زمان أو وسيلة أو سبب أو شرط: **Chegando em casa, liguei para ela** (حين وصلت البيت). **Estudando, você passa** (إن درست). **Tendo terminado, saiu** (بعد أن أنهى).
