# Macedonian text of the Portuguese course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The subjunctive in use: "Конјунктивот во употреба"
  Pronouns and placement: "Заменки и нивното место"
  Connectors and government: "Сврзници и рекција"
  Literary and formal forms: "Книжевни и официјални форми"
  Fine points of the norm: "Финеси на нормата"
  Spoken Brazilian Portuguese: "Говорен бразилски португалски"
lessons:
  pt-c1-futuro-subj:
    meaning: "идниот конјунктив"
    intro: |
      Португалскиот чува време што шпанскиот и францускиот го изгубиле: идниот конјунктив, по **se, quando, assim que, enquanto, onde, quem, o que, como** за иднината: **Se você quiser, eu vou.** „Ако сакаш, ќе одам.“ **Quando eu puder, te ligo. Faça como achar melhor.** Образување: 3 лице множина перфект без **-am**: **quiseram → quiser, puderam → puder, fizeram → fizer, foram → for, tiveram → tiver**. Правилните глаголи изгледаат како инфинитивот: **falar, comer**.
    mistakes: ["ver → viram → vir."]
  pt-c1-imperfeito-subj:
    meaning: "имперфектниот конјунктив"
    intro: |
      Од 3 лице множина перфект: **tiveram → tivesse, fizeram → fizesse, foram → fosse**. Се користи во нереални услови (**Se eu tivesse dinheiro, viajaria** „Да имав пари, би патувал“), по минат главен глагол (**Ele pediu que eu esperasse**) и по **como se, embora, caso, talvez** во минато: **Falava como se fosse o dono.** „Зборуваше како да е газда.“
  pt-c1-compostos-subj:
    meaning: "сложени конјунктивни времиња"
    intro: |
      **ter** во конјунктив + партицип: **tenha feito** (перфект: *Espero que ele tenha chegado*), **tivesse feito** (плусквамперфект: *Se eu tivesse sabido, teria vindo*), **tiver feito** (идно минато: *Quando você tiver terminado, me avise*). Во официјално пишување **haver** може да го замени **ter**: **houvesse feito**.
  pt-c1-infinitivo-pessoal:
    meaning: "личниот (менлив) инфинитив"
    intro: |
      Само во португалскиот и галицискиот: инфинитивот зема лични наставки кога има свој подмет: **para eu falar, para nós falarmos, para eles falarem**. Типично по предлози и безлични изрази: **Antes de vocês saírem, fechem a janela. É melhor irmos embora. Ele trouxe o livro para lermos.** Со ист подмет како главниот глагол обично останува непроменет: **Viemos para ajudar.**
  pt-c1-colocacao:
    meaning: "место на клитиката: говорен бразилски наспроти пишана норма"
    intro: |
      Бразилците во говорот речиси насекаде ја ставаат клитиката пред глаголот (**próclise**) — како македонскиот: **Me dá uma água. Ele se levantou.** Пишаната норма забранува реченица да почне со клитика и таму ја претпочита по глаголот (**ênclise**): **Dê-me uma água. Levantou-se cedo.** Зборови како **não, nunca, que, quem, já, também, onde, quando** ја „привлекуваат“ клитиката пред глаголот во секој регистар: **Não se preocupe. Quem te disse?**
  pt-c1-lo-la:
    meaning: "објектните заменки o, a по глаголот: -lo, -la, -no, -na"
    intro: |
      Во пишувањето објектните заменки **o, a, os, as** се менуваат по одредени наставки: по **-r, -s, -z** наставката отпаѓа и стануваат **-lo, -la**: **comprar + o → comprá-lo**, **fiz + a → fi-la**; по назален глас стануваат **-no, -na**: **dão + o → dão-no**. Говорот ги заменува со **ele / ela** (**Vou comprar ele**) или ги испушта (**Vou comprar**), што е во ред во неформален стил.
  pt-c1-passiva-sintetica:
    meaning: "пасивот со se и согласувањето"
    intro: |
      **глагол + se** со нешто како подмет — како македонското **се продава**: **Vende-se esta casa. Alugam-se apartamentos.** Пишаната норма го согласува глаголот со нештото (**alugam-se apartamentos**); говорот и многу натписи користат еднина (**aluga-se apartamentos**), читано како безлично. Со предлог глаголот останува во еднина: **Precisa-se de vendedores.**
  pt-c1-crase:
    meaning: "краза: à, às"
    intro: |
      **à** = предлог **a** + член **a**: се јавува пред именки од женски род по зборови што бараат **a**: **Vou à praia** (ir a + a praia), **Entreguei o livro à professora**, и во цврсти изрази: **às três horas, à noite, à vontade, à direita, às vezes**. Нема краза пред машки именки (**a pé**), глаголи (**a partir de**) или **casa** без определба (**Voltei a casa**, во грижлив стил).
  pt-c1-concessivas:
    meaning: "допусност: embora, ainda que, mesmo que, se bem que"
    intro: |
      **embora, ainda que, mesmo que, conquanto, posto que** + конјунктив: **Embora esteja cansado, vou sair.** „Иако сум уморен, ќе излезам.“ **Mesmo que chova, a festa continua.** **se bem que** (разговорно) зема индикатив: **É caro, se bem que vale a pena.** **apesar de** + именка или инфинитив: **Apesar da chuva, saímos.** Забележи: **posto que** во добар стил е допусно, не причинско.
  pt-c1-conectores:
    meaning: "официјални сврзници: portanto, contudo, todavia, entretanto"
    intro: |
      Спротивност: **mas** (неутрално), **porém, contudo, todavia, entretanto, no entanto** (пофицијални, можат да се поместат во реченицата: *Ele, contudo, não veio*). Заклучок: **portanto, logo, por isso, por conseguinte**. Објаснување: **pois** (пред глаголот: *Saia, pois está tarde*), **porquanto** (книжевно). Внимание: **entretanto** во Бразил значи „меѓутоа“, не „во меѓувреме“.
  pt-c1-regencia:
    meaning: "рекција на глаголите: assistir a, obedecer a, preferir … a, chegar a"
    intro: |
      Некои глаголи во пишаната норма бараат предлог што говорот често го менува или испушта: **assistir a** „гледа“ (**assistir ao filme**; разговорно *assistir o filme*), **obedecer a**, **preferir X a Y** (не *mais do que*), **chegar a** (разговорно *chegar em*), **ir a / para**, **visar a** „цели кон“, **responder a**, **simpatizar com**, **lembrar-se de / esquecer-se de**, **namorar alguém** (без *com* во нормата).
  pt-c2-mesoclise:
    meaning: "мезоклиза: заменката внатре во идното и условното"
    intro: |
      Во пишаната норма клитиката не смее да стои по глагол во идно или условно, а почеток на реченица со неа се избегнува, па оди внатре, меѓу инфинитивот и наставката: **dir-lhe-ei** „ќе му кажам“, **far-se-á** „ќе се направи“, **encontrá-lo-ia** „би го нашол“. Денес живее во законите, говорите и книжевноста; во говорот Бразилците велат **vou te dizer, eu te diria**.
  pt-c2-mais-que-perfeito:
    meaning: "простиот плусквамперфект (книжевен)"
    intro: |
      Покрај **tinha feito**, книжевниот португалски има еднозборен плусквамперфект: 3 лице множина перфект без **-am** плус **-a**: **disseram → dissera, fizeram → fizera, tiveram → tivera, chegaram → chegara**. **Quando cheguei, ele já partira** = já tinha partido. Живее и во цврсти изрази: **Quem me dera!** „Барем!“, **Pudera!** „Не е ни чудо!“, **Quisera eu!**
  pt-c2-tu-vos:
    meaning: "tu и vós: целосна конјугација, регионално и книжевно"
    intro: |
      Повеќето Бразилци користат **você** со глагол во 3 лице. **tu** е живо на југ, север и делови од североисток, во говорот често со глагол во 3 лице (**tu vai**), но во пишувањето и во Португалија со свои форми: **tu és, tu tens, tu fizeste, tu foste**. **vós** (2 лице множина: **vós sois, vós fizestes**) опстојува само во молитви, Библијата, старата книжевност и свечени говори.
  pt-c2-cujo:
    meaning: "cujo: чиј, согласуван со поседуваното"
    intro: |
      **cujo, cuja, cujos, cujas** = „чиј“, согласувано со следната именка, без член по него: **o autor cujo livro li** „авторот чија книга ја прочитав“, **a casa cujas janelas estão quebradas**. Предлогот што го бара глаголот оди пред него: **o amigo em cuja casa fiquei**. Говорот го избегнува со **que … dele**, што нормата го отфрла.
    mistakes: ["нема член по cujo."]
  pt-c2-o-qual:
    meaning: "o qual, a qual по предлози"
    intro: |
      По предлог, особено дво- или повеќесложен, грижливиот португалски користи **o qual, a qual, os quais, as quais**, споени со предлогот — како **кој, која** по предлог во македонскиот: **a razão pela qual vim**, **o prédio no qual trabalho**, **as pessoas com as quais falei**, **a empresa para a qual trabalho**. По кратки предлози е во ред и **que**: **a casa em que moro**.
  pt-c2-onde-aonde:
    meaning: "onde, aonde, donde"
    intro: |
      Пишаната норма разликува **onde** „каде“ со глаголи на положба (**Onde você mora?**), **aonde** „каде (накај)“ со глаголи на движење што земаат **a** (**Aonde você vai?**) и **donde / de onde** „од каде“ (**De onde você é?**). Во говорот **onde** покрива сè (**Onde você vai?**). **onde** треба да се однесува само на места, не на времиња или ситуации.
  pt-c2-haver-fazer:
    meaning: "безличните haver и fazer"
    intro: |
      **haver** во значење „има“ и **fazer** за изминато време се безлични: секогаш 3 лице еднина — како македонското **има многу луѓе**: **Havia muitas pessoas** (не ~~haviam~~), **Houve problemas**, **Faz dois anos que moro aqui** (не ~~fazem~~). За „пред / веќе“ се пишува **há**, не **a**: **Moro aqui há dois anos**; **a** е за иднината: **daqui a dois anos**. Говорот користи **ter**: **Tinha muita gente.**
    mistakes: ["егзистенцијалното haver е безлично: еднина.", "fazer за изминато време е безлично."]
  pt-c2-participios-duplos:
    meaning: "двојни партиципи: pagado / pago, aceitado / aceito"
    intro: |
      Некои глаголи имаат два партиципа. Традиционалното правило: правилниот (**-ado / -ido**) со **ter / haver**, краткиот со **ser / estar**: **Ele tinha aceitado o convite / O convite foi aceito.** Во Бразил кратките форми се ширеле и со **ter**: **tinha pago, tinha ganho, tinha gasto** се нормални; **pegado / pego**, **entregado / entregue**, **morrido / morto**, **imprimido / impresso**, **salvado / salvo**, **acendido / aceso**.
  pt-c2-a-gente:
    meaning: "a gente наместо nós"
    intro: |
      Во бразилскиот говор **a gente** „ние“ во голема мера го заменува **nós**, со глагол во 3 лице еднина: **A gente vai ao cinema. A gente se vê amanhã.** Мешањето со глагол за **nós** (**a gente vamos**) е стигматизирано. Присвојно: **nosso** или **da gente**. Во официјално пишување користи **nós**.
    mistakes: ["a gente зема глагол во 3 лице еднина."]
  pt-c2-fala:
    meaning: "скратени форми во говорот: tá, tô, pra, pro"
    intro: |
      Говорниот бразилски португалски ги скратува многу честите зборови: **estar → tô, tá, tava** (**Tô cansado. Tá bom. Tava chovendo**), **para → pra, pro (para o), pras, pros**, **você → cê**, **não é? → né?**. Се јавуваат во четови, песни и дијалози во проза; во официјално пишување се користат целосните форми.
