# Macedonian text of the Portuguese course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Past tenses: "Минати времиња"
  Future and commands: "Идно и заповеди"
  Pronouns in Brazil: "Заменките во Бразил"
  The subjunctive begins: "Почеток на конјунктивот"
  Conditional and hypotheses: "Условен начин и хипотези"
  Voice and periphrases: "Залог и перифрази"
  Linking clauses: "Сврзување реченици"
lessons:
  pt-b1-perfeito:
    meaning: "перфектот (pretérito perfeito)"
    intro: |
      Завршени минати дејства — како македонскиот аорист: **-ar**: falei, falou, falamos, falaram; **-er**: comi, comeu, comemos, comeram; **-ir**: abri, abriu, abrimos, abriram. Неправилни и многу чести: **fui / foi** (ser и ir го делат!), **tive / teve, fiz / fez, disse, pude, quis, vim / veio, estive, dei, trouxe, soube**. Бразилците го користат и таму каде англискиот користи present perfect: **Você já comeu?** (Јаде ли веќе?).
  pt-b1-imperfeito:
    meaning: "имперфектот"
    intro: |
      Позадина, навики, опис — како македонското минато несвршено: **-ava** (falava), **-ia** (comia, abria); неправилни **era** (ser), **tinha, vinha, punha**. **Quando eu era criança, morava no Rio.** „Кога бев дете, живеев во Рио.“ И учтиви барања: **Eu queria um café.** „Сакав (би сакал) кафе.“ Спротивност: **Eu lia quando ele chegou** (позадина наспроти настан).
  pt-b1-tinha-feito:
    meaning: "плусквамперфектот (mais-que-perfeito composto)"
    intro: |
      **tinha** + партицип за дејство пред друго минато: **Quando cheguei, o filme já tinha começado.** „Кога стигнав, филмот веќе беше почнал.“ Во говорот ја заменува старата еднозборна форма (*começara*, C2).
  pt-b1-futuro:
    meaning: "идното време"
    intro: |
      Говор: **ir + инфинитив** (**Vou viajar amanhã** „Утре ќе патувам“). Пишување и официјален говор: простото идно **falarei, falará, falaremos, falarão**; неправилни **farei, direi, trarei**. Често е доволно сегашното: **Amanhã eu te ligo.** „Утре ќе ти се јавам.“
  pt-b1-imperativo:
    meaning: "заповедниот начин во Бразил"
    intro: |
      Официјално (você / o senhor) заповедниот е сегашниот конјунктив: **Fale mais devagar. Venha cá. Não se preocupe.** Во секојдневниот бразилски говор се користи формата за *tu* и за *você*: **Fala!, Vem cá!, Olha!** И одречно во говорот: **Não fala isso!**
  pt-b1-object-pronouns:
    meaning: "објектни заменки: говор и пишување"
    intro: |
      Говорот ја користи формата за подмет или ништо: **Eu vi ele. Você conhece ela? — Conheço.** Пишувањето користи **o, a, os, as** (**Eu o vi**), **lhe** за *вас / нему*. **me, te, nos** во Бразил стојат пред глаголот: **Me ajuda! Ele te ligou.**
  pt-b1-por-para:
    meaning: "por и para"
    intro: |
      **para** (често **pra**): цел, насока, примач, рок (**Vou pra casa. É para você. Para amanhã.**). **por**: причина, средство, низ, замена, вршител (**por causa de, por telefone, pela janela, por dez reais, escrito por**). **por + o = pelo, pela**.
  pt-b1-pres-subj:
    meaning: "сегашниот конјунктив"
    intro: |
      По желби, чувства, сомнеж и безлични изрази + **que** — каде македонскиот има **да**: **Espero que você venha.** „Се надевам да дојдеш.“ **É importante que todos saibam. Talvez chova.** Образување од 1 лице сегашно: **falo → fale, faço → faça, tenho → tenha**; неправилни **seja, esteja, vá, dê, saiba, queira, haja**.
  pt-b1-relative:
    meaning: "релативни заменки"
    intro: |
      **que** за луѓе и работи — како **што** (**o livro que li, a moça que conheci**), **quem** по предлог за луѓе (**a pessoa com quem falei**), **onde** за места (**a cidade onde moro**). Говорот често го испушта предлогот: *a pessoa que eu falei* (норма: *com quem*).
  pt-b2-futuro-preterito:
    meaning: "условниот начин (futuro do pretérito)"
    intro: |
      **-ria**: falaria, comeria, abriria; неправилни **faria, diria, traria**. Учтиви барања (**Você poderia me ajudar?**), нереални последици (**Se eu pudesse, viajaria**), иднината гледана од минатото (**Ele disse que viria** „Рече дека ќе дојде“). Говорот често користи имперфект наместо него: **Se eu pudesse, eu viajava.**
  pt-b2-indirect:
    meaning: "пренесен говор"
    intro: |
      По минат глагол на кажување времињата се поместуваат назад: сегашно → имперфект (**„Estou cansado“ → Ele disse que estava cansado**), перфект → плусквамперфект (**…que tinha saído**), идно → условен (**…que viria**), заповеден → имперфект конјунктив (**Ele pediu que eu esperasse**).
  pt-b2-passive:
    meaning: "пасивот со ser"
    intro: |
      **ser** + партицип (согласуван) + **por**: **A casa foi construída em 1900. O livro foi escrito por Machado de Assis.** **estar** + партицип е резултатната состојба: **A porta está fechada.** **ficar** + партицип = станува: **Fiquei impressionado.**
  pt-b2-periphrases:
    meaning: "глаголски перифрази"
    intro: |
      **acabar de** + инф. (штотуку: *Acabei de chegar*), **voltar a** (повторно: *Voltou a chover*), **deixar de** (престана: *Deixei de fumar*), **começar a** (почна), **continuar** + герунд (продолжува), **andar** + герунд (во последно време: *Ando trabalhando muito*), **ficar** + герунд (постојано: *Fiquei esperando*), **vir** + герунд (постепено).
  pt-b2-conj-subj:
    meaning: "сврзници со конјунктив"
    intro: |
      **para que** (за да), **antes que** (пред да), **sem que** (без да), **caso** (во случај да), **a não ser que / a menos que** (освен ако), **desde que** (под услов да): **Fale baixo para que ninguém ouça. Leve o guarda-chuva caso chova.**
  pt-b2-gerund-clauses:
    meaning: "реченици со герунд"
    intro: |
      Герундот заменува реченица за време, средство, причина или услов — како македонското **-јќи**: **Chegando em casa, liguei para ela** (кога стигнав дома). **Estudando, você passa** (ако учиш). **Tendo terminado, saiu** (откако заврши).
