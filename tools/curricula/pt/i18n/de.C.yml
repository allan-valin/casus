# German text of the Portuguese course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The subjunctive in use: "Der Konjunktiv im Gebrauch"
  Pronouns and placement: "Pronomen und ihre Stellung"
  Connectors and government: "Konnektoren und Rektion"
  Literary and formal forms: "Literarische und förmliche Formen"
  Fine points of the norm: "Feinheiten der Norm"
  Spoken Brazilian Portuguese: "Gesprochenes brasilianisches Portugiesisch"
lessons:
  pt-c1-futuro-subj:
    meaning: "der Konjunktiv Futur"
    intro: |
      Das Portugiesische bewahrt ein Tempus, das Spanisch und Französisch verloren haben: den Konjunktiv Futur, nach **se, quando, assim que, enquanto, onde, quem, o que, como** mit Zukunftsbezug: **Se você quiser, eu vou. Quando eu puder, te ligo. Faça como achar melhor.** Bildung: 3. Plural Präteritum minus **-am**: **quiseram → quiser, puderam → puder, fizeram → fizer, foram → for, tiveram → tiver**. Regelmäßige Verben sehen aus wie der Infinitiv: **falar, comer**.
    mistakes: ["ver → viram → vir."]
  pt-c1-imperfeito-subj:
    meaning: "der Konjunktiv Imperfekt"
    intro: |
      Von der 3. Plural Präteritum: **tiveram → tivesse, fizeram → fizesse, foram → fosse**. Gebraucht in irrealen Bedingungen (**Se eu tivesse dinheiro, viajaria**), nach einem Hauptverb in der Vergangenheit (**Ele pediu que eu esperasse**) und nach **como se, embora, caso, talvez** in der Vergangenheit: **Falava como se fosse o dono.** „Er redete, als wäre er der Besitzer.“
  pt-c1-compostos-subj:
    meaning: "zusammengesetzte Konjunktivtempora"
    intro: |
      **ter** im Konjunktiv + Partizip: **tenha feito** (Perfekt: *Espero que ele tenha chegado*), **tivesse feito** (Plusquamperfekt: *Se eu tivesse sabido, teria vindo*), **tiver feito** (Futur II: *Quando você tiver terminado, me avise*). Im förmlichen Schriftgebrauch kann **haver** **ter** ersetzen: **houvesse feito**.
  pt-c1-infinitivo-pessoal:
    meaning: "der persönliche (flektierte) Infinitiv"
    intro: |
      Nur im Portugiesischen und Galicischen: der Infinitiv nimmt Personalendungen, wenn er ein eigenes Subjekt hat: **para eu falar, para nós falarmos, para eles falarem**. Typisch nach Präpositionen und unpersönlichen Ausdrücken: **Antes de vocês saírem, fechem a janela. É melhor irmos embora. Ele trouxe o livro para lermos.** Bei gleichem Subjekt wie das Hauptverb bleibt er meist unflektiert: **Viemos para ajudar.**
  pt-c1-colocacao:
    meaning: "Klitikastellung: gesprochenes Brasilianisch und geschriebene Norm"
    intro: |
      Brasilianer setzen das Klitikon gesprochen fast überall vor das Verb (**próclise**): **Me dá uma água. Ele se levantou.** Die geschriebene Norm verbietet ein Klitikon am Satzanfang und setzt es dort lieber hinter das Verb (**ênclise**): **Dê-me uma água. Levantou-se cedo.** Wörter wie **não, nunca, que, quem, já, também, onde, quando** „ziehen“ das Klitikon in jedem Register vor das Verb: **Não se preocupe. Quem te disse?**
  pt-c1-lo-la:
    meaning: "Objektpronomen o, a nach dem Verb: -lo, -la, -no, -na"
    intro: |
      Schriftlich ändern sich die Objektpronomen **o, a, os, as** nach bestimmten Endungen: nach **-r, -s, -z** fällt die Endung weg und sie werden zu **-lo, -la**: **comprar + o → comprá-lo**, **fiz + a → fi-la**; nach Nasal werden sie zu **-no, -na**: **dão + o → dão-no**. Gesprochen ersetzt man sie durch **ele / ela** (**Vou comprar ele**) oder lässt sie weg (**Vou comprar**), was im lockeren Stil in Ordnung ist.
  pt-c1-passiva-sintetica:
    meaning: "das se-Passiv und die Kongruenz"
    intro: |
      **Verb + se** mit einer Sache als Subjekt: **Vende-se esta casa. Alugam-se apartamentos.** Die geschriebene Norm lässt das Verb mit der Sache kongruieren (**alugam-se apartamentos**); gesprochen und auf vielen Schildern steht der Singular (**aluga-se apartamentos**), als unpersönlich gelesen. Mit Präposition bleibt das Verb im Singular: **Precisa-se de vendedores.**
  pt-c1-crase:
    meaning: "Krasis: à, às"
    intro: |
      **à** = Präposition **a** + Artikel **a**: steht vor femininen Nomen nach Wörtern, die **a** verlangen: **Vou à praia** (ir a + a praia), **Entreguei o livro à professora**, und in festen Wendungen: **às três horas, à noite, à vontade, à direita, às vezes**. Keine Krasis vor maskulinen Nomen (**a pé**), Verben (**a partir de**) oder **casa** ohne Bestimmung (**Voltei a casa**, in sorgfältigem Stil).
  pt-c1-concessivas:
    meaning: "Einräumung: embora, ainda que, mesmo que, se bem que"
    intro: |
      **embora, ainda que, mesmo que, conquanto, posto que** + Konjunktiv: **Embora esteja cansado, vou sair. Mesmo que chova, a festa continua.** **se bem que** (umgangssprachlich) nimmt den Indikativ: **É caro, se bem que vale a pena.** **apesar de** + Nomen oder Infinitiv: **Apesar da chuva, saímos.** Beachte: **posto que** ist in gutem Stil einräumend, nicht begründend.
  pt-c1-conectores:
    meaning: "förmliche Konnektoren: portanto, contudo, todavia, entretanto"
    intro: |
      Gegensatz: **mas** (neutral), **porém, contudo, todavia, entretanto, no entanto** (förmlicher, können im Satz wandern: *Ele, contudo, não veio*). Schluss: **portanto, logo, por isso, por conseguinte**. Erklärung: **pois** (vor dem Verb: *Saia, pois está tarde*), **porquanto** (literarisch). Vorsicht: **entretanto** heißt in Brasilien „jedoch“, nicht „inzwischen“.
  pt-c1-regencia:
    meaning: "Verbrektion: assistir a, obedecer a, preferir … a, chegar a"
    intro: |
      Manche Verben verlangen in der geschriebenen Norm eine Präposition, die gesprochen oft geändert wird oder wegfällt: **assistir a** „ansehen“ (**assistir ao filme**; umgangssprachlich *assistir o filme*), **obedecer a**, **preferir X a Y** (nicht *mais do que*), **chegar a** (umgangssprachlich *chegar em*), **ir a / para**, **visar a** „abzielen auf“, **responder a**, **simpatizar com**, **lembrar-se de / esquecer-se de**, **namorar alguém** (ohne *com* in der Norm).
  pt-c2-mesoclise:
    meaning: "Mesoklise: das Pronomen im Futur und Konditional"
    intro: |
      In der geschriebenen Norm darf ein Klitikon nicht nach einem Verb im Futur oder Konditional stehen, und ein Satzanfang damit wird vermieden, also tritt es hinein, zwischen Infinitiv und Endung: **dir-lhe-ei** „ich werde ihm sagen“, **far-se-á** „es wird getan werden“, **encontrá-lo-ia** „ich würde ihn finden“. Heute lebt es in Gesetzen, Reden und Literatur; gesprochen sagen Brasilianer **vou te dizer, eu te diria**.
  pt-c2-mais-que-perfeito:
    meaning: "das einfache Plusquamperfekt (literarisch)"
    intro: |
      Neben **tinha feito** hat das literarische Portugiesisch ein einteiliges Plusquamperfekt: 3. Plural Präteritum minus **-am** plus **-a**: **disseram → dissera, fizeram → fizera, tiveram → tivera, chegaram → chegara**. **Quando cheguei, ele já partira** = já tinha partido. Es lebt auch in festen Wendungen: **Quem me dera!** „Wenn doch nur!“, **Pudera!** „Kein Wunder!“, **Quisera eu!**
  pt-c2-tu-vos:
    meaning: "tu und vós: volle Konjugation, regional und literarisch"
    intro: |
      Die meisten Brasilianer verwenden **você** mit Verben der 3. Person. **tu** lebt im Süden, im Norden und in Teilen des Nordostens, gesprochen oft mit Verb der 3. Person (**tu vai**), schriftlich und in Portugal aber mit eigenen Formen: **tu és, tu tens, tu fizeste, tu foste**. **vós** (2. Plural: **vós sois, vós fizestes**) überlebt nur in Gebeten, der Bibel, alter Literatur und feierlichen Reden.
  pt-c2-cujo:
    meaning: "cujo: dessen, deren, kongruiert mit dem Besitztum"
    intro: |
      **cujo, cuja, cujos, cujas** = „dessen, deren“, kongruierend mit dem folgenden Nomen, ohne Artikel danach: **o autor cujo livro li**, **a casa cujas janelas estão quebradas**. Eine vom Verb verlangte Präposition steht davor: **o amigo em cuja casa fiquei**. Gesprochen umgeht man es mit **que … dele**, was die Norm ablehnt.
    mistakes: ["kein Artikel nach cujo."]
  pt-c2-o-qual:
    meaning: "o qual, a qual nach Präpositionen"
    intro: |
      Nach einer Präposition, besonders einer zwei- oder mehrsilbigen, nimmt sorgfältiges Portugiesisch **o qual, a qual, os quais, as quais**, verschmolzen mit der Präposition: **a razão pela qual vim**, **o prédio no qual trabalho**, **as pessoas com as quais falei**, **a empresa para a qual trabalho**. Nach kurzen Präpositionen geht auch **que**: **a casa em que moro**.
  pt-c2-onde-aonde:
    meaning: "onde, aonde, donde"
    intro: |
      Die geschriebene Norm unterscheidet **onde** „wo“ bei Verben der Lage (**Onde você mora?**), **aonde** „wohin“ bei Bewegungsverben mit **a** (**Aonde você vai?**) und **donde / de onde** „woher“ (**De onde você é?**). Gesprochen deckt **onde** alles ab (**Onde você vai?**). **onde** sollte sich außerdem nur auf Orte beziehen, nicht auf Zeiten oder Situationen.
  pt-c2-haver-fazer:
    meaning: "unpersönliches haver und fazer"
    intro: |
      **haver** im Sinne von „es gibt“ und **fazer** für vergangene Zeit sind unpersönlich: immer 3. Singular. **Havia muitas pessoas** (nicht ~~haviam~~), **Houve problemas**, **Faz dois anos que moro aqui** (nicht ~~fazem~~). Für „vor / seit“ schreibt man **há**, nicht **a**: **Moro aqui há dois anos**; **a** steht für die Zukunft: **daqui a dois anos**. Gesprochen nimmt man **ter**: **Tinha muita gente.**
    mistakes: ["existenzielles haver ist unpersönlich: Singular.", "fazer für vergangene Zeit ist unpersönlich."]
  pt-c2-participios-duplos:
    meaning: "doppelte Partizipien: pagado / pago, aceitado / aceito"
    intro: |
      Manche Verben haben zwei Partizipien. Die traditionelle Regel: das regelmäßige (**-ado / -ido**) mit **ter / haver**, das kurze mit **ser / estar**: **Ele tinha aceitado o convite / O convite foi aceito.** In Brasilien haben sich die Kurzformen auch mit **ter** verbreitet: **tinha pago, tinha ganho, tinha gasto** sind normal; **pegado / pego**, **entregado / entregue**, **morrido / morto**, **imprimido / impresso**, **salvado / salvo**, **acendido / aceso**.
  pt-c2-a-gente:
    meaning: "a gente für nós"
    intro: |
      Im gesprochenen Brasilianisch ersetzt **a gente** „wir“ weitgehend **nós**, mit Verb in der 3. Person Singular — wie deutsch *man*: **A gente vai ao cinema. A gente se vê amanhã.** Die Mischung mit einem **nós**-Verb (**a gente vamos**) ist stigmatisiert. Possessiv: **nosso** oder **da gente**. Schriftlich und förmlich nimmt man **nós**.
    mistakes: ["a gente nimmt ein Verb in der 3. Person Singular."]
  pt-c2-fala:
    meaning: "verkürzte Formen der Rede: tá, tô, pra, pro"
    intro: |
      Gesprochenes brasilianisches Portugiesisch verkürzt sehr häufige Wörter: **estar → tô, tá, tava** (**Tô cansado. Tá bom. Tava chovendo**), **para → pra, pro (para o), pras, pros**, **você → cê**, **não é? → né?**. Sie erscheinen in Chats, Liedern und Dialogen in Romanen; im förmlichen Schreiben nimmt man die vollen Formen.
