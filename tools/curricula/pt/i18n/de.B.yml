# German text of the Portuguese course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Past tenses: "Vergangenheitstempora"
  Future and commands: "Futur und Imperativ"
  Pronouns in Brazil: "Pronomen in Brasilien"
  The subjunctive begins: "Der Konjunktiv beginnt"
  Conditional and hypotheses: "Konditional und Hypothesen"
  Voice and periphrases: "Diathese und Umschreibungen"
  Linking clauses: "Sätze verbinden"
lessons:
  pt-b1-perfeito:
    meaning: "das Präteritum (pretérito perfeito)"
    intro: |
      Abgeschlossene vergangene Handlungen: **-ar**: falei, falou, falamos, falaram; **-er**: comi, comeu, comemos, comeram; **-ir**: abri, abriu, abrimos, abriram. Unregelmäßig und sehr häufig: **fui / foi** (ser und ir teilen es!), **tive / teve, fiz / fez, disse, pude, quis, vim / veio, estive, dei, trouxe, soube**. Brasilianer verwenden es, wo das Deutsche das Perfekt nimmt: **Você já comeu?** (Hast du schon gegessen?).
  pt-b1-imperfeito:
    meaning: "das Imperfekt"
    intro: |
      Hintergrund, Gewohnheiten, Beschreibung: **-ava** (falava), **-ia** (comia, abria); unregelmäßig **era** (ser), **tinha, vinha, punha**. **Quando eu era criança, morava no Rio.** „Als ich Kind war, wohnte ich in Rio.“ Auch höfliche Bitten: **Eu queria um café.** „Ich hätte gern einen Kaffee.“ Gegensatz: **Eu lia quando ele chegou** (Hintergrund gegenüber Ereignis).
  pt-b1-tinha-feito:
    meaning: "das Plusquamperfekt (mais-que-perfeito composto)"
    intro: |
      **tinha** + Partizip für eine Handlung vor einer anderen vergangenen: **Quando cheguei, o filme já tinha começado.** „Als ich ankam, hatte der Film schon angefangen.“ Gesprochen ersetzt es die alte einteilige Form (*começara*, C2).
  pt-b1-futuro:
    meaning: "das Futur"
    intro: |
      Gesprochen: **ir + Infinitiv** (**Vou viajar amanhã** „Ich verreise morgen“). Schriftlich und förmlich: das einfache Futur **falarei, falará, falaremos, falarão**; unregelmäßig **farei, direi, trarei**. Oft genügt das Präsens: **Amanhã eu te ligo.** „Morgen rufe ich dich an.“
  pt-b1-imperativo:
    meaning: "der Imperativ in Brasilien"
    intro: |
      Förmlich (você / o senhor) ist der Imperativ der Konjunktiv Präsens: **Fale mais devagar. Venha cá. Não se preocupe.** Im brasilianischen Alltag nimmt man die *tu*-Form auch für *você*: **Fala!, Vem cá!, Olha!** Auch verneint gesprochen: **Não fala isso!**
  pt-b1-object-pronouns:
    meaning: "Objektpronomen: gesprochen und geschrieben"
    intro: |
      Gesprochen nimmt man die Subjektform oder nichts: **Eu vi ele. Você conhece ela? — Conheço.** Geschrieben **o, a, os, as** (**Eu o vi**), **lhe** für *Ihnen / ihm*. **me, te, nos** stehen in Brasilien vor dem Verb: **Me ajuda! Ele te ligou.**
  pt-b1-por-para:
    meaning: "por und para"
    intro: |
      **para** (oft **pra**): Ziel, Richtung, Empfänger, Frist (**Vou pra casa. É para você. Para amanhã.**). **por**: Grund, Mittel, durch, Tausch, Urheber (**por causa de, por telefone, pela janela, por dez reais, escrito por**). **por + o = pelo, pela**.
  pt-b1-pres-subj:
    meaning: "der Konjunktiv Präsens"
    intro: |
      Nach Wünschen, Gefühlen, Zweifel und unpersönlichen Ausdrücken + **que**: **Espero que você venha. É importante que todos saibam. Talvez chova.** Gebildet von der 1. Person Präsens: **falo → fale, faço → faça, tenho → tenha**; unregelmäßig **seja, esteja, vá, dê, saiba, queira, haja**.
  pt-b1-relative:
    meaning: "Relativpronomen"
    intro: |
      **que** für Personen und Dinge (**o livro que li, a moça que conheci**), **quem** nach Präposition für Personen (**a pessoa com quem falei**), **onde** für Orte (**a cidade onde moro**). Gesprochen fällt die Präposition oft weg: *a pessoa que eu falei* (Norm: *com quem*).
  pt-b2-futuro-preterito:
    meaning: "der Konditional (futuro do pretérito)"
    intro: |
      **-ria**: falaria, comeria, abriria; unregelmäßig **faria, diria, traria**. Höfliche Bitten (**Você poderia me ajudar?**), irreale Folgen (**Se eu pudesse, viajaria**), das Futur aus Sicht der Vergangenheit (**Ele disse que viria**). Gesprochen steht oft das Imperfekt: **Se eu pudesse, eu viajava.**
  pt-b2-indirect:
    meaning: "indirekte Rede"
    intro: |
      Nach einem Redeverb in der Vergangenheit verschieben sich die Tempora: Präsens → Imperfekt (**„Estou cansado“ → Ele disse que estava cansado**), Präteritum → Plusquamperfekt (**…que tinha saído**), Futur → Konditional (**…que viria**), Imperativ → Konjunktiv Imperfekt (**Ele pediu que eu esperasse**).
  pt-b2-passive:
    meaning: "das Passiv mit ser"
    intro: |
      **ser** + Partizip (kongruierend) + **por**: **A casa foi construída em 1900. O livro foi escrito por Machado de Assis.** **estar** + Partizip ist der Ergebniszustand: **A porta está fechada.** **ficar** + Partizip = werden: **Fiquei impressionado.**
  pt-b2-periphrases:
    meaning: "Verbalperiphrasen"
    intro: |
      **acabar de** + Inf. (gerade getan haben: *Acabei de chegar*), **voltar a** (wieder: *Voltou a chover*), **deixar de** (aufhören: *Deixei de fumar*), **começar a** (anfangen), **continuar** + Gerundium (weiter tun), **andar** + Gerundium (in letzter Zeit tun: *Ando trabalhando muito*), **ficar** + Gerundium (dauernd tun: *Fiquei esperando*), **vir** + Gerundium (allmählich).
  pt-b2-conj-subj:
    meaning: "Konjunktionen mit Konjunktiv"
    intro: |
      **para que** (damit), **antes que** (bevor), **sem que** (ohne dass), **caso** (falls), **a não ser que / a menos que** (es sei denn), **desde que** (vorausgesetzt dass): **Fale baixo para que ninguém ouça. Leve o guarda-chuva caso chova.**
  pt-b2-gerund-clauses:
    meaning: "Gerundialsätze"
    intro: |
      Ein Gerundium ersetzt einen Satz der Zeit, des Mittels, des Grundes oder der Bedingung: **Chegando em casa, liguei para ela** (als ich nach Hause kam). **Estudando, você passa** (wenn du lernst). **Tendo terminado, saiu** (nachdem er fertig war).
