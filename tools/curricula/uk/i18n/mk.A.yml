# Macedonian text of the Ukrainian course, A1–B1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and letters: "Гласови и букви"
  Nouns and gender: "Именки и род"
  Pronouns and the present: "Заменки и сегашното"
  Questions and negation: "Прашања и негација"
  The cases (1): "Падежите (1)"
  Past and future: "Минато и идно"
  Motion: "Движење"
  The cases (2): "Падежите (2)"
  Adjectives and comparison: "Придавки и споредба"
  Clauses: "Реченици"
lessons:
  uk-alphabet:
    meaning: "букви што ги има украинскиот (а рускиот ги нема)"
    intro: |
      Украинската кирилица се разликува од македонската: **и** е глас меѓу *и* и *ъ* (како англиското *bit*), **і** е *и*, **ї** е *ји*, **є** е *је*, **ґ** е тврдо *г* (ретко), а **г** е звучно *х*. **'** (апостроф) ја одделува согласката од следното я, ю, є, ї: **м'ясо** (месо), **сім'я** (семејство). **щ** е *шч*. Нема ѓ, ќ, љ, њ, ѕ, џ, ј — **я, ю, є** се *ја, ју, је*.
  uk-gender:
    meaning: "три рода"
    intro: |
      Машки: завршува на согласка (**стіл, брат, день**); женски: **-а / -я** (**книга, земля**) и некои на мек знак или согласка (**ніч, сіль**); среден: **-о, -е, -я** (**вікно, море, ім'я, життя**). Нема членови — ни на крајот како во македонскиот. **він / вона / воно** = тој / таа / тоа, и за работи според родот.
  uk-plural:
    meaning: "номинатив множина"
    intro: |
      Машки и женски: **-и / -і** (**столи, книги, дні, землі**); среден: **-а / -я** (**вікна, моря**). Некои неправилни: **люди** (луѓе), **діти** (деца), **очі** (очи).
  uk-pronouns:
    meaning: "лични заменки"
    intro: |
      **я** (јас), **ти** (ти), **він / вона / воно**, **ми**, **ви** (вие, и учтиво), **вони**. **Ви** со голема буква во писма до една личност.
  uk-present:
    meaning: "сегашното време: две конјугации"
    intro: |
      **I (-ати):** читаю, читаєш, читає, читаємо, читаєте, читають. **II (-ити):** говорю, говориш, говорить, говоримо, говорите, говорять. **бути** во сегашно го има само **є**, и обично се испушта: **Я студент.** „Јас сум студент.“
  uk-possessive:
    meaning: "присвојни"
    intro: |
      **мій / моя / моє / мої** (мој), **твій**, **наш**, **ваш**, согласувани со именката; **його** (негов), **її** (нејзин), **їхній** (нивни); **свій** (свој, се однесува на подметот) — исто како македонското **свој**: **Він любить свою матір.**
  uk-questions:
    meaning: "прашални зборови; чи"
    intro: |
      **хто** (кој), **що** (што), **де** (каде), **куди** (каде, накај), **звідки** (од каде), **коли** (кога), **чому** (зошто), **як** (како), **скільки** (колку). Прашањата да/не често почнуваат со **чи** — како македонското **дали**: **Чи ти знаєш?**
  uk-ne:
    meaning: "негација"
    intro: |
      **не** пред глаголот: **Я не знаю.** **ні** = не; двојната негација е нормална, како во македонскиот: **Я нічого не бачу. Ніхто не прийшов.** „Нема…“ = **немає** + генитив: **Немає часу.** „Нема време.“
  uk-acc:
    meaning: "акузатив: директниот предмет"
    intro: |
      Македонскиот изгубил падежи, украинскиот ги има седум. Женски **-а → -у, -я → -ю** (книгу, землю); машки жив = генитив (**брата, вчителя**), нежив = номинатив (**стіл**); среден непроменет. По **в / у, на** за насока: **Я йду в школу.**
  uk-loc:
    meaning: "локатив: каде?"
    intro: |
      Само по предлози (**в / у, на, по, при, о**): **-і / -у / -ю**: **у місті, на столі, у Києві, на роботі.** И за тема со **о** — но **про** (за) зема акузатив.
  uk-gen:
    meaning: "генитив: од, отсуство, количество"
    intro: |
      **-и / -і** (женски), **-а / -я** или **-у / -ю** (машки), **-а** (среден): присвојност (**книга брата** „книгата на братот“), по **немає** (**немає часу**), количества (**склянка води, багато людей**), и по **з / із** (од), **до** (до), **від, для, без, біля, після**.
  uk-past:
    meaning: "минатото време"
    intro: |
      Основа + **-в** (маш.), **-ла** (жен.), **-ло** (сред.), **-ли** (мн.): **він читав, вона читала, воно читало, вони читали** — слично на македонската **л**-форма (*читал, читала*). Се согласува по род, не по лице: **я читав / я читала**. Неправилни: **йти → ішов, ішла; могти → міг, могла; нести → ніс, несла**.
  uk-aspect:
    meaning: "вид: несвршен и свршен"
    intro: |
      Повеќето глаголи доаѓаат во парови, исто како во македонскиот: **несвршен** за процес, повторување, самото дејство (**Я писав листа** — пишував), **свршен** за завршен резултат (**Я написав листа** — го напишав). Парови со префикс (**писати – написати, робити – зробити**) или суфикс (**купувати – купити, давати – дати**). Свршеното сегашно значи идно: **Я зроблю.** „Ќе направам.“
  uk-future:
    meaning: "идното"
    intro: |
      Несвршено: **буду, будеш, буде…** + инфинитив (**буду читати**) или еднозборната форма **читатиму, читатимеш, читатиме, читатимемо, читатимете, читатимуть**. Свршено: неговите сегашни форми (**прочитаю** — ќе го прочитам).
  uk-motion:
    meaning: "глаголи на движење"
    intro: |
      Пеш: **йти** (една насока, сега: *Я йду додому*) наспроти **ходити** (одење и враќање, навика: *Я ходжу в школу*). Со возило: **їхати** наспроти **їздити**. Префиксите даваат свршени: **прийти** (дојде), **вийти** (излезе), **увійти** (влезе), **поїхати** (тргне).
  uk-dat:
    meaning: "датив: кому"
    intro: |
      Машки **-ові / -еві / -у** (братові, вчителеві), женски **-і** (мамі), множина **-ам / -ям**. Индиректен предмет (**Я дав братові книгу** — во македонскиот: *му ја дадов книгата на брат ми*), возраст и чувства (**Мені двадцять років. Мені холодно.** „Ми е студено.“ **Мені подобається…** „Ми се допаѓа…“), по **завдяки, всупереч**.
  uk-ins:
    meaning: "инструментал: со, преку, како"
    intro: |
      Машки/среден **-ом / -ем / -єм**, женски **-ою / -ею / -єю**, множина **-ами / -ями**. Средство (**пишу ручкою** „пишувам со пенкало“), друштво со **з / із / зі** (**з другом**), професија по **бути, стати, працювати** (**Він працює лікарем** „Работи како лекар“), и по **над, під, перед, за, між**.
  uk-voc:
    meaning: "вокативот"
    intro: |
      Украинскиот, како и македонскиот, им се обраќа на луѓето во вокатив: **-е / -у / -ю** (маш.: **Тарасе, Андрію, пане**), **-о / -е / -є** (жен.: **Олено, мамо, Надіє**). Учтиво: **Пане Іване! Пані Олено!** Секојдневно во говорот.
  uk-adj:
    meaning: "согласување на придавките"
    intro: |
      Тврди **новий / нова / нове / нові**, меки **синій / синя / синє / сині**. Се согласуваат по род, број и падеж: **у новому місті, з новою книгою.**
  uk-comparison:
    meaning: "компаратив и суперлатив"
    intro: |
      **-іший / -ший** (новіший, дешевший), **ніж** „од“ или генитив по **за**: **Київ більший, ніж Львів.** Суперлатив **най-** (найкращий) — како македонското **нај-**. Неправилни: **добрий → кращий, поганий → гірший, великий → більший, малий → менший**. Аналитички: **більш / менш цікавий, найбільш цікавий**.
  uk-conditional:
    meaning: "условниот начин со би"
    intro: |
      Минатата форма + **би / б** — исто како македонското **би**: **Я б хотів кави.** „Би сакал кафе.“ **Якби я мав час, я б прийшов.** Иста форма за сегашни и минати нереални услови; **якщо** за реални услови со идно: **Якщо буде дощ, я залишуся вдома.**
  uk-relative:
    meaning: "релативни реченици"
    intro: |
      **який / яка / яке / які** (кој, која, кое, кои) се согласуваат со именката по род и број, а падежот го земаат од реченицата: **Це людина, яку я знаю. Місто, в якому я живу.** **що** (што) е поедноставна релативна заменка во говорот: **Книжка, що лежить на столі.**
