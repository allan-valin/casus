# Arabic text of the Ukrainian course, A1–B1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and letters: "الأصوات والحروف"
  Nouns and gender: "الأسماء والجنس"
  Pronouns and the present: "الضمائر والمضارع"
  Questions and negation: "الأسئلة والنفي"
  The cases (1): "الحالات الإعرابية (1)"
  Past and future: "الماضي والمستقبل"
  Motion: "الحركة"
  The cases (2): "الحالات الإعرابية (2)"
  Adjectives and comparison: "الصفات والمقارنة"
  Clauses: "الجمل"
lessons:
  uk-alphabet:
    meaning: "حروف في الأوكرانية (وليست في الروسية)"
    intro: |
      **и** صوت بين *i* و*y* (كصائت *bit* الإنجليزية)، و**і** هي *i*، و**ї** هي *yi*، و**є** هي *ye*، و**ґ** جيم مصرية *g* (نادرة)، بينما **г** هاء مجهورة. و**'** (الفاصلة العلوية) تفصل الصامت عمّا يليه من я، ю، є، ї: **м'ясо** (لحم)، **сім'я** (أسرة). و**щ** هي *shch*.
  uk-gender:
    meaning: "ثلاثة أجناس"
    intro: |
      المذكر: ينتهي بصامت (**стіл، брат، день**)؛ والمؤنث: **-а / -я** (**книга، земля**) وبعضه بعلامة اللين أو صامت (**ніч، сіль**)؛ والمحايد: **-о، -е، -я** (**вікно، море، ім'я، життя**). ولا أدوات تعريف. و**він / вона / воно** = هو / هي / المحايد، وتُستعمل للأشياء بحسب جنسها — كالعربية.
  uk-plural:
    meaning: "جمع حالة الرفع"
    intro: |
      المذكر والمؤنث: **-и / -і** (**столи، книги، дні، землі**)؛ والمحايد: **-а / -я** (**вікна، моря**). وبعضها شاذ: **люди** (ناس)، **діти** (أطفال)، **очі** (عيون).
  uk-pronouns:
    meaning: "الضمائر الشخصية"
    intro: |
      **я** (أنا)، **ти** (أنت)، **він / вона / воно**، **ми** (نحن)، **ви** (أنتم، وللتبجيل)، **вони** (هم). و**Ви** بحرف كبير في الرسائل إلى شخص واحد.
  uk-present:
    meaning: "المضارع: تصريفان"
    intro: |
      **الأول (-ати):** читаю، читаєш، читає، читаємо، читаєте، читають. **الثاني (-ити):** говорю، говориш، говорить، говоримо، говорите، говорять. و**бути** ليس لها في المضارع إلا **є**، وتُحذف عادة — كالجملة الاسمية في العربية: **Я студент.** «أنا طالب».
  uk-possessive:
    meaning: "صفات الملكية"
    intro: |
      **мій / моя / моє / мої** (لي)، **твій**، **наш**، **ваш**، تطابق الاسم؛ و**його** (له)، **її** (لها)، **їхній** (لهم)؛ و**свій** (الخاص به، يعود على الفاعل): **Він любить свою матір.** «يحب أمّه (هو)».
  uk-questions:
    meaning: "أدوات الاستفهام؛ чи"
    intro: |
      **хто** (من)، **що** (ماذا)، **де** (أين)، **куди** (إلى أين)، **звідки** (من أين)، **коли** (متى)، **чому** (لماذا)، **як** (كيف)، **скільки** (كم). وأسئلة نعم/لا كثيرًا ما تبدأ بـ **чи** — كـ«هل»: **Чи ти знаєш?**
  uk-ne:
    meaning: "النفي"
    intro: |
      **не** قبل الفعل: **Я не знаю.** و**ні** = لا؛ والنفي المزدوج عادي: **Я нічого не бачу.** «لا أرى شيئًا». **Ніхто не прийшов.** و«لا يوجد…» = **немає** + حالة الإضافة: **Немає часу.** «لا وقت».
  uk-acc:
    meaning: "حالة النصب: المفعول المباشر"
    intro: |
      المؤنث **-а → -у، -я → -ю** (книгу، землю)؛ والمذكر العاقل/الحي = حالة الإضافة (**брата، вчителя**)، وغير الحي = حالة الرفع (**стіл**)؛ والمحايد لا يتغير. وبعد **в / у، на** للاتجاه: **Я йду в школу.** «أذهب إلى المدرسة».
  uk-loc:
    meaning: "حالة المكان: أين؟"
    intro: |
      بعد حروف الجر فقط (**в / у، на، по، при، о**): **-і / -у / -ю**: **у місті، на столі، у Києві، на роботі.** وللموضوع مع **о** — لكن **про** (عن) تأخذ حالة النصب.
  uk-gen:
    meaning: "حالة الإضافة: الملكية والانعدام والكمية"
    intro: |
      **-и / -і** (المؤنث)، **-а / -я** أو **-у / -ю** (المذكر)، **-а** (المحايد): للملكية (**книга брата** «كتابُ الأخِ» — كالإضافة في العربية)، وبعد **немає** (**немає часу**)، وللكميات (**склянка води، багато людей**)، وبعد **з / із** (من)، **до** (إلى)، **від، для، без، біля، після**.
  uk-past:
    meaning: "الماضي"
    intro: |
      الجذر + **-в** (مذكر)، **-ла** (مؤنث)، **-ло** (محايد)، **-ли** (جمع): **він читав، вона читала، воно читало، вони читали**. ويطابق في الجنس لا في الشخص: **я читав / я читала**. والشاذ: **йти → ішов، ішла؛ могти → міг، могла؛ нести → ніс، несла**.
  uk-aspect:
    meaning: "الهيئة: غير التام والتام"
    intro: |
      أكثر الأفعال تأتي أزواجًا: **غير التام** للعملية والتكرار والفعل نفسه (**Я писав листа** — كنت أكتب الرسالة)، و**التام** للنتيجة المنجزة (**Я написав листа** — كتبتها وانتهيت). والأزواج بالسابقة (**писати – написати، робити – зробити**) أو باللاحقة (**купувати – купити، давати – дати**). ومضارع التام يعني المستقبل: **Я зроблю.** «سأفعل».
  uk-future:
    meaning: "المستقبل"
    intro: |
      غير التام: **буду، будеш، буде…** + المصدر (**буду читати**) أو الصيغة الواحدة **читатиму، читатимеш، читатиме، читатимемо، читатимете، читатимуть**. والتام: صيغ مضارعه (**прочитаю** — سأقرؤه كاملًا).
  uk-motion:
    meaning: "أفعال الحركة"
    intro: |
      مشيًا: **йти** (اتجاه واحد، الآن: *Я йду додому*) مقابل **ходити** (ذهاب وإياب، عادة: *Я ходжу в школу*). وبمركبة: **їхати** مقابل **їздити**. والسوابق تصنع أفعالًا تامة: **прийти** (وصل)، **вийти** (خرج)، **увійти** (دخل)، **поїхати** (انطلق).
  uk-dat:
    meaning: "حالة القابل: لمن"
    intro: |
      المذكر **-ові / -еві / -у** (братові، вчителеві)، والمؤنث **-і** (мамі)، والجمع **-ам / -ям**. للمفعول غير المباشر (**Я дав братові книгу** «أعطيت أخي الكتاب»)، وللعمر والمشاعر (**Мені двадцять років. Мені холодно.** «أشعر بالبرد». **Мені подобається…** «يعجبني…»)، وبعد **завдяки، всупереч**.
  uk-ins:
    meaning: "حالة الأداة: بـ، مع، بصفته"
    intro: |
      المذكر/المحايد **-ом / -ем / -єм**، والمؤنث **-ою / -ею / -єю**، والجمع **-ами / -ями**. للأداة (**пишу ручкою** «أكتب بالقلم»)، وللمصاحبة مع **з / із / зі** (**з другом**)، وللمهنة بعد **бути، стати، працювати** (**Він працює лікарем** «يعمل طبيبًا»)، وبعد **над، під، перед، за، між**.
  uk-voc:
    meaning: "حالة النداء"
    intro: |
      تنادي الأوكرانية الناس بصيغة النداء: **-е / -у / -ю** (المذكر: **Тарасе، Андрію، пане**)، **-о / -е / -є** (المؤنث: **Олено، мамо، Надіє**). وللتهذيب: **Пане Іване! Пані Олено!** وهي مستعملة في الكلام كل يوم.
  uk-adj:
    meaning: "مطابقة الصفة"
    intro: |
      الصلبة **новий / нова / нове / нові**، والليّنة **синій / синя / синє / сині**. تطابق في الجنس والعدد والحالة: **у новому місті، з новою книгою.**
  uk-comparison:
    meaning: "المقارنة والتفضيل"
    intro: |
      **-іший / -ший** (новіший، дешевший)، و**ніж** «من» أو حالة الإضافة بعد **за**: **Київ більший, ніж Львів.** «كييف أكبر من لفيف». والتفضيل **най-** (найкращий). والشاذ: **добрий → кращий، поганий → гірший، великий → більший، малий → менший**. والتحليلي: **більш / менш цікавий، найбільш цікавий**.
  uk-conditional:
    meaning: "الشرطي بـ би"
    intro: |
      صيغة الماضي + **би / б**: **Я б хотів кави.** «أودّ قهوة». **Якби я мав час, я б прийшов.** «لو كان عندي وقت لجئت». والصيغة واحدة للحاضر والماضي غير الواقعين؛ و**якщо** للشرط الممكن مع المستقبل: **Якщо буде дощ, я залишуся вдома.**
  uk-relative:
    meaning: "جمل الصلة"
    intro: |
      **який / яка / яке / які** تطابق الاسم في الجنس والعدد، وتأخذ حالتها من جملة الصلة: **Це людина, яку я знаю. Місто, в якому я живу.** و**що** موصول أبسط في الكلام: **Книжка, що лежить на столі.**
