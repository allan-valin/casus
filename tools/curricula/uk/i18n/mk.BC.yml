# Macedonian text of the Ukrainian course, B2–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Participles and adverbial participles: "Партиципи и прилошки партиципи"
  Numbers and quantity: "Броеви и количество"
  Connectors and style: "Сврзници и стил"
  Formal Ukrainian: "Официјален украински"
  Nuance: "Нијанси"
  Style and variety: "Стил и варијанти"
lessons:
  uk-b2-participles:
    meaning: "пасивни партиципи"
    intro: |
      **-ний / -тий** (написаний, відкритий) — вообичаените украински партиципи; се менуваат како придавки — како македонските **напишан, отворен**: **прочитана книга, відкриті двері.** Активните партиципи на *-учий / -ачий* се ретки во добар стил; наместо нив реченица со **який**.
  uk-b2-no-to:
    meaning: "безлично -но / -то"
    intro: |
      Типично украински пасив: **-но / -то** со предметот во акузатив и без вршител: **Роботу зроблено.** „Работата е направена.“ **Лист написано. Двері відчинено.** Во службен стил се претпочита пред *була зроблена*.
  uk-b2-gerund:
    meaning: "прилошки партиципи"
    intro: |
      Несвршени **-учи / -ючи / -ачи / -ячи** = додека прави — како македонското **-јќи** (**Читаючи книгу, він заснув** „Читајќи книга, заспа“); свршени **-вши / -ши** = откако направил (**Прочитавши лист, вона заплакала**). Ист подмет како главниот глагол.
  uk-b2-numerals:
    meaning: "броевите и нивните падежи"
    intro: |
      **один** се согласува како придавка; **два / три / чотири** + номинатив множина (**два брати, три книги**); од **п'ять** нагоре + генитив множина (**п'ять братів, десять книг**). Збирни **двоє, троє** за луѓе и именки само во множина (**двоє дітей**) — како македонските **двајца, тројца**.
  uk-b2-connectors:
    meaning: "сврзувачки зборови"
    intro: |
      **тому** (затоа), **тому що / бо** (затоа што, бидејќи), **однак, проте, але** (но, меѓутоа), **адже** (та нели), **хоча** (иако), **щоб** (за да, + минато: *щоб він знав*), **оскільки** (бидејќи), **зате** (затоа пак).
  uk-b2-reflexive:
    meaning: "повратни глаголи на -ся"
    intro: |
      **-ся** (по самогласка во говорот и **-сь**) — македонското **се**, но прилепено на глаголот: повратно (**митися** се мие), заемно (**зустрічатися** се среќаваат), чувства (**сміятися, боятися**), и пасив во 3 лице (**Будинок будується** „Куќата се гради“).
  uk-c1-prepositions:
    meaning: "сложени предлози"
    intro: |
      Службен стил: **згідно з** + инструментал (согласно), **відповідно до** + генитив (во согласност со), **у зв'язку з** (во врска со), **завдяки** + датив (благодарение на), **внаслідок** + ген. (како резултат на), **протягом** (во текот на), **шляхом** (по пат на). Избегнувај го русизмот *згідно* + датив.
  uk-c1-nominal:
    meaning: "глаголски именки"
    intro: |
      **-ння / -ття** ги претвораат глаголите во именки — како македонското **-ње**: **виконати → виконання, відкрити → відкриття, навчати → навчання**. Чести во службени текстови: **після закінчення навчання, для виконання завдання.**
  uk-c1-surzhyk:
    meaning: "украински или русизам?"
    intro: |
      Стандардниот украински ги претпочита своите зборови пред руските заемки од мешаниот говор (*суржик*): **дякую** (благодарам; *спасибі* е исто стандардно), **будь ласка** (ве молам), **вибачте** (извинете, не *ізвініть*), **так** (да, не *да*), **звичайно** (секако), **потрібно / треба** (потребно, треба), **пам'ятати** (памети), **приймати участь → брати участь** (зема учество).
  uk-c1-particles:
    meaning: "честички"
    intro: |
      **ж / же** (нагласување: *Я ж казав!* — Па ти реков!), **хіба** (зар?), **невже** (зар е можно…?), **адже** (та нели), **ну** (па), **ось / от** (ете), **лише / тільки** (само), **навіть** (дури), **аж** (цели, дури).
  uk-c2-imperative-1pl:
    meaning: "ајде и нека: заповеден за други лица"
    intro: |
      Украинскиот има заповеден за 1 лице множина: **ходімо** (ајде да одиме), **читаймо, працюймо**. Трето лице со **нехай / хай** + сегашно или идно — како македонското **нека**: **Нехай він прийде.** „Нека дојде.“ **Хай живе Україна!** „Да живее Украина!“
  uk-c2-diminutive:
    meaning: "деминутиви"
    intro: |
      Украинскиот е богат со деминутиви: **-ик, -чик** (столик), **-очок / -ечок** (віночок), **-ка, -очка** (хатинка, ніченька), **-ятко, -ечко** (зернятко, сонечко), и удвоени (**рученька, маленький → малесенький**). Народните песни и говорот со деца се полни со нив.
  uk-c2-literary:
    meaning: "читање класична книжевност"
    intro: |
      Стиховите на Тарас Шевченко (1840–60-тите) чуваат постари форми: 1 лице сегашно на **-ю** во **співаю**, вокативот насекаде, **єсть** наместо *є*, **оддати** наместо *віддати*, и многу црковнословенски зборови. Иван Франко и Леса Украинка пишуваат речиси современа проза и поезија; нивниот правопис подоцна е стандардизиран. Читачот ги означува современите форми; постарите можеби нема да ги препознае.
