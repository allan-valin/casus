# German text of the Ukrainian course, B2–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Participles and adverbial participles: "Partizipien und Adverbialpartizipien"
  Numbers and quantity: "Zahlen und Menge"
  Connectors and style: "Konnektoren und Stil"
  Formal Ukrainian: "Förmliches Ukrainisch"
  Nuance: "Nuancen"
  Style and variety: "Stil und Varietät"
lessons:
  uk-b2-participles:
    meaning: "Passivpartizipien"
    intro: |
      **-ний / -тий** (написаний, відкритий) — die üblichen ukrainischen Partizipien; sie werden wie Adjektive dekliniert: **прочитана книга, відкриті двері.** Aktivpartizipien auf *-учий / -ачий* sind in gutem Stil selten; besser ein Relativsatz mit **який**.
  uk-b2-no-to:
    meaning: "unpersönliches -но / -то"
    intro: |
      Ein typisch ukrainisches Passiv: **-но / -то** mit dem Objekt im Akkusativ und ohne Urheber: **Роботу зроблено.** „Die Arbeit ist getan.“ **Лист написано. Двері відчинено.** Im Amtsstil bevorzugt gegenüber *була зроблена*.
  uk-b2-gerund:
    meaning: "Adverbialpartizipien"
    intro: |
      Imperfektiv **-учи / -ючи / -ачи / -ячи** = während man tut (**Читаючи книгу, він заснув** „Beim Lesen schlief er ein“); perfektiv **-вши / -ши** = nachdem man getan hat (**Прочитавши лист, вона заплакала**). Dasselbe Subjekt wie das Hauptverb.
  uk-b2-numerals:
    meaning: "Zahlen und ihre Fälle"
    intro: |
      **один** kongruiert wie ein Adjektiv; **два / три / чотири** + Nominativ Plural (**два брати, три книги**); ab **п'ять** + Genitiv Plural (**п'ять братів, десять книг**). Sammelzahlen **двоє, троє** für Personen und Pluraliatantum (**двоє дітей**).
  uk-b2-connectors:
    meaning: "Bindewörter"
    intro: |
      **тому** (darum), **тому що / бо** (weil), **однак, проте, але** (aber, jedoch), **адже** (schließlich, ja doch), **хоча** (obwohl), **щоб** (damit, + Vergangenheit: *щоб він знав*), **оскільки** (da), **зате** (dafür).
  uk-b2-reflexive:
    meaning: "reflexive Verben auf -ся"
    intro: |
      **-ся** (nach Vokal gesprochen auch **-сь**): reflexiv (**митися** sich waschen), reziprok (**зустрічатися** sich treffen), Gefühle (**сміятися, боятися**) und passiv in der 3. Person (**Будинок будується** „Das Haus wird gebaut“).
  uk-c1-prepositions:
    meaning: "komplexe Präpositionen"
    intro: |
      Amtsstil: **згідно з** + Instrumental (gemäß), **відповідно до** + Genitiv (entsprechend), **у зв'язку з** (im Zusammenhang mit), **завдяки** + Dativ (dank), **внаслідок** + Gen. (infolge), **протягом** (während), **шляхом** (mittels). Den Russizismus *згідно* + Dativ vermeiden.
  uk-c1-nominal:
    meaning: "Verbalnomen"
    intro: |
      **-ння / -ття** machen aus Verben Nomen — wie deutsch *-ung*: **виконати → виконання, відкрити → відкриття, навчати → навчання**. Häufig in Amtstexten: **після закінчення навчання, для виконання завдання.**
  uk-c1-surzhyk:
    meaning: "Ukrainisch oder Russizismus?"
    intro: |
      Standardukrainisch bevorzugt eigene Wörter gegenüber russischen Lehnwörtern aus der Mischsprache (*Surschyk*): **дякую** (danke; *спасибі* ist auch Standard), **будь ласка** (bitte), **вибачте** (Entschuldigung, nicht *ізвініть*), **так** (ja, nicht *да*), **звичайно** (natürlich), **потрібно / треба** (nötig), **пам'ятати** (sich erinnern), **приймати участь → брати участь** (teilnehmen).
  uk-c1-particles:
    meaning: "Partikeln"
    intro: |
      **ж / же** (Nachdruck: *Я ж казав!* — Ich hab's doch gesagt!), **хіба** (etwa? doch nicht), **невже** (kann es sein, dass…?), **адже** (schließlich), **ну** (na), **ось / от** (hier, da ist), **лише / тільки** (nur), **навіть** (sogar), **аж** (ganze, bis zu).
  uk-c2-imperative-1pl:
    meaning: "lasst uns und soll er: der Imperativ anderer Personen"
    intro: |
      Ukrainisch hat einen Imperativ der 1. Person Plural: **ходімо** (lasst uns gehen, gehen wir), **читаймо, працюймо**. 3. Person mit **нехай / хай** + Präsens oder Futur: **Нехай він прийде.** „Soll er kommen.“ **Хай живе Україна!** „Es lebe die Ukraine!“
  uk-c2-diminutive:
    meaning: "Diminutive"
    intro: |
      Ukrainisch ist reich an Diminutiven: **-ик, -чик** (столик), **-очок / -ечок** (віночок), **-ка, -очка** (хатинка, ніченька), **-ятко, -ечко** (зернятко, сонечко) und doppelte (**рученька, маленький → малесенький**). Volkslieder und die Sprache mit Kindern sind voll davon.
  uk-c2-literary:
    meaning: "klassische Literatur lesen"
    intro: |
      Taras Schewtschenkos Verse (1840er–60er) bewahren ältere Formen: die 1. Person Präsens auf **-ю** in **співаю**, den Vokativ überall, **єсть** für *є*, **оддати** für *віддати* und viele kirchenslawische Wörter. Iwan Franko und Lessja Ukrajinka schreiben fast moderne Prosa und Lyrik; ihre Rechtschreibung wurde später vereinheitlicht. Der Leser markiert moderne Formen; ältere werden vielleicht nicht erkannt.
