# German text of the Ukrainian course, A1–B1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and letters: "Laute und Buchstaben"
  Nouns and gender: "Nomen und Genus"
  Pronouns and the present: "Pronomen und das Präsens"
  Questions and negation: "Fragen und Verneinung"
  The cases (1): "Die Fälle (1)"
  Past and future: "Vergangenheit und Zukunft"
  Motion: "Bewegung"
  The cases (2): "Die Fälle (2)"
  Adjectives and comparison: "Adjektive und Steigerung"
  Clauses: "Nebensätze"
lessons:
  uk-alphabet:
    meaning: "Buchstaben, die das Ukrainische hat (und das Russische nicht)"
    intro: |
      **и** ist ein Laut zwischen *i* und *y* (wie in *bitte*), **і** ist *i*, **ї** ist *ji*, **є** ist *je*, **ґ** ein hartes *g* (selten), während **г** ein stimmhaftes *h* ist. **'** (Apostroph) trennt einen Konsonanten von folgendem я, ю, є, ї: **м'ясо** (Fleisch), **сім'я** (Familie). **щ** ist *schtsch*.
  uk-gender:
    meaning: "drei Genera"
    intro: |
      Maskulin: Konsonant am Ende (**стіл, брат, день**); feminin: **-а / -я** (**книга, земля**) und manche auf Weichheitszeichen oder Konsonant (**ніч, сіль**); neutral: **-о, -е, -я** (**вікно, море, ім'я, життя**). Keine Artikel. **він / вона / воно** = er / sie / es, auch für Dinge nach dem Genus — wie im Deutschen.
  uk-plural:
    meaning: "der Nominativ Plural"
    intro: |
      Maskulinum und Femininum: **-и / -і** (**столи, книги, дні, землі**); Neutrum: **-а / -я** (**вікна, моря**). Einige unregelmäßig: **люди** (Leute), **діти** (Kinder), **очі** (Augen).
  uk-pronouns:
    meaning: "Personalpronomen"
    intro: |
      **я** (ich), **ти** (du), **він / вона / воно**, **ми**, **ви** (ihr und höfliches Sie), **вони**. **Ви** in Briefen an eine Person großgeschrieben.
  uk-present:
    meaning: "das Präsens: zwei Konjugationen"
    intro: |
      **I (-ати):** читаю, читаєш, читає, читаємо, читаєте, читають. **II (-ити):** говорю, говориш, говорить, говоримо, говорите, говорять. **бути** hat im Präsens nur **є**, und es wird meist weggelassen: **Я студент.** „Ich bin Student.“
  uk-possessive:
    meaning: "Possessive"
    intro: |
      **мій / моя / моє / мої** (mein), **твій**, **наш**, **ваш**, kongruierend mit dem Nomen; **його** (sein), **її** (ihr), **їхній** (ihr, Plural); **свій** (der eigene, bezogen auf das Subjekt): **Він любить свою матір.** „Er liebt seine (eigene) Mutter.“
  uk-questions:
    meaning: "Fragewörter; чи"
    intro: |
      **хто** (wer), **що** (was), **де** (wo), **куди** (wohin), **звідки** (woher), **коли** (wann), **чому** (warum), **як** (wie), **скільки** (wie viel). Ja/Nein-Fragen beginnen oft mit **чи**: **Чи ти знаєш?**
  uk-ne:
    meaning: "Verneinung"
    intro: |
      **не** vor dem Verb: **Я не знаю.** **ні** = nein; doppelte Verneinung ist normal: **Я нічого не бачу.** „Ich sehe nichts.“ **Ніхто не прийшов.** „Es gibt kein…“ = **немає** + Genitiv: **Немає часу.**
  uk-acc:
    meaning: "Akkusativ: das direkte Objekt"
    intro: |
      Feminin **-а → -у, -я → -ю** (книгу, землю); maskulin belebt = Genitiv (**брата, вчителя**), unbelebt = Nominativ (**стіл**); Neutrum unverändert. Nach **в / у, на** für die Richtung — wie deutsch *in die Schule*: **Я йду в школу.**
  uk-loc:
    meaning: "Lokativ: wo?"
    intro: |
      Nur nach Präpositionen (**в / у, на, по, при, о**): **-і / -у / -ю**: **у місті, на столі, у Києві, на роботі.** Auch für ein Thema mit **о** — aber **про** nimmt den Akkusativ.
  uk-gen:
    meaning: "Genitiv: von, Fehlen, Menge"
    intro: |
      **-и / -і** (feminin), **-а / -я** oder **-у / -ю** (maskulin), **-а** (neutral): Besitz (**книга брата**), nach **немає** (**немає часу**), Mengen (**склянка води, багато людей**) und nach **з / із** (aus), **до** (zu), **від, для, без, біля, після**.
  uk-past:
    meaning: "die Vergangenheit"
    intro: |
      Stamm + **-в** (mask.), **-ла** (fem.), **-ло** (neutr.), **-ли** (Pl.): **він читав, вона читала, воно читало, вони читали**. Sie kongruiert im Genus, nicht in der Person: **я читав / я читала**. Unregelmäßig: **йти → ішов, ішла; могти → міг, могла; нести → ніс, несла**.
  uk-aspect:
    meaning: "Aspekt: imperfektiv und perfektiv"
    intro: |
      Die meisten Verben kommen paarweise: **imperfektiv** für Verlauf, Wiederholung, die Handlung an sich (**Я писав листа** — ich schrieb gerade / pflegte zu schreiben), **perfektiv** für ein abgeschlossenes Ergebnis (**Я написав листа** — ich habe ihn fertig geschrieben). Paare per Präfix (**писати – написати, робити – зробити**) oder Suffix (**купувати – купити, давати – дати**). Das perfektive Präsens bedeutet Zukunft: **Я зроблю.**
  uk-future:
    meaning: "die Zukunft"
    intro: |
      Imperfektiv: **буду, будеш, буде…** + Infinitiv (**буду читати**) oder die einteilige Form **читатиму, читатимеш, читатиме, читатимемо, читатимете, читатимуть**. Perfektiv: seine Präsensformen (**прочитаю** — ich werde es zu Ende lesen).
  uk-motion:
    meaning: "Verben der Bewegung"
    intro: |
      Zu Fuß: **йти** (eine Richtung, jetzt: *Я йду додому*) gegenüber **ходити** (hin und zurück, Gewohnheit: *Я ходжу в школу*). Mit Fahrzeug: **їхати** gegenüber **їздити** — wie deutsch *gehen* / *fahren*. Präfixe ergeben Perfektiva: **прийти** (ankommen), **вийти** (hinausgehen), **увійти** (hineingehen), **поїхати** (losfahren).
  uk-dat:
    meaning: "Dativ: wem"
    intro: |
      Maskulin **-ові / -еві / -у** (братові, вчителеві), feminin **-і** (мамі), Plural **-ам / -ям**. Indirektes Objekt (**Я дав братові книгу**), Alter und Empfindungen — wie deutsch *mir ist kalt* (**Мені двадцять років. Мені холодно. Мені подобається…**), nach **завдяки, всупереч**.
  uk-ins:
    meaning: "Instrumental: mit, durch, als"
    intro: |
      Maskulin/neutral **-ом / -ем / -єм**, feminin **-ою / -ею / -єю**, Plural **-ами / -ями**. Werkzeug (**пишу ручкою** „ich schreibe mit dem Kuli“), Begleitung mit **з / із / зі** (**з другом**), Beruf nach **бути, стати, працювати** (**Він працює лікарем** „Er arbeitet als Arzt“) und nach **над, під, перед, за, між**.
  uk-voc:
    meaning: "der Vokativ"
    intro: |
      Im Ukrainischen spricht man Menschen im Vokativ an: **-е / -у / -ю** (mask.: **Тарасе, Андрію, пане**), **-о / -е / -є** (fem.: **Олено, мамо, Надіє**). Höflich: **Пане Іване! Пані Олено!** Wird jeden Tag gesprochen gebraucht.
  uk-adj:
    meaning: "Adjektivkongruenz"
    intro: |
      Hart **новий / нова / нове / нові**, weich **синій / синя / синє / сині**. Sie kongruieren in Genus, Numerus und Kasus: **у новому місті, з новою книгою.**
  uk-comparison:
    meaning: "Komparativ und Superlativ"
    intro: |
      **-іший / -ший** (новіший, дешевший), **ніж** „als“ oder der Genitiv nach **за**: **Київ більший, ніж Львів.** Superlativ **най-** (найкращий). Unregelmäßig: **добрий → кращий, поганий → гірший, великий → більший, малий → менший**. Analytisch: **більш / менш цікавий, найбільш цікавий**.
  uk-conditional:
    meaning: "der Konditional mit би"
    intro: |
      Vergangenheitsform + **би / б**: **Я б хотів кави.** „Ich hätte gern Kaffee.“ **Якби я мав час, я б прийшов.** Dieselbe Form für irreale Gegenwart und Vergangenheit; **якщо** für reale Bedingungen mit Futur: **Якщо буде дощ, я залишуся вдома.**
  uk-relative:
    meaning: "Relativsätze"
    intro: |
      **який / яка / яке / які** kongruieren mit dem Nomen in Genus und Numerus, ihren Kasus bekommen sie aus dem Relativsatz — wie deutsch *der, die, das*: **Це людина, яку я знаю. Місто, в якому я живу.** **що** ist ein einfacheres Relativum der gesprochenen Sprache: **Книжка, що лежить на столі.**
