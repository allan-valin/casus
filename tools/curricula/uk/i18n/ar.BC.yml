# Arabic text of the Ukrainian course, B2–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Participles and adverbial participles: "أسماء المفعول وصيغ الحال"
  Numbers and quantity: "الأعداد والكمية"
  Connectors and style: "أدوات الربط والأسلوب"
  Formal Ukrainian: "الأوكرانية الرسمية"
  Nuance: "الفروق الدقيقة"
  Style and variety: "الأسلوب والتنوع"
lessons:
  uk-b2-participles:
    meaning: "أسماء المفعول"
    intro: |
      **-ний / -тий** (написаний، відкритий) — أسماء المفعول المعتادة في الأوكرانية؛ وتُصرَّف كالصفات: **прочитана книга، відкриті двері.** وأسماء الفاعل بـ *-учий / -ачий* نادرة في الأسلوب الجيد؛ واستعمل بدلها جملة بـ **який**.
  uk-b2-no-to:
    meaning: "-но / -то غير الشخصية"
    intro: |
      مجهول أوكراني نموذجي: **-но / -то** مع المفعول في حالة النصب وبلا فاعل: **Роботу зроблено.** «أُنجز العمل». **Лист написано. Двері відчинено.** ويُفضَّل في الأسلوب الرسمي على *була зроблена*.
  uk-b2-gerund:
    meaning: "صيغ الحال"
    intro: |
      غير التامة **-учи / -ючи / -ачи / -ячи** = وهو يفعل (**Читаючи книгу, він заснув** «نام وهو يقرأ الكتاب»)؛ والتامة **-вши / -ши** = بعد أن فعل (**Прочитавши лист, вона заплакала**). وفاعلها فاعل الفعل الرئيسي.
  uk-b2-numerals:
    meaning: "الأعداد وحالاتها"
    intro: |
      **один** يطابق كالصفة؛ و**два / три / чотири** + جمع حالة الرفع (**два брати، три книги**)؛ ومن **п'ять** فصاعدًا + جمع حالة الإضافة (**п'ять братів، десять книг**) — قارن تمييز العدد في العربية. والأعداد الجمعية **двоє، троє** للأشخاص وللأسماء الملازمة للجمع (**двоє дітей**).
  uk-b2-connectors:
    meaning: "أدوات الربط"
    intro: |
      **тому** (لذلك)، **тому що / бо** (لأنّ)، **однак، проте، але** (لكن، غير أنّ)، **адже** (إذ إنّ)، **хоча** (مع أنّ)، **щоб** (لكي، + الماضي: *щоб він знав*)، **оскільки** (بما أنّ)، **зате** (في المقابل).
  uk-b2-reflexive:
    meaning: "الأفعال الانعكاسية بـ -ся"
    intro: |
      **-ся** (وبعد الصائت في الكلام **-сь** أيضًا): للانعكاس (**митися** اغتسل)، وللمشاركة (**зустрічатися** تلاقيا)، وللمشاعر (**сміятися، боятися**)، وللمجهول مع الغائب (**Будинок будується** «البيت يُبنى»).
  uk-c1-prepositions:
    meaning: "حروف جر مركّبة"
    intro: |
      الأسلوب الرسمي: **згідно з** + حالة الأداة (وفقًا لـ)، **відповідно до** + حالة الإضافة (طبقًا لـ)، **у зв'язку з** (بخصوص)، **завдяки** + حالة القابل (بفضل)، **внаслідок** + الإضافة (نتيجةً لـ)، **протягом** (خلال)، **шляхом** (عن طريق). وتجنّب الروسية الدخيلة *згідно* + حالة القابل.
  uk-c1-nominal:
    meaning: "المصادر"
    intro: |
      **-ння / -ття** تحوّل الأفعال إلى أسماء — كالمصدر في العربية: **виконати → виконання، відкрити → відкриття، навчати → навчання**. وهي شائعة في النصوص الرسمية: **після закінчення навчання، для виконання завдання.**
  uk-c1-surzhyk:
    meaning: "أوكرانية أم دخيل روسي؟"
    intro: |
      تفضّل الأوكرانية المعيارية كلماتها على الدخيل الروسي في الكلام المختلط (*سورجيك*): **дякую** (شكرًا؛ و*спасибі* معيارية أيضًا)، **будь ласка** (من فضلك)، **вибачте** (عفوًا، لا *ізвініть*)، **так** (نعم، لا *да*)، **звичайно** (طبعًا)، **потрібно / треба** (يلزم)، **пам'ятати** (تذكّر)، **приймати участь → брати участь** (شارك).
  uk-c1-particles:
    meaning: "الأدوات"
    intro: |
      **ж / же** (للتوكيد: *Я ж казав!* — ألم أقل لك!)، **хіба** (أحقًا؟ أَوَ…)، **невже** (أيُعقل أنّ…؟)، **адже** (إذ إنّ)، **ну** (حسنًا)، **ось / от** (ها هو)، **лише / тільки** (فقط)، **навіть** (حتى)، **аж** (بلغ حدّ).
  uk-c2-imperative-1pl:
    meaning: "لِنفعل ولْيفعل: أمر الضمائر الأخرى"
    intro: |
      للأوكرانية أمر للمتكلمين: **ходімо** (لنذهب)، **читаймо، працюймо**. وللغائب **нехай / хай** + المضارع أو المستقبل — كلام الأمر في العربية: **Нехай він прийде.** «ليأتِ». **Хай живе Україна!** «عاشت أوكرانيا!»
  uk-c2-diminutive:
    meaning: "التصغير"
    intro: |
      الأوكرانية غنية بالتصغير: **-ик، -чик** (столик)، **-очок / -ечок** (віночок)، **-ка، -очка** (хатинка، ніченька)، **-ятко، -ечко** (зернятко، сонечко)، والمضاعف (**рученька، маленький → малесенький**). والأغاني الشعبية والكلام مع الأطفال مليئة بها.
  uk-c2-literary:
    meaning: "قراءة الأدب الكلاسيكي"
    intro: |
      شعر تاراس شيفتشينكو (أربعينيات القرن التاسع عشر إلى ستينياته) يحفظ صيغًا أقدم: المتكلم في المضارع بـ **-ю** في **співаю**، والنداء في كل موضع، و**єсть** بدل *є*، و**оддати** بدل *віддати*، وكلمات سلافية كنسية كثيرة. ويكتب إيفان فرانكو وليسيا أوكراينكا نثرًا وشعرًا قريبين من الحديث؛ ووُحِّد إملاؤهما لاحقًا. والقارئ يعلّم الصيغ الحديثة؛ وقد لا يتعرّف على القديمة.
