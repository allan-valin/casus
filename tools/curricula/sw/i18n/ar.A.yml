# Arabic text of the Swahili course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and nouns: "الأصوات والأسماء"
  Pronouns and being: "الضمائر والكون"
  Verbs: "الأفعال"
  Questions and places: "الأسئلة والأماكن"
  More verb forms: "صيغ فعلية أخرى"
  Clauses: "الجمل"
  Verb extensions: "امتدادات الفعل"
  Learned words: "الكلمات المثقّفة"
  History and literature: "التاريخ والأدب"
lessons:
  sw-sounds:
    meaning: "الكتابة كما تُنطق؛ النبر على المقطع قبل الأخير"
    intro: |
      خمس حركات ثابتة: **a e i o u**. **ch** = *تش*، **ny** = *ني*، **ng'** كما في الإنجليزية *singer*، و**dh** و**th** = *ذ* و*ث* (من العربية). والنبر دائمًا على المقطع قبل الأخير: **ki-TA-bu**، **ki-ta-BU-ni**.
  sw-classes:
    meaning: "أصناف الأسماء أزواجًا"
    intro: |
      تنقسم الأسماء أصنافًا تميّزها سابقة، مفردًا وجمعًا أزواجًا: **m-/wa-** للناس (**mtoto / watoto** طفل / أطفال)، **m-/mi-** (**mti / miti** شجرة)، **ki-/vi-** (**kitabu / vitabu** كتاب، من العربية)، **ji-/ma-** (**jicho / macho** عين)، **n-** (واحدة في الحالتين: **nyumba** بيت، بيوت). وكل ما يطابق الاسم يأخذ سابقة صنفه.
  sw-agreement:
    meaning: "الصفات تطابق بحسب الصنف"
    intro: |
      الصفات بعد الاسم وتأخذ سابقته: **mtoto mzuri** (طفل طيّب)، **watoto wazuri**، **kitabu kizuri**، **vitabu vizuri**، **nyumba nzuri**. وبعضها، وأكثره من العربية، لا يتغيّر: **safi** (صافٍ، نظيف)، **ghali** (غالٍ).
  sw-pronouns:
    meaning: "الضمائر؛ الملكية -angu، -ako"
    intro: |
      **mimi** (أنا)، **wewe** (أنت)، **yeye** (هو، هي)، **sisi** (نحن)، **ninyi** (أنتم)، **wao** (هم) — وكثيرًا ما تُحذف لأن الفعل يبيّن الشخص. وضمائر الملكية تطابق المملوك: **kitabu changu** (كتابي)، **vitabu vyangu**، **jina langu** (اسمي)، **kaka yangu** (أخي).
  sw-ni:
    meaning: "الكون (ni)، النفي (si)، الوجود في مكان (-ko)"
    intro: |
      **ni** (هو، أنا، هم) لكل الأشخاص: **Mimi ni mwalimu** (أنا معلّم، من العربية)؛ والنفي **si**: **Yeye si mwalimu**. والمكان بسابقة الفاعل + **-ko / -po / -mo**: **Kitabu kiko mezani** (الكتاب على الطاولة)، **Yuko nyumbani** (هو في البيت). والملكية **kuwa na**: **Nina kitabu** (عندي كتاب).
  sw-verb:
    meaning: "الفاعل + الزمن + الجذر"
    intro: |
      يُبنى الفعل من سوابق: الفاعل (**ni** أنا، **u** أنت، **a** هو/هي، **tu** نحن، **m** أنتم، **wa** هم) + الزمن (**na** الآن، **li** الماضي، **ta** المستقبل، **me** التامّ) + الجذر: **ninasoma** (أقرأ)، **alisoma** (قرأ)، **tutasoma** (سنقرأ)، **wamefika** (وصلوا). والمصدر بـ**ku-**: **kusoma** (القراءة).
  sw-negative:
    meaning: "النفي: ha- وأزمنة متغيّرة"
    intro: |
      سوابق الفاعل المنفية: **si** (أنا لا)، **hu** (أنت لا)، **ha** (هو لا)، **hatu**، **ham**، **hawa**. والمضارع يُسقط **-na-** وينتهي بـ**-i**: **sisomi** (لا أقرأ)؛ والماضي بـ**-ku-**: **hakusoma** (لم يقرأ)؛ والمستقبل يبقي **-ta-**: **hatutasoma**. **Sielewi** = لا أفهم.
  sw-object:
    meaning: "سابقة المفعول"
    intro: |
      سابقة المفعول قبل الجذر مباشرة: **ninakisoma** (أقرؤه — الكتاب، صنف ki-)، **alinipa zawadi** (أعطاني هدية)، **nakupenda** (أحبّك). ومع الناس تأتي عادةً حتى مع الاسم: **nilimwona Juma** (رأيت جمعة).
  sw-questions:
    meaning: "أدوات الاستفهام"
    intro: |
      **nini** (ماذا)، **nani** (من)، **wapi** (أين)، **lini** (متى)، **kwa nini** (لماذا)، **vipi / jinsi gani** (كيف)، **ngapi** (كم) — بعد الفعل: **Unakwenda wapi?** (إلى أين تذهب؟). ونعم/لا بالنبرة، أو بـ**je** في البداية: **Je, unasema Kiingereza?** (هل تتكلّم الإنجليزية؟)
  sw-ni-locative:
    meaning: "الأماكن: -ni، katika، kwa"
    intro: |
      **-ni** على الاسم تجعله مكانًا: **meza → mezani** (على الطاولة)، **nyumba → nyumbani** (في البيت)، **jiko → jikoni** (في المطبخ). وحروف الجرّ: **katika** (في)، **kwa** (بـ، مع، عند أحد: **kwa basi** بالحافلة)، **kutoka** (من)، **mpaka / hadi** (حتى).
  sw-subjunctive:
    meaning: "الالتزامي والأمر"
    intro: |
      الأمر = الجذر: **soma!** (اقرأ!)، والجمع **someni!**؛ **njoo!** (تعال!). والالتزامي: سابقة الفاعل + جذر ينتهي بـ**-e**: **nisome** (أن أقرأ)، **tuende** (هيّا بنا)، **Nataka usome** (أريد أن تقرأ)؛ والنفي بـ**-si-**: **usiende** (لا تذهب).
  sw-relative:
    meaning: "جمل الصلة"
    intro: |
      *الذي* داخل الفعل بحسب الصنف: **mtu anayesoma** (الشخص الذي يقرأ)، **kitabu ninachosoma** (الكتاب الذي أقرؤه). أو بـ**amba-** + الصنف: **mtu ambaye anasoma**، **kitabu ambacho ninasoma**. وأدوات الربط: **kwamba** (أنّ)، **kama** (إذا، مثل)، **kwa sababu** (لأنّ، من «سبب»)، **lakini** (لكن، من العربية)، **ili** (لكي).
  sw-extensions:
    meaning: "لأجل، التسبيب، المجهول، المشاركة"
    intro: |
      لواحق تغيّر معنى الفعل: **-ea / -ia** لأجل أحد (**somea** قرأ له)، **-isha / -esha** التسبيب (**somesha** علّم، أقرأ)، **-wa** المجهول (**somwa** قُرئ، **pendwa** أُحبّ)، **-ana** المشاركة (**pendana** تحابّا)، **-ika** الإمكان (**someka** مقروء).
  sw-arabic:
    meaning: "الطبقتان البانتوية والعربية؛ المجرّدات بـ u-"
    intro: |
      نحو ثلث المفردات من العربية (**elimu** علم، **habari** أخبار، **kitabu** كتاب، **saa** ساعة)، والكلمات الأحدث من الإنجليزية (**sayansi**، **kompyuta**). والمجرّدات بـ**u-**: **uhuru** (حرّية، من «حُرّ»)، **umoja** (وحدة)، **utamaduni** (ثقافة، من «تمدّن») — وكان *Uhuru na Umoja* شعار تنزانيا.
  sw-history:
    meaning: "الماضي بالحرف العربي، الكلاسيكيات، عامية المدن"
    intro: |
      نمت السواحلية على الساحل لغةً للتجارة؛ وكُتبت قصائدها الأولى (*Utendi wa Tambuka*، 1728) بالحرف العربي (*العجمي*)، وجاء الحرف اللاتيني في القرن التاسع عشر. وشعبان روبرت (1909–1962) كاتبها الكلاسيكي. ويتكلّم شباب نيروبي **Sheng**، سواحلية مخلوطة بالإنجليزية: **sasa** (أهلًا)، **poa** (رائع).
