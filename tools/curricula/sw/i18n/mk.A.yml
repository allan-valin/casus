# Macedonian text of the Swahili course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and nouns: "Гласови и именки"
  Pronouns and being: "Заменки и „сум“"
  Verbs: "Глаголи"
  Questions and places: "Прашања и места"
  More verb forms: "Други глаголски форми"
  Clauses: "Реченици"
  Verb extensions: "Глаголски проширувања"
  Learned words: "Учени зборови"
  History and literature: "Историја и литература"
lessons:
  sw-sounds:
    meaning: "се пишува како што се зборува; нагласок на претпоследниот слог"
    intro: |
      Пет самогласки, секогаш исти: **a e i o u**. **ch** е *ч*, **ny** е *њ*, **ng'** како во англиското *singer*, **dh** и **th** како во англиското *this* и *thin* (од арапски). Нагласокот секогаш е на претпоследниот слог: **ki-TA-bu**, **ki-ta-BU-ni**.
  sw-classes:
    meaning: "именски класи во парови"
    intro: |
      Именките се делат на класи означени со префикс, еднина и множина во парови: **m-/wa-** за луѓе (**mtoto / watoto** дете / деца), **m-/mi-** (**mti / miti** дрво), **ki-/vi-** (**kitabu / vitabu** книга), **ji-/ma-** (**jicho / macho** око), **n-** (исто во двете: **nyumba** куќа, куќи). Сè што се согласува со именката го зема префиксот на класата.
  sw-agreement:
    meaning: "придавките се согласуваат по класа"
    intro: |
      Придавките стојат по именката и го земаат нејзиниот префикс: **mtoto mzuri** (добро дете), **watoto wazuri**, **kitabu kizuri**, **vitabu vizuri**, **nyumba nzuri**. Некои, главно од арапски, никогаш не се менуваат: **safi** (чист), **ghali** (скап).
  sw-pronouns:
    meaning: "заменки; присвојни -angu, -ako"
    intro: |
      **mimi** (јас), **wewe** (ти), **yeye** (тој, таа), **sisi** (ние), **ninyi** (вие), **wao** (тие) — често се изоставаат, бидејќи глаголот го покажува лицето. Присвојните се согласуваат со поседуваното: **kitabu changu** (мојата книга), **vitabu vyangu**, **jina langu** (моето име), **kaka yangu** (мојот брат).
  sw-ni:
    meaning: "сум (ni), не сум (si), се наоѓам (-ko)"
    intro: |
      **ni** (е, сум, се) за сите лица: **Mimi ni mwalimu** (наставник сум); негација **si**: **Yeye si mwalimu**. Место со префикс на подметот + **-ko / -po / -mo**: **Kitabu kiko mezani** (книгата е на масата), **Yuko nyumbani** (дома е). *Има*: **kuwa na**: **Nina kitabu** (имам книга).
  sw-verb:
    meaning: "подмет + време + основа"
    intro: |
      Глаголот се гради од префикси: подмет (**ni** јас, **u** ти, **a** тој/таа, **tu** ние, **m** вие, **wa** тие) + време (**na** сега, **li** минато, **ta** иднина, **me** перфект) + основа: **ninasoma** (читам), **alisoma** (читаше), **tutasoma** (ќе читаме), **wamefika** (пристигнаа). Инфинитив **ku-**: **kusoma** (да чита).
  sw-negative:
    meaning: "негацијата: ha- и изменети времиња"
    intro: |
      Одречни префикси на подметот: **si** (јас не), **hu** (ти не), **ha** (тој не), **hatu**, **ham**, **hawa**. Сегашното време го губи **-na-** и завршува на **-i**: **sisomi** (не читам); минатото користи **-ku-**: **hakusoma** (не читаше); иднината го задржува **-ta-**: **hatutasoma**. **Sielewi** = не разбирам.
  sw-object:
    meaning: "префиксот за објект"
    intro: |
      Префиксот за објект стои веднаш пред основата: **ninakisoma** (ја читам — книгата, класа ki-), **alinipa zawadi** (ми даде подарок), **nakupenda** (те сакам). За луѓе е вообичаен и покрај именката: **nilimwona Juma** (го видов Џума).
  sw-questions:
    meaning: "прашални зборови"
    intro: |
      **nini** (што), **nani** (кој), **wapi** (каде), **lini** (кога), **kwa nini** (зошто), **vipi / jinsi gani** (како), **ngapi** (колку) — по глаголот: **Unakwenda wapi?** (каде одиш?). Да/не: со интонација, или со **je** на почетокот: **Je, unasema Kiingereza?** (зборуваш ли англиски?)
  sw-ni-locative:
    meaning: "места: -ni, katika, kwa"
    intro: |
      **-ni** на именка прави место: **meza → mezani** (на масата), **nyumba → nyumbani** (дома), **jiko → jikoni** (во кујната). Предлози: **katika** (во), **kwa** (со, кај некого: **kwa basi** со автобус), **kutoka** (од), **mpaka / hadi** (до).
  sw-subjunctive:
    meaning: "субјунктивот и императивот"
    intro: |
      Императив = основата: **soma!** (читај!), множина **someni!**; **njoo!** (дојди!). Субјунктив: префикс на подметот + основа на **-e**: **nisome** (да читам), **tuende** (ајде да одиме), **Nataka usome** (сакам да читаш); негација **-si-**: **usiende** (не оди).
  sw-relative:
    meaning: "релативни реченици"
    intro: |
      *Што / кој* се вградува во глаголот според класата: **mtu anayesoma** (човекот што чита), **kitabu ninachosoma** (книгата што ја читам). Или со **amba-** + класа: **mtu ambaye anasoma**, **kitabu ambacho ninasoma**. Сврзници: **kwamba** (дека), **kama** (ако, како), **kwa sababu** (зашто), **lakini** (но), **ili** (за да).
  sw-extensions:
    meaning: "за, предизвикува, бидува направено, еден со друг"
    intro: |
      Наставките го менуваат значењето на глаголот: **-ea / -ia** за некого (**somea** чита некому), **-isha / -esha** предизвикува (**somesha** учи, тера да чита), **-wa** пасив (**somwa** се чита, **pendwa** е сакан), **-ana** еден со друг (**pendana** се сакаат), **-ika** може да биде (**someka** читлив е).
  sw-arabic:
    meaning: "бантуски и арапски слоеви; апстрактни на u-"
    intro: |
      Околу третина од речникот доаѓа од арапски (**elimu** образование, **habari** вести, **kitabu** книга, **saa** час), понови зборови од англиски (**sayansi**, **kompyuta**). Апстрактните именки земаат **u-**: **uhuru** (слобода), **umoja** (единство), **utamaduni** (култура) — *Uhuru na Umoja* беше мотото на Танзанија.
  sw-history:
    meaning: "минатото во арапско писмо, класиците, градскиот сленг"
    intro: |
      Свахили растел на брегот како јазик на трговијата; неговите први поеми (*Utendi wa Tambuka*, 1728) се напишани со арапско писмо (*аџами*), латиницата дошла во 19 век. Шаабан Роберт (1909–1962) е негов класичен автор. Младите во Најроби зборуваат **Sheng**, свахили измешан со англиски: **sasa** (здраво), **poa** (кул).
