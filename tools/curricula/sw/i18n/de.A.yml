# German text of the Swahili course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and nouns: "Laute und Nomen"
  Pronouns and being: "Pronomen und „sein“"
  Verbs: "Verben"
  Questions and places: "Fragen und Orte"
  More verb forms: "Weitere Verbformen"
  Clauses: "Nebensätze"
  Verb extensions: "Verberweiterungen"
  Learned words: "Gelehrte Wörter"
  History and literature: "Geschichte und Literatur"
lessons:
  sw-sounds:
    meaning: "Schrift wie gesprochen; Betonung auf der vorletzten Silbe"
    intro: |
      Fünf Vokale, immer gleich: **a e i o u**. **ch** wie *tsch*, **ny** wie *nj*, **ng'** wie in *Sänger*, **dh** und **th** wie im englischen *this* und *thin* (aus dem Arabischen). Die Betonung liegt immer auf der vorletzten Silbe: **ki-TA-bu**, **ki-ta-BU-ni**.
  sw-classes:
    meaning: "Nominalklassen in Paaren"
    intro: |
      Nomen gehören zu Klassen, die ein Präfix markiert, Singular und Plural in Paaren: **m-/wa-** für Menschen (**mtoto / watoto** Kind / Kinder), **m-/mi-** (**mti / miti** Baum), **ki-/vi-** (**kitabu / vitabu** Buch), **ji-/ma-** (**jicho / macho** Auge), **n-** (in beiden gleich: **nyumba** Haus, Häuser). Alles, was mit dem Nomen kongruiert, nimmt das Klassenpräfix.
  sw-agreement:
    meaning: "Adjektive kongruieren nach Klasse"
    intro: |
      Adjektive folgen dem Nomen und nehmen sein Präfix: **mtoto mzuri** (ein gutes Kind), **watoto wazuri**, **kitabu kizuri**, **vitabu vizuri**, **nyumba nzuri**. Manche, meist aus dem Arabischen, ändern sich nie: **safi** (sauber), **ghali** (teuer).
  sw-pronouns:
    meaning: "Pronomen; Possessiva -angu, -ako"
    intro: |
      **mimi** (ich), **wewe** (du), **yeye** (er, sie), **sisi** (wir), **ninyi** (ihr), **wao** (sie) — oft weggelassen, da das Verb die Person zeigt. Possessiva richten sich nach dem Besessenen: **kitabu changu** (mein Buch), **vitabu vyangu**, **jina langu** (mein Name), **kaka yangu** (mein Bruder).
  sw-ni:
    meaning: "sein (ni), nicht sein (si), sich befinden (-ko)"
    intro: |
      **ni** (ist, bin, sind) für alle Personen: **Mimi ni mwalimu** (ich bin Lehrer); verneint **si**: **Yeye si mwalimu**. Ort mit Subjektpräfix + **-ko / -po / -mo**: **Kitabu kiko mezani** (das Buch liegt auf dem Tisch), **Yuko nyumbani** (er ist zu Hause). *Haben*: **kuwa na**: **Nina kitabu** (ich habe ein Buch).
  sw-verb:
    meaning: "Subjekt + Tempus + Stamm"
    intro: |
      Ein Verb wird aus Präfixen gebaut: Subjekt (**ni** ich, **u** du, **a** er/sie, **tu** wir, **m** ihr, **wa** sie) + Tempus (**na** jetzt, **li** Vergangenheit, **ta** Zukunft, **me** Perfekt) + Stamm: **ninasoma** (ich lese), **alisoma** (er las), **tutasoma** (wir werden lesen), **wamefika** (sie sind angekommen). Infinitiv **ku-**: **kusoma** (lesen).
  sw-negative:
    meaning: "die Verneinung: ha- und veränderte Tempora"
    intro: |
      Verneinte Subjektpräfixe: **si** (ich nicht), **hu** (du nicht), **ha** (er nicht), **hatu**, **ham**, **hawa**. Das Präsens verliert **-na-** und endet auf **-i**: **sisomi** (ich lese nicht); die Vergangenheit nimmt **-ku-**: **hakusoma** (er las nicht); die Zukunft behält **-ta-**: **hatutasoma**. **Sielewi** = ich verstehe nicht.
  sw-object:
    meaning: "das Objektpräfix"
    intro: |
      Ein Objektpräfix steht direkt vor dem Stamm: **ninakisoma** (ich lese es — das Buch, Klasse ki-), **alinipa zawadi** (er gab mir ein Geschenk), **nakupenda** (ich liebe dich). Bei Personen steht es meist auch neben dem Nomen: **nilimwona Juma** (ich sah Juma).
  sw-questions:
    meaning: "Fragewörter"
    intro: |
      **nini** (was), **nani** (wer), **wapi** (wo), **lini** (wann), **kwa nini** (warum), **vipi / jinsi gani** (wie), **ngapi** (wie viele) — nach dem Verb: **Unakwenda wapi?** (wohin gehst du?). Ja/Nein: steigende Stimme, oder **je** am Anfang: **Je, unasema Kiingereza?** (sprichst du Englisch?)
  sw-ni-locative:
    meaning: "Orte: -ni, katika, kwa"
    intro: |
      **-ni** an einem Nomen macht einen Ort: **meza → mezani** (auf dem / am Tisch), **nyumba → nyumbani** (zu Hause), **jiko → jikoni** (in der Küche). Präpositionen: **katika** (in), **kwa** (mit, per, bei jemandem: **kwa basi** mit dem Bus), **kutoka** (von, aus), **mpaka / hadi** (bis).
  sw-subjunctive:
    meaning: "Konjunktiv und Imperativ"
    intro: |
      Imperativ = der Stamm: **soma!** (lies!), Plural **someni!**; **njoo!** (komm!). Konjunktiv: Subjektpräfix + Stamm auf **-e**: **nisome** (dass ich lese), **tuende** (lass uns gehen), **Nataka usome** (ich will, dass du liest); verneint **-si-**: **usiende** (geh nicht).
  sw-relative:
    meaning: "Relativsätze"
    intro: |
      *Der / welcher* steckt nach Klasse im Verb: **mtu anayesoma** (die Person, die liest), **kitabu ninachosoma** (das Buch, das ich lese). Oder mit **amba-** + Klasse: **mtu ambaye anasoma**, **kitabu ambacho ninasoma**. Konjunktionen: **kwamba** (dass), **kama** (wenn, wie), **kwa sababu** (weil), **lakini** (aber), **ili** (damit).
  sw-extensions:
    meaning: "für, veranlassen, getan werden, einander"
    intro: |
      Suffixe ändern die Bedeutung des Verbs: **-ea / -ia** für jemanden (**somea** vorlesen), **-isha / -esha** veranlassen (**somesha** lehren, lesen lassen), **-wa** Passiv (**somwa** gelesen werden, **pendwa** geliebt werden), **-ana** einander (**pendana** einander lieben), **-ika** -bar sein (**someka** lesbar sein).
  sw-arabic:
    meaning: "Bantu- und arabische Schicht; Abstrakta auf u-"
    intro: |
      Etwa ein Drittel des Wortschatzes stammt aus dem Arabischen (**elimu** Bildung, **habari** Nachricht, **kitabu** Buch, **saa** Stunde), neuere Wörter aus dem Englischen (**sayansi**, **kompyuta**). Abstrakta nehmen **u-**: **uhuru** (Freiheit), **umoja** (Einheit), **utamaduni** (Kultur) — *Uhuru na Umoja* war Tansanias Wahlspruch.
  sw-history:
    meaning: "die arabischschriftliche Vergangenheit, die Klassiker, der Stadtslang"
    intro: |
      Swahili wuchs an der Küste als Handelssprache; seine ersten Gedichte (*Utendi wa Tambuka*, 1728) wurden in arabischer Schrift (*Ajami*) geschrieben, das lateinische Alphabet kam im 19. Jahrhundert. Shaaban Robert (1909–1962) ist sein klassischer Autor. Die Jugend Nairobis spricht **Sheng**, Swahili mit Englisch gemischt: **sasa** (hallo), **poa** (cool).
