id: C2
topics:

- title: {en: History and literature, pt: História e literatura}
  lessons:
  - id: sw-history
    title: ajami, Shaaban Robert, Sheng
    meaning: {en: "the Arabic-script past, the classics, city slang", pt: "o passado em escrita árabe, os clássicos, a gíria urbana"}
    intro:
      en: |
        Swahili grew on the coast as the language of trade; its first poems (*Utendi wa Tambuka*, 1728) were written in Arabic script (*ajami*), the Latin alphabet came in the 19th century. Shaaban Robert (1909–1962) is its classic author. Nairobi youth speak **Sheng**, Swahili mixed with English: **sasa** (hi), **poa** (cool).
      pt: |
        O suaíli cresceu na costa como língua do comércio; seus primeiros poemas (*Utendi wa Tambuka*, 1728) foram escritos em letras árabes (*ajami*), o alfabeto latino chegou no séc. XIX. Shaaban Robert (1909–1962) é seu autor clássico. Os jovens de Nairóbi falam **Sheng**, suaíli misturado com inglês: **sasa** (oi), **poa** (legal).
    examples:
    - ["Kiswahili ni lugha ya Afrika Mashariki.", "Swahili is the language of East Africa.", "O suaíli é a língua da África Oriental.", "Kiswahili"]
    match: {seq: [{word: [kiswahili, lugha, shairi, utenzi, utendi]}]}
    pool: [lugha, kiswahili]
