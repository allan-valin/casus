id: C1
topics:

- title: {en: Learned words, pt: Palavras eruditas}
  lessons:
  - id: sw-arabic
    title: uhuru, elimu, sayansi
    meaning: {en: "Bantu and Arabic layers; abstract u-", pt: "camadas banto e árabe; abstratos em u-"}
    intro:
      en: |
        About a third of the vocabulary comes from Arabic (**elimu** education, **habari** news, **kitabu** book, **saa** hour), newer words from English (**sayansi**, **kompyuta**). Abstracts take **u-**: **uhuru** (freedom), **umoja** (unity), **utamaduni** (culture) — *Uhuru na Umoja* was Tanzania's motto.
      pt: |
        Cerca de um terço do vocabulário vem do árabe (**elimu** educação, **habari** notícias, **kitabu** livro, **saa** hora), palavras mais novas do inglês (**sayansi**, **kompyuta**). Os abstratos levam **u-**: **uhuru** (liberdade), **umoja** (unidade), **utamaduni** (cultura) — *Uhuru na Umoja* foi o lema da Tanzânia.
    examples:
    - ["Uhuru ni haki ya kila mtu.", "Freedom is everyone's right.", "A liberdade é direito de todos.", "Uhuru"]
    match: {seq: [{re: "^u", pos: noun}]}
