id: A2
topics:

- title: {en: More verb forms, pt: Mais formas verbais}
  lessons:
  - id: sw-subjunctive
    title: nisome, tuende, usiende
    meaning: {en: "the subjunctive and the imperative", pt: "o subjuntivo e o imperativo"}
    intro:
      en: |
        Imperative = the stem: **soma!** (read!), plural **someni!**; **njoo!** (come!). Subjunctive: subject prefix + stem ending in **-e**: **nisome** (that I read), **tuende** (let's go), **Nataka usome** (I want you to read); negative **-si-**: **usiende** (don't go).
      pt: |
        Imperativo = o radical: **soma!** (leia!), plural **someni!**; **njoo!** (venha!). Subjuntivo: prefixo de sujeito + radical terminado em **-e**: **nisome** (que eu leia), **tuende** (vamos), **Nataka usome** (quero que você leia); negativo **-si-**: **usiende** (não vá).
    examples:
    - ["Tuende sokoni.", "Let's go to the market.", "Vamos ao mercado.", "Tuende"]
    match: {seq: [{pos: verb, mood: [subj, imp]}]}
