id: B1
topics:

- title: {en: Clauses, pt: Orações}
  lessons:
  - id: sw-relative
    title: -ye, -cho, amba-
    meaning: {en: "relative clauses", pt: "orações relativas"}
    intro:
      en: |
        *Who / which* is built into the verb by class: **mtu anayesoma** (the person who is reading), **kitabu ninachosoma** (the book I'm reading). Or with **amba-** + class: **mtu ambaye anasoma**, **kitabu ambacho ninasoma**. Conjunctions: **kwamba** (that), **kama** (if, like), **kwa sababu** (because), **lakini** (but), **ili** (so that).
      pt: |
        *Que / o qual* se forma dentro do verbo, pela classe: **mtu anayesoma** (a pessoa que está lendo), **kitabu ninachosoma** (o livro que estou lendo). Ou com **amba-** + classe: **mtu ambaye anasoma**, **kitabu ambacho ninasoma**. Conjunções: **kwamba** (que), **kama** (se, como), **kwa sababu** (porque), **lakini** (mas), **ili** (para que).
    examples:
    - ["Mtu ambaye anasoma ni mwalimu.", "The person who is reading is a teacher.", "A pessoa que está lendo é professora.", "ambaye"]
    match: {seq: [{word: [ambaye, ambao, ambacho, ambavyo, ambalo, ambayo, ambazo, kwamba, kama, lakini, ili]}]}
    pool: [ambaye, ambacho, kwamba, kama, lakini]
