id: C2
topics:

- title: {en: Register and variety, pt: Registro e variação}
  lessons:
  - id: nl-c2-archaic
    title: ten, ter, des
    meaning: {en: "old case forms in set phrases", pt: "formas de caso antigas em expressões"}
    intro:
      en: |
        Old dative and genitive survive: **ten** (te + den: *ten slotte, ten minste, ten noorden*), **ter** (te + der: *ter plaatse, ter gelegenheid van*), **des** (*'s morgens, 's avonds, des te beter*), **in dezen**, **van harte**. Recognise them; do not build new ones.
      pt: |
        Restos do dativo e genitivo antigos: **ten** (te + den: *ten slotte* — por fim, *ten minste*, *ten noorden*), **ter** (te + der: *ter plaatse* — no local), **des** (*'s morgens* — de manhã, *'s avonds*, *des te beter* — tanto melhor), **van harte**. Reconheça; não forme novas.
    examples:
    - ["Ten slotte wil ik iedereen bedanken.", "Finally, I want to thank everyone.", "Por fim, quero agradecer a todos.", "Ten"]
    - ["'s Avonds lees ik graag.", "In the evening I like reading.", "À noite gosto de ler.", "Avonds"]
    match: {seq: [{word: [ten, ter, des, "'s"]}]}
    pool: [ten, ter, des, te, de]
  - id: nl-c2-flemish
    title: gij, ge, amai
    meaning: {en: "Belgian Dutch (Flemish)", pt: "o holandês da Bélgica (flamengo)"}
    intro:
      en: |
        In Flanders: **gij / ge** for *jij* (*Hebt ge dat gezien?*), **amai** (wow), **goesting** (desire), **'t is te zeggen** (that is), **allez** (come on), **seffens** (right away), and the soft **g**. Standard spelling and grammar are shared with the Netherlands (Taalunie).
      pt: |
        Na Flandres: **gij / ge** no lugar de *jij* (*Hebt ge dat gezien?*), **amai** (nossa!), **goesting** (vontade), **allez** (vamos!), **seffens** (já, já), e o **g** suave. A ortografia e a gramática padrão são as mesmas da Holanda (Taalunie).
    examples:
    - ["Hebt ge dat gezien?", "Did you see that?", "Você viu isso?", "ge"]
    match: {seq: [{word: [gij, ge, amai, allez, goesting, seffens]}]}
    pool: [gij, ge, jij, je, u]
  - id: nl-c2-false-friends
    title: slim, raar, durven
    meaning: {en: "false friends", pt: "falsos amigos"}
    intro:
      en: |
        **slim** = clever (not thin), **raar** = strange, **durven** = dare, **bellen** = call (on the phone), **kous** = sock, **brutaal** = cheeky, **eventueel** = possibly, **actueel** = current, **bekomen** = recover, **monster** = sample.
      pt: |
        **slim** = esperto, **raar** = estranho (não *raro*), **durven** = ousar (não *durar*), **bellen** = ligar (telefonar), **brutaal** = atrevido (não *brutal*), **eventueel** = possivelmente (não *eventual*), **actueel** = atual, **monster** = amostra, **lekker** = gostoso.
    examples:
    - ["Wat een raar verhaal!", "What a strange story!", "Que história estranha!", "raar"]
    match: {seq: [{word: [slim, raar, rare, durven, durf, durft, bellen, bel, belt, brutaal, eventueel, actueel]}]}
    pool: [slim, raar, durf, bel, brutaal, eventueel]
