# Arabic text of the Dutch course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Basics: "الأساسيات"
  The past: "الماضي"
  Separable verbs and modals: "الأفعال المنفصلة والمساعدة"
lessons:
  nl-articles:
    meaning: "أدوات التعريف"
    intro: |
      **de** لأسماء الجنس المشترك ولكل الجموع (de man، de vrouw، de huizen)، و**het** للمفرد المحايد (het huis، het kind) ولكل صيغ التصغير (het meisje). و**een** = أداة التنكير. نحو ثلثي الأسماء يأخذ *de*؛ ويجب حفظ جنس كل اسم.
  nl-zijn-hebben:
    meaning: "zijn وhebben"
    intro: |
      **zijn** (يكون): ik ben، jij bent (bent jij?)، hij/zij/het is، wij/jullie/zij zijn، u bent. **hebben** (يملك): ik heb، jij hebt (heb jij?)، hij heeft، wij hebben. انتبه: في السؤال يسقط **-t** من الفعل قبل *jij*: **Ben jij…? Heb jij…? Loop jij…?**
  nl-present:
    meaning: "المضارع"
    intro: |
      الجذر + لا شيء / **-t** / **-en**: **ik werk، jij werkt، hij werkt، wij werken**. والجذر هو المصدر بلا *-en*، مع تعديل الإملاء: **lopen → ik loop** (يُضاعف الصائت الطويل)، **zitten → ik zit** (يُبسَّط الصامت المضاعف)، **leven → ik leef** (v → f)، **reizen → ik reis** (z → s).
  nl-word-order:
    meaning: "الفعل في الموضع الثاني"
    intro: |
      في الجملة الرئيسية يكون الفعل المصرّف دائمًا **العنصر الثاني**: **Ik ga morgen naar huis → Morgen ga ik naar huis.** ويتأخر الفاعل بعد الفعل إذا تقدّم شيء آخر. والمصادر وأسماء المفعول تذهب إلى **آخر** الجملة: **Ik wil morgen naar huis gaan.**
  nl-niet-geen:
    meaning: "النفي: niet وgeen"
    intro: |
      **geen** تنفي اسمًا مع *een* أو بلا أداة: **Ik heb geen auto.** «ليست عندي سيارة». **Hij drinkt geen koffie.** و**niet** تنفي كل ما سواه، وغالبًا في آخر الجملة: **Ik kom niet. Het boek is niet goed. Ik ken hem niet.**
  nl-perfect:
    meaning: "الماضي التام"
    intro: |
      **hebben / zijn** + اسم المفعول في الآخر: **Ik heb gewerkt. Ik ben naar huis gegaan.** واسم المفعول الضعيف **ge- + الجذر + -t / -d**: قاعدة *'t kofschip* — الجذور المنتهية بـ t، k، f، s، ch، p تأخذ **-t** (gewerkt، gefietst)، وغيرها **-d** (gewoond). وأفعال الحركة إلى مكان وتغيّر الحال تأخذ **zijn** (gekomen، gebleven، gestorven).
  nl-imperfect:
    meaning: "الماضي البسيط"
    intro: |
      الأفعال الضعيفة: الجذر + **-te(n)** بعد صوامت 't kofschip، وإلا **-de(n)**: **werkte، woonde، werkten**. والأفعال القوية تغيّر صائتها: **gaan → ging، komen → kwam، zijn → was / waren، hebben → had، zien → zag، doen → deed، eten → at**. للقصص والوصف؛ والتام للوقائع المفردة.
  nl-separable:
    meaning: "الأفعال المنفصلة"
    intro: |
      السوابق المنبورة (**op، aan، uit، mee، af، terug، weg، in، door، over**) تنفصل في الجملة الرئيسية وتذهب إلى الآخر: **opbellen → Ik bel je morgen op.** «سأتصل بك غدًا». **meegaan → Ga je mee?** وتتصل في المصدر واسم المفعول: **Ik wil je opbellen. Ik heb je opgebeld.**
  nl-modals:
    meaning: "الأفعال المساعدة"
    intro: |
      **kunnen** (استطاع: ik kan، jij kunt/kan)، **willen** (أراد: ik wil، hij wil)، **moeten** (وجب: ik moet)، **mogen** (جاز: ik mag)، **zullen** (سوف: ik zal). والمصدر يذهب إلى الآخر: **Ik kan morgen niet komen.** و«لا يلزم» هي **hoeven niet te**: **Je hoeft niet te komen.**
  nl-er:
    meaning: "استعمالات er الكثيرة"
    intro: |
      **er** = هناك (**Ik woon er al jaren**)، وفاعل شكلي (**Er staat een man voor de deur** «يقف رجل أمام الباب»)، و«منها» مع الأعداد (**Ik heb er drie**)، ومع حروف الجر = ذلك (**ervan، erop، ermee**: **Ik denk erover na**).
