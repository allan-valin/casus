# German text of the Dutch course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Basics: "Grundlagen"
  The past: "Die Vergangenheit"
  Separable verbs and modals: "Trennbare Verben und Modalverben"
lessons:
  nl-articles:
    meaning: "die Artikel"
    intro: |
      **de** für Nomen des gemeinsamen Genus (Maskulinum + Femininum) und alle Plurale (de man, de vrouw, de huizen), **het** für neutrale Singulare (het huis, het kind) und alle Diminutive (het meisje — wie deutsch *das Mädchen*). **een** = ein / eine. Etwa zwei Drittel der Nomen nehmen *de*; das Genus muss man für jedes Nomen lernen, und es stimmt nicht immer mit dem Deutschen überein.
  nl-zijn-hebben:
    meaning: "zijn und hebben"
    intro: |
      **zijn**: ik ben, jij bent (bent jij?), hij/zij/het is, wij/jullie/zij zijn, u bent. **hebben**: ik heb, jij hebt (heb jij?), hij heeft, wij hebben. Achtung: in Fragen verliert das Verb vor *jij* das **-t**: **Ben jij…? Heb jij…? Loop jij…?**
  nl-present:
    meaning: "das Präsens"
    intro: |
      Stamm + nichts / **-t** / **-en**: **ik werk, jij werkt, hij werkt, wij werken**. Der Stamm ist der Infinitiv minus *-en*, mit Schreibanpassung: **lopen → ik loop** (langer Vokal verdoppelt), **zitten → ik zit** (Doppelkonsonant vereinfacht), **leven → ik leef** (v → f), **reizen → ik reis** (z → s).
  nl-word-order:
    meaning: "Verbzweitstellung"
    intro: |
      Im Hauptsatz steht das konjugierte Verb immer an **zweiter Stelle** — genau wie im Deutschen: **Ik ga morgen naar huis → Morgen ga ik naar huis.** Infinitive und Partizipien stehen am **Ende**: **Ik wil morgen naar huis gaan.**
  nl-niet-geen:
    meaning: "Verneinung: niet und geen"
    intro: |
      **geen** verneint ein Nomen mit *een* oder ohne Artikel — wie deutsch *kein*: **Ik heb geen auto. Hij drinkt geen koffie.** **niet** verneint alles andere, meist spät im Satz — wie *nicht*: **Ik kom niet. Het boek is niet goed. Ik ken hem niet.**
  nl-perfect:
    meaning: "das Perfekt"
    intro: |
      **hebben / zijn** + Partizip am Ende: **Ik heb gewerkt. Ik ben naar huis gegaan.** Schwaches Partizip **ge- + Stamm + -t / -d**: die *'t kofschip*-Regel — Stämme auf t, k, f, s, ch, p nehmen **-t** (gewerkt, gefietst), andere **-d** (gewoond). Verben der Bewegung zu einem Ziel und der Zustandsveränderung nehmen **zijn** (gekomen, gebleven, gestorven) — fast wie im Deutschen.
  nl-imperfect:
    meaning: "das Präteritum"
    intro: |
      Schwache Verben: Stamm + **-te(n)** nach 't-kofschip-Konsonanten, sonst **-de(n)**: **werkte, woonde, werkten**. Starke Verben ändern den Vokal: **gaan → ging, komen → kwam, zijn → was / waren, hebben → had, zien → zag, doen → deed, eten → at**. Für Erzählungen und Beschreibungen; das Perfekt für einzelne Tatsachen.
  nl-separable:
    meaning: "trennbare Verben"
    intro: |
      Betonte Präfixe (**op, aan, uit, mee, af, terug, weg, in, door, over**) trennen sich im Hauptsatz ab und gehen ans Ende — wie im Deutschen: **opbellen → Ik bel je morgen op. meegaan → Ga je mee?** Zusammen im Infinitiv und Partizip: **Ik wil je opbellen. Ik heb je opgebeld.**
  nl-modals:
    meaning: "Modalverben"
    intro: |
      **kunnen** (können: ik kan, jij kunt/kan), **willen** (wollen: ik wil, hij wil), **moeten** (müssen: ik moet), **mogen** (dürfen: ik mag), **zullen** (werden/sollen: ik zal). Der Infinitiv steht am Ende: **Ik kan morgen niet komen.** *nicht müssen* heißt **hoeven niet te** — wie deutsch *nicht brauchen zu*: **Je hoeft niet te komen.**
  nl-er:
    meaning: "die vielen Gebrauchsweisen von er"
    intro: |
      **er** = dort (**Ik woon er al jaren**), Platzhalter-Subjekt — wie deutsch *es* (**Er staat een man voor de deur**), „davon“ bei Zahlen (**Ik heb er drie**) und mit Präpositionen = es (**ervan, erop, ermee** — wie *davon, darauf, damit*: **Ik denk erover na**).
