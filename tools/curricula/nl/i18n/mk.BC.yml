# Macedonian text of the Dutch course, B1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Subordinate clauses: "Зависни реченици"
  Adjectives and comparison: "Придавки и споредба"
  Future and passive: "Идно и пасив"
  Verb clusters and conditionals: "Глаголски групи и условен"
  Pronominal adverbs and reflexives: "Заменски прилози и повратни"
  Connectors: "Сврзници"
  Nuance: "Нијанси"
  Fixed expressions: "Цврсти изрази"
  Register and variety: "Регистар и варијанти"
lessons:
  nl-sub-order:
    meaning: "глаголот на крај во зависни реченици"
    intro: |
      По **dat, omdat, als, wanneer, toen, terwijl, voordat, nadat, hoewel, of, zodat** менливиот глагол оди на **крајот**: **Ik blijf thuis omdat ik moe ben.** „Останувам дома затоа што сум уморен.“ **Ik weet niet of hij komt.** Напоредните **want, maar, en, of** го задржуваат нормалниот ред: **…want ik ben moe.**
  nl-als-toen-wanneer:
    meaning: "кога: als, toen, wanneer"
    intro: |
      **toen** = кога, еден настан во минатото (**Toen ik jong was…**); **als** = кога / секогаш кога / ако, сегашност и иднина (**Als het regent, blijf ik thuis**); **wanneer** = кога, во прашања и како официјално *als* (**Wanneer kom je?**).
  nl-relative:
    meaning: "релативни заменки"
    intro: |
      **die** за *de*-зборови и множини, **dat** за *het*-зборови: **de man die daar staat, het huis dat ik koop.** Со предлог: луѓе **met wie**, работи **waar + предлог**: **de pen waarmee ik schrijf, het huis waarin ik woon.** **wat** по *alles, iets, niets* и суперлативи.
  nl-adj-e:
    meaning: "наставката -e на придавката"
    intro: |
      Пред именка придавката зема **-e** — освен со *het*-именка во еднина по **een, geen** или без ништо: **de grote man, het grote huis, grote huizen**, но **een groot huis, geen groot probleem, groot geld**. По именката (прирок) никогаш: **Het huis is groot.**
  nl-comparison:
    meaning: "компаратив и суперлатив"
    intro: |
      **-er** (+ **dan** „од“) и **-st**: **groot, groter, grootst; mooi, mooier, mooist**; по *r* се додава **-der**: **duur → duurder**. Неправилни: **goed, beter, best; veel, meer, meest; weinig, minder, minst; graag, liever, liefst**. **even … als** = исто толку … колку.
  nl-diminutive:
    meaning: "деминутиви"
    intro: |
      **-je** (huisje), **-tje** по самогласка или по l, n, r по долга самогласка (stoeltje), **-pje** по m (boompje), **-etje** по кратка самогласка + l, m, n, r, ng (balletje), **-kje** (koninkje). Секогаш **het**. Многу чести, често само пријателски — како **-че**: **een kopje koffie, even een momentje.**
  nl-future:
    meaning: "идното"
    intro: |
      **gaan** + инфинитив за планови (**Ik ga morgen verhuizen**), **zullen** за ветувања, предвидувања и понуди (**Ik zal je helpen. Zal ik het raam openen?** „Да го отворам прозорецот?“). Многу често само сегашно со временски збор: **Morgen werk ik thuis.**
  nl-passive:
    meaning: "пасивот"
    intro: |
      **worden** + партицип за дејството (**Het huis wordt gebouwd**; минато **werd gebouwd**), **zijn** + партицип за перфектот (**Het huis is gebouwd**). Вршител со **door**. Безличен пасив со **er**: **Er wordt gedanst.** „Се танцува.“
  nl-b2-zou:
    meaning: "условен: zou и нереалното минато"
    intro: |
      **zou(den)** + инфинитив = би: **Ik zou graag komen. Als ik rijk was, zou ik reizen.** „Да бев богат, би патувал.“ Нереално минато: **had / was** + партицип (+ **zou … hebben**): **Als ik het had geweten, was ik gekomen.** И учтиво: **Zou je het raam willen openen?**
  nl-b2-double-inf:
    meaning: "двоен инфинитив"
    intro: |
      Модален глагол или *laten, gaan, blijven, zien, horen* во перфект зема **инфинитив** наместо партицип: **Ik heb niet kunnen komen.** „Не можев да дојдам.“ **Ik heb mijn haar laten knippen. Hij is blijven zitten.** Во зависни реченици глаголите се собираат на крајот: **…omdat ik niet heb kunnen komen.**
  nl-b2-te:
    meaning: "te + инфинитив"
    intro: |
      **om … te** = за да: **Ik ga naar de winkel om brood te kopen.** **zonder … te** = без да: **Hij vertrok zonder iets te zeggen.** По многу глаголи и придавки само **te**: **Het is moeilijk te zeggen. Ik probeer te slapen.** **aan het** + инфинитив = во тек: **Ik ben aan het koken.** „Готвам (во моментов).“
  nl-b2-daar-prep:
    meaning: "заменски прилози"
    intro: |
      Предлозите не земаат *het / dat / wat* за работи, туку **daar / hier / waar / er + предлог**: **Ik denk daaraan** (мислам на тоа), **Waar praat je over?** (за што зборуваш?), **Hiermee kun je schrijven.** Често се делат: **Daar weet ik niets van.**
  nl-b2-reflexive:
    meaning: "повратни глаголи"
    intro: |
      **me, je, zich, ons, je, zich**: **Ik vergis me. Hij herinnert zich alles. Wij vervelen ons.** Многу се повратни како и во македонскиот: **zich haasten** (се брза), **zich schamen** (се срами), **zich voelen** (се чувствува). **zichzelf** за нагласување.
  nl-b2-adverb-connectors:
    meaning: "прилози што сврзуваат реченици (глагол на второ!)"
    intro: |
      **daarom** (затоа), **dus** (значи), **toch** (сепак), **echter** (меѓутоа), **bovendien** (освен тоа), **anders** (инаку), **daarna** (потоа). Како прв елемент го повлекуваат глаголот на второ место: **Het regent, daarom blijf ik thuis.**
  nl-c1-particles:
    meaning: "модални честички"
    intro: |
      Мали зборови што го даваат тонот: **even** (малку, набрзина: *Kom even hier*), **maar** (слободно: *Kom maar binnen*), **eens** (еднаш, ублажување: *Kijk eens!*), **toch** (секако, прекор: *Je komt toch?*), **wel** (спротивставување на негација: *Ik kom wel*), **hoor** (смирување: *Het is goed, hoor*). Се комбинираат: *Kom maar eens even kijken.*
  nl-c1-word-order-focus:
    meaning: "истакнување напред за нагласување"
    intro: |
      Секој елемент може да ја отвори главната реченица за контраст или тема, глаголот и понатаму втор: **Dat boek heb ik nooit gelezen. Mooi is het niet. Hem ken ik niet.** Во говорот дури и подметот отпаѓа по истакнат предмет: **Weet ik niet.**
  nl-c1-nominal:
    meaning: "официјален, номинален стил"
    intro: |
      Официјалниот холандски ги претвора глаголите во именки: **-ing** (verbeteren → de verbetering), инфинитивот (**het lezen**), **-atie, -heid, -nis** (de organisatie, de mogelijkheid, de kennis). **Ter verbetering van…** (за подобрување), **met betrekking tot** (во врска со), **naar aanleiding van** (по повод).
  nl-c1-idioms:
    meaning: "чести идиоми"
    intro: |
      **met de deur in huis vallen** (директно на поентата), **de kat uit de boom kijken** (почекај и види), **ergens geen kaas van gegeten hebben** (немаш поим за нешто), **iemand in de maling nemen** (да се шегуваш со некого), **het zal wel** (нека биде), **lekker** (убаво — за храна, време, сон, сѐ).
  nl-c2-archaic:
    meaning: "стари падежни форми во цврсти изрази"
    intro: |
      Стариот датив и генитив опстојуваат: **ten** (te + den: *ten slotte, ten minste, ten noorden*), **ter** (te + der: *ter plaatse, ter gelegenheid van*), **des** (*'s morgens, 's avonds, des te beter*), **in dezen**, **van harte**. Препознавај ги; не гради нови.
  nl-c2-flemish:
    meaning: "белгиски холандски (фламански)"
    intro: |
      Во Фландрија: **gij / ge** наместо *jij* (*Hebt ge dat gezien?*), **amai** (леле), **goesting** (желба), **'t is te zeggen** (односно), **allez** (ајде), **seffens** (веднаш), и мекото **g**. Стандардниот правопис и граматика се заеднички со Холандија (Taalunie).
  nl-c2-false-friends:
    meaning: "лажни пријатели"
    intro: |
      **slim** = паметен (не „слаб“ како англиското slim), **raar** = чуден, **durven** = се осмелува, **bellen** = се јавува (по телефон), **kous** = чорап, **brutaal** = дрзок (не брутален), **eventueel** = евентуално, можеби, **actueel** = актуелен, **bekomen** = се опоравува, **monster** = мостра, примерок.
