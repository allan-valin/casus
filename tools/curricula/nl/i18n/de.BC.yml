# German text of the Dutch course, B1–C2 — translated by AI (Claude) from the English (2026-10-20); the false-friends lesson lists German traps
topics:
  Subordinate clauses: "Nebensätze"
  Adjectives and comparison: "Adjektive und Steigerung"
  Future and passive: "Futur und Passiv"
  Verb clusters and conditionals: "Verbcluster und Konditional"
  Pronominal adverbs and reflexives: "Pronominaladverbien und Reflexiva"
  Connectors: "Konnektoren"
  Nuance: "Nuancen"
  Fixed expressions: "Feste Wendungen"
  Register and variety: "Register und Varietäten"
lessons:
  nl-sub-order:
    meaning: "Verbendstellung im Nebensatz"
    intro: |
      Nach **dat, omdat, als, wanneer, toen, terwijl, voordat, nadat, hoewel, of, zodat** steht das konjugierte Verb am **Ende** — wie im Deutschen: **Ik blijf thuis omdat ik moe ben. Ik weet niet of hij komt.** Die nebenordnenden **want, maar, en, of** behalten die normale Stellung: **…want ik ben moe.**
  nl-als-toen-wanneer:
    meaning: "wenn / als: als, toen, wanneer"
    intro: |
      **toen** = als, ein Ereignis in der Vergangenheit (**Toen ik jong was…**); **als** = wenn / immer wenn / falls, Gegenwart und Zukunft (**Als het regent, blijf ik thuis**); **wanneer** = wann in Fragen, und förmliches *als* (**Wanneer kom je?**). Vorsicht: niederländisch *als* ≠ deutsch *als* in der Vergangenheit.
  nl-relative:
    meaning: "Relativpronomen"
    intro: |
      **die** für *de*-Wörter und Plurale, **dat** für *het*-Wörter: **de man die daar staat, het huis dat ik koop.** Mit Präposition: Personen **met wie**, Sachen **waar + Präposition** (wie deutsch *womit, worin*): **de pen waarmee ik schrijf, het huis waarin ik woon.** **wat** nach *alles, iets, niets* und Superlativen.
  nl-adj-e:
    meaning: "die Adjektivendung -e"
    intro: |
      Vor einem Nomen nimmt das Adjektiv **-e** — außer bei einem *het*-Nomen im Singular nach **een, geen** oder ohne Begleiter: **de grote man, het grote huis, grote huizen**, aber **een groot huis, geen groot probleem, groot geld**. Nach dem Nomen (prädikativ) nie: **Het huis is groot.** Viel einfacher als die deutsche Adjektivdeklination.
  nl-comparison:
    meaning: "Komparativ und Superlativ"
    intro: |
      **-er** (+ **dan**) und **-st**: **groot, groter, grootst; mooi, mooier, mooist**; nach *r* **-der**: **duur → duurder**. Unregelmäßig: **goed, beter, best; veel, meer, meest; weinig, minder, minst; graag, liever, liefst** (wie *gern, lieber, am liebsten*). **even … als** = so … wie.
  nl-diminutive:
    meaning: "Diminutive"
    intro: |
      **-je** (huisje), **-tje** nach Vokal oder nach l, n, r hinter langem Vokal (stoeltje), **-pje** nach m (boompje), **-etje** nach kurzem Vokal + l, m, n, r, ng (balletje), **-kje** (koninkje). Immer **het** — wie deutsch *-chen*. Sehr häufig, oft nur freundlich: **een kopje koffie, even een momentje.**
  nl-future:
    meaning: "das Futur"
    intro: |
      **gaan** + Infinitiv für Pläne (**Ik ga morgen verhuizen**), **zullen** für Versprechen, Vorhersagen und Angebote (**Ik zal je helpen. Zal ik het raam openen?** „Soll ich das Fenster öffnen?“). Sehr oft einfach Präsens mit Zeitangabe: **Morgen werk ik thuis.**
  nl-passive:
    meaning: "das Passiv"
    intro: |
      **worden** + Partizip für die Handlung (**Het huis wordt gebouwd**; Vergangenheit **werd gebouwd**), **zijn** + Partizip für das Perfekt (**Het huis is gebouwd** = *ist gebaut worden*). Urheber mit **door**. Unpersönliches Passiv mit **er**: **Er wordt gedanst.** „Es wird getanzt.“
  nl-b2-zou:
    meaning: "Konditional: zou und die irreale Vergangenheit"
    intro: |
      **zou(den)** + Infinitiv = würde: **Ik zou graag komen. Als ik rijk was, zou ik reizen.** Irreale Vergangenheit: **had / was** + Partizip (+ **zou … hebben**): **Als ik het had geweten, was ik gekomen.** Auch höflich: **Zou je het raam willen openen?**
  nl-b2-double-inf:
    meaning: "Ersatzinfinitiv"
    intro: |
      Ein Modalverb oder *laten, gaan, blijven, zien, horen* im Perfekt nimmt den **Infinitiv** statt des Partizips — wie deutsch *ich habe nicht kommen können*: **Ik heb niet kunnen komen. Ik heb mijn haar laten knippen. Hij is blijven zitten.** Im Nebensatz stehen die Verben gebündelt am Ende, aber in anderer Reihenfolge als im Deutschen: **…omdat ik niet heb kunnen komen.**
  nl-b2-te:
    meaning: "te + Infinitiv"
    intro: |
      **om … te** = um … zu: **Ik ga naar de winkel om brood te kopen.** **zonder … te** = ohne … zu: **Hij vertrok zonder iets te zeggen.** Nach vielen Verben und Adjektiven nur **te**: **Het is moeilijk te zeggen. Ik probeer te slapen.** **aan het** + Infinitiv = gerade dabei: **Ik ben aan het koken.** „Ich bin am Kochen.“
  nl-b2-daar-prep:
    meaning: "Pronominaladverbien"
    intro: |
      Präpositionen nehmen bei Sachen kein *het / dat / wat*, sondern **daar / hier / waar / er + Präposition** — wie deutsch *daran, worüber, hiermit*: **Ik denk daaraan, Waar praat je over?, Hiermee kun je schrijven.** Sie werden oft getrennt: **Daar weet ik niets van.** „Davon weiß ich nichts.“
  nl-b2-reflexive:
    meaning: "reflexive Verben"
    intro: |
      **me, je, zich, ons, je, zich**: **Ik vergis me. Hij herinnert zich alles. Wij vervelen ons.** Viele sind wie im Deutschen reflexiv: **zich haasten** (sich beeilen), **zich schamen** (sich schämen), **zich voelen** (sich fühlen). **zichzelf** zur Betonung.
  nl-b2-adverb-connectors:
    meaning: "Adverbien, die Sätze verbinden (Verbzweit!)"
    intro: |
      **daarom** (darum), **dus** (also), **toch** (doch), **echter** (jedoch), **bovendien** (außerdem), **anders** (sonst), **daarna** (danach). Als erstes Element lösen sie Verbzweitstellung aus — wie im Deutschen: **Het regent, daarom blijf ik thuis.**
  nl-c1-particles:
    meaning: "Modalpartikeln"
    intro: |
      Kleine Wörter, die den Ton setzen — wie deutsch *mal, ruhig, doch, ja*: **even** (mal, kurz: *Kom even hier*), **maar** (ruhig: *Kom maar binnen*), **eens** (mal, abschwächend: *Kijk eens!*), **toch** (doch, Vorwurf: *Je komt toch?*), **wel** (widerspricht einer Verneinung: *Ik kom wel*), **hoor** (Beruhigung: *Het is goed, hoor*). Sie kombinieren sich: *Kom maar eens even kijken.*
  nl-c1-word-order-focus:
    meaning: "Voranstellung zur Hervorhebung"
    intro: |
      Jedes Element kann den Hauptsatz zur Kontrastierung oder als Thema eröffnen, das Verb bleibt an zweiter Stelle: **Dat boek heb ik nooit gelezen. Mooi is het niet. Hem ken ik niet.** Gesprochen fällt nach einem vorangestellten Objekt sogar das Subjekt weg: **Weet ik niet.** „Weiß ich nicht.“
  nl-c1-nominal:
    meaning: "förmlicher Nominalstil"
    intro: |
      Förmliches Niederländisch macht aus Verben Nomen: **-ing** (verbeteren → de verbetering, wie *-ung*), der Infinitiv (**het lezen**), **-atie, -heid, -nis** (de organisatie, de mogelijkheid, de kennis). **Ter verbetering van…** (zur Verbesserung), **met betrekking tot** (bezüglich), **naar aanleiding van** (anlässlich).
  nl-c1-idioms:
    meaning: "häufige Redewendungen"
    intro: |
      **met de deur in huis vallen** (mit der Tür ins Haus fallen), **de kat uit de boom kijken** (abwarten), **ergens geen kaas van gegeten hebben** (keine Ahnung von etwas haben), **iemand in de maling nemen** (jemanden auf den Arm nehmen), **het zal wel** (na ja, wenn du meinst), **lekker** (schön — für Essen, Wetter, Schlaf, alles).
  nl-c2-archaic:
    meaning: "alte Kasusformen in festen Wendungen"
    intro: |
      Alter Dativ und Genitiv leben weiter: **ten** (te + den: *ten slotte, ten minste, ten noorden*), **ter** (te + der: *ter plaatse, ter gelegenheid van*), **des** (*'s morgens, 's avonds, des te beter* — wie *morgens, desto besser*), **in dezen**, **van harte**. Erkennen, aber keine neuen bilden.
  nl-c2-flemish:
    meaning: "belgisches Niederländisch (Flämisch)"
    intro: |
      In Flandern: **gij / ge** für *jij* (*Hebt ge dat gezien?*), **amai** (Wahnsinn!), **goesting** (Lust), **'t is te zeggen** (das heißt), **allez** (komm schon), **seffens** (gleich), und das weiche **g**. Rechtschreibung und Grammatik sind mit den Niederlanden gemeinsam (Taalunie).
  nl-c2-false-friends:
    meaning: "falsche Freunde für Deutschsprachige"
    intro: |
      **slim** = klug (nicht schlimm: *erg*), **raar** = seltsam (nicht selten: *zelden*), **durven** = sich trauen (nicht dürfen: *mogen*), **bellen** = anrufen (nicht bellen: *blaffen*), **bekomen** = sich erholen (nicht bekommen: *krijgen*), **meer** = See (und **zee** = Meer!), **winkel** = Laden (nicht Winkel: *hoek*), **doof** = taub (nicht doof: *stom*), **kast** = Schrank, **monster** = Probe, Muster. Das englische Original listet hier Fallen für Englischsprechende.
