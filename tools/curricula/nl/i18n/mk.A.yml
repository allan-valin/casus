# Macedonian text of the Dutch course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Basics: "Основи"
  The past: "Минатото"
  Separable verbs and modals: "Одделни глаголи и модални"
lessons:
  nl-articles:
    meaning: "членовите"
    intro: |
      **de** за именки од заеднички род и сите множини (de man, de vrouw, de huizen), **het** за еднина од среден род (het huis, het kind) и сите деминутиви (het meisje „девојчето“). **een** = еден / една. Околу две третини од именките земаат *de*; родот на секоја именка мора да се научи. Членот стои пред именката.
  nl-zijn-hebben:
    meaning: "zijn и hebben"
    intro: |
      **zijn** (е, сум): ik ben, jij bent (bent jij?), hij/zij/het is, wij/jullie/zij zijn, u bent. **hebben** (има): ik heb, jij hebt (heb jij?), hij heeft, wij hebben. Внимание: во прашања, пред *jij* глаголот го губи **-t**: **Ben jij…? Heb jij…? Loop jij…?**
  nl-present:
    meaning: "сегашното време"
    intro: |
      Основа + ништо / **-t** / **-en**: **ik werk, jij werkt, hij werkt, wij werken**. Основата е инфинитивот без *-en*, со правописни промени: **lopen → ik loop** (долгата самогласка се удвојува), **zitten → ik zit** (двојната согласка се упростува), **leven → ik leef** (v → f), **reizen → ik reis** (z → s).
  nl-word-order:
    meaning: "глаголот на второ место"
    intro: |
      Во главна реченица менливиот глагол е секогаш **втор елемент**: **Ik ga morgen naar huis → Morgen ga ik naar huis.** Подметот оди по глаголот кога нешто друго е прво. Инфинитивите и партиципите одат на **крајот**: **Ik wil morgen naar huis gaan.**
  nl-niet-geen:
    meaning: "негација: niet и geen"
    intro: |
      **geen** негира именка со *een* или без член: **Ik heb geen auto.** „Немам кола.“ **Hij drinkt geen koffie.** **niet** негира сè друго, обично доцна во реченицата: **Ik kom niet. Het boek is niet goed. Ik ken hem niet.**
  nl-perfect:
    meaning: "перфектот"
    intro: |
      **hebben / zijn** + партицип на крајот: **Ik heb gewerkt. Ik ben naar huis gegaan.** Слаб партицип **ge- + основа + -t / -d**: правилото *'t kofschip* — основите на t, k, f, s, ch, p земаат **-t** (gewerkt, gefietst), другите **-d** (gewoond). Глаголите на движење кон место и промена на состојба земаат **zijn** (gekomen, gebleven, gestorven).
  nl-imperfect:
    meaning: "простото минато"
    intro: |
      Слаби глаголи: основа + **-te(n)** по согласките од 't kofschip, инаку **-de(n)**: **werkte, woonde, werkten**. Силните глаголи ја менуваат самогласката: **gaan → ging, komen → kwam, zijn → was / waren, hebben → had, zien → zag, doen → deed, eten → at**. За приказни и описи; перфектот за поединечни факти.
  nl-separable:
    meaning: "одделни глаголи"
    intro: |
      Нагласените префикси (**op, aan, uit, mee, af, terug, weg, in, door, over**) се одвојуваат во главна реченица и одат на крајот: **opbellen → Ik bel je morgen op.** „Ќе ти се јавам утре.“ **meegaan → Ga je mee?** Заедно во инфинитивот и партиципот: **Ik wil je opbellen. Ik heb je opgebeld.**
  nl-modals:
    meaning: "модални глаголи"
    intro: |
      **kunnen** (може: ik kan, jij kunt/kan), **willen** (сака: ik wil, hij wil), **moeten** (мора: ik moet), **mogen** (смее: ik mag), **zullen** (ќе: ik zal). Инфинитивот оди на крајот: **Ik kan morgen niet komen.** *не мора* е **hoeven niet te**: **Je hoeft niet te komen.**
  nl-er:
    meaning: "многуте употреби на er"
    intro: |
      **er** = таму (**Ik woon er al jaren**), формален подмет (**Er staat een man voor de deur** „Пред вратата стои човек“), „од нив“ со броеви (**Ik heb er drie**), и со предлози = тоа (**ervan, erop, ermee**: **Ik denk erover na**).
