# Arabic text of the Dutch course, B1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Subordinate clauses: "الجمل التابعة"
  Adjectives and comparison: "الصفات والمقارنة"
  Future and passive: "المستقبل والمجهول"
  Verb clusters and conditionals: "تجمّع الأفعال والشرطي"
  Pronominal adverbs and reflexives: "الظروف الضميرية والانعكاسية"
  Connectors: "أدوات الربط"
  Nuance: "الفروق الدقيقة"
  Fixed expressions: "العبارات الثابتة"
  Register and variety: "المستوى والتنوع"
lessons:
  nl-sub-order:
    meaning: "الفعل في الآخر في الجمل التابعة"
    intro: |
      بعد **dat، omdat، als، wanneer، toen، terwijl، voordat، nadat، hoewel، of، zodat** يذهب الفعل المصرّف إلى **الآخر**: **Ik blijf thuis omdat ik moe ben.** «أبقى في البيت لأني متعب». **Ik weet niet of hij komt.** وأدوات العطف **want، maar، en، of** تبقي الترتيب العادي: **…want ik ben moe.**
  nl-als-toen-wanneer:
    meaning: "حين: als، toen، wanneer"
    intro: |
      **toen** = حين، لحدث واحد في الماضي (**Toen ik jong was…**)؛ و**als** = حين / كلما / إذا، للحاضر والمستقبل (**Als het regent, blijf ik thuis**)؛ و**wanneer** = متى في الأسئلة، وصيغة رسمية لـ *als* (**Wanneer kom je?**).
  nl-relative:
    meaning: "أسماء الموصول"
    intro: |
      **die** لكلمات *de* والجموع، و**dat** لكلمات *het*: **de man die daar staat، het huis dat ik koop.** ومع حرف الجر: للعاقل **met wie**، ولغيره **waar + حرف الجر**: **de pen waarmee ik schrijf، het huis waarin ik woon.** و**wat** بعد *alles، iets، niets* والتفضيل.
  nl-adj-e:
    meaning: "لاحقة الصفة -e"
    intro: |
      قبل الاسم تأخذ الصفة **-e** — إلا مع اسم *het* مفرد بعد **een، geen** أو بلا شيء: **de grote man، het grote huis، grote huizen**، لكن **een groot huis، geen groot probleem، groot geld**. وبعد الاسم (خبرًا) لا تأخذها أبدًا: **Het huis is groot.**
  nl-comparison:
    meaning: "المقارنة والتفضيل"
    intro: |
      **-er** (+ **dan** «من») و**-st**: **groot، groter، grootst؛ mooi، mooier، mooist**؛ وبعد *r* تُضاف **-der**: **duur → duurder**. والشاذ: **goed، beter، best؛ veel، meer، meest؛ weinig، minder، minst؛ graag، liever، liefst**. و**even … als** = بقدر.
  nl-diminutive:
    meaning: "التصغير"
    intro: |
      **-je** (huisje)، و**-tje** بعد الصائت أو بعد l وn وr التالية لصائت طويل (stoeltje)، و**-pje** بعد m (boompje)، و**-etje** بعد صائت قصير + l، m، n، r، ng (balletje)، و**-kje** (koninkje). ودائمًا **het**. شائع جدًا، وكثيرًا ما يكون للود فقط: **een kopje koffie، even een momentje.**
  nl-future:
    meaning: "المستقبل"
    intro: |
      **gaan** + المصدر للخطط (**Ik ga morgen verhuizen**)، و**zullen** للوعود والتوقعات والعروض (**Ik zal je helpen. Zal ik het raam openen?** «هل أفتح النافذة؟»). وكثيرًا ما يكفي المضارع مع كلمة زمن: **Morgen werk ik thuis.**
  nl-passive:
    meaning: "المبني للمجهول"
    intro: |
      **worden** + اسم المفعول للحدث (**Het huis wordt gebouwd**؛ والماضي **werd gebouwd**)، و**zijn** + اسم المفعول للتام (**Het huis is gebouwd**). والفاعل بـ **door**. والمجهول غير الشخصي بـ **er**: **Er wordt gedanst.** «يُرقص».
  nl-b2-zou:
    meaning: "الشرطي: zou والماضي غير الواقع"
    intro: |
      **zou(den)** + المصدر = كان سـ: **Ik zou graag komen. Als ik rijk was, zou ik reizen.** «لو كنت غنيًا لسافرت». والماضي غير الواقع: **had / was** + اسم المفعول (+ **zou … hebben**): **Als ik het had geweten, was ik gekomen.** وللتهذيب أيضًا: **Zou je het raam willen openen?**
  nl-b2-double-inf:
    meaning: "المصدر المزدوج"
    intro: |
      الفعل المساعد أو *laten، gaan، blijven، zien، horen* في التام يأخذ **المصدر** بدل اسم المفعول: **Ik heb niet kunnen komen.** «لم أستطع المجيء». **Ik heb mijn haar laten knippen. Hij is blijven zitten.** وفي الجمل التابعة تتجمع الأفعال في الآخر: **…omdat ik niet heb kunnen komen.**
  nl-b2-te:
    meaning: "te + المصدر"
    intro: |
      **om … te** = لكي: **Ik ga naar de winkel om brood te kopen.** و**zonder … te** = دون أن: **Hij vertrok zonder iets te zeggen.** وبعد كثير من الأفعال والصفات **te** وحدها: **Het is moeilijk te zeggen. Ik probeer te slapen.** و**aan het** + المصدر = جارٍ: **Ik ben aan het koken.** «أنا أطبخ الآن».
  nl-b2-daar-prep:
    meaning: "الظروف الضميرية"
    intro: |
      لا تأخذ حروف الجر *het / dat / wat* لغير العاقل، بل **daar / hier / waar / er + حرف الجر**: **Ik denk daaraan** (أفكر في ذلك)، **Waar praat je over?** (عمّ تتحدث؟)، **Hiermee kun je schrijven.** وكثيرًا ما تنفصل: **Daar weet ik niets van.**
  nl-b2-reflexive:
    meaning: "الأفعال الانعكاسية"
    intro: |
      **me، je، zich، ons، je، zich**: **Ik vergis me. Hij herinnert zich alles. Wij vervelen ons.** وكثير منها انعكاسي في الهولندية وحدها: **zich haasten** (استعجل)، **zich schamen** (خجل)، **zich voelen** (شعر). و**zichzelf** للتوكيد.
  nl-b2-adverb-connectors:
    meaning: "ظروف تربط الجمل (الفعل ثانيًا!)"
    intro: |
      **daarom** (لذلك)، **dus** (إذن)، **toch** (ومع ذلك)، **echter** (غير أنّ)، **bovendien** (علاوة على ذلك)، **anders** (وإلا)، **daarna** (بعد ذلك). وإذا تصدّرت أوجبت أن يكون الفعل ثانيًا: **Het regent, daarom blijf ik thuis.**
  nl-c1-particles:
    meaning: "الأدوات الكلامية"
    intro: |
      كلمات صغيرة تحدد النبرة: **even** (قليلًا، بسرعة: *Kom even hier*)، **maar** (تفضّل: *Kom maar binnen*)، **eens** (للتلطيف: *Kijk eens!*)، **toch** (أليس كذلك، للعتاب: *Je komt toch?*)، **wel** (لنقض النفي: *Ik kom wel*)، **hoor** (للطمأنة: *Het is goed, hoor*). وتجتمع: *Kom maar eens even kijken.*
  nl-c1-word-order-focus:
    meaning: "التقديم للتوكيد"
    intro: |
      يمكن لأي عنصر أن يفتتح الجملة الرئيسية للمقابلة أو للموضوع، ويبقى الفعل ثانيًا: **Dat boek heb ik nooit gelezen. Mooi is het niet. Hem ken ik niet.** وفي الكلام يُحذف الفاعل نفسه بعد مفعول مقدَّم: **Weet ik niet.**
  nl-c1-nominal:
    meaning: "الأسلوب الرسمي الاسمي"
    intro: |
      تحوّل الهولندية الرسمية الأفعال إلى أسماء: **-ing** (verbeteren → de verbetering)، والمصدر (**het lezen**)، و**-atie، -heid، -nis** (de organisatie، de mogelijkheid، de kennis). **Ter verbetering van…** (بغرض تحسين)، **met betrekking tot** (فيما يتعلق بـ)، **naar aanleiding van** (على إثر).
  nl-c1-idioms:
    meaning: "تعابير شائعة"
    intro: |
      **met de deur in huis vallen** (الدخول في الموضوع مباشرة)، **de kat uit de boom kijken** (الترقّب والانتظار)، **ergens geen kaas van gegeten hebben** (لا يفقه في الأمر شيئًا)، **iemand in de maling nemen** (يمازح أحدًا ويخدعه)، **het zal wel** (لا يهم)، **lekker** (لذيذ، طيب — للطعام والطقس والنوم وكل شيء).
  nl-c2-archaic:
    meaning: "صيغ إعرابية قديمة في عبارات ثابتة"
    intro: |
      تبقى حالتا الجر والإضافة القديمتان: **ten** (te + den: *ten slotte، ten minste، ten noorden*)، **ter** (te + der: *ter plaatse، ter gelegenheid van*)، **des** (*'s morgens، 's avonds، des te beter*)، **in dezen**، **van harte**. تعرّف عليها؛ ولا تصنع جديدًا منها.
  nl-c2-flemish:
    meaning: "الهولندية البلجيكية (الفلمنكية)"
    intro: |
      في فلاندرز: **gij / ge** بدل *jij* (*Hebt ge dat gezien?*)، **amai** (يا للعجب)، **goesting** (رغبة)، **'t is te zeggen** (أي)، **allez** (هيا)، **seffens** (حالًا)، والـ **g** الليّنة. والإملاء والنحو المعياريان مشتركان مع هولندا (Taalunie).
  nl-c2-false-friends:
    meaning: "الأصدقاء المزيفون"
    intro: |
      كلمات توهم بمعنى مألوف من الإنجليزية: **slim** = ذكي (لا «نحيف»)، **raar** = غريب (لا «نادر»)، **durven** = تجرّأ، **bellen** = اتصل هاتفيًا، **kous** = جورب، **brutaal** = وقح (لا «وحشي»)، **eventueel** = ربما، **actueel** = راهن، **bekomen** = تعافى، **monster** = عيّنة.
