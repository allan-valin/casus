id: C2
topics:

- title: {en: Literature and variety, pt: Literatura e variedade}
  lessons:
  - id: ro-literature
    title: Eminescu, Creangă, Caragiale
    meaning: {en: "reading the classics", pt: "lendo os clássicos"}
    intro:
      en: |
        Mihai Eminescu (*Luceafărul*, 1883) shaped the poetic language; Ion Creangă's *Amintiri din copilărie* is full of village speech; I. L. Caragiale's comedies satirise 19th-century Bucharest. Older printings write **ş ţ** with a cedilla and **î** everywhere (**sînt, cîntec** for *sunt, cântec*); the reader folds the cedilla letters.
      pt: |
        Mihai Eminescu (*Luceafărul*, 1883) moldou a língua poética; *Amintiri din copilărie* de Ion Creangă é cheio da fala da aldeia; as comédias de I. L. Caragiale satirizam a Bucareste do século XIX. Edições antigas escrevem **ş ţ** com cedilha e **î** em toda parte (**sînt, cîntec** por *sunt, cântec*); o leitor equipara as letras com cedilha.
    examples:
    - ["A fost odată ca-n povești.", "Once upon a time, as in the tales.", "Era uma vez, como nos contos.", "povești"]
    match: {seq: [{word: [povești, odată, împărătești, fată, luceafăr]}]}
    pool: [odată, povești, luceafăr]
  - id: ro-moldova
    title: limba română în Republica Moldova
    meaning: {en: "Romanian in Moldova; regional words", pt: "o romeno na Moldávia; palavras regionais"}
    intro:
      en: |
        Romanian is also the language of the Republic of Moldova (officially called Romanian since 2023), written in Latin script since 1989 (Cyrillic before). Regional words differ: **harbuz / pepene** (watermelon), **chiftea / pârjoală** (meatball); Moldovan speech palatalises (**chiatră** for *piatră*).
      pt: |
        O romeno é também a língua da República da Moldávia (oficialmente chamada romeno desde 2023), escrita em alfabeto latino desde 1989 (antes em cirílico). Há palavras regionais: **harbuz / pepene** (melancia), **chiftea / pârjoală** (almôndega); a fala moldava palataliza (**chiatră** por *piatră*).
    examples:
    - ["Republica Moldova este vecina României.", "The Republic of Moldova is Romania's neighbour.", "A República da Moldávia é vizinha da Romênia.", "Moldova"]
    match: {seq: [{word: [Moldova, Moldovei, Chișinău, moldovenesc, regional]}]}
    pool: [Moldova, Chișinău]
