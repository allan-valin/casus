# Macedonian text of the Romanian course, A1–A2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "Гласови и букви"
  Nouns and the article: "Именки и членот"
  Pronouns and the present: "Заменки и сегашно време"
  Questions and negation: "Прашања и негација"
  The cases: "Падежите"
  Numbers and time: "Броеви и време"
  Past and future: "Минато и идно време"
  Pronouns and the subjunctive: "Заменки и субјунктивот"
  Adjectives: "Придавки"
lessons:
  ro-alphabet:
    meaning: "романските букви"
    intro: |
      **ă** е потемнета самогласка, како македонскиот полуглас; **â** и **î** се ист глас, средно *ы* (î на почеток и крај на зборот, â внатре: **înțeleg, român**); **ș** е *ш*, **ț** е *ц*. **c, g** пред **e, i** се *ч, џ* (**cine, ger**); **che, chi, ghe, ghi** се тврди *к, г*. Старите текстови пишуваат ş ţ со седиља; читачот ги прима двете.
  ro-gender:
    meaning: "три рода; неопределениот член"
    intro: |
      Машки (**un om** човек, **un băiat**), женски (**o casă** куќа, **o femeie**) и среден — машки во еднина, женски во множина (**un oraș, două orașe**). Неопределен член: **un** (м./ср.), **o** (ж.); множина **niște** (некои).
  ro-definite:
    meaning: "определениот член е наставка"
    intro: |
      Членот се додава на крајот од именката — како во македонскиот: **om → omul** (човекот), **oraș → orașul**, **casă → casa** (куќата), **carte → cartea**; множина **oamenii, orașele, casele**. По повеќето предлози членот паѓа: **pe masă** (на масата), но **cu** го задржува: **cu prietenul** (со пријателот).
  ro-plural:
    meaning: "множина"
    intro: |
      Машки **-i** (**băiat → băieți**, со гласовни промени: t → ț, s → ș, d → z), женски **-e** или **-i** (**casă → case**, **carte → cărți**), среден **-e** или **-uri** (**oraș → orașe**, **tren → trenuri**). Учете ја секоја именка со нејзината множина.
  ro-pronouns:
    meaning: "лични заменки; dumneavoastră"
    intro: |
      **eu** (јас), **tu** (ти), **el / ea** (тој / таа), **noi** (ние), **voi** (вие), **ei / ele** (тие). Учтивото *Вие* е **dumneavoastră** (со глагол во 2 лице множина). Глаголот го покажува лицето, па заменката често се изостава: **Lucrez** = работам.
  ro-present:
    meaning: "сегашно време: четири конјугации"
    intro: |
      Инфинитивите завршуваат на **-a, -ea, -e, -i/-î**: **a cânta, a vedea, a face, a citi**. Многу глаголи додаваат **-ez** или **-esc** во сегашно: **lucrez, lucrezi, lucrează** (работам…), **citesc, citești, citește**. Другите се прости: **cânt, cânți, cântă, cântăm, cântați, cântă**. 3 лице еднина и множина често се исти.
  ro-fi:
    meaning: "a fi, сум"
    intro: |
      **sunt, ești, este (e), suntem, sunteți, sunt**. **Sunt român / româncă** (јас сум Романец / Романка). Одречно со **nu**: **Nu sunt acasă** (не сум дома). **E** е секојдневната форма на **este**.
  ro-avea:
    meaning: "a avea, има"
    intro: |
      **am, ai, are, avem, aveți, au**: **Am un frate** (имам брат), **Nu am timp** (немам време). Истите кратки форми **am, ai, a, am, ați, au** го прават минатото (A2).
  ro-questions:
    meaning: "прашални зборови"
    intro: |
      **ce** (што), **cine** (кој), **unde** (каде), **când** (кога), **de ce** (зошто), **cum** (како), **cât / câtă / câți / câte** (колку), **care** (кој од). Прашањата да/не само ја менуваат интонацијата: **Vorbești română?**
  ro-nu:
    meaning: "негација и двојна негација"
    intro: |
      **nu** пред глаголот: **Nu înțeleg** (не разбирам). Двојната негација е правило: **Nimeni nu știe nimic** (никој ништо не знае), **N-am fost niciodată acolo** (никогаш не сум бил таму — **n-** е **nu** пред самогласка).
  ro-gen-dat:
    meaning: "генитив-датив: на"
    intro: |
      Една форма служи за двата: со член **-ului** (м./ср.: **omului, orașului**), **-ei** (ж.: **casei, mamei**), множина **-lor** (**copiilor**). Генитив *на* по именката: **casa mamei** (куќата на мајката); датив *на, за*: **Dau cartea mamei** (ѝ ја давам книгата на мајката). Без член: **unui, unei, unor**.
  ro-al:
    meaning: "генитивниот член"
    intro: |
      Кога генитивот не следи веднаш по определена именка, го поврзува **al / a / ai / ale** (според поседуваното): **un prieten al lui Ion** (еден пријател на Јон), **Cartea aceasta este a mamei** (оваа книга е на мајката). И присвојните: **al meu, a mea, ai mei, ale mele** (мојот).
  ro-voc:
    meaning: "вокатив: обраќање"
    intro: |
      Машки **-e** или **-ule** (**Ion → Ioane!**, **domn → domnule!**, **prieten → prietene!**), женски **-o** (**Maria → Mario!**, **soră → soro!**), множина **-lor** (**Doamnelor și domnilor!** Дами и господа!). Кај имињата е честа и простата форма: **Maria!**
  ro-numbers:
    meaning: "броеви; de по дваесет"
    intro: |
      **unu (un, o), doi (două), trei, patru, cinci, șase, șapte, opt, nouă, zece**; **unsprezece, doisprezece… douăzeci, o sută, o mie**. Од дваесет нагоре именката зема **de**: **douăzeci de ani** (дваесет години), но **zece ani**. **Doi / două** се согласуваат: **doi frați, două surori**.
  ro-days:
    meaning: "денови и зборови за време"
    intro: |
      **luni, marți, miercuri, joi, vineri, sâmbătă, duminică** (понеделник … недела); *во понеделник* е само **luni**, *секој понеделник* **lunea**. **azi / astăzi** (денеска), **mâine** (утре), **ieri** (вчера), **acum** (сега), **dimineața, seara** (наутро, навечер).
  ro-perfect:
    meaning: "сложено минато време"
    intro: |
      **am, ai, a, am, ați, au** + минат партицип (**cântat, văzut, făcut, citit, fost**): **Am citit cartea** (ја прочитав книгата), **Ieri a fost cald** (вчера беше топло). Тоа е секојдневното минато; партиципот не се менува — како македонското *имам прочитано*.
  ro-future:
    meaning: "идно време"
    intro: |
      Официјално **voi, vei, va, vom, veți, vor** + инфинитив: **Voi merge mâine.** Секојдневно **o să** + субјунктив: **O să merg mâine** (ќе одам утре) — блиску до македонското *ќе одам*. Исто така **am să merg**.
  ro-imperfect:
    meaning: "имперфект: имаше обичај, правеше"
    intro: |
      **-am, -ai, -a, -am, -ați, -au** на основата: **cântam** (пеев), **eram** (бев), **aveam** (имав). За позадина и навики: **Când eram mic, locuiam la țară** (кога бев мал, живеев на село).
  ro-clitics:
    meaning: "кратки заменки за објект"
    intro: |
      Акузатив **mă, te, îl / o, ne, vă, îi / le**; датив **îmi, îți, îi, ne, vă, le**, пред глаголот: **Te văd** (те гледам), **Îi dau cartea** (му ја давам книгата). Романскиот често го удвојува објектот — како македонскиот: **Îl văd pe Ion** (го гледам Јон), **Îi dau mamei** (ѝ давам на мајката). Пред самогласка се скратуваат: **l-am văzut, mi-a spus**.
  ro-pe:
    meaning: "pe: означениот директен објект"
    intro: |
      Пред лице што е именувано или истакнато како директен објект, романскиот става **pe** (и удвојува со кратка заменка): **Îl văd pe Ion. O caut pe Maria. Pe cine aștepți?** (кого го чекаш?). Со предмети нема **pe**: **Văd casa.**
  ro-subjunctive:
    meaning: "субјунктив со să"
    intro: |
      **să** + сегашна форма (3 лице **-e / -ă**: **să cânte, să meargă**) го заменува инфинитивот по повеќето глаголи — како македонското *да*: **Vreau să merg** (сакам да одам), **Trebuie să plec** (треба да заминам), **Pot să intru?** (може ли да влезам?).
  ro-adj:
    meaning: "придавките стојат по именката и се согласуваат; споредување"
    intro: |
      Придавките обично стојат по именката и се согласуваат: **un om bun, o femeie bună, oameni buni, femei bune.** Компаратив со **mai** (**mai mare decât** поголем од), суперлатив со **cel / cea / cei / cele mai** (**cel mai bun** најдобриот). Придавка ставена напред го зема членот: **frumoasa casă** (убавата куќа).
