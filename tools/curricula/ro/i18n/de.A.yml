# German text of the Romanian course, A1–A2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "Laute und Buchstaben"
  Nouns and the article: "Nomen und der Artikel"
  Pronouns and the present: "Pronomen und das Präsens"
  Questions and negation: "Fragen und Verneinung"
  The cases: "Die Fälle"
  Numbers and time: "Zahlen und Zeit"
  Past and future: "Vergangenheit und Zukunft"
  Pronouns and the subjunctive: "Pronomen und der Konjunktiv"
  Adjectives: "Adjektive"
lessons:
  ro-alphabet:
    meaning: "die rumänischen Buchstaben"
    intro: |
      **ă** ist der Vokal in *bitte* (das unbetonte *e*); **â** und **î** sind derselbe Laut, ein zentrales *i* (î am Wortanfang und -ende, â im Wort: **înțeleg, român**); **ș** ist *sch*, **ț** ist *z*. **c, g** vor **e, i** sind *tsch, dsch* (**cine, ger**); **che, chi, ghe, ghi** sind hartes *k, g*. Alte Texte schreiben ş ţ mit Cedille; der Leser nimmt beides.
  ro-gender:
    meaning: "drei Genera; der unbestimmte Artikel"
    intro: |
      Maskulin (**un om** ein Mann, **un băiat**), feminin (**o casă** ein Haus, **o femeie**) und neutral — im Singular maskulin, im Plural feminin (**un oraș, două orașe**). Der unbestimmte Artikel: **un** (m./n.), **o** (f.); Plural **niște** (einige).
  ro-definite:
    meaning: "der bestimmte Artikel ist eine Endung"
    intro: |
      *Der, die, das* wird ans Nomen angehängt: **om → omul** (der Mann), **oraș → orașul**, **casă → casa** (das Haus), **carte → cartea**; Plural **oamenii, orașele, casele**. Nach den meisten Präpositionen fällt der Artikel weg: **pe masă** (auf dem Tisch), aber **cu** behält ihn: **cu prietenul** (mit dem Freund).
  ro-plural:
    meaning: "der Plural"
    intro: |
      Maskulin **-i** (**băiat → băieți**, mit Lautwandel: t → ț, s → ș, d → z), feminin **-e** oder **-i** (**casă → case**, **carte → cărți**), neutral **-e** oder **-uri** (**oraș → orașe**, **tren → trenuri**). Lernen Sie jedes Nomen mit seinem Plural.
  ro-pronouns:
    meaning: "Personalpronomen; dumneavoastră"
    intro: |
      **eu** (ich), **tu** (du), **el / ea** (er / sie), **noi** (wir), **voi** (ihr), **ei / ele** (sie). Das höfliche *Sie* ist **dumneavoastră** (mit dem Verb in der 2. Person Plural). Das Verb zeigt die Person, darum fällt das Pronomen oft weg: **Lucrez** = ich arbeite.
  ro-present:
    meaning: "das Präsens: vier Konjugationen"
    intro: |
      Infinitive enden auf **-a, -ea, -e, -i/-î**: **a cânta, a vedea, a face, a citi**. Viele Verben fügen im Präsens **-ez** oder **-esc** ein: **lucrez, lucrezi, lucrează** (ich arbeite…), **citesc, citești, citește**. Andere sind einfach: **cânt, cânți, cântă, cântăm, cântați, cântă**. Die 3. Person Singular und Plural sind oft gleich.
  ro-fi:
    meaning: "a fi, sein"
    intro: |
      **sunt, ești, este (e), suntem, sunteți, sunt**. **Sunt român / româncă** (ich bin Rumäne / Rumänin). Verneint mit **nu**: **Nu sunt acasă** (ich bin nicht zu Hause). **E** ist die Alltagsform von **este**.
  ro-avea:
    meaning: "a avea, haben"
    intro: |
      **am, ai, are, avem, aveți, au**: **Am un frate** (ich habe einen Bruder), **Nu am timp** (ich habe keine Zeit). Dieselben Kurzformen **am, ai, a, am, ați, au** bilden die Vergangenheit (A2).
  ro-questions:
    meaning: "Fragewörter"
    intro: |
      **ce** (was), **cine** (wer), **unde** (wo), **când** (wann), **de ce** (warum), **cum** (wie), **cât / câtă / câți / câte** (wie viel, wie viele), **care** (welcher). Ja/Nein-Fragen ändern nur die Stimme: **Vorbești română?**
  ro-nu:
    meaning: "Verneinung und doppelte Verneinung"
    intro: |
      **nu** vor dem Verb: **Nu înțeleg** (ich verstehe nicht). Doppelte Verneinung ist die Regel: **Nimeni nu știe nimic** (niemand weiß etwas), **N-am fost niciodată acolo** (ich war nie dort — **n-** ist **nu** vor Vokal).
  ro-gen-dat:
    meaning: "Genitiv-Dativ: von, zu"
    intro: |
      Eine Form für beide: mit Artikel **-ului** (m./n.: **omului, orașului**), **-ei** (f.: **casei, mamei**), Plural **-lor** (**copiilor**). Genitiv *von* nach dem Nomen: **casa mamei** (das Haus der Mutter); Dativ *zu, für*: **Dau cartea mamei** (ich gebe der Mutter das Buch). Ohne Artikel: **unui, unei, unor**.
  ro-al:
    meaning: "der Genitivartikel"
    intro: |
      Wenn der Genitiv nicht direkt auf ein bestimmtes Nomen folgt, verbindet ihn **al / a / ai / ale** (nach dem Besessenen): **un prieten al lui Ion** (ein Freund von Ion), **Cartea aceasta este a mamei** (dieses Buch gehört der Mutter). Auch die Possessiva: **al meu, a mea, ai mei, ale mele** (meiner).
  ro-voc:
    meaning: "Vokativ: jemanden rufen"
    intro: |
      Maskulin **-e** oder **-ule** (**Ion → Ioane!**, **domn → domnule!**, **prieten → prietene!**), feminin **-o** (**Maria → Mario!**, **soră → soro!**), Plural **-lor** (**Doamnelor și domnilor!** Meine Damen und Herren!). Bei Namen ist auch die einfache Form üblich: **Maria!**
  ro-numbers:
    meaning: "Zahlen; de nach zwanzig"
    intro: |
      **unu (un, o), doi (două), trei, patru, cinci, șase, șapte, opt, nouă, zece**; **unsprezece, doisprezece… douăzeci, o sută, o mie**. Ab zwanzig steht vor dem Nomen **de**: **douăzeci de ani** (zwanzig Jahre), aber **zece ani**. **Doi / două** kongruieren: **doi frați, două surori**.
  ro-days:
    meaning: "Tage und Zeitwörter"
    intro: |
      **luni, marți, miercuri, joi, vineri, sâmbătă, duminică** (Montag … Sonntag); *am Montag* ist einfach **luni**, *jeden Montag* **lunea**. **azi / astăzi** (heute), **mâine** (morgen), **ieri** (gestern), **acum** (jetzt), **dimineața, seara** (am Morgen, am Abend).
  ro-perfect:
    meaning: "das Perfekt"
    intro: |
      **am, ai, a, am, ați, au** + Partizip Perfekt (**cântat, văzut, făcut, citit, fost**): **Am citit cartea** (ich habe das Buch gelesen), **Ieri a fost cald** (gestern war es warm). Es ist die Alltagsvergangenheit; das Partizip bleibt unverändert.
  ro-future:
    meaning: "das Futur"
    intro: |
      Förmlich **voi, vei, va, vom, veți, vor** + Infinitiv: **Voi merge mâine.** Im Alltag **o să** + Konjunktiv: **O să merg mâine** (ich gehe morgen). Auch **am să merg** (ich werde gehen).
  ro-imperfect:
    meaning: "das Imperfekt: pflegte zu, war dabei"
    intro: |
      **-am, -ai, -a, -am, -ați, -au** am Stamm: **cântam** (ich sang, pflegte zu singen), **eram** (ich war), **aveam** (ich hatte). Für Hintergrund und Gewohnheiten: **Când eram mic, locuiam la țară** (als ich klein war, wohnte ich auf dem Land).
  ro-clitics:
    meaning: "kurze Objektpronomen"
    intro: |
      Akkusativ **mă, te, îl / o, ne, vă, îi / le**; Dativ **îmi, îți, îi, ne, vă, le**, vor dem Verb: **Te văd** (ich sehe dich), **Îi dau cartea** (ich gebe ihm das Buch). Rumänisch verdoppelt das Objekt oft: **Îl văd pe Ion** (ich sehe Ion), **Îi dau mamei** (ich gebe es der Mutter). Vor Vokal werden sie kürzer: **l-am văzut, mi-a spus**.
  ro-pe:
    meaning: "pe: das markierte direkte Objekt"
    intro: |
      Vor eine genannte oder hervorgehobene Person als direktes Objekt setzt das Rumänische **pe** (und verdoppelt mit einem Kurzpronomen): **Îl văd pe Ion. O caut pe Maria. Pe cine aștepți?** (auf wen wartest du?). Bei Sachen steht kein **pe**: **Văd casa.**
  ro-subjunctive:
    meaning: "der Konjunktiv mit să"
    intro: |
      **să** + eine Präsensform (3. Person **-e / -ă**: **să cânte, să meargă**) ersetzt nach den meisten Verben den Infinitiv: **Vreau să merg** (ich will gehen), **Trebuie să plec** (ich muss gehen), **Pot să intru?** (darf ich hereinkommen?).
  ro-adj:
    meaning: "Adjektive folgen und kongruieren; Steigerung"
    intro: |
      Adjektive stehen meist nach dem Nomen und kongruieren: **un om bun, o femeie bună, oameni buni, femei bune.** Komparativ mit **mai** (**mai mare decât** größer als), Superlativ mit **cel / cea / cei / cele mai** (**cel mai bun** der beste). Ein vorangestelltes Adjektiv nimmt den Artikel: **frumoasa casă** (das schöne Haus).
