# Arabic text of the Romanian course, A1–A2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "الأصوات والحروف"
  Nouns and the article: "الأسماء وأداة التعريف"
  Pronouns and the present: "الضمائر والمضارع"
  Questions and negation: "الأسئلة والنفي"
  The cases: "الحالات الإعرابية"
  Numbers and time: "الأعداد والزمن"
  Past and future: "الماضي والمستقبل"
  Pronouns and the subjunctive: "الضمائر والصيغة الشرطية التابعة"
  Adjectives: "الصفات"
lessons:
  ro-alphabet:
    meaning: "الحروف الرومانية"
    intro: |
      **ă** حركة مبهمة قصيرة؛ و**â** و**î** صوت واحد، كسرة مركزية (î في أول الكلمة وآخرها، وâ في وسطها: **înțeleg, român**)؛ **ș** شين، و**ț** تس. و**c, g** قبل **e, i** تُنطقان *تش، دج* (**cine, ger**)؛ و**che, chi, ghe, ghi** كاف وجيم صلبة. النصوص القديمة تكتب ş ţ بشُريطة تحتية؛ والقارئ يقبل الاثنين.
  ro-gender:
    meaning: "ثلاثة أجناس؛ أداة التنكير"
    intro: |
      مذكّر (**un om** رجل، **un băiat**)، ومؤنّث (**o casă** بيت، **o femeie**)، ومحايد — مذكّر في المفرد مؤنّث في الجمع (**un oraș, două orașe**). أداة التنكير: **un** (للمذكّر والمحايد)، **o** (للمؤنّث)؛ وفي الجمع **niște** (بعض).
  ro-definite:
    meaning: "أداة التعريف لاحقة"
    intro: |
      تُلحق *أل* بآخر الاسم: **om → omul** (الرجل)، **oraș → orașul**، **casă → casa** (البيت)، **carte → cartea**؛ والجمع **oamenii, orașele, casele**. وبعد معظم حروف الجر تسقط الأداة: **pe masă** (على الطاولة)، لكن **cu** تحتفظ بها: **cu prietenul** (مع الصديق).
  ro-plural:
    meaning: "الجمع"
    intro: |
      المذكّر **-i** (**băiat → băieți**، مع تغيّر الأصوات: t → ț، s → ș، d → z)، والمؤنّث **-e** أو **-i** (**casă → case**، **carte → cărți**)، والمحايد **-e** أو **-uri** (**oraș → orașe**، **tren → trenuri**). احفظ كل اسم مع جمعه.
  ro-pronouns:
    meaning: "الضمائر الشخصية؛ dumneavoastră"
    intro: |
      **eu** (أنا)، **tu** (أنت)، **el / ea** (هو / هي)، **noi** (نحن)، **voi** (أنتم)، **ei / ele** (هم / هنّ). و*أنتم* للاحترام **dumneavoastră** (مع فعل المخاطَب الجمع). والفعل يدلّ على الشخص فيُحذف الضمير غالبًا: **Lucrez** = أعمل.
  ro-present:
    meaning: "المضارع: أربعة تصريفات"
    intro: |
      تنتهي المصادر بـ**-a, -ea, -e, -i/-î**: **a cânta, a vedea, a face, a citi**. وكثير من الأفعال يضيف **-ez** أو **-esc** في المضارع: **lucrez, lucrezi, lucrează** (أعمل…)، **citesc, citești, citește**. وغيرها بسيط: **cânt, cânți, cântă, cântăm, cântați, cântă**. والغائب المفرد والجمع كثيرًا ما يتطابقان.
  ro-fi:
    meaning: "a fi، الكون"
    intro: |
      **sunt, ești, este (e), suntem, sunteți, sunt**. **Sunt român / româncă** (أنا روماني / رومانية). والنفي بـ**nu**: **Nu sunt acasă** (لست في البيت). و**e** هي الصيغة اليومية لـ**este**.
  ro-avea:
    meaning: "a avea، الملكية"
    intro: |
      **am, ai, are, avem, aveți, au**: **Am un frate** (لي أخ)، **Nu am timp** (ليس عندي وقت). والصيغ القصيرة نفسها **am, ai, a, am, ați, au** تكوّن الماضي (A2).
  ro-questions:
    meaning: "أدوات الاستفهام"
    intro: |
      **ce** (ماذا)، **cine** (من)، **unde** (أين)، **când** (متى)، **de ce** (لماذا)، **cum** (كيف)، **cât / câtă / câți / câte** (كم)، **care** (أيّ). أسئلة نعم/لا تكتفي بالنبرة: **Vorbești română?**
  ro-nu:
    meaning: "النفي والنفي المزدوج"
    intro: |
      **nu** قبل الفعل: **Nu înțeleg** (لا أفهم). والنفي المزدوج قاعدة: **Nimeni nu știe nimic** (لا أحد يعرف شيئًا)، **N-am fost niciodată acolo** (لم أكن هناك قط — **n-** هي **nu** قبل حرف علّة).
  ro-gen-dat:
    meaning: "الإضافة والقابل: صيغة واحدة"
    intro: |
      صيغة واحدة للحالتين: مع أداة التعريف **-ului** (للمذكّر والمحايد: **omului, orașului**)، **-ei** (للمؤنّث: **casei, mamei**)، والجمع **-lor** (**copiilor**). الإضافة بعد الاسم: **casa mamei** (بيت الأم)؛ والقابل *لـ*: **Dau cartea mamei** (أعطي الكتاب للأم). وبلا تعريف: **unui, unei, unor**.
  ro-al:
    meaning: "أداة الإضافة"
    intro: |
      إذا لم يتلُ المضاف إليه اسمًا معرّفًا مباشرة، ربطته **al / a / ai / ale** (مطابقة للمملوك): **un prieten al lui Ion** (صديق ليون)، **Cartea aceasta este a mamei** (هذا الكتاب للأم). وكذلك الملكية: **al meu, a mea, ai mei, ale mele** (لي، خاصّتي).
  ro-voc:
    meaning: "حالة النداء"
    intro: |
      المذكّر **-e** أو **-ule** (**Ion → Ioane!**، **domn → domnule!**، **prieten → prietene!**)، والمؤنّث **-o** (**Maria → Mario!**، **soră → soro!**)، والجمع **-lor** (**Doamnelor și domnilor!** سيداتي وسادتي!). ومع الأسماء الصيغة البسيطة شائعة أيضًا: **Maria!**
  ro-numbers:
    meaning: "الأعداد؛ de بعد العشرين"
    intro: |
      **unu (un, o), doi (două), trei, patru, cinci, șase, șapte, opt, nouă, zece**؛ **unsprezece, doisprezece… douăzeci, o sută, o mie**. ومن العشرين فما فوق يأخذ الاسم **de**: **douăzeci de ani** (عشرون سنة)، لكن **zece ani**. و**doi / două** تطابقان: **doi frați, două surori**.
  ro-days:
    meaning: "الأيام وكلمات الزمن"
    intro: |
      **luni, marți, miercuri, joi, vineri, sâmbătă, duminică** (الاثنين … الأحد)؛ و*يوم الاثنين* هو **luni** فقط، و*كل اثنين* **lunea**. **azi / astăzi** (اليوم)، **mâine** (غدًا)، **ieri** (أمس)، **acum** (الآن)، **dimineața, seara** (صباحًا، مساءً).
  ro-perfect:
    meaning: "الماضي المركّب"
    intro: |
      **am, ai, a, am, ați, au** + اسم المفعول (**cântat, văzut, făcut, citit, fost**): **Am citit cartea** (قرأت الكتاب)، **Ieri a fost cald** (كان الجو حارًّا أمس). هو الماضي اليومي، ولا يتغيّر اسم المفعول.
  ro-future:
    meaning: "المستقبل"
    intro: |
      الرسمي **voi, vei, va, vom, veți, vor** + المصدر: **Voi merge mâine.** واليومي **o să** + الصيغة التابعة: **O să merg mâine** (سأذهب غدًا). وأيضًا **am să merg**.
  ro-imperfect:
    meaning: "الماضي الناقص: كان يفعل"
    intro: |
      **-am, -ai, -a, -am, -ați, -au** على الجذر: **cântam** (كنت أغنّي)، **eram** (كنت)، **aveam** (كان لي). للخلفية والعادات: **Când eram mic, locuiam la țară** (لمّا كنت صغيرًا كنت أسكن في الريف).
  ro-clitics:
    meaning: "ضمائر المفعول القصيرة"
    intro: |
      للنصب **mă, te, îl / o, ne, vă, îi / le**؛ وللقابل **îmi, îți, îi, ne, vă, le**، قبل الفعل: **Te văd** (أراك)، **Îi dau cartea** (أعطيه الكتاب). وكثيرًا ما تُكرّر الرومانية المفعول: **Îl văd pe Ion** (أرى يون)، **Îi dau mamei** (أعطي الأم). وقبل حرف العلّة تُختصر: **l-am văzut, mi-a spus**.
  ro-pe:
    meaning: "pe: المفعول به الموسوم"
    intro: |
      قبل الشخص المسمّى أو المُبرَز مفعولًا به تضع الرومانية **pe** (وتكرّره بضمير قصير): **Îl văd pe Ion. O caut pe Maria. Pe cine aștepți?** (من تنتظر؟). ومع الأشياء لا **pe**: **Văd casa.**
  ro-subjunctive:
    meaning: "الصيغة التابعة مع să"
    intro: |
      **să** + صيغة مضارعة (والغائب **-e / -ă**: **să cânte, să meargă**) تحلّ محلّ المصدر بعد معظم الأفعال، كـ«أن + المضارع»: **Vreau să merg** (أريد أن أذهب)، **Trebuie să plec** (يجب أن أنصرف)، **Pot să intru?** (هل أستطيع الدخول؟).
  ro-adj:
    meaning: "الصفات تتبع الموصوف وتطابقه؛ التفضيل"
    intro: |
      تأتي الصفة غالبًا بعد الاسم وتطابقه: **un om bun, o femeie bună, oameni buni, femei bune.** والتفضيل بـ**mai** (**mai mare decât** أكبر من)، والأفعل بـ**cel / cea / cei / cele mai** (**cel mai bun** الأفضل). والصفة المقدَّمة تأخذ أداة التعريف: **frumoasa casă** (البيت الجميل).
