# Arabic text of the Romanian course, B1–C2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Moods: "الصيغ"
  Clauses: "الجمل"
  Literary forms: "الصيغ الأدبية"
  Talking about ideas: "الحديث عن الأفكار"
  Literature and variety: "الأدب والتنوّع"
lessons:
  ro-conditional:
    meaning: "الشرطي: لَـ…"
    intro: |
      **aș, ai, ar, am, ați, ar** + المصدر: **Aș vrea o cafea** (أودّ قهوة)، **Ar fi bine** (سيكون حسنًا). والشروط: **Dacă aș avea timp, aș veni** (لو كان عندي وقت لأتيت).
  ro-imperative:
    meaning: "الأمر"
    intro: |
      المفرد غالبًا كغائب المضارع أو مخاطبه: **citește!** (اقرأ)، **cântă!**، والشاذ **vino!** (تعال)، **fă!** (افعل)، **du-te!** (اذهب)؛ والجمع كالمخاطَب الجمع: **citiți!** والنهي في المفرد **nu** + المصدر: **Nu fuma!** (لا تدخّن).
  ro-care:
    meaning: "الذي: جمل الصلة"
    intro: |
      **care** (الذي) للفاعل ومع حروف الجر؛ وللشخص المفعول **pe care** (+ التكرار): **Omul pe care l-am văzut** (الرجل الذي رأيته)؛ والإضافة والقابل **căruia / căreia / cărora**: **Prietenul căruia i-am scris** (الصديق الذي كتبت إليه).
  ro-conjunctions:
    meaning: "ربط الجمل"
    intro: |
      **că** (أنّ)، **pentru că / fiindcă** (لأنّ)، **dacă** (إذا، هل)، **când** (عندما)، **deși** (مع أنّ)، **ca să** (لكي)، **dar / însă** (لكن)، **deci** (إذن). **Știu că vine** (أعرف أنه آتٍ). **Plec acasă pentru că sunt obosit** (أذهب إلى البيت لأنني متعب).
  ro-simple-past:
    meaning: "الماضي البسيط والماضي التام"
    intro: |
      يروي الأدب بـ*الماضي البسيط*: **cântai, cântă, cântarăm** (غنّيت، غنّى…)، **făcu, fu** (فعل، كان)؛ وما زال يُتكلَّم في أولتينيا. والماضي التام **cântasem, făcuse** (كنت قد غنّيت، كان قد فعل) كلمة واحدة: **Când am ajuns, trenul plecase** (لمّا وصلت كان القطار قد غادر).
  ro-passive:
    meaning: "المبني للمجهول"
    intro: |
      **a fi** + اسم المفعول (مطابقًا): **Cartea este scrisă de Eminescu** (الكتاب من تأليف إمينسكو)، **Casa a fost vândută** (بِيع البيت). والشائع جدًا المجهول الانعكاسي بـ**se**: **Aici se vorbește engleza** (تُتكلّم الإنجليزية هنا)، **Casa se vinde** (البيت للبيع).
  ro-gerund:
    meaning: "الحال: في أثناء الفعل"
    intro: |
      **-ând / -ind** (**mergând, citind, făcând**): **Mergând pe stradă, am întâlnit un prieten** (ماشيًا في الشارع لقيت صديقًا). والضمائر تتصل بشرطة: **văzându-l** (رائيًا إياه).
  ro-abstract:
    meaning: "الأسماء المجرّدة وبناء الكلمات"
    intro: |
      **-tate** (**libertate** حرّية، **egalitate** مساواة، **societate** مجتمع)، **-ie** (**democrație, istorie**)، **-re** من الأفعال (**dezvoltare** تنمية، **învățare** تعلّم)، **-ism** (**romantism**). وتشترك الرومانية في كثير من هذه المفردات مع الفرنسية والإيطالية.
  ro-latin:
    meaning: "النواة اللاتينية والطبقات الأخرى"
    intro: |
      الرومانية هي اللغة الرومانسية في الشرق: **apă** (aqua — ماء)، **lapte** (lactem — حليب)، **frate** (frater — أخ)، **a cânta** (cantare — غنّى). وأعطت السلافية كلمات يومية كثيرة (**a iubi** أحبّ، **da** نعم، **prieten** صديق)، والإغريقية والتركية والمجرية غيرها؛ والفرنسية والإيطالية المفردات الحديثة.
  ro-literature:
    meaning: "قراءة الكلاسيكيات"
    intro: |
      صاغ ميهاي إمينسكو (*Luceafărul*، 1883) اللغة الشعرية؛ و*Amintiri din copilărie* ليون كريانغا مليء بكلام القرية؛ وكوميديات إ. ل. كاراجيالي تسخر من بوخارست القرن التاسع عشر. والطبعات القديمة تكتب **ş ţ** بشُريطة و**î** في كل مكان (**sînt, cîntec** بدل *sunt, cântec*)؛ والقارئ يوحّد الحروف ذات الشُّريطة.
  ro-moldova:
    meaning: "الرومانية في مولدوفا؛ كلمات إقليمية"
    intro: |
      الرومانية أيضًا لغة جمهورية مولدوفا (تُسمّى رسميًا الرومانية منذ 2023)، وتُكتب بالحروف اللاتينية منذ 1989 (وبالسيريلية قبل ذلك). وتختلف الكلمات الإقليمية: **harbuz / pepene** (بطيخ)، **chiftea / pârjoală** (كفتة)؛ والكلام المولدوفي يليّن بعض الأصوات (**chiatră** بدل *piatră*).
