# German text of the Romanian course, B1–C2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Moods: "Modi"
  Clauses: "Nebensätze"
  Literary forms: "Literarische Formen"
  Talking about ideas: "Über Ideen sprechen"
  Literature and variety: "Literatur und Vielfalt"
lessons:
  ro-conditional:
    meaning: "der Konditional: würde"
    intro: |
      **aș, ai, ar, am, ați, ar** + Infinitiv: **Aș vrea o cafea** (ich hätte gern einen Kaffee), **Ar fi bine** (das wäre gut). Bedingungen: **Dacă aș avea timp, aș veni** (wenn ich Zeit hätte, käme ich).
  ro-imperative:
    meaning: "der Imperativ"
    intro: |
      Der Singular oft wie die 3. oder 2. Person Präsens: **citește!** (lies!), **cântă!**, unregelmäßig **vino!** (komm!), **fă!** (mach!), **du-te!** (geh!); der Plural wie die 2. Plural: **citiți!** Verneint im Singular **nu** + Infinitiv: **Nu fuma!** (rauch nicht).
  ro-care:
    meaning: "welcher, der: Relativsätze"
    intro: |
      **care** (der, welcher) für Subjekte und mit Präpositionen; als Personenobjekt **pe care** (+ Verdopplung): **Omul pe care l-am văzut** (der Mann, den ich gesehen habe); Genitiv-Dativ **căruia / căreia / cărora**: **Prietenul căruia i-am scris** (der Freund, dem ich geschrieben habe).
  ro-conjunctions:
    meaning: "Sätze verbinden"
    intro: |
      **că** (dass), **pentru că / fiindcă** (weil), **dacă** (wenn, ob), **când** (als, wenn), **deși** (obwohl), **ca să** (damit), **dar / însă** (aber), **deci** (also). **Știu că vine** (ich weiß, dass er kommt). **Plec acasă pentru că sunt obosit** (ich gehe nach Hause, weil ich müde bin).
  ro-simple-past:
    meaning: "das einfache Perfekt und das Plusquamperfekt"
    intro: |
      Die Literatur erzählt mit dem *einfachen Perfekt*: **cântai, cântă, cântarăm** (ich sang, er sang…), **făcu, fu** (er tat, er war); in Oltenien wird es noch gesprochen. Das Plusquamperfekt **cântasem, făcuse** (hatte gesungen, hatte getan) ist ein Wort: **Când am ajuns, trenul plecase** (als ich ankam, war der Zug schon abgefahren).
  ro-passive:
    meaning: "das Passiv"
    intro: |
      **a fi** + Partizip (kongruierend): **Cartea este scrisă de Eminescu** (das Buch ist von Eminescu geschrieben), **Casa a fost vândută** (das Haus wurde verkauft). Sehr häufig ist das reflexive Passiv mit **se**: **Aici se vorbește engleza** (hier wird Englisch gesprochen), **Casa se vinde** (Haus zu verkaufen).
  ro-gerund:
    meaning: "das Gerundium: während man etwas tut"
    intro: |
      **-ând / -ind** (**mergând, citind, făcând**): **Mergând pe stradă, am întâlnit un prieten** (als ich die Straße entlangging, traf ich einen Freund). Pronomen hängen sich mit Bindestrich an: **văzându-l** (ihn sehend).
  ro-abstract:
    meaning: "abstrakte Nomen und Wortbildung"
    intro: |
      **-tate** (**libertate** Freiheit, **egalitate** Gleichheit, **societate**), **-ie** (**democrație, istorie**), **-re** von Verben (**dezvoltare** Entwicklung, **învățare** Lernen), **-ism** (**romantism**). Rumänisch teilt viel davon mit Französisch und Italienisch.
  ro-latin:
    meaning: "der lateinische Kern und die anderen Schichten"
    intro: |
      Rumänisch ist die romanische Sprache des Ostens: **apă** (aqua — Wasser), **lapte** (lactem — Milch), **frate** (frater — Bruder), **a cânta** (cantare — singen). Das Slawische gab viele Alltagswörter (**a iubi** lieben, **da** ja, **prieten** Freund), Griechisch, Türkisch und Ungarisch andere; Französisch und Italienisch den modernen Wortschatz.
  ro-literature:
    meaning: "die Klassiker lesen"
    intro: |
      Mihai Eminescu (*Luceafărul*, 1883) prägte die Dichtersprache; Ion Creangăs *Amintiri din copilărie* ist voller dörflicher Rede; I. L. Caragiales Komödien verspotten das Bukarest des 19. Jahrhunderts. Ältere Drucke schreiben **ş ţ** mit Cedille und **î** überall (**sînt, cîntec** für *sunt, cântec*); der Leser gleicht die Cedille-Buchstaben an.
  ro-moldova:
    meaning: "Rumänisch in Moldau; regionale Wörter"
    intro: |
      Rumänisch ist auch die Sprache der Republik Moldau (seit 2023 offiziell Rumänisch genannt), seit 1989 in lateinischer Schrift (davor kyrillisch). Regionale Wörter unterscheiden sich: **harbuz / pepene** (Wassermelone), **chiftea / pârjoală** (Frikadelle); die moldauische Rede palatalisiert (**chiatră** für *piatră*).
