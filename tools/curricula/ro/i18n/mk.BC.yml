# Macedonian text of the Romanian course, B1–C2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Moods: "Начини"
  Clauses: "Реченици"
  Literary forms: "Книжевни форми"
  Talking about ideas: "Разговор за идеи"
  Literature and variety: "Литература и разновидност"
lessons:
  ro-conditional:
    meaning: "кондиционал: би"
    intro: |
      **aș, ai, ar, am, ați, ar** + инфинитив: **Aș vrea o cafea** (би сакал кафе), **Ar fi bine** (би било добро). Услови: **Dacă aș avea timp, aș veni** (да имам време, би дошол).
  ro-imperative:
    meaning: "императив"
    intro: |
      Еднината често е како 3 или 2 лице сегашно: **citește!** (читај!), **cântă!**, неправилни **vino!** (дојди!), **fă!** (прави!), **du-te!** (оди!); множината како 2 лице множина: **citiți!** Одречно во еднина **nu** + инфинитив: **Nu fuma!** (не пуши).
  ro-care:
    meaning: "кој, што: релативни реченици"
    intro: |
      **care** (кој, што) за подмети и со предлози; како објект-лице **pe care** (+ удвојување): **Omul pe care l-am văzut** (човекот што го видов); генитив-датив **căruia / căreia / cărora**: **Prietenul căruia i-am scris** (пријателот на кој му пишав).
  ro-conjunctions:
    meaning: "поврзување реченици"
    intro: |
      **că** (дека), **pentru că / fiindcă** (зашто), **dacă** (ако, дали), **când** (кога), **deși** (иако), **ca să** (за да), **dar / însă** (но), **deci** (значи). **Știu că vine** (знам дека доаѓа). **Plec acasă pentru că sunt obosit** (одам дома зашто сум уморен).
  ro-simple-past:
    meaning: "просто минато и плусквамперфект"
    intro: |
      Литературата раскажува со *простото минато*: **cântai, cântă, cântarăm** (пеав, пееше…), **făcu, fu** (направи, беше); во Олтенија уште се зборува. Плусквамперфектот **cântasem, făcuse** (бев пеел, беше направил) е еден збор: **Când am ajuns, trenul plecase** (кога стигнав, возот веќе беше заминал).
  ro-passive:
    meaning: "пасив"
    intro: |
      **a fi** + партицип (се согласува): **Cartea este scrisă de Eminescu** (книгата е напишана од Еминеску), **Casa a fost vândută** (куќата е продадена). Многу честа е повратната пасивна форма со **se**: **Aici se vorbește engleza** (тука се зборува англиски), **Casa se vinde** (се продава куќа).
  ro-gerund:
    meaning: "герундиум: правејќи"
    intro: |
      **-ând / -ind** (**mergând, citind, făcând**): **Mergând pe stradă, am întâlnit un prieten** (одејќи по улицата, сретнав пријател). Заменките се додаваат со цртичка: **văzându-l** (гледајќи го).
  ro-abstract:
    meaning: "апстрактни именки и зборообразување"
    intro: |
      **-tate** (**libertate** слобода, **egalitate** еднаквост, **societate** општество), **-ie** (**democrație, istorie**), **-re** од глаголи (**dezvoltare** развој, **învățare** учење), **-ism** (**romantism**). Романскиот дели голем дел од овој речник со францускиот и италијанскиот.
  ro-latin:
    meaning: "латинското јадро и другите слоеви"
    intro: |
      Романскиот е романскиот јазик на истокот: **apă** (aqua — вода), **lapte** (lactem — млеко), **frate** (frater — брат), **a cânta** (cantare — пее). Словенските јазици дале многу секојдневни зборови (**a iubi** сака, љуби, **da** да, **prieten** пријател), грчкиот, турскиот и унгарскиот други; францускиот и италијанскиот модерниот речник.
  ro-literature:
    meaning: "читање на класиците"
    intro: |
      Михај Еминеску (*Luceafărul*, 1883) го обликувал поетскиот јазик; *Amintiri din copilărie* на Јон Креанга е полн со селски говор; комедиите на Ј. Л. Карагиале го исмеваат Букурешт од 19 век. Постарите изданија пишуваат **ş ţ** со седиља и **î** насекаде (**sînt, cîntec** наместо *sunt, cântec*); читачот ги изедначува буквите со седиља.
  ro-moldova:
    meaning: "романскиот во Молдавија; регионални зборови"
    intro: |
      Романскиот е и јазик на Република Молдавија (официјално наречен романски од 2023), на латиница од 1989 (пред тоа кирилица). Регионалните зборови се разликуваат: **harbuz / pepene** (лубеница), **chiftea / pârjoală** (ќофте); молдавскиот говор палатализира (**chiatră** наместо *piatră*).
