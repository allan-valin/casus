# Macedonian text of the Finnish course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Moods: "Начини"
  The passive: "Пасивот"
  Infinitives: "Инфинитиви"
  Possessive suffixes: "Присвојни наставки"
  Participles: "Партиципи"
  Rarer cases and forms: "Поретки падежи и форми"
  Word formation: "Зборообразување"
lessons:
  fi-conditional:
    meaning: "условниот начин -isi-: би"
    intro: |
      Условниот начин става **-isi-** пред личната наставка: **puhuisin, tulisin, haluaisin, olisin**. 3 лице: **puhuisi, tulisi** (без дополнителна самогласка). **e** и **i** од основата паѓаат: **tule-isi → tulisi**; долгите самогласки се скратуваат како во минатото: **saada → saisin, syödä → söisin**.

      Се користи за желби и учтиви молби (**Haluaisin kahvia.** „Би сакал кафе.“), за нереални услови со **jos**: **Jos minulla olisi rahaa, ostaisin talon.** „Да имав пари, ќе купев куќа.“ Минат условен: **olisin + -nut**: **Olisin tullut.** „Ќе бев дошол.“
  fi-potential:
    meaning: "потенцијалот -ne-: веројатно (формално)"
    intro: |
      **Потенцијалот** (-ne-) значи *веројатно, можеби*: **Hän tullee huomenna.** „Веројатно ќе дојде утре.“ **n** се изедначува како кај минатиот партицип: **tulla → tullee, nousta → noussee**; **olla** има своја основа: **lienee** „веројатно е“. Припаѓа на вестите и службениот јазик; во говорот Финците велат **varmaan, kai, ehkä** + индикатив.
  fi-imperative-3:
    meaning: "други заповедни форми: нека дојде, ајде да одиме"
    intro: |
      **3 лице**: **-koon / -köön**: **Tulkoon!** „Нека дојде!“, **Olkoon.** „Нека биде.“ **1 лице множина** (формално): **-kaamme / -käämme**: **Menkäämme!** „Да одиме!“ Во секојдневниот говор *ајде да* е пасивот: **Mennään!** „Ајде да одиме!“, **Syödään!** „Ајде да јадеме!“.
  fi-passive:
    meaning: "пасив сегашно: „се прави“"
    intro: |
      Финскиот пасив **воопшто нема вршител** — *некој, луѓето* го прават тоа, како македонското **се**: **Suomessa puhutaan suomea ja ruotsia.** „Во Финска се зборува фински и шведски.“ Објектот останува во објектен падеж (номинатив или партитив), а формата е една за сите.

      Образување: земи го инфинитивот (слаба основа за типовите 1–2) и додај **-taan / -tään** (тип 1: **puhua → puhutaan, ottaa → otetaan** — a → e), **-aan / -ään** по -da/-la/-na/-ta на типовите 2–6: **syödä → syödään, tulla → tullaan, mennä → mennään, haluta → halutaan, tarvita → tarvitaan**.

      Во говорот **me** + пасив значи *ние*: **Me mennään** „Ние одиме“.
  fi-passive-past:
    meaning: "минат пасив: -ttiin, -tiin"
    intro: |
      Минат пасив: **-ttiin** за тип 1 (**puhuttiin, otettiin**), **-tiin** за другите (**syötiin, tultiin, mentiin, haluttiin, tarvittiin**). Одречно: **ei** + пасивниот минат партицип **-ttu / -tty**: **Ei puhuttu.** „Не се зборуваше за тоа.“ Перфект: **on puhuttu** „е зборувано“.
  fi-ma-infinitive:
    meaning: "инфинитивот на -ma: оди да прави, во правење, од правење"
    intro: |
      **Третиот инфинитив** е основата од 3 лице множина + **-ma-** со наставка на месен падеж, и функционира како место:

      - **-maan** (кон): по глаголи на движење и некои други: **Menen ostamaan ruokaa.** „Одам да купам храна.“ **Opin uimaan.** „Научив да пливам.“
      - **-massa** (во): да се биде на некое правење: **Hän on syömässä.** „Отиде да јаде (сега е на јадење).“
      - **-masta** (од): враќање од правење: **Tulen uimasta.** „Се враќам од пливање.“
      - **-matta** (без): **Hän lähti sanomatta mitään.** „Си отиде без да каже ништо.“
    mistakes: ["По mennä, tulla, oppia: формата на -maan."]
  fi-infinitive-1:
    meaning: "основниот инфинитив по глаголи: haluan mennä, osaan uida"
    intro: |
      По **haluta, voida, osata, saada, täytyy, pitää, yrittää, aikoa, alkaa, kannattaa, ehtiä, unohtaa** вториот глагол е во **основен инфинитив** (речничката форма) — каде што македонскиот вели **да** + сегашно: **Haluan mennä kotiin.** „Сакам да одам дома.“ **Osaan uida. Aion matkustaa.** Некои глаголи на движење или учење земаат **-maan** (претходната лекција): **opin uimaan, menen nukkumaan**.
  fi-possessive:
    meaning: "присвојни наставки: -ni, -si, -nsa, -mme, -nne"
    intro: |
      Стандардниот фински го означува сопственикот и на именката: **(minun) kirjani** мојата книга, **(sinun) kirjasi** твојата книга, **hänen kirjansa** неговата/нејзината книга, **(meidän) kirjamme** нашата книга, **(teidän) kirjanne** вашата книга, **heidän kirjansa** нивната книга. Во 1 и 2 лице заменката може да се изостави; во 3 останува (без неа **-nsa** значи *својата*).

      Наставката оди по падежната: **talossani** (во мојата куќа), **kirjastasi** (од твојата книга). Кај падежни наставки на самогласка 3 лице често е **-Vn**: **talossaan, kotiinsa**. Говорот главно ги изостава: **mun kirja**.
  fi-participles:
    meaning: "партиципи како придавки: човекот што чита, прочитаната книга"
    intro: |
      Финскиот заменува многу релативни реченици со партиципи, менливи како придавки:

      - **-va / -vä** (сегашен активен): **lukeva poika** „момчето што чита“, **juokseva vesi** „течна вода“
      - **-nut / -nyt** (минат активен): **väsynyt mies** „уморен човек“, **kirjan lukenut opiskelija** „студентот што ја прочитал книгата“
      - **-ttava / -ttävä** (сегашен пасивен): **luettava kirja** „книга за читање“, **syötävä** „за јадење“
      - **-ttu / -tty** (минат пасивен): **luettu kirja** „прочитана книга“, **suljettu ovi** „затворена врата“

      Вестите и формалните текстови се полни со нив; говорот претпочита реченици со **joka**.
  fi-relative:
    meaning: "релативни заменки: joka, mikä"
    intro: |
      **joka** (кој, што) се однесува на именка и го зема падежот што го бара улогата во реченицата: **mies, joka asuu täällä** „човекот што живее тука“, **mies, jonka tunnen** „човекот што го познавам“, **talo, jossa asun** „куќата во која живеам“, **ystävä, jolle soitin** „пријателот на кого му се јавив“. Множина: **jotka, joita, joissa…**. **mikä** се однесува на цела реченица или на **se, kaikki, jotain**: **Hän tuli ajoissa, mikä oli yllätys.** „Дојде навреме, што беше изненадување.“
  fi-essive-translative:
    meaning: "есив -na (како) и транслатив -ksi (станување)"
    intro: |
      **Есив -na / -nä**: привремена состојба или улога, *како*: **Lapsena asuin maalla.** „Како дете живеев на село.“ **Hän on töissä opettajana.** „Работи како наставник.“ И време: **maanantaina, jouluna**.

      **Транслатив -ksi**: станување, претворање, *за* (време или цел): **Hän tuli sairaaksi.** „Се разболе.“ **Haluan opettajaksi.** „Сакам да станам наставник.“ **Mitä se on suomeksi?** „Како е тоа на фински?“ **viikoksi** „за една недела“.
  fi-abessive-instructive:
    meaning: "абесив -tta (без), инструктив -in, комитатив -ine-"
    intro: |
      Три ретки падежи, главно во устаалени изрази и во пишувањето:

      - **абесив -tta / -ttä** „без“: **rahatta** (без пари); обично **ilman** + партитив: **ilman rahaa**
      - **инструктив -in** (форма на множина): начин: **omin silmin** (со свои очи), **jalan** (пеш), **käsin** (рачно)
      - **комитатив -ine-** + присвојна наставка: „заедно со“: **Hän tuli perheineen.** „Дојде со семејството.“
  fi-derivation:
    meaning: "чести суфикси: -ja (вршител), -inen (придавка), -ton (без), -sto (место)"
    intro: |
      Финскиот гради зборови од корени со продуктивни суфикси:

      - **-ja / -jä** вршител: **opettaa → opettaja** (наставник), **lukea → lukija** (читател)
      - **-inen** придавка: **kulta → kultainen** (златен), **suomi → suomalainen** (фински)
      - **-ton / -tön** „без-“: **raha → rahaton** (без пари), **työ → työtön** (невработен)
      - **-sto / -stö** место или збир: **kirja → kirjasto** (библиотека), **sana → sanasto** (речник)
      - **-us / -ys** апстрактна именка: **vapaa → vapaus** (слобода), **ystävä → ystävyys** (пријателство)
      - **-la / -lä** место: **ravintola** (ресторан), **kahvila** (кафеана), **sairaala** (болница)
