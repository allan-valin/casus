# Macedonian text of the Finnish course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Clause substitutes: "Замени за реченици"
  The third and fourth infinitives: "Третиот и четвртиот инфинитив"
  Spoken Finnish and clitics: "Говорен фински и клитики"
  Modality and feeling: "Модалност и чувство"
  Indefinites and questions: "Неопределени зборови и прашања"
  Rare cases: "Ретки падежи"
  Spoken verb forms: "Говорни глаголски форми"
lessons:
  fi-referative:
    meaning: "референтивната конструкција: дека-реченици како партиципи"
    intro: |
      По глаголи на кажување, мислење и опажање (**sanoa, kertoa, luulla, uskoa, tietää, huomata, nähdä, kuulla, toivoa**) реченица со **että** може да стане партицип во генитив (*referatiivi*):

      - истовремено: **-vAn**: **Hän sanoi, että Anna tulee → Hän sanoi Annan tulevan.**
      - претходно: **-neen**: **Luulin, että hän oli lähtenyt → Luulin hänen lähteneen.**

      Кога подметот е ист како во главната реченица, го заменува присвојна наставка: **Hän sanoi tulevansa.** „Рече дека ќе дојде.“ **Luulin olevani oikeassa.** „Мислев дека сум во право.“
  fi-temporal:
    meaning: "временската конструкција: кога / откако правел"
    intro: |
      Реченица со **kun** може да се собере во глаголска форма со присвојна наставка (ист подмет) или подмет во генитив (друг подмет):

      - истовремено: **-essA** (втор инфинитив, инесив): **Kun tulin kotiin, … → Kotiin tullessani …** „Кога дојдов дома …“ **Lasten nukkuessa luin.** „Додека децата спиеја, читав.“
      - претходно: **-tUA** (минат пасивен партицип + партитивна наставка): **Kun olin syönyt, … → Syötyäni …** „Откако јадев …“ **Sateen lakattua lähdimme.** „Откако престана дождот, тргнавме.“

      Главно пишан фински: вести, извештаи, литература.
  fi-final:
    meaning: "финалната конструкција -Akseen: за да"
    intro: |
      **jotta** + глагол (за да) станува транслатив на првиот инфинитив + присвојна наставка кога подметот е ист: **-akse- / -äkse-** + **-ni, -si, -en, -mme, -nne, -en**:

      - **Tulin Suomeen, jotta oppisin suomea → Tulin Suomeen oppiakseni suomea.** „Дојдов во Финска за да научам фински.“
      - **Hän säästää rahaa ostaakseen auton.** „Штеди пари за да купи кола.“

      Устаалени: **tietääkseni** „колку што знам“, **muistaakseni** „ако добро се сеќавам“.
  fi-agent-participle:
    meaning: "агентивниот партицип -mA: направено од некого"
    intro: |
      **-mA** + вршител во генитив заменува релативна реченица за нешто што некој го направил:

      - **pullat, jotka äiti leipoi → äidin leipomat pullat** „колачињата што ги испече мајка“
      - со заменка, присвојна наставка: **minun kirjoittamani kirje** (или само **kirjoittamani kirje**) „писмото што го напишав“
      - **Tämä on Sibeliuksen säveltämä sinfonia.** „Ова е симфонија компонирана од Сибелиус.“

      Се менува како придавка: **äidin leipomia pullia, isän rakentamassa talossa**.
  fi-modal-instructive:
    meaning: "начин: вториот инфинитив, инструктив -en"
    intro: |
      **-en** на инфинитивната основа кажува како се прави нешто (*модалната конструкција*), како македонското **-јќи**: **Hän tuli hymyillen.** „Дојде насмевнувајќи се.“ **Lapset juoksivat nauraen.** „Децата трчаа смеејќи се.“ **Kävelin laulaen.**

      Устаалени изрази: **toisin sanoen** „со други зборови“, **yleisesti ottaen** „општо земено“, **niin sanoakseni** „така да кажам“.
  fi-matta:
    meaning: "-mAttA: без да направи"
    intro: |
      Абесивот на третиот инфинитив, **-mAttA**, значи *без да направи*: **Hän lähti sanomatta mitään.** „Си отиде без да каже ништо.“ **Älä mene syömättä.** „Немој да одиш без да јадеш.“

      Со **jättää** значи *да остави ненаправено*: **Jätin kirjeen lukematta.** „Го оставив писмото непрочитано.“ Припаѓа на истото семејство како **-mAssA** (на правење), **-mAstA** (од правење), **-mAAn** (да прави).
  fi-malla:
    meaning: "-mAllA: со тоа што прави"
    intro: |
      Адесивот на третиот инфинитив, **-mAllA**, го кажува средството: *со правење*: **Puhumalla oppii.** „Зборувајќи се учи.“ **Voit säästää rahaa kävelemällä.** „Можеш да заштедиш пари одејќи пеш.“ Спореди **-en** (начин, истовремено): **Hän tuli hymyillen** наспроти **Hän ansaitsee rahaa opettamalla** „заработува пари предавајќи“.
  fi-minen:
    meaning: "-minen: глаголот како именка"
    intro: |
      **-minen** (четвртиот инфинитив) го прави секој глагол именка што целосно се менува — како македонското **-ње**: **lukeminen** „читање“, **Lukeminen on hauskaa.** „Читањето е забавно.“ **Pidän uimisesta.** „Сакам пливање.“ **Lopeta valittaminen!** „Престани да се жалиш!“

      Формалните текстови градат долги именски низи со него: **asunnon ostamisen helpottaminen** „олеснување на купувањето стан“.
  fi-possessive-postpositions:
    meaning: "присвојни наставки на постпозиции и устаалени зборови"
    intro: |
      Пишаниот фински ја става присвојната наставка на постпозициите наместо (или покрај) заменката: **(minun) kanssani** „со мене“, **(sinun) luoksesi** „кај тебе“, **hänen vuokseen** „заради него“.

      Некои се устаалени изрази за мислење и спротивставување: **mielestäni** „според мене“, **puolestani** „што се однесува до мене“, **hän puolestaan** „тој пак“, **vuorostaan** „за возврат“.
  fi-clitics:
    meaning: "клитиките -han, -pa, -kin"
    intro: |
      Мали наставки што се лепат на првиот збор во реченицата и го менуваат тонот:

      - **-han / -hän**: омекнува, *па, знаеш*: **Tulethan huomenna?** „Ќе дојдеш утре, нели?“ **Sehän on hyvä!** „Па тоа е добро!“
      - **-pa / -pä**: нагласување, изненадување: **Onpa kaunis päivä!** „Каков убав ден!“ **Tulepa tänne!** „Ајде дојди тука!“
      - **-kin**: *и, навистина*: **Minäkin tulen.** „И јас доаѓам.“ **Hän tulikin.** „И навистина дојде.“
  fi-spoken-pronouns:
    meaning: "говорни заменки: mä, sä, mun, mulla"
    intro: |
      Говорниот фински (и голем дел од Tatoeba) ги скратува заменките:

      | стандард | говор |
      |---|---|
      | minä, sinä | mä, sä (и mää, sää) |
      | minun, sinun | mun, sun |
      | minulla, sinulla | mulla, sulla |
      | minulle, sinulle | mulle, sulle |
      | minua, sinua | mua, sua |
      | hän | se (и за луѓе) |

      **Mä en tiedä.** „Не знам.“ **Onks sulla aikaa?** „Имаш ли време?“
  fi-me-mennaan:
    meaning: "говорното „ние“: пасивната форма"
    intro: |
      Во говорот *ние* ја зема пасивната форма наместо 1 лице множина: **me mennään** наместо **me menemme**, **me ollaan** наместо **me olemme**, **me ei tiedetä** наместо **me emme tiedä**. Без **me**, пасивот често значи *ајде да*: **Mennään!** „Ајде да одиме!“ Во формални текстови пиши **menemme**.
  fi-necessive-participle:
    meaning: "мора: генитив + on + -tAvA"
    intro: |
      Формалниот фински *мора* го кажува со сегашниот пасивен партицип на **-tAvA** по **on**, со лицето во генитив: **Minun on lähdettävä.** „Морам да заминам.“ **Sinun on tehtävä se heti.** „Мораш да го направиш веднаш.“ **Asiakkaan on maksettava lasku.** „Клиентот мора да ја плати сметката.“

      Одречно: **Sinun ei ole pakko / tarvitse …**, а не ~~ei ole tehtävä~~ (тоа значи *не смее да се прави*).
  fi-feeling-verbs:
    meaning: "глаголи на чувство со доживувач во партитив"
    intro: |
      Многу осети се глаголи на **-ttAA** без подмет; оној што чувствува е во **партитив** — слично на македонското **ме фаќа сон**: **Minua väsyttää.** „Ми се спие / уморен сум.“ **Häntä naurattaa.** „Му доаѓа да се смее.“ **Meitä janottaa.** „Жедни сме.“ Други: **pelottaa** (се плаши), **harmittaa** (е налутен), **hävettää** (се срами), **kaduttaa** (се кае), **jännittää** (е нервозен), **kiinnostaa** (е заинтересиран), **kyllästyttää** (му е преку глава).
    mistakes: ["Оној што чувствува е во партитив, не во номинатив."]
  fi-maton:
    meaning: "-mAtOn: одречниот партицип"
    intro: |
      **-mAtOn / -mätön** е партицип што значи *(сѐ уште) ненаправено*: **lukematon kirja** „непрочитана книга“, **syömätön ruoka** „неизедена храна“, **tuntematon sotilas** „непознатиот војник“. Многу станале придавки: **uskomaton** „неверојатен“, **mahdoton** (од **-ton**) „невозможен“, **näkymätön** „невидлив“, **väsymätön** „неуморен“. Се менува како зборовите на **-ton**: **lukemattomia kirjoja**.
  fi-negative-polarity:
    meaning: "некој, нешто, некогаш: зборовите на -kAAn со негација"
    intro: |
      Со негација (или во прашање со сомнеж) финскиот ги користи формите на **-kaan / -kään**: **En nähnyt ketään.** „Не видов никого.“ **Hän ei sanonut mitään.** „Ништо не рече.“ **En ole koskaan käynyt siellä.** „Никогаш не сум бил таму.“ Исто **missään** (никаде), **mihinkään** (никаде — кон), **yhtään** (воопшто ниеден), **lainkaan** (воопшто), **ikinä** (некогаш). Без негација: **joku, jotain, joskus**.
  fi-tahansa:
    meaning: "слободен избор: кој било, каде и да е"
    intro: |
      Прашален збор + **tahansa** или **hyvänsä** значи *кој било*; прашалниот збор го зема падежот што го бара реченицата: **Kuka tahansa voi tulla.** „Секој може да дојде.“ **Voit soittaa milloin tahansa.** „Можеш да се јавиш кога било.“ **Ota mikä tahansa.** „Земи кој било.“ **Kenelle tahansa** „на кој било“. Спореди **kukaan** (со негација) и **joku** (некој).
  fi-indirect-questions:
    meaning: "индиректни прашања со да/не со -kO"
    intro: |
      Индиректното прашање со да/не го задржува **-ko / -kö** на првиот збор; нема посебен збор за *дали*: **En tiedä, tuleeko hän.** „Не знам дали доаѓа.“ **Kysyin, oliko hän kotona.** „Прашав дали е дома.“ **Mietin, kannattaako se.** „Се прашувам дали се исплати.“ Не користи **jos** тука: **jos** е само условното *ако*.
    mistakes: ["Индиректните прашања земаат -kO, не jos."]
  fi-comitative:
    meaning: "комитативот -ine-: заедно со (своите)"
    intro: |
      Комитативот е секогаш во форма на множина и кај именките зема присвојна наставка: **Hän tuli perheineen.** „Дојде со семејството.“ **vaimoineen** „со жена си“, **lapsineni** „со моите деца“. Придавката пред него има **-ine** без наставка: **suurine toiveineen** „со своите големи надежи“. Припаѓа на формалниот и книжевниот стил; во говорот се вели **perheen kanssa**.
  fi-instructive:
    meaning: "инструктивот -in во устаалени изрази"
    intro: |
      Инструктивот (**-n**, обично на основата за множина) кажува начин или средство и живее во устаалени изрази: **omin silmin** „со свои очи“, **paljain jaloin** „бос“, **avoimin mielin** „со отворен ум“, **jalan** „пеш“, **käsin** „рачно“, **kaksin** „двајца“, **yksin** „сам“, **toisin sanoen** „со други зборови“, **hyvin** „добро“. Никогаш нема своја придавска наставка: и именката и придавката завршуваат на **-in**.
  fi-prolative:
    meaning: "пролативот -tse: преку, по пат на"
    intro: |
      **-tse** значи *преку, по пат на*, на краток список зборови: **postitse** „по пошта“, **sähköpostitse** „по е-пошта“, **puhelimitse** „по телефон“, **maitse** „по копно“, **meritse** „по море“, **ilmateitse** „по воздух“, **netitse** „преку интернет“. Тоа е вкочанета наставка, не полн падеж: обичните именки користат **kautta** или **-llA**: **Helsingin kautta** „преку Хелсинки“.
  fi-spoken-verbs:
    meaning: "кратки говорни глаголски форми"
    intro: |
      Секојдневниот говор ги скратува честите глаголи: **oon, oot** (olen, olet), **tuun, tuut** (tulen, tulet), **meen, meet** (menen, menet), **paan** (panen), и ги изостава крајните гласови: **mennää** (mennään), **onks** (onko), **eiks** (eikö). Прашалната клитика станува **-ks**: **Ooks sä kotona?** „Дома ли си?“ Читај ги во четови, титлови и дијалози; во текстови пиши стандардни форми.
