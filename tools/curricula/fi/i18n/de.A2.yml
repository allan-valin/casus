# German text of the Finnish course, A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The past: "Die Vergangenheit"
  Plurals: "Plurale"
  Objects and verb government: "Objekte und Rektion"
  Joining sentences: "Sätze verbinden"
  Comparing: "Vergleichen"
lessons:
  fi-past:
    meaning: "die Vergangenheit (Imperfekt)"
    intro: |
      Die Vergangenheit setzt **-i-** zwischen Stamm und Personalendung: **puhun → puhuin, asun → asuin, tulen → tulin, haluan → halusin** (Typ 4: **-si-**), **tarvitsen → tarvitsin**. 3. Person Singular: nur **-i**: **hän puhui, hän tuli, hän halusi**.

      Das **-i-** ändert den Vokal davor:

      - **a, ä, e** fallen weg: **tule-i → tuli, menen → menin**
      - in zweisilbigen Verben wird **a** nach **a, e, i** in der ersten Silbe zu **o**: **antaa → annoin, maksaa → maksoin**, aber **ottaa → otin**
      - Langvokale werden kurz: **saada → sain, juoda → join, syödä → söin, viedä → vein**
      - **t → s** in vielen Verben: **tietää → tiesin, ymmärtää → ymmärsin, lentää → lensin**

      Die Vergangenheit ist die gewöhnliche Erzählzeit: **Eilen kävin kaupassa.** „Gestern war ich im Laden.“
    mistakes: ["Das e des Stammes fällt vor -i- weg."]
  fi-past-negative:
    meaning: "die verneinte Vergangenheit: en + Partizip auf -nut"
    intro: |
      Die verneinte Vergangenheit ist **en, et, ei …** + das **aktive Partizip Perfekt**: **-nut / -nyt** im Singular, **-neet** im Plural: **En puhunut. Hän ei tullut. Emme tulleet.**

      Das **n** gleicht sich an einen Stamm auf **l, r, s** an: **tulla → tullut, purra → purrut, nousta → noussut, olla → ollut**. Typ 4 und 5: **-nnut**: **haluta → halunnut, tarvita → tarvinnut**.

      Vokalharmonie: **-nut** nach Verben mit hinteren Vokalen, **-nyt** nach vorderen: **syödä → syönyt, mennä → mennyt**.
    mistakes: ["Ein Pluralsubjekt verlangt -neet."]
  fi-perfect:
    meaning: "das Perfekt: olen + -nut"
    intro: |
      **olla** im Präsens + Partizip Perfekt: **Olen syönyt.** „Ich habe gegessen.“ **Oletko käynyt Suomessa?** „Warst du schon in Finnland?“ **He ovat asuneet täällä kauan.** „Sie wohnen schon lange hier.“ Das Partizip kongruiert im Numerus: **-nut/-nyt** (Singular), **-neet** (Plural).

      Gebrauch wie im Deutschen: Erfahrung bis jetzt, Ergebnisse, die jetzt zählen, Andauerndes. Das **Plusquamperfekt** nimmt die Vergangenheit von olla: **Olin syönyt.** „Ich hatte gegessen.“
  fi-plural-partitive:
    meaning: "der Partitiv Plural: -ja, -ita, -ia"
    intro: |
      Partitiv Plural: **-ja / -jä** nach Vokal (**talo → taloja, kirja → kirjoja, kissa → kissoja**), **-ia / -iä**, wenn der Pluralstamm einen Konsonanten vor dem i hat (**pöytä → pöytiä, päivä → päiviä, nainen → naisia**), **-ita / -itä** nach langem Vokal (**maa → maita, huone → huoneita**).

      Gebrauch wie der Partitiv Singular, für **eine unbestimmte Anzahl**: **Ostin omenoita.** „Ich habe (ein paar) Äpfel gekauft.“ **Talot ovat isoja.** Nach olla stehen Pluraladjektive im Partitiv.
  fi-plural-cases:
    meaning: "der Pluralstamm -i- in den übrigen Kasus"
    intro: |
      Außerhalb des Nominativs ist das Pluralzeichen **-i-** (**-j-** zwischen Vokalen), vor der Kasusendung: **talo-i-ssa, kirjo-i-sta, kaupo-i-lle**. Das **-i-** ändert den Stammvokal wie in der Vergangenheit: **a → o** oder fällt weg (**kirja → kirjoissa, kissa → kissoissa, koira → koirissa**), **ä, e fallen weg** (**päivä → päivissä**), Langvokale werden kurz (**maa → maissa, työ → töissä**). Genitiv Plural: **-jen / -iden / -ten**: **talojen, maiden, naisten**.
  fi-object:
    meaning: "das Objekt: Partitiv oder Genitiv?"
    intro: |
      Das direkte Objekt hat **zwei** Kasus, und die Wahl ändert die Bedeutung:

      - **Genitiv** (-n) für ein Ganzes, ein abgeschlossenes Ergebnis: **Luin kirjan.** „Ich habe das Buch (zu Ende) gelesen.“ **Ostan auton.** „Ich werde das Auto kaufen.“
      - **Partitiv** für Unabgeschlossenes, einen Teil, eine Menge oder nach Verneinung: **Luin kirjaa.** „Ich las (gerade) das Buch.“ **Ostan maitoa.** „Ich kaufe Milch.“ **En osta autoa.** „Ich kaufe das Auto nicht.“

      Manche Verben nehmen immer den Partitiv (Gefühle und andauernde Zustände): **rakastaa, ajatella, odottaa, auttaa, kiittää**: **Odotan bussia.**
    mistakes: ["Nach einer Verneinung steht das Objekt im Partitiv."]
  fi-government:
    meaning: "Verben mit festem Kasus: pitää jostakin, tutustua johonkin"
    intro: |
      Viele Verben verlangen einen bestimmten Kasus, der mit dem Verb gelernt wird:

      - **Elativ (-sta)**: **pitää** (mögen), **tykätä** (mögen), **kiinnostua** (sich interessieren), **nauttia** (genießen), **huolehtia** (sich kümmern), **puhua / kertoa** (sprechen / erzählen über), **unelmoida** (träumen von): **Pidän sinusta.** „Ich mag dich.“
      - **Illativ (-Vn)**: **tutustua** (kennenlernen), **osallistua** (teilnehmen), **rakastua** (sich verlieben), **uskoa** (glauben an), **luottaa** (vertrauen), **vastata** (antworten), **tottua** (sich gewöhnen): **Rakastuin häneen.**
      - **Allativ (-lle)**: **soittaa** (anrufen), **antaa** (geben), **kertoa** (jemandem erzählen), **nauraa** (lachen über): **Soitan sinulle.**
      - **Adessiv (-lla)**: **on** (haben, siehe *minulla on*)
    mistakes: ["pitää „mögen“ verlangt den Elativ."]
  fi-necessity:
    meaning: "müssen: minun täytyy, minun pitää (Subjekt im Genitiv)"
    intro: |
      **täytyy, pitää, tarvitsee** (verneint), **kannattaa** (es lohnt sich), **on pakko** (es ist ein Muss) und **on** + Adjektiv (**on helppo** es ist leicht) nehmen die Person im **Genitiv** und bleiben in der 3. Person Singular: **Minun täytyy mennä.** „Ich muss gehen.“ **Sinun pitää levätä.** „Du solltest dich ausruhen.“ **Hänen ei tarvitse tulla.** „Er braucht nicht zu kommen.“
    mistakes: ["täytyy verlangt ein Subjekt im Genitiv."]
  fi-conjunctions:
    meaning: "dass, weil, als, wenn: unterordnende Konjunktionen"
    intro: |
      **että** dass, **koska** weil, **kun** als / wenn (*als* im Vergleich ist **kuin**), **jos** wenn (Bedingung), **vaikka** obwohl, **kunnes** bis, **jotta** damit, **ennen kuin** bevor, **sen jälkeen kun** nachdem. Davor steht immer ein Komma. Die Wortstellung im Nebensatz bleibt wie im Hauptsatz: **Tiedän, että hän tulee.**

      **ja** und, **mutta** aber, **tai** oder, **vai** oder (in Fragen: **teetä vai kahvia?**), **vaan** sondern (nach Verneinung): **Hän ei ole suomalainen vaan ruotsalainen.**
  fi-time:
    meaning: "Zeitangaben: Tage, Monate, Uhrzeit"
    intro: |
      **Tage** nehmen den Essiv **-na**: **maanantaina** (am Montag), **tiistaina, keskiviikkona, torstaina, perjantaina, lauantaina, sunnuntaina**; auch **viikonloppuna** (am Wochenende), **jouluna**. **Monate** (alle auf **-kuu**) nehmen den Inessiv: **tammikuussa** (im Januar), **kesäkuussa**. **Jahreszeiten**: **keväällä, kesällä, syksyllä, talvella** (Adessiv). **Uhrzeit**: **kello kolme** (um drei), **puoli neljä** (halb vier).
  fi-comparison:
    meaning: "Komparativ -mpi und Superlativ -in"
    intro: |
      **Komparativ**: Stamm + **-mpi** (**iso → isompi, kallis → kalliimpi, helppo → helpompi**); zweisilbige Stämme auf **-a/-ä** wandeln es zu **e** (**vanha → vanhempi**). **Superlativ**: **-in** (**isoin, vanhin, kallein**). Unregelmäßig: **hyvä → parempi → paras**, **pitkä → pidempi**.

      *Als* ist **kuin** (**Hän on pidempi kuin minä**) oder der Partitiv des Verglichenen (**Hän on minua pidempi**). Beide werden dekliniert: **isommassa talossa, parhaat ystävät**.
