# Arabic text of the Finnish course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Clause substitutes: "بدائل الجمل"
  The third and fourth infinitives: "المصدران الثالث والرابع"
  Spoken Finnish and clitics: "الفنلندية المحكية واللواحق اللصيقة"
  Modality and feeling: "الوجوب والمشاعر"
  Indefinites and questions: "النكرات والأسئلة"
  Rare cases: "حالات نادرة"
  Spoken verb forms: "صيغ أفعال محكية"
lessons:
  fi-referative:
    meaning: "بنية النقل: جمل «أنّ» بأسماء الفاعل"
    intro: |
      بعد أفعال القول والظن والإدراك (**sanoa، kertoa، luulla، uskoa، tietää، huomata، nähdä، kuulla، toivoa**) يمكن أن تتحول جملة **että** إلى اسم فاعل في حالة الإضافة (*referatiivi*):

      - التزامن: **-vAn**: **Hän sanoi, että Anna tulee → Hän sanoi Annan tulevan.**
      - السبق: **-neen**: **Luulin, että hän oli lähtenyt → Luulin hänen lähteneen.**

      وإذا اتحد الفاعل مع فاعل الجملة الرئيسية حلّت محله لاحقة ملكية: **Hän sanoi tulevansa.** «قال إنه سيأتي». **Luulin olevani oikeassa.** «ظننت أنني على حق».
  fi-temporal:
    meaning: "البنية الزمنية: حين / بعد أن فعل"
    intro: |
      يمكن أن تختصر جملة **kun** إلى صيغة فعلية بلاحقة ملكية (فاعل واحد) أو بفاعل في الإضافة (فاعل آخر):

      - التزامن: **-essA** (المصدر الثاني، الظرفية الداخلية): **Kun tulin kotiin, … → Kotiin tullessani …** «حين عدت إلى البيت…» **Lasten nukkuessa luin.** «بينما كان الأطفال نائمين كنت أقرأ».
      - السبق: **-tUA** (اسم المفعول الماضي + لاحقة الجزئية): **Kun olin syönyt, … → Syötyäni …** «بعد أن أكلت…» **Sateen lakattua lähdimme.** «بعد أن توقف المطر انطلقنا».

      وهي من الفنلندية المكتوبة غالبًا: الأخبار والتقارير والأدب.
  fi-final:
    meaning: "بنية الغاية -Akseen: لكي"
    intro: |
      **jotta** + فعل (لكي) تصير حالة التحوّل من المصدر الأول + لاحقة ملكية إذا اتحد الفاعل: **-akse- / -äkse-** + **-ni، -si، -en، -mme، -nne، -en**:

      - **Tulin Suomeen, jotta oppisin suomea → Tulin Suomeen oppiakseni suomea.** «جئت إلى فنلندا لأتعلّم الفنلندية».
      - **Hän säästää rahaa ostaakseen auton.** «يدّخر المال ليشتري سيارة».

      وثابتة: **tietääkseni** «على حدّ علمي»، **muistaakseni** «إن لم تخنّي الذاكرة».
  fi-agent-participle:
    meaning: "اسم المفعول الفاعلي -mA: ما صنعه أحدهم"
    intro: |
      **-mA** + الفاعل في حالة الإضافة يحلّ محل جملة موصولة عن شيء فعله أحدهم:

      - **pullat, jotka äiti leipoi → äidin leipomat pullat** «الكعك الذي خبزته الأم»
      - مع الضمير لاحقة ملكية: **minun kirjoittamani kirje** (أو **kirjoittamani kirje** فقط) «الرسالة التي كتبتُها»
      - **Tämä on Sibeliuksen säveltämä sinfonia.** «هذه سيمفونية من تأليف سيبيليوس».

      ويُصرَّف كالصفة: **äidin leipomia pullia، isän rakentamassa talossa**.
  fi-modal-instructive:
    meaning: "الكيفية: المصدر الثاني بحالة الأداة -en"
    intro: |
      **-en** على جذر المصدر تبيّن كيف يُفعل الشيء (*بنية الكيفية*)، كالحال في العربية: **Hän tuli hymyillen.** «جاء مبتسمًا». **Lapset juoksivat nauraen.** «جرى الأطفال ضاحكين». **Kävelin laulaen.**

      وعبارات ثابتة: **toisin sanoen** «بعبارة أخرى»، **yleisesti ottaen** «بوجه عام»، **niin sanoakseni** «إن جاز التعبير».
  fi-matta:
    meaning: "-mAttA: دون أن يفعل"
    intro: |
      حالة «بدون» من المصدر الثالث، **-mAttA**، تعني *دون أن يفعل*: **Hän lähti sanomatta mitään.** «غادر دون أن يقول شيئًا». **Älä mene syömättä.** «لا تذهب دون أن تأكل».

      ومع **jättää** تعني *ترك الشيء دون فعل*: **Jätin kirjeen lukematta.** «تركت الرسالة دون قراءة». وهي من عائلة **-mAssA** (في أثناء الفعل)، و**-mAstA** (عائدًا من الفعل)، و**-mAAn** (ليفعل).
  fi-malla:
    meaning: "-mAllA: بفعل كذا"
    intro: |
      حالة -lla من المصدر الثالث، **-mAllA**، تعبّر عن الوسيلة: *بفعل كذا*: **Puhumalla oppii.** «بالكلام يتعلّم المرء». **Voit säästää rahaa kävelemällä.** «يمكنك توفير المال بالمشي». قارن **-en** (الكيفية والتزامن): **Hän tuli hymyillen** مقابل **Hän ansaitsee rahaa opettamalla** «يكسب المال بالتدريس».
  fi-minen:
    meaning: "-minen: الفعل اسمًا"
    intro: |
      **-minen** (المصدر الرابع) يحوّل أي فعل إلى اسم يُصرَّف تمامًا، كالمصدر العربي: **lukeminen** «القراءة»، **Lukeminen on hauskaa.** «القراءة ممتعة». **Pidän uimisesta.** «أحب السباحة». **Lopeta valittaminen!** «كفّ عن الشكوى!»

      والنصوص الرسمية تبني به سلاسل اسمية طويلة: **asunnon ostamisen helpottaminen** «تيسير شراء المساكن».
  fi-possessive-postpositions:
    meaning: "لواحق الملكية على الظروف التالية والعبارات الثابتة"
    intro: |
      تضع الفنلندية المكتوبة لاحقة الملكية على الظروف التالية بدل الضمير (أو معه): **(minun) kanssani** «معي»، **(sinun) luoksesi** «إليك (إلى بيتك)»، **hänen vuokseen** «من أجله».

      وبعضها عبارات ثابتة للرأي والمقابلة: **mielestäni** «في رأيي»، **puolestani** «أمّا أنا»، **hän puolestaan** «أمّا هو»، **vuorostaan** «بدوره».
  fi-clitics:
    meaning: "اللواحق اللصيقة -han، -pa، -kin"
    intro: |
      لواحق صغيرة تلتصق بأول كلمة في الجملة وتغيّر نبرتها:

      - **-han / -hän**: تليين، *أليس كذلك، كما تعلم*: **Tulethan huomenna?** «ستأتي غدًا، أليس كذلك؟» **Sehän on hyvä!** «هذا جيد إذن!»
      - **-pa / -pä**: توكيد ودهشة: **Onpa kaunis päivä!** «ما أجمل اليوم!» **Tulepa tänne!** «تعالَ هنا!»
      - **-kin**: *أيضًا، فعلًا*: **Minäkin tulen.** «سآتي أنا أيضًا». **Hän tulikin.** «وقد جاء فعلًا».
  fi-spoken-pronouns:
    meaning: "الضمائر المحكية: mä، sä، mun، mulla"
    intro: |
      الفنلندية المحكية (وكثير من Tatoeba) تختصر الضمائر:

      | المعيارية | المحكية |
      |---|---|
      | minä، sinä | mä، sä (وأيضًا mää، sää) |
      | minun، sinun | mun، sun |
      | minulla، sinulla | mulla، sulla |
      | minulle، sinulle | mulle، sulle |
      | minua، sinua | mua، sua |
      | hän | se (للأشخاص أيضًا) |

      **Mä en tiedä.** «لا أعرف». **Onks sulla aikaa?** «هل عندك وقت؟»
  fi-me-mennaan:
    meaning: "«نحن» في الكلام: صيغة المجهول"
    intro: |
      في الكلام تأخذ *نحن* صيغة المجهول بدل المتكلمين: **me mennään** بدل **me menemme**، و**me ollaan** بدل **me olemme**، و**me ei tiedetä** بدل **me emme tiedä**. وبدون **me** كثيرًا ما يعني المجهول *لِنَـ*: **Mennään!** «هيا بنا!» واكتب **menemme** في النصوص الرسمية.
  fi-necessive-participle:
    meaning: "الوجوب: الإضافة + on + -tAvA"
    intro: |
      الفنلندية الرسمية تعبّر عن *يجب* باسم المفعول الحاضر المنتهي بـ **-tAvA** بعد **on**، والشخص في حالة الإضافة: **Minun on lähdettävä.** «عليّ أن أغادر». **Sinun on tehtävä se heti.** «عليك أن تفعله فورًا». **Asiakkaan on maksettava lasku.** «على الزبون أن يدفع الفاتورة».

      النفي: **Sinun ei ole pakko / tarvitse …**، لا ~~ei ole tehtävä~~ (فهذه تعني *لا يجوز فعله*).
  fi-feeling-verbs:
    meaning: "أفعال المشاعر والشاعر في الجزئية"
    intro: |
      كثير من الأحاسيس أفعال بـ **-ttAA** بلا فاعل؛ ومن يشعر بها في **حالة الجزئية**: **Minua väsyttää.** «يغلبني النعاس». **Häntä naurattaa.** «يكاد يضحك». **Meitä janottaa.** «نحن عطاش». وغيرها: **pelottaa** (يخاف)، **harmittaa** (ينزعج)، **hävettää** (يخجل)، **kaduttaa** (يندم)، **jännittää** (يتوتّر)، **kiinnostaa** (يهتم)، **kyllästyttää** (يضجر).
    mistakes: ["من يشعر في حالة الجزئية لا الرفع."]
  fi-maton:
    meaning: "-mAtOn: اسم المفعول المنفي"
    intro: |
      **-mAtOn / -mätön** اسم مفعول يعني *ما لم يُفعل (بعد)*: **lukematon kirja** «كتاب لم يُقرأ»، **syömätön ruoka** «طعام لم يؤكل»، **tuntematon sotilas** «الجندي المجهول». وكثير منها صار صفات: **uskomaton** «لا يُصدَّق»، **mahdoton** (من **-ton**) «مستحيل»، **näkymätön** «غير مرئي»، **väsymätön** «لا يكلّ». ويُصرَّف ككلمات **-ton**: **lukemattomia kirjoja**.
  fi-negative-polarity:
    meaning: "أحد، شيء، قطّ: كلمات -kAAn مع النفي"
    intro: |
      مع النفي (أو في سؤال فيه شك) تستعمل الفنلندية صيغ **-kaan / -kään**: **En nähnyt ketään.** «لم أرَ أحدًا». **Hän ei sanonut mitään.** «لم يقل شيئًا». **En ole koskaan käynyt siellä.** «لم أذهب إلى هناك قطّ». وكذلك **missään** (في أي مكان)، **mihinkään** (إلى أي مكان)، **yhtään** (ولا واحد)، **lainkaan** (إطلاقًا)، **ikinä** (أبدًا). وبلا نفي: **joku، jotain، joskus**.
  fi-tahansa:
    meaning: "حرية الاختيار: أيّ أحد، أينما"
    intro: |
      أداة استفهام + **tahansa** أو **hyvänsä** تعني *أيّ… كان*؛ وتأخذ الأداة الحالة التي تحتاجها الجملة: **Kuka tahansa voi tulla.** «يمكن لأي أحد أن يأتي». **Voit soittaa milloin tahansa.** «يمكنك الاتصال في أي وقت». **Ota mikä tahansa.** «خذ أيًّا منها». **Kenelle tahansa** «لأيّ أحد». قارن **kukaan** (مع النفي) و**joku** (أحدهم).
  fi-indirect-questions:
    meaning: "الأسئلة غير المباشرة بـ -kO"
    intro: |
      السؤال غير المباشر بنعم/لا يحتفظ بـ **-ko / -kö** على كلمته الأولى؛ ولا كلمة لـ*هل*: **En tiedä, tuleeko hän.** «لا أعرف هل سيأتي». **Kysyin, oliko hän kotona.** «سألت هل كان في البيت». **Mietin, kannattaako se.** «أتساءل هل يستحق ذلك». ولا تستعمل **jos** هنا: **jos** للشرط فقط.
    mistakes: ["الأسئلة غير المباشرة تأخذ -kO لا jos."]
  fi-comitative:
    meaning: "حالة المصاحبة -ine-: مع (أهله ونحوهم)"
    intro: |
      حالة المصاحبة بصيغة الجمع دائمًا، وتأخذ في الأسماء لاحقة ملكية: **Hän tuli perheineen.** «جاء مع عائلته». **vaimoineen** «مع زوجته»، **lapsineni** «مع أطفالي». والصفة قبلها تأخذ **-ine** بلا لاحقة: **suurine toiveineen** «بآماله الكبيرة». وهي من الأسلوب الرسمي والأدبي؛ والكلام يقول **perheen kanssa**.
  fi-instructive:
    meaning: "حالة الأداة -in في العبارات الثابتة"
    intro: |
      حالة الأداة (**-n**، غالبًا على جذر الجمع) تدل على الكيفية أو الوسيلة وتعيش في عبارات ثابتة: **omin silmin** «بأم عيني»، **paljain jaloin** «حافيًا»، **avoimin mielin** «بعقل منفتح»، **jalan** «سيرًا»، **käsin** «باليد»، **kaksin** «نحن الاثنين»، **yksin** «وحده»، **toisin sanoen** «بعبارة أخرى»، **hyvin** «جيدًا». ولا تأخذ لاحقة صفة خاصة بها: الاسم والصفة كلاهما بـ **-in**.
  fi-prolative:
    meaning: "حالة -tse: عن طريق"
    intro: |
      **-tse** تعني *عن طريق، بواسطة*، في قائمة قصيرة من الكلمات: **postitse** «بالبريد»، **sähköpostitse** «بالبريد الإلكتروني»، **puhelimitse** «بالهاتف»، **maitse** «برًّا»، **meritse** «بحرًا»، **ilmateitse** «جوًّا»، **netitse** «عبر الإنترنت». وهي لاحقة متحجرة لا حالة كاملة: الأسماء العادية تستعمل **kautta** أو **-llA**: **Helsingin kautta** «عبر هلسنكي».
  fi-spoken-verbs:
    meaning: "صيغ أفعال محكية قصيرة"
    intro: |
      الكلام اليومي يختصر الأفعال الشائعة: **oon، oot** (olen، olet)، **tuun، tuut** (tulen، tulet)، **meen، meet** (menen، menet)، **paan** (panen)، ويحذف الأصوات الأخيرة: **mennää** (mennään)، **onks** (onko)، **eiks** (eikö). ولاحقة السؤال تصير **-ks**: **Ooks sä kotona?** «هل أنت في البيت؟» اقرأها في المحادثات والترجمات والحوارات؛ واكتب الصيغ المعيارية في النصوص.
