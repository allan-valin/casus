# Arabic text of the Finnish course, A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and vowel harmony: "الأصوات وتناغم الصوائت"
  Pronouns and 'olla': "الضمائر و«olla»"
  Present tense by verb type: "المضارع حسب نوع الفعل"
  Negation and questions: "النفي والأسئلة"
  Nouns and their cases: "الأسماء وحالاتها"
  Imperative: "الأمر"
lessons:
  fi-harmony:
    meaning: "تناغم الصوائت: ‎-ssa أم ‎-ssä؟"
    intro: |
      تُكتب الفنلندية كما تُنطق: كل حرف يُنطق دائمًا بالطريقة نفسها، و**الحرف المضعّف صوت طويل** يغيّر المعنى: **tuli** (نار) – **tuuli** (ريح) – **tulli** (جمارك).

      تنقسم الصوائت ثلاث مجموعات:

      - **خلفية**: **a، o، u**
      - **أمامية**: **ä، ö، y**
      - **محايدة**: **e، i**

      للواحق شكلان، والكلمة تختار: الكلمة ذات الصائت الخلفي تأخذ **-ssa، -sta، -lla، -ko، -a**؛ والكلمة ذات الصوائت الأمامية (أو المحايدة) فقط تأخذ **-ssä، -stä، -llä، -kö، -ä**: **talo → talossa** (في البيت)، **metsä → metsässä** (في الغابة)، **kirje → kirjeessä** (في الرسالة). وفي الكلمة المركبة يحسم الجزء الأخير: **kirjakauppa → kirjakaupassa**.
    mistakes: ["metsä صوائتها أمامية فقط: كل لاحقة تأخذ ä."]
  fi-olla:
    meaning: "الضمائر الشخصية وolla «يكون»"
    intro: |
      **minä** أنا، **sinä** أنتَ/أنتِ، **hän** هو/هي (كلمة واحدة للجنسين، للأشخاص دائمًا)، **me** نحن، **te** أنتم (وللاحترام)، **he** هم (أشخاص). والأشياء **se** (هو/هي لغير العاقل) و**ne** (هي/هم). وفي الكلام تُسمع **mä، sä، se، me، te، ne**.

      لاحقة الفعل تدل على الفاعل: **olen** = أكون، فيُحذف الضمير غالبًا في المتكلم والمخاطب (**Olen Anna.**)، ولا يُحذف في الغائب أبدًا (**Hän on Anna.**).
  fi-type1:
    meaning: "النوع الأول من الأفعال: puhua، asua، lukea"
    intro: |
      تنقسم الأفعال الفنلندية ستة أنواع حسب نهاية المصدر (صيغة القاموس). **النوع الأول** ينتهي بـ **صائتين**، آخرهما **-a / -ä**: **puhua** (يتكلم)، **asua** (يسكن)، **lukea** (يقرأ)، **ottaa** (يأخذ). احذف **-a/-ä** وأضف اللواحق الشخصية:

      | | |
      |---|---|
      | minä puhu**n** | me puhu**mme** |
      | sinä puhu**t** | te puhu**tte** |
      | hän puhu**u** (يُضعَّف الصائت) | he puhu**vat / -vät** |

      كثير من أفعال النوع الأول تغيّر ساكن الجذر (**تدرّج السواكن**، الدروس التالية): **ottaa → otan**، **lukea → luen**، لكن الغائب يحتفظ بالجذر القوي: **ottaa → hän ottaa**.
    mistakes: ["الغائب المفرد يضعّف آخر صائت في الجذر."]
  fi-type2:
    meaning: "النوع الثاني: syödä، juoda، saada"
    intro: |
      **النوع الثاني** ينتهي بـ **-da / -dä** بعد صائت: **syödä** (يأكل)، **juoda** (يشرب)، **saada** (ينال)، **voida** (يستطيع)، **tehdä** (يفعل، شاذ: **teen**)، **nähdä** (يرى: **näen**). احذف **-da/-dä**؛ والغائب المفرد لا يضيف شيئًا: **hän syö، hän juo، hän saa**.

      **syön، syöt، syö، syömme، syötte، syövät.** لا تدرّج في هذا النوع.
  fi-type3:
    meaning: "النوع الثالث: tulla، mennä، purra، nousta"
    intro: |
      **النوع الثالث** ينتهي بـ **-lla، -nna، -rra، -sta** (و**-llä، -nnä، -rrä، -stä**): **tulla** (يأتي)، **mennä** (يذهب)، **olla** (يكون، شاذ)، **purra** (يعضّ)، **nousta** (ينهض)، **pestä** (يغسل). احذف **-la/-na/-ra/-ta**، وأضف **-e-** ثم اللواحق: **tul-e-n، men-e-n، nous-e-n، pes-e-n**. والغائب المفرد يضعّف e: **hän tulee، hän menee**.
  fi-type4:
    meaning: "النوع الرابع: haluta، tavata، pelätä"
    intro: |
      **النوع الرابع** ينتهي بـ **صائت + -ta / -tä**: **haluta** (يريد)، **tavata** (يقابل)، **osata** (يُحسن)، **pelätä** (يخاف)، **siivota** (ينظّف). احذف **-ta/-tä** وأضف **-a-/-ä-**: **halu-a-n، halu-a-t، halua-a، halua-mme، halua-tte، halua-vat**. وإذا انتهى الجذر بـ a فالغائب المفرد **-aa** فقط: **hän haluaa، hän tapaa**. والتدرّج هنا معكوس (ضعيف → قوي): **tavata → tapaan**.
  fi-type5:
    meaning: "النوع الخامس: tarvita، valita، häiritä"
    intro: |
      **النوع الخامس** ينتهي بـ **-ita / -itä**: **tarvita** (يحتاج)، **valita** (يختار)، **häiritä** (يزعج)، **merkitä** (يعني). احذف **-ta/-tä** وأضف **-tse-**: **tarvi-tse-n، tarvitset، tarvitsee، tarvitsemme، tarvitsette، tarvitsevat**. لا تدرّج.

      (**النوع السادس**، **-eta / -etä**، غالبًا أفعال الصيرورة — **vanheta** يشيخ → **vanhenen** — يضيف **-ne-**.)
  fi-gradation:
    meaning: "تدرّج السواكن: kk → k، pp → p، tt → t، nt → nn…"
    intro: |
      في كثير من الكلمات **يضعف** الساكن في أول المقطع الأخير حين ينغلق المقطع (يتبعه ساكن: **-n، -t، -mme، -tte**، وكثير من لواحق الحالات):

      | قوي | ضعيف | مثال |
      |---|---|---|
      | kk | k | nukkua → nu**k**un |
      | pp | p | oppia → o**p**in |
      | tt | t | ottaa → o**t**an |
      | k | – | lukea → luen |
      | p | v | tupa → tuvassa |
      | t | d | tietää → tiedän |
      | nt | nn | ranta → ra**nn**alla |
      | nk | ng | kenkä → kengät |
      | mp | mm | ampua → ammun |
      | lt | ll | kieltää → kiellän |
      | rt | rr | kertoa → kerron |

      النوعان 1–2 من قوي إلى ضعيف (**nukkua → nukun**، لكن **hän nukkuu**: الغائب لا يغلق المقطع)؛ والنوعان 3–4 من ضعيف إلى قوي (**tavata → tapaan**).
    mistakes: ["-n تغلق المقطع: kk تضعف إلى k."]
  fi-negation:
    meaning: "فعل النفي: en، et، ei، emme، ette، eivät"
    intro: |
      تنفي الفنلندية بـ **فعل خاص** يأخذ اللاحقة الشخصية؛ ويبقى الفعل الرئيسي جذرًا مجرّدًا (جذر المضارع بلا لاحقة):

      | | |
      |---|---|
      | minä **en** puhu | me **emme** puhu |
      | sinä **et** puhu | te **ette** puhu |
      | hän **ei** puhu | he **eivät** puhu |

      **olla → en ole، tulla → en tule، haluta → en halua، tarvita → en tarvitse.** التدرّج: الجذر ضعيف كالمتكلم: **en nuku**.
    mistakes: ["فعل النفي يطابق الفاعل."]
  fi-question-ko:
    meaning: "أسئلة نعم/لا بـ -ko / -kö"
    intro: |
      سؤال نعم/لا يضع **-ko / -kö** على الكلمة المسؤول عنها وينقلها إلى البداية: **Puhut suomea.** → **Puhutko suomea?** «هل تتكلم الفنلندية؟»؛ **Onko tämä sinun?** «هل هذا لك؟»؛ **Sinäkö sen teit?** «أأنت من فعل ذلك؟». وتناغم الصوائت يختار **-ko** أو **-kö**.

      والجواب يكرّر الفعل: **Puhutko suomea? – Puhun. / En puhu.** (وتوجد أيضًا **kyllä** «نعم» و**ei** «لا».)
  fi-question-words:
    meaning: "أدوات الاستفهام"
    intro: |
      **mikä** ما، **kuka** من، **mitä** ماذا (حالة الجزئية: *ماذا تفعل*)، **missä** أين، **mistä** من أين، **mihin / minne** إلى أين، **milloin** متى، **miksi** لماذا، **miten / kuinka** كيف، **kuinka paljon** كم، **millainen** أيّ نوع، **kenen** لمن، **paljonko** كم.

      لاحظ «أين» الثلاث: حالات المكان من **mi-** (**missä، mistä، mihin**) توافق الجواب: **Missä asut? – Helsingissä. Mistä tulet? – Brasiliasta. Mihin menet? – Kauppaan.**
  fi-cases-overview:
    meaning: "الحالات: نظرة عامة"
    intro: |
      ليس في الفنلندية حروف جر حيث تستعمل العربية *في، من، إلى، على*: **اللواحق** تؤدي العمل. أهمها:

      - **الرفع** (الفاعل): **talo**
      - **الإضافة** (*لـ*، المالك): **talon**
      - **الجزئية** (جزء، كمية، مفعول حدث غير منتهٍ): **taloa**
      - **المكانية الداخلية**: **talossa** (في)، **talosta** (من داخل)، **taloon** (إلى داخل)
      - **المكانية الخارجية**: **talolla** (على، عند)، **talolta** (من على)، **talolle** (إلى، نحو)
      - **حالة الصفة** (بوصفه): **talona**، و**حالة التحوّل** (صار): **taloksi**

      لكل منها درسه؛ والجدول يعرض كلمتين كاملتين.
  fi-partitive:
    meaning: "حالة الجزئية في المفرد: بعض، جزء، بعد الأعداد"
    intro: |
      **حالة الجزئية** أكثر الحالات شيوعًا بعد الرفع. لواحقها: **-a / -ä** (**kahvi → kahvia، talo → taloa**)، **-ta / -tä** بعد صائت طويل أو ساكن (**maa → maata، nainen → naista، vesi → vettä**)، **-tta / -ttä** بعد -e (**huone → huonetta**).

      تُستعمل:

      - **لكمية غير محددة** من مادة: **Juon kahvia.** «أشرب (بعض) القهوة».
      - **بعد الأعداد** (من 2): **kaksi kahvia، kolme taloa**
      - **بعد أفعال كثيرة** (rakastaa، odottaa، auttaa…): **Rakastan sinua.**
      - **في الجمل المنفية**: **Minulla ei ole autoa.**
      - **للأحداث غير المنتهية**: **Luen kirjaa.** «أقرأ كتابًا».
    mistakes: ["بعد العدد: جزئية مفردة."]
  fi-numbers:
    meaning: "الأعداد والجزئية بعدها"
    intro: |
      **0 nolla، 1 yksi، 2 kaksi، 3 kolme، 4 neljä، 5 viisi، 6 kuusi، 7 seitsemän، 8 kahdeksan، 9 yhdeksän، 10 kymmenen.** من 11 إلى 19: **yksitoista** (11)، **kaksitoista** (12)… العشرات: **kaksikymmentä** (20)، **kolmekymmentä** (30). **sata** 100، **tuhat** 1000.

      بعد كل عدد عدا **yksi** يأتي الاسم في **الجزئية المفردة** — شبيه بتمييز العدد في العربية: **kaksi kissaa، kolme poikaa، kymmenen euroa**. ويبقى الفعل مفردًا: **Kaksi poikaa leikkii.**
  fi-genitive:
    meaning: "حالة الإضافة: -n (المالك، «لـ»)"
    intro: |
      **حالة الإضافة** تنتهي بـ **-n** وتأتي **قبل** الاسم الذي تنتمي إليه — عكس الإضافة العربية: **Annan kirja** «كتاب آنا»، **talon ovi** «باب البيت»، **Suomen pääkaupunki** «عاصمة فنلندا». والتدرّج يضعف الجذر: **kauppa → kaupan**، **pöytä → pöydän**. والكلمات المنتهية بـ **-e** تضعّفها: **huone → huoneen**؛ و**-nen** → **-sen**: **nainen → naisen**.

      وتعلّم الإضافة أيضًا فاعل **täytyy** (يجب) ومفعول الحدث المنتهي (دروس لاحقة).
  fi-plural:
    meaning: "الرفع في الجمع -t"
    intro: |
      الفاعل الجمع ينتهي بـ **-t**، على الجذر نفسه (الضعيف غالبًا) الذي للإضافة المفردة: **talo → talot، kauppa → kaupat، huone → huoneet، nainen → naiset، käsi → kädet**. ويطابقه الفعل: **Talot ovat isoja.** وبقية حالات الجمع تستعمل **-i-** (A2).
  fi-inner-local:
    meaning: "الداخل: ‎-ssa الظرفية، ‎-sta الخروج، ‎-Vn الدخول"
    intro: |
      ثلاث حالات **للداخل**:

      - **حالة الظرفية الداخلية -ssa/-ssä** «في»: **Asun Helsingissä.**
      - **حالة الخروج -sta/-stä** «من داخل، من»: **Tulen kaupasta.** وأيضًا «عن»: **puhua elokuvasta**
      - **حالة الدخول** «إلى داخل»: آخر صائت مضعّف + **-n** (**talo → taloon، kauppa → kauppaan**)، و**-hVn** بعد صائت طويل (**maa → maahan، työ → työhön**)، و**-seen** بعد صائت طويل في الكلمات الأطول (**huone → huoneeseen**). وتحتفظ حالة الدخول بالجذر **القوي**.

      المدن والبلدان والأماكن المغلقة تأخذ هذه: **Suomessa، Brasiliassa، koulussa، autossa**.
    mistakes: ["الحركة إلى الداخل: حالة الدخول لا الظرفية."]
  fi-outer-local:
    meaning: "على، عند: ‎-lla و‎-lta و‎-lle"
    intro: |
      ثلاث حالات **للسطح والقرب**:

      - **-lla/-llä** «على، عند»: **Kirja on pöydällä.** وأيضًا *بواسطة* (**bussilla** «بالحافلة») والزمن (**viikolla** «خلال الأسبوع»).
      - **-lta/-ltä** «من على، من (شخص)»: **Sain kirjeen äidiltä.**
      - **-lle** «إلى، على، لـ (شخص)»: **Annan kukan äidille.**

      والأماكن المفتوحة وبعض المدن تأخذ هذه أيضًا: **torilla** (في السوق)، **asemalla** (في المحطة)، **Tampereella**.
  fi-have:
    meaning: "«الملكية»: minulla on (عندي)"
    intro: |
      لا فعل *يملك* في الفنلندية — كالعربية «عندي». المالك في حالة **-lla** والفعل دائمًا **on**: **Minulla on auto.** «عندي سيارة». **Sinulla on، hänellä on، meillä on، teillä on، heillä on.** السؤال: **Onko sinulla…?** النفي: **Minulla ei ole autoa** (جزئية). والمشاعر كذلك: **Minulla on nälkä** «أنا جائع».
  fi-adjectives:
    meaning: "الصفات تطابق في الحالة والعدد"
    intro: |
      الصفة قبل الاسم تأخذ **الحالة والعدد نفسيهما**: **iso talo، isossa talossa، isoon taloon، isot talot، isoja taloja**. وبعد **olla** تكون الصفة في الرفع لشيء معدود واحد (**Talo on iso**) وفي الجزئية للمواد والجمع (**Vesi on kylmää. Talot ovat isoja.**).
  fi-demonstratives:
    meaning: "هذا، ذاك، هو: tämä، tuo، se"
    intro: |
      **tämä** هذا (قريب مني)، **tuo** ذاك (هناك)، **se** هو / ذلك (المذكور). الجمع: **nämä، nuo، ne**. وتُصرَّف: **tässä** (هنا، في هذا)، **tästä، tähän؛ tuossa، tuolla؛ siinä، sitä، sen**. وفي الكلام تُستعمل **se** و**ne** للأشخاص أيضًا.
  fi-imperative:
    meaning: "الأمر: tule!، tulkaa!، älä tule!"
    intro: |
      **للمفرد** الأمر هو جذر المتكلم المفرد بلا **-n**: **puhun → puhu!، tulen → tule!، haluan → halua!** **للجمع (أو للاحترام)**: جذر المصدر + **-kaa / -kää**: **puhukaa!، tulkaa!، syökää!**.

      النهي: **älä** (للمفرد) / **älkää** (للجمع) + الجذر المجرّد: **Älä mene! Älkää puhuko!** (الجمع يضيف **-ko/-kö**). و**-pa/-pä** تليّن الأمر: **Tulepa tänne!**
