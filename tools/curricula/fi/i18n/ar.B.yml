# Arabic text of the Finnish course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Moods: "الصيغ"
  The passive: "المجهول"
  Infinitives: "المصادر"
  Possessive suffixes: "لواحق الملكية"
  Participles: "أسماء الفاعل والمفعول"
  Rarer cases and forms: "حالات وصيغ أندر"
  Word formation: "الاشتقاق"
lessons:
  fi-conditional:
    meaning: "الشرط -isi-: لَـ…"
    intro: |
      صيغة الشرط تضع **-isi-** قبل اللاحقة الشخصية: **puhuisin، tulisin، haluaisin، olisin**. الغائب: **puhuisi، tulisi** (بلا صائت إضافي). و**e** و**i** في الجذر تسقطان: **tule-isi → tulisi**؛ والصوائت الطويلة تقصر كما في الماضي: **saada → saisin، syödä → söisin**.

      تُستعمل للرغبات والطلبات المهذبة (**Haluaisin kahvia.** «أودّ قهوة»)، وللشرط غير الواقع مع **jos**: **Jos minulla olisi rahaa, ostaisin talon.** «لو كان عندي مال لاشتريت بيتًا». والشرط الماضي: **olisin + -nut**: **Olisin tullut.** «لكنتُ جئت».
  fi-potential:
    meaning: "صيغة الاحتمال -ne-: على الأرجح (رسمية)"
    intro: |
      **صيغة الاحتمال** (-ne-) تعني *على الأرجح، ربما*: **Hän tullee huomenna.** «على الأرجح سيأتي غدًا». وتندغم **n** كما في اسم الفاعل الماضي: **tulla → tullee، nousta → noussee**؛ ولـ **olla** جذر خاص: **lienee** «لعله يكون». وهي من لغة الأخبار والوثائق الرسمية؛ وفي الكلام يقول الفنلنديون **varmaan، kai، ehkä** + الخبري.
  fi-imperative-3:
    meaning: "أوامر أخرى: ليأتِ، لنذهب"
    intro: |
      **الغائب**: **-koon / -köön**: **Tulkoon!** «ليأتِ!»، **Olkoon.** «فليكن». **المتكلمون** (رسمي): **-kaamme / -käämme**: **Menkäämme!** «لنذهب!» وفي الكلام اليومي *لِنَـ* هي المجهول: **Mennään!** «هيا بنا!»، **Syödään!** «لنأكل!».
  fi-passive:
    meaning: "المجهول في المضارع: «يُفعَل»"
    intro: |
      المجهول الفنلندي **بلا فاعل إطلاقًا** — *أحدهم، الناس* يفعلون: **Suomessa puhutaan suomea ja ruotsia.** «في فنلندا يُتكلَّم بالفنلندية والسويدية». يبقى المفعول في حالة المفعول (الرفع أو الجزئية)، وللجميع صيغة واحدة.

      الصياغة: خذ المصدر (الجذر الضعيف في النوعين 1–2) وأضف **-taan / -tään** (النوع 1: **puhua → puhutaan، ottaa → otetaan** — a → e)، و**-aan / -ään** بعد -da/-la/-na/-ta في الأنواع 2–6: **syödä → syödään، tulla → tullaan، mennä → mennään، haluta → halutaan، tarvita → tarvitaan**.

      وفي الكلام **me** + المجهول تعني *نحن*: **Me mennään** «نحن ذاهبون».
  fi-passive-past:
    meaning: "المجهول في الماضي: -ttiin، -tiin"
    intro: |
      المجهول الماضي: **-ttiin** للنوع 1 (**puhuttiin، otettiin**)، و**-tiin** للبقية (**syötiin، tultiin، mentiin، haluttiin، tarvittiin**). النفي: **ei** + اسم المفعول الماضي **-ttu / -tty**: **Ei puhuttu.** «لم يُتحدَّث عنه». والتام: **on puhuttu** «قد تُحدِّث عنه».
  fi-ma-infinitive:
    meaning: "مصدر -ma: ذاهب ليفعل، في أثناء الفعل، عائد من الفعل"
    intro: |
      **المصدر الثالث** هو جذر الغائب الجمع + **-ma-** مع لاحقة حالة مكانية، ويعمل كأنه مكان:

      - **-maan** (إلى): بعد أفعال الحركة وغيرها: **Menen ostamaan ruokaa.** «أذهب لأشتري طعامًا». **Opin uimaan.** «تعلّمت السباحة».
      - **-massa** (في): منشغل بفعل في مكان ما: **Hän on syömässä.** «هو في الخارج يأكل».
      - **-masta** (من): عائد من فعل: **Tulen uimasta.** «عائد من السباحة».
      - **-matta** (بدون): **Hän lähti sanomatta mitään.** «غادر دون أن يقول شيئًا».
    mistakes: ["بعد mennä، tulla، oppia: صيغة -maan."]
  fi-infinitive-1:
    meaning: "المصدر الأساسي بعد الأفعال: haluan mennä، osaan uida"
    intro: |
      بعد **haluta، voida، osata، saada، täytyy، pitää، yrittää، aikoa، alkaa، kannattaa، ehtiä، unohtaa** يأتي الفعل الثاني في **المصدر الأساسي** (صيغة القاموس)، حيث تقول العربية «أن + المضارع»: **Haluan mennä kotiin.** «أريد أن أذهب إلى البيت». **Osaan uida. Aion matkustaa.** وبعض أفعال الحركة والتعلّم تأخذ **-maan** بدلًا منه (الدرس السابق): **opin uimaan، menen nukkumaan**.
  fi-possessive:
    meaning: "لواحق الملكية: -ni، -si، -nsa، -mme، -nne"
    intro: |
      الفنلندية المعيارية تعلّم المالك على الاسم أيضًا — كالضمائر المتصلة في العربية: **(minun) kirjani** كتابي، **(sinun) kirjasi** كتابك، **hänen kirjansa** كتابه/كتابها، **(meidän) kirjamme** كتابنا، **(teidän) kirjanne** كتابكم، **heidän kirjansa** كتابهم. في المتكلم والمخاطب يمكن حذف الضمير؛ وفي الغائب يبقى (وبدونه تعني **-nsa** *كتابه هو نفسه*).

      تأتي اللاحقة بعد لاحقة الحالة: **talossani** (في بيتي)، **kirjastasi** (من كتابك). ومع لواحق الحالة المنتهية بصائت يكون الغائب غالبًا **-Vn**: **talossaan، kotiinsa**. والكلام يحذفها غالبًا: **mun kirja**.
  fi-participles:
    meaning: "أسماء الفاعل والمفعول صفاتٍ: الرجل القارئ، الكتاب المقروء"
    intro: |
      تستبدل الفنلندية كثيرًا من الجمل الموصولة بأسماء فاعل ومفعول تُصرَّف كالصفات:

      - **-va / -vä** (فاعل حاضر): **lukeva poika** «الفتى القارئ»، **juokseva vesi** «ماء جارٍ»
      - **-nut / -nyt** (فاعل ماضٍ): **väsynyt mies** «رجل متعب»، **kirjan lukenut opiskelija** «الطالب الذي قرأ الكتاب»
      - **-ttava / -ttävä** (مفعول حاضر): **luettava kirja** «كتاب يُقرأ»، **syötävä** «صالح للأكل»
      - **-ttu / -tty** (مفعول ماضٍ): **luettu kirja** «كتاب مقروء»، **suljettu ovi** «باب مغلق»

      الأخبار والنصوص الرسمية مليئة بها؛ والكلام يفضّل جمل **joka**.
  fi-relative:
    meaning: "الأسماء الموصولة: joka، mikä"
    intro: |
      **joka** (الذي) يعود على اسم ويأخذ الحالة التي يتطلبها دوره في الجملة: **mies, joka asuu täällä** «الرجل الذي يسكن هنا»، **mies, jonka tunnen** «الرجل الذي أعرفه»، **talo, jossa asun** «البيت الذي أسكن فيه»، **ystävä, jolle soitin** «الصديق الذي اتصلت به». الجمع: **jotka، joita، joissa…**. و**mikä** تعود على جملة كاملة أو على **se، kaikki، jotain**: **Hän tuli ajoissa, mikä oli yllätys.** «جاء في الموعد، وهو ما كان مفاجأة».
  fi-essive-translative:
    meaning: "حالة -na (بوصفه) وحالة -ksi (الصيرورة)"
    intro: |
      **حالة -na / -nä**: حالة أو دور مؤقت، *بوصفه*، كالحال في العربية: **Lapsena asuin maalla.** «عشت في الريف طفلًا». **Hän on töissä opettajana.** «يعمل معلمًا». وأيضًا الزمن: **maanantaina، jouluna**.

      **حالة -ksi**: الصيرورة والتحوّل، و*لمدة / لأجل*: **Hän tuli sairaaksi.** «مرض». **Haluan opettajaksi.** «أريد أن أصير معلمًا». **Mitä se on suomeksi?** «ما هذا بالفنلندية؟» **viikoksi** «لمدة أسبوع».
  fi-abessive-instructive:
    meaning: "حالة -tta (بدون)، وحالة الأداة -in، وحالة المصاحبة -ine-"
    intro: |
      ثلاث حالات نادرة، غالبًا في عبارات ثابتة وفي الكتابة:

      - **-tta / -ttä** «بدون»: **rahatta** (بلا مال)؛ والمعتاد **ilman** + الجزئية: **ilman rahaa**
      - **-in** (بصيغة الجمع): الكيفية: **omin silmin** (بأم عينيه)، **jalan** (سيرًا على الأقدام)، **käsin** (باليد)
      - **-ine-** + لاحقة الملكية: «مع»: **Hän tuli perheineen.** «جاء مع عائلته».
  fi-derivation:
    meaning: "لواحق شائعة: -ja (الفاعل)، -inen (صفة)، -ton (بلا)، -sto (مكان)"
    intro: |
      تشتق الفنلندية الكلمات من الجذور بلواحق منتجة — كأوزان الاشتقاق في العربية:

      - **-ja / -jä** الفاعل: **opettaa → opettaja** (معلّم)، **lukea → lukija** (قارئ)
      - **-inen** صفة: **kulta → kultainen** (ذهبي)، **suomi → suomalainen** (فنلندي)
      - **-ton / -tön** «بلا»: **raha → rahaton** (مفلس)، **työ → työtön** (عاطل)
      - **-sto / -stö** مكان أو مجموعة: **kirja → kirjasto** (مكتبة)، **sana → sanasto** (مفردات)
      - **-us / -ys** اسم معنى: **vapaa → vapaus** (حرية)، **ystävä → ystävyys** (صداقة)
      - **-la / -lä** مكان: **ravintola** (مطعم)، **kahvila** (مقهى)، **sairaala** (مستشفى)
