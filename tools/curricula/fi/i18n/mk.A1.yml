# Macedonian text of the Finnish course, A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and vowel harmony: "Гласови и вокална хармонија"
  Pronouns and 'olla': "Заменки и „olla“"
  Present tense by verb type: "Сегашно време по тип на глагол"
  Negation and questions: "Негација и прашања"
  Nouns and their cases: "Именките и нивните падежи"
  Imperative: "Заповеден начин"
lessons:
  fi-harmony:
    meaning: "вокална хармонија: -ssa или -ssä?"
    intro: |
      Финскиот се пишува како што се зборува — како македонскиот: секоја буква секогаш се чита исто, а **двојна буква е долг глас** што го менува значењето: **tuli** (оган) – **tuuli** (ветер) – **tulli** (царина).

      Самогласките се во три групи:

      - **задни**: **a, o, u**
      - **предни**: **ä, ö, y**
      - **неутрални**: **e, i**

      Наставките имаат два облика, а зборот избира: збор со задна самогласка зема **-ssa, -sta, -lla, -ko, -a**; збор само со предни (или неутрални) зема **-ssä, -stä, -llä, -kö, -ä**: **talo → talossa** (во куќата), **metsä → metsässä** (во шумата), **kirje → kirjeessä** (во писмото). Кај сложенките одлучува последниот дел: **kirjakauppa → kirjakaupassa**.
    mistakes: ["metsä има само предни самогласки: секоја наставка зема ä."]
  fi-olla:
    meaning: "лични заменки и olla „сум“"
    intro: |
      **minä** јас, **sinä** ти, **hän** тој/таа (еден збор за двата рода, секогаш за луѓе), **me** ние, **te** вие (и учтиво), **he** тие (луѓе). Предметите се **se** (тоа) и **ne** (тие). Во говорот се слуша **mä, sä, se, me, te, ne**.

      Наставката на глаголот веќе кажува кој: **olen** = сум, па заменката често се изоставa во 1 и 2 лице (**Olen Anna.**), но никогаш во 3 (**Hän on Anna.**).
  fi-type1:
    meaning: "глаголски тип 1: puhua, asua, lukea"
    intro: |
      Финските глаголи се делат на шест типови според наставката на инфинитивот (речничката форма). **Тип 1** завршува на **две самогласки**, последната **-a / -ä**: **puhua** (зборува), **asua** (живее), **lukea** (чита), **ottaa** (зема). Отстрани **-a/-ä** и додај лични наставки:

      | | |
      |---|---|
      | minä puhu**n** | me puhu**mme** |
      | sinä puhu**t** | te puhu**tte** |
      | hän puhu**u** (самогласката се удвојува) | he puhu**vat / -vät** |

      Многу глаголи од тип 1 ја менуваат согласката во основата (**градација на согласките**, следните лекции): **ottaa → otan**, **lukea → luen**, но 3 лице ја задржува силната основа: **ottaa → hän ottaa**.
    mistakes: ["3 лице еднина ја удвојува последната самогласка на основата."]
  fi-type2:
    meaning: "глаголски тип 2: syödä, juoda, saada"
    intro: |
      **Тип 2** завршува на **-da / -dä** по самогласка: **syödä** (јаде), **juoda** (пие), **saada** (добива), **voida** (може), **tehdä** (прави, неправилен: **teen**), **nähdä** (гледа: **näen**). Отстрани **-da/-dä**; 3 лице еднина не додава ништо: **hän syö, hän juo, hän saa**.

      **syön, syöt, syö, syömme, syötte, syövät.** Без градација кај овој тип.
  fi-type3:
    meaning: "глаголски тип 3: tulla, mennä, purra, nousta"
    intro: |
      **Тип 3** завршува на **-lla, -nna, -rra, -sta** (и **-llä, -nnä, -rrä, -stä**): **tulla** (доаѓа), **mennä** (оди), **olla** (е, неправилен), **purra** (гризе), **nousta** (станува), **pestä** (мие). Отстрани **-la/-na/-ra/-ta**, додај **-e-**, па наставките: **tul-e-n, men-e-n, nous-e-n, pes-e-n**. 3 лице еднина го удвојува e: **hän tulee, hän menee**.
  fi-type4:
    meaning: "глаголски тип 4: haluta, tavata, pelätä"
    intro: |
      **Тип 4** завршува на **самогласка + -ta / -tä**: **haluta** (сака), **tavata** (среќава), **osata** (знае да), **pelätä** (се плаши), **siivota** (чисти). Отстрани **-ta/-tä** и додај **-a-/-ä-**: **halu-a-n, halu-a-t, halua-a, halua-mme, halua-tte, halua-vat**. Кога основата веќе завршува на a, 3 лице еднина е само **-aa**: **hän haluaa, hän tapaa**. Градацијата оди обратно (слаба → силна): **tavata → tapaan**.
  fi-type5:
    meaning: "глаголски тип 5: tarvita, valita, häiritä"
    intro: |
      **Тип 5** завршува на **-ita / -itä**: **tarvita** (има потреба), **valita** (избира), **häiritä** (пречи), **merkitä** (значи). Отстрани **-ta/-tä** и додај **-tse-**: **tarvi-tse-n, tarvitset, tarvitsee, tarvitsemme, tarvitsette, tarvitsevat**. Без градација.

      (**Тип 6**, **-eta / -etä**, главно глаголи на станување — **vanheta** стари → **vanhenen** — додава **-ne-**.)
  fi-gradation:
    meaning: "градација на согласките: kk → k, pp → p, tt → t, nt → nn…"
    intro: |
      Во многу зборови согласката на почетокот на последниот слог **ослабнува** кога слогот се затвора (следи согласка: **-n, -t, -mme, -tte**, многу падежни наставки):

      | силна | слаба | пример |
      |---|---|---|
      | kk | k | nukkua → nu**k**un |
      | pp | p | oppia → o**p**in |
      | tt | t | ottaa → o**t**an |
      | k | – | lukea → luen |
      | p | v | tupa → tuvassa |
      | t | d | tietää → tiedän |
      | nt | nn | ranta → ra**nn**alla |
      | nk | ng | kenkä → kengät |
      | mp | mm | ampua → ammun |
      | lt | ll | kieltää → kiellän |
      | rt | rr | kertoa → kerron |

      Глаголските типови 1–2 одат силна → слаба (**nukkua → nukun**, но **hän nukkuu**: 3 лице не го затвора слогот); типовите 3–4 одат слаба → силна (**tavata → tapaan**).
    mistakes: ["-n го затвора слогот: kk ослабнува во k."]
  fi-negation:
    meaning: "одречниот глагол: en, et, ei, emme, ette, eivät"
    intro: |
      Финскиот вели *не* со **посебен глагол** што ја зема личната наставка; главниот глагол останува во гола основа (сегашната основа без наставка):

      | | |
      |---|---|
      | minä **en** puhu | me **emme** puhu |
      | sinä **et** puhu | te **ette** puhu |
      | hän **ei** puhu | he **eivät** puhu |

      **olla → en ole, tulla → en tule, haluta → en halua, tarvita → en tarvitse.** Градација: основата е слаба како во 1 лице: **en nuku**.
    mistakes: ["Одречниот глагол се согласува со подметот."]
  fi-question-ko:
    meaning: "прашања со да/не со -ko / -kö"
    intro: |
      Прашањето со да/не става **-ko / -kö** на зборот за кој се прашува и го поместува напред — сосема како македонското **ли**: **Puhut suomea.** → **Puhutko suomea?** „Зборуваш ли фински?“; **Onko tämä sinun?** „Дали ова е твое?“; **Sinäkö sen teit?** „Ти ли го направи?“. Вокалната хармонија избира **-ko** или **-kö**.

      Одговорот го повторува глаголот: **Puhutko suomea? – Puhun. / En puhu.** (Постојат и **kyllä** „да“ и **ei** „не“.)
  fi-question-words:
    meaning: "прашални зборови"
    intro: |
      **mikä** што, **kuka** кој, **mitä** што (партитив: *што правиш*), **missä** каде, **mistä** од каде, **mihin / minne** каде (кон), **milloin** кога, **miksi** зошто, **miten / kuinka** како, **kuinka paljon** колку, **millainen** каков, **kenen** чиј, **paljonko** колку.

      Внимавај на трите *каде*: месните падежи на **mi-** (**missä, mistä, mihin**) одговараат на одговорот: **Missä asut? – Helsingissä. Mistä tulet? – Brasiliasta. Mihin menet? – Kauppaan.**
  fi-cases-overview:
    meaning: "падежите: преглед"
    intro: |
      Финскиот нема предлози таму каде што македонскиот има *во, од, кон, на*: работата ја вршат **наставки**. Главните:

      - **номинатив** (подмет): **talo**
      - **генитив** (*на*, сопственик): **talon**
      - **партитив** (дел, количина, објект на незавршено дејство): **taloa**
      - **внатрешни месни**: **talossa** (во), **talosta** (од внатре), **taloon** (во — кон внатре)
      - **надворешни месни**: **talolla** (на, кај), **talolta** (од — од површина), **talolle** (на — кон)
      - **есив** (како): **talona**, **транслатив** (станување): **taloksi**

      Секој има своја лекција; табелата покажува два збора целосно.
  fi-partitive:
    meaning: "партитив еднина: малку, дел, по броеви"
    intro: |
      **Партитивот** е најчестиот падеж по номинативот. Наставки: **-a / -ä** (**kahvi → kahvia, talo → taloa**), **-ta / -tä** по долга самогласка или согласка (**maa → maata, nainen → naista, vesi → vettä**), **-tta / -ttä** по -e (**huone → huonetta**).

      Се користи за:

      - **неопределена количина** од маса: **Juon kahvia.** „Пијам (малку) кафе.“
      - **по броеви** (од 2): **kaksi kahvia, kolme taloa**
      - **по многу глаголи** (rakastaa, odottaa, auttaa…): **Rakastan sinua.**
      - **одречни реченици**: **Minulla ei ole autoa.**
      - **незавршени дејства**: **Luen kirjaa.** „Читам книга.“
    mistakes: ["По број: партитив еднина."]
  fi-numbers:
    meaning: "броеви и партитивот по нив"
    intro: |
      **0 nolla, 1 yksi, 2 kaksi, 3 kolme, 4 neljä, 5 viisi, 6 kuusi, 7 seitsemän, 8 kahdeksan, 9 yhdeksän, 10 kymmenen.** Од 11 до 19: **yksitoista** (11), **kaksitoista** (12)… Десетки: **kaksikymmentä** (20), **kolmekymmentä** (30). **sata** 100, **tuhat** 1000.

      По секој број освен **yksi**, именката е во **партитив еднина**: **kaksi kissaa, kolme poikaa, kymmenen euroa**. Глаголот останува во еднина: **Kaksi poikaa leikkii.**
  fi-genitive:
    meaning: "генитивот: -n (сопственик, „на“)"
    intro: |
      **Генитивот** завршува на **-n** и доаѓа **пред** именката на која ѝ припаѓа: **Annan kirja** „книгата на Ана“, **talon ovi** „вратата на куќата“, **Suomen pääkaupunki** „главниот град на Финска“. Градацијата ја ослабува основата: **kauppa → kaupan**, **pöytä → pöydän**. Зборовите на **-e** го удвојуваат: **huone → huoneen**; **-nen** → **-sen**: **nainen → naisen**.

      Генитивот го означува и подметот на **täytyy** (мора) и објектот на завршено дејство (подоцнежни лекции).
  fi-plural:
    meaning: "номинатив множина -t"
    intro: |
      Подметот во множина завршува на **-t**, на истата (често слаба) основа како генитивот еднина: **talo → talot, kauppa → kaupat, huone → huoneet, nainen → naiset, käsi → kädet**. Глаголот се согласува: **Talot ovat isoja.** Другите падежи во множина користат **-i-** (A2).
  fi-inner-local:
    meaning: "внатре: инесив -ssa, елатив -sta, илатив -Vn"
    intro: |
      Три падежа за **внатре**:

      - **инесив -ssa/-ssä** „во“: **Asun Helsingissä.**
      - **елатив -sta/-stä** „од (внатре)“: **Tulen kaupasta.** И „за“: **puhua elokuvasta** „зборува за филмот“
      - **илатив** „во (кон внатре)“: последната самогласка удвоена + **-n** (**talo → taloon, kauppa → kauppaan**), **-hVn** по долга самогласка (**maa → maahan, työ → työhön**), **-seen** по долга самогласка во подолги зборови (**huone → huoneeseen**). Илативот ја задржува **силната** основа.

      Градовите, земјите и затворените простори ги земаат овие: **Suomessa, Brasiliassa, koulussa, autossa**.
    mistakes: ["Движење кон внатре: илатив, не инесив."]
  fi-outer-local:
    meaning: "на, кај: адесив -lla, аблатив -lta, алатив -lle"
    intro: |
      Три падежа за **на површина, кај, близу**:

      - **адесив -lla/-llä** „на, кај“: **Kirja on pöydällä.** И *со (средство)* (**bussilla** „со автобус“) и време (**viikolla** „во текот на неделата“).
      - **аблатив -lta/-ltä** „од (од површина, од некого)“: **Sain kirjeen äidiltä.**
      - **алатив -lle** „на (кон), на некого“: **Annan kukan äidille.**

      Отворените места и некои градови ги земаат и овие: **torilla** (на пазарот), **asemalla** (на станицата), **Tampereella**.
  fi-have:
    meaning: "„има“: minulla on (кај мене е)"
    intro: |
      Финскиот нема глагол *има*. Сопственикот е во **адесив**, а глаголот е секогаш **on**: **Minulla on auto.** „Имам кола.“ **Sinulla on, hänellä on, meillä on, teillä on, heillä on.** Прашање: **Onko sinulla…?** Одречно: **Minulla ei ole autoa** (партитив). Чувствата исто: **Minulla on nälkä** „гладен сум“.
  fi-adjectives:
    meaning: "придавките се согласуваат по падеж и број"
    intro: |
      Придавката пред именката го зема **истиот падеж и број**: **iso talo, isossa talossa, isoon taloon, isot talot, isoja taloja**. По **olla** придавката е во номинатив за една бројлива работа (**Talo on iso**) и во партитив за маси и множини (**Vesi on kylmää. Talot ovat isoja.**).
  fi-demonstratives:
    meaning: "ова, она, тоа: tämä, tuo, se"
    intro: |
      **tämä** ова (кај мене), **tuo** она (таму), **se** тоа (веќе спомнато) — како македонските **ов-, он-, т-**. Множина: **nämä, nuo, ne**. Се менуваат: **tässä** (тука, во ова), **tästä, tähän; tuossa, tuolla; siinä, sitä, sen**. Во говорот **se** и **ne** се користат и за луѓе.
  fi-imperative:
    meaning: "заповедниот начин: tule!, tulkaa!, älä tule!"
    intro: |
      **На едно лице** заповедниот е основата од 1 лице еднина без **-n**: **puhun → puhu!, tulen → tule!, haluan → halua!** **На повеќе (или учтиво)**: инфинитивна основа + **-kaa / -kää**: **puhukaa!, tulkaa!, syökää!**.

      Одречно: **älä** (едно лице) / **älkää** (повеќе) + гола основа — како **немој**: **Älä mene! Älkää puhuko!** (множината додава **-ko/-kö**). **-pa/-pä** ја омекнува: **Tulepa tänne!**
