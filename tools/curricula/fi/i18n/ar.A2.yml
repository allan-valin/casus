# Arabic text of the Finnish course, A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The past: "الماضي"
  Plurals: "الجمع"
  Objects and verb government: "المفعول وما يطلبه الفعل"
  Joining sentences: "ربط الجمل"
  Comparing: "المقارنة"
lessons:
  fi-past:
    meaning: "الماضي (imperfekti)"
    intro: |
      الماضي يضع **-i-** بين الجذر واللاحقة الشخصية: **puhun → puhuin، asun → asuin، tulen → tulin، haluan → halusin** (النوع 4: **-si-**)، **tarvitsen → tarvitsin**. والغائب المفرد **-i** فقط: **hän puhui، hän tuli، hän halusi**.

      الـ **-i-** تغيّر الصائت قبلها:

      - **a، ä، e** تسقط: **tule-i → tuli، menen → menin**
      - في الأفعال ثنائية المقطع تصير **a** بعد **a، e، i** في المقطع الأول **o**: **antaa → annoin، maksaa → maksoin**، لكن **ottaa → otin**
      - الصوائت الطويلة تقصر: **saada → sain، juoda → join، syödä → söin، viedä → vein**
      - **t → s** في أفعال كثيرة: **tietää → tiesin، ymmärtää → ymmärsin، lentää → lensin**

      الماضي هو زمن السرد المعتاد: **Eilen kävin kaupassa.** «أمس ذهبت إلى المتجر».
    mistakes: ["e الجذر تسقط قبل -i-."]
  fi-past-negative:
    meaning: "الماضي المنفي: en + اسم الفاعل الماضي -nut"
    intro: |
      الماضي المنفي هو **en، et، ei…** + **اسم الفاعل الماضي**: **-nut / -nyt** للمفرد، و**-neet** للجمع: **En puhunut. Hän ei tullut. Emme tulleet.**

      تُدغم **n** في الجذر المنتهي بـ **l، r، s**: **tulla → tullut، purra → purrut، nousta → noussut، olla → ollut**. والنوعان 4 و5: **-nnut**: **haluta → halunnut، tarvita → tarvinnut**.

      تناغم الصوائت: **-nut** بعد الأفعال ذات الصوائت الخلفية، و**-nyt** بعد الأمامية: **syödä → syönyt، mennä → mennyt**.
    mistakes: ["الفاعل الجمع يطلب -neet."]
  fi-perfect:
    meaning: "التام: olen + -nut"
    intro: |
      **olla** في المضارع + اسم الفاعل الماضي: **Olen syönyt.** «قد أكلت». **Oletko käynyt Suomessa?** «هل سبق أن زرت فنلندا؟» **He ovat asuneet täällä kauan.** «يسكنون هنا منذ زمن». ويطابق اسم الفاعل في العدد: **-nut/-nyt** (مفرد)، **-neet** (جمع).

      يُستعمل للتجربة حتى الآن، وللنتائج المهمة الآن، ولما يستمر. و**الماضي الأسبق** يستعمل ماضي olla: **Olin syönyt.** «كنت قد أكلت».
  fi-plural-partitive:
    meaning: "الجزئية في الجمع: -ja، -ita، -ia"
    intro: |
      الجزئية في الجمع: **-ja / -jä** بعد الصائت (**talo → taloja، kirja → kirjoja، kissa → kissoja**)، و**-ia / -iä** حين يكون قبل i في جذر الجمع ساكن (**pöytä → pöytiä، päivä → päiviä، nainen → naisia**)، و**-ita / -itä** بعد صائت طويل (**maa → maita، huone → huoneita**).

      تُستعمل كالجزئية المفردة، لـ **عدد غير محدد**: **Ostin omenoita.** «اشتريت (بعض) التفاح». **Talot ovat isoja.** وبعد olla تكون صفات الجمع في الجزئية.
  fi-plural-cases:
    meaning: "جذر الجمع -i- في الحالات الأخرى"
    intro: |
      خارج حالة الرفع، علامة الجمع **-i-** (**-j-** بين صائتين)، قبل لاحقة الحالة: **talo-i-ssa، kirjo-i-sta، kaupo-i-lle**. وتغيّر **-i-** صائت الجذر كما في الماضي: **a → o** أو تسقط (**kirja → kirjoissa، kissa → kissoissa، koira → koirissa**)، و**ä، e تسقطان** (**päivä → päivissä**)، والصوائت الطويلة تقصر (**maa → maissa، työ → töissä**). والإضافة في الجمع: **-jen / -iden / -ten**: **talojen، maiden، naisten**.
  fi-object:
    meaning: "المفعول: جزئية أم إضافة؟"
    intro: |
      للمفعول المباشر **حالتان**، والاختيار يغيّر المعنى:

      - **الإضافة** (-n) لكلٍّ تام أو نتيجة منجزة: **Luin kirjan.** «قرأتُ الكتاب (حتى نهايته)». **Ostan auton.** «سأشتري السيارة».
      - **الجزئية** لغير المنجز، أو الجزء، أو الكمية، أو بعد النفي: **Luin kirjaa.** «كنت أقرأ الكتاب». **Ostan maitoa.** «سأشتري بعض الحليب». **En osta autoa.** «لن أشتري السيارة».

      بعض الأفعال تأخذ الجزئية دائمًا (المشاعر والحالات المستمرة): **rakastaa، ajatella، odottaa، auttaa، kiittää**: **Odotan bussia.**
    mistakes: ["بعد النفي يكون المفعول في الجزئية."]
  fi-government:
    meaning: "أفعال تطلب حالة ثابتة: pitää jostakin، tutustua johonkin"
    intro: |
      كثير من الأفعال يطلب حالة معينة تُحفظ معه، كما تتعدى الأفعال العربية بحروف معينة:

      - **حالة الخروج (-sta)**: **pitää** (يحب)، **tykätä** (يحب)، **kiinnostua** (يهتم بـ)، **nauttia** (يستمتع بـ)، **huolehtia** (يعتني بـ)، **puhua / kertoa** (يتحدث / يحكي عن)، **unelmoida** (يحلم بـ): **Pidän sinusta.** «أحبك».
      - **حالة الدخول (-Vn)**: **tutustua** (يتعرّف إلى)، **osallistua** (يشارك في)، **rakastua** (يقع في حب)، **uskoa** (يؤمن بـ)، **luottaa** (يثق بـ)، **vastata** (يجيب عن)، **tottua** (يعتاد على): **Rakastuin häneen.**
      - **حالة -lle**: **soittaa** (يتصل بـ)، **antaa** (يعطي)، **kertoa** (يحكي لـ)، **nauraa** (يضحك على): **Soitan sinulle.**
      - **حالة -lla**: **on** (عنده، انظر *minulla on*)
    mistakes: ["pitää «يحب» تطلب حالة الخروج."]
  fi-necessity:
    meaning: "يجب: minun täytyy، minun pitää (الفاعل في الإضافة)"
    intro: |
      **täytyy، pitää، tarvitsee** (في النفي)، **kannattaa** (يستحق)، **on pakko** (لا مفرّ) و**on** + صفة (**on helppo** من السهل) تأخذ الشخص في **حالة الإضافة** وتبقى بصيغة الغائب المفرد: **Minun täytyy mennä.** «يجب أن أذهب». **Sinun pitää levätä.** «ينبغي أن ترتاح». **Hänen ei tarvitse tulla.** «لا داعي لأن يأتي».
    mistakes: ["täytyy تطلب فاعلًا في حالة الإضافة."]
  fi-conjunctions:
    meaning: "أنّ، لأن، حين، إذا: أدوات الربط التابعة"
    intro: |
      **että** أنّ، **koska** لأن، **kun** حين (و*من* في المقارنة **kuin**)، **jos** إذا، **vaikka** مع أن، **kunnes** حتى، **jotta** لكي، **ennen kuin** قبل أن، **sen jälkeen kun** بعد أن. وتسبقها فاصلة دائمًا. وترتيب الكلمات في الجملة التابعة كالرئيسية: **Tiedän, että hän tulee.**

      **ja** و، **mutta** لكن، **tai** أو، **vai** أم (في السؤال: **teetä vai kahvia?**)، **vaan** بل (بعد النفي): **Hän ei ole suomalainen vaan ruotsalainen.**
  fi-time:
    meaning: "تعبيرات الزمن: الأيام والشهور والساعة"
    intro: |
      **الأيام** تأخذ حالة **-na**: **maanantaina** (يوم الاثنين)، **tiistaina، keskiviikkona، torstaina، perjantaina، lauantaina، sunnuntaina**؛ وأيضًا **viikonloppuna** (في عطلة الأسبوع)، **jouluna**. **الشهور** (كلها بـ **-kuu**) تأخذ الظرفية الداخلية: **tammikuussa** (في يناير)، **kesäkuussa**. **الفصول**: **keväällä، kesällä، syksyllä، talvella** (حالة -lla). **الساعة**: **kello kolme** (في الثالثة)، **puoli neljä** (الثالثة والنصف — *نصف إلى الرابعة*).
  fi-comparison:
    meaning: "التفضيل -mpi والتفضيل المطلق -in"
    intro: |
      **التفضيل**: الجذر + **-mpi** (**iso → isompi، kallis → kalliimpi، helppo → helpompi**)؛ والجذور ثنائية المقطع المنتهية بـ **-a/-ä** تحوّلها إلى **e** (**vanha → vanhempi**). **التفضيل المطلق**: **-in** (**isoin، vanhin، kallein**). والشاذ: **hyvä → parempi → paras**، **pitkä → pidempi**.

      و*من* هي **kuin** (**Hän on pidempi kuin minä**) أو جزئية المقارَن به (**Hän on minua pidempi**). وكلاهما يُصرَّف: **isommassa talossa، parhaat ystävät**.
