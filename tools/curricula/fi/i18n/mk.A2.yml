# Macedonian text of the Finnish course, A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The past: "Минатото време"
  Plurals: "Множини"
  Objects and verb government: "Објекти и рекција"
  Joining sentences: "Поврзување реченици"
  Comparing: "Споредување"
lessons:
  fi-past:
    meaning: "минатото време (imperfekti)"
    intro: |
      Минатото става **-i-** меѓу основата и личната наставка: **puhun → puhuin, asun → asuin, tulen → tulin, haluan → halusin** (тип 4: **-si-**), **tarvitsen → tarvitsin**. 3 лице еднина: само **-i**: **hän puhui, hän tuli, hän halusi**.

      **-i-** ја менува самогласката пред себе:

      - **a, ä, e** паѓаат: **tule-i → tuli, menen → menin**
      - кај двосложните глаголи **a** по **a, e, i** во првиот слог станува **o**: **antaa → annoin, maksaa → maksoin**, но **ottaa → otin**
      - долгите самогласки се скратуваат: **saada → sain, juoda → join, syödä → söin, viedä → vein**
      - **t → s** кај многу глаголи: **tietää → tiesin, ymmärtää → ymmärsin, lentää → lensin**

      Минатото е обичното раскажувачко време: **Eilen kävin kaupassa.** „Вчера бев во продавница.“
    mistakes: ["e од основата паѓа пред -i-."]
  fi-past-negative:
    meaning: "одречно минато: en + партицип на -nut"
    intro: |
      Одречното минато е **en, et, ei…** + **активниот минат партицип**: **-nut / -nyt** во еднина, **-neet** во множина: **En puhunut. Hän ei tullut. Emme tulleet.**

      **n** се изедначува со основа на **l, r, s**: **tulla → tullut, purra → purrut, nousta → noussut, olla → ollut**. Тип 4 и 5: **-nnut**: **haluta → halunnut, tarvita → tarvinnut**.

      Вокална хармонија: **-nut** по глаголи со задни самогласки, **-nyt** по предни: **syödä → syönyt, mennä → mennyt**.
    mistakes: ["Подмет во множина бара -neet."]
  fi-perfect:
    meaning: "перфектот: olen + -nut"
    intro: |
      **olla** во сегашно + минатиот партицип — многу слично на македонското **сум бил**: **Olen syönyt.** „Сум јадел / јадев.“ **Oletko käynyt Suomessa?** „Си бил ли во Финска?“ **He ovat asuneet täällä kauan.** „Тие долго живеат тука.“ Партиципот се согласува по број: **-nut/-nyt** (еднина), **-neet** (множина).

      Се користи за искуство досега, резултати што се важни сега и нешта што траат. **Плусквамперфектот** го користи минатото на olla: **Olin syönyt.** „Бев јадел.“
  fi-plural-partitive:
    meaning: "партитив множина: -ja, -ita, -ia"
    intro: |
      Партитив множина: **-ja / -jä** по самогласка (**talo → taloja, kirja → kirjoja, kissa → kissoja**), **-ia / -iä** кога основата на множината има согласка пред i (**pöytä → pöytiä, päivä → päiviä, nainen → naisia**), **-ita / -itä** по долга самогласка (**maa → maita, huone → huoneita**).

      Се користи како партитивот еднина, за **неограничен број**: **Ostin omenoita.** „Купив (неколку) јаболка.“ **Talot ovat isoja.** По olla придавките во множина се во партитив.
  fi-plural-cases:
    meaning: "основата на множината -i- во другите падежи"
    intro: |
      Надвор од номинативот, ознаката за множина е **-i-** (**-j-** меѓу самогласки), пред падежната наставка: **talo-i-ssa, kirjo-i-sta, kaupo-i-lle**. **-i-** ја менува самогласката на основата како во минатото: **a → o** или паѓа (**kirja → kirjoissa, kissa → kissoissa, koira → koirissa**), **ä, e паѓаат** (**päivä → päivissä**), долгите самогласки се скратуваат (**maa → maissa, työ → töissä**). Генитив множина: **-jen / -iden / -ten**: **talojen, maiden, naisten**.
  fi-object:
    meaning: "објектот: партитив или генитив?"
    intro: |
      Директниот објект има **два** падежа, а изборот го менува значењето — нешто како македонскиот свршен и несвршен вид:

      - **генитив** (-n) за целина, завршен резултат: **Luin kirjan.** „Ја прочитав книгата (до крај).“ **Ostan auton.** „Ќе ја купам колата.“
      - **партитив** за незавршено, дел, количина или по негација: **Luin kirjaa.** „Ја читав книгата.“ **Ostan maitoa.** „Ќе купам млеко.“ **En osta autoa.** „Нема да ја купам колата.“

      Некои глаголи секогаш земаат партитив (чувства и трајни состојби): **rakastaa, ajatella, odottaa, auttaa, kiittää**: **Odotan bussia.**
    mistakes: ["По негација објектот е во партитив."]
  fi-government:
    meaning: "глаголи со определен падеж: pitää jostakin, tutustua johonkin"
    intro: |
      Многу глаголи бараат определен падеж, што се учи со глаголот:

      - **елатив (-sta)**: **pitää** (сака, му се допаѓа), **tykätä** (сака), **kiinnostua** (се заинтересира), **nauttia** (ужива), **huolehtia** (се грижи), **puhua / kertoa** (зборува / раскажува за), **unelmoida** (сонува за): **Pidän sinusta.** „Те сакам / ми се допаѓаш.“
      - **илатив (-Vn)**: **tutustua** (се запознава), **osallistua** (учествува), **rakastua** (се вљубува), **uskoa** (верува во), **luottaa** (има доверба), **vastata** (одговара), **tottua** (се навикнува): **Rakastuin häneen.**
      - **алатив (-lle)**: **soittaa** (се јавува), **antaa** (дава), **kertoa** (кажува некому), **nauraa** (се смее на): **Soitan sinulle.**
      - **адесив (-lla)**: **on** (има, види *minulla on*)
    mistakes: ["pitää „сака“ бара елатив."]
  fi-necessity:
    meaning: "мора: minun täytyy, minun pitää (подмет во генитив)"
    intro: |
      **täytyy, pitää, tarvitsee** (одречно), **kannattaa** (се исплати), **on pakko** (мора) и **on** + придавка (**on helppo** лесно е) го земаат лицето во **генитив** и остануваат во 3 лице еднина — слично на македонското **ми треба**: **Minun täytyy mennä.** „Морам да одам.“ **Sinun pitää levätä.** „Треба да се одмориш.“ **Hänen ei tarvitse tulla.** „Не треба да доаѓа.“
    mistakes: ["täytyy бара подмет во генитив."]
  fi-conjunctions:
    meaning: "дека, бидејќи, кога, ако: зависни сврзници"
    intro: |
      **että** дека, **koska** бидејќи, **kun** кога (*од* во споредба е **kuin**), **jos** ако, **vaikka** иако, **kunnes** додека не, **jotta** за да, **ennen kuin** пред да, **sen jälkeen kun** откако. Пред нив секогаш има запирка. Редот на зборовите во зависната реченица е ист како во главната: **Tiedän, että hän tulee.**

      **ja** и, **mutta** но, **tai** или, **vai** или (во прашања: **teetä vai kahvia?**), **vaan** туку (по негација): **Hän ei ole suomalainen vaan ruotsalainen.**
  fi-time:
    meaning: "изрази за време: денови, месеци, часовник"
    intro: |
      **Деновите** го земаат есивот **-na**: **maanantaina** (во понеделник), **tiistaina, keskiviikkona, torstaina, perjantaina, lauantaina, sunnuntaina**; и **viikonloppuna** (за викенд), **jouluna**. **Месеците** (сите на **-kuu**) земаат инесив: **tammikuussa** (во јануари), **kesäkuussa**. **Годишни времиња**: **keväällä, kesällä, syksyllä, talvella** (адесив). **Часовник**: **kello kolme** (во три), **puoli neljä** (три и пол — *половина до четири*).
  fi-comparison:
    meaning: "компаратив -mpi и суперлатив -in"
    intro: |
      **Компаратив**: основа + **-mpi** (**iso → isompi, kallis → kalliimpi, helppo → helpompi**); двосложните основи на **-a/-ä** го менуваат во **e** (**vanha → vanhempi**). **Суперлатив**: **-in** (**isoin, vanhin, kallein**). Неправилни: **hyvä → parempi → paras**, **pitkä → pidempi**.

      *Од* (во споредба) е **kuin** (**Hän on pidempi kuin minä**) или партитив на споредуваното (**Hän on minua pidempi**). Двата се менуваат: **isommassa talossa, parhaat ystävät**.
