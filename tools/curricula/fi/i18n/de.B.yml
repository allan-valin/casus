# German text of the Finnish course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Moods: "Modi"
  The passive: "Das Passiv"
  Infinitives: "Infinitive"
  Possessive suffixes: "Possessivsuffixe"
  Participles: "Partizipien"
  Rarer cases and forms: "Seltenere Kasus und Formen"
  Word formation: "Wortbildung"
lessons:
  fi-conditional:
    meaning: "der Konditional -isi-: würde"
    intro: |
      Der Konditional setzt **-isi-** vor die Personalendung: **puhuisin, tulisin, haluaisin, olisin**. 3. Person: **puhuisi, tulisi** (kein zusätzlicher Vokal). Das **e** und **i** des Stammes fallen weg: **tule-isi → tulisi**; Langvokale werden wie in der Vergangenheit kurz: **saada → saisin, syödä → söisin**.

      Gebrauch für Wünsche und höfliche Bitten (**Haluaisin kahvia.** „Ich hätte gern einen Kaffee.“), für irreale Bedingungen mit **jos**: **Jos minulla olisi rahaa, ostaisin talon.** „Hätte ich Geld, würde ich ein Haus kaufen.“ Konditional der Vergangenheit: **olisin + -nut**: **Olisin tullut.** „Ich wäre gekommen.“
  fi-potential:
    meaning: "der Potential -ne-: wahrscheinlich (formell)"
    intro: |
      Der **Potential** (-ne-) sagt *wahrscheinlich, vielleicht*: **Hän tullee huomenna.** „Er kommt wohl morgen.“ Das **n** gleicht sich wie beim Partizip Perfekt an: **tulla → tullee, nousta → noussee**; **olla** hat einen eigenen Stamm: **lienee** „ist wohl“. Er gehört zu Nachrichten und Amtssprache; gesprochen sagen Finnen **varmaan, kai, ehkä** + Indikativ.
  fi-imperative-3:
    meaning: "weitere Imperative: er soll kommen, lass uns gehen"
    intro: |
      **3. Person**: **-koon / -köön**: **Tulkoon!** „Er soll kommen!“, **Olkoon.** „So sei es.“ **1. Person Plural** (formell): **-kaamme / -käämme**: **Menkäämme!** „Lasst uns gehen!“ Im Alltag ist *lass uns* das Passiv: **Mennään!** „Gehen wir!“, **Syödään!** „Lass uns essen!“.
  fi-passive:
    meaning: "das Passiv Präsens: „man tut“, „wird getan“"
    intro: |
      Das finnische Passiv hat **gar keinen Urheber** — *man, die Leute* tun es: **Suomessa puhutaan suomea ja ruotsia.** „In Finnland spricht man Finnisch und Schwedisch.“ Das Objekt bleibt im Objektkasus (Nominativ oder Partitiv), und es gibt eine Form für alle.

      Bildung: Nimm den Infinitiv (schwacher Stamm bei Typ 1–2) und füge **-taan / -tään** an (Typ 1: **puhua → puhutaan, ottaa → otetaan** — a → e), **-aan / -ään** nach dem -da/-la/-na/-ta der Typen 2–6: **syödä → syödään, tulla → tullaan, mennä → mennään, haluta → halutaan, tarvita → tarvitaan**.

      Gesprochen ist **me** + Passiv *wir*: **Me mennään** „Wir gehen“.
  fi-passive-past:
    meaning: "das Passiv der Vergangenheit: -ttiin, -tiin"
    intro: |
      Passiv der Vergangenheit: **-ttiin** bei Typ 1 (**puhuttiin, otettiin**), **-tiin** bei den anderen (**syötiin, tultiin, mentiin, haluttiin, tarvittiin**). Verneint: **ei** + passives Partizip Perfekt **-ttu / -tty**: **Ei puhuttu.** „Es wurde nicht darüber gesprochen.“ Perfekt: **on puhuttu** „es ist gesprochen worden“.
  fi-ma-infinitive:
    meaning: "der -ma-Infinitiv: um zu tun, beim Tun, vom Tun kommend"
    intro: |
      Der **3. Infinitiv** ist der Stamm der 3. Person Plural + **-ma-** mit einer Ortskasusendung und funktioniert wie ein Ort:

      - **-maan** (hinein): nach Bewegungsverben und einigen anderen: **Menen ostamaan ruokaa.** „Ich gehe Essen kaufen.“ **Opin uimaan.** „Ich habe schwimmen gelernt.“
      - **-massa** (in): beim Tun irgendwo: **Hän on syömässä.** „Er ist (gerade) essen.“
      - **-masta** (aus): vom Tun kommend: **Tulen uimasta.** „Ich komme vom Schwimmen.“
      - **-matta** (ohne): **Hän lähti sanomatta mitään.** „Er ging, ohne etwas zu sagen.“
    mistakes: ["Nach mennä, tulla, oppia: die -maan-Form."]
  fi-infinitive-1:
    meaning: "der Grundinfinitiv nach Verben: haluan mennä, osaan uida"
    intro: |
      Nach **haluta, voida, osata, saada, täytyy, pitää, yrittää, aikoa, alkaa, kannattaa, ehtiä, unohtaa** steht das zweite Verb im **Grundinfinitiv** (der Wörterbuchform): **Haluan mennä kotiin. Osaan uida. Aion matkustaa.** Manche Verben der Bewegung oder des Lernens nehmen stattdessen **-maan** (vorige Lektion): **opin uimaan, menen nukkumaan**.
  fi-possessive:
    meaning: "Possessivsuffixe: -ni, -si, -nsa, -mme, -nne"
    intro: |
      Standardfinnisch markiert den Besitzer auch am Nomen: **(minun) kirjani** mein Buch, **(sinun) kirjasi** dein Buch, **hänen kirjansa** sein/ihr Buch, **(meidän) kirjamme** unser Buch, **(teidän) kirjanne** euer Buch, **heidän kirjansa** ihr Buch. In der 1. und 2. Person kann das Pronomen wegfallen; in der 3. bleibt es (ohne es heißt **-nsa** *sein eigenes*).

      Das Suffix steht nach der Kasusendung: **talossani** (in meinem Haus), **kirjastasi** (aus deinem Buch). Bei vokalisch endenden Kasusendungen ist die 3. Person oft **-Vn**: **talossaan, kotiinsa**. Gesprochen fallen die Suffixe meist weg: **mun kirja**.
  fi-participles:
    meaning: "Partizipien als Adjektive: der lesende Mann, das gelesene Buch"
    intro: |
      Das Finnische ersetzt viele Relativsätze durch Partizipien, die wie Adjektive dekliniert werden:

      - **-va / -vä** (Präsens aktiv): **lukeva poika** „der lesende Junge“, **juokseva vesi** „fließendes Wasser“
      - **-nut / -nyt** (Perfekt aktiv): **väsynyt mies** „ein müder Mann“, **kirjan lukenut opiskelija** „der Student, der das Buch gelesen hat“
      - **-ttava / -ttävä** (Präsens passiv): **luettava kirja** „ein zu lesendes Buch“, **syötävä** „essbar“
      - **-ttu / -tty** (Perfekt passiv): **luettu kirja** „ein gelesenes Buch“, **suljettu ovi** „eine geschlossene Tür“

      Nachrichten und formelle Texte sind voll davon; gesprochen bevorzugt man **joka**-Sätze.
  fi-relative:
    meaning: "Relativpronomen: joka, mikä"
    intro: |
      **joka** (der, welcher) bezieht sich auf ein Nomen und nimmt den Kasus, den seine Rolle im Satz verlangt: **mies, joka asuu täällä** „der Mann, der hier wohnt“, **mies, jonka tunnen** „der Mann, den ich kenne“, **talo, jossa asun** „das Haus, in dem ich wohne“, **ystävä, jolle soitin** „der Freund, den ich anrief“. Plural: **jotka, joita, joissa…**. **mikä** bezieht sich auf einen ganzen Satz oder auf **se, kaikki, jotain**: **Hän tuli ajoissa, mikä oli yllätys.**
  fi-essive-translative:
    meaning: "Essiv -na (als) und Translativ -ksi (werden)"
    intro: |
      **Essiv -na / -nä**: ein vorübergehender Zustand oder eine Rolle, *als*: **Lapsena asuin maalla.** „Als Kind wohnte ich auf dem Land.“ **Hän on töissä opettajana.** „Er arbeitet als Lehrer.“ Auch Zeit: **maanantaina, jouluna**.

      **Translativ -ksi**: werden, sich verwandeln in, *für* (Zeit oder Zweck): **Hän tuli sairaaksi.** „Er wurde krank.“ **Haluan opettajaksi.** „Ich will Lehrer werden.“ **Mitä se on suomeksi?** „Was heißt das auf Finnisch?“ **viikoksi** „für eine Woche“.
  fi-abessive-instructive:
    meaning: "Abessiv -tta (ohne), Instruktiv -in, Komitativ -ine-"
    intro: |
      Drei seltene Kasus, meist in festen Wendungen und in der Schrift:

      - **Abessiv -tta / -ttä** „ohne“: **rahatta** (ohne Geld); meist **ilman** + Partitiv: **ilman rahaa**
      - **Instruktiv -in** (Pluralform): Art und Weise: **omin silmin** (mit eigenen Augen), **jalan** (zu Fuß), **käsin** (von Hand)
      - **Komitativ -ine-** + Possessiv: „zusammen mit“: **Hän tuli perheineen.** „Er kam mit seiner Familie.“
  fi-derivation:
    meaning: "häufige Suffixe: -ja (Täter), -inen (Adjektiv), -ton (ohne), -sto (Ort)"
    intro: |
      Das Finnische bildet Wörter aus Wurzeln mit produktiven Suffixen:

      - **-ja / -jä** Handelnder: **opettaa → opettaja** (Lehrer), **lukea → lukija** (Leser)
      - **-inen** Adjektiv: **kulta → kultainen** (golden), **suomi → suomalainen** (finnisch)
      - **-ton / -tön** „-los“: **raha → rahaton** (mittellos), **työ → työtön** (arbeitslos)
      - **-sto / -stö** Ort oder Sammlung: **kirja → kirjasto** (Bibliothek), **sana → sanasto** (Wortschatz)
      - **-us / -ys** Abstraktum: **vapaa → vapaus** (Freiheit), **ystävä → ystävyys** (Freundschaft)
      - **-la / -lä** Ort: **ravintola** (Restaurant), **kahvila** (Café), **sairaala** (Krankenhaus)
