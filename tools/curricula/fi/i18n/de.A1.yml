# German text of the Finnish course, A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and vowel harmony: "Laute und Vokalharmonie"
  Pronouns and 'olla': "Pronomen und „olla“"
  Present tense by verb type: "Präsens nach Verbtyp"
  Negation and questions: "Verneinung und Fragen"
  Nouns and their cases: "Nomen und ihre Kasus"
  Imperative: "Imperativ"
lessons:
  fi-harmony:
    meaning: "Vokalharmonie: -ssa oder -ssä?"
    intro: |
      Finnisch wird geschrieben, wie es gesprochen wird: Jeder Buchstabe klingt immer gleich, und ein **Doppelbuchstabe ist ein langer Laut**, der die Bedeutung ändert: **tuli** (Feuer) – **tuuli** (Wind) – **tulli** (Zoll).

      Die Vokale bilden drei Gruppen:

      - **hintere**: **a, o, u**
      - **vordere**: **ä, ö, y**
      - **neutrale**: **e, i**

      Endungen gibt es in zwei Formen, und das Wort wählt: Ein Wort mit hinterem Vokal nimmt **-ssa, -sta, -lla, -ko, -a**; ein Wort mit nur vorderen (oder neutralen) Vokalen nimmt **-ssä, -stä, -llä, -kö, -ä**: **talo → talossa** (im Haus), **metsä → metsässä** (im Wald), **kirje → kirjeessä** (im Brief). Bei Komposita entscheidet der letzte Teil: **kirjakauppa → kirjakaupassa**.
    mistakes: ["metsä hat nur vordere Vokale: jede Endung nimmt ä."]
  fi-olla:
    meaning: "Personalpronomen und olla „sein“"
    intro: |
      **minä** ich, **sinä** du, **hän** er/sie (ein Wort für beide, immer für Personen), **me** wir, **te** ihr / Sie, **he** sie (Personen). Dinge sind **se** (es) und **ne** (sie). Gesprochen hört man **mä, sä, se, me, te, ne**.

      Die Verbendung sagt schon, wer: **olen** = ich bin, daher fällt das Pronomen in der 1. und 2. Person oft weg (**Olen Anna.**), in der 3. nie (**Hän on Anna.**).
  fi-type1:
    meaning: "Verbtyp 1: puhua, asua, lukea"
    intro: |
      Finnische Verben teilen sich nach der Endung des Infinitivs (der Wörterbuchform) in sechs Typen. **Typ 1** endet auf **zwei Vokale**, der letzte **-a / -ä**: **puhua** (sprechen), **asua** (wohnen), **lukea** (lesen), **ottaa** (nehmen). **-a/-ä** weg und Personalendungen anhängen:

      | | |
      |---|---|
      | minä puhu**n** | me puhu**mme** |
      | sinä puhu**t** | te puhu**tte** |
      | hän puhu**u** (Vokal verdoppelt) | he puhu**vat / -vät** |

      Viele Verben des Typs 1 ändern ihren Stammkonsonanten (**Stufenwechsel**, nächste Lektionen): **ottaa → otan**, **lukea → luen**, aber die 3. Person behält den starken Stamm: **ottaa → hän ottaa**.
    mistakes: ["Die 3. Person Singular verdoppelt den letzten Stammvokal."]
  fi-type2:
    meaning: "Verbtyp 2: syödä, juoda, saada"
    intro: |
      **Typ 2** endet auf **-da / -dä** nach einem Vokal: **syödä** (essen), **juoda** (trinken), **saada** (bekommen), **voida** (können), **tehdä** (tun, unregelmäßig: **teen**), **nähdä** (sehen: **näen**). **-da/-dä** weg; die 3. Person Singular fügt nichts an: **hän syö, hän juo, hän saa**.

      **syön, syöt, syö, syömme, syötte, syövät.** Kein Stufenwechsel in diesem Typ.
  fi-type3:
    meaning: "Verbtyp 3: tulla, mennä, purra, nousta"
    intro: |
      **Typ 3** endet auf **-lla, -nna, -rra, -sta** (und **-llä, -nnä, -rrä, -stä**): **tulla** (kommen), **mennä** (gehen), **olla** (sein, unregelmäßig), **purra** (beißen), **nousta** (aufstehen), **pestä** (waschen). **-la/-na/-ra/-ta** weg, **-e-** dazu, dann die Endungen: **tul-e-n, men-e-n, nous-e-n, pes-e-n**. Die 3. Person Singular verdoppelt das e: **hän tulee, hän menee**.
  fi-type4:
    meaning: "Verbtyp 4: haluta, tavata, pelätä"
    intro: |
      **Typ 4** endet auf **Vokal + -ta / -tä**: **haluta** (wollen), **tavata** (treffen), **osata** (können), **pelätä** (fürchten), **siivota** (putzen). **-ta/-tä** weg und **-a-/-ä-** dazu: **halu-a-n, halu-a-t, halua-a, halua-mme, halua-tte, halua-vat**. Endet der Stamm schon auf a, ist die 3. Person Singular einfach **-aa**: **hän haluaa, hän tapaa**. Der Stufenwechsel geht umgekehrt (schwach → stark): **tavata → tapaan**.
  fi-type5:
    meaning: "Verbtyp 5: tarvita, valita, häiritä"
    intro: |
      **Typ 5** endet auf **-ita / -itä**: **tarvita** (brauchen), **valita** (wählen), **häiritä** (stören), **merkitä** (bedeuten). **-ta/-tä** weg und **-tse-** dazu: **tarvi-tse-n, tarvitset, tarvitsee, tarvitsemme, tarvitsette, tarvitsevat**. Kein Stufenwechsel.

      (**Typ 6**, **-eta / -etä**, meist Verben des Werdens — **vanheta** alt werden → **vanhenen** — fügt **-ne-** an.)
  fi-gradation:
    meaning: "Stufenwechsel: kk → k, pp → p, tt → t, nt → nn …"
    intro: |
      In vielen Wörtern wird der Konsonant am Beginn der letzten Silbe **schwächer**, wenn die Silbe sich schließt (ein Konsonant folgt: **-n, -t, -mme, -tte**, viele Kasusendungen):

      | stark | schwach | Beispiel |
      |---|---|---|
      | kk | k | nukkua → nu**k**un |
      | pp | p | oppia → o**p**in |
      | tt | t | ottaa → o**t**an |
      | k | – | lukea → luen |
      | p | v | tupa → tuvassa |
      | t | d | tietää → tiedän |
      | nt | nn | ranta → ra**nn**alla |
      | nk | ng | kenkä → kengät |
      | mp | mm | ampua → ammun |
      | lt | ll | kieltää → kiellän |
      | rt | rr | kertoa → kerron |

      Verbtypen 1–2 gehen stark → schwach (**nukkua → nukun**, aber **hän nukkuu**: Die 3. Person schließt die Silbe nicht); Typen 3–4 gehen schwach → stark (**tavata → tapaan**).
    mistakes: ["-n schließt die Silbe: kk wird zu k."]
  fi-negation:
    meaning: "das Verneinungsverb: en, et, ei, emme, ette, eivät"
    intro: |
      Finnisch sagt *nein* mit einem **eigenen Verb**, das die Personalendung trägt; das Hauptverb steht im bloßen Stamm (Präsensstamm ohne Endung):

      | | |
      |---|---|
      | minä **en** puhu | me **emme** puhu |
      | sinä **et** puhu | te **ette** puhu |
      | hän **ei** puhu | he **eivät** puhu |

      **olla → en ole, tulla → en tule, haluta → en halua, tarvita → en tarvitse.** Stufenwechsel: Der Stamm ist schwach wie in der 1. Person: **en nuku**.
    mistakes: ["Das Verneinungsverb richtet sich nach dem Subjekt."]
  fi-question-ko:
    meaning: "Ja/Nein-Fragen mit -ko / -kö"
    intro: |
      Eine Ja/Nein-Frage hängt **-ko / -kö** an das erfragte Wort und stellt es an den Anfang: **Puhut suomea.** → **Puhutko suomea?** „Sprichst du Finnisch?“; **Onko tämä sinun?** „Ist das deins?“; **Sinäkö sen teit?** „Warst *du* es, der das gemacht hat?“. Die Vokalharmonie wählt **-ko** oder **-kö**.

      Die Antwort wiederholt das Verb: **Puhutko suomea? – Puhun. / En puhu.** (Es gibt auch **kyllä** „ja“ und **ei** „nein“.)
  fi-question-words:
    meaning: "Fragewörter"
    intro: |
      **mikä** was, **kuka** wer, **mitä** was (Partitiv: *was machst du*), **missä** wo, **mistä** woher, **mihin / minne** wohin, **milloin** wann, **miksi** warum, **miten / kuinka** wie, **kuinka paljon** wie viel, **millainen** was für ein, **kenen** wessen, **paljonko** wie viel.

      Beachte die drei *wo*: Die Ortskasus von **mi-** (**missä, mistä, mihin**) passen zur Antwort: **Missä asut? – Helsingissä. Mistä tulet? – Brasiliasta. Mihin menet? – Kauppaan.**
  fi-cases-overview:
    meaning: "die Kasus: ein Überblick"
    intro: |
      Finnisch hat keine Präpositionen, wo das Deutsche *in, aus, zu, auf* hat: **Endungen** übernehmen das. Die wichtigsten:

      - **Nominativ** (Subjekt): **talo**
      - **Genitiv** (*von*, Besitzer): **talon**
      - **Partitiv** (Teil, Menge, Objekt einer unabgeschlossenen Handlung): **taloa**
      - **innere Ortskasus**: **talossa** (in), **talosta** (aus), **taloon** (hinein)
      - **äußere Ortskasus**: **talolla** (auf, bei), **talolta** (von … weg), **talolle** (auf … hin, zu)
      - **Essiv** (als): **talona**, **Translativ** (werden zu): **taloksi**

      Jeder bekommt seine eigene Lektion; die Tabelle zeigt zwei Wörter vollständig.
  fi-partitive:
    meaning: "der Partitiv Singular: etwas, Teil, nach Zahlen"
    intro: |
      Der **Partitiv** ist nach dem Nominativ der häufigste Kasus. Endungen: **-a / -ä** (**kahvi → kahvia, talo → taloa**), **-ta / -tä** nach langem Vokal oder Konsonant (**maa → maata, nainen → naista, vesi → vettä**), **-tta / -ttä** nach -e (**huone → huonetta**).

      Man verwendet ihn für:

      - **eine unbestimmte Menge** eines Stoffes: **Juon kahvia.** „Ich trinke (etwas) Kaffee.“
      - **nach Zahlen** (ab 2): **kaksi kahvia, kolme taloa**
      - **nach vielen Verben** (rakastaa, odottaa, auttaa …): **Rakastan sinua.**
      - **verneinte Sätze**: **Minulla ei ole autoa.**
      - **unabgeschlossene Handlungen**: **Luen kirjaa.** „Ich lese (gerade) ein Buch.“
    mistakes: ["Nach einer Zahl: Partitiv Singular."]
  fi-numbers:
    meaning: "Zahlen und der Partitiv danach"
    intro: |
      **0 nolla, 1 yksi, 2 kaksi, 3 kolme, 4 neljä, 5 viisi, 6 kuusi, 7 seitsemän, 8 kahdeksan, 9 yhdeksän, 10 kymmenen.** Elf bis neunzehn: **yksitoista** (11), **kaksitoista** (12) … Zehner: **kaksikymmentä** (20), **kolmekymmentä** (30). **sata** 100, **tuhat** 1000.

      Nach jeder Zahl außer **yksi** steht das Nomen im **Partitiv Singular**: **kaksi kissaa, kolme poikaa, kymmenen euroa**. Das Verb bleibt im Singular: **Kaksi poikaa leikkii.**
  fi-genitive:
    meaning: "der Genitiv: -n (Besitzer, „von“)"
    intro: |
      Der **Genitiv** endet auf **-n** und steht **vor** dem Nomen, zu dem er gehört: **Annan kirja** „Annas Buch“, **talon ovi** „die Tür des Hauses“, **Suomen pääkaupunki** „die Hauptstadt Finnlands“. Der Stufenwechsel schwächt den Stamm: **kauppa → kaupan**, **pöytä → pöydän**. Wörter auf **-e** verdoppeln es: **huone → huoneen**; **-nen** → **-sen**: **nainen → naisen**.

      Der Genitiv markiert auch das Subjekt von **täytyy** (müssen) und das Objekt einer abgeschlossenen Handlung (spätere Lektionen).
  fi-plural:
    meaning: "der Nominativ Plural -t"
    intro: |
      Das Pluralsubjekt endet auf **-t**, am selben (oft schwachen) Stamm wie der Genitiv Singular: **talo → talot, kauppa → kaupat, huone → huoneet, nainen → naiset, käsi → kädet**. Das Verb kongruiert: **Talot ovat isoja.** Die übrigen Pluralkasus nehmen **-i-** (A2).
  fi-inner-local:
    meaning: "innen: Inessiv -ssa, Elativ -sta, Illativ -Vn"
    intro: |
      Drei Kasus für **innen**:

      - **Inessiv -ssa/-ssä** „in“: **Asun Helsingissä.**
      - **Elativ -sta/-stä** „aus, von“: **Tulen kaupasta.** Auch „über“: **puhua elokuvasta**
      - **Illativ** „in … hinein“: letzter Vokal verdoppelt + **-n** (**talo → taloon, kauppa → kauppaan**), **-hVn** nach langem Vokal (**maa → maahan, työ → työhön**), **-seen** nach langem Vokal in längeren Wörtern (**huone → huoneeseen**). Der Illativ behält den **starken** Stamm.

      Städte, Länder und geschlossene Räume nehmen diese: **Suomessa, Brasiliassa, koulussa, autossa**.
    mistakes: ["Bewegung hinein: Illativ, nicht Inessiv."]
  fi-outer-local:
    meaning: "auf, an: Adessiv -lla, Ablativ -lta, Allativ -lle"
    intro: |
      Drei Kasus für **auf einer Fläche, an, bei**:

      - **Adessiv -lla/-llä** „auf, bei“: **Kirja on pöydällä.** Auch *mittels* (**bussilla** „mit dem Bus“) und Zeit (**viikolla** „während der Woche“).
      - **Ablativ -lta/-ltä** „von (… herunter / jemandem)“: **Sain kirjeen äidiltä.**
      - **Allativ -lle** „auf … hin, an (jemanden)“: **Annan kukan äidille.**

      Offene Orte und manche Städte nehmen diese auch: **torilla** (auf dem Markt), **asemalla** (am Bahnhof), **Tampereella**.
  fi-have:
    meaning: "„haben“: minulla on (bei mir ist)"
    intro: |
      Finnisch hat kein Verb *haben*. Der Besitzer steht im **Adessiv**, und das Verb ist immer **on**: **Minulla on auto.** „Ich habe ein Auto.“ **Sinulla on, hänellä on, meillä on, teillä on, heillä on.** Frage: **Onko sinulla…?** Verneint: **Minulla ei ole autoa** (Partitiv). Gefühle ebenso: **Minulla on nälkä** „ich habe Hunger“.
  fi-adjectives:
    meaning: "Adjektive kongruieren in Kasus und Numerus"
    intro: |
      Ein Adjektiv vor dem Nomen nimmt **denselben Kasus und Numerus**: **iso talo, isossa talossa, isoon taloon, isot talot, isoja taloja**. Nach **olla** steht das Adjektiv im Nominativ bei einem zählbaren Ding (**Talo on iso**) und im Partitiv bei Stoffen und Pluralen (**Vesi on kylmää. Talot ovat isoja.**).
  fi-demonstratives:
    meaning: "dies, das, es: tämä, tuo, se"
    intro: |
      **tämä** dies (bei mir), **tuo** das (dort drüben), **se** es / das (schon erwähnt). Plurale: **nämä, nuo, ne**. Sie werden dekliniert: **tässä** (hier, in diesem), **tästä, tähän; tuossa, tuolla; siinä, sitä, sen**. Gesprochen stehen **se** und **ne** auch für Personen.
  fi-imperative:
    meaning: "der Imperativ: tule!, tulkaa!, älä tule!"
    intro: |
      **An eine Person** ist der Imperativ der Stamm der 1. Person Singular ohne **-n**: **puhun → puhu!, tulen → tule!, haluan → halua!** **An mehrere (oder höflich)**: Infinitivstamm + **-kaa / -kää**: **puhukaa!, tulkaa!, syökää!**.

      Verneint: **älä** (eine Person) / **älkää** (mehrere) + bloßer Stamm: **Älä mene! Älkää puhuko!** (Plural mit **-ko/-kö**). **-pa/-pä** mildert: **Tulepa tänne!**
