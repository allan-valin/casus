# German text of the Finnish course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Clause substitutes: "Satzwertige Konstruktionen"
  The third and fourth infinitives: "Der dritte und vierte Infinitiv"
  Spoken Finnish and clitics: "Gesprochenes Finnisch und Klitika"
  Modality and feeling: "Modalität und Empfinden"
  Indefinites and questions: "Indefinita und Fragen"
  Rare cases: "Seltene Kasus"
  Spoken verb forms: "Gesprochene Verbformen"
lessons:
  fi-referative:
    meaning: "die Referativkonstruktion: dass-Sätze als Partizipien"
    intro: |
      Nach Verben des Sagens, Denkens und Wahrnehmens (**sanoa, kertoa, luulla, uskoa, tietää, huomata, nähdä, kuulla, toivoa**) kann ein **että**-Satz zu einem Partizip im Genitiv werden (*referatiivi*):

      - gleichzeitig: **-vAn**: **Hän sanoi, että Anna tulee → Hän sanoi Annan tulevan.**
      - vorzeitig: **-neen**: **Luulin, että hän oli lähtenyt → Luulin hänen lähteneen.**

      Ist das Subjekt dasselbe wie im Hauptsatz, ersetzt es ein Possessivsuffix: **Hän sanoi tulevansa.** „Er sagte, er werde kommen.“ **Luulin olevani oikeassa.** „Ich dachte, ich hätte recht.“
  fi-temporal:
    meaning: "die Temporalkonstruktion: als / nachdem man tat"
    intro: |
      Ein **kun**-Satz kann zu einer Verbform mit Possessivsuffix (gleiches Subjekt) oder Genitivsubjekt (anderes Subjekt) schrumpfen:

      - gleichzeitig: **-essA** (2. Infinitiv Inessiv): **Kun tulin kotiin, … → Kotiin tullessani …** „Als ich nach Hause kam …“ **Lasten nukkuessa luin.** „Während die Kinder schliefen, las ich.“
      - vorzeitig: **-tUA** (Partizip Perfekt Passiv + Partitivendung): **Kun olin syönyt, … → Syötyäni …** „Nachdem ich gegessen hatte …“ **Sateen lakattua lähdimme.** „Als der Regen aufgehört hatte, gingen wir.“

      Vor allem geschriebenes Finnisch: Nachrichten, Berichte, Literatur.
  fi-final:
    meaning: "die Finalkonstruktion -Akseen: um zu"
    intro: |
      **jotta** + Verb (damit) wird bei gleichem Subjekt zum Translativ des 1. Infinitivs + Possessivsuffix: **-akse- / -äkse-** + **-ni, -si, -en, -mme, -nne, -en**:

      - **Tulin Suomeen, jotta oppisin suomea → Tulin Suomeen oppiakseni suomea.** „Ich kam nach Finnland, um Finnisch zu lernen.“
      - **Hän säästää rahaa ostaakseen auton.** „Er spart, um ein Auto zu kaufen.“

      Fest: **tietääkseni** „soviel ich weiß“, **muistaakseni** „wenn ich mich recht erinnere“.
  fi-agent-participle:
    meaning: "das Agenspartizip -mA: von jemandem gemacht"
    intro: |
      **-mA** + Urheber im Genitiv ersetzt einen Relativsatz über etwas, das jemand getan hat:

      - **pullat, jotka äiti leipoi → äidin leipomat pullat** „die von Mutter gebackenen Brötchen“
      - mit Pronomen ein Possessivsuffix: **minun kirjoittamani kirje** (oder nur **kirjoittamani kirje**) „der Brief, den ich geschrieben habe“
      - **Tämä on Sibeliuksen säveltämä sinfonia.** „Das ist eine von Sibelius komponierte Sinfonie.“

      Es wird wie ein Adjektiv dekliniert: **äidin leipomia pullia, isän rakentamassa talossa**.
  fi-modal-instructive:
    meaning: "Art und Weise: der 2. Infinitiv Instruktiv -en"
    intro: |
      **-en** am Infinitivstamm sagt, wie etwas getan wird (die *Modalkonstruktion*), wie deutsches Partizip I: **Hän tuli hymyillen.** „Er kam lächelnd.“ **Lapset juoksivat nauraen.** „Die Kinder liefen lachend.“ **Kävelin laulaen.**

      Feste Wendungen: **toisin sanoen** „mit anderen Worten“, **yleisesti ottaen** „im Allgemeinen“, **niin sanoakseni** „sozusagen“.
  fi-matta:
    meaning: "-mAttA: ohne zu tun"
    intro: |
      Der Abessiv des 3. Infinitivs, **-mAttA**, heißt *ohne zu tun*: **Hän lähti sanomatta mitään.** „Er ging, ohne etwas zu sagen.“ **Älä mene syömättä.** „Geh nicht, ohne zu essen.“

      Mit **jättää** heißt es *ungetan lassen*: **Jätin kirjeen lukematta.** „Ich ließ den Brief ungelesen.“ Es gehört zur selben Familie wie **-mAssA** (beim Tun), **-mAstA** (vom Tun), **-mAAn** (zum Tun).
  fi-malla:
    meaning: "-mAllA: indem man tut"
    intro: |
      Der Adessiv des 3. Infinitivs, **-mAllA**, nennt das Mittel: *indem man tut*: **Puhumalla oppii.** „Durch Sprechen lernt man.“ **Voit säästää rahaa kävelemällä.** „Du kannst Geld sparen, indem du zu Fuß gehst.“ Vergleiche **-en** (Art und Weise, gleichzeitig): **Hän tuli hymyillen** gegenüber **Hän ansaitsee rahaa opettamalla** „er verdient Geld mit Unterrichten“.
  fi-minen:
    meaning: "-minen: das Verb als Nomen"
    intro: |
      **-minen** (der 4. Infinitiv) macht aus jedem Verb ein voll deklinierbares Nomen: **lukeminen** „das Lesen“, **Lukeminen on hauskaa.** „Lesen macht Spaß.“ **Pidän uimisesta.** „Ich schwimme gern.“ **Lopeta valittaminen!** „Hör auf zu jammern!“

      Formelle Texte bilden damit lange Nominalketten: **asunnon ostamisen helpottaminen** „die Erleichterung des Wohnungskaufs“.
  fi-possessive-postpositions:
    meaning: "Possessivsuffixe an Postpositionen und festen Wörtern"
    intro: |
      Geschriebenes Finnisch setzt das Possessivsuffix an Postpositionen statt (oder neben) dem Pronomen: **(minun) kanssani** „mit mir“, **(sinun) luoksesi** „zu dir“, **hänen vuokseen** „um seinetwillen“.

      Manche sind feste Ausdrücke für Meinung und Gegensatz: **mielestäni** „meiner Meinung nach“, **puolestani** „was mich betrifft“, **hän puolestaan** „er hingegen“, **vuorostaan** „seinerseits“.
  fi-clitics:
    meaning: "die Klitika -han, -pa, -kin"
    intro: |
      Kleine Endungen, die sich an das erste Wort eines Satzes hängen und dessen Ton ändern:

      - **-han / -hän**: mildert, *doch, ja*: **Tulethan huomenna?** „Du kommst doch morgen, oder?“ **Sehän on hyvä!** „Das ist ja gut!“
      - **-pa / -pä**: Nachdruck, Überraschung: **Onpa kaunis päivä!** „Was für ein schöner Tag!“ **Tulepa tänne!** „Komm doch mal her!“
      - **-kin**: *auch, tatsächlich*: **Minäkin tulen.** „Ich komme auch.“ **Hän tulikin.** „Und er kam tatsächlich.“
  fi-spoken-pronouns:
    meaning: "gesprochene Pronomen: mä, sä, mun, mulla"
    intro: |
      Gesprochenes Finnisch (und viel von Tatoeba) verkürzt die Pronomen:

      | Standard | gesprochen |
      |---|---|
      | minä, sinä | mä, sä (auch mää, sää) |
      | minun, sinun | mun, sun |
      | minulla, sinulla | mulla, sulla |
      | minulle, sinulle | mulle, sulle |
      | minua, sinua | mua, sua |
      | hän | se (auch für Personen) |

      **Mä en tiedä.** „Ich weiß nicht.“ **Onks sulla aikaa?** „Hast du Zeit?“
  fi-me-mennaan:
    meaning: "gesprochenes „wir“: die Passivform"
    intro: |
      Gesprochen nimmt *wir* die Passivform statt der 1. Person Plural: **me mennään** für **me menemme**, **me ollaan** für **me olemme**, **me ei tiedetä** für **me emme tiedä**. Ohne **me** bedeutet das Passiv oft *lass uns*: **Mennään!** „Gehen wir!“ In formellen Texten schreibe **menemme**.
  fi-necessive-participle:
    meaning: "müssen: Genitiv + on + -tAvA"
    intro: |
      Formelles Finnisch sagt *müssen* mit dem Partizip Präsens Passiv auf **-tAvA** nach **on**, die Person im Genitiv: **Minun on lähdettävä.** „Ich muss gehen.“ **Sinun on tehtävä se heti.** „Du musst es sofort tun.“ **Asiakkaan on maksettava lasku.** „Der Kunde muss die Rechnung bezahlen.“

      Verneint: **Sinun ei ole pakko / tarvitse …**, nicht ~~ei ole tehtävä~~ (das heißt *es darf nicht getan werden*).
  fi-feeling-verbs:
    meaning: "Empfindungsverben mit Erleber im Partitiv"
    intro: |
      Viele Empfindungen sind Verben auf **-ttAA** ohne Subjekt; wer empfindet, steht im **Partitiv** — wie deutsches *mich friert*: **Minua väsyttää.** „Ich bin müde.“ **Häntä naurattaa.** „Ihm ist zum Lachen.“ **Meitä janottaa.** „Wir haben Durst.“ Weitere: **pelottaa** (Angst haben), **harmittaa** (sich ärgern), **hävettää** (sich schämen), **kaduttaa** (bereuen), **jännittää** (nervös sein), **kiinnostaa** (interessiert sein), **kyllästyttää** (es satthaben).
    mistakes: ["Wer empfindet, steht im Partitiv, nicht im Nominativ."]
  fi-maton:
    meaning: "-mAtOn: das verneinte Partizip"
    intro: |
      **-mAtOn / -mätön** ist ein Partizip mit der Bedeutung *nicht (noch nicht) getan*: **lukematon kirja** „ein ungelesenes Buch“, **syömätön ruoka** „nicht gegessenes Essen“, **tuntematon sotilas** „der unbekannte Soldat“. Viele sind zu Adjektiven geworden: **uskomaton** „unglaublich“, **mahdoton** (von **-ton**) „unmöglich“, **näkymätön** „unsichtbar“, **väsymätön** „unermüdlich“. Dekliniert wie die **-ton**-Wörter: **lukemattomia kirjoja**.
  fi-negative-polarity:
    meaning: "jemand, etwas, je: -kAAn-Wörter mit Verneinung"
    intro: |
      Mit Verneinung (oder in einer zweifelnden Frage) verwendet das Finnische die **-kaan / -kään**-Formen: **En nähnyt ketään.** „Ich habe niemanden gesehen.“ **Hän ei sanonut mitään.** „Er hat nichts gesagt.“ **En ole koskaan käynyt siellä.** „Ich war noch nie dort.“ Ebenso **missään** (irgendwo), **mihinkään** (irgendwohin), **yhtään** (überhaupt kein), **lainkaan** (überhaupt), **ikinä** (je). Ohne Verneinung: **joku, jotain, joskus**.
  fi-tahansa:
    meaning: "freie Wahl: irgendwer, wo auch immer"
    intro: |
      Ein Fragewort + **tahansa** oder **hyvänsä** heißt *jeder beliebige*; das Fragewort nimmt den Kasus, den der Satz braucht: **Kuka tahansa voi tulla.** „Jeder kann kommen.“ **Voit soittaa milloin tahansa.** „Du kannst jederzeit anrufen.“ **Ota mikä tahansa.** „Nimm irgendeinen.“ **Kenelle tahansa** „irgendwem“. Vergleiche **kukaan** (mit Verneinung) und **joku** (jemand).
  fi-indirect-questions:
    meaning: "indirekte Ja/Nein-Fragen mit -kO"
    intro: |
      Eine indirekte Ja/Nein-Frage behält **-ko / -kö** am ersten Wort; es gibt kein Wort für *ob*: **En tiedä, tuleeko hän.** „Ich weiß nicht, ob er kommt.“ **Kysyin, oliko hän kotona.** „Ich fragte, ob er zu Hause war.“ **Mietin, kannattaako se.** „Ich frage mich, ob es sich lohnt.“ Nimm hier nicht **jos**: **jos** ist nur das konditionale *wenn*.
    mistakes: ["Indirekte Fragen nehmen -kO, nicht jos."]
  fi-comitative:
    meaning: "der Komitativ -ine-: zusammen mit (dem Seinen)"
    intro: |
      Der Komitativ ist der Form nach immer Plural und nimmt bei Nomen ein Possessivsuffix: **Hän tuli perheineen.** „Er kam mit seiner Familie.“ **vaimoineen** „mit seiner Frau“, **lapsineni** „mit meinen Kindern“. Ein Adjektiv davor hat **-ine** ohne Suffix: **suurine toiveineen** „mit seinen großen Hoffnungen“. Er gehört zum formellen und literarischen Stil; gesprochen sagt man **perheen kanssa**.
  fi-instructive:
    meaning: "der Instruktiv -in in festen Wendungen"
    intro: |
      Der Instruktiv (**-n**, meist am Pluralstamm) nennt Art oder Mittel und lebt in festen Wendungen fort: **omin silmin** „mit eigenen Augen“, **paljain jaloin** „barfuß“, **avoimin mielin** „offenen Sinnes“, **jalan** „zu Fuß“, **käsin** „von Hand“, **kaksin** „zu zweit“, **yksin** „allein“, **toisin sanoen** „mit anderen Worten“, **hyvin** „gut“. Er hat nie eine eigene Adjektivendung: Nomen und Adjektiv enden beide auf **-in**.
  fi-prolative:
    meaning: "der Prolativ -tse: über, per"
    intro: |
      **-tse** heißt *über, per*, bei einer kurzen Liste von Wörtern: **postitse** „per Post“, **sähköpostitse** „per E-Mail“, **puhelimitse** „telefonisch“, **maitse** „auf dem Landweg“, **meritse** „auf dem Seeweg“, **ilmateitse** „auf dem Luftweg“, **netitse** „online“. Es ist eine erstarrte Endung, kein voller Kasus: Gewöhnliche Nomen nehmen **kautta** oder **-llA**: **Helsingin kautta** „über Helsinki“.
  fi-spoken-verbs:
    meaning: "kurze gesprochene Verbformen"
    intro: |
      Die Alltagssprache verkürzt häufige Verben: **oon, oot** (olen, olet), **tuun, tuut** (tulen, tulet), **meen, meet** (menen, menet), **paan** (panen), und lässt Endlaute weg: **mennää** (mennään), **onks** (onko), **eiks** (eikö). Das Frageklitikon wird zu **-ks**: **Ooks sä kotona?** „Bist du zu Hause?“ Lies sie in Chats, Untertiteln und Dialogen; schreibe in Texten die Standardformen.
