# Macedonian text of the Polish course, A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and spelling: "Гласови и правопис"
  Pronouns and 'być': "Заменки и „być“"
  The present tense: "Сегашно време"
  Nouns and the cases: "Именки и падежи"
lessons:
  pl-sounds:
    meaning: "азбуката: диграфи, меки согласки, назални самогласки"
    intro: |
      Полскиот правопис е правилен штом ги знаеш групите:

      - **sz** = **ш**, **cz** = **ч**, **rz / ż** = **ж** (два правописа, еден глас), **dż** = **џ**
      - **ś, ć, ź, dź, ń** — меки варијанти, пред самогласка пишувани **si, ci, zi, dzi, ni**: **ś**wiat, **ci**epło (**ć** е блиску до **ќ**, **dź** до **ѓ**)
      - **ł** = англиско *w*; **w** = **в**; **ch / h** = **х**
      - **ą, ę** се назални самогласки (*он, ен*): **są** (тие се), **idę** (одам); **ó** = **у** (**ó / u** се ист глас)

      Нагласокот е на **претпоследниот слог**: **Polska, dziękuję, uniwersytet**.
    mistakes: ["ż и z се различни букви: зборовите со ż/rz се учат како што се пишуваат."]
  pl-byc:
    meaning: "личните заменки и być „сум“"
    intro: |
      **ja** јас, **ty** ти, **on / ona / ono** тој / таа / тоа, **my** ние, **wy** вие, **oni** (со мажи) / **one** (сите други) тие. Учтивото *Вие* е **pan** (кон маж), **pani** (кон жена), **państwo** (кон група), со глагол во 3 лице: **Czy pan jest z Polski?** „Дали сте од Полска?“

      **być**: **jestem, jesteś, jest, jesteśmy, jesteście, są**.
  pl-present:
    meaning: "сегашно време: глаголи на -m/-sz и на -ę/-esz"
    intro: |
      Два големи модели:

      | | czytać (чита) | mówić (зборува) | pisać (пишува) |
      |---|---|---|---|
      | ja | czyta**m** | mówi**ę** | pisz**ę** |
      | ty | czyta**sz** | mówi**sz** | pisz**esz** |
      | on | czyta | mówi | pisz**e** |
      | my | czyta**my** | mówi**my** | pisz**emy** |
      | wy | czyta**cie** | mówi**cie** | pisz**ecie** |
      | oni | czytaj**ą** | mówi**ą** | pisz**ą** |

      Глаголите на **-ać** главно одат како *czytać*; многу имаат своја основа (**pisać → piszę, iść → idę, jechać → jadę**).
  pl-negation:
    meaning: "негација: nie, и генитив по неа"
    intro: |
      **nie** пред глаголот (одделно): **Nie wiem.** „Не знам.“ Двојната негација е нормална, како во македонскиот: **Nikt nic nie wie.** „Никој ништо не знае.“ (**nikt** никој, **nic** ништо, **nigdy** никогаш, **nigdzie** никаде). Директниот објект по одречен глагол станува **генитив**: **Mam samochód → Nie mam samochodu.**
    mistakes: ["По одречен глагол објектот е во генитив."]
  pl-questions:
    meaning: "прашални зборови, и czy"
    intro: |
      **kto** кој, **co** што, **gdzie** каде, **dokąd** каде (накај), **skąd** од каде, **kiedy** кога, **dlaczego / czemu** зошто, **jak** како, **ile** колку, **który** кој (од нив), **jaki** каков. Прашањата да/не почнуваат со **czy**, како **дали**: **Czy masz czas?** „Дали имаш време?“
  pl-accusative:
    meaning: "акузативот: објектот"
    intro: |
      Женските **-a → -ę** (**kawa → kawę, siostra → siostrę**); живите машки ја земаат генитивната форма **-a** (**kot → kota, brat → brata**); неживите машки и средните **не се менуваат** (**mam dom, widzę okno**). Исто по **na, w, przez, za** со движење или време: **na pocztę**, **przez tydzień**.
  pl-genitive:
    meaning: "генитивот: на, по do, z, bez, od, u, и количества"
    intro: |
      Најзафатениот полски падеж: припадност (**dom ojca** „куќата на таткото“), количество (**dużo ludzi, szklanka wody**), по негација, и по **do** (до, во), **z** (од, надвор од), **bez** (без), **od** (од), **u** (кај некого), **dla** (за), **obok** (покрај). Наставки: **-a / -u** (маш.: **do domu, od brata**), **-y / -i** (жен.: **z Polski, do pracy**), **-a** (сред.: **do kina**).
  pl-locative:
    meaning: "локативот: во, на, за (по w, na, o, przy, po)"
    intro: |
      Само по **w / we** (во), **na** (на), **o** (за), **przy** (при, покрај), **po** (по). Наставки: **-e** со омекната согласка (**stół → na stole, Kraków → w Krakowie, kot → o kocie, Warszawa → w Warszawie**), **-u** по меки и по k, g, ch (**w domu, w parku**), женски **-e / -i / -y** (**w szkole, w pracy**); множина **-ach**.
  pl-instrumental:
    meaning: "инструменталот: со, преку; по być за занимања"
    intro: |
      **-em** (маш., сред.: **z bratem, autobusem**), **-ą** (жен.: **z mamą**), множина **-ami**. По **z** (со), **przed** (пред), **za** (зад), **nad** (над), **pod** (под), **między** (меѓу); за средство (**jadę pociągiem** „патувам со воз“); по **być** со именка: **Jestem nauczycielem.** „Јас сум учител.“
  pl-adjectives:
    meaning: "придавките се согласуваат по род, број и падеж"
    intro: |
      **-y / -i** (маш.), **-a** (жен.), **-e** (сред.): **nowy dom, nowa książka, nowe okno**; множина **-e** (**nowe domy**), но **-i / -y** за групи со мажи (**nowi studenci**). Се согласуваат и по падеж: **w nowym domu, z nową książką**.
