# German text of the Polish course, A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Past and future: "Vergangenheit und Zukunft"
  More cases and pronouns: "Weitere Kasus und Pronomen"
  Commands and modal verbs: "Imperativ und Modalverben"
lessons:
  pl-past:
    meaning: "die Vergangenheit: -ł- mit Personalendungen und Genus"
    intro: |
      Infinitiv ohne **-ć**, plus **-ł-** und eine Endung, die Person **und Genus** zeigt: **robiłem** (ich machte, Mann), **robiłam** (Frau), **robiłeś / robiłaś** (du machtest), **robił / robiła / robiło** (er / sie / es machte), **robiliśmy / robiłyśmy** (wir), **robili / robiły** (sie). Manche Stämme ändern sich: **mieć → miałem, iść → szedłem / szłam, jeść → jadłem**.
  pl-aspect:
    meaning: "der Aspekt: imperfektiv und perfektiv"
    intro: |
      Verben bilden Paare: **imperfektiv** für eine laufende oder wiederholte Handlung (**pisać**, **robić**, **kupować**), **perfektiv** für eine abgeschlossene (**napisać**, **zrobić**, **kupić**). Ein Perfektiv in Präsensform bedeutet **Zukunft**: **Napiszę list.** „Ich werde den Brief schreiben.“ Imperfektive bilden das Futur mit **będę**: **Będę pisać / pisał.**
  pl-future:
    meaning: "das Futur imperfektiver Verben: będę"
    intro: |
      **będę, będziesz, będzie, będziemy, będziecie, będą** + Infinitiv oder Vergangenheitsform: **Będę czytać / czytał.** „Ich werde lesen.“ Auch das Futur von **być**: **Jutro będę w domu.** „Morgen bin ich zu Hause.“
  pl-dative:
    meaning: "der Dativ: zu, für"
    intro: |
      **-owi / -u** (mask.: **bratu, ojcu, panu, Tomkowi**), **-e / -i / -y** (fem.: **mamie, siostrze**), **-u** (neutr.: **dziecku**); Plural **-om**. Nach **dać, pomagać, dziękować, podobać się**, und **dzięki** (dank), **przeciw** (gegen), **ku** (hin zu): **Dziękuję panu.** „Ich danke Ihnen.“
  pl-pronouns:
    meaning: "Personalpronomen in den Kasus"
    intro: |
      Kurzformen stehen unbetont nach dem Verb: **Kocham cię.** „Ich liebe dich.“ **Dam ci to.** „Ich gebe es dir.“ **Znasz go?** „Kennst du ihn?“ Akkusativ **mnie, cię, go, ją, nas, was, ich / je**; Dativ **mi, ci, mu, jej, nam, wam, im**. Nach Präposition **on → n-**: **do niego, z nią, o nich**.
  pl-plural:
    meaning: "der Plural, und die Männerform"
    intro: |
      Die meisten Nomen: **-y / -i** (**kot → koty, kobieta → kobiety, noga → nogi**), **-e** nach weichen Konsonanten (**koń → konie, ulica → ulice**), Neutra **-a** (**okno → okna**). Gruppen von **Männern** haben eigene Formen mit erweichten Konsonanten: **student → studenci, Polak → Polacy, pan → panowie**. Unregelmäßig: **człowiek → ludzie, dziecko → dzieci, oko → oczy, ręka → ręce**.
  pl-imperative:
    meaning: "der Imperativ"
    intro: |
      Von der 3. Person Plural ohne Endung: **piszą → pisz! piszcie!**, **czytają → czytaj! czytajcie!**; **-my** heißt *lass uns*: **chodźmy!** Höflich: **Proszę usiąść.** „Bitte setzen Sie sich.“ Häufig: **chodź** (komm), **czekaj** (warte), **słuchaj** (hör zu), **daj** (gib), **zobacz** (schau).
  pl-modals:
    meaning: "Modalverben: müssen, können, wollen"
    intro: |
      **musieć** müssen (**muszę, musisz**), **móc** können (**mogę, możesz, może**), **chcieć** wollen (**chcę, chcesz, chce**), **umieć** können (gelernt) (**umiem**), **woleć** lieber wollen (**wolę**) — + Infinitiv: **Muszę iść.** „Ich muss gehen.“ Unpersönlich: **trzeba** (man muss), **można** (man darf / kann), **wolno** (es ist erlaubt).
  pl-motion:
    meaning: "Bewegungsverben: zu Fuß oder mit Fahrzeug, jetzt oder gewöhnlich"
    intro: |
      **iść / chodzić** zu Fuß, **jechać / jeździć** mit Fahrzeug; **iść, jechać** für eine Fahrt jetzt, **chodzić, jeździć** für Gewohnheit: **Idę do sklepu.** „Ich gehe (gerade) in den Laden.“ **Chodzę do szkoły.** „Ich gehe (gewöhnlich) zur Schule.“ **Jadę autobusem.** „Ich fahre mit dem Bus.“
