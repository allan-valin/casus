# Arabic text of the Polish course, A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and spelling: "الأصوات والإملاء"
  Pronouns and 'być': "الضمائر و«być»"
  The present tense: "المضارع"
  Nouns and the cases: "الأسماء والحالات"
lessons:
  pl-sounds:
    meaning: "الأبجدية: الحروف المزدوجة والصوامت اللينة والصوائت الأنفية"
    intro: |
      الإملاء البولندي منتظم متى عرفت المجموعات:

      - **sz** = ش، **cz** = تش، **rz / ż** = ج الشامية (إملاءان لصوت واحد)، **dż** = ج
      - **ś، ć، ź، dź، ń** — صيغ ليّنة، تُكتب قبل الصائت **si، ci، zi، dzi، ni**: **ś**wiat، **ci**epło
      - **ł** = و، **w** = ڤ، **ch / h** = خ خفيفة
      - **ą، ę** صائتان أنفيّان (*أون، إن*): **są** (هم يكونون)، **idę** (أذهب)؛ **ó** = u (**ó / u** صوت واحد)

      النبر على **المقطع قبل الأخير**: **Polska، dziękuję، uniwersytet**.
    mistakes: ["ż وz حرفان مختلفان: تُحفظ كلمات ż/rz كما تُكتب."]
  pl-byc:
    meaning: "الضمائر الشخصية وbyć «يكون»"
    intro: |
      **ja** أنا، **ty** أنت، **on / ona / ono** هو / هي / هو (للمحايد)، **my** نحن، **wy** أنتم، **oni** (إن كان فيهم رجال) / **one** (لغيرهم) هم. و*حضرتك* للاحترام **pan** (لرجل)، **pani** (لامرأة)، **państwo** (لجماعة)، مع الفعل الغائب: **Czy pan jest z Polski?** «هل حضرتك من بولندا؟»

      **być**: **jestem، jesteś، jest، jesteśmy، jesteście، są**.
  pl-present:
    meaning: "المضارع: أفعال -m/-sz وأفعال -ę/-esz"
    intro: |
      نمطان كبيران:

      | | czytać (يقرأ) | mówić (يتكلم) | pisać (يكتب) |
      |---|---|---|---|
      | ja | czyta**m** | mówi**ę** | pisz**ę** |
      | ty | czyta**sz** | mówi**sz** | pisz**esz** |
      | on | czyta | mówi | pisz**e** |
      | my | czyta**my** | mówi**my** | pisz**emy** |
      | wy | czyta**cie** | mówi**cie** | pisz**ecie** |
      | oni | czytaj**ą** | mówi**ą** | pisz**ą** |

      أفعال **-ać** تتبع غالبًا *czytać*؛ وكثير منها له جذر خاص (**pisać → piszę، iść → idę، jechać → jadę**).
  pl-negation:
    meaning: "النفي: nie، والإضافة بعده"
    intro: |
      **nie** قبل الفعل (منفصلة): **Nie wiem.** «لا أعرف». والنفي المزدوج عادي: **Nikt nic nie wie.** «لا أحد يعرف شيئًا». (**nikt** لا أحد، **nic** لا شيء، **nigdy** أبدًا، **nigdzie** في لا مكان). والمفعول المباشر بعد الفعل المنفي يصير في **الإضافة**: **Mam samochód → Nie mam samochodu.**
    mistakes: ["بعد الفعل المنفي يكون المفعول في الإضافة."]
  pl-questions:
    meaning: "أدوات الاستفهام، وczy"
    intro: |
      **kto** من، **co** ماذا، **gdzie** أين، **dokąd** إلى أين، **skąd** من أين، **kiedy** متى، **dlaczego / czemu** لماذا، **jak** كيف، **ile** كم، **który** أيّ، **jaki** أيّ نوع. وأسئلة نعم/لا تبدأ بـ **czy** مثل «هل»: **Czy masz czas?** «هل عندك وقت؟»
  pl-accusative:
    meaning: "حالة المفعولية: المفعول به"
    intro: |
      المؤنث **-a → -ę** (**kawa → kawę، siostra → siostrę**)؛ والمذكر الحي يأخذ صيغة الإضافة **-a** (**kot → kota، brat → brata**)؛ والمذكر غير الحي والمحايد **لا يتغيران** (**mam dom، widzę okno**). وأيضًا بعد **na، w، przez، za** مع الحركة أو الزمن: **na pocztę**، **przez tydzień**.
  pl-genitive:
    meaning: "حالة الإضافة: الملكية، وبعد do وz وbez وod وu، والكميات"
    intro: |
      أنشط حالات البولندية: الملكية (**dom ojca** «بيت الأب»)، والكمية (**dużo ludzi، szklanka wody**)، وبعد النفي، وبعد **do** (إلى)، **z** (من)، **bez** (بدون)، **od** (من عند)، **u** (عند فلان)، **dla** (لأجل)، **obok** (بجانب). اللواحق: **-a / -u** (مذكر: **do domu، od brata**)، **-y / -i** (مؤنث: **z Polski، do pracy**)، **-a** (محايد: **do kina**).
  pl-locative:
    meaning: "الحالة الظرفية: في، على، عن (بعد w وna وo وprzy وpo)"
    intro: |
      لا تأتي إلا بعد **w / we** (في)، **na** (على)، **o** (عن)، **przy** (عند)، **po** (بعد، في أنحاء). اللواحق: **-e** مع تليين الصامت (**stół → na stole، Kraków → w Krakowie، kot → o kocie، Warszawa → w Warszawie**)، و**-u** بعد اللينة وk وg وch (**w domu، w parku**)، والمؤنث **-e / -i / -y** (**w szkole، w pracy**)؛ والجمع **-ach**.
  pl-instrumental:
    meaning: "حالة الآلة: مع، بواسطة؛ وبعد być للمهن"
    intro: |
      **-em** (مذكر، محايد: **z bratem، autobusem**)، **-ą** (مؤنث: **z mamą**)، والجمع **-ami**. بعد **z** (مع)، **przed** (أمام)، **za** (خلف)، **nad** (فوق)، **pod** (تحت)، **między** (بين)؛ وللوسيلة (**jadę pociągiem** «أسافر بالقطار»)؛ وبعد **być** مع اسم: **Jestem nauczycielem.** «أنا معلّم».
  pl-adjectives:
    meaning: "الصفات تطابق في الجنس والعدد والحالة"
    intro: |
      **-y / -i** (مذكر)، **-a** (مؤنث)، **-e** (محايد): **nowy dom، nowa książka، nowe okno**؛ والجمع **-e** (**nowe domy**)، لكن **-i / -y** للجماعات التي فيها رجال (**nowi studenci**). وتطابق في الحالة: **w nowym domu، z nową książką**.
