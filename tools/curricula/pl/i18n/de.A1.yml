# German text of the Polish course, A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and spelling: "Laute und Schreibung"
  Pronouns and 'być': "Pronomen und „być“"
  The present tense: "Das Präsens"
  Nouns and the cases: "Nomen und Kasus"
lessons:
  pl-sounds:
    meaning: "das Alphabet: Digraphe, weiche Konsonanten, Nasalvokale"
    intro: |
      Die polnische Schreibung ist regelmäßig, sobald man die Gruppen kennt:

      - **sz** = *sch*, **cz** = *tsch*, **rz / ż** = stimmhaftes *sch* wie in *Garage* (zwei Schreibungen, ein Laut), **dż** = *dsch*
      - **ś, ć, ź, dź, ń** — weiche Varianten, vor Vokal **si, ci, zi, dzi, ni** geschrieben: **ś**wiat, **ci**epło
      - **ł** = engl. *w*; **w** = *w*; **ch / h** = *ch* wie in *ach*
      - **ą, ę** sind Nasalvokale (*on, en*): **są** (sie sind), **idę** (ich gehe); **ó** = *u* (**ó / u** sind derselbe Laut)

      Die Betonung liegt auf der **vorletzten Silbe**: **Polska, dziękuję, uniwersytet**.
    mistakes: ["ż und z sind verschiedene Buchstaben: ż/rz-Wörter lernt man wie geschrieben."]
  pl-byc:
    meaning: "Personalpronomen und być „sein“"
    intro: |
      **ja** ich, **ty** du, **on / ona / ono** er / sie / es, **my** wir, **wy** ihr, **oni** (mit Männern) / **one** (alle anderen) sie. Das höfliche *Sie* ist **pan** (zu einem Mann), **pani** (zu einer Frau), **państwo** (zu einer Gruppe), mit dem Verb in der 3. Person: **Czy pan jest z Polski?**

      **być**: **jestem, jesteś, jest, jesteśmy, jesteście, są**.
  pl-present:
    meaning: "das Präsens: -m/-sz-Verben und -ę/-esz-Verben"
    intro: |
      Zwei große Muster:

      | | czytać (lesen) | mówić (sprechen) | pisać (schreiben) |
      |---|---|---|---|
      | ja | czyta**m** | mówi**ę** | pisz**ę** |
      | ty | czyta**sz** | mówi**sz** | pisz**esz** |
      | on | czyta | mówi | pisz**e** |
      | my | czyta**my** | mówi**my** | pisz**emy** |
      | wy | czyta**cie** | mówi**cie** | pisz**ecie** |
      | oni | czytaj**ą** | mówi**ą** | pisz**ą** |

      Verben auf **-ać** folgen meist *czytać*; viele haben einen eigenen Stamm (**pisać → piszę, iść → idę, jechać → jadę**).
  pl-negation:
    meaning: "Verneinung: nie, und der Genitiv danach"
    intro: |
      **nie** vor dem Verb (getrennt geschrieben): **Nie wiem.** „Ich weiß nicht.“ Doppelte Verneinung ist normal: **Nikt nic nie wie.** „Niemand weiß etwas.“ (**nikt** niemand, **nic** nichts, **nigdy** nie, **nigdzie** nirgends). Ein direktes Objekt steht nach verneintem Verb im **Genitiv**: **Mam samochód → Nie mam samochodu.**
    mistakes: ["Nach verneintem Verb steht das Objekt im Genitiv."]
  pl-questions:
    meaning: "Fragewörter, und czy"
    intro: |
      **kto** wer, **co** was, **gdzie** wo, **dokąd** wohin, **skąd** woher, **kiedy** wann, **dlaczego / czemu** warum, **jak** wie, **ile** wie viel, **który** welcher, **jaki** was für ein. Ja/Nein-Fragen beginnen mit **czy**: **Czy masz czas?** „Hast du Zeit?“
  pl-accusative:
    meaning: "der Akkusativ: das Objekt"
    intro: |
      Feminina **-a → -ę** (**kawa → kawę, siostra → siostrę**); belebte Maskulina nehmen die Genitivform **-a** (**kot → kota, brat → brata**); unbelebte Maskulina und Neutra **ändern sich nicht** (**mam dom, widzę okno**). Auch nach **na, w, przez, za** bei Richtung oder Zeit: **na pocztę**, **przez tydzień**.
  pl-genitive:
    meaning: "der Genitiv: von, nach do, z, bez, od, u, und Mengen"
    intro: |
      Der fleißigste Kasus des Polnischen: Besitz (**dom ojca**), Menge (**dużo ludzi, szklanka wody**), nach Verneinung und nach **do** (zu, in), **z** (aus, von), **bez** (ohne), **od** (von), **u** (bei jemandem), **dla** (für), **obok** (neben). Endungen: **-a / -u** (mask.: **do domu, od brata**), **-y / -i** (fem.: **z Polski, do pracy**), **-a** (neutr.: **do kina**).
  pl-locative:
    meaning: "der Lokativ: in, auf, über (nach w, na, o, przy, po)"
    intro: |
      Nur nach **w / we** (in), **na** (auf, an), **o** (über), **przy** (bei), **po** (nach, umher). Endungen: **-e** mit erweichtem Konsonanten (**stół → na stole, Kraków → w Krakowie, kot → o kocie, Warszawa → w Warszawie**), **-u** nach weichen und k, g, ch (**w domu, w parku**), Feminina **-e / -i / -y** (**w szkole, w pracy**); Plural **-ach**.
  pl-instrumental:
    meaning: "der Instrumental: mit, durch; nach być für Berufe"
    intro: |
      **-em** (mask., neutr.: **z bratem, autobusem**), **-ą** (fem.: **z mamą**), Plural **-ami**. Nach **z** (mit), **przed** (vor), **za** (hinter), **nad** (über), **pod** (unter), **między** (zwischen); für das Mittel (**jadę pociągiem** „ich fahre mit dem Zug“); nach **być** mit Nomen: **Jestem nauczycielem.** „Ich bin Lehrer.“
  pl-adjectives:
    meaning: "Adjektive kongruieren in Genus, Numerus und Kasus"
    intro: |
      **-y / -i** (mask.), **-a** (fem.), **-e** (neutr.): **nowy dom, nowa książka, nowe okno**; Plural **-e** (**nowe domy**), aber **-i / -y** für Gruppen mit Männern (**nowi studenci**). Sie kongruieren im Kasus: **w nowym domu, z nową książką**.
