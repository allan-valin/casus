# Macedonian text of the Polish course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Conditions and clauses: "Услови и зависни реченици"
  The passive and participles: "Пасив и партиципи"
  Impersonal constructions: "Безлични конструкции"
  Numerals: "Броеви"
  Polite address and pronouns: "Учтиво обраќање и заменки"
lessons:
  pl-conditional:
    meaning: "условниот начин: -by"
    intro: |
      Минатата форма + **-by** + лична наставка — **by** е истото како македонското **би**: **zrobiłbym** (би направил, маж), **zrobiłabym** (жена), **zrobiłbyś, zrobiłby, zrobilibyśmy…** Учтиви желби: **Chciałbym kawę.** „Би сакал кафе.“ Со **gdyby** (ако би): **Gdybym miał czas, poszedłbym.** „Да имав време, би отишол.“ **żeby** (за да) ги зема истите форми: **Chcę, żebyś przyszedł.** „Сакам да дојдеш.“
  pl-relative:
    meaning: "релативни реченици со który"
    intro: |
      **który / która / które** се согласува со именката и го зема падежот на својата улога во реченицата: **człowiek, który tu mieszka** „човекот што живее тука“, **książka, którą czytam** „книгата што ја читам“, **miasto, w którym mieszkam** „градот во кој живеам“. Пред него секогаш има запирка.
  pl-conjunctions:
    meaning: "дека, бидејќи, кога, ако"
    intro: |
      **że** дека, **bo / ponieważ** бидејќи, **kiedy / gdy** кога, **jeśli / jeżeli** ако, **ale** но, **albo / lub** или, **i / a** и, **ani** ниту, **niż** од (споредба), **chociaż** иако, **zanim** пред да, **dopóki** сѐ додека.
  pl-comparison:
    meaning: "компаратив -szy / bardziej и суперлатив naj-"
    intro: |
      **-szy / -ejszy**: **nowy → nowszy, ładny → ładniejszy**; долгите придавки земаат **bardziej** (повеќе): **bardziej interesujący**; суперлатив **naj-** — како **нај-**: **najnowszy, najbardziej**. Неправилни: **dobry → lepszy → najlepszy**, **zły → gorszy**, **duży → większy**, **mały → mniejszy**. *Од* (споредба): **niż** или **od** + генитив.
  pl-reflexive:
    meaning: "повратното się"
    intro: |
      **się** (како **се**) припаѓа на многу глаголи: **nazywam się** „се викам“, **uczę się** „учам“, **boję się** „се плашам“, **śmieję się** „се смеам“, **podoba mi się** „ми се допаѓа“. Гради и безлични реченици: **Tu się nie pali.** „Тука не се пуши.“
  pl-b2-passive:
    meaning: "пасивот: zostać / być + -ny, -ty"
    intro: |
      Пасивниот партицип завршува на **-ny / -ony / -ty** и се согласува како придавка: **zbudowany, zbudowana, zbudowane**; машколична множина **-ni / -eni / -ci** (**zaproszeni** „поканети“). Со **zostać** (свршен) опишува настан: **Dom został zbudowany w 1900 roku.** „Куќата беше изградена во 1900.“ Со **być** опишува состојба или повторено дејство: **Sklep jest zamknięty.** „Продавницата е затворена.“ **Dom był budowany przez dwa lata.** „Куќата се градеше две години.“ Вршителот доаѓа со **przez**: **napisany przez Mickiewicza**.
  pl-b2-active-participle:
    meaning: "активниот придавски партицип -ący"
    intro: |
      Од 3 лице множина сегашно **-ą** станува **-ący, -ąca, -ące**: **czytają → czytający** „кој чита“, **pracują → pracujący**. Се менува како придавка и заменува реченица со **który**, главно во пишување: **człowiek czytający gazetę** = **człowiek, który czyta gazetę**. Многу станале обични придавки или именки: **następujący** „следен“, **wiodący** „водечки“, **przewodniczący** „претседавач“.

      Го имаат само несвршените глаголи.
  pl-b2-adverbial-participle:
    meaning: "прилошки партиципи: правејќи, откако направил"
    intro: |
      **-ąc** (од несвршени глаголи) значи „правејќи“ — како македонското **-јќи**: **Czytając, piła kawę.** „Читајќи, пиеше кафе.“ **-wszy / -łszy** (од свршени, книжевно) значи „откако направил“: **Przeczytawszy list, wyszedł.** „Откако го прочита писмото, излезе.“ Двата се непроменливи и мораат да го делат подметот со главниот глагол.
    mistakes: ["Тој што влегува мора да е подметот на главниот глагол."]
  pl-b2-verbal-nouns:
    meaning: "глаголски именки на -nie, -cie"
    intro: |
      Речиси секој глагол гради именка од среден род на **-anie / -enie / -cie** — како македонското **-ње**: **czytać → czytanie** „читање“, **pisać → pisanie**, **mówić → mówienie**, **pić → picie** „пиење“, **myć → mycie**. Го чуваат видот (**zrobienie** „направување“), а глаголите со **się** можат да го задржат (**uczenie się** „учење“). Се менуваат како **zdanie**: **Lubię czytanie.** **Palenie zabronione.** „Пушењето забрането.“ Во официјален стил заменуваат цели реченици: **po zakończeniu pracy** „по завршувањето на работата“.
  pl-b2-impersonal-no-to:
    meaning: "безличното минато на -no / -to"
    intro: |
      Форма на **-no / -to**, градена како пасивниот партицип, кажува дека нешто **е направено** без да се каже кој: **Zbudowano nowy most.** „Изградија нов мост.“ **Powiedziano mi, że…** „Ми кажаа дека…“ **Ukradziono mi rower.** „Ми го украдоа велосипедот.“ Објектот останува во **акузатив** (или генитив по **nie**), па не е пасив: **Zaproszono nas.** „Нѐ поканија.“ Често во вести и извештаи.
  pl-b2-predicatives:
    meaning: "безлични зборови за можност и нужност"
    intro: |
      Овие зборови немаат подмет и земаат инфинитив; лицето, ако е спомнато, е во **датив**: **można** „може, дозволено е“, **trzeba** „треба“, **warto** „вреди“, **wolno** „смее“ (**Nie wolno tu palić.**), **należy** „треба“ (официјално), **widać / słychać** „се гледа / се слуша“. Минато и идно со **było / będzie**: **Trzeba było przyjść wcześniej.** „Требаше да дојдеш порано.“
  pl-b2-five-and-up:
    meaning: "од пет нагоре: генитив множина и глагол во среден род"
    intro: |
      По **pięć** и повеќе (и **kilka, wiele, dużo, mało, parę**) именката е во **генитив множина**, а глаголот во **3 лице еднина среден род**: **Pięć kotów spało.** „Пет мачки спиеја.“ **Przyszło dziesięć osób.** „Дојдоа десет луѓе.“ **Mam kilka pytań.** „Имам неколку прашања.“ По **dwa, trzy, cztery** именката е во номинатив множина и глаголот се согласува нормално: **Dwa koty spały.**
  pl-b2-men-numerals:
    meaning: "броеви со групи мажи"
    intro: |
      Машколичните именки (мажи или мешани групи во машка множина) имаат свои броеви — како македонските **двајца, тројца**: **dwaj, trzej, czterej** + номинатив (**dwaj bracia**), или почесто **dwóch, trzech, czterech, pięciu, sześciu…** + **генитив** со глагол во среден род еднина: **Dwóch studentów przyszło.** „Дојдоа двајца студенти.“ **Pięciu mężczyzn czekało.** **obaj / obu** „двајцата (мажи)“. **kilku, wielu** го следат истиот модел: **kilku kolegów**.
  pl-b2-collective:
    meaning: "збирни броеви: dwoje, troje, oboje"
    intro: |
      **dwoje, troje, czworo, pięcioro…** бројат **мешани групи** (маж и жена), **деца и младенчиња** (**dwoje dzieci**, **troje kociąt**) и именки само во множина (**dwoje drzwi** „две врати“). Земаат **генитив множина** и глагол во среден род еднина: **Mają troje dzieci.** „Имаат три деца.“ **oboje** „двајцата (маж и жена)“: **Oboje są lekarzami.** „Двајцата се лекари.“ Косите форми: **dwojga, obojga, dwojgiem**.
  pl-b2-pan-pani:
    meaning: "официјално обраќање: pan, pani, państwo"
    intro: |
      Полскиот нема учтива заменка „Вие“: на непознати им се обраќа во **3 лице** со **pan** (маж), **pani** (жена), **państwo** (пар или мешана група, со глагол во множина), **panowie, panie**: **Czy pan mówi po angielsku?** „Зборувате ли англиски, господине?“ **Co państwo zamawiają?** „Што ќе нарачате?“ Се менуваат: **Proszę pana!** „Извинете, господине!“, **Dziękuję pani.** „Ви благодарам, госпоѓо.“ Во говорот обраќањето често останува само во глаголот: **Czy może pan…?** „Може ли…?“
  pl-b2-indefinites:
    meaning: "неопределени заменки: -ś, -kolwiek, byle"
    intro: |
      **-ś** гради „не-, нешто-“: **ktoś** некој, **coś** нешто, **gdzieś** некаде, **kiedyś** некогаш, **jakiś** некаков. **-kolwiek** гради „било-, -годе“: **ktokolwiek** кој и да е, **cokolwiek** што и да е, **gdziekolwiek** каде и да е. **byle** „било кој, сеедно“ е пренебрежливо: **byle co** „што и да е, било што“, **byle jak** „некако, невнимателно“. **Ktoś dzwonił.** „Некој се јави.“ **Zrób cokolwiek!** „Направи било што!“
