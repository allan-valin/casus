# Arabic text of the Polish course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Conditions and clauses: "الشرط والجمل التابعة"
  The passive and participles: "المبني للمجهول وأسماء الفاعل والمفعول"
  Impersonal constructions: "التراكيب غير الشخصية"
  Numerals: "الأعداد"
  Polite address and pronouns: "المخاطبة المهذبة والضمائر"
lessons:
  pl-conditional:
    meaning: "الشرطي: -by"
    intro: |
      صيغة الماضي + **-by** + لاحقة الشخص: **zrobiłbym** (كنت سأفعل، لرجل)، **zrobiłabym** (لامرأة)، **zrobiłbyś، zrobiłby، zrobilibyśmy…** والتمني المهذب: **Chciałbym kawę.** «أودّ قهوة». ومع **gdyby** (لو): **Gdybym miał czas, poszedłbym.** «لو كان عندي وقت لذهبت». و**żeby** (لكي) تأخذ الصيغ نفسها: **Chcę, żebyś przyszedł.** «أريدك أن تأتي».
  pl-relative:
    meaning: "الجمل الموصولة بـ który"
    intro: |
      **który / która / które** يطابق اسمه ويأخذ حالة دوره في الجملة: **człowiek, który tu mieszka** «الرجل الذي يسكن هنا»، **książka, którą czytam** «الكتاب الذي أقرؤه»، **miasto, w którym mieszkam** «المدينة التي أسكن فيها». ودائمًا فاصلة قبله.
  pl-conjunctions:
    meaning: "أنّ، لأنّ، عندما، إذا"
    intro: |
      **że** أنّ، **bo / ponieważ** لأنّ، **kiedy / gdy** عندما، **jeśli / jeżeli** إذا، **ale** لكن، **albo / lub** أو، **i / a** و، **ani** ولا، **niż** من (في المقارنة)، **chociaż** مع أنّ، **zanim** قبل أن، **dopóki** ما دام.
  pl-comparison:
    meaning: "التفضيل -szy / bardziej والتفضيل المطلق naj-"
    intro: |
      **-szy / -ejszy**: **nowy → nowszy، ładny → ładniejszy**؛ والصفات الطويلة تأخذ **bardziej** (أكثر): **bardziej interesujący**؛ والمطلق **naj-**: **najnowszy، najbardziej**. والشاذ: **dobry → lepszy → najlepszy**، **zły → gorszy**، **duży → większy**، **mały → mniejszy**. و*من*: **niż** أو **od** + الإضافة.
  pl-reflexive:
    meaning: "الضمير الانعكاسي się"
    intro: |
      **się** يلازم أفعالًا كثيرة: **nazywam się** «اسمي»، **uczę się** «أتعلم»، **boję się** «أخاف»، **śmieję się** «أضحك»، **podoba mi się** «يعجبني». ويصوغ أيضًا جملًا غير شخصية: **Tu się nie pali.** «لا يُدخَّن هنا».
  pl-b2-passive:
    meaning: "المبني للمجهول: zostać / być + -ny، -ty"
    intro: |
      ينتهي اسم المفعول بـ **-ny / -ony / -ty** ويطابق كالصفة: **zbudowany، zbudowana، zbudowane**؛ وجمع الذكور العقلاء **-ni / -eni / -ci** (**zaproszeni** «مدعوّون»). ومع **zostać** (تام) يصف حدثًا: **Dom został zbudowany w 1900 roku.** «بُني البيت سنة 1900». ومع **być** يصف حالة أو فعلًا متكررًا: **Sklep jest zamknięty.** «المتجر مغلق». **Dom był budowany przez dwa lata.** «ظلّ البيت يُبنى سنتين». والفاعل يأتي بعد **przez**: **napisany przez Mickiewicza** «كتبه ميتسكيفيتش».
  pl-b2-active-participle:
    meaning: "اسم الفاعل الوصفي -ący"
    intro: |
      من الغائب الجمع في المضارع تصير **-ą** إلى **-ący، -ąca، -ące**: **czytają → czytający** «القارئ، الذي يقرأ»، **pracują → pracujący**. يُصرَّف كالصفة ويحلّ محلّ جملة **który**، في الكتابة غالبًا: **człowiek czytający gazetę** = **człowiek, który czyta gazetę**. وكثير منها صار صفات أو أسماء عادية: **następujący** «التالي»، **wiodący** «الرائد»، **przewodniczący** «الرئيس».

      ولا يكون إلا من الأفعال غير التامة.
  pl-b2-adverbial-participle:
    meaning: "صيغ الحال: وهو يفعل، بعد أن فعل"
    intro: |
      **-ąc** (من غير التامة) تعني «وهو يفعل»: **Czytając, piła kawę.** «وهي تقرأ كانت تشرب القهوة». و**-wszy / -łszy** (من التامة، كتابية) تعني «بعد أن فعل»: **Przeczytawszy list, wyszedł.** «بعد أن قرأ الرسالة خرج». وكلتاهما لا تتغير، ويجب أن تشاركا الفعل الرئيسي فاعله.
    mistakes: ["الداخل يجب أن يكون فاعل الفعل الرئيسي."]
  pl-b2-verbal-nouns:
    meaning: "المصادر بـ -nie، -cie"
    intro: |
      يصوغ كل فعل تقريبًا اسمًا محايدًا بـ **-anie / -enie / -cie** يسمّي الفعل: **czytać → czytanie** «القراءة»، **pisać → pisanie**، **mówić → mówienie**، **pić → picie** «الشرب»، **myć → mycie**. وتحتفظ بالجهة (**zrobienie** «الإنجاز»)، وأفعال **się** قد تحتفظ به (**uczenie się** «التعلّم»). تُصرَّف كـ **zdanie**: **Lubię czytanie.** **Palenie zabronione.** «التدخين ممنوع». وفي الأسلوب الرسمي تحلّ محلّ جمل كاملة: **po zakończeniu pracy** «بعد انتهاء العمل».
  pl-b2-impersonal-no-to:
    meaning: "الماضي غير الشخصي بـ -no / -to"
    intro: |
      صيغة بـ **-no / -to**، تُبنى كاسم المفعول، تقول إن شيئًا **قد فُعل** دون ذكر الفاعل: **Zbudowano nowy most.** «بُني جسر جديد». **Powiedziano mi, że…** «قيل لي إنّ…» **Ukradziono mi rower.** «سُرقت دراجتي». ويبقى المفعول في **المفعولية** (أو الإضافة بعد **nie**)، فليست مبنيًا للمجهول حقًا: **Zaproszono nas.** «دُعينا». وهي شائعة في الأخبار والتقارير.
  pl-b2-predicatives:
    meaning: "كلمات غير شخصية للإمكان والوجوب"
    intro: |
      هذه الكلمات بلا فاعل وتأخذ مصدرًا؛ والشخص إن ذُكر في **القابل**: **można** «يمكن، يجوز»، **trzeba** «يجب، ينبغي»، **warto** «يستحق»، **wolno** «مسموح» (**Nie wolno tu palić.**)، **należy** «ينبغي» (رسمي)، **widać / słychać** «يُرى / يُسمع». والماضي والمستقبل بـ **było / będzie**: **Trzeba było przyjść wcześniej.** «كان ينبغي أن تأتي أبكر».
  pl-b2-five-and-up:
    meaning: "من الخمسة فما فوق: الإضافة الجمع وفعل محايد"
    intro: |
      بعد **pięć** وما فوقه (وبعد **kilka، wiele، dużo، mało، parę**) يكون الاسم **إضافةً جمعًا** والفعل **غائبًا مفردًا محايدًا**: **Pięć kotów spało.** «نامت خمس قطط». **Przyszło dziesięć osób.** «جاء عشرة أشخاص». **Mam kilka pytań.** «عندي بضعة أسئلة». وبعد **dwa، trzy، cztery** يكون الاسم رفعًا جمعًا ويطابق الفعل عاديًا: **Dwa koty spały.**
  pl-b2-men-numerals:
    meaning: "الأعداد مع جماعات الرجال"
    intro: |
      للأسماء المذكرة العاقلة (الرجال، أو الجماعات المختلطة بصيغة المذكر) أعداد خاصة: **dwaj، trzej، czterej** + الرفع (**dwaj bracia**)، أو الأشيع **dwóch، trzech، czterech، pięciu، sześciu…** + **الإضافة** مع فعل محايد مفرد: **Dwóch studentów przyszło.** «جاء طالبان». **Pięciu mężczyzn czekało.** **obaj / obu** «كلاهما (رجلان)». و**kilku، wielu** على النمط نفسه: **kilku kolegów**.
  pl-b2-collective:
    meaning: "أعداد الجماعة: dwoje، troje، oboje"
    intro: |
      **dwoje، troje، czworo، pięcioro…** تعدّ **الجماعات المختلطة** (رجل وامرأة)، و**الأطفال والصغار** (**dwoje dzieci**، **troje kociąt**)، والأسماء الملازمة للجمع (**dwoje drzwi** «بابان»). وتأخذ **الإضافة الجمع** وفعلًا محايدًا مفردًا: **Mają troje dzieci.** «لهم ثلاثة أطفال». **oboje** «كلاهما (رجل وامرأة)»: **Oboje są lekarzami.** «كلاهما طبيب». والصيغ الأخرى: **dwojga، obojga، dwojgiem**.
  pl-b2-pan-pani:
    meaning: "المخاطبة الرسمية: pan، pani، państwo"
    intro: |
      ليس في البولندية ضمير مهذب للمخاطب: يُخاطَب الغرباء **بالغائب** مع **pan** (رجل)، **pani** (امرأة)، **państwo** (زوجان أو جماعة مختلطة، مع فعل جمع)، **panowie، panie**: **Czy pan mówi po angielsku?** «هل تتكلم حضرتك الإنجليزية؟» **Co państwo zamawiają?** «ماذا تطلبون حضراتكم؟» وتُصرَّف: **Proszę pana!** «من فضلك يا سيدي!»، **Dziękuję pani.** «شكرًا يا سيدتي». وفي الكلام تبقى المخاطبة كثيرًا في الفعل وحده: **Czy może pan…?** «هل يمكنك…؟»
  pl-b2-indefinites:
    meaning: "ضمائر النكرة: -ś، -kolwiek، byle"
    intro: |
      **-ś** تصوغ «أحد، شيء ما»: **ktoś** أحدهم، **coś** شيء ما، **gdzieś** في مكان ما، **kiedyś** يومًا ما، **jakiś** أيّ (ما). و**-kolwiek** تصوغ «أيّ … كان»: **ktokolwiek** أيّ أحد، **cokolwiek** أيّ شيء، **gdziekolwiek** أينما. و**byle** «أيّ كان، كيفما اتفق» للاستخفاف: **byle co** «أيّ شيء كان»، **byle jak** «كيفما اتفق». **Ktoś dzwonił.** «اتصل أحدهم». **Zrób cokolwiek!** «افعل أي شيء!»
