# Arabic text of the Polish course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Verbs in depth: "الأفعال بتعمق"
  Formal style: "الأسلوب الرسمي"
  Numbers and quantities: "الأعداد والكميات"
  Word order: "ترتيب الكلمات"
  Careful written Polish: "البولندية المكتوبة المتأنية"
  Expressive Polish: "البولندية التعبيرية"
  Idiomatic syntax: "التراكيب الاصطلاحية"
lessons:
  pl-c1-prefixed-motion:
    meaning: "أفعال الحركة ذات السوابق"
    intro: |
      تعطي السوابق **iść / chodzić** و**jechać / jeździć** اتجاهًا، ويصير الزوج تامًا / غير تام: **przyjść / przychodzić** «وصل، جاء»، **wyjść / wychodzić** «خرج»، **wejść / wchodzić** «دخل»، **przejść / przechodzić** «عبر»، **odejść / odchodzić** «ذهب بعيدًا»، **dojść / dochodzić** «بلغ»، **zejść / schodzić** «نزل»، **obejść** «دار حول»، **rozejść się** «تفرّق»، **podejść** «اقترب». و**iść** تفقد **i** بعد السابقة: **przyjdę، wyszedł، weszła**. ومع المركبات: **przyjechać، wyjechać، wjechać**…
  pl-c1-aktionsart:
    meaning: "سوابق تضيف كيفية الفعل"
    intro: |
      فوق جعل الفعل تامًا، تضيف السوابق ظلالًا دقيقة: **do-** إلى النهاية (**doczytać** «أتمّ القراءة»)، **prze-** عبورًا أو إفراطًا (**przeczytać** «قرأ كاملًا»، **przejeść się** «أفرط في الأكل»)، **na- … się** حتى الشبع (**najeść się** «أكل حتى شبع»، **napić się** «شرب»)، **wy- … się** كفايةً (**wyspać się** «نام كفايته»)، **roz- … się** الانفجار (**rozpłakać się** «انفجر باكيًا»، **rozchorować się** «مرض»)، **za- … się** الاستغراق (**zakochać się** «وقع في الحب»، **zamyślić się** «استغرق في التفكير»)، **po-** لبرهة (**poczytać** «قرأ قليلًا»).
  pl-c1-iteratives:
    meaning: "أفعال التكرار: من عادته، كان يفعل"
    intro: |
      مجموعة صغيرة من الأفعال بـ **-ywać / -iwać / -ać** تعبّر عن العادة أو التكرار: **bywać** «يكون (أحيانًا)»، **miewać** «يكون عنده (أحيانًا)»، **jadać** «يأكل (عادةً)»، **sypiać** «ينام (عادةً)»، **widywać** «يرى (بانتظام)»، **chadzać** «يذهب (عادةً)». **Bywa różnie.** «الأمر يختلف». **Miewam bóle głowy.** «يصيبني الصداع أحيانًا». **Rzadko jadam mięso.** «قلّما آكل اللحم». وفي الماضي تعني «كان من عادته»: **Bywał u nas często.** «كان يزورنا كثيرًا».
  pl-c1-negative-imperative:
    meaning: "الجهة في النهي"
    intro: |
      يكون النهي عادةً **غير تام**: **Nie otwieraj okna!** «لا تفتح النافذة!» **Nie mów nikomu.** «لا تخبر أحدًا». والفعل **التام** المنفي **تحذير** مما قد يقع سهوًا: **Nie spadnij!** «احذر أن تقع!» **Nie zgub kluczy!** «لا تُضِع المفاتيح!» **Nie zapomnij!** «لا تنسَ!» ولاحظ أن مفعول الفعل المنفي يكون في **الإضافة**: **okna**، **kluczy**.
  pl-c1-secondary-prepositions:
    meaning: "حروف الجر الثانوية وحالاتها"
    intro: |
      تستعمل البولندية الرسمية حروف جر مبنية من كلمات أخرى، لكل منها حالتها:

      - **dzięki** + القابل «بفضل»، **wbrew** + القابل «خلافًا لـ»
      - **mimo / pomimo** + الإضافة «رغم»، **według** + الإضافة «وفقًا لـ»، **wskutek** + الإضافة «نتيجةً لـ»، **podczas** + الإضافة «خلال»، **zamiast** + الإضافة «بدلًا من»، **oprócz** + الإضافة «عدا»
      - **z powodu** + الإضافة «بسبب»، **w ciągu** + الإضافة «في غضون»، **w trakcie** + الإضافة «في أثناء»، **na podstawie** + الإضافة «بناءً على»، **ze względu na** + المفعولية «نظرًا إلى»
      - **w związku z** + الآلة «فيما يتصل بـ»، **wobec** + الإضافة «تجاه، أمام»
  pl-c1-bookish-conjunctions:
    meaning: "أدوات الربط في الأسلوب الكتابي"
    intro: |
      للبولندية المكتوبة أدوات ربط خاصة:

      - السبب: **gdyż، albowiem** «لأنّ، إذ»، **bowiem** «إذ» (لا تأتي أولًا: **Nie przyszedł, był bowiem chory.**)
      - الاستدراك: **lecz** «لكن، بل»، **jednak، jednakże** «غير أنّ»، **natomiast** «في حين»، **aczkolwiek** «وإن»
      - النتيجة: **zatem، więc، toteż** «لذلك»
      - **iż** = **że** «أنّ» في النصوص الرسمية
  pl-c1-hearsay:
    meaning: "النقل والتحفّظ: يُزعم"
    intro: |
      تعلّم البولندية المعلومة المنقولة أو المشكوك فيها بظروف وأدوات: **podobno، ponoć** «يُقال، على ما يبدو» (محايدة: **Podobno będzie padać.** «يقولون إنها ستمطر»)، **rzekomo** «يُزعم» (متشككة، شائعة في الصحافة)، **jakoby** «يُزعم أنّ، كأنّ» (كتابية، وأداة ربط أيضًا: **Mówi, jakoby był chory.** «يقول إنه مريض كما يزعم»)، **niby** «يعني، كأنّ» (عامية: **Niby wszystko w porządku.** «يعني كل شيء على ما يرام»).
  pl-c1-particles:
    meaning: "أدوات الموقف والتركيز"
    intro: |
      تحمل الأدوات كثيرًا من موقف المتكلم البولندي:

      - **przecież** «لكن، أليس كذلك»: **Przecież ci mówiłem!** «لكنني قلت لك!»
      - **chyba** «على الأرجح، أظن»: **Chyba pada.** «أظنها تمطر».
      - **właśnie** «بالضبط، للتو»: **Właśnie wyszedł.** «خرج للتو».
      - **aż** «حتى، بلغ»: **aż do rana** «حتى الصباح»؛ **dopiero** «لا … إلا»: **dopiero jutro** «لا قبل الغد»
      - **nawet** «حتى»، **raczej** «بالأحرى»، **czyż** (استفهام بلاغي)، **niech** «ليـ»، **oby** «عسى»: **Oby wszystko się udało!** «عسى أن ينجح كل شيء!»
  pl-c1-numeral-cases:
    meaning: "الأعداد في الحالات غير الرفع"
    intro: |
      الأعداد تُصرَّف، وفي القابل والآلة والظرفية يطابقها الاسم في الحالة: **z dwoma kolegami** «مع صديقين»، **dwóm / dwom osobom** «لشخصين»، **z trzema dziećmi**، **o pięciu książkach** «عن خمسة كتب»، **z pięcioma (pięciu) osobami**. ولـ **dwa** صيغة **dwóch / dwu** في الإضافة والظرفية، و**dwóm** في القابل، و**dwoma** (وللمؤنث **dwiema** أيضًا) في الآلة؛ ولـ **pięć** وما فوقه **pięciu** في كل الحالات غير الرفع، و**pięcioma** بديلًا في الآلة. **sto → stu**، و**tysiąc** يُصرَّف كاسم.
  pl-c1-approximation:
    meaning: "الكميات التقريبية"
    intro: |
      **około** + الإضافة «نحو» (**około stu osób**)، **ponad** «أكثر من» (**ponad godzinę**)، **blisko** «قرابة»، **przeszło** «ما يزيد على»، **niespełna** «دون … بقليل» (كتابية)، **mniej więcej** «تقريبًا». و**półtora** (مذكر/محايد) و**półtorej** (مؤنث) «واحد ونصف» تأخذان الإضافة المفردة: **półtora roku**، **półtorej godziny**.
  pl-c1-word-order:
    meaning: "ترتيب الكلمات: المعروف أولًا والجديد آخرًا"
    intro: |
      تضع البولندية المعلومة **المعروفة** أولًا و**الجديدة** آخرًا، وهذا يقوم مقام أداة التعريف: **Mężczyzna wszedł do pokoju.** «دخل الرجلُ الغرفة». **Do pokoju wszedł mężczyzna.** «دخل الغرفةَ رجلٌ». والجمل التي تبدأ بزمان أو مكان أو بـ **nagle** تؤخّر الفاعل غالبًا بعد الفعل: **Wczoraj przyjechał mój brat.** «وصل أخي أمس». **Nagle zadzwonił telefon.** «فجأةً رنّ الهاتف».

      و**się** والضمائر القصيرة تتجنب آخر الجملة ما أمكن: **Bardzo mi się to podoba.**
  pl-c2-short-adjectives:
    meaning: "الصيغ القصيرة للصفات"
    intro: |
      تحتفظ بضع صفات بـ **صيغة مذكرة قصيرة** قديمة، بعد **być** وفي العبارات الثابتة: **pewien** (pewny) «متأكد»، **gotów** (gotowy) «مستعد»، **winien** (winny) «مذنب، مَدين»، **pełen** (pełny) «مليء بـ» (+ الإضافة: **pełen ludzi**)، **godzien** (godny) «جدير»، **ciekaw** (ciekawy) «فضولي»، **świadom** (świadomy) «واعٍ»، **zdrów** (zdrowy) «سليم»، **rad** «مسرور» (قصيرة فقط). **Jestem pewien, że przyjdzie.** «أنا متأكد أنه سيأتي». **Nie jestem ciekaw.** «لست فضوليًا». والمؤنث والجمع بالصيغ الطويلة: **Jestem pewna.**
  pl-c2-aby-jakby:
    meaning: "أدوات -by: الغاية، كأنّ، حتى لو"
    intro: |
      عدة أدوات ربط تحمل **-by** الشرطية وتأخذ هي لاحقة الشخص، والفعل في صيغة الماضي:

      - **aby / żeby / by** «لكي»: **Przyszedłem, abyś mi pomógł.** «جئت لكي تساعدني». (**aby** أرسم من **żeby**)
      - **jakby** «كأنّ»: **Wygląda, jakby był chory.** «يبدو كأنه مريض».
      - **choćby / chociażby** «حتى لو، على الأقل»: **Choćbyś płakał, nie pojedziesz.** «حتى لو بكيت فلن تذهب». **Zadzwoń choćby raz.** «اتصل مرة على الأقل».
  pl-c2-ze-particle:
    meaning: "-że التوكيدية والأسئلة البلاغية"
    intro: |
      **-że / -ż** مضافة إلى أداة استفهام أو أمر تضيف توكيدًا أو نفاد صبر أو نبرة بلاغية: **Cóż mogę zrobić?** «وماذا عساي أفعل؟» **Któż to wie?** «ومن يدري؟» **Jakże się cieszę!** «ما أشدّ فرحي!» **Chodźże już!** «هيا تعالَ!» و**cóż** وحدها تعني «حسنًا، ما العمل»: **Cóż, trudno.** «حسنًا، لا حيلة». وهذه الصيغ أدبية أو قديمة الطابع، إلا **cóż** فشائعة.
  pl-c2-nie-spelling:
    meaning: "كتابة nie موصولة أو مفصولة"
    intro: |
      يصل الإملاء البولندي **nie** أو يفصلها بحسب نوع الكلمة: **مفصولة** مع الأفعال (**nie wiem**، **nie ma**)، و**موصولة** مع الصفات والظروف المشتقة منها وأسماء الفاعل والمفعول الوصفية (**niedobry**، **niedobrze**، **niezamknięty**، **niepalący** «لغير المدخنين»)، ومع الأسماء (**nieporozumienie** «سوء تفاهم»). وتُفصل عند المقابلة الصريحة (**nie dobry, lecz zły**) وقبل الأعداد وصيغ التفضيل (**nie lepszy**). ومنذ 2024 تسمح القاعدة الرسمية بوصل **nie** بكل أسماء الفاعل والمفعول الوصفية.
  pl-c2-diminutives:
    meaning: "التصغير والتحبب"
    intro: |
      التصغير في كل مكان في البولندية المحكية: **-ek / -ka / -ko** (**domek، chwilka، piwko**)، ومضاعفًا **-eczek / -eczka / -eczko** (**chwileczka، domeczek**)، وفي الصفات **-utki / -uteńki / -usieńki** (**malutki، malusieńki** «صغير صغير»). ويعبّر عن المودة أو اللطف أو الصغر: **Chwileczkę!** «لحظة واحدة!» **Troszkę.** «قليل قليل». **Kawka?** «قهوة صغيرة؟» وصيغ التكبير بـ **-isko / -sko** خشنة أو ودودة: **psisko** «كلب ضخم عجوز»، **chłopisko**.
  pl-c2-colloquial:
    meaning: "أدوات الكلام العامي وحشوه"
    intro: |
      تتشكل البولندية اليومية من كلمات صغيرة قلّما ترد في الكتب المدرسية:

      - **no** «حسنًا، طيب، هيا»: **No, dobra.** «طيب، حسنًا». **No chodź!** «هيا تعالَ!»
      - **weź** (أمر من wziąć) بمعنى «هيا» نافدة الصبر: **Weź przestań!** «كفى يا رجل!»
      - **wiesz، wiecie، słuchaj** لشدّ الانتباه: **Wiesz, co ci powiem?** «أتعرف ماذا؟»
      - **ej** «هيه»، **spoko** «لا مشكلة»، **dobra** «حسنًا»، **nara** «إلى اللقاء»
      - **-ś** تنتقل في الكلام إلى كلمة سابقة: **Gdzieś był?** = **Gdzie byłeś?** «أين كنت؟»
  pl-c2-partitive:
    meaning: "الإضافة التبعيضية: بعض من"
    intro: |
      مع الأفعال التامة للإعطاء والأخذ والشراء والصبّ، يعني المفعول في **الإضافة** «**بعضًا** من»: **Nalej mi wody.** «صبّ لي ماءً». **Kup chleba.** «اشترِ خبزًا». **Napijesz się herbaty?** «أتشرب شايًا؟» أما المفعولية فتأخذ **الكل**: **Kup chleb.** «اشترِ الرغيف». والإضافة نفسها بعد كلمات الكمية (**szklanka mleka**) وفي **dodać soli** «أضف ملحًا».
  pl-c2-polite-commands:
    meaning: "الأمر المهذب: proszę + المصدر، niech + الغائب"
    intro: |
      عند مخاطبة **pan / pani** تتجنب البولندية صيغة الأمر. و**Proszę** + **المصدر** هي الطلب أو التعليمات المهذبة المعتادة: **Proszę usiąść.** «تفضّل بالجلوس». **Proszę nie palić.** «يُرجى عدم التدخين». والمصدر **غير التام** يبدو دعوة دافئة أو تعليمات للجميع: **Proszę siadać!** «تفضّلوا اجلسوا!» **Proszę wchodzić!** «تفضّلوا بالدخول!» و**Niech** + الغائب صيغة مهذبة أخرى: **Niech pan wejdzie.** «تفضّل ادخل يا سيدي». **Niech pani spojrzy.** «انظري يا سيدتي».
  pl-c2-figurative-motion:
    meaning: "أفعال الحركة في التعابير الاصطلاحية"
    intro: |
      تحمل **iść / chodzić** معاني مجردة كثيرة: **chodzi o…** «الأمر يتعلق بـ…» (**O co chodzi?** «ما الأمر؟»)، **Jak ci idzie?** «كيف تسير أمورك؟» (الشخص في القابل)، **idzie mi dobrze** «أموري تسير جيدًا»، **wychodzi na to, że…** «يتبيّن أنّ…»، **nie wyszło** «لم ينجح»، **wejść w życie** «دخل حيّز التنفيذ»، **dojść do porozumienia** «توصّل إلى اتفاق».
  pl-c2-dative-sie:
    meaning: "أفعال się غير الشخصية مع القابل"
    intro: |
      كثير من الحالات والأحداث يُقال بلا فاعل، والشخص في **القابل** والفعل غائبًا مفردًا (محايدًا في الماضي) مع **się**: **Chce mi się spać.** «أشعر بالنعاس». **Nie chce mi się.** «لا رغبة لي». **Udało mi się!** «نجحتُ!» **Śniło mi się, że…** «حلمتُ أنّ…» **Wydaje mi się, że…** «يبدو لي أنّ…» **Dobrze mi się tu mieszka.** «يطيب لي العيش هنا». وترتيب **mi się** قبل الفعل شائع بالقدر نفسه.
