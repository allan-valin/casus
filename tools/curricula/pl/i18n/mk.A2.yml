# Macedonian text of the Polish course, A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Past and future: "Минато и идно"
  More cases and pronouns: "Уште падежи и заменки"
  Commands and modal verbs: "Заповеди и модални глаголи"
lessons:
  pl-past:
    meaning: "минатото: -ł- со лични наставки и род"
    intro: |
      Инфинитив без **-ć**, плус **-ł-** и наставка што покажува лице **и род** — **ł** е истото **л** од македонското **правел**: **robiłem** (правев, маж), **robiłam** (жена), **robiłeś / robiłaś** (правеше ти), **robił / robiła / robiło** (тој / таа / тоа), **robiliśmy / robiłyśmy** (ние), **robili / robiły** (тие). Некои основи се менуваат: **mieć → miałem, iść → szedłem / szłam, jeść → jadłem**.
  pl-aspect:
    meaning: "видот: несвршен и свршен"
    intro: |
      Глаголите доаѓаат во парови, како во македонскиот: **несвршен** за дејство во тек или повторено (**pisać**, **robić**, **kupować**), **свршен** за завршено (**napisać**, **zrobić**, **kupić**). Свршен во сегашна форма значи **иднина**: **Napiszę list.** „Ќе го напишам писмото.“ Несвршените го градат идното со **będę**: **Będę pisać / pisał.** „Ќе пишувам.“
  pl-future:
    meaning: "идното на несвршените глаголи: będę"
    intro: |
      **będę, będziesz, będzie, będziemy, będziecie, będą** + инфинитив или минатата форма: **Będę czytać / czytał.** „Ќе читам.“ Исто и идното на **być**: **Jutro będę w domu.** „Утре ќе бидам дома.“
  pl-dative:
    meaning: "дативот: на, за"
    intro: |
      **-owi / -u** (маш.: **bratu, ojcu, panu, Tomkowi**), **-e / -i / -y** (жен.: **mamie, siostrze**), **-u** (сред.: **dziecku**); множина **-om**. По **dać, pomagać, dziękować, podobać się**, и **dzięki** (благодарение на), **przeciw** (против), **ku** (кон): **Dziękuję panu.** „Ви благодарам, господине.“
  pl-pronouns:
    meaning: "личните заменки во падежите"
    intro: |
      Кратките форми доаѓаат по глаголот, ненагласени: **Kocham cię.** „Те сакам.“ **Dam ci to.** „Ќе ти го дадам.“ **Znasz go?** „Го знаеш?“ Акузатив **mnie, cię, go, ją, nas, was, ich / je**; датив **mi, ci, mu, jej, nam, wam, im**. По предлог **on → n-**: **do niego, z nią, o nich**.
  pl-plural:
    meaning: "множината, и машколичната форма"
    intro: |
      Повеќето именки: **-y / -i** (**kot → koty, kobieta → kobiety, noga → nogi**), **-e** по меки согласки (**koń → konie, ulica → ulice**), средни **-a** (**okno → okna**). Групите **мажи** имаат свои форми со омекнати согласки: **student → studenci, Polak → Polacy, pan → panowie**. Неправилни: **człowiek → ludzie, dziecko → dzieci, oko → oczy, ręka → ręce**.
  pl-imperative:
    meaning: "заповедниот начин"
    intro: |
      Од 3 лице множина без наставката: **piszą → pisz! piszcie!**, **czytają → czytaj! czytajcie!**; **-my** значи *ајде да*: **chodźmy!** Учтиво: **Proszę usiąść.** „Повелете седнете.“ Чести: **chodź** (дојди), **czekaj** (чекај), **słuchaj** (слушај), **daj** (дај), **zobacz** (види).
  pl-modals:
    meaning: "модални глаголи: мора, може, сака"
    intro: |
      **musieć** мора (**muszę, musisz**), **móc** може (**mogę, możesz, może**), **chcieć** сака (**chcę, chcesz, chce**), **umieć** знае (да) (**umiem**), **woleć** претпочита (**wolę**) — + инфинитив: **Muszę iść.** „Морам да одам.“ Безлично: **trzeba** (треба), **można** (може, смее), **wolno** (дозволено е).
  pl-motion:
    meaning: "глаголи на движење: пеш или со возило, сега или обично"
    intro: |
      **iść / chodzić** пеш, **jechać / jeździć** со возило; **iść, jechać** за едно патување сега, **chodzić, jeździć** за навика: **Idę do sklepu.** „Одам до продавница (сега).“ **Chodzę do szkoły.** „Одам на училиште (обично).“ **Jadę autobusem.** „Патувам со автобус.“
