# Macedonian text of the Polish course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Verbs in depth: "Глаголите во длабочина"
  Formal style: "Официјален стил"
  Numbers and quantities: "Броеви и количества"
  Word order: "Ред на зборовите"
  Careful written Polish: "Грижлив пишан полски"
  Expressive Polish: "Експресивен полски"
  Idiomatic syntax: "Идиоматска синтакса"
lessons:
  pl-c1-prefixed-motion:
    meaning: "глаголи на движење со представки"
    intro: |
      Представките им даваат насока на **iść / chodzić** и **jechać / jeździć**, а парот станува свршен / несвршен — како **дојде / доаѓа**: **przyjść / przychodzić** „пристигне, дојде“, **wyjść / wychodzić** „излезе“, **wejść / wchodzić** „влезе“, **przejść / przechodzić** „помине, премине“, **odejść / odchodzić** „замине“, **dojść / dochodzić** „стигне“, **zejść / schodzić** „слезе“, **obejść** „заобиколи“, **rozejść się** „се разотиде“, **podejść** „пристапи“. **iść** го губи **i** по представка: **przyjdę, wyszedł, weszła**. Со возила: **przyjechać, wyjechać, wjechać**…
  pl-c1-aktionsart:
    meaning: "представки што додаваат начин на дејство"
    intro: |
      Освен свршеност, представките додаваат точни нијанси, многу слично на македонскиот: **do-** до крај (**doczytać** „дочита“), **prze-** низ или премногу (**przeczytać** „прочита“, **przejeść się** „се прејаде“), **na- … się** до сита (**najeść się** „се најаде“, **napić się** „се напие“), **wy- … się** доволно (**wyspać się** „се наспие“), **roz- … się** почнување (**rozpłakać się** „се расплаче“, **rozchorować się** „се разболи“), **za- … się** занесување (**zakochać się** „се вљуби“, **zamyślić się** „се замисли“), **po-** малку време (**poczytać** „почита малку“).
  pl-c1-iteratives:
    meaning: "итеративи: обично, имаше обичај"
    intro: |
      Мала група глаголи на **-ywać / -iwać / -ać** изразуваат навика или повторување: **bywać** „бива (одвреме-навреме)“, **miewać** „има (понекогаш)“, **jadać** „јаде (обично)“, **sypiać** „спие (обично)“, **widywać** „гледа (редовно)“, **chadzać** „оди (обично)“. **Bywa różnie.** „Бива различно.“ **Miewam bóle głowy.** „Понекогаш ме боли глава.“ **Rzadko jadam mięso.** „Ретко јадам месо.“ Во минато значат „имаше обичај“: **Bywał u nas często.** „Често доаѓаше кај нас.“
  pl-c1-negative-imperative:
    meaning: "видот во одречните заповеди"
    intro: |
      Одречните заповеди обично се **несвршени**: **Nie otwieraj okna!** „Не отворај го прозорецот!“ **Nie mów nikomu.** „Не кажувај никому.“ Одречен **свршен** глагол е **предупредување** од нешто што може да се случи случајно: **Nie spadnij!** „Внимавај да не паднеш!“ **Nie zgub kluczy!** „Да не ги загубиш клучевите!“ **Nie zapomnij!** „Да не заборавиш!“ Објектот на одречен глагол оди во **генитив**: **okna**, **kluczy**.
  pl-c1-secondary-prepositions:
    meaning: "секундарни предлози и нивните падежи"
    intro: |
      Официјалниот полски користи предлози изведени од други зборови, секој со свој падеж:

      - **dzięki** + дат. „благодарение на“, **wbrew** + дат. „спротивно на“
      - **mimo / pomimo** + ген. „и покрај“, **według** + ген. „според“, **wskutek** + ген. „како последица од“, **podczas** + ген. „за време на“, **zamiast** + ген. „наместо“, **oprócz** + ген. „освен“
      - **z powodu** + ген. „поради“, **w ciągu** + ген. „во текот на“, **w trakcie** + ген. „во тек на“, **na podstawie** + ген. „врз основа на“, **ze względu na** + акуз. „со оглед на“
      - **w związku z** + инстр. „во врска со“, **wobec** + ген. „спрема, пред“
  pl-c1-bookish-conjunctions:
    meaning: "сврзници на пишаниот стил"
    intro: |
      Пишаниот полски има свои сврзници:

      - причина: **gdyż, albowiem** „бидејќи, зашто“, **bowiem** „зашто“ (никогаш прво: **Nie przyszedł, był bowiem chory.**)
      - спротивност: **lecz** „но, туку“, **jednak, jednakże** „сепак, меѓутоа“, **natomiast** „додека пак“, **aczkolwiek** „иако“
      - последица: **zatem, więc, toteż** „според тоа“
      - **iż** = **że** „дека“ во официјални текстови
  pl-c1-hearsay:
    meaning: "пренесување и оддалечување: наводно"
    intro: |
      Полскиот означува информација од втора рака или сомнителна со прилози и честички — улога што во македонскиот ја врши и **л-формата** (**дошол, велат**): **podobno, ponoć** „наводно, велат“ (неутрално: **Podobno będzie padać.** „Велат дека ќе врне.“), **rzekomo** „наводно“ (скептично, често во печатот), **jakoby** „наводно, како да“ (книжевно, и сврзник: **Mówi, jakoby był chory.** „Вели дека наводно е болен.“), **niby** „демек, како да“ (разговорно: **Niby wszystko w porządku.** „Демек сè е во ред.“).
  pl-c1-particles:
    meaning: "модални и фокусни честички"
    intro: |
      Честичките носат голем дел од ставот на говорникот:

      - **przecież** „па, сепак“: **Przecież ci mówiłem!** „Па ти реков!“
      - **chyba** „веројатно, мислам“: **Chyba pada.** „Мислам дека врне.“
      - **właśnie** „токму, штотуку“: **Właśnie wyszedł.** „Штотуку излезе.“
      - **aż** „дури, сè до“: **aż do rana** „сè до утрото“; **dopiero** „дури (толку доцна)“: **dopiero jutro** „дури утре“
      - **nawet** „дури и“, **raczej** „повеќе, поскоро“, **czyż** (реторичко прашање), **niech** „нека“, **oby** „да даде господ“: **Oby wszystko się udało!**
  pl-c1-numeral-cases:
    meaning: "броевите во косите падежи"
    intro: |
      Броевите се менуваат, а во дативот, инструменталот и локативот именката се согласува со нив по падеж: **z dwoma kolegami** „со двајца пријатели“, **dwóm / dwom osobom** „на две лица“, **z trzema dziećmi**, **o pięciu książkach** „за пет книги“, **z pięcioma (pięciu) osobami**. **dwa** има **dwóch / dwu** во генитив и локатив, **dwóm** во датив и **dwoma** (жен. и **dwiema**) во инструментал; **pięć** и нагоре имаат **pięciu** во секој кос падеж, со **pięcioma** како алтернатива во инструментал. **sto → stu**, **tysiąc** се менува како именка.
  pl-c1-approximation:
    meaning: "приближни количества"
    intro: |
      **około** + ген. „околу“ (**około stu osób**), **ponad** „над“ (**ponad godzinę**), **blisko** „речиси“, **przeszło** „повеќе од“, **niespełna** „нешто помалку од“ (книжевно), **mniej więcej** „повеќе-помалку“. **półtora** (маш./сред.) и **półtorej** (жен.) „еден и пол“ земаат генитив еднина: **półtora roku**, **półtorej godziny**.
  pl-c1-word-order:
    meaning: "редот на зборовите: познатото прво, новото последно"
    intro: |
      Полскиот го става **познатото** прво, а **новото** последно, и тоа ја врши работата на членовите: **Mężczyzna wszedł do pokoju.** „Мажот влезе во собата.“ **Do pokoju wszedł mężczyzna.** „Во собата влезе еден маж.“ Реченици што почнуваат со време, место или **nagle** често го ставаат подметот по глаголот: **Wczoraj przyjechał mój brat.** „Вчера дојде брат ми.“ **Nagle zadzwonił telefon.** „Одеднаш заѕвони телефонот.“

      **się** и кратките заменки го избегнуваат крајот на реченицата кога можат: **Bardzo mi się to podoba.**
  pl-c2-short-adjectives:
    meaning: "кратки форми на придавки"
    intro: |
      Неколку придавки чуваат стара **кратка машка форма**, по **być** и во цврсти изрази: **pewien** (pewny) „сигурен“, **gotów** (gotowy) „подготвен“, **winien** (winny) „виновен, должен“, **pełen** (pełny) „полн со“ (+ ген.: **pełen ludzi**), **godzien** (godny) „достоен“, **ciekaw** (ciekawy) „љубопитен“, **świadom** (świadomy) „свесен“, **zdrów** (zdrowy) „здрав“, **rad** „радосен“ (само кратко). **Jestem pewien, że przyjdzie.** „Сигурен сум дека ќе дојде.“ **Nie jestem ciekaw.** „Не сум љубопитен.“ Женскиот род и множината ги земаат долгите форми: **Jestem pewna.**
  pl-c2-aby-jakby:
    meaning: "сврзници со -by: цел, како да, дури и ако"
    intro: |
      Неколку сврзници го носат условното **-by** и самите ја земаат личната наставка, а глаголот е во минатата форма:

      - **aby / żeby / by** „за да“: **Przyszedłem, abyś mi pomógł.** „Дојдов за да ми помогнеш.“ (**aby** е поофицијално од **żeby**)
      - **jakby** „како да“: **Wygląda, jakby był chory.** „Изгледа како да е болен.“
      - **choćby / chociażby** „дури и да, барем“: **Choćbyś płakał, nie pojedziesz.** „Дури и да плачеш, нема да одиш.“ **Zadzwoń choćby raz.** „Јави се барем еднаш.“
  pl-c2-ze-particle:
    meaning: "нагласното -że и реторичките прашања"
    intro: |
      **-że / -ż** додадено на прашален збор или на заповед додава нагласок, нетрпение или реторички тон: **Cóż mogę zrobić?** „Па што да правам?“ **Któż to wie?** „Кој ли го знае тоа?“ **Jakże się cieszę!** „Колку ми е мило!“ **Chodźże już!** „Ајде веќе!“ Само **cóż** значи „па, ете“: **Cóż, trudno.** „Ете, што да се прави.“ Овие форми звучат книжевно или малку старомодно, освен **cóż**, кое е често.
  pl-c2-nie-spelling:
    meaning: "пишување на nie заедно или одделно"
    intro: |
      Полскиот правопис го спојува или одделува **nie** според зборовниот вид: **одделно** со глаголи (**nie wiem**, **nie ma**), **заедно** со придавки, прилози од придавки и придавски партиципи (**niedobry**, **niedobrze**, **niezamknięty**, **niepalący** „непушач“), и со именки (**nieporozumienie** „недоразбирање“). Се пишува одделно кога има изречна спротивност (**nie dobry, lecz zły**) и пред броеви и компаративи (**nie lepszy**). Од 2024 официјалното правило дозволува **nie** заедно со сите придавски партиципи.
  pl-c2-diminutives:
    meaning: "деминутиви и милувалки"
    intro: |
      Деминутивите се насекаде во говорниот полски: **-ek / -ka / -ko** (**domek, chwilka, piwko**), двојни **-eczek / -eczka / -eczko** (**chwileczka, domeczek**), а кај придавки **-utki / -uteńki / -usieńki** (**malutki, malusieńki** „малечко“). Изразуваат милост, учтивост или малечкост: **Chwileczkę!** „Само момент!“ **Troszkę.** „Малку-малку.“ **Kawka?** „Кафенце?“ Аугментативите на **-isko / -sko** се груби или мили: **psisko** „песиште“, **chłopisko**.
  pl-c2-colloquial:
    meaning: "честички и полнила на разговорниот јазик"
    intro: |
      Секојдневниот полски го обликуваат мали зборови што ретко се во учебниците:

      - **no** „па, ајде“: **No, dobra.** „Па добро.“ **No chodź!** „Ајде дојди!“
      - **weź** (заповедно од wziąć) како нетрпеливо „ајде бе“: **Weź przestań!** „Ајде престани!“
      - **wiesz, wiecie, słuchaj** за да се задржи вниманието: **Wiesz, co ci powiem?** „Знаеш што?“
      - **ej** „еј“, **spoko** „нема проблем, кул“, **dobra** „добро“, **nara** „чао“
      - **-ś** во говорот се поместува на поран збор: **Gdzieś był?** = **Gdzie byłeś?** „Каде беше?“
  pl-c2-partitive:
    meaning: "партитивниот генитив: малку од"
    intro: |
      Со свршени глаголи на давање, земање, купување и сипување, објект во **генитив** значи „**малку** од“: **Nalej mi wody.** „Сипи ми малку вода.“ **Kup chleba.** „Купи малку леб.“ **Napijesz się herbaty?** „Ќе се напиеш чај?“ Акузативот го зема **целото**: **Kup chleb.** „Купи го лебот / еден леб.“ Истиот генитив се јавува по зборови за количество (**szklanka mleka**) и во **dodać soli** „додаде сол“.
  pl-c2-polite-commands:
    meaning: "учтиви заповеди: proszę + инфинитив, niech + 3 лице"
    intro: |
      Кон **pan / pani** полскиот го избегнува заповедниот начин. **Proszę** + **инфинитив** е вообичаеното учтиво барање или упатство: **Proszę usiąść.** „Повелете седнете.“ **Proszę nie palić.** „Ве молиме не пушете.“ **Несвршениот** инфинитив звучи како топла покана или упатство за сите: **Proszę siadać!** „Седнете, повелете!“ **Proszę wchodzić!** „Повелете внатре!“ **Niech** + 3 лице е друга учтива форма: **Niech pan wejdzie.** „Нека влезе господинот.“ **Niech pani spojrzy.** „Погледнете, госпоѓо.“
  pl-c2-figurative-motion:
    meaning: "глаголите на движење во идиоми"
    intro: |
      **iść / chodzić** носат многу апстрактни значења: **chodzi o…** „станува збор за…“ (**O co chodzi?** „Што се работи?“), **Jak ci idzie?** „Како ти оди?“ (датив на лицето — исто како во македонскиот), **idzie mi dobrze** „ми оди добро“, **wychodzi na to, że…** „излегува дека…“, **nie wyszło** „не испадна, не успеа“, **wejść w życie** „стапи на сила“, **dojść do porozumienia** „дојде до договор“.
  pl-c2-dative-sie:
    meaning: "безлични się-глаголи со дативот"
    intro: |
      Многу состојби и настани се кажуваат без подмет, лицето во **датив**, глаголот во 3 лице еднина (среден род во минато) со **się** — исто како **ми се спие**: **Chce mi się spać.** „Ми се спие.“ **Nie chce mi się.** „Не ми се оди/прави.“ **Udało mi się!** „Ми успеа!“ **Śniło mi się, że…** „Ми се сонуваше дека…“ **Wydaje mi się, że…** „Ми се чини дека…“ **Dobrze mi się tu mieszka.** „Убаво ми е да живеам тука.“ Редот **mi się** пред глаголот е исто толку чест.
