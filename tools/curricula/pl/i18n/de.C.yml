# German text of the Polish course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Verbs in depth: "Verben im Detail"
  Formal style: "Formeller Stil"
  Numbers and quantities: "Zahlen und Mengen"
  Word order: "Wortstellung"
  Careful written Polish: "Sorgfältiges geschriebenes Polnisch"
  Expressive Polish: "Expressives Polnisch"
  Idiomatic syntax: "Idiomatische Syntax"
lessons:
  pl-c1-prefixed-motion:
    meaning: "präfigierte Bewegungsverben"
    intro: |
      Präfixe geben **iść / chodzić** und **jechać / jeździć** eine Richtung, und das Paar wird perfektiv / imperfektiv: **przyjść / przychodzić** „ankommen, kommen“, **wyjść / wychodzić** „hinausgehen“, **wejść / wchodzić** „hineingehen“, **przejść / przechodzić** „überqueren, durchgehen“, **odejść / odchodzić** „weggehen“, **dojść / dochodzić** „erreichen“, **zejść / schodzić** „hinuntergehen“, **obejść** „umgehen“, **rozejść się** „auseinandergehen“, **podejść** „herangehen“. **iść** verliert nach Präfix sein **i**: **przyjdę, wyszedł, weszła**. Mit Fahrzeugen: **przyjechać, wyjechać, wjechać** …
  pl-c1-aktionsart:
    meaning: "Präfixe, die eine Aktionsart hinzufügen"
    intro: |
      Über die Perfektivierung hinaus fügen Präfixe genaue Nuancen hinzu: **do-** bis zum Ende (**doczytać** „zu Ende lesen“), **prze-** durch oder zu viel (**przeczytać** „durchlesen“, **przejeść się** „sich überessen“), **na- … się** sich satt (**najeść się** „sich satt essen“, **napić się** „etwas trinken“), **wy- … się** genug (**wyspać się** „ausschlafen“), **roz- … się** ausbrechen (**rozpłakać się** „in Tränen ausbrechen“, **rozchorować się** „krank werden“), **za- … się** sich vertiefen (**zakochać się** „sich verlieben“, **zamyślić się** „ins Grübeln kommen“), **po-** eine Weile (**poczytać** „ein bisschen lesen“).
  pl-c1-iteratives:
    meaning: "Iterativa: pflegt zu, pflegte zu"
    intro: |
      Eine kleine Gruppe von Verben auf **-ywać / -iwać / -ać** drückt Gewohnheit oder Wiederholung aus: **bywać** „(ab und zu) sein“, **miewać** „(ab und zu) haben“, **jadać** „(gewöhnlich) essen“, **sypiać** „(gewöhnlich) schlafen“, **widywać** „(regelmäßig) sehen“, **chadzać** „(gewöhnlich) gehen“. **Bywa różnie.** „Mal so, mal so.“ **Miewam bóle głowy.** „Ich habe ab und zu Kopfschmerzen.“ **Rzadko jadam mięso.** „Ich esse selten Fleisch.“ In der Vergangenheit heißen sie „pflegte“: **Bywał u nas często.** „Er besuchte uns oft.“
  pl-c1-negative-imperative:
    meaning: "der Aspekt in verneinten Befehlen"
    intro: |
      Verneinte Befehle sind normalerweise **imperfektiv**: **Nie otwieraj okna!** „Mach das Fenster nicht auf!“ **Nie mów nikomu.** „Sag es niemandem.“ Ein verneintes **Perfektiv** ist eine **Warnung** vor einem Missgeschick: **Nie spadnij!** „Pass auf, dass du nicht fällst!“ **Nie zgub kluczy!** „Verlier die Schlüssel nicht!“ **Nie zapomnij!** „Vergiss nicht!“ Das Objekt eines verneinten Verbs steht im **Genitiv**: **okna**, **kluczy**.
  pl-c1-secondary-prepositions:
    meaning: "sekundäre Präpositionen und ihre Kasus"
    intro: |
      Formelles Polnisch verwendet aus anderen Wörtern gebildete Präpositionen, jede mit ihrem Kasus:

      - **dzięki** + Dat. „dank“, **wbrew** + Dat. „entgegen“
      - **mimo / pomimo** + Gen. „trotz“, **według** + Gen. „laut“, **wskutek** + Gen. „infolge“, **podczas** + Gen. „während“, **zamiast** + Gen. „anstatt“, **oprócz** + Gen. „außer“
      - **z powodu** + Gen. „wegen“, **w ciągu** + Gen. „innerhalb“, **w trakcie** + Gen. „im Laufe“, **na podstawie** + Gen. „auf Grund“, **ze względu na** + Akk. „in Anbetracht“
      - **w związku z** + Instr. „im Zusammenhang mit“, **wobec** + Gen. „gegenüber, angesichts“
  pl-c1-bookish-conjunctions:
    meaning: "Konjunktionen des Schriftstils"
    intro: |
      Das geschriebene Polnisch hat eigene Konnektoren:

      - Grund: **gdyż, albowiem** „weil, denn“, **bowiem** „denn“ (nie am Anfang: **Nie przyszedł, był bowiem chory.**)
      - Gegensatz: **lecz** „aber, sondern“, **jednak, jednakże** „jedoch“, **natomiast** „hingegen“, **aczkolwiek** „wenngleich“
      - Folge: **zatem, więc, toteż** „folglich“
      - **iż** = **że** „dass“ in formellen Texten
  pl-c1-hearsay:
    meaning: "Berichten und Distanz: angeblich"
    intro: |
      Polnisch markiert Informationen aus zweiter Hand oder zweifelhafte mit Adverbien und Partikeln: **podobno, ponoć** „angeblich, wie es heißt“ (neutral: **Podobno będzie padać.** „Es soll regnen.“), **rzekomo** „angeblich“ (skeptisch, häufig in der Presse), **jakoby** „angeblich, als ob“ (buchsprachlich, auch Konjunktion: **Mówi, jakoby był chory.** „Er sagt, er sei angeblich krank.“), **niby** „angeblich, als ob“ (umgangssprachlich: **Niby wszystko w porządku.** „Angeblich ist alles in Ordnung.“).
  pl-c1-particles:
    meaning: "Modal- und Fokuspartikeln"
    intro: |
      Partikeln tragen viel von der Haltung des Sprechers:

      - **przecież** „doch, ja“: **Przecież ci mówiłem!** „Ich habe es dir doch gesagt!“
      - **chyba** „wohl, ich glaube“: **Chyba pada.** „Ich glaube, es regnet.“
      - **właśnie** „genau, gerade“: **Właśnie wyszedł.** „Er ist gerade gegangen.“
      - **aż** „ganze, bis hin zu“: **aż do rana** „bis zum Morgen“; **dopiero** „erst“: **dopiero jutro** „erst morgen“
      - **nawet** „sogar“, **raczej** „eher“, **czyż** (rhetorische Frage), **niech** „soll“, **oby** „möge“: **Oby wszystko się udało!**
  pl-c1-numeral-cases:
    meaning: "Zahlwörter in den obliquen Kasus"
    intro: |
      Zahlwörter werden dekliniert, und im Dativ, Instrumental und Lokativ kongruiert das Nomen mit ihnen im Kasus: **z dwoma kolegami** „mit zwei Freunden“, **dwóm / dwom osobom** „zwei Personen“, **z trzema dziećmi**, **o pięciu książkach** „über fünf Bücher“, **z pięcioma (pięciu) osobami**. **dwa** hat **dwóch / dwu** im Genitiv und Lokativ, **dwóm** im Dativ und **dwoma** (fem. auch **dwiema**) im Instrumental; **pięć** und höher haben in jedem obliquen Kasus **pięciu**, im Instrumental alternativ **pięcioma**. **sto → stu**, **tysiąc** wird wie ein Nomen dekliniert.
  pl-c1-approximation:
    meaning: "ungefähre Mengen"
    intro: |
      **około** + Gen. „etwa“ (**około stu osób**), **ponad** „über“ (**ponad godzinę**), **blisko** „fast“, **przeszło** „mehr als“, **niespełna** „knapp unter“ (buchsprachlich), **mniej więcej** „mehr oder weniger“. **półtora** (mask./neutr.) und **półtorej** (fem.) „anderthalb“ nehmen den Genitiv Singular: **półtora roku**, **półtorej godziny**.
  pl-c1-word-order:
    meaning: "Wortstellung: Bekanntes zuerst, Neues zuletzt"
    intro: |
      Polnisch stellt **bekannte** Information an den Anfang und **neue** ans Ende, und das leistet die Arbeit der Artikel: **Mężczyzna wszedł do pokoju.** „Der Mann kam ins Zimmer.“ **Do pokoju wszedł mężczyzna.** „Ein Mann kam ins Zimmer.“ Sätze, die mit Zeit, Ort oder **nagle** beginnen, stellen das Subjekt oft hinter das Verb: **Wczoraj przyjechał mój brat.** „Gestern kam mein Bruder an.“ **Nagle zadzwonił telefon.** „Plötzlich klingelte das Telefon.“

      **się** und kurze Pronomen meiden das Satzende, wo sie können: **Bardzo mi się to podoba.**
  pl-c2-short-adjectives:
    meaning: "kurze Adjektivformen"
    intro: |
      Eine Handvoll Adjektive bewahrt eine alte **kurze maskuline Form**, nach **być** und in festen Wendungen: **pewien** (pewny) „sicher“, **gotów** (gotowy) „bereit“, **winien** (winny) „schuldig“, **pełen** (pełny) „voll von“ (+ Gen.: **pełen ludzi**), **godzien** (godny) „würdig“, **ciekaw** (ciekawy) „neugierig“, **świadom** (świadomy) „bewusst“, **zdrów** (zdrowy) „gesund“, **rad** „froh“ (nur kurz). **Jestem pewien, że przyjdzie.** „Ich bin sicher, dass er kommt.“ **Nie jestem ciekaw.** „Ich bin nicht neugierig.“ Femininum und Plural nehmen die Langformen: **Jestem pewna.**
  pl-c2-aby-jakby:
    meaning: "-by-Konjunktionen: Zweck, als ob, selbst wenn"
    intro: |
      Mehrere Konjunktionen tragen das konditionale **-by** und selbst die Personalendung, das Verb steht in der Vergangenheitsform:

      - **aby / żeby / by** „damit, um zu“: **Przyszedłem, abyś mi pomógł.** „Ich bin gekommen, damit du mir hilfst.“ (**aby** ist förmlicher als **żeby**)
      - **jakby** „als ob“: **Wygląda, jakby był chory.** „Er sieht aus, als wäre er krank.“
      - **choćby / chociażby** „selbst wenn, wenigstens“: **Choćbyś płakał, nie pojedziesz.** „Selbst wenn du weinst, fährst du nicht.“ **Zadzwoń choćby raz.** „Ruf wenigstens einmal an.“
  pl-c2-ze-particle:
    meaning: "betontes -że und rhetorische Fragen"
    intro: |
      **-że / -ż** an einem Fragewort oder Imperativ fügt Nachdruck, Ungeduld oder einen rhetorischen Ton hinzu: **Cóż mogę zrobić?** „Was kann ich schon tun?“ **Któż to wie?** „Wer weiß das schon?“ **Jakże się cieszę!** „Wie freue ich mich!“ **Chodźże już!** „Nun komm schon!“ **cóż** allein heißt „nun ja“: **Cóż, trudno.** „Nun ja, da kann man nichts machen.“ Diese Formen klingen literarisch oder etwas altmodisch, außer **cóż**, das häufig ist.
  pl-c2-nie-spelling:
    meaning: "nie zusammen oder getrennt schreiben"
    intro: |
      Die polnische Rechtschreibung verbindet oder trennt **nie** nach Wortart: **getrennt** bei Verben (**nie wiem**, **nie ma**), **zusammen** bei Adjektiven, von Adjektiven gebildeten Adverbien und adjektivischen Partizipien (**niedobry**, **niedobrze**, **niezamknięty**, **niepalący** „Nichtraucher-“) sowie bei Nomen (**nieporozumienie** „Missverständnis“). Getrennt bei ausdrücklichem Gegensatz (**nie dobry, lecz zły**) und vor Zahlwörtern und Komparativen (**nie lepszy**). Seit 2024 erlaubt die amtliche Regel **nie** zusammen mit allen adjektivischen Partizipien.
  pl-c2-diminutives:
    meaning: "Diminutive und Koseformen"
    intro: |
      Diminutive sind im gesprochenen Polnisch überall: **-ek / -ka / -ko** (**domek, chwilka, piwko**), doppelte **-eczek / -eczka / -eczko** (**chwileczka, domeczek**), bei Adjektiven **-utki / -uteńki / -usieńki** (**malutki, malusieńki** „winzig klein“). Sie drücken Zuneigung, Höflichkeit oder Kleinheit aus: **Chwileczkę!** „Einen Moment!“ **Troszkę.** „Ein klein bisschen.“ **Kawka?** „Ein Käffchen?“ Augmentative auf **-isko / -sko** sind derb oder liebevoll: **psisko** „ein großer alter Hund“, **chłopisko**.
  pl-c2-colloquial:
    meaning: "Partikeln und Füllwörter der Umgangssprache"
    intro: |
      Das Alltagspolnisch wird von kleinen Wörtern geprägt, die selten im Lehrbuch stehen:

      - **no** „na, ja, komm schon“: **No, dobra.** „Na gut.“ **No chodź!** „Nun komm!“
      - **weź** (Imperativ von wziąć) als ungeduldiges „ach komm“: **Weź przestań!** „Ach, hör auf!“
      - **wiesz, wiecie, słuchaj**, um die Aufmerksamkeit zu halten: **Wiesz, co ci powiem?** „Weißt du was?“
      - **ej** „he“, **spoko** „kein Problem, cool“, **dobra** „okay“, **nara** „bis dann“
      - **-ś** wandert gesprochen auf ein früheres Wort: **Gdzieś był?** = **Gdzie byłeś?** „Wo warst du?“
  pl-c2-partitive:
    meaning: "der partitive Genitiv: etwas von"
    intro: |
      Bei perfektiven Verben des Gebens, Nehmens, Kaufens und Eingießens heißt ein **Genitiv**objekt „**etwas** von“: **Nalej mi wody.** „Gieß mir etwas Wasser ein.“ **Kup chleba.** „Kauf etwas Brot.“ **Napijesz się herbaty?** „Trinkst du etwas Tee?“ Der Akkusativ nimmt das **Ganze**: **Kup chleb.** „Kauf das Brot / einen Laib.“ Derselbe Genitiv steht nach Mengenwörtern (**szklanka mleka**) und in **dodać soli** „Salz hinzufügen“.
  pl-c2-polite-commands:
    meaning: "höfliche Aufforderungen: proszę + Infinitiv, niech + 3. Person"
    intro: |
      Zu **pan / pani** vermeidet das Polnische den Imperativ. **Proszę** + **Infinitiv** ist die übliche höfliche Bitte oder Anweisung: **Proszę usiąść.** „Bitte setzen Sie sich.“ **Proszę nie palić.** „Bitte nicht rauchen.“ Der **imperfektive** Infinitiv klingt wie eine herzliche Einladung oder eine Anweisung an alle: **Proszę siadać!** „Setzen Sie sich doch!“ **Proszę wchodzić!** „Kommen Sie herein!“ **Niech** + 3. Person ist eine weitere höfliche Form: **Niech pan wejdzie.** „Kommen Sie herein.“ **Niech pani spojrzy.** „Schauen Sie mal.“
  pl-c2-figurative-motion:
    meaning: "Bewegungsverben in Redewendungen"
    intro: |
      **iść / chodzić** tragen viele abstrakte Bedeutungen: **chodzi o…** „es geht um …“ (**O co chodzi?** „Was ist los?“), **Jak ci idzie?** „Wie läuft’s?“ (Dativ der Person), **idzie mi dobrze** „es läuft gut bei mir“, **wychodzi na to, że…** „es läuft darauf hinaus, dass …“, **nie wyszło** „es hat nicht geklappt“, **wejść w życie** „in Kraft treten“, **dojść do porozumienia** „sich einigen“.
  pl-c2-dative-sie:
    meaning: "unpersönliche się-Verben mit dem Dativ"
    intro: |
      Viele Zustände und Ereignisse werden ohne Subjekt gesagt, die Person im **Dativ**, das Verb in der 3. Person Singular (Vergangenheit im Neutrum) mit **się**: **Chce mi się spać.** „Ich bin müde.“ **Nie chce mi się.** „Ich habe keine Lust.“ **Udało mi się!** „Es ist mir gelungen!“ **Śniło mi się, że…** „Ich habe geträumt, dass …“ **Wydaje mi się, że…** „Mir scheint, dass …“ **Dobrze mi się tu mieszka.** „Ich wohne gern hier.“ Die Stellung **mi się** vor dem Verb ist ebenso häufig.
