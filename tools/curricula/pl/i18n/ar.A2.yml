# Arabic text of the Polish course, A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Past and future: "الماضي والمستقبل"
  More cases and pronouns: "حالات وضمائر أخرى"
  Commands and modal verbs: "الأمر والأفعال الناقصة"
lessons:
  pl-past:
    meaning: "الماضي: -ł- مع لواحق الشخص والجنس"
    intro: |
      المصدر بلا **-ć**، مع **-ł-** ولاحقة تبيّن الشخص **والجنس**: **robiłem** (عملتُ، لرجل)، **robiłam** (لامرأة)، **robiłeś / robiłaś** (عملتَ / عملتِ)، **robił / robiła / robiło** (عمل / عملت / للمحايد)، **robiliśmy / robiłyśmy** (عملنا)، **robili / robiły** (عملوا / عملن). وبعض الجذور يتغير: **mieć → miałem، iść → szedłem / szłam، jeść → jadłem**.
  pl-aspect:
    meaning: "الجهة: غير التامة والتامة"
    intro: |
      تأتي الأفعال أزواجًا: **غير تام** للفعل الجاري أو المتكرر (**pisać**، **robić**، **kupować**)، و**تام** للمنجز (**napisać**، **zrobić**، **kupić**). والتام في صيغة المضارع يعني **المستقبل**: **Napiszę list.** «سأكتب الرسالة». وغير التام يصوغ المستقبل بـ **będę**: **Będę pisać / pisał.** «سأكون أكتب».
  pl-future:
    meaning: "مستقبل الأفعال غير التامة: będę"
    intro: |
      **będę، będziesz، będzie، będziemy، będziecie، będą** + المصدر أو صيغة الماضي: **Będę czytać / czytał.** «سأقرأ». وهو أيضًا مستقبل **być**: **Jutro będę w domu.** «سأكون غدًا في البيت».
  pl-dative:
    meaning: "حالة القابل: لـ، إلى"
    intro: |
      **-owi / -u** (مذكر: **bratu، ojcu، panu، Tomkowi**)، **-e / -i / -y** (مؤنث: **mamie، siostrze**)، **-u** (محايد: **dziecku**)؛ والجمع **-om**. بعد **dać، pomagać، dziękować، podobać się**، و**dzięki** (بفضل)، **przeciw** (ضد)، **ku** (نحو): **Dziękuję panu.** «أشكرك يا سيدي».
  pl-pronouns:
    meaning: "الضمائر الشخصية في الحالات"
    intro: |
      الصيغ القصيرة تأتي بعد الفعل غير منبورة: **Kocham cię.** «أحبك». **Dam ci to.** «سأعطيك إياه». **Znasz go?** «هل تعرفه؟» المفعولية **mnie، cię، go، ją، nas، was، ich / je**؛ والقابل **mi، ci، mu، jej، nam، wam، im**. وبعد حرف الجر **on → n-**: **do niego، z nią، o nich**.
  pl-plural:
    meaning: "الجمع، وصيغة جمع الذكور العقلاء"
    intro: |
      أغلب الأسماء: **-y / -i** (**kot → koty، kobieta → kobiety، noga → nogi**)، و**-e** بعد الصوامت اللينة (**koń → konie، ulica → ulice**)، والمحايد **-a** (**okno → okna**). ولجماعات **الرجال** صيغ خاصة بتليين الصامت: **student → studenci، Polak → Polacy، pan → panowie**. والشاذ: **człowiek → ludzie، dziecko → dzieci، oko → oczy، ręka → ręce**.
  pl-imperative:
    meaning: "الأمر"
    intro: |
      من الغائب الجمع بلا لاحقته: **piszą → pisz! piszcie!**، **czytają → czytaj! czytajcie!**؛ و**-my** تعني *هيا بنا*: **chodźmy!** وبتأدّب: **Proszę usiąść.** «تفضّل بالجلوس». والشائع: **chodź** (تعالَ)، **czekaj** (انتظر)، **słuchaj** (اسمع)، **daj** (أعطِ)، **zobacz** (انظر).
  pl-modals:
    meaning: "الأفعال الناقصة: يجب، يستطيع، يريد"
    intro: |
      **musieć** يجب (**muszę، musisz**)، **móc** يستطيع (**mogę، możesz، może**)، **chcieć** يريد (**chcę، chcesz، chce**)، **umieć** يُحسن (**umiem**)، **woleć** يفضّل (**wolę**) — + المصدر: **Muszę iść.** «يجب أن أذهب». وغير شخصية: **trzeba** (ينبغي)، **można** (يمكن)، **wolno** (يجوز).
  pl-motion:
    meaning: "أفعال الحركة: سيرًا أو ركوبًا، الآن أو عادةً"
    intro: |
      **iść / chodzić** سيرًا، **jechać / jeździć** ركوبًا؛ **iść، jechać** لرحلة واحدة الآن، و**chodzić، jeździć** للعادة: **Idę do sklepu.** «أنا ذاهب إلى المتجر (الآن)». **Chodzę do szkoły.** «أذهب إلى المدرسة (عادةً)». **Jadę autobusem.** «أسافر بالحافلة».
