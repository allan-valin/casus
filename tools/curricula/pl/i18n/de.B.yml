# German text of the Polish course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Conditions and clauses: "Bedingungen und Nebensätze"
  The passive and participles: "Passiv und Partizipien"
  Impersonal constructions: "Unpersönliche Konstruktionen"
  Numerals: "Zahlwörter"
  Polite address and pronouns: "Höfliche Anrede und Pronomen"
lessons:
  pl-conditional:
    meaning: "der Konditional: -by"
    intro: |
      Vergangenheitsform + **-by** + Personalendung: **zrobiłbym** (ich würde machen, Mann), **zrobiłabym** (Frau), **zrobiłbyś, zrobiłby, zrobilibyśmy…** Höfliche Wünsche: **Chciałbym kawę.** „Ich hätte gern einen Kaffee.“ Mit **gdyby** (wenn): **Gdybym miał czas, poszedłbym.** „Wenn ich Zeit hätte, ginge ich.“ **żeby** (damit) nimmt dieselben Formen: **Chcę, żebyś przyszedł.** „Ich will, dass du kommst.“
  pl-relative:
    meaning: "Relativsätze mit który"
    intro: |
      **który / która / które** richtet sich nach seinem Nomen und nimmt den Kasus seiner Rolle im Nebensatz: **człowiek, który tu mieszka** „der Mann, der hier wohnt“, **książka, którą czytam** „das Buch, das ich lese“, **miasto, w którym mieszkam** „die Stadt, in der ich wohne“. Davor steht immer ein Komma.
  pl-conjunctions:
    meaning: "dass, weil, wenn, falls"
    intro: |
      **że** dass, **bo / ponieważ** weil, **kiedy / gdy** wenn / als, **jeśli / jeżeli** falls, **ale** aber, **albo / lub** oder, **i / a** und, **ani** noch, **niż** als, **chociaż** obwohl, **zanim** bevor, **dopóki** solange.
  pl-comparison:
    meaning: "Komparativ -szy / bardziej und Superlativ naj-"
    intro: |
      **-szy / -ejszy**: **nowy → nowszy, ładny → ładniejszy**; lange Adjektive nehmen **bardziej** (mehr): **bardziej interesujący**; Superlativ **naj-**: **najnowszy, najbardziej**. Unregelmäßig: **dobry → lepszy → najlepszy**, **zły → gorszy**, **duży → większy**, **mały → mniejszy**. *Als*: **niż** oder **od** + Genitiv.
  pl-reflexive:
    meaning: "reflexives się"
    intro: |
      **się** gehört zu vielen Verben: **nazywam się** „ich heiße“, **uczę się** „ich lerne“, **boję się** „ich habe Angst“, **śmieję się** „ich lache“, **podoba mi się** „es gefällt mir“. Es bildet auch unpersönliche Sätze: **Tu się nie pali.** „Hier wird nicht geraucht.“
  pl-b2-passive:
    meaning: "das Passiv: zostać / być + -ny, -ty"
    intro: |
      Das Passivpartizip endet auf **-ny / -ony / -ty** und kongruiert wie ein Adjektiv: **zbudowany, zbudowana, zbudowane**; Männerplural **-ni / -eni / -ci** (**zaproszeni** „eingeladen“). Mit **zostać** (perfektiv) beschreibt es ein Ereignis: **Dom został zbudowany w 1900 roku.** „Das Haus wurde 1900 gebaut.“ Mit **być** einen Zustand oder eine wiederholte Handlung: **Sklep jest zamknięty.** „Der Laden ist geschlossen.“ **Dom był budowany przez dwa lata.** „Das Haus wurde zwei Jahre lang gebaut.“ Der Täter folgt mit **przez**: **napisany przez Mickiewicza**.
  pl-b2-active-participle:
    meaning: "das aktive Adjektivpartizip -ący"
    intro: |
      Aus der 3. Person Plural Präsens wird **-ą** zu **-ący, -ąca, -ące**: **czytają → czytający** „lesend, der liest“, **pracują → pracujący**. Es wird wie ein Adjektiv dekliniert und ersetzt einen **który**-Satz, meist schriftlich: **człowiek czytający gazetę** = **człowiek, który czyta gazetę**. Viele sind gewöhnliche Adjektive oder Nomen geworden: **następujący** „folgend“, **wiodący** „führend“, **przewodniczący** „Vorsitzender“.

      Nur imperfektive Verben haben es.
  pl-b2-adverbial-participle:
    meaning: "Adverbialpartizipien: während, nachdem"
    intro: |
      **-ąc** (von imperfektiven Verben) heißt „während“: **Czytając, piła kawę.** „Beim Lesen trank sie Kaffee.“ **-wszy / -łszy** (von perfektiven Verben, buchsprachlich) heißt „nachdem … hatte“: **Przeczytawszy list, wyszedł.** „Nachdem er den Brief gelesen hatte, ging er hinaus.“ Beide sind unveränderlich und müssen das Subjekt des Hauptverbs teilen.
    mistakes: ["Wer hereinkommt, muss das Subjekt des Hauptverbs sein."]
  pl-b2-verbal-nouns:
    meaning: "Verbalnomen auf -nie, -cie"
    intro: |
      Fast jedes Verb bildet ein neutrales Nomen auf **-anie / -enie / -cie** für die Handlung: **czytać → czytanie** „das Lesen“, **pisać → pisanie**, **mówić → mówienie**, **pić → picie** „das Trinken“, **myć → mycie**. Sie behalten den Aspekt (**zrobienie** „das Erledigen“), und **się**-Verben können es behalten (**uczenie się** „das Lernen“). Dekliniert wie **zdanie**: **Lubię czytanie.** **Palenie zabronione.** „Rauchen verboten.“ Im formellen Stil ersetzen sie ganze Sätze: **po zakończeniu pracy** „nach Beendigung der Arbeit“.
  pl-b2-impersonal-no-to:
    meaning: "die unpersönliche Vergangenheit auf -no / -to"
    intro: |
      Eine Form auf **-no / -to**, gebildet wie das Passivpartizip, sagt, dass etwas **getan wurde**, ohne den Täter zu nennen: **Zbudowano nowy most.** „Man baute eine neue Brücke.“ **Powiedziano mi, że…** „Mir wurde gesagt, dass …“ **Ukradziono mi rower.** „Mir wurde das Fahrrad gestohlen.“ Das Objekt bleibt im **Akkusativ** (oder Genitiv nach **nie**), es ist also kein Passiv: **Zaproszono nas.** „Man hat uns eingeladen.“ Häufig in Nachrichten und Berichten.
  pl-b2-predicatives:
    meaning: "unpersönliche Wörter der Möglichkeit und Notwendigkeit"
    intro: |
      Diese Wörter haben kein Subjekt und nehmen einen Infinitiv; die Person steht, falls genannt, im **Dativ**: **można** „man kann, es ist erlaubt“, **trzeba** „man muss“, **warto** „es lohnt sich“, **wolno** „es ist gestattet“ (**Nie wolno tu palić.**), **należy** „man sollte“ (formell), **widać / słychać** „man sieht / hört“. Vergangenheit und Futur mit **było / będzie**: **Trzeba było przyjść wcześniej.** „Du hättest früher kommen sollen.“
  pl-b2-five-and-up:
    meaning: "ab fünf: Genitiv Plural und Verb im Neutrum"
    intro: |
      Nach **pięć** und mehr (und **kilka, wiele, dużo, mało, parę**) steht das Nomen im **Genitiv Plural** und das Verb in der **3. Person Singular Neutrum**: **Pięć kotów spało.** „Fünf Katzen schliefen.“ **Przyszło dziesięć osób.** „Zehn Leute kamen.“ **Mam kilka pytań.** „Ich habe einige Fragen.“ Nach **dwa, trzy, cztery** steht das Nomen im Nominativ Plural und das Verb kongruiert normal: **Dwa koty spały.**
  pl-b2-men-numerals:
    meaning: "Zahlwörter bei Gruppen von Männern"
    intro: |
      Männliche Personennomen (Männer oder gemischte Gruppen im maskulinen Plural) haben eigene Zahlwörter: **dwaj, trzej, czterej** + Nominativ (**dwaj bracia**), oder häufiger **dwóch, trzech, czterech, pięciu, sześciu…** + **Genitiv** mit Verb im Neutrum Singular: **Dwóch studentów przyszło.** „Zwei Studenten kamen.“ **Pięciu mężczyzn czekało.** **obaj / obu** „beide (Männer)“. **kilku, wielu** folgen demselben Muster: **kilku kolegów**.
  pl-b2-collective:
    meaning: "Sammelzahlwörter: dwoje, troje, oboje"
    intro: |
      **dwoje, troje, czworo, pięcioro…** zählen **gemischte Gruppen** (Mann und Frau), **Kinder und Jungtiere** (**dwoje dzieci**, **troje kociąt**) und Pluraliatantum für Personen und Dinge (**dwoje drzwi** „zwei Türen“). Sie nehmen den **Genitiv Plural** und ein Verb im Neutrum Singular: **Mają troje dzieci.** „Sie haben drei Kinder.“ **oboje** „beide (Mann und Frau)“: **Oboje są lekarzami.** „Beide sind Ärzte.“ Oblique Formen: **dwojga, obojga, dwojgiem**.
  pl-b2-pan-pani:
    meaning: "formelle Anrede: pan, pani, państwo"
    intro: |
      Polnisch hat kein höfliches „Sie“-Pronomen: Fremde redet man in der **3. Person** an mit **pan** (Mann), **pani** (Frau), **państwo** (Paar oder gemischte Gruppe, mit Verb im Plural), **panowie, panie**: **Czy pan mówi po angielsku?** „Sprechen Sie Englisch?“ **Co państwo zamawiają?** „Was möchten Sie bestellen?“ Sie werden dekliniert: **Proszę pana!** „Entschuldigen Sie!“, **Dziękuję pani.** „Danke schön (zu einer Frau).“ Gesprochen bleibt die Anrede oft nur im Verb: **Czy może pan…?** „Könnten Sie …?“
  pl-b2-indefinites:
    meaning: "Indefinitpronomen: -ś, -kolwiek, byle"
    intro: |
      **-ś** bildet „irgend-“: **ktoś** jemand, **coś** etwas, **gdzieś** irgendwo, **kiedyś** einst / irgendwann, **jakiś** irgendein. **-kolwiek** bildet „-auch immer“: **ktokolwiek** wer auch immer, **cokolwiek** was auch immer, **gdziekolwiek** wo auch immer. **byle** „egal welcher“ ist abwertend: **byle co** „irgendwas“, **byle jak** „schlampig“. **Ktoś dzwonił.** „Jemand hat angerufen.“ **Zrób cokolwiek!** „Tu irgendwas!“
