id: C2
topics:

- title: {en: Careful written Polish, pt: Polonês escrito cuidado}
  lessons:
  - id: pl-c2-short-adjectives
    title: "jestem pewien, gotów, winien"
    meaning: {en: "short adjective forms", pt: "formas curtas dos adjetivos"}
    intro:
      en: |
        A handful of adjectives keep an old **short masculine form**, used after **być** and in set phrases: **pewien** (pewny) "sure", **gotów** (gotowy) "ready", **winien** (winny) "guilty, owing", **pełen** (pełny) "full of" (+ gen.: **pełen ludzi**), **godzien** (godny) "worthy", **ciekaw** (ciekawy) "curious", **świadom** (świadomy) "aware", **zdrów** (zdrowy) "healthy", **rad** "glad" (only short). **Jestem pewien, że przyjdzie.** "I'm sure he'll come." **Nie jestem ciekaw.** "I'm not curious." Feminine and plural use the long forms: **Jestem pewna.**
      pt: |
        Alguns adjetivos conservam uma antiga **forma curta masculina**, usada depois de **być** e em expressões fixas: **pewien** (pewny) "seguro", **gotów** (gotowy) "pronto", **winien** (winny) "culpado, devedor", **pełen** (pełny) "cheio de" (+ gen.: **pełen ludzi**), **godzien** (godny) "digno", **ciekaw** (ciekawy) "curioso", **świadom** (świadomy) "ciente", **zdrów** (zdrowy) "saudável", **rad** "contente" (só curta). **Jestem pewien, że przyjdzie.** "Tenho certeza de que ele vem." **Nie jestem ciekaw.** "Não estou curioso." O feminino e o plural usam as formas longas: **Jestem pewna.**
    examples:
    - ["Jestem pewien, że przyjdzie.", "I'm sure he'll come.", "Tenho certeza de que ele vem.", "pewien"]
    - ["Jesteś gotów?", "Are you ready?", "Você está pronto?", "gotów"]
    - ["Pokój był pełen ludzi.", "The room was full of people.", "A sala estava cheia de gente.", "pełen"]
    match: {seq: [{word: [jestem, jesteś, jest, był, byłem, byłeś, będzie, będę, nie]}, {word: [pewien, gotów, winien, pełen, godzien, ciekaw, świadom, zdrów, rad]}], near: 2, gap: 1}
    pool: [pewien, gotów, winien, pełen, ciekaw, świadom, pewny, gotowy, pełny]

  - id: pl-c2-aby-jakby
    title: "aby, jakby, choćby"
    meaning: {en: "-by conjunctions: purpose, as if, even if", pt: "conjunções com -by: finalidade, como se, ainda que"}
    intro:
      en: |
        Several conjunctions carry the conditional **-by** and take the person ending themselves, with the verb in the past form:

        - **aby / żeby / by** "so that, in order to": **Przyszedłem, abyś mi pomógł.** "I came so that you'd help me." (**aby** is more formal than **żeby**)
        - **jakby** "as if": **Wygląda, jakby był chory.** "He looks as if he were ill."
        - **choćby / chociażby** "even if, at least": **Choćbyś płakał, nie pojedziesz.** "Even if you cry, you're not going." **Zadzwoń choćby raz.** "Call at least once."
      pt: |
        Várias conjunções levam o condicional **-by** e recebem elas mesmas a terminação de pessoa, com o verbo na forma do passado:

        - **aby / żeby / by** "para que, a fim de": **Przyszedłem, abyś mi pomógł.** "Vim para que você me ajudasse." (**aby** é mais formal que **żeby**)
        - **jakby** "como se": **Wygląda, jakby był chory.** "Ele parece estar doente."
        - **choćby / chociażby** "ainda que, pelo menos": **Choćbyś płakał, nie pojedziesz.** "Mesmo que você chore, não vai." **Zadzwoń choćby raz.** "Ligue pelo menos uma vez."
    examples:
    - ["Przyszedłem, abyś mi pomógł.", "I came so that you'd help me.", "Vim para que você me ajudasse.", "abyś"]
    - ["Wygląda, jakby był chory.", "He looks as if he were ill.", "Ele parece estar doente.", "jakby"]
    - ["Zadzwoń choćby raz.", "Call at least once.", "Ligue pelo menos uma vez.", "choćby"]
    match: {seq: [{word: [aby, abym, abyś, abyśmy, abyście, jakby, jakbym, jakbyś, jakbyśmy, jakbyście, choćby, choćbyś, chociażby]}], gap: 0}
    pool: [aby, abym, abyś, jakby, jakbym, choćby, gdyby, żeby]

  - id: pl-c2-ze-particle
    title: "cóż, któż, jakże, chodźże"
    meaning: {en: "emphatic -że and rhetorical questions", pt: "o -że enfático e as perguntas retóricas"}
    intro:
      en: |
        **-że / -ż** added to a question word or an imperative adds emphasis, impatience or a rhetorical tone: **Cóż mogę zrobić?** "Well, what can I do?" **Któż to wie?** "Who knows?" **Jakże się cieszę!** "How glad I am!" **Chodźże już!** "Come on, then!" **cóż** alone means "well, oh well": **Cóż, trudno.** "Oh well, never mind." These forms sound literary or a bit old-fashioned, except **cóż**, which is common.
      pt: |
        **-że / -ż** acrescentado a uma palavra interrogativa ou a um imperativo dá ênfase, impaciência ou tom retórico: **Cóż mogę zrobić?** "Pois é, o que eu posso fazer?" **Któż to wie?** "Quem sabe?" **Jakże się cieszę!** "Como estou feliz!" **Chodźże już!** "Vem logo, anda!" **cóż** sozinho quer dizer "pois é, enfim": **Cóż, trudno.** "Enfim, paciência." Essas formas soam literárias ou um pouco antiquadas, menos **cóż**, que é comum.
    examples:
    - ["Cóż mogę zrobić?", "Well, what can I do?", "Pois é, o que eu posso fazer?", "Cóż"]
    - ["Któż to wie?", "Who knows?", "Quem sabe?", "Któż"]
    - ["Jakże się cieszę!", "How glad I am!", "Como estou feliz!", "Jakże"]
    match: {seq: [{word: [cóż, któż, gdzież, jakże, czemuż, czyż, dlaczegóż, kiedyż, chodźże, mówże, słuchajże, patrzże]}], gap: 0}
    pool: [cóż, któż, jakże, czyż, gdzież, co, kto, jak]

  - id: pl-c2-nie-spelling
    title: "niezamknięty, nie wiem"
    meaning: {en: "writing nie together or apart", pt: "escrever nie junto ou separado"}
    intro:
      en: |
        Polish spelling joins or separates **nie** by part of speech: **apart** from verbs (**nie wiem**, **nie ma**), **together** with adjectives, adverbs from adjectives and adjectival participles (**niedobry**, **niedobrze**, **niezamknięty**, **niepalący** "non-smoking"), and with nouns (**nieporozumienie** "misunderstanding"). It is written apart when there is an explicit contrast (**nie dobry, lecz zły**) and before numerals and comparatives (**nie lepszy**). Since 2024 the official rule allows **nie** together with all adjectival participles.
      pt: |
        A ortografia polonesa junta ou separa **nie** conforme a classe da palavra: **separado** dos verbos (**nie wiem**, **nie ma**), **junto** dos adjetivos, dos advérbios derivados de adjetivos e dos particípios adjetivais (**niedobry**, **niedobrze**, **niezamknięty**, **niepalący** "não fumante"), e dos substantivos (**nieporozumienie** "mal-entendido"). Escreve-se separado quando há contraste explícito (**nie dobry, lecz zły**) e antes de numerais e comparativos (**nie lepszy**). Desde 2024 a norma oficial permite **nie** junto de todos os particípios adjetivais.
    examples:
    - ["To było nieporozumienie.", "It was a misunderstanding.", "Foi um mal-entendido.", "nieporozumienie"]
    - ["Drzwi były niezamknięte.", "The door was unlocked.", "A porta estava destrancada.", "niezamknięte"]
    - ["To jest niemożliwe.", "That's impossible.", "Isso é impossível.", "niemożliwe"]
    match: {seq: [{re: "^(?!(?:niemieckiego|niebieskiego|niedźwiedź|niektórych|niemieckie|niebieskie|niebieski|niedziela|niektórzy|niemiecki|niedzielę|niedzieli|niemiecka|niebieska|niektóre|niemiec|niebem|niebie|niemcy|nieba|niebo|nieco)$)[\\s\\S]*?(?:^nie[a-ząęółśżźćń]{3,})", pos: [adj, noun, adv]}], same: [case, number]}

- title: {en: Expressive Polish, pt: Polonês expressivo}
  lessons:
  - id: pl-c2-diminutives
    title: "chwileczkę, troszkę, domek"
    meaning: {en: "diminutives and endearment", pt: "diminutivos e carinho"}
    intro:
      en: |
        Diminutives are everywhere in spoken Polish: **-ek / -ka / -ko** (**domek, chwilka, piwko**), double **-eczek / -eczka / -eczko** (**chwileczka, domeczek**), and on adjectives **-utki / -uteńki / -usieńki** (**malutki, malusieńki** "teeny"). They express affection, politeness or smallness: **Chwileczkę!** "Just a moment!" **Troszkę.** "A tiny bit." **Kawka?** "A coffee?" Augmentatives in **-isko / -sko** are rough or affectionate: **psisko** "a big old dog", **chłopisko**.
      pt: |
        Os diminutivos estão por toda parte no polonês falado: **-ek / -ka / -ko** (**domek, chwilka, piwko**), duplos **-eczek / -eczka / -eczko** (**chwileczka, domeczek**), e nos adjetivos **-utki / -uteńki / -usieńki** (**malutki, malusieńki** "pequenininho"). Exprimem carinho, cortesia ou pequenez: **Chwileczkę!** "Só um minutinho!" **Troszkę.** "Um pouquinho." **Kawka?** "Um cafezinho?" Os aumentativos em **-isko / -sko** são rudes ou carinhosos: **psisko** "um cachorrão", **chłopisko**.
    examples:
    - ["Chwileczkę, proszę.", "Just a moment, please.", "Só um minutinho, por favor.", "Chwileczkę"]
    - ["Mówię troszkę po polsku.", "I speak a tiny bit of Polish.", "Falo um pouquinho de polonês.", "troszkę"]
    - ["Mieszkają w małym domku.", "They live in a little house.", "Eles moram numa casinha.", "domku"]
    match: {seq: [{word: [chwileczkę, chwilkę, chwilka, troszkę, troszeczkę, domek, domku, domeczek, kotek, kotka, piesek, pieska, kawka, kawkę, piwko, malutki, malutka, malutkie, maleńki, maleńka, mamusia, mamusiu, tatuś, tatusiu, babcia, babciu, dziadek, dziadku, synek, córeczka, rączka, buzia]}], gap: 0}
    pool: [chwileczkę, chwilkę, troszkę, domek, kotek, malutki, chwilę, trochę, dom]

  - id: pl-c2-colloquial
    title: "weź, no, wiesz, spoko"
    meaning: {en: "particles and fillers of colloquial speech", pt: "partículas e muletas da fala coloquial"}
    intro:
      en: |
        Everyday Polish is shaped by small words that rarely appear in textbooks:

        - **no** "well, yeah, come on": **No, dobra.** "Well, OK." **No chodź!** "Come on!"
        - **weź** (imperative of wziąć) as an impatient "come on": **Weź przestań!** "Oh, stop it!"
        - **wiesz, wiecie, słuchaj** to hold attention: **Wiesz, co ci powiem?** "You know what?"
        - **ej** "hey", **spoko** "no worries, cool", **dobra** "OK", **nara** "see ya"
        - **-ś** moved to an earlier word in speech: **Gdzieś był?** = **Gdzie byłeś?** "Where were you?"
      pt: |
        O polonês do dia a dia é moldado por palavrinhas que quase não aparecem nos livros:

        - **no** "bom, é, vamos": **No, dobra.** "Bom, tá." **No chodź!** "Anda, vem!"
        - **weź** (imperativo de wziąć) como um "ah, para" impaciente: **Weź przestań!** "Ah, para com isso!"
        - **wiesz, wiecie, słuchaj** para prender a atenção: **Wiesz, co ci powiem?** "Sabe o que eu vou te dizer?"
        - **ej** "ei", **spoko** "de boa, tranquilo", **dobra** "tá bom", **nara** "falou"
        - **-ś** passado para uma palavra anterior na fala: **Gdzieś był?** = **Gdzie byłeś?** "Onde você estava?"
    examples:
    - ["No, dobra.", "Well, OK.", "Bom, tá.", "No"]
    - ["Weź przestań!", "Oh, stop it!", "Ah, para com isso!", "Weź"]
    - ["Wiesz, co ci powiem?", "You know what?", "Sabe o que eu vou te dizer?", "Wiesz"]
    match:
    - {seq: [{word: ["no", weź, ej, spoko, nara, słuchaj]}], gap: 0}
    - {seq: [{word: [wiesz, wiecie], trail: ",?"}], gap: 0}
    pool: ["no", weź, wiesz, słuchaj, ej, spoko, dobra, tak]

- title: {en: Idiomatic syntax, pt: Sintaxe idiomática}
  lessons:
  - id: pl-c2-partitive
    title: "Nalej mi wody, kup chleba"
    meaning: {en: "the partitive genitive: some of", pt: "o genitivo partitivo: um pouco de"}
    intro:
      en: |
        With perfective verbs of giving, taking, buying and pouring, a **genitive** object means "**some** of": **Nalej mi wody.** "Pour me some water." **Kup chleba.** "Buy some bread." **Napijesz się herbaty?** "Will you have some tea?" The accusative takes the **whole** thing: **Kup chleb.** "Buy the bread / a loaf." The same genitive appears after quantity words (**szklanka mleka**) and in **dodać soli** "add salt".
      pt: |
        Com verbos perfectivos de dar, pegar, comprar e servir, o objeto no **genitivo** quer dizer "**um pouco** de": **Nalej mi wody.** "Me serve um pouco de água." **Kup chleba.** "Compre pão." **Napijesz się herbaty?** "Aceita um chá?" O acusativo pega a coisa **inteira**: **Kup chleb.** "Compre o pão / um pão." O mesmo genitivo aparece depois de palavras de quantidade (**szklanka mleka** "um copo de leite") e em **dodać soli** "acrescentar sal".
    examples:
    - ["Nalej mi wody.", "Pour me some water.", "Me serve um pouco de água.", "wody"]
    - ["Napijesz się herbaty?", "Will you have some tea?", "Aceita um chá?", "herbaty"]
    - ["Daj mi trochę czasu.", "Give me some time.", "Me dá um pouco de tempo.", "czasu"]
    match: {seq: [{word: [daj, dać, dajcie, kup, kupić, kupię, kupiłem, nalej, nalać, naleję, napij, napić, napiję, napijesz, dolej, przynieś, przynieść, dodaj, dodać, ukrój, nabrać]}, {pos: noun, case: gen}], near: 3, gap: 1, same: [number]}

  - id: pl-c2-polite-commands
    title: "Proszę siadać! Niech pan wejdzie."
    meaning: {en: "polite commands: proszę + infinitive, niech + 3rd person", pt: "ordens corteses: proszę + infinitivo, niech + 3ª pessoa"}
    intro:
      en: |
        Speaking to **pan / pani**, Polish avoids the imperative. **Proszę** + **infinitive** is the usual polite request or instruction: **Proszę usiąść.** "Please sit down." **Proszę nie palić.** "Please don't smoke." The **imperfective** infinitive sounds like a warm invitation or an instruction to everyone: **Proszę siadać!** "Do sit down!" **Proszę wchodzić!** "Come in, please!" **Niech** + 3rd person is another polite form: **Niech pan wejdzie.** "Come in, sir." **Niech pani spojrzy.** "Have a look, madam."
      pt: |
        Falando com **pan / pani**, o polonês evita o imperativo. **Proszę** + **infinitivo** é o pedido ou a instrução cortês comum: **Proszę usiąść.** "Sente-se, por favor." **Proszę nie palić.** "Favor não fumar." O infinitivo **imperfectivo** soa como convite caloroso ou instrução para todos: **Proszę siadać!** "Sentem-se, por favor!" **Proszę wchodzić!** "Entrem, por favor!" **Niech** + 3ª pessoa é outra forma cortês: **Niech pan wejdzie.** "Entre, senhor." **Niech pani spojrzy.** "Dê uma olhada, senhora."
    examples:
    - ["Proszę usiąść.", "Please sit down.", "Sente-se, por favor.", "usiąść"]
    - ["Proszę nie palić.", "Please don't smoke.", "Favor não fumar.", "palić"]
    - ["Niech pan wejdzie.", "Come in, sir.", "Entre, senhor.", "wejdzie"]
    match:
    - {seq: [{word: [proszę], start: true}, {pos: verb, mood: inf}], near: 1, gap: 1}
    - {seq: [{word: [niech]}, {word: [pan, pani, państwo]}, {pos: verb}], gap: 2}

  - id: pl-c2-figurative-motion
    title: "chodzi o, jak ci idzie?"
    meaning: {en: "verbs of motion in idioms", pt: "verbos de movimento em expressões"}
    intro:
      en: |
        **iść / chodzić** carry many abstract meanings: **chodzi o…** "it's about…" (**O co chodzi?** "What's the matter?"), **Jak ci idzie?** "How's it going?" (dative of the person), **idzie mi dobrze** "it's going well for me", **wychodzi na to, że…** "it turns out that…", **nie wyszło** "it didn't work out", **wejść w życie** "come into force", **dojść do porozumienia** "reach an agreement".
      pt: |
        **iść / chodzić** têm muitos sentidos abstratos: **chodzi o…** "trata-se de…" (**O co chodzi?** "Qual é o problema?"), **Jak ci idzie?** "Como vão as coisas?" (dativo da pessoa), **idzie mi dobrze** "está indo bem para mim", **wychodzi na to, że…** "parece que…", **nie wyszło** "não deu certo", **wejść w życie** "entrar em vigor", **dojść do porozumienia** "chegar a um acordo".
    examples:
    - ["O co chodzi?", "What's the matter?", "Qual é o problema?", "chodzi"]
    - ["Jak ci idzie?", "How's it going?", "Como vão as coisas?", "idzie"]
    - ["Wychodzi na to, że miałeś rację.", "It turns out you were right.", "Parece que você tinha razão.", "Wychodzi"]
    match:
    - {seq: [{word: [chodzi, chodziło, chodzić, idzie, szło, poszło]}, {word: [o, mi, ci, mu, jej, nam, wam, im]}], gap: 0}
    - {seq: [{word: [o]}, {word: [co]}, {word: [chodzi, chodziło]}], gap: 2}
    - {seq: [{word: [wychodzi, wyszło]}, {word: [na]}, {word: [to]}], gap: 0}
    pool: [chodzi, idzie, szło, poszło, wychodzi, jedzie, jest]

  - id: pl-c2-dative-sie
    title: "chce mi się, udało mi się"
    meaning: {en: "impersonal się-verbs with the dative", pt: "verbos impessoais com się e o dativo"}
    intro:
      en: |
        Many states and events are said without a subject, the person in the **dative**, the verb in the 3rd person singular (neuter in the past) with **się**: **Chce mi się spać.** "I feel sleepy." **Nie chce mi się.** "I can't be bothered." **Udało mi się!** "I managed it!" **Śniło mi się, że…** "I dreamt that…" **Wydaje mi się, że…** "It seems to me that…" **Dobrze mi się tu mieszka.** "I like living here." The word order **mi się** before the verb is just as common.
      pt: |
        Muitos estados e acontecimentos se dizem sem sujeito, com a pessoa no **dativo** e o verbo na 3ª pessoa do singular (neutro no passado) com **się**: **Chce mi się spać.** "Estou com sono." **Nie chce mi się.** "Não estou a fim." **Udało mi się!** "Consegui!" **Śniło mi się, że…** "Sonhei que…" **Wydaje mi się, że…** "Me parece que…" **Dobrze mi się tu mieszka.** "Gosto de morar aqui." A ordem **mi się** antes do verbo é igualmente comum.
    examples:
    - ["Chce mi się spać.", "I feel sleepy.", "Estou com sono.", "Chce"]
    - ["Udało mi się!", "I managed it!", "Consegui!", "Udało"]
    - ["Wydaje mi się, że pada.", "It seems to me it's raining.", "Me parece que está chovendo.", "Wydaje"]
    match:
    - {seq: [{word: [chce, chciało, udało, udaje, uda, śniło, śni, wydaje, wydawało, zdaje, zdawało, nudzi, nudziło]}, {word: [mi, ci, mu, jej, nam, wam, im]}, {word: [się]}], gap: 0}
    - {seq: [{word: [mi, ci, mu, jej, nam, wam, im]}, {word: [się]}, {word: [chce, chciało, udało, udaje, uda, śniło, śni, wydaje, wydawało, zdaje, zdawało]}], gap: 2}
    pool: [chce, udało, śniło, wydaje, zdaje, podoba, chciało]
