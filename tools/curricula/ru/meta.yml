# Russian Learn lessons, written for Casus (2026-10-19). Open courses were searched: Mezhdu nami (the main open
# Russian textbook) is CC BY-NC-ND 3.0, its workbooks BY-NC-ND 4.0 and the MSU supplement BY-NC-SA; Wikibooks' Russian
# is about twenty uneven pages. So the lessons follow the usual first- and second-year order (as in Mezhdu nami,
# Golosa, Start) and the facts follow Wikipedia's Russian grammar (CC BY-SA). Tables are generated from Casus's
# Wiktionary paradigms with their stress marks (tools/learn_tables.py). Exercises: Tatoeba's Russian sentences.
