  - id: ru-c2-impersonal-verbs
    title: "темнеет, мне не спится, его ранило"
    meaning: {en: "impersonal verbs and the elemental construction", pt: "verbos impessoais e a construção dos elementos"}
    intro:
      en: |
        Some verbs have no subject at all:

        - nature: **темнеет** "it's getting dark", **светает** "dawn is breaking", **морозит**
        - states, with the person in the accusative: **меня тошнит** "I feel sick", **его знобит** "he's shivery"
        - dative + **-ся**, an urge or ability that "happens" to someone: **мне не спится** "I can't sleep", **ему не работается** "he can't get down to work"
        - the "elemental" construction, with the force in the instrumental: **Лодку унесло ветром.** "The boat was carried off by the wind." **Его ранило.** "He was wounded."
        - luck: **ему везёт / повезло** "he's lucky / was lucky"
      pt: |
        Alguns verbos não têm sujeito nenhum:

        - natureza: **темнеет** "está escurecendo", **светает** "está amanhecendo", **морозит**
        - estados, com a pessoa no acusativo: **меня тошнит** "estou enjoado", **его знобит** "ele está com calafrios"
        - dativo + **-ся**, uma vontade ou capacidade que "acontece" com alguém: **мне не спится** "não consigo dormir", **ему не работается** "ele não consegue se pôr a trabalhar"
        - a construção "dos elementos", com a força no instrumental: **Лодку унесло ветром.** "O barco foi levado pelo vento." **Его ранило.** "Ele foi ferido."
        - sorte: **ему везёт / повезло** "ele tem sorte / teve sorte"
    examples:
    - ["Зимой рано темнеет.", "In winter it gets dark early.", "No inverno escurece cedo.", "темнеет"]
    - ["Мне не спится.", "I can't sleep.", "Não consigo dormir.", "спится"]
    - ["Тебе повезло.", "You were lucky.", "Você teve sorte.", "повезло"]
    - ["Лодку унесло ветром.", "The boat was carried off by the wind.", "O barco foi levado pelo vento.", "унесло"]
