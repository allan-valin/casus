  - id: ru-c2-imperative-politeness
    title: "Садитесь! – Сядьте!"
    meaning: {en: "aspect in commands: invitation or order", pt: "o aspecto nas ordens: convite ou ordem"}
    intro:
      en: |
        In positive commands the **perfective** is the neutral request for one action: **Сядьте.** "Sit down." **Закройте дверь.** The **imperfective** is what a host uses — an invitation to do what is expected: **Садитесь, пожалуйста!** "Do sit down!" **Проходите, раздевайтесь.** "Come in, take your coat off." **Угощайтесь!** "Help yourself!"

        The imperfective can also urge someone to get on with a thing already agreed: **Ну, рассказывайте!** "Well, go on, tell us!" A perfective said to a guest may sound like an order.
      pt: |
        Nas ordens afirmativas, o **perfectivo** é o pedido neutro para uma ação: **Сядьте.** "Sente-se." **Закройте дверь.** O **imperfectivo** é o que o anfitrião usa — um convite a fazer o esperado: **Садитесь, пожалуйста!** "Sente-se, por favor!" **Проходите, раздевайтесь.** "Entre, tire o casaco." **Угощайтесь!** "Sirva-se!"

        O imperfectivo também pode apressar alguém a fazer o que já foi combinado: **Ну, рассказывайте!** "Então, conte logo!" Um perfectivo dito a uma visita pode soar como ordem.
    examples:
    - ["Садитесь, пожалуйста.", "Do sit down, please.", "Sente-se, por favor.", "Садитесь"]
    - ["Проходите, раздевайтесь.", "Come in, take your coat off.", "Entre, tire o casaco.", "Проходите"]
    - ["Угощайтесь!", "Help yourself!", "Sirva-se!", "Угощайтесь"]
