# Arabic text of the Russian course, A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The other cases: "بقية الحالات"
  Past and future: "الماضي والمستقبل"
  Adjectives, -ся verbs, commands, comparison: "الصفات وأفعال -ся والأمر والتفضيل"
lessons:
  ru-genitive:
    meaning: "حالة الإضافة: من، لا يوجد، الملكية"
    intro: |
      حالة الإضافة تعني *لـ / من* (**книга брата** «كتاب الأخ»، كالإضافة العربية) وتأتي بعد **нет** «لا يوجد» (**нет времени** «لا وقت»)، والكميات (**много людей**)، والأعداد من اثنين فصاعدًا، وكثير من حروف الجر: **у** (عند — **у меня есть** «عندي»، حرفيًا «عندي يوجد»)، **из** (من داخل)، **от** (من)، **до** (حتى)، **без** (بدون)، **для** (لأجل)، **после** (بعد)، **около** (قرب).

      اللواحق في المفرد: المذكر والمحايد **-а / -я** (**стола، окна**)، والمؤنث **-ы / -и** (**мамы، недели**).
    mistakes: ["нет تطلب حالة الإضافة."]
  ru-dative:
    meaning: "حالة القابلية: إلى، لـ؛ يعجبني؛ العمر"
    intro: |
      حالة القابلية هي المفعول غير المباشر: **Я дал книгу брату.** «أعطيت الكتاب لأخي». وتأتي بعد **к** (نحو) و**по** (على طول، عبر): **к другу**، **по улице**، **по телефону**. و*يعجبني* تُقال كما في العربية «يعجبني»: **Мне нравится музыка.** وتعبّر القابلية أيضًا عن العمر (**Мне двадцать лет**)، والحاجة (**Мне нужно** «يلزمني»)، والمشاعر (**Мне холодно** «أشعر بالبرد»).

      اللواحق في المفرد: المذكر والمحايد **-у / -ю** (**брату، морю**)، والمؤنث **-е / -и** (**маме، тетради**).
    mistakes: ["المُعجَب في حالة القابلية، والمُعجِب فاعل."]
  ru-instrumental:
    meaning: "حالة الآلة: بـ، مع؛ الصيرورة"
    intro: |
      حالة الآلة تدل على الوسيلة (**писать ручкой** «يكتب بالقلم») وتأتي بعد **с** (مع: **кофе с молоком**)، **за** (خلف)، **под** (تحت)، **над** (فوق)، **перед** (أمام)، **между** (بين). وتُستعمل أيضًا لما يكونه المرء أو يصيره أو يعمل به: **Он хочет стать врачом.** «يريد أن يصبح طبيبًا». **Он работает учителем.** «يعمل معلمًا».

      اللواحق: المذكر والمحايد **-ом / -ем**، والمؤنث **-ой / -ей**؛ والجمع **-ами / -ями**.
    mistakes: ["с (مع) تطلب حالة الآلة."]
  ru-past:
    meaning: "الماضي: المطابقة في الجنس"
    intro: |
      الماضي سهل الصياغة ويطابق الفاعل في **الجنس والعدد** لا الشخص: احذف **-ть** وأضف **-л، -ла، -ло، -ли**: **читать → он читал، она читала، они читали**. ولـ **быть** «كان» ماضٍ: **был، была، было، были** — **Я был дома** (رجل)، **Я была дома** (امرأة).
    mistakes: ["المتكلمة امرأة: -ла المؤنثة."]
  ru-future:
    meaning: "المستقبل: буду + المصدر، أو فعل تام"
    intro: |
      مستقبلان حسب الجهة: الأفعال **الناقصة** تستعمل **буду، будешь، будет…** + المصدر (**Я буду читать** «سأقرأ / سأكون أقرأ»)؛ والأفعال **التامة** تأخذ لواحق المضارع ببساطة فتدل على المستقبل (**Я прочитаю** «سأقرؤه (إلى آخره)»).
    mistakes: ["буду مع مصادر الأفعال الناقصة فقط."]
  ru-aspect:
    meaning: "الجهة: الناقص والتام"
    intro: |
      لكل فعل تقريبًا شريكان: **الناقص** (العملية، التكرار، الحدث عمومًا) و**التام** (حدث واحد منجز، نتيجة). **Я читал книгу** «كنت أقرأ الكتاب»؛ **Я прочитал книгу** «قرأتُ الكتاب (حتى نهايته)». وتُصاغ الأفعال التامة غالبًا بسابقة (**делать / сделать**، **писать / написать**) أو بتغيير اللاحقة (**решать / решить**، **давать / дать**).

      لا مضارع للأفعال التامة: صيغ مضارعها تعني المستقبل.
  ru-motion:
    meaning: "أفعال الحركة: في اتجاه واحد أو ذهابًا وإيابًا"
    intro: |
      أفعال الحركة تأتي أزواجًا: **идти** «يذهب (ماشيًا) في اتجاه واحد، الآن» مقابل **ходить** «يذهب بانتظام، ذهابًا وإيابًا، عمومًا»؛ **ехать / ездить** «يذهب بوسيلة نقل». **Я иду в школу** «أنا في طريقي إلى المدرسة»؛ **Я хожу в школу** «أذهب إلى المدرسة (كل يوم)». وكذلك **бежать / бегать** (يجري)، **лететь / летать** (يطير)، **нести / носить** (يحمل).
  ru-adjectives:
    meaning: "الصفات وحالاتها"
    intro: |
      الصفات تطابق موصوفها في الجنس والعدد والحالة: **новый дом**، **новая книга**، **новое окно**، **новые книги**؛ **в новом доме**، **с новой книгой**. وبعد **г к х ж ш щ ч** تُطبَّق قواعد الإملاء (**русский**، **хороший**). والصفات الليّنة تنتهي بـ **-ний**: **синий، синяя، синее، синие** (أزرق داكن).
  ru-reflexive:
    meaning: "الأفعال المنتهية بـ -ся"
    intro: |
      **-ся** (بعد الصائت **-сь**) تجعل الفعل انعكاسيًا أو لازمًا، كصيغة «افتعل/انفعل» أحيانًا: **мыть** «يغسل» → **мыться** «يغتسل»؛ **начинать** «يبدأ (شيئًا)» → **начинаться** «يبتدئ». وكثير من الأفعال الشائعة تلازمها: **нравиться** (يُعجِب)، **смеяться** (يضحك)، **учиться** (يتعلّم)، **надеяться** (يأمل)، **бояться** (يخاف).
  ru-imperative:
    meaning: "الأمر"
    intro: |
      من جذر المضارع: بعد الصائت **-й** (**читать → читай، читайте**)، وإلا **-и** (**говорить → говори، говорите**؛ **писать → пиши**) أو **-ь** حين يقع النبر على الجذر (**встать → встань**). و**-те** تجعله جمعًا أو للاحترام. والطلبات تستعمل الناقص عادة (**Садитесь!** «تفضّلوا بالجلوس!»)؛ والنهي كذلك (**Не говори!**).
  ru-comparison:
    meaning: "التفضيل"
    intro: |
      صيغة التفضيل القصيرة تنتهي بـ **-ее** (**интересный → интереснее**، **быстрый → быстрее**)، أو بـ **-е** مع تغيّر الساكن في كثير من الصفات الشائعة: **большой → больше**، **маленький → меньше**، **хороший → лучше**، **плохой → хуже**، **дорогой → дороже**. و*من* هي **чем** أو حالة الإضافة: **Он старше меня / чем я.** والتفضيل المطلق **самый** + الصفة: **самый большой город**.
