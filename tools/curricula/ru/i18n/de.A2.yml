# German text of the Russian course, A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The other cases: "Die übrigen Kasus"
  Past and future: "Vergangenheit und Futur"
  Adjectives, -ся verbs, commands, comparison: "Adjektive, -ся-Verben, Imperativ, Steigerung"
lessons:
  ru-genitive:
    meaning: "der Genitiv: von, es gibt kein, haben"
    intro: |
      Der Genitiv bedeutet *von* (**книга брата** „das Buch des Bruders“) und folgt auf **нет** „es gibt kein“ (**нет времени** „keine Zeit“), Mengen (**много людей**), Zahlen ab zwei und viele Präpositionen: **у** (bei — **у меня есть** „ich habe“, wörtlich „bei mir ist“), **из** (aus), **от** (von), **до** (bis), **без** (ohne), **для** (für), **после** (nach), **около** (neben).

      Endungen im Singular: Maskulina und Neutra **-а / -я** (**стола, окна**), Feminina **-ы / -и** (**мамы, недели**).
    mistakes: ["нет verlangt den Genitiv."]
  ru-dative:
    meaning: "der Dativ: an, für; gefallen; Alter"
    intro: |
      Der Dativ ist das indirekte Objekt: **Я дал книгу брату.** „Ich gab meinem Bruder das Buch.“ Er folgt auf **к** (zu, auf … zu) und **по** (entlang, per): **к другу**, **по улице**, **по телефону**. *Ich mag* heißt „es gefällt mir“: **Мне нравится музыка.** Der Dativ gibt auch das Alter (**Мне двадцать лет**), Bedarf (**Мне нужно**) und Empfindungen an (**Мне холодно** „mir ist kalt“).

      Endungen im Singular: Maskulina und Neutra **-у / -ю** (**брату, морю**), Feminina **-е / -и** (**маме, тетради**).
    mistakes: ["Wer mag, steht im Dativ; das Gemochte ist das Subjekt."]
  ru-instrumental:
    meaning: "der Instrumental: mit, mittels; werden"
    intro: |
      Der Instrumental nennt das Mittel (**писать ручкой** „mit einem Stift schreiben“) und folgt auf **с** (zusammen mit: **кофе с молоком**), **за** (hinter), **под** (unter), **над** (über), **перед** (vor), **между** (zwischen). Er steht auch für das, was man ist, wird oder als was man arbeitet: **Он хочет стать врачом.** „Er will Arzt werden.“ **Он работает учителем.**

      Endungen: Maskulina und Neutra **-ом / -ем**, Feminina **-ой / -ей**; Plural **-ами / -ями**.
    mistakes: ["с (mit) verlangt den Instrumental."]
  ru-past:
    meaning: "das Präteritum: Kongruenz im Genus"
    intro: |
      Das Präteritum ist leicht zu bilden und richtet sich nach **Genus und Numerus** des Subjekts, nicht nach der Person: **-ть** weg und **-л, -ла, -ло, -ли** an: **читать → он читал, она читала, они читали**. **быть** „sein“ hat ein Präteritum: **был, была, было, были** — **Я был дома** (ein Mann), **Я была дома** (eine Frau).
    mistakes: ["Eine Frau spricht: feminines -ла."]
  ru-future:
    meaning: "das Futur: буду + Infinitiv, oder ein Perfektiv"
    intro: |
      Zwei Futurformen, nach Aspekt: **imperfektive** Verben nehmen **буду, будешь, будет…** + Infinitiv (**Я буду читать** „ich werde lesen / eine Weile lesen“); **perfektive** Verben nehmen einfach Präsensendungen, die ihnen Zukunftsbedeutung geben (**Я прочитаю** „ich werde (es zu Ende) lesen“).
    mistakes: ["буду nur mit imperfektiven Infinitiven."]
  ru-aspect:
    meaning: "Aspekt: imperfektiv und perfektiv"
    intro: |
      Fast jedes Verb hat zwei Partner: das **imperfektive** (Vorgang, Wiederholung, die Handlung allgemein) und das **perfektive** (eine abgeschlossene Handlung, ein Ergebnis). **Я читал книгу** „ich las gerade / eine Weile das Buch“; **Я прочитал книгу** „ich habe das Buch (zu Ende) gelesen“. Perfektive entstehen oft mit einem Präfix (**делать / сделать**, **писать / написать**) oder durch Suffixwechsel (**решать / решить**, **давать / дать**).

      Perfektive haben kein Präsens: Ihre Präsensformen bedeuten Zukunft.
  ru-motion:
    meaning: "Bewegungsverben: eine Richtung oder hin und her"
    intro: |
      Bewegungsverben kommen paarweise: **идти** „gehen (zu Fuß), in eine Richtung, jetzt“ gegenüber **ходить** „regelmäßig, hin und zurück, allgemein gehen“; **ехать / ездить** „fahren“. **Я иду в школу** „ich bin auf dem Weg zur Schule“; **Я хожу в школу** „ich gehe (jeden Tag) zur Schule“. Ebenso **бежать / бегать** (laufen), **лететь / летать** (fliegen), **нести / носить** (tragen).
  ru-adjectives:
    meaning: "Adjektive und ihre Kasus"
    intro: |
      Adjektive richten sich in Genus, Numerus und Kasus nach dem Nomen: **новый дом**, **новая книга**, **новое окно**, **новые книги**; **в новом доме**, **с новой книгой**. Nach **г к х ж ш щ ч** gelten die Rechtschreibregeln (**русский**, **хороший**). Weiche Adjektive haben **-ний**: **синий, синяя, синее, синие** (dunkelblau).
  ru-reflexive:
    meaning: "Verben auf -ся"
    intro: |
      **-ся** (nach Vokal **-сь**) macht ein Verb reflexiv oder intransitiv: **мыть** „waschen“ → **мыться** „sich waschen“; **начинать** „(etwas) beginnen“ → **начинаться** „beginnen“. Viele häufige Verben haben es immer: **нравиться** (gefallen), **смеяться** (lachen), **учиться** (lernen), **надеяться** (hoffen), **бояться** (fürchten).
  ru-imperative:
    meaning: "der Imperativ"
    intro: |
      Vom Präsensstamm: nach Vokal **-й** (**читать → читай, читайте**), sonst **-и** (**говорить → говори, говорите**; **писать → пиши**) oder **-ь** bei Stammbetonung (**встать → встань**). **-те** macht ihn plural oder höflich. Bitten nehmen meist das Imperfektiv (**Садитесь!** „Setzen Sie sich!“); verneinte Befehle ebenso (**Не говори!**).
  ru-comparison:
    meaning: "Steigerung"
    intro: |
      Der kurze Komparativ endet auf **-ее** (**интересный → интереснее**, **быстрый → быстрее**), oder bei vielen häufigen Adjektiven auf **-е** mit Konsonantenwechsel: **большой → больше**, **маленький → меньше**, **хороший → лучше**, **плохой → хуже**, **дорогой → дороже**. *Als* ist **чем** oder der Genitiv: **Он старше меня / чем я.** Der Superlativ ist **самый** + Adjektiv: **самый большой город**.
