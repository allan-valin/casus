# German text of the Russian course, B1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The plural cases: "Die Pluralkasus"
  Prefixed motion, 'would', relative clauses: "Bewegungsverben mit Präfix, „würde“, Relativsätze"
  Joining sentences: "Sätze verbinden"
lessons:
  ru-genitive-plural:
    meaning: "der Genitiv Plural"
    intro: |
      Der Genitiv Plural ist die schwierigste Form: maskuline harte Stämme **-ов** (**столов**), weiche Stämme und Zischlaute **-ей** (**дней, ножей**), Stämme auf **-й** **-ев** (**музеев**); feminine und neutrale Nomen haben meist **gar keine Endung** (**книга → книг**, **окно → окон**, mit eingeschobenem Vokal, wo nötig: **девушка → девушек**). Er folgt auf Zahlen ab fünf, **много / мало / сколько / несколько** und **нет**.
  ru-plural-cases:
    meaning: "Dativ, Instrumental und Präpositiv Plural"
    intro: |
      Anders als im Singular sind die übrigen Pluralkasus für alle Genera gleich: Dativ **-ам / -ям**, Instrumental **-ами / -ями**, Präpositiv **-ах / -ях**: **друзьям, друзьями, о друзьях**; **книгам, книгами, о книгах**.
  ru-prefixed-motion:
    meaning: "Bewegungsverben mit Präfix"
    intro: |
      Präfixe geben die Richtung: **при-** Ankunft (**прийти** „ankommen“), **у-** Weggang (**уйти** „weggehen“), **в-** hinein (**войти**), **вы-** hinaus (**выйти**), **пере-** hinüber (**перейти**), **под-** heran (**подойти**), **за-** vorbeischauen (**зайти**), **от-** weg (**отойти**). Mit **идти** bilden sie Perfektive (**прийти / приходить**); mit **ехать** **приехать / приезжать**.
  ru-conditional:
    meaning: "der Konditional: Präteritum + бы"
    intro: |
      **бы** + die **Präteritumsform** bildet den Konditional, für jede Zeit: **Я бы пошёл** „ich würde gehen / wäre gegangen“; **Если бы я знал, я бы сказал.** „Hätte ich es gewusst, hätte ich es gesagt.“ Ein höflicher Wunsch: **Я бы хотел кофе.** „Ich hätte gern einen Kaffee.“
    mistakes: ["бы steht mit der Präteritumsform; in Wenn-Sätzen folgt es auf если."]
  ru-kotoryj:
    meaning: "Relativsätze mit который"
    intro: |
      **который** „der, welcher“ richtet sich in **Genus und Numerus** nach seinem Nomen, nimmt aber seinen **Kasus** aus dem eigenen Satz: **человек, который живёт здесь** „der Mann, der hier wohnt“; **человек, которого я видел** „der Mann, den ich sah“; **книга, о которой я говорил** „das Buch, über das ich sprach“. Ein Komma trennt den Satz immer ab.
  ru-chtoby:
    meaning: "что (dass) und чтобы (damit, um zu)"
    intro: |
      **что** leitet eine Aussage ein: **Я знаю, что он дома.** **чтобы** leitet Zweck oder Wunsch ein — mit dem **Infinitiv** bei gleichem Subjekt (**Я пришёл, чтобы помочь** „ich kam, um zu helfen“), mit der **Präteritumsform** bei anderem Subjekt (**Я хочу, чтобы ты пришёл** „ich will, dass du kommst“).
    mistakes: ["Ein Wunsch über jemand anderen: чтобы + Präteritum."]
  ru-conjunctions:
    meaning: "Konjunktionen: weil, wenn, als, obwohl"
    intro: |
      **потому что** weil, **так как** da, **поэтому** deshalb, **если** wenn (Bedingung), **когда** wenn/als, **хотя** obwohl, **пока** während / bis (mit **не**), **как только** sobald, **а** und / aber (Gegensatz), **но** aber, **или** oder, **ли** ob (**Я не знаю, придёт ли он**).
