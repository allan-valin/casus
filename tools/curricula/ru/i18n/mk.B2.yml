# Macedonian text of the Russian course, B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Participles and gerunds: "Партиципи и глаголски прилози"
  Impersonal sentences, negation, particles: "Безлични реченици, негација, честички"
lessons:
  ru-participles:
    meaning: "партиципи: оној што чита, прочитаното"
    intro: |
      Партиципите се придавки направени од глаголи, чести во пишаниот јазик: сегашен активен **-ущ- / -ющ- / -ащ- / -ящ-** (**читающий** „кој чита“), минат активен **-вш- / -ш-** (**читавший** „кој читал“), сегашен пасивен **-ем- / -им-** (**любимый** „сакан, омилен“), минат пасивен **-нн- / -т-** (**прочитанный** „прочитан“, **открытый** „отворен“). Се согласуваат како придавки; кратката форма на минатиот пасивен го гради пасивот: **Книга прочитана.** „Книгата е прочитана.“
  ru-gerunds:
    meaning: "глаголски прилози: правејќи, откако направил"
    intro: |
      Глаголските прилози (**деепричастия**) се непроменливи и кажуваат што уште прави подметот: несвршени **-я / -а** „правејќи“ (**читая** „читајќи“ — како македонското **-јќи**), свршени **-в / -вши** „откако направил“ (**прочитав** „откако прочита“). **Возвращаясь домой, я встретил друга.** „Враќајќи се дома, сретнав пријател.“
  ru-impersonal:
    meaning: "безлични реченици"
    intro: |
      Многу искази немаат подмет; лицето е во **датив**, како во македонскиот: **Мне холодно** „ми е студено“, **Тебе надо / нужно идти** „треба да одиш“, **Здесь можно курить?** „Може ли тука да се пуши?“, **Нельзя** „не смее / не може“, **Мне кажется** „ми се чини“. Во минато и иднина со **было / будет**: **Мне было скучно.** „Ми беше досадно.“
  ru-negatives:
    meaning: "одречни заменки и двојна негација"
    intro: |
      **никто** никој, **ничто / ничего** ништо, **нигде** никаде, **никогда** никогаш, **никакой** никаков — секогаш со **не** на глаголот, исто како во македонскиот: **Никто не знает.** „Никој не знае.“ **Я ничего не вижу.** „Ништо не гледам.“ Со предлог зборот се раздвојува: **ни с кем** „со никого“.
  ru-particles:
    meaning: "честички што ја бојат реченицата"
    intro: |
      **же** нагласување (**Это же просто!** „Па тоа е едноставно!“), **ли** прашање / дали, **ведь** „па, сепак“, **уже** веќе, **ещё** уште, **даже** дури, **только** само. Наставките **-то** и **-нибудь** градат неопределени зборови: **кто-то** „некој (одреден)“, **кто-нибудь** „кој било“.
