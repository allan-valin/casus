# Arabic text of the Russian course, A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Letters and sounds: "الحروف والأصوات"
  Nouns and gender: "الأسماء والجنس"
  Pronouns, 'to be' and questions: "الضمائر و«الكينونة» والأسئلة"
  The present tense: "المضارع"
  "Cases I: where and what": "الحالات (1): أين وماذا"
  Numbers: "الأعداد"
lessons:
  ru-alphabet:
    meaning: "الأبجدية والنبر والصوائت المختزلة"
    intro: |
      للروسية 33 حرفًا، تُكتب من اليسار إلى اليمين. بعضها يشبه اللاتينية شكلًا وصوتًا (**а، к، м، о، т**)، وبعضها يشبه اللاتينية شكلًا ويختلف صوتًا (**в** = ف مجهورة v، **н** = ن، **р** = ر، **с** = س، **у** = و، **х** = خ)، وبعضها جديد: **б، г، д، ж، з، л، п، ф، ц، ч، ш، щ، ы، э، ю، я، ь، ъ**.

      **я، ю، е، ё** صوائت «ليّنة» تضع ياءً قبل الصائت في أول الكلمة أو بعد صائت (**я** = يا)، وتليّن الساكن قبلها في غير ذلك. **ь** (علامة اللين) تليّن الساكن قبلها؛ و**ъ** (علامة الصلابة) تفصل. و**ы** صائت لا مقابل له في العربية (انطق *i* واللسان مسحوب إلى الخلف).

      **النبر** حرّ ولا يُكتب في النصوص العادية (جداول Casus تعلّمه: **сто́л، кни́га**). والـ **о** غير المنبورة تُنطق *a* (**молоко́** *مالاكو*)، و**е، я** غير المنبورتين تُنطقان *i*.
    mistakes: ["о غير المنبورة تُنطق a."]
  ru-gender:
    meaning: "الجنس: المذكر والمؤنث والمحايد"
    intro: |
      لا أدوات تعريف في الروسية، لكن لكل اسم جنس تدل عليه نهايته:

      - **المذكر**: ساكن أو **-й** — **стол** (طاولة)، **музей** (متحف)؛ وأيضًا الرجال المنتهية أسماؤهم بـ **-а / -я**: **папа**، **дядя**
      - **المؤنث**: **-а / -я** — **мама**، **неделя** (أسبوع)
      - **المحايد**: **-о / -е / -ё** — **окно** (نافذة)، **море** (بحر)؛ والأسماء المنتهية بـ **-мя**: **имя** (اسم)
      - الأسماء المنتهية بـ **-ь** قد تكون مذكرة (**день**، يوم) أو مؤنثة (**ночь**، ليل) — احفظها مع الكلمة

      الصفات وأسماء الملكية والماضي تطابق الجنس.
    mistakes: ["мама تنتهي بـ -а: مؤنث."]
  ru-plural:
    meaning: "الجمع (حالة الرفع)"
    intro: |
      المذكر والمؤنث يأخذان **-ы**، أو **-и** بعد **г к х ж ш щ ч** وبعد الجذور الليّنة: **стол → столы**، **мама → мамы**، **книга → книги**، **день → дни**. والمحايد يأخذ **-а / -я**: **окно → окна**، **море → моря**. وبعض المذكر يأخذ **-а** منبورة: **дом → дома́**، **город → города́**. والشاذ: **человек → люди**، **ребёнок → дети**، **друг → друзья**.
    mistakes: ["بعد г к х: -и، لا -ы أبدًا (قاعدة إملائية)."]
  ru-noun-table:
    meaning: "الحالات الست: نظرة عامة"
    intro: |
      تتغير نهاية الأسماء الروسية في **ست حالات**: الرفع (الفاعل)، والإضافة (*من، لـ*، بعد **нет** والأعداد وكثير من حروف الجر)، والقابلية (*إلى، لـ*)، والمفعولية (المفعول المباشر، و*إلى* مع **в/на** للحركة)، والآلة (*بـ، مع*، بعد **с**)، وحالة حروف الجر (بعد حروف الجر فقط: **в، на، о**). الدروس التالية تتناولها واحدة واحدة؛ وهنا ثلاثة أسماء كاملة.
  ru-pronouns:
    meaning: "الضمائر الشخصية؛ لا «كينونة» في المضارع"
    intro: |
      **я** أنا، **ты** أنتَ/أنتِ، **он / она / оно** هو / هي / هو (للمحايد)، **мы** نحن، **вы** أنتم (وللاحترام)، **они** هم.

      في المضارع لا يُذكر فعل *الكينونة*، كالجملة الاسمية العربية: **Я студент.** «أنا طالب». **Это мой брат.** «هذا أخي». وفي الكتابة كثيرًا ما تحل شرطة محله بين اسمين: **Москва — столица России.**
    mistakes: ["لا فعل «كان» في المضارع."]
  ru-possessives:
    meaning: "أسماء الملكية: لي، لك، لنا"
    intro: |
      **мой** (لي)، **твой** (لك)، **наш** (لنا)، **ваш** (لكم) تطابق الشيء المملوك: **мой брат**، **моя сестра**، **моё окно**، **мои книги**. أما **его** (له)، **её** (لها) و**их** (لهم) فلا تتغير: **его сестра**، **их дом**. و**свой** تعني «الخاص به» وتعود على الفاعل.
    mistakes: ["طابِق الاسم المملوك."]
  ru-questions:
    meaning: "أدوات الاستفهام"
    intro: |
      **кто** من، **что** ماذا، **где** أين، **куда** إلى أين، **откуда** من أين، **когда** متى، **почему / зачем** لماذا / لأيّ غرض، **как** كيف، **сколько** كم، **какой** أيّ، ما نوع، **чей** لمن. وسؤال نعم/لا يحتفظ بترتيب الجملة الخبرية ويغيّر النغمة فقط: **Ты дома?**
  ru-present-1:
    meaning: "التصريف الأول: -ю/-у، -ешь"
    intro: |
      معظم الأفعال المنتهية بـ **-ать / -ять** من **التصريف الأول**: احذف **-ть** وأضف **-ю، -ешь، -ет، -ем، -ете، -ют**. والمضارع يشمل *أقرأ الآن* و*أقرأ (عادة)*. وبعض أفعال التصريف الأول تغيّر جذرها: **писать → пишу، пишешь**؛ **жить → живу، живёшь**.
    mistakes: ["أنا: -ю."]
  ru-present-2:
    meaning: "التصريف الثاني: -ю/-у، -ишь"
    intro: |
      معظم الأفعال المنتهية بـ **-ить** (وبعض -еть، -ать) تأخذ **-ю، -ишь، -ит، -им، -ите، -ят**: **говорить → говорю، говоришь، говорят**. وفي المتكلم المفرد تتغير بعض السواكن: **видеть → вижу، видишь**؛ **любить → люблю، любишь**؛ **сидеть → сижу**.
  ru-prepositional:
    meaning: "حالة حروف الجر: أين، عن ماذا"
    intro: |
      بعد **в** (في) و**на** (على، عند) للمكان، و**о / об** (عن)، تأخذ الأسماء **حالة حروف الجر**: غالبًا **-е** — **Москва → в Москве**، **стол → на столе**، **работа → на работе**؛ والأسماء المنتهية بـ **-ия، -ие** والمؤنث المنتهي بـ **-ь** تأخذ **-и**: **Россия → в России**، **тетрадь → в тетради**.

      **на** تُستعمل مع الأماكن المفتوحة والمناسبات وبعض الأماكن عُرفًا: **на улице، на концерте، на работе، на почте**.
    mistakes: ["الأسماء المنتهية بـ -ия تأخذ -и."]
  ru-accusative:
    meaning: "حالة المفعولية: المفعول المباشر"
    intro: |
      المفعول المباشر في **حالة المفعولية**. المؤنث المنتهي بـ **-а / -я** يصير **-у / -ю**: **мама → маму**، **неделя → неделю**. و**الأشياء** المذكرة والمحايدة تبقى كما هي: **Я вижу стол / окно**. و**الأشخاص والحيوانات** المذكرة تأخذ صيغة الإضافة: **Я вижу брата**. وبعد **в / на** للحركة (*إلى أين؟*) أيضًا حالة المفعولية: **Я иду в школу.**
    mistakes: ["مفعول люблю: حالة المفعولية."]
  ru-numbers:
    meaning: "الأعداد والاسم بعدها"
    intro: |
      **один / одна / одно** تطابق كالصفة. وبعد **два / две، три، четыре** يكون الاسم في **حالة الإضافة المفردة**: **два стола**، **три книги**. ومن **пять** فصاعدًا **حالة الإضافة الجمع**: **пять столов**، **десять книг** — شبيه بتمييز العدد في العربية. والأعداد المركبة تتبع آخر كلمة فيها: **двадцать один стол**، **двадцать два стола**، **двадцать пять столов**.
    mistakes: ["من خمسة: إضافة جمع."]
