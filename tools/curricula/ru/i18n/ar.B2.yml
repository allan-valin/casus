# Arabic text of the Russian course, B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Participles and gerunds: "أسماء الفاعل والمفعول والحال الفعلي"
  Impersonal sentences, negation, particles: "الجمل غير الشخصية والنفي والأدوات"
lessons:
  ru-participles:
    meaning: "أسماء الفاعل والمفعول: القارئ، المقروء"
    intro: |
      هي صفات مشتقة من الأفعال، شائعة في الكتابة: اسم فاعل للحاضر **-ущ- / -ющ- / -ащ- / -ящ-** (**читающий** «القارئ، الذي يقرأ»)، واسم فاعل للماضي **-вш- / -ш-** (**читавший**)، واسم مفعول للحاضر **-ем- / -им-** (**любимый** «محبوب، مفضّل»)، واسم مفعول للماضي **-нн- / -т-** (**прочитанный** «مقروء»، **открытый** «مفتوح»). تطابق كالصفات؛ والصيغة القصيرة لاسم المفعول الماضي تصوغ المجهول: **Книга прочитана.** «الكتاب مقروء».
  ru-gerunds:
    meaning: "الحال الفعلي: وهو يفعل، بعد أن فعل"
    intro: |
      الحال الفعلي (**деепричастия**) ثابت لا يتغير ويدل على فعل آخر للفاعل: الناقص **-я / -а** «وهو يفعل» (**читая** «وهو يقرأ»)، والتام **-в / -вши** «بعد أن فعل» (**прочитав** «بعد أن قرأ»). **Возвращаясь домой, я встретил друга.** «وأنا عائد إلى البيت قابلتُ صديقًا».
  ru-impersonal:
    meaning: "الجمل غير الشخصية"
    intro: |
      كثير من العبارات بلا فاعل؛ والشخص في **حالة القابلية**: **Мне холодно** «أشعر بالبرد»، **Тебе надо / нужно идти** «عليك أن تذهب»، **Здесь можно курить?** «هل يُسمح بالتدخين هنا؟»، **Нельзя** «ممنوع / مستحيل»، **Мне кажется** «يبدو لي». وفي الماضي والمستقبل تُستعمل **было / будет**: **Мне было скучно.** «شعرتُ بالملل».
  ru-negatives:
    meaning: "ضمائر النفي والنفي المزدوج"
    intro: |
      **никто** لا أحد، **ничто / ничего** لا شيء، **нигде** في لا مكان، **никогда** أبدًا، **никакой** لا أيّ — دائمًا مع **не** على الفعل: **Никто не знает.** «لا أحد يعرف». **Я ничего не вижу.** «لا أرى شيئًا». ومع حرف جر تنقسم الكلمة: **ни с кем** «مع لا أحد».
  ru-particles:
    meaning: "أدوات تلوّن الجملة"
    intro: |
      **же** للتوكيد (**Это же просто!** «لكن هذا بسيط!»)، **ли** للسؤال / هل، **ведь** «فـ…، في النهاية»، **уже** قد، سابقًا، **ещё** بعدُ / أيضًا، **даже** حتى، **только** فقط. واللاحقتان **-то** و**-нибудь** تصوغان النكرات: **кто-то** «شخص ما (معيّن)»، **кто-нибудь** «أيّ أحد».
