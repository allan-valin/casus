# Macedonian text of the Russian course, B1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The plural cases: "Падежите во множина"
  Prefixed motion, 'would', relative clauses: "Движење со префикси, „би“, релативни реченици"
  Joining sentences: "Поврзување реченици"
lessons:
  ru-genitive-plural:
    meaning: "генитив множина"
    intro: |
      Генитивот множина е најтешката форма: машки тврди основи **-ов** (**столов**), меки основи и шушкави **-ей** (**дней, ножей**), основи на **-й** **-ев** (**музеев**); женските и средните именки обично **немаат наставка** (**книга → книг**, **окно → окон**, со вметната самогласка каде што треба: **девушка → девушек**). Доаѓа по броевите од пет, **много / мало / сколько / несколько** и **нет**.
  ru-plural-cases:
    meaning: "датив, инструментал и предлошки во множина"
    intro: |
      За разлика од еднината, другите падежи во множина се исти за сите родови: датив **-ам / -ям**, инструментал **-ами / -ями**, предлошки **-ах / -ях**: **друзьям, друзьями, о друзьях**; **книгам, книгами, о книгах**.
  ru-prefixed-motion:
    meaning: "глаголи на движење со префикси"
    intro: |
      Префиксите даваат насока — многу слично на македонските: **при-** доаѓање (**прийти** „пристигне“), **у-** заминување (**уйти** „замине“), **в-** влегување (**войти**), **вы-** излегување (**выйти**), **пере-** преминување (**перейти**), **под-** приближување (**подойти**), **за-** свраќање (**зайти**), **от-** оддалечување (**отойти**). Со **идти** градат свршени (**прийти / приходить**); со **ехать** **приехать / приезжать**.
  ru-conditional:
    meaning: "условниот начин: минато + бы"
    intro: |
      **бы** + **минатата** форма го гради условниот начин за секое време — исто како македонското **би** + л-форма: **Я бы пошёл** „би отишол“; **Если бы я знал, я бы сказал.** „Да знаев, ќе ти кажев.“ Учтива желба: **Я бы хотел кофе.** „Би сакал кафе.“
    mistakes: ["бы оди со минатата форма; во реченици со ако доаѓа по если."]
  ru-kotoryj:
    meaning: "релативни реченици со который"
    intro: |
      **который** „кој, што“ се согласува со именката по **род и број**, а **падежот** го зема од својата реченица: **человек, который живёт здесь** „човекот што живее тука“; **человек, которого я видел** „човекот што го видов“; **книга, о которой я говорил** „книгата за која зборував“. Запирка секогаш ја одделува реченицата.
  ru-chtoby:
    meaning: "что (дека) и чтобы (за да)"
    intro: |
      **что** воведува исказ: **Я знаю, что он дома.** „Знам дека е дома.“ **чтобы** воведува цел или желба — со **инфинитив** ако подметот е ист (**Я пришёл, чтобы помочь** „Дојдов за да помогнам“), со **минатата** форма ако е различен (**Я хочу, чтобы ты пришёл** „Сакам да дојдеш“).
    mistakes: ["Желба за некој друг: чтобы + минато."]
  ru-conjunctions:
    meaning: "сврзници: бидејќи, ако, кога, иако"
    intro: |
      **потому что** бидејќи, **так как** бидејќи, **поэтому** затоа, **если** ако, **когда** кога, **хотя** иако, **пока** додека / додека не (со **не**), **как только** штом, **а** а (спротивставување), **но** но, **или** или, **ли** дали (**Я не знаю, придёт ли он** „Не знам дали ќе дојде“).
