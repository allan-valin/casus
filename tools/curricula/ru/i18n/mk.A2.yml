# Macedonian text of the Russian course, A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The other cases: "Другите падежи"
  Past and future: "Минато и идно време"
  Adjectives, -ся verbs, commands, comparison: "Придавки, глаголи на -ся, заповеден начин, споредување"
lessons:
  ru-genitive:
    meaning: "генитивот: на, нема, имање"
    intro: |
      Генитивот значи *на* (**книга брата** „книгата на братот“) и доаѓа по **нет** „нема“ (**нет времени** „нема време“), количини (**много людей**), броеви од два натаму и многу предлози: **у** (кај — **у меня есть** „имам“, буквално „кај мене има“), **из** (од, од внатре), **от** (од), **до** (до), **без** (без), **для** (за), **после** (по, после), **около** (околу, близу).

      Наставки во еднина: машки и среден род **-а / -я** (**стола, окна**), женски **-ы / -и** (**мамы, недели**).
    mistakes: ["нет бара генитив."]
  ru-dative:
    meaning: "дативот: на, за; ми се допаѓа; возраст"
    intro: |
      Дативот е индиректниот објект: **Я дал книгу брату.** „Му ја дадов книгата на брат ми.“ Доаѓа по **к** (кон) и **по** (по, низ): **к другу**, **по улице**, **по телефону**. *Ми се допаѓа* е исто како во македонскиот: **Мне нравится музыка.** Дативот ја кажува и возраста (**Мне двадцать лет**), потребата (**Мне нужно** „ми треба“) и чувствата (**Мне холодно** „ми е студено“).

      Наставки во еднина: машки и среден **-у / -ю** (**брату, морю**), женски **-е / -и** (**маме, тетради**).
    mistakes: ["Оној на кого му се допаѓа е во датив; допаѓаното е подмет."]
  ru-instrumental:
    meaning: "инструменталот: со, преку; станување"
    intro: |
      Инструменталот го кажува средството (**писать ручкой** „пишува со пенкало“) и доаѓа по **с** (заедно со: **кофе с молоком**), **за** (зад), **под** (под), **над** (над), **перед** (пред), **между** (меѓу). Се користи и за она што некој е, станува или работи: **Он хочет стать врачом.** „Сака да стане лекар.“ **Он работает учителем.** „Работи како учител.“

      Наставки: машки и среден **-ом / -ем**, женски **-ой / -ей**; множина **-ами / -ями**.
    mistakes: ["с (со) бара инструментал."]
  ru-past:
    meaning: "минатото време: согласување по род"
    intro: |
      Минатото лесно се гради и се согласува со подметот по **род и број**, не по лице — сосема како македонската л-форма: отстрани **-ть** и додај **-л, -ла, -ло, -ли**: **читать → он читал, она читала, они читали**. **быть** „сум“ има минато: **был, была, было, были** — **Я был дома** (маж), **Я была дома** (жена).
    mistakes: ["Зборува жена: женско -ла."]
  ru-future:
    meaning: "идното време: буду + инфинитив, или свршен глагол"
    intro: |
      Две идни времиња, според видот: **несвршените** глаголи користат **буду, будешь, будет…** + инфинитив (**Я буду читать** „ќе читам“); **свршените** просто земаат сегашни наставки, кои им даваат значење на иднина (**Я прочитаю** „ќе ја прочитам“). Нема посебна честичка како **ќе**.
    mistakes: ["буду оди само со несвршени инфинитиви."]
  ru-aspect:
    meaning: "вид: несвршен и свршен"
    intro: |
      Речиси секој глагол има двојка — исто како во македонскиот: **несвршен** (процес, повторување, дејството воопшто) и **свршен** (едно завршено дејство, резултат). **Я читал книгу** „ја читав книгата“; **Я прочитал книгу** „ја прочитав книгата (до крај)“. Свршените често се градат со префикс (**делать / сделать**, **писать / написать**) или со промена на суфиксот (**решать / решить**, **давать / дать**).

      Свршените немаат сегашно време: нивните сегашни форми значат иднина.
  ru-motion:
    meaning: "глаголи на движење: во една насока или наоколу"
    intro: |
      Глаголите на движење одат во парови: **идти** „оди (пеш), во една насока, сега“ наспроти **ходить** „оди редовно, оди-врати се, воопшто“; **ехать / ездить** „патува со возило“. **Я иду в школу** „одам на училиште (сега)“; **Я хожу в школу** „одам на училиште (секој ден)“. Исто **бежать / бегать** (трча), **лететь / летать** (лета), **нести / носить** (носи).
  ru-adjectives:
    meaning: "придавките и нивните падежи"
    intro: |
      Придавките се согласуваат со именката по род, број и падеж: **новый дом**, **новая книга**, **новое окно**, **новые книги**; **в новом доме**, **с новой книгой**. По **г к х ж ш щ ч** важат правописните правила (**русский**, **хороший**). Меките придавки имаат **-ний**: **синий, синяя, синее, синие** (темносин).
  ru-reflexive:
    meaning: "глаголи на -ся"
    intro: |
      **-ся** (по самогласка **-сь**) го прави глаголот повратен или непреоден — како македонското **се**, но прилепено на крајот: **мыть** „мие“ → **мыться** „се мие“; **начинать** „почнува (нешто)“ → **начинаться** „почнува“. Многу чести глаголи секогаш го имаат: **нравиться** (се допаѓа), **смеяться** (се смее), **учиться** (учи), **надеяться** (се надева), **бояться** (се плаши).
  ru-imperative:
    meaning: "заповедниот начин"
    intro: |
      Од сегашната основа: по самогласка **-й** (**читать → читай, читайте**), инаку **-и** (**говорить → говори, говорите**; **писать → пиши**) или **-ь** кога акцентот е на основата (**встать → встань**). **-те** го прави множина или учтив. Молбите обично користат несвршен вид (**Садитесь!** „Седнете!“); и одречните заповеди (**Не говори!**).
  ru-comparison:
    meaning: "споредување"
    intro: |
      Краткиот компаратив завршува на **-ее** (**интересный → интереснее**, **быстрый → быстрее**), или на **-е** со промена на согласката кај многу чести придавки: **большой → больше**, **маленький → меньше**, **хороший → лучше**, **плохой → хуже**, **дорогой → дороже**. *Од* (во споредба) е **чем** или генитив: **Он старше меня / чем я.** Суперлативот е **самый** + придавка: **самый большой город** (наместо македонското **нај-**).
