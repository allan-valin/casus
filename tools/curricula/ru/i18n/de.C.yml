# German text of the Russian course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Participle and gerund phrases: "Partizipial- und Adverbialpartizipgruppen"
  Aspect in depth: "Aspekt vertieft"
  Numerals and case: "Zahlwörter und Kasus"
  Bookish style: "Buchsprachlicher Stil"
  Word order and emphasis: "Wortstellung und Betonung"
  Negation in depth: "Verneinung vertieft"
  Registers: "Stilebenen"
  Verbs in depth: "Verben vertieft"
lessons:
  ru-c1-participle-phrase:
    meaning: "die Partizipialgruppe statt eines который-Satzes"
    intro: |
      Geschriebenes Russisch ersetzt einen **который**-Satz durch eine **Partizipialgruppe** (причастный оборот): **человек, который сидит у окна** → **человек, сидящий у окна** „der am Fenster sitzende Mann“. Das Partizip übernimmt Genus, Numerus und Kasus seines Nomens (**к человеку, сидящему у окна**) und behält Objekte und Rektion des Verbs (**интересующийся музыкой** „an Musik interessiert“).

      **Nach** dem Nomen wird die Gruppe beidseitig durch Kommas abgetrennt; **davor** ohne Kommas: **сидящий у окна человек**. Das Tempus des Partizips ist relativ zum Hauptverb: **читающий** „der (gerade) liest/las“, **читавший** „der gelesen hatte“.
    mistakes: ["Das Partizip richtet sich nach seinem Nomen: девушку steht im Akkusativ."]
  ru-c1-short-passive:
    meaning: "das Passiv mit Kurzpartizipien auf -н / -т"
    intro: |
      Das kurze Partizip Präteritum Passiv — **построен, построена, построено, построены** — bildet mit **быть** das Passiv perfektiver Verben: **Дом был построен в 1900 году.** „Das Haus wurde 1900 gebaut.“ **Вопрос будет решён завтра.** „Die Frage wird morgen geklärt.“ Im Präsens fällt **есть** weg: **Магазин закрыт.** „Der Laden ist geschlossen.“ Der Urheber steht, wenn genannt, im **Instrumental**: **Роман написан Толстым.**

      Kurzformen haben ein **н** (**решена**), Langformen zwei (**решённая задача**). Imperfektive Verben bilden ihr Passiv stattdessen mit **-ся**: **Дом строится.** „Das Haus wird gebaut.“
  ru-c1-perfective-gerund:
    meaning: "das perfektive Adverbialpartizip: nachdem man getan hat"
    intro: |
      Perfektive Verben bilden ein Adverbialpartizip auf **-в** (**сделав** „getan habend“, **прочитав**), **-вшись** bei reflexiven Verben (**вернувшись** „zurückgekehrt“, **умывшись**) und **-я** bei einigen Stämmen auf -д/-т (**придя** „angekommen“, **войдя**, **приведя**). Die Handlung ist **vor** der Haupthandlung abgeschlossen: **Сделав уроки, он пошёл гулять.** „Nachdem er die Hausaufgaben gemacht hatte, ging er spazieren.“

      Das Adverbialpartizip muss das Subjekt des Hauptverbs teilen. **Подъезжая к станции, у меня слетела шляпа** („Als ich mich dem Bahnhof näherte, flog mir der Hut weg“, wörtlich: „…flog mein Hut“) ist Tschechows berühmtes Beispiel für den Fehler.
    mistakes: ["Wer gelesen hat, muss das Subjekt des Hauptverbs sein."]
  ru-c1-aspect-negation:
    meaning: "Aspekt in verneinten Befehlen und mit нельзя"
    intro: |
      Ein verneinter Befehl ist normalerweise **imperfektiv**: **Не открывай окно!** „Mach das Fenster nicht auf!“ **Не говорите ему.** „Sagen Sie es ihm nicht.“ Ein verneinter **perfektiver** Imperativ ist eine **Warnung** vor etwas, das versehentlich passieren könnte: **Не упади!** „Pass auf, dass du nicht fällst!“ **Смотри, не опоздай!** „Sieh zu, dass du nicht zu spät kommst!“

      Dieselbe Teilung gilt bei **нельзя**: + Imperfektiv „es ist nicht erlaubt“ (**Здесь нельзя курить.**), + Perfektiv „es ist unmöglich“ (**Эту дверь нельзя открыть.** „Diese Tür lässt sich nicht öffnen.“).
  ru-c1-aspect-fact:
    meaning: "das Imperfektiv für die bloße Tatsache"
    intro: |
      Um zu fragen oder zu sagen, **ob** etwas je geschah — nicht dessen Ergebnis —, nimmt das Russische das **imperfektive** Präteritum, selbst für eine einzelne abgeschlossene Handlung: **Ты читал «Войну и мир»?** „Hast du Krieg und Frieden gelesen?“ **Кто открывал окно?** „Wer hat (irgendwann) das Fenster geöffnet?“ **Я уже видел этот фильм.** „Ich habe diesen Film schon gesehen.“ Das ist die *allgemein-faktische* Bedeutung (общефактическое значение).

      Das **Perfektiv** rückt das **Ergebnis** in den Mittelpunkt: **Ты прочитал книгу?** „Hast du das Buch durchgelesen?“ Ein rückgängig gemachtes Ergebnis ist ein starkes Signal für das Imperfektiv: **Кто-то открывал окно** „jemand hat das Fenster geöffnet (und wieder geschlossen)“.
  ru-c1-aspect-future-plans:
    meaning: "Aspekt im Futur: Vorgang oder Versprechen"
    intro: |
      **буду + imperfektiver Infinitiv** beschreibt eine künftige Tätigkeit oder Gewohnheit, ohne versprochenes Ergebnis: **Завтра я буду работать весь день.** „Morgen arbeite ich den ganzen Tag.“ **Я буду тебе звонить каждый день.** „Ich rufe dich jeden Tag an.“ Das **perfektive Präsens** ist eine Einzelhandlung mit Ergebnis — ein Versprechen oder Plan: **Я позвоню тебе завтра.** „Ich rufe dich morgen an.“

      Mit **не** heißt das perfektive Futur oft „kann nicht, schaffe es nicht“: **Я не найду дорогу.** „Ich werde den Weg nicht finden.“
  ru-c1-numeral-cases:
    meaning: "Zahlwörter in den obliquen Kasus"
    intro: |
      Nach **два, три, четыре** steht das Nomen im Genitiv Singular, ab **пять** im Genitiv Plural — aber nur, wenn das Zahlwort selbst im Nominativ oder Akkusativ steht. In allen anderen Kasus wird das Zahlwort **dekliniert**, und das Nomen steht **im selben Kasus, Plural**: **с тремя друзьями** „mit drei Freunden“, **о двух книгах** „über zwei Bücher“, **к пяти часам** „bis fünf Uhr“, **из десяти студентов**.

      Zahlwörter ab **пять** werden wie **ночь** dekliniert (**пяти, пятью**); **сорок, девяносто, сто** haben nur eine oblique Form: **сорока, девяноста, ста**. Bei zusammengesetzten Zahlen wird jeder Teil dekliniert: **с двадцатью пятью рублями**.
  ru-c1-collective:
    meaning: "Sammelzahlwörter und оба / обе"
    intro: |
      **двое, трое, четверо, пятеро…** zählen Personen als Gruppe, mit Genitiv Plural: **двое детей** „zwei Kinder“, **нас было трое** „wir waren zu dritt“. Sie sind Pflicht bei Nomen ohne Singular (**двое суток** „zwei Tage und Nächte“, **трое ножниц**) und bei **дети, люди** in kleinen Zahlen; bei männlichen Nomen sind sie eine Alternative (**трое друзей / три друга**). Bei femininen Nomen stehen sie nie.

      **оба** (mask./neutr.) und **обе** (fem.) bedeuten „beide“ und nehmen den Genitiv Singular: **оба брата, обе сестры**; oblique **обоих / обеих**.
  ru-c1-approximation:
    meaning: "ungefähre Zahlen"
    intro: |
      Für Ungefähres gibt es eigene Grammatik: **около** + Genitiv „etwa“ (**около ста человек**), **свыше / более** + Genitiv „über“ (**свыше тысячи**), **порядка** „in der Größenordnung von“, **примерно / приблизительно** „ungefähr“. Gesprochen macht die **Voranstellung des Nomens vor die Zahl** die Angabe ungefähr: **часа два** „so zwei Stunden“ gegenüber **два часа** „zwei Stunden“.

      **полтора** (fem. **полторы**) „anderthalb“ nimmt den Genitiv Singular: **полтора часа, полторы недели**.
  ru-c1-verbal-nouns:
    meaning: "Verbalnomen auf -ние nach Präpositionen"
    intro: |
      Formelles und wissenschaftliches Russisch packt einen Satz in ein **Verbalnomen** auf **-ание / -ение** nach einer Präposition: **после окончания университета** „nach dem Studienabschluss“, **при решении задачи** „beim Lösen der Aufgabe“, **для улучшения условий** „zur Verbesserung der Bedingungen“, **до начала занятий**. Das Objekt des Verbs steht im **Genitiv**, sein Subjekt im Instrumental: **принятие закона парламентом** „die Verabschiedung des Gesetzes durch das Parlament“.

      Gesprochen sagt man dasselbe mit einem Nebensatz: **после того как он окончил университет**.
  ru-c1-derived-prepositions:
    meaning: "Präpositionen aus anderen Wörtern"
    intro: |
      Formelle Texte verwenden Präpositionen aus Adverbialpartizipien, Nomen und Adverbien, jede mit eigenem Kasus:

      - **благодаря** + Dat. „dank“, **согласно** + Dat. „gemäß“, **вопреки** + Dat. „entgegen“
      - **несмотря на** + Akk. „trotz“
      - **вследствие**, **ввиду**, **в течение**, **в результате**, **в ходе**, **помимо**, **относительно** + Gen.
      - **в связи с** + Instr. „im Zusammenhang mit“

      **благодаря** gilt für gute Ursachen; für schlechte sagt man **из-за**: **из-за дождя** „wegen des Regens“.
  ru-c1-conjunctions:
    meaning: "Konjunktionen des formellen und literarischen Stils"
    intro: |
      Über **потому что** und **хотя** hinaus:

      - Grund: **поскольку**, **так как** „da“, **ибо** (buchsprachlich) „denn“
      - Gegensatz: **тогда как**, **в то время как** „während, wohingegen“, **хотя / хоть** „obwohl“
      - Vergleich und Zweifel: **будто, словно, как будто** „als ob“, **якобы** „angeblich“
      - Zeit: **едва** „kaum“, **по мере того как** „in dem Maße, wie“
      - Zweck: **для того чтобы** „um zu“

      **будто** nach Verben des Sagens zeigt, dass der Sprecher die Behauptung bezweifelt: **Он говорит, будто болен.** „Er sagt, er sei krank (ich bezweifle es).“
  ru-c2-word-order:
    meaning: "Wortstellung: das Neue kommt zuletzt"
    intro: |
      Die russische Wortstellung ist grammatisch frei, aber nicht in der Bedeutung: Der Satz beginnt mit dem **Bekannten** (Thema) und endet mit dem **Neuen** (Rhema). **Девушка вошла в комнату.** „Das Mädchen kam ins Zimmer“ (wir wissen, welches). **В комнату вошла девушка.** „Ein Mädchen kam ins Zimmer“ (eine neue Person). So leistet das Russische die Arbeit der Artikel *der* und *ein*.

      Sätze, die mit Ort, Zeit oder **вдруг** beginnen, stellen das Verb meist vor das Subjekt: **Вчера приехал мой брат.** „Gestern kam mein Bruder an.“ **Вдруг зазвонил телефон.** „Plötzlich klingelte das Telefon.“ Gesprochen kann das Neue mit starker Betonung auch vorne stehen.
  ru-c2-emphatic-particles:
    meaning: "Partikeln für Fokus, Zweifel und Verneinung"
    intro: |
      Diese Partikeln schärfen die Informationsstruktur:

      - **именно** „genau, gerade“: **Именно это я и хотел сказать.** „Genau das wollte ich sagen.“
      - **лишь, исключительно** „nur, ausschließlich“
      - **разве** und **неужели** machen eine Aussage zu Überraschung oder Zweifel: **Разве ты не знал?** „Wusstest du das etwa nicht?“ **Неужели это правда?** „Ist das wirklich wahr?“
      - **вовсе не, отнюдь не, ничуть не** „ganz und gar nicht“ (отнюдь ist buchsprachlich)
      - **всё-таки, всё же** „trotzdem“
  ru-c2-ni-concessive:
    meaning: "wer auch immer, was auch immer: konzessives ни"
    intro: |
      **ни** (nicht **не**) nach einem Fragewort, meist mit **бы** + Präteritum, bildet *-auch-immer*-Sätze: **Что бы ты ни говорил, я не поверю.** „Was du auch sagst, ich glaube es nicht.“ **Где бы он ни был…** „Wo er auch sein mag …“ **Как ни старайся, не успеешь.** „Wie sehr du dich auch bemühst, du schaffst es nicht.“ **Сколько ни** „wie viel auch immer“.

      Hier verneint **ни** nichts; der Hauptsatz ist von sich aus bejaht oder verneint. **не** statt **ни** zu schreiben, ist einer der häufigsten Rechtschreibfehler von Muttersprachlern.
    mistakes: ["Die konzessive Partikel ist ни."]
  ru-c2-double-negative:
    meaning: "zwei Verneinungen ergeben ein starkes Ja"
    intro: |
      **не мочь не** + Infinitiv, **нельзя не**, **не может не** heißen „nicht umhinkönnen, müssen“: **Я не могу не согласиться.** „Ich muss einfach zustimmen.“ **Нельзя не признать, что…** „Man muss zugeben, dass …“ **Он не мог не заметить.** „Es konnte ihm nicht entgehen.“

      Feste Wendungen funktionieren ebenso: **не раз** „mehr als einmal“ (aber **ни разу** „kein einziges Mal“), **не кто иной, как** „kein anderer als“, **не без** „nicht ohne“: **не без труда** „mit einiger Mühe“.
  ru-c2-genitive-negation:
    meaning: "der Genitiv der Verneinung"
    intro: |
      Wird verneint, dass etwas **existiert**, steht es im Genitiv, mit neutralem Verb: **Ответа не было.** „Es gab keine Antwort.“ **Писем не пришло.** „Es kamen keine Briefe.“ Nach verneinten transitiven Verben steht das Objekt oft im Genitiv, besonders abstrakte oder unbestimmte: **Он не имеет права.** „Er hat kein Recht.“ **Я не вижу никакой разницы.** „Ich sehe keinerlei Unterschied.“ **не обращай внимания** „achte nicht darauf“.

      Ein konkretes, bestimmtes Objekt bleibt im Akkusativ: **Я не видел твою сестру.** „Ich habe deine Schwester nicht gesehen.“ Die Wahl zwischen beiden ist eine der feinsten Stilfragen des Russischen.
  ru-c2-bookish:
    meaning: "alte und buchsprachliche Wörter des hohen Stils"
    intro: |
      Amtliche, juristische, religiöse und ironische Texte bewahren Wörter, die die Umgangssprache verloren hat: **ибо** „denn“, **дабы** „damit“ (= чтобы), **нежели** „als“ (= чем), **сей, сия, сие** „dieser“ (**до сих пор** „bis jetzt“, **сию минуту** „sofort“), **оный** „besagter“, **ежели** „wenn“, **коль скоро** „insofern“, **отнюдь** „keineswegs“.

      Im Alltagsgespräch klingen sie gespreizt oder scherzhaft: **Сие мне неведомо.** „Dies ist mir unbekannt“ (gespielt feierlich).
  ru-c2-colloquial:
    meaning: "Partikeln der Umgangssprache"
    intro: |
      Die gesprochene Sprache hat eigene Partikeln, selten in der Schrift:

      - **мол, дескать** markieren fremde Worte, oft skeptisch: **Он сказал, мол, занят.** „Er sagte, er sei angeblich beschäftigt.“
      - **небось** „wohl, wette ich“: **Устал небось?** „Müde, wette ich?“
      - **авось** „vielleicht klappt’s ja“ — **на авось** „aufs Geratewohl“, eine sprichwörtlich russische Haltung
      - **ну, вот, вон, ладно, давай**: Zögern, Zeigen, Zustimmung, „los“
      - **-ка** mildert einen Befehl: **Покажи-ка!** „Zeig mal her!“
  ru-c2-expressive-suffixes:
    meaning: "Suffixe der Größe und des Gefühls"
    intro: |
      Diminutiv- und Augmentativsuffixe drücken eher Haltung als Größe aus:

      - Zärtlichkeit: **-ик, -чик** (**домик, стульчик**), **-ок / -ек** (**сынок, пирожок**), **-очк- / -ечк-** (**чашечка, минуточка**), **-еньк- / -оньк-** bei Adjektiven (**маленький, тихонько**)
      - **-ушк- / -юшк-** Zuneigung im Volkston (**бабушка, солнышко**)
      - vergrößernd oder derb: **-ищ-** (**домище** „Riesenhaus“, **ручища**)
      - abwertend: **-ишк-** (**домишко** „ein armseliges Häuschen“)

      Kellner und Verkäufer sagen **минуточку, хлебушек, чаёк**, um freundlich zu klingen.
  ru-c2-prefix-meanings:
    meaning: "Präfixe, die eine Aktionsart hinzufügen"
    intro: |
      Über die Perfektivierung hinaus fügen Präfixe genaue Nuancen hinzu (*Aktionsarten*):

      - **до-** bis zum Ende: **дочитать** „zu Ende lesen“
      - **пере-** wieder oder zu viel: **переделать** „umarbeiten“, **переесть** „sich überessen“
      - **недо-** zu wenig: **недооценить** „unterschätzen“
      - **за-** Beginn: **заплакать** „in Tränen ausbrechen“; **по-** ein Weilchen: **поговорить** „sich unterhalten“
      - **на- … -ся** bis zur Sättigung: **наесться** „sich satt essen“, **выспаться** „ausschlafen“
      - **раз- … -ся** in Fahrt kommen: **разговориться** „ins Reden kommen“
  ru-c2-figurative-motion:
    meaning: "Bewegungsverben im übertragenen Gebrauch"
    intro: |
      **идти** beschreibt vieles, das nicht geht: **идёт дождь / снег** „es regnet / schneit“, **идёт фильм** „ein Film läuft“, **часы идут** „die Uhr geht“, **время идёт** „die Zeit vergeht“, **речь идёт о…** „es geht um …“, **Тебе идёт эта шапка.** „Die Mütze steht dir.“ Andere Bewegungsverben folgen: **время летит** „die Zeit fliegt“, **слухи ходят** „Gerüchte gehen um“, **автобус ходит** „der Bus verkehrt“ (regelmäßig: mehrdirektional).
  ru-c2-impersonal-verbs:
    meaning: "unpersönliche Verben und die Elementarkonstruktion"
    intro: |
      Manche Verben haben gar kein Subjekt:

      - Natur: **темнеет** „es dunkelt“, **светает** „es dämmert“, **морозит**
      - Zustände, mit der Person im Akkusativ: **меня тошнит** „mir ist übel“, **его знобит** „ihn fröstelt“
      - Dativ + **-ся**, ein Drang oder Können, das einem „passiert“: **мне не спится** „ich kann nicht schlafen“, **ему не работается** „er kommt nicht zum Arbeiten“
      - die „Elementarkonstruktion“, mit der Kraft im Instrumental: **Лодку унесло ветром.** „Das Boot wurde vom Wind fortgetragen.“ **Его ранило.** „Er wurde verwundet.“
      - Glück: **ему везёт / повезло** „er hat / hatte Glück“
  ru-c2-imperative-politeness:
    meaning: "Aspekt im Befehl: Einladung oder Anordnung"
    intro: |
      In bejahten Befehlen ist das **Perfektiv** die neutrale Bitte um eine Handlung: **Сядьте.** „Setzen Sie sich.“ **Закройте дверь.** Das **Imperfektiv** benutzt der Gastgeber — eine Einladung, das Erwartete zu tun: **Садитесь, пожалуйста!** „Setzen Sie sich doch!“ **Проходите, раздевайтесь.** „Kommen Sie herein, legen Sie ab.“ **Угощайтесь!** „Greifen Sie zu!“

      Das Imperfektiv kann auch drängen, eine schon vereinbarte Sache anzugehen: **Ну, рассказывайте!** „Na, erzählen Sie schon!“ Ein Perfektiv gegenüber einem Gast kann wie ein Befehl klingen.
