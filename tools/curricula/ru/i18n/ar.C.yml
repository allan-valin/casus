# Arabic text of the Russian course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Participle and gerund phrases: "عبارات اسم الفاعل والحال الفعلي"
  Aspect in depth: "الجهة بتعمّق"
  Numerals and case: "الأعداد والحالة الإعرابية"
  Bookish style: "الأسلوب الكتابي"
  Word order and emphasis: "ترتيب الكلمات والتوكيد"
  Negation in depth: "النفي بتعمّق"
  Registers: "مستويات الخطاب"
  Verbs in depth: "الأفعال بتعمّق"
lessons:
  ru-c1-participle-phrase:
    meaning: "عبارة اسم الفاعل بدل جملة который"
    intro: |
      الروسية المكتوبة تستبدل جملة **который** الموصولة بـ **عبارة اسم فاعل** (причастный оборот): **человек, который сидит у окна** → **человек, сидящий у окна** «الرجل الجالس عند النافذة». يأخذ اسم الفاعل جنس اسمه وعدده وحالته (**к человеку, сидящему у окна**) ويحتفظ بمفعولات الفعل وما يطلبه من حالات (**интересующийся музыкой** «المهتم بالموسيقى»).

      إذا جاءت العبارة **بعد** اسمها تُفصل بفاصلتين من الجانبين؛ وإذا جاءت **قبله** فبلا فواصل: **сидящий у окна человек**. وزمن اسم الفاعل نسبي إلى الفعل الرئيسي: **читающий** «الذي يقرأ / كان يقرأ (حينها)»، **читавший** «الذي كان قد قرأ».
    mistakes: ["اسم الفاعل يطابق اسمه: девушку في حالة المفعولية."]
  ru-c1-short-passive:
    meaning: "المجهول بأسماء المفعول القصيرة -н / -т"
    intro: |
      اسم المفعول الماضي القصير — **построен، построена، построено، построены** — مع **быть** يصوغ مجهول الأفعال التامة: **Дом был построен в 1900 году.** «بُني البيت سنة 1900». **Вопрос будет решён завтра.** «ستُحسم المسألة غدًا». وفي الحاضر تُحذف **есть**: **Магазин закрыт.** «المتجر مغلق». والفاعل، إن ذُكر، في **حالة الآلة**: **Роман написан Толстым.** «الرواية كتبها تولستوي».

      الصيغ القصيرة بنون واحدة (**решена**)، والطويلة بنونين (**решённая задача**). والأفعال الناقصة تصوغ مجهولها بـ **-ся**: **Дом строится.** «البيت قيد البناء».
  ru-c1-perfective-gerund:
    meaning: "الحال الفعلي التام: بعد أن فعل"
    intro: |
      الأفعال التامة تصوغ حالًا فعليًا بـ **-в** (**сделав** «بعد أن فعل»، **прочитав**)، و**-вшись** للأفعال الانعكاسية (**вернувшись** «بعد أن عاد»، **умывшись**)، و**-я** لبعض الجذور المنتهية بـ -д/-т (**придя** «بعد أن جاء»، **войдя**، **приведя**). ويكون الحدث قد انتهى **قبل** الحدث الرئيسي: **Сделав уроки, он пошёл гулять.** «بعد أن أنهى واجباته خرج يتنزّه».

      يجب أن يشترك الحال الفعلي مع الفعل الرئيسي في الفاعل. **Подъезжая к станции, у меня слетела шляпа** («وأنا أقترب من المحطة طارت قبعتي») مثال تشيخوف الشهير على هذا الخطأ.
    mistakes: ["من قرأ يجب أن يكون فاعل الفعل الرئيسي."]
  ru-c1-aspect-negation:
    meaning: "الجهة في النهي ومع нельзя"
    intro: |
      النهي يكون عادة بالفعل **الناقص**: **Не открывай окно!** «لا تفتح النافذة!» **Не говорите ему.** «لا تخبروه». وأمر الفعل **التام** المنفي **تحذير** من أمر قد يقع سهوًا: **Не упади!** «احذر أن تسقط!» **Смотри, не опоздай!** «انتبه ألّا تتأخر!»

      والانقسام نفسه في **нельзя**: + الناقص «غير مسموح» (**Здесь нельзя курить.**)، + التام «مستحيل» (**Эту дверь нельзя открыть.** «هذا الباب لا يمكن فتحه»).
  ru-c1-aspect-fact:
    meaning: "الناقص لمجرد الواقعة"
    intro: |
      للسؤال أو القول **هل** حدث أمر أصلًا — لا عن نتيجته — تستعمل الروسية الماضي **الناقص**، حتى لفعل واحد منجز: **Ты читал «Войну и мир»?** «هل قرأتَ الحرب والسلام؟» **Кто открывал окно?** «من فتح النافذة (في وقت ما)؟» **Я уже видел этот фильм.** «سبق أن شاهدت هذا الفيلم». هذا هو *المعنى الواقعي العام* (общефактическое значение).

      **التام** يضع **النتيجة** في البؤرة: **Ты прочитал книгу?** «هل أنهيت الكتاب؟» والنتيجة المعكوسة علامة قوية على الناقص: **Кто-то открывал окно** «فتح أحدهم النافذة (ثم أغلقها)».
  ru-c1-aspect-future-plans:
    meaning: "الجهة في المستقبل: عملية أو وعد"
    intro: |
      **буду + مصدر ناقص** يصف نشاطًا مستقبليًا أو عادة دون وعد بنتيجة: **Завтра я буду работать весь день.** «غدًا سأعمل طوال اليوم». **Я буду тебе звонить каждый день.** «سأتصل بك كل يوم». و**المضارع التام** فعل واحد له نتيجة — وعد أو خطة: **Я позвоню тебе завтра.** «سأتصل بك غدًا».

      ومع **не** كثيرًا ما يعني المستقبل التام «لن أستطيع»: **Я не найду дорогу.** «لن أجد الطريق».
  ru-c1-numeral-cases:
    meaning: "الأعداد في الحالات غير الرفعية"
    intro: |
      بعد **два، три، четыре** يأتي الاسم في الإضافة المفردة، ومن **пять** في الإضافة الجمع — لكن فقط حين يكون العدد نفسه في الرفع أو النصب. وفي كل الحالات الأخرى **يُصرَّف** العدد ويأتي الاسم **في الحالة نفسها جمعًا**: **с тремя друзьями** «مع ثلاثة أصدقاء»، **о двух книгах** «عن كتابين»، **к пяти часам** «بحلول الخامسة»، **из десяти студентов**.

      الأعداد من **пять** تُصرَّف مثل **ночь** (**пяти، пятью**)؛ و**сорок، девяносто، сто** لها صيغة واحدة غير رفعية: **сорока، девяноста، ста**. وفي الأعداد المركبة يُصرَّف كل جزء: **с двадцатью пятью рублями**.
  ru-c1-collective:
    meaning: "أعداد الجماعة وоба / обе"
    intro: |
      **двое، трое، четверо، пятеро…** تعدّ الأشخاص جماعةً، مع الإضافة الجمع: **двое детей** «طفلان»، **нас было трое** «كنا ثلاثة». وهي لازمة مع الأسماء التي لا مفرد لها (**двое суток** «يومان بليلتيهما»، **трое ножниц**) ومع **дети، люди** في الأعداد الصغيرة؛ ومع الأسماء المذكرة بديل جائز (**трое друзей / три друга**). ولا تُستعمل أبدًا مع المؤنث.

      **оба** (مذكر/محايد) و**обе** (مؤنث) تعنيان «كلا / كلتا» وتأخذان الإضافة المفردة: **оба брата، обе сестры**؛ وغير الرفعية **обоих / обеих**.
  ru-c1-approximation:
    meaning: "الأعداد التقريبية"
    intro: |
      للتقريب نحو خاص: **около** + الإضافة «نحو» (**около ста человек**)، **свыше / более** + الإضافة «أكثر من» (**свыше тысячи**)، **порядка** «في حدود»، **примерно / приблизительно** «تقريبًا». وفي الكلام **تقديم الاسم على العدد** يجعله تقريبيًا: **часа два** «ساعتان أو نحوهما» مقابل **два часа** «ساعتان».

      **полтора** (المؤنث **полторы**) «واحد ونصف» يأخذ الإضافة المفردة: **полтора часа، полторы недели**.
  ru-c1-verbal-nouns:
    meaning: "المصادر المنتهية بـ -ние بعد حروف الجر"
    intro: |
      الروسية الرسمية والعلمية تكثّف الجملة في **مصدر** منتهٍ بـ **-ание / -ение** بعد حرف جر: **после окончания университета** «بعد التخرج في الجامعة»، **при решении задачи** «عند حل المسألة»، **для улучшения условий** «لتحسين الظروف»، **до начала занятий**. مفعول الفعل في **حالة الإضافة** وفاعله في حالة الآلة: **принятие закона парламентом** «إقرار البرلمانِ القانونَ».

      والكلام اليومي يقول ذلك بجملة: **после того как он окончил университет**.
  ru-c1-derived-prepositions:
    meaning: "حروف جر مشتقة من كلمات أخرى"
    intro: |
      تستعمل النصوص الرسمية حروف جر مشتقة من الحال الفعلي والأسماء والظروف، لكل منها حالتها:

      - **благодаря** + القابلية «بفضل»، **согласно** + القابلية «وفقًا لـ»، **вопреки** + القابلية «على خلاف»
      - **несмотря на** + المفعولية «على الرغم من»
      - **вследствие**، **ввиду**، **в течение**، **в результате**، **в ходе**، **помимо**، **относительно** + الإضافة
      - **в связи с** + الآلة «فيما يتعلق بـ»

      **благодаря** للأسباب الحسنة؛ وللسيئة تُقال **из-за**: **из-за дождя** «بسبب المطر».
  ru-c1-conjunctions:
    meaning: "أدوات الربط في الأسلوب الرسمي والأدبي"
    intro: |
      إلى جانب **потому что** و**хотя**:

      - السبب: **поскольку**، **так как** «بما أنّ»، **ибо** (كتابية) «إذ إنّ»
      - المقابلة: **тогда как**، **в то время как** «في حين أنّ»، **хотя / хоть** «مع أنّ»
      - التشبيه والشك: **будто، словно، как будто** «كأنّ»، **якобы** «على حدّ زعمه»
      - الزمن: **едва** «ما إن»، **по мере того как** «بقدر ما»
      - الغاية: **для того чтобы** «لكي»

      **будто** بعد أفعال القول تُظهر شك المتكلم: **Он говорит, будто болен.** «يزعم أنه مريض (وأشكّ في ذلك)».
  ru-c2-word-order:
    meaning: "ترتيب الكلمات: الجديد في الآخر"
    intro: |
      ترتيب الكلمات في الروسية حرّ نحويًا لكن ليس دلاليًا: تبدأ الجملة بـ **المعلوم** (الموضوع) وتنتهي بـ **الجديد** (المحمول). **Девушка вошла в комнату.** «دخلت الفتاةُ الغرفة» (نعرف أيّ فتاة). **В комнату вошла девушка.** «دخلت الغرفةَ فتاةٌ» (شخص جديد). بهذا تؤدي الروسية عمل التعريف والتنكير.

      الجمل التي تبدأ بمكان أو زمان أو **вдруг** تقدّم الفعل على الفاعل عادة: **Вчера приехал мой брат.** «أمس وصل أخي». **Вдруг зазвонил телефон.** «فجأة رنّ الهاتف». وفي الكلام قد يتقدم الجديد بنبر قوي.
  ru-c2-emphatic-particles:
    meaning: "أدوات التركيز والشك والنفي"
    intro: |
      هذه الأدوات تحدّد بنية المعلومة:

      - **именно** «بالذات»: **Именно это я и хотел сказать.** «هذا بالذات ما أردت قوله».
      - **лишь، исключительно** «فقط، حصرًا»
      - **разве** و**неужели** تحوّلان الخبر إلى دهشة أو شك: **Разве ты не знал?** «ألم تكن تعرف؟» **Неужели это правда?** «أحقًا هذا صحيح؟»
      - **вовсе не، отнюдь не، ничуть не** «إطلاقًا» (отнюдь كتابية)
      - **всё-таки، всё же** «ومع ذلك»
  ru-c2-ni-concessive:
    meaning: "مهما، أيًّا كان: ни التنازلية"
    intro: |
      **ни** (لا **не**) بعد أداة استفهام، عادة مع **бы** + الماضي، تصوغ جمل «مهما»: **Что бы ты ни говорил, я не поверю.** «مهما قلتَ فلن أصدّق». **Где бы он ни был…** «أينما كان…» **Как ни старайся, не успеешь.** «مهما حاولت فلن تلحق». **Сколько ни** «مهما كثُر».

      هنا لا تنفي **ни** شيئًا؛ والجملة الرئيسية مثبتة أو منفية بذاتها. وكتابة **не** بدلها من أشيع أخطاء الإملاء عند الناطقين بالروسية.
    mistakes: ["أداة التنازل هي ни."]
  ru-c2-double-negative:
    meaning: "نفيان يعطيان إثباتًا قويًا"
    intro: |
      **не мочь не** + المصدر، **нельзя не**، **не может не** تعني «لا يسعه إلا أن، لا بد»: **Я не могу не согласиться.** «لا يسعني إلا أن أوافق». **Нельзя не признать, что…** «لا بد من الاعتراف بأنّ…» **Он не мог не заметить.** «ما كان له إلا أن يلاحظ».

      والعبارات الثابتة كذلك: **не раз** «أكثر من مرة» (لكن **ни разу** «ولا مرة»)، **не кто иной, как** «ليس سوى»، **не без** «ليس بلا»: **не без труда** «ببعض المشقة».
  ru-c2-genitive-negation:
    meaning: "الإضافة في النفي"
    intro: |
      نفي **وجود** الشيء يضعه في حالة الإضافة مع فعل محايد: **Ответа не было.** «لم يكن هناك جواب». **Писем не пришло.** «لم تصل رسائل». وبعد الأفعال المتعدية المنفية كثيرًا ما يكون المفعول في الإضافة، خاصة المجرد أو النكرة: **Он не имеет права.** «ليس له حق». **Я не вижу никакой разницы.** «لا أرى أي فرق». **не обращай внимания** «لا تلتفت».

      والمفعول المحسوس المعرّف يبقى في المفعولية: **Я не видел твою сестру.** «لم أرَ أختك». والاختيار بينهما من أدق مسائل الأسلوب الروسي.
  ru-c2-bookish:
    meaning: "كلمات قديمة وكتابية من الأسلوب الرفيع"
    intro: |
      الكتابة الرسمية والقانونية والدينية والساخرة تحتفظ بكلمات هجرها الكلام: **ибо** «إذ إنّ»، **дабы** «لكي» (= чтобы)، **нежели** «من» في المقارنة (= чем)، **сей، сия، сие** «هذا» (**до сих пор** «حتى الآن»، **сию минуту** «في التوّ»)، **оный** «المذكور»، **ежели** «إن»، **коль скоро** «طالما أنّ»، **отнюдь** «قطعًا».

      وفي الحديث اليومي تبدو متكلّفة أو مازحة: **Сие мне неведомо.** «هذا مما لا علم لي به» (بجدية مصطنعة).
  ru-c2-colloquial:
    meaning: "أدوات اللغة المحكية"
    intro: |
      للكلام أدواته الخاصة، النادرة في الكتابة:

      - **мол، дескать** تشيران إلى كلام الغير، غالبًا بتشكيك: **Он сказал, мол, занят.** «قال إنه مشغول، على حدّ قوله».
      - **небось** «أراهن، على الأرجح»: **Устал небось?** «تعبتَ، أليس كذلك؟»
      - **авось** «لعلها تمشي» — **на авось** «على البركة»، موقف روسي مضروب به المثل
      - **ну، вот، вон، ладно، давай**: التردد، الإشارة، الموافقة، «هيّا»
      - **-ка** تليّن الأمر: **Покажи-ка!** «هاتِ أرِني!»
  ru-c2-expressive-suffixes:
    meaning: "لواحق الحجم والعاطفة"
    intro: |
      لواحق التصغير والتكبير تحمل الموقف أكثر من الحجم:

      - التحبّب: **-ик، -чик** (**домик، стульчик**)، **-ок / -ек** (**сынок، пирожок**)، **-очк- / -ечк-** (**чашечка، минуточка**)، **-еньк- / -оньк-** في الصفات (**маленький، тихонько**)
      - **-ушк- / -юшк-** للمودة بالأسلوب الشعبي (**бабушка، солнышко**)
      - التكبير أو الخشونة: **-ищ-** (**домище** «بيت ضخم»، **ручища**)
      - التحقير: **-ишк-** (**домишко** «بُيَيت بائس»)

      النُّدُل والباعة يقولون **минуточку، хлебушек، чаёк** ليبدوا ودودين.
  ru-c2-prefix-meanings:
    meaning: "سوابق تضيف هيئة الحدث"
    intro: |
      إلى جانب جعل الفعل تامًّا، تضيف السوابق ظلالًا دقيقة (*هيئات الحدث*):

      - **до-** حتى النهاية: **дочитать** «أكمل القراءة»
      - **пере-** إعادة أو إفراط: **переделать** «أعاد العمل»، **переесть** «أفرط في الأكل»
      - **недо-** تقصير: **недооценить** «بخس القيمة»
      - **за-** البدء: **заплакать** «انفجر باكيًا»؛ **по-** مدة قصيرة: **поговорить** «تحدّث قليلًا»
      - **на- … -ся** حتى الشبع: **наесться** «شبع»، **выспаться** «نال كفايته من النوم»
      - **раз- … -ся** الاندفاع: **разговориться** «انطلق في الحديث»
  ru-c2-figurative-motion:
    meaning: "أفعال الحركة في المعنى المجازي"
    intro: |
      **идти** تصف أشياء كثيرة لا تمشي: **идёт дождь / снег** «تمطر / تثلج»، **идёт фильм** «يُعرض فيلم»، **часы идут** «الساعة تعمل»، **время идёт** «الوقت يمضي»، **речь идёт о…** «الحديث عن…»، **Тебе идёт эта шапка.** «هذه القبعة تليق بك». وتتبعها أفعال حركة أخرى: **время летит** «الوقت يطير»، **слухи ходят** «الشائعات تدور»، **автобус ходит** «الحافلة تسيّر» (خط منتظم: متعدد الاتجاهات).
  ru-c2-impersonal-verbs:
    meaning: "الأفعال غير الشخصية وبنية «القوى الطبيعية»"
    intro: |
      بعض الأفعال بلا فاعل أصلًا:

      - الطبيعة: **темнеет** «يحلّ الظلام»، **светает** «يطلع الفجر»، **морозит**
      - الحالات، والشخص في المفعولية: **меня тошнит** «أشعر بالغثيان»، **его знобит** «تعتريه قشعريرة»
      - القابلية + **-ся**، رغبة أو قدرة «تحدث» للمرء: **мне не спится** «لا يأتيني النوم»، **ему не работается** «لا يقدر على العمل»
      - بنية «القوى الطبيعية»، والقوة في حالة الآلة: **Лодку унесло ветром.** «جرفت الريحُ القارب». **Его ранило.** «أُصيب».
      - الحظ: **ему везёт / повезло** «هو محظوظ / حالفه الحظ»
  ru-c2-imperative-politeness:
    meaning: "الجهة في الأمر: دعوة أو أمر"
    intro: |
      في الأمر المثبت يكون **التام** هو الطلب المحايد لفعل واحد: **Сядьте.** «اجلسوا». **Закройте дверь.** أما **الناقص** فيستعمله المضيف — دعوة لفعل ما هو متوقع: **Садитесь, пожалуйста!** «تفضّلوا بالجلوس!» **Проходите, раздевайтесь.** «تفضّلوا بالدخول وانزعوا معاطفكم». **Угощайтесь!** «تفضّلوا كُلوا!»

      وقد يحثّ الناقص على البدء في أمر متفق عليه: **Ну, рассказывайте!** «هيّا، احكِ!» والتام الموجّه إلى ضيف قد يبدو أمرًا.
