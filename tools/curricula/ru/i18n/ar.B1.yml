# Arabic text of the Russian course, B1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The plural cases: "حالات الجمع"
  Prefixed motion, 'would', relative clauses: "أفعال الحركة بالسوابق، والشرط، والجمل الموصولة"
  Joining sentences: "ربط الجمل"
lessons:
  ru-genitive-plural:
    meaning: "حالة الإضافة في الجمع"
    intro: |
      الإضافة في الجمع أصعب الصيغ: الجذور المذكرة الصلبة **-ов** (**столов**)، والجذور الليّنة والصفيرية **-ей** (**дней، ножей**)، والجذور المنتهية بـ **-й** **-ев** (**музеев**)؛ أما المؤنث والمحايد فغالبًا **بلا لاحقة** (**книга → книг**، **окно → окон**، مع إقحام صائت عند الحاجة: **девушка → девушек**). وتأتي بعد الأعداد من خمسة، و**много / мало / сколько / несколько**، و**нет**.
  ru-plural-cases:
    meaning: "القابلية والآلة وحالة حروف الجر في الجمع"
    intro: |
      بخلاف المفرد، بقية حالات الجمع واحدة لكل الأجناس: القابلية **-ам / -ям**، والآلة **-ами / -ями**، وحالة حروف الجر **-ах / -ях**: **друзьям، друзьями، о друзьях**؛ **книгам، книгами، о книгах**.
  ru-prefixed-motion:
    meaning: "أفعال الحركة بالسوابق"
    intro: |
      السوابق تعطي الاتجاه: **при-** الوصول (**прийти** «يصل»)، **у-** المغادرة (**уйти** «يغادر»)، **в-** الدخول (**войти**)، **вы-** الخروج (**выйти**)، **пере-** العبور (**перейти**)، **под-** الاقتراب (**подойти**)، **за-** المرور بمكان (**зайти**)، **от-** الابتعاد (**отойти**). ومع **идти** تصوغ أفعالًا تامة (**прийти / приходить**)؛ ومع **ехать** **приехать / приезжать**.
  ru-conditional:
    meaning: "الشرط: الماضي + бы"
    intro: |
      **бы** + صيغة **الماضي** تصوغ الشرط لأي زمن: **Я бы пошёл** «لذهبتُ»؛ **Если бы я знал, я бы сказал.** «لو عرفتُ لقلتُ». وتمنٍّ مهذّب: **Я бы хотел кофе.** «أودّ قهوة».
    mistakes: ["бы مع صيغة الماضي؛ وفي جملة الشرط تأتي بعد если."]
  ru-kotoryj:
    meaning: "الجمل الموصولة بـ который"
    intro: |
      **который** «الذي» يطابق اسمه في **الجنس والعدد** لكنه يأخذ **حالته** من جملته: **человек, который живёт здесь** «الرجل الذي يسكن هنا»؛ **человек, которого я видел** «الرجل الذي رأيتُه»؛ **книга, о которой я говорил** «الكتاب الذي تحدثتُ عنه». والفاصلة تفصل الجملة دائمًا.
  ru-chtoby:
    meaning: "что (أنّ) وчтобы (لكي، أن)"
    intro: |
      **что** تقدّم الخبر: **Я знаю, что он дома.** «أعرف أنه في البيت». و**чтобы** تقدّم الغاية أو الرغبة — مع **المصدر** إذا اتحد الفاعل (**Я пришёл, чтобы помочь** «جئتُ لأساعد»)، ومع **صيغة الماضي** إذا اختلف (**Я хочу, чтобы ты пришёл** «أريدك أن تأتي»).
    mistakes: ["رغبة تخص شخصًا آخر: чтобы + الماضي."]
  ru-conjunctions:
    meaning: "أدوات الربط: لأن، إذا، حين، مع أن"
    intro: |
      **потому что** لأن، **так как** بما أن، **поэтому** لذلك، **если** إذا، **когда** حين، **хотя** مع أن، **пока** بينما / حتى (مع **не**)، **как только** ما إن، **а** و / أما (للمقابلة)، **но** لكن، **или** أو، **ли** هل (**Я не знаю, придёт ли он** «لا أعرف هل سيأتي»).
