# German text of the Russian course, A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Letters and sounds: "Buchstaben und Laute"
  Nouns and gender: "Nomen und Genus"
  Pronouns, 'to be' and questions: "Pronomen, „sein“ und Fragen"
  The present tense: "Das Präsens"
  "Cases I: where and what": "Kasus I: wo und was"
  Numbers: "Zahlen"
lessons:
  ru-alphabet:
    meaning: "das Alphabet, Betonung und reduzierte Vokale"
    intro: |
      Das Russische hat 33 Buchstaben. Manche sehen aus und klingen wie lateinische (**а, к, м, о, т**), manche sehen lateinisch aus, klingen aber anders (**в** = w, **н** = n, **р** = r, **с** = s, **у** = u, **х** = ch), und manche sind neu: **б, г, д, ж, з, л, п, ф, ц, ч, ш, щ, ы, э, ю, я, ь, ъ**.

      **я, ю, е, ё** sind „weiche“ Vokale, die am Wortanfang oder nach einem Vokal ein *j* vor den Vokal setzen (**я** = ja) und sonst den Konsonanten davor erweichen. **ь** (Weichheitszeichen) erweicht den Konsonanten davor; **ъ** (Härtezeichen) trennt. **ы** ist ein Vokal ohne deutsche Entsprechung (sprich *i* mit zurückgezogener Zunge).

      Die **Betonung** ist frei und wird in gewöhnlichen Texten nicht geschrieben (Casus’ Tabellen markieren sie: **сто́л, кни́га**). Unbetontes **о** klingt wie *a* (**молоко́** *malakó*), unbetontes **е, я** wie *i*.
    mistakes: ["Unbetontes о wird a gesprochen."]
  ru-gender:
    meaning: "Genus: maskulin, feminin, neutral"
    intro: |
      Das Russische hat keine Artikel, aber jedes Nomen hat ein Genus, das die Endung zeigt:

      - **maskulin**: Konsonant oder **-й** — **стол** (Tisch), **музей** (Museum); auch Männer auf **-а / -я**: **папа**, **дядя**
      - **feminin**: **-а / -я** — **мама**, **неделя** (Woche)
      - **neutral**: **-о / -е / -ё** — **окно** (Fenster), **море** (Meer); und Nomen auf **-мя**: **имя** (Name)
      - Nomen auf **-ь** können maskulin (**день**, Tag) oder feminin (**ночь**, Nacht) sein — lerne sie mit dem Wort

      Adjektive, Possessive und das Präteritum richten sich nach dem Genus.
    mistakes: ["мама endet auf -а: feminin."]
  ru-plural:
    meaning: "der Plural (Nominativ)"
    intro: |
      Maskulina und Feminina nehmen **-ы**, oder **-и** nach **г к х ж ш щ ч** und nach weichen Stämmen: **стол → столы**, **мама → мамы**, **книга → книги**, **день → дни**. Neutra nehmen **-а / -я**: **окно → окна**, **море → моря**. Manche Maskulina nehmen betontes **-а**: **дом → дома́**, **город → города́**. Unregelmäßig: **человек → люди**, **ребёнок → дети**, **друг → друзья**.
    mistakes: ["Nach г к х: -и, nie -ы (Rechtschreibregel)."]
  ru-noun-table:
    meaning: "die sechs Kasus: ein Überblick"
    intro: |
      Russische Nomen ändern ihre Endung in **sechs Kasus**: Nominativ (Subjekt), Genitiv (*von*, nach **нет**, Zahlen, vielen Präpositionen), Dativ (*an, für*), Akkusativ (direktes Objekt, *in … hinein* mit **в/на**), Instrumental (*mit, durch*, nach **с**) und Präpositiv (nur nach Präpositionen: **в, на, о**). Die nächsten Lektionen nehmen sie einzeln durch; hier drei Nomen vollständig.
  ru-pronouns:
    meaning: "Personalpronomen; kein „sein“ im Präsens"
    intro: |
      **я** ich, **ты** du, **он / она / оно** er / sie / es, **мы** wir, **вы** ihr / Sie, **они** sie (Pl.).

      Im Präsens wird *sein* nicht ausgedrückt: **Я студент.** „Ich (bin) Student.“ **Это мой брат.** „Das (ist) mein Bruder.“ In der Schrift ersetzt es oft ein Gedankenstrich zwischen zwei Nomen: **Москва — столица России.**
    mistakes: ["Kein Verb „sein“ im Präsens."]
  ru-possessives:
    meaning: "Possessive: mein, dein, unser"
    intro: |
      **мой** (mein), **твой** (dein), **наш** (unser), **ваш** (euer, Ihr) richten sich nach dem Besessenen: **мой брат**, **моя сестра**, **моё окно**, **мои книги**. **его** (sein), **её** (ihr) und **их** (ihr, Pl.) ändern sich nie: **его сестра**, **их дом**. **свой** bedeutet „sein eigener“ und bezieht sich auf das Subjekt.
    mistakes: ["Nach dem Besessenen richten."]
  ru-questions:
    meaning: "Fragewörter"
    intro: |
      **кто** wer, **что** was, **где** wo, **куда** wohin, **откуда** woher, **когда** wann, **почему / зачем** warum / wozu, **как** wie, **сколько** wie viel, **какой** welcher, was für ein, **чей** wessen. Eine Ja/Nein-Frage behält die Wortstellung der Aussage und ändert nur die Intonation: **Ты дома?**
  ru-present-1:
    meaning: "erste Konjugation: -ю/-у, -ешь"
    intro: |
      Die meisten Verben auf **-ать / -ять** gehören zur **ersten Konjugation**: **-ть** weg und **-ю, -ешь, -ет, -ем, -ете, -ют** anhängen. Das Präsens deckt auch *ich lese gerade* und *ich lese (gewöhnlich)* ab. Manche Verben der ersten Konjugation ändern ihren Stamm: **писать → пишу, пишешь**; **жить → живу, живёшь**.
    mistakes: ["Ich: -ю."]
  ru-present-2:
    meaning: "zweite Konjugation: -ю/-у, -ишь"
    intro: |
      Die meisten Verben auf **-ить** (und manche auf -еть, -ать) nehmen **-ю, -ишь, -ит, -им, -ите, -ят**: **говорить → говорю, говоришь, говорят**. In der 1. Person Singular wechseln manche Konsonanten: **видеть → вижу, видишь**; **любить → люблю, любишь**; **сидеть → сижу**.
  ru-prepositional:
    meaning: "der Präpositiv: wo, worüber"
    intro: |
      Nach **в** (in) und **на** (auf, an) für den Ort und **о / об** (über) stehen Nomen im **Präpositiv**: meist **-е** — **Москва → в Москве**, **стол → на столе**, **работа → на работе**; Nomen auf **-ия, -ие** und Feminina auf **-ь** nehmen **-и**: **Россия → в России**, **тетрадь → в тетради**.

      **на** steht bei offenen Flächen, Ereignissen und manchen Orten nach Konvention: **на улице, на концерте, на работе, на почте**.
    mistakes: ["Nomen auf -ия nehmen -и."]
  ru-accusative:
    meaning: "der Akkusativ: das direkte Objekt"
    intro: |
      Das direkte Objekt steht im **Akkusativ**. Feminina auf **-а / -я** werden zu **-у / -ю**: **мама → маму**, **неделя → неделю**. Maskuline und neutrale **Dinge** bleiben unverändert: **Я вижу стол / окно**. Maskuline **Personen und Tiere** nehmen die Genitivform: **Я вижу брата**. Nach **в / на** bei Bewegung (*wohin?*) ebenfalls Akkusativ: **Я иду в школу.**
    mistakes: ["Objekt von люблю: Akkusativ."]
  ru-numbers:
    meaning: "Zahlen und das Nomen danach"
    intro: |
      **один / одна / одно** richtet sich wie ein Adjektiv. Nach **два / две, три, четыре** steht das Nomen im **Genitiv Singular**: **два стола**, **три книги**. Ab **пять** im **Genitiv Plural**: **пять столов**, **десять книг**. Zusammengesetzte Zahlen richten sich nach ihrem letzten Wort: **двадцать один стол**, **двадцать два стола**, **двадцать пять столов**.
    mistakes: ["Ab fünf: Genitiv Plural."]
