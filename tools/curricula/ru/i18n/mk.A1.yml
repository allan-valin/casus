# Macedonian text of the Russian course, A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Letters and sounds: "Букви и гласови"
  Nouns and gender: "Именки и род"
  Pronouns, 'to be' and questions: "Заменки, „сум“ и прашања"
  The present tense: "Сегашно време"
  "Cases I: where and what": "Падежи I: каде и што"
  Numbers: "Броеви"
lessons:
  ru-alphabet:
    meaning: "азбуката, акцентот и редуцираните самогласки"
    intro: |
      Рускиот има 33 букви. Повеќето ги знаеш од македонската кирилица; новите или различните се: **ы, э, ю, я, ё, щ, ь, ъ, й** и **г** (секогаш *г*, не *ѓ*). Македонските **ѓ, ќ, ѕ, ј, љ, њ, џ** ги нема.

      **я, ю, е, ё** се „меки“ самогласки што ставаат *ј* пред самогласката на почетокот на зборот или по самогласка (**я** = ја), а инаку ја омекнуваат согласката пред нив (**нё** ≈ *њо*). **ь** (мек знак) ја омекнува согласката пред него (**конь** ≈ *коњ*); **ъ** (тврд знак) раздвојува. **ы** е самогласка што ја нема во македонскиот (кажи *и* со повлечен јазик). **е** на почетокот се чита *је*, а **э** е обичното *е*.

      **Акцентот** е слободен и не се пишува во обичните текстови (табелите на Casus го означуваат: **сто́л, кни́га**) — не е на третиот слог од крајот како во македонскиот. Ненагласеното **о** звучи како *а* (**молоко́** *малако́*), ненагласените **е, я** како *и*.
    mistakes: ["Ненагласеното о се изговара а."]
  ru-gender:
    meaning: "род: машки, женски, среден"
    intro: |
      Рускиот нема членови — ниту наставки како **-от, -та** — но секоја именка има род што го покажува наставката:

      - **машки**: согласка или **-й** — **стол** (маса), **музей** (музеј); и мажи на **-а / -я**: **папа**, **дядя**
      - **женски**: **-а / -я** — **мама**, **неделя** (недела)
      - **среден**: **-о / -е / -ё** — **окно** (прозорец), **море** (море); и именки на **-мя**: **имя** (име)
      - именките на **-ь** може да се машки (**день**, ден) или женски (**ночь**, ноќ) — учи ги со зборот

      Придавките, присвојните заменки и минатото време се согласуваат по род.
    mistakes: ["мама завршува на -а: женски род."]
  ru-plural:
    meaning: "множина (номинатив)"
    intro: |
      Машките и женските именки земаат **-ы**, или **-и** по **г к х ж ш щ ч** и по меки основи: **стол → столы**, **мама → мамы**, **книга → книги**, **день → дни**. Средните земаат **-а / -я**: **окно → окна**, **море → моря**. Некои машки земаат нагласено **-а**: **дом → дома́**, **город → города́**. Неправилни: **человек → люди**, **ребёнок → дети**, **друг → друзья**.
    mistakes: ["По г к х: -и, никогаш -ы (правописно правило)."]
  ru-noun-table:
    meaning: "шесте падежи: преглед"
    intro: |
      За разлика од македонскиот, руските именки ја менуваат наставката во **шест падежи**: номинатив (подмет), генитив (*на, од*, по **нет**, броеви, многу предлози), датив (*на, за*), акузатив (директен објект, *во / на* со **в/на** за движење), инструментал (*со, преку*, по **с**) и предлошки (само по предлози: **в, на, о**). Следните лекции ги земаат еден по еден; тука се три именки целосно.
  ru-pronouns:
    meaning: "лични заменки; нема „сум“ во сегашно"
    intro: |
      **я** јас, **ты** ти, **он / она / оно** тој / таа / тоа, **мы** ние, **вы** вие (и учтиво), **они** тие.

      Во сегашно време *сум* не се кажува: **Я студент.** „Јас (сум) студент.“ **Это мой брат.** „Ова (е) мојот брат.“ Во пишувањето често го заменува цртичка меѓу две именки: **Москва — столица России.**
    mistakes: ["Нема глагол „сум“ во сегашно време."]
  ru-possessives:
    meaning: "присвојни: мој, твој, наш"
    intro: |
      **мой** (мој), **твой** (твој), **наш** (наш), **ваш** (ваш) се согласуваат со поседуваното, без член: **мой брат**, **моя сестра**, **моё окно**, **мои книги**. **его** (негов), **её** (нејзин) и **их** (нивни) никогаш не се менуваат: **его сестра**, **их дом**. **свой** значи „свој“ и се однесува на подметот.
    mistakes: ["Согласувај со поседуваната именка."]
  ru-questions:
    meaning: "прашални зборови"
    intro: |
      **кто** кој, **что** што, **где** каде, **куда** каде (кон), **откуда** од каде, **когда** кога, **почему / зачем** зошто / за што, **как** како, **сколько** колку, **какой** каков, кој, **чей** чиј. Прашањето со да/не го задржува редот на изјавата и ја менува само интонацијата (нема **ли** како во македонскиот, освен во книжевен стил): **Ты дома?**
  ru-present-1:
    meaning: "прва конјугација: -ю/-у, -ешь"
    intro: |
      Руските глаголи се наведуваат во **инфинитив** (**-ть**), кој македонскиот го нема. Повеќето глаголи на **-ать / -ять** се од **првата конјугација**: отстрани **-ть** и додај **-ю, -ешь, -ет, -ем, -ете, -ют**. Сегашното значи и *сега читам* и *читам (обично)*. Некои глаголи ја менуваат основата: **писать → пишу, пишешь**; **жить → живу, живёшь**.
    mistakes: ["Јас: -ю."]
  ru-present-2:
    meaning: "втора конјугација: -ю/-у, -ишь"
    intro: |
      Повеќето глаголи на **-ить** (и некои на -еть, -ать) земаат **-ю, -ишь, -ит, -им, -ите, -ят**: **говорить → говорю, говоришь, говорят**. Во 1 лице еднина некои согласки се менуваат: **видеть → вижу, видишь**; **любить → люблю, любишь**; **сидеть → сижу**.
  ru-prepositional:
    meaning: "предлошкиот падеж: каде, за што"
    intro: |
      По **в** (во) и **на** (на, кај) за место, и **о / об** (за), именките се во **предлошки падеж**: обично **-е** — **Москва → в Москве**, **стол → на столе**, **работа → на работе**; именките на **-ия, -ие** и женските на **-ь** земаат **-и**: **Россия → в России**, **тетрадь → в тетради**.

      **на** оди со отворени простори, настани и некои места по навика — често исто како македонското **на**: **на улице, на концерте, на работе, на почте**.
    mistakes: ["Именките на -ия земаат -и."]
  ru-accusative:
    meaning: "акузативот: директниот објект"
    intro: |
      Директниот објект е во **акузатив**. Женските на **-а / -я** стануваат **-у / -ю**: **мама → маму**, **неделя → неделю**. Машките и средните **предмети** остануваат исти: **Я вижу стол / окно**. Машките **луѓе и животни** ја земаат генитивната форма: **Я вижу брата**. По **в / на** за движење (*каде?*) исто акузатив: **Я иду в школу.**
    mistakes: ["Објект на люблю: акузатив."]
  ru-numbers:
    meaning: "броевите и именката по нив"
    intro: |
      **один / одна / одно** се согласува како придавка. По **два / две, три, четыре** именката е во **генитив еднина**: **два стола** (спореди македонското **два стола**!), **три книги**. Од **пять** натаму, **генитив множина**: **пять столов**, **десять книг**. Сложените броеви се водат по последниот збор: **двадцать один стол**, **двадцать два стола**, **двадцать пять столов**.
    mistakes: ["Од пет: генитив множина."]
