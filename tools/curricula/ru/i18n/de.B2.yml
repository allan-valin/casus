# German text of the Russian course, B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Participles and gerunds: "Partizipien und Adverbialpartizipien"
  Impersonal sentences, negation, particles: "Unpersönliche Sätze, Verneinung, Partikeln"
lessons:
  ru-participles:
    meaning: "Partizipien: der Lesende, das Gelesene"
    intro: |
      Partizipien sind Adjektive aus Verben, häufig in der Schriftsprache: Präsens aktiv **-ущ- / -ющ- / -ащ- / -ящ-** (**читающий** „lesend, der liest“), Präteritum aktiv **-вш- / -ш-** (**читавший**), Präsens passiv **-ем- / -им-** (**любимый** „geliebt, Lieblings-“), Präteritum passiv **-нн- / -т-** (**прочитанный** „gelesen“, **открытый** „geöffnet“). Sie kongruieren wie Adjektive; die Kurzform des Partizips Präteritum Passiv bildet das Passiv: **Книга прочитана.**
  ru-gerunds:
    meaning: "Adverbialpartizipien: während, nachdem"
    intro: |
      Adverbialpartizipien (**деепричастия**) sind unveränderlich und sagen, was das Subjekt noch tut: imperfektiv **-я / -а** „während“ (**читая** „lesend“), perfektiv **-в / -вши** „nachdem“ (**прочитав** „nachdem er gelesen hatte“). **Возвращаясь домой, я встретил друга.** „Auf dem Heimweg traf ich einen Freund.“
  ru-impersonal:
    meaning: "unpersönliche Sätze"
    intro: |
      Viele Aussagen haben gar kein Subjekt; die Person steht im **Dativ**: **Мне холодно** „mir ist kalt“, **Тебе надо / нужно идти** „du musst gehen“, **Здесь можно курить?** „Darf man hier rauchen?“, **Нельзя** „verboten / unmöglich“, **Мне кажется** „mir scheint“. In Vergangenheit und Zukunft mit **было / будет**: **Мне было скучно.**
  ru-negatives:
    meaning: "Negativpronomen und doppelte Verneinung"
    intro: |
      **никто** niemand, **ничто / ничего** nichts, **нигде** nirgends, **никогда** nie, **никакой** kein (einziger) — immer mit **не** am Verb: **Никто не знает.** „Niemand weiß es.“ **Я ничего не вижу.** „Ich sehe nichts.“ Mit einer Präposition wird das Wort geteilt: **ни с кем** „mit niemandem“.
  ru-particles:
    meaning: "Partikeln, die einen Satz färben"
    intro: |
      **же** Betonung (**Это же просто!** „Das ist doch einfach!“), **ли** Frage / ob, **ведь** „schließlich, doch“, **уже** schon, **ещё** noch / mehr, **даже** sogar, **только** nur. Die Suffixe **-то** und **-нибудь** bilden Indefinita: **кто-то** „jemand (Bestimmtes)“, **кто-нибудь** „irgendwer (egal wer)“.
