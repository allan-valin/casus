# Macedonian text of the Russian course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Participle and gerund phrases: "Партиципски и прилошки конструкции"
  Aspect in depth: "Видот подлабоко"
  Numerals and case: "Броеви и падеж"
  Bookish style: "Книжевен стил"
  Word order and emphasis: "Ред на зборовите и нагласување"
  Negation in depth: "Негацијата подлабоко"
  Registers: "Регистри"
  Verbs in depth: "Глаголите подлабоко"
lessons:
  ru-c1-participle-phrase:
    meaning: "партиципската конструкција наместо реченица со который"
    intro: |
      Пишаниот руски ја заменува реченицата со **который** со **партиципска конструкција** (причастный оборот): **человек, который сидит у окна** → **человек, сидящий у окна** „човекот што седи до прозорецот“. Партиципот ги зема родот, бројот и падежот на именката (**к человеку, сидящему у окна**) и ги задржува објектите и рекцијата на глаголот (**интересующийся музыкой** „заинтересиран за музика“).

      Ставена **по** именката, конструкцијата се одделува со запирки од двете страни; **пред** неа, без запирки: **сидящий у окна человек**. Времето на партиципот е релативно кон главниот глагол: **читающий** „кој (во тој миг) чита/читаше“, **читавший** „кој читал“.
    mistakes: ["Партиципот се согласува со именката: девушку е во акузатив."]
  ru-c1-short-passive:
    meaning: "пасивот со кратки партиципи на -н / -т"
    intro: |
      Краткиот минат пасивен партицип — **построен, построена, построено, построены** — со **быть** го гради пасивот на свршените глаголи: **Дом был построен в 1900 году.** „Куќата беше изградена во 1900 година.“ **Вопрос будет решён завтра.** „Прашањето ќе биде решено утре.“ Во сегашно **есть** се изостава: **Магазин закрыт.** „Продавницата е затворена.“ Вршителот, ако се спомнува, е во **инструментал**: **Роман написан Толстым.**

      Кратките форми имаат едно **н** (**решена**), долгите две (**решённая задача**). Несвршените глаголи го градат пасивот со **-ся**: **Дом строится.** „Куќата се гради.“
  ru-c1-perfective-gerund:
    meaning: "свршениот глаголски прилог: откако направил"
    intro: |
      Свршените глаголи градат глаголски прилог на **-в** (**сделав** „откако направи“, **прочитав**), **-вшись** за повратни (**вернувшись** „откако се врати“, **умывшись**) и **-я** кај некои основи на -д/-т (**придя** „откако дојде“, **войдя**, **приведя**). Дејството е завршено **пред** главното: **Сделав уроки, он пошёл гулять.** „Откако ги заврши домашните, отиде на прошетка.“

      Прилогот мора да го дели подметот со главниот глагол. **Подъезжая к станции, у меня слетела шляпа** („Приближувајќи се кон станицата, ми излета шапката“) е познатиот пример на Чехов за грешката.
    mistakes: ["Оној што читал мора да биде подмет на главниот глагол."]
  ru-c1-aspect-negation:
    meaning: "видот во одречни заповеди и со нельзя"
    intro: |
      Одречната заповед е обично **несвршена**: **Не открывай окно!** „Не отворај го прозорецот!“ **Не говорите ему.** „Не кажувајте му.“ Одречен **свршен** императив е **предупредување** за нешто што може да се случи случајно: **Не упади!** „Внимавај да не паднеш!“ **Смотри, не опоздай!** „Гледај да не задоцниш!“

      Истата поделба важи за **нельзя**: + несвршен „не е дозволено“ (**Здесь нельзя курить.**), + свршен „невозможно е“ (**Эту дверь нельзя открыть.** „Оваа врата не може да се отвори.“).
  ru-c1-aspect-fact:
    meaning: "несвршениот вид за самиот факт"
    intro: |
      За да се праша или каже **дали** нешто воопшто се случило — не неговиот резултат — рускиот користи **несвршено** минато, дури и за едно завршено дејство: **Ты читал «Войну и мир»?** „Дали си ја читал Војна и мир?“ **Кто открывал окно?** „Кој го отворал прозорецот?“ **Я уже видел этот фильм.** „Веќе го имам гледано овој филм.“ Тоа е *општофактичкото* значење (общефактическое значение).

      **Свршениот** го става **резултатот** во фокус: **Ты прочитал книгу?** „Ја прочита ли книгата (до крај)?“ Поништен резултат е силен знак за несвршениот: **Кто-то открывал окно** „некој го отворал прозорецот (и пак го затворил)“.
  ru-c1-aspect-future-plans:
    meaning: "видот во иднината: процес или ветување"
    intro: |
      **буду + несвршен инфинитив** опишува идна активност или навика, без ветен резултат: **Завтра я буду работать весь день.** „Утре ќе работам цел ден.“ **Я буду тебе звонить каждый день.** „Ќе ти се јавувам секој ден.“ **Свршеното сегашно** е еднократно дејство со резултат — ветување или план: **Я позвоню тебе завтра.** „Ќе ти се јавам утре.“

      Со **не**, свршеното идно често значи „не можам, нема да успеам“: **Я не найду дорогу.** „Нема да го најдам патот.“
  ru-c1-numeral-cases:
    meaning: "броевите во косите падежи"
    intro: |
      По **два, три, четыре** именката е во генитив еднина, а од **пять** во генитив множина — но само кога самиот број е во номинатив или акузатив. Во сите други падежи бројот **се менува**, а именката стои во **истиот падеж, множина**: **с тремя друзьями** „со тројца пријатели“, **о двух книгах** „за две книги“, **к пяти часам** „до пет часот“, **из десяти студентов**.

      Броевите од **пять** се менуваат како **ночь** (**пяти, пятью**); **сорок, девяносто, сто** имаат само една коса форма: **сорока, девяноста, ста**. Во сложените броеви секој дел се менува: **с двадцатью пятью рублями**.
  ru-c1-collective:
    meaning: "збирни броеви и оба / обе"
    intro: |
      **двое, трое, четверо, пятеро…** бројат луѓе како група, со генитив множина — слично на македонските **двајца, тројца**: **двое детей** „две деца“, **нас было трое** „бевме тројца“. Задолжителни се со именки без еднина (**двое суток** „две деноноќија“, **трое ножниц**) и со **дети, люди** во мали броеви; со машки именки се алтернатива (**трое друзей / три друга**). Никогаш не се користат со женски именки.

      **оба** (м./ср.) и **обе** (ж.) значат „двата / двете“ и земаат генитив еднина: **оба брата, обе сестры**; коси форми **обоих / обеих**.
  ru-c1-approximation:
    meaning: "приближни броеви"
    intro: |
      Приближноста има своја граматика: **около** + генитив „околу“ (**около ста человек**), **свыше / более** + генитив „над“ (**свыше тысячи**), **порядка** „од редот на“, **примерно / приблизительно** „приближно“. Во говорот, **именката пред бројот** го прави приближен: **часа два** „некои два часа“ наспроти **два часа** „два часа“.

      **полтора** (ж. **полторы**) „еден и пол“ зема генитив еднина: **полтора часа, полторы недели**.
  ru-c1-verbal-nouns:
    meaning: "глаголски именки на -ние по предлози"
    intro: |
      Формалниот и научниот руски ја збива реченицата во **глаголска именка** на **-ание / -ение** по предлог — како македонските **-ње**: **после окончания университета** „по завршувањето на факултетот“, **при решении задачи** „при решавањето на задачата“, **для улучшения условий** „за подобрување на условите“, **до начала занятий**. Објектот на глаголот оди во **генитив**, а подметот во инструментал: **принятие закона парламентом** „донесувањето на законот од парламентот“.

      Во говорот истото се кажува со реченица: **после того как он окончил университет**.
  ru-c1-derived-prepositions:
    meaning: "предлози настанати од други зборови"
    intro: |
      Формалните текстови користат предлози настанати од глаголски прилози, именки и прилози, секој со свој падеж:

      - **благодаря** + дат. „благодарение на“, **согласно** + дат. „согласно“, **вопреки** + дат. „спротивно на“
      - **несмотря на** + акуз. „и покрај“
      - **вследствие**, **ввиду**, **в течение**, **в результате**, **в ходе**, **помимо**, **относительно** + ген.
      - **в связи с** + инстр. „во врска со“

      **благодаря** е за добри причини; за лоши се вели **из-за**: **из-за дождя** „поради дождот“.
  ru-c1-conjunctions:
    meaning: "сврзници на формалниот и книжевниот стил"
    intro: |
      Покрај **потому что** и **хотя**:

      - причина: **поскольку**, **так как** „бидејќи“, **ибо** (книжевно) „зашто“
      - спротивставување: **тогда как**, **в то время как** „додека, а“, **хотя / хоть** „иако“
      - споредба и сомнение: **будто, словно, как будто** „како да“, **якобы** „наводно“
      - време: **едва** „едвај, штом“, **по мере того как** „колку што“
      - цел: **для того чтобы** „за да“

      **будто** по глаголи на кажување покажува дека говорникот се сомнева: **Он говорит, будто болен.** „Вели дека е болен (се сомневам).“ — слично на македонската л-форма.
  ru-c2-word-order:
    meaning: "редот на зборовите: новото доаѓа на крај"
    intro: |
      Рускиот ред на зборови е граматички слободен, но не и по значење: реченицата почнува од **познатото** (темата) и завршува со **новото** (ремата). **Девушка вошла в комнату.** „Девојката влезе во собата“ (знаеме која). **В комнату вошла девушка.** „Во собата влезе една девојка“ (ново лице). Така рускиот ја врши работата на македонскиот член и на **еден**.

      Речениците што почнуваат со место, време или **вдруг** обично го ставаат глаголот пред подметот: **Вчера приехал мой брат.** „Вчера пристигна брат ми.“ **Вдруг зазвонил телефон.** „Одеднаш заѕвони телефонот.“ Во говорот новото може да дојде и прво, со силен акцент.
  ru-c2-emphatic-particles:
    meaning: "честички за фокус, сомнение и негирање"
    intro: |
      Овие честички ја изоструваат информациската структура:

      - **именно** „токму“: **Именно это я и хотел сказать.** „Токму тоа сакав да кажам.“
      - **лишь, исключительно** „само, исклучиво“
      - **разве** и **неужели** изјавата ја прават изненадување или сомнение: **Разве ты не знал?** „Зар не знаеше?“ **Неужели это правда?** „Зар е тоа вистина?“
      - **вовсе не, отнюдь не, ничуть не** „воопшто не“ (отнюдь е книжевно)
      - **всё-таки, всё же** „сепак“
  ru-c2-ni-concessive:
    meaning: "кој и да, што и да: допусното ни"
    intro: |
      **ни** (не **не**) по прашален збор, обично со **бы** + минато, гради реченици со *и да*: **Что бы ты ни говорил, я не поверю.** „Што и да кажеш, нема да верувам.“ **Где бы он ни был…** „Каде и да е…“ **Как ни старайся, не успеешь.** „Колку и да се трудиш, нема да стигнеш.“ **Сколько ни** „колку и да“.

      Тука **ни** ништо не негира; главната реченица е потврдна или одречна сама по себе. Пишувањето **не** наместо **ни** е една од најчестите правописни грешки на самите Руси.
    mistakes: ["Допусната честичка е ни."]
  ru-c2-double-negative:
    meaning: "две негации даваат силно „да“"
    intro: |
      **не мочь не** + инфинитив, **нельзя не**, **не может не** значат „не може а да не, мора“: **Я не могу не согласиться.** „Не можам а да не се согласам.“ **Нельзя не признать, что…** „Мора да се признае дека…“ **Он не мог не заметить.** „Не можеше да не забележи.“

      Устаалените изрази работат исто: **не раз** „не еднаш“ (но **ни разу** „ниеднаш“), **не кто иной, как** „никој друг туку“, **не без** „не без“: **не без труда** „со извесна мака“.
  ru-c2-genitive-negation:
    meaning: "генитивот на негацијата"
    intro: |
      Кога се негира дека нешто **постои**, тоа оди во генитив, со глагол во среден род: **Ответа не было.** „Немаше одговор.“ **Писем не пришло.** „Не дојдоа писма.“ По негирани преодни глаголи објектот често е во генитив, особено апстрактен или неопределен: **Он не имеет права.** „Нема право.“ **Я не вижу никакой разницы.** „Не гледам никаква разлика.“ **не обращай внимания** „не обрнувај внимание“.

      Конкретен, определен објект останува во акузатив: **Я не видел твою сестру.** „Не ја видов твојата сестра.“ Изборот меѓу двата е една од најфините стилски прашања на рускиот.
  ru-c2-bookish:
    meaning: "стари и книжевни зборови на високиот стил"
    intro: |
      Службениот, правниот, религиозниот и ироничниот стил чуваат зборови што говорот ги напуштил: **ибо** „зашто“, **дабы** „за да“ (= чтобы), **нежели** „отколку“ (= чем), **сей, сия, сие** „овој“ (**до сих пор** „досега“, **сию минуту** „веднаш“), **оный** „споменатиот“, **ежели** „ако“, **коль скоро** „доколку“, **отнюдь** „никако“.

      Во секојдневен разговор звучат надуено или шеговито: **Сие мне неведомо.** „Тоа мене ми е непознато“ (шеговито-свечено).
  ru-c2-colloquial:
    meaning: "честички на разговорниот јазик"
    intro: |
      Говорот има свои честички, ретки во пишувањето:

      - **мол, дескать** означуваат туѓи зборови, често со скепса: **Он сказал, мол, занят.** „Рече, вели, зафатен е.“
      - **небось** „секако, сигурно“: **Устал небось?** „Уморен си, а?“
      - **авось** „можеби ќе излезе добро“ — **на авось** „на среќа“, поговорочен руски став
      - **ну, вот, вон, ладно, давай**: двоумење, покажување, согласување, „ајде“
      - **-ка** ја омекнува заповедта: **Покажи-ка!** „Ајде покажи!“
  ru-c2-expressive-suffixes:
    meaning: "суфикси за големина и чувство"
    intro: |
      Деминутивните и аугментативните суфикси носат став повеќе отколку големина:

      - милост: **-ик, -чик** (**домик, стульчик**), **-ок / -ек** (**сынок, пирожок**), **-очк- / -ечк-** (**чашечка, минуточка**), **-еньк- / -оньк-** кај придавки (**маленький, тихонько**)
      - **-ушк- / -юшк-** наклонетост во народен стил (**бабушка, солнышко**)
      - зголемување или грубост: **-ищ-** (**домище** „огромна куќа“, **ручища**)
      - пејоратив: **-ишк-** (**домишко** „бедна куќичка“)

      Келнерите и продавачите велат **минуточку, хлебушек, чаёк** за да звучат пријатно.
  ru-c2-prefix-meanings:
    meaning: "префикси што додаваат начин на дејство"
    intro: |
      Покрај свршеноста, префиксите додаваат прецизни нијанси (*Aktionsarten*) — многу слично на македонските:

      - **до-** до крај: **дочитать** „дочита“
      - **пере-** повторно или премногу: **переделать** „преправи“, **переесть** „се прејаде“
      - **недо-** премалку: **недооценить** „потцени“
      - **за-** почеток: **заплакать** „заплака“; **по-** малку време: **поговорить** „поразговара“
      - **на- … -ся** до заситување: **наесться** „се најаде“, **выспаться** „се наспие“
      - **раз- … -ся** да се разиграш: **разговориться** „се разговори“
  ru-c2-figurative-motion:
    meaning: "глаголите на движење во пренесено значење"
    intro: |
      **идти** опишува многу што не оди: **идёт дождь / снег** „врне дожд / снег“, **идёт фильм** „се прикажува филм“, **часы идут** „часовникот работи“, **время идёт** „времето минува“, **речь идёт о…** „станува збор за…“, **Тебе идёт эта шапка.** „Ти оди оваа капа.“ Другите глаголи на движење следат: **время летит** „времето лета“, **слухи ходят** „се шират гласини“, **автобус ходит** „автобусот сообраќа“ (редовна линија: повеќенасочен).
  ru-c2-impersonal-verbs:
    meaning: "безлични глаголи и „стихијната“ конструкција"
    intro: |
      Некои глаголи немаат подмет воопшто:

      - природа: **темнеет** „се стемнува“, **светает** „се разденува“, **морозит**
      - состојби, со лицето во акузатив: **меня тошнит** „ми се гади“, **его знобит** „го тресе“
      - датив + **-ся**, порив или можност што „му се случува“ некому: **мне не спится** „не ми се спие“, **ему не работается** „не му се работи“ — сосема како македонското **ми се спие**
      - „стихијната“ конструкција, со силата во инструментал: **Лодку унесло ветром.** „Ветрот го однесе чамецот.“ **Его ранило.** „Беше ранет.“
      - среќа: **ему везёт / повезло** „има / имаше среќа“
  ru-c2-imperative-politeness:
    meaning: "видот во заповедта: покана или наредба"
    intro: |
      Во потврдните заповеди **свршениот** е неутралната молба за едно дејство: **Сядьте.** „Седнете.“ **Закройте дверь.** **Несвршениот** го користи домаќинот — покана да се направи очекуваното: **Садитесь, пожалуйста!** „Повелете, седнувајте!“ **Проходите, раздевайтесь.** „Повелете, влезете, соблечете се.“ **Угощайтесь!** „Послужете се!“

      Несвршениот може и да поттикне да се почне нешто веќе договорено: **Ну, рассказывайте!** „Ајде, раскажувајте!“ Свршен императив кон гостин може да звучи како наредба.
