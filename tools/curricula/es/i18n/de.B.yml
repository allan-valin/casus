# German text of the Spanish course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Moods: "Modi"
  Complex sentences: "Komplexe Sätze"
  The imperfect subjunctive: "Der Subjuntivo imperfecto"
  Subjunctive in clauses: "Subjuntivo in Nebensätzen"
  Perfect tenses and reported speech: "Perfekttempora und indirekte Rede"
  Passive, se and periphrases: "Passiv, se und Periphrasen"
lessons:
  es-subjuntivo:
    meaning: "der Subjuntivo Präsens"
    intro: |
      Nach Wünschen, Gefühlen, Zweifel und **para que, cuando** (Zukunft): **Quiero que vengas. Ojalá llueva. Cuando llegues, llámame.** „Wenn du ankommst, ruf mich an.“ Bildung: yo-Stamm des Präsens mit dem „anderen“ Vokal: **-ar → -e** (hable), **-er/-ir → -a** (coma, viva); unregelmäßig **sea, esté, vaya, haya, sepa, dé**.
  es-condicional:
    meaning: "der Konditional"
    intro: |
      Futurstamm + **-ía, -ías, -ía, -íamos, -íais, -ían**: **hablaría, tendría, podría**. Höfliche Bitten (**¿Podrías ayudarme?**) und irreale Bedingungen: **Si tuviera dinero, viajaría.** „Wenn ich Geld hätte, würde ich reisen.“
  es-por-para:
    meaning: "por und para"
    intro: |
      **para**: Zweck, Ziel, Empfänger, Frist (**para ti, para mañana, para aprender**). **por**: Grund, Mittel, Tausch, durch, Dauer (**por la lluvia, por teléfono, gracias por todo, por la calle**).
  es-relatives:
    meaning: "Relativpronomen"
    intro: |
      **que** (der, die, das) für die meisten Fälle: **el libro que leo**; **quien / quienes** für Personen nach Präposition: **la chica con quien hablé**; **donde** für Orte; **lo que** was: **No sé lo que quieres.**
  es-b2-imperfecto-subj:
    meaning: "der Subjuntivo imperfecto"
    intro: |
      Die 3. Person Plural des Indefinido nehmen, **-ron** weg, **-ra** oder **-se** anhängen: **hablaron → hablara / hablase**, **tuvieron → tuviera / tuviese**, **fueron → fuera / fuese**. Beide Reihen bedeuten dasselbe; **-ra** ist gesprochen häufiger, **-se** schriftlich. Er steht, wo der Subjuntivo nötig ist und das Hauptverb in der Vergangenheit oder im Konditional steht: **Quería que vinieras. Me pidió que lo ayudara.**
  es-b2-si-irreal:
    meaning: "irreale Bedingungen in der Gegenwart"
    intro: |
      **si** + Subjuntivo imperfecto, dann Konditional: **Si tuviera tiempo, viajaría más.** „Hätte ich Zeit, würde ich mehr reisen.“ Nie Konditional oder Subjuntivo Präsens nach **si**: ~~si tendría~~, ~~si tenga~~. Bei realen Bedingungen nimmt **si** den Indikativ: **Si llueve, me quedo.**
    mistakes: ["nach si: Subjuntivo imperfecto, nie Konditional."]
  es-b2-pluscuamperfecto-subj:
    meaning: "der Subjuntivo pluscuamperfecto"
    intro: |
      **hubiera / hubiese** + Partizip: **Si lo hubiera sabido, habría venido.** „Hätte ich es gewusst, wäre ich gekommen.“ Auch nach vergangenen Wünschen und Bedauern: **Ojalá no hubiera dicho nada. Me alegré de que hubieras llegado.**
  es-b2-relativo-subj:
    meaning: "Subjuntivo in Relativsätzen"
    intro: |
      Ein Relativsatz nimmt den Subjuntivo, wenn sein Bezugswort unbekannt, hypothetisch oder verneint ist: **Busco a alguien que sepa francés** (irgendwer) gegenüber **Conozco a alguien que sabe francés** (eine reale Person). Nach **nadie, nada, ningún** immer Subjuntivo: **No hay nadie que lo entienda.**
  es-b2-temporales:
    meaning: "Subjuntivo in Temporalsätzen über die Zukunft"
    intro: |
      **cuando, en cuanto, hasta que, mientras, tan pronto como** + Subjuntivo, wenn das Ereignis noch nicht eingetreten ist: **Te llamo en cuanto llegue. Espera hasta que vuelva.** Bei vergangenen oder gewohnten Tatsachen Indikativ: **Cuando llegó, cenamos.** **antes de que** nimmt immer den Subjuntivo.
    mistakes: ["kein Futur nach cuando: Subjuntivo Präsens."]
  es-b2-finales:
    meaning: "Zweck und Art: para que, sin que, a fin de que"
    intro: |
      **para que, a fin de que, sin que** nehmen immer den Subjuntivo: **Te lo explico para que lo entiendas. Salió sin que nadie lo viera.** Bei gleichem Subjekt den Infinitiv: **Estudio para aprender** (nicht ~~para que aprenda~~).
  es-b2-concesivas:
    meaning: "Einräumung: aunque mit Indikativ oder Subjuntivo"
    intro: |
      **aunque** + Indikativ stellt eine Tatsache fest: **Aunque llueve, salgo** „Obwohl es regnet…“. **aunque** + Subjuntivo lässt es offen oder tut es ab: **Aunque llueva, saldré** „Selbst wenn es regnet…“. Andere konzessive Verbindungen: **a pesar de que, por más que, aun así, si bien**.
  es-b2-condicional-compuesto:
    meaning: "der Konditional II"
    intro: |
      **habría, habrías, habría, habríamos, habríais, habrían** + Partizip: was geschehen wäre. **Habría ido, pero estaba enfermo.** Im Hauptsatz einer irrealen Bedingung der Vergangenheit: **Si me hubieras llamado, habría venido.** Gesprochen erscheint dort auch die **-ra**-Form: **hubiera venido**.
  es-b2-futuro-perfecto:
    meaning: "das Futur II, auch für Vermutungen über die Vergangenheit"
    intro: |
      **habré, habrás, habrá, habremos, habréis, habrán** + Partizip: **Para el lunes habré terminado** „Bis Montag werde ich fertig sein“. Sehr oft eine Vermutung über Geschehenes — wie deutsch: **Habrá salido** „Er wird wohl ausgegangen sein“. **¿Qué le habrá pasado?** „Was mag ihm passiert sein?“
  es-b2-estilo-indirecto:
    meaning: "indirekte Rede und Zeitenfolge"
    intro: |
      Steht das Redeverb in der Vergangenheit, rücken die Tempora zurück: **"Vendré"** → **Dijo que vendría**; **"Estoy cansado"** → **Dijo que estaba cansado**; **"He terminado"** → **Dijo que había terminado**; ein Befehl **"Ven"** → **Me dijo que fuera**. Fragen nehmen **si** oder das Fragewort: **Me preguntó si quería café.**
  es-b2-pasiva:
    meaning: "das Passiv mit ser"
    intro: |
      **ser** + Partizip, kongruierend mit dem Subjekt, **por** für den Urheber: **El libro fue escrito por Cervantes. Las casas fueron construidas en 1900.** Es gehört zum geschriebenen und förmlichen Spanisch; gesprochen bevorzugt man Aktiv oder **se**: **Se construyeron las casas en 1900.**
  es-b2-se-pasiva:
    meaning: "passives und unpersönliches se"
    intro: |
      **se** + Verb in der 3. Person ohne genannten Täter — wie deutsch *man*: **Se habla español. Se venden pisos. Se vive bien aquí.** Das Verb kongruiert mit der Sache: **se vende una casa / se venden casas**. Bei Personen als Objekt bleibt das Verb im Singular: **Se busca a los culpables.**
  es-b2-se-involuntario:
    meaning: "unabsichtliches se: se me olvidó, se le cayó"
    intro: |
      **se** + indirektes Pronomen + Verb stellt etwas als Missgeschick dar: **Se me olvidó** „Ich habe es vergessen (es ist mir entfallen)“, **Se le cayó el vaso** „Ihm ist das Glas heruntergefallen“, **Se nos rompió el coche.** Das Verb kongruiert mit der Sache: **Se me olvidaron las llaves.**
  es-b2-perifrasis:
    meaning: "Verbalperiphrasen mit Infinitiv"
    intro: |
      **volver a** + Infinitiv „wieder tun“: **Volvió a llamar.** **dejar de** „aufhören“: **Dejé de fumar.** **acabar de** „gerade getan haben“: **Acabo de llegar.** **ponerse a** „anfangen“: **Se puso a llorar.** **estar a punto de** „im Begriff sein“. Die Präposition ist fest.
  es-b2-gerundio-perifrasis:
    meaning: "Periphrasen mit Gerundium: llevar, seguir, ir, andar"
    intro: |
      **llevar** + Zeit + Gerundium: wie lange etwas schon andauert: **Llevo dos años estudiando español.** „Ich lerne seit zwei Jahren Spanisch.“ **seguir / continuar** + Gerundium „weiter tun“: **Sigue lloviendo.** **ir** + Gerundium: allmählicher Fortschritt: **Voy entendiendo.** **andar** + Gerundium: herumgehen und etwas tun: **Anda diciendo tonterías.**
