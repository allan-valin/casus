# Arabic text of the Spanish course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Moods: "الصيغ"
  Complex sentences: "الجمل المركبة"
  The imperfect subjunctive: "الالتماسي الناقص"
  Subjunctive in clauses: "الالتماسي في الجمل التابعة"
  Perfect tenses and reported speech: "الأزمنة التامة والكلام المنقول"
  Passive, se and periphrases: "المجهول وse والتراكيب الفعلية"
lessons:
  es-subjuntivo:
    meaning: "الالتماسي الحاضر"
    intro: |
      بعد التمني والشعور والشك و**para que، cuando** (للمستقبل)، كـ«أن + المضارع المنصوب»: **Quiero que vengas.** «أريد أن تأتي». **Ojalá llueva. Cuando llegues, llámame.** الصياغة: جذر yo في المضارع مع الصائت «الآخر»: **-ar → -e** (hable)، **-er/-ir → -a** (coma، viva)؛ والشاذ **sea، esté، vaya، haya، sepa، dé**.
  es-condicional:
    meaning: "الشرطي"
    intro: |
      جذر المستقبل + **-ía، -ías، -ía، -íamos، -íais، -ían**: **hablaría، tendría، podría**. للطلب المهذب (**¿Podrías ayudarme?**) وللشرط غير الواقع: **Si tuviera dinero, viajaría.** «لو كان عندي مال لسافرت».
  es-por-para:
    meaning: "por وpara"
    intro: |
      **para**: الغاية والوجهة والمستلم والموعد (**para ti، para mañana، para aprender**). و**por**: السبب والوسيلة والمقابل والعبور والمدة (**por la lluvia، por teléfono، gracias por todo، por la calle**).
  es-relatives:
    meaning: "أسماء الموصول"
    intro: |
      **que** (الذي، التي) لأكثر الحالات: **el libro que leo**؛ و**quien / quienes** للعاقل بعد حرف الجر: **la chica con quien hablé**؛ و**donde** للأماكن؛ و**lo que** ما: **No sé lo que quieres.**
  es-b2-imperfecto-subj:
    meaning: "الالتماسي الناقص"
    intro: |
      خذ الغائب الجمع من الماضي البسيط، احذف **-ron**، وأضف **-ra** أو **-se**: **hablaron → hablara / hablase**، **tuvieron → tuviera / tuviese**، **fueron → fuera / fuese**. والمجموعتان بمعنى واحد؛ **-ra** أشيع في الكلام، و**-se** في الكتابة. ويُستعمل حيث يلزم الالتماسي والفعل الرئيسي في الماضي أو الشرطي: **Quería que vinieras. Me pidió que lo ayudara.**
  es-b2-si-irreal:
    meaning: "الشرط غير الواقع في الحاضر"
    intro: |
      **si** + الالتماسي الناقص، ثم الشرطي: **Si tuviera tiempo, viajaría más.** «لو كان عندي وقت لسافرت أكثر». ولا شرطي ولا التماسي حاضر بعد **si** أبدًا: ~~si tendría~~، ~~si tenga~~. وللشرط الممكن تأخذ **si** الإخباري: **Si llueve, me quedo.**
    mistakes: ["بعد si: الالتماسي الناقص، لا الشرطي أبدًا."]
  es-b2-pluscuamperfecto-subj:
    meaning: "الالتماسي البعيد"
    intro: |
      **hubiera / hubiese** + اسم المفعول: **Si lo hubiera sabido, habría venido.** «لو كنت عرفت لجئت». وكذلك بعد التمني والندم على الماضي: **Ojalá no hubiera dicho nada. Me alegré de que hubieras llegado.**
  es-b2-relativo-subj:
    meaning: "الالتماسي في جمل الصلة"
    intro: |
      تأخذ جملة الصلة الالتماسي حين يكون سابقها مجهولًا أو مفترضًا أو منفيًا: **Busco a alguien que sepa francés** (أيّ أحد) مقابل **Conozco a alguien que sabe francés** (شخص حقيقي). وبعد **nadie، nada، ningún** دائمًا الالتماسي: **No hay nadie que lo entienda.**
  es-b2-temporales:
    meaning: "الالتماسي في جمل الزمان عن المستقبل"
    intro: |
      **cuando، en cuanto، hasta que، mientras، tan pronto como** + الالتماسي حين لم يقع الحدث بعد: **Te llamo en cuanto llegue.** «أتصل بك حالما أصل». **Espera hasta que vuelva.** ومع الوقائع الماضية أو المعتادة الإخباري: **Cuando llegó, cenamos.** و**antes de que** تأخذ الالتماسي دائمًا.
    mistakes: ["لا مستقبل بعد cuando: الالتماسي الحاضر."]
  es-b2-finales:
    meaning: "الغاية والكيفية: para que، sin que، a fin de que"
    intro: |
      **para que، a fin de que، sin que** تأخذ الالتماسي دائمًا: **Te lo explico para que lo entiendas. Salió sin que nadie lo viera.** ومع اتحاد الفاعل استعمل المصدر: **Estudio para aprender** (لا ~~para que aprenda~~).
  es-b2-concesivas:
    meaning: "التسليم: aunque مع الإخباري أو الالتماسي"
    intro: |
      **aunque** + الإخباري تقرّر واقعة: **Aunque llueve, salgo** «مع أنها تمطر…». و**aunque** + الالتماسي تتركها مفتوحة أو تستهين بها: **Aunque llueva, saldré** «حتى لو أمطرت…». وروابط تسليم أخرى: **a pesar de que، por más que، aun así، si bien**.
  es-b2-condicional-compuesto:
    meaning: "الشرطي التام"
    intro: |
      **habría، habrías، habría، habríamos، habríais، habrían** + اسم المفعول: ما كان سيحدث. **Habría ido, pero estaba enfermo.** وفي جواب الشرط غير الواقع في الماضي: **Si me hubieras llamado, habría venido.** وفي الكلام تظهر هناك صيغة **-ra** أيضًا: **hubiera venido**.
  es-b2-futuro-perfecto:
    meaning: "المستقبل التام، وللتخمين عن الماضي أيضًا"
    intro: |
      **habré، habrás، habrá، habremos، habréis، habrán** + اسم المفعول: **Para el lunes habré terminado** «بحلول الاثنين سأكون قد أنهيت». وكثيرًا ما يكون تخمينًا عمّا حدث: **Habrá salido** «لا بد أنه خرج». **¿Qué le habrá pasado?** «تُرى ماذا جرى له؟»
  es-b2-estilo-indirecto:
    meaning: "الكلام المنقول وتوافق الأزمنة"
    intro: |
      حين يكون فعل القول في الماضي تتراجع الأزمنة: **"Vendré"** → **Dijo que vendría**؛ **"Estoy cansado"** → **Dijo que estaba cansado**؛ **"He terminado"** → **Dijo que había terminado**؛ والأمر **"Ven"** → **Me dijo que fuera**. والأسئلة تأخذ **si** أو أداة الاستفهام: **Me preguntó si quería café.**
  es-b2-pasiva:
    meaning: "المبني للمجهول بـ ser"
    intro: |
      **ser** + اسم المفعول مطابقًا للفاعل، و**por** للفاعل الحقيقي: **El libro fue escrito por Cervantes. Las casas fueron construidas en 1900.** وهو من الإسبانية المكتوبة والرسمية؛ والكلام يفضّل المعلوم أو **se**: **Se construyeron las casas en 1900.**
  es-b2-se-pasiva:
    meaning: "se المجهولة وغير الشخصية"
    intro: |
      **se** + فعل الغائب بلا فاعل مذكور: **Se habla español.** «تُتكلَّم الإسبانية». **Se venden pisos. Se vive bien aquí.** ويطابق الفعل الشيء: **se vende una casa / se venden casas**. ومع الأشخاص مفعولًا يبقى الفعل مفردًا: **Se busca a los culpables.**
  es-b2-se-involuntario:
    meaning: "se العَرَضية: se me olvidó، se le cayó"
    intro: |
      **se** + ضمير غير مباشر + فعل تعرض الأمر حادثًا عارضًا: **Se me olvidó** «نسيته (غاب عن بالي)»، **Se le cayó el vaso** «وقع منه الكأس»، **Se nos rompió el coche.** ويطابق الفعل الشيء: **Se me olvidaron las llaves.**
  es-b2-perifrasis:
    meaning: "تراكيب فعلية مع المصدر"
    intro: |
      **volver a** + المصدر «عاد يفعل»: **Volvió a llamar.** **dejar de** «كفّ عن»: **Dejé de fumar.** **acabar de** «للتو»: **Acabo de llegar.** **ponerse a** «أخذ يفعل»: **Se puso a llorar.** **estar a punto de** «أوشك». وحرف الجر ثابت.
  es-b2-gerundio-perifrasis:
    meaning: "تراكيب مع صيغة الحال: llevar، seguir، ir، andar"
    intro: |
      **llevar** + مدة + صيغة الحال: منذ متى يستمر الأمر: **Llevo dos años estudiando español.** «أدرس الإسبانية منذ سنتين». **seguir / continuar** + صيغة الحال «ظلّ يفعل»: **Sigue lloviendo.** **ir** + صيغة الحال: تقدّم تدريجي: **Voy entendiendo.** **andar** + صيغة الحال: يجول يفعل: **Anda diciendo tonterías.**
