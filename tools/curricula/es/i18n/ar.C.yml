# Arabic text of the Spanish course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Subjunctive nuances: "دقائق الالتماسي"
  Time, guesses and politeness: "الزمن والتخمين والتهذيب"
  Discourse and connectors: "الخطاب وأدوات الربط"
  Literary and formal verb forms: "صيغ الفعل الأدبية والرسمية"
  Sentence structure: "بناء الجملة"
  Register and variation: "المستوى والتنوع"
lessons:
  es-c1-no-creo-que:
    meaning: "الرأي والإدراك المنفيان يأخذان الالتماسي"
    intro: |
      **creer، pensar، parecer، decir، estar seguro de** + الإخباري عند الإثبات: **Creo que es verdad.** ومنفية تأخذ الالتماسي: **No creo que sea verdad. No me parece que tengas razón.** والسؤال المنفي قد يبقي الإخباري: **¿No crees que es tarde?** (تتوقع «نعم»).
    mistakes: ["creer المنفية: الالتماسي."]
  es-c1-valoracion:
    meaning: "الالتماسي بعد أحكام القيمة"
    intro: |
      **ser / parecer** + صفة أو اسم حكم + **que** + الالتماسي: **Es normal que estés cansado. Es una pena que no puedas venir. Me parece lógico que se queje.** وحتى إن كانت الواقعة صحيحة فالحكم يجعلها التماسية. وكذلك غالبًا **el hecho de que**: **El hecho de que lo sepa no cambia nada.** وعبارات الحقيقة تبقي الإخباري: **Es verdad que / Está claro que es así.**
  es-c1-lo-que-sea:
    meaning: "الموصولات الحرة والالتماسي المكرّر"
    intro: |
      **lo que / donde / como / quien / cuando** + الالتماسي تترك الاختيار مفتوحًا: **Haz lo que quieras.** «افعل ما شئت». **Ven cuando puedas. Siéntate donde quieras.** وتكرار الفعل يعطي «مهما»: **pase lo que pase** «مهما حدث»، **digan lo que digan**، **sea como sea** «مهما يكن»، **cueste lo que cueste** «مهما كلّف الأمر».
  es-c1-como-si:
    meaning: "como si + الالتماسي الناقص أو البعيد"
    intro: |
      **como si** «كأنّ» تأخذ دائمًا الالتماسي الماضي، أيًّا كان زمن الفعل الرئيسي: **Habla como si fuera el jefe. Me miró como si no me hubiera visto nunca.** ولا المضارع أبدًا: ~~como si es~~.
  es-c1-condicionales:
    meaning: "أدوات الشرط مع الالتماسي"
    intro: |
      بجانب **si**: **a menos que / a no ser que** «إلا إذا»، **con tal de que / siempre que** «شريطة أن»، **en caso de que** «في حال»، **salvo que** «ما لم». وكلها تأخذ الالتماسي: **Iré a menos que llueva. Te lo presto siempre que me lo devuelvas.** (و**siempre que** + الإخباري تعني «كلما».)
  es-c1-futuro-conjetura:
    meaning: "المستقبل والشرطي للتخمين"
    intro: |
      كثيرًا ما يعني المستقبل «على الأرجح، تُرى» عن الحاضر: **¿Dónde estará Tom?** «أين تُرى يكون توم؟» **Serán las diez** «لعلها العاشرة». والشرطي يفعل الشيء نفسه للماضي: **Serían las diez cuando llegó** «لعلها كانت العاشرة حين وصل». **Tendría veinte años** «لعله كان في العشرين».
  es-c1-cortesia:
    meaning: "تلطيف الطلب والنصيحة: quisiera، debería، podría"
    intro: |
      ثلاث درجات من التهذيب: **Quiero un café** (مباشر)، **Querría un café**، **Quisiera un café** (الأكثر تهذيبًا؛ التماسي -ra وحده). وتُلطَّف النصيحة بالطريقة نفسها: **Deberías / Debieras descansar.** و**Podría** و**pudiera** للطلبات والإمكانات.
  es-c1-mixtas:
    meaning: "الشرط المختلط وde + المصدر"
    intro: |
      شرط ماضٍ ونتيجة حاضرة: **Si hubiera estudiado medicina, ahora sería médico.** وشرط حاضر ونتيجة ماضية: **Si fuera más listo, no lo habría hecho.** وفي الأسلوب الرسمي تحلّ **de** + المصدر محلّ **si**: **De haberlo sabido, habría venido** «لو كنت عرفت…». **De seguir así** «إن استمر الأمر هكذا».
  es-c1-contraste:
    meaning: "الاستدراك: sin embargo، no obstante، en cambio، por el contrario"
    intro: |
      **sin embargo / no obstante** «غير أنّ» (no obstante أرسم)، و**en cambio** «في المقابل» للمقابلة بين شيئين، و**por el contrario** «بل على العكس» للتصحيح. وتأتي غالبًا بين فاصلتين: **Es caro; sin embargo, vale la pena.**
  es-c1-causa-consecuencia:
    meaning: "السبب والنتيجة: ya que، puesto que، dado que، así que"
    intro: |
      السبب: **porque** (محايدة)، و**ya que / puesto que / dado que** (السبب معروف، وغالبًا في الأول): **Ya que estás aquí, ayúdame.** «ما دمت هنا فساعدني». و**como** في البداية: **Como llovía, no salimos.** والنتيجة: **así que، de modo que، por lo tanto، por eso**: **Llovía, así que no salimos.**
  es-c1-duplicacion:
    meaning: "المفعول المكرّر: a mí me، a Juan le، el libro lo"
    intro: |
      يُكرَّر المفعول غير المباشر عادة بضمير: **Le di el libro a Juan. A mí me gusta.** والمفعول المباشر المقدَّم يجب أن يُعاد بضمير — كالاشتغال في العربية: **El libro lo compré ayer.** «الكتابُ اشتريته أمس». **A tu hermana la vi en el cine.** وبلا الضمير يبدو خطأ.
  es-c1-lo-adjetivo:
    meaning: "lo المحايدة + الصفة"
    intro: |
      **lo** + الصفة تصنع اسمًا مجردًا: **lo bueno** «الأمر الجيد»، **lo importante es…** «المهم هو…»، **lo mejor** «الأفضل». و**lo** + صفة/ظرف + **que** تعني «كم»: **No sabes lo difícil que es** «لا تعرف كم هو صعب».
  es-c1-ser-estar-adj:
    meaning: "صفات يتغير معناها مع ser وestar"
    intro: |
      لبعض الصفات معانٍ مختلفة: **ser listo** «ذكي» / **estar listo** «جاهز»؛ **ser aburrido** «مملّ» / **estar aburrido** «يشعر بالملل»؛ **ser malo** «سيئ» / **estar malo** «مريض»؛ **ser rico** «غني» / **estar rico** «لذيذ»؛ **ser vivo** «فطن» / **estar vivo** «حيّ»؛ **ser orgulloso** «متكبر» / **estar orgulloso de** «فخور بـ».
  es-c2-futuro-subj:
    meaning: "الالتماسي المستقبل (القانون والأمثال والنصوص القديمة)"
    intro: |
      فقدت الإسبانية الحديثة الالتماسي المستقبل في الكلام، لكنه يبقى في النصوص القانونية والأيمان والأمثال: **Adonde fueres, haz lo que vieres** «حيثما ذهبت فافعل ما ترى». **El que infringiere esta norma será sancionado.** الصياغة: جذر **-ra** مع **-re**: **hablare، tuviere، fuere، hiciere**. اقرأه كالتماسي حاضر (أو كالالتماسي المستقبل البرتغالي).
  es-c2-preterito-anterior:
    meaning: "الماضي السابق (pretérito anterior)"
    intro: |
      **hube، hubiste، hubo، hubimos، hubisteis، hubieron** + اسم المفعول، بعد **apenas، en cuanto، cuando، una vez que، tan pronto como**: فعل يسبق مباشرة فعلًا ماضيًا آخر. **Apenas hubo terminado, se fue.** «ما إن انتهى حتى ذهب». في السرد الأدبي فقط؛ والكلام يستعمل الماضي البسيط أو البعيد: **En cuanto terminó, se fue.**
  es-c2-se-forma:
    meaning: "الالتماسي الناقص بـ -se وصيغة -ra في الكتابة"
    intro: |
      **-se** و**-ra** متبادلتان التماسيًا: **Si tuviese / tuviera tiempo…**؛ و**-se** أشيع في إسبانيا وفي الكتابة المتأنية. لكن **-ra** وحدها تحلّ محلّ الشرطي (**Hubiera / Habría sido mejor**)، أو في الصحافة والأدب محلّ الماضي البعيد الإخباري: **el que fuera presidente** «الذي كان رئيسًا».
  es-c2-cuyo:
    meaning: "cuyo: الذي … ـه، يطابق المملوك"
    intro: |
      **cuyo، cuya، cuyos، cuyas** تطابق الاسم الذي يليها لا المالك: **el autor cuya novela leí** «المؤلف الذي قرأت روايته»، **la casa cuyos dueños viven fuera**. وهي من الكتابة؛ والكلام كثيرًا ما يتجنبها (و~~que su~~ تُعدّ دون المستوى).
  es-c2-el-cual:
    meaning: "el cual وla cual وlo cual بعد حروف الجر والفواصل"
    intro: |
      **el cual / la cual / los cuales / las cuales** (= el que) بعد حروف الجر وفي الصلات غير الحاصرة، غالبًا في الكتابة: **la razón por la cual vine**، **el edificio, en el cual trabajo**. و**lo cual / lo que** تعود على فكرة كاملة: **Llegó tarde, lo cual me molestó.** «تأخر، وهو ما أزعجني».
  es-c2-que-subj:
    meaning: "que المستقلة + الالتماسي: التمني والأمر"
    intro: |
      قد تبدأ الجملة الرئيسية بـ **que** + الالتماسي: للتمني **¡Que te vaya bien! ¡Que aproveche! ¡Que descanses!** وللأمر غير المباشر **Que pase el siguiente** «ليتفضّل التالي»، **Que lo haga él.** «ليفعله هو». وهي اختصار لـ *quiero / espero que…*.
  es-c2-quiza:
    meaning: "quizá، tal vez، acaso: الصيغة درجةً للشك"
    intro: |
      **quizá(s)، tal vez، posiblemente، probablemente** قبل الفعل تأخذ أيّ الصيغتين: الالتماسي لشك أكبر (**Quizá venga mañana**)، والإخباري لتخمين أرجح (**Quizá viene mañana**). وبعد الفعل الإخباري فقط: **Viene mañana, quizá.** و**a lo mejor** تأخذ الإخباري دائمًا: **A lo mejor llueve.**
  es-c2-por-mas-que:
    meaning: "التسليم المؤكَّد: por más que، por mucho que، por muy… que"
    intro: |
      **por más / mucho que** + فعل، و**por muy** + صفة + **que**: «مهما»: **Por mucho que insistas, no iré.** «مهما ألححت فلن أذهب». **Por muy rico que sea, no es feliz.** غالبًا الالتماسي؛ والإخباري فقط لواقعة معروفة. وكذلك الرسمية **si bien** «وإن» (+ الإخباري) و**aun cuando** «حتى لو».
  es-c2-voseo:
    meaning: "الـ voseo: صيغ vos في الأرجنتين والأوروغواي وأمريكا الوسطى"
    intro: |
      في منطقة ريو دي لا بلاتا ومعظم أمريكا الوسطى تحلّ **vos** محلّ **tú**، ولها مضارعها الخاص: النبر على اللاحقة، **-ás، -és، -ís**: **vos hablás، tenés، vivís**؛ **vos sos** «أنت». والأمر: **hablá، tené، vení، decí**. وضمير الفاعل والمفعول: **vos** (وتبقى **te**: **te quiero**)؛ والملكية **tu**.
  es-c2-diminutivos:
    meaning: "التصغير والتكبير: -ito، -illo، -ón، -azo"
    intro: |
      **-ito / -ita** (عام)، و**-illo** (إسبانيا، الأندلس)، و**-ico** (الكاريبي، أراغون) تعبّر عن الصغر أو المودة أو التهذيب: **un momentito، un cafecito، ahorita** (المكسيك: «الآن» أو «بعد قليل»). و**-ón / -ona** و**-azo** تكبّر أو تقوّي: **un cochazo** «سيارة رائعة»، **un golpazo**، **un portazo** «صفقة باب». وبعضها صار كلمات مستقلة: **bolsillo، ventanilla، cajón**.
  es-c2-anteposicion:
    meaning: "صفات يتغير معناها بموضعها"
    intro: |
      قبل الاسم تكون الصفة ذاتية أو مجازية، وبعده حرفية: **un gran hombre** «رجل عظيم» / **un hombre grande** «رجل ضخم»؛ **un pobre chico** «ولد مسكين» / **un chico pobre** «ولد فقير»؛ **un viejo amigo** «صديق قديم» / **un amigo viejo** «صديق مسنّ»؛ **el mismo día** «اليوم نفسه» / **el rey mismo** «الملك بنفسه»؛ **cierto problema** «مشكلة ما» / **un dato cierto** «معلومة صحيحة»؛ **un nuevo coche** «سيارة أخرى» / **un coche nuevo** «سيارة جديدة تمامًا».
  es-c2-infinitivo-compuesto:
    meaning: "المصدر التام: haber + اسم المفعول بعد حروف الجر"
    intro: |
      **haber** + اسم المفعول مصدرًا، بعد **tras، después de، por، sin، de، al**: **Tras haber comido, salimos. Gracias por haber venido. Me arrepiento de no haberlo hecho.** والإسبانية الرسمية تستعمل أيضًا **al** + المصدر بمعنى «حين»: **Al llegar, llamó.** «حين وصل اتصل».
    mistakes: ["الأزمنة المركبة دائمًا بـ haber."]
