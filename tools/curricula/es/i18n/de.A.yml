# German text of the Spanish course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Articles and nouns: "Artikel und Nomen"
  Ser, estar and the present: "Ser, estar und das Präsens"
  Negation and questions: "Verneinung und Fragen"
  Pronouns: "Pronomen"
  The past: "Die Vergangenheit"
lessons:
  es-articles:
    meaning: "die Artikel und das Genus"
    intro: |
      Maskulin **el / los**, feminin **la / las**; unbestimmt **un, una, unos, unas**. Die meisten Nomen auf **-o** sind maskulin, auf **-a** feminin (**el libro, la casa**), mit Ausnahmen (**el día, la mano, el problema**). **a + el = al**, **de + el = del**.
  es-ser-estar:
    meaning: "ser und estar: zwei Verben für „sein“"
    intro: |
      **ser** (soy, eres, es, somos, sois, son) für Identität, Herkunft, Beruf, Uhrzeit; **estar** (estoy, estás, está, estamos, estáis, están) für Ort und Zustände: **Soy brasileño. Estoy cansado. Madrid está en España.** Für Portugiesischsprechende: die Aufteilung ist fast dieselbe wie im Portugiesischen.
  es-present:
    meaning: "das Präsens: -ar, -er, -ir"
    intro: |
      **-ar** (hablar): hablo, hablas, habla, hablamos, habláis, hablan. **-er** (comer): como, comes, come, comemos, coméis, comen. **-ir** (vivir): vivo, vives, vive, vivimos, vivís, viven. Stammwechselnde Verben: **e → ie** (quiero), **o → ue** (puedo), **e → i** (pido), außer bei nosotros/vosotros.
  es-questions:
    meaning: "Fragewörter (mit Akzent)"
    intro: |
      **qué** was, **quién** wer, **dónde** wo, **cuándo** wann, **cómo** wie, **por qué** warum, **cuánto** wie viel, **cuál** welcher. Sie tragen einen Akzent; Fragen beginnen mit **¿** und Ausrufe mit **¡**: **¿Dónde vives?**
  es-negation:
    meaning: "Verneinung: no, nunca, nada, nadie"
    intro: |
      **no** vor dem Verb: **No sé.** Doppelte Verneinung ist normal: **No veo nada.** „Ich sehe nichts.“ **No viene nadie. No voy nunca** (oder **Nunca voy**).
  es-object-pronouns:
    meaning: "Objektpronomen: lo, la, le, se lo"
    intro: |
      Direkt **lo, la, los, las**; indirekt **le, les**; außerdem **me, te, nos, os**. Sie stehen vor einem konjugierten Verb (**Lo veo**), nach Infinitiv oder Imperativ angehängt (**Quiero verlo. ¡Dímelo!**). **le / les** werden vor lo / la zu **se**: **Se lo doy.**
  es-gustar:
    meaning: "gustar und ähnliche Verben"
    intro: |
      **gustar** funktioniert „umgekehrt“ — wie deutsch *gefallen*: das Gemochte ist Subjekt, die Person indirektes Objekt: **Me gusta el café.** „Mir schmeckt Kaffee.“ **Me gustan los libros.** Ebenso **encantar, interesar, doler, faltar, parecer**.
  es-preterito:
    meaning: "das Indefinido: abgeschlossene Vergangenheit"
    intro: |
      **-ar**: hablé, hablaste, habló, hablamos, hablasteis, hablaron. **-er / -ir**: comí, comiste, comió, comimos, comisteis, comieron. Unregelmäßig und häufig: **ser / ir → fui, fuiste, fue**; **tener → tuve**, **hacer → hice**, **estar → estuve**, **poder → pude**, **decir → dije**.
  es-imperfecto:
    meaning: "das Imperfekt: tat gerade, pflegte zu"
    intro: |
      **-ar**: hablaba, hablabas, hablaba, hablábamos, hablabais, hablaban; **-er / -ir**: comía, comías, comía… Nur drei unregelmäßige: **ser → era**, **ir → iba**, **ver → veía**. Hintergrund, Gewohnheiten, Beschreibungen — wie im Portugiesischen.
  es-perfecto:
    meaning: "das Perfekt: haber + Partizip"
    intro: |
      **he, has, ha, hemos, habéis, han** + Partizip (**-ado, -ido**; unregelmäßig **hecho, dicho, visto, escrito, puesto, vuelto, abierto**): **He comido.** In Spanien ist es die Vergangenheit von heute; in Lateinamerika ist das Indefinido häufiger.
  es-futuro:
    meaning: "das Futur und ir a + Infinitiv"
    intro: |
      Infinitiv + **-é, -ás, -á, -emos, -éis, -án**: **hablaré, comerás, vivirá**. Unregelmäßige Stämme: **tendr-, podr-, har-, dir-, saldr-, vendr-, querr-, sabr-, pondr-**. Alltäglich: **voy a + Infinitiv**: **Voy a comer.**
