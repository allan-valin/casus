# Arabic text of the Spanish course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Articles and nouns: "الأدوات والأسماء"
  Ser, estar and the present: "ser وestar والمضارع"
  Negation and questions: "النفي والأسئلة"
  Pronouns: "الضمائر"
  The past: "الماضي"
lessons:
  es-articles:
    meaning: "أدوات التعريف والجنس"
    intro: |
      المذكر **el / los**، والمؤنث **la / las**؛ والنكرة **un، una، unos، unas**. أكثر الأسماء المنتهية بـ **-o** مذكرة، وبـ **-a** مؤنثة (**el libro، la casa**)، مع استثناءات (**el día، la mano، el problema**). **a + el = al**، **de + el = del**.
  es-ser-estar:
    meaning: "ser وestar: فعلان لـ«يكون»"
    intro: |
      **ser** (soy، eres، es، somos، sois، son) للهوية والأصل والمهنة والوقت؛ و**estar** (estoy، estás، está، estamos، estáis، están) للمكان والحالات: **Soy brasileño. Estoy cansado. Madrid está en España.** للناطقين بالبرتغالية: التقسيم يكاد يطابق البرتغالية.
  es-present:
    meaning: "المضارع: -ar، -er، -ir"
    intro: |
      **-ar** (hablar): hablo، hablas، habla، hablamos، habláis، hablan. **-er** (comer): como، comes، come، comemos، coméis، comen. **-ir** (vivir): vivo، vives، vive، vivimos، vivís، viven. وأفعال تتغير جذورها: **e → ie** (quiero)، **o → ue** (puedo)، **e → i** (pido)، إلا مع nosotros/vosotros.
  es-questions:
    meaning: "أدوات الاستفهام (بالنبرة)"
    intro: |
      **qué** ماذا، **quién** من، **dónde** أين، **cuándo** متى، **cómo** كيف، **por qué** لماذا، **cuánto** كم، **cuál** أيّ. وتحمل علامة النبرة؛ وتُفتتح الأسئلة بـ **¿** والتعجب بـ **¡**: **¿Dónde vives?**
  es-negation:
    meaning: "النفي: no، nunca، nada، nadie"
    intro: |
      **no** قبل الفعل: **No sé.** والنفي المزدوج عادي: **No veo nada.** «لا أرى شيئًا». **No viene nadie. No voy nunca** (أو **Nunca voy**).
  es-object-pronouns:
    meaning: "ضمائر المفعول: lo، la، le، se lo"
    intro: |
      المباشرة **lo، la، los، las**؛ وغير المباشرة **le، les**؛ وكذلك **me، te، nos، os**. وتأتي قبل الفعل المصرّف (**Lo veo**)، وبعد المصدر أو الأمر متصلة به (**Quiero verlo. ¡Dímelo!**). و**le / les** تصير **se** قبل lo / la: **Se lo doy.**
  es-gustar:
    meaning: "gustar والأفعال المشابهة"
    intro: |
      **gustar** تعمل «بالعكس»، كـ«يعجبني»: الشيء المحبوب فاعل والشخص مفعول غير مباشر: **Me gusta el café.** «تعجبني القهوة». **Me gustan los libros.** ومثلها **encantar، interesar، doler، faltar، parecer**.
  es-preterito:
    meaning: "الماضي البسيط: الماضي المنجز"
    intro: |
      **-ar**: hablé، hablaste، habló، hablamos، hablasteis، hablaron. **-er / -ir**: comí، comiste، comió، comimos، comisteis، comieron. والشاذ الشائع: **ser / ir → fui، fuiste، fue**؛ **tener → tuve**، **hacer → hice**، **estar → estuve**، **poder → pude**، **decir → dije**.
  es-imperfecto:
    meaning: "الماضي الناقص: كان يفعل، اعتاد"
    intro: |
      **-ar**: hablaba، hablabas، hablaba، hablábamos، hablabais، hablaban؛ **-er / -ir**: comía، comías، comía… وثلاثة شواذ فقط: **ser → era**، **ir → iba**، **ver → veía**. للخلفية والعادات والوصف — كالبرتغالية.
  es-perfecto:
    meaning: "الماضي التام: haber + اسم المفعول"
    intro: |
      **he، has، ha، hemos، habéis، han** + اسم المفعول (**-ado، -ido**؛ والشاذ **hecho، dicho، visto، escrito، puesto، vuelto، abierto**): **He comido.** «لقد أكلت». وفي إسبانيا هو ماضي اليوم؛ وفي أمريكا اللاتينية الماضي البسيط أشيع.
  es-futuro:
    meaning: "المستقبل وir a + المصدر"
    intro: |
      المصدر + **-é، -ás، -á، -emos، -éis، -án**: **hablaré، comerás، vivirá**. والجذور الشاذة: **tendr-، podr-، har-، dir-، saldr-، vendr-، querr-، sabr-، pondr-**. وفي الاستعمال اليومي: **voy a + المصدر**: **Voy a comer.** «سآكل».
