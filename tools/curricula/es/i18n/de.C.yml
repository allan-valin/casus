# German text of the Spanish course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Subjunctive nuances: "Nuancen des Subjuntivo"
  Time, guesses and politeness: "Zeit, Vermutung und Höflichkeit"
  Discourse and connectors: "Diskurs und Konnektoren"
  Literary and formal verb forms: "Literarische und förmliche Verbformen"
  Sentence structure: "Satzbau"
  Register and variation: "Register und Variation"
lessons:
  es-c1-no-creo-que:
    meaning: "verneinte Meinung und Wahrnehmung nehmen den Subjuntivo"
    intro: |
      **creer, pensar, parecer, decir, estar seguro de** + Indikativ, wenn bejaht: **Creo que es verdad.** Verneint nehmen sie den Subjuntivo: **No creo que sea verdad. No me parece que tengas razón.** Eine verneinte Frage kann den Indikativ behalten: **¿No crees que es tarde?** (man erwartet „ja“).
    mistakes: ["verneintes creer: Subjuntivo."]
  es-c1-valoracion:
    meaning: "Subjuntivo nach Werturteilen"
    intro: |
      **ser / parecer** + wertendes Adjektiv oder Nomen + **que** + Subjuntivo: **Es normal que estés cansado. Es una pena que no puedas venir. Me parece lógico que se queje.** Auch wenn die Tatsache stimmt, macht das Urteil sie zum Subjuntivo. Ebenso meist **el hecho de que**: **El hecho de que lo sepa no cambia nada.** Wahrheitsaussagen behalten den Indikativ: **Es verdad que / Está claro que es así.**
  es-c1-lo-que-sea:
    meaning: "freie Relativsätze und verdoppelter Subjuntivo"
    intro: |
      **lo que / donde / como / quien / cuando** + Subjuntivo lässt die Wahl offen: **Haz lo que quieras. Ven cuando puedas. Siéntate donde quieras.** Die Wiederholung des Verbs ergibt „was auch immer“: **pase lo que pase** „was auch geschieht“, **digan lo que digan**, **sea como sea** „wie dem auch sei“, **cueste lo que cueste** „koste es, was es wolle“.
  es-c1-como-si:
    meaning: "como si + Subjuntivo imperfecto oder pluscuamperfecto"
    intro: |
      **como si** „als ob“ nimmt immer den Subjuntivo der Vergangenheit, egal in welchem Tempus das Hauptverb steht: **Habla como si fuera el jefe. Me miró como si no me hubiera visto nunca.** Nie das Präsens: ~~como si es~~.
  es-c1-condicionales:
    meaning: "Bedingungskonjunktionen mit Subjuntivo"
    intro: |
      Neben **si**: **a menos que / a no ser que** „es sei denn“, **con tal de que / siempre que** „vorausgesetzt“, **en caso de que** „falls“, **salvo que** „außer wenn“. Alle nehmen den Subjuntivo: **Iré a menos que llueva. Te lo presto siempre que me lo devuelvas.** (**siempre que** + Indikativ heißt „immer wenn“.)
  es-c1-futuro-conjetura:
    meaning: "Futur und Konditional der Vermutung"
    intro: |
      Das Futur heißt oft „wohl, ich frage mich“ über die Gegenwart — wie deutsch *wird wohl*: **¿Dónde estará Tom?** „Wo mag Tom sein?“ **Serán las diez** „Es wird wohl zehn sein.“ Der Konditional tut dasselbe für die Vergangenheit: **Serían las diez cuando llegó** „Es wird etwa zehn gewesen sein.“ **Tendría veinte años** „Er war wohl zwanzig.“
  es-c1-cortesia:
    meaning: "abgeschwächte Bitten und Ratschläge: quisiera, debería, podría"
    intro: |
      Drei Stufen der Höflichkeit: **Quiero un café** (direkt), **Querría un café**, **Quisiera un café** (am höflichsten; -ra-Subjuntivo allein gebraucht). Ratschläge werden genauso abgeschwächt: **Deberías / Debieras descansar.** **Podría** und **pudiera** für Bitten und Möglichkeiten.
  es-c1-mixtas:
    meaning: "gemischte Bedingungssätze und de + Infinitiv"
    intro: |
      Vergangene Bedingung, gegenwärtige Folge: **Si hubiera estudiado medicina, ahora sería médico.** Gegenwärtige Bedingung, vergangene Folge: **Si fuera más listo, no lo habría hecho.** Im förmlichen Stil ersetzt **de** + Infinitiv das **si**: **De haberlo sabido, habría venido** „Hätte ich es gewusst…“. **De seguir así** „Wenn es so weitergeht“.
  es-c1-contraste:
    meaning: "Gegensatz: sin embargo, no obstante, en cambio, por el contrario"
    intro: |
      **sin embargo / no obstante** „jedoch“ (no obstante förmlicher), **en cambio** „hingegen“ für einen Gegensatz zwischen zwei Dingen, **por el contrario** „im Gegenteil“ für eine Richtigstellung. Sie stehen meist zwischen Kommas: **Es caro; sin embargo, vale la pena.**
  es-c1-causa-consecuencia:
    meaning: "Grund und Folge: ya que, puesto que, dado que, así que"
    intro: |
      Grund: **porque** (neutral), **ya que / puesto que / dado que** (der Grund ist bekannt, oft vorangestellt): **Ya que estás aquí, ayúdame.** **como** am Satzanfang: **Como llovía, no salimos.** Folge: **así que, de modo que, por lo tanto, por eso**: **Llovía, así que no salimos.**
  es-c1-duplicacion:
    meaning: "verdoppelte Objekte: a mí me, a Juan le, el libro lo"
    intro: |
      Ein indirektes Objekt wird meist durch ein Pronomen verdoppelt: **Le di el libro a Juan. A mí me gusta.** Ein vorangestelltes direktes Objekt muss durch ein Pronomen wiederaufgenommen werden: **El libro lo compré ayer. A tu hermana la vi en el cine.** Ohne das Pronomen klingt es falsch.
  es-c1-lo-adjetivo:
    meaning: "neutrales lo + Adjektiv"
    intro: |
      **lo** + Adjektiv bildet ein abstraktes Nomen — wie deutsch *das Gute*: **lo bueno** „das Gute daran“, **lo importante es…**, **lo mejor** „das Beste“. **lo** + Adjektiv/Adverb + **que** heißt „wie“: **No sabes lo difícil que es** „Du weißt nicht, wie schwer es ist.“
  es-c1-ser-estar-adj:
    meaning: "Adjektive, die mit ser und estar ihre Bedeutung ändern"
    intro: |
      Manche Adjektive bedeuten Verschiedenes: **ser listo** „klug“ / **estar listo** „fertig“; **ser aburrido** „langweilig“ / **estar aburrido** „gelangweilt“; **ser malo** „schlecht“ / **estar malo** „krank“; **ser rico** „reich“ / **estar rico** „lecker“; **ser vivo** „aufgeweckt“ / **estar vivo** „am Leben“; **ser orgulloso** „stolz (arrogant)“ / **estar orgulloso de** „stolz auf“.
  es-c2-futuro-subj:
    meaning: "der Subjuntivo futuro (Recht, Sprichwörter, alte Texte)"
    intro: |
      Das moderne Spanisch hat den Subjuntivo futuro gesprochen verloren, aber er lebt in Rechtstexten, Eiden und Sprichwörtern: **Adonde fueres, haz lo que vieres** „Andere Länder, andere Sitten“. **El que infringiere esta norma será sancionado.** Bildung: der **-ra**-Stamm mit **-re**: **hablare, tuviere, fuere, hiciere**. Lies ihn als Subjuntivo Präsens (oder als portugiesischen Konjunktiv Futur).
  es-c2-preterito-anterior:
    meaning: "das Pretérito anterior"
    intro: |
      **hube, hubiste, hubo, hubimos, hubisteis, hubieron** + Partizip, nach **apenas, en cuanto, cuando, una vez que, tan pronto como**: eine Handlung unmittelbar vor einer anderen vergangenen. **Apenas hubo terminado, se fue.** Nur in literarischer Erzählung; gesprochen Indefinido oder Plusquamperfekt: **En cuanto terminó, se fue.**
  es-c2-se-forma:
    meaning: "der Subjuntivo imperfecto auf -se und die -ra-Form im Schriftgebrauch"
    intro: |
      **-se** und **-ra** sind als Subjuntivo austauschbar: **Si tuviese / tuviera tiempo…**; **-se** ist in Spanien und im gepflegten Schriftgebrauch häufiger. Aber nur **-ra** kann den Konditional ersetzen (**Hubiera / Habría sido mejor**) oder, in Journalismus und Literatur, das Plusquamperfekt Indikativ: **el que fuera presidente** „der einstige Präsident“.
  es-c2-cuyo:
    meaning: "cuyo: dessen, deren, kongruiert mit dem Besitztum"
    intro: |
      **cuyo, cuya, cuyos, cuyas** kongruiert mit dem folgenden Nomen, nicht mit dem Besitzer: **el autor cuya novela leí** „der Autor, dessen Roman ich gelesen habe“, **la casa cuyos dueños viven fuera**. Es gehört zur Schriftsprache; gesprochen wird es oft umgangen (~~que su~~ gilt als nicht normgerecht).
  es-c2-el-cual:
    meaning: "el cual, la cual, lo cual nach Präpositionen und Kommas"
    intro: |
      **el cual / la cual / los cuales / las cuales** (= el que) nach Präpositionen und in nicht-restriktiven Sätzen, vor allem schriftlich: **la razón por la cual vine**, **el edificio, en el cual trabajo**. **lo cual / lo que** bezieht sich auf eine ganze Idee: **Llegó tarde, lo cual me molestó.** „Er kam spät, was mich ärgerte.“
  es-c2-que-subj:
    meaning: "unabhängiges que + Subjuntivo: Wünsche und Befehle"
    intro: |
      Ein Hauptsatz kann mit **que** + Subjuntivo beginnen: Wünsche **¡Que te vaya bien! ¡Que aproveche! ¡Que descanses!** und indirekte Befehle **Que pase el siguiente** „Der Nächste, bitte“, **Que lo haga él.** „Soll er es doch machen.“ Es ist die Kurzform von *quiero / espero que…*.
  es-c2-quiza:
    meaning: "quizá, tal vez, acaso: der Modus als Grad des Zweifels"
    intro: |
      **quizá(s), tal vez, posiblemente, probablemente** vor dem Verb nehmen beide Modi: Subjuntivo für mehr Zweifel (**Quizá venga mañana**), Indikativ für eine wahrscheinlichere Vermutung (**Quizá viene mañana**). Nach dem Verb nur Indikativ: **Viene mañana, quizá.** **a lo mejor** nimmt immer den Indikativ: **A lo mejor llueve.**
  es-c2-por-mas-que:
    meaning: "verstärkte Einräumung: por más que, por mucho que, por muy… que"
    intro: |
      **por más / mucho que** + Verb, **por muy** + Adjektiv + **que**: „so sehr … auch“: **Por mucho que insistas, no iré. Por muy rico que sea, no es feliz.** Meist Subjuntivo; Indikativ nur bei bekannter Tatsache. Außerdem förmlich **si bien** „obwohl“ (+ Indikativ) und **aun cuando** „selbst wenn“.
  es-c2-voseo:
    meaning: "Voseo: die vos-Formen Argentiniens, Uruguays und Mittelamerikas"
    intro: |
      Am Río de la Plata und in weiten Teilen Mittelamerikas ersetzt **vos** das **tú**, mit eigenem Präsens: Betonung auf der Endung, **-ás, -és, -ís**: **vos hablás, tenés, vivís**; **vos sos** „du bist“. Imperativ: **hablá, tené, vení, decí**. Subjekt- und Objektpronomen: **vos** (**te** bleibt: **te quiero**); Possessiv **tu**.
  es-c2-diminutivos:
    meaning: "Diminutive und Augmentative: -ito, -illo, -ón, -azo"
    intro: |
      **-ito / -ita** (allgemein), **-illo** (Spanien, Andalusien), **-ico** (Karibik, Aragón) drücken Kleinheit, Zuneigung oder Höflichkeit aus: **un momentito, un cafecito, ahorita** (Mexiko: „sofort“ oder „gleich“). **-ón / -ona** und **-azo** vergrößern oder verstärken: **un cochazo** „ein tolles Auto“, **un golpazo**, **un portazo** „ein Türknallen“. Manche sind eigene Wörter geworden: **bolsillo, ventanilla, cajón**.
  es-c2-anteposicion:
    meaning: "Adjektive, deren Bedeutung sich mit der Stellung ändert"
    intro: |
      Vor dem Nomen ist ein Adjektiv subjektiv oder übertragen, danach wörtlich: **un gran hombre** „ein großer (bedeutender) Mann“ / **un hombre grande** „ein großer (hochgewachsener) Mann“; **un pobre chico** „ein armer (bedauernswerter) Junge“ / **un chico pobre** „ein armer (mittelloser) Junge“; **un viejo amigo** „ein alter (langjähriger) Freund“ / **un amigo viejo** „ein betagter Freund“; **el mismo día** „derselbe Tag“ / **el rey mismo** „der König selbst“; **cierto problema** „ein gewisses Problem“ / **un dato cierto** „eine wahre Angabe“; **un nuevo coche** „ein anderes Auto“ / **un coche nuevo** „ein brandneues Auto“.
  es-c2-infinitivo-compuesto:
    meaning: "der Infinitiv Perfekt: haber + Partizip nach Präpositionen"
    intro: |
      **haber** + Partizip als Infinitiv, nach **tras, después de, por, sin, de, al**: **Tras haber comido, salimos. Gracias por haber venido. Me arrepiento de no haberlo hecho.** Förmliches Spanisch nimmt auch **al** + Infinitiv für „als“: **Al llegar, llamó.** „Als er ankam, rief er an.“
    mistakes: ["zusammengesetzte Tempora immer mit haber."]
