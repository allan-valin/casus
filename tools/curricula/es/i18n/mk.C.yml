# Macedonian text of the Spanish course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Subjunctive nuances: "Нијанси на субјунктивот"
  Time, guesses and politeness: "Време, претпоставки и учтивост"
  Discourse and connectors: "Дискурс и сврзници"
  Literary and formal verb forms: "Книжевни и официјални глаголски форми"
  Sentence structure: "Градба на реченицата"
  Register and variation: "Регистар и варијации"
lessons:
  es-c1-no-creo-que:
    meaning: "одреченото мислење и перцепција земаат субјунктив"
    intro: |
      **creer, pensar, parecer, decir, estar seguro de** + индикатив кога се потврдни: **Creo que es verdad.** Одречени земаат субјунктив: **No creo que sea verdad. No me parece que tengas razón.** Одречно прашање може да го задржи индикативот: **¿No crees que es tarde?** (очекуваш „да“).
    mistakes: ["одречено creer: субјунктив."]
  es-c1-valoracion:
    meaning: "субјунктив по вредносни судови"
    intro: |
      **ser / parecer** + вредносна придавка или именка + **que** + субјунктив: **Es normal que estés cansado. Es una pena que no puedas venir. Me parece lógico que se queje.** Дури и кога фактот е вистинит, судот го прави субјунктив. Исто така обично **el hecho de que**: **El hecho de que lo sepa no cambia nada.** Изјавите за вистинитост го задржуваат индикативот: **Es verdad que / Está claro que es así.**
  es-c1-lo-que-sea:
    meaning: "слободни релативи и удвоен субјунктив"
    intro: |
      **lo que / donde / como / quien / cuando** + субјунктив го оставаат изборот отворен: **Haz lo que quieras.** „Прави што сакаш.“ **Ven cuando puedas. Siéntate donde quieras.** Повторувањето на глаголот дава „што и да“: **pase lo que pase** „што и да се случи“, **digan lo que digan**, **sea como sea** „како и да е“, **cueste lo que cueste** „по секоја цена“.
  es-c1-como-si:
    meaning: "como si + имперфектен или плусквамперфектен субјунктив"
    intro: |
      **como si** „како да“ секогаш зема минат субјунктив, без оглед на времето на главниот глагол: **Habla como si fuera el jefe. Me miró como si no me hubiera visto nunca.** Никогаш сегашно: ~~como si es~~.
  es-c1-condicionales:
    meaning: "условни сврзници со субјунктив"
    intro: |
      Покрај **si**: **a menos que / a no ser que** „освен ако“, **con tal de que / siempre que** „под услов да“, **en caso de que** „во случај да“, **salvo que** „освен ако“. Сите земаат субјунктив: **Iré a menos que llueva. Te lo presto siempre que me lo devuelvas.** (**siempre que** + индикатив значи „секогаш кога“.)
  es-c1-futuro-conjetura:
    meaning: "идно и условно на претпоставка"
    intro: |
      Идното често значи „веројатно, се прашувам“ за сегашноста: **¿Dónde estará Tom?** „Каде ли е Том?“ **Serán las diez** „Ќе да е околу десет.“ Условното го прави истото за минатото: **Serían las diez cuando llegó** „Ќе да беше околу десет кога стигна.“ **Tendría veinte años** „Веројатно имаше дваесет години.“
  es-c1-cortesia:
    meaning: "ублажени барања и совети: quisiera, debería, podría"
    intro: |
      Три степени на учтивост: **Quiero un café** (директно), **Querría un café**, **Quisiera un café** (најучтиво; -ra субјунктив употребен сам). Советите се ублажуваат на ист начин: **Deberías / Debieras descansar.** **Podría** и **pudiera** за барања и можности.
  es-c1-mixtas:
    meaning: "мешани условни реченици и de + инфинитив"
    intro: |
      Минат услов, сегашна последица: **Si hubiera estudiado medicina, ahora sería médico.** Сегашен услов, минато последица: **Si fuera más listo, no lo habría hecho.** Во официјален стил **de** + инфинитив го заменува **si**: **De haberlo sabido, habría venido** „Да знаев…“. **De seguir así** „Ако продолжи вака“.
  es-c1-contraste:
    meaning: "спротивност: sin embargo, no obstante, en cambio, por el contrario"
    intro: |
      **sin embargo / no obstante** „меѓутоа“ (no obstante е поофицијално), **en cambio** „од друга страна“ за спротивност меѓу две работи, **por el contrario** „напротив“ за исправка. Обично стојат меѓу запирки: **Es caro; sin embargo, vale la pena.**
  es-c1-causa-consecuencia:
    meaning: "причина и последица: ya que, puesto que, dado que, así que"
    intro: |
      Причина: **porque** (неутрално), **ya que / puesto que / dado que** (причината е позната, често напред): **Ya que estás aquí, ayúdame.** „Штом си тука, помогни ми.“ **como** на почетокот: **Como llovía, no salimos.** Последица: **así que, de modo que, por lo tanto, por eso**: **Llovía, así que no salimos.**
  es-c1-duplicacion:
    meaning: "удвоени предмети: a mí me, a Juan le, el libro lo"
    intro: |
      Индиректниот предмет обично се удвојува со заменка — исто како во македонскиот (**му ја дадов на Хуан**): **Le di el libro a Juan. A mí me gusta.** Директен предмет ставен напред мора да се повтори со заменка: **El libro lo compré ayer. A tu hermana la vi en el cine.** Без заменката звучи погрешно.
  es-c1-lo-adjetivo:
    meaning: "среден род lo + придавка"
    intro: |
      **lo** + придавка прави апстрактна именка: **lo bueno** „доброто“, **lo importante es…**, **lo mejor** „најдоброто“. **lo** + придавка/прилог + **que** значи „колку“: **No sabes lo difícil que es** „Не знаеш колку е тешко.“
  es-c1-ser-estar-adj:
    meaning: "придавки што го менуваат значењето со ser и estar"
    intro: |
      Некои придавки значат различни работи: **ser listo** „паметен“ / **estar listo** „готов“; **ser aburrido** „досаден“ / **estar aburrido** „му е досадно“; **ser malo** „лош“ / **estar malo** „болен“; **ser rico** „богат“ / **estar rico** „вкусен“; **ser vivo** „бистар“ / **estar vivo** „жив“; **ser orgulloso** „горд (арогантен)“ / **estar orgulloso de** „горд на“.
  es-c2-futuro-subj:
    meaning: "идниот субјунктив (право, поговорки, стари текстови)"
    intro: |
      Современиот шпански го изгубил идниот субјунктив во говорот, но опстојува во правни текстови, заклетви и поговорки: **Adonde fueres, haz lo que vieres** „Каде што одиш, прави како што гледаш“. **El que infringiere esta norma será sancionado.** Образување: основата на **-ra** со **-re**: **hablare, tuviere, fuere, hiciere**. Читај го како сегашен субјунктив (или португалскиот иден субјунктив).
  es-c2-preterito-anterior:
    meaning: "претходното минато (pretérito anterior)"
    intro: |
      **hube, hubiste, hubo, hubimos, hubisteis, hubieron** + партицип, по **apenas, en cuanto, cuando, una vez que, tan pronto como**: дејство непосредно пред друго минато. **Apenas hubo terminado, se fue.** Само во книжевно раскажување; говорот користи претерит или плусквамперфект: **En cuanto terminó, se fue.**
  es-c2-se-forma:
    meaning: "имперфектниот субјунктив на -se и формата на -ra во пишувањето"
    intro: |
      **-se** и **-ra** се заменливи како субјунктив: **Si tuviese / tuviera tiempo…**; **-se** е почест во Шпанија и во грижливото пишување. Но само **-ra** може да го замени условниот (**Hubiera / Habría sido mejor**) или, во новинарството и книжевноста, плусквамперфектот индикатив: **el que fuera presidente** „поранешниот претседател“.
  es-c2-cuyo:
    meaning: "cuyo: чиј, согласуван со поседуваното"
    intro: |
      **cuyo, cuya, cuyos, cuyas** се согласува со именката што следи, не со сопственикот — како македонското **чиј**: **el autor cuya novela leí** „авторот чиј роман го прочитав“, **la casa cuyos dueños viven fuera**. Припаѓа на пишувањето; говорот често го избегнува (~~que su~~ се смета за нестандардно).
  es-c2-el-cual:
    meaning: "el cual, la cual, lo cual по предлози и запирки"
    intro: |
      **el cual / la cual / los cuales / las cuales** (= el que) по предлози и во неограничувачки реченици, главно во пишувањето: **la razón por la cual vine**, **el edificio, en el cual trabajo**. **lo cual / lo que** се однесува на цела идеја: **Llegó tarde, lo cual me molestó.** „Задоцни, што ме налути.“
  es-c2-que-subj:
    meaning: "самостојно que + субјунктив: желби и наредби"
    intro: |
      Главна реченица може да почне со **que** + субјунктив: желби **¡Que te vaya bien! ¡Que aproveche! ¡Que descanses!** и индиректни наредби **Que pase el siguiente** „Нека влезе следниот“, **Que lo haga él.** „Нека го направи тој.“ Тоа е скратена форма на *quiero / espero que…* — како македонското **нека**.
  es-c2-quiza:
    meaning: "quizá, tal vez, acaso: начинот како степен на сомнеж"
    intro: |
      **quizá(s), tal vez, posiblemente, probablemente** пред глаголот земаат кој било начин: субјунктив за поголем сомнеж (**Quizá venga mañana**), индикатив за поверојатна претпоставка (**Quizá viene mañana**). По глаголот само индикатив: **Viene mañana, quizá.** **a lo mejor** секогаш зема индикатив: **A lo mejor llueve.**
  es-c2-por-mas-que:
    meaning: "засилена допусност: por más que, por mucho que, por muy… que"
    intro: |
      **por más / mucho que** + глагол, **por muy** + придавка + **que**: „колку и да“: **Por mucho que insistas, no iré.** „Колку и да инсистираш, нема да одам.“ **Por muy rico que sea, no es feliz.** Обично субјунктив; индикатив само за познат факт. Исто така официјално **si bien** „иако“ (+ индикатив) и **aun cuando** „дури и ако“.
  es-c2-voseo:
    meaning: "восео: формите со vos во Аргентина, Уругвај и Централна Америка"
    intro: |
      Во Рио де ла Плата и голем дел од Централна Америка **vos** го заменува **tú**, со свое сегашно: нагласок на наставката, **-ás, -és, -ís**: **vos hablás, tenés, vivís**; **vos sos** „ти си“. Заповеден: **hablá, tené, vení, decí**. Подметска и предметска заменка: **vos** (**te** останува: **te quiero**); присвојно **tu**.
  es-c2-diminutivos:
    meaning: "деминутиви и аугментативи: -ito, -illo, -ón, -azo"
    intro: |
      **-ito / -ita** (општо), **-illo** (Шпанија, Андалузија), **-ico** (Карибите, Арагон) изразуваат малечкост, наклонетост или учтивост — како македонското **-че**: **un momentito, un cafecito, ahorita** (Мексико: „веднаш“ или „за малку“). **-ón / -ona** и **-azo** зголемуваат или засилуваат: **un cochazo** „одлична кола“, **un golpazo**, **un portazo** „треснување врата“. Некои станале самостојни зборови: **bolsillo, ventanilla, cajón**.
  es-c2-anteposicion:
    meaning: "придавки чие значење се менува со местото"
    intro: |
      Пред именката придавката е субјективна или преносна, по неа буквална: **un gran hombre** „голем (значаен) човек“ / **un hombre grande** „голем (крупен) човек“; **un pobre chico** „кутро момче“ / **un chico pobre** „сиромашно момче“; **un viejo amigo** „стар (долгогодишен) пријател“ / **un amigo viejo** „постар пријател“; **el mismo día** „истиот ден“ / **el rey mismo** „самиот крал“; **cierto problema** „извесен проблем“ / **un dato cierto** „точен податок“; **un nuevo coche** „друга кола“ / **un coche nuevo** „сосема нова кола“.
  es-c2-infinitivo-compuesto:
    meaning: "перфектниот инфинитив: haber + партицип по предлози"
    intro: |
      **haber** + партицип како инфинитив, по **tras, después de, por, sin, de, al**: **Tras haber comido, salimos. Gracias por haber venido. Me arrepiento de no haberlo hecho.** Официјалниот шпански користи и **al** + инфинитив за „кога“: **Al llegar, llamó.** „Кога стигна, се јави.“
    mistakes: ["сложените времиња секогаш со haber."]
