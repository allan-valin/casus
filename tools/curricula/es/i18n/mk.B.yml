# Macedonian text of the Spanish course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Moods: "Начини"
  Complex sentences: "Сложени реченици"
  The imperfect subjunctive: "Имперфектниот субјунктив"
  Subjunctive in clauses: "Субјунктив во зависни реченици"
  Perfect tenses and reported speech: "Перфектни времиња и пренесен говор"
  Passive, se and periphrases: "Пасив, se и перифрази"
lessons:
  es-subjuntivo:
    meaning: "сегашниот субјунктив"
    intro: |
      По желби, чувства, сомнеж и **para que, cuando** (иднина) — каде македонскиот често има **да**: **Quiero que vengas.** „Сакам да дојдеш.“ **Ojalá llueva. Cuando llegues, llámame.** Образување: основата на yo во сегашно со „другата“ самогласка: **-ar → -e** (hable), **-er/-ir → -a** (coma, viva); неправилни **sea, esté, vaya, haya, sepa, dé**.
  es-condicional:
    meaning: "условниот начин"
    intro: |
      Основа на идното + **-ía, -ías, -ía, -íamos, -íais, -ían**: **hablaría, tendría, podría**. Учтиви барања (**¿Podrías ayudarme?**) и нереални услови: **Si tuviera dinero, viajaría.** „Да имав пари, би патувал.“
  es-por-para:
    meaning: "por и para"
    intro: |
      **para**: цел, насока, примач, рок (**para ti, para mañana, para aprender**). **por**: причина, средство, замена, низ, траење (**por la lluvia, por teléfono, gracias por todo, por la calle**).
  es-relatives:
    meaning: "релативни заменки"
    intro: |
      **que** (кој, што) во повеќето случаи: **el libro que leo**; **quien / quienes** за луѓе по предлог: **la chica con quien hablé**; **donde** за места; **lo que** она што: **No sé lo que quieres.**
  es-b2-imperfecto-subj:
    meaning: "имперфектниот субјунктив"
    intro: |
      Земи го 3 лице множина од претеритот, отстрани **-ron**, додај **-ra** или **-se**: **hablaron → hablara / hablase**, **tuvieron → tuviera / tuviese**, **fueron → fuera / fuese**. Двете серии значат исто; **-ra** е почест во говорот, **-se** во пишувањето. Се користи каде е потребен субјунктив, а главниот глагол е во минато или условен: **Quería que vinieras. Me pidió que lo ayudara.**
  es-b2-si-irreal:
    meaning: "нереални услови во сегашноста"
    intro: |
      **si** + имперфектен субјунктив, па условен: **Si tuviera tiempo, viajaría más.** „Да имав време, повеќе би патувал.“ Никогаш условен или сегашен субјунктив по **si**: ~~si tendría~~, ~~si tenga~~. За реални услови **si** зема индикатив: **Si llueve, me quedo.**
    mistakes: ["по si: имперфектен субјунктив, никогаш условен."]
  es-b2-pluscuamperfecto-subj:
    meaning: "плусквамперфектниот субјунктив"
    intro: |
      **hubiera / hubiese** + партицип: **Si lo hubiera sabido, habría venido.** „Да знаев, ќе дојдев.“ И по минати желби и жалења: **Ojalá no hubiera dicho nada. Me alegré de que hubieras llegado.**
  es-b2-relativo-subj:
    meaning: "субјунктив во релативни реченици"
    intro: |
      Релативната реченица зема субјунктив кога нејзиниот антецедент е непознат, хипотетичен или одречен: **Busco a alguien que sepa francés** (кој било) наспроти **Conozco a alguien que sabe francés** (реална личност). По **nadie, nada, ningún** секогаш субјунктив: **No hay nadie que lo entienda.**
  es-b2-temporales:
    meaning: "субјунктив во временски реченици за иднината"
    intro: |
      **cuando, en cuanto, hasta que, mientras, tan pronto como** + субјунктив кога настанот уште не се случил: **Te llamo en cuanto llegue.** „Ќе ти се јавам штом стигнам.“ **Espera hasta que vuelva.** Со минати или вообичаени факти — индикатив: **Cuando llegó, cenamos.** **antes de que** секогаш зема субјунктив.
    mistakes: ["нема идно по cuando: сегашен субјунктив."]
  es-b2-finales:
    meaning: "цел и начин: para que, sin que, a fin de que"
    intro: |
      **para que, a fin de que, sin que** секогаш земаат субјунктив: **Te lo explico para que lo entiendas. Salió sin que nadie lo viera.** Со ист подмет користи инфинитив: **Estudio para aprender** (не ~~para que aprenda~~).
  es-b2-concesivas:
    meaning: "допусност: aunque со индикатив или субјунктив"
    intro: |
      **aunque** + индикатив изнесува факт: **Aunque llueve, salgo** „Иако врне…“. **aunque** + субјунктив го остава отворено или го отфрла: **Aunque llueva, saldré** „Дури и да врне…“. Други допусни врски: **a pesar de que, por más que, aun así, si bien**.
  es-b2-condicional-compuesto:
    meaning: "минатиот условен"
    intro: |
      **habría, habrías, habría, habríamos, habríais, habrían** + партицип: што ќе се случело. **Habría ido, pero estaba enfermo.** Во главната реченица на минат нереален услов: **Si me hubieras llamado, habría venido.** Во говорот таму се јавува и формата на **-ra**: **hubiera venido**.
  es-b2-futuro-perfecto:
    meaning: "идното минато, и за претпоставки за минатото"
    intro: |
      **habré, habrás, habrá, habremos, habréis, habrán** + партицип: **Para el lunes habré terminado** „До понеделник ќе имам завршено“. Многу често е претпоставка за она што се случило: **Habrá salido** „Мора да излегол“. **¿Qué le habrá pasado?** „Што ли му се случило?“
  es-b2-estilo-indirecto:
    meaning: "пренесен говор и слагање на времињата"
    intro: |
      Кога глаголот на кажување е во минато, времињата се поместуваат назад: **"Vendré"** → **Dijo que vendría**; **"Estoy cansado"** → **Dijo que estaba cansado**; **"He terminado"** → **Dijo que había terminado**; заповед **"Ven"** → **Me dijo que fuera**. Прашањата земаат **si** или прашалниот збор: **Me preguntó si quería café.**
  es-b2-pasiva:
    meaning: "пасивот со ser"
    intro: |
      **ser** + партицип согласуван со подметот, **por** за вршителот: **El libro fue escrito por Cervantes. Las casas fueron construidas en 1900.** Припаѓа на пишаниот и официјалниот шпански; говорот претпочита актив или **se**: **Se construyeron las casas en 1900.**
  es-b2-se-pasiva:
    meaning: "пасивно и безлично se"
    intro: |
      **se** + глагол во 3 лице без именуван вршител — како македонското **се зборува**: **Se habla español. Se venden pisos. Se vive bien aquí.** Глаголот се согласува со нештото: **se vende una casa / se venden casas**. Со луѓе како предмет глаголот останува во еднина: **Se busca a los culpables.**
  es-b2-se-involuntario:
    meaning: "ненамерно se: se me olvidó, se le cayó"
    intro: |
      **se** + индиректна заменка + глагол претставува нешто како незгода — исто како македонското **ми се заборави**: **Se me olvidó** „Ми се заборави“, **Se le cayó el vaso** „Му падна чашата“, **Se nos rompió el coche.** Глаголот се согласува со нештото: **Se me olvidaron las llaves.**
  es-b2-perifrasis:
    meaning: "глаголски перифрази со инфинитив"
    intro: |
      **volver a** + инфинитив „пак да направи“: **Volvió a llamar.** **dejar de** „да престане“: **Dejé de fumar.** **acabar de** „штотуку“: **Acabo de llegar.** **ponerse a** „да почне“: **Se puso a llorar.** **estar a punto de** „само што не“. Предлогот е фиксен.
  es-b2-gerundio-perifrasis:
    meaning: "перифрази со герунд: llevar, seguir, ir, andar"
    intro: |
      **llevar** + време + герунд: колку долго трае нешто: **Llevo dos años estudiando español.** „Веќе две години учам шпански.“ **seguir / continuar** + герунд „продолжува“: **Sigue lloviendo.** **ir** + герунд: постепен напредок: **Voy entendiendo.** **andar** + герунд: оди наоколу и прави: **Anda diciendo tonterías.**
