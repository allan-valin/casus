# Macedonian text of the Spanish course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Articles and nouns: "Членови и именки"
  Ser, estar and the present: "Ser, estar и сегашното"
  Negation and questions: "Негација и прашања"
  Pronouns: "Заменки"
  The past: "Минатото"
lessons:
  es-articles:
    meaning: "членовите и родот"
    intro: |
      Машки **el / los**, женски **la / las**; неопределени **un, una, unos, unas**. Членот стои пред именката. Повеќето именки на **-o** се од машки род, на **-a** од женски (**el libro, la casa**), со исклучоци (**el día, la mano, el problema**). **a + el = al**, **de + el = del**.
  es-ser-estar:
    meaning: "ser и estar: два глагола за „е, сум“"
    intro: |
      **ser** (soy, eres, es, somos, sois, son) за идентитет, потекло, професија, час; **estar** (estoy, estás, está, estamos, estáis, están) за место и состојби: **Soy brasileño. Estoy cansado. Madrid está en España.** За говорителите на португалски: поделбата е речиси иста како во португалскиот.
  es-present:
    meaning: "сегашното: -ar, -er, -ir"
    intro: |
      **-ar** (hablar): hablo, hablas, habla, hablamos, habláis, hablan. **-er** (comer): como, comes, come, comemos, coméis, comen. **-ir** (vivir): vivo, vives, vive, vivimos, vivís, viven. Глаголи со промена на основата: **e → ie** (quiero), **o → ue** (puedo), **e → i** (pido), освен во nosotros/vosotros.
  es-questions:
    meaning: "прашални зборови (со акцент)"
    intro: |
      **qué** што, **quién** кој, **dónde** каде, **cuándo** кога, **cómo** како, **por qué** зошто, **cuánto** колку, **cuál** кој (од нив). Носат акцент; прашањата почнуваат со **¿**, а извиците со **¡**: **¿Dónde vives?**
  es-negation:
    meaning: "негација: no, nunca, nada, nadie"
    intro: |
      **no** пред глаголот: **No sé.** Двојната негација е нормална — како во македонскиот: **No veo nada.** „Не гледам ништо.“ **No viene nadie. No voy nunca** (или **Nunca voy**).
  es-object-pronouns:
    meaning: "објектни заменки: lo, la, le, se lo"
    intro: |
      Директни **lo, la, los, las**; индиректни **le, les**; исто така **me, te, nos, os**. Стојат пред менлив глагол (**Lo veo**), по инфинитив или заповед, споени (**Quiero verlo. ¡Dímelo!**). **le / les** стануваат **se** пред lo / la: **Se lo doy.**
  es-gustar:
    meaning: "gustar и слични глаголи"
    intro: |
      **gustar** работи „наопаку“ — како македонското **ми се допаѓа**: допаѓаното е подмет, личноста индиректен предмет: **Me gusta el café.** „Ми се допаѓа кафето.“ **Me gustan los libros.** Исто така **encantar, interesar, doler, faltar, parecer**.
  es-preterito:
    meaning: "претеритот: завршено минато"
    intro: |
      **-ar**: hablé, hablaste, habló, hablamos, hablasteis, hablaron. **-er / -ir**: comí, comiste, comió, comimos, comisteis, comieron. Неправилни и чести: **ser / ir → fui, fuiste, fue**; **tener → tuve**, **hacer → hice**, **estar → estuve**, **poder → pude**, **decir → dije**.
  es-imperfecto:
    meaning: "имперфектот: правеше, имаше обичај"
    intro: |
      **-ar**: hablaba, hablabas, hablaba, hablábamos, hablabais, hablaban; **-er / -ir**: comía, comías, comía… Само три неправилни: **ser → era**, **ir → iba**, **ver → veía**. Позадина, навики, описи — како во португалскиот.
  es-perfecto:
    meaning: "перфектот: haber + партицип"
    intro: |
      **he, has, ha, hemos, habéis, han** + партицип (**-ado, -ido**; неправилни **hecho, dicho, visto, escrito, puesto, vuelto, abierto**): **He comido.** Во Шпанија тоа е минатото на денешниот ден; во Латинска Америка почест е претеритот.
  es-futuro:
    meaning: "идното и ir a + инфинитив"
    intro: |
      Инфинитив + **-é, -ás, -á, -emos, -éis, -án**: **hablaré, comerás, vivirá**. Неправилни основи: **tendr-, podr-, har-, dir-, saldr-, vendr-, querr-, sabr-, pondr-**. Секојдневно: **voy a + инфинитив**: **Voy a comer.**
