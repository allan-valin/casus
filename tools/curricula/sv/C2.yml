id: C2
topics:

- title: {en: Literature and variety, pt: Literatura e variedade}
  lessons:
  - id: sv-literature
    title: Strindberg, Lagerlöf, Lindgren
    meaning: {en: "reading the classics; older spelling", pt: "lendo os clássicos; grafia antiga"}
    intro:
      en: |
        August Strindberg (*Röda rummet*, 1879) and Selma Lagerlöf (*Nils Holgerssons underbara resa*, 1906–07; Nobel 1909) wrote before the 1906 spelling reform took hold: **hvad, hafva, qvinna** for *vad, ha, kvinna*, and plural verbs (**vi äro, de voro** for *vi är, de var*). Astrid Lindgren's modern prose is the easiest classic.
      pt: |
        August Strindberg (*Röda rummet*, 1879) e Selma Lagerlöf (*Nils Holgerssons underbara resa*, 1906–07; Nobel de 1909) escreveram antes de a reforma ortográfica de 1906 se firmar: **hvad, hafva, qvinna** por *vad, ha, kvinna*, e verbos no plural (**vi äro, de voro** por *vi är, de var*). A prosa moderna de Astrid Lindgren é o clássico mais fácil.
    examples:
    - ["Du gamla, du fria, du fjällhöga nord.", "You ancient, you free, you mountainous north.", "Tu antigo, tu livre, tu montanhoso norte.", "fjällhöga"]
    match: {seq: [{word: [hvad, hafva, äro, voro, gamla, fria, nord]}]}
    pool: [hvad, äro, voro]
  - id: sv-varieties
    title: finlandssvenska, skånska, rikssvenska
    meaning: {en: "Swedish in Finland and the dialects", pt: "o sueco na Finlândia e os dialetos"}
    intro:
      en: |
        Swedish is official in Finland too (*finlandssvenska*, with its own words: **kiva** nice, **semla** for a bread roll), and in Åland. In Sweden, *Skånska* in the south sounds close to Danish, *Gotländska* and the northern dialects differ strongly; the standard (**rikssvenska**) is what the reader knows.
      pt: |
        O sueco também é oficial na Finlândia (*finlandssvenska*, com palavras próprias: **kiva** legal, **semla** um pãozinho), e em Åland. Na Suécia, o *skånska* do sul soa próximo do dinamarquês, o *gotländska* e os dialetos do norte diferem muito; o padrão (**rikssvenska**) é o que o leitor conhece.
    examples:
    - ["Svenska talas också i Finland.", "Swedish is also spoken in Finland.", "O sueco também é falado na Finlândia.", "Finland"]
    match: {seq: [{word: [Finland, Åland, dialekt, dialekter, finlandssvenska, skånska]}]}
    pool: [Finland, Åland, dialekt]
