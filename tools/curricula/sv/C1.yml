id: C1
topics:

- title: {en: Talking about ideas, pt: Falando de ideias}
  lessons:
  - id: sv-abstract
    title: frihet, jämlikhet, utveckling
    meaning: {en: "abstract nouns", pt: "substantivos abstratos"}
    intro:
      en: |
        **-het** (**frihet** freedom, **jämlikhet** equality, **säkerhet**), **-ning** from verbs (**utveckling** development, **forskning** research), **-skap** (**vänskap** friendship, **kunskap** knowledge), **-else** (**upplevelse** experience). **-het** and **-skap** are en-words, **-ande** nouns ett-words (**samarbetet**).
      pt: |
        **-het** (**frihet** liberdade, **jämlikhet** igualdade, **säkerhet** segurança), **-ning** de verbos (**utveckling** desenvolvimento, **forskning** pesquisa), **-skap** (**vänskap** amizade, **kunskap** conhecimento), **-else** (**upplevelse** experiência). **-het** e **-skap** são palavras en; os nomes em **-ande**, ett.
    examples:
    - ["Frihet och jämlikhet är viktiga värden.", "Freedom and equality are important values.", "Liberdade e igualdade são valores importantes.", "Frihet"]
    match: {seq: [{pos: noun, re: "(het|heten|ning|ningen|skap|skapen|else|elsen)$"}]}
