# Macedonian text of the Swedish course, A1–A2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "Гласови и букви"
  Nouns and the article: "Именки и членот"
  Pronouns and the present: "Заменки и сегашно време"
  Questions and negation: "Прашања и негација"
  Numbers and time: "Броеви и време"
  Past and future: "Минато и идно време"
  Adjectives and possessives: "Придавки и присвојни зборови"
  Little words: "Мали зборови"
lessons:
  sv-alphabet:
    meaning: "шведските букви и гласови"
    intro: |
      **å** е долго *о* (**båt** чамец), **ä** отворено *е* (**här** тука), **ö** како германското *ö* (**öga** око). **sj, skj, stj** и **sk** пред мека самогласка се издишано *ш* (**sju** седум, **skön**); **tj, kj** и **k** пред мека самогласка се меко *ч* (**tjugo, kör**). Самогласката е долга пред една согласка, кратка пред две (**tak** покрив, **tack** благодарам).
  sv-en-ett:
    meaning: "два рода: en и ett"
    intro: |
      Именките се од *заеднички* род (**en**: **en bok** книга, **en flicka** девојче) или *среден* (**ett**: **ett hus** куќа, **ett barn** дете). Околу три од четири се зборови со **en**; учете ја секоја именка со нејзиниот член.
  sv-definite:
    meaning: "определениот член е наставка"
    intro: |
      Членот се додава на крајот — како во македонскиот: **en bok → boken** (книгата), **ett hus → huset** (куќата); множина **böckerna, husen**. Со придавка членот се појавува двапати: **den stora boken, det stora huset, de stora husen**.
  sv-plural:
    meaning: "пет групи за множина"
    intro: |
      **-or** (**flicka → flickor**), **-ar** (**bil → bilar**), **-er** (**stad → städer**), **-n** (**äpple → äpplen**) и без наставка (**barn → barn**, **hus → hus**). Некои ја менуваат самогласката: **bok → böcker**, **man → män**.
  sv-pronouns:
    meaning: "лични заменки"
    intro: |
      **jag** (јас), **du** (ти), **han / hon** (тој / таа), **den / det** (тоа, за зборови со en и ett), **vi** (ние), **ni** (вие), **de** (тие, се изговара *dom*). Во Шведска речиси на секого му се вели **du**; **ni** за едно лице е ретко и старомодно.
  sv-present:
    meaning: "сегашно време: една форма за сите лица"
    intro: |
      Шведските глаголи не се менуваат по лице: **jag läser, du läser, hon läser, vi läser**. Сегашното завршува на **-r**: **tala → talar**, **läsa → läser**, **bo → bor**. **vara** (сум) → **är**, **ha** (има) → **har**.
  sv-v2:
    meaning: "глаголот стои на второ место"
    intro: |
      Во главната реченица глаголот е секогаш втор. Ако нешто друго стои прво (време, место, објект), подметот оди по глаголот: **Jag läser idag → Idag läser jag** (денеска читам). **I Sverige talar man svenska** (во Шведска се зборува шведски).
  sv-questions:
    meaning: "прашања: глаголот прв"
    intro: |
      **vad** (што), **vem** (кој), **var** (каде), **vart** (накаде), **när** (кога), **varför** (зошто), **hur** (како), **hur mycket / många** (колку). Прашањата да/не почнуваат со глаголот: **Talar du svenska? Bor du här?**
  sv-inte:
    meaning: "негација: inte по глаголот"
    intro: |
      **inte** (не) доаѓа веднаш по глаголот во главната реченица: **Jag förstår inte** (не разбирам). **aldrig** (никогаш), **ingen / inget / inga** (никаков, никој), **ingenting** (ништо). Во зависната реченица **inte** оди пред глаголот: **…att han inte kommer** (дека не доаѓа).
  sv-numbers:
    meaning: "броеви"
    intro: |
      **en / ett, två, tre, fyra, fem, sex, sju, åtta, nio, tio, elva, tolv… tjugo, trettio, hundra, tusen**. **en** или **ett** се согласува со именката: **en bok, ett hus**; од два нагоре не се менува: **två böcker, tre hus**.
  sv-days:
    meaning: "денови и зборови за време"
    intro: |
      **måndag, tisdag, onsdag, torsdag, fredag, lördag, söndag** (со мала буква). *Во понеделник* = **på måndag**; *понеделниците* = **på måndagar**. **idag** (денеска), **imorgon** (утре), **igår** (вчера), **nu** (сега), **på morgonen, på kvällen** (наутро, навечер).
  sv-past:
    meaning: "минато време"
    intro: |
      Слабите глаголи додаваат **-ade, -de, -te, -dde**: **tala → talade**, **höra → hörde**, **läsa → läste**, **bo → bodde**. Силните ја менуваат самогласката: **skriva → skrev**, **dricka → drack**, **gå → gick**, **vara → var**, **ha → hade**. Една форма за сите лица.
  sv-perfect:
    meaning: "перфект: har + супин"
    intro: |
      **har** + *супинот*, посебна форма: **talat, läst, bott, skrivit, varit**: **Jag har läst boken** (ја прочитав книгата), **Har du varit i Sverige?** (си бил ли во Шведска?). Плусквамперфектот со **hade**: **Jag hade redan ätit** (веќе бев јадел).
  sv-future:
    meaning: "идно време"
    intro: |
      **ska** + инфинитив за планови и намери: **Jag ska resa till Malmö** (ќе патувам во Малме); **kommer att** + инфинитив за она што ќе се случи: **Det kommer att regna** (ќе врне). Сегашното често е доволно: **Jag åker imorgon** (заминувам утре).
  sv-adj:
    meaning: "придавките се согласуваат"
    intro: |
      **-** за зборови со en, **-t** за зборови со ett, **-a** во множина и по членот: **en stor bil, ett stort hus, stora bilar, den stora bilen.** Споредба **-are, -ast** (**varm → varmare → varmast**), неправилни **bra → bättre → bäst**, **stor → större → störst**.
  sv-possessive:
    meaning: "присвојни заменки; sin"
    intro: |
      **min / mitt / mina** (мој), **din, hans, hennes, vår, er, deras**: **min bok, mitt hus, mina barn.** **sin / sitt / sina** упатува на подметот — како македонското *свој*: **Han läser sin bok** (својата книга) наспроти **Han läser hans bok** (книгата на друг).
  sv-prepositions:
    meaning: "предлози"
    intro: |
      **i** (во), **på** (на), **till** (до, кон), **från** (од), **med** (со), **om** (за), **för** (за), **av** (од), **hos** (кај), **under, över, efter, utan**. На шведски се вели **på jobbet** (на работа), **i Sverige**, **på svenska** (на шведски).
  sv-modals:
    meaning: "модални глаголи + инфинитив"
    intro: |
      **kan** (може), **vill** (сака), **måste** (мора), **får** (смее), **ska** (треба, ќе), **bör** (би требало) + инфинитив без **att**: **Jag kan simma** (знам да пливам). **Får jag komma in?** (може ли да влезам?). Другите глаголи земаат **att**: **Jag tycker om att läsa** (сакам да читам).
