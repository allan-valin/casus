# German text of the Swedish course, B1–C2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Clauses: "Nebensätze"
  Verb forms: "Verbformen"
  Words: "Wörter"
  Register: "Register"
  Talking about ideas: "Über Ideen sprechen"
  Literature and variety: "Literatur und Vielfalt"
lessons:
  sv-subclause:
    meaning: "Nebensätze: inte vor dem Verb"
    intro: |
      **att** (dass), **som** (der, welcher), **när** (als, wenn), **om** (ob, falls), **eftersom** (weil), **fast / trots att** (obwohl), **innan** (bevor). Im Nebensatz steht das Subjekt vorn, und **inte, aldrig** stehen *vor* dem Verb: **Jag vet att han inte kommer** (ich weiß, dass er nicht kommt). **Boken som jag läser är bra** (das Buch, das ich lese, ist gut).
  sv-particle-verbs:
    meaning: "Partikelverben"
    intro: |
      Viele Verben nehmen eine betonte Partikel, die die Bedeutung ändert: **tycka om** (mögen), **ringa upp** (anrufen), **ge upp** (aufgeben), **hålla med** (zustimmen), **tycka till** (seine Meinung sagen). Die Partikel steht nach dem Verb: **Jag tycker om dig** (ich mag dich).
  sv-passive:
    meaning: "das s-Passiv"
    intro: |
      Man fügt **-s** an: **bygga → byggs** (wird gebaut), **byggdes** (wurde gebaut), **har byggts**; der Urheber mit **av**: **Huset byggdes av min farfar** (das Haus wurde von meinem Großvater gebaut). Auch **bli** + Partizip: **Han blev sjuk** (er wurde krank). Schilder: **Huset säljs** (Haus zu verkaufen).
  sv-imperative:
    meaning: "der Imperativ"
    intro: |
      Der Stamm des Verbs: **läsa → läs!**, **komma → kom!**, **tala → tala!** Abgemildert mit **gärna, snälla**: **Kom gärna!** (komm gern!). **Var så god** (bitte schön). Verneint: **Gör inte så!** (mach das nicht!).
  sv-compounds:
    meaning: "Komposita"
    intro: |
      Schwedisch schreibt Komposita als ein Wort, der letzte Teil bestimmt Genus und Bedeutung — wie im Deutschen: **sjuk + hus → sjukhuset** (das Krankenhaus), **järn + väg → järnväg** (Eisenbahn), **kyl + skåp → kylskåp** (Kühlschrank). Ein Fugen-**s** verbindet oft: **arbetsplats** (Arbeitsplatz).
  sv-genitive:
    meaning: "der s-Genitiv"
    intro: |
      **-s** am Besitzer, ohne Apostroph, und das Besessene ohne Artikel: **Annas bok** (Annas Buch), **Sveriges huvudstad** (Schwedens Hauptstadt), **barnets leksaker** (die Spielsachen des Kindes). Mit **av** bei Sachen: **taket av huset** ist seltener als **husets tak**.
  sv-du-reform:
    meaning: "Anrede und das unpersönliche man"
    intro: |
      Seit der *Du-Reform* der 1960er Jahre sagt fast jeder **du**; Titel sind selten. Das unpersönliche **man** ist überall: **Man får inte röka här** (hier darf man nicht rauchen), **Hur säger man…?** (wie sagt man…?).
  sv-abstract:
    meaning: "abstrakte Nomen"
    intro: |
      **-het** (**frihet** Freiheit, **jämlikhet** Gleichheit, **säkerhet** Sicherheit), **-ning** von Verben (**utveckling** Entwicklung, **forskning** Forschung), **-skap** (**vänskap** Freundschaft, **kunskap** Wissen), **-else** (**upplevelse** Erlebnis). **-het** und **-skap** sind en-Wörter, Nomen auf **-ande** ett-Wörter.
  sv-literature:
    meaning: "die Klassiker lesen; ältere Schreibung"
    intro: |
      August Strindberg (*Röda rummet*, 1879) und Selma Lagerlöf (*Nils Holgerssons underbara resa*, 1906–07; Nobelpreis 1909) schrieben, bevor sich die Rechtschreibreform von 1906 durchsetzte: **hvad, hafva, qvinna** für *vad, ha, kvinna* und Pluralformen der Verben (**vi äro, de voro** für *vi är, de var*). Astrid Lindgrens moderne Prosa ist der leichteste Klassiker.
  sv-varieties:
    meaning: "Schwedisch in Finnland und die Dialekte"
    intro: |
      Schwedisch ist auch in Finnland Amtssprache (*Finnlandschwedisch* mit eigenen Wörtern: **kiva** nett, **semla** für ein Brötchen) und auf Åland. In Schweden klingt das *Schonische* im Süden fast dänisch, das *Gotländische* und die nördlichen Dialekte weichen stark ab; der Standard (**rikssvenska**) ist das, was der Leser kennt.
