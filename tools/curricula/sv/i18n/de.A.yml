# German text of the Swedish course, A1–A2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "Laute und Buchstaben"
  Nouns and the article: "Nomen und der Artikel"
  Pronouns and the present: "Pronomen und das Präsens"
  Questions and negation: "Fragen und Verneinung"
  Numbers and time: "Zahlen und Zeit"
  Past and future: "Vergangenheit und Zukunft"
  Adjectives and possessives: "Adjektive und Possessiva"
  Little words: "Kleine Wörter"
lessons:
  sv-alphabet:
    meaning: "die schwedischen Buchstaben und Laute"
    intro: |
      **å** ist ein langes *o* (**båt** Boot), **ä** ein offenes *ä* (**här** hier), **ö** wie das deutsche *ö* (**öga** Auge). **sj, skj, stj** und **sk** vor hellem Vokal sind ein gehauchtes *sch* (**sju** sieben, **skön**); **tj, kj** und **k** vor hellem Vokal ein weiches *tsch* (**tjugo, kör**). Ein Vokal ist lang vor einem Konsonanten, kurz vor zweien (**tak** Dach, **tack** danke).
  sv-en-ett:
    meaning: "zwei Genera: en und ett"
    intro: |
      Nomen sind *Utrum* (**en**: **en bok** ein Buch, **en flicka** ein Mädchen) oder *Neutrum* (**ett**: **ett hus** ein Haus, **ett barn** ein Kind). Etwa drei von vier sind **en**-Wörter; lernen Sie jedes Nomen mit seinem Artikel.
  sv-definite:
    meaning: "der bestimmte Artikel ist eine Endung"
    intro: |
      *Der, die, das* wird angehängt: **en bok → boken** (das Buch), **ett hus → huset** (das Haus); Plural **böckerna, husen**. Mit Adjektiv erscheint der Artikel zweimal: **den stora boken, det stora huset, de stora husen**.
  sv-plural:
    meaning: "fünf Pluralgruppen"
    intro: |
      **-or** (**flicka → flickor**), **-ar** (**bil → bilar**), **-er** (**stad → städer**), **-n** (**äpple → äpplen**) und ohne Endung (**barn → barn**, **hus → hus**). Manche ändern den Vokal: **bok → böcker**, **man → män**.
  sv-pronouns:
    meaning: "Personalpronomen"
    intro: |
      **jag** (ich), **du** (du), **han / hon** (er / sie), **den / det** (es, für en- und ett-Wörter), **vi** (wir), **ni** (ihr), **de** (sie, gesprochen *dom*). In Schweden duzt man fast jeden; **ni** zu einer Person ist selten und altmodisch.
  sv-present:
    meaning: "das Präsens: eine Form für alle Personen"
    intro: |
      Schwedische Verben ändern sich nicht nach der Person: **jag läser, du läser, hon läser, vi läser**. Das Präsens endet auf **-r**: **tala → talar**, **läsa → läser**, **bo → bor**. **vara** (sein) → **är**, **ha** (haben) → **har**.
  sv-v2:
    meaning: "das Verb steht an zweiter Stelle"
    intro: |
      Im Hauptsatz steht das Verb immer an zweiter Stelle — wie im Deutschen. Steht etwas anderes vorn (eine Zeit, ein Ort, ein Objekt), rückt das Subjekt hinter das Verb: **Jag läser idag → Idag läser jag** (heute lese ich). **I Sverige talar man svenska** (in Schweden spricht man Schwedisch).
  sv-questions:
    meaning: "Fragen: das Verb zuerst"
    intro: |
      **vad** (was), **vem** (wer), **var** (wo), **vart** (wohin), **när** (wann), **varför** (warum), **hur** (wie), **hur mycket / många** (wie viel / viele). Ja/Nein-Fragen beginnen mit dem Verb: **Talar du svenska? Bor du här?**
  sv-inte:
    meaning: "Verneinung: inte nach dem Verb"
    intro: |
      **inte** (nicht) steht im Hauptsatz direkt nach dem Verb: **Jag förstår inte** (ich verstehe nicht). **aldrig** (nie), **ingen / inget / inga** (kein, niemand), **ingenting** (nichts). Im Nebensatz steht **inte** vor dem Verb: **…att han inte kommer** (dass er nicht kommt).
  sv-numbers:
    meaning: "Zahlen"
    intro: |
      **en / ett, två, tre, fyra, fem, sex, sju, åtta, nio, tio, elva, tolv… tjugo, trettio, hundra, tusen**. **en** oder **ett** richtet sich nach dem Nomen: **en bok, ett hus**; ab zwei ändert sich nichts: **två böcker, tre hus**.
  sv-days:
    meaning: "Tage und Zeitwörter"
    intro: |
      **måndag, tisdag, onsdag, torsdag, fredag, lördag, söndag** (klein geschrieben). *Am Montag* = **på måndag**; *montags* = **på måndagar**. **idag** (heute), **imorgon** (morgen), **igår** (gestern), **nu** (jetzt), **på morgonen, på kvällen** (am Morgen, am Abend).
  sv-past:
    meaning: "das Präteritum"
    intro: |
      Schwache Verben fügen **-ade, -de, -te, -dde** an: **tala → talade**, **höra → hörde**, **läsa → läste**, **bo → bodde**. Starke Verben ändern den Vokal: **skriva → skrev**, **dricka → drack**, **gå → gick**, **vara → var**, **ha → hade**. Eine Form für alle Personen.
  sv-perfect:
    meaning: "das Perfekt: har + Supinum"
    intro: |
      **har** + das *Supinum*, eine eigene Form: **talat, läst, bott, skrivit, varit**: **Jag har läst boken** (ich habe das Buch gelesen), **Har du varit i Sverige?** (warst du schon in Schweden?). Das Plusquamperfekt mit **hade**: **Jag hade redan ätit** (ich hatte schon gegessen).
  sv-future:
    meaning: "das Futur"
    intro: |
      **ska** + Infinitiv für Pläne und Absichten: **Jag ska resa till Malmö** (ich werde nach Malmö reisen); **kommer att** + Infinitiv für das, was geschehen wird: **Det kommer att regna** (es wird regnen). Oft genügt das Präsens: **Jag åker imorgon** (ich fahre morgen).
  sv-adj:
    meaning: "Adjektive kongruieren"
    intro: |
      **-** bei en-Wörtern, **-t** bei ett-Wörtern, **-a** im Plural und nach dem Artikel: **en stor bil, ett stort hus, stora bilar, den stora bilen.** Steigerung **-are, -ast** (**varm → varmare → varmast**), unregelmäßig **bra → bättre → bäst**, **stor → större → störst**.
  sv-possessive:
    meaning: "Possessiva; sin"
    intro: |
      **min / mitt / mina** (mein), **din, hans, hennes, vår, er, deras**: **min bok, mitt hus, mina barn.** **sin / sitt / sina** bezieht sich auf das Subjekt zurück: **Han läser sin bok** (sein eigenes) gegenüber **Han läser hans bok** (das eines anderen).
  sv-prepositions:
    meaning: "Präpositionen"
    intro: |
      **i** (in), **på** (auf, an), **till** (zu, nach), **från** (von, aus), **med** (mit), **om** (über), **för** (für), **av** (von), **hos** (bei), **under, över, efter, utan**. Schwedisch sagt **på jobbet** (bei der Arbeit), **i Sverige**, **på svenska** (auf Schwedisch).
  sv-modals:
    meaning: "Modalverben + Infinitiv"
    intro: |
      **kan** (kann), **vill** (will), **måste** (muss), **får** (darf), **ska** (soll), **bör** (sollte) + Infinitiv ohne **att**: **Jag kan simma** (ich kann schwimmen). **Får jag komma in?** (darf ich hereinkommen?). Andere Verben nehmen **att**: **Jag tycker om att läsa** (ich lese gern).
