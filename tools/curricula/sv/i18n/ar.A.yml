# Arabic text of the Swedish course, A1–A2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and letters: "الأصوات والحروف"
  Nouns and the article: "الأسماء وأداة التعريف"
  Pronouns and the present: "الضمائر والمضارع"
  Questions and negation: "الأسئلة والنفي"
  Numbers and time: "الأعداد والزمن"
  Past and future: "الماضي والمستقبل"
  Adjectives and possessives: "الصفات والملكية"
  Little words: "كلمات صغيرة"
lessons:
  sv-alphabet:
    meaning: "الحروف والأصوات السويدية"
    intro: |
      **å** ضمّة ممالة طويلة كـ*o* (**båt** قارب)، و**ä** فتحة ممالة مفتوحة (**här** هنا)، و**ö** كالألمانية *ö* (**öga** عين). **sj, skj, stj** و**sk** قبل حرف علّة ليّن تُنطق شينًا مهموسة (**sju** سبعة، **skön**)؛ و**tj, kj** و**k** قبل حرف علّة ليّن *تش* ليّنة (**tjugo, kör**). والحركة طويلة قبل ساكن واحد وقصيرة قبل ساكنين (**tak** سقف، **tack** شكرًا).
  sv-en-ett:
    meaning: "جنسان: en و ett"
    intro: |
      الأسماء إمّا *مشتركة* (**en**: **en bok** كتاب، **en flicka** بنت) أو *محايدة* (**ett**: **ett hus** بيت، **ett barn** طفل). نحو ثلاثة من كل أربعة أسماء مع **en**؛ احفظ كل اسم مع أداته.
  sv-definite:
    meaning: "أداة التعريف لاحقة"
    intro: |
      تُلحق *أل* بالآخر: **en bok → boken** (الكتاب)، **ett hus → huset** (البيت)؛ والجمع **böckerna, husen**. ومع الصفة تظهر الأداة مرتين: **den stora boken, det stora huset, de stora husen**.
  sv-plural:
    meaning: "خمس مجموعات للجمع"
    intro: |
      **-or** (**flicka → flickor**)، **-ar** (**bil → bilar**)، **-er** (**stad → städer**)، **-n** (**äpple → äpplen**)، وبلا لاحقة (**barn → barn**، **hus → hus**). وبعضها يغيّر الحركة: **bok → böcker**، **man → män**.
  sv-pronouns:
    meaning: "الضمائر الشخصية"
    intro: |
      **jag** (أنا)، **du** (أنت)، **han / hon** (هو / هي)، **den / det** (لغير العاقل، لكلمات en وett)، **vi** (نحن)، **ni** (أنتم)، **de** (هم، وتُنطق *dom*). في السويد يُخاطَب الجميع تقريبًا بـ**du**؛ و**ni** لشخص واحد نادرة وقديمة.
  sv-present:
    meaning: "المضارع: صيغة واحدة لكل الأشخاص"
    intro: |
      لا يتغيّر الفعل السويدي بتغيّر الشخص: **jag läser, du läser, hon läser, vi läser**. وينتهي المضارع بـ**-r**: **tala → talar**، **läsa → läser**، **bo → bor**. **vara** (الكون) → **är**، **ha** (الملكية) → **har**.
  sv-v2:
    meaning: "الفعل في المرتبة الثانية"
    intro: |
      في الجملة الرئيسية يأتي الفعل دائمًا ثانيًا. فإن تقدّم شيء آخر (زمان أو مكان أو مفعول) انتقل الفاعل إلى ما بعد الفعل: **Jag läser idag → Idag läser jag** (اليوم أقرأ). **I Sverige talar man svenska** (في السويد يتكلّمون السويدية).
  sv-questions:
    meaning: "الأسئلة: الفعل أولًا"
    intro: |
      **vad** (ماذا)، **vem** (من)، **var** (أين)، **vart** (إلى أين)، **när** (متى)، **varför** (لماذا)، **hur** (كيف)، **hur mycket / många** (كم). أسئلة نعم/لا تبدأ بالفعل: **Talar du svenska? Bor du här?**
  sv-inte:
    meaning: "النفي: inte بعد الفعل"
    intro: |
      **inte** (لا) تأتي بعد الفعل مباشرة في الجملة الرئيسية: **Jag förstår inte** (لا أفهم). **aldrig** (أبدًا)، **ingen / inget / inga** (لا أحد، لا … أيّ)، **ingenting** (لا شيء). وفي الجملة التابعة تأتي **inte** قبل الفعل: **…att han inte kommer** (أنه لن يأتي).
  sv-numbers:
    meaning: "الأعداد"
    intro: |
      **en / ett, två, tre, fyra, fem, sex, sju, åtta, nio, tio, elva, tolv… tjugo, trettio, hundra, tusen**. **en** أو **ett** تطابق الاسم: **en bok, ett hus**؛ ومن الاثنين فما فوق لا تغيير: **två böcker, tre hus**.
  sv-days:
    meaning: "الأيام وكلمات الزمن"
    intro: |
      **måndag, tisdag, onsdag, torsdag, fredag, lördag, söndag** (بحرف صغير). *يوم الاثنين* = **på måndag**؛ *أيام الاثنين* = **på måndagar**. **idag** (اليوم)، **imorgon** (غدًا)، **igår** (أمس)، **nu** (الآن)، **på morgonen, på kvällen** (صباحًا، مساءً).
  sv-past:
    meaning: "الماضي"
    intro: |
      الأفعال الضعيفة تضيف **-ade, -de, -te, -dde**: **tala → talade**، **höra → hörde**، **läsa → läste**، **bo → bodde**. والقوية تغيّر الحركة: **skriva → skrev**، **dricka → drack**، **gå → gick**، **vara → var**، **ha → hade**. صيغة واحدة لكل الأشخاص.
  sv-perfect:
    meaning: "التام: har + السوبين"
    intro: |
      **har** + *السوبين*، صيغة خاصة: **talat, läst, bott, skrivit, varit**: **Jag har läst boken** (قرأت الكتاب)، **Har du varit i Sverige?** (هل زرت السويد؟). والماضي التام بـ**hade**: **Jag hade redan ätit** (كنت قد أكلت).
  sv-future:
    meaning: "المستقبل"
    intro: |
      **ska** + المصدر للخطط والنيّات: **Jag ska resa till Malmö** (سأسافر إلى مالمو)؛ و**kommer att** + المصدر لما سيحدث: **Det kommer att regna** (ستمطر). وكثيرًا ما يكفي المضارع: **Jag åker imorgon** (أسافر غدًا).
  sv-adj:
    meaning: "الصفات تطابق"
    intro: |
      **-** لكلمات en، و**-t** لكلمات ett، و**-a** في الجمع وبعد أداة التعريف: **en stor bil, ett stort hus, stora bilar, den stora bilen.** والتفضيل **-are, -ast** (**varm → varmare → varmast**)، والشاذ **bra → bättre → bäst**، **stor → större → störst**.
  sv-possessive:
    meaning: "الملكية؛ sin"
    intro: |
      **min / mitt / mina** (لي)، **din, hans, hennes, vår, er, deras**: **min bok, mitt hus, mina barn.** و**sin / sitt / sina** تعود على الفاعل: **Han läser sin bok** (كتابه هو) مقابل **Han läser hans bok** (كتاب شخص آخر).
  sv-prepositions:
    meaning: "حروف الجر"
    intro: |
      **i** (في)، **på** (على، في)، **till** (إلى)، **från** (من)، **med** (مع)، **om** (عن)، **för** (لأجل)، **av** (من، بواسطة)، **hos** (عند)، **under, över, efter, utan**. تقول السويدية **på jobbet** (في العمل)، **i Sverige**، **på svenska** (بالسويدية).
  sv-modals:
    meaning: "الأفعال المساعدة + المصدر"
    intro: |
      **kan** (يستطيع)، **vill** (يريد)، **måste** (يجب)، **får** (يُسمح له)، **ska** (سوف، ينبغي)، **bör** (ينبغي) + المصدر بلا **att**: **Jag kan simma** (أستطيع السباحة). **Får jag komma in?** (هل لي أن أدخل؟). وغيرها يأخذ **att**: **Jag tycker om att läsa** (أحبّ القراءة).
