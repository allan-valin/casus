# Macedonian text of the Swedish course, B1–C2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Clauses: "Реченици"
  Verb forms: "Глаголски форми"
  Words: "Зборови"
  Register: "Регистар"
  Talking about ideas: "Разговор за идеи"
  Literature and variety: "Литература и разновидност"
lessons:
  sv-subclause:
    meaning: "зависни реченици: inte пред глаголот"
    intro: |
      **att** (дека), **som** (што, кој), **när** (кога), **om** (ако, дали), **eftersom** (бидејќи), **fast / trots att** (иако), **innan** (пред да). Во зависната реченица подметот е прв, а **inte, aldrig** стојат *пред* глаголот: **Jag vet att han inte kommer** (знам дека нема да дојде). **Boken som jag läser är bra** (книгата што ја читам е добра).
  sv-particle-verbs:
    meaning: "глаголи со честичка"
    intro: |
      Многу глаголи земаат нагласена честичка што го менува значењето: **tycka om** (сака), **ringa upp** (се јави), **ge upp** (се откаже), **hålla med** (се согласи), **tycka till** (каже мислење). Честичката стои по глаголот: **Jag tycker om dig** (те сакам).
  sv-passive:
    meaning: "s-пасив"
    intro: |
      Се додава **-s**: **bygga → byggs** (се гради), **byggdes** (беше изградено), **har byggts**; вршителот со **av**: **Huset byggdes av min farfar** (куќата ја изгради дедо ми). Исто така **bli** + партицип: **Han blev sjuk** (се разболе). Огласи: **Huset säljs** (се продава куќа).
  sv-imperative:
    meaning: "императив"
    intro: |
      Основата на глаголот: **läsa → läs!**, **komma → kom!**, **tala → tala!** Омекнато со **gärna, snälla**: **Kom gärna!** (повелете, дојдете). **Var så god** (повелете). Одречно: **Gör inte så!** (не прави така).
  sv-compounds:
    meaning: "сложенки"
    intro: |
      Шведскиот ги пишува сложенките како еден збор; последниот дел ги одредува родот и значењето: **sjuk + hus → sjukhuset** (болницата), **järn + väg → järnväg** (железница), **kyl + skåp → kylskåp** (фрижидер). Сврзувачко **-s-** често ги спојува: **arbetsplats** (работно место).
  sv-genitive:
    meaning: "генитив со -s"
    intro: |
      **-s** на сопственикот, без апостроф, а поседуваното без член: **Annas bok** (книгата на Ана), **Sveriges huvudstad** (главниот град на Шведска), **barnets leksaker** (играчките на детето). Со **av** за предмети: **taket av huset** е поретко од **husets tak**.
  sv-du-reform:
    meaning: "обраќање и безличното man"
    intro: |
      Од *du-реформата* во 1960-тите речиси секој вели **du**; титулите се ретки. Безличното **man** е насекаде: **Man får inte röka här** (тука не се пуши), **Hur säger man…?** (како се вели…?).
  sv-abstract:
    meaning: "апстрактни именки"
    intro: |
      **-het** (**frihet** слобода, **jämlikhet** еднаквост, **säkerhet** безбедност), **-ning** од глаголи (**utveckling** развој, **forskning** истражување), **-skap** (**vänskap** пријателство, **kunskap** знаење), **-else** (**upplevelse** доживување). **-het** и **-skap** се зборови со en, именките на **-ande** со ett.
  sv-literature:
    meaning: "читање на класиците; постар правопис"
    intro: |
      Аугуст Стриндберг (*Röda rummet*, 1879) и Селма Лагерлеф (*Nils Holgerssons underbara resa*, 1906–07; Нобелова награда 1909) пишувале пред да се наложи правописната реформа од 1906: **hvad, hafva, qvinna** наместо *vad, ha, kvinna*, и глаголи во множина (**vi äro, de voro** наместо *vi är, de var*). Модерната проза на Астрид Линдгрен е најлесниот класик.
  sv-varieties:
    meaning: "шведскиот во Финска и дијалектите"
    intro: |
      Шведскиот е службен и во Финска (*финско-шведски*, со свои зборови: **kiva** убаво, **semla** за земичка) и на Оланд. Во Шведска *сконскиот* на југ звучи блиску до данскиот, *готландскиот* и северните дијалекти силно се разликуваат; стандардот (**rikssvenska**) е она што го знае читачот.
