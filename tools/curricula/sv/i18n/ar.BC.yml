# Arabic text of the Swedish course, B1–C2 — translated by AI (Claude) from the English (2026-10-21)
topics:
  Clauses: "الجمل"
  Verb forms: "صيغ الفعل"
  Words: "الكلمات"
  Register: "مستوى اللغة"
  Talking about ideas: "الحديث عن الأفكار"
  Literature and variety: "الأدب والتنوّع"
lessons:
  sv-subclause:
    meaning: "الجمل التابعة: inte قبل الفعل"
    intro: |
      **att** (أنّ)، **som** (الذي)، **när** (عندما)، **om** (إذا، هل)، **eftersom** (لأنّ)، **fast / trots att** (مع أنّ)، **innan** (قبل أن). في الجملة التابعة يتقدّم الفاعل وتأتي **inte, aldrig** *قبل* الفعل: **Jag vet att han inte kommer** (أعرف أنه لن يأتي). **Boken som jag läser är bra** (الكتاب الذي أقرؤه جيّد).
  sv-particle-verbs:
    meaning: "الأفعال ذات الأداة"
    intro: |
      كثير من الأفعال يأخذ أداة منبورة تغيّر معناه: **tycka om** (يحبّ)، **ringa upp** (يتّصل بـ)، **ge upp** (يستسلم)، **hålla med** (يوافق)، **tycka till** (يبدي رأيه). والأداة بعد الفعل: **Jag tycker om dig** (أحبّك).
  sv-passive:
    meaning: "المجهول بالسين"
    intro: |
      تُضاف **-s**: **bygga → byggs** (يُبنى)، **byggdes** (بُني)، **har byggts**؛ والفاعل الحقيقي بـ**av**: **Huset byggdes av min farfar** (بنى جدّي البيت). وأيضًا **bli** + اسم المفعول: **Han blev sjuk** (مرض). وفي الإعلانات: **Huset säljs** (البيت للبيع).
  sv-imperative:
    meaning: "الأمر"
    intro: |
      جذر الفعل: **läsa → läs!**، **komma → kom!**، **tala → tala!** ويُلطَّف بـ**gärna, snälla**: **Kom gärna!** (تفضّل بالمجيء). **Var så god** (تفضّل). والنهي: **Gör inte så!** (لا تفعل هكذا).
  sv-compounds:
    meaning: "الكلمات المركّبة"
    intro: |
      تكتب السويدية المركّبات كلمة واحدة، والجزء الأخير يحدّد الجنس والمعنى: **sjuk + hus → sjukhuset** (المستشفى، «بيت المرضى»)، **järn + väg → järnväg** (سكة حديد، «طريق الحديد»)، **kyl + skåp → kylskåp** (ثلاجة). وكثيرًا ما تربطها **-s-**: **arbetsplats** (مكان العمل).
  sv-genitive:
    meaning: "الإضافة بالسين"
    intro: |
      **-s** على المالك، بلا فاصلة علوية، والمملوك بلا أداة تعريف: **Annas bok** (كتاب آنا)، **Sveriges huvudstad** (عاصمة السويد)، **barnets leksaker** (ألعاب الطفل). و**av** للأشياء: **taket av huset** أندر من **husets tak**.
  sv-du-reform:
    meaning: "المخاطبة والضمير غير الشخصي man"
    intro: |
      منذ *إصلاح du* في الستينيات يقول الجميع تقريبًا **du**؛ والألقاب نادرة. والضمير غير الشخصي **man** في كل مكان: **Man får inte röka här** (ممنوع التدخين هنا)، **Hur säger man…?** (كيف يقال…؟).
  sv-abstract:
    meaning: "الأسماء المجرّدة"
    intro: |
      **-het** (**frihet** حرّية، **jämlikhet** مساواة، **säkerhet** أمان)، **-ning** من الأفعال (**utveckling** تطوّر، **forskning** بحث علمي)، **-skap** (**vänskap** صداقة، **kunskap** معرفة)، **-else** (**upplevelse** تجربة). و**-het** و**-skap** كلمات en، والأسماء بـ**-ande** كلمات ett.
  sv-literature:
    meaning: "قراءة الكلاسيكيات؛ الإملاء القديم"
    intro: |
      كتب أوغست ستريندبرغ (*Röda rummet*، 1879) وسلمى لاغرلوف (*Nils Holgerssons underbara resa*، 1906–07؛ نوبل 1909) قبل أن يستقرّ إصلاح الإملاء لعام 1906: **hvad, hafva, qvinna** بدل *vad, ha, kvinna*، وأفعال الجمع (**vi äro, de voro** بدل *vi är, de var*). ونثر أستريد ليندغرين الحديث أسهل الكلاسيكيات.
  sv-varieties:
    meaning: "السويدية في فنلندا واللهجات"
    intro: |
      السويدية رسمية في فنلندا أيضًا (*السويدية الفنلندية*، ولها كلماتها: **kiva** لطيف، **semla** للخبز الصغير) وفي جزر أولاند. وفي السويد تقترب *السكونية* في الجنوب من الدنماركية، وتختلف *الغوتلاندية* ولهجات الشمال اختلافًا كبيرًا؛ والمعيار (**rikssvenska**) هو ما يعرفه القارئ.
