id: Intermediate
title: {en: Intermediate, pt: Intermediário}
topics:

- title: {en: The past and the future, pt: O passado e o futuro}
  lessons:
  - id: grc-imperfect
    title: ἔλυον
    meaning: {en: "the imperfect and the augment", pt: "o imperfeito e o aumento"}
    intro:
      en: |
        Past tenses of the indicative take an **augment**: **ἐ-** before a consonant (**λύω → ἔλυον** "I was loosing"), or a **lengthened** first vowel (**ἄγω → ἦγον**, **ἐλπίζω → ἤλπιζον**, **οἰκέω → ᾤκουν**). In compound verbs the augment goes after the prefix: **προσβάλλω → προσέβαλλον**.

        The imperfect, like the Latin and Portuguese imperfect, presents an action as ongoing, repeated or attempted in the past.
      pt: |
        Os tempos passados do indicativo levam **aumento**: **ἐ-** antes de consoante (**λύω → ἔλυον** "eu soltava"), ou a primeira vogal **alongada** (**ἄγω → ἦγον**, **ἐλπίζω → ἤλπιζον**, **οἰκέω → ᾤκουν**). Nos verbos compostos o aumento fica depois do prefixo: **προσβάλλω → προσέβαλλον**.

        O imperfeito, como o nosso, apresenta a ação como em curso, repetida ou tentada no passado.
    paradigms:
    - {word: λύω, pos: verb, tense: impf, mood: ind, voice: act, label: {en: "λύω — imperfect active", pt: "λύω — imperfeito ativo"}}
    match: {seq: [{pos: verb, tense: impf, mood: ind}], same: [person, number, voice]}

  - id: grc-future
    title: λύσω
    meaning: {en: "the future", pt: "o futuro"}
    intro:
      en: |
        The future adds **-σ-** to the stem and takes the present endings: **λύσω** "I shall loose". The σ combines with a final consonant: **γράφω → γράψω**, **ἄγω → ἄξω**, **πείθω → πείσω**. Verbs in liquids (λ μ ν ρ) have a **contract future** without σ: **μένω → μενῶ**. Many common verbs have a **middle** future with active meaning: **εἰμί → ἔσομαι**, **ἀκούω → ἀκούσομαι**.
      pt: |
        O futuro acrescenta **-σ-** ao radical e usa as terminações do presente: **λύσω** "soltarei". O σ se combina com a consoante final: **γράφω → γράψω**, **ἄγω → ἄξω**, **πείθω → πείσω**. Verbos em líquida (λ μ ν ρ) têm **futuro contrato** sem σ: **μένω → μενῶ**. Muitos verbos comuns têm futuro **médio** com sentido ativo: **εἰμί → ἔσομαι**, **ἀκούω → ἀκούσομαι**.
    paradigms:
    - {word: λύω, pos: verb, tense: fut, mood: ind, voice: act, label: {en: "λύω — future active", pt: "λύω — futuro ativo"}}
    match: {seq: [{pos: verb, tense: fut, mood: ind}], same: [person, number, voice]}

  - id: grc-aorist
    title: ἔλυσα
    meaning: {en: "the first (sigmatic) aorist", pt: "o primeiro aoristo (sigmático)"}
    intro:
      en: |
        The **aorist** states a past action simply, as a single event — the usual narrative past, like Portuguese *soltei* against the imperfect *soltava*. The first aorist has the augment, **-σα-** and its own endings: **ἔλυσα, ἔλυσας, ἔλυσε(ν), ἐλύσαμεν, ἐλύσατε, ἔλυσαν**.

        Outside the indicative (subjunctive, optative, imperative, infinitive, participle) the aorist has **no augment** and expresses **aspect**, not time: **λῦσαι** "to loose (once)" against **λύειν** "to be loosing".
      pt: |
        O **aoristo** diz uma ação passada simplesmente, como um evento único — o passado narrativo comum, como o nosso *soltei* diante do imperfeito *soltava*. O primeiro aoristo tem aumento, **-σα-** e terminações próprias: **ἔλυσα, ἔλυσας, ἔλυσε(ν), ἐλύσαμεν, ἐλύσατε, ἔλυσαν**.

        Fora do indicativo (subjuntivo, optativo, imperativo, infinitivo, particípio) o aoristo **não tem aumento** e exprime **aspecto**, não tempo: **λῦσαι** "soltar (uma vez)" diante de **λύειν** "estar soltando".
    paradigms:
    - {word: λύω, pos: verb, tense: aor, mood: ind, voice: act, label: {en: "λύω — aorist active", pt: "λύω — aoristo ativo"}}
    match: {seq: [{pos: verb, tense: aor, mood: ind, voice: act}], same: [person, number, voice]}

  - id: grc-aorist-2
    title: ἔλιπον, εἶπον, ἦλθον
    meaning: {en: "the second aorist", pt: "o segundo aoristo"}
    intro:
      en: |
        Many of the commonest verbs form the aorist from a **different stem** with the endings of the imperfect: **λείπω → ἔλιπον**, **λαμβάνω → ἔλαβον**, **βάλλω → ἔβαλον**, **ἄγω → ἤγαγον**, **ἔχω → ἔσχον**, **μανθάνω → ἔμαθον**, **φεύγω → ἔφυγον**, **πάσχω → ἔπαθον**; some from another root altogether: **λέγω → εἶπον**, **ὁράω → εἶδον**, **ἔρχομαι → ἦλθον**, **φέρω → ἤνεγκον**. Learn them with the verb (its *principal parts*).
      pt: |
        Muitos dos verbos mais comuns formam o aoristo de um **radical diferente** com as terminações do imperfeito: **λείπω → ἔλιπον**, **λαμβάνω → ἔλαβον**, **βάλλω → ἔβαλον**, **ἄγω → ἤγαγον**, **ἔχω → ἔσχον**, **μανθάνω → ἔμαθον**, **φεύγω → ἔφυγον**, **πάσχω → ἔπαθον**; alguns de outra raiz: **λέγω → εἶπον**, **ὁράω → εἶδον**, **ἔρχομαι → ἦλθον**, **φέρω → ἤνεγκον**. Aprenda-os com o verbo (suas *partes principais*).
    match: {seq: [{pos: verb, tense: aor, mood: ind, lemma: "^(λείπω|λαμβάνω|βάλλω|ἄγω|ἔχω|μανθάνω|φεύγω|πάσχω|λέγω|ὁράω|ἔρχομαι|φέρω|πίπτω|εὑρίσκω|γίγνομαι|ἀποθνῄσκω|τυγχάνω|ἀφικνέομαι|αἱρέω)$"}], same: [person, number]}

- title: {en: Middle and passive, pt: Médio e passivo}
  lessons:
  - id: grc-middle
    title: λύομαι
    meaning: {en: "the middle and passive (present system)", pt: "o médio e o passivo (sistema do presente)"}
    intro:
      en: |
        Besides active and passive, Greek has a **middle** voice: the subject acts **for itself** or on itself — **λύομαι** "I ransom (loose for myself)", **παύομαι** "I stop (myself)". In the present and imperfect, middle and passive have the **same forms**: **λύομαι** is also "I am being loosed". Some verbs exist only in middle form with active meaning (*deponents*): **βούλομαι** "I want", **γίγνομαι** "I become", **ἔρχομαι** "I go".
      pt: |
        Além de ativa e passiva, o grego tem a voz **média**: o sujeito age **para si** ou sobre si — **λύομαι** "resgato (solto para mim)", **παύομαι** "paro (a mim mesmo)". No presente e no imperfeito, médio e passivo têm as **mesmas formas**: **λύομαι** também é "sou solto". Alguns verbos só existem na forma média com sentido ativo (*depoentes*): **βούλομαι** "quero", **γίγνομαι** "torno-me", **ἔρχομαι** "vou".
    paradigms:
    - {word: λύω, pos: verb, tense: pres, mood: ind, voice: mp, label: {en: "λύω — present middle/passive", pt: "λύω — presente médio/passivo"}}
    match: {seq: [{pos: verb, tense: [pres, impf], mood: ind, voice: [mid, mp, pass]}], same: [person, number]}

  - id: grc-aorist-passive
    title: ἐλύθην
    meaning: {en: "the aorist passive", pt: "o aoristo passivo"}
    intro:
      en: |
        The aorist passive has its own stem in **-θη-** with active-looking endings: **ἐλύθην** "I was loosed", **ἐλύθης, ἐλύθη, ἐλύθημεν…**. Some verbs have **-η-** without θ (*second aorist passive*): **γράφω → ἐγράφην**. The aorist **middle** is separate: **ἐλυσάμην** "I ransomed".
      pt: |
        O aoristo passivo tem radical próprio em **-θη-** com terminações de aparência ativa: **ἐλύθην** "fui solto", **ἐλύθης, ἐλύθη, ἐλύθημεν…**. Alguns verbos têm **-η-** sem θ (*segundo aoristo passivo*): **γράφω → ἐγράφην**. O aoristo **médio** é outro: **ἐλυσάμην** "resgatei".
    paradigms:
    # Wiktionary's shortest 3rd plural is Homer's ἔλυθεν; Attic ἐλύθησαν
    - {word: λύω, pos: verb, tense: aor, mood: ind, voice: pass, override: {"3 pl": ἐλύθησαν}, label: {en: "λύω — aorist passive", pt: "λύω — aoristo passivo"}}
    match: {seq: [{pos: verb, tense: aor, voice: pass}], same: [person, number, mood]}

- title: {en: Pronouns, pt: Pronomes}
  lessons:
  - id: grc-personal
    title: ἐγώ, σύ, αὐτός
    meaning: {en: "personal pronouns and αὐτός", pt: "pronomes pessoais e αὐτός"}
    intro:
      en: |
        **ἐγώ** "I" and **σύ** "you" (plural **ἡμεῖς, ὑμεῖς**) are used as subjects only for emphasis; their oblique forms have unemphatic enclitic variants: **μου, μοι, με**. For *him, her, it, them* Greek uses the oblique cases of **αὐτός**, which has three uses:

        - oblique cases alone: *him, her, it* — **ὁρῶ αὐτόν** "I see him"
        - in predicate position: *-self* — **αὐτὸς ὁ βασιλεύς** "the king himself"
        - in attributive position: *the same* — **ὁ αὐτὸς βασιλεύς** "the same king"
      pt: |
        **ἐγώ** "eu" e **σύ** "tu" (plural **ἡμεῖς, ὑμεῖς**) só se usam como sujeito para dar ênfase; as formas oblíquas têm variantes enclíticas átonas: **μου, μοι, με**. Para *o, a, lhe, eles* o grego usa os casos oblíquos de **αὐτός**, que tem três usos:

        - casos oblíquos sozinhos: *o, a, lhe* — **ὁρῶ αὐτόν** "eu o vejo"
        - em posição predicativa: *mesmo, próprio* — **αὐτὸς ὁ βασιλεύς** "o próprio rei"
        - em posição atributiva: *o mesmo* — **ὁ αὐτὸς βασιλεύς** "o mesmo rei"
    paradigms:
    - {word: αὐτός, pos: pron, number: sg, label: {en: "αὐτός — singular", pt: "αὐτός — singular"}}
    match: {seq: [{pos: pron, lemma: "^(ἐγώ|σύ|ἡμεῖς|ὑμεῖς|αὐτός)$"}], same: [number]}

  - id: grc-demonstratives
    title: οὗτος, ὅδε, ἐκεῖνος
    meaning: {en: "demonstratives: this, that", pt: "demonstrativos: este, aquele"}
    intro:
      en: |
        **οὗτος** "this (just mentioned)", **ὅδε** "this (here / following)", **ἐκεῖνος** "that (there)". With a noun they stand in **predicate position**, outside the article: **οὗτος ὁ ἀνήρ** or **ὁ ἀνὴρ οὗτος** "this man". **οὗτος** changes its first vowel with the ending: **τοῦτο, ταῦτα, τούτου, ταύτης**.
      pt: |
        **οὗτος** "este (de que se falou)", **ὅδε** "este (aqui / que segue)", **ἐκεῖνος** "aquele (lá)". Com substantivo ficam em **posição predicativa**, fora do artigo: **οὗτος ὁ ἀνήρ** ou **ὁ ἀνὴρ οὗτος** "este homem". **οὗτος** muda a primeira vogal conforme a terminação: **τοῦτο, ταῦτα, τούτου, ταύτης**.
    paradigms:
    - {word: οὗτος, pos: det, number: sg, label: {en: "οὗτος — singular", pt: "οὗτος — singular"}}
    - {word: οὗτος, pos: det, number: pl, label: {en: "οὗτος — plural", pt: "οὗτος — plural"}}
    match: {seq: [{lemma: "^(οὗτος|ὅδε|ἐκεῖνος)$"}], same: [number]}

  - id: grc-relative
    title: ὅς, ἥ, ὅ
    meaning: {en: "the relative pronoun", pt: "o pronome relativo"}
    intro:
      en: |
        **ὅς, ἥ, ὅ** "who, which" agrees with its antecedent in gender and number; its case comes from its own clause: **ὁ ἀνὴρ ὃν εἶδες** "the man whom you saw". Its forms look like the article with a rough breathing and an accent: **οὗ, ᾧ, ὅν; ἧς, ᾗ, ἥν**.
      pt: |
        **ὅς, ἥ, ὅ** "que, o qual" concorda com o antecedente em gênero e número; o caso vem da sua própria oração: **ὁ ἀνὴρ ὃν εἶδες** "o homem que viste". As formas lembram o artigo com espírito áspero e acento: **οὗ, ᾧ, ὅν; ἧς, ᾗ, ἥν**.
    paradigms:
    - {word: ὅς, pos: pron, number: sg, label: {en: "ὅς — singular", pt: "ὅς — singular"}}
    # the forms as a list: most are also forms of the article or of other words, so the analysis is rarely one reading
    match: {seq: [{word: [ὅς, ἥ, ὅ, οὗ, ἧς, ᾧ, ᾗ, ὅν, ἥν, οἵ, αἵ, ἅ, ὧν, οἷς, αἷς, οὕς, ἅς, ὅστις, ἥτις, ὅ τι, οἵτινες]}], gap: 0}
    pool: [ὅς, ἥ, ὅ, οὗ, ἧς, ᾧ, ᾗ, ὅν, ἥν, οἵ, αἵ, ἅ, ὧν, οἷς, οὕς]

- title: {en: The third declension, pt: A terceira declinação}
  lessons:
  - id: grc-third-consonant
    title: φύλαξ, σῶμα
    meaning: {en: "third declension: consonant stems", pt: "terceira declinação: temas em consoante"}
    intro:
      en: |
        The third declension adds its endings to a **stem** that the nominative often hides — find it in the **genitive**: **φύλαξ, φύλακ-ος** "guard", **ἐλπίς, ἐλπίδ-ος** "hope", **σῶμα, σώματ-ος** "body". Endings: **-ος, -ι, -α / -ν** in the singular; **-ες, -ων, -σι(ν), -ας** in the plural; neuters **-α** in the nominative/accusative plural. The dative plural **-σι** combines with the stem: **φύλαξι**, **σώμασι**.
      pt: |
        A terceira declinação acrescenta as terminações a um **tema** que o nominativo muitas vezes esconde — ache-o no **genitivo**: **φύλαξ, φύλακ-ος** "guarda", **ἐλπίς, ἐλπίδ-ος** "esperança", **σῶμα, σώματ-ος** "corpo". Terminações: **-ος, -ι, -α / -ν** no singular; **-ες, -ων, -σι(ν), -ας** no plural; neutros **-α** no nominativo/acusativo plural. O dativo plural **-σι** se combina com o tema: **φύλαξι**, **σώμασι**.
    paradigms:
    - {word: ἐλπίς, pos: noun, label: {en: "ἐλπίς (f.) hope", pt: "ἐλπίς (f.) esperança"}}
    - {word: σῶμα, pos: noun, label: {en: "σῶμα (n.) body", pt: "σῶμα (n.) corpo"}}
    match: {seq: [{pos: noun, dict: ", \\S+ος( [mfn]\\.)?$"}], same: [number]}

  - id: grc-third-s
    title: γένος, Σωκράτης
    meaning: {en: "third declension: s-stems and contraction", pt: "terceira declinação: temas em -s e contração"}
    intro:
      en: |
        Stems in **-εσ-** lost their σ between vowels, and the vowels **contracted**: **γένος** "race, kind", stem γενεσ-, genitive \*γένεσος → γένεος → **γένους**, plural **γένη**. Names in **-ης** go the same way: **Σωκράτης, Σωκράτους**. The uncontracted forms are Ionic (Herodotus, Homer).
      pt: |
        Temas em **-εσ-** perderam o σ entre vogais, e as vogais se **contraíram**: **γένος** "raça, gênero", tema γενεσ-, genitivo \*γένεσος → γένεος → **γένους**, plural **γένη**. Os nomes em **-ης** seguem igual: **Σωκράτης, Σωκράτους**. As formas não contraídas são jônicas (Heródoto, Homero).
    paradigms:
    - {word: γένος, pos: noun, label: {en: "γένος (n.) race, kind", pt: "γένος (n.) raça, gênero"}}
    match: {seq: [{pos: noun, lemma: "ος$", dict: "(ους|εος) n\\.$"}], same: [number]}

  - id: grc-third-adjectives
    title: πᾶς, ἀληθής
    meaning: {en: "adjectives of the third declension", pt: "adjetivos da terceira declinação"}
    intro:
      en: |
        **πᾶς, πᾶσα, πᾶν** "all, every" (feminine in the first declension), **ἀληθής, ἀληθές** "true" (two endings, s-stem), **εὐδαίμων, εὔδαιμον** "fortunate" (n-stem), **ταχύς, ταχεῖα, ταχύ** "quick". With the article, **πᾶς** in predicate position means *all* (**πάντες οἱ ἄνθρωποι**), in attributive position *the whole* (**ἡ πᾶσα πόλις**).
      pt: |
        **πᾶς, πᾶσα, πᾶν** "todo, cada" (feminino na primeira declinação), **ἀληθής, ἀληθές** "verdadeiro" (duas terminações, tema em -s), **εὐδαίμων, εὔδαιμον** "feliz" (tema em -n), **ταχύς, ταχεῖα, ταχύ** "rápido". Com artigo, **πᾶς** em posição predicativa significa *todos* (**πάντες οἱ ἄνθρωποι**), em posição atributiva *inteiro* (**ἡ πᾶσα πόλις**).
    paradigms:
    - {word: πᾶς, pos: det, number: sg, label: {en: "πᾶς — singular", pt: "πᾶς — singular"}}
    - {word: πᾶς, pos: det, number: pl, label: {en: "πᾶς — plural", pt: "πᾶς — plural"}}
    match: {seq: [{lemma: "^(πᾶς|ἅπας|ἀληθής|σαφής|εὐδαίμων|σώφρων|ταχύς|ἡδύς|βαρύς|ὀξύς|εὐγενής|ἀσθενής)$"}], same: [case, number]}

- title: {en: Contract verbs, pt: Verbos contratos}
  lessons:
  - id: grc-contract
    title: τιμάω, ποιέω, δηλόω
    meaning: {en: "contract verbs in -άω, -έω, -όω", pt: "verbos contratos em -άω, -έω, -όω"}
    intro:
      en: |
        Stems in **α, ε, ο** contract with the endings in the present and imperfect: **ποιέω → ποιῶ**, **ποιέεις → ποιεῖς**; **τιμάω → τιμῶ**, **τιμάεις → τιμᾷς**; **δηλόω → δηλῶ**, **δηλόεις → δηλοῖς**. Dictionaries list the uncontracted form. In the other tenses the vowel lengthens before the suffix: **ποιήσω, ἐτίμησα, ἐδήλωσα**.
      pt: |
        Temas em **α, ε, ο** se contraem com as terminações no presente e no imperfeito: **ποιέω → ποιῶ**, **ποιέεις → ποιεῖς**; **τιμάω → τιμῶ**, **τιμάεις → τιμᾷς**; **δηλόω → δηλῶ**, **δηλόεις → δηλοῖς**. Os dicionários dão a forma não contraída. Nos outros tempos a vogal se alonga antes do sufixo: **ποιήσω, ἐτίμησα, ἐδήλωσα**.
    paradigms:
    - {word: ποιέω, pos: verb, tense: pres, mood: ind, voice: act, label: {en: "ποιέω do, make — present", pt: "ποιέω fazer — presente"}}
    - {word: τιμάω, pos: verb, tense: pres, mood: ind, voice: act, label: {en: "τιμάω honour — present", pt: "τιμάω honrar — presente"}}
    match: {seq: [{pos: verb, lemma: "(άω|έω|όω)$", tense: [pres, impf]}], same: [tense, mood, voice]}
