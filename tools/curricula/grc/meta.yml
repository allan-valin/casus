# Ancient (Attic) Greek Learn lessons, written for Casus (2026-10-19). Open courses were searched: White's First Greek
# Book (1896) is public domain but only as page scans; its UMKC digital edition is CC BY-NC-SA; Wikibooks' Ancient
# Greek has ten stub pages. So the lessons follow the usual first-year order (White; Hansen & Quinn; Mastronarde) and
# the facts follow Smyth's Greek Grammar (1920, public domain) and Wikipedia (CC BY-SA). Paradigm tables are generated
# from Casus's Wiktionary paradigms (tools/learn_tables.py), the Attic form chosen by its use in Xenophon. Exercises:
# Tatoeba's Greek sentences (with translations) and sentences of Xenophon's Anabasis and Memorabilia and Lysias 1
# (Perseus Digital Library, CC BY-SA 4.0; tools/build_corpus.py).
