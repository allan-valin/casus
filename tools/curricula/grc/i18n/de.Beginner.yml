# German text of the Ancient Greek course, Beginner — translated by AI (Claude) from the English (2026-10-20)
topics:
  Letters and sounds: "Buchstaben und Laute"
  The article and the second declension: "Der Artikel und die zweite Deklination"
  The first declension: "Die erste Deklination"
  The verb: "Das Verb"
  Describing and placing: "Beschreiben und verorten"
lessons:
  grc-alphabet:
    meaning: "das Alphabet, Spiritus und Akzente"
    intro: |
      Das Griechische hat 24 Buchstaben. Sieben sind Vokale: **α ε η ι ο υ ω** — **ε / ο** sind kurz, **η / ω** ihre langen Partner, und **α ι υ** können beides sein. Jedes vokalisch anlautende Wort trägt einen **Spiritus**: **ἀ** (lenis, kein Laut) oder **ἁ** (asper, ein *h*): **ἀγαθός** *agathós*, **ἡμέρα** *hēméra*. Anlautendes **ρ** hat immer den Spiritus asper: **ῥήτωρ**.

      Fast jedes Wort hat einen **Akzent** — Akut **ά**, Gravis **ὰ** (ein Akut vor einem weiteren Wort) oder Zirkumflex **ᾶ** (nur auf langen Vokalen) —, der einen Tonanstieg markiert. Ein kleines **ι** unter einem Langvokal (**ᾳ ῃ ῳ**, *Iota subscriptum*) wurde in klassischer Zeit daneben geschrieben und in der Schulaussprache nicht gesprochen. Schluss-Sigma wird **ς** geschrieben: **λόγος**.
    mistakes: ["Schluss-σ wird ς geschrieben, und das Wort behält seinen Akzent."]
  grc-article:
    meaning: "der bestimmte Artikel"
    intro: |
      Das Griechische hat einen bestimmten Artikel — **ὁ** (m.), **ἡ** (f.), **τό** (n.) —, in allen Kasus und Numeri dekliniert, und keinen unbestimmten: **ἄνθρωπος** „ein Mensch“, **ὁ ἄνθρωπος** „der Mensch“. Er richtet sich nach seinem Nomen und verrät so dessen Kasus, auch wenn die Endung des Nomens ungewohnt ist. Er steht häufiger als im Deutschen: bei Abstrakta (**ἡ ἀρετή** „die Tugend“) und Namen (**ὁ Σωκράτης**).
  grc-o-declension:
    meaning: "die zweite (o-)Deklination"
    intro: |
      Nomen auf **-ος** (meist maskulin: **λόγος** „Wort“, **ἄνθρωπος** „Mensch“) und **-ον** (neutral: **δῶρον** „Geschenk“). Das Neutrum hat dieselbe Form für Nominativ und Akkusativ und im Plural **-α**.

      Die **Kasus**: Nominativ (Subjekt), Genitiv (*von*, und nach vielen Präpositionen), Dativ (*an, für*, auch *mit, durch*), Akkusativ (Objekt, und *zu* nach Präpositionen der Bewegung), Vokativ (Anrede). Ein neutrales Pluralsubjekt nimmt meist ein **singularisches** Verb: **τὰ δῶρά ἐστι καλά**.
  grc-a-declension:
    meaning: "die erste (a-)Deklination"
    intro: |
      Meist feminine Nomen auf **-α** oder **-η**: nach **ε, ι, ρ** bleibt das **α** im ganzen Singular lang (**χώρα, χώρας** „Land“); sonst **η** (**τιμή, τιμῆς** „Ehre“). Nomen auf kurzes **-α** (**θάλαττα, θαλάττης** „Meer“) haben η im Genitiv und Dativ Singular. Der Plural ist für alle gleich: **-αι, -ῶν, -αις, -ᾱς**.

      Einige Maskulina enden auf **-ης / -ᾱς** mit Genitiv **-ου**: **στρατιώτης, στρατιώτου** „Soldat“, **νεανίᾱς** „junger Mann“.
  grc-present:
    meaning: "das Präsens Indikativ Aktiv"
    intro: |
      Griechische Verben werden in der **1. Person Singular** Präsens angeführt: **λύω** „ich löse“. Der Präsensstamm **λυ-** + Themavokal **ο / ε** + Personalendung: **λύ-ο-μεν** „wir lösen“. Die Endungen zeigen die Person, daher fällt das Pronomen meist weg. Das **-ν** von **λύουσι(ν)** tritt vor Vokal oder am Satzende hinzu (*ν ephelkystikon*).
  grc-eimi:
    meaning: "sein"
    intro: |
      **εἰμί** „ich bin“ ist unregelmäßig. Seine Präsensformen (außer **εἶ** „du bist“) sind **enklitisch**: Sie lehnen sich an das Wort davor und verlieren meist ihren Akzent: **ἀγαθός ἐστιν**. Betont am Satzanfang bedeutet **ἔστι** „es gibt“ oder „es ist möglich“. Das Imperfekt lautet **ἦ / ἦν, ἦσθα, ἦν…** „ich war“.
  grc-adjectives:
    meaning: "Adjektive der ersten und zweiten Deklination; attributive Stellung"
    intro: |
      Die meisten Adjektive folgen **-ος, -η (oder -ᾱ), -ον** — Maskulinum und Neutrum wie λόγος / δῶρον, Femininum wie τιμή / χώρα. Sie richten sich in Genus, Numerus und Kasus nach dem Nomen.

      Die Stellung zählt: zwischen Artikel und Nomen oder nach wiederholtem Artikel ist das Adjektiv **attributiv** — **ὁ ἀγαθὸς ἀνήρ / ὁ ἀνὴρ ὁ ἀγαθός** „der gute Mann“; außerhalb der Artikelgruppe ist es **prädikativ** — **ὁ ἀνὴρ ἀγαθός** „der Mann (ist) gut“.
  grc-prepositions:
    meaning: "Präpositionen und ihre Kasus"
    intro: |
      Jede Präposition regiert bestimmte Kasus, und manche ändern mit dem Kasus ihre Bedeutung:

      - Genitiv: **ἐκ / ἐξ** aus, **ἀπό** von, **πρό** vor, **ἀντί** anstatt
      - Dativ: **ἐν** in, **σύν** mit
      - Akkusativ: **εἰς** in … hinein, **ἀνά** hinauf
      - mehrere: **παρά** (Gen. *von*, Dat. *bei*, Akk. *zu*), **πρός** (Gen. *von*, Dat. *an*, Akk. *auf … zu*), **ἐπί** (Gen. *auf*, Dat. *bei*, Akk. *gegen*), **διά** (Gen. *durch*, Akk. *wegen*), **μετά** (Gen. *mit*, Akk. *nach*), **ὑπό** (Gen. *von* einem Urheber, Akk. *unter*), **κατά**, **περί**, **ὑπέρ**
