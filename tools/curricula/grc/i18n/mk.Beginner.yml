# Macedonian text of the Ancient Greek course, Beginner — translated by AI (Claude) from the English (2026-10-20)
topics:
  Letters and sounds: "Букви и гласови"
  The article and the second declension: "Членот и втората деклинација"
  The first declension: "Првата деклинација"
  The verb: "Глаголот"
  Describing and placing: "Опишување и сместување"
lessons:
  grc-alphabet:
    meaning: "азбуката, спиритусите и акцентите"
    intro: |
      Грчкиот има 24 букви. Седум се самогласки: **α ε η ι ο υ ω** — **ε / ο** се кратки, **η / ω** нивните долги парови, а **α ι υ** можат да бидат и едното и другото. Секој збор што почнува со самогласка носи **спиритус**: **ἀ** (лесен, без глас) или **ἁ** (тежок, едно *х*): **ἀγαθός** *агатос*, **ἡμέρα** *хемера*. Почетното **ρ** секогаш има тежок спиритус: **ῥήτωρ**.

      Речиси секој збор има **акцент** — акут **ά**, гравис **ὰ** (акут пред друг збор) или циркумфлекс **ᾶ** (само на долги самогласки) — што означува покачување на тонот. Мало **ι** под долга самогласка (**ᾳ ῃ ῳ**, *йота субскрипт*) во класично време се пишуваше до неа и не се изговара во училишниот изговор. Крајната сигма се пишува **ς**: **λόγος**.
    mistakes: ["Крајното σ се пишува ς, а зборот го задржува акцентот."]
  grc-article:
    meaning: "определениот член"
    intro: |
      Грчкиот има определен член — **ὁ** (м.), **ἡ** (ж.), **τό** (ср.) — менлив по сите падежи и броеви, но нема неопределен: **ἄνθρωπος** „човек“, **ὁ ἄνθρωπος** „човекот“. Членот се согласува со именката, па го покажува нејзиниот падеж дури и кога наставката е непозната. Се користи почесто отколку во македонскиот: со апстрактни именки (**ἡ ἀρετή** „доблеста“) и со имиња (**ὁ Σωκράτης**).
  grc-o-declension:
    meaning: "втората (о-) деклинација"
    intro: |
      Именки на **-ος** (главно машки: **λόγος** „збор“, **ἄνθρωπος** „човек“) и **-ον** (средни: **δῶρον** „подарок“). Средниот род има иста форма за номинатив и акузатив, а во множина **-α**.

      **Падежите**: номинатив (подмет), генитив (*на, од*, и по многу предлози), датив (*на, за*, и *со, преку*), акузатив (објект, и *кон* по предлози за движење), вокатив (обраќање). Подмет од среден род во множина обично зема глагол во **еднина**: **τὰ δῶρά ἐστι καλά**.
  grc-a-declension:
    meaning: "првата (а-) деклинација"
    intro: |
      Главно именки од женски род на **-α** или **-η**: по **ε, ι, ρ** **α** останува долго низ еднината (**χώρα, χώρας** „земја“); инаку **η** (**τιμή, τιμῆς** „чест“). Именките на кратко **-α** (**θάλαττα, θαλάττης** „море“) имаат η во генитив и датив еднина. Множината е иста за сите: **-αι, -ῶν, -αις, -ᾱς**.

      Неколку машки именки завршуваат на **-ης / -ᾱς** со генитив **-ου**: **στρατιώτης, στρατιώτου** „војник“, **νεανίᾱς** „младич“.
  grc-present:
    meaning: "сегашно време, индикатив, актив"
    intro: |
      Грчките глаголи се наведуваат во **1 лице еднина** сегашно време: **λύω** „одврзувам“. Основата **λυ-** + тематската самогласка **ο / ε** + личната наставка: **λύ-ο-μεν** „одврзуваме“. Наставките го покажуваат лицето, па заменката обично се изоставa — како во македонскиот. **-ν** во **λύουσι(ν)** се додава пред самогласка или на крајот на реченицата (*подвижно ни*).
  grc-eimi:
    meaning: "„сум“"
    intro: |
      **εἰμί** „сум“ е неправилен. Неговите сегашни форми (освен **εἶ** „си“) се **енклитики**: се потпираат на зборот пред нив и обично го губат акцентот — како македонското **сум**: **ἀγαθός ἐστιν**. Нагласено на почетокот на реченицата **ἔστι** значи „има“ или „можно е“. Минатото несвршено е **ἦ / ἦν, ἦσθα, ἦν…** „бев“.
  grc-adjectives:
    meaning: "придавки од првата и втората деклинација; атрибутивна позиција"
    intro: |
      Повеќето придавки го следат **-ος, -η (или -ᾱ), -ον** — машкиот и средниот род како λόγος / δῶρον, женскиот како τιμή / χώρα. Се согласуваат со именката по род, број и падеж.

      Позицијата е важна: меѓу членот и именката, или по повторен член, придавката е **атрибутивна** — **ὁ ἀγαθὸς ἀνήρ / ὁ ἀνὴρ ὁ ἀγαθός** „добриот човек“; надвор од групата со членот е **предикативна** — **ὁ ἀνὴρ ἀγαθός** „човекот (е) добар“.
  grc-prepositions:
    meaning: "предлозите и нивните падежи"
    intro: |
      Секој предлог бара одреден падеж, а некои го менуваат значењето според падежот:

      - генитив: **ἐκ / ἐξ** од (внатре), **ἀπό** од, **πρό** пред, **ἀντί** наместо
      - датив: **ἐν** во, **σύν** со
      - акузатив: **εἰς** во (кон внатре), **ἀνά** нагоре
      - повеќе: **παρά** (ген. *од*, дат. *покрај*, акуз. *кон*), **πρός** (ген. *од*, дат. *кај*, акуз. *кон*), **ἐπί** (ген. *на*, дат. *кај*, акуз. *против*), **διά** (ген. *низ*, акуз. *поради*), **μετά** (ген. *со*, акуз. *по*), **ὑπό** (ген. *од* вршител, акуз. *под*), **κατά**, **περί**, **ὑπέρ**
