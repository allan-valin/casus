# Arabic text of the Ancient Greek course, Reading — translated by AI (Claude) from the English (2026-10-20)
topics:
  Participles and infinitives: "اسم الفاعل/المفعول والمصادر"
  Subjunctive and optative: "الالتماسي والتمنّي"
  Further forms: "صيغ أخرى"
lessons:
  grc-participle:
    meaning: "اسم الفاعل واسم المفعول"
    intro: |
      تستعمل اليونانية أسماء الفاعل والمفعول أكثر بكثير من الإنجليزية. هي صفات مشتقة من الفعل لها زمن (جهة) وصيغة: **λύων، λύουσα، λῦον** «حالّ»، **λύσας، λύσασα، λῦσαν** «وقد حلّ»، **λυθείς** «وقد حُلَّ». ومع الأداة تصير اسمًا: **οἱ φεύγοντες** «الهاربون». وبدونها تضيف ظرفًا — *حين، لأن، مع أن، إذا* — يحدده السياق، كالحال في العربية.
  grc-genitive-absolute:
    meaning: "الإضافة المطلقة"
    intro: |
      اسم واسم فاعل في **حالة الإضافة**، خارج نحو الجملة الرئيسية، يعطيان ملابساتها — مثل الحالة المطلقة اللاتينية: **Κύρου βασιλεύοντος** «حين كان قورش ملكًا»، **ταῦτα εἰπόντος αὐτοῦ** «بعد أن قال هذا».
  grc-infinitive:
    meaning: "المصدر؛ الكلام المنقول"
    intro: |
      المصادر: المضارع **λύειν**، الأوريست **λῦσαι**، المستقبل **λύσειν**، التام **λελυκέναι** (الوسط/المجهول **λύεσθαι، λύσασθαι، λυθῆναι**). ومع الأداة يصير اسمًا: **τὸ μανθάνειν** «التعلّم».

      بعد أفعال القول والظن (**φημί، νομίζω، οἴομαι**) يكون الكلام المنقول **مصدرًا فاعله منصوب**: **φησὶ τὸν ἄνδρα ἀγαθὸν εἶναι** «يقول إن الرجل صالح». (و**λέγω** و**οἶδα** تفضّلان **ὅτι** + الخبري، مثل «أنّ».)
  grc-subjunctive:
    meaning: "الالتماسي: الغاية والحث والشرط"
    intro: |
      للالتماسي **صوائت موضوعية طويلة** (**ω / η**): **λύω، λύῃς، λύῃ، λύωμεν، λύητε، λύωσι**. أهم استعمالاته: **الغاية** بعد **ἵνα، ὅπως، ὡς** (والنفي **μή**): **ἥκομεν ἵνα μάθωμεν** «جئنا لنتعلّم»؛ **الحث**: **ἴωμεν** «لنذهب»؛ النهي مع الأوريست **μὴ ποιήσῃς** «لا تفعل»؛ والشرط المستقبلي مع **ἐάν** (**ἐάν τι ἔχω، δώσω** «إن كان عندي شيء أعطيته»).
  grc-optative:
    meaning: "التمنّي: الرغبات والاحتمال البعيد"
    intro: |
      للتمنّي **-οι-** (أو **-αι-**، **-ειη-**): **λύοιμι، λύοις، λύοι…**، والأوريست **λύσαιμι**. يعبّر عن **التمني** (**εἴθε γένοιο** «ليتك تصير…»)، و**الاحتمال** البعيد مع **ἄν** (**τοῦτο οὐκ ἂν γένοιτο** «هذا لا يمكن أن يحدث»)، وبعد فعل رئيسي ماضٍ قد يحل محل الالتماسي أو الخبري في الجملة التابعة.
  grc-conditions:
    meaning: "جمل الشرط"
    intro: |
      **εἰ** + الخبري للشرط البسيط (**εἰ τοῦτο λέγεις، ἁμαρτάνεις** «إن كنت تقول هذا فأنت مخطئ»)؛ **ἐάν** (= εἰ ἄν) + الالتماسي للمستقبل والعموم؛ **εἰ** + التمنّي … **ἄν** + التمنّي للمستقبل البعيد («لو أنه…، لـ…»)؛ **εἰ** + الخبري الماضي … **ἄν** + الخبري الماضي لما يخالف الواقع («لو كان قد…، لكان قد…»).
  grc-perfect:
    meaning: "التام والماضي الأسبق"
    intro: |
      للتام **تضعيف** (الساكن الأول + ε: **λέ-λυκα**) وفي المعلوم **-κα**: **λέλυκα** «قد حللتُ» — حالة حاضرة ناتجة عن فعل ماضٍ. والماضي الأسبق يضيف الزيادة الماضوية: **ἐλελύκη** «كنت قد حللت». والتام الوسط/المجهول بلا κ: **λέλυμαι**.
  grc-mi-verbs:
    meaning: "الأفعال المنتهية بـ -μι"
    intro: |
      مجموعة صغيرة شائعة جدًا تضيف اللواحق إلى الجذر مباشرة، بلا صائت موضوعي، وتضعّف المضارع بـ **ι**: **δί-δω-μι** «يعطي»، **τί-θη-μι** «يضع»، **ἵ-στη-μι** «يُقيم»، **ἵημι** «يرسل»، **δείκνυμι** «يُري». صائت الجذر طويل في المفرد وقصير في الجمع: **δίδωμι / δίδομεν**.
  grc-imperative:
    meaning: "الأمر"
    intro: |
      أمر المضارع **λῦε، λύετε** (أمر مستمر أو عام)، وأمر الأوريست **λῦσον، λύσατε** (فعل واحد). وهناك صيغ للغائب أيضًا: **λυέτω** «ليحلّ». والنهي: **μή** + أمر المضارع، أو **μή** + **التماسي** الأوريست: **μὴ λύσῃς**.
  grc-comparison:
    meaning: "تفضيل الصفات"
    intro: |
      التفضيل المنتظم: **-τερος، -τατος**: **σοφός → σοφώτερος → σοφώτατος** (ω بعد مقطع قصير). وكثير من الصفات الشائعة تأخذ **-ίων، -ιστος**: **ἡδύς → ἡδίων → ἥδιστος**؛ وبعضها شاذ: **ἀγαθός → ἀμείνων / βελτίων → ἄριστος / βέλτιστος**، **κακός → κακίων → κάκιστος**، **μέγας → μείζων → μέγιστος**، **πολύς → πλείων → πλεῖστος**. و*من* (في المقارنة) هي **ἤ** أو حالة الإضافة: **σοφώτερος ἐμοῦ**.
