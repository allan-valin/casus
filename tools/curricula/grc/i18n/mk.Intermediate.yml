# Macedonian text of the Ancient Greek course, Intermediate — translated by AI (Claude) from the English (2026-10-20)
topics:
  The past and the future: "Минатото и идното време"
  Middle and passive: "Медиум и пасив"
  Pronouns: "Заменки"
  The third declension: "Третата деклинација"
  Contract verbs: "Контрахирани глаголи"
lessons:
  grc-imperfect:
    meaning: "минатото несвршено време и аугментот"
    intro: |
      Минатите времиња во индикатив земаат **аугмент**: **ἐ-** пред согласка (**λύω → ἔλυον** „одврзував“) или **издолжена** почетна самогласка (**ἄγω → ἦγον**, **ἐλπίζω → ἤλπιζον**, **οἰκέω → ᾤκουν**). Кај сложените глаголи аугментот доаѓа по префиксот: **προσβάλλω → προσέβαλλον**.

      Минатото несвршено, како македонското, претставува дејство во минатото како траење, повторување или обид.
  grc-future:
    meaning: "идното време"
    intro: |
      Идното време додава **-σ-** на основата и ги зема наставките на сегашното: **λύσω** „ќе одврзам“. σ се спојува со крајната согласка: **γράφω → γράψω**, **ἄγω → ἄξω**, **πείθω → πείσω**. Глаголите на ликвиди (λ μ ν ρ) имаат **контрахирано идно** без σ: **μένω → μενῶ**. Многу чести глаголи имаат **медијално** идно со активно значење: **εἰμί → ἔσομαι**, **ἀκούω → ἀκούσομαι**.
  grc-aorist:
    meaning: "првиот (сигматски) аорист"
    intro: |
      **Аористот** го кажува минатото дејство едноставно, како еден настан — вообичаеното раскажувачко минато, исто како македонскиот аорист наспроти имперфектот. Првиот аорист има аугмент, **-σα-** и свои наставки: **ἔλυσα, ἔλυσας, ἔλυσε(ν), ἐλύσαμεν, ἐλύσατε, ἔλυσαν**.

      Надвор од индикативот (конјунктив, оптатив, императив, инфинитив, партицип) аористот **нема аугмент** и изразува **вид**, не време: **λῦσαι** „да одврзе (еднаш)“ наспроти **λύειν** „да одврзува“.
  grc-aorist-2:
    meaning: "вториот аорист"
    intro: |
      Многу од најчестите глаголи го градат аористот од **друга основа** со наставките на имперфектот: **λείπω → ἔλιπον**, **λαμβάνω → ἔλαβον**, **βάλλω → ἔβαλον**, **ἄγω → ἤγαγον**, **ἔχω → ἔσχον**, **μανθάνω → ἔμαθον**, **φεύγω → ἔφυγον**, **πάσχω → ἔπαθον**; некои од сосема друг корен: **λέγω → εἶπον**, **ὁράω → εἶδον**, **ἔρχομαι → ἦλθον**, **φέρω → ἤνεγκον**. Учи ги со глаголот (неговите *главни форми*).
  grc-middle:
    meaning: "медиум и пасив (сегашен систем)"
    intro: |
      Покрај активот и пасивот, грчкиот има **медиум**: подметот дејствува **за себе** или врз себе — **λύομαι** „откупувам (одврзувам за себе)“, **παύομαι** „престанувам (се запирам)“. Во сегашното и имперфектот медиумот и пасивот имаат **исти форми**: **λύομαι** значи и „ме одврзуваат“. Некои глаголи постојат само во медијална форма со активно значење (*депоненси*): **βούλομαι** „сакам“, **γίγνομαι** „станувам“, **ἔρχομαι** „одам“.
  grc-aorist-passive:
    meaning: "аорист пасив"
    intro: |
      Аористот пасив има своја основа на **-θη-** со наставки што изгледаат активни: **ἐλύθην** „бев одврзан“, **ἐλύθης, ἐλύθη, ἐλύθημεν…**. Некои глаголи имаат **-η-** без θ (*втор аорист пасив*): **γράφω → ἐγράφην**. Аористот **медиум** е посебен: **ἐλυσάμην** „откупив“.
  grc-personal:
    meaning: "лични заменки и αὐτός"
    intro: |
      **ἐγώ** „јас“ и **σύ** „ти“ (множина **ἡμεῖς, ὑμεῖς**) се користат како подмет само за нагласување; нивните коси форми имаат ненагласени енклитички варијанти: **μου, μοι, με** — слично на македонските **ме, ми**. За *него, неа, него, нив* грчкиот ги користи косите падежи на **αὐτός**, кој има три употреби:

      - само коси падежи: *него, неа* — **ὁρῶ αὐτόν** „го гледам“
      - во предикативна позиција: *сам* — **αὐτὸς ὁ βασιλεύς** „самиот цар“
      - во атрибутивна позиција: *истиот* — **ὁ αὐτὸς βασιλεύς** „истиот цар“
  grc-demonstratives:
    meaning: "показни заменки: овој, оној"
    intro: |
      **οὗτος** „овој (штотуку спомнат)“, **ὅδε** „овој (тука / следниов)“, **ἐκεῖνος** „оној (таму)“. Со именка стојат во **предикативна позиција**, надвор од членот: **οὗτος ὁ ἀνήρ** или **ὁ ἀνὴρ οὗτος** „овој човек“. **οὗτος** ја менува првата самогласка според наставката: **τοῦτο, ταῦτα, τούτου, ταύτης**.
  grc-relative:
    meaning: "релативната заменка"
    intro: |
      **ὅς, ἥ, ὅ** „кој, која, кое“ се согласува со антецедентот по род и број; падежот го добива од својата реченица: **ὁ ἀνὴρ ὃν εἶδες** „човекот што го виде“. Нејзините форми изгледаат како членот со тежок спиритус и акцент: **οὗ, ᾧ, ὅν; ἧς, ᾗ, ἥν**.
  grc-third-consonant:
    meaning: "трета деклинација: согласски основи"
    intro: |
      Третата деклинација ги додава наставките на **основа** што номинативот често ја крие — најди ја во **генитивот**: **φύλαξ, φύλακ-ος** „чувар“, **ἐλπίς, ἐλπίδ-ος** „надеж“, **σῶμα, σώματ-ος** „тело“. Наставки: **-ος, -ι, -α / -ν** во еднина; **-ες, -ων, -σι(ν), -ας** во множина; средниот род **-α** во номинатив/акузатив множина. Дативот множина **-σι** се спојува со основата: **φύλαξι**, **σώμασι**.
  grc-third-s:
    meaning: "трета деклинација: s-основи и контракција"
    intro: |
      Основите на **-εσ-** го изгубија σ меѓу самогласки, а самогласките се **контрахираа**: **γένος** „род, вид“, основа γενεσ-, генитив \*γένεσος → γένεος → **γένους**, множина **γένη**. Имињата на **-ης** одат исто: **Σωκράτης, Σωκράτους**. Неконтрахираните форми се јонски (Херодот, Хомер).
  grc-third-adjectives:
    meaning: "придавки од третата деклинација"
    intro: |
      **πᾶς, πᾶσα, πᾶν** „сиот, секој“ (женскиот род по првата деклинација), **ἀληθής, ἀληθές** „вистински“ (со две наставки, s-основа), **εὐδαίμων, εὔδαιμον** „среќен“ (n-основа), **ταχύς, ταχεῖα, ταχύ** „брз“. Со член, **πᾶς** во предикативна позиција значи *сите* (**πάντες οἱ ἄνθρωποι**), во атрибутивна *целиот* (**ἡ πᾶσα πόλις**).
  grc-contract:
    meaning: "контрахирани глаголи на -άω, -έω, -όω"
    intro: |
      Основите на **α, ε, ο** се контрахираат со наставките во сегашното и имперфектот: **ποιέω → ποιῶ**, **ποιέεις → ποιεῖς**; **τιμάω → τιμῶ**, **τιμάεις → τιμᾷς**; **δηλόω → δηλῶ**, **δηλόεις → δηλοῖς**. Речниците ја даваат неконтрахираната форма. Во другите времиња самогласката се издолжува пред суфиксот: **ποιήσω, ἐτίμησα, ἐδήλωσα**.
