# Arabic text of the Ancient Greek course, Intermediate — translated by AI (Claude) from the English (2026-10-20)
topics:
  The past and the future: "الماضي والمستقبل"
  Middle and passive: "الوسط والمجهول"
  Pronouns: "الضمائر"
  The third declension: "التصريف الثالث"
  Contract verbs: "الأفعال المدغمة"
lessons:
  grc-imperfect:
    meaning: "الماضي الناقص والزيادة الماضوية"
    intro: |
      أزمنة الماضي في الخبري تأخذ **زيادة ماضوية** (أوغمنت): **ἐ-** قبل الساكن (**λύω → ἔλυον** «كنت أحلّ»)، أو **إطالة** الصائت الأول (**ἄγω → ἦγον**، **ἐλπίζω → ἤλπιζον**، **οἰκέω → ᾤκουν**). وفي الأفعال المركبة تأتي الزيادة بعد السابقة: **προσβάλλω → προσέβαλλον**.

      الماضي الناقص، مثل «كان يفعل» في العربية، يعرض الحدث في الماضي مستمرًا أو متكررًا أو محاولةً.
  grc-future:
    meaning: "المستقبل"
    intro: |
      المستقبل يضيف **-σ-** إلى الجذر ويأخذ لواحق المضارع: **λύσω** «سأحلّ». وتندمج σ مع الساكن الأخير: **γράφω → γράψω**، **ἄγω → ἄξω**، **πείθω → πείσω**. والأفعال المنتهية بحروف مائعة (λ μ ν ρ) لها **مستقبل مدغم** بلا σ: **μένω → μενῶ**. وكثير من الأفعال الشائعة لها مستقبل **وسطي** بمعنى المعلوم: **εἰμί → ἔσομαι**، **ἀκούω → ἀκούσομαι**.
  grc-aorist:
    meaning: "الأوريست الأول (السيغمي)"
    intro: |
      **الأوريست** يذكر الحدث الماضي ببساطة، حدثًا واحدًا — وهو ماضي السرد المعتاد، مقابل الماضي الناقص. للأوريست الأول زيادة ماضوية و**-σα-** ولواحق خاصة: **ἔλυσα، ἔλυσας، ἔλυσε(ν)، ἐλύσαμεν، ἐλύσατε، ἔλυσαν**.

      خارج الخبري (الالتماسي والتمني والأمر والمصدر واسم الفاعل) **لا زيادة** للأوريست، وهو يعبّر عن **الجهة** لا الزمن: **λῦσαι** «أن يحلّ (مرة)» مقابل **λύειν** «أن يكون يحلّ».
  grc-aorist-2:
    meaning: "الأوريست الثاني"
    intro: |
      كثير من أكثر الأفعال شيوعًا يصوغ الأوريست من **جذر آخر** بلواحق الماضي الناقص: **λείπω → ἔλιπον**، **λαμβάνω → ἔλαβον**، **βάλλω → ἔβαλον**، **ἄγω → ἤγαγον**، **ἔχω → ἔσχον**، **μανθάνω → ἔμαθον**، **φεύγω → ἔφυγον**، **πάσχω → ἔπαθον**؛ وبعضها من أصل مختلف تمامًا: **λέγω → εἶπον**، **ὁράω → εἶδον**، **ἔρχομαι → ἦλθον**، **φέρω → ἤνεγκον**. احفظها مع الفعل (*صيغه الأساسية*).
  grc-middle:
    meaning: "الوسط والمجهول (نظام المضارع)"
    intro: |
      إلى جانب المعلوم والمجهول، لليونانية صيغة **وسطى**: الفاعل يفعل **لنفسه** أو في نفسه — **λύομαι** «أفتدي (أحلّ لنفسي)»، **παύομαι** «أكفّ (أوقف نفسي)»، كصيغة «افتعل/تفعّل» أحيانًا في العربية. وفي المضارع والماضي الناقص للوسط والمجهول **الصيغ نفسها**: **λύομαι** تعني أيضًا «أُحَلّ». وبعض الأفعال لا توجد إلا بصيغة وسطى بمعنى المعلوم (*الأفعال اللازمة الوسطى*): **βούλομαι** «أريد»، **γίγνομαι** «أصبح»، **ἔρχομαι** «أذهب».
  grc-aorist-passive:
    meaning: "الأوريست المجهول"
    intro: |
      للأوريست المجهول جذر خاص بـ **-θη-** ولواحق تشبه المعلوم: **ἐλύθην** «حُلِلتُ»، **ἐλύθης، ἐλύθη، ἐλύθημεν…**. وبعض الأفعال لها **-η-** بلا θ (*الأوريست المجهول الثاني*): **γράφω → ἐγράφην**. والأوريست **الوسط** مستقل: **ἐλυσάμην** «افتديت».
  grc-personal:
    meaning: "الضمائر الشخصية وαὐτός"
    intro: |
      **ἐγώ** «أنا» و**σύ** «أنت» (الجمع **ἡμεῖς، ὑμεῖς**) تُستعملان فاعلًا للتوكيد فقط؛ ولصيغهما غير الرفعية بدائل ملحقة غير منبورة: **μου، μοι، με**. ولـ*ـه، ـها، ـهم* تستعمل اليونانية الحالات غير الرفعية من **αὐτός**، ولها ثلاثة استعمالات:

      - الحالات غير الرفعية وحدها: *ـه، ـها* — **ὁρῶ αὐτόν** «أراه»
      - في الموقع الخبري: *نفسه* — **αὐτὸς ὁ βασιλεύς** «الملك نفسه»
      - في الموقع النعتي: *ذاته، عينه* — **ὁ αὐτὸς βασιλεύς** «الملك ذاته»
  grc-demonstratives:
    meaning: "أسماء الإشارة: هذا، ذلك"
    intro: |
      **οὗτος** «هذا (المذكور للتو)»، **ὅδε** «هذا (هنا / الآتي)»، **ἐκεῖνος** «ذلك (هناك)». مع الاسم تقف في **الموقع الخبري**، خارج الأداة: **οὗτος ὁ ἀνήρ** أو **ὁ ἀνὴρ οὗτος** «هذا الرجل». و**οὗτος** يتغير صائته الأول مع اللاحقة: **τοῦτο، ταῦτα، τούτου، ταύτης**.
  grc-relative:
    meaning: "الاسم الموصول"
    intro: |
      **ὅς، ἥ، ὅ** «الذي، التي» يطابق ما يعود إليه في الجنس والعدد؛ وحالته من جملته: **ὁ ἀνὴρ ὃν εἶδες** «الرجل الذي رأيتَه». صيغه تشبه الأداة مع علامة النفَس الخشنة ونبرة: **οὗ، ᾧ، ὅν؛ ἧς، ᾗ، ἥν**.
  grc-third-consonant:
    meaning: "التصريف الثالث: الجذور المنتهية بساكن"
    intro: |
      يضيف التصريف الثالث لواحقه إلى **جذر** كثيرًا ما تخفيه صيغة الرفع — ابحث عنه في **حالة الإضافة**: **φύλαξ، φύλακ-ος** «حارس»، **ἐλπίς، ἐλπίδ-ος** «أمل»، **σῶμα، σώματ-ος** «جسد». اللواحق: **-ος، -ι، -α / -ν** في المفرد؛ **-ες، -ων، -σι(ν)، -ας** في الجمع؛ والمحايد **-α** في الرفع/النصب الجمع. وقابلية الجمع **-σι** تندمج مع الجذر: **φύλαξι**، **σώμασι**.
  grc-third-s:
    meaning: "التصريف الثالث: جذور s والإدغام"
    intro: |
      الجذور المنتهية بـ **-εσ-** فقدت σ بين صائتين، و**أُدغمت** الصوائت: **γένος** «جنس، نوع»، الجذر γενεσ-، الإضافة \*γένεσος → γένεος → **γένους**، والجمع **γένη**. والأعلام المنتهية بـ **-ης** كذلك: **Σωκράτης، Σωκράτους**. والصيغ غير المدغمة أيونية (هيرودوت، هوميروس).
  grc-third-adjectives:
    meaning: "صفات التصريف الثالث"
    intro: |
      **πᾶς، πᾶσα، πᾶν** «كل، جميع» (المؤنث في التصريف الأول)، **ἀληθής، ἀληθές** «صادق» (بلاحقتين، جذر s)، **εὐδαίμων، εὔδαιμον** «سعيد» (جذر n)، **ταχύς، ταχεῖα، ταχύ** «سريع». ومع الأداة، **πᾶς** في الموقع الخبري تعني *الجميع* (**πάντες οἱ ἄνθρωποι**)، وفي الموقع النعتي *بأكمله* (**ἡ πᾶσα πόλις**).
  grc-contract:
    meaning: "الأفعال المدغمة المنتهية بـ -άω، -έω، -όω"
    intro: |
      الجذور المنتهية بـ **α، ε، ο** تُدغم مع اللواحق في المضارع والماضي الناقص: **ποιέω → ποιῶ**، **ποιέεις → ποιεῖς**؛ **τιμάω → τιμῶ**، **τιμάεις → τιμᾷς**؛ **δηλόω → δηλῶ**، **δηλόεις → δηλοῖς**. والقواميس تذكر الصيغة غير المدغمة. وفي الأزمنة الأخرى يطول الصائت قبل اللاحقة: **ποιήσω، ἐτίμησα، ἐδήλωσα**.
