# German text of the Ancient Greek course, Intermediate — translated by AI (Claude) from the English (2026-10-20)
topics:
  The past and the future: "Vergangenheit und Futur"
  Middle and passive: "Medium und Passiv"
  Pronouns: "Pronomen"
  The third declension: "Die dritte Deklination"
  Contract verbs: "Kontrahierte Verben"
lessons:
  grc-imperfect:
    meaning: "das Imperfekt und das Augment"
    intro: |
      Die Vergangenheitstempora des Indikativs nehmen ein **Augment**: **ἐ-** vor Konsonant (**λύω → ἔλυον** „ich löste gerade“) oder einen **gedehnten** Anfangsvokal (**ἄγω → ἦγον**, **ἐλπίζω → ἤλπιζον**, **οἰκέω → ᾤκουν**). Bei zusammengesetzten Verben steht das Augment nach dem Präfix: **προσβάλλω → προσέβαλλον**.

      Das Imperfekt stellt wie das lateinische eine Handlung in der Vergangenheit als andauernd, wiederholt oder versucht dar.
  grc-future:
    meaning: "das Futur"
    intro: |
      Das Futur fügt dem Stamm **-σ-** an und nimmt die Präsensendungen: **λύσω** „ich werde lösen“. Das σ verbindet sich mit einem Endkonsonanten: **γράφω → γράψω**, **ἄγω → ἄξω**, **πείθω → πείσω**. Verben auf Liquida (λ μ ν ρ) haben ein **kontrahiertes Futur** ohne σ: **μένω → μενῶ**. Viele häufige Verben haben ein **mediales** Futur mit aktiver Bedeutung: **εἰμί → ἔσομαι**, **ἀκούω → ἀκούσομαι**.
  grc-aorist:
    meaning: "der erste (sigmatische) Aorist"
    intro: |
      Der **Aorist** nennt eine vergangene Handlung schlicht als einzelnes Ereignis — die übliche Erzählvergangenheit, im Gegensatz zum Imperfekt. Der erste Aorist hat Augment, **-σα-** und eigene Endungen: **ἔλυσα, ἔλυσας, ἔλυσε(ν), ἐλύσαμεν, ἐλύσατε, ἔλυσαν**.

      Außerhalb des Indikativs (Konjunktiv, Optativ, Imperativ, Infinitiv, Partizip) hat der Aorist **kein Augment** und drückt **Aspekt** aus, nicht Zeit: **λῦσαι** „(einmal) lösen“ gegenüber **λύειν** „beim Lösen sein“.
  grc-aorist-2:
    meaning: "der zweite Aorist"
    intro: |
      Viele der häufigsten Verben bilden den Aorist von einem **anderen Stamm** mit den Endungen des Imperfekts: **λείπω → ἔλιπον**, **λαμβάνω → ἔλαβον**, **βάλλω → ἔβαλον**, **ἄγω → ἤγαγον**, **ἔχω → ἔσχον**, **μανθάνω → ἔμαθον**, **φεύγω → ἔφυγον**, **πάσχω → ἔπαθον**; manche von einer ganz anderen Wurzel: **λέγω → εἶπον**, **ὁράω → εἶδον**, **ἔρχομαι → ἦλθον**, **φέρω → ἤνεγκον**. Lerne sie mit dem Verb (seine *Stammformen*).
  grc-middle:
    meaning: "Medium und Passiv (Präsensstamm)"
    intro: |
      Neben Aktiv und Passiv hat das Griechische ein **Medium**: Das Subjekt handelt **für sich** oder an sich — **λύομαι** „ich kaufe frei (löse für mich)“, **παύομαι** „ich höre auf (halte mich an)“. Im Präsens und Imperfekt haben Medium und Passiv **dieselben Formen**: **λύομαι** heißt auch „ich werde gelöst“. Manche Verben gibt es nur in medialer Form mit aktiver Bedeutung (*Deponentien*): **βούλομαι** „ich will“, **γίγνομαι** „ich werde“, **ἔρχομαι** „ich gehe“.
  grc-aorist-passive:
    meaning: "der Aorist Passiv"
    intro: |
      Der Aorist Passiv hat einen eigenen Stamm auf **-θη-** mit aktiv aussehenden Endungen: **ἐλύθην** „ich wurde gelöst“, **ἐλύθης, ἐλύθη, ἐλύθημεν…**. Manche Verben haben **-η-** ohne θ (*zweiter Aorist Passiv*): **γράφω → ἐγράφην**. Der Aorist **Medium** ist eigenständig: **ἐλυσάμην** „ich kaufte frei“.
  grc-personal:
    meaning: "Personalpronomen und αὐτός"
    intro: |
      **ἐγώ** „ich“ und **σύ** „du“ (Plural **ἡμεῖς, ὑμεῖς**) stehen als Subjekt nur zur Betonung; ihre obliquen Formen haben unbetonte enklitische Varianten: **μου, μοι, με**. Für *ihn, sie, es, sie (Pl.)* verwendet das Griechische die obliquen Kasus von **αὐτός**, das drei Gebrauchsweisen hat:

      - oblique Kasus allein: *ihn, sie, es* — **ὁρῶ αὐτόν** „ich sehe ihn“
      - in prädikativer Stellung: *selbst* — **αὐτὸς ὁ βασιλεύς** „der König selbst“
      - in attributiver Stellung: *derselbe* — **ὁ αὐτὸς βασιλεύς** „derselbe König“
  grc-demonstratives:
    meaning: "Demonstrativa: dieser, jener"
    intro: |
      **οὗτος** „dieser (eben genannte)“, **ὅδε** „dieser (hier / folgende)“, **ἐκεῖνος** „jener (dort)“. Mit einem Nomen stehen sie in **prädikativer Stellung**, außerhalb des Artikels: **οὗτος ὁ ἀνήρ** oder **ὁ ἀνὴρ οὗτος** „dieser Mann“. **οὗτος** ändert seinen ersten Vokal mit der Endung: **τοῦτο, ταῦτα, τούτου, ταύτης**.
  grc-relative:
    meaning: "das Relativpronomen"
    intro: |
      **ὅς, ἥ, ὅ** „der, welcher“ richtet sich in Genus und Numerus nach seinem Bezugswort; den Kasus bestimmt sein eigener Satz: **ὁ ἀνὴρ ὃν εἶδες** „der Mann, den du sahst“. Seine Formen sehen aus wie der Artikel mit Spiritus asper und Akzent: **οὗ, ᾧ, ὅν; ἧς, ᾗ, ἥν**.
  grc-third-consonant:
    meaning: "dritte Deklination: konsonantische Stämme"
    intro: |
      Die dritte Deklination hängt ihre Endungen an einen **Stamm**, den der Nominativ oft verbirgt — man findet ihn im **Genitiv**: **φύλαξ, φύλακ-ος** „Wächter“, **ἐλπίς, ἐλπίδ-ος** „Hoffnung“, **σῶμα, σώματ-ος** „Körper“. Endungen: **-ος, -ι, -α / -ν** im Singular; **-ες, -ων, -σι(ν), -ας** im Plural; Neutra **-α** im Nominativ/Akkusativ Plural. Der Dativ Plural **-σι** verbindet sich mit dem Stamm: **φύλαξι**, **σώμασι**.
  grc-third-s:
    meaning: "dritte Deklination: s-Stämme und Kontraktion"
    intro: |
      Stämme auf **-εσ-** verloren ihr σ zwischen Vokalen, und die Vokale **kontrahierten**: **γένος** „Geschlecht, Art“, Stamm γενεσ-, Genitiv \*γένεσος → γένεος → **γένους**, Plural **γένη**. Namen auf **-ης** gehen ebenso: **Σωκράτης, Σωκράτους**. Die unkontrahierten Formen sind ionisch (Herodot, Homer).
  grc-third-adjectives:
    meaning: "Adjektive der dritten Deklination"
    intro: |
      **πᾶς, πᾶσα, πᾶν** „all, jeder“ (Femininum nach der ersten Deklination), **ἀληθής, ἀληθές** „wahr“ (zweiendig, s-Stamm), **εὐδαίμων, εὔδαιμον** „glücklich“ (n-Stamm), **ταχύς, ταχεῖα, ταχύ** „schnell“. Mit Artikel bedeutet **πᾶς** in prädikativer Stellung *alle* (**πάντες οἱ ἄνθρωποι**), in attributiver *ganz* (**ἡ πᾶσα πόλις**).
  grc-contract:
    meaning: "kontrahierte Verben auf -άω, -έω, -όω"
    intro: |
      Stämme auf **α, ε, ο** kontrahieren im Präsens und Imperfekt mit den Endungen: **ποιέω → ποιῶ**, **ποιέεις → ποιεῖς**; **τιμάω → τιμῶ**, **τιμάεις → τιμᾷς**; **δηλόω → δηλῶ**, **δηλόεις → δηλοῖς**. Wörterbücher führen die unkontrahierte Form. In den anderen Tempora wird der Vokal vor dem Suffix gedehnt: **ποιήσω, ἐτίμησα, ἐδήλωσα**.
