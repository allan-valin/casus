# German text of the Ancient Greek course, Reading — translated by AI (Claude) from the English (2026-10-20)
topics:
  Participles and infinitives: "Partizipien und Infinitive"
  Subjunctive and optative: "Konjunktiv und Optativ"
  Further forms: "Weitere Formen"
lessons:
  grc-participle:
    meaning: "Partizipien"
    intro: |
      Das Griechische verwendet Partizipien weit häufiger als das Deutsche. Ein Partizip ist ein Adjektiv des Verbs, mit Tempus (Aspekt) und Genus verbi: **λύων, λύουσα, λῦον** „lösend“, **λύσας, λύσασα, λῦσαν** „gelöst habend“, **λυθείς** „gelöst worden“. Mit Artikel ist es ein Nomen: **οἱ φεύγοντες** „die Fliehenden, die Flüchtlinge“. Ohne Artikel fügt es einen Umstand hinzu — *als, weil, obwohl, wenn* —, den der Kontext entscheidet.
  grc-genitive-absolute:
    meaning: "der Genitivus absolutus"
    intro: |
      Ein Nomen und ein Partizip im **Genitiv**, außerhalb der Grammatik des Hauptsatzes, geben dessen Umstände an — wie der lateinische Ablativus absolutus: **Κύρου βασιλεύοντος** „als Kyros König war“, **ταῦτα εἰπόντος αὐτοῦ** „als er dies gesagt hatte“.
  grc-infinitive:
    meaning: "der Infinitiv; indirekte Rede"
    intro: |
      Infinitive: Präsens **λύειν**, Aorist **λῦσαι**, Futur **λύσειν**, Perfekt **λελυκέναι** (Medium/Passiv **λύεσθαι, λύσασθαι, λυθῆναι**). Mit Artikel ist er ein Nomen: **τὸ μανθάνειν** „das Lernen“.

      Nach Verben des Sagens und Meinens (**φημί, νομίζω, οἴομαι**) steht die berichtete Aussage als **Infinitiv mit Subjekt im Akkusativ** (AcI): **φησὶ τὸν ἄνδρα ἀγαθὸν εἶναι** „er sagt, der Mann sei gut“. (**λέγω** und **οἶδα** bevorzugen **ὅτι** + Indikativ.)
  grc-subjunctive:
    meaning: "der Konjunktiv: Zweck, Aufforderung, Bedingungen"
    intro: |
      Der Konjunktiv hat **lange Themavokale** (**ω / η**): **λύω, λύῃς, λύῃ, λύωμεν, λύητε, λύωσι**. Hauptgebrauch: **Zweck** nach **ἵνα, ὅπως, ὡς** (verneint **μή**): **ἥκομεν ἵνα μάθωμεν** „wir sind gekommen, um zu lernen“; **Aufforderung**: **ἴωμεν** „lasst uns gehen“; Verbot mit Aorist **μὴ ποιήσῃς** „tu es nicht“; und zukünftige Bedingungen mit **ἐάν** (**ἐάν τι ἔχω, δώσω** „wenn ich etwas habe, werde ich es geben“).
  grc-optative:
    meaning: "der Optativ: Wünsche und entfernte Möglichkeit"
    intro: |
      Der Optativ hat **-οι-** (oder **-αι-**, **-ειη-**): **λύοιμι, λύοις, λύοι…**, Aorist **λύσαιμι**. Er drückt **Wünsche** aus (**εἴθε γένοιο** „mögest du werden …“), entfernte **Möglichkeit** mit **ἄν** (**τοῦτο οὐκ ἂν γένοιτο** „das könnte nicht geschehen“), und nach einem Hauptverb der Vergangenheit kann er Konjunktiv oder Indikativ eines Nebensatzes ersetzen.
  grc-conditions:
    meaning: "Bedingungssätze"
    intro: |
      **εἰ** + Indikativ für einfache Bedingungen (**εἰ τοῦτο λέγεις, ἁμαρτάνεις** „wenn du das sagst, irrst du“); **ἐάν** (= εἰ ἄν) + Konjunktiv für zukünftige und allgemeine; **εἰ** + Optativ … **ἄν** + Optativ für die ferne Zukunft („falls er …, würde er …“); **εἰ** + Indikativ der Vergangenheit … **ἄν** + Indikativ der Vergangenheit für Irreales („hätte er …, hätte er …“).
  grc-perfect:
    meaning: "Perfekt und Plusquamperfekt"
    intro: |
      Das Perfekt hat **Reduplikation** (der erste Konsonant + ε: **λέ-λυκα**) und im Aktiv **-κα**: **λέλυκα** „ich habe gelöst“ — ein gegenwärtiger Zustand als Folge einer vergangenen Handlung. Das Plusquamperfekt fügt das Augment hinzu: **ἐλελύκη** „ich hatte gelöst“. Das Perfekt Medium/Passiv hat kein κ: **λέλυμαι**.
  grc-mi-verbs:
    meaning: "Verben auf -μι"
    intro: |
      Eine kleine, sehr häufige Gruppe hängt die Endungen direkt an den Stamm, ohne Themavokal, und redupliziert das Präsens mit **ι**: **δί-δω-μι** „geben“, **τί-θη-μι** „setzen“, **ἵ-στη-μι** „stellen“, **ἵημι** „schicken“, **δείκνυμι** „zeigen“. Der Stammvokal ist im Singular lang und im Plural kurz: **δίδωμι / δίδομεν**.
  grc-imperative:
    meaning: "der Imperativ"
    intro: |
      Präsens-Imperativ **λῦε, λύετε** (andauernde oder allgemeine Aufforderung), Aorist **λῦσον, λύσατε** (eine Handlung). Es gibt auch Formen der 3. Person: **λυέτω** „er soll lösen“. Verbote: **μή** + Präsens-Imperativ oder **μή** + Aorist-**Konjunktiv**: **μὴ λύσῃς**.
  grc-comparison:
    meaning: "Steigerung der Adjektive"
    intro: |
      Regelmäßige Steigerung: **-τερος, -τατος**: **σοφός → σοφώτερος → σοφώτατος** (ω nach kurzer Silbe). Viele häufige Adjektive nehmen **-ίων, -ιστος**: **ἡδύς → ἡδίων → ἥδιστος**; manche sind unregelmäßig: **ἀγαθός → ἀμείνων / βελτίων → ἄριστος / βέλτιστος**, **κακός → κακίων → κάκιστος**, **μέγας → μείζων → μέγιστος**, **πολύς → πλείων → πλεῖστος**. *Als* ist **ἤ** oder der Genitiv: **σοφώτερος ἐμοῦ**.
