# Arabic text of the Ancient Greek course, Beginner — translated by AI (Claude) from the English (2026-10-20)
topics:
  Letters and sounds: "الحروف والأصوات"
  The article and the second declension: "أداة التعريف والتصريف الثاني"
  The first declension: "التصريف الأول"
  The verb: "الفعل"
  Describing and placing: "الوصف والتحديد"
lessons:
  grc-alphabet:
    meaning: "الأبجدية وعلامات النفَس والنبر"
    intro: |
      لليونانية 24 حرفًا. سبعة منها صوائت: **α ε η ι ο υ ω** — **ε / ο** قصيرتان، و**η / ω** نظيرتاهما الطويلتان، و**α ι υ** قد تكون قصيرة أو طويلة. كل كلمة تبدأ بصائت تحمل **علامة نفَس**: **ἀ** (لطيفة، بلا صوت) أو **ἁ** (خشنة، تُنطق هاءً): **ἀγαθός** *أغاثوس*، **ἡμέρα** *هيميرا*. والـ **ρ** في أول الكلمة تحمل دائمًا العلامة الخشنة: **ῥήτωρ**.

      كل كلمة تقريبًا عليها **نبرة** — حادة **ά**، أو ثقيلة **ὰ** (حادة قبل كلمة أخرى)، أو ممدودة **ᾶ** (على الصوائت الطويلة فقط) — تدل على ارتفاع النغمة. والـ **ι** الصغيرة تحت صائت طويل (**ᾳ ῃ ῳ**، *اليوتا المكتتبة*) كانت تُكتب بجانبه في العصر الكلاسيكي ولا تُنطق في النطق المدرسي. والسيغما الأخيرة تُكتب **ς**: **λόγος**.
    mistakes: ["السيغما الأخيرة σ تُكتب ς، وتحتفظ الكلمة بنبرتها."]
  grc-article:
    meaning: "أداة التعريف"
    intro: |
      لليونانية أداة تعريف — **ὁ** (مذكر)، **ἡ** (مؤنث)، **τό** (محايد) — تُصرَّف في كل الحالات والأعداد، ولا أداة تنكير: **ἄνθρωπος** «إنسان»، **ὁ ἄνθρωπος** «الإنسان». تطابق اسمها فتدل على حالته الإعرابية حتى لو كانت نهايته غير مألوفة. وتُستعمل أكثر من الإنجليزية: مع أسماء المعاني (**ἡ ἀρετή** «الفضيلة») ومع الأعلام (**ὁ Σωκράτης**).
  grc-o-declension:
    meaning: "التصريف الثاني (تصريف o)"
    intro: |
      الأسماء المنتهية بـ **-ος** (مذكرة غالبًا: **λόγος** «كلمة»، **ἄνθρωπος** «إنسان») و**-ον** (محايدة: **δῶρον** «هدية»). للمحايد صيغة واحدة للرفع والنصب، و**-α** في الجمع.

      **الحالات**: الرفع/الفاعلية (الفاعل)، الإضافة/الجر (*من، لـ*، وبعد كثير من حروف الجر)، القابلية (*إلى، لـ*، وأيضًا *بـ*)، النصب/المفعولية (المفعول، و*إلى* بعد حروف الحركة)، النداء. والفاعل المحايد الجمع يأخذ عادة فعلًا **مفردًا** — كجمع غير العاقل في العربية: **τὰ δῶρά ἐστι καλά**.
  grc-a-declension:
    meaning: "التصريف الأول (تصريف a)"
    intro: |
      أسماء مؤنثة غالبًا تنتهي بـ **-α** أو **-η**: بعد **ε، ι، ρ** تبقى **α** طويلة في المفرد كله (**χώρα، χώρας** «أرض»)؛ وإلا فـ **η** (**τιμή، τιμῆς** «شرف»). والأسماء المنتهية بـ **-α** القصيرة (**θάλαττα، θαλάττης** «بحر») تأخذ η في الإضافة والقابلية المفردتين. والجمع واحد للجميع: **-αι، -ῶν، -αις، -ᾱς**.

      بعض المذكر ينتهي بـ **-ης / -ᾱς** وإضافته **-ου**: **στρατιώτης، στρατιώτου** «جندي»، **νεανίᾱς** «شاب».
  grc-present:
    meaning: "المضارع الخبري المبني للمعلوم"
    intro: |
      تُذكر الأفعال اليونانية بصيغة **المتكلم المفرد** في المضارع: **λύω** «أحلّ، أطلق». جذر المضارع **λυ-** + الصائت الموضوعي **ο / ε** + اللاحقة الشخصية: **λύ-ο-μεν** «نحلّ». اللواحق تدل على الشخص، فيُحذف الضمير غالبًا. والـ **-ν** في **λύουσι(ν)** تُضاف قبل الصائت أو في آخر الجملة (*النون المتحركة*).
  grc-eimi:
    meaning: "الكينونة"
    intro: |
      **εἰμί** «أكون» شاذ. صيغ مضارعه (عدا **εἶ** «تكون») **ملحقة**: تستند إلى الكلمة قبلها وتفقد نبرتها عادة: **ἀγαθός ἐστιν**. وفي أول الجملة منبورةً تعني **ἔστι** «يوجد» أو «يمكن». والماضي الناقص **ἦ / ἦν، ἦσθα، ἦν…** «كنت».
  grc-adjectives:
    meaning: "صفات التصريفين الأول والثاني؛ الموقع النعتي"
    intro: |
      معظم الصفات تتبع **-ος، -η (أو -ᾱ)، -ον** — المذكر والمحايد مثل λόγος / δῶρον، والمؤنث مثل τιμή / χώρα. وتطابق الاسم في الجنس والعدد والحالة.

      الموقع مهم: بين الأداة والاسم، أو بعد أداة مكررة، تكون الصفة **نعتية** — **ὁ ἀγαθὸς ἀνήρ / ὁ ἀνὴρ ὁ ἀγαθός** «الرجل الصالح»؛ وخارج مجموعة الأداة تكون **خبرية** — **ὁ ἀνὴρ ἀγαθός** «الرجلُ صالحٌ».
  grc-prepositions:
    meaning: "حروف الجر وحالاتها"
    intro: |
      كل حرف جر يطلب حالة معينة، وبعضها يتغير معناه بتغير الحالة:

      - الإضافة: **ἐκ / ἐξ** من داخل، **ἀπό** من، **πρό** قبل، **ἀντί** بدلًا من
      - القابلية: **ἐν** في، **σύν** مع
      - النصب: **εἰς** إلى داخل، **ἀνά** صعودًا
      - أكثر من حالة: **παρά** (إضافة *من عند*، قابلية *بجانب*، نصب *إلى*)، **πρός** (إضافة *من*، قابلية *عند*، نصب *نحو*)، **ἐπί** (إضافة *على*، قابلية *عند*، نصب *ضد*)، **διά** (إضافة *عبر*، نصب *بسبب*)، **μετά** (إضافة *مع*، نصب *بعد*)، **ὑπό** (إضافة *من قِبَل* فاعل، نصب *تحت*)، **κατά**، **περί**، **ὑπέρ**
