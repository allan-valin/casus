# Macedonian text of the Ancient Greek course, Reading — translated by AI (Claude) from the English (2026-10-20)
topics:
  Participles and infinitives: "Партиципи и инфинитиви"
  Subjunctive and optative: "Конјунктив и оптатив"
  Further forms: "Други форми"
lessons:
  grc-participle:
    meaning: "партиципи"
    intro: |
      Грчкиот користи партиципи многу почесто од македонскиот. Партиципот е глаголска придавка, со време (вид) и залог: **λύων, λύουσα, λῦον** „кој одврзува“, **λύσας, λύσασα, λῦσαν** „кој одврзал“, **λυθείς** „одврзан“. Со член е именка: **οἱ φεύγοντες** „оние што бегаат, бегалците“. Без член додава околност — *кога, бидејќи, иако, ако* — што ја одредува контекстот.
  grc-genitive-absolute:
    meaning: "апсолутен генитив"
    intro: |
      Именка и партицип во **генитив**, надвор од граматиката на главната реченица, ги кажуваат нејзините околности — како латинскиот апсолутен аблатив: **Κύρου βασιλεύοντος** „додека Кир беше цар“, **ταῦτα εἰπόντος αὐτοῦ** „откако тој го рече ова“.
  grc-infinitive:
    meaning: "инфинитивот; индиректен говор"
    intro: |
      Инфинитиви: сегашен **λύειν**, аорист **λῦσαι**, иден **λύσειν**, перфект **λελυκέναι** (медиум/пасив **λύεσθαι, λύσασθαι, λυθῆναι**). Со член е именка: **τὸ μανθάνειν** „учењето“.

      По глаголи на кажување и мислење (**φημί, νομίζω, οἴομαι**), пренесениот исказ е **инфинитив со подмет во акузатив**: **φησὶ τὸν ἄνδρα ἀγαθὸν εἶναι** „вели дека човекот е добар“. (**λέγω** и **οἶδα** претпочитаат **ὅτι** + индикатив, како македонското **дека**.)
  grc-subjunctive:
    meaning: "конјунктивот: цел, поттик, услови"
    intro: |
      Конјунктивот има **долги тематски самогласки** (**ω / η**): **λύω, λύῃς, λύῃ, λύωμεν, λύητε, λύωσι**. Главни употреби: **цел** по **ἵνα, ὅπως, ὡς** (одречно **μή**): **ἥκομεν ἵνα μάθωμεν** „дојдовме за да научиме“; **поттик**: **ἴωμεν** „ајде да одиме“; забрана со аорист **μὴ ποιήσῃς** „немој да го правиш тоа“; и идни услови со **ἐάν** (**ἐάν τι ἔχω, δώσω** „ако имам нешто, ќе дадам“).
  grc-optative:
    meaning: "оптативот: желби и далечна можност"
    intro: |
      Оптативот има **-οι-** (или **-αι-**, **-ειη-**): **λύοιμι, λύοις, λύοι…**, аорист **λύσαιμι**. Изразува **желби** (**εἴθε γένοιο** „да станеш…“), далечна **можност** со **ἄν** (**τοῦτο οὐκ ἂν γένοιτο** „ова не би можело да се случи“), а по главен глагол во минато може да го замени конјунктивот или индикативот во зависна реченица.
  grc-conditions:
    meaning: "условни реченици"
    intro: |
      **εἰ** + индикатив за прости услови (**εἰ τοῦτο λέγεις, ἁμαρτάνεις** „ако го велиш ова, грешиш“); **ἐάν** (= εἰ ἄν) + конјунктив за идни и општи; **εἰ** + оптатив … **ἄν** + оптатив за далечна иднина („ако би…, би…“); **εἰ** + минат индикатив … **ἄν** + минат индикатив за нереално („да беше…, ќе беше…“).
  grc-perfect:
    meaning: "перфект и плусквамперфект"
    intro: |
      Перфектот има **редупликација** (првата согласка + ε: **λέ-λυκα**) и во активот **-κα**: **λέλυκα** „имам одврзано“ — сегашна состојба како последица на минато дејство, многу слично на македонското **имам направено**. Плусквамперфектот додава аугмент: **ἐλελύκη** „имав одврзано“. Перфектот медиум/пасив нема κ: **λέλυμαι**.
  grc-mi-verbs:
    meaning: "глаголи на -μι"
    intro: |
      Мала, многу честа група ги додава наставките директно на основата, без тематска самогласка, и го редуплицира сегашното со **ι**: **δί-δω-μι** „давам“, **τί-θη-μι** „ставам“, **ἵ-στη-μι** „поставувам“, **ἵημι** „праќам“, **δείκνυμι** „покажувам“. Самогласката на основата е долга во еднина и кратка во множина: **δίδωμι / δίδομεν**.
  grc-imperative:
    meaning: "заповедниот начин"
    intro: |
      Сегашен императив **λῦε, λύετε** (трајна или општа заповед), аорист **λῦσον, λύσατε** (едно дејство) — исто како македонскиот несвршен и свршен вид. Има и форми за 3 лице: **λυέτω** „нека одврзе“. Забрани: **μή** + сегашен императив, или **μή** + аорист **конјунктив**: **μὴ λύσῃς**.
  grc-comparison:
    meaning: "споредување на придавките"
    intro: |
      Правилно споредување: **-τερος, -τατος**: **σοφός → σοφώτερος → σοφώτατος** (ω по краток слог). Многу чести придавки земаат **-ίων, -ιστος**: **ἡδύς → ἡδίων → ἥδιστος**; некои се неправилни: **ἀγαθός → ἀμείνων / βελτίων → ἄριστος / βέλτιστος**, **κακός → κακίων → κάκιστος**, **μέγας → μείζων → μέγιστος**, **πολύς → πλείων → πλεῖστος**. *Од* (во споредба) е **ἤ** или генитивот: **σοφώτερος ἐμοῦ**.
