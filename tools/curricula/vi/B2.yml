id: B2
topics:

- title: {en: Politeness, pt: Cortesia}
  lessons:
  - id: vi-politeness
    title: ạ, dạ, vâng, ơi
    meaning: {en: "politeness particles", pt: "partículas de cortesia"}
    intro:
      en: |
        **ạ** at the end of a sentence makes it respectful (**Cháu chào bà ạ** — hello, grandma), **dạ / vâng** is a polite *yes*, **ơi** calls someone (**Anh ơi!** excuse me!). Choosing the right kin word for *I* and *you* is the heart of politeness.
      pt: |
        **ạ** no fim da frase a torna respeitosa (**Cháu chào bà ạ** — bom dia, vovó), **dạ / vâng** é um *sim* educado, **ơi** chama alguém (**Anh ơi!** com licença!). Escolher a palavra de parentesco certa para *eu* e *você* é o coração da cortesia.
    examples:
    - ["Cháu chào bà ạ.", "Hello, grandma.", "Bom dia, vovó.", "ạ"]
    match: {seq: [{word: [ạ, dạ, vâng, ơi]}]}
    pool: [ạ, dạ, vâng, ơi]
