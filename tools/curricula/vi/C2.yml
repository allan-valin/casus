id: C2
topics:

- title: {en: Literature and regions, pt: Literatura e regiões}
  lessons:
  - id: vi-kieu
    title: Truyện Kiều, chữ Nôm, Bắc / Nam
    meaning: {en: "Nguyễn Du, the old script, north and south", pt: "Nguyễn Du, a escrita antiga, norte e sul"}
    intro:
      en: |
        Nguyễn Du's *Truyện Kiều* (early 19th c.) in six-eight verse is the national poem; it was first written in **chữ Nôm**, a Chinese-based script, before the Latin **chữ Quốc ngữ** took over in the 20th century. Northern (Hà Nội) and southern (Sài Gòn) speech differ in tones and some words (**bát / chén** bowl).
      pt: |
        *Truyện Kiều* (início do séc. XIX), de Nguyễn Du, em versos de seis-oito, é o poema nacional; foi escrito primeiro em **chữ Nôm**, uma escrita de base chinesa, antes que o alfabeto latino **chữ Quốc ngữ** se impusesse no séc. XX. A fala do norte (Hanói) e a do sul (Saigon) diferem nos tons e em algumas palavras (**bát / chén** tigela).
    examples:
    - ["Trăm năm trong cõi người ta.", "A hundred years in this life of ours.", "Cem anos neste mundo dos homens.", "Trăm"]
    match: {seq: [{word: [trăm, năm, chữ, thơ, truyện]}]}
    pool: [chữ, thơ, truyện]
