id: B1
topics:

- title: {en: Clauses, pt: Orações}
  lessons:
  - id: vi-clauses
    title: mà, nếu … thì, vì … nên, khi
    meaning: {en: "joining clauses", pt: "ligando orações"}
    intro:
      en: |
        **mà** (which; but): **quyển sách mà tôi mua** (the book that I bought). Pairs: **nếu … thì** (if … then), **vì … nên** (because … so), **tuy … nhưng** (although … still), **khi** (when): **Nếu trời mưa thì chúng tôi ở nhà.**
      pt: |
        **mà** (que; mas): **quyển sách mà tôi mua** (o livro que comprei). Pares: **nếu … thì** (se … então), **vì … nên** (porque … por isso), **tuy … nhưng** (embora … ainda assim), **khi** (quando): **Nếu trời mưa thì chúng tôi ở nhà** (se chover, ficamos em casa).
    examples:
    - ["Nếu trời mưa thì chúng tôi ở nhà.", "If it rains we stay at home.", "Se chover, ficamos em casa.", "Nếu"]
    match: {seq: [{word: [mà, nếu, thì, vì, nên, tuy, nhưng, khi]}]}
    pool: [mà, nếu, thì, vì, nên, nhưng, khi]
