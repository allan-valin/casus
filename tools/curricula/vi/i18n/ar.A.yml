# Arabic text of the Vietnamese course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and tones: "الأصوات والنغمات"
  Pronouns and sentences: "الضمائر والجمل"
  Time and questions: "الزمن والأسئلة"
  Verbs in series: "الأفعال المتتابعة"
  Clauses: "الجمل"
  Politeness: "الأدب"
  Learned words: "الكلمات المثقّفة"
  Literature and regions: "الأدب والأقاليم"
lessons:
  vi-tones:
    meaning: "ست نغمات مكتوبة على الحركة"
    intro: |
      للفيتنامية ست نغمات تُكتب فوق الحركة أو تحتها، وهي تغيّر الكلمة: **ma** (شبح)، **mà** (لكن)، **má** (خدّ، أمّ)، **mả** (قبر)، **mã** (حصان)، **mạ** (شتلة أرز). وحروف إضافية: **ă â ê ô ơ ư** حركات أخرى، و**đ** دال، و**d** و**gi** زاي (في الشمال) أو ياء (في الجنوب).
  vi-words:
    meaning: "كلمات من عدّة مقاطع"
    intro: |
      يُكتب كل مقطع منفصلًا، لكن كثيرًا من الكلمات من مقطعين أو ثلاثة: **học sinh** (تلميذ: «يتعلّم» + «ناشئ»)، **bệnh viện** (مستشفى)، **Việt Nam**. والقارئ يجمعها من المعجم. وأكثرها مبنيّ من مقاطع صينية الأصل، كالجذور اللاتينية والإغريقية في اللغات الأوروبية.
  vi-pronouns:
    meaning: "الضمائر كلمات قرابة"
    intro: |
      **tôi** (أنا، محايدة)، **bạn** (أنت، صديق)؛ لكن الناس غالبًا يتخاطبون كأقارب بحسب العمر: **anh** (أخ أكبر: رجل أكبر قليلًا)، **chị** (أخت كبرى)، **em** (أخ أو أخت أصغر)، **ông / bà** (جدّ / جدّة: لكبار السن)، **cô / chú** (عمّة / عمّ). والجمع بـ**chúng** أو **các**: **chúng tôi** (نحن بدونك)، **chúng ta** (نحن معك)، **các bạn** (أنتم)، **họ** (هم).
  vi-la:
    meaning: "الكون (là)، الملكية والوجود (có)، الوجود في مكان (ở)"
    intro: |
      **là** تربط اسمين: **Tôi là học sinh** (أنا تلميذ). والصفات لا تحتاج فعلًا: **Trời đẹp** (الجو جميل). **có** = يملك ويوجد: **Tôi có một em gái** (لي أخت صغرى)، **Ở đây có quán cà phê** (هنا مقهى). و**ở** = يوجد في، يسكن: **Tôi ở Hà Nội** (أسكن في هانوي).
  vi-order:
    meaning: "الوصف يتبع الموصوف؛ của"
    intro: |
      الصفات والمالكون بعد الاسم، كالعربية: **nhà to** (بيت كبير)، **sách của tôi** أو **sách tôi** (كتابي). والترتيب فاعل – فعل – مفعول: **Tôi đọc sách** (أقرأ الكتب). والمصنِّفات قبل الأسماء المعدودة: **một quyển sách** (كتاب واحد)، **hai con mèo** (قطّتان).
  vi-time:
    meaning: "كلمات الزمن بدل الأزمنة"
    intro: |
      الفعل لا يتغيّر أبدًا: **đã** (الماضي)، **đang** (الاستمرار)، **sẽ** (المستقبل)، **rồi** (قد، في آخر الجملة)، **chưa** (لم … بعد): **Tôi đã ăn rồi** (قد أكلت)، **Tôi đang đọc sách** (أقرأ الآن)، **Mai tôi sẽ đi** (سأذهب غدًا). وكثيرًا ما يكفي السياق فتُحذف.
  vi-questions:
    meaning: "أدوات الاستفهام؛ … không?"
    intro: |
      **gì** (ماذا)، **ai** (من)، **đâu** (أين)، **khi nào / bao giờ** (متى)، **tại sao / vì sao** (لماذا)، **thế nào** (كيف)، **bao nhiêu** (كم) — في موضع الجواب: **Bạn tên là gì?** (ما اسمك؟). ونعم/لا: **có … không?**: **Bạn có nói tiếng Anh không?** (هل تتكلّم الإنجليزية؟). والنفي **không** قبل الفعل: **Tôi không hiểu** (لا أفهم).
  vi-serial:
    meaning: "أفعال متتابعة؛ cho = أعطى، لأجل"
    intro: |
      تتتابع الأفعال بلا *و* ولا *أن*: **đi mua sách** (يذهب ليشتري كتبًا)، **mang về nhà** (يحمل إلى البيت). و**cho** تعني *أعطى* و*لأجل*: **Tôi cho bạn một món quà** (أعطيك هدية)، **Mẹ nấu cơm cho con** (تطبخ الأم للطفل). والمجهول بـ**bị** (للمكروه) و**được** (للمحبوب): **Tôi bị phạt** (عوقبت)، **Tôi được khen** (مُدحت).
  vi-clauses:
    meaning: "ربط الجمل"
    intro: |
      **mà** (الذي؛ لكن): **quyển sách mà tôi mua** (الكتاب الذي اشتريته). وأزواج: **nếu … thì** (إذا … فـ)، **vì … nên** (لأنّ … لذلك)، **tuy … nhưng** (مع أنّ … إلا أنّ)، **khi** (عندما): **Nếu trời mưa thì chúng tôi ở nhà** (إن أمطرت بقينا في البيت).
  vi-politeness:
    meaning: "أدوات الأدب"
    intro: |
      **ạ** في آخر الجملة تجعلها مهذّبة (**Cháu chào bà ạ** — مرحبًا يا جدّتي)، و**dạ / vâng** *نعم* المهذّبة، و**ơi** للنداء (**Anh ơi!** لو سمحت!). واختيار كلمة القرابة المناسبة لـ*أنا* و*أنت* هو قلب الأدب.
  vi-sino:
    meaning: "المفردات الصينية الفيتنامية"
    intro: |
      أكثر الكلمات المثقّفة صينية فيتنامية، مبنية من مقاطع صينية الأصل: **tự do** (حرّية)، **bình đẳng** (مساواة)، **phát triển** (تنمية)، **khoa học** (علم)، **giáo dục** (تعليم). ومن عرف مقطعًا (**học** تعلّم: **học sinh, khoa học, đại học**) فتح كلمات كثيرة.
  vi-kieu:
    meaning: "نغوين دو، الخط القديم، الشمال والجنوب"
    intro: |
      *Truyện Kiều* (أوائل القرن التاسع عشر) لنغوين دو، بأبيات السداسي الثماني، هي القصيدة الوطنية؛ كُتبت أولًا بـ**chữ Nôm**، خط مبنيّ على الصينية، قبل أن يسود الخط اللاتيني **chữ Quốc ngữ** في القرن العشرين. ويختلف كلام الشمال (هانوي) والجنوب (سايغون) في النغمات وبعض الكلمات (**bát / chén** وعاء).
