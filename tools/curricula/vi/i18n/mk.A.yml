# Macedonian text of the Vietnamese course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and tones: "Гласови и тонови"
  Pronouns and sentences: "Заменки и реченици"
  Time and questions: "Време и прашања"
  Verbs in series: "Глаголи во низа"
  Clauses: "Реченици"
  Politeness: "Учтивост"
  Learned words: "Учени зборови"
  Literature and regions: "Литература и региони"
lessons:
  vi-tones:
    meaning: "шест тонови, означени на самогласката"
    intro: |
      Виетнамскиот има шест тонови, напишани над или под самогласката, и тие го менуваат зборот: **ma** (дух), **mà** (но), **má** (образ, мајка), **mả** (гроб), **mã** (коњ), **mạ** (оризов расад). Дополнителни букви: **ă â ê ô ơ ư** се други самогласки, **đ** е *д*, **d** и **gi** се *з* (север) или *ј* (југ).
  vi-words:
    meaning: "зборови од повеќе слогови"
    intro: |
      Секој слог се пишува одделно, но многу зборови имаат два или три: **học sinh** (ученик: „учи“ + „питомец“), **bệnh viện** (болница), **Việt Nam**. Читачот ги спојува од речникот. Повеќето се градени од слогови од кинеско потекло, како латинските и грчките корени во европските јазици.
  vi-pronouns:
    meaning: "заменките се зборови за роднини"
    intro: |
      **tôi** (јас, неутрално), **bạn** (ти, пријател); но најчесто луѓето се обраќаат еден на друг како роднини според возраста: **anh** (постар брат: малку постар маж), **chị** (постара сестра), **em** (помало браче/сестриче), **ông / bà** (дедо / баба: постари луѓе), **cô / chú** (тетка / чичко). Множина со **chúng** или **các**: **chúng tôi** (ние, без тебе), **chúng ta** (ние, со тебе), **các bạn** (вие), **họ** (тие).
  vi-la:
    meaning: "сум (là), имам и има (có), се наоѓам (ở)"
    intro: |
      **là** поврзува две именки: **Tôi là học sinh** (ученик сум). Придавките немаат потреба од глагол: **Trời đẹp** (времето е убаво). **có** = имам и има: **Tôi có một em gái** (имам помала сестра), **Ở đây có quán cà phê** (тука има кафуле). **ở** = се наоѓам, живеам: **Tôi ở Hà Nội** (живеам во Ханој).
  vi-order:
    meaning: "определбата доаѓа по именката; của"
    intro: |
      Придавките и сопствениците доаѓаат по именката: **nhà to** (голема куќа), **sách của tôi** или **sách tôi** (мојата книга). Подмет – глагол – објект: **Tôi đọc sách** (читам книги). Класификаторите стојат пред бројните именки: **một quyển sách** (една книга), **hai con mèo** (две мачки).
  vi-time:
    meaning: "зборови за време наместо времиња"
    intro: |
      Глаголите никогаш не се менуваат: **đã** (минато), **đang** (во тек), **sẽ** (иднина), **rồi** (веќе, на крајот), **chưa** (уште не): **Tôi đã ăn rồi** (веќе јадев), **Tôi đang đọc sách** (читам сега), **Mai tôi sẽ đi** (утре ќе одам). Често контекстот е доволен и тие се изоставаат.
  vi-questions:
    meaning: "прашални зборови; … không?"
    intro: |
      **gì** (што), **ai** (кој), **đâu** (каде), **khi nào / bao giờ** (кога), **tại sao / vì sao** (зошто), **thế nào** (како), **bao nhiêu** (колку) — стојат таму каде што би бил одговорот: **Bạn tên là gì?** (како се викаш?). Да/не: **có … không?**: **Bạn có nói tiếng Anh không?** (зборуваш ли англиски?). Негација: **không** пред глаголот: **Tôi không hiểu** (не разбирам).
  vi-serial:
    meaning: "глаголи во низа; cho = дава, за"
    intro: |
      Глаголите следат еден по друг без *и* или *да*: **đi mua sách** (оди да купи книги), **mang về nhà** (носи дома). **cho** значи *дава* и *за*: **Tôi cho bạn một món quà** (ти давам подарок), **Mẹ nấu cơm cho con** (мајката готви за детето). Пасив со **bị** (лоши работи) и **được** (добри работи): **Tôi bị phạt** (бев казнет), **Tôi được khen** (бев пофален).
  vi-clauses:
    meaning: "поврзување реченици"
    intro: |
      **mà** (што, кој; но): **quyển sách mà tôi mua** (книгата што ја купив). Парови: **nếu … thì** (ако … тогаш), **vì … nên** (зашто … затоа), **tuy … nhưng** (иако … сепак), **khi** (кога): **Nếu trời mưa thì chúng tôi ở nhà** (ако врне, остануваме дома).
  vi-politeness:
    meaning: "честички за учтивост"
    intro: |
      **ạ** на крајот на реченицата ја прави почитлива (**Cháu chào bà ạ** — добар ден, бабо), **dạ / vâng** е учтиво *да*, **ơi** повикува некого (**Anh ơi!** извинете!). Изборот на вистинскиот роднински збор за *јас* и *ти* е срцето на учтивоста.
  vi-sino:
    meaning: "синовиетнамски речник"
    intro: |
      Повеќето учени зборови се синовиетнамски, градени од слогови од кинеско потекло: **tự do** (слобода), **bình đẳng** (еднаквост), **phát triển** (развој), **khoa học** (наука), **giáo dục** (образование). Кога знаеш еден слог (**học** учи: **học sinh, khoa học, đại học**), отклучуваш многу зборови.
  vi-kieu:
    meaning: "Нгујен Ду, старото писмо, север и југ"
    intro: |
      *Truyện Kiều* (почеток на 19 век) од Нгујен Ду, во шест-осум стихови, е националната поема; најпрвин е напишана на **chữ Nôm**, писмо на кинеска основа, пред латиничното **chữ Quốc ngữ** да превладее во 20 век. Северниот (Ханој) и јужниот (Сајгон) говор се разликуваат по тоновите и по некои зборови (**bát / chén** чинија).
