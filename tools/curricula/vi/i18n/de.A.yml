# German text of the Vietnamese course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and tones: "Laute und Töne"
  Pronouns and sentences: "Pronomen und Sätze"
  Time and questions: "Zeit und Fragen"
  Verbs in series: "Verbreihen"
  Clauses: "Nebensätze"
  Politeness: "Höflichkeit"
  Learned words: "Gelehrte Wörter"
  Literature and regions: "Literatur und Regionen"
lessons:
  vi-tones:
    meaning: "sechs Töne, am Vokal bezeichnet"
    intro: |
      Vietnamesisch hat sechs Töne, über oder unter dem Vokal geschrieben, und sie ändern das Wort: **ma** (Gespenst), **mà** (aber), **má** (Wange, Mutter), **mả** (Grab), **mã** (Pferd), **mạ** (Reissetzling). Zusätzliche Buchstaben: **ă â ê ô ơ ư** sind weitere Vokale, **đ** ist *d*, **d** und **gi** sind *s* (stimmhaft, Norden) oder *j* (Süden).
  vi-words:
    meaning: "mehrsilbige Wörter"
    intro: |
      Jede Silbe wird getrennt geschrieben, aber viele Wörter haben zwei oder drei: **học sinh** (Schüler: „lernen“ + „Zögling“), **bệnh viện** (Krankenhaus), **Việt Nam**. Der Leser fügt sie aus dem Wörterbuch zusammen. Die meisten sind aus Silben chinesischen Ursprungs gebaut, wie lateinische und griechische Wurzeln im Deutschen.
  vi-pronouns:
    meaning: "Pronomen sind Verwandtschaftswörter"
    intro: |
      **tôi** (ich, neutral), **bạn** (du, Freund); meist aber spricht man einander wie Verwandte nach dem Alter an: **anh** (älterer Bruder: ein etwas älterer Mann), **chị** (ältere Schwester), **em** (jüngeres Geschwister), **ông / bà** (Großvater / Großmutter: ältere Leute), **cô / chú** (Tante / Onkel). Plural mit **chúng** oder **các**: **chúng tôi** (wir, ohne dich), **chúng ta** (wir, mit dir), **các bạn** (ihr), **họ** (sie).
  vi-la:
    meaning: "sein (là), haben und es gibt (có), sich befinden (ở)"
    intro: |
      **là** verbindet zwei Nomen: **Tôi là học sinh** (ich bin Schüler). Adjektive brauchen kein Verb: **Trời đẹp** (das Wetter ist schön). **có** = haben und es gibt: **Tôi có một em gái** (ich habe eine jüngere Schwester), **Ở đây có quán cà phê** (hier gibt es ein Café). **ở** = sich befinden, wohnen: **Tôi ở Hà Nội** (ich wohne in Hanoi).
  vi-order:
    meaning: "das Bestimmende folgt; của"
    intro: |
      Adjektive und Besitzer stehen nach dem Nomen: **nhà to** (ein großes Haus), **sách của tôi** oder **sách tôi** (mein Buch). Subjekt – Verb – Objekt: **Tôi đọc sách** (ich lese Bücher). Zählwörter stehen vor gezählten Nomen: **một quyển sách** (ein Buch), **hai con mèo** (zwei Katzen).
  vi-time:
    meaning: "Zeitwörter statt Tempora"
    intro: |
      Verben ändern sich nie: **đã** (Vergangenheit), **đang** (im Verlauf), **sẽ** (Zukunft), **rồi** (schon, am Ende), **chưa** (noch nicht): **Tôi đã ăn rồi** (ich habe schon gegessen), **Tôi đang đọc sách** (ich lese gerade), **Mai tôi sẽ đi** (morgen gehe ich). Oft genügt der Zusammenhang, und sie fallen weg.
  vi-questions:
    meaning: "Fragewörter; … không?"
    intro: |
      **gì** (was), **ai** (wer), **đâu** (wo), **khi nào / bao giờ** (wann), **tại sao / vì sao** (warum), **thế nào** (wie), **bao nhiêu** (wie viel) — sie stehen dort, wo die Antwort stünde: **Bạn tên là gì?** (wie heißt du?). Ja/Nein: **có … không?**: **Bạn có nói tiếng Anh không?** (sprichst du Englisch?). Verneinung: **không** vor dem Verb: **Tôi không hiểu** (ich verstehe nicht).
  vi-serial:
    meaning: "Verben in Reihe; cho = geben, für"
    intro: |
      Verben folgen einander ohne *und* oder *zu*: **đi mua sách** (Bücher kaufen gehen), **mang về nhà** (nach Hause bringen). **cho** heißt *geben* und *für*: **Tôi cho bạn một món quà** (ich gebe dir ein Geschenk), **Mẹ nấu cơm cho con** (die Mutter kocht für das Kind). Passiv mit **bị** (Unangenehmes) und **được** (Angenehmes): **Tôi bị phạt** (ich wurde bestraft), **Tôi được khen** (ich wurde gelobt).
  vi-clauses:
    meaning: "Sätze verbinden"
    intro: |
      **mà** (der, welcher; aber): **quyển sách mà tôi mua** (das Buch, das ich gekauft habe). Paare: **nếu … thì** (wenn … dann), **vì … nên** (weil … deshalb), **tuy … nhưng** (obwohl … doch), **khi** (als, wenn): **Nếu trời mưa thì chúng tôi ở nhà** (wenn es regnet, bleiben wir zu Hause).
  vi-politeness:
    meaning: "Höflichkeitspartikeln"
    intro: |
      **ạ** am Satzende macht den Satz respektvoll (**Cháu chào bà ạ** — guten Tag, Oma), **dạ / vâng** ist ein höfliches *ja*, **ơi** ruft jemanden (**Anh ơi!** Entschuldigung!). Das richtige Verwandtschaftswort für *ich* und *du* zu wählen ist das Herz der Höflichkeit.
  vi-sino:
    meaning: "sinovietnamesischer Wortschatz"
    intro: |
      Die meisten gelehrten Wörter sind sinovietnamesisch, aus Silben chinesischen Ursprungs: **tự do** (Freiheit), **bình đẳng** (Gleichheit), **phát triển** (Entwicklung), **khoa học** (Wissenschaft), **giáo dục** (Bildung). Wer eine Silbe kennt (**học** lernen: **học sinh, khoa học, đại học**), erschließt viele Wörter.
  vi-kieu:
    meaning: "Nguyễn Du, die alte Schrift, Norden und Süden"
    intro: |
      Nguyễn Dus *Truyện Kiều* (frühes 19. Jh.) in Sechs-Acht-Versen ist das Nationalgedicht; es wurde zuerst in **chữ Nôm** geschrieben, einer Schrift auf chinesischer Grundlage, bevor im 20. Jahrhundert das lateinische **chữ Quốc ngữ** sich durchsetzte. Nördliche (Hà Nội) und südliche (Sài Gòn) Rede unterscheiden sich in Tönen und manchen Wörtern (**bát / chén** Schale).
