id: C1
topics:

- title: {en: Learned words, pt: Palavras eruditas}
  lessons:
  - id: vi-sino
    title: tự do, bình đẳng, phát triển
    meaning: {en: "Sino-Vietnamese vocabulary", pt: "vocabulário sino-vietnamita"}
    intro:
      en: |
        Most learned words are Sino-Vietnamese, built from Chinese-origin syllables: **tự do** (freedom), **bình đẳng** (equality), **phát triển** (development), **khoa học** (science), **giáo dục** (education). Knowing a syllable (**học** study: **học sinh, khoa học, đại học**) unlocks many words.
      pt: |
        A maioria das palavras cultas é sino-vietnamita, formada com sílabas de origem chinesa: **tự do** (liberdade), **bình đẳng** (igualdade), **phát triển** (desenvolvimento), **khoa học** (ciência), **giáo dục** (educação). Conhecer uma sílaba (**học** estudar: **học sinh, khoa học, đại học**) abre muitas palavras.
    examples:
    - ["Tự do là quyền của mọi người.", "Freedom is everyone's right.", "A liberdade é um direito de todos.", "Tự do"]
    match: {seq: [{word: ["tự do", "bình đẳng", "phát triển", "khoa học", "giáo dục", "đại học"]}]}
    pool: [tự do, khoa học, giáo dục]
