id: A2
topics:

- title: {en: Verbs in series, pt: Verbos em série}
  lessons:
  - id: vi-serial
    title: đi mua, mang về, cho
    meaning: {en: "verbs in a row; cho = give, for", pt: "verbos em sequência; cho = dar, para"}
    intro:
      en: |
        Verbs follow one another without *and* or *to*: **đi mua sách** (go buy books), **mang về nhà** (bring home). **cho** is *give* and *for / to*: **Tôi cho bạn một món quà** (I give you a present), **Mẹ nấu cơm cho con** (mother cooks for the child). Passive with **bị** (bad things) and **được** (good things): **Tôi bị phạt**, **Tôi được khen**.
      pt: |
        Os verbos se seguem sem *e* nem *para*: **đi mua sách** (ir comprar livros), **mang về nhà** (trazer para casa). **cho** é *dar* e *para*: **Tôi cho bạn một món quà** (dou-lhe um presente), **Mẹ nấu cơm cho con** (a mãe cozinha para o filho). Passiva com **bị** (coisas ruins) e **được** (coisas boas): **Tôi bị phạt** (fui castigado), **Tôi được khen** (fui elogiado).
    examples:
    - ["Tôi cho bạn một món quà.", "I give you a present.", "Dou-lhe um presente.", "cho"]
    match: {seq: [{word: [cho, bị, được]}]}
    pool: [cho, bị, được]
