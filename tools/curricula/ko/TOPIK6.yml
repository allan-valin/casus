id: TOPIK 6
title: {en: TOPIK 6, pt: TOPIK 6}
topics:

- title: {en: Advanced expressions, pt: Expressões avançadas}
  lessons:
  - id: ko-advanced-expressions
    title: -기 마련이다, -(으)ㄹ수록, -는 셈이다
    meaning: {en: "advanced expressions: bound to, the more…the more, as good as", pt: "expressões avançadas: é natural que, quanto mais…mais, é como se"}
    intro:
      en: |
        - **-기 마련이다** "it's natural that, bound to": **사람은 실수하기 마련이에요**
        - **-(으)ㄹ수록** "the more … the more": **많이 할수록 잘해요**
        - **-는 셈이다** "it amounts to, practically": **거의 다 한 셈이에요**
        - **-(으)ㄹ 뿐이다** "only, nothing but": **최선을 다했을 뿐이에요**
        - **-는 법이다** "that's how it is": **노력하면 성공하는 법이에요**
      pt: |
        - **-기 마련이다** "é natural que, é de esperar": **사람은 실수하기 마련이에요**
        - **-(으)ㄹ수록** "quanto mais … mais": **많이 할수록 잘해요**
        - **-는 셈이다** "equivale a, praticamente": **거의 다 한 셈이에요**
        - **-(으)ㄹ 뿐이다** "apenas, nada mais que": **최선을 다했을 뿐이에요**
        - **-는 법이다** "é assim que é": **노력하면 성공하는 법이에요**
    examples:
    - [사람은 실수하기 마련이에요., People are bound to make mistakes., É natural as pessoas errarem., 마련이에요]
    match: [{seq: [{word: [마련이다, 마련이에요, 마련입니다, 마련이야, 셈이다, 셈이에요, 셈이야, 셈입니다, 뿐이다, 뿐이에요, 뿐이야, 뿐입니다, 법이다, 법이에요, 법이야, 탓이다, 탓에, 탓이에요]}]}, {seq: [{re: "수록$"}], pool: [할수록, 갈수록, 볼수록, 먹을수록, 생각할수록, 많을수록]}]
    pool: [마련이다, 셈이다, 뿐이다, 법이다, 탓이다, 만큼, 대로, 바]
