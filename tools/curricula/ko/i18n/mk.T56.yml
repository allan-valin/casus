# Macedonian text of the Korean course, TOPIK 5–6 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Formal style: "Официјален стил"
  Advanced expressions: "Напредни изрази"
lessons:
  ko-formal:
    meaning: "официјалниот стил: вести, говори, услуги"
    intro: |
      **-습니다 / -ㅂ니다** (изјави), **-습니까 / -ㅂ니까** (прашања), **-십시오** (барања), **-ㅂ시다** (ајде да) — официјалниот учтив стил на соопштенија, вести, презентации и услуги: **감사합니다**, **어디에 가십니까?**, **앉으십시오**.
  ko-nominalizer-eum:
    meaning: "-(으)ㅁ: именки од глаголи во пишувањето"
    intro: |
      **-(으)ㅁ** прави именка од глагол или придавка, во известувања, белешки и официјални текстови: **조용히 함** „тишина“, **회의가 있음** „има состанок“, **그가 범인임이 밝혀졌다** „се откри дека тој е сторителот“.
  ko-advanced-expressions:
    meaning: "напредни изрази: мора да се случи, колку повеќе … толку, практично"
    intro: |
      - **-기 마련이다** „природно е, неизбежно“: **사람은 실수하기 마련이에요** „Човек греши, тоа е природно“
      - **-(으)ㄹ수록** „колку повеќе … толку“: **많이 할수록 잘해요** „Колку повеќе вежбаш, толку подобро“
      - **-는 셈이다** „практично е, излегува дека“: **거의 다 한 셈이에요** „Речиси е готово“
      - **-(으)ㄹ 뿐이다** „само, ништо друго освен“: **최선을 다했을 뿐이에요** „Само дадов се од себе“
      - **-는 법이다** „така е тоа“: **노력하면 성공하는 법이에요** „Кој се труди, успева“
