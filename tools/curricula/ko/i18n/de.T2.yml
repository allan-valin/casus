# German text of the Korean course, TOPIK 2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Describing with verbs: "Mit Verben beschreiben"
  Politeness and nuance: "Höflichkeit und Nuancen"
lessons:
  ko-adnominal:
    meaning: "Verben vor Nomen: der tut, der tat, der tun wird"
    intro: |
      Koreanisch stellt einen beschreibenden Satz **vor** das Nomen, mit einer besonderen Endung am Verb: Präsens **-는** (**먹는 사람** „der Mensch, der isst“), Vergangenheit **-(으)ㄴ** (**먹은 사람** „der Mensch, der aß“), Futur **-(으)ㄹ** (**먹을 음식** „Essen zum Essen“). Adjektive nehmen im Präsens **-(으)ㄴ**: **예쁜 꽃** „eine schöne Blume“.
  ko-progressive:
    meaning: "gerade tun: -고 있다"
    intro: |
      Stamm + **-고 있어요** für eine laufende Handlung: **책을 읽고 있어요** „Ich lese gerade ein Buch“. Die Höflichkeitsform ist **-고 계세요**.
  ko-try:
    meaning: "versuchen: -아/어 보다"
    intro: |
      **-아 / -어** + **보다** „(mal) versuchen“: **먹어 봐요** „Probier mal“, **한국에 가 봤어요** „Ich war schon in Korea (habe es versucht)“.
  ko-must:
    meaning: "müssen: -아야/어야 하다"
    intro: |
      Stamm + **-아야 / -어야 해요** (oder **돼요**) „müssen“: **가야 해요** „Ich muss gehen“, **공부해야 돼요** „Ich muss lernen“.
  ko-can:
    meaning: "können: -(으)ㄹ 수 있다/없다"
    intro: |
      Stamm + **-(으)ㄹ 수 있어요** „können“, **-(으)ㄹ 수 없어요** „nicht können“: **한국어를 할 수 있어요** „Ich kann Koreanisch“; **지금은 갈 수 없어요** „Ich kann jetzt nicht gehen“.
  ko-intent:
    meaning: "um zu: -(으)려고, -(으)러 가다"
    intro: |
      **-(으)러** + ein Verb des Gehens oder Kommens gibt den Zweck der Bewegung: **밥 먹으러 가요** „Ich gehe essen“. **-(으)려고** gibt eine Absicht bei jedem Verb: **한국어를 배우려고 책을 샀어요** „Ich habe ein Buch gekauft, um Koreanisch zu lernen“.
  ko-honorific:
    meaning: "Honorifikum -(으)시-: Respekt vor dem Subjekt"
    intro: |
      **-(으)시-** nach dem Stamm zeigt Respekt vor dem **Subjekt**: **선생님이 오세요** „Der Lehrer kommt“, **어머니가 주무셨어요** „Mutter hat geschlafen“. Im höflichen Stil erscheint es als **-(으)세요**, in der Vergangenheit **-(으)셨어요**. Manche Verben haben eigene Höflichkeitsformen: **먹다 → 드시다**, **자다 → 주무시다**, **있다 → 계시다**.
  ko-background:
    meaning: "Hintergrund, Kontrast: -는데 / -(으)ㄴ데"
    intro: |
      **-는데** (Verben) / **-(으)ㄴ데** (Adjektive) bereitet das Folgende vor oder mildert einen Gegensatz: **비가 오는데 우산이 없어요** „Es regnet, und ich habe keinen Schirm“; **맛있는데 비싸요** „Es ist lecker, aber teuer“.
  ko-even:
    meaning: "selbst wenn: -아도/어도"
    intro: |
      Stamm + **-아도 / -어도** „selbst wenn, obwohl“: **비가 와도 가요** „Ich gehe, selbst wenn es regnet“. Mit **되다** fragt oder gibt es Erlaubnis: **들어가도 돼요?** „Darf ich hineingehen?“
  ko-nominal:
    meaning: "-기 (Tun als Nomen) und -게 (sodass, Adverb)"
    intro: |
      **-기** macht aus einem Verb eine Nominalphrase: **수영하기를 좋아해요** „Ich schwimme gern“, **한국어는 배우기 쉬워요** „Koreanisch ist leicht zu lernen“. **-게** bildet ein Adverb oder ein Ergebnis: **예쁘게** „hübsch“, **늦게** „spät“; **-게 되다** „dazu kommen, schließlich“: **한국에 살게 됐어요** „Ich bin dazu gekommen, in Korea zu leben“.
