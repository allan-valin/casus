# German text of the Korean course, TOPIK 3–4 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Writing and reporting: "Schreiben und Berichten"
  Passive and causative: "Passiv und Kausativ"
  Expressions of time and condition: "Ausdrücke von Zeit und Bedingung"
lessons:
  ko-plain:
    meaning: "der schlichte Schreibstil (한다체)"
    intro: |
      Zeitungen, Bücher und Tagebücher nehmen den **schlichten Stil**: Verben **-ㄴ다 / -는다** (**간다, 먹는다**), Adjektive **-다** (**좋다**), Vergangenheit **-았다 / -었다** (**갔다**), Fragen **-니? / -냐?**. So spricht man im Koreanischen auch schriftlich mit engen Freunden und Jüngeren.
  ko-reported:
    meaning: "indirekte Rede: -다고, -냐고, -자고, -라고"
    intro: |
      Berichtete Aussagen: schlichte Form + **-고 하다**: **비가 온다고 해요** „Man sagt, es regnet“, **좋다고 했어요** „Er sagte, es sei gut“. Fragen **-냐고**, Vorschläge **-자고**, Befehle **-(으)라고**: **가자고 했어요** „Sie schlug vor zu gehen“. Gesprochen wird **-다고 해요** zu **-대요** zusammengezogen: **비가 온대요**.
  ko-because-2:
    meaning: "weil: -기 때문에, 때문에"
    intro: |
      **-기 때문에** nach einem Verb, **때문에** nach einem Nomen: ein klarer, oft schriftlicher Grund: **시간이 없기 때문에 못 가요** „Weil ich keine Zeit habe, kann ich nicht gehen“; **비 때문에** „wegen des Regens“.
  ko-passive-causative:
    meaning: "Passiv- und Kausativverben (-이-, -히-, -리-, -기-)"
    intro: |
      Das Einfügen von **-이-, -히-, -리-, -기-** macht viele Verben passiv (**보다 → 보이다** „gesehen werden“, **닫다 → 닫히다** „geschlossen werden“, **열다 → 열리다** „geöffnet werden“) oder kausativ (**먹다 → 먹이다** „füttern“, **입다 → 입히다** „anziehen (jemanden)“, **웃다 → 웃기다** „zum Lachen bringen“). Andere nehmen **-어지다** (Passiv: **만들어지다**) oder **-게 하다** (Kausativ: **가게 하다**).
  ko-time-clauses:
    meaning: "wenn, bevor, nachdem"
    intro: |
      **-(으)ㄹ 때** „wenn, als“: **어렸을 때** „als ich klein war“. **-기 전에** „bevor“: **자기 전에** „vor dem Schlafen“. **-(으)ㄴ 후에 / 다음에** „nachdem“: **밥을 먹은 후에** „nach dem Essen“. **-는 동안** „während“: **기다리는 동안** „während des Wartens“.
  ko-conditions-2:
    meaning: "Wünsche und Bedingungen: -면 좋겠다, -거든, -다면"
    intro: |
      **-(으)면 좋겠어요** „ich wünschte, es wäre schön, wenn“: **눈이 오면 좋겠어요** „Hoffentlich schneit es“. **-거든** „wenn (dann tu …)“, vor einer Bitte: **도착하거든 전화하세요** „Ruf an, wenn du ankommst“. **-(ㄴ/는)다면** ein hypothetisches *wenn*: **복권에 당첨된다면** „wenn ich im Lotto gewänne“.
