# Macedonian text of the Korean course, TOPIK 3–4 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Writing and reporting: "Пишување и пренесување"
  Passive and causative: "Пасив и каузатив"
  Expressions of time and condition: "Изрази за време и услов"
lessons:
  ko-plain:
    meaning: "обичниот стил на пишување (한다체)"
    intro: |
      Весниците, книгите и дневниците го користат **обичниот стил**: глаголи **-ㄴ다 / -는다** (**간다, 먹는다**), придавки **-다** (**좋다**), минато **-았다 / -었다** (**갔다**), прашања **-니? / -냐?**. Така корејскиот им зборува и на блиски пријатели и на помлади во пишана форма.
  ko-reported:
    meaning: "пренесен говор: -다고, -냐고, -자고, -라고"
    intro: |
      Пренесени изјави: обична форма + **-고 하다**: **비가 온다고 해요** „Велат дека врне“, **좋다고 했어요** „Рече дека е добро“. Прашања **-냐고**, предлози **-자고**, заповеди **-(으)라고**: **가자고 했어요** „Предложи да одиме“. Во говорот **-다고 해요** се скратува во **-대요**: **비가 온대요**.
  ko-because-2:
    meaning: "бидејќи: -기 때문에, 때문에"
    intro: |
      **-기 때문에** по глагол, **때문에** по именка: јасна, често пишана причина: **시간이 없기 때문에 못 가요** „Бидејќи немам време, не можам да одам“; **비 때문에** „поради дождот“.
  ko-passive-causative:
    meaning: "пасивни и каузативни глаголи (-이-, -히-, -리-, -기-)"
    intro: |
      Вметнувањето **-이-, -히-, -리-, -기-** прави многу глаголи пасивни (**보다 → 보이다** „се гледа“, **닫다 → 닫히다** „се затвора“, **열다 → 열리다** „се отвора“) или каузативни (**먹다 → 먹이다** „храни“, **입다 → 입히다** „облекува некого“, **웃다 → 웃기다** „насмева“). Други користат **-어지다** (пасив: **만들어지다**) или **-게 하다** (каузатив: **가게 하다**).
  ko-time-clauses:
    meaning: "кога, пред да, откако"
    intro: |
      **-(으)ㄹ 때** „кога“: **어렸을 때** „кога бев мал“. **-기 전에** „пред да“: **자기 전에** „пред спиење“. **-(으)ㄴ 후에 / 다음에** „откако“: **밥을 먹은 후에** „откако ќе јадам“. **-는 동안** „додека“: **기다리는 동안** „додека чекам“.
  ko-conditions-2:
    meaning: "желби и услови: -면 좋겠다, -거든, -다면"
    intro: |
      **-(으)면 좋겠어요** „би сакал, убаво би било ако“: **눈이 오면 좋겠어요** „Да заврне снег“. **-거든** „ако (тогаш направи…)“, пред барање: **도착하거든 전화하세요** „Јави се кога ќе стигнеш“. **-(ㄴ/는)다면** хипотетичко *ако*: **복권에 당첨된다면** „ако добијам на лотарија“.
