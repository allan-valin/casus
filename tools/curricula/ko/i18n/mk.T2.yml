# Macedonian text of the Korean course, TOPIK 2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Describing with verbs: "Опишување со глаголи"
  Politeness and nuance: "Учтивост и нијанси"
lessons:
  ko-adnominal:
    meaning: "глаголи пред именки: кој прави, кој направил, кој ќе направи"
    intro: |
      Корејскиот става описна реченица **пред** именката, со посебна наставка на глаголот: сегашно **-는** (**먹는 사람** „човекот што јаде“), минато **-(으)ㄴ** (**먹은 사람** „човекот што јадеше“), идно **-(으)ㄹ** (**먹을 음식** „храна за јадење“). Придавките земаат **-(으)ㄴ** во сегашно: **예쁜 꽃** „убав цвет“.
  ko-progressive:
    meaning: "прави во моментов: -고 있다"
    intro: |
      Основа + **-고 있어요** за дејство во тек: **책을 읽고 있어요** „Читам книга (сега)“. Почитувачката форма е **-고 계세요**.
  ko-try:
    meaning: "проба да: -아/어 보다"
    intro: |
      **-아 / -어** + **보다** „проба (и види)“: **먹어 봐요** „Пробај“, **한국에 가 봤어요** „Сум бил во Кореја (пробав да одам)“.
  ko-must:
    meaning: "мора: -아야/어야 하다"
    intro: |
      Основа + **-아야 / -어야 해요** (или **돼요**) „мора“: **가야 해요** „Морам да одам“, **공부해야 돼요** „Морам да учам“.
  ko-can:
    meaning: "може: -(으)ㄹ 수 있다/없다"
    intro: |
      Основа + **-(으)ㄹ 수 있어요** „може“, **-(으)ㄹ 수 없어요** „не може“: **한국어를 할 수 있어요** „Зборувам корејски“; **지금은 갈 수 없어요** „Сега не можам да одам“.
  ko-intent:
    meaning: "за да: -(으)려고, -(으)러 가다"
    intro: |
      **-(으)러** + глагол на одење или доаѓање ја дава целта на движењето: **밥 먹으러 가요** „Одам да јадам“. **-(으)려고** дава намера со секој глагол: **한국어를 배우려고 책을 샀어요** „Купив книга за да учам корејски“.
  ko-honorific:
    meaning: "почитувачкото -(으)시-: почит кон подметот"
    intro: |
      **-(으)시-** по основата покажува почит кон **подметот**: **선생님이 오세요** „Наставникот доаѓа“, **어머니가 주무셨어요** „Мајка спиеше“. Во учтивиот стил се јавува како **-(으)세요**, во минато **-(으)셨어요**. Некои глаголи имаат посебни почитувачки форми: **먹다 → 드시다**, **자다 → 주무시다**, **있다 → 계시다**.
  ko-background:
    meaning: "позадина, спротивност: -는데 / -(으)ㄴ데"
    intro: |
      **-는데** (глаголи) / **-(으)ㄴ데** (придавки) ја поставува сцената за она што следи или ублажува спротивност: **비가 오는데 우산이 없어요** „Врне, а немам чадор“; **맛있는데 비싸요** „Вкусно е, ама скапо“.
  ko-even:
    meaning: "дури и ако: -아도/어도"
    intro: |
      Основа + **-아도 / -어도** „дури и ако, иако“: **비가 와도 가요** „Ќе одам и да врне“. Со **되다** бара или дава дозвола: **들어가도 돼요?** „Може ли да влезам?“
  ko-nominal:
    meaning: "-기 (правењето како именка) и -게 (така што, прилог)"
    intro: |
      **-기** прави од глагол именска фраза: **수영하기를 좋아해요** „Сакам да пливам“, **한국어는 배우기 쉬워요** „Корејскиот е лесен за учење“. **-게** гради прилог или резултат: **예쁘게** „убаво“, **늦게** „доцна“; **-게 되다** „дојде до тоа да, на крај“: **한국에 살게 됐어요** „На крај почнав да живеам во Кореја“.
