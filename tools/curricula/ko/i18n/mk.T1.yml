# Macedonian text of the Korean course, TOPIK 1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Hangul: "Хангул"
  Particles: "Честички"
  Verbs in the polite style: "Глаголи во учтивиот стил"
  Joining clauses: "Сврзување реченици"
  Numbers and counting: "Броеви и броење"
lessons:
  ko-hangul:
    meaning: "корејската азбука"
    intro: |
      Хангул има 14 основни согласки и 10 основни самогласки, пишувани во **слоговни блокови**: почетна согласка, самогласка и по желба крајна согласка (*патчим*): **ㅎ + ㅏ + ㄴ = 한**, **ㄱ + ㅡ + ㄹ = 글** — **한글**. Слог што почнува со самогласка се пишува со неми **ㅇ**: **아, 오, 이**.

      Согласки: **ㄱ** г/к, **ㄴ** н, **ㄷ** д/т, **ㄹ** р/л, **ㅁ** м, **ㅂ** б/п, **ㅅ** с, **ㅇ** (немо / нг), **ㅈ** џ, **ㅊ** ч, **ㅋ** к, **ㅌ** т, **ㅍ** п, **ㅎ** х; напнати **ㄲ ㄸ ㅃ ㅆ ㅉ**. Самогласки: **ㅏ** а, **ㅓ** ŏ (отворено о), **ㅗ** о, **ㅜ** у, **ㅡ** ы (незаоблено у), **ㅣ** и, **ㅐ** е (отворено), **ㅔ** е, и со *ј*: **ㅑ ㅕ ㅛ ㅠ**.
  ko-topic-subject:
    meaning: "честички за тема и подмет"
    intro: |
      Корејскиот ја означува улогата на именката со **честичка** по неа. **은 / 는** ја означува **темата** — за што се зборува, често во спротивност: **저는 학생이에요** „Што се однесува до мене, студент сум.“ **이 / 가** го означува **подметот**, често нова информација или одговор на *кој?*: **누가 왔어요? — 민수가 왔어요.**

      Изборот зависи од последниот глас: по согласка **은 / 이**, по самогласка **는 / 가**: **책은, 학교는; 책이, 학교가**.
    mistakes: ["По самогласка: 는."]
  ko-object:
    meaning: "честичката за објект"
    intro: |
      **을** (по согласка) / **를** (по самогласка) го означува **објектот**: **밥을 먹어요** „Јадам ориз“, **커피를 마셔요** „Пијам кафе“. Во говорот често се испушта кога значењето е јасно.
  ko-place:
    meaning: "честички за место: 에 (кон, во) и 에서 (во, при дејство)"
    intro: |
      **에** означува цел (**학교에 가요** „Одам на училиште“), место на постоење (**집에 있어요** „Дома сум“) и време (**세 시에** „во три“). **에서** го означува местото каде што се врши дејството (**학교에서 공부해요** „Учам во училиште“) и *од* (**서울에서 왔어요** „Дојдов од Сеул“).
    mistakes: ["Дејство на место: 에서."]
  ko-copula:
    meaning: "е (именка): 이에요 / 예요"
    intro: |
      *X е Y* е **Y + 이에요** по согласка, **Y + 예요** по самогласка: **학생이에요** „(јас) сум студент“, **의사예요** „(таа) е лекарка“. Одречно **이/가 아니에요**: **학생이 아니에요**. Во официјалниот стил: **입니다 / 이/가 아닙니다**.
  ko-haeyo:
    meaning: "сегашното во учтивиот стил 해요"
    intro: |
      Глаголите се наведуваат со **-다** (**가다** оди, **먹다** јаде). Секојдневниот учтив стил ја зема основата и додава **-아요** ако нејзината последна самогласка е **ㅏ** или **ㅗ**, инаку **-어요**: **가다 → 가요**, **보다 → 봐요**, **먹다 → 먹어요**, **마시다 → 마셔요**; **하다 → 해요**. Истата форма е изјава, прашање (со кренат тон) и предлог.
  ko-past:
    meaning: "минатото: -았/었-"
    intro: |
      **-았-** (по ㅏ, ㅗ) или **-었-** (инаку) пред наставката: **가다 → 갔어요**, **먹다 → 먹었어요**, **하다 → 했어요**. Минатото работи исто во секој стил: **갔습니다** (официјално), **갔어** (фамилијарно), **갔다** (обично).
  ko-negation:
    meaning: "негација: 안 (не) и 못 (не може)"
    intro: |
      **안** пред глаголот го негира: **안 가요** „Не одам“. **못** значи *не може*: **못 가요** „Не можам да одам“. Подолгите форми ставаат **-지 않다 / -지 못하다** по основата: **가지 않아요, 가지 못해요**. Кај глаголите со **하다** 안 оди пред **하다**: **공부 안 해요**.
  ko-want:
    meaning: "сака да: -고 싶다"
    intro: |
      Глаголска основа + **-고 싶어요**: **가고 싶어요** „Сакам да одам“, **먹고 싶어요** „Сакам да јадам“. За трето лице **-고 싶어 해요**: **동생이 가고 싶어 해요** „Брат ми сака да оди.“
  ko-future:
    meaning: "идното: -(으)ㄹ 거예요"
    intro: |
      Основа + **-(으)ㄹ 거예요** изразува планови и предвидувања: **갈 거예요** „Ќе одам“, **먹을 거예요** „Ќе јадам“, **비가 올 거예요** „Ќе врне“. По согласка **을**, по самогласка **ㄹ**.
  ko-and-but:
    meaning: "и (-고) и но (-지만)"
    intro: |
      **-고** поврзува две дејства или факти: **밥을 먹고 커피를 마셔요** „Јадам и (потоа) пијам кафе“. **-지만** спротивставува: **비싸지만 맛있어요** „Скапо е, но вкусно.“ Двете се закачуваат на основата; времето е на последниот глагол (или на двата со -지만).
  ko-because:
    meaning: "бидејќи: -아서 и -(으)니까"
    intro: |
      **-아서 / -어서** дава причина (без минато пред него, без заповед по него): **배가 고파서 밥을 먹었어요** „Бев гладен, па јадев.“ Значи и *и потоа* за поврзани дејства: **친구를 만나서 영화를 봤어요**. **-(으)니까** дава причина што слушателот треба да ја прифати и дозволува заповеди: **비가 오니까 우산을 가져가세요** „Врне, земи чадор.“
  ko-if:
    meaning: "ако, кога: -(으)면"
    intro: |
      Основа + **-(으)면** „ако, кога (секогаш кога)“: **시간이 있으면 같이 가요** „Ако имаш време, ајде заедно“; **봄이 되면 꽃이 펴요** „Кога ќе дојде пролетта, цветовите цветаат“.
  ko-numbers:
    meaning: "два низа броеви и броилки"
    intro: |
      Корејскиот има **домашни** броеви (**하나, 둘, 셋, 넷, 다섯…**) за броење предмети, часови и возраст и **сино-корејски** броеви (**일, 이, 삼, 사, 오…**) за датуми, пари, минути и телефонски броеви. Пред броилка првите четири домашни се скратуваат: **한 개, 두 명, 세 시, 네 마리**. Чести броилки: **개** (предмети), **명** (луѓе), **마리** (животни), **권** (книги), **잔** (чаши), **살** (години возраст), **시** (часот), **분** (минути), **원** (вон).
