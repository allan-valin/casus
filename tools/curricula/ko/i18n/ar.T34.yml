# Arabic text of the Korean course, TOPIK 3–4 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Writing and reporting: "الكتابة والنقل"
  Passive and causative: "المجهول والتعدية"
  Expressions of time and condition: "عبارات الزمن والشرط"
lessons:
  ko-plain:
    meaning: "الأسلوب العادي في الكتابة (한다체)"
    intro: |
      تستعمل الصحف والكتب واليوميات **الأسلوب العادي**: الأفعال **-ㄴ다 / -는다** (**간다، 먹는다**)، والصفات **-다** (**좋다**)، والماضي **-았다 / -었다** (**갔다**)، والأسئلة **-니? / -냐?**. وبه تخاطب الكورية كتابةً الأصدقاءَ المقرّبين والأصغرَ سنًا.
  ko-reported:
    meaning: "الكلام المنقول: -다고، -냐고، -자고، -라고"
    intro: |
      الخبر المنقول: الصيغة العادية + **-고 하다**: **비가 온다고 해요** «يقولون إنها تمطر»، **좋다고 했어요** «قال إنه جيد». والأسئلة **-냐고**، والاقتراحات **-자고**، والأوامر **-(으)라고**: **가자고 했어요** «اقترحت أن نذهب». وفي الكلام تُختصر **-다고 해요** إلى **-대요**: **비가 온대요**.
  ko-because-2:
    meaning: "لأنّ: -기 때문에، 때문에"
    intro: |
      **-기 때문에** بعد الفعل، و**때문에** بعد الاسم: سبب واضح، كتابي غالبًا: **시간이 없기 때문에 못 가요** «لأنه ليس عندي وقت لا أستطيع الذهاب»؛ **비 때문에** «بسبب المطر».
  ko-passive-causative:
    meaning: "أفعال المجهول والتعدية (-이-، -히-، -리-، -기-)"
    intro: |
      إدخال **-이-، -히-، -리-، -기-** يجعل كثيرًا من الأفعال مجهولة (**보다 → 보이다** «رُئي»، **닫다 → 닫히다** «أُغلق»، **열다 → 열리다** «فُتح») أو متعدية سببية (**먹다 → 먹이다** «أطعم»، **입다 → 입히다** «ألبس»، **웃다 → 웃기다** «أضحك»). وأخرى تستعمل **-어지다** (للمجهول: **만들어지다**) أو **-게 하다** (للتعدية: **가게 하다**).
  ko-time-clauses:
    meaning: "عندما، قبل أن، بعد أن"
    intro: |
      **-(으)ㄹ 때** «عندما»: **어렸을 때** «عندما كنت صغيرًا». **-기 전에** «قبل أن»: **자기 전에** «قبل النوم». **-(으)ㄴ 후에 / 다음에** «بعد أن»: **밥을 먹은 후에** «بعد الأكل». **-는 동안** «بينما»: **기다리는 동안** «أثناء الانتظار».
  ko-conditions-2:
    meaning: "التمني والشرط: -면 좋겠다، -거든، -다면"
    intro: |
      **-(으)면 좋겠어요** «أتمنى، ليت»: **눈이 오면 좋겠어요** «ليتها تثلج». و**-거든** «إذا (فافعل…)»، قبل الطلب: **도착하거든 전화하세요** «اتصل حين تصل». و**-(ㄴ/는)다면** *لو* الافتراضية: **복권에 당첨된다면** «لو ربحت اليانصيب».
