# German text of the Korean course, TOPIK 1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Hangul: "Hangul"
  Particles: "Partikeln"
  Verbs in the polite style: "Verben im höflichen Stil"
  Joining clauses: "Sätze verbinden"
  Numbers and counting: "Zahlen und Zählen"
lessons:
  ko-hangul:
    meaning: "das koreanische Alphabet"
    intro: |
      Hangul hat 14 Grundkonsonanten und 10 Grundvokale, geschrieben in **Silbenblöcken**: ein Anlautkonsonant, ein Vokal und optional ein Auslautkonsonant (*Batchim*): **ㅎ + ㅏ + ㄴ = 한**, **ㄱ + ㅡ + ㄹ = 글** — **한글**. Eine Silbe, die mit einem Vokal beginnt, wird mit stummem **ㅇ** geschrieben: **아, 오, 이**.

      Konsonanten: **ㄱ** g/k, **ㄴ** n, **ㄷ** d/t, **ㄹ** r/l, **ㅁ** m, **ㅂ** b/p, **ㅅ** s, **ㅇ** (stumm / ng), **ㅈ** dsch, **ㅊ** tsch, **ㅋ** k, **ㅌ** t, **ㅍ** p, **ㅎ** h; gespannt **ㄲ ㄸ ㅃ ㅆ ㅉ**. Vokale: **ㅏ** a, **ㅓ** eo (offenes o), **ㅗ** o, **ㅜ** u, **ㅡ** eu (ungerundetes u), **ㅣ** i, **ㅐ** ae, **ㅔ** e, und mit *j*: **ㅑ ㅕ ㅛ ㅠ**.
  ko-topic-subject:
    meaning: "Topik- und Subjektpartikel"
    intro: |
      Koreanisch markiert die Rolle eines Nomens mit einer **Partikel** danach. **은 / 는** markiert das **Topik** — worüber man spricht, oft im Kontrast: **저는 학생이에요** „Was mich betrifft, ich bin Student.“ **이 / 가** markiert das **Subjekt**, oft neue Information oder die Antwort auf *wer?*: **누가 왔어요? — 민수가 왔어요.**

      Die Wahl hängt vom letzten Laut ab: nach Konsonant **은 / 이**, nach Vokal **는 / 가**: **책은, 학교는; 책이, 학교가**.
    mistakes: ["Nach Vokal: 는."]
  ko-object:
    meaning: "die Objektpartikel"
    intro: |
      **을** (nach Konsonant) / **를** (nach Vokal) markiert das **Objekt**: **밥을 먹어요** „Ich esse Reis“, **커피를 마셔요** „Ich trinke Kaffee“. Gesprochen fällt sie oft weg, wenn die Bedeutung klar ist.
  ko-place:
    meaning: "Ortspartikeln: 에 (zu, an) und 에서 (an, beim Tun)"
    intro: |
      **에** markiert ein Ziel (**학교에 가요** „Ich gehe zur Schule“), einen Aufenthaltsort (**집에 있어요** „Ich bin zu Hause“) und die Zeit (**세 시에** „um drei“). **에서** markiert den Ort, an dem eine Handlung stattfindet (**학교에서 공부해요** „Ich lerne in der Schule“), und *von … her* (**서울에서 왔어요** „Ich komme aus Seoul“).
    mistakes: ["Eine Handlung an einem Ort: 에서."]
  ko-copula:
    meaning: "sein (ein Nomen): 이에요 / 예요"
    intro: |
      *X ist Y* heißt **Y + 이에요** nach Konsonant, **Y + 예요** nach Vokal: **학생이에요** „(ich) bin Student“, **의사예요** „(sie) ist Ärztin“. Verneint **이/가 아니에요**: **학생이 아니에요**. Im formellen Stil: **입니다 / 이/가 아닙니다**.
  ko-haeyo:
    meaning: "das Präsens im höflichen 해요-Stil"
    intro: |
      Verben werden mit **-다** angegeben (**가다** gehen, **먹다** essen). Der alltägliche höfliche Stil nimmt den Stamm und fügt **-아요** an, wenn dessen letzter Vokal **ㅏ** oder **ㅗ** ist, sonst **-어요**: **가다 → 가요**, **보다 → 봐요**, **먹다 → 먹어요**, **마시다 → 마셔요**; **하다 → 해요**. Dieselbe Form ist Aussage, Frage (steigende Intonation) und Vorschlag.
  ko-past:
    meaning: "die Vergangenheit: -았/었-"
    intro: |
      **-았-** (nach ㅏ, ㅗ) oder **-었-** (sonst) vor der Endung: **가다 → 갔어요**, **먹다 → 먹었어요**, **하다 → 했어요**. Die Vergangenheit funktioniert in jedem Stil gleich: **갔습니다** (formell), **갔어** (vertraut), **갔다** (schlicht).
  ko-negation:
    meaning: "Verneinung: 안 (nicht) und 못 (nicht können)"
    intro: |
      **안** vor dem Verb verneint es: **안 가요** „Ich gehe nicht“. **못** heißt *nicht können*: **못 가요** „Ich kann nicht gehen“. Die Langformen setzen **-지 않다 / -지 못하다** nach den Stamm: **가지 않아요, 가지 못해요**. Bei **하다**-Verben steht 안 vor **하다**: **공부 안 해요**.
  ko-want:
    meaning: "wollen: -고 싶다"
    intro: |
      Verbstamm + **-고 싶어요**: **가고 싶어요** „Ich will gehen“, **먹고 싶어요** „Ich will essen“. Für eine dritte Person **-고 싶어 해요**: **동생이 가고 싶어 해요** „Mein Bruder will gehen.“
  ko-future:
    meaning: "das Futur: -(으)ㄹ 거예요"
    intro: |
      Stamm + **-(으)ㄹ 거예요** drückt Pläne und Vorhersagen aus: **갈 거예요** „Ich werde gehen“, **먹을 거예요** „Ich werde essen“, **비가 올 거예요** „Es wird regnen“. Nach Konsonant **을**, nach Vokal **ㄹ**.
  ko-and-but:
    meaning: "und (-고) und aber (-지만)"
    intro: |
      **-고** verbindet zwei Handlungen oder Tatsachen: **밥을 먹고 커피를 마셔요** „Ich esse und trinke (dann) Kaffee“. **-지만** stellt gegenüber: **비싸지만 맛있어요** „Es ist teuer, aber lecker.“ Beide hängen am Stamm; das Tempus steht am letzten Verb (bei -지만 an beiden).
  ko-because:
    meaning: "weil: -아서 und -(으)니까"
    intro: |
      **-아서 / -어서** gibt einen Grund an (keine Vergangenheit davor, kein Befehl danach): **배가 고파서 밥을 먹었어요** „Ich hatte Hunger, also aß ich.“ Es heißt auch *und dann* bei verbundenen Handlungen: **친구를 만나서 영화를 봤어요**. **-(으)니까** gibt einen Grund, den der Hörer akzeptieren soll, und erlaubt Befehle: **비가 오니까 우산을 가져가세요** „Es regnet, nimm einen Schirm mit.“
  ko-if:
    meaning: "wenn: -(으)면"
    intro: |
      Stamm + **-(으)면** „wenn, falls (immer wenn)“: **시간이 있으면 같이 가요** „Wenn du Zeit hast, gehen wir zusammen“; **봄이 되면 꽃이 펴요** „Wenn der Frühling kommt, blühen die Blumen“.
  ko-numbers:
    meaning: "zwei Zahlenreihen und Zählwörter"
    intro: |
      Koreanisch hat **einheimische** Zahlen (**하나, 둘, 셋, 넷, 다섯…**) zum Zählen von Dingen, Stunden und Alter und **sinokoreanische** Zahlen (**일, 이, 삼, 사, 오…**) für Daten, Geld, Minuten und Telefonnummern. Vor einem Zählwort verkürzen sich die ersten vier einheimischen Zahlen: **한 개, 두 명, 세 시, 네 마리**. Häufige Zählwörter: **개** (Dinge), **명** (Personen), **마리** (Tiere), **권** (Bücher), **잔** (Tassen), **살** (Lebensjahre), **시** (Uhr), **분** (Minuten), **원** (Won).
