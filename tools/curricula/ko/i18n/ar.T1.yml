# Arabic text of the Korean course, TOPIK 1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Hangul: "الهانغول"
  Particles: "الأدوات اللاحقة"
  Verbs in the polite style: "الأفعال في الأسلوب المهذب"
  Joining clauses: "ربط الجمل"
  Numbers and counting: "الأعداد والعدّ"
lessons:
  ko-hangul:
    meaning: "الأبجدية الكورية"
    intro: |
      للهانغول 14 صامتًا أساسيًا و10 صوائت أساسية، تُكتب في **كتل مقطعية**: صامت أول، ثم صائت، ثم صامت أخير اختياري (*باتشيم*): **ㅎ + ㅏ + ㄴ = 한**، **ㄱ + ㅡ + ㄹ = 글** — **한글**. والمقطع الذي يبدأ بصائت يُكتب بـ **ㅇ** صامتة: **아، 오، 이**.

      الصوامت: **ㄱ** گ/ك، **ㄴ** ن، **ㄷ** د/ت، **ㄹ** ر/ل، **ㅁ** م، **ㅂ** ب/پ، **ㅅ** س، **ㅇ** (صامتة / نغ)، **ㅈ** ج، **ㅊ** تش، **ㅋ** ك، **ㅌ** ت، **ㅍ** پ، **ㅎ** هـ؛ والمشددة **ㄲ ㄸ ㅃ ㅆ ㅉ**. الصوائت: **ㅏ** a، **ㅓ** eo (أو مفتوحة)، **ㅗ** o، **ㅜ** u، **ㅡ** eu (ضمة غير مدوّرة)، **ㅣ** i، **ㅐ** ae، **ㅔ** e، ومع *ي*: **ㅑ ㅕ ㅛ ㅠ**.
  ko-topic-subject:
    meaning: "أداتا الموضوع والفاعل"
    intro: |
      تعلّم الكورية دور الاسم بـ **أداة** بعده. **은 / 는** تعلّم **الموضوع** — ما يدور عنه الكلام، وغالبًا للمقابلة: **저는 학생이에요** «أمّا أنا فطالب». و**이 / 가** تعلّم **الفاعل**، وغالبًا المعلومة الجديدة أو جواب *من؟*: **누가 왔어요? — 민수가 왔어요.**

      والاختيار بحسب آخر صوت: بعد الصامت **은 / 이**، وبعد الصائت **는 / 가**: **책은، 학교는؛ 책이، 학교가**.
    mistakes: ["بعد الصائت: 는."]
  ko-object:
    meaning: "أداة المفعول"
    intro: |
      **을** (بعد الصامت) / **를** (بعد الصائت) تعلّم **المفعول**: **밥을 먹어요** «آكل الأرز»، **커피를 마셔요** «أشرب القهوة». وفي الكلام تُحذف كثيرًا إذا اتضح المعنى.
  ko-place:
    meaning: "أداتا المكان: 에 (إلى، في) و에서 (في، عند الفعل)"
    intro: |
      **에** تعلّم الوجهة (**학교에 가요** «أذهب إلى المدرسة»)، ومكان الوجود (**집에 있어요** «أنا في البيت»)، والزمان (**세 시에** «في الثالثة»). و**에서** تعلّم مكان وقوع الفعل (**학교에서 공부해요** «أدرس في المدرسة») و*من* (**서울에서 왔어요** «جئت من سيول»).
    mistakes: ["فعل في مكان: 에서."]
  ko-copula:
    meaning: "يكون (مع اسم): 이에요 / 예요"
    intro: |
      *س هو ص* هي **ص + 이에요** بعد الصامت، و**ص + 예요** بعد الصائت: **학생이에요** «(أنا) طالب»، **의사예요** «(هي) طبيبة». والنفي **이/가 아니에요**: **학생이 아니에요**. وفي الأسلوب الرسمي: **입니다 / 이/가 아닙니다**.
  ko-haeyo:
    meaning: "المضارع في الأسلوب المهذب 해요"
    intro: |
      تُدرَج الأفعال بـ **-다** (**가다** يذهب، **먹다** يأكل). والأسلوب المهذب اليومي يأخذ الجذر ويضيف **-아요** إن كان آخر صائت فيه **ㅏ** أو **ㅗ**، وإلا **-어요**: **가다 → 가요**، **보다 → 봐요**، **먹다 → 먹어요**، **마시다 → 마셔요**؛ **하다 → 해요**. والصيغة نفسها خبر وسؤال (بنغمة صاعدة) واقتراح.
  ko-past:
    meaning: "الماضي: -았/었-"
    intro: |
      أضف **-았-** (بعد ㅏ، ㅗ) أو **-었-** (في غير ذلك) قبل اللاحقة: **가다 → 갔어요**، **먹다 → 먹었어요**، **하다 → 했어요**. والماضي يعمل بالطريقة نفسها في كل الأساليب: **갔습니다** (رسمي)، **갔어** (ودّي)، **갔다** (عادي).
  ko-negation:
    meaning: "النفي: 안 (لا) و못 (لا يستطيع)"
    intro: |
      **안** قبل الفعل تنفيه: **안 가요** «لا أذهب». و**못** تعني *لا يستطيع*: **못 가요** «لا أستطيع الذهاب». والصيغ الطويلة تضع **-지 않다 / -지 못하다** بعد الجذر: **가지 않아요، 가지 못해요**. ومع أفعال **하다** تأتي 안 قبل **하다**: **공부 안 해요**.
  ko-want:
    meaning: "يريد أن: -고 싶다"
    intro: |
      جذر الفعل + **-고 싶어요**: **가고 싶어요** «أريد أن أذهب»، **먹고 싶어요** «أريد أن آكل». وللغائب **-고 싶어 해요**: **동생이 가고 싶어 해요** «أخي يريد أن يذهب».
  ko-future:
    meaning: "المستقبل: -(으)ㄹ 거예요"
    intro: |
      الجذر + **-(으)ㄹ 거예요** يعبّر عن الخطط والتوقعات: **갈 거예요** «سأذهب»، **먹을 거예요** «سآكل»، **비가 올 거예요** «ستمطر». بعد الصامت **을**، وبعد الصائت **ㄹ**.
  ko-and-but:
    meaning: "و (-고) ولكن (-지만)"
    intro: |
      **-고** تربط فعلين أو واقعتين: **밥을 먹고 커피를 마셔요** «آكل ثم أشرب القهوة». و**-지만** للاستدراك: **비싸지만 맛있어요** «غالٍ لكنه لذيذ». وكلتاهما تُلحق بالجذر؛ والزمن على الفعل الأخير (أو على الاثنين مع -지만).
  ko-because:
    meaning: "لأنّ: -아서 و-(으)니까"
    intro: |
      **-아서 / -어서** تعطي سببًا (لا ماضي قبلها ولا أمر بعدها): **배가 고파서 밥을 먹었어요** «كنت جائعًا فأكلت». وتعني أيضًا *ثم* للأفعال المترابطة: **친구를 만나서 영화를 봤어요**. و**-(으)니까** تعطي سببًا ينبغي أن يقبله السامع، وتسمح بالأمر: **비가 오니까 우산을 가져가세요** «إنها تمطر، فخذ مظلة».
  ko-if:
    meaning: "إذا، عندما: -(으)면"
    intro: |
      الجذر + **-(으)면** «إذا، كلما»: **시간이 있으면 같이 가요** «إن كان عندك وقت فلنذهب معًا»؛ **봄이 되면 꽃이 펴요** «إذا جاء الربيع تفتّحت الأزهار».
  ko-numbers:
    meaning: "مجموعتان من الأعداد وكلمات العدّ"
    intro: |
      للكورية أعداد **أصلية** (**하나، 둘، 셋، 넷، 다섯…**) لعدّ الأشياء والساعات والعمر، وأعداد **صينية-كورية** (**일، 이، 삼، 사، 오…**) للتواريخ والنقود والدقائق وأرقام الهاتف. وقبل كلمة العدّ تُختصر الأعداد الأصلية الأربعة الأولى: **한 개، 두 명، 세 시، 네 마리**. وكلمات العدّ الشائعة: **개** (أشياء)، **명** (أشخاص)، **마리** (حيوانات)، **권** (كتب)، **잔** (أكواب)، **살** (سنوات العمر)، **시** (الساعة)، **분** (دقائق)، **원** (وون).
