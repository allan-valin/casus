# Arabic text of the Korean course, TOPIK 5–6 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Formal style: "الأسلوب الرسمي"
  Advanced expressions: "عبارات متقدمة"
lessons:
  ko-formal:
    meaning: "الأسلوب الرسمي: الأخبار والخطب والخدمة"
    intro: |
      **-습니다 / -ㅂ니다** (الخبر)، **-습니까 / -ㅂ니까** (السؤال)، **-십시오** (الطلب)، **-ㅂ시다** (هيا بنا) — الأسلوب الرسمي المهذب في الإعلانات والأخبار والعروض والخدمة: **감사합니다**، **어디에 가십니까?**، **앉으십시오**.
  ko-nominalizer-eum:
    meaning: "-(으)ㅁ: أسماء من الأفعال في الكتابة"
    intro: |
      **-(으)ㅁ** تصوغ اسمًا من فعل أو صفة، في الإعلانات والملاحظات والكتابة الرسمية: **조용히 함** «الرجاء الهدوء»، **회의가 있음** «يوجد اجتماع»، **그가 범인임이 밝혀졌다** «تبيّن أنه الجاني».
  ko-advanced-expressions:
    meaning: "عبارات متقدمة: لا بد أن، كلما … كلما، بمثابة"
    intro: |
      - **-기 마련이다** «من الطبيعي أن، لا بد»: **사람은 실수하기 마련이에요** «الإنسان لا بد أن يخطئ»
      - **-(으)ㄹ수록** «كلما … كلما»: **많이 할수록 잘해요** «كلما أكثرت أتقنت»
      - **-는 셈이다** «بمثابة، كأنه»: **거의 다 한 셈이에요** «كأنه انتهى تقريبًا»
      - **-(으)ㄹ 뿐이다** «ليس إلا»: **최선을 다했을 뿐이에요** «لم أفعل إلا ما في وسعي»
      - **-는 법이다** «هكذا الأمر»: **노력하면 성공하는 법이에요** «من جدّ وجد»
