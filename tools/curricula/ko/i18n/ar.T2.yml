# Arabic text of the Korean course, TOPIK 2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Describing with verbs: "الوصف بالأفعال"
  Politeness and nuance: "التأدّب ودقائق المعنى"
lessons:
  ko-adnominal:
    meaning: "الأفعال قبل الأسماء: الذي يفعل، الذي فعل، الذي سيفعل"
    intro: |
      تضع الكورية جملة الوصف **قبل** الاسم، بلاحقة خاصة على فعلها: الحاضر **-는** (**먹는 사람** «الشخص الذي يأكل»)، والماضي **-(으)ㄴ** (**먹은 사람** «الشخص الذي أكل»)، والمستقبل **-(으)ㄹ** (**먹을 음식** «طعام سيُؤكل»). والصفات تأخذ **-(으)ㄴ** في الحاضر: **예쁜 꽃** «زهرة جميلة».
  ko-progressive:
    meaning: "يفعل الآن: -고 있다"
    intro: |
      الجذر + **-고 있어요** للفعل الجاري: **책을 읽고 있어요** «أقرأ كتابًا الآن». وصيغة الاحترام **-고 계세요**.
  ko-try:
    meaning: "جرّب أن: -아/어 보다"
    intro: |
      **-아 / -어** + **보다** «جرّب (وانظر)»: **먹어 봐요** «جرّبه»، **한국에 가 봤어요** «سبق أن زرت كوريا (جرّبت الذهاب)».
  ko-must:
    meaning: "يجب: -아야/어야 하다"
    intro: |
      الجذر + **-아야 / -어야 해요** (أو **돼요**) «يجب»: **가야 해요** «يجب أن أذهب»، **공부해야 돼요** «يجب أن أدرس».
  ko-can:
    meaning: "يستطيع: -(으)ㄹ 수 있다/없다"
    intro: |
      الجذر + **-(으)ㄹ 수 있어요** «يستطيع»، و**-(으)ㄹ 수 없어요** «لا يستطيع»: **한국어를 할 수 있어요** «أستطيع التكلم بالكورية»؛ **지금은 갈 수 없어요** «لا أستطيع الذهاب الآن».
  ko-intent:
    meaning: "لكي: -(으)려고، -(으)러 가다"
    intro: |
      **-(으)러** + فعل ذهاب أو مجيء تعطي غاية الحركة: **밥 먹으러 가요** «أذهب لآكل». و**-(으)려고** تعطي النية مع أي فعل: **한국어를 배우려고 책을 샀어요** «اشتريت كتابًا لأتعلم الكورية».
  ko-honorific:
    meaning: "صيغة الاحترام -(으)시-: توقير الفاعل"
    intro: |
      **-(으)시-** بعد الجذر تُظهر الاحترام **للفاعل**: **선생님이 오세요** «المعلم قادم»، **어머니가 주무셨어요** «نامت أمي». وفي الأسلوب المهذب تظهر **-(으)세요**، وفي الماضي **-(으)셨어요**. ولبعض الأفعال صيغ احترام خاصة: **먹다 → 드시다**، **자다 → 주무시다**، **있다 → 계시다**.
  ko-background:
    meaning: "الخلفية والاستدراك: -는데 / -(으)ㄴ데"
    intro: |
      **-는데** (للأفعال) / **-(으)ㄴ데** (للصفات) تمهّد لما بعدها أو تليّن الاستدراك: **비가 오는데 우산이 없어요** «إنها تمطر وليس معي مظلة»؛ **맛있는데 비싸요** «لذيذ لكنه غالٍ».
  ko-even:
    meaning: "حتى لو: -아도/어도"
    intro: |
      الجذر + **-아도 / -어도** «حتى لو، مع أنّ»: **비가 와도 가요** «سأذهب حتى لو أمطرت». ومع **되다** تطلب الإذن أو تعطيه: **들어가도 돼요?** «هل يمكنني الدخول؟»
  ko-nominal:
    meaning: "-기 (الفعل اسمًا) و-게 (بحيث، ظرفًا)"
    intro: |
      **-기** تحوّل الفعل إلى عبارة اسمية: **수영하기를 좋아해요** «أحب السباحة»، **한국어는 배우기 쉬워요** «الكورية سهلة التعلّم». و**-게** تصوغ ظرفًا أو نتيجة: **예쁘게** «بجمال»، **늦게** «متأخرًا»؛ و**-게 되다** «انتهى به الأمر إلى»: **한국에 살게 됐어요** «انتهى بي الأمر إلى العيش في كوريا».
