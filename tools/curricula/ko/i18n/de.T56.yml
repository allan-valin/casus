# German text of the Korean course, TOPIK 5–6 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Formal style: "Formeller Stil"
  Advanced expressions: "Fortgeschrittene Ausdrücke"
lessons:
  ko-formal:
    meaning: "der formelle Stil: Nachrichten, Reden, Service"
    intro: |
      **-습니다 / -ㅂ니다** (Aussagen), **-습니까 / -ㅂ니까** (Fragen), **-십시오** (Bitten), **-ㅂ시다** (lasst uns) — der formell-höfliche Stil von Durchsagen, Nachrichten, Vorträgen und Service: **감사합니다**, **어디에 가십니까?**, **앉으십시오**.
  ko-nominalizer-eum:
    meaning: "-(으)ㅁ: Nomen aus Verben im Schriftlichen"
    intro: |
      **-(으)ㅁ** macht aus einem Verb oder Adjektiv ein Nomen, in Aushängen, Notizen und förmlichen Texten: **조용히 함** „Ruhe bitte“, **회의가 있음** „Besprechung findet statt“, **그가 범인임이 밝혀졌다** „es stellte sich heraus, dass er der Täter war“.
  ko-advanced-expressions:
    meaning: "fortgeschrittene Ausdrücke: zwangsläufig, je mehr … desto, so gut wie"
    intro: |
      - **-기 마련이다** „es ist natürlich, dass; zwangsläufig“: **사람은 실수하기 마련이에요** „Menschen machen nun einmal Fehler“
      - **-(으)ㄹ수록** „je mehr … desto“: **많이 할수록 잘해요** „Je mehr man übt, desto besser wird man“
      - **-는 셈이다** „das kommt … gleich, praktisch“: **거의 다 한 셈이에요** „Es ist so gut wie fertig“
      - **-(으)ㄹ 뿐이다** „nur, nichts als“: **최선을 다했을 뿐이에요** „Ich habe nur mein Bestes gegeben“
      - **-는 법이다** „so ist es eben“: **노력하면 성공하는 법이에요** „Wer sich bemüht, hat Erfolg“
