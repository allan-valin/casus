# Explanations written for Casus (2026-10-20) for the structural points of the HSK 3.0 grammar syllabus, keyed by the
# syllabus's own label (Details, else Category). Word-list points need none: their forms are shown with pinyin,
# English and an example each. Each entry may carry `match`, a rule for Tatoeba's sentences (tools/learn_match.mjs).
动态助词:
  en: |
    Chinese verbs do not change; **particles** after them show the aspect. **了** marks a completed action (**我买了一本书** "I bought a book"), **过** a past experience (**我去过北京** "I've been to Beijing"), **着** a continuing state (**门开着** "the door is open"). Negated completion uses **没(有)** without 了: **我没买**.
  pt: |
    O verbo chinês não muda; **partículas** depois dele mostram o aspecto. **了** marca a ação concluída (**我买了一本书** "comprei um livro"), **过** uma experiência passada (**我去过北京** "já estive em Pequim"), **着** um estado contínuo (**门开着** "a porta está aberta"). A conclusão negada usa **没(有)** sem 了: **我没买**.
  de: |
    Chinesische Verben ändern sich nicht; **Partikeln** dahinter zeigen den Aspekt. **了** markiert eine abgeschlossene Handlung (**我买了一本书** „Ich habe ein Buch gekauft“), **过** eine vergangene Erfahrung (**我去过北京** „Ich war schon in Peking“), **着** einen andauernden Zustand (**门开着** „Die Tür ist offen“). Verneinte Vollendung nimmt **没(有)** ohne 了: **我没买**.
  mk: |
    Кинеските глаголи не се менуваат; **честички** по нив го покажуваат видот. **了** означува завршено дејство (**我买了一本书** „Купив книга“), **过** минато искуство (**我去过北京** „Сум бил во Пекинг“), **着** состојба што трае (**门开着** „Вратата е отворена“). Одреченото завршување користи **没(有)** без 了: **我没买**.
  ar: |
    لا يتغير الفعل الصيني؛ و**أدوات** بعده تبيّن الهيئة. **了** للفعل المنجز (**我买了一本书** «اشتريت كتابًا»)، و**过** للتجربة الماضية (**我去过北京** «سبق أن زرت بكين»)، و**着** للحال المستمرة (**门开着** «الباب مفتوح»). ونفي الإنجاز بـ **没(有)** بلا 了: **我没买**.
  match: {seq: [{pos: verb}, {word: [了, 过, 着]}], gap: 1}
  pool: [了, 过, 着, 的, 得]
结构助词:
  en: |
    Three particles pronounced *de*: **的** joins an attribute to a noun (**我的书** "my book", **我买的书** "the book I bought"); **地** joins an adverbial to a verb (**慢慢地走** "walk slowly"); **得** joins a verb to its complement of manner or degree (**跑得很快** "runs fast").
  pt: |
    Três partículas pronunciadas *de*: **的** liga um adjunto ao substantivo (**我的书** "meu livro", **我买的书** "o livro que comprei"); **地** liga um adjunto adverbial ao verbo (**慢慢地走** "andar devagar"); **得** liga o verbo ao complemento de modo ou grau (**跑得很快** "corre rápido").
  de: |
    Drei Partikeln, alle *de* gesprochen: **的** verbindet ein Attribut mit dem Nomen (**我的书** „mein Buch“, **我买的书** „das Buch, das ich gekauft habe“); **地** verbindet eine Adverbiale mit dem Verb (**慢慢地走** „langsam gehen“); **得** verbindet das Verb mit seiner Art- oder Gradergänzung (**跑得很快** „läuft schnell“).
  mk: |
    Три честички што се изговараат *de*: **的** поврзува атрибут со именка (**我的书** „мојата книга“, **我买的书** „книгата што ја купив“); **地** поврзува прилошка определба со глагол (**慢慢地走** „оди полека“); **得** поврзува глагол со неговото дополнување за начин или степен (**跑得很快** „трча брзо“).
  ar: |
    ثلاث أدوات تُنطق *de*: **的** تربط النعت بالاسم (**我的书** «كتابي»، **我买的书** «الكتاب الذي اشتريته»)؛ و**地** تربط الظرف بالفعل (**慢慢地走** «يمشي ببطء»)؛ و**得** تربط الفعل بمتمّم الكيفية أو الدرجة (**跑得很快** «يركض بسرعة»).
  match: {seq: [{word: [的, 地, 得]}], gap: 0}
  pool: [的, 地, 得]
语气助词:
  en: |
    Particles at the end of the sentence set its tone: **吗** makes a yes/no question (**你好吗？**), **呢** asks back or softens (**你呢？** "And you?"), **吧** suggests or seeks agreement (**我们走吧** "Let's go"), sentence-final **了** marks a change (**下雨了** "It's started raining").
  pt: |
    Partículas no fim da frase dão o tom: **吗** faz pergunta de sim ou não (**你好吗？**), **呢** devolve a pergunta ou suaviza (**你呢？** "E você?"), **吧** sugere ou pede concordância (**我们走吧** "Vamos"), **了** final marca uma mudança (**下雨了** "Começou a chover").
  de: |
    Partikeln am Satzende bestimmen den Ton: **吗** macht eine Ja/Nein-Frage (**你好吗？**), **呢** fragt zurück oder mildert (**你呢？** „Und du?“), **吧** schlägt vor oder sucht Zustimmung (**我们走吧** „Gehen wir“), satzfinales **了** markiert eine Veränderung (**下雨了** „Es hat angefangen zu regnen“).
  mk: |
    Честичките на крајот на реченицата го даваат тонот: **吗** прави прашање да/не (**你好吗？**), **呢** враќа прашање или ублажува (**你呢？** „А ти?“), **吧** предлага или бара согласност (**我们走吧** „Ајде да одиме“), **了** на крајот означува промена (**下雨了** „Почна да врне“).
  ar: |
    أدوات آخر الجملة تحدد نبرتها: **吗** تصنع سؤال نعم/لا (**你好吗？**)، و**呢** تردّ السؤال أو تلطّف (**你呢？** «وأنت؟»)، و**吧** تقترح أو تطلب الموافقة (**我们走吧** «هيا بنا»)، و**了** في آخر الجملة تدل على تغيّر (**下雨了** «بدأ المطر»).
  match: {seq: [{word: [吗, 呢, 吧], trail: "？?。.!！"}], gap: 0}
  pool: [吗, 呢, 吧, 了, 啊]
“把”字句:
  en: |
    **把** brings the object before the verb to say what is done **to** it, with a result: **我把书放在桌子上** "I put the book on the table". The verb needs something after it (a complement, 了, a direction): not just ✗ *我把书放*. The object is definite.
  pt: |
    **把** traz o objeto para antes do verbo para dizer o que se faz **com** ele, com um resultado: **我把书放在桌子上** "Pus o livro na mesa". O verbo precisa de algo depois (complemento, 了, direção): não só ✗ *我把书放*. O objeto é definido.
  de: |
    **把** holt das Objekt vor das Verb, um zu sagen, was **mit** ihm geschieht, mit einem Ergebnis: **我把书放在桌子上** „Ich lege das Buch auf den Tisch“. Das Verb braucht etwas danach (eine Ergänzung, 了, eine Richtung): nicht nur ✗ *我把书放*. Das Objekt ist bestimmt.
  mk: |
    **把** го носи предметот пред глаголот за да каже што се прави **со** него, со резултат: **我把书放在桌子上** „Ја ставив книгата на масата“. Глаголот бара нешто по него (дополнување, 了, насока): не само ✗ *我把书放*. Предметот е определен.
  ar: |
    **把** تقدّم المفعول على الفعل لتقول ما يُفعل **به**، مع نتيجة: **我把书放在桌子上** «وضعت الكتاب على الطاولة». ويحتاج الفعل شيئًا بعده (متمّمًا، أو 了، أو اتجاهًا): لا ✗ *我把书放* وحدها. والمفعول معرفة.
  match: {seq: [{word: [把]}, {pos: [noun, pron]}], near: 3, gap: 0}
  pool: [把, 被, 让, 给, 对]
被动句:
  en: |
    **被** (or, in speech, **叫 / 让**) marks the doer of a passive action, often an unpleasant one: **我的钱包被偷了** "My wallet was stolen", **他被老师批评了** "He was criticised by the teacher".
  pt: |
    **被** (ou, na fala, **叫 / 让**) marca quem faz a ação na passiva, muitas vezes algo desagradável: **我的钱包被偷了** "Minha carteira foi roubada", **他被老师批评了** "Ele foi criticado pelo professor".
  de: |
    **被** (gesprochen auch **叫 / 让**) markiert den Täter einer Passivhandlung, oft einer unangenehmen: **我的钱包被偷了** „Mein Portemonnaie wurde gestohlen“, **他被老师批评了** „Er wurde vom Lehrer kritisiert“.
  mk: |
    **被** (во говорот и **叫 / 让**) го означува вршителот на пасивно дејство, често непријатно: **我的钱包被偷了** „Ми го украдоа паричникот“, **他被老师批评了** „Наставникот го искара“.
  ar: |
    **被** (وفي الكلام **叫 / 让**) تدل على فاعل الفعل المبني للمجهول، وكثيرًا ما يكون أمرًا مزعجًا: **我的钱包被偷了** «سُرقت محفظتي»، **他被老师批评了** «انتقده المعلم».
  match: {seq: [{word: [被]}], gap: 0}
  pool: [被, 把, 让, 给, 对]
比较句:
  en: |
    **A 比 B + adjective**: **他比我高** "He is taller than me". Add the difference after the adjective (**高三厘米**, **高一点儿**, **高得多**); never **很** before it. Negative: **A 没有 B (那么) 高**.
  pt: |
    **A 比 B + adjetivo**: **他比我高** "Ele é mais alto que eu". A diferença vai depois do adjetivo (**高三厘米**, **高一点儿**, **高得多**); nunca **很** antes dele. Negativa: **A 没有 B (那么) 高**.
  de: |
    **A 比 B + Adjektiv**: **他比我高** „Er ist größer als ich“. Den Unterschied hinter das Adjektiv (**高三厘米**, **高一点儿**, **高得多**); nie **很** davor. Verneint: **A 没有 B (那么) 高**.
  mk: |
    **A 比 B + придавка**: **他比我高** „Тој е повисок од мене“. Разликата оди по придавката (**高三厘米**, **高一点儿**, **高得多**); никогаш **很** пред неа. Одречно: **A 没有 B (那么) 高**.
  ar: |
    **A 比 B + صفة**: **他比我高** «هو أطول مني». ويُذكر الفرق بعد الصفة (**高三厘米**، **高一点儿**، **高得多**)؛ ولا **很** قبلها أبدًا. والنفي: **A 没有 B (那么) 高**.
  match: {seq: [{word: [比]}], gap: 0}
  pool: [比, 跟, 和, 像, 对]
结果补语:
  en: |
    A second verb or adjective after the verb tells its **result**: **看完** "finish reading", **听懂** "understand (by listening)", **找到** "find", **写错** "write wrongly". Negated with **没**: **我没听懂**.
  pt: |
    Um segundo verbo ou adjetivo depois do verbo diz o **resultado**: **看完** "terminar de ler", **听懂** "entender (ouvindo)", **找到** "encontrar", **写错** "escrever errado". Nega-se com **没**: **我没听懂**.
  de: |
    Ein zweites Verb oder Adjektiv nach dem Verb nennt sein **Ergebnis**: **看完** „zu Ende lesen“, **听懂** „(beim Hören) verstehen“, **找到** „finden“, **写错** „falsch schreiben“. Verneint mit **没**: **我没听懂**.
  mk: |
    Втор глагол или придавка по глаголот го кажува неговиот **резултат** — слично на македонските свршени глаголи: **看完** „дочита“, **听懂** „разбере (слушајќи)“, **找到** „најде“, **写错** „погрешно напише“. Одречно со **没**: **我没听懂**.
  ar: |
    فعل أو صفة ثانية بعد الفعل تبيّن **نتيجته**: **看完** «أنهى القراءة»، **听懂** «فهم (سماعًا)»، **找到** «وجد»، **写错** «أخطأ في الكتابة». والنفي بـ **没**: **我没听懂**.
  match: {seq: [{pos: verb}, {word: [完, 懂, 到, 错, 好, 见, 会, 住, 走, 掉]}], gap: 1}
  pool: [完, 懂, 到, 错, 好, 见, 会, 住]
趋向补语:
  en: |
    **来** (towards the speaker) and **去** (away), alone or after **上 下 进 出 回 过 起**, give direction: **进来** "come in", **拿出去** "take out", **站起来** "stand up". Some have figurative senses: **想起来** "recall", **看起来** "seem".
  pt: |
    **来** (em direção a quem fala) e **去** (afastando-se), sozinhos ou depois de **上 下 进 出 回 过 起**, dão a direção: **进来** "entrar (para cá)", **拿出去** "levar para fora", **站起来** "levantar-se". Alguns têm sentido figurado: **想起来** "lembrar", **看起来** "parecer".
  de: |
    **来** (zum Sprecher hin) und **去** (weg), allein oder nach **上 下 进 出 回 过 起**, geben die Richtung an — wie deutsch *herein / hinaus*: **进来** „hereinkommen“, **拿出去** „hinausbringen“, **站起来** „aufstehen“. Manche haben übertragene Bedeutungen: **想起来** „sich erinnern“, **看起来** „aussehen, scheinen“.
  mk: |
    **来** (кон говорителот) и **去** (од него), сами или по **上 下 进 出 回 过 起**, даваат насока: **进来** „влезе (тука)“, **拿出去** „изнесе“, **站起来** „стане“. Некои имаат преносно значење: **想起来** „се сети“, **看起来** „изгледа“.
  ar: |
    **来** (نحو المتكلم) و**去** (بعيدًا عنه)، وحدهما أو بعد **上 下 进 出 回 过 起**، تعطيان الاتجاه: **进来** «ادخل (إلى هنا)»، **拿出去** «أخرجه»، **站起来** «قام واقفًا». ولبعضها معانٍ مجازية: **想起来** «تذكّر»، **看起来** «يبدو».
  match: {seq: [{pos: verb}, {word: [来, 去, 上来, 下来, 进来, 出来, 回来, 过来, 起来, 上去, 下去, 进去, 出去, 回去, 过去]}], gap: 1}
  pool: [来, 去, 起来, 下来, 出来, 回来, 进来, 过去]
状态补语:
  en: |
    **Verb + 得 + description** says how an action is done: **他说得很快** "He speaks fast", **你写得真好** "You write really well". With an object the verb is repeated: **他说汉语说得很好**.
  pt: |
    **Verbo + 得 + descrição** diz como a ação é feita: **他说得很快** "Ele fala rápido", **你写得真好** "Você escreve muito bem". Com objeto o verbo se repete: **他说汉语说得很好**.
  de: |
    **Verb + 得 + Beschreibung** sagt, wie eine Handlung ausgeführt wird: **他说得很快** „Er spricht schnell“, **你写得真好** „Du schreibst wirklich gut“. Mit Objekt wird das Verb wiederholt: **他说汉语说得很好**.
  mk: |
    **Глагол + 得 + опис** кажува како се врши дејството: **他说得很快** „Зборува брзо“, **你写得真好** „Пишуваш навистина убаво“. Со предмет глаголот се повторува: **他说汉语说得很好**.
  ar: |
    **الفعل + 得 + وصف** يقول كيف يُؤدّى الفعل: **他说得很快** «يتكلم بسرعة»، **你写得真好** «تكتب جيدًا حقًا». ومع المفعول يُكرَّر الفعل: **他说汉语说得很好**.
  match: {seq: [{pos: verb}, {word: [得]}], gap: 1}
  pool: [得, 的, 地, 了]
可能补语:
  en: |
    **得 / 不** between a verb and its complement says whether something **can** be done: **听得懂** "can understand", **听不懂** "can't understand", **看不见** "can't see", **买不到** "can't get (to buy)".
  pt: |
    **得 / 不** entre o verbo e o complemento diz se algo **pode** ser feito: **听得懂** "consegue entender", **听不懂** "não consegue entender", **看不见** "não consegue ver", **买不到** "não consegue comprar".
  de: |
    **得 / 不** zwischen Verb und Ergänzung sagt, ob etwas getan werden **kann**: **听得懂** „kann verstehen“, **听不懂** „kann nicht verstehen“, **看不见** „kann nicht sehen“, **买不到** „kann nicht bekommen (kaufen)“.
  mk: |
    **得 / 不** меѓу глаголот и дополнувањето кажува дали нешто **може** да се направи: **听得懂** „може да разбере“, **听不懂** „не може да разбере“, **看不见** „не може да види“, **买不到** „не може да најде (да купи)“.
  ar: |
    **得 / 不** بين الفعل ومتمّمه تقول هل **يمكن** فعل الشيء: **听得懂** «يستطيع أن يفهم»، **听不懂** «لا يستطيع أن يفهم»، **看不见** «لا يستطيع أن يرى»، **买不到** «لا يجده (للشراء)».
  match: {seq: [{pos: verb}, {word: [得, 不]}, {word: [懂, 见, 到, 完, 了, 起, 动, 开, 清楚, 下, 上]}], gap: 1}
  pool: [得, 不, 没, 了]
持续态:
  en: |
    **着** after a verb: a state that continues, or the manner of another action: **门开着** "The door is open", **他笑着说** "he said with a smile".
  pt: |
    **着** depois do verbo: um estado que continua, ou o modo de outra ação: **门开着** "A porta está aberta", **他笑着说** "ele disse sorrindo".
  de: |
    **着** nach einem Verb: ein andauernder Zustand oder die Art einer anderen Handlung: **门开着** „Die Tür ist offen“, **他笑着说** „er sagte lächelnd“.
  mk: |
    **着** по глагол: состојба што трае, или начинот на друго дејство: **门开着** „Вратата е отворена“, **他笑着说** „рече насмеано“.
  ar: |
    **着** بعد الفعل: حال مستمرة، أو هيئة فعل آخر: **门开着** «الباب مفتوح»، **他笑着说** «قال مبتسمًا».
  match: {seq: [{pos: verb}, {word: [着]}], gap: 1}
  pool: [着, 了, 过, 的]
经历态:
  en: |
    **过** after a verb: something has happened at least once — experience: **我吃过北京烤鸭** "I've eaten Peking duck". Negative: **没(有)…过**: **我没去过**.
  pt: |
    **过** depois do verbo: algo já aconteceu ao menos uma vez — experiência: **我吃过北京烤鸭** "Já comi pato laqueado". Negativa: **没(有)…过**: **我没去过**.
  de: |
    **过** nach einem Verb: etwas ist mindestens einmal geschehen — Erfahrung: **我吃过北京烤鸭** „Ich habe schon Pekingente gegessen“. Verneint: **没(有)…过**: **我没去过**.
  mk: |
    **过** по глагол: нешто се случило барем еднаш — искуство: **我吃过北京烤鸭** „Сум јадел пекиншка патка“. Одречно: **没(有)…过**: **我没去过**.
  ar: |
    **过** بعد الفعل: حدث الشيء مرة على الأقل — تجربة: **我吃过北京烤鸭** «سبق أن أكلت بطّ بكين». والنفي: **没(有)…过**: **我没去过**.
  match: {seq: [{pos: verb}, {word: [过]}], gap: 1}
  pool: [过, 了, 着, 的]
完成态:
  en: |
    **了** after a verb: the action is complete: **我吃了饭** "I've eaten". With a number or description of the object it sounds natural; negated by **没** (not 不了).
  pt: |
    **了** depois do verbo: a ação está concluída: **我吃了饭** "Comi". Fica natural com número ou descrição do objeto; nega-se com **没** (não 不了).
  de: |
    **了** nach einem Verb: die Handlung ist abgeschlossen: **我吃了饭** „Ich habe gegessen“. Mit einer Zahl oder Beschreibung des Objekts klingt es natürlich; verneint durch **没** (nicht 不了).
  mk: |
    **了** по глагол: дејството е завршено: **我吃了饭** „Јадев“. Со број или опис на предметот звучи природно; се негира со **没** (не 不了).
  ar: |
    **了** بعد الفعل: الفعل منجز: **我吃了饭** «أكلت». ومع عدد أو وصف للمفعول يبدو طبيعيًا؛ ويُنفى بـ **没** (لا 不了).
  match: {seq: [{pos: verb}, {word: [了]}], gap: 1}
  pool: [了, 过, 着, 的]
进行态:
  en: |
    **在 / 正在 / 正** before a verb (often with **呢** at the end): an action in progress: **我在看书** "I'm reading", **他正在打电话呢** "He's on the phone".
  pt: |
    **在 / 正在 / 正** antes do verbo (muitas vezes com **呢** no fim): ação em andamento: **我在看书** "Estou lendo", **他正在打电话呢** "Ele está ao telefone".
  de: |
    **在 / 正在 / 正** vor einem Verb (oft mit **呢** am Ende): eine laufende Handlung: **我在看书** „Ich lese gerade“, **他正在打电话呢** „Er telefoniert gerade“.
  mk: |
    **在 / 正在 / 正** пред глагол (често со **呢** на крајот): дејство во тек: **我在看书** „Читам (во моментов)“, **他正在打电话呢** „Тој сега зборува на телефон“.
  ar: |
    **在 / 正在 / 正** قبل الفعل (وكثيرًا مع **呢** في الآخر): فعل جارٍ: **我在看书** «أنا أقرأ الآن»، **他正在打电话呢** «إنه يتحدث في الهاتف».
  match: {seq: [{word: [在, 正在, 正]}, {pos: verb}], gap: 0}
  pool: [在, 正在, 正, 要, 会]
变化态:
  en: |
    **了** at the end of a sentence: a **new situation**, a change: **下雨了** "It's raining now", **我饿了** "I'm hungry (now)", **他不来了** "He's not coming any more".
  pt: |
    **了** no fim da frase: uma **situação nova**, uma mudança: **下雨了** "Começou a chover", **我饿了** "Fiquei com fome", **他不来了** "Ele não vem mais".
  de: |
    **了** am Satzende: eine **neue Lage**, eine Veränderung: **下雨了** „Jetzt regnet es“, **我饿了** „Ich habe (jetzt) Hunger“, **他不来了** „Er kommt nicht mehr“.
  mk: |
    **了** на крајот на реченицата: **нова ситуација**, промена: **下雨了** „Сега врне“, **我饿了** „Огладнев“, **他不来了** „Веќе нема да дојде“.
  ar: |
    **了** في آخر الجملة: **وضع جديد**، تغيّر: **下雨了** «صارت تمطر»، **我饿了** «جعت (الآن)»، **他不来了** «لم يعد قادمًا».
  match: {seq: [{word: [了], trail: "。.！!？?"}], gap: 0}
  pool: [了, 吗, 呢, 吧, 的]
存现句:
  en: |
    **Place + verb + thing** says what exists or appears somewhere: **桌子上有一本书** "There's a book on the table", **门口站着一个人** "A man is standing at the door".
  pt: |
    **Lugar + verbo + coisa** diz o que existe ou aparece em algum lugar: **桌子上有一本书** "Há um livro na mesa", **门口站着一个人** "Há um homem de pé na porta".
  de: |
    **Ort + Verb + Sache** sagt, was irgendwo existiert oder erscheint: **桌子上有一本书** „Auf dem Tisch liegt ein Buch“, **门口站着一个人** „An der Tür steht ein Mann“.
  mk: |
    **Место + глагол + нешто** кажува што постои или се појавува некаде: **桌子上有一本书** „На масата има книга“, **门口站着一个人** „На вратата стои човек“.
  ar: |
    **مكان + فعل + شيء** يقول ما يوجد أو يظهر في مكان ما: **桌子上有一本书** «على الطاولة كتاب»، **门口站着一个人** «عند الباب يقف رجل».
  match: {seq: [{word: [上, 里, 下, 边, 前, 后]}, {word: [有, 是]}], gap: 1}
  pool: [有, 是, 在, 着]
连动句:
  en: |
    Two verbs in a row, the second the purpose or manner of the first: **我去商店买东西** "I'm going to the shop to buy things", **他坐飞机去上海** "He goes to Shanghai by plane".
  pt: |
    Dois verbos seguidos, o segundo dizendo a finalidade ou o modo do primeiro: **我去商店买东西** "Vou à loja comprar coisas", **他坐飞机去上海** "Ele vai a Xangai de avião".
  de: |
    Zwei Verben hintereinander, das zweite Zweck oder Art des ersten: **我去商店买东西** „Ich gehe in den Laden, um einzukaufen“, **他坐飞机去上海** „Er fliegt nach Shanghai“.
  mk: |
    Два глагола еден по друг, вториот е цел или начин на првиот: **我去商店买东西** „Одам во продавница да купам нешто“, **他坐飞机去上海** „Оди во Шангај со авион“.
  ar: |
    فعلان متتاليان، الثاني غاية الأول أو كيفيته: **我去商店买东西** «أذهب إلى المتجر لأشتري أشياء»، **他坐飞机去上海** «يذهب إلى شنغهاي بالطائرة».
  match: {seq: [{word: [去, 来]}, {pos: noun}, {pos: verb}], gap: 0}
  pool: [去, 来, 在, 到]
双宾语句:
  en: |
    Verbs of giving and telling take two objects, the person first: **他给我一本书** "He gave me a book", **老师教我们汉语** "The teacher teaches us Chinese".
  pt: |
    Verbos de dar e dizer levam dois objetos, a pessoa primeiro: **他给我一本书** "Ele me deu um livro", **老师教我们汉语** "O professor nos ensina chinês".
  de: |
    Verben des Gebens und Sagens nehmen zwei Objekte, die Person zuerst: **他给我一本书** „Er gab mir ein Buch“, **老师教我们汉语** „Der Lehrer bringt uns Chinesisch bei“.
  mk: |
    Глаголите на давање и кажување земаат два предмета, личноста прва: **他给我一本书** „Ми даде книга“, **老师教我们汉语** „Наставникот нѐ учи кинески“.
  ar: |
    أفعال الإعطاء والإخبار تأخذ مفعولين، الشخص أولًا: **他给我一本书** «أعطاني كتابًا»، **老师教我们汉语** «يعلّمنا المعلم الصينية».
  match: {seq: [{word: [给, 教, 问, 告诉, 送, 还]}, {pos: pron}], gap: 0}
  pool: [给, 教, 问, 告诉, 送, 让]
兼语句:
  en: |
    The object of the first verb is the subject of the second: **我请他吃饭** "I invite him to eat", **妈妈让我去** "Mum told me to go", **这件事使我很高兴** "This made me happy".
  pt: |
    O objeto do primeiro verbo é o sujeito do segundo: **我请他吃饭** "Convido-o para comer", **妈妈让我去** "Mamãe mandou eu ir", **这件事使我很高兴** "Isso me deixou feliz".
  de: |
    Das Objekt des ersten Verbs ist Subjekt des zweiten: **我请他吃饭** „Ich lade ihn zum Essen ein“, **妈妈让我去** „Mama hat mich gehen lassen / geschickt“, **这件事使我很高兴** „Das hat mich sehr gefreut“.
  mk: |
    Предметот на првиот глагол е подмет на вториот: **我请他吃饭** „Го канам на ручек“, **妈妈让我去** „Мама ми рече да одам“, **这件事使我很高兴** „Ова многу ме израдува“.
  ar: |
    مفعول الفعل الأول فاعلُ الثاني: **我请他吃饭** «أدعوه إلى الطعام»، **妈妈让我去** «طلبت مني أمي أن أذهب»، **这件事使我很高兴** «هذا الأمر أسعدني كثيرًا».
  match: {seq: [{word: [请, 让, 叫, 使]}, {pos: pron}, {pos: verb}], gap: 0}
  pool: [请, 让, 叫, 使, 给]
疑问句:
  en: |
    Questions: add **吗** (**你忙吗？**), use a question word in place (**你去哪儿？**), or put the verb affirmative + negative (**你去不去？**). **还是** asks *or*: **茶还是咖啡？**
  pt: |
    Perguntas: acrescente **吗** (**你忙吗？**), ponha a palavra interrogativa no lugar (**你去哪儿？**) ou o verbo afirmativo + negativo (**你去不去？**). **还是** pergunta *ou*: **茶还是咖啡？**
  de: |
    Fragen: **吗** anhängen (**你忙吗？**), ein Fragewort an die Stelle setzen (**你去哪儿？**) oder das Verb bejaht + verneint (**你去不去？**). **还是** fragt nach *oder*: **茶还是咖啡？**
  mk: |
    Прашања: додај **吗** (**你忙吗？**), стави прашален збор на местото (**你去哪儿？**), или глаголот потврдно + одречно (**你去不去？**). **还是** прашува *или*: **茶还是咖啡？**
  ar: |
    الأسئلة: أضف **吗** (**你忙吗？**)، أو ضع أداة استفهام في موضع الجواب (**你去哪儿？**)، أو الفعل مثبتًا + منفيًا (**你去不去？**). و**还是** تسأل *أم*: **茶还是咖啡？**
  match: {seq: [{word: [吗, 呢, 什么, 哪儿, 谁, 怎么, 为什么, 几, 多少]}], gap: 0}
  pool: [吗, 呢, 什么, 哪儿, 谁, 怎么, 几]
祈使句:
  en: |
    Requests and commands: the plain verb (**进来！**), **请** for politeness (**请坐**), **吧** to soften (**走吧**), **别 / 不要** for *don't* (**别说话**).
  pt: |
    Pedidos e ordens: o verbo simples (**进来！**), **请** por educação (**请坐**), **吧** para suavizar (**走吧**), **别 / 不要** para *não* (**别说话**).
  de: |
    Bitten und Befehle: das bloße Verb (**进来！**), **请** für Höflichkeit (**请坐**), **吧** zum Abmildern (**走吧**), **别 / 不要** für *nicht* (**别说话**).
  mk: |
    Барања и наредби: голиот глагол (**进来！**), **请** за учтивост (**请坐**), **吧** за ублажување (**走吧**), **别 / 不要** за *немој* (**别说话**).
  ar: |
    الطلب والأمر: الفعل المجرد (**进来！**)، و**请** للتهذيب (**请坐**)، و**吧** للتلطيف (**走吧**)، و**别 / 不要** للنهي (**别说话**).
  match: {seq: [{word: [请, 别, 不要], start: true}], gap: 0}
  pool: [请, 别, 不要, 让, 要]
感叹句:
  en: |
    Exclamations: **太……了** (**太好了！** "Great!"), **真** (**真漂亮！**), **多(么)……啊** (**多美啊！** "How beautiful!").
  pt: |
    Exclamações: **太……了** (**太好了！** "Ótimo!"), **真** (**真漂亮！**), **多(么)……啊** (**多美啊！** "Que lindo!").
  de: |
    Ausrufe: **太……了** (**太好了！** „Super!“), **真** (**真漂亮！**), **多(么)……啊** (**多美啊！** „Wie schön!“).
  mk: |
    Извици: **太……了** (**太好了！** „Одлично!“), **真** (**真漂亮！**), **多(么)……啊** (**多美啊！** „Колку убаво!“).
  ar: |
    التعجب: **太……了** (**太好了！** «رائع!»)، **真** (**真漂亮！**)، **多(么)……啊** (**多美啊！** «ما أجمله!»).
  match: {seq: [{word: [太, 真, 多么]}, {pos: adj}], gap: 0}
  pool: [太, 真, 多么, 很, 最]
