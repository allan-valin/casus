id: B1
topics:

- title: {en: Clauses, pt: Orações}
  lessons:
  - id: id-yang
    title: yang, bahwa, kalau, karena
    meaning: {en: "which, that, if, because", pt: "que, se, porque"}
    intro:
      en: |
        **yang** (who, which; also *the one that*): **orang yang tinggal di sana** (the person who lives there), **yang merah** (the red one). **bahwa** (that): **Saya tahu bahwa dia akan datang.** **kalau / jika** (if), **karena** (because), **tetapi** (but), **supaya** (so that).
      pt: |
        **yang** (que; também *o que é*): **orang yang tinggal di sana** (a pessoa que mora ali), **yang merah** (o vermelho). **bahwa** (que): **Saya tahu bahwa dia akan datang** (sei que ele vai vir). **kalau / jika** (se), **karena** (porque), **tetapi** (mas), **supaya** (para que).
    examples:
    - ["Saya tahu bahwa dia akan datang.", "I know he will come.", "Sei que ele vai vir.", "bahwa"]
    match: {seq: [{word: [yang, bahwa, kalau, jika, karena, tetapi, supaya, ketika]}]}
    pool: [yang, bahwa, kalau, karena, tetapi, supaya]
