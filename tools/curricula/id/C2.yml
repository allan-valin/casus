id: C2
topics:

- title: {en: History and variety, pt: História e variedade}
  lessons:
  - id: id-malay
    title: bahasa Melayu, ejaan lama
    meaning: {en: "Malay, and the old spelling", pt: "o malaio e a grafia antiga"}
    intro:
      en: |
        Indonesian is a standardised Malay, the language of trade across the archipelago, chosen as the national language by the Youth Pledge of 1928. Malaysian Malay differs in some words (**kereta** car in Malaysia, *train* in Indonesia). Before 1972 Indonesian spelled **oe** for *u*, **tj** for *c*, **dj** for *j* (**Soekarno**, **Djakarta**).
      pt: |
        O indonésio é um malaio padronizado, a língua do comércio no arquipélago, escolhida como língua nacional pelo Juramento da Juventude de 1928. O malaio da Malásia difere em algumas palavras (**kereta** é carro na Malásia, *trem* na Indonésia). Antes de 1972 o indonésio grafava **oe** por *u*, **tj** por *c*, **dj** por *j* (**Soekarno**, **Djakarta**).
    examples:
    - ["Kami putra dan putri Indonesia menjunjung bahasa persatuan, bahasa Indonesia.", "We, the sons and daughters of Indonesia, uphold the language of unity, Indonesian.", "Nós, filhos e filhas da Indonésia, honramos a língua da união, o indonésio.", "persatuan"]
    match: {seq: [{word: [melayu, bahasa, persatuan, indonesia]}]}
    pool: [bahasa, Melayu, persatuan]
