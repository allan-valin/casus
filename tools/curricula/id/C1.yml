id: C1
topics:

- title: {en: Register, pt: Registro}
  lessons:
  - id: id-formal
    title: Bapak, Ibu, saya; gue, lo
    meaning: {en: "formal Indonesian and Jakarta slang", pt: "indonésio formal e gíria de Jacarta"}
    intro:
      en: |
        Polite address uses **Bapak / Pak** (sir) and **Ibu / Bu** (madam) instead of *you*: **Bapak mau ke mana?** (where are you going, sir?). Jakarta slang says **gue** (I) and **lo** (you), **nggak** for *tidak*, **udah** for *sudah*. Formal writing keeps the full affixes and **adalah**.
      pt: |
        O tratamento educado usa **Bapak / Pak** (senhor) e **Ibu / Bu** (senhora) no lugar de *você*: **Bapak mau ke mana?** (aonde o senhor vai?). A gíria de Jacarta diz **gue** (eu) e **lo** (você), **nggak** por *tidak*, **udah** por *sudah*. A escrita formal mantém os afixos completos e **adalah**.
    examples:
    - ["Bapak mau ke mana?", "Where are you going, sir?", "Aonde o senhor vai?", "Bapak"]
    match: {seq: [{word: [bapak, pak, ibu, bu, gue, lo, nggak, udah]}]}
    pool: [Bapak, Ibu, Pak, Bu]
