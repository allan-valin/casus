# German text of the Indonesian course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and words: "Laute und Wörter"
  Pronouns and sentences: "Pronomen und Sätze"
  Verbs: "Verben"
  Questions and negation: "Fragen und Verneinung"
  Places and numbers: "Orte und Zahlen"
  Verb affixes: "Verbaffixe"
  Clauses: "Nebensätze"
  Nouns from roots: "Nomen aus Wurzeln"
  Register: "Register"
  History and variety: "Geschichte und Vielfalt"
lessons:
  id-spelling:
    meaning: "die Schreibung ist regelmäßig"
    intro: |
      Indonesisch wird geschrieben, wie es gesprochen wird: **c** ist *tsch* (**cari** suchen), **j** ist *dsch* (**jalan** Straße), **ng** wie in *singen*, **ny** wie *nj*, **r** gerollt. Die Betonung ist leicht, meist auf der vorletzten Silbe. Keine Artikel, kein Genus, keine Pluralendung, keine Konjugation.
  id-plural:
    meaning: "Plural durch Verdopplung oder gar nicht"
    intro: |
      Ein Nomen ist Singular oder Plural nach dem Zusammenhang; um die Mehrzahl zu betonen, wird es verdoppelt: **anak-anak** (Kinder), **buku-buku** (Bücher). Nach Zahlen und **banyak** (viele) nicht: **dua buku**, **banyak anak**.
  id-pronouns:
    meaning: "Pronomen; wir mit und ohne dich"
    intro: |
      **saya** (ich, neutral) / **aku** (ich, vertraut), **Anda** (Sie) / **kamu** (du), **dia** (er, sie), **kami** (wir, *ohne* dich) / **kita** (wir, *mit* dir), **kalian** (ihr), **mereka** (sie). Der Besitzer folgt dem Nomen: **rumah saya** (mein Haus), **buku dia** oder **bukunya** (sein Buch).
  id-adalah:
    meaning: "kein Verb „sein“; adalah, ini, itu"
    intro: |
      Nomen und Adjektive werden ohne Verb verbunden: **Saya guru** (ich bin Lehrer), **Rumahnya besar** (sein Haus ist groß). **adalah** verbindet schriftlich zwei Nomen: **Jakarta adalah ibu kota Indonesia** (Jakarta ist die Hauptstadt Indonesiens). **ini** (dies) und **itu** (das) folgen dem Nomen: **buku ini** (dieses Buch).
  id-word-order:
    meaning: "das Bestimmende folgt"
    intro: |
      Alles, was ein Nomen beschreibt, steht danach: **rumah besar** (ein großes Haus), **rumah besar saya** (mein großes Haus), **rumah besar itu** (jenes große Haus). Subjekt – Verb – Objekt: **Saya membaca buku** (ich lese ein Buch).
  id-men:
    meaning: "das Aktivpräfix meN-"
    intro: |
      Die meisten Handlungsverben nehmen **meN-**, das sich nach dem ersten Laut richtet: **baca → membaca** (lesen), **tulis → menulis** (schreiben), **kirim → mengirim** (schicken), **sapu → menyapu** (fegen). Manche häufige Verben haben keins: **makan, minum, pergi, tidur** (essen, trinken, gehen, schlafen).
  id-time:
    meaning: "Zeitwörter statt Tempora"
    intro: |
      Verben ändern sich nicht nach der Zeit; kleine Wörter übernehmen das: **sudah** (schon), **sedang** (gerade dabei), **akan** (wird), **belum** (noch nicht), **pernah** (schon einmal). **Saya sudah makan** (ich habe schon gegessen), **Dia akan datang** (er wird kommen).
  id-questions:
    meaning: "Fragewörter; apakah"
    intro: |
      **apa** (was), **siapa** (wer), **di mana** (wo), **ke mana** (wohin), **kapan** (wann), **mengapa / kenapa** (warum), **bagaimana** (wie), **berapa** (wie viele). Ja/Nein-Fragen: steigende Stimme oder **apakah** am Anfang: **Apakah Anda bisa berbahasa Inggris?** (sprechen Sie Englisch?)
  id-tidak:
    meaning: "drei Verneinungen"
    intro: |
      **tidak** verneint Verben und Adjektive (**Saya tidak mengerti** ich verstehe nicht), **bukan** verneint Nomen (**Dia bukan guru** — er ist kein Lehrer), **jangan** verbietet (**Jangan pergi!** geh nicht). **belum** = noch nicht.
  id-di-ke-dari:
    meaning: "in, nach, von"
    intro: |
      **di** (in, an: **di rumah** zu Hause), **ke** (nach, zu: **ke kota** in die Stadt), **dari** (von, aus: **dari Bandung**). Mit Ortswörtern: **di atas** (oben), **di bawah** (unten), **di dalam** (drinnen), **di depan** (vorn).
  id-numbers:
    meaning: "Zahlen und Zählwörter"
    intro: |
      **satu, dua, tiga, empat, lima, enam, tujuh, delapan, sembilan, sepuluh**; **sebelas** (11), **dua puluh** (20), **seratus** (100), **seribu** (1000). Zählwörter: **seorang** (eine Person), **sebuah** (ein Ding), **dua ekor kucing** (zwei Katzen).
  id-di:
    meaning: "das Passiv di-"
    intro: |
      **di-** + Wurzel bildet das im Indonesischen sehr häufige Passiv: **Buku itu dibaca oleh Sari** (das Buch wird von Sari gelesen), **Surat ini ditulis kemarin** (dieser Brief wurde gestern geschrieben). Mit *ich* oder *du* steht der Urheber vor der Wurzel: **buku itu saya baca** (das Buch lese ich).
  id-ber:
    meaning: "ber-: tun, haben"
    intro: |
      **ber-** bildet intransitive Verben des Tuns oder Habens: **main → bermain** (spielen), **kerja → bekerja** (arbeiten), **bahasa → berbahasa** (eine Sprache sprechen), **sepeda → bersepeda** (Rad fahren).
  id-kan-i:
    meaning: "die Suffixe -kan und -i"
    intro: |
      **-kan** heißt oft *veranlassen* oder *für jemanden*: **memberikan** (etwas geben), **membukakan** (jemandem öffnen); **-i** zeigt auf einen betroffenen Ort oder eine Person: **menanyai** (jemanden befragen), **mendekati** (sich nähern).
  id-yang:
    meaning: "der, dass, wenn, weil"
    intro: |
      **yang** (der, welcher; auch *der … ist*): **orang yang tinggal di sana** (die Person, die dort wohnt), **yang merah** (der rote). **bahwa** (dass): **Saya tahu bahwa dia akan datang** (ich weiß, dass er kommt). **kalau / jika** (wenn), **karena** (weil), **tetapi** (aber), **supaya** (damit).
  id-pe-an:
    meaning: "Nominalaffixe peN-, -an, peN-…-an, ke-…-an"
    intro: |
      Von **baca** (lesen): **pembaca** (Leser), **bacaan** (Lektüre), **pembacaan** (das Lesen). **ke-…-an** bildet Abstrakta: **bersih → kebersihan** (Sauberkeit), **merdeka → kemerdekaan** (Unabhängigkeit).
  id-formal:
    meaning: "förmliches Indonesisch und Jakarta-Slang"
    intro: |
      Höfliche Anrede nimmt **Bapak / Pak** (Herr) und **Ibu / Bu** (Frau) statt *Sie*: **Bapak mau ke mana?** (wohin gehen Sie, mein Herr?). Jakarta-Slang sagt **gue** (ich) und **lo** (du), **nggak** für *tidak*, **udah** für *sudah*. Schriftsprache behält die vollen Affixe und **adalah**.
  id-malay:
    meaning: "Malaiisch und die alte Schreibung"
    intro: |
      Indonesisch ist ein standardisiertes Malaiisch, die Handelssprache des Archipels, 1928 im Jugendschwur zur Nationalsprache gewählt. Das Malaiische Malaysias weicht in manchen Wörtern ab (**kereta** ist in Malaysia das Auto, in Indonesien der Zug). Vor 1972 schrieb man **oe** für *u*, **tj** für *c*, **dj** für *j* (**Soekarno**, **Djakarta**).
