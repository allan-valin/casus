# Arabic text of the Indonesian course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and words: "الأصوات والكلمات"
  Pronouns and sentences: "الضمائر والجمل"
  Verbs: "الأفعال"
  Questions and negation: "الأسئلة والنفي"
  Places and numbers: "الأماكن والأعداد"
  Verb affixes: "زوائد الأفعال"
  Clauses: "الجمل"
  Nouns from roots: "الأسماء من الجذور"
  Register: "مستوى اللغة"
  History and variety: "التاريخ والتنوّع"
lessons:
  id-spelling:
    meaning: "الإملاء منتظم"
    intro: |
      تُكتب الإندونيسية كما تُنطق: **c** = *تش* (**cari** بحث)، **j** = *ج* (**jalan** طريق)، **ng** كما في الإنجليزية *sing*، **ny** = *ني*، و**r** مكرّرة. والنبر خفيف، غالبًا على المقطع قبل الأخير. لا أداة تعريف ولا جنس ولا لاحقة جمع ولا تصريف للفعل.
  id-plural:
    meaning: "الجمع بالتكرار أو بلا علامة"
    intro: |
      الاسم مفرد أو جمع بحسب السياق؛ ولتوكيد الجمع يُكرَّر: **anak-anak** (أطفال)، **buku-buku** (كتب). وبعد الأعداد و**banyak** (كثير) لا يُكرَّر: **dua buku**، **banyak anak**.
  id-pronouns:
    meaning: "الضمائر؛ نحن معك وبدونك"
    intro: |
      **saya** (أنا، محايدة) / **aku** (أنا، مألوفة)، **Anda** (حضرتك) / **kamu** (أنت)، **dia** (هو، هي)، **kami** (نحن *بدونك*) / **kita** (نحن *معك*)، **kalian** (أنتم)، **mereka** (هم). والمالك يأتي بعد الاسم: **rumah saya** (بيتي)، **buku dia** أو **bukunya** (كتابه).
  id-adalah:
    meaning: "لا فعل للكون؛ adalah، ini، itu"
    intro: |
      تُربط الأسماء والصفات بلا فعل، كالجملة الاسمية: **Saya guru** (أنا معلّم)، **Rumahnya besar** (بيته كبير). و**adalah** تربط اسمين في الكتابة: **Jakarta adalah ibu kota Indonesia** (جاكرتا عاصمة إندونيسيا). و**ini** (هذا) و**itu** (ذلك) تأتيان بعد الاسم: **buku ini** (هذا الكتاب).
  id-word-order:
    meaning: "الوصف يأتي بعد الموصوف"
    intro: |
      كل ما يصف الاسم يأتي بعده، كالعربية: **rumah besar** (بيت كبير)، **rumah besar saya** (بيتي الكبير)، **rumah besar itu** (ذلك البيت الكبير). والترتيب فاعل – فعل – مفعول: **Saya membaca buku** (أقرأ كتابًا).
  id-men:
    meaning: "السابقة الفاعلة meN-"
    intro: |
      أكثر أفعال الحركة تأخذ **meN-** التي تتغيّر بحسب الصوت الأول: **baca → membaca** (يقرأ)، **tulis → menulis** (يكتب)، **kirim → mengirim** (يرسل)، **sapu → menyapu** (يكنس). وبعض الأفعال الشائعة بلا سابقة: **makan, minum, pergi, tidur** (يأكل، يشرب، يذهب، ينام).
  id-time:
    meaning: "كلمات الزمن بدل الأزمنة"
    intro: |
      لا يتغيّر الفعل بالزمن؛ بل تتولّى ذلك كلمات صغيرة: **sudah** (قد، سبق)، **sedang** (في أثناء)، **akan** (سوف)، **belum** (لم … بعد)، **pernah** (سبق أن). **Saya sudah makan** (أكلت)، **Dia akan datang** (سيأتي).
  id-questions:
    meaning: "أدوات الاستفهام؛ apakah"
    intro: |
      **apa** (ماذا)، **siapa** (من)، **di mana** (أين)، **ke mana** (إلى أين)، **kapan** (متى)، **mengapa / kenapa** (لماذا)، **bagaimana** (كيف)، **berapa** (كم). وأسئلة نعم/لا بالنبرة أو بـ**apakah** في البداية: **Apakah Anda bisa berbahasa Inggris?** (هل تتكلّم الإنجليزية؟)
  id-tidak:
    meaning: "ثلاثة أنواع من النفي"
    intro: |
      **tidak** تنفي الأفعال والصفات (**Saya tidak mengerti** لا أفهم)، و**bukan** تنفي الأسماء (**Dia bukan guru** — ليس معلّمًا)، و**jangan** للنهي (**Jangan pergi!** لا تذهب). و**belum** = لم … بعد.
  id-di-ke-dari:
    meaning: "في، إلى، من"
    intro: |
      **di** (في: **di rumah** في البيت)، **ke** (إلى: **ke kota** إلى المدينة)، **dari** (من: **dari Bandung**). ومع كلمات المكان: **di atas** (فوق)، **di bawah** (تحت)، **di dalam** (داخل)، **di depan** (أمام).
  id-numbers:
    meaning: "الأعداد والمصنِّفات"
    intro: |
      **satu, dua, tiga, empat, lima, enam, tujuh, delapan, sembilan, sepuluh**؛ **sebelas** (11)، **dua puluh** (20)، **seratus** (100)، **seribu** (1000). وكلمات العدّ: **seorang** (شخص واحد)، **sebuah** (شيء واحد)، **dua ekor kucing** (قطّتان).
  id-di:
    meaning: "المجهول بـ di-"
    intro: |
      **di-** + الجذر تصنع المجهول، وهو شائع جدًا: **Buku itu dibaca oleh Sari** (يُقرأ ذلك الكتاب من قِبَل ساري)، **Surat ini ditulis kemarin** (كُتبت هذه الرسالة أمس). ومع *أنا* أو *أنت* يتقدّم الفاعل على الجذر: **buku itu saya baca** (ذلك الكتاب أقرؤه).
  id-ber:
    meaning: "ber-: الفعل والملكية"
    intro: |
      **ber-** تصنع أفعالًا لازمة للنشاط أو الملكية: **main → bermain** (يلعب)، **kerja → bekerja** (يعمل)، **bahasa → berbahasa** (يتكلّم لغة)، **sepeda → bersepeda** (يركب الدراجة).
  id-kan-i:
    meaning: "اللاحقتان -kan و -i"
    intro: |
      **-kan** تعني غالبًا *التسبيب* أو *لأجل أحد*: **memberikan** (يعطي شيئًا)، **membukakan** (يفتح لأحد)؛ و**-i** تشير إلى مكان أو شخص متأثّر: **menanyai** (يستجوب أحدًا)، **mendekati** (يقترب من).
  id-yang:
    meaning: "الذي، أنّ، إذا، لأنّ"
    intro: |
      **yang** (الذي؛ وأيضًا *ما هو*): **orang yang tinggal di sana** (الشخص الذي يسكن هناك)، **yang merah** (الأحمر). و**bahwa** (أنّ): **Saya tahu bahwa dia akan datang** (أعرف أنه سيأتي). **kalau / jika** (إذا)، **karena** (لأنّ)، **tetapi** (لكن)، **supaya** (لكي).
  id-pe-an:
    meaning: "زوائد الأسماء peN-، -an، peN-…-an، ke-…-an"
    intro: |
      من **baca** (قرأ): **pembaca** (قارئ)، **bacaan** (مقروء)، **pembacaan** (القراءة). و**ke-…-an** تصنع المجرّدات: **bersih → kebersihan** (نظافة)، **merdeka → kemerdekaan** (استقلال).
  id-formal:
    meaning: "الإندونيسية الرسمية وعامية جاكرتا"
    intro: |
      المخاطبة المهذّبة تستعمل **Bapak / Pak** (سيدي) و**Ibu / Bu** (سيدتي) بدل *أنت*: **Bapak mau ke mana?** (إلى أين تذهب يا سيدي؟). وعامية جاكرتا تقول **gue** (أنا) و**lo** (أنت)، و**nggak** بدل *tidak*، و**udah** بدل *sudah*. والكتابة الرسمية تحتفظ بالزوائد كاملة وبـ**adalah**.
  id-malay:
    meaning: "الملايوية والإملاء القديم"
    intro: |
      الإندونيسية ملايوية موحّدة، لغة التجارة في الأرخبيل، اختيرت لغةً وطنية بقَسَم الشباب سنة 1928. وتختلف ملايوية ماليزيا في بعض الكلمات (**kereta** سيارة في ماليزيا وقطار في إندونيسيا). وقبل 1972 كانت تُكتب **oe** بدل *u*، و**tj** بدل *c*، و**dj** بدل *j* (**Soekarno**، **Djakarta**).
