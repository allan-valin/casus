# Macedonian text of the Indonesian course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Sounds and words: "Гласови и зборови"
  Pronouns and sentences: "Заменки и реченици"
  Verbs: "Глаголи"
  Questions and negation: "Прашања и негација"
  Places and numbers: "Места и броеви"
  Verb affixes: "Глаголски афикси"
  Clauses: "Реченици"
  Nouns from roots: "Именки од корени"
  Register: "Регистар"
  History and variety: "Историја и разновидност"
lessons:
  id-spelling:
    meaning: "правописот е правилен"
    intro: |
      Индонезискиот се пишува како што се зборува: **c** е *ч* (**cari** бара), **j** е *џ* (**jalan** пат), **ng** како во англиското *sing*, **ny** е *њ*, **r** треперливо. Нагласокот е слаб, обично на претпоследниот слог. Нема член, род, наставка за множина ни конјугација.
  id-plural:
    meaning: "множина со удвојување, или воопшто не"
    intro: |
      Именката е еднина или множина според контекстот; за да се нагласи множината, се удвојува: **anak-anak** (деца), **buku-buku** (книги). По броеви и по **banyak** (многу) не се удвојува: **dua buku**, **banyak anak**.
  id-pronouns:
    meaning: "заменки; ние со тебе и без тебе"
    intro: |
      **saya** (јас, неутрално) / **aku** (јас, блиско), **Anda** (Вие) / **kamu** (ти), **dia** (тој, таа), **kami** (ние, *без* тебе) / **kita** (ние, *со* тебе), **kalian** (вие), **mereka** (тие). Сопственикот доаѓа по именката: **rumah saya** (мојата куќа), **buku dia** или **bukunya** (неговата книга).
  id-adalah:
    meaning: "нема глагол „сум“; adalah, ini, itu"
    intro: |
      Именките и придавките се поврзуваат без глагол: **Saya guru** (наставник сум), **Rumahnya besar** (неговата куќа е голема). **adalah** поврзува две именки во писмото: **Jakarta adalah ibu kota Indonesia** (Џакарта е главниот град на Индонезија). **ini** (ова) и **itu** (она) стојат по именката: **buku ini** (оваа книга).
  id-word-order:
    meaning: "определбата доаѓа по именката"
    intro: |
      Сè што ја опишува именката доаѓа по неа: **rumah besar** (голема куќа), **rumah besar saya** (мојата голема куќа), **rumah besar itu** (онаа голема куќа). Подмет – глагол – објект: **Saya membaca buku** (читам книга).
  id-men:
    meaning: "активниот префикс meN-"
    intro: |
      Повеќето глаголи за дејство земаат **meN-**, што се менува според првиот глас: **baca → membaca** (чита), **tulis → menulis** (пишува), **kirim → mengirim** (праќа), **sapu → menyapu** (мете). Некои чести глаголи немаат префикс: **makan, minum, pergi, tidur** (јаде, пие, оди, спие).
  id-time:
    meaning: "зборови за време наместо времиња"
    intro: |
      Глаголите не се менуваат според времето; тоа го прават мали зборови: **sudah** (веќе), **sedang** (токму сега), **akan** (ќе), **belum** (уште не), **pernah** (некогаш). **Saya sudah makan** (веќе јадев), **Dia akan datang** (ќе дојде).
  id-questions:
    meaning: "прашални зборови; apakah"
    intro: |
      **apa** (што), **siapa** (кој), **di mana** (каде), **ke mana** (накаде), **kapan** (кога), **mengapa / kenapa** (зошто), **bagaimana** (како), **berapa** (колку). Прашања да/не: со интонација или со **apakah** на почетокот: **Apakah Anda bisa berbahasa Inggris?** (зборувате ли англиски?)
  id-tidak:
    meaning: "три негации"
    intro: |
      **tidak** ги негира глаголите и придавките (**Saya tidak mengerti** не разбирам), **bukan** ги негира именките (**Dia bukan guru** — тој не е наставник), **jangan** забранува (**Jangan pergi!** не оди). **belum** = уште не.
  id-di-ke-dari:
    meaning: "во, кон, од"
    intro: |
      **di** (во, на: **di rumah** дома), **ke** (кон: **ke kota** во градот), **dari** (од: **dari Bandung**). Со зборови за место: **di atas** (горе), **di bawah** (долу), **di dalam** (внатре), **di depan** (напред).
  id-numbers:
    meaning: "броеви и класификатори"
    intro: |
      **satu, dua, tiga, empat, lima, enam, tujuh, delapan, sembilan, sepuluh**; **sebelas** (11), **dua puluh** (20), **seratus** (100), **seribu** (1000). Зборови за броење: **seorang** (едно лице), **sebuah** (еден предмет), **dua ekor kucing** (две мачки).
  id-di:
    meaning: "пасивот di-"
    intro: |
      **di-** + корен го прави пасивот, многу чест во индонезискиот: **Buku itu dibaca oleh Sari** (таа книга ја чита Сари), **Surat ini ditulis kemarin** (ова писмо е напишано вчера). Со *јас* или *ти* вршителот стои пред коренот: **buku itu saya baca** (таа книга ја читам јас).
  id-ber:
    meaning: "ber-: правење, имање"
    intro: |
      **ber-** прави непреодни глаголи за дејност или имање: **main → bermain** (си игра), **kerja → bekerja** (работи), **bahasa → berbahasa** (зборува јазик), **sepeda → bersepeda** (вози велосипед).
  id-kan-i:
    meaning: "наставките -kan и -i"
    intro: |
      **-kan** често значи *предизвикува* или *за некого*: **memberikan** (дава нешто), **membukakan** (отвора за некого); **-i** покажува засегнато место или лице: **menanyai** (испрашува некого), **mendekati** (се приближува).
  id-yang:
    meaning: "што, дека, ако, зашто"
    intro: |
      **yang** (што, кој; и *оној што*): **orang yang tinggal di sana** (човекот што живее таму), **yang merah** (црвениот). **bahwa** (дека): **Saya tahu bahwa dia akan datang** (знам дека ќе дојде). **kalau / jika** (ако), **karena** (зашто), **tetapi** (но), **supaya** (за да).
  id-pe-an:
    meaning: "именски афикси peN-, -an, peN-…-an, ke-…-an"
    intro: |
      Од **baca** (чита): **pembaca** (читател), **bacaan** (лектира), **pembacaan** (читањето). **ke-…-an** прави апстрактни именки: **bersih → kebersihan** (чистота), **merdeka → kemerdekaan** (независност).
  id-formal:
    meaning: "официјален индонезиски и сленгот на Џакарта"
    intro: |
      Учтивото обраќање користи **Bapak / Pak** (господине) и **Ibu / Bu** (госпоѓо) наместо *Вие*: **Bapak mau ke mana?** (каде одите, господине?). Сленгот на Џакарта вели **gue** (јас) и **lo** (ти), **nggak** за *tidak*, **udah** за *sudah*. Писмениот стил ги задржува полните афикси и **adalah**.
  id-malay:
    meaning: "малајскиот и стариот правопис"
    intro: |
      Индонезискиот е стандардизиран малајски, трговскиот јазик на архипелагот, избран за национален јазик со Заклетвата на младината од 1928. Малајскиот во Малезија се разликува во некои зборови (**kereta** е автомобил во Малезија, воз во Индонезија). Пред 1972 се пишувало **oe** за *u*, **tj** за *c*, **dj** за *j* (**Soekarno**, **Djakarta**).
