id: B2
topics:

- title: {en: Nouns from roots, pt: Nomes a partir de raízes}
  lessons:
  - id: id-pe-an
    title: pembaca, bacaan, pembacaan
    meaning: {en: "noun affixes peN-, -an, peN-…-an, ke-…-an", pt: "afixos nominais peN-, -an, peN-…-an, ke-…-an"}
    intro:
      en: |
        From **baca** (read): **pembaca** (reader), **bacaan** (reading matter), **pembacaan** (the act of reading). **ke-…-an** makes abstracts: **bersih → kebersihan** (cleanliness), **merdeka → kemerdekaan** (independence).
      pt: |
        De **baca** (ler): **pembaca** (leitor), **bacaan** (leitura, texto), **pembacaan** (o ato de ler). **ke-…-an** forma abstratos: **bersih → kebersihan** (limpeza), **merdeka → kemerdekaan** (independência).
    examples:
    - ["Kemerdekaan Indonesia diproklamasikan pada tahun 1945.", "Indonesia's independence was proclaimed in 1945.", "A independência da Indonésia foi proclamada em 1945.", "Kemerdekaan"]
    match: {seq: [{pos: noun, re: "^(pe|ke).*an$"}]}
