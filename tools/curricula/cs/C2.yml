id: C2
topics:

- title: {en: High style, pt: Estilo elevado}
  lessons:
  - id: cs-c2-short-adjectives
    title: "jsem schopen, je spokojen"
    meaning: {en: "short (nominal) adjectives", pt: "adjetivos curtos (nominais)"}
    intro:
      en: |
        A few adjectives keep an old **short form** after **být**, agreeing in gender and number: **schopen, schopna, schopno, schopni** "capable", **spokojen** "satisfied", **jist** "sure", **ochoten** "willing", **povinen** "obliged", **vinen** "guilty", **zdráv** "healthy", **živ** "alive", **zvědav** "curious", **nucen** "forced". **Nejsem si jist.** "I'm not sure." **Je ochoten pomoci.** "He's willing to help." The long form is commoner in speech (**jsem si jistý**); the short one sounds careful and written. **rád** "glad" has only a short form.
      pt: |
        Alguns adjetivos conservam uma antiga **forma curta** depois de **být**, concordando em gênero e número: **schopen, schopna, schopno, schopni** "capaz", **spokojen** "satisfeito", **jist** "seguro", **ochoten** "disposto", **povinen** "obrigado", **vinen** "culpado", **zdráv** "saudável", **živ** "vivo", **zvědav** "curioso", **nucen** "forçado". **Nejsem si jist.** "Não tenho certeza." **Je ochoten pomoci.** "Ele está disposto a ajudar." A forma longa é mais comum na fala (**jsem si jistý**); a curta soa cuidadosa e escrita. **rád** "contente" só tem a forma curta.
    table:
      head: {en: [Long, Short masc., Short fem., Short pl. masc.], pt: [Longa, Curta masc., Curta fem., Curta pl. masc.]}
      rows:
      - [schopný, schopen, schopna, schopni]
      - [spokojený, spokojen, spokojena, spokojeni]
      - [jistý, jist, jista, jisti]
      - [ochotný, ochoten, ochotna, ochotni]
    examples:
    - ["Nejsem si jist.", "I'm not sure.", "Não tenho certeza.", "jist"]
    - ["Je ochoten nám pomoci.", "He's willing to help us.", "Ele está disposto a nos ajudar.", "ochoten"]
    - ["Jsem s výsledkem spokojen.", "I'm satisfied with the result.", "Estou satisfeito com o resultado.", "spokojen"]
    match: {seq: [{word: [schopen, schopna, schopni, schopny, spokojen, spokojena, spokojeni, jist, jista, jisti, ochoten, ochotna, ochotni, povinen, povinna, povinni, vinen, vinna, vinni, zdráv, zdráva, zdrávi, živ, živa, zvědav, zvědava, nucen, nucena, nuceni, hoden, hodna, nemocen, nemocna]}], gap: 0}
    pool: [schopen, spokojen, jist, ochoten, povinen, vinen, zvědav, schopný, jistý]

  - id: cs-c2-bookish-conjunctions
    title: "neboť, nýbrž, jelikož, avšak"
    meaning: {en: "conjunctions of written style", pt: "conjunções do estilo escrito"}
    intro:
      en: |
        Written Czech has its own set of connectors:

        - **neboť** "for" (cause, after the main clause), **jelikož** "since"
        - **nýbrž** "but rather" after a negative: **ne dnes, nýbrž zítra** "not today but tomorrow"
        - **avšak, nicméně** "however", **leč** (literary) "but"
        - **tudíž** "therefore", **totiž** "you see, namely" (never first in the clause)
        - **ač, ačkoli(v)** "although", **nechť** "let" (= ať), **jest** old "is"
      pt: |
        O tcheco escrito tem um conjunto próprio de conectores:

        - **neboť** "pois" (causa, depois da principal), **jelikož** "já que"
        - **nýbrž** "mas sim" depois de uma negação: **ne dnes, nýbrž zítra** "não hoje, mas amanhã"
        - **avšak, nicméně** "porém, no entanto", **leč** (literário) "mas"
        - **tudíž** "portanto", **totiž** "é que, ou seja" (nunca no começo da oração)
        - **ač, ačkoli(v)** "embora", **nechť** "que" (= ať), **jest** antigo "é"
    examples:
    - ["Nepřišel, neboť byl nemocen.", "He didn't come, for he was ill.", "Ele não veio, pois estava doente.", "neboť"]
    - ["Nejde o peníze, nýbrž o čas.", "It's not about money but about time.", "Não se trata de dinheiro, mas sim de tempo.", "nýbrž"]
    - ["Jelikož pršelo, zůstali jsme doma.", "Since it was raining, we stayed home.", "Como estava chovendo, ficamos em casa.", "Jelikož"]
    match: {seq: [{word: [neboť, nýbrž, jelikož, avšak, nicméně, tudíž, totiž, ač, ačkoli, ačkoliv, nechť, jest]}], gap: 0}
    pool: [neboť, nýbrž, jelikož, avšak, nicméně, tudíž, ačkoli, protože, ale]

  - id: cs-c2-genitive-verbs
    title: "týká se, dosáhnout cíle"
    meaning: {en: "verbs that govern the genitive", pt: "verbos que regem o genitivo"}
    intro:
      en: |
        A group of verbs, mostly reflexive, take a **genitive** object — a mark of careful Czech: **týkat se** "concern" (**To se týká všech.** "This concerns everyone."), **všimnout si** "notice", **vážit si** "respect", **bát se** "fear", **zúčastnit se** "take part in", **dosáhnout** "reach, achieve" (**dosáhnout cíle**), **zbavit se** "get rid of", **využít** "make use of", **zeptat se** "ask (someone)". In speech some drift to other cases (**všimnout si toho / to**), but the genitive is the standard.
      pt: |
        Um grupo de verbos, quase todos reflexivos, pede objeto no **genitivo** — sinal de tcheco cuidado: **týkat se** "dizer respeito a" (**To se týká všech.** "Isso diz respeito a todos."), **všimnout si** "notar", **vážit si** "respeitar", **bát se** "temer", **zúčastnit se** "participar de", **dosáhnout** "alcançar" (**dosáhnout cíle**), **zbavit se** "livrar-se de", **využít** "aproveitar", **zeptat se** "perguntar (a alguém)". Na fala alguns passam a outros casos (**všimnout si toho / to**), mas o genitivo é a norma.
    examples:
    - ["To se týká všech.", "This concerns everyone.", "Isso diz respeito a todos.", "všech"]
    - ["Vážím si tvé pomoci.", "I appreciate your help.", "Agradeço a sua ajuda.", "pomoci"]
    - ["Konečně dosáhl svého cíle.", "He finally achieved his goal.", "Ele finalmente alcançou seu objetivo.", "cíle"]
    match: {seq: [{lemma: "^(týkat|dosáhnout|dosahovat|vážit|všimnout|všímat|zúčastnit|účastnit|zbavit|zbavovat|bát|využít)$"}, {pos: [noun, pron], case: gen}], near: 3, gap: 1, same: [number]}

- title: {en: Spoken and expressive Czech, pt: Tcheco falado e expressivo}
  lessons:
  - id: cs-c2-spoken
    title: "dobrej, bejt, jo, bysme"
    meaning: {en: "Common Czech: the everyday spoken standard", pt: "o tcheco comum: o padrão falado do dia a dia"}
    intro:
      en: |
        Most Czechs speak **obecná čeština** in everyday life, and modern fiction writes it:

        - **ý → ej**: **dobrej, bejt, mlejn** (dobrý, být, mlýn)
        - **é → ý / í**: **dobrý pivo, mlíko** (dobré pivo, mléko)
        - **v-** before initial o: **vokno, von** (okno, on)
        - one plural ending **-ma** in the instrumental: **s dobrejma lidma**
        - verbs: **dělaj, maj** (dělají, mají), **bysme** (bychom), **sem** for **jsem**
        - **jo** "yeah", **teda** "then, well"

        It is not wrong, just informal; in writing and formal speech use the standard forms.
      pt: |
        A maioria dos tchecos fala **obecná čeština** no dia a dia, e a ficção moderna a escreve:

        - **ý → ej**: **dobrej, bejt, mlejn** (dobrý, být, mlýn)
        - **é → ý / í**: **dobrý pivo, mlíko** (dobré pivo, mléko)
        - **v-** antes de o inicial: **vokno, von** (okno, on)
        - uma só terminação **-ma** no instrumental plural: **s dobrejma lidma**
        - verbos: **dělaj, maj** (dělají, mají), **bysme** (bychom), **sem** por **jsem**
        - **jo** "é, sim", **teda** "então"

        Não é errado, só informal; na escrita e na fala formal use as formas padrão.
    table:
      head: {en: [Standard, Common Czech], pt: [Padrão, Tcheco comum]}
      rows:
      - [dobrý, dobrej]
      - [být, bejt]
      - [dobré pivo, dobrý pivo]
      - [okno, vokno]
      - [bychom, bysme]
      - [s dobrými lidmi, s dobrejma lidma]
    examples:
    - ["Jo, to je dobrej nápad.", "Yeah, that's a good idea.", "É, é uma boa ideia.", "dobrej"]
    - ["To bysme mohli zkusit.", "We could try that.", "A gente podia tentar isso.", "bysme"]
    - ["Tak teda jdeme.", "Let's go then.", "Então vamos.", "teda"]
    match: {seq: [{word: [jo, teda, bysme, dobrej, velkej, malej, mladej, novej, celej, jinej, každej, takovej, jakej, bejt, vokno, dělaj, maj, lidma, dětma]}], gap: 0}
    pool: [jo, teda, bysme, dobrej, bejt, ano, tedy, bychom, dobrý]

  - id: cs-c2-diminutives
    title: "chvilku, trošku, maminka"
    meaning: {en: "diminutives and endearment", pt: "diminutivos e carinho"}
    intro:
      en: |
        Czech uses diminutives constantly, for size, affection or politeness: **-ek / -ka / -ko** (**domek, chvilka, okénko**), double diminutives **-eček / -ička / -íčko** (**domeček, chvilička**), and on adjectives **-ičký / -inký / -oučký** (**maličký, malinký** "tiny", **teploučký**). **Počkejte chvilku.** "Wait a moment." **Dáte si trošku kávy?** "Will you have a little coffee?"

        Family words are mostly diminutive in daily use: **maminka, tatínek, babička, dědeček**. Some diminutives have taken a new meaning: **ručička** "clock hand", **koníček** "hobby".
      pt: |
        O tcheco usa diminutivos o tempo todo, por tamanho, carinho ou cortesia: **-ek / -ka / -ko** (**domek, chvilka, okénko**), diminutivos duplos **-eček / -ička / -íčko** (**domeček, chvilička**), e nos adjetivos **-ičký / -inký / -oučký** (**maličký, malinký** "pequenininho", **teploučký**). **Počkejte chvilku.** "Espere um minutinho." **Dáte si trošku kávy?** "Aceita um pouquinho de café?"

        As palavras de família costumam ser diminutivas no dia a dia: **maminka, tatínek, babička, dědeček**. Alguns diminutivos ganharam sentido novo: **ručička** "ponteiro do relógio", **koníček** "hobby".
    examples:
    - ["Počkejte chvilku.", "Wait a moment.", "Espere um minutinho.", "chvilku"]
    - ["Dáte si trošku kávy?", "Will you have a little coffee?", "Aceita um pouquinho de café?", "trošku"]
    - ["Moje babička bydlí na vesnici.", "My grandma lives in the country.", "Minha avó mora no interior.", "babička"]
    match: {seq: [{word: [chvilku, chvilka, chvilinku, chviličku, trošku, trošičku, kousek, kousíček, maminka, maminko, tatínek, tatínku, babička, babičko, babičky, dědeček, dědečka, holčička, holčičku, pejsek, kočička, domeček, malinký, maličký, koníček, skleničku, písničku]}], gap: 0}
    pool: [chvilku, trošku, kousek, maminka, tatínek, babička, dědeček, chvíli, trochu]

  - id: cs-c2-generalising
    title: "kdokoli, cokoliv, ať už"
    meaning: {en: "-koli(v): whoever, whatever, wherever", pt: "-koli(v): quem quer que, o que quer que"}
    intro:
      en: |
        **-koli** or **-koliv** added to a question word makes it "-ever, any": **kdokoli** "anyone, whoever", **cokoli(v)** "anything, whatever", **kdykoli** "any time", **kamkoli** "anywhere (to)", **jakýkoli** "any kind of", **jakkoli** "however". **Můžeš přijít kdykoli.** "You can come any time." **Udělám cokoliv.** "I'll do anything."

        Concessive clauses use **ať (už) … jakkoli / kdokoli / nebo**: **Ať už je to kdokoli, neotvírej.** "Whoever it is, don't open." **Ať prší nebo ne, půjdu.** "Rain or not, I'll go."
      pt: |
        **-koli** ou **-koliv** acrescentado a uma palavra interrogativa forma "quer que, qualquer": **kdokoli** "qualquer um, quem quer que", **cokoli(v)** "qualquer coisa", **kdykoli** "a qualquer hora", **kamkoli** "para qualquer lugar", **jakýkoli** "qualquer tipo de", **jakkoli** "por mais que". **Můžeš přijít kdykoli.** "Você pode vir quando quiser." **Udělám cokoliv.** "Faço qualquer coisa."

        As orações concessivas usam **ať (už) … jakkoli / kdokoli / nebo**: **Ať už je to kdokoli, neotvírej.** "Seja quem for, não abra." **Ať prší nebo ne, půjdu.** "Chovendo ou não, eu vou."
    examples:
    - ["Můžeš přijít kdykoli.", "You can come any time.", "Você pode vir quando quiser.", "kdykoli"]
    - ["Udělám pro tebe cokoliv.", "I'll do anything for you.", "Faço qualquer coisa por você.", "cokoliv"]
    - ["Ať už je to kdokoli, neotvírej.", "Whoever it is, don't open.", "Seja quem for, não abra.", "kdokoli"]
    match: {seq: [{re: "^(?!(?:ačkoliv|nikoliv|nikoli|ačkoli)$)[\\s\\S]*?(?:(koli|koliv)$)"}], gap: 0}

  - id: cs-c2-transgressives
    title: "vida, nevědouc, soudě podle"
    meaning: {en: "transgressives in literature and set phrases", pt: "transgressivos na literatura e em expressões fixas"}
    intro:
      en: |
        Nineteenth-century and older literature is full of **transgressives** (přechodníky), verbal adverbs that agree with the subject in gender and number:

        - present (imperfective verbs): **-a / -e** masc. sg., **-ouc / -íc** fem. and neut. sg., **-ouce / -íce** plural: **nesa, nesouc, nesouce** "carrying", **vida, vidouc** "seeing"
        - past (perfective verbs): **-v / -vši / -vše**: **udělav, udělavši, udělavše** "having done"

        Today they survive in set phrases: **chtě nechtě** "willy-nilly", **soudě podle** "judging by", **vyjma** "except", **počínaje… konče** "starting with… ending with", **takřka** "almost", and **vida** "well, look at that". You need to recognise them, not use them.
      pt: |
        A literatura do século XIX e anterior está cheia de **transgressivos** (přechodníky), advérbios verbais que concordam com o sujeito em gênero e número:

        - presente (verbos imperfectivos): **-a / -e** masc. sing., **-ouc / -íc** fem. e neutro sing., **-ouce / -íce** plural: **nesa, nesouc, nesouce** "carregando", **vida, vidouc** "vendo"
        - passado (verbos perfectivos): **-v / -vši / -vše**: **udělav, udělavši, udělavše** "tendo feito"

        Hoje sobrevivem em expressões fixas: **chtě nechtě** "queira ou não", **soudě podle** "a julgar por", **vyjma** "exceto", **počínaje… konče** "começando por… terminando em", **takřka** "quase", e **vida** "ora, veja só". Basta reconhecê-los, não usá-los.
    table:
      head: {en: [Verb, Masc. sg., Fem./neut. sg., Plural], pt: [Verbo, Masc. sing., Fem./neutro sing., Plural]}
      rows:
      - ["nést (present)", nesa, nesouc, nesouce]
      - ["vidět (present)", vida, vidouc, vidouce]
      - ["udělat (past)", udělav, udělavši, udělavše]
    examples:
    - ["Soudě podle jeho tváře, něco se stalo.", "Judging by his face, something has happened.", "A julgar pelo rosto dele, aconteceu alguma coisa.", "Soudě"]
    - ["Chtě nechtě musel odejít.", "Willy-nilly, he had to leave.", "Querendo ou não, ele teve que ir embora.", "nechtě"]
    - ["Odešla, nevědouc, co říct.", "She left, not knowing what to say.", "Ela saiu sem saber o que dizer.", "nevědouc"]
    match: {seq: [{re: "^(vida|nevědouc|vědouc|takřka|chtě|nechtě|vyjma|nevyjímaje|počínaje|konče|soudě|jsouc|jsa|maje|majíc|řka|vidouc)$|(ivši|avši|evši|ivše|avše)$"}], gap: 0}

- title: {en: Mood and aspect, pt: Modo e aspecto}
  lessons:
  - id: cs-c2-past-conditional
    title: "byl bych přišel"
    meaning: {en: "the past conditional", pt: "o condicional passado"}
    intro:
      en: |
        Careful Czech distinguishes an unreal past with **byl** added to the conditional: **Byl bych přišel, kdybych to byl věděl.** "I would have come if I had known." The order is **bych byl** after the first word: **Já bych byl přišel.** In everyday speech the plain conditional does both jobs (**Přišel bych, kdybych to věděl.**), with the time left to context; the past conditional sounds precise and literary.
      pt: |
        O tcheco cuidado distingue o passado irreal acrescentando **byl** ao condicional: **Byl bych přišel, kdybych to byl věděl.** "Eu teria vindo se soubesse." A ordem é **bych byl** depois da primeira palavra: **Já bych byl přišel.** Na fala do dia a dia o condicional simples faz os dois papéis (**Přišel bych, kdybych to věděl.**), e o contexto dá o tempo; o condicional passado soa preciso e literário.
    examples:
    - ["Byl bych přišel, kdybych to byl věděl.", "I would have come if I had known.", "Eu teria vindo se soubesse.", "Byl"]
    - ["To bych byl nikdy neřekl.", "I would never have said that.", "Eu nunca teria dito isso.", "byl"]
    - ["Kdybys byl přišel dřív, viděl bys ho.", "If you had come earlier, you'd have seen him.", "Se você tivesse vindo antes, o teria visto.", "byl"]
    match:
    - {seq: [{word: [bych, bys, by, bychom, byste, kdybych, kdybys, kdyby, kdybychom, kdybyste]}, {word: [byl, byla, bylo, byli, byly]}, {re: "l[aoiy]?$", pos: verb}], near: 1, gap: 1}
    - {seq: [{word: [byl, byla, bylo, byli, byly], start: true}, {word: [bych, bys, by, bychom, byste]}, {re: "l[aoiy]?$", pos: verb}], gap: 0}
    pool: [byl, byla, byli, bych, by, jsem]

  - id: cs-c2-negative-imperative
    title: "Neotvírej! – Nezapomeň!"
    meaning: {en: "aspect in negative commands", pt: "o aspecto nas ordens negativas"}
    intro:
      en: |
        Negative commands are normally **imperfective**: **Neotvírej okno!** "Don't open the window!" **Neříkej to nikomu.** "Don't tell anyone." A negated **perfective** is a **warning** against an accident: **Nespadni!** "Mind you don't fall!" **Neztrať to!** "Don't lose it!" **Nezapomeň!** "Don't forget!" — forgetting is never done on purpose, so the perfective is the normal form here.
      pt: |
        As ordens negativas normalmente são **imperfectivas**: **Neotvírej okno!** "Não abra a janela!" **Neříkej to nikomu.** "Não conte para ninguém." Um **perfectivo** negado é um **aviso** contra um acidente: **Nespadni!** "Cuidado para não cair!" **Neztrať to!** "Não vá perder isso!" **Nezapomeň!** "Não esqueça!" — ninguém esquece de propósito, por isso aqui o perfectivo é a forma normal.
    examples:
    - ["Neříkej to nikomu.", "Don't tell anyone.", "Não conte para ninguém.", "Neříkej"]
    - ["Nezapomeň si deštník.", "Don't forget your umbrella.", "Não esqueça o guarda-chuva.", "Nezapomeň"]
    - ["Neotvírej to okno!", "Don't open that window!", "Não abra essa janela!", "Neotvírej"]
    match: {seq: [{re: "^ne", pos: verb, mood: imp}], same: [person, number]}

- title: {en: Word order, pt: Ordem das palavras}
  lessons:
  - id: cs-c2-word-order
    title: "Do pokoje vešel muž."
    meaning: {en: "word order: known first, new last", pt: "ordem das palavras: o conhecido primeiro, o novo no fim"}
    intro:
      en: |
        Czech orders the sentence by information, not by grammar: the **known** comes first, the **new** last. **Muž vešel do pokoje.** "The man came into the room." **Do pokoje vešel muž.** "A man came into the room." So a sentence opening with a time or place adverbial often puts the subject at the end: **Včera přijel můj bratr.** "My brother arrived yesterday." **Najednou zazvonil telefon.** "Suddenly the phone rang."

        The clitics still keep second place: **Včera mi volal Petr.** "Petr called me yesterday."
      pt: |
        O tcheco ordena a frase pela informação, não pela gramática: o **conhecido** vem primeiro, o **novo** no fim. **Muž vešel do pokoje.** "O homem entrou na sala." **Do pokoje vešel muž.** "Um homem entrou na sala." Por isso a frase que começa por um adjunto de tempo ou lugar muitas vezes põe o sujeito no fim: **Včera přijel můj bratr.** "Ontem chegou meu irmão." **Najednou zazvonil telefon.** "De repente o telefone tocou."

        Os clíticos continuam na segunda posição: **Včera mi volal Petr.** "Ontem o Petr me ligou."
    examples:
    - ["Včera přijel můj bratr.", "My brother arrived yesterday.", "Ontem chegou meu irmão.", "přijel"]
    - ["Najednou zazvonil telefon.", "Suddenly the phone rang.", "De repente o telefone tocou.", "zazvonil"]
    - ["Večer přišla zpráva.", "In the evening a message came.", "À noite chegou uma notícia.", "přišla"]
    match: {seq: [{word: [včera, dnes, zítra, tam, tady, pak, potom, najednou, ráno, večer, nakonec, brzy, náhle, letos, loni], start: true}, {pos: verb, re: "l[aoiy]?$"}, {pos: noun, case: nom}], near: 2, gap: 1, same: [gender, number]}
