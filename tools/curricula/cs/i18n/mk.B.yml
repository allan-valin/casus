# Macedonian text of the Czech course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Conditions and clauses: "Услови и зависни реченици"
  Motion and comparison: "Движење и споредување"
  Formal Czech: "Официјален чешки"
lessons:
  cs-conditional:
    meaning: "условниот начин: л-форма + bych"
    intro: |
      **л-форма + bych, bys, by, bychom, byste, by** — како македонското **би + л-форма**: **Dělal bych to.** „Би го направил тоа.“ **Chtěla bych kávu.** „Би сакала кафе.“ Со **kdyby** (ако би): **Kdybych měl čas, šel bych.** „Да имав време, би отишол.“ **aby** (за да) ги зема истите форми: **Řekl mi, abych přišel.** „Ми рече да дојдам.“
  cs-relative:
    meaning: "релативни реченици со který"
    intro: |
      **který / která / které** (кој, која, кое) се согласува со именката по род и број и го зема падежот на својата улога во реченицата: **muž, který tam stojí** „човекот што стои таму“, **žena, kterou znám** „жената што ја знам“, **dům, ve kterém bydlím** „куќата во која живеам“. Секогаш запирка пред него. **co** е разговорното општо релативно, како **што**: **to, co chceš** „тоа што го сакаш“.
  cs-conjunctions:
    meaning: "дека, бидејќи, кога, дали"
    intro: |
      **že** дека, **protože** бидејќи, **když** кога / ако, **jestli / jestliže** дали, ако, **ale** но, **nebo** или, **a** и, **ani** ниту, **než** од (кај споредба) / пред да, **zatímco** додека, **dokud** додека, сѐ додека, **i když** иако. Пред секоја зависна реченица има запирка.
  cs-motion:
    meaning: "глаголи на движење: пеш или со превозно средство, еднаш или обично"
    intro: |
      Чешкиот разликува **пеш** (**jít / chodit**) од **со возило** (**jet / jezdit**), и **едно патување сега** (**jít, jet**) од **обично или повторено** (**chodit, jezdit**): **Jdu do práce.** „Одам на работа (сега).“ **Chodím do práce pěšky.** „Одам пеш на работа (обично).“ **Jedu vlakem.** „Патувам со воз.“ Идно: **půjdu, pojedu**.
  cs-comparison:
    meaning: "компаратив -ší/-ejší и суперлатив nej-"
    intro: |
      Компаратив **-ší** или **-ejší / -ější**: **nový → novější, starý → starší, rychlý → rychlejší**; суперлатив **nej-** + компаратив — како **нај-**: **nejstarší, nejrychlejší**. Неправилни: **dobrý → lepší → nejlepší**, **špatný → horší**, **velký → větší**, **malý → menší**. *Од* (споредба) е **než**: **Je starší než já.** „Постар е од мене.“
  cs-passive:
    meaning: "пасивот: být + партицип на -n/-t"
    intro: |
      **být** + пасивен партицип на **-n / -t**, согласуван со подметот: **Dům byl postaven v roce 1900.** „Куќата беше изградена во 1900.“ **Okno je otevřeno / otevřené.** Во секојдневниот говор е почест повратниот пасив, како **се** во македонскиот: **Tady se kouří.** „Тука се пуши.“ **To se nedělá.** „Тоа не се прави.“
  cs-vocative:
    meaning: "вокативот: обраќање кон луѓе"
    intro: |
      Чешкиот уште го користи **вокативот** при секое обраќање — како македонскиот: **pan Novák → pane Nováku!**, **Petr → Petře!**, **Jana → Jano!**, **paní Nováková** (непроменето), **pan doktor → pane doktore!** Наставки: машки **-e** (со r → ř), **-u** по k, h, ch, g, **-i** по меки согласки; женски **-a → -o** (како **Јано!**).
  cs-gerunds:
    meaning: "трансгресиви и глаголски именки (-ní)"
    intro: |
      **Глаголските именки** на **-ní / -tí** именуваат дејство, како македонските на **-ње**: **čtení** (читање), **psaní** (пишување), **pití** (пиење), **zakázáno kouření** „забрането пушење“. Старите **трансгресиви** (**dělaje** правејќи, **udělav** откако направил) живеат само во книжевноста и во цврсти изрази (**chtě nechtě** „сакал-не сакал“).
