# German text of the Czech course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Conditions and clauses: "Bedingungen und Nebensätze"
  Motion and comparison: "Bewegung und Steigerung"
  Formal Czech: "Formelles Tschechisch"
lessons:
  cs-conditional:
    meaning: "der Konditional: l-Form + bych"
    intro: |
      **l-Form + bych, bys, by, bychom, byste, by**: **Dělal bych to.** „Ich würde es machen.“ **Chtěla bych kávu.** „Ich hätte gern einen Kaffee (Frau).“ Mit **kdyby** (wenn): **Kdybych měl čas, šel bych.** „Wenn ich Zeit hätte, ginge ich.“ **aby** (damit, um zu) nimmt dieselben Formen: **Řekl mi, abych přišel.** „Er sagte mir, ich solle kommen.“
  cs-relative:
    meaning: "Relativsätze mit který"
    intro: |
      **který / která / které** (der, die, das) richtet sich in Genus und Numerus nach seinem Nomen und nimmt den Kasus seiner Rolle im Nebensatz: **muž, který tam stojí** „der Mann, der dort steht“, **žena, kterou znám** „die Frau, die ich kenne“, **dům, ve kterém bydlím** „das Haus, in dem ich wohne“. Immer ein Komma davor. **co** ist das gesprochene Allzweck-Relativ: **to, co chceš** „das, was du willst“.
  cs-conjunctions:
    meaning: "dass, weil, wenn, ob"
    intro: |
      **že** dass, **protože** weil, **když** wenn / als, **jestli / jestliže** ob, falls, **ale** aber, **nebo** oder, **a** und, **ani** noch, **než** als / bevor, **zatímco** während, **dokud** solange, bis, **i když** obwohl. Vor jedem Nebensatz steht ein Komma.
  cs-motion:
    meaning: "Bewegungsverben: zu Fuß oder mit Fahrzeug, einmal oder gewohnheitsmäßig"
    intro: |
      Tschechisch unterscheidet **zu Fuß** (**jít / chodit**) von **mit Fahrzeug** (**jet / jezdit**), und **eine Fahrt jetzt** (**jít, jet**) von **gewohnheitsmäßig** (**chodit, jezdit**): **Jdu do práce.** „Ich gehe (gerade) zur Arbeit.“ **Chodím do práce pěšky.** „Ich gehe (gewöhnlich) zu Fuß zur Arbeit.“ **Jedu vlakem.** „Ich fahre mit dem Zug.“ Futur: **půjdu, pojedu**.
  cs-comparison:
    meaning: "Komparativ -ší/-ejší und Superlativ nej-"
    intro: |
      Komparativ **-ší** oder **-ejší / -ější**: **nový → novější, starý → starší, rychlý → rychlejší**; Superlativ **nej-** + Komparativ: **nejstarší, nejrychlejší**. Unregelmäßig: **dobrý → lepší → nejlepší**, **špatný → horší**, **velký → větší**, **malý → menší**. *Als* ist **než**: **Je starší než já.**
  cs-passive:
    meaning: "das Passiv: být + Partizip auf -n/-t"
    intro: |
      **být** + Passivpartizip auf **-n / -t**, nach dem Subjekt gerichtet: **Dům byl postaven v roce 1900.** „Das Haus wurde 1900 gebaut.“ **Okno je otevřeno / otevřené.** Im Alltag ist das reflexive Passiv häufiger: **Tady se kouří.** „Hier wird geraucht.“ **To se nedělá.** „Das tut man nicht.“
  cs-vocative:
    meaning: "der Vokativ: Menschen anreden"
    intro: |
      Tschechisch verwendet bei jeder Anrede noch den **Vokativ**: **pan Novák → pane Nováku!**, **Petr → Petře!**, **Jana → Jano!**, **paní Nováková** (unverändert), **pan doktor → pane doktore!** Endungen: maskulin **-e** (mit r → ř), **-u** nach k, h, ch, g, **-i** nach weichen Konsonanten; feminin **-a → -o**.
  cs-gerunds:
    meaning: "Transgressive und Verbalnomen (-ní)"
    intro: |
      **Verbalnomen** auf **-ní / -tí** benennen eine Handlung: **čtení** (Lesen), **psaní** (Schreiben), **pití** (Trinken), **zakázáno kouření** „Rauchen verboten“. Die alten **Transgressive** (**dělaje** beim Tun, **udělav** getan habend) leben nur in der Literatur und festen Wendungen fort (**chtě nechtě** „wohl oder übel“).
