# German text of the Czech course, A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and spelling: "Laute und Schreibung"
  Pronouns and 'být': "Pronomen und „být“"
  The present tense: "Das Präsens"
  Nouns and the cases: "Nomen und Kasus"
lessons:
  cs-sounds:
    meaning: "das Alphabet: Háček, Čárka, ě, ů"
    intro: |
      Tschechisch wird geschrieben, wie es klingt, mit zwei Zeichen:

      - die **Čárka** (´) macht einen Vokal **lang**: **a/á, e/é, i/í, o/ó, u/ú, y/ý**; **ů** (mit Kringel) ist ebenfalls ein langes *ú*. Die Länge unterscheidet Bedeutungen: **byt** (Wohnung) – **být** (sein).
      - der **Háček** (ˇ) erweicht: **č** = *tsch*, **š** = *sch*, **ž** = stimmhaftes *sch* wie in *Garage*, **ř** (ein gerolltes r zugleich mit ž — der berühmte Laut des Tschechischen), **ň** = *nj*, **ď, ť** = weiches d, t; **ě** erweicht den Konsonanten davor: **dě** = *dje*, **mě** = *mnje*.

      **ch** ist ein Buchstabe (nach h im Alphabet) und klingt wie in *ach*. Die Betonung liegt immer auf der **ersten Silbe**.
    mistakes: ["ů ist ein langes ú: dům, stůl, můj."]
  cs-byt:
    meaning: "Personalpronomen und být „sein“"
    intro: |
      **já** ich, **ty** du, **on / ona / ono** er / sie / es, **my** wir, **vy** ihr (und höflich **Vy**), **oni / ony / ona** sie. Die Verbendung zeigt die Person, darum fallen Pronomen meist weg.

      **být**: **jsem, jsi, je, jsme, jste, jsou**. Verneint: **nejsem, nejsi, není, nejsme, nejste, nejsou**.
  cs-present:
    meaning: "das Präsens: Verben auf -ám, -ím, -u"
    intro: |
      Tschechische Verben folgen drei Hauptmustern, erkennbar an der 1. Person:

      | | dělat (machen) | mluvit (sprechen) | psát (schreiben) |
      |---|---|---|---|
      | já | děl**ám** | mluv**ím** | píš**u** |
      | ty | děl**áš** | mluv**íš** | píš**eš** |
      | on | děl**á** | mluv**í** | píš**e** |
      | my | děl**áme** | mluv**íme** | píš**eme** |
      | vy | děl**áte** | mluv**íte** | píš**ete** |
      | oni | děl**ají** | mluv**í** | píš**ou** |

      Bei der dritten Gruppe lernt man den Stamm mit jedem Verb: **psát → píšu**, **číst → čtu**, **pít → piju**.
  cs-negation:
    meaning: "Verneinung: ne- am Verb"
    intro: |
      **ne-** wird mit dem Verb zusammengeschrieben: **mám → nemám** „ich habe nicht“, **vím → nevím** „ich weiß nicht“, **je → není**. Tschechisch verneint doppelt: **Nikdo nic neví.** „Niemand weiß etwas.“ (**nikdo** niemand, **nic** nichts, **nikdy** nie, **nikde** nirgends).
  cs-questions:
    meaning: "Fragewörter"
    intro: |
      **kdo** wer, **co** was, **kde** wo, **kam** wohin, **odkud** woher, **kdy** wann, **proč** warum, **jak** wie, **kolik** wie viel, **který** welcher, **jaký** was für ein, **čí** wessen. Ja/Nein-Fragen steigen nur in der Intonation, oft mit dem Verb vorn: **Máš čas?**
  cs-gender:
    meaning: "Genus: Maskulinum (belebt, unbelebt), Femininum, Neutrum"
    intro: |
      Tschechisch hat keine Artikel, aber jedes Nomen hat ein Genus, meist an der Endung erkennbar, und das Demonstrativum **ten / ta / to** (dieser, jener) richtet sich danach:

      - **maskulin**: Konsonant — **ten muž** (Mann), **ten hrad** (Burg). Maskulina teilen sich in **belebte** (Menschen, Tiere) und **unbelebte**, die verschieden dekliniert werden.
      - **feminin**: **-a, -e/-ě**, manche Konsonanten — **ta žena** (Frau), **ta růže** (Rose), **ta kost** (Knochen)
      - **neutral**: **-o, -e, -í** — **to město** (Stadt), **to moře** (Meer), **to nádraží** (Bahnhof)
  cs-accusative:
    meaning: "der Akkusativ: das Objekt"
    intro: |
      Das direkte Objekt: Feminina **-a → -u** (**žena → ženu**), **-e → -i** (**růže → růži**); belebte Maskulina nehmen **-a** oder **-e** (**pán → pána**, **muž → muže**); unbelebte Maskulina und Neutra **ändern sich nicht** (**vidím hrad, vidím město**). Auch Präpositionen der Richtung **na, do… pro, za** nehmen ihn: **na poštu** „zur Post“.
  cs-locative:
    meaning: "der Lokativ: in, auf, über (nach v, na, o, po, při)"
    intro: |
      Nur nach Präpositionen: **v / ve** (in), **na** (auf, an), **o** (über), **po** (nach, umher), **při** (bei, während). Endungen: **-e/-ě** (**v Praze, na poště, ve městě**), **-u** (**v domě / v domu, na hradu**), **-i** (**v práci, na ulici**), belebte Maskulina **-ovi** (**o bratrovi**). Plural **-ech, -ách, -ích**.

      Achte auf Konsonantenwechsel vor **-e/-ě**: **k → c** (Amerika → v Americe), **h → z** (Praha → v Praze), **ch → š**, **r → ř** (sestra → o sestře).
    mistakes: ["h wird vor dem Lokativ-e zu z."]
  cs-genitive:
    meaning: "der Genitiv: von, nach do, z, bez, u, od"
    intro: |
      Besitz und Menge (**šálek kávy** „eine Tasse Kaffee“, **hodně lidí** „viele Leute“) und nach **do** (in, nach), **z / ze** (aus), **bez** (ohne), **u** (bei jemandem), **od** (von), **vedle** (neben), **kromě** (außer). Endungen: **-a/-u** (mask., neutr.: **do města, bez cukru**), **-y/-e** (fem.: **z Prahy, do školy**).
  cs-instrumental:
    meaning: "der Instrumental: mit, durch"
    intro: |
      **-em** (mask., neutr.: **s bratrem, autem** „mit dem Auto“), **-ou** (fem.: **s maminkou, tramvají**), Plural **-y, -ami, -emi**. Nach **s / se** (mit), **před** (vor), **za** (hinter), **nad** (über), **pod** (unter), **mezi** (zwischen), für das Mittel: **jedu vlakem** „ich fahre mit dem Zug“, und nach **být** für Berufe: **Je učitelem.**
  cs-adjectives:
    meaning: "harte Adjektive -ý, -á, -é und weiche -í"
    intro: |
      **Harte** Adjektive enden auf **-ý, -á, -é** für Maskulinum, Femininum, Neutrum: **nový dům, nová kniha, nové auto**. **Weiche** enden in allen drei auf **-í**: **moderní, cizí**. Sie kongruieren in Genus, Numerus und Kasus: **v novém domě, s novou knihou**.
  cs-possessives:
    meaning: "Possessive: mein, dein, unser …"
    intro: |
      **můj / moje** mein, **tvůj / tvoje** dein, **jeho** sein, **její** ihr, **náš** unser, **váš** euer / Ihr, **jejich** ihr (Pl.); **svůj** sein eigener (bezieht sich aufs Subjekt). Sie richten sich nach dem Nomen: **můj bratr, moje sestra, moje auto**. **jeho, jejich** ändern sich nie.
  cs-numbers:
    meaning: "Zahlen und der Genitiv Plural ab fünf"
    intro: |
      **1 jeden / jedna / jedno, 2 dva / dvě, 3 tři, 4 čtyři, 5 pět, 6 šest, 7 sedm, 8 osm, 9 devět, 10 deset, 20 dvacet, 100 sto.** Nach **2–4** steht das Nomen im Nominativ Plural (**dva bratři, tři knihy**); ab **5** und nach **mnoho, hodně, kolik** im **Genitiv Plural** (**pět bratrů, deset knih**), und das Verb steht im Singular: **Pět lidí přišlo.**
