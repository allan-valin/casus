# Macedonian text of the Czech course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Written Czech: "Пишан чешки"
  Verbs in depth: "Глаголите во длабочина"
  Numerals and case: "Броеви и падеж"
  Word order and particles: "Ред на зборови и честички"
  High style: "Висок стил"
  Spoken and expressive Czech: "Говорен и експресивен чешки"
  Mood and aspect: "Начин и вид"
  Word order: "Ред на зборовите"
lessons:
  cs-c1-jenz:
    meaning: "книжевното релативно jenž"
    intro: |
      Покрај **který**, пишаниот чешки користи **jenž** „кој, којшто“, менуван како заменката **on** со додадено **-ž**: **jenž** (маш. едн.), **jež** (жен. и сред., и повеќето множини), **jehož** (ген./акуз.), **jemuž** (дат.), по предлози **něhož, němž, nímž, níž, nichž**. **Muž, jenž stál u okna…** „Човекот кој стоеше крај прозорецот…“ **dům, v němž bydlím** „куќата во која живеам“.

      Присвојното **jehož, jejíž, jejichž** „чиј“ се користи и во реченици со **který**: **spisovatel, jehož knihy čtu** „писателот чии книги ги читам“. Во говорот **který** ги заменува сите.
  cs-c1-participial-adjectives:
    meaning: "придавки од сегашниот партицип: -ící, -oucí"
    intro: |
      Од 3 лице множина сегашно чешкиот гради придавка на **-ící / -oucí** „што прави“: **pracují → pracující** „кој работи“, **rostou → rostoucí** „растечки“, **jedou → jedoucí** „кој патува“. Се менува како **jarní** (меките придавки) и е типична за пишаниот и официјалниот чешки: **cestující** „патници“, **následující den** „следниот ден“, **vedoucí** „раководител“.

      Многу станале обични придавки: **vzrušující** „возбудлив“, **matoucí** „збунувачки“, **budoucí** „иден“.
  cs-c1-formal-prepositions:
    meaning: "секундарни предлози и нивните падежи"
    intro: |
      Предлозите изведени од именки и прилози носат точни значења, секој со свој падеж:

      - **díky** + дат. „благодарение на“ (добри причини), **kvůli** + дат. „поради“ (лоши или неутрални), **navzdory** + дат. „и покрај“
      - **během** + ген. „за време на“, **kromě** + ген. „освен“, **místo** + ген. „наместо“, **ohledně** + ген. „во врска со“
      - во официјален стил: **v rámci** + ген. „во рамките на“, **na základě** + ген. „врз основа на“, **v souvislosti s** + инстр. „во врска со“, **vzhledem k** + дат. „со оглед на“, **prostřednictvím** + ген. „преку, со посредство на“
  cs-c1-iteratives:
    meaning: "итеративи: имаше обичај, обично"
    intro: |
      Од несвршените глаголи чешкиот гради **итеративи** на **-ávat / -ívat / -vat** за повторени или вообичаени дејства — слично на македонските **-ува**: **chodit → chodívat**, **dělat → dělávat**, **mít → mívat**, **být → bývat**, **hrát → hrávat**. Во минато значат „имаше обичај“: **Chodíval jsem sem každý den.** „Доаѓав тука секој ден.“ Во сегашно „обично“: **V zimě tu bývá hodně sněhu.** „Зиме тука обично има многу снег.“

      **Bývalo to lepší.** „Порано беше подобро.“ Придавката **bývalý** „поранешен“ е од истиот глагол.
  cs-c1-prefixes:
    meaning: "представки што додаваат начин на дејство"
    intro: |
      Представките не само што го прават глаголот свршен: **do-** до крај (**dočíst** „дочита“), **pře-** повторно или премногу (**přečíst** „прочита“, **přejíst se** „се преjаде“), **na- … se** до сита (**najíst se** „се најаде“, **napít se** „се напие“), **vy- … se** доволно (**vyspat se** „се наспие“), **roz- … se** почеток, ширење (**rozesmát se** „се расмее“, **rozplakat se** „се расплаче“), **za- … se** занесување (**zamilovat se** „се вљуби“, **zamyslet se** „се замисли“) — многу слично на македонскиот.
  cs-c1-impersonal:
    meaning: "безлични se-глаголи со дативот"
    intro: |
      Многу чувства се изразуваат без подмет, лицето во **датив**, а глаголот во 3 лице еднина со **se** — исто како **ми се спие**: **Chce se mi spát.** „Ми се спие.“ **Stýská se mi po domově.** „Ми е мака по дома.“ **Daří se mi dobře.** „Ми оди добро.“ **Zdá se mi, že…** „Ми се чини дека…“ **Nechce se mi.** „Не ми се оди/прави.“ Во минато глаголот е во среден род: **Chtělo se mi plakat.** „Ми се плачеше.“
  cs-c1-numeral-cases:
    meaning: "броевите во косите падежи"
    intro: |
      **dva, tři, čtyři** ја ставаат именката во истиот падеж како нив и се менуваат: **se dvěma přáteli** „со двајца пријатели“, **ve třech dnech** „за три дена“, **ke čtyřem lidem**. Од **pět** нагоре, во номинатив и акузатив бројот и именката се во **генитив множина** (**pět lidí**), но во другите падежи и двата стојат во бараниот падеж: **s pěti lidmi** „со пет луѓе“, **o deseti dnech**.

      Формите: **dvou, dvěma** · **tří (třech), třem, třemi** · **čtyř (čtyřech), čtyřem, čtyřmi** · **pěti** за секој кос падеж од пет нагоре.
  cs-c1-collective:
    meaning: "двата, и броеви за парови и комплети"
    intro: |
      **oba** (маш.) и **obě** (жен., сред.) „двата / двете“ се менуваат како **dva**: **obou, oběma**. **Oba bratři jsou lékaři.** „Двата брата се лекари.“ **s oběma rodiči** „со двата родители“.

      Именките што постојат само во множина — **dveře** „врата“, **kalhoty** „панталони“, **brýle** „очила“, **noviny**, **hodinky** — се бројат со **збирните броеви** **jedny, dvoje, troje, čtvery, patery**: **dvoje dveře** „две врати“, **troje kalhoty**. **dvojí, trojí** значат „двоен, троен вид“: **dvojí metr** „двојни аршини“.
  cs-c1-clitics:
    meaning: "групата клитики на второ место"
    intro: |
      Чешките кратки зборови стојат заедно на **второто место** во реченицата, по првата фраза, во цврст ред:

      **jsem / jsi / jsme / jste, bych / by… → se / si → датив (mi, ti, mu) → акузатив (tě, ho, to)**

      **Včera jsem mu to dal.** „Вчера му го дадов.“ **Dal bych ti ho.** „Би ти го дал.“ **Zeptal se mě.** Групата никогаш не почнува реченица: не *Jsem mu to dal*, туку **Dal jsem mu to.** (Спореди: и македонскиот ги става **му го** заедно, датив пред акузатив.)
    mistakes: ["Дативот оди пред акузативот."]
  cs-c1-particles:
    meaning: "модални честички"
    intro: |
      Чешките честички го додаваат ставот на говорникот:

      - **prý** „наводно, велат“: **Prý bude pršet.** „Велат дека ќе врне.“
      - **vždyť, přece** „па, сепак“: **Vždyť jsem ti to říkal!** „Па ти реков!“ **To přece víš.** „Па тоа го знаеш.“
      - **copak** чудење или прекор во прашања: **Copak to nevidíš?** „Зар не гледаш?“
      - **kéž** „да даде господ, барем“ (со условен): **Kéž by to byla pravda!** „Барем да беше вистина!“
      - **snad** „можеби, се надевам“, **ať** „нека“: **Ať přijde.** „Нека дојде.“
      - **zrovna, právě** „токму, баш“, **teprve** „дури (толку доцна)“, **dokonce** „дури и“
  cs-c2-short-adjectives:
    meaning: "кратки (номинални) придавки"
    intro: |
      Неколку придавки чуваат стара **кратка форма** по **být**, согласувана по род и број: **schopen, schopna, schopno, schopni** „способен“, **spokojen** „задоволен“, **jist** „сигурен“, **ochoten** „подготвен“, **povinen** „должен“, **vinen** „виновен“, **zdráv** „здрав“, **živ** „жив“, **zvědav** „љубопитен“, **nucen** „принуден“. **Nejsem si jist.** „Не сум сигурен.“ **Je ochoten pomoci.** „Подготвен е да помогне.“ Во говорот е почеста долгата форма (**jsem si jistý**); кратката звучи грижливо и книжевно. **rád** „драго ми е, радо“ има само кратка форма.
  cs-c2-bookish-conjunctions:
    meaning: "сврзници на пишаниот стил"
    intro: |
      Пишаниот чешки има свои сврзници:

      - **neboť** „зашто“ (причина, по главната реченица), **jelikož** „бидејќи“
      - **nýbrž** „туку“ по негација: **ne dnes, nýbrž zítra** „не денес, туку утре“
      - **avšak, nicméně** „меѓутоа“, **leč** (книжевно) „но“
      - **tudíž** „според тоа“, **totiž** „имено, имено затоа“ (никогаш прво во реченицата)
      - **ač, ačkoli(v)** „иако“, **nechť** „нека“ (= ať), **jest** старо „е“
  cs-c2-genitive-verbs:
    meaning: "глаголи што бараат генитив"
    intro: |
      Група глаголи, главно повратни, земаат објект во **генитив** — белег на грижлив чешки: **týkat se** „се однесува на“ (**To se týká všech.** „Тоа се однесува на сите.“), **všimnout si** „забележи“, **vážit si** „цени“, **bát se** „се плаши од“, **zúčastnit se** „учествува во“, **dosáhnout** „постигне“ (**dosáhnout cíle**), **zbavit se** „се ослободи од“, **využít** „искористи“, **zeptat se** „праша (некого)“. Во говорот некои минуваат во други падежи (**všimnout si toho / to**), но стандард е генитивот.
  cs-c2-spoken:
    meaning: "обичниот чешки: секојдневниот говорен стандард"
    intro: |
      Повеќето Чеси во секојдневието зборуваат **obecná čeština**, а модерната проза ја пишува:

      - **ý → ej**: **dobrej, bejt, mlejn** (dobrý, být, mlýn)
      - **é → ý / í**: **dobrý pivo, mlíko** (dobré pivo, mléko)
      - **v-** пред почетно o: **vokno, von** (okno, on)
      - една наставка **-ma** во инструментал множина: **s dobrejma lidma**
      - глаголи: **dělaj, maj** (dělají, mají), **bysme** (bychom), **sem** наместо **jsem**
      - **jo** „да“, **teda** „па, значи“

      Не е погрешно, само е неформално; во пишување и официјален говор се користат стандардните форми.
  cs-c2-diminutives:
    meaning: "деминутиви и милувалки"
    intro: |
      Чешкиот постојано користи деминутиви, за малечкост, милост или учтивост: **-ek / -ka / -ko** (**domek, chvilka, okénko**), двојни **-eček / -ička / -íčko** (**domeček, chvilička**), кај придавки **-ičký / -inký / -oučký** (**maličký, malinký** „малечок“, **teploučký**). **Počkejte chvilku.** „Почекајте малку.“ **Dáte si trošku kávy?** „Ќе се напиете малку кафе?“

      Семејните зборови се главно деминутиви во секојдневието: **maminka, tatínek, babička, dědeček**. Некои добиле ново значење: **ručička** „стрелка на часовник“, **koníček** „хоби“.
  cs-c2-generalising:
    meaning: "-koli(v): кој и да е, што и да е, каде и да е"
    intro: |
      **-koli** или **-koliv** додадено на прашален збор значи „било, -годе“: **kdokoli** „кој и да е, било кој“, **cokoli(v)** „што и да е“, **kdykoli** „било кога“, **kamkoli** „било каде (накај)“, **jakýkoli** „било каков“, **jakkoli** „како и да е“. **Můžeš přijít kdykoli.** „Можеш да дојдеш било кога.“ **Udělám cokoliv.** „Ќе направам што и да е.“

      Допусните реченици користат **ať (už) … jakkoli / kdokoli / nebo**: **Ať už je to kdokoli, neotvírej.** „Кој и да е, не отворај.“ **Ať prší nebo ne, půjdu.** „Врнело или не, ќе одам.“
  cs-c2-transgressives:
    meaning: "трансгресиви во книжевноста и во цврсти изрази"
    intro: |
      Книжевноста од 19 век и постара е полна со **трансгресиви** (přechodníky), глаголски прилози што се согласуваат со подметот по род и број:

      - сегашни (несвршени глаголи): **-a / -e** маш. едн., **-ouc / -íc** жен. и сред. едн., **-ouce / -íce** множина: **nesa, nesouc, nesouce** „носејќи“, **vida, vidouc** „гледајќи“
      - минати (свршени глаголи): **-v / -vši / -vše**: **udělav, udělavši, udělavše** „откако направил“

      Денес живеат во цврсти изрази: **chtě nechtě** „сакал-не сакал“, **soudě podle** „судејќи по“, **vyjma** „освен“, **počínaje… konče** „почнувајќи од… завршувајќи со“, **takřka** „речиси“ и **vida** „гледај ти“. Треба да ги препознаваш, не да ги користиш.
  cs-c2-past-conditional:
    meaning: "минатиот условен начин"
    intro: |
      Грижливиот чешки разликува нереално минато со додадено **byl** на условниот: **Byl bych přišel, kdybych to byl věděl.** „Ќе бев дошол да знаев.“ Редот е **bych byl** по првиот збор: **Já bych byl přišel.** Во секојдневниот говор простиот условен ги врши двете работи (**Přišel bych, kdybych to věděl.**), а времето го кажува контекстот; минатиот условен звучи прецизно и книжевно.
  cs-c2-negative-imperative:
    meaning: "видот во одречните заповеди"
    intro: |
      Одречните заповеди обично се **несвршени**: **Neotvírej okno!** „Не отворај го прозорецот!“ **Neříkej to nikomu.** „Не кажувај никому.“ Одречен **свршен** глагол е **предупредување** од несреќа: **Nespadni!** „Внимавај да не паднеш!“ **Neztrať to!** „Да не го загубиш!“ **Nezapomeň!** „Да не заборавиш!“ — заборавањето никогаш не е намерно, па тука свршениот вид е нормален. (Македонскиот прави исто: **немој да заборавиш**.)
  cs-c2-word-order:
    meaning: "редот на зборовите: познатото прво, новото последно"
    intro: |
      Чешкиот ја подредува реченицата според информацијата, не според граматиката: **познатото** прво, **новото** последно. **Muž vešel do pokoje.** „Човекот влезе во собата.“ **Do pokoje vešel muž.** „Во собата влезе еден човек.“ Затоа реченица што почнува со време или место често го става подметот на крајот: **Včera přijel můj bratr.** „Вчера дојде брат ми.“ **Najednou zazvonil telefon.** „Одеднаш заѕвони телефонот.“

      Клитиките сепак го држат второто место: **Včera mi volal Petr.** „Вчера ми се јави Петр.“
