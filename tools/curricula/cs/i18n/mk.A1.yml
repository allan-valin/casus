# Macedonian text of the Czech course, A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and spelling: "Гласови и правопис"
  Pronouns and 'být': "Заменки и „být“"
  The present tense: "Сегашно време"
  Nouns and the cases: "Именки и падежи"
lessons:
  cs-sounds:
    meaning: "азбуката: háček, čárka, ě, ů"
    intro: |
      Чешкиот се пишува како што се изговара, со два знака:

      - **čárka** (´) ја прави самогласката **долга**: **a/á, e/é, i/í, o/ó, u/ú, y/ý**; **ů** (со кругче) е исто долго *ú*. Должината менува значење: **byt** (стан) – **být** (биде).
      - **háček** (ˇ) омекнува: **č** = **ч**, **š** = **ш**, **ž** = **ж**, **ř** (треперливо р истовремено со ж — славниот чешки глас), **ň** = **њ**, **ď, ť** = меки д, т (блиску до **ѓ, ќ**); **ě** ја омекнува согласката пред неа: **dě** = *дје*, **mě** = *мње*.

      **ch** е една буква (по h во азбуката) и звучи како **х**. Нагласокот е секогаш на **првиот слог**.
    mistakes: ["ů е долго ú: dům, stůl, můj."]
  cs-byt:
    meaning: "личните заменки и být „сум“"
    intro: |
      **já** јас, **ty** ти, **on / ona / ono** тој / таа / тоа, **my** ние, **vy** вие (и учтиво **Vy**), **oni / ony / ona** тие. Наставката на глаголот кажува кој, па заменките обично се испуштаат.

      **být**: **jsem, jsi, je, jsme, jste, jsou** (спореди **сум, си, е, сме, сте, се**). Одречно: **nejsem, nejsi, není, nejsme, nejste, nejsou**.
  cs-present:
    meaning: "сегашно време: глаголи на -ám, -ím, -u"
    intro: |
      Чешките глаголи следат три главни модели, препознатливи по 1 лице:

      | | dělat (прави) | mluvit (зборува) | psát (пишува) |
      |---|---|---|---|
      | já | děl**ám** | mluv**ím** | píš**u** |
      | ty | děl**áš** | mluv**íš** | píš**eš** |
      | on | děl**á** | mluv**í** | píš**e** |
      | my | děl**áme** | mluv**íme** | píš**eme** |
      | vy | děl**áte** | mluv**íte** | píš**ete** |
      | oni | děl**ají** | mluv**í** | píš**ou** |

      Кај третата група основата се учи со секој глагол: **psát → píšu**, **číst → čtu**, **pít → piju**.
  cs-negation:
    meaning: "негација: ne- споено со глаголот"
    intro: |
      **ne-** се пишува заедно со глаголот: **mám → nemám** „немам“, **vím → nevím** „не знам“, **je → není**. Чешкиот користи двојна негација, како македонскиот: **Nikdo nic neví.** „Никој ништо не знае.“ (**nikdo** никој, **nic** ништо, **nikdy** никогаш, **nikde** никаде).
  cs-questions:
    meaning: "прашални зборови"
    intro: |
      **kdo** кој, **co** што, **kde** каде, **kam** каде (накај), **odkud** од каде, **kdy** кога, **proč** зошто, **jak** како, **kolik** колку, **který** кој (од нив), **jaký** каков, **čí** чиј. Прашањата да/не само ја креваат интонацијата, често со глаголот напред: **Máš čas?** „Имаш време?“
  cs-gender:
    meaning: "род: машки (жив, нежив), женски, среден"
    intro: |
      Чешкиот нема членови, но секоја именка има род, видлив главно по наставката, а показното **ten / ta / to** (овој, тој) се согласува со неа:

      - **машки**: согласка — **ten muž** (маж), **ten hrad** (замок). Машките се делат на **живи** (луѓе, животни) и **неживи**, кои се менуваат различно.
      - **женски**: **-a, -e/-ě**, некои согласки — **ta žena** (жена), **ta růže** (роза), **ta kost** (коска)
      - **среден**: **-o, -e, -í** — **to město** (град), **to moře** (море), **to nádraží** (станица)
  cs-accusative:
    meaning: "акузативот: објектот"
    intro: |
      Директниот објект: женските **-a → -u** (**žena → ženu**), **-e → -i** (**růže → růži**); живите машки земаат **-a** или **-e** (**pán → pána**, **muž → muže**); неживите машки и средните **не се менуваат** (**vidím hrad, vidím město**). Го земаат и предлозите на движење **na, do… pro, za**: **na poštu** „на пошта“.
  cs-locative:
    meaning: "локативот: во, на, за (по v, na, o, po, při)"
    intro: |
      Само по предлози: **v / ve** (во), **na** (на), **o** (за, околу), **po** (по), **při** (при). Наставки: **-e/-ě** (**v Praze, na poště, ve městě**), **-u** (**v domě / v domu, na hradu**), **-i** (**v práci, na ulici**), живи машки **-ovi** (**o bratrovi**). Множина **-ech, -ách, -ích**.

      Внимавај на промените на согласките пред **-e/-ě**: **k → c** (Amerika → v Americe), **h → z** (Praha → v Praze), **ch → š**, **r → ř** (sestra → o sestře).
    mistakes: ["h станува z пред локативното -e."]
  cs-genitive:
    meaning: "генитивот: на, по do, z, bez, u, od"
    intro: |
      Припадност и количество (**šálek kávy** „шолја кафе“, **hodně lidí** „многу луѓе“) и по **do** (во, до), **z / ze** (од, надвор од), **bez** (без), **u** (кај некого), **od** (од), **vedle** (до, покрај), **kromě** (освен). Наставки: **-a/-u** (маш., сред.: **do města, bez cukru**), **-y/-e** (жен.: **z Prahy, do školy**).
  cs-instrumental:
    meaning: "инструменталот: со, преку"
    intro: |
      **-em** (маш., сред.: **s bratrem, autem** „со кола“), **-ou** (жен.: **s maminkou, tramvají**), множина **-y, -ami, -emi**. По **s / se** (со), **před** (пред), **za** (зад), **nad** (над), **pod** (под), **mezi** (меѓу), за средство: **jedu vlakem** „патувам со воз“, и по **být** за занимања: **Je učitelem.** „Тој е учител.“
  cs-adjectives:
    meaning: "тврди придавки -ý, -á, -é и меки -í"
    intro: |
      **Тврдите** придавки завршуваат на **-ý, -á, -é** за машки, женски, среден: **nový dům, nová kniha, nové auto**. **Меките** завршуваат на **-í** во сите три: **moderní, cizí**. Се согласуваат по род, број и падеж: **v novém domě, s novou knihou**.
  cs-possessives:
    meaning: "присвојни: мој, твој, наш…"
    intro: |
      **můj / moje** мој, **tvůj / tvoje** твој, **jeho** негов, **její** нејзин, **náš** наш, **váš** ваш, **jejich** нивни; **svůj** свој (се однесува на подметот). Се согласуваат со именката: **můj bratr, moje sestra, moje auto**. **jeho, jejich** никогаш не се менуваат.
  cs-numbers:
    meaning: "броеви и генитив множина по пет"
    intro: |
      **1 jeden / jedna / jedno, 2 dva / dvě, 3 tři, 4 čtyři, 5 pět, 6 šest, 7 sedm, 8 osm, 9 devět, 10 deset, 20 dvacet, 100 sto.** По **2–4** именката е во номинатив множина (**dva bratři, tři knihy**); од **5 нагоре** и по **mnoho, hodně, kolik** во **генитив множина** (**pět bratrů, deset knih**), а глаголот е во еднина: **Pět lidí přišlo.** „Дојдоа пет луѓе.“
