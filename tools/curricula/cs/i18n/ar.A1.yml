# Arabic text of the Czech course, A1 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Sounds and spelling: "الأصوات والإملاء"
  Pronouns and 'být': "الضمائر و«být»"
  The present tense: "المضارع"
  Nouns and the cases: "الأسماء والحالات"
lessons:
  cs-sounds:
    meaning: "الأبجدية: háček وčárka وě وů"
    intro: |
      تُكتب التشيكية كما تُنطق، مع علامتين:

      - **čárka** (´) تجعل الصائت **طويلًا**: **a/á، e/é، i/í، o/ó، u/ú، y/ý**؛ و**ů** (بحلقة) هي أيضًا *ú* طويلة. والطول يغيّر المعنى: **byt** (شقة) – **být** (يكون).
      - **háček** (ˇ) يليّن: **č** = تش، **š** = ش، **ž** = ج الشامية، **ř** (راء مكررة مع ž في آن واحد — صوت التشيكية الشهير)، **ň** = نْي، **ď، ť** = دال وتاء ليّنتان؛ و**ě** تليّن الصامت قبلها: **dě** = دْيِه، **mě** = مْنْيِه.

      **ch** حرف واحد (بعد h في الأبجدية) ويُنطق خاءً. والنبر دائمًا على **المقطع الأول**.
    mistakes: ["ů هي ú طويلة: dům، stůl، můj."]
  cs-byt:
    meaning: "الضمائر الشخصية وbýt «يكون»"
    intro: |
      **já** أنا، **ty** أنت، **on / ona / ono** هو / هي / هو (للمحايد)، **my** نحن، **vy** أنتم (وللاحترام **Vy**)، **oni / ony / ona** هم. ولاحقة الفعل تدل على الفاعل، فتُحذف الضمائر عادة.

      **být**: **jsem، jsi، je، jsme، jste، jsou**. والنفي: **nejsem، nejsi، není، nejsme، nejste، nejsou**.
  cs-present:
    meaning: "المضارع: أفعال -ám و-ím و-u"
    intro: |
      تتبع الأفعال التشيكية ثلاثة أنماط رئيسية، تُعرف من صيغة المتكلم:

      | | dělat (يعمل) | mluvit (يتكلم) | psát (يكتب) |
      |---|---|---|---|
      | já | děl**ám** | mluv**ím** | píš**u** |
      | ty | děl**áš** | mluv**íš** | píš**eš** |
      | on | děl**á** | mluv**í** | píš**e** |
      | my | děl**áme** | mluv**íme** | píš**eme** |
      | vy | děl**áte** | mluv**íte** | píš**ete** |
      | oni | děl**ají** | mluv**í** | píš**ou** |

      وفي المجموعة الثالثة يُحفظ الجذر مع كل فعل: **psát → píšu**، **číst → čtu**، **pít → piju**.
  cs-negation:
    meaning: "النفي: ne- متصلة بالفعل"
    intro: |
      تُكتب **ne-** متصلة بالفعل: **mám → nemám** «ليس عندي»، **vím → nevím** «لا أعرف»، **je → není**. والتشيكية تستعمل النفي المزدوج: **Nikdo nic neví.** «لا أحد يعرف شيئًا». (**nikdo** لا أحد، **nic** لا شيء، **nikdy** أبدًا، **nikde** في لا مكان).
  cs-questions:
    meaning: "أدوات الاستفهام"
    intro: |
      **kdo** من، **co** ماذا، **kde** أين، **kam** إلى أين، **odkud** من أين، **kdy** متى، **proč** لماذا، **jak** كيف، **kolik** كم، **který** أيّ، **jaký** أيّ نوع، **čí** لمن. وأسئلة نعم/لا ترفع النغمة فقط، وكثيرًا ما يتقدّم الفعل: **Máš čas?** «هل عندك وقت؟»
  cs-gender:
    meaning: "الجنس: المذكر (العاقل وغيره)، المؤنث، المحايد"
    intro: |
      لا أدوات تعريف في التشيكية، لكن لكل اسم جنسًا يظهر غالبًا في نهايته، واسم الإشارة **ten / ta / to** (هذا، ذلك) يطابقه:

      - **المذكر**: صامت — **ten muž** (رجل)، **ten hrad** (قلعة). وينقسم المذكر إلى **حيّ** (الناس والحيوانات) و**غير حيّ**، ويُصرَّفان تصريفًا مختلفًا.
      - **المؤنث**: **-a، -e/-ě**، وبعض الصوامت — **ta žena** (امرأة)، **ta růže** (وردة)، **ta kost** (عظمة)
      - **المحايد**: **-o، -e، -í** — **to město** (مدينة)، **to moře** (بحر)، **to nádraží** (محطة)
  cs-accusative:
    meaning: "حالة المفعولية: المفعول به"
    intro: |
      المفعول المباشر: المؤنث **-a → -u** (**žena → ženu**)، **-e → -i** (**růže → růži**)؛ والمذكر الحي يأخذ **-a** أو **-e** (**pán → pána**، **muž → muže**)؛ والمذكر غير الحي والمحايد **لا يتغيران** (**vidím hrad، vidím město**). وتأخذها أيضًا حروف جر الحركة **na، do… pro، za**: **na poštu** «إلى البريد».
  cs-locative:
    meaning: "الحالة الظرفية: في، على، عن (بعد v وna وo وpo وpři)"
    intro: |
      لا تأتي إلا بعد حروف الجر: **v / ve** (في)، **na** (على، في)، **o** (عن)، **po** (بعد، في أنحاء)، **při** (عند، أثناء). اللواحق: **-e/-ě** (**v Praze، na poště، ve městě**)، **-u** (**v domě / v domu، na hradu**)، **-i** (**v práci، na ulici**)، والمذكر الحي **-ovi** (**o bratrovi**). والجمع **-ech، -ách، -ích**.

      انتبه إلى تغيّر الصوامت قبل **-e/-ě**: **k → c** (Amerika → v Americe)، **h → z** (Praha → v Praze)، **ch → š**، **r → ř** (sestra → o sestře).
    mistakes: ["تصير h إلى z قبل -e الظرفية."]
  cs-genitive:
    meaning: "حالة الإضافة: الملكية، وبعد do وz وbez وu وod"
    intro: |
      الملكية والكمية (**šálek kávy** «فنجان قهوة»، **hodně lidí** «ناس كثيرون») وبعد **do** (إلى داخل)، **z / ze** (من)، **bez** (بدون)، **u** (عند فلان)، **od** (من عند)، **vedle** (بجانب)، **kromě** (إلا). اللواحق: **-a/-u** (مذكر، محايد: **do města، bez cukru**)، **-y/-e** (مؤنث: **z Prahy، do školy**).
  cs-instrumental:
    meaning: "حالة الآلة: مع، بواسطة"
    intro: |
      **-em** (مذكر، محايد: **s bratrem، autem** «بالسيارة»)، **-ou** (مؤنث: **s maminkou، tramvají**)، والجمع **-y، -ami، -emi**. بعد **s / se** (مع)، **před** (أمام، قبل)، **za** (خلف)، **nad** (فوق)، **pod** (تحت)، **mezi** (بين)، وللوسيلة: **jedu vlakem** «أسافر بالقطار»، وبعد **být** للمهن: **Je učitelem.** «هو معلّم».
  cs-adjectives:
    meaning: "الصفات الصلبة -ý، -á، -é واللينة -í"
    intro: |
      الصفات **الصلبة** تنتهي بـ **-ý، -á، -é** للمذكر والمؤنث والمحايد: **nový dům، nová kniha، nové auto**. و**اللينة** تنتهي بـ **-í** في الثلاثة: **moderní، cizí**. وتطابق الاسم جنسًا وعددًا وحالة: **v novém domě، s novou knihou**.
  cs-possessives:
    meaning: "ضمائر الملكية: لي، لك، لنا…"
    intro: |
      **můj / moje** لي، **tvůj / tvoje** لك، **jeho** له، **její** لها، **náš** لنا، **váš** لكم، **jejich** لهم؛ **svůj** الخاص به (يعود على الفاعل). وتطابق الاسم: **můj bratr، moje sestra، moje auto**. أما **jeho، jejich** فلا تتغيران.
  cs-numbers:
    meaning: "الأعداد والإضافة الجمع بعد الخمسة"
    intro: |
      **1 jeden / jedna / jedno، 2 dva / dvě، 3 tři، 4 čtyři، 5 pět، 6 šest، 7 sedm، 8 osm، 9 devět، 10 deset، 20 dvacet، 100 sto.** بعد **2–4** يكون الاسم في الرفع الجمع (**dva bratři، tři knihy**)؛ ومن **5 فما فوق** وبعد **mnoho، hodně، kolik** في **الإضافة الجمع** (**pět bratrů، deset knih**)، ويكون الفعل مفردًا: **Pět lidí přišlo.** «جاء خمسة أشخاص» — كتمييز العدد في العربية.
