# German text of the Czech course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Written Czech: "Geschriebenes Tschechisch"
  Verbs in depth: "Verben im Detail"
  Numerals and case: "Zahlwörter und Kasus"
  Word order and particles: "Wortstellung und Partikeln"
  High style: "Gehobener Stil"
  Spoken and expressive Czech: "Gesprochenes und expressives Tschechisch"
  Mood and aspect: "Modus und Aspekt"
  Word order: "Wortstellung"
lessons:
  cs-c1-jenz:
    meaning: "das buchsprachliche Relativ jenž"
    intro: |
      Neben **který** nimmt das geschriebene Tschechisch **jenž** „der, welcher“, dekliniert wie das Pronomen **on** mit angehängtem **-ž**: **jenž** (mask. Sg.), **jež** (fem. und neutr., und die meisten Plurale), **jehož** (Gen./Akk.), **jemuž** (Dat.), nach Präpositionen **něhož, němž, nímž, níž, nichž**. **Muž, jenž stál u okna…** „Der Mann, der am Fenster stand …“ **dům, v němž bydlím** „das Haus, in dem ich wohne“.

      Das Possessiv **jehož, jejíž, jejichž** „dessen, deren“ steht auch in **který**-Sätzen: **spisovatel, jehož knihy čtu** „der Schriftsteller, dessen Bücher ich lese“. Gesprochen ersetzt **který** sie alle.
  cs-c1-participial-adjectives:
    meaning: "Adjektive aus dem Partizip Präsens: -ící, -oucí"
    intro: |
      Aus der 3. Person Plural Präsens bildet das Tschechische ein Adjektiv auf **-ící / -oucí** „tuend“: **pracují → pracující** „arbeitend“, **rostou → rostoucí** „wachsend“, **jedou → jedoucí** „fahrend“. Es wird wie **jarní** (weiche Adjektive) dekliniert und ist typisch für geschriebenes und amtliches Tschechisch: **cestující** „Reisende“, **následující den** „der folgende Tag“, **vedoucí** „Leiter“.

      Viele sind gewöhnliche Adjektive geworden: **vzrušující** „aufregend“, **matoucí** „verwirrend“, **budoucí** „künftig“.
  cs-c1-formal-prepositions:
    meaning: "sekundäre Präpositionen und ihre Kasus"
    intro: |
      Aus Nomen und Adverbien gebildete Präpositionen tragen genaue Bedeutungen, jede mit ihrem Kasus:

      - **díky** + Dat. „dank“ (gute Gründe), **kvůli** + Dat. „wegen“ (schlechte oder neutrale), **navzdory** + Dat. „trotz“
      - **během** + Gen. „während“, **kromě** + Gen. „außer“, **místo** + Gen. „anstatt“, **ohledně** + Gen. „bezüglich“
      - im Amtsstil: **v rámci** + Gen. „im Rahmen“, **na základě** + Gen. „auf Grund“, **v souvislosti s** + Instr. „im Zusammenhang mit“, **vzhledem k** + Dat. „in Anbetracht“, **prostřednictvím** + Gen. „mittels“
  cs-c1-iteratives:
    meaning: "Iterativa: pflegte zu, neigt zu"
    intro: |
      Aus imperfektiven Verben bildet das Tschechische **Iterativa** auf **-ávat / -ívat / -vat** für wiederholte oder gewohnheitsmäßige Handlungen: **chodit → chodívat**, **dělat → dělávat**, **mít → mívat**, **být → bývat**, **hrát → hrávat**. In der Vergangenheit heißen sie „pflegte zu“: **Chodíval jsem sem každý den.** „Ich kam früher jeden Tag hierher.“ Im Präsens „neigt zu“: **V zimě tu bývá hodně sněhu.** „Im Winter liegt hier meist viel Schnee.“

      **Bývalo to lepší.** „Früher war es besser.“ Das Adjektiv **bývalý** „ehemalig“ stammt vom selben Verb.
  cs-c1-prefixes:
    meaning: "Präfixe, die eine Aktionsart hinzufügen"
    intro: |
      Präfixe machen ein Verb nicht nur perfektiv: **do-** bis zum Ende (**dočíst** „zu Ende lesen“), **pře-** noch einmal oder zu viel (**přečíst** „durchlesen“, **přejíst se** „sich überessen“), **na- … se** sich satt (**najíst se** „sich satt essen“, **napít se** „etwas trinken“), **vy- … se** genug (**vyspat se** „ausschlafen“), **roz- … se** beginnen, sich ausbreiten (**rozesmát se** „in Lachen ausbrechen“, **rozplakat se**), **za- … se** sich vertiefen (**zamilovat se** „sich verlieben“, **zamyslet se** „ins Grübeln kommen“).
  cs-c1-impersonal:
    meaning: "unpersönliche se-Verben mit dem Dativ"
    intro: |
      Viele Gefühle werden ohne Subjekt ausgedrückt, die Person im **Dativ**, das Verb in der 3. Person Singular mit **se**: **Chce se mi spát.** „Ich bin müde.“ **Stýská se mi po domově.** „Ich habe Heimweh.“ **Daří se mi dobře.** „Es geht mir gut.“ **Zdá se mi, že…** „Mir scheint, dass …“ **Nechce se mi.** „Ich habe keine Lust.“ In der Vergangenheit ist das Verb neutral: **Chtělo se mi plakat.** „Mir war zum Weinen.“
  cs-c1-numeral-cases:
    meaning: "Zahlwörter in den obliquen Kasus"
    intro: |
      **dva, tři, čtyři** stellen das Nomen in ihren eigenen Kasus und werden dekliniert: **se dvěma přáteli** „mit zwei Freunden“, **ve třech dnech** „in drei Tagen“, **ke čtyřem lidem**. Ab **pět** stehen Zahl und Nomen im Nominativ und Akkusativ im **Genitiv Plural** (**pět lidí**), in den anderen Kasus aber beide im verlangten Kasus: **s pěti lidmi** „mit fünf Leuten“, **o deseti dnech**.

      Die Formen: **dvou, dvěma** · **tří (třech), třem, třemi** · **čtyř (čtyřech), čtyřem, čtyřmi** · **pěti** für jeden obliquen Kasus ab fünf.
  cs-c1-collective:
    meaning: "beide, und Zahlwörter für Paare und Sätze"
    intro: |
      **oba** (mask.) und **obě** (fem., neutr.) „beide“ werden wie **dva** dekliniert: **obou, oběma**. **Oba bratři jsou lékaři.** „Beide Brüder sind Ärzte.“ **s oběma rodiči** „mit beiden Eltern“.

      Pluraliatantum — **dveře** „Tür“, **kalhoty** „Hose“, **brýle** „Brille“, **noviny**, **hodinky** — zählt man mit den **Gattungszahlwörtern** **jedny, dvoje, troje, čtvery, patery**: **dvoje dveře** „zwei Türen“, **troje kalhoty**. **dvojí, trojí** heißen „zweierlei / dreierlei“: **dvojí metr** „doppelte Moral“.
  cs-c1-clitics:
    meaning: "die Klitikagruppe an zweiter Stelle"
    intro: |
      Tschechische Kurzwörter stehen zusammen an der **zweiten Stelle** des Satzes, nach der ersten Phrase, in fester Reihenfolge:

      **jsem / jsi / jsme / jste, bych / by… → se / si → Dativ (mi, ti, mu) → Akkusativ (tě, ho, to)**

      **Včera jsem mu to dal.** „Gestern habe ich es ihm gegeben.“ **Dal bych ti ho.** „Ich würde ihn dir geben.“ **Zeptal se mě.** Die Gruppe beginnt nie den Satz: nicht *Jsem mu to dal*, sondern **Dal jsem mu to.**
    mistakes: ["Der Dativ steht vor dem Akkusativ."]
  cs-c1-particles:
    meaning: "Modalpartikeln"
    intro: |
      Tschechische Partikeln fügen die Haltung des Sprechers hinzu:

      - **prý** „angeblich, man sagt“: **Prý bude pršet.** „Es soll regnen.“
      - **vždyť, přece** „doch, ja“: **Vždyť jsem ti to říkal!** „Ich habe es dir doch gesagt!“ **To přece víš.** „Das weißt du doch.“
      - **copak** Erstaunen oder Vorwurf in Fragen: **Copak to nevidíš?** „Siehst du das etwa nicht?“
      - **kéž** „wenn doch“ (mit Konditional): **Kéž by to byla pravda!**
      - **snad** „vielleicht, hoffentlich“, **ať** „soll“: **Ať přijde.** „Soll er kommen.“
      - **zrovna, právě** „gerade, genau“, **teprve** „erst“, **dokonce** „sogar“
  cs-c2-short-adjectives:
    meaning: "kurze (nominale) Adjektive"
    intro: |
      Einige Adjektive bewahren nach **být** eine alte **Kurzform**, die sich nach Genus und Numerus richtet: **schopen, schopna, schopno, schopni** „fähig“, **spokojen** „zufrieden“, **jist** „sicher“, **ochoten** „bereit“, **povinen** „verpflichtet“, **vinen** „schuldig“, **zdráv** „gesund“, **živ** „lebendig“, **zvědav** „neugierig“, **nucen** „gezwungen“. **Nejsem si jist.** „Ich bin nicht sicher.“ **Je ochoten pomoci.** „Er ist bereit zu helfen.“ Gesprochen ist die Langform häufiger (**jsem si jistý**); die kurze klingt sorgfältig und schriftlich. **rád** „froh“ hat nur eine Kurzform.
  cs-c2-bookish-conjunctions:
    meaning: "Konjunktionen des Schriftstils"
    intro: |
      Das geschriebene Tschechisch hat eigene Konnektoren:

      - **neboť** „denn“ (Grund, nach dem Hauptsatz), **jelikož** „da“
      - **nýbrž** „sondern“ nach Verneinung: **ne dnes, nýbrž zítra** „nicht heute, sondern morgen“
      - **avšak, nicméně** „jedoch“, **leč** (literarisch) „aber“
      - **tudíž** „folglich“, **totiž** „nämlich“ (nie am Satzanfang)
      - **ač, ačkoli(v)** „obwohl“, **nechť** „möge“ (= ať), **jest** alt „ist“
  cs-c2-genitive-verbs:
    meaning: "Verben mit Genitiv"
    intro: |
      Eine Gruppe meist reflexiver Verben nimmt ein **Genitiv**objekt — ein Zeichen sorgfältigen Tschechisch: **týkat se** „betreffen“ (**To se týká všech.** „Das betrifft alle.“), **všimnout si** „bemerken“, **vážit si** „schätzen“, **bát se** „fürchten“, **zúčastnit se** „teilnehmen an“, **dosáhnout** „erreichen“ (**dosáhnout cíle**), **zbavit se** „loswerden“, **využít** „nutzen“, **zeptat se** „fragen (jemanden)“. Gesprochen wandern manche zu anderen Kasus (**všimnout si toho / to**), Standard ist aber der Genitiv.
  cs-c2-spoken:
    meaning: "Gemeinböhmisch: das gesprochene Alltagstschechisch"
    intro: |
      Die meisten Tschechen sprechen im Alltag **obecná čeština**, und die moderne Literatur schreibt sie:

      - **ý → ej**: **dobrej, bejt, mlejn** (dobrý, být, mlýn)
      - **é → ý / í**: **dobrý pivo, mlíko** (dobré pivo, mléko)
      - **v-** vor anlautendem o: **vokno, von** (okno, on)
      - eine Pluralendung **-ma** im Instrumental: **s dobrejma lidma**
      - Verben: **dělaj, maj** (dělají, mají), **bysme** (bychom), **sem** für **jsem**
      - **jo** „ja“, **teda** „also“

      Es ist nicht falsch, nur informell; schriftlich und förmlich nimmt man die Standardformen.
  cs-c2-diminutives:
    meaning: "Diminutive und Koseformen"
    intro: |
      Tschechisch verwendet ständig Diminutive, für Kleinheit, Zuneigung oder Höflichkeit: **-ek / -ka / -ko** (**domek, chvilka, okénko**), doppelte **-eček / -ička / -íčko** (**domeček, chvilička**), bei Adjektiven **-ičký / -inký / -oučký** (**maličký, malinký** „winzig“, **teploučký**). **Počkejte chvilku.** „Warten Sie einen Moment.“ **Dáte si trošku kávy?** „Möchten Sie ein bisschen Kaffee?“

      Familienwörter sind im Alltag meist Diminutive: **maminka, tatínek, babička, dědeček**. Manche haben eine neue Bedeutung: **ručička** „Uhrzeiger“, **koníček** „Hobby“.
  cs-c2-generalising:
    meaning: "-koli(v): wer auch immer, was auch immer, wo auch immer"
    intro: |
      **-koli** oder **-koliv** an einem Fragewort ergibt „-auch immer, irgend-“: **kdokoli** „irgendwer, wer auch immer“, **cokoli(v)** „irgendwas, was auch immer“, **kdykoli** „jederzeit“, **kamkoli** „wohin auch immer“, **jakýkoli** „irgendein“, **jakkoli** „wie auch immer“. **Můžeš přijít kdykoli.** „Du kannst jederzeit kommen.“ **Udělám cokoliv.** „Ich tue alles.“

      Einräumende Sätze nehmen **ať (už) … jakkoli / kdokoli / nebo**: **Ať už je to kdokoli, neotvírej.** „Wer es auch ist, mach nicht auf.“ **Ať prší nebo ne, půjdu.** „Ob es regnet oder nicht, ich gehe.“
  cs-c2-transgressives:
    meaning: "Transgressive in Literatur und festen Wendungen"
    intro: |
      Die Literatur des 19. Jahrhunderts und älter ist voller **Transgressive** (přechodníky), Verbaladverbien, die sich nach dem Subjekt in Genus und Numerus richten:

      - Präsens (imperfektive Verben): **-a / -e** mask. Sg., **-ouc / -íc** fem. und neutr. Sg., **-ouce / -íce** Plural: **nesa, nesouc, nesouce** „tragend“, **vida, vidouc** „sehend“
      - Vergangenheit (perfektive Verben): **-v / -vši / -vše**: **udělav, udělavši, udělavše** „getan habend“

      Heute leben sie in festen Wendungen fort: **chtě nechtě** „wohl oder übel“, **soudě podle** „nach … zu urteilen“, **vyjma** „ausgenommen“, **počínaje… konče** „angefangen bei … bis“, **takřka** „fast“ und **vida** „sieh mal an“. Man muss sie erkennen, nicht verwenden.
  cs-c2-past-conditional:
    meaning: "der Konditional der Vergangenheit"
    intro: |
      Sorgfältiges Tschechisch unterscheidet eine irreale Vergangenheit, indem es **byl** zum Konditional fügt: **Byl bych přišel, kdybych to byl věděl.** „Ich wäre gekommen, wenn ich es gewusst hätte.“ Die Reihenfolge ist **bych byl** nach dem ersten Wort: **Já bych byl přišel.** Im Alltag erledigt der einfache Konditional beides (**Přišel bych, kdybych to věděl.**), die Zeit bleibt dem Kontext überlassen; der Vergangenheitskonditional klingt genau und literarisch.
  cs-c2-negative-imperative:
    meaning: "der Aspekt in verneinten Befehlen"
    intro: |
      Verneinte Befehle sind normalerweise **imperfektiv**: **Neotvírej okno!** „Mach das Fenster nicht auf!“ **Neříkej to nikomu.** „Sag es niemandem.“ Ein verneintes **Perfektiv** ist eine **Warnung** vor einem Missgeschick: **Nespadni!** „Pass auf, dass du nicht fällst!“ **Neztrať to!** „Verlier es nicht!“ **Nezapomeň!** „Vergiss nicht!“ — Vergessen geschieht nie absichtlich, daher ist hier das Perfektiv normal.
  cs-c2-word-order:
    meaning: "Wortstellung: Bekanntes zuerst, Neues zuletzt"
    intro: |
      Tschechisch ordnet den Satz nach der Information, nicht nach der Grammatik: **Bekanntes** zuerst, **Neues** zuletzt. **Muž vešel do pokoje.** „Der Mann kam ins Zimmer.“ **Do pokoje vešel muž.** „Ins Zimmer kam ein Mann.“ Ein Satz, der mit einer Zeit- oder Ortsangabe beginnt, setzt das Subjekt daher oft ans Ende: **Včera přijel můj bratr.** „Gestern kam mein Bruder an.“ **Najednou zazvonil telefon.** „Plötzlich klingelte das Telefon.“

      Die Klitika behalten trotzdem die zweite Stelle: **Včera mi volal Petr.** „Gestern hat mich Petr angerufen.“
