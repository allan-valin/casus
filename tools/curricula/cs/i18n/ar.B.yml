# Arabic text of the Czech course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Conditions and clauses: "الشرط والجمل التابعة"
  Motion and comparison: "الحركة والتفضيل"
  Formal Czech: "التشيكية الرسمية"
lessons:
  cs-conditional:
    meaning: "الشرطي: صيغة -l + bych"
    intro: |
      **صيغة -l + bych، bys، by، bychom، byste، by**: **Dělal bych to.** «كنت سأفعله». **Chtěla bych kávu.** «أودّ قهوة (امرأة)». ومع **kdyby** (لو): **Kdybych měl čas, šel bych.** «لو كان عندي وقت لذهبت». و**aby** (لكي) تأخذ الصيغ نفسها: **Řekl mi, abych přišel.** «قال لي أن آتي».
  cs-relative:
    meaning: "الجمل الموصولة بـ který"
    intro: |
      **který / která / které** (الذي، التي) يطابق اسمه في الجنس والعدد، ويأخذ حالة دوره في الجملة: **muž, který tam stojí** «الرجل الذي يقف هناك»، **žena, kterou znám** «المرأة التي أعرفها»، **dům, ve kterém bydlím** «البيت الذي أسكن فيه». ودائمًا فاصلة قبله. و**co** موصول عام في الكلام: **to, co chceš** «ما تريده».
  cs-conjunctions:
    meaning: "أنّ، لأنّ، عندما، إن/هل"
    intro: |
      **že** أنّ، **protože** لأنّ، **když** عندما / إذا، **jestli / jestliže** إن، هل، **ale** لكن، **nebo** أو، **a** و، **ani** ولا، **než** من (في المقارنة) / قبل أن، **zatímco** بينما، **dokud** ما دام، حتى، **i když** مع أنّ. وقبل كل جملة تابعة فاصلة.
  cs-motion:
    meaning: "أفعال الحركة: سيرًا أو ركوبًا، مرة أو عادة"
    intro: |
      تفرّق التشيكية بين **السير** (**jít / chodit**) و**الركوب** (**jet / jezdit**)، وبين **رحلة واحدة الآن** (**jít، jet**) و**المعتاد المتكرر** (**chodit، jezdit**): **Jdu do práce.** «أنا ذاهب إلى العمل (الآن)». **Chodím do práce pěšky.** «أذهب إلى العمل ماشيًا (عادةً)». **Jedu vlakem.** «أسافر بالقطار». والمستقبل: **půjdu، pojedu**.
  cs-comparison:
    meaning: "التفضيل -ší/-ejší والتفضيل المطلق nej-"
    intro: |
      التفضيل بـ **-ší** أو **-ejší / -ější**: **nový → novější، starý → starší، rychlý → rychlejší**؛ والمطلق **nej-** + التفضيل: **nejstarší، nejrychlejší**. والشاذ: **dobrý → lepší → nejlepší**، **špatný → horší**، **velký → větší**، **malý → menší**. و*من* هي **než**: **Je starší než já.** «هو أكبر مني».
  cs-passive:
    meaning: "المبني للمجهول: být + اسم مفعول بـ -n/-t"
    intro: |
      **být** + اسم المفعول بـ **-n / -t**، مطابقًا للفاعل: **Dům byl postaven v roce 1900.** «بُني البيت سنة 1900». **Okno je otevřeno / otevřené.** «النافذة مفتوحة». وفي الكلام اليومي المجهول الانعكاسي أشيع: **Tady se kouří.** «يُدخَّن هنا». **To se nedělá.** «هذا لا يُفعل».
  cs-vocative:
    meaning: "النداء: مخاطبة الناس"
    intro: |
      ما زالت التشيكية تستعمل **صيغة النداء** عند كل مخاطبة: **pan Novák → pane Nováku!**، **Petr → Petře!**، **Jana → Jano!**، **paní Nováková** (بلا تغيير)، **pan doktor → pane doktore!** اللواحق: المذكر **-e** (مع r → ř)، و**-u** بعد k وh وch وg، و**-i** بعد الصوامت اللينة؛ والمؤنث **-a → -o**.
  cs-gerunds:
    meaning: "صيغ الحال القديمة والمصادر (-ní)"
    intro: |
      **المصادر** المنتهية بـ **-ní / -tí** تسمّي الفعل: **čtení** (القراءة)، **psaní** (الكتابة)، **pití** (الشرب)، **zakázáno kouření** «التدخين ممنوع». أما **صيغ الحال** القديمة (**dělaje** وهو يفعل، **udělav** بعد أن فعل) فلا تعيش إلا في الأدب والعبارات الثابتة (**chtě nechtě** «شاء أم أبى»).
