# German text of the Czech course, A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Past and future: "Vergangenheit und Zukunft"
  More cases: "Weitere Kasus"
  Commands and modal verbs: "Imperativ und Modalverben"
lessons:
  cs-past:
    meaning: "die Vergangenheit: l-Partizip + jsem"
    intro: |
      Die Vergangenheit ist die **l-Form** des Verbs, die sich nach Genus und Numerus richtet, plus **jsem, jsi, jsme, jste** in der 1. und 2. Person (keine in der 3.): **dělal jsem** (ich machte, Mann), **dělala jsem** (Frau), **dělal** (er machte), **dělala** (sie machte), **dělali jsme** (wir machten), **dělaly** (sie machten, alle weiblich).

      Bildung: Infinitiv ohne **-t** plus **-l**: **dělat → dělal, mluvit → mluvil**; manche ändern sich: **být → byl, jít → šel / šla, mít → měl, psát → psal, číst → četl**.
    mistakes: ["Die l-Form richtet sich nach dem Geschlecht der sprechenden Person."]
  cs-aspect:
    meaning: "der Aspekt: imperfektive und perfektive Verben"
    intro: |
      Die meisten Verben bilden Paare: ein **imperfektives** für eine laufende oder wiederholte Handlung (**psát** schreiben, gerade schreiben), ein **perfektives** für eine abgeschlossene (**napsat** fertig schreiben). Perfektive entstehen meist mit Präfix (**psát → napsat, dělat → udělat, číst → přečíst**) oder anderem Suffix (**kupovat → koupit, dávat → dát**).

      Ein perfektives Verb in **Präsensform bedeutet Zukunft**: **Napíšu dopis.** „Ich werde den Brief schreiben.“ Das imperfektive Futur nimmt **budu**: **Budu psát.** „Ich werde schreiben.“
  cs-future:
    meaning: "das Futur: budu + Infinitiv"
    intro: |
      Imperfektive Verben bilden das Futur mit **budu, budeš, bude, budeme, budete, budou** + Infinitiv: **Budu pracovat.** „Ich werde arbeiten.“ Perfektive nehmen ihre Präsensformen (vorige Lektion). **být** selbst: **budu** „ich werde sein“. Bewegungsverben nehmen **po-**: **půjdu** „ich werde gehen“, **pojedu** „ich werde fahren“.
  cs-dative:
    meaning: "der Dativ: zu, für; nach k, kvůli, díky, proti"
    intro: |
      Die Person, der etwas gegeben oder für die etwas getan wird: **Dám to bratrovi.** „Ich gebe es meinem Bruder.“ Endungen: belebte Maskulina **-ovi / -i** (**bratrovi, muži**), unbelebte **-u**, Feminina **-e/-ě, -i** (**sestře, růži**), Neutra **-u, -i**; Plural **-ům, -ám, -ím**. Nach **k / ke** (zu, hin zu), **kvůli** (wegen), **díky** (dank), **proti** (gegen). Viele „Gefallen“-Verben: **Líbí se mi to.** „Es gefällt mir.“
  cs-pronoun-cases:
    meaning: "Personalpronomen in den Kasus"
    intro: |
      Kurzformen stehen an **zweiter** Stelle im Satz: **Vidím tě.** „Ich sehe dich.“ **Dám ti to.** „Ich gebe es dir.“ **Znáš ho?** „Kennst du ihn?“ — Akkusativ **mě, tě, ho, ji, nás, vás, je**; Dativ **mi, ti, mu, jí, nám, vám, jim**. Langformen (**mně, tobě, jemu**) dienen der Betonung und stehen nach Präpositionen: **pro mě, k tobě, s ním** (nach Präposition **on → n-**: **něj, něho, ní**).
  cs-plural:
    meaning: "der Plural"
    intro: |
      Nominativ Plural: harte Maskulina **-y** (**hrad → hrady**), belebte **-i / -ové** (**student → studenti, pán → páni**, mit **k → c, h → z, r → ř**: **kluk → kluci**), Feminina **-y / -e** (**žena → ženy, růže → růže**), Neutra **-a / -e / -í** (**město → města, moře → moře**). Unregelmäßig: **člověk → lidé, dítě → děti, oko → oči, ruka → ruce**.
  cs-imperative:
    meaning: "der Imperativ"
    intro: |
      Vom Stamm der 3. Person Plural: **dělají → dělej! dělejte!**, **píšou → piš! pište!**, **mluví → mluv! mluvte!**; **-me** heißt *lass uns*: **pojďme!** Verneinte Imperative sind meist imperfektiv: **Nedělej to!** Sehr häufig: **pojď / pojďte** (komm), **počkej** (warte), **podívej se** (schau), **promiň / promiňte** (Entschuldigung).
  cs-modals:
    meaning: "Modalverben: müssen, können, wollen, dürfen"
    intro: |
      **muset** müssen (**musím**), **moct** können (**můžu / mohu**), **chtít** wollen (**chci, chceš, chce, chceme, chcete, chtějí**), **smět** dürfen (**smím**), **mít** sollen (**mám**) — alle + Infinitiv: **Musím jít.** „Ich muss gehen.“ **Můžu ti pomoct?** „Kann ich dir helfen?“ **umět** *können (gelernt)*: **Umím plavat.** „Ich kann schwimmen.“
  cs-reflexive:
    meaning: "reflexives se und si"
    intro: |
      **se** (Akkusativ) und **si** (Dativ) gehören zu vielen Verben und stehen an **zweiter** Stelle: **Jmenuju se Pavel.** „Ich heiße Pavel.“ **Dám si kávu.** „Ich nehme einen Kaffee.“ **Myju se.** „Ich wasche mich.“ **Bojím se.** „Ich habe Angst.“ **Pamatuješ si?** „Erinnerst du dich?“
