# Arabic text of the Czech course, C1–C2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Written Czech: "التشيكية المكتوبة"
  Verbs in depth: "الأفعال بتعمق"
  Numerals and case: "الأعداد والحالة"
  Word order and particles: "ترتيب الكلمات والأدوات"
  High style: "الأسلوب الرفيع"
  Spoken and expressive Czech: "التشيكية المحكية والتعبيرية"
  Mood and aspect: "الصيغة والجهة"
  Word order: "ترتيب الكلمات"
lessons:
  cs-c1-jenz:
    meaning: "الموصول الكتابي jenž"
    intro: |
      بجانب **který** تستعمل التشيكية المكتوبة **jenž** «الذي»، ويُصرَّف كالضمير **on** مع إضافة **-ž**: **jenž** (مذكر مفرد)، **jež** (مؤنث ومحايد، ومعظم الجمع)، **jehož** (إضافة/مفعولية)، **jemuž** (قابل)، وبعد حروف الجر **něhož، němž، nímž، níž، nichž**. **Muž, jenž stál u okna…** «الرجل الذي وقف عند النافذة…» **dům, v němž bydlím** «البيت الذي أسكن فيه».

      وضمير الملكية **jehož، jejíž، jejichž** «الذي … له» يُستعمل أيضًا: **spisovatel, jehož knihy čtu** «الكاتب الذي أقرأ كتبه». وفي الكلام تحلّ **který** محلّها كلها.
  cs-c1-participial-adjectives:
    meaning: "صفات من اسم الفاعل الحاضر: -ící، -oucí"
    intro: |
      من الغائب الجمع في المضارع تصوغ التشيكية صفة بـ **-ící / -oucí** «الفاعل»: **pracují → pracující** «العامل»، **rostou → rostoucí** «النامي»، **jedou → jedoucí** «المسافر». تُصرَّف كـ **jarní** (الصفات اللينة) وهي من سمات التشيكية المكتوبة والرسمية: **cestující** «المسافرون»، **následující den** «اليوم التالي»، **vedoucí** «المدير».

      وكثير منها صار صفات عادية: **vzrušující** «مثير»، **matoucí** «محيّر»، **budoucí** «مستقبلي».
  cs-c1-formal-prepositions:
    meaning: "حروف الجر الثانوية وحالاتها"
    intro: |
      حروف الجر المشتقة من الأسماء والظروف تحمل معاني دقيقة، لكل منها حالتها:

      - **díky** + القابل «بفضل» (أسباب حسنة)، **kvůli** + القابل «بسبب» (سيئة أو محايدة)، **navzdory** + القابل «رغم»
      - **během** + الإضافة «خلال»، **kromě** + الإضافة «إلا، فضلًا عن»، **místo** + الإضافة «بدلًا من»، **ohledně** + الإضافة «بشأن»
      - في الأسلوب الرسمي: **v rámci** + الإضافة «في إطار»، **na základě** + الإضافة «بناءً على»، **v souvislosti s** + الآلة «في ما يتصل بـ»، **vzhledem k** + القابل «نظرًا إلى»، **prostřednictvím** + الإضافة «بواسطة»
  cs-c1-iteratives:
    meaning: "أفعال التكرار: كان يفعل عادةً، يميل إلى"
    intro: |
      من الأفعال غير التامة تصوغ التشيكية **أفعال تكرار** بـ **-ávat / -ívat / -vat** للأفعال المتكررة أو المعتادة: **chodit → chodívat**، **dělat → dělávat**، **mít → mívat**، **být → bývat**، **hrát → hrávat**. وفي الماضي تعني «كان يفعل عادةً»: **Chodíval jsem sem každý den.** «كنت آتي هنا كل يوم». وفي الحاضر «من عادته»: **V zimě tu bývá hodně sněhu.** «في الشتاء يكثر الثلج هنا عادةً».

      **Bývalo to lepší.** «كان الأمر أفضل». والصفة **bývalý** «سابق» من الفعل نفسه.
  cs-c1-prefixes:
    meaning: "سوابق تضيف كيفية الفعل"
    intro: |
      السوابق لا تجعل الفعل تامًا فقط: **do-** إلى النهاية (**dočíst** «أتمّ القراءة»)، **pře-** مرة أخرى أو بإفراط (**přečíst** «قرأ كاملًا»، **přejíst se** «أفرط في الأكل»)، **na- … se** حتى الشبع (**najíst se** «أكل حتى شبع»، **napít se** «شرب»)، **vy- … se** كفايةً (**vyspat se** «نام كفايته»)، **roz- … se** البدء والانتشار (**rozesmát se** «انفجر ضاحكًا»، **rozplakat se**)، **za- … se** الاستغراق (**zamilovat se** «وقع في الحب»، **zamyslet se** «استغرق في التفكير»).
  cs-c1-impersonal:
    meaning: "أفعال se غير الشخصية مع القابل"
    intro: |
      كثير من المشاعر يُعبَّر عنه بلا فاعل، والشخص في **القابل** والفعل غائبًا مفردًا مع **se**: **Chce se mi spát.** «أشعر بالنعاس». **Stýská se mi po domově.** «أحنّ إلى الوطن». **Daří se mi dobře.** «أموري حسنة». **Zdá se mi, že…** «يبدو لي أنّ…» **Nechce se mi.** «لا رغبة لي». وفي الماضي يكون الفعل محايدًا: **Chtělo se mi plakat.** «انتابتني رغبة في البكاء».
  cs-c1-numeral-cases:
    meaning: "الأعداد في الحالات غير الرفع"
    intro: |
      **dva، tři، čtyři** تجعل الاسم في حالتها نفسها وتُصرَّف: **se dvěma přáteli** «مع صديقين»، **ve třech dnech** «في ثلاثة أيام»، **ke čtyřem lidem**. ومن **pět** فما فوق يكون العدد واسمه في الرفع والمفعولية **إضافةً جمعًا** (**pět lidí**)، أما في الحالات الأخرى فكلاهما في الحالة المطلوبة: **s pěti lidmi** «مع خمسة أشخاص»، **o deseti dnech**.

      الصيغ: **dvou، dvěma** · **tří (třech)، třem، třemi** · **čtyř (čtyřech)، čtyřem، čtyřmi** · **pěti** لكل الحالات غير الرفع من خمسة فما فوق.
  cs-c1-collective:
    meaning: "كلا، وأعداد الأزواج والمجموعات"
    intro: |
      **oba** (مذكر) و**obě** (مؤنث، محايد) «كلا / كلتا» تُصرَّفان كـ **dva**: **obou، oběma**. **Oba bratři jsou lékaři.** «كلا الأخوين طبيب». **s oběma rodiči** «مع كلا الوالدين».

      والأسماء الموجودة جمعًا فقط — **dveře** «باب»، **kalhoty** «بنطال»، **brýle** «نظارة»، **noviny**، **hodinky** — تُعدّ بـ **أعداد المجموعات** **jedny، dvoje، troje، čtvery، patery**: **dvoje dveře** «بابان»، **troje kalhoty**. و**dvojí، trojí** تعنيان «من نوعين / ثلاثة أنواع»: **dvojí metr** «ازدواجية المعايير».
  cs-c1-clitics:
    meaning: "مجموعة الكلمات الملحقة في الموضع الثاني"
    intro: |
      تقف الكلمات التشيكية القصيرة معًا في **الموضع الثاني** من الجملة، بعد أول عبارة، بترتيب ثابت:

      **jsem / jsi / jsme / jste، bych / by… → se / si → القابل (mi، ti، mu) → المفعولية (tě، ho، to)**

      **Včera jsem mu to dal.** «أمس أعطيته إياه». **Dal bych ti ho.** «كنت سأعطيك إياه». **Zeptal se mě.** ولا تبدأ المجموعة الجملة أبدًا: لا *Jsem mu to dal* بل **Dal jsem mu to.**
    mistakes: ["القابل يأتي قبل المفعولية."]
  cs-c1-particles:
    meaning: "أدوات الموقف"
    intro: |
      تضيف الأدوات التشيكية موقف المتكلم:

      - **prý** «يُقال، حسبما يقولون»: **Prý bude pršet.** «يقولون إنها ستمطر».
      - **vždyť، přece** «ولكن، أليس كذلك»: **Vždyť jsem ti to říkal!** «لكنني قلت لك!» **To přece víš.** «أنت تعرف ذلك طبعًا».
      - **copak** للتعجب أو اللوم في الأسئلة: **Copak to nevidíš?** «ألا تراه؟»
      - **kéž** «ليت» (مع الشرطي): **Kéž by to byla pravda!** «ليته كان صحيحًا!»
      - **snad** «لعلّ»، **ať** «ليـ»: **Ať přijde.** «فليأتِ».
      - **zrovna، právě** «بالضبط، للتو»، **teprve** «لم … إلا (متأخرًا، قليلًا)»، **dokonce** «حتى»
  cs-c2-short-adjectives:
    meaning: "الصفات القصيرة (الاسمية)"
    intro: |
      تحتفظ بعض الصفات بـ **صيغة قصيرة** قديمة بعد **být**، تطابق جنسًا وعددًا: **schopen، schopna، schopno، schopni** «قادر»، **spokojen** «راضٍ»، **jist** «متأكد»، **ochoten** «مستعد»، **povinen** «ملزم»، **vinen** «مذنب»، **zdráv** «سليم»، **živ** «حي»، **zvědav** «فضولي»، **nucen** «مضطر». **Nejsem si jist.** «لست متأكدًا». **Je ochoten pomoci.** «هو مستعد للمساعدة». والصيغة الطويلة أشيع في الكلام (**jsem si jistý**)؛ والقصيرة تبدو متأنية وكتابية. و**rád** «مسرور» لها صيغة قصيرة فقط.
  cs-c2-bookish-conjunctions:
    meaning: "أدوات الربط في الأسلوب الكتابي"
    intro: |
      للتشيكية المكتوبة أدوات ربط خاصة:

      - **neboť** «إذ» (سبب، بعد الجملة الرئيسية)، **jelikož** «بما أنّ»
      - **nýbrž** «بل» بعد النفي: **ne dnes, nýbrž zítra** «لا اليوم بل غدًا»
      - **avšak، nicméně** «غير أنّ»، **leč** (أدبي) «لكن»
      - **tudíž** «لذلك»، **totiž** «أي، ذلك أنّ» (لا تأتي أول الجملة)
      - **ač، ačkoli(v)** «مع أنّ»، **nechť** «ليـ» (= ať)، **jest** قديمة «هو»
  cs-c2-genitive-verbs:
    meaning: "أفعال تتعدى بالإضافة"
    intro: |
      مجموعة من الأفعال، أغلبها انعكاسي، تأخذ مفعولًا في **الإضافة** — علامة التشيكية المتأنية: **týkat se** «يخصّ» (**To se týká všech.** «هذا يخصّ الجميع»)، **všimnout si** «لاحظ»، **vážit si** «قدّر»، **bát se** «خاف من»، **zúčastnit se** «شارك في»، **dosáhnout** «بلغ، حقّق» (**dosáhnout cíle**)، **zbavit se** «تخلّص من»، **využít** «استفاد من»، **zeptat se** «سأل (أحدًا)». وفي الكلام ينتقل بعضها إلى حالات أخرى (**všimnout si toho / to**)، لكن الإضافة هي المعيار.
  cs-c2-spoken:
    meaning: "التشيكية الشائعة: المعيار المحكي اليومي"
    intro: |
      يتكلم معظم التشيك في حياتهم اليومية **obecná čeština**، والأدب الحديث يكتبها:

      - **ý → ej**: **dobrej، bejt، mlejn** (dobrý، být، mlýn)
      - **é → ý / í**: **dobrý pivo، mlíko** (dobré pivo، mléko)
      - **v-** قبل o الأولى: **vokno، von** (okno، on)
      - لاحقة جمع واحدة **-ma** في حالة الآلة: **s dobrejma lidma**
      - الأفعال: **dělaj، maj** (dělají، mají)، **bysme** (bychom)، **sem** بدل **jsem**
      - **jo** «نعم»، **teda** «إذن»

      ليست خطأ بل غير رسمية؛ وفي الكتابة والكلام الرسمي تُستعمل الصيغ المعيارية.
  cs-c2-diminutives:
    meaning: "التصغير والتحبب"
    intro: |
      تستعمل التشيكية التصغير باستمرار للصغر أو المودة أو اللطف: **-ek / -ka / -ko** (**domek، chvilka، okénko**)، ومضاعفًا **-eček / -ička / -íčko** (**domeček، chvilička**)، وفي الصفات **-ičký / -inký / -oučký** (**maličký، malinký** «صغير جدًا»، **teploučký**). **Počkejte chvilku.** «انتظر لحظة». **Dáte si trošku kávy?** «هل تشرب قليلًا من القهوة؟»

      وكلمات العائلة مصغّرة غالبًا في الاستعمال اليومي: **maminka، tatínek، babička، dědeček**. وبعض المصغّرات اتخذ معنى جديدًا: **ručička** «عقرب الساعة»، **koníček** «هواية».
  cs-c2-generalising:
    meaning: "-koli(v): أيًّا كان، مهما، أينما"
    intro: |
      **-koli** أو **-koliv** مضافة إلى أداة استفهام تعني «أيّ … كان»: **kdokoli** «أيّ أحد»، **cokoli(v)** «أيّ شيء، مهما»، **kdykoli** «متى شئت»، **kamkoli** «إلى أي مكان»، **jakýkoli** «أي نوع»، **jakkoli** «كيفما». **Můžeš přijít kdykoli.** «يمكنك المجيء متى شئت». **Udělám cokoliv.** «سأفعل أي شيء».

      وجمل التسليم تستعمل **ať (už) … jakkoli / kdokoli / nebo**: **Ať už je to kdokoli, neotvírej.** «أيًّا كان، لا تفتح». **Ať prší nebo ne, půjdu.** «أمطرت أم لم تمطر، سأذهب».
  cs-c2-transgressives:
    meaning: "صيغ الحال القديمة في الأدب والعبارات الثابتة"
    intro: |
      أدب القرن التاسع عشر وما قبله مليء بـ **صيغ الحال** (přechodníky)، وهي ظروف فعلية تطابق الفاعل جنسًا وعددًا:

      - الحاضرة (أفعال غير تامة): **-a / -e** للمذكر المفرد، **-ouc / -íc** للمؤنث والمحايد المفرد، **-ouce / -íce** للجمع: **nesa، nesouc، nesouce** «حاملًا»، **vida، vidouc** «ناظرًا»
      - الماضية (أفعال تامة): **-v / -vši / -vše**: **udělav، udělavši، udělavše** «بعد أن فعل»

      واليوم تعيش في عبارات ثابتة: **chtě nechtě** «شاء أم أبى»، **soudě podle** «حكمًا بـ»، **vyjma** «باستثناء»، **počínaje… konče** «ابتداءً بـ… وانتهاءً بـ»، **takřka** «تقريبًا»، و**vida** «انظر إلى ذلك». يكفي أن تتعرّفها، لا أن تستعملها.
  cs-c2-past-conditional:
    meaning: "الشرطي الماضي"
    intro: |
      تميّز التشيكية المتأنية الماضي غير الواقع بإضافة **byl** إلى الشرطي: **Byl bych přišel, kdybych to byl věděl.** «لو كنت عرفت لكنت جئت». والترتيب **bych byl** بعد أول كلمة: **Já bych byl přišel.** وفي الكلام اليومي يؤدي الشرطي البسيط الوظيفتين (**Přišel bych, kdybych to věděl.**) ويُترك الزمن للسياق؛ والشرطي الماضي يبدو دقيقًا وأدبيًا.
  cs-c2-negative-imperative:
    meaning: "الجهة في النهي"
    intro: |
      يكون النهي عادةً **غير تام**: **Neotvírej okno!** «لا تفتح النافذة!» **Neříkej to nikomu.** «لا تخبر أحدًا». والفعل **التام** المنفي **تحذير** من حادث: **Nespadni!** «احذر أن تقع!» **Neztrať to!** «لا تُضِعه!» **Nezapomeň!** «لا تنسَ!» — فالنسيان لا يكون عمدًا، ولذا التام هنا هو المعتاد.
  cs-c2-word-order:
    meaning: "ترتيب الكلمات: المعروف أولًا والجديد آخرًا"
    intro: |
      ترتّب التشيكية الجملة بحسب المعلومة لا بحسب النحو: **المعروف** أولًا و**الجديد** آخرًا. **Muž vešel do pokoje.** «دخل الرجلُ الغرفة». **Do pokoje vešel muž.** «دخل الغرفةَ رجلٌ». ولذا الجملة التي تبدأ بظرف زمان أو مكان تضع الفاعل غالبًا في آخرها: **Včera přijel můj bratr.** «وصل أخي أمس». **Najednou zazvonil telefon.** «فجأةً رنّ الهاتف».

      ومع ذلك تحتفظ الكلمات الملحقة بالموضع الثاني: **Včera mi volal Petr.** «اتصل بي بيتر أمس».
