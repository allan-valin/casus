# Macedonian text of the Czech course, A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Past and future: "Минато и идно"
  More cases: "Уште падежи"
  Commands and modal verbs: "Заповеди и модални глаголи"
lessons:
  cs-past:
    meaning: "минатото: л-партицип + jsem"
    intro: |
      Минатото е **л-формата** на глаголот, согласувана по род и број — истата што ја има и македонскиот (**правел, правела**) — плус **jsem, jsi, jsme, jste** во 1 и 2 лице (без во 3): **dělal jsem** (правев, маж), **dělala jsem** (жена), **dělal** (правеше тој), **dělala** (таа), **dělali jsme** (правевме), **dělaly** (правеа, сите жени).

      Образување: инфинитив без **-t** плус **-l**: **dělat → dělal, mluvit → mluvil**; некои се менуваат: **být → byl, jít → šel / šla, mít → měl, psát → psal, číst → četl**.
    mistakes: ["л-формата се согласува со родот на говорникот."]
  cs-aspect:
    meaning: "видот: несвршени и свршени глаголи"
    intro: |
      Како во македонскиот, повеќето глаголи доаѓаат во парови: **несвршен** за дејство во тек или повторено (**psát** пишува), **свршен** за едно завршено дејство (**napsat** напише). Свршените обично се со представка (**psát → napsat, dělat → udělat, číst → přečíst**) или со друга наставка (**kupovat → koupit, dávat → dát**).

      Свршен глагол во **сегашна форма значи иднина**: **Napíšu dopis.** „Ќе го напишам писмото.“ Несвршеното идно се гради со **budu**: **Budu psát.** „Ќе пишувам.“
  cs-future:
    meaning: "идното време: budu + инфинитив"
    intro: |
      Несвршените глаголи го градат идното со **budu, budeš, bude, budeme, budete, budou** + инфинитив: **Budu pracovat.** „Ќе работам.“ Свршените ги користат сегашните форми (претходната лекција). Самиот **být**: **budu** „ќе бидам“. Глаголите на движење земаат **po-**: **půjdu** „ќе одам“, **pojedu** „ќе патувам“.
  cs-dative:
    meaning: "дативот: на, за; по k, kvůli, díky, proti"
    intro: |
      Лицето на кое нешто му се дава или за кое се прави: **Dám to bratrovi.** „Ќе му го дадам на брат ми.“ Наставки: живи машки **-ovi / -i** (**bratrovi, muži**), неживи **-u**, женски **-e/-ě, -i** (**sestře, růži**), средни **-u, -i**; множина **-ům, -ám, -ím**. По **k / ke** (кон, кај), **kvůli** (поради), **díky** (благодарение на), **proti** (против). Многу глаголи на „допаѓање“: **Líbí se mi to.** „Ми се допаѓа.“
  cs-pronoun-cases:
    meaning: "личните заменки во падежите"
    intro: |
      Кратките форми стојат **второ** во реченицата: **Vidím tě.** „Те гледам.“ **Dám ti to.** „Ќе ти го дадам.“ **Znáš ho?** „Го знаеш?“ — акузатив **mě, tě, ho, ji, nás, vás, je**; датив **mi, ti, mu, jí, nám, vám, jim** (речиси исто како **ми, ти, му**). Долгите форми (**mně, tobě, jemu**) се за нагласување и по предлози: **pro mě, k tobě, s ním** (по предлог **on → n-**: **něj, něho, ní**).
  cs-plural:
    meaning: "множината"
    intro: |
      Номинатив множина: тврди машки **-y** (**hrad → hrady**), живи **-i / -ové** (**student → studenti, pán → páni**, со **k → c, h → z, r → ř**: **kluk → kluci**), женски **-y / -e** (**žena → ženy, růže → růže**), средни **-a / -e / -í** (**město → města, moře → moře**). Неправилни: **člověk → lidé, dítě → děti, oko → oči, ruka → ruce**.
  cs-imperative:
    meaning: "заповедниот начин"
    intro: |
      Од основата на 3 лице множина: **dělají → dělej! dělejte!**, **píšou → piš! pište!**, **mluví → mluv! mluvte!**; **-me** значи *ајде да*: **pojďme!** Одречните заповеди обично се несвршени: **Nedělej to!** „Немој да го правиш тоа!“ Многу чести: **pojď / pojďte** (дојди), **počkej** (чекај), **podívej se** (погледни), **promiň / promiňte** (извини).
  cs-modals:
    meaning: "модални глаголи: мора, може, сака, смее"
    intro: |
      **muset** мора (**musím**), **moct** може (**můžu / mohu**), **chtít** сака (**chci, chceš, chce, chceme, chcete, chtějí**), **smět** смее (**smím**), **mít** треба (**mám**) — сите + инфинитив: **Musím jít.** „Морам да одам.“ **Můžu ti pomoct?** „Може да ти помогнам?“ **umět** *знае (да)*: **Umím plavat.** „Знам да пливам.“
  cs-reflexive:
    meaning: "повратните se и si"
    intro: |
      **se** (акузатив) и **si** (датив) — како македонските **се** и **си** — припаѓаат на многу глаголи и стојат **второ**: **Jmenuju se Pavel.** „Се викам Павел.“ **Dám si kávu.** „Ќе си земам кафе.“ **Myju se.** „Се мијам.“ **Bojím se.** „Се плашам.“ **Pamatuješ si?** „Се сеќаваш?“
