# Arabic text of the Czech course, A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Past and future: "الماضي والمستقبل"
  More cases: "حالات أخرى"
  Commands and modal verbs: "الأمر والأفعال الناقصة"
lessons:
  cs-past:
    meaning: "الماضي: صيغة -l + jsem"
    intro: |
      الماضي هو **صيغة -l** من الفعل، تطابق في الجنس والعدد، مع **jsem، jsi، jsme، jste** للمتكلم والمخاطب (ولا شيء للغائب): **dělal jsem** (عملتُ، لرجل)، **dělala jsem** (لامرأة)، **dělal** (عمل)، **dělala** (عملت)، **dělali jsme** (عملنا)، **dělaly** (عملن).

      الصياغة: المصدر بلا **-t** مع **-l**: **dělat → dělal، mluvit → mluvil**؛ وبعضها يتغير: **být → byl، jít → šel / šla، mít → měl، psát → psal، číst → četl**.
    mistakes: ["صيغة -l تطابق جنس المتكلم."]
  cs-aspect:
    meaning: "الجهة: الأفعال غير التامة والتامة"
    intro: |
      تأتي معظم الأفعال أزواجًا: **غير تام** لفعل جارٍ أو متكرر (**psát** يكتب)، و**تام** لفعل واحد منجز (**napsat** كَتَبَ حتى أتمّ). وتُصاغ التامة غالبًا بسابقة (**psát → napsat، dělat → udělat، číst → přečíst**) أو بلاحقة أخرى (**kupovat → koupit، dávat → dát**).

      والفعل التام في **صيغة المضارع يعني المستقبل**: **Napíšu dopis.** «سأكتب الرسالة». ومستقبل غير التام بـ **budu**: **Budu psát.** «سأكون أكتب».
  cs-future:
    meaning: "المستقبل: budu + المصدر"
    intro: |
      تصوغ الأفعال غير التامة المستقبل بـ **budu، budeš، bude، budeme، budete، budou** + المصدر: **Budu pracovat.** «سأعمل». والتامة تستعمل صيغها المضارعة (الدرس السابق). و**být** نفسه: **budu** «سأكون». وأفعال الحركة تأخذ **po-**: **půjdu** «سأذهب ماشيًا»، **pojedu** «سأذهب راكبًا».
  cs-dative:
    meaning: "حالة القابل: لـ، إلى؛ بعد k وkvůli وdíky وproti"
    intro: |
      الشخص الذي يُعطى شيئًا أو يُفعل له: **Dám to bratrovi.** «سأعطيه لأخي». اللواحق: المذكر الحي **-ovi / -i** (**bratrovi، muži**)، وغير الحي **-u**، والمؤنث **-e/-ě، -i** (**sestře، růži**)، والمحايد **-u، -i**؛ والجمع **-ům، -ám، -ím**. وبعد **k / ke** (نحو، إلى عند)، **kvůli** (بسبب)، **díky** (بفضل)، **proti** (ضد). وكثير من أفعال الإعجاب: **Líbí se mi to.** «يعجبني».
  cs-pronoun-cases:
    meaning: "الضمائر الشخصية في الحالات"
    intro: |
      الصيغ القصيرة تأتي **ثانيةً** في الجملة: **Vidím tě.** «أراك». **Dám ti to.** «سأعطيك إياه». **Znáš ho?** «هل تعرفه؟» — المفعولية **mě، tě، ho، ji، nás، vás، je**؛ والقابل **mi، ti، mu، jí، nám، vám، jim**. والصيغ الطويلة (**mně، tobě، jemu**) للتوكيد وبعد حروف الجر: **pro mě، k tobě، s ním** (بعد حرف الجر **on → n-**: **něj، něho، ní**).
  cs-plural:
    meaning: "الجمع"
    intro: |
      الرفع الجمع: المذكر الصلب **-y** (**hrad → hrady**)، والحي **-i / -ové** (**student → studenti، pán → páni**، مع **k → c، h → z، r → ř**: **kluk → kluci**)، والمؤنث **-y / -e** (**žena → ženy، růže → růže**)، والمحايد **-a / -e / -í** (**město → města، moře → moře**). والشاذ: **člověk → lidé، dítě → děti، oko → oči، ruka → ruce**.
  cs-imperative:
    meaning: "الأمر"
    intro: |
      من جذر الغائب الجمع: **dělají → dělej! dělejte!**، **píšou → piš! pište!**، **mluví → mluv! mluvte!**؛ و**-me** تعني *هيا بنا*: **pojďme!** والنهي يكون غالبًا غير تام: **Nedělej to!** «لا تفعل ذلك!» وشائعة جدًا: **pojď / pojďte** (تعالَ)، **počkej** (انتظر)، **podívej se** (انظر)، **promiň / promiňte** (عفوًا).
  cs-modals:
    meaning: "الأفعال الناقصة: يجب، يستطيع، يريد، يجوز"
    intro: |
      **muset** يجب (**musím**)، **moct** يستطيع (**můžu / mohu**)، **chtít** يريد (**chci، chceš، chce، chceme، chcete، chtějí**)، **smět** يجوز له (**smím**)، **mít** ينبغي (**mám**) — كلها + المصدر: **Musím jít.** «يجب أن أذهب». **Můžu ti pomoct?** «هل أستطيع مساعدتك؟» و**umět** *يُحسن*: **Umím plavat.** «أُحسن السباحة».
  cs-reflexive:
    meaning: "الضميران الانعكاسيان se وsi"
    intro: |
      **se** (مفعولية) و**si** (قابل) يلازمان أفعالًا كثيرة ويأتيان **ثانيًا**: **Jmenuju se Pavel.** «اسمي بافل». **Dám si kávu.** «سآخذ قهوة». **Myju se.** «أغتسل». **Bojím se.** «أخاف». **Pamatuješ si?** «هل تتذكر؟»
