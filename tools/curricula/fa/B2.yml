- title: {en: Register, pt: Registro}
  lessons:
  - id: fa-taarof
    title: تعارف، بفرمایید، خواهش می‌کنم
    meaning: {en: "taarof: Persian courtesy", pt: "taarof: a cortesia persa"}
    intro:
      en: |
        **تعارف** (*taarof*) is the art of polite insistence: offering, refusing, offering again. **بفرمایید** (please, go ahead, help yourself), **خواهش می‌کنم** (please; you're welcome), **قابل ندارد** (it's nothing — said by a seller who still expects to be paid). Polite speech uses **شما** and plural verbs, and special verbs (**فرمودن** for *say* of others).
      pt: |
        **تعارف** (*taarof*) é a arte da insistência educada: oferecer, recusar, oferecer de novo. **بفرمایید** (por favor, fique à vontade, sirva-se), **خواهش می‌کنم** (por favor; de nada), **قابل ندارد** (não é nada — dito pelo vendedor que ainda espera ser pago). A fala educada usa **شما** e verbos no plural, e verbos especiais (**فرمودن** para o *dizer* dos outros).
    examples:
    - ["بفرمایید، خواهش می‌کنم.", "Please, go ahead.", "Por favor, fique à vontade.", "بفرمایید"]
    match: {seq: [{word: [بفرمایید, خواهش, ممنون, مرسی, متشکرم]}]}
    pool: [بفرمایید, خواهش, ممنون, مرسی]
