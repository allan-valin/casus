# German text of the Persian course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Letters and words: "Buchstaben und Wörter"
  Nouns and the ezafe: "Nomen und die Ezafe"
  Pronouns and being: "Pronomen und „sein“"
  Verbs: "Verben"
  Questions and little words: "Fragen und kleine Wörter"
  More verb forms: "Weitere Verbformen"
  Clauses: "Nebensätze"
  Register: "Register"
  Learned words: "Gelehrte Wörter"
  Literature: "Literatur"
lessons:
  fa-script:
    meaning: "das persische Alphabet; der Nichtverbinder"
    intro: |
      Persisch nutzt das arabische Alphabet, von rechts nach links, dazu **پ** (p), **چ** (tsch), **ژ** (sch, stimmhaft), **گ** (g); **ی** und **ک** haben eigene persische Formen. Kurze Vokale werden meist nicht geschrieben: **کتاب** *ketâb* (Buch). Ein Halbabstand (der Nichtverbinder) hält Teile eines Wortes getrennt: **می‌روم** (ich gehe), **کتاب‌ها** (Bücher).
  fa-plural:
    meaning: "Plural -hā, unbestimmt -i; kein Genus, kein Artikel"
    intro: |
      Kein Genus und kein *der*. Plural **-hā** (**کتاب‌ها** Bücher), bei Personen auch **-ān** (**دوستان** Freunde); *ein* mit **-i** oder **یک**: **کتابی** / **یک کتاب** (ein Buch). Nach Zahlen bleibt das Nomen im Singular: **دو کتاب** (zwei Bücher).
  fa-ezafe:
    meaning: "die Ezafe: Nomen -e + was es beschreibt"
    intro: |
      Adjektive und Besitzer folgen dem Nomen, verbunden durch ein ungeschriebenes **-e** (*Ezafe*): **کتابِ من** *ketâb-e man* (mein Buch), **خانهٔ بزرگ** *xâne-ye bozorg* (ein großes Haus), **شهرِ تهران** (die Stadt Teheran). Nach einem Vokal heißt es **-ye**, geschrieben **ی** oder **ٔ**.
  fa-pronouns:
    meaning: "Personalpronomen; شما ist höflich"
    intro: |
      **من** (ich), **تو** (du), **او** (er, sie), **ما** (wir), **شما** (ihr, und das höfliche *Sie*), **آن‌ها / ایشان** (sie). Endungen tun dasselbe am Nomen: **کتابم** (mein Buch), **کتابت**, **کتابش** (sein / ihr Buch).
  fa-ast:
    meaning: "sein"
    intro: |
      **هستم, هستی, است (هست), هستیم, هستید, هستند**, oder kurze Endungen: **خوبم** (mir geht es gut), **دانشجوست** (er ist Student). Verneint **نیستم, نیست…**. Vergangenheit **بودم, بود…**.
  fa-present:
    meaning: "das Präsens: می + Stamm + Endung"
    intro: |
      **می** + Präsensstamm + **-am, -i, -ad, -im, -id, -and**: **رفتن** (gehen, Stamm **رو**) → **می‌روم** (ich gehe), **می‌روی**, **می‌رود**, **می‌رویم**, **می‌روید**, **می‌روند**. Das Verb steht am Ende: **من نان می‌خورم** (ich esse Brot).
  fa-past:
    meaning: "die Vergangenheit: Vergangenheitsstamm + Endung"
    intro: |
      Infinitiv ohne **-an** = Vergangenheitsstamm: **رفتن → رفت** → **رفتم** (ich ging), **رفتی**, **رفت** (er ging), **رفتیم**, **رفتید**, **رفتند**. Verneint mit **ن-**: **نرفتم** (ich ging nicht).
  fa-ra:
    meaning: "را: das bestimmte direkte Objekt"
    intro: |
      **را** folgt einem bestimmten direkten Objekt: **کتاب را خواندم** (ich habe das Buch gelesen) — aber **کتاب خواندم** (ich habe [ein Buch / Bücher] gelesen). Mit Pronomen: **او را دیدم** (ich habe ihn gesehen); umgangssprachlich **رو**: **کتابو خوندم**.
  fa-questions:
    meaning: "Fragewörter; آیا"
    intro: |
      **چه / چی** (was), **کی** (wer; wann), **کجا** (wo), **چرا** (warum), **چطور** (wie), **چند** (wie viele). Ja/Nein: steigende Stimme, oder schriftlich **آیا** am Anfang: **آیا شما انگلیسی صحبت می‌کنید؟** (sprechen Sie Englisch?)
  fa-prepositions:
    meaning: "Präpositionen"
    intro: |
      **به** (zu, nach), **از** (von; als), **در** (in), **با** (mit), **برای** (für), **تا** (bis), **بی** (ohne). Ortswörter nehmen die Ezafe: **روی میز** (auf dem Tisch), **زیرِ میز** (unter dem Tisch), **کنارِ خانه** (neben dem Haus).
  fa-future-subj:
    meaning: "Futur und Konjunktiv"
    intro: |
      Futur (förmlich): **خواهم, خواهی, خواهد…** + Vergangenheitsstamm: **خواهم رفت** (ich werde gehen); gesprochen nimmt man das Präsens. Konjunktiv **ب-** + Präsensstamm: **می‌خواهم بروم** (ich will gehen), **باید بروم** (ich muss gehen).
  fa-compound:
    meaning: "zusammengesetzte Verben mit کردن, شدن, دادن"
    intro: |
      Die meisten Verben sind Nomen oder Adjektiv + leichtes Verb: **کار کردن** (arbeiten), **زندگی کردن** (leben), **صحبت کردن** (sprechen), **باز کردن** (öffnen), **تمام شدن** (enden), **گوش دادن** (zuhören). Nur das leichte Verb wird konjugiert: **من کار می‌کنم** (ich arbeite).
  fa-ke:
    meaning: "dass, der, wenn, weil, als"
    intro: |
      **که** (dass; der, welcher): **می‌دانم که می‌آید** (ich weiß, dass er kommt), **مردی که آنجا ایستاده** (der Mann, der dort steht). **اگر** (wenn), **چون** (weil), **وقتی** (als, wenn), **ولی / اما** (aber), **تا** (damit).
  fa-taarof:
    meaning: "Taarof: persische Höflichkeit"
    intro: |
      **تعارف** (*Taarof*) ist die Kunst des höflichen Drängens: anbieten, ablehnen, wieder anbieten. **بفرمایید** (bitte, nur zu, greifen Sie zu), **خواهش می‌کنم** (bitte; gern geschehen), **قابل ندارد** (nicht der Rede wert — sagt der Verkäufer, der trotzdem bezahlt werden will). Höfliche Rede nimmt **شما** und Pluralverben, und besondere Verben (**فرمودن** für das *Sagen* anderer).
  fa-arabic:
    meaning: "persische und arabische Schichten des Wortschatzes"
    intro: |
      Gelehrtes Persisch mischt eigene Wörter (**آزادی** Freiheit, **برابری** Gleichheit, **دانش** Wissen) mit arabischen (**علم** Wissenschaft, **حقوق** Recht, Rechte, **انقلاب** Revolution); Abstrakta auf **-ی** (**آزادی**) und **-یت** (**جمعیت** Bevölkerung). Die Akademie prägt persische Ersatzwörter (**رایانه** für *Computer*).
  fa-poetry:
    meaning: "die klassischen Dichter"
    intro: |
      Ferdousis *Schahname* (um 1010), Saadis *Golestan* (1258), Rumis *Masnawi* und Hafis' *Diwan* (14. Jh.) werden bis heute gelesen und zitiert; die Sprache hat sich so wenig verändert, dass ein Schulkind vieles versteht. Der Vers bewahrt alte Formen (**آرد** für *آورد*, **بخشم** für *می‌بخشم*).
