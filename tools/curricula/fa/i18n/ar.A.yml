# Arabic text of the Persian course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Letters and words: "الحروف والكلمات"
  Nouns and the ezafe: "الأسماء والإضافة"
  Pronouns and being: "الضمائر والكون"
  Verbs: "الأفعال"
  Questions and little words: "الأسئلة والكلمات الصغيرة"
  More verb forms: "صيغ فعلية أخرى"
  Clauses: "الجمل"
  Register: "مستوى اللغة"
  Learned words: "الكلمات المثقّفة"
  Literature: "الأدب"
lessons:
  fa-script:
    meaning: "الأبجدية الفارسية؛ الفاصل غير الواصل"
    intro: |
      تستعمل الفارسية الأبجدية العربية من اليمين إلى اليسار، وتزيد **پ** (پ)، **چ** (تش)، **ژ** (ژ)، **گ** (گ)؛ ولـ**ی** و**ک** شكلان فارسيان. والحركات القصيرة لا تُكتب عادة: **کتاب** *ketâb* (كتاب). ونصف المسافة (الفاصل غير الواصل) يفصل أجزاء الكلمة الواحدة: **می‌روم** (أذهب)، **کتاب‌ها** (كتب).
  fa-plural:
    meaning: "الجمع -hā، والتنكير -i؛ لا جنس ولا أداة تعريف"
    intro: |
      لا جنس ولا *ال*. والجمع **-hā** (**کتاب‌ها** كتب)، وللناس أيضًا **-ān** (**دوستان** أصدقاء)؛ والتنكير بـ**-i** أو **یک**: **کتابی** / **یک کتاب** (كتاب). وبعد الأعداد يبقى الاسم مفردًا: **دو کتاب** (كتابان).
  fa-ezafe:
    meaning: "الإضافة: الاسم -e + ما يصفه"
    intro: |
      تأتي الصفات والمالكون بعد الاسم، مربوطة بـ**-e** غير مكتوبة (*الإضافة*): **کتابِ من** *ketâb-e man* (كتابي)، **خانهٔ بزرگ** *xâne-ye bozorg* (بيت كبير)، **شهرِ تهران** (مدينة طهران). وبعد الحركة تصير **-ye** وتُكتب **ی** أو **ٔ**.
  fa-pronouns:
    meaning: "الضمائر الشخصية؛ شما للتأدّب"
    intro: |
      **من** (أنا)، **تو** (أنت)، **او** (هو، هي)، **ما** (نحن)، **شما** (أنتم، وصيغة التأدّب)، **آن‌ها / ایشان** (هم). واللواحق تؤدّي ذلك على الأسماء: **کتابم** (كتابي)، **کتابت**، **کتابش** (كتابه / كتابها).
  fa-ast:
    meaning: "الكون"
    intro: |
      **هستم, هستی, است (هست), هستیم, هستید, هستند**، أو لواحق قصيرة: **خوبم** (أنا بخير)، **دانشجوست** (هو طالب). والنفي **نیستم, نیست…**. والماضي **بودم, بود…**.
  fa-present:
    meaning: "المضارع: می + الجذر + اللاحقة"
    intro: |
      **می** + جذر المضارع + **-am, -i, -ad, -im, -id, -and**: **رفتن** (ذهب، الجذر **رو**) ← **می‌روم** (أذهب)، **می‌روی**، **می‌رود**، **می‌رویم**، **می‌روید**، **می‌روند**. والفعل في آخر الجملة: **من نان می‌خورم** (آكل الخبز).
  fa-past:
    meaning: "الماضي: جذر الماضي + اللاحقة"
    intro: |
      المصدر بلا **-an** = جذر الماضي: **رفتن ← رفت** ← **رفتم** (ذهبت)، **رفتی**، **رفت** (ذهب)، **رفتیم**، **رفتید**، **رفتند**. والنفي بـ**ن-**: **نرفتم** (لم أذهب).
  fa-ra:
    meaning: "را: المفعول به المعرّف"
    intro: |
      **را** تلي المفعول به المعرّف: **کتاب را خواندم** (قرأت الكتاب) — أمّا **کتاب خواندم** فـ(قرأت [كتابًا / كتبًا]). ومع الضمائر: **او را دیدم** (رأيته)، وفي الكلام **رو**: **کتابو خوندم**.
  fa-questions:
    meaning: "أدوات الاستفهام؛ آیا"
    intro: |
      **چه / چی** (ماذا)، **کی** (من؛ متى)، **کجا** (أين)، **چرا** (لماذا)، **چطور** (كيف)، **چند** (كم). ونعم/لا بالنبرة، أو كتابةً بـ**آیا** في البداية (كـ«هل»): **آیا شما انگلیسی صحبت می‌کنید؟** (هل تتكلّم الإنجليزية؟)
  fa-prepositions:
    meaning: "حروف الجرّ"
    intro: |
      **به** (إلى)، **از** (من؛ مِن للمقارنة)، **در** (في)، **با** (مع)، **برای** (لِـ)، **تا** (حتى)، **بی** (بلا). وكلمات المكان تأخذ الإضافة: **روی میز** (على الطاولة)، **زیرِ میز** (تحت الطاولة)، **کنارِ خانه** (بجانب البيت).
  fa-future-subj:
    meaning: "المستقبل والالتزامي"
    intro: |
      المستقبل (رسميًا): **خواهم, خواهی, خواهد…** + جذر الماضي: **خواهم رفت** (سأذهب)؛ والكلام يستعمل المضارع. والالتزامي **ب-** + جذر المضارع: **می‌خواهم بروم** (أريد أن أذهب)، **باید بروم** (يجب أن أذهب).
  fa-compound:
    meaning: "الأفعال المركّبة مع کردن, شدن, دادن"
    intro: |
      أكثر الأفعال اسم أو صفة + فعل خفيف: **کار کردن** (عمل)، **زندگی کردن** (عاش)، **صحبت کردن** (تكلّم)، **باز کردن** (فتح)، **تمام شدن** (انتهى)، **گوش دادن** (استمع). ولا يُصرَّف إلا الفعل الخفيف: **من کار می‌کنم** (أعمل).
  fa-ke:
    meaning: "أنّ، الذي، إذا، لأنّ، عندما"
    intro: |
      **که** (أنّ؛ الذي): **می‌دانم که می‌آید** (أعرف أنه سيأتي)، **مردی که آنجا ایستاده** (الرجل الذي يقف هناك). **اگر** (إذا)، **چون** (لأنّ)، **وقتی** (عندما)، **ولی / اما** (لكن)، **تا** (لكي).
  fa-taarof:
    meaning: "التعارف: المجاملة الفارسية"
    intro: |
      **تعارف** (*تعارف*) فنّ الإلحاح المهذّب: تعرض، فيُرفض، فتعرض ثانية. **بفرمایید** (تفضّل)، **خواهش می‌کنم** (من فضلك؛ عفوًا)، **قابل ندارد** (لا قيمة له — يقولها البائع الذي ينتظر الثمن مع ذلك). والكلام المهذّب يستعمل **شما** والأفعال بالجمع، وأفعالًا خاصة (**فرمودن** لقول الآخرين).
  fa-arabic:
    meaning: "الطبقتان الفارسية والعربية في المفردات"
    intro: |
      تمزج الفارسية المثقّفة كلمات أصيلة (**آزادی** حرّية، **برابری** مساواة، **دانش** معرفة) بكلمات عربية (**علم**، **حقوق**، **انقلاب** ثورة)؛ والمجرّدات بـ**-ی** (**آزادی**) و**-یت** (**جمعیت** سكّان). والمجمع اللغوي يصوغ بدائل فارسية (**رایانه** للحاسوب).
  fa-poetry:
    meaning: "الشعراء الكلاسيكيون"
    intro: |
      *الشاهنامه* للفردوسي (نحو 1010)، و*گلستان* لسعدي (1258)، و*المثنوي* للرومي، و*ديوان* حافظ (القرن الرابع عشر) تُقرأ وتُستشهد حتى اليوم؛ وقد تغيّرت اللغة قليلًا حتى إن التلميذ يفهم كثيرًا منها. والشعر يحفظ صيغًا قديمة (**آرد** بدل *آورد*، **بخشم** بدل *می‌بخشم*).
