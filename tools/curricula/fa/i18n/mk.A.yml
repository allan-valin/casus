# Macedonian text of the Persian course — translated by AI (Claude) from the English (2026-10-21)
topics:
  Letters and words: "Букви и зборови"
  Nouns and the ezafe: "Именки и езафе"
  Pronouns and being: "Заменки и „сум“"
  Verbs: "Глаголи"
  Questions and little words: "Прашања и мали зборови"
  More verb forms: "Други глаголски форми"
  Clauses: "Реченици"
  Register: "Регистар"
  Learned words: "Учени зборови"
  Literature: "Литература"
lessons:
  fa-script:
    meaning: "персиската азбука; несврзувачот"
    intro: |
      Персискиот ја користи арапската азбука, оддесно налево, со **پ** (п), **چ** (ч), **ژ** (ж), **گ** (г); **ی** и **ک** имаат свои персиски облици. Кратките самогласки обично не се пишуваат: **کتاب** *ketâb* (книга). Половина празно место (несврзувачот) ги држи одвоени деловите на еден збор: **می‌روم** (одам), **کتاب‌ها** (книги).
  fa-plural:
    meaning: "множина -hā, неопределено -i; нема род, нема член"
    intro: |
      Нема род и нема член. Множина **-hā** (**کتاب‌ها** книги), за луѓе и **-ān** (**دوستان** пријатели); *еден* со **-i** или **یک**: **کتابی** / **یک کتاب** (една книга). По броеви именката останува во еднина: **دو کتاب** (две книги).
  fa-ezafe:
    meaning: "езафе: именка -e + она што ја опишува"
    intro: |
      Придавките и сопствениците доаѓаат по именката, поврзани со ненапишано **-e** (*езафе*): **کتابِ من** *ketâb-e man* (мојата книга), **خانهٔ بزرگ** *xâne-ye bozorg* (голема куќа), **شهرِ تهران** (градот Техеран). По самогласка е **-ye**, напишано **ی** или **ٔ**.
  fa-pronouns:
    meaning: "лични заменки; شما е учтиво"
    intro: |
      **من** (јас), **تو** (ти), **او** (тој, таа), **ما** (ние), **شما** (вие, и учтивото *Вие*), **آن‌ها / ایشان** (тие). Наставките го прават истото на именките: **کتابم** (мојата книга), **کتابت**, **کتابش** (неговата / нејзината книга).
  fa-ast:
    meaning: "сум"
    intro: |
      **هستم, هستی, است (هست), هستیم, هستید, هستند**, или кратки наставки: **خوبم** (добро сум), **دانشجوست** (тој е студент). Негација **نیستم, نیست…**. Минато **بودم, بود…**.
  fa-present:
    meaning: "сегашното време: می + основа + наставка"
    intro: |
      **می** + сегашна основа + **-am, -i, -ad, -im, -id, -and**: **رفتن** (оди, основа **رو**) → **می‌روم** (одам), **می‌روی**, **می‌رود**, **می‌رویم**, **می‌روید**, **می‌روند**. Глаголот доаѓа на крај: **من نان می‌خورم** (јадам леб).
  fa-past:
    meaning: "минатото време: минатата основа + наставка"
    intro: |
      Инфинитив без **-an** = минатата основа: **رفتن → رفت** → **رفتم** (отидов), **رفتی**, **رفت** (отиде), **رفتیم**, **رفتید**, **رفتند**. Негација со **ن-**: **نرفتم** (не отидов).
  fa-ra:
    meaning: "را: определениот директен објект"
    intro: |
      **را** стои по определен директен објект: **کتاب را خواندم** (ја прочитав книгата) — но **کتاب خواندم** (читав [книга / книги]). Со заменки: **او را دیدم** (го видов); во говорот **رو**: **کتابو خوندم**.
  fa-questions:
    meaning: "прашални зборови; آیا"
    intro: |
      **چه / چی** (што), **کی** (кој; кога), **کجا** (каде), **چرا** (зошто), **چطور** (како), **چند** (колку). Да/не: со интонација, или во писмото со **آیا** на почетокот: **آیا شما انگلیسی صحبت می‌کنید؟** (зборувате ли англиски?)
  fa-prepositions:
    meaning: "предлози"
    intro: |
      **به** (кон, на), **از** (од; отколку), **در** (во), **با** (со), **برای** (за), **تا** (до), **بی** (без). Зборовите за место земаат езафе: **روی میز** (на масата), **زیرِ میز** (под масата), **کنارِ خانه** (покрај куќата).
  fa-future-subj:
    meaning: "иднина и субјунктив"
    intro: |
      Иднина (официјално): **خواهم, خواهی, خواهد…** + минатата основа: **خواهم رفت** (ќе одам); говорот го користи сегашното време. Субјунктив **ب-** + сегашна основа: **می‌خواهم بروم** (сакам да одам), **باید بروم** (морам да одам).
  fa-compound:
    meaning: "сложени глаголи со کردن, شدن, دادن"
    intro: |
      Повеќето глаголи се именка или придавка + лесен глагол: **کار کردن** (работи), **زندگی کردن** (живее), **صحبت کردن** (зборува), **باز کردن** (отвора), **تمام شدن** (завршува), **گوش دادن** (слуша). Само лесниот глагол се менува: **من کار می‌کنم** (работам).
  fa-ke:
    meaning: "дека, што, ако, зашто, кога"
    intro: |
      **که** (дека; што, кој): **می‌دانم که می‌آید** (знам дека доаѓа), **مردی که آنجا ایستاده** (човекот што стои таму). **اگر** (ако), **چون** (зашто), **وقتی** (кога), **ولی / اما** (но), **تا** (за да).
  fa-taarof:
    meaning: "тарофот: персиската учтивост"
    intro: |
      **تعارف** (*тароф*) е уметноста на учтивото инсистирање: нудиш, одбиваш, пак нудиш. **بفرمایید** (повелете, послужете се), **خواهش می‌کنم** (ве молам; нема зошто), **قابل ندارد** (не е ништо — вели продавачот што сепак очекува да му се плати). Учтивиот говор користи **شما** и глаголи во множина, и посебни глаголи (**فرمودن** за *зборувањето* на другите).
  fa-arabic:
    meaning: "персиски и арапски слоеви на речникот"
    intro: |
      Учениот персиски меша домашни зборови (**آزادی** слобода, **برابری** еднаквост, **دانش** знаење) со арапски (**علم** наука, **حقوق** право, права, **انقلاب** револуција); апстрактни именки на **-ی** (**آزادی**) и **-یت** (**جمعیت** население). Академијата кова персиски замени (**رایانه** за *компјутер*).
  fa-poetry:
    meaning: "класичните поети"
    intro: |
      *Шахнаме* од Фердоуси (околу 1010), *Голестан* од Саади (1258), *Маснави* од Руми и *Диван* од Хафез (14 век) се читаат и цитираат и денес; јазикот се променил толку малку што ученик разбира голем дел. Стихот чува стари форми (**آرد** за *آورد*, **بخشم** за *می‌بخشم*).
