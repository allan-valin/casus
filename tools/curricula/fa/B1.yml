id: B1
topics:

- title: {en: Clauses, pt: Orações}
  lessons:
  - id: fa-ke
    title: که، اگر، چون، وقتی
    meaning: {en: "that, which, if, because, when", pt: "que, se, porque, quando"}
    intro:
      en: |
        **که** (that; who, which): **می‌دانم که می‌آید** (I know he's coming), **مردی که آنجا ایستاده** (the man who is standing there). **اگر** (if), **چون** (because), **وقتی** (when), **ولی / اما** (but), **تا** (so that).
      pt: |
        **که** (que; quem, o qual): **می‌دانم که می‌آید** (sei que ele vem), **مردی که آنجا ایستاده** (o homem que está ali). **اگر** (se), **چون** (porque), **وقتی** (quando), **ولی / اما** (mas), **تا** (para que).
    examples:
    - ["می‌دانم که او می‌آید.", "I know he is coming.", "Sei que ele vem.", "که"]
    match: {seq: [{word: [که, اگر, چون, وقتی, ولی, اما]}]}
    pool: [که, اگر, چون, وقتی, ولی, اما]
