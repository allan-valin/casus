id: C2
topics:

- title: {en: Literature, pt: Literatura}
  lessons:
  - id: fa-poetry
    title: حافظ، سعدی، فردوسی، مولوی
    meaning: {en: "the classical poets", pt: "os poetas clássicos"}
    intro:
      en: |
        Ferdowsi's *Shahnameh* (around 1010), Saadi's *Golestan* (1258), Rumi's *Masnavi* and Hafez's *Divan* (14th c.) are read and quoted to this day; the language has changed so little that a schoolchild understands much of it. Verse keeps old forms (**آرد** for *آورد*, **بخشم** for *می‌بخشم*).
      pt: |
        O *Shahnameh* de Ferdowsi (por volta de 1010), o *Golestan* de Saadi (1258), o *Masnavi* de Rumi e o *Divan* de Hafez (séc. XIV) são lidos e citados até hoje; a língua mudou tão pouco que um escolar entende boa parte. O verso guarda formas antigas (**آرد** por *آورد*, **بخشم** por *می‌بخشم*).
    examples:
    - ["به خال هندویش بخشم سمرقند و بخارا را.", "For his Indian mole I'd give Samarkand and Bukhara.", "Por sua pinta indiana eu daria Samarcanda e Bucara.", "بخشم"]
    match: {seq: [{word: [حافظ, سعدی, فردوسی, شعر, غزل, بخشم]}]}
    pool: [شعر, غزل, حافظ]
