# Arabic text of the English course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The basics: "الأساسيات"
  Pronouns and possessives: "الضمائر وصفات الملكية"
  The past: "الماضي"
  Obligation and advice: "الإلزام والنصيحة"
lessons:
  en-to-be:
    meaning: "الفعل to be"
    intro: |
      **I am** (I'm)، **you are** (you're)، **he / she / it is** (he's)، **we are**، **they are**. والنفي بـ **not**: **I'm not، she isn't، they aren't**. والسؤال بالقلب: **Are you tired?** ولا تحذف الإنجليزية الفاعل أبدًا، ولا تستغني عن الفعل في الجملة الاسمية كالعربية: **It is late.** «الوقت متأخر». **It's raining.** «إنها تمطر».
    mistakes: ["الإنجليزية تحتاج فاعلًا: it."]
  en-articles:
    meaning: "أدوات التعريف والتنكير"
    intro: |
      **a** قبل الصوت الصامت، و**an** قبل الصوت الصائت (**a book، an apple، an hour**)؛ و**the** لكل شيء. ولا أداة في التعميم — بخلاف العربية: **I like coffee.** «أحب القهوة». **Life is beautiful.** والمهن تأخذ **a**: **She is a doctor.**
    mistakes: ["المهنة تأخذ a / an."]
  en-present-simple:
    meaning: "المضارع البسيط: -s مع الغائب"
    intro: |
      **he / she / it** وحدها تأخذ **-s**: **she works، he goes**. والأسئلة والنفي بـ **do / does**: **Do you work? She doesn't work** (لا -s بعد does).
    mistakes: ["He، she، it: ‏-s.", "بعد does لا -s في الفعل."]
  en-present-continuous:
    meaning: "المضارع المستمر: be + -ing"
    intro: |
      **am / is / are + -ing** للآن: **I'm reading.** «أنا أقرأ الآن». وللمواعيد المرتّبة: **I'm meeting her tomorrow.** وأفعال الحالة (like، know، want) نادرًا ما تأتي بـ -ing.
  en-pronouns:
    meaning: "ضمائر الفاعل والمفعول"
    intro: |
      الفاعل **I، you، he، she، it، we، they**؛ والمفعول **me، you، him، her، it، us، them**: **She loves him. Give it to me.**
  en-possessives:
    meaning: "صفات الملكية"
    intro: |
      **my، your، his، her، its، our، their** تطابق المالك — كالضمائر المتصلة في العربية: **his mother** «أمه»، **her father** «أبوها». والأسماء تأخذ **'s**: **John's car**.
    mistakes: ["الملكية تتبع المالك: Mary → her."]
  en-there-is:
    meaning: "there is / there are"
    intro: |
      **There is** + مفرد، و**there are** + جمع، بمعنى «يوجد / هناك»: **There is a bank near here. There are two cats.**
    mistakes: ["الوجود: there is / are."]
  en-prepositions:
    meaning: "in، on، at: المكان والزمان"
    intro: |
      **in** للداخل والمدن والبلدان والشهور والسنين؛ و**on** للأسطح والأيام والتواريخ؛ و**at** للنقاط والساعات وأماكن النشاط (**at home، at 5**).
  en-can:
    meaning: "can: القدرة والإذن"
    intro: |
      **can** + الفعل المجرد، واحدة لكل الضمائر: **I can swim. Can you help me?** والنفي **can't**؛ والماضي **could**.
  en-past-simple:
    meaning: "الماضي البسيط: -ed والأفعال الشاذة"
    intro: |
      القياسي **-ed**؛ وشواذ كثيرة (**went، had، did، saw، got، made، took، came، said**). والنفي والسؤال: **did** + الصيغة الأساسية: **I didn't go. Did you see it?**
    mistakes: ["بعد did: الصيغة الأساسية."]
  en-future:
    meaning: "المستقبل: will وgoing to"
    intro: |
      **will**: للقرار الفوري والوعد والتوقع. و**be going to**: للخطط والدليل الظاهر. والنفي **won't**.
  en-comparatives:
    meaning: "المقارنة والتفضيل"
    intro: |
      الصفات القصيرة **-er / -est**؛ والطويلة **more / the most**؛ و**than** «من». والشاذ: **good → better → best، bad → worse → worst**.
  en-present-perfect:
    meaning: "المضارع التام: have + اسم المفعول"
    intro: |
      **have / has + اسم المفعول**: للتجربة، والزمن غير المنتهي، والأخبار. ومع زمن منتهٍ: الماضي البسيط.
    mistakes: ["الزمن غير المنتهي: المضارع التام."]
  en-modals:
    meaning: "must، have to، should"
    intro: |
      **must** (الإلزام، الاستنتاج)، **have to** (إلزام خارجي)، **should** (النصيحة). **mustn't** = ممنوع؛ **don't have to** = غير ضروري.
    mistakes: ["mustn't = ممنوع؛ don't have to = غير ضروري."]
