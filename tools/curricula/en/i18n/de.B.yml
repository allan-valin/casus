# German text of the English course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Conditions and the passive: "Bedingungen und Passiv"
  Relative clauses and verbs: "Relativsätze und Verben"
  Perfect and continuous tenses: "Perfekt- und Verlaufsformen"
  Modals and hypotheses: "Modalverben und Hypothesen"
  Reporting and the passive: "Indirekte Rede und Passiv"
  Linking and word partners: "Verknüpfung und Wortpartner"
lessons:
  en-conditionals:
    meaning: "Bedingungssätze: if + Präsens / Vergangenheit"
    intro: |
      Real: **If it rains, I'll stay home.** Hypothetisch: **If I had money, I would travel. If I were you…** Irreal in der Vergangenheit: **If I had known, I would have come.** Nie **would** im if-Satz.
  en-passive:
    meaning: "das Passiv: be + Partizip"
    intro: |
      **be + Partizip Perfekt**, **by** für den Täter: **The house was built in 1900. English is spoken here.**
  en-relatives:
    meaning: "Relativpronomen"
    intro: |
      **who** (Personen), **which** (Sachen), **that** (beides); als Objekt weglassbar: **the book I read**; **whose** = dessen, deren.
  en-gerund-infinitive:
    meaning: "-ing oder to + Verb nach einem Verb"
    intro: |
      **-ing** nach enjoy, finish, avoid, mind, keep; **to** nach want, need, decide, hope; **-ing** nach jeder Präposition.
    mistakes: ["enjoy nimmt -ing."]
  en-b2-present-perfect-continuous:
    meaning: "das Present Perfect Continuous"
    intro: |
      **have / has been + -ing**: eine Tätigkeit, die in der Vergangenheit begann und noch andauert (oder gerade aufgehört hat), mit Blick auf die Dauer: **I've been waiting for an hour.** „Ich warte seit einer Stunde.“ **It's been raining all day.** **for** + Zeitraum, **since** + Anfangspunkt — wo das Deutsche einfach Präsens + *seit* sagt.
    mistakes: ["Dauer bis jetzt: Present Perfect (Continuous)."]
  en-b2-past-perfect:
    meaning: "das Past Perfect"
    intro: |
      **had + Partizip Perfekt**: eine Handlung vor einer anderen vergangenen: **When I arrived, the film had already started.** Auch in indirekter Rede und vergangenen Bedingungen: **If I had known…** Verkürzt **'d**.
  en-b2-future-perfect:
    meaning: "Future Continuous und Future Perfect"
    intro: |
      **will be + -ing**: im Verlauf zu einem zukünftigen Zeitpunkt: **This time tomorrow I'll be flying to London.** **will have + Partizip**: abgeschlossen vor einem zukünftigen Zeitpunkt: **By Friday I'll have finished.**
  en-b2-used-to:
    meaning: "used to (frühere Gewohnheit) und be used to (gewohnt sein)"
    intro: |
      **used to + Verb**: eine frühere Gewohnheit oder ein früherer Zustand: **I used to smoke.** „Früher habe ich geraucht.“ **be / get used to + -ing**: gewohnt sein / sich gewöhnen: **I'm used to waking up early. You'll get used to it.**
    mistakes: ["be used to + -ing."]
  en-b2-must-have:
    meaning: "Modalverben der Vergangenheit für Schlussfolgerung und Kritik"
    intro: |
      **Modalverb + have + Partizip Perfekt** blickt zurück: **must have** (Gewissheit), **can't have** (Unmöglichkeit), **might / may / could have** (Möglichkeit), **should have** (Kritik, Bedauern): **He must have forgotten.** „Er muss es vergessen haben.“ **You should have told me.**
  en-b2-wish:
    meaning: "Wünsche und Bedauern: wish, if only"
    intro: |
      **wish / if only** + Vergangenheit = Wunsch über die Gegenwart: **I wish I were taller.** „Wäre ich doch größer.“ + Past Perfect = Bedauern: **I wish I had studied more.** + **would** = man will, dass sich jemand ändert: **I wish you would stop.**
  en-b2-unless:
    meaning: "Bedingungen ohne if: unless, provided, in case, otherwise"
    intro: |
      **unless** = wenn nicht, **as long as / provided (that)** = nur wenn, **in case** = für den Fall, dass (Vorsicht), **otherwise** = sonst: **I'll go unless it rains. Take an umbrella in case it rains.** Kein **will** in der Bedingung.
  en-b2-reported-speech:
    meaning: "indirekte Rede: Zeitverschiebung"
    intro: |
      Nach einem Redeverb in der Vergangenheit rücken die Tempora zurück: will → would, can → could, Present Perfect → Past Perfect. Indirekte Fragen haben Aussagestellung: **She asked me where I lived.** Bitten: **He told me to wait.**
  en-b2-say-tell:
    meaning: "say oder tell"
    intro: |
      **tell** + Person: **He told me the truth.** **say** ohne direkte Person (**say something to someone**): **She said she was tired.** Fest: **tell the truth / a lie / a story**.
    mistakes: ["tell + Person; say + to + Person."]
  en-b2-passive-advanced:
    meaning: "das Passiv in Verlaufs- und Perfektformen"
    intro: |
      Das Passiv funktioniert in jedem Tempus: **is being repaired, has been sold, will be finished, must be done.**
  en-b2-causative:
    meaning: "kausatives have / get something done"
    intro: |
      **have / get + Objekt + Partizip Perfekt**: jemand tut es für dich — deutsch *lassen*: **I had my hair cut.** „Ich habe mir die Haare schneiden lassen.“ **We're getting the house painted.** Auch für schlechte Erfahrungen: **He had his phone stolen.**
  en-b2-although-despite:
    meaning: "Gegensatz: although, despite, in spite of, however, whereas"
    intro: |
      **although / though / even though** + Satz; **despite / in spite of** + Nomen oder -ing; **however** zwischen Sätzen; **whereas** für einen Gegensatz zweier Tatsachen. Nie ~~despite of~~.
    mistakes: ["despite hat kein of (in spite of schon)."]
  en-b2-phrasal-verbs:
    meaning: "häufige Phrasal Verbs"
    intro: |
      Verb + Partikel mit neuer Bedeutung — ähnlich den deutschen trennbaren Verben: **give up, find out, look after, turn down, put off, run out of, carry on, figure out, take off, get over.** Ein Pronomen-Objekt steht in der Mitte: **give it up**.
  en-b2-make-do:
    meaning: "make oder do"
    intro: |
      **make** = erschaffen, herstellen, verursachen: **make a mistake, a decision, money, friends, an effort, sense**. **do** = Aufgaben und Tätigkeiten: **do homework, the dishes, business, exercise, a favour, your best**.
  en-b2-so-such:
    meaning: "so und such zur Verstärkung"
    intro: |
      **so** + Adjektiv / Adverb; **such (a / an)** + (Adjektiv +) Nomen; **so / such … that** für eine Folge: **It was so cold that we stayed home. It was such a long day.**
