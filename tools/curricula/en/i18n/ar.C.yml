# Arabic text of the English course, C1–C2 — translated by AI (Claude) from the English (2026-10-20); the false-friends lesson lists general traps instead of Portuguese ones
topics:
  Emphasis and inversion: "التوكيد والقلب"
  Hypothesis and formality: "الافتراض والرسمية"
  Advanced clauses: "جمل تابعة متقدمة"
  Register and Brazilian traps: "المستوى والأصدقاء المزيفون"
  Unreal and concessive structures: "تراكيب الافتراض والتسليم"
  Refined syntax: "نحو متقن"
  Stance and register: "الموقف والمستوى"
lessons:
  en-c1-inversion:
    meaning: "القلب بعد ظروف النفي والتقييد"
    intro: |
      بعد ظرف نفي أو تقييد في أول الجملة (**never، rarely، seldom، hardly، little، nowhere، not only، no sooner، only then**) يتقدّم الفعل المساعد على الفاعل: **Never have I seen such a mess.** «ما رأيت قط فوضى كهذه». **Not only did he lie, he also stole.**
  en-c1-cleft:
    meaning: "جمل الحصر المشطورة"
    intro: |
      لإبراز جزء واحد: **What I need is a holiday.** «ما أحتاجه هو إجازة». **All I want is some peace. It was Tom who broke it.** «توم هو الذي كسره».
  en-c1-emphatic-do:
    meaning: "do التوكيدية"
    intro: |
      **do / does / did** في جملة مثبتة تؤكد الفعل — للاعتراض أو الإصرار أو التأكيد: **I do like it!** «بل إنه يعجبني!» **She did tell you. Do sit down.**
  en-c1-so-do-i:
    meaning: "الإضافات القصيرة: so do I، neither do I، I hope so"
    intro: |
      للموافقة باختصار: **so** + المساعد + الفاعل؛ و**neither / nor** + المساعد + الفاعل؛ والمساعد يطابق الجملة الأولى: **So am I.** «وأنا كذلك». **Neither can I.** «ولا أنا». **So did we.** وكذلك **I think so، I hope not**.
  en-c1-mixed-conditionals:
    meaning: "الشرط المختلط"
    intro: |
      شرط ماضٍ ونتيجة حاضرة: **If I had studied medicine, I would be a doctor now.** وشرط حاضر ونتيجة ماضية: **If I were braver, I would have said something.**
  en-c1-subjunctive:
    meaning: "الالتماسي والماضي غير الواقع: suggest that، it's time، would rather"
    intro: |
      بعد **suggest، insist، recommend، demand، it's essential that**: الفعل المجرد (**I suggest he go. It's essential that she be there**). و**It's time** + الماضي: **It's time we left.** «حان وقت ذهابنا». و**would rather** + الماضي: **I'd rather you didn't.**
  en-c1-inverted-conditionals:
    meaning: "شرط بلا if: should وwere وhad في الأول"
    intro: |
      قد يحذف الشرط الرسمي **if** ويقلب: **Should you need help, call me. Were I you, I'd accept. Had I known, I would have come.**
  en-c1-modal-nuance:
    meaning: "دقائق الأفعال الناقصة: needn't have، supposed to، bound to، likely to"
    intro: |
      **needn't have** + اسم المفعول (فُعل لكن بلا داعٍ) مقابل **didn't need to**؛ و**be supposed to** (متوقع، متفق عليه)، و**be bound to** (مؤكد)، و**be likely to** (مرجّح)، و**be due to** (مقرر في موعد).
  en-c1-participle-clauses:
    meaning: "جمل اسم الفاعل والمفعول"
    intro: |
      تنوب جمل اسم الفاعل عن أداة + جملة: **Having finished the report, she went home. Not knowing what to do, I called my mother.** «ولم أدرِ ما أفعل، فاتصلت بأمي». **Built in 1900, the house needs repairs.** ويجب أن يكون فاعلها فاعل الجملة الرئيسية.
  en-c1-whatever:
    meaning: "كلمات -ever: whatever، whoever، wherever، whenever"
    intro: |
      **whatever، whoever، wherever، whenever، whichever** = «مهما / أيًّا كان…»: **Do whatever you want. Whoever wins gets the prize. Call me whenever you like.**
  en-c1-dependent-prepositions:
    meaning: "حروف الجر بعد الأفعال والصفات"
    intro: |
      حروف جر ثابتة بعد الأفعال والصفات — كثيرًا ما تخالف العربية: **depend on** (يعتمد *على*)، **married to** (متزوج *من*)، **dream of، think about، arrive in / at، good at، interested in، afraid of، responsible for، proud of، consist of، insist on.**
  en-c1-false-friends:
    meaning: "الأصدقاء المزيفون: actually، eventually وغيرها"
    intro: |
      كلمات توهم بمعنى مألوف من لغات أوروبية أخرى: **actually** = في الواقع (لا «حاليًا»)؛ **eventually** = في النهاية (لا «ربما»)؛ **sympathetic** = متعاطف (لا «لطيف»)؛ **sensible** = عاقل (لا «حسّاس»)؛ **magazine** = مجلة (لا «متجر»)؛ **library** = مكتبة للإعارة (لا «محل كتب» = bookshop)؛ **college** = كلية جامعية. وفي الأصل الإنجليزي تقف هنا فخاخ الناطقين بالبرتغالية.
  en-c1-formal-linkers:
    meaning: "أدوات الربط الرسمية"
    intro: |
      الكتابة الرسمية: **moreover، furthermore** (الإضافة)، **therefore، thus، hence، consequently** (النتيجة)، **nonetheless، nevertheless** (الاستدراك)، **indeed** (التوكيد). والكلام يفضّل **also، so، but**.
  en-c1-impersonal-passive:
    meaning: "المجهول غير الشخصي: it is said that، he is thought to"
    intro: |
      نقل غير شخصي، شائع في الأخبار: **It is said that he is rich = He is said to be rich.** «يُقال إنه غني». **She is believed to have left the country.** والأفعال: say، believe، think، know، expect، report، consider.
  en-c2-as-if:
    meaning: "as if / as though مع الماضي غير الواقع"
    intro: |
      **as if / as though** + الماضي لغير الواقع: **He talks as if he were the boss.** «يتكلم كأنه المدير». + الماضي التام للماضي: **She acted as though nothing had happened.** ومع الحال المرجّحة المضارع: **It looks as if it's going to rain.**
  en-c2-concessive-inversion:
    meaning: "التسليم بـ as / though بعد كلمة مقدَّمة"
    intro: |
      صفة أو ظرف أو فعل مقدَّم + **as / though** + الفاعل = «مع أنّ / مهما»: **Much as I like him, I can't trust him. Try as I might, I couldn't open it. Strange as it may seem, it's true.** «مهما بدا غريبًا فهو صحيح».
  en-c2-were-to:
    meaning: "were to وwere it not for"
    intro: |
      **if + الفاعل + were to + الفعل** لافتراض بعيد: **If he were to resign, who would replace him?** و**Were it not for / If it weren't for / But for** = لولا: **Were it not for your help, I would have failed.** «لولا مساعدتك لفشلت».
  en-c2-negative-adverbials:
    meaning: "عبارات النفي الظرفية: under no circumstances، on no account، by no means"
    intro: |
      العبارات التي فيها **no** تقوّي النفي وتسبب القلب في أول الجملة: **Under no circumstances should you open this door.** **on no account، by no means، in no way، at no time.** وفي وسط الجملة لا قلب: **It is by no means easy.**
  en-c2-the-more:
    meaning: "المقارنة المتلازمة: the more …، the more …"
    intro: |
      **the + صيغة المقارنة …، the + صيغة المقارنة …**، كـ«كلما … ازداد …»: **The more you practise, the better you get.** «كلما تدربت أكثر تحسّنت». **The sooner, the better. The older he gets, the less he sleeps.**
  en-c2-reduced-relatives:
    meaning: "جمل الصلة المختصرة"
    intro: |
      قد تحذف جملة الصلة **who / which + be**: **the man sitting there، a book written in 1900، people living abroad.** و-ing للمعلوم، واسم المفعول للمجهول.
  en-c2-pied-piping:
    meaning: "حرف الجر + whom / which في الإنجليزية الرسمية"
    intro: |
      غير رسمي: **the man I spoke to.** ورسمي: حرف الجر + **whom** (للعاقل) / **which** (لغيره): **the man to whom I spoke، the house in which I grew up.**
  en-c2-hedging:
    meaning: "ظروف الموقف: allegedly، arguably، presumably، supposedly"
    intro: |
      ظروف تُظهر موقف الكاتب: **allegedly** (يُزعم، غير مثبت)، **supposedly**، **arguably** (يمكن القول)، **presumably** (يُفترض)، **seemingly**، **admittedly** (أقرّ بأنّ).
  en-c2-formal-connectors:
    meaning: "أدوات ربط شديدة الرسمية: albeit، whereby، thereby، notwithstanding"
    intro: |
      الإنجليزية القانونية والأكاديمية: **albeit** (وإن، قبل صفة أو عبارة)، **whereby** (الذي بموجبه)، **thereby** (وبذلك)، **notwithstanding** (على الرغم من)، **insofar as** (بقدر ما).
  en-c2-ellipsis:
    meaning: "الحذف والاستبدال: to، one، do so"
    intro: |
      تتجنب الإنجليزية التكرار: **to** تنوب عن عبارة فعلية (**I'd like to, but I can't**)، والمساعدات تجيب وحدها (**I can**)، و**one(s)** تنوب عن اسم معدود (**the red one**)، و**do so** الرسمية تنوب عن عبارة فعلية.
    mistakes: ["احتفظ بـ to حين يُحذف الفعل."]
