# Macedonian text of the English course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The basics: "Основите"
  Pronouns and possessives: "Заменки и присвојни"
  The past: "Минатото"
  Obligation and advice: "Обврска и совет"
lessons:
  en-to-be:
    meaning: "глаголот to be"
    intro: |
      **I am** (I'm), **you are** (you're), **he / she / it is** (he's), **we are**, **they are**. Одречно со **not**: **I'm not, she isn't, they aren't**. Прашањата превртуваат: **Are you tired?** Англискиот никогаш не го испушта подметот, за разлика од македонскиот: **It is late.** „Доцна е.“ **It's raining.** „Врне.“
    mistakes: ["Англискиот бара подмет: it."]
  en-articles:
    meaning: "членови"
    intro: |
      **a** пред согласен глас, **an** пред самогласен глас (**a book, an apple, an hour**); **the** за сѐ, пред именката. Без член за општи работи: **I like coffee. Life is beautiful.** Професиите земаат **a**: **She is a doctor.** „Таа е лекарка.“
    mistakes: ["Професијата зема a / an."]
  en-present-simple:
    meaning: "простото сегашно: -s во трето лице"
    intro: |
      Само **he / she / it** земаат **-s**: **she works, he goes**. Прашањата и одречните користат **do / does**: **Do you work? She doesn't work** (без -s по does).
    mistakes: ["He, she, it: -s.", "По does глаголот нема -s."]
  en-present-continuous:
    meaning: "сегашното продолжено: be + -ing"
    intro: |
      **am / is / are + -ing** за сега: **I'm reading.** „Читам (во моментов).“ И за договорени работи: **I'm meeting her tomorrow.** Глаголите на состојба (like, know, want) ретко се во -ing.
  en-pronouns:
    meaning: "подметски и предметски заменки"
    intro: |
      Подмет **I, you, he, she, it, we, they**; предмет **me, you, him, her, it, us, them**: **She loves him. Give it to me.**
  en-possessives:
    meaning: "присвојни придавки"
    intro: |
      **my, your, his, her, its, our, their** се согласуваат со сопственикот: **his mother** „неговата мајка“, **her father** „нејзиниот татко“. Имињата земаат **'s**: **John's car**.
    mistakes: ["Присвојното го следи сопственикот: Mary → her."]
  en-there-is:
    meaning: "there is / there are"
    intro: |
      **There is** + еднина, **there are** + множина — македонското **има**: **There is a bank near here. There are two cats.**
    mistakes: ["Постоење: there is / are."]
  en-prepositions:
    meaning: "in, on, at: место и време"
    intro: |
      **in** внатре, градови, земји, месеци, години; **on** површини, денови, датуми; **at** точки, часови, места на дејност (**at home, at 5**).
  en-can:
    meaning: "can: способност и дозвола"
    intro: |
      **can** + гол глагол, исто за секое лице: **I can swim. Can you help me?** Одречно **can't**; минато **could**.
  en-past-simple:
    meaning: "простото минато: -ed и неправилни глаголи"
    intro: |
      Правилни **-ed**; многу неправилни (**went, had, did, saw, got, made, took, came, said**). Одречни и прашања: **did** + основна форма: **I didn't go. Did you see it?**
    mistakes: ["По did: основната форма."]
  en-future:
    meaning: "идното: will и going to"
    intro: |
      **will**: моментални одлуки, ветувања, предвидувања. **be going to**: планови и видливи знаци. Одречно **won't**.
  en-comparatives:
    meaning: "компаратив и суперлатив"
    intro: |
      Кратки придавки **-er / -est**; долги **more / the most**; **than** „од“. Неправилни: **good → better → best, bad → worse → worst**.
  en-present-perfect:
    meaning: "сегашното перфектно: have + партицип"
    intro: |
      **have / has + минат партицип** — слично на македонското **имам видено**: искуство, незавршен период, новости. Со завршено време: простото минато.
    mistakes: ["Незавршен период: present perfect."]
  en-modals:
    meaning: "must, have to, should"
    intro: |
      **must** (обврска, заклучок), **have to** (надворешна обврска), **should** (совет). **mustn't** = забрането; **don't have to** = не е потребно.
    mistakes: ["mustn't = забрането; don't have to = не е потребно."]
