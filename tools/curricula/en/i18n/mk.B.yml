# Macedonian text of the English course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Conditions and the passive: "Услови и пасив"
  Relative clauses and verbs: "Релативни реченици и глаголи"
  Perfect and continuous tenses: "Перфектни и продолжени времиња"
  Modals and hypotheses: "Модални глаголи и хипотези"
  Reporting and the passive: "Пренесен говор и пасив"
  Linking and word partners: "Сврзување и зборовни парови"
lessons:
  en-conditionals:
    meaning: "условни реченици: if + сегашно / минато"
    intro: |
      Реален: **If it rains, I'll stay home.** Хипотетичен: **If I had money, I would travel.** „Да имав пари, би патувал.“ **If I were you…** Минат нереален: **If I had known, I would have come.**
  en-passive:
    meaning: "пасивот: be + партицип"
    intro: |
      **be + минат партицип**, **by** за вршителот: **The house was built in 1900. English is spoken here.**
  en-relatives:
    meaning: "релативни заменки"
    intro: |
      **who** (луѓе), **which** (работи), **that** (двете); се испушта како предмет: **the book I read**; **whose** = чиј.
  en-gerund-infinitive:
    meaning: "-ing или to + глагол по глагол"
    intro: |
      **-ing** по enjoy, finish, avoid, mind, keep; **to** по want, need, decide, hope; **-ing** по секој предлог.
    mistakes: ["enjoy зема -ing."]
  en-b2-present-perfect-continuous:
    meaning: "сегашното перфектно продолжено"
    intro: |
      **have / has been + -ing**: дејност што почнала во минатото и сè уште трае (или штотуку престанала), со фокус на траењето: **I've been waiting for an hour.** „Чекам веќе еден час.“ **It's been raining all day.** **for** + период, **since** + почетна точка.
    mistakes: ["траење до сега: present perfect (continuous)."]
  en-b2-past-perfect:
    meaning: "минатото перфектно"
    intro: |
      **had + минат партицип**: дејство пред друго минато — како македонското **беше почнал**: **When I arrived, the film had already started.** И во пренесен говор и минати услови: **If I had known…** Скратено **'d**.
  en-b2-future-perfect:
    meaning: "идно продолжено и идно перфектно"
    intro: |
      **will be + -ing**: во тек во иден момент: **This time tomorrow I'll be flying to London.** **will have + партицип**: завршено пред иден момент: **By Friday I'll have finished.** „До петок ќе имам завршено.“
  en-b2-used-to:
    meaning: "used to (минат навик) и be used to (навикнат)"
    intro: |
      **used to + глагол**: минат навик или состојба: **I used to smoke.** „Порано пушев.“ **be / get used to + -ing**: да си / да се навикнеш: **I'm used to waking up early. You'll get used to it.**
    mistakes: ["be used to + -ing."]
  en-b2-must-have:
    meaning: "минати модални за заклучок и критика"
    intro: |
      **модален + have + минат партицип** гледа назад: **must have** (сигурност), **can't have** (невозможност), **might / may / could have** (можност), **should have** (критика, жалење): **He must have forgotten.** „Мора да заборавил.“ **You should have told me.** „Требаше да ми кажеш.“
  en-b2-wish:
    meaning: "желби и жалења: wish, if only"
    intro: |
      **wish / if only** + минато = желба за сегашноста: **I wish I were taller.** „Да бев повисок.“ + минато перфектно = жалење: **I wish I had studied more.** + **would** = сакаш некој да се промени: **I wish you would stop.**
  en-b2-unless:
    meaning: "услови без if: unless, provided, in case, otherwise"
    intro: |
      **unless** = ако не, **as long as / provided (that)** = само ако, **in case** = за секој случај, **otherwise** = инаку: **I'll go unless it rains. Take an umbrella in case it rains.** Без **will** во условот.
  en-b2-reported-speech:
    meaning: "пренесен говор: поместување назад"
    intro: |
      По минат глагол на кажување времињата се поместуваат назад: will → would, can → could, present perfect → past perfect. Пренесените прашања имаат ред на изјава: **She asked me where I lived.** Барања: **He told me to wait.**
  en-b2-say-tell:
    meaning: "say или tell"
    intro: |
      **tell** + личноста: **He told me the truth.** **say** без директна личност (**say something to someone**): **She said she was tired.** Цврсто: **tell the truth / a lie / a story**.
    mistakes: ["tell + личност; say + to + личност."]
  en-b2-passive-advanced:
    meaning: "пасивот во продолжени и перфектни времиња"
    intro: |
      Пасивот работи во секое време: **is being repaired, has been sold, will be finished, must be done.**
  en-b2-causative:
    meaning: "каузативно have / get something done"
    intro: |
      **have / get + предмет + минат партицип**: некој друг го прави за тебе: **I had my hair cut.** „Се потшишав (кај бербер).“ **We're getting the house painted.** И за лоши искуства: **He had his phone stolen.** „Му го украдоа телефонот.“
  en-b2-although-despite:
    meaning: "спротивност: although, despite, in spite of, however, whereas"
    intro: |
      **although / though / even though** + реченица; **despite / in spite of** + именка или -ing; **however** меѓу реченици; **whereas** за спротивност меѓу два факта. Никогаш ~~despite of~~.
    mistakes: ["despite нема of (in spite of има)."]
  en-b2-phrasal-verbs:
    meaning: "чести фразални глаголи"
    intro: |
      Глагол + честичка со ново значење: **give up, find out, look after, turn down, put off, run out of, carry on, figure out, take off, get over.** Заменски предмет оди во средината: **give it up**.
  en-b2-make-do:
    meaning: "make или do"
    intro: |
      **make** = создава, произведува, предизвикува: **make a mistake, a decision, money, friends, an effort, sense**. **do** = задачи и дејности: **do homework, the dishes, business, exercise, a favour, your best**.
  en-b2-so-such:
    meaning: "so и such за нагласување"
    intro: |
      **so** + придавка / прилог; **such (a / an)** + (придавка +) именка; **so / such … that** за последица: **It was so cold that we stayed home. It was such a long day.**
