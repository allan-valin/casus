# German text of the English course, C1–C2 — translated by AI (Claude) from the English (2026-10-20); the false-friends lesson lists German traps instead of Portuguese ones
topics:
  Emphasis and inversion: "Hervorhebung und Inversion"
  Hypothesis and formality: "Hypothese und Förmlichkeit"
  Advanced clauses: "Fortgeschrittene Nebensätze"
  Register and Brazilian traps: "Register und falsche Freunde"
  Unreal and concessive structures: "Irreale und konzessive Strukturen"
  Refined syntax: "Verfeinerte Syntax"
  Stance and register: "Haltung und Register"
lessons:
  en-c1-inversion:
    meaning: "Inversion nach verneinenden und einschränkenden Adverbien"
    intro: |
      Nach einer verneinenden oder einschränkenden Adverbiale am Satzanfang (**never, rarely, seldom, hardly, little, nowhere, not only, no sooner, only then**) steht das Hilfsverb vor dem Subjekt: **Never have I seen such a mess. Not only did he lie, he also stole.**
  en-c1-cleft:
    meaning: "Spaltsätze"
    intro: |
      Um einen Teil hervorzuheben: **What I need is a holiday.** „Was ich brauche, ist Urlaub.“ **All I want is some peace. It was Tom who broke it.**
  en-c1-emphatic-do:
    meaning: "betontes do"
    intro: |
      **do / does / did** in einem bejahten Satz betont das Verb — widersprechend, beharrend oder bestätigend: **I do like it!** „Ich mag es doch!“ **She did tell you. Do sit down.**
  en-c1-so-do-i:
    meaning: "kurze Zusätze: so do I, neither do I, I hope so"
    intro: |
      Kurz zustimmen: **so** + Hilfsverb + Subjekt; **neither / nor** + Hilfsverb + Subjekt; das Hilfsverb richtet sich nach dem ersten Satz: **So am I.** „Ich auch.“ **Neither can I.** „Ich auch nicht.“ **So did we.** Außerdem **I think so, I hope not**.
  en-c1-mixed-conditionals:
    meaning: "gemischte Bedingungssätze"
    intro: |
      Vergangene Bedingung, gegenwärtige Folge: **If I had studied medicine, I would be a doctor now.** Gegenwärtige Bedingung, vergangene Folge: **If I were braver, I would have said something.**
  en-c1-subjunctive:
    meaning: "Konjunktiv und irreale Vergangenheit: suggest that, it's time, would rather"
    intro: |
      Nach **suggest, insist, recommend, demand, it's essential that**: das reine Verb (**I suggest he go. It's essential that she be there**). **It's time** + Vergangenheit: **It's time we left.** **would rather** + Vergangenheit: **I'd rather you didn't.** „Mir wäre lieber, du tätest es nicht.“
  en-c1-inverted-conditionals:
    meaning: "Bedingungen ohne if: should, were, had vorn"
    intro: |
      Förmliche Bedingungen können **if** weglassen und invertieren — wie im Deutschen *Solltest du…*: **Should you need help, call me. Were I you, I'd accept. Had I known, I would have come.**
  en-c1-modal-nuance:
    meaning: "Modalnuancen: needn't have, supposed to, bound to, likely to"
    intro: |
      **needn't have** + Partizip (getan, aber unnötig) gegenüber **didn't need to**; **be supposed to** (erwartet, vereinbart), **be bound to** (sicher), **be likely to** (wahrscheinlich), **be due to** (planmäßig).
  en-c1-participle-clauses:
    meaning: "Partizipialsätze"
    intro: |
      Partizipialsätze ersetzen Konjunktion + Satz: **Having finished the report, she went home. Not knowing what to do, I called my mother. Built in 1900, the house needs repairs.** Das Subjekt muss das des Hauptsatzes sein.
  en-c1-whatever:
    meaning: "-ever-Wörter: whatever, whoever, wherever, whenever"
    intro: |
      **whatever, whoever, wherever, whenever, whichever** = „egal was / wer…“: **Do whatever you want. Whoever wins gets the prize. Call me whenever you like.**
  en-c1-dependent-prepositions:
    meaning: "Präpositionen nach Verben und Adjektiven"
    intro: |
      Feste Präpositionen nach Verben und Adjektiven — oft anders als im Deutschen: **depend on** (abhängen *von*), **married to** (verheiratet *mit*), **dream of, think about, arrive in / at, good at, interested in, afraid of, responsible for, proud of, consist of, insist on.**
  en-c1-false-friends:
    meaning: "falsche Freunde: actually, eventually, become und andere"
    intro: |
      Wörter, die deutsch aussehen, es aber nicht sind: **actually** = tatsächlich (dt. aktuell = currently); **eventually** = schließlich (dt. eventuell = possibly); **become** = werden (dt. bekommen = get); **gift** = Geschenk (dt. Gift = poison); **also** = auch (dt. also = so); **sensible** = vernünftig (dt. sensibel = sensitive); **chef** = Koch (dt. Chef = boss); **handy** = praktisch (dt. Handy = mobile phone). Im englischen Original stehen hier die Fallen für Portugiesischsprechende.
  en-c1-formal-linkers:
    meaning: "förmliche Konnektoren"
    intro: |
      Förmliches Schreiben: **moreover, furthermore** (Ergänzung), **therefore, thus, hence, consequently** (Folge), **nonetheless, nevertheless** (Gegensatz), **indeed** (Nachdruck). Gesprochen bevorzugt man **also, so, but**.
  en-c1-impersonal-passive:
    meaning: "unpersönliches Passiv: it is said that, he is thought to"
    intro: |
      Unpersönliches Berichten, typisch für Nachrichten: **It is said that he is rich = He is said to be rich.** „Er soll reich sein.“ **She is believed to have left the country.** Verben: say, believe, think, know, expect, report, consider.
  en-c2-as-if:
    meaning: "as if / as though mit irrealer Vergangenheit"
    intro: |
      **as if / as though** + Vergangenheit für Irreales: **He talks as if he were the boss.** + Past Perfect für die Vergangenheit: **She acted as though nothing had happened.** Bei wahrscheinlicher Lage das Präsens: **It looks as if it's going to rain.**
  en-c2-concessive-inversion:
    meaning: "Einräumung mit as / though nach vorangestelltem Wort"
    intro: |
      Ein vorangestelltes Adjektiv, Adverb oder Verb + **as / though** + Subjekt = „obwohl / so sehr auch“: **Much as I like him, I can't trust him. Try as I might, I couldn't open it. Strange as it may seem, it's true.** „So seltsam es scheinen mag, es stimmt.“
  en-c2-were-to:
    meaning: "were to und were it not for"
    intro: |
      **if + Subjekt + were to + Verb** für eine ferne Hypothese: **If he were to resign, who would replace him?** **Were it not for / If it weren't for / But for** = ohne: **Were it not for your help, I would have failed.**
  en-c2-negative-adverbials:
    meaning: "verneinende Adverbialphrasen: under no circumstances, on no account, by no means"
    intro: |
      Phrasen mit **no** verstärken die Verneinung und lösen am Satzanfang Inversion aus: **Under no circumstances should you open this door.** **on no account, by no means, in no way, at no time.** In der Satzmitte keine Inversion: **It is by no means easy.**
  en-c2-the-more:
    meaning: "korrelative Komparative: the more …, the more …"
    intro: |
      **the + Komparativ …, the + Komparativ …** — deutsch *je … desto*: **The more you practise, the better you get. The sooner, the better. The older he gets, the less he sleeps.**
  en-c2-reduced-relatives:
    meaning: "verkürzte Relativsätze"
    intro: |
      Ein Relativsatz kann **who / which + be** weglassen: **the man sitting there, a book written in 1900, people living abroad.** -ing ist aktiv, das Partizip passiv.
  en-c2-pied-piping:
    meaning: "Präposition + whom / which im förmlichen Englisch"
    intro: |
      Umgangssprachlich: **the man I spoke to.** Förmlich: Präposition + **whom** (Personen) / **which** (Sachen): **the man to whom I spoke, the house in which I grew up.**
  en-c2-hedging:
    meaning: "Haltungsadverbien: allegedly, arguably, presumably, supposedly"
    intro: |
      Adverbien, die die Haltung des Schreibenden zeigen: **allegedly** (angeblich, nicht bewiesen), **supposedly**, **arguably** (man kann argumentieren), **presumably** (vermutlich), **seemingly**, **admittedly** (zugegebenermaßen).
  en-c2-formal-connectors:
    meaning: "sehr förmliche Konnektoren: albeit, whereby, thereby, notwithstanding"
    intro: |
      Juristisches und akademisches Englisch: **albeit** (wenn auch, vor Adjektiv oder Phrase), **whereby** (wodurch), **thereby** (dadurch), **notwithstanding** (ungeachtet), **insofar as** (insofern als).
  en-c2-ellipsis:
    meaning: "Ellipse und Ersatz: to, one, do so"
    intro: |
      Englisch vermeidet Wiederholung: **to** steht für eine Verbalphrase (**I'd like to, but I can't**), Hilfsverben antworten allein (**I can**), **one(s)** ersetzt ein zählbares Nomen (**the red one**), förmliches **do so** ersetzt eine Verbalphrase.
    mistakes: ["to bleibt, wenn das Verb wegfällt."]
