# Arabic text of the English course, B1–B2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  Conditions and the passive: "الشرط والمبني للمجهول"
  Relative clauses and verbs: "جمل الصلة والأفعال"
  Perfect and continuous tenses: "الأزمنة التامة والمستمرة"
  Modals and hypotheses: "الأفعال الناقصة والافتراض"
  Reporting and the passive: "الكلام المنقول والمجهول"
  Linking and word partners: "الربط والمتلازمات"
lessons:
  en-conditionals:
    meaning: "الجمل الشرطية: if + المضارع / الماضي"
    intro: |
      الممكن: **If it rains, I'll stay home.** «إن أمطرت بقيت في البيت». والافتراضي: **If I had money, I would travel.** «لو كان عندي مال لسافرت». **If I were you…** والماضي غير الواقع: **If I had known, I would have come.**
  en-passive:
    meaning: "المبني للمجهول: be + اسم المفعول"
    intro: |
      **be + اسم المفعول**، و**by** للفاعل: **The house was built in 1900. English is spoken here.**
  en-relatives:
    meaning: "أسماء الموصول"
    intro: |
      **who** (للعاقل)، **which** (لغير العاقل)، **that** (لكليهما)؛ وتُحذف مفعولًا: **the book I read**؛ و**whose** = الذي … ـه.
  en-gerund-infinitive:
    meaning: "-ing أم to + الفعل بعد فعل"
    intro: |
      **-ing** بعد enjoy، finish، avoid، mind، keep؛ و**to** بعد want، need، decide، hope؛ و**-ing** بعد كل حرف جر.
    mistakes: ["enjoy تأخذ -ing."]
  en-b2-present-perfect-continuous:
    meaning: "المضارع التام المستمر"
    intro: |
      **have / has been + -ing**: نشاط بدأ في الماضي وما زال مستمرًا (أو توقف للتو)، مع التركيز على المدة: **I've been waiting for an hour.** «أنتظر منذ ساعة». **It's been raining all day.** و**for** + مدة، و**since** + نقطة بداية.
    mistakes: ["المدة حتى الآن: المضارع التام (المستمر)."]
  en-b2-past-perfect:
    meaning: "الماضي التام"
    intro: |
      **had + اسم المفعول**: فعل سابق لفعل ماضٍ آخر، كـ«كان قد»: **When I arrived, the film had already started.** وكذلك في الكلام المنقول والشرط الماضي: **If I had known…** والمختصر **'d**.
  en-b2-future-perfect:
    meaning: "المستقبل المستمر والمستقبل التام"
    intro: |
      **will be + -ing**: جارٍ في لحظة مستقبلية: **This time tomorrow I'll be flying to London.** و**will have + اسم المفعول**: منتهٍ قبل لحظة مستقبلية: **By Friday I'll have finished.** «بحلول الجمعة سأكون قد أنهيت».
  en-b2-used-to:
    meaning: "used to (عادة ماضية) وbe used to (معتاد)"
    intro: |
      **used to + الفعل**: عادة أو حالة ماضية، كـ«كان يفعل»: **I used to smoke.** «كنت أدخّن». و**be / get used to + -ing**: أن تكون / تصير معتادًا: **I'm used to waking up early. You'll get used to it.**
    mistakes: ["be used to + -ing."]
  en-b2-must-have:
    meaning: "الأفعال الناقصة الماضية للاستنتاج والنقد"
    intro: |
      **فعل ناقص + have + اسم المفعول** ينظر إلى الوراء: **must have** (يقين)، **can't have** (استحالة)، **might / may / could have** (احتمال)، **should have** (نقد، ندم): **He must have forgotten.** «لا بد أنه نسي». **You should have told me.** «كان عليك أن تخبرني».
  en-b2-wish:
    meaning: "التمني والندم: wish، if only"
    intro: |
      **wish / if only** + الماضي = تمنٍّ عن الحاضر: **I wish I were taller.** «ليتني كنت أطول». + الماضي التام = ندم: **I wish I had studied more.** + **would** = رغبة في أن يتغير أحد: **I wish you would stop.**
  en-b2-unless:
    meaning: "شرط بلا if: unless، provided، in case، otherwise"
    intro: |
      **unless** = إن لم، **as long as / provided (that)** = بشرط أن، **in case** = احتياطًا، **otherwise** = وإلا: **I'll go unless it rains. Take an umbrella in case it rains.** ولا **will** في جملة الشرط.
  en-b2-reported-speech:
    meaning: "الكلام المنقول: تراجع الأزمنة"
    intro: |
      بعد فعل قول ماضٍ تتراجع الأزمنة: will → would، can → could، المضارع التام → الماضي التام. والأسئلة المنقولة بترتيب الخبر: **She asked me where I lived.** والطلبات: **He told me to wait.**
  en-b2-say-tell:
    meaning: "say أم tell"
    intro: |
      **tell** + الشخص: **He told me the truth.** و**say** بلا شخص مباشر (**say something to someone**): **She said she was tired.** وثابت: **tell the truth / a lie / a story**.
    mistakes: ["tell + الشخص؛ say + to + الشخص."]
  en-b2-passive-advanced:
    meaning: "المجهول في الأزمنة المستمرة والتامة"
    intro: |
      يعمل المجهول في كل زمن: **is being repaired، has been sold، will be finished، must be done.**
  en-b2-causative:
    meaning: "have / get something done السببية"
    intro: |
      **have / get + المفعول + اسم المفعول**: يفعله غيرك لك: **I had my hair cut.** «قصصت شعري (عند الحلاق)». **We're getting the house painted.** وللتجارب السيئة أيضًا: **He had his phone stolen.** «سُرق هاتفه».
  en-b2-although-despite:
    meaning: "الاستدراك: although، despite، in spite of، however، whereas"
    intro: |
      **although / though / even though** + جملة؛ و**despite / in spite of** + اسم أو -ing؛ و**however** بين الجمل؛ و**whereas** للمقابلة بين واقعتين. ولا ~~despite of~~ أبدًا.
    mistakes: ["despite بلا of (وin spite of بها)."]
  en-b2-phrasal-verbs:
    meaning: "أفعال مركبة شائعة"
    intro: |
      فعل + أداة بمعنى جديد: **give up، find out، look after، turn down، put off، run out of، carry on، figure out، take off، get over.** والمفعول الضمير يأتي في الوسط: **give it up**.
  en-b2-make-do:
    meaning: "make أم do"
    intro: |
      **make** = صنع، أنتج، سبّب: **make a mistake، a decision، money، friends، an effort، sense**. و**do** = المهام والأنشطة: **do homework، the dishes، business، exercise، a favour، your best**.
  en-b2-so-such:
    meaning: "so وsuch للتوكيد"
    intro: |
      **so** + صفة / ظرف؛ و**such (a / an)** + (صفة +) اسم؛ و**so / such … that** للنتيجة: **It was so cold that we stayed home. It was such a long day.**
