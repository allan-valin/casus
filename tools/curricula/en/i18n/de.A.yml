# German text of the English course, A1–A2 — translated by AI (Claude) from the English (2026-10-20)
topics:
  The basics: "Die Grundlagen"
  Pronouns and possessives: "Pronomen und Possessive"
  The past: "Die Vergangenheit"
  Obligation and advice: "Pflicht und Rat"
lessons:
  en-to-be:
    meaning: "das Verb to be"
    intro: |
      **I am** (I'm), **you are** (you're), **he / she / it is** (he's), **we are**, **they are**. Verneint mit **not**: **I'm not, she isn't, they aren't**. Fragen invertieren: **Are you tired?** Englisch lässt das Subjekt nie weg: **It is late. It's raining.**
    mistakes: ["Englisch braucht ein Subjekt: it."]
  en-articles:
    meaning: "Artikel"
    intro: |
      **a** vor Konsonantenlaut, **an** vor Vokallaut (**a book, an apple, an hour**); **the** für alles (kein Genus). Kein Artikel bei Allgemeinem: **I like coffee. Life is beautiful.** Berufe nehmen **a** — anders als im Deutschen: **She is a doctor.** „Sie ist Ärztin.“
    mistakes: ["Ein Beruf nimmt a / an."]
  en-present-simple:
    meaning: "das Simple Present: -s in der dritten Person"
    intro: |
      Nur **he / she / it** nehmen **-s**: **she works, he goes**. Fragen und Verneinungen mit **do / does**: **Do you work? She doesn't work** (kein -s nach does).
    mistakes: ["He, she, it: -s.", "Nach does hat das Verb kein -s."]
  en-present-continuous:
    meaning: "das Present Continuous: be + -ing"
    intro: |
      **am / is / are + -ing** für jetzt: **I'm reading.** „Ich lese gerade.“ Auch für Verabredungen: **I'm meeting her tomorrow.** Zustandsverben (like, know, want) stehen selten in der -ing-Form.
  en-pronouns:
    meaning: "Subjekt- und Objektpronomen"
    intro: |
      Subjekt **I, you, he, she, it, we, they**; Objekt **me, you, him, her, it, us, them**: **She loves him. Give it to me.**
  en-possessives:
    meaning: "Possessivbegleiter"
    intro: |
      **my, your, his, her, its, our, their** richten sich nach dem Besitzer: **his mother, her father**. Namen nehmen **'s**: **John's car**.
    mistakes: ["Das Possessiv folgt dem Besitzer: Mary → her."]
  en-there-is:
    meaning: "there is / there are"
    intro: |
      **There is** + Singular, **there are** + Plural — deutsch *es gibt*: **There is a bank near here. There are two cats.**
    mistakes: ["Existenz: there is / are."]
  en-prepositions:
    meaning: "in, on, at: Ort und Zeit"
    intro: |
      **in** innen, Städte, Länder, Monate, Jahre; **on** Flächen, Tage, Daten; **at** Punkte, Uhrzeiten, Orte einer Tätigkeit (**at home, at 5**).
  en-can:
    meaning: "can: Fähigkeit und Erlaubnis"
    intro: |
      **can** + reines Verb, gleich in jeder Person: **I can swim. Can you help me?** Verneint **can't**; Vergangenheit **could**.
  en-past-simple:
    meaning: "das Simple Past: -ed und unregelmäßige Verben"
    intro: |
      Regelmäßig **-ed**; viele unregelmäßige (**went, had, did, saw, got, made, took, came, said**). Verneinungen und Fragen: **did** + Grundform: **I didn't go. Did you see it?**
    mistakes: ["Nach did: die Grundform."]
  en-future:
    meaning: "das Futur: will und going to"
    intro: |
      **will**: spontane Entscheidungen, Versprechen, Vorhersagen. **be going to**: Pläne und sichtbare Anzeichen. Verneint **won't**.
  en-comparatives:
    meaning: "Komparativ und Superlativ"
    intro: |
      Kurze Adjektive **-er / -est**; lange **more / the most**; **than** „als“. Unregelmäßig: **good → better → best, bad → worse → worst**.
  en-present-perfect:
    meaning: "das Present Perfect: have + Partizip"
    intro: |
      **have / has + Partizip Perfekt**: Erfahrung, nicht abgeschlossener Zeitraum, Neuigkeiten. Mit abgeschlossener Zeitangabe: das Simple Past — anders als das deutsche Perfekt: **I saw him yesterday**, nicht ~~I have seen him yesterday~~.
    mistakes: ["Nicht abgeschlossener Zeitraum: Present Perfect."]
  en-modals:
    meaning: "must, have to, should"
    intro: |
      **must** (Pflicht, Schlussfolgerung), **have to** (äußere Pflicht), **should** (Rat). **mustn't** = verboten; **don't have to** = nicht nötig — Vorsicht: deutsch *muss nicht* ist **don't have to**, nicht mustn't.
    mistakes: ["mustn't = verboten; don't have to = nicht nötig."]
