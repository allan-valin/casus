# Macedonian text of the English course, C1–C2 — translated by AI (Claude) from the English (2026-10-20); the false-friends lesson lists Macedonian traps instead of Portuguese ones
topics:
  Emphasis and inversion: "Нагласување и инверзија"
  Hypothesis and formality: "Хипотеза и официјалност"
  Advanced clauses: "Напредни зависни реченици"
  Register and Brazilian traps: "Регистар и лажни пријатели"
  Unreal and concessive structures: "Нереални и допусни структури"
  Refined syntax: "Пофина синтакса"
  Stance and register: "Став и регистар"
lessons:
  en-c1-inversion:
    meaning: "инверзија по одречни и ограничувачки прилози"
    intro: |
      По одречна или ограничувачка прилошка определба на почетокот (**never, rarely, seldom, hardly, little, nowhere, not only, no sooner, only then**) помошниот глагол оди пред подметот: **Never have I seen such a mess.** „Никогаш не сум видел таков неред.“ **Not only did he lie, he also stole.**
  en-c1-cleft:
    meaning: "расцепени реченици"
    intro: |
      За да се нагласи еден дел: **What I need is a holiday.** „Она што ми треба е одмор.“ **All I want is some peace. It was Tom who broke it.**
  en-c1-emphatic-do:
    meaning: "нагласено do"
    intro: |
      **do / does / did** во потврдна реченица го нагласува глаголот — спротивставувајќи, инсистирајќи или потврдувајќи: **I do like it!** „Па ми се допаѓа!“ **She did tell you. Do sit down.**
  en-c1-so-do-i:
    meaning: "кратки додатоци: so do I, neither do I, I hope so"
    intro: |
      За кратко согласување: **so** + помошен глагол + подмет; **neither / nor** + помошен глагол + подмет; помошниот се совпаѓа со првата реченица: **So am I.** „И јас.“ **Neither can I.** „Ни јас.“ **So did we.** Исто така **I think so, I hope not**.
  en-c1-mixed-conditionals:
    meaning: "мешани условни реченици"
    intro: |
      Минат услов, сегашна последица: **If I had studied medicine, I would be a doctor now.** Сегашен услов, минато последица: **If I were braver, I would have said something.**
  en-c1-subjunctive:
    meaning: "субјунктив и нереално минато: suggest that, it's time, would rather"
    intro: |
      По **suggest, insist, recommend, demand, it's essential that**: голиот глагол (**I suggest he go. It's essential that she be there**). **It's time** + минато: **It's time we left.** „Време е да си одиме.“ **would rather** + минато: **I'd rather you didn't.**
  en-c1-inverted-conditionals:
    meaning: "услови без if: should, were, had напред"
    intro: |
      Официјалните услови можат да го испуштат **if** и да превртат: **Should you need help, call me. Were I you, I'd accept. Had I known, I would have come.**
  en-c1-modal-nuance:
    meaning: "модални нијанси: needn't have, supposed to, bound to, likely to"
    intro: |
      **needn't have** + партицип (направено, но непотребно) наспроти **didn't need to**; **be supposed to** (очекувано, договорено), **be bound to** (сигурно), **be likely to** (веројатно), **be due to** (по распоред).
  en-c1-participle-clauses:
    meaning: "партиципни реченици"
    intro: |
      Партиципните реченици заменуваат сврзник + реченица: **Having finished the report, she went home. Not knowing what to do, I called my mother.** „Не знаејќи што да правам, ѝ се јавив на мајка ми.“ **Built in 1900, the house needs repairs.** Подметот мора да е тој на главната реченица.
  en-c1-whatever:
    meaning: "зборови на -ever: whatever, whoever, wherever, whenever"
    intro: |
      **whatever, whoever, wherever, whenever, whichever** = „што и да / кој и да…“: **Do whatever you want. Whoever wins gets the prize. Call me whenever you like.**
  en-c1-dependent-prepositions:
    meaning: "предлози по глаголи и придавки"
    intro: |
      Фиксни предлози по глаголи и придавки — често различни од македонските: **depend on** (зависи *од*), **married to** (оженет *со*), **dream of, think about, arrive in / at, good at, interested in, afraid of, responsible for, proud of, consist of, insist on.**
  en-c1-false-friends:
    meaning: "лажни пријатели: actually, eventually, magazine и други"
    intro: |
      Зборови што личат на македонски, а не се: **actually** = всушност (мк. актуелно = current); **eventually** = на крајот (мк. евентуално = possibly); **magazine** = списание (мк. магазин = shop, store); **sympathetic** = сочувствителен (мк. симпатичен = nice, likeable); **accurate** = точен (мк. акуратен = tidy); **fabric** = ткаенина (мк. фабрика = factory); **conductor** = диригент, кондуктер (мк. кондуктер, но и *спроводник*). Во англискиот оригинал тука стојат стапиците за говорителите на португалски.
  en-c1-formal-linkers:
    meaning: "официјални сврзници"
    intro: |
      Официјално пишување: **moreover, furthermore** (додавање), **therefore, thus, hence, consequently** (последица), **nonetheless, nevertheless** (спротивност), **indeed** (нагласување). Говорот претпочита **also, so, but**.
  en-c1-impersonal-passive:
    meaning: "безличен пасив: it is said that, he is thought to"
    intro: |
      Безлично известување, типично за вестите: **It is said that he is rich = He is said to be rich.** „Се вели дека е богат.“ **She is believed to have left the country.** Глаголи: say, believe, think, know, expect, report, consider.
  en-c2-as-if:
    meaning: "as if / as though со нереално минато"
    intro: |
      **as if / as though** + минато за нешто нереално: **He talks as if he were the boss.** „Зборува како да е шеф.“ + минато перфектно за минатото: **She acted as though nothing had happened.** Со веројатна ситуација, сегашно: **It looks as if it's going to rain.**
  en-c2-concessive-inversion:
    meaning: "допусност со as / though по истакнат збор"
    intro: |
      Истакната придавка, прилог или глагол + **as / though** + подмет = „иако / колку и да“: **Much as I like him, I can't trust him. Try as I might, I couldn't open it. Strange as it may seem, it's true.** „Колку и да изгледа чудно, вистина е.“
  en-c2-were-to:
    meaning: "were to и were it not for"
    intro: |
      **if + подмет + were to + глагол** за далечна хипотеза: **If he were to resign, who would replace him?** **Were it not for / If it weren't for / But for** = да не беше: **Were it not for your help, I would have failed.** „Да не беше твојата помош, ќе пропаднев.“
  en-c2-negative-adverbials:
    meaning: "одречни прилошки изрази: under no circumstances, on no account, by no means"
    intro: |
      Изразите со **no** ја засилуваат негацијата и предизвикуваат инверзија на почетокот: **Under no circumstances should you open this door.** **on no account, by no means, in no way, at no time.** Во средина на реченицата, без инверзија: **It is by no means easy.**
  en-c2-the-more:
    meaning: "корелативни компаративи: the more …, the more …"
    intro: |
      **the + компаратив …, the + компаратив …** — македонското **колку повеќе …, толку повеќе …**: **The more you practise, the better you get. The sooner, the better. The older he gets, the less he sleeps.**
  en-c2-reduced-relatives:
    meaning: "скратени релативни реченици"
    intro: |
      Релативната реченица може да ги испушти **who / which + be**: **the man sitting there, a book written in 1900, people living abroad.** -ing е активно, партиципот пасивен.
  en-c2-pied-piping:
    meaning: "предлог + whom / which во официјалниот англиски"
    intro: |
      Неформално: **the man I spoke to.** Официјално: предлог + **whom** (луѓе) / **which** (работи): **the man to whom I spoke, the house in which I grew up.**
  en-c2-hedging:
    meaning: "прилози на став: allegedly, arguably, presumably, supposedly"
    intro: |
      Прилози што го покажуваат ставот на пишувачот: **allegedly** (наводно, недокажано), **supposedly**, **arguably** (може да се тврди), **presumably** (веројатно), **seemingly**, **admittedly** (признавам дека).
  en-c2-formal-connectors:
    meaning: "многу официјални сврзници: albeit, whereby, thereby, notwithstanding"
    intro: |
      Правен и академски англиски: **albeit** (иако, пред придавка или израз), **whereby** (со што), **thereby** (со тоа), **notwithstanding** (и покрај), **insofar as** (доколку).
  en-c2-ellipsis:
    meaning: "елипса и замена: to, one, do so"
    intro: |
      Англискиот избегнува повторување: **to** стои наместо глаголски израз (**I'd like to, but I can't**), помошните одговараат сами (**I can**), **one(s)** заменува броива именка (**the red one**), официјалното **do so** заменува глаголски израз.
    mistakes: ["to останува кога глаголот е испуштен."]
