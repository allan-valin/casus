  - id: en-b2-so-such
    title: so tired, such a long day
    meaning: {en: "so and such for emphasis", pt: "so e such para intensificar"}
    intro:
      pt: |
        **so** + adjetivo ou advérbio: **I'm so tired. He drives so fast.** **such (a / an)** + (adjetivo +) substantivo: **It was such a long day. They're such nice people.** Com **that** para a consequência: **It was so cold that we stayed home.** O erro do brasileiro: ~~so a long day~~, ~~such tired~~.
      en: |
        **so** + adjective / adverb; **such (a / an)** + (adjective +) noun; **so / such … that** for a result: **It was so cold that we stayed home. It was such a long day.**
    examples:
    - ["I'm so tired.", "Estou tão cansado.", "Estou tão cansado.", "so"]
    - ["It was such a long day.", "Foi um dia tão longo.", "Foi um dia tão longo.", "such"]
    - ["It was so cold that we stayed home.", "Estava tão frio que ficamos em casa.", "Estava tão frio que ficamos em casa.", "so"]
    match:
    - {seq: [{word: [so]}, {pos: [adj], not: {pos: [noun, verb]}}], gap: 0}
    - {seq: [{word: [such]}, {word: [a, an]}], gap: 0}
    pool: [so, such, too, very]
