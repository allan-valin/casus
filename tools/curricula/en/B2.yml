    - {seq: [{word: [made, did]}, {word: [mistake, mistakes, decision, effort, progress, money, homework, favour, favor, research, business, exercise, damage, harm, sense, noise, friends, difference, choice, deal, best, dishes, laundry, shopping, mess, fun, sure, job, plans, call, joke, bed, breakfast, dinner, lunch, coffee, wish, speech, promise, work]}], near: 2, gap: 0, pool: [made, did]}
    - {seq: [{word: [makes, does]}, {word: [mistake, mistakes, decision, effort, progress, money, homework, favour, favor, research, business, exercise, damage, harm, sense, noise, friends, difference, choice, deal, best, dishes, laundry, shopping, mess, fun, sure, job, plans, call, joke, bed, breakfast, dinner, lunch, coffee, wish, speech, promise, work]}], near: 2, gap: 0, pool: [makes, does]}
